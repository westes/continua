# Dev compose file — runs the Vite dev server in a container with the repo
# bind-mounted, so edits on disk hot-reload live. Not used in production;
# see docker-compose.yml for the real build/deploy path.
services:
  continua-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Same uid as the host user, so files written into the bind mount (.git
    # included) stay owned by them. Never run this service as root.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      HOME: /tmp
    container_name: continua-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
