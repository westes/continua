  # November — 11/12 of the pre-1955 pull. All Saints' own propers were
  # backfilled this month (see all-saints-collect.yml). New exclusion
  # categories this month: All Souls' Day (Nov 2) is a fundamentally
  # different liturgical genre -- the Office of the Dead, not a saint's
  # feast at all, no Common-of-Saints structure to fall back on -- out of
  # scope the same way this app doesn't model the Requiem/funeral rite
  # anywhere else. Nov 3-7 are pure All-Saints-octave continuations (no
  # named saint). Ss. Four Crowned Martyrs (Nov 8, the octave's own final
  # day) hit the same unmodeled-octave gap as several saints in August/
  # September. The Dedication of the Basilica of the Most Holy Savior
  # (Nov 9, i.e. the Lateran) and the Presentation of the BVM (Nov 21,
  # itself a monastic-calendar-only addition) were also excluded here at
  # first, each under a stale "fixed Lord's/BVM feast, not modeled" note
  # -- wrong, corrected 2026-08: both have real, complete content -- see
  # dedication-of-the-basilica-of-the-most-holy-savior.yml and
  # presentation-of-the-bvm.yml's own headers. Added below. Its
  # secondary, St. Theodore, is still excluded -- now blocked by the same
  # real octave/subordination-rendering gap as St. Clare et al. in
  # August, not by the Dedication itself being unmodeled (her own
  # embedded `[Commemoratio 5]` block even carries St. Theodore's real
  # collect already, ready to use once that mechanism exists). The
  # Nov 18 Dedication of the Basilicas of Ss. Peter and Paul was already
  # kept in scope (it's about the Apostles, not the Lord), same as the
  # Commemoration of St. Paul and the two Chair-of-Peter feasts.
  #
  # Three monastic-calendar-specific reassignments this month, the most
  # of any month so far: St. Emilian (Nov 12) displaces St. Martin I,
  # Pope, who moves to Nov 14; St. Odo (Nov 19) is added outright,
  # demoting St. Pontian; St. Silvester, Abbot (Nov 26) displaces St.
  # Peter of Alexandria. Plus All Saints of the Benedictine Order (Nov
  # 13, Duplex II. classis) -- absent from the base table entirely, one
  # of the highest-ranked monastic-only additions in this whole pull.
  #
  # Also notable: St. Clement (Nov 23) transferring forward into St.
  # Chrysogonus's day (Nov 24) whenever Nov 23 falls on a Sunday is this
  # pull's first *single-day* transfer-plus-collision case (unlike
  # August's Finding-of-St.-Stephen situation, which needed an unmodeled
  # multi-day skip) -- this app's existing transfer machinery handles it
  # correctly; see tests/calendar/november-sanctoral.test.ts.
  "11-01": [all-saints]
