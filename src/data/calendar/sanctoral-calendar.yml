  # August — 8/12 of the pre-1955 pull. Four pre-existing entries from
  # before this pull initiative (vigil-of-st-lawrence, st-lawrence,
  # assumption, st-augustine) got their propers backfilled this month; see
  # their own files. A genuinely new wrinkle this month: several dates
  # have a real, named secondary saint permanently subordinate to a
  # fixed, non-movable *octave* day (Lawrence's own Aug 10-17 octave, the
  # Assumption's Aug 15-22 octave) or to the fixed Transfiguration (Aug
  # 6) -- octaves and fixed Lord's feasts aren't modeled by this app (a
  # known, explicitly deferred gap), so unlike the "genuinely unwinnable
  # stub" pattern used elsewhere (where both competitors ARE modeled and
  # the engine can correctly show the subordination), these can't be
  # represented without incorrectly letting them win outright. Excluded
  # entirely rather than guessed at: Ss. Xystus/Felicissimus/Agapitus
  # (Aug 6, under the Transfiguration), Ss. Tiburtius and Susanna (Aug
  # 11), St. Clare (Aug 12 -- notable: a genuinely major saint, not an
  # obscure one, caught by this same gap), Ss. Hippolytus and Cassian
  # (Aug 13), St. Agapitus (Aug 18), Ss. Timothy/Hippolytus/Symphorian
  # (Aug 22). Also excluded: Our Lady of the Snows (Aug 5, fixed BVM
