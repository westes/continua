# A day's precedence category under the temporal cycle alone, before any
# sanctoral feast is weighed against it — see calendar/types.ts's
# TemporalCategory doc comment for why this is coarser than `season`, and
# calendar/commemorations.ts for how it's actually used (decideOccurrence).
#
# RECONSTRUCTED, not verified against a primary source: the two rubric
# documents actually present in the reference engine
# (divinum-officium-reference/web/www/horas/Help/Rubrics/) are both later
# editions (~1960) with a different, renumbered classification than the
# pre-1955 system this app targets. This is a best-effort reconstruction
# from general knowledge of that older tradition — expect corrections.
#
# `bySeason` gives the default for an ordinary Sunday/feria falling in that
# season. `offsets`/`offsetRanges` (from Easter, same convention as
# easter-offsets.yml) and `fixedDates` (MM-DD) override that default for
# specific privileged ferias that don't line up with a whole season.
#
# `privileged-feria` vs `privileged-feria-major`: two real tiers, not one
# — see calendar/types.ts's TemporalCategory doc comment for how this was
# found and calendar/commemorations.ts for the rule each gets. Lent's Ember
# days are directly verified as the lesser tier (a plain Duplex wins
# outright there); Ash Wednesday, Holy Week, and the Easter Octave are the
# major tier (Easter Octave directly verified — Holy Week and Ash
# Wednesday are strong prior knowledge, not independently re-verified
# here). Where this app *doesn't* have direct evidence either way —
# Pentecost's own Ember days, the Vigil of Christmas — it defaults to the
# major (stricter) tier as the safer guess, pending verification. Pentecost's
# own *Octave* (as opposed to its Ember days) is the one exception: it's
# no longer classified via this table at all — see the offsetRanges
# section below and calendar/octaves.ts.
#
# September Ember days (Wed/Fri/Sat nearest the Exaltation of the Cross,
# Sept 14) and Advent Ember days (Wed/Fri/Sat after Advent's 3rd Sunday) both
# resolve to `privileged-feria-ember` (Duplex threshold, raised from
# Semiduplex 2026-09-18 — see calendar/types.ts's TemporalCategory doc
# comment) via their own explicit checks in calendar/temporal.ts's
# resolveTemporalCategory, called directly rather than through this table
# (can't be expressed as a plain offset/fixedDate entry here: both anchors
# are "nearest [date]"/"n days after [movable Sunday]" rules with their own
# year-dependent math, same shape as adventStart's "nearest Nov 30"). See
# calendar/temporal.ts's septemberEmberDayOffset/adventEmberDayOffset for
# the actual logic. Both get their own distinct proper content
# (collect/Matins readings) via calendar/ember-days.ts, separate from this
# precedence-only table.
# Lent's Ember days *are* modeled (clean Easter offsets, directly
# verified). Pentecost's own Ember days share this same offset-based
# fixability but currently fall to the plain `ordinary-feria` default
# instead (see the offsetRanges comment below) — unverified, a real gap,
# not a guess dressed up as one.
#
# 2026-09-01 full sweep: every `bySeason` entry now live-verified or
# explicitly noted as not (see each entry's own comment below) — found
# and fixed two real bugs in the process (`eastertide`'s and
# `ascensiontide`'s own `sunday` tiers were each backwards), and a third,
# deeper one in `commemorations.ts` itself (`privileged-sunday`'s
# duplex-majus+ candidates were wrongly given a bare commemoration
# instead of transferring like every other rank there). Every `feria`
# entry in `bySeason` besides the ones with their own verification
# comment is the trivial `ordinary-feria` default (no rank threshold at
# all — any real content wins outright) — not worth a dedicated live
# collision test on top of the hundreds of ordinary weekdays already
# exercising it correctly across this app's whole test suite.
bySeason:
  # Advent's ordinary ferias originally verified `privileged-feria-minor`
  # during the December sanctoral pull (concrete case: St. Nicholas,
  # Semiduplex, Dec 6), then split into their own dedicated
  # `privileged-feria-advent` tier on 2026-09-18 and raised to Duplex (see
  # calendar/types.ts's TemporalCategory doc comment) -- St. Nicholas was
  # deliberately re-ranked to Duplex so he still wins outright under the
  # new threshold (see st-nicholas.yml), rather than being demoted to a
  # commemoration the way the evidence would otherwise dictate.
  advent: { sunday: privileged-sunday, feria: privileged-feria-advent }
  # Christmastide's ferias are folded into the privileged-feria-minor
  # default for the whole season as a simplification of "the Octave of
  # Christmas (Dec 25 - Jan 1) is privileged" — slightly overbroad into Jan
  # 2-5, harmless. Verified `privileged-feria-minor` specifically (not the
  # stronger `privileged-feria`) during the December pull: St. Thomas of
  # Canterbury, Semiduplex, wins outright within the Octave (Dec 29) in the
  # real Monastic 1617 engine, which `privileged-feria`'s Duplex+ threshold
  # would wrongly forbid. Kept at this original Semiduplex threshold even
  # after Advent split off into its own Duplex-threshold
  # `privileged-feria-advent` tier 2026-09-18 -- St. Thomas of Canterbury's
  # own outright win is exactly the evidence that would be lost by raising
  # this tier too, and no request to do so has been made for Christmastide.
  #
  # The Sunday itself is `ordinary-sunday`, NOT `privileged-sunday` —
  # originally miscoded as privileged-sunday (Advent's own Sundays' tier),
  # which was backwards: live-verified against all six possible collision
  # dates (Dec 26 St. Stephen, 27 St. John, 28 Holy Innocents — all
  # Duplex-II-classis — plus 31 St. Silvester, plain Duplex), every one of
  # them wins outright over the Sunday, which is merely commemorated in
  # return — exactly ordinary-sunday's Duplex+ rule, and the reverse of
  # privileged-sunday's (which would keep the Sunday primary and only nod
  # to the saint). Dec 29 (St. Thomas Becket, Semiduplex) still transfers
  # off the Sunday rather than winning, and a day with no saint at all
  # (e.g. Dec 30) still resolves to the Sunday cleanly — both of those
  # match ordinary-sunday too, so nothing here actually depended on the
  # stronger tier.
  christmastide: { sunday: ordinary-sunday, feria: privileged-feria-minor }
  epiphanytide: { sunday: ordinary-sunday, feria: ordinary-feria }
  septuagesima: { sunday: privileged-sunday, feria: ordinary-feria }
  lent: { sunday: privileged-sunday, feria: ordinary-feria }
  passiontide: { sunday: privileged-sunday, feria: ordinary-feria }
  # The ordinary Sundays after Easter (i.e. not Easter Day itself, not
  # within its Octave — both handled elsewhere) are `ordinary-sunday`,
  # NOT `privileged-sunday` — originally miscoded, live-verified
  # 2026-09-01, two independent Duplex-II-classis collisions on "Dominica
  # IV Post Pascha" (the Finding of the Holy Cross, 2026-05-03; St. Mark,
  # 2027-04-25): both win outright, with the Sunday itself only noted as
  # a `Tempora` commemoration underneath — exactly `ordinary-sunday`'s
  # Duplex+ rule, the reverse of `privileged-sunday`'s (which would keep
  # the Sunday primary and transfer the feast entirely, per the
  # Ascensiontide/Advent/Palm-Sunday/Easter-Day evidence above and
  # below). Easter Day itself (offset 0) and its Octave (offsets 1-6,
  # `privileged-feria-major` via offsetRanges below) are unaffected by
  # this — only the ordinary Sundays past the Octave use this default.
  eastertide: { sunday: ordinary-sunday, feria: ordinary-feria }
  # The Sunday within the Octave of Ascension is `privileged-sunday`, not
  # `ordinary-sunday` — live-verified 2026-09-01: the reference engine
  # titles it "Dominica infra Octavam Ascensionis ~ Semiduplex Dominica
  # minor" and gives it its own proper Matins content (own antiphons, Ps 8
  # opening Nocturn I — not the generic fixed Sunday scheme), with St.
  # Paschal Baylon (Duplex, real May 17) nowhere in it; `ordinary-sunday`'s
  # Duplex+ threshold would wrongly let that saint win outright instead.
  # Matches the same "great octave" pattern as eastertide/pentecost above,
  # both already `privileged-sunday`.
  ascensiontide: { sunday: privileged-sunday, feria: ordinary-feria }
  # Pentecost Sunday itself — no fixed-date saint collision found/
  # attempted to independently verify this specific entry, but consistent
  # with the confirmed "great octave Sundays are privileged-sunday"
  # pattern (Easter Day, Ascension's own octave Sunday) — Pentecost
  # outranks both.
  pentecost: { sunday: privileged-sunday, feria: ordinary-feria }
  trinitytide: { sunday: ordinary-sunday, feria: ordinary-feria }
  # Corpus Christi/Sacred Heart are themselves "feasts of the Lord" that
  # shouldn't cede to an ordinary saint — modeled here as
  # privileged-feria-major (rather than injecting a separate synthetic
  # FeastClass) since with the small sanctoral calendar this app has, a
  # real clash is unlikely and the practical effect (temporal wins) is the
  # same either way. Not independently live-verified (no fixed-date saint
  # collision found/attempted), but same "feast of the Lord" reasoning
  # already confirmed for Ash Wednesday/Holy Week/the Easter Octave.
  # `sunday` is checked here for shape-consistency with every other
  # season entry, but genuinely unreachable in practice — per
  # data/calendar/easter-offsets.yml's `days:` table, both are single
  # fixed weekdays (Corpus Christi always a Thursday, Sacred Heart always
  # the following Friday), never a Sunday.
  corpus-christi: { sunday: ordinary-sunday, feria: privileged-feria-major-commemorating }
  sacred-heart: { sunday: ordinary-sunday, feria: privileged-feria-major-commemorating }

offsets:
  -46: privileged-feria-major # Ash Wednesday
  -39: privileged-feria # Lent Ember Wednesday (Wed after 1st Sunday of Lent) — verified: Duplex wins outright here
  -37: privileged-feria # Lent Ember Friday
  -36: privileged-feria # Lent Ember Saturday — verified: Duplex wins outright here (St. Gregory the Great)
  48: privileged-feria-major-commemorating # Vigil of Pentecost

offsetRanges:
  # Ferias of Passion week (Monday-Saturday before Palm Sunday) -- was
  # falling through to passiontide's own `ordinary-feria` season default
  # (no rank threshold at all), which let any real feast, however
  # low-ranked, win outright. Live-verified 2026-09-02 against the
  # reference engine (Monastic Tridentinum 1617): swept every calendar
  # date that can ever land in this window across 2020-2119 (the full
  # range Easter's date can produce) and found zero sub-Duplex winners --
  # every real winner is Duplex or higher (St. Joseph, St. Leo I, St.
  # Francis of Paola, the Transitus of St. Benedict, the Annunciation, St.
  # Gregory the Great) -- while an ordinary Lent feria outside this window
  # (Ss. Quadraginta Martyrum, Semiduplex, March 10) also wins outright,
  # and even a Simplex saint does too (St. Lucius I, March 4, live-verified
  # 2026-09-19 in a year clear of both windows) -- confirming Lent's plain
  # ferias genuinely have no threshold at all (`ordinary-feria` is
  # correct there, see calendar/types.ts), unlike Passion week, which does
  # need its own stronger `privileged-feria` (Duplex+ wins outright,
  # matching Lent's Ember days above) rather than inheriting that default.
  - { fromOffset: -13, toOffset: -8, category: privileged-feria } # ferias of Passion week
  - { fromOffset: -6, toOffset: -1, category: privileged-feria-major } # ferias of Holy Week
  - { fromOffset: 1, toOffset: 6, category: privileged-feria-major } # Easter octave — verified: even Duplex II. classis (St. Mark) only gets commemorated, never wins
  # Pentecost's own Octave (offsets 50-55) is deliberately absent from
  # this table now -- it used to be classified privileged-feria-major
  # here, but user-confirmed rule (2026-08) is that a Duplex+ saint wins
  # outright within it, which the generic octave layer
  # (calendar/octaves.ts, data/calendar/temporal-feasts/pentecost-
  # sunday.yml) now handles directly. Leaving these offsets unlisted lets
  # them fall through to the `pentecost` season default (ordinary-feria,
  # see bySeason above), so a real sanctoral candidate reaches the octave
  # layer intact instead of being transferred away by a stricter feria
  # tier first. Pentecost's own Ember days (within this same range, in
  # years they land there) get the same ordinary-feria default as a
  # result -- still unverified for Pentecost specifically, not the
  # Lent-Ember-day privileged-feria treatment; a real gap, just an
  # existing one, not introduced by this change.

fixedDates:
  "12-24": privileged-feria-major-commemorating # Vigil of Christmas
