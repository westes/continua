# Corrected: this app had him on Jan 23, sourced from a 2029 live-query
# check that, in hindsight, was itself a red herring -- Jan 23, 2029 only
# shows Hilary because 2029 is a year where Jan 14 (his real, raw-file-
# confirmed fixed date) falls on a Sunday and every day from the 15th
# through the 22nd is already occupied by another real feast that year,
# forcing an unusually long transfer chain. Moved to his actual date,
# Jan 14, confirmed directly against Latin/Sancti/01-14.txt's own
# [Officium] (Latin/Sancti/01-23.txt is St. Raymond of Peñafort, not
# Hilary at all). Verified against Divinum Officium (Monastic Tridentinum
# 1617), live query, 2026-01-14 -- winner outright, Semiduplex.
id: st-hilary-of-poitiers
name: "St. Hilary of Poitiers, Bishop, Confessor and Doctor of the Church"
nameLa: "Sanctus Hilarius Pictaviensis, Episcopus, Confessor et Ecclesiæ Doctor"
rank: semiduplex
common: common-of-a-confessor-doctor
propers: "st-hilary-of-poitiers"
# P/T/S/N: live-query-verified (2026-08) as byte-identical to common-of-a-
# confessor-bishop.yml, despite his own [Rule] saying "vide C4a" (Doctor) --
# unlike St. Gregory the Great, whose own live-rendered P/T/S/N really is
# unique proper text (see his own prime-antiphon-st-gregory-the-great.yml).
minorHoursCommon: common-of-a-confessor-doctor
