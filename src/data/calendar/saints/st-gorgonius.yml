# per memory vu-reference-engine-file-layout, not a live query): untagged/
# default [Rank] block of `web/www/horas/Latin/Sancti/09-09.txt` --
# "vide C2a-1;;Simplex;;1.1;;". Ancient Roman martyr (Diocletian
# persecution, d. c. 304), so this project's rank-deflation rule (late
# canonizations only) doesn't apply -- his real historical rank, Simplex,
# is genuinely this low; it's not a stand-in for something richer. The
# source's own Cistercian-rubric variant demotes him to a bare
