# SanctiM/07-11b.txt (the Translation title and collect), which share 07-11M's
# text. Both inherit the rest from SanctiM/03-21.txt (St. Benedict, Mar 21), so
# the capitula, responsories, versicles and the Benedictus/First-Vespers
# Magnificat antiphons are St. Benedict's own, copied under this id.
# Calendar: Jul 11, with St. Pius I commemorated (CAV.txt: "In Festo
# Translationis S.P.N. Benedicti" + "S. Pii, Papae et Martyris"). Rank is the
# file's own II class (Duplex II. classis); the calendar tables print 6 for
# the Solemnity/Translation.
