#
# The four are the great abbots of Cluny (10th-11th c.): Odo (r. 927-942),
# Maiolus/Mayeul (r. 954-994), Odilo (r. 994-1049), Hugh (r. 1049-1109).
# All medieval cultus -- CLAUDE.md's late-canonization rank-deflation rule
# does not apply. [Rank] gives ";;Duplex;;3;;vide C1" -- C1 is literally
# "Commune Apostolorum" in this source's own numbering (confirmed via
# Commune/C1.txt's own [Officium]), an unusual choice for abbots, but the
# file's own antiphons lean into an "apostles of the monastic order"
# typology (e.g. "montástici Ordínis decus per orbem renovátum est" /
# Lectio4's Cluny-as-Josue's-army imagery) -- not treated as a typo. For
# vu's simpler `common:` categorization this is still filed under Common of
# an Abbot (same practical family st-maurus-abbot.yml/st-pachomius.yml
# use), since that's what they actually were, not literal apostles; the
# source's own C1 tag is documented here rather than silently followed,
# same class of judgment call as st-canute.yml's C2-1/C2a-1 note.
#
# No English counterpart exists anywhere under English/SanctiM/ or
# English/Sancti/ for 04-29M -- collect and Lectio4 translations below are
