# Read directly from the reference engine's untagged/default [Rank]
# block of `web/www/horas/Latin/Sancti/08-30.txt` -- "Duplex;;3;;vide
# C6a" (Common of Virgins only). Canonized 1671 (Clement X); this
# filename slot's plain (unsuffixed) file is hers, having displaced the
# ancient Ss. Felix and Adauctus (see ss-felix-and-adauctus.yml) onto
# the suffixed `08-30o.txt` sibling on the general calendar.
#
# Rank deliberately deflated one tier from the source (Duplex ->
# semiduplex): per project policy, a saint whose own canonization
# postdates ~1600 gets one tier off her nominal source rank, since
# "new canonization -> automatic Duplex" was the papacy's default
# practice by then and the raw grade no longer tracks real
# devotional weight the way it does for older saints (see
# this project's "Not a reconstruction" section). This does not apply
# to saints who are merely off their historical calendar slot for
# other reasons (e.g. Felix and Adauctus, Paul the Hermit) -- only to
# saints whose own cultus is genuinely late.
#
# Own real proper [Oratio]. No [Ant 1]/[Lectio7-9] of her own in the
# source -- Benedictus and minor-hour content fall back to the plain
# Common of a Virgin, and Matins Nocturn 3 defers to the Common's own
# (own Nocturn 2 reading transcribed separately, see
# propers/nocturn-readings/st-rose-of-lima.yml).
id: st-rose-of-lima
name: "St. Rose of Lima, Virgin"
nameLa: "Sancta Rosa Limana, Virgo"
rank: semiduplex
common: common-of-a-virgin
propers: "st-rose-of-lima"
# Announced at Prime the evening before, when this is the day's winner
# (hours/martyrology-announcement.ts); the wording is generated from `name`.
martyrologyAnnouncement: true
