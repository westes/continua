# Read directly from the reference engine (`../divinum-officium-reference`):
# `web/www/horas/Latin/Sancti/Bavaria/09-17-Hildegardis.txt` -- the Bavarian
# proper, a full office ("Duplex;;3;;vide C6a", 9 lectiones; granted for
# Germany 1940). Replaces the earlier build from the thin Monastic stub
# `SanctiM/09-17M.txt` (Simplex, collect and one antiphon only, no lessons,
# no hymn). The Bavarian file is the richer source: own Vespers hymn, own
# three Magnificat/Benedictus antiphons, a nine-lesson Matins (vita taken
# "E Breviario Monastico Ordinis S. Benedicti", then Augustine on virginity),
# proper responsories. Collect is word-for-word the same in both files.
#
# DATE: Sep 25, a free date, by decision of 2026-10-11. Her dies natalis
# (Sep 17, d. 1179) is the Stigmata of St. Francis here, and Sep 18-24 are
# all occupied; no translation or other feast date for her is attested in
# the reference engine (the Bavarian lessons mention the moves of her relics
# -- Rupertsberg, Cologne in the Thirty Years' War, Eibingen, recognised
# 1857 -- without a day). Sep 25 is the first free date after Sep 17.
#
# On this project's late-canonization rank-deflation rule: does NOT apply.
# Her cultus is medieval (d. 1179); the 2012 "equipollent canonization" was
# an administrative confirmation of a centuries-old cultus, not a new one.
# Source rank (Duplex) is taken at face value.
#
# `common-of-a-virgin`, not the `-martyr` variant: the source's C6a is the
# Commune Virginum tantum (Virgins, not Virgin-Martyrs); Hildegard was not a
# martyr. Source [Rule] is `vide C6a` plus `9 lectiones`.
id: st-hildegard
name: "St. Hildegard, Virgin"
nameLa: "Sancta Hildegardis, Virgo"
rank: semiduplex
common: common-of-a-virgin
propers: "st-hildegard"
