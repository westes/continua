# Read directly from the reference engine: `Sancti/aliquibus locis/
# 05-15-Isidorus.txt` -- "S. Isidori Agricolæ Confessoris;;Duplex;;3;;vide
# C5-1", the traditional May 15 office (dies natalis, 1172), 9 lectiones,
# own proper collect, Lectio4-6 vita, Gospel (John 15) and Gregory homily.
# Supersedes the earlier build from `Sancti/10-25n.txt` (the modern
# US-patronal optional file, Oct 25), which carried only a one-paragraph
# [Lectio94] summary.
#
# DATE AND RANK: May 15, and he wins the day -- user decision 2026-10-11
# ("isidore should win and de la salle is commemorated"). May 15 is also
# St. John Baptist de la Salle's day; the rank-deflation rule would take
# both down a tier (Isidore canonized 1622, de la Salle 1900), which would
# tie them, so Isidore is deliberately kept at his source rank `duplex`
# here and de la Salle goes to `semiduplex` (st-john-baptist-de-la-salle.yml,
# which is what the deflation rule gives a 1900 canonization anyway).
# `resolveCollision` then makes de la Salle the commemoration, with his own
# collect and Matins reading, same as any commemoration in this app.
#
# **Distinct from St. Isidore of Seville** (`st-isidore-of-seville.yml`,
# the Bishop-Doctor, Apr 4, already modeled) -- this is Isidore the
# ploughman of Madrid, patron of farmers. Name/id deliberately
# disambiguated. Common of a Confessor Not a Pontiff (C5), per [Rule]
# ("vide C5-1;mtv" -- the Common of a Confessor's own ploughman variant is
# not separately modeled; `common-of-a-confessor` is used).
#
# Own real proper collect (collect-st-isidore-the-farmer.yml, unchanged --
# the source's collect is the same text as the 10-25n file's) and Matins
# readings (propers/nocturn-readings/st-isidore-the-farmer.yml).
id: st-isidore-the-farmer
name: "St. Isidore the Farmer, Confessor"
nameLa: "Sanctus Isidorus Agricola, Confessor"
rank: semiduplex
common: common-of-a-confessor
propers: "st-isidore-the-farmer"
