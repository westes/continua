# Collect of The Commemoration of the Most Holy Passion of Our Lord Jesus Christ. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
id: collect-commemoration-of-the-passion
text:
  la: |
      Orémus.
      Omnípotens sempitérne Deus, qui humáno géneri, ad imitándum humilitátis exémplum, Salvatórem nostrum carnem súmere et crucem subíre fecísti: concéde propítius; ut, sicut sollémnem Commemoratiónem Passiónis ejus celebrámus, ita et patiéntiæ ipsíus habére documénta et resurrectiónis consórtia mereámur.
      Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Let us pray.
      Almighty and everlasting God, who, that mankind might have an example of humility to imitate, didst cause our Saviour to take flesh and to undergo the cross: mercifully grant that, as we celebrate the solemn Commemoration of his Passion, so we may deserve to have the lessons of his patience and a share in his resurrection.
      Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
