# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: benedictus-antiphon-holy-shroud
text:
  la: "Joseph nóbilis decurio, exspéctans et ipse regnum Dei, mercatus est sindonem, et deponens corpus Jesu, involvit illud in sindone."
  en: "Joseph, a noble counsellor, who also himself was waiting for the kingdom of God, bought fine linen, and taking down the body of Jesus, wrapped it in the linen."
status:
  la: verified
  en: draft
