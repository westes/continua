id: magnificat-antiphon-pentecost-sunday-d2
text:
  la: "Si quis díligit me, * sermónem meum servábit; et Pater meus díliget eum, et ad eum veniémus, et mansiónem apud eum faciémus, allelúja."
  en: "If a Man love Me * he will keep My word and My Father will love him, and We will come unto him, and make Our abode with him. Alleluia."
