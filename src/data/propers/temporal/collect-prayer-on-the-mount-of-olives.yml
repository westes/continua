# Collect of The Prayer of Our Lord Jesus Christ on the Mount of Olives. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt (Duplex majus, Tuesday after Septuagesima). English is this project's own translation, marked draft.
id: collect-prayer-on-the-mount-of-olives
text:
  la: |
      Orémus.
      Dómine Jesu Christe, qui in horto verbo et exémplo nos oráre docuísti, ad tentationum perícula superanda: concéde propítius; ut nos oratióni semper inténti, ejus copiosum fructum cónsequi mereámur:
      Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Let us pray.
      O Lord Jesus Christ, who in the garden didst teach us by word and example to pray, that we may overcome the dangers of temptation: mercifully grant that, ever intent upon prayer, we may deserve to obtain its abundant fruit:
      Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
