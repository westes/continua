id: magnificat-antiphon-month-week-102-first
text:
  la: "Refúlsit sol * in clípeos áureos, et resplenduérunt montes ab eis: et fortitúdo géntium dissipáta est."
  en: "The sun shone * upon the shields of gold, and the mountains glistened therewith, and the army of the heathens was spread abroad."
