id: prime-lectio-vigil-of-christmas
text:
  la: "Per quem accépimus grátiam, et apostolátum ad obediéndum fídei in ómnibus géntibus pro nómine ejus, in quibus estis et vos vocáti Jesu Christi Dómini nostri."
  en: "By whom we have received grace and apostleship for obedience to the faith, in all nations, for his name, among whom are you also the called of Jesus Christ."
citation:
  la: "Rom 1:5-6"
  en: "Rom 1:5-6"
status:
  la: verified
  en: verified
