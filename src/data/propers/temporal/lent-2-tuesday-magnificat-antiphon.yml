# Read directly from web/www/horas/Latin/Tempora/Quad2-2.txt's own
# [Ant 3] and its English counterpart.
id: lent-2-tuesday-magnificat-antiphon
text:
  la: "Omnes autem * vos fratres estis: et patrem nolíte vocáre vobis super terram: unus est enim Pater vester, qui in cælis est: nec vocémini magístri, quia magíster vester unus est Christus."
  en: "And all ye are brethren, * and call no man your father upon earth, for One is your Father, Which is in heaven; neither be ye called masters, for One is your Master, even Christ."
status:
  la: verified
  en: verified
