id: easter-friday-collect
text:
  la: |
    Orémus.
    Omnípotens sempitérne Deus, qui paschále sacraméntum in reconciliatiónis humánæ fœ́dere contulísti: da méntibus nostris; ut quod professióne celebrámus, imitémur efféctu.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Almighty and eternal God, Who in the Easter sacrament hast instituted the covenant whereby thou forgavest mankind: grant to our souls, that what we outwardly profess we may show forth in our deeds.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
