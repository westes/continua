# First Vespers (Saturday evening) Magnificat antiphon: reference engine, Monastic Tridentinum 1617, prayVespera 2026-09-19 ("Vespera de sequenti"). The default (Second Vespers) file is the same id without "-first". See hours/resolve-common.ts's getMagnificatAntiphon; keys of the form month-week-MMN are the engine's Aug-Nov calendar-month Sundays (calendar/month-week-id.ts).
id: month-week-094-magnificat-antiphon-first
text:
  la: "Adonái, Dómine, * Deus magne et mirábilis, qui dedísti salútem in manu féminæ, exáudi preces servórum tuórum."
  en: "O Adonai, O Lord God, * Thou art great and glorious, Who hast given salvation into the hand of a woman, graciously hear the prayers of thy servants."
