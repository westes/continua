# Read directly from web/www/horas/Latin/Tempora/Pasc7-3.txt's own
# [Oratio] and its English counterpart. Standard "Qui tecum..." closing
# spelled out in full (the source abbreviates it as "$Qui tecum eiusdem"),
# matching every other collect in this store.
id: collect-ember-pentecost-wednesday
text:
  la: |
    Orémus.
    Mentes nostras, quǽsumus, Dómine, Paráclitus, qui a te procédit, illúminet: et indúcat in omnem, sicut tuus promísit Fílius, veritátem.
    Qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Lord, we beseech thee, that the Comforter, Which proceeded from thee, may enlighten our minds, and lead us into all truth, even as thy Son hath promised unto us.
    Who liveth and reigneth with thee, in the unity of the same Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
