# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-3.txt.
id: lent-4-wednesday-collect
text:
  la: |
    Orémus.
    Deus, qui et justis prǽmia meritórum, et peccatóribus per jejúnium véniam præbes: miserére supplícibus tuis; ut reátus nostri conféssio indulgéntiam váleat percípere delictórum.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who by mean of fasting dost give unto the righteous the reward of their good works, and unto sinners pardon; have mercy upon us, we beseech thee, and grant that we, humbly confessing our guiltiness, may so be enabled to obtain thy forgiveness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
