# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad3-1.txt.
id: collect-lent-3-monday-vespers
text:
  la: |
    Orémus.
    Subvéniat nobis, Dómine, misericórdia tua: ut ab imminéntibus peccatórum nostrórum perículis te mereámur protegénte éripi, te liberánte salvári.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Let our help, O Lord, be in thy mercy, that we over whom thy wrath doth most justly hang because of our sins, may in all dangers worthily be shielded by thy protection and delivered by thy salvation.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
