# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad3-4.txt.
id: lent-3-thursday-collect-vespers
text:
  la: |
    Orémus.
    Subjéctum tibi pópulum, quǽsumus, Dómine, propitiátio cæléstis amplíficet: et tuis semper fáciat servíre mandátis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Lord, we beseech thee that thine heavenly Peace-Offering may so effectually work for all thy people, which are now bowing themselves down before thee, that they may ever continue in meek obedience to thy commandments.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
