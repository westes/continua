# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-5.txt.
id: lent-4-friday-collect
text:
  la: |
    Orémus.
    Deus, qui ineffabílibus mundum rénovas sacraméntis: præsta, quǽsumus; ut Ecclésia tua et ætérnis profíciat institútis, et temporálibus non destituátur auxíliis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who dost quicken the whole world anew by thine unspeakable Sacraments, grant, we beseech thee, that thy Church may both profit by whatsoever Thou hast ordained touching the things which are eternal, nor be comfortless of such help as is needful unto her touching the things which are temporal.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
