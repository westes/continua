# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad2-4.txt.
id: lent-2-thursday-collect
text:
  la: |
    Orémus.
    Præsta nobis, quǽsumus, Dómine, auxílium grátiæ tuæ: ut, jejúniis et oratiónibus conveniénter inténti, liberémur ab hóstibus mentis et córporis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant unto us, O Lord, we beseech thee, the help of thy grace, that we, who are now bent on fasting and prayer, may be freed from enemies both of our bodies and of our souls.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
