# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2026-04-03. Matches Tempora/Quad6-5.txt's own [Ant 3]. John
# 19:30, Christ's last words and death on the Cross -- the file's own note
# that "Vesperæ ab iis qui solemni Actioni liturgicæ postmeridianæ
# intersunt, hodie non dicuntur" (Vespers is not said today by those
# attending the solemn afternoon liturgical Action) is the same kind of
# rubric as Thursday's, not a suppression of the text itself.
id: good-friday-magnificat-antiphon
text:
  la: "Cum accepísset acétum, * dixit: Consummátum est: et inclináto cápite, emísit spíritum."
  en: "When He had received the vinegar, * He said: It is consummated; and bowing His head, He gave up the ghost."
status:
  la: verified
  en: verified
