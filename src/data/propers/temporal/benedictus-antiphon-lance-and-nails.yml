# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
id: benedictus-antiphon-lance-and-nails
text:
  la: "Inglórius erit inter viros aspéctus ejus, et forma ejus inter fílios hóminum. Iste aspérget gentes multas."
  en: "His visage shall be inglorious among men, and his form among the sons of men. He shall sprinkle many nations."
