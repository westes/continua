# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2027-01-06); Latin and English both taken from the page.
id: epiphany-magnificat-antiphon
text:
  la: "Tribus miráculis * ornátum diem sanctum cólimus: hódie stella Magos duxit ad præsépium: hódie vinum ex aqua factum est ad núptias: hódie in Jordáne a Joánne Christus baptizári vóluit, ut salváret nos, allelúja."
  en: "This day we keep a holiday in honour of three wonders, * this day a star led the wise men to the manger; this day at the marriage, water was made wine; this day was Christ, for our salvation, pleased to be baptized of John in Jordan. Alleluia."
status:
  la: verified
  en: verified
