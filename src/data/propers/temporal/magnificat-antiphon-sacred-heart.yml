id: magnificat-antiphon-sacred-heart
text:
  la: "Ad Jesum autem * cum veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus crura, sed unus mílitum láncea latus ejus apéruit et contínuo exívit sanguis et aqua."
  en: "But when they came to Jesus * and saw that he was dead already, they broke not his legs, but one of the soldiers with a spear pierced his side, and forthwith came there out Blood and Water."
