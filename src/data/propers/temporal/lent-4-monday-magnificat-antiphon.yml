id: lent-4-monday-magnificat-antiphon
text:
  la: "Sólvite templum hoc, * dicit Dóminus; et post tríduum reædificábo illud: hoc autem dicébat de templo córporis sui."
  en: "Thus saith the Lord: * Destroy this temple, and in three days I will raise it up. But He spoke of the temple of His Body."
