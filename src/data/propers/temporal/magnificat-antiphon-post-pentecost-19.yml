text:
  la: "Intrávit autem rex * ut vidéret discumbéntes, et vidit ibi hóminem non vestítum veste nuptiáli et ait illi: Amíce, quómodo huc intrásti non habens vestem nuptiálem?"
  en: "And the King came in * to see the guests, and he saw there a man which had not on a wedding garment. And he saith unto him: Friend, how camest thou in hither, not having a wedding garment?"
