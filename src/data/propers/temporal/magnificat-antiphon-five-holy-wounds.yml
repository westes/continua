# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). English is this project's own translation, marked draft.
id: magnificat-antiphon-five-holy-wounds
text:
  la: "Ego sum vestra redémptio: manus meæ, quæ vos fecérunt, clavis confixæ sunt: propter vos flagéllis cæsus sum, spinis coronátus sum: aquam pétii pendens, et acétum porrexerunt: in escam meam fel dedérunt, et in latus lanceam: mórtuus et sepúltus resurrexi: vobíscum sum, et vivo in ætérnum."
  en: "I am your redemption: my hands, which made you, were fastened with nails; for you I was scourged, for you crowned with thorns; hanging, I asked for water, and they gave vinegar; for my food they gave me gall, and a lance into my side; dead and buried, I rose again; I am with you, and I live for ever."
status:
  la: verified
  en: draft
