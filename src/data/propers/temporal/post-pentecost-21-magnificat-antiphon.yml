id: post-pentecost-21-magnificat-antiphon
text:
  la: "Serve nequam, * omne débitum dimísi tibi, quóniam rogásti me: nonne ergo opórtuit et te miseréri consérvi tui, sicut et ego tui misértus sum, allelúja."
  en: "O thou wicked servant, I forgave thee all * that debt, because thou desiredst me. Shouldest not thou also have had compassion on thy fellow-servant, even as I had pity on thee, alleluia."
