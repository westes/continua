id: magnificat-antiphon-lent-1-tuesday
text:
  la: "Scriptum est enim, * quia domus mea, domus oratiónis est cunctis géntibus: vos autem fecístis illam spelúncam latrónum: et erat cotídie docens in templo."
  en: "For it is written * that My house is the house of prayer * for all nations but ye have made it a den of thieves and He was daily teaching in the temple."
status:
  la: verified
  en: verified
