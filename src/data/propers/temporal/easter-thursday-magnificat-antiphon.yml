# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2027-04-01); Latin and English both taken from the page.
id: easter-thursday-magnificat-antiphon
text:
  la: "Tulérunt Dóminum meum, * et néscio ubi posuérunt eum: si tu sustulísti eum, dícito mihi, allelúja: et ego eum tollam, allelúja."
  en: "They have taken away my Lord, * and I know not where they have laid Him: if thou have borne Him hence, tell me, alleluia, and I will take Him away, alleluia."
status:
  la: verified
  en: verified
