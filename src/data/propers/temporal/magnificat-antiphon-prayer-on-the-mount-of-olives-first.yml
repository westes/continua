# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt (Duplex majus, Tuesday after Septuagesima). English is this project's own translation, marked draft.
id: magnificat-antiphon-prayer-on-the-mount-of-olives-first
text:
  la: "Pósitis génibus orábat, dicens: Pater, si vis, transfer cálicem istum a me: verúmtamen non mea volúntas, sed tua fiat."
  en: "Kneeling down, he prayed, saying: Father, if thou wilt, remove this chalice from me: but yet not my will, but thine be done."
status:
  la: verified
  en: draft
