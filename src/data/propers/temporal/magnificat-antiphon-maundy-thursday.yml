# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2026-04-02. Matches Tempora/Quad6-4.txt's own [Ant 3].
# Matthew 26:26, the institution of the Eucharist at the Last Supper --
# fittingly this day's own Vespers antiphon, since Maundy Thursday's
# Vespers historically commemorates the institution most directly (the
# source's own rubric note that ordinary Vespers is "not said today" by
# those attending the evening Mass of the Lord's Supper, since that Mass
# itself liturgically incorporates Vespers, doesn't remove this text from
# the Office for anyone praying the Hours on their own).
id: magnificat-antiphon-maundy-thursday
text:
  la: "Cenántibus autem illis * accépit Jesus panem, et benedíxit, ac fregit, dedítque discípulis suis."
  en: "And as they were eating, * Jesus took bread, and blessed it, and broke it, and gave it to His disciples."
status:
  la: verified
  en: verified
