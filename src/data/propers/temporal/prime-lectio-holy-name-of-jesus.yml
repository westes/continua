id: prime-lectio-holy-name-of-jesus
text:
  la: "Omne quodcúmque fácitis in verbo, aut in ópere: ómnia in nómine Dómini Jesu Christi fácite, grátias agéntes Deo et Patri per ipsum."
  en: "All whatsoever you do in word or in work, do all in the name of the Lord Jesus Christ, giving thanks to God and the Father by him."
citation:
  la: "Col 3:17"
  en: "Col 3:17"
status:
  la: verified
  en: verified
