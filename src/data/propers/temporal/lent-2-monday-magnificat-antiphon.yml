id: lent-2-monday-magnificat-antiphon
text:
  la: "Qui me misit * mecum est, et non relíquit me solum; quia quæ plácita sunt ei, fácio semper."
  en: "He That sent Me is with Me, * and hath not left Me alone, for I do always those things that please Him."
