text:
  la: "Homo quidam * descendébat ab Jerúsalem in Jéricho et íncidit in latrónes, qui étiam despoliavérunt eum et, plagis impósitis, abiérunt semivívo relícto."
  en: "A certain man went down from Jerusalem * to Jericho, and fell among thieves, which stripped him of his raiment, and wounded him, and departed, leaving him half dead."
