id: magnificat-antiphon-lent-4-friday
text:
  la: "Dómine, * si fuísses hic, Lázarus non esset mórtuus: ecce jam fœtet quatriduánus in monuménto."
  en: "Lord, if Thou hadst been here * Lazarus had not died; behold, by this time he stinketh, for he hath lain in the grave four days already."
