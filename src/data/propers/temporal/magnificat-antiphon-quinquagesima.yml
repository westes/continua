id: magnificat-antiphon-quinquagesima
text:
  la: "Stans autem Jesus, * jussit cæcum addúci ad se, et ait illi: Quid vis ut fáciam tibi? Dómine, ut vídeam. Et Jesus ait illi: Réspice, fides tua te salvum fecit. Et conféstim vidit, et sequebátur illum, magníficans Deum."
  en: "And Jesus stood, * and commanded the blind man to be brought unto Him, and He asked him, saying: What wilt thou that I shall do unto thee? Lord, that I may receive my sight. And Jesus said unto him: Receive thy sight, thy faith hath saved thee. And immediately he received his sight, and followed Him, glorifying God."
status:
  la: verified
  en: verified
