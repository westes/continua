# Read directly from web/www/horas/Latin/Tempora/Pasc7-5.txt's own
# [Ant 3] and its English counterpart (John 14:26, the Vespers antiphon
# for the Comforter).
id: magnificat-antiphon-ember-pentecost-friday
text:
  la: "Paráclitus autem * Spíritus Sanctus, quem mittet Pater in nómine meo, ille vos docébit ómnia, et súggeret vobis ómnia, quæcúmque díxero vobis, allelúia."
  en: "But the Comforter which is the Holy Ghost, * Whom the Father will send in My Name, He shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you. Alleluia."
status:
  la: verified
  en: verified
