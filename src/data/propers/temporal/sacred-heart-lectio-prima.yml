# Sourced from web/www/horas/Latin/Tempora/Pent02-5.txt's own [Lectio Prima] and its
# English counterpart.
id: sacred-heart-lectio-prima
text:
  la: "In caritáte radicáti et fundáti, ut possítis comprehéndere cum ómnibus sanctis, quæ sit latitúdo et longitúdo, et sublímitas et profúndum; scire étiam supereminéntem sciéntiæ caritátem Christi, ut impleámini in omnem plenitúdinem Dei."
  en: "Being rooted and grounded in love, may ye be able to comprehend with all saints what is the breadth and length and depth and height: and to know the love of Christ, which passeth knowledge, that ye might be filled with all the fulness of God. But thou, O Lord, have mercy upon us."
citation:
  la: "Eph 3:17-19"
  en: "Eph 3:17-19"
status:
  la: verified
  en: verified
