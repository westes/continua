# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
id: magnificat-antiphon-lance-and-nails-first
text:
  la: "Delens quod advérsus nos erat chirógraphum decréti quod erat contrárium nobis, et ipsum tulit de médio, affígens illud cruci."
  en: "Blotting out the handwriting of the decree that was against us, which was contrary to us, he hath taken the same out of the way, fastening it to the cross."
status:
  la: verified
  en: draft
