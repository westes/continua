id: corpus-christi-lectio-prima
text:
  la: "Quicúmque manducáverit panem hunc, vel bíberit cálicem Dómini indígne, reus erit córporis et sánguinis Dómini."
  en: "Whosoever shall eat this bread, or drink the chalice of the Lord unworthily, shall be guilty of the body and of the blood of the Lord."
citation:
  la: "1 Cor 11:27"
  en: "1 Cor 11:27"
