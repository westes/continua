# Engine render (Divino Afflatu 1954 (the feast postdates 1617; no Monastic render exists), command=prayLaudes, 2026-04-22); Latin and English both taken from the page.
id: benedictus-antiphon-patronage-of-st-joseph
text:
  la: "Joseph, fili David, * noli timére accípere Maríam cónjugem tuam; quod enim in ea natum est, de Spíritu Sancto est, allelúja."
  en: "Joseph, thou Son of David, * fear not to take unto thee Mary thy wife; for That Which is conceived in her is of the Holy Ghost alleluia."
