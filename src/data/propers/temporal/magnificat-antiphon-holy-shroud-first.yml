# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: magnificat-antiphon-holy-shroud-first
text:
  la: "Joseph, vir bonus et justus, accessit ad Pilátum, et pétiit corpus Jesu: quo accépto, involvit illud in sindone munda."
  en: "Joseph, a good and just man, went to Pilate, and begged the body of Jesus; and having received it, he wrapped it in a clean linen cloth."
status:
  la: verified
  en: draft
