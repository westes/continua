# Per-day proper of the Epiphany octave's counted day 7: Sancti/01-12.txt's [Ant 2] and English/Sancti/01-12.txt. Said when no Sunday falls in Jan 7-12 (e.g. 2030); see OctaveConfig.skipsSunday.
id: benedictus-antiphon-epiphany-d7
text:
  la: "Maniféste magnum est * pietátis sacraméntum, quod manifestátum est in carne, justificátum est in spíritu, appáruit Angelis, prædicátum est Géntibus, créditum est in mundo, assúmptum est in glória, allelúja."
  en: "Without controversy * great is the mystery of godliness: God was manifest in the flesh, justified in the Spirit, seen of Angels, preached unto the Gentiles, believed on in the world, received up into glory, alleluia."
status:
  la: verified
  en: verified
