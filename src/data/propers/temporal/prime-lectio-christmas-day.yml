# Sourced from web/www/horas/Latin/Sancti/12-25.txt's own [Lectio Prima] and its
# English counterpart.
id: prime-lectio-christmas-day
text:
  la: "Ipsi períbunt, tu autem permanébis; et omnes sicut vestiméntum veteráscent: et velut amíctum mutábis eos, et mutabúntur: tu autem idem ipse es, et anni tui non defícient."
  en: "They shall perish, but thou shalt continue: and they shall all grow old as a garment. And as a vesture shalt thou change them, and they shall be changed: but thou art the selfsame, and thy years shall not fail."
citation:
  la: "Heb 1:11-12"
  en: "Heb 1:11-12"
status:
  la: verified
  en: verified
