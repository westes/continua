# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-12-25); Latin and English both taken from the page.
id: magnificat-antiphon-christmas-day
text:
  la: "Hódie * Christus natus est: hódie Salvátor appáruit: hódie in terra canunt Angeli, lætántur Archángeli: hódie exsúltant justi, dicéntes: Glória in excélsis Deo, allelúja."
  en: "This day the Christ is born this day the Saviour is appeared; * this day the Angels sing praise in the earth and the Archangels rejoice; this day the righteous are glad and say: Glory to God in the highest. Alleluia."
