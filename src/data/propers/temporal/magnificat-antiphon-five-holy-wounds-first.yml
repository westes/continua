# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). English is this project's own translation, marked draft.
id: magnificat-antiphon-five-holy-wounds-first
text:
  la: "Dum in cruce pendéret unigénitus Dei Fílius, et ab ómnibus subsannarétur, mater ejus Virgo María ipsum verum Deum et hóminem cóndolens venerabátur."
  en: "While the only-begotten Son of God hung upon the cross, and was derided by all, his mother, the Virgin Mary, grieving with him, venerated him as true God and true man."
status:
  la: verified
  en: draft
