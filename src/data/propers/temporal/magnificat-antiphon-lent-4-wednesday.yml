id: magnificat-antiphon-lent-4-wednesday
text:
  la: "Ille homo * qui dícitur Jesus, lutum fecit ex sputo, et linívit óculos meos, et modo vídeo."
  en: "The Man that is called Jesus * made clay of His Spittle, and anointed mine eyes, and now I do see."
