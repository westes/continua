id: lent-4-saturday-magnificat-antiphon
text:
  la: "Ego sum * qui testimónium perhíbeo de meípso: et testimónium pérhibet de me, qui misit me, Pater."
  en: "I am One * That bear witness of Myself, and the Father That sent Me beareth witness of Me."
