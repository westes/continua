# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quadp3-4.txt.
id: thursday-after-ash-wednesday-collect-vespers
text:
  la: |
    Orémus.
    Parce, Dómine, parce populo tuo: ut, dignis flagellatiónibus castigátus, in tua miseratióne respíret.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Spare, O Lord, spare thy people, that they, being deservedly chastened, they may find solace through thy tender mercy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
