# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-03-31. Matches Tempora/Quad6-2.txt's own [Ant 2]
# (Monastic form -- the file's "(rubrica praedicatorum)" variant, "Nemo
# tollit a me ánimam meam...", is a Dominican-use alternative not followed
# here). John 13:1, opening words of the Johannine Passion narrative,
# the famous Mandatum antiphon.
id: tuesday-holy-week-benedictus-antiphon
text:
  la: "Ante diem festum * Paschæ, sciens Jesus quia venit hora ejus, cum dilexísset suos, in finem diléxit eos."
  en: "Before the feast of the Passover, * Jesus, knowing that His hour was come, having loved His own, loved them unto the end."
status:
  la: verified
  en: verified
