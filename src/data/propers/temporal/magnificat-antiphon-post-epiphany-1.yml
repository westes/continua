id: magnificat-antiphon-post-epiphany-1
text:
  la: "Fili, quid fecísti * nobis sic? Ego et pater tuus doléntes quærebámus te. Quid est quod me quærebátis? nesciebátis quia in iis, quæ Patris mei sunt, opórtet me esse?"
  en: "Son, why hast thou thus dealt with us? Behold, thy father and I have sought thee sorrowing. How is it that ye sought me? Wist ye not that I must be about my Father's business?"
