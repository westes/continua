# Read directly from web/www/horas/Latin/Tempora/Pasc7-3.txt's own
# [Ant 3] and its English counterpart. The source's own default
# (non-Cistercian/Dominican-rubric) text is used, not the alternate
# "Amen, amen dico vobis..." variant given alongside it.
id: magnificat-antiphon-ember-pentecost-wednesday
text:
  la: "Ego sum panis vivus, * dicit Dóminus, qui de cælo descéndi: si quis manducáverit ex hoc pane, vivet in ætérnum: et panis, quem ego dabo, caro mea est pro mundi vita, allelúja."
  en: "I am the Living Bread Which came down from heaven; * if any man eat of this Bread, he shall live for ever, and the Bread that I will give is My Flesh, Which I will give for the life of the world. Alleluia."
status:
  la: verified
  en: verified
