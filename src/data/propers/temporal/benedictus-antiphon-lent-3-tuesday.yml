id: benedictus-antiphon-lent-3-tuesday
text:
  la: "Si duo ex vobis * consénserint super terram: de omni re quamcúmque petíerint, fiet illis a Patre meo, dicit Dóminus."
  en: "If two of you shall agree on earth * as touching anything that they shall ask, it shall be done for them of My Father, saith the Lord."
