# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: magnificat-antiphon-holy-shroud
text:
  la: "Homo quidam dives ab Arimathæa, nómine Joseph, accépto córpore Jesu, involvit illud in sindone munda."
  en: "A certain rich man of Arimathea, named Joseph, having received the body of Jesus, wrapped it in a clean linen cloth."
