# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad2-3.txt.
id: collect-lent-2-wednesday
text:
  la: |
    Orémus.
    Pópulum tuum, quǽsumus, Dómine, propítius réspice: et quos ab escis carnálibus prǽcipis abstinére, a nóxiis quoque vítiis cessáre concéde.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Look down in mercy upon thy people, O Lord, we beseech thee, and grant unto them, whom Thou commandest to abstain from fleshly meats, power to abstain also from the corruption of sin.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
