# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
id: benedictus-antiphon-commemoration-of-the-passion
text:
  la: "Ad Jesum autem * cum veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus crura; sed unus mílitum láncea latus ejus apéruit, et contínuo exívit sanguis et aqua."
  en: "But when they came * to Jesus, and saw that he was already dead, they did not break his legs; but one of the soldiers opened his side with a lance, and immediately there came out blood and water."
status:
  la: verified
  en: draft
