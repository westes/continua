# Per-day proper of the Pentecost octave's day 5: web/www/horas/Latin/Tempora/Pasc7-4 (Thursday, day 5)'s [Ant 2] and its English counterpart.
# Picked by hours/resolve-common.ts's octaveDayProper (`-d<N>` = octave day number, Pentecost = 1); other days use the feast's own.
id: benedictus-antiphon-pentecost-sunday-d5
text:
  la: "Convocátis Jesus * duódecim discípulis suis, dedit illis virtútem et potestátem super ómnia dæmónia, et ut languóres curárent: et misit illos prædicáre regnum Dei, et sanáre infírmos, allelúja."
  en: "Jesus called His twelve disciples together, * and gave them power and authority over all devils, and to cure diseases and He sent them to preach the kingdom of God, and to heal the sick. Alleluia."
status:
  la: verified
  en: verified
