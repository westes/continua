id: magnificat-antiphon-lent-3-first
text:
  la: "Dixit autem pater * ad servos suos: Cito proférte stolam primam, et indúite illum, et date ánulum in manu ejus, et calceaménta in pédibus ejus."
  en: "But the father said to his servants: * Bring forth the best robe, and put it on him, and put a ring on his hand, and shoes on his feet."
