id: corpus-christi-magnificat-antiphon-first
text:
  la: "O quam suávis est, * Dómine, spíritus tuus, qui, ut dulcédinem tuam in fílios demonstráres, pane suavíssimo de cælo prǽstito, esuriéntes reples bonis, fastidiósos dívites dimíttens inánes."
  en: "O Lord, how kindly is thy Spirit; * even thine, Whose sustenance declared thy sweetness unto thy children when Thou didst send them from heaven bread tempering itself to every man's liking. O Thou, Who hast filled the hungry with good things, and the rich, that are proud in the imagination of their hearts, Thou hast sent empty away."
