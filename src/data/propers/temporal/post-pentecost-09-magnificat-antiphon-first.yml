id: post-pentecost-09-magnificat-antiphon-first
text:
  la: "Dum tólleret Dóminus * Elíam per túrbinem in cælum, Eliséus clamábat: Pater mi, currus Israël et auríga ejus."
  en: "When the Lord would take up * Elijah into heaven by a whirlwind, Elisha cried, and said: My father, my father, the chariot of Israel, and the horsemen thereof."
