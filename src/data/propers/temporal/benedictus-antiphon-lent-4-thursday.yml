text:
  la: "Ibat Jesus * in civitátem, quæ vocátur Naim: et ecce defúnctus efferebátur fílius únicus matris suæ."
  en: "Jesus went * into a city that is called Naim: and behold, a dead man was being carried out, the only son of his mother."
