text:
  la: "Filíoli mei, non diligámus verbo neque lingua, sed ópere et veritáte."
  en: "My little children, let us not love in word, neither in tongue, but in deed, and in truth."
citation:
  la: "1 Joann. 3:18"
  en: "1 John 3:18"
