id: thursday-after-ash-wednesday-benedictus-antiphon
text:
  la: "Dómine, * puer meus jacet paralýticus in domo, et male torquétur: Amen dico tibi, ego véniam, et curábo eum."
  en: "Lord, * my servant lieth at home sick of the palsy, and is grieviously tormented. Amen, I say unto thee, I will come and heal him."
