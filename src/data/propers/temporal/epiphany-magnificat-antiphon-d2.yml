id: epiphany-magnificat-antiphon-d2
text:
  la: "Vidéntes stellam Magi, * gavísi sunt gáudio magno: et intrántes domum, obtulérunt Dómino aurum, thus, et myrrham, allelúja."
  en: "When the wise men saw the star, * they rejoiced with exceeding great joy; and when they were come into the house, they presented unto the Lord gold, frankincense, and myrrh. Alleluia."
