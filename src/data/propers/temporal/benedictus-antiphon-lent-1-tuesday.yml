id: benedictus-antiphon-lent-1-tuesday
text:
  la: "Intrávit Jesus * in templum Dei, et eiciébat omnes vendéntes et eméntes: et mensas nummulariórum, et cáthedras vendéntium colúmbas evértit."
  en: "Jesus went into the temple of God, * and cast out all them that sold and bought, and overthrew the tables of the money-changers, and the seats of them that sold doves."
status:
  la: verified
  en: verified
