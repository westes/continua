# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2027-01-06); Latin and English both taken from the page.
id: epiphany-benedictus-antiphon
text:
  la: "Hódie * cælésti Sponso juncta est Ecclésia, quóniam in Jordáne lavit Christus ejus crímina: currunt cum munéribus Magi ad regáles núptias, et ex aqua facto vino lætántur convívæ, allelúja."
  en: "This day is the Church joined unto the Heavenly Bridegroom, * since Christ hath washed away her sins in Jordan; the wise men hasten with gifts to the marriage supper of the King; and they that sit at meat together make merry with water turned into wine. Alleluia."
status:
  la: verified
  en: verified
