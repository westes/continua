# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2027-01-05); Latin and English both taken from the page. First Vespers variant.
id: epiphany-magnificat-antiphon-first
text:
  la: "Magi vidéntes * stellam, dixérunt ad ínvicem: Hoc signum magni Regis est: eámus et inquirámus eum, et offerámus ei múnera, aurum, thus, et myrrham, allelúja."
  en: "When the wise men saw the star * they said one unto another: This is the sign of the Great King; let us go and search diligently for Him, and present unto Him gifts, gold, and frankincense, and myrrh. Alleluia."
status:
  la: verified
  en: verified
