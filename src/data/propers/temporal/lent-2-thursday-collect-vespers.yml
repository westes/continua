# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad2-4.txt.
id: lent-2-thursday-collect-vespers
text:
  la: |
    Orémus.
    Adésto, Dómine, fámulis tuis, et perpétuam benignitátem largíre poscéntibus: ut iis, qui te auctóre et gubernatóre gloriántur, et congregáta restáures et restauráta consérves.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Lord, help thy servants, and grant unto their prayers this abiding effect of thy mercy that as they do make their boast in thee, that it is Thou which hast created and dost govern them, so Thou wilt renew in them the gifts wherewith Thou didst bountifully endow them, and wilt preserve what Thou hast renewed.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
