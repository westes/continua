# Copy of benedictus-antiphon-most-precious-blood.yml: the Friday of Lent 4 keeps the office of the Most Precious Blood (Quad4-5-SanguisDNJC.txt is the one line @Sancti/07-DP, which is Sancti/07-01), so this is the same text under this feast's own id, for the commemoration lookup (temporal collect-<id> / benedictus- and magnificat-antiphon-<id>).
id: benedictus-antiphon-precious-blood-in-lent
text:
  la: "Accessístis * ad Sion montem, et civitátem Dei vivéntis, Jerúsalem cæléstem, et Testaménti novi mediatórem Jesum, et sánguinis aspersiónem mélius loquéntem quam Abel."
  en: "Ye are come * unto Mount Sion and unto the city of the living God, the heavenly Jerusalem, and to Jesus the Mediator of the New Covenant, and to the Blood of sprinkling That speaketh better things than that of Abel."
status:
  la: verified
  en: verified
