id: corpus-christi-magnificat-antiphon
text:
  la: "O sacrum convívium, * in quo Christus súmitur: recólitur memória passiónis ejus: mens implétur grátia: et futúræ glóriæ nobis pignus datur, allelúja."
  en: "Holy exceedingly is the Supper of the Lord, * wherein we do feed on Christ, do show his death till he come, do get grace abundantly to our souls, and do take pledge of the glory which shall hereafter be revealed in us, alleluia."
