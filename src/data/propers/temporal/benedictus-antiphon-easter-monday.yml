# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2027-03-29); Latin and English both taken from the page.
id: benedictus-antiphon-easter-monday
text:
  la: "Jesus junxit se * discípulis suis in via, et ibat cum illis: óculi autem eórum tenebántur, ne eum agnóscerent: et increpávit eos, dicens: O stulti et tardi corde ad credéndum in his, quæ locúti sunt Prophétæ, allelúia."
  en: "While they walked * Jesus drew near, and went with His disciples: but their eyes were holden that they should not know Him: and He rebuked them, saying: O fools, and slow of heart to believe all that the Prophets have spoken! Alleluia."
