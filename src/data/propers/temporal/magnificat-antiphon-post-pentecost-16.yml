id: magnificat-antiphon-post-pentecost-16
text:
  la: "Cum vocátus fúeris * ad núptias, recúmbe in novíssimo loco, ut dicat tibi qui te invitávit: Amíce, ascénde supérius. Et erit tibi glória coram simul discumbéntibus, allelúia."
  en: "When thou art bidden * of any man to a wedding, go and sit down in the lowest room, that he that bade thee may say: Friend, go up higher, then shalt thou have worship in the presence of them that sit at meat with thee, alleluia."
status:
  la: verified
  en: verified
