# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
id: magnificat-antiphon-crown-of-thorns-first
text:
  la: "Egredímini, et vidéte fíliæ Sion, regem Salomónem in diadémate quo coronávit eum mater sua, parans crucem Salvatóri suo."
  en: "Go forth, and see, ye daughters of Sion, king Solomon in the diadem wherewith his mother crowned him, preparing a cross for her Saviour."
status:
  la: verified
  en: draft
