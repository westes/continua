# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad4-2.txt.
id: lent-4-tuesday-collect-vespers
text:
  la: |
    Orémus.
    Miserére, Dómine, pópulo tuo: et contínuis tribulatiónibus laborántem propítius respiráre concéde.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Lord, have mercy upon thy people, and be graciously pleased to grant relief unto the same, who are ever toiling amid the storms of diverse tribulations.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
