id: magnificat-antiphon-ascension
text:
  la: "O Rex glóriæ, * Dómine virtútum, qui triumphátor hódie super omnes cælos ascendísti, ne derelínquas nos órphanos; sed mitte promíssum Patris in nos, Spíritum veritátis, allelúia."
  en: "O King of glory, * Lord of hosts, who hast this day exalted thine own self, with great triumph, above all the heavens, leave us not orphans, but send unto us the Promise of the Father, even the Spirit of truth, alleluia."
