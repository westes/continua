# Read directly from web/www/horas/Latin/Tempora/Pasc7-5.txt's own
# [Ant 2] and its English counterpart, echoing Lectio1's Gospel line
# (Luke 5:24). The source's own default (non-Cistercian/Dominican-rubric)
# text is used, not the alternate variant given alongside it.
id: benedictus-antiphon-ember-pentecost-friday
text:
  la: "Dixit Jesus: * Ut sciátis autem quia Fílius hóminis habet potestátem in terra dimitténdi peccáta, ait paralýtico: Tibi dico, surge: tolle lectum tuum, et vade in domum tuam, allelúja."
  en: "But that ye may know * that the Son of man hath power upon earth to forgive sins, He said unto the sick of the palsy: I say unto thee, Arise, take up thy couch, and go into thine house. Alleluia."
status:
  la: verified
  en: verified
