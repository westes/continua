text:
  la: "Malos male perdet, * et víneam suam locábit áliis agrícolis, qui reddant ei fructum tempóribus suis."
  en: "He will miserably destroy * those wicked men, and will let out His vineyard unto other husbandmen, which shall render Him the fruits in their seasons."
