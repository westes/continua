id: magnificat-antiphon-thursday-after-ash-wednesday
text:
  la: "Dómine, * non sum dignus ut intres sub tectum meum: sed tantum dic verbo, et sanábitur puer meus."
  en: "O Lord, * I am not worthy that thou shouldst enter under my roof: but only say the word, and my servant shall be healed."
