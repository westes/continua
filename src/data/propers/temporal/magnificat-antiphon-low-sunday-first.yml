# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-04-11); Latin and English both taken from the page. First Vespers variant; Second Vespers keeps easter-octave-magnificat-antiphon.yml ("Post dies octo").
id: magnificat-antiphon-low-sunday-first
text:
  la: "Cum esset sero * die illa una sabbatórum, et fores essent clausæ, ubi erant discípuli congregáti in unum, stetit Jesus in médio, et dixit eis: Pax vobis, allelúia."
  en: "Now when it was late * the same day, the first of the week, and the doors were shut, where the disciples were gathered together, for fear of the Jews, Jesus came and stood in the midst and said to them: Peace be to you, alleluia."
status:
  la: verified
  en: verified
