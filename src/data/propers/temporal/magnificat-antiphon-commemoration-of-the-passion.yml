# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
id: magnificat-antiphon-commemoration-of-the-passion
text:
  la: "Deponens Joseph * corpus Jesu involvit sindone, et pósuit eum in monuménto exciso. Fuit planctus magnus in illa die; mulíeres autem sedéntes contra sepulchrum dolebant, sicut doleri solet in morte primogeniti."
  en: "Joseph taking down * the body of Jesus wrapped it in a shroud, and laid him in a hewn sepulchre. There was great lamentation on that day; and the women, sitting over against the sepulchre, mourned, as one mourneth for the death of a firstborn."
status:
  la: verified
  en: draft
