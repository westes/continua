text:
  la: "Sic Deus * diléxit mundum, ut Fílium suum unigénitum daret: ut omnis, qui credit in ipsum, non péreat, sed hábeat vitam ætérnam, allelúja."
  en: "God so loved the world * that He gave His Only-begotten Son, that whosoever believeth in Him should not perish, but have everlasting life. Alleluia."
