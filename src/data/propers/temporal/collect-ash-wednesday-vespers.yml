# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own
# ([Oratio 2], see ash-wednesday-collect.yml) — read from
# web/www/horas/{Latin,English}/Tempora/Quadp3-3.txt. First file of this
# new `-collect-vespers` kind (hours/resolve-common.ts's getDayCollect,
# built 2026-09-19 specifically because this app previously had no
# per-hour collect-variation mechanism at all).
id: collect-ash-wednesday-vespers
text:
  la: |
    Orémus.
    Inclinántes se, Dómine, majestáti tuæ, propitiátus inténde: ut, qui divíno múnere sunt refécti, cæléstibus semper nutriántur auxíliis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Look graciously, O Lord, upon those who bow down before thy Divine Majesty, that they who have been refreshed by thy divine gift may always be sustained by heavenly aids.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
