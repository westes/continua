# Collect of The Holy Shroud of Our Lord Jesus Christ. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: collect-holy-shroud
text:
  la: |
      Orémus.
      Deus, qui nobis in sancta Sindone, qua corpus tuum sacratíssimum e cruce depositum, a Joseph involutum fuit, passiónis tuæ vestígia reliquísti: concéde propítius; ut per mortem et sepulturam tuam ad resurrectiónis glóriam perducamur:
      Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Let us pray.
      O God, who hast left us the traces of thy passion in the holy Shroud in which thy most sacred body, taken down from the cross, was wrapped by Joseph: mercifully grant that through thy death and burial we may be brought to the glory of the resurrection:
      Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
