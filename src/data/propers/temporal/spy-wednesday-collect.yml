# Read from the reference engine: web/www/horas/Latin/Tempora/Quad6-3.txt,
# [Oratio 2]. Cross-checked live against Divinum Officium (Monastic
# Tridentinum 1617), Lauds, real date 2026-04-01 (Wednesday of Holy Week
# that year) -- confirmed as the actual Lauds/ordinary-hours collect. This
# day's own Vespers collect ([Oratio 3], "Réspice, quǽsumus, Dómine,
# super hanc famíliam tuam...") is the very prayer the Triduum's Matins
# for Maundy Thursday/Good Friday/Holy Saturday all reuse as their own
# closing "Oratio Matutinum" -- see maundy-thursday-collect.yml -- but per
# this app's single-collect-per-day design, Wednesday itself keeps its own
# Lauds/ordinary-hours text here rather than that shared Vespers one.
id: spy-wednesday-collect
text:
  la: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, qui nostris excéssibus incessánter afflígimur, per unigéniti Fílii tui passiónem liberémur:
    Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant, we beseech Thee, almighty God, that we, who are unceasingly afflicted by reason of our own transgressions, may be set free through the Passion of Thine Only-begotten Son:
    Who liveth and reigneth with Thee in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
