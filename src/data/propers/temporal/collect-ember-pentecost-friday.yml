# Read directly from web/www/horas/Latin/Tempora/Pasc7-5.txt's own
# [Oratio] and its English counterpart. Standard "Per Dóminum..." closing
# spelled out in full (the source abbreviates it as "$Per Dominum
# eiusdem"), matching every other collect in this store.
id: collect-ember-pentecost-friday
text:
  la: |
    Orémus.
    Da, quǽsumus, Ecclésiæ tuæ, miséricors Deus: ut, Sancto Spíritu congregáta, hostíli nullátenus incursióne turbétur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O most merciful God, we beseech thee to grant unto thy Church that, forasmuch as she is gathered together in the Holy Ghost, no assaults of her enemies may be able to trouble her.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the same Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
