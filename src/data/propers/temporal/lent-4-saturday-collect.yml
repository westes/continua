# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-6.txt.
id: lent-4-saturday-collect
text:
  la: |
    Orémus.
    Fiat, Dómine, quǽsumus, per grátiam tuam fructuósus nostræ devotiónis afféctus: quia tunc nobis próderunt suscépta jejúnia, si tuæ sint plácita pietáti.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Lord, we pray thee, that thy grace may make fruitful the toil of this our godly exercise, since it shall nothing avail us to have fasted, if our Fast be not pleasing in thy most gracious sight.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
