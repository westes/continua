id: lent-3-thursday-benedictus-antiphon
text:
  la: "Exíbant autem dæmónia * a multis clamántia, et dicéntia, Quia tu es Christus Fílius Dei: et íncrepans non sinébat ea loqui, quia sciébant ipsum esse Christum."
  en: "And devils also came out of many, * crying out and saying: Thou art Christ, the Son of God. And He, rebuking them, suffered them not to speak, for they knew that He was Christ."
status:
  la: verified
  en: verified
