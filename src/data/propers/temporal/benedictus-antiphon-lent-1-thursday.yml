id: benedictus-antiphon-lent-1-thursday
text:
  la: "Egréssus Jesus * secéssit in partes Tyri et Sidónis: et ecce múlier Chananǽa a fínibus illis egréssa, clamábat dicens: Miserére mei, Fili David."
  en: "And Jesus went from thence * and retired into the coasts of Tyre and Sidon. And behold a woman of Canaan who came out of those coasts, crying out, said to him: Have mercy on me, O thou Son of David."
status:
  la: verified
  en: verified
