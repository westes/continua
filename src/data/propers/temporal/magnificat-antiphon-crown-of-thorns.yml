# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
id: magnificat-antiphon-crown-of-thorns
text:
  la: "Et genu flexo ante eum, illudebant ei, dicéntes: Ave Rex Judæórum; et exspuentes in eum, accepérunt arúndinem, et percutiébant caput ejus."
  en: "And bowing the knee before him, they mocked him, saying: Hail, King of the Jews; and spitting upon him, they took the reed, and struck his head."
status:
  la: verified
  en: draft
