# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2027-03-31); Latin and English both taken from the page.
id: magnificat-antiphon-easter-wednesday
text:
  la: "Dixit Jesus * discípulis suis: Afférte de píscibus, quos prendidístis nunc. Ascéndit autem Simon Petrus, et traxit rete in terram plenum magnis píscibus, allelúja."
  en: "Jesus saith * unto His disciples: Bring of the fish which ye have now caught. Simon Peter went up, and drew the net to land, full of great fishes, alleluia."
