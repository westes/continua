id: magnificat-antiphon-post-pentecost-08
text:
  la: "Quid fáciam, * quia dóminus meus aufert a me villicatiónem? Fódere non váleo, mendicáre erubésco. Scio quid fáciam, ut, cum amótus fúero a villicatióne, recípiant me in domos suas."
  en: "What shall I do? * For my lord taketh away from me the stewardship. I cannot dig, to beg I am ashamed. I am resolved what to do, that, when I am put out of the stewardship, they may receive me into their houses."
status:
