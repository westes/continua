# Read directly from web/www/horas/Latin/Tempora/Quad1-5.txt's own
# [Oratio 2] and its English counterpart -- the Lauds/ordinary-hours
# collect. Distinct Vespers text ([Oratio 3]) is now modeled too, see
# ember-lent-friday-collect-vespers.yml.
id: collect-ember-lent-friday
text:
  la: |
    Orémus.
    Esto, Dómine, propítius plebi tuæ: et, quam tibi facis esse devótam, benígno réfove miserátus auxílio.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Be gracious unto thy people, O Lord, and in thy mercy help all such as Thou hast called to be thine.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
