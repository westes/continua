id: easter-thursday-benedictus-antiphon
text:
  la: "María stabat * ad monuméntum plorans, et vidit duos Angelos in albis, sedéntes, et sudárium quod fúerat super caput Jesu, allelúja."
  en: "Mary stood without at the Sepulchre weeping, * and saw two Angels in white, sitting, and the napkin that had been about the Head of Jesus, alleluia."
