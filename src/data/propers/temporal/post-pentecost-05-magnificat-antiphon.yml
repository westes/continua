id: post-pentecost-05-magnificat-antiphon
text:
  la: "Si offers * munus tuum ad altáre et recordátus fúeris quia frater tuus habet áliquid advérsus te, relínque ibi munus tuum ante altáre, et vade prius reconciliári fratri tuo, et tunc véniens ófferes munus tuum, allelúja."
  en: "If thou bring thy gift to the Altar, * and there rememberest that thy brother hath aught against thee, leave there thy gift before the Altar, and go thy way; first be reconciled to thy brother, and then come and offer thy gift. Alleluia."
