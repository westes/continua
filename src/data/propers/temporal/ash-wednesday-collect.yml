# Lauds collect ([Oratio 2] in the source) — read from
# web/www/horas/{Latin,English}/Tempora/Quadp3-3.txt. See
# ash-wednesday-collect-vespers.yml for the distinct Vespers text
# ([Oratio 3]) and hours/resolve-common.ts's getDayCollect for the
# per-hour mechanism this pair now plugs into.
id: ash-wednesday-collect
text:
  la: |
    Orémus.
    Præsta, Dómine, fidélibus tuis: ut jejuniórum veneránda solémnia, et cóngrua pietáte suscípiant, et secúra devotióne percúrrant.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant, O Lord, to thy faithful people, that they may undertake with fitting piety the venerable solemnities of fasting, and complete them with steadfast devotion.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
