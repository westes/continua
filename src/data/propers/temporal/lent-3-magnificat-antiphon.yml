id: lent-3-magnificat-antiphon
text:
  la: "Extóllens vocem * quædam múlier de turba, dixit: Beátus venter qui te portávit, et úbera quæ suxísti. At Jesus ait illi: Quinímmo beáti, qui áudiunt verbum Dei, et custódiunt illud."
  en: "A certain woman of the company lifted up her voice and said: * Blessed is the womb that bare thee, and the paps which Thou hast sucked. But Jesus said unto her: Yea, rather, blessed are they that hear the word of God, and keep it."
status:
  la: verified
  en: verified
