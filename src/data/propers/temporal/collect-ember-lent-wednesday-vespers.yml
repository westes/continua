# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own
# ([Oratio 2], see ember-lent-wednesday-collect.yml) — read from
# web/www/horas/{Latin,English}/Tempora/Quad1-3.txt. Retrofitted
# 2026-09-19 alongside the wider Lent-ferias campaign, closing the gap
# ember-lent-wednesday-collect.yml's own header already flagged (this app
# previously had no per-hour collect-variation mechanism at all — see
# hours/resolve-common.ts's getDayCollect).
id: collect-ember-lent-wednesday-vespers
text:
  la: |
    Orémus.
    Mentes nostras, quǽsumus, Dómine, lúmine tuæ claritátis illústra: ut vidére possímus quæ agénda sunt; et, quæ recta sunt, ágere valeámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Lord, we beseech thee to cast thy bright beams of light upon our mind, that we may clearly see whatsoever things Thou wouldst have us to do, and have strength to do always that which is pleasing in thy sight.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
