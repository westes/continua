id: benedictus-antiphon-epiphany-d2
text:
  la: "Ab Oriénte * venérunt Magi in Béthlehem adoráre Dóminum: et apértis thesáuris suis, pretiósa múnera obtulérunt: aurum, sicut Regi magno; thus, sicut Deo vero; myrrham, sepultúræ ejus, allelúia."
  en: "There came wise men from the East to Bethlehem to worship the Lord * and when they had opened their treasures, they presented unto Him precious gifts; gold, as unto the Great King; frankincense as unto the true God; and myrrh for His burying. Alleluia."
