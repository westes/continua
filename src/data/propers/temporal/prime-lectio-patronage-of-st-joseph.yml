id: prime-lectio-patronage-of-st-joseph
text:
  la: "Fílius accréscens Joseph, fílius accréscens, et decorus aspectu: fíliæ discurrérunt super murum."
  en: "Joseph is a fruitful bough, a fruitful bough and comely to look upon, whose branches run over the wall."
citation:
  la: "Gen 49:22"
  en: "Gen 49:22"
status:
  la: verified
  en: verified
