# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
id: magnificat-antiphon-lance-and-nails
text:
  la: "Vere languóres nostros ipse tulit, et dolóres nostros ipse portávit: et nos putávimus eum quasi leprósum, et percússum a Deo, et humiliátum."
  en: "Surely he hath borne our infirmities and carried our sorrows: and we have thought him as it were a leper, and as one struck by God and afflicted."
status:
  la: verified
  en: draft
