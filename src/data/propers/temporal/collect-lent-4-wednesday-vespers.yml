# Vespers collect ([Oratio 3] in the source), distinct from Lauds' own —
# read from web/www/horas/{Latin,English}/Tempora/Quad4-3.txt.
id: collect-lent-4-wednesday-vespers
text:
  la: |
    Orémus.
    Páteant aures misericórdiæ tuæ, Dómine, précibus supplicántium: et, ut peténtibus desideráta concédas, fac eos, quæ tibi sunt plácita, postuláre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Let thy merciful ears, O Lord, be open unto the prayers of all them that entreat thee, and that Thou mayest grant us ever such things as we ask, teach us ever to ask such things as are pleasing in thy sight.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
