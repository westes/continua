# Collect of The Five Holy Wounds of Our Lord Jesus Christ. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). English is this project's own translation, marked draft.
id: collect-five-holy-wounds
text:
  la: |
      Orémus.
      Deus, qui unigéniti Fílii tui passióne et, per quinque Vúlnera ejus, sánguinis effusióne, humánam natúram peccáto pérditam reparásti: tríbue nobis, quǽsumus; ut, qui ab eo suscépta Vúlnera venerámur in terris, ejúsdem pretiosíssimi sánguinis fructum cónsequi mereámur in cœlis.
      Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Let us pray.
      O God, who, by the passion of thine only-begotten Son, and by the shedding of his blood through his five Wounds, hast restored human nature lost by sin: grant us, we beseech thee, that we who on earth venerate the Wounds he received may deserve in heaven to obtain the fruit of that same most precious blood.
      Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
