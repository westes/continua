id: magnificat-antiphon-septuagesima
text:
  la: "Dixit paterfamílias * operáriis suis: Quid hic statis tota die otiósi? At illi respondéntes dixérunt: Quia nemo nos condúxit. Ite et vos in víneam meam: et quod justum fúerit, dabo vobis."
  en: "The householder saith unto his labourers: * Why stand ye here all the day idle? But they answered and said: Because no man hath hired us. Go ye also into my vineyard, and whatsoever is right, that will I give you."
