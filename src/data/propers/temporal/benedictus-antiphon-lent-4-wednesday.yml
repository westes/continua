# Read directly from web/www/horas/Latin/Tempora/Quad4-3.txt's own
# [Ant 2] and its English counterpart.
id: benedictus-antiphon-lent-4-wednesday
text:
  la: "Rabbi, quid peccávit * homo iste, quod cæcus natus est? Respóndit Jesus, et dixit: Neque hic peccávit, neque paréntes ejus: sed ut manifesténtur ópera Dei in illo."
  en: "Rabbi, who did sin, this man, or his parents, * that he was born blind? Jesus answered, and said: Neither hath this man sinned, nor his parents; but that the works of God shall be made manifest in him."
status:
  la: verified
  en: verified
