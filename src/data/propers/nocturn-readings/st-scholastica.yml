# Matins Nocturn 2 reading for St. Scholastica, Virgin (Feb 10) —
# SanctiM/02-10.txt inherits the whole day (`@Sancti/02-10`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/02-10.txt, English/Sancti/02-10.txt.
# Lectio4-6 (St. Gregory the Great's account, from the Dialogues, of
# her final visit with St. Benedict) combined into one reading, one
# continuous excerpt. No responsory given in the source.
#
# Checked 2026-09-05 for a missing Gospel pairing: the plain Tridentine
# Sancti/02-10.txt has no Lectio7-9 at all (only Lectio4-6) -- Nocturn
# 3 isn't proper to this day and falls through to the Common of
# Virgins (C6a) undifferentiated, same as the day's own [Evangelium]
# tag (`@Commune/C6`) confirms. This reading is Nocturn 2 (the
# biographical excerpt from Gregory's Dialogues), which was never
# Gospel-paired in the first place -- that's Nocturn 3's role. No
# Gospel entry is added; there is no saint-specific one to pair.
id: st-scholastica
readings:
  - nocturn: 2
    isGospel: false
    source: "Pope St. Gregory the Great, Dialogues, Bk. 2, ch. 33"
    text:
      la: >-
        Scholástica, venerábilis patris Benedícti soror, omnipoténti Dómino ab ipso infántiæ
        témpore dedicáta, ad eum semel per annum veníre consuéverat; ad quam vir Dei non longe
        extra jánuam in possessióne monastérii descendébat. Quadam vero die venit ex more, atque
        ad eam, cum discípulis venerábilis ejus descéndit frater; qui totum diem in Dei láudibus
        sacrísque collóquiis ducéntes, incumbéntibus jam noctis ténebris, simul accepérunt
        cibum. Cumque adhuc ad mensam sedérent, et inter sacra collóquia tárdior se hora
        protráheret, éadem sanctimoniális fémina soror ejus eum rogávit, dicens: Quæso te, ut
        ista nocte me non déseras, ut usque mane de cæléstis vitæ gáudiis loquámur. Cui ille
        respóndit: Quid est quod lóqueris, soror? manére extra cellam nullátenus possum. Tanta
        vero erat cæli serénitas, ut nulla in áëre nubes appareret. Sanctimoniális autem fémina,
        cum verba fratris negántis pósuit, et caput in mánibus omnipoténtem Dóminum rogatúra
        declinávit. Cumque leváret de mensa caput, tanta coruscatiónis et tonítrui virtus, tántaque
        inundátio plúviæ erúpit, ut neque venerábilis Benedíctus, neque fratres, qui cum eo áderant,
        extra loci limen, quo conséderant, pedem movére potúerint.


        Sanctimoniális quippe fémina caput in mánibus declínans, lacrimárum flúvium in mensam
        fúderat, per quas serenitátem áëris ad plúviam traxit. Nec paulo tárdius post oratiónem
        inundátio illa secúta est; sed tanta fuit conveniéntia oratiónis et inundatiónis, ut de
        mensa caput jam cum tonítruo leváret; quátenus unum idémque esset moméntum, et leváre
        caput, et plúviam depónere. Tunc vir Dei inter corúscos et tonítruos atque ingéntis plúviæ
        inundatiónem, videns se ad monastérium non posse remeáre, cœpit cónqueri contristátus,
        dicens: Parcat tibi omnípotens Deus, soror: quid est quod fecísti? Cui illa respóndit:
        Ecce rogávi te et audíre me noluísti; rogávi Deum meum, et audívit me: modo ergo, si
        potes, egrédere et, me dimíssa, ad monastérium recéde. Ipse autem exíre extra tectum non
        valens, qui remanére sponte nóluit in loco, mansit invítus. Sicque factum est, ut totam
        noctem pervígilem dúcerent, atque per sacra spiritális vitæ collóquia, sese vicária
        relatióne satiárent.


        Cumque die áltero éadem venerábilis fémina ad cellam própriam recessísset, vir Dei ad
        monastérium rédiit. Cum ecce post tríduum, in cella consístens, elevátis in áëra óculis
        vidit ejúsdem soróris suæ ánimam de córpore egréssam in colúmbæ spécie cæli secréta
        penetráre. Qui, tantæ ejus glóriæ congáudens, omnipoténti Deo in hymnis et láudibus
        grátias réddidit, ejúsque óbitum frátribus denuntiávit. Quos étiam prótinus misit, ut
        ejus corpus ad monastérium deférrent, atque in sepúlcro, quod sibi ipsi paráverat,
        pónerent. Quo facto cóntigit, ut, quorum mens una semper in Deo fúerat, eórum quoque
        córpora nec sepultúra separáret.
      en: >-
        The worshipful Scholastica, the sister of our Father Benedict, was hallowed unto the Lord
        Almighty from a child. Her custom was to come to see her brother once every year. And when
        she came, the man of God went down unto her, not far from the gate, but, as it were,
        within the borders of his monastery. And there was a day when she came, as her custom was,
        and her worshipful brother went down to her, and his disciples with him. Then they passed
        the whole day together, praising God, and speaking one to the other of spiritual things.
        And when the night came, they brake bread together. And while they were yet at table, and
        conversed together on spiritual things, the hour was late. Then the holy woman his sister
        besought him, saying: Leave me not, I pray thee, this night, but let us speak even until
        morning of the gladness of the eternal life. He answered her: What is it that thou sayest,
        my sister? I can by no means remain out of my cell. Now the firmament was so clear that
        there were no clouds in the sky. Then the holy nun, when she had heard the words of her
        brother, that he would not abide with her, clasped her hands on the table, and laid her
        face on her hands, and besought the Lord Almighty. And it came to pass that when she lifted
        up her head from the table, there were great thunderings and lightnings, and a flood of
        rain, insomuch that neither the worshipful Benedict nor the brethren that were with him
        could move as much as a foot over the threshold of the place where they sat.


        Now when the holy woman laid her head in her hands upon the table, she wept bitterly, and
        as she wept, the clearness of the sky was turned to a tempest. As she prayed, immediately
        the flood followed. And the time was so, that she lifted up her head when it thundered, and
        when she had lifted up her head, the rain came. When the man of God saw that he could not
        return to his monastery, because of the lightnings, and thunderings, and the great rain,
        he was sorrowful and grieved, saying: Almighty God forgive thee, my sister; what is this
        that thou hast done? She answered him: Behold, I besought thee, and thou wouldest not
        hear; I besought my God, and He hath heard me; if, therefore, thou wilt, go forth, leave
        me alone, and go thy way to thy monastery. But he could not, and so he tarried in the same
        place, not willingly, but of necessity. And so it came to pass that they slept not all that
        night, but fed one another with discourse on spiritual things.


        And when the morning was come, the worshipful woman arose, and went unto her own cell, and
        the man of God went back to his monastery. And, behold, after three days he was sitting in
        his cell, and he lifted up his eyes to heaven, and saw the soul of his sister, delivered
        from the body, fly to heaven in a bodily shape like a dove. Wherefore he rejoiced because
        of the glory that was revealed in her, and gave thanks to Almighty God in hymns and
        praises, and made known to the brethren that she was dead. He commanded them also to go
        and take up her body, and bring it to his monastery, and lay it in the grave which he had
        made ready for himself. Whereby it came to pass that they twain who had ever been of one
        mind in the Lord, even in death were not divided.
    status: { la: verified, en: verified }
