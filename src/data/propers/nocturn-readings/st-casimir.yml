# Matins Nocturn 2 reading for St. Casimir, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/03-04.txt, English/Sancti/03-04.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-casimir
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Casimírus, patre Casimiro, matre Elisabetha Austriaca, Poloniæ regibus ortus, a
        pueritia sub optimis magistris, pietate et bonis artibus instructus, juveniles
        artus aspero domabat cilicio, et assiduis extenuabat jejuniis. Regii spreta
        lecti mollitie, dura cubabat humo, et clam intempesta nocte, præ foribus
        templorum pronus in terra divinam exorabat clementiam. In Christi contemplanda
        passione assiduus, Missarum solemniis adeo erecta in Deum mente solebat adesse,
        ut extra se rapi videretur.


        Catholicam promovere fidem summopere studuit, et Ruthenorum schisma abolere:
        quapropter Casimírum patrem induxit, ut legem ferret, ne schismatici nova templa
        construerent, nec vetera collabentia restaurarent. Erga pauperes et
        calamitatibus oppressos beneficus et misericors, patris et defensoris egenorum
        nomen obtinuit. Virginitatem, quam ab incunabulis servavit illæsam, sub extremo
        vitæ termino fortiter asseruit, dum gravi pressus infirmitate, mori potius quam
        castitatis jacturam ex medicorum consilio subire, constanter decrevit.


        Consummatus in brevi, virtutibus et meritis plenus, prænuntiato mortis die,
        inter sacerdotum et religiosorum choros' spiritum Deo reddidit, anno ætatis
        vigesimo quinto. Corpus Vilnam delatum multis claret miraculis. Etenim
        præterquam quod puella defuncta vitam, cæci visum, claudi gressum, et varii
        infirmi sanitatem ad ejus sepulchrum recuperarunt; Lithuanis exiguo numero ad
        potentissimi hostis insperatam irruptionem trepidantibus in aëre apparens,
        insignem tribuit victoriam. Quibus permotus Leo decimus eumdem Sanctorum
        catalogo adscripsit.
      en: >-
        This Casimir was the son of Casimir III, King of Poland, by Elizabeth of
        Austria, his wife, (and was born upon the 3rd day of October, in the year 1458.)
        From his childhood he was taught by the best masters, and was trained in all
        godliness and good learning. While he was still a boy he wore rough haircloth,
        and chastened himself with much fasting. He forsook the softness of his princely
        bed, and lay upon the hard ground, and on stormy nights he would go out secretly
        and prostrate himself before the doors of the churches, crying to God for mercy.
        He was unwearied in contemplating the Passion of Christ, and when he was present
        at Mass, so profound was his recollection, that he seemed to be altogether
        beside himself.


        He made the propagation of the Catholic faith one of the chief works of his
        life, and strove hard against the schism in Ruthenia. He persuaded his father to
        forbid by law that the schismatics should build any new churches, or repair the
        existing ones when they fell into decay. So great was his liberality and
        tenderness toward the needy and the afflicted, that he came to be called the
        father and guardian of the poor. From his infancy he never soiled his purity,
        and in his last illness, when his physicians advised him to seek for relief from
        his grievous sufferings by the sacrifice of his chastity, he cheerfully
        determined rather to die.


        Being made perfect in a short space, and full of piety and good works, he
        foretold the day of his own death, and, gathering round him a choir of priests
        and monks, he rendered his soul into the hands of God Whom they were praising,
        ~(upon the 4th day of March, in the year of our Lord 1482, and) the 25th of his
        own age. His body was carried to Wilna, where many miracles are reputed to have
        been wrought around it. At his grave a dead girl is said to have received her
        life again, blind men their sight, cripples the power of walking, and many sick
        folk health. Moreover, on an occasion when the Lithuanians in scanty numbers
        were exposed to the shock of a powerful enemy, they believed that he appeared in
        the air, and gave them the signal victory which they won. On the assurance of
        these things, Leo X. was moved to add his name to those of the Saints.
    status: { la: verified, en: verified }
