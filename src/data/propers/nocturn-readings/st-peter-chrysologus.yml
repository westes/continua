# Matins Nocturn 2 reading for St. Peter Chrysologus, Bishop, Confessor and Doctor of the Church. Sourced directly from
# web/www/horas/Latin/Sancti/12-04.txt, English/Sancti/12-04.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-peter-chrysologus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Petrus, qui ob auream ejus eloquéntiam Chrysólogi cognomen adeptus est, Foro
        Cornelii in Æmília honestis paréntibus natus, a prima ætate ánimum ad religiónem
        adjíciens, Cornelio Romano, tunc ejusdem urbis Corneliénsis episcopo, operam
        dedit: a quo etiam, sciéntia et vitæ sanctitáte cum brevi profecísset, diaconus
        creátus est. Postmodum contigit, ut Ravennates ob mortem archipræsulis sui alium
        (ut moris erat) ab eis eléctum Romam ad sanctum Xystum Papam tertium pro
        confirmatióne miserint una cum legátis suis et cum prædicto Cornelio, qui eumdem
        levitam secum perdúxit. Interim sanctus Petrus Apóstolus, et Martyr Apollináris
        summo Pontifici in somnis apparuérunt, mediúmque habéntes hunc juvenem,
        jussérunt, ut illum, et non alium, in archiepiscopum Ravennæ crearet. Hinc
        Pontifex, mox ut vidit Petrum, cognóvit eum a Dómino eo præeléctum: proptérea,
        rejecto illo quem ipsi offerébant, hunc solum, anno Christi quadringentésimo
        trigesimo tertio, illi metropolitanæ præfecit ecclésiæ. Quod cum legáti
        Ravennatenses ægre ferrent, audíta visióne, divinæ voluntáti libenter
        acquiescéntes, novum archiepiscopum maxima cum reveréntia suscepérunt.


        Petrus ígitur, licet invitus, in archipræsulem consecratus, Ravennam dedúcitur;
        ubi a Valentiniáno imperatóre, et a Galla Placidia ejus matre, ac ab universo
        pópulo maxima lætítia exceptus est. Et ille ab eis id unum pétere dixit, ut
        quando tantum oneris pro ipsórum salúte subire non recusávit, studérent ipsi
        mónitis suis obtemperare, divinisque præceptis non obsistere. Duórum Sanctórum
        tunc ibi defunctórum córpora optimis unguentis condíta sepelívit, Barbatiáni
        videlicet presbyteri, et Germani Antisiodorénsis epíscopi; cujus étiam cucúllam
        et cilícium sibi vindicávit in hereditátem. Projectum et Marcellinum in
        episcopos ordinávit. In Classe fontem exstruxit magnitúdinis vere admirábilis,
        et templa quædam magnifica ædificávit tum beato Andreæ Apóstolo, tum aliis
        Sanctis. Ludos ab homínibus personátis cum variis saltatiónibus Kaléndis
        Januarii fíeri sólitos concióne cohibuit acerrima; ubi inter alia illud præcláre
        dixit: Qui jocari volúerit cum diabolo, non póterit gaudere cum Christo. Jussu
        sancti Leónis Papæ primi scripsit póstea ad Chalcedonénse Concílium advérsus
        hæresim Eutychétis. Respóndit præterea ad Eutychen ipsum et alia epistola, quæ
        eidem concílio in novis editiónibus præfixa, et in annales ecclesiásticos reláta
        fuit.


        Dum publice sermónes haberet ad pópulum, adeo vehemens erat in dicendo, ut præ
        nimio ardore vox illi intérdum defécerit, sicut cóntigit in concióne mulíeris
        hæmorrhoíssæ. Unde Ravennates commóti, tot lácrimis, clamóribus et oratiónibus
        locum replevérunt, ut póstea ipse grátias ágeret Deo, quod in lucrum amoris
        verterit damnum ejusdem sermónis. Cum tandem annos circiter decem et octo eam
        ecclésiam sanctíssime rexísset, labórum suórum finem adesse divinitus
        prænoscens, in pátriam se cóntulit; ubi sancti Cassiáni templum ingréssus,
        magnum diadéma aureum gemmis distinctum pretiosíssimis offerens, super altáre
        majus pósuit, necnon aureum cratérem, et patenam argenteam, quam tum rábidi
        canis morsus, tum febres sanare sæpius expertum est, aqua inde demíssa. Ex tunc
        Ravennates, qui eumdem secúti fuerant, dimísit, ádmonens, ut in eligéndo optimo
        pastore invigilárent attente. Mox Deum humíliter precátus et sanctum Cassianum
        patronum, ut benígne ánimam ejus exciperet, quarto Nonas Decembris plácide ex
        hac vita migrávit, anno Dómini circiter quadringentésimo quinquagesimo. Sacrum
        illíus corpus, communi totius civitátis fletu ac pietáte prope corpus ejusdem
        sancti Cassiáni honorifice cónditum, nostris étiam tempóribus religiose cólitur:
        cujus tamen brácchium, auro et gemmis ornátum Ravennam delátum, in Ursiana æde
        venerátur.
      en: >-
        Peter, called in Greek Chrysologos, or, of the golden words, on account of his
        wonderful eloquence, was born of respectable parents at Imola, near Ravenna. He
        displayed a very early leaning to godliness, and became a disciple of Cornelius
        of Rome, Bishop of Imola. This Prelate, having experience of his learning and
        holiness of life, soon ordained him Deacon. On the death of the Archbishop of
        Ravenna, the people of that place elected a successor, and sent him, according
        to custom, to Rome, to be confirmed in his appointment by Pope Sixtus III. The
        Archbishop elect accordingly set forth, along with the ambassadors of the people
        of Ravenna and Cornelius, Bishop of Imola, attended by Peter the Deacon. While
        they were yet on the way, the holy Apostle Peter and Apollinaris the Martyr
        appeared to the Supreme Pontiff in a dream, leading a young man between them,
        whom they commanded him to make Archbishop. As soon as the embassy arrived at
        Rome the Pope knew in Peter the young man of his dream, chosen of God to the
        Archbishopric. Wherefore he set aside him that the people of Ravenna had
        presented, and preferred Peter to that Metropolitan Church, in the year of our
        Lord, 433. The ambassadors of the people of Ravenna took it ill, till they heard
        the vision then they gave themselves up to the will of God, and received the new
        Archbishop with great reverence.


        Peter being against his will consecrated Archbishop, arrived at Ravenna, where
        he was received with great joy by the Emperor Valentinian, the Empress-Mother
        Galla Placidia, and all the people. And this one thing he asked of them, that,
        as he, for the saving of their souls, had not refused to bear the heavy weight
        of the Archbishopric, so they would strive to follow his warnings, and live in
        submission to the law of God. He took the bodies of the two Saints, namely,
        Barbatian the Priest, and German, Bishop of Auxerre, and caused them to be
        embalmed with rich ointments and honourably buried, and he kept the cowl and
        haircloth shirt of German for a legacy for himself. At Classis, three miles from
        Ravenna, he built a Baptistery of extraordinary size, and several splendid
        churches, in honour of the blessed Apostle Andrew and other Saints. He preached
        a most severe sermon against the acting and dancing of guisards about New Year
        time, in which discourse he said among other things, He that jesteth with the
        devil will never rejoice with Christ. By command of Pope Leo I. he addressed an
        Epistle to the Council of Chalcedon against the heretic Eutyches. He also
        confuted Eutyches himself in another letter, which is likewise published in the
        new editions of the Acts of the Council, and is matter of Church History.


        When he preached in public his vehemence was such that he sometimes became
        speechless from excitement. This happened to him once when he was preaching on
        the subject of the woman who had an issue of blood. (Matth. ix. 20-22.) The
        congregation on this occasion were so wrought up, that they filled the whole
        place with tears, cries, and prayers, and Peter afterwards thanked God, Who had
        turned his failure to the profit of their souls. When he had ruled the Church of
        Ravenna in holiness for about eighteen years, God gave him knowledge that the
        end of his labours was at hand, and he returned to his home at Imola, to die.
        When he arrived at Imola, he entered the church of St. Cassian, and offered upon
        the High Altar a great circlet of gold, set with stones of great price, a golden
        chalice and a silver paten. Water poured out of these vessels hath often healed
        hydrophobia and fevers. Some of the people of Ravenna had followed the
        Archbishop, but he now dismissed them, with a charge to use great prudence in
        their choice of his successor. Then he fell to prayer, that God would mercifully
        receive his spirit, asking the same likewise for the sake of his patron St
        Cassian, and so he passed in peace to a better life, on a 2nd of December, about
        the year of our Lord 450. His holy body was buried, amid the sorrow and
        veneration of the whole city, hard by the remains of St. Cassian, where it lieth
        even to this day, guarded with great reverence. One arm was cut off and sent to
        Ravenna, where it is preserved in the Ursian Church, in a reliquary of gold and
        precious stones.
