# Matins Nocturn 2-3 readings for St. Joachim, Confessor, Father of
# the Blessed Virgin Mary (Aug 16). Sourced directly from
# web/www/horas/Latin/Sancti/08-16.txt, English/Sancti/08-16.txt.
# Nocturn 2: Lectio4-6, sermons by St. Epiphanius and St. John of
# Damascus on Ss. Joachim and Anne, combined into one reading.
#
# Update (2026-09-05): Nocturn 3's Gospel pericope, previously left
# unauthored because Lectio7 gives only the incipit ("Et réliqua"), is
# now authored too (isGospel: true, immediately before the homily) --
# fittingly, since this Nocturn's own homily (St. John of Damascus, on
# the Lord's genealogy) is a commentary specifically on this pericope,
# the citation is Matt 1:1-16 (Christ's genealogy per Matthew, not Luke
# 3's) per that same Lectio7 line; the full text is sourced from
# missa/Latin/Sancti/08-16.txt's own [Evangelium] (the Mass Gospel and
# the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
id: st-joachim
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Epiphanius, Discourse on the Praises of the Virgin; St. John of Damascus, 1st Sermon on the Birth of the BVM"
    text:
      la: >-
        De radíce Jesse ortus est rex David, et de tribu regis David sancta
        Virgo: sancta, inquam, et sanctórum virórum fília, cujus paréntes
        fuérunt Jóachim et Anna; qui quidem in vita sua Deo placuérunt, atque
        étiam fructum ejúsmodi germinavérunt, sanctam Vírginem Maríam, templum
        simul et matrem Dei. Jóachim porro, Anna et María, hi tres Trinitáti
        palam sacrifícium laudis offerébant. Jóachim enim interpretátur
        Præparátio Dómini, eo quod ex illo præparátum sit templum Dómini,
        nempe Virgo. Anna rursus simíliter Grátia interpretátur, proptérea
        quod Jóachim et Anna grátiam accepérunt, ut accedéntibus précibus,
        talem fructum germinárent, sanctam Vírginem adépti; Jóachim síquidem
        precabátur in monte, et Anna in horto suo.


        Quóniam futúrum erat ut Dei Génetrix et Virgo ex Anna orirétur, natúra
        grátiæ fœtum antevértere mínime ausa est; verum tantísper exspectávit,
        dum grátia fructum suum produxísset. Síquidem oportébat eam
        primogénitam in lucem edi, quæ rerum ómnium conditárum Primogénitum,
        in quo ómnia coagmentáta sunt, paritúra erat. O par beátum Jóachim et
        Anna! vobis omnis creatúra obstrícta est. Per vos enim donum, ómnium
        donórum præstantíssimum, Creatóri óbtulit, nempe castam matrem, quæ
        sola Creatóre digna erat.


        Exsúlta, Jóachim, quóniam ex fília tua Fílius natus est nobis; et
        vocátur nomen ejus magni consílii, hoc est, salútis totíus mundi
        Angelus. Pudóre afficiátur Nestórius, ac manum ori impónat. Puer hic
        Deus est. Quonam ígitur modo ea Dei Génetrix non sit, quæ péperit? Si
        quis sanctam Dei Genetrícem non confitétur, a Deitáte remótus est. Mea
        non est hæc orátio, quamquam alióqui mea; hanc enim diviníssimam
        hereditátem a theólogo patre Gregório accépi. O beátum par Jóachim et
        Anna! Ac profécto ex ventris vestri fructu immaculáti agnoscímini,
        quemádmodum Christus quodam loco dixit: Ex frúctibus eórum
        cognoscétis eos. Ut Deo gratum erat ac dignum ea quæ a vobis orta est,
        vitæ vestræ ratiónes instituístis. Caste enim ac sancte múnere vestro
        functi, virginitátis thesáurum produxístis.
      en: >-
        From the Root of Jesse sprang King David, and from the stock of King
        David, the Holy Virgin. Holy I call her, and the daughter of holy men.
        Her father and mother were Joachim and Anne, who pleased God in their
        lives, and brought forth an offspring well pleasing to Him, even the
        Holy Virgin Mary, at once the Temple and the Mother of God. These
        three, Joachim, Anne, and Mary, clearly offered up unto the Trinity a
        sacrifice of praise. For the name Joachim being interpreted,
        signifieth "the preparation of the Lord," and out of him was prepared
        the Temple of the Lord, namely, the Virgin. The name Anne signifieth
        grace, and she and Joachim did indeed receive a grace when, in answer
        to their prayers, they generated such an offspring, compassing the
        Holy Virgin. Joachim prayed upon the mountain and Anne in her garden.


        Since it was to be that the Virgin Mother of God should be born of
        Anne, nature dared not to produce any other child before this child of
        grace, but humbly waited until grace should have produced her's. It
        behoved that she should come into the world as a first-born, who was
        to bear the First-born of every creature, even Him by Whom all things
        were made. O blessed couple, Joachim and Anne, unto you is all
        creation laid under debt, since through you creation hath offered to
        the Creator this noblest of gifts, namely, that chaste mother, who
        alone was worthy of the Creator.


        Rejoice, O Joachim, from whose daughter a Child hath unto us been
        born, and His name is called The Angel of the Great Counsel, that is,
        of the salvation of the whole world. Let Nestorius be ashamed, and put
        his hand upon his mouth. Her Child is God. How then can His Mother be
        other than Mother of God? Whosoever acknowledgeth not the Holy Mother
        of God is far from God. This saying is not mine, although it is mine
        in all other senses than that of authority. I have received it as a
        most godly legacy from Father Gregory the Divine. O blessed couple,
        Joachim and Anne. Christ saith in a certain place: By their fruits ye
        shall know them; and ye are known by the fruit of your chaste loins.
        That that which should be born of you might be worthy and
        well-pleasing in the sight of God, ye ordered your own lives by rule.
        In the chaste and holy exercise of your natural gift, ye produced the
        treasure of virginity.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 1:1-16", en: "Matthew 1:1-16" }
    text:
      la: >-
        Liber generatiónis Jesu Christi, fílii David, fílii Abraham. Abraham génuit Isaac. Isaac
        autem génuit Jacob. Jacob autem génuit Judam et fratres ejus. Judas autem génuit Phares et
        Zaram de Thamar. Phares autem génuit Esron. Esron autem génuit Aram. Aram autem génuit
        Amínadab. Amínadab autem génuit Naásson. Naásson autem génuit Salmon. Salmon autem génuit
        Booz de Rahab. Booz autem génuit Obed ex Ruth. Obed autem génuit Jesse. Jesse autem génuit
        David regem. David autem rex génuit Salomónem ex ea, quæ fuit Uriæ. Sálomon autem génuit
        Róboam. Róboam autem génuit Abíam. Abías autem génuit Asa. Asa autem génuit Jósaphat.
        Jósaphat autem génuit Joram. Joram autem génuit Ozíam. Ozías autem génuit Jóatham. Jóatham
        autem génuit Achaz. Achaz autem génuit Ezechíam. Ezechías autem génuit Manássen. Manásses
        autem génuit Amon. Amon autem génuit Josíam. Josías autem génuit Jechoníam et fratres ejus
        in transmigratióne Babylónis. Et post transmigratiónem Babylónis: Jechonías génuit
        Saláthiel. Saláthiel autem génuit Zoróbabel. Zoróbabel autem génuit Abiud. Abiud autem
        génuit Elíacim. Elíacim autem génuit Azor. Azor autem génuit Sadoc. Sadoc autem génuit
        Achim. Achim autem génuit Eliud. Eliud autem génuit Eleázar. Eleázar autem génuit Mathan.
        Mathan autem génuit Jacob. Jacob autem génuit Joseph, virum Maríæ, de qua natus est Jesus,
        qui vocátur Christus.
      en: >-
        The book of the origin of Jesus Christ, the Son of David, the son of Abraham. Abraham
        begot Isaac, Isaac begot Jacob, Jacob begot Judas and his brethren. Judas begot Phares and
        Zara of Thamar, Phares begot Esron, Esron begot Aram. And Aram begot Aminadab, Aminadab
        begot Naasson, Naasson begot Salmon. Salmon begot Booz of Rahab. Booz begot Obed of Ruth,
        Obed begot Jesse, Jesse begot David the King. And David the king begot Solomon of the
        former wife of Urias. Solomon begot Roboam, Roboam begot Abia, Abia begot Asa. And Asa
        begot Josaphat, Josaphat begot Joram, Joram begot Ozias. And Ozias begot Joatham, Joatham
        begot Achaz, Achaz begot Ezechias. And Ezechias begot Manasses, Manasses begot Amon, Amon
        begot Josias. And Josias begot Jechonias and his brethren at the time of the carrying away
        to Babylon. And after the carrying away to Babylon, Jechonias begot Salathiel, Salathiel
        begot Zorobabel. And Zorobabel begot Abiud, Abiud begot Eliachim, Eliachim begot Azor. And
        Azor begot Sadoc, Sadoc begot Achim, Achim begot Eliud. And Eliud begot Eleazar, Eleazar
        begot Matthan, Matthan begot Jacob. And Jacob begot Joseph, the husband of Mary, and of her
        was born Jesus Who is called Christ.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. John of Damascus, Bk. IV on the Orthodox Faith, ch. 15 (on the Lord's genealogy)"
    text:
      la: >-
        Quod Joseph ex davídica tribu oríginem dúxerit, sanctíssimi Evangelístæ
        Matthǽus et Lucas líquido demonstrárunt. Verum, hoc inter eos
        discríminis est, quod Matthǽus ex Davíde per Salomónem Joséphum
        dedúcit; Lucas autem per Nathan. At vero sanctæ Vírginis ortum uterque
        siléntio prætériit. Quocírca scire óperæ prétium est, nec apud
        Hebrǽos nec apud Scriptúram sacram hoc in more pósitum fuísse, ut
        mulíerum genus recenserétur. Verum, hoc demum lege cautum erat ne
        tribus ulla uxóres ex áltera tribu accérseret. Ac proínde Joseph, qui
        ex tribu davídica ortum trahébat justitiámque colébat, sanctam
        Vírginem haudquáquam præter legis præscríptum despondísset, nisi ex
        eódem sceptro genus duxísset. Ob idque satis hábuit Evangelísta
        demonstrásse, unde Joseph ortum tráxerit.


        Igitur ex stirpe Nathan, fílii David, Levi génuit Melchi et
        Panthérem. Panther autem génuit Barpanthérem. Barpánther rursus
        génuit Jóachim. Jóachim dénique génuit sanctam Dei Genetrícem. Rursus,
        ex stirpe Salomónis, fílii David, Mathan ex uxóre sua génuit Jacob.
        Mórtuo autem Mathan, Melchi ex tribu Nathan, fílius Levi ac frater
        Panthéris, uxórem ipsíus Mathan, quæ étiam Jacóbi mater erat,
        matrimónio sibi copulávit, atque ex ea génuit Heli. Ita uteríni
        fratres erant Jacob et Heli; ille nimírum ex tribu Salomónis, hic ex
        tribu Nathan oriúndus.


        Porro Heli, qui ex tribu Nathan erat, nullis líberis suscéptis, e vita
        migrávit; eáque de causa Jacob ipsíus frater, qui ex tribu Salomónis
        flúxerat, ipsíus uxórem accépit, fratríque suo semen excitávit ac
        Joséphum progénuit. Joseph ítaque natúra quidem fílius Jacob erat, a
        Salomóne oriúndus; legis autem ratióne patrem habébat Heli, ex Nathan
        oriúndum. Quæ cum ita sint, Jóachim lectíssimam illam ac summis
        láudibus dignam mulíerem Annam matrimónio sibi copulávit. Verum,
        quemádmodum prisca illa Anna, cum sterilitátis morbo laboráret, per
        oratiónem ac promissiónem, Samuélem procreávit; eódem modo hæc étiam,
        per obsecratiónem et promissiónem, Dei Genetrícem a Deo accépit, ut
        ne hic quoque cuíquam ex illústribus matrónis céderet. Itaque grátia
        Dóminam parit. Vere étenim rerum ómnium conditárum Dómina facta est,
        cum Creatóris Mater éxstitit.
      en: >-
        That Joseph sprang from the lineage of David, the most holy
        Evangelists Matthew and Luke have clearly shown. There is this
        difference between them, that Matthew traceth the pedigree from David
        through Solomon, and Luke through Nathan. But both of them pass in
        silence over the descent of the Holy Virgin. In explanation of this we
        shall find on investigation that among the Jews, and in the Holy
        Scriptures, it hath never been in use to chronicle the pedigrees of
        women. But the Law containeth a warning against the tribes
        intermarrying one with another. Joseph was of the same tribe as
        David, and since he was a just man, he would not have espoused the
        Holy Virgin, unless she had been of the same race, as such an union
        would not have been in accordance with the commandment of the law.
        For this reason the Evangelist held it enough to have shown the
        descent of Joseph.


        Therefore, from the stock of Nathan the son of David, Levi begat
        Melchi and Panther; and Panther begat Bar-Panther. Bar-Panther begat
        Joachim; and Joachim begat the Holy Mother of God. Again, from the
        stock of Solomon the son of David, Mathan of his wife begat Jacob.
        And after Mathan was dead, Melchi, of the family of Nathan, son to
        Levi and brother to Panther, took to him in marriage her that had
        been the wife of Mathan, and was mother of Jacob, and begat of her
        Heli. So that Jacob and Heli were half-brothers, sons of the same
        mother, but one of the stock of Solomon and the other of the stock of
        Nathan.


        Then Heli, who was the descendant of Nathan, died, having had no
        children. Whereupon, Jacob, who was the descendant of Solomon, took
        to himself the widow of his half-brother Heli, to raise up seed unto
        his brother, and begat of her Joseph. So Joseph was by nature the son
        of Jacob the descendant of Solomon, but in the eye of the Law he had
        for his father Heli the descendant of Nathan. Things being thus,
        Joachim took to wife that most eminent and praiseworthy woman, Anne.
        And even as the patient Hannah, being stricken with barrenness, by
        prayer and promise became the mother of Samuel, so likewise this
        woman also through prayer and promise received from God the Mother of
        God, that in fruitfulness she might not be behind any of the famous
        matrons. And thus grace is mother of the Lady. And indeed she became
        the Lady of every creature, since she hath been mother of the
        Creator.
    status: { la: verified, en: verified }
