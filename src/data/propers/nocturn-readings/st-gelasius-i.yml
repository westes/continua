# Matins Nocturn 2 reading for St. Gelasius I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/11-29-GelasiusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-gelasius-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gelasius, gente Africanus, patre Valério, in Felícis tértii locum subrogatus, pontificátum
        gessit annos quátuor, menses octo, duodevigínti dies. Creávit in duplici ordinatióne
        diáconos duos, presbyteros trigínta et duos, sexagínta septem per divérsa loca epíscopos.
        Vir sane singulári fídei propagándæ ac servándæ zelo ardentissimus, omni litteratura,
        præsértim sacra, instructissimus, et intrepidi pectoris róbore, tum ad vindicanda Ecclésiæ
        et Sedis apostólicæ jura, tum ad retundendam hæreticórum et schismaticorum proterviam
        armatus.


        Ejus cura et stúdio non clerus modo plúrimum auctus est, verum étiam univérsa Ecclésia
        magnis increméntis adolévit. In quo certe illíus prudéntia mirábilis fuit, cum eo témpore
        Anastásius, imperator hæreticus, et Theodoricus Ariánus rerum utriúsque impérii potirentur.
        Imminente famis perículo, líbere annona Urbem recreavit. Lupercalia, aliáque Gentílium
        spectacula, quæ ad hæc usque témpora, post tam multa imperatorum edícta advérsus
        idololatríam lata, et Romanórum Pontíficum stúdia ad eam exstirpándam adhibita, viguisse
        constat, Andromacho senatore, aliísque Romanis frustra licet refragantibus, pénitus
        abolevit.


        Ália quamplurima ad dignitátem et disciplínam Ecclésiæ spectantia prǽstitit, sancívit, et
        scripsit. Defensores Acacii, Euphemium præsértim Constantinopolitánum damnávit; scriptísque
        ad diversos nervosissimis juxta atque doctíssimis lítteris, vel eos in offício continuit,
        vel aberrantes redúxit. Pelagianos, Manichæos et álios hæréticos coërcuit, eorúmque libros
        públicis flammis tradi curávit. Præter decretales et hymnos ecclesiásticos, egrégia scripsit
        opuscula contra Nestórium, Arium, Pelagium et Eutycheten. Sed illud præ céteris memorándum,
        quod libros canónicos ab áliis, et probatos ab apocryphis, in Romána synodo septuagínta
        episcopórum, singulári decréto distínxit. Post multos demum labóres in regenda universalia
        Ecclésia exantlatos, sanctíssimus et doctissimus Póntifex pie óbiit in Dómino undécimo
        Kaléndas Decémbris, anno Christi quadringentésimo nonagésimo sexto, et sepúltus est in
        Vaticáno.
      en: >-
        Gelasius, an African by race, his father Valerius, was put in the place of Felix the Third,
        and held the pontificate four years, eight months, and eighteen days. In a double ordination
        he created two deacons, thirty-two priests, and sixty-seven bishops for various places. A
        man indeed most ardent with singular zeal for propagating and preserving the faith, most
        instructed in all learning, especially sacred, and armed with the strength of an undaunted
        heart both to vindicate the rights of the Church and of the Apostolic See and to repel the
        insolence of heretics and schismatics.


        By his care and zeal not only the clergy was greatly increased, but the whole Church grew
        with great increase. In which his prudence was certainly wonderful, since at that time
        Anastasius, a heretic emperor, and Theoderic the Arian held the rule of both empires. When
        the danger of famine threatened, he freely relieved the City with grain. The Lupercalia and
        other pagan spectacles, which it is agreed had lasted down to those times, despite so many
        imperial edicts against idolatry and the zeal of the Roman Pontiffs to root it out, he
        abolished entirely, although Andromachus the senator and other Romans resisted in vain.


        Very many other things pertaining to the dignity and discipline of the Church he performed,
        ordained and wrote. The defenders of Acacius, especially Euphemius of Constantinople, he
        condemned; and by most forceful and most learned letters written to various persons, he
        either kept them to their duty or brought back those who strayed. The Pelagians, Manichaeans
        and other heretics he restrained, and caused their books to be given to public flames.
        Besides decretals and ecclesiastical hymns, he wrote excellent treatises against Nestorius,
        Arius, Pelagius and Eutyches. But this above all is to be remembered: that in a Roman synod
        of seventy bishops, by a singular decree, he distinguished the canonical books from the
        others, and the approved from the apocryphal. After many labours endured in ruling the
        universal Church, this most holy and most learned Pontiff piously died in the Lord on the
        eleventh day before the Kalends of December, in the year of Christ 496, and was buried in
        the Vatican.
    status: { la: verified, en: draft }
