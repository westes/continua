# Matins Nocturn 2 reading for St. Boniface I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/10-25-BonifaciusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-boniface-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bonifacius Románus, patre Jucundo presbytero, post beátum Zosimum humánis rebus exemptum,
        Románæ Ecclésiæ episcopátum adéptus est. Is annosus présbyter, ac in lege doctissimus,
        bonísque móribus comprobatus, invítus ac relúctans, totíus pópuli acclamatione, ac Turbis
        optimatum consénsu, a septuagínta presbyteris, novémque diversarum provinciarum epíscopis,
        divínæ institutiónis órdine servato, consecrátus est in basílica Júlii: quo témpore Eulalius
        archidiaconus, diaconibus circumventis, paucissimisque de clero, ac multitúdine turbátæ
        plebis, in locum sibi non débitum, per ambitum proruens, ordinátur in Constantiniána
        basílica. Eo in schísmate Bonifacius legitimus Póntifex veheménter depressus, coáctus est
        beáti Petri basílicam deserere, et una cum suis ad beáti Pauli secedere. Deláta mox causa ad
        episcopórum concílium, cum patres inter se dissiderent, pleniori synodo res tota servátur,
        jussis intérea, Honorii Augústi ópera, tum Bonifacio, tum Eulalio, ab Urbe discédere. Quare
        hic Antium, sanctæ Felicitátis basílicam ille pétiit.


        Sed cum Eulalius se in Urbem intrusisset, occasionemque præbuisset publicæ seditionis,
        Honorius, ea re commótus, Eulalium Urbe pellendum, Bonifacium vero in eam inducendum
        rescripsit; quod frequenti episcopórum synodo confirmátum fuit. Ítaque Bonifacius regréssus,
        sollícita cura conátus est cunctos in mutuam restituere concórdiam, cui et in futúrum
        consuluit, ne post óbitum suum graviori scissura distraheretur Ecclésia. Piissimorum autem
        imperatorum devotióne gaudebat, et contra inimícos grátiæ Dei, non solum apostólicis, sed
        étiam régiis utebátur edictis; et licet ipse doctissimus esset, advérsus libros tamen
        Pelagianorum, beáti Augustíni epíscopi responsa poscebat: cui et Augustínus tantum détulit,
        ut ei sua scripta non tam ediscenda, quam examinanda et emendanda direxerit.


        Patroclum Arelatensem epíscopum alienæ metropolis jura invadentem représsit; datisque
        lítteris ad Hilarium Narbonensem epíscopum jussit, ut jure metropolitani et apostólicæ Sedis
        præceptione ad pervasum locum accéderet, agendaque vidéret, et apostólicæ Sedi cuncta
        referret. Constítuit ne mulier vel monacha sacrata pallia contingeret aut lavaret; neve quis
        incénsum in ecclésia poneret, nisi miníster esset. Servum, vel cúriæ, vel rei cuilibet
        obnóxium, clericum fíeri vetuit. Fecit oratórium in cœmetério sanctæ Felicitátis Mártyris,
        juxta corpus ejus, cujus itémque sancti Sylvani sepulchrum ornávit, plúribus donis oblátis.
        Dénique fama celeberrimus, et grátia Dei plenus, ejúsdem glóriam adéptus est, Honório et
        Theodósio princípibus, sepultúsque in cœmetério sanctæ Felicitátis via Salária, octávo
        Kaléndas Novémbris. Semel mense Decémbri creávit presbyteros trédecim, diáconos tres,
        epíscopos per divérsa loca sex supra trigínta. Pontificátum ténuit annos quinque, minus
        duóbus ménsibus et tribus diébus.
      en: >-
        Boniface, a Roman, the son of the priest Jucundus, obtained the episcopate of the Roman
        Church after blessed Zosimus was taken from human affairs. An aged priest, most learned in
        the law, and approved by good morals, unwilling and reluctant, by the acclamation of the
        whole people and the consent of the multitude of nobles, by seventy priests and nine bishops
        of various provinces, the order of divine institution being kept, he was consecrated in the
        basilica of Julius: at which time Eulalius the archdeacon, the deacons having been
        circumvented, and a very few of the clergy and a multitude of the disturbed people, rushing
        by ambition into a place not due to him, was ordained in the Constantinian basilica. In that
        schism Boniface, the lawful Pontiff, being vehemently oppressed, was compelled to leave the
        basilica of blessed Peter, and to retire with his own to that of blessed Paul. The cause
        being soon brought to a council of bishops, when the fathers differed among themselves, the
        whole matter was reserved for a fuller synod, the Emperor Honorius meanwhile ordering both
        Boniface and Eulalius to depart from the City. Whence the latter went to Antium, the former
        sought the basilica of St. Felicity.


        But when Eulalius had thrust himself into the City, and given occasion for public sedition,
        Honorius, moved by the affair, wrote that Eulalius be expelled from the City, and Boniface
        led into it; which was confirmed by a numerous synod of bishops. And so Boniface, returned,
        endeavoured with solicitous care to restore all to mutual concord, and provided for the
        future that after his death the Church should not be torn by a graver rent. He rejoiced in
        the devotion of the most pious emperors, and against the enemies of the grace of God used
        not only apostolic but also royal edicts; and though he was himself most learned, he
        nevertheless asked the answers of blessed Augustine, bishop, against the books of the
        Pelagians: to whom Augustine so deferred that he sent him his writings not so much to be
        learned as to be examined and corrected.


        He repressed Patroclus, bishop of Arles, who was invading the rights of another metropolis;
        and by letters to Hilary, bishop of Narbonne, ordered him to go, by the right of
        metropolitan and the precept of the Apostolic See, to the invaded place, and see to what was
        to be done, and refer all to the Apostolic See. He ordained that a woman or nun should not
        touch or wash the sacred palls; nor should anyone place incense in the church unless he were
        a minister. He forbade a slave, or one bound to the curia or to any obligation, to become a
        cleric. He made an oratory in the cemetery of St. Felicity the Martyr, beside her body, and
        likewise adorned the sepulchre of St. Silvanus, with many gifts offered. At last, most
        celebrated for fame, and full of the grace of God, he obtained the same glory, in the time
        of the princes Honorius and Theodosius, and was buried in the cemetery of St. Felicity on
        the Salarian Way, on the eighth day before the Kalends of November. Once in the month of
        December he created thirteen priests, three deacons, and thirty-six bishops for various
        places. He held the pontificate five years, less two months and three days.
    status: { la: verified, en: draft }
