# Matins Nocturn 2 reading for St. Anastasius I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/04-27-AnastasiusIX.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-anastasius-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Anastásius Románus fílius Máximi, Siricio vita functo, Románæ Ecclésiæ est ordinátus
        epíscopus; quo eam præcláre regénte, de Oriéntis pártibus hæreticórum Origenistarum sæva
        tempéstas simplicitatem fídei, quæ Apóstoli voce laudata est, polluere et labefactáre conata
        est. Sed vir ditissimæ paupertátis et apostólicæ sollicitudinis Anastásius statim nóxium
        perculit caput, et sibilantia hydræ ora compescuit, latitantesque in foveis suis hæréticos
        persecútus, suis in Occidénte lítteris damnávit, quod erat in Oriénte damnatum. Nec illi
        umquam cura défuit Evangélii fidem circa suos custodíre pópulos, partesque pópuli sui, per
        quæque spatia divérsa terrárum diffusas, quantum póterat, lítteris conveníre, ne qua profanæ
        interpretationis orígo subreperet, quæ devotas ánimas immissa sui caligine labefactaret.


        Ad eum, atque Venerium, Mediolanénsis ecclésiæ sacerdótem, Africana synodus epíscopum
        legatum destinavit, ut eídem Africanæ ecclésiæ sacris ministris máxime indigenti,
        subveniretur, ne in divérsis pene emortuis plebibus (in quibus nec unus quidem diáconus, vel
        litteratus reperiebatur) innumerábiles ánimæ perirent. Ad eosdem Africanos epíscopos
        epístolam misit Anastásius, patérnæ et fraternæ caritátis sollicitúdine et sinceritate eos
        adhortans, ut hæreticórum et schismaticorum Donatistarum insídiis et improbitatibus (quibus
        Africanam ecclésiam cathólicam vexábant) nullo modo dissimularent. Hujus item sancti
        Pontíficis auctoritáte factum est, ut Donatistæ epíscopi, seu quilibet clérici, quantum ad
        ecclesiástica offícia pertineret, sic in cathólicam susciperentur unitátem, quemádmodum
        expedire viderétur iis, quorum salúti per eórum consulebatur offícium vel exercendum, vel
        omittendum.


        Constítuit nullatenus transmarinum hóminem in clericatus honórem sine quinque episcopórum
        chirographo suscipiendum. Itémque sancívit, ut quotiescumque sancta recitarentur Evangelia,
        sacerdótes non sederent, sed curvi starent. Fecit in Urbe basílicam Crescentianam in regióne
        secúnda, via Mamertina. Duábus ordinationibus mense Decémbri, creátis presbyteris octo,
        diáconis quinque, epíscopis per divérsa loca decem, quiévit in pace, sepultúsque est in
        cœmetério suo ad Ursum Pileátum, sub Arcadio et Honório: quem (ut sanctus Hierónymus
        scribit) diu Roma habére non méruit, ne orbis caput sub tali Epíscopo truncaretur: imo
        idcírco raptus est atque translátus, ne semel latam senténtiam précibus suis fléctere
        conaretur; nam haud multo post ejus óbitum, Roma a Gothis capta atque diruta fuit.
      en: >-
        Anastasius, a Roman, the son of Maximus, was ordained bishop of the Roman Church when
        Siricius had passed from life; and while he was nobly governing it, a savage storm of
        Origenist heretics from the regions of the East tried to pollute and shake the simplicity of
        the faith which was praised by the voice of the Apostle. But Anastasius, a man of richest
        poverty and apostolic solicitude, at once crushed the noxious head and silenced the hissing
        mouths of the hydra, and, pursuing the heretics lurking in their holes, he condemned in the
        West by his letters what had been condemned in the East. Nor was there ever lacking in him
        care to keep the faith of the Gospel among his peoples, and to address, as far as he could
        by letters, the parts of his people spread through various regions of the earth, lest any
        origin of profane interpretation creep in and shake devout souls by its imported darkness.


        To him, and to Venerius, priest of the church of Milan, the African synod sent a bishop as
        legate, that help might be given to the same African church, in great need of sacred
        ministers, lest in various almost lifeless congregations (in which not even one deacon or
        literate person was to be found) innumerable souls perish. To the same African bishops
        Anastasius sent a letter, exhorting them with the solicitude and sincerity of paternal and
        fraternal charity not in any way to overlook the snares and wickedness of the heretics and
        schismatic Donatists, with which they vexed the African Catholic church. By the authority
        likewise of this holy Pontiff it was brought about that Donatist bishops, or any clerics, as
        far as ecclesiastical offices were concerned, should be received into Catholic unity as
        seemed expedient for those whose salvation was being provided for through their office,
        whether to be exercised or omitted.


        He ordained that no man from overseas be received into the honour of the clergy without the
        written testimony of five bishops. He likewise decreed that whenever the holy Gospels were
        recited, priests should not sit but stand bowed. He built in the City the Crescentian
        basilica in the second region, on the Mamertine Way. After two ordinations in the month of
        December, in which he created eight priests, five deacons, and ten bishops for various
        places, he rested in peace, and was buried in his own cemetery at the Bear in the Cap, under
        Arcadius and Honorius: whom (as St. Jerome writes) Rome long did not deserve to have, lest
        the head of the world be cut off under such a Bishop; indeed, therefore he was snatched away
        and translated, lest he try to bend by his prayers a sentence already passed; for not long
        after his death, Rome was taken and ruined by the Goths.
    status: { la: verified, en: draft }
