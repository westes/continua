# Matins Nocturn 2 for "week II of November" (Tempora/112-0.txt) — see
# month-week-081.yml's header for the id scheme. In most years November's
# own week II is skipped entirely (month-week-id.ts's backward-from-Advent
# renumbering — live-verified 2026: Nov 8 resolves "III. Novembris", not
# "II"), so this file will rarely if ever surface for a real date; authored
# anyway since it has real content and a year could still reach it.
# Responsory reuses 111's own Responsory4 (source's own cross-reference).
id: month-week-112
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Jerome, Commentary on Ezekiel, Book 7"
    text:
      la: >-
        Quia supra dixerat: Ipsi dicunt ad me: Numquid non per parábolas lóquitur iste? et apertam
        pópulus flagitábat senténtiam: idcirco id quod Dóminus per metáphoram, sive parábolam, et, ut
        alii vertére, provérbium, est locútus, nunc manifestius lóquitur: saltus Nageb et Darom et
        Theman esse Jerúsalem, et templum illíus, sancta sanctórum et omnem terram Judǽæ; flammámque
        quæ combustúra sit saltum, intelligi gládium devorántem, qui edúctus sit de vagína sua, ut
        interfíciat justum et ímpium. Hoc est enim lignum víride, et lignum áridum. Unde et Dóminus: si
        in ligno, ait, víridi tanta fáciunt, in sicco quid fácient?


        Primum díxerat: Vaticináre, vel stilla ad Austrum, Áfricum et Meridiem et ad saltum
        Meridiánum. Quod quia videbátur obscúrum, et dicta Prophétæ pópulus nesciébat, secúndo pónitur
        manifestius, saltum Meridiánum esse Jerúsalem; et omnes infructuósas árbores, ad quarum
        radíces securis pósita sit, intellígi habitatóres ejus, gladiúmque interpretári pro incéndio.
        Tertio jubétur Prophétæ, ut tacéntibus illis nec interrogántibus cur ista vaticinátus sit,
        fáciat per quæ interrogétur, et respóndeat quæ Dóminus locútus est.


        Ingemísce, inquit, ejulare non levi voce nec dolóre moderáto, sed in contritióne lumbórum, ut
        gémitus tuus ex imis viscéribus et amaritúdine ánimi proferátur. Et hoc fácies coram eis, ut
        cum te interrogáverint, cur tanto gémitu conteráris, et quid tibi mali accíderit, ut sic
        ingemíscas; tu eis meo sermóne respóndeas: Idcirco plango et dolórem cordis mei dissimuláre non
        váleo, quia audítus, qui semper meis áuribus insonúerat, ópere complétur et venit, ímminens
        vidélicet Babylónii furéntis exércitus; qui cum vénerit et vallavérit Jerúsalem, tunc tabéscet
        omne cor, et dissolvéntur univérsæ manus: ut occupánte pavóre mentes hóminum, nullus áudeat
        repugnáre.
      en: >-
        In the foregoing chapter it is written: "Son of man, set thy face toward the way of Theman, and
        drop thy word toward Darom, and prophesy against the forest of the field of Nageb ... And all
        flesh shall see that I the Lord have kindled it: it shall not be quenched." Then said I: "Ah,
        Lord God, they say of me, Doth he not speak parables?" (20:46-49.) But now, as the people asked
        for something clearer, the Lord doth speak more openly that which He had uttered in what is
        diversely called metaphor, parable, or proverb: He showeth how that the forest of the field of
        Nageb, and Darom, and Theman, are figures of Jerusalem, and the Temple, and the Holy-of-Holies,
        and of all the land of Judah, and that by the flaming fire which should devour the forest, was
        to be understood that sword, which should be drawn out of the sheath, and should cut off from
        the land of Israel the righteous and the wicked. The righteous and the wicked are figured by
        the green tree and the dry tree. Whence also the Lord saith: "If they do these things in a
        green tree, what shall be done in a dry?" (Luke 23:31.)


        The first time He had said: "Set thy face toward the South, and drop thy word toward the South
        wind, and prophesy against the forest of the South." But forasmuch as this seemed dark, and the
        people knew not what the Prophet said, it is a second time stated more clearly that the forest
        of the South is Jerusalem, and all its unfruitful trees, unto whose roots the axe is being laid,
        are to be understood as figures of her inhabitants, and the fire to be kindled in it, to be
        interpreted the sword. A third time is the Prophet commanded that, when they should hold their
        peace, nor ask wherefore he prophesied thus, he should do that by which he should be questioned,
        and should answer that which the Lord had spoken.


        "Sigh," He saith, "cry aloud, not softly nor only half sorrowfully, but with the breaking of thy
        loins, that thy groaning may come from the depth of thy bowels and from the bitterness of thy
        soul." And this shalt thou do before them, that when they shall ask thee wherefore thou art
        afflicted with such lamentation, and what evil hath befallen thee that thou groanest thus, thou
        shalt answer them with My word, saying: I lament, and am not able to hide the grief of mine
        heart, because that that which hath ever sounded in mine ears will indeed be fulfilled, and
        cometh, even the host of the wrathful Babylonians which threateneth you; and when it shall have
        come, and shall have made trenches all round about Jerusalem, then every heart shall melt, and
        all hands shall be feeble, and horror shall take hold of the minds of men, and none shall dare
        to withstand.
    responsory:
      la: "R. Super muros tuos, Jerúsalem, constítui custódes; * Tota die et nocte non tacébunt laudáre nomen Dómini.\nV. Prædicábunt pópulis fortitúdinem meam, et annuntiábunt géntibus glóriam meam.\nR. Tota die et nocte non tacébunt laudáre nomen Dómini."
      en: "R. I have set watchmen upon thy walls, O Jerusalem; * Which shall never hold their peace day nor night, to praise the name of the Lord.\nV. They shall proclaim My might unto the nations, and declare My glory unto the Gentiles.\nR. Which shall never hold their peace day nor night, to praise the name of the Lord."
    status: { la: verified, en: verified }
