# Matins Nocturn 2 reading for St. Barnabas, Apostle (Jun 11) —
# SanctiM/06-11.txt's own Lectio4-6 resolve back to `@Sancti/06-11:Lectio3-5`
# (resliced), so this saint's own proper content is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-11.txt, English/Sancti/06-11.txt.
# Lectio4-6 combined into one reading, one continuous account drawn
# from Acts. No responsory given in the source.
#
# Verified 2026-09-05 (Gospel-pairing sweep): the secular Sancti/06-11.txt
# file (9-lesson day) DOES carry a genuine Nocturn 3 Gospel+homily —
# Lectio7 gives the pericope incipit (Matt 10:16-22, "Ecce ego mitto vos
# sicut oves in medio luporum. Et reliqua.") followed by St. John
# Chrysostom's homily on it, which continues across Lectio8-9 (combined
# below into one reading, a single continuous excerpt from his Homily 34
# on Matthew). SanctiM/06-11.txt's own 12-lesson scheme never reaches this
# far (its Lectio7-12 all resolve back to Sancti's earlier Lectio6-9's
# vita material, resliced differently), so this Gospel+homily pairing is
# pulled from the secular track exactly as the rest of this saint's
# proper content already is.
id: st-barnabas
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bárnabas Levítes, Cýprius génere, qui et Joseph, cum Paulo Géntium Apóstolus ordinátus
        est ad prædicándum Jesu Christi Evangélium. Is, agro véndito quem habébat, redáctam ex eo
        pecúniam áttulit Apóstolis. Missus autem Antiochíam prædicatiónis causa, cum ibi multos
        ad Christi Dómini fidem convérsos esse comperísset, incredibíliter lætátus, eos
        hortabátur ut in Christi fide permanérent. Qua cohortatióne multum proficiébat, quod ab
        ómnibus vir bonus et Spíritu Sancto plenus habebátur.


        Proféctus inde Tarsum ut quæreret Paulum, cum eo Antiochíam venit. In ejus urbis
        ecclésia annum commoráti, christiánæ fídei et vitæ illis homínibus præcépta dedérunt: ubi
        étiam Jesu Christi cultóres primum Christiáni sunt appelláti. Discípuli autem Pauli et
        Bárnabæ, suis facultátibus Christiános, qui in Judǽa erant, sustentábant, eo mitténtes
        pecúniam per Paulum et Bárnabam. Qui perfúncti illo caritátis offício, adhíbito Joánne,
        cui cognómen erat Marcus, rediérunt Antiochíam.


        Cum autem Antiochíæ in Ecclésia, cum céteris prophétis et doctóribus, Paulus et
        Bárnabas in jejúnio et oratióne Dómino deservírent, dixit Spíritus Sanctus: Segregáte
        mihi Saulum et Bárnabam in opus, ad quod assúmpsi eos. Tunc jejunántes et orántes,
        imponentésque eis manus, dimisérunt illos. Itaque Seleucíam venérunt, inde in Cyprum; ac
        multas prætérea urbes regionésque, prædicántes Evangélium summa cum audéntium utilitáte,
        peragrárunt. Postrémo Bárnabas digréssus a Paulo, una cum Joánne, qui cognominátus est
        Marcus, navigávit in Cyprum; ibíque círciter séptimum Nerónis annum, tértio Idus Júnii ad
        apostólici múneris laudem, martyrii corónam adjúnxit. Ejus corpus, Zenóne imperatóre,
        repértum est in ínsula Cypro; ad cujus pectus erat Evangélium Matthæi, Bárnabæ manu
        conscríptum.
      en: >-
        Joseph, who by the Apostles was surnamed Barnabas, which is, being interpreted, the Son
        of Consolation, a Levite and of the country of Cyprus, having land, sold it, and brought
        the money, and laid it at the Apostles' feet. When Paul, after his conversion, was come to
        Jerusalem, the disciples were all afraid of him, but Barnabas took him, and brought him to
        the Apostles. When tidings that a great number believed and turned unto the Lord at
        Antioch came unto the ears of the Church which was at Jerusalem, they sent forth Barnabas
        that he should go as far as Antioch. Who, when he came, and had seen the grace of God, was
        glad, and exhorted them all that with purpose of heart they would cleave unto the Lord.
        For he was a good man, and full of the Holy Ghost, and of faith, and much people was added
        unto the Lord.


        Then departed Barnabas to Tarsus for to seek Paul, and, when he had found him, he brought
        him unto Antioch. And it came to pass that a whole year they assembled themselves with the
        Church, and taught much people. And the disciples were called Christians first in
        Antioch. Then the disciples, every man according to his ability, determined to send
        relief unto the brethren which dwelt in Judea, which also they did, and sent it to the
        elders by the hands of Barnabas and Paul. And Barnabas and Paul returned from Jerusalem,
        when they had fulfilled their ministry, and took with them John, whose surname was Mark.


        Now there were in the Church that was at Antioch, certain Prophets and teachers and, as
        Paul and Barnabas, together with them, ministered to the Lord and fasted, the Holy Ghost
        said: Separate Me Barnabas and Saul for the work whereunto I have called them. And when
        they had fasted and prayed, and laid their hands on them, they sent them away. So they,
        being sent forth by the Holy Ghost, departed unto Seleucia; and from thence they sailed to
        Cyprus, in the which island, and in many other cities and countries, they journeyed about,
        preaching the Gospel with great gain to them that heard them. Nevertheless, at last, Paul
        and Barnabas departed asunder one from the other. And so Barnabas took Mark and sailed
        unto Cyprus once more. And there it was that upon a certain day in June, in or about the
        seventh year of the reign of Nero, Barnabas crowned the dignity of the Apostolate with the
        glory of martyrdom. During the reign of the Emperor Zeno, his body was found in its grave
        in Cyprus; on his breast lay a copy of the Gospel according to Matthew, written by the
        hand of Barnabas himself.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 10:16-22", en: "Matt 10:16-22" }
    text:
      la: >-
        In illo témpore: Dixit Jesus discípulis suis: Ecce ego mitto vos sicut oves in médio
        lupórum. Et réliqua.
      en: >-
        At that time: Jesus said unto His disciples: Behold, I send you forth as sheep in the
        midst of wolves. And so on.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. John Chrysostom, Patriarch of Constantinople, Homily 34 on Matthew"
    text:
      la: >-
        Cum Dóminus omnem sollicitúdinem a discipulórum córdibus ejécerit, et ostensióne
        signórum armáverit, atque, ab ómnibus negótiis sæculáribus alienátos et ab omni
        temporálium rerum cura liberátos, férreos quodámmodo atque adamántinos fécerit, tum
        dénique eventúra illis advérsa prædicit. Multa enim ex hac prædicatióne futurárum
        rerum cómmoda consequebántur. Primum, ut ejus præsciéntiæ vim edíscerent. Deínde, ut
        nemo suspicarétur, ex Magístri infirmitáte tam grávia mala descéndere. Prætérea, ne,
        qui ea passúri erant, súbito ac inopináto rerum evéntu perturbaréntur. Dénique, ne,
        cum ista sub ipsum passiónis suæ tempus audírent, nímium commoveréntur.


        Jam vero, ut intélligant novum hoc esse belli genus et insólitum præliándi morem,
        cum illos nudos mítteret, una indútos túnica, sine cálceis, absque virga et absque
        zona et pera, et ab excipiéntibus ali jubéret; non fecit hic dicéndi finem, sed
        inexplicábilem virtútem suam próferens, Etiam sic eúntes, inquit, mansuetúdinem
        tamen óvium osténdite, quamvis ad lupos itúri, nec simplíciter ad lupos, sed étiam in
        médio lupórum: (neque vero óvium tantum mansuetúdinem habére jubet, sed étiam
        colúmbæ simplicitátem); sic enim virtútem meam máxime osténdam, cum ab óvibus lupi
        superabúntur; et quamvis illæ sint in médio lupórum, et innúmeris móribus laceréntur,
        non modo non consúmptæ fúerint, verum étiam illos in sui natúram transmutáverint.


        Majus certe atque admirabílius est mentem adversariórum commutáre, et ánimum in
        divérsum transférre, quam illos occídere; præsértim cum duódecim tantum essent, et
        lupis plenus esset orbis univérsus. Erubescámus ígitur, qui, longe divérsa faciéntes,
        tamquam lupi in adversários rúimus. Nam, quámdiu oves fuérimus, víncimur; tunc enim a
        nobis pastóris auxílium recédit, qui non lupos, sed oves pascit.
      en: >-
        When the Lord had cleared the minds of His disciples of all care, and had armed them
        by showing forth His mighty works, had estranged them from all business of this
        world, and freed them from all anxiety touching the things of time, moulding them
        into a frame of iron-like, nay, diamondlike, hardness, then at length He told them of
        the contendings against the which they were afterward to wrestle. By this foretelling
        of things to come they were much holpen. First, they learnt the power of His
        fore-knowledge. Then, they were guarded against all suspicion that these great
        sorrows flowed from faultiness in their Master. Again, the future sufferers were made
        safe from all trouble of being taken unawares. Lastly, seeing that they heard these
        things at a time nigh to His own suffering, they were not over troubled.


        And now, that they may understand how that this is a new kind of warfare, and an
        unaccustomed manner of contending, when He sendeth them forth unarmed, providing
        neither gold, nor silver, nor brass in their purses nor scrip for their journey,
        neither two coats, neither shoes, nor yet staves, left to the hospitality of
        whosoever would receive them, He maketh not here an end to His discourse, but, in
        manifestation of His unspeakable power, He biddeth them, so going, to show forth the
        meekness of sheep, seeing they were about going unto wolves; neither simply unto
        wolves, but in the very midst of wolves. Neither is it only the meekness of sheep
        which He biddeth them have, but also the harmlessness of doves, that He might so much
        the more gloriously display His power, when the sheep overcame the wolves. These are
        the sheep which albeit they abide in the midst of wolves, and are mangled by many a
        bite, not only are not destroyed, but do gradually make the wolves change their
        nature, and become sheep themselves.


        Beyond all doubt it is a greater and more marvellous thing to change the minds of
        enemies, and to turn their thoughts round, than to kill them; more especially when
        the work is to be done by only twelve sheep, and the whole world is full of the
        wolves. Shame then upon us, whose deeds are so contrary, and who rather run like
        wolves upon our enemies. For so long as we are sheep we conquer; yea, though a
        thousand wolves be gathered round about us, we overcome, and are the conquerors; but
        if we become wolves ourselves, then are we conquered. For then doth the Shepherd's
        help forsake us, Who feedeth not wolves but sheep.
    status: { la: verified, en: verified }
