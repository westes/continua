# Matins Nocturn 2 reading for St. Barnabas, Apostle (Jun 11) —
# SanctiM/06-11.txt's own Lectio4-6 resolve back to `@Sancti/06-11:Lectio3-5`
# (resliced), so this saint's own proper content is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-11.txt, English/Sancti/06-11.txt.
# Lectio4-6 combined into one reading, one continuous account drawn
# from Acts. No responsory given in the source.
id: st-barnabas
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bárnabas Levítes, Cýprius génere, qui et Joseph, cum Paulo Géntium Apóstolus ordinátus
        est ad prædicándum Jesu Christi Evangélium. Is, agro véndito quem habébat, redáctam ex eo
        pecúniam áttulit Apóstolis. Missus autem Antiochíam prædicatiónis causa, cum ibi multos
        ad Christi Dómini fidem convérsos esse comperísset, incredibíliter lætátus, eos
        hortabátur ut in Christi fide permanérent. Qua cohortatióne multum proficiébat, quod ab
        ómnibus vir bonus et Spíritu Sancto plenus habebátur.


        Proféctus inde Tarsum ut quæreret Paulum, cum eo Antiochíam venit. In ejus urbis
        ecclésia annum commoráti, christiánæ fídei et vitæ illis homínibus præcépta dedérunt: ubi
        étiam Jesu Christi cultóres primum Christiáni sunt appelláti. Discípuli autem Pauli et
        Bárnabæ, suis facultátibus Christiános, qui in Judǽa erant, sustentábant, eo mitténtes
        pecúniam per Paulum et Bárnabam. Qui perfúncti illo caritátis offício, adhíbito Joánne,
        cui cognómen erat Marcus, rediérunt Antiochíam.


        Cum autem Antiochíæ in Ecclésia, cum céteris prophétis et doctóribus, Paulus et
        Bárnabas in jejúnio et oratióne Dómino deservírent, dixit Spíritus Sanctus: Segregáte
        mihi Saulum et Bárnabam in opus, ad quod assúmpsi eos. Tunc jejunántes et orántes,
        imponentésque eis manus, dimisérunt illos. Itaque Seleucíam venérunt, inde in Cyprum; ac
        multas prætérea urbes regionésque, prædicántes Evangélium summa cum audéntium utilitáte,
        peragrárunt. Postrémo Bárnabas digréssus a Paulo, una cum Joánne, qui cognominátus est
        Marcus, navigávit in Cyprum; ibíque círciter séptimum Nerónis annum, tértio Idus Júnii ad
        apostólici múneris laudem, martyrii corónam adjúnxit. Ejus corpus, Zenóne imperatóre,
        repértum est in ínsula Cypro; ad cujus pectus erat Evangélium Matthæi, Bárnabæ manu
        conscríptum.
      en: >-
        Joseph, who by the Apostles was surnamed Barnabas, which is, being interpreted, the Son
        of Consolation, a Levite and of the country of Cyprus, having land, sold it, and brought
        the money, and laid it at the Apostles' feet. When Paul, after his conversion, was come to
        Jerusalem, the disciples were all afraid of him, but Barnabas took him, and brought him to
        the Apostles. When tidings that a great number believed and turned unto the Lord at
        Antioch came unto the ears of the Church which was at Jerusalem, they sent forth Barnabas
        that he should go as far as Antioch. Who, when he came, and had seen the grace of God, was
        glad, and exhorted them all that with purpose of heart they would cleave unto the Lord.
        For he was a good man, and full of the Holy Ghost, and of faith, and much people was added
        unto the Lord.


        Then departed Barnabas to Tarsus for to seek Paul, and, when he had found him, he brought
        him unto Antioch. And it came to pass that a whole year they assembled themselves with the
        Church, and taught much people. And the disciples were called Christians first in
        Antioch. Then the disciples, every man according to his ability, determined to send
        relief unto the brethren which dwelt in Judea, which also they did, and sent it to the
        elders by the hands of Barnabas and Paul. And Barnabas and Paul returned from Jerusalem,
        when they had fulfilled their ministry, and took with them John, whose surname was Mark.


        Now there were in the Church that was at Antioch, certain Prophets and teachers and, as
        Paul and Barnabas, together with them, ministered to the Lord and fasted, the Holy Ghost
        said: Separate Me Barnabas and Saul for the work whereunto I have called them. And when
        they had fasted and prayed, and laid their hands on them, they sent them away. So they,
        being sent forth by the Holy Ghost, departed unto Seleucia; and from thence they sailed to
        Cyprus, in the which island, and in many other cities and countries, they journeyed about,
        preaching the Gospel with great gain to them that heard them. Nevertheless, at last, Paul
        and Barnabas departed asunder one from the other. And so Barnabas took Mark and sailed
        unto Cyprus once more. And there it was that upon a certain day in June, in or about the
        seventh year of the reign of Nero, Barnabas crowned the dignity of the Apostolate with the
        glory of martyrdom. During the reign of the Emperor Zeno, his body was found in its grave
        in Cyprus; on his breast lay a copy of the Gospel according to Matthew, written by the
        hand of Barnabas himself.
    status: { la: verified, en: verified }
