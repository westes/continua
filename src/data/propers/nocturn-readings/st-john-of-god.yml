# Matins Nocturn 2-3 readings for St. John of God, Confessor (Mar 8).
# Sourced directly from web/www/horas/Latin/Sancti/03-08.txt,
# English/Sancti/03-08.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 22:34-46) was a bare
# incipit ("Et réliqua"), so only the homily was authored (not marked
# isGospel), St. John Chrysostom's homily (Lectio7's homily + Lectio8-9
# combined).
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily), matching the newer
# convention set by ember-september-friday.yml/post-pentecost-16.yml.
# missa/Latin/Sancti/03-08.txt's own [Evangelium] is `@Tempora/Pent17-0`
# (17th Sunday after Pentecost) — Latin sourced from that file; English
# sourced directly from missa/English/Sancti/03-08.txt (given in full
# there, no redirect).
id: st-john-of-god
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánnes de Deo, ex catholicis piisque paréntibus in oppido Montis Majoris Junióris,
        regni Lusitaniæ, natus, quam sublimiter in sortem Dómini fúerit eléctus, insuetus
        splendor super ejus domo refulgens, sonitúsque æris campani sua sponte emissus, ab
        ipso nativitátis témpore non obscure prænuntiárunt. A laxiori vivéndi ratióne,
        divina operante virtúte, revocatus, magnæ sanctitátis exhibere specimen cœpit, et
        ob audítam prædicatiónem verbi Dei sic ad melióra se excitátum sensit, ut jam ab
        ipso sanctioris vitæ rudiménto consummátum aliquid perfectumque visus sit
        attigisse. Bonis ómnibus in páuperes carcéribus inclusos erogatis, admirábilis
        pœniténtiæ suique ipsíus contemptus cuncto pópulo spectaculum factus, a plerisque,
        ceu demens, gráviter afflíctus, in carcerem améntibus destinátum conjícitur. At
        Joánnes cælésti caritate magis incénsus, gemino atque amplo valetudinario ex
        piórum eleemosynis in civitáte Granaténsi exstructo, jactoque novi ordinis
        fundaménto, Ecclésiam nova prole fœcundávit fratrum Hospitalitátis, infirmis
        præcláro animárum corporúmque profectu inserviéntium, et longe lateque per orbem
        diffusórum.


        Paupéribus ægrotis, quos propriis quandoque humeris domum deferebat, nulla re ad
        ánimæ corporisque salútem profícua déerit. Effusa quoque extra nosocomíum caritate
        indigéntibus muliéribus viduis, et præcipue virgínibus periclitántibus clam
        aliménta subministrabat, curamque indefessam adhibebat, ut carnis concupiscéntiam
        a próximis hujusmodi vítio inquinátis exterminaret. Cum autem maximum in regio
        Granaténsi valetudinario excitátum fuísset incendium, Joánnes impávidus prosiliit
        in ignem, huc illuc discurrens, quoúsque tum infirmos humeris exportatos, tum
        lectulos e fenestris projectos ab igne vindicávit, ac per dimidiam horam inter
        flammas, jam in immensum succrescéntes, versatus, exínde divínitus incólumis,
        univérsis civibus admirántibus exívit; in schola caritátis édocens, segniórem in
        eum fuísse ignem qui foris ússerat, quam qui intus accenderat.


        Multiplici asperitátum genere, demissíssima obediéntia, extrema paupertáte,
        orándi studio, rerum divinárum contemplatióne, ac in beátam Vírginem pietáte
        mirifice excelluit, et lacrimárum dono enituit. Denique gravi morbo correptus,
        ómnibus Ecclésiæ sacramentis rite sancteque refectus, viribus licet destitútus,
        propriis indútus vestibus, e léctulo surgens ac provolutus in genua, manu et corde
        Christum Dóminum e cruce pendentem perstringens, octavo Idus Martii anno millesimo
        quingentésimo quinquagesimo obiit in osculo Dómini; quem étiam mórtuus ténuit, nec
        dimísit, et in eádem corporis constitutióne sex circiter horas, quoúsque inde
        dimotus fuísset, tota civitáte inspectante, mirabíliter permansit, odórem mire
        fragrántem diffúndens. Quem ante et post óbitum plurimis miraculis clarum,
        Alexander octavus Pontifex maximus in Sanctórum númerum rétulit; et Leo décimus
        tertius, ex Sacrórum catholici orbis antístitum voto ac Rituum Congregatiónis
        consulto, cælestem ómnium hospitalium et infirmórum ubíque degéntium patronum
        declarávit, ipsiúsque nomen in agonizántium litaníis invocari præcepit.
      en: >-
        John of God was born of Catholic and godly parents in the town of Montemor in
        Portugal. The lot to which God had elected him was foreshown at his birth by a light
        shining over the house, and by the ringing of a bell untouched by human hands. He
        fell at one time into a loose habit of life, but was recalled by the grace of God,
        and began to show tokens of true reformation. By hearing the Word of God, he so felt
        himself stirred up to strive after nobler things, that he considered not that to
        which he had already attained, and yearned to be perfect, as our Father in heaven is
        perfect. He gave away all his property to the poor and prisoners, and became a
        gazing-stock to all that knew him, by the strength of his repentance, and the depth
        of his self-contempt. On this account he was commonly supposed to be mad, and was
        once shut up in a lunatic asylum. He was only the more filled with schemes of
        charity, and collected, by begging, funds sufficient to build a large double
        Hospital in the town of Granada. Here he founded the new Order of Hospital Brethren
        with which he enriched the Church. These Brethren are now spread throughout all
        parts of the world, and engaged in ministering to the souls and bodies of the sick.


        He strove to get for the sick poor, whom he sometimes brought to the Hospital on his
        own shoulders, whatever was needful for their souls or bodies. His charity was
        extended to the poor outside of his institution, and he used to supply food
        privately to necessitous widows, and more so to young women whose virtue was
        tempted on account of their poverty. He was most careful in encouraging the virtue
        of purity in all whom he knew. On one occasion when there was a great fire in the
        hospital at Granada, John bravely entered the burning house, ran from one part of
        it to another, carried out the sick on his shoulders, and threw the beds out of the
        windows, and finally, after passing half-an-hour in the midst of the flames, which
        were now raging with great violence, by the mercy of God left the building
        uninjured, to the great wonder of all the citizens; thereby to teach all them that
        love God that the fire which burnt in his heart gave him strength to risk the fire
        which threatened him from without.


        He was a marked example of every kind of austerity, of the most lowly obedience, of
        the deepest voluntary poverty, of the most constant prayer, of ghostly
        contemplation, and of love towards the Blessed Virgin. He was distinguished for the
        gift of tears. Being at last seized by deadly sickness, he duly received, with
        saintly affection, all the Sacraments of the Church. After all strength seemed to
        have left him, he got out of his bed, put on his own clothes, and knelt down before
        an image of the Lord Christ hanging on the Cross. Round it he threw his arms and
        pressed it against his heart, and in this position, as it were in the kiss of the
        Lord, he died, on the 8th day of March 1550. After his death his body did not leave
        its grip of the crucifix until it was forcibly taken away, six hours after. During
        these six hours all the inhabitants of the city came to see it, and noticed a
        savour of strange sweetness proceeding from it. His name was illustrious as a
        worker of miracles both before and after his death, and the Supreme Pontiff
        Alexander VIII added it to those of the Saints, and Leo XIII, at the desire of the
        Bishops of the Catholic world, and in accordance with a vote of the Congregation of
        Rites, declared him the patron in heaven of all the sick and those who nurse them,
        wheresoever dwelling, and ordered that his name should be called upon in the Litany
        for the dying.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 22:34-46", en: "Matt 22:34-46" }
    text:
      la: >-
        In illo témpore: Accessérunt ad Jesum pharisǽi: et interrogávit eum unus ex eis
        legis doctor, tentans eum: Magíster, quod est mandátum magnum in lege? Ait illi
        Jesus: Díliges Dóminum, Deum tuum, ex toto corde tuo et in tota ánima tua et in tota
        mente tua. Hoc est máximum et primum mandátum. Secúndum autem símile est huic:
        Díliges próximum tuum sicut teípsum. In his duóbus mandátis univérsa lex pendet et
        prophétæ. Congregátis autem pharisǽis, interrogávit eos Jesus, dicens: Quid vobis
        vidétur de Christo? cujus fílius est? Dicunt ei: David. Ait illis: Quómodo ergo
        David in spíritu vocat eum Dóminum, dicens: Dixit Dóminus Dómino meo, sede a dextris
        meis, donec ponam inimícos tuos scabéllum pedum tuórum? Si ergo David vocat eum
        Dóminum, quómodo fílius ejus est? Et nemo poterat ei respóndere verbum: neque ausus
        fuit quisquam ex illa die eum ámplius interrogáre.
      en: >-
        At that time, the Pharisees came to Jesus and one of them, a doctor of the Law,
        putting Him to the test, asked Him, Master, which is the greatest commandment in the
        Law? Jesus said to him, "You shall love the Lord your God with your whole heart and
        with your whole soul, and your whole mind." This is the greatest and first
        commandment. And the second is like it, "You shall love your neighbor as yourself."
        On these two commandments depend the whole Law and the Prophets. Now while the
        Pharisees were gathered together, Jesus questioned them, saying, What do you think
        of the Christ? Whose son is He? They said to Him, David's. He said to them, How then
        does David in the Spirit call Him Lord, saying, "The Lord said to my Lord: Sit at My
        right hand, till I make Your enemies Your footstool"? If David, therefore, calls Him
        "Lord," how is He his son? And no one could answer Him a word; neither did anyone
        dare from that day forth to ask Him any more questions.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. John Chrysostom, Homily 72 on Matthew (on Matt 22:34-46)"
    text:
      la: >-
        Sadducæis confúsis, pharisæi rursus aggrediúntur; cumque quiéscere oporteret,
        decertare voluérunt: et legis perítiam profitentem præmittunt, non discere, sed
        tentare cupiéntes; ac ita intérrogant: Quodnam primum mandátum in lege sit. Nam cum
        primum illud sit, Diliges Dóminum Deum tuum: putántes causas sibi allatúrum ad
        mandátum hoc corrigéndum, aliquid addendo, quóniam Deum se faciebat, hoc modo
        intérrogant. Quid ígitur Christus? Ut ostendat idcirco ad hæc eos devenisse, quia
        nulla in eis esset caritas, sed invidiæ livore tabéscerent: Diliges, inquit,
        Dóminum Deum tuum: hoc primum et magnum mandátum est. Secúndum autem simile huic:
        Diliges próximum tuum sicut teípsum.


        Quam ob rem simile est huic? Quóniam hoc illud inducit, et ab illo rursus munítur.
        Quicúmque enim male agit, ódio habet lucem, et non venit ad lucem. Et rursus: Dixit
        insípiens in corde suo, Non est Deus. Deínde sequitur: Corrúpti sunt, et
        abominábiles facti sunt in stúdiis suis. Et íterum: Radix ómnium malórum avarítia
        est; quam quidam appeténtes, erravérunt a fide. Et, Qui díligit me, mandáta mea
        servábit: quorum caput et radix est: Diliges Dóminum Deum tuum, et próximum tuum
        sicut teípsum.


        Si ergo diligere Deum, diligere proximum est (nam si diligis me, o Petre, inquit,
        pasce oves meas): si étiam dilectio proximi facit ut mandata custodias: merito ait
        in his totam legem et prophetas pendere. Et quemadmodum in superioribus, cum de
        resurrectione interrogaretur, plus docuit quam tentantes petebant: sic in hoc loco
        de primo interrogatus mandato, secundum étiam non valde quam primum inferius,
        sponte attulit: secundum enim est primo simile. Ita occulte insinuavit, odio illos
        ad quærendum incitari. Caritas enim, inquit, non gemulatur.
      en: >-
        When the Pharisees had heard that Christ had put the Sadducees to silence, they
        gathered themselves together for a fresh attack; just when it behoved them to be
        quiet, they willed to contend; and so they put forward one of themselves, who
        professed skill in the law, not wishing to learn, but to lay a snare. This person
        therefore proposed the question Which is the great commandment in the law? The
        first and great commandment is Thou shalt love the Lord thy God, but they expected
        that He would make some exception or addition to this in His Own case, since He
        made Himself God. With this expectation they asked Him the question: But what said
        Christ? To show that they had adopted this course, because they were loveless, and
        sick with envy, He answered Thou shalt love the Lord thy God with all thy heart, and
        with all thy soul, and with all thy mind. This is the first and great commandment.
        And the second is like unto it Thou shalt love thy neighbour as thyself.


        Mighty is this second commandment like unto the first? Because the first is the
        second's source and sanction. For every one that doeth evil hateth the light,
        neither cometh to the light. And again The fool hath said in his heart There is no
        God and there followeth They are corrupt, and become abominable in their works. And
        yet again: The love of money is the root of all evil; which while some coveted
        after, they have erred from the faith. And yet once more: If ye love Me, keep My
        commandments, of which commandments the head and root is Thou shalt love the Lord
        thy God; and thy neighbour as thyself.


        If therefore, to love God is to love our neighbour also, as it appeareth where it
        is written Simon, son of Jonas, lovest thou Me? And he said unto Him Lord, Thou
        knowest all things; Thou knowest that I love thee. Jesus saith unto him Feed My
        sheep, and if love is the fulfilling of the law, justly doth the Lord say that on
        these two commandments hang all the law and the Prophets. And even as when, before
        this, being interrogated about the Resurrection, He answered them more than they
        asked, so, now, being interrogated concerning the first and great commandment, He
        answereth them, of His own accord, touching that second one also, which is little
        lower than the first, for the second is like unto it. Herein He would have them
        understand that it was hatred stirred them up to question Him. For Charity, saith
        the Apostle, envieth not.
    status: { la: verified, en: verified }
