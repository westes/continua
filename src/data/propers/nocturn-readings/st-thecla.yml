# web/www/horas/Latin/Sancti/09-23cc.txt, English/Sancti/09-23cc.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-thecla
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Thecla virgo, ex illustribus paréntibus Iconii nata, a Paulo Apóstolo fidei præceptis
        instituta, miris sanctórum Patrum laudibus celebrátur. Quæ décimum octavum annum
        agens, Thamíride sponso relícto, cum eam paréntes, quod Christiana esset,
        accusassent, in ardentem rogum, qui, nisi Christo renuntiáret, ei parátus erat, prius
        signo crucis armata, seipsam injecit. Sed igne, plúvia quæ repénte exorta est,
        exstincto, Antiochíam venit; ubi, feris objecta et tauris in diversa incitátis
        alligata, mox conjecta in fossam plenam serpéntibus, ex ómnibus Jesu Christi grátia
        liberátur. Cujus ardore fidei et vitæ sanctitáte multi ad Christum convérsi sunt.
        Iterum in pátriam rédiens, in montem sola secessit. Deínde, multis virtútibus et
        miraculis insígnis, nonagenaria migrávit ad Dóminum, ac Seleucíæ sepúlta est.
      en: >-
        This virgin Thecla was the daughter of noble parents at Iconium, and a disciple of the
        Apostle Paul. She is the subject of extraordinary praises by the holy Fathers. In the
        eighteenth year of her age, she parted from one Thamiris, to whom she had been
        betrothed, and her kindred accused her of being a Christian. A pile was set a-fire for
        her, unless she should deny Christ, but she made the sign of the Cross, and willingly
        entered it, and rain came, and put out the fire. She came to Antioch, where they threw
        her to wild beasts; and strove to tear her asunder, by tying her to oxen driven
        different ways; and cast her into a pit with many snakes; but by the mercy of Jesus
        Christ she was delivered from all. The warmth of her faith and the holiness of her life
        brought many to Christ. She returned into her own country, and withdrew to be an
        hermit, alone on a certain mountain, and passed away to be with the Lord, aged ninety
        years, and famous for many good works and miracles. She was buried at Seleucia.
    status: { la: verified, en: verified }
