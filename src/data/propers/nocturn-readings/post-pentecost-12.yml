# Nocturn 3, 12th Sunday after Pentecost. Sourced from Tempora/Pent12-0.txt.
# See post-pentecost-02.yml for sweep method note. From this Sunday onward
# through the rest of the post-Pentecost season, the source carries no
# proper Nocturn 2 (Lectio4-6) content of its own - only the Nocturn 3
# Gospel+homily slot. Lectio7 is a bare "Et réliqua" incipit (Luke 10:23-37,
# the Good Samaritan) and is not authored per this project's convention;
# Lectio8-9 is one continuous homily by the Venerable Bede, combined.
id: post-pentecost-12
readings:
  - nocturn: 3
    isGospel: false
    source: "The Venerable Bede, Priest, Book 3, ch. 43 on Luke 10"
    text:
      la: >-
        Non óculi scribárum et pharisæórum, qui corpus tantum Dómini vidére; sed illi beáti óculi, qui
        ejus possunt cognóscere sacraménta, de quibus dícitur: Et revelásti ea párvulis. Beáti óculi
        parvulórum, quibus et se et Patrem Fílius reveláre dignátur. Abraham exsultávit ut vidéret diem
        Christi; et vidit, et gavísus est. Isaías quoque, et Michǽas, et multi álii prophétæ vidérunt
        glóriam Dómini, qui et proptérea Vidéntes sunt appelláti; sed hi omnes, a longe aspiciéntes et
        salutántes, per spéculum et in ænígmate vidérunt.


        Apóstoli autem, in præsentiárum habéntes Dóminum, convescentésque ei, et quæcúmque voluíssent
        interrogándo discéntes, nequáquam per Angelos aut várias visiónum spécies opus habébant docéri.
        Quos vero Lucas multos prophétas et reges dicit, Matthǽus apértius prophétas et justos appéllat.
        Ipse sunt enim reges magni; quia tentatiónum suárum mótibus non consentiéndo succúmbere, sed
        regéndo præésse novérunt.


        Et ecce quidam legisperítus surréxit, tentans eum et dicens: Magíster, quid faciéndo vitam
        ætérnam possidébo? Legisperítus, qui de vita ætérna Dóminum tentans intérrogat, occasiónem, ut
        reor, tentándi de ipsis Dómini sermónibus sumpsit, ubi ait: Gaudéte autem quod nómina vestra
        scripta sunt in cælis. Sed ipsa sua tentatióne declárat quam vera sit illa Dómini conféssio, qua
        Patri lóquitur: Quod abscondísti hæc a sapiéntibus, et prudéntibus, et revelásti ea párvulis.
      en: >-
        Blessed were the eyes not of Scribes and Pharisees, which saw but the Body of the Lord, but those
        eyes, eyes blessed indeed, which were able to see those things whereof it is written "Thou hast
        hid these things from the wise and prudent, and hast revealed them unto babes." Blessed are the
        eyes of those little ones unto whom it seemeth good in the eyes of the Son to reveal Himself and
        the Father also. Abraham rejoiced to see the day of Christ and he saw it, and was glad (John
        viii. 56). Isaiah, and Micah, and many among the Prophets, saw the glory of the Lord, wherefore
        also they be called Seers, but all they beheld it and hailed it afar off, seeing but as through a
        glass, darkly (1 Cor. xiii. 12).


        Otherwise were the Apostles, who saw the Lord face to face, eating with Him, and learning from
        Him by asking whatsoever they listed. For them there was no need to be taught by Angels, or the
        shifting fabric of visions. They whom Luke doth call Prophets and kings, Matthew nameth as
        "Prophets and righteous men" (xiii. 17). Righteous men are indeed mighty kings, who know how to
        lord it over their own rebellious temptations, instead of falling under them to become their
        slaves.


        "And, behold, a certain lawyer stood up, and tempted Him, saying Master, what shall I do to
        inherit eternal life?" This lawyer, who stood up to ask the Lord a tempting question touching
        eternal life, took the subject of his asking, as I think, from the words which the Lord had just
        uttered, when He said "Rejoice, because your names are written in heaven." But his attempt was a
        proof of the truth of that which the Lord immediately added "I thank thee, O Father, Lord of
        heaven and earth, that Thou hast hid these things from the wise and prudent, and hast revealed
        them unto babes!"
    responsory:
      la: "R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.\nV. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.\nR. Plena est omnis terra glória ejus."
      en: "R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.\nV. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.\nR. The whole earth is full of His glory."
    status: { la: verified, en: verified }
