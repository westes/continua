# Matins Nocturn content for Thursday of Lent week 3 — read from
# web/www/horas/{Latin,English}/Tempora/Quad3-4.txt, whose own
# [Lectio1]/[Lectio2] are themselves cross-references
# (@Tempora/Pasc7-6:Lectio1/Lectio2) to the Paschaltide-week-7 Saturday
# file — Lenten Thursdays were only added to the ferial cycle later
# (by Pope St. Gregory II), borrowing an existing homily rather than
# being freshly composed, which is why the cross-reference reaches into
# another season entirely. Resolved by reading Tempora/Pasc7-6.txt
# directly in both languages: only that file (not Quad3-4's own English
# file, which omits Lectio1/2 in English altogether) carries the English
# text for the first two parts of this homily. The Gospel pericope
# itself (Luke 4:38-44, incipit only even in Pasc7-6) was sourced from
# web/www/missa/{Latin,English}/Tempora/Quad3-4.txt's own [Evangelium]
# (that Mass file gives the day's own full pericope directly, without
# needing the Pasc7-6 detour).
#
# The Lauds/Vespers collects genuinely name Ss. Cosmas and Damian
# (Oratio 2: "sanctórum tuórum Cosmæ et Damiáni beáta solémnitas") --
# not an error: this day's Roman station church is titular to those two
# saints, a real stational-liturgy feature, not a stray Sept. 27
# cross-reference.
#
# Recombined into one reading (all three Lectio parts are one continuous
# Ambrose homily on Luke 4, split only to fill the fixed 3-lesson slot
# count). Responsory: Lectio1's own cross-referenced responsory
# (@Tempora/Pasc7-0:Responsory2) is a Pentecost-season text containing
# "Alleluia," which Lent forbids outright -- deliberately NOT used here.
# Quad3-4's own Responsory2 (@Tempora/Quad3-0:Responsory2, a Lent-
# appropriate Joseph-narrative text, same pool the rest of this week
# draws from) is used instead, the nearest available Lent-native
# responsory in this day's own file.
id: lent-3-thursday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Luc 4:38-44", en: "Luke 4:38-44" }
    text:
      la: >-
        In illo témpore: Surgens Jesus de synagóga, introívit in domum Simónis. Socrus autem
        Simónis tenebátur magnis fébribus: et rogavérunt illum pro ea. Et stans super illam,
        imperávit febri: et dimísit illam. Et contínuo surgens, ministrábat illis. Cum autem sol
        occidísset, omnes qui habébant infírmos váriis languóribus, ducébant illos ad eum. At ille
        síngulis manus impónens, curábat eos. Exíbant autem dæmónia a multis clamántia, et dicéntia:
        Quia tu es Fílius Dei: et íncrepans non sinébat ea loqui, quia sciébant ipsum esse Christum.
        Facta autem die egréssus ibat in desértum locum, et turbæ requirébant eum, et venérunt usque
        ad ipsum: et detinébant illum ne discéderet ab eis. Quibus ille ait: Quia et áliis civitátibus
        opórtet me evangelizáre regnum Dei: quia ídeo missus sum. Et erat prǽdicans in synagógis
        Galilǽæ.
      en: >-
        At that time, Jesus rose from the synagogue and entered Simon's house. Now Simon's
        mother-in-law was suffering from a great fever, and they besought Him for her. And standing
        over her He rebuked the fever, and it left her; and she rose at once and began to wait on
        them. Now when the sun was setting, all who had persons sick with various diseases brought
        them to Him. And He laid His hands upon each of them and cured them. And devils also came
        forth from many, crying out and saying, "You are the Son of God." And He rebuked them, and
        did not permit them to speak, because they knew that He was the Christ. Now when it was
        day, He went out and departed into a desert place. And the crowds were seeking after Him,
        and they came to Him, and tried to detain Him, that He might not depart from them. But He
        said to them, "To the other towns also I must proclaim the kingdom of God, for this is why I
        have been sent." And He was preaching in the synagogues of Galilee.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, Book 4 on Luke iv"
    text:
      la: >-
        Vide cleméntiam Dómini Salvatóris: nec indignatióne commótus nec scélere offénsus, nec
        injúria violátus Judǽam déserit: quin étiam ímmemor injúriæ, memor cleméntiæ, nunc docéndo,
        nunc liberándo, nunc sanándo, infídæ plebis corda demúlcet. Et bene sanctus Lucas virum ab
        spíritu nequítiæ liberátum ante præmísit, et subdit féminæ sanitátem. Utrúmque enim sexum
        Dóminus curatúrus advénerat: sed prior sanári débuit, qui prior creátus est; nec
        prætermítti illa, quæ mobilitáte magis ánimi, quam pravitáte peccáverat.


        Sábbato medicínæ Domínicæ ópera cœpta signíficat, ut inde nova creatúra cœ́perit, ubi vetus
        creatúra ante desívit: nec sub lege esse Dei Fílium, sed supra legem in ipso princípio
        designáret: nec solvi legem, sed impléri. Neque enim per legem, sed verbo factus est mundus,
        sicut légimus: Verbo Dómini cæli firmáti sunt. Non sólvitur ergo lex, sed implétur: ut fiat
        renovátio hóminis jam labéntis. Unde et Apóstolus ait: Exspoliántes vos véterem hóminem,
        indúite novum, qui secúndum Deum creátus est.


        Et bene sábbato cœpit, ut ipsum se osténderet Creatórem, qui ópera opéribus intéxeret, et
        prosequerétur opus, quod ipse jam cœ́perat: ut si domum faber renováre dispónat, non a
        fundaméntis, sed a culmínibus íncipit sólvere vetustátem. Itaque ibi prius manum ádmovet,
        ubi ante desíerat: deínde a minóribus íncipit, ut ad majóra pervéniat. Liberáre a dǽmone et
        hómines, sed in verbo Dei possunt: resurrectiónem mórtuis imperáre, divínæ solíus est
        potestátis. Fortássis étiam in typo mulíeris illíus socrus Simónis et Andréæ, váriis
        críminum fébribus caro nostra languébat, et diversárum cupiditátum immódicis æstuábat
        illécebris. Nec minórem febrem amóris esse díxerim, quam calóris. Itaque illa ánimum, hæc
        corpus inflámmat. Febris enim nostra, avarítia est: febris nostra, libído est: febris
        nostra, luxúria est: febris nostra, ambítio est: febris nostra, iracúndia est.
      en: >-
        Behold here how long-suffering is the Lord our Redeemer! Neither moved to anger against
        them, nor sickened at their guilt, nor outraged by their attacks, did He leave the Jews'
        country. Nay, forgetting their iniquity, and mindful only of His mercy, He strove to soften
        their hard and unbelieving hearts, sometimes by His teaching, and sometimes by freeing some
        of them, and sometimes by healing them. St. Luke doth well to tell us first of the man who
        was delivered from an unclean spirit, and then of the healing of a woman. The Lord indeed
        came to heal both sexes, but that must be healed first which was created first, and then
        must not she be passed by whose first sin arose rather from fickleness of heart than from
        depraved will.


        That the Lord began to heal on the Sabbath-day showeth in a figure how that the new creation
        beginneth where the old creation ended. It showeth, moreover, that the Son of God, Who is
        come not to destroy the law but to fulfill the law, is not under the law, but above the law.
        Neither was it by the law, but by the Word, that the world was created, as it is written "By
        the Word of the Lord were the heavens made." The law, then, is not destroyed, but fulfilled,
        in the Redemption of fallen man. Whence also the Apostle saith: "Put off, concerning the
        former conversation, the old man, which is corrupt according to the deceitful lusts and be
        renewed in the spirit of your mind and put on the new man, which after God is created in
        righteousness and true holiness."


        It was well that He began to heal on the Sabbath, that He might show Himself to be the
        Creator, weaving in one with another of His works, and continuing that which He had already
        begun, even as a workman, being to repair an house, beginneth not to take down that which is
        old from the foundations, but from the roof. Thus doth the Lord begin to lay to His hand
        again, in that place whence last He hath lifted it; then He beginneth which after God is
        created in righteousness and true holiness, with things lesser, that He may go on to things
        greater. Even men are able to deliver other men from evil spirits, albeit with the word of
        God: to command the dead to rise again is for God's power alone. Perchance, also, this
        woman, the mother-in-law of Simon and Andrew, was a type of our nature, stricken down with
        the great fever of sin, and burning with unlawful lusts after diverse objects. Nor would I
        say that the passion which rageth in the mind is a lesser fire than that fever which burneth
        the body. Covetousness, and lust, and uncleanness, and vain desires, and strivings, and
        anger, these be our fevers.
    responsory:
      la: "R. Dixit Judas frátribus suis: Ecce Ismaëlítæ tránseunt; veníte, venumdétur, et manus nostræ non polluántur: * Caro enim et frater noster est.\nV. Quid enim prodest, si occidérimus fratrem nostrum, et celavérimus sánguinem ipsíus? mélius est ut venumdétur.\nR. Caro enim et frater noster est."
      en: "R. Judah said unto his brethren, Behold, the Ismaelites pass by; come, let us sell him, and let not our hands be defiled. * For he is our flesh, and our brother.\nV. What profit is it if we slay our brother, and conceal his blood? It is better to sell him.\nR. For he is our flesh, and our brother."
    status: { la: verified, en: verified }
