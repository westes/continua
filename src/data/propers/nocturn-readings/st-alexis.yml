# Matins Nocturn 2 reading for St. Alexis, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/07-17.txt, English/Sancti/07-17.txt.
# single lesson (Lectio94), one continuous account.
id: st-alexis
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Aléxius, Romanórum nobilíssimus, propter exímium Jesu Christi amórem prima nocte
        nuptiárum peculiári Dei mónitu relínquens intáctam sponsam, illústrium orbis
        terræ ecclesiárum peregrinatiónem suscépit. Quibus in itinéribus cum ignótus
        septémdecim annos fuísset, aliquándo apud Edéssam, Syriæ urbem, per imáginem
        sanctíssimæ Maríæ Vírginis, ejus nómine divulgáto, inde navi discéssit. Ad
        portum Románum appúlsus, a patre suo tamquam aliénus pauper hospítio accípitur;
        apud quem, ómnibus incógnitus, cum decem et septem annos vixísset, relícto
        scripto sui nóminis, sánguinis, ac totíus vitæ cursus, migrávit in cælum,
        Innocéntio primo summo Pontífice.
      en: >-
        Alexius was a member of one of the noblest Roman families. Through his exceeding
        great love for Jesus Christ, he received a particular command from God to leave
        his bride untouched upon his wedding night, and to undertake a pilgrimage to the
        most famous churches of the world. For seventeen years he remained occupied in
        these journeys and utterly unknown. At the end of that time, his name was spoken
        from an image of the most holy Virgin Mary in the city of Edessa, in Syria, and
        when he found himself recognised he took ship from thence. He landed at Porto
        near Rome, and fared to the house of his own father, who gave him shelter as a
        strange beggar. He lived there unrecognised by any for seventeen years more, and
        then passed away to heaven, in the time of Pope Innocent I, leaving behind him a
        writing giving his name, family, and the story of his life.
    status: { la: verified, en: verified }
