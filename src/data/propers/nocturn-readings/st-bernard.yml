id: st-bernard
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bernárdus, Fóntanis in Burgúndia honésto loco natus, adolescéns propter egrégiam
        formam veheménter sollicitátus a muliéribus, numquam de senténtia coléndæ castitátis
        dimovéri pótuit. Quas diáboli tentatiónes ut effúgeret, duos et vigínti annos natus,
        monastérium Cisterciensé, unde hic ordo incépit, et quod tum sanctitáte florébat,
        íngredi constítuit. Quo Bernárdi consílio cógnito, fratres summópere conáti sunt eum a
        propósito deterrére: in quo ipse eloquéntior ac felícior fuit. Nam sic eos aliósque
        multos in suam perdúxit senténtiam, ut cum eo trigínta júvenes eámdem religiónem
        suscéperint. Mónachus jejúnio ita déditus erat, ut quóties suméndus esset cibus,
        tóties torméntum subíre viderétur. In vigíliis étiam et oratiónibus mirífice se
        exercébat: et christiánam paupertátem colens, quasi cæléstem vitam agébat in terris, ab
        omni caducárum rerum cura et cupiditáte aliénam.


        Elucébat in eo humílitas, misericórdia, benígnitas: contemplatióni autem sic addíctus
        erat, ut vix sénsibus, nisi ad offícia pietátis, uterétur: in quibus tamen prudéntiæ
        laude excellébat. Quo in stúdio occupátus, Genuénsem, ac Mediolanénsem, aliósque
        episcopátus oblátos recusávit, proféssus se tanti offícii múnere indígnum esse. Abbas
        factus Claravallénsis, multis in locis ædificávit monastéria, in quibus præclára
        Bernárdi institútio ac disciplína diu viguit. Romæ, sanctórum Vincéntii et Anastásii
        monastério ab Innocéntio secúndo Papa restitúto præfécit abbátem illum, qui póstea
        Eugénius tértius Summus Póntifex fuit, ad quem étiam librum misit de Consideratióne.


        Multa prætérea scripsit, in quibus appáret, eum doctrína pótius divínitus trádita,
        quam labóre comparáta, instrúctum fuísse. In summa virtútum laude exorátus a máximis
        princípibus de eórum componéndis controvérsiis, et de ecclesiásticis rebus
        constituéndis, sǽpius in Itáliam venit. Innocéntium item secúndum Pontíficem Máximum
        in confutándo schísmate Petri Leónis, cum apud imperatórem et Henrícum Angliæ regem,
        tum in concílio Pisis coácto, egrégie adjúvit. Dénique tres et sexagínta annos natus,
        obdormívit in Dómino, ac miráculis illústris, ab Alexándro tértio Papa inter sanctos
        relátus est. Pius vero octávus Póntifex Máximus ex sacrórum Rítuum Congregatiónis
        consílio sanctum Bernárdum universális Ecclésiæ Doctórem declarávit et confirmávit, nec
        non Missam et Offícium de Doctóribus ab ómnibus recitári jussit, atque indulgéntias
        plenárias quotánnis in perpétuum órdinis Cisterciénsium ecclésias visitántibus die
        hujus sancti festo concéssit.
      en: >-
        Bernard was born at a decent place in Burgundy called Fontaines. On account of
        extraordinary good looks, he was as a boy very much sought after by women, but he could
        never be turned aside from his resolution to keep chaste. To fly from these temptations
        of the devil, he determined at two-and-twenty years of age to enter the Monastery of
        Citeaux, whence the Cistercian Order took its rise. When this resolution of Bernard's
        became known, his brothers did all their diligence to change his purpose, but he only
        became the more eloquent and happy about it. Them and others he so brought over to his
        mind, that thirty young men entered the same Order along with him. As a monk he was so
        given to fasting, that as often as he had to eat, so often he seemed to be in pain. He
        exercised himself wonderfully in watching and prayer, and was a great lover of Christian
        poverty. Thus he led on earth an heavenly life, purged of all care and desire for
        transitory things.


        He was a burning and shining light of lowliness, mercifulness, and kindness. His
        concentration of thought was such, that he hardly used his senses except to do good
        works, in which latter he acted with admirable wisdom. Thus occupied, he refused the
        Bishoprics of Genoa, Milan, and others, which were offered to him, declaring that he was
        unworthy of so high a sphere of duty. Being made Abbot of Clairvaux, he built monasteries
        in many places, wherein the excellent rules and discipline of Bernard long flourished.
        When Pope Innocent II. restored the monastery of St. Vincent and St. Anastasius at Rome,
        Bernard set over it the Abbot who was afterwards the Supreme Pontiff Eugene III., and who
        is also the same to whom he addressed his book upon Consideration.


        He was the author of many writings, in which it is manifest that his teaching was
        rather given him of God, than gained by hard work. In consequence of his high reputation
        for excellence, he was called by the most exalted Princes to act as arbiter of their
        disputes, and for this end, and to settle affairs of the Church, he often went to Italy.
        He was an eminent helper to Pope Innocent II., in putting down the schism of Peter Leoni,
        and worked to this end, both at the Courts of the Emperor and of Henry King of England,
        and in the Council of Pisa. He fell asleep in the Lord, in the sixty-third year of his
        age. He was famous for miracles, and Pope Alexander III. numbered him among the Saints.
        Pope Pius VIII., acting on the advice of the Congregation of Sacred Rites, declared and
        confirmed St. Bernard a Doctor of the Universal Church. He also commanded that all should
        use the Mass and Office for him as for a Doctor, and granted perpetual yearly plenary
        indulgences to all who should visit Churches of the Cistercian Order upon the Feast-day
        of this Saint.
    status: { la: verified, en: verified }
