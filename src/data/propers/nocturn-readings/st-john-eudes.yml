# Matins Nocturn 2 reading for St. John Eudes, Confessor (Aug 19).
# Sourced directly from web/www/horas/Latin/Sancti/08-19.txt,
# English/Sancti/08-19.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (his `[Rule]` is `vide
# C5`) -- defers to the Common's own Nocturn 3, not transcribed here.
id: st-john-eudes
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joannes, anno millesimo sexcentesimo primo, in pago vulgo Ri, Sagiensis
        diœcesis, e piis honestisque parentibus ortus est. Adhuc puer,
        Angelorum pane refectus, perpetuam castitatem alacriter vovit. In
        Cadomense collegium a patribus Societatis Jesu directum exceptus,
        singulari pietate emicuit; et Mariæ Virginis tutelæ sese committens,
        speciale fœdus initum cum ea vix adolescens suo sanguine signavit.
        Litterarum ac philosophiæ curriculo multa cum laude peracto,
        spretisque sibi oblatis nuptiis, Berulliani Oratorii congregationi
        nomen dedit, et sacerdotio Parisiis auctus est. Mira caritate erga
        proximum flagravit: nam apud plura loca, corporibus, asiatica lue
        perculsis, animisque curandis sedulam operam dedit. Domus Oratorianæ
        Cadomi rector factus, quum diu cogitaret ad Ecclesiæ ministerium
        juvenes idoneos instituere, a sodalibus, quibuscum viginti annos
        vixerat, divina ope implorata, licet ægre, forti animo discessit.


        Quinque igitur sacerdotes sibi consocians, anno millesimo
        sexcentesimo quadragesimo tertio, die festo Annuntiationis beatæ
        Mariæ Virginis, congregationem presbyterorum instituit, cui
        sanctissima Jesu et Mariæ nomina dedit, et Cadomi primum seminarium
        aperuit, quod in Normannia et Britannia minori complura, eodem
        auctore, subsecuta sunt. Pro peccatricibus feminis, ad christianam
        vitam revocandis, ordinem Dominæ nostræ a Caritate fundavit; cujus
        nobilissimæ arboris ramus est congregatio Andegavensis a Bono
        Pastore. Insuper societatem a Matris Dei Corde admirabili, et alia
        caritatis opera condidit. Scripta plura præclare edidit, et
        missionarius Apostolicus tot pagos, oppida et urbes ipsamque regiam
        aulam usque ad extremam ætatem, evangelizavit.


        Singulare ejus studium emicuit in salutari devotione promovenda erga
        sacratissima Corda Jesu et Mariæ, quorum liturgicum cultum eisdem
        præstandum non sine aliquo divino afflatu, primus omnium excogitavit
        ideoque ejusdem cultus pater, doctor et apostolus habitus est.
        Jansenistarum doctrinis fortiter resistens, immutatum erga Petri
        cathedram obsequium servavit, et pro suis inimicis, tamquam pro
        fratribus, assidue Deum precatus est. Tot laboribus, potius quam
        annis fractus, cupiens dissolvi et esse cum Christo, die decima nona
        Augusti, anno millesimo sexcentesimo octogesimo, suavia Jesu et
        Mariæ nomina sæpius repetens, placide exspiravit. Quem pluribus
        miraculis clarum Pius Papa decimus Beatorum albo adscripsit eumque
        novis signis fulgentem Pius Papa undecimus, anno sacro, in die
        dominica Pentecostes inter Sanctos retulit ejusque Officium ac
        Missam ad universam Ecclesiam exendit.
      en: >-
        John was born in the year 1601, of pious and respectable parents, at
        a village commonly known as Ri, in the diocese of Seez. While still a
        boy, when he was fed with the bread of Angels, he cheerfully made a
        vow of perpetual chastity. Having been received at the College of
        Caen, directed by the Fathers of the Society of Jesus, he was
        conspicuous for a remarkable piety; and, committing himself to the
        protection of the Virgin Mary, when still a youth he signed with his
        own blood, the special covenant he had entered into with her. Having
        completed his courses of letters and of philosophy with great
        distinction, and having spurned opportunities of marriage which had
        been arranged for him, he enrolled himself with the Congregation of
        the Oratory de Bérulle, and was ordained priest at Paris. He was on
        fire with a marvellous love towards his neighbour: for he took the
        most constant pains in caring for both the souls and bodies of those
        smitten with the Asiatic plague, in many different places. He was
        made Rector of the Oratorian house at Caen, but since he had been
        thinking for a long time of educating suitable young men for the
        ministry of the Church, earnestly asking for the divine assistance,
        with a brave spirit he most regretfully departed from the associates
        with whom he had lived for twenty years.


        Accordingly, associating five priests with himself, in the year 1643,
        on the feastday of the Annunciation of the Blessed Virgin Mary, he
        founded a Congregation of Priests, to whom he gave the most holy
        names of Jesus and Mary, and opened the first seminary at Caen; and a
        great many others followed immediately in Normandy and Brittany,
        also founded by him. For the recalling of sinful women to a
        Christian life, he founded the Order of Our Lady of Charity; of
        which most noble tree, the Congregation of the Good Shepherd of
        Angers is a branch. Furthermore, he founded the Society of the
        Admirable Heart of the Mother of God, and other charitable
        institutions. He was the author of many excellent treatises, and
        laboured as an Apostolic Missionary to the very end of his life,
        preaching the Gospel in very many villages, towns, and cities, and
        even in the royal court.


        His matchless zeal was very conspicuous in promoting the salutary
        devotion towards the most sacred Hearts of Jesus and Mary, whose
        liturgical worship he was the first of all to devise, although not
        without some divine inspiration. He is therefore held to be the
        father, the teacher, and the apostle of that worship. Courageously
        withstanding the doctrines of the Jansenists, he preserved
        unalterable obedience towards the Chair of Peter, and he constantly
        prayed to God, both for his enemies as well as for his brethren.
        Broken by so many labours, rather than by years, desiring to be
        freed and to be with Christ, on the 19th day of August, 1680,
        frequently repeating the sweet names of Jesus and Mary, he died in
        peace. As he became illustrious by many miracles, Pope Pius X added
        him to the list of the Blessed, and as he still shone forth with new
        signs and wonders, Pope Pius XI, in the holy year and on the day of
        Pentecost, placed him among the Saints, and extended his Office and
        Mass to the universal Church.
    status: { la: verified, en: verified }
