# Matins Nocturn 2 reading for St. Hyginus, Pope and Martyr (Jan 11,
# commemorated -- the day itself is inside the Epiphany octave). The
# main Sancti/01-11.txt has no vita for him at all (its Nocturn 2/3 is
# the octave's own homiletic content, carried by
# octave-readings/epiphany-octave-day-*.yml), which is why this file
# used to pool the Epiphany homilies in. The Rome-city calendar has a
# real proper vita: web/www/horas/Latin/Sancti/Urbis/01-11cc.txt
# (Duplex, nine lessons; also reused for the combined Ss. Telesphorus
# and Hyginus office of Urbis/01-19). Lectio4-6 combined into one
# reading, one continuous vita, no genuine source break. No responsory
# given in the source.
#
# Latin typos in the Urbis file corrected here: "primumPontifex" ->
# "primum Pontifex", "lindecim" -> "undecim", "philosophuæt" ->
# "philosophus et". English/Sancti has no regional subdirectory, so
# there is no English source; the English is this project's own
# translation, marked draft.
id: st-hyginus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Hyginus Atheniénsis, philosopho patre, cum jam Románæ Ecclésiæ présbyter esset, cleri
        suffrágiis, Telesphoro sufféctus est. Sedit in sancta Petri sede, imperatóre Antoníno
        Pio Augusto, annos tres, menses undecim, dies vigínti octo. Ubi primum Pontifex
        renuntiátus est, clericórum ordines in suos gradus distínxit, ac fecit, ut in iis
        ecclésiis, quas Títulos vocant, tum primarii minístri, tum álii eísdem subjecti
        adessent, qui fidélibus, cum res postularet, sacra ministrarent.


        Instítuit étiam ne absque celebratióne Missæ templa vel oratoria sacro ritu
        consecrarentur: ne inconsulto epíscopo, vel nova construerentur, vel jam constructa
        destruerentur, et ne materies ad sacrum illum usum congesta et destinata, in profanos
        usus converteretur. Edixit prætérea, ut patrini baptísmo adessent, qui de sacro fonte
        infantes levarent: ne quis epíscopus reus críminis damnaretur, nisi a comprovincialibus
        epíscopis ejus causa probe discussa fuísset. Cuncta hæc ejus título ac nómine sancita
        exstant. Tres ordinatiónes hábuit mense Decémbri, quibus creávit epíscopos sex,
        presbyteros quíndecim, diáconos quinque.


        Cum autem paulo ante Justínus claríssimus philosophus et Christi Martyr scripsísset
        apologiam pro religióne christiána ad imperatórem Antoninum Pium Augústum, obtínuit ut
        persecutio desæviret. Hinc a Christianórum cæde, non quidem omníno, plúrimum tamen,
        público príncipis edícto, temperatum est. Sanctíssimo tamen pastóri, cujus cura
        Domínico gregi consultum fúerat, parcitum non fuit; nempe hic glorióso martyrio, ne
        antecessoribus dissimilis esset, innocentissimam vitam terminavit, die undecima
        Januárii, et sepúltus est in Vaticáno.
      en: >-
        Hyginus, an Athenian, the son of a philosopher, was already a priest of the Roman
        Church when he was chosen by the votes of the clergy to succeed Telesphorus. He sat in
        the holy see of Peter, under the Emperor Antoninus Pius Augustus, three years, eleven
        months, and twenty-eight days. As soon as he was proclaimed Pontiff, he distinguished
        the orders of clerics into their grades, and arranged that in those churches called
        Titles there should be both principal ministers and others subject to them, to minister
        the sacred things to the faithful when need required.


        He also established that temples or oratories not be consecrated with sacred rite
        without the celebration of Mass; that new ones not be built, nor existing ones
        destroyed, without the bishop being consulted; and that the material gathered and set
        apart for that sacred use not be turned to profane uses. He further decreed that
        godparents be present at baptism to lift the infants from the sacred font; and that no
        bishop be condemned as guilty of a crime unless his case had been properly examined by
        the bishops of his province. All these things stand ratified under his title and name.
        He held three ordinations in the month of December, in which he created six bishops,
        fifteen priests, and five deacons.


        Now a little before this, Justin, a most illustrious philosopher and martyr of Christ,
        had written an apology for the Christian religion, addressed to the Emperor Antoninus
        Pius Augustus, and had obtained that the persecution should abate. Hence the slaughter
        of Christians was restrained by a public edict of the prince, not indeed altogether,
        yet very greatly. Nevertheless the most holy shepherd, by whose care the Lord's flock
        had been provided for, was not spared; for he ended his most innocent life by a
        glorious martyrdom, so as not to be unlike his predecessors, on the eleventh day of
        January, and was buried in the Vatican.
    status: { la: verified, en: draft }
