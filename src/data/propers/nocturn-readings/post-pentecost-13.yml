id: post-pentecost-13
readings:
  - nocturn: 3
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Book 2, Questions on the Gospels, ch. 40"
    text:
      la: >-
        De decem leprósis, quos Dóminus ita mundávit, cum ait: Ite, osténdite vos sacerdótibus; quæri
        potest, cur eos ad sacerdótes míserit, ut cum irent, mundaréntur. Nullum enim eórum, quibus hæc
        corporália benefícia prǽstitit, invenítur misísse ad sacerdótes, nisi leprósos. Nam et illum a
        lepra mundáverat, cui dixit: Vade, osténde te sacerdótibus, et offer pro te sacrifícium, quod
        præcépit Móyses, in testimónium illis. Quæréndum ígitur est, quid ipsa lepra signíficet: non
        enim sanáti, sed mundáti dicúntur, qui ea caruérunt. Colóris quippe vítium est, non valetúdinis,
        aut integritátis sénsuum atque membrórum.


        Leprósi ergo non absúrde intélligi possunt, qui sciéntiam veræ fídei non habéntes, várias
        doctrínas profiténtur erróris. Non enim abscóndunt imperítiam suam; sed pro summa perítia
        próferunt in lucem, et jactántia sermónis osténtant. Nulla porro falsa doctrína est, quæ non
        áliqua vera intermísceat. Vera ergo falsis inordináte permíxta, in una disputatióne vel narratióne
        hóminis, tamquam in uníus córporis colóre apparéntia, signíficant lepram, tamquam veris falsísque
        colórum variántem atque maculántem.


        Hi autem tam vitándi sunt Ecclésiæ, ut, si fíeri potest, lóngius remóti, magno clamóre Christum
        interpéllent; sicut isti decem stetérunt a longe, et levavérunt vocem, dicéntes: Jesu præcéptor,
        miserére nostri. Nam et quod præceptórem vocant, quo nómine néscio utrum quisquam Dóminum
        interpelláverit pro medicína corporáli; satis puto significáre, lepram falsam esse doctrínam,
        quam bonus præcéptor abstérgit.
      en: >-
        The ten lepers "lifted up their voices and said: Jesus, Master, have mercy on us. And when He
        saw them, He said unto them: Go, show yourselves unto the Priests. And it came to pass that, as
        they went, they were cleansed." Question: why did the Lord send them unto the Priests, that, as
        they went, they might be cleansed? Lepers were the only class among those upon whose bodies He
        worked mercy, whom we find that He sent unto the Priests. It is written in another place that He
        said to a leper whom He had cleansed: "Go, and show thyself to the Priest, and offer for thy
        cleansing according as Moses commanded, for a testimony unto them" (Luke v. 14, Lev. xiv. seq.)
        We ask then, of what leprosy was a type, whereof they that were ridded were called, not
        "healed," but "cleansed." It is a disease which doth first appear in the skin, but destroyeth
        not immediately the strength, nor the use of feeling and the limbs.


        The lepers, therefore, we may not absurdly suppose such to be figured as have not the knowledge
        of the true faith, but do show forth diverse-coloured teachings of error. They hide not their
        witlessness, but do use all such wit as they have to make it manifest, and proclaim it in
        high-sounding phrases. There is no false doctrine but hath some truth mixed up with it. A man's
        discourse then, with some truths in it unequally mingled with falsehoods, and all confounded in
        one mass, is like to the body of one that is stricken with leprosy, whereon all manner of foul
        colours do appear in this and that place along with the true colour of skin.


        Such men as these are banished out of the walls of the Church, to the end that haply when they
        stand afar off they may lift up their voices and cry to Christ for pardon, just as those ten men
        that were lepers, which stood afar off, outside the village, lifted up their voices and said
        "Jesus, Master, have mercy on us." That they styled Him Master, by which title I know not if any
        besought the Lord for bodily healing, I think doth sufficiently show that leprosy signifieth
        false doctrine, whereof the Good Master doth cleanse us.
    responsory:
      la: "R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.\nV. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.\nR. Plena est omnis terra glória ejus."
      en: "R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.\nV. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.\nR. The whole earth is full of His glory."
    status: { la: verified, en: verified }
