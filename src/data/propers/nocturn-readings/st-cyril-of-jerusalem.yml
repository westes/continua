# Matins Nocturn 2-3 readings for St. Cyril of Jerusalem, Confessor,
# Doctor of the Church (Mar 18). Sourced directly from
# web/www/horas/Latin/Sancti/03-18.txt, English/Sancti/03-18.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 10:23-28) is a bare
# incipit ("Et réliqua"), so only the homily is authored (not marked
# isGospel) — just Lectio7's own homily portion (a complete, continuous
# excerpt from St. Athanasius). The source's own Lectio8-9 continue via
# a cross-reference to St. Athanasius's own feast (`@Sancti/05-02`),
# not transcribed here — see this file's own calendar-record comment.
id: st-cyril-of-jerusalem
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Cyrillus Hierosolymitanus a teneris annis divinarum scripturarum studio summopere
        deditus, adeo in earum scientia profecit, ut orthodoxæ fidei strenuus assertor
        evaserit. Monasticis institutis imbutus, perpetuæ continentiæ, omnique severiori
        vivendi rationi se addictum voluit. Postquam a sancto Maximo Hierosolymæ episcopo
        presbyter ordinatus fuit, munus verbi divini fidelibus prædicandi et catechumenos
        edocendi summa cum laude implevit, atque illas vere mirandas conscripsit
        catecheses, quibus totam ecclesiasticam doctrinam dilucide et copiose complexus,
        singula religionis dogmata contra fidei hostes solide propugnavit. Ita vero in his
        enucleate et distincte disseruit, ut non solum jam exortas hæreses, sed futuras
        étiam quasi præsagiens everterit, quemadmodum præstitit asserendo Corporis et
        Sanguinis Christi realem præsentiam in mirabili Eucharistiæ sacramento. Vita autem
        functo sancto Maximo, a provinciæ episcopis in illius locum suffectus est.


        In episcopatu injurias multas et calamitates, non secus ac beatus Athanasius, cui
        cœvus erat, ab Arianorum factionibus fidei causa perpessus fuit. Hi enim ægre
        ferentes Cyrillum vehementer hæresibus obsistere, ipsum calumniis aggrediuntur,
        et in conciliabulo depositum e sua sede deturbant. Quorum furori ut se subtraheret,
        Tarsum Ciliciæ aufugit, et quoad vixit Constantius, exsilii rigorem pertulit. Post
        illius mortem, Juliano Apostata ad imperium evecto, Hierosolymam redire potuit, ubi
        ardenti zelo gregi suo ab erroribus et a vitiis revocando operam navavit. Sed
        iterum, Valente imperatore, exsulare coactus est, donec, reddita Ecclesiæ pace per
        Theodosium Magnum, et Arianorum crudelitate audaciaque repressa, ab eodem
        imperatore tamquam fortissimus Christi athleta honoribus susceptus suæ sedi
        restitutus fuit. Quam strenue et sancte sublimis officii sui munia impleverit,
        luculenter apparet ex florenti tunc temporis Hierosolymitanæ ecclesiæ statu, quem
        sanctus Basilius loca sancta veneraturus, ibi aliquamdiu commoratus, describit.


        Venerandi hujus præsulis sanctitatem cælestibus signis a Deo fuísse illustratam
        memoriæ traditum accepimus. Inter hæc recensetur præclara crucis, solis radiis
        fulgentioris, apparitio, quæ episcopatus ejus initia decoravit. Hujusmodi prodigii
        ethnici et Christiani testes oculares fuerunt cum ipso Cyrillo qui gratiis primum
        in Ecclesia Deo redditis, illud per epistolam Constantio imperatori narravit. Nec
        minus admiratione dignum, quod Judæis templum a Tito eversum restaurare ex impio
        imperatoris Juliani jussu conantibus, evenit. Vehementi enim terræmotu oborto, et
        ingentibus flammarum globis e terra erumpentibus, omnia opera ignis consumpsit, ita
        ut Judæi et Julianus deterriti, ab incepto destiterint; prout scilicet
        indubitanter futurum Cyrillus prædixerat. Qui demum paulo ante obitum Concilio
        œcumenico Constantinopolitano interfuit, in quo Macedonii hæresis, et iterum
        Ariana condemnata est. Ac Jerúsalem inde reversus, fere septuagenarius, trigesimo
        quinto sui episcopatus anno sancto fine quievit. Ejus Officium ac Missam Leo
        decimus tertius Pontifex Maximus ab universa Ecclesia celebrari mandavit.
      en: >-
        Cyril of Jerusalem was given to the study of the Holy Scriptures from a child, and
        so learnt therein that he became an eminent champion of the orthodox faith. He
        embraced the monastic institute in perpetual continency, and all hardship of
        living. He was ordained Priest by holy Maximus, Patriarch of Jerusalem, and
        undertook with eminent success the task of preaching the word of God to the
        faithful and of instructing the catechumens. Thus did he compose those truly
        wonderful Catecheses, wherein he has embraced, clearly and fully, all the teaching
        of the Church, and stoutly defended every one of her doctrines against the enemies
        of the faith. His treatment of these subjects was such that he has overthrown
        therein, not only the heresies which had then come into being, but, by a kind of
        foreknowledge, even those which were to arise in later times. Of this an instance
        is his contention for the real Presence of the Body and Blood of Christ in the
        wondrous Sacrament of the Eucharist. After the death of holy Maximus, the bishops
        of the province chose Cyril in his place.


        In his office of Bishop he had for the faith's sake, like his blessed contemporary
        Athanasius, to endure many wrongs and sufferings at the hands of the Arian sect.
        The Arians could not bear that Cyril should steadfastly withstand their heresy.
        They assailed him with calumnies, deposed him in a pretended council, and drove him
        out of his see. To escape their rage he fled to Tarsus in Cilicia, and as long as
        Constantius lived he bore the hardships of exile. After his death and the
        accession to the imperial throne of the Apostate Julian, Cyril was able to return
        to Jerusalem, where he set himself with burning zeal to deliver his flock from
        false doctrine and from sin. He was driven into exile a second time under the
        Emperor Valens. But when peace was restored to the Church by Theodosius the Great,
        and the cruelty and insolence of the Arians were restrained, Cyril was received
        with honour by the Emperor as one of Christ's most eminent soldiers, and was
        restored to his see. With what earnestness and holiness he fulfilled the duties of
        his exalted office was made manifest by the flourishing state of the church of
        Jerusalem at that time, of which a picture hath been left for us by holy Basil, who
        dwelt there for a while when he went to worship at the holy places.


        Tradition hath handed down that God Himself crowned with signs from heaven the
        holiness of this venerable Patriarch. Among these signs is numbered an apparition
        of a cross, more resplendent than the beams of the sun, which appeared at the
        beginning of his Patriarchate. Not only Cyril himself, but heathens and Christians
        alike were eye-witnesses of this marvel, and Cyril first gave thanks to God
        therefore in the church, and then sent news thereof by letter to the Emperor
        Constantius. A thing no less wonderful came to pass when the Jews were commanded by
        the profane Emperor Julian to attempt the restoration of the temple which had been
        destroyed by Titus. A great earthquake arose, and great masses of fire broke forth
        from the earth and consumed all the works, so that the Jews and Julian were
        dismayed and stayed their hand, all the which it can be proved that Cyril had
        foretold. A little while before his death he was present at the second Council of
        Constantinople; herein was condemned the heresy of Macedonius, and once more the
        Arian heresy. After his return to Jerusalem he died a holy death in the 69th year
        of his age and the 35th of his episcopate. The Supreme Pontiff Leo XIII. commanded
        that his office and Mass should be celebrated throughout the universal Church.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Athanasius, Defence of his Own Flight (on Matt 10:23-28)"
    text:
      la: >-
        In lege præceptum erat ut constituerentur civitates refugiorum, ut qui
        quomodocumque ad necem quærerentur, servari possent. In consummatione porro
        sæculorum cum advenisset illud ipsum Verbum Patris, quod Moysi antea locutum
        fuerat, rursus hoc præceptum dedit: Cum vos, inquiens, persecuti fuerint in
        civitate ista, fugite in aliam. Pauloque post subjicit: Cum videritis illam
        abominationem desolationis quæ dicta est per Danielem prophetam, consistentem in
        loco sancto (qui legit, intelligat), tunc qui in Judǽa sunt fugiant ad montes et
        qui in tecto est, ne descendat tollere aliquid de domo sua: et qui in agro est, non
        revertatur tollere tunicam suam.
      en: >-
        It is written in the Law, Ye shall appoint you cities to be cities of refuge for
        you, that in these cities they which were pursued to put them to death might enter
        and be safe. And in the latter days when He was come, even that very Word of the
        Father, Which had spoken aforetime unto Moses, He gave again the same commandment
        When they persecute you in this city, flee ye into another. And, a while afterward,
        He said: "When ye shall see the abomination of desolation, spoken of by Daniel the
        Prophet, stand in the Holy Place, whoso readeth, let him understand, then let them
        which be in Judaea flee unto the mountains; let him which is on the house-top not
        come down to take anything out of his house; neither let him which is in the field
        return back to take his clothes."
    status: { la: verified, en: verified }
