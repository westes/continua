id: st-dominic
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Dominicus, Calarógæ in Hispánia ex nobili Gusmanórum família natus, Paléntiæ
        liberálibus disciplinis et theologíæ operam dedit; quo in studio cum plurimum
        profecísset, prius Oxoménsis ecclésiæ canonicus regularis, deínde ordinis fratrum
        Prædicatórum auctor fuit. Hujus mater grávida sibi visa est, in quiete, continére in
        alvo cátulum ore præferentem facem, qua, éditus in lucem, orbem terrárum incénderet.
        Quo somnio significabátur fore ut, splendore sanctitátis ac doctrinæ, gentes ad
        christianam pietátem inflammaréntur. Veritátem éxitus comprobávit; id enim et præstitit
        per se, et per sui ordinis socios deinceps est consecutus.


        Hujus autem ingenium ac virtus maxime enituit in everténdis hæreticis, qui
        perniciosis erróribus Tolosátes pervertere conabántur; quo in negótio septem consumpsit
        annos. Postea Romam venit ad Lateranense concílium cum episcopo Tolosano, ut ordo, quem
        institúerat, ab Innocentio tertio confirmarétur. Quæ res dum in deliberatióne
        versatur, Dominicus hortatu Pontificis ad suos revértitur, ut sibi regulam delígeret.
        Romam rédiens, ab Honorio tertio, qui próximus Innocentio successerat, confirmatiónem
        ordinis Prædicatórum ímpetrat. Romæ autem duo instituit monasteria, álterum virórum,
        mulíerum álterum. Tres étiam mórtuos ad vitam revocávit, múltaque alia edidit miracula,
        quibus ordo Prædicatórum mirifice propagari cœpit.


        Verum, cum ejus ópera ubíque terrárum monasteria jam ædificaréntur, innumerabilésque
        hómines religiosam ac piam vitam institúerent, Bononiæ anno Christi ducentésimo
        vigesimo primo supra millesimum in febrem incidit. Ex qua cum se moriturum
        intellígeret, convocátis frátribus et alumnis suæ disciplinæ, eos ad innocéntiam et
        integritátem cohortátus est. Postremo caritátem, humilitátem, paupertátem, tamquam
        certum patrimónium eis testaménto relíquit; fratribúsque orántibus, in illis verbis,
        Subveníte, Sancti Dei, occúrrite, Angeli, obdormívit in Dómino, octavo Idus Augusti.
        Quem póstea Gregórius nonus Pontifex rétulit in Sanctórum númerum.
      en: >-
        Dominic was a Spaniard, a son of the noble family of Guzman. He was born at Calaruega,
        in Old Castile, and was sent to be taught worldly and sacred learning at Palencia. He
        attained great success in his studies, and became, first, a Regular Canon of the
        Cathedral Church of Osma, and afterwards Founder of the Order of Friars Preachers. While
        his mother was great with child, she dreamt that what was in her womb was a little whelp
        dog with a lighted torch in his mouth, and that when she was delivered of him, he set all
        the world on fire. By this dream was figured that burning and shining light of holiness
        of life and power of doctrine, whereby he should enkindle godliness throughout whole
        nations. The end proved the truth of the image, for this is in good sooth what his work
        was, a work which he hath continued to do through the Brethren of his Order.


        But his wisdom and bravery were most chiefly shown in confounding the heretics, who
        were fain, with their pestilential falsehoods, to corrupt the people of the county of
        Toulouse. In this business he spent seven years. Afterwards he came to Rome to the
        Fourth Lateran Council, along with the Bishop of Toulouse, that the Order which he had
        founded might be confirmed by Innocent III. While the matter was under consideration,
        Dominick, by the advice of the Pope, went home, that he might put his Rule into shape.
        He returned again to Rome, and obtained from Honorius III., the immediate successor of
        Innocent, the confirmation of the Order of Preachers. At Rome Dominic founded two
        Convents, one for men, and one for women. He raised three dead men to life, and worked
        many other miracles, whereby the Order of Preachers became exceedingly spread abroad.


        By his work convents were already during his life-time established in all countries,
        and almost countless persons embraced the life of prayer and godliness. In the year of
        Christ 1221 he fell sick of a fever at Bologna. When he understood that he was about to
        die, he called together his brethren and disciples, and exhorted them to innocence and
        uprightness. Lastly, he left to them as his legacy, love, lowliness, and poverty, and as
        the brethren were all praying, and the words were being said, Come ye to help him, ye
        Saints of God; run ye to meet him, ye Angels, he fell asleep in the Lord. Pope Gregory
        IX. afterwards placed his name among those of the Saints.
    status: { la: verified, en: verified }
