# Matins Nocturn 2 reading for St. Agnes, Virgin and Martyr (Jan 21) —
# SanctiM/01-21.txt inherits the whole day (`@Sancti/01-21`), overriding
# only some antiphon/versicle numbering by simple arithmetic
# substitution (renumbering, not new text) — Lectio4-6 carry through
# unchanged as this feast's own proper content, same as a pre-1955
# saint (see memory vu-matins-pre1955-saints).
# web/www/horas/Latin/Sancti/01-21.txt, English/Sancti/01-21.txt.
# Lectio4-6 (St. Ambrose's sermon on virgins, discussing Agnes) combined
# into one reading, one continuous excerpt. No responsory given in the
# source for these lessons.
id: st-agnes
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, On Virgins, Bk. 1"
    text:
      la: >-
        Hódie natális est Vírginis, integritátem sequámur. Natális est Mártyris, hóstias
        immolémus. Natális est sanctæ Agnétis, miréntur viri, non despérent párvuli, stúpeant
        nuptæ, imiténtur innúptæ. Sed quid dignum ea loqui póssumus, cujus ne nomen quidem vácuum
        laudis est? Devótio supra ætátem, virtus supra natúram: ut mihi videátur non hóminis
        habuísse nomen, sed oráculum Mártyris, quod indicávit, quid esset futúra. Nomen Vírginis
        títulus est pudóris. Appellábo Mártyrem: prædicávi satis. Prolíxa laudátio est, quæ non
        quǽritur, sed tenétur. Nemo est laudabílior, quam qui ab ómnibus laudári potest. Quot
        hómines, tot præcónes, qui Mártyrem prædícant, dum loquúntur.


        Hæc trédecim annórum martýrium fecísse tráditur. Quo detestabílior crudélitas quæ nec
        minúsculæ pepércit ætáti; immo magna vis fídei, quæ étiam ab illa testimónium invénit
        ætáte. Fuítne in illo corpúsculo vúlneri locus? Et quæ non hábuit quo ferrum recíperet,
        hábuit quo ferrum vínceret. Hæc inter cruéntas carníficum impávida manus, hæc stridéntium
        grávibus immóbilis tráctibus catenárum, nunc furéntis mucróni mílitis totum offérre
        corpus, mori adhuc néscia, sed paráta, vel si ad aras invíta raperétur, téndere Christo
        inter ignes manus, atque in ipsis sacrílegis focis trophǽum Dómini signáre victóris: nunc
        ferrátis colla manúsque ambas insérere néxibus. Sed nullus tam tenúia membra póterat
        nexus inclúdere. Novum martýrii genus! Nondum idónea pœnæ, et jam matúra victóriæ;
        certáre diffícilis, fácilis coronári: magistérium virtútis implévit, quæ præjudícium
        vehébat ætátis.


        Non sic ad thálamum nupta properáret, ut ad supplícii locum, læta succéssu, gradu
        festína Virgo procéssit. Flere omnes, ipsa sine fletu. Mirári pleríque, quod tam fácile
        vitæ suæ pródiga, quam nondum háuserat, jam quasi perfúncta donáret. Stupére univérsi,
        quod jam divinitátis testis exsísteret, quæ adhuc árbitra sui per ætátem esse non posset.
        Quanto terróre egit cárnifex ut timerétur, quantis blandítiis ut suadéret, quantórum
        vota, ut sibi ad núptias proveníret! At illa: Et hæc Sponsi injúria est, inquit,
        exspectáre placitúram. Qui me sibi prior elégit, accípiet: quid, percússor, moráris?
        Péreat corpus, quod amári potest óculis, quibus nolo. Stetit, orávit, cervícem infléxit.
        Cérneres trepidáre carníficem, quasi ipse addíctus fuísset, trémere percussóris déxteram,
        pallére ora aliéno timéntis perículo, cum puélla non timéret suo. Habétis ígitur in una
        hóstia duplex martýrium, pudóris et religiónis. Et virgo permánsit, et martýrium obtínuit.
      en: >-
        This is a virgin's birthday; let us then follow the example of her chastity. It is a
        Martyr's birthday; let us then offer sacrifices. It is the birthday of the holy Agnes; let
        men then be filled with wonder, little ones with hope, married women with awe, and the
        unmarried with emulation. But how shall I set forth the glory of her whose very name is an
        utterance of praise? It seemeth to me that this being, holy beyond her years, and strong
        beyond human nature, received the name of Agnes, not as an earthly designation, but as a
        revelation from God of what she was to be. For this name Agnes is from the Greek, and being
        interpreted, signifieth Pure. So that this saintly maiden is known by the very title of
        Chastity, and when I have added thereto the word Martyr, I have said enough. She needeth
        not the praise which we could utter, but do not. None is more praiseworthy than she for
        whose praise all mouths are fitted. As many as name her, so many praise her, by the noble
        title of martyr.


        We learn by tradition that this holy martyr testified in the thirteenth year of her age.
        We will pass by the foul cruelty which did not spare her tender years, to contemplate the
        great power of her faith, whereby she overcame the weakness of childhood, and witnessed a
        good confession. Her little body was hardly big enough to give play to the instruments of
        their cruelty, but if they could scarce sheathe their swords in her slight frame, they
        found in her that which laughed the power of the sword to scorn. She had no fear when she
        found herself grasped by the bloody hands of the executioners. She was unmoved when they
        dragged her with clanging chains. Hardly entered on life, she stood fully prepared to die.
        She quailed not when the weapons of the angry soldiery were pointed at her breast. If they
        forced her against her will to approach the altars of devils, she could stretch forth her
        hands to Christ amid the very flames which consumed the idolatrous offerings, and mark on
        the heathen shrine the victorious Cross of the Lord. She was ready to submit her neck and
        hands to the iron shackles, but they were too big to clasp her slender limbs. Behold a
        strange martyr! She is not grown of stature to fight the battle, but she is ripe for the
        triumph; too weak to run in the race, and yet clearly entitled to the prize; unable from her
        age to be aught but a learner, she is found a teacher.


        She went to the place of execution a virgin, with more willing and joyful footsteps than
        she would have gone with to the nuptial chamber as a bride. The spectators were all in
        tears, and she alone did not weep. They beheld her with wonder, laying down that life of
        which she had hardly begun to taste the sweets, as freely as though she had drained it to
        the dregs and was weary of its burden. All men were amazed when they saw her whose years
        had not made her her own mistress, arise as a witness for the Deity. Consider how many
        threats her murderer used to excite her fears, how many arguments to shake her resolution,
        how many promises to bribe her to accept his offers of marriage. But she answered him It is
        an insult to Him Whom I have wedded to expect me to comply. He That first chose me, His
        will I be. Headsman, why waitest thou? Perish the body which draweth the admiration of eyes
        from which I would turn away. She stood, prayed, and then bent her neck for the stroke. Now
        mightest thou have seen the murderer trembling as though he himself were the criminal, the
        executioner's hand shake, and the faces of them that stood by turn white at the sight of
        her position, and all the while herself remain without fear. This one victim brought God a
        double offering, that of her purity, and that of her faith. She preserved virginity and
        achieved martyrdom.
    status: { la: verified, en: verified }
