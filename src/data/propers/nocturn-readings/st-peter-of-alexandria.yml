# Matins Nocturn 2 reading for St. Peter of Alexandria, Bishop,
# Martyr (Nov 26, sharing the date with St. Silvester Abbot — see
# st-silvester-abbot.yml). No genuine SanctiM match: the correct
# Tridentine file is the suffixed `Sancti/11-26t.txt` (the plain
# `Sancti/11-26.txt` is St. Silvester Abbot instead), and no SanctiM
# file exists for this suffix — a missed pre-1955-pool candidate
# rather than a genuine SanctiM case (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-26t.txt, English/Sancti/11-26t.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-peter-of-alexandria
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Petrus, epíscopus Alexandríæ, post Theonam virum sanctíssimum, sanctitátis et
        doctrinæ splendore non solum illustravit Ægyptum, sed toti luxit Ecclésiæ Dei. Qui
        in persecutióne Maximiáni Galerii illam témporum acerbitátem ita pértulit, ut
        multi, admirábilem ejus patiéntiam intuéntes, plurimum in christiana virtúte
        proficerent. Is primus Aríum diaconum Alexandrinum, propter schisma Meletianum cui
        favebat, a fidelium communióne sejunxit. Ad eum, cápitis ab eodem Maximiáno
        damnátum, in carcere cum Achillas et Alexander presbyteri deprecatores Aríi
        venissent, respóndit, noctu apparuísse sibi Jesum veste discissa, causamque rei
        sciscitanti dixisse: Aríus vestem meam, quæ est Ecclésia, dilaceravit. Quibus étiam
        prædícens fore, ut sibi in episcopatu succéderent, præcepit ne umquam Aríum in
        communiónem recíperent, quem Deo mortuum esse sciret. Et hanc divinam
        prænotiónem veram fuísse, non diu post rei probavit eventus. Denique, duodecimo sui
        episcopátus anno, sexto Kalendas Decembris, abscisso cápite, ad martyrii corónam
        evolávit.
      en: >-
        This Peter succeeded that eminent Saint, Theonas, as Pope of Alexandria, and the
        glory of his holiness and teaching hath enlightened not Egypt only, but the whole
        Church of God. The wondrous patience wherewith he bore the roughness of the times in
        the persecution under Maximian Galerius caused many greatly to increase in Christian
        graces. He was the first who cut off Arius, then a Deacon of Alexandria, from the
        Communion of the faithful, on account of his leaning to the Meletian schism. He was
        condemned to death by Maximian, and was in prison when there came to him the two
        Priests Achilles and Alexander to plead for Arius, but Peter told them that Jesus had
        appeared to him in the night clad in a rent garment, and when he asked what was
        thereby signified, had said unto him: Arius hath torn My vesture, which is the
        Church. Also, he foretold to them that they should be Popes of Alexandria after him,
        and strictly commanded them never to receive Arius into Communion, because he knew
        him to be dead in the sight of God. That this was a true prophecy the event did
        shortly prove. At length, in the twelfth year of his papacy, upon the 26th day of
        November, his head was cut off, and he went hence to receive the crown of his
        testimony.
    status: { la: verified, en: verified }
