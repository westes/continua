# Matins Nocturn 2 reading for St. Sixtus I, Pope and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/04-06-XystusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-sixtus-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Xystus hujus nóminis primus, Románus natióne, de regióne Urbis séptima, quo Via lata dicta
        est, patre Pastóre génitus, in locum Alexándri primi, Romani Pontificis, nobilissimo
        martyrio coronati, totíus cleri suffrágiis sufféctus, suprémo illo múnere egrégie et summa
        cum laude perfúnctus est annis novem, ménsibus decem, diébus octo, sub imperatóribus Adriano
        et Antoníno Pio Augustis.


        Nonnulla ad disciplínam ecclesiásticam pertinéntia prudentíssime státuit, scílicet, ne sacra
        vasa et ministeria ab áliis, qui sacri minístri non essent, contrectarentur: ne sacrum
        corporale, ut vocant, ex ália, quam linea matéria fíeret: ut sacrum Trisagium in Missa
        pópulus decantaret: et ne ullus Epíscopus Romam evocátus ad suam deínde diœcesim rédiens
        susciperetur, nisi lítteris apostólicis, quas Formatas et Canonicas antiqui vocabant,
        munítus esset.


        Tres ordinatiónes mense Decémbri pro more fecit, in quibus creávit Epíscopos quátuor pro
        divérsis locis, Presbyteros úndecim, Diáconos tres. Vir revéra singulári vitæ sanctimónia,
        incredíbili morum facilitate, exímia in páuperes liberalitate, frequéntibus étiam insígnis
        miráculis, illústri tandem martyrio coronátus, octávo Idus Aprílis, et sepúltus in Vaticáno.
      en: >-
        Sixtus, the first of that name, a Roman by birth, of the seventh region of the City, which
        is called Via Lata, begotten of his father Pastor, was by the votes of the whole clergy put
        in the place of Alexander the First, Roman Pontiff, who had been crowned with most noble
        martyrdom; and he discharged that highest office with distinction and great praise nine
        years, ten months, and eight days, under the Emperors Hadrian and Antoninus Pius Augustus.


        He prudently established certain things pertaining to ecclesiastical discipline, namely:
        that the sacred vessels and furnishings not be handled by others who were not sacred
        ministers; that the sacred corporal, as they call it, not be made of any material other than
        linen; that the people sing the holy Trisagion at Mass; and that no bishop summoned to Rome
        be received on returning to his diocese unless he were provided with apostolic letters,
        which the ancients called Formatae and Canonical.


        In accordance with custom he held three ordinations in the month of December, in which he
        created four Bishops for various places, eleven Priests, and three Deacons. A man truly of
        singular holiness of life, incredible gentleness of manners, and exceptional liberality
        toward the poor, distinguished also by frequent miracles, he was at last crowned with
        illustrious martyrdom on the eighth day before the Ides of April, and was buried in the
        Vatican.
    status: { la: verified, en: draft }
