# Matins Nocturn 2-3 readings for St. Mary Magdalene, Penitent (Jul
# 22) — SanctiM/07-22.txt's own Lectio4-9 resolve back to
# `@Sancti/07-22:LectioN` (resliced), so this saint's own proper
# content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-22.txt, English/Sancti/07-22.txt.
#
# Nocturn 2: Lectio4-6 (Pope St. Gregory the Great's homily) combined
# into one reading, one continuous excerpt.
# Nocturn 3: Lectio7's Gospel citation (Luke 7:36-50) is a bare
# incipit ("Et réliqua") with no full pericope text given, so — per
# the pre-1955 pass's convention of not transcribing bare incipits —
# only the homily portion is authored (not marked isGospel), a single
# excerpt of St. Augustine's homily. No responsory given for either
# reading.
id: st-mary-magdalene
readings:
  - nocturn: 2
    isGospel: false
    source: "Pope St. Gregory the Great, Homily 25 on the Gospels"
    text:
      la: >-
        María Magdaléne, quæ fúerat in civitáte peccátrix, amándo veritátem, lavit lácrimis
        máculas críminis: et vox Veritátis implétur, qua dícitur: Dimíssa sunt ei peccáta
        multa, quia diléxit multum. Quæ enim prius frígida peccándo remánserat, póstmodum
        amándo fórtiter ardébat. Quæ a monuménto Dómini, étiam discípulis recedéntibus, non
        recedébat. Exquirébat quem non invénerat; flebat inquiréndo, et amóris sui igne
        succénsa, ejus, quem ablátum crédidit, ardébat desidério. Unde cóntigit, ut eum sola
        tunc vidéret, quæ remánserat ut quǽreret: quia nimírum virtus boni óperis
        perseverántia est.


        Quæsívit ergo prius, et mínime invénit: perseverávit ut quæreret, unde et cóntigit ut
        inveníret: actúmque est, ut desidéria diláta créscerent, et crescéntia cáperent quod
        inveníssent. Hinc est enim quod de eódem sponsa Ecclésia in Cánticis canticórum dicit:
        In léctulo meo per noctes quæsívi quem díligit ánima mea. Diléctum namque in léctulo
        quærimus, quando, in præséntis vitæ aliquántula réquie, Redemptóris nostri desidério
        suspirámus. Per noctem quærimus: quia, etsi jam in illo mens vígilat, tamen adhuc óculus
        calígat.


        Sed, qui diléctum suum non invénit, restat ut surgat, civitátem circúmeat, id est,
        sanctam electórum Ecclésiam mente et inquisitióne percúrrat; per vicos eum et platéas
        quærat, id est, per angústa et lata gradiéntes aspíciat, ut, si qua inveníre in eis
        váleat, ejus vestígia exquírat: quia sunt nonnúlli étiam vitæ sæculáris, qui imitándum
        áliquid hábeant de actióne virtútis. Quæréntes autem nos vígiles invéniunt, qui
        custódiunt civitátem: quia sancti Patres, qui Ecclésiæ statum custódiunt, bonis nostris
        stúdiis occúrrunt, ut suo vel verbo vel scripto nos dóceant. Quos cum páululum
        pertransímus, invenímus quem dilígimus: quia Redémptor noster, etsi humilitáte homo
        inter hómines, divinitáte tamen super hómines fuit.
      en: >-
        Mary Magdalen, a woman in the city, which was a sinner, through love of the truth,
        washed away in her tears the defilement of her sins, and the words of the Truth are
        fulfilled which He spake: Her sins, which are many, are forgiven; for she loved much. She
        who had remained chilly in sin, became fiery through love. When even His disciples went
        away again unto their own home, Mary still stood without at the sepulchre of Christ,
        weeping. She sought Him Whom her soul loved, but she found Him not. She searched for Him
        with tears; she yearned with strong desire for Him Who, she believed, had been taken
        away. And thus it befell her, that being the only one who had remained to seek Him, she
        was the only one that saw Him. It is the truth that the backbone of a good work is
        perseverance.


        At first when she sought Him, she found Him not; she went on searching, and so it came
        to pass that she found Him; and this was so, to the end that her longing might grow in
        earnestness, and so in its earnestness might find what it sought. Hence is it that the
        Bride in the Song of Songs saith as representing the Church: By night on my bed I sought
        him whom my soul loveth. We seek on our bed for Him Whom our soul loveth, when, having got
        some little rest in this world, we still sigh for the Presence of our Redeemer; but it is
        by night that we so seek Him, for though our mind may be on the alert for Him, yet still
        He is hidden from our eyes by the darkness that now is.


        But if we find not Him Whom our soul loveth, it remaineth that we should rise and go
        about the city, that is, by thought and questioning, go through the holy Church of the
        elect; seek Him in the streets, and in the broad ways, that is, walk anxiously looking
        about us both in the narrow and the broad places, that if we can, we may find His
        footsteps there; for there are some even of those who live for the world, from whom
        something may be learnt to be imitated by a godly man. As we thus go wakefully about, the
        watchmen, that keep the city, find us; the holy Fathers, who are the watchmen of the
        bulwarks of the Church, come to meet our good endeavours, and to teach us either by their
        words or by their writings. And it needeth but a little to pass from them, but we find Him
        Whom our soul loveth, for albeit our Redeemer in lowliness became a man among men, yet by
        right of His Divine Nature He is still above men.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Homily 23 (on Luke 7:36-50)"
    text:
      la: >-
        Evangélium cum legerétur, attentíssime audístis; et res gesta narráta atque versáta est
        ante óculos cordis vestri. Vidístis enim, non carne, sed mente, Dóminum Jesum Christum
        in domo pharisǽi recumbéntem, et ab illo invitátum non fastidiéntem. Vidístis étiam in
        civitáte mulíerem famósam, mala útique fama, quæ erat peccátrix, non invitátam
        irruísse convívio ubi suus médicus recumbébat, et quæsísse pia impudéntia sanitátem;
        írruens, quasi importúna convívio, opportúna benefício. Nóverat enim quanto morbo
        laboráret; et illum ad sanándum esse idóneum, ad quem vénerat, sciébat.
      en: >-
        Ye have listened carefully to the Gospel while it was being read, so that the thing told
        hath, as it were, passed before the eyes of your heart. Ye have seen in your mind's eye,
        albeit not with bodily sight, the Lord Jesus Christ sitting down to meat in the Pharisee's
        house, and not refusing when He is bidden of him. Ye have seen also an infamous woman of
        the city, one of utterly bad character, a sinner, thrusting herself in an uninvited
        guest, to the banquet where her Healer was sitting, and seeking health at His hands with
        godly shamelessness; thrusting herself in eager for mercy, as though eager for the
        feast. She knew under what a disease she laboured, and she knew that He unto Whom she
        came was mighty to cure it.
    status: { la: verified, en: verified }
