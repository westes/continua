# Matins Nocturn 2 reading for St. Eugenius I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/06-02-EugeniusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-eugenius-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Beáto Martíno hujus nóminis primo, tyrannica hærétici imperatóris senténtia Chersonam
        relegato, Theodoro exarcho instánte, Eugenius pátria Románus, qui fere a cunabulis sacro
        clericórum órdini se addixerat, absentis Pontíficis vices gessit, ne Románæ Ecclésiæ
        administratio cessasse omníno viderétur; sed hac revéra potestáte modeste uti visus est, cum
        probe sciret, Martíno vivénte se legitimum Pontíficem non esse, sed illíus dumtáxat quasi
        vices gerentem.


        Ubi vero prædíctus Christi Martyr, aërúmnis et inedia conféctus, ad beátam vitam
        migravisset, in cáthedra Petri, clero consentiente, ut legitimus Petri successor sedit, et
        in illo Apóstolici ministerii culmine talem se gessit, qualem supremi múneris ei crediti
        dígnitas, et ómnium Christi fidélium ejus curæ commissorum salus et utílitas postulabant;
        mitis enim fuit, benígnus et mansuetus, et, quod caput est, vitæ sanctimónia illústris.


        Singulárem cleri curam hábuit, quem patérno semper amóre et multis benefíciis prosecútus
        est. In egénos tamen mirábilis ejus beneficéntia enítuit, quibus réditus Ecclésiæ vivens et
        moriens liberali manu erogávit, appríme ratus, Ecclésiæ opes ad nobilióres usus applicari
        non posse, et ex mánibus indigentium ad æternitátis aërárium, cum incredíbili spirituális
        usuræ lucro, recta tradi. Transactis demum duóbus annis, et novem fere. ménsibus, sancto
        fine quiévit, anno Christi sexcentésimo quinquagésimo quinto, et ejus corpus in basílica
        sancti Petri recónditum fuit.
      en: >-
        When blessed Martin, first of that name, had been banished to Cherson by the tyrannical
        sentence of the heretical emperor, at the instance of the exarch Theodore, Eugenius, a Roman
        by country, who almost from the cradle had devoted himself to the sacred order of clerics,
        acted in the place of the absent Pontiff, that the administration of the Roman Church might
        not seem to have ceased altogether; but he was seen to use this power modestly, since he
        knew well that, while Martin was living, he was not the lawful Pontiff, but only as it were
        acting in his stead.


        But when the aforesaid Martyr of Christ, worn out with hardships and hunger, had passed to
        the blessed life, he sat in the chair of Peter, with the clergy consenting, as the lawful
        successor of Peter, and in that summit of the Apostolic ministry bore himself as the dignity
        of the supreme office entrusted to him, and the salvation and utility of all the faithful of
        Christ committed to his care, required; for he was gentle, kind and meek, and, what is
        chief, illustrious for sanctity of life.


        He had singular care of the clergy, whom he always pursued with paternal love and many
        benefits. Toward the needy, however, his wonderful beneficence shone, to whom he distributed
        with liberal hand the revenues of the Church, living and dying, deeming above all that the
        Church's wealth could not be applied to nobler uses, and that it was rightly handed over
        from the hands of the needy to the treasury of eternity, with incredible gain of spiritual
        usury. After two years and almost nine months he rested in a holy end, in the year of Christ
        655, and his body was laid in the basilica of St. Peter.
    status: { la: verified, en: draft }
