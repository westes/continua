# Matins content for Easter Tuesday (temporalId easter-tuesday, Pasc0-2 --
# "Die III infra octavam Paschæ"). Sourced from web/www/horas/Latin/
# Tempora/Pasc0-2.txt (Latin homily) / English/Tempora/Pasc0-2.txt
# (English homily); Gospel pericope from the Missal's own [Evangelium]
# (missa/Latin+English/Tempora/Pasc0-2.txt), same convention as
# easter-monday.yml.
#
# Single-nocturn source form, same structural note as easter-monday.yml.
# Lectio1's homily portion (incipit dropped) combined with Lectio2-3 into
# one continuous reading. Responsory: the source's own [Responsory1]
# ("Virtúte magna reddébant Apóstoli").
id: easter-tuesday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Lucas 24:36-47", en: "Luke 24:36-47" }
    text:
      la: >-
        In illo témpore: Stetit Jesus in médio discipulórum suórum et dicit eis: Pax vobis: ego sum,
        nolíte timére. Conturbáti vero et contérriti, existimábant se spíritum vidére. Et dixit eis:
        Quid turbáti estis, et cogitatiónes ascéndunt in corda vestra? Vidéte manus meas et pedes,
        quia ego ipse sum: palpáte et vidéte: quia spíritus carnem et ossa non habet, sicut me vidétis
        habére. Et cum hoc dixísset, osténdit eis manus et pedes. Adhuc autem illis non credéntibus et
        mirántibus præ gáudio, dixit: Habétis hic aliquid, quod manducétur? At illi obtulérunt ei
        partem piscis assi et favum mellis. Et cum manducásset coram eis, sumens relíquias, dedit eis.
        Et dixit ad eos: Hæc sunt verba, quæ locútus sum ad vos, cum adhuc essem vobíscum, quóniam
        necésse est impléri ómnia, quæ scripta sunt in lege Móysi et Prophétis et Psalmis de me. Tunc
        apéruit illis sensum, ut intellégerent Scriptúras. Et dixit eis: Quóniam sic scriptum est, et
        sic oportébat Christum pati, et resúrgere a mórtuis tértia die: et prædicári in nómine ejus
        pœniténtiam, et remissiónem peccatórum in omnes gentes.
      en: >-
        At that time, Jesus stood in the midst of them, and saith to them: Peace be to you; it is I,
        fear not. But they being troubled and frightened, supposed that they saw a spirit. And He
        said to them: Why are you troubled, and why do thoughts arise in your hearts? See My hands
        and feet, that it is I Myself; handle, and see: for a spirit hath not flesh and bones, as you
        see Me to have. And when He had said this, He showed them His hands and feet. But while they
        yet believed not, and wondered for joy, He said: Have you any thing to eat? And they offered
        Him a piece of a broiled fish, and a honeycomb. And when He had eaten before them, taking the
        remains, He gave to them. And He said to them: These are the words which I spoke to you,
        while I was yet with you, that all things must needs be fulfilled, which are written in the
        law of Moses, and in the prophets, and in the psalms, concerning Me. Then He opened their
        understanding, that they might understand the scriptures. And He said to them: Thus it is
        written, and thus it behoved Christ to suffer, and to rise again from the dead, the third
        day: And that penance and remission of sins should be preached in His name, unto all nations,
        beginning at Jerusalem. And you are witnesses of these things.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, Book 10, Commentary on Luke 24"
    text:
      la: >-
        Mirum, quo modo se natúra corpórea per impenetrábile corpus infúderit invisíbili áditu,
        visíbili conspéctu: tangi fácilis, diffícilis æstimári. Dénique conturbáti discípuli
        æstimábant se spíritum vidére. Et ídeo Dóminus, ut spéciem nobis resurrectiónis osténderet:
        Palpáte, inquit, et vidéte, quia spíritus carnem et ossa non habet, sicut me vidétis habére.
        Non ergo per incorpóream natúram, sed per resurrectiónis qualitátem, impérvia usu clausa
        penetrávit. Nam quod tángitur, corpus est: quod palpátur, corpus est.


        In córpore autem resurgémus. Seminátur enim corpus animále, surgit corpus spiritále: sed
        illud subtílius, hoc crássius, útpote adhuc terrénæ labis qualitáte concrétum. Nam quómodo
        non corpus, in quo manébant insígnia vúlnerum, vestígia cicatrícum, quæ Dóminus palpánda
        óbtulit? In quo non solum fidem firmat, sed étiam devotiónem ácuit, quod vúlnera suscépta pro
        nobis cælo inférre máluit, abolére nóluit: ut Deo Patri nostræ prétia libertátis osténderet.
        Talem sibi Pater ad déxteram locat, trophǽum nostræ salútis ampléctens: tales illic Mártyres
        nobis cicatrícis suæ coróna monstrávit.


        Et quóniam sermo huc noster evásit, considerémus qua grátia secúndum Joánnem credíderint
        Apóstoli, qui gavísi sunt; secúndum Lucam quasi incréduli redarguántur: ibi Spíritum Sanctum
        accéperint, hic sedére in civitáte jubeántur, quoadúsque induántur virtúte ex alto. Et vidétur
        mihi ille quasi Apóstolus majóra et altióra tetigísse, hic sequéntia et humánis próxima: hic
        histórico usus circúitu, ille compéndio: quia et de illo dubitári non potest, qui testimónium
        pérhibet de iis, quibus ipse intérfuit, et verum est testimónium ejus: et ab hoc quoque, qui
        Evangelísta esse méruit, vel negligéntiæ, vel mendácii suspiciónem æquum est propulsári. Et
        ídeo verum putámus utrúmque, non sententiárum varietáte, nec personárum diversitáte
        distínctum. Nam etsi primo Lucas eos non credidísse dicat, póstea tamen credidísse
        demónstrat: et si prima considerémus, contrária sunt: si sequéntia, certum est conveníre.
      en: >-
        We see here the marvelous nature of the Lord's glorified Body. It could enter unseen, and
        then become seen. It could easily be touched, but Its nature is hard to understand. The
        disciples were affrighted, and supposed that they had seen a spirit. And therefore the Lord,
        that He might show us the evidence of His Resurrection, said: Handle Me, and see; for a
        spirit hath not flesh and bones as ye see Me have. Therefore it was not by being in a
        disembodied state, but by the peculiar qualities of the risen and glorified Body that He had
        passed through closed doors. For that which is touched or handled is a body.


        We shall all rise again with our bodies. But it is sown a natural body; it is raised a
        spiritual body. The spiritual body is the finer, and the natural body is the grosser,
        besodden as yet by the corruption of earth. Was not that a real Body, wherein remained those
        marks of His Wounds, those holes of the nail-prints, which the Lord bade His disciples to
        handle? Hereby, also, He hath not only strengthened our faith, but also quickened our love,
        since we know that it has been His will to carry to heaven those Wounds which He bore for our
        sake, and wherewith He would not make away; but plainly showeth to His Eternal Father the
        price of our freedom. It is as marked with these Wounds and embracing the trophy of our
        salvation that the Father hath said to Him, Sit Thou at My right Hand: and it is, like Him,
        marked with their wounds, that He hath shown us that the Martyrs, whose Crown He is, are, and
        will be with Him there.


        And now, since our Lesson from Luke here faileth, let us have recourse to John, and consider
        how that, according to him, then were the disciples glad when they saw the Lord, and received
        the grace of faith. According to Luke, He upbraided them with their unbelief, but according
        to John He said also, Receive ye the Holy Ghost. Luke, not John, hath, Tarry ye in the city of
        Jerusalem, until ye be endued with power from on high. Indeed, to me it seemeth as though the
        one Evangelist had busied himself with the greater and higher matters, and the other with the
        narrative, and such things as are more human: the one with the course, the other with the
        essence, of history. For as it is impossible to doubt the word of him who testifieth of these
        things, and who saw these things, and concerning whom we know that his testimony is true, so
        is it sinful to think of negligence or falsehood as attaching to the other, even Luke, who
        earned to himself to be an Evangelist, albeit he was not an Apostle, and therefore we hold
        that both are truthful, neither are they at variance one with the other, either in the
        difference of the words they use, or in the sacredness of their characters as Evangelists.
        For though Luke saith that at the first the Apostles believed not, yet he showeth that
        afterward they believed: and although, if we regard only the first fact, the Evangelists seem
        divergent one from the other, yet, when we consider what cometh afterward, we see that they
        are at one.
    responsory:
      la: "R. Virtúte magna reddébant Apóstoli, * Testimónium resurrectiónis Jesu Christi Dómini nostri, allelúia, allelúia.\nV. Repléti quidem Spíritu Sancto loquebántur cum fidúcia verbum Dei.\nR. Testimónium resurrectiónis Jesu Christi Dómini nostri, allelúia, allelúia."
      en: "R. With great power gave the Apostles * witness of the Resurrection of our Lord Jesus Christ, alleluia, alleluia.\nV. They were all filled with the Holy Ghost, and they spoke the Word of God with boldness.\nR. Witness of the Resurrection of our Lord Jesus Christ, alleluia, alleluia."
    status: { la: verified, en: verified }
