# Matins Nocturn 2 and 3 readings for the Crown of Thorns (Friday after Ash Wednesday).
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt.
# Nocturn 2: Lectio4-6, three passages of St. Bernard (the source cites "Serm. 2
# in Epiph. Domini" and "Serm. 41 in Cant."), combined into one reading, its
# closing responsory the source's Responsory6. Nocturn 3: the Gospel (John
# 19:1-5, the source's Mass Gospel) and then St. Bernard's homily on it (Lectio7
# after the incipit, and Lectio8), its closing responsory the source's
# Responsory8. Nocturn 1 (Lectio1-3, from Tempora/Quad5-5) is not carried:
# continua's first nocturn runs the Scripture course.
#
# Latin: "líbera" for "úbera" ("inter ubera mea", Cant 1:12, five times in Lectio5-6),
# "hsec"/"hgec" for "hæc", and "Hvore" for "livóre" are source typos, corrected
# silently. Everything else is verbatim.
# The English is this project's own translation, marked draft.
id: crown-of-thorns
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Bernard of Clairvaux, Sermon 2 on the Epiphany and Sermon 41 on the Song of Songs"
    text:
      la: |
          Egredímini fíliæ Sion; vobis dícimus, fíliæ Sion, ánimæ sæculares, débiles, delicatæ; fíliæ, et non fílii, in quibus nihil est fortitúdinis, nihil est virilis ánimi. Egredímini de sensu carnis ad intelléctum mentis, de servitúte carnalis concupiscéntiæ ad libertatem spirituális intelligéntiæ. Egredímini de terra vestra, et de cognatióne vestra, et de domo patris vestri, et vidéte regem Salomónem in diadémate, quo coronávit eum mater sua, in coróna paupertátis, in coróna misériæ; síquidem coronátus est et a noverca sua coróna spinea, coróna misériæ, coronandus a família sua coróna justítiæ, quando exíbunt Ángeli, et tollent de regno ejus ómnia scandala, quando véniet ad judícium cum senioribus pópuli sui, cum pugnabit pro eo orbis terrárum advérsus insensatos. Corónat eum et Pater coróna glóriæ, sicut ait Psalmista: Glória et honóre coronásti eum Dómine. Vidéte eum fíliæ Sion in diadémate quo coronávit eum mater sua.

          Ego, fratres, ab ineúnte mea conversióne pro acervo meritórum, quæ mihi deesse sciebam, mihi fascículum collectum ex ómnibus anxietatibus et amaritudinibus Dómini mei colligare, et inter úbera mea collocare curavi. Memóriam abundántiæ suavitátis horum eructabo quoad vixero: in ætérnum non oblivíscar miseratiónes istas, quia in ipsis vivificatus sum. Mihi hic salutáris fasciculus servatus est; nemo tollet eum a me: inter úbera mea commorábitur. Hæc meditari, dixi sapiéntiam: in his justítiæ mihi perfectiónem constitui, in his plenitúdinem sciéntiæ, in his divítias salútis, in his cópias meritórum. Ex his mihi intérdum potus salutáris amaritúdinis: ex his rursum suávis linctio consolatiónis. Hæc me erigunt in advérsis, in prósperis reprimunt, et inter læta tristiaque vitæ præsentis, via régia incedenti tutum præbent utrobíque ducatum, hinc inde mala imminentia propulsando. Hæc mihi conciliant mundi Júdicem, dum treméndum potestatibus, mitem humilemque figúrant; dum non solum placabilem, sed et imitabilem repræsentant eum, qui inaccessibilis est principatibus, terríbilis apud reges terræ.

          Hæc proptérea mihi in ore frequénter, sicut vos scitis: hæc in corde semper, sicut Deus scit: hæc stylo meo ádmodum familiaria, sicut appáret: hæc mea sublimior ínterim philosophía, scire Jesum, et hunc crucifíxum. Non requiro, sicut sponsa, ubi cubet in merídie, quem lætus amplector mea inter líbera commorantem. Non requiro ubi pascat in merídie, quem intúeor Salvatórem in cruce. Illud sublimius, istud suavius: panis illud, hoc lac: hoc víscera réficit parvulórum: hoc replet úbera matrum; et ídeo inter úbera mea commorábitur. Hunc et vos, dilectíssimi, tam diléctum fascículum colligite vobis: hunc medúllis inserite cordis, hoc munite aditum pectoris, ut et vobis inter líbera commoretur. Si enim ante óculos habueritis quem portatis, pro certo vidéntes angústias Dómini, levius vestras portabitis, ipso auxiliante Ecclésiæ sponso, qui est super ómnia Deus benedíctus in sǽcula. Amen.
      en: |
          Go forth, ye daughters of Sion; to you we speak, daughters of Sion, worldly souls, weak and delicate; daughters, and not sons, in whom there is nothing of fortitude, nothing of manly spirit. Go forth from the sense of the flesh to the understanding of the mind, from the servitude of carnal desire to the liberty of spiritual understanding. Go forth from your land, and from your kindred, and from your father's house, and see king Solomon in the diadem wherewith his mother crowned him, in the crown of poverty, in the crown of misery; since he was crowned also by his stepmother with a crown of thorns, a crown of misery, and is to be crowned by his household with the crown of justice, when the Angels shall go out, and shall take out of his kingdom all scandals, when he shall come to judgment with the ancients of his people, when the whole world shall fight for him against the senseless. His Father also crowns him with the crown of glory, as the Psalmist saith: Thou hast crowned him, O Lord, with glory and honour. See him, daughters of Sion, in the diadem wherewith his mother crowned him.

          I, brethren, from the beginning of my conversion, in place of the heap of merits which I knew were wanting to me, took care to gather for myself a little bundle of all the anxieties and bitternesses of my Lord, and to lay it between my breasts. The memory of the abundance of their sweetness I will pour forth as long as I live: for ever I will not forget these mercies, because in them I have been quickened. This saving bundle has been kept for me here; no one shall take it from me: it shall abide between my breasts. These things I have said to be wisdom to meditate: in these I have set the perfection of justice for myself, in these the fullness of knowledge, in these the riches of salvation, in these the abundance of merits. From these I have at times a saving cup of bitterness; from these again a sweet taste of consolation. These raise me up in adversity, they restrain me in prosperity, and between the joys and sorrows of this present life they give me safe guidance on both sides as I walk the king's highway, driving off imminent evils on either hand. These reconcile to me the Judge of the world, while they present him, terrible to the powers, as gentle and humble; while they show him not only as appeasable but also as imitable, who is inaccessible to principalities, terrible among the kings of the earth.

          These things, therefore, are frequently in my mouth, as you know: these ever in my heart, as God knows: these quite familiar to my pen, as appears: this is my sublimer philosophy in the meantime, to know Jesus, and him crucified. I do not seek, like the bride, where he lies at noon, whom I joyfully embrace abiding between my breasts. I do not seek where he feeds at noon, whom I behold as Saviour on the cross. That is more sublime, this more sweet: that is bread, this milk: this refreshes the bowels of little ones; this fills the breasts of mothers; and therefore he shall abide between my breasts. This bundle, so beloved, gather for yourselves also, most beloved; plant it in the marrow of your heart, fortify with it the entrance of your breast, that he may abide between your breasts too. For if you have before your eyes him whom you carry, seeing for certain the straits of the Lord, you will bear your own more lightly, with the help of the Spouse of the Church, who is over all things God blessed for ever. Amen.
    responsory:
      la: |
          R. Arcam de lignis Setim deaurábis auro mundíssimo intus et foris: * Faciésque supra corónam áuream per circúitum.
          V. Pones in arca testificatiónem, quam dabo tibi.
          R. Faciésque supra corónam áuream per circúitum.
      en: |
          R. Thou shalt overlay the ark of shittim wood with the purest gold within and without: * And thou shalt make over it a crown of gold round about.
          V. And thou shalt put into the ark the testimony which I shall give thee.
          R. And thou shalt make over it a crown of gold round about.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: true
    citation:
      la: "Joann 19:1-5"
      en: "John 19:1-5"
    text:
      la: "In illo témpore: Apprehéndit Pilátus Jesum et flagellávit. Et mílites plecténtes corónam de spinis, imposuérunt cápiti ejus: et veste purpúrea circumdedérunt eum. Et veniébant ad eum et dicébant: Ave, Rex Judæórum: et dabant ei álapas. Exívit ergo íterum Pilátus foras et dicit eis: Ecce, addúco vobis eum foras, ut cognoscátis, quia nullam invénio in eo causam. Exívit ergo Jesus portans corónam spíneam et purpúreum vestiméntum."
      en: "At that time: Pilate therefore took Jesus, and scourged him. And the soldiers platting a crown of thorns, put it upon his head: and they put on him a purple garment. And they came to him, and said: Hail, King of the Jews; and they gave him blows. Pilate therefore went forth again, and saith to them: Behold, I bring him forth unto you, that you may know that I find no cause in him. Jesus therefore came forth, bearing the crown of thorns and the purple garment."
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: false
    source: "St. Bernard of Clairvaux, Sermon 50 on Various Subjects"
    text:
      la: |
          Vidéte, fíliæ Sion, regem Salomónem. Non dicit Ecclesiasten, aut Ididam. Nam et his nomínibus appellátus est rex ille: et significat Jesum Christum, nostrum verum Salomónem, qui est Sálomon, id est, pacíficus in exsílio: Ecclesiastes, id est, concionátor in judício: Idida, id est, diléctus Dómini in regno, ibíque rex. In exsílio mansúetus, in judício justus, in regno gloriósus. In exsílio amabilis, in judício terríbilis, in regno admirábilis. In diadémate quo coronávit eum mater sua. Est autem hæc coróna misericórdiæ, et in hac imitabilis. Coronávit eum et noverca sua coróna misériæ, et in hac contemptibilis. Synagogam loquor, quæ se ei non matrem exhíbuit, sed novercam.

          Coronabit eum família sua coróna justítiæ, et in hac terríbilis: corónat eum Pater suus coróna glóriæ, et in hac desiderabilis. Vídeant ergo eum peccatóres in coróna misériæ, id est, spinea, et compungantur: vídeant eum fíliæ Sion, ánimæ affectuose, in coróna misericórdiæ, et imiténtur. Vidébunt eum ímpii in coróna justítiæ, et períbunt: vidébunt eum sancti in coróna glóriæ, et perpetualiter gaudébunt. Coronantur quidem et álii imitatóres ipsíus; sed hoc ex indústria adjúti per grátiam. Solus iste a matre coronátus est, quia solus cum ordinatis affectionibus, tamquam sponsus e thálamo, procéssit ex útero matris.
      en: |
          See, daughters of Sion, king Solomon. He does not say Ecclesiastes, or Jedidiah. For that king too was called by these names, and he signifies Jesus Christ, our true Solomon, who is Solomon, that is, peaceable, in exile; Ecclesiastes, that is, preacher, in judgment; Jedidiah, that is, beloved of the Lord, in the kingdom, and there king. In exile gentle, in judgment just, in the kingdom glorious. In exile lovable, in judgment terrible, in the kingdom admirable. In the diadem wherewith his mother crowned him. This is the crown of mercy, and in this he is imitable. His stepmother also crowned him with a crown of misery, and in this he is contemptible. I speak of the Synagogue, which showed herself to him not as a mother but as a stepmother.

          His household shall crown him with the crown of justice, and in this he is terrible: his Father crowns him with the crown of glory, and in this he is desirable. Let sinners therefore see him in the crown of misery, that is, of thorns, and be pierced with compunction: let the daughters of Sion, affectionate souls, see him in the crown of mercy, and imitate him. The wicked shall see him in the crown of justice, and shall perish: the saints shall see him in the crown of glory, and shall rejoice for ever. Others also, his imitators, are crowned; but this by industry, helped by grace. He alone was crowned by his mother, because he alone, with ordered affections, like a bridegroom from his chamber, came forth from his mother's womb.
    responsory:
      la: |
          R. Christus sciens dolórem et infirmitátem, spinis coronátus, * Ipse est qui corónat vos in misericórdia et miseratiónibus.
          V. Vulnerátus propter iniquitátes nostras, attrítus propter scélera nostra, cujus livóre sanáti sumus.
          R. Ipse est qui corónat vos in misericórdia et miseratiónibus.
      en: |
          R. Christ, knowing sorrow and infirmity, crowned with thorns, * He it is who crowneth you in mercy and compassion.
          V. Wounded for our iniquities, bruised for our sins, by whose bruises we are healed.
          R. He it is who crowneth you in mercy and compassion.
    status: { la: verified, en: draft }
