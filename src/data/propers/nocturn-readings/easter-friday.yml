# Matins content for Easter Friday (temporalId easter-friday, Pasc0-5 --
# "Die VI infra octavam Paschæ"). Sourced from web/www/horas/Latin/
# Tempora/Pasc0-5.txt (Latin homily) / English/Tempora/Pasc0-5.txt
# (English homily); Gospel pericope from the Missal's own [Evangelium]
# (missa/Latin+English/Tempora/Pasc0-5.txt), same convention as
# easter-monday.yml.
#
# Single-nocturn source form, same structural note as easter-monday.yml.
# Lectio1's homily portion (incipit dropped) combined with Lectio2-3 into
# one continuous reading. Responsory: the source's own [Responsory1]
# ("Surgens Jesus Dóminus noster").
id: easter-friday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Matthæus 28:16-20", en: "Matthew 28:16-20" }
    text:
      la: >-
        In illo témpore: Undecim discípuli abiérunt in Galilǽam, in montem, ubi constitúerat illis
        Jesus. Et vidéntes eum adoravérunt: quidam autem dubitavérunt. Et accédens Jesus locútus est
        eis, dicens: Data est mihi omnis potéstas in cœlo, et in terra. Eúntes ergo, docéte omnes
        gentes, baptizántes eos in nómine Patris, et Fílii, et Spíritus Sancti: docéntes eos serváre
        ómnia, quæcúmque mandávi vobis. Et ecce, ego vobíscum sum ómnibus diébus usque ad
        consummatiónem sǽculi.
      en: >-
        At that time, the eleven disciples went into Galilee, unto the mountain where Jesus had
        appointed them. And seeing Him they adored: but some doubted. And Jesus coming, spoke to
        them, saying: All power is given to Me in heaven and in earth. Going therefore, teach ye all
        nations; baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:
        teaching them to observe all things whatsoever I have commanded you: and behold I am with you
        all days, even to the consummation of the world.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Jerome, Priest, Book 4, Commentary on the end of Matthew"
    text:
      la: >-
        Post resurrectiónem Jesus in monte Galilǽæ conspícitur, ibíque adorátur; licet quidam
        dúbitent, et dubitátio eórum nostram áugeat fidem. Tunc maniféstius osténditur Thomæ, et
        latus láncea vulnerátum, et manus fixas demónstrat clavis. Accédens Jesus locútus est eis,
        dicens: Data est mihi omnis potéstas in cælo et in terra. Illi potéstas data est, qui paulo
        ante crucifíxus, qui sepúltus in túmulo, qui mórtuus jacúerat, qui póstea resurréxit. In cælo
        autem et in terra potéstas data est: ut qui ante regnábat in cælo, per fidem credéntium
        regnet et in terris.


        Eúntes autem docéte omnes gentes, baptizántes eos in nómine Patris, et Fílii, et Spíritus
        Sancti. Primum docent omnes gentes, deínde doctas intíngunt aqua. Non enim potest fíeri, ut
        corpus baptísmi recípiat sacraméntum, nisi ante ánima fídei suscéperit veritátem. Baptizántur
        autem in nómine Patris, et Fílii, et Spíritus Sancti: ut quorum una est divínitas, una sit
        largítio: noménque Trinitátis, unus Deus est.


        Docéntes eos serváre ómnia, quæcúmque mandávi vobis. Ordo præcípuus: jussit Apóstolis, ut
        primum docérent univérsas gentes, deínde fídei intíngerent sacraménto, et post fidem ac
        baptísma, quæ essent observánda præcíperent. Ac ne putémus lévia esse, quæ jussa sunt, et
        pauca, áddidit: Omnia quæcúmque mandávi vobis: ut quicúmque credíderint, qui in Trinitáte
        fúerint baptizáti, ómnia fáciant, quæ præcépta sunt. Et ecce ego vobíscum sum usque ad
        consummatiónem sǽculi. Qui usque ad consummatiónem sǽculi cum discípulis se futúrum esse
        promíttit, et illos osténdit semper esse victúros, et se nunquam a credéntibus recessúrum.
      en: >-
        After His Resurrection Jesus was seen on a mountain in Galilee, and there He was worshipped;
        and, albeit some doubted, their doubts have led to a further establishing of our faith. Then
        He showed Himself more openly unto Thomas, and made him handle the Side that was pierced with
        the spear, and the Hands wherein were the holes of the nails. And Jesus came and spake unto
        them, saying: All power is given unto Me in heaven and in earth. Yea, all power is given unto
        Him Who but a little while before had been crucified, and buried in the grave, and had lain
        among the dead, but Who also had risen again. Power is given unto Him in heaven and in earth,
        that He Who of everlasting had been King of heaven, might have a Monarchy on earth also,
        through the faith of them which believe in Him.


        Go ye therefore and teach all nations, baptizing them in the Name of the Father, and of the
        Son, and of the Holy Ghost. First, they teach all nations; then, they wash with water them
        whom they have taught. For it is impossible for the body to receive the Sacrament of Baptism,
        unless the mind first receive the truth of the faith. And they are baptized In the Name of
        the Father, and of the Son, and of the Holy Ghost for, even as the Godhead of the Father, and
        of the Son, and of the Holy Ghost, is all One, so is the one grace of Baptism the gift of all
        the Three Divine Persons: and the Name of the Trinity is the Name of One God.


        Preaching them to observe all things whatsoever I have commanded you. The order of the
        Lord's commands to the Apostles is markedly this. First, to teach all nations; secondly, to
        make them partake in the Sacrament of the faith; thirdly, when they had believed and been
        baptized, to teach them what to observe. And lest we should think that He commanded things
        light and few, He hath said: All things whatsoever I have commanded you, so that all, who
        have believed and been baptized in the Name of the Trinity, are bound to observe all things
        whatsoever He hath commanded. And, lo, I am with you alway, even unto the end of the world.
        He Who promiseth that He will be with His disciples even unto the end of the world, doth give
        them thereby to know that they will be always conquerors, and that He will never fail any who
        believe in Him.
    responsory:
      la: "R. Surgens Jesus Dóminus noster, stans in médio discipulórum suórum, dixit: * Pax vobis, allelúja: gavísi sunt discípuli viso Dómino, allelúja.\nV. Una ergo sabbatórum, cum fores essent clausæ, ubi erant discípuli congregáti, venit Jesus, et stetit in medio eórum, et dixit eis.\nR. Pax vobis, allelúja: gavísi sunt discípuli viso Dómino, allelúja."
      en: "R. After that our Lord Jesus was risen again, He came and stood in the midst of His disciples, and said unto them: * Peace be unto you, alleluia. Then were the disciples glad, when they saw the Lord, alleluia.\nV. The first day of the week, when the doors were shut where the disciples were assembled, came Jesus, and stood in the midst, and said unto them:\nR. Peace be unto you, alleluia. Then were the disciples glad, when they saw the Lord, alleluia."
    status: { la: verified, en: verified }
