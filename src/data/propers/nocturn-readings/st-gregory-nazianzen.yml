# Matins Nocturn 2 reading for St. Gregory Nazianzen, Bishop,
# Confessor, Doctor (May 9) — SanctiM/05-09.txt inherits the whole day
# (`@Sancti/05-09`) with no Nocturn 2/3 override, so this saint's own
# vita is sourced from the Tridentine track exactly as for a pre-1955
# saint (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-09.txt, English/Sancti/05-09.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
id: st-gregory-nazianzen
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gregórius, nobilis Cappadox, ex singulari divinárum Litterárum sciéntia Theólogi
        cognomen consecutus, Nazianzi in Cappadocia natus, Athenis in omni disciplinárum genere
        una cum sancto Basilío eruditus, ad stúdia sacrárum Litterárum se convértit; in quibus se
        in cœnobio per aliquot annos exercuérunt, illárum senténtiam non ex proprio ingenio, sed
        ex majórum ratióne et auctoritate interpretantes. Qui cum doctrina et vitæ sanctitáte
        florérent, vocáti ad munus prædicandæ evangelicæ veritátis, plurimos Jesu Christo
        fílios peperérunt.


        Gregórius ígitur, aliquándo domum reversus, primum Sasimórum epíscopus creátus est,
        deínde Nazianzenam ecclésiam administrávit. Tum Constantinopolim ad eam regéndam
        ecclésiam accersítus, cum civitátem hæresum purgatam erróribus ad catholicam fidem
        reduxísset, quod ei summum ómnium amórem conciliare debebat, multórum parávit invidiam.
        Itaque, cum inter episcopos magna proptérea esset facta seditio, sponte cedens
        episcopatu, illud prophetæ dictum usurpávit: Si propter me commóta est ista tempéstas,
        dejicite me in mare, ut vos jactari desinatis. Quare Nazianzum reversus, cum illi ecclésiæ
        Eulálium præficiéndum curasset, totum se ad contemplatiónem et scriptiónem divinárum
        rerum cóntulit.


        Scripsit autem multa, et soluta oratióne et versibus, mirábili pietáte et eloquéntia;
        quibus doctórum hóminum sanctorúmque judício id assecutus est, ut nihil in illis, nisi ex
        veræ pietátis et catholicæ religiónis regula, reperiátur, nemo quidquam jure vocare
        possit in dubium. Consubstantialitátis Fílii fuit acerrimus propugnator. Ut autem vitæ
        laude nemo ei præpositus est; sic et oratiónis gravitáte omnes facile superávit. In iis
        scribéndi ac legéndi stúdiis ruri vitam monachi exercens, imperatóre Theodosio ad
        cælestem vitam senio confectus migrávit.
      en: >-
        Gregory, to whom is commonly given, on account of his extraordinary depth of sacred
        learning, the title of the Divine, was a noble Cappadocian, born at Nazianzus in that
        country, and educated at Athens along with St. Basil, with whom likewise, when they had
        acquired knowledge in diverse branches of earthly learning, he gave himself up to learn
        the things of God. This they did for some years in a Monastery, framing their opinions,
        not out of their own heads, but according to the interpretation arrived at by the wisdom
        and decision of the ancients. They were both distinguished by power of doctrine and
        holiness of life; they were both called to the duty of preaching the Gospel of truth and,
        through the Gospel, they both begat many sons unto Christ.


        Gregory after a while returned home. He was first made Bishop of Sasima, and afterwards
        administered the Church at Nazianzus. Then he was called to rule the Church of
        Constantinople. That city, which he found reeking with heresy, he purged, and brought
        again to the Catholic faith. But this, which deserved for him the warmest love of all men,
        raised up many enemies. Among the Bishops themselves there was a great party against him,
        and to still their contentions, he, of his own free will, gave up his see, saying with the
        Prophet Jonah: Take me up, and cast me forth into the sea; so shall the sea be calm unto
        you, for I know that for my sake this great tempest is upon you. So he went his way back
        again to Nazianzus, and when he had seen that Eulalius was set over that Church, he gave
        himself up altogether to think and write concerning the things of God.


        He wrote much, both in prose and verse, with wonderful godliness and eloquence.
        According to the judgment of learned and holy men, there is nothing in his writings which
        anywhere strays from the line of true godliness and Catholic truth, and not a single word
        which any one can justly call in doubt. He was one of the latest champions of the
        doctrine that the Son is of one substance with the Father. No one has ever won greater
        praise for goodness of life, neither was any man more earnest in prayer. During the reign
        of the Emperor Theodosius, he dwelt in the country after the manner of a monk, and
        unceasingly taken up with writing and reading, until, in a good old age, he laid down his
        earthly, to enter on an heavenly life.
    status: { la: verified, en: verified }
