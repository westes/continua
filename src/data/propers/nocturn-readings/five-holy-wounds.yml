# Matins Nocturn 2 and 3 readings for the Five Holy Wounds (Friday of Lent 3).
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt.
# Nocturn 2: Lectio4-6, two passages of St. Bernard on the Passion (the source names
# them "Lib. de Pass. Dom., cap. 41" and "Serm. de Passione Domini"), combined into
# one reading, its closing responsory the source's Responsory6. Nocturn 3: the
# Gospel (John 19:28-35, the source's Mass Gospel via Commune/Votiva/V6) and then
# St. Cyril of Alexandria's homily on it (Lectio7 after the incipit, and Lectio8),
# its closing responsory the source's Responsory8. Nocturn 1 (Lectio1-3) is not
# carried: continua's first nocturn runs the Scripture course.
#
# The English is this project's own translation, marked draft.
id: five-holy-wounds
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Bernard of Clairvaux, On the Passion of the Lord"
    text:
      la: |
          Captus ergo Jesus post plúrimas illusiones tam Judæórum quam Géntium, post sánguinis plures effusiones, clavis immitibus mánibus simul et pédibus perforatur, et confígitur ligno crucis Salvátor noster mitissimus Jesus. Intuere, et réspice rosam passiónis sanguineæ, quómodo rubet in indícium ardentissimæ caritátis. Contendunt pássio et cáritas: illa, ut plus ardeat; ista, ut plus rúbeat.

          Vide quómodo hoc flore rosæ florúerit optima vitis nostra, rubicúndus Jesus. Vide totum corpus, sicubi rosæ sanguineæ florem non invénias. Inspice manum unam et álteram, si florem rosæ non invénias in utráque. Inspice pedem unum et álterum: numquid non rosei? Inspice láteris apertúram, quia nec illa caret rosa, quamvis ipsa subrúbea sit, propter mixtúram aquæ, quia, sicut narrat Evangelísta, cum unus mílitum láncea latus ejus perforasset, exívit sanguis et aqua.

          Réspice Dómine sancte Pater de sanctuário tuo, et de excélso cœlorum habitáculo, et intuere hanc sacrosanctam hóstiam, quam tibi offert magnus póntifex noster, sanctus puer tuus Dóminus Jesus, pro peccátis fratrum suórum; et esto placabilis super multitúdine malítiæ nostræ. Cognósce Pater túnicam fílii tui Joseph. Heu! fera péssima devorávit eum, et conculcávit in furóre suo vestiméntum ejus: ecce quinque scissúras lamentabiles in eo relíquit.
      en: |
          Jesus, then, our most gentle Saviour, having been seized after very many mockeries both of Jews and of Gentiles, after many sheddings of blood, is pierced through hands and feet with merciless nails, and is fastened to the wood of the cross. Behold and consider the rose of the bloody passion, how it reddens as a sign of most ardent charity. Passion and charity contend: the one, that it may burn the more; the other, that it may redden the more.

          See how our best vine has flowered with this flower of the rose, Jesus all red. Look over the whole body, whether anywhere you do not find the flower of the bloody rose. Look at one hand and the other: do you not find the flower of the rose in each? Look at one foot and the other: are they not rosy? Look at the opening of the side, for that too lacks not the rose, though it is somewhat reddish because of the mixture of water; for, as the Evangelist relates, when one of the soldiers had pierced his side with a lance, there came out blood and water.

          Look down, O Lord, holy Father, from thy sanctuary and from the high dwelling-place of the heavens, and behold this most holy victim, which our great high priest, thy holy child the Lord Jesus, offers to thee for the sins of his brethren; and be appeased over the multitude of our malice. Know, Father, the coat of thy son Joseph. Alas! an evil beast hath devoured him, and trampled his garment in its fury: behold, it hath left in it five lamentable rents.
    responsory:
      la: |
          R. Videmus Jesum propter passiónem mortis glória et honóre coronátum, * Ut pro ómnibus gustaret mortem.
          V. Decebat eum, qui multos fílios in glóriam addúxerat, auctórem salútis eórum per passiónem consummari.
          R. Ut pro ómnibus gustaret mortem.
      en: |
          R. We see Jesus, for the suffering of death, crowned with glory and honour, * That he might taste death for all.
          V. It became him, who had brought many sons into glory, to consummate the author of their salvation by his passion.
          R. That he might taste death for all.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: true
    citation:
      la: "Joann 19:28-35"
      en: "John 19:28-35"
    text:
      la: "In illo témpore: Sciens Jesus, quia ómnia consummáta sunt, ut consummarétur Scriptúra, dixit: Sítio. Vas ergo erat pósitum acéto plenum. Illi autem spóngiam plenam acéto, hyssópo circumponéntes, obtulérunt ori ejus. Cum ergo accepísset Jesus acétum, dixit: Consummátum est. Et inclináto cápite trádidit spíritum. Judǽi ergo (quóniam Parascéve erat), ut non remanérent in cruce córpora sábbato (erat enim magnus dies ille sábbati), rogavérunt Pilátum, ut frangeréntur eórum crura et tolleréntur. Venérunt ergo mílites: et primi quidem fregérunt crura et altérius, qui crucifíxus est cum eo. Ad Jesum autem cum veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus crura, sed unus mílitum láncea latus ejus apéruit, et contínuo exívit sanguis et aqua. Et qui vidit, testimónium perhíbuit: et verum est testimónium ejus."
      en: "At that time: Jesus, knowing that all things were now accomplished, that the scripture might be fulfilled, said: I thirst. Now there was a vessel set there full of vinegar. And they, putting a sponge full of vinegar about hyssop, put it to his mouth. Jesus therefore, when he had taken the vinegar, said: It is consummated. And bowing his head, he gave up the ghost. Then the Jews (because it was the Parasceve), that the bodies might not remain upon the cross on the sabbath day (for that was a great sabbath day), besought Pilate that their legs might be broken, and that they might be taken away. The soldiers therefore came; and they broke the legs of the first, and of the other that was crucified with him. But after they were come to Jesus, when they saw that he was already dead, they did not break his legs; but one of the soldiers with a spear opened his side, and immediately there came out blood and water. And he that saw it hath given testimony: and his testimony is true."
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: false
    source: "St. Cyril of Alexandria, Commentary on John, Bk. 12"
    text:
      la: |
          Cum ab immanibus Judǽis omnis in Christum expleta esset impietas, nec quidquam jam ad summam crudelitátem relíquum esset, ad extrémum caro Christi sanctíssima próprium quiddam ac naturale rursus pátitur. Multis enim ac váriis dolóribus exsiccata, siti torquétur. Graves síquidem dolóres magnam ad sitim commovendam vim habent, naturáli quodam et inexplicábili calóre húmidum consumentes, et igneis ardoribus præcórdia urentes.

          Consummátum esse ait impietatis Judaicæ modum, et impotentem sæviendi ánimum. Quid enim Judǽi intentatum reliquerunt, aut quid non extremæ crudelitátis adhibuerunt? Quod supplicii aut contumeliæ genus prætermiserunt? Quamóbrem jure, Consummátum est, ait: sed hora jam eum ad prædicándum spirítibus, qui apud ínferos erant, invitante (advenit enim ut mortuórum ac vivórum dominaretur), ipsam pro nobis mortem suscépit, commúnem hanc natúræ nostræ passiónem sustínuit in carne sua.
      en: |
          When all impiety against Christ had been fulfilled by the savage Jews, and nothing was left of the utmost cruelty, at last the most holy flesh of Christ again suffers something proper and natural to it. For, dried up by many and various sorrows, it is tormented by thirst. Grave pains indeed have great power to stir up thirst, consuming the moisture with a certain natural and inexplicable heat, and burning the vitals with fiery ardours.

          He says that the measure of Jewish impiety was fulfilled, and their spirit powerless to rage further. For what did the Jews leave untried, or what extreme of cruelty did they not employ? What kind of punishment or insult did they leave out? Wherefore he rightly says, It is consummated: but the hour now inviting him to preach to the spirits who were in hell (for he came to be Lord of the dead and of the living), he took upon himself death itself for us, and bore in his flesh this common suffering of our nature.
    responsory:
      la: |
          R. Dignus es Dómine accípere librum, et aperíre signácula ejus, quóniam occísus es, et redemísti nos Deo * In sánguine tuo.
          V. Fecísti enim nos Deo nostro regnum, et sacerdótes.
          R. In sánguine tuo.
      en: |
          R. Thou art worthy, O Lord, to take the book, and to open the seals thereof, because thou wast slain, and hast redeemed us to God * In thy blood.
          V. And hast made us to our God a kingdom and priests.
          R. In thy blood.
    status: { la: verified, en: draft }
