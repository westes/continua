# Matins Nocturn 2 reading for St. Hormisdas, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/08-14-Hormisda.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-hormisdas
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Hormisdas, natióne Campanus, Justo patre Frusinate, séptimo a Symmachi óbitu die, cum jam
        sanctæ Románæ Ecclésiæ diáconus esset, summa ómnium consensióne ad sanctam Petri Sedem
        provectus est: in qua ita se gessit, et domínico gregi pascendo sedulam óperam navávit, ut
        non sine singulári Dei providentia ac divíno consílio eléctum fuísse perspectum sit. Hoc
        quippe hómine iis tempóribus Ecclésia indigebat, qui et res arduas faciéndas animose
        suscíperet, et susceptas ad optatum finem strénue perduceret.


        Ubi suprémum Pontíficis munus iniit, totum fere christianum orbem sub régibus barbaris vel
        hæréticis gementem invénit, et distractam in partes Ecclésiam. Sed octo annórum spatio, vir
        plane Deo plenus, perenni cura ac felíci laborum suórum eventu, eo rem addúxit, ut
        Orientales ecclésiæ, ab octogínta círciter annis fœdo schísmate separatæ, subscripto
        libello, quem is per suos legátos miserat, ad unitátem redierint; et Africæ sui epíscopi,
        quos in Sardíniam Vandali relegarant, fúerint restituti, et Lazorum rex ac pópulus ad
        Christi fidem, ejus ópera, inductus sit; ac demum Clodoveus Francorum rex ad eámdem fidem
        convérsus, solémni legatióne ad Sedem apostólicam, corónam áuream gemmis distinctam Hormisdæ
        obtulerit, ad perpétuum obediéntiæ et fídei monuméntum.


        Manichæos item discussit, eorúmque codices ante fores Constantinianæ basílicæ incéndio
        concremavit. Complúres epístolas scripsit ad vários, per univérsum orbem christianum, in
        quibus ardentissimus zelus religiónis amplificándæ, quo medullitus flagrabat, sacrárum
        litterárum sciéntia, cum limpidissimo et amœno stylo conjúncta, qua plúrimum valebat,
        singuláris rerum gerendarum peritia, præsértim cum régibus et optimatibus, qua præ céteris
        pollebat, aliæque heroicæ ánimi dotes, mirum in modum elucent. Ejus demum pia liberalitas in
        egénos et sacras ædes profusa fuit. Ac tandem suórum votorum compos, annis ac méritis
        gravis, et rerum gestárum glória apud Deum et hómines celeberrimus, post novem pontificátus
        annos, ad cœlestem pátriam migrávit, anno Christi quingentésimo vigésimo tértio, exanimi
        córporis exuviis Vaticánæ basílicæ relíctis.
      en: >-
        Hormisdas, a Campanian by race, his father Justus of Frosinone, on the seventh day after the
        death of Symmachus, when he was already deacon of the holy Roman Church, was raised, with
        the consent of all, to the holy See of Peter: in which he so bore himself, and applied such
        diligent labour to feeding the Lord's flock, that it was clearly seen he had been chosen not
        without singular providence of God and divine counsel. For in those times the Church needed
        a man who would take up difficult things to be done with spirit, and bring what he had
        undertaken vigorously to the desired end.


        When he entered on the supreme office of Pontiff, he found nearly the whole Christian world
        groaning under barbarian or heretical kings, and the Church torn into parts. But in the
        space of eight years, a man plainly full of God, by unceasing care and the happy outcome of
        his labours, he brought it about that the Eastern churches, separated for some eighty years
        by a foul schism, returned to unity by subscribing the formulary which he had sent through
        his legates; and the bishops of Africa, whom the Vandals had banished to Sardinia, were
        restored; and the king and people of the Lazi were led to the faith of Christ by his work;
        and finally Clovis, king of the Franks, converted to the same faith, offered Hormisdas by
        solemn legation to the Apostolic See a golden crown set with gems, as a perpetual monument
        of obedience and faith.


        He also examined the Manichaeans, and burned their books in a fire before the doors of the
        Constantinian basilica. He wrote very many letters to various persons throughout the whole
        Christian world, in which his most ardent zeal for spreading religion, with which he burned
        to the marrow, his knowledge of the sacred letters joined with a most limpid and pleasant
        style, in which he was very strong, his singular skill in conducting affairs, especially
        with kings and nobles, in which he excelled beyond others, and other heroic gifts of mind,
        shine wonderfully. His pious liberality toward the needy and sacred buildings was poured
        out. At last, master of his wishes, heavy with years and merits, and most celebrated before
        God and men for the glory of his deeds, after nine years of pontificate he migrated to the
        heavenly country, in the year of Christ 523, the remains of his lifeless body being left in
        the Vatican basilica.
    status: { la: verified, en: draft }
