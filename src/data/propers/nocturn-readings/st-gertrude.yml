# Matins Nocturn 2 reading for St. Gertrude (Nov 16). Sourced directly
# from web/www/horas/Latin/Sancti/11-16.txt, English/Sancti/11-16.txt.
# Lectio4-6 combined into one reading, one continuous vita. No
# [Lectio7] in the source -- no own Nocturn 3.
id: st-gertrude
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gertrúdis, Islébii in Saxónia nobili genere nata, quinquénnis
        in monastério Rodardénsi, ordinis sancti Benedicti,
        virginitátem suam ac seipsam Jesu Christo óbtulit. Quo ex
        témpore a mundanis rebus prorsus aliena, virtútique sedulo
        intenta, cæléstis vitæ genus instituit. Ad humaniórum
        litterárum notítiam, rerum divinárum cognitiónem adjunxit;
        quarum meditatióne vehementius ad virtútem incensa, brevi
        christianam perfectiónem adepta est. De Christo ejusque vitæ
        mystériis sæpenúmero pio cum animi sensu loquebátur, unamque
        Dei glóriam cogitans, ad illam vota sua ómnia et actiónes
        referebat. Quamvis autem multis exímiis natúræ et gratiæ
        donis a Deo aucta esset, ita tamen sibi ipsa vilescebat, ut,
        inter præcipua divinæ bonitátis miracula, hoc item
        memoráret, quod se indigníssimam misericorditer sustinéret.


        Trigesimum ætátis annum agens, primum Rodardénsis monasterii,
        ubi religiosam vitam est professa, deínde Elpediáni præses
        electa, quadragínta annórum spátio, ea caritate, prudéntia,
        et regularis disciplinæ studio munus obívit, ut cœnobium
        religiosæ perfectiónis domicílium viderétur. Utrobíque vero,
        licet esset ómnium mater et magistra, ómnium tamen minima
        haberi volebat, ac demissióne pari ministram se exhibebat.
        Quo liberius Deo vacaret, vigiliis, abstinéntia aliisque
        cruciátibus corpus afflixit; semperque sui símilis, morum
        innocéntiam, mansuetúdinem ac patiéntiam prætulit
        singularem. Proximórum salúti omni ope studuit, piæque curæ
        copiósum fructum rétulit. Divini amoris vi frequéntes
        patiebátur éxstases, altissimǽque contemplatiónis et divinæ
        uniónis donum obtinuit.


        Ut meritum acceptíssimæ sibi sponsæ Christus osténderet, in
        corde Gertrudis jucundam sibi esse mansiónem testátus est.
        Deiparam Vírginem, véluti matrem et curatricem a Jesu
        acceptam, pietáte præcipua prosequebátur, ab eáque multa
        accépit beneficia. Erga diviníssimum Eucharistiæ sacraméntum
        et passiónem Dómini tanto amóre cum grati animi sensu
        afficiebátur, ut intérdum ubéribus lácrimis perfunderétur.
        Justórum ánimas, piacularibus flammis addictas, quotidiánis
        subsidiis et precibus juvábat. Multa ad confovéndam
        pietátem scripsit. Divinárum étiam revelatiónum et
        prophetíæ dono cláruit. Dénique, flagrantíssimo Dei amóre
        potius quam morbo languéscens, anno Dómini millesimo
        ducentésimo nonagesimo secundo vita decessit. Miraculis
        vivens et post mortem a Deo illustráta est.
      en: >-
        Gertrude was born of a noble family at Eisleben, in Saxony,
        (about the year of our Lord 1264.) At five years of age she
        offered her virginity and herself to Jesus Christ, in the
        Benedictine nunnery at Rodalsdorf. From that time forth she
        was utterly estranged from earthly things, ever striving for
        things higher, and began to lead a kind of heavenly life. To
        learning in human letters she added knowledge of the things
        of God. In the thought thereof she earnestly desired, and
        soon reached, the perfection of a Christian soul. Of Christ,
        and of the things in His life, she spoke oftentimes with
        movings of spirit. The glory of God was the one end of all
        her thoughts, and to that her every longing and her every act
        were given. Though God had crowned her with so many and so
        noble gifts both of nature and of grace, her belief regarding
        herself was so humble that she was used to number as among
        the greatest of the wonders of His goodness that He had
        always in His mercy borne with one who was so utterly
        unworthy.


        In the thirtieth year of her age she was elected Abbess of
        Rodalsdorf, where she had professed herself in the religious
        life, and afterwards of Heldelfs. This office she bore for
        forty years in love, wisdom, and zeal for strict observance,
        so that the house seemed like an ideal example of a
        sisterhood of perfect nuns. To each one she was a mother and
        a teacher, and yet would be as the least of all, being in
        sooth in all lowliness among them as she that served. That
        she might be more utterly God's only, she tormented her body
        with sleeplessness, hunger, and other afflictions, but withal
        ever true to herself, stood forth a pattern of innocency,
        gentleness, and long-suffering. The salvation of her
        neighbours was her constant earnest endeavour, and her godly
        toil bore abundant fruit. The love of God oftentimes threw
        her into trances, and she was given the grace of the deepest
        contemplation, even to union of spirit with God.


        Christ Himself, to show what such a bride was to Him,
        revealed that He had in the heart of Gertrude a pleasant
        dwelling-place. The Virgin Mother of God she ever sought with
        deep reverence as a mother and warden whom she had received
        from Jesus Himself, and from her she had many benefits.
        Toward the most Divine Sacrament of the Eucharist, and the
        sufferings of the Lord, her soul was moved with love and
        gratitude, so that she sometimes wept abundantly. She helped
        with daily gifts and prayers the souls of the just condemned
        to the purifying fire. She wrote much for the fostering of
        godliness. She was glorified also by revelations from God,
        and by the gift of prophecy. Her last illness was rather the
        wasting of a home-sickness to be with God than a decay of the
        flesh, and she left this life (to live the undying life in
        Him, upon the 17th day of November,) in the year of our Lord
        1292. God made her bright with miracles both during her life
        and after her death.
    status: { la: verified, en: verified }
