# Matins Nocturn 2 reading for St. William of Vercelli (Montevergine),
# Abbot (Jun 25) — William is on both tracks: SanctiM/06-25.txt has its
# own Lectio5-8 vita (Nocturn 1's Lectio1-4 fall back to Common of an
# Abbot), a separately-transcribed but essentially identical account to
# Sancti/06-25.txt's own Lectio4-6 — since only the Tridentine file has
# an available English translation, this saint's content is sourced
# from that track here, same as a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-25.txt, English/Sancti/06-25.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source for these lessons.
id: st-william-abbot
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Guliélmus nobílibus paréntibus Vercéllis in Insúbria natus, vix quartum décimum ætátis
        annum expléverat, cum miro quodam pietátis ardóre flagrans, Compostellánam
        peregrinatiónem ad celebérrimum sancti Jacóbi templum aggréssus est, Quod iter una
        amíctus túnica, ac dúplici férreo círculo præcínctus, nudísque pédibus prosecútus,
        aspérrima frígoris et æstus, famis et sitis summo cum vitæ discrímine perpéssus est
        incómmoda. Revérsus in Itáliam, novam ad sanctum Dómini sepúlcrum peregrinatiónem
        molítur: sed quo minus propósitum exsequátur, vária atque gravíssima intercédunt
        impediménta, divíno númine ad altióra, et sanctióra religiósam júvenis índolem
        retrahénte. Porro in solículo monte biénnium inter assíduas preces, vigílias,
        chameúnias, et jejúnia commorátus, divína subníxus ope, cæco lumen restítuit. Cujus
        miráculi fama percrebrescénte, jam Guliélmus latére non póterat: quare íterum
        Jerosólymam cógitat, et álacris se itíneri commíttit.


        Dei autem mónitu, qui eídem appáruit, a propósito revocátur, utílior ac fructuósior tam
        apud Italos, quam apud éxteras natiónes futúrus. Tum monastérium in Virgiliáni montis
        cacúmine, quod deínde Vírginis est appellátum, loco áspero, et inaccésso miránda
        exædíficat celeritáte. Sócios deínde viros, et religiósos ascíscit, eósque ad vivéndi
        normam evangélicis præcéptis et consíliis summópere accommodátam tum certis légibus ex
        beáti Benedícti institútis magna ex parte desúmptis, tum verbo et sanctíssimæ vitæ
        exémplis infórmat.


        Aliis deínde monastériis eréctis, clárior in dies Guliélmi facta sánctitas multos ad eum
        úndique viros perdúcit, sanctitátis odóre, et miraculórum fama alléctos. Nam muti
        loquélam, surdi audítum, áridi vigórem, varióque et immedicábili morbo laborántes,
        sanitátem ipsíus intercessióne recepérunt. Aquam in vinum convértit, aliáque complúra
        mirabília patrávit: inter quæ illud non siléndum, quod, muliércula ad ejus castitátem
        tentándam missa, in ardéntibus prunis humi stratis illǽsum se volutávit. De qua re
        cértior factus Rogérius Neápolis rex, in summam viri Dei veneratiónem addúcitur. Demum
        témpore sui óbitus regi, aliísque prænuntiáto, innúmeris virtútibus et miráculis clarus
        obdormívit in Dómino, anno salútis millésimo centésimo quadragésimo secúndo.
      en: >-
        This William was born of noble parents at Vercelli in Lombardy. He was but little over
        fourteen years of age, when, impelled by a strange earnestness for holiness, he undertook
        a pilgrimage to Compostella, to the far-famed Church of St. James. This journey he made
        clad in a single garment, wearing an iron girdle wound two-fold round his body, and with
        bare feet. He accomplished his object under the severest hardships of cold and heat,
        hunger and thirst, and at the great danger of his life. After his return to Italy, he
        undertook a new pilgrimage, this time to the Holy Sepulchre of the Lord. But in the way of
        fulfilling this, there arose diverse and most grievous obstacles, whereby the hand of God
        drew the lad to the higher and holier life of a monk. He dwelt in the town of Monte
        Solicolo for two years, which he passed in constant prayer, watching, sleeping upon the
        ground, and fasting. At the end of this time, the power of God made him the mean to
        restore a blind man to sight. The fame of this miracle became so noised abroad, that
        William could no longer remain unknown. His thoughts turned again towards Jerusalem, and
        he again entered cheerfully on the journey.


        He was again hindered by a vision from God, and remained among the Italians to be more
        useful, and to bring forth more fruit than he would have done among strangers. With
        extraordinary speed, he built a monastery upon the summit of Monte Vergiliano, ever since
        named Monte Vergine. Thither he called around him, as his comrades, devout men, and
        schooled them into a way of life most closely following the commands and counsels of the
        Gospel, in great part by a rule taken from the constitutions of Blessed Benedict, and
        supplemented by his own words, and the example of his own holy life.


        As other monasteries were raised, the holy life of William became more known day by day,
        and brought men to him from all quarters, drawn by the sweet savour of his godliness, and
        the fame of his miracles. At his prayers the dumb spake, the deaf heard, the withered were
        strengthened, and they that suffered under diverse and incurable diseases received
        health. He turned water into wine, and openly worked many other miracles. Among all these
        things it must be told that a wretched woman sought him to lure him to impurity, but he
        raked hot embers out upon the floor and cast himself down upon them, and wallowed among
        them, and escaped unhurt. When this thing came to the knowledge of Roger I., King of
        Naples, it roused in him the highest reverence for the man of God. At the last, after
        foretelling his own death to the King and to others, and full of good works and miracles,
        he fell asleep in the Lord, in the year of salvation 1142.
    status: { la: verified, en: verified }
