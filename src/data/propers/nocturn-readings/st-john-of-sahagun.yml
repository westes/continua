# Matins Nocturn 2 reading for St. John of Sahagún, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/06-12.txt, English/Sancti/06-12.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-john-of-sahagun
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánnem Sahaguni in Hispania nobili genere natum, parentes cum diu prole
        caruissent, piis operibus, et orationibus a Deo impetrarunt. Ab ineunte ætate
        egregium futuræ sanctitatis specimen dedit: nam e loco superiori ad ceteros
        pueros crebro verba faciebat, quibus eos ad virtutem, et Dei cultum hortabatur,
        eorumque dissidia componebat. In patria monachis sancti Facundi ordinis sancti
        Benedicti primis litterarum rudimentis imbuendus traditur. Dum iis operam daret,
        curavit pater, ut parochus ecclesiam administraret: quod munus juvenis nullis
        rationibus adduci potuit, ut retineret. Inter familiares episcopi Burgensis
        adscriptus, ob spectatam ipsius probitatem intimus ei fuit, ab eoque presbyter,
        et canonicus factus multis beneficiis auctus est. Sed relicta aula episcopi ut
        Deo quietius serviret, omnibus ecclesiæ proventibus abdicatis se cuidam sacello
        addixit, ubi Sacrum quotidie faciebat, ac de rebus divinis magna cum auditorum
        ædificatione frequenter concionabatur.


        Postea studiorum causa Salmanticam profectus, in celebre collegium divi
        Bartholomæi cooptatus, sacerdotis munus ita exercuit, ut simul optatis studiis
        incumberet, et in sacris étiam concionibus assidue versaretur. Cum vero in
        gravissimum morbum incidisset, arctioris disciplinæ voto se obstrinxit, quod ut
        redderet, cum prius cuidam pauperi pene nudo ex duabus, quas tantum habebat
        vestes, meliorem dedisset, ad cœnobium sancti Augustíni severiori disciplina tum
        maxime florens se contulit: in quo admissus, obedientia, animi demissione,
        vigiliis ac oratione provectiores anteibat. Triclinii cura cum ipsi demandata
        esset, vini doliolum ipso attingente omnibus monachis per annum abunde suffecit.
        Exacto tirocinii anno, præfecti jussu munus concionandi suscepit. Salmanticæ id
        temporis adeo cruentis factionibus divina, humanaque omnia permixta erant, ut
        singulis propemodum horis cædes fierent, et omnium ordinum, ac præsertim
        nobilium sanguine non viæ solum, et fora, sed templa étiam redundarent.


        At Joannes, tum concionibus, tum privatis colloquiis civium animos demulcens, ad
        tranquillitatem urbem reduxit. Virum principem graviter offendit, quod illius in
        subditos sævitiam increpasset. Qua de causa equites duos immisit, qui eum in
        itinere confoderent, jamque ad ipsum propinquaverant: cum, stupore divinitus
        immisso, simul cum equis immobiles steterunt, donec ad pedes sancti viri
        provoluti, sceleris veniam precarentur. Ipse quoque princeps repentino terrore
        perculsus, jam de salute desperaverat, cum revocato Joanne, facti pœnitens
        incolumitati redditus est. Factiosi étiam homines, cum eum fustibus peterent,
        brachiis diriguere, nec ante redditæ vires quam delicti veniam precarentur.
        Christum Dominum, dum Sacrum faceret, præsentem contueri, atque ex ipso
        divinitatis fonte cælestia mysteria haurire solitus. Abdita cordis inspicere, ac
        futura raro eventu præsagire frequens illi fuit, fratrisque filiam septennem
        mortuam excitavit. Denique mortis die prænuntiato, et Ecclesiæ sacramentis
        devotissime susceptis, extremum diem clausit, multis ante et post obitum
        miraculis gloriosus. Quibus rite probatis Alexander octavus Sanctorum numero eum
        adscripsit.
      en: >-
        John Gonzalez was born, the offspring of a noble race, at San Fagondez in Spain,
        (on Midsummer Day in the year of grace 1430.) His father and mother after long
        childlessness, obtained him from God by prayers and good works. From his
        earliest years he gave clear signs of his after holiness of life. He was used to
        climb up upon an high place to preach to the other little boys, and to exhort
        them to be good and to worship God, and he made it his work to reconcile their
        quarrels. While he was still at home he was given in charge to the monks of the
        Order of Saint Benedict, at the village of San Fagondez, to teach him his first
        lessons. While he was thus busied, his father obtained for him the benefice of
        the Parish, but no persuasions could induce him to keep this preferment. He
        became one of the household of the Bishop of Burgos, and that Prelate, seeing
        his uprightness, took him into his counsels, ordained him Priest, and made him a
        Canon, heaping upon him many kindnesses. However, that he might serve God the
        more quietly, he left the Bishop's Palace, resigned all his Church income, and
        betook him to a certain Chapel wherein he celebrated the Holy Liturgy every day,
        and oftentimes preached concerning the things of God, with great profit to all
        that heard him.


        He went later to Salamanca to study, and there being taken into the celebrated
        College of St. Bartholomew, he did his priestly office, so that he was at once
        constant to the studies he desired and busy with sermons. Here he had a severe
        illness, and vowed to take up a sterner way of living. In fulfillment of this
        vow, he gave to an half-naked beggar the better of the two garments which were
        all that he had, and then went to a Convent of the friars of St. Augustine,
        which was then in the richest bloom of rigid discipline. Being admitted therein,
        he surpassed the most advanced in obedience, lowliness, watchings, and prayer.
        At the time that he had charge of the table, one keg of wine abundantly sufficed
        in his hands for all the friars, throughout an whole year. After his year of
        novitiate, he undertook the duty of preacher at the command of his Superior. At
        that time, owing to bloody feuds, all things human and divine at Salamanca were
        in such utter confusion, that murders were committed almost every hour, and the
        streets and squares, and the very churches, flowed with the blood of all
        classes, especially of the nobility.


        It was John, who by public preaching and private conversations, softened the
        hearts of the citizens so that the town was restored to peace. He grievously
        offended one of the nobles by rebuking him for his cruelty toward his vassals.
        This man sent two knights to murder him on the road. They had already come nigh
        him when God sent a terror upon them, so that they and their horses stood still,
        until they cast themselves down before the feet of the Saint, imploring his
        forgiveness for their sin. The Prince himself, also, smitten with a sudden
        dread, despaired of his salvation, till he had sent for John, who, finding him
        repent of his deed, restored him to soundness. Some quarrelsome men, likewise,
        who were fain to give him a cudgelling, found their arms stiffen, nor would
        their strength come back till they had asked his pardon for their wickedness.
        Oftentimes when he was celebrating the Holy Liturgy, the Presence of the Lord
        Christ became sensibly manifest to him, and he drank in things heavenly from
        their Divine Well-head Himself. Oftentimes also he could see the secrets of
        men's hearts, and foretell strange things to come. He raised from the dead his
        own niece, aged seven years. He foretold the day of his own death, and prepared
        himself by receiving most devoutly the Sacraments of the Church, (and then fell
        asleep in the Lord, upon the 11th day of June, in the year 1475.) God glorified
        him by many miracles, both before and after his death. These being duly proved,
        Alexander VIII. numbered him among the Saints. the Christians took them, and
        buried them honourably.
