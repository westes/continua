  - nocturn: 3
    isGospel: false
    source: "Homily by St. Ambrose, Bishop (of Milan), Book II on Luke II"
    text:
      la: |
        Vidéte Ecclésiæ surgéntis exórdium: Christus náscitur, et pastóres vigiláre cœpérunt; qui géntium greges, pécudum modo ante vivéntes, in caulam Dómini congregárent, ne quos spiritálium bestiárum per offúsas nóctium ténebras pateréntur incúrsus. Et bene pastóres vígilant, quos bonus pastor infórmat. Grex ígitur pópulus, nox sǽculum, pastóres sunt sacerdótes. Aut fortásse étiam ille sit pastor, cui dícitur: Esto vígilans, et confírma. Quia non solum epíscopos ad tuéndum gregem Dóminus ordinávit, sed étiam Angelos destinávit.
      en: |
        Behold the beginning of the Church. Christ is born, and the shepherds watch; shepherds, to gather together the scattered sheep of the Gentiles, and to lead them into the fold of Christ, that they might no longer be a prey to the ravages of spiritual wolves in the night of this world's darkness. And that shepherd is wide awake, whom the Good Shepherd stirreth up. The flock then is the people, the night is the world, and the shepherds are the Priests. And perhaps he is a shepherd to whom it is said: Be watchful and strengthen, Apoc. iii. 2, for God hath ordained as the shepherds of His flock not Bishops only, but also Angels.
    responsory:
      la: "R. In princípio erat Verbum, et Verbum erat apud Deum, † et Deus erat Verbum. * Hoc erat in princípio apud Deum.\nV. Omnia per ipsum facta sunt, et sine ipso factum est nihil.\nR. Hoc erat in princípio apud Deum."
      en: "R. In the beginning was the Word, and the Word was with God, and the Word was God. * The same was in the beginning with God.\nV. All things were made by him: and without him nothing was made\nR. The same was in the beginning with God.\nV. Grant, Lord, a blessing."
    status: { la: verified, en: verified }
