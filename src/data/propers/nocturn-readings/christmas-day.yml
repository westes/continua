  - nocturn: 3
    isGospel: false
    source: "Homily by St. Jerome, Priest at Bethlehem"
    text:
      la: |
        In Isaía légimus: Generatiónem ejus quis enarrábit? Non ergo putémus Evangelístam Prophétæ esse contrárium, ut quod ille impossíbile dixit effátu, hic narráre incípiat: quia ibi de generatióne Divinitátis, hic de incarnatióne est dictum. A carnálibus autem cœpit, ut per hóminem, Deum díscere incipiámus. Fílii David, fílii Abraham. Ordo præpósterus, sed necessário commutátus. Si enim primum posuísset Abraham et póstea David, rursus ei repeténdus fúerat Abraham, ut generatiónis séries texerétur.

        Léctio sancti Evangélii secúndum Lucam Luc 2:1-14 In illo témpore: Exiit edíctum a Cǽsare Augústo, ut describerétur univérsus orbis. Et réliqua. Homilía sancti Gregórii Papæ Homilia 8 in Evangelia Quia, largiénte Dómino, Missárum solémnia ter hódie celebratúri sumus, loqui diu de evangélica lectióne non póssumus: sed nos áliquid vel bréviter dícere, Redemptóris nostri Natívitas ipsa compéllit. Quid est enim, quod nascitúro Dómino mundus descríbitur, nisi hoc, quod apérte monstrátur, quia ille apparébat in carne, qui eléctos suos adscríberet in æternitáte? Quo contra de réprobis per prophétam dícitur: Deleántur de libro vivéntium, et cum justis non scribántur. Qui bene étiam in Béthlehem náscitur: Béthlehem quippe domus panis interpretátur. Ipse namque est, qui ait: Ego sum panis vivus, qui de cælo descéndi. Locus ergo, in quo Dóminus náscitur, domus panis ántea vocátus est; quia futúrum profécto erat, ut ille ibi per matériam carnis apparéret, qui electórum mentes intérna satietáte refíceret. Qui non in paréntum domo, sed in via náscitur: ut profécto osténderet, quia per humanitátem suam, quam assúmpserat, quasi in aliéno nascebátur.
      en: |
        In Isaiah we read: “Who shall declare His generation?” Let us not think that there is any contradiction between the Prophet and the Evangelist, because the Prophet saith that this thing cannot be done, and the Evangelist beginneth by doing it. The one speaketh of the generation of the Divine (Word by the Eternal Father,) the other of the (family in which the) Incarnation took place. Matthew beginneth with carnal things, that by learning of men we may go on to learn of God. “The Son of David, the son of Abraham.” The reversal of the order in these clauses is a needful change. If Abraham had been put first and David afterwards, Abraham would have had to be taken again, in order to marshal the pedigree properly.

        From the Holy Gospel according to Luke Luke 2:1-14 At that time, it came to pass that there went out a decree from Caesar Augustus, that the whole world should be enrolled. And so on. Homily by Pope St. Gregory (the Great) 8th on the Gospels By God's mercy we are to say three Masses today, so that there is not much time left for preaching; but at the same time the occasion of the Lord's Birthday itself obliges me to speak a few words. I will first ask why, when the Lord was to be born, the world was enrolled? Was it not to herald the appearing of Him by Whom the elect are enrolled in the book of life? Whereas the Prophet saith of the reprobate: Let them be blotted out of the book of the living, and not be written with the righteous. Ps. lxviii. 29. Then, the Lord is born in Bethlehem. Now the name Bethlehem signifieth the House of Bread, and thus it is the birth-place of Him Who hath said: I am the Living Bread, Which came down from heaven. John vi. 51. We see then that this name of Bethlehem was prophetically given to the place where Christ was born, because it was there that He was to appear in the flesh by Whom the souls of the faithful are fed unto life eternal. He was born, not in His Mother's house, but away from home. And this is a mystery, showing that this our mortality into which He was born was not the home of Him Who is begotten of the Father before the worlds.
    responsory:
      la: "R. Beáta víscera Maríæ Vírginis, quæ portavérunt ætérni Patris Fílium: et beáta úbera, quæ lactavérunt Christum Dóminum: * Qui hódie pro salúte mundi de Vírgine nasci dignátus est.\nV. Dies sanctificátus illúxit nobis: veníte, gentes, et adoráte Dóminum.\nR. Qui hódie pro salúte mundi de Vírgine nasci dignátus est."
      en: "R. Blessed be the womb of the Virgin Mary, which bore the Son of the Eternal Father, and blessed be the paps which give suck to Christ our Lord. * This day hath He been pleased for the salvation of the world to be born of a Virgin.\nV. This day which is breaking is holy; O come, ye Gentiles, and worship the Lord.\nR. This day hath He been pleased for the salvation of the world to be born of a Virgin.\nV. Grant, Lord, a blessing."
