# Matins Nocturn 2 reading for St. John Nepomucene, Martyr (May 16).
# Sourced from web/www/horas/Latin/Sancti/05-16n.txt's own [Lectio93]
# (verified Latin). The reference engine's English/Sancti/05-16n.txt is
# entirely empty -- no translation at all -- so the English below is this
# project's own translation, marked draft.
id: st-john-nepomucene
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánnes, Nepomúci Bohémiæ in óppido natus, unde Nepomucéni cognómen duxit, post
        suscéptas philosóphiæ, theológiæ sacrorúmque canónum lauréas sacerdótio initiátus,
        inter canónicos metropolitánæ ecclésiæ Pragénsis coóptátus fuit, et Evangélii coram
        rege Wenceláo quarto prædicándi provínciam demandátam hábuit. Régiis illum
        eleemósynis in páuperes erogándis præféctum, Joánna regína consciéntiæ sibi
        moderatórem ascívit. Cum autem Wencesláus in vítia præceps abriperétur, piæ autem
        conjúgis obtestatiónes ægre ferret, conténdere ausus est, ut in sacramentáli judício
        sacerdóti crédítæ regínæ arcána sibi a Joánne panderéntur. At Dei miníster
        blandítiis, torméntis et cárceris squalóre tentátus, nefáriæ regis cupiditáti
        fórtiter obstítit, et cum Wencesláus próximam in aquis, si obluctári pérgeret,
        submersiónem inténtaret, Joánnes invícta constántia terróres minásque refutávit.
        Itaque regis império in Moldávam flumen Pragam interflúens noctu dejéctus,
        illústrem martýrii palmam est consecútus. Benedíctus décimus tértius primum hunc
        sacramentális sigílli assertórem, arcáni fidem sánguine obsignántem, sanctórum
        Mártyrum catálogo adscrípsit.
      en: >-
        John was born in the town of Nepomuk in Bohemia, whence he took the surname
        Nepomucene. Having received his degrees in philosophy, theology, and the sacred
        canons, and been ordained to the priesthood, he was made a canon of the metropolitan
        church of Prague, and was entrusted with the office of preaching the Gospel before
        King Wenceslaus IV. Appointed by the king to distribute the royal alms among the
        poor, he was chosen by Queen Joanna as the director of her conscience. But when
        Wenceslaus was being swept headlong into vice, and bore ill his pious wife's
        remonstrances, he dared to demand that the secrets which the queen had entrusted to
        the priest in sacramental confession be disclosed to him by John. But the minister
        of God, though tempted by flattery, by torments, and by the squalor of imprisonment,
        stood firm against the king's wicked desire; and when Wenceslaus threatened him with
        drowning should he persist in his resistance, John with unconquered constancy
        refused to yield to the terrors and threats. And so, by the king's command, he was
        cast by night into the river Moldau, which flows through Prague, and thereby won the
        illustrious palm of martyrdom. Pope Benedict XIII enrolled in the catalogue of the
        holy Martyrs this first defender of the sacramental seal, who sealed his fidelity to
        its secret with his own blood.
    status: { la: verified, en: draft }
