# Matins Nocturn 2 reading for St. Jerome, Priest, Confessor, Doctor
# (Sep 30) — SanctiM/09-30.txt inherits the whole day (`@Sancti/09-30`)
# with no Nocturn 2/3 override, so this saint's own vita is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/09-30.txt, English/Sancti/09-30.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
id: st-jerome
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Hieronymus, Eusebii fílius, Stridone in Dalmatia, Constantio imperatóre, natus, Romæ
        adoléscens est baptizatus, et in liberálibus disciplinis a Donato et aliis viris
        doctíssimis eruditus. Tum discéndi studio Gálliam peragrávit; ubi pios aliquot et in
        divinis litteris eruditos viros coluit, multosque sacros libros sua manu descripsit.
        Mox se in Græciam cónferens, philosophía et eloquéntia instructus, summórum
        theologórum consuetúdine flóruit. In primis vero Gregório Nazianzeno Constantinopoli
        operam dedit; quo doctore se sacras litteras didicisse profitétur. Tum religiónis
        causa visit Christi Dómini incunábula, totamque lustrávit Palæstinam; quam
        peregrinatiónem, adhíbitis Hebræórum eruditíssimis, ad sacræ Scripturæ intelligéntiam
        sibi multum profuísse testátur.


        Deínde secessit in vastam Syriæ solitúdinem; ubi quadriennium in lectióne divinórum
        librórum cælestísque beatitúdinis contemplatióne consumpsit, assidua se abstinéntia,
        vi lacrimárum et corporis afflictatióne discrucians. Présbyter a Paulino episcopo
        Antiochíæ factus, Romam de controversiis quorúmdam episcopórum cum Paulino et
        Epiphanio ad Dámasum Pontificem profectus, ejus ecclesiásticis epistolis scribéndis
        adjútor fuit. Verum, cum prístinæ solitúdinis desidério tenerétur, in Palæstinam
        reversus, Bethlehem ad Christi Dómini præsepe, in monasterio quod a Paula Romana
        exstructum erat, cælestem quamdam vitæ ratiónem instituit; et, quamquam varie morbis
        doloribúsque tentarétur, tamen corporis incommoda piis labóribus et perpetua
        lectióne ac scriptióne superabat.


        Tamquam ad oraculum, ex ómnibus orbis terræ partibus, ad ipsum divinæ Scripturæ
        quæstiónes explicandæ referebántur. Illum Dámasus Pontifex, illum sanctus Augustinus
        de locis Scripturæ difficillimis sæpe consuluit, propter ejus singularem doctrinam, et
        linguæ non solum Latinæ et Græcæ, sed Hebráicæ étiam et Chaldáicæ, intelligéntiam; et
        quod omnes pene scriptores, ejusdem Augustíni testimonio, légerat. Hæreticos
        acerrimis scriptis exagitávit; piórum et catholicórum patrocinium semper suscépit.
        Vetus Testaméntum ex Hebræo convértit; novum, jussu Dámasi, Græcæ fidei réddidit,
        magna étiam ex parte explicávit. Multa præterea Latine réddidit scripta doctórum
        virórum, et ipse aliis proprii ingenii monuméntis christianam disciplínam
        illustrávit. Qui, ad summam senectútem perveniens, sanctitáte et doctrina illustris,
        Honorio imperatóre, migrávit in cælum. Cujus corpus, ad Bethlehem sepúltum, póstea
        Romam in basilicam sanctæ Maríæ ad Præsepe translátum est.
      en: >-
        Jerome was the son of one Eusebius, and was born at Sorigni, in Dalmatia, in the reign
        of the Emperor Constantius. He was baptised at Rome when a lad, and studied there,
        under the instruction of Donatus and other very learned personages. He travelled in
        Gaul for the sake of improving his mind, and there sought the friendship of diverse
        godly men learned in the Scriptures, and made with his own hand many copies of the holy
        books. He afterwards betook himself to Greece, where he attained eminence as a
        philosopher and orator, in the following of the most famous theologians. At
        Constantinople, in especial, he sat at the feet of Gregory of Nazianzus, from whom he
        professeth himself to have learnt his theology. Then, for godliness' sake, he went to
        see the home of the Lord Christ, and so throughout all Palestine. He witnesseth that
        this pilgrimage, wherein he got the help of the most learned of the Jews for the
        understanding of the Holy Scriptures, did him much good.


        He withdrew himself into the wild deserts of Syria, where he passed four years in
        studying the Holy Scriptures and in considering the blessedness of heaven, afflicting
        his body by alway denying himself, by bitter tears, and by chastisement of the flesh. He
        was ordained Priest by Paulinus, Patriarch of Antioch. He went to Rome on account of the
        quarrelling of certain Bishops with Paulinus and Epiphanius, and there helped Pope
        Damasus in the writing of his letters upon Church affairs. But the longing for his old
        solitude came upon him, and he went back to Palestine, where, in the monastery at
        Bethlehem, built beside the cradle of the Lord Christ by the Lady Paula of Rome, he set
        himself to enter on earth upon the life of heaven, serving God in reading and writing
        without ceasing, regardless of the sufferings of a body tormented by diverse diseases
        and pains.


        Hard questions upon the interpretation of the Holy Scripture were sent to him from all
        parts of the earth, as to an oracle. He was oftentimes consulted by Pope Damasus and by
        the holy Augustine upon the meaning of the most obscure passages of the Scripture,
        because of his extraordinary learning, and that he knew not the Latin and Greek tongues
        only, but also the Hebrew and Chaldee, and, as the same Augustine testifieth, had read
        nearly all writers. He attacked heretics with keen publications, and ever undertook the
        defence of the godly and Catholic. He translated the Old Testament from Hebrew into
        Latin, and, at the command of Damasus, reformed, according to the original Greek, the
        existing version of the New. Upon great part of the Scriptures he wrote commentaries.
        He translated likewise into Latin the works of many learned men, and himself
        contributed to the Christian life many monuments of his own wit. He lived to an
        extreme old age, and passed away to heaven, famous for learning and holiness, in the
        reign of the Emperor Honorius. His body was buried at Bethlehem, but hath since been
        brought to Rome, where it lieth in the Church of St. Mary-at-the-Manger.
    status: { la: verified, en: verified }
