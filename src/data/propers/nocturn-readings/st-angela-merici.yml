# Matins Nocturn 2 reading for St. Angela Merici, Virgin (June 1).
# Sourced directly from web/www/horas/Latin/Sancti/06-01.txt,
# English/Sancti/06-01.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in her own file (her `[Rule]` is `vide
# C6a`) -- defers to the Common of a Virgin's own Nocturn 3, not
# transcribed here.
id: st-angela-merici
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Angela Merícia, Decentiáni, Veronénsis diœcésis óppido ad lacum Benácum in
        dicióne Venéta, piis orta paréntibus, a prima ætáte virginitátis lílium, quod
        perpétuo serváre statúerat, sédula sepsit. Ab omni mulíebri ornátu abhórrens,
        egrégiam vultus formam pulchrámque cæsáriem studióse fœdávit, ut cælésti
        dumtáxat animárum Sponso placéret. In ipso autem adolescéntiæ flore paréntibus
        orbáta, austerióris vitæ desidério in desértum locum aufúgere tentávit; sed, ab
        avúnculo prohíbita, novit præstáre domi, quod in solitúdine non lícuit. Cilício
        ac flagéllis frequénter usa, carnem nónnisi infírma valetúdine, vinum in
        Nativitátis et Resurrectiónis Domínicæ tantum celebritáte; complúres vero dies,
        nihil omníno degustávit. Oratióni dédita, brevíssimum humi carpébat somnum.
        Dæmónem vero sub lucéntis ángeli forma sibi illúdere conántem agnóvit prótinus,
        et conjécit in fugam. Tandem patérnis bonis abdicátis, et hábitum ac régulam
        tértii órdinis sancti Francísci ampléxa, evangélicam paupertátem virginitátis
        laudi conjúnxit.


        Nullum pietátis offícium erga próximos omíttens, paupéribus, quidquid sibi ex
        mendicáto victu superésset, largiebátur; libénter ministrábat ægrótis, plúraque
        cum magna sanctitátis fama peragrávit loca, ut vel solátio esset afflíctis, vel
        reis véniam impetráret, vel infénsos ínvicem reconciliáret ánimos, vel e
        vitiórum cœno sceléstos revocáret. Angelórum pane, quem únice esuriébat,
        frequentíssime refécta, tanta caritátis vi ferebátur in Deum, ut sæpius extra
        sensus raperétur. Sacra Palæstínæ loca, summa cum religióne, obívit; quo in
        itínere et visum, quem ad Cydónias appúlsa oras amíserat, eódem regréssa
        recuperávit, et barbarórum captivitátem ac naufrágium ímminens divínitus
        evásit. Romam dénique, firmam Ecclésiæ petram veneratúra et amplíssimæ jubilæi
        véniæ percúpida, sedénte Cleménte séptimo, accéssit; quam summus Póntifex
        allocútus, ejúsdem sanctimóniam suspéxit et commendávit summópere; nec ab Urbe
        ipsam abíre ante permísit, quam álio cælitus vocátam agnóvit.


        Bríxiam ítaque, ubi domum ad sanctæ Afræ templum condúxit, revérsa, novam ibi
        vírginum societátem, sicut cælésti voce ac visióne mandátum sibi fúerat, sub
        certa disciplína sanctísque vivéndi régulis constítuit, quam sanctæ Ursulæ
        invíctæ vírginum ducis patrocínio ac nómine insignívit: eam vero perénnem
        futúram morti próxima prædíxit. Tandem prope septuagenária, dives méritis
        evolávit in cælum sexto Kaléndas Februárii anni millésimi quingentésimi et
        quadragésimi. Cujus cadáver per ipsos trigínta dies inhumátum, flexíbile ac vivo
        simíllimum perseverávit. Demum in sanctæ Afræ templo inter céteras, quibus illud
        abúndat, Sanctórum relíquias repósito, plúrima ad ejus sepúlcrum agi statim
        cœpére mirácula; quorum fama late diffúsa, non Bríxiæ modo et Decentiáni, sed
        álibi étiam vulgo cœpit nuncupári beáta, ejúsque imágo aris impóni: immo sanctus
        ipse Cárolus Borromæus non multis post annis dignam, quæ ab apostólica Sede in
        sanctárum Vírginum album referrétur, Bríxiæ palam asséruit. Cultum vero illi
        jámdiu a pópulis exhíbitum, et et tum locórum Ordináriis probátum, tum plúribus
        étiam summórum Pontíficum indúltis munítum, Clemens Papa décimus tértius
        solémni decréto ratum hábuit ac confirmávit. Eam tandem, novis miráculis rite
        probátis insígnem, Pius Papa séptimus, solémni canonizatióne in Vaticána
        basílica perácta, die vigésima quarta Maji anno millésimo octingentésimo
        séptimo, sanctárum Vírginum catálogo adscrípsit.
      en: >-
        Angela Merici was born of godly parents at Decenzano on the western shore of the
        Lake of Garda, in the diocese of Verona and territory of Venice. From her
        earliest years she carefully guarded the lily of her virginity, with the
        intention of keeping it for ever unbroken. She had no taste for women's finery,
        and purposely marred the exceeding comeliness of her body and her sightly hair,
        as seeking to appear beautiful only in the eyes of Him Who is the Lover of
        souls. At ten years of age she lost both her father and mother, and thereafter,
        being fain to take upon her a life of greater hardness, she essayed to retire
        into a desert place apart, but this her uncle forbade her to do, and she learnt
        how to practice at home what she was not allowed to attempt in the wilderness.
        She often used hair-cloth and scourging; never ate flesh-meat, except when she
        was sick; drank wine only on the Feast-days of Christmas and Easter; and many a
        day took nothing at all. She was instant in prayer. What little sleep she took,
        she took lying on the ground. The devil strove to beguile her, appearing under
        the form of an angel of light, but she quickly detected him and put him to
        flight. At length she added to the glory of virginity that poverty which is
        commended in the Gospel; she gave up all that she had, and adopted the dress and
        rule of the Third Order of St. Francis.


        She left undone no service of kindness which she was able to do to her
        neighbors. If there remained anything over of the food which was given in alms
        to herself, she gave that to the poor. She cheerfully waited upon the sick. She
        journeyed about, with a great reputation for holiness, comforting the afflicted,
        asking forgiveness for the guilty, reconciling the angry, and recalling the
        wicked from evil. Her only hunger was for the bread of Angels, and she took the
        Same right often, and then arose in her vehemence of love bearing her towards
        God, which oftentimes made her beside herself. She made a pilgrimage, with
        intense feeling, to the Holy Places in Palestine, during which journey she lost
        her sight at Canea in Crete on her way out, and recovered it at the same place
        on her way home. In this journey also, God saved her from being made prisoner by
        the unbelievers and from shipwreck. She went to Rome at once to pray at the
        immovable Rock of the Church, and to gain the abundant pardons of the Jubilee.
        Pope Clement VII conversed with her, was edified by her holiness, and highly
        commended her; neither would he let her leave Rome, until he knew that God was
        calling her elsewhere.


        She went back to Brescia, and there hired an house near the Church of St. Afra,
        in which house, in obedience to a vision and command from heaven, she founded a
        new Order of religious women, constituted under certain rules and holy
        regulations of life. This Order she put under the name and patronage of St.
        Ursula, the fearless leader of maidens. When Angela was near to death, she
        foretold that this Order will never cease. She was well-nigh three score and ten
        years of age, and full of good works, when she winged her flight heavenward. Her
        dead body lay unburied thirty days, supple and life-like. It was laid at last in
        the Church of St. Afra, where sleep so many more of God's holy children. Diverse
        miracles forthwith began to be worked at her grave. The fame of these being
        noised about, she began to be commonly called Blessed, and that not only at
        Brescia and Decenzano; and pictures of her were put over Altars. Not many years
        afterward, holy Charles Borromeo said openly at Brescia, that she was one whose
        name the Apostolic See might well enroll among those of holy virgins. The
        reverence which had of a long time been shown to her memory was approved by the
        local Ordinaries, confirmed by diverse Papal Indults, and solemnly ratified and
        established by decree of Pope Clement XIII. As she continued famous for new and
        proved miracles, Pope Pius VII, at the solemn canonization held in the Vatican
        Basilica, added her name to the list of holy maids.
    status: { la: verified, en: verified }
