# Matins Nocturn 2 reading for St. Dionysius, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/02-03-Dionysius.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-dionysius-pope
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Dionýsius ex monacho, post beátum Xystum Secúndum Románæ Ecclésiæ Epíscopus est constitútus.
        Is contra Sabellianos scripsit: et advérsus eos, qui Fílium Dei opus, aut creatúram
        asseverabant, plura volúmina édidit. Dionysii Alexandríni Epíscopi apud se accusáti, quasi
        qui Fílium Dei factum, et non substantialem Patri díceret, in Romána Synodo causam
        discussit, ad quem ejúsdem Synodi id indigne ferentis senténtiam perscripsit. Sed cum
        Alexandrínus Antístes íterum atque íterum, missis Romam suis scriptis, se purgasset, atque
        defendisset, maturo demum consílio est absolutus. Presbyteris Ecclésias in urbe Dionysius
        distríbuit, et cœmeteria, paróchias, atque diœcéses divísit. Dénique multis pro Ecclésia
        perfúnctus labóribus, ac fídei documéntis clarus, Aureliáno Imperatóre migrávit ad Dóminum,
        sepultúsque est in cœmetério Callísti via Appia, sexto Kaléndas Januárii. Hábuit mense
        Decémbri ordinatiónes duas, quibus creávit Presbyteros duódecim, Diáconos sex, Epíscopos per
        divérsa loca septem. Sedit annos úndecim, menses tres, dies quatuórdecim.
      en: >-
        Dionysius, from a monk, was established Bishop of the Roman Church after blessed Sixtus the
        Second. He wrote against the Sabellians, and put forth many volumes against those who
        asserted that the Son of God was a work or a creature. When Dionysius, Bishop of Alexandria,
        was accused before him, as though he said that the Son of God was made and not of one
        substance with the Father, he examined the cause in the Roman Synod, and wrote to him the
        sentence of that Synod, which he took ill; but when the Alexandrian prelate, sending his
        writings to Rome again and again, had cleared and defended himself, he was at length
        acquitted after mature counsel. Dionysius assigned the churches in the city to priests, and
        divided the cemeteries, parishes, and dioceses. At last, having performed many labours for
        the Church and being renowned for proofs of faith, under the Emperor Aurelian he departed to
        the Lord, and was buried in the cemetery of Callistus on the Appian Way, on the sixth day
        before the Kalends of January. He held in the month of December two ordinations, in which he
        created twelve Priests, six Deacons, and seven Bishops for various places. He sat eleven
        years, three months, and fourteen days.
    status: { la: verified, en: draft }
