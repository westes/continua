# Matins Nocturn 2 reading for St. Raymond of Peñafort, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/01-23.txt, English/Sancti/01-23.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-raymond-of-penafort
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Beátus Raymundus Barcinonénsis, ex nobili família de Péñafort, christianæ
        religiónis rudimentis imbutus, adhuc párvulus exímia animi et corporis índole
        magnum aliquid portendere visus est. Nam adoléscens humaniores litteras in
        pátria proféssus, Bonóniam se cóntulit, ubi pietátis officiis ac pontificio
        civilíque juri sedulo incumbens, et doctoris laurea insignítus, ibidem sacros
        cánones magna cum hóminum admiratióne est interpretatus. Ejus virtútum fama
        percrebrescente, Berengarius Barcinonénsis epíscopus, cum Roma suam ad ecclésiam
        rediret, eum conveniéndi causa Bonóniam iter instituit, et tandem summis
        precibus, ut secum in pátriam reverterétur, obtinuit. Mox ejusdem ecclésiæ
        canonicatu et præpositura ornatus, universo clero et pópulo, integritate,
        modestia, doctrina et morum suavitáte præfulsit, ac Deíparæ Vírginis, quam
        singulari pietátis afféctu venerabátur, honórem et cultum semper pro viribus
        auxit.


        Annum circiter quintum supra quadragesimum agens, in ordine fratrum Prædicatórum
        solemni emissa professióne, ut novus miles, in omni virtútum genere, sed
        præcipue in caritate erga egénos, et maxime captivos ab infidelibus detentos, se
        exercuit. Unde cum ejus hortatu sanctus Petrus Nolascus (cujus ipse confessiónes
        audiebat) suas opes piíssimo huic operi conferret, tum eidem, tum beato
        Raymundo, et Jacobo primo Aragoniæ regi apparens beatíssima Virgo, gratíssimum
        sibi et unigenito Fílio suo fore dixit, si in suum honórem instituerétur ordo
        religiosórum, quibus captivos ex infidelium tyrannide liberándi cura incumberet.
        Quare collátis inter se consíliis, ordinem beátæ Maríæ de mercede redemptiónis
        captivórum fundavérunt: cui beátus Raymundus certas vivéndi leges præscripsit ad
        ejusdem ordinis vocatiónem accommodatíssimas, quarum approbatiónem aliquot post
        annos a Gregório nono impetrávit, et dictum sanctum Petrum primum generalem
        ordinis magistrum suis ipse mánibus habitu eodem indutum creávit.


        Ab eodem Gregório Romam accersítus, et capellani ac pœnitentiarii et confessarii
        sui munere decoratus, ejusdem jussu Romanórum Pontificum decreta, in diversis
        conciliis et epistolis sparsa, in unum Decretalium volúmen redégit.
        Archiepiscopátum Tarraconensem ab ipso Pontifice sibi oblátum constantíssime
        recusávit, et totius ordinis Prædicatórum, generale magistérium, quod per
        biennium sanctíssime administraverat, sponte dimísit. Jacobo Aragoniæ regi sacræ
        Inquisitiónis officii suis in regnis instituéndi auctor fuit. Multa patrávit
        miracula, inter quæ illud claríssimum, quod ex insula Baleari Majori Barcinónem
        reversurus, strato super aquas pallio centum sexagínta milliaria sex horis
        confécerit et suum cœnobium januis clausis fúerit ingréssus. Tandem prope
        centenarius, virtútibus et meritis cumulátus, obdormívit in Dómino, anno salútis
        millesimo ducentésimo septuagesimo quinto. Quem Clemens octavus in Sanctórum
        númerum rétulit.
      en: >-
        The blessed Raymond was born at Barcelona, (in the year of our Lord 1175,) and
        was of the noble family of the De Penafuerte. He was early instructed in the
        Christian religion, and even while he was still a little child, he showed such
        excellence of mind and body, as filled his friends with strong hopes of his
        future greatness. As a young man he taught letters in his native place. He
        afterwards went to Bologna, where he applied himself to works of godliness, and
        to the study of the Ecclesiastical and Civil Law. He took the degree of Doctor,
        and lectured with great applause upon the Canon Law. He attained so much
        celebrity that Berengar, Bishop of Barcelona, on his way from Rome to his own
        See, turned aside to visit the Saint at Bologna, and at length persuaded him
        after many entreaties to return with him to Spain. He was appointed to a Canonry
        and the Archdeaconry in the Church of Barcelona, in which offices he set both
        clergy and people a brilliant example of uprightness, modesty, learning, and
        meekness, and more especially strove, as far as in him lay, to increase the
        honour and reverence paid to the Virgin Mother of God, whom he venerated with an
        affection singularly devoted.


        When he was about forty-five years of age he solemnly professed in the Order of
        Friars Preachers, and strove, as a new recruit, to perfect himself in all the
        duties of his calling, particularly in charity to the poor, and above all to
        those unhappy Christians who were slaves to the unbelievers. He was the
        Confessor of St. Peter Nolasco and of James I., King of Aragon, and by his
        advice St Peter Nolasco gave up his whole worldly possessions to ransom as many
        as possible of the wretched captives. At this moment the Most Blessed Virgin
        appeared simultaneously to St. Raymond, St. Peter Nolasco, and King James, and
        revealed to them the pleasure of her Only-begotten Son and herself, that they
        should establish in her honour an order of Religious persons whose work should
        be the redemption of Christian slaves from bondage among unbelievers. The three
        took counsel together, and then founded the Order of the Blessed Mary of Ransom,
        for the Redemption of Captives. The blessed Raymond himself composed a most
        appropriate code of rules for the new institution, for which he after some years
        obtained the express sanction of Pope Gregory IX., and himself (on the ioth day
        of August, in the year 1223,) with his own hands clothed St. Peter Nolasco in
        the habit, and constituted him the first Master General of the Order.


        He was summoned to Rome by Gregory IX., (in the year 1230,) and appointed by him
        his Chaplain, Penitentiary, and Confessor, and by his orders collected into one
        volume of the Decretals the ordinances of the Roman Pontiffs, which up to that
        time were only to be found scattered among the records of diverse Councils and
        Churches. He firmly refused the Archbishopric of Tarascon, which was offered him
        by the Pope himself, and, having been chosen Master General of the whole order
        of Friars Preachers, he discharged the duties of that office in holiness for two
        years, and then resigned it. It was by his advice that James, King of Aragon,
        established the Office of the Holy Inquisition in his dominions. He was
        distinguished by many miracles, of which the chief which is narrated of him is
        that on one occasion being in the island of Majorca and wishing to go to
        Barcelona, he spread his cloak upon the sea, and passed over the waters on it,
        accomplishing the whole distance of sixty leagues in six hours, and finally
        entering his convent through the closed doors. He attained the age of nearly an
        hundred years, and fell asleep in the Lord (on the 6th day of January,) in the
        year of salvation 1275. His name was enrolled by Clement VIII. among those of
        the Saints.
