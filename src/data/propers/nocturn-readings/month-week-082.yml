id: month-week-082
readings:
  - nocturn: 2
    isGospel: false
    source: "St. John Chrysostom, Sermon Against Those Who Keep Concubines"
    text:
      la: >-
        Sálomon cum sæculárium rerum concupiscéntia tenerétur, magnas eas et admirándas putábat,
        multúmque in eis labóris et sollicitúdinis insumébat, magníficas ædificándo domos, copiósum
        coacervándo aurum, congregándo cantórum choros, vária génera ministrórum mensæ et popínæ,
        quæréndo ánimæ suæ voluptátem ab hortórum et córporum formosórum grátia, et omnem, ut ita
        dicam, oblectatiónis et refrigérii viam sectándo.


        At ubi inde ad se revérsus, et quasi ex umbrósa quadam abýsso ad lumen veræ sapiéntiæ
        respícere váluit, tunc sublímem illam et cælis dignam emísit vocem: Vánitas vanitátum, dicens,
        et ómnia vánitas. Hanc et vos, et hac sublimiórem, si voluéritis, efferétis senténtiam de
        intempestíva hac voluptáte, si aliquantísper a mala consuetúdine vos sequestravéritis.


        Quamvis autem a Salomóne sǽculis superióribus non tam multa sapiéntiæ exigebátur diligéntia:
        neque enim delícias lex vetus prohibébat, neque áliis frui supervácuis dicébat vanum: áttamen
        et sic se habéntibus rebus, in ipsis contuéri licébit, quam viles et vanitáti obnóxiæ res sint.
        Nos vero ad majórem vocáti vitam, et ad excelléntius fastígium ascéndimus, et in majóribus
        exercémur palǽstris: et quid áliud, quam quod, sicut supérnæ virtútes intellectuáles et
        incorpóreæ illæ, vitam institúere jubémur?
      en: >-
        While Solomon was given up to the lust of the world, he deemed the same a great and noble
        pursuit, and expended thereon great labour and care. He built magnificent palaces, he heaped up
        gold in plenty, he gathered together choirs of singers, and all sorts of servants to minister
        to the luxury of his table and of his fare. He sought enjoyment for his heart from the charm of
        gardens and of fair bodies. In short, he gave himself up to the study of all kinds of pleasure
        and recreation.


        But when he came to himself again, and was once more able, as it were, out of that dark pit, to
        look upon the light of true wisdom, he uttered that saying, so high, so worthy of heaven:
        "Vanity of vanities; all is vanity." And ye also, if ever ye will shake yourselves clear of your
        debasing habit, will utter this cry, and an higher cry than this, as ye turn from your untimely
        indulgences.


        The ages that had rolled before the time of Solomon had not left to his own so precious an
        inheritance of wisdom as those which have preceded us have left to us; the old law did not
        forbid these indulgences, nor pronounce it folly to enjoy other idle luxuries, and yet, even
        with matters so, we can see how low, how worthless, such things be. As for us, we are called to
        a higher life, we ascend to a nobler stand-point, and brace ourselves in a manlier school, and
        why, but because we are bidden to strive for a life like the life of the spiritual and
        bodiless powers.
    responsory:
      la: "Da mihi, Dómine, sédium tuárum assistrícem sapiéntiam, et noli me reprobáre a púeris tuis: * Quóniam servus tuus sum ego, et fílius ancíllæ tuæ.\nV. Mitte illam de sede magnitúdinis tuæ, ut mecum sit et mecum labóret.\nR. Quóniam servus tuus sum ego, et fílius ancíllæ tuæ."
      en: "Give me wisdom, O Lord, that sitteth by thy throne, and reject me not from among thy children. * For I am thy servant and son of thine handmaid.\nV. O send her out from the throne of thy glory, to be with me and to labour with me.\nR. For I am thy servant and son of thine handmaid."
    status: { la: verified, en: verified }
