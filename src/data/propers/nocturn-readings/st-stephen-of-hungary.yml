# Matins Nocturn 2 reading for St. Stephen, King of Hungary, Confessor
# (Sep 2). Sourced directly from web/www/horas/Latin/Sancti/09-02.txt,
# English/Sancti/09-02.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (a direct
# `@Commune/C5:LectioN in 3 loco` cross-reference) -- not transcribed,
# per the bare-cross-reference convention.
id: st-stephen-of-hungary
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Stephanus in Hungariam Christi fidem et regium nomen invéxit. Regia
        coróna a Romano Pontifice impetrata, ejusque jussu in regem
        inunctus, regnum Sedi apostolicæ obtulit. Varia pietátis domicília
        Romæ, Jerosolymis, Constantinopoli: in Hungaria archiepiscopátum
        Strigoniensem, episcopátus decem admirábili religióne et
        munificéntia fundavit. Par in páuperes amor et liberalitas, quos
        véluti Christum ipsum complectens, neminem a se mærentem ac vacuum
        umquam dismisit; quin ad eórum inópiam sublevandam, amplíssimis
        facultátibus erogatis, domesticam quoque supellectilem exímia
        benignitate frequenter distríbuit. Suis ínsuper mánibus lavare
        páuperum pedes, noctu solus et ignotus nosocomía frequentare,
        decumbéntibus inservire ac cetera caritátis offícia exhibere
        consuevit. Quarum virtútum merito, illíus déxtera, resoluto cetero
        corpore, incorrupta permansit.


        Orándi studio noctes pene totas ducebat insomnes; atque in
        cæléstium rerum contemplatióne defixus, interdum extra sensus
        raptus, sublimis in áëra ferri visus fuit. Perduellium
        conspiratiónes ac validiórum hostium ímpetus, miro prorsus modo,
        non semel oratiónis præsidio evitavit. Susceptum ex Ghisella
        Bavárica, sancti Henrici imperatóris sorore, quam sibi matrimonio
        junxerat, Emerícum fílium tanta morum disciplína talíque pietáte
        enutrívit, quantum ejus póstea sanctitas declaravit. Regni vero
        negotia ita dispósuit, ut, accitis undique prudentíssimis et
        sanctíssimis viris, nihil umquam sine illórum consílio molirétur;
        humillimis interim precibus in cínere et cilício Deum déprecans,
        ut univérsum Hungariæ regnum, antequam e vita migraret, catholicum
        vidére mererétur; vere, propter ingens dilatandæ fidei studium,
        illíus gentis Apóstolus nuncupatus, facta a Romano Pontifice ipsi
        posterisque régibus præferendæ crucis potestate.


        Dei Genitricem, quam ardentíssime venerabátur, amplíssimo in ejus
        honórem constructo templo, Hungariæ patrónam instítuit; ab eádem
        vicíssim Vírgine recéptus in cælum ipso suæ Assumptiónis die, quem
        Húngari e sancti regis instituto Magnæ Dominæ diem appellant.
        Sacrum ejus corpus, suavíssimo fragrans odore, liquore cælésti
        scatens, inter multa et varia miracula, Romani Pontificis jussu,
        nobiliórem in locum translátum est atque honorificentius cónditum.
        Ejus autem festum Innocentius undecimus Pontifex maximus, quarto
        Nonas Septembris, ob insignem victoriam ab exercitu Leopoldi
        primi, Romanórum elécti imperatóris et Hungariæ regis, eádem die
        in Budæ expugnatióne, ope divina, e Turcis reportatam, celebrándum
        instituit.
      en: >-
        This Stephen was the son of Geysa, fourth Duke of the Hungarians.
        He it was who first gave to Hungary the faith of Christ and the
        name of a kingdom. He obtained the Kingly crown from the Bishop of
        Rome, and being by command of the same anointed King, he made an
        offering of his kingdom to the Apostolic See. With wonderful
        devotion and bounty he founded diverse godly houses at Rome,
        Jerusalem, and Constantinople, and in Hungary the Archbishopric of
        Gran and ten other Sees. Toward the poor he had the same love and
        bounty. He greeted them as though they were Christ Himself, and
        never sent any one away sorrowing and empty. He spent vast sums in
        relieving their poverty, and also often parted among them with
        exceeding tenderness even the furniture of his house. Moreover it
        was his use to wash the feet of the poor with his own hands, and to
        go in the night, alone and unknown, to the hospitals, and to wait
        on them that lay there, and show them other deeds of kindness. It
        was the reward of these good works that, when the rest of his body
        decayed, his right hand remained uncorrupt.


        He passed almost whole nights in earnest prayer, and when totally
        rapt in the thought of heavenly things, he sometimes became beside
        himself, and was seen to rise off the ground into the air. In more
        than one instance he strangely escaped through the power of prayer
        from rebellion, treason, and the onslaughts of mighty foes. He
        married Gisela of Bavaria, sister to the holy Emperor Henry, and
        begat on her Emeric, whom he trained up in such manners and
        godliness, as are shown by his also becoming a Saint. To carry on
        the business of his kingdom, he gathered together from all quarters
        the most learned and godly men, and took nothing in hand without
        their advice. Meanwhile he entreated of God by the most lowly
        supplications, offered up in sack-cloth and ashes, that, before he
        departed this life, he might see all Hungary Catholic. On account
        of his excellent zeal for the spread of the Faith he is called the
        Apostle of that nation, and the Bishop of Rome gave to him and to
        his successors the right to have a Cross carried before them.


        He had a burning zeal to honour the Mother of God. He built a very
        great Church in her honour, and made her Patroness of Hungary. In
        return, the same Virgin received him into heaven, upon the day of
        her own Assumption, which the Hungarians, by the example of the
        holy King, call "the Great Lady's Day." His hallowed body yielded
        the sweetest savour, and reeked with an heavenly liquid, and amid
        many and diverse wonders it was removed by command of the Bishop of
        Rome into a more noble place, and more honourably buried. Pope
        Innocent XI. ordered his Feast to be held upon the 2nd day of
        September, on account of the famous victory over the Turks which
        was gained upon this day, when the army of Leopold I., Emperor
        (elect) of the Romans, and King of Hungary, wrested from them, by
        the help of God, the city of Buda.
    status: { la: verified, en: verified }
