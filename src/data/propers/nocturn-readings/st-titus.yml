# Matins Nocturn 2 reading for St. Titus, Bishop and Confessor (Feb 6).
# Sourced directly from web/www/horas/Latin/Sancti/02-06.txt,
# English/Sancti/02-06.txt. Lectio4-6 combined into one reading, one
# continuous vita -- same combining convention st-rose-of-lima.yml/
# st-alphonsus-liguori.yml use. No Lectio7-9 of his own in the source
# (`[Lectio7]`/`[Lectio8]` are plain `@Commune/C1a` cross-references) --
# defers to the Common of a Confessor Bishop's own Nocturn 3, not
# transcribed here. (The source's own Lectio94, a shorter 1-lesson
# variant of the same biography, is an alternate not used here.)
id: st-titus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Titus Cretensium episcopum, vix Pauli Apóstoli verbo christianæ fidei sacramentis
        mysteriísque excultum, ea sanctitátis luce Ecclésiæ tunc vagiénti effulsisse
        compertum est, ut inter ejusdem Doctoris Géntium discipulos merúerit cooptari.
        Ascitus in partem óneris prædicatiónis, ádeo evangelizándi ardore, et fidelitate
        Paulo éxstitit carus, ut ipse, cum venísset Tróadem propter Evangélium Christi,
        testátus sit non habuísse requiem spiritui suo, eo quod Titum fratrem suum ibi non
        invenerit. Et paulo post Macedóniam petens, rursus suam in eum caritátem ita
        éxprimit: Sed qui consolátur húmiles, consolátus est nos Deus in adventu Titi.


        Quam ob rem Corinthum ab Apóstolo missus, ea sapiéntia et lenitate legatiónis hujus
        munere functus est, quæ præsertim de fidelium pietáte eleemosynas colligendas ad
        sublevandam Ecclésiæ Hebræórum inópiam spectabat, ut Corinthios non solum in
        Christi fide continúerit, sed étiam desidérium, fletum, æmulatiónem inter eos pro
        Paulo, qui illos primus instituit, excitaverit. Ad effundéndum interim inter gentes
        linguis locisque distinctas divini verbi semen, plúribus terra marique itinéribus
        reléctis, magnaque animi firmitáte pro crucis trophæo curis laboribúsque exantlátis,
        una cum duce Paulo Cretæ insulam áppulit. Cum porro huic ecclésiæ epíscopus ab ipso
        Apóstolo deléctus esset, dubitándum non est quin in eo munere ita versátus sit, ut,
        juxta ipsíus Pauli præcéptoris mónita, seípsum præbúerit exemplum bonórum operum in
        doctrina, in integritate, in gravitáte.


        Itaque tamquam lucérna inter eos, qui in idololatríæ et mendaciórum ténebris véluti
        in umbra mortis sedébant, religiónis jubar diffudit. Traditur eum inter Dálmatas, ut
        crucis vexíllum explicaret, strenue consudasse. Tandem meritórum et diérum plenus,
        quarto supra nonagesimum anno, pridie Nonas Januarii, pretiósa justórum morte
        obdormívit in Dómino, et sepúltus est in ecclésia ubi ab Apóstolo minister fuerat
        constitútus. Hujus nomen, a sancto Joánne Chrysostomo et a sancto Hieronymo
        præcipue commendátum, Martyrologio Romano eadem die inscriptum legitur: ejus autem
        festum summus Pontifex Pius nonus ab univérsa Ecclésia celebrari præcepit.
      en: >-
        The Apostle Paul had no sooner by his preaching gathered the Cretans to the
        Sacraments and doctrines of the Christian Faith, than he made Titus their Bishop.
        It is agreed that the holiness of Titus shone with so bright a light before the
        infant Church, that he earned fellowship with the disciples of the Teacher of the
        Gentiles. Being taken to share in the work of preaching, he so endeared himself to
        Paul by his faithfulness and zeal in declaring the Gospel, that the Apostle saith:
        When I came to Troas to preach Christ's Gospel, and a door was opened unto me of
        the Lord, I had no rest in my spirit, because I found not Titus my brother; but,
        taking my leave of them, I went from thence into Macedonia. And again he saith:
        When we were come into Macedonia, our flesh had no rest, but we were troubled on
        every side; without were fightings, within were fears. Nevertheless, God, that
        comforteth those that are cast down, comforted us by the coming of Titus.


        It was this affection of Paul toward Titus which led him to send him to Corinth
        upon a mission that mainly concerned the collection of alms from the charity of the
        faithful for the relief of the poor Hebrew Saints. This mission Titus discharged
        with such wisdom and gentleness, that he not only strengthened the Corinthians in
        the faith, but also stirred up in them an earnest desire, a mourning, a fervent
        mind toward Paul, their earliest teacher. Many were the other journeys by land and
        sea which Titus undertook in order to sow the seed of God's word among men of
        diverse nations, tongues, and countries. Filled with bold loyalty to the banner of
        the Cross, he went with Paul to the island of Crete. Of the Church of Crete the
        Apostle himself made him the first Bishop; and we may not doubt that, as such, he
        was what his Teacher bade him be, in all things showing himself a pattern of good
        works, in doctrine, in uncorruptness, in gravity.


        Like a candle, he gave forth the light of faith in the midst of men sitting in the
        darkness of idolatry and falsehood, as in the shadow of death. He is said to have
        labored mightily to unfurl the banner of the Cross among the Dalmatians. He was
        full of days and good works when, upon the day before the Nones of January, in the
        ninety-fourth year of his age, he fell asleep in the Lord in one of those deaths
        which are precious in the sight of the Lord, and was buried in the church of which
        the Apostle had made him the minister. His praises have been chiefly commended by
        St. John Chrysostom and St. Jerome; his name is entered in the Roman Martyrology
        upon that same day, but Pope Pius IX commanded that his feast be kept by the
        universal Church.
    status: { la: verified, en: verified }
