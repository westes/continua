# Matins Nocturn 2 reading for St. Romuald, Abbot (Feb 7) —
# SanctiM/02-07.txt inherits the whole day (`@Sancti/02-07`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/02-07.txt, English/Sancti/02-07.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. Lectio7-9 reference `@Sancti/01-25:Lectio7-9` (the
# Conversion of St. Paul's own Common-of-Apostle-flavoured closing
# lessons) — not proper to Romuald at all, so not authored here. No
# responsory given in the source for Lectio4-6.
id: st-romuald
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Romuáldus, Ravénnæ, Sérgio patre, nóbili génere natus, adoléscens in propínquum
        monastérium Classénse pœniténtiæ causa secéssit: ubi religiósi hóminis sermóne ad
        pietátis stúdium veheméntius incénsus, viso étiam semel et íterum per noctem in ecclésia
        beáto Apollinári, quod Dei servus illi futúrum promíserat, mónachus effícitur. Mox ad
        Marínum, vitæ sanctitáte ac severióre disciplína in fínibus Venetórum eo témpore
        célebrem, se cóntulit, ut ad arctam et sublímem perfectiónis viam eo magístro ac duce
        uterétur.


        Multis sátanæ insídiis et hóminum invídia oppugnátus, tanto humílior se assídue
        jejúniis et oratiónibus exercébat, et rerum cæléstium meditatióne, vim lacrimárum
        profúndens, fruebátur: vultu tamen ádeo læto semper erat, ut intuéntes exhilaráret. Magno
        apud príncipes et reges in honóre fuit; multíque ejus consílio, mundi illécebris abjéctis,
        solitúdinem petiérunt. Martýrii quoque cupiditáte flagrávit, cujus causa dum in
        Pannóniam proficíscitur, morbo, quo afflictabátur cum progrederétur, levabátur cum
        recéderet, revérti cógitur.


        In vita et post mortem miráculis clarus, spíritu étiam prophetíæ non cáruit. Scalam a
        terra cælum pertingéntem, in similitúdinem Jacob Patriárchæ, per quam hómines in veste
        cándida ascendébant et descendébant, per visum conspéxit; eóque Camaldulénses mónachos,
        quorum institúti auctor fuit, designári mirabíliter agnóvit. Dénique cum annos centum et
        vigínti ágeret, et centum ipsos in summa vitæ asperitáte Deo servísset, ad eum migrávit,
        anno salútis millésimo vigésimo séptimo. Ejus corpus quinquénnio postquam sepúltum
        fúerat, íntegrum repértum, Fabriáni in ecclésia sui órdinis honorífice cónditum est.
      en: >-
        The holy Abbot Romuald was the son of one Sergius, of a noble family of Ravenna. While he
        was still very young, he went to a neighbouring monastery at Classis to do penance. While
        he was there he heard a discourse by a monk, which stirred him up strongly to aim at
        godliness of living; and he had afterwards in the Church by night two visions in which the
        blessed servant of God Apollinaris foretold to him that he should become a monk himself.
        He accordingly did so; and soon afterwards betook himself to one Marinus, whose holy life
        and strict discipline were then much noised about in all the coasts of the Venetians, that
        he might by his teaching and guidance attain towards the hard and lofty point of
        perfection.


        The more he was assailed by the wiles of Satan and the unkindness of men, the more did he
        exercise himself in lowliness, with continual fasting and prayer, and rejoice in thinking
        of heavenly things, with abundance of tears. And all the while he bore so bright a face as
        gladdened all who looked on him. He was held in great honour by princes and kings, and his
        counsel moved many to leave the blandishments of the world and withdraw to the desert. He
        had such a burning desire to obtain the crown of martyrdom that he set out for Pannonia on
        purpose to seek it, but, falling into sickness whenever he went forward though growing
        strong again whenever he drew back, he behoved to return home.


        God worked miracles by him both during his life and after his death, and likewise gave him
        the gift of prophecy. Like the Patriarch Jacob, he saw a ladder reaching from earth to
        heaven, and men in white garments ascending and descending upon it, in whom he marvellously
        knew were represented the monks of the Camaldolese Institute, of which he was the founder.
        At the age of 120 years, of which he had spent 100 in serving God in great hardness, he
        passed into His Presence, in the year of Salvation 1027. Five years after his death his
        body was found incorrupt, and laid in a magnificent grave in the Church of his order at
        Fabriano.
    status: { la: verified, en: verified }
