# Matins Nocturn 2 reading for St. Bartholomew, Apostle (Aug 24) —
# SanctiM/08-24.txt inherits the whole day (`@Sancti/08-24`) with no
# Nocturn 2/3 override, so this saint's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/08-24.txt, English/Sancti/08-24.txt.
# Lectio4-5 combined with `Lectio6_` (itself a same-file indirection
# referenced by `Lectio6`) — all one continuous vita, no genuine
# source break. No responsory given in the source.
#
# Verified 2026-09-05 (Gospel-pairing sweep): the secular Sancti/08-24.txt
# file (9-lesson day) DOES carry a genuine Nocturn 3 Gospel+homily —
# Lectio7 gives the pericope incipit (Luke 6:12-19, Jesus' night of prayer
# before choosing the Twelve) followed by St. Ambrose's homily on it,
# continuing across Lectio8-9 (combined below into one reading, a single
# continuous excerpt from his Commentary on Luke, Book 5). SanctiM/08-24.txt
# never reaches this far (its 12-lesson scheme resolves Lectio4-9 all back
# to Sancti's earlier vita material, resliced), so this pairing is pulled
# from the secular track exactly as the rest of this saint's proper
# content already is.
id: st-bartholomew
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bartholomǽus Apóstolus, Galilǽus, cum in Indiam citeriórem, quæ ei in orbis terrárum
        sortitióne ad prædicándum Jesu Christi Evangélium obvénerat, progréssus esset,
        advéntum Dómini Jesu juxta sancti Matthǽi Evangélium illis géntibus prædicávit. Sed,
        cum in ea província plúrimos ad Jesum Christum convertísset, multos labóres
        calamitatésque perpéssus, venit in majórem Arméniam.


        Ibi Polýmium regem et cónjugem ejus ac prætérea duódecim civitátes ad christiánam
        fidem perdúxit. Quæ res in eum magnam invídiam concitávit illíus gentis sacerdótum.
        Nam usque ádeo Astýagem, Polýmii regis fratrem, in Apóstolum incendérunt, ut is vivo
        Bartholomǽo pellem crudéliter détrahi jússerit ac caput abscíndi; quo in martýrio
        ánimam Deo réddidit.


        Ejus corpus Albáni, quæ est urbs majóris Arméniæ, ubi is passus fúerat, sepúltus est.
        Quod póstea ad Líparam ínsulam delátum, inde Benevéntum translátum est. Postrémo
        Romam ab Ottóne tértio imperatóre portátum, in Tíberis ínsula, in ecclésia ejus nómine
        Deo dicáta, collocátum fuit.
      en: >-
        The Apostle Bartholomew was a Galilean. In the division of the world among the Apostles
        it fell to his lot to preach the Gospel of Jesus Christ in hither India. He went thither
        and preached to those nations the coming of the Lord Jesus, according to the Gospel of
        St. Matthew. When he had turned many in that province to Jesus Christ, and had endured
        many toils and woes, he came into the Greater Armenia.


        There he brought to the Christian faith Polymius the King, and his wife, and likewise
        the inhabitants of twelve cities. This stirred up a great hatred against him among the
        priests of that nation. They so inflamed against the Apostle Astyages the brother of
        King Polymius, that he savagely ordered Bartholomew to be flayed alive and beheaded;
        under the which martyrdom he gave up his soul to God.


        His body was buried at the town of Albanopolis in the Greater Armenia, where he had
        suffered. It was afterwards taken to the Island of Lipari, and thence carried to
        Benevento. Lastly, the Emperor Otto III brought it to Rome, where it was laid in the
        Church dedicated to God in his name on the Island in the Tiber.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Luc 6:12-19", en: "Luke 6:12-19" }
    text:
      la: >-
        In illo témpore: Exiit Jesus in montem oráre et erat pernóctans in oratióne Dei. Et,
        cum dies factus esset, vocávit discípulos suos. Et réliqua.
      en: >-
        At that time Jesus went out into a mountain to pray, and continued all night in
        prayer to God. And when it was day, He called unto Him His disciples. And so on.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, Commentary on Luke, Book 5"
    text:
      la: >-
        Omnes magni, omnes sublímes montem ascéndunt. Non enim cuicúmque prophéta dicit:
        Ascénde in montem excélsum, qui evangelízas Sion: exálta in virtúte vocem tuam, qui
        evangelízas Jerúsalem. Non vestígiis corporálibus, sed factis sublimióribus in hunc
        montem ascénde, et séquere Christum, ut ipse esse mons possis: Montes enim in
        circúitu ejus. Quare in Evangélio invénies solos cum Dómino montem ascendísse
        discípulos. Orat ergo Dóminus, non ut pro se óbsecret, sed ut pro me ímpetret. Nam,
        etsi ómnia posúerit Pater in potestáte Fílii; Fílius tamen, ut hóminis formam
        impléret, obsecrándum Patrem putat esse pro nobis, quia advocátus est noster.


        Et erat, inquit, pernóctans in oratióne Dei. Spécies tibi, Christiáne, datur, forma
        præscríbitur, quam débeas æmulári. Quid enim te pro salúte tua fácere opórtet, quando
        pro te Christus in oratióne pernóctat? Quid te fácere cónvenit, cum vis áliquod
        pietátis offícium adoríri, quando Christus, missúrus Apóstolos, orávit prius, et
        solus orávit? Nec usquam álibi, si non fallor, orásse cum Apóstolis reperítur;
        ubíque solus óbsecrat. Dei enim consílium humána vota non cápiunt, nec quisquam
        interiórum potest esse párticeps Christi.


        Vocávit, inquit, discípulos suos, et elégit duódecim ex ipsis; quos ad propagándum
        auxílium salútis humánæ per terrárum orbem satóres fídei destináret. Simul advérte
        cæléste consílium: non sapiéntes áliquos, non dívites, non nóbiles, sed piscatóres et
        publicános, quos dirígeret, elégit; ne traduxísse prudéntia, ne redemísse divítiis,
        ne poténtiæ nobilitatísque auctoritáte traxísse áliquos ad suam grátiam viderétur; ut
        veritátis rátio, non disputatiónis grátia prævaléret.
      en: >-
        All they who go up into the mountain are the great and the aspiring. It is not to
        every man that the Prophet saith: O thou that tellest good tidings to Zion, get thee
        up into the high mountain, Thou that tellest good tidings to Jerusalem, lift up thy
        voice with strength. Not with bodily feet, but by high deeds get thee up into this
        mountain, and follow Christ, that thou mayest be a mountain thyself. Therefore it is
        that thou findest in the Gospel that none but His disciples went up into the mountain
        with the Lord. The Lord therefore prayeth, not to entreat anything for Himself, but
        to obtain somewhat for me. For, albeit the Father had given the Son power over all
        flesh, that He might give eternal life to as many as He had given Him, the Son
        Himself, being found in fashion as a man, thinketh well to pray the Father on our
        behalf, inasmuch as He is our Advocate with the Father.


        And continued all night in prayer to God. Herein, O Christian, a pattern is set
        before thee, an example is given thee, after the which thou oughtest to aspire. What
        doth it not behove thee to do for thy salvation, when Christ spent an whole night in
        prayer for the same? What doth it become thee to do, when thou willest some good
        work, when Christ prayed before He sent forth His Apostles? He prayed first, and He
        prayed alone. Neither, unless I am mistaken, do we anywhere find that He ever joined
        in prayer with His disciples. He ever prayed alone. Human desires cannot grasp the
        counsel of God, nor can any man, however spiritually minded, share the thoughts of
        God.


        The Evangelist continueth thus: And when it was day, He called unto Him His disciples
        and of them He chose twelve whom He sent forth to help the salvation of men by sowing
        the seed of the faith throughout the whole world. Consider here the counsel of
        heaven. He chose out for His mission men, not wise, nor rich, nor noble, but fishermen
        and publicans, lest He should seem to have converted any to His grace by skill, or
        bought them with money, or drawn them by the power and authority of greatness, and
        the simple force of the truth, not the charms of argument, might have the victory.
    status: { la: verified, en: verified }
