# Matins Nocturn 2 reading for St. Agatho, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/02-14-Agatho.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-agatho
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Agatho, natióne Sículus, ex doctissimo ac sanctíssimo monacho Románus Póntifex creátus est,
        anno Christi sexcentésimo septuagésimo octávo. Vir summa humanitate, eximio ánimi candóre,
        singulári morum suavitáte et comitate præditus, cunctórum amans, cunctis amabilissimus. Ita
        demum a natúra et grátia comparátus, ut ad suprémam illam dignitátem gerendam natus seu
        factus esse viderétur.


        Accéptis a Constantíno Pogonato lítteris ad Donum prædecessorem scriptis, pro convocando
        concílio œcumenico, ad diuturnum schisma tollendum, quo laborabat Ecclésia, et definiendas
        fídei controversias, quæ toto fere Oriénte maximas tempestátes atque ruínas excitarant,
        provinciales synodos in Occidénte habéri curávit, in quibus Monothelitarum causa
        discuteretur, et damnarentur erróres.


        His præmissis, Legátos suos, et concílii Románi, misit Constantinópolim cum binis lítteris
        ad imperatórem, in quibus prædícta hærési docte ac solide refutata, damnatisque primariis
        illíus sectatoribus, Sérgio scílicet, Cyro, Paulo, Pyrrho, Petro et áliis, antecessores suos
        ab omni erróris labe immunes hucusque fuísse expressis verbis declarávit. Agathonis ígitur
        auctoritáte sexta synodus universális congregáta est, in qua iidem erróres iidemque errantes
        damnáti fuérunt. Demum cum tres annos et quinque círciter menses sedisset, pie óbiit in
        Dómino, et in basílica príncipis Apostolórum sepultúræ mandatus est.
      en: >-
        Agatho, a Sicilian by race, from a most learned and most holy monk was made Roman Pontiff,
        in the year of Christ 678. A man endowed with the highest humanity, exceptional candour of
        mind, and singular sweetness and courtesy of manners, loving all and most lovable to all. By
        nature and grace he was so fitted that he seemed born or made to bear that supreme dignity.


        Having received letters from Constantine Pogonatus, written to his predecessor Donus, for
        the convening of an ecumenical council, to remove the long schism with which the Church was
        afflicted, and to define the controversies of faith which had stirred up the greatest storms
        and ruin through almost all the East, he caused provincial synods to be held in the West, in
        which the cause of the Monothelites should be discussed and their errors condemned.


        These things having been prepared, he sent his Legates, and those of the Roman council, to
        Constantinople with two letters to the emperor, in which the aforesaid heresy was learnedly
        and solidly refuted, and its chief followers, Sergius, Cyrus, Paul, Pyrrhus, Peter and
        others, condemned, and he declared in express words that his predecessors had been free
        hitherto from all stain of error. By the authority of Agatho, therefore, the sixth universal
        synod was gathered, in which the same errors and the same erring men were condemned. At
        last, when he had sat about three years and five months, he piously died in the Lord, and
        was committed to burial in the basilica of the Prince of the Apostles.
    status: { la: verified, en: draft }
