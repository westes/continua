# Matins Nocturn 2 reading for St. Luke, Evangelist (Oct 18) —
# SanctiM/10-18.txt inherits the whole day (`@Sancti/10-18`) with no
# Nocturn 2/3 override, so this saint's own content is sourced from
# the Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/10-18.txt, English/Sancti/10-18.txt.
# Lectio4-6 combined into one reading, one continuous excerpt of St.
# Jerome. No responsory given in the source.
#
# Verified 2026-09-05 (Gospel-pairing sweep): horas/Latin/Sancti/10-18.txt
# ends at Lectio6 (Jerome's biographical/literary catalogue entry on
# Luke as Gospel-author) -- there is no proper Lectio7-9 at all, so
# Nocturn 3 falls through entirely to Common of an Evangelist (C1a)'s
# own generic content, already handled by this store's
# per-Common-category pool. No proper Gospel of Luke's own to pair here
# (this file's own content IS the Nocturn 3-adjacent biographical
# reading with nothing to pair it to).
id: st-luke
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Jerome, Priest, De Scriptoribus Ecclesiasticis, ch. 7"
    text:
      la: >-
        Lucas médicus Antiochénsis ut ejus scripta índicant, Græci sermónis non ignárus, fuit
        sectátor Apóstoli Pauli, et omnis peregrinatiónis ejus comes. Scripsit Evangélium, de
        quo idem Paulus: Mísimus, inquit, cum illo fratrem, cujus laus est in Evangélio per
        omnes ecclésias. Et ad Colossénses: Salútat vos Lucas, médicus caríssimus. Et ad
        Timótheum: Lucas est mecum solus. Aliud quoque édidit volúmen egrégium, quod título,
        Acta Apostolórum, prænotátur: cujus história usque ad biénnium Romæ commorántis Pauli
        pervénit, id est, usque ad quartum Nerónis annum. Ex quo intellégimus in eádem urbe
        librum esse compósitum.


        Igitur períodos Pauli et Theclæ, et totam baptizáti Leónis fábulam, inter apócryphas
        scriptúras computámus. Quale enim est, ut indivíduus comes Apóstoli, inter céteras
        ejus res, hoc solum ignoráverit? Sed et Tertulliánus, vicínus eórum témporum, refert
        presbýterum quemdam in Asia, amatórem Apóstoli Pauli, convíctum a Joánne quod auctor
        esset libri, et conféssum se hoc Pauli amóre fecísse, et ob id loco excidísse. Quidam
        suspicántur, quotiescúmque in epístolis suis Paulus dicit, Juxta Evangélium meum, de
        Lucæ significáre volúmine.


        Lucam autem, non solum ab Apóstolo Paulo didicísse Evangélium, qui cum Dómino in
        carne non fúerat, sed et a céteris Apóstolis; quod ipse quoque in princípio sui
        volúminis declárat, dicens: Sicut tradidérunt nobis, qui a princípio ipsi vidérunt et
        minístri fuérunt sermónis. Igitur Evangélium, sicut audíerat, scripsit; Acta vero
        Apostolórum, sicut víderat ipse, compósuit. Vixit octogínta et quátuor annos, uxórem
        non habens. Sepultus est Constantinópoli, ad quam urbem, vigésimo Constantíni anno,
        ossa ejus cum relíquiis Andréæ Apóstoli transláta sunt de Achája.
      en: >-
        Luke was a physician of Antioch, who, as appeareth from his writings, knew the Greek
        language. He was a follower of the Apostle Paul, and his fellow traveller in all his
        wanderings. He wrote a Gospel, whereof the same Paul saith: We have sent with him the
        brother, whose praise is in the Gospel throughout all the Churches. Of him, he writeth
        unto the Colossians: Luke, the beloved physician, greeteth you. And again, unto
        Timothy: Only Luke is with me. He also published another excellent book entitled The
        Acts of the Apostles, wherein the history is brought down to Paul's two years sojourn
        at Rome, that is to say, until the fourth year of Nero, from which we gather that it
        was at Rome that the said book was composed.


        The silence of Luke is one of the reasons why we reckon among Apocryphal books The
        Acts of Paul and Thecla, and the whole story about the baptism of Leo. For why should
        the fellow traveller of the Apostle, who knew other things, be ignorant only of this?
        At the same time there is against these documents the statement of Tertullian, almost a
        contemporary writer, that the Apostle John convicted a certain Priest in Asia, who was
        a great admirer of the Apostle Paul, of having written them, and that the said Priest
        owned that he had been induced to compose them through his admiration for Paul, and
        that he was deposed in consequence. There are some persons who suspect that when Paul
        in his Epistles useth the phrase: According to my Gospel, he meaneth the Gospel written
        by Luke.


        However, Luke learned his Gospel not from the Apostle Paul only, who had not companied
        with the Lord in the flesh, but also from other Apostles, as himself declareth at the
        beginning of his work, where he saith: They delivered them unto us, which from the
        beginning were eyewitnesses and ministers of the word. According to what he had heard,
        therefore, did he write his Gospel. As to the Acts of the Apostles, he composed them
        from his own personal knowledge. He was never married. He lived eighty-four years. He
        is buried at Constantinople, whither his bones were brought from Achaia in the
        twentieth year of Constantine, together with the relics of the Apostle Andrew.
    status: { la: verified, en: verified }
