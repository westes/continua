# Nocturn 3, 20th Sunday after Pentecost. Sourced from Tempora/Pent20-0.txt.
# See post-pentecost-02.yml/post-pentecost-12.yml for sweep method note (no
# proper Nocturn 2 in the source). Lectio7 bare incipit (John 4:46-53, the
# healing of the nobleman's son) skipped; Lectio7-9's homily by Pope St.
# Gregory the Great is one continuous work, combined.
id: post-pentecost-20
readings:
  - nocturn: 3
    isGospel: false
    source: "Pope St. Gregory the Great, Homily 28 on the Gospels"
    text:
      la: >-
        Léctio sancti Evangélii, quam modo, fratres, audístis, expositióne non índiget: sed ne hanc
        táciti præteriísse videámur, exhortándo pótius quam exponéndo in ea áliquid loquámur. Hoc autem
        nobis solúmmodo de expositióne vídeo esse requiréndum, cur is, qui ad salútem fílio peténdam
        vénerat, audívit: Nisi signa et prodígia vidéritis, non créditis. Qui enim salútem fílio quærébat,
        proculdúbio credébat; neque enim ab eo quǽreret salútem, quem non créderet Salvatórem. Quare
        ergo dícitur: Nisi signa et prodígia vidéritis, non créditis: qui ante crédidit, quam signa
        vidéret?


        Sed mementóte quid pétiit; et apérte cognoscétis, quia in fide dubitávit. Popóscit namque, ut
        descénderet et sanáret fílium ejus. Corporálem ergo præséntiam Dómini quærébat, qui per spíritum
        nusquam déerat. Minus ítaque in illum crédidit, quem non putávit posse salútem dare, nisi
        præsens esset et córpore. Si enim perfécte credidísset, proculdúbio sciret, quia non esset locus
        ubi non esset Deus.


        Ex magna ergo parte diffísus est, qui virtútem non dedit majestáti, sed præséntiæ corporáli.
        Salútem ítaque fílio pétiit, et tamen in fide dubitávit; quia eum ad quem vénerat, et poténtem ad
        curándum crédidit, et tamen moriénti fílio esse abséntem putávit. Sed Dóminus, qui rogátur ut
        vadat, quia non desit ubi invitátur, índicat: solo jussu salútem réddidit, qui voluntáte ómnia
        creávit.
      en: >-
        My brethren, the passage from the Holy Gospel, which ye have just now heard, standeth in need of
        no explanation. But lest I should seem to pass the same by in idle silence, I will say somewhat
        thereon, but that rather by way of exhortation than of explanation. Indeed, there seemeth to me
        to be but one point which calleth for explanation, and that point is this Wherefore was it that
        when the nobleman went unto the Lord, and besought Him that He would come down and heal his son,
        Jesus said unto him: "Except ye see signs and wonders, ye will not believe." The very fact that
        he had come to beseech Christ to heal his son, putteth it beyond all doubt that this nobleman
        believed if he had not believed Him to be a Saviour, he would not have asked Him to save his son.
        Wherefore then said Jesus unto him: "Except ye see signs and wonders, ye will not believe," since
        he was one who had not seen, and yet had believed?


        But bethink you what was his prayer, and then shall ye understand clearly wherein his faith was
        shaky. He "besought Him that He would come down and heal his son." He asked for the bodily
        presence of Him Who is spiritually always present everywhere. He believed not therefore enough
        in Christ, for he thought that He could not heal unless He were bodily present. Had his faith
        been perfect, he would doubtless have known that God is everywhere.


        This was therefore a grievously imperfect faith, in attributing the virtue not to Christ's
        Majesty, but to His bodily presence. Thus it was that his faith was still unsound, even while he
        was asking for his son's health. For, though he believed concerning Him unto Whom he came that He
        was mighty to save, yet he thought also that at that moment He was absent from his dying child.
        But the Lord, being asked to go, showed that, wherever He is called on, He is there, and being He
        Who, by a simple act of will, brought all things into being, gave health by a simple command.
    responsory:
      la: "Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.\nV. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.\nR. Plena est omnis terra glória ejus."
      en: "One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.\nV. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.\nR. The whole earth is full of His glory."
    status: { la: verified, en: verified }
