# Matins Nocturn 2-3 readings for the Octave Day of All Saints (Nov
# 8). Sourced directly from web/www/horas/Latin/Sancti/11-08.txt,
# English/Sancti/11-08.txt. Nocturn 2: Lectio4-6, St. Cyprian's "De
# mortalitate" (in fine), combined into one reading. Nocturn 3: the
# Gospel citation (Matt 5:1-12) ends "Et réliqua"/"And so on" with no
# full pericope given -- per the bare-incipit convention, only the
# homily (Lectio7-8, St. Augustine) is authored, isGospel: false, no
# citation field.
id: octave-of-all-saints
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Cyprian, De mortalitate (in fine)"
    text:
      la: >-
        Considerandum est, fratres dilectissimi, et identidem
        cogitandum, renuntiasse nos mundo, et tamquam hospites et
        peregrinos hic interim degere. Amplectamur diem, qui assignat
        singulos domicilio suo, qui nos istinc ereptos, et laqueis
        sæcularibus exsolutos, paradiso restituit, et regno cælesti.
        Quis non peregre constitutus properaret in patriam regredi?
        Quis non ad suos navigare festinans, ventum prosperum cupidius
        optaret, ut velociter caros liceret amplecti?


        Patriam nostram paradisum computamus, parentes Patriarchas
        habere jam cæpimus: quid non properamus et currimus, ut
        patriam nostram videre, ut parentes salutare possimus? Magnus
        illic nos carorum numerus exspectat, parentum, fratrum,
        filiorum frequens nos et copiosa turba desiderat, jam de sua
        immortalitate secura, et adhuc de nostra salute sollicita. Ad
        horum conspectum et complexum venire, quanta et illis et
        nobis in commune lætitia est! Qualis illic cælestium regnorum
        voluptas sine timore moriendi, et cum æternitate vivendi! Quam
        summa et perpetua felicitas!


        Illic Apostolorum gloriosus chorus, illic Prophetarum
        exsultantium numerus, illic Mártyrum innumerabilis populus,
        ob certaminis et passionis victoria coronatus. Triumphantes
        illic Virgines, quæ concupiscentiam carnis et corporis
        continentiæ robore subegerunt. Remunerati misericordes, qui
        alimentis et largitionibus pauperum justitiæ opera fecerunt,
        qui Dominica præcepta servantes ad cælestes thesauros terrena
        patrimonia transtulerunt. Ad hos, fratres dilectissimi avida
        cupiditate properemus, et cum his cito esse, ut cito ad
        Christum venire contingat, optemus.
      en: >-
        Dearly beloved brethren, we should keep well in our mind and
        thoughts that we are living here meanwhile as strangers and
        pilgrims. Let us hail that day which will see us each at home
        in one of the many mansions, which will see us delivered
        hence, and disentangled from the nets and snares of things
        temporal, and put us back into the Garden of Eden, and into
        the kingdom of heaven. Is there any in a far country but is
        quick to make his way to his Fatherland? Was ever any in haste
        to make his voyage homeward, but longed for a fair wind, that
        he might the sooner embrace his loved ones?


        We reckon Paradise to be our home; already we begin to have
        the Patriarchs for our kinsmen. Why should we not make haste
        and run, to see our home, and to greet our kinsfolk? There are
        a great many of those we love waiting for us there father,
        and mother, and brothers, and children, there in great company
        they await us, they who are sure now never to die any more,
        but not yet sure of us. O, when we come to see them and to
        embrace them, what gladness will it be both for us and for
        them! O, what will be the brightness of life in that heavenly
        kingdom where there is no more fear of death, but the
        certainty of living everlastingly! O, what consummated, O,
        what enduring happiness?


        There is the glorious company of the Apostles, there is the
        jubilant fellowship of the Prophets, there is the countless
        army of Martyrs crowned for victory in strife and in
        suffering. There triumph the virgins who by noble
        self-control have tamed the desires of the flesh and of the
        body. There are repaid with mercy the merciful, who by
        feeding and gifting the needy, have wrought righteousness,
        have kept the commandments of the Lord, and have exchanged
        heritages upon earth for treasures in heaven. Thitherward,
        dearly beloved brethren, let us eagerly run, with such as
        these soon to be, unto Christ soon to come, let us be fain.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine, Bk. i. on the Lord's Sermon (Matt 5:1-12)"
    text:
      la: >-
        Beati eritis, inquit, cum vobis maledicent, et persequentur
        vos, et dicent omne malum adversum vos mentientes, propter me:
        gaudete et exsultate, quoniam merces vestra multa est in
        cælis. Animadvertat quisquis delicias hujus sæculi, et
        facultates rerum temporalium quærit in nomine christiano,
        intrinsecus esse beatitudinem nostram, sicut de anima
        ecclesiastica ore prophetico dicitur: Omnis gloria ejus filiæ
        regis ab intus. Nam extrinsecus maledicta, et persecutiones,
        et detractiones promittuntur de quibus tamen magna merces est
        in cælis, quæ sentitur in corde patientium, eorum qui jam
        possunt dicere: Gloriamur in tribulationibus: scientes quod
        tribulatio patientiam operatur, patientia autem probationem,
        probatio vero spem, spes autem non confundit: quia caritas Dei
        diffúsa est in cordibus nostris per Spiritum sanctum, qui
        datus est nobis.


        Non enim ista perpeti fructuosum est, sed ista pro Christi
        nomine non solum æquo animo, sed étiam cum exsultatione
        tolerare. Nam multi hæretici nomine christiano animas
        decipientes, multa talia patiuntur: sed ideo excluduntur ab
        ista mercede, quia non dictum est tantum: Beati qui
        persecutionem patiuntur, sed additum est: Propter justitiam.
        Ubi autem sana fides non est, non potest esse justitia: quia
        justus ex fide vivit. Neque schismatici aliquid sibi ex ista
        mercede promittant: quia similiter, ubi caritas non est, non
        potest esse justitia. Dilectio enim proximi malum non operatur:
        quam si haberent, non dilaniarent corpus Christi, quod est
        Ecclesia.
      en: >-
        Blessed are ye, saith the Lord, when men shall revile you, and
        persecute you, and shall say all manner of evil against you
        falsely, for My sake. Rejoice, and be exceeding glad for great
        is your reward in heaven. If any be seeking under the name of
        a Christian the pleasures of this world and the possession of
        temporal goods, let him bethink him that our blessedness is
        inward, even as the mouth of the Prophet saith concerning the
        soul of the Church The King's daughter is all glorious within.
        (Ps. xliv. 15.) Without, she is reviled, and persecution and
        evil report are her promised portion. And yet for these very
        things, great is her reward in heaven, as indeed is felt in
        the hearts of the sufferers, at least of such as are able
        already to say But we glory in tribulations also; knowing that
        tribulation worketh patience; and patience, experience; and
        experience, hope; and hope maketh not ashamed; because the
        love of God is shed abroad in our hearts by the Holy Ghost,
        Which is given unto us. ~(Rom. v. 3-5.)


        To suffer such things is not in itself fruitful; what is
        fruitful, is to bear them for Christ's Name's sake not calmly
        only but gladly. There are a great many heretics who mislead
        souls under the name of Christians, and they suffer such
        things plentifully, but they are cut out from the reward, for
        it is not said only Blessed are they which are persecuted, but
        Blessed are they which are persecuted for righteousness' sake.
        Where there is not sound faith there cannot be righteousness,
        for the just shall live by faith. (Heb. x. 38.) Neither let
        schismatics promise themselves any of that reward, for as
        righteousness cannot exist where there is no faith, so neither
        can it exist where there is no love. And schismatics have no
        love, for love worketh no ill to his neighbour, (Rom. xiii.
        10,) and if they had it, they would not tear the Body of
        Christ, which is the Church.
    status: { la: verified, en: verified }
