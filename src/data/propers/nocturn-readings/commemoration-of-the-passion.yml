# Matins Nocturn 2 and 3 readings for the Commemoration of the Passion (Tuesday after Sexagesima).
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt,
# whose own Lectio4-9 these are. Nocturn 2: Lectio4-6, St. Augustine's sermon for
# Palm Sunday on the Passion (Sermo 41 de Passione), combined into one reading.
# Nocturn 3: the Gospel (John 19:28-35, the Gospel of the votive office of the
# Passion, Commune/Votiva/V6) and then St. John Chrysostom's homily on it
# (Homily 84 on John, Lectio7 after the incipit, Lectio8 and Lectio9). The source
# has no responsories of its own and none is carried. Nocturn 1 (Lectio1-3 of the
# votive office, Romans 5) is not carried: continua's first nocturn runs the
# Scripture course.
#
# Latin: "linitas" in Lectio6 ("Ecclésiæ linitas præmonstratur") is almost
# certainly "unitas" and is corrected so; two missing full stops (Lectio4
# "reparator absolvit Indubitanter", Lectio6 "corrúperant Velum") are supplied.
# Everything else is verbatim. The English is this project's own translation,
# marked draft.
id: commemoration-of-the-passion
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Augustine, Sermon 41 on the Passion of the Lord (Palm Sunday)"
    text:
      la: |
          Admonet nos, fratres caríssimi, ad solemnitátem Domínicæ Passiónis dies ipse, in quo eam nec muta elementa tacuerunt. Celebret eam lux fídei linguis hóminum, quam conclamaverunt étiam silentia tenebrárum. Hódie Dóminus noster in statera crucis prétium nostræ salútis appendit, et una morte univérsum mundum, sicut ómnium conditor, ita ómnium reparator absolvit. Indubitanter enim credámus quod totum mundum redémit, qui plus dedit, quam totus mundus valeret. Méritum enim redemptæ mercedis dígnitas insígnis pretii supergressa est. Inter redemptum et redimentem dispensátio fuit, compensátio non fuit. Qui ergo non habébat peccáta própria, digne delevit aliéna. Solus hic pia victima pro ómnibus cécidit, ut omnes levaret; et quia débitum solus non hábuit, recte fœnus misericórdiæ pro debitóribus erogávit.

          Perpende inter hæc, qui talem pro nobis dedit pecúniam, qualem a nobis sit exactúrus usúram. In hac ítaque die fides propheticæ annuntiatiónis impléta est, ita dicentis: Corpus meum dedi percutientibus, et genas meas vellentibus; fáciem meam non averti a fœditáte sputorum. Suscépit mala nostra, ut tribúeret bona sua. Hinc intelligámus quantum hóminem diligere dignátus sit ante culpam, quem sic díligit post ruinam. Agnosce homo, quantum valeas et quantum debeas: et dum tantam redemptiónis tuæ perspicis dignitátem, ipse tibi indicito peccandi pudorem. Ecce pro ímpio pietas flagellatur, pro stulto sapiéntia illúditur, pro mendace véritas necatur, damnátur justítia pro iníquo, misericórdia afficitur pro crudeli, pro mísero repletur sinceritas acéto, inebriatur felle dulcedo, addicitur innocéntia pro reo, móritur vita pro mórtuo.

          Expávit scelus hóminum natúra rerum; et quem creatúra rebellis non agnóscit, eum mundi Dóminum tremens terra testátur, et cœli Regem sol fúgiens confitétur. Chlamyde coccinea indúitur, quia sánguine Mártyrum suórum Ecclésiæ corpus ornatur. Coróna spinea cápiti ejus imponitur, quia punctio peccatórum nostrórum, quorum remissióne Redemptóris glória struitur, aridis tribulis comparátur. Studeámus nunc e diverso, ut membrórum vita cápitis sit coróna. Quod vero sitire se in cruce positus dicit, fidem incredulæ gentis concupíscit; sed e contra acétum malítiæ porrigunt, quia vinum sapiéntiæ, quod a Deo acceperant, peccándo corrúperant. Velum templi scinditur, quia Synagóga honóre nudatur, observatio antíqua dissolvitur, Ecclésiæ unitas præmonstratur. Monuménta aperiúntur, quia mortis jura jure superantur.
      en: |
          The very day, dearest brethren, admonishes us to the solemnity of the Lord's Passion, on which not even the mute elements were silent. Let the light of faith celebrate with the tongues of men what the very silences of darkness also proclaimed. Today our Lord in the balance of the cross weighed out the price of our salvation, and by one death, as the Creator of all things, so the Restorer of all, set the whole world free. Let us believe without doubt that he redeemed the whole world, who gave more than the whole world was worth. For the dignity of the surpassing price exceeded the merit of the ransom paid. Between the redeemed and the Redeemer there was a dispensation, there was no compensation. He, therefore, who had no sins of his own, worthily blotted out those of others. This one alone fell as a holy victim for all, that he might raise all; and because he alone owed no debt, he rightly paid out the loan of mercy for debtors.

          Consider here what manner of interest he is to exact from us, who has given such a price for us. On this day, then, the faith of the prophetic announcement was fulfilled, which says: I have given my body to the strikers, and my cheeks to them that plucked them; I have not turned away my face from the foulness of spittings. He took our evils, that he might bestow his goods. From this let us understand how much he deigned to love man before the fault, whom he so loves after the fall. Know, O man, what thou art worth and what thou owest; and while thou beholdest the dignity of thy redemption, set upon thyself the shame of sinning. Behold, for the impious, piety is scourged; for the foolish, wisdom is mocked; for the liar, truth is put to death; justice is condemned for the unjust; mercy is afflicted for the cruel; for the wretched, sincerity is filled with vinegar; sweetness is made drunk with gall; innocence is handed over for the guilty; life dies for the dead.

          Nature was struck with terror at the wickedness of men; and him whom rebellious creation knows not, the trembling earth bears witness to as Lord of the world, and the fleeing sun confesses as King of heaven. He is clothed in a scarlet cloak, because the body of the Church is adorned with the blood of his Martyrs. The crown of thorns is placed on his head, because the pricking of our sins, by the remission of which the Redeemer's glory is built up, is compared to dry thorns. Let us strive now on the contrary that the life of the members may be the crown of the head. And as to his saying, when placed on the cross, that he thirsts, he longs for the faith of the unbelieving nations; but on the other hand they offer the vinegar of malice, because by sinning they had corrupted the wine of wisdom which they had received from God. The veil of the temple is rent, because the Synagogue is stripped of honour, the old observance is dissolved, the unity of the Church is foreshown. The tombs are opened, because the rights of death are rightly overcome.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: true
    citation:
      la: "Joann 19:28-35"
      en: "John 19:28-35"
    text:
      la: "In illo témpore: Sciens Jesus, quia ómnia consummáta sunt, ut consummarétur Scriptúra, dixit: Sítio. Vas ergo erat pósitum acéto plenum. Illi autem spóngiam plenam acéto, hyssópo circumponéntes, obtulérunt ori ejus. Cum ergo accepísset Jesus acétum, dixit: Consummátum est. Et inclináto cápite trádidit spíritum. Judǽi ergo (quóniam Parascéve erat), ut non remanérent in cruce córpora sábbato (erat enim magnus dies ille sábbati), rogavérunt Pilátum, ut frangeréntur eórum crura et tolleréntur. Venérunt ergo mílites: et primi quidem fregérunt crura et altérius, qui crucifíxus est cum eo. Ad Jesum autem cum veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus crura, sed unus mílitum láncea latus ejus apéruit, et contínuo exívit sanguis et aqua. Et qui vidit, testimónium perhíbuit: et verum est testimónium ejus."
      en: "At that time: Jesus, knowing that all things were now accomplished, that the scripture might be fulfilled, said: I thirst. Now there was a vessel set there full of vinegar. And they, putting a sponge full of vinegar about hyssop, put it to his mouth. Jesus therefore, when he had taken the vinegar, said: It is consummated. And bowing his head, he gave up the ghost. Then the Jews (because it was the Parasceve), that the bodies might not remain upon the cross on the sabbath day (for that was a great sabbath day), besought Pilate that their legs might be broken, and that they might be taken away. The soldiers therefore came; and they broke the legs of the first, and of the other that was crucified with him. But after they were come to Jesus, when they saw that he was already dead, they did not break his legs; but one of the soldiers with a spear opened his side, and immediately there came out blood and water. And he that saw it hath given testimony: and his testimony is true."
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: false
    source: "St. John Chrysostom, Homily 84 on John, ch. 19"
    text:
      la: |
          Sciens Jesus ómnia consummáta, ait: Sítio; étiam hoc verbo prophetíam implens. Tu autem astántium pravitatem intéllige: nam licet innúmeros habeámus inimícos, qui nos gravissime persecúti sint, cum tamen interimi eos videmus, flectimur misericórdia. Hi vero nil moti, magis efferantur, et irrident, acetúmque in spongia porrigunt, ut bibat tamquam reus. Nam propter hoc hyssopum additur, quo gustato, mórtuus est. Vides quam non perturbate, et quam potenter ómnia transigentem? Quod et prosequens osténdit; cum enim ómnia consummáta essent, inclináto cápite, quod affixum non erat, trádidit spíritum, hoc est, exspirávit.

          Atqui non post inclinatum caput exspiratur, sed post exspirationem caput inclinatur. Hic autem contra áccidit: per quod osténdit eum Evangelísta esse ómnium Dóminum. Judǽi autem camélum devorantes, et cúlicem excolántes, tantum nefas ausi de die consúltant: Quóniam Parascéve erat, ut non remanérent in cruce córpora Sábbato, rogavérunt Pilátum, ut frangeréntur eórum crura. Vides quanti sit véritas? Per ea quæ illi fáciunt, prophetía implétur: ália enim ex hoc manifestata est. Venérunt ergo mílites, et aliórum fregérunt crura; non Christi; sed ad Judæórum grátiam conciliandam latus ejus láncea aperuérunt, et mórtuo adhuc insultant. O pessimam voluntátem ac scelestissimam!

          Noli tamen perturbári, dilectissime; quæ enim malo illi ánimo patrarunt, veritáti consentiebant. Prophetía hinc impléta est, inquiens: Vidébunt in quem transfixérunt. Neque hoc tantum, sed non creditúris fuit fídei argumentum, ut Thomæ, et qui cum eo erant. Ad hæc et arcánum mystérium consummátum est; exívit enim sanguis et aqua. Non casu et simplíciter hi fontes scaturierunt, sed quóniam ex ambóbus Ecclésia constitúta est. Sciunt hoc initiáti: per aquam enim regenerati, sánguine et carne nutriti sunt. Hinc mystéria ortum habent, ut quóties ad admirándum cálicem accédis, tamquam ab ipso látere haúriens accedas.
      en: |
          Jesus, knowing that all things were consummated, said: I thirst; fulfilling prophecy also by this word. But do thou understand the wickedness of the bystanders: for though we have countless enemies who have persecuted us most grievously, yet when we see them destroyed we are moved to mercy. These, however, are not moved at all, but grow only the more savage, and mock, and offer vinegar on a sponge, that he may drink as a guilty man. For hyssop was added for this reason, by tasting which he died. Seest thou how undisturbedly and how powerfully he accomplishes all things? Which also what follows shows; for when all things were consummated, bowing his head, which was not fastened, he gave up the ghost, that is, he expired.

          Yet ordinarily the head is not bowed before one expires, but after expiring the head is bowed. Here, however, the contrary happens: whereby the Evangelist shows him to be Lord of all. But the Jews, swallowing a camel and straining out a gnat, dare so great a wickedness and take counsel upon the very day: Because it was the Parasceve, that the bodies might not remain upon the cross on the sabbath, they besought Pilate that their legs might be broken. Seest thou how great is the power of truth? By what they do, prophecy is fulfilled: for another prophecy was made manifest by it. The soldiers therefore came, and broke the legs of the others; not of Christ; but to win the favour of the Jews they opened his side with a lance, and insult him even yet dead. O most wicked and most criminal will!

          Yet be not troubled, most beloved; for what they did with that evil mind agreed with the truth. Prophecy was fulfilled thereby, saying: They shall look on him whom they pierced. Nor this only, but it was an argument of faith for those who would not believe, as for Thomas and those who were with him. Besides these, a hidden mystery was also accomplished; for there came out blood and water. Not by chance and simply did these fountains gush forth, but because the Church was constituted from both. The initiated know this: for by water they are regenerated, by blood and flesh they are nourished. Hence the mysteries have their origin, so that as often as thou approachest the awful chalice, thou mayest approach as though drinking from the very side.
    status: { la: verified, en: draft }
