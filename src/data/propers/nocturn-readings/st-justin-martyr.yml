# Matins Nocturn 2 and 3 reading for St. Justin, Martyr. Sourced directly from
# web/www/horas/Latin/Sancti/04-14.txt, English/Sancti/04-14.txt.
# Lectio4-6 combined into one reading, one continuous vita. Nocturn 3: the Gospel pericope then the saint's own homily.
id: st-justin-martyr
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Justínus, Prisci fílius, ex Græco genere Flaviæ Neápolis in Syria Palæstina
        natus, adolescéntiam in litterárum ómnium stúdiis transegit. Vir factus adeo
        philosophíæ amóre correptus est, ut ad veritátem assequéndam, quotquot aderant,
        philosophórum sectis nomen déderit, eorúmque præcépta scrutátus sit. Cum in his
        fallacem tantum sapiéntiam errorémque reperísset, superna illustratióne per
        senem quemdam ignotum aspectuque venerábilem edoctus, veræ christianæ fídei
        philosophíam amplexus est. Hinc sacræ Scripturæ libros diu noctuque præ mánibus
        habens, ita ex eórum meditatióne divinus ignis in ánima ejus exársit, ut ea qua
        pollébat eruditiónis vi, eminentem Jesu Christi sciéntiam adeptus, plurima
        conscripserit volúmina ad christiánam fidem exponéndam magisque propagandam.


        Inter præclaríssima Justini ópera binæ eminent fídei christianæ apologíæ, quas
        cum coram senatu, imperatóribus Antonino Pio ejúsque fíliis nec non Marco
        Antonino Vero et Lucio Aurelio Cómmodo Christi ásseclas sævíssime divexántibus,
        porrexísset, eamdemque fidem disputándo strenue propugnasset, obtinuit, ut a
        Christianórum cæde publico príncipum edícto temperátum fúerit. Verum Justino
        haud parcitum est. Nam Crescéntis cynici, cujus vitam et mores nefarios
        redargúerat, insídiis accusatus, a satellítibus comprehénsus est. Adductus autem
        ad Romæ præsidem nómine Rústicum, cum hic ab eo quæsivísset, quænam essent
        Christianórum præcépta, hanc bonam confessiónem coram multis testibus conféssus
        est: Rectum dogma, quod nos christiáni hómines cum pietáte servamus, hoc est: ut
        Deum unum existimémus Factórem atque Creatórem ómnium quæ vidéntur, quæque
        corpóreis óculis non cernúntur; et Dóminum Jesum Christum Dei Fílium
        confiteámur, olim a prophétis prænuntiátum, qui et humani generis Judex ventúrus
        est.


        Quóniam Justinus in prima sua apología exposúerat quómodo Christiáni convenírent
        ad Sacra celebranda, et quænam fúerint sacri hujus convéntus mysteria, ad
        repelléndas ethnicórum calumnias; exquisívit ab eo præses, in quonam loco
        conveníret ipse et ceteri hujus Urbis Christifidéles. Justinus autem réticens
        convéntuum loca, ne sancta et fratres próderet cánibus, domicílium tantum suum
        indicávit, ubi manére et discípulos excólere solébat penes célebrem títulum
        Pastoris in ædibus Pudéntis. Demum præses optiónem ei dedit vel ut diis
        sacrificaret, vel per totum corpus flagellis cædi perferret. Cum invictus fídei
        vindex assereret se in votis semper habuísse cruciátus pérpeti propter Dóminum
        Jesum Christum, a quo magnam in cælis mercédem cónsequi expectabat, præses in
        eum capitálem senténtiam pronuntiávit. Itaque mirábilis philósophus Deum
        collaudans, post vérbera, fuso pro Christo sánguine, glorióso martyrio coronátus
        est. Quidam vero fidéles clam illíus sustulérunt corpus, et in loco idoneo
        condidérunt. Leo décimus tertius Póntifex maximus ejúsdem Offícium et Missam ab
        univérsa Ecclésia celebrári præcepit.
      en: >-
        Justin, the son of Priscus, was a Greek by race, but was born at Nablus in
        Palestine. He passed his youth in the study of letters. When he became a man he
        was so taken with the love of philosophy and the desire of truth that he became
        a student in the schools of all the philosophers and examined the teaching of
        them all. In them he found only deceitful wisdom and error. The light of heaven
        was given him, through an old man of worshipful aspect whom he knew not, and he
        embraced the philosophy of the true Christian faith. Henceforth he had the books
        of the Holy Scriptures in his hands by day and by night, and by meditating
        thereon the fire of God was so kindled in his soul that, himself possessing the
        excellency of the knowledge of Christ Jesus our Lord, he wrote many books, with
        all the learning which he possessed, to set forth the Christian faith and to
        spread it abroad.


        Amongthe most famous of the works of Justin are his two Apologies or Defences of
        the Christian faith. These he brought before the Senate when the Emperors
        Antoninus Pius, and his sons, as also Marcus Antoninus Verus and Lucius Aurelius
        Commodus, were savagely persecuting the followers of Christ, and by their means,
        and his vigorous disputations in favour of the same faith, he obtained a public
        edict from the government to stay the slaughter of the Christians. But Justin
        himself did not escape he had rebuked the life and infamous manners of the Cynic
        Crescens, and was accused and arrested through that person's plottings. He was
        brought before Rusticus, the President of Rome, who asked him what were the
        doctrines of the Christians, whereto he answered, in the presence of many
        witnesses, with this good confession: The right doctrine which we Christian men
        do keep with godliness is this, that we should believe that there is one God,
        Who is the Maker and Creator of all things, both those things which are seen and
        those things which bodily eyes do not see, and that we should confess the Lord
        Jesus Christ, the Son of God, Who was foretold of old time by the prophets, and
        Who will come to be the Judge of all mankind.


        In order to rebut the slanders of the heathen, Justin had in his first Apology
        given an open account of the gathering of the Christians for divine worship, and
        what were the holy Mysteries celebrated in these assemblies. The President
        therefore asked him what was the place where he and Christ's other faithful ones
        in the city were accustomed to meet. Justin, lest he should betray that which
        was holy unto God and his brethren, told only where was his own lodging, where
        he was used to abide and to teach his disciples, hard by the famous Church of
        the Shepherd, in the house of Pudens. The President then gave him the choice
        whether to sacrifice to the gods or to be hided with scourges over his whole
        body. The unconquered champion of the faith answered that he had always desired
        to suffer in the Name of the Lord Jesus Christ, from Whom he looked to receive a
        mighty reward in heaven. The President thereupon sentenced him to death, and
        then this excellent philosopher, giving praise to God, was first beaten and
        afterwards shed his blood for Christ's sake, and so received the crown of a
        glorious martyrdom. Some of the faithful secretly stole away his body, and
        buried it in a fitting place. The Supreme Pontiff Leo XIII. commanded that his
        Office and Mass should be used throughout the whole Church.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Luc 12:2-8", en: "Luke 12:2-8" }
    text:
      la: >-
        Nihil autem opertum est, quod non reveletur: neque absconditum, quod non
        sciatur. Quoniam quae in tenebris dixistis, in lumine dicentur: et quod in aurem
        locuti estis in cubiculis, praedicabitur in tectis. Dico autem vobis amicis
        meis: Ne terreamini ab his qui occidunt corpus, et post haec non habent amplius
        quid faciant. Ostendam autem vobis quem timeatis: timete eum qui, postquam
        occiderit, habet potestatem mittere in gehennam: ita dico vobis, hunc timete.
        Nonne quinque passeres veneunt dipondio, et unus ex illis non est in oblivione
        coram Deo? sed et capilli capitis vestri omnes numerati sunt. Nolite ergo
        timere: multis passeribus pluris estis vos. Dico autem vobis: Omnis quicumque
        confessus fuerit me coram hominibus, et Filius hominis confitebitur illum coram
        angelis Dei:
      en: >-
        For there is nothing covered, that shall not be revealed: nor hidden, that shall
        not be known. For whatsoever things you have spoken in darkness, shall be
        published in the light: and that which you have spoken in the ear in the
        chambers, shall be preached on the housetops. And I say to you, my friends: Be
        not afraid of them who kill the body, and after that have no more that they can
        do. But I will shew you whom you shall fear: fear ye him, who after he hath
        killed, hath power to cast into hell. Yea, I say to you, fear him. Are not five
        sparrows sold for two farthings, and not one of them is forgotten before God?
        Yea, the very hairs of your head are all numbered. Fear not therefore: you are
        of more value than many sparrows. And I say to you, Whosoever shall confess me
        before men, him shall the Son of man also confess before the angels of God.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. John Chrysostom, Patriarch of Constantinople, On Matthew x. 26"
    text:
      la: >-
        Nihil est opertum quod non revelábitur, nec occultum quod non sciétur. Quod
        autem dicit, hujúsmodi est: Sufficit quidem vobis ad consolatiónem, si ego
        Magister et Dóminus consors sim conviciórum. Si vero adhuc doletis hæc
        audiéntes, illud quoque animo reputate, vos non multum póstea ab hac suspicióne
        liberátum iri. Cur enim id ægre fertis? quia præstigiatores et deceptores vos
        vocant? At paululum exspectáte, et servatores benefactoresque orbis vos
        prædicábunt omnes. At enim tempus illa ómnia, quæ subobscura erant, revelabit,
        et illórum calumniam déteget, virtutémque vestram conspicuam reddet. Cum enim ex
        rebus ipsis comprobabímini salvatores esse et benefici, et omni virtúte
        conspicui, illórum dictis hómines non attendent, sed rei veritáti; ac illi
        quidam sycophantæ, mendáces, malédici, vos vero ipso sole splendidióres
        deprehendémini. Multum quippe témporis spatium vos notos reddet, prædicabit, et
        tuba clariórem emíttet vocem, vestræque virtútis testes univérsos hómines
        exhibétur. Ne ítaque ea, quæ nunc dicúntur, vos dejíciant, sed spes futurórum
        bonórum érigat. Non possunt enim ea, quæ ad vos spectant, occultári.


        Deínde, postquam illos omni angore, timóre et sollicitúdine liberávit, et
        probris ómnibus superióres réddidit, demum illos opportune de libertáte
        prædicándi allóquitur; nam dicit: Quod dico vobis in ténebris, dícite in lúmine;
        et quod in aure audítis, prædicate super tecta. Quamquam non erant ténebræ cum
        hæc diceret, neque ad aurem loquebátur: sed hæc hyperbólice dicta sunt. Quia
        enim solos alloquebátur, et in parvo Palæstinæ angulo, ídeo dicit, In ténebris
        et In aure; hunc loquéndi modum cómparans cum loquéndi fiducia, qua illos póstea
        instructurus erat. Ne in una, duabus tribusque civitátibus, sed per totum orbem
        prædicate, terram máreque peragrántes, habitátam, non habitátam; ac tyrannis,
        pópulus, philosophis, rhetóribus cum magna fiducia ómnia dícite. Ideo dixit
        super tecta et in lúmine; sine ullo subterfugio, et cum omni libertáte.
      en: >-
        The disciple is not above his master, nor the servant above his lord. It is
        enough for the disciple that he be as his master, and the servant as his lord.
        If they have called the master of the house Beelzebub, how much more shall they
        call them of his household? Fear them not, therefore: for] there is nothing
        covered, that shall not be revealed; and hid, that shall not be known. It is as
        though He would say: It is comfort enough for you, if I, your Master and Lord,
        am a partaker in your reproach. But if it grieve you unto this present to hear
        these things, bethink you likewise that it is but a little while, and ye shall
        be free from that reproach. For what is it that grieveth you? is it that they
        call you tricksters and deceivers? Wait but a little while and all men shall
        call you the preservers and benefactors of the world. In a little while all the
        things which are dark now shall be made clear, and the falsehood of them that
        reproach you and your own goodness shall be shown in the light. For when that
        which cometh to pass shall itself show that ye are preservers and benefactors,
        and filled with all goodness, men will regard not the words of your gainsayers
        but the truth. They that now speak evil of you will be found out in the
        slanderers, liars, and calumniators, and ye shall be seen to be brighter than
        the sun; time shall make you known and shall preach you with a voice louder than
        the voice of a trumpet, and shall bring forward all men as the witnesses of your
        goodness. Let not, therefore, those things which are now spoken cast you down,
        but rather let the hope of the good things which are to come lift you up. For
        the things which regard you cannot be hidden.


        And when He had freed them from pain, fear, and care, and set them above the
        reproaches of men, He spake unto them in due season concerning the freedom of
        preaching, What I tell you in darkness, that speak ye in light and what ye hear
        in the ear, that preach ye upon the house-tops. It was not darkness when He
        uttered these words, neither was He speaking into their ear. These words were a
        figure He was speaking to them alone and in a little corner of Palestine, and
        therefore He saith in darkness and in the ear, as comparing this manner of
        speech with that boldness of speaking wherewith He was afterwards to inspire
        them. Preach, He saith, not in one nor two nor three cities, but throughout the
        whole world go over the earth and the sea, the land that is dwelt in and the
        land that is not dwelt in speak all things with great boldness to kings and to
        peoples, to philosophers and to rhetoricians therefore without any subtlety, but
        with all freedom, He saith, What I tell you in darkness, that speak ye in light
        and what ye hear in the ear, that preach ye upon the house-tops.
    status: { la: verified, en: verified }
