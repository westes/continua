# Matins Nocturn 2 reading for St. Bridget, Widow (Oct 8). Sourced
# directly from web/www/horas/Latin/Sancti/10-08.txt,
# English/Sancti/10-08.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in her own file (her `[Rule]` is `vide
# C7a`) -- defers to the Common's own Nocturn 3, not transcribed here.
id: st-bridget-of-sweden
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Birgitta, in Suecia illustribus et piis paréntibus orta,
        sanctíssime vixit. Cum adhuc in útero gestarétur, a naufragio
        propter eam mater erepta est. Decennis, post audítum de
        passióne Dómini sermónem, sequénti nocte Jesum in cruce, recénti
        sánguine perfusum, vidit, et de eadem passióne secum loquentem.
        Quo ex témpore in ejusdem meditatióne ita afficiebátur, ut de
        ea sine lácrimis cogitare deinceps numquam posset.


        Ulfoni, Nericiæ principi, in matrimónium tradita, virum ipsum
        ad pietátis officia, tum optimis exemplis, tum efficacibus
        verbis, adhortáta est. In filiórum educatióne piíssima;
        paupéribus, et maxime infirmis, domo ad id muneris dicata,
        inserviébat quam diligentíssime, illórum pedes sólita lavare et
        osculari. Cum autem una cum viro suo rediret Compostella, ubi
        sancti Jacobi Apóstoli sepúlcrum visitaverant, et Atrébati Ulfo
        gráviter ægrotaret, sanctus Dionysius Birgittæ noctu appáruit,
        et de mariti salúte aliisque de rebus, quæ futuræ erant,
        præmonuit.


        Viro Cisterciénsi monacho facto et paulo post defuncto,
        Birgitta, audíta Christi voce in somnis, arctiórem vitæ formam
        est aggressa. Cui deínde arcana multa fuérunt divínitus
        revelata. Monastérium Vastanense sub regula sancti Salvatoris,
        ab ipso Dómino accepta, instituit. Romam Dei jussu venit, ubi
        plurimos ad amórem divinum veheménter accendit. Inde
        Jerosolymam pétiit, et íterum Romam. Qua ex peregrinatióne cum
        in febrim incidísset, gravibus per annum integrum afflictáta
        morbis, cumuláta meritis, prænuntiáto mortis die, migrávit in
        cælum. Corpus ejus ad Vastanense monastérium translátum est; et
        miraculis illustrem Bonifatius nonus in Sanctórum númerum
        retulit.
      en: >-
        Bridget was the daughter of princely and godly parents, and was
        born in Sweden. Her life was a very holy one. When she was still
        in the womb, her mother was for her sake saved from shipwreck.
        When she was ten years old, she heard a sermon upon the
        sufferings of the Lord, and the following night she saw Jesus on
        the Cross, covered with fresh Blood, and heard Him speaking to
        her of His same sufferings. From that time forth the thought of
        them touched her so keenly, that she could never again call
        them to mind without weeping.


        When she was sixteen years of age she was given in marriage to
        Ulpho, Prince of Nericia. She moved her husband to godly works,
        as well by her noble example as by her earnest words. She
        expended the most motherly care upon the up-bringing of her
        children. She opened an hospital, in which she carefully tended
        the poor, especially the sick, and would wash and kiss their
        feet. She made a pilgrimage with her husband to Compostella, to
        visit the grave of the holy Apostle James. On their way back
        Ulpho fell grievously sick at Arras, and St. Denys appeared in
        the night to Bridget, to tell her as well that her husband
        would be healed, as diverse other things to come.


        Her husband died, after having become a Cistercian monk.
        Bridget, having heard the voice of Christ in a dream, took upon
        herself an harder way of life. During her life God made known
        to her many hidden things. She founded the monastery of
        Wastein, under the Rule of the Holy Saviour, a Rule which she
        had received from the Lord Himself. By the command of God she
        went to Rome, where she stirred up many by her example to seek
        the love of God. Thence she went to Jerusalem, and then
        returned again to Rome. From this pilgrimage she caught a
        fever, of which she lay sick an whole year in sharp sufferings,
        and then, laden with good works, and after foretelling the day
        of her own death, she departed from earth to heaven. Her body
        was taken to the monastery of Wastein. She was famous for
        miracles, and Boniface IX enrolled her name among those of the
        Saints.
    status: { la: verified, en: verified }
