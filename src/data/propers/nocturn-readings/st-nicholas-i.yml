# Matins Nocturn 2 reading for St. Nicholas I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/11-13-NicolausI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-nicholas-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Nicoláus hujus nóminis primus, natióne Románus, patre Theodoro regionario, Benedícto tértio
        e vivis subláto, mirábili ómnium consensióne, anno Christi octingentésimo quinquagésimo
        octávo, a clero eléctus, et ex basílica príncipis Apostolórum, in qua latitabat, per vim
        edúctus, adductusque in Lateranense patriarchium, Románus Póntifex renuntiátus est. A prima
        puerítia pietátem omnemque virtútem cóluit, eósque in sacris lítteris progréssus fecit, ut
        eum Sérgius secúndus in ipso eódem patriarchio, Ecclésiæ Románæ subdiaconum, Leo vero
        quartus diaconum creaverint, Benedíctus demum tértius ejus consílio et ductu univérsam
        Ecclésiam administraverit.


        Exstant plúrimæ ab eo scriptæ epístolæ, in quibus errantes corréxit, supérbos depressit,
        oppréssos recreavit. Epíscopos, reges, imperatores in offício continuit: Joánnis Ravennatis
        archiepiscopi contumaciam fregit: Hincmarum Rhemensem archiepiscopum de injústa Rhotaldi
        epíscopi Suessionensis depositione ácriter reprehendit; ejus ea de re, nec non Synodi
        Sylvanectensis judícium abrogavit; tum apud sanctam Maríam Majórem in pervigilio Nativitátis
        Domínicæ Missárum solémnia explens, epíscopum ipsum pristinæ dignitati, et paulo post suæ
        sedi plene restítuit. Lotharium regem, qui rejecta legítima uxore Theutberga, Waldradam
        concubinam duxerat intentato anathemate, ad saniorem mentem redúxit. Electionem Photii láici
        hóminis reprobavit, et patriarcham Ignatium in prístinam sedem restítuit. Ecclésiæ demum
        Románæ jura ita deféndit, ut singulæ illíus epístolæ quasi tótidem fortíssima Sedis
        apostólicæ munimenta esse videántur.


        Cum illíus zelus intra tunc præscriptos Ecclésiæ fines continéri non posset, ad conversiónem
        infidélium applicuit ánimum, fecitque ut amplissima Bulgarorum gens, una cum rege, ad
        Christi fidem conversa, Ecclésiæ Románæ, frendente licet imperatóre schismatico, accesserit.
        Óperam quoque suam privátis pietátis offíciis sédulo navávit. Hinc descrípta ómnium
        indigentium nómina apud se habére vóluit, ut síngulis accuratius succurreret. Reparandis
        étiam ornandisque basilicis Urbis, præcípue Lateranénsi patriarchio liberalem manum
        apposuit, et nullis súmptibus pepércit. Inito demum décimo pontificátus anno, in cœlum
        migrávit, et in Vaticáno sepúltus est.
      en: >-
        Nicholas, the first of that name, a Roman by race, son of the regionary Theodore, Benedict
        the Third having been taken from the living, by the wonderful consent of all, in the year of
        Christ 858, was elected by the clergy, and, drawn by force from the basilica of the Prince
        of the Apostles, in which he was hiding, and led into the Lateran patriarchium, was
        proclaimed Roman Pontiff. From earliest boyhood he cultivated piety and every virtue, and
        made such progress in sacred letters that Sergius the Second in that same patriarchium made
        him subdeacon of the Roman Church, Leo the Fourth indeed deacon, and finally Benedict the
        Third administered the whole Church by his counsel and guidance.


        Very many letters written by him exist, in which he corrected the erring, humbled the proud,
        and revived the oppressed. He kept bishops, kings, and emperors to their duty: he broke the
        contumacy of John, archbishop of Ravenna: he sharply rebuked Hincmar, archbishop of Rheims,
        for the unjust deposition of Rothad, bishop of Soissons; he annulled his judgment and that
        of the Synod of Senlis on that matter; then, celebrating the solemnities of the Masses at
        St. Mary Major on the vigil of the Lord's Nativity, he fully restored the bishop himself to
        his former dignity, and soon after to his see. King Lothair, who, having cast off his lawful
        wife Theutberga, had taken Waldrada as concubine, he brought back to a saner mind by
        threatening anathema. He rejected the election of Photius, a layman, and restored the
        patriarch Ignatius to his former see. He so defended the rights of the Roman Church that
        each of his letters seems to be so many most strong bulwarks of the Apostolic See.


        As his zeal could not be confined within the then prescribed limits of the Church, he turned
        his mind to the conversion of infidels, and brought it about that the very large nation of
        the Bulgarians, together with their king, converted to the faith of Christ, joined the Roman
        Church, though the schismatic emperor raged. He also diligently applied his work to private
        offices of piety. Hence he wished to have with him a list of the names of all the needy,
        that he might the more carefully relieve each. He laid a liberal hand also to repairing and
        adorning the basilicas of the City, especially the Lateran patriarchium, and spared no
        expense. At last, the tenth year of his pontificate begun, he migrated to heaven, and was
        buried in the Vatican.
    status: { la: verified, en: draft }
