# Matins Nocturn 2-3 readings for St. Margaret Mary Alacoque, Virgin
# (Oct 17). Sourced directly from
# web/www/horas/Latin/Sancti/10-17.txt, English/Sancti/10-17.txt.
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 11:25-30) is a bare
# "Et réliqua" incipit in the horas file, but the full pericope is
# this same day's own Mass Gospel -- sourced directly from
# web/www/missa/Latin+English/Sancti/10-17.txt's [Evangelium] and
# added 2026-09-05 (isGospel: true) immediately before the homily
# (Lectio7-9, three short excerpts from sermons of St. Francis de
# Sales).
id: st-margaret-mary-alacoque
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Margarita Maria Alacóque, in pago diœcesis Augustodunénsis,
        honesto genere nata, jam inde a teneris annis futuræ
        sanctitátis indícia præbuit. In Deiparam Vírginem et in
        augustum Eucharistiæ sacraméntum amóre flagrans, adolescentula
        Deo virginitátem devovit, id exoptans unice ut ad christianas
        virtútes vitam compóneret. In deliciis habebat prolixas preces
        rerumque cæléstium contemplatiónem, sui contemptum, patiéntiam
        in adversis, corporis afflictatiónem, caritátem in próximos,
        præsertim egénos; summoque studio nitebátur ut sanctíssima
        divini Redemptoris exempla pro viribus referret.


        Ordinem Visitatiónis ingressa, statim religiosæ vitæ fulgóre
        nitére cœpit. Altioris dono oratiónis a Deo est decorata,
        aliisque gratiæ munéribus et crebris visiónibus. Harum
        celeberrima fuit cum ante Eucharistiam precanti Jesus
        semetípsum conspiciéndum obtulit, et divinum Cor in aperto
        péctore flammis incensum ac spinis constrictum osténdit,
        præcepitque ut, ob talem caritátem et ad ingratórum hóminum
        injurias expiandas, illa publicum Cordi suo cultum, magnis
        propositis cæléstis thesáuri præmiis, instituéndum curaret.
        Cunctanti ex humilitate seque tantæ rei ímparem profiténti
        amantíssimus Salvátor addit ánimum, simulque exímia sanctitáte
        virum, Claudium de la Colombiere, ducem et adjutórem designat;
        eamque spe fovet illíus summæ utilitátis, quæ póstea e divini
        Cordis cultu in Ecclésiam dimanávit.


        Ut jussa Redemptoris impleret Margarita omni diligéntia
        studebat. Nec tamen illi defuére molestiæ plures atque acres
        contumeliæ ab iis qui eam vano mentis errori obnoxiam esse
        dictitábant. Quæ ómnia æquo animo tulit, immo apponebat lucro,
        existimans se per oppróbria et dolóres hóstiam Deo gratam fore,
        et majora ad propositum suum auxília consecuturam. Religiosæ
        perfectiónis laude florens et per æternárum rerum
        contemplatiónem in dies síngulos cælésti sponso conjúnctior, ad
        eum evolávit, anno ætátis suæ quadragesimo tertio, reparátæ
        salútis millesimo sexcentésimo nonagesimo. Miraculis insignem
        Benedíctus décimus quintus Sanctis adscripsit; ejusque offícium
        Pius undecimus Pontifex maximus ad universam Ecclésiam
        extendit.
      en: >-
        Margaret Mary Alacoque was born of a respectable family in a
        village in the diocese of Autun. From her earliest years she
        gave signs of holiness. Filled with a burning love of the
        Virgin Mother of God, and of the august mystery of the
        Eucharist, while still a young girl she dedicated her
        virginity to God. Above all else she strove to realize in her
        life the performance of Christian virtues. She delighted to
        spend continuous hours in prayers and in meditation upon the
        things of heaven. She was humble, and patient in adversity. She
        practised bodily penance. She was charitable towards her
        neighbours, especially the poor. By every means within her
        power she strove diligently to imitate the most holy example
        left by our divine Redeemer.


        Margaret entered the Order of the Visitation. There her life
        became immediately a shining example to others. God endowed
        her highly with the gift of prayer. He gave her other favours,
        such as frequent visitations. The most famous of these was
        that one when Jesus appeared to her as she knelt in prayer
        before the Blessed Sacrament. Opening his breast, He revealed
        his divine Heart glowing with flames and encircled with a
        crown of thorns. He bade her in return for his excessive love
        and in atonement for the insults of ungrateful men, to seek to
        have established public adoration of his Heart. This devotion
        he promised to enrich with treasures of heavenly grace. When,
        out of humility, she hesitated to undertake so great a task,
        the loving Saviour encouraged her. At the same time he pointed
        out Claude de la Colombiere, a man of great holiness, as one
        who could guide and help her. Our Lord also comforted her with
        the assurance that very great blessings would accrue
        afterwards to the Church from the worship of his divine Heart.


        Margaret strove ardently to fulfill the Redeemer's command.
        Vexations, even bitter insults, were her portion from some who
        maintained that she was subject to mental aberrations. She not
        only bore these sufferings patiently, she even profited by
        them, offering herself in anguish and reproach as a victim
        acceptable to God, bearing all things as a more sure means of
        accomplishing her purpose. Renowned for her religious
        perfection, becoming each day more closely united with her
        divine spouse by contemplation of celestial things, she took
        flight to him in the forty-third year of her age, and in the
        year of restored salvation 1690. She became famous for
        miracles. Benedict XV added her to the list of the saints;
        Pius XI extended her office to the universal Church.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 11:25-30", en: "Matt 11:25-30" }
    text:
      la: >-
        In illo témpore: Respóndens Jesus, dixit: Confíteor tibi, Pater,
        Dómine cæli et terræ, quia abscondísti hæc a sapiéntibus et
        prudéntibus, et revelásti ea párvulis. Ita, Pater: quóniam sic
        fuit plácitum ante te. Omnia mihi trádita sunt a Patre meo. Et
        nemo novit Fílium nisi Pater: neque Patrem quis novit nisi
        Fílius, et cui volúerit Fílius reveláre. Veníte ad me, omnes,
        qui laborátis et oneráti estis, et ego refíciam vos. Tóllite
        jugum meum super vos, et discite a me, quia mitis sum et
        húmilis corde: et inveniétis réquiem animábus vestris. Jugum
        enim meum suave est et onus meum leve.
      en: >-
        At that time, Jesus spoke and said, I praise You, Father, Lord
        of heaven and earth, that You hid these things from the wise
        and prudent, and revealed them to little ones. Yes, Father, for
        such was Your good pleasure. All things have been delivered to
        Me by My Father; and no one knows the Son except the Father;
        nor does anyone know the Father except the Son, and him to whom
        the Son chooses to reveal Him. Come to Me, all you who labor
        and are burdened, and I will give you rest. Take My yoke upon
        you, and learn from Me, for I am meek and humble of heart; and
        you will find rest for your souls. For My yoke is easy, and My
        burden light.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Francis de Sales, Sermons for Pentecost, the Third Sunday after Pentecost, and Easter Monday"
    text:
      la: >-
        Nulla alia est vera sciéntia, nisi ea quæ a Spíritu Sancto
        datur, sed hæc humílibus tantummodo tribúitur. Nonne magnos
        vídimus theólogos qui mira dixérunt de virtútibus, sed ut eas
        non exercerent? E contra complures vídimus feminas, quæ de
        virtútibus dissérere nesciébant, sed virtútum ópera digne
        nóverant adimplére. Eas enim Spíritus Sanctus sapiéntes
        effécit, quia et timórem Dómini et pietátem et humilitátem
        habebant.


        Dóminus noster, magnus et præclaríssimus ómnium nostrárum
        infirmitátum medicus, antequam in hunc mundum veníret, per
        prophétas suos palam nuntiáverat: Quod confractum fúerit
        alligábo, et quod infirmum fúerit consolidábo. Et deínde suo
        ipse ore clamávit dicens: Veníte ad me omnes qui laborátis et
        oneráti estis, et ego reficiam vos. Quid ígitur mirum si ipsum
        ab ægrotis, a peccatóribus et publicanis circúmdatum cernimus?
        Nonne médici glória est ab ægrotis exquiri?


        Fert ille nostras misérias et jas nobilitat, apponit misériam
        Cordi suo, osténdit latus. Sed eum redamémus oportet, alioquin
        qui præ amóre osténdit vulnera, semel osténdet præ ira et
        indignatióne. Fac, o bone Jesu, ut pacem, quam offers,
        accipiámus, videamúsque vulnera tua, ut quandóquidem manent
        fides, spes, caritas, fide radicati, spe gaudéntes et caritate
        fervéntes, exspectémus beátam spem et advéntum tuum, ita ut in
        illo Te, Agnum ad déxteram non leónem ad sinistram videámus; ac
        pro fide visiónem, pro spe possessiónem et pro caritate
        imperfécta perféctam habeámus, in qua gaudébimus in sæcula
        sæculórum. Amen.
      en: >-
        There is no other true knowledge given but that which is given
        by the Holy Ghost. And this is granted to the humble only.
        Have we not known great theologians who spake marvellously of
        the virtues but did not practice them? Have we not seen, on
        the contrary, many women who did not know how to discourse on
        the virtues, practice the works of virtue worthily? The Holy
        Spirit hath made these wise because they had fear of the Lord,
        piety and humility.


        Our Lord is the great and excellent physician of all our
        infirmities. Before he came into the world he announced openly
        to his prophets, I will bind up that which was broken, and I
        will strengthen that which is weak. Finally with his own lips
        he invited us, saying, Come unto me, all ye that labour and are
        burdened, and I will give you rest. What wonder is it, then, if
        we see him surrounded by the sick, by sinners, and by
        publicans. Is it not the glory of the physician to be sought
        out by the sick?


        The Lord beareth our miseries and ennobleth them. He layeth our
        miseries to his Heart; he sheweth his side. It is meet then,
        that we should make some return to him, lest he who now
        sheweth us his wounds out of love, may one day shew them with
        wrath and indignation. Grant, O good Jesu, that we may receive
        the peace which thou dost offer and let us see thy wounds.
        Since there remain faith, hope and charity, grant that, rooted
        in faith, rejoicing in hope, glowing in charity, we may await
        thy coming in the blessed expectation that we may see thee as
        the Lamb upon the right, and not as the lion on the left; and,
        for faith, may we have vision, and for hope, possession, and
        for imperfect charity, perfect charity, in which we may
        rejoice for ever and ever. Amen.
    status: { la: verified, en: verified }
