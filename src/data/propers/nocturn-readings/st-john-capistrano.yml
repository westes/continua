# Matins Nocturn 2-3 readings for St. John Capistrano, Confessor
# (Mar 28). Sourced directly from web/www/horas/Latin/Sancti/03-28.txt,
# English/Sancti/03-28.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Luke 9:1-6) is a bare incipit
# ("Et réliqua"), so only the homily is authored (not marked isGospel),
# St. Bonaventure's homily (Lectio7's homily + Lectio8-9 combined).
id: st-john-capistrano
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joannes, Capistrani in Pelignis ortus et Perusium studiorum causa missus, in
        christianis et liberalibus disciplinis adeo profecit, ut ob egregiam juris
        scientiam aliquot civitatibus a Neapolis rege Ladislao præfectus fuerit. Dum autem
        earum rempublicam sanctissime gerens perturbatis rebus tranquillitatem revocare
        studet capitur ipse et in vincula conjicitur; quibus mirabiliter ereptus,
        Francisci Assisiensis regulam inter fratres Minores profitetur. Ad divinarum
        litterarum studium progressus præceptorem nactus est sanctum Bernardinum
        Senensem, cujus et virtutis exempla, in cultu potissimum sanctissimi nominis Jesu
        ac Deiparæ propagando, egregie est imitatus. Aquilanum episcopatum recusavit, et
        severiore disciplina atque scriptis quæ plurima edidit ad mores reformandos,
        maxime enituit.


        Prædicationi verbi Dei sedulo incumbens, Italiam fere universam lustravit; quo in
        munere et virtute sermonis et miraculorum frequentia innumeras prope animas in
        viam salutis reduxit. Eum Martinus quintus ad exstinguendam Fraticellorum sectam
        inquisitorem instituit. A Nicolao quinto contra Judæos et Saracenos generalis
        inquisitor in Italia constitutus, plurimos ad Christi fidem convertit. In Oriente
        multa optime constituit, et in concilio Florentino, ubi veluti sol quidam fulsit,
        Armenos Ecclesiæ catholicæ restituit. Idem Pontifex, postulante Friderico tertio
        imperatore, illum apostolicæ Sedis nuntium in Germaniam legavit, ut hæreticos ad
        catholicam fidem et principum animos ad concordiam revocaret. In Germania aliisque
        provinciis Dei gloriam sexennali ministerio mirifice auxit, Hussitis, Adamitis,
        Thaboritis, Hebræisque innumeris doctrinæ veritate ac miraculorum luce ad
        Ecclesiæ sinum traductis.


        Cum Callistus tertius, ipso potissimum deprecante, cruce signatos mittere
        decrevisset, Joannes per Pannoniam aliasque provincias volitavit, qua verbo, qua
        litteris principum animos ita ad bellum accendit, ut brevi millia Christianorum
        septuaginta conscripta sint. Ejus consilio et virtute potissimum Taurunensis
        victoria relata est, centum ac viginti Turcarum millibus partim cæsis, partim
        fugatis. Cujus victoriæ cum Romam nuntius venisset octavo Idus Augusti, idem
        Callistus ejus diei memoriæ solemnia Transfigurationis Christi Domini perpetuo
        consecravit. Lethali morbo ægrotum et Villacum delatum viri principes plures
        visitarunt; quos ipse ad tuendam religionem hortatus, animam Deo sancte reddidit
        anno salutis millesimo quadringentesimo quinquagesimo sexto. Ejus gloriam post
        mortem Deus multis miraculis confirmavit: quibus rite probatis, Alexander octavus
        anno millesimo sexcentesimo nonagesimo Joánnem in Sanctorum numerum retulit;
        ejusque Officium ac Missam Leo decimus tertius, altero ab ejus canonizatione
        sæculo, ad universam extendit Ecclesiam.
      en: >-
        This John was born at Capistrano, in the Abruzzi. He was educated at Perugia, and
        became so expert in letters, both sacred and profane, that on account of his
        eminent knowledge of law, Ladislaus, King of Naples, set him over several cities.
        He was seeking in righteousness to bring the affairs of these places out of
        trouble into peace, when he himself was kidnapped and put in chains. From this
        captivity he marvellously escaped, and then professed himself a Friar Minor under
        the rule of Francis of Assisi. Here he went forward in the study of divinity, and
        had as a teacher the holy Bernardine of Sienna, of whom he was one of the most
        marked followers, especially in spreading abroad the honour paid to the Most Holy
        Name of Jesus, and to the Mother of God. The bishopric of Aquila was offered to
        him, but he refused it. He was chiefly known by the hardship of his self-denial,
        and by the writings which he published in large numbers for the reform of manners.


        He devoted himself without ceasing to the preaching of the Word of God, in the
        which work he travelled throughout nearly all Italy, and by the power of eloquence
        and of miracles not a few, he recalled souls almost countless into the path of
        salvation. Martin V. appointed him Inquisitor to stamp out the sect of the
        Fraticelli. Nicolas V. appointed him Inquisitor-General in Italy against Judaism
        and Mohammadanism, and he brought many such misbelievers to believe in Christ. He
        did much good work in the affairs of the Eastern Church, and at the Council of
        Florence, wherein he shone like a sun, he brought back the Armenians to the
        Catholic church. The same Pope Nicolas V., at the request of the Emperor Frederick
        III., sent him into Germany as Nuncio of the Apostolic See, in order that he might
        bring back the heretics to the Catholic faith and the minds of the princes to
        peace and agreement. He did a wonderful work for God's glory during the six years
        that he laboured in Germany and other countries, and by his teaching of the truth
        and the striking evidence of his miracles brought back to the bosom of the Church
        almost countless numbers of Hussites, Adamites, Taborites, and Jews.


        It was mainly at the entreaty of John that Calistus III. proclaimed a Crusade, and
        John hastened about through Pannonia and other provinces, where by his words and
        his letters he so roused the minds of princes to that holy war, that in a short
        while seventy thousand Christian soldiers were enrolled. It was mainly through his
        advice and by his power that victory was gained at Belgrade, when one hundred and
        twenty thousand Turks were either slain or put to flight. The news of this victory
        reached Rome upon the sixth day of August, and Pope Calistus thereupon consecrated
        that day for ever to the solemn commemoration of the transfiguration of the Lord
        Christ. As John lay sick unto death at Illak, many princes came to see him, and he
        exhorted them to protect religion. He gave up his soul in holiness to God, in the
        year of salvation 1456. God confirmed his glory by many miracles after his death,
        and when these had been duly proved Alexander VIII. enrolled his name with those
        of the saints in the year 1690, and two hundred years after his canonization Leo
        XIII. extended his Office and Mass to the whole Church.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Bonaventure, Commentary on Luke 9 (on Luke 9:1-6)"
    text:
      la: >-
        Apostoli ideo nominati sunt, ut eorum commendaretur auctoritas. Apostolus enim
        missus interpretatur: missi autem fuerunt ad prædicandum, secundum illud: Non
        misit me Christus baptizare, sed evangelizare. Fuerunt ad prædicandum missi, non
        rem parvam, sed magnam scilicet regnum Dei, per quod potest intelligi doctrina
        veritatis, juxta illud: Auferetur a vobis regnum Dei, et dabitur genti facienti
        fructus ejus. Potest étiam dici gratia Spiritus Sancti, secundum illud: Non est
        regnum Dei esca et potus, sed justitia et pax, et gaudium in Spiritu Sancto; et
        infra: Ecce regnum Dei intra vos est. Potest étiam dici gloria æterna, juxta
        illud: Amen dico vobis, nisi quis renatus fuerit ex aqua et Spiritu Sancto, non
        potest introire in regnum Dei.


        Omnibus his modis Apostoli sunt missi prædicare regnum Dei, scilicet veram
        doctrinam, divinam gratiam, et ætérnam gloriam. Et quia propter auctoritatem
        prædicationis concesserat potestatem curationis, ideo subdit: Et sanare infirmos;
        scilicet misit ad confirmationem veritatis prædicatæ secundum illud: Illi autem
        profecti, prædicaverunt ubique, Domino cooperante et sermonem confirmante
        sequentibus signis. Unde signum missionis spiritualis ad prædicandum est sanatio
        audientium a morbis vitiorum.


        Tria autem sunt signa evidentia, quibus probatur utrum prædicator a Domino sit
        missus ad Evangelium prædicandum. Primum est auctoritas mittentis, cujusmodi est
        pontificis, et Maxime Pontificis summi, qui est loco Petri, immo Jesu Christi;
        unde qui ab eo mittitur, a Christo mittitur. Secundum est zelus animarum in
        persona quæ mittitur, quando scilicet principaliter quæsierit Dei honorem et
        animarum salutem. Tertium est fructificatio et conversio auditorum. Per primum
        sunt nuntii Patris, per secundum Filii, per tertium Spiritus Sancti. De primo: pro
        patribus tuis nati sunt tibi filii. De secundo: Non enim nosmetipsos prædicamus,
        sed Jesus Christum Dominum nostrum. De tertio: Posui vos ut eatis, et fructum
        afferatis, et fructus vester maneat. Et qui sic mittitur, potest dicere illud:
        Spiritus Domini super me, eo quod unxerit me.
      en: >-
        Apostles are so called as a mark of their authority, for this word Apostle
        signifieth sent, and they were sent out to preach, as it is written: Christ sent
        me not to baptize but to preach the gospel. They were sent to preach not any small
        thing but a very great thing, even the Kingdom of God, whereby we may understand
        the teaching of the truth, as it is said, The Kingdom of God should be taken from
        you and given to a nation bringing forth the fruits thereof. The Kingdom of God
        may also be understood to signify the grace of the Holy Ghost, as it is written:
        The Kingdom of God is not meat and drink, but righteousness, and peace, and joy in
        the Holy Ghost; as also it was said: The Kingdom of God is within you. The Kingdom
        of God may also be understood to signify eternal glory, as it is said: Amen, I say
        unto thee, except a man be born again of water and of the Holy Ghost he cannot
        enter into the Kingdom of God.


        The Apostles were sent to preach the Kingdom of God in all these three senses,
        that is to say, as the true teaching, as the grace of God, and as eternal glory.
        In order to invest their teaching with authority He gave them the power to cure
        diseases, whence where it is written And He sent them to preach the Kingdom of
        God it is also said And to heal the sick. This power He gave in order to confirm
        the truth of their preaching, as it is written: And they went forth, and preached
        everywhere, the Lord working with them, and confirming the Word with signs
        following. The sign that a preacher is indeed sent forth by the Spirit of God is
        that they that hear him should be cured of the disease of sin.


        There are three manifest signs which show whether a preacher hath been sent by the
        Lord to preach the gospel. The first is that he should be sent by one having
        authority to do so, such as is a bishop, and above all the Pope, who is in the
        place of Peter, yea of Jesus Christ. So that he who is sent by him is sent by
        Christ. The second sign is a love for souls in the person who is sent, so that he
        seeketh mainly the honour of God and the salvation of souls. The third sign is
        that his hearers should bring forth fruit and should be converted. By the first
        sign a preacher is known as being sent by the Father, by the second he is known as
        being sent by the Son, by the third he is known as being sent by the Holy Ghost.
        Of the first sign it may be said: Instead of Thy Father shall be Thy children; of
        the second sign it may be said: We preach not ourselves, but Christ Jesus our
        Lord; of the third sign it may be said, I have chosen you, and ordained you, that
        ye should go and bring forth fruit, and that your fruit should remain. And he who
        is thus sent forth can say: The Spirit of the Lord is upon me because He hath
        anointed me to preach the gospel.
    status: { la: verified, en: verified }
