# Matins Nocturn 2-3 readings for St. Camillus de Lellis, Confessor
# (July 18). Sourced from web/www/horas/Latin/Sancti/07-18.txt,
# English/Sancti/07-18.txt.
#
# Nocturn 2 (Lectio4-6): one continuous vita, no genuine source break --
# same combining convention st-alphonsus-liguori.yml/st-ephraim-of-syria.yml
# use. (The source's own cisterciensis-track Lectio1-3, "vide C5" plus a
# shorter version of the same vita, is the Monastic-specific alternative,
# not used here.)
#
# Nocturn 3: the source gives a real, explicit Gospel+homily pair (John
# 15:12-16, "Hoc est præceptum meum," with St. Augustine's own Tractatus
# 83 on John) rather than a bare "vide Commune" cross-reference, so
# transcribed here in full, same as st-ephraim-of-syria.yml's own genuine
# Nocturn 3.
id: st-camillus-de-lellis
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Camillus Bucclánici, Theatinæ diœcesis oppido, ex nobili Lelliórum família natus est
        matre sexagenaria, cui gravidæ visum est per quietem, puerulum crucis signo in péctore
        munítum, et ágmini puerórum idem signum gestántium præeuntem, se peperisse. Adoléscens
        rem militarem secutus, sæculi vitiis aliquámdiu indulsit; donec, vigesimum quintum
        agens ætátis annum, tanto supernæ gratiæ lúmine divinæque offensæ dolóre correptus
        fuit, ut uberrimo lacrimárum imbre íllico perfusus, anteáctæ vitæ sordes indesinenter
        abstérgere, novumque indúere hóminem firmiter decreverit. Quare ipso, quo id cóntigit,
        Purificatiónis beatíssimæ Vírginis festo die, ad fratres Minores, quos Capuccinos
        vocant, cónvolans, ut eórum número adscriberétur summis precibus exorávit. Voti compos
        semel atque íterum factus est; sed, fœdo úlcere, quo aliquándo laboráverat, in ejus
        tibia iterato recrudescente, divinæ providéntiæ majora de eo disponentis consílio
        humíliter se subjécit; suique victor, illíus religiónis bis expetítum et susceptum
        habitum bis dimísit.


        Romam profectus, in nosocomíum, quod Insanabílium dícitur, recéptus est; cujus étiam
        administratiónem, ob perspectas ejus virtútes sibi demandatam, summa integritate, ac
        sollicitúdine vere paterna peregit. Omnium ægrotum servum se réputans, eórum stérnere
        lectulos, sordes térgere, ulcéribus medéri, agoníque extremo piis precibus et
        cohortatiónibus opem ferre solemne hábuit; quibus in munéribus præclára præbuit
        admirábilis patiéntiæ, invictæ fortitúdinis et heróicæ caritátis exempla. Verum, cum
        animárum in extremis periclitántium, quod únice intendébat, levámini subsidium
        litterárum plurimum conférre intellígeret, trigínta duos annos natus in primis
        grammaticæ elementis tirocinium inter púeros íterum subire non erubuit. Sacerdotio
        póstea rite initiatus, nonnullis sibi adjunctis sociis, prima jecit congregatiónis
        Clericórum regulárium infirmis ministrántium fundamenta, írrito conatu obniténte
        humani generis hoste. Nam Camillus, cælésti voce e Christi crucifixi, manus étiam de
        ligno avulsas admirando prodigio protendentis, simulacro emissa mirabíliter
        confirmátus, ordinem suum a Sede apostolica approbari obtinuit; sodálibus quarto
        obstrictis maxime arduo voto, infirmis, quos étiam pestis infécerit, ministrandi. Quod
        institutum, quam foret Deo acceptum et animárum salúti proficuum, sanctus Philippus
        Nerius, qui Camillo a sacris confessiónibus erat, comprobávit, dum ejus alumnis
        decedéntium agoni opem feréntibus Angelos suggeréntes verba sæpius se vidisse testátus
        est.


        Arctióribus hisce vinculis ægrotántium ministerio mancipatus, mirum est qua alacritate,
        nullis fractus labóribus, nullis deterritus vitæ periculis, diu noctuque ad supremum
        usque spíritum, eórum cómmodis vigilaverit. Omnibus ómnia factus, vilíssima quæque
        offícia demissíssimo obsequio flexísque plerumque genibus, véluti Christum ipsum
        cérneret in infirmis, hílari promptoque animo arripiébat; utque ómnium indigéntiis
        præsto esset, generalem ordinis præfecturam, cælique delicias quibus in contemplatióne
        defixus affluebat, sponte dimísit. Paternus vero illíus erga míseros amor tum maxime
        effulsit, dum et Urbs contagióso morbo primum, deínde extrema annonæ laboráret
        inópia, et Nolæ in Campánia dira pestis grassarétur. Tanta denique in Deum et próximum
        caritate exársit, ut angelus nuncupari, et Angelórum opem in vario itinerum discrímine
        experíri promererétur. Prophetíæ dono et grátia sanitátum præditus, arcana quoque
        cordium inspéxit; ejusque precibus nunc cibária multiplicáti sunt, nunc aqua in vinum
        conversa. Tandem vigiliis, jejuniis et assiduis attritus labóribus, cum pelle tantum
        et óssibus constare viderétur, quinque molestis æque ac diútinis morbis, quos
        misericórdias Dómini appellabat, fortiter tolerátis, sacramentis munítus, Romæ, inter
        suavíssima Jesu et Maríæ nómina, ad ea verba: Mitis atque festivus Christi Jesu tibi
        aspectus appareat; qua prædixerat hora, obdormívit in Dómino, pridie Idus Julii, anno
        salútis millesimo sexcentésimo décimo quarto, ætátis suæ sexagesimo quinto. Quem,
        plúribus illustrem miraculis, Benedíctus décimus quartus solemni ritu Sanctórum
        fastis adscripsit; et Leo décimus tértius, ex Sacrórum cathólici orbis antístitum voto
        ac Rítuum Congregatiónis consúlto, cæléstem ómnium hospitálium et infirmórum ubíque
        degéntium patrónum declarávit, ipsiúsque nomen in agonizántium litaníis invocári
        præcépit.
      en: >-
        Camillus was a son of the noble family of the Lelli, and was born at Bacchianico, a
        town in the Diocese of Chieti. His mother was sixty years of age at the time of his
        birth. While she was great with child, she dreamed that she brought forth a babe
        bearing the mark of a Cross upon his breast, and going before a troop of other babes
        marked likewise. When Camillus was a young man he served as a soldier, and yielded
        himself for a while to the sins of the world. In the twenty-fifth year of his age
        light from God broke upon him, together with such sorrow at having offended him, that
        in a violent fit of tears he determined to wipe away without ceasing the evil relics
        of his past life, and to put on the new man. That very day, being the holiday of the
        Purification of the Most Blessed Virgin, he ran to the Friars Minor, who are commonly
        called Capuchins, and implored them, with the most earnest prayers, to enrol him among
        them. His wish was granted, once and then again; but when a loathsome running sore in
        the leg, from which he had suffered before, broke out afresh in that same leg, he
        humbly submitted himself to the greater plan of divine providence for him, and,
        conquering himself, twice laid aside the habit of that Order which he had twice sought
        and received.


        He went to Rome and was received as an inmate in the Hospital for Incurables. In
        consequence of his tried and proven virtues, the administration of the Hospital was
        committed to his charge, and he discharged this office with the most thorough
        trustworthiness and with a tenderness like a father's. He counted himself the slave of
        all the sick, and made it his settled practice to make their beds, clean them, dress
        their sores, and help by godly prayers and exhortations such as were in their last
        agony; in these offices he gave brilliant examples of wonderful patience, unconquered
        fortitude, and heroic charity. But when he came to understand how greatly a knowledge
        of letters could aid the comfort of souls in their extremity, which was his one
        concern, he did not blush, at the age of thirty-two, to undergo again among little
        boys the first rudiments of grammar. Having afterward been duly ordained a priest, and
        joined by some companions, he laid the first foundations of the Congregation of
        Regular Clerks for ministering to the sick, though the enemy of mankind strove in vain
        to hinder it. For Camillus, wonderfully strengthened by a voice from heaven that came
        from an image of Christ Crucified — whose very hands, by an admirable wonder, stretched
        forth from the wood — obtained the approval of his Order from the Apostolic See; its
        members being bound by a fourth and most arduous vow, to minister to the sick, even
        those infected with the plague. How pleasing to God and how profitable to the
        salvation of souls this institute would be, holy Philip Neri, who was confessor to
        Camillus, himself confirmed, testifying that he had often seen Angels suggesting words
        to Camillus's own disciples as they assisted the dying in their agony.


        Bound by these still closer ties to the service of the sick, it is wonderful with what
        eagerness Camillus, broken by no labors, deterred by no dangers to his own life,
        watched over their welfare day and night to his very last breath. Becoming all things
        to all men, he took up even the most menial duties with the humblest submission, and
        very often on bended knee, as though he beheld Christ himself in the sick; and that he
        might be free to answer everyone's need, he of his own accord laid down the general
        governance of his Order, and the heavenly delights in which he was steeped when fixed
        in contemplation. His fatherly love for the wretched shone brightest of all when Rome
        was afflicted first by a contagious sickness, and then by the direst want of grain,
        and when a fearful plague was raging at Nola in Campania. So greatly did he burn with
        love for God and neighbor that he deserved to be called an angel, and to find the help
        of Angels amid the various perils of his journeys. Endowed with the gift of prophecy
        and the grace of healing, he also read the secrets of hearts; and by his prayers food
        was at times multiplied, and water turned into wine. Worn out at last by watching,
        fasting, and unceasing labor, until he seemed to be nothing but skin and bone, he bore
        bravely five distressing and long-lasting illnesses, which he called the mercies of
        the Lord, and, fortified with the Sacraments, at Rome, amid the sweetest names of
        Jesus and Mary, at the very words, "May the mild and joyous countenance of Christ Jesus
        appear to thee," he fell asleep in the Lord at the hour he had himself foretold, on
        the day before the Ides of July, in the year of salvation 1614, in the sixty-fifth
        year of his age. Benedict XIV, in solemn rite, enrolled him, renowned for many
        miracles, among the Saints; and Leo XIII, at the petition of the bishops of the whole
        Catholic world and on the advice of the Congregation of Sacred Rites, declared him the
        heavenly patron of all hospitals and of the sick everywhere, and ordered that his name
        be invoked in the litany for the dying.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Joannes 15:12-16", en: "John 15:12-16" }
    text:
      la: >-
        In illo témpore: Dixit Jesus discípulis suis: Hoc est præcéptum meum, ut diligátis
        invicem, sicut diléxi vos. Et réliqua.
      en: >-
        At that time: Jesus said unto his disciples: This is my commandment, That ye love one
        another, as I have loved you. And so forth.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Tractate 83 on John"
    text:
      la: >-
        Quid putamus, fratres mei? numquidnam solum ejus de ista dilectióne mandátum est, qua
        dilígimus invicem? Nonne est et aliud majus, ut diligámus Deum? Aut vero de sola Deus
        nobis dilectióne mandávit, ut alia non requiramus? Tria certe commendat Apóstolus,
        dicens: Manent autem fides, spes, caritas, tria hæc, major autem horum caritas. Et, si
        in caritate, hoc est, in dilectióne, concludúntur duo illa præcepta, major tamen dicta
        est esse, non sola. De fide ígitur nobis quam multa mandáta sunt, quam multa de spe!
        Quis potest cuncta colligere, quis enumerando sufficere? Sed intueamur, quod ait idem
        Apóstolus: Plenitúdo legis caritas.


        Ubi ergo caritas est, quid est quod possit deésse? ubi autem non est, quid est quod
        possit prodesse? Dæmon credit, nec díligit: nemo díligit, qui non credit. Frustra
        quidem, sed tamen potest speráre véniam qui non díligit; nemo autem potest desperáre
        qui díligit. Itaque ubi diléctio est, ibi necessario fides et spes; et, ubi diléctio
        próximi, ibi necessario étiam diléctio Dei. Qui enim non díligit Deum, quómodo díligit
        próximum tamquam se ipsum? Quandóquidem non díligit et se ipsum. Est quippe ímpius et
        iníquus; qui autem díligit iniquitátem, non plane díligit, sed odit ánimam suam.


        Hoc ergo præcéptum Dómini teneamus, ut nos invicem diligamus, et quidquid aliud
        præcepit, faciémus; quóniam quidquid est, aliud, hic habemus. Discérnitur quippe ista
        diléctio ab illa dilectióne, qua se invicem díligunt hómines; nam ut discernerétur,
        adjunctum est: Sicut diléxi vos. Ut quid enim díligit nos Christus, nisi ut regnare
        possímus cum Christo? Ad hoc ergo et nos invicem diligamus, ut dilectiónem nostram
        discernámus a ceteris, qui non ad hoc se invicem díligunt, quia nec díligunt. Qui
        autem se propter habéndum Deum díligunt, ipsi se díligunt. Ergo, ut se diligant, Deum
        díligunt. Non est hæc diléctio in ómnibus homínibus: pauci se proptérea díligunt, ut
        sit Deus ómnia in ómnibus.
      en: >-
        What think ye, my brethren? Is this his only commandment, this, that we love one
        another? Is there not another and a greater, the commandment to love God? Or hath God
        commanded us only to love, so that we need seek to do no more? Surely the Apostle
        commendeth three things: And now abideth Faith, Hope, Charity, these three, but the
        greatest of these is Charity. And although in charity, that is, in love, he included
        the two first and great commandments, and charity he called the greatest, yet is
        charity not said to be alone. Concerning Faith, concerning Hope, how much is commanded
        us? Who can gather them all together? Who can reckon them all? And yet let us consider
        how the same Apostle saith: Love is the fulfilling of the Law.


        Where therefore charity is, what can be lacking? Or where charity is not, what can
        there be availing? The devil believeth and loveth not; but there is no one that
        loveth and believeth not. Useless though it be, it is still possible for one that
        loveth not to hope to be forgiven; but for one that loveth, it is impossible to give
        up hope. Therefore, where love is, there also must faith and hope needs be; and where
        there is love toward one's neighbor, there also must there needs be love toward God.
        For one that loveth not God, how can he love his neighbor as himself, seeing he
        hateth even himself? For he is a wicked and blasphemous wretch; and the lover of
        wickedness is not the lover, but the deadly enemy, of his own self.


        Let us, therefore, hold fast to this precept of the Lord, to love one another; and
        then all else that is commanded we shall do, for all else is contained in this. But
        this love is distinguished from that which men bear to one another as such; for in
        order to mark the distinction, it is added, As I have loved you. And wherefore is it
        that Christ loves us, but that we may be fitted to reign with Christ? With this aim,
        therefore, let us also love one another, that we may show the difference of our love
        from that of others, who have no such motive in loving one another, because such love
        itself is wanting to them. But those whose mutual love has the possession of God
        himself for its object, truly love one another; and therefore, even for the very
        purpose of loving one another, they love God. There is no such love as this in all
        men; for few love one another for this reason, that God may be all in all.
    status: { la: verified, en: verified }
