# Nocturn 2-3, Sixth Sunday after Easter (temporalId easter-6). Sourced
# from Tempora/Pasc5-0.txt (Latin) / English/Tempora/Pasc5-0.txt. See
# advent-1.yml/easter-octave.yml for the general sweep method.
