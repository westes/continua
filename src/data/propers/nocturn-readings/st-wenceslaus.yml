# Matins Nocturn 2-3 readings for St. Wenceslaus, Duke and Martyr
# (Sep 28). Sourced directly from web/www/horas/Latin/Sancti/09-28.txt,
# English/Sancti/09-28.txt. Nocturn 2: Lectio4-6 combined into one
# reading, one continuous vita. Nocturn 3: the Gospel citation ends
# "Et réliqua"/"And so on, and that which followeth" with no full
# pericope given -- per the bare-incipit convention, only the homily
# (Lectio7-9, St. Hilary of Poitiers) is authored, isGospel: false, no
# citation field.
id: st-wenceslaus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Wencesláus Bohémiæ dux, Wratisláo patre christiáno, Drahomíra
        matre gentíli natus, ab ávia Ludmílla fémina sanctíssima pie
        educátus, omni virtútum génere insígnis, summo stúdio
        virginitátem per omnem vitam servávit illibátam. Mater, per
        nefáriam Ludmíllæ necem regni administratiónem assecúta, ímpie
        cum junióre fílio Bolesláo vivens, concitávit in se prócerum
        indignatiónem; quare, tyránnici et ímpii regíminis pertæsi,
        utriúsque excússo jugo, Wencesláum in urbe Pragénsi regem
        salutárunt.


        Ille, regnum pietáte magis quam império regens, órphanis,
        víduis, egénis tanta caritáte subvénit, ut própriis húmeris
        aliquándo ligna indigéntibus noctu comportárit, paupéribus
        humándis frequénter affúerit, captívos liberárit, carcéribus
        deténtos nocte intempésta visitárit, pecúniis et consílio
        sæpíssime consolátus. Miti ánimo princeps veheménter dolébat
        quémpiam, etsi reum, morti adjudicári. Summa religióne
        sacerdótes venerátus, suis mánibus tríticum serébat et vinum
        exprimébat, quibus in Missæ sacrifício uteréntur. Nocte nudis
        pédibus super nivem et glaciem circuíbat ecclésias, sanguínea
        et terram calefaciéntia post se relínquens vestígia.


        Angelos hábuit sui córporis custódes. Cum enim ad singuláre
        certámen advérsus Radisláum, ducem Curiménsem, eo fine
        accéderet, ut suórum salúti prospíceret, visi sunt Angeli arma
        ministrásse et dixísse adversário: Ne férias. Pertérritus
        hostis, venerabúndus prócidens véniam exorávit. Cum in
        Germániam proféctus esset, imperátor, conspéctis duóbus Angelis
        áurea cruce ad se accedéntem ornántibus, e sólio prosíliens
        brácchiis excépit, régiis insígnibus decorávit, eíque sancti
        Viti brácchium donávit. Nihilóminus ímpius frater, matre
        hortánte, convívio excéptum et póstea in ecclésia orántem,
        parátæ sibi mortis præscium, adhíbitis scéleris comítibus,
        interfécit. Sanguis per paríetes aspérsus adhuc conspícitur, et,
        Deo víndice, matrem inhumánam terra absórbuit, interfectóres
        váriis modis mísere periérunt.
      en: >-
        Wenceslaus, Duke of Bohemia, was the son of a Christian father,
        Duke Wratislaus I., and an heathen mother named Drahomira. He had
        for his grandmother a most holy woman, named Ludmilla, who
        trained him up in godliness. He was a man eminent in all graces,
        and one who carefully held his virginity unsullied throughout the
        whole course of his life. His mother seized the supreme power by
        the foul murder of Ludmilla, and lived foully with her younger
        son Boleslaus, and the nobles roused thereby to indignation, and
        wearied with her tyranny and wicked government, cast off the
        yoke of both of them, and hailed Wenceslaus in the city of Prague
        as their King.


        He ruled his kingdom by his virtues rather than by force. To the
        orphaned, the widowed, and the destitute he was very charitable,
        so that some whiles in the winter he carried firewood to the
        needy on his own shoulders. He helped oftentimes to bury the
        poor, he set captives free, and went many times to the prisons
        at the dead of night to comfort with money and advice them that
        were detained therein. To a Prince of so tender an heart it was
        a great grief to be behoven to condemn any to death, however
        guilty. For Priests he had a most earnest respect, and with his
        own hands sowed the corn and pressed the grapes for the bread
        and wine which they were to use for the Sacrifice. He would walk
        round the Church by night with bare feet upon the snow and ice,
        leaving behind him bloody footprints that warmed the ground.


        As his Body-guard he had angels. For when Radislaus, Prince of
        Gurinna, invaded Bohemia, and Wenceslaus, to save the effusion
        of his people's blood, went out to meet him in single combat,
        angels were seen serving him with arms, and heard to say to the
        adversary: Strike not. Therefore, his enemy was stricken with
        terror, fell down in reverence before him, and begged his
        forgiveness. When he went to Germany, the Emperor saw two angels
        carrying a golden Cross before him as he drew nigh him, and
        arose from his throne, embraced him in his arms, created him a
        King, and gifted him with the arm of the holy Martyr Vitus.
        Nevertheless, his godless brother, at the exhortation of their
        mother, bade him to a feast, and when Wenceslaus, with a
        foreboding of the death prepared for him, went afterwards into
        the Church, and was praying there, together with some
        accomplices of his crime, despatched him, running him through
        the body with a lance. The stains of his blood may still be seen
        upon the walls. By the judgment of God, his unnatural mother was
        swallowed up by the earth, and his murderers, in diverse ways,
        perished miserably.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Hilary of Poitiers, Commentary on Matthew, ch. 10"
    text:
      la: >-
        Quæ ista divísio est? inter prima enim legis præcépta accépimus:
        Honóra patrem tuum et matrem tuam; et ipse Dóminus ait: Pacem
        meam do vobis, pacem meam relínquo vobis. Quid sibi vult missus
        pótius gládius in terram, et separátus a patre fílius, et fília
        a matre, et nurus advérsus socrum, et hóminis doméstici ejus
        inimíci? Igitur exínde pública auctóritas impietáti proferétur.
        Ubíque ódia, ubíque bella, et gládius Dómini inter patrem et
        fílium, et inter filiam matrémque desæviens.


        Gládius telórum ómnium telum acutíssimum est, in quo sit jus
        potestátis, et judícii sevéritas, et animadvérsio peccatórum.
        Et, hujus quidem teli nómine, novi Evangélii prædicatiónem
        appellátam frequens in prophétis auctóritas est. Dei ígitur
        verbum nuncupátum meminérimus in gládio; qui gládius missus in
        terram est, idest, prædicátio ejus hóminum córdibus infúsa.
        Fitque gravis in domo una dissénsio, et doméstica novo hómini
        erunt inimíca; quia ille, per verbum Dei divísus ab illis,
        manére et intérior et extérior, id est, et corpus et anima, in
        spíritus novitáte gaudébit.


        Pergit deínde eódem præceptórum et intelligéntiæ decúrsu. Nam,
        posteáquam relinquénda ómnia, quæ in sæculo caríssima sunt,
        imperáverat, adjécit: Qui non áccipit crucem suam, et séquitur
        me, non est me dignus; quia Qui Christi sunt, crucifixérunt
        corpus cum vítiis et concupiscéntia. Et indígnus est Christo,
        qui non crucem suam, in qua compátimur, commórimur,
        consepelímur, conresúrgimus, accípiens, Dóminum sit secúrus, in
        hoc sacraménto fídei, spíritus novitáte victúrus.
      en: >-
        What meaneth such division in the earth, by reason of the Lord's
        coming? Amongst the foremost commandments of the Law we have
        received this: Honour thy father and thy mother. And the Lord
        himself said: Peace I leave with you, my peace I give unto you.
        What meaneth this sword sent upon the earth? Why is father set
        at variance against son, and daughter against mother, and
        daughter-in-law against mother-in-law? Why shall a man's foes be
        they of his own household? From all this it might seem that
        open sanction is given to the neglect of natural duties—hatred
        everywhere, warfare everywhere, the sword of the Lord furiously
        raging between father and son, mother and daughter.


        The sharpest weapon of all weapons is the sword, whereby is
        enforced the law of might, the severity of judgment, the
        punishment of sinners. Furthermore, the word Sword is in common
        use amongst the Prophets as a figure of the preaching of the new
        Gospel. Ye are to understand, then, that the word of God is
        often called a sword; and that this sword is sent upon the earth
        when the preaching of God's word entereth into the hearts of
        men. For then at once cometh grave dissension in the new man's
        old home, and thus a man's foes are they of his own household.
        For he is set at variance against them by the word of God,
        whereby he joyously abideth in newness of spirit both within and
        without, that is, in soul and body.


        The Lord continueth in the same strain of exhortation and
        discernment. For after bidding us leave whatever we hold
        dearest in the world, he addeth: He that taketh not up his
        cross, and followeth after me, is not worthy of me; because
        they that are Christ's have crucified the flesh with the
        affections and lusts. And hence he is unworthy of Christ who
        taketh not up his cross, because thereon we suffer, and so
        thereon we die with the Lord; yea, thereby are we buried with
        him, and do rise again with him; thereby we follow the Lord to
        victory, in newness of spirit and in the mystery of faith.
    status: { la: verified, en: verified }
