# Matins Nocturn 2 and 3 reading for St. Josaphat, Bishop and Martyr. Sourced directly from
# web/www/horas/Latin/Sancti/11-14.txt, English/Sancti/11-14.txt.
# Lectio4-6 combined into one reading, one continuous vita. Nocturn 3: the Gospel pericope then the saint's own homily.
id: st-josaphat
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Jósaphat Kuncewítius, nobílibus et catholicis paréntibus Vladimíriæ in Volhinia
        natus, cum puerulus matrem de Christi passióne loquentem audíret, jaculo e
        látere imaginis Jesu crucifixi immisso, vulnus in corde suscépit. Dei amóre
        incénsus, adeo oratióni aliisque piis opéribus instare cœpit, ut provectióribus
        adolescéntibus exemplo et admiratióni esset. Vicennis inter claustrales sancti
        Basilíi alumnos monasticam regulam proféssus, mirum quos in evangelica
        perfectióne progréssus fécerit. Nudis pédibus, frigidíssima licet sæviénte
        regiónis híeme, incedébat; carnes numquam, vinum nonnisi ex obediéntia adhibuit,
        asperrimoque cilício ad obitum usque corpus afflixit. Castitátis florem, quem ab
        adolescéntia Virgini Deiparæ vóverat, inviolátum servávit. Virtútis doctrinæque
        ejus brevi sic fama percrébuit, ut, quamvis júnior, Bytenii monasterio præfectus
        sit mox Vilnénsis archimandríta, ac demum archiepíscopus Polocénsis, invitus
        quidem, sed Catholicis gestiéntibus, fúerit renuntiatus.


        Hac dignitate auctus, nihil de priori vivéndi ratióne remíttens, nonnisi divinum
        cultum et creditárum sibi óvium salútem cordi hábuit. Catholicæ unitátis ac
        veritátis strenuus propugnator, totis viribus adlaborávit, ut schismaticos
        hæreticosque ad communiónem cum beáti Petri Sede reduceret. Summum Pontificem
        ejusque potestátis plenitúdinem ab impudentíssimis impiórum calumniis et
        erróribus, qua conciónibus, qua scriptis pietáte ac doctrina refertis, defendere
        numquam déstitit. Episcopalem jurisdictiónem et Ecclésiæ bona a láicis usurpáta
        vindicávit. Incredibile dictu est quot hæreticos in sinum matris Ecclésiæ
        revocáverit. Uniónis vero Græcæ Ecclésiæ cum Latina Josephátum promotórem
        exstitisse præclaríssimum, étiam pontifícia oracula diserte testántur. Ad hæc,
        et templi Dei decóri instaurando, et sacrárum vírginum exstruéndis ædibus,
        aliisque piis opéribus juvandis, mensæ suæ proventus ultro erogávit. In páuperes
        adeo effúsus, ut, cum olim inópiæ cujusdam víduæ sublevandæ nihil occurreret,
        episcopale pallium, seu omophórion, oppignorari jusserit.


        Tot catholicæ fidei increménta perditissimórum hóminum adeo excitavérunt odia,
        ut, conspiratióne ínita, Christi athletam ad necem quærerent; quam sibi imminére
        ipse in suo ad pópulum sermóne prænuntiávit. Cum ítaque Vitépscum pastoralis
        visitatiónis grátia profectus esset, illi archiepiscopales invadunt ædes, obvios
        quosque feriunt ac cædunt. Tum vir mitíssimus quæréntibus sponte occurrit,
        eosque amice compellans, Filíoli, inquit, quare familiares meos cæditis? Si quid
        contra me habetis, ecce adsum. Hinc, ímpetu facto, eum verbéribus contundunt,
        telis confodiunt, ac demum, immani secúri necátum, in flumen projíciunt, die
        duodecima Novembris anni sexcentésimi vicesimi tertii supra millesimum, ætátis
        ejus quadragesimi tertii. Corpus, mirábili luce circumfusum, ex imo flúminis
        alveo elátum est. Sanguis Mártyris parricidis ipsis in primis prófuit, qui fere
        omnes, cápitis damnati, ejurato schísmate, suum scelus detestáti sunt. Cum
        tantus Præsul plurimis post obitum coruscaret miraculis, eum Urbanus octavus,
        Pontifex maximus, Beatórum honóribus decorávit. Pius nonus, tertio Kalendas
        Julias anni millesimi octingentesimi sexagesimi septimi, cum sæcularia
        Apostolórum Principum solemnia celebraréntur, coram patrum cardinalium senatu,
        simulque astántibus fere quingentis, patriarchis, metropolítis et epíscopis
        cujuscúmque ritus, qui ex toto terrárum orbe convenerant; hunc ecclesiásticæ
        unitátis assertórem, primum ex orientálibus, solemni ritu in Vaticana basilica
        Sanctórum ordini accensuit. Cujus Offícium ac Missam Leo décimus tertius, summus
        Pontifex, ad universam exténdit Ecclésiam.
      en: >-
        Josaphat Kuncewitz was born of noble Catholic parents at Vladimir in Volhynia.
        Once as a child, as he listed to his mother tell the story of the Passion, a
        dart came forth from the side of Christ on the crucifix and wounded the boy in
        the heart. Set on fire with love of God, he devoted himself to prayer and works
        of charity with such zeal that he became the admiration and the model for youths
        far older than he. When Josaphat was twenty years old he was professed among the
        cloistered followers of the monastic rule of Saint Basil. Almost at once he made
        remarkable progress in evangelical perfection. He went barefoot, even in the
        severe winters of that country. He never ate meat, and drank wine only when
        obliged to do so under obedience. He disciplined his body by wearing rough hair-
        shirts until the day of his death. He kept unspotted the flower of chastity
        which in his youth he had dedicated to the Virgin Mother of God. He became so
        celebrated for virtue and learning that despite his youth he was made superior
        of the monastery at Byten, and the Archimandrite of Vilnius. Finally much
        against his will, but to the very great joy of the Catholic people, he was made
        Archbishop of Polotsk.


        In the years following the promotion to this dignity, Josaphat did not relax in
        any way his austere mode of living. Nothing was so close to his heart as service
        to God and the salvation of the flock entrusted to his care. He was a vigorous
        champion of Catholic unity and truth. He laboured to the utmost of his ability
        to win back schismatics and heretics to unity with the See of blessed Peter.
        Both by preaching and writing he defended the Supreme Pontiff and the doctrine
        of the Pope's plenitude of power. He directed these works, full of piety and
        learning against most shameful calumnies and the errors of wicked men. Josaphat
        vindicated episcopal rights and restored ecclesiastical property seized by
        laymen. He won back an incredible number of heretics to the bosom of holy Mother
        Church. How successfully he laboured to re-establish communion between the Greek
        and Latin Churches is told in Papal commendations. He gladly spent the revenues
        set aside for his maintenance to rebuild God's house, to erect convents for
        consecrated virgins, and to carry on other charitable works. So generous was
        Josaphat towards the poor that in one instance when he did not have money enough
        to supply the needs of a certain widow, he pawned his omophorion, that is, his
        episcopal pallium.


        The great progress made by the Catholic faith so stirred up the anger of certain
        of its wicked enemies that they conspired to murder this athlete of Christ. In a
        sermon he foretold to his people what was about to happen. As he was setting out
        for Vitebsk on a pastoral visit, these enemies broke into the episcopal palace,
        attacking and wounding every one they found. Undaunted, this most kindly man
        hurried out to the assassins of his own free will and addressed them mildly. My
        little children, he said, why do ye strike my servants? If ye have any complaint
        against me, I am here. Thereupon they rushed at him, overwhelmed him with blows
        and pierced him through with spears. Finally they slew him a stroke of a great
        axe and threw his body into the river. This happened on November 12th, 1632,
        when he was forty-three years old. Later his body, surrounded by a marvellous
        light, was raised from the deepest part of the river. The blood of this Martyr
        benefited first of all those murderers of their spiritual father. Sentenced to
        die for their crime, almost all abjured their schism and repented of their
        crime. Because this wonderful high priest became famous after his death for many
        miracles, the Supreme Pontiff, Urban VIII, honoured him with the title Blessed.
        On the 29th of June, 1867, during the solemn observance of the centenaries of
        the Princes of the Apostles, in the presence of the college of cardinals, of
        about five hundred others, patriarchs, metropolitans, and bishops of every rite
        from all parts of the world, assembled in the Vatican basilica, with all solemn
        ceremonies, Pius IX canonized the first eastern Christian to uphold the unity of
        the Church. The Supreme Pontiff, Leo XIII, extended his Mass and Office to the
        universal Church.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Joannes 10:11-16", en: "John 10:11-16" }
    text:
      la: >-
        Ego sum pastor bonus. Bonus pastor animam suam dat pro ovibus suis. Mercenarius
        autem, et qui non est pastor, cujus non sunt oves propriae, videt lupum
        venientem, et dimittit oves, et fugit: et lupus rapit, et dispergit oves;
        mercenarius autem fugit, quia mercenarius est, et non pertinet ad eum de ovibus.
        Ego sum pastor bonus: et cognosco meas, et cognoscunt me meae. Sicut novit me
        Pater, et ego agnosco Patrem: et animam meam pono pro ovibus meis. Et alias oves
        habeo, quae non sunt ex hoc ovili: et illas oportet me adducere, et vocem meam
        audient, et fiet unum ovile et unus pastor.
      en: >-
        I am the good shepherd. The good shepherd giveth his life for his sheep. But the
        hireling, and he that is not the shepherd, whose own the sheep are not, seeth
        the wolf coming, and leaveth the sheep, and flieth: and the wolf catcheth, and
        scattereth the sheep: And the hireling flieth, because he is a hireling: and he
        hath no care for the sheep. I am the good shepherd; and I know mine, and mine
        know me. As the Father knoweth me, and I know the Father: and I lay down my life
        for my sheep. And other sheep I have, that are not of this fold: them also I
        must bring, and they shall hear my voice, and there shall be one fold and one
        shepherd.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. John Chrysostom, Patriarch of Constantinople, 59th on John"
    text:
      la: >-
        Magnum quiddam, dilectissimi, magnum, inquam, est Ecclesiæ prælatio, et quæ
        multa indiget sapientia et fortitudine, qualem Christus proposuit: ut animam pro
        ovibus ponamus, et numquam illas deseramus: ut lupo generose resistamus. Hæc
        enim inter pastorem et mercenarium est differentia. Alter propriæ, contemptis
        ovibus: alter, sua contempta, ovium semper saluti invigilat. Pastoris ergo
        exemplo demonstrato, deceptores duos meminit; furem mactantem et rapientem oves;
        et mercenarium permittentem, neque defendentem comissas.


        Quod superiori tempore Ezechiel his verbis insectatus est: Væ pastoribus Israël:
        nonne pascebant semetipsos? nonne greges pascuntur a pastoribus? Sed illi
        contrarium faciebant, quod maximæ malitiæ genus est, et plurimorum causa
        malorum. Idcirco inquit: Neque quod abjectum erat, reducebant: neque quod
        perierat quærebant: neque confractum alligabant: neque infirmum consolidabant:
        quoniam se, non gregem pascebant. Idem et Paulus aliis verbis significat: Omnes
        quæ sua sunt, quærunt, non quæ Jesu Christi.


        Verum ab utroque se dissidere ostendit Christus: ab illis quidem, qui in aliorum
        perniciem veniunt, cum dicat, se propterea venisse, ut vitam haberent et
        abundantius haberent: ab his autem, qui oves a lupis rapi negligebant, dicendo
        se propter eas animam ponere, ne oves perirent. Nam cum Judæi ipsum interimere
        vellent non propterea destitit a doctrina, neque credentes tradidit, sed
        perstitit, et pertulit mortem: ideo frequenter inquit: Ego sum pastor bonus. Quæ
        cum nullo niti testimonio viderentur (quod enim poneret animam suam, non multo
        post re demonstratum est; quod autem vitam haberent et abundantius haberent,
        eventurum erat in futuro sæculo) alterum ab altero confirmat.
      en: >-
        Dearly beloved brethren, the Bishops of the Church hold a great office, an
        office that needeth much that wisdom and strength whereof Christ hath given us
        an example. We must learn of Him to lay down our lives for the sheep and never
        to leave them; and to fight bravely against the wolf. This is the difference
        between the true shepherd and the hireling. The one leaveth the sheep and
        seeketh his own safety, but the other recketh not of his own safety, so as he
        may watch over the sheep. Christ then having given us the pattern of a good
        shepherd, warneth us against two enemies; first, the thief that cometh not but
        to kill and to steal, and, secondly, the hireling that standeth by, and
        defendeth not them that are committed to his charge.


        Ezechiel hath said of old time, (xxxiv. 2): Woe be to the shepherds of Israel!
        do they not feed themselves? Should not the shepherds feed the flocks? But they
        did the contrary, a great wickedness and the root of many evils. Therefore, he
        saith, they brought not back that which was gone astray neither did they search
        for that which was lost neither did they bind up that which was broken, nor
        strengthen that which was sick; for they fed themselves, and not the flock. And
        Paul hath the same in other words, where he saith, (Phil. ii. 21): All seek
        their own, not the things which are Jesus Christ's.


        Christ showeth Himself very different from either the thief or the hireling;
        whereas the thief cometh to destroy, He came that they might have life, and that
        they might have it more abundantly. The hireling fleeth, but He layeth down His
        life for the sheep, that the sheep perish not. When then the Jews went about to
        kill Him, He ceased not to teach He gave not up them that believed in Him, but
        stood steadfast and died. Wherefore He hath good title often to say, I am the
        Good Shepherd. It was but a little while, and He showed us how He could lay down
        His life for the sheep. And if it appeareth not as yet how they have life, and
        have it more abundantly, (but it shall appear, in the world which is to come,)
        we may well be persuaded of the truth of the second promise, who have seen the
        fulfilment of the first.
    status: { la: verified, en: verified }
