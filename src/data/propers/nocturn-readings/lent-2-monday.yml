# Matins Nocturn content for Monday of Lent week 2 — read from
# web/www/horas/{Latin,English}/Tempora/Quad2-1.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad2-1.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# excerpt split only to fill the fixed 3-lesson slot count). Responsory1
# is given directly in this file (not a cross-reference).
id: lent-2-monday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Joh 8:21-29", en: "John 8:21-29" }
    text:
      la: >-
        In illo témpore: Dixit Jesus turbis Judæórum: Ego vado, et quærétis me, et in peccáto vestro
        moriémini. Quo ego vado, vos non potéstis veníre. Dicébant ergo Judǽi: Numquid interfíciet
        semetípsum, quia dixit: Quo ego vado, vos non potéstis veníre? Et dicébat eis: Vos de
        deórsum estis, ego de supérnis sum. Vos de mundo hoc estis, ego non sum de hoc mundo. Dixi
        ergo vobis, quia moriémini in peccátis vestris: si enim non credidéritis, quia ego sum,
        moriémini in peccáto vestro. Dicébant ergo ei: Tu quis es? Dixit eis Jesus: Princípium, qui
        et loquor vobis. Multa habeo de vobis loqui et judicáre. Sed qui me misit, verax est: et ego
        quæ audívi ab eo, hæc loquor in mundo. Et non cognovérunt, quia Patrem ejus dicébat Deum.
        Dixit ergo eis Jesus: Cum exaltavéritis Fílium hóminis, tunc cognoscétis quia ego sum, et a
        meípso fácio nihil: sed, sicut dócuit me Pater, hæc loquor: et qui me misit, mecum est, et
        non relíquit me solum: quia ego, quæ plácita sunt ei, fácio semper.
      en: >-
        At that time, Jesus said to the multitudes of the Jews: "I go, and you will seek Me, and in
        your sin you will die. Where I go you cannot come." The Jews therefore kept saying, "Will
        He kill Himself, since He says, 'Where I go you cannot come'?" And He said to them, "You are
        from below, I am from above. You are of this world, I am not of this world. Therefore I said
        to you that you will die in your sins; for if you do not believe that I am He, you will die
        in your sin." They therefore said to Him, "Who are You?" Jesus said to them, "Why do I speak
        to you at all? I have many things to speak and to judge concerning you; but He Who sent Me
        is true, and the things that I heard from Him, these I speak in the world." And they did not
        understand that He was speaking to them about the Father. Jesus therefore said to them,
        "When you have lifted up the Son of Man, then you will know that I am He, and that of
        Myself I do nothing; but that I preach only what the Father has taught Me. And He Who sent
        Me is with Me; He has not left Me alone, because I do always the things that are pleasing to
        Him."
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Tract 38 on John"
    text:
      la: >-
        Locútus est Dóminus Judǽis, dicens: Ego vado. Christo enim Dómino mors proféctio fuit illo,
        unde vénerat, et unde non discésserat. Ego, inquit, vado, et quærétis me, non desidério, sed
        ódio. Nam illum póstea quam abscéssit ab óculis hóminum, inquisiérunt et qui óderant, et qui
        amábant: illi persequéndo, isti habére cupiéndo. In Psalmis ait ipse Dóminus per Prophétam:
        Périit fuga a me, et non est qui requírat ánimam meam. Et íterum ait álio loco in Psalmo:
        Confundántur et revereántur requiréntes ánimam meam.


        Culpávit, qui non requírerent: damnávit requiréntes. Bonum est enim quǽrere ánimam Christi,
        sed quo modo eam quæsiérunt discípuli: et malum est quǽrere ánimam Christi, sed quo modo eam
        Judǽi quæsiérunt: illi enim ut habérent, isti ut pérderent. Dénique istis, quia sic
        quærébant more malo, corde pervérso, quid secutus adjúnxit? Quærétis me; et ne putétis, quia
        bene me quærétis, in peccáto vestro moriémini. Hoc est Christum male quǽrere, in peccáto suo
        mori: hoc est illum odísse, per quem possit solum salvus esse.


        Cum enim hómines, quorum spes in Deo est, non débeant mala réddere nec pro malis; reddébant
        isti mala pro bonis. Prænuntiávit ergo illis Dóminus, dixítque senténtiam prǽscius, quod in
        suo peccáto moreréntur. Deínde adjúnxit: Quo ego vado, vos non potéstis veníre. Hoc et
        discípulis suis álio loco dixit: nec tamen eis dixit: In peccáto vestro moriémini. Quid
        autem dixit? quod et istis: Quo ego vado, vos non potéstis veníre. Non ábstulit spem, sed
        prædíxit dilatiónem. Quando enim hoc discípulis Dóminus loquebátur, tunc non póterant
        veníre, quo ille ibat, sed póstea ventúri erant: isti autem nunquam, quibus prǽscius dixit,
        In peccáto vestro moriémini.
      en: >-
        The Lord spake unto the Jews, saying: "I go My way," for, to the Lord Christ, death was a
        departure to that place whence He had come, and whence He had never departed. "I go My
        way," saith He, "and ye shall seek Me" not from love, but from hatred. Yea after He had
        withdrawn Himself from the sight of men, two classes sought Him, even they that loved, and
        they that hated Him; the one because they longed for His presence, the other because they
        were fain to hunt Him down. In the Psalms the Lord Himself saith by His Prophet, "Refuge
        failed me, and no man cared for my soul." And again He said in another Psalm, "Let them be
        confounded and put to shame that seek after my soul."


        Thus doth He blame them that seek not, and condemn such as seek. Yea, it is a good thing to
        seek the soul of Christ, as the disciples sought it; and an evil thing to seek it, as the
        Jews sought it; the first sought it to possess, the second to destroy it. What then doth He
        bid us know will be the reward of such as seek it evilly in a perverse heart? "Ye shall seek
        Me," and lest ye think that ye shall do well so to seek Me, "I tell you that ye shall die in
        your sins." To seek Christ with bad intent, is as much as to die in sin, for it is to hate
        Him through Whom alone we can be saved.


        Whereas men whose hope is in God ought to return good even for evil, those men returned evil
        for good. The Lord therefore told them beforehand, and, because He knew it, He let them know
        their coming end, how that they should die in their sins. Then He said farther, "Whither I
        go, ye cannot come." This He said in another place to His disciples, but He never said to
        them, "Ye shall die in your sins." What said He? The same words as to the Jews, "Whither I
        go, ye cannot come." Yet, to the disciples, these words only deferred, they cut not away
        hope, for they, though for a little while they could not come whither He was to go, were yet
        in the end to go there. Not so they, to whom He foretold and said, "Ye shall die in your
        sins."
    responsory:
      la: "R. Dum iret Jacob de Bersabée, et pérgeret Haram, locútus est ei Dóminus, dicens: * Terram, in qua dormis, tibi dabo, et sémini tuo.\nV. Ædificávit ex lapídibus altáre in honórem Dómini, fundens óleum désuper: et benedíxit eum Deus, dicens.\nR. Terram, in qua dormis, tibi dabo, et sémini tuo."
      en: "R. While as Jacob went from Beersheba, and hasted unto Haran, the Lord spake unto him, saying: * The land whereon thou sleepest, to thee will I give it, and to thy seed.\nV. He built an altar of stones unto the Name of the Lord, and poured oil upon the top of it; and God blessed him and said.\nR. The land whereon thou sleepest, to thee will I give it, and to thy seed."
    status: { la: verified, en: verified }
