# Matins Nocturn 2 reading for St. Pius I, Pope, Martyr (Jul 11). No
# genuine SanctiM match: the only SanctiM files for this date,
# `SanctiM/07-11M.txt`/`07-11b.txt`, both belong to the Octave of St.
# Benedict (Jul 11-18 is the Monastic calendar's own octave of its
# patron's Mar 21 feast) — a missed pre-1955-pool candidate rather
# than a genuine SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-11.txt, English/Sancti/07-11.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-pius-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Pius, hujus nóminis primus, Aquilejénsis, Ruffini fílius, ex presbytero sanctæ Romanæ
        Ecclésiæ Summus Pontifex creátus est, Antonino Pio et Marco Aurelio imperatóribus
        augustis. Quinque ordinatiónibus, mense Decembri, episcopos duódecim, octódecim
        presbyteros creávit. Exstant nonnulla ab eo præcláre instituta, præsertim ut
        Resurréctio Dómini nónnisi die Dominico celebrarétur. Pudentis domum in ecclésiam
        mutávit, eamque ob præstantiam supra ceteros titulos, útpote Romani Pontificis
        mansiónem, título Pastoris dicávit; et in qua sæpe rem sacram fecit, et multos ad fidem
        conversos baptizávit ac in fidelium númerum adscripsit. Dum vero boni pastoris munus
        obiret, fuso pro suis ovibus et summo pastore Christo sánguine, martyrio coronátus est
        quinto Idus Julii, ac sepúltus in Vaticano.
      en: >-
        Pius I., the son of Rufinus, was from Aquilia, and was a Priest of the holy Roman
        Church when he was made Supreme Pontiff, he lived under the Emperors Antoninus Pius and
        Marcus Aurelius, he held five ordinations in the month of December, wherein he ordained
        twelve Bishops and eighteen Priests. There remain several eminent ordinances of his,
        notably that which ruleth that the Resurrection of the Lord be not observed upon any day
        of the week save the Lord's Day. He turned the house of Pudens into a church, and on
        account of its eminence above the other churches, as being that where the Bishop of Rome
        dwelt, he dedicated it under the name of the Shepherd. Here he often celebrated, and
        baptized and numbered among the faithful many converts to the faith. While he strove to do
        the work of a good shepherd he shed his blood for his sheep, and for the chief Shepherd
        Christ. He was crowned with martyrdom upon the 11th day of July, and buried upon the
        Vatican Hill.
    status: { la: verified, en: verified }
