# Matins Nocturn 2 reading for Ss. Odo, Maiolus, Odilo, and Hugh, Abbots of
# Cluny (Apr 29). Sourced from web/www/horas/Latin/SanctiM/04-29M.txt's
# only lesson, [Lectio4] -- an excerpt from St. Peter Damian's epistle to
# St. Hugh praising the Cluniac monastery, not a biographical vita of the
# four abbots individually (the file carries no other Lectio; its
# [MM Capitulum] block immediately follows with a Common cross-reference,
# confirming this is genuinely the only proper lesson). No English exists
# in the source at all -- the translation below is this project's own,
# marked draft.
id: ss-odo-maiolus-odilo-and-hugh-of-cluny
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Ex Epístola sancti Petri Damiáni Epíscopi ad sanctum Hugónem Abbátem. Quid áliud
        Cluniacénse monastérium, nisi agrum Dómini plenum díxerim, ubi velut acérvus est
        cæléstium ségetum, chorus tot in caritáte degéntium monachórum? Ager ille cotidiáno
        sanctæ prædicatiónis ligóne proscindítur, et in eo cæléstis elóquii sémina
        conspergúntur. Illic spirituálium frugum provéntus aggéritur, ut hórreis póstmodum
        cæléstibus inferátur. Cluniácus prætérea ager spirituális quidam campus est, ubi
        cælum et terra congréditur, ac velut aréna certáminis, ubi spirituális more
        palǽstræ caro frágilis advérsus potestátes aéreas colluctátur. Non est enim nobis
        colluctátio advérsus carnem et sánguinem, sed advérsus mundi rectóres tenebrárum
        harum, contra spirituália nequítiæ, in cæléstibus. Illic Jósue, non ille fílius
        Nun, sed cæléstis ductor exércitus, et qui spirituálium instrúctor est bellatórum,
        suos édocet mílites, supérbas quinque regum calcáre cervíces: super quos nimírum
        triumphálem noscúntur obtinére victóriam, qui tótidem sensus córporum per
        distríctæ custódiæ cóhibent disciplínam.
      en: >-
        From the Epistle of St. Peter Damian, Bishop, to St. Hugh, Abbot. What else should I
        call the monastery of Cluny but a full field of the Lord, where there is, as it were,
        a heap of heavenly harvest, a choir of so many monks living together in charity? That
        field is daily broken up by the plough of holy preaching, and in it the seeds of
        heavenly eloquence are scattered. There the increase of spiritual fruits is gathered
        together, that it may afterward be carried into the heavenly barns. Cluny, moreover,
        is a certain spiritual field, where heaven and earth meet, and, as it were, an arena
        of combat, where, after the manner of a spiritual wrestling-ground, the frail flesh
        wrestles against the powers of the air. For we wrestle not against flesh and blood,
        but against the rulers of this world of darkness, against spiritual wickedness in
        high places. There Joshua — not the son of Nun, but the heavenly leader of the host,
        and the instructor of spiritual warriors — teaches his soldiers to trample down the
        proud necks of the five kings; for those, indeed, are known to win the triumphant
        victory over them who restrain the five senses of the body under the discipline of
        strict watchfulness.
    status: { la: verified, en: draft }
