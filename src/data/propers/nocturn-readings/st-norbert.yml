# Matins Nocturn 2 reading for St. Norbert, Bishop and Confessor
# (June 6). Sourced directly from web/www/horas/Latin/Sancti/06-06.txt,
# English/Sancti/06-06.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (his `[Rule]` is `vide
# C4`) -- defers to the Common of a Confessor Bishop's own Nocturn 3,
# not transcribed here.
id: st-norbert
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Norbértus, nobilíssimis paréntibus natus, adoléscens liberálibus disciplínis
        erudítus, in ipsa póstea imperatóris aula, spretis mundi illécebris,
        ecclesiásticæ milítiæ adscríbi vóluit. Sacris initiátus, rejéctis móllibus ac
        spléndidis véstibus, pellícea melóte indútus, prædicatióni verbi Dei se totum
        dedit. Abdicátis ecclesiásticis provéntibus satis amplis, et património in
        páuperes erogáto, semel in die sub vésperam solo cibo quadragesimáli utens,
        nudísque pédibus et lácera veste sub brumáli rigóre incédens, miræ
        austeritátis vitam est aggréssus. Potens ígitur ópere et sermóne, innúmeros
        hæréticos ad fidem, peccatóres ad pœniténtiam, dissidéntes ad pacem et
        concórdiam revocávit.


        Cum Laudúni esset, ab epíscopo rogátus ne a sua diœcési discéderet, desértum
        in ea locum, qui Præmonstrátus dicebátur, sibi delégit; ibíque, trédecim
        sóciis aggregátis, Præmonstraténsem órdinem instítuit, divínitus accépta per
        visum régula a sancto Augustíno. Cum vero ejus fama sanctitátis in dies magis
        augerétur, ac plúrimi ad eum quotídie discípuli convenírent, idem ordo ab
        Honório secúndo aliísque summis Pontifícibus confirmátus, ac plúribus ab eo
        monastériis ædificátis, mirífice propagátus est.


        Antvérpiam accersítus, in ea urbe Tanchelíni nefáriam hæresim profligávit.
        Prophético spíritu et miráculis cláruit. Archiepíscopus tandem (licet
        relúctans) Magdeburgénsis creátus, ecclesiásticam disciplínam, præsértim
        cælibátum, constánter propugnávit. Rhemis in concílio Innocéntium secúndum
        egrégie adjúvit, et Romam cum áliis epíscopis proféctus, schisma Petri Leónis
        compréssit. Postrémo vir Dei, méritis et Spíritu Sancto plenus, Magdebúrgi
        obdormívit in Dómino, anno salútis millésimo centésimo trigésimo quarto, die
        sexta Júnii.
      en: >-
        Norbert, born in the year 1080 of parents of the highest rank, thoroughly
        educated in his youth in worldly knowledge, and a member of the Imperial
        court, turned his back upon the glory of the world, and chose rather to enlist
        himself as a soldier of the Church. Being ordained Priest, he laid aside all
        soft and showy raiment, clad himself in a coat of skins, and made the
        preaching of the Word of God the one object of his life. He had the right to
        rich revenues of the Church but these he renounced, and to an ample fortune
        from his father; but this he gave to the poor. He ate only once a day, and that
        in the evening, and then his meal was of the fare of Lent. His life was one of
        singular hardness, and he was used even in the depth of winter to go out with
        bare feet and ragged garments. Hence came that mighty power of his words and
        deeds, whereby he was enabled to turn countless heretics to the true faith,
        sinners to repentance, and enemies to peace and brotherly love.


        Being one while at Laon, the Bishop besought him not to leave his diocese, and
        he therefore made choice of a wilderness at the place called Prémontré,
        whither he withdrew himself with thirteen disciples, and thus founded the
        Order of the Praemonstratensian Canons, whereof he, by the will of God,
        received the Rule, in a vision, from St. Augustine. When, however, the fame of
        his holy life became every day more and more noised abroad, and great numbers
        sought to become his disciples, and the Order had been approved by Honorius
        II, and other Popes, many more monasteries were built by him, and the
        Institute wonderfully extended.


        Being called to Antwerpen, he there gave the death-blow to the shameful heresy
        of Tanchelm. He was remarkable for the spirit of prophecy and for the gift of
        miracles. He was created (albeit he would rather not have had it so)
        Archbishop of Magdeburg, and as such he was a strong upholder of the discipline
        of the Church, especially contending against the marriage of the clergy. At a
        Council held at Reims he was a great help to Innocent II, and went with some
        Other Bishops to Rome, where they stamped out the schism of Peter Leoni. It was
        at last at Magdeburg that this man of God, full of good works and of the Holy
        Ghost, fell asleep in the Lord, on the 6th day of June, in the year of
        salvation 1134.
    status: { la: verified, en: verified }
