# Matins Nocturn 2 and 3 readings for the Holy Shroud (Friday of Lent 2).
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt.
# Nocturn 2: Lectio4-6, St. Ambrose on Luke 23 (the burial of Christ by Joseph and
# Nicodemus), combined into one reading, its closing responsory the source's
# Responsory6. Nocturn 3: the Gospel (Mark 15:42-46, the source's Mass Gospel) and
# then the Venerable Bede's homily on it (Lectio7 after the incipit, and Lectio8),
# its closing responsory the source's Responsory8. Nocturn 1 (Lectio1-3) is not
# carried: continua's first nocturn runs the Scripture course.
#
# Latin: "litique" corrected to "utique" (Lectio4); "m6rito", "p6terat" and the like
# (a digit 6 for an accented o) corrected silently. Everything else is verbatim.
# The English is this project's own translation, marked draft.
id: holy-shroud
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Ambrose, Commentary on Luke, Bk. 10, on ch. 23"
    text:
      la: |
          Quid sibi vult quod non Apóstoli, sed Joseph et Nicodemus, ut Joánnes dicit, Christum sepeliunt? Unus justus et constans, alter qui erat magíster in Israël. Talis enim Christi est sepultúra, quæ justítiam magisteriumque hábeat. Obstruitur ígitur tergiversandi locus, et domestico Judǽi testimónio revincuntur. Nam si Apóstoli sepelissent, dícerent utique non sepúltum, quem sepúltum raptum esse dixérunt. Justus autem Christi corpus óperit sindone, ínnocens ungit unguénto. Namque hæc non otiose distincta reperimus, quia justítia vestit Ecclésiam, innocéntia grátiam subministrat.

          Vesti ergo et tu Dómini corpus glória sua, ut et ipse sis justus. Et si mórtuum credis, óperi tamen divinitátis própriæ plenitudine. Unge illud myrrha et alœ, ut bonus odor Christi sis. Bonum linteum misit Joseph ille vir justus, et fortásse illud quod Petrus vidit e cœlo ad se esse demissum, in quo erant génera quadrupedum, et ferarum, et volucrum ad similitúdinem Gentílium figurata. Mystico ígitur unguénto illo pistico consepelitur Ecclésia, quæ diversitatem populórum fídei suæ communióne sociavit.

          Hunc Joseph justum Lucas dixit, Matthǽus divitem. Et mérito dives hoc loco dícitur, ubi corpus suscipit Christi: suscipiendo enim divitem, nescivit fídei paupertátem. Dives est ergo qui justus est. Justus ígitur sindone involvit; Israëlita vero et diversos miscet virtútum odores, et alœs mittit quasi libras centum, hoc est, perfectæ fídei quantitatem. Et ligaverunt corpus Jesu juxta consuetúdinem specialem Judæórum: non utique nodis perfidiæ, sed fídei ligaturis; et posuérunt in horto, cui frequénter Ecclésia comparátur, quæ diversorum habet poma meritórum, floresque virtútum.
      en: |
          What is the meaning of this, that not the Apostles, but Joseph and Nicodemus, as John says, bury Christ? One just and steadfast, the other a master in Israel. For such is the burial of Christ, that it should have justice and teaching. The room for evasion is therefore closed, and they are refuted by the domestic testimony of a Jew. For if the Apostles had buried him, they would of course have said that he had not been buried, whom they said, though buried, had been stolen away. But the just man covers the body of Christ with linen; the innocent man anoints it with ointment. For we do not find that these things are distinguished idly: justice clothes the Church, innocence supplies grace.

          Do thou also, therefore, clothe the body of the Lord with his own glory, that thou thyself mayest be just. And if thou believest him dead, yet cover him with the fullness of his own divinity. Anoint him with myrrh and aloes, that thou mayest be the good odour of Christ. That just man Joseph sent a good linen cloth, and perhaps that which Peter saw let down to him from heaven, in which were kinds of four-footed beasts, and wild beasts, and fowls, figured after the likeness of the Gentiles. With that mystical ointment of spikenard, therefore, the Church is buried together with him, which joined the diversity of peoples in the communion of its faith.

          Luke called this Joseph just; Matthew, rich. And rightly is he called rich in this place, where he receives the body of Christ: for in receiving the Rich One he knew nothing of poverty of faith. He is rich, then, who is just. The just man therefore wraps in the linen; the Israelite mingles besides the various odours of virtues, and puts in aloes, about a hundred pounds, that is, the measure of perfect faith. And they bound the body of Jesus according to the special custom of the Jews: surely not with the knots of unbelief, but with the bonds of faith; and they laid him in a garden, to which the Church is often compared, which has the fruits of various merits and the flowers of virtues.
    responsory:
      la: |
          R. Christus passus est pro nobis, vobis relínquens exémplum, ut sequámini vestígia ejus: * Qui peccátum non fecit, nec invéntus est dolus in ore ejus.
          V. Qui cum malediceretur, non maledicebat; cum pateretur, non comminabatur.
          R. Qui peccátum non fecit, nec invéntus est dolus in ore ejus.
      en: |
          R. Christ suffered for us, leaving you an example that you should follow his steps: * Who did no sin, neither was guile found in his mouth.
          V. Who, when he was reviled, did not revile; when he suffered, he threatened not.
          R. Who did no sin, neither was guile found in his mouth.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: true
    citation:
      la: "Marc 15:42-46"
      en: "Mark 15:42-46"
    text:
      la: "In illo témpore: Cum jam sero esset factum (quia erat Parascéve, quod est ante sábbatum) venit Joseph ab Arimathǽa, nóbilis decúrio, qui et ipse erat exspéctans regnum Dei, et audácter introívit ad Pilátum, et pétiit corpus Jesu. Pilátus autem mirabátur, si jam obiísset. Et, accersíto centurióne, interrogávit eum, si jam mórtuus esset. Et cum cognovísset a centurióne, donávit corpus Joseph. Joseph autem mercátus síndonem, et depónens eum invólvit sindóne, et pósuit eum in monuménto, quod erat excísum de petra, et advólvit lápidem ad óstium monuménti."
      en: "At that time: When evening was now come (because it was the Parasceve, that is, the day before the sabbath), Joseph of Arimathea, a noble counsellor, who also himself was looking for the kingdom of God, came and went in boldly to Pilate, and begged the body of Jesus. But Pilate wondered that he should be already dead. And sending for the centurion, he asked him if he were already dead. And when he had understood it by the centurion, he gave the body of Jesus. And Joseph, buying fine linen, and taking him down, wrapped him up in the fine linen, and laid him in a sepulchre which was hewn out of a rock. And he rolled a stone to the door of the sepulchre."
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: false
    source: "The Venerable Bede, Homily for Tuesday of Holy Week"
    text:
      la: |
          Parascéve græce, latíne præparátio dícitur, quo nómine Judǽi, qui inter Græcos morabantur, sextam sábbati appellabant, eo quod in illa ea, quæ requiéi sábbati necessaria essent, præparare solerent; juxta hoc quod de manna quondam præcéptum est: Sexta autem die colligetis duplum. Quia ergo sexta die factus est homo, et tota est mundi creatúra perfécta; séptima autem conditor ab ópere suo requievit, unde et hanc, sabbatum, hoc est, réquiem vóluit appellári: recte Salvátor eádem sexta die crucifíxus humánæ restaurationis implévit arcánum; ideaque, cum accepísset acetum, dixit: Consummatum est; hoc est, sextæ diéi, quod pro mundi refectione suscepi, jam totum est opus expletum. Sábbato autem in sepulchro requiescens, resurrectiónis, quæ octáva die ventúra erat, exspectabat eventum.

          Venit, inquit, Joseph ab Arimathæa, nóbilis decurio, qui et ipse erat exspéctans regnum Dei, et audacter introívit ad Pilátum, et pétiit corpus Jesu. Magnæ quidem Joseph iste dignitátis ad sǽculum, sed majóris apud Deum mériti fuísse laudátur. Talem namque exsistere decebat eum, qui corpus Dómini sepelíret, qui et per justítiam meritórum tali ministério dignus esset, et per nobilitátem poténtiæ sæcularis facultátem posset obtinere ministrándi; non enim quilibet ignótus aut mediocris ad prǽsidem accedere, et crucifíxi corpus póterat impetrare.
      en: |
          Parasceve in Greek is called preparation in Latin, by which name the Jews who dwelt among the Greeks called the sixth day of the week, because on it they were wont to prepare what was necessary for the rest of the sabbath; according to what was once commanded about the manna: But on the sixth day you shall gather double. Because, then, on the sixth day man was made and the whole creation of the world was perfected, and on the seventh the Creator rested from his work, whence he willed that day also to be called the sabbath, that is, rest: rightly the Saviour, crucified on that same sixth day, fulfilled the mystery of human restoration; and therefore, when he had received the vinegar, he said: It is consummated; that is, of the sixth day, the work which I undertook for the remaking of the world is now wholly completed. And resting on the sabbath in the sepulchre, he awaited the event of the resurrection, which was to come on the eighth day.

          Joseph, he says, came from Arimathea, a noble counsellor, who also himself was looking for the kingdom of God, and boldly went in to Pilate, and begged the body of Jesus. This Joseph is indeed praised as one of great dignity in the world, but of greater merit before God. For it was fitting that he should be such who was to bury the body of the Lord: one who by the justice of his merits was worthy of such a ministry, and who by the nobility of worldly power could obtain the means of serving; for not just anyone, unknown or ordinary, could approach the governor and obtain the body of the crucified.
    responsory:
      la: |
          R. Hæc est sindon digníssima, * In qua salútis auctor de cruce depósitus involvi dignátus est.
          V. Ut nos consepúlti cum eo, veteris hóminis exuviis depositis, innocéntiæ sindone tegeremur.
          R. In qua salútis auctor de cruce depósitus involvi dignátus est.
      en: |
          R. This is the most worthy shroud, * In which the author of salvation, taken down from the cross, deigned to be wrapped.
          V. That we, buried together with him, having laid aside the spoils of the old man, might be covered with the shroud of innocence.
          R. In which the author of salvation, taken down from the cross, deigned to be wrapped.
    status: { la: verified, en: draft }
