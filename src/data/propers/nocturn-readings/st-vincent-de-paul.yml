# Matins Nocturn 2 reading for St. Vincent de Paul, Confessor (July 19).
# Sourced directly from web/www/horas/Latin/Sancti/07-19.txt,
# English/Sancti/07-19.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (a direct
# `@Commune/C1a:LectioN` cross-reference) -- not transcribed, per the
# bare-cross-reference convention.
id: st-vincent-de-paul
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Vincentius a Paulo, natióne Gallus, Podii non procul ab Aquis Tarbellis in
        Aquitánia natus, jam tum a púero exímiam in páuperes caritátem præ se
        tulit. A custódia paterni gregis ad litteras evocatus, humanas Aquis,
        divinas cum Tolosæ, tum Cæsaraugustæ didicit. Sacerdotio initiátus ac
        theologíæ laurea insignítus, in Turcas íncidit, qui captivum in Africam
        abduxérunt. Sed in captivitáte positus herum ipsum Christo rursus
        lucrifecit. Cum eo ígitur ex bárbaris oris, opitulante Deípara, sese
        prorípiens, ad apostolica limina iter instituit. Unde in Gálliam
        reversus, Clippíaci primum, mox Castelliónis parœcias sanctíssime rexit.
        Renuntiátus a rege primarius Sacrórum miníster in Galliæ trirémibus,
        mirum quo zelo et ducum et rémigum salúti operam posúerit. Moniálibus
        Visitatiónis a sancto Francisco Salesio præpositus, tanta prudéntia per
        annos circiter quadragínta eam curam sustinuit, ut maxime comprobaverit
        judícium sanctíssimi præsulis, qui sacerdotem Vincentio digniórem nullum
        se nosse fatebátur.


        Evangelizandis paupéribus, præsertim rurícolis, ad decrépitam usque
        ætátem indeféssus incúbuit, eique apostolico operi tum se, tum alumnos
        congregatiónis, quam sub nómine Presbyterórum sæculárium Missiónis
        instituit, perpetuo voto a sancta Sede confírmato, speciatim
        obstrinxit. Quantum autem augendæ cleri disciplinæ allaboraverit,
        testántur erecta majórum clericórum seminaria, collatiónum de divinis
        inter sacerdótes frequéntia, et sacræ ordinatióni præmittenda
        exercítia. Insuper, ad amplificandam fidem et pietátem, evangelicos
        misit operarios, non in solas Galliæ provincias, sed et in Italiam,
        Polóniam, Scotiam, Hiberniam, atque ad Bárbaros et Indos. Ipse vero,
        vita functo Ludovíco décimo tertio, cui moriénti hortator ástitit, a
        regína Anna Austríaca, matre Ludovíci décimi quarti, in sanctius
        concílium accítus, studiosíssime egit, ut nónnisi digniores ecclésiis
        ac monastériis præficeréntur; civiles discordiæ, singularia certamina,
        serpéntes erróres, quos simul sensit et exhorruit, amputaréntur;
        debítaque judíciis apostolicis obediéntia præstarétur ab ómnibus.


        Nullum fuit calamitátis genus, cui paterne non occúrrerit. Fideles sub
        Turcárum jugo geméntes, infántes expósitos, júvenes díscolos, vírgines
        periclitántes, moniáles dispérsas, mulieres lapsas, ad trirémes
        damnatos, peregrinos infirmos, artífices inválidos, ipsosque mente
        captos, ac innúmeros mendícos subsidiis et hospitiis etiamnum
        superstítibus excepit ac pie fovit. Lotharingiam, Campaniam, Picardiam,
        aliasque regiónes peste, fame, belloque vastatas, prolixe refécit.
        Plurima ad perquirendos et sublevándos míseros sodalítia fundávit,
        inter quæ celebris matronárum cœtus, et late diffúsa sub nómine
        Caritátis puellárum socíetas. Corporis demum afflictatióne, labóribus,
        senioque attritus, die vigesima septima Septembris, anno salútis supra
        millesimum sexcentésimo sexagesimo, ætátis suæ octogesimo quinto,
        Parísiis, in domo sancti Lázari, quæ caput est congregatiónis
        Missiónis, plácide obdormívit; quem, virtútibus, meritis ac miraculis
        clarum, Clemens duodecimus inter Sanctos rétulit.
      en: >-
        Vincent de Paul was a Frenchman by nation, and was born at Puy, not far
        from Dax in Gascony. From a little child he showed remarkable charity
        towards the poor. His father removed him from keeping his cattle, in
        order to give him a school education, and he learnt earthly things at
        Dax, and theology both at Toulouse and at Saragossa. He took Priest's
        orders, and a degree in Divinity. He was taken prisoner by Mahommedan
        pirates, who carried him off, and sold him for a slave in Africa. In his
        slavery he converted his owner, who was an apostate, back to Christ.
        Under the protection of the Mother of God, Vincent escaped from Barbary.
        He first visited the thresholds of the Apostles, and afterwards returned
        to France. He was the saintly Rector first of the Parish of Clichy, and
        afterwards of that of Chatillon. He was appointed by the King, Chaplain
        General for the galleys of France, and worked with extraordinary zeal
        for the health of the souls both of those who commanded and of the
        convicts who rowed. He was made Superior of the Nuns of the Visitation
        by St. Francis de Sales, and discharged this duty for about forty years,
        with a wisdom which so approved itself to the judgment of their holy
        Founder, that he was used to say he knew no worthier Priest than
        Vincent.


        The preaching of the Gospel to the poor, especially peasants, was the
        work at which he toiled unweariedly, till he was disabled by age. To
        this special work he bound himself and the members of the Congregation
        which he founded under the missionary Congregation of Secular Priests,
        by a perpetual vow approved by the Holy See. How great were his labours
        for bettering the discipline of the clergy, is attested by the building
        of Seminaries for the final education of young clerks, the number of
        meetings of Priests to discuss holy things, and the religious exercises
        preparatory to Ordination. To spread wider the growth of faith and
        godliness, he sent his Gospel labourers not only into the several
        provinces of France, but also into Italy, Poland, Scotland, and
        Ireland, and also to Barbary and India. He assisted Lewis XIII on his
        death-bed, and the Queen Anne of Austria, mother of Lewis XIV, put him
        upon the young King's Council of Conscience during the Regency, in
        which position it was his unceasing effort that none but the most
        worthy should be named to churches and monasteries, that civil
        contests, duels, and creeping false doctrines should be put down, and
        that all men should yield the obedience which was due to the decisions
        of the Apostolic See.


        There was no kind of misery which he did not strive with fatherly
        tenderness to relieve. Christians groaning in Mahommedan slavery,
        foundlings, deformed children, young maidens exposed to danger,
        houseless nuns, fallen women, convicts sent to the galleys, sick
        foreigners, disabled workmen, lunatics, and beggars without number, all
        these he relieved, and devoutly housed in diverse charitable
        institutions which remain to this day. When Lorraine, Champagne,
        Picardy, and other districts were desolated by plague, famine, and war,
        he made immense efforts for their relief. He founded many charitable
        societies, to find out and succour the unfortunate. Among these are
        remarkable that of Matrons, and that of Sisters of Charity which hath
        been so widely spread. With a body worn out with hardships, work, and
        old age, he gently fell asleep in the house of St. Lazarus at Paris,
        the chief house of the Congregation of the Missions, upon the 27th day
        of September, in the year of salvation 1660, and of his own age the
        85th. He was famous on account of his life, his works, and his
        miracles, and Clement XII inscribed his name among those of the
        saints.
