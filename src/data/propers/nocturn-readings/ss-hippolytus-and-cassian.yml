# Matins reading for Ss. Hippolytus and Cassian, Martyrs (Aug 13).
# Sourced directly from web/www/horas/Latin/Sancti/08-13.txt,
# English/Sancti/08-13.txt. Single simplex-feast lesson (Lectio93),
# one continuous account covering both martyrs, pooled into the
# nocturn: 2 slot per the established vigil/simplex convention (see
# vigil-of-st-lawrence.yml's own note).
id: ss-hippolytus-and-cassian
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Hippolytus, a sancto Lauréntio baptizatus, domi suæ, dum Eucharistiam
        sumeret, comprehénsus, et ad Valerianum imperatórem adductus, ab eo de
        suæ religiónis professióne interrogátus, líbere se Christianum proféssus
        est. Quam ob rem fustibus cæditur; quibus in verbéribus cum ejus fides
        constantior invenirétur, munéribus et honórum promissis tentátur. Quæ
        cum ómnia frustra diceréntur, præfecto occidendus traditur. Qui, domum
        Hippolyti veniens, ut ejus facultates publicaret, totam familiam
        christianam esse cognoscit; atque, iis a christiana fide frustra
        deterritis, primum plumbátis cæsa Concordia, Hippolyti nutríce, quæ
        ceteros confirmábat, réliquos extra portam Tiburtinam occídi jubet.
        Hippolytus, indómitis equis raptátus per loca tríbulis et cárduis
        cónsita, lacerato corpore, spíritum Deo réddidit, unáque cum réliquis a
        Justino presbytero ad agrum Veranum sepúltus est. Eadem die, ad Forum
        Syllæ, crudelíssimo supplicio afféctus est Cassianus Martyr; qui,
        vinctis post terga mánibus, puerórum, quos erudiebat, férreis stylis
        configendus excarnificandúsque traditur. Quorum quanto erat infirmior
        vis, tanto ejus pœna martyrii gravior ac diuturnior, pálmaque
        illustrior.
      en: >-
        Hippolytus was one of those baptized by St. Lawrence. He was arrested in
        his own house while he was taking the Holy Communion. He was brought
        before the Emperor Valerian, and, when he was asked by him touching his
        religious profession, he freely confessed that he was a Christian.
        Wherefore he was beaten with clubs, but when his faith was found only
        the bolder under the blows, he was tempted with promises of gifts and
        honours. Then when words were found only to be thrown away upon him, he
        was given over to the Prefect to be put to death. The Praefect went to
        the house of Hippolytus to take possession of his goods, and there
        found that all the household were Christians. He strove in vain to awe
        them into the denial of their faith, and then ordered Concordia, the
        nurse of Hippolytus, who was encouraging the rest, to be beaten to
        death with whips loaded with lead, and afterwards the others to be
        slain outside the gate that leadeth toward Tivoli. Hippolytus was tied
        to wild horses which dragged him through rough places full of briars
        and thistles, until with a mangled body he resigned his soul to God.
        Justin the Priest buried him along with the others. On the same day,
        at Imola, the martyr Cassian was put to a most cruel death. He was a
        schoolmaster, and was given up to his scholars, with his hands bound
        behind his back, to be stabbed and torn to death with steel pens.
        Owing to the weakness of the means, the suffering of his martyrdom was
        very grievous and long, and his palm all the more glorious.
    status: { la: verified, en: verified }
