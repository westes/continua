# Matins Nocturn 2 reading for St. Juliana Falconieri, Virgin (Jun 19).
# Sourced directly from web/www/horas/Latin/Sancti/06-19.txt,
# English/Sancti/06-19.txt. Lectio4-6 combined into one reading, one
# continuous vita -- same combining convention st-rose-of-lima.yml/
# st-ephraim-of-syria.yml use. No Lectio7-9 of her own in the source
# (`[Rule]` is `vide C6a`) -- defers to the Common of a Virgin's own
# Nocturn 3, not transcribed here. (The source's own Lectio94, a shorter
# 1-lesson variant of the same biography, is an alternate not used here.
# The source's proper Hymnus Vespera/Matutinum, "Cæléstis Agni núptias",
# is not modeled -- see st-juliana-falconieri.yml's own comment.)
id: st-juliana-falconieri
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Juliana, ex nobili Falconéria família, Claríssimo patre, qui templum Deiparæ ab
        Angelo salutátæ ære suo magnifice a fundamentis Floréntiæ, ut nunc visitur, eréxit,
        matre Reguardata, ambóbus jam senescéntibus ac ad id tempus sterílibus, nata est
        anno millesimo ducentésimo septuagesimo. Ab incunabulis non éxiguum futuræ
        sanctitátis specimen dedit; vagiéntibus quippe labris, suavíssima Jesu et Maríæ
        nómina ultro proferre audíta est. Puerítiam postmodum ingressa totam se christiánis
        virtútibus mancipávit, in quibus adeo excelluit, ut beátus Aléxius patruus, cujus
        institútis ac exemplis instruebátur, matri dicere non dubitaverit, ipsam non
        feminam peperisse, sed angelum. Nam ita modesto vultu animoque ab omni vel
        levíssima erroris macula pura fuit, ut óculos numquam in toto vitæ cursu ad hóminis
        fáciem intuéndam erexerit, auditoque peccáti vocabulo contremúerit. Expleto nondum
        décimo quinto ætátis suæ anno, re familiari, licet opulenta, terrenisque posthabitis
        nuptiis, Deo virginitátem in mánibus divi Philippi Benitii solemniter vovit, ab eoque
        ómnium prima religiósum Mantellatárum habitum, ut dicunt, sumpsit.


        Julianæ exemplum secutæ sunt plurimæ ex nobilióribus familiis feminæ, ac mater ipsa
        fíliæ sese religiose instituéndam dedit, ita ut, aucto paulatim numero, ordinem
        Mantellatárum institúerit, ac illi pie vivéndi leges summa prudéntia ac sanctitáte
        tradíderit. Ejus virtútes cum optime perspectas divus Benitius haberet, morti
        próximus nulli mélius quam Julianæ, non feminas tantum, sed et totum Servórum
        ordinem, cujus propagator et moderátor exstiterat, commendátum vóluit. Verum ipsa
        demisse semper de se cogitábat; et, cum ceterárum esset magistra, in re quaque
        domestica, licet vili, soróribus famulabátur. Assiduitate orándi íntegras insumebat
        dies in éxtasim sæpíssime rapta, et, si reliquum, in sedandis civium dissidiis,
        criminosis a via iniquitátis retrahendis, ac inserviéndis impendebat ægrotis;
        quorum quandoque saniem ex ulcéribus manántem, admoto ore lambens, eos sanitáti
        restituébat. Corpus suum flagris, nodosis funículis, férreis cingulis, vigiliis,
        humi nudæ cubando, térere sólita fuit. Parcíssimo cibo, et hoc vili, quatuor
        hebdomadæ diebus, et reliquis duobus solo Angelórum pane contenta, excepto die
        sábbati, quo pane solo et aqua nutriebátur.


        Dura hujusmodi vivéndi ratióne in stómachi morbum íncidit, quo ingravescente, cum
        septuagesimum ætátis annum ágeret, ad extremum vitæ spatium redacta est. Diuturnæ
        valetúdinis incómmoda hílari vultu constantique animo pértulit; de uno tantum
        cónqueri audíta est, quod, cum cibum cápere ac retinére nullo modo posset, ab
        Eucharistica mensa ob sacraménti reveréntiam arcerétur. Verum, his in angustiis
        constituta, sacerdotem rogávit ut allátum divinum Panem, quem ore sumere nequíbat,
        péctori saltem exterius admovéret. Precibus illíus morem gessit sacerdos; et mirum!
        eodem témporis momento divinus Panis dispáruit, et Juliana sereno ac ridénti vultu
        exspirávit. Res supra fidem tamdiu fuit, donec virgineum de more curarétur corpus;
        invénta enim est circa sinistrum péctoris latus carni véluti sigillo impressa forma
        hostiæ, quæ Christi crucifixi effigiem repræsentábat. Hujus prodigii fama
        ceterorúmque miraculórum non Floréntiæ tantum, sed totius christiáni orbis
        veneratiónem illi conciliávit, ac per quatuor prope íntegra sæcula adeo aucta est,
        ut tandem Benedíctus Papa décimus tertius in ejus celebritate Offícium proprium
        recitari ab universo ordine beátæ Maríæ Vírginis Servórum jússerit. Clemens vero
        duodecimus, munificentíssimus ejusdem ordinis protéctor, novis in dies miraculis
        coruscántem, sanctárum Vírginum catálogo adscripsit.
      en: >-
        Juliana was a daughter of the noble family of the Falconieri, and was born in the
        year 1270. Her father was the same who at his own costs so splendidly built from
        the foundations the Church of Our Lady of the Annunciation as it now standeth at
        Florence. Her mother's name was Reguardata. They were both well stricken in years,
        and, until the birth of Juliana, had been childless. From her very cradle she gave
        tokens of the holiness of life to which she afterwards attained. And from the
        murmuring of her baby lips was caught the sweet sound of the names of Jesus and
        Mary. As she entered on her girlhood, she delivered herself up entirely to the
        pursuit of Christian godliness, and so excellently shone therein, that her uncle,
        the Blessed Alexius, scrupled not to tell her mother that she had given birth to an
        Angel rather than to a woman. So modest was her carriage, and so clean her soul
        from the lightest speck of indiscretion, that she never in her whole life stared a
        man in the face, and the very mention of sin made her shiver. Before she had
        finished her fifteenth year, she renounced her inheritance, although a rich one,
        and all prospect of an earthly marriage, and made to God a vow of virginity, before
        holy Philip Benizi, from whom she was the first to receive the religious habit of
        what are called the mantled nuns.


        Many of the noblest ladies followed Juliana's example, and her own mother gave
        herself over to her daughter to be instructed in the religious life; so, their
        number growing little by little, she founded the Order of Mantled Nuns, and gave
        them a rule of life full of wisdom and godliness. Holy Philip Benizi, having
        thorough knowledge of her excellence, chose her above all, as he lay dying, to whom
        to commend not the women only but the whole Order of the Servants of Mary, of which
        he had been the propagator and director. Juliana, who deemed ever lowly of herself,
        even when she was the mistress of the others, ministered to her sisters in the
        meanest offices of the house. She passed whole days in incessant prayer, and was
        often rapt in ecstasy, and the rest of her time she spent making peace among the
        citizens who were at variance, recalling transgressors from the ways of iniquity,
        and nursing the sick, sometimes even using her own mouth to draw the matter from
        their sores and so restore them to health. It was her custom to afflict her own
        body with whips, knotted cords, iron girdles, watchings, and sleeping upon the bare
        ground. On four days of the week she ate very sparingly of poor food, and on the
        other two was content with only the Bread of Angels, save on Saturday, when she was
        nourished by bread and water alone.


        This hard manner of living brought upon her a disease of the stomach, which grew
        worse until, at the age of seventy, she was brought to the very end of her life. She
        bore the discomforts of her long illness with a cheerful countenance and a steady
        heart, and was heard to complain of but one thing: that, being unable to take or
        keep down any food, she was kept by reverence for the Sacrament from the Eucharistic
        table. In this distress she begged the priest to bring the divine Bread, which she
        could not receive with her mouth, and lay It at least outwardly upon her breast. The
        priest granted her prayer, and — wondrous thing! — at that very moment the divine
        Bread vanished from sight, and Juliana breathed her last with a peaceful and smiling
        face. This marvel remained beyond belief until, as the virgin body was being laid
        out in the customary manner, there was found upon the left side of her breast, as
        if stamped into the flesh by a seal, the form of a Host bearing the image of Christ
        crucified. The fame of this wonder and of her other miracles won her veneration not
        only from Florence but from the whole Christian world, and grew over nearly four
        entire centuries, until at length Pope Benedict XIII ordered a proper Office in her
        honor to be recited by the whole Order of the Servants of the Blessed Virgin Mary;
        and Clement XII, a most generous protector of that same Order, seeing her shine with
        new miracles day by day, enrolled her among the holy Virgins.
    status: { la: verified, en: verified }
