# Matins Nocturn content for Pentecost Ember Friday (Feria Sexta Quattuor
# Temporum Pentecostes) — Gospel pericope (Luke 5:17-26, the healing of
# the paralytic) sourced from web/www/missa/Latin/Tempora/Pasc7-5.txt and
# missa/English/Tempora/Pasc7-5.txt (horas/Tempora/Pasc7-5.txt only gives
# the incipit + "Et réliqua"); homily sourced from horas/Latin/Tempora/
# Pasc7-5.txt and horas/English/Tempora/Pasc7-5.txt. Latin/TemporaM/
# Pasc7-5.txt inherits Lectio1-3/Responsory1-2 unchanged from the secular
# file and only adds its own extra Responsory3 (a cross-reference to
# Pasc7-2's own Responsory2, for a 3rd Monastic lesson this app doesn't
# model) — no divergence in the content actually used here.
#
# Recombined into one reading, same convention as ember-pentecost-
# wednesday.yml (see ember-september-friday.yml's own doc comment for
# the fuller rationale): St. Ambrose's homily is one continuous text on
# the healing of the paralytic, split only to fill the fixed 3-lesson
# slot count. Responsory is Lectio1's own (Responsory1) per the "first
# one, when several collapse" convention — genuinely proper to this day.
id: ember-pentecost-friday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Luc 5:17-26", en: "Luke 5:17-26" }
    text:
      la: >-
        In illo témpore: Factum est in una diérum, et Jesus sedébat docens. Et erant pharisǽi sedéntes, et
        legis doctóres, qui vénerant ex omni castéllo Galilǽæ et Judǽæ et Jerúsalem: et virtus Dómini erat ad
        sanándum eos. Et ecce, viri portántes in lecto hóminem, qui erat paralýticus: et quærébant eum inférre,
        et pónere ante eum. Et non inveniéntes, qua parte illum inférrent præ turba, ascendérunt supra tectum, et
        per tégulas summisérunt eum cum lecto in médium ante Jesum. Quorum fidem ut vidit, dixit: Homo,
        remittúntur tibi peccáta tua. Et cœpérunt cogitáre scribæ et pharisǽi, dicéntes: Quis est hic, qui
        lóquitur blasphémias? Quis potest dimíttere peccáta nisi solus Deus? Ut cognóvit autem Jesus
        cogitatiónes eórum, respóndens dixit ad illos: Quid cogitátis in córdibus vestris? Quid est facílius
        dícere: Dimittúntur tibi peccáta, an dícere: Surge et ámbula? Ut autem sciátis, quia Fílius hóminis habet
        potestátem in terra dimitténdi peccáta, ait paralýtico: Tibi dico, surge, tolle lectum tuum et vade in
        domum tuam. Et conféstim consúrgens coram illis, tulit lectum, in quo jacébat: et ábiit in domum suam,
        magníficans Deum. Et stupor apprehéndit omnes et magnificábant Deum. Et repléti sunt timóre, dicéntes:
        Quia vídimus mirabília hódie.
      en: >-
        At that time, it came to pass on one of the days, that Jesus sat teaching. And there were Pharisees and
        teachers of the Law sitting by, who had come out of every village of Galilee and Judea and out of
        Jerusalem. And the power of the Lord was present to heal them. And behold, some men were carrying upon a
        pallet a man who was paralyzed, and they were trying to bring him in and to lay him before Him. And as
        they found no way of bringing him in, because of the crowd, they went up onto the roof and lowered him
        through the tiles, with his pallet, into the midst before Jesus. And seeing their faith, He said, Man,
        your sins are forgiven you. And the Scribes and Pharisees began to argue, saying, Who is this man who
        speaks blasphemies? Who can forgive sins, but God only? But Jesus, knowing their thoughts, answered and
        said to them, "Why are you arguing in your hearts? Which is easier, to say, 'Your sins are forgiven
        you,' or to say, 'Arise and walk'?" But that you may know that the Son of Man has power on earth to
        forgive sins — He said to the paralytic — I say to you, arise, take up your pallet and go to your house.
        And immediately he arose before them, took up what he had been lying on, and went away to his house,
        glorifying God. And astonishment seized upon them all, and they glorified God and were filled with fear,
        saying, We have seen wonderful things today.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, Book 5 on Luke 5 (on the healing of the paralytic)"
    text:
      la: >-
        Non otiósa hujus paralýtici, nec angústa medicína est, quando Dóminus et orásse præmíttitur; non útique
        propter suffrágium, sed propter exémplum. Imitándi enim spécimen dedit, non precándi ámbitum requisívit.
        Et conveniéntibus ex omni Galilǽa, et Judǽa, et Jerúsalem, legis doctóribus, inter ceterórum remédia
        debílium, paralýtici istíus medicína descríbitur. Primum ómnium, quod ante díximus, unusquísque æger
        peténdæ salútis debet adhibére, per quos nostræ vitæ compágo resolúta, actuúmque nostrórum clauda
        vestígia, verbi cæléstis remédio reforméntur.


        Sint ígitur áliqui monitóres mentis, qui ánimum hóminis, quamvis exterióris córporis debilitáte
        torpéntem, ad superióra érigant. Quorum rursus adminículis et attóllere et humiliáre se fácilis ante
        Jesum locétur, Domínico vidéri dignus aspéctu. Humilitátem enim réspicit Dóminus: quia respéxit
        humilitátem ancíllæ suæ. Quorum fidem ut vidit, dixit: Homo, remittúntur tibi peccáta tua. Magnus
        Dóminus, qui aliórum mérito ignóscit áliis: et dum álios probat, áliis reláxat erráta. Cur apud te, homo,
        colléga non váleat, cum apud Deum servus et interveniéndi méritum, et jus hábeat impetrándi?


        Disce, qui júdicas, ignóscere: disce, qui æger es, impetráre. Si grávium peccatórum diffídis véniam,
        ádhibe precatóres, ádhibe Ecclésiam, quæ pro te precétur, cujus contemplatióne, quod tibi Dóminus
        negáre posset, ignóscat. Et quamvis históriæ fidem non debeámus omíttere, ut vere paralýtici istíus
        corpus credámus esse sanátum: cognósce tamen interióris hóminis sanitátem, cui peccáta donántur. Cum
        Judǽi ásserunt peccáta a solo Deo posse concédi, Deum útique eum confiténtur; suóque judício perfídiam
        suam produnt, qui opus ástruunt, ut persónam negent.
      en: >-
        The healing of this paralytic was not idle, nor its fruits limited to himself. The Lord healed him, or
        ever he could ask, not because of the entreaties of others, but for example's sake. He gave a pattern to
        be followed, and sought not the intercession of prayer. In the presence of the Pharisees and doctors of
        the law, which were come out of every town of Galilee, and Judaea, and Jerusalem, many sick folk were
        healed, but among them is specially described the healing of this paralytic. First of all, as we have
        before said, every sick man ought to engage his friends to offer up prayers for his recovery, that so the
        tottering framework of this our life, and the distorted feet of our works, may be righted by the healing
        power of the word from heaven.


        Here ought therefore to be advisers, who should rouse up the minds of the sick to higher things, since
        when the body becometh languid with sickness, the mind is apt to follow its example. With the help of
        such friends he can be brought and laid on the ground before the Feet of Jesus, and seem worthy of a
        glance from the Lord — for the Lord looketh upon such as lie lowly before Him, "for He hath regarded the
        lowliness of His handmaiden." "And when He saw their faith, He said unto him — Man, thy sins are
        forgiven thee." Great is the Lord, Who, for the sake of some, forgiveth the sins of others — Who trieth
        some, and pardoneth the wanderings of others. Why should thine equal, O man, avail not with thee, if a
        slave have won power to intercede, and right to obtain, with God?


        O Thou that judgest, learn to forgive — thou that art sick, to pray. If thou doubt of the pardon of thy
        sins, because of their grievousness, get thee to the Church, that she may pray for thee, and that the
        Lord, accepting her countenance, may grant to her petitions what He refuses to thine. And although we are
        bound to accept this history as one of fact, and to believe that the body of the paralytic was healed —
        yet remember thou also his inward cure, unto whom his sins were forgiven. The Jews said: "Who can forgive
        sins but God alone?" And in these words they confessed the Godhead of Him Who forgave the sins of the
        paralytic, and themselves condemned their own unbelief in Him Whose work they acknowledged, but Whose
        Person they denied.
    responsory:
      la: "R. Non vos me elegístis, sed ego elégi vos, et pósui vos: * Ut eátis, et fructum afferátis, et fructus vester máneat, allelúia, allelúia.\nV. Sicut misit me Pater, et ego mitto vos.\nR. Ut eátis, et fructum afferátis, et fructus vester máneat, allelúia, allelúia."
      en: "R. Ye have not chosen Me, but I have chosen you, and ordained you * That ye should go and bring forth fruit, and that your fruit should remain. Alleluia, Alleluia.\nV. As My Father hath sent Me, even so send I you.\nR. That ye should go and bring forth fruit, and that your fruit should remain. Alleluia, Alleluia."
    status: { la: verified, en: verified }
