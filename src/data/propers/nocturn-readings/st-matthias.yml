# Matins Nocturn 3 reading for St. Matthias, Apostle (Feb 24) —
# SanctiM/02-24.txt inherits the whole day (`@Sancti/02-24`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/02-24.txt, English/Sancti/02-24.txt.
# Lectio4-6 fall back to Common of an Apostle (`Commune/C1`), not
# proper text, so not authored here. Lectio7's Gospel citation
# (Matt 11:25-30) was a bare incipit ("Et réliqua") with no full
# pericope text given; the full pericope is now authored too
# (isGospel: true, immediately before the homily) — sourced from
# `web/www/missa/Latin/Sancti/01-15.txt` (Feb 24's own Missale
# [Evangelium] is `@Sancti/01-15`), English/Sancti/01-15.txt
# (2026-09-05 update). The homily portion remains combined with
# Lectio8-9 as one continuous excerpt of St. Augustine's sermon. No
# responsory given.
id: st-matthias
readings:
  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 11:25-30", en: "Matt 11:25-30" }
    text:
      la: >-
        In illo témpore: Respóndens Jesus, dixit: Confíteor tibi, Pater, Dómine cœli et terræ,
        quia abscondísti hæc a sapiéntibus et prudéntibus, et revelásti ea párvulis. Ita, Pater:
        quóniam sic fuit plácitum ante te. Ómnia mihi trádita sunt a Patre meo. Et nemo novit
        Fílium nisi Pater: neque Patrem quis novit nisi Fílius, et cui volúerit Fílius reveláre.
        Veníte ad me, omnes, qui laborátis et oneráti estis, et ego refíciam vos. Tóllite jugum
        meum super vos, et díscite a me, quia mitis sum et húmilis corde: et inveniétis réquiem
        animábus vestris. Jugum enim meum suáve est et onus meum leve.
      en: >-
        At that time, Jesus answered and said, "I praise Thee, Father, Lord of heaven and earth,
        that Thou hast hid these things from the wise and prudent, and hast revealed them to
        little ones. Yes, Father, for so it hath seemed good in Thy sight. All things are
        delivered to Me by My Father. And no one knoweth the Son but the Father; neither doth
        anyone know the Father but the Son, and he to whom it shall please the Son to reveal
        Him. Come to Me, all you that labour and are burdened, and I will refresh you. Take up
        My yoke upon you, and learn of Me, because I am meek and humble of heart, and you shall
        find rest to your souls. For My yoke is sweet, and My burden light."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Sermon 10 on the Words of the Lord (on Matt 11:25-30)"
    text:
      la: >-
        Veníte ad me, omnes qui laborátis. Quare enim omnes laborámus, nisi quia sumus hómines
        mortáles, frágiles, infírmi, lútea vasa portántes, quæ fáciunt ínvicem angústias? Sed, si
        angustiántur vasa carnis, dilaténtur spátia caritátis. Quid ergo dicit, Veníte ad me,
        omnes qui laborátis, nisi ut non laborétis? Dénique promíssio ejus in promptu est;
        quóniam laborántes vocávit, quærent forte, qua mercéde vocáti sunt. Et ego vos, inquit,
        refíciam. Tóllite jugum meum super vos, et díscite a me, non mundum fabricáre, non
        cuncta visibília et invisibília creáre, non in ipso mundo mirabília fácere et mórtuos
        suscitáre; sed, Quóniam mitis sum et húmilis corde.


        Magnus esse vis? a mínimo íncipe. Cógitas magnam fábricam constrúere celsitúdinis? de
        fundaménto prius cógita humilitátis. Et quantam quisque vult et dispónit superimpónere
        molem ædifícii, quanto erit majus ædifícium, tanto áltius fodit fundaméntum. Et fábrica
        quidem cum constrúitur, in supérna consúrgit; qui autem fodit fundaméntum, ad ima
        deprímitur. Ergo et fábrica ante celsitúdinem humiliátur, et fastígium post
        humiliatiónem erígitur.


        Quod est fastígium construéndæ fábricæ, quam molímur? quo perventúrum est cacúmen
        ædifícii? Cito dico, usque ad conspéctum Dei. Vidétis quam excélsum est, quanta res est
        conspícere Deum. Qui desíderat, et quod dico et quod audit intéllegit. Promíttitur nobis
        conspéctus Dei, veri Dei, summi Dei. Hoc enim bonum est, vidéntem vidére. Nam, qui colunt
        falsos deos, fácile illos vident; sed eos vident, qui óculos habent et non vident. Nobis
        autem promíttitur vísio Dei vivéntis et vidéntis.
      en: >-
        Come unto Me, all ye that labour! And wherefore labour we all, but because we are frail,
        sickly, dying creatures, burdened with earthen vessels which distress us? But if these
        fleshly vessels be distressful, let the open expanse of love be free and wide. Come unto
        Me, all ye that labour! and why? That we may labour no more. His promise is an instant
        promise, for He calleth such as are labouring. Perchance they will ask Him what shall be
        their reward? And I, saith He, will give you rest. Take My yoke upon you, and learn of me,
        not how to make the world, not how to create all things visible and invisible, not to work
        wonders in the earth, nor to raise the dead, but for I am meek and lowly in heart.


        Wilt thou be great? Begin by being little. Dost thou think to raise up a lofty building?
        Then lay the foundations thereof in lowliness. The greater soever, and the more massy, be
        that which any man thinketh to build, so much the deeper doth he dig his foundation. And
        when the house is built, it towereth heavenward; but he which layeth the foundation goeth
        down into the earth. The building, therefore, is low before it is high, and, after it is
        low, it riseth high to the roof.


        What is the roof of the house on which we labour? Whither do its spires rise? I answer you
        at once; to the presence of God. You see how high it is, yea, what it is to see God. He
        that will, understandeth what I say, and he heareth. What is promised you is to see God,
        God, the True, God, the Supreme. Blessed is he who seeth Him by Whom he is seen. Such as
        worship false gods see them easily, but they see them who have eyes and see not. But unto
        us it is promised that we shall see that God Who liveth and seeth.
    status: { la: verified, en: verified }
