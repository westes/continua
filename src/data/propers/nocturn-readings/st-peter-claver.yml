# Matins Nocturn 2 reading for St. Peter Claver, Confessor (Sep 9).
# Sourced from web/www/horas/Latin/Sancti/09-09n.txt's [Lectio94] (its own
# alternate/shorter numbered lesson, the only vita content the source
# carries for this entry -- no Lectio4-6 of the usual kind exists here),
# and English/Sancti/09-09n.txt's own translation of the same. Both
# Latin and English are the source's own verified text.
id: st-peter-claver
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Petrus Claver, Hispánus Verdúni natus, Societáti Jesu nomen dedit adoléscens móribus
        innocentíssimis. In Baleárium máxima a sancto Alfónso Rodríguez, qui multa de futúro
        ejus apostolátu divínitus accéperat, parátos sibi labóres edóctus est. Carthágine Nova
        in América Meridionáli sacerdótio auctus, Nigrítis turpi mercátu illuc abdúctis vitam
        suam, interpósita sacraménti fide, plane devóvit. In his autem fovéndis, nutriéndis,
        curándis, doctrína christiána imbuéndis et baptizándis dici vix potest quanta patiéntia
        et caritáte annos ámplius quadragínta insudáverit. Quamplúres a médicis desperátos
        súbito sanitáti restítuit, multis oculórum lúmine captis visum réddidit, tres a mórtuis
        excitávit. His excéllens méritis atque virtútibus heróicis annos expléverat quátuor et
        septuagínta, cum die natáli Deíparæ, quam tenérrimo colúerat afféctu, ad Cǽlites
        migrávit. Eum Leo décimus tértius cǽlitum Sanctórum fastis adscrípsit atque patrónum
        cæléstem peculiárem sacrárum ad Nigrítas missiónum constítuit.
      en: >-
        Peter Claver was born in Catalonia. As a young man, already a model of innocence, he
        entered the Society of Jesus. While engaged in the study of philosophy, he was
        instructed by St. Alphonsus Rodriguez in the secrets of higher virtue. At New
        Cartagena in South America, having been ordained to the priesthood, he resolved by a
        special vow to devote his whole life to the service of the Negroes whom the infamous
        slave trade brought to this port. Words cannot adequately express the degree of
        patience and charity exhibited by him towards these unfortunate slaves in such works
        as nursing, feeding and providing for them, instructing them in Christian doctrine and
        baptizing them over a period of more than forty years. God added to his fame by
        bestowing upon him the grace of healing. After the labors of the day, he was wont to
        pray far into the night and to practice severe penance, for which he had an insatiable
        zeal. At the age of seventy-one, he became seriously sick and was confined to his room
        for four years. He finally passed to his heavenly reward on the birthday of the Mother
        of God whom he always venerated with the most tender devotion. Leo XIII canonized him
        and appointed him the special Patron of all the Catholic missions among the Negroes.
    status: { la: verified, en: verified }
