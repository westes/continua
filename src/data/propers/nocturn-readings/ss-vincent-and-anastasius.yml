# Matins Nocturn 2 readings for Ss. Vincent and Anastasius, Martyrs
# (Jan 22) — SanctiM/01-22M.txt inherits the whole day (`@Sancti/01-22`),
# only overriding the collect wording to single out Vincent (the
# Monastic office demotes this to Simplex, honouring Vincent alone via
# the Common of a Martyr) — but Lectio4-6, Sancti/01-22's own proper
# text about both martyrs, is not overridden, so it's sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints); authored here for both martyrs together
# per this app's own calendar id, following "prefer real text over
# a rank-driven Common substitution" (vu-prefer-text-over-missing).
# web/www/horas/Latin/Sancti/01-22.txt, English/Sancti/01-22.txt.
# Lectio4-5 (Vincent's own vita) combined into one reading, no internal
# break. Lectio6 (Anastasius's vita) is a genuinely distinct martyr,
# kept separate. No responsory given in the source.
id: ss-vincent-and-anastasius
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Vincentius, Oscæ in Hispánia citeriore natus, a prima ætate stúdiis déditus, sacras
        litteras a Valerio Cæsaraugustano episcopo didicit; cujus étiam partes suscépit
        prædicándi Evangélium, quod epíscopus, propter linguæ impediméntum, prædicatiónis officio
        fungi non poterat. Ea re ad Dacianum, provinciæ a Diocletiáno et Maximiáno præpositum,
        delata, Vincentius Cæsaraugustæ comprehénditur, et vinctus ad Dacianum Valéntiam
        adducitur. Ubi verbéribus et equuleo tortus, multis præséntibus, cum nulla aut
        tormentórum vi, aut acerbitate vel lenitate verbórum a proposito deterreri posset; in
        cratícula impositus, prunis ardéntibus suppositis, ac férreis unguibus excarnificatus,
        candentibúsque láminis exustus, íterum ducitur in carcerem stratum testáceis fragméntis,
        ut ejus nudum corpus, somno oppressum, a subjectis étiam testárum aculeis torquerétur.


        Verum, illo in tenebricosa incluso custódia, claríssimus splendor obortus totum carcerem
        illustrávit; quæ lux cum summa admiratióne omnes, qui aderant, affecísset, res a custode
        carceris ad Dacianum defertur. Qui eductum in molli cúlcitra collocat; et quem cruciátibus
        in suam senténtiam trahere non poterat, deliciis perducere conátur. Sed invictus Vincentii
        animus, Jesu Christi fide speque munítus, vicit ómnia; et ignis, ferri, tortórum
        immanitate superata, victor ad cælestem martyrii corónam advolávit, undecimo Kalendas
        Februarii. Cujus corpus, cum projectum esset inhumátum, corvus et a volucribus et a lupo
        únguibus, rostro, alis mirabíliter defendit. Qua re cógnita, Dacianus illud in altum mare
        demergi jubet: sed inde étiam divinitus ejectum ad littus, Christiáni sepeliunt.
      en: >-
        Vincent was born at Huesca in Aragon in Spain. He was early turned to study, and learned
        sacred letters from Valerius, Bishop of Saragossa. He was accustomed to deliver discourses
        for this Prelate, who, owing to an impediment in his speech, was not able to preach
        himself. This coming to the ears of Dacian, Prefect of the province under Diocletian and
        Maximian, he caused Vincent to be arrested at Saragossa, and brought before him at Valencia
        in bonds. The saint was scourged, and afterwards tormented on the rack, in presence of
        numerous spectators, but neither torture, threats, nor fair words could bend his
        resolution. He was then laid on a grating over hot coals, his flesh mangled with iron
        hooks, and white-hot plates of metal applied to the wounds. The still breathing remains
        were taken back to a prison, and laid on broken potsherds, that the agony of his naked body
        might prevent his sleeping from exhaustion.


        As he lay in his dark cell, a glorious light suddenly filled the prison, to the
        astonishment of all who saw it. The gaoler informed Dacian, who caused the martyr to be
        brought out and cared for in a soft bed, hoping that though he had failed to move him by
        cruelty, he might seduce him by pretended kindness. But the indomitable soul of Vincent,
        armed with faith and hope in Christ Jesus, remained unconquered even to the end, and
        triumphing over the fire, the steel, and the cruelty of the tormentors, passed away to
        receive the victorious crown of martyrdom in heaven, on the 22nd day of January. His body
        was thrown out unburied. A raven perched upon it and kept off with his beak, claws, and
        wings both the other birds and a wolf, which came to prey on it. Dacian then had it thrown
        into the sea, but by the will of God it was washed up again, and the Christians took and
        buried it.
    status: { la: verified, en: verified }

  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Anastasius Persa, monachus, Heraclío imperatóre, cum sanctam Jerosolymórum terram
        visitasset, ad Cæsaréam Palæstinæ pro Christi religióne víncula et verbera constanter
        perpéssus est. Mox a Persis ob eamdem causam variis cruciátibus afféctus, a rege Chósroa
        una cum septuagínta aliis Christiánis secúri percútitur. Cujus relíquiæ primum
        Jerosolymam ad monastérium, in quo monasticam vitam proféssus erat, deínde Romam delátæ,
        collocátæ sunt in monasterio ad Aquas Sálvias.
      en: >-
        Anastasius was a Persian monk who made a pilgrimage to the Holy Places at Jerusalem in the
        reign of the Emperor Heraclius, during which journey he endured bonds and stripes on
        account of his confession of Christ at Banias, then called Caesarea, in Palestine. Soon
        after his return, he was arrested by the Persians for the same cause, and, after enduring
        diverse torments, he and seventy other Christians were beheaded by order of King Chosroes.
        His reliques were first carried to Jerusalem, to the monastery in which he had made his
        monastic profession, and afterwards to Rome, where they were laid in the monastery of
        Saints Vincent and Anastasius.
    status: { la: verified, en: verified }
