# Matins Nocturn 2 reading for St. Gregory the Illuminator, Bishop and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/10-01-Gregorius.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-gregory-the-illuminator
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gregórius, Armeniæ régibus cretus, qui primus post sanctum Bartholomæum Apostolum in illam
        provínciam Christi fidem invexerat, dictus proptérea pátria voce Illuminator, infans clam
        eréptus ad declinandam necem, qua ejus família petebatur, Cæsaréæ Cappadóciæ pie est
        educátus, legemque Christi edóctus baptísmum suscépit. Secesserat illuc Teridates fílius
        Cusaronis Armenorumregis, ab Anach Gregórii patre doldse interempti, a Persis regno
        spoliatus, cui Gregórius patérni scéleris bene cónscius se in servitútem trádidit, et cum eo
        qui jam a Romanis regnum recuperaverat, deínde in Armeniam rédiit, ubi a Teridate sǽpius
        tentátus, ut idólis sacrificáre vellet, cum constantíssime renuísset, innúmera pene et
        incredibilia tormentórum génera subíre coáctus est.


        Arcta primum custódia Gregórium inclusit Teridates; tunc manus ejus latéribus sic alligari
        jussit, ut exstarent cubíti, et camum ori ejus inseri, massasque excisi salis dorso ejus
        imponi, constrictumque loro circa pectus fórtiter stringente suspendi celsissimo loco.
        Mansit autem sic suspensus septem diébus, post quos, cum in sua senténtia permanéret, ex uno
        pede suspensus coáctus est fumum hauríre excitatum ex fimo graveolente, dum intérea fórtiter
        cædebatur baculis humidis. Inter hæc enixis Deum précibus exoravit pro salúte ómnium,
        præsértim gentis Armeniæ, atque ut sibi constántiam pro fide tribueret. Hanc rex demirátus
        quidem, crudelius tamen desseviit, mandavitque afférri lignórum truncos, et componi tabulas
        super anteriores partes pedum ejus, eásque funibus nodosis veheménter constringi, donec
        defltieret sanguis per summitates digitórum. Cólaphis ínsuper contusus fuit, et caput ejus
        artificiosæ cochleæ impositum, et admota nari ejus fistula, effusa sunt sal, nitrum et
        acetum simul commixta. Multa similia et pejora crudelitátis génera perpéssus est, ádeo ut
        rex ipse veheménter miraretur mansisse vivum, et nihili fecísse dolóres intensos.


        Cum autem quidam ex satrapis rege allocútus illi manifestasset Gregórium fílium esse Anach,
        interfectoris patris ejus Cusaronis, jussit illum mánibus pedibusque et collo vinctum
        perduci in provínciam Ararat, trudique in vérticem castri Artaxat, demittique in
        infimumhiatum, donecibidem moreretur. Deus vero, qui e tantis torméntis vivum illum
        eripuerat, ex hocpariter servávit incólumem, et post longum tempus Teridatem ipsum velut
        álterum Nabuchodónosor tentatióne probátum ad fídei lumen addúxit, quem Gregórius jejúnio
        purgátum, Deo per baptísmum reconciliavit. Ítaque facta potestáte públice prædicándi Christi
        Evangélium, majóris Armeniæ gentem in fide erudívit, et sacro fonte lustrávit, ecclesiasque
        undequaque eréxit, destrúctis superstitiónis simulácris, templisque eórum eversis, Cæsaréæ
        ordinátus suæ gentis archiepíscopus, impénsius Armenos divína doctrína instrúxit, atque in
        fide suscépta confirmávit. Quiétis tandem ac divíni otii cupidissimus, in solitúdinem se
        recépit, ubi jejúnio et contemplatióni déditus, méritis cumulátus in bona senectúte
        obdormívit in Dómino, Constantíno Magno imperatóre. Corpus illíus christiáni ex Armenia
        fugiéntes in Itáliam transtulerunt; caput cum caténis quibus vinctus fúerat Neápoli,
        bráchium vero in cathedrali Neritonensi collocátum fuit.
      en: >-
        Gregory, sprung from the kings of Armenia, who was first after the holy Apostle Bartholomew
        to bring the faith of Christ into that province, and therefore called in his native tongue
        the Illuminator, snatched away secretly as an infant to avoid the death with which his
        family was sought, was piously brought up at Caesarea in Cappadocia, and, instructed in the
        law of Christ, received baptism. Thither had withdrawn Tiridates, the son of Chosroes king
        of the Armenians, treacherously slain by Anak the father of Gregory, deprived of his kingdom
        by the Persians, to whom Gregory, well aware of his father's crime, gave himself in
        servitude, and returned with him, who had now recovered his kingdom from the Romans, into
        Armenia, where, tempted often by Tiridates to sacrifice to idols, since he most constantly
        refused, he was forced to undergo almost innumerable and incredible kinds of torments.


        Tiridates first shut Gregory up in strict custody; then he ordered his hands to be so bound
        to his sides that the elbows stood out, and a muzzle to be put into his mouth, and lumps of
        cut salt to be laid on his back, and, bound round the chest with a strap tightly drawn, to
        be hung up in a very high place. He remained thus hanging seven days, after which, as he
        persevered in his resolve, hung by one foot he was forced to inhale the smoke raised from
        foul-smelling dung, while meanwhile he was strongly beaten with wet rods. Among these things
        he besought God with earnest prayers for the salvation of all, especially of the nation of
        the Armenians, and that He would grant him constancy for the faith. The king, wondering at
        this indeed, raged yet more cruelly, and ordered logs of wood to be brought, and boards laid
        upon the front parts of his feet, and tightly bound with knotted ropes, until the blood
        flowed out at the tips of the toes. He was also bruised with blows of the fist, and his head
        was set in an artful screw, and, a tube being applied to his nostril, salt, natron and
        vinegar mixed together were poured in. Many like and worse kinds of cruelty he endured, so
        that the king himself greatly wondered that he remained alive and made light of the intense
        pains.


        When however one of the satraps, speaking to the king, had made known to him that Gregory
        was the son of Anak, the murderer of his father Chosroes, he ordered him bound hands and
        feet and neck to be led into the province of Ararat, and thrust to the summit of the
        fortress of Artaxata, and let down into the lowest pit, until he should die there. But God,
        who had snatched him living from such tortures, likewise kept him unharmed from this, and
        after a long time brought Tiridates himself, like another Nebuchadnezzar proved by trial, to
        the light of faith, whom Gregory, purified by fasting, reconciled to God through baptism.
        And so, power being given him to preach publicly the Gospel of Christ, he instructed the
        nation of Greater Armenia in the faith and washed them in the sacred font, and raised
        churches everywhere, the images of superstition being destroyed and their temples
        overthrown; ordained at Caesarea archbishop of his nation, he more earnestly instructed the
        Armenians in divine doctrine, and confirmed them in the faith received. At last, most
        desirous of quiet and of divine leisure, he withdrew into solitude, where, given to fasting
        and contemplation, laden with merits, in good old age he fell asleep in the Lord, in the
        time of Constantine the Great. His body those fleeing from Armenia carried into Italy; his
        head with the chains by which he had been bound was placed at Naples, and his arm in the
        cathedral of Nardò.
    status: { la: verified, en: draft }
