# Matins content for Easter Monday (temporalId easter-monday, Pasc0-1 --
# "Die II infra octavam Paschæ"). Sourced from web/www/horas/Latin/
# Tempora/Pasc0-1.txt (Latin homily) / English/Tempora/Pasc0-1.txt
# (English homily), and the Gospel pericope itself from the Missal's own
# [Evangelium] (missa/Latin/Tempora/Pasc0-1.txt / missa/English/Tempora/
# Pasc0-1.txt), same convention as easter-sunday.yml's own Update note --
# the Office file's own Lectio1 only carries a bare incipit ("Et
# réliqua"), so the full pericope is pulled from the Mass propers for the
# same day, not guessed at.
#
# Single-nocturn source form (Duplex I classis cum Octava Privilegiata I
# collapses to 1 nocturn/3 lessons, same structural note as easter-
# sunday.yml) -- Lectio1's homily portion (incipit dropped) combined with
# Lectio2-3 into one continuous reading, same pattern used throughout this
# project's sweep. Responsory: the source's own [Responsory1] ("María
# Magdaléne, et áltera María") -- also reused verbatim by easter-
# octave.yml's own Nocturn 2, a genuine cross-reference already present in
# the source, not a duplication error.
id: easter-monday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Lucas 24:13-35", en: "Luke 24:13-35" }
    text:
      la: >-
        In illo témpore: Duo ex discípulis Jesu ibant ipsa die in castéllum, quod erat in spátio
        stadiórum sexagínta ab Jerúsalem, nómine Emmaus. Et ipsi loquebántur ad ínvicem de his
        ómnibus, quæ accíderant. Et factum est, dum fabularéntur et secum quǽrerent: et ipse Jesus
        appropínquans ibat cum illis: óculi autem illórum tenebántur, ne eum agnóscerent. Et ait ad
        illos: Qui sunt hi sermónes, quos confértis ad ínvicem ambulántes, et estis tristes? Et
        respóndens unus, cui nomen Cléophas, dixit ei: Tu solus peregrínus es in Jerúsalem, et non
        cognovísti, quæ facta sunt in illa his diébus? Quibus ille dixit: Quæ? Et dixérunt: De Jesu
        Nazaréno, qui fuit vir Prophéta potens in ópere et sermóne, coram Deo et omni pópulo: et
        quómodo eum tradidérunt summi sacerdótes et príncipes nostri in damnatiónem mortis, et
        crucifixérunt eum. Nos autem sperabámus, quia ipse esset redemptúrus Israël: et nunc super
        hæc ómnia tértia dies est hódie, quod hæc facta sunt. Sed et mulíeres quædam ex nostris
        terruérunt nos, quæ ante lucem fuérunt ad monuméntum, et, non invénto córpore ejus, venérunt,
        dicéntes se étiam visiónem Angelórum vidísse, qui dicunt eum vívere. Et abiérunt quidam ex
        nostris ad monuméntum: et ita invenérunt, sicut mulíeres dixérunt, ipsum vero non invenérunt.
        Et ipse dixit ad eos: O stulti et tardi corde ad credéndum in ómnibus, quæ locúti sunt
        Prophétæ! Nonne hæc opórtuit pati Christum, et ita intráre in glóriam suam? Et incípiens a
        Móyse et ómnibus Prophétis, interpretabátur illis in ómnibus Scriptúris, quæ de ipso erant.
        Et appropinquavérunt castéllo, quo ibant: et ipse se finxit lóngius ire. Et coëgérunt illum,
        dicéntes: Mane nobiscum, quóniam advesperáscit et inclináta est jam dies. Et intrávit cum
        illis. Et factum est, dum recúmberet cum eis, accépit panem, et benedíxit, ac fregit, et
        porrigébat illis. Et apérti sunt óculi eórum, et cognovérunt eum: et ipse evánuit ex óculis
        eórum. Et dixérunt ad ínvicem: Nonne cor nostrum ardens erat in nobis, dum loquerétur in via,
        et aperíret nobis Scriptúras? Et surgéntes eádem hora regréssi sunt in Jerúsalem: et
        invenérunt congregátas úndecim, et eos, qui cum illis erant, dicéntes: Quod surréxit Dóminus
        vere, et appáruit Simóni. Et ipsi narrábant, quæ gesta erant in via: et quómodo cognovérunt
        eum in fractióne panis.
      en: >-
        At that time, two of the disciples of Jesus went, the same day, to a town which was sixty
        furlongs from Jerusalem, named Emmaus. And they talked together of all these things which
        had happened. And it came to pass, that while they talked and reasoned with themselves,
        Jesus himself also drawing near, went with them. But their eyes were held, that they should
        not know Him. And He said to them: What are these discourses that you hold one with another
        as you walk, and are sad? And the one of them, whose name was Cleophas, answering, said to
        Him: Art thou only a stranger to Jerusalem, and hast not known the things that have been done
        there in these days? To whom He said: What things? And they said: Concerning Jesus of
        Nazareth, who was a prophet, mighty in work and word before God and all the people; And how
        our chief priests and princes delivered Him to be condemned to death, and crucified Him. But
        we hoped, that it was He that should have redeemed Israel: and now besides all this, today is
        the third day since these things were done. Yea and certain women also of our company
        affrighted us, who before it was light, were at the sepulchre, And not finding His body,
        came, saying, that they had also seen a vision of angels, who say that He is alive. And some
        of our people went to the sepulchre, and found it so as the women had said, but Him they
        found not. Then He said to them: O foolish, and slow of heart to believe in all things which
        the prophets have spoken. Ought not Christ to have suffered these things, and so to enter
        into His glory? And beginning at Moses and all the prophets, He expounded to them in all the
        scriptures, the things that were concerning Him. And they drew nigh to the town, whither they
        were going: and He made as though He would go farther. But they constrained Him, saying: Stay
        with us, because it is towards evening, and the day is now far spent. And He went in with
        them. And it came to pass, whilst He was at table with them, He took bread, and blessed, and
        brake, and gave to them. And their eyes were opened, and they knew Him: and He vanished out
        of their sight. And they said one to the other: Was not our heart burning within us, whilst
        He spoke in this way, and opened to us the scriptures? And rising up, the same hour, they
        went back to Jerusalem: and they found the eleven gathered together, and those that were
        staying with them, saying: The Lord is risen indeed, and hath appeared to Simon. And they
        told what things were done in the way; and how they knew Him in the breaking of the bread.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "Pope St. Gregory the Great, Homily 23 on the Gospels"
    text:
      la: >-
        Audístis, fratres caríssimi, quia duóbus discípulis ambulántibus in via, non quidem
        credéntibus, sed tamen de se loquéntibus, Dóminus appáruit: sed eis spéciem, quam
        recognóscerent, non osténdit. Hoc ergo egit foris Dóminus in óculis córporis, quod apud ipsos
        agebátur intus in óculis cordis. Ipsi namque apud semetípsos intus et amábant, et dubitábant:
        eis autem Dóminus foris et præsens áderat, et quis esset non ostendébat. De se ergo
        loquéntibus præséntiam exhíbuit: sed de se dubitántibus cognitiónis suæ spéciem abscóndit.


        Verba quidem cóntulit, durítiam intelléctus increpávit, sacræ Scriptúræ mystéria, quæ de
        seípso erant, apéruit: et tamen quia adhuc in eórum córdibus peregrínus erat a fide, se ire
        lóngius finxit. Fíngere namque, compónere dícimus: unde et compositóres luti, fígulos
        vocámus. Nihil ergo simplex Véritas per duplicitátem fecit: sed talem se eis exhíbuit in
        córpore, qualis apud illos erat in mente. Probándi autem erant, si hi, qui eum etsi necdum ut
        Deum dilígerent, saltem ut peregrínum amáre potuíssent.


        Sed quia esse extránei a caritáte non póterant hi, cum quibus Véritas gradiebátur: eum ad
        hospítium quasi peregrínum vocant. Cur autem dícimus, vocant, cum illic scriptum sit: Et
        coëgérunt eum? Ex quo nimírum exémplo collígitur, quia peregríni ad hospítium non solum
        invitándi sunt, sed étiam trahéndi. Mensam ígitur ponunt, panes cibósque ófferunt: et Deum,
        quem in Scriptúræ sacræ expositióne non cognóverant, in panis fractióne cognóscunt. Audiéndo
        ergo præcépta Dei illumináti non sunt, faciéndo illumináti sunt: quia scriptum est: Non
        auditóres legis justi sunt apud Deum, sed factóres legis justificabúntur. Quisquis ergo vult
        audíta intellégere, festínet ea, quæ jam audíre pótuit, ópere implére. Ecce Dóminus non est
        cógnitus dum loquerétur, et dignátus est cognósci, dum páscitur.
      en: >-
        Dearly beloved brethren, ye hear, how that while two of His disciples walked together in the
        way, not believing in His Resurrection, but talking together concerning Him, the Lord
        manifested Himself unto them, but yet held their eyes that they should not know Him. This
        holding of the eyes of their body, wrought by the Lord, was a figure of the spiritual veil
        which was yet upon the eyes of their heart. For in their heart they loved and yet doubted:
        even as the Lord drew near to them outwardly, but showed not Who He was. To them that talked
        together of Him, He revealed His immediate presence; but hid, from them that doubted, the
        knowledge of His Person.


        He spoke to them; He rebuked the hardness of their heart; He expounded unto them in all the
        Scriptures the things concerning Himself: and, nevertheless, seeing that He was yet a
        stranger to faith in their hearts, He made as though He would have gone further. These words,
        He made as though He would, here seem to mean He feigned, but He Who is simple Truth doth
        nothing with feigning: He only showed Himself to them in bodily manners, as He was towards
        them spiritually; but they were put to the proof whether, though they loved Him not yet as
        their God, they could love Him at least as a wayfarer.


        But since it was impossible, that they with whom Truth walked, should be loveless, they asked
        Him as a wayfarer to take of their hospitality. But why say we that they asked Him, when it
        is written: And they constrained Him? From their example we learn that we ought not only to
        bid, but also to urge, wayfarers to our hospitable entertainment. They laid a table
        therefore, and set before Him bread and meat; and that God Whom they had not known in the
        expounding of the Holy Scripture, they knew in the breaking of bread. In hearing the
        commandments of God they were not enlightened, but they were enlightened in the doing of
        them: as it is written: Not the hearers of the law are just before God, but the doers of the
        law shall be justified. Whosoever therefore will understand that which he heareth, let him
        make haste to practice in his works that which he hath already been able to hear. Behold, the
        Lord was not known while He spake, but He was contented to be known when He broke bread.
    responsory:
      la: "R. María Magdaléne, et áltera María ibant dilúculo ad monuméntum: * Jesum quem quǽritis, non est hic, surréxit sicut locútus est, præcédet vos in Galilǽam, ibi eum vidébitis, allelúia, allelúia.\nV. Et valde mane una sabbatórum véniunt ad monuméntum, orto jam sole: et introëúntes vidérunt júvenem sedéntem in dextris, qui dixit illis.\nR. Jesum quem quǽritis, non est hic, surréxit sicut locútus est, præcédet vos in Galilǽam, ibi eum vidébitis, allelúia, allelúia."
      en: "R. Mary Magdalene and the other Mary went very early to the sepulchre. * That Jesus whom ye seek, is not here: for He is risen, as He said: He goeth before you into Galilee; there shall ye see Him, alleluia, alleluia.\nV. And very early in the morning, the first day of the week, they came unto the sepulchre, at the rising of the sun; and, entering into the sepulchre, they saw a young man sitting upon the right side, who saith unto them:\nR. That Jesus Whom ye seek is not here: for He is risen, as He said: He goeth before you into Galilee: there shall ye see Him, alleluia, alleluia."
    status: { la: verified, en: verified }
