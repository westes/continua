# Matins Nocturn 2 reading for Ss. Faustinus and Jovita, Martyrs (Feb 15)
# — pre-1955-but-post-1617 (no SanctiM/02-15*.txt at all).
# web/www/horas/Latin/Sancti/02-15.txt, English/Sancti/02-15.txt. Single
