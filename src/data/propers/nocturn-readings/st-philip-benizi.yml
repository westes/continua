# Matins Nocturn 2 reading for St. Philip Benizi, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/08-23.txt, English/Sancti/08-23.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-philip-benizi
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Philippus ex nobili Benitiorum familia Florentiæ natus, futuræ sanctitatis jam
        inde ab incunabulis indicium præbuit. Vix enim quintum ætatis mensem ingressus
        linguam in voces mirifice solvit, hortatusque fuit matrem, ut Deiparæ Servis
        eleemosynam impertiret. Adolescens, dum Parisiis litterarum studia cum pietatis
        ardore conjungeret, plurimos ad cælestis patriæ desiderium inflammavit. Reversus
        in patriam, et singulari visione a beatissima Virgine in Servorum suorum
        familiam nuper institutam vocatus, in Senarii montis antrum concessit, ubi
        asperam quidem jugi corporis castigatione, sed Christi Domini cruciatum
        meditatione suavem vitam duxit: indeque per universam pene Europam, magnamque
        Asiæ partem, quam evangelicis prædicationibus obivit, sodalitia Septem Dolorum
        Dei Matris instituit, suumque ordinem eximio virtutum exemplo propagavit.


        Divinæ caritatis et catholicæ fidei dilatandæ ardore vehementer accensus, sui
        ordinis Generalis reluctans atque invitus renuntiatus, fratres ad prædicandum
        Christi Evangelium in Scythiam misit: ipse vero plurimas Italiæ urbes
        concursans, gliscentes in eis civium discordias composuit, multasque ad Romani
        Pontificis obedientiam revocavit; nihilque de studio alienæ salutis omittens,
        perditissimos homines e vitiorum cœno ad pœnitentiam ac Jesu Christi amórem
        perduxit. Orationi summopere addictus, sæpe in extasim rapi visus est.
        Virginitatem vero adeo coluit, ut ad extremum usque spiritum voluntariis ac
        durissimis suppliciis illibatam custodierit.


        Effloruit in eo jugiter singularis erga pauperes misericordia, sed præcipue cum
        apud Camilianum agri Senensis vicum leproso nudo eleemosynam petenti propriam,
        qua indutus erat, vestem fuit elargitus: qua ille contectus, statim a lepra
        mundatus est. Cujus miraculi cum longe lateque fama manasset, nonnulli ex
        cardinalibus, qui Viterbium, Clemente quarto vita functo, pro successore
        deligendo convenerant, in Philippum, cujus cælestem étiam prudentiam perspectam
        habebant, intenderunt. Quo comperto vir Dei, ne forte pastoralis regiminis onus
        subire cogeretur, apud Tuniatum montem tamdiu delituit, donec Gregorius decimus
        Pontifex Maximus fuerit renuntiatus: ubi balneis, quæ étiam hodie sancti
        Philippi vocantur, virtutem sanandi morbos suis precibus impetravit. Denique
        Tuderti, anno millesimo ducentesimo octogesimo quinto in Christi Domini e cruce
        pendentis amplexu, quem suum appellabat librum, sanctissime ex hac vita
        migravit. Ad ejus tumulum cæci visum, claudi gressum, mortui vitam receperunt.
        Quibus aliisque plurimis fulgentem signis Clemens decimus Pontifex Maximus
        sanctorum numero adscripsit.
      en: >-
        This Philip was a scion of the noble Florentine family of the Benizi from his
        very cradle he showed signs of holiness. When he had scarcely entered the fifth
        month of his life, his cries marvellously assumed the form of words, entreating
        his mother to give some alms to the servants of the Mother of God. While he was
        a young man at Paris studying letters, but ever of a fervent piety, he stirred
        up in many the love of our Fatherland which is in heaven. After his return to
        his own country, the most Blessed Virgin appeared to him in a vision, and
        specially called on him to enter the Order of her Servants, which had then been
        newly founded. He withdrew himself to a cave on Monte Senario, where he led a
        life hard as touching the chastisement of the flesh, but sweet with thoughts of
        the agonies of Christ. Thence he came forth and went through nearly all Europe
        and great part of Asia, preaching the Gospel, founding Guilds everywhere in
        honour of the Seven Sorrows of the Mother of God, and extending his Order by the
        wonderful example of his own holy life.


        He was forced against his own wishes to undertake the duties of General of his
        Order, and, in his love of God and of the spreading of the Catholic Faith, sent
        forth brethren to preach the Gospel of Christ in Russia. He himself went through
        many cities of Italy, stilled the raging quarrels of the inhabitants, and
        recalled many of them to their obedience to the Bishop of Rome. He left nothing
        undone to forward the salvation of his neighbour, and brought the most depraved
        wretches to leave the slough of their sins, to do penance, and to love Jesus
        Christ. He was most earnest in prayer, and was often seen to fall into trances
        while engaged in it. Virginity he so prized that to his very last breath he kept
        it unsullied by dint of self-imposed and stern penances.


        Everywhere appeared in him an extraordinary pity towards the poor, whereof it is
        a famous instance that at the village of Camiliano in the territory of Sienna he
        gave his own garment to a naked leper who asked him for an alms, and as soon as
        the said leper had cast it about him he was straightway cleansed of his leprosy.
        The fame of this miracle spread far and wide, and some of the Cardinals who had
        assembled at Viterbo after the death of Clement IV., to elect a successor to
        him, cast their eyes upon Philip, with whose heavenly wisdom they were also
        acquainted. When the man of God found how things stood, lest he should be
        constrained to take upon him the burden of the Pastoral Office, he went and hid
        himself on Montagnate, until Gregory X. had been proclaimed Pope. By his prayers
        he obtained medicinal powers for the waters in these mountains, which are still
        called St. Philip's Baths. At length, (on the 22nd of August,) in the year 1285,
        he departed this life in a most holy manner at Todi, while embracing the image
        of Christ hanging upon the Cross, which he called his book. At his grave the
        blind received their sight, the lame walked, and the dead were raised. Pope
        Clement X., finding him famous for these and many other great signs and wonders,
        enrolled his name among those of the Saints.
    status: { la: verified, en: verified }
