# Matins Nocturn 2 reading for St. Leo IX, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/04-19-LeoIX.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-leo-ix
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Leo hujus nóminis nonus, ex nóbili Francorum prosapia oriundus, Dagsburgénsis comes, ac
        Tullénsis epíscopus, Bruno ántea dictus, ómnium Cardinálium suffrágiis, ac commúni fidélium
        gratulatione, ad sanctíssimam Petri sedem evéctus est, et in ea sedit annis quinque, duóbus
        ménsibus, diébus octo. Vir omni virtútum génere et sacra doctrína exímius, ut Apostolicum
        hoc munus impleret, nullis labóribus, nullis súmptibus, nullis incommodis pepércit.


        Germániam et Itáliam sǽpius, Gálliam semel visitávit. Hábuit novem concilia, Rhemis,
        Mogúntiæ, Vercéllis, Papiæ, Romæ, ad restaurándos Christianórum mores. Multas lítteras ad
        imperatores, reges, patriarchas, epíscopos, zelo ac pietáte flagrantes scripsit. Legátos ad
        imperatorem Constantinopolitanum, pro reductione Græcórum, semel atque íterum misit;
        Berengarium hæréticum semel iterumque damnávit, et Michaélem Cerulárium patriarcham,
        insígnem schismáticum, anathémate pérculit.


        Dum Romæ ágeret, ter in hebdómada a sacrosancta ecclésia Lateranénsi ad Vaticanam, nudis
        pédibus, noctu, orans et psallens pergebat. Principi Apostolórum decimam oblationum partem
        sibi de more competentem, pontifício diplomate cessit. Patrimónium suum próprium in
        erectionem monastérii impéndit: unde étiam quotánnis pecúnia submitteretur in sumptus rosæ
        aureæ, quam Románi Pontífices antiquo et solémni ritu benedicunt. In páuperes et peregrinos
        effusam liberalitátem exércuit. Sub leprosi forma et hábitu Christum aliquándo próprio lecto
        excépit. Dénique multis pro Ecclésia labóribus exantlátis, óbiit die décima nona Aprílis,
        anno millésimo quinquagésimo quarto, ante et post mortem multis miráculis clarus, ac
        sepúltus est in Vaticáno.
      en: >-
        Leo, the ninth of that name, sprung from the noble stock of the Franks, Count of Dagsburg
        and Bishop of Toul, formerly called Bruno, was raised to the most holy see of Peter by the
        votes of all the Cardinals and with the common rejoicing of the faithful, and sat in it five
        years, two months, and eight days. A man eminent in every kind of virtue and in sacred
        doctrine, he spared no labours, no expenses, no inconveniences to fulfil this Apostolic
        office.


        He visited Germany and Italy often, and Gaul once. He held nine councils, at Rheims, Mainz,
        Vercelli, Pavia, and Rome, for the restoration of the morals of Christians. He wrote many
        letters, burning with zeal and piety, to emperors, kings, patriarchs, and bishops. He sent
        legates to the emperor of Constantinople, once and again, for the reunion of the Greeks; he
        condemned Berengarius the heretic once and again, and struck Michael Cerularius, a notorious
        schismatic patriarch, with anathema.


        While he was at Rome, three times a week he used to go by night, barefoot, praying and
        singing psalms, from the most holy Lateran church to the Vatican. To the Prince of the
        Apostles he ceded by pontifical diploma the tenth part of the offerings which by custom
        belonged to himself. He spent his own patrimony on the erection of a monastery, whence money
        was sent every year for the expense of the golden rose, which the Roman Pontiffs bless with
        an ancient and solemn rite. He exercised a poured-out liberality toward the poor and
        pilgrims. Under the form and habit of a leper he once received Christ in his own bed. At
        last, having endured many labours for the Church, he died on the nineteenth day of April, in
        the year one thousand and fifty-four, renowned before and after death for many miracles, and
        was buried in the Vatican.
    status: { la: verified, en: draft }
