# Matins Nocturn 2 reading for St. Joseph, Spouse of the B.V.M.,
# Confessor (Mar 19) — SanctiM/03-19.txt's own Lectio2-9 all resolve
# back to `@Sancti/03-19:LectioN` (resliced for the Monastic 9/12-lesson
# structure with its own added responsories), so this saint's own
# proper content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/03-19.txt, English/Sancti/03-19.txt.
# Lectio4-6 (St. Bernard's sermon comparing Joseph the Patriarch to
# Joseph the husband of Mary) combined into one reading, one continuous
# excerpt. Lectio7-9 reference `@Sancti/12-24:Lectio1-3` (Christmas
# Eve's own Nocturn 1 scripture reading) — not proper to Joseph, so not
# authored here. No responsory given for Lectio4-6.
#
# Update (2026-09-05): St. Bernard's homily is "Homily 2 super Missus
# est", his treatise on the Annunciation Gospel (Luke 1:26-38, the
# "Missus est" pericope) — that Gospel itself is now authored too
# (isGospel: true, immediately before the homily), even though it isn't
# actually proclaimed at Matins here (Lectio1-3 are Genesis readings on
# Joseph the Patriarch, not this Gospel) — it's the text the homily is
# preached on. Latin sourced from missa/Latin/Tempora/Adv3-3.txt (Ember
# Wednesday of Advent shares this same full pericope verbatim); English
# from missa/English/Sancti/03-25.txt (the Annunciation's own Mass
# Gospel, same citation "Luke 1:26-38").
id: st-joseph
readings:
  - nocturn: 2
    isGospel: true
    citation: { la: "Luc 1:26-38", en: "Luke 1:26-38" }
    text:
      la: >-
        In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilǽæ, cui nomen Názareth, ad Vírginem
        desponsátam viro, cui nomen erat Joseph, de domo David, et nomen Vírginis María. Et ingréssus Angelus ad
        eam, dixit: Ave, grátia plena; Dóminus tecum: benedícta tu in muliéribus. Quæ cum audísset, turbáta est in
        sermóne ejus: et cogitábat, qualis esset ista salutátio. Et ait Angelus ei: Ne tímeas, María, invenísti enim
        grátiam apud Deum: ecce, concípies in útero, et páries fílium, et vocábis nomen ejus Jesum. Hic erit
        magnus, et Fílius Altíssimi vocábitur, et dabit illi Dóminus Deus sedem David, patris ejus: et regnábit in
        domo Jacob in ætérnum, et regni ejus non erit finis. Dixit autem María ad Angelum: Quómodo fiet istud,
        quóniam virum non cognósco? Et respóndens Angelus, dixit ei: Spíritus Sanctus supervéniet in te, et virtus
        Altíssimi obumbrábit tibi. Ideóque et quod nascétur ex te Sanctum, vocábitur Fílius Dei. Et ecce, Elísabeth,
        cognáta tua, et ipsa concépit fílium in senectúte sua: et hic mensis sextus est illi, quæ vocátur stérilis:
        quia non erit impossíbile apud Deum omne verbum. Dixit autem María: Ecce ancílla Dómini, fiat mihi secúndum
        verbum tuum.
      en: >-
        At that time, the angel Gabriel was sent from God to a town of Galilee called Nazareth, to a virgin
        betrothed to a man named Joseph, of the house of David, and the virgin's name was Mary. And when the angel
        had come to her, he said, Hail, full of grace, the Lord is with you. Blessed are you among women. When she
        had heard him she was troubled at his word, and kept pondering what manner of greeting this might be. And
        the angel said to her, Do not be afraid, Mary, for you have found grace with God. Behold, you shall
        conceive in your womb and shall bring forth a Son; and you shall call His name Jesus. He shall be great,
        and shall be called the Son of the Most High; and the Lord God will give Him the throne of David His
        father, and He shall be king over the house of Jacob forever; and of His kingdom there shall be no end.
        But Mary said to the angel, How shall this happen, since I do not know man? And the angel answered and
        said to her, The Holy Spirit shall come upon you, and the power of the Most High shall overshadow you; and
        therefore the Holy One to be born shall be called the Son of God. And behold, Elizabeth your kinswoman
        also has conceived a son in her old age, and she who was called barren is now in her sixth month; for
        nothing shall be impossible with God. But Mary said, Behold the handmaid of the Lord; be it done to me
        according to your word.
    status: { la: verified, en: verified }

  - nocturn: 2
    isGospel: false
    source: "St. Bernard of Clairvaux, Abbot, Homily 2 on Luke 1:26 (Missus est)"
    text:
      la: >-
        Quis et qualis homo fúerit beátus Joseph, cónice ex appellatióne, qua, licet
        dispensatória, méruit honorári ádeo, ut pater Dei et dictus et créditus sit; cónice et ex
        próprio vocábulo, quod augméntum non dúbitas interpretári. Simul et meménto magni illíus
        quondam Patriárchæ vénditi in Ægýpto; et scito ipsíus istum non solum vocábulum fuísse
        sortítum, sed et castimóniam adéptum, innocéntiam assecútum et grátiam.


        Síquidem ille Joseph, fratérna ex invídia vénditus et ductus in Ægýptum, Christi
        venditiónem præfigurávit: iste Joseph, Herodiánam invídiam fúgiens, Christum in Ægýptum
        portávit. Ille dómino suo fidem servans, dóminæ nóluit commiscéri: iste Dóminam suam,
        Dómini sui matrem, vírginem agnóscens et ipse cóntinens, fidéliter custodívit. Illi data
        est intellegéntia in mystériis somniórum: isti datum est cónscium fíeri atque partícipem
        cæléstium sacramentórum.


        Ille fruménta servávit non sibi, sed omni pópulo: iste Panem vivum e cælo servándum
        accépit tam sibi quam toti mundo. Non est dúbium, quin bonus et fidélis homo fúerit iste
        Joseph, cui Mater desponsáta est Salvatóris. Fidélis, inquam, servus, et prudens, quem
        constítuit Dóminus suæ Matris solátium, suæ carnis nutrítium, solum dénique in terris
        magni consílii coadjutórem fidelíssimum.
      en: >-
        What and what manner of man the blessed Joseph was, we may gather from that title
        wherewith, albeit only as a deputy, God deemed him fit to be honoured; he was both called,
        and supposed to be the Father of God. We may gather it from his very name, which, being
        interpreted, signifieth Increase. Remember likewise that great Patriarch who was sold into
        Egypt, and know that the Husband of Mary not only received his name, but inherited his
        purity, and was likened to him in innocence and in grace.


        If then, that Joseph that was sold by his brethren through envy, and was brought down to
        Egypt, was a type of Christ sold by a disciple, and handed over to the Gentiles, the other
        Joseph flying from the envy of Herod carried Christ into Egypt. That first Joseph kept
        loyal to his master, and would not carnally know his master's wife; that second Joseph knew
        that the Lady, the Mother of his Lord, was a virgin, and he himself remained faithfully
        virgin toward her. To that first Joseph it was given to know dark things in interpreting of
        dreams; to the second Joseph it was given in sleep to know the mysteries of the kingdom of
        heaven.


        The first Joseph laid by bread, not for himself, but for all people; the second Joseph
        received into his keeping that Living Bread Which came down from heaven, not for him only,
        but for the whole world. We cannot doubt but that that Joseph was good and faithful to whom
        was espoused the Mother of the Saviour. Yea, I say, he was a faithful and wise servant, whom
        the Lord appointed to be the comfort of His own Mother, the keeper of His own Body, and the
        only and trusty helper in the Eternal Counsels.
    status: { la: verified, en: verified }
