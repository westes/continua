# Matins Nocturn 2-3 readings for St. Pius X, Pope and Confessor
# (Sep 3). Sourced directly from web/www/horas/Latin/Sancti/09-03.txt,
# English/Sancti/09-03.txt. Nocturn 2: Lectio4-6 combined into one
# reading, one continuous vita.
#
# Update (2026-09-05): Nocturn 3's Gospel pericope, previously left
# unauthored because Lectio7 gives only the incipit ("Et réliqua"), is
# now authored too (isGospel: true, immediately before the homily) --
# fittingly, since St. Augustine's homily (Tractatus 123 on John, "in
# medio") is itself a commentary on Christ's threefold charge to Peter
# to feed His sheep, the citation is John 21:15-17, sourced from
# missa/Latin/Sancti/09-03.txt's own [Evangelium] (the Mass Gospel and
# the Matins Nocturn 3 Gospel are the same pericope), not guessed at.
id: st-pius-x
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Pius Papa décimus, cui nomen ántea Joséphus Sarto, in Venetórum
        pago natus est, quem Riése vocant, paréntibus quidem humílibus,
        sed probitáte ac pietáte conspícuus. Inter Seminárii Patavíni
        alúmnos adscríptus, ita pietáte ac doctrína profécit, ut
        condiscípulis exémplo, moderatóribus admiratióni esset. Sacerdótio
        initiátus, in óppido Tómbolo primum, qua vicárius cooperátor,
        dein Salatiáni qua párochus, per plures annos adlaborávit; quibus
        in obeúndis munéribus, tanta caritátis effusióne, tanto
        sacerdotáli zelo et sanctitáte vitæ excélluit, ut Epíscopus
        Tarvisínus inter canónicos cathedrális ecclésiæ eum cooptáret,
        eúmque Cúriæ episcopális cancellárium simúlque Seminárii
        diœcesáni spirituálem moderatórem renuntiáret. Hæc offícia tam
        egrégie persecútus, a Leóne tértio décimo, cui erat probatíssimus,
        Mantuánæ ecclésiæ Antístes fuit renuntiátus.


        Boni pastóris nullam partem déserens, eo máxime conténdit, ut
        juvéntus in sortem Dómini vocáta rite ad sacra instituerétur, piæ
        consociatiónes novis augéscerent increméntis, rítibus divíni
        cultus plus decóris ac pietátis accéderet. Præcépta quibus cívitas
        christiána nítitur, áltius proclamáre non désiit, et qui vitam
        ínopem ipse ducébat, paupéribus numquam omísit afférre levámen.
        Tot ígitur suffragántibus méritis, inter purpurátos Patres
        adléctus et Venetiárum Patriárcha creátus est. Dénique post Leónis
        décimi tértii óbitum, cum Patrum Cardinálium suffrágia in eum
        coaléscerent, cumque ipse supplicatiónibus et lácrimis tantum
        munus a se avértere frustra conátus esset, suasiónibus tandem
        cedens, « accépto in crucem », inquit, et Summi Pontificátus
        ápicem ut crucem a Deo sibi oblátam, demísso sed forti ánimo
        suscépit.


        In Petri cáthedra constitútus, nihil de prístina vitæ ratióne
        remísit. Humilitáte præsértim, simplicitáte ac paupertáte
        refúlsit, ita ut in suo testaménto scríbere potúerit: « Pauper
        natus sum, pauper vixi, pauper mori cúpio ». Humílitas vero ánimi
        fortitúdinem in eo alébat, cum de Dei glória, Ecclésiæ libertáte,
        animarúmque salúte agerétur. Vir acérrimi ingénii et propósiti
        tenax, inter vicésimi ineúntis sæculi procéllas, Ecclésiam
        fírmiter rexit, et præclaríssimis ornávit institútis. Músicam
        sacram ad prístinum splendórem ac dignitátem revocávit; sacrórum
        Bibliórum stúdiis príncipem sedem Romæ constítuit; Románam Cúriam
        sapiénter reformávit; leges de fidélibus per catechísmum
        instituéndis restítuit; Eucharísticæ mensæ crebriórem, imo et
        cotidiánam consuetúdinem indúxit, ejúsque accéssum púeris quoque
        a primo ratiónis usu apéruit; actiónis cathólicæ increménta
        sédulo promóvit; sólidæ cleri institutióni provídit, ádditis
        quoque semináriis per regiónes dispósitis; sacerdótes omnes ad
        interiórem vitam coléndam alléxit; leges Ecclésiæ in unum corpus
        redégit; erróres perniciosíssimos, modernísmi appellatióne
        comprehénsos, damnávit atque evéllit; civíle vétitum, quod dicunt,
        in Pontíficis Máximi electióne rejécit. Tandem labóribus fractus
        ac mæróre conféctus ob bellum Europæum tunc exórtum, die vicésima
        mensis Augústi anni millésimi nongentésimi décimi quarti, ad
        cæléste præmium evolávit. Eum ubíque terrárum sanctitátis fama
        clarum miraculísque fulgéntem, Pius Papa duodécimus, cuncto
        plaudénte orbe, in Sanctórum númerum rétulit.
      en: >-
        Pope Pius X, whose name previously was Joseph Sarto, was born in
        the village of Riese in the Venetian province, to humble parents
        remarkable for their godliness and piety. He enrolled among the
        students in the seminary of Padua, where he exhibited such piety
        and learning that he was both an example to his fellow students and
        the admiration of his teachers. Upon his ordination to the
        priesthood, he labored for several years first as curate in the
        town of Tombolo, then as pastor at Salzano. He applied himself to
        his duties with such a constant flow of charity and such priestly
        zeal, and was so distinguished by the holiness of his life, that
        the Bishop of Treviso appointed him as a canon of the cathedral
        church and made him the chancellor of the bishop's curia, as well
        as spiritual director of the diocesan seminary. His performance in
        these duties was so outstanding and so highly impressed Leo XIII,
        that he made him bishop of the Church of Mantua.


        Lacking in nothing that makes a good pastor, he labored
        particularly to teach young men called to the priesthood, as well
        as fostering the growth of devout associations and the beauty and
        dignity of divine worship. He would ever affirm and promote the
        laws upon which Christian civilization depend, and while leading
        himself a life of poverty, never missed the opportunity to
        alleviate the burden of poverty in others. Because of his great
        merits, he was made a cardinal and created Patriarch of Venice.
        After the death of Pope Leo XIII, when the votes of the College of
        Cardinals began to increase in his favor, he tried in vain with
        supplications and tears to be relieved of so heavy a burden.
        Finally he ceded to their persuasions, saying: I accept the cross.
        Thus he accepted the crown of the supreme pontificate as a cross,
        offering himself to God, with a resigned but stedfast spirit.


        Placed upon the chair of Peter, he gave up nothing of his former
        way of life. He shone especially in humility, simplicity and
        poverty, so that he was able to write in his last testament: I was
        born in poverty, I lived in poverty, and I wish to die in poverty.
        His humility, however, nourished his soul with strength, when it
        concerned the glory of God, the liberty of Holy Church, and the
        salvation of souls. A man of passionate temperament and of firm
        purpose, he ruled the Church firmly as it entered into the
        twentieth century, and adorned it with brilliant teachings. He
        restored the sacred music to its pristine glory and dignity; he
        established Rome as the principal centre for the study of the Holy
        Bible; he ordered the reform of the Roman Curia with great wisdom;
        he restored the laws concerning the faithful for the instruction of
        the catechism; he introduced the custom of more frequent and even
        daily reception of the Holy Eucharist, as well as permitting its
        reception by children as soon as they reach the age of reason; he
        zealously promoted the growth of Catholic action; he provided for
        the sound education of clerics and increased the number of
        seminaries in their diverse regions; he encouraged every priest in
        the practice of the interior life; he brought the laws of the
        Church together into one body; he condemned and suppressed those
        most pernicious errors known collectively as Modernism; he
        suppressed the custom of civil veto at the election of a Supreme
        Pontiff. Finally worn out with his labors and overcome with grief
        at the European war which had just begun, he went to his heavenly
        reward on the twentieth day of August in the year 1914. Renowned
        throughout all the world for the fame of his holiness and miracles,
        Pope Pius XII, with the approbation of the whole world, numbered
        him among the Saints.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Joannes 21:15-17", en: "John 21:15-17" }
    text:
      la: >-
        In illo témpore, dicit Jesus Simóni Petro: Simon Joánnis, díligis me plus his? Dicit ei:
        Etiam Dómine, tu scis quia amo te. Dicit ei: Pasce agnos meos. Dicit ei íterum: Simon
        Joánnis, díligis me? Ait illi: Etiam Dómine, tu scis quia amo te. Dicit ei: Pasce agnos
        meos. Dicit ei tértio: Simon Joánnis, amas me? Contristátus est Petrus, quia dixit ei
        tértio: Amas me? et dixit ei: Dómine, tu ómnia nosti, tu scis quia amo te. Dixit ei: Pasce
        oves meas.
      en: >-
        At that time, Jesus said to Simon Peter, Simon, son of John, do you love Me more than
        these do? He said to Him, Yes, Lord, You know that I love You. He said to him, Feed My
        lambs. He said to him a second time, Simon, son of John, do you love Me? He said to Him,
        Yes, Lord, You know that I love You. He said to him, Feed My lambs. And a third time He
        said to him, Simon, son of John, do you love Me? Peter was grieved because He said to him
        for the third time, Do you love Me? And he said to Him, Lord, You know all things, You
        know that I love You. He said to him, Feed My sheep.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine of Hippo, Tractate 123 on John (in the middle)"
    text:
      la: >-
        Rédditur negatióni trinæ trina conféssio, ne minus amóri lingua
        sérviat, quam timóri: et plus vocis elicuísse videátur mors
        ímminens, quam vita præsens. Sit amóris offícium páscere Domínicum
        gregem, si fuit timóris indícium negáre pastórem. Qui hoc ánimo
        pascunt oves Christi, ut suas velint esse, non Christi, se
        convincúntur amáre, non Christum: vel gloriándi vel dominándi,
        vel acquiréndi cupiditáte; non obediéndi, et subveniéndi, et Deo
        placéndi caritáte.


        Contra hos ergo vígilat tótidem inculcáta ista vox Christi, quos
        Apóstolos gemit sua quærere, non quæ Jesu Christi. Nam quid est
        áliud, si díligis me, pasce oves meas; quam si dicerétur, si me
        díligis, non te páscere cógita? Sed oves meas, et sicut meas
        pasce, non sicut tuas; glóriam meam in eis quære, non tuam;
        domínium meum, non tuum; lucra mea, non tua; ne sis in eórum
        societáte qui pértinent ad témpora periculósa, seípsos amántes,
        et cétera quæ huic malórum inítio connectúntur.


        Mérito dícitur Petro: díligis me, et respóndet, amo te, eíque
        refértur, pasce agnos meos, et hoc íterum, hoc tértio. Ubi étiam
        demonstrátur unum atque idem esse amórem et dilectiónem; nam
        étiam Dóminus novíssime non ait, díligis me, sed amas me. Non
        ergo nos, sed ipsum amémus, et in pascéndis óvibus ejus ea quæ
        sunt ejus, non ea quæ sunt nostra, quærámus. Néscio enim quo
        inexplicábili modo, quisquis seípsum, non Deum amat, non se amat:
        et quisquis Deum, non seípsum, amat, ipse se amat. Qui enim non
        potest vívere de se, móritur útique amándo se: non ergo se amat,
        qui ne vivat se amat.
      en: >-
        To the threefold denial there is now appended a threefold
        confession, that his tongue may not yield a feebler service to
        love than to fear, and imminent death may not appear to have
        elicited more from his lips than present life. Let it be the
        office of love to feed the Lord's flock, if it was the signal of
        fear to deny the Shepherd. Those who have this purpose in feeding
        the flock of Christ, that they may have them as their own, and not
        as Christ's, are convicted of loving themselves, and not Christ,
        from the desire either of boasting, or wielding power, or
        acquiring gain, and not from the love of obeying, serving and
        pleasing God.


        Against such, therefore, there standeth as a wakeful sentinel this
        thrice inculcated utterance of Christ, of whom the Apostle
        complaineth that they seek their own, not the things that are of
        Christ Jesus. For what else signifieth the words: Lovest thou me?
        Feed my sheep: than if it were said: If thou lovest me, think not
        of feeding thyself, but feed my sheep as mine, and not as thine
        own; seek my glory in them, and not thine own; my dominion, and
        not thine; my gain, and not thine; lest thou be found in the
        fellowship of them that belong to the perilous times, lovers of
        their own selves, and all else that is joined on to this beginning
        of evils.


        With great propriety, therefore, is Peter addressed: Lovest thou
        me? and found replying: I love thee; and the command applied to
        him: Feed my lambs, and this a second and a third time. We have it
        also demonstrated here that love and liking are one and the same
        thing; for the Lord also in the last question said not: Dost thou
        like me? but: Dost thou love me? Let us, then, love not ourselves
        but him; and in feeding his sheep, let us be seeking the things
        which are his, not the things which are our own. For in some
        inexplicable way, I know not what, every one that loveth himself,
        and not God, loveth not himself; and whoever loveth God, and not
        himself, he it is that loveth himself.
    status: { la: verified, en: verified }
