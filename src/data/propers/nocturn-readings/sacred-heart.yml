# Matins nocturn content for the Most Sacred Heart of Jesus (temporalId
# sacred-heart, Duplex I classis cum Octava). Sourced from
# Tempora/Pent02-5.txt (Latin) / English/Tempora/Pent02-5.txt, and the
# Gospel pericope's full text from missa/Latin+English/Tempora/Pent02-5.txt's
# own [Evangelium] (the Matins file itself only gives the incipit + "Et
# réliqua" for Lectio7, per this project's Gospel/homily-split convention).
#
# No separate Divino Afflatu-era text was found in the reference tree for
# this feast's Matins content -- only this one secular/Tridentine
# Tempora/Pent02-5.txt (9-lesson, matching the "(rubrica 196)" 1955/1960
# reduction already noted in sacred-heart.yml's own header) and a
# Monastic TemporaM/Pent02-5.txt, which is a 12-lesson remix of this same
# secular file's own lessons (via @-references and regex substitutions),
# not independently-sourced content. Used the secular file directly,
# consistent with the collect/antiphons already authored from it.
#
# The audit found this id registered in ALWAYS_OVERRIDE_TEMPORAL_IDS but
# never authored at all. Nocturn 1 (Lectio1-3, Jeremiah) left unauthored
# here per this project's convention of leaving Nocturn 1 scripture to
# the bible-plan store.
#
# Nocturn 2: Lectio4-6 (the feast's own historical lections, on the
# devotion's growth through St. John Eudes, St. Margaret Mary Alacoque,
# and its papal approval/extension) combined into one continuous excerpt.
# Nocturn 3: the Gospel pericope (John 19:31-37, the piercing of Christ's
# side) authored in full (isGospel: true), followed by Lectio7's homily
# portion (incipit dropped) combined with Lectio8-9 as one continuous
# excerpt of St. Bonaventure's own writing on the pierced Heart.
id: sacred-heart
readings:
  - nocturn: 2
    isGospel: false
    source: "Matins Lesson (historical), Feast of the Most Sacred Heart"
    text:
      la: >-
        Inter mira sacræ doctrínæ pietatísque increménta, quibus divínæ Sapiéntiæ
        consília clárius in dies Ecclésiæ manifestántur, vix áliud magis conspícuum est
        quam triumphális progréssio cultus sacratíssimi Cordis Jesu. Sǽpius quidem,
        priórum decúrsu témporum, Patres, Doctóres, Sancti, Redemptóris nostri amórem
        celebrárunt: vulnus in látere Christi apértum ómnium gratiárum arcánum dixérunt
        fontem. At inde a médio ævo, cum tenerióre quadam erga sanctíssimam Salvatóris
        Humanitátem religióne fidéles áffici cœpti sunt, ánimæ contemplatívæ per plagam
        illam ad ipsum Cor, amóre hóminum vulnerátum, penetráre fere solébant. Atque ex
        eo témpore hæc contemplátio sanctíssimis quibúsque ita familiáris evásit, ut
        neque régio neque ordo religiósus sit, in quibus non insígnia, hac ætáte, ejus
        reperiántur testimónia. Próximis demum sǽculis, eóque potíssimum témpore quo
        hærétici, sub falsæ pietátis título, a sanctíssima Eucharístia Christiános
        detérrere conabántur, cultus sacratíssimo Cordi públice exhibéri cœptus est,
        ópera imprímis sancti Joánnis Eudes, qui auctor litúrgici cultus sacrórum
        Córdium Jesu et Maríæ haud immérito nuncupátur.


        Verum, ad cultum sacratíssimi Cordis Jesu plene perfectéque constituéndum,
        eundémque per totum orbem propagándum, Deus ipse sibi instruméntum elégit
        humíllimam ex órdine Visitatiónis vírginem, sanctam Margarítam Maríam Alacóque,
        cui, a prima quidem ætáte jam in Eucharístiæ Sacraméntum amóre flagránti,
        Christus Dóminus sæpenúmero appárens, divíni Cordis sui et divítias et optáta
        significáre dignátus est. Quarum apparitiónum celebérrima illa est, qua ei ante
        Eucharístiam oránti Jesus conspiciéndum se dedit, sacratíssimum Cor osténdit et
        conquéstus quod, pro imménsa sua caritáte, nihil nisi ingratórum hóminum
        contumélias recíperet, ipsi præcépit ut novum festum, féria sexta post Octávam
        Córporis Christi, instituéndum curáret, quo Cor suum honóre débito colerétur,
        atque injúriæ sibi in Sacraménto amóris a peccatóribus illátæ dignis
        expiaréntur obséquiis. Quot autem quantásque Dei fámula in Christi mandátis
        exsequéndis expérta sit difficultátes, nemo est qui ignóret; sed ab ipso Dómino
        confirmáta, atque a religiósis ánimæ suæ moderatóribus, qui incredíbili quodam
        ardóre ad hunc cultum promovéndum laborárunt, strénue adjúta, múnere sibi
        cǽlitus commísso fidéliter fungi ad mortem usque non déstitit.


        Anno tandem millésimo septingentésimo sexagésimo quinto, Clemens décimus
        tértius Póntifex Máximus offícium et missam in honórem sacratíssimi Cordis Jesu
        approbávit; Pius vero nonus festum ad univérsam Ecclésiam exténdit. Exínde,
        cultus sacratíssimi Cordis, quasi flumen exúndans, prolútis impediméntis
        ómnibus, per totum se orbem effúdit, et, novo illucescénte sǽculo, jubilǽo
        indícto, Leo décimus tértius humánum genus univérsum sacratíssimo Cordi devótum
        vóluit. Quæ consecrátio, in ómnibus quidem cathólici orbis ecclésiis, solémni
        ritu perácta, ingens áttulit devotiónis hujus increméntum, et ad eam non solum
        pópulos, verum étiam singuláres famílias addúxit, quæ Divíno Cordi
        innumerábiles se dévovent, regióque ejus império subíciunt. Dénique, Pius
        undécimus Póntifex Máximus, quo plénius festi solémnitas pópuli christiáni
        devotióni tam late paténti respondéret, sacratíssimi Cordis Jesu festum ad
        ritum dúplicem primæ classis cum octáva evéxit; ac prætérea, ut violáta jura
        Christi summi Regis ac Dómini amantíssimi resarciréntur, populorúmque peccáta
        defleréntur, eódem festo die piaculárem precatiónem in ómnibus christiáni orbis
        templis quotánnis recitándam mandávit.
      en: >-
        Among the wonderful advances of sacred doctrine and devotion, whereby the
        counsels of the divine Wisdom are made ever clearer to the Church day by day,
        scarcely anything is more conspicuous than the triumphant progress of the
        devotion to the Most Sacred Heart of Jesus. Often indeed, in earlier times, the
        Fathers, Doctors, and Saints celebrated the love of our Redeemer, and called the
        wound opened in Christ's side the hidden fountain of all graces. But from the
        Middle Ages onward, as the faithful began to be moved by a more tender devotion
        toward the most holy Manhood of the Saviour, contemplative souls were wont to
        penetrate, through that wound, to the very Heart itself, wounded by love of men.
        And from that time this contemplation became so familiar to holy souls that
        there is neither region nor religious order in which notable witnesses of it are
        not found in that age. In more recent centuries, and especially in the time when
        heretics, under the pretext of a false piety, were striving to deter Christians
        from the most holy Eucharist, public devotion to the Most Sacred Heart began to
        be shown, chiefly through the work of St. John Eudes, who is not unworthily
        called the author of the liturgical cult of the Sacred Hearts of Jesus and Mary.


        But to establish the devotion to the Most Sacred Heart of Jesus fully and
        perfectly, and to spread it throughout the whole world, God Himself chose as His
        instrument a most humble virgin of the Order of the Visitation, St. Margaret
        Mary Alacoque, to whom, from her earliest years already burning with love for
        the Sacrament of the Eucharist, the Lord Christ, appearing to her many times,
        deigned to show forth both the riches and the desires of His divine Heart. The
        most famous of these apparitions is that in which, as she prayed before the
        Blessed Sacrament, Jesus showed Himself to her, revealed His Most Sacred Heart,
        and, lamenting that in return for His boundless love He received nothing but
        the contempt of ungrateful men, commanded her to see to it that a new feast be
        instituted, on the Friday after the Octave of Corpus Christi, whereby His Heart
        might be honored with due reverence, and the injuries inflicted on Him in the
        Sacrament of love by sinners might be worthily atoned for. No one is ignorant of
        how many and how great difficulties this handmaid of God endured in carrying
        out Christ's commands; but, confirmed by the Lord Himself, and vigorously
        assisted by the spiritual directors of her soul, who labored with incredible
        zeal to promote this devotion, she did not cease faithfully to fulfil the office
        entrusted to her from heaven, even unto death.


        At length, in the year one thousand seven hundred and sixty-five, Pope Clement
        the Thirteenth approved the office and Mass in honor of the Most Sacred Heart of
        Jesus; and Pope Pius the Ninth extended the feast to the universal Church.
        Thenceforth the devotion to the Most Sacred Heart, like an overflowing river,
        having burst through every obstacle, spread itself throughout the whole world,
        and, as the new century dawned, Pope Leo the Thirteenth, proclaiming a jubilee,
        willed that the whole human race be consecrated to the Most Sacred Heart. This
        consecration, solemnly carried out in all the churches of the Catholic world,
        brought a great increase of this devotion, and drew to it not only peoples but
        also individual families, who devote themselves in countless numbers to the
        Divine Heart and submit themselves to His royal rule. Finally, Pope Pius the
        Eleventh, that the solemnity of the feast might more fully answer to the
        widespread devotion of the Christian people, raised the feast of the Most
        Sacred Heart of Jesus to the rite of a Double of the First Class with an Octave;
        and moreover, that the violated rights of Christ the supreme King and most
        loving Lord might be repaired, and the sins of peoples bewailed, he commanded
        that on that same feast day an expiatory prayer be recited every year in all
        the churches of the Christian world.
    responsory:
      la: "R. Omnes gentes quascúmque fecísti, vénient * Et adorábunt coram te, Dómine.\nV. Et glorificábunt nomen tuum, quóniam magnus es tu, et fáciens mirabília.\nR. Et adorábunt coram te, Dómine."
      en: "R. All nations whom thou hast made shall come * and worship before thee, O Lord.\nV. And they shall glorify thy name, for thou art great and doest wondrous things.\nR. And worship before thee, O Lord."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Joann 19:31-37", en: "John 19:31-37" }
    text:
      la: >-
        In illo témpore: Judǽi, quóniam Parascéve erat, ut non remanérent in cruce
        córpora sábbato (erat enim magnus dies ille sábbati), rogavérunt Pilátum, ut
        frangeréntur eórum crura, et tolleréntur. Venérunt ergo mílites: et primi quidem
        fregérunt crura et alteríus, qui crucifíxus est cum eo. Ad Jesum autem cum
        veníssent, ut vidérunt eum jam mórtuum, non fregérunt ejus crura, sed unus
        mílitum láncea latus ejus apéruit, et contínuo exívit sanguis et aqua. Et qui
        vidit, testimónium perhíbuit: et verum est testimónium ejus. Et ille scit quia
        vera dicit, ut et vos credátis. Facta sunt enim hæc ut Scriptúra implerétur: Os
        non comminuétis ex eo. Et íterum alia Scriptúra dicit: Vidébunt in quem
        transfixérunt.
      en: >-
        At that time, the Jews, since it was the Preparation Day, in order that the
        bodies might not remain upon the cross on the Sabbath — for that Sabbath was a
        solemn day — besought Pilate that their legs might be broken, and that they
        might be taken away. The soldiers therefore came and broke the legs of the
        first, and of the other, who had been crucified with Him. But when they came to
        Jesus, and saw that He was already dead, they did not break His legs; but one of
        the soldiers opened His side with a lance, and immediately there came out blood
        and water. And he who saw it has borne witness, and his witness is true; and he
        knows that he tells the truth, that you also may believe. For these things came
        to pass that the Scripture might be fulfilled, Not a bone of Him shall you
        break. And again another Scripture says, They shall look upon Him Whom they
        have pierced.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Bonaventure, Bishop, The Tree of Life, n. 30, and On the Mystical Vine, ch. 3"
    text:
      la: >-
        Ut de látere Christi dormiéntis in cruce formarétur Ecclésia, et Scriptúra
        implerétur quæ dicit: Vidébunt in quem transfixérunt: divína est ordinatióne
        indúltum ut unus mílitum láncea latus illud sacrum aperiéndo perfóderet,
        quátenus sánguine cum aqua manánte, prétium effunderétur nostræ salútis quod a
        fonte scílicet Cordis arcáno profúsum, vim daret sacraméntis Ecclésiæ ad vitam
        grátiæ conferéndam, essétque jam in Christo vivéntibus póculum fontis vivi,
        saliéntis in vitam ætérnam. Surge ígitur, ánima amíca Christi, vigiláre non
        cesses, ibi os appóne, ut háurias aquas de fóntibus salvatóris.


        Quia semel vénimus ad Cor Dómini Jesu dulcíssimi, et bonum est nos hic esse, non
        fácile evellámur ab eo. O quam bonum et jucúndum habitáre in Corde hoc. Bonus
        thesáurus, pretiósa margaríta Cor tuum, óptime Jesu, quam, fosso agro córporis
        tui, invenímus. Quis hanc margarítam abíciat? Quin pótius, dabo omnes
        margarítas, cogitatiónes et affectiónes meas commutábo et comparábo illam mihi,
        jactans omnem cogitátum meum in Cor boni Jesu, et sine fallácia illud me
        enútriet. Hoc ígitur tuo et meo Corde, dulcíssime Jesu, invénto, orábo te Deum
        meum: admítte in sacrárium exauditiónis preces meas: immo me totum trahe in Cor
        tuum.


        Ad hoc enim perforátum est latus tuum, ut nobis páteat intróitus. Ad hoc
        vulnerátum est Cor tuum, ut in illo ab exterióribus turbatiónibus absolúti
        habitáre possímus. Nihilóminus et proptérea vulnerátum est, ut per vulnus
        visíbile, vulnus amóris invisíbile videámus. Quómodo hic ardor mélius posset
        osténdi, nisi quod non solum corpus, verum étiam ipsum Cor láncea vulnerári
        permísit? Carnále ergo vulnus, vulnus spirituále osténdit. Quis illud Cor tam
        vulnerátum non díligat? quis tam amántem non rédamet? quis tam castum non
        amplectátur? Nos ígitur adhuc in carne manéntes, quantum póssumus, amántem
        redamémus, amplectámur vulnerátum nostrum, cujus ímpii agrícolæ fodérunt manus
        et pedes, latus et Cor; oremúsque ut cor nostrum, adhuc durum et impœ́nitens,
        amóris sui vínculo constríngere et jáculo vulneráre dignétur.
      en: >-
        In order that the Church might be taken out of the side of Christ, in his deep
        sleep on the Cross, and that the Scripture might be fulfilled which saith: They
        shall look on him whom they pierced: it was divinely ordained that one of the
        soldiers should pierce his sacred side with a spear, and open it. Then forthwith
        there came flowing out blood and water, which was the price of our salvation,
        pouring forth from its mountain-source, in sooth, from the secret places of his
        Heart, to give power to the Sacraments of the Church, to bestow the life of
        grace, and to be as a saving drink of living waters, flowing up to life eternal
        for those who were already quickened in Christ. Arise, then, O soul beloved of
        Christ. Cease not thy vigilance, place there thy lips, and drink the waters from
        the fount of salvation.


        Because we are now come to the sweet Heart of Jesus, and because it is good for
        us to be here, let us not too soon turn away therefrom. O how good and joyful a
        thing it is to dwell in this Heart. What a good treasure, what a precious pearl,
        is thy Heart, O most excellent Jesu, which we have found hidden in the field of
        thy body. Who would cast away such a pearl? Nay, rather, for this same I would
        give all my pearls. I will sell all my thoughts and affections, and buy the same
        for myself, turning all my thoughts to the Heart of the good Jesus, and without
        fail it will support me. Therefore, O most sweet Jesu, having found this Heart
        that is thine and mine, I will pray to thee, my God: admit my prayers into the
        shrine of hearkening; and draw me even more altogether into thy Heart.


        For to this end was thy side pierced, that an entry might be open unto us. To
        this end was thy Heart wounded, that in it we might be able to dwell secure from
        alarms from without. And it was wounded none the less on this account that,
        because of the visible wound, we may perceive the wound of love which is
        invisible. How could this fire of love better shine forth than for him to permit
        that not only his body, but that even his Heart, should be wounded with the
        spear? Who would not love that Heart so wounded? Who would not, in return, love
        one who is so loving? Who would not embrace one so chaste? Wherefore let us who
        are in the flesh love in return, as much as we can, him who so loveth, embrace
        our wounded one, whose hands and feet, side and Heart, have been pierced by
        wicked husbandmen; and let us pray that he may deign to bind our hearts, still
        hard and impenitent, with the chain of his love, and wound them with the dart
        thereof.
    responsory:
      la: "R. Ego si exaltátus fúero a terra * Omnia traham ad meípsum.\nV. Hoc autem dicébat signíficans qua morte esset moritúrus.\nR. Omnia traham ad meípsum."
      en: "R. If I be lifted up from the earth, * I will draw all things unto myself.\nV. This he said, signifying what death he should die.\nR. I will draw all things unto myself."
    status: { la: verified, en: verified }
