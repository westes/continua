# Matins Nocturn 2 reading for Ss. Four Crowned Martyrs (Nov 8). Sourced
# from web/www/horas/Latin/Sancti/11-08r.txt, English/Sancti/11-08r.txt.
# The source carries only a single short lesson (Lectio93), transcribed
# whole as one Nocturn 2 reading, same "short/single source lesson"
# handling as st-gorgonius.yml/st-nicomedes.yml.
id: ss-four-crowned-martyrs
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Sevérus, Severiánus, Carpóphorus et Victorínus fratres, in persecutióne Diocletiáni, deórum
        cultum líbere detestántes, plumbátis cæsi, in verbéribus vitam pro Christi nómine
        profudérunt. Quorum córpora, cánibus objécta, cum ab illis intácta diu fuíssent, subláta a
        Christiánis, via Lavicána tértio ab Urbe lápide, in arenária sepeliúntur, prope sepúlcrum
        sanctórum Mártyrum Cláudii, Nicóstrati, Symphoriáni, Castórii et Simplícii, qui eódem
        imperatóre pássi erant; quod, cum essent summi sculptóres, nullo modo addúci potúerant ut
        idolórum státuas fácerent, et, ad solis simulácrum ducti, ut illud venerarétur, numquam
        commissúros se dixérunt ut adorárent ópera mánuum hóminum. Quaprópter in cárcerem conjécti,
        cum ibi multos dies in eódem propósito perstitíssent, primum scorpiónibus cæsi, deínde, vivi
        pluméis lóculis inclúsi, in flúmen dejiciúntur. Exstat in Urbe ecclésia sub nómine sanctórum
        Quatuor Coronatórum, quorum diu ignóta nómina, divínitus póstea patefácta sunt; ubi non
        solum illórum quatuor, sed étiam horum quinque Mártyrum córpora honorífice sepúlta sunt, et
        eórum festívitas sexto Idus Novémbris celebrátur.
      en: >-
        In the persecution under Diocletian, four brothers named Severus, Severian, Carpophorus,
        and Victorinus boldly refused to worship the gods, and were scourged with whips loaded with
        lead until they gave up their lives for the sake of Christ's Name under the blows. Their
        bodies were thrown out to be eaten by dogs, but when they remained untouched after a long
        while, the Christians took them away and buried them in a sand-pit on the Lavican Way, at
        the third milestone from the City, near the tomb of the holy Martyrs Claudius, Nicostratus,
        Symphorian, Castorius, and Simplicius, who had suffered under the same Emperor. These five,
        being master sculptors, could by no means be brought to make statues of the gods, and when
        led before an image of the sun to venerate it, declared they would never consent to worship
        the works of men's hands. For this they were thrown into prison, and when after many days
        they still held to the same resolve, they were first beaten with barbed scourges, then
        soldered up alive in leaden chests and cast into the river. There stands in the City a
        church called after the Four Crowned Martyrs, whose names, long unknown, were afterward made
        known by God; there the bodies not only of these four but also of the other five Martyrs are
        honorably buried, and their feast is kept on the sixth day before the Ides of November.
    status: { la: verified, en: verified }
