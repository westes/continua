# Matins Nocturn 2 reading for Ss. Isaac Jogues, John de Brébeuf, and
# Companions, Martyrs (Oct 19 / Sep 26 sibling dates). Uses [Lectio94]
# (the compact one-lesson summary), not the fuller [Lectio4-6] narrative
# also present in `Sancti/09-26n.txt` -- Lectio94's Latin (from 09-26n)
# and English (from 10-19n's own Lectio94 translation) are both genuine
# source text, so both are marked verified; the longer Lectio4-6 Latin
# has no English translation anywhere in the source and would require
# this project's own translation, left for a future pass if the fuller
# version is ever wanted.
id: ss-isaac-jogues-and-companions
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Ex iis Societátis Jesu sodálibus, qui médio sǽculo décimo séptimo aspérrimam
        missiónem Novæ Gálliæ excoléntes, Ecclésiæ primórdia in América Septentrionáli
        summópere illustrárunt, octo puríssimas hóstias sibi elégit Deus, in hodiérnis
        regiónibus Neo-Eboracénsi et Ontário in Cánada immolátas. In his véluti duces et
        magístri habéntur Joánnes de Brébeuf et Isaácus Jogues, viri strénui et
        apostólico animárum stúdio incénsi, mortificatióni máxime déditi, cum Deo in
        oratióne coniunctíssimi. Haud dispáribus virtútibus ornabántur sacerdótes
        Antónius Daniel, Gábriel Lalemant, Cárolus Garnier et Natális Chabanel, necnon
        Renátus Goupil et Joánnis de la Lande, Patrum adjutóres. Vitam ob indigenárum
        Huronórum índolem miserrimámque vivéndi ratiónem, martýrio símilem, omnes
        cruénta more propter unam religiónis causam, etsi non uno loco nec témpore,
        cumulárunt; quidam vero torménta vix credibília ádeo invícta fortitúdine
        pertulérunt, ut ipsi bárbari carnífices eos admiraréntur. Quos Pius undécimus
        Beatórum, ac mox miráculis claros Sanctórum número adscrípsit.
      en: >-
        Among the members of the Society of Jesus who brought very much renown to the
        infant Church in North America in the middle of the seventeenth century by
        laboring under the greatest hardships in the mission of New France, God chose as
        victims eight men of outstanding integrity, who sacrificed their lives in what is
        now the State of New York and the Province of Ontario, Canada. John de Brébeuf
        and Isaac Jogues are regarded as their leaders and masters, for they were valiant
        men, fired with apostolic zeal, living most mortified lives, in intimate
        prayerful union with God. Not unlike them in virtue were the priests: Anthony
        Daniel, Gabriel Lalemant, Charles Garnier and Noel Chabanel; also the lay
        coadjutors of the Society of Jesus, Rene Goupil and John Lalande. All these
        crowned a life of martyrdom lived among the savage Huron tribes with a cruel
        death for the same reason — their faith — although not at the same time and
        place. Some of them, however, suffered incredible torture with such fortitude as
        to excite even the admiration of the savages themselves. All these were
        beatified by Pius XI and shortly afterwards, when they became famous for
        miracles, the same Pontiff canonized them.
    status: { la: verified, en: verified }
