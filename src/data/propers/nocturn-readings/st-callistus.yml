# Matins Nocturn 2 reading for St. Callistus I, Pope, Martyr (Oct 14)
# — SanctiM/10-14.txt inherits the whole day (`@Sancti/10-14`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/10-14.txt, English/Sancti/10-14.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
id: st-callistus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Callistus, Romanus, præfuit Ecclésiæ, Antonino Heliogábalo imperatóre. Constítuit
        quatuor anni Tempora, quibus jejunium, ex apostolica traditióne acceptum, ab ómnibus
        servarétur. Ædificávit basilicam sanctæ Maríæ trans Tíberim, et in via Appia vetus
        cœmetérium ampliávit, in quo multi sancti Sacerdótes et Mártyres sepúlti sunt; unde ab
        eo Callísti cœmetérium appellátur.


        Ejusdem pietátis fuit, quod beáti Calepodii Presbýteri et Mártyris corpus, jactátum
        in Tíberim, conquiri diligenter curávit, et, invéntum, honorifice sepelívit.
        Palmatium consulari, Simplícium senatoria dignitate illustres, Felicem et Blandam,
        qui deínde omnes martyrium subíere, cum baptismo lustrasset, missus est in carcerem,
        ubi Privátum militem, ulcéribus plenum, admirabíliter sanitáti restitutum, Christo
        adjunxit; pro quo idem, recens adhuc a fide suscepta, plumbátis usque ad mortem
        cæsus occubuit.


        Sedit Callistus annos quinque, mensem unum, dies duodecim. Ordinatiónibus quinque,
        mense Decembri, creávit presbyteros sexdecim, diaconos quatuor, episcopos octo. Post
        longam famem crebrasque verberatiónes præceps jactus in púteum, atque ita martyrio
        coronátus sub Alexandro imperatóre, illátus est in cœmetérium Calepodii, via
        Aurelia, tertio ab Urbe lápide, pridie Idus Octobris. Ejus postmodum corpus in
        basilicam sanctæ Maríæ trans Tiberim, ab ipso ædificatam, delátum, sub ara majori,
        maxima veneratióne cólitur.
      en: >-
        Callistus was a Roman, and ruled the Church in the time of the Emperor Antoninus
        Heliogabalus. He confirmed the institution of the Ember Fasts, the observance of which
        hath been received by tradition from the Apostles. He built the Church of St.
        Mary-beyond-the-Tiber, and enlarged the old burying-place on the Appian Way, wherein
        are buried so many holy Priests and Martyrs, and which hath since been called, on
        account of this enlargement, the Cemetery of Kallistus.


        It was by his reverence that the body of the blessed Priest and Martyr Calepodius,
        which had been cast into the Tiber, was carefully looked for, and, when it had been
        found, honourably buried. He baptized Palmatius, of Consular, and Simplicius, of
        Senatorial rank, and likewise Felix and Blanda, all of whom in the end underwent
        martyrdom. On this account he was thrown into prison, where he wonderfully healed a
        soldier named Privatus, who was full of sores, and so gained him to Christ; and this
        Privatus had hardly received the faith, before he was lashed to death with scourges
        loaded with lead.


        Callistus sat as Pope five years, one month, and twelve days. He held five Ordinations
        in the month of December, wherein he ordained sixteen Priests, four Deacons, and eight
        Bishops. After being long starved, and repeatedly flogged, he was pitched
        head-foremost down a well, and so crowned with martyrdom, under the Emperor
        Alexander. His body was carried to the Cemetery of Calepodius on the Aurelian Way, at
        the third mile-stone from the city, upon the 14th day of October, but was afterwards
        taken to the Church of St. Mary-beyond-the-Tiber, which had been built by himself.
        There it lieth beneath the High Altar, and is held in great reverence of all men.
    status: { la: verified, en: verified }
