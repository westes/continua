# Matins Nocturn 2-3 readings for St. Bede the Venerable (May 27). Sourced
# directly from web/www/horas/Latin/Sancti/05-27.txt, English/Sancti/05-27.txt.
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: the Gospel pericope (Matt 5:13-19, full text from the
# scripture store) then Bede's own homily on it (Lectio7-8; the source gives him no Lectio9 of his own, and the Common's is deliberately not pulled in). Nocturn 1 comes
# from the Common of a Doctor.
id: st-bede
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Beda presbyter, Girvi in Britanniæ et Scotiæ finibus ortus, septennis sancto
        Benedicto Biscopio abbati Wiremuthensi educandus traditur. Monachus deínde
        factus, vitam sic instituit, ut, dum se artium et doctrinarum studiis totum
        impenderet, nihil umquam de regulari disciplina remitteret. Nullum fuit doctrinæ
        genus, in quo non esset diligentissime versatus; sed præcipua illi cura
        divinarum Scripturarum meditatio, quarum sententiam ut plenius assequeretur,
        Græci Hebraicique sermonis notitiam est adeptus. Trigesimo ætatis anno abbatis
        sui jussu sacerdos initiatus, statim, suasore Acca Hagulstadensi episcopo sacros
        explanare libros aggressus est: in quo sanctorum Patrum doctrinis adeo inhæsit,
        ut nihil proferret nisi illorum judicio comprobatum, eorumdem étiam fere verbis
        usus. Otium perosus semper, ex lectione ad orationem transibat ac vicissim ex
        oratione ad lectionem: in qua adeo animo inflammabatur, ut sæpe inter legendum
        et docendum lacrimis perfunderetur. Ne autem rerum fluxarum curis distraheretur,
        delatum abbatis munus constantissime detrectavit.


        Scientiæ ac pietatis laude Bedæ nomen sic brevi claruit, ut sanctus Sergius Papa
        de eo Romam arcessendo cogitaverit; quo difficillimis scilicet, quæ de rebus
        sacris exortæ erant, quæstionibus definiendis conferret operam. Emendandis
        fidelium moribus, fidei vindicandæ atque asserendæ libros plures conscripsit,
        quibus tantam sui apud omnes opinionem fecit, ut illum sanctus Bonifatius
        episcopus et martyr, Ecclesiæ lumen prædicaverit; Lanfrancus, Anglorum doctorem;
        concilium Aquisgranense, doctorem admirabilem dixerit. Quin ejus scripta eo
        adhuc vivente, publice in ecclesiis legebantur. Quod cum fieret, quoniam ipsum
        sanctum minime appellare liceret, Venerabilis titulo efferebant; qui deínde
        veluti proprius secutis étiam temporibus semper habitus est. Ejus autem doctrinæ
        eo vis efficacior erat, quod vitæ sanctimonia religiosisque virtutibus
        confirmabatur. Quam ob rem discipulos, quos multos et egregios imbuendos habuit,
        studio et exemplo non litteris modo atque scientiis, sed étiam sanctitate fecit
        insignes.


        Aetate demum et laboribus fractus, gravi morbo correptus est. Quo cum amplius
        quinquaginta dies detentus esset, consuetum orandi morem Scripturasque
        interpretandi non intercepit; eo namque tempore Evangelium Joannis in popularium
        suorum usum Anglice vertit. Cum autem in Ascensionis præludio instare sibi
        mortem persentiret, supremis Ecclesiæ sacramentis muniri voluit; tum, sodales
        amplexatus, atque humi super cilicio stratus, cum illa verba ingeminaret, Gloria
        Patri, et Filio, et Spiritui Sancto, obdormivit in Domino. Ejus corpus
        suavissimum uti fertur, spirans odorem sepultum est in monasterio Girvensi, ac
        postea Dunclinum cum sancti Cuthberti, reliquiis translatum. Eum tamquam
        Doctorem a Benedictinis aliisque religiosis familiis ac diœcesibus cultum, Leo
        decimus tertius Pontifex maximus ex sacrorum Rituum Congregationis consulto,
        universalis Ecclesiæ Doctorem declaravit, et festo ipsius die Missam et Officium
        de Doctoribus ab omnibus recitari decrevit.
      en: >-
        Bede, a priest, was born at Jarrow, on the borders of England and Scotland. At
        the age of seven years he was placed under the care of holy Benedict Biscop,
        Abbot of Wearmouth, to be educated. Thereafter he became a monk, and so ordered
        his life that, whilst he should devote himself wholly to the study of the
        sciences and of doctrine, he might in nothing relax the discipline of his Order.
        There was no branch of learning in which he was not most thoroughly versed, but
        his chief care was the study of Holy Scriptures; and that he might the better
        understand them he acquired a knowledge of the Greek and Hebrew tongues. When he
        was thirty years of age he was ordained priest at the command of his Abbot, and
        immediately, on the advice of Acca, Bishop of Hexham, undertook the work of
        expounding the Sacred Books. In his interpretations he so strictly adhered to
        the teaching of the holy Fathers that he would advance nothing which was not
        approved by their judgment, nay, had the warrant of their very words. He ever
        hated sloth, and by habitually passing from reading to prayer, and in turn from
        prayer to reading, he so inflamed his soul that often amid his reading and
        teaching he was bathed in tears. Lest also his mind should be distracted by the
        cares of transitory things, he never would take the office of Abbot when it was
        offered to him.


        The name of Bede soon became so famous for learning and piety that St. Sergius
        the Pope thought of calling him to Rome, where, certainly, he might have helped
        to solve the very difficult questions which had then arisen concerning sacred
        things. He wrote many books for the bettering of the lives of the faithful, and
        defending and extending of the faith. By those he gained everywhere such a
        reputation that the holy martyr Bishop Boniface styled him a Light of the
        Church; Lanfranc called him The Teacher of the English, and the Council of Aix-
        la-Chapelle The Admirable Doctor. But as his writings were publicly read in the
        churches during his life, and as it was not allowable to call him already a
        saint, they named him The Venerable, a title which in all times after has
        remained peculiarly his. The power of his teaching was the greater also, in that
        it was attested by a holy life and the graces of religious observance. In this
        way, by his earnestness and example, his disciples, who were many and
        distinguished, were made eminent, not only in letters and the sciences, but in
        personal holiness.


        Broken at length by age and labour, he was seized by a grievous illness. Though
        he suffered under it for more than seven weeks, he ceased not from his prayers
        and his interpreting of the Scriptures; for at that time he was turning the
        Gospel of John into English for the use of his people. But when, on the Eve of
        the Ascension, he perceived that death was coming upon him, he desired to be
        fortified with the last sacraments of the Church: then, after he had embraced
        his companions, and was laid on a piece of sackcloth on the ground, he repeated
        the words, Glory be to the Father, and to the Son, and to the Holy Ghost, and
        fell asleep in the Lord. His body, very sweet, as it is related, breathing sweet
        odour, was buried in the monastery of Jarrow, and afterwards was translated to
        Durham with the relics of St. Cuthbert. Bede, who was already a Doctor among the
        Benedictines, and in other religious Orders, and venerated in certain dioceses,
        was declared by Pope Leo XIII., after consulting with the Congregation of Sacred
        Rites, to be a Doctor of the universal Church; and the Mass and Office for
        Doctors was ordered to be recited by all on his feast-day.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 5:13-19", en: "Matt 5:13-19" }
    text:
      la: >-
        Vos estis sal terrae. Quod si sal evanuerit, in quo salietur? ad nihilum valet
        ultra, nisi ut mittatur foras, et conculcetur ab hominibus. Vos estis lux mundi.
        Non potest civitas abscondi supra montem posita, neque accedunt lucernam, et
        ponunt eam sub modio, sed super candelabrum, ut luceat omnibus qui in domo sunt.
        Sic luceat lux vestra coram hominibus: ut videant opera vestra bona, et
        glorificent Patrem vestrum, qui in caelis est. Nolite putare quoniam veni
        solvere legem, aut prophetas: non veni solvere, sed adimplere. Amen quippe dico
        vobis, donec transeat caelum et terra, jota unum aut unus apex non praeteribit a
        lege, donec omnia fiant. Qui ergo solverit unum de mandatis istis minimis, et
        docuerit sic homines, minimus vocabitur in regno caelorum: qui autem fecerit et
        docuerit, hic magnus vocabitur in regno caelorum.
      en: >-
        You are the salt of the earth. But if the salt lose its savour, wherewith shall
        it be salted? It is good for nothing any more but to be cast out, and to be
        trodden on by men. You are the light of the world. A city seated on a mountain
        cannot be hid. Neither do men light a candle and put it under a bushel, but upon
        a candlestick, that it may shine to all that are in the house. So let your light
        shine before men, that they may see your good works, and glorify your Father who
        is in heaven. Do not think that I am come to destroy the law, or the prophets. I
        am not come to destroy, but to fulfill. For amen I say unto you, till heaven and
        earth pass, one jot, or one tittle shall not pass of the law, till all be
        fulfilled. He therefore that shall break one of these least commandments, and
        shall so teach men, shall be called the least in the kingdom of heaven. But he
        that shall do and teach, he shall be called great in the kingdom of heaven.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Bede the Venerable, Homily on the Gospel"
    text:
      la: >-
        In terra, humana natura; in sale, sapientia verbis significatur. Salis enim
        natura, terra efficitur infructuosa; unde quasdam urbes legimus, victorum ira,
        sale seminatas. Et hoc convenit apostolicæ doctrinæ, ut sale sapientiæ compescat
        in terra humanæ carnis luxum sæculi aut fœditatem vitiorum germinare. Quod si
        sal evanuerit, in quo salietur? Id est, si vos, per quos condiendi sunt populi,
        propter metum persecutionum, aut terrorem, amiseritis regna cælorum, extra
        Ecclesiam positi, inimicorum opprobria sustinetis non dubium. Vos estis lux
        mundi: id est, vos, quia vera luce illuminati estis, lux eis qui in mundo sunt,
        esse debetis. Non potest civitas abscondi supra montem posita: id est,
        apostolica doctrina super Christum fundata, sive Ecclesia super Christum ex
        multis gentibus fidei unitate constructa et caritatis bitumine conglutinata; quæ
        sit tuta intrantibus; et laboriosa adeuntibus, habitatores custodit, et omnes
        inimicos secludit.


        Neque accendunt lucernam et ponunt eam sub modio, sed super candelabrum. Sub
        modio ergo lucernam ponit quisquis lucem doctrinæ commodis temporalibus obscurat
        et tegit; super candelabrum vero, qui se ita ministerio Dei subjicit, ut
        superior sit doctrina veritatis quam servitus corporis. Aliter Salvator accendit
        lucernam, qui humanæ testam naturæ flamma suæ divinitatis implevit; et hanc
        super candelabrum, id est Ecclesiam, posuit, quod in frontibus nostris fidem suæ
        incarnationis fixit. Quæ lucerna non potuit sub modio poni, id est sub mensura
        legis includi; nec in sola Judǽa, sed in universo illuxit orbe.


        Neither doth any man light a candle and put it under a bushel; but upon a
        candlestick. So he who puts the light under the bushel is he who for his own
        temporal ends would hide and tamper with the light of doctrine; but upon the
        candlestick he places it who follows the ministry of God in order that the
        teaching of the truth may be accounted a greater thing than the service of the
        body. In another aspect, the Saviour lighted the candle when He filled our
        mortal body with the flame of the God-head; and He placed it on a candlestick,
        that is the Church; for He fixed the faith of His incarnation upon our
        foreheads. Which light cannot be placed under a bushel; that is to say, it
        cannot be included within the measures of the law, nor in Judea alone, but has
        lightened the whole earth.
