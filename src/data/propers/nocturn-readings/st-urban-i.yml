# Matins Nocturn 2 reading for St. Urban I, Pope, Martyr (May 25). No
# genuine SanctiM match: the plain `Sancti/05-25.txt` is St. Gregory
# VII (a later saint occupying the general calendar's own May 25
# slot), and `SanctiM/05-25.txt` bases `@Sancti/05-25` accordingly —
# Urban I's own content survives only at the suffixed sibling file —
# same "don't trust the plain file" wrinkle as the pre-1955 pass
# (memory vu-matins-pre1955-saints); a missed pre-1955-pool candidate
# rather than a genuine SanctiM case (see memory
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-25o.txt, English/Sancti/05-25o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-urban-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Urbanus Romanus, Alexandro Sevéro imperatóre, doctrina et vitæ sanctitáte multos ad
        Christi fidem convértit; in illis Valerianum, beátæ Cæcíliæ sponsum, et Tiburtium,
        Valeriáni fratrem, qui póstea martyrium forti animo subiérunt. Hic de bonis Ecclésiæ
        attributis scripsit his verbis: Ipsæ res fidelium, quæ Dómino offerúntur, non debent in
        alios usus quam ecclesiásticos et christianórum fratrum, vel indigéntium, converti; quia
        vota sunt fidelium, et pretia peccatórum, ac patrimónia páuperum. Sedit annos sex, menses
        septem, dies quatuor: ac martyrio coronátus, sepúltus est in cœmeterio Prætextati,
        octavo Kalendas Junii. Ordinatiónibus quinque habitis mense Decembri, creávit
        presbyteros novem, diaconos quinque, episcopos per diversa loca octo.
      en: >-
        This Urban was a Roman, who, in the reign of the Emperor Alexander Severus, by his
        teaching and holy life, brought many to believe in Christ. Among others was Valerian, the
        husband of the blessed Cecily, and Tiburtius, the brother of Valerian, both of whom
        afterwards bravely underwent martyrdom. It was Urban I who wrote the following words
        concerning the property of the Church: Those things which His faithful ones make offering
        of unto the Lord, must never be turned to any other use than those of the Church, or of
        our Christian brethren, or of the poor. They are the free-will offerings of faithful
        believers, the trespass offerings of sinners, and the inheritance of the poor. He sat in
        the chair of Peter six years, seven months, and four days, and being crowned with
        martyrdom, was buried in the cemetery of Praetextatus, on the 25th day of May. He held
        five ordinations in December, wherein he ordained nine Priests, five Deacons, and eight
        Bishops for diverse places.
    status: { la: verified, en: verified }
