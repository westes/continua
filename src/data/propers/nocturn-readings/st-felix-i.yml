# Matins Nocturn 2 reading for St. Felix I, Pope, Martyr (May 30).
# No genuine SanctiM match: the only SanctiM file at this date,
# `SanctiM/05-30b.txt`, is St. Joan of Arc's — a different feast
# sharing the date, not a Felix I override — so this is a missed
# pre-1955-pool candidate (Sancti-only, no SanctiM of its own), same
# shape as the two pool passes recorded in memory
# vu-matins-pre1955-saints / vu-matins-sanctim-saints.
# web/www/horas/Latin/Sancti/05-30.txt, English/Sancti/05-30.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-felix-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Felix Románus, patre Constántio, Aureliáno imperatóre præfuit Ecclésiæ. Constítuit ut
        Missa supra memórias et sepúlcra Mártyrum celebrarétur. Qui cum mense Decémbri
        habuísset ordinatiónes duas, et creásset presbýteros novem, diáconos quinque,
        epíscopos per divérsa loca quinque, martyrio coronátus, via Aurelia sepelítur in
        basílica quam a se ædificátam dedicárat. Vixit in pontificátu annos duos, menses
        quátuor, dies vigínti novem.
      en: >-
        Pope Felix I was a Roman who ruled the Church in the days of the Emperor Aurelian.
        His father's name was Constantius. His is the ordinance which commands that Mass
        should be celebrated on the monuments and graves of martyrs. He held two December
        ordinations, wherein he ordained nine Priests, five Deacons, and five Bishops for
        diverse places. Having finished his testimony he was buried upon the Aurelian Way, in
        the Church which he had himself built and dedicated. He lived as Pope two years, four
        months, and twenty-nine days.
    status: { la: verified, en: verified }
