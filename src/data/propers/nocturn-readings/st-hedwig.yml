# Matins Nocturn 2 reading for St. Hedwig, Widow. Sourced directly from
# web/www/horas/Latin/Sancti/10-16.txt, English/Sancti/10-16.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-hedwig
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Hedwigis, regiis clara natálibus, innocéntia tamen vitæ longe clarior, sanctæ
        Elisabethæ fíliæ regis Hungariæ matértera, Bertholdi et Agnetis Moraviæ
        marchiónum fília, animi ab ineunte ætate moderatiónem prótulit. Adhuc enim
        puellula puerílibus abstinuit, et, duodennis Henrico Poloniæ duci a paréntibus
        nuptui trádita, thálami fide sancte servata, prolem inde susceptam in Dei timóre
        erudívit. Ut autem commodius Deo vacaret, ex pari voto et consénsu unánimi, ad
        separatiónem thori virum indúxit. Quo defuncto, ipsa in monasterio Trebnicénsi,
        Deo, quem assiduis precibus exoraverat, inspirante, Cisterciensem devota sumpsit
        habitum; in eoque, contemplatióni intenta, divinis Officiis et Missárum
        solemniis a solis ortu ad merídiem usque assidua assistens, antiquum humani
        generis hostem fortis contempsit.


        Sæculi autem commercia, ni divina vel animárum salútem attingerent, audíre vel
        loqui non sustinuit. Prudéntia in agéndis sic emicuit, ut neque excéssus esset
        in modo nec error in ordine, comis alioqui et mansueta in próximum. Grandem
        autem de se triumphum jejuniis et vigiliis, vestiumque asperitáte, austéra
        carnem macerans, reportávit; hinc sublimióribus flores virtútibus christiánis,
        consiliórum gravitáte, animique candore et quiete, in exímium religiosæ pietátis
        evasit exemplar. Omnibus se ultro subjicere atque vilióra præ ceteris moniálibus
        alacriter munia subire, paupéribus étiam flexo genu ministrare, leprosórum pedes
        ablúere et osculari, ipsi familiare erat; neque illórum úlcera sanie manantia,
        sui victrix, abhorruit.


        Mira fuit ejus patiéntia animique constántia; præcipue vero in morte Henrici
        ducis Silesiæ, sui, quem materne diligebat, fílii in bello a Tartaris cæsi,
        enituit; potius enim grátias Deo, quam fílio lácrimas réddidit. Miraculórum
        denique glória percrebuit; púerum enim demersum et molendini rotis allisum et
        prorsus attritum invocata, vitæ restituit; alíaque præstitit, ut, rite iis
        Clemens quartus probátis, Sanctórum número eam adscripserit, ejusque festum in
        Polónia, ubi præcipua veneratióne uti patrona cólitur, die décima quinta
        Octobris celebrari concesserit. Quod deínde ut in tota Ecclésia fieret,
        Innocentius undecimus ampliávit.
      en: >-
        Hedwiga, a Princess, in whom the splendour of her family was outshone by the
        radiant innocency of her life, was the daughter of Bertold and Agnes, Marquess
        and Marchioness of Moravia, and sister to Gertrude, wife of Andrew, King of
        Hungary, and mother of the holy Elizabeth of Thuringia. From her earliest
        childhood she was a very grave child, and had already done with childish things
        when, at twelve years of age, she was given in marriage by her father and mother
        to Henry, Grand Prince of Poland. In marriage she kept the bed in all holiness
        undefined, and brought up in the fear of God the children that were therein
        begotten of her. (After the birth of her sixth child,) she was fain to give
        herself more continually to God, and induced her husband to agree to a mutual
        vow of separation of bed-fellowship. After his death (in 1238,) by the
        inspiration of God, whom she besought in unceasing prayer, she clad herself for
        godliness' sake in the habit of a Cistercian nun in the monastery (which had
        been finished) at Trebnitz (in 1219.) She continued absorbed in God. She
        remained engaged in the Divine Office and hearing Masses from sunrise till noon,
        and trod mightily under foot the old enemy of man.


        She could not bear to hear talk of worldly things, unless they had to do with
        the things of God or the saving of souls. She was very wise in business, not
        doing too much, nor unseasonably, and withal courteous and gentle toward all
        men. She got a great victory over herself by maltreating her flesh with fasting,
        watching, and rough clothing. She was an example of the higher Christian graces
        and of a godly nun, by the wisdom of her counsels, and the straightforwardness
        and peacefulness of her mind. It was her use to rank herself after all others,
        and cheerfully to undertake lower offices than those of the other nuns. She
        ministered to the poor even upon her knees, and washed and kissed the feet of
        lepers, having such command over herself as not to recoil from their sores
        oozing with matter.


        Her long-suffering and endurance were very marvellous, especially when her son
        Henry, Duke of Silesia, to whom she bore a mother's love, was killed by the
        Tartars (in 1241.) His death drew from her rather thanksgiving to God than tears
        for him. (She died upon the 15th day of October, in the year 1243.) She was
        famous for miracles. One while, being called on, she restored to life a boy who
        had fallen into the water, been dashed against the wheels of a mill, and wholly
        crushed. This and the like being duly proved, Clement IV. numbered her name
        among those of the Saints, and allowed her Feastday to be kept in Poland, in
        which country, being Patroness, she hath most honour, upon the 15th of October;
        which permission was given to the whole Church by Innocent XI. (rubrica
        tridentina) for the 17th day of the same month.
    status: { la: verified, en: verified }
