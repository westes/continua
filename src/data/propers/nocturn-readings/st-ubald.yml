# Matins Nocturn 2 reading for St. Ubald, Bishop and Confessor (May
# 16). No genuine SanctiM match: the only SanctiM file for this date,
# `SanctiM/05-16b.txt`, is a wholly different saint (St. Gentius the
# Hermit, a later addition) — a missed pre-1955-pool candidate rather
# than a genuine SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-16.txt, English/Sancti/05-16.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
id: st-ubald
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Ubaldus Eugubii in Umbria nobili genere natus, a primis annis pietáte et litteris
        egregie est institútus; jamque adoléscens, ut uxórem duceret, sæpe tentatus, numquam
        tamen a proposito servandæ virginitátis recéssit. Sacerdos effectus, patrimónium suum
        paupéribus et ecclésiis distríbuit, et canonicórum regulárium ordinis sancti Augustíni
        institutum suscípiens, illud in pátriam tránstulit, atque in eo aliquámdiu sanctíssime
        vixit. Cujus sanctitátis opinióne evulgata, ab Honorio secundo summo Pontifice ecclésiæ
        Eugubinæ invítus præfícitur, et episcopalis consecratiónis munere decorátur.


        Ad suam ítaque revertens ecclésiam, cum de consueta vivéndi ratióne nihil ádmodum
        immutasset, in omni tamen virtútum genere eo magis eminére cœpit, quo efficacius aliórum
        étiam salútem verbo et exemplo procuraret, factus forma gregis ex animo. Nam victu
        parco, vestítu moderáto, léctulo áspero et paupérrimo, crucis mortificatiónem jugiter in
        suo corpore circumferebat, dum inexplébili oratiónis studio spíritum quotídie recrearet.
        Hinc admirábilem illam mansuetúdinem est adeptus, qua gravíssimas injurias et
        contumelias non modo æquanimiter tulit, verum étiam mirifico dilectiónis afféctu
        persecutores suos omni benignitátis testimonio complectebátur.


        Biennio, antequam ex hac vita migráret, cum diutinis afflictarétur infirmitátibus,
        inter acerbíssimos corporis cruciátus velut aurum in fornace purgátum, Deo grátias
        indesinenter agebat. Adveniénte autem sacro Pentecostes die, cum multis annis ecclésiam
        sibi commissam cum magna cum laude gubernasset, sanctis opéribus ac miraculis clarus
        quiévit in pace. Quem Cælestinus Papa tertius in Sanctórum númerum retulit. Ejus virtus
        præcipue in effugandis spirítibus immundis elucet. Corpus vero, per tot sæcula
        incorruptum, magna fidelium veneratióne in pátria colitur, quam non semel a præsénti
        discrimine liberávit.
      en: >-
        Ubald was born of a noble family at Gubbio in Umbria, and well established in godliness
        and learning from his earliest years. When he was a young man, it was often proposed to
        him to marry, but he never abandoned his determination to preserve his virginity. After
        that he was ordained Priest he divided his inheritance among the poor and Churches, and
        embraced the Institute of Canons Regular of St. Augustine. This Institute he brought to
        Gubbio, and for some time led therein a most holy life. When the fame of his saintliness
        had got noised abroad, Pope Honorius II set him, contrary to his own wishes, over the
        Church of Gubbio, and he was honoured with consecration as Bishop by the hands of the said
        Pope himself.


        When Ubald came to live as Bishop in Gubbio, he changed his way of life in no wise from
        that which he had led before, but his virtues began to be more eminent because his word
        and example were now more able to benefit his neighbours, to whom the shepherd of their
        souls was a pattern, not by outward showing only, but from his heart. He ate little,
        dressed simply, and slept upon a hard and very poor bed. He always bore in the body the
        dying of the Lord Jesus, while he daily fed his soul in unceasing and earnest prayer.
        Hence he acquired such wonderful meekness, that when he was most grievously wronged and
        insulted he not only took it patiently, but, by a strange impulse of love for them,
        embraced his persecutors with every proof of affection.


        Just the space of two years before Ubald passed away from this present life, he was
        tried as gold in the furnace, by grievous bodily weakness, and, day after day, amid the
        sharpest sufferings, he never ceased patiently to give God thanks. He rested in peace on
        the sacred day of Pentecost, having for many years governed with great praise the Church
        which had been entrusted to him, and glorious for good works and miracles. Pope Celestine
        III. numbered him with the Saints. His strength is most chiefly shown in the casting out
        of evil spirits. His body hath remained without corruption for all these ages, and is
        reverenced greatly in his native town by Christ's faithful people. To them he hath more
        than once shown himself good at need.
    status: { la: verified, en: verified }
