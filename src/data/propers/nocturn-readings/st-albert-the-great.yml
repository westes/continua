# Matins Nocturn 2 reading for St. Albert the Great (Nov 15). Sourced
# directly from web/www/horas/Latin/Sancti/11-15.txt,
# English/Sancti/11-15.txt. Lectio4-6 combined into one reading, one
# continuous vita. No [Lectio7] in the source -- no own Nocturn 3.
id: st-albert-the-great
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Albertus, ob singularem doctrinam cognomento Magnus,
        Lauíngiæ ad Danubium, in Suevia, natus, a púero diligenter
        institútus est. Studiórum causa e pátria discédens, dum
        Patavii morarétur, hortante beato Jordano, generali Magistro
        Ordinis Prædicatórum, Dominicianæ famíliæ, frustra obsisténte
        avunculo, adscribi postulávit. Inter fratres adlectus, in
        ómnibus Deo deditus, religiosa observántia et pietáte enituit,
        filiali ac tenerrima in beátam Mariam Vírginem devotióne
        flagrans. Totam vitæ formam, oratióne studium præveniendo,
        ita dispósuit, ut apostolicam religiónem proféssus, ad
        prædicatiónem verbi Dei et animárum salútem procurandam
        idoneus evaderet administer. Mox ad stúdia explenda Colóniam
        Agrippinam missus, ita profecit, ut omnes fere sæculares
        sciéntias diligentíssime præ ómnibus suis coævis
        investigaverit atque auxerit; et de divinæ legis fonte,
        testante Alexandro quarto, adeo salutifera fluéntia doctrinæ
        potávit, ut ejusdem in suo péctore vigéret plenitudo.


        Ut scientiárum thesáuris alios ditaret, lector Hildeshémii,
        deinceps Friburgi, Ratisbonæ et Argentinæ constitútus est.
        Omnium in se admiratiónem convértens, cum in Parisiénsi
        inclyta universitáte sacræ facultáti docéndo decus adderet,
        magister theologíæ renunciátus est. Doctrinis gentílium
        philosophórum ad rectæ ratiónis dictámina revocatis, eárum
        cum fide cohæréntiam clarius commonstrávit. De divinórum
        intelléctu mira expósuit. Quantum vero univérsas disciplínas,
        præsertim sacras, férvido ingenio atque indefesso studio
        provexerit, plurima ejus scripta in omni fere scientiárum
        génere aperte declarant. Ut studio generali sui Ordinis
        præesset, Colóniam reversus est, eo successu ut ejus in
        scholis auctoritas et doctrinæ fama magis magisque vigúerit.
        Thomam de Aquino discipulum diléctum hábuit, cujus altitúdinem
        mentis ipse primus perspéxit ac prædicávit. Erga Sacrosanctum
        altaris Sacraméntum piíssimo ferebátur afféctu, deque eo
        præclára conscripsit; rei quoque mysticæ ánimis instituéndis
        vias ampliores parávit, adeo ut frúgifer tanti magistri zelus
        quam late in Ecclésia patúerit.


        Tot inter gravíssima munia, religiosæ vitæ exemplis
        præfulgens, a frátribus Prior Teutoníæ provinciæ eléctus est.
        Anágniam vocatus, Gulielmum, Ordines mendicántes ímpio ausu
        impetentem, coram summo Pontifice Alexandro quarto rétudit,
        qui Episcopum Ratisbonensem eum póstea constítuit. Curæ sui
        gregis Albertus se totum impendit, morum humilitate ac
        paupertátis amóre studiosíssime reténtis. Dimisso officio,
        ad episcopalis tamen ordinis labóres promptus atque álacer
        per Germaniam et finítimas regiónes spiritualia ministrávit.
        Consília requiréntibus quam recta ac salutifera sollicite
        præbebat, et in sedandis discordiis tam prudentem se
        osténdit, ut eum non solum Colónia pacis conciliatórem
        noverit, verum étiam ad díssitas regiónes Præláti ac viri
        príncipes árbitrum componéndis dissidiis eum sæpe
        advocáverint. A sancto Ludovíco, Francórum rege, relíquiis
        Christi Passiónis, quam devotíssime Albertus colebat, donatus
        est. In altero Concílio Lugdunénsi negotia gravióra peregit.
        Tandem, senio consumptus, docére déstitit. Contemplatióni
        exínde intentus, in gáudium Dómini sui intrávit anno
        millesimo ducentésimo octogésimo. Sacros honores in
        diœcesibus plúribus atque in Ordine Prædicatórum ei,
        Romanórum Pontificum auctoritate, jam antea tributos, Pius
        Papa undecimus cumulans, sancti Alberti Magni festum, addito
        Doctoris titulo, Sacrórum Rituum Congregatiónis votum
        libentíssime excípiens, ad Ecclésiam universam exténdit; et
        eum Pius duodecimus cultórum scientiárum naturalium cælestem
        apud Deum Patronum constítuit.
      en: >-
        Albert, called the Great, because of his extraordinary
        learning, was born in Swabia, at Lauingen on the Danube, and
        very carefully educated from boyhood. To further his higher
        studies he left his native country and went to Padua. At the
        urging of blessed Jordan, Master General of the Order of
        Preachers, he asked admission into the family of the
        Dominicans, in spite of the futile protests of his uncle.
        After his election to membership among the brethren, Albert
        was dedicated in all things to God, and was conspicuous for
        his piety, his strict observance of the rule, and especially
        for his tender and filial devotion to the Blessed Virgin
        Mary. Always before study he spent some time in prayer. After
        his profession of apostolic religion, he so regulated his
        schedule of life that he became an accomplished preacher of
        the word of God and an efficient instrument for the salvation
        of souls. Soon the Order sent Albert to complete his studies
        at Cologne, where he made such progress in every branch of
        secular science that he surpassed all his contemporaries in
        scholarship and achievement. In the meantime, as Alexander IV
        testifieth, he drank so deeply of the health-giving waters of
        doctrine, sprung forth from the fountain of the divine law,
        that his soul was flooded with their abundance.


        That others might share the rich treasure of his learning,
        Albert was appointed professor at Hildesheim, then Freiburg,
        Ratisbon and Strasbourg successively. He became the marvel of
        all. During the period when he taught sacred theology in the
        famous University of Paris, he became world-famous, and
        received the degree of Master of Theology. Examining the
        teachings of pagan philosophers in the light of sound reason,
        he demonstrated clearly that they were in fundamental accord
        with the tenets of the faith. He expounded most brilliantly
        the thesis on the extent of the power of human understanding
        to comprehend divine mysteries. How great was his genius, how
        brilliant his intellect, how zealously he applied himself to
        study until he had become learned in every branch of
        scholarship, especially sacred theology, is best shown by his
        numerous writings. These encompass every known subject. Albert
        returned to Cologne to become president of the university
        conducted by his Order. He was so successful that he became
        ever more widely acknowledged as an authority by the schools;
        his reputation for learning increased. Among his pupils was
        his beloved Thomas Aquinas. Albert was first to recognize and
        acclaim the greatness of that intellect. He had a deep
        devotion towards the Blessed Sacrament of the Altar and
        composed some magnificent works upon it. He also pointed out
        wider fields for the study of the mystical things of the
        soul. He succeeded so well that the zeal of this great master
        spread far and wide in the Church.


        Amid so many very important duties Albert shone as an
        exemplar of the religious life. His brethren, therefore,
        selected him to be prior of the German province. He was
        summoned to Anagni, in the presence of the Supreme Pontiff,
        Alexander IV to refute that William who had been impiously
        and arrogantly attacking the mendicant orders. Soon after
        this the Pope appointed Albert Bishop of Ratisbon. As Bishop,
        Albert devoted himself almost entirely to the care of his
        flock. Yet he retained meticulously his humility and love of
        poverty. Up to the time he resigned his see, Albert was
        prompt and energetic in fulfilling the duties of his
        episcopal office. He ministered to the spiritual needs of
        souls throughout Germany and the neighbouring provinces. He
        was careful that the advice he gave to those who sought his
        counsels was wise and salutary. So prudent was he in settling
        disputes that at Cologne he was called the peacemaker. From
        far distant places, prelates and princes invited him to act
        as an arbiter to resolve differences. Saint Louis, King of
        France, presented him with some relics of the sacred Passion
        of Christ, and Albert cherished them devoutly all his days.
        In the second Council of Lyons he was instruméntal in
        bringing to a successful conclusion several weighty matters.
        He taught until he was worn out with age. His last days were
        spent in holy contemplation. In the year 1280 he entered into
        the joy of his Lord. By the authority of the Roman Pontiffs,
        the honours of the altar had long since been conferred upon
        Albert in many dioceses and in the Order of Preachers, when
        Pius XI, gladly accepting the recommendations of the
        Congregation of Sacred Rites, extended his Feast to the
        universal Church, and conferred upon the title of Doctor.
        Pope Pius XII appointed him the heavenly patron with God of
        all those who study the natural sciences.
    status: { la: verified, en: verified }
