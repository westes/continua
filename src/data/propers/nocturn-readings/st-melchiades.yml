# Matins Nocturn 2 reading for st-melchiades (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/12-10o.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-melchiades
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Melchiades Afer post Eusebium Románam ténuit Ecclésiam. Qui cum adhuc Presbyter esset, misit
        diáconos cum lítteris Maxenti Imperatóris, et lítteris Præfécti Prætorii ad Urbis Præféctum,
        ut ea loca recíperet, quæ fúerant Christiánis, témpore persecutionis, abláta. Reddita autem
        Ecclésiis pace, Constantínum Augústum adivere Donatistæ, ut in eórum contra Cæcilianum
        Carthaginiensem Epíscopum causa júdices daret. Quibus Constantínus respóndit: Petistis a me
        in sǽculo judícium, cum ego ipse Christi judícium exspectem. Attamen dati sunt júdices
        Epíscopi tres missique Romam ad Melchíadem Pontíficem, ut ibi pro fratrum concórdia et
        unitáte Synodus cogerétur.


        In Urbem ítaque hi tres profecti, convenérunt cum áliis quíndecim Epíscopis, ipsoque
        Melchiade in domum Faustæ in Lateranis, ubi causa discussa, Cæcilianus ómnium Episcopórum
        sententiis, ínnocens est pronuntiatus, et ejúsdem Melchiadis decréto judícium est clausum.
        Ut autem Donatistæ Cathólicæ unirentur Ecclésiæ, Melchiades (prout scribit sanctus
        Augustínus) tanquam vir optimus, fílius Christiánæ pacis, et pater Christiánæ plebis ádmodum
        laborávit, oblata étiam conditióne, ut quibuscumque in locis duo essent contrariarum
        factionum Epíscopi, is confirmaretur qui prior fuísset ordinátus, et álteri plebs ália
        regenda provideretur.


        Sanxit, ne ulla ratióne die domínico, aut quinta féria, quis fidélium jejunaret, quia eos
        dies quasi sacro jejúnio deputatos pagani celebrabant. Item státuit, ut oblatiónes
        consecratæ per Epíscopum, quæ dicebántur fermentum, per Ecclésias dirigerentur: ne
        Presbyteri in suis Titulis una cum suis plebibus celebrantes, se ab Epíscopi communióne
        separatos judicarent. Qui cum in persecutióne Maximiáni multa passus esset, tandem sub
        Constantíno quiévit in Dómino, quarto Idus Decémbris sepultúsque est in cœmetério Callísti
        via Appia. Una ordinatióne creávit Presbyteros sex, Diáconos quinque. Epíscopos per divérsa
        loca úndecim.
      en: >-
        Melchiades, an African, held the Roman Church after Eusebius. While he was still a priest,
        he sent deacons with the letters of Maxentius the Emperor, and the letters of the Praetorian
        Prefect to the Prefect of the City, that they might receive back the places which had
        belonged to the Christians and been taken away in the time of persecution. When peace was
        given back to the Churches, the Donatists approached Constantine Augustus, that he might
        give judges in their cause against Caecilian, Bishop of Carthage. To whom Constantine
        replied: You have asked of me a judgment in the world, when I myself await the judgment of
        Christ. Nevertheless three bishops were given as judges and sent to Rome to the Pontiff
        Melchiades, that there a Synod might be assembled for the concord and unity of the brethren.


        These three, therefore, set out for the City and met with fifteen other bishops and with
        Melchiades himself in the house of Fausta in the Lateran, where the cause was discussed, and
        Caecilian was pronounced innocent by the sentences of all the bishops, and the judgment was
        closed by decree of the same Melchiades. And that the Donatists might be united to the
        Catholic Church, Melchiades (as holy Augustine writes), as a most excellent man, a son of
        Christian peace and father of the Christian people, laboured greatly, even offering the
        condition that in whatever places there were two bishops of opposing factions, the one who
        had been ordained first should be confirmed, and for the other another people be provided to
        rule.


        He ordained that on no account should any of the faithful fast on Sunday or Thursday,
        because the pagans kept those days as if devoted to a sacred fast. He likewise decreed that
        the offerings consecrated by the bishop, which were called the fermentum, be sent to the
        churches, so that priests celebrating in their titles with their people should not think
        themselves separated from communion with the bishop. When he had suffered much in the
        persecution of Maximian, he at last rested in the Lord under Constantine, on the fourth day
        before the Ides of December, and was buried in the cemetery of Callistus on the Appian Way.
        In one ordination he created six Priests, five Deacons, and eleven Bishops for various
        places.
    status: { la: verified, en: draft }
