# Matins Nocturn 2 reading for St. Dorothea, Virgin and Martyr (Feb 6,
# sharing the date with St. Titus in the general Tridentine calendar).
# No SanctiM/02-06o*.txt at all (the only SanctiM file for this date,
# plain SanctiM/02-06.txt, bases `@Sancti/02-06` i.e. Titus, not
# Dorothea) — same "the shared plain file isn't necessarily yours"
# wrinkle as the pre-1955 pass (memory vu-matins-pre1955-saints); like
# st-felix-presbyter/st-prisca in January, Dorothea turns out to be a
# missed pre-1955-pool candidate rather than a genuine SanctiM case
# (see memory vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/02-06o.txt, English/Sancti/02-06o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-dorothea
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Doróthea virgo, ex Cæsaréa Cappadociæ, propter Christi confessiónem ab Apricio præside
        comprehensa, Chrystæ et Callistæ soróribus, quæ a fide defécerant, tradita est, ut eam a
        propósito removérent. Sed contra factum est; nam eas Doróthea ad cultum christianæ
        religiónis redúxit, propter quam étiam martyrium suscepérunt. Quare Virgo equuleo diu
        torta et palmis cæsa, ad extremum cápitis damnata, duplicatam virginitátis et martyrii
        palmam accepit.
      en: >-
        The maiden Dorothy, of Caesarea in Cappadocia, was betrayed to Apricius the President by
        her two sisters, Chrysta and Callista, who had denied the faith, in the hope that he would
        induce her to do likewise. She was arrested, but it came not to pass as they hoped. On the
        contrary, she brought them back to the Christian worship, and they received martyrdom. She
        was long tormented upon the rack, and scourged with palm branches, and in the end was
        beheaded, receiving the double palm of virginity and martyrdom.
    status: { la: verified, en: verified }
