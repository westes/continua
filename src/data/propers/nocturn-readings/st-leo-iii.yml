# Matins Nocturn 2 reading for St. Leo III, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/06-12-LeoIII.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-leo-iii
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Leo hujus nóminis tértius, Románus, ex patre Astippio, a puerítia in vestiario patriarchii
        Lateranensis in omnem ecclesiásticam ac divínam disciplínam educátus, ex monacho sancti
        Benedícti, présbyter cardinális, ac demum Póntifex Máximus, incredíbili ómnium consensióne,
        ipso die óbitus Adriani creátus est, anno septingentésimo nonagésimo quinto, seditque in
        sancta Petri sede annos vigínti, menses quinque, dies decem et septem.


        Talem se in pontificátu exhíbuit, qualem se ante assumptiónem præbuerat: piissimum scílicet,
        mitissimum, singulári in Deum religióne, erga próximum caritáte, prudéntia in rebus
        gerendis, páuperum ægrorumque paréntem, Ecclésiæ defensorem, divíni cultus promotorem,
        utpote qui máxima quæque pro Christo et Ecclésia sédulo prǽstitit, et patiénter tolerávit.


        Cum ab ímpiis, erutis óculis, et confossus vulnéribus, semivivus relictus fuísset, postrídie
        per insígne miráculum sanus invéntus est, iisdemque parricídis vitam suis précibus obtínuit.
        Cárolo Magno Francorum regi Románum impérium détulit; peregrinis amplissimum xenodochíum
        exstrúxit: patrimónium aliósque fundos paupéribus adscrípsit. Basílicas Urbis, præsértim
        Lateranensem (in cujus patriarchio trichnium magnum super ómnia trichnia fundávit), et
        sacras ædes tot ac tantis divítiis cumulávit, ut fidem omnem superáre videátur. Vitam demum
        religiosissimam pio fine coronávit, prídie Idus Júnii, anno Dómini octingentésimo décimo
        sexto, et sepúltus est in Vaticáno.
      en: >-
        Leo, the third of that name, a Roman, the son of Astippius, from boyhood educated in the
        vestiary of the Lateran patriarchium in all ecclesiastical and divine discipline, from a
        monk of St. Benedict cardinal priest, and finally Supreme Pontiff, was created with the
        incredible consent of all, on the very day of the death of Hadrian, in the year 795, and sat
        in the holy see of Peter twenty years, five months, and seventeen days.


        He showed himself in the pontificate such as he had presented himself before assumption:
        most pious, namely, most gentle, of singular religion toward God, charity toward his
        neighbour, prudence in the conduct of affairs, a father of the poor and sick, defender of
        the Church, promoter of divine worship, as one who diligently accomplished and patiently
        bore the greatest things for Christ and the Church.


        When by the impious he had had his eyes torn out and been left half-dead, pierced with
        wounds, on the next day he was found whole by a notable miracle, and by his prayers obtained
        life for the same parricides. To Charlemagne, king of the Franks, he conferred the Roman
        empire; he built for pilgrims a most ample xenodochium; he assigned his patrimony and other
        estates to the poor. He heaped the basilicas of the City, especially the Lateran (in whose
        patriarchium he founded a great triclinium above all triclinia), and the sacred buildings
        with so many and such great riches that he seems to surpass all belief. At last he crowned a
        most religious life with a pious end, on the day before the Ides of June, in the year of the
        Lord 816, and was buried in the Vatican.
    status: { la: verified, en: draft }
