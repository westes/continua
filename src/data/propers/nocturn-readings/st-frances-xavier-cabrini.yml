# Matins Nocturn 2 reading for St. Frances Xavier Cabrini, Virgin
# (Nov 13). Sourced from `Sancti/11-13n.txt` [Lectio94] and its English
# counterpart -- both real source text, marked verified.
id: st-frances-xavier-cabrini
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Francísca Xavéria in óppido Sancti Angeli, diœcésis Laudénsis, orta, jam inde a
        pueritia Deo devótam vitæ ratiónem instítuit. Trédecim annos nata, sacratíssimo
        Cordi Jesu virginitátem vovit. At, non bene valens, religiónem cum postulásset,
        unam alterámque repúlsam passa est. Ludi magístræ múnere functam, orphanotróphio
        moderándo præfécit eam epíscopus, a quo étiam ad novam condéndam religiónem
        missionáriam incitabátur. Itaque Cotónei, apud sacéllum beátæ Vírginis de
        Grátiis, cum ipsa trigínta esset annórum, missionálium vírginum a Sacro Corde
        Jesu fundaménta jecit. Cum autem hæréret anceps, Dei nutum crédidit elóquium
        Leónis décimi tértii jubéntis ad oras navigáre occíduas. Océanum quater et
        vícies prætergréssa, in América Septentrionáli mater Italórum méruit appellári.
        Deo semper inténta et confísa, beátam Vírginem Maríam Congregatiónis suæ Matrem
        salutábat. Institútum suum mirífice propagávit, sexagínta septem dómibus ab ipsa
        constitútis. Demum Chicágiæ, die vigésima secúnda decémbris, anno millésimo
        nongentésimo décimo séptimo, cursum consummávit ejúsque exúviæ Neo-Eborácum
        translátæ sunt. Quam Pius undécimus beátis, Pius vero duodécimus sanctis
        Virgínibus accénsuit.
      en: >-
        Frances Xavier, born in the town of Sant'Angelo in the diocese of Lodi, from her
        earliest years dedicated her life to God. When she was thirteen years old, she
        vowed virginity to the Most Sacred Heart of Jesus. She then taught at Lodi and
        thereafter the Bishop appointed her directress of an orphanage and also urged her
        to found a new religious congregation which would be devoted to the missions. And
        so, when she was thirty years old, in the chapel of Our Lady of Grace at Codogno,
        she laid the foundation of the Institute of the Missionary Sisters of the Sacred
        Heart. She was uncertain where to undertake missionary work, but when Leo XIII
        told her to go West she recognized in his word the will of God. She traveled
        across the ocean twenty-four times and earned the title of mother of the Italians
        in North America. Her mind and heart were in constant union with God in whom her
        confidence was implicit. She hailed the Blessed Virgin Mary as the Mother of her
        Congregation. She effected the wonderful spread of her Institute as is evidenced
        from the fact that she established sixty-seven houses. Finally, her life came to
        an end at Chicago on December 22, 1917, and her remains were translated to New
        York. She was beatified by Pius XI, whereas Pius XII added her name to the list
        of holy Virgins.
    status: { la: verified, en: verified }
