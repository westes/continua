# Matins Nocturn 2 reading for St. John Mary Vianney, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/08-09.txt, English/Sancti/08-09.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-john-vianney
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánnes Maria Vianney, in pago Dardilly, Diœcesis Lugdunénsis piis ruriculis
        ortus, ab infántia plura dedit sanctitátis indicia. Cum octennis oves
        custodiret, modo puerulos, ad imáginem Deíparæ genuflexos, Rosárium verbo et
        exemplo edocére, modo sorori vel alteri commisso grege, secretiórem locum pétere
        solebat, quo expeditior ante simulacrum Vírginis, oratióni vacaret. Páuperum
        amantíssimus, eos turmatim in patris domum dedúcere et omnímodo adjuvare in
        deliciis habebat. Litteris imbuendus, párocho Vici Ecully tráditus est; sed ut
        erat tardioris ingenii, in stúdiis fere insuperábiles expertus est
        difficultates. Jejunio et oratióne divinam opem implorávit, et facilitátem
        discéndi rogatúrus, tumulum sancti Francisci Regis, stipem quæritans, adívit,
        Theologíæ curriculo operose confecto, satis idoneus invéntus est, qui sacris
        initiarétur.


        In pago Ecully, præeunte párocho, cujus vicarius renunciátus fuerat, potiores
        pastoralis perfectiónis gradus totis viribus attingere contendit. Elapso
        triennio, in viculum Ars qui non ita multo post diœcesi Bellicénsi adscriptus
        est, quasi Angelus de cælo fuit missus et omnino squalentis ac desertæ suæ
        parœciæ fáciem florentíssime renovávit. In consciéntiis judicándis ac moderandis
        ad plurimas horas quotídie assiduus, frequentem Eucharistiæ usum invéxit, pias
        sodalitates instaurávit: mirum autem in modum téneram in Immaculátam Vírginem
        ánimis pietátem índidit. Ratus vero pastoris esse, flagítia concréditæ plebis
        expiare, nec oratiónibus, nec vigiliis, maceratiónibus et continuis jejuniis
        parcebat. Tantam viri Dei virtútem cum Satan ferre non posset, eum vexatiónibus
        primum, dein aperto certamine adortus est; sed atrocíssimas afflictiónes
        patienter tolerábat Joánnes Maria.


        Invitabátur sæpius a curiónibus vicínis ut, Missionariórum more, animárum
        saluti, qua concionando, qua confessiónes excipiéndo consúleret et singulis
        præsto semper erat. Studio glóriæ Dei incénsus, effécit, ut pia Missiónum
        exercítia in ámplius centum parœciis, constituto perpetuo censu, institueréntur.
        Inter hæc, Deo servum suum miraculis et charismátibus illustrante, orta est
        celebris illa peregrinátio, qua, per vicennium centum fere míllia hóminum
        cujusque ordinis et ætátis, quotannis Ars conflúxerint non solum e Galliæ et
        Europæ, sed étiam Américæ díssitis provinciis. Labóribus potius quam senio
        consumptus, prænuntiáto suæ mortis die, in osculo Dómini quiévit, die quarta
        Augusti, anno millesimo octingentésimo quinquagesimo nono, annos natus tres ac
        septuagínta. Quem multis clarum miraculis, Pius décimus inter Beatos, Pius vero
        undecimus inter Sanctos Cælites anno sacro adscripsit, ejusque festum ad
        universam Ecclésiam extendit, anno vero quinquagesimo sacerdotii sui ómnium
        parochórum cælestem patronum constítuit.
      en: >-
        John Mary Vianney, born of pious peasants in the village of Dardilly in the
        diocese of Lyons, gave many signs of holiness from his infancy. When, at the age
        of eight, he was taking care of the sheep, he would sometimes by word and
        example instruct little boys, kneeling before a statue of the Mother of God, in
        the use of the Rosary; and at other times, entrusting the flock to his sister or
        to another child, he was wont to seek out a more retired spot, that he might
        more readily devote himself to prayer before an image of the Virgin. Having a
        very great love for the poor, he would lead them in crowds to his father's
        house, and he took a delight in aiding them in every way. That he might be
        initiated into letters, he was sent to the parish priest of the village of
        Ecully; but as he was very slow to understand, he encountered almost
        unsurmountable difficulties in his studies. Fasting and praying, he entreated
        the divine assistance, and, with a view to begging for a facility in learning,
        he approached the tomb of St. Francis Regis, earnestly beseeching him for that
        gift. Having most laboriously passed through the course of theology, he was
        found to be sufficiently suitable to receive holy orders.


        In the village of Ecully, under the guidance of the parish priest, whose
        assistant he had been appointed, he strove with all his strength to attain to
        the higher degrees of pastoral perfection. After three years had gone by, he was
        sent, like an Angel from heaven, to the small village of Ars, which not so long
        after was included in the diocese of Belley, and in a most brilliant manner he
        entirely renewed the condition of his neglected and forsaken parish. Continually
        engaged for many hours daily in hearing confessions and in giving spiritual
        direction, he introduced the frequent reception of the Eucharist, and organized
        pious sodalities: and in a remarkable manner he inspired into souls a tender
        devotion to the Immaculate Virgin. And, deeming that it is the duty of the
        pastor to expiate the sins of the flock accredited to him, he spared neither
        prayers, nor vigils, nor mortifications and continual fastings. Since Satan
        could not endure such great virtues in this man of God, he assailed him, first
        with mere annoyances, and afterwards in open combat; but John Mary patiently
        endured the most malevolent injuries.


        He was very often asked by the neighbouring priests to labour for the salvation
        of souls after the manner of the Missionaries, either by preaching sermons, or
        by hearing confessions, and he was always at hand in every case. Burning with
        zeal for the glory of God, he brought it about, that the pious exercises of
        Missions were established in more than an hundred parishes arranged in a
        continuous and permanent series. Meanwhile, as God was rendering his servant
        famous by miracles and by graces, there began that celebrated pilgrimage, in
        which, throughout a period of twenty years, nearly one hundred thousand persons
        of every class flocked to Ars, not only from France and from Europe, but even
        from the distant regions of America. Worn out by labours rather than by old age,
        having foretold the day of his death, he went to rest in the embrace of the
        Lord, on the 4th day of August, in the year 1859, and of his age the seventy-
        third. After he became illustrious for many miracles, Pius X added him to the
        number of the Blessed , and Pius XI, in the holy year numbered him with the
        Saints in heaven and extended his feast to the universal Church, and on the
        fiftieth anniversary of his own priesthood, appointed him the heavenly patron of
        all parish priests.
    status: { la: verified, en: verified }
