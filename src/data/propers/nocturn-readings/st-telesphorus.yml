# Matins Nocturn 2 reading for St. Telesphorus, Pope and Martyr (Jan 5,
# commemorated -- the day itself is the Vigil of the Epiphany). The main
# Sancti/01-05.txt has no vita for him at all (its Nocturn 2/3 is the
# Christmas octave's own homiletic content, now carried by
# vigil-of-epiphany.yml), which is why this file used to pool that
# homily in. The Rome-city calendar has a real proper vita:
# web/www/horas/Latin/Sancti/Urbis/01-05cc.txt (Duplex, nine lessons;
# also reused for the combined Ss. Telesphorus and Hyginus office of
# Urbis/01-19). Lectio4-6 combined into one reading, one continuous
# vita, no genuine source break. No responsory given in the source.
#
# Latin typos in the Urbis file corrected here: "tortia" -> "tertia",
# "sacrificiumter" -> "sacrificium ter", "quas ... attinent" -> "quae".
# English/Sancti has no regional subdirectory, so there is no English
# source; the English is this project's own translation, marked draft.
id: st-telesphorus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Telesphorus, natióne Græcus, pátria Thuriensis in magna Græcia, ex presbytero Románæ
        Ecclésiæ (cujus dignum minístrum egerat) Póntifex Máximus creátus est. Hoc suprémum
        munus ita óbiit, ut exímius Petri successor lectus esse viderétur. In ejus cáthedra
        sedit sub imperatóre Antoníno Pio, fervente persecutionis æstu. Qui tamen non óbstitit,
        ne sedulam óperam regendæ Christi Ecclésiæ sollícitus navarit.


        Hinc novis decrétis multa illum egrégie sancivisse legimus, quæ ad fidélium mores,
        Ecclesiasticórum libertatem, et sacros ritus attinent: scílicet quadragesimale
        jejúnium, jam olim ab Apóstolis traditum, novo edícto restaurasse; ac mandasse ut in
        Natali Dómini sanctum Missæ sacrificium ter celebraretur, média nocte, illucescénte
        aurora, hora demum tertia post solis ortum; et constituisse ut sacræ Liturgiæ hymnus
        angélicus, Glória in excélsis Deo, adderetur.


        Edixisse quoque ne sacerdótes a pópulo arguerentur, ut sublimis órdinis dignitati
        consuleret. Ordinatióne quadruplici, mense Decémbri, creávit presbyteros duódecim,
        diáconos octo, epíscopos trédecim per divérsa loca. Cum autem in propagánda fide
        ardentissimus esset, ac proínde idolórum sacerdótibus invisus, captus tandem cápitis
        abscissione martyrium consummávit Nonis Januárii, et ejus corpus in Vaticáno sepúltum
        est.
      en: >-
        Telesphorus, a Greek by race and a native of Thurii in Magna Graecia, was made Supreme
        Pontiff from being a priest of the Roman Church, of which he had been a worthy minister.
        He discharged this highest office so well that he seemed to have been chosen an
        outstanding successor of Peter. He sat in his chair under the Emperor Antoninus Pius,
        in the fervent heat of persecution. Yet this did not prevent him from devoting careful
        and anxious labour to the governance of Christ's Church.


        We read that from this he established many things excellently by new decrees, touching
        the morals of the faithful, the freedom of the clergy, and sacred rites: namely, that he
        renewed by a new edict the Lenten fast, handed down long ago by the Apostles; and
        commanded that on the Nativity of the Lord the holy sacrifice of the Mass be celebrated
        three times, at midnight, at the dawning of the day, and at the third hour after
        sunrise; and established that the angelic hymn of the sacred Liturgy, Glory be to God on
        high, be added.


        He also decreed that priests should not be accused by the people, so as to safeguard the
        dignity of the exalted order. In four ordinations, in the month of December, he created
        twelve priests, eight deacons, and thirteen bishops for various places. Since he was
        most ardent in propagating the faith, and for that reason hateful to the priests of the
        idols, he was at length seized and completed his martyrdom by beheading on the Nones of
        January, and his body was buried in the Vatican.
    status: { la: verified, en: draft }
