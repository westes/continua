# Matins Nocturn 2 reading for St. John Leonardi, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/10-09.txt, English/Sancti/10-09.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-john-leonardi
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánnes Leonardi, in oppido Décimi, non longe a Lucénsi urbe, piis et honestis
        ortus paréntibus, jam inde a prima ætate, solitúdinis et precatiónis amóre,
        grave quiddam ac matúrum præ se tulit. Annos natus viginti sex a Deo vocátus ad
        ecclesiásticæ milítiæ nomen dandum, sæcularibus curis íllico nuntium remisit. Ac
        primo inter púeros latinæ linguæ rudimentis instructus, deínde in litteris et
        philosophicis ac theologicis disciplinis adeo profecit, ut vix acto quadriennio
        ad sacerdotium ex obediéntia promotus fúerit. Mox aliquot nactus bonæ índolis
        nóbiles júvenes, cum eos ad virtútis perfectiónem sedulo exercuísset, insequénti
        anno congregatiónem instituit clericórum regulárium, quam a Matre Dei, ob
        incensum erga ipsam suæ devotiónis afféctum, nuncupávit. Horum cura et zelo
        tanta peracta est animórum commutátio, ut cum in Lucénsi republica, hæreticórum
        præsertim perfidiosis artibus, ardérent civium odia, profligatique essent mores,
        brevi témpore primæva Christianórum pietas ibidem revixisse viderétur.


        Tam salutárium óperum causa incídit Joánnes in acerrimas insectatiónes hóminum
        nequam, qui recens coactam familiam pérdere omni ope conáti sunt.  Sed vir Dei,
        æquo animo libenter ómnia ferens, impetráta a Summo Pontifice Gregório décimo
        tertio suæ congregatiónis confirmatióne, apostolici sui labóris fructus
        constanter servávit.  In arduis negotiis componéndis multi epíscopi eo
        consiliario et adjutore usi sunt, et vel ipse Romanus Pontifex eum delegávit ad
        intricáta litigia dirimenda, et ad religiosas familias reformandas.  Sancto
        Josepho Calasanctio, ejusque pene collapsæ societati, præsto fuit.  Haud levem
        quoque impéndit operam negotiis nosocomíi Sancti Spíritus in Saxia, et
        moniálibus oblátis sanctæ Franciscæ Romanæ excolendis.


        Gráviter dolens, gentes adeo plurimas remotis in regiónibus luce Evangélii
        carére, inflammabátur desidério migrándi in illas oras ad lumen veræ religiónis
        effundéndum.  At cum intellixísset a sancto Philippo Nerio, a quo verus
        reformator dicebátur, se suamque congregatiónem ad instituéndos Italiæ pópulos
        destinari, divinæ acquiévit voluntáti ; minime tamen abstinuit quin, si aliquam
        infidelibus opem afferre posset, experirétur.  Hinc ínitis consíliis cum
        piíssimo præsule Vives, cœtum instituit presbyterórum, quibus propositum esset
        idoneos informare adolescéntes, in díssitas regiónes subinde mittendos ad fidem
        propagandam.  Quare mérito véluti auctor censétur præclaríssimi illíus
        instituti, quod Summórum Pontificum ópera amplificátum, proferendæ per univérsum
        orbem catholicæ fidei mirabíliter inservit.  Plura ópera de re sacra et morali
        conscripsit, cuívis hóminum conditióni accommodatíssima.  Denique a sacro
        ministerio numquam deficiens, in cínere et cilício ad Dóminum migrávit Romæ, die
        nona Octobris, anno millesimo sexcentésimo nono, ætátis sexagesimo sexto.  Quem
        sanctitátis et miraculis illustrem Pius nonus Pontifex Maximus Beatórum fastis
        accensuit.  Pius vero undecimus, anno millesimo nongentésimo trigesimo octavo,
        die solemni Paschæ, inter Sanctos adscripsit.
      en: >-
        John Leonard was born of pious and respectable parents in the town of Diecimo,
        not far from the city of Lucca. From very early boyhood he shewed himself mature
        and serious, with an inclination to solitude and prayer. When he was twenty-six
        years old God called him to enlist among the soldiers of the Church. John
        renounced immediately all his worldly interests. At first he had to study
        elementary Latin with little boys, but he soon advanced in a knowledge of
        literature, philosophy and theology. After a scant four years, at the command of
        his superior, he was ordained to the priesthood. Soon afterward he and a group
        of noble youths, alike inflamed with high ideals, earnestly set about attaining
        perfection in virtue. The following year they formed the Congregation of the
        Clerks Regular of the Mother of God, a name chosen because of their intense
        devotion to her. John and his companions laboured with such diligence in their
        care of souls, that before long a change of attitude was brought about. In the
        city state of Lucca, where through the perfidious wiles of the heretics, hateful
        passion turned fiercely among the citizens, where morals were corrupted, in a
        very short space of time the primitive piety of the Christians seemed to revive.


        In his work for the salvation of souls John met most bitter insults from wicked
        men who tried in every way to destroy the newly gathered family. But the man of
        God, bearing all things cheerfully and serenely, defended pertinaciously the
        fruit of his apostolic labours by securing from the Supreme Pontiff, Gregory
        XIII, papal approbation of his Congregation. Many bishops about to undertake
        difficult enterprises sought his advice and aid. Even the Holy Father delegated
        to him the solution of intricate litigation and the reform of religious
        societies. He stood in support of Saint Joseph Calasanctius when his society was
        on the verge of collapse. Scarcely less arduous were the hours John devoted to
        the affairs of the Hospital of the Holy Spirit in the English section of Rome,
        and to those of the convent of Saint Frances of Rome.


        Greatly saddened that so many peoples in far distant places were without the
        light of the Gospel, John burned with a desire to journey to those countries to
        spread the light of the true Faith. But when Saint Philip Neri, who called John
        a true reformer, showed him that he and his Congregation were destined to
        educate the Italian people, John acquiesced to the will of God. He did not,
        however, refrain so completely that he did not try to do some work for the
        infidels. He is therefore, very rightly credited along with the pioneer Vives
        with being the founder of the movement among the bishops to send well-qualified
        young men to distant, alien lands to propagate the faith. Wherefore he is very
        properly regarded as the author of that most illustrious institute which
        augments the work of the Sovereign Pontiffs and serves to spread the Catholic
        faith throughout the world. John wrote many works on theology and morality, well
        adapted to the men of that day. Finally, in sackcloth and ashes, lacking nothing
        in his sacred ministry, he passed to the Lord in Rome on the 9th day of October,
        1609, at the age of sixty-six. He was so famous for sanctity and miracles that
        Pius IX, the Supreme Pontiff, named him on the calendar of the Blessed. In 1938
        on the solemn Feast of Easter, Pius XI enrolled him among the Saints.
    status: { la: verified, en: verified }
