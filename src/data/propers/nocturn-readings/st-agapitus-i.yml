# Matins Nocturn 2 reading for St. Agapitus I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/09-20-AgapitusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-agapitus-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánne hujus nóminis secúndo, e vivis subláto, Agapitus, Románus génere, patre Gordiano,
        sanctæ Románæ Ecclésiæ archidiaconus, propter singulárem eruditiónem, qua probe et appríme
        instrúctus erat, et compositos castigatissimæ vitæ mores, quibus præ céteris eminebat,
        communibus totíus cleri suffrágiis, et ómnium bonórum gratulatione, ad sanctam Petri sedem
        promótus est; et sublimem illam provínciam perinde administrávit, ac si non ab homínibus,
        sed ab ipso Deo eléctus fuísset.


        Egregiis laudum titulis ab antíquis Pátribus decorátus est, dictusque ab iis præco justítiæ,
        Evangélii tuba, vas cathólicum, vir pietáte et miráculis celeberrimus, quibus heroicas
        illíus virtútes et apostólicæ vitæ sanctimóniam Deus illustrávit. Áliquot hujus sanctíssimi
        Præsulis decretales exstant, in quibus cathólicæ fídei dógmata sarta tectaque servantur,
        ecclesiásticæ disciplínæ forma et régula tráditur, sacrórum cánonum et antiquárum
        traditionum indemnitati consulitur, ac demum omnes et singulæ pastorális sollicitudinis
        partes implentur.


        Constantinópolim proféctus est, álio prorsus quam ad quem hómines illum destinarant
        consílio, divíno scílicet instínctu et nutu: ut Anthimum hæréticum patriarcham
        Constantinopolitánum Theodoræ imperatricis malis ártibus intrusum exauctoraret atque
        damnaret, et in ejus locum Mennam substitueret; patriarchales item sedes Alexandrínam et
        Antiochenam, extrusis hæréticis, cathólicis pastoribus restitueret. Sed tandem biénnio
        pontificátus nondum expléto, vir sanctíssimus, in quo nihil, nisi longiorem vitam cathólici
        desiderassent, Constantinópoli pie óbiit, anno Christi quingentésimo trigésimo sexto. Ejus
        corpus Romam translatum, in Vaticáno cónditum est.
      en: >-
        John, the second of that name, having been taken from the living, Agapitus, a Roman by race,
        his father Gordian, archdeacon of the holy Roman Church, on account of the singular learning
        with which he was thoroughly and eminently instructed, and the well-ordered morals of a most
        chaste life in which he excelled beyond others, was raised to the holy see of Peter by the
        common votes of the whole clergy and the rejoicing of all the good; and he administered that
        sublime charge as though he had been chosen not by men but by God himself.


        He was adorned by the ancient Fathers with eminent titles of praise, and was called by them
        herald of justice, trumpet of the Gospel, Catholic vessel, a man most celebrated for piety
        and miracles, by which God made illustrious his heroic virtues and the sanctity of his
        apostolic life. Some decretals of this most holy Prelate exist, in which the dogmas of the
        Catholic faith are kept safe and sound, the form and rule of ecclesiastical discipline are
        handed down, the integrity of the sacred canons and ancient traditions is provided for, and
        finally all and each part of pastoral solicitude is fulfilled.


        He went to Constantinople with a purpose quite other than that for which men had destined
        him, namely by divine instinct and will: that he might depose and condemn Anthimus the
        heretic, patriarch of Constantinople, intruded by the evil arts of the Empress Theodora, and
        put Menas in his place; and that he might restore the patriarchal sees of Alexandria and
        Antioch, the heretics being expelled, to Catholic pastors. But at length, the second year of
        his pontificate not yet complete, that most holy man, in whom Catholics had desired nothing
        except a longer life, piously died at Constantinople, in the year of Christ 536. His body,
        translated to Rome, was laid in the Vatican.
    status: { la: verified, en: draft }
