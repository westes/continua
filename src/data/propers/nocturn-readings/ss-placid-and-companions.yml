# Matins Nocturn 2 reading for Ss. Placid and Companions, Martyrs (Oct
# 5) — SanctiM/10-05.txt bases `@Sancti/10-05` (the whole day, no
# Nocturn 2/3 override), so this feast's own proper content is
# sourced from the Tridentine track exactly as for a pre-1955 saint
# (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints). A
# second SanctiM variant (`SanctiM/10-05r.txt`) is its own content for
# "Ss. Maurus and Placid, disciples of St. Benedict" — not used here
# since the plain suffix already matches our target saint with real
# text.
# web/www/horas/Latin/Sancti/10-05.txt, English/Sancti/10-05.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: ss-placid-and-companions
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Plácidus Romæ, Tertúlllo patre in primis nóbili, natus, puer Deo oblátus et sancto
        Benedícto tráditus, tantum ejus disciplína et monásticæ vitæ institútis profécit, ut
        inter præcípuos illíus discípulos numerétur. Ab eo in Sicíliam missus, monastérium et
        ecclésiam in honórem sancti Joánnis Baptístæ prope Messánæ portum constrúxit, ubi cum
        mónachis admirábili sanctitáte vixit. Ejus viséndi causa cum eo veníssent Eutychius et
        Victorínus, illíus fratres, et Flávia, virgo soror, eódem témpore illuc áppulit
        immánis quidam piráta, Manúcha nómine; qui, capto monastério, cum Plácidum et céteros
        nullo modo addúcere potuísset ut Christum negárent, ipsum fratrésque illíus ac
        sorórem crudéliter necári jussit. Cum quibus étiam Donátus, Firmátus diáconus,
        Faustus aliíque trigínta mónachi, martyrii agónem felíciter consummárunt tértio
        Nonas Octóbris, anno salútis quingentésimo trigésimo nono.
      en: >-
        Placidus was the son of Tertullus, one of the noblest persons of Rome. He was offered
        to God when a child and given over to holy Benedict, in whose teaching and Rule of monks
        he so profited that he was reckoned among the chiefest of his disciples. By him he was
        sent into Sicily, where he founded near the Port of Messina a Church and monastery in
        honour of St. John the Baptist, and lived therein with his monks in wonderful holiness.
        Thither there came to see him his brothers Eutychius and Victorinus and his virgin
        sister Flavia, and while they were together, there landed there a certain brutal
        pirate, named Manucha, who took the monastery, and when he could in no wise prevail
        upon Placidus and the others to deny Christ, he commanded him, his brothers, and his
        sister to be cruelly murdered. With them Donatus, Firmatus a Deacon, Faustus, and
        thirty other monks brought the conflict of testimony to the blessed end of martyrdom,
        upon the fifth day of October, in the year of salvation 539.
    status: { la: verified, en: verified }
