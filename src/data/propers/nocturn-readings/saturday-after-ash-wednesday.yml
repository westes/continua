# Matins Nocturn content for the Saturday after Ash Wednesday — read from
# web/www/horas/{Latin,English}/Tempora/Quadp3-6.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quadp3-6.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Bede homily
# split only to fill the fixed 3-lesson slot count). Responsory1 is a
# cross-reference (@Tempora/Quadp3-0:Responsory7 — the same text Ash
# Wednesday's own combined reading uses, reused here per the source's own
# cross-reference, not an error) per the "the first one, when several
# collapse" convention. This day has no [Ant 3]/[Oratio 3] in the source
# at all (no Vespers-distinct content), unlike its five siblings this
# week — so no `-collect-vespers`/`-magnificat-antiphon` files exist for
# this id.
id: saturday-after-ash-wednesday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Marc 6:47-56", en: "Mark 6:47-56" }
    text:
      la: >-
        In illo témpore: Cum sero esset, erat navis in médio mari, et Jesus solus in terra. Et
        videns discípulos suos laborántes in remigándo - erat enim ventus contrárius eis, - et circa
        quartam vigíliam noctis venit ad eos ámbulans supra mare: et volébat præteríre eos. At illi,
        ut vidérunt eum ambulántem supra mare, putavérunt phantásma esse, et exclamavérunt. Omnes
        enim vidérunt eum, et conturbáti sunt. Et statim locútus est cum eis, et dixit eis:
        Confídite, ego sum, nolíte timére. Et ascéndit ad illos in navim, et cessávit ventus. Et
        plus magis intra se stupébant: non enim intellexérunt de pánibus: erat enim cor eórum
        obcæcátum. Et cum transfretássent, venérunt in terram Genésareth, et applicuérunt. Cumque
        egréssi essent de navi, contínuo cognovérunt eum: et percurréntes univérsam regiónem illam,
        cœpérunt in grabátis eos, qui se male habébant, circumférre ubi audiébant eum esse. Et
        quocúmque introíbat, in vicos vel in villas aut civitátes, in platéis ponébant infírmos, et
        deprecabántur eum, ut vel fímbriam vestiménti ejus tángerent: et quotquot tangébant eum,
        salvi fiébant.
      en: >-
        At that time, when it was late, the ship was in the midst of the sea, and Jesus alone on
        the land. And seeing His disciples straining at the oars, for the wind was against them,
        about the fourth watch of the night He came to them, walking upon the sea, and He would
        have passed by them. But they, seeing Him walking upon the sea, thought it was a ghost, and
        cried out. For they all saw Him, and were troubled. Then He immediately spoke to them, and
        said to them, "Take courage; it is I, do not be afraid." And He got into the boat with them,
        and the wind fell. And they were utterly beside themselves with astonishment, for they had
        not understood about the loaves, because their heart was blinded. And crossing over, they
        came to the land of Genesareth and moored the boat. And when they had gotten out of the
        boat, the people at once recognized Him; and they hurried through the whole country, and
        began to bring the sick on their pallets, wherever they heard He was. And wherever He went,
        into village or hamlet or town, they laid the sick in the market places, and entreated Him
        to let them touch but the tassel of His cloak; and as many as touched Him were saved.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "The Venerable Bede, Priest, Book 2, ch. 28, on Mark 6:45"
    text:
      la: >-
        Labor discipulórum in remigándo, et contrárius eis ventus, labóres sanctæ Ecclésiæ varios
        desígnat: quæ inter undas sǽculi adversántis, et immundórum flatus spirítuum, ad quiétem
        pátriæ cæléstis, quasi ad fidam líttoris statiónem, perveníre conátur. Ubi bene dícitur, quia
        navis erat in médio mari, et ipse solus in terra: quia nonnúnquam Ecclésia tantis gentílium
        pressúris non solum afflícta, sed et fœdáta est, ut, si fíeri posset, Redémptor ipsíus eam
        prorsus deseruísse ad tempus viderétur.


        Unde est illa vox ejus inter undas procellásque tentatiónum irruéntium deprehénsæ, atque
        auxílium protectiónis illíus gemebúndo clamóre quæréntis: Ut quid, Dómine, recessísti longe,
        déspicis in opportunitátibus, in tribulatióne? Quæ páriter vocem inimíci persequéntibus
        expónit, in sequéntibus Psalmi subíciens: Dixit enim in corde suo: Oblítus est Deus, avértit
        fáciem suam, ne vídeat usque in finem.


        Verum ille non oblivíscitur oratiónem páuperum, neque avértit fáciem suam a sperántibus in
        se: quin pótius et certántes cum hóstibus, ut vincant, ádjuvat, et victóres in ætérnum
        corónat. Unde hic quoque apérte dícitur, quia vidit eos laborántes in remigándo. Videt
        quippe Dóminus laborántes in mari, quamvis ipse pósitus in terra: quia etsi ad horam
        différre videátur auxílium tribulátis impéndere, nihilóminus eos, ne in tribulatiónibus
        defíciant, suæ respéctu pietátis corróborat: et aliquándo étiam manifésto adjutório, victis
        adversitátibus, quasi calcátis sedatísque flúctuum volumínibus líberat.
      en: >-
        The toil of the disciples in rowing, and the wind contrary to them, is a figure of the
        diverse toils of the Holy Church, as, amid the waves of a world that fighteth against her,
        and the stormy blasts of unclean spirits, she laboureth to reach the rest of her Fatherland
        above, as a shore safe for her anchor. Here also it is well said that the ship was in the
        midst of the sea, and He alone on the land; for sometimes it cometh to pass that the Church
        is, by the great pressure of the Gentiles, not only so afflicted, but also befouled, that it
        seemeth as though, if it were possible, her Redeemer had for the time forsaken her.


        Whence it is that there cometh that cry of hers, when she is taken amid the waves, and the
        winds of temptations that break upon her, and with piteous entreaty she calleth on Him to
        protect her: Why standest Thou afar off, O Lord, why hidest Thou thyself in times of
        trouble? And then, in the verses that follow, she telleth Him what saith the enemy that
        persecuted her, saying, For he hath said in his heart God hath forgotten; He hideth His
        face, He will never see it.


        Verily, He forgetteth not the prayer of the poor, neither turneth He His face away from any
        that putteth his trust in Him; yea, rather, to him whosoever is striving with the enemy, He
        giveth help to conquer, and, whosoever conquereth, to him He giveth an everlasting crown.
        For the which reason also it is here said plainly He saw them toiling in rowing. The Lord
        seeth them that are toiling in the sea, albeit He be Himself on the land. Although He seem
        for a moment to tarry in succouring the distressed, nevertheless the look of His love is
        strengthening them, all the while, lest they should faint; and sometimes He setteth them
        free, even by an open deliverance, conquering all their adversaries for them, as when He
        walked upon the swelling of the waves, and stilled them.
    responsory:
      la: "R. Veni hódie ad fontem aquæ, et orávi Dóminum, dicens: * Dómine, Deus Abraham, tu prósperum fecísti desidérium meum.\nV. Igitur puélla, cui díxero, Da mihi aquam de hýdria tua, ut bibam: et illa díxerit, Bibe, dómine, et camélis tuis potum tríbuam: ipsa est, quam præparávit Dóminus fílio dómini mei.\nR. Dómine, Deus Abraham, tu prósperum fecísti desidérium meum."
      en: "R. I came this day unto the well, and I besought the Lord, and said: * O Lord God of Abraham, Thou hast prospered my way.\nV. Therefore the virgin to whom I shall say, Give me water of thy pitcher to drink, and she shall say to me, Drink, my lord, and I will give thy camels drink also; let the same be the woman whom the Lord hath appointed out for my master's son.\nR. O Lord God of Abraham, Thou hast prospered my way."
    status: { la: verified, en: verified }
