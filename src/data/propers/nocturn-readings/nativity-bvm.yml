# Matins Nocturn 2 reading for the Nativity of the B.V.M. (Sep 8) —
# SanctiM/09-08.txt inherits the whole day (`@Sancti/09-08`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/09-08.txt, English/Sancti/09-08.txt.
# Lectio4-6 combined into one reading, one continuous excerpt of St.
# Augustine's sermon. No responsory given in the source for these
# lessons.
#
# Checked 2026-09-05 for a Gospel pairing: this reading (Augustine's
# Sermon 18, Lectio4-6) is Nocturn 2, not Nocturn 3 -- it is a
# panegyric on Mary's nativity generally, not an exegesis of a Gospel
# pericope, so no isGospel pairing applies to it. Note for a future
# pass: the source file (horas/Latin/Sancti/09-08.txt) does carry its
# own genuine Nocturn 3 (Lectio7-9: Gospel Matt 1:1-16, the genealogy,
# with St. Jerome's Commentary on Matthew Bk. 1 as the homily) that is
# not authored anywhere in this store at all -- a real content gap,
# but a new reading pair rather than a missing Gospel citation on an
# existing homily, so out of scope for this pass.
id: nativity-bvm
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Sermon 18 on the Saints"
    text:
      la: >-
        Adest nobis, dilectíssimi, optátus dies beátæ ac venerábilis semper Vírginis Maríæ;
        ídeo cum summa exsultatióne gáudeat terra nostra, tantæ Vírginis illustráta natáli. Hæc
        est enim flos campi, de qua ortum est pretiósum lílium convállium, per cujus partum
        mutátur natúra protoplastórum, delétur et culpa. Præcísum est in ea illud Hevæ
        infelicitátis elógium, quo dícitur: In dolóre páries fílios tuos; quia ista in lætítia
        Dóminum péperit.


        Heva enim luxit, ista exsultávit: Heva lácrimas, María gáudium in ventre portávit;
        quia illa peccatórem, ista édidit innocéntem. Mater géneris nostri pœnam íntulit mundo,
        Génetrix Dómini nostri salútem íntulit mundo. Auctrix peccáti Heva, auctrix mériti
        María. Heva occidéndo óbfuit, María vivificándo prófuit. Illa percússit, ista sanávit.
        Pro inobediéntia enim obediéntia commutátur, fides pro perfídia compensátur.


        Plaudat nunc órganis María, et inter velóces artículos týmpana puérperæ cóncrepent.
        Cóncinant lætántes chori, et alternántibus módulis dulcísona cármina misceántur.
        Audíte ígitur, quemádmodum tympanístria nostra cantáverit; ait enim: Magníficat ánima
        mea Dóminum: et exsultávit spíritus meus in Deo, salutári meo. Quia respéxit
        humilitátem ancíllæ suæ: ecce enim ex hoc beátam me dicent omnes generatiónes. Quia
        fecit mihi magna qui potens est. Causam ígitur invalescéntis erráti, miráculum novi
        partus evícit; et Hevæ planctum Maríæ cantus exclúsit.
      en: >-
        Dearly beloved brethren, the day for which we have longed, the Feast-day of the Blessed
        and Worshipful and Ever-Virgin Mary, that day is come. Let our land laugh and sing with
        merriment, bathed in the glory of this great Virgin's rising. She is the flower of the
        fields on which the priceless lily of the valleys hath blossomed. This is she whose
        delivery changed the nature that we draw from our first parents, and cleansed away their
        offence. At her that dolorous sentence which was pronounced over Eve ended its course; to
        her it was never said: In sorrow thou shalt bring forth children. She brought forth a
        Child, even the Lord, but she brought Him forth, not in sorrow, but in joy.


        Eve wept, but Mary laughed. Eve's womb was big with tears, but Mary's womb was big with
        gladness. Eve gave birth to a sinner, but Mary gave birth to the sinless One. The mother
        of our race brought punishment into the world, but the Mother of our Lord brought
        salvation into the world. Eve was the foundress of sin, but Mary was the foundress of
        righteousness. Eve welcomed death, but Mary helped in life. Eve smote, but Mary healed.
        For Eve's disobedience, Mary offered obedience, and for Eve's unbelief, Mary offered
        faith.


        Let Mary now make a loud noise upon the organ, and between its quick notes let the
        rattling of the Mother's timbrel be heard. Let the gladsome choirs sing with her, and
        their sweet hymns mingle with the changing music. Hearken to what a song her timbrel
        will make accompaniment. She saith: My soul doth magnify the Lord, and my spirit hath
        rejoiced in God my Saviour. For He hath regarded the lowliness of His hand-maiden, for,
        behold, from henceforth all generations shall call me blessed; for He That is Mighty
        hath done to me great things. The new miracle of Mary's delivery hath effaced the curse
        of the frail backslider, and the singing of Mary hath silenced the wailing of Eve.
    status: { la: verified, en: verified }
