# Matins Nocturn 2 reading for Our Lady of Ransom (Sep 24). Sourced
# directly from web/www/horas/Latin/Sancti/09-24.txt,
# English/Sancti/09-24.txt. Lectio4-6 combined into one reading, one
# continuous account of the founding of the Order of Our Lady of
# Ransom. No Lectio7-9 in her own file -- defers to the Common's own
# Nocturn 3, not transcribed here.
id: our-lady-of-ransom
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Quo témpore major feliciorque Hispaniárum pars diro Saracenórum
        opprimebátur jugo, innumerique fidéles sub immani servitute,
        maximo cum periculo christianæ fidei abjurandæ, amittendæque
        salútis ætérnæ, infeliciter detinebántur, beatíssima cælórum
        Regína, tot tantisque benigniter occurrens malis, nimiam
        caritátem suam in iis rediméndis osténdit. Nam sancto Petro
        Nolasco, pietáte et opibus florenti, qui, sanctis vacans
        meditatiónibus, jugiter animo recogitábat qua ratióne tot
        Christianórum ærumnis sub Maurórum captivitáte degéntium
        succurri posset, ípsamet beatíssima Virgo, serena fronte, se
        conspiciéndam dedit; et acceptíssimum sibi ac unigenito suo
        Fílio fore dixit, si suum in honórem institueréntur ordo
        religiosórum, quibus cura incumberet captivos e Turcárum
        tyrannide liberandi. Qua cælésti visióne vir Dei recreatus,
        mirum est quo caritátis ardore flagrare cœperit, hoc unum
        servans in corde suo, ut ipse ac instituénda ab eo religio
        maximam illam caritátem sedulo exercerent, ut quisque ánimam
        suam póneret pro amicis et próximis suis.


        Ea ipsa nocte éadem Virgo sanctíssima beato Raymundo de
        Péñafort et Jacobo Aragoniæ regi appáruit, idípsum de religiosis
        instituéndis ádmonens, suadensque ut opem pro constructióne
        tanti operis ferrent. Petrus autem statim ad Raymundi pedes, qui
        ipsi erat a sacris confessiónibus, ádvolans, ei rem omnem
        apéruit; quem étiam cælitus instructum réperit, ejusque
        directióni se humillime subjécit. At, superveniens Jacobus rex,
        quam et ipse acceperat a beatíssima Vírgine, revelatiónem
        éxsequi státuit. Unde, collátis inter se consíliis, et
        consentiéntibus ánimis, in honórem ejusdem Vírginis Matris
        ordinem institúere aggressi sunt, sub invocatióne sanctæ Maríæ
        de Mercede redemptiónis captivórum.


        Die ígitur décima Augusti anno Dómini millesimo ducentésimo
        décimo octavo, rex idem Jacobus eam institutiónem, jamprídem ab
        iisdem sanctis viris conceptam, éxsequi státuit, sodálibus
        quarto voto adstrictis manéndi in pignus sub paganórum potestate,
        si pro Christianórum liberatióne opus fúerit. Quibus rex ipsa
        arma sua regia in péctore deferre concessit, et a Gregório nono
        illud tam præcellentis erga próximum caritátis institutum et
        religiónem confírmari curávit. Sed et ipse Deus per Vírginem
        Matrem increméntum dedit, ut talis institútio celerius ac
        felicius totum per orbem divulgarétur, sanctisque viris florúerit
        caritate ac pietáte insígnibus, qui eleemósynas a Christi
        fidelibus collectas in prétium redemptiónis suórum proximórum
        expénderent, seque ipsos intérdum darent in redemptiónem
        multórum.
      en: >-
        In the early part of the thirteenth century of the era of our
        Lord, the greatest and fairest part of Spain lay crushed under
        the yoke of the Saracens, and countless numbers of the faithful
        were held in brutal slavery, with the most lively danger of
        being made to deny the Christian faith and of losing everlasting
        salvation. Amid such sorrows the most Blessed Queen of heaven
        came mercifully to the rescue, and showed how the greatness of
        her motherly love was fain for their redemption. Holy Peter
        Nolasco, in the full bloom of the treasures of godliness as well
        as rich in earthly wealth, was earnestly pondering with himself
        how he could succour so many suffering Christians dwelling in
        bondage to the Moors. To him appeared with gracious visage the
        Most Blessed Virgin, and bade him know that it would be well
        pleasing in her own sight, and in the sight of her Only-begotten
        Son, that an Order of Religious men should be founded in her
        honour, whose work it should be to redeem prisoners from
        Mohammedan slavery. Strengthened by this heavenly vision, the man
        of God began to burn with wonderful charity, nursing in his
        heart the one desire that he himself and the Order which he
        should found might exercise that love, greater than which hath
        no man, that a man lay down his life for his friends.


        Upon the same night the same most holy Virgin appeared to the
        Blessed Raymund de Penafuerte, and to James, King of Aragon,
        charging them concerning the founding of the Order, and desiring
        them to help in raising up so great a work. Peter betook himself
        forthwith to the feet of Raymund, who was his confessor, and
        laid the matter before him, whom also he found taught from
        heaven, and to whose governance he right humbly submitted
        himself. Then came King James, who appointed to carry out this
        revelation, which himself also had received from the Most
        Blessed Virgin. The three took counsel together, and all with
        one consent entered upon the institution of an Order in honour
        of the said Virgin Mother, to be placed under the invocation of
        St. Mary of Ransom, for the redemption of captives.


        Upon the 10th of August, in the year of our Lord 1218, the
        above-named King James decreed the establishment of this Order,
        thus already conceived by these holy men. The brethren take, in
        addition to the vows of Poverty, Chastity, and Obedience, a
        fourth vow, whereby they bind themselves to remain in pawn with
        the unbelievers, if need so require, for the liberation of
        Christians. The King granted them the right to bear on their
        breasts his own Royal blazon, and obtained from Gregory IX. the
        confirmation of this Institute and Order so nobly marked by
        brotherly charity. God Himself, through the Virgin Mother, gave
        the increase, causing this Institute speedily and prosperously
        to spread through all the world, and to blossom with holy men,
        great in love and godliness, to spend in the redemption of their
        neighbours the alms which are committed to them by Christ's
        faithful people, to that end, and some whiles to give themselves
        up for the ransom of many.
    status: { la: verified, en: verified }
