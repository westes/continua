# Matins Nocturn 2 for "5th Sunday of August" (Tempora/085-0.txt) — see
# month-week-081.yml's header for the id scheme. Responsory reuses 081's
# own Responsory4 (source's own cross-reference).
id: month-week-085
readings:
  - nocturn: 2
    isGospel: false
    source: "St. John Chrysostom, Homily 22"
    text:
      la: >-
        Ne tardes convérti ad Dóminum, et ne dífferas de die in diem; nescis enim quid paritúra sit
        superventúra dies. Perículum enim et metus est in defferéndo; salus vero certa ac secúra, si
        nulla sit dilátio. Virtútem ígitur cole: sic enim, licet júvenis moriáris, secúre discésseris:
        quod si ad senectútem pervéneris, cum multa facilitáte et nulla moléstia e vita discédes;
        duplicémque habébis festivitátem, et quod a vitæ malítia abstinúeris, et quod virtútem
        colúeris. Ne dicas: Erit tempus, quando convérti licébit: verba enim hæc Deum valde exásperant.


        Cur nam, cum ipse tibi ætérna sǽcula promísit, tu in præsénti vita laboráre non vis, quæ parva
        et momentánea est; sed sic ignávus ac dissolútus agis, quasi hac breviórem áliam quamdam
        inquíras? Nonne illæ quotidiánæ comessatiónes, nonne illæ mensæ, nonne scorta illa, nonne
        theátra illa, nonne divítiæ illæ testántur inexplébilem malítiæ concupiscéntiam? Cógita bene,
        quod quóties scortátus es, tóties condemnásti teípsum; peccátum enim ita se habet, ut mox atque
        patrátum fúerit, senténtiam ferat judex.


        Inebriátus es? ventri indulsísti? rapuísti? siste jam gradum: verte te in divérsum: confitére
        Deo grátiam, quod non in médiis peccátis te ábstulit: ne quære áliud tibi prorogári tempus ut
        male operéris. Multi dum male ac vitióse víverent, súbito periérunt et in maniféstam
        damnatiónem abiérunt: time ne idem tibi áccidat. Sed multis, inquis, dedit Deus spátium, ut in
        última senécta confiteréntur. Quid ígitur? numquid et tibi dábitur? Fortásse dabit, inquis. Cur
        dicis, fortásse? Cóntigit aliquóties? Cógita quod de ánima delíberas: proínde étiam de
        contrário cógita, et dic: Quid autem, si non det? Quid autem, si det, inquis? Esto, dat quidem
        ipse: verúmtamen hoc illo cértius et utílius.
      en: >-
        Tarry not to turn thee to the Lord, yea, defer not thy repentance from day to day, for thou
        knowest not what the morrow may bring forth. In delay there is danger and terror, but where
        there is no delay, there health is safe and secure. Live well then, and, then, however young
        thou diest, thou wilt die safely; and if thou come to old age thou wilt depart without vexation
        or trouble; and thou wilt have a double happiness, in that thou wilt be leaving all the evils
        of life, and in that thou hast lived well. Say not: There will be a time meet for repentance,
        for such words as these do greatly rouse the anger of God.


        Wherefore, since He hath promised thee eternal ages, wilt thou not work in this present life,
        which is so short and so fleeting? Dost thou so idly and loosely carry thyself, as though the
        life for which thou seekest were a shorter life than this? Do not daily feastings, daily
        gluttonies, daily uncleanness, shows, and riches bear witness to the undying nature of sinful
        cravings? Think it well over, that as often as thou dost commit uncleanness, thou dost damn
        thyself, for this is the nature of sin: as soon as it is committed, the Judge's sentence is
        uttered.


        Hast thou been drunken? Hast thou over-eaten thyself? Hast thou stolen? Stop, and turn back:
        thank the goodness of God, that He hath not taken thee away in the midst of thy sins; seek not
        more time wherein to commit iniquity. Many have they been who have perished suddenly, in the
        midst of bad and vicious lives, and have gone away to manifest damnation: have a fear lest the
        same thing befall thee. But, thou sayest, they have been many to whom God hath given time, and
        they have been to confession in their old age. What then? Is that a proof that it will be given
        to thee? Perchance, sayest thou. Why sayest thou, Perchance? It befalleth sometimes. Bethink
        thee that it is of thy soul thou art considering. Look at it the other way, and say: What if it
        be not given? But, sayest thou, and what if it be? May it be so; it is true, it is among His
        gifts; but nevertheless, this is the safer and the better way.
    responsory:
      la: "R. Da mihi, Dómine, sédium tuárum assistrícem sapiéntiam, et noli me reprobáre a púeris tuis: * Quóniam servus tuus sum ego, et fílius ancíllæ tuæ.\nV. Mitte illam de sede magnitúdinis tuæ, ut mecum sit et mecum labóret.\nR. Quóniam servus tuus sum ego, et fílius ancíllæ tuæ."
      en: "R. Give me wisdom, O Lord, that sitteth by thy throne, and reject me not from among thy children. * For I am thy servant and son of thine handmaid.\nV. O send her out from the throne of thy glory, to be with me and to labour with me.\nR. For I am thy servant and son of thine handmaid."
    status: { la: verified, en: verified }
