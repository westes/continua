# Matins Nocturn content for Saturday of Lent week 3 — read from
# web/www/horas/{Latin,English}/Tempora/Quad3-6.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad3-6.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory1
# is a cross-reference (@Tempora/Quad3-0:Responsory7 — the same text
# lent-3-wednesday's combined reading uses, reused here per the source's
# own cross-reference, not an error) per the "the first one, when
# several collapse" convention. This day has no [Ant 3]/[Oratio 3] in
# the source at all, so no `-collect-vespers`/`-magnificat-antiphon`
# files exist for this id.
id: lent-3-saturday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Joann 8:1-11", en: "John 8:1-11" }
    text:
      la: >-
        In illo témpore: Perréxit Jesus in montem Olivéti: et dilúculo íterum venit in templum, et
        omnis pópulus venit ad eum, et sedens docébat eos. Addúcunt autem scribæ et pharisǽi
        mulíerem in adultério deprehénsam: et statuérunt eam in médio, et dixérunt ei: Magíster, hæc
        múlier modo deprehénsa est in adultério. In lege autem Móyses mandávit nobis hujúsmodi
        lapidáre. Tu ergo quid dicis? Hoc autem dicébant tentántes eum, ut possent accusáre eum.
        Jesus autem inclínans se deórsum, dígito scribébat in terra. Cum ergo perseverárent
        interrogántes eum, eréxit se, et dixit eis: Qui sine peccáto est vestrum, primus in illam
        lápidem mittat. Et íterum se inclínans, scribébat in terra. Audiéntes autem unus post unum
        exíbant, incipiéntes a senióribus: et remánsit solus Jesus, et múlier in médio stans. Erigens
        autem se Jesus, dixit ei: Múlier, ubi sunt, qui te accusábant? nemo te condemnávit? Quæ
        dixit: Nemo, Dómine. Dixit autem Jesus: Nec ego te condemnábo: Vade, et jam ámplius noli
        peccáre.
      en: >-
        At that time, Jesus went to the Mount of Olives. And at daybreak He came again into the
        temple, and all the people came to Him; and sitting down He began to teach them. Now the
        Scribes and Pharisees brought a woman caught in adultery, and setting her in the midst, said
        to Him, "Master, this woman has just now been caught in adultery. And in the Law Moses
        commanded us to stone such persons. What, therefore, do You say?" Now they were saying this
        to test Him, in order that they might be able to accuse Him. But Jesus, stooping down, began
        to write with His finger on the ground. But when they continued asking Him, He raised
        Himself and said to them, "Let him who is without sin among you be the first to cast a stone
        at her." And again stooping down, He began to write on the ground. But hearing this, they
        went away, one by one, beginning with the eldest. And Jesus remained alone, with the woman
        standing in the midst. And Jesus, raising Himself, said to her, "Woman, where are they? Has
        no one condemned you?" She said, "No one, Lord." Then Jesus said, "Neither will I condemn
        you. Go your way, and from now on sin no more."
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, 33rd Tract on John"
    text:
      la: >-
        Jesus perréxit in montem Olivéti, in montem fructuósum, in montem unguénti, in montem
        chrísmatis. Ubi enim decébat docére Christum, nisi in monte Olivéti? Christi enim nomen a
        chrísmate dictum est: chrisma autem Græce, Latíne únctio nominátur. Ideo autem nos unxit,
        quia luctatóres contra diábolum fecit. Et dilúculo íterum venit in templum, et omnis pópulus
        venit ad eum: et sedens docébat eos, et non tenebátur, quia nondum pati dignabátur. Nunc jam
        atténdite, ubi ab inimícis tentáta sit Dómini mansuetúdo.


        Addúcunt autem illi scribæ et pharisǽi mulíerem in adultério deprehénsam, et statuérunt eam
        in médio, et dixérunt ei: Magíster, hæc múlier modo deprehénsa est in adultério: in lege
        autem Móyses mandávit nobis hujúsmodi lapidáre: tu ergo quid dicis? Hæc autem dicébant
        tentántes eum: ut possent accusáre eum. Unde accusáre? Numquid ipsum in áliquo facínore
        deprehénderant, aut illa múlier ad eum áliquo modo pertinuísse dicebátur?


        Intellegámus, fratres, admirábilem mansuetúdinem in Dómino fuísse. Animadvertérunt eum
        nímium esse mitem, nímium esse mansuétum. De illo quippe fúerat ante prædíctum: Accíngere
        gládio tuo circa femur tuum, potentíssime. Spécie tua et pulchritúdine tua inténde, próspere
        procéde, et regna: propter veritátem, et mansuetúdinem, et justítiam. Ergo áttulit veritátem
        ut doctor, mansuetúdinem ut liberátor, justítiam ut cógnitor. Propter hæc eum esse
        regnatúrum in Spíritu Sancto prophéta prædíxerat. Cum loquerétur, véritas agnoscebátur: cum
        advérsus inimícos non moverétur, mansuetúdo laudabátur. Cum ergo de duóbus istis, id est, de
        veritáte et mansuetúdine ejus, inimíci livóre et invídia torqueréntur; in tértio, id est
        justítia, scándalum posuérunt.
      en: >-
        Jesus went unto the Mount of Olives, even unto that fruitful Mount, that anointing Mount,
        that Mount of Chrism. Where else became it Christ to teach, if not on the Mount of Olives?
        For the word Christ is derived from Chrisma, and Chrisma is the Greek for ointment. He hath
        anointed us that we may be able to wrestle with the devil. And, early in the morning, He
        came again into the temple; and all the people came unto Him; and He sat down, and taught
        them and no man laid hands on Him, because He was not yet pleased to suffer. And now listen
        how His enemies tried the Lord's meekness.


        And the Scribes and Pharisees brought unto Him a woman taken in adultery; and when they had
        set her in the midst, they say unto Him: Master, this woman was taken in adultery, in the
        very act. Now, Moses in the law commanded that such should be stoned; but what sayest Thou?
        This they said, tempting Him, that they might have to accuse Him. Whereof to accuse Him? Had
        they taken Him in any sin? Or was the woman said to have anything to do with Him?


        We must understand, my brethren, that there was a wonderful gentleness in the Lord. They
        knew that He was most mild and most gentle. Of Him indeed it had been said of old time: Gird
        thy sword upon thy thigh, O most Mighty! In thy comeliness and thy beauty go forward, fare
        prosperously, and reign, because of truth, and meekness, and righteousness. And He came
        bringing truth as one that teacheth, meekness as one that delivereth, and righteousness as
        one that knoweth. Because of these it was that the Prophet declared, in the Holy Ghost, that
        He was to reign. Whenever He spake, truth shone forth whenever He spared His enemies,
        meekness was made glorious. And His enemies, racked with envy and hatred by His truth and
        His meekness, laid a stumbling-block for His righteousness.
    responsory:
      la: "R. Mérito hæc pátimur, quia peccávimus in fratrem nostrum, vidéntes angústias ánimæ ejus, dum deprecarétur nos, et non audívimus: * Idcírco venit super nos tribulátio.\nV. Dixit Ruben frátribus suis: Numquid non dixi vobis, Nolíte peccáre in púerum; et non audístis me?\nR. Idcírco venit super nos tribulátio."
      en: "R. We are verily guilty concerning our brother, in that we saw the anguish of his soul, when he besought us, and we would not hear. * Therefore is this distress come upon us.\nV. And Reuben answered his brethren, saying, Spake I not unto you, saying, Do not sin against the child; and ye would not hear?\nR. Therefore is this distress come upon us."
    status: { la: verified, en: verified }
