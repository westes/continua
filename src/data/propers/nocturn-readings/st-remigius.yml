# Matins Nocturn 2 reading for St. Remigius, Bishop, Confessor (Oct 1)
# — SanctiM/10-01b.txt bases `@Sancti/10-01` (the whole day, no
# Nocturn 2/3 override), so this saint's own content is sourced from
# the Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/10-01.txt, English/Sancti/10-01.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-remigius
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Remigius, epíscopus Rheménsis, flóruit Clodovéo rege Francórum; quem étiam baptizávit,
        et, primus ómnium, doctrina et miraculis Francos ad Christi Dómini fidem perdúxit.
        Ejus oratióne, mortua puella revixit. Multos interpretátus est divinæ Scripturæ
        libros. Amplius septuagínta annos summa cum laude Rhemensem ecclésiam administrávit.
        Cujus vita et mortis sanctitátem multa, quæ consecuta sunt, miracula comprobarunt.
      en: >-
        Remigius, Archbishop of Reims, flourished in the time of Chlodwig, King of the Franks,
        whom he baptised, and was the first who, by his preaching and miracles, brought the
        Franks to believe in the Lord Christ. At his prayers, a dead maiden was raised to life.
        He expounded many books of the Holy Scriptures. He ministered to the Church of Rheims
        with the utmost acceptance for above three score and ten years, and the holiness of his
        life and death were witnessed by many signs and wonders which befell afterwards.
    status: { la: verified, en: verified }
