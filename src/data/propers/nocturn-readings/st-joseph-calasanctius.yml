# Matins Nocturn 2-3 readings for St. Joseph Calasanctius, Confessor
# (Aug 27). Sourced directly from web/www/horas/Latin/Sancti/08-27.txt,
# English/Sancti/08-27.txt. Nocturn 2: Lectio4-6 combined into one
# reading, one continuous vita. Nocturn 3: his own Gospel citation ends
# "Et réliqua"/"And so on" with no full pericope given -- per the
# bare-incipit convention, only the homily (Lectio7-9, St. John
# Chrysostom) is authored, isGospel: false, no citation field.
id: st-joseph-calasanctius
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Josephus Calasanctius a Matre Dei, Petraltæ in Aragonia nobili genere
        natus, a teneris annis futuræ in pueros caritatis et eorum
        institutionis indicia præbuit. Nam adhuc parvulus eos ad se
        convocatos in mysteriis fidei et sacris precibus erudiebat. Humanis
        divinisque litteris egregie doctus cum studiis theologicis Valentiæ
        operam daret, nobilis potentisque feminæ illecebris fortiter
        superatis, virginitatem, quam Deo voverat, inoffensam insigni
        victoria servavit. Sacerdos ex voto factus, a compluribus episcopis
        in Castellæ Novæ, Aragoniæ et Catalauniæ regnis in partem laboris
        ascitus, exspectationem omnium vicit, pravis ubique moribus
        emendatis, ecclesiastica disciplina restituta, inimicitiis
        cruentisque factionibus mirifice exstinctis. At cælesti visione et
        Dei voce frequenter admonitus, Romam profectus est.


        In Urbe summa vitæ asperitate, vigiliis et jejuniis corpus
        affligens, in orationibus et cælestium rerum contemplatione dies
        noctesque versabatur, septem ejusdem Urbis ecclesias singulis fere
        noctibus obire solitus: quem inde morem complures annos servavit.
        Dato piis sodalitatibus nomine, mirum quanto ardore pauperes,
        infirmos potissimum, aut carceribus detentos eleemosynis omnique
        pietatis officio sublevaret. Lue Urbem depopulante, una cum sancto
        Camillo, tanto fuit actus impetu caritatis, ut præter subsidia
        ægrotis pauperibus large collata, ipsa étiam defunctorum cadavera
        suis humeris tumulanda transferret. Verum cum divinitus accepisset,
        se ad informandos intelligentiæ ac pietatis spiritu adolescentulos
        præcipue pauperes, destinari, ordinem Clericorum regularium
        pauperum Matris Dei scholarum piarum fundavit, qui peculiarem curam
        circa puerorum eruditionem ex proprio instituto profiterentur:
        ipsumque ordinem a Clemente octavo, a Paulo quinto aliusque summis
        Pontificibus magnopere probatum, brevi tempore per plurimas Europæ
        provincias et regna mirabiliter propagavit.


        Quamvis ordini universo præesset, totisque viribus ad animarum
        salutem incumberet, numquam tamen intermisit pueros, præsertim
        pauperiores, erudire, quorum scholas verrere, eosque domum
        comitari consuevit. In eo summæ patientiæ et humilitatis munere,
        valetudine étiam infirma, duos et quinquaginta annos perseveravit:
        dignus propterea, quem crebris Deus miraculis coram discipulis
        illustraret, et cui beatissima Virgo cum puero Jesu, illis
        orantibus benedicente, appareret. Cum obitus sui diem, et ordinis
        tunc prope eversi restitutionem atque incrementum prænuntiasset,
        secundum et nonagesimum annum agens, Romæ obdormivit in Domino,
        octavo Kalendas Septembris, anno millesimo sexcentesimo
        quadragesimo octavo. Ejus cor et lingua post sæculum integra et
        incorrupta reperta sunt. Ipse vero multis post obitum quoque
        signis a Deo illustratus, primum a Benedicto decimo quarto
        beatorum cultu decoratus fuit, ac deínde a Clemente decimo tertio
        inter sanctos solemniter est relatus.
      en: >-
        Joseph Calasanz, called of the Mother of God, was born of a noble
        family at Petralta in Aragon. From his tender years he began to show
        that fondness for children, and that gift of instructing them for
        which he was afterwards distinguished. He called them around him
        when he was still but a child himself, and taught them the
        mysteries of the faith and godly prayers. He was deeply learned in
        profane and sacred letters, and it was while he was studying
        theology at Valencia that he bravely overcame the wiles of a noble
        and powerful lady and, by a brilliant victory, kept untarnished
        that virginity which he had vowed to God. He became a Priest in
        consequence of a vow, and was summoned by many Bishops in the
        kingdoms of New Castile, Aragon, and Catalonia to help them in
        their work, wherein he surpassed the hopes of all, correcting
        depraved manners, restoring the discipline of the Church, and
        marvellously putting an end to hatreds and bloody feuds. But in
        obedience to a vision from heaven and many warnings from the voice
        of God, he left Spain and went to Rome.


        In Rome he afflicted his body with extraordinary hardness of
        living, with watching, and with fasting, and so passed his days
        and nights in prayer, and in the contemplation of heavenly things.
        He was used to visit the Seven Churches almost every night, a
        custom which he kept for many years. Having joined several godly
        Brotherhoods, it was strange how eagerly he relieved the poor by
        alms and every sort of kindness, choosing especially the sick and
        the imprisoned. When the city was ravaged by a pestilence, such
        was the charitable zeal with which he joined in the labours of
        St. Camillus de' Lelli, that besides the great help which he
        brought to the sick poor, he would even carry the bodies of the
        dead on his own shoulders to burial. Having understood from God
        that his call was to bring up children in godliness and good
        learning, he founded the Order of the Poor Regular Clerks of the
        Pious Schools of the Mother of God, who profess as the special
        object of their Institute a singular care for the teaching of the
        poor. This Institute received the warm approval of Clement VIII.,
        Paul V., and other Popes, and in a short time obtained a
        marvellous extension through many provinces and kingdoms of
        Europe.


        Then when he was at the head of his whole Order, and toiling with
        all his might for the salvation of souls, he never ceased to teach
        children, especially the poor, to sweep out the school-rooms, and
        to accompany the scholars home. Thus in spite of broken health he
        worked on for two and fifty years, with the greatest longsuffering
        and lowliness. He won that God should glorify him by many miracles
        worked in the presence of his disciples, and that the Most Blessed
        Virgin should appear to him, with the Child Jesus in her arms,
        blessing them as they prayed. He foretold the day of his own
        death, and the restoration and growth of his Order, which seemed
        at that time to be almost entirely destroyed. He fell asleep in
        the Lord at Rome, upon the 25th day of August, in the year of
        salvation 1648, and of his own age the 92nd. An hundred years
        after his death his heart and tongue were found whole and
        incorrupt. God glorified him by many miracles even after his
        death, and he was first crowned by Benedict XIV. with the honours
        paid to the Blessed, and then solemnly enrolled by Clement XIII.
        among the Saints.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. John Chrysostom, Homily 60 on Matthew, ch. 18"
    text:
      la: >-
        Videte ne aliquem istorum contempseritis parvulorum, quia eorum
        Angeli Patris mei faciem semper aspiciunt, et quia ego propter eos
        veni, et hæc Patris mei voluntas est. Ad tuendos conservandosque
        pusilios diligentiores nos reddit. Perspicis quam ingentia in
        tutelam tenujum mœnia erexerit, et quantum studium curamque
        habeat, ne perdantur tum quia supremas despicientibus eos pœnas
        statuit, tum quia summam pollicetur mercedem his, qui curam eorum
        suscipiunt; idque tam suo, quam Patris exemplo corroborat.


        Dominum igitur étiam nos imitemur, et nihil pro fratribus
        omittamus, étiam eorum quæ humilia viliaque nimium videntur; sed si
        administratione nostra étiam opus fuerit, quamvis tenuis atque
        abjectus quidem, cui administrandum sit, fuerit, quamvis ardua
        nobis res atque laboris plena esse videatur, omnia hæc pro fratris
        salute tolerabiliora facilioraque, oro, videantur: tanto enim
        studio tantaque cura Deus dignam esse animam ostendit, ut neque
        Filio suo pepercerit.


        Si non est nobis satis ad salutem, quod virtuose ipsi vivamus, sed
        oportet aliorum salutem re ipsa desiderare; cum neque nos recte
        vivamus, neque alios hortemur, quid respondebimus? Quæ nobis spes
        salutis reliqua erit? Quid majus, quam animis moderari, quam
        adolescentulorum fingere mores? Omni certe pictore, omni certe
        statuario, ceterisque hujusmodi omnibus excellentiorem hunc duco,
        qui juvenum animos fingere non ignoret.
      en: >-
        Take heed, saith Jesus, that ye despise not one of these little
        ones, for I say unto you, that in heaven their angels do always
        behold the face of My Father; and that for their sake am I come,
        and this is the will of My Father. Hereby the Lord stirreth us up
        to guard and save these little ones. Thou seest how mighty are the
        walls which He raiseth to protect little children, and how great
        thought and care He hath lest they should be lost, threatening on
        the one hand the uttermost punishment against whosoever shall
        offend one of these little ones which believe in Him, and promising
        on the other hand, the highest reward to whosoever shall receive
        one such little child in His Name, and this His teaching He giveth
        both in His Own, and in His Father's Name.


        Let us therefore take example by the Lord, and let us leave nothing
        undone for the good of any of our brethren, even for such as seem
        to us the least and lowliest, but if there be any need that we
        should serve any, low and outcast though he be, let us serve him
        though the thing look hard to us and calling for a great deal of
        work, let such things, I pray, be looked on as light and easy if
        they be required for our neighbour's salvation, for of such price
        and such care did God count his soul to be worth, that He spared
        not to purchase it, even His Own Son.


        If it be not enough for our salvation that we should ourselves
        live well, but we must also seek the salvation of others, what
        shall we answer, if we neither live well ourselves, nor exhort
        others? What hope that we shall be saved is then left to us? What
        more important task is there than to train up minds, and teach to
        the young how to live? He that is skilled to mould well the minds
        of children I reckon a nobler workman than any painter or
        sculptor, or such like artist.
    status: { la: verified, en: verified }
