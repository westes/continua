# Matins Nocturn 2 reading for St. Thomas of Villanova, Bishop and Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/09-22.txt, English/Sancti/09-22.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-thomas-of-villanova
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Thomas, in oppido Fontisplani Toletanæ diœceseos in Hispánia natus anno Dómini
        millesimo quadringentésimo octogesimo octavo, ab optimis paréntibus, ineunte
        vita, pietátem et singularem in páuperes misericórdiam accépit. Cujus adhuc puer
        complura dedit exempla; sed illud in primis nóbile, quod, ut nudos operíret,
        propriis vestibus non semel seípsum exuit. Exacta puerítia, Complúto, quo missus
        fuerat ut alumnus in collegio majori sancti Ildefonsi litteris operam daret,
        patris óbitu revocatus, universam hereditátem egenis virgínibus aléndis dicávit;
        eodemque statim reversus est, et, sacræ theologíæ cursu confecto, adeo doctrina
        excelluit, ut, in eadem universitáte cathedram ascendere jussus, philosophicas
        theologicasque quæstiónes mirabíliter explanaverit, interim assiduis precibus
        sciéntiam Sanctórum et rectam vitæ morúmque normam a Dómino vehementíssime
        postulans. Quare, divino instinctu, Eremitárum sancti Augustíni amplexus est
        institutum.


        Religiónem proféssus, ómnibus religiosi hóminis virtútibus et ornamentis
        excelluit, humilitate, patiéntia, continéntia, sed ardentíssima caritate summe
        conspicuus, inter varios et assiduos labóres oratióni rerumque divinárum
        meditatióni invicto spíritu semper intentus. Prædicándi onus, útpote sanctimónia
        et doctrina præstans, subire jussus, cælésti aspirante grátia, innumerábiles e
        vitiórum cœno in viam salútis edúxit. Regéndis deínde frátribus admotus,
        prudéntiam, æquitátem et mansuetúdinem pari sedulitate ac severitáte conjunxit;
        adeo, ut priscam sui ordinis disciplínam multis in locis vel firmaverit vel
        restitúerit.


        Granaténsis archiepíscopus designátus, mira humilitate et constántia insigne
        munus rejécit. Verum, non multo post, Valentinam ecclésiam, superiórum
        auctoritate coactus, gubernandam suscépit; quam annis ferme undecim ita rexit,
        ut sanctíssimi et vigilantíssimi pastoris partes expleverit. Ceterum, consueta
        vivéndi ratióne nihil admodum immutata, inexplébili caritáti multo magis
        indulsit, cum amplos ecclésiæ réditus in egénos dispérsit, ne lectulo quidem
        sibi relícto: nam eum, in quo decumbebat cum in cælum evocarétur, ab eodem
        commodátum hábuit, cui paulo ante eleemósynæ loco donaverat. Obdormívit in
        Dómino, sexto Idus Septembris, annos natus octo et sexagínta. Servi sui
        sanctitátem adhuc viventis, et exínde post mortem, miraculis Deus testatam
        vóluit; præsertim, cum horreum, fruménto paupéribus distributo, pénitus vacuum,
        repénte plenum invéntum est, et cum ad ejus sepúlcrum puer mórtuus revixit.
        Quibus aliisque non paucis fulgentem signis, Alexander septimus, Pontifex
        maximus, Sanctórum número adscripsit.
      en: >-
        Thomas of Villanova was born of excellent parentage, in the town of Fuenlana, in
        the Diocese of Toledo in Spain, in the year of our Lord 1488, and was early
        taught godliness, and a special pitifulness towards the needy. Of this grace he
        gave many examples while he was still a lad, whereof it is an eminent one that
        he more than once stripped himself of raiment of his own, in order to clothe the
        naked. He was become a man when the death of his father called him from Alcala,
        whither he had been sent to work as a student in the great College of St.
        Alonzo. He gave all the inheritance which fell to him to feed poor unmarried
        women, and forthwith returned to Alcala, and finished his course in Theology. He
        was so eminent in learning that he was commanded to take a Professorship in that
        University, and delivered remarkable Lectures upon Philosophy and Theology.
        Meanwhile he ceased not earnestly to entreat of the Lord in prayer the knowledge
        of the Saints, and to know what was the path of life whereunto he was called. In
        course of time, by the inspiration of God, he entered the Institute of Hermits
        of St. Augustine.


        In the Order wherein he had professed, he was marked for all that maketh a good
        and edifying Friar, for lowliness, for long-suffering, for cleanness-of-heart,
        but, above all, for the warmth of his charity. Amid diverse and hard works, he
        let his spirit never faint from prayer and study of the things of God. On
        account of his holiness and learning he was bidden to undertake the work of
        preaching, and, by the help of God's grace, was the means of drawing countless
        souls out of the slough of sin into the way that leadeth unto life. Being raised
        to rule over his brethren, he so joined wisdom, justice, and gentleness with
        watchfulness and firmness, that he either established or restored in many places
        the original discipline of his Order.


        He was named to the Archbishopric of Granada, but, with excellent lowliness and
        firmness, he refused to take so high a place. However, not long after, he was
        forced by the commands of his superiors to accept the government of the Church
        of Valencia, which he discharged for nearly eleven years with the reputation of
        a most holy and watchful shepherd of souls. His elevation changed nowise his way
        of life, except to give greater scope to his wonderful charity by placing the
        revenues of a wealthy Church at his disposal to distribute to the poor. He did
        not leave himself even a bed that on which he was lying when he was called to
        heaven, he had only on loan from a person to whom he had shortly before given it
        as an alms. He fell asleep in the Lord upon the 8th day of September, in the
        69th year of his own age, (and of our Lord 1555.) God was pleased to approve the
        holiness of His servant by miracles, both during his life and after his death,
        whereof are specially remarked that when he had utterly emptied his barn by
        giving away all his corn to the poor, it was suddenly found full again, and that
        a dead boy was raised to life at his grave. Finding him famous for these signs,
        and not a few others, Pope Alexander VII. enrolled him in the list of the
        Saints, and ordered that his memory should be held in remembrance upon the 18th
        day of September.
