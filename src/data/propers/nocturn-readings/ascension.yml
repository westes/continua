# Matins nocturn content for Ascension Thursday (temporalId ascension,
# Duplex I classis cum Octava). Sourced from Tempora/Pasc5-4.txt (Latin)
# / English/Tempora/Pasc5-4.txt, and the Gospel pericope's full text from
# missa/Latin+English/Tempora/Pasc5-4.txt's own [Evangelium] (the Matins
# file itself only gives the incipit + "Et réliqua" for Lectio7, per this
# project's Gospel/homily-split convention).
#
# The audit found this id registered in ALWAYS_OVERRIDE_TEMPORAL_IDS,
# with a real collect already authored (ascension-collect.yml), but no
# antiphons or Matins reading. Ascension is a real 9-lesson, 3-nocturn
# day in the source (not one of the "1 nocturn" compressed solemnities
# like Easter/Pentecost). Nocturn 1 (Lectio1-3, Acts 1:1-14) left
# unauthored here per this project's convention of leaving Nocturn 1
# scripture to the bible-plan store.
#
# Nocturn 2: Lectio4-6 (St. Leo the Great's own first sermon on the
# Ascension) combined into one continuous excerpt.
# Nocturn 3: the Gospel pericope (Mark 16:14-20) authored in full
# (isGospel: true), followed by Lectio7's homily portion (incipit
# dropped) combined with Lectio8-9 as one continuous excerpt of St.
# Gregory the Great's own Homily 29 on the Gospels.
id: ascension
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Leo the Great, Pope, Sermon 1 on the Ascension of the Lord"
    text:
      la: >-
        Post beátam et gloriósam resurrectiónem Dómini nostri Jesu Christi, qua verum Dei
        templum, Judáica impietáte resolútum, divína in tríduo poténtia suscitávit,
        quadragenárius hódie, dilectíssimi, sanctórum diérum explétus est númerus,
        sacratíssima ordinatióne dispósitus, et ad utilitátem nostræ eruditiónis
        impénsus: ut, dum a Dómino in hoc spátio mora præséntiæ corporális exténditur,
        fides resurrectiónis documéntis necessáriis munirétur. Mors enim Christi multum
        discipulórum corda turbáverat: et de supplício crucis, de emissióne spíritus, de
        exanimáti córporis sepultúra gravátis mœstitúdine méntibus, quidam diffidéntiæ
        torpor obrépserat.


        Unde beatíssimi Apóstoli, omnésque discípuli, qui et de éxitu crucis fúerant
        trépidi, et de fide resurrectiónis ambígui, ita sunt veritáte perspícua
        roboráti, ut, Dómino in cælórum eúnte sublímia, non solum nulla afficeréntur
        tristítia, sed étiam magno gáudio repleréntur. Et revéra magna et ineffábilis
        erat causa gaudéndi, cum in conspéctu sanctæ multitúdinis super ómnium
        creaturárum cæléstium dignitátem humáni géneris natúra conscénderet,
        supergressúra Angélicos órdines, et ultra Archangelórum altitúdines elevánda:
        nec ullis sublimitátibus modum suæ provectiónis habitúra, nisi ætérni Patris
        recépta conséssu, illíus glóriæ sociarétur in throno, cujus natúræ copulabátur
        in Fílio.


        Quia ígitur Christi ascénsio, nostra provéctio est; et quo præcéssit glória
        cápitis, eo spes vocátur et córporis: dignis, dilectíssimi, exsultémus gáudiis,
        et pia gratiárum actióne lætémur. Hódie enim non solum paradísi possessóres
        firmáti sumus, sed étiam cælórum in Christo supérna penetrávimus: amplióra
        adépti per ineffábilem Christi grátiam, quam per diáboli amiserámus invídiam.
        Nam quos viruléntus inimícus primi habitáculi felicitáte dejécit, eos sibi
        concorporátos Dei Fílius ad déxteram Patris collocávit: cum quo vivit et regnat
        in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. Amen.
      en: >-
        After the blessed and glorious Resurrection of our Lord Jesus Christ, whereby
        the true temple of God, cast down through Jewish impiety, was raised up again by
        the divine power in three days, there is fulfilled this day, beloved, the number
        of forty holy days, appointed by a most sacred ordinance, and devoted to our
        profitable instruction; so that, while the Lord's bodily presence was thus
        prolonged, our faith in the Resurrection might be fortified by all necessary
        proofs. For the death of Christ had greatly troubled the hearts of the
        disciples, and a certain sluggishness of distrust had crept over minds weighed
        down with sorrow at the punishment of the cross, the giving up of the spirit,
        and the burial of the lifeless body.


        Wherefore the most blessed Apostles, and all the disciples, who had been fearful
        at the outcome of the cross, and doubtful of the truth of the Resurrection, were
        so strengthened by the clear evidence of the truth that, when the Lord went up
        into the height of the heavens, they were affected not by sadness but rather
        filled with great joy. And truly great and unspeakable was their cause for
        rejoicing, when, in the sight of that holy multitude, the nature of mankind rose
        up above the dignity of all heavenly creatures, destined to pass beyond the
        ranks of the Angels and to be raised higher than the Archangels themselves: nor
        would it find any limit to its ascent, save by being received into the
        fellowship of the eternal Father, sharing His throne in that same glory to which
        it was joined by nature in the Person of the Son.


        Since, then, the Ascension of Christ is our own advancement, and where the glory
        of the Head has gone before, there the hope of the Body is called also: let us,
        beloved, exult with fitting joy, and be glad with devout thanksgiving. For this
        day we are established not only as possessors of paradise, but we have also in
        Christ penetrated the very heights of the heavens, gaining more abundant gifts
        through the ineffable grace of Christ than we had lost through the envy of the
        devil. For those whom the venomous enemy cast down from the happiness of their
        first home, these the Son of God, having made them members of His own Body, has
        set at the right hand of the Father: with Whom He liveth and reigneth in the
        unity of the Holy Ghost, God, world without end. Amen.
    responsory:
      la: "R. Non turbétur cor vestrum: ego vado ad Patrem; et cum assúmptus fúero a vobis, mittam vobis, allelúia, * Spíritum veritátis, et gaudébit cor vestrum, allelúia.\nV. Ego rogábo Patrem, et álium Paráclitum dabit vobis.\nR. Spíritum veritátis, et gaudébit cor vestrum, allelúia."
      en: "R. Let not your heart be troubled: I go to the Father; and when I have been taken up from you, I will send unto you, alleluia, * the Spirit of truth, and your heart shall rejoice, alleluia.\nV. I will ask the Father, and He shall give you another Comforter.\nR. The Spirit of truth, and your heart shall rejoice, alleluia."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Marc 16:14-20", en: "Mark 16:14-20" }
    text:
      la: >-
        In illo témpore: Recumbéntibus úndecim discípulis, appáruit illis Jesus: et
        exprobrávit incredulitátem eórum et durítiam cordis: quia iis, qui víderant eum
        resurrexísse, non credidérunt. Et dixit eis: Eúntes in mundum univérsum,
        prædicáte Evangélium omni creatúræ. Qui credíderit et baptizátus fúerit, salvus
        erit: qui vero non credíderit, condemnábitur. Signa autem eos, qui credíderint,
        hæc sequéntur: In nómine meo dæmónia ejícient: linguis loquentur novis:
        serpentes tollent: et si mortíferum quid bíberint, non eis nocébit: super ægros
        manus impónent, et bene habébunt. Et Dóminus quidem Jesus, postquam locútus est
        eis, assúmptus est in cœlum, et sedet a dextris Dei. Illi autem profécti,
        prædicavérunt ubíque, Dómino cooperánte et sermónem confirmánte, sequéntibus
        signis.
      en: >-
        At that time, Jesus appeared unto the eleven disciples as they sat at table: and
        he upbraided them with their incredulity and hardness of heart, because they did
        not believe them who had seen him after he was risen again. And he said to them:
        Go ye into the whole world, and preach the gospel to every creature. He that
        believeth and is baptized, shall be saved: but he that believeth not shall be
        condemned. And these signs shall follow them that believe: In my name they shall
        cast out devils; they shall speak with new tongues; they shall take up
        serpents; and if they shall drink any deadly thing, it shall not hurt them; they
        shall lay their hands upon the sick, and they shall recover. And the Lord Jesus,
        after he had spoken to them, was taken up into heaven and sitteth on the right
        hand of God. But they going forth preached everywhere, the Lord working withal,
        and confirming the word with signs that followed.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "Pope St. Gregory the Great, Homily 29 on the Gospels"
    text:
      la: >-
        Quod resurrectiónem Domínicam discípuli tarde credidérunt, non tam illórum
        infírmitas, quam nostra, ut ita dicam, futúra fírmitas fuit. Ipsa namque
        resurréctio illis dubitántibus per multa arguménta monstráta est: quæ dum nos
        legéntes agnóscimus, quid áliud quam de illórum dubitatióne solidámur? Minus
        enim mihi María Magdaléne prǽstitit, quæ cítius crédidit, quam Thomas, qui diu
        dubitávit. Ille étenim dubitándo, vúlnerum cicatríces tétigit, et de nostro
        péctore dubitatiónis vulnus amputávit.


        Ad insinuándam quoque veritátem Domínicæ resurrectiónis, notándum nobis est quid
        Lucas réferat, dicens: Convéscens, præcépit eis ab Jerosólymis ne discéderent.
        Et post pauca: Vidéntibus illis, elevátus est, et nubes suscépit eum ab óculis
        eórum. Notáte verba, signáte mystéria. Convéscens elevátus est. Comédit, et
        ascéndit: ut vidélicet per efféctum comestiónis, véritas patésceret carnis.
        Marcus vero, priúsquam cælum Dóminus ascéndat, eum de cordis atque infidelitátis
        durítia increpásse discípulos mémorat. Qua in re quid considerándum est, nisi
        quod idcírco Dóminus tunc discípulos increpávit, cum eos corporáliter relíquit,
        ut verba, quæ recédens díceret, in corde audiéntium árctius impréssa remanérent?


        Increpáta ígitur eórum durítia, quid admonéndo dicat, audiámus: Eúntes in mundum
        univérsum, prædicáte Evangélium omni creatúræ. Numquid, fratres mei, sanctum
        Evangélium vel insensátis rebus, vel brutis animálibus fúerat prædicándum, ut de
        eo discípulis dicátur: Prædicáte omni creatúræ? Sed omnis creatúræ nómine
        signátur homo. Omnis autem creatúræ áliquid habet homo. Habet namque commúne
        esse cum lapídibus, vívere cum arbóribus, sentíre cum animálibus, intellégere
        cum Angelis. Si ergo commúne habet áliquid cum omni creatúra homo, juxta áliquid
        omnis creatúra est homo. Omni ergo creatúræ prædicátur Evangélium, cum soli
        hómini prædicátur.
      en: >-
        I may be allowed to say that the disciples' slowness to believe that the Lord
        had indeed risen from the dead, was not so much their weakness as our strength.
        In consequence of their doubts, the fact of the Resurrection was demonstrated by
        many infallible proofs. These proofs we read and acknowledge. What then
        assureth our faith, if not their doubt? For my part, I put my trust in Thomas,
        who doubted long, much more than in Mary Magdalene, who believed at once.
        Through his doubting, he came actually to handle the holes of the Wounds, and
        thereby closed up any wound of doubt in our hearts.


        To confirm to our minds the trustworthiness of the fact that our Lord did indeed
        rise again from the dead, it is well for us to remark one of the statements of
        Luke: "Eating together with them, He commanded them that they should not depart
        from Jerusalem"; and a little afterward: "While they beheld, He was taken up,
        and a cloud received Him out of their sight." Consider these words, note well
        these mysteries. After "eating together with them He was taken up." He ate and
        ascended: that the fact of His eating might show the reality of the Body in
        Which He went up. But Mark telleth us that before the Lord ascended into
        heaven, He upbraided His disciples with their unbelief and hardness of heart.
        From this I know not why we should gather, but that the Lord then upbraided His
        disciples, for whom He was about to be parted in the body, to the end that the
        words which He spoke unto them as He left them might be the deeper imprinted on
        their hearts.


        When then He had rebuked the hardness of their heart, what command did He give
        them? Let us hear. "Go ye into all the world and preach the Gospel to every
        creature." Was the Holy Gospel, then, my brethren, to be preached to things
        insensate, or to brute beasts, that the Lord said to His disciples, "Preach the
        Gospel to every creature"? Nay, but by the words "every creature" we must
        understand man, in whom are combined qualities of all creatures. Being he hath
        in common with stones, life in common with trees, feeling in common with
        beasts, understanding in common with angels. If, then, man hath something in
        common with every creature, man is to a certain extent every creature. The
        Gospel, then, if it be preached to man only, is preached to every creature.
    responsory:
      la: "R. Ego rogábo Patrem, et álium Paráclitum dabit vobis, * Ut máneat vobíscum in ætérnum, Spíritum veritátis, allelúia.\nV. Si enim non abíero, Paráclitus non véniet ad vos: si autem abíero, mittam eum ad vos.\nR. Ut máneat vobíscum in ætérnum, Spíritum veritátis, allelúia."
      en: "R. I will pray the Father, and He shall give you another Comforter, * that He may abide with you for ever, even the Spirit of truth, alleluia.\nV. For if I go not away, the Comforter will not come unto you; but if I depart, I will send Him unto you.\nR. That He may abide with you for ever, even the Spirit of truth, alleluia."
    status: { la: verified, en: verified }
