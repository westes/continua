# Matins Nocturn content for Wednesday in the 4th week of Lent — read
# from web/www/horas/{Latin,English}/Tempora/Quad4-3.txt. Gospel incipit
# only in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-3.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory1 is
# a cross-reference (@Tempora/Quad4-0:Responsory7, the 4th Sunday of
# Lent's own) — used here per the "the first one, when several collapse"
# convention.
id: lent-4-wednesday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Joann 9:1-38", en: "John 9:1-38" }
    text:
      la: >-
        In illo témpore: Prætériens Jesus vidit hóminem cæcum a nativitáte: et interrogavérunt eum
        discípuli ejus: Rabbi, quis peccávit, hic aut paréntes ejus, ut cæcus nascerétur? Respóndit
        Jesus: Neque hic peccávit neque paréntes ejus: sed ut manifesténtur ópera Dei in illo. Me
        opórtet operári ópera ejus, qui misit me, donec dies est: venit nox, quando nemo potest
        operári. Quámdiu sum in mundo, lux sum mundi. Hæc cum dixísset, éxspuit in terram, et fecit
        lutum ex sputo, et linívit lutum super óculos ejus, et dixit ei: Vade, lava in natatória
        Síloë (quod interpretátur Missus). Abiit ergo, et lavit, et venit videns. Itaque vicíni, et
        qui víderant eum prius, quia mendícus erat, dicébant: Nonne hic est, qui sedébat et
        mendicábat? Alii dicébant: Quia hic est. Alii autem: Nequáquam, sed símilis est ei. Ille
        vero dicébat: Quia ego sum. Dicébant ergo ei: Quómodo apérti sunt tibi óculi? Respóndit:
        Ille homo, qui dícitur Jesus, lutum fecit, et unxit oculos meos, et dixit mihi: Vade ad
        natatória Síloë, et lava. Et ábii, et lavi, et vídeo. Et dixérunt ei: Ubi est ille? Ait:
        Néscio. Addúcunt eum ad pharisǽos, qui cæcus fúerat. Erat autem sábbatum, quando lutum fecit
        Jesus, et apéruit óculos ejus. Iterum ergo interrogábant eum pharisǽi, quómodo vidísset.
        Ille autem dixit eis: Lutum mihi posuit super oculos, et lavi, et vídeo. Dicébant ergo ex
        pharisǽis quidam: Non est hic homo a Deo, qui sábbatum non custódit. Alii autem dicébant:
        Quómodo potest homo peccátor hæc signa fácere? Et schisma erat inter eos. Dicunt ergo cæco
        íterum: Tu quid dicis de illo, qui apéruit óculos tuos? Ille autem dixit: Quia Prophéta est.
        Non credidérunt ergo Judǽi de illo, quia cæcus fuísset, et vidísset, donec vocavérunt
        paréntes ejus, qui víderat: et interrogavérunt eos, dicéntes: Hic est fílius vester, quem
        vos dícitis, quia cæcus natus est? Quómodo ergo nunc videt? Respondérunt eis paréntes ejus,
        et dixérunt: Scimus, quia hic est fílius noster, et quia cæcus natus est: quómodo autem nunc
        vídeat, nescímus: aut quis ejus apéruit óculos, nos nescímus: ipsum interrogáte, ætátem
        habet, ipse de se loquátur. Hæc dixérunt paréntes ejus, quóniam timébant Judǽos: jam enim
        conspiráverant Judǽi, ut, si quis eum confiterétur esse Christum, extra synagógam fíeret.
        Proptérea paréntes ejus dixérunt: Quia ætátem habet, ipsum interrogáte. Vocavérunt ergo
        rursum hóminem, qui fúerat cæcus, et dixérunt ei: Da glóriam Deo. Nos scimus, quia hic homo
        peccátor est. Dixit ergo eis ille: Si peccátor est, néscio: unum scio, quia, cæcus cum
        essem, modo vídeo. Dixérunt ergo illi: Quid fecit tibi? quómodo apéruit tibi óculos?
        Respóndit eis: Dixi vobis jam, et audístis: quid íterum vultis audíre? Numquid et vos vultis
        discípuli ejus fíeri? Maledixérunt ergo ei, et dixérunt: Tu discípulus illíus sis: nos autem
        Móysi discípuli sumus. Nos scimus, quia Móysi locútus est Deus: hunc autem nescímus, unde
        sit. Respóndit ille homo et dixit eis: In hoc enim mirábile est, quia vos néscitis, unde sit,
        et apéruit meos óculos: scimus autem, quia peccatóres Deus non audit: sed, si quis Dei
        cultor est et voluntátem ejus facit, hunc exáudit. A sǽculo non est audítum, quia quis
        apéruit óculos cæci nati. Nisi esset hic a Deo, non póterat fácere quidquam. Respondérunt et
        dixérunt ei: In peccátis natus es totus, et tu doces nos? Et ejecérunt eum foras. Audívit
        Jesus, quia ejecérunt eum foras, et cum invenísset eum, dixit ei: Tu credis in Fílium Dei?
        Respóndit ille et dixit: Quis est, Dómine, ut credam in eum? Et dixit ei Jesus: Et vidísti
        eum, et qui lóquitur tecum, ipse est. At ille ait: Credo, Dómine. (Hic genuflectitur) Et
        prócidens adorávit eum.
      en: >-
        At that time, Jesus, passing by, saw a man blind from birth. And His disciples asked Him,
        "Rabbi, who has sinned, this man or his parents, that he should be born blind?" Jesus
        answered, "Neither has this man sinned, nor his parents, but the works of God were to be
        made manifest in him. I must do the works of Him Who sent Me while it is day; night is
        coming, when no one can work. As long as I am in the world I am the light of the world."
        When He had said these things, He spat on the ground and made clay with the spittle, and
        spread the clay over his eyes, and said to him, "Go, wash in the pool of Siloe" - which is
        interpreted 'Sent'. - So he went away, and washed, and returned seeing. The neighbors
        therefore and they who were wont to see him before as a beggar, began saying, "Is not this
        he who used to sit and beg?" Some said, "It is he." But others said, "By no means, he only
        resembles him." Yet the man declared, "I am he." They therefore said to him, "How were your
        eyes opened?" He answered, "The man who is called Jesus made clay and anointed my eyes, and
        said to me, 'Go to the pool of Siloe and wash.' And I went and washed, and I see." And they
        said to him, "Where is He?" He said, "I do not know." They took him who had been blind to
        the Pharisees. Now it was a Sabbath on which Jesus made the clay and opened his eyes. Again,
        therefore, the Pharisees asked him how he received his sight. But he said to them, "He put
        clay upon my eyes, and I washed, and I see." Therefore some of the Pharisees said, "This man
        is not from God, for He does not keep the Sabbath." But others said, "How can a man who is
        a sinner work these signs?" And there was a division among them. Again therefore they said
        to the blind man, "What do you say of Him Who opened your eyes?" But he said, "He is a
        prophet." The Jews therefore did not believe of him that he had been blind and had got his
        sight, until they called the parents of the one who had gained his sight, and questioned
        them, saying, "Is this your son, of whom you say that he was born blind? How then does he
        now see?" His parents answered them and said, "We know that this is our son, and that he
        was born blind; but how he now sees we do not know, or who opened his eyes we ourselves do
        not know. Ask him; he is of age, let him speak for himself." These things his parents said
        because they feared the Jews. For already the Jews had agreed that if anyone were to confess
        Him to be the Christ, he should be put out of the synagogue. This is why his parents said,
        "He is of age; question him." They therefore called a second time the man who had been
        blind, and said to him, "Give glory to God! We ourselves know that this man is a sinner." He
        therefore said, "Whether He is a sinner, I do not know. One thing I do know, that whereas I
        was blind, now I see." They therefore said to him, "What did He do to you? How did He open
        your eyes?" He answered them, "I have told you already, and you have heard. Why would you
        hear again? Would you also become His disciples?" They heaped abuse on him therefore, and
        said, "You are His disciple, but we are disciples of Moses. We know that God spoke to Moses;
        but as for this man, we do not know where He is from." In answer the man said to them, "Why,
        herein is the marvel, that you do not know where He is from, and yet He opened my eyes. Now
        we know that God does not hear sinners; but if anyone is a worshipper of God, and does His
        will, him He hears. Not from the beginning of the world has it been heard that anyone opened
        the eyes of a man born blind. If this man were not from God, He could do nothing." They
        answered and said to him, "You were altogether born in sins, and do you teach us?" And they
        turned him out. Jesus heard that they had cast him out, and when He had found him, said to
        him, "Do you believe in the Son of God?" He answered and said, "Who is He, Lord, that I may
        believe in Him?" And Jesus said to him, "You have both seen Him, and He it is Who speaks
        with you." And he said, "I believe, Lord." (Kneel.) And falling down, he worshipped Him.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, 44th Tract on John"
    text:
      la: >-
        Ea quæ fecit Dóminus noster Jesus Christus, stupénda atque miránda, et ópera, et verba sunt:
        ópera, quia facta sunt: verba, quia signa sunt. Si ergo quid signíficet hoc quod factum est,
        cogitémus: genus humánum est iste cæcus. Hæc enim cǽcitas cóntigit in primo hómine per
        peccátum, de quo omnes oríginem dúximus, non solum mortis, sed étiam iniquitátis. Si enim
        cǽcitas est infidélitas, et illuminátio fides: quem fidélem, quando venit Christus, invénit?
        Quandóquidem Apóstolus natus in gente prophetárum dicit: Fúimus et nos aliquándo natúra
        fílii iræ, sicut et céteri. Si fílii iræ, fílii vindíctæ, fílii pœnæ, fílii gehénnæ: quómodo
        natúra, nisi quia peccánte primo hómine vítium pro natúra inolévit? Si vítium pro natúra
        inolévit, secúndum mentem omnis homo cæcus natus est.


        Venit Dóminus: quid fecit? Magnum mystérium commendávit. Exspuit in terram, de salíva sua
        lutum fecit: quia Verbum caro factum est, et inúnxit óculos cæci. Inúnctus erat, et nondum
        vidébat. Misit illum ad piscínam, quæ vocátur Síloë. Pertínuit autem ad Evangelístam
        commendáre nobis nomen hujus piscínæ, et ait: Quod interpretátur Missus. Jam quis sit missus
        agnóscitis. Nisi enim ille fuísset missus, nemo nostrum esset ab iniquitáte dimíssus. Lavit
        ergo óculos in ea piscína, quæ interpretátur Missus; baptizátus est in Christo. Si ergo
        quando eum in seípso quodámmodo baptizávit, tunc illuminávit: quando inúnxit, fortásse
        catechúmenum fecit.


        Audístis grande mystérium. Intérroga hóminem: Christiánus es? Respóndet tibi: Non sum. Si
        pagánus es, aut Judǽus? Si autem díxerit, Non sum: adhuc quæris ab eo, Catechúmenus, an
        fidélis? Si respónderit tibi, Catechúmenus: inúnctus est, nondum lotus. Sed unde inúnctus?
        Quære, et respóndet. Quære ab illo, in quem credat? Eo ipso quo catechúmenus est, dicit: In
        Christum. Ecce modo loquor et fidélibus et catechúmenis. Quid dixi de sputo et luto? Quia
        Verbum caro factum est; hoc catechúmeni áudiunt: sed non eis súfficit ad quod inúncti sunt:
        festínent ad lavácrum, si lumen inquírunt.
      en: >-
        Dread and wondrous are all the things which our Lord Jesus Christ did, both His works and
        His words; the works, because He wrought them; the words, because they are deep. If,
        therefore, we consider the meaning of this work of His, we see that that man which was blind
        from his birth was a figure of mankind. This spiritual blindness was the consequence of the
        sin of the first man, from whom we all inherit by birth, not death only, but depravity also.
        For if blindness be unbelief, and faith, light, whom, when Christ came, did He find
        faithful? Nay, the Apostle who had himself been born of the race of which the Prophets came,
        saith: We also were by nature children of wrath, even as others. And if children of wrath,
        then children also of vengeance, children of damnation, children of hell. And wherefore so
        by nature, unless it were that the sin of the first man had made all his descendants to be
        born in sin, in that they partook of his nature? If, then, our nature bring sin with it, all
        men, according to the spirit, are born blind.


        The Lord came; and what did He? He set before us a great mystery. Jesus spat on the ground,
        and made clay of the Spittle — for the Word was made flesh. And He anointed the eyes of the
        blind man with the clay; but yet that man saw not. He was anointed, indeed, but yet still he
        saw not. And He said unto him: Go, wash in the Pool of Siloam. Now, it was the duty of the
        Evangelist to impress upon us the name of this Pool, and therefore he saith Siloam, which
        is, by interpretation, Sent. Ye, my brethren, know Who is signified where it is written. Yea,
        He it is, Who, if He had not been sent, we had never been loosed out of the prison-house of
        sin. The blind man went his way therefore, and washed his eyes in that Pool, which is, by
        interpretation, Sent; in other words, he was baptized in Christ. When, therefore, he had
        figuratively been baptized in Him Whom the Father hath Sent into the world, he came seeing.
        When he was anointed, he was perchance made a figure of a Catechumen.


        We have heard this great mystery. Ask of a man: Art thou a Christian? He answereth thee: I
        am not. Then, if thou ask him: Art thou a pagan then, or a Jew? And he still saith unto thee
        Nay; and thou say: Art thou then a Catechumen, though not yet one of the faithful? and he
        saith Yea, a Catechumen; then there thou seest a man anointed, but not yet washed. With what
        hath he been anointed? Ask of him, and he will tell thee. Ask of him in Whom he believeth,
        and, being a Catechumen, he will say: In Christ. But, behold, I speak before both Faithful
        and Catechumens. What said I touching the Spittle and the clay? I said: for 'the Word was
        made flesh.' This the Catechumens hear, but it is not enough for them to be anointed; they
        must make haste to the washing, if they would have their eyes opened.
    responsory:
      la: "R. Spléndida facta est fácies Móysi, dum respíceret in eum Dóminus: * Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde.\nV. Cumque descendísset de monte Sínai, portábat duas tábulas testimónii, ignórans quod cornúta esset fácies ejus ex consórtio sermónis Dei.\nR. Vidéntes senióres claritátem vultus ejus, admirántes timuérunt valde."
      en: "R. After that the Lord had looked upon him, the face of Moses shone. * And when the elders saw that his face shone, they marvelled and were sore afraid.\nV. And when he came down from Mount Sinai with the two tables of testimony in his hand, he wist not that his face shone, because that God had spoken with him.\nR. And when the elders saw that his face shone, they marvelled and were sore afraid."
    status: { la: verified, en: verified }
