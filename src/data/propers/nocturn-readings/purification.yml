# Matins Nocturn 2-3 readings for the Purification of the BVM (Feb 2).
# Sourced directly from web/www/horas/Latin/Sancti/02-02.txt,
# English/Sancti/02-02.txt. (Lectio1-3, Exod 13/Lev 12, left to the
# bible-plan store as usual.)
#
# Nocturn 2: Lectio4-6 combined into one reading, St. Augustine's sermon
# on Simeon — one continuous piece.
# Nocturn 3: Lectio7's Gospel citation (Luke 2:22-32) is a bare incipit
# ("Et réliqua"), so only the homily was originally authored (not marked
# isGospel), St. Ambrose's commentary (Lectio7's homily + Lectio8-9
# combined).
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before Ambrose's homily) — sourced from
# the day's own Missale [Evangelium] in
# web/www/missa/Latin/Sancti/02-02.txt (full text given there, not a
# redirect).
id: purification
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Augustine of Hippo, Sermon 13 de Tempore"
    text:
      la: >-
        Sic olim prædíctum est: Mater Sion dicit: Homo et homo factus est in ea; et ipse
        fundávit eam Altíssimus. O omnipoténtia nascéntis! o magnificéntia de cælo ad terram
        descendéntis! Adhuc in útero portabátur, et ex útero matris a Joánne Baptísta
        salutabátur. In templo præsentabátur, et a Simeóne sene famóso, annóso, probáto,
        coronáto agnoscebátur. Tunc cognóvit, tunc adorávit, tunc dixit: Nunc, Dómine,
        dimíttis servum tuum in pace: quia vidérunt óculi mei salutáre tuum.


        Differebátur exíre de sǽculo, ut vidéret natum, per quem cónditum est sǽculum.
        Agnóvit Infántem senex, factus est in Púero puer. Innovátus in ætáte, qui plenus
        erat pietáte. Símeon senex ferébat Christum infántem, Christus regébat Simeónis
        senectútem. Dictum ei fúerat a Dómino, quod non gustáret mortem, nisi vidéret
        Christum Dómini natum. Natus est Christus, et implétum est desidérium senis in
        mundi ipsíus senectúte. Ipse ad senem hóminem venit, qui mundum inveterátum
        invénit.


        In isto quidem sǽculo diu esse nolébat, et Christum in hoc sǽculo vidére cupiébat,
        cantans cum prophéta et dicens: Osténde nobis, Dómine, misericórdiam tuam, et
        salutáre tuum da nobis. Dénique, ut novéritis ita esse istíus lætítiam, conclúsit
        dicens: Nunc dimíttis servum tuum in pace: quia vidérunt óculi mei salutáre tuum.
        Prophétæ cecinérunt Conditórem cæli et terræ in terra cum homínibus futúrum;
        Angelus nuntiávit Creatórem carnis et spíritus in carne ventúrum; salutávit Joánnes
        ex útero in útero Salvatórem; Símeon senex Deum agnóvit infántem.
      en: >-
        In old time it was written: And of Zion shall it not be said This and that man was
        born in her, and the Highest Himself shall establish her? Blessed be the omnipotence
        of Him That was born! Blessed the glory of Him That came from heaven to earth! While
        yet He was borne in His Mother's womb, He was saluted by John the Baptist; He was
        presented in the temple, and recognised by that famous, ancient, and glorious
        worthy, the old man Simeon. As soon as he knew Him he worshipped Him, and said Lord,
        now lettest Thou thy servant depart in peace for mine eyes have seen thy Salvation.


        He lingered in the world to see the birth of Him Who made the world. The old man
        knew the Child, and in that Child became a child himself, for in the love wherewith
        he regarded the Father of all, he felt his own years to be but as of yesterday. The
        old man Simeon bore the new-born Christ, and all the while, Christ was the old man's
        Lord. It had been told him by the Lord that he should not taste of death before he
        had seen the birth of the Lord's Christ. Now Christ is born, and all the old man's
        wishes on earth are fulfilled. He That came to a decrepit world came to an old man.


        He wished not to remain long in the world, but he longed to see Christ in the world,
        singing with the Prophet, and saying: Show us thy mercy, O Lord, and grant us thy
        salvation. And now at last, that ye may know that the cause of his joy was that this
        prayer was granted, he saith: Now lettest Thou thy servant depart in peace, for mine
        eyes have seen thy salvation. The Prophets have sung that the Maker of heaven and
        earth would converse on earth with men, an angel hath declared that the Creator of
        flesh and spirit would come in the flesh, the unborn John, yet in the womb, hath
        saluted the unborn Saviour yet in the womb. The old man Simeon hath seen God, a
        little Child.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Luc 2:22-32", en: "Luke 2:22-32" }
    text:
      la: >-
        In illo témpore: Postquam impléti sunt dies purgatiónis Maríæ, secúndum legem Móysi,
        tulérunt Jesum in Jerúsalem, ut sísterent eum Dómino, sicut scriptum est in lege Dómini:
        Quia omne masculínum adapériens vulvam sanctum Dómino vocábitur. Et ut darent hóstiam,
        secúndum quod dictum est in lege Dómini, par túrturum aut duos pullos columbárum. Et
        ecce, homo erat in Jerúsalem, cui nomen Símeon, et homo iste justus et timorátus,
        exspéctans consolatiónem Israël, et Spíritus Sanctus erat in eo. Et respónsum accéperat a
        Spíritu Sancto, non visúrum se mortem, nisi prius vidéret Christum Dómini. Et venit in
        spíritu in templum. Et cum indúcerent púerum Jesum paréntes ejus, ut fácerent secúndum
        consuetúdinem legis pro eo: et ipse accépit eum in ulnas suas, et benedíxit Deum, et
        dixit: Nunc dimíttis servum tuum, Dómine, secúndum verbum tuum in pace: Quia vidérunt
        óculi mei salutáre tuum: Quod parásti ante fáciem ómnium populórum: Lumen ad
        revelatiónem géntium et glóriam plebis tuæ Israël.
      en: >-
        At that time, when the days of Mary's purification were fulfilled according to the Law
        of Moses, they took Jesus up to Jerusalem to present Him to the Lord — as it is written
        in the Law of the Lord, "Every male that opens the womb shall be called holy to the
        Lord" — and to offer a sacrifice according to what is said in the Law of the Lord, "a
        pair of turtle doves or two young pigeons." And behold, there was in Jerusalem a man
        named Simeon, and this man was just and devout, looking for the consolation of Israel,
        and the Holy Spirit was upon him. And it had been revealed to him by the Holy Spirit
        that he should not see death before he had seen the Christ of the Lord. And he came by
        inspiration of the Spirit into the temple. And when His parents brought in the Child
        Jesus, to do for Him according to the custom of the Law, he also received Him into his
        arms and blessed God, saying, "Now You dismiss Your servant, O Lord, according to Your
        word, in peace; because my eyes have seen Your salvation, which You have prepared before
        the face of all peoples: a light of revelation to the Gentiles, and a glory for Your
        people Israel."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Ambrose, Commentary on Luke, Book II (on Luke 2:22-32)"
    text:
      la: >-
        Et ecce homo erat in Jerúsalem, cui nomen Símeon, et homo iste justus et timorátus,
        exspéctans consolatiónem Israël. Non solum ab Angelis, et prophétis, et a pastóribus,
        sed étiam a senióribus et justis generátio Dómini accépit testimónium. Omnis ætas,
        et utérque sexus, eventorúmque mirácula fidem ástruunt. Virgo génerat, stérilis
        parit, mutus lóquitur, Elísabeth prophétat, Magus adórat, útero clausus exsúltat,
        vídua confitétur, justus exspéctat.


        Et bene justus, qui non suam, sed pópuli grátiam requirébat, cúpiens ipse corpóreæ
        vínculis fragilitátis exsólvi, sed exspéctans vidére promíssum: sciébat enim quia
        beáti óculi qui eum vidérent. Et ipse accépit eum in ulnas suas, et benedíxit Deum,
        et dixit: Nunc dimítte servum tuum, Dómine, secúndum verbum tuum in pace. Vide
        justum, velut corpóreæ cárcere molis inclúsum, velle dissólvi, ut incípiat esse cum
        Christo. Dissólvi enim, et cum Christo esse, multo mélius est.


        Sed qui vult dimítti, véniat in templum, véniat in Jerúsalem, exspéctet Christum
        Dómini, accípiat in mánibus Verbum Dei, complectátur opéribus velut quibúsdam suæ
        fídei brácchiis: tunc dimittétur, ut non vídeat mortem, qui víderit Vitam. Vides
        úberem in omnes grátiam, Dómini generatióne diffúsam, et prophetíam incrédulis
        negátam esse, non justis. Ecce et Símeon prophétat, in ruínam et resurrectiónem
        plurimórum venísse Dóminum Jesum Christum, ut justórum iniquorúmque mérita
        discérnat; et pro nostrórum qualitáte factórum, judex verus et justus aut
        supplícia decérnat aut prǽmia.
      en: >-
        And, behold, there was a man in Jerusalem, whose name was Simeon, and the same man
        was just and devout, waiting for the consolation of Israel. The birth of the Lord is
        attested not only by Angels and Prophets, and shepherds, but also by elders and just
        men. Every age, and both sexes, as well as the miracles of the events themselves, are
        here to strengthen our faith. A virgin conceiveth, a barren woman beareth, a dumb man
        speaketh, Elizabeth prophesieth, the wise man worshippeth, the unborn child leapeth,
        the widow praiseth, and the just man waiteth.


        Well is he called just, who looked not for favour for himself, but for consolation
        for his people. He desired to be set free from the bondage of this frail body, but he
        waited to see the Promised One for he knew that blessed are the eyes that see Him.
        Then took he Him up in his arms, and blessed God, and said: Lord, now lettest Thou
        thy servant depart in peace, according to thy word. Behold a just man, confined in
        the weary prison of the body, desiring to be dissolved and to begin to be with
        Christ. For to be dissolved and to be with Christ is much better.


        Whosoever will be dissolved and be with Christ, let him come into the Temple, let
        him come to Jerusalem, let him wait for the Lord's Christ, let him take hold on the
        Word of God, let him embrace it with good works, as it were with arms of faith and
        then let him depart in peace, for he shall not see death, who hath seen life. Behold
        how the Lord's Birth doth overflow with abounding grace for all, and prophecy is not
        denied to the just, but to the unbelieving. Behold, Simeon prophesieth that the Lord
        Jesus Christ is come for the fall and rising again of many; yea, He shall separate
        the just from the unjust by their deserts, and according as our work shall be, so
        shall the true and righteous Judge command us to be punished or rewarded.
    status: { la: verified, en: verified }
