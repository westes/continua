# Matins Nocturn 2 for "2nd Sunday of October" (Tempora/102-0.txt) — see
# month-week-081.yml's header for the id scheme. Responsory reuses 101's
# own Responsory4 (source's own cross-reference).
id: month-week-102
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, City of God, Book 18, ch. 45"
    text:
      la: >-
        Posteáquam gens Judǽa cœpit non habére prophétas, proculdúbio detérior facta est, eo scílicet
        témpore, quo se sperábat instauráto templo post captivitátem, quæ fuit in Babylónia, futúram
        esse meliórem. Sic quippe intelligébat pópulus ille carnális, quod prænuntiátum est per Aggæum
        prophétam dicéntem: Magna erit glória domus istíus novíssimæ, plus quam primæ. Quod de novo
        testaménto dictum esse, paulo supérius demonstrávit, ubi ait apérte Christum promíttens: Et
        movébo omnes gentes, et véniet Desiderátus cunctis Géntibus.


        Tálibus enim eléctis Géntium, domus Dei ædificátur per Testaméntum novum lapídibus vivis, longe
        gloriósior, quam templum illud fuit, quod a rege Salomóne constrúctum est, et post captivitátem
        instaurátum. Propter hoc ergo nec prophétas ex illo témpore hábuit illa gens; sed multis
        cládibus afflícta est ab alienígenis régibus, ipsísque Románis, ne hanc Aggæi prophetíam in
        illa instauratióne templi opinarétur implétam. Non multo enim post, adveniénte Alexándro,
        subjugáta est; quando, etsi nulla facta est vastátio, quóniam non sunt ausi ei resístere, et
        ídeo placátum facíllime súbditi recepérunt; non erat tamen glória tanta domus illíus, quanta
        fuit in suórum regum líbera potestáte.


        Deínde Ptolemǽus Lagi fílius, post Alexándri mortem captívos inde in Ægýptum tránstulit, quos
        ejus succéssor Ptolemǽus Philadélphus benevolentíssime inde dimísit: per quem factum est, ut
        Septuagínta intérpretum Scriptúras haberémus. Deínde contríti sunt bellis, quæ in Machabæórum
        libris explicántur. Post hæc capti a rege Alexandríæ Ptolemǽo qui est appellátus Epíphanes,
        inde ab Antíocho rege Sýriæ multis et gravíssimis malis ad idóla colénda compúlsi:
        templúmque ipsum replétum sacrílegis superstitiónibus Géntium, quod tamen dux eórum
        strenuíssimus Judas, qui étiam Machabǽus dictus est, Antíochi dúcibus pulsis, ab omni illa
        idololatríæ contaminatióne mundávit.
      en: >-
        The Jewish nation no doubt became worse after it ceased to have prophets, just at the very time
        when, on the rebuilding of the temple after the captivity in Babylon, it hoped to become
        better. For so, indeed, did that carnal people understand what was foretold by Haggai the
        prophet, saying, The glory of this latter house shall be greater than that of the former. Now,
        that this is said of the new testament, he showed a little above, where he says, evidently
        promising Christ, And I will move all nations, and the desired One shall come to all nations.


        For by such chosen ones of the nations there is built, through the new testament, with living
        stones, a house of God far more glorious than that temple was which was constructed by king
        Solomon, and rebuilt after the captivity. For this reason, then, that nation had no prophets
        from that time, but was afflicted with many plagues by kings of alien race, and by the Romans
        themselves, lest they should fancy that this prophecy of Haggai was fulfilled by that rebuilding
        of the temple. For not long after, on the arrival of Alexander, it was subdued, when, although
        there was no pillaging, because they dared not resist him, and thus, being very easily
        subdued, received him peaceably, yet the glory of that house was not so great as it was when
        under the free power of their own kings.


        Then Ptolemy son of Lagus, after Alexander's death, carried them captive into Egypt. His
        successor, Ptolemy Philadelphus, most benevolently dismissed them; and by him it was brought
        about that we should have the Septuagint version of the Scriptures. Then they were crushed by
        the wars which are explained in the books of the Maccabees. Afterward they were taken captive
        by Ptolemy king of Alexandria, who was called Epiphanes. Then Antiochus king of Syria compelled
        them by many and most grievous evils to worship idols, and filled the temple itself with the
        sacrilegious superstitions of the Gentiles. Yet their most vigorous leader Judas, who is also
        called Maccabæus, after beating the generals of Antiochus, cleansed it from all that defilement
        of idolatry.
    responsory:
      la: "R. Impetum inimicórum ne timuéritis: mémores estóte, quómodo salvi facti sunt patres nostri: * Et nunc clamémus in cælum et miserébitur nostri Deus noster.\nV. Mementóte mirabílium ejus, quæ fecit pharaóni et exercítui ejus in Mari Rubro.\nR. Et nunc clamémus in cælum et miserébitur nostri Deus noster."
      en: "R. Be ye not afraid of the assault of the enemy; remember how our fathers were delivered. * Now, therefore, let us cry unto heaven, and our God will have mercy upon us.\nV. Remember His marvellous works that He hath done unto Pharaoh and his host in the Red Sea.\nR. Now, therefore, let us cry unto heaven, and our God will have mercy upon us."
    status: { la: verified, en: verified }
