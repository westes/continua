# Matins Nocturn 2 for "3rd Sunday of October" (Tempora/103-0.txt) — see
# month-week-081.yml's header for the id scheme. Responsory reuses 101's
# own Responsory4 (source's own cross-reference).
id: month-week-103
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, De Officiis, Book 1, ch. 41"
    text:
      la: >-
        Quia fortitúdo non solum secúndis rebus, sed étiam advérsis probátur, spectémus Judæ Machabǽi
        éxitum. Is enim post victum Nicánorem, regis Demétrii ducem, secúrior advérsus vigínti míllia
        exércitus regis, cum octingéntis viris bellum adórsus, voléntibus his cédere, ne multitúdine
        opprimeréntur, gloriósam magis mortem quam turpem fugam suásit: Ne crimen, inquit, nostræ
        relinquámus glóriæ. Ita commísso prǽlio, cum a primo ortu diéi in vésperam dimicarétur, dextrum
        cornu, in quo validíssimam manum advértit hóstium, aggréssus fácile avértit. Sed dum fugiéntes
        séquitur, a tergo vúlneri locum prǽbuit; ítaque gloriosiórem triúmphis mortem invénit.


        Quid Jónatham fratrem ejus attéxam, qui cum parva manu advérsus exércitus régios pugnans,
        desértus a suis et cum duóbus tantum relíctus, reparávit bellum, avértit hostem, fugitántes
        suos ad societátem revocávit triúmphi? Habes fortitúdinem béllicam, in qua non medíocris
        honésti ac decóri forma est, quod mortem servitúti prǽferat ac turpitúdini. Quid autem de
        Mártyrum dicam passiónibus? Et ne lóngius evagémur, non minórem de supérbo rege Antíocho
        Machabǽi púeri revexérunt triúmphum, quam paréntes próprii; síquidem illi armáti, isti sine
        armis vicérunt.


        Stetit invícta septem puerórum cohors, régiis cincta legiónibus: defecérunt supplícia,
        cessérunt tortóres, non defecérunt Mártyres. Alius córium cápitis exútus, spéciem mutáverat,
        virtútem áuxerat. Alius linguam jussus amputándam prómere, respóndit: Non solos Dóminus audit
        loquéntes, qui audiébat Móysen tacéntem; plus audit tácitas cogitatiónes suórum, quam voces
        ómnium. Linguæ flagéllum times, flagéllum sánguinis non times? Habet et sanguis vocem suam, qua
        clamat ad Deum, sicut clamávit in Abel.
      en: >-
        As fortitude is proved not only by prosperity but also in adversity, let us now consider the
        death of Judas Maccabæus. For he, after Nicanor, the general of King Demetrius, was defeated,
        boldly engaged twenty thousand of the king's army with eight hundred men who were anxious to
        retire for fear of being overcome by so great a multitude, but whom he persuaded to endure a
        glorious death rather than to retire in disgraceful flight. "Let us not leave," he says, "any
        stain upon our glory." Thus, then, engaging in battle after having fought from sunrise till
        evening, he attacks and quickly drives back the right wing, where he sees the strongest troop
        of the enemy to be. But while pursuing the fugitives from the rear, he gave a chance for a
        wound to be inflicted. (1 Mac. 9:8.) Thus he found the spot of death more full of glory for
        himself than any triumph.


        Why need I further mention his brother Jonathan, who fought against the king's force, with but
        a small troop? (1 Mac. 11:68.) Though forsaken by his men, and left with only two, he retrieved
        the battle, drove back the enemy, and recalled his own men, who were flying in every direction,
        to share in his triumph. Here, then, is fortitude in war, which bears no light impress of what
        is virtuous and seemly upon it, for it prefers death to slavery and disgrace. But what am I to
        say of the sufferings of the martyrs? Not to go too far abroad, did not the children of
        Maccabæus gain triumphs over the proud King Antiochus, as great as those of their fathers? The
        latter in truth were armed, but they conquered without arms.


        The company of the seven brothers stood unconquered, though surrounded by the legions of the
        king — tortures failed, tormentors ceased; but the martyrs failed not. One, having had the skin
        of his head pulled off, though changed in appearance, grew in courage. Another, bidden to put
        forth his tongue, so that it might be cut off, answered: "The Lord hears not only those who
        speak, for He heard Moses when silent. He hears better the silent thoughts of His own than the
        voice of all others. Do you fear the scourge of my tongue, and do you not fear the scourge of
        blood spilt upon the ground? Blood, too, has a voice whereby it cries aloud to God, as it did
        in the case of Abel."
    responsory:
      la: "Impetum inimicórum ne timuéritis: mémores estóte, quómodo salvi facti sunt patres nostri: * Et nunc clamémus in cælum et miserébitur nostri Deus noster.\nV. Mementóte mirabílium ejus, quæ fecit pharaóni et exercítui ejus in Mari Rubro.\nR. Et nunc clamémus in cælum et miserébitur nostri Deus noster."
      en: "Be ye not afraid of the assault of the enemy; remember how our fathers were delivered. * Now, therefore, let us cry unto heaven, and our God will have mercy upon us.\nV. Remember His marvellous works that He hath done unto Pharaoh and his host in the Red Sea.\nR. Now, therefore, let us cry unto heaven, and our God will have mercy upon us."
    status: { la: verified, en: verified }
