# Matins Nocturn 2 readings for the Seven Brothers (sons of St.
# Felicity), and Ss. Rufina and Secunda, Martyrs (Jul 10) —
# SanctiM/07-10b.txt bases `@Sancti/07-10` (the whole day, no Nocturn
# 2/3 override), so this feast's own proper content is sourced from
# the Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-10.txt, English/Sancti/07-10.txt.
# Lectio4 (the seven brothers), Lectio5 (Rufina and Secunda, a
# genuinely distinct pair of martyrs), and Lectio6 (St. Augustine's
# sermon on their mother, St. Felicity) kept split. No responsory
# given in the source.
#
# Checked 2026-09-05 for a Gospel pairing: all three readings here are
# Nocturn 2 (Lectio4-6). St. Augustine's Sermon 110 is a eulogy of St.
# Felicity as a martyr-mother, not tied to any Gospel pericope -- no
# isGospel pairing applies. Note for a future pass: 07-10.txt's own
# [Rule] ("vide C3") carries its own genuine Nocturn 3 (Lectio7-9:
# Gospel Matt 12:46-50, "Who is my mother?", with Pope St. Gregory's
# Homily 3 on the Gospels) that is not authored anywhere in this store
# at all -- a real content gap, but a new reading pair rather than a
# missing Gospel citation on an existing homily, so out of scope for
# this pass.
id: ss-seven-brothers-rufina-and-secunda
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Septem fratres, fílii sanctæ Felicitátis, Romæ in persecutióne Marci Aurélii Antonini a
        Publio præfécto primum blandítiis, deínde terróribus tentati, ut Christo renuntiántes,
        deos veneraréntur; et, sua virtúte, et matre hortante, in fidei confessióne
        perseverántes, varie necáti sunt. Januarius plumbátis cæsus; Felix et Philippus fustibus
        contusi; Silvanus ex altíssimo loco præceps dejéctus est; Alexander, Vitalis et
        Martialis cápite plectúntur. Mater eórum quarto post mense eamdem martyrii palmam
        consecuta est: illi sexto Idus Julii spíritum Dómino reddidérunt.
      en: >-
        In the persecution at Rome under Marcus Aurelius Antoninus, there were seven brethren,
        sons of the holy woman Felicity, whom the Prefect Publius first essayed to cajole by
        kindness, and then to shake by fear, to deny Christ and worship the gods; but, by their
        own bravery and the exhortation of their mother, they remained firm in their confession,
        and were all put to death in diverse ways. Januarius was lashed to death with whips
        loaded with lead; Felix and Philip were beaten to death with cudgels; Silvanus was thrown
        over a precipice; Alexander, Vitalis, and Martial were beheaded. Their mother gained the
        same palm of martyrdom four months afterwards. The seven Brethren gave up their souls to
        God upon the 10th day of July.
    status: { la: verified, en: verified }

  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Rufina et Secunda sorores, vírgines Romanæ, rejecto connubio Armentárii et Verini,
        quibus a paréntibus desponsæ fuerant, quod Jesu Christo virginitátem vovissent,
        Valeriáno et Gallieno imperatóribus, comprehendúntur. Quas cum nec promissis nec terróre
        Juníus præfectus a proposito posset abducere, Rufinam primum virgis cædi jubet; in cujus
        verbéribus Secunda judicem sic interpellat: Quid est, quod sorórem meam honore, me
        áfficis ignomínia? Jube ambas simul cædi, quæ simul Christum Deum confitemur. Quibus
        verbis incénsus judex imperat utramque detrudi in tenebricósum et fœtidum carcerem. Quo
        loco statim claríssima luce et suavíssimo odore completo, in ardénte balnei solio
        includúntur. Et cum inde étiam integræ evasissent, mox saxo ad collum alligato in
        Tiberim projectæ sunt; unde ab Angelo liberátæ, extra Urbem via Aurelia milliario
        décimo, cápite plectúntur. Quarum corpora, a Plautilla matrona in ejus prædio sepúlta,
        ac póstea in Urbem translata, in basilica Constantiniana prope baptistérium cóndita
        sunt.
      en: >-
        The virgin sisters, Rufina and Secunda, were Romans. Their parents had betrothed them to
        Armentarius and Verinus, but they both consecrated their virginity by vow to Christ, and
        refused marriage. They were arrested in the reign of the Emperors Valerian and Gallienus.
        The Praefect Junius failed to change their minds either by promises or threats, and then
        ordered Rufina to be scourged. While the lashing was going on, Secunda said to the Judge:
        Why dost thou judge my sister to honour and me to dishonour? Be pleased to whip us both
        together, for we both together declare that Christ is God. The Judge was angered at these
        words, and ordered them both to a dark and stinking dungeon, but it was presently filled
        with a bright light and a sweet savour. They were then shut up in a hot flue of a bath,
        but they came forth from it unharmed. Stones were next tied to their necks and they were
        cast into the river Tiber, but an Angel delivered them therefrom. In the end they were
        beheaded on the Aurelian Way, at the tenth mile-stone from the city. The Lady Plautilla
        buried their bodies upon her own farm, but they were afterwards brought into the city,
        and laid in the Cathedral Church of the Most Holy Saviour, hard by the Baptistery.
    status: { la: verified, en: verified }

  - nocturn: 2
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Sermon 110 on Various Subjects"
    text:
      la: >-
        Magnum spectaculum, fratres, positum est ante óculos fidei nostræ. Aure audívimus, corde
        vídimus optántem matrem ante se finire istam vitam fílios suos, longe contrariis votis
        consuetudini humanæ. Omnes enim hómines fílios suos, ex hac vita migrando, præcedere
        volunt, non sequi; illa autem optávit posterior mori. Non enim ammitebat fílios, sed
        præmittebat; nec intuebátur quam vitam finirent, sed quam inchoarent. Desinébant enim
        vivere, ubi quandoque fuerant morituri; et incipiébant vivere, sine fine victuri. Parum
        est fuísse spectatricem; miráti sumus potius hortatricem. Fœcundior virtútibus quam
        fœtibus: videns certántes, in quibus omnibus ipsa certabat, et in omnibus vincéntibus
        ipsa vincebat.
      en: >-
        Wonderful is the sight, my brethren, which is set before the eyes of our faith. We have
        heard with our ears, and we see in our thoughts, a mother, with superhuman love, watching
        her sons leaving this life before her. All men would fain depart hence before their
        children, but she was ready to die last. Departing from her, they were not lost, but gone
        before. And she looked, not to the life they were ending, but to the life they were
        beginning. They laid aside a life which must needs end in death, and began that life
        wherein they are alive for ever. The least of her work was that she was an on-looker; more
        amazing is it, when we remember that she was their exhortress. Her courage was more
        fruitful than her womb, and when she saw them contending and conquering, her heart
        contended and conquered in each.
    status: { la: verified, en: verified }
