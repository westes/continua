# Matins Nocturn content for Monday in the 4th week of Lent — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-1.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-1.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count — this store's
# established default). Responsory is Lectio1's own (given directly in
# this file, not a cross-reference), per the "the first one, when several
# collapse" convention.
id: lent-4-monday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Joann 2:13-25", en: "John 2:13-25" }
    text:
      la: >-
        In illo témpore: Prope erat Pascha Judæórum, et ascéndit Jesus Jerosólymam: et invénit in
        templo vendéntes boves et oves et colúmbas, et nummulários sedéntes. Et cum fecísset quasi
        flagéllum de funículis, omnes ejécit de templo, oves quoque et boves, et nummulariórum
        effúdit æs et mensas subvértit. Et his, qui colúmbas vendébant, dixit: Auférte ista hinc, et
        nolíte fácere domum Patris mei domum negotiatiónis. Recordáti sunt vero discípuli ejus, quia
        scriptum est: Zelus domus tuæ comédit me. Respondérunt ergo Judǽi, et dixérunt ei: Quod
        signum osténdis nobis, quia hæc facis? Respóndit Jesus et dixit eis: Sólvite templum hoc, et
        in tribus diébus excitábo illud. Dixérunt ergo Judǽi: Quadragínta et sex annis ædificátum
        est templum hoc, et tu in tribus diébus excitábis illud? Ille autem dicébat de templo
        córporis sui. Cum ergo resurrexísset a mórtuis, recordáti sunt discípuli ejus, quia hoc
        dicébat, et credidérunt Scriptúræ, et sermóni, quem dixit Jesus. Cum autem esset Jerosólymis
        in Pascha in die festo, multi credidérunt in nómine ejus, vidéntes signa ejus, quæ faciébat.
        Ipse autem Jesus non credébat semetípsum eis, eo quod ipse nosset omnes, et quia opus ei non
        erat, ut quis testimónium perhibéret de hómine: ipse enim sciébat, quid esset in hómine.
      en: >-
        At that time, the Passover of the Jews was at hand, and Jesus went up to Jerusalem. And He
        found in the temple men selling oxen, sheep and doves, and money-changers at their tables.
        And making a kind of whip of cords, He drove them all out of the temple, also the sheep and
        oxen, and He poured out the money of the changers and overturned the tables. And to them
        who were selling the doves He said, "Take these things away, and do not make the house of
        My Father a house of business." And His disciples remembered that it is written, "The zeal
        of Your house has eaten Me up." The Jews therefore answered and said to Him, "What sign do
        You show us, seeing that You do these things?" In answer Jesus said to them, "Destroy this
        temple, and in three days I will raise it up." The Jews therefore said, "Forty-six years has
        this temple been in building, and will You raise it up in three days?" But He was speaking
        of the temple of His body. When, accordingly, He had risen from the dead, His disciples
        remembered that He had said this, and they believed the Scripture and the word that Jesus
        had spoken. Now when He was at Jerusalem for the feast of the Passover, many believed in His
        name, seeing the signs that He was working. But Jesus did not trust Himself to them, in that
        He knew all men, and because He had no need that anyone should bear witness concerning man,
        for He Himself knew what was in man.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, 10th Tract on John"
    text:
      la: >-
        Quid audívimus, fratres? Ecce templum illud figúra adhuc erat, et ejécit inde Dóminus omnes
        qui sua quærébant, qui ad núndinas vénerant. Et quæ ibi vendébant illi? Quæ opus habébant
        hómines in sacrifíciis illíus témporis. Novit enim cáritas vestra, quod sacrifícia illi
        pópulo pro ejus carnalitáte, et corde adhuc lapídeo, tália data sunt, quibus tenerétur, ne in
        idóla deflúeret: et immolábant ibi sacrifícia, boves, oves et colúmbas. Nostis, quia
        legístis.


        Non ergo magnum peccátum, si hoc vendébant in templo, quod emebátur ut offerétur in templo:
        et tamen ejécit inde illos. Quid si ibi ebriósos inveníret, quid fáceret Dóminus, si
        vendéntes ea quæ lícita sunt, et contra justítiam non sunt (quæ enim honéste emúntur, non
        illícite vendúntur) éxpulit tamen, et non est passus domum oratiónis fíeri domum
        negotiatiónis?


        Si negotiatiónis domus non debet fíeri domus Dei, potatiónis debet fíeri? Nos autem quando
        ista dícimus, strident déntibus suis advérsus nos: et consolátur nos Psalmus, quem audístis:
        Stridérunt in me déntibus suis. Nóvimus et nos audíre unde curémur: etsi ingeminántur
        flagélla Christo, quia flagellátur sermo ipsíus. Congregáta sunt, inquit, in me flagélla, et
        nesciébant. Flagellátus est flagéllis Judæórum: flagellátur blasphémiis falsórum
        Christianórum: multíplicant flagélla Dómino Deo suo, et nésciunt. Faciámus nos, quantum ipse
        ádjuvat. Ego autem, cum mihi molésti essent, induébam me cilício, et humiliábam in jejúnio
        ánimam meam.
      en: >-
        What hear we now, my brethren? Behold, that temple was still but a figure, and the Lord
        drove out therefrom all them that sought their own, even them that were come to deal in
        merchandise. And what was it that they sold there? Only such things as were needful to men
        for the sacrifices that then were. For your love knoweth that, because of that people's
        carnal-mindedness and the stoniness of their heart, there were commanded unto them such
        sacrifices as these, thereby to hold them back from idolatry; and there, accordingly, they
        offered up oxen, and sheep, and doves. This ye have read, and know.


        It was no great sin, therefore, if they sold in the temple that which was bought to be
        offered in the temple; and yet He drove them out. If, then, the Lord drove out of His temple
        them which sold such things as are lawful and right (for to buy and sell is lawful, if only
        it be done honestly,) and suffered not the house of prayer to be made an house of
        merchandise, what would He have done if He had found there men drunken?


        If the house of God must not be a house of merchandise, must it be an house to drink in?
        And yet, when we say this, men gnash upon us with their teeth. But we find consolation in
        remembering that so far we are even as the Psalmist, who saith: They gnashed upon me with
        their teeth. Yea, we have also learnt to listen to words that heal us, though, of a verity,
        the lashes that are made at His word are really made at Christ. Lashes, saith He, were
        heaped upon Me; and they knew not what they did. He was lashed by the scourges of the Jews,
        and He is lashed still by the blasphemies of false Christians; they heap lashes upon the
        Lord their God; and know not what they do. As for us, we will do that which He hath holpen
        us to do; But as for me, when they troubled me, my clothing was sackcloth, and I humbled my
        soul with fasting.
    responsory:
      la: "R. Vos, qui transitúri estis Jordánem, ædificáte altáre Dómino * De lapídibus, quos ferrum non tétigit: et offérte super illud holocáusta, et hóstias pacíficas Deo vestro.\nV. Cumque intravéritis terram, quam Dóminus datúrus est vobis, ædificáte ibi altáre Dómino.\nR. De lapídibus, quos ferrum non tétigit: et offérte super illud holocáusta, et hóstias pacíficas Deo vestro."
      en: "R. When ye be gone over Jordan, there shall ye build an altar unto the Lord * Of whole stones; ye shall not lift up any iron tool upon them; and ye shall offer burnt-offerings thereon, and peace-offerings, unto your God.\nV. When ye shall pass over Jordan unto the land which the Lord giveth you, there shall ye build an altar unto the Lord.\nR. Of whole stones; ye shall not lift up any iron tool upon them; and ye shall offer burnt-offerings thereon, and peace-offerings, unto your God."
    status: { la: verified, en: verified }
