# Matins content for Saturday in Albis (temporalId easter-saturday,
# Pasc0-6 -- "Sabbato in Albis"). Sourced from web/www/horas/Latin/
# Tempora/Pasc0-6.txt (Latin homily) / English/Tempora/Pasc0-6.txt
# (English homily); Gospel pericope from the Missal's own [Evangelium]
# (missa/Latin+English/Tempora/Pasc0-6.txt), same convention as
# easter-monday.yml.
#
# Single-nocturn source form, same structural note as easter-monday.yml.
# Lectio1's homily portion (incipit dropped) combined with Lectio2-3 into
# one continuous reading. Responsory: the source's own [Responsory1]
# ("Christus resúrgens ex mórtuis").
id: easter-saturday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Joannes 20:1-9", en: "John 20:1-9" }
    text:
      la: >-
        In illo témpore: Una sábbati, María Magdaléne venit mane, cum adhuc ténebræ essent, ad
        monuméntum: et vidit lápidem sublátum a monuménto. Cucúrrit ergo, et venit ad Simónem Petrum,
        et ad álium discípulum, quem amábat Jesus, et dicit illis: Tulérunt Dóminum de monuménto, et
        nescímus, ubi posuérunt eum. Exiit ergo Petrus et ille álius discípulus, et venérunt ad
        monuméntum. Currébant autem duo simul, et ille álius discípulus præcucúrrit cítius Petro, et
        venit primus ad monuméntum. Et cum se inclinásset, vidit pósita linteámina, non tamen
        introívit. Venit ergo Simon Petrus sequens eum, et introívit in monuméntum, et vidit
        linteámina pósita, et sudárium, quod fúerat super caput ejus, non cum linteamínibus pósitum,
        sed separátim involútum in unum locum. Tunc ergo introívit et ille discípulus, qui vénerat
        primus ad monuméntum: et vidit et crédidit: nondum enim sciébant Scriptúram, quia oportébat
        eum a mórtuis resúrgere.
      en: >-
        At that time, on the first day of the week, Mary Magdalen cometh early, when it was yet
        dark, unto the sepulchre; and she saw the stone taken away from the sepulchre. She ran,
        therefore, and cometh to Simon Peter, and to the other disciple whom Jesus loved, and saith
        to them: They have taken away the Lord out of the sepulchre, and we know not where they have
        laid Him. Peter therefore went out, and that other disciple, and they came to the sepulchre.
        And they both ran together, and that other disciple did outrun Peter, and came first to the
        sepulchre. And when he stooped down, he saw the linen cloths lying; but yet he went not in.
        Then cometh Simon Peter, following him, and went into the sepulchre, and saw the linen
        cloths lying, and the napkin that had been about His head, not lying with the linen cloths,
        but apart, wrapped up into one place. Then that other disciple also went in, who came first
        to the sepulchre: and he saw, and believed. For as yet they knew not the scripture, that He
        must rise again from the dead.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "Pope St. Gregory the Great, Homily 22 on the Gospels"
    text:
      la: >-
        Léctio sancti Evangélii, quam modo, fratres, audístis, valde in superfície histórica est
        apérta: sed ejus nobis sunt mystéria sub brevitáte requirénda. María Magdaléne, cum adhuc
        ténebræ essent, venit ad monuméntum. Juxta históriam notátur hora: juxta intelléctum vero
        mýsticum, requiréntis signátur intellegéntia. María étenim auctórem ómnium, quem in carne
        víderat mórtuum, quærébat in monuménto; et quia hunc mínime invénit, furátum crédidit. Adhuc
        ergo erant ténebræ, cum venit ad monuméntum. Cucúrrit cítius, discípulis nuntiávit: sed illi
        præ céteris cucurrérunt, qui præ céteris amavérunt, vidélicet Petrus et Joánnes.


        Currébant autem duo simul: sed Joánnes præcucúrrit cítius Petro. Venit prior ad monuméntum,
        et íngredi non præsúmpsit. Venit ergo postérior Petrus, et intrávit. Quid, fratres, quid
        cursus signíficat? Numquid hæc tam subtílis Evangelístæ descríptio a mystériis vacáre
        credénda est? Mínime. Neque enim se Joánnes et præísse, et non intrásse díceret, si in ipsa
        sui trepidatióne mystérium defuísse credidísset. Quid ergo per Joánnem, nisi synagóga: quid
        per Petrum, nisi Ecclésia designátur?


        Nec mirum esse videátur, quod per juniórem synagóga, per seniórem vero Ecclésia signári
        perhibétur: quia etsi ad Dei cultum prior est synagóga, quam Ecclésia géntium, ad usum tamen
        sǽculi prior est multitúdo géntium, quam synagóga, Paulo attestánte, qui ait: Quia non prius
        quod spiritále est, sed quod animále. Per seniórem ergo Petrum significátur Ecclésia géntium:
        per juniórem vero Joánnem synagóga Judæórum. Currunt ambo simul: quia ab ortus sui témpore
        usque ad occásum, pari et commúni via, etsi non pari et commúni sensu, gentílitas cum
        synagóga cucúrrit. Venit synagóga prior ad monuméntum, sed mínime intrávit: quia legis quidem
        mandáta percépit, prophetías de incarnatióne ac passióne Domínica audívit, sed crédere in
        mórtuum nóluit.
      en: >-
        Dearly beloved brethren, the portion of the Holy Gospel which hath just now been read in
        your ears, is exceeding simple on the face of it, which is its historical sense; but the
        mystic sense, which underlieth that other, requireth from us a little searching. Mary
        Magdalene came unto the Sepulchre when it was yet dark. The historic sense telleth us what
        was the hour of day; the mystic sense, the state of her understanding who sought. Mary
        Magdalene sought for Him, by Whom all things were made, and Whom she had seen die, as
        concerning the flesh; she sought for Him, I say, in the grave, and finding Him not, she
        believed that He had been stolen away. Yea, it was yet dark, when she came unto the
        sepulchre. Then she ran and told the disciples, but they who had loved Him most, namely
        Peter and John, did outrun the others.


        So they ran both together, but John did outrun Peter, and came first to the Sepulchre, but
        yet took he not upon himself to go in first. Then cometh Peter following him, and went in.
        What, my brethren, what did the racing of these Apostles signify? Can we believe that the
        description given by the deepest of the Evangelists is without a mystic interpretation? By
        no means. John had never told how that he did outrun Peter, and yet went not into the
        Sepulchre, if he had not believed that his hesitation veiled some mystery. What signifieth
        John but the Synagogue? or Peter, but the Church?


        Neither must ye take it as strange that the elder Apostle should represent the Church, and
        the younger the Synagogue: for although the Synagogue was first to worship God, yet the herd
        of Gentiles is in the world older than the Synagogue, as witnesseth Paul where he saith: That
        was not first which is spiritual, but that which is natural. By Peter, then, who was the
        elder, is signified the Church of the Gentiles; and by John, who was the younger, the
        Synagogue of the Jews. They run both of them together, for from the time of her birth until
        now, and so will it be until the end, the Church of the Gentiles hath run in a parallel road
        and manywise a common road with the Synagogue, albeit not with equal understandings. The
        Synagogue came first to the Sepulchre, but she hath not yet entered in; for, though she hath
        received the commandments of the law, and hath heard the Prophets tell of the Incarnation and
        Passion of the Lord, she will not believe in Him Who died for her.
    responsory:
      la: "R. Christus resúrgens ex mórtuis, jam non móritur, mors illi ultra non dominábitur: quod enim mórtuus est peccáto, mórtuus est semel: * Quod autem vivit, vivit Deo, allelúia, allelúia.\nV. Mórtuus est semel propter delícta nostra, et resurréxit propter justificatiónem nostram.\nR. Quod autem vivit, vivit Deo, allelúia, allelúia."
      en: "R. Knowing that Christ rising again from the dead, dieth now no more, death shall no more have dominion over Him. For in that He died to sin, He died once: * In that He liveth, He liveth unto God, alleluia, alleluia.\nV. He died once for our sins, and He rose again for our justification.\nR. In that He liveth, He liveth unto God, alleluia, alleluia."
    status: { la: verified, en: verified }
