# Authored for this project from Matthew 2:19-23 (Clementine Vulgate / Douay-Rheims, as in the scripture store); the reference engine has no office for this day, only a Martyrology line. Marked draft.
id: return-from-egypt
readings:
  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 2:19-23", en: "Matt 2:19-23" }
    text:
      la: >-
        Defuncto autem Herode, ecce angelus Domini apparuit in somnis Joseph in Aegypto,
        dicens: Surge, et accipe puerum, et matrem ejus, et vade in terram Israel:
        defuncti sunt enim qui quaerebant animam pueri. Qui consurgens, accepit puerum,
        et matrem ejus, et venit in terram Israel. Audiens autem quod Archelaus regnaret
        in Judaea pro Herode patre suo, timuit illo ire: et admonitus in somnis,
        secessit in partes Galilaeae. Et veniens habitavit in civitate quae vocatur
        Nazareth: ut adimpleretur quod dictum est per prophetas: Quoniam Nazaraeus
        vocabitur.
      en: >-
        But when Herod was dead, behold an angel of the Lord appeared in sleep to Joseph
        in Egypt, Saying: Arise, and take the child and his mother, and go into the land
        of Israel. For they are dead that sought the life of the child. Who arose, and
        took the child and his mother, and came into the land of Israel. But hearing
        that Archelaus reigned in Judea in the room of Herod his father, he was afraid
        to go thither: and being warned in sleep retired into the quarters of Galilee.
        And coming he dwelt in a city called Nazareth: that it might be fulfilled which
        was said by prophets: That he shall be called a Nazarene.
    status: { la: verified, en: verified }
