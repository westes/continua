# memory vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/08-02o.txt, English/Sancti/08-02o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-stephen-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Stephanus Romanus pontificátum gessit Valeriáno et Gallieno imperatóribus. Instituit
        ut sacerdótes et diáconi nusquam sacris vestibus, nisi in ecclésia, uteréntur.
        Baptizatos ab hæreticis, íterum baptizari vetuit, rescribens sancto Cypriáno verbis
        illis: Nihil innovétur, nisi quod traditum est. Multos étiam ad Christum convértit, in
        iis Olympium tribunum cum uxore Exsuperia et fílio Theodúlo, item Nemesium tribunum
        cum tota família, óculis Lucillæ ejus fíliæ restitútis: qui omnes Jesu Christi
        Mártyres fuérunt. Sed, vehementius jam ingravescénte persecutióne imperatórum,
        Stephanus, convocato clero, ad martyrium suos hortabátur, in cryptisque Mártyrum
        assidue Missas et concília celebrábat. Qui, cum aliquándo raptus esset ab infidelibus
        ad templum Martis ut ei sacrificaret, líbere negávit se dæmónibus eum honórem velle
        tribúere, qui uni Deo deberétur. Quibus in verbis Martis statua terræmotu cóncidit
        templumque contrémuit. Quare ómnibus aufugiéntibus qui Stephanum tenébant, Pontifex ad
        suos revértitur in cœmetérium Lucinæ; quos, divinis præceptis ínstruens, sacraménto
        corporis Christi communicávit; ibique, dum Missárum solemnia pérficit; adveniéntibus
        íterum imperatórum satellítibus, ei in sua sede caput abscínditur. Corpus, cum eadem
        sede conspersa Mártyris sánguine, a clericis sepúltum est in cœmeterio Callísti, quarto
        Nonas Augusti. Vixit in pontificatu annos tres, menses tres, dies viginti duos. Habuit
        ordinatiónes duas mense Decembri, quibus creávit presbyteros sex, diaconos quinque,
        episcopos tres.
      en: >-
        This Stephen was a Roman, and exercised the Popedom in the reign of the Emperors
        Valerian and Gallienus. It was his ordinance which forbade Priests and Deacons ever to
        use their hallowed garments except in the Church. He forbade a re-baptism of such as had
        been baptized by heretics, writing to St. Cyprian in these words: Let us have no
        innovations, but only what hath been handed down unto us. He turned many to Christ, and,
        among them, the Tribune Olympius, with his wife Exuperia, and his son Theodulus, and the
        Tribune Nemesius, to whose blind daughter he had given sight, along with all his
        household. All these were martyrs for Jesus Christ. When the persecution of the
        Emperors was waxing dreader and more dread, Stephen gathered together the clergy, and
        exhorted them to be brave in lifting up their testimony, and himself celebrated Masses
        and Councils in the Catacombs. He was caught by some unbelievers, and haled to the temple
        of Mars, to do sacrifice to that idol, but he boldly said he would never pay to devils an
        honour which it behoved to give to God only. As he spake these words an earthquake made
        the image of Mars to fall down, and all the temple to tremble. All they that held
        Stephen fled, and the Pope went back to his own people in the cemetery of Lucina. He
        there delivered to them a discourse full of the Word of God, and gave them the Communion
        of the Sacrament of the Body of Christ. While he was finishing the Mass, the soldiers of
        the Emperor again brake in upon them, and his head was cut off as he sat in his chair.
        The reliques of the Martyr, along with the chair stained with his blood, were buried by
        the clergy in the cemetery of Callistus, upon the 2nd day of August. He lived as Pope
        three years, three months, and twenty two days. He held two ordinations in the month of
        December, and in them ordained six Priests, five Deacons, and three Bishops.
    status: { la: verified, en: verified }
