# genuine SanctiM match: the correct Tridentine file is the suffixed
# `Sancti/08-02o.txt` (the plain `Sancti/08-02.txt` is St. Alphonsus
# Liguori instead, a later saint occupying the general calendar's own
# Aug 2 slot), and the only SanctiM files for this date bases
# `@Sancti/08-02` — same "don't trust the plain file" wrinkle as the
