# Matins Nocturn 2 reading for Bl. Victor III, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/10-16-VictorIII.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: bl-victor-iii
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Victor Papa tértius, Desiderius ántea dictus, Benevénti príncipe família natus, a primis
        annis exímia pietáte morumque innocéntia præfúlsit. Vix exacta adolescéntia terrenas núptias
        aversatus, quas ei paréntes statuerant, sponsam clam déserens, erémum pétiit. Matre vero et
        consanguíneis id ægre ferentibus, ne a sancto propósito dimoverétur, monachi vitam ampléxus.
        várias successive sedes mutávit. Cavense scílicet monastérium incoluit, póstea ad cœnubium
        ínsulæ Tremitis divértit, et apud eremitas montis Majestatæ aliquándo delítuit. Dein cum ex
        gravi morbo convaluísset, Cassinum montem ascéndit, ubi propter singuláres virtútes a
        mónachis Abbas designatus, et a Stéphano nono confirmátus est. Ejúsdem Pontíficis nutu
        Constantinópolim Legátus míttitur pro restituenda Ecclésiæ Græcæ cum Apostolica Sede
        communióne.


        Stéphano defúncto ad Cassinense cœnubium revérsus, brevi a Nicoláo secúndo sanctæ Románæ
        Ecclésiæ Cardinális renuntiátus fuit, simúlque Cassinensis Abbas benedíctus. Idem Pontifex
        ejúsque successores eum ad præcípua ac difficillima Ecclésiæ negótia pertractanda
        destinarunt, quin a monachórum regímine distraheretur; nam non solum eórum aucto número
        sanctæ regulæ observántiam promóvit, sed cœnóbium fere ex integro restítuit. Basílicam
        ínsuper sancti patris Benedícti córpore claram, ádeo splendide a fundaméntis excitávit,
        pretiosisque lapídibus ab orientálibus étiam oris advectis, opéribus musivis, ac sacra
        supellectili mira arte magnoque sumptu elaborata ditavit, ut præclárum munificentiæ ejus
        ingeniique exstet monuméntum. Hanc basílicam Alexánder secúndus in signum suæ erga
        Desidérium benevolentiæ, consecrávit, adstantibus quam plúrimis Epíscopis, et Cardinálibus,
        inter quos digni sunt memória sanctus Petrus Damiánus et Hildebrandus, qui póstea Gregórii
        séptimi assúmpto nómine eídem Alexándro succéssit.


        Cum ipse sanctus Gregórius morti próximus eum tamquam dignissimum qui sibi in Apostólica
        Sede succederet designasset, commúni suffragio Desiderius Póntifex elígitur. At hujus
        humílitas tunc máxime enítuit, qui per annum fere integrum tantam dignitátem declinávit.
        Enixis dein prǽsulum, príncipum, ac pópuli précibus inductus, in Capuana synodo Victóris
        nomen et summi pontificátus insígnia accépit. Romam dedúctus, solémni ritu consecratur,
        ejectis inde pseudopontifice Guiberto ejúsque factionis homínibus. Exércitum sub vexillo
        sancti Petri ex tota fere Itália collectum contra Saracénos transmísit in Africam, ubi
        commísso prǽlio, illórum acies pénitus profligavit. Benevénti coacta synodo, schismaticos
        anathemate perculit, ac investituras, quæ in electionibus libertatem Ecclésiæ opprimebant,
        omníno proscripsit; pluraque ália ad ecclesiásticam disciplínam pertinéntia decrévit.
        Perácta synodo, letháli morbo corréptus, Cassinum a Cardinálibus et Epíscopis comitatus
        deférri vóluit, ubi labóribus ærumnísque pro concilianda Ecclésiæ pace conféctus, ánimam Deo
        réddidit sanctitáte et miráculis illústris, anno millésimo octogésimo séptimo. Sedit a suæ
        consecratiónis die menses quátuor et dies septem; ejúsque corpus in basílica Cassinensi
        summa veneratióne cólitur.
      en: >-
        Pope Victor the Third, formerly called Desiderius, born of a family of the princes of
        Benevento, from his first years shone with exceptional piety and innocence of morals.
        Scarcely was his youth over when, shunning the earthly marriage which his parents had
        arranged, he secretly left his betrothed and sought the desert. His mother and kinsmen
        taking this ill, that he might not be turned from his holy purpose, he embraced the monastic
        life and successively changed various dwellings. He dwelt at the monastery of Cava,
        afterwards turned aside to the monastery of the island of Tremiti, and for a time hid among
        the hermits of Mount Majella. Then, when he had recovered from a grave illness, he ascended
        Monte Cassino, where on account of his singular virtues he was designated Abbot by the
        monks, and confirmed by Stephen the Ninth. By the same Pontiff's order he was sent as Legate
        to Constantinople to restore the communion of the Greek Church with the Apostolic See.


        Stephen having died, he returned to the monastery of Cassino, and shortly was proclaimed by
        Nicholas the Second cardinal of the holy Roman Church, and at the same time blessed as Abbot
        of Cassino. The same Pontiff and his successors destined him for the chief and most
        difficult affairs of the Church, without his being drawn away from the government of the
        monks; for he not only promoted the observance of the holy rule by increasing their number,
        but almost entirely rebuilt the monastery. The basilica, moreover, famous for the body of
        the holy father Benedict, he raised from the foundations so splendidly, and enriched with
        precious stones brought even from the shores of the East, with mosaic works and sacred
        furniture wrought with wonderful art and great cost, that it stands an illustrious monument
        of his munificence and genius. This basilica Alexander the Second consecrated in token of
        his goodwill toward Desiderius, in the presence of very many bishops and cardinals, among
        whom are worthy of memory St. Peter Damian and Hildebrand, who afterwards, taking the name
        of Gregory the Seventh, succeeded the same Alexander.


        When the same holy Gregory, near death, had designated him as most worthy to succeed him in
        the Apostolic See, Desiderius was elected Pontiff by common suffrage. But his humility then
        shone most, for he declined so great a dignity for almost a whole year. Induced at length by
        the earnest prayers of prelates, princes and people, in the Synod of Capua he took the name
        of Victor and the insignia of the supreme pontificate. Led to Rome, he was consecrated with
        solemn rite, the antipope Guibert and the men of his faction being cast out thence. He sent
        an army, gathered under the banner of St. Peter from almost the whole of Italy, against the
        Saracens into Africa, where, battle being joined, he utterly routed their ranks. At
        Benevento, a synod having been assembled, he struck the schismatics with anathema, and
        entirely proscribed investitures, which oppressed the Church's freedom in elections; and he
        decreed many other things pertaining to ecclesiastical discipline. The synod ended, seized
        by a deadly illness, he wished to be carried by the Cardinals and Bishops accompanying him
        to Cassino, where, worn out by labours and hardships undertaken to conciliate the peace of
        the Church, he gave his soul to God, illustrious for sanctity and miracles, in the year one
        thousand and eighty-seven. He sat from the day of his consecration four months and seven
        days; and his body is venerated with the greatest veneration in the Cassinese basilica.
    status: { la: verified, en: draft }
