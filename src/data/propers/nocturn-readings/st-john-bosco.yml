# Matins Nocturn 2-3 readings for St. John Bosco, Confessor (Jan 31).
# Sourced directly from web/www/horas/Latin/Sancti/01-31.txt,
# English/Sancti/01-31.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 18:1-5) is a bare incipit
# ("Et réliqua") with no full pericope text given, so — per the
# established convention of not transcribing bare incipits — only the
# homily portion is authored (not marked isGospel), St. John
# Chrysostom's homily (Lectio7's homily + Lectio8-9 combined, one
# continuous piece).
id: st-john-bosco
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánnes Bosco, humili loco natus apud Castum Novum in Astensibus atque sanctíssime,
        patre amisso, disciplína materna institútus, mira de se vel a prima ætate
        portendit. Ingenio enim mitis atque ad pietátem pronus, singulari se gerebat
        auctoritate inter æquales, quorum lites dirímere, faciles rixas compónere, turpia
        verba jocosque lascivos compéscere mature cœpit. Tum verbis eos jucundis ad se
        advocare, ludis preces insérere, quæ sacra elóquia in templo audivísset mirábili
        sermónis copia ac dulcédine referre, ad Pœniténtiæ et Eucharistiæ sacraménta rite
        suscipienda puerulos quam primum quamque creberrime inducere sategit. Oris quoque
        decor verecundus, morum suávitas, atque innocentíssimæ vitæ candor ómnium animos ad
        eum pertrahebant. Licet vero, familiáris rei angustia pressus labórum ærumnarúmque
        plenam adolescéntiam égerit, in id tamen unum hílaris ac Deo fidens contendit, ut
        sacerdotio augerétur.


        Voti tandem compos effectus, Cheriensem civitátem primum, ac dein Augustam
        Taurinórum pétiit, quo acrius, beato Josepho Cafasso magistro, et in sciéntia
        sanctórum profíceret et ad sacram morum doctrinam addiscéndam ánimum adjungeret.
        Ibi autem, cum voluntátis inclinatióne tum superno instinctu incitatus, suum in
        adolescéntulos ánimum convértit, ut prima iis christianæ sapiéntiæ traderet
        rudimenta. Quorum cum fieret in dies major numerus, sedem ad eos coadunándos
        stábilem ac firmam, haud sine cælésti afflatu, ásperis et diuturnis difficultátibus
        superatis, in illa urbis parte collocávit, quæ vulgo Valdocco appellátur, in eamque
        rem totus incúbuit. Paulo vero post, Vírgine Deípara auxiliante, quæ ei puérulo per
        visum in somnis futura innúerat, Joánnes Salesianórum Societátem institúere
        decrevit, cujus esset præsertim juveníles ánimas Christo lucrifácere; item novam
        familiam suscépit constituéndam sacrárum vírginum, quæ, ab Auxiliatrice Dei Matre
        nuncupátæ, adolescéntulas dirígerent in vias Dómini; quibus demum pium
        Cooperatórum cœtum adjecit ad Salesianórum ópera studio ac pietáte fovenda. Itaque
        brevi factum est, ut permagnam et christianæ et civíli societáti utilitátem
        afferret.


        Animárum enim studio flagrans, nulli pepércit labori nullique impensæ, ut festórum
        diérum asceteria pro adolescentulis, pupillórum hospitia, pusiónum operariórum
        scholas, ædes púeris alendis, instituéndis, templa Deo longe lateque per orbem
        excitaret. Simul Christi fidem in Subalpinis verbo et exemplo fovére, per totam
        Italiam optimos libros conficiendo, edendo, divulgando tutari, Evangélii præcones
        ad gentes infidéles sæpius mitténdo propagare non desiit. Simplex ac rectus homo
        Dei, ad omne opus bonum instructus, omnígenis virtútibus flóruit, quas incensíssimæ
        caritátis ardor alebat. Mente in Deum constanter erecta ac supernis charismátibus
        cumulátus, nullis sanctíssimus vir, nec minis terreri, nec labóribus fatigari, nec
        curis ópprimi, neque rebus adversis perturbari videbátur. Tria autem pietátis
        offícia suis maxime commendávit: ut quam sæpíssime ad sacram exhomologésim
        sacramque synáxim accederent, ut Mariam Auxiliatricem peramanter cólerent, ut
        Pontifici máximo ceu fílii addictíssimi obsequeréntur. Vitæ cursum, tot tantisque
        opéribus ac labóribus refertum, confecit pridie Kalendas Februarias anno salútis
        millesimo octingentésimo octogesimo octavo, ætátis septuagesimo tertio. Quem
        multis clarum miraculis Pius undecimus, Pontifex maximus, anno millesimo
        nongentésimo vigesimo nono Beatórum, quinquennio post, die solemni Paschæ, décimo
        nono exeunte sæculo a peracta humani generis Redemptióne, géntibus ex orbe
        universo in Urbem confluéntibus, Sanctórum ordínibus adserebat.
      en: >-
        John Bosco, born in the poor town of Castelnuovo d'Asti, and having lost his father
        at the age of two, was raised by his mother in a most saintly manner, and from his
        earliest years gave evidence of an extraordinary future. Docile and pious, he had a
        remarkable influence over those of his own age, whose fights he soon began to settle,
        and whose indecent words and improper jokes he stopped. Then he busied himself with
        drawing them to him by good stories, by including prayers in their games, by
        repeating in an attractive way the complete sermons he had heard in church, and with
        persuading them to receive the sacraments of Penance and of the Holy Eucharist
        without delay and frequently. His unassuming manner, his affability, and his
        innocence drew everyone to him. Although pressed with difficulties at home, and
        forced to work hard in his youth, he ardently desired with trust in God to become a
        priest.


        His wish was fulfilled, and he went first to Chieri, and then to Turin, where under
        the direction of Blessed Joseph Cafasso, he made rapid progress in the science of
        the Saints and in the learning of moral theology. There moved by divine grace and
        personal liking he began to take an interest in the youths, whom he taught the
        rudiments of the Christian religion. Their number increased day by day, and
        notwithstanding great and persistent difficulties, under divine inspiration he made
        a foundation for them in that section of the city called the Valdocco, on which he
        began to spend all his energy. Shortly after, with the help of the Blessed Virgin,
        who in a vision to him when a boy had revealed his future, John founded the Society
        of the Salesians, whose principal purpose was to be the saving of youthful souls for
        Christ. In like manner he founded a new family of nuns, who were called the
        daughters of St. Mary Auxiliatrix, and who would do for poor girls what the
        Salesians were doing for boys. To these he finally attached the Third Order of
        Salesian Cooperators, who by their piety and zeal were to assist in the educational
        work of the Salesians. And so in a short time he made great contributions both to
        the Church and to the State.


        Filled with zeal for souls, he spared himself no labour and no expense to build
        recreational centres for the young, orphanages, schools for working children,
        schools and homes for the training of the young, and churches far and wide
        throughout the world. At the same time he did not stop spreading the Faith
        throughout the Subalpine country by word and by example, and throughout the whole of
        Italy, by writing and editing good books and by distributing the same, and in the
        foreign missions to which he sent numerous preachers. A simple and upright man, bent
        on every good work, he shone with all manner of virtue, which was fostered by his
        intense and ardent charity. With his mind always on God, and showered with heavenly
        gifts, this holy man of God was not disturbed by threats, nor tired by work, nor
        overwhelmed by care, nor upset by adversity. He recommended three works of piety to
        his followers: to receive as frequently as possible the sacraments of Penance and of
        Holy Eucharist, to cultivate a devotion to St. Mary Auxiliatrix, and to be the most
        loyal children of the Sovereign Pontiff. With a life of such accomplishments he died
        on the 31st day of January, 1888. Illustrious for his many miracles, the Supreme
        Pontiff, Pius XI, beatified him in 1929. Five years later, in the nineteenth
        centenary of the anniversary of our redemption, he was canonized among a vast
        gathering come to the Eternal City from every part of the world.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. John Chrysostom, Homily 60 on Matthew (on Matt 18:1-5)"
    text:
      la: >-
        Vide quot modis nos inducat Dóminus ad curam vel minórum fratrum? Ne ítaque
        dixeris: Ærarius est ille, aut calceórum sutor, agricola, insípiens, ut ideo
        despícias illum. Ne enim in illud mali íncidas, perpende quot modis te inducat, ut
        modeste agas et eórum curam geras. Puerum in médio státuit et ait: Efficiámini ut
        párvuli: et: Quicúmque suscéperit párvulum talem, me suscipit: et: Qui
        scandalizaverit, extrema patiétur. Si ergo Deus ita gaudet de párvulo qui repertus
        est, cur tu despícias eos quos Deus tam sollicite curat, cum oporteret ánimam ipsam
        tradere pro uno ex párvulis istis? Tanta quippe est Deo cura de anima, ut ne Fílio
        quidem suo pepércerit. Quare, óbsecro, primo dilúculo cum a domo exiérimus, hunc
        unum scopum habeámus et hanc præcipue sollicitúdinem, ut periclitántem eripiámus.
        Non loquor hic de sensibili periculo; hoc enim ne periculum quidem est; sed de
        periculo ánimæ, quod homínibus parat diabolus.


        Improbus, inquis, difficile tolerátur. Atque ideo debes illi amóre jungi, ut eum a
        vítio removeas, ut convértas et ad virtútem redúcas. At non obtemperat, inquis,
        neque consílium admittit. Unde hoc nosti? An exhortátus es et emendare studuísti?
        Hortátus sæpe sum, inquies. Quóties? Sæpius: semel et íterum. Idne sæpius vocas?
        Etiamsi per totam vitam id fecisses, nec deficere, nec desperáre oportebat. Non
        vides quómodo nos Deus semper hortátur per Prophétas, per Apóstolos, per
        Evangelistas? Quid ígitur? Num recte operamur? Num in ómnibus obtemperamus? Minime.
        Num ideo finem fecit admonendi?


        Nihil quippe tam pretiósum est quam ánima: quid enim prodest homini, si mundum
        univérsum lucrétur, ánimæ vero suæ detriméntum patiátur? Verum ómnia pervértit et
        dejécit pecuniárum amor, Deique timórem decussit, sicut tyrannus arcem sic ánimas
        occupans. Idcirco et filiórum et nostram neglígimus salútem. Hinc magna insipiéntia;
        hinc líberi servis vilióres fiunt. Ecquid de servis loquor? Mulum si quis habeat,
        multum curat ut agasónem illi optimum provideat, non ímprobum, non furacem, non
        temuléntum, non artis suæ imperítum: si autem fílio pædagogum dare opus sit, casu et
        sine delectu obvium quemque excipimus; etsi hac arte nulla sit major. Quid par illi
        arti, quæ dirigendæ juvenis menti et índoli incumbit? Qui tali instructus est
        facultate, plus diligéntiæ exhibeat oportet, quam quivis pictor aut statuarius.
      en: >-
        Do ye see in how many ways the Lord leadeth us on to the care of our lesser brethren?
        Therefore do not say: He is only a taxpayer, or a shoemaker, or a farmer, or that he
        is foolish, that ye may in that way look down on him. So that ye will not fall into
        such evil, reflect on how many ways he leadeth you to act humbly and take care of
        them. He placed a child in their midst and said: Become like little children; and:
        Whosoever receiveth one such little child for my sake, receiveth me; and: Who
        causeth one to sin, will suffer the severest penalties. If therefore God so
        rejoiceth over a little one that hath been found, why do ye despise those for whom
        God is so solicitous, when ye should trade your own life for one of those little
        ones? So great indeed is God's care for a soul that he did not spare his own Son.
        Wherefore, I entreat you, the first thing in the morning when we go out of the
        house, let us have in mind this purpose and this concern, to save someone in danger.
        I do not speak here of a visible danger, for this is not danger at all, but of danger
        to the soul, which the devil prepareth for men.


        Ye say it is hard to tolerate the bad. Ye should be joined to him in love, to lead
        him away from vice, to convert him and lead him back to virtue. But he doth not
        follow, say ye, nor taketh he advice. How know ye this? Have ye exhorted him and have
        ye tried to correct him? I have often exhorted, ye will say. How often? Once or
        twice. Do ye call that very often? Even if ye were to do it for your whole life, ye
        should neither stop nor despair. Do ye not see how God always encourageth us through
        the Prophets, through the Apostles, and through the Evangelists? What followeth? Do
        we act right? Do we obey in everything? Not at all. Should there be an end, then, to
        admonishing?


        There is indeed nothing as precious as a soul. For what doth it profit a man if he
        gain the whole world, and suffer the loss of his soul? But love of money hath
        destroyed and cast down everything, it hath thrust aside the fear of God, taking
        possession of the soul as a tyrant occupieth a fortress. And so we neglect our own
        salvation and that of our children. Great is that folly, and our children are worse
        than servants. Why do I speak of servants? If ye have a mule, ye take care to give it
        the best groom, one who is not worthless, nor a thief, nor a drunk, and one is not
        inexperienced in his work. If, however, it is necessary to have a preceptor for your
        son, ye take anyone ye may meet by chance and ye give no thought to selection,
        although there is no profession greater than this one. What is equal to that
        profession which is concerned with directing the soul and forming the mind and
        character of the young? He who hath such a task should shew more diligence than any
        painter or sculptor.
    status: { la: verified, en: verified }
