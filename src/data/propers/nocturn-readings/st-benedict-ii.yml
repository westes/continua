# Matins Nocturn 2 reading for St. Benedict II, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/05-07-BenedictusII.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-benedict-ii
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Benedíctus hujus nóminis secúndus, Romanus génere, patre Joánne ortus, post Leónis secúndi
        óbitum ad munus Apostolicum assúmptus est, anno Christi sexcentésimo octogésimo quarto, et
        suprémum christiánæ rei publicæ clavum novem círciter menses ténuit, dignissimus certe, qui
        diútius teneret, cum a primis pueritiæ annis se totum ecclesiásticis ministériis addixisset,
        ac sedulam divínis lítteris et sacræ psalmodiæ óperam navasset.


        Hic non uno dumtáxat nómine,verum étiam cœlestis benedictionis grátia et sanctæ
        conversationis exémplo Benedíctus, mansuetus, mitis et húmilis, insígnis étiam patiéntiæ,et
        páuperum amantíssimus, in quos larga manu réditus Ecclésiæ profúdit. Ad restaurandam quoque
        ac exornándam Príncipis Apostolórum basílicam, aliásque Urbis ecclésias, ánimum et manum
        applicuit, in quo multa aureorum míllia pie consúmpsit.


        Mirifico étiam conservandæ et propagándæ religiónis zelo flagrávit. Macarium patriarcham
        Antiochenum, a sexta synodo propter hærésim depositum, ad saniorem mentem redúcere summo
        stúdio laborávit. Scriptis étiam ad epíscopos Hispániæ lítteris, eosdem monuit ut
        declararent apertius et sanius, quæ de voluntáte Dei et tribus Christi substantiis ante
        scripserant. Constantínus vero imperátor tanto illum amóre et honóre prosecútus est, ut et
        capíllos suórum fíliorum, in signum observántiæ, illi obtulerit. Sancto tandem fine quiévit,
        et sepúltus est in Vaticáno.
      en: >-
        Benedict, the second of that name, a Roman by birth, born of his father John, was raised to
        the Apostolic office after the death of Leo the Second, in the year of Christ 684, and held
        the supreme helm of the Christian commonwealth about nine months, most worthy indeed to hold
        it longer, since from the first years of boyhood he had given himself wholly to
        ecclesiastical ministries, and had applied diligent labour to the sacred letters and to
        sacred psalmody.


        He was Benedict not only in name, but also by the grace of heavenly blessing and by the
        example of a holy way of life, gentle, mild and humble, notable also for patience, and a
        most loving friend of the poor, on whom he lavished the Church's revenues with a generous
        hand. To restore and adorn the basilica of the Prince of the Apostles and other churches of
        the City he applied mind and hand, in which he piously spent many thousands of gold pieces.


        He burned with a wonderful zeal for preserving and propagating religion. He laboured with
        the greatest zeal to bring back to a sounder mind Macarius, Patriarch of Antioch, deposed by
        the sixth synod for heresy. By letters also to the bishops of Spain he admonished them to
        declare more openly and more soundly what they had before written on the will of God and the
        three substances of Christ. The Emperor Constantine so loved and honoured him that he
        offered him the hair of his sons, as a sign of reverence. At last he rested in a holy end,
        and was buried in the Vatican.
    status: { la: verified, en: draft }
