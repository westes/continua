# Matins Nocturn 2 reading for St. Theodore, Martyr. Sourced directly from
# web/www/horas/Latin/Sancti/11-09cc.txt, English/Sancti/11-09cc.txt.
# single lesson (Lectio93), one continuous account.
id: st-theodore-martyr
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Theodórus, miles christiánus, Maximiáno imperatóre, quod idolórum fanum
        incendísset, comprehénsus, cum a præfécto legiónis pœna ei remitterétur, si
        pœ́nitens facti christiánam fidem exsecrarétur, constánter in fídei confessióne
        persevérans, missus est in cárcerem. Ubi, úngulis excarnificátus, dum costæ
        nudaréntur, lætus canébat: Benedícam Dóminum in omni témpore. Quare, in ardéntem
        rogum injéctus, in oratióne et divínis láudibus ánimam Christo réddidit, quinto
        Idus Novémbris. Cujus corpus Eusébia matróna, síndone involútum, sepelívit in
        suo prǽdio.
      en: >-
        This Theodore was a Christian soldier, who was arrested in the reign of the
        Emperor Maximian for having set fire to a temple of idols. The Commander of the
        Legion offered him pardon if he would profess repentance and curse the Christian
        faith, but, as he refused to swerve as regarding the confession of his belief,
        he was cast into prison. There he was tormented with iron claws. As they were
        tearing the flesh off his ribs, he sang joyfully (the 33rd Psalm) I will bless
        the Lord at all times. Thereafter he was thrown upon an heap of burning wood,
        and there, still praying and praising God, he gave up his soul to Christ, upon
        the 9th day of November, (in the year of salvation 304.) The Lady Eusebia
        wrapped his body in a winding-sheet, and buried it on her own farm.
    status: { la: verified, en: verified }
