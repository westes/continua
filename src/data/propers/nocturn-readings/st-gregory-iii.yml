# Matins Nocturn 2 reading for St. Gregory III, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/11-28-GregoriusIII.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-gregory-iii
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gregórius, hujus nóminis tértius, natióne Syrus, patre Joánne, Gregório secúndo vita functo,
        unánimi cleri et pópuli consénsu, nec non divíno quodam instínctu, cum dignissimus ómnium
        esset, subrogatus est, anno Christi septingentésimo trigésimo primo. Vir singulári doctrína
        et virtúte, latína et græca lingua erudítus, mirábili dicendi facundia, atque ádeo felíci
        memória, ut totum psaltérium memoriter recitaret; is demum, quem prædecessori suo Gregório
        doctrína et prudéntia sapientíssimi hómines æquiparandum esse duxérunt.


        Cathólicæ fídei propugnátor acérrimus, Leónem Isaurum imperatórem iconoclastam paternis
        mónitis et lítteris ad saniorem mentem redúcere conátus est. Sed cum nihil profíceret,
        convocato Romæ nonaginta quinque episcopórum concílio, sacrárum imaginum cultum apostólico
        decréto firmávit, et diro anathemate feriit Iconomachos. Quæ cum ad Leónis aures
        pervenissent, áltius rugire coépit, misitque advérsus Gregórium florentissimam classem cum
        potentissimo exércitu: sed hæc, volente ac vindice Deo, in Adriatico sæva tempestáte
        agitata, fœdo naufragio périit.


        Multa quoque a Luitprando Longobardórum rege iníque passus est, qui et Urbem longa obsidione
        cinxit, et sancti Petri basílicam sacrilega manu diripuit. In his angústiis sanctíssimus
        Póntifex ad Carolum Martellum, antecessoris exémplo, legátos cum sacris munéribus
        destinavit. Munivit Urbis mœnia: largas in egénos eleemósynas erogávit, novas basílicas a
        fundaméntis exstrúxit, antíquas ornávit, ac restauravit, Vaticanam præsértim, intra quam
        oratórium auro, argénto, gemmis, omníque pretiósi óperis génere ditatum eréxit, in quo
        sanctórum Apostolórum et Mártyrum relíquias summa cura et diligéntia toto christiáni orbis
        ambitu conquisítas reposuit, et colendas exposuit, eo máxime témpore, quo illas agiomachi
        diabolico furóre proculcabant. Multa monastéria restítuit, et sanctis légibus instruxit,
        statuítque, ut presbyteri et monachi altérnis noctu diuque divinas laudes celebrarent.
        Fractus demum labóribus, méritis licet atque virtútibus inclytus, anno sui pontificátus
        undécimo nondum peracto, quarto Kaléndas Decémbris pie óbiit in Dómino, et in prædícto
        oratorio Vaticáno sepúltus est.
      en: >-
        Gregory, the third of that name, a Syrian by race, son of John, Gregory the Second having
        died, by the unanimous consent of clergy and people, and also by a certain divine instinct,
        since he was the most worthy of all, was put in his place, in the year of Christ 731. A man
        of singular learning and virtue, versed in Latin and Greek, of wonderful fluency of speech,
        and of so happy a memory that he recited the whole Psalter from memory; one whom the wisest
        men judged to be equalled in learning and prudence to his predecessor Gregory.


        A most keen defender of the Catholic faith, he tried by paternal admonitions and letters to
        bring Leo the Isaurian, the iconoclast emperor, back to a saner mind. But when he
        accomplished nothing, having convened at Rome a council of ninety-five bishops, he confirmed
        the veneration of sacred images by apostolic decree and struck the iconoclasts with a dread
        anathema. When these things came to the ears of Leo, he began to rage more loudly, and sent
        against Gregory a most flourishing fleet with a most powerful army: but this, by the will
        and vengeance of God, tossed by a cruel tempest in the Adriatic, perished in foul shipwreck.


        He also suffered many unjust things from Liutprand king of the Lombards, who both besieged
        the City in a long siege and plundered the basilica of St. Peter with sacrilegious hand. In
        these straits the most holy Pontiff, after the example of his predecessor, sent legates with
        sacred gifts to Charles Martel. He fortified the walls of the City: he distributed large
        alms to the poor, built new basilicas from the foundations, adorned and restored the old,
        the Vatican especially, within which he erected an oratory enriched with gold, silver, gems,
        and every kind of precious work, in which he placed and exposed for veneration the relics of
        the holy Apostles and Martyrs, sought out with the greatest care and diligence through the
        whole circuit of the Christian world, at the very time when the image-destroyers were
        trampling on them with diabolical fury. He restored many monasteries, and furnished them
        with holy laws; and he decreed that priests and monks should celebrate the divine praises in
        turns, by night and by day. At length, worn out by labours, though renowned for merits and
        virtues, the eleventh year of his pontificate not yet completed, on the fourth day before
        the Kalends of December he piously died in the Lord, and was buried in the aforesaid oratory
        in the Vatican.
    status: { la: verified, en: draft }
