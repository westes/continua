# Matins Nocturn 2 reading for st-lucius-i (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/03-04cc.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-lucius-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Lucius Románus patre Porphyrio, post sancti Cornélii consummationem, Románæ Ecclésiæ
        episcopátum ténuit. Sanxit, ut duo presbyteri ac tres diáconi, ecclesiástici causa
        testimonii, quovis loco epíscopum non desererent Pacem lapsis dandam, et pœniténtia acta,
        communicationis fructum negandum non esse, spíritu Dei plenus (ut sanctus Cypriánus
        scripsit), lítteris suis significávit. Ob Christi fidem exsílio relegátus, et post modum ad
        Ecclésiam suam incólumis redíre permíssus, tandem omni Ecclésiæ facultáte archidiacono suo
        Stéphano prius trádita, cápite truncatus est quarto Nonas Mártii, Gallo et Volusiáno
        princípibus. Duas hábuit ordinatiónes mense Decémbri, quibus presbyteros quátuor, epíscopos
        per divérsa loca septem creávit. Ejus corpus primo via Appia ad sanctum Xystum, in cœmetério
        Callísti sepúltum, inde a Pascháli Papa in sanctæ Cæcíliæ títulum, una cum ejúsdem vírginis
        et sociórum corpóribus translátum, ibi sub sancto altári collocátum fuit.
      en: >-
        Lucius, a Roman, the son of Porphyrius, held the episcopate of the Roman Church after the
        consummation of holy Cornelius. He ordained that two priests and three deacons, for the sake
        of ecclesiastical testimony, should not abandon the bishop in any place. And, full of the
        Spirit of God (as holy Cyprian wrote), he made known by his letters that peace must be given
        to the lapsed, and that, once penance has been done, the fruit of communion is not to be
        denied. Banished for the faith of Christ, and afterwards permitted to return safe to his own
        Church, at last, having first delivered all the Church's property to his archdeacon Stephen,
        he was beheaded on the fourth day before the Nones of March, in the principate of Gallus and
        Volusian. He held two ordinations in the month of December, in which he created four priests
        and seven bishops for various places. His body was first buried on the Appian Way near St.
        Sixtus, in the cemetery of Callistus, and afterwards by Pope Paschal was translated to the
        title of St. Cecilia, together with the bodies of that same virgin and her companions, and
        there was placed under the holy altar.
    status: { la: verified, en: draft }
