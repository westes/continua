id: st-simeon
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Simeon, fílius Cléophæ, post Jacobum próximus Jerosolymis ordinátus epíscopus, Trajano
        imperatóre apud Atticum consularem est accusatus, quod christianus esset et Christi
        propinquus. Comprehendebántur enim omnes eo témpore, quicúmque ex genere David orti
        essent. Quare multis cruciátus tormentis eodem passiónis genere, quod Salvátor noster
        subíerat, affícitur: mirántibus ómnibus, quod homo ætate confectus (erat enim centum et
        viginti annórum) acerbíssimos crucis dolóres fortiter constanterque paterétur.
      en: >-
        Simeon, the son of Cleophas, was chosen the second Bishop of Jerusalem, being the first
        after James. Under the Emperor Trajan he was accused before the Pro-Consul Atticus, as
        being both a Christian and a relation of Christ, this being the time when all were
        arrested that were of the lineage of David. He underwent with great suffering the same
        things that were inflicted on our Saviour, and all men marvelled to see with how great
        boldness and firmness he endured the grievous torment of the cross, at his great age, for
        he was an hundred and twenty years old.
    status: { la: verified, en: verified }
