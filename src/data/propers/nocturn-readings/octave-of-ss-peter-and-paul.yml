# Matins Nocturn 2-3 readings for the Octave Day of Ss. Peter and Paul
# (July 6). Sourced directly from web/www/horas/Latin/Sancti/07-06.txt,
# English/Sancti/07-06.txt. Nocturn 2: Lectio4-6, St. John Chrysostom's
# sermon on both Apostles, combined into one reading. Nocturn 3: the
# Gospel citation ends "Et réliqua"/"And so on" with no full pericope
# given -- per the bare-incipit convention, only the homily (Lectio7-9,
# St. Jerome on Christ walking on the water) is authored, isGospel:
# false, no citation field.
id: octave-of-ss-peter-and-paul
readings:
  - nocturn: 2
    isGospel: false
    source: "St. John Chrysostom, apud Metaphrasten"
    text:
      la: >-
        Quasnam vobis, o beáti Apóstoli, referémus grátias, qui tantum pro nobis
        laborastis? Mémini tui, Petre, et obstupesco: recordor tui, Paule, et
        excédens mente ópprimor lácrimis. Quid enim dicam, aut quid loquar, vestras
        contemplans afflictiónes, nescio. Quot carceres sanctificastis! quot catenas
        decorastis! quot torménta sustinuistis! quot maledicta tolerástis! quómodo
        Christum portastis! quómodo prædicatióne ecclésias lætificastis! Sunt
        benedicta vestræ linguæ instruménta: sánguine conspersa sunt membra vestra
        propter Ecclésiam. Vos Christum imitáti estis in omnibus. In omnem terram
        éxiit vester sonus, et verba vestra in fines orbis terræ.


        Gaudeas, Petre, cui datum est ut ligno crucis Christi fruereris. Et ad
        Magistri quidem similitúdinem voluísti crucifigi, non recta quidem figura,
        ut Christus Dóminus; sed cápite in terram verso, tamquam qui a terra in
        cælum iter fáceres. Beáti clavi, qui sancta illa membra penetrarunt. Tu cum
        omni fiducia in manus Dómini ánimam tradidísti, qui assidue ei et ejus
        sponsæ Ecclésiæ servísti, qui fervénti spíritu Dóminum dilexísti, ómnium
        Apostolórum fidelíssimus.


        Gaudeas et tu, beate Paule, cui caput fuit gládio amputátum, cujus virtútes
        nullis verbis explicari possunt. Quisnam gládius sanctum guttur tuum
        pervasit, Dominicum, inquam, instruméntum, quod a cælo habétur in
        admiratióne, et quod terra reverétur? Quisnam locus tuum sánguinem excepit,
        lactis spécie in ejus qui te percússit, túnica apparentem? qui ánimam
        illíus bárbari supra modum dulciórem reddens, fidélem effécit cum sociis.
        Sit mihi gládius ille pro coróna, et clavi Petri pro gemmis infixis in
        diadémate.
      en: >-
        The blessed Apostles, who have toiled so much for us, what thanks shall we
        give you? When I remember thee, O Peter, I am lost in amazement; Paul, when I
        think of thee, my heart overwhelmeth me, and I weep. When I look at your
        sufferings I know not what to say or what to speak. How many prisons have ye
        made holy! How many fetters have ye made honourable! How many torments have
        ye endured! How many reproaches have ye borne! How have ye carried Christ!
        How have ye made the Churches glad by your preaching! Verily, your tongues
        were blessed instruments; it was for the Church's sake that your limbs were
        bloody. Ye have been made in all things followers of Christ. Your sound is
        gone out through all the earth, and your words to the ends of the world.


        Rejoice, O Peter, who hast been gladdened by the wood of the Cross of Christ.
        It was a showing forth of thy Teacher that thou didst will to be crucified,
        not like the Lord Christ, standing upright, but with thine head toward the
        earth, as one that made a way from earth to heaven. Blessed are the nails
        which pierced thine holy limbs. With sure and certain hope didst thou commend
        thy spirit into the hands of the Lord, thou who hadst been a faithful servant
        to Him and to His Bride the Church, thou who in thy warm heart hadst loved
        the Lord more loyally than all the Apostles.


        Rejoice thou also, O blessed Paul, whose head was cut off by the sword, thou
        whose fearless devotion no words can express. What sword was that which
        divided thine holy neck, that instrument of the Lord's work, worthy that
        heaven should wonder at it, and earth worship it? What place was that which
        drank in thy blood, that appeared like drops of milk upon the raiment of him
        who smote thee, and made the savage and his comrades to become strangely
        gentle and faithful? Would that I could have that sword for a crown, and the
        nails of Peter set therein as the jewels of the diadem.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Jerome, Commentary on Matthew, Bk. II, ch. 14"
    text:
      la: >-
        Discípulis Dóminus præcepit transfretare, et cómpulit ut ascenderent
        naviculam. Quo sermóne osténditur, invitos eos a Dómino recessisse, dum
        amóre Præceptoris ne punctum quidem témporis ab eo volunt separari. Et,
        dimissa turba, ascéndit in montem solus orare. Si fuíssent cum eo discípuli
        Petrus et Jacobus et Joánnes, qui víderant glóriam transformáti, fórsitan
        ascendíssent in montem cum eo; sed turba ad sublimia sequi non potest, nisi
        docúerit eam juxta mare in littore et alúerit in desérto.


        Quod autem ascéndit solus orare, non ad eum réferas, qui de quinque pánibus
        quinque míllia saturávit hóminum, exceptis párvulis et muliéribus; sed ad
        eum, qui, audíta morte Joánnis, secessit in solitúdinem: non quod personam
        Dómini separemus, sed quod ópera ejus inter Deum hominémque divisa sint.
        Navícula autem in médio mari jactabátur fluctibus. Recte quasi invíti et
        retractántes Apóstoli a Dómino recesserant, ne, illo absente, naufragia
        sustinérent.


        Denique, Dómino in montis cacúmine commorante, statim ventus contrarius
        óritur, et turbat mare, et periclitántur Apóstoli; et tamdiu imminens
        naufragium persevérat, quámdiu Jesus véniat. Quarta autem vigília noctis
        venit ad eos ámbulans supra mare. Statiónes et vigíliæ militares in terna
        horárum spatia dividúntur. Quando ergo dicit, quarta vigília noctis venisse
        ad eos Dóminum, osténdit tota nocte periclitatos; et extremo noctis, atque
        in consummatióne mundi, eis auxílium præbiturum.
      en: >-
        The Lord commanded His disciples to cross over to the other side, and
        constrained them to get into a ship. By these expressions we perceive that
        they were unwilling to leave the Lord, the love of their Teacher making them
        desire not to lose a moment of His company. And when He had sent the
        multitudes away, He went up into a mountain apart to pray. Perchance, if
        Peter, and James, and John, who had seen Him in the glory of the
        Transfiguration, had been with Him, they would have gone up into the
        mountain with Him, but the common herd could not follow Him, save when He
        taught them on the sea shore, or fed them in the wilderness.


        He went up into a mountain apart to pray, not as He Who, with five loaves and
        two fishes, had satisfied about five thousand men, besides women and
        children, but as He, Who when He heard of the death of John, departed into a
        desert place apart. Not that we make two Persons in the Lord, but some of His
        works He did as God, and some as man. But the ship was now in the midst of
        the sea, tossed with waves. The Apostles were right to be slow and unwilling
        to leave the Lord, for, when He was not with them, they were in peril of
        shipwreck.


        Whilst the Lord abode alone upon the top of the mountain, a contrary wind
        arose, and the sea raged, and the Apostles were endangered, and yet the
        threatening shipwreck held off until Jesus came. And in the fourth watch of
        the night, Jesus went unto them, walking on the sea. The watches of soldiers
        are divided into three. When therefore it is said that the Lord came unto
        them in the fourth watch, it appeareth that they had been in peril all night,
        and that it was at the end of the night, as it will again be at the end of
        the world, that He came to the rescue of His disciples.
    status: { la: verified, en: verified }
