# Matins Nocturn content for Lent Ember Wednesday (Feria Quarta Quattuor
# Temporum Quadragesimæ) — Gospel pericope (Matt 12:38-50) sourced from
# web/www/missa/Latin/Tempora/Quad1-3.txt and missa/English/Tempora/
# Quad1-3.txt (horas/Tempora/Quad1-3.txt only gives the incipit + "Et
# réliqua"); homily sourced from horas/Latin/Tempora/Quad1-3.txt and
# horas/English/Tempora/Quad1-3.txt. No Monastic-track override exists —
# Latin/TemporaM/Quad1-3.txt is a bare `@Tempora/Quad1-3` pass-through
# (plus a Cistercian-only extra responsory, not used here).
#
# Recombined into one reading, same convention as September's Ember days
# (see ember-september-friday.yml's own doc comment for the fuller
# rationale): St. Ambrose's homily is one continuous text on the sign of
# Jonah, split only to fill the fixed 3-lesson slot count. Responsory:
# Lectio1/2's own (Responsory1/2) are bare cross-references to the 1st
# Sunday of Lent's own generic Nocturn responsories
# (@Tempora/Quad1-0:Responsory7/8, shared across the whole week's
# ferias, not proper to this day) — Lectio3's own Responsory3
# ("Abscóndite eleemósynam...") is genuinely proper to this day, so it's
# used here instead of the "first one, when several collapse" convention
# (which would pick a non-proper, merely-shared text over a real one).
id: ember-lent-wednesday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Matth 12:38-50", en: "Matt 12:38-50" }
    text:
      la: >-
        In illo témpore: Respondérunt Jesu quidam de scribis et pharisǽis, dicéntes: Magíster, vólumus a te
        signum vidére. Qui respóndens, ait illis: Generátio mala et adúltera signum quærit: et signum non
        dábitur ei, nisi signum Jonæ Prophétæ. Sicut enim fuit Jonas in ventre ceti tribus diébus et tribus
        nóctibus: sic erit Fílius hóminis in corde terræ tribus diébus et tribus nóctibus. Viri Ninivítæ surgent
        in judício cum generatióne ista, et condemnábunt eam: quia pæniténtiam egérunt in prædicatióne Jonæ. Et
        ecce plus quam Jonas hic. Regína Austri surget in judício cum generatióne ista, et condemnábit eam: quia
        venit a fínibus terræ audire sapiéntiam Salomónis. Et ecce plus quam Sálomon hic. Cum autem immúndus
        spíritus exíerit ab hómine, ámbulat per loca árida, quærens réquiem, et non invénit. Tunc dicit: Revértar
        in domum meam, unde exívi. Et véniens invénit eam vacántem, scopis mundátam, et ornátam. Tunc vadit, et
        assúmit septem álios spíritus secum nequióres se, et intrántes hábitant ibi: et fiunt novíssima hóminis
        illíus pejóra prióribus. Sic erit et generatióni huic péssimæ. Adhuc eo loquénte ad turbas, ecce, Mater
        ejus et fratres stabant foris, quæréntes loqui ei. Dixit autem ei quidam: Ecce, mater tua et fratres tui
        foris stant, quæréntes te. At ipse respóndens dicénti sibi, ait: Quæ est mater mea, et qui sunt fratres
        mei? Et exténdens manum in discípulos suos, dixit: Ecce mater mea et fratres mei. Quicúmque enim fécerit
        voluntátem Patris mei, qui in cœlis est: ipse meus frater et soror et mater est.
      en: >-
        At that time, certain of the Scribes and Pharisees answered Him, saying: Master, we would see a sign from
        You. But He answered and said to them, An evil and adulterous generation demands a sign, and no sign shall
        be given it but the sign of Jonah the prophet. For even as Jonah was in the belly of the fish three days
        and three nights, so will the Son of Man be three days and three nights in the heart of the earth. The men
        of Ninive will rise up in the judgment with this generation and will condemn it; for they repented at the
        preaching of Jonah, and behold, a greater than Jonah is here. The queen of the South will rise up in the
        judgment with this generation and will condemn it; for she came from the ends of the earth to hear the
        wisdom of Solomon, and behold, a greater than Solomon is here. But when the unclean spirit has gone out of
        a man, he roams through dry places in search of rest, and finds none. Then he says, "I will return to my
        house which I left"; and when he has come to it, he finds the place unoccupied, swept and decorated. Then
        he goes and takes with him seven other spirits more evil than himself, and they enter in and dwell there;
        and the last state of that man becomes worse than the first. So shall it be with this evil generation
        also. While He was still speaking to the crowds, His mother and His brethren were standing outside,
        seeking to speak to Him. And someone said to Him, Behold, Your mother and Your brethren are standing
        outside, seeking You. But He answered and said to him who told Him, Who is My mother and who are My
        brethren? And stretching forth His hand toward His disciples, He said, Behold My mother and My brethren!
        For whoever does the will of My Father in heaven, he is My brother and sister and mother.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Ambrose, Bishop, homily on Luke 11 (on the sign of Jonah)"
    text:
      la: >-
        Judæórum plebe damnáta, Ecclésiæ mystérium evidénter exprímitur, quæ in Ninivítis per pœniténtiam, et in
        regína Austri per stúdium percipiéndæ sapiéntiæ, de totíus orbis fínibus congregátur, ut pacífici Salomónis
        verba cognóscat. Regína plane, cujus regnum est indivísum, de divérsis et distántibus pópulis in unum
        corpus assúrgens.


        Itaque sacraméntum illud magnum est de Christo et Ecclésia. Sed tamen hoc majus est, quia illud in figúra
        ante præcéssit, nunc autem plenum in veritáte mystérium est. Illic enim Sálomon typus, hic autem Christus
        in suo córpore est. Ex duóbus ígitur constat Ecclésia: ut aut peccáre nésciat, aut peccáre désinat.
        Pœniténtia enim delíctum ábolet, sapiéntia cavet.


        Céterum Jonæ signum, ut typus Domínicæ passiónis, ita étiam grávium, quæ Judǽi commíserint, testificátio
        peccatórum est. Simul advértere licet et majestátis oráculum, et pietátis indícium. Namque Ninivitárum
        exémplo et denuntiátur supplícium, et remédium demonstrátur. Unde étiam Judǽi debent non desperáre
        indulgéntiam, si velint ágere pœniténtiam.
      en: >-
        After the condemnation of the Jewish people, the mystery of the Church is plainly declared in the figures
        of the repentant Ninevites, and of the Queen of the South. Like that Queen, the Church cometh from the
        uttermost parts of the earth, to hear the wisdom of the true Solomon, the Prince of Peace. A Queen she is,
        and a Queen of one indivisible realm, wrought into one body out of all nations, however diverse and
        distant.


        And thus cometh that great mystery of Christ and the Church, a mystery more excellent now in the fulness
        of truth, than in the ancient type. For there they had in Solomon only a type of that which Christ is now
        in His own Person. And the Church is of two classes, whereof the one knoweth not how to sin, and the other
        sinneth no more. To wash away sin is the work of repentance, to eschew it that of wisdom.


        Lastly, the sign of the Prophet Jonas, as it was a figure of the Lord's sufferings, was also a witness to
        the gravity of those sins which the Jews committed. At the same time, we see in these words of the Lord a
        declaration at once of His power, and of His love; for, by turning our eyes on the Ninevites, He showeth
        us a way of escape, while He setteth before us the horror of what will otherwise be our punishment. Even
        the Jews need not cease to hope for pardon, if only they would repent.
    responsory:
      la: "R. Abscóndite eleemósynam in sinu páuperum, et ipsa orábit pro vobis ad Dóminum: * Quia sicut aqua extínguit ignem, ita eleemósyna extínguit peccátum.\nV. Date eleemósynam, et ecce ómnia munda sunt vobis.\nR. Quia sicut aqua extínguit ignem, ita eleemósyna extínguit peccátum."
      en: "R. Shut up alms in the breast of the poor, and it shall plead for you with the Lord. * For, as water will quench fire, so alms maketh an atonement for sins.\nV. Give alms, and, behold, all things are clean unto you.\nR. For, as water will quench fire, so alms maketh an atonement for sins."
    status: { la: verified, en: verified }
