# Nocturn 3, 18th Sunday after Pentecost. Sourced from Tempora/Pent18-0.txt.
# See post-pentecost-02.yml/post-pentecost-12.yml for sweep method note (no
# proper Nocturn 2 in the source). Lectio7 bare incipit (Matt 9:1-8, the
# healing of the paralytic) skipped; Lectio7-9's homily by St. Peter
# Chrysologus is one continuous work, combined.
id: post-pentecost-18
readings:
  - nocturn: 3
    isGospel: false
    source: "St. Peter Chrysologus, Archbishop of Ravenna, Sermon 50"
    text:
      la: >-
        Christum in humánis áctibus divína gessísse mystéria, et in rebus visibílibus invisibília
        exercuísse negótia, léctio hodiérna monstrávit. Ascéndit, inquit, in navículam, et transfretávit,
        et venit in civitátem suam. Nonne ipse est, qui, fugátis flúctibus, maris profúnda nudávit, ut
        Israëlíticus pópulus inter stupéntes undas sicco vestígio velut móntium cóncava pertransíret?
        Nonne hic est, qui Petri pédibus marínos vórtices inclinávit, ut iter líquidum humánis gréssibus
        sólidum præbéret obséquium.


        Et quid est, quod ipse sibi sic maris dénegat servitútem, ut brevíssimi lacus tránsitum sub
        mercéde náutica transfretáret? Ascéndit, inquit, in navículam, et transfretávit. Et quid mirum,
        fratres? Christus venit suscípere infirmitátes nostras, et suas nobis conférre virtútes; humána
        quǽrere, præstáre divína; accípere injúrias, réddere dignitátes; ferre tǽdia, reférre sanitátes:
        quia médicus, qui non fert infirmitátes, curáre nescit; et qui non fúerit cum infírmo infirmátus,
        infírmo non potest conférre sanitátem.


        Christus ergo, si in suis mansísset virtútibus, commúne cum homínibus nil habéret; et nisi
        implésset carnis órdinem, carnis in illo esset otiósa suscéptio. Ascéndit, inquit, in navículam,
        et transfretávit, et venit in civitátem suam. Creátor rerum orbis Dóminus, posteáquam se
        propter nos nostra angustávit in carne, cœpit habére humánam pátriam, cœpit civitátis Judáicæ
        esse civis, paréntes habére cœpit paréntum ómnium ipse parens; ut invitáret amor, attráheret
        cáritas, vincíret afféctio, suadéret humánitas, quos fúgerat dominátio, metus dispérserat, fécerat
        vis potestátis extórres.
      en: >-
        This day's reading hath shown us an instance of how Christ, in those things which He did as Man,
        worked deep works of God, and by things which were seen wrought things which were not seen. The
        Evangelist saith Jesus "entered into a ship, and passed over, and came into His Own city." Was
        not This He Who had once parted the waves hither and thither, and made the dry ground appear at
        the bottom of the sea, so that His people Israel passed dry-shod between masses of water
        standing still, as through an hollow glen in a mountain? Was not This He Who made the depths of
        the sea solid under the feet of Peter, so that the watery path offered a firm way for human
        footsteps?


        Therefore then denied He unto Himself a like service from the sea, but crossed over that narrow
        lake at the cost of a voyage on shipboard "He entered into a ship, and passed over." What wonder,
        my brethren: Christ came to take our weakness upon Him, that He might make us partakers of His
        strength to seek the things of men, that He might give to men the things of God to receive
        insults, that He might bestow honours to bear weariness, that He might grant rest for the
        physician that is himself beset by no frailties, knoweth not how to treat the frailties of
        others, nor he that is not weak with the weak, how to make the weak strong.


        Therefore, if Christ had abode still in His strength, He had in no wise been a fellow of men if
        in Him Flesh had not run the way of flesh, then had it been idle for Him to have taken Flesh at
        all. "He entered into a ship, and passed over, and came into His Own city." The Lord, the Maker
        of the world, and of all things that are therein, having been pleased for our sakes to prison
        Himself in our flesh, began to have an human home, and to be a citizen of a Jewish city Himself
        the Father of all, to have parents and all, that His love might invite, His charity draw, His
        tenderness bind, His gentleness persuade them whom His Kingship had scared, His awfulness
        scattered, and His power terrified out of His dominion.
    responsory:
      la: "Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.\nV. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.\nR. Plena est omnis terra glória ejus."
      en: "One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.\nV. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.\nR. The whole earth is full of His glory."
    status: { la: verified, en: verified }
