# Matins reading for Ss. Tiburtius and Susanna, Martyrs (Aug 11).
# Sourced directly from web/www/horas/Latin/Sancti/08-11.txt,
# English/Sancti/08-11.txt. Single simplex-feast lesson (Lectio93),
# one continuous account covering both martyrs, pooled into the
# nocturn: 2 slot per the established vigil/simplex convention (see
# vigil-of-st-lawrence.yml's own note).
id: ss-tiburtius-and-susanna
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Tiburtius, Chromátii præfecti Urbis fílius, sancti Sebastiáni ópera
        Christianus, cum ob eam causam ad Fabianum judicem adductus esset múltaque
        apud illum de Christi fide prædicáret, excandéscens judex paviméntum
        candéntibus carbónibus sterni jubet. Mox, Tiburti, inquit, vel diis nostris
        sacrífices oportet, vel per istos carbónes nudis pédibus tibi incedéndum
        est. At ille, crucis signo se muniens fidentérque ámbulans in pruna, Disce,
        inquit, ex hoc solum esse Deum, quem Christiáni colunt; prunæ enim mihi
        flores vidéntur. Quod cum magicis artibus tribuerétur, extra Urbem ductus
        Tiburtius, ac via Lavicana tertio ab Urbe lápide gládio percússus, ibi a
        Christiánis sepelítur. Quo die Susanna virgo nobilíssima, quod Galerii
        Maximiáni, fílii Diocletiáni imperatóris, conjúgium recusaret, ut quæ
        virginitátem Deo vóverat; post multa tormentórum genera, quibus varie
        tentátum est sanctum Vírginis propositum, domi suæ, jussu imperatóris,
        gládio percússa, ad duplex virginitátis et martyrii præmium migrávit in
        cælum.
      en: >-
        Tibutrius was son to Chromatius, Praefect of the city of Rome, and was
        converted to Christianity by holy Sebastian. On this account he was
        brought before Fabian the judge, and spake boldly in his presence many
        things concerning belief in Christ. Then Fabian broke out in anger and
        caused the pavement to be spread with live coals. Now, Tiburtius, said he,
        thou must either sacrifice to our gods, or walk barefoot on these coals.
        Tiburtius armed himself with the sign of the Cross and walked boldly on
        the coals. Learn from this, said he, that there is no God but He whom the
        Christians worship; for the coals are to me like flowers. For this he was
        credited with art magic, led forth without the city and smitten with the
        sword at the third milestone on the Lavican Road, where he was buried by
        the Christians. On the same day, the noble maiden Susanna, having refused
        the offer of marriage of Galerius Maximianus, son to the Emperor
        Diocletian, because she had made a vow of her virginity to God, after
        diverse torments wherewith her holy resolution was tried, was smitten
        with the sword, in her own house, by order of the Emperor, and passed to
        heaven to receive the double reward of virginity and martyrdom.
    status: { la: verified, en: verified }
