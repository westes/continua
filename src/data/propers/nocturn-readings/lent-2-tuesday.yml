# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad2-2.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Jerome
# excerpt split only to fill the fixed 3-lesson slot count). Responsory1
# is a cross-reference (@Tempora/Quad2-0:Responsory4).
id: lent-2-tuesday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Matt 23:1-12", en: "Matthew 23:1-12" }
    text:
      la: >-
        In illo témpore: Locútus est Jesus ad turbas et ad discípulos suos, dicens: Super cáthedram
        Móysi sedérunt scribæ et pharisǽi. Omnia ergo, quæcúmque díxerint vobis, serváte et fácite:
        secúndum ópera vero eórum nolíte fácere: dicunt enim, et non fáciunt. Alligant enim ónera
        grávia et importabília, et impónunt in húmeros hóminum: dígito autem suo nolunt ea movére.
        Omnia vero ópera sua fáciunt, ut videántur ab homínibus: dilátant enim phylactéria sua, et
        magníficant fímbrias. Amant autem primos recúbitus in cenis, et primas cáthedras in
        synagógis, et salutatiónes in foro, et vocári ab homínibus Rabbi. Vos autem nolíte vocári
        Rabbi: unus est enim Magíster vester, omnes autem vos fratres estis. Et patrem nolíte
        vocáre vobis super terram, unus est enim Pater vester, qui in cœlis est. Nec vocémini
        magístri: quia Magíster vester unus est, Christus. Qui major est vestrum, erit miníster
        vester. Qui autem se exaltáverit, humiliábitur: et qui se humiliáverit, exaltábitur.
      en: >-
        At that time, Jesus spoke to the crowds and to His disciples, saying, "The Scribes and the
        Pharisees have sat on the chair of Moses. All things, therefore, that they command you,
        observe and do. But do not act according to their works; for they talk but do nothing. And
        they bind together heavy and oppressive burdens, and lay them on men's shoulders; but not
        with one finger of their own do they choose to move them. In fact, all their works they do
        in order to be seen by men; for they widen their phylacteries, and enlarge their tassels,
        and love the first places at suppers and the front seats in the synagogues, and greetings in
        the market place, and to be called by men 'Rabbi.' But do not you be called 'Rabbi'; for one
        is your Master, and all you are brothers. And call no one on earth your father; for one is
        your Father, Who is in heaven. Neither be called masters; for one only is your Master, the
        Christ. He who is greatest among you shall be your servant. And whoever exalts himself shall
        be humbled, and whoever humbles himself shall be exalted."
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Jerome, Priest, Book 4, Commentary on Matthew, ch. 23"
    text:
      la: >-
        Quid mansuétius, quid benígnius Dómino? Tentátur a pharisǽis, confringúntur insídiæ eórum,
        et secúndum Psalmístam: Sagíttæ parvulórum factæ sunt plagæ eórum: et nihilóminus propter
        sacerdótii et nóminis dignitátem hortátur pópulos, ut subiciántur eis, non ópera, sed
        doctrínam considerántes. Quod autem ait, Super cáthedram Móysi sedérunt scribæ et pharisǽi:
        per cáthedram, doctrínam Legis osténdit. Ergo et illud quod dícitur in Psalmo: In cáthedra
        pestiléntiæ non sedit: et, Cáthedras vendéntium colúmbas evértit: doctrínam debémus
        accípere.


        Alligant enim ónera grávia et importabília, et impónunt in húmeros hóminum, dígito autem suo
        nolunt ea movére. Hoc generáliter advérsus omnes magístros, qui grávia jubent, et minóra non
        fáciunt. Notándum autem, quod et húmeri, et dígitus, et ónera, et víncula quibus alligántur
        ónera, spirituáliter intellegénda sunt. Omnia vero ópera sua fáciunt, ut videántur ab
        homínibus. Quicúmque ígitur ita facit quódlibet, ut videátur ab homínibus, scriba et
        pharisǽus est.


        Dilátant enim phylactéria sua, et magníficant fímbrias. Amant quoque primos recúbitus in
        cenis, et primas cáthedras in synagógis, et salutatiónes in foro, et vocári ab homínibus
        Rabbi. Væ nobis míseris, ad quos pharisæórum vítia transiérunt. Dóminus cum dedísset mandáta
        Legis per Móysen, ad extrémum íntulit: Ligábis ea in manu tua, et erunt immóta ante óculos
        tuos. Et est sensus: Præcépta mea sint in manu tua, ut ópere compleántur: sint ante óculos
        tuos, ut die ac nocte meditéris in eis. Hoc pharisǽi male interpretántes, scribébant in
        membránis decálogum Móysi, id est, decem verba Legis, complicántes ea et ligántes in
        fronte, et quasi corónam cápiti faciéntes: ut semper ante óculos moveréntur.
      en: >-
        Was there ever man gentler and kinder than the Lord? The Pharisees tempted Him; their craft
        was confounded, and, in the words of the Psalmist, "The arrows of babes have pierced them,"
        and nevertheless, because of the dignity of their priesthood and name, He exhorteth the
        people to be subject to them, by doing according to their words, though not according to
        their works. By the words "Moses' seat" we are to understand the teaching of the law. Thus
        also must we mystically take, "Sitteth in the seat of the scornful," and likewise,
        "overthrew the seats of them that sold doves," to describe doctrine.


        "How they bind heavy burdens, and grievous to be borne, and lay them on men's shoulders,
        but they themselves will not move them with one of their fingers." This is generally
        directed against all teachers who command things hard, and themselves do not even things
        easy. But it is to be remarked that the shoulders, the fingers, and the binding of the
        burdens, have a spiritual interpretation. "But all their works they do for to be seen of
        men." Whosoever therefore doth anything for to be seen of men, the same is, so far, a Scribe
        and a Pharisee.


        "They make broad their phylacteries, and enlarge the borders of their garments. And love the
        uppermost rooms at feasts, and the chief seats in the synagogues, and greetings in the
        markets, and to be called of men, Rabbi." Woe to us miserable sinners who have inherited the
        vices of the Pharisees! When the Lord had given the commandments of the law to Moses He
        added afterwards, "Thou shalt bind them for a sign upon thine hand, and they shall be as
        frontlets between thine eyes." The sense of these words is: My Law shall be in thine hand to
        order whatsoever thou doest, and ever before thine eyes that thou mayest meditate therein
        day and night. But the Pharisees, by a bad interpretation, were accustomed to write on
        pieces of parchment the Decalogue of Moses, that is, the Ten Words of the Law, and to tie
        these pieces of parchment, plaited in a peculiar manner, on their foreheads, so as to make a
        sort of crown round their heads, which projected in front of their eyes, and always moved
        before them.
    responsory:
      la: "R. Dum exíret Jacob de terra sua, vidit glóriam Dei, et ait: Quam terríbilis est locus iste! * Non est hic áliud, nisi domus Dei, et porta cæli.\nV. Vere Deus est in loco isto, et ego nesciébam.\nR. Non est hic áliud, nisi domus Dei, et porta cæli."
      en: "R. As Jacob went out from his own land, he saw the glory of God, and said: How dreadful is this place. * This is none other but the house of God and this is the gate of heaven.\nV. Surely God is in this place, and I knew it not.\nR. This is none other but the house of God and this is the gate of heaven."
    status: { la: verified, en: verified }
