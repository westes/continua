# Nocturn 3, 14th Sunday after Pentecost. Sourced from Tempora/Pent14-0.txt.
# See post-pentecost-02.yml/post-pentecost-12.yml for sweep method note (no
# proper Nocturn 2 in the source). Lectio7 bare incipit (Matt 6:24-33, "No
# man can serve two masters") skipped; Lectio8-9 one continuous homily by
# St. Augustine, combined.
id: post-pentecost-14
readings:
  - nocturn: 3
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Book 2 on the Lord's Sermon on the Mount, ch. 14"
    text:
      la: >-
        Nemo potest duóbus dóminis servíre. Ad hanc ipsam intentiónem referéndum est quod consequénter
        expónit, dicens: Aut enim unum ódio habébit, et álterum díliget; aut álterum patiétur, et álterum
        contémnet. Quæ verba diligénter consideránda sunt: nam, qui sint duo dómini, deínceps osténdit,
        cum dicit: Non potéstis Deo servíre, et mammónæ. Mammóna apud Hebrǽos divítiæ appellári dicúntur.
        Cóngruit et Púnicum nomen; nam lucrum Púnice mammon dícitur.


        Sed qui servit mammónæ, illi útique servit, qui rebus istis terrénis mérito suæ perversitátis
        præpósitus, magistrátus hujus sǽculi a Dómino dícitur. Aut enim unum ódio habébit homo, et
        álterum díliget, id est, Deum; aut álterum patiétur, et álterum contémnet. Patiétur enim durum et
        perniciósum dóminum, quisquis servit mammónæ; sua enim cupiditáte implicátus, súbditur diábolo,
        et non eum díligit. Quis enim est qui díligat diábolum? sed tamen pátitur.


        Ideo, inquit, dico vobis, non habére sollicitúdinem ánimæ vestræ quid edátis, neque córpori
        vestro quid induátis; ne forte, quamvis jam supérflua non quærántur, propter ipsa necessária cor
        duplicétur, et ad ipsa conquirénda, nostra detorqueátur inténtio, cum áliquid quasi
        misericórditer operámur: id est, ut cum consúlere alícui vidéri vólumus, nostrum emoluméntum ibi
        pótius, quam illíus utilitátem attendámus; et ídeo nobis non videámur peccáre, quia non
        supérflua, sed necessária sunt, quæ cónsequi vólumus.
      en: >-
        "No man can serve two masters," and this is further explained "for either he will hate the one,
        and love the other; or else he will hold to the one, and despise the other." These words we
        ought carefully to weigh, for the Lord showeth straightway who be the two masters whom we have
        choice of: "Ye cannot serve God and Mammon." Mammon is a term which the Hebrews are said to use
        for riches. It is also a Carthaginian word for the Punic for "gain" is "mammon."


        He which serveth mammon, serveth that evil one who hath perversely chosen to be lord of these
        earthly things, and is called by the Lord "the prince of this world" (John xiv. 30). Of these
        two masters, either a man will hate the one and love the other, that is God or he will hold to
        the one and despise the other. He which serveth mammon holdeth to an hard and destroying master,
        for he is led captive by his lust, and sold a slave to the devil, and him loveth no man is there
        any man that loveth the devil And yet there be that hold to him.


        "Therefore, I say unto you, Take no thought for your life, what ye shall eat, or what ye shall
        drink; nor yet for your body, what ye shall put on", lest, albeit such things are not idle, but
        needful to be sought after, yet the seeking for things even needful should divide the heart and
        our intention should be corrupted when we do something as it were mercifully that is, lest, when
        we would seem to be seeking another's good, it should be profit to ourselves, rather than
        benefit to him, that we seek and therefore we seem not to ourselves to sin, because we would
        seek things not idle, but needful.
    responsory:
      la: "Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.\nV. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.\nR. Plena est omnis terra glória ejus."
      en: "One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.\nV. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.\nR. The whole earth is full of His glory."
    status: { la: verified, en: verified }
