# Matins Nocturn 2 reading for St. Edward the Confessor, King (Oct 13).
# Sourced directly from web/www/horas/Latin/Sancti/10-13.txt,
# English/Sancti/10-13.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (his `[Rule]` is `vide
# C5`) -- defers to the Common's own Nocturn 3, not transcribed here.
id: st-edward-king
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Eduardus, cognomento Confessor, nepos sancti Eduardi Regis et
        Mártyris, Anglo-Sáxonum regum ultimus, quem futurum regem
        Brithualdo viro sanctíssimo in mentis excéssu Dóminus
        demonstrávit, decennis a Danis Angliam vastántibus quæsítus ad
        necem, exsulare cogitur apud avúnculum, Normanniæ ducem. Ubi in
        mediis vitiórum illécebris talem se exhibuit integritate vitæ
        morúmque innocéntia, ut ómnibus admiratióni esset. Eluxit in eo
        vel tum mira pietas in Deum ac res divinas, fuitque ingenio
        mitíssimo atque ab omni dominándi cupiditate alieno. Cujus ea
        vox fertur, Malle se regno carére, quod sine cæde et sánguine
        obtineri non possit.


        Exstinctis mox tyrannis, qui frátribus suis vitam et regnum
        eripúerant, revocátur in pátriam. Ubi, summis ómnium votis et
        gratulatióne, regno potítus, ad hostílium irárum delenda
        vestígia totum se convértit, a sacris exorsus ac Divórum
        templis, quorum alia a fundamentis eréxit, alia refécit
        auxitque redítibus ac privilegiis; in eam curam potíssimum
        intentus, ut refloresceret collapsa religio. Ab aulæ procéribus
        compulsum ad nuptias, constans est assertio scriptórum, cum
        vírgine sponsa virginitátem in matrimonio servasse. Tantus in
        eo fuit in Christum amor et fides, ut illum aliquándo inter
        Missárum solemnia vidére merúerit, blando vultu et divina luce
        fulgentem. Ob profusam caritátem, orphanórum et egenórum pater
        passim dicebátur, numquam lætior quam cum regios thesáuros
        exhausísset in páuperes.


        Prophetíæ dono illustris, de Angliæ futuro statu multa cælitus
        prævidit; et illud in primis memorábile, quod Sweyni Danórum
        regis, in mare demersi, mortem, dum Angliam invadéndi animo
        classem conscenderet, eodem quo accidit momento, divinitus
        intelléxit. Joánnem Evangelistam mirifice coluit, nihil
        cuiquam, quod ejus nómine peterétur, negare sólitus. Cui olim
        sub lácera veste suo nómine stipem roganti, cum nummi deéssent,
        detractum ex dígito ánulum porréxit; quem Divus non ita multo
        post Eduardo remisit, una cum núntio secuturæ mortis. Quare
        rex, indictis pro se precibus, ipso ab Evangelista prædicto
        die piíssime obiit, Nonis videlicet Januarii, anno salútis
        millesimo sexagesimo sexto, quem sequénti sæculo Alexander
        Papa tertius, miraculis clarum, Sanctórum fastis adscripsit.
      en: >-
        Edward, surnamed the Confessor, was the nephew of the holy King
        Edward the Martyr, and himself the last Anglo-Saxon King. That
        he should succeed to the Kingdom was shown by the Lord in a
        trance to a most holy man named Brithwald. When he was ten
        years old the Danes, who were ravaging England, sought him, to
        put him to death, and he was driven into exile to dwell with
        his mother's brother, Duke of Normandy, at whose Court he lived
        among all the allurements of vice a life of such uprightness
        and innocency as made all men to marvel. He was a burning and
        shining light for love of God and the things of God, very
        gentle-hearted, and quite free from any lust for power. Of him
        the saying is preserved, That he would liefer not be a King
        than win a kingdom through slaughter and blood.


        When the Danish tyrants, who had robbed his brothers Edmund and
        Alfred of life and kingdom, were passed away, Edward was called
        back into his own country and with the hearty good-will and
        rejoicing of all, took the kingdom, being then about forty
        years old. He set himself to repair the breaches which wars had
        made, and began with the things of God. Of the Churches of the
        Saints, he built some altogether, and renewed others and
        gifted them with incomes and privileges, being chiefly fain
        that religion should rise from the low estate whereinto it had
        fallen. He was brought by the nobles of his Court to marry, but
        it is constantly said by all writers that in matrimony he
        remained a virgin with a virgin bride. So great was his love
        toward Christ, and so strong his faith, that somewhiles when
        the Mass was in saying, he won to see Him, with countenance
        full of grace, and glory of God's light. By reason of the
        abundance of his charity he was styled everywhere the father of
        orphans and of the poor, and he was never happier than when he
        had spent upon the needy the whole of his kingly treasures.


        He was famous for the gift of prophecy, and foretold by
        inspiration from heaven many things that were to befall
        England. Of this gift the following is a remarkable instance.
        Sweyn, King of the Danes, was embarking on ship-board with the
        mind to invade England, when he fell into the sea and was
        drowned, and God made known his death to Edward at the very
        same moment that it happened. He had a wonderful love toward
        John the Evangelist, so that he was used never to refuse
        anything for the which he was asked in his name. The
        Evangelist appeared to him once while in tattered raiment,
        and, in his own name, asked him for an alms. It befell that the
        King had no money, wherefore he took a ring from off his finger
        and gifted him therewith. Not long afterward, the Evangelist
        sent the same ring back to him by a pilgrim, with a message
        concerning his death, which was then at hand. The King
        therefore commanded that prayers should be made for him, and
        then fell blessedly asleep in the Lord, upon the very day
        which had been foretold to him by the Evangelist, that is to
        say, upon the 5th day of January, in the year of salvation
        1066. He was famous for miracles, and in 1161 Pope Alexander
        III. numbered him among the Saints.
    status: { la: verified, en: verified }
