id: ss-cosmas-and-damian
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Cosmas et Damiánus, fratres Arabes, in Ægéa urbe nati, nóbiles médici, imperatóribus
        Diocletiáno et Maximiáno, non magis medicínæ sciéntia quam Christi virtúte, morbis
        étiam insanabílibus medebántur. Quorum religiónem cum Lysias præféctus cognovísset,
        addúci eos ad se jubet, ac de vivéndi institúto et de fídei professióne interrogátos,
        cum se et Christiános esse, et christiánam fidem esse ad salútem necessáriam, líbere
        prædicárent, deos venerári ímperat; et, si id recúsent, minátur cruciátus et necem
        acerbíssimam.


        Verum, ut se frustra hæc illis propónere intélligit: Colligáte, inquit, manus et
        pedes istórum, eósque exquisítis torquéte supplíciis. Quibus jussa exsequéntibus,
        nihilóminus Cosmas et Damiánus in senténtia persistébant. Quare, ut erant vincti, in
        profúndum mare jaciúntur. Unde cum salvi ac solúti essent egréssi, mágicis ártibus
        præféctus factum assígnans, in cárcerem tradit, ac postrídie edúctos in ardéntem
        rogum ínjici jubet; ubi, cum ab ipsis flamma refúgeret, várie et crudéliter tortos
        secúri pércuti vóluit. Itaque, in Jesu Christi confessióne, martýrii palmam
        accepérunt.
      en: >-
        Cosmas and Damian, who were eminent physicians in the time of the Emperors Diocletian
        and Maximian, were brothers, and Arabs by race, but born in the city of Aegae. Not more
        by their knowledge of medicine than by the power of Christ they healed diseases which
        had been hopeless for others. When the Praefect Lysias learnt to what faith they
        belonged, he commanded them to be brought before him, and questioned them as to their
        way of life, and the confession of their religion; and then, forasmuch as they freely
        owned themselves Christians and the Christian faith needful to salvation, he commanded
        them to worship the gods, under threats of torments and a most cruel death.


        He bond their hands and feet together, and put them to the sharpest of the question.
        And he was obeyed, but nevertheless Cosmas and Damian abode still of the same mind.
        Therefore they were cast into the depth of the sea, bound as they were, but they came
        forth again, whole and unbound. The Praefect, therefore, who would have it that it came
        to pass so by force of art magic, cast them into prison. On the morrow he haled them
        forth again, and bade cast them upon a great fire, but the flame turned away from them.
        He was pleased then to have them tormented in diverse and cruel sorts, and lastly,
        smitten with the axe. Thus did they bear witness for Christ Jesus even until they
        grasped the palm of their testimony.
    status: { la: verified, en: verified }
