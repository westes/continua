# Matins Nocturn 2 for "3rd Sunday of August" (Tempora/083-0.txt) — see
# month-week-081.yml's header for the id scheme. Responsory reuses 081's
# own Responsory4 (source's own cross-reference).
id: month-week-083
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, De Officiis, Book 1, ch. 28-29"
    text:
      la: >-
        Magnus justítiæ splendor, quæ áliis pótius nata quam sibi, communitátem et societátem nostram
        ádjuvat, excelsitátem tenet, ut suo judício ómnia subjécta hábeat, opem áliis ferat, pecúniam
        cónferat, offícia non ábnuat, perícula suscípiat aliéna. Quis non cúperet hanc virtútis arcem
        tenére, nisi prima avarítia infirmáret atque inflécteret tantæ virtútis vigórem? Etenim dum
        augére opes, aggregáre pecúnias, occupáre terras possessiónibus cúpimus, præstáre divítiis;
        justítiæ formam exúimus, beneficéntiam commúnem amíttimus.


        Quanta autem justítia sit, ex hoc intélligi potest, quod nec locis, nec persónis, nec
        tempóribus excípitur, quæ étiam hóstibus reservátur: ut si constitútus sit cum hoste aut locus
        aut dies prǽlio, advérsus justítiam putétur aut loco præveníre aut témpore. Interest enim utrum
        áliquis pugna áliqua et conflíctu gravi capiátur, an superióre grátia, vel áliquo evéntu. Si
        ergo in bello justítia valet, quanto magis in pace servánda est?


        Fundaméntum ergo est justítiæ fides. Justórum enim corda meditántur fidem: et qui se justus
        accúsat, justítiam supra fidem cóllocat. Nam tunc justítia ejus appáret, si vera fateátur.
        Dénique et Dóminus per Isaíam: Ecce, inquit, mitto lápidem in fundaméntum Sion: id est, Christum
        in fundaméntum Ecclésiæ. Fides enim ómnium Christus: Ecclésia autem quædam forma justítiæ est,
        commúne jus ómnium: in commúne orat, in commúne operátur, in commúne tentátur. Dénique qui
        seípsum sibi ábnegat, ipse justus, ipse dignus Christo est. Ideo et Paulus fundaméntum pósuit
        Christum, ut supra eum ópera justítiæ locarémus, quia fides fundaméntum est.
      en: >-
        Great is the glory of justice. She liveth for others rather than for herself. By her our
        commonwealth and fellowship are holpen. She holdeth such a pre-eminence that all things are
        subject unto her judgment. She helpeth others. She giveth wealth. She refuseth not to labour.
        She taketh upon her the dangers of others. Who would not desire to hold this castle of power
        and courage, if the covetousness of our first parents had not weakened and distorted the
        strength of our nerve? But so it is, that, while we are fain to increase wealth, to put by
        money, to add lands to our possessions, or to make show of our abundance, we put off the image
        of justice, and lose charity toward our brethren.


        How far-spreading is the field of justice appeareth by this, that there is excepted therefrom
        no place, person, or time — nay, she hath to do even as regards enemies, for if one be agreed
        with his enemy of a certain place, or day for battle, it should be deemed unjust to fall on him
        beforehand, at some other place, or time. For it is a very different thing, whether one get the
        better of another in a hard fight, or by skill, or by accident. If therefore in war justice
        hath place, how much more is she to be observed in time of peace?


        Honour is the foundation of justice. The thoughts in the hearts of just men are honourable
        thoughts, and when the just man accuseth himself, it is honour that bringeth him to that just
        deed. Then is his justice made manifest by his honourable avowal. The Lord saith by Isaiah,
        "Behold, I lay in Zion a foundation-stone" (28:16), that is to say, He giveth Christ unto the
        Church to be her foundation. Christ is the true honour for all men, and the Church is as it
        were a figure of justice, being a commonwealth wherein all have rights, and which worketh as
        one, and suffereth as one. Whosoever denieth himself, the same is just, and worthy of Christ.
        Therefore also Paul saith, "Other foundation can no man lay than that is laid, which is Jesus
        Christ" (1 Cor. 3:11), and upon that foundation is it, that every building of justice must be
        raised. For the spirit of Christ is the true spirit of honour, which is the foundation whereon
        justice resteth.
    responsory:
      la: "Da mihi, Dómine, sédium tuárum assistrícem sapiéntiam, et noli me reprobáre a púeris tuis: * Quóniam servus tuus sum ego, et fílius ancíllæ tuæ.\nV. Mitte illam de sede magnitúdinis tuæ, ut mecum sit et mecum labóret.\nR. Quóniam servus tuus sum ego, et fílius ancíllæ tuæ."
      en: "Give me wisdom, O Lord, that sitteth by thy throne, and reject me not from among thy children. * For I am thy servant and son of thine handmaid.\nV. O send her out from the throne of thy glory, to be with me and to labour with me.\nR. For I am thy servant and son of thine handmaid."
    status: { la: verified, en: verified }
