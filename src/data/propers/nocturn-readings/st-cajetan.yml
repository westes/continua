# Matins Nocturn 2 reading for St. Cajetan, Confessor (Aug 7). Sourced
# directly from web/www/horas/Latin/Sancti/08-07.txt, English/Sancti/
# 08-07.txt. Lectio4-6 combined into one continuous vita, same combining
# convention st-titus.yml/st-alphonsus-liguori.yml use. Lectio7-8 (Gospel
# Matt 6:24-33 + Homily of St. Augustine) are a plain @Commune/Pent14-0
# festal-Gospel cross-reference shared with the temporal cycle, not a
# proper Gospel of Cajetan's own -- not transcribed here, same treatment
# as st-titus.yml's own Nocturn 3. (The source's own Lectio94, a shorter
# 1-lesson variant of the same biography, is an alternate not used here.)
id: st-cajetan
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Cajetanus, nobili Thienæa gente Vicéntiæ ortus, statim a matre Deiparæ Virgini oblátus
        est. Mira a téneris annis morum innocéntia in eo eluxit, adeo ut Sanctus ab ómnibus
        nuncuparétur. Juris utriusque lauream Patavii adeptus, Romam profectus est; ubi, inter
        prælatos a Julio secundo collocatus, et sacerdotio initiatus, tanto divini amoris æstu
        succénsus est, ut relícta aula se totum Deo mancipaverit. Nosocomiis proprio ære
        fundatis, étiam morbo pestilénti laborántibus, suis ipse mánibus inserviébat.
        Proximórum salúti assidua cura incumbebat, dictus proptérea Venator animarum.


        Collapsam ecclesiasticórum disciplínam ad formam apostolicæ vitæ instaurare desiderans,
        ordinem Clericórum regulárium instituit, qui, abdicáta rerum ómnium terrenárum
        sollicitúdine, nec réditus possiderent nec vitæ subsidia a fidelibus péterent, sed solis
        eleemosynis sponte oblátis víverent. Itaque, approbante Cleménte septimo, ad aram
        maximam basilicæ Vaticanæ una cum Joánne Petro Caráfa, episcopo Theatino, qui póstea
        Paulus quartus Pontifex maximus fuit, et aliis duobus exímiæ pietátis viris, vota
        solemnia emisit. In Urbis direptióne a milítibus crudelíssime vexátus ut pecúniam
        próderet, quam dudum in cælestes thesáuros manus páuperum deportaverant, verbera,
        torménta et carceres invicta patiéntia sustinuit. In suscepto vitæ instituto
        constantíssime perseverávit, soli divinæ providéntiæ inhærens, quam sibi numquam
        defuísse aliquándo miracula comprobarunt.


        Divini cultus studium, nitórem domus Dei, sacrórum rituum observantiam et sanctíssimæ
        Eucharistiæ frequentiórem usum maxime promovit. Hæresum monstra et látebras non semel
        detéxit ac profligávit. Oratiónem ad octo passim horas jugibus lácrimis protrahebat:
        sæpe in éxtasim raptus ac prophetíæ dono illustris Romæ, nocte natalícia, ad præsepe
        Dómini infántem Jesum accípere meruit a Deípara in ulnas suas. Corpus íntegras noctes
        intérdum verberatiónibus affligebat; nec umquam adduci pótuit ut vitæ asperitátem
        emolliret, testátus in cínere velle se mori. Dénique, ex animi dolóre concepto morbo,
        quod offéndi plebis seditióne Deum vidéret, cælésti visióne recreatus, Neapoli migrávit
        in cælum; ibique corpus ejus in ecclésia sancti Pauli magna religióne cólitur. Quem,
        multis miraculis in vita et post mortem gloriosum, Clemens décimus, Pontifex maximus,
        Sanctórum número adscripsit.
      en: >-
        Cajetan was born at Vicenza, in the year 1480, of the noble family of the lords of
        Tiene, and was forthwith dedicated by his mother to the Virgin Mother of God. From his
        childhood such wonderful innocence shone in him that all called him the Saint. He took
        the degree of Doctor in Civil and Canon Law at Padua, and afterwards went to Rome,
        where Julius II gave him a place among the Prelates. Having taken Priest's Orders, he
        became so full of the fire of the love of God, that he left the Court, that he might be
        free to work entirely for God. He founded hospitals at his own expense, and nursed the
        sick, even such as were suffering from the plague, with his own hands. He laboured with
        such constant earnestness for the salvation of his neighbours that he got the name of
        the Hunter of souls.


        From a desire to restore the corrupted discipline of the clergy to the mould of the
        Apostolic life, he founded, in 1524, a Congregation of Clerks Regular, who should give
        up all care of earthly things, neither keeping any income, nor begging the needful
        things of life from the faithful, but living only on such alms as might be given them
        unasked. For this end, and with the approval of Clement VII, Cajetan himself, together
        with John Peter Carafa, Archbishop of Chieti (afterwards Pope Paul IV), and two other
        men of eminent godliness, took solemn vows at the High Altar of St. Peter's Church on
        the Vatican. When the city of Rome was sacked by the troops of the Constable de Bourbon
        in 1527, Cajetan was most cruelly ill-used to make him reveal his wealth, which had long
        before been laid up for him in heaven by the hands of the poor, and he endured with
        unconquered patience stripes, torture, and imprisonment. He held on bravely in the way
        of life he had taken up, trusting altogether to the Providence of God, Whose unfailing
        care of him was sometimes attested by miracles.


        He was a great advancer of care in the worship of God, of splendour in the house of
        God, of exactness in the holy ceremonies, and of the often receiving of the most holy
        Eucharist. The hideous forms and dark convolutions of heresy he more than once unmasked
        and abolished. He would remain in prayer with abundance of tears as much as eight hours
        at a time. He was often thrown into trances, and was celebrated for the gift of
        prophecy. One Christmas night at Rome, when he was praying before the Lord's manger, he
        was deemed worthy that the Mother of God should lay the Child Jesus in his arms. He
        sometimes spent the whole night in whipping himself, nor could he ever be persuaded to
        soften the hardness of his life, but witnessed that he was fain to die in sackcloth and
        ashes. In the end he fell ill with grief at the offence against God, which the people of
        Naples committed by rebelling against the establishment of the Inquisition. Refreshed by
        a vision from heaven, he departed thither on the 7th day of August, 1547. His body lieth
        at Naples in the Church of St. Paul, where it is held in great reverence. Pope Clement X,
        finding him to have been illustrious for miracles, both during his life and after his
        death, enrolled his name among those of the Saints.
    status: { la: verified, en: verified }
