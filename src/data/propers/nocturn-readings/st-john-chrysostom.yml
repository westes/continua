# Matins Nocturn 2 reading for St. John Chrysostom, Bishop, Confessor,
# Doctor (Jan 27) — SanctiM/01-27.txt inherits the whole day
# (`@Sancti/01-27`) with no Nocturn 2/3 override, so this saint's own
# vita is sourced from the Tridentine track exactly as for a pre-1955
# saint (see memory vu-matins-pre1955-saints).
# web/www/horas/Latin/Sancti/01-27.txt, English/Sancti/01-27.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. Lectio7-9 fall back to Common of a Doctor
# (`Commune/C4a`), not proper text, so not authored here. No responsory
# given in the source.
id: st-john-chrysostom
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánnes Antiochénus, propter áureum eloquéntiæ flumen cognoménto Chrysóstomus, a
        forensibus et sæcularibus stúdiis ad divinas litteras summa cum ingenii et industriæ
        laude se cóntulit. Itaque sacris initiátus ac presbyter Antiochenæ ecclésiæ factus,
        mortuo Nectario, Arcadii imperatóris opera, invitus Constantinopolitanæ ecclésiæ
        præfícitur. Quo suscepto pastorali munere, depravatos mores, et nobiliórum hóminum
        vivéndi licéntiam vehementius objurgare cœpit: qua ex libertáte magnam multórum subiit
        invidiam. Apud Eudoxiam etiam, quod eam propter Callítropæ víduæ pecúniam, et alterius
        víduæ agrum reprehendísset, gráviter offendit.


        Quare aliquot episcopórum acto Chalcédone convéntu, quo ipse vocátus ire nóluit, quod nec
        legítimum concílium nec publicum esse diceret, niténte in primis ipsa contra Chrysóstomum
        Eudoxia, ejícitur in exsílium: sed paulo post propter ejus desidérium seditióne pópuli
        facta, admirábili civitátis plausu ab exsílio revocátur. Verum cum pérditos mores
        increpare non desísteret, et ad argenteam Eudoxiæ státuam in foro sanctæ Sophíæ ludos
        fíeri prohibéret; conspiratióne inimicórum episcopórum íterum exsulare cógitur, viduis et
        egéntibus ómnibus communis parentis ejectiónem lugéntibus. In exsílio Chrysóstomus
        incredibile est et quanta mala perpéssus sit, et quam multos ad Jesu Christi fidem
        convérterit.


        Verum dum, concílio Romæ hábito, decreto Innocentii primi Pontificis restitúitur, a
        milítibus, qui eum custodiébant, miris in itinere malis et calamitátibus affícitur.
        Cumque per Armeniam ducerétur, sanctus Basiliscus Martyr, in cujus templo antea oraverat,
        noctu sic eum affátus est: Joánnes frater, crástinus dies nos loco conjunget. Quare
        postridie sumpto Eucharistiæ sacraménto seque crucis signo muniens, ánimam Deo réddidit,
        décimo octavo Kalendas Octobris. Quo mortuo, horribilis grando Constantinópoli cécidit,
        et quatríduo Augusta cessit e vita. Ejus corpus insígni pompa et hóminum multitúdine
        celebrátum, Theodosius Arcadii fílius Constantinópolim portándum, et honorifice
        sepeliéndum curávit sexto Kalendas Februarii: cujus étiam relíquias veneratus, paréntum
        suórum véniam pétiit: quod deínde Romam translátum in basilica Vaticana cónditum est.
        Multitúdinem, pietátem, ac splendórem conciónum ceterorúmque ejus scriptórum,
        interpretándi étiam ratiónem, et inhærentem senténtiæ sacrórum librórum explanatiónem
        omnes admirántur; dignumque existimant, cui Paulus Apóstolus, quem ille mirifice coluit,
        scribénti et prædicanti multa dictasse videátur. Hunc vero præclaríssimum univérsæ
        Ecclésiæ Doctórem Pius décimus Pontifex maximus cælestem oratórum sacrórum patronum
        declarávit atque constítuit.
      en: >-
        John of Antioch, who, on account of the golden stream of his eloquence, is called by the
        Greeks Chrysostomos, or, the golden-mouthed, was a lawyer and man of the world of much
        eminence, before he turned his great intellect and wonderful industry to the study of
        things sacred. He took orders, and was ordained a priest of the Church of Antioch, and
        after the death of Nectarius, was forced by the Emperor Arcadius to accept, though sorely
        against his own will, the Archbishopric of Constantinople. Having received the burden of a
        shepherd's office, he set himself zealously to do his duty, struggling against the
        degradation of public morality and the loose lives of the nobility, and thereby drew upon
        himself the ill-will of many enemies, especially the Empress Eudoxia, whom he had rebuked
        on account of the money of the widow Callitropa, and the land of another widow.


        Some Bishops being assembled in a Council at Chalcedon, which Council the Saint held to be
        neither lawful, nor public, although he was commanded to go there, he refused. Whereupon
        Eudoxia, striving earnestly against him, caused him to be sent into exile. Soon after,
        however, the people of the city rose, and demanded his recall, and he was then brought back
        again amid great public rejoicings. Nevertheless he ceased not to war against vice, and
        absolutely forbade the celebration of public games round the silver statue of Eudoxia in
        the square outside the Church of the Eternal Wisdom. Upon this, a party of Bishops, who
        were enemies to him, banded together, and obtained that he should be banished again, which
        was done accordingly, amid the lamentations of widows and the poor, who felt as if they
        were being deprived of a common father. During this exile, it almost passeth belief how
        much Chrysostom suffered, and how many souls he turned to the faith which is in Christ
        Jesus.


        At this time a Council was assembled at Rome, wherein Chrysostom's restoration to his See
        was decreed by Pope Innocent I., but meanwhile, he was suffering great hardships and
        cruelties on his journey at the hands of the soldiers who had him in charge. As he passed
        through Armenia he prayed in the Church of the holy martyr Basiliscus, and the same night
        that blessed conqueror appeared to him in a vision and said Brother John, to-morrow thou
        shalt be with me. On the next day, therefore, he received the Sacrament of the Eucharist,
        and, arming himself with the sign of the cross, resigned his soul to God. As soon as he was
        dead a furious hailstorm took place at Constantinople, and after four days the Empress
        died. The Emperor Theodosius, the son of Arcadius, brought the body of John Chrysostom to
        Constantinople with great state, and numerously attended, and on the 27th of January, laid
        it with magnificent honours in the grave, beside which he prayed for the forgiveness of his
        own father and mother. The holy body was afterwards taken to Rome, and is now buried in the
        Vatican Basilica. The number, devoutness, and brilliance of St. John Chrysostom's sermons
        and other writings, his acuteness in exposition, and the close aptness of his explanations
        of Holy Scripture, have been and are the object of universal wonder and admiration, and
        often seem not unworthy to have been dictated to him by the Apostle Paul, for whom he
        entertained a wonderful devotion.
    status: { la: verified, en: verified }
