# Matins Nocturn 2 reading for St. Canute, King and Martyr (Jan 19).
# Sourced from web/www/horas/Latin/Sancti/01-19o.txt (Lectio4-6, combined
# into one continuous vita, same combining convention st-titus.yml/
# st-rose-of-lima.yml use). The reference engine's own English/Sancti/
# 01-19o.txt carries only the [Officium] name and [Oratio] -- no English
# translation of the vita at all -- so the English text below is this
# project's own translation of the Latin, not carried over from the
# source; marked `draft` accordingly (status.en), matching the "prefer
# real translated text over a missing placeholder" convention. Latin is
# the source's own verified text. No Lectio7-9 of his own -- the source
# points those at a Common (see st-canute.yml's header on the C2-1/C2a-1
# discrepancy), not transcribed here.
id: st-canute
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Canutus quartus, Suenónis Esthrítii Danórum regis fílius, fide, pietáte et morum
        honestáte conspícuus, exímiæ sanctitátis a téneris annis specimen dedit. Patérnum
        sceptrum summa ómnium acclamatióne adéptus, religióni promovéndæ sédulo incúmbere,
        ecclésias redítibus augére, et pretiósa suppelléctili ornáre coepit. Tum zelo
        propagándæ fídei succénsus, bárbara regna justo certámine aggréssus, devíctas
        subditásque natiónes christiánæ legi subjugávit. Victóriis autem plúrimis gloriósus,
        et divítiis auctus, regale diadéma ad Christi crucifíxi pedes abjécit, se et regnum
        illi subjíciens, qui Rex regum est, et Dóminus dominántium. Corpus suum jejúniis,
        cilíciis et flagéllis castigávit. In oratióne et contemplatióne assíduus, erga
        páuperes profúsus, erga omnes benéficus semper fuit: nec umquam a justítiæ
        divinǽque legis sémita deflexit.


        His aliísque virtútibus imbútus, ad suprémum perfectiónis apicem sanctus rex
        properábat. Accidit autem ut Angliæ regnum a Wilhélmo Normandórum duce,
        formidábili exércitu invaderétur. Anglis vero, Danórum opem implorántibus, cum
        succúrrere rex decrevísset, belli expeditiónem Oláo fratri commísit. Qui regnándi
        cupiditáte illéctus, arma vertit in regis perniciém, mílitibus et pópulo contra
        illum concitátis. Nec defuérunt rebellióni fómenta. Cum enim rex, edítis légibus,
        décimas ecclésiis solvi, Dei et Ecclésiæ præcépta servári, transgressóres puníri
        sanxísset, plérique perversi ac scelaráti hómines exacerbáti, primum quidem
        tumultuári, tum plebem commovére, ac tandem sanctíssimo regi necem molíri coepérunt.


        Sciens ígitur rex, futurórum præscius, mortem sibi propter justítiam imminére; ea
        prænuntiáta, ad ecclésiam sancti Albáni Mártyris Othóniæ, tamquam ad locum
        certáminis, proféctus est: et sacraméntis munítus, agónem suum Dómino
        commendábat. Mox ibi advéniens conjurátorum multitúdo, ecclésiæ ignem admovére,
        fores confríngere et in eam irrúmpere tentárunt. Quod cum perfícere non possent, ad
        fenéstras accedéntes, saxa et sagíttas in sanctum regem, fléxis génibus pro
        inimícis orántem, magno ímpetu jaculári non cessábant: donec lápidum et telórum
        íctibus, ac tandem lancea confóssus, gloriósa martýrio, ante altáre exténsis
        bráchiis procúmbens, coronátus est, sedénte in apostólico throno Gregório séptimo.
        Multis póstea miráculis Mártyrem suum illustrávit Deus. Nam gravi penúria et
        divérsis calamitátibus opprésssa Dánia, patráti sacrilégii pœnas luit. Plures étiam
        váriis languóribus afflícti, ad ejus túmulum remédium et incolumitátem consecúti
        sunt. Cumque regína sacrum ejus corpus noctu clam surrípere, et álio transférre
        conarétur, emísso cǽlitus ingénti splendóre perterríta, a propósito cessávit.
      en: >-
        Canute IV, son of Svend Estridsen, King of the Danes, was conspicuous from his
        tender years for faith, piety, and integrity of character, giving a token of
        exceptional holiness. Having obtained his father's sceptre by the acclamation of
        all, he began zealously to devote himself to the advancement of religion, to enrich
        the churches with revenues, and to adorn them with precious furnishings. Then,
        fired with zeal for spreading the faith, he attacked barbarous kingdoms in a just
        war, and brought the conquered and subjected nations under the Christian law.
        Glorious with many victories, and enriched with wealth, he cast down his royal
        diadem at the feet of Christ crucified, subjecting himself and his kingdom to Him
        who is King of kings and Lord of lords. He chastised his body with fasts,
        hairshirts, and scourges. Assiduous in prayer and contemplation, generous to the
        poor, and ever beneficent to all, he never once strayed from the path of justice
        and the divine law.


        Endowed with these and other virtues, the holy king hastened toward the highest
        peak of perfection. Now it happened that the kingdom of England was invaded by
        William, Duke of the Normans, with a formidable army. When the English begged the
        aid of the Danes, and the king had resolved to come to their help, he entrusted the
        expedition to his brother Olaf. But Olaf, enticed by the desire to reign, turned his
        arms to the king's destruction, stirring up the soldiers and the people against
        him. Nor were fuels for rebellion lacking. For when the king had decreed by law that
        tithes should be paid to the churches, that the precepts of God and the Church
        should be kept, and that transgressors should be punished, many perverse and wicked
        men, exasperated by this, first began to riot, then to stir up the common people,
        and at last set about plotting the death of the most holy king.


        The king, therefore, knowing beforehand that death threatened him for the sake of
        justice, and having foretold it, set out for the church of St. Alban the Martyr at
        Odense, as to the place of his combat; and fortified with the sacraments, he
        commended his final struggle to the Lord. Soon a multitude of the conspirators
        arrived there, and attempted to set fire to the church, to break down its doors,
        and to burst into it. When they could not succeed in this, they came up to the
        windows, and did not cease to hurl stones and arrows with great force at the holy
        king, who knelt praying for his enemies, until, pierced by the blows of stones and
        darts, and at last transfixed by a spear, he sank forward before the altar with
        arms outstretched, and was crowned with glorious martyrdom, while Gregory VII sat
        upon the apostolic throne. Afterward God glorified His martyr with many miracles.
        For Denmark, oppressed by grievous want and various calamities, paid the penalty
        for the sacrilege committed. Many also, afflicted with various infirmities,
        obtained healing and health at his tomb. And when the queen attempted secretly by
        night to steal away his sacred body and transfer it elsewhere, she was terrified by
        a great splendor sent from heaven, and desisted from her purpose.
    status: { la: verified, en: draft }
