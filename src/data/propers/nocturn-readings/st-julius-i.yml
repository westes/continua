# Matins Nocturn 2 reading for St. Julius I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/04-12-JuliusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-julius-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Julius Románus Rustici fílius, post beátum Marcum ad summum pontificátum evéctus, vitæ
        sanctitáte et stúdio asseréndæ fídei christiánæ insigniter elúxit. Grassabatur per Oriéntem
        arianæ hærésis impietas, multíque sanctíssimi epíscopi e suis sedibus exsuláre cogebantur,
        quos ille, præsértim sanctum Athanasium, humaníssime excépit, et constantíssime contra
        adversários deféndit. Tyriam et Antiochenam synodum, ut Nicænam abolerent fidem, ab Ariánis
        coactam condemnávit, et Romæ duo concilia convocavit, in quibus exsulum episcopórum querelas
        excépit, et innocéntiam declarávit.


        Constánti Augusto religiosissimo principi, per Occidentem imperanti, auctor fuit, ut
        Constantium fratrem Arianarum fautorem, in Oriénte regnantem, précibus et minis ad
        revocandum ab exsílio Athanasium permoveret. Dolósam fídei formulam ab Eusebianis, Aríi
        sectatoribus, in secúnda synodo Antiochena conceptam rejécit, et magnum Sardicense concílium
        ex Occidentis et Oriéntis epíscopis indíxit, missisque legátis, multa ibídem pro fide
        cathólica et disciplína ecclesiástica restituenda utiliter constítuit.


        Præter hæc, basílicas duas in Urbe exstrúxit, sacrisque picturis exornávit, unam juxta Forum
        Románum, álteram in via Flaminia. Tria ædificávit cœmeteria, unum in eádem via Flaminia,
        álterum in via Aurélia, tértium in Portuensi. Constítuit ne sacérdos álibi quam apud júdicem
        ecclesiasticum causam díceret, jussitque ut ómnia ad rem ecclesiásticam spectantia per
        protonotarium conficerentur instrumenta. Tribus ordinationibus mense Decémbri creávit
        diáconos tres, presbyteros decem et octo, epíscopos novem. Postquam Dei Ecclésiam
        sanctíssime rexísset annis quíndecim, ménsibus quinque, diébus septémdecim, prídie Idus
        Aprílis felíciter migrávit ad Dóminum, sepúltus in cœmetério Calepódii. Inde translatæ
        relíquiæ ad ecclésiam sanctæ Maríæ trans Tíberim ab ipso amplificatam, sub altári majóri
        honorífice reconditæ sunt.
      en: >-
        Julius, a Roman, the son of Rusticus, raised to the supreme pontificate after blessed Mark,
        shone remarkably by holiness of life and zeal for upholding the Christian faith. The impiety
        of the Arian heresy was raging through the East, and very many most holy bishops were being
        forced into exile from their sees; these, especially holy Athanasius, he received most
        humanely and defended most constantly against their adversaries. He condemned the Synod of
        Tyre and of Antioch, assembled by the Arians to abolish the Nicene faith, and convened two
        councils at Rome, in which he heard the complaints of the exiled bishops and declared their
        innocence.


        He was the author who induced Constans Augustus, a most religious prince reigning in the
        West, to move by prayers and threats Constantius his brother, a patron of the Arians,
        reigning in the East, to recall Athanasius from exile. He rejected the deceitful formula of
        faith composed by the Eusebians, followers of Arius, in the second Synod of Antioch, and
        convoked the great Council of Sardica of bishops of the West and the East, and, having sent
        legates, there decreed usefully many things for the Catholic faith and for the restoration
        of ecclesiastical discipline.


        Besides these things he built two basilicas in the City, and adorned them with sacred
        paintings, one near the Roman Forum, the other on the Flaminian Way. He built three
        cemeteries, one on the same Flaminian Way, another on the Aurelian Way, the third on the
        Portuensian. He ordained that a priest should plead his cause nowhere but before an
        ecclesiastical judge, and commanded that all documents pertaining to ecclesiastical affairs
        be drawn up through a protonotary. In three ordinations in the month of December he created
        three deacons, eighteen priests, and nine bishops. When he had most holily ruled the Church
        of God fifteen years, five months, and seventeen days, on the day before the Ides of April
        he happily departed to the Lord, and was buried in the cemetery of Calepodius. Thence his
        relics were translated and honourably laid under the high altar of the church of St. Mary
        across the Tiber, which he himself had enlarged.
    status: { la: verified, en: draft }
