# Matins Nocturn 2 reading for St. Anne, Mother of the B.V.M. (Jul 26)
# — SanctiM/07-26.txt's own Lectio5-8 resolve back to
# `@Sancti/07-26:LectioN` (resliced), so this saint's own proper
# content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints). A second SanctiM variant
# (`SanctiM/07-26r.txt`) is its own file for the joint "Ss. Joachim
# and Anne" feast — not needed since the plain suffix already matches
# our target saint.
# web/www/horas/Latin/Sancti/07-26.txt, English/Sancti/07-26.txt.
# Lectio4-6 (St. John of Damascus's sermon) combined into one reading,
# one continuous excerpt. No responsory given in the source.
id: st-anne
readings:
  - nocturn: 2
    isGospel: false
    source: "St. John of Damascus, Sermon 2 on the Nativity of the B.V.M."
    text:
      la: >-
        Propónitur nobis Annæ thálamus, conjugális vitæ simul et virginitátis formam réferens,
        illam matris, hanc fíliæ: quarum áltera recens sterilitáte liberáta est, áltera autem
        aliquánto post, Christi partum, ad nostræ natúræ conditiónem divíno opifício formátum,
        supra natúram est editúra. Mérito ígitur Anna, divíno Spíritu plena, læto hilaríque
        ánimo pérsonat: Congaudéte mecum, quæ promissiónis germen ex stérili ventre péperi, ac
        benedictiónis fructum ubéribus meis, ut optáveram, nútrio. Sterilitátis mæstítiam,
        éxui, ac lætum fecunditátis vestem índui. Congáudeat mecum hódie Anna illa, Phenénnæ
        adversária, et novum hoc atque inopinátum miráculum, quod in me gestum est, suo
        exémplo concélebret.


        Exsúltet Sara, seníli gáudio géstiens, meúmque ab sterilitáte concéptum præfigúrans.
        Cóncinant simul stériles et infecúndæ visitatiónem meam, admirábili modo cǽlitus
        factam. Dicant item matres omnes hac fecunditáte prǽditæ: Benedíctus, qui orántibus id
        quod optábant, largítus est, et fecunditátem stérili dedit, ac felicíssimum illud
        germen Vírginis concéssit, quæ Mater Dei secúndum carnem fuit, cujus venter cælum est,
        in qua habitávit is qui nullo loco capi potest. Cónsonam his nos quoque ipsi, quæ
        vocabátur sterilis nunc autem virgínei thálami mater éxstitit, laudem offerámus.
        Dicámus ad eam cum Scriptúra: Quam beáta domus David, ex qua prodiísti, et venter, in
        quo Deus sanctificatiónis arcam, hoc est, eam a qua ipse sine semine concéptus est,
        fabricávit.


        Vere beáta es, ac ter beáta, quæ beatitúdine donátam a Deo infántem, hoc est,
        Maríam, nómine quoque ipso magnópere venerándam, peperísti; ex qua Christus vitæ flos
        éxstitit, cujus Vírginis et gloriósus fuit ortus, et partus mundo sublímior. Nos quoque,
        o beatíssima fémina, tibi gratulámur; étenim nostrum ómnium spem divínitus concéssam,
        hoc est, promissiónis fœtum peperísti. Beáta revéra es, et beátus fructus ventris tui.
        Piórum autem lingua germen tuum magníficat, ac sermo omnis lætus partum tuum
        prǽdicat. Dignum sane quidem, ac máxime dignum est eam laudáre, quæ divína benignitáte
        oráculum accépit, ac talem et tantum nobis fructum édidit, ex quo dulcis Jesus pródiit.
      en: >-
        The home of Anne is set before us, wherein to see an example both of married and of
        maiden life, the one in the person of the mother, the other in that of the daughter,
        whereof the one hath but now ceased to be barren, and the other is in a little while
        destined, beyond the course of nature, to become the Mother of the Messiah by a singular
        birth, specially designed by God to build up anew our nature. It is with reason then
        that Anne, filled with the Holy Ghost, with joyful and jubilant spirit singeth aloud:
        Rejoice with me, for out of my barren womb I have borne the bud of promise, and, as I
        have longed, I nourish at my breasts the fruit of benediction. I have laid aside the
        mournful garments of barrenness, and put on the joyful raiment of fruitfulness. Let
        Hannah the adversary of Peninnah make merry with me, and join with me for fellow-feeling,
        in singing of this new and unhoped-for wonder that is wrought in me.


        Let Sarah be glad that was joyfully pregnant in her old age, and was a shadow cast
        before of my conception that hitherto have been barren. Let all the barren and fruitless
        break forth into singing, when they behold in what wondrous wise I have been visited
        from heaven. Let all mothers likewise, that like Anne are gifted with fruitfulness, say:
        Blessed be He That gave their desire unto them that besought Him, That gave fruitfulness
        unto her that was barren, and That granted unto her that from her should bud forth the
        joy-bringing Virgin, who, according to the flesh, was Mother of God, and whose womb was a
        heaven wherein He dwelt Whom no place can contain. Let us also with them offer our
        praises to her that was called barren, but now is become the mother of a maidchild; let
        us say unto her in the words of the Scripture: O how blessed is the house of David from
        whence thou art sprung, and that womb wherein God hath fashioned the ark of His holiness,
        that is, her, by whom He was Himself conceived without man's seed.


        Blessed art thou, and thrice blessed, whom God hath so blessed as to make thee to bring
        forth, as His own gift, the babe Mary, whose very name is highly honourable, out of whom
        Christ, the Flower of life, blossomed, a maiden whose rising is glorious, and whose
        delivery is worth more than the world. We also, O woman most blessed, do wish thee joy.
        In sooth thou hast brought forth what we have all hoped for, and God hath given us,
        namely, the babe of promise. Blessed indeed art thou, and blessed is the fruit of thy
        womb. The tongues of all the godly do magnify thine offspring, and every glad word is
        spoken concerning her of whom thou art delivered. Meet in truth is it, and most meet to
        praise her who received a revelation from the goodness of God, and bore for us such and
        so great a fruit, from whom sweet Jesus sprang.
    status: { la: verified, en: verified }
