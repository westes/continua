# Matins reading for Ss. Protus and Hyacinth, Martyrs (Sep 11).
# Sourced directly from web/www/horas/Latin/Sancti/09-11.txt,
# English/Sancti/09-11.txt. Single simplex-feast lesson (Lectio93),
# one continuous account covering both martyrs, pooled into the
# nocturn: 2 slot per the established vigil/simplex convention (see
# vigil-of-st-lawrence.yml's own note).
id: ss-protus-and-hyacinth
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Protus et Hyacinthus fratres, beátæ Eugeniæ Vírginis eunuchi, una
        cum illa ab Héleno episcopo baptizati, ac stúdiis déditi
        divinárum litterárum, aliquámdiu in Ægypto inter ascetas mira
        humilitate et vitæ sanctitáte vixérunt. Sed póstea, sanctam
        Vírginem Eugeniam Romam prosecuti, Gallieno imperatóre, in Urbe
        propter christianæ fidei professiónem comprehénsi sunt. A quibus
        cum nullo modo impetrari posset ut, christianam religiónem
        deseréntes, deos cólerent, acerbis verbéribus cæsi, secúri
        feriúntur tertio Idus Septembris.
      en: >-
        Protus and Hyacinth were brethren, eunuchs of the blessed Virgin
        Eugenia, and were baptized along with her by Bishop Helenus. They
        gave themselves to the study of God's Word, and dwelt for a while
        in wonderful lowliness and holiness of life in a monastery in
        Egypt. However, they afterwards followed the holy Virgin Eugenia
        to Rome, in the reign of the Emperor Gallienus, and were arrested
        in that city for professing the Christian faith. By no means
        could they be brought to leave the Christian religion and to
        worship the gods, and they were therefore severely scourged and
        beheaded, upon the 11th day of September.
    status: { la: verified, en: verified }
