# Matins Nocturn 2-3 readings for St. Irenaeus, Bishop and Martyr (June 28).
# Sourced from web/www/horas/Latin/Sancti/06-28.txt,
# English/Sancti/06-28.txt.
#
# Nocturn 2 (Lectio4-6): one continuous vita, no genuine source break --
# same combining convention st-alphonsus-liguori.yml/st-ephraim-of-syria.yml
# use.
#
# Nocturn 3: genuinely Irenaeus's own on both counts, unlike most non-
# bishop confessors' bare Common cross-reference -- the source's own
# Gospel (Matt 10:28-33, "Nolite timere eos qui occidunt corpus") is
# paired with a homily drawn from Irenaeus's own Adversus Haereses (Lib.
# 3, cap. 18/20, num. 5-6), transcribed here rather than left to the
# generic Common of a Martyr Bishop pool.
id: st-irenaeus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Irenæus, non longe ab urbe Smyrna in Asia proconsulari natus, jam inde a púero sese
        Polycarpo, Joánnis Evangelistæ discipulo eidemque episcopo Smyrnæórum, tradiderat in
        disciplínam. Hoc tam excellénti magistro, progréssus in doctrina præceptisque
        christianæ religiónis insignes fecit. Polycarpo in cælum martyrii glória sublato, etsi
        erat Irenæus in sacris litteris egregie versatus, quod tamen incredibili studio
        flagraret discéndi quæ dógmata depósiti loco custodienda ceteri accepissent, quos
        Apóstoli institúerant; horum quam pótuit plures convénit, quæque ab iisdem audívit,
        mémori mente ténuit, ea deinceps opportune advérsus hæreses allatúrus, quas cum vidéret
        ingénti pópuli christiáni damno latius in dies manare, diligenter copioséque reféllere
        cogitarat. In Gállias inde profectus, a Pothino episcopo presbyter est constitútus
        Ecclésiæ Lugdunénsis. Quod munus sic laborando in verbo et doctrina gessit, ut
        (testibus sanctis Martyribus, qui, Marco Aurelio imperatóre, strenue pro vera pietáte
        certarant) æmulatórem sese præstíterit testaménti Christi.


        Cum Mártyres ipsi clerusque Lugdunénsis de pace Ecclesiárum Asiæ, quam Montanistárum
        factio turbarat, solliciti cum primis essent, Irenæum, cujus esse potíssimum habéndam
        ratiónem prædicábant, unum ómnium maxime delegérunt, quem Romam ad Eleuthérium
        Pontificem mitterent rogátum, ut novis sectariis auctoritate Sedis Apostolicæ
        reprobátis, discordiárum causa tollerétur. Jam Pothinus epíscopus, martyr decesserat:
        huic Irenæus cum successísset, tam feliciter munus obiit episcopatus, ut sapiéntia,
        oratióne, exemploque suo non modo brevi cives Lugdunenses omnes, sed multos étiam
        aliárum Galliæ urbium íncolas superstitiónem atque errórem abjecisse, dedísseque
        christianæ milítiæ nómina víderit. Interea, cum de die celebrándi Paschátis orta esset
        contentio, ac Victor, Romanus Pontifex, Asiános episcopos ab collégis réliquis fere
        ómnibus dissidéntes aut prohibuísset communióne sacrórum, aut prohibére minátus esset,
        eum Irenæus, sequester pacis, decenter monuit, exemplisque usus Pontificum superiórum
        indúxit, ut ne tot Ecclésias ob ritum quem a majóribus accepisse se dicerent, avelli ab
        unitate catholica paterétur.


        Multa scripsit, quæ Eusebius Cæsariénsis et sanctus Hieronymus mémorant, quorúmque
        pars magna intércidit injuria témporum. Exstant ejus advérsus hæreses libri quinque,
        anno circiter centésimo octogesimo perscripti, dum adhuc Eleutherius rem christianam
        publicam géreret. In tertio libro vir Dei, ab iis edoctus quos auditores constat
        fuísse Apostolórum, grave in primis atque præclárum de Romana Ecclésia, deque illíus
        episcopórum successióne, divinæ traditiónis fideli, perpetua, certíssima custode,
        testimónium dixit. Atque ad hanc, dixit, Ecclésiam propter potiórem principalitátem
        necesse est omnem conveníre Ecclésiam, hoc est eos qui sunt undique fidéles. Postremo
        una cum aliis prope innumerabílibus, quos ipse ad veram fidem frugemque perduxerat,
        martyrio coronátus migrávit in cælum, anno salútis ducentésimo secundo, quo témpore
        Septimius Sevérus Augustus eos omnes, qui constanter in colenda christiana religióne
        perstare voluíssent, in summum cruciátum dari atque intérfici imperaverat. Sancti
        Irenæi festum Benedíctus décimus quintus Pontifex maximus ad universam Ecclésiam
        extendit.
      en: >-
        Irenaeus was born in proconsular Asia, not far from the city of Smyrna. There he had
        already as a boy entrusted himself to the teaching of Polycarp, disciple of John the
        Evangelist, and bishop of Smyrna. Under such an excellent master, he made remarkable
        progress in learning and in the precepts of the Christian religion. When Polycarp was
        taken up to heaven by a glorious martyrdom, although Irenaeus was eminently versed in
        sacred letters, nevertheless, he burned with an incredible zeal to learn what articles
        of belief the others who were instructed by the Apostles had received, to be preserved
        in the deposit of faith. For this reason he brought together as many of those men as
        he could, and whatever things he heard from them, he carefully retained in his mind.
        Thus he could advantageously bring them to bear in the future against those heresies,
        which he saw were being diffused more widely day by day to the great detriment of the
        Christian people, and he diligently planned thoroughly to confute them. Then, having
        set out for Gaul, he was appointed as a priest of the church of Lyons by Pothinus the
        bishop. And this office he discharged in such a manner, labouring both by word and by
        teaching, that (according to the testimony of the holy Martyrs who, when Marcus
        Aurelius was emperor, were engaged in a vigorous combat for the true religion) he
        distinguished himself as an imitator of the testament of Christ.


        These very Martyrs, together with the clergy of Lyons, began to be anxious concerning
        the peace of the churches of Asia, which the faction of the Montanists had disturbed.
        And so they selected Irenaeus, whose person they considered of the greatest
        importance, as the one before all others whom they should send to Rome to Pope
        Eleutherius to ask, that, with the condemnation of the new dissidents by the authority
        of the Apostolic See, the cause of the dissensions might be removed. Already the
        bishop Pothinus had died a martyr and Irenaeus succeeded him. He applied himself so
        well to the duties of a bishop, that in a short time he saw not only all the citizens
        of Lyons, but also many of the inhabitants of other cities in Gaul cast aside their
        superstitions and errors, and enroll themselves in the Christian army. Meanwhile, a
        dispute had arisen concerning the date of the celebration of Easter. As the bishops of
        Asia were disagreeing with nearly all their fellow-bishops, the Roman Pontiff Victor
        had cut them off from the communion of the faithful. Irenaeus, however, who was
        zealous for peace, admonished him in a becoming manner, and urged, by examples of the
        practice of previous Pontiffs, that he should not suffer so many Churches to be cut
        off from Catholic unity, on account of a rite which they said they had received from
        their ancestors.


        He wrote many works, which are mentioned by Eusebius of Caesarea and by St. Jerome, a
        great part of which have perished through the ravages of time. There are extant five
        books of his against heresies, written down about the year 180, while Eleutherius was
        still ruling the Christian commonwealth. In the third book, the man of God, instructed
        by those who, it is certain, had been hearers of the Apostles, gives to the Roman
        Church and to the succession of her bishops a testimony surpassing all others in
        weight and brilliancy, when he calleth her the faithful, perpetual, and most assured
        guardian of divine tradition. For he said, that with this Church it is necessary that
        the whole Church (that is, those in all places who are of the faithful) should agree,
        because of its more powerful preeminence. At length with almost countless others, whom
        he had himself brought over to the true faith and its practice, being crowned with
        martyrdom he passed to heaven in the year of salvation 202. At that time Septimius
        Severus Augustus had commanded that all those who wished to remain constantly
        steadfast in the practice of the Christian religion should be condemned to the most
        cruel torments and to death. The supreme Pontiff Benedict XV extended the feast of St.
        Irenaeus to the universal Church.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 10:28-33", en: "Matt 10:28-33" }
    text:
      la: >-
        In illo témpore: Dixit Jesus discípulis suis: Nolíte timere eos qui occídunt corpus,
        ánimam autem non possunt occídere; sed potius timéte eum qui potest et ánimam et
        corpus perdere in gehennam. Et réliqua.
      en: >-
        At that time: Jesus said unto his disciples: Fear not them which kill the body, but
        are not able to kill the soul: but rather fear him which is able to destroy both soul
        and body in hell. And so forth.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Irenaeus, Bishop and Martyr, Against Heresies, Book 3, ch. 18"
    text:
      la: >-
        Sciebat Dóminus eos qui persecutiónem passuri essent; sciebat et eos qui flagéllari
        et occídi haberent propter eum. Erat ergo sermo ejus, adhortántis étiam illos:
        Nolíte timere eos qui occídunt corpus, ánimam autem non possunt occídere. Timéte
        autem magis eum qui habet potestátem et corpus et ánimam mittere in gehennam, et
        servare eas quæ essent ad eum confessiónes. Etenim ipse confessurum se promittebat
        coram Patre suo eos, qui confiteréntur nomen suum coram homínibus; negatúrum autem
        eos qui negarent eum, et confusurum qui confunderéntur contra confessiónem ejus. Et,
        cum hæc ita se habeant, ad tantam temeritátem progressi sunt quidam, ut étiam
        Mártyres spernant, et vitúperent eos qui propter Dómini confessiónem occidúntur, et
        sústinent ómnia a Dómino prædicta, et secúndum hoc conántur vestígia ássequi
        passiónis Dómini, passibilis Mártyres facti; quos et concédimus ipsis Martyribus. Cum
        enim inquirétur sanguis eórum, et glóriam consequéntur, tunc a Christo confundéntur
        omnes qui inhonoravérunt eórum martyrium.


        Hoc autem idem et illis occurrit, qui dicunt eum putative passum. Si enim non vere
        passus est, nulla grátia ei, cum nulla fúerit passio; et nos, cum incipiémus vere
        pati, seducens vidébitur, adhortans nos vapulare, et álteram præbére maxíllam, si
        ipse illud non prior in veritáte passus est. Et, quemádmodum illos sedúxit, ut
        viderétur eis ipse hoc quod non erat; et nos sedúcit, adhortans perferre ea quæ ipse
        non pértulit. Erimus autem et super Magistrum, dum pátimur et sustinémus quæ neque
        passus est, neque sustinuit Magister. Sed, quóniam solus vere magister Dóminus
        noster, et bonus vere Fílius Dei; et pátiens Verbum Dei Patris, fílius hóminis
        factus. Luctátus est enim et vicit; erat enim homo pro pátribus certans, et per
        obediéntiam inobediéntiam persolvens. Alligávit enim fortem, et solvit infirmos, et
        salútem donávit plasmáti suo, destruens peccátum. Igitur qui dicunt eum putative
        manifestátum, neque in carne natum, neque vere hóminem factum, adhuc sub veteri sunt
        damnatióne.
      en: >-
        The Lord knew both those who would suffer persecution; and he knew those who would
        be scourged and slain for his sake. His words are indeed those of exhortation: Fear
        not them which kill the body, but are not able to kill the soul. Rather fear him
        which hath power to cast both body and soul into hell, and to preserve whomsoever
        should confess him. For indeed he hath promised to confess before his Father those
        who should confess his name before men; and to deny those who should deny him, and
        to be ashamed of those who should be ashamed to confess him. Yet for all this, some
        have gone so far in audacity, as to scorn even the Martyrs, and to revile those who
        have been put to death for confessing the Lord, and who endure all that the Lord
        foretold, and so far endeavour to follow in the footsteps of the Lord's Passion,
        being made Martyrs of one who was capable of suffering; but these we leave to the
        Martyrs themselves. For when their blood shall be required, and they shall obtain
        glory, then all those who have dishonoured their martyrdom will be put to confusion
        by Christ.


        This also meeteth the objection of those who say that Christ only appeared to be
        suffering. For if he did not really suffer, no gratitude is due unto him, when there
        was no suffering; and when we begin really to suffer, he would seem to be deceiving
        us, when exhorting us to receive blows and to turn the other cheek, if he himself
        had not first suffered in reality. And as he deceived them, so as to appear to them
        what he was not; so also he misleadeth us, exhorting us to endure things which he
        himself did not endure. And so we should even be higher than the Master, when we
        suffer and endure things, which the Master neither suffered nor endured. But,
        whereas our Lord alone is truly the master, he is also truly the Son of God, good
        and kind, the Word of God the Father made Son of Man. For he strove, and he
        conquered; for he was a man contending for his fathers and paying the debt of
        disobedience by his obedience. For he hath bound the strong man, and, he unbindeth
        the weak, and he hath given salvation to his creature by destroying sin. Therefore,
        those who say he is manifested only in appearance, and not born in the flesh, nor
        really made man, are still under the old condemnation.
    status: { la: verified, en: verified }
