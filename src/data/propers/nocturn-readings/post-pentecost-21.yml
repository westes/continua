id: post-pentecost-21
readings:
  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 18:23-35", en: "Matt 18:23-35" }
    text:
      la: >-
        In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Assimilátum est regnum cœlórum hómini regi, qui vóluit ratiónem pónere cum servis suis. Et cum cœpísset ratiónem pónere, oblátus est ei unus, qui debébat ei decem mília talénta. Cum autem non habéret, unde rédderet, jussit eum dóminus ejus venúmdari et uxórem ejus et fílios et ómnia, quæ habébat, et reddi. Prócidens autem servus ille, orábat eum, dicens: Patiéntiam habe in me, et ómnia reddam tibi. Misértus autem dóminus servi illíus, dimísit eum et débitum dimísit ei. Egréssus autem servus ille, invénit unum de consérvis suis, qui debébat ei centum denários: et tenens suffocábat eum, dicens: Redde, quod debes. Et prócidens consérvus ejus, rogábat eum, dicens: Patiéntiam habe in me, et ómnia reddam tibi. Ille autem nóluit: sed ábiit, et misit eum in cárcerem, donec rédderet débitum. Vidéntes autem consérvi ejus, quæ fiébant, contristáti sunt valde: et venérunt et narravérunt dómino suo ómnia, quæ facta fúerant. Tunc vocávit illum dóminus suus: et ait illi: Serve nequam, omne débitum dimísi tibi, quóniam rogásti me: nonne ergo opórtuit et te miseréri consérvi tui, sicut et ego tui misértus sum? Et irátus dóminus ejus, trádidit eum tortóribus, quoadúsque rédderet univérsum débitum. Sic et Pater meus cœléstis fáciet vobis, si non remiséritis unusquísque fratri suo de córdibus vestris.
      en: >-
        At that time, Jesus spoke to His disciples this parable: The kingdom of heaven is likened to a king who desired to settle accounts with his servants. And when he had begun the settlement, one was brought to him who owed him ten thousand talents. And as he had no means of paying, his master ordered him to be sold, with his wife and children and all that he had, and payment to be made. But the servant fell down and besought him, saying, ‘Have patience with me and I will pay you all!’ And moved with compassion, the master of that servant released him, and forgave him the debt. But as that servant went out, he met one of his fellow-servants who owed him a hundred denarii and he laid hold of him, and throttled him, saying, ‘Pay what you owe.’ His fellow-servant therefore fell down and began to entreat him, saying, ‘Have patience with me and I will pay you all.’ But he would not; but went away and cast him into prison until he should pay what was due. His fellow-servants therefore, seeing what had happened, were very much saddened, and they went and informed their master of what had taken place. Then his master called him, and said to him, ‘Wicked servant! I forgave you all the debt, because you entreated me. Should not you also have had pity on your fellow-servant, even as I had pity on you?’ And his master, being angry, handed him over to the torturers until he should pay all that was due to him. So also My heavenly Father will do to you, if you do not each forgive your brothers from your hearts.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Jerome, Priest, Book 3, Commentary on Matthew 18"
    text:
      la: >-
        Familiáre est Syris, et máxime Palæstínis, ad omnem sermónem suum parábolas júngere: ut quod per
        simplex præcéptum tenéri ab auditóribus non potest, per similitúdinem exempláque teneátur.
        Præcépit ítaque Dóminus Petro sub comparatióne regis et dómini, et servi, qui débitor decem
        míllium talentórum a dómino rogans véniam impetráverat, ut ipse quoque dimíttat consérvis suis
        minóra peccántibus. Si enim ille rex et dóminus servo debitóri decem míllia talentórum tam
        fácile dimísit: quanto magis servi consérvis suis debent minóra dimíttere?


        Quod ut maniféstius fiat, dicámus sub exémplo. Si quis nostrum commíserit adultérium,
        homicídium, sacrilégium; majóra crímina decem míllium talentórum rogántibus dimittúntur, si et
        ipsi dimíttant minóra peccántibus. Sin autem ob factam contuméliam simus implacábiles, et
        propter amárum verbum pérpetes habeámus discórdias; nonne nobis vidémur recte redigéndi in
        cárcerem, et sub exémplo óperis nostri hoc ágere, ut majórum nobis delictórum vénia non
        relaxétur?


        Sic et Pater meus cæléstis fáciet vobis, si non remiséritis unusquísque fratri suo de córdibus
        vestris. Formidolósa senténtia, si juxta nostram mentem senténtia Dei fléctitur, atque mutátur:
        si parva frátribus non dimíttimus, magna nobis a Deo non dimitténtur. Et quia potest unusquísque
        dícere: Nihil hábeo contra eum, ipse novit, habet Deum júdicem; non mihi curæ est quid velit
        ágere, ego ignóvi ei: confírmat senténtiam suam, et omnem simulatiónem fictæ pacis evértit,
        dicens: Si non remiséritis unusquísque fratri suo de córdibus vestris.
      en: >-
        It is a way much in use with the Syrians, and especially with the inhabitants of Palestine, to
        illustrate their discourse with parables, that what their hearers may not be able to catch so
        easily when spoken plainly, they may lay hold on by dint of comparisons and examples. Thus it was
        that the Lord, by an allegory about a Royal master and a servant who owed him ten thousand
        talents, and who obtained by entreaty forgiveness of the debt, taught Peter how it was his duty
        to forgive his fellow-servants their comparatively trifling offences. For if that Royal master so
        readily forgave his servant his debt of ten thousand talents, should not his servants much more
        forgive lesser debts unto their fellows?


        Let put this more clearly, let us take a case. If one of us were to commit adultery, or murder,
        or sacrilege, our sin, great like a debt of ten thousand talents, would be forgiven us in answer
        to prayer, if we also from our heart forgive our brethren their trespasses against us. But if we
        refuse to forgive a slight, and keep up unceasing enmity because of an unkind word, how just doth
        it appear that we should be cast into prison, and entail on ourselves, by the example of our own
        deeds, that our great debt should not be forgiven unto us.


        "So likewise shall My heavenly Father do also unto you, if ye from your hearts forgive not every
        one his brother their trespasses." God's awful purpose can be turned and changed but if we will
        not forgive unto our brethren small things, God will not forgive us great things. And if we
        forgive them, it must be from our hearts. Any one can say: I have nothing against such-an-one he
        knoweth what he hath done, and God will judge him for it I do not care what he doeth I have
        forgiven him. But the Lord maketh His sentence clear, and destroyeth such a mockery of peace as
        this, where He saith: "So likewise shall My heavenly Father do also unto you, if ye from your
        hearts forgive not every one his brother their trespasses."
    responsory:
      la: "R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.\nV. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.\nR. Plena est omnis terra glória ejus."
      en: "R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.\nV. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.\nR. The whole earth is full of His glory."
    status: { la: verified, en: verified }
