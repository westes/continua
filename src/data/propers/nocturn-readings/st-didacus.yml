# Matins Nocturn 2 reading for St. Didacus, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/11-13.txt, English/Sancti/11-13.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-didacus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Dídacus, Hispanus, ex oppido sancti Nicolai de Portu diœcesis Hispalénsis, ab
        ineunte ætate, pii sub sacerdotis disciplína, sanctioris vitæ, solitaria in
        ecclésia, tirocinium exercuit. Deínde, ut firmius Deo se conjungeret, in
        convéntu de Arizzáfa fratrum Minórum (quos Observántes vocant) sancti Francisci
        regulam in statu laicali proféssus est. Magna ibi alacritate húmilis obediéntiæ
        et regularis observantiæ jugum subiens, contemplatióni in primis déditus, mira
        Dei luce perfundebátur, adeo ut de rebus cæléstibus, litterárum expers, mirándum
        in modum et plane divinitus loquerétur.


        Canariis in insulis, ubi frátribus sui ordinis præfuit, multa perpéssus,
        martyrii æstuans desidério, plures infidéles verbo et exemplo ad Christi fidem
        convértit. Romam veniens anno jubilæi, Nicolao quinto Pontifice, ægrotórum curæ
        in convéntu Aræ cæli destinátus, eo caritátis afféctu munus hoc exercuit, ut,
        Urbe annonæ inópia laborante, ægrotis tamen, quorum aliquándo úlcera étiam
        lambéndo abstergebat, nihil pénitus necessarii defécerit. Eximia quoque fides et
        grátia curatiónum in eo eluxit, cum lámpadis, quæ collucebat ante imáginem
        beatíssimæ Dei Genitrícis, quam summa devotióne colebat, oleo ægros inungens,
        signo crucis impresso, multórum morbos mirabíliter sanaverit.


        Demum, Complúti finem sibi vitæ adesse intélligens, lácera et obsoleta indútus
        túnica, conjectis in crucem óculis, singulari devotióne illis verbis ex sacro
        hymno pronuntiátis: Dulce lignum, dulces clavos, dulcia ferens póndera, quæ
        fuísti digna portare Regem cælórum et Dóminum, ánimam Deo réddidit pridie Idus
        Novembris, anno Dóminis supra millesimum quadringentésimo sexagesimo tertio.
        Ejus corpus, cum menses non paucos (ut pio confluéntium desidério fieret satis)
        insepúltum mansísset, quasi jam incorruptiónem indúerit, odórem suavíssimum
        efflávit. Illum, multis et illustribus miraculis clarum, Xystus quintus,
        Pontifex maximus, Sanctórum número adscripsit.
      en: >-
        Diego was a Spaniard, and was born at the little town of San Nicola-del-Porto,
        in the diocese of Seville. From his childhood he learnt the more holy life under
        a godly Priest, (who lived hermit) in a lonely Church, and so served his
        apprenticeship. Afterwards, being fain to be more utterly God's only, he
        professed himself as a lay brother under the Rule of St. Francis in the convent
        of the Friars Minor, called Observant, of Arrizafa. There he cheerfully bore the
        yoke of the lowliest obedience and the strictest observance. He was much given
        to contemplation, and a wonderful light from God shone in him, so that, though
        he was untaught, he could speak touching heavenly things strangely and as it
        were supernaturally.


        In the Canary Islands, where he was warden of the brethren of his Order, he
        underwent much, earnestly willing to be a martyr, and by his word and example
        brought many unbelievers to Christ. He came to Rome in the year of the Jubilee,
        ~(being that of our Lord 1450,) in the reign of Pope Nicolas V., and there was
        set to tend the. sick in the Convent of Ara Coeli, which work he did with such
        love, that although the city was plagued with a famine, the sufferers (whose
        sores he would sometimes cleanse even with his tongue) scarcely lacked anything
        needful. He was a burning and shining light of faith, and had the gift of
        healing, taking the oil from the lamp which burned before the image of the most
        blessed Mother of God, to whom he was earnestly devoted, and anointing the sick
        therewith, whereupon many were marvellously cured.


        He was at Alcala when he understood that the end of his life was at hand.
        Clothed in a ragged cast-away habit, he fixed his eyes upon the Cross, and said
        with extraordinary earnestness 'Sweet the nails, and sweet the iron, Sweet the
        Weight That hung on thee,' thou that wast chosen to up-bear the Lord, the King
        of heaven, and so he gave up his soul to God, upon the 12th day of November, in
        the year of our Lord 1463. To satisfy the godly wishes of the multitude, his
        body was kept unburied for not a few months, and lay in a right sweet savour, as
        though the corruptible had already put on incorruption. He was famous for many
        and great miracles, and Pope Sixtus V. enrolled him in the number of the Saints.
    status: { la: verified, en: verified }
