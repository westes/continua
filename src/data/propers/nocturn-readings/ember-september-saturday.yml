# Matins Nocturn content for September Ember Saturday (Sabbato Quattuor
# Temporum Septembris) — read directly from
# web/www/horas/Latin/Tempora/093-6.txt, English/Tempora/093-6.txt, and
# their Monastic-track override web/www/horas/Latin/TemporaM/093-6.txt
# (substitutes its own Responsory2/3, same Tobias-sermon texts as
# ember-september-wednesday.yml's own Monastic override — used here per
# this project's Monastic 1617-first structure preference; Responsory1 is
# identical in both tracks, and is itself the same text as
# ember-september-wednesday.yml's Responsory1).
#
# Lectio1's Gospel citation (Luke 13:6-17) is a bare incipit with no full
# pericope text given in this day's own file, so only the homily portion
# was originally authored, same convention as the other two September
# Ember days.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily), matching the
# convention set by ember-september-friday.yml — this day's own
# [Evangelium] carries the full pericope directly (not a redirect),
# sourced from missa/Latin/Tempora/093-6.txt, English/Tempora/093-6.txt,
# not guessed at.
#
# Recombined into one reading 2026-09-04 (previously kept as 3 separate
# readings): Lectio1-3 are one continuous, unbroken Gregory homily, split
# only to fill the fixed 3-lesson Nocturn slot count — same fix already
# applied to ember-september-friday.yml/ember-september-wednesday.yml the
# same day, see either file's own header for the fuller rationale.
# Responsory is Lectio1's own; Lectio2/3's own distinct responsories
# (drawn from TemporaM/093-0's own Tobias-sermon texts) are dropped, same
# as every other collapsed-reading case in this store.
id: ember-september-saturday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Luc 13:6-17", en: "Luke 13:6-17" }
    text:
      la: >-
        In illo témpore: Dicébat Jesus turbis hanc similitúdinem: Arbórem fici habébat quidam
        plantátam in vínea sua, et venit quærens fructum in illa, et non invénit. Dixit autem ad
        cultórem víneæ: Ecce, anni tres sunt, ex quo vénio quærens fructum in ficúlnea hac, et
        non invénio: succíde ergo illam: ut quid étiam terram óccupat? At ille respóndens, dicit
        illi: Dómine, dimítte illam et hoc anno, usque dum fódiam circa illam et mittam
        stércora: et si quidem fécerit fructum: sin autem, in futúrum succídes eam. Erat autem
        docens in synagóga eórum sábbatis. Et ecce múlier, quæ habébat spíritum infirmitátis
        annis decem et octo: et erat inclináta, nec omníno póterat sursum respícere. Quam cum
        vidéret Jesus, vocávit eam ad se, et ait illi: Múlier, dimíssa es ab infirmitáte tua. Et
        impósuit illi manus, et conféstim erécta est, et glorificábat Deum. Respóndens autem
        archisynagógus, indígnans quia sábbato curásset Jesus, dicébat turbæ: Sex dies sunt, in
        quibus opórtet operári: in his ergo veníte, et curámini, et non in die sábbati.
        Respóndens autem ad illum Dóminus, dixit: Hypócritæ, unusquísque vestrum sábbato non
        solvit bovem suum aut ásinum a præsépio, et ducit adaquáre? Hanc autem fíliam Abrahæ,
        quam alligávit sátanas, ecce decem et octo annis, non opórtuit solvi a vínculo isto die
        sábbati? Et cum hæc díceret, erubescébant omnes adversárii ejus: et omnis pópulus
        gaudébat in univérsis, quæ glorióse fiébant ab eo.
      en: >-
        At that time, Jesus spoke to the multitudes this parable: "A certain man had a fig tree
        planted in his vineyard; and he came seeking fruit thereon, and found none. And he said
        to the vine-dresser, 'Behold, for three years now I have come seeking fruit on this fig
        tree, and I find none. Cut it down, therefore; why does it still encumber the ground?'
        But he answered him and said, 'Sir, let it alone this year too, till I dig around it and
        manure it. Perhaps it may bear fruit; but if not, then afterwards you shall cut it
        down.'" Now He was teaching in one of their synagogues on the Sabbath. And behold, there
        was a woman who for eighteen years had had a sickness caused by a spirit; and she was
        bent over and utterly unable to look upwards. When Jesus saw her, He called her to Him
        and said to her, "Woman, you are delivered from your infirmity." And He laid His hands
        upon her, and instantly she was made straight, and glorified God. But the ruler of the
        synagogue, indignant that Jesus had cured on the Sabbath, addressed the crowd, saying,
        "There are six days in which one ought to work; on these therefore come and be cured,
        and not on the Sabbath." But the Lord answered him and said, "Hypocrites! does not each
        one of you on the Sabbath loose his ox or ass from the manger, and lead it forth to
        water? And this woman, daughter of Abraham as she is, whom Satan has bound, lo, for
        eighteen years, ought not she to be loosed from this bond on the Sabbath?" And as He
        said these things, all His adversaries were put to shame; and the entire crowd rejoiced
        at all the glorious things that were done by Him.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "Pope St. Gregory the Great, Homily 31 on the Gospels, on Luke 13:6-17"
    text:
      la: >-
        Dóminus ac Redémptor noster per Evangélium suum aliquándo verbis, aliquándo rebus lóquitur: aliquándo áliud
        verbis, atque áliud rebus; aliquándo autem hoc verbis, quod rebus. Duas étenim res ex Evangélio, fratres,
        audístis: ficúlneam infructuósam, et mulíerem curvam; et utríque rei est píetas impénsa. Illud autem dixit
        per similitúdinem: istud egit per exhibitiónem. Sed hoc signíficat ficúlnea infructuósa, quod múlier
        inclináta; et hoc ficúlnea reserváta, quod múlier erécta.


        Quid arbor fici, nisi humánam natúram desígnat? Quid múlier inclináta, nisi eámdem natúram significándo
        denúntiat? Quæ et bene plantáta est sicut ficus, et bene creáta sicut múlier; sed in culpam própria sponte
        lapsa, neque fructum servat operatiónis, neque statum rectitúdinis. Ad peccátum quippe ex voluntáte
        córruens, quia fructum obediéntiæ ferre nóluit, statum rectitúdinis amísit. Quæ ad Dei similitúdinem
        cóndita, dum in sua dignitáte non pérstitit, quod plantáta vel creáta fúerat, serváre contémpsit. Tértio
        dóminus víneæ ad ficúlneam venit, quia natúram géneris humáni ante legem, sub lege, sub grátia, exspéctando,
        admonéndo, visitándo requisívit.


        Venit ante legem, quia per naturálem intelléctum quid unusquísque exémplo sui, quáliter erga próximum ágere
        debuísset, innótuit. Venit in lege, quia præcipiéndo dócuit. Venit post legem per grátiam, quia pietátis
        suæ præséntiam exhibéndo monstrávit. Sed tamen in tribus annis fructum se non invenísse conquéritur: quia
        quorúmdam pravórum mentes nec inspiráta lex naturális córrigit, nec præcépta erúdiunt, nec incarnatiónis
        ejus mirácula convértunt. Quid vero per cultórem víneæ, nisi præpositórum ordo exprímitur? Qui dum præsunt
        Ecclésiæ, nimírum Domínicæ víneæ curam gerunt.
      en: >-
        Our Lord and Redeemer speaketh unto us sometimes by words, and sometimes by deeds, sometimes one thing by
        words, and another by deeds, and sometimes the same thing both by word and deed. In the portion of the
        Gospel which hath this day been read, ye have heard, my brethren, two things, the parable of the fig-tree
        and the history of the woman which was bowed together. In both is a manifestation of the Lord's mercy, but
        in the one by a parable, in the other by an example. But the barren fig-tree signifieth the same thing as
        doth the woman bowed together, and the patience shown to the fig-tree the same thing as doth the healing
        of the woman bowed together.


        What is the fig-tree a type, but of mankind? Of what is the woman bowed together by a spirit of infirmity a
        type, but of the same mankind? Man was originally placed in a garden like the fig-tree, and created upright
        like the woman, but man fell away by his own willful fault like the fig-tree he brought forth no fruit like
        the woman he ceased to stand straight. When he willfully went into sin, because he would not bring forth
        the fruit of obedience, he lost his uprightness. The nature which had been created in the image of God,
        continued not in honour, but cast aside the state wherein it had been placed and made. The lord of the
        vineyard came thrice to the fig-tree, for God hath come in hope, and in warning, seeking fruit from mankind
        under three successive dispensations, that is to say, before the law, under the law, and under grace.


        It came before the law, in that by natural understanding, He let all know by example of Himself, what and
        how they should do toward their neighbor. In the law He came teaching. After the law He came by grace,
        opening, manifesting His merciful Presence. But after all these three years He yet hath to complain that He
        findeth no fruit upon the fig-tree, for there are still some degraded minds which the inborn voice of the
        natural law doth not control, which the commandments do not teach, and which the wonders of the
        Incarnation itself do not convert. Of what is the dresser of the vineyard a type, but of the Episcopacy?
        For these are they who have the government in the Church, and are therefore truly called the dressers of
        the Lord's vineyard.
    responsory:
      la: "R. Tribulatiónes civitátum audívimus, quas passæ sunt, et defécimus: timor et hebetúdo mentis cécidit super nos et super líberos nostros: ipsi montes nolunt recípere fugam nostram: * Dómine, miserére.\nV. Peccávimus cum pátribus nostris, injúste égimus, iniquitátem fécimus.\nR. Dómine, miserére."
      en: "R. We have heard of the tribulation of those cities, which they have suffered, and we have fainted. Fear and confusion of mind are fallen upon us. Even the mountains will not give us a refuge. * Lord, have mercy.\nV. We have sinned like our forefathers, we have done unjustly, and wrought iniquity.\nR. Lord, have mercy."
    status: { la: verified, en: verified }
