# Matins Nocturn 2 reading for Ss. Maurice and Companions, Martyrs of
# the Theban Legion (Sep 22). No genuine SanctiM match: the correct
# Tridentine file is the suffixed `Sancti/09-22o.txt` (the plain
# `Sancti/09-22.txt` is St. Thomas of Villanova instead), and the only
# SanctiM file for this date, `SanctiM/09-22b.txt`, is unrelated own
# content — a missed pre-1955-pool candidate rather than a genuine
# SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/09-22o.txt, English/Sancti/09-22o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: ss-maurice-and-companions
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Cum Maximiánus imperátor, ducto in Gálliam exercitu, in fínibus Sedunórum sacrifícii
        causa constitísset, Thebæórum legio, ne se impiórum sacrórum societáte contamináret, a
        réliquis cópiis discéssit. Quare imperátor misit ad eos mílites, qui suo nómine
        nuntiárent ut, si salvi esse vellent, in castra ad sacrifícia redírent: qui se
        christiána religióne impedíri respondérunt. Quorum respónsum ille indigníssime ferens,
        majori iracúndia quam antea exársit. Itaque, immíssa parte exércitus in Thebǽos,
        décimum quemque eórum primum occídi jussit; quod martýrium sua sponte, maximéque
        hortatóre Maurítio, ferre maluérunt quam imperáta fácere nefárii imperatóris. Ac
        deínde réliquos omnes, constantíssime Christum prædicántes, décimo Kaléndas Octóbris
        ab univérso exércitu trucidári ímperat.
      en: >-
        When the Emperor Maximian led his army into Gaul, he stopped at the frontiers of the
        Seduni to offer a sacrifice. The Theban legion, that they might not be defiled by any
        share in the unhallowed rites, withdrew themselves from the rest of his army. Therefore
        the Emperor sent soldiers unto them to bid them in his name, if they valued their lives,
        come back into the camp to the sacrifice. They answered that the Christian religion did
        not allow them. This answer enkindled in him greater wrath than before. He therefore
        despatched a part of his army to the Thebans, with orders to begin by killing one man in
        every ten of them. By their own will, and at the urgent exhortation of Maurice, they
        chose rather to endure this martyrdom than to do the commandment of the unrighteous
        Emperor. At the last, the Emperor, upon the 22nd day of September, bade his whole army
        fall upon them and slay them all. They confessed Christ bravely even to the end.
    status: { la: verified, en: verified }
