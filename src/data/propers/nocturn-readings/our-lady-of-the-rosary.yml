# Matins Nocturn 2/3 readings for Our Lady of the Rosary (Oct 7).
# web/www/horas/Latin/Sancti/10-07.txt, English/Sancti/10-07.txt.
# SanctiM/10-07.txt reshuffles the same content into 12 lessons (and
# adds a handful of its own responsories); this store's recombine
# convention (see nativity-bvm.yml) folds each source's contiguous
# lessons into one reading instead, so the content below follows the
# Sancti file's own 9-lesson order:
#   Lectio3 (Sir 24:24-31)            -> Nocturn 2, scripture
#   Lectio4-6 (Dominic, Lepanto, Clement XI/Leo XIII history) -> Nocturn 2
#   Lectio7 (Luke 1:26-38 + St. Bernard, "Homily on Holy Mary")  -> Nocturn 3
#   Lectio8_1 + 8_2 (St. Bernard, "Homily on the Water Course") -> Nocturn 3
# Lectio1-2 (Sir 24:11-22) are not authored: Nocturn 1's scripture
# slot is the user's own reading plan (see DESIGN.md), and the Lectio1-2
# passages are cited in Prime/None (our-lady-of-the-rosary-lectio-prima.yml).
# Responsories: Responsory3/4/7/8 of the Sancti file, one per reading, the
# same "reuse one of the feast's own responsories across a combined
# reading" convention the octave readings use.
# The Gospel's full pericope text is the same as the Annunciation's
# (annunciation.yml, itself sourced from the Missale [Evangelium]) --
# the source's own Lectio7 carries only the bare incipit.
id: our-lady-of-the-rosary
readings:
  - nocturn: 2
    isGospel: false
    citation: { la: "Sir 24:24-31", en: "Sir 24:24-31" }
    text:
      la: >-
        Ego mater pulchræ dilectiónis, et timóris, et agnitiónis, et sanctæ spei. In me grátia
        omnis viæ et veritátis, in me omnis spes vitæ et virtútis. Transíte ad me, omnes qui
        concupíscitis me, et a generatiónibus meis implémini; spíritus enim meus super mel
        dulcis, et heréditas mea super mel et favum. Memória mea in generatiónes sæculórum. Qui
        edunt me, adhuc esúrient, et qui bíbunt me, adhuc sítient. Qui audit me non confundétur,
        et qui operántur in me non peccábunt. Qui elúcidant me, vitam ætérnam habébunt.
      en: >-
        I am the mother of fair love, and of fear, and of knowledge, and of holy hope. In me is
        all grace of the way and of the truth, in me is all hope of life and of virtue. Come over
        to me, all ye that desire me, and be filled with my fruits. For my spirit is sweet above
        honey, and my inheritance above honey and the honeycomb. My memory is unto everlasting
        generations. They that eat me, shall yet hunger: and they that drink me, shall yet
        thirst. He that hearkeneth to me, shall not be confounded: and they that work by me,
        shall not sin. They that explain me shall have life everlasting.
    responsory:
      la: "R. Quæ est ista quæ procéssit sicut sol, et formósa tamquam Jerúsalem? Vidérunt eam fíliæ Sion, et beátam dixérunt, * Et regínæ laudavérunt eam.\nV. Et sicut dies verni circúmdabant eam flores rosárum et lília convállium.\nR. Et regínæ laudavérunt eam."
      en: "R. Who is this that cometh up like the sun? this, comely as Jerusalem? * The daughters of Zion saw her, and called her blessed; the queens also, and they praised her.\nV. And about her it was as the flower of roses in the spring of the year, and lilies of the valleys.\nR. The daughters of Zion saw her, and they called her blessed; the queens also, and they praised her."
    status: { la: verified, en: verified }

  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Cum Albigénsium hǽresis per Tolosátium regiónem ímpie grassarétur, atque áltius in dies
        radíces ágeret, sanctus Domínicus, qui nuper Prædicatórum órdinis fundaménta jécerat, ad
        eam convelléndam totus incúbuit. Id ut præstáret valídius, auxílium beátæ Vírginis,
        cujus dígnitas illis erróribus impudentíssime petebátur, cuíque datum est cunctas
        hǽreses interímere in univérso mundo, eníxis précibus implorávit. A qua (ut memóriæ
        próditum est) cum mónitus esset ut Rosárium pópulis prædicáret, velut singuláre advérsus
        hǽreses ac vítia præsídium; mirum est quanto mentis fervóre et quam felíci succéssu
        injúnctum sibi munus sit exsecútus. Est autem Rosárium certa precándi fórmula, qua
        quíndecim angelicárum salutatiónum décades, oratióne Domínica interjécta, distínguimus,
        et ad eárum síngulas tótidem nostræ reparatiónis mystéria, pia meditatióne recólimus. Ex
        eo ergo témpore pius hic orándi modus mirabíliter per sanctum Domínicum promulgári
        augeríque cœpit. Quem ejúsdem institutórem auctorémque fuísse, summi Pontífices
        apostólicis lítteris passim affirmárunt.


        Innumerábiles porro fructus ex hac tam salutári institutióne in christiánam rempúblicam
        dimanárunt. Inter quos victória illa mérito numerátur, quam sanctíssimus Póntifex Pius
        quintus et ab eo inflammáti christiáni príncipes apud Echínadas ínsulas de Turcárum
        tyránno potentíssimo reportárunt. Nam, cum illa ipsa die ea victória reláta sit, qua die
        sacratíssimi Rosárii sodalitátes per univérsum orbem consuétas supplicatiónes perágerent
        statutásque preces de more fúnderent, iis précibus haud immérito refértur accépta. Quod
        quidem cum étiam Gregórius tértius décimus testátus esset; ut pro tam singulári
        benefício beátæ Vírgini sub appellatióne Rosárii perénnes grátiæ ubíque terrárum
        haberéntur, in ecclésiis ómnibus, in quibus altáre Rosárii foret, Offícium, ritu dúplici
        majóri, perpétuo de eo celebrándum indíxit; aliíque Pontífices Rosárium recitántibus
        ejusdémque Rosárii sodalitátibus indulgéntias pene innúmeras concessére.


        Clemens vero undécimus, ánimo réputans insígnem páriter victóriam, anno millésimo
        septingentésimo décimo sexto in Hungáriæ regno a Cárolo sexto in imperatórem Romanórum
        elécto de innúmeris Turcárum cópiis relátam, eo die contigísse quo festum Dedicatiónis
        sanctæ Maríæ ad Nives celebrarétur, atque eódem ferme témpore quo sacratíssimi Rosárii
        confrátres públicam solemnémque supplicatiónem in alma Urbe, ingénti pópuli concúrsu
        magnáque religióne, peragéntes, férvidas ad Deum preces pro Turcárum depressióne fúnderent
        ac poténtem opem Deíparæ Vírginis in auxílium Christianórum humíliter implorárent; eam ob
        rem, victóriam illam, nec non liberátam paulo post eorúndem Turcárum obsidióne Corcyrénsem
        ínsulam, ejúsdem beátæ Vírginis patrocínio pie cénsuit adscribéndam. Quam ob rem ut hujus
        quoque tam insígnis benefícii perénnis semper et memória exstáret et grátia,
        sacratíssimi Rosárii festum eódem ritu celebrándum ad Ecclésiam univérsam exténdit. Hæc
        ómnia Benedíctus décimus tértius in Breviário Románo appóni jussit. Leo autem tértius
        décimus in turbulentíssimis Ecclésiæ tempóribus, diúque preméntium malórum sæva
        tempestáte, cunctos in orbe fidéles, iterátis apostólicis lítteris ad Mariális Rosárii,
        præsértim per octóbrem mensem, frequéntiam veheménter incéndit, aucto quoque ánnui festi
        solemnitátis ritu, additáque litaníis Lauretánis Regínæ sacratíssimi Rosárii
        invocatióne, et Offício de eádem solemnitáte próprio Ecclésiæ univérsæ concésso.
        Sanctíssimam ergo Dei Genetrícem cultu hoc eídem gratíssimo júgiter venerémur; ut, quæ
        tóties Christi fidélibus, Rosárii précibus exoráta, terrénos hostes profligáre dedit ac
        pérdere, inférnos páriter superáre concédat.
      en: >-
        When the heresy of the Albigenses was making head against God in the County of Toulouse,
        and striking deeper roots every day, the holy Dominic, who had but just laid the
        foundations of the Order of Friars Preachers, threw his whole strength into the travail
        of plucking these blasphemies up. That he might be fitter for the work, he cried for help
        with his whole soul to that Blessed Maiden, whose glory the falsehoods of the heretics so
        insolently assailed, and to whom it hath been granted to trample down every heresy
        throughout the whole earth. It is said that he had from her a word, bidding him preach up
        the saying of the Rosary among the people, as a strong help against heresy and sin, and
        it is wonderful with how stout an heart and how good a success he did the work laid upon
        him. This Rose-garden (or Rosary) is a certain form of prayer, wherein we say
        one-hundred-and-fifty times the salutation of the Angel, and the Lord's Prayer between
        every ten times, and, each of the fifteen times that we say the Lord's Prayer, and repeat
        tenfold the salutation, think of one of fifteen great events in the history of our
        Redemption. From that time forth this form of godly prayer was extraordinarily spread
        about by holy Dominic, and waxed common. That this same Dominic was the founder and prime
        mover thereof hath been said by Popes in diverse letters of the Apostolic See.


        From this healthy exercise have grown up numberless good fruits in the Christian
        Commonwealth. Among these deserveth well to be named that great victory over the Sultan
        of Turkey, which the most holy Pope Pius V, and the Christian Princes whom he had roused,
        won at Lepanto, (on the 7th day of October, the first Lord's Day in the month, in the
        year of our Lord 1571) The day whereon this victory was gained was the very one whereon
        the Guildbrethren of the most holy Rosary, throughout the whole world, were used to offer
        their accustomed prayers and appointed supplications, and the event therefore was not
        unnaturally connected therewith. This being the avowed opinion of Gregory XIII, he
        ordered that in all Churches where there was, or should be, an Altar of the Rosary, a
        Feast, in the form of a Greater Double, should be kept for ever upon the first Lord's Day
        of the month of October, to give unceasing thanks to the Blessed Virgin, under her style
        of (Queen of) the (Most Holy) Rosary, for that extraordinary mercy of God. Other Popes
        also have granted almost numberless Indulgences to those who say the Rosary, and to those
        who join its Guilds.


        In the year 1716, Charles VI, Elect-Emperor of the Romans, won a famous victory over
        countless hordes of Turks, (near Timisoara,) in the kingdom of Hungary, upon the day when
        the Feast of the Dedication of the Church of St. Mary of the Snows was being kept, and
        almost at the very moment when the Guild-brethren of the most holy Rosary were moving
        through the streets of Rome in public and solemn procession, amid vast multitudes, all
        filled with the deepest enthusiasm, calling vehemently upon God for the defeat of the
        Turks, and entreating the Virgin Mother of God to bring the might of her succour to the
        help of the Christians. A few days later, (upon the Octave of the Feast of the
        Assumption,) the Turks raised the siege of Corfu. These mercies Clement XI devoutly
        ascribed to the helpful prayers of the Blessed Virgin, and that the memory and the
        sweetness of such a blessing might for all time coming endure gloriously, he extended to
        the whole Church the observance of the Feast of the most holy Rosary, for the same day
        and of the same rank, (as it had already been in the places before mentioned.) Benedict
        XIII commanded the record of all these things to be given a place in the Service-book of
        the Church of Rome; and Leo XIII, in the most troublous times of the Church and the cruel
        storm of long pressing evils, by fresh Apostolic letters vehemently urged upon all the
        faithful throughout the earth the often saying of the Rosary of (the Blessed Virgin)
        Mary, raised the dignity of the yearly festival, added to the Litany of Loretto the
        Invocation Queen of the Most Holy Rosary, and granted to the whole Church a special
        Office for this solemn occasion. Let us all then be earnest in honouring the most holy
        Mother of God in this form which she liketh so well, that even as the entreaties of
        Christ's faithful people, approaching her in her Garden of Roses, have so often won her
        to scatter and destroy their earthly foes, so she may gain for them the victory over
        their hellish foes likewise.
    responsory:
      la: "R. Tu glória Jerúsalem, tu lætítia Israël, tu honorificéntia pópuli nostri, fecísti viríliter: * Quia cunctas hǽreses sola interemísti.\nV. Pulchra es et decóra, terríbilis ut castrórum ácies ordináta.\nR. Quia cunctas hǽreses sola interemísti."
      en: "R. Thou art the glory of Jerusalem thou art the joy of Israel thou art the honour of our nation thou hast done manfully * For thou alone hast slain all heresies.\nV. Fair and comely art thou, terrible as a fenced camp set in battle array.\nR. For thou alone hast slain all heresies."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Luc 1:26-38", en: "Luke 1:26-38" }
    text:
      la: >-
        In illo témpore: Missus est Angelus Gábriel a Deo in civitátem Galilǽæ, cui nomen
        Názareth, ad Vírginem desponsátam viro, cui nomen erat Joseph, de domo David, et nomen
        Vírginis María. Et ingréssus Angelus ad eam, dixit: Ave, grátia plena; Dóminus tecum:
        benedícta tu in muliéribus. Quæ cum audísset, turbáta est in sermóne ejus: et cogitábat,
        qualis esset ista salutátio. Et ait Angelus ei: Ne tímeas, María, invenísti enim grátiam
        apud Deum: ecce, concípies in útero, et páries fílium, et vocábis nomen ejus Jesum. Hic
        erit magnus, et Fílius Altíssimi vocábitur, et dabit illi Dóminus Deus sedem David, patris
        ejus: et regnábit in domo Jacob in ætérnum, et regni ejus non erit finis. Dixit autem
        María ad Angelum: Quómodo fiet istud, quóniam virum non cognósco? Et respóndens Angelus,
        dixit ei: Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi. Ideóque
        et quod nascétur ex te Sanctum, vocábitur Fílius Dei. Et ecce, Elísabeth, cognáta tua, et
        ipsa concépit fílium in senectúte sua: et hic mensis sextus est illi, quæ vocátur stérilis:
        quia non erit impossíbile apud Deum omne verbum. Dixit autem María: Ecce ancílla Dómini,
        fiat mihi secúndum verbum tuum.
      en: >-
        At that time, the angel Gabriel was sent from God to a town of Galilee called Nazareth,
        to a virgin betrothed to a man named Joseph, of the house of David, and the virgin's name
        was Mary. And when the angel had come to her, he said, "Hail, full of grace, the Lord is
        with you. Blessed are you among women." When she had heard him she was troubled at his
        word, and kept pondering what manner of greeting this might be. And the angel said to her,
        "Do not be afraid, Mary, for you have found grace with God. Behold, you shall conceive in
        your womb and shall bring forth a son; and you shall call His name Jesus. He shall be
        great, and shall be called the Son of the most High; and the Lord God will give Him the
        throne of David His father, and He shall be king over the house of Jacob forever; and of
        His kingdom there shall be no end." But Mary said to the angel, "How shall this happen,
        since I do not know man?" And the angel answered and said to her, "The Holy Spirit shall
        come upon you, and the power of the Most High shall overshadow you, and therefore the Holy
        One to be born shall be called the Son of God. And, behold, Elizabeth your kinswoman also
        has conceived a son in her old age, and she who was called barren is now in her sixth
        month; for nothing shall be impossible with God." But Mary said: "Behold the handmaid of
        the Lord; be it done to me according to your word."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Bernard, Abbot of Clairvaux, Homily on Holy Mary"
    text:
      la: >-
        Ad commendatiónem grátiæ suæ et ad destructiónem humánæ sapiéntiæ, Deus de fémina sed
        vírgine dignátus est carnem assúmere, ut símilem símili rédderet, contrárium contrário
        curáret, pestíferam spinam evélleret, peccáti chirógraphum potentíssime deléret. Heva
        spina fuit; María rosa éxstitit. Heva spina, vulnerándo; María rosa, ómnium afféctus
        mulcéndo. Heva spina, infígens ómnibus mortem; María rosa, reddens salutíferam ómnibus
        sortem. María rosa fuit cándida per virginitátem, rubicúnda per caritátem; cándida
        carne, rubicúnda mente; cándida virtútem sectándo, rubicúnda vítia calcándo; cándida
        afféctum purificándo, rubicúnda carnem mortificándo; cándida Deum diligéndo, rubicúnda
        próximo compatiéndo.
      en: >-
        To commend His Own love towards us, and to bring to nought the wisdom of men, God was
        pleased to take flesh of a woman, albeit a virgin, that He might bring like against like,
        heal by opposites, pluck out the poisonous thorn, and blot out mightily the handwriting
        of our sin that was against us. Eve was a thorn, Mary is a rose. Eve is a thorn that
        pierceth, Mary is a rose that charmeth all the senses. Eve was a thorn that fixed death
        into all, Mary is a rose that bringeth health to all. Mary was a white rose through her
        virginity, and a red rose through her love. She was white in her flesh, red in her mind;
        white in that she followed the path of grace, red in that she trod down sin; white by the
        purity of her affections, red by the mortification of her body; white by her love for
        God, red by her compassion for her neighbour.
    responsory:
      la: "R. Ego quasi vitis fructificávi suavitátem odóris, * Et flores mei fructus honóris et honestátis.\nV. Ego mater pulchræ dilectiónis, et timóris, et agnitiónis, et sanctæ spei.\nR. Et flores mei fructus honóris et honestátis."
      en: "R. As the vine brought I forth pleasant savour; * And my flowers are the fruit of honour and seemliness.\nV. I am the mother of fair love, and fear, and knowledge, and holy hope.\nR. And my flowers are the fruit of honour and seemliness."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Bernard, Abbot of Clairvaux, Homily on the Water Course"
    text:
      la: >-
        Verbum caro factum est, et hábitat jam in nobis. Hábitat in memória nostra, hábitat in
        cogitatióne, quia usque ad ipsam descéndit imaginatiónem. Quonam modo, inquis? Nimírum
        jacens in præsépio, in virgináli grémio cubans, in monte prǽdicans, in oratióne
        pernóctans, in cruce pendens, in morte pallens, liber inter mórtuos et in inférno
        ímperans, seu étiam tértia die resúrgens, et Apóstolis loca clavórum, victóriæ signa,
        demónstrans, novíssime coram eis cæli secréta conscéndens. Quid horum non vere, non pie,
        non sancte cogitátur?


        Quidquid horum cógito, Deum cógito; et per ómnia est Deus meus. Hæc ego meditári dixi
        sapiéntiam, et prudéntiam judicávi eructáre memóriam suavitátis; quóniam in hujuscémodi
        núcleis virga sacerdotális copiósa prodúxit, quam, in supérnis háuriens, ubérius nobis
        María refúdit. In supérnis plane et ultra Angelos, quæ Verbum ex ipso Patris corde
        suscépit.
      en: >-
        The Word was made flesh, and dwelleth even now among us. He dwelleth in our memory. He
        dwelleth in our thought. He hath come down even unto our imagination; and how sayest thou
        doth he so? By lying in the manger, by nestling in His mother's breast, by preaching upon
        the mountain, by remaining all night in prayer to God, by hanging upon the Cross, by
        turning pale in death, by going down free among the dead and triumphing in hell, by
        rising again the third day, by showing to the Apostles the places of the nails the marks
        of his victory, by ascending up into heaven while they all beheld Him, of which of these
        things think we not with truth, with godliness, with holiness?


        If I think of any of these, I think of God, and He is my God through them all. To think
        of these things I have decreed to be wisdom, and to set forth the memory of their
        sweetness I have judged to be prudence. The rod of Aaron the Priest brought forth buds,
        and bloomed blossoms, and yielded almonds; but these things are the almonds of that Rod
        which came forth out of the stem of Jesse, the Rod whereof sprang the flower, a Rod which
        was raised in Mary into places higher than the earthly tabernacle, higher indeed, even
        into places higher than angels, since she received the Word into herself out of the very
        heart of the Eternal Father.
    responsory:
      la: "R. Surge, própera, amíca mea; jam enim hiems tránsiit, imber ábiit et recéssit, * Flores apparuérunt in terra nostra.\nV. Dóminus dabit benignitátem, et terra nostra dabit fructum suum.\nR. Flores apparuérunt in terra nostra."
      en: "R. Rise up, my love, and make haste. For the winter is past; the rain is over and gone * The flowers appear on our earth.\nV. The Lord shall give that which is good, and our land shall yield her increase.\nR. The flowers appear on our earth."
    status: { la: verified, en: verified }
