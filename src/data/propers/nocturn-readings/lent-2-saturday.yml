id: lent-2-saturday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Luc 15:11-32", en: "Luke 15:11-32" }
    text:
      la: >-
        In illo témpore: Dixit Jesus pharisǽis et scribis parábolam istam: Homo quidam hábuit duos
        fílios, et dixit adolescéntior ex illis patri: Pater, da mihi portiónem substántiæ, quæ me
        contíngit. Et divísit illis substántiam. Et non post multos dies, congregátis ómnibus,
        adolescéntior fílius péregre proféctus est in regiónem longínquam, et ibi dissipávit
        substántiam suam vivéndo luxurióse. Et postquam ómnia consummásset, facta est fames válida
        in regióne illa, et ipse cœpit egére. Et ábiit, et adhǽsit uni cívium regiónis illíus. Et
        misit illum in villam suam, ut pásceret porcos. Et cupiébat implére ventrem suum de
        síliquis, quas porci manducábant: et nemo illi dabat. In se autem revérsus, dixit: Quanti
        mercenárii in domo patris mei abúndant pánibus, ego autem hic fame péreo? Surgam, et ibo ad
        patrem meum, et dicam ei: Pater, peccávi in cœlum et coram te: jam non sum dignus vocári
        fílius tuus: fac me sicut unum de mercenáriis tuis. Et surgens venit ad patrem suum. Cum
        autem adhuc longe esset, vidit illum pater ipsíus, et misericórdia motus est, et accúrrens
        cécidit super collum ejus, et osculátus est eum. Dixítque ei fílius: Pater, peccávi in
        cœlum et coram te, jam non sum dignus vocári fílius tuus. Dixit autem pater ad servos suos:
        Cito proférte stolam primam, et indúite illum, et date ánnulum in manum ejus, et
        calceaménta in pedes ejus: et addúcite vítulum saginátum et occídite, et manducémus et
        epulémur, quia hic fílius meus mórtuus erat, et revíxit: períerat, et invéntus est. Et
        cœpérunt epulári. Erat autem fílius ejus sénior in agro: et cum veníret, et appropinquáret
        dómui, audívit symphóniam et chorum: et vocávit unum de servis, et interrogávit, quid hæc
        essent. Isque dixit illi: Frater tuus venit, et occídit pater tuus vítulum saginátum, quia
        salvum illum recépit. Indignátus est autem, et nolébat introíre. Pater ergo illíus egréssus,
        cœpit rogáre illum. At ille respóndens, dixit patri suo: Ecce, tot annis sérvio tibi, et
        numquam mandátum tuum præterívi, et numquam dedísti mihi hædum, ut cum amícis meis
        epulárer: sed postquam fílius tuus hic, qui devorávit substántiam suam cum meretrícibus,
        venit, occidísti illi vítulum saginátum. At ipse dixit illi: Fili, tu semper mecum es, et
        ómnia mea tua sunt: epulári autem et gaudére oportébat, quia frater tuus hic mórtuus erat,
        et revíxit: períerat, et invéntus est.
      en: >-
        At that time, Jesus spoke to the Pharisees and Scribes this parable: "A certain man had two
        sons. And the younger of them said to his father, 'Father, give me the share of the
        property that falls to me.' And he divided his means between them. And not many days later,
        the younger son gathered up all his wealth, and took his journey into a far country; and
        there he squandered his fortune in loose living. And after he had spent all, there came a
        grievous famine over that country, and he began himself to suffer want. And he went and
        joined one of the citizens of that country, who sent him to his farm to feed swine. And he
        longed to fill himself with the pods that the swine were eating, but no one offered to give
        them to him. But when he came to himself, he said, 'How many hired men in my father's house
        have bread in abundance, while I am perishing here with hunger! I will get up and go to my
        father, and will say to him, Father, I have sinned against heaven and before you. I am no
        longer worthy to be called your son; make me as one of your hired men.' And he arose and
        went to his father. But while he was yet a long way off, his father saw him and was moved
        with compassion, and ran and fell upon his neck and kissed him. And the son said to him,
        'Father, I have sinned against heaven and before you. I am no longer worthy to be called
        your son.' But the father said to his servants, 'Fetch quickly the best robe and put it on
        him, and give him a ring for his finger and sandals for his feet; and bring out the fattened
        calf and kill it, and let us eat and make merry; because this my son was dead, and has come
        to life again; he was lost, and is found.' And they began to make merry. Now his elder son
        was in the field; and as he came and drew near to the house, he heard music and dancing. And
        calling one of the servants he inquired what this meant. And he said to him, 'Your brother
        has come, and your father has killed the fattened calf, because he has got him back safe.'
        But he was angered and would not go in. His father, therefore, came out and began to
        entreat him. But he answered and said to his father, 'Behold, these many years I have been
        serving you, and have never transgressed one of your commands; and yet you have never given
        me a kid that I might make merry with my friends. But when this your son comes, who has
        devoured his means with harlots, you have killed for him the fattened calf.' But he said to
        him, 'Son, you are always with me, and all that is mine is yours; but we were bound to make
        merry and rejoice, for this your brother was dead, and has come to life; he was lost, and is
        found.'"
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, Commentary on Luke, ch. 15"
    text:
      la: >-
        Vides, quod divínum patrimónium peténtibus datur. Nec putes culpam patris, quod
        adolescentióri dedit. Nulla Dei regno infírma ætas: nec fides gravátur annis. Ipse certe se
        judicávit idóneum, qui popóscit. Atque útinam non recessísset a patre, impediméntum
        nescísset ætátis. Sed posteáquam domum pátriam derelínquens péregre proféctus est, cœpit
        egére. Mérito ergo prodégit patrimónium, qui recéssit ab Ecclésia.


        Péregre proféctus est in regiónem longínquam. Quid longínquius, quam a se recédere: nec
        regiónibus, sed móribus separári: stúdiis discrétum esse, non terris; et quasi interfúso
        luxúriæ sæculáris æstu, divórtia habére sanctórum? Etenim qui se a Christo séparat, exsul
        est pátriæ, civis est mundi. Sed nos non sumus ádvenæ atque peregríni, sed cives sumus
        Sanctórum, et doméstici Dei. Qui enim erámus longe, facti sumus prope in sánguine Christi.
        Non invideámus de longínqua regióne remeántibus: quia et nos fúimus in regióne longínqua,
        sicut Isaías docet. Sic enim habes: Qui sedébant in regióne umbræ mortis, lux orta est
        illis. Régio ergo longínqua, umbra est mortis.


        Nos autem, quibus spíritus ante fáciem Christus est Dóminus, in umbra vívimus Christi. Et
        ídeo dicit Ecclésia: In umbra ejus concupívi, et sedi. Ille ígitur vivéndo luxurióse,
        consúmpsit ómnia ornaménta natúræ. Unde tu, qui accepísti imáginem Dei, qui habes
        similitúdinem ejus, noli eam irrationábili fœditáte consúmere. Opus Dei es: noli ligno
        dícere, Pater meus es tu: ne accípias similitúdinem ligni, quia scriptum est: Símiles illis
        fiant qui fáciunt ea.
      en: >-
        Thou seest how that the heavenly goods are given to such as seek them. Neither oughtest thou
        to think the father to blame, because he gave to his younger son. In the kingdom of God
        there is no age of weakness, neither doth faith wax infirm with years. He, surely, who
        asked, deemed himself of sufficient age. And would that he had not left his father! then had
        he been ignorant of the obstacle of his age! But after that he had left his father's house,
        and had gone into a far country, he began to be in want. Well is he said to have wasted his
        substance, who hath cut himself off from the Church!


        "He took his journey into a far country." No man can go farther than to abandon his own
        better self, to leave, not his country, but his morals, and, as it were, in an hideous fever
        of lust after the world, to divorce himself from the ties that bind him to holy things. Yea,
        he that turneth his back on Christ, banisheth himself from his Fatherland, and becometh a
        citizen of the world. But we are no more strangers and foreigners, but fellow-citizens with
        the saints, and of the household of God, since we who sometimes were afar off, are made nigh
        by the Blood of Christ. Let us not envy the pleasures of them who remain in the far country.
        We too have once been there, but, as saith Isaiah, "they that dwelt in the land of the
        shadow of death, upon them hath the light shined." And that far country is the land of the
        shadow of death.


        But we to whom the Lord Christ is the breath of life, are alive under the shadow of Christ.
        And therefore it is that the Church saith, "I sat down under His shadow with great
        delight." The prodigal son by riotous living wasted all the gifts of nature. Take warning, O
        thou who art made in the image and likeness of God, lest thou waste the same by brutish
        wallowing. Thou art the work of God; say not to a stock, "Thou art my father," lest thou
        grow into the likeness of a stock, as it is written, "They that make them are like unto
        them."
    responsory:
      la: "R. Pater, peccávi in cælum, et coram te: jam non sum dignus vocári fílius tuus: * Fac me sicut unum ex mercenáriis tuis.\nV. Quanti mercenárii in domo patris mei abúndant pánibus, ego autem hic fame péreo! Surgam, et ibo ad patrem meum, et dicam ei.\nR. Fac me sicut unum ex mercenáriis tuis."
      en: "R. Father, I have sinned against heaven and before thee, and am no more worthy to be called thy son. * Make me as one of thine hired servants.\nV. How many hired servants of my father's have bread enough and to spare, and I perish with hunger! I will arise and go to my father and will say unto him.\nR. Make me as one of thine hired servants."
    status: { la: verified, en: verified }
