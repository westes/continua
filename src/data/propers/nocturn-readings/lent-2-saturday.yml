# web/www/horas/{Latin,English}/Tempora/Quad2-6.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad2-6.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Ambrose
# excerpt split only to fill the fixed 3-lesson slot count). Responsory1
