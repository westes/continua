# Matins readings for the Translation of St. Benedict (Jul 11), from
# web/www/horas/Latin/SanctiM/07-11M.txt (English/SanctiM/07-11M.txt where it exists).
#
# Nocturn 1 is not authored here: the bible reading plan supplies it (sanctoral feasts carry
# no proper scripture lessons outside their Gospel). Nocturn 2: Lectio5-8, one continuous sermon of St. Bernard, combined
# into one reading with Responsory5 (the first of the group, this store's
# convention). Nocturn 3: the full Matt 19:27-29 pericope (same text as the
# Transitus's own reading) then St. Peter Damian's Sermon 9 on St. Benedict
# (same text as the Transitus), with the reference's Responsory9. The
# reference's own Lectio9-12 here is Bede's homily for Benedict Biscop, a generic
# Matt 19:27 homily that never mentions the founder; replaced deliberately.
id: st-benedict-translation
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Bernard, Abbot, Sermon on the Birthday of St. Benedict"
    text:
      la: |
        Gloriósi Patris nostri Benedícti dulcíssimum nomen cum omni vobis jucunditáte amplecténdum est et honorándum; quoniam ipse Dux noster, ipse Magíster et Légifer noster est. Refíciat vos sánctitas ejus, justítia ejus, píetas ejus. Arbor fuit beátus Benedíctus, grandis atque fructífera, tanquam lignum, quod plantátum est secus decúrsus aquárum. Sic fuit plantátus secus decúrsus aquárum, quóniam fructum suum dedit in témpore suo. De fructu ejus sunt illi tria, quæ supérius tétigi: sánctitas ejus, justítia ejus, píetas ejus. Sanctitátem mirácula probant, doctrína pietátem, vita justítiam.

        Sed quómodo tibi appóno ejus mirácula? Numquid ut mirácula fácere velis? Nequáquam: sed ut miráculis ejus innitáris, vidélicet ut confídas et gáudeas, quod sub tali pósitus es pastóre, quod tantum meruísti habére Patrónum. Omníno enim valde potens est in cælis, qui tam potens éxstitit in terris: secúndum magnitúdinem grátiæ, magnitúdine glóriæ exaltátus. Nam et juxta radícum quantitátem rami prodíre noscúntur et quot radícibus arbor innítur, tot ramis, sicut ajunt, decorátur. Sic ergo, licet non habeámus nostra, consolátio magna nobis esse debent Patróni nostri mirácula.

        Doctrína vero ínstruit nos, et dírigit gressus nostros in viam pacis. Porto vitæ justítia omníno róborat et ánimat nos, ut tanto magis accendámur ad agénda quæ dócuit, quanto certi sumus, eum non ália docuísse quam fécerit. Sermo quidem vivus et efficax exémplum óperis est, plúrimum fáciens suadíbile quod dícitur, dum monstrat factíbile quod suadétur. In hunc ergo modum sánctitas confórtat, píetas infórmat, justítia confírmat.  Quantæ enim pietátis fuit, quod non solum præséntibus prófuit, sed et pro futúris sollícitus fuit? Non solum his, qui tunc errant, fructum tulit hæc arbor, sed usque hódie fructus ejus et manet et crescit.

        Diléctus plane Deo et homínibus, cujus non sola præséntia in benedictióne fuit, sicut sunt multi dilécti Deo soli, quia soli Deo jam cógniti: sed et memória ejus étiam nunc in benedictióne est. Nam et usque hódie in tríplicem amóris Dómini confessiónem, tríplici hoc fructu pascit Dómini gregem. Pascit vita, pascit doctrína, pascit et intercessióne. Per quem incessánter adjúti, fructificáte et vos, caríssimi, quóniam in hoc pósiti estis, ut eatis et fructum afferátis.
      en: |
        The most sweet name of our glorious Father, Benedict, ought to be embraced and honored by you with every sign of joy because he is your leader, your master, and your lawgiver. Let his sanctity, his piety, his justice refresh you. The blessed Benedict was a great and fruitful tree, like a tree which is planted near the running waters. He was so planted near the running waters that he brought forth his fruit in due season. To his fruit belong the three things whereof I have made mention above: his sanctity, his justice, his piety. Miracles prove his sanctity; his teaching, his piety; his life, his justice.

        But why am I to propose his miracles to you? In order that you may want to perform miracles? By no means! But that you may lean on his miracles for support. In other words, that you may be confident and glad because you have merited such a great protector. For most certainly he who was so great and powerful on earth is very powerful in heaven, being exalted to a greatness of glory corresponding to the magnitude of his grace. For the branches are known to shoot forth according to the size of the roots, and with as many roots as the tree is supported, with so many branches, as they say, is it adorned. Thus, then, though we may not have the power to perform miracles, the miracles of our patron should be a great consolation to us.

        His teaching, too, instructs us and guides our steps to the path of peace. Further, the justice of his life in every way strengthens and vivifies us, so that we are so much the more enkindled to do the things he has taught us as we are assured that he has not taught us otherwise than he acted. The example of his work is, indeed, a living and effective sermon, making what is said very pleasing to hear in that it shows that what is urged can be done. Consequently, in this manner his sanctity consoles us; his piety enlightens us; his justice strengthens us. Of what great piety was he that he not only benefited those present to him, but was also solicitous for those to come? Not only for those who lived then did this tree produce its fruit, but even today its fruit multiplies and remains.

        Surely beloved of God and men is he whose presence was not only in benediction (for there are many who are beloved of God alone because they are now known to God alone), but his memory also is even now in benediction. For even until this day, as a threefold confession of his love for his Lord, he feeds the flock of the Lord with this three-fold fruit. He feeds it by his life; he feeds it by his teaching; he feeds it through his intercession. Being unceasingly aided by him, do you also, dearest brethren, bear fruit, because for this have you been appointed, “that you should go and bring forth fruit.”
    responsory:
      la: |
        R. In aqua ex petra prodúcta, Moyses; in ferro vero, quod ex profúndo atque rédiit, Elisǽus; † in aquæ itínere, Petrus; in corvi obediéntia, Elías;
        * In luctu autem mortis inimíci, David exhibétur.
        V. Vir iste spíritu ómnium justórum plenus fuit.
        R. In luctu autem mortis inimíci, David exhibétur.
      en: |
        R. In making the rock to yield forth water, Moses; in the iron, which came from the bottom of the lake, Eliseus; in the walking upon the water, Peter; in the obedience of the crow, Elias;
        * In lamenting the death of his enemy, David is brought forth.
        V. This one man was full of the spirit of all good men.
        R. In lamenting the death of his enemy, David is brought forth.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 19:27-29", en: "Matt 19:27-29" }
    text:
      la: >-
        In illo témpore: Dixit Petrus ad Jesum: Ecce, nos relíquimus ómnia, et secúti sumus te:
        quid ergo erit nobis? Jesus autem dixit illis: Amen, dico vobis, quod vos, qui secúti
        estis me, in regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ, sedébitis
        et vos super sedes duódecim, judicántes duódecim tribus Israël. Et omnis, qui relíquerit
        domum, vel fratres, aut soróres, aut patrem, aut matrem, aut uxórem, aut fílios, aut
        agros, propter nomen meum, céntuplum accípiet, et vitam ætérnam possidébit.
      en: >-
        At that time, Peter said to Jesus, "Behold, we have left all and followed You; what then
        shall we have?" And Jesus said to them, "Amen I say to you that you who have followed
        Me, in the regeneration when the Son of Man shall sit on the throne of His glory, shall
        also sit on twelve thrones, judging the twelve tribes of Israel. And everyone who has
        left house, or brothers, or sisters, or father, or mother, or wife, or children, or
        lands, for My name's sake, shall receive a hundredfold, and shall possess life
        everlasting."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Peter Damian, Bishop, Sermon 9, On the Nativity of St. Benedict, Abbot (on Matt 19:27-29)"
    text:
      la: >-
        Ecce nos relíquimus ómnia, et secúti sumus te. Solémne verbum, magna promíssio, opus
        sanctum, dignum benedictióne: relínquere ómnia, et sequi Christum. Hæc sunt verba
        voluntárie persuasória paupertátis, quæ monastéria genuérunt, quæ claustra mónachis,
        anachorétis silvas copiósius replevérunt. Hæc enim sunt, de quibus psallit Ecclésia:
        Propter verba labiórum tuórum ego custodívi vias duras; perceptúra requiem pro labóre,
        pro paupertáte divítias, pro tribulatióne mercédem. Magnum revéra est relínquere ómnia,
        sed majus Christum sequi, cum multos ómnia reliquísse, nec Christum secútos fuísse
        legámus. Hoc opus, hic labor est, hic salútis humánæ summa consístit; nec Christum
        póssumus sequi, nisi ómnia relinquámus, quia exsúltat ut gigas ad curréndam viam, et
        onerátus eum sequi non potest.


        Ecce, inquit, nos relíquimus ómnia, non solum facultátes mundi, sed et ánimi quoque
        cupiditátes: neque enim relínquit ómnia, qui retínuit vel seípsum; immo vero nihil prodest,
        sine seípso cétera reliquísse, quandóquidem nullum áliud onus est grávius hómini, quam
        homo ipse. Quis enim tyránnus crudélior, quæ sǽvior potéstas hómini, quam hóminis ipsíus
        volúntas? Séquitur: Quid ergo erit nobis? Jam ómnia relíquit Petrus, jam non solum
        séquitur, sed et diu secútus est; et nunc primum intérrogat, quidnam sit acceptúrus. Quid
        est, Petre? Nonne obediéntiam promisísti in auris auditióne, non in pacti conventióne? Sed
        audíte jam, quid loquátur Dóminus Deus, et atténdite spem, in qua mundo fluctuánte
        speráre debémus: Sedébitis, ait Dóminus, ait Véritas. Solémnis séssio, grata quies, plena
        sufficiéntia.


        Sed ne magnæ promissiónis dulcédinem longánimis expectátio contorquéret, mentis nostræ
        mobilitátem sermónem témperat dulcióri. Novit enim ipse figméntum nostrum, quóniam
        dilatiónis moras pusillanímitas nostra non sústinet; ideóque benignitáte sua huic quoque
        obviat cogitatióni, et occúrrit étiam ex hac parte, dicens: Et omnis, qui relíquerit
        domum, aut patrem, aut matrem, aut fratrum, aut uxórem, aut agros, aut fílios, propter
        nomen meum, céntuplum accípiet, et vitam ætérnam possidébit. Obstrúctum est certe os
        loquéntium iníqua. Jamque confundántur omnes iníqua agéntes supervácue. Habémus enim
        promissiónem vitæ hujus, quæ nunc est, páriter et futúræ, manifestúmque est præséntis
        témporis esse céntupli promissiónem, ex eo nimírum quod séquitur: Et vitam ætérnam
        possidébit.


        Qui ergo nondum céntuplum accepérunt, scruténtur corda sua, et univérsa mánuum suárum
        stúdia diligénter exáminent; nec dúbium, quin invéniant ángulum et diversórium, quod
        Salvátor non novit. Sed quid est céntuplum istud, nisi consolatiónes visitationésque et
        primítiæ Spíritus, qui super mel dulcis est, nisi testimónium consciéntiæ nostræ, nisi
        læta et jucundíssima justórum expectátio, nisi memória abundántiæ suavitátis Dei, et
        magna vere multitúdo dulcédinis ejus, quam nec expértis necésse est dícere, nec
        inexpértis illis verbis exprímere quiquam potest? Cui vero sic speciáliter totus
        evangélicæ lectiónis excúrsus assignári potest, quemádmodum Patri et Magístro nostro
        beáto Benedícto? Hic a puerítia mundum cum flore relíquit, et curréntem Christum cursu
        rapidíssimo secútus est, nec déstitit, donec consequerétur.
      en: >-
        Behold, we have left all things, and have followed thee. A solemn word, a great promise,
        a holy work, worthy of a blessing: to leave all things, and follow Christ. These are the
        words that willingly persuade to poverty, which have brought forth monasteries, which have
        filled cloisters with monks and the woods more abundantly with hermits. For these are they
        of whom the Church sings: Because of the words of thy lips I have kept hard ways; about to
        receive rest for labour, riches for poverty, reward for tribulation. It is indeed a great
        thing to leave all things, but a greater thing to follow Christ, since we read that many
        left all things, yet did not follow Christ. This is the work, this is the labour, herein
        lies the sum of man's salvation; nor can we follow Christ unless we leave all things,
        because He rejoiceth as a giant to run the way, and one who is burdened cannot follow Him.


        Behold, he saith, we have left all things — not only the goods of the world, but also the
        desires of the mind: for he does not leave all things who has kept even himself; indeed it
        profits nothing to have left all else without leaving oneself, since no burden is heavier
        upon a man than the man himself. For what tyrant is more cruel, what power more savage upon
        a man, than the will of the man himself? There follows: What then shall we have? Peter has
        already left all things; he not only follows now, but has long followed; and now for the
        first time he asks what he is to receive. What is this, Peter? Didst thou not promise
        obedience upon hearing with thine ears, not upon the striking of a bargain? But hear now
        what the Lord God says, and attend to the hope in which we ought to hope while the world is
        tossed about: Ye shall sit, says the Lord, says the Truth. A solemn sitting, a welcome rest,
        a full sufficiency.


        But lest a long-drawn-out waiting should twist the sweetness of the great promise, He
        tempers the fickleness of our mind with a sweeter word. For He himself knows our frame,
        since our faintheartedness cannot bear the delays of postponement; and so in His kindness
        He meets this thought also, and comes to meet us on this side too, saying: And every one
        that hath left house, or brethren, or sisters, or father, or mother, or wife, or children,
        or lands, for my name's sake, shall receive an hundredfold, and shall possess life
        everlasting. Surely the mouth of them that speak unjust things is stopped. Now let all be
        confounded that work iniquity in vain. For we have the promise of this life, which now is,
        together with that which is to come; and it is plain that the hundredfold promise belongs
        to the present time, from what follows: and shall possess life everlasting.


        Let those, then, who have not yet received the hundredfold, search their own hearts, and
        diligently examine all the labours of their hands; and there is no doubt they will find a
        corner and a lodging-place which the Saviour does not know. But what is this hundredfold,
        but the consolations and visitations and firstfruits of the Spirit, which is sweeter than
        honey; but the testimony of our own conscience; but the glad and most joyful expectation
        of the just; but the memory of the abundance of God's sweetness, and the truly great
        multitude of His sweetness, which it is not necessary to tell to those who have
        experienced it, nor can any words express it to those who have not? But to whom can this
        whole course of the Gospel reading be so specially assigned, as to our Father and Master,
        blessed Benedict? He from boyhood left the world in its flower, and followed the running
        Christ with the swiftest course, nor did he cease until he had overtaken Him.
    responsory:
      la: |
        R. Quemádmodum Elías, cǽlitus imbres, o Pater, deduxísti oleúmque celériter efflúere fecísti,
        * Mórtuos suscitásti, aliáque innúmera perpetrásti mirácula.
        V. Idcírco memóriam tuam devóta mente celebrámus, o Benedícte.
        R. Mórtuos suscitásti, aliáque innúmera perpetrásti mirácula.
      en: |
        R. In the same manner as Elias, you made rain come from heaven, O Father, you led oil to flow quickly
        * You restored the dead to life and performed innumerable other miracles.
        V. For that reason we celebrate your memory with devoted minds, O Benedict.
        R. You restored the dead to life and performed innumerable other miracles.
    status: { la: verified, en: draft }
