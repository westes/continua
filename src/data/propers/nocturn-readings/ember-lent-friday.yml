# Matins Nocturn content for Lent Ember Friday (Feria Sexta Quattuor
# Temporum Quadragesimæ) — Gospel pericope (John 5:1-15) sourced from
# web/www/missa/Latin/Tempora/Quad1-5.txt and missa/English/Tempora/
# Quad1-5.txt (horas/Tempora/Quad1-5.txt only gives the incipit + "Et
# réliqua"); homily sourced from horas/Latin/Tempora/Quad1-5.txt and
# horas/English/Tempora/Quad1-5.txt. No Monastic-track override exists —
# Latin/TemporaM/Quad1-5.txt is a bare `@Tempora/Quad1-5` pass-through
# (plus a Cistercian-only extra responsory, not used here).
#
# Recombined into one reading, same convention as ember-lent-wednesday.yml
# (see ember-september-friday.yml's own doc comment for the fuller
# rationale): St. Augustine's homily is one continuous text on the pool
# of Bethesda, split only to fill the fixed 3-lesson slot count.
# Responsory: unlike Wednesday, none of this day's own three (Responsory
# 1/2/3, all bare cross-references to the 1st Sunday of Lent's own
# generic Nocturn responsories, @Tempora/Quad1-0:Responsory4/5/6) is
# genuinely proper to Friday specifically — no tie-break available, so
# the "first one, when several collapse" convention (see
# ember-september-friday.yml) applies: Lectio1's own, Responsory4.
id: ember-lent-friday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Joann 5:1-15", en: "John 5:1-15" }
    text:
      la: >-
        In illo témpore: Erat dies festus Judæórum, et ascéndit Jesus Jerosólymam. Est autem Jerosólymis
        Probática piscína, quæ cognominátur hebráice Bethsáida, quinque pórticus habens. In his jacébat multitúdo
        magna languéntium, cæcórum, claudórum, aridórum exspectántium aquæ motum. Angelus autem Dómini descendébat
        secúndum tempus in piscínam, et movebátur aqua. Et, qui prior descendísset in piscínam post motiónem
        aquæ, sanus fiébat, a quacúmque detinebátur infirmitáte. Erat autem quidam homo ibi, trigínta et octo
        annos habens in infirmitáte sua. Hunc cum vidísset Jesus jacéntem, et cognovísset, quia jam multum
        tempus habéret, dicit ei: Vis sanus fíeri? Respóndit ei lánguidus: Dómine, hóminem non hábeo, ut, cum
        turbáta fúerit aqua, mittat me in piscínam: dum vénio enim ego, álius ante me descéndit. Dicit ei Jesus:
        Surge, tolle grabátum tuum, et ámbula. Et statim sanus factus est homo ille: et sústulit grabátum suum,
        et ambulábat. Erat autem sábbatum in die illo. Dicébant ergo Judǽi illi, qui sanátus fúerat: Sábbatum
        est, non licet tibi tóllere grabátum tuum. Respóndit eis: Qui me sanum fecit, ille mihi dixit: Tolle
        grabátum tuum, et ámbula. Interrogavérunt ergo eum: Quis est ille homo, qui dixit tibi: Tolle grabátum
        tuum et ámbula? Is autem, qui sanus fúerat efféctus, nesciébat, quis esset. Jesus enim declinávit a
        turba constitúta in loco. Póstea invénit eum Jesus in templo, et dixit illi: Ecce, sanus factus es: jam
        noli peccáre, ne detérius tibi áliquid contíngat. Abiit ille homo, et nuntiávit Judǽis, quia Jesus esset,
        qui fecit eum sanum.
      en: >-
        At that time, there was a feast of the Jews, and Jesus went up to Jerusalem. Now there is at Jerusalem, by
        the Sheepgate, a pool called in Hebrew Bethsaida, having five porticoes. In these were lying a great
        multitude of the sick, blind, lame, and those with shriveled limbs, waiting for the moving of the water.
        For an angel of the Lord used to come down at certain times into the pool, and the water was troubled. And
        the first to go down into the pool after the troubling of the water was cured of whatever infirmity he
        had. Now a certain man was there who had been thirty-eight years under his infirmity. When Jesus saw him
        lying there, and knew that he had been in this state a long time, He said to him, Do you want to get well?
        The sick man answered Him, Sir, I have no one to put me into the pool when the water is stirred; for while
        I am coming, another steps down before me. Jesus said to him, Rise, take up your pallet and walk. And at
        once the man was cured. And he took up his pallet and began to walk. Now that day was a Sabbath. The Jews
        therefore said to him who had been healed, It is the Sabbath; you are not allowed to take up your pallet.
        He answered them, He who made me well said to me, "Take up your pallet and walk." They asked him then,
        Who is the man who said to you, "Take up your pallet and walk"? But the man who had been healed did not
        know who it was, for Jesus had quietly gone away, since there was a crowd in the place. Afterwards Jesus
        found him in the temple, and said to him, Behold, you are cured. Sin no more, lest something worse befall
        you. The man went away and told the Jews that it was Jesus Who had healed him.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Tract 17 on John (on the pool of Bethesda)"
    text:
      la: >-
        Videámus quid volúerit significáre in illo uno, quem étiam ipse servans unitátis mystérium, de tot
        languéntibus unum sanáre dignátus est. Invénit in annis ejus númerum quemdam languóris: trigínta et octo
        annos habébat in infirmitáte. Hic númerus quómodo magis ad languórem pertíneat, quam ad sanitátem, paulo
        diligéntius exponéndum est. Inténtos vos volo: áderit Dóminus, ut cóngrue loquar, et sufficiénter
        audiátis. Quadragenárius númerus sacrátus nobis in quadam perfectióne commendátur; notum esse árbitror
        caritáti vestræ: testántur sæpíssime divínæ Scriptúræ: jejúnium hoc número consecrátum esse, bene nostis.
        Nam et Móyses quadragínta diébus jejunávit, et Elías tótidem: et ipse Dóminus noster et Salvátor Jesus
        Christus hunc jejúnii númerum implévit. Per Móysen significátur Lex, per Elíam significántur Prophétæ,
        per Dóminum significátur Evangélium. Ideo in illo monte tres apparuérunt, ubi se discípulis osténdit in
        claritáte vultus et vestis suæ: appáruit enim médius inter Móysen et Elíam, tamquam Evangélium
        testimónium habéret a Lege et Prophétis.


        Sive ergo in Lege, sive in Prophétis, sive in Evangélio, quadragenárius númerus nobis in jejúnio
        commendátur. Jejúnium autem magnum et generále est, abstinére ab iniquitátibus et illícitis voluptátibus
        sǽculi, quod est perféctum jejúnium: Ut abnegántes impietátem et sæculáres cupiditátes, temperánter et
        juste et pie vivámus in hoc sǽculo. Huic jejúnio quam mercédem addit Apóstolus? Séquitur et dicit:
        Exspectántes illam beátam spem, et manifestatiónem glóriæ beáti Dei et Salvatóris nostri Jesu Christi. In
        hoc ergo sǽculo quasi quadragésimam abstinéntiæ celebrámus, cum bene vívimus, cum ab iniquitátibus et ab
        illícitis voluptátibus abstinémus: sed quia hæc abstinéntia sine mercéde non erit, exspectámus beátam
        illam spem, et revelatiónem glóriæ magni Dei et Salvatóris nostri Jesu Christi. In illa spe, cum fúerit
        de spe facta res, acceptúri sumus mercédem denárium. Ipsa enim merces rédditur operáriis in vínea
        laborántibus, secúndum Evangélium, quod vos credo reminísci: neque enim ómnia commemoránda sunt tamquam
        rúdibus et imperítis. Denárius ergo, qui accépit nomen a número decem, rédditur, et conjúnctus
        quadragenário fit quinquagenárius: unde cum labóre celebrámus Quadragésimam ante Pascha; cum lætítia
        vero, tamquam accépta mercéde, Quinquagésimam post Pascha.


        Mementóte quod proposúerim númerum trigínta octo annórum in illo lánguido. Volo expónere, quare númerus
        ille trigésimus et octávus, languóris sit pótius quam sanitátis. Ergo, ut dicébam, cáritas implet Legem:
        ad plenitúdinem Legis in ómnibus opéribus pértinet quadragenárius númerus. In caritáte autem duo
        præcépta nobis commendántur: Díliges Dóminum Deum tuum ex toto corde tuo, et ex tota ánima tua, et ex
        tota mente tua: et díliges próximum tuum sicut teípsum. In his duóbus præcéptis tota Lex pendet, et
        Prophétæ. Mérito et illa vídua omnes facultátes suas, duo minúta misit in dona Dei: mérito et pro illo
        lánguido a latrónibus sauciáto stabulárius duos nummos accépit, unde sanarétur: mérito apud Samaritános
        bíduum fecit Jesus, ut eos caritáte firmáret. Binário ergo isto número cum áliquid boni significátur,
        máxime bipertíta cáritas commendátur. Si ergo quadragenárius númerus habet perfectiónem Legis, et Lex
        non implétur nisi in gémino præcépto caritátis: quid miráris, quia languébat, qui ad quadragínta, duo
        minus habébat?
      en: >-
        Let us see what is mystically signified by that one infirm man whom alone the Lord, keeping to a
        mysterious unity, chose out of so many sufferers, to be the subject of His healing power. He found in him
        a certain number of years of sickness. He had had an infirmity thirty and eight years. How this number is
        proper rather to weakness than to health, will now be the subject of a few careful remarks. I bespeak
        your attention; the Lord will be present, that I may speak fitly, and you may understand. The number
        forty is put before us as hallowed, and, in a way, perfect. I think that your love knoweth this — God's
        Scriptures often and often witness it. Ye well know that a Fast of this number of days is hallowed. Moses
        fasted forty days. Elias did the same. And our Lord and Saviour Jesus Christ Himself fasted this number of
        days complete. Moses representeth the Law, Elias the Prophets, and the Lord the Gospel. And therefore
        these three appeared on the Mount of the Transfiguration. There the Lord showed Himself to His disciples
        with His Face shining as the sun, and His raiment glistering; and He stood between Moses and Elias; as it
        were, the Gospel receiving testimony, on the one hand from the Law, and, on the other, from the Prophets.


        Whether, therefore, it be in the Law, or in the Prophets, or in the Gospel, the number of forty is
        recommended to us for Fast-days. The great and general Fast is this — to abstain from the iniquity of the
        world, and her forbidden pleasures. This is the perfect Fast, that, denying ungodliness, and worldly
        lusts, we should live soberly, righteously, and godly in this present world. After such a Fast, what is
        the Feast that followeth? Hear what the Apostle saith in continuation — Looking for that blessed hope, and
        the glorious appearing of our great God and Saviour Jesus Christ. We, then, make our pilgrimage in this
        world a Lent, by living good lives, and abstaining from her iniquities and her forbidden pleasures. But at
        the end of this life-long Lent there will be an Easter indeed. We look for that blessed hope, and the
        glorious appearing of our great God and Saviour Jesus Christ. When that hope is realised, when that faith
        is swallowed up in knowledge, then indeed shall we receive every man a penny. In good sooth, it is true
        that every labourer in the vineyard will get his wages — witness that Gospel which I believe ye have not
        forgotten, and which it is not my business to quote again as if ye were ignorant children. Now, the word
        used in the original for this penny which the labourers received is denarion. And the derivation of the
        word denarion is the numeral decem, ten. There are forty days in Lent, and if we add ten, we get fifty. So
        do we toil in fasting for the forty days of Lent before Easter, and, then, when we have, as it were,
        received our reward, we keep holiday for the fifty days of Eastertide.


        Remember how I remarked, that the man healed by our Lord at the pool of Bethesda had had an infirmity
        thirty and eight years. I wish to explain why this number of thirty-eight is proper rather to weakness
        than to health. Love is the fulfilling of the law; to the fulfilling of the law belongeth in every work
        the number forty. But in love we have given us two precepts — Thou shalt love the Lord thy God with all
        thy heart, and with all thy soul, and with all thy mind. This is the first and great commandment. And the
        second is like unto it — Thou shalt love thy neighbour as thyself. On these two commandments hang all the
        law and the prophets. When the widow gave all she had for an offering to God she gave two mites; the
        inn-keeper received two pence wherewith to cure him that had fallen among thieves; Jesus abode for two
        days among the Samaritans, that He might establish them in love. When, then, anything good is spoken of
        as two, the two great divisions of love are the chief mystic interpretation. If, then, the law is
        fulfilled in the number forty, and it is not fulfilled if there be lacking the two precepts of love, what
        wonder is it that he was infirm who lacked two of forty?
    responsory:
      la: "R. Emendémus in mélius, quæ ignoránter peccávimus: ne súbito præoccupáti die mortis, quærámus spátium pœniténtiæ, et inveníre non possímus: * Atténde, Dómine, et miserére, quia peccávimus tibi.\nV. Adjuva nos, Deus salutáris noster, et propter honórem nóminis tui, Dómine, líbera nos.\nR. Atténde, Dómine, et miserére, quia peccávimus tibi."
      en: "R. Let us amend for the better in that wherein we have sinned unknowingly, or ever the day of death suddenly prevent us, and we seek a place of repentance, and find none. * Give heed, O Lord, and have mercy upon us, for we have sinned against thee.\nV. Help us, O God of our salvation, and for the glory of thy Name deliver us, O Lord.\nR. Give heed, O Lord, and have mercy upon us, for we have sinned against thee."
    status: { la: verified, en: verified }
