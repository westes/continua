# Matins Nocturn 2 reading for St. Henry, Emperor and Confessor
# (July 15). Sourced directly from web/www/horas/Latin/Sancti/07-15.txt,
# English/Sancti/07-15.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (his `[Rule]` is `vide
# C5`) -- defers to the Common's own Nocturn 3, not transcribed here.
id: st-henry
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Henrícus, cognoménto Pius, e duce Baváriæ rex Germániæ ac póstmodum
        Romanórum imperátor, temporális regni non conténtus angústiis, pro
        adipiscénda immortalitátis coróna sédulam ætérno Regi exhíbuit
        servitútem. Adépto enim império, religióni amplificándæ studióse
        incúmbens, ecclésias ab infidélibus destrúctas magnificéntius reparávit,
        plurimísque largitiónibus et prǽdiis locupletávit. Monastéria aliáque
        loca pia vel ipse ædificávit, vel assignátis redítibus auxit. Episcopátum
        Bambergénsem, hereditáriis ópibus fundátum, beáto Petro Romanóque
        Pontífici vectigálem fecit. Benedíctum octávum, a quo impérii corónam
        accéperat, prófugum excépit, suǽque Sedi restítuit.


        In Cassinénsi monastério, gravi deténtus infirmitáte, a sancto Benedícto,
        insígni miráculo, sanátus est. Románam Ecclésiam amplíssimo diplómate
        munerátus, eídem tuéndæ bellum advérsus Græcos suscépit, et Apúliam, diu
        ab illis posséssam, recuperávit. Nihil sine précibus ággredi sólitus,
        Angelum Dómini sanctósque Mártyres tuteláres pro se pugnántes ante áciem
        intérdum vidit. Divína autem protéctus ope, bárbaras natiónes précibus
        magis quam armis expugnávit. Pannóniam adhuc infidélem, trádita Stéphano
        regi soróre sua in uxórem, eóque baptizáto, ad Christi fidem perdúxit.
        Virginitátem raro exémplo matrimónio junxit, sanctámque Cunegúndam,
        cónjugem suam, propínquis ejus, morti próximus, illibátam restítuit.


        Dénique, rebus ómnibus, quæ ad impérii honórem et utilitátem
        pertinébant, summa prudéntia dispósitis, et illústribus per Gálliam,
        Itáliam et Germániam religiósæ munificéntiæ vestígiis passim relíctis;
        postquam heróicæ virtútis suavíssimum odórem longe latéque diffúderat,
        sanctitáte quam sceptro clárior, ad regni cæléstis prǽmia, consummátis
        vitæ labóribus, a Dómino vocátus est anno salútis millésimo vigésimo
        quarto. Cujus corpus in ecclésia beatórum Apostolórum Petri et Pauli
        Bambergæ cónditum fuit; statímque ad ejus túmulum multa mirácula, Deo
        ipsum glorificánte, patráta sunt. Quibus póstea rite probátis, Eugénius
        tértius Sanctórum número illum adscrípsit.
      en: >-
        Henry II., surnamed the Pious, became successively Duke of Bavaria, King of
        Germany, and the Emperor of the Romans. His hope soared beyond the short
        enjoyment of a fleeting kingdom, and he aimed at the possession of an
        unfading crown by living as the loyal servant of the Eternal King. After he
        became Emperor, he earnestly set himself to the furtherance of the cause of
        godliness. He restored with new splendour the Churches which had been
        ruined by the unbelievers, and enriched them with many offerings and
        possessions. Monasteries and other godly places he either built himself, or
        endowed them with allowances. He founded out of his own family inheritance
        the Bishopric of Bamberg, and made it tributary to Blessed Peter and to the
        Bishop of Rome. When Benedict VIII, who had set on his head the Imperial
        crown, was an exile, he hospitably received him, and afterwards restored
        him to his See.


        Then he was struck down with a grievous sickness in the Monastery of Monte
        Cassino; he was healed by an evident miracle through the intercession of
        St. Benedict. He was a princely benefactor to the Church of Rome, for the
        defence of which he entered into a war against the Greeks, and took again
        from them the province of Apulia, which they had long possessed. He never
        undertook anything until he had made it a subject of prayer. And in battle
        he once saw the Angel of the Lord and the Holy Martyrs, his patrons, under
        whose protection he had placed his army, fighting for him in front of his
        line. With the help of God, he prevailed against the tribes of savages more
        by prayer than by arms. He gave his sister in marriage to King Stephen of
        Hungary, whom he induced to be baptized, and so brought all that country to
        believe in Christ. His marriage with the holy maiden Cunegunda is one of the
        rare instances of the union of two virgins. When he drew near to death, he
        gave her back inviolate to her kinsfolk.


        He managed with great wisdom whatever could tend to the honour and
        usefulness of the Empire. He left in France, Italy, and Germany, splendid
        monuments of his godly munificence. The perfume of his saintly life spread
        its sweetness far and wide, and the glory of his holiness outshone the
        splendour of his crown. When the work of his life was done, he was called
        by the Lord to the possession of an eternal kingdom, in the year of
        salvation 1024. His body was buried in the Church of the Blessed Apostles
        Peter and Paul at Bamberg, and God glorified him by the miracles which
        began forthwith to take place at his grave. The same being duly proved,
        Eugene III numbered him among the Saints.
    status: { la: verified, en: verified }
