# Matins Nocturn 2 reading for St. Dorothy, Virgin and Martyr. Sourced directly from
# web/www/horas/Latin/Sancti/02-06o.txt, English/Sancti/02-06o.txt.
# single lesson (Lectio93), one continuous account.
id: st-dorothy
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Doróthea virgo, ex Cæsaréa Cappadociæ, propter Christi confessiónem ab Apricio
        præside comprehensa, Chrystæ et Callistæ soróribus, quæ a fide defécerant,
        tradita est, ut eam a propósito removérent. Sed contra factum est; nam eas
        Doróthea ad cultum christianæ religiónis redúxit, propter quam étiam martyrium
        suscepérunt. Quare Virgo equuleo diu torta et palmis cæsa, ad extremum cápitis
        damnata, duplicatam virginitátis et martyrii palmam accepit.
      en: >-
        The maiden Dorothy, of Caesarea in Cappadocia, was betrayed to Apricius the
        President by her two sisters, Chrysta and Callista, who had denied the faith, in
        the hope that he would induce her to do likewise. She was arrested, but it came
        not to pass as they hoped. On the contrary, she brought them back to the
        Christian worship, and they received martyrdom. She was long tormented upon the
        rack, and scourged with palm branches, and in the end was beheaded, receiving
        the double palm of virginity and martyrdom.
    status: { la: verified, en: verified }
