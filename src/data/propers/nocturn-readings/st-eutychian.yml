# Matins Nocturn 2 reading for St. Eutychian, Pope and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/12-09-Eutychianus.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-eutychian
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Eutychianus, natióne Tuscus, pátria Lunensis, Marino patre, post beáti Felícis sacerdótium
        Románæ Ecclésiæ Episcopátum suscépit. Constítuit fruges, fabas, et uvas super altári
        benedici: itémque a fidélibus nullatenus mártyrem sepeliri sine dalmatica, aut purpurato
        colobio. Qui cum per divérsa loca trecentos sexagínta duos mártyres sua manu sepelisset,
        illis et ipse sociatus, sub Numeriano Imperatóre martyrio coronátus est sexto Idus
        Decémbris, sepultúsque in cœmetério Callísti via Appia. Quinque ordinationibus mense
        Decémbri creávit Presbyteros quatuórdecim, Diáconos quinque, Epíscopos per divérsa loca
        novem. Vixit in Pontificátu annos octo, menses quinque, et dies áliquot.
      en: >-
        Eutychian, a Tuscan by race and a native of Luni, the son of Marinus, took up the episcopate
        of the Roman Church after the priesthood of blessed Felix. He ordained that fruits, beans
        and grapes be blessed upon the altar; and likewise that no martyr be buried by the faithful
        without a dalmatic or a purple colobium. When in various places he had buried with his own
        hand three hundred and sixty-two martyrs, he was himself joined with them, and was crowned
        with martyrdom under the Emperor Numerian on the sixth day before the Ides of December, and
        was buried in the cemetery of Callistus on the Appian Way. In five ordinations in the month
        of December he created fourteen Priests, five Deacons, and nine Bishops for various places.
        He lived in the pontificate eight years, five months, and some days.
    status: { la: verified, en: draft }
