# Matins Nocturn 2 reading for St. Cyril of Alexandria, Bishop, Confessor and Doctor of the Church. Sourced directly from
# web/www/horas/Latin/Sancti/02-09.txt, English/Sancti/02-09.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-cyril-of-alexandria
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Cyríllus Alexandrínus, cujus præcónia non uníus tantum vel altérius sunt
        comprobáta testimónio, sed étiam œcumenicórum conciliórum Ephesíni et
        Chalcedonénsis actis celebráta, claris ortus paréntibus, ac Theóphili epíscopi
        Alexandríni nepos, adhuc adoléscens præcelléntis ingénii clara specímina dedit.
        Lítteris ac sciéntiis egrégie imbútus, ad Joánnem epíscopum, Jerosolymitánum se
        cóntulit, ut in Christiána fide perficerétur. Alexandríam deínde cum rediísset,
        Theóphilo vita functo, ad illíus sedem evéctus est: quo in múnere ita óptimi
        pastóris formam ab Apóstolo definítam constánter præ se tulit, ut sanctíssimi
        præsulis glóriam mérito sit adéptus.


        Salútis animárum zelo incénsus curas omnes inténdit, ut sibi commíssum gregem in
        fídei et morum integritáte serváret, atque a venenátis infidélium et hæreticórum
        páscuis defénderet. Hinc tum Nováti ásseclas e civitáte expélli, tum Judæos, qui
        furóre acti in cædem Christianórum conspiráverant, juxta leges puníri satégit.
        Singuláre vero Cyrílli pro cathólicæ fídei incolumitáte enítuit stúdium contra
        Nestórium Constantinopolitánum epíscopum, asseréntem Jesum Christum ex María
        Vírgine hóminem tantum et non Deum natum, eíque divinitátem pro méritis esse
        collátam; cujus emendatiónem cum frustra tentásset, eum sancto Cælestíno
        Pontífici máximo denuntiávit.


        Cælestíni delegáta auctoritáte, concílio Ephesíno præfuit, in quo hæresis
        Nestoriána pénitus proscrípta est, damnátus Nestórius et a sua Sede dejéctus, ac
        dogma cathólicum de una in Christo eáque divína persóna, et divína gloriósæ
        Vírginis Maríæ maternitáte assértum; plaudénte pópulo univérso, qui incredíbili
        gáudio géstiens, collucéntibus fácibus domum dedúxit epíscopus. Sed hac de causa
        Cyríllus calúmniis, injúriis et persecutiónibus, plúrimis a Nestório ejúsque
        fautóribus impetítus fuit; quas ipse patientíssime tulit, ita ut, de sola fide
        sollícitus, quidquid advérsus eum effutiébant ac moliebántur hærétici, pro
        níhilo habéret. Tandem pro Ecclésia Dei máximis perfúnctus labóribus,
        plurimísque scriptis éditis tum ad éthnicos et hæréticos confutándos, tum ad
        sacras Scriptúras et cathólica explanánda dógmata, sancto fine quiévit anno
        quadringentésimo quadragésimo quarto, episcopátus trigésimo secúndo. Leo décimus
        tértius Póntifex máximus Offícium et Missam præclaríssimi hujus fídei cathólicæ
        propugnatóris et Orientális ecclésiæ lúminis, ad Ecclésiam univérsam exténdit.
      en: >-
        The praises of Cyril of Alexandria have been celebrated not only by one writer
        or another, but have even been registered in the acts of the Ecumenical Councils
        of Ephesus and Chalcedon. He was born of distinguished parents, and was the
        nephew of Theophilus, Pope of Alexandria. While he was still young he displayed
        marks of his excellent understanding. After giving a deep study to letters and
        science he betook himself to John, Bishop of Jerusalem, to be perfected in the
        Christian faith. After his return to Alexandria, and the death of Theophilus, he
        was raised to that see. In this office he kept ever before his eyes the type of
        the Shepherd of souls as it had been laid down by the Apostle; and by ever
        adhering thereto deservedly earned the glory of an holy Bishop.


        Zeal for the salvation of souls was kindled in him, and he undertook all care to
        keep in the faith and in soundness of life the flock unto him committed, and to
        preserve them from the poisonous pastures of infidelity and heresy; hence, in
        accordance with the laws, he caused the followers of Novatus to be expelled from
        the city, and those Jews to be punished who had been induced by rage to plan a
        massacre of the Christians. His eminent care for the preservation of the
        Catholic faith pure and undenled shone forth especially in his controversy
        against Nestorius, Patriarch of Constantinople, who asserted that Jesus Christ
        had been born of the Virgin Mary as man only and not as God, and that the
        Godhead had been bestowed upon Him because of His merits. Cyril first attempted
        to convert Nestorius, but when he found this hopeless he denounced him to the
        Supreme Pontiff the holy Celestine.


        As delegate of Pope Celestine, Cyril presided at the Council of Ephesus where
        the Nestorian heresy was condemned; Nestorius deprived of his see; and the
        Catholic doctrine as to the unity of Person in Christ and the divine Motherhood
        of the glorious Virgin Mary was laid down amid the rejoicings of all the people,
        who escorted the bishops to their lodgings with a torch-light procession. For
        this reason Nestorius and his followers made Cyril the object of slanders,
        insults, and persecutions which he bore with profound patience, having all his
        care for the purity of the faith, and taking no heed to what the heretics might
        say or try against him. At length he died a holy death, in the year of salvation
        444 and of his own papacy the 32nd. After vast work for the Church of God, and
        leaving behind him diverse writings directed either against heathens and
        heretics or to the exposition of the holy Scriptures and of Catholic doctrine,
        the Supreme Pontiff Leo XIII. extended to the Universal Church the Office and
        Mass of this most eminent champion of the Catholic faith, and light of the
        Eastern Church.
