# Matins Nocturn content for the Friday after Ash Wednesday — read from
# web/www/horas/{Latin,English}/Tempora/Quadp3-5.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quadp3-5.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Jerome
# homily split only to fill the fixed 3-lesson slot count). Responsory1
# is a cross-reference (@Tempora/Quadp3-0:Responsory4) — used here per
# the "the first one, when several collapse" convention.
id: friday-after-ash-wednesday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Matt 5:43-48; 6:1-4", en: "Matthew 5:43-48; 6:1-4" }
    text:
      la: >-
        In illo témpore: Dixit Jesus discípulis suis: Audístis, quia dictum est: Díliges próximum
        tuum, et ódio habébis inimícum tuum. Ego autem dico vobis: Dilígite inimícos vestros,
        benefácite his, qui odérunt vos, et oráte pro persequéntibus et calumniántibus vos, ut sitis
        fílii Patris vestri, qui in cœlis est: qui solem suum oriri facit super bonos et malos, et
        pluit super justos et injústos. Si enim dilígitis eos, qui vos díligunt, quam mercédem
        habébitis? nonne et publicáni hoc fáciunt? Et si salutavéritis fratres vestros tantum, quid
        ámplius fácitis? nonne et éthnici hoc fáciunt? Estóte ergo vos perfécti, sicut et Pater
        vester cœléstis perféctus est. Atténdite, ne justítiam vestram faciátis coram homínibus, ut
        videámini ab eis: alióquin mercédem non habébitis apud Patrem vestrum, qui in cœlis est. Cum
        ergo facis eleemósynam, noli tuba cánere ante te, sicut hypócritæ fáciunt in synagógis et in
        vicis, ut honorificéntur ab homínibus. Amen, dico vobis, recepérunt mercédem suam. Te autem
        faciénte eleemósynam, nésciat sinístra tua, quid fáciat déxtera tua, ut sit eleemósyna tua
        in abscóndito, et Pater tuus, qui videt in abscóndito, reddet tibi.
      en: >-
        At that time, Jesus said to His disciples, "You have heard that it was said, 'You shall
        love your neighbor, and shall hate your enemy.' But I say to you, love your enemies, do
        good to those who hate you, and pray for those who persecute and calumniate you, so that
        you may be children of your Father in heaven, Who makes His sun to rise on the good and the
        evil, and sends rain on the just and the unjust. For if you love those that love you, what
        reward shall you have? Do not even the publicans do that? And if you salute your brethren
        only, what are you doing more than others? Do not even the Gentiles do that? You therefore
        are to be perfect, even as your heavenly Father is perfect. Take heed not to do your good
        before men, in order to be seen by them; otherwise you shall have no reward with your
        Father in heaven. Therefore when you give alms, do not sound a trumpet before you, as the
        hypocrites do in the synagogues and streets, in order that they may be honored by men. Amen
        I say to you, they have received their reward. But when you give alms, do not let your left
        hand know what your right hand is doing, so that your alms may be given in secret; and your
        Father, Who sees in secret, will reward you."
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Jerome, Priest, Book 1, Commentary on Matthew, ch. 5 and 6"
    text:
      la: >-
        Ego autem dico vobis: Dilígite inimícos vestros; benefácite his qui odérunt vos. Multi
        præcépta Dei, imbecillitáte sua, non Sanctórum víribus æstimántes, putant esse impossibília
        quæ præcépta sunt: et dicunt suffícere virtútibus, non odísse inimícos: céterum dilígere,
        plus prǽcipi, quam humána natúra patiátur. Sciéndum est ergo, Christum non impossibília
        præcípere, sed perfécta. Quæ fecit David in Saul, et in Absalom: Stéphanus quoque Martyr pro
        inimícis lapidántibus deprecátus est: et Paulus anáthema cupit esse pro persecutóribus suis.
        Hæc autem Jesus et dócuit et fecit, dicens: Pater, ignósce illis: quod enim fáciunt,
        nésciunt.


        Ut sitis fílii Patris vestri, qui in cælis est. Si Dei præcépta custódiens, fílius quis
        effícitur Dei: ergo non est natúra fílius, sed arbítrio suo. Cum ergo facis eleemósynam,
        noli tuba cánere ante te, sicut hypócritæ fáciunt in synagógis et in vicis, ut
        honorificéntur ab homínibus. Qui tuba canit, eleemósynam fáciens, hypócrita est. Qui
        jejúnans demolítur fáciem suam, ut ventris inanitátem monstret in vultu, et hic hypócrita
        est. Qui in synagógis et in ángulis plateárum orat, ut videátur ab homínibus, hypócrita est.


        Ex quibus ómnibus collígitur hypócritas esse, qui quódlibet fáciunt ut ab homínibus
        glorificéntur. Mihi vidétur et ille, qui dicit fratri suo: Dimítte ut tollam festúcam de
        óculo tuo: nam propter glóriam hoc fácere vidétur, ut ipse justus esse videátur. Unde
        dícitur ei a Dómino: Hypócrita, éice primum trabem de óculo tuo. Non ítaque virtus, sed
        causa virtútis apud Deum mercédem habet. Et si a recta via páululum declináveris, non
        ínterest, utrum ad déxteram vadas, an ad sinístram, cum verum iter amíseris.
      en: >-
        But I say unto you, "Love your enemies, do good to them that hate you." There are many who
        judge of the commandments of the Lord by their own weakness, and not by the strength of His
        Saints; and so deem Him to have commanded things impossible. These are they who think that
        not to hate their enemies is all that they are able to do; and that to command us to love
        them, is to command more than man's nature can bear. It behoveth them to know, that this
        which Christ commandeth is not impossible, albeit perfect. This is what David did in
        respect of Saul and Absalom; the martyr Stephen also prayed for his enemies, even while they
        were stoning him; and Paul could wish that himself were accursed from Christ for his
        persecutors. And this, Jesus Himself did, as well as taught, when He said, "Father, forgive
        them, for they know not what they do."


        That ye may be the children of your Father Which is in heaven. If he that doeth the
        commandments of God becometh a son of God, then is he not a son by nature, but by his own
        choice. Therefore when thou doest thine alms, do not sound a trumpet before thee, as the
        hypocrites do in the synagogues, and in the streets, that they may have glory of men. He
        that soundeth a trumpet before him, when he doeth alms, is an hypocrite. He that
        disfigureth his face, when he fasteth, to the end that he may show the emptiness of his
        belly in his looks, he also is an hypocrite. He that prayeth in the synagogues and in the
        corners of the streets, that he may be seen of men, is an hypocrite.


        From all which, we gather that an hypocrite is one which doeth anything that he may have
        glory of men. To me also it seemeth that he which saith unto his brother, "Let me pull out
        the mote out of thine eye," that he also is an hypocrite; for he proposeth to take upon him
        that office for vainglory's sake, that he himself may appear righteous. Therefore the Lord
        saith unto him, "Thou hypocrite, first cast out the beam out of thine own eye." Thus we see
        that it is, not the doing good, but the motive which moveth us to do good, which will meet
        with reward from God; and, if thou stray but a little from the right way, it is of small
        moment whether thou wander to the right hand or to the left, when once thou hast lost the
        straight path.
    responsory:
      la: "R. Angelus Dómini vocávit Abraham, dicens: * Ne exténdas manum tuam super púerum, eo quod tímeas Dóminum.\nV. Cumque extendísset manum ut immoláret fílium, ecce Angelus Dómini de cælo clamávit, dicens.\nR. Ne exténdas manum tuam super púerum, eo quod tímeas Dóminum."
      en: "R. The Angel of the Lord called unto Abraham and said: * Lay not thine hand upon the lad; for now I know that thou fearest God.\nV. And Abraham stretched forth his hand to slay his son; and, behold, the Angel of the Lord called unto him out of heaven, and said.\nR. Lay not thine hand upon the lad; for now I know that thou fearest God."
    status: { la: verified, en: verified }
