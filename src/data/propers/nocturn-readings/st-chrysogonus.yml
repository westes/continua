# Matins Nocturn 2 reading for St. Chrysogonus, Martyr (Nov 24). No
# genuine SanctiM match: the correct Tridentine file is the suffixed
# `Sancti/11-24o.txt` (the plain `Sancti/11-24.txt` is St. John of the
# Cross instead), and the only SanctiM file for this date bases
# `@Sancti/11-24` (John of the Cross, not Chrysogonus) — a missed
# pre-1955-pool candidate rather than a genuine SanctiM case (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-24o.txt, English/Sancti/11-24o.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-chrysogonus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Chrysógonus, Diocletiáno imperatóre, Romæ inclusus in carcere, ibi biennium sanctæ
        Anastasiæ facultátibus vixit; quam etiam, afflictam propter Christum a viro suo
        Publio, proptereáque a suis oratiónibus per litteras auxílium postulántem, mútuis
        epistolis est consolatus. Sed, cum imperátor Romam scripsísset ut, reliquis
        Christiánis qui in vinculis essent interfectis, Chrysógonus Aquilejam ad se
        mitterétur, eo perductus est. Cui imperátor: Accersívi, inquit, te, Chrysógone, ut
        honóribus augeam, si modo induxeris ánimum deos cólere. At ille: Ego eum, qui vere
        est Deus, mente et oratióne véneror; deos autem, qui nihil sunt nisi dæmonum
        simulacra, odi et éxsecror. Quo responso excandéscens imperátor, ad Aquas Gradatas
        eum secúri pércuti jubet octavo Kalendas Decembris. Cujus corpus, projectum in mare,
        paulo post in littore invéntum, Zóilus presbyter in suis ædibus sepelívit.
      en: >-
        Chrysogonus was imprisoned at Rome in the reign of the Emperor Diocletian. There he
        lived for the space of two years upon the alms of the holy Anastasia. She was
        suffering much persecution from her husband Publius for Christ's Name's sake, and was
        used to write to Chrysogonus to ask for the help of his prayers, and he in return
        comforted her by his epistles. Presently the Emperor wrote to Rome commanding the
        rest of the Christians who were in prison there to be put to death, and Chrysogonus to
        be sent to himself at Aquileia. When he was brought thither, he said unto him: I have
        sent for thee, O Chrysogonus, that I may increase thine honours, if only thou wilt
        bring thy mind to worship the gods. Thereto Chrysogonus answered: With my mind and
        with my prayers I worship Him Who is God indeed, but such gods as are nothing but
        images of devils, them I hate and curse. Then was the Emperor kindled to fury at this
        answer, and commanded Chrysogonus to be beheaded at Aquae Gradatae upon the 24th day
        of November. His body was cast into the sea, but found a little while afterwards
        washed up upon the shore, and the Priest Zoilus took it and buried it in his own
        house.
    status: { la: verified, en: verified }
