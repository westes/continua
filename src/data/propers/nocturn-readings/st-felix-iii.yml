# Matins Nocturn 2 reading for St. Felix III, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/02-25-FelixIII.txt, [Lectio4]-[Lectio5], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-felix-iii
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Felix tértius, pátria Románus, natus ex nobilissima domo Anicia, et divi Gregórii Magni
        atavus, post Simplicium Papa ad summi pontificátus ápicem est evéctus. Hic mira ánimi
        constántia, tametsi Roma sub Herulis ariánis propémodum captiva viderétur, aliique
        Patriarchæ conciliationem Zenonis imperatóris approbassent, solus illi non communicavit.
        Ejúsdem de fide edíctum promulgantis, audaciam fórtiter repressit, Petrum Fullonem
        patriarchatu Antiocheno dejécit. Acacium Constantinopolitánum epíscopum Romam veníre cœgit,
        ut contra eum objectis in apostólicæ Sedis judício respónderet, ac in eúmdem senténtia
        excommunicationis animadvertit.


        Constítuit, ut ecclésiæ nonnisi ab epíscopis consecrarentur; semel baptizatos íterum
        rebaptizari sub gravibus pœnis prohibuit. Basílicam sancti Agapíti constrúxit. Anno ejus
        pontificátus tértio, sanctus Bárnabas Apóstolus, cum sancti Matthæi Evangélio, in Cypro
        Anthemio epíscopo Salaminæ appáruit; sicque prævia trina revelatióne, corpus sancti Barnabæ
        cum Evangélio supradicto est inventum. Duas fecit ordinatiónes mense Decémbri, quibus
        creávit Romæ presbyteros vigínti novem, diáconos quinque, epíscopos per divérsa loca
        trigínta. Quinto Kaléndas Mártii e terris excedens ad Súperos evolávit.
      en: >-
        Felix the Third, a Roman by birth, born of the most noble house of the Anicii, and
        great-grandfather of the divine Gregory the Great, was raised to the summit of the supreme
        pontificate after Simplicius. With wonderful constancy of mind, though Rome under the Arian
        Heruli seemed almost captive, and other Patriarchs had approved the reconciliation with the
        Emperor Zeno, he alone did not communicate with him. When Zeno promulgated an edict about
        the faith, he boldly repressed his audacity, deposed Peter the Fuller from the patriarchate
        of Antioch, compelled Acacius, bishop of Constantinople, to come to Rome to answer the
        charges brought against him in the judgment of the Apostolic See, and passed on him a
        sentence of excommunication.


        He ordained that churches be consecrated only by bishops; he forbade, under heavy penalties,
        that those once baptized be rebaptized. He built the basilica of St. Agapitus. In the third
        year of his pontificate, the Apostle St. Barnabas, with the Gospel of St. Matthew, appeared
        in Cyprus to Anthemius, bishop of Salamis; and so, after a threefold revelation, the body of
        St. Barnabas was found with the aforesaid Gospel. He held two ordinations in the month of
        December, in which he created at Rome twenty-nine priests, five deacons, and thirty bishops
        for various places. On the fifth day before the Kalends of March, leaving the earth, he flew
        to those above.
    status: { la: verified, en: draft }
