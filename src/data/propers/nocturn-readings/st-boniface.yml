# Matins Nocturn 2 reading for St. Boniface, Martyr (May 14). No
# genuine SanctiM match: the only SanctiM file for this date,
# `SanctiM/05-14M.txt`, is a wholly different, later saint (St.
# Pachomius, marked "1965") — a missed pre-1955-pool candidate rather
# than a genuine SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-14.txt, English/Sancti/05-14.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-boniface
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bonifatius, civis Romanus, quod cum Aglaë nobili matrona impudíce versátus esset, tanto
        illíus intemperantiæ dolóre captus est, ut pœniténtiæ causa se ad conquirenda et
        sepelienda Mártyrum córpora contulerit. Itaque, relictis peregrinatiónis sociis, cum
        Tarsi multos propter christianæ fidei professiónem variis tormentis cruciatos vidísset;
        illórum víncula osculátus, eos veheméntius hortabátur, ut constanter supplícia
        perferrent, quod brevem labórem sempiterna requies consecutura sit. Comprehénsus ígitur,
        férreis ungulis excarnificátus est; cui étiam inter mánuum ungues et carnem acúti cálami
        sunt infixi, plumbumque liquefactum in os ejus infusum. Quibus in cruciátibus ea vox
        tantum Bonifatii audiebátur: Gratias tibi ago, Dómine Jesu Christe, Fili Dei. Mox in
        ollam ferventis picis demisso cápite conjéctus est; unde cum inviolátus exísset, ira
        incénsus judex eum secúri pércuti jubet. Quo témpore magnus terræmotus factus est, ita ut
        multi infidéles ad Christi Dómini fidem converteréntur. Eum sequénti die quæréntes socii,
        cum martyrio afféctum cognovíssent, quingentis solidis ejus corpus redemérunt, et
        condítum unguentis linteisque involutum Romam portándum curarunt. Quod factum cum ab
        Angelo Aglaë matrona, quæ et ipsa pœnitens se piis opéribus addixerat, cognovísset,
        prodiens obviam sancto corpori, ecclésiam ejus nómine ædificávit; in qua corpus sepúltum
        est Nonis Junii, cum ejus ánima pridie Idus Maji apud Tarsum Ciliciæ urbem migrasset in
        cælum, Diocletiáno et Maximiáno imperatóribus.
      en: >-
        Boniface was a Roman citizen who had lived in sin with the noble lady Aglae. The memory of
        this transgression overwhelmed him with exceeding sorrow, so that for penance he gave
        himself up to look for and bury the bodies of the martyrs. While he was at Tarsus, and
        apart from his fellow-travellers, he saw a great many persons being diverse ways
        tormented, because they confessed to believing in Christ. He kissed their chains, and
        vehemently exhorted them bravely to bear their sufferings, seeing that the same their
        affliction which was but for a moment, was working for them an exceeding, even an eternal
        weight of glory. For this cause Boniface also was taken, and his flesh torn off him with
        iron claws. Sharp reeds also were driven between his finger-nails and the quick, and
        molten lead poured into his mouth. In his agony he was only heard to say: I thank thee, O
        Lord Jesus Christ, Son of God. Afterward he was dipped head foremost into a vessel of
        boiling pitch, and as he was drawn out unharmed, the judge in fury commanded him to be
        beheaded. At the time it was done there was a great earthquake, whereby many unbelievers
        were turned to believe in the Lord Christ. The fellow-travellers of Boniface sought him
        the next day, and when they knew that he had undergone martyrdom, they bought his body
        for fifty shillings, and after that they had embalmed it with spices, and wrapped it in
        linen, they carried it to Rome. The Lady Aglae, who had herself with great contrition
        given up her life to godly works, was told by an angel what had come to pass. She
        therefore went forth to meet the holy body, and built a Church in the name of Boniface,
        wherein his said body was buried upon the fifth day of June next after that fourteenth of
        May whereon in the city of Tarsus in Cilicia, under the Emperors Diocletian and Maximian,
        he had passed away to heaven.
    status: { la: verified, en: verified }
