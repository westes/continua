# Matins Nocturn 2 and 3 readings for St. Hildegard, Virgin. Sourced from
# web/www/horas/Latin/Sancti/Bavaria/09-17-Hildegardis.txt. Nocturn 2 is
# Lectio4-6 combined into one continuous vita (headed in the source "E
# Breviario Monastico Ordinis S. Benedicti"), its closing responsory the
# source's Responsory6. Nocturn 3 is the source's Lectio7-8, Augustine's
# homily on holy virginity (De sancta virginitate, chs. 25, 29, 30); the
# source's Lectio7 opens with the Common of a Virgin's own gospel incipit
# (`@Commune/C6::1-3`), which continua's Common of a Virgin already
# supplies, so only the homily is carried here. Its closing responsory is
# the source's Responsory8.
#
# No English exists in the reference engine for the Bavarian files; the
# English below is this project's own translation, marked draft.
#
# Latin: three obvious source typos corrected silently below -- "tama" ->
# "fama" (Lectio4), "Abbatíssa" -> "Abbatíssæ" (Lectio4, agreeing with
# Juttæ sanctissimæ), "cali" -> "cæli" (Responsory6). Everything else is
# verbatim.
id: st-hildegard
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Hildegárdis in Palatinátu inferióre, ex patre Hildebérto, matre Mechtílde, generis
        nobilitate ac pietatis fama conspicuis orta, ténera in ætáte miris jam visiónibus illustráta
        désuper, spretis mundi hujus oblectaméntis, octénnis sub regímine agnatæ suæ Juttæ,
        sanctissimæ Abbatíssæ, in montem sancti Disibódi consepeliénda Christo secéssit. Monásticum
        dein institútum proféssa, admirándis paulo post divínæ gratiæ signis innótuit. Contínuo fere
        acutíssimis excócta ægritudínibus, patiéntiæ exémplum ita universis exhibuit, ut tota ipsíus
        vita Christo confíxa cruci, quædam diútini fúerit imágo martýrii. E vivis subláta beáta
        Jutta, Hildegárdis licet renítens in ejus loco suffécta est. Quo in múnere sorórum
        necessitátibus ómnibus, eárum máxime qua consciéntia utcúmque laborábant, peramánter
        providéque consulébat. Cum autem ejus monastérium nímiam moniálium numerositátem ut cáperet,
        jam esset insuffíciens, ad álium montem, a sancto Rupérto nuncupátum, cum plúrimis ex illis
        contendit, ibíque sedem fixit Abbatiálem. Quadraginta circiter annos nata ígneo turbine ac
        lúmine prodigióso cálitus illápso mirífice illustráta, donum intelligéntiæ ac expositiónis
        sacrárum Scripturarum singulári Dei benefício accépit. Jussa item, voce ad ipsam e súperis
        emíssa, quæ de cétero vidére et audíre mererétur, sédulo scriptis mandáre, cum id
        detrectaret, a Númine cógitur. Scribere proin aggréssa, de posteritate omni ætérnum méruit:
        libros quippe confécit exímios ac plane cæléstes, ex quibus eam a Spíritu Sancto edóctam
        fuísse dignóscitur.


        Prophetiæ affláta spiritu, multis ad se ex divérsis et remotíssimis régiónibus confluéntibus
        mira omníno prædicebat, eorúmque cogitatiónes et occultióra cordium secréta inspiciébat:
        quosdam étiam pervérsa vel fraudulénta mente ad se accedéntes redarguébat; qui corrépti et
        emendáti, ad saniórem ánimum íllico redire cogebántur. Nemo ad illam umquam se cóntulit, qui
        ejus salutáribus mónitis instrúctus, cum vitæ melióris propósito non recésserit. Divíno
        intérea sápius impúlsa Spíritu, Colóniam, Trévirim, Metas, Herbípolim, Bambérgam, aliáque
        loca diversíssima, apostólico zelo ǽstuans ádiit, et quæ sibi divinitus fúerant reveláta,
        Deo præcipiénte audentíssime annuntiávit. Hæréticos verbis ac scriptis stupénda auctoritáte
        et grátia confutávit ac profligávit: Catharórum imprímis pestilentíssimam hæresim, qua tunc
        in aliquibus Germániæ provínciis fautóres suos habébat, nec non repullulascéntem Berengárii
        errórem doctíssimo libro sanctíssima múlier elúsit atque convícit. Illam mellífluus Doctor
        Ecclésiæ sanctus Bernárdus tanti fecit ejúsque divína scripta ea prosecútus est veneratione,
        ut ipso potíssimum agénte a detractiónibus adversántium vindicáta, étiam a Summo Pontifice
        Eugénio tértio, in Concílio Trevirénsi, Cardinálibus et Epíscopis multis præséntibus,
        pública fúerint senténtia confirmáta.


        Ecclésiæ dénique univérsæ, assiduis labóribus, et sanctissimæ vita exémplo mirum in modum
        consuluit; ita nempe ut Eugénius tertius, tresque subsequentes Romani Pontifices, Episcopi
        non pauci, Imperatóres, aliique summi Principes Gálliæ, Germániæ, Itáliæ atque sanctíssimi
        quivis et eruditissimi viri, in gravíssimis quibúsque negótiis, illíus consílium
        exquírerent, ejúsque précibus Románam Ecclésíam, Imperium, et suam quisque provinciam ac
        seipsum commendárent; dénique post innúmera virtútum ac sciéntiæ divínitus infúsæ insígnia,
        cæléstium revelatiónum et miraculórum grátia illústris, anno ætátis suæ octogésimo secúndo,
        cum mortis suæ horam a Deo mónita prædixísset, migrávit ad Sponsum décimo quinto Kaléndas
        Octobris, anno Dómini millésimo centésimo septuagésimo nono: vere ac mérito ingens vocáta
        sexus mulíebris, immo Germániæ Ordinis sancti Benedícti et Ecclésiæ miráculum, atque orbis
        univérsi oráculum. Ejus sacrum corpus in ecclésia primum sancti Rupérti juxta Bingam
        cónditum, dein bello tricennáli Colóniam asportátum, postrémo in Ecclésiam Eibingénsis
        monastérii ab ipsa fundati translátum est, ubi anno salútis millésimo octingentésimo
        quinquagésimo séptimo solémniter recógnitum, summa fidélium veneratióne cólitur.
      en: >-
        Hildegard was born in the Lower Palatinate, of a father Hildebert and a mother
        Mechtild, both conspicuous for nobility of birth and fame of piety. While still of
        tender age she was already enlightened from above by wonderful visions; and, despising
        the delights of this world, at the age of eight she withdrew to Christ, under the rule
        of her kinswoman Jutta, a most holy abbess, to be shut up with her on the mount of St.
        Disibod. Having then professed the monastic life, she soon became known by wonderful
        signs of divine grace. Almost continually racked by most acute illnesses, she so showed
        to all an example of patience that her whole life, nailed with Christ to the cross, was
        a kind of image of long-drawn martyrdom. When blessed Jutta was taken from the living,
        Hildegard, though unwilling, was put in her place. In which office she took counsel with
        the utmost love and foresight for all the needs of the sisters, above all for those who
        in any way laboured under trouble of conscience. When, however, her monastery was no
        longer sufficient to hold so great a number of nuns, she set out with very many of them
        to another mountain, called after St. Rupert, and there established her abbatial seat.
        At about forty years of age, wonderfully enlightened by a fiery whirlwind and a
        prodigious light fallen from heaven, she received, by a singular benefit of God, the
        gift of understanding and expounding the sacred Scriptures. Likewise, when a voice sent
        to her from on high bade her diligently commit to writing whatever she should deserve
        henceforth to see and hear, and she refused, she was compelled by the Godhead. Having
        therefore begun to write, she earned the eternal gratitude of all posterity: for she
        composed books of rare excellence and plainly heavenly, from which she is known to have
        been taught by the Holy Spirit.


        Filled with the spirit of prophecy, to the many who flocked to her from divers and most
        distant regions she foretold things altogether marvellous, and beheld their thoughts and
        the hidden secrets of their hearts; some, too, who came to her with a perverse or
        fraudulent mind she rebuked, and these, being corrected and amended, were forthwith
        brought back to a sounder mind. No one ever came to her who, instructed by her wholesome
        counsel, did not depart with the resolve of a better life. Meanwhile, often impelled by
        the divine Spirit, and burning with apostolic zeal, she went to Cologne, Trier, Metz,
        Würzburg, Bamberg and many other places far apart, and most boldly proclaimed what had
        been divinely revealed to her, at God's command. Heretics she refuted and put to rout,
        by word and writing, with astonishing authority and grace: above all the most pestilent
        heresy of the Cathars, which then had its supporters in some provinces of Germany, and
        the reviving error of Berengarius, did that most holy woman baffle and convict in a most
        learned book. The mellifluous Doctor of the Church, St. Bernard, thought so highly of
        her, and followed her divine writings with such veneration, that, chiefly by his
        agency, they were vindicated from the detractions of their adversaries, and were even
        confirmed by public sentence of the Supreme Pontiff Eugenius III, in the Council of
        Trier, in the presence of cardinals and many bishops.


        Finally, by unceasing labours and by the example of a most holy life, she took counsel
        for the whole Church in a wonderful manner; so that Eugenius III and the three Roman
        Pontiffs who followed, not a few bishops, emperors, and other highest princes of
        France, Germany and Italy, and all the holiest and most learned men, in every gravest
        matter, sought her counsel, and commended to her prayers the Roman Church, the Empire,
        their own province and themselves. At last, after countless signs of virtue and of
        divinely infused knowledge, renowned for the grace of heavenly revelations and
        miracles, in the eighty-second year of her age, having foretold the hour of her death,
        which God had made known to her, she passed to the Bridegroom on the fifteenth day
        before the Kalends of October, in the year of the Lord 1179: rightly and deservedly
        called the great wonder of her sex, indeed the wonder of Germany, of the Order of St.
        Benedict and of the Church, and the oracle of the whole world. Her sacred body, laid
        first in the church of St. Rupert near Bingen, then carried off to Cologne in the
        Thirty Years' War, was at last translated to the church of the monastery of Eibingen
        which she had founded, where in the year of salvation 1857 it was solemnly recognised,
        and is honoured with the highest veneration of the faithful.
    responsory:
      la: |-
        R. Apparuérunt cæléstes spíritus, qui Hildegárdem ad Agni núptias invitábant, dicéntes: * Veni, Dómina, quia te exspéctant cæli delíciæ.
        V. Veni de Líbano, sponsa; veni de Líbano; veni, coronáberis.
        R. Veni, Dómina, quia te exspéctant cæli delíciæ.
      en: |-
        R. Heavenly spirits appeared, who invited Hildegard to the marriage of the Lamb, saying: * Come, lady, for the delights of heaven await thee.
        V. Come from Lebanon, my spouse; come from Lebanon; come, thou shalt be crowned.
        R. Come, lady, for the delights of heaven await thee.
    status: { la: verified, en: draft }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine, On Holy Virginity, chs. 25, 29, 30"
    text:
      la: >-
        Pérgite itaque, Sancti Dei, púeri ac puellæ, mares ac féminæ, cælibes ac nuptæ; pérgite
        perseverántes in finem. Laudate Dóminum dúlcius, quem cogitatis uberius; sperate felícius,
        cui servítis instántius; amate ardentius, cui placétis atténtius. Lumbis accinctis et
        lucérnis ardéntibus exspectáte Dóminum, quando veniat a núptiis. Vos afferétis ad núptias
        Agni cánticum novum, quod cantábitis cítharis vestris, quale nemo poterit dícere nisi vos.
        Sic enim vos vidit in Apocalypsi quidam, præ céteris diléctus Agno, qui discúmbere super
        pectus ejus sólitus erat, et bíberat et eructábat mirabilia super cæléstis Dei Verbum. Vos
        Agnum sequímini tenéndo perseveranter quod voluístis; ardenter tacite cum potestis, ne
        virginitatis bonum a vobis pereat, cum fácere nihil potestis, ut rédeat. Vidébit vos cétera
        multitúdo fidélium, quæ Agnum ad hoc sequi non potest; videbit, nec invidébit, et collætándo
        vobis, quod in se non habet, habébit in vobis.


        Præsúmite itaque, fídite, roboramini, permanéte, qui vovétis et rédditis Dómino Deo vestro
        vota perpétuæ continéntiæ, non propter præsens sæculum, sed propter regnum cælórum. Vos
        étiam, qui hoc nondum vovístis, qui potestis capere, cápite; perseveranter cúrrite, ut
        comprehendátis. Tóllite hostias quisque suas, et introíte in átria Dómini, non ex
        necessitáte, sed potestatem habéntes vestræ voluntátis. Cogitáte quidquid illud est: In muro
        ejus locum nominátum, meliórem multo quam filiórum atque filiárum. Cogitáte illic nomen
        ætérnum. Quis éxplicat quale nomen erit? Quidquid tamen erit, ætérnum erit. Hoc credéndo et
        sperándo et amando potuistis conjúgia, non devitáre prohíbita, sed transvoláre concéssa.
      en: >-
        Go on, therefore, holy ones of God, boys and girls, men and women, unmarried and
        married; go on, persevering to the end. Praise the Lord the more sweetly, the more
        fully ye think of him; hope the more happily, the more earnestly ye serve him; love
        the more ardently, the more attentively ye please him. With loins girded and lamps
        burning, wait for the Lord, when he shall return from the wedding. Ye shall bring to
        the wedding of the Lamb a new canticle, which ye shall sing upon your harps, such as no
        one shall be able to say but you. For so did one see you in the Apocalypse, he who was
        beloved of the Lamb beyond the rest, who was wont to lie upon his breast, and had
        drunk in, and poured forth, wonders concerning the heavenly Word of God. Follow the
        Lamb, holding fast with perseverance what ye have willed; ardently, and quietly while
        ye can, lest the good of virginity perish from you, when ye can do nothing to bring it
        back. The rest of the multitude of the faithful, who cannot follow the Lamb so far,
        will see you; they will see, and will not envy, and, rejoicing with you for what they
        have not in themselves, they will have it in you.


        Presume, therefore, trust, be strengthened, abide, ye who vow, and render to the Lord
        your God, vows of perpetual continence, not for the sake of the present world, but for
        the kingdom of heaven. Ye also who have not yet so vowed, who can take it, take it;
        run perseveringly, that ye may lay hold. Take each his own offerings, and enter into
        the courts of the Lord, not of necessity, but having power over your own will. Think
        on whatever that may be: "In his wall a named place, much better than that of sons and
        daughters." Think on the eternal name there. Who shall explain what that name shall
        be? Whatever it shall be, it shall be eternal. By believing and hoping and loving this,
        ye have been able not to shun lawful marriage, which was forbidden to none, but to
        fly beyond what was permitted.
    responsory:
      la: |-
        R. O Sponsa Christi nóbilis! O mater venerábilis! intercéde pro nobis ad Dóminum, Regem Angelórum, quem semper puro corde dilexísti, in cujus ampléxibus sine fine pérmanes: * Ut remíttat nobis ómnia, quæcúmque in ipsum peccávimus.
        V. Tribuens nobis fervórem amóris sui sanctíssimi, et post hoc exsílium mansiónem cæléstis habitáculi.
        R. Ut remíttat nobis ómnia, quæcúmque in ipsum peccávimus.
      en: |-
        R. O noble spouse of Christ! O venerable mother! intercede for us with the Lord, the King of Angels, whom thou didst ever love with a pure heart, in whose embrace thou dwellest without end: * That he may forgive us all that we have sinned against him.
        V. Granting us the fervour of his most holy love, and after this exile a dwelling in the heavenly home.
        R. That he may forgive us all that we have sinned against him.
    status: { la: verified, en: draft }
