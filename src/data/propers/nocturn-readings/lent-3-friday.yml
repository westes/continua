# Matins Nocturn content for Friday of Lent week 3 — read from
# web/www/horas/{Latin,English}/Tempora/Quad3-5.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad3-5.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory1
# is a cross-reference (@Tempora/Quad3-0:Responsory4) — used here per
# the "the first one, when several collapse" convention.
id: lent-3-friday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Joann 4:5-42", en: "John 4:5-42" }
    text:
      la: >-
        In illo témpore: Venit Jesus in civitátem Samaríæ, quæ dícitur Sichar: juxta prǽdium, quod
        dedit Jacob Joseph, fílio suo. Erat autem ibi fons Jacob. Jesus ergo fatigátus ex itínere,
        sedébat sic supra fontem. Hora erat quasi sexta. Venit múlier de Samaría hauríre aquam.
        Dicit ei Jesus: Da mihi bíbere. Discípuli enim ejus abíerant in civitátem, ut cibos émerent.
        Dicit ergo ei múlier illa Samaritána: Quómodo tu, Judǽus cum sis, bíbere a me poscis, quæ
        sum múlier Samaritána? non enim coutúntur Judǽi Samaritánis. Respóndit Jesus et dixit ei: Si
        scires donum Dei, et quis est, qui dicit tibi: Da mihi bibere: tu fórsitan petísses ab eo,
        et dedísset tibi aquam vivam. Dicit ei múlier: Dómine, neque in quo háurias habes, et púteus
        altus est: unde ergo habes aquam vivam? Numquid tu major es patre nostro Jacob, qui dedit
        nobis púteum, et ipse ex eo bibit et fílii ejus et pécora ejus? Respóndit Jesus et dixit ei:
        Omnis, qui bibit ex aqua hac, sítiet íterum: qui autem bíberit ex aqua, quam ego dabo ei, non
        sítiet in ætérnum: sed aqua, quam ego dabo ei, fiet in eo fons aquæ saliéntis in vitam
        ætérnam. Dicit ad eum mulier: Dómine, da mihi hanc aquam, ut non sítiam neque véniam huc
        hauríre. Dicit ei Jesus: Vade, voca virum tuum, et veni huc. Respóndit múlier, et dixit: Non
        hábeo virum. Dicit ei Jesus: Bene dixísti, quia non hábeo virum: quinque enim viros habuísti,
        et nunc, quem habes, non est tuus vir: hoc vere dixísti. Dicit ei múlier: Dómine, vídeo, quia
        Prophéta es tu. Patres nostri in monte hoc adoravérunt, et vos dícitis, quia Jerosólymis est
        locus, ubi adoráre opórtet. Dicit ei Jesus: Múlier, crede mihi, quia venit hora, quando neque
        in monte hoc, neque in Jerosólymis adorábitis Patrem. Vos adorátis, quod nescítis: nos
        adorámus, quod scimus, quia salus ex Judǽis est. Sed venit hora, et nunc est, quando veri
        adoratóres adorábunt Patrem in spíritu et veritáte. Nam et Pater tales quærit, qui adórent
        eum. Spíritus est Deus: et eos, qui adórant eum, in spíritu et veritáte opórtet adoráre.
        Dicit ei mulier: Scio, quia Messías venit (qui dícitur Christus). Cum ergo vénerit ille,
        nobis annuntiábit ómnia. Dicit ei Jesus: Ego sum, qui loquor tecum. Et contínuo venérunt
        discípuli ejus: et mirabántur, quia cum mulíere loquebátur. Nemo tamen dixit: Quid quæris,
        aut quid loquéris cum ea? Reliquit ergo hýdriam suam múlier, et ábiit in civitátem, et dicit
        illis homínibus: Veníte, et vidéte hóminem, qui dixit mihi ómnia, quæcúmque feci: numquid
        ipse est Christus? Exiérunt ergo de civitáte, et veniébant ad eum. Intérea rogábant eum
        discípuli, dicéntes: Rabbi, mandúca. Ille autem dicit eis: Ego cibum habeo manducáre, quem
        vos nescítis. Dicébant ergo discípuli ad ínvicem: Numquid áliquis áttulit ei manducáre?
        Dicit eis Jesus: Meus cibus est, ut fáciam voluntátem ejus, qui misit me, ut perfíciam opus
        ejus. Nonne vos dícitis, quod adhuc quátuor menses sunt, et messis venit? Ecce, dico vobis:
        Leváte óculos vestros, et vidéte regiónes, quia albæ sunt jam ad messem. Et qui metit,
        mercédem áccipit, et cóngregat fructum in vitam ætérnam: ut, et qui séminat, simul gáudeat,
        et qui metit. In hoc enim est verbum verum: quia álius est qui séminat, et álius est qui
        metit. Ego misi vos métere quod vos non laborástis: alii laboravérunt, et vos in labóres
        eórum introístis. Ex civitáte autem illa multi credidérunt in eum Samaritanórum, propter
        verbum mulíeris testimónium perhibéntis: Quia dixit mihi ómnia, quæcúmque feci. Cum
        veníssent ergo ad illum Samaritáni, rogavérunt eum, ut ibi manéret. Et mansit ibi duos dies.
        Et multo plures credidérunt in eum propter sermónem ejus. Et mulíeri dicébant: Quia jam non
        propter tuam loquélam crédimus: ipsi enim audívimus, et scimus, quia hic est vere Salvátor
        mundi.
      en: >-
        At that time, Jesus came, accordingly, to a town of Samaria called Sichar, near the field
        that Jacob gave to his son Joseph. Now Jacob's well was there. Jesus therefore, wearied as
        He was from the journey, was sitting at the well. It was about the sixth hour. There came a
        Samaritan woman to draw water. Jesus said to her, "Give Me to drink"; for His disciples had
        gone away into the town to buy food. The Samaritan woman therefore said to Him, "How is it
        that You, although You are a Jew, ask drink of me, who am a Samaritan woman? For Jews do not
        associate with Samaritans." Jesus answered and said to her, "If you did know the gift of
        God, and Who it is Who says to you, 'Give Me to drink,' you, perhaps, would have asked of
        Him, and He would have given you living water." The woman said to Him, "Sir, You have
        nothing to draw with, and the well is deep. Whence then have You living water? Are You
        greater than our father Jacob who gave us the well, and drank from it, himself, and his
        sons, and his flocks?" In answer Jesus said to her, "Everyone who drinks of this water will
        thirst again. He, however, who drinks of the water that I will give him shall never thirst;
        but the water that I will give him shall become in him a fountain of water, springing up
        unto life everlasting." The woman said to Him, "Sir, give me this water that I may not
        thirst, or come here to draw." Jesus said to her, "Go, call your husband and come here." The
        woman answered and said, "I have no husband." Jesus said, "For you have had five husbands,
        and he whom you now have is not your husband. In this you have spoken truly." The woman said
        to Him, "Sir, I see that You are a prophet. Our fathers worshipped on this mountain, but You
        say that at Jerusalem is the place where one ought to worship." Jesus said to her, "Woman,
        believe Me, the hour is coming when neither on this mountain nor in Jerusalem will you
        worship the Father. You worship what you do not know; we worship what we know, for salvation
        is from the Jews. But the hour is coming, and is now here, when the true worshippers will
        worship the Father in spirit and in truth. For the Father also seeks such to worship Him.
        God is spirit, and they who worship Him must worship in spirit and in truth." The woman said
        to Him, "I know that Messias is coming (Who is called Christ), and when He comes He will
        tell us all things." Jesus said to her, "I Who speak with you am He." And at this point His
        disciples came; and they wondered that He was speaking with a woman. Yet no one said, "What
        do You seek?" or, "Why do You speak with her?" The woman therefore left her water-jar and
        went away into the town, and said to the people, "Come and see a man who has told me all
        that I have ever done. Can He be the Christ?" They went forth from the town and came to meet
        Him. Meanwhile, His disciples besought Him, saying, "Rabbi, eat." But He said to them, "I
        have food to eat of which you do not know." The disciples therefore said to one another,
        "Has someone brought Him something to eat?" Jesus said to them, "My food is to do the will
        of Him Who sent Me, to accomplish His work. Do you not say, 'There are yet four months, and
        then comes the harvest'? Well, I say to you, lift up your eyes and behold that the fields
        are already white for the harvest. And he who reaps receives a wage, and gathers fruit unto
        life everlasting, so that the sower and the reaper may rejoice together. For herein is the
        proverb true, 'One sows, another reaps.' I have sent you to reap that on which you have not
        labored. Others have labored, and you have entered into their labors." Now many of the
        Samaritans of that town believed in Him because of the word of the woman who bore witness,
        "He told me all that I have ever done." When, therefore, the Samaritans had come to Him,
        they besought Him to stay there; and He stayed two days. And far more believed because of
        His word. And they said to the woman, "We no longer believe because of what you have said,
        for we have heard for ourselves and we know that this is in truth the Saviour of the world."
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, 15th Tract on John"
    text:
      la: >-
        Jam incípiunt mystéria. Non enim frustra fatigátur Jesus: non enim frustra fatigátur virtus
        Dei: non enim frustra fatigátur, per quem fatigáti recreántur: non enim frustra fatigátur,
        quo deserénte fatigámur, quo præsénte firmámur. Fatigátur tamen Jesus, et fatigátur ab
        itínere, et sedet, et juxta púteum sedet, et hora sexta fatigátus sedet. Omnia ista ínnuunt
        áliquid, indicáre volunt áliquid: ut pulsémus, hortántur. Ipse ergo apériat et nobis et
        vobis, qui dignátus est ita hortári, ut díceret: Pulsáte, et aperiétur vobis.


        Tibi fatigátus est ab itínere Jesus. Invenímus virtútem Jesum, et invenímus infírmum Jesum:
        fortem, et infírmum. Fortem, quia in princípio erat Verbum, et Verbum erat apud Deum, et
        Deus erat Verbum: hoc erat in princípio apud Deum. Vis vidére quam iste Fílius Dei fortis
        sit? Omnia per ipsum facta sunt, et sine ipso factum est nihil: et sine labóre facta sunt.
        Quid ergo illo fórtius, per quem sine labóre facta sunt ómnia? Infírmum vis nosse? Verbum
        caro factum est, et habitávit in nobis. Fortitúdo Christi te creávit: infírmitas Christi te
        recreávit. Fortitúdo Christi fecit, ut quod non erat, esset: infírmitas Christi fecit, ut
        quod erat, non períret. Cóndidit nos fortitúdine sua, quæsívit nos infirmitáte sua.


        Nutrit ergo ipse infírmus infírmos, tamquam gallína pullos suos: huic enim se símilem fecit.
        Quóties vólui, inquit ad Jerúsalem, congregáre fílios tuos sub alas tamquam gallína pullos
        suos, et noluísti? Vidétis autem, fratres, quemádmodum gallína infirmétur cum pullis suis.
        Nulla enim ália avis, quod sit mater, agnóscitur. Vidémus nidificáre pásseres quóslibet ante
        óculos nostros: hirúndines, cicónias, colúmbas cotídie vidémus nidificáre: quos, nisi quando
        in nidis vidémus, paréntes esse non agnóscimus. Gallína vero sic infirmátur in pullis suis,
        ut étiam si ipsi pulli non sequántur, fílios non vídeas, matrem tamen intéllegas.
      en: >-
        Jesus, wearied with His journey, the mysteries are beginning now. It is not for nothing that
        Jesus is wearied. It is not for nothing that the Mighty One of God is wearied. It is not for
        nothing that He is wearied Who Himself giveth Rest to all them that are weary and
        heavy-laden. It is not for nothing that He is wearied Whose absence prostrateth us, and
        Whose presence maketh us to be strong.


        Jesus, therefore, being wearied with His journey, sat thus on the well, and it was about the
        sixth hour. There is a depth in all these details they all have something to say for us to
        learn. Upon them we gaze. Knock, saith the Lord, and it shall be opened unto you. Let us
        knock then and, O, may He open to me and to you, even He Who hath spoken to us those words:
        Knock, and it shall be opened unto you. It is for thy sake that Jesus was wearied with His
        journey. We find the strength of Jesus, and we find Jesus weak; yea, strong and weak.
        Strong, for In the beginning was the Word, and the Word was with God, and the Word was God:
        the Same was in the beginning with God. Wouldest thou know again how that the Son of God is
        strong? All things were made by Him, and without Him was not anything made that was made
        without effort. What then is stronger than He by Whom all things were made without effort?
        Wouldest thou know His weakness? The Word was made Flesh and dwelt among us. Christ, strong,
        made thee; Christ, weak, redeemed thee. Christ, strong, made all things out of nothing;
        Christ, weak, so wrought that that was made perished not. His strength hath made us, and His
        weakness saved us.


        He then, being Himself made weak, is strength to all such as are weak, gathering them
        together, to use His own figure, even as an hen gathereth her chickens under her wings. O
        Jerusalem, Jerusalem! how often would I have gathered thy children together, even as an hen
        gathereth her chickens under her wings, and ye would not! Consider now, my brethren, in what
        bondage is an hen to her chickens. There is no other bird in whom motherhood is
        unmistakeable. We watch the sparrows building their nests under our eyes; we see swallows,
        and storks, and pigeons building theirs every day. But, unless we actually see them in their
        nests, we know not if they have little ones, or no. But the hen's motherhood is so much a
        part of herself, that even if at the minute we see not her children the chickens following
        after her, nevertheless we see by her ways if she be a mother.
    responsory:
      la: "R. Videns Jacob vestiménta Joseph, scidit vestiménta sua cum fletu, et dixit: * Fera péssima devorávit fílium meum Joseph.\nV. Tulérunt autem fratres ejus túnicam illíus, mitténtes ad patrem: quam cum cognovísset pater, ait.\nR. Fera péssima devorávit fílium meum Joseph."
      en: "R. When Jacob saw Joseph's coat he rent his clothes, and mourned, and he said: * An evil beast hath devoured my son Joseph.\nV. And his brethren took his coat, and sent it to his father and he knew it, and said.\nR. An evil beast hath devoured my son Joseph."
    status: { la: verified, en: verified }
