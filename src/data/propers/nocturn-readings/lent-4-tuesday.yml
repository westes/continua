# Matins Nocturn content for Tuesday in the 4th week of Lent — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-2.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-2.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory is
# Lectio1's own (given directly in this file, not a cross-reference).
id: lent-4-tuesday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Joann 7:14-31", en: "John 7:14-31" }
    text:
      la: >-
        In illo témpore: Jam die festo mediánte, ascéndit Jesus in templum, et docébat. Et
        mirabántur Judǽi, dicéntes: Quómodo hic lítteras scit, cum non didícerit? Respóndit eis
        Jesus et dixit: Mea doctrína non est mea, sed ejus, qui misit me. Si quis volúerit
        voluntátem ejus fácere, cognóscet de doctrína, utrum ex Deo sit, an ego a meípso loquar. Qui
        a semetípso lóquitur, glóriam própriam quærit. Qui autem quærit glóriam ejus, qui misit eum,
        hic verax est, et injustítia in illo non est. Nonne Móyses dedit vobis legem: et nemo ex
        vobis facit legem? quid me quǽritis interfícere? Respóndit turba, et dixit: Dæmónium habes:
        quis te quærit interfícere? Respóndit Jesus et dixit eis: Unum opus feci, et omnes
        mirámini. Proptérea Móyses dedit vobis circumcisiónem - non quia ex Móyse est, sed ex
        pátribus: - et in sábbato circumcíditis hóminem. Si circumcisiónem áccipit homo in sábbato,
        ut non solvátur lex Móysi: mihi indignámini, quia totum hóminem sanum feci in sábbato?
        Nolíte judicáre secúndum fáciem, sed justum judícium judicáte. Dicébant ergo quidam ex
        Jerosólymis: Nonne hic est, quem quærunt interfícere? Et ecce, palam lóquitur, et nihil ei
        dicunt. Numquid vere cognovérunt príncipes, quia hic est Christus? Sed hunc scimus, unde
        sit: Christus autem, cum vénerit, nemo scit, unde sit. Clamábat ergo Jesus in templo docens,
        et dicens: Et me scitis et, unde sim, scitis, et a meípso non veni, sed est verus, qui misit
        me, quem vos nescítis. Ego scio eum, quia ab ipso sum, et ipse me misit. Quærébant ergo eum
        apprehéndere: et nemo misit in illum manus, quia nondum vénerat hora ejus. De turba autem
        multi credidérunt in eum.
      en: >-
        At that time, when the feast was already half over, Jesus went up into the temple and began
        to teach. And the Jews marveled, saying, "How does this man come by learning, since He has
        not studied?" Jesus answered them and said, "My teaching is not My own, but His Who sent Me.
        If anyone desires to do His will, he will know of the teaching whether it is from God, or
        whether I speak on My own authority. He who speaks on his own authority seeks his own glory.
        But he who seeks the glory of the one who sent him is truthful, and there is no injustice in
        him. Did not Moses give you the Law, and none of you observes the Law? Why do you seek to
        put Me to death?" The crowd answered and said, "You have a devil. Who seeks to put You to
        death?" Jesus answered and said to them, "One work I did and you all wonder. For this reason
        Moses gave you the circumcision -- not that it is from Moses, but from the fathers -- and on
        a Sabbath you circumcise a man. If a man receives circumcision on a Sabbath, that the Law of
        Moses may not be broken, are you indignant with me because I made a whole man well on a
        Sabbath? Judge not by appearances but give just judgment." Some therefore of the people of
        Jerusalem were saying, "Is not this the man they seek to kill? And behold, He speaks openly
        and they say nothing to Him. Can it be that the rulers have really come to know that this is
        the Christ? Yet we know where this man is from; but when the Christ comes, no one will know
        where He is from." Jesus therefore, while teaching in the temple, cried out and said, "You
        both know Me, and know where I am from. Yet I have not come of Myself, but He is true Who
        has sent Me, whom you do not know. I know Him because I am from Him, and He sent Me." They
        wanted therefore to seize Him, but no one laid hands on Him because His hour had not yet
        come. Many of the people, however, believed in Him.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, 29th Tract on John"
    text:
      la: >-
        Ille qui latébat, docébat, et palam loquebátur, et non tenebátur. Illud enim ut latéret,
        erat causa exémpli, hoc potestátis. Sed cum docéret, mirabántur Judǽi. Omnes quidem, quantum
        árbitror, mirabántur, sed non omnes convertebántur. Et unde admirátio? Quia multi nóverant
        ubi natus, quemádmodum fúerit educátus. Nunquam eum víderant lítteras discéntem: audiébant
        autem de lege disputántem, legis testimónia proferéntem, quæ nemo posset proférre, nisi
        legísset, nemo légeret, nisi lítteras didicísset: et ídeo mirabántur. Eórum autem admirátio,
        magístro facta est insinuándæ áltius veritátis occásio.


        Ex eórum quippe admiratióne et verbis, dixit Dóminus profúndum áliquid, et diligéntius
        ínspici et discúti dignum. Quid ergo Dóminus respóndit eis, admirántibus quómodo sciret
        lítteras, quas non didícerat? Mea, inquit, doctrína non est mea, sed ejus qui misit me. Hæc
        est profúnditas prima: vidétur enim paucis verbis quasi contrária locútus. Non enim ait:
        Ista doctrína non est mea: sed, Mea doctrína non est mea. Si non tua, quómodo tua? si tua,
        quómodo non tua? Tu enim dicis utrúmque: et mea doctrína, et non mea.


        Si ergo intueámur diligénter quod ipse in exórdio dicit sanctus Evangelísta: In princípio
        erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum: inde pendet hujus solútio
        quæstiónis. Quæ est doctrína Patris, nisi Verbum Patris? Ipse ergo Christus doctrína Patris,
        si Verbum Patris. Sed quia Verbum, non potest esse nullíus, sed alicújus: et suam doctrínam
        dixit seípsum, et non suam, quia Patris est Verbum. Quid enim tam tuum quam tu? Et quid tam
        non tuum quam tu, si alicújus est, quod es?
      en: >-
        He Who had gone up unto the Feast, not openly, but as it were in secret, the Same taught,
        and spake openly, and no man laid hands upon Him. That He had hid Himself, was for example's
        sake; that He manifested Himself, was to show His power. And when He taught, the Jews
        marvelled. As seemeth to my mind, they all marvelled, but were not all converted. And
        wherefore marvelled they? Because many of them knew where He was born, and how He had been
        brought up. They had never seen Him learn letters; but they heard Him dispute concerning the
        law, and allege the testimony of the same, as no man could do who had not read it; and no
        man can read unless he learn; and therefore they marvelled. But their marvelling was unto
        the Teacher an occasion for the revealing of higher truth.


        For when they marvelled and whispered, the Lord said a certain deep thing, yea, a thing
        worthy of very careful thought and discussion. And what was this thing which the Lord gave
        for an answer to such as marvelled that He knew letters, having never learned? Jesus
        answered them and said: My doctrine is not Mine, but His That sent Me. Here is the first
        depth, for He seemeth in these few words to enunciate a contradiction. He saith not: This
        doctrine is not Mine; but: My doctrine is not Mine. O how is it thine? If it be thine,
        wherefore sayest Thou that it is not thine? For Thou sayest: My doctrine is not Mine.


        Let us then carefully regard what this same holy Evangelist saith in the beginning of his
        Gospel, and we shall find there wherewith to loose the knot of this difficulty. There it is
        written: In the beginning was the Word, and the Word was with God, and the Word was God.
        What is the doctrine of the Father but the Word of the Father? If Christ therefore be the
        Word of the Father, He is the doctrine of the Father. But a Word cannot be of no one, but
        must needs, if it be a Word, have some one whose word it is. Christ therefore saith that His
        doctrine is Himself, and therefore not His, forasmuch as He is the Word of the Father. And
        what hast thou that is so much thine own as thy self? Or what is there that is so little
        thine own as thyself, if that which thou art is another's?
    responsory:
      la: "R. Quid me quǽritis interfícere, hóminem qui vera locútus sum vobis? * Si male locútus sum, testimónium pérhibe de malo: si autem bene, cur me cædis?\nV. Multa bona ópera operátus sum vobis: propter quod opus vultis me occídere?\nR. Si male locútus sum, testimónium pérhibe de malo: si autem bene, cur me cædis?"
      en: "R. Why go ye about to kill Me, a Man That hath told you the truth? * If I have spoken evil, bear witness of the evil; but if well, why smitest thou Me?\nV. Many good works have I wrought among you; for which of those works go ye about to kill Me?\nR. If I have spoken evil, bear witness of the evil; but if well, why smitest thou Me?"
    status: { la: verified, en: verified }
