# Matins Nocturn 2 reading for St. Alexius, Confessor (Jul 17). No
# genuine SanctiM match: the SanctiM files for this date,
# `SanctiM/07-17Moct.txt`/`07-17M.txt`, belong respectively to the
# Octave of St. Benedict (Jul 11-18) and to a different saint (St. Leo
# IV) — a missed pre-1955-pool candidate rather than a genuine SanctiM
# case (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-17.txt, English/Sancti/07-17.txt.
# Single lesson (Lectio4 — Lectio5-6 fall back to Common of a
# Confessor, not proper text, so not authored here). No responsory
# given in the source.
id: st-alexius
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Aléxius, Romanórum nobilíssimus, propter exímium Jesu Christi amórem prima nocte
        nuptiárum peculiari Dei mónitu relínquens intactam sponsam, illustrium orbis terræ
        ecclesiárum peregrinatiónem suscépit. Quibus in itinéribus cum ignotus septémdecim
        annos fuísset, aliquándo apud Edessam, Syriæ urbem, per imáginem sanctíssimæ Maríæ
        Vírginis, ejus nómine divulgato, inde navi discessit. Ad portum Romanum appulsus, a
        patre suo tamquam alienus pauper hospítio accipitur; apud quem, ómnibus incógnitus,
        cum decem et septem annos vixísset, relícto scripto sui nóminis, sánguinis, ac totius
        vitæ cursus, migrávit in cælum, Innocentio primo summo Pontifice.
      en: >-
        Alexis was a member of one of the noblest Roman families. Through his exceeding great
        love for Jesus Christ, he received a particular command from God to leave his bride
        untouched upon his wedding night, and to undertake a pilgrimage to the most famous
        Churches of the world. For seventeen years he remained occupied in these journeys and
        utterly unknown. At the end of that time, his name was spoken from an image of the most
        holy Virgin Mary in the city of Edessa, in Syria, and when he found himself recognised he
        took ship from thence. He landed at Porto near Rome, and fared to the house of his own
        father, who gave him shelter as a strange beggar. He lived there unrecognised by any for
        seventeen years more, and then passed away to heaven, in the time of Pope Innocent I. He
        left behind him a writing giving his name, family, and the story of his life.
    status: { la: verified, en: verified }
