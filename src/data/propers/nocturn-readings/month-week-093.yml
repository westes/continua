# Matins Nocturn 2 for "3rd Sunday of September" (Tempora/093-0.txt) — see
# month-week-081.yml's header for the id scheme. Own Responsory4 (not a
# cross-reference) — a September-Ember homily, distinct from
# calendar/ember-days.ts's own September Ember day content (that covers
# the Wed/Fri/Sat feria offices themselves, this is the governing Sunday's
# own Matins reading).
id: month-week-093
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Leo the Great, Sermon 9, On the September Fast"
    text:
      la: >-
        Scio quidem, dilectíssimi, plúrimos vestrum ita in iis, quæ ad observántiam christiánæ fídei
        pértinent, esse devótos, ut nostris cohortatiónibus non indígeant admonéri. Quod enim dudum et
        tradítio decrévit, et consuetúdo firmávit; nec erudítio ignórat, nec píetas prætermíttit. Sed
        quia sacerdotális offícii est, erga omnes Ecclésiæ fílios curam habére commúnem, in id quod et
        rúdibus prosit et doctis, quos simul dilígimus, páriter incitámus; ut jejúnium, quod nobis
        séptimi mensis recúrsus indícit, fide álacri per castigatiónem ánimi et córporis celebrémus.


        Ideo enim ipsa continéntiæ observántia quátuor est assignáta tempóribus, ut in idípsum totíus
        anni redeúnte decúrsu, cognoscerémus nos indesinénter purificatiónibus indigére; sempérque
        esse niténdum, dum hujus vitæ varietáte jactámur, ut peccátum, quod fragilitáte carnis et
        cupiditátum pollutióne contráhitur, jejúniis atque eleemósynis deleátur. Esuriámus páululum,
        dilectíssimi, et aliquántulum, quod juvándis possit prodésse paupéribus, nostræ consuetúdini
        subtrahámus.


        Delectétur consciéntia benignórum frúctibus largitátis: et gáudia tríbuens, quo es
        lætificándus, accípies. Diléctio próximi, diléctio Dei est, qui plenitúdinem legis et
        prophetárum in hac géminæ caritátis unitáte constítuit; ut nemo ambígeret, Deo se offérre, quod
        hómini contulísset, dicénte Dómino Salvatóre, cum de aléndis juvandísque paupéribus loquerétur:
        Quod uni eórum fecístis, mihi fecístis. Quarta ígitur et sexta féria jejunémus; sábbato vero
        apud beátum Petrum Apóstolum vigílias celebrémus: cujus nos méritis et oratiónibus crédimus
        adjuvándos, ut misericórdi Deo jejúnio nostro et devotióne placeámus.
      en: >-
        Well do I know, dearly beloved, that many of you are fervent in your observance of all those
        practices which belong to the Christian Faith, so that ye have no need to be admonished by our
        exhortations. For what tradition hath laid down, and custom well established, is neither
        unknown to the learned nor neglected by the devout. But because it appertaineth to the priestly
        office to exercise the same general care over all the Church's children in all such matters as
        be profitable alike to the learned and to the simple (both of whom are equally dear to us), we
        do now exhort the both of you to celebrate, with lively faith, and all due discipline of soul
        and body, the Quarterly Fast, which the seventh month [that is, September] doth once again
        bring to us in its yearly round.


        The Ember Days of fasting are appointed to the four seasons, in order that their quarterly
        recurrence in the course of the year may teach us how unceasingly we need to be purified, and
        how, as long as we are tossed about by the changes and chances of this life, we need through
        fasting and alms-deeds to be cleansed from the stain of that sin which we have contracted by
        the frailty of our flesh and our concupiscence. Let us diminish a little, beloved, what we are
        accustomed to use for ourselves, in order that we have somewhat more to use for the relief of
        the poor and needy.


        The conscience of the generous can thus be made glad by the fruits of their own liberality.
        Whilst thou art giving happiness thou shalt receive joy. Thy love for thy neighbor is a unity
        with thy love for God; and he hath taught us that in the unity of this twofold charity is to be
        found the fulfillment of all the Law and the Prophets. Further, if anyone doubt that what is
        given to man is offered to God, we have the saying of our Lord and Saviour, when he spake of
        feeding and helping the poor: Inasmuch as ye have done it unto one of the least of these, my
        brethren, ye have done it unto me. Wherefore, let us fast on Ember Wednesday and Friday; and on
        Ember Saturday let us also keep vigil at the shrine of blessed Peter the Apostle; by whose
        merits and prayers we believe that we shall be aided, so that we may please our merciful God in
        our fasting and prayer.
    responsory:
      la: "Sufficiébat nobis paupértas nostra, ut divítiæ computaréntur: numquam fuísset pecúnia ipsa, pro qua misísti fílium nostrum, * Báculum senectútis nostræ!\nV. Heu me, fili mi, ut quid te mísimus peregrinári, lumen oculórum nostrórum?\nR. Báculum senectútis nostræ!"
      en: "Our poverty was enough for us, that it might have been accounted riches. O that the money had never been, for which thou hast sent away our son, * The staff of our old age.\nV. Alas, my son, wherefore have we sent thee wandering, even thee, the light of our eyes?\nR. The staff of our old age."
    status: { la: verified, en: verified }
