# Matins Nocturn 2 reading for St. Gregory Barbarigo, Bishop and Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/06-17r.txt, English/Sancti/06-17r.txt.
# single lesson (Lectio94), one continuous account.
id: st-gregory-barbarigo
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gregórius Barbadícus, Venétiis perantíqua família ortus, utriúsque juris láuream
        in Archigymnásio Patavíno magna cum laude est adéptus. Undevigésimum annum
        agens, cum ad Monasteriénsem pacis Convéntum proféctus esset, legáto pontifício
        Fábio Chísio adhortánte, ecclesiásticæ milítiæ nomen dare constítuit. Sacris
        initiátus, ab eódem Chísio, Alexándri séptimi nómine ad Pontificátum assúmpto,
        Bergomátium epíscopus primum, mox, Cardinálium Collégio cooptátus, ad sedem
        Patavínam elígitur. In episcopáli múnere obeúndo, sancto Cárolo Borromǽo sibi
        exémplo propósito, ad extrémum usque spíritum adlaborávit ut, Sacrosánctæ
        Tridentínæ Sýnodi mónitis et decrétis inníxus, evélleret vítia, virtútes
        indúceret. In utráque diœcési Seminárium amplificávit, Patavínum præsértim
        bibliothéca auxit ac typographía, qua libri quoque ederéntur inter pópulos
        próximi Oriéntis vulgándi. Catechéticam instructiónem eníxe fovit, et síngulos
        diœcésis pagos, docéndo et hortándo, álacer peragrávit. Caritátis opéribus ac
        vitæ sanctitáte refúlsit, in egénos et páuperes ádeo liberális ut domésticam
        quoque supelléctilem, vestes ac lectum in eórum auxílium erogáverit. Dénique,
        post brevem lethálem morbum, plácide obdormívit in Dómino décimo quarto kaléndas
        iúlias, anno millésimo sexcentésimo nonagésimo séptimo. Quem, méritis ac
        virtútibus clarum, Clemens décimus tértius Beatórum, Joánnes vero vigésimus
        tértius Sanctórum número accénsuit.
      en: >-
        Gregory Barbarigo, born at Venice of a very old family, obtained his degree in
        Canon and Civil Law Magna cum Laude at the college of Padua. While attending the
        peace congress of Muenster at the age of nineteen, he met the papal legate Fabio
        Chigi, and with his encouragement decided to become an ecclesiastic, and was
        admitted to holy orders. When Fabio Chigi became pope under the name of
        Alexander VII, he appointed Gregory bishop of Bergamo, and soon raised him to
        the college of Cardinals, transferring him to the See of Padua. In entering upon
        his episcopal duties, he strove to model himself upon St. Charles Borromeo. It
        was his lifelong endeavor to extirpate vices and cultivate virtues in obedience,
        to the warnings and decrees of the sacred synod of Trent. In both dioceses he
        enlarged the seminaries. At Padua especially he improved the library, and the
        press, which published books for distribution among the peoples of the Near
        East. He strenuously fostered Catechetical instruction and zealously traveled to
        every village of the diocese to teach and preach. He was distinguished for his
        works of charity and the holiness of his life. So generous was he to the needy
        and poor, that he even give away his household goods, his clothes and his bed to
        help them. Finally, after a brief illness, he fell asleep peacefully in the Lord
        on June 18, 1697. Renowned for his merits and his virtues, he was inscribed
        among the Blessed by Clement XIII and among the Saints by John XXIII.
    status: { la: verified, en: verified }
