# Matins Nocturn 2 reading for St. Martina, Virgin, Martyr (Jan 30).
# Sourced directly from web/www/horas/Latin/Sancti/01-30.txt,
# English/Sancti/01-30.txt. Lectio4-6 combined into one reading, one
# continuous vita, no genuine source break. No Lectio7-9 in the source
# at all (a 6-lesson, not 9-lesson, office for this feast).
id: st-martina
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Martina virgo Romana, patre consulari, illustri genere nata, teneris, adhuc annis
        orbáta paréntibus, christianæ pietátis ardore succensa, divítias, quibus affluebat,
        mira in páuperes liberalitate distríbuit. Sub Alexandro príncipe, cum deos inánes
        cólere juberétur, immane fácinus summa libertáte detestátur. Quapropter íterum
        atque íterum affecta verbéribus, uncis, úngulis férreis, testárum fragmentis
        lacerata, acutíssimis gládiis membratim concisa, ádipe fervénti peruncta, demum in
        amphitheatro damnátur ad bestias; a quibus illǽsa divinitus evadens, in ardentem
        rogum injecta, incólumis pari beneficio servátur.


        Ex ejus tortóribus nonnulli, miraculi novitate correpti, Dei aspirante grátia,
        Christi fidem ampléxi, post cruciátus gloriósam martyrii palmam cápitis abscissióne
        promeruére. Ad ejusdem preces nunc terræmótibus exórtis, nunc ignibus e cælo
        tonante delapsis, deórum templa prostráta sunt et simulacra consumpta. Interdum ex
        vulnéribus lac cum sánguine erupit, splendorque nitidíssimus ac suavíssimus odor e
        corpore emanávit: intérdum sublimis regia in sede divinis laudibus una cum
        cælítibus interesse visa est.


        Hisce prodigiis ejusque in primis constantia, acriter permotus judex, caput Virgini
        amputari præcepit: qua perempta, auditáque de cælo voce, qua ad Súperos
        evocabátur, Urbs tota contrémuit, ac multi idolórum cultores ad Christi fidem
        convérsi sunt. Sacrum Martinæ corpus, sedénte sancto Urbano primo, martyrio
        afféctum, Urbano octavo Pontifice máximo, in pervetusta ejusdem ecclésia, ad
        Mamertinum carcerem, in Capitolini clivi radicibus, cum sanctórum Mártyrum
        Concordii, Epiphanii et Sociórum corpóribus repertum, eodem loco in meliórem formam
        redacto, atque decentius ornato, magno pópuli concursu, totius Urbis lætítia,
        solemni ritu ac pompa repósitum est.
      en: >-
        Martina was a maiden of a most illustrious Roman family, daughter of a Consul. She
        lost her parents while still very young, and, being inflamed with Christian zeal, she
        distributed her wealth, whereof she had abundance, with great profusion among the
        poor. Under the Emperor Alexander, she was commanded to sacrifice to the imaginary
        gods, and refused with much boldness to commit this great wickedness. Upon this she
        was again and again scourged, and mangled with iron prongs and hooks, and pieces of
        broken pottery. Her limbs were cut off piece by piece with sharp swords, and boiling
        tallow poured upon the living trunk. Lastly she was sent to be eaten publicly by the
        wild beasts in the amphitheatre, but by the will of God they would not touch her, and
        she was then thrown upon a burning pile, but still remained alive.


        Some of her tormentors were so moved by the spectacle, that they repented, and, by
        the grace of God confessing the faith of Christ, through which she remained constant,
        were themselves tortured and beheaded. Martina herself lay praying, with a brightness
        on her face, while a matter like milk oozed from her body along with the blood,
        emitting a soft, sweet smell. She was as it were unconscious of an earthquake and
        most violent thunderstorm which arose and was raging, and while the lightning struck
        temples, and melted statues, she seemed in spirit rather to be seated above on a
        queenly throne, praising God in heaven among the Blessed.


        The judge being infuriated at what had taken place, and chiefly at her unbending
        firmness, ordered the head of the martyr to be cut off. At the moment this was done,
        a peal which shook the city was heard, like a voice calling her home, and so great was
        the consternation, that it was made the means of conversion to many idolaters. The
        holy body of Martina wherein she had suffered in the Pontificate of Urban I. was
        discovered in the time of Urban VIII., in the very old Church called after her,
        situated at the foot of the Capitoline Hill, near the Mamertine Prison, along with the
        bodies of the holy martyrs Concordius, Epiphanius, and others. The Church was then
        altered and restored and handsomely decorated, and then the body was replaced in it,
        amid public rejoicings, with a solemn ceremony and procession.
    status: { la: verified, en: verified }
