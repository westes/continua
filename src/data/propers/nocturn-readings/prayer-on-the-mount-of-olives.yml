# Matins Nocturn 2 and 3 readings for the Prayer of Our Lord on the Mount of Olives
# (Tuesday after Septuagesima). Sourced from
# web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt.
# Nocturn 2: Lectio4-6, St. Cyprian On the Lord's Prayer (Lectio4) and St.
# Anselm's commentary on Hebrews 5 (Lectio5-6), combined into one reading, its
# closing responsory the source's Responsory6. Nocturn 3: the Gospel (Luke
# 22:39-44, the source's Mass Gospel) and then St. Ambrose's homily on it
# (Lectio7 after the incipit, Lectio8 and Lectio9), its closing responsory the
# source's Responsory8 (the source has no Responsory9). Nocturn 1 (Lectio1-3,
# Tobias 12, James 5, Hebrews 5) is not carried: continua's first nocturn runs
# the Scripture course.
#
# Latin: the source runs the heading of Lectio4 and Lectio5 into the first line;
# those headings are dropped. "Ddminus", "estm", "animamea", "meaturbata",
# "corpusmeum", "ætema", "me reamur" are source typos, corrected silently.
# Everything else is verbatim. The English is this project's own translation,
# marked draft.
id: prayer-on-the-mount-of-olives
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Cyprian, On the Lord's Prayer; St. Anselm, Commentary on the Epistle to the Hebrews, ch. 5"
    text:
      la: |
          Nec verbis tantum, sed et factis Dóminus oráre nos dócuit, ipse orans frequénter, et deprecans, et quid fácere nos oporteret exempli sui contestatione demonstrans, sicut scriptum est: Ipse autem fuit secedens in solitúdinem, et adorans. Et íterum: Exívit in montem oráre, et fuit pernoctans in oratióne Dei. Quod si ille orabat, qui sine peccáto erat, quanto magis peccatóres opórtet oráre! Et si ille per totam noctem júgiter vigilans continuis précibus orabat, quanto nos magis in frequentanda oratióne debémus nocte vigiláre! Orabat autem Dóminus, et rogábat non pro se: quid enim pro se ínnocens precarétur? sed pro delíctis nostris, sicut et ipse declarat, cum dicit ad Petrum: Ecce satanas expetivit ut vos vexaret quómodo tríticum: ego autem rogavi pro te, ne deficiat fides tua. Et póstmodum pro ómnibus Patrem deprecatur, dicens: Non pro his autem rogo solis, sed et pro illis, qui credituri sunt per verbum ipsórum in me: ut omnes unum sint, sicut tu, Pater, in me, et ego in te; ut et ipsi in nobis unum sint.

          Sicut verus Póntifex óbtulit preces: nam in Evangélio sæpe légitur orasse, et máxime apud Lucam, qui sacerdótis in eo descripsit persónam. Sed et quidquid ipse egit in carne, preces et supplicationes fuérunt pro homínibus. Tota vita sua Patrem oravit de resurrectione carnis suæ, ac de nostra salúte, et instánte jam passióne, óbtulit supplicationes, id est, humillimas et instantissimas orationes cum summa devotióne cordis et affectione, quando factus in agonia prolixius orabat et factus est sudor ejus sicut guttæ sánguinis decurrentis in terram. Et has preces supplicationesque óbtulit, id est, óbviam tulit Patri per exauditionem sibi obvianti. Óbtulit eas ad eum qui posset illum a morte salvum fácere, id est resuscitare, ad eum quem scivit esse sufficientem ut salvaret eum, id est, immortalem et impassibilem fáceret eripiendo a morte; ut nec ánima remaneret in inférno, nec caro putresceret in sepulchro.

          Et óbtulit has cum clamore valido, id est, cum intentione piæ devotiónis vehementissima et efficacissima, ut quando prolixius orabat, et étiam cum lácrimis; quia in illa prolíxa oratióne credendus est lácrimas effudisse, cum et guttæ sánguinis pro sudore decurrerent ab ejus córpore; et exauditus est, quia quod quæsierat, accépit in resurrectione. Exauditus est, id est, extra númerum aliórum ómnium auditus est, quóniam super omnem creatúram post labóris sui milítiam a Patre sublimatus est, et hoc pro sui reveréntia, id est, secúndum hoc, quod ipse sicut Dei Fílius, dignus est reveréntia et veneratióne. Vel pro sua reveréntia in Deum, id est, propter quod ipse super ómnia Patrem reveritus est et honoravit. Sive pro sua reveréntia, id est, sicut sua religio méruit. Sánguinis quoque ejus effusio potest intelligi clamor validus, in quo exauditus est pro reveréntia ejúsdem passiónis. Reveréntia est, quod sine peccáto passus est sola caritáte.
      en: |
          Not only by words but also by deeds did the Lord teach us to pray, himself praying frequently and making supplication, and showing by the witness of his own example what we ought to do, as it is written: But he retired into the wilderness, and prayed. And again: He went out into a mountain to pray, and he passed the whole night in the prayer of God. But if he prayed who was without sin, how much more ought sinners to pray! And if he, continually watching through the whole night, prayed with unceasing prayers, how much more ought we to watch by night in frequenting prayer! Now the Lord prayed and made request not for himself: for what would the innocent pray for himself? but for our sins, as he himself declares when he says to Peter: Behold, Satan hath desired to have you, that he may sift you as wheat: but I have prayed for thee, that thy faith fail not. And afterwards he beseeches the Father for all, saying: And not for them only do I pray, but for them also who through their word shall believe in me: that they all may be one, as thou, Father, in me, and I in thee; that they also may be one in us.

          As a true High Priest he offered prayers: for in the Gospel it is often read that he prayed, and especially in Luke, who described in him the person of a priest. But whatever he himself did in the flesh was prayers and supplications for men. All his life he prayed to the Father for the resurrection of his flesh and for our salvation, and when the passion was now at hand he offered supplications, that is, most humble and most urgent prayers with the highest devotion and affection of heart, when, being in an agony, he prayed the longer, and his sweat became as drops of blood trickling down upon the ground. And these prayers and supplications he offered, that is, he carried to meet the Father, by being heard as the Father met him. He offered them to him that was able to save him from death, that is, to raise him up, to him whom he knew to be sufficient to save him, that is, to make him immortal and impassible by snatching him from death; so that neither should his soul remain in hell, nor his flesh rot in the sepulchre.

          And he offered these with a strong cry, that is, with the most vehement and most efficacious intention of pious devotion, as when he prayed the longer, and also with tears; because in that long prayer he is to be believed to have shed tears, since drops of blood also ran down from his body for sweat; and he was heard, because what he had asked he received in the resurrection. He was heard, that is, he was heard beyond the number of all others, since after the warfare of his labour he was exalted by the Father above every creature, and this for his reverence, that is, according to this, that he himself as Son of God is worthy of reverence and veneration. Or for his reverence toward God, that is, because he himself revered and honoured the Father above all things. Or for his reverence, that is, as his godliness deserved. The shedding of his blood also can be understood as the strong cry, in which he was heard for the reverence of that same passion. It is reverence, that he suffered without sin, by charity alone.
    responsory:
      la: |
          R. Fiant aures tuæ auscultantes, et oculi tui aperti: * Ut aúdias oratiónem servi tui.
          V. Quam ego oro coram te hodie nocte ac die.
          R. Ut aúdias oratiónem servi tui.
      en: |
          R. Let thine ears be attentive, and thine eyes open: * That thou mayest hear the prayer of thy servant.
          V. Which I pray before thee this day, night and day.
          R. That thou mayest hear the prayer of thy servant.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: true
    citation:
      la: "Luc 22:39-44"
      en: "Luke 22:39-44"
    text:
      la: "In illo témpore: Egréssus Jesus ibat secúndum consuetúdinem in montem Olivárum. Secúti sunt autem illum et discípuli. Et cum pervenísset ad locum, dixit illis: Oráte, ne intrétis in tentatiónem. Et ipse avúlsus est ab eis, quantum jactus est lápidis, et pósitis génibus orábat, dicens: Pater, si vis, transfer cálicem istum a me: verúmtamen non mea volúntas, sed tua fiat. Appáruit autem illi Angelus de cœlo, confórtans eum. Et factus in agónia, prolíxius orábat. Et factus est sudor ejus sicut guttæ sánguinis decurréntis in terram."
      en: "At that time: Jesus went, according to his custom, to the Mount of Olives. And his disciples also followed him. And when he was come to the place, he said to them: Pray, lest ye enter into temptation. And he was withdrawn away from them a stone's cast; and kneeling down, he prayed, saying: Father, if thou wilt, remove this chalice from me: but yet not my will, but thine be done. And there appeared to him an angel from heaven, strengthening him. And being in an agony, he prayed the longer. And his sweat became as drops of blood, trickling down upon the ground."
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: false
    source: "St. Ambrose, Commentary on Luke, Bk. 10, on ch. 22"
    text:
      la: |
          Transfer a me cálicem istum: quasi homo mortem recúsans, quasi Deus senténtiam suam servans. Opórtet enim mori nos sǽculo, ut resurgamus Deo: ut juxta divínam senténtiam lex maledictionis resoluta in terræ limum natúræ fine solvátur. Quod autem ait: Non mea volúntas, sed tua fiat; suam ad hóminem rétulit, Patris ad divinitátem. Volúntas enim hóminis, temporalis, volúntas divinitátis, ætérna. Non ália volúntas Patris, ália Fílii. Una enim volúntas, ubi una divínitas. Disce tamen Deo esse subjectus, ut non quod ipse vis eligas, sed quod Deo scias esse placiturum.

          Deínde verbórum ipsórum proprietatem consideremus. Tristis est, inquit, anima mea. Et álibi: Nunc ánima mea turbata est valde. Non ergo suscípiens, sed suscépta turbatur. Ánima enim obnoxia passiónibus, divínitas líbera. Dénique spíritus promptus, caro autem infirma. Tristis autem est non ipse, sed ánima. Non est tristis sapiéntia, non divína substántia, sed ánima. Suscépit enim ánimam meam, suscépit corpus meum. Non me fefellit, ut áliud esset, et áliud viderétur. Tristis videbátur, et tristis erat non pro sua passióne, sed pro nostra dispersione.

          Dénique ait: Percútiam pastórem, et dispergéntur oves gregis. Tristis erat, quia nos párvulos relinquebat. Ceterum quam constánter se morti obtulerit consequentia declarant: quandóquidem quærentibus occurrit, turbatos confirmávit, trepidos provocavit, proditorem osculi dignatione suscépit. Nec illud distat a vero, si tristis erat pro persecutoribus suis, quos sciebat immanis sacrilegii pœnas daturos. Et ídeo dixit: Transfer hunc cálicem a me. Non quia Deus, Dei Fílius, mortem timebat; sed quia nec malos pro se períre volébat.
      en: |
          Remove this chalice from me: as a man refusing death, as God keeping his own sentence. For it behoves us to die to the world that we may rise to God, that, according to the divine sentence, the law of the curse being loosed, it may be dissolved into the clay of the earth at the end of nature. And when he says: Not my will, but thine be done; he refers his own to the man, the Father's to the divinity. For the will of man is temporal, the will of the divinity eternal. It is not one will of the Father, another of the Son. For there is one will where there is one divinity. Learn, however, to be subject to God, so that thou choose not what thou thyself wilt, but what thou knowest will be pleasing to God.

          Next let us consider the propriety of the very words. My soul, he says, is sorrowful. And elsewhere: Now is my soul troubled. It is not then he who assumes but she who is assumed that is troubled. For the soul is subject to passions, the divinity free. Finally, the spirit indeed is willing, but the flesh weak. Now it is not he himself that is sorrowful but the soul. Wisdom is not sorrowful, nor the divine substance, but the soul. For he took my soul, he took my body. He did not deceive me by being one thing and seeming another. He seemed sorrowful, and was sorrowful, not for his own passion, but for our dispersion.

          Finally he says: I will strike the shepherd, and the sheep of the flock shall be dispersed. He was sorrowful because he was leaving us little ones. Moreover how steadfastly he offered himself to death the sequel declares: since he went to meet those who sought him, confirmed the troubled, roused the fearful, received the betrayer's kiss with condescension. Nor is it far from the truth if he was sorrowful for his persecutors, whom he knew would pay the penalty of a monstrous sacrilege. And therefore he said: Remove this chalice from me. Not that God, the Son of God, feared death; but because he would not that even the wicked should perish on his account.
    responsory:
      la: |
          R. Intret in conspectu tuo oratio mea: * Inclina aurem tuam ad precem meam.
          V. Quia repleta est malis anima mea, et vita mea inferno appropinquavit.
          R. Inclina aurem tuam ad precem meam.
      en: |
          R. Let my prayer come in before thy sight: * Incline thy ear to my petition.
          V. For my soul is filled with evils, and my life hath drawn nigh to hell.
          R. Incline thy ear to my petition.
    status: { la: verified, en: draft }
