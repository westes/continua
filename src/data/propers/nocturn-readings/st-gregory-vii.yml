# Matins Nocturn 2 reading for St. Gregory VII, Pope and Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/05-25.txt, English/Sancti/05-25.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-gregory-vii
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gregórius Papa septimus, antea Hildebrandus, Suánæ in Etruria natus, doctrina,
        sanctitáte, omnique virtútum genere cum primis nobilis, mirifice universam Dei
        illustrávit Ecclésiam. Cum párvulus ad fabri ligna edolántis pedes, jam
        litterárum ínscius, lúderet, ex rejectis tamen segmentis illa Davidici eleménta
        oraculi, Dominábitur a mari usque ad mare, casu formasse narrátur: manum púeri
        ductante Númine, quo significarétur ejus fore amplíssimam in mundo auctoritátem.
        Romam deínde profectus, sub protectióne sancti Petri educátus est. Juvenis,
        Ecclésiæ libertátem a laicis oppressam ac depravatos ecclesiasticórum mores
        vehementius dolens, in Cluniacénsi monasterio, ubi sub regula sancti Benedicti
        austerioris vitæ observántia eo témpore maxime vigebat, monachi habitum induens,
        tanto pietátis ardore divinæ majestáti deserviébat, ut a sanctis ejusdem cœnobii
        pátribus prior sit eléctus. Sed, divina providéntia majora de eo disponente, in
        salútem plurimórum Cluníaco edúctus Hildebrandus, abbas primum monasterii sancti
        Pauli extra muros Urbis eléctus, ac postmodum Romanæ Ecclésiæ cardinalis
        creatus, sub Summis Pontificibus Leone nono, Victore secundo, Stephano nono,
        Nicolao secundo et Alexandro secundo, præcipuis munéribus et legatiónibus
        perfunctus est ; sanctíssimi et puríssimi consílii vir a beato Petro Damiáno
        nuncupatus. A Victore Papa secundo legátus a látere in Gálliam missus, Lugduni
        episcopum, simoníaca labe infectum, ad sui críminis confessiónem miraculo
        adegit. Berengárium in concílio Turonénsi ad iteratam hæresis abjuratiónem
        cómpulit. Cadalói quoque schisma sua virtúte compressit.


        Mortuo Alexandro secundo, invitus et mærens, unánimi ómnium consénsu, décimo
        Kalendas Maji anno Christi millesimo septuagesimo tertio, Summus Pontifex
        eléctus, sicut sol effulsit in domo Dei. Nam, potens opere et sermóne,
        ecclesiásticæ disciplinæ reparandæ, fidei propagandæ, libertáti Ecclésiæ
        restituéndæ, exstirpandis erróribus et corruptélis tanto studio incúbuit, ut ex
        Apostolórum ætate nullus Pontificum fuísse tradátur, qui majores pro Ecclésia
        Dei labóres molestiasque pertulerit, aut qui pro ejus libertáte acrius
        pugnaverit. Aliquot provincias a simoníaca labe expurgávit. Contra Henrici
        imperatóris ímpios conatus, fortis per ómnia athleta, impávidus permansit, seque
        pro muro dómui Israël pónere non tímuit ; ac eumdem Henricum, in profúndum
        malórum prolapsum, fidelium communióne regnosque privávit, atque súbditos
        pópulos fide ei data liberávit.


        Dum Missárum solemnia perágeret, visa est viris piis columba e cælo delapsa,
        humero ejus dextro ínsidens, alis exténsis caput ejus velare quo significátum
        est, Spíritus Sancti afflatu, non humanæ prudéntiæ ratiónibus ipsum duci in
        Ecclésiæ regímine. Cum ab iníqui Henrici exercitu Romæ gravi obsidióne
        premerétur, excitátum ab hostibus incendium signo crucis exstinxit. De ejus manu
        tandem a Roberto Guiscardo duce Northmanno ereptus, Cassinum se cóntulit ; atque
        inde Salernum ad dedicandam ecclésiam sancti Matthæi Apóstoli contendit. Cum
        aliquándo in ea civitáte sermónem habuísset ad pópulum, ærumnis confectus in
        morbum íncidit, quo se interitúrum præscívit. Postrema moriéntis Gregórii verba
        fuére: Diléxi justítiam et odívi iniquitátem, proptérea morior in exsílio.
        Innumerabília sunt, quæ vel fortiter sustinuit, vel multis coactis in Urbe
        Synodis sapiénter constítuit ; vir vere sanctus, criminum vindex, et acerrimus
        Ecclésiæ defensor. Exactis ítaque in pontificatu annis duodecim, migrávit in
        cælum anno salútis millesimo octogesimo quinto, plúribus in vita et post mortem
        miraculis clarus ; ejusque sacrum corpus in cathedrali basilica Salernitana est
        honorifice cónditum.
      en: >-
        Hildebrand, who reigned as Pope under the name of Gregory VII, was born at Saona
        in Tuscany. By his teaching, by his holiness, and by his graces of all kinds, he
        was a noble light of the Church, whose brightness hath shone throughout all
        lands. There is a story to the effect that when he was a little child without
        any schooling, he was playing at the feet of a carpenter who was planing wood,
        and that God guided his hand to arrange the shavings which fell into the form of
        letters, making the inspired words of David, He shall have dominion from sea to
        sea, (Ps. lxxi. 8,) a fore-shadowing, as it were, of that wide lordship over the
        earth which was afterwards his. He was taken to Rome, and brought up under the
        shelter of St. Peter. As a young man he bitterly sorrowed over the oppression of
        the freedom of the Church by the laity, and over the corruption of the clergy
        themselves. He took the habit of a monk in the Abbey of Cluny, which was then in
        all the glory of the severest observance of the Rule of St. Benedict. There he
        served God's majesty with such warmth of earnestness that the saintly fathers of
        the convent chose him to be their Prior. But the Providence of God had greater
        things in store for him, whereby to make him a source of health to many, and he
        was brought away from Cluny. He was first elected Abbot of the monastery of St.
        Paul-without-the-walls at Rome, and afterwards created a Cardinal of the Roman
        Church. Under the Popes Leo IX, Victor II, Stephen IX, Nicholas II, and
        Alexander II, he discharged great offices of trust, and the duties of a Legate,
        and Blessed Peter Damian, speaking of him at this time, calleth him a man of
        most holy and honest thoughts. When Pope Victor II. sent him as his Legate into
        France, he, by a miracle, forced the Bishop of Lyons, who was befouled by the
        pollution of simony, to acknowledge his sin in the Council of Tours he wrung
        from Berenger a second abjuration of his heresy and he prevailed against the
        schism of Cadolaus, and strangled it.


        After the death of Alexander II, Hildebrand, against his own will and to his own
        grief, was, on the 22nd day of April, in the year of Christ 1073, chosen Pope by
        one common consent of all. Reigning as Gregory VII., he was as the sun shining
        upon the Temple of the Most High. (Ecclus. 1. 7.) Mighty both in word and deed,
        he toiled for the restoration of Ecclesiastical discipline, for the spread of
        the Faith, for the defence of the freedom of the Church, for the suppression of
        error and corruption, so that since the time of the Apostles there is said never
        to have been a Pope who bore more labour and trouble for the sake of God's
        Church, or contended more manfully for her liberties. He purged diverse
        provinces of the pollution of simony. Like a brave soldier he withstood without
        dread the unrighteous contendings of the Emperor Henry IV, against whom he
        shrank not from setting himself as a wall of defence for the house of Israel.
        And when the said Henry fell into the depths of sin he cut him off from the
        communion of the faithful, and from his kingdom, and loosed the nations that
        were subject to him from their sworn allegiance.


        While he was celebrating solemn Mass, godly men saw a dove descend from heaven*
        perch upon his right shoulder, and spread out its wings so as to veil his head,
        a testimony that it was not by reasonings of man's wisdom, but by the teachings
        of the Holy Ghost, that he was guided in his rule over the Church. When the
        armies of the infamous Henry encompassed Rome, and hedged her in on every side,
        a great fire which the enemy had raised became extinct, when Gregory made the
        sign of the Cross towards it. The Norman Duke, Robert Guiscard, at length
        delivered Gregory from the hand of Henry, and he departed from Rome, first to
        the Abbey of Monte Cassino, and thence onward to Salerno, to dedicate the Church
        of St. Matthew the Apostle at that place. While he was preaching to the people
        there, on a certain day he was smitten with grievous pains, and fell into a
        sickness whereof he foresaw that he should never be healed. As he lay on his
        death-bed, Gregory's last words were I have loved righteousness and hated
        iniquity, and therefore I am dying in exile. He was a man really holy, a visitor
        of sin, and a most leal soldier of the Church. It is past reckoning how many
        sufferings he manfully bore, and how much he wisely ordained in many Councils,
        which he gathered together in Rome. He had been Pope twelve years, when, (on the
        25th day of May,) in the year of salvation 1085, he went hence to be ever with
        the Lord. Both during his life and after his death he was marked by signs and
        wonders not a few. His holy body was honourably buried in the Cathedral Church
        of Salerno.
