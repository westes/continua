# Matins Nocturn content for the Thursday after Ash Wednesday — read from
# web/www/horas/{Latin,English}/Tempora/Quadp3-4.txt. Recombined into one
# reading (Lectio1-3 are one continuous Augustine homily split only to
# fill the fixed 3-lesson slot count — this store's established default).
# Responsory is Lectio1's own (given directly in this file, not a
# cross-reference), per the "the first one, when several collapse"
# convention.
id: thursday-after-ash-wednesday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Matt 8:5-13", en: "Matthew 8:5-13" }
    text:
      la: >-
        In illo témpore: Cum introísset Jesus Caphárnaum, accéssit ad eum centúrio, rogans eum, et
        dicens: Dómine, puer meus jacet in domo paralýticus, et male torquétur. Et ait illi Jesus:
        Ego véniam, et curábo eum. Et respóndens centúrio, ait: Dómine, non sum dignus ut intres sub
        tectum meum: sed tantum dic verbo, et sanábitur puer meus. Nam et ego homo sum sub potestáte
        constitútus, habens sub me mílites, et dico huic: Vade, et vadit; et álii: Veni, et venit;
        et servo meo: Fac hoc, et facit. Audiens autem Jesus, mirátus est, et sequéntibus se dixit:
        Amen dico vobis, non invéni tantam fidem in Israël. Dico autem vobis, quod multi ab Oriénte
        et Occidénte vénient, et recúmbent cum Abraham, et Isaac, et Jacob in regno cælórum: fílii
        autem regni ejiciéntur in ténebras exterióres: ibi erit fletus et stridor déntium. Et dixit
        Jesus centurióni: Vade, et sicut credidísti, fiat tibi. Et sanátus est puer in illa hora.
      en: >-
        At that time, when Jesus had entered Capharnaum, there came to Him a centurion, who
        entreated Him, saying, "Lord, my servant is lying sick in the house, paralyzed, and is
        grievously afflicted." Jesus said to him, "I will come and cure him." But in answer the
        centurion said, "Lord, I am not worthy that You should come under my roof; but only say the
        word, and my servant will be healed. For I too am a man subject to authority, and have
        soldiers subject to me; and I say to one, 'Go,' and he goes; and to another, 'Come,' and he
        comes; and to my servant, 'Do this,' and he does it." And when Jesus heard this, He
        marveled, and said to those who were following Him, "Amen I say to you, I have not found
        such great faith in Israel. And I tell you that many will come from the east and from the
        west, and will feast with Abraham and Isaac and Jacob in the kingdom of heaven, but the
        children of the kingdom will be put forth into the darkness outside; there will be the
        weeping, and the gnashing of teeth." Then Jesus said to the centurion, "Go your way; as you
        have believed, so be it done to you." And the servant was healed in that hour.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Book 2 on the Agreement of the Evangelists, ch. 20"
    text:
      la: >-
        Videámus, utrum sibi de hoc servo centuriónis Matthǽus Lucásque conséntiant. Matthǽus enim
        dicit: Accéssit ad eum centúrio, rogans eum, et dicens: Puer meus jacet in domo paralýticus.
        Cui vidétur repugnáre quod ait Lucas: Et cum audísset de Jesu, misit ad eum senióres
        Judæórum, rogans eum ut veníret, et sanáret servum ejus. At illi cum veníssent ad Jesum,
        rogábant eum sollícite, dicéntes ei: Quia dignus est ut hoc illi præstes: díligit enim
        gentem nostram, et synagógam ipse ædificávit nobis. Jesus autem ibat cum illis: et cum jam
        non longe esset a domo, misit ad eum centúrio amícos, dicens: Dómine, noli vexári: non enim
        dignus sum ut sub tectum meum intres.


        Si enim hoc ita gestum est, quómodo erit verum, quod Matthǽus narrat: Accéssit ad eum
        quidam centúrio, cum ipse non accésserit, sed amícos míserit: nisi diligénter adverténtes
        intellegámus Matthǽum non omnímodo deseruísse usitátum morem loquéndi? Non solum enim
        dícere solémus, accessísse áliquem étiam antequam pervéniat illuc, quo dícitur accessísse:
        unde étiam dícimus: Parum accéssit, vel multum accéssit eo, quo áppetit perveníre: verum
        étiam ipsam perventiónem cujus adipiscéndi causa accéditur, dícimus plerúmque factam, etsi
        eum, ad quem pérvenit, non vídeat ille qui pérvenit, cum per amícum pérvenit ad áliquem,
        cujus ei favor est necessárius. Quod ita ténuit consuetúdo, ut jam étiam vulgo perventóres
        appelléntur, qui poténtium quorúmlibet tamquam inaccessíbiles ánimos, per conveniéntium
        personárum interpositiónem, ambitiónis arte pertíngunt.


        Non ergo absúrde Matthǽus, étiam quod vulgo possit intéllegi, per álios facto accéssu
        centuriónis ad Dóminum, compéndio dícere vóluit: Accéssit ad eum centúrio. Verúmtamen non
        negligénter intuénda est étiam sancti Evangelístæ altitúdo mýsticæ locutiónis, secúndum
        quam scriptum est in Psalmo: Accédite ad eum, et illuminámini. Proínde quia fidem
        centuriónis, qua vere accéditur ad Jesum, ipse ita laudávit, ut díceret: Non invéni tantam
        fidem in Israël: ipsum pótius accessísse ad Christum dícere vóluit prudens Evangelísta, quam
        illos, per quos verba sua míserat.
      en: >-
        Let us consider whether Matthew and Luke are at one as touching this centurion's servant.
        Matthew saith, "There came unto Him a centurion, beseeching Him, and saying, 'Lord, my
        servant lieth at home sick of the palsy.'" This seemeth to differ from what Luke saith,
        namely, "And when he heard of Jesus, he sent unto Him the elders of the Jews, beseeching
        Him that He would come and heal his servant. And when they came to Jesus, they besought him
        instantly, saying, 'That he was worthy for whom He should do this; for he loveth our
        nation, and he hath built us a synagogue.' Then Jesus went with them; and when He was now
        not far from the house, the centurion sent friends to Him, saying unto Him, 'Lord, trouble
        not thyself; for I am not worthy that Thou shouldest enter under my roof.'"


        If it were done thus, how is Matthew truthful, when he saith that the centurion came unto
        Him, seeing that, in fact, he sent his friends? We must then look well into this, and we
        shall see that Matthew only made use of a common form of speech. Now, we use to say of a
        man that he cometh to a place even though he be not already come; whence also we say, He
        arrived close, or He arrived a long way off, that is, to that place to which he would come;
        yea, we speak of that coming, toward which he tendeth, as though it had already taken
        place, when he that should be come at, seeth not yet him that cometh, but is come at for him
        by friends, to obtain his favour, which is needful for him that would come to him. And so
        much doth this manner of speaking hold, that they are commonly said to come at a great man,
        (who is beyond their personal reach,) who, by means of suitable persons, succeed in laying
        before him such things as they desire.


        Therefore it is not strange that Matthew should make use of the common short phrase, and
        say of the centurion, who reached the Lord's sympathies, by means of friends, that he came
        unto Him. Also we must needs not pass by lightly the mystic depth which underlieth the
        words of this holy Evangelist. It is written in the Psalms, "Draw near unto Him and be
        enlightened." Thus did the centurion in faith draw near unto Jesus, and the Lord so praised
        him that He said, "I have not found so great faith, no, not in Israel." Of him of whom these
        words were spoken, the Evangelist deemeth it wiser to say that he had found his way to
        Jesus, that he had got to Christ, than that they came, through whom he sent his message unto
        Him.
    responsory:
      la: "R. Dómine, puer meus jacet paralýticus in domo, et male torquétur: * Amen dico tibi, ego véniam, et curábo eum.\nV. Dómine, non sum dignus ut intres sub tectum meum: sed tantum dic verbo, et sanábitur puer meus.\nR. Amen dico tibi, ego véniam, et curábo eum."
      en: "R. Lord, my servant lieth at home sick of the palsy, and grievously tormented. * Amen, I say unto thee, I will come and heal him.\nV. Lord, I am not worthy that Thou shouldest enter under my roof, but speak the word only, and my servant shall be healed.\nR. Amen, I say unto thee, I will come and heal him."
    status: { la: verified, en: verified }
