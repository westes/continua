# Matins Nocturn 2-3 readings for the Exaltation of the Holy Cross
# (Sep 14) — identical content to finding-of-the-holy-cross.yml (May 3),
# duplicated deliberately: her own [Rule] is `ex Sancti/05-03`, reusing
# that feast's content wholesale (see exaltation-of-the-holy-cross.yml's
# calendar-record comment for why the Matins mechanism needs an actual
# duplicate here, unlike the collect/antiphon which redirect via
# `propers`). Sourced directly from web/www/horas/Latin/Sancti/05-03.txt,
# English/Sancti/05-03.txt. (Lectio1-3, Gal 3:10-14/Phil 2:5-11/
# Col 2:9-15, is left to the bible-plan store as usual.)
#
# Nocturn 2: Lectio4-6 combined into one reading — the legend of St.
# Helena's finding of the True Cross, one continuous narrative, no
# genuine source break.
# Nocturn 3: Lectio7's Gospel citation (John 3:1-15) is a bare incipit
# ("Et réliqua") with no full pericope text given, so — per the
# established convention of not transcribing bare incipits — only the
# homily portion is authored (not marked isGospel), St. Augustine's
# homily on Nicodemus (Lectio7's homily + Lectio8 combined). The source
# has no Lectio9 at all for this feast (only 8 lessons total, an
# unusual but genuine structural feature of this particular office, not
# an omission here).
id: exaltation-of-the-holy-cross
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Post insígnem victóriam, quam Constantínus imperátor, divínitus accépto signo
        Domínicæ Crucis, ex Maxéntio reportávit, Hélena Constantíni mater, in somnis
        admónita, conquiréndæ Crucis stúdio Jerosólymam venit; ubi marmóream Véneris
        státuam, in Crucis loco a Géntibus collocátam ad tolléndam Christi Dómini passiónis
        memóriam, post centum círciter octogínta annos, everténdam curávit. Quod item fecit
        ad præsépe Salvatóris et in loco resurrectiónis, inde Adónidis hinc Jovis subláto
        simulácro.


        Itaque loco Crucis purgáto, alte defóssæ tres cruces érutæ sunt, repertúsque
        seórsum ab illis Crucis Domínicæ títulus: qui cum ex tribus cui affíxus fuísset, non
        apparéret, eam dubitatiónem sústulit miráculum. Nam Macárius Jerosolymórum
        epíscopus, factis Deo précibus, síngulas cruces cuídam féminæ, gravi morbo
        laboránti, admóvit; cui cum réliquæ nihil profuíssent, adhíbita tértia Crux statim
        eam sanávit.


        Hélena, salutári Cruce invénta, magnificentíssimam ibi exstrúxit ecclésiam, in qua
        partem Crucis relíquit thecis argénteis inclúsam, partem Constantíno fílio détulit;
        quæ Romæ repósita fuit in ecclésia sanctæ Crucis in Jerúsalem, ædificáta in ædibus
        Sessoriánis. Clavos étiam áttulit fílio, quibus sanctíssimum Jesu Christi corpus
        fixum fúerat. Quo ex témpore Constantínus legem sancívit, ne crux ad supplícium
        cuíquam adhiberétur. Ita res, quæ ántea homínibus probro ac ludíbrio fúerat,
        veneratióni et glóriæ esse cœpit.
      en: >-
        After that famous victory which the Emperor Constantine gained over Maxentius, on
        the eve of which the banner of the Cross of the Lord had been given to him from
        heaven, Helen, the mother of Constantine, being warned in a dream, came to Jerusalem,
        to seek for the Cross. There it was her care to cause to be overthrown the marble
        statue of Venus, which had stood on Calvary for about one hundred and eighty years,
        and which had originally been put there to desecrate and destroy the memorial of the
        sufferings of the Lord Christ. The like work Helen did at Bethlehem, by cleansing
        from an image of Adonis the stable where the Saviour was born, and from an idol of
        Jupiter, the place where He had arisen from the dead.


        Then she had thus cleansed the place where the Cross had stood, Helen caused deep
        excavations to be made, which resulted in the discovery of three crosses, and, apart
        from them, the writing which had been nailed on that of the Lord. But which of the
        crosses had been His was unknown, and was only manifested by a miracle. Macarius,
        Bishop of Jerusalem, after offering solemn prayers to God, touched with each of the
        three a woman who was afflicted with a grievous disease. The two first had no effect,
        but at the touch of the third she was immediately healed.


        Helen, after she had found the life-giving Cross, built over the site of the Passion
        a Church of extraordinary splendour, wherein she deposited part of the Cross, shut
        up in a silver case. Another part which she gave to her son, Constantine, was laid
        up in the Church of the Holy Cross of Jerusalem, which he built at Rome on the site
        of the Sessorian Palace. She also gave to her son the nails with which the Most Holy
        Body of Jesus Christ had been pierced. Constantine established a law abolishing the
        punishment of crucifixion for all time coming and thenceforth what had hitherto been
        a hissing and a curse among men, began to be esteemed worshipful and glorious.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine of Hippo, Tractate 11 on John (on John 3:1-15)"
    text:
      la: >-
        Nicodémus ex his erat, qui credíderant in nómine Jesu, vidéntes signa et prodígia
        quæ faciébat. Supérius enim hoc dixit: Cum autem esset Jerosólymis in Pascha in die
        festo, multi credidérunt in nómine ejus. Quare credidérunt in nómine ejus? Séquitur,
        et dicit: Vidéntes signa ejus, quæ faciébat. Et de Nicodémo quid dicit? Erat
        princeps Judæórum, nómine Nicodémus. Hic venit ad eum nocte, et ait illi: Rabbi,
        scimus quia a Deo venísti magíster. Et iste ergo credíderat in nómine ejus. Et ipse
        unde credíderat? Séquitur: Nemo enim potest hæc signa fácere, quæ tu facis, nisi
        fúerit Deus cum eo.


        Si ergo Nicodémus de illis multis erat, qui credíderant in nómine ejus, jam in isto
        Nicodémo attendámus, quare Jesus non se credébat eis. Respóndit Jesus et dixit ei:
        Amen, amen dico tibi, nisi quis renátus fúerit dénuo, non potest vidére regnum Dei.
        Ipsis ergo se credit Jesus, qui nati fúerint dénuo. Ecce illi credíderant in eum, et
        Jesus non se credébat eis. Tales sunt omnes catechúmeni: ipsi jam credunt in nómine
        Christi, sed Jesus non se credit eis. Inténdat et intélligat cáritas vestra. Si
        dixérimus catechúmeno: Credis in Christum? respóndet, Credo, et signat se Cruce
        Christi: portat in fronte, et non erubéscit de Cruce Dómini sui. Ecce credit in
        nómine ejus. Interrogémus eum: Mandúcas carnem Fílii hóminis, et bibis sánguinem
        Fílii hóminis? nescit quid dícimus, quia Jesus non se crédidit ei.
      en: >-
        Nicodemus was one of them which believed in the Name of Jesus, when they saw the
        signs and wonders which He did. So hath John given us to understand a few words
        before our text: "Now when He was in Jerusalem at the Passover, in the feast-day,
        many believed in His Name." And wherefore did they believe in His Name John telleth
        us immediately: "When they saw the miracles which He did." And now, what saith he
        touching Nicodemus? "There was a man of the Pharisees, named Nicodemus, a ruler of
        the Jews. The same came to Jesus by night, and said unto Him Rabbi, we know that Thou
        art a Teacher come from God." Nicodemus therefore believed in His Name. And why did
        he believe He saith "For no man can do these miracles that Thou doest, except God be
        with him."


        Lo, then, Nicodemus was one of the many which had believed in His Name, let us seek
        to find in Nicodemus why "Jesus did not commit Himself unto them." Jesus answered
        and said unto him "Amen, Amen, I say unto thee except a man be born again, he cannot
        see the kingdom of God." Jesus therefore committeth Himself unto such as be born
        again. Behold, Nicodemus and they that were with him believed in Jesus, but Jesus did
        not commit Himself unto them. Just so are all Catechumens they believe in the Name of
        Christ, but Jesus hath not yet committed Himself unto them. Now I trust ye will be
        good enough to pay attention, and understand what I am going to say. If ye ask of a
        Catechumen "Dost thou believe in Christ" he saith "I believe," and he signeth himself
        with the sign of the Cross. The Cross of his Lord is marked upon his forehead, and he
        is not ashamed of it. Behold, he believeth in the Name of Christ. But let us ask him
        "Dost thou eat the flesh of the Son of Man" and he knoweth not what we mean, for
        Jesus hath not yet committed Himself unto him.
    status: { la: verified, en: verified }
