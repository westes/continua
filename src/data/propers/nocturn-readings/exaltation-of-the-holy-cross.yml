# Matins Nocturn 2-3 readings for the Exaltation of the Holy Cross (Sep
# 14).
#
# CORRECTED 2026-09-14 (user: "exaltation is not the same feast as
# finding" -- see exaltation-of-the-holy-cross.yml's own header). This
# file previously duplicated finding-of-the-holy-cross.yml's Nocturn 2
# reading verbatim (the legend of St. Helena finding the True Cross,
# May 3's own story) -- wrong: the reference engine's own Monastic file
# for this feast (`SanctiM/09-14.txt`) directs its own Lectio4-6 at
# `Sancti/09-14:Lectio4-6`, i.e. this feast's *own* distinct secular
# Sancti file, not Finding's. Sourced from
# web/www/horas/Latin/Sancti/09-14.txt's Lectio4-6 (Latin),
# English/Sancti/09-14.txt (English) -- the historical narrative of the
# Emperor Heraclius recovering the Cross from Chosroes, King of Persia,
# and restoring it to Calvary (614-629 AD), a genuinely different story
# from Finding's 4th-century St. Helena narrative.
#
# Nocturn 2's responsory is likewise this feast's own real, distinct
# text (SanctiM/09-14.txt's own Responsory4, "O crux benedícta...",
# English/SanctiM/09-14.txt's parallel) rather than Finding's.
#
# Nocturn 3 is unchanged and correctly still shared with Finding: the
# Monastic file's own Lectio9-12 directives resolve back to
# `Sancti/09-14:Lectio7` -- and that feast's own secular Lectio7 cites
# the *same* Gospel pericope (John 3:1-15, Nicodemus) and the same
# Augustine homily (Tractate 11 on John) that Finding's Lectio7 does --
# genuinely identical source content on both feasts, not a duplication
# error. (Lectio1-3, this feast's own proper Numbers 21:1-9 -- the
# brazen-serpent narrative that Nocturn 3's Gospel itself quotes -- is
# left to the bible-plan store as usual, same convention already used
# for Finding's own Nocturn 1.)
id: exaltation-of-the-holy-cross
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Chósroas, Persárum rex, extrémis Phocæ impérii tempóribus, Ægýpto et Africa
        occupáta ac Jerosólyma capta multísque ibi cæsis Christianórum míllibus, Christi
        Dómini Crucem, quam Hélena in monte Calváriæ collocárat, in Pérsidem ábstulit.
        Itaque Heraclíus, qui Phocæ succésserat, multis belli incómmodis et calamitátibus
        afféctus, pacem petébat; quam a Chósroa, victóriis insolénte, ne iníquis quidem
        conditiónibus impetráre póterat. Quare in summo discrímine se assíduis jejúniis et
        oratiónibus exércens, opem a Deo veheménter implorábat; cujus mónitu exércitu
        comparáto, signa cum hoste cóntulit, ac tres duces Chósroæ cum tribus exercítibus
        superávit.


        Quibus cládibus fractus Chósroas, in fuga, qua traícere Tigrim parábat, Medársen
        fílium sócium regni desígnat. Sed eam contuméliam cum Síroës, Chósroæ major natu
        fílius, ferret atróciter, patri simul et fratri necem machinátur; quam paulo post
        utríque ex fuga retrácto áttulit, regnúmque ab Heraclío impetrávit quibúsdam
        accéptis conditiónibus, quarum ea prima fuit, ut Crucem Christi Dómini restitúeret.
        Ergo Crux, quatuórdecim annis postquam vénerat in potestátem Persárum, recépta est.
        Quam rédiens Jerosólymam Heraclíus solémni celebritáte suis húmeris rétulit in eum
        montem, quo eam Salvátor túlerat.


        Quod factum illústri miráculo commendátum est. Nam Heraclíus, ut erat auro et
        gemmis ornátus, insístere coáctus est in porta, quæ ad Calváriæ montem ducébat. Quo
        enim magis prógredi conabátur, eo magis retinéri videbátur. Cumque ea re et ipse
        Heraclíus et réliqui omnes obstupéscerent; Zacharías, Jerosolymórum antístes, Vide,
        inquit, imperátor, ne isto triumpháli ornátu, in Cruce ferénda parum Jesu Christi
        paupertátem et humilitátem imitére. Tum Heraclíus, abjécto amplíssimo vestítu
        detractísque cálceis ac plebéjo amíctu indútus, réliquum viæ fácile confécit, et in
        eódem Calváriæ loco Crucem státuit, unde fúerat a Persis asportáta. Itaque
        Exaltatiónis sanctæ Crucis solémnitas, quæ hac die quotánnis celebrabátur, illústrior
        habéri cœpit ob ejus rei memóriam, quod ibídem fúerit repósita ab Heraclío, ubi
        Salvatóri primum fúerat constitúta.
      en: >-
        Chosroes of Persia, having, in the last days of the reign of the Emperor Phocas,
        overrun Egypt and Africa, took Jerusalem, where he slaughtered thousands of
        Christians and carried off to Persia the Cross of the Lord, which Helen had put upon
        Mount Calvary. Heraclius, the successor of Phocas, moved by the thought of the
        hardships and horrid outrages of war, sought for peace, but Chosroes, drunken with
        conquest, would not allow of it even upon unfair terms. Heraclius therefore, being
        set in this uttermost strait, earnestly sought help from God by constant fasting and
        prayer, and through His good inspiration gathered an army, joined battle with the
        enemy, and prevailed against three of Chosroes' chief captains, and three armies.


        Chosroes was broken by these defeats, and when in his flight he was about crossing
        the Tigris, he proclaimed his son Medarses partner in his kingdom. Chosroes' eldest
        son Siroes took this slight to heart, and formed a plot to murder his father and
        brother, which plot he brought to effect soon after they had come home. Then he got
        the kingdom from Heraclius upon certain terms, whereof the first was that he should
        give back the Cross of the Lord Christ. The Cross therefore was received back after
        that it had been fourteen years in the power of the Persians, and Heraclius came to
        Jerusalem and bore it with solemn pomp unto the Mount whereunto the Saviour had
        borne it.


        This event was marked by a famous miracle. Heraclius, who was adorned with gold and
        jewels, stayed perforce at the gateway which leadeth unto Mount Calvary, and the
        harder he strove to go forward, the harder he seemed to be held back, whereat both
        himself and all they that stood by were sore amazed. Then spake Zacharias, Patriarch
        of Jerusalem, saying: See, O Emperor, that it be not that in carrying the Cross
        attired in the guise of a Conqueror thou showest too little of the poverty and
        lowliness of Jesus Christ. Then Heraclius cast away his princely raiment and took
        off his shoes from his feet, and in the garb of a countryman easily finished his
        journey, and set up the Cross once more in the same place upon Calvary whence the
        Persians had carried it away. That the Cross had been put by Heraclius in the same
        place wherein it had first been planted by the Saviour caused the yearly Feast of
        the Exaltation of the Holy Cross to become the more famous thenceforward.
    responsory:
      la: "R. O crux benedícta, * Quæ sola fuísti digna portáre Regem cælórum et Dóminum!\nV. O crux gloriósa et admirábilis o crux veneránda!\nR. Quæ sola fuísti digna portáre Regem cælórum et Dóminum!"
      en: "R. O blessed cross, * Which alone was worthy to bear the Lord and King of the heaven.\nV. O glorious and admirable cross, O cross to be venerated.\nR. Which alone was worthy to bear the Lord and King of the heaven."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Joannes 3:1-15", en: "John 3:1-15" }
    text:
      la: >-
        In illo témpore: Erat homo ex pharisǽis, Nicodémus nómine, princeps Judæórum. Hic venit
        ad Jesum nocte et dixit ei: Rabbi, scimus, quia a Deo venísti magíster; nemo enim potest
        hæc signa fácere, quæ tu facis, nisi fúerit Deus cum eo. Respóndit Jesus et dixit ei:
        Amen, amen, dico tibi, nisi quis renátus fúerit dénuo, non potest vidére regnum Dei.
        Dicit ad eum Nicodémus: Quómodo potest homo nasci, cum sit senex? Numquid potest in
        ventrem matris suæ iteráto introíre et renásci? Respóndit Jesus: Amen, amen, dico tibi,
        nisi quis renátus fúerit ex aqua et Spíritu Sancto, non potest introíre in regnum Dei.
        Quod natum est ex carne, caro est: et quod natum est ex spíritu, spíritus est. Non
        míreris, quia dixi tibi: opórtet vos nasci dénuo. Spíritus, ubi vult, spirat, et vocem
        ejus audis, sed nescis, unde véniat aut quo vadat: sic est omnis, qui natus est ex
        spíritu. Respóndit Nicodémus et dixit ei: Quómodo possunt hæc fíeri? Respóndit Jesus et
        dixit ei: Tu es magíster in Israël, et hæc ignóras? Amen, amen, dico tibi, quia, quod
        scimus, lóquimur, et quod vídimus, testámur, et testimónium nostrum non accípitis. Si
        terréna dixi vobis et non créditis: quómodo, si díxero vobis cœléstia, credétis? Et nemo
        ascéndit in cœlum, nisi qui descéndit de cœlo, Fílius hóminis, qui est in cœlo. Et sicut
        Móyses exaltávit serpéntem in desérto: ita exaltári opórtet Fílium hóminis, ut omnis,
        qui credit in ipsum, non péreat, sed hábeat vitam ætérnam.
      en: >-
        At that time, there was a man of the Pharisees, named Nicodemus, a ruler of the Jews.
        This man came to Jesus by night, and said to him, "Rabbi, we know that thou art come a
        teacher from God; for no man can do these signs which thou dost, unless God be with
        him." Jesus answered, and said to him, "Amen, amen I say to thee, unless a man be born
        again, he cannot see the kingdom of God." Nicodemus saith to him, "How can a man be born
        when he is old? can he enter a second time into his mother's womb, and be born again?"
        Jesus answered, "Amen, amen I say to thee, unless a man be born again of water and the
        Holy Ghost, he cannot enter into the kingdom of God. That which is born of the flesh, is
        flesh; and that which is born of the Spirit, is spirit. Wonder not, that I said to thee,
        you must be born again. The Spirit breatheth where he will; and thou hearest his voice,
        but thou knowest not whence he cometh, and whither he goeth: so is every one that is
        born of the Spirit." Nicodemus answered, and said to him, "How can these things be
        done?" Jesus answered, and said to him, "Art thou a master in Israel, and knowest not
        these things? Amen, amen, I say to thee, that we speak what we know, and we testify
        what we have seen, and you receive not our testimony. If I have spoken to you earthly
        things, and you believe not; how will you believe, if I shall speak to you heavenly
        things? And no man hath ascended into heaven, but he that descended from heaven, the
        Son of man who is in heaven. And as Moses lifted up the serpent in the desert, so must
        the Son of man be lifted up: that whosoever believeth in him, may not perish, but may
        have life everlasting."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine of Hippo, Tractate 11 on John (on John 3:1-15)"
    text:
      la: >-
        Nicodémus ex his erat, qui credíderant in nómine Jesu, vidéntes signa et prodígia
        quæ faciébat. Supérius enim hoc dixit: Cum autem esset Jerosólymis in Pascha in die
        festo, multi credidérunt in nómine ejus. Quare credidérunt in nómine ejus? Séquitur,
        et dicit: Vidéntes signa ejus, quæ faciébat. Et de Nicodémo quid dicit? Erat
        princeps Judæórum, nómine Nicodémus. Hic venit ad eum nocte, et ait illi: Rabbi,
        scimus quia a Deo venísti magíster. Et iste ergo credíderat in nómine ejus. Et ipse
        unde credíderat? Séquitur: Nemo enim potest hæc signa fácere, quæ tu facis, nisi
        fúerit Deus cum eo.


        Si ergo Nicodémus de illis multis erat, qui credíderant in nómine ejus, jam in isto
        Nicodémo attendámus, quare Jesus non se credébat eis. Respóndit Jesus et dixit ei:
        Amen, amen dico tibi, nisi quis renátus fúerit dénuo, non potest vidére regnum Dei.
        Ipsis ergo se credit Jesus, qui nati fúerint dénuo. Ecce illi credíderant in eum, et
        Jesus non se credébat eis. Tales sunt omnes catechúmeni: ipsi jam credunt in nómine
        Christi, sed Jesus non se credit eis. Inténdat et intélligat cáritas vestra. Si
        dixérimus catechúmeno: Credis in Christum? respóndet, Credo, et signat se Cruce
        Christi: portat in fronte, et non erubéscit de Cruce Dómini sui. Ecce credit in
        nómine ejus. Interrogémus eum: Mandúcas carnem Fílii hóminis, et bibis sánguinem
        Fílii hóminis? nescit quid dícimus, quia Jesus non se crédidit ei.
      en: >-
        Nicodemus was one of them which believed in the Name of Jesus, when they saw the
        signs and wonders which He did. So hath John given us to understand a few words
        before our text: "Now when He was in Jerusalem at the Passover, in the feast-day,
        many believed in His Name." And wherefore did they believe in His Name John telleth
        us immediately: "When they saw the miracles which He did." And now, what saith he
        touching Nicodemus? "There was a man of the Pharisees, named Nicodemus, a ruler of
        the Jews. The same came to Jesus by night, and said unto Him Rabbi, we know that Thou
        art a Teacher come from God." Nicodemus therefore believed in His Name. And why did
        he believe He saith "For no man can do these miracles that Thou doest, except God be
        with him."


        Lo, then, Nicodemus was one of the many which had believed in His Name, let us seek
        to find in Nicodemus why "Jesus did not commit Himself unto them." Jesus answered
        and said unto him "Amen, Amen, I say unto thee except a man be born again, he cannot
        see the kingdom of God." Jesus therefore committeth Himself unto such as be born
        again. Behold, Nicodemus and they that were with him believed in Jesus, but Jesus did
        not commit Himself unto them. Just so are all Catechumens they believe in the Name of
        Christ, but Jesus hath not yet committed Himself unto them. Now I trust ye will be
        good enough to pay attention, and understand what I am going to say. If ye ask of a
        Catechumen "Dost thou believe in Christ" he saith "I believe," and he signeth himself
        with the sign of the Cross. The Cross of his Lord is marked upon his forehead, and he
        is not ashamed of it. Behold, he believeth in the Name of Christ. But let us ask him
        "Dost thou eat the flesh of the Son of Man" and he knoweth not what we mean, for
        Jesus hath not yet committed Himself unto him.
    status: { la: verified, en: verified }
