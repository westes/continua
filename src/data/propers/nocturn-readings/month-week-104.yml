# Matins Nocturn 2 for "4th Sunday of October" (Tempora/104-0.txt) — see
# month-week-081.yml's header for the id scheme. Responsory reuses 101's
# own Responsory4 (source's own cross-reference).
id: month-week-104
readings:
  - nocturn: 2
    isGospel: false
    source: "St. John Chrysostom, On Psalm 43"
    text:
      la: >-
        Deus, áuribus nostris audívimus, patres nostri annuntiavérunt nobis opus quod operátus es in
        diébus eórum. Hunc Psalmum dicit quidem prophéta, dicit autem non ex persóna própria, sed ex
        persóna Machabæórum, narrans et prædícens quæ futúra erant illo témpore. Tales enim sunt
        prophétæ: ómnia témpora percúrrunt, præséntia, prætérita, futúra. Quinam sint autem hi
        Machabǽi, quidque passi sint et quid fécerint, necessárium est primum dícere, ut sint
        apertióra quæ in arguménto dicúntur. Ii enim, cum invasísset Judǽam Antíochus qui dictus est
        Epíphanes, et ómnia devastásset, et multos qui tunc erant, a pátriis institútis resilíre
        coëgísset, permansérunt illǽsi ab illis tentatiónibus.


        Et quando grave quidem bellum ingruébat, nec quidquam possent fácere quod prodésset, se
        abscondébant; nam hoc quoque fecérunt Apóstoli. Non enim semper apparéntes in média irruébant
        perícula, sed nonnúmquam et fugiéntes, et laténtes secedébant. Postquam autem parum
        respirárunt, tamquam generósi quidam cátuli ex antris exsiliéntes et e látebris emergéntes,
        statuérunt non se ámplius solos serváre, sed étiam álios quoscúmque possent: et civitátem et
        omnem regiónem obeúntes, collegérunt quotquot invenérunt adhuc sanos et íntegros; et multos
        étiam qui laborábant et corrúpti erant, in statum prístinum redegérunt, eis persuadéntes
        redíre ad legem pátriam.


        Deum enim dicébant esse benígnum et cleméntem, nec umquam adímere salútem, quæ proficíscitur
        ex pœniténtia. Hæc autem dicéntes, habuérunt deléctum fortissimórum virórum. Non enim pro
        uxóribus, líberis, et ancíllis, patriǽque eversióne et captivitáte, sed pro lege et pátria
        república pugnábant. Eórum autem dux erat Deus. Cum ergo áciem dirígerent, et suas ánimas
        prodígerent, fundébant adversários, non armis fidéntes, sed loco omnis armatúræ, pugnæ causam
        suffícere ducéntes. Ad bellum autem eúntes non tragœ́dias excitábant, non pæána canébant,
        sicut nonnúlli fáciunt: non ascivérunt tibícines, ut fit in áliis castris: sed Dei supérne
        auxílium invocábant, ut adésset, opem ferret et manum præbéret, propter quem bellum gerébant,
        pro cujus glória decertábant.
      en: >-
        We have heard with our ears, O God, our fathers have told us, what thou hast done in their time
        of old. The Prophet speaketh thus in the Psalm, yet not in his own person, but in the person of
        the Maccabees, relating and foretelling what events were to happen at the time. For such are
        the Prophets: they outrun all times, past, present, and future. But in order that our discussion
        of the subject may be more intelligible, we must first state who were these Maccabees, and what
        they suffered, and what they did. For when Antiochus, surnamed Epiphanes, had invaded Judaea,
        and laid everything waste, and had forced many who then dwelt there to fall away from the laws
        of their fathers, the Maccabees remained unsullied by these temptations.


        And when a serious war broke out, and they could do nothing to help themselves, they hid
        themselves, as also in aftertimes the Apostles did. For they did not always rush openly into
        the midst of dangers, but sometimes fled, withdrawing thus to hide. However, after one such
        short respite, they were like eager animals leaping out of their caves and coming forth from
        their lairs, and they thereupon resolved for the future, not to win safety for themselves only,
        but for others, whomsoever they could. And going through all that city and country, they
        gathered together as many as they found who were still healthy and steadfast; and even many who
        were weak, and had been corrupted, they persuaded to return to the Law of their fathers.


        For they told them that God is merciful and gracious, and that he hath never deprived men of
        that salvation which is obtained by penitence. And, so saying, they raised a levy of the most
        valiant men. For they fought not for their wives, their children and servants, or because of
        the ruin and captivity of their fatherland, but for the Law, and the religion of their fathers.
        Now their leader was God. Therefore, when they arrayed their battle line, and put their lives
        in jeopardy, they overthrew their adversaries because they trusted not in arms, but considered
        that the just cause of their war was in itself a good armour. Moreover, when they went forth to
        the conflict, they uttered no bombast, nor sang battle songs, as some do; nor did they call
        together musicians, as is done in other armies; but they invoked the help of the Most High God,
        that he might be with them, and aid them, and strengthen their hand, because that war which
        they waged was for his glory.
    responsory:
      la: "R. Impetum inimicórum ne timuéritis: mémores estóte, quómodo salvi facti sunt patres nostri: * Et nunc clamémus in cælum et miserébitur nostri Deus noster.\nV. Mementóte mirabílium ejus, quæ fecit pharaóni et exercítui ejus in Mari Rubro.\nR. Et nunc clamémus in cælum et miserébitur nostri Deus noster."
      en: "R. Be ye not afraid of the assault of the enemy; remember how our fathers were delivered. * Now, therefore, let us cry unto heaven, and our God will have mercy upon us.\nV. Remember His marvellous works that He hath done unto Pharaoh and his host in the Red Sea.\nR. Now, therefore, let us cry unto heaven, and our God will have mercy upon us."
    status: { la: verified, en: verified }
