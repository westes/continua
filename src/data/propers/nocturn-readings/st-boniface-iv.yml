# Matins Nocturn 2 reading for St. Boniface IV, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/05-29-BonifatiusIV.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-boniface-iv
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bonifacius hujus nóminis quartus, Joánnis fílius, Valeriæ Marsorum natus, ex monacho sancti
        Sebastiani extra Urbem, et Presbytero Cardináli, sub imperatóre Phoca, ad pontificátum
        assúmptus est, et consecrátus die Domínico, quinto Kaléndas Septémbris, anno Dómini
        sexcentésimo séptimo, seditque annos sex, menses octo, dies trédecim, duábus ordinationibus
        peractis mense Decémbri, in quibus epíscopos vigínti quinque, diáconos octo creávit.


        Statim paternam domum in monastérium eréxit, et fundos suos in monachórum usum eídem
        monastério adscrípsit: sed ut longe majóri beneficio hujus institúti hómines sibi
        obstringeret, convocatis ad synodum Itáliæ epíscopis, sanctis légibus labentem monachórum
        disciplínam restítuit. Mellitus Londinensis epíscopus, qui Romam venerat, de rebus Anglicis
        Christi Vicárium consulturus, synodo intérfuit, illiusque decréta cum lítteris Bonifacii in
        Britanniam tulit.


        Ab imperatóre Phoca sanctíssimus Póntifex nobile Romæ delubrum, Pantheon scílicet, obtínuit:
        christiáno ritu consecratum in ecclésiam Deíparæ Vírgini et sanctis Martyribus dicatam
        mutávit. Ad majórem sanctitátem conciliandam, incredibilem sacrárum reliquiarum vim, ex
        divérsis arenariis. eductam, inferri, et juxta príncipem aram condi curávit. Dénique sub
        Heraclío virtúte ac méritis clarus obdormívit in Dómino, octávo Kaléndas Júnii, sepultúsque
        est in Vaticáno.
      en: >-
        Boniface, the fourth of that name, the son of John, born in Valeria of the Marsi, from a
        monk of St. Sebastian outside the City and a Cardinal Priest, was raised to the pontificate
        under the Emperor Phocas, and consecrated on Sunday, the fifth day before the Kalends of
        September, in the year of the Lord 607; and he sat six years, eight months and thirteen
        days, having completed two ordinations in the month of December, in which he created
        twenty-five bishops and eight deacons.


        Immediately he turned his paternal home into a monastery, and assigned his estates to the
        same monastery for the use of the monks; but, that he might bind men to himself by a far
        greater benefit of this institute, having convoked the bishops of Italy to a synod, by holy
        laws he restored the failing discipline of the monks. Mellitus, Bishop of London, who had
        come to Rome to consult the Vicar of Christ about the affairs of England, took part in the
        synod, and carried its decrees, with the letters of Boniface, into Britain.


        From the Emperor Phocas the most holy Pontiff obtained a noble temple of Rome, the Pantheon,
        and, consecrating it with the Christian rite, changed it into a church dedicated to the
        Virgin Mother of God and to the holy Martyrs. To win greater sanctity he had an incredible
        quantity of sacred relics brought, taken from various sand-pits, and laid beside the chief
        altar. At last, renowned for virtue and merits under Heraclius, he fell asleep in the Lord
        on the eighth day before the Kalends of June, and was buried in the Vatican.
    status: { la: verified, en: draft }
