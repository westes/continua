# Matins Nocturn 2 reading for Bl. Eugenius III, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/07-08-EugeniusIII.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: bl-eugenius-iii
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Eugenius hujus nóminis tértius, Bernárdus ántea dictus, pátria Pisanus fuit. Exacta
        adolescéntia, clericáli milítiæ nomen dedit, et sacerdótio póstea initiátus, ob egregias
        ánimi dotes inter canónicos metropolitanæ Pisanæ cooptári méruit. Sancti Bernárdi, qui tunc
        Pisas advenerat, exémplo illectus, eídem sese instituéndum dedit, atque in Claravalle
        monásticum índuit hábitum. Tanti viri disciplína ádeo profécit,ut primum Farfensi monastério
        ab eo præpósitus, deínde abbas cœnubii sanctórum Vincentii et Anastasii ad Aquas Sálvias ab
        Innocéntio secúndo Summo Pontífice eléctus fúerit. Quo in obeúndo múnere cum sanctimóniæ ac
        prudéntiæ miro splendóre inclaruisset, a cardinálibus post Lúcii secúndi óbitum cunctis
        suffrágiis Póntifex Máximus creátus est. Vix autem ab inito pontificátu, perduellium turbis
        Ecclésiæ Románæ principatum evertere adnitentibus, semel atque íterum ab Urbe discédere
        cógitur, sedataque deínde tempestáte íterum ad eam summo honóre, et bonórum gratulatione
        regreditur.


        Viterbii commorans, Angliæ legátos, Scótiæ, Germániæ, Hispániæ et Gálliæ excépit, beáto
        Petro in ejus persdna obedientiam et obséquium profitentes; itémque non nullos Armeniæ
        epíscopos, qui ínsuper Metropolitani ac gentis suæ nómine de gravioribus orientális ecclésiæ
        negótiis ejus exquisiverunt senténtiam. Proféctus in Gálliam, concilia Rhemis ac Treviris
        celebrávit, in quibus Eonis et Gilberti Porretani proscripsit erróres, aliáque plura
        sapiénter constítuit ad cleri disciplínam, et Ecclésiæ libertatem. Cœnobia deínde
        Claravallense ac Cisterciénse una cum sancto Bernardo invisit præcláris ubíque sanctæ
        conversationis exémplis relíctis. Ab eódem Bernardo salutaria monita exquisívit ad Ecclésiam
        administrandam, et apostólicæ Sedis jura protuenda; ille vero ei pretiósum librum de
        Consideratione dedit, quo Pontíficis principisque prærogativæ et offícia cœlesti sapiéntia
        declarantur. Litterárum quoque cultor exímius, cum theologíæ ac jurisprudéntiæ reformávit
        stúdia, tum academicos, uti vocant, gradus instítuit, quo adolescentium ánimos alacriores
        rédderet.


        Singulári pacis fovendæ cupiditáte, curas omnes inténdit, ut discórdias Pisanos inter et
        Lucenses compóneret. Decórem domus Dei summópere diléxit: nam et basílicam Liberianam
        pulchriori decorávit ornátu, et ália templa quamplura, aut refecit, aut pretiósis donis
        ditavit. Vaticánæ autem basílicæ quartam oblationum partem sibi de more competentem, præter
        decimam jam a sancto Leóne nono Apostolórum Principi attributam, elargitus est. Henrícum
        imperatórem, catholicorum príncipum nobile exémplar, sanctórum in album rétulit. Tandem
        Tibure, quo æstivos calóres vitandi causa ab Urbe concesserat, gravi morbo implicitus,
        mortem justórum appetiit octávo Idus Júlii anno millésimo centésimo quinquagésimo tértio,
        postquam in Petri cáthedra sedisset annos octo, et menses quátuor. Corpus Romam delátum,
        cónditum fuit in Vaticáno, una cum sancti Gregórii tértii et beáti Petri Levitæ exuviis.
        Sacrum porro cultum jam tunc miraculórum accedente fulgóre ei exhibitum, et in áliis quoque
        regiónibus, ad hæc usque témpora vigentem, Summus Póntifex Pius nonus, ex Sacrórum Rítuum
        Congregatiónis consúlto, ratum hábuit et confirmávit.
      en: >-
        Eugenius, the third of that name, formerly called Bernard, was a native of Pisa. His youth
        over, he enrolled himself in the clerical militia, and afterwards, initiated in the
        priesthood, by his eminent gifts of mind he deserved to be co-opted among the canons of the
        metropolitan church of Pisa. Drawn by the example of St. Bernard, who had then come to Pisa,
        he gave himself to be instructed by him, and in Clairvaux put on the monastic habit. Under
        the discipline of so great a man he so profited that he was first placed by him over the
        monastery of Farfa, then elected by Innocent the Second, Supreme Pontiff, abbot of the
        monastery of Saints Vincent and Anastasius at Aquae Salviae. In discharging this office,
        when he had shone with a wonderful splendour of sanctity and prudence, after the death of
        Lucius the Second he was created Supreme Pontiff by the votes of all the cardinals. Scarcely
        had he begun his pontificate when, rebels striving to overturn the dominion of the Roman
        Church, he was compelled once and again to depart from the City, and, the storm having then
        been calmed, returned to it again with the highest honour and the rejoicing of the good.


        Staying at Viterbo, he received legates of England, Scotland, Germany, Spain and Gaul,
        professing obedience and homage to blessed Peter in his person; likewise some bishops of
        Armenia, who besides, in the name of the Metropolitan and of their nation, sought his
        judgment on graver affairs of the Eastern church. Having gone into Gaul, he celebrated
        councils at Rheims and Trier, in which he proscribed the errors of Eon and of Gilbert de la
        Porrée, and wisely established many other things for the discipline of the clergy and the
        liberty of the Church. He then visited the monasteries of Clairvaux and Cîteaux together
        with St. Bernard, leaving everywhere shining examples of holy conversation. From the same
        Bernard he sought salutary admonitions for administering the Church and defending the rights
        of the Apostolic See; and he gave him the precious book On Consideration, in which the
        prerogatives and duties of Pontiff and prince are declared with heavenly wisdom. An eminent
        patron also of letters, he reformed the studies of theology and jurisprudence, and
        instituted academic degrees, as they are called, to make the minds of the young more eager.


        With singular desire for fostering peace, he directed all his care to composing the discords
        between the Pisans and the Lucchese. He loved exceedingly the beauty of the house of God:
        for he adorned the Liberian basilica with fairer ornament, and either repaired many other
        churches or enriched them with precious gifts. To the Vatican basilica he bestowed the
        fourth part of the offerings which by custom belonged to himself, besides the tenth already
        assigned to the Prince of the Apostles by St. Leo the Ninth. He enrolled in the catalogue of
        saints the Emperor Henry, a noble example of Catholic princes. At last at Tivoli, whither he
        had withdrawn from the City to avoid the summer heats, seized by a grave illness, he sought
        the death of the just on the eighth day before the Ides of July in the year one thousand one
        hundred and fifty-three, after he had sat in the chair of Peter eight years and four months.
        His body was carried to Rome, and laid in the Vatican, together with the remains of St.
        Gregory the Third and of blessed Peter the Levite. The sacred cult already then rendered to
        him, the splendour of miracles accruing, and in other regions also flourishing down to these
        times, the Supreme Pontiff Pius the Ninth, on the advice of the Sacred Congregation of
        Rites, held valid and confirmed.
    status: { la: verified, en: draft }
