# Matins Nocturn 2 reading for Ss. Sixtus II, Felicissimus, and Agapitus,
# Martyrs (Aug 6). Sourced from web/www/horas/Latin/Sancti/08-06cc.txt
# (Lectio93, the source's own single combined lesson) and
# English/Sancti/08-06cc.txt's real translation -- both verified, no
# translation needed.
id: ss-sixtus-felicissimus-and-agapitus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Xystus secúndus, Atheniénsis, ex philósopho Christi discípulus, in persecutióne
        Valeriáni accusátus quod públice Christum prædicáret, comprehénsus tráhitur in
        templum Martis, propósita ei capitáli pœna, nisi illi simulácro sacrificáret. Qua
        impietáte constantíssime recusáta, cum ad martýrium ducerétur, occurrénti sancto
        Lauréntio et dolénter in hunc modum interrogánti, Quo progréderis sine fílio, pater?
        quo, sacérdos sancte, sine minístro próperas? respóndit: Non ego te désero, fili,
        majóra te manent pro Christi fide certámina: post tríduum me sequéris, sacerdótem
        levíta; intérea, si quid in thesáuris habes, paupéribus distríbue. Eódem ígitur die
        interféctus est una cum Felicíssimo et Agapíto diáconis, Januário, Magno, Vincéntio
        et Stéphano subdiáconis; et in cœmetério Callísti sepúltus octávo Idus Augústi,
        céteri vero in cœmetério Prætextáti. Sedit menses úndecim, dies duódecim. Quo
        témpore hábuit ordinatiónem mense Decémbri, creátis presbýteris quátuor, diáconis
        septem, epíscopis duóbus.
      en: >-
        Xystus II. was an Athenian, who, from a philosopher, became a disciple of Christ. In
        the persecution under Valerian he was accused of openly preaching Christ, and was
        seized and haled to the temple of Mars, where he was given the choice of death or
        offering sacrifice to the idol. He firmly refused to commit that wickedness, and as
        he was being led away to seal his testimony, holy Lawrence ran up to him and in his
        grief said to him: Father, whither goest thou without thy son? Holy Priest, dost
        thou fare hence without a Deacon? Xystus answered him: I am not leaving thee, my
        son; there awaiteth thee for Christ's truth a sterner wrestling than mine; yet three
        days, and thou shalt follow me, the Deacon behind the Priest; and in the meanwhile,
        if thou hast anything in the treasury, give it to the poor. Xystus was accordingly
        slain upon that day, and with him the Deacons Felicissimus and Agapitus, and the
        Subdeacons Januarius, Magnus, Vincent, and Stephen. He was buried in the cemetery of
        Callistus, and they in the cemetery of Praetextatus, upon the 6th day of August. He
        sat in the throne of Peter eleven months and twelve days. During that time he held
        one ordination in the month of December, wherein he made four Priests, seven
        Deacons, and two Bishops.
    status: { la: verified, en: verified }
