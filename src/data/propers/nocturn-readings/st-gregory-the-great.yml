# Matins Nocturn 2 reading for St. Gregory the Great, Pope, Confessor,
# Doctor (Mar 12) — SanctiM/03-12.txt's own Lectio5-12 all resolve back
# to `@Sancti/03-12:LectioN` (resliced for the Monastic 12-lesson
# structure), so this saint's own vita is sourced from the Tridentine
# track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/03-12.txt, English/Sancti/03-12.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. Lectio7-9's Gospel+homily (Matt 16:13-19, St. Leo's
# sermon on Peter's confession) is generic Chair-of-Peter content
# unrelated to Gregory himself, not proper to this feast, so not
# authored here — same judgment as the same lessons appearing verbatim
# under `chair-of-st-peter-at-rome.yml`'s own sourcing. No responsory
# given for Lectio4-6.
id: st-gregory-the-great
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gregórius Magnus, Románus, Gordiáni senatóris fílius, adoléscens philosophíæ óperam
        dedit; et prætório offício functus, patre mórtuo, sex monastéria in Sicília ædificávit,
        Romæ séptimum sancti Andréæ nómine in suis ǽdibus, prope basílicam sanctórum Joánnis et
        Pauli ad Clivum Scauri, ubi Hilarióne ac Maximiáno magístris, monáchi vitam proféssus,
        póstea abbas fuit. Mox diáconus cardinális creátus, Constantinópolim a Pelágio Pontífice
        ad Tibérium Constantínum imperatórem legátus míttitur: apud quem memorábile étiam illud
        effécit, quod Eutýchium patriárcham, qui scrípserat contra veram ac tractábilem córporum
        resurrectiónem, ita convícit, ut ejus librum imperátor in ignem injíceret. Quare
        Eutýchius paulo post cum in morbum incidísset, instánte morte, pellem manus suæ tenébat,
        multis præséntibus, dicens: Confíteor quia omnes in hac carne resurgémus.


        Romam rédiens, Pelágio pestiléntia subláto, summo ómnium consénsu Póntifex elígitur: quem
        honórem ne accíperet, quámdiu pótuit, recusávit; nam aliéno vestítu in spelúnca delítuit:
        ubi deprehénsus indício ígnæa colúmnæ, ad sanctum Petrum consecrátur. In pontificátu
        multa successóribus doctrínæ ac sanctitátis exémpla relíquit. Peregrínos quotídie ad
        mensam adhibébat: in quibus et Ángelum, et Dóminum Angelórum peregríni fácie accépit.
        Páuperes et urbános et extérnos, quorum númerum descríptum habébat, benígne sustentábat.
        Cathólicam fidem multis locis labefactátam restítuit. Nam Donatístas in Africa, Ariános
        in Hispánia représsit: Agnoítas Alexandría ejécit. Pállium Syágrio Augustodunénsi
        epíscopo dare nóluit, nisi neóphytos hæréticos expélleret ex Gállia. Gothos hǽresim
        Ariánam relínquere coégit. Missis in Británniam doctis et sanctis viris Augustíno et
        áliis mónachis, ínsulam ad Jesu Christi fidem convértit, vere a Beda presbýtero Angliæ
        vocátus Apóstolus. Joánnis patriárchæ Constantinopolitáni audáciam fregit, qui sibi
        universális Ecclésiæ epíscopi nomen arrogábat. Maurítium imperatórem, eos qui mílites
        fuíssent, mónachos fíeri prohibéntem, a senténtia detérruit.


        Ecclésiam ornávit sanctíssimis institútis et légibus. Apud sanctum Petrum coácta sýnodo,
        multa constítuit: in iis, Ut in Missa Kýrie eléison nóvies repeterétur: ut extra id
        tempus, quod continétur Septuagésima et Pascha, Alle­lúja dicerétur: ut adderétur in
        Cánone, Diésque nostros in tua pace dispónas. Litanías, Statiónes, et ecclesiásticum
        offícium auxit. Quátuor concíliis, Nicǽno, Constantinopolitáno, Ephesíno, Chalcedonénsi,
        tamquam quátuor Evangéliis honórem habéri vóluit. Epíscopis Sicíliæ, qui ex antíqua
        ecclesiárum consuetúdine Romam síngulis triénniis conveniébant, quinto quoque anno semel
        veníre indúlsit. Multos libros confécit: quos cum dictáret, testátus est Petrus diáconus,
        se Spíritum Sanctum colúmbæ spécie in ejus cápite sæpe vidísse. Admirabília sunt quæ
        dixit, fecit, scripsit, decrévit, præsértim infírma semper et ægra valetúdine. Qui
        dénique multis éditis miráculis, pontificátus anno décimo tértio, mense sexto, die
        décimo, quarto Idus Mártii, qui dies festus a Græcis étiam propter insígnem hujus
        Pontíficis sapiéntiam ac sanctitátem præcípuo honóre celebrátur, ad cæléstem
        beatitúdinem evocátus est. Cujus corpus sepúltum est in basílica sancti Petri, prope
        Secretárium.
      en: >-
        Gregory the Great was a Roman, the son of Gordian the Senator. As a young man he studied
        philosophy, and afterwards discharged the office of Praetor. After his father's death he
        built six monasteries in Sicily, and a seventh in honour of St. Andrew, in his own house
        at Rome, hard by the Church of Saints John and Paul at the ascent of the hill Scaurus. In
        this monastery of St. Andrew, he and his masters, Hilarion and Maximian, professed
        themselves monks, and Gregory was afterwards Abbot. Later on, he was created a Cardinal
        Deacon, and sent to Constantinople as legate from Pope Pelagius to the Emperor Tiberius
        Constantine. Before the Emperor he so successfully disputed against the Patriarch
        Eutychius, who had denied that our bodies shall verily and indeed rise again, that the
        Prince threw the book of the said Patriarch into the fire. Eutychius himself also, soon
        after fell sick, and when he felt death coming on him, he took hold of the skin of his own
        hand and said in the hearing of many that stood by: I acknowledge that we shall all rise
        again in this flesh.


        Gregory returned to Rome, and, Pelagius being dead of a plague, he was unanimously chosen
        Pope. This honour he refused as long as he could. He disguised himself and took refuge in
        a cave, but was betrayed by a fiery pillar. Being discovered and overruled, he was
        consecrated at the grave of St. Peter. He left behind him many examples of doctrine and
        holiness to them that have followed him in the Papacy. Every day he brought pilgrims to
        his table, and among them he entertained not an Angel only, but the very Lord of Angels in
        the guise of a pilgrim. He tenderly cared for the poor, of whom he kept a list, as well
        without as within the city. He restored the Catholic faith in many places where it had
        been overthrown. He fought successfully against the Donatists in Africa and the Arians in
        Spain. He cleansed Alexandria of the Agnoites. He refused to give the Pall to Syagrius,
        Bishop of Autun, unless he would expel the Neophyte heretics from Gaul. He caused the
        Goths to abandon the Arian heresy. He sent into Britain Augustine and diverse other
        learned and holy monks, who brought the inhabitants of that island to believe in Jesus
        Christ. Hence Gregory is justly called by Bede, the Priest of Jarrow, the Apostle of
        England. He rebuked the presumption of John, Patriarch of Constantinople, who had taken
        to himself the title of Bishop of the Universal Church, and he dissuaded the Emperor
        Maurice from forbidding soldiers to become monks.


        Gregory adorned the Church with holy customs and laws. He called together a Synod in the
        Church of St. Peter, and therein ordained many things; among others, the ninefold
        repetition of the words Kyrie eleison in the Mass, the saying of the word Alleluja in the
        Church service except between Septuagesima inclusive and Easter exclusive, and the
        addition to the Canon of the Mass of the words Do Thou order all our days in thy peace.
        He increased the Litanies, the number of the Churches where is held the observance called
        a Station, and the length of the Church Service. He would that the four Councils of Nice,
        Constantinople, Ephesus, and Chalcedon should be honoured like four Gospels. He released
        the Sicilian Bishops from visiting Rome every three years, willing them to come instead
        once every five years. He was the author of many books, and Peter the Deacon declareth
        that he often saw the Holy Ghost on his head in the form of a dove when he was dictating
        them. It is a marvel how much he spoke, did, wrote, and legislated, suffering all the
        while from a weak and sickly body. He worked many miracles. At last God called him away
        to be blessed for ever in heaven, in the thirteenth year, sixth month, and tenth day of
        his Pontificate, being the 12th day of March. This day is observed by the Greeks, as well
        as by us, as a festival, on account of the eminent wisdom and holiness of this Pope. His
        body was buried in the Church of St. Peter, hard by the Private Chapel.
    status: { la: verified, en: verified }
