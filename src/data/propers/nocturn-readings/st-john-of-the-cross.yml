# Matins Nocturn 2 reading for St. John of the Cross, Confessor and Doctor of the Church. Sourced directly from
# web/www/horas/Latin/Sancti/11-24.txt, English/Sancti/11-24.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-john-of-the-cross
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánnes a Cruce, Fontíberi in Hispánia piis paréntibus natus, a primis annis
        certo innotuit quam Deiparæ Virgini futurus esset acceptus; nam quinquennis, in
        púteum lapsus, ejusdem Deiparæ manu sublatus, incolumis evasit. Tanto autem
        patiéndi desidério flagrávit, ut novennis, spreto molliori lecto, super
        sarmentis cubare consueverit. Adoléscens hospítio páuperum ægrotántium Metymnæ
        Campi famulum sese addixit, quibus magno caritátis ardore, vilíssima quæque
        complectens officia, præsto aderat. Cujus exemplo excitáti ceteri, éadem
        caritátis múnera ardentius obibant. Verum, ad altióra vocatus, beátæ Maríæ
        Vírginis de Monte Carmelo institutum amplexus est; ubi, sacerdos ex obediéntia
        factus, severioris disciplinæ et arctioris vitæ cupidíssimus, primitivam ordinis
        regulam ex superioris licéntia ita proféssus est, ut, ob jugem Dominicæ
        passiónis memóriam, bello in se, tamquam in infensíssimum hostem indicto,
        vigiliis, jejuniis, férreis flagellis omnique pœnárum genere, brevi carnem cum
        vitiis et concupiscéntiis suis crucifixerit; dignus plane, qui a sancta Teresia
        inter puriores sanctioresque ánimas, Ecclésiam Dei id témporis illustrántes,
        recenserétur.


        Singulari vitæ austeritáte et ómnium virtútum præsidio munítus, præ assidua
        rerum divinárum contemplatióne, diuturnas et mirábiles éxtases frequenter
        patiebátur; tantoque in Deum æstuábat amóre, ut, cum divinus ignis sese intro
        diutius continere non posset, foras erumpere ejusque vultum irradiare visus sit.
        Proximórum salúti summopere intentus, tum in verbi Dei prædicatióne, tum in
        sacramentórum administratióne fuit assiduus. Hinc tot meritis auctus,
        strictiorisque disciplinæ promovendæ ardore veheménter accénsus, sanctæ Teresiæ
        comes divinitus datus est, ut, quam ipsa inter sorores primævam Carmeli ordinis
        observantiam instauráverat, eamdem et inter fratres, Joánne adjutore,
        restitúeret. Innumeros ítaque una cum Dei famula in divino opere promovéndo
        perpéssus labóres, cœnobia, quæ ejusdem sanctæ Vírginis cura per totam Hispániam
        erecta fuerant, nullis vitæ incommodis et periculis térritus, singula
        perlustrávit. In quibus aliisque quam plurimis, ejus ópera eréctis, restauratam
        observantiam propagando, verbo et exemplo firmávit; ut mérito primus, post
        sanctam Teresiam, Carmelitárum excalceatórum ordinis professor et parens
        habeátur.


        Virginitátem perpetuo coluit, impudentésque mulieres ejus pudicítiæ insidiari
        conántes, non modo répulit, sed étiam Christo lucrifecit. In divinis explicandis
        arcanis æque ac sancta Teresia, apostolicæ Sedis judício, divínitus instructus,
        libros de mystica theología, cælésti sapiéntia refertos, conscripsit. Semel
        interrogátus a Christo quid præmii pro tot labóribus pósceret, respóndit:
        Dómine, pati et contemni pro te. Imperio in dæmones, quos e corpóribus sæpe
        fugabat, discretióne spirituum, prophetíæ dono, miraculórum glória
        celebratíssimus, ea semper fuit humilitate, ut sæpius a Dómino flagitaverit eo
        loco mori, ubi ómnibus esset ignotus. Voti compos factus. Ubedæ, diro morbo et
        in crure quinque plagis sanie manántibus, ad impléndum patiéndi desidérium
        constantíssime tolerátis, Ecclésiæ sacramentis pie sancteque susceptis, in
        Christi crucifixi amplexu, quem semper in corde atque ore habuerat, post illa
        verba: In manus tuas comméndo spíritum meum, obdormívit in Dómino, die et hora a
        se prædictis, anno salútis millesimo quingentésimo nonagesimo primo, ætátis
        quadragesimo nono. Migrántem ejus ánimam splendidíssimus ignis globus excepit;
        corpus vero suavíssimum odórem spirávit, quod, etiamnum incorruptum, Segoviæ
        honorifice cólitur. Eum, plurimis ante et post óbitum fulgentem signis,
        Benedíctus décimus tertius Pontifex maximus in Sanctórum númerum retulit, et
        Pius undecimus ex Sacrórum Rituum Congregatiónis consulto, universalis Ecclésiæ
        Doctórem declarávit.
      en: >-
        John of the Cross was born of godly parents at Fontibere, (near Avila,) in
        Spain, (in the year of our Lord 1542.) It began soon to appear that he was
        foreordained to be an acceptable servant unto the Virgin Mother of God. At five
        years of age he fell into a well, but the hand of the Mother of God took him up,
        and saved him from all hurt. So burning was his desire to suffer that when he
        was nine years old he gave up any softer bed, and used to lie on potsherds. In
        his youth he devoted himself as a servant in the hospital for the sick poor at
        Medina del Campo, and embraced with eager charity the meanest offices there, his
        readiness likewise exciting others to imitate him. (In 1563) he obeyed the call
        to higher things, and entered the Order of the Blessed Virgin Mary of Mount
        Carmel, wherein, by command of his Superiors, he received Priest's Orders. By
        their leave and his own strong desire for the sternest discipline and the
        strictest life, he adopted the primitive Rule. Full of the memory of what our
        Lord suffered, he declared war against himself as his own worst enemy, and
        carried it on by depriving himself of sleep and food, by iron chains, by whips,
        and by every kind of self-torture. And in a little while he had crucified the
        flesh, with the affections and lusts thereof. He was indeed worthy that holy
        Theresa should say of him that he was one of the purest and holiest souls by
        whom God was then enlightening His Church.


        The strange hardness of his life, and the might of his graces, joined to the
        unceasing concentration of his mind on God, had the effect of oftentimes
        subjecting him to daily and extraordinary trances. So burning was his love of
        God that the fire sometimes could not be kept bound within, and brake forth, so
        that his face shone. The salvation of his neighbours was one of his dearest
        longings, and he was unwearied in preaching the Word of God, and in
        administering the Sacraments. As strong in so many good works, and glowing with
        zeal to make discipline harder, he was given by God to be an helpmeet to holy
        Theresa, and he aided her to set up again the primitive observance among the
        brethren of the Order of Mount Carmel, as she had already done among the
        sisters. In doing God's work, he and God's handmaid together went through toils
        that cannot be numbered. No discomforts or dangers held him back from going
        throughout all Spain to visit all and each of the convents which the care of
        that holy Virgin had founded, and in them, and in very many others erected by
        her means for spreading the renewed observance, he strengthened it by his word
        and example. He is indeed worthy to be reckoned second only to the holy Theresa
        as a professor and founder of the Order of bare-footed Carmelites.


        He remained throughout all his life a clean maid, and when some shameless women
        tried to beguile his modesty, he not only foiled them, but gained them for
        Christ. In the judgment of the Apostolic See he was as much taught of God as was
        holy Theresa, for explaining God's hidden mysteries, and he wrote books of
        mystical theology filled with heavenly wisdom. Christ once asked him what reward
        he would have for so much work; whereto he answered Lord, that I may suffer, and
        be disesteemed for thy sake. He was very famous for his power over devils, whom
        he oftentimes scared out of men's bodies, for discerning of spirits, for the
        gift of prophecy, and for eminent miracles. He was extraordinarily lowly, and
        oftentimes entreated of the Lord that he might die in some place where he was
        unknown. In accordance with his prayer, (he was sent) to Ubeda, (where for three
        months the Prior imprisoned and cruelly ill-used him during his last sickness.)
        To crown his love of suffering, he bore uncomplainingly five open sores in his
        leg, running with water. (At last, upon the 14th day of December,) in the year
        1591, being the day, and at the hour foretold by himself, after having in godly
        and holy wise received the Sacraments of the Church, hugging (the image of) that
        crucified Saviour of Whom his heart and his mouth had been used to be full, he
        uttered the words: “Into thy hands I commend my spirit”, and fell asleep in the
        Lord. As his soul passed away it was received into a glorious cloud of fire. His
        body yielded a right sweet savour, and is still uncorrupt where it lieth, held
        in great honour, at Segovia. He was famous for very many miracles both before
        and since his death, and Pope Benedict XIII numbered his name among those of the
        Saints.
