# Matins Nocturn 2 and 3 readings for St. Benedict Joseph Labre, Confessor. Sourced from
# web/www/horas/Latin/Sancti/aliquibus locis/04-16-BenedictusJLabre.txt. Nocturn 2 is
# Lectio4-6 combined into one continuous life (the source has no responsories of its
# own). Nocturn 3 is the Gospel (Matt 16:24-27, the source's Mass Gospel, which is also
# the incipit of its Lectio7, `@Commune/C2-1`) and then Lectio7-9, St. Gregory the Great,
# Homily 32 on the Gospels, as the source takes them from Commune/C2 ("in 2 loco"). The
# Gospel and homily English is the reference's own (English/Commune/C2-1.txt and C2.txt).
# Nocturn 1 (the source has none of its own) is the Scripture course.
#
# Latin: three obvious typos corrected silently -- "Eomam" -> "Romam", "Garthusionos" ->
# "Carthusiános", and a full stop restored before "Insectis" and before "Cœlitem".
# Everything else is verbatim. English of Lessons 4-6 is this project's own translation,
# marked draft.
id: st-benedict-joseph-labre
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: |
          In óppido Amettes Boloniensis diœcésis in Gállia ex honéstis piissimisque paréntibus ortus est Benedíctus Joséphus Labre. Divína grátia præventus, gravem et a nugis alienam índolem a puerili ætáte osténdit, et suis frátribus pietáte, obediéntia, solertia in addiscendis christiánæ doctrínæ ac litterárum rudiméntis perféctum exémplar præfúlsit. Duodénnis ad patruum sacerdótem parœciæ præpositum missus, eruditióne páriter ac virtúte profécit, Hinc caritáte flagrans in próximos, confluentium egenórum nullum a se discédere sivit inánem, eidémque pátruo sócium indivíduum se adjúnxit in ægrorum solátium, dira lue per loca grassánte, cujus ille victima occúbuit. Nulli labóri parcens, nec perículo territus, vilióra quæque obívit offícia ad eórum levandam calamitatem, qui morbo correpti jacebant, pastórum quoque vices explens in pascéndis grégibus ab eis relíctis, gramine in arvis a se collecto pro pécorum alimonia; ideóque factum est ut sibi ángeli nomen promeruerit. Neque áliter exínde egit apud avúnculum, ubi omníno spléndidum caritátis et mansuetúdinis spécimen édidit, mira patiéntia et benignitate longo témpore perpéssus singulárem cujúsdam contubernalis morositatem, a quo noctu diuque male habebátur.

          Ad austerissimum vitæ genus jámdiu se appellátum sentiens, rigido jejúnio aut duro tantum pane dies transigere assueverat, brevem fessis membris quietem dare super nudos asseres cum cervicali ex lígneis fragmentis, flagello se cædere, pluresque horas flexis ante augustissimum Eucharístiæ Sacraméntum génibus orándo impendere. Ratus porro se ad asperius aliquod cœnobiticum institútum a Deo vocári, ad Trappenses primum se cóntulit, deínde ad Carthusiános, postrémo ad Cistercienses. Sed ob gracilem córporis hábitum et contractas ægritudines a síngulis abire coáctus fuit; ita disponénte Deo, ut beátus júvenis arctióris sequelæ crucis Christi in médio pópuli spectaculum fíeret mundo, et Ángelis, et homínibus. Nam cum ferventiori prece divínum lumen implorasset, interna claríssima locutione intelléxit, sectánda sibi fore árdua sancti Alexii vestígia, durissimamque vitam in sacris peregrinationibus traducendam. Probante ígitur conscientiæ suæ moderatóre, annos natus vigínti duos, pia suscépit longissima itínera; pedes, veste obsoleta, et rudi pileolo tectus, fune præcinctus ac male calceatus, sine pecúnia, rerúmque ómnium inops, oblata tantum stipe victitans, et saccum déferens onustum saxis, quo peregrinandi labóres sibi graviores rédderet. Hac ratióne multas Európæ regiónes plúries peragrávit, ubíque sanctiora loca visitando, numquam vestes immutans, æstum, brumam, imbres pérferens, noctu cubans plerúmque sub dio, declinansque a trita via et diversoriis ut vitaret perícula, et ánimum libérius in Deum intenderet.

          Ubicumque consísteret mira virtútum relinquebat exémpla, cum sanctitátis fama haud raris prodigiis confirmáta. Séptimo ante óbitum anno Romam repetiit, ibíque cónstitit, etsi quotánnis Lauretanam Beátæ Vírginis ædem, et ália viciniora sanctuaria adire non prætermiserit. Cœlitem pótius quam viatoris vitam in Urbe ágere visus est. Tecto ut plúrimum carens, lacero eódem indumento perpétuo usus, oleribus herbisque per viam abjéctis vel oblátis analectis sive e sterquilinio promptis inediam relevabat, sitim aut exstinguebat aqua, aut acéto vexabat. Sæpe tota nocte orabat in amphitheátro Flavio, tot Mártyrum sánguine consecrato. Máximam vero diéi partem in templis dúcere consuevit vel ante Deíparæ imáginem vel coram sacrosancta Eucharístia publicæ adorationi propósita, ibíque immobilis, ardens, nitenti vultu, oculisque in sacram hóstiam defixis morabatur in contemplatióne ejus, quem diligébat. Insectis erosus, squalore obsitus, quidquid irrisionum aut injuriarum a plebecula sibi irrogabatur, lætus et constans perferebat Anno dénique millésimo septingentésimo octogésimo tértio, die decimasexta Aprílis, cum in templo sanctæ Maríæ ad Montes precationi plures dedísset horas, corréptus deliquio, traductusque vicinas in ædes benefici hóminis, sanctíssime ánimam Deo réddidit, trigésimo quinto ætátis anno. Quem virtútibus et miráculis clarum Pius nonus Póntifex Máximus beatórum, novisque fulgéntem signis Leo décimus tértius sanctórum albo adscrípsit.
      en: |
          Benedict Joseph Labre was born in the town of Amettes, in the diocese of Boulogne in France, of honourable and most pious parents. Prevented by divine grace, from his boyhood he showed a grave disposition, averse to trifles, and shone as a perfect example to his brothers in piety, obedience and diligence in learning the elements of Christian doctrine and letters. At twelve years of age he was sent to his paternal uncle, a priest and the pastor of a parish, and advanced in learning as well as in virtue. Burning with charity toward his neighbours, he let none of the poor who flocked to him go away empty, and attached himself as an inseparable companion to the same uncle for the comfort of the sick, when a dire plague was raging through the region, of which that uncle fell a victim. Sparing himself no labour, nor frightened by danger, he took on the lowliest offices to relieve the misery of those who lay stricken by disease, and even took the shepherds' place in feeding the flocks they had left, gathering grass in the fields for the nourishment of the cattle; and for this he deserved the name of angel. Nor did he act otherwise afterwards with his maternal uncle, where he gave a most splendid example of charity and meekness, enduring for a long time, with wonderful patience and kindness, the singular moroseness of a certain fellow-lodger, by whom he was ill treated night and day.

          Feeling himself long called to a most austere manner of life, he had accustomed himself to pass his days in rigid fasting or with only hard bread, to give his weary limbs brief rest on bare boards with a pillow of wooden fragments, to scourge himself, and to spend many hours on bended knees in prayer before the most august Sacrament of the Eucharist. Thinking therefore that he was called by God to some rather austere monastic institute, he betook himself first to the Trappists, then to the Carthusians, and lastly to the Cistercians. But on account of his slender frame and the infirmities he contracted he was forced to leave each of them; God so disposing that the blessed youth should become, in the midst of the people, a spectacle to the world, and to Angels, and to men, of a stricter following of the cross of Christ. For when he had implored the divine light with more fervent prayer, he understood by a most clear interior locution that he was to follow the arduous footsteps of St. Alexis, and to lead a most hard life in sacred pilgrimages. With the approval of the director of his conscience, therefore, at the age of twenty-two he undertook very long pious journeys: on foot, in a worn-out garment, covered with a rough little cap, girt with a rope and ill shod, without money, destitute of all things, living only on the alms offered, and carrying a sack laden with stones, whereby he made the labours of travelling the heavier for himself. In this manner he repeatedly travelled through many regions of Europe, visiting everywhere the holier places, never changing his garments, bearing heat, cold and rain, lying at night for the most part in the open air, and turning aside from the beaten road and from inns, to avoid dangers and to direct his mind more freely to God.

          Wherever he stopped he left wonderful examples of virtues, the fame of his holiness being confirmed by not infrequent prodigies. In the seventh year before his death he returned to Rome and settled there, though every year he did not omit to visit the Loreto shrine of the Blessed Virgin and other nearer sanctuaries. He seemed to lead rather the life of a dweller in heaven than of a wayfarer in the City. Mostly without a roof, always wearing the same ragged garment, he relieved his hunger with vegetables and herbs cast aside on the way, with scraps offered or taken from the dunghill, and quenched his thirst with water, or afflicted it with vinegar. He often prayed the whole night in the Flavian amphitheatre, consecrated by the blood of so many Martyrs. The greatest part of the day he was accustomed to spend in churches, either before an image of the Mother of God or before the most holy Eucharist exposed for public adoration, and there he remained motionless, burning, with shining countenance and eyes fixed on the sacred Host, in contemplation of him whom he loved. Eaten by insects, covered with filth, whatever mockery or injury was inflicted on him by the rabble he bore cheerfully and steadfastly. Finally, in the year one thousand seven hundred and eighty-three, on the sixteenth day of April, when he had given several hours to prayer in the church of Santa Maria ai Monti, he was seized with a faintness, and carried into the neighbouring house of a kindly man, and most holily rendered his soul to God, in the thirty-fifth year of his age. Illustrious for virtues and miracles, and shining with new signs, Pope Pius the Ninth enrolled him among the Blessed, and Leo the Thirteenth in the roll of the Saints.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: true
    citation:
      la: "Matt 16:24-27"
      en: "Matt 16:24-27"
    text:
      la: "In illo témpore: Dixit Jesus discípulis suis: Si quis vult post me veníre, ábneget semetípsum, et tollat crucem suam, et sequátur me. Qui enim voluerit ánimam suam salvam fácere, perdet eam: qui autem perdíderit ánimam suam propter me, invéniet eam. Quid enim prodest hómini, si mundum univérsum lucrétur, ánimæ vero suæ detriméntum patiátur? Aut quam dabit homo commutatiónem pro ánima sua? Fílius enim hóminis ventúrus est in glória Patris sui cum Angelis suis: et tunc reddet unicuíque secúndum ópera ejus."
      en: "At that time, Jesus said to His disciples, If anyone wishes to come after Me, let him deny himself, and take up his cross, and follow Me. For he who would save his life will lose it; but he who loses his life for My sake will find it. For what does it profit a man, if he gain the whole world, but suffer the loss of his own soul? For the Son of Man is to come with His angels in the glory of His Father, and then He will render to everyone according to His conduct."
    status: { la: verified, en: verified }
  - nocturn: 3
    isGospel: false
    source: "St. Gregory the Great, Pope, Homily 32 on the Gospels"
    text:
      la: |
          Quia Dóminus ac Redémptor noster novus homo venit in mundum, nova præcépta dedit mundo. Vitæ étenim nostræ véteri in vítiis enutrítæ contrarietátem oppósuit novitátis suæ. Quid enim vetus, quid carnális homo nóverat, nisi sua retinére, aliéna rápere, si posset; concupíscere, si non posset? Sed cæléstis médicus síngulis quibúsque vítiis obviántia ádhibet medicaménta. Nam sicut arte medicínæ cálida frígidis, frígida cálidis curántur: ita Dóminus noster contrária oppósuit medicaménta peccátis, ut lúbricis continéntiam, tenácibus largitátem, iracúndis mansuetúdinem, elátis præcíperet humilitátem.

          Certe cum se sequéntibus nova mandáta propóneret, dixit: Nisi quis renuntiáverit ómnibus quæ póssidet, non potest meus esse discípulus. Ac si apérte dicat: Qui per vitam véterem aliéna concupíscitis, per novæ conversatiónis stúdium et vestra largímini. Quid vero in hac lectióne dicat, audiámus: Qui vult post me veníre, ábneget semetípsum. Ibi dícitur, ut abnegémus nostra: hic dícitur, ut abnegémus nos. Et fortásse laboriósum non est hómini relínquere sua; sed valde laboriósum est relínquere semetípsum. Minus quippe est abnegáre quod habet; valde autem multum est abnegáre quod est.

          Ad se autem nobis veniéntibus Dóminus præcépit, ut renuntiémus nostris: quia quicúmque ad fídei agónem vénimus, luctámen contra malígnos spíritus súmimus. Nihil autem malígni spíritus in hoc mundo próprium póssident: nudi ergo cum nudis luctári debémus. Nam si vestítus quisque cum nudo luctátur, cítius ad terram dejícitur, quia habet unde teneátur. Quid enim sunt terréna ómnia, nisi quædam córporis induménta? Qui ergo contra diábolum ad certámen próperat, vestiménta abjíciat, ne succúmbat.
      en: |
          Our Lord and Redeemer came into the world a new Man, and gave the world new commandments. For against the ways of our old life, brought and bred up in sin, He set the contrast of His new life. It was the old way, according to the knowledge of the carnal man, for every man to keep his own goods, and, if he were able to do it, to take his neighbour's goods also, and, if he were not able to take them, at least to lust after them. But the Heavenly Physician hath medicines wherewith to meet all the diseases of sin. For, even, as by the art of the physician, things hot are healed by things cold, and things cold by things hot, so doth our Lord set against sin holiness, ordaining for the lecherous purity, for the miserly munificence, for the hot-tempered meekness, and for the proud lowliness.

          So the Lord, when He would give a new commandment unto them that came to Him, said Whosoever he be of you that forsaketh not all that he hath, he cannot be My disciple, (Luke xiv. 33,) as though He had said openly: All ye that according to the old man lust after your neighbour's goods, must, according to the zeal of the new man, give away even that which is your own. But let us hear again what He saith in this place If any man will come after Me, let him deny himself. First He saith that we must deny to ourselves that which is our own, and now that we must even deny ourselves to ourselves. Perchance it is not hard for a man to give up that which is his own, but it is exceeding hard to give up himself. To deny himself his possessions is little but to deny himself himself is a denial exceeding great.

          Let when we come unto Him the Lord will have us deny to ourselves even ourselves, since as many of us as are entered into the battle of faith, are entered into a contention against evil spirits. But the evil spirits have nothing of their own in this world, and therefore must we wrestle with them, naked with naked. For if he that is clothed, wrestle with him that is naked, he faileth swiftly, because he hath whereon he that is naked taketh hold. And what are all things earthly but things wherewith the soul is clothed upon? whosoever therefore will wrestle with Satan, let him cast away his clothes, lest he be thereby endangered.
    status: { la: verified, en: verified }
