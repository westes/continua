# Matins Nocturn 2-3 readings for St. Peter Canisius, Confessor,
# Doctor of the Church (Apr 27). Sourced directly from
# web/www/horas/Latin/Sancti/04-27.txt, English/Sancti/04-27.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Matt 5:13-19) is a bare incipit
# ("Et réliqua"), so only the homily is authored (not marked isGospel),
# St. Peter Canisius's own homily (Lectio7's homily + Lectio8-9
# combined).
id: st-peter-canisius
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Petrus Canisius, Noviomagi in Gelria eo ipso anno natus est, quo Lutherus in
        Germania aperta rebellione ab Ecclesia descivit, et Ignatius de Loyola, in
        Hispania, terrestri militia abdicata, ad prælianda prælia Domini se convertit;
        Deo nimirum portendente, quos ille posthac adversarios, quem sacræ militiæ
        ducem esset habiturus. Coloniæ Agrippinæ, quo studiorum causa concesserat,
        perpetuo castitatis voto se Deo obstrinxit, et paulo post Societati Jesu nomen
        dedit. Sacerdotio auctus, catholicam fidem contra novatorum insidias
        legationibus, sermonibus, scriptis libris statim defendendam suscepit. Ob
        præclaram sapientiam et exploratum rerum usum a Cardinali Augustano et a
        pontificiis Legatis magnopere expetitus, semel atque iterum concilio Tridentino
        interfuit; cujus étiam decreta ex auctoritate Pii quarti Pontificis maximi rite
        per Germaniam promulganda et in morem inducenda curavit. A Paulo quarto ad
        conventum Petricoviensem ire jussus, aliisque a Gregorio decimo tertio
        legationibus obeundis adhibitus, alacri semper et numquam fracto difficultatibus
        animo, gravissima, religionis negotia tractávit, ac vel inter præsentia vitæ
        discrimina ad felicem exitum perduxit.


        Superno caritátis igne, quem in Basilica Vaticana e penetralibus Cordis Jesu
        olim copiose hauserat, inflammatus, et divinæ gloriæ amplificandæ unice
        intentus, dici vix potest, quot per annos amplius quadraginta labores
        susceperit. ærumnasque pertulerit, ut complures Germaniæ civitates ac
        provincias vel ab hæreseos contagione defenderet, vel hæresi infectas
        catholicæ fidei restitueret. In Ratisbonensi et Augustano conventu imperii
        proceres ad jura Ecclesiæ tuenda et mores populorum emendandos excitavit: in
        Vormatiensi insolescentes impietatis magistros ad silentium adegit. A sancto
        Ignatio Germaniæ superioris provinciæ præfectus, domos et collegia multis
        locis condidit. Collegium Germanicum, Romæ constitutum omni ope provehere
        atque amplificare studuit; in academiis sacrarum humanarumque disciplinarum
        studia, miserandum in modum collapsa instauravit; contra Centuriatores
        Magdeburgenses duo volumina egregie conscripsit: et summam doctrinæ
        christianæ theologorum judicio et publico trium sæculorum usu ubique
        probatissimam, alíaque complura ad populorum institutionem valde accommodata
        in vulgus edidit. Quam ob rem hæreticorum malleus et alter Germaniæ apostolus
        appellatus, plane dignus habitus est, qui ad tutandam in Germania religionem
        divinitus electus putaretur.


        Inter hæc, precatione crebra et assidua rerum supernarum commentatione,
        lacrimis sæpe perfusus et ánimo interdum a sensibus abducto, Deo se conjungere
        solitus erat. A viris principibus vel sanctitate clarissimis et a quatuor
        summis Pontificibus magno in honore habitus, adeo de se demisse sentiebat ut se
        omnium minimum et diceret et haberet. Vindobonensem episcopatum semel iterum ac
        tertio recusavit. Moderatoribus suis obsequentissimus paratus erat ad ipsorum
        nutum omnia relinquere aut aggredi étiam cum valetudinis et vitæ periculo.
        Voluntaria sui ipsius coërcitione castitatem perpetuo sepsit. Demum Friburgi
        Helvetiorum, ubi plurimum pro Dei gloria et salute animarum ultimis vitæ suæ
        annis desudaverat, migravit ad Deum die vigesima prima Decembris anno millesimo
        quingentesimo nonagesimo septimo, ætatis suæ septimo supra septuagesimum. Hunc
        vero strenuum catholicæ veritatis propugnatorem Pius Papa nonus cælitum
        Beatorum honoribus adauxit; novis autem fulgentem signis Pius undecimus
        Pontifex maximus, anno jubilæi Sanctorum numero accensuit, simulque Doctorem
        universalis Ecclesiæ declaravit.
      en: >-
        Peter Canisius was born at Nijmegen in Gelderland, the Netherlands, in the very
        year in which Luther openly rebelled against the Church in Germany, and in
        which Ignatius Loyola in Spain gave up earthly warfare to fight the battles of
        the Lord; God thus shewed what adversaries he was to encounter, and under whose
        leadership he was to fight. He made his studies at Cologne, where he took a vow
        to God of perpetual chastity, and shortly afterwards entered the Society of
        Jesus. After his ordination as priest, he began at once to defend the Catholic
        faith against the wiles of the innovators by missions, sermons, and writing
        books. His eminent wisdom and experience caused the Cardinal of Augsburg and
        the papal legates to invite him to the Council of Trent, and he was present at
        its sittings more than once. Moreover, by the authority of the Supreme
        Pontiff, Pius IV, he was entrusted with the charge of making its decrees known
        in Germany and carrying them into effect. Paul IV sent him to the Diet of
        Petrikau, and Gregory XIII entrusted him with the carrying out of other
        missions, all of which he undertook with an eager spirit, never conquered by
        any difficulties, and carried the most important affairs of religion through
        all the crises of this present life to a successful end.


        Inflamed with the heavenly fire of charity, which he had once received in the
        Vatican basilica from the sanctuary of the Heart of Jesus, and intent only on
        increasing the glory of God, it is almost impossible to describe how, for more
        than forty years, he took upon himself laborious tasks, and endured hardship,
        that he might defend very many cities and provinces of Germany from the
        contagion of heresy, or restore to the Catholic faith those that were infected
        with heresy. At the Diets of Ratisbon and Augsburg, he exhorted the princes of
        the Empire to defend the rights of the Church and reform the lives of their
        subjects. At Worms he reduced the insolent teachers of impiety to silence. St.
        Ignatius made him prefect of the province of Upper Germany, where he founded
        houses and colleges in many places. He used every effort to advance and
        enlarge the German College founded at Rome; he restored the study of sacred
        and profane learning in academies, which had fallen into a wretched condition.
        He wrote two excellent volumes against the Centuriators of Magdeburg; and he
        edited a summary of Christian doctrine, which has been thoroughly approved by
        the judgment of theologians and by common use everywhere for three centuries,
        as well as very many other works useful for public instruction in the vulgar
        tongue. For all these reasons he was called the Hammer of the Heretics, and the
        Second Apostle of Germany, and is rightly thought to have been worthy of having
        been chosen by God to protect religion in Germany.


        In these activities he was accustomed to unite himself to God by frequent
        prayer and assiduous meditation on heavenly things, often bathed in tears and
        sometimes with his soul rapt in ecstasy. He was held in great honor by men of
        rank, or of most distinguished holiness, and by four of the Supreme Pontiffs,
        but he thought so humbly of himself, that he spoke of and held himself as the
        least of all. He refused the bishopric of Vienna no less than three times. He
        was most obedient to his superiors, and ready at their mere nod to stop or to
        undertake all labors, even at the risk of his health and life. He guarded his
        chastity with perpetual voluntary self-mortification. At length, at Fribourg in
        Switzerland, where during the last years of his life he had labored much for
        the glory of God and the salvation of souls, he passed to God on the 21st day
        of December, 1597, in the seventy-seventh year of his age. This zealous
        champion of Catholic truth was adorned with the heavenly honors of the blessed
        by Pope Pius IX; and, as fresh miracles added to his renown, the Supreme
        Pontiff Pius XI, in the year of the Jubilee, included him among the Saints, and
        at the same time declared him a Doctor of the Universal Church.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Peter Canisius, Notes on the Gospels, on the feast of St. Martin (on Matt 5:13-19)"
    text:
      la: >-
        Amabo et colam missos a Christo Apostolos horumque successores in Evangelii
        semine spargendo sedulos et indefessos propagandi verbi cooperatores, qui jure
        testari possunt: Sic nos existimet homo ut ministros Christi et dispensatores
        mysteriorum Dei. Voluit enim Christus ut vigilantissimus ac fidelissimus
        paterfamilias per tales ministros ac legatos lucernam evangelicam igne cælitus
        demisso accendi et accensam non modio supponi, sed super candelabrum
        constitui, quæ suum splendorem longe lateque diffunderet omnesque tum
        Judæorum tum gentium vigentes tenebras et errores profligaret.


        Etenim evangelico Doctori sat non est, verbo lucere populo, et vocem in
        deserto clamantem præstare multisque in pietate juvandis lingua operam dare,
        ne alioquin, si verbi ministerium prætermittat, canis mutus non valens
        latrare a propheta dicatur. Sed et ardere illum oportet, ut opere atque
        caritate instructus, munus suum ornet evangelicum, Paulumque ducem sequatur.
        Is quippe non contentus Ephesiorum episcopo demandare: Præcipe hoc et doce:
        labora sicut bonus miles Christi Jesu: constanter étiam apud amicos et
        inimicos evangelizávit, ac episcopis apud Ephesum collectis bona dixit
        conscientia: Vos scitis, quomodo nihil subtraxerim utilium, quominus
        annuntiarem vobis, et docerem vos publice et per domos, testificans Judæis
        atque Gentilibus in Deum pœnitentiam et fidem in Dominum nostrum Jesum
        Christum.


        Talem enim pastorem decet esse in Ecclesia, qui more Pauli, omnibus omnia
        fiat, ut in illo reperiat æger curationem, mæstus lætitiam, desperans
        fiduciam, imperitus doctrinam, dubius consilium, pœnitens veniam atque
        solatium, et quidquid tandem ad salutem est cuique necessarium. Quocirca
        pulchre Christus, cum primarios mundi Ecclesiæque, doctores constituere
        vellet, non sat habuit discipulis dicere: Vos estis lux mundi: sed étiam
        illud subjecit: Non potest civitas abscondi supra montem posita, neque
        accendunt lucernam et ponunt eam sub modio, sed super candelabrum, ut luceat
        omnibus qui in domo sunt. Errant enim opinantes ecclesiastæ, quod muneri suo
        doctrinæ splendore magis quam vitæ integritate et caritatis ardore possint
        satisfacere.
      en: >-
        I shall always love and reverence the Apostles sent by Christ, and their
        successors as well, in their work of sowing the Gospel seed. For all such may
        justly say of themselves: Let a man so account of us, as of the ministers of
        Christ, and stewards of the mysteries of God. It was Christ himself, like a
        watchful and most faithful householder, who wished that the Gospel-lamp should
        be lighted by his ministers and stewards with fire sent down from heaven; and
        once lighted, that it should not be put under a bushel, but set upon a
        candlestick, so as to spread its brightness far and wide, and put to flight all
        darkness and error rife among both Jews and Gentiles.


        It is not enough for the Gospel-teacher to please the people with his
        speaking. He must also be the voice of one crying in the wilderness, and so by
        his eloquence call many to the good life. He must not be a dumb dog, not even
        able to bark, as spoken of by the Prophet Isaiah. Yea, he should also burn in
        such a way that, equipped with good works and love, he may adorn his
        evangelical office, and follow the leadership of Paul. He indeed was not
        satisfied with bidding the bishop of the Ephesians: This command and teach:
        conduct thyself in work as a good soldier of Christ Jesus; but he unflaggingly
        preached the Gospel to friend and foe alike, and said with a good conscience to
        the bishops gathered at Ephesus: Ye know how I kept back nothing that was
        profitable unto you, but have shewed you, and have taught you publicly, and
        from house to house, urging Jews and Gentiles to turn unto God in repentance
        and to believe in our Lord Jesus Christ.


        Such should be the shepherd in the Church who, like Paul, becometh all things
        to all men, so that the sick may find healing in him; the sad, joy; the
        desperate, hope; the ignorant, instruction; those in doubt, advice; the
        penitent, forgiveness and comfort, and finally, every one whatever is
        necessary unto salvation. And so Christ, when he wished to appoint the chief
        teachers of the world and of the Church, did not limit himself to saying to his
        disciples: Ye are the light of the world: but also added: A city that is set on
        an hill cannot be hid; neither do men light a candle, and put it under a
        bushel, but on a candlestick, and it giveth light unto all that are in the
        house. Those churchmen err who imagine that it is by brilliant preaching that
        they fulfill their office; rather, it is by holiness of life and an
        all-embracing love.
    status: { la: verified, en: verified }
