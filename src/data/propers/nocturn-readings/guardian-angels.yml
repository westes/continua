# Matins Nocturn 2-3 readings for the Guardian Angels (Oct 2). Sourced
# directly from web/www/horas/Latin/Sancti/10-02.txt,
# English/Sancti/10-02.txt. Nocturn 2: Lectio4-6, St. Bernard of
# Clairvaux's own homily on Psalm 90 ("Qui habitat"), combined into one
# reading -- not Gospel-tied (Bernard's own Nocturn 2 patristic reading,
# separate from Nocturn 3's Gospel below). Nocturn 3: Lectio7-9, St.
# Hilary of Poitiers' Commentary on Matthew ch. 18.
#
# Update (2026-09-05): the Gospel pericope itself (Matt 18:1-10) is now
# authored too (isGospel: true, immediately before the Hilary homily) --
# sourced from missa/Latin/Sancti/05-08.txt (St. Michael's Apparition,
# May 8, whose own Mass Gospel is this identical pericope, per a
# `grep -rl "Matt 18:1-10" missa/Latin/` search of the reference tree)
# and its English parallel, not guessed at.
id: guardian-angels
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Bernard of Clairvaux, On Psalm 90 (Qui habitat)"
    text:
      la: >-
        Angelis suis mandávit de te. Mira dignátio, et vere magna diléctio
        caritátis. Quis enim? quibus? de quo? quid mandávit? Studióse
        considerémus, fratres, diligénter commendémus memóriæ hoc tam
        grande mandátum. Quis enim mandávit? cujus sunt Angeli? cujus
        mandátis obtémperant? cujus obédiunt voluntáti? Nempe Angelis
        suis mandávit de te, ut custódiant te in ómnibus viis tuis. Nec
        cunctántur quin étiam in mánibus tollant te. Summa ergo Majéstas
        mandávit Angelis, et Angelis suis mandávit. Illis útique
        sublímibus, tam beátis quam próximis sibi cohæréntibus et vere
        domésticis mandávit de te. Tu quis es? Quid est homo, quod memor
        es ejus? aut fílius hóminis, quóniam réputas eum? Quasi vero non
        sit homo putrédo, et fílius hóminis vermis! Sed quid putas
        mandávit de te? Ut custódiant te.


        Quantam tibi debet hoc verbum inférre reveréntiam, afférre
        devotiónem, conférre fidúciam! Reveréntiam pro præséntia,
        devotiónem pro benevoléntia, fidúciam pro custódia. Caute
        ámbula, ut vidélicet cui adsunt Angeli, sicut eis mandátum est,
        in ómnibus viis tuis. In quovis diversório, in quovis ángulo,
        Angelo tuo reveréntiam habe. Tu ne áudeas illo præsénte, quod
        vidénte me non audéres. An præséntem esse dúbitas, quem non
        vides? Quid si audíres? quid si tángeres? quid si olfáceres?
        Vide, quia non solo visu, rerum præséntia comprobétur.


        In ipso ítaque, fratres, affectuóse diligámus Angelos ejus,
        tamquam futúros aliquándo coherédes nostros, ínterim vero
        actóres et tutóres, a Patre pósitos et præpósitos nobis. Quid
        sub tantis custódibus timeámus? Nec superári nec sedúci, minus
        autem sedúcere possunt, qui custódiunt nos in ómnibus viis
        nostris. Fidéles sunt, prudéntes sunt, poténtes sunt: quid
        trepidámus? Tantum sequámur eos, adhæreámus eis, et in
        protectióne Dei cæli commorémur. Quóties ergo gravíssima
        cérnitur urgére tentátio et tribulátio véhemens imminére, ínvoca
        custódem tuum, ductórem tuum, adjutórem tuum in opportunitátibus,
        in tribulatióne; incláma eum et dic: Dómine, salva nos,
        perímus.
      en: >-
        He hath given His Angels charge over thee. A wonderful
        graciousness, and a wonderful outpouring of love. For who hath
        given charge? And what charge? Unto whom? And over whom? Let us
        carefully consider, my brethren, let us carefully hold in mind
        this great charge. For who hath given this charge? To Whom
        belong the Angels? Whose commandments do they obey, and Whose
        will do they do? He hath given His Angels charge over thee, to
        keep thee in all thy ways, and that not carelessly, for they
        shall bear thee up in their hands. The Highest Majesty,
        therefore, hath given charge unto Angels, even His Angels. Unto
        these beings so excellently exalted, so blessed, so near to
        Himself, even as His own household, unto these hath He given
        charge over thee. Who art thou? What is man, that Thou art
        mindful of him? or the son of man, that Thou visitest him? Even
        as though man were not rottenness, and the son of man, a worm.
        But what charge hath He given them over thee? To keep thee in
        all thy ways.


        What respect, what thankfulness, what trust, ought this word to
        work in thee! Respect for their presence, thankfulness for their
        kindness, trust in their safe keeping. Walk carefully, as one
        with whom are Angels, as hath been laid in charge upon them, in
        all thy ways. In every lodging, in every nook, have reverence
        for thine Angel. Dare not to do in his presence what thou
        wouldst not dare to do in mine. Or dost thou doubt whether he be
        indeed present, because thou seest him not? What if thou
        heardest him? What if thou touchedst him? What if thou
        smelledst him? Behold, not by sight alone is the presence of
        things made manifest.


        Let us also, brethren, dearly love His Angels, as them with whom
        we are one day to be co-heirs, and who in the meanwhile are
        leaders and guardians set over us by the Father. With such
        guardians, whereof shall we be afraid? They that keep us in all
        our ways, can neither be conquered nor corrupted, far less can
        they corrupt. They are trusty, they are wary, they are mighty.
        Whereof shall we be afraid? Only let us follow them, only let us
        cleave unto them, and we shall abide under the shadow of the God
        of heaven. As often then as the gloom of temptation threateneth
        thee, or the sharpness of tribulation hangeth over thee, call
        upon Him That keepeth thee, thy Shepherd, thy Refuge in times of
        trouble, call upon Him, and say: "Lord, save us, we perish."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 18:1-10", en: "Matthew 18:1-10" }
    text:
      la: >-
        In illo témpore: Accessérunt discípuli ad Jesum, dicéntes: Quis, putas, major est in regno
        cælórum? Et advocáns Jesus párvulum, státuit eum in médio eórum et dixit: Amen, dico vobis,
        nisi convérsi fuéritis et efficiámini sicut párvuli, non intrábitis in regnum cælórum.
        Quicúmque ergo humiliáverit se sicut párvulus iste, hic est major in regno cælórum. Et qui
        suscéperit unum párvulum talem in nómine meo, me súscipit. Qui autem scandalizáverit unum
        de pusíllis istis, qui in me credunt, expédit ei, ut suspendátur mola asinária in collo
        ejus, et demergátur in profúndum maris. Væ mundo a scándalis! Necésse est enim, ut véniant
        scándala: verúmtamen væ hómini illi, per quem scándalum venit! Si autem manus tua vel pes
        tuus scandalízat te, abscíde eum et projíce abs te: bonum tibi est ad vitam ingrédi
        débilem vel claudum, quam duas manus vel duos pedes habéntem mitti in ignem ætérnum. Et si
        óculus tuus scandalízat te, érue eum et projíce abs te: bonum tibi est cum uno óculo in
        vitam intráre, quam duos óculos habéntem mitti in gehénnam ignis. Vidéte, ne contemnátis
        unum ex his pusíllis: dico enim vobis, quia Angeli eórum in cælis semper vident fáciem
        Patris mei, qui in cælis est.
      en: >-
        At that time, the disciples came to Jesus, saying, "Who thinkest thou is the greater in
        the kingdom of heaven?" And Jesus, calling unto him a little child, set him in the midst
        of them, and said, "Amen I say to you, unless you be converted, and become as little
        children, you shall not enter into the kingdom of heaven. Whosoever therefore shall
        humble himself as this little child, he is the greater in the kingdom of heaven. And he
        that shall receive one such little child in my name, receiveth me. But he that shall
        scandalize one of these little ones that believe in me, it were better for him that a
        millstone should be hanged about his neck, and that he should be drowned in the depth of
        the sea. Woe to the world because of scandals. For it must needs be that scandals come,
        but nevertheless woe to that man by whom the scandal cometh. And if thy hand, or thy foot
        scandalize thee, cut it off, and cast it from thee. It is better for thee to go into life
        maimed or lame, than having two hands or two feet, to be cast into everlasting fire. And
        if thy eye scandalize thee, pluck it out, and cast it from thee. It is better for thee
        having one eye to enter into life, than having two eyes to be cast into hell fire. See
        that you despise not one of these little ones, for I say to you that their angels in
        heaven always see the face of my Father who is in heaven."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Hilary of Poitiers, Commentary on Matthew, ch. 18"
    text:
      la: >-
        Nónnisi revérsos in natúram puerórum introíre regnum cælórum
        Dóminus docet: id est, per simplicitátem puerílem vítia
        córporum nostrórum animǽque revocánda. Púeros autem, credéntes
        omnes per audiéntiæ fidem nuncupávit. Hi enim patrem sequúntur,
        matrem amant, próximo velle malum nesciunt, curam opum
        négligunt; non insoléscunt, non odérunt, non mentiúntur, dictis
        credunt, et quod áudiunt, verum habent. Reverténdum ígitur est
        ad simplicitátem infántium; quia, in ea collocáti, spéciem
        humilitátis Domínicæ circumferémus.


        Væ huic mundo ab scándalis. Humílitas passiónis scándalum mundo
        est. In hoc enim máxime ignorántia detinétur humána, quod sub
        deformitáte crucis, ætérnæ glóriæ Dóminum nóluit accípere. Et
        quid mundo tam periculósum, quam non recepísse Christum? Ideo
        vere necésse esse ait veníre scándala; quia, ad sacraméntum
        reddéndæ nobis æternitátis, omnis in eo passiónis humílitas
        esset explénda.


        Vidéte ne contemnátis unum de pusíllis istis, qui credunt in
        me. Aptíssimus vínculum mútui amóris impósuit, ad eos præcípue
        qui vere in Dómino credidíssent. Pusillórum enim Angeli
        quotídie Deum vident: quia Fílius hóminis venit salváre quæ
        pérdita sunt. Ergo et Fílius hóminis salvat, et Deum Angeli
        vident, et Angeli pusillórum præsunt fidélium oratiónibus.
        Præésse Angelos absolúta auctóritas est. Salvatórum ígitur per
        Christum oratiónes Angeli quotídie Deo ófferunt. Ergo
        periculóse ille contémnitur, cujus desidéria ac postulatiónes
        ad ætérnum et invisíbilem Deum, ambitióso Angelórum famulátu ac
        ministério, pervehúntur.
      en: >-
        Unless ye become as little children, saith the Lord, ye shall
        not enter into the kingdom of heaven, that is, unless by the
        uprooting of bodily and mental depravity, we bring our souls to
        the innocency of childhood. But He giveth the name of children
        to all such as believe by the hearing of faith. Children follow
        their father, love their mother, know not how to wish evil to
        their neighbours, are not careful for earthly riches; they
        insult not, they hate not, they lie not, they believe what they
        are told, and take for truth what they hear. Us then it
        behoveth to return to the simpleness of little children, for
        when we are well rooted therein, we shall so far bear about in
        ourselves an image of the sublime simpleness of the Lord Jesus.


        Woe unto the world because of offences! The lowliness of the
        Passion is an offence unto the world. Such is the state of
        stupidity to which man's ignorance hath reduced itself, that it
        turneth away from the Lord of Eternal Glory, because of the
        unsightliness of the Cross! And what is so certain to bring woe
        unto the world as to turn away from Christ? And therefore He
        saith it must needs be that offences come, because his
        fulfilling the lowliness of the Passion was the predestined
        mean whereby He was to give us eternal life.


        Take heed that ye despise not one of these little ones that
        believe in Me. He hath laid on us a most meet tie to constrain
        us to love one another, especially such as indeed believe in
        the Lord. For I say unto you that in heaven their Angels do
        always behold the face of My Father Which is in heaven. For the
        Son of Man is come to save that which was lost. From these
        words we see, first, that the Son of Man saveth; secondly, that
        the Angels do see God; and thirdly, that the Angels of these
        little ones have the wardship over the prayers of the faithful.
        That the Angels have this wardship is taught us absolutely. The
        Angels therefore do every day offer to God the prayers, which
        they which are saved, do make to Him in the Name of Christ.
        Therefore it is dangerous for a man to despise them, seeing
        that these are they by whose watchful service and ministry his
        wishes and requests are presented before the throne of the
        eternal and unseen God.
    status: { la: verified, en: verified }
