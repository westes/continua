# Matins Nocturn 2 reading for St. Sergius I, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/09-09-SergiusI.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-sergius-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Sérgius, Antiochénus génere, Tiberio patre, Panormi in Sicília natus, Conone vita functo,
        anno Christi sexcentésimo octogésimo séptimo, anuente Deo, et suffragántibus ómnium votis,
        in sacro Lateranénsi palatio assúmptus, fœdissimum schisma, quod exarchi imperatóris
        avarítia et Paschális archidiaconi ambitio excitarant, in ipso ortu exstínxit. Adeodato
        Pontífice Romam véniens, in Ecclésiæ Románæ clerum ab eódem ascitus, et a Leóne hujus
        nóminis secúndo présbyter tituli sanctæ Susánnæ ordinátus, impigre suo múnere defúnctus est.


        Cánones a Græcis sextæ synodo dein affictos, instánte licet et dira minante imperatóre,
        admittere nóluit, sed ut spurios, non sine vitæ perículo, constánter abjecit. Magnam
        Domínicæ crucis portiónem, revelante Deo a se inventam, in basílica Constantiniána populo
        adorandam collocavit. Corpus sancti Leónis in obscúro cónditum angulo, Dei nutu, inde
        amóvit, et ornatiori loco ómnibus colendum exposuit. Basílicam demum Vaticanam innumeris
        donis ornávit, egregiis certe amóris sui erga Príncipem Apostolórum monumentis.


        Chilianum et sócios martyrio deínde affectos in Germániam, Willibrordum et Switbertum cum
        sóciis in Frisiam aliásque circumjectas regiónes misit, in quibus máximum paganórum númerum
        ad Christi fidem converterunt. Coadvallum Britonum regem Romam venientem excépit, et sacro
        baptísmate tinxit. Ravennátibus Damianum, Leodiensibus Ubertum, Britannis Berectualdum
        epíscopos ordinávit. Státuit ut Liturgiæ sacræ pius versus: Agnus Dei, qui tollis peccáta
        mundi, miserére nobis, adderetur. Méritis dénique plenus, postquam sedisset trédecim annis,
        ménsibus octo, sancto fine quiévit, ac sepúltus est in Vaticáno.
      en: >-
        Sergius, an Antiochene by race, his father Tiberius, born at Palermo in Sicily, Conon having
        departed this life, in the year of Christ 687, God assenting and with the votes of all
        supporting, was taken up in the sacred Lateran palace, and stifled at its very birth the
        most foul schism which the avarice of the exarch of the emperor and the ambition of Paschal
        the archdeacon had stirred up. Coming to Rome in the time of the Pontiff Adeodatus, he was
        admitted by him into the clergy of the Roman Church, and by Leo the second of that name was
        ordained priest of the title of St. Susanna, and tirelessly discharged his office.


        The canons which were afterwards fastened upon the sixth synod by the Greeks, though the
        emperor insisted and threatened direly, he would not admit, but as spurious, not without
        peril of life, constantly rejected. A great portion of the Lord's cross, found by himself by
        the revelation of God, he placed in the Constantinian basilica to be adored by the people.
        The body of St. Leo, laid in an obscure corner, he removed thence by God's will, and set in
        a more honourable place for all to venerate. And he adorned the Vatican basilica with
        innumerable gifts, certainly outstanding monuments of his love for the Prince of the
        Apostles.


        Kilian and his companions, afterwards martyred, he sent into Germany; Willibrord and
        Switbert with their companions into Frisia and the surrounding regions, in which they
        converted a very great number of pagans to the faith of Christ. Caedwalla, king of the
        Britons, coming to Rome, he received and washed in sacred baptism. For the Ravennates he
        ordained Damian, for the people of Liège Hubert, for the Britons Berechtwald as bishops. He
        decreed that the pious verse, Agnus Dei, qui tollis peccata mundi, miserere nobis, be added
        to the sacred Liturgy. At last, full of merits, after he had sat thirteen years and eight
        months, he rested in a holy end, and was buried in the Vatican.
    status: { la: verified, en: draft }
