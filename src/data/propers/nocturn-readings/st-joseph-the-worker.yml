# Matins readings for St. Joseph the Worker (May 1). Sourced directly from
# web/www/horas/Latin/Sancti/05-01r.txt, English/Sancti/05-01r.txt.
# Nocturn 1: Lectio1-3 (Genesis) combined into one reading, with Responsory1.
# Nocturn 2: Lectio4-6 (from the Acts of Pope Pius XII) combined, with Responsory4.
# Nocturn 3: the Gospel pericope (Matt 13:54-58, full text from the scripture store)
# then the homily (Lectio7-9), with Responsory7.
id: st-joseph-the-worker
readings:
  - nocturn: 1
    isGospel: false
    source: "Genesis 1:27-28, 31; 2:1-3, 7-9, 15; 3:17-19, 23-24"
    text:
      la: >-
        In princípio creávit Deus hóminem ad imáginem suam; ad imáginem Dei creávit
        illum: másculum et féminam creávit eos. Benedixítque illis Deus, et ait: «
        Créscite et multiplicámini, et repléte terram, et subícite eam. » Vidítque Deus
        cuncta quæ fécerat, et erant valde bona. Et factum est véspere et mane, dies
        sextus. Igitur perfécti sunt cæli et terra, et omnis ornátus eórum. Complevítque
        Deus die séptimo opus suum quod fécerat: et requiévit die séptimo ab univérso
        ópere quod patrárat. Et benedíxit diéi séptimo, et sanctificávit illum, quia in
        ipso cessáverat ab omni ópere suo, quod creávit Deus ut fáceret.


        Formávit ígitur Dóminus Deus hóminem de limo terræ, et inspirávit in fáciem ejus
        spiráculum vitæ, et factus est homo in ánimam vivéntem. Plantáverat autem
        Dóminus Deus paradísum voluptátis a princípio, in quo pósuit hóminem quem
        formáverat. Produxítque Dóminus Deus de humo omne lignum pulchrum visu, et ad
        vescéndum suáve; lignum étiam vitæ in medio paradísi lignúmque sciéntiæ boni et
        mali. Tulit ergo Dóminus Deus hóminem, et pósuit eum in paradíso voluptátis ut
        operarétur et custodíret illum.


        Dixit Dóminus Deus Adæ: Quia audísti vocem uxóris tuæ, et comedísti de ligno, ex
        quo præcéperam tibi ne coméderes, maledícta terra in ópere tuo: in labóribus
        cómedes ex ea cunctis diébus vitæ tuæ. Spinas et tríbulos germinábit tibi, et
        cómedes herbam terræ. In sudóre vultus tui vescéris pane, donec revertáris in
        terram de qua sumptus es: quia pulvis es, et in púlverem revertéris. Et emísit
        eum Dóminus Deus de paradíso voluptátis, ut operarétur terram de qua sumptus
        est. Ejecítque Adam: et collocávit ante paradísum voluptátis chérubim, et
        flámmeum gládium, atque versátilem, ad custodiéndam viam ligni vitæ.
      en: >-
        In the beginning God created man to his own image; to the image of God he
        created him; male and female he created them. And God blessed them, saying:
        “Increase and multiply, and fill the earth, and subdue it”. And God saw all the
        things that he had made, and they were very good. And the evening and morning
        were the sixth day. So the heavens and the earth were finished, and all the
        furniture of them. And on the seventh day God ended his work which he had made:
        and he rested on the seventh day from all his work which he had done. And he
        blessed the seventh day, and sanctified it: because in it he had rested from all
        his work which God created and made.


        And the Lord God formed man of the slime of the earth: and breathed into his
        face the breath of life, and man became a living soul. And the Lord God had
        planted a paradise of pleasure from the beginning: wherein he placed man whom he
        had formed. And the Lord God brought forth of the ground all manner of trees,
        fair to behold, and pleasant to eat of: the tree of life also in the midst of
        paradise: and the tree of knowledge of good and evil. And the Lord God took man,
        and put him into the paradise of pleasure, to dress it, and to keep it.


        And to Adam the Lord God said: Because you have hearkened to the voice of your
        wife, and have eaten of the tree, whereof I commanded you, that you should not
        eat, cursed is the earth in your work: with labour and toil shall you eat
        thereof all the days of your life. Thorns and thistles shall it bring forth to
        you, and you shall eat the herbs of the earth. In the sweat of your face shall
        you eat bread till you return to the earth out of which you were taken: for dust
        you are, and into dust you shall return. And the Lord God sent him out of the
        paradise of pleasure, to till the earth from which he was taken. And he cast out
        Adam: and placed before the paradise of pleasure Cherubims, and a flaming sword,
        turning every way, to keep the way of the tree of life.
    responsory:
      la: "R. Sex diébus operáberis et fácies ómnia ópera tua, séptimo autem die sábbatum Dómini Dei tui est: * Non fácies omne opus in eo, allelúja. V. Sex enim diébus fecit Dóminus cælum et terram, et requiévit in die séptimo. R. Non fácies omne opus in eo, allelúja."
      en: "R. Six days shall you labor, and shall do all your works, but on the seventh day is the sabbath of the Lord your God. * You shall do no work on it, alleluia. V. For in six days the Lord made heaven and earth, and rested on the seventh day. R. You shall do no work on it, alleluia."
    status: { la: verified, en: verified }

  - nocturn: 2
    isGospel: false
    source: "From the Acts of Pope Pius XII"
    text:
      la: >-
        Ecclésia, providentíssima ómnium Mater, máximas impéndit curas ad opífices
        tutándos ac levándos, eorúndem consociatiónes instítuens iísque favens, quas
        Pius duodécimus, Póntifex Máximus, jamprídem validíssimo sancti Joseph
        patrocínio concréditas esse vóluit. Etenim sanctus Joseph, cum putatívus esset
        pater Christi, qui faber et fabri fílius appellári dignátus est, propter
        necessitúdinem qua junctus erat cum Jesu, abúnde spíritum illum hausit unde
        labor nobilitátur atque evéhitur. Consímili modo hujuscémodi opíficum
        consociatiónes adníti debent, ut Christus sit semper in ipsis præsens, in eórum
        membris horúmque famíliis, in omni dénique cœtu operário; síquidem præcípuus
        harum consociatiónum finis est, ut christiánam vitam in suis membris servent
        atque alant, Deíque regnum látius propágent, præsértim inter ejúsdem officínæ
        contubernáles.


        De hac autem Ecclésiæ sollicitúdine erga cœtum operárium novum idem Póntifex
        prǽbuit arguméntum, cum occasiónem nactus opíficum convéntus caléndis majis anni
        millésimi nongentésimi quinquagésimi quinti Romæ celebráti, ingéntem
        multitúdinem in foro ad sancti Petri Basílicam coadunátam álloquens, opíficum
        institutiónem summópere commendávit. Hæc enim nostris tempóribus potióres sibi
        víndicat partes, ut opífices, christiána doctrína rite imbúti, grassántes circa
        societátis constitutiónem remque œconómicam erróres devítent, et morálem órdinem
        a Deo præstitútum, quem Ecclésia pandit atque interpretátur, de opíficum júribus
        atque offíciis, probe noscant, reíque geréndæ partícipes effécti, ejúsdem
        procuratióni efficáciter adlabórent. Christus enim primus in orbe promulgávit
        atque Ecclésiæ trádidit princípia, quæ ad has diriméndas quæstiónes immutabília
        ac validíssima perstant.


        Quo autem humáni labóris dígnitas, et princípia quæ eándem effíciunt, áltius
        insidérent ánimis, Pius duodécimus festum sancti Joseph opíficis instítuit, qui
        omni cœ́tui operário exémplo sit ac præsídio. Ab hoc enim exémplo, qui operósas
        exércent artes díscere debent qua ratióne et quo spíritu sua múnia éxpleant, ut
        páriter primo Dei obsequéntes præcépto, terram subíciant atque œconómicæ
        prosperitáti cónsulant, ac simul ætérnæ vitæ prǽmia consequántur. Neque déerit
        próvidus Nazarethánæ Famíliæ custos sibi arte ac labóre cómpares suo munímine
        tégere eorundémque cǽlitus fortunáre domos. Aptíssime Summus Póntifex hoc festum
        celebrári jussit caléndis majis, quem diem operárii cœtus sibi ascivérunt; hinc
        enim spes affúlget fore, ut dies hic, sancto Joseph opífici dicátus, deínceps
        non ódia exácuat ac júrgia accéndat, sed síngulis recúrrens annis, omnes invítet
        ad ea magis magísque perficiénda, quæ cívium paci adhuc desunt, immo étiam
        reipúblicæ moderatóres exstímulet ad ea solérter absolvénda quæ consortiónis
        humánæ rectus expóstulat ordo.
      en: >-
        The Church, most provident Mother of All, expends the greatest efforts for the
        protection and relief of the workers, erecting and promoting for them societies
        which Pius XII, the Supreme Pontiff, now wishes to be entrusted to the most
        powerful patronage of St. Joseph. For St. Joseph, since he was reckoned the
        father of Christ, who deigned to be called the son of a workman, on account of
        the irrevocable bond which united him to Jesus, drank abundantly of that spirit
        which ennobles and elevates labor. In like manner, associations of workers ought
        to be aware of the same kind of spirit, so that Christ may always be present in
        them, in their members, in their families and in fact in every labor
        organization, because the chief purpose of these associations is to foster and
        nourish the Christian life in their members, to spread the Kingdom of God more
        widely, especially among fellow workers in the same plant.


        The same Pontiff supplied a new proof of the Church's solicitude for labor
        organization, when, upon the occasion of a convention of workingmen held in Rome
        on the first of May in the year 1955, he took the opportunity of speaking to a
        large multitude gathered in the square before St. Peter's Basilica, and
        commended most highly the instruction of workingmen. For in our day it is of
        prime importance that the workers be properly imbued with Christian doctrine in
        order that they may avoid the widespread errors concerning the nature of society
        and economic matters. Moreover, such instruction is needed that they might have
        a correct knowledge of the moral order established by God as it effects the
        rights and duties of workers, and which the Church discloses and interprets, so
        that by partaking in the needed reforms they might work more effectively toward
        their realization. For Christ was the first one to promulgate in the world those
        principles which he delivered to the Church and which still stand unchangeable
        and most valid for the solution of these problems.


        In order that the dignity of human labor and the principles which underlie it
        might penetrate more deeply into souls, Pius XII has instituted the feast of St.
        Joseph the Workman, as an example and a protection for all associations of
        workers. For from this example, those who follow the worker's calling ought to
        learn how and in what spirit they should discharge their duties, so that,
        obeying the first law of God, they might likewise subdue the earth and attain to
        economic prosperity, and at the same time reap the rewards of eternal life. Nor
        will the prudent guardian of the Family of Nazareth fail to shield with his
        protection, and from heaven bless the homes of those who, like him, are artisans
        and workmen. Most aptly has the Supreme Pontiff ordered this feast to be
        celebrated on the first of May, a day which the workers have adopted as their
        own; from henceforth let it be hoped that this day, dedicated to St. Joseph the
        Workman, will, as time goes on, not sharpen hatred and inflame strife, but with
        each recurring year, invite everyone to strive more and more for those things
        which are still lacking to civil peace, and indeed that it may stimulate the
        public authorities to use their abilities in effecting whatever right order
        demands of human fellowship.
    responsory:
      la: "R. Non fácies calúmniam próximo tuo, nec vi ópprimes eum; * Non morábitur opus mercenárii tui apud te usque mane, allelúja. V. Dignus est enim operárius mercéde sua. R. Non morábitur opus mercenárii tui apud te usque mane, allelúja."
      en: "R. You shall not calumniate your neighbor, nor oppress him by violence. * The wages of him who has been hired by you shall not be withheld from him overnight, alleluia. V. The laborer is worthy of his wages. R. The wages of him who has been hired by you shall not be withheld from him overnight, alleluia."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 13:54-58", en: "Matt 13:54-58" }
    text:
      la: >-
        Et veniens in patriam suam, docebat eos in synagogis eorum, ita ut mirarentur,
        et dicerent: Unde huic sapientia haec, et virtutes? Nonne hic est fabri filius?
        nonne mater ejus dicitur Maria, et fratres ejus, Jacobus, et Joseph, et Simon,
        et Judas? et sorores ejus, nonne omnes apud nos sunt? unde ergo huic omnia ista?
        Et scandalizabantur in eo. Jesus autem dixit eis: Non est propheta sine honore,
        nisi in patria sua, et in domo sua. Et non fecit ibi virtutes multas propter
        incredulitatem illorum.
      en: >-
        And coming into his own country, he taught them in their synagogues, so that
        they wondered and said: How came this man by this wisdom and miracles? Is not
        this the carpenter's son? Is not his mother called Mary, and his brethren James,
        and Joseph, and Simon, and Jude: And his sisters, are they not all with us?
        Whence therefore hath he all these things? And they were scandalized in his
        regard. But Jesus said to them: A prophet is not without honour, save in his own
        country, and in his own house. And he wrought not many miracles there, because
        of their unbelief.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Albert the Great, Bishop, On the Gospel of Luke, Ch. 4"
    text:
      la: >-
        Die sábbati intrávit in synagógam, quo omnes intentióne audiéndi convéniunt. Et
        ómnium in synagóga óculi erant intendéntes in eum. Hoc tamen quidam devotióne,
        quidam curiositáte, et quidam observántes eum fecérunt, ut cáperent eum in
        sermóne. Et dicébant scribæ et pharisǽi ad pópulum, qui jam fidem et devotiónem
        concéperat: « Nonne hic est fílius Joseph? » Despectiónis nota est demonstrátio
        ejus quem nomináre non sunt dignáti. Fílius Joseph: minus hic dicit evangelísta
        quod tam a Matthǽo quam a Marco plénius scíverat esse pósitum: « Nonne hic est
        fabri fílius? Nonne hic est faber, fílius Maríæ? » Hæc ómnia despectíve dicta
        sunt.


        Faber lignárius dícitur fuísse Joseph, arte et usu mánuum victum quærens, et non
        in ótio et delíciis panem mandúcans, sicut scribæ et pharisǽi fecérunt. María
        étiam colo et consílio mánuum victum quærébat. Et est sensus: Hic despéctæ et
        paupérrimæ nativitátis, non potest esse Christus Dóminus, quem unxit Deus. Et
        ídeo sibi non est credéndum tam rusticáno et tam vili.


        Faber tamen erat Dóminus: quia prophéta dixit de ipso: « Tu fabricátus es
        auróram et solem. » Símilis modus despectívus est in libro Regum, ubi Saul
        promóto in regnum suum dixérunt: « Quænam res áccidit fílio Cis? Num et Saul
        inter prophétas est? » Parva ergo locútio magnum impórtat despéctum. Dóminus
        autem dixit: « Amen dico vobis, quia nemo prophéta accéptus est in pátria sua. »
        Se autem prophétam hic dicit Dóminus. Ipse enim, cui ómnia per divinitátem nota
        sunt, nullam pénitus récipit inspiratiónis revelatiónem. Pátriam autem suam
        vocat hic stricte locum conceptiónis et nutritiónis. Suis autem convicáneis, qui
        invídia incitabántur ad ipsum, non fuit accéptus.
      en: >-
        On the Sabbath day he entered the synagogue, where those who came to listen had
        gathered. And the eyes of everyone in the synagogue were intent upon him. Some
        indeed with devotion, some out of curiosity, while some watched him that they
        might trap him in his talk. And the Scribes and Pharisees said to the people, in
        whom faith and devotion had already made a beginning: “Is not this the son of
        Joseph?” See this attitude of disparagement toward him whom they did not even
        deign to call by his name. “The son of Joseph,” this little the Evangelist says
        because he had known that both in Mark and in Matthew a fuller statement would
        be made: “Is not this the carpenter's son? Is he not a workman, the son of
        Mary?” All these things were said contemptuously.


        Joseph is said to have been a carpenter who earned his living by his skill and
        the work of his hands, and he did not eat his bread in idleness and indulgence,
        like the Scribes and Pharisees. Mary also worked for her living with her
        husband, and with competent hands. And here is the meaning of what they said
        about him: “This man of ignoble and poverty-stricken birth could not be Christ
        the Lord, whom God anointed. And thus no credence is to be given to such an
        uncultivated and low-born man.”


        Now the Lord was a workman because the prophet said of him: “You fashioned the
        moon and the sun.” A similar contemptuous way of speaking is found in the Book
        of Kings, where they said of Saul when he became king: “What is this that has
        happened to the son of Cis? Is Saul also among the prophets?” This slight remark
        shows great disparagement. For the Lord says: “Amen I say to you, that no
        prophet is acceptable in his own country.” Here the Lord calls himself a
        prophet. For he, to whom all things are known through his divinity, receives no
        revelation of inspiration from outside himself. Here, however, he definitely
        calls the place of his birth and upbringing his own country. But he was not
        acceptable to his fellow townsmen who were incited against him by envy.
    responsory:
      la: "R. Jesus erat incípiens quasi annórum trigínta, * Qui putabátur fílius Joseph, allelúja. V. Faber autem erat Joseph, sponsus Vírginis Maríæ, de qua natus est Christus. R. Qui putabátur fílius Joseph, allelúja."
      en: "R. Jesus was about thirty years of age, * Who, as was supposed, was the son of Joseph, alleluia. V. Now Joseph was a carpenter, the spouse of the Virgin Mary, of whom Christ was born. R. Who, as was supposed, was the son of Joseph, alleluia."
    status: { la: verified, en: verified }
