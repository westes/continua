# responsory given in the source.
id: ss-chrysanthus-and-daria
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Chrysanthus et Daría cónjuges, nobili genere nati, fide étiam clariores, quam Daría,
        maríti opera, cum baptismo susceperat; Romæ innumerábilem hóminum multitúdinem, hæc
        mulíerum, ille virórum, ad Christum convertérunt. Quare Celerinus præfectus
        comprehensos trádidit Cláudio tribuno, qui jussit a milítibus Chrysanthum vinctum
        cruciátibus torqueri; sed víncula ómnia resoluta sunt, mox cómpedes, in quos
        conjéctus fuerat, confracti. Deínde, bovis corio inclusum, in ardentíssimo sole
        constituunt. Tum, pédibus ac mánibus catena constrictis, in obscurum carcerem
        detrudunt; ubi, solutis catenis, claríssima lux locum illustrávit. Daría veri in
        lupánar compulsa, leónis tutela, dum in oratióne defixa est, a contumelia divinitus
        defensa est. Denique in arenariam, quæ est via Salaria, uterque ductus, effossa
        terra, lapidibus óbruti, parem martyrii corónam adepti sunt.
      en: >-
        Chrysanthus and Daria were an husband and wife, of noble birth, but glorious rather
        for their faith, which the wife learnt from the husband. They brought to Christ a
        great number of persons at Rome, she women, and he men. Therefore the Praefect
        Celerinus caused them to be taken, and gave them over to Claudius the Tribune, who bade
        Chrysanthus to be tormented by the soldiers, all bound as he was, but all his bonds
        brake, and so likewise the shackles wherein his feet were afterwards fastened. Then was
        Chrysanthus sewn up in an ox-hide and set in the full heat of the sun, and thereafter
        chained hand and foot and cast into a dark prison, but the chains dropped off from him,
        and the place was filled with light. Meanwhile Daria was haled to a brothel, but God
        kept her from insult, a lion guarding her, and herself always rapt in prayer. Lastly
        they were both of them led to a sand-pit upon the Salarian Way, where they were thrown
        alive into a hole, and buried in stones, and so were not divided in winning the victory
        of Martyrdom.
    status: { la: verified, en: verified }
