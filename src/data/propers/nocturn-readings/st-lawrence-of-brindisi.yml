# Matins Nocturn 2 reading for St. Lawrence of Brindisi, Confessor and Doctor of the Church. Sourced directly from
# web/www/horas/Latin/Sancti/07-21r.txt, English/Sancti/07-21r.txt.
# single lesson (Lectio94), one continuous account.
id: st-lawrence-of-brindisi
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Lauréntius, Brundúsii in Apúlia natus, aduléscens Ordinem Fratrum Minórum
        Capuccinórum ingréssus, philosóphiam ac theológiam pénitus dídicit, complúres
        autem linguas et antíquas et recentióres cálluit. Sacérdos inaugurátus,
        prædicándi munus suscépit, quod per totam fere Itáliam aliásque Európæ regiónes
        indeféssus obívit. Singulári prudéntia consiliíque dono prǽditus, univérso
        Ordini regéndo præféctus est, et a Summis Pontifícibus sæpe adhíbitus ad
        gravíssimas obeúndas legatiónes. Atque ejus potíssimum ópera efféctum est, ut
        príncipes christiáni cópias suas consociáverint contra ingruéntes Turcárum
        turmas: quibúscum exércitus christiánus in Hungária congréssus, Lauréntio
        præeúnte cum cruce, mílites ducésque cohortánte, celebérrimam rétulit victóriam.
        Inter tot vero tantáque negótia, religiósi hóminis virtútes heróico modo cóluit.
        Quidquid supérerat témporis, oratióni impéndens, vitam interiórem cum extérna
        actuositáte mirífice conjúnxit. Tandem Olisipóne, quo a pópulo neapolitáno
        orátor ad regem Hispániæ missus fúerat, libertátis christiánæ et justítiæ
        strénuus assértor, quasi in ácie occúbuit anno millésimo sexcentésimo
        undevicésimo. Multa relíquit scripta ad fidem cathólicam advérsus hǽreses
        defendéndam, et ad sacras Lítteras explanándas. Eum Leo Papa décimus tértius in
        Sanctórum númerum rétulit, Joánnes vero Papa vigésimus tértius univérsæ Ecclésiæ
        Doctórem declarávit.
      en: >-
        Born at Brindisi in the Kingdom of Naples, Lawrence entered the Capuchin order
        as a young man. He acquired a thorough knowledge of philosophy and theology and
        became proficient in several languages, ancient as well as modern. When he had
        been ordained a priest, he undertook the work of preaching, in which he labored
        indefatigably throughout almost all Italy and other European countries.
        Possessed of unusual prudence as well as the gift of counsel, he was given
        authority over the whole Order and was often employed by the popes for very
        important diplomatic missions. Indeed, it has been attributed chiefly to him
        that the Christian princes joined their forces against the invading Turkish
        troops. The Christian army engaged the Turkish forces in Hungary, and with
        Lawrence himself riding before the army, armed with the Crucifix, and urging on
        the soldiers and generals, they won a remarkable victory. Among all these
        important activities, he practiced the virtues of the religious to heroic
        degree. Whatever spare time he had, he devoted to prayer, wonderfully combining
        the interior life with the external and active life. Finally he died in 1619, at
        Lisbon, in the line of battle, at it were: he had been sent there by the people
        of Naples to put their case before the King of Spain, as a forceful pleader for
        Christian freedom and justice. He left many writings devoted to the defense of
        Catholic faith against heretics, and to the explanation of Sacred Scripture.
        Pope Leo XIII enrolled him among the Saints, and Pope John XXIII declared him a
        doctor of the Universal Church.
    status: { la: verified, en: verified }
