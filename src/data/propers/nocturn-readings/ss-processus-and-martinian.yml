# Matins Nocturn 2 reading for Ss. Processus and Martinian, Martyrs. Sourced directly from
# web/www/horas/Latin/Sancti/07-02cc.txt, English/Sancti/07-02cc.txt.
# single lesson (Lectio93), one continuous account.
id: ss-processus-and-martinian
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Quo témpore Petrus et Paulus tenebántur sub custódia Mamertíni in monte Tarpéjo,
        duo custódes, Procéssus et Martiniánus, cum áliis quadragínta, Apostolórum
        prædicatióne miraculísque commóti, se ad Jesu Christi fidem convertérunt; et,
        cum repénte fons e saxo ortus esset, baptizáti sunt. Qui permisérunt Apóstolis,
        ut, si vellent, abírent. Sed Paulínus mílitum præféctus, re cógnita, Procéssum
        et Martiniánum a suscépto consílio revocáre conátur. Qui, cum frustra tempus
        contéreret, ipsórum ora saxo contúndi dentésque commínui jubet. Mox ad Jovis
        státuam addúctos, cum eádem constántia veneratúros se idóla negárent, ímperat
        equúleo torquéri, candéntibus láminis ad eórum corpus admótis, ac cædi fústibus;
        quibus in cruciátibus una hæc illórum vox audiebátur: Sit nomen Dómini
        benedíctum. Dénique conjécti in cárcerem, paulo post extra Urbem via Aurélia
        secúri feriúntur. Quorum córpora Lucína in prǽdio suo sepelívit, sexto Nonas
        Júlii; quæ póstea, in Urbem transláta, in basílica Príncipis Apostolórum cóndita
        sunt.
      en: >-
        At what time Peter and Paul were kept in the Mamertine Prison, at the foot of
        the Tarpeian Rock, two of the gaolers, named Processus and Martinian, along with
        other forty, were moved by the preaching and miracles of the Apostles to believe
        in Christ, and were baptized in a spring which suddenly brake forth out of the
        rock. These men let the Apostles depart if they willed it. But Paulinus, Prefect
        of the soldiers, when he heard what was come to pass, strove to turn away
        Processus and Martinian from their purpose. And when he found that he but wasted
        time, he ordered their faces to be bruised and their teeth to be broken, with
        stones. Moreover, when he had had them led to the image of Jupiter, and they
        still boldly answered that they would not worship the gods, he caused them to be
        tormented on the rack, and white-hot plates of metal to be put to their flesh,
        and that they should be beaten with sticks. While they were suffering all these
        things they were heard to say only this one word Blessed be the Name of the
        Lord. They were afterwards cast into prison, and in a little while they were
        taken outside the city, and slain with the axe, upon the Aurelian Way. The Lady
        Lucina buried their bodies upon her own farm, upon the 2nd day of July, but they
        were afterwards brought into the City, and are buried in the Church of the
        Prince of the Apostles.
    status: { la: verified, en: verified }
