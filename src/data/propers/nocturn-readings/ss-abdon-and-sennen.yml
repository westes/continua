id: ss-abdon-and-sennen
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Abdon et Sennen Persæ, Decio imperatóre, accusáti quod córpora Christianórum, quæ
        inhumáta projiciebántur, in suo prædio sepelissent, jussu imperatóris comprehendúntur,
        et diis jubéntur sacrificare. Quod cum fácere neglígerent, et Jesum Christum Deum
        constantíssime prædicarent, tráditos in arctam custódiam, Romam póstea rédiens Decius
        vinctos duxit in triumpho. Qui cum in Urbe ad simulacra attracti essent, ea detestáti
        conspuérunt. Quam ob rem ursis ac leónibus objecti sunt; quos feræ non audébant
        attingere. Demum, gládiis trucidati, colligátis pédibus tracti sunt ante solis
        simulacrum. Quorum corpora, clam inde asportata, Quirínus diaconus sepelívit in suis
        ædibus.
      en: >-
        Abdon and Sennen were Persians. In the reign of the Emperor Decius they were accused of
        interring, on their own farm, the bodies of Christians, which had been thrown out
        unburied. The Emperor commanded them to be arrested and ordered to sacrifice to the
        gods. This they refused to do, and persistently preached that Jesus Christ is God,
        whereupon they were put into strict confinement. When Decius afterwards returned to
        Rome, he had them led in chains in his triumph. Being thus dragged into the city and up
        to the idols, they abhorred and spat upon them, for which they were cast to bears and
        lions; the beasts were afraid to touch them. They were butchered with the sword, and the
        corpses, with their feet bound together, were dragged before the image of the sun.
        Thence they were stolen away, and the Deacon Quirinus buried them in his own house.
    status: { la: verified, en: verified }
