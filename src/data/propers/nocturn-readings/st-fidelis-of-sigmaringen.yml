# Matins Nocturn 2 reading for St. Fidelis of Sigmaringen, Martyr
# (Apr 24). Sourced directly from web/www/horas/Latin/Sancti/04-24.txt,
# English/Sancti/04-24.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in the source (6-lesson office).
id: st-fidelis-of-sigmaringen
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Fidélis, in oppido Sueviæ Sigmaringa ex honesta Reyórum família natus, ab
        ineunte ætate singularibus natúræ et gratiæ donis ornatus præfulsit. Egregiam
        quippe sortitus índolem, morúmque optima imbutus disciplína, dum Friburgi
        philosophíæ et juris utriusque lauream emeruit, in schola étiam Christi ad
        perfectiónis ápicem sedulo virtútum exercítio conténdere cœpit. Nobílium
        exínde virórum varias Europæ provincias lustrántium comes ascitus, eos ad
        christianam pietátem sectandam, tam verbis quam opéribus, excitare non
        déstitit. Quinimmo in eodem itinere crebris austeritátibus desidéria carnis
        mortificare, ac ita seípsum regere studuit, ut in tanta rerum vicissitúdine
        nullo umquam visus fúerit iræ motu perturbari. Juris præterea et justítiæ
        strenuus propugnator, post réditum in Germaniam celebre sibi nomen acquisívit
        in advocáti munere; in quo tamen cum fori pericula esset expertus, tutiórem
        ætérnæ salútis viam íngredi deliberávit, et superna vocatióne illustratus,
        paulo post ordini Seraphico inter fratres Minores Capuccinos adscribi pétiit.


        Piæ petitiónes compos redditus, mundi suique contemptor insígnis, in ipso
        statim tirocinio, magisque cum solemnis professióne vota in gáudio spíritus
        Dómino nuncupasset, in regulari observántia ómnibus admiratióni fuit et
        exemplo. Oratióni maxime et sacris litteris vacans, in verbi quoque ministerio
        singulari grátia excellens, nedum Catholicos ad meliórem frugem, verum étiam
        heterodoxos ad veritátis cognitiónem attraxit. Plúribus in locis cœnobii
        præfectus constitútus, prudéntia, justítia, mansuetúdine, discretióne et
        humilitátis laude, munus sibi demandátum exercuit. Arctíssimæ paupertátis
        zelator egregius, quidquid vel minus necessárium viderétur, e cœnobio
        pénitus eliminávit. Inter austera jejunia, vigílias et flagélla salutári
        seípsum prósequens ódio, in alios amórem, quasi mater in fílios, osténdit. Cum
        pestífera febris Austríacas militares copias dire affligeret, ipse in extremis
        infirmórum indigentiis ad assidua caritátis offícia toto spíritu incúbuit. In
        componéndis étiam animórum dissidiis, aliisque próximi necessitátibus
        sublevandis consílio et opere adeo præcláre se gessit, ut pater pátriæ
        merúerit appellari.


        Deíparæ Vírginis et rosarii cultor exímius, illíus præcipue aliorúmque
        Sanctórum patrocinio a Deo postulávit, ut in catholicæ fidei obsequium vitam
        sibi et sánguinem fúndere licéret. Cumque ardens hoc desidérium in quotidiana
        Sacri devota celebratióne magis accenderétur, mira Dei providéntia factum est,
        ut fortis Christi athleta præses eligerétur illárum missiónum, quas
        Congregátio de Propaganda Fide pro Rhætia tunc témporis institúerat. Quod
        arduum munus prompto hilaríque animo suscípiens, tanto fervore exsecutus est,
        ut, plúribus hæreticis ad orthodoxam fidem conversis, spes non modica
        effulserit totius illíus gentis Ecclésiæ et Christo reconciliandæ. Prophetíæ
        dono præditus, futuras Rhætiæ calamitátes, suique necem ab hæreticis
        inferéndam sæpius prædixit. Postquam vero insidiárum probe cónscius impendénti
        agoni se præparasset, die vigesima quarta Aprilis anno millesimo
        sexcentésimo vigesimo secundo, ad ecclésiam loci, Sevisium nuncupati, se
        cóntulit; ubi ab hæreticis, qui pridie conversiónem simulántes, eum dolóse ad
        prædicándum invitáverant, concióne tumultuárie interrupta, per verbera ac
        vulnera eídem crudeliter inflicta gloriósam mortem magno et álacri corde
        perpéssus, primítias Mártyrum memorátæ Congregatiónis proprio sánguine
        consecrávit; plúribus signis et miraculis exínde clarus, præsertim Curiæ et
        Feldkírchii, ubi summa pópuli veneratióne illíus relíquiæ asservántur.
      en: >-
        Fidelis was born of the respectable family of Rey in the town of Sigmaringen in
        Swabia. From his childhood he was adorned with many bright gifts of nature and
        grace. Intellectually distinguished, and assisted by all the advantages of
        education, he took at Fribourg the degrees of Philosophy and of Civil and Canon
        Law, and it was while engaged in these studies, that he began to strive after
        the height of perfection in the school of Christ, to which end he earnestly
        trained himself in all the exercises of godliness. He ceased not to exhort to
        Christian godliness, both by his words and works, the noblemen who made him
        their companion, and who were drawn from the chief families of diverse parts of
        Europe. While on his travels, he was careful to mortify the lusts of the flesh
        by frequent austerities, and so to get the command of himself, that he was
        never seen under any circumstances to be moved to anger. He was a zealous
        champion of law and justice, and when he returned into Germany, he won a most
        distinguished name in his profession as an advocate. After a while, however, in
        view of the dangers which beset him at the Bar, he determined to enter on a
        path safer as regarded his eternal salvation, and, in obedience to an inward
        call from above, he sought admission into the Seraphic Order, among the
        Capuchin Friars Minor.


        After he had obtained his holy wish, he showed himself even in his noviceship a
        singular despiser of the world and of himself, and still more so when with
        great spiritual joy he had made his solemn profession to the Lord. By his
        observance of the Rule, he became the wonder and the example of all. He gave
        himself chiefly to prayer and sacred learning, but he excelled, by a remarkable
        grace, in the ministry of the Word, and thereby not only stirred up the
        Catholics to bring forth more fruit, but also drew misbelievers to the
        knowledge of the truth. He was set at the head of communities of Friars in
        diverse places, and discharged the duty so laid upon him with great praise for
        prudence, justice, meekness, wisdom, and lowliness. He was animated by a
        vehement love of the strictest poverty, and cleansed the convent of whatever
        was not altogether needful. While he pursued himself with an healthy hatred,
        and most stern fastings, watchings, and scourgings, he showed to all others a
        love like the love of a mother for her sons. When a contagious fever made
        horrid ravages among the Austrian soldiers, he gave himself up with his whole
        soul to unwearied offices of tenderness toward the helpless sick. In allaying
        quarrels and relieving the temporal distress of his neighbour, he bore himself
        with such wisdom and zeal as to earn the name of Father of his country.


        He tenderly and warmly loved the maiden Mother of God and her Rosary, and he
        besought God under the patronage of many of His holy servants, but especially
        under that of the same blessed Mother, to vouchsafe to let him offer his life
        and his blood together for the sake of the Catholic faith. This burning desire
        came upon him more and more, day by day, and by the unexpected Providence of
        God it came to pass that this brave soldier of Christ was chosen President of
        the Missions which the Congregation for the Propagation of the Faith had at
        that time just founded for the Grisons. He accepted this hard task with a
        willing and joyful heart, and discharged it with such zeal, that many heretics
        were turned to the orthodox faith, and great hope was engendered that the
        whole of that people would return to the peace of Christ and His Church.
        Fidelis, who was gifted with the spirit of Prophecy, often foretold the great
        woes which afterwards came upon the Grisons, and that he himself would be
        murdered by the heretics. At last, some of the heretics, who pretended to be
        converted, entreated him to come and preach at the Church of a place which is
        called Sevis. On the 24th day of April, in the year 1622, he went to Sevis, and
        began to preach, but his discourse was interrupted by a riot, and he was
        brutally murdered. By this glorious death, which he suffered with a willing
        and cheerful heart, he offered to God in his own blood the first-fruits of
        martyrdom from the abovementioned Congregation. God hath since glorified him by
        many signs and wonders, especially at Chur and Feldkirch, where his relics are
        kept with much popular veneration.
