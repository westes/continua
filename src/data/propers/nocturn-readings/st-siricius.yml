# Matins Nocturn 2 reading for St. Siricius, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/10-31-Siricius.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-siricius
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Siricius Románus, ex presbytero tituli Pastóris, vita functo sancto Damaso Papa, cleri
        populique univérsi acclamatione ad apostólicam Sedem evéctus est, obnitente frustra Ursicino
        schismatico, gratulante vero in primis Valentiniáno imperatóre, qui magnum innocéntiæ et
        probitatis exémplum eum prædicávit. Ipso sui pontificátus exordio decretalem epístolam,
        saluberrimis institutionibus plenam, ad Himerium dedit Tarraconensem epíscopum, áliis
        Hispaniárum ecclésiis communicandam, ut corrupti clericórum mores emendarentur, et
        disciplínæ vigor instauraretur, quam in Africa quoque collabéntem, hábita Romæ synodo
        octogínta episcopórum, reparándam curávit.


        Innúmera sunt cétera, quæ pro fídei defensione toto sui pontificátus témpore invícte
        perégit. Joviniánum monachum, sanctas virginitátis hostem, et christianum Epicurum in Romána
        synodo anathemate confixit. Bonosum quoque Sardicensem epíscopum, Christi divinitátem et
        Deíparæ post partum virginitátem inficiantem damnávit. Manichæos ex Urbe ejectos imperiali
        lege sæculáribus pœnis coërcendos subjécit; redeuntes vero ad Ecclésiam in monastéria
        detrudi, ac nonnisi in vitæ éxitu ad communiónem recipi vóluit.


        Religiónis tuéndæ et amplificándæ stúdium, quod sane quam máximum declarabat, egrégie
        adjúvit magnus Theodosius imperátor, qui cum, sublatis Gentílium simulácris, templisque
        interdictis aut evdrsis, idolórum cultum omnem aboleri jussísset, christiána religio, ipso
        sedénte Pontífice, mirífice propagata est. Præcláris pro Ecclésia functus labóribus,
        editisque sanctíssimis légibus, septuagenario major obdormívit in Dómino, anno salútis
        trecentésimo nonagésimo octávo. Sedit in pontificátu annos círciter quatuórdecim. Ejus
        corpus e cœmetério Priscíllæ via Salária in títulum sanctæ Praxedis a Pascháli primo
        translátum est. Illíus vero nomen Benedíctus décimus quartus Póntifex Máximus, plene
        vindicáta ejus ab objectis criminibus innocéntia, in Románi Martyroldgii tabulas referri
        jussit.
      en: >-
        Siricius, a Roman, from priest of the title of Pastor, Pope Damasus having departed this
        life, was raised to the Apostolic See by the acclamation of the whole clergy and people, the
        schismatic Ursicinus opposing in vain, while the Emperor Valentinian especially rejoiced,
        who declared him a great example of innocence and probity. At the very beginning of his
        pontificate he gave a decretal letter, full of most salutary regulations, to Himerius,
        bishop of Tarragona, to be communicated to the other churches of Spain, that the corrupt
        morals of clerics might be amended and the vigour of discipline restored; which also in
        Africa, failing, a synod of eighty bishops having been held at Rome, he saw to it should be
        repaired.


        Countless are the other things which throughout the whole time of his pontificate he
        invincibly accomplished for the defence of the faith. Jovinian the monk, enemy of holy
        virginity and a Christian Epicurus, he struck with anathema in a Roman synod. Bonosus also,
        bishop of Sardica, denying the divinity of Christ and the virginity of the Mother of God
        after the birth, he condemned. The Manichaeans, cast out of the City, he subjected by
        imperial law to secular penalties; but he willed that those who returned to the Church be
        shut up in monasteries and received to communion only at the end of life.


        The zeal for protecting and spreading religion, which indeed he showed to the highest
        degree, was excellently helped by the great Emperor Theodosius, who, the images of the
        Gentiles having been removed and their temples forbidden or overthrown, commanded that all
        worship of idols be abolished; the Christian religion, while he sat as Pontiff, was
        wonderfully propagated. Having performed illustrious labours for the Church, and published
        most holy laws, past seventy years he fell asleep in the Lord, in the year of salvation 398.
        He sat in the pontificate about fourteen years. His body was translated from the cemetery of
        Priscilla on the Salarian Way to the title of St. Praxedes by Paschal the First. His name
        Pope Benedict the Fourteenth, his innocence from the charges laid against him having been
        fully vindicated, ordered to be entered in the tables of the Roman Martyrology.
    status: { la: verified, en: draft }
