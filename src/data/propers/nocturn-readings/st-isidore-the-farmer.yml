# Matins Nocturn 2 reading for St. Isidore the Farmer, Confessor (Oct 25).
# Sourced from `Sancti/10-25n.txt` [Lectio94] and its English counterpart
# -- both real source text, marked verified.
id: st-isidore-the-farmer
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Isidórus, Matríti natus, agros colébat ex mercéde; sed, vere beátus agrícola sua
        non ignórans bona, novit et agrum ánimæ suæ frúgibus ditáre virtútum. Nam primum
        quærébat regnum Dei, templa, mariána præsértim, bene mane vísitans, ántequam iret
        ad opus. Quas moras cum gráviter ferret herus, mane quodam ex editióre loco, ubi
        præstolabátur eum increpatúrus, vidit Isidórum binos inter Angelos, qui duplex
        pro eo ducébant jugum boum arántium. Deo sérviens in frátribus, mercédem labóris
        erogábat egénis. Olim páuperes ad convívium vocátos parte pulménti sibi
        reserváta satiávit. Alias, æstáte calénte, ex humo, stímulo boum percússa,
        elícito fonte, heri sui sitim explévit. Sénior obdormívit in Dómino et e
        cœmetério Sancti Andréæ corpus ejus étiam tum íntegrum in ecclésiam translátum
        fuit, ubi, editióre loco situm, miráculis cláruit. Quadringéntos post annos a
        Gregório décimo quinto Sanctórum fastis adscríptum, dein Pius duodécimus
        ruricolárum in Septentrionális Américæ Civitátibus Fœderátis Patrónum declarávit
        et constítuit.
      en: >-
        Isidore, born at Madrid, was employed as a plowman; but, besides being a farmer
        in this sense, he was truly a prosperous farmer, aware of his real needs, in that
        he knew how to enrich the field of his own soul with a crop of virtues. For he
        used to "seek first the Kingdom of God" by visiting the churches, especially
        those dedicated to the Blessed Virgin, early in the morning before he went out to
        work. Annoyed at the delays caused by these visits, his employer planned to
        rebuke him one morning. But from the vantage point he had taken, he saw Isidore
        between two Angels, each of whom was plowing for him with a team of oxen. Serving
        God in his brethren, Isidore used to distribute his wages to the needy. Once,
        when he had invited some poor people to a dinner, he was able to satisfy them all
        with the portion of food that had been saved for him. On another occasion, on a
        hot summer day, he made water spring up from the ground by striking it with a
        goad-stick, and thereby quenched his employer's thirst. At an advanced age he
        fell asleep in the Lord. He was buried in the cemetery of St. Andrew; but later
        his body, still incorrupt, was moved to the church and given a place of honor,
        and its honor was enhanced by miracles. After four hundred years Isidore was
        enrolled among the Saints by Gregory XV. Pope Pius XII declared him the Patron of
        farmers in the United States of America.
    status: { la: verified, en: verified }
