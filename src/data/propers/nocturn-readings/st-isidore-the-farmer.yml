# Matins Nocturn 2 and 3 readings for St. Isidore the Farmer, Confessor.
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-15-Isidorus.txt
# (the traditional May 15 office, Duplex, 9 lectiones). Nocturn 2 is
# Lectio4-6 combined into one continuous vita; this older, fuller vita
# replaces the short US-patronal [Lectio94] summary from `Sancti/10-25n.txt`
# the previous build used (that summary's last sentence, Pius XII's 1947
# declaration of him as patron of US farmers, is therefore no longer
# carried). Nocturn 3 is the source's gospel incipit (John 15, "Ego sum
# vitis vera") and Lectio7-9: St. Gregory's homily on it, then the
# continuation the source gives under the same heading.
#
# No English exists in the reference engine for the aliquibus-locis files
# (English/Sancti has no regional subdirectories at all); the English below
# is this project's own translation, marked draft. Latin is verbatim from
# the source.
id: st-isidore-the-farmer
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Isidórus Agrícola prope Matrítum Hispániæ urbem, in qua natus fúerat, mercéde coléndis agris
        condúctus, brevi magnárum sibi virtútum eo in exercítio ubérrimam ségetem parávit.
        Admirábilis enim Christi ac sanctórum imitátor, numquam ad opus mane se conferébat, nisi
        prius Dei regnum studióse quæreret, ecclesiásque in ipsíus ac Deíparæ honórem dicátas
        visitáret. Quare cum illíus moram agri dóminus gráviter ferret, atque ex editióre loco
        quadam die, ut eum libérius increpáret, Agricolam operirétur, binos Angelos cándida veste
        dúplici boum jugo arántes, mediúmque inter illos Isidórum conspéxit. Quo miráculo vulgáto,
        magno deinceps honóri tam apud herum quam apud céteros hómines habéri cœpit.


        Caritáte in páuperes ádeo flagravit, ut mercédem quam labóribus parábat, egéntibus erogáret.
        Quin étiam cum aliquándo ad commúne cum réliquis confrátribus prándium plúrimos paúperes
        adduxísset, nihilque áliud, prándio scilicet finíto, quam pulménti partem sibi reservátam
        reperisset, illam vir Dei, fide singulári fretus, ita distribuit, ut admirabiliter aucta iis
        ómnibus aléndis saturandisque sufficeret. Illud étiam inter cétera mirándum, quod per
        æstivos calóres ad exstinguéndam in agro sitim, aquæ potum hero flagitánte, cum núllibi
        scatéret, Isidórus stímulo quem gerébat, humo percússa, úberem ex ea et perénnem ad hæc
        usque témpora fontem elícuit.


        Igitur sanctitáte clarus, cum ad últimam senectútem pervenísset, obdormívit in Dómino, et in
        cœmetério sancti Andréæ sepúltus, tamdiu ibi jacuit, quoad cives de ipsíus córpore honéstius
        in ecclésia collocándo divínitus móniti, illud in lóculo integrum atque ádeo incorrúptum
        invenérunt, ut ex eo suavissimus odor, qui hac étiam tempestáte perdúrat, effláret. Sacrum
        corpus in ecclésiam translátum, et in editiore loco situm, máximis Deus miráculis
        illustrávit. Quorum beneficéntiam non semel tam ipsa Matríti cívitas, quam étiam cætera
        Hispánia loca, ope ipsíus imploráta, persensérunt. Quem postrémo post annos fere
        quadringéntos fama sanctitátis ac miráculis illústrem, Gregórius décimus quintus in
        sanctórum númerum rétulit.
      en: >-
        Isidore, a farm labourer near Madrid, the city of Spain in which he was born, hired out to
        till fields for wages, and in a short time reaped for himself, in that employment, a most
        abundant harvest of great virtues. For, a wonderful imitator of Christ and of the saints, he
        never betook himself to his work in the morning without first eagerly seeking the kingdom of
        God and visiting the churches dedicated to the honour of God and of the Mother of God.
        Wherefore, when the master of the field took this delay ill, and one day waited for the
        labourer on a rising ground, that he might rebuke him more freely, he beheld two Angels in
        white garments ploughing with a double yoke of oxen, and Isidore in the midst between them.
        This miracle being noised abroad, he began thenceforth to be held in great honour, as well
        by his master as by other men.


        He burned so with charity toward the poor that he gave to the needy the wages which he
        earned by his labours. Indeed, when once he had brought very many poor people to the common
        dinner with his fellow-labourers, and, the meal being over, found nothing else kept back for
        himself than a portion of pottage, the man of God, relying on singular faith, so distributed
        it that, wonderfully increased, it sufficed to feed and satisfy them all. This also among
        the rest is to be wondered at: that in the summer heats, when his master asked for a drink
        of water to quench his thirst in the field, and it welled up nowhere, Isidore struck the
        ground with the goad which he carried, and drew from it an abundant spring, which flows
        perennially even to these times.


        Therefore, renowned for holiness, when he had come to extreme old age, he fell asleep in the
        Lord; and, buried in the cemetery of St. Andrew, he lay there until the citizens, divinely
        warned to place his body more honourably in the church, found it in the tomb so whole and so
        incorrupt that from it breathed a most sweet fragrance, which endures even in our own day.
        The sacred body, being translated into the church and set in a higher place, God made
        illustrious by very great miracles. Of whose beneficence not once the city of Madrid itself,
        and also the other places of Spain, have had experience, when his help was implored. Him at
        last, after almost four hundred years, illustrious for fame of holiness and for miracles,
        Gregory XV enrolled in the number of the saints.
    status: { la: verified, en: draft }

  - nocturn: 3
    isGospel: true
    citation: { la: "Joan 15:1 et seq.", en: "John 15:1 ff." }
    text:
      la: >-
        In illo témpore: Dixit Jesus discípulis suis: Ego sum vitis vera, et Pater meus agrícola
        est, Et réliqua.
      en: >-
        At that time Jesus said to his disciples: I am the true vine, and my Father is the
        husbandman, etc.
    status: { la: verified, en: draft }

  - nocturn: 3
    isGospel: false
    source: "St. Gregory the Great (Reg., bk. 7, ep. 32; Tract. on the penitential psalms, at Ps. 6, as cited in the source)"
    text:
      la: >-
        Per semetípsam Véritas dicit: Pater meus agricola est : et omnem pálmitem, in me non
        ferentem fructum, tollet eum : omnem vero, qui fert fructum, purgabit eum, ut fructum plus
        áfferat. Palmes enim infructuósus tollitur, quia peccátor fúnditus eradicátur. Palmes vero
        fructuósus purgari dicitur, quia per disciplinam reciditur ut ad uberiórem grátiam
        perducátur. Sic enim spicárum grana tribulis attrita , aristis et paleis mundántur : sic
        olívæ prelo pressæ, in ólei pinguédinem défluunt : sic botri vinearum pressi cálcibus in
        vinum liquéscunt.


        Qui manet in verbo, non fraudátur a regno. Aliter namque fructum fácere non póssumus, nisi
        in eo maneámus. Ideóque ait: Manéte in me, et ego in vobis. Ubi enim manéndum nisi in ipso ?
        Deficient domus, palátia córruent, destruéntur civitátes, ab imis sédibus turres evelléntur
        : Verbum autem Dómini manet in ætérnum. Maneámus ergo in eo, qui manet in ætérnum.


        Non sequámur vanitátem, deseréntes veritátem : nec contristémur sicut cæteri, qui spem non
        habent. sed sustineámus eum. Et si moram fécerit exspectémus, ne contingat nobis quod per
        Prophétam dícitur : Væ his qui perdidérunt sustinéntiam. Quicúmque mundánæ adversitátis
        fractus moléstiis, diabólicæ tentatiónis infestatióne dejéctus, a spe cœlestium promissiónum
        deciderit, sustinéntiæ, quam prius habúerat, mercédem amíttet : qui vero sustinébit, magnam
        reportábit remunerationem.
      en: >-
        Truth itself saith: My Father is the husbandman: and every branch in me that beareth not
        fruit, he will take away: and every one that beareth fruit, he will purge it, that it may
        bring forth more fruit. For the unfruitful branch is taken away, because the sinner is
        utterly rooted out. But the fruitful branch is said to be purged, because by discipline it
        is pruned, that it may be brought to a richer grace. So the grains of corn, beaten by the
        threshing-sledge, are cleansed of their beards and chaff; so olives, pressed in the press,
        flow down into the richness of oil; so clusters of the vineyards, pressed by the feet, melt
        into wine.


        He that abideth in the word is not defrauded of the kingdom. For otherwise we cannot bear
        fruit, unless we abide in him. And therefore he saith: Abide in me, and I in you. For where
        must we abide but in him? Houses shall fail, palaces shall fall, cities shall be destroyed,
        towers shall be uprooted from their lowest foundations: but the word of the Lord abideth for
        ever. Let us abide, therefore, in him who abideth for ever.


        Let us not follow vanity, forsaking the truth: nor be sad as others who have no hope; but
        let us wait for him. And if he delay, let us wait, lest that befall us which is spoken by
        the Prophet: Woe to them that have lost patience. Whosoever, broken by the troubles of
        worldly adversity, or cast down by the assault of diabolical temptation, shall fall from the
        hope of the heavenly promises, will lose the reward of the patience which he had before: but
        he that shall endure shall carry off a great recompense.
    status: { la: verified, en: draft }
