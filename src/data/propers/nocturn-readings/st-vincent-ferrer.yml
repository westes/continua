# Matins Nocturn 2 reading for St. Vincent Ferrer, Confessor (Apr 5).
# Sourced directly from web/www/horas/Latin/Sancti/04-05.txt,
# English/Sancti/04-05.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in the source (6-lesson office).
id: st-vincent-ferrer
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Vincentius, honesta stirpe Valentiæ in Hispania natus, ab ineunte ætate cor
        gessit senile. Qui dum caliginosi hujus sæculi labilem cursum pro ingenii sui
        modulo consideraret, religionis habitum in ordine Prædicatorum decimo octavo
        ætatis suæ anno suscepit; et emissa solemni professione, sacris litteris sedulo
        incumbens, theologiæ lauream summa cum laude consecutus est. Mox obtenta a
        superioribus licentia, verbum Dei prædicare, Judæorum perfidiam arguere,
        Saracenorum errores confutare tanta virtute et efficacia cœpit, ut ingentem
        ipsorum infiddlium multitudinem ad Christi fidem perduxerit, et multa
        Christianorum millia a peccatis ad pœnitentiam, a vitus ad virtutem revocarit.
        Electus enim a Deo, ut monita salutis in omnes gentes, tribus et linguas
        difunderet, et extremi tremendique judicii diem appropinquare ostenderet, omnium
        auditorum animos terrore concussos, atque a terrenis affectibus avulsos, ad Dei
        amórem excitabat.


        In hoc autem apostolico munere hic vitæ ejus tenor perpetuus fuit quotidie
        Missam summo mane cum cantu celebravit. Quotidie ad populum concionem habuit;
        inviolabile semper jejunium, nisi urgens adesset necessitas, servavit; sancta et
        recta consilia nulli denegavit, carnes numquam comedit, nec vestem lineam
        induit: populorum jurgia sedavit, dissidentia regna pace composuit: et cum
        vestis inconsutilis Ecclesiæ diro schismate scinderetur, ut uniretur, et unita
        servaretur, plurimum laboravit. Virtutibus omnibus claruit, suosque detractores
        et persecutores, in simplicitate et humilitate ambulans, cum mansuetudine
        recepit, et amplexus est.


        Per ipsum divina virtus, in confirmationem vitæ et prædicationis ejus, multa
        signa et miracula fecit. Nam frequentissime super ægros manus imposuit, et
        sanitatem adepti sunt: spiritus immundos e corporibus expulit: surdis auditum,
        mutis loquelam, cæcis visum restituit, leprosos mundavit, mortuos suscitavit.
        Senio tandem et morbo confectus infatigabilis Evangelii præco, plurimis Europæ
        provinciis cum ingenti animarum fructu peragratis, Venetiæ in Britannia minori
        prædicationis et vitæ cursum feliciter consummavit, anno salutis millesimo
        quadringentesimo decimo nono: quem Callistus tertius sanctorum numero ascripsit.
      en: >-
        This Vincent was born of respectable parents, at Valencia in Spain. Even as a
        child he had an heart like the heart of an old man. Considering, to the utmost of
        his young understanding, how fleeting is the course of this dark world, he, in
        the eighteenth year of his age, took the habit of a Friar in the Order of
        Preachers. After he had made his solemn profession, he devoted himself to sacred
        learning, and took the degree of Master in Divinity with much distinction. He
        soon after received permission from his superiors to preach the word of God, on
        which duty he entered with such power and success, striving against the
        unbelief of the Jews, and overthrowing the errors of the Saracens, that he
        brought an exceeding great multitude of unbelievers to believe in Christ, and
        turned many thousands of Christians from sin to sorrow, and from vice to virtue.
        He was a chosen vessel unto God to proclaim the tidings of salvation among all
        nations, and tribes, and tongues, crying out that the last day, that awful day of
        judgment, is at hand, smiting consternation into the minds of all, as many as
        heard him, weaning their love from a perishing world, and turning it to God.


        While Vincent wrought the Apostolic work of preaching committed to him, he lived
        ever as follows: Every morning he sang a solemn Mass, and every day he preached
        in public. He fasted every day, unless prevented by some absolute necessity. He
        refused to no one his holy and just advice. He never ate meat, nor wore linen. He
        quieted public disturbances, and negotiated the peace of kingdoms. When the
        seamless garment of the Church was rent by an horrid schism, he worked his every
        nerve to unite it again, and keep it one. He was a burning and a shining light of
        all virtues, walking always in lowliness and simpleness, so that he meekly
        welcomed and embraced them which spake evil against him and persecuted him.


        The Power of God confirmed his life and doctrine with many great signs and
        wonders. He often laid his hands upon the sick and they recovered. He cast out
        unclean spirits, and made the deaf to hear, the dumb to speak, and the blind to
        see. He cleansed the lepers, and raised the dead. After passing through many
        countries of Europe with exceeding profit to souls, worn out with age and
        disease, but still ever the same unwearied herald of the Gospel, he brought his
        life and his preaching together to an happy end, at Vannes in Brittany, in the
        year of salvation 1419. Pope Callistus III. numbered him with the Saints.
    status: { la: verified, en: verified }
