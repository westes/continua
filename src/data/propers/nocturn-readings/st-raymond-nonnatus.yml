# Matins Nocturn 2 reading for St. Raymond Nonnatus, Confessor
# (Aug 31). Sourced directly from web/www/horas/Latin/Sancti/08-31.txt,
# English/Sancti/08-31.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (only an
# `[Evangelium]` cross-reference) -- defers to the Common's own
# Nocturn 3, not transcribed here.
id: st-raymond-nonnatus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Raymundus, Nonnatus cognomento dictus, quia præter communem naturæ
        legem e mortuæ matris dissecto latere in lucem eductus fuit,
        Portelli in Catalaunia piis et nobilibus parentibus ortus, ab ipsa
        infantia futuræ sanctitatis indicia dedit. Nam puerilia
        oblectamenta, mundique illecebras respuens, ita pietati operam
        dabat, ut omnes in puero adultam virtutem admirarentur. Cresconte
        vero ætate, litterarum studiis incubuit: sed mox jubente patre vitam
        ruri agens, sacellum sancti Nicolai in Portelli finibus situm crebro
        adibat, ut sacram Deiparæ imaginem, quæ in eo summa fidelium
        veneratione étiam nunc colitur, visitaret. Ibi effusus in preces,
        ipsam Dei parentem, ut se in filium adoptare viamque salutis ac
        scientiam sanctorum edocere dignaretur, enixe deprecabatur.


        Nec defuit votis ejus benignissima Virgo. Ab ipsa enim intellexit
        gratissimum sibi fore, si religionem sub titulo de Mercede, seu de
        Misericordia redemptionis captivorum, ea suggerante nuper fundatam,
        ingrederetur. Qua monitione percepta, Barcinonem statim profectus,
        illud tam præcellentis erga proximum caritatis institutum amplexus
        est. Regulari igitur militiæ adscriptus, virginitatem, quam pridem
        beatæ Virgini consecraverat, perpetuo coluit, ceterisque virtutibus
        enituit, caritate præsertim erga Christianos, qui sub potestate
        paganorum miseram in captivitate vitam degebant. Hos ut redimeret,
        in Africam missus, cum jam multos a servitute liberasset, ne,
        consumpta pecunia, aliis item in proximo abnegandæ fidei discrimine
        constitutis deesset, se ipsum pignori dedit; sed cum ardentissimo
        salutis animarum desiderio succensus, plures Mahometanos suis
        concionibus ad Christum converteret, in arctam custodiam a barbaris
        conjectus, variisque suppliciis cruciatus, mox labiis perforatis et
        sera ferrea clausis, crudele martyrium diu sustinuit.


        Ob hæc et alia fortiter gesta sanctitatis ejus fama longe lateque
        diffúsa est. Qua permotus Gregorius nonus, in amplissimum sanctæ
        Romanæ Ecclesiæ Cardinalium collegium Raymundum adscripsit: sed vir
        Dei in ea dignitate ab omni pompa abhorrens, religiosæ humilitatis
        tenacissimus semper fuit. Romam vero pergens, statim ac Cardonam
        pervenit, extremo morbo confectus, ecclesiasticis sacramentis
        muniri summis precibus postulavit. Cumque morbus ingravesceret, et
        sacerdos diutius tardaret, Angelorum ministerio, sub specie
        religiosorum sui ordinis apparentium, salutari viatico refectus
        fuit. Quo sumpto, et gratiis Deo peractis, migravit ad Dominum
        Dominica ultima Augusti, anno millesimo ducentesimo quadragesimo.
      en: >-
        This Raymond is commonly called the Unborn, because his was one of
        the rare cases in which the child is not brought into the world in
        the course of nature, but by a surgical operation after the death
        of the mother. He was the son of godly and noble parents, at
        Portel, in Catalonia. The tokens of his holy after-life appeared
        even in his childhood. The things that delight children, and the
        attractions of the world, had no charm for him. He was so earnest
        in godliness that all men marvelled at his habits of premature old
        age. As he grew older, he gave himself to the study of letters,
        but, at the command of his father, turned to farming. He went
        often to the Chapel of St. Nicolas, in the suburbs of Portel, to
        visit the sacred image of the Mother of God, which is still sought
        with great tenderness by the faithful. There he poured forth his
        soul in prayer, and earnestly entreated the Mother of God herself
        to be pleased to take him for her son, to show him the way wherein
        it should be safe for him to walk, and to teach him the science of
        the Saints.


        And the most gracious Maiden was not deaf to his prayers. From her
        he understood that it would please her right well, if he would
        join the Religious Order which had just been founded at her own
        inspiration, styled of Ransom or of Mercy, for buying up and
        freeing slaves. As soon as he had received this intimation from
        her, he went to Barcelona, and entered the Institute so nobly
        dedicated to love for our neighbour. Once enlisted in the Regular
        Army, he guarded unspotted for ever the virginity which he had
        already consecrated to the Blessed Virgin for ever. But he was a
        bright and shining light of all other good words and works,
        especially of tender compassion for Christians who were passing a
        life of grievous bondage in the possession of unbelieving masters.
        To free such he was sent into Africa, and delivered many. But his
        money ran short, and as there were still many in imminent danger of
        denying the faith, he pawned himself. He was enkindled with a most
        vehement longing for the salvation of souls, and by his
        exhortations brought diverse Mohammedans to Christ. The Moors
        therefore threw him into close prison, and put him to diverse
        tortures, at last making holes through his lips and locking them
        together with an iron padlock, which horrid cruelty he long bore.


        The account of these, and other brave things that he did, he got
        the name of a Saint far and wide. Gregory IX. was moved thereby to
        make Raymond a Cardinal of the Holy Roman Church, but in this place
        of honour the man of God shrank from all outward show, and clung
        ever tightly to the lowliness that beseemeth a Religious man. He
        had started for Rome, but had only got as far as Cardona, when he
        was seized with his last illness, and earnestly called for the
        strengthening Sacraments of the Church. But his position became
        critical, and the Priest had not arrived. Then Angels came unto
        him, clad in the habit of his own Order, and ministered unto him
        the wholesome Provision for the last journey. When he had taken
        It, he gave God thanks, and departed hence to be ever with the
        Lord. It was the last Lord's Day in August, 1240.
    status: { la: verified, en: verified }
