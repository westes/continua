# Nocturn 2-3, 6th Sunday after Pentecost. Sourced from Tempora/Pent06-0.txt.
# See post-pentecost-02.yml for sweep method/responsory-reuse note.
# Nocturn 2: St. Ambrose, Apology of David, on David's repentance - one
# continuous excerpt (Lectio4-6). Nocturn 3: Lectio7 bare incipit (Mark
# 8:1-9, feeding of the four thousand) skipped; Lectio8-9 one continuous
# homily by St. Ambrose on Luke, combined.
id: post-pentecost-06
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, Apology of David, ch. 1-2"
    text:
      la: >-
        Unusquísque nostrum per síngulas horas quam multa delínquit! nec tamen unusquísque de plebe
        peccátum suum confiténdum putat. Ille rex, tantus ac potens, ne exíguo quidem moménto manére
        penes se delícti passus est consciéntiam; sed, præmatúra confessióne atque imménso dolóre,
        réddidit peccátum suum Dómino. Quem mihi nunc fácile repérias honorátum ac dívitem, qui, si
        arguátur alicújus culpæ reus, non moléste ferat? At ille régio clarus império, tot divínis
        probátus oráculis, cum a priváto hómine corriperétur quod gráviter deliquísset, non indignátus
        infrémuit, sed conféssus ingémuit culpæ dolóre.


        Dénique Dóminum dolor íntimi movit afféctus, ut Nathan díceret: Quóniam pœnítuit te, et Dóminus
        ábstulit peccátum tuum. Matúritas ítaque véniæ, profúndam regis fuísse pœniténtiam declarávit,
        quæ tanti erróris offénsam tradúxerit. Alii hómines cum a sacerdótibus corripiúntur, peccátum
        suum íngravant, dum negáre cúpiunt aut deféndere; ibíque eórum lapsus est major, ubi sperátur
        corréctio. Sancti autem Dómini, qui consummáre pium certámen géstiunt, et cúrrere cursum salútis,
        sícubi forte ut hómines corrúerint, natúræ magis fragilitáte quam peccándi libídine, acrióres ad
        curréndum resúrgunt, pudóris stímulo majóra reparántes certámina.


        Peccávit David, quod solent reges; sed pœniténtiam gessit, flevit, ingémuit, quod non solent
        reges. Conféssus est culpam, obsecrávit indulgéntiam, humi stratus deplorávit ærúmnam, jejunávit,
        orávit, confessiónis suæ testimónium in perpétua sǽcula vulgáto dolóre transmísit. Quod
        erubéscunt fácere priváti, rex non erúbuit confitéri. Qui tenéntur légibus, audent suum negáre
        peccátum, dedignántur rogáre indulgéntiam, quam petébat qui nullis légibus tenebátur humánis. Quod
        peccávit, conditiónis est; quod supplicávit, correctiónis. Lapsus commúnis, sed speciális
        conféssio. Culpam ítaque incidísse, natúræ est: diluísse, virtútis.
      en: >-
        In how many things doth each one of us transgress every hour! And nevertheless not one of all
        us common men thinketh it well to confess his sin. Yet that strong and great King would not
        suffer the acknowledgment of his iniquity to remain, even for a moment, hidden in his own heart.
        With eager confession and bitter sorrow, he admitted that he had sinned against the Lord. Which
        of you will easily find me now some honoured and wealthy person, who will not take it ill if I
        rebuke him for a fault whereof he is guilty? But David, amid the splendours of a throne and the
        certainty of Divine revelations, when he was rebuked by one of his subjects for his grievous
        transgression, was not roused to anger, but contrariwise, acknowledged his sin with groans and
        affliction.


        The heart-felt sorrow of David moved the Lord to compassion, so that Nathan said Because thou
        hast repented, the Lord also hath put away thy sin. The instant gift of pardon declareth the
        depth of the King's repentance, which was able to obtain the forgiveness of so grievous a
        transgression. Other men, when they be rebuked of Priests, do but aggravate the heinousness of
        their sins by the seeking to deny or to excuse them, and thereby make deeper their fall by means
        of that which should have helped them up. But the saints of the Lord who will to fight a good
        fight of godliness unto the end and to finish their course by saving their souls, howbeit, they
        may perchance have fallen like other men, have done so rather through man's weakness than
        through lust for iniquity, and rise more eager to go on than before. Shame goadeth them on to
        fly at higher things.


        David sinned; and so oftentimes do other kings. David repented with groaning and tears; and so
        do not oftentimes other kings. He admitted his guilt; he implored forgiveness; he cast himself
        down upon the ground, and there wept over his crime; he fasted; he prayed; by publishing his
        sorrow he left an everlasting witness of his acknowledgment. What meaner men blush to do, the
        King was not ashamed to own. They who are answerable to law are bold to deny their crimes, and
        too haughty to ask pardon. Not so he, though he could be haled before no earthly judgment-seat.
        That he sinned was a matter flowing from his nature; that he asked for pardon, his own
        repentance. To fall is common to all men, but his confession was his own. To transgress thus was
        nature; to efface his guilt, greatness.
    responsory:
      la: "R. Percússit Saul mille, et David decem míllia: * Quia manus Dómini erat cum illo: percússit Philisthǽum, et ábstulit oppróbrium ex Israël.\nV. Nonne iste est David, de quo canébant in choro, dicéntes: Saul percússit mille, et David decem míllia?\nR. Quia manus Dómini erat cum illo: percússit Philisthǽum, et ábstulit oppróbrium ex Israël."
      en: "R. Saul hath slain his thousands, and David his ten thousands. * Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.\nV. Is not this David? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, and David his ten thousands?\nR. Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, on Luke, Book 6, ch. 9"
    text:
      la: >-
        Posteáquam illa, quæ Ecclésiæ typum accépit, a fluxu curáta est sánguinis, posteáquam Apóstoli ad
        evangelizándum regnum Dei sunt destináti, grátiæ cæléstis impartítur aliméntum. Sed quibus
        impartiátur, advérte. Non otiósis, non in civitáte, quasi in synagóga vel sæculári dignitáte
        residéntibus; sed inter desérta quæréntibus Christum. Qui enim non fastídiunt, ipsi excipiúntur a
        Christo, et cum ipsis lóquitur Dei Verbum, non de sæculáribus, sed de regno Dei. Et si qui
        corporális gerunt úlcera passiónis, his medicínam suam libénter indúlget.


        Cónsequens ígitur erat, ut quos a vúlnerum dolóre sanáverat, eos alimóniis spiritálibus a jejúnio
        liberáret. Itaque nemo cibum áccipit Christi, nisi fúerit ante sanátus; et illi qui vocántur ad
        cœnam, prius vocándo sanántur. Si claudus fuit, gradiéndi facultátem, ut veníret, accépit: si
        lúmine oculórum privátus, domum útique Dómini, nisi refúsa luce, intráre non pótuit.


        Ubíque ígitur mystérii ordo servátur, ut prius per remissiónem peccatórum vulnéribus medicína
        tribuátur, post alimónia mensæ cæléstis exúberat; quamquam nondum validióribus hæc turba
        reficiátur aliméntis, neque Christi córpore et sánguine jejúna solidióris fídei corda pascántur.
        Lacte, inquit, vos potávi, non esca; nondum enim poterátis, sed nec adhuc quidem potéstis. In
        modum lactis quinque sunt panes: esca autem solídior, corpus est Christus; potus veheméntior,
        sanguis est Dómini.
      en: >-
        After that woman, who is a type of the Church, was healed of the issue of blood (Luke viii.
        43-48); the Lord had sent His disciples to preach the kingdom of God (ix. 2). His heavenly
        tenderness gave food. But consider who they were unto whom He gave it. He gave it not to such as
        dwell at ease, not to men in cities, not to such as sit in places of worldly splendour, but to
        men seeking Christ in a desert place. Such as are not given to niceness are they whom Christ
        receiveth, and unto whom the Word of God speaketh, not of earthly things, but of the kingdom of
        God (11). And if any bear in them the running sores of fleshly passion, He healeth them.


        And then it came to pass that, as He had healed them that had need of healing, He fed their
        hunger with ghostly meat. Thus it is that no man taketh Christ's meat, unless he be first healed,
        and they, that are bidden to the supper, are first cured by the invitation. The lame receive the
        power to walk, that they may be able to come; the blind cannot see the door of the house of the
        Lord, unless light be given them.


        Everywhere is preserved the order of the Sacraments. The sinful soul is first healed by the
        remission of sins, and afterward is filled at the Table of the Lord albeit this multitude now
        present is of such as do not yet feed on those strong meats, nor pasture their starving spirits
        upon the Body and Blood of Christ, as do they of a manlier faith. To use the words of Paul, I
        have fed you with milk and not with meat, for hitherto ye were not able to bear it, neither yet
        now are ye able (1 Cor. iii. 2). The five loaves are, as it were, your milk; the stronger meat
        will be the Body of Christ; the more generous cup, the Blood of the Lord.
    responsory:
      la: "R. Duo Séraphim clamábant alter ad álterum: * Sanctus, sanctus, sanctus Dóminus Deus Sábaoth: * Plena est omnis terra glória ejus.\nV. Tres sunt qui testimónium dant in cælo: Pater, Verbum, et Spíritus Sanctus: et hi tres unum sunt.\nR. Plena est omnis terra glória ejus."
      en: "R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.\nV. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.\nR. The whole earth is full of His glory."
    status: { la: verified, en: verified }
