# Matins Nocturn 2 reading for St. Nicomedes, Martyr (Sep 15). Sourced
# from web/www/horas/Latin/Sancti/09-15cc.txt, English/Sancti/09-15cc.txt.
# The source carries only a single short lesson (Lectio93), transcribed
# whole as one Nocturn 2 reading, same "short/single source lesson"
# handling as st-gorgonius.yml.
id: st-nicomedes
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Nicomédes presbyter, persequénte Christiános Domitiáno imperatóre, quod corpus Felículæ
        Vírginis, propter confessiónem christiánæ fídei a Flacco cómite interféctæ, sepelísset,
        comprehéndi jussus est; ductúsque ad státuas deórum, cum eis sacrificáre velle (quod fácere
        jubebátur) constánter negavísset, proptérea quod sacrifícium uni Deo vero, qui regnat in
        cælis, deberétur, plumbátis cæsus, in eo martýrio ánimam Deo réddidit. Cujus corpus cum
        idem comes in profluéntem Tíberim projíci imperásset, Justus, Nicomédis clericus dilígenter
        conquisítum, ad muros Urbis via Nomentána honorífice in sepúlcro cóndidit.
      en: >-
        Nicomedes was a priest who was ordered to be seized during the persecution of the
        Christians by the Emperor Domitian, because he had buried the body of the Virgin Felicula,
        who had been slain by the Count Flaccus for confessing the Christian Faith. He was led to
        the statues of the gods, and forasmuch as he steadfastly refused to sacrifice to them, as
        he was commanded, since sacrifice is due only to the one true God who reigneth in heaven,
        he was beaten with scourges loaded with lead until, by that martyrdom, he gave up his soul
        to God. When the same Count ordered his body to be thrown into the flowing Tiber, Justus,
        a clerk of Nicomedes, diligently sought it out and buried it honorably in a tomb by the
        walls of the City, along the Via Nomentana.
    status: { la: verified, en: verified }
