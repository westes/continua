# Matins Nocturn 2-3 readings for St. James the Greater, Apostle (Jul
# 25) — SanctiM/07-25.txt's own Lectio5-9 resolve back to
# `@Sancti/07-25:LectioN` (resliced; Lectio4 falls back to Common of
# an Apostle), so this saint's own proper content is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-25.txt, English/Sancti/07-25.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous
# account.
# Nocturn 3: Lectio7's Gospel citation (Matt 20:20-23) was previously a
# bare incipit ("Et réliqua") with only the homily authored, a single
# excerpt of St. John Chrysostom's homily. No responsory given for
# either reading.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily). This feast's own
# Missale Evangelium (missa/Latin/Sancti/07-25.txt) redirects to
# `@Sancti/05-06` (St. John before the Latin Gate's own Missale Gospel is
# reused verbatim for this day) — sourced from missa/Latin+English/
# Sancti/05-06.txt, not guessed at.
id: st-james-the-greater
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Jacóbus, Zebedǽi fílius, Joánnis Apóstoli germánus frater, Galilǽus, inter primos
        Apóstolos vocátus cum fratre, relíctis patre ac rétibus, secútus est Dóminum, et ambo ab
        ipso Jesu Boanérges, id est, tonítrui fílii sunt appelláti. Is unus fuit ex tribus
        Apóstolis, quos Salvátor máxime diléxit, et testes esse vóluit suæ transfiguratiónis,
        et interésse miráculo cum archisynagógi fíliam a mórtuis excitávit, et adésse cum
        secéssit in montem Olivéti, Patrem oratúrus, ántequam a Judǽis comprehenderétur.


        Post Jesu Christi ascénsum in cælum, in Judǽa et Samaría ejus divinitátem prǽdicans,
        plúrimos ad christiánam fidem perdúxit. Mox in Hispániam proféctus, ibi áliquos ad
        Christum convértit; ex quorum número septem póstea epíscopi a beáto Petro ordináti in
        Hispániam primi dirécti sunt. Deínde Jerosólymam revérsus, cum inter álios Hermógenem
        magum fídei veritáte imbuísset, Heródes Agríppa Cláudio imperatóre ad regnum elátus ut
        a Judǽis grátiam iníret, Jacóbum líbere Jesum Christum Deum confiténtem cápitis
        condemnávit. Quem cum is, qui eum dúxerat ad tribúnal, fórtiter martýrium subeúntem
        vidísset, statim se et ipse Christiánum esse proféssus est.


        Ad supplícium cum raperéntur, pétiit ille a Jacóbo véniam; quem Jacóbus osculátus, Pax,
        inquit, tibi sit. Itaque utérque est secúri percússus, cum paulo ante Jacóbus
        paralýticum sanásset. Corpus ejus póstea Compostéllam translátum est, ubi summa
        celebritáte cólitur, conveniéntibus eo religiónis et voti causa ex toto terrárum orbe
        peregrínis. Memória ipsíus natális hodiérno die, qui translatiónis dies est, ab
        Ecclésia celebrátur, cum ipse circa festum Paschæ, primus Apostolórum Jerosólymis
        profúso sánguine testimónium Jesu Christo déderit.
      en: >-
        James, the Son of Zebedee and brother of the Apostle John, was a Galilean, and with his
        brother one of the first of His Apostles whom the Lord called, whileas they were in a
        ship with Zebedee their father, mending their nets, and they immediately left the ship,
        and their father, and followed Him. And He surnamed them Boanerges, which is, The sons
        of thunder. Peter, and James, and John, were the three Apostles whom the Saviour loved
        best; them He took and brought up into an high mountain apart, and was transfigured
        before them; when He went to the house of the ruler of the synagogue to raise his
        daughter from the dead, He suffered no man to follow Him save Peter, and James, and John;
        and, at the last, just before the Jews took Him, when He cometh unto a place called
        Gethsemane, and saith unto the disciples: Sit ye here, while I go and pray yonder. He took
        with Him Peter and the two sons of Zebedee.


        After that Jesus Christ was ascended into heaven, James preached how that He was God,
        and led many in Judaea and Samaria to the Christian Faith. A while afterward, he went to
        Spain, and there he brought some to Christ, of whom seven were afterwards ordained
        Bishops by Blessed Peter, and were the first such sent into that country. From Spain
        James went back to Jerusalem, where he taught the Faith to diverse persons, and, among
        others, to the Magician Hermogenes. Thereupon Herod Agrippa, who had been raised to the
        kingdom under the Emperor Claudius, to curry favour with the Jews, condemned James to
        death for his firm confession that Jesus Christ is God. The officer who led James to the
        judgment-seat, at sight of the courage wherewith he was ready to offer up his testimony,
        declared himself also to be a Christian.


        As they were being hurried to execution, this man asked pardon of James, and the
        Apostle kissed him, saying, Peace be unto thee. James healed a paralytic, and immediately
        afterwards both the prisoners were beheaded. The body of the Apostle was afterwards taken
        to Compostella, where his grave is very famous. Multitudes of pilgrims from all parts of
        the earth betake themselves thither to pray, out of sheer piety or in fulfilment of
        vows. The Birthday of James is kept by the Church upon this day, which is that of the
        bringing of his body to Compostella. It was about Easter-time that he bore witness to
        Jesus Christ with his blood, at Jerusalem, being the first of the Apostles to do so.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 20:20-23", en: "Matt 20:20-23" }
    text:
      la: >-
        In illo témpore: Accéssit ad Jesum mater filiórum Zebedǽi cum fíliis suis, adórans et petens
        áliquid ab eo. Qui dixit ei: Quid vis? Ait illi: Dic, ut sédeant hi duo fílii mei, unus ad
        déxteram tuam, et unus ad sinístram in regno tuo. Respóndens autem Jesus, dixit: Néscitis,
        quid petátis. Potéstis bíbere cálicem, quem ego bibitúrus sum? Dicunt ei: Póssumus. Ait
        illis: Cálicem quidem meum bibétis: sedére autem ad déxteram meam vel sinístram, non est
        meum dare vobis, sed quibus parátum est a Patre meo.
      en: >-
        At that time, the mother of the sons of Zebedee came to Jesus with her sons, adoring and
        asking something of Him. And He said to her: What wilt thou? She saith to Him: Say that
        these my two sons may sit, the one on Thy right hand and the other on Thy left, in Thy
        kingdom. And Jesus answering, said: You know not what you ask. Can you drink the chalice
        that I shall drink? They say to Him: We can. He saith to them: My chalice indeed you shall
        drink; but to sit on My right hand or left is not Mine to give to you, but to them for whom
        it is prepared by My Father.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. John Chrysostom, Homily 66 on Matthew (on Matt 20:20-23)"
    text:
      la: >-
        Non turbétur quisquam, si ádeo imperféctos dícimus Apóstolos fuísse; nondum enim
        mystérium crucis erat consummátum, nondum grátia Spíritus in corda ipsórum infúsa. Quod
        si virtútem ipsórum díscere cupis, quales post datam grátiam Spíritus fúerint,
        consídera, et vidébis omnem ab illis pervérsam affectiónem fuísse superátam. Hac enim de
        causa eórum modo imperféctio revelátur, ut apérte percípere possis quales súbito per
        grátiam effécti fuérunt. Quod ígitur nihil spiritále petébant nec de cælésti regno
        quidquam cogitábant, perspícuum est. Sed tamen inspiciámus étiam quómodo accédant et
        quid dicant. Vólumus, ínquiunt, ut, quodcúmque petiérimus, fácias nobis. Ad quod
        Christus, Quid vultis? respóndit: non ignórans certe, sed ut eos respondére cogat et
        ulcus détegat, et ita medicaméntum appónat.
      en: >-
        Let no man be troubled if we say that the Apostles were still imperfect, for the mystery
        of the Cross was not yet finished, the grace of the Spirit had not yet been shed abroad
        in their hearts. If thou wilt behold them in their strength, consider them such as they
        became after the grace of the Spirit was given them, and thou wilt perceive that they
        had trodden under foot every vain desire. This is the cause wherefore their present
        imperfection is made known unto us, that is, that thou mayest see how great a change
        could be forthwith wrought by grace. But nevertheless let us now look how they came unto
        Christ, and what they said. Master, they said, we would that Thou shouldest do for us
        whatsoever we shall desire. And He said unto them: What would ye that I should do for
        you? not, surely, that He knew not what their wish was, but that He would make them
        answer, and so uncover the wound, to lay a plaster upon it.
    status: { la: verified, en: verified }
