# Matins Nocturn 2 reading for St. Francis de Sales, Bishop, Confessor,
# Doctor of the Church (Jan 29). Sourced directly from
# web/www/horas/Latin/Sancti/01-29.txt, English/Sancti/01-29.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No Lectio7-9 in the source at all (a 6-lesson, not
# 9-lesson, office for this feast).
id: st-francis-de-sales
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Franciscus in oppido Salesio, unde famíliæ cognomen, piis et nobílibus paréntibus
        natus, a téneris annis futuræ sanctitátis indícia præbuit, morum innocéntia et
        gravitáte. Adoléscens liberálibus disciplinis eruditus, mox philosophíæ ac theologíæ
        Parisiis operam dedit; et, ne quid sibi deésset ad animi culturam, juris utriusque
        lauream summa cum laude Patavii obtinuit. In sacra æde Lauretana perpetuæ
        virginitátis votum, quo pridem Parisiis se obstrinxerat, innovávit; a cujus virtútis
        proposito nullis umquam dæmonum fraudibus, nullis sensuum illécebris pótuit
        dimoveri.


        Recusáta in Sabáudiæ senatu amplíssima dignitate, clericali milítiæ nomen dedit. Tum
        sacerdotio initiátus et Genevénsis ecclésiæ præposituram adeptus, ejus muneris
        partes adeo perfecte explevit, ut eum Granerius epíscopus vindicándis ab hæresi
        Calviniana Chaballicensibus aliisque Genevæ finitimis pópulis, divini verbi
        præcónem destinarit. Quam expeditiónem álacri animo suscípiens, asperrima quæque
        perpéssus est, sæpe ab hæréticis conquisítus ad necem, variisque calumniis et
        insídiis vexatus. Sed inter tot discrímina et agones, insuperábilis ejus constántia
        semper enituit; Deique ope protectus, septuagínta duo míllia hæreticórum ad
        catholicam fidem reduxísse dícitur, inter quos multi nobilitate et doctrina
        insignes numerántur.


        Mortuo Granerio, qui eum sibi coadjutórem decerni curáverat, epíscopus consecratus,
        sanctitátis suæ radios circumquaque diffudit, zelo ecclesiásticæ disciplinæ, pacis
        studio, misericórdia in páuperes, omnique virtúte conspicuus. Ad divini cultus
        augméntum novum ordinem sanctimoniálium instituit, a Visitatióne beátæ Vírginis
        nuncupátum, sub regula sancti Augustíni; cui addidit constitutiónes sapiéntia,
        discretióne et suavitáte mirábiles. Suis étiam scriptis cælésti doctrina refertis
        Ecclésiam illustrávit, quibus iter ad christianam perfectiónem tutum et planum
        demonstrat. Annum denique agens quinquagesimum quintum, dum e Gállia Annesium
        regréditur, post Sacrum in die sancti Joánnis Evangelistæ Lugduni celebrátum, gravi
        morbo correptus, sequénti die migrávit in cælum, anno Dómini millesimo sexcentésimo
        vigesimo secundo. Ejus corpus Annesium delátum, in ecclésia moniálium dicti ordinis
        honorifice cónditum fuit, cœpitque statis miraculis claréscere. Quibus rite
        probátis, ab Alexandro septimo Pontifice máximo in Sanctórum númerum relátus est,
        assignáta ejus festivitáti die vigesima nona Januarii; et a summo Pontifice Pio
        nono, ex sacrórum Rituum Congregatiónis consulto, universalis Ecclésiæ Doctor fuit
        declaratus.
      en: >-
        Francis was born of godly and noble parents, in the town of Sales, from which his
        family take their name of de Sales. In his childish years his staid and godly
        demeanour gave promise of his future sanctity. He received a liberal education as he
        grew up, and afterwards studied Philosophy and Theology at Paris. In order to the
        complete furnishing of his mind, he took the degree of Doctor of Laws, both Civil and
        Ecclesiastical, at Padua, with much distinction. He had already bound himself with a
        vow of perpetual virginity at Paris, and he renewed the same in the Holy House of
        Loreto. From this path of virtue, neither the temptations of the devil nor the
        allurements of the world ever induced him to depart.


        He refused to be made Counsellor of the Parliament of Chambery, for which his family
        had obtained for him patents from the Duke of Savoy, and determined to become a
        clergyman. He was appointed to the Provostship of the Church of Geneva, and, being
        shortly afterwards ordained Priest, discharged so admirably the duties of his
        position, that he was sent by Granier, his Bishop, to preach the word of God in
        Chablais, and other places in the outskirts of the diocese, where the inhabitants had
        embraced the heresy of Calvin. He joyfully undertook this mission, in which he
        suffered much, being often hunted by the Protestants to murder him, and assailed by
        many calumnies and plots. Amid all these dangers and struggles his constancy remained
        invincible, and under the blessing and care of God he is said to have recalled
        seventy-two thousand of these heretics to the Faith of Christ's Universal Church,
        among whom were many distinguished by rank and learning.


        After the death of Bishop Granier, who had procured his appointment as Coadjutor, he
        was consecrated Bishop. In that office he was truly a burning and a shining light,
        showing all around a bright example of godliness, zeal for the discipline of the
        Church, ardent love of peace, tenderness to the poor, and, indeed, of all graces. For
        the greater ornament of God's worship he established a new Order of Nuns, which is
        named from the Visitation of the Blessed Virgin. These nuns follow the Rule of St.
        Augustine, but Francis added thereto several additional constitutions distinguished by
        wisdom, prudence, and tenderness. He enlightened the Church by writings full of
        heavenly teaching, and pointing out a safe and simple road to Christian perfection. In
        the 55th year of his age, while on his way from France to Annecy, after saying mass at
        Lyons on the Feast of St. John the Evangelist, he was seized with fatal illness, and on
        the next day passed from earth to heaven, in the year of our Lord 1622. His body was
        carried to Annecy and honourably buried in the Church of the nuns of the Visitation,
        where it soon began to be distinguished for miracles. The truth of these having been
        proved, the Supreme Pontiff, Alexander VII., enrolled his name among those of the
        Saints, and appointed for his Feast-day the 29th of January. And the Supreme Pontiff,
        Pius IX., on the advice of the Congregation of Sacred Rites, declared him a Doctor of
        the Universal Church.
    status: { la: verified, en: verified }
