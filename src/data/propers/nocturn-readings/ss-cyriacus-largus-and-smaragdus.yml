# Matins Nocturn 2-3 readings for Ss. Cyriacus, Largus, and
# Smaragdus, Martyrs (Aug 8) — SanctiM/08-08.txt bases `@Sancti/08-08`
# (the whole day, no Nocturn 2/3 override) but narrows the Officium to
# Cyriacus alone, the same "Monastic office narrows a joint feast"
# pattern already seen for several other saints this pass (e.g.
# `ss-vincent-and-anastasius.yml`) — the full three-martyr text is
# used here per vu-prefer-text-over-missing (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/08-08.txt, English/Sancti/08-08.txt.
#
# Nocturn 2: Lectio4 (the martyrs' vita) and Lectio5-6 (St. John
# Chrysostom's sermon, a genuinely distinct patristic source) kept
# split.
# Nocturn 3: Lectio7's Gospel citation (Mark 16:15-18) is a bare
# incipit ("Et réliqua") with no full pericope text given, so — per
# the pre-1955 pass's convention of not transcribing bare incipits —
# only the homily portion was originally authored (not marked
# isGospel), combined with Lectio8-9 as one continuous excerpt of Pope
# St. Gregory the Great's homily. No responsory given for either.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before Gregory's homily) — sourced from
# the day's own Missale [Evangelium] in
# web/www/missa/Latin/Sancti/08-08.txt (full text given there, not a
# redirect).
id: ss-cyriacus-largus-and-smaragdus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Cyríacus diaconus, cum Sisinio, Largo et Smaragdo diutius inclusus in carcere, multa
        édidit miracula, in quibus Arthémiam Diocletiáni filiam precibus a dæmone liberávit;
        missusque ad Saporem Persárum regem, Jobíam étiam ejus filiam a nefario spíritu
        erípuit. Rege vero ejus patre cum quadringentis ac trigínta aliis baptizatis, Romam
        rediit; ubi, Maximiáni imperatóris jussu comprehénsus, catenis vinctus ante rhedam
        suam tráhitur; et post dies quatuor e carcere edúctus, pice liquáta perfusus et in
        catasta exténsus, demum cum Largo et Smaragdo aliisque viginti secúri percússus est via
        Salaria, ad hortos Sallustiános. Quorum córpora in eádem via décimo septimo Kalendas
        Aprilis sepúlta a Joánne presbytero, póstea sexto Idus Augusti a Marcello Pontifice et
        Lucina nobili femina lineis velis involuta et pretiósis unguentis condíta, in ipsíus
        Lucinæ prædium via Ostiénsi, septimo ab Urbe lápide transláta sunt.
      en: >-
        Cyriacus the Deacon was long kept in prison with Sisinius, Largus, and Smaragdus, and
        wrought many wonderful works. Among other things he by his prayers freed from a devil
        Arthemia, a daughter of Diocletian, and, being sent to Sapor, King of the Persians, also
        delivered his daughter Jobia from a foul spirit. He baptized the king, her father, and
        four hundred and thirty others, and afterwards returned to Rome. He was arrested by
        command of the Emperor Maximian, and dragged in chains before his chariot. Then after
        four days he was brought forth from prison, had boiling pitch poured upon him, was
        stretched on a block, and at last was slain with the axe, along with Largus, Smaragdus,
        and twenty others, at the gardens of Sallust, on the Salarian Way. On this Way were their
        bodies buried by John the Priest, but afterwards, on the 8th of August, Pope Marcellus and
        the noble lady Lucina took them and wrapped them in linen, and embalmed them with costly
        ointments, and carried them to the farm belonging to the said lady Lucina, at the seventh
        milestone from Rome on the road to Ostia.
    status: { la: verified, en: verified }

  - nocturn: 2
    isGospel: false
    source: "St. John Chrysostom, Sermon 1 on the Martyrs"
    text:
      la: >-
        Nemo est, qui nesciat, Mártyrum glorias ad hoc divino consílio a Dei pópulis
        frequentári, ut et illis débitus honor dicétur, et nobis virtútis exémpla, favénte
        Christo, monstréntur; ut, dum hæc ita celebrári perspícimus, cognoscámus quanta eos
        glória máneat in cælis, quorum natalítia táliter celebrántur in terris; quo possímus,
        étiam ipsi, tálibus provocári exémplis, virtúte pari, devotióne consímili ac fide; ut,
        Christo præstánte, dimicáre et víncere hostem possímus, ut, parta victória, cum iísdem
        Sanctis in regnis cæléstibus triumphémus.


        Quis est enim, qui eórum volens mérito copulári, nisi prius constántiam eórum téneat,
        sectétur fidem, imitétur virtútem passiónis; eórum glóriam páribus vitæ lineaméntis aut
        invéniat aut exquírat? Qui, etsi martýrio par esse non possit, tamen múneris tanti
        dignitáte se quisque bonis áctibus dignum præbeat. Adest enim clementíssimus Deus, qui
        desiderántibus suis aut martýrium præbeat, aut, sine martýrio, cum Sanctis præmia
        divína retríbuat.
      en: >-
        Every man knoweth how, by the good Providence of God, the diverse glories of His
        Martyrs are held in such esteem by His people, that the same His Saints in all places
        receive worthy honour, and before us is set, by the favour of Christ, the noble example
        of their courage: thus are we stirred up to consider, on the occasion of these Holidays,
        how great glory doth abide them in heaven, whose birthdays are thus kept upon earth:
        thereby, also, we are roused to strive to be like them, brave, godly, and true: so that,
        in the strength of Christ, we, like them, may wrestle with, and conquer our enemy, and,
        when we have gained the same victory that they gained, may with them at last be glorified
        in the kingdom of heaven.


        For what man is there willing to share their reward, that if he do not first lay hold on
        their steadfastness, follow after the example of their faith, and imitate their brave
        patience, can either seek or find their glory by likeness to their lives? But whosoever
        doth so follow them, let him not doubt but that, though in very deed he gain not the
        crown of martyrdom, he is yet able by good works to make himself meet therefor. For we
        have a most merciful God, Which either giveth Martyrdom unto such as be willing, or,
        without Martyrdom, doth make them joint heirs with the Saints in the kingdom of God.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Marc 16:15-18", en: "Mark 16:15-18" }
    text:
      la: >-
        In illo témpore: Dixit Jesus discípulis suis: Eúntes in mundum univérsum, prædicáte
        Evangélium omni creatúræ. Qui credíderit, et baptizátus fúerit, salvus erit: qui vero
        non credíderit, condemnábitur. Signa autem eos, qui credíderint, hæc sequéntur: In
        nómine meo dæmónia ejícient: linguis loquéntur novis: serpéntes tollent: et si
        mortíferum quid bíberint, non eis nocébit: super ægros manus impónent, et bene habébunt.
      en: >-
        At that time, Jesus said to His disciples, "Go into the whole world and preach the
        gospel to every creature. He who believes and is baptized shall be saved, but he who
        does not believe shall be condemned. And these signs shall attend those who believe: in
        My name they shall cast out devils; they shall speak in new tongues; they shall take up
        serpents; and if they drink any deadly thing, it shall not hurt them; they shall lay
        hands upon the sick and they shall get well."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "Pope St. Gregory the Great, Homily 29 on the Gospels (on Mark 16:15-18)"
    text:
      la: >-
        Potest omnis creaturæ nómine omnis natio Géntium designari. Ante enim dictum fuerat: In
        viam Géntium ne abieritis; nunc autem dícitur: Prædicate omni creaturæ: ut scilicet
        prius a Judǽa Apostolórum repulsa prædicátio tunc nobis in adjutórium fieret, cum hanc
        illa ad damnatiónis suæ testimónium superba repulísset. Sed cum discipulos ad
        prædicándum Véritas mittit, quid aliud in mundo facit, nisi grana séminis spargit? Et
        pauca grana mittit in semine, ut multárum messium fruges recipiat ex nostra fide.


        Neque étenim in universo mundo tanta fidelium messis exsúrgeret, si de manu Dómini
        super rationalem terram illa electa grana prædicántium non venissent. Sequitur: Qui
        crediderit et baptizátus fúerit, salvus erit: qui vero non credíderit, condemnábitur.
        Fortasse unusquísque apud semetípsum dicat: Ego jam credidi, salvus ero. Verum dicit, si
        fidem opéribus tenet. Vera étenim fides est, quæ in hoc, quod verbis dicit, móribus non
        contradicit. Hinc est enim quod de quibusdam falsis fidelibus Paulus dicit: Qui
        confiténtur se nosse Deum, factis autem negant.


        Signa autem eos qui credituri sunt, hæc sequéntur: In nómine meo dæmónia ejícient,
        linguis loquéntur novis, serpéntes tollent: et si mortíferum quid bíberint, non eis
        nocébit: super ægros manus impónent, et bene habébunt. Numquidnam, fratres mei, quia
        ista signa non fácitis, minime creditis? Sed hæc necessaria in exordio Ecclésiæ fuérunt.
        Ut enim ad fidem crésceret multitúdo credéntium, miraculis fuerat nutriénda: quia et
        nos, cum arbústa plantamus, tamdiu eis aquam infúndimus, quoúsque ea in terra jam
        coaluisse videámus: et si semel radícem fíxerint, irrigátio cessabit. Hinc est enim quod
        Paulus dicit: Linguæ in signum sunt non fidelibus, sed infidelibus.
      en: >-
        By the words every creature we may understand every tribe of the Gentiles. Of aforetime
        it had been said, Go not into the way of the Gentiles, but now, Preach the Gospel to
        every creature, that, since the Jews had proudly rejected the preaching of the Apostles,
        that might become our gain which was the seal of their condemnation. But when the
        Eternal Truth sendeth forth His disciples to preach, what doth He but scatter seed over
        the field of the world? He scattered abroad a few grains for seed, that He may afterward
        reap an abundant harvest in our faith.


        The great harvest of faithful souls throughout the whole world would never have sprung
        up, if the hand of the Lord had not first scattered those chosen grains of preachers
        over the reasonable soil of men's minds. Then is written, He that believeth and is
        baptized shall be saved; but he that believeth not shall be damned. Now, perchance, thou
        sayest in thine heart: I believe, and therefore I shall be saved. True, if to thy faith
        thou dost add works. He only hath a living faith whose life doth not give the lie to his
        profession. It is of this that Paul speaketh, where he saith of certain vain believers,
        They profess that they know God but in works they deny Him.


        And these signs shall follow them that believe: In My name they shall cast out devils,
        they shall speak with new tongues, they shall take up serpents; and if they drink any
        deadly thing, it shall not hurt them; they shall lay hands on the sick, and they shall
        recover. My brethren, these signs do not follow us. Do we, then, not believe? Nay. The
        truth is, these things were needful when the Church was young. That she might grow by the
        increase of the faithful, she needed to be nourished with miracles. So we, when we plant
        a young tree, continually water and tend it, till we see that it hath taken firm root in
        the earth; but when once it hath taken firm root, it can grow of itself. Hence Paul saith
        of tongues: Tongues are for a sign not to them that believe, but to them that believe not.
    status: { la: verified, en: verified }
