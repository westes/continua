# Matins Nocturn 2 for "1st Sunday of September" (Tempora/091-0.txt) — see
# month-week-081.yml's header for the id scheme. Own Responsory4 (not a
# cross-reference).
id: month-week-091
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Gregory the Great, Moralia in Job, Book 2, ch. 1"
    text:
      la: >-
        Scriptúra sacra mentis óculis quasi quoddam spéculum oppónitur, ut intérna nostra fácies in
        ipsa videátur. Ibi étenim fœda, ibi pulchra nostra cognóscimus: ibi sentímus quantum profícimus,
        ibi a proféctu quam longe distámus. Narrat autem gesta Sanctórum, et ad imitatiónem corda
        próvocat infirmórum; dumque illórum victrícia facta commémorat, contra vitiórum prǽlia, debília
        nostra confírmat: fitque verbis illíus, ut eo mens minus inter certámina trépidet, quo ante se
        pósitos tot virórum fórtium triúmphos videt.


        Nonnúmquam vero non solum nobis eórum virtútes ásserit, sed étiam casus innotéscit; ut et in
        victória fórtium, quod imitándo arrípere, et rursum videámus in lápsibus quid debeámus timére.
        Ecce enim Job descríbitur tentatióne auctus, sed David tentatióne prostrátus; ut et majórum
        virtus spem nostram fóveat, et majórum casus ad cautélam nos humilitátis accíngat: quátenus dum
        illa gaudéntes súblevant, ista metuéntes premant; et audiéntis ánimus illinc spei fidúcia, hinc
        humilitáte timóris erudítus, nec temeritáte supérbiat, quia formídine prémitur; nec pressus
        timóre despéret, quia ad spei fidúciam virtútis exémplo roborátur.


        Vir erat in terra Hus, nómine Job. Idcírco sanctus vir ubi habitáverit dícitur, ut ejus méritum
        virtútis exprimátur. Hus namque quis nésciat quod sit in terra Gentílium? Gentílitas autem eo
        obligáta vítiis éxstitit, quo cognitiónem sui Conditóris ignorávit. Dicátur ítaque ubi
        habitáverit; ut hoc ejus láudibus profíciat, quod bonus inter malos fuit. Neque enim valde
        laudábile est, bonum esse cum bonis, sed bonum esse cum malis. Sicut enim gravióris culpæ est,
        inter bonus bonum non esse; ita imménsi est præcónii, bonum étiam inter malos exstitísse.
      en: >-
        The Holy Scripture is put before the eyes of our mind somewhat after the fashion of a
        looking-glass, that we may see therein the aspect of our inward man. Therein we see what are
        our unsightly, and what our comely traits; thereby we judge how we are growing, and how far yet
        we are from fullness of stature. The Holy Scripture telleth of the doings of the Saints, and
        stirreth up the heart of us weaklings to follow them. While it maketh memorial of their
        victorious deeds, it strengtheneth our frailty to strive against sin. And so by the words of
        the Scripture it cometh to pass that the soul trembleth less at the battle, for that she seeth
        how many times the enemies before her have been beaten by brave men.


        And sometimes the Scripture showeth unto us, not only how the Saints fought bravely, but also
        how they fell, that we may see by the example of the mighty, not only what weapons we must
        take, if we would conquer, but also what snares we must keep clear of, if we would avoid
        falling. For example, here is Job on the one hand, waxing nobler under trial, and on the other
        hand, David, tried, and failing utterly. And so the glory of the great strengtheneth our hope,
        and the backsliding of the same doth stir us up to be watchful and lowly, the one cheering us
        with gladness, and the other putting us on our guard through fear, so that the soul of him
        which heareth of these things may by the one gain sure and certain hope, and by the other
        fearfulness and watchfulness, and so neither be rashly puffed up, nor hopelessly cast down.


        There was a man in the land of Uz, whose name was Job. We are told where this holy man lived,
        that thereby we may gauge the worth of his bravery. Who knoweth not that Uz is a place in the
        countries of the Gentiles? The Gentile world had been so degraded and corrupted by sin, that
        they had ceased to know that they had a Maker. Therefore is it told us where Job dwelt, that it
        may redound to his praise that he was good in the midst of the wicked. It is not very
        praiseworthy to be good among the good, but to be good among the bad. For even as it is more
        grievous to be bad among the good, so is it right praiseworthy to have remained good among the
        bad.
    responsory:
      la: "R. Indúta est caro mea putrédine, et sórdibus púlveris cutis mea áruit et contrácta est: * Meménto mei, Dómine, quóniam ventus est vita mea.\nV. Dies mei velócius transiérunt quam a texénte tela succíditur, et consúmpti sunt absque ulla spe.\nR. Meménto mei, Dómine, quóniam ventus est vita mea."
      en: "R. My flesh is clothed with worms and clods of dust. My skin is dry and drawn together. * Remember me, O Lord, for my life is wind.\nV. My days are swifter than a weaver's shuttle, and are spent without hope.\nR. Remember me, Lord, for my life is wind."
    status: { la: verified, en: verified }
