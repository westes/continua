# Matins Nocturn 2-3 readings for St. Martha, Virgin (Jul 29) —
# SanctiM/07-29.txt's own Lectio5-10 resolve back to
# `@Sancti/07-29:LectioN` (resliced; Lectio2-3 are a Cistercian-rubric
# variant of the same story, not used here), so this saint's own
# proper content is sourced from the Tridentine track exactly as for a
# pre-1955 saint (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-29.txt, English/Sancti/07-29.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous
# account.
# Nocturn 3: Lectio7's Gospel citation (Luke 10:38-42) quotes only the
# opening sentence before "Et réliqua", not the full pericope, so —
# per the pre-1955 pass's convention of not transcribing bare incipits
# — only the homily portion is authored (not marked isGospel),
# combined with Lectio8 as one continuous excerpt of St. Augustine's
# homily. No responsory given for either reading.
id: st-martha
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Martha, nobílibus et copiosis paréntibus nata, sed Christi Dómini hospítio clarior,
        post ejus ascénsum in cælum, cum fratre, sorore, et Marcella pedíssequa, ac Maximino,
        uno ex septuagínta duobus discípulis Christi Dómini, qui totam illam domum
        baptizaverat, multisque aliis Christiánis, comprehensa a Judæis, in navem sine velo ac
        remigio impónitur, vastissimóque mari ad certum naufragium committitur. Sed navis, Deo
        gubernante, salvis ómnibus, Massiliam appulsa est.


        Eo miraculo et horum prædicatióne, primum Massilienses, mox Aquenses ac finítimæ
        gentes in Christum credidérunt; Lazarusque Massiliensium et Maximinus Aquensium
        epíscopus creatur. Magdalena vero, assueta oratióni et pédibus Dómini, ut optima parte
        contemplandæ cæléstis beatitúdinis, quam elégerat, fruerétur, in vastam altíssimi
        montis spelúncam se cóntulit; ubi trigínta annos vixit, ab omni hóminum consuetúdine
        disjuncta, quotidiéque per id tempus ad audiendas cæléstium laudes in altum ab Angelis
        elata.


        Martha autem, mirábili vitæ sanctitáte et caritate, ómnium Massiliensium ánimis in
        sui amórem et admiratiónem adductis, in locum a viris remotum cum aliquot honestíssimis
        féminis se recepit; ubi summa cum laude pietátis et prudéntiæ diu vixit, ac demum,
        morte sua multo ante prædicta, miraculis clara migrávit ad Dóminum, quarto Kalendas
        Augusti. Cujus corpus apud Tarascum magnam habet veneratiónem.
      en: >-
        Martha was the daughter of noble and wealthy parents, but is best known as having been
        the hostess of the Lord Christ. After that He was ascended into heaven, Martha, along
        with her brother (Lazarus,) her sister (Mary Magdalene,) her waiting-woman Marcella,
        Maximin, who was one of the seventy-two disciples of the Lord Christ, and who had
        baptized the whole of the family, and many other Christians, was taken by the Jews, and
        turned adrift upon the open sea in a ship without sail or oars, to meet with certain
        wreck, but by the governance of God the ship came to land at Marseilles with all safe.


        Through this miracle and the preaching of the Saints, the people of Marseilles first,
        and then those of Aix, and of the uttermost tribes, believed in Christ, and Lazarus was
        made Bishop of Marseilles, and Maximin Bishop of Aix. Mary Magdalene, being altogether
        given to prayer and the contemplation of heavenly blessedness, that that good part which
        she had chosen might not be taken away from her, withdrew herself to a great cave in an
        exceeding high mountain, where she lived for thirty years, utterly cut off from all
        conversation with men, and every day during that time carried up by Angels into the air,
        to listen to them that dwell in heaven praising God.


        Martha, by the wondrous holiness and charity of her life, drew upon herself the love
        and wonder of all the inhabitants of Marseilles. She withdrew herself in company with
        some other honourable women into a place out of the way of men, where she lived long,
        with great praise for godliness and discretion. She foretold her own death long before,
        and at last, illustrious for miracles, passed away to be ever with the Lord, upon the
        29th day of July. Her body is held in great worship at Tarascon.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Sermon 26 on the Words of the Lord (on Luke 10:38-42)"
    text:
      la: >-
        Verba Dómini nostri Jesu Christi, quæ modo ex Evangélio recitáta sunt, ádmonent nos,
        esse unum aliquid quo tendámus, quando in hujus sæculi multitúdine laboramus. Téndimus
        autem adhuc peregrinántes, nondum manéntes; adhuc in via, nondum in pátria; adhuc
        desiderándo, nondum fruéndo. Tamen tendámus, et sine pigrítia et sine intermissióne
        tendámus, ut aliquándo perveníre valeamus. Martha et Maria duæ sorores erant, ambæ non
        solum carne, sed étiam religióne germanæ; ambæ Dómino adhæsérunt, ambæ Dómino in carne
        præsénti concorditer serviérunt.


        Suscépit eum Martha, sicut solent súscipi peregrini; sed tamen suscépit famula
        Dóminum, ægra Salvatórem, creatura Creatórem. Suscépit autem spíritu pascenda, in carne
        pascéndum. Voluit enim Dóminus formam servi accípere, et, accepta forma servi, in illa
        pasci a servis, dignatióne, non conditione. Nam et ista dignátio fuit, se præbére
        pascéndum. Habebat carnem, in qua esuriret quidem, et sitiret; sed nescítis, quia in
        erémo esuriénti Angeli ministrábant? Ergo quod pasci vóluit, pascénti præstitit. Quid
        autem mirum, si et de sancto Elía præstitit víduæ, quem prius, corvo ministrante,
        pascebat? Numquid pascéndo defécerat, quando ad víduam mittebat? Nequaquam, sed
        religiosam víduam, per obsequium exhibitum servo suo, benedicere disponebat.
      en: >-
        The words of our Lord Jesus Christ which have just been read from the Gospel, give us to
        wit that there is one thing toward the which we are making our way, all the while that
        we are striving amid the diverse cares of this world. Thitherward we make our way, while
        we are still strangers and pilgrims, unpossessed as yet of any abiding city, still on
        the journey, not yet come home, still hoping, not yet enjoying. Still thitherward let us
        make our way, not slothfully nor by fits and starts, but so that some day we may arrive
        thither. Martha and Mary were sisters, not in the flesh only, but also in godliness;
        together, they clave unto the Lord; together, with one heart they served the Lord present
        in the Flesh.


        Martha received Him into her house. It was just as strangers are received, but it was
        the handmaiden receiving her Lord, the sick receiving her Saviour, the creature receiving
        her Creator. She received Him, to give bodily meat unto Him by Whom she herself was to be
        fed unto eternal life. It had been the Lord's will to take upon Him the form of a
        servant, to be fed by servants, still out of His good pleasure, not of necessity, and in
        that form of a servant which He had taken upon Him. This was His good pleasure, to offer
        Himself as a subject for hospitality. He had Flesh, wherein He was sometimes hungered
        and thirsty, but know ye not how that, when He was in the desert and was an-hungered,
        angels came and ministered unto Him. Himself it was therefore, That gave unto them of
        whom He was fain to be fed, the wherewithal. And what wonder is this if we consider how
        that holy Elijah, coming from being fed by the ministry of ravens, asked bread of the
        widow of Zarephath, and himself gave her the wherewithal to feed him? Had God failed to
        feed Elijah when He sent him unto the widow? God forbid. He did so that He might bless
        that godly widow for a service rendered unto His servant.
    status: { la: verified, en: verified }
