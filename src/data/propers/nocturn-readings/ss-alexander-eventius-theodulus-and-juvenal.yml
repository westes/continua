# Matins Nocturn 2 reading for Ss. Alexander I, Pope, Eventius and
# Theodulus, Martyrs, and Juvenal, Bishop and Confessor (May 3) — the
# correct Tridentine file is the suffixed `Sancti/05-03r.txt` (whose
# own `Lectio93` in turn just repeats its `Lectio94`, the real proper
# text). `SanctiM/05-03rM.txt` matches this same suffix and bases
# `@Sancti/05-03r`, but narrows the feast's own Officium to the three
# martyrs alone (dropping Juvenal) — same "Monastic office narrows a
# joint feast" pattern already seen for `ss-vincent-and-anastasius.yml`
# and `ss-cletus-and-marcellinus.yml`; the full joint text (which
# genuinely covers all four, Juvenal included) is used here per
# vu-prefer-text-over-missing (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-03r.txt, English/Sancti/05-03r.txt.
# Single lesson (simplex-feast Lectio94), one continuous account, no
# responsory given in the source.
id: ss-alexander-eventius-theodulus-and-juvenal
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Alexander Romanus, Hadriáno imperatóre regens Ecclésiam, magnam partem Romanæ
        nobilitátis ad Christum convértit. Is constítuit ut tantummodo panis et vinum in
        mysterio offerrétur: vinum autem aqua miscéri jussit, propter sánguinem et aquam, quæ ex
        Jesu Christi látere profluxérunt; et in Cánone Missæ addidit, Qui pridie quam paterétur.
        Idem decrevit ut aqua benedicta, sale admixto, perpetuo in ecclésia asservarétur, et in
        cubiculis adhiberétur ad fugándos dæmones. Sedit annos decem, menses quinque et dies
        viginti, vitæ sanctitáte et salutáribus institútis illustris. Martyrio coronátus est una
        cum Eventio et Theodúlo presbyteris, sepultúsque est via Nomentana, tertio ab Urbe
        lápide, eodem in loco, ubi secúri percússus fuerat; creátis diverso témpore mense
        Decembri presbyteris sex, diáconis duobus et epíscopis per diversa loca quinque. Eórum
        corpora, póstea in Urbem translata, in ecclésia sanctæ Sabinæ condita sunt. In eumdem
        diem incidit beáta mors sancti Juvenalis, Narniénsis epíscopi; qui, cum plurimos in ea
        urbe sanctitáte et doctrina Christo peperísset, clarus miraculis in pace quiévit ibique
        honorifice sepúltus est.
      en: >-
        Alexander was a Roman, who ruled the Church during the reign of the Emperor Hadrian. He
        turned to Christ a great number of the Roman nobility. He ordained that nothing but bread
        and wine should be offered at the mystery, but that some water should be mingled with the
        wine, in memory of the Blood and Water Which flowed from the Side of Jesus Christ. He
        added to the Canon of the Mass the words Who, the night before He suffered. He also
        ordained that blessed water mingled with salt, should be kept always in Churches, and
        should be used in private rooms to scare away devils. He sat in the throne of Peter ten
        years, five months, and twenty days. He hath great renown on account of the holiness of
        his life, and the usefulness of his institutions. He was crowned with martyrdom, together
        with the Priests Eventius and Theodulus, and was buried beside the Nomentan Way, at the
        third mile-stone from the city, in the same place where he had been beheaded. During his
        Popedom he held diverse Advent ordinations, and at them ordained six Priests, two
        Deacons, and five Bishops for diverse places. The bodies of these three Martyrs,
        Alexander, Eventius, and Theodulus, were afterwards brought into the city, and buried in
        the Church of St Sabina. On this day likewise occurred the blessed death of Juvenal, the
        holy Bishop of Narni, who by the holiness of his life and teaching, became the father in
        Christ of so many of the dwellers in that city. He fell asleep very peacefully, with great
        fame for miracles, and was there honourably buried.
    status: { la: verified, en: verified }
