# Matins Nocturn 2 reading for St. Teresa of Avila, Virgin (Oct 15).
# Sourced directly from web/www/horas/Latin/Sancti/10-15.txt,
# English/Sancti/10-15.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in her own file (her `[Rule]` is `vide
# C6a`) -- defers to the Common's own Nocturn 3, not transcribed here.
id: st-teresa-of-avila
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Teresia Virgo, nata est Abulæ in Hispánia paréntibus tum genere
        tum pietáte præcláris. Ab iis divini timoris lacte educata,
        admirándum futuræ sanctitátis in tenerrima adhuc ætate specimen
        dedit. Nam, cum sanctórum Mártyrum acta perlegeret, adeo in
        ejus meditatióne Sancti Spíritus ignis exársit, ut, domo
        aufúgiens, in Africam trajiceret, ubi vitam pro glória Jesu
        Christi et animárum salúte profúnderet. A patruo revocata,
        ardens martyrii desidérium eleemosynis aliisque piis opéribus
        compensávit, jugibus lácrimis deplorans optimam sibi sortem
        fuísse præreptam. Mortua matre, cum a beatíssima Vírgine
        peteret ut se matrem esse monstraret, pii voti compos effecta
        est; semper perinde ac fília patrocinio Deiparæ pérfruens.
        Vigesimum ætátis annum agens, ad moniáles sanctæ Maríæ de Monte
        Carmelo se cóntulit. Ibi, per duodeviginti annos gravíssimis
        morbis et variis tentatiónibus vexata, constantíssime meruit in
        castris christianæ pœniténtiæ, nullo refecta pabulo cæléstium
        eárum consolatiónum quibus solet étiam in terris sanctitas
        abundare.


        Angelicis ditáta virtútibus, non modo propriam, sed publicam
        étiam salútem sollicita caritate curávit. Quare severiórem
        veterum Carmelitárum regulam, Deo afflante et Pio quarto
        approbante, primum muliéribus, deínde viris observandam
        propósuit. Efflóruit in eo consílio omnípotens miserentis
        Dómini benedíctio; nam duo supra trigínta monasteria inops
        virgo pótuit ædificare, ómnibus humanis destituta auxíliis,
        quinimmo adversántibus plerumque sæculi princípibus. Infidelium
        et hæreticórum ténebras perpetuis deflebat lácrimis, atque, ad
        placandam divinæ ultiónis iram, voluntarios proprii corporis
        cruciátus Deo pro eórum salúte dicábat. Tanto autem divini
        amoris incendio cor ejus conflagrávit, ut mérito víderit
        Angelum igníto jáculo sibi præcordia transverberántem, et
        audíerit Christum, data déxtera, dicéntem sibi: Deinceps, ut
        vera sponsa, meum zelábis honórem. Eo consiliante, maxime
        arduum votum emisit efficiéndi semper quidquid perfectius esse
        intellígeret. Multa cæléstis sapiéntiæ documénta conscripsit,
        quibus fidelium mentes ad supernæ pátriæ desidérium maxime
        excitántur.


        Cum autem assidua ederet exempla virtútum, tam anxio castigándi
        corporis desidério æstuabat, ut, quamvis secus suadérent
        morbi quibus afflictabátur, corpus ciliciis, catenis, urticárum
        manípulis aliisque asperrimis flagellis sæpe cruciaret, et
        aliquándo inter spinas volutaret, sic Deum álloqui sólita:
        Dómine, aut pati aut mori; se semper miserrima morte pereuntem
        existimans, quámdiu a cælésti ætérnæ vitæ fonte abesset.
        Prophetíæ dono excelluit, eamque divinis charismátibus tam
        liberáliter locupletábat Dóminus, ut sæpius exclámans péterent
        beneficiis in se divinis modum imponi. Intolerábili ígitur
        divini amoris incendio potius quam vi morbi, Albæ cum
        decúmberet, prænuntiáto suæ mortis die, ecclesiásticis
        sacramentis muníta, alumnos ad pacem, caritátem et regularem
        observantiam adhortata, sub colúmbæ specie puríssimam ánimam
        Deo réddidit, annos nata sexagínta septem annos millesimo
        quingentésimo octogesimo secundo, Idibus Octobris, juxta
        Kalendarii Romani emendatiónem. Ei moriénti adesse visus est
        inter Angelórum ágmina Christus Jesus; et arbor árida, cellæ
        próxima, statim efflóruit. Ejus corpus, usque ad hanc diem
        incorruptum, odorato liquore circumfusum, pia veneratióne
        cólitur. Miraculis cláruit ante et post óbitum, eamque
        Gregórius décimus quintus in Sanctórum númerum rétulit.
      en: >-
        The virgin Theresa was the daughter of a father and mother,
        equally honourable on account of their birth and of their
        godliness, and was born at Avila in Spain. She was brought up
        from the dawn of her life in the fear of God, and when still
        only seven years old she gave a startling fore-cast of the
        holy earnestness of her later years. The reading of the acts of
        the holy martyrs so inflamed and excited her imagination, that
        she ran away from her father's house, with the design of going
        to Morocco and the hope there to lay down her life for the
        glory of Christ Jesus and the salvation of souls. She was met
        by an uncle and brought back to her mother, and was fain to
        slake her thirst for martyrdom by giving to the poor all the
        alms she could, and by other godly exercises, though still ever
        bewailing with tears that the highest prize had been snatched
        from her. Her mother died, and she besought the Most Blessed
        Virgin to be a mother to her in her stead. This she gained;
        thenceforth she lived always as a daughter under the shelter of
        the Mother of God. In the twentieth year of her age she
        withdrew herself among the nuns of St. Mary of Mount Carmel.
        There she dwelt for two-and-twenty years, tormented by grievous
        sicknesses and diverse temptations, and so bravely served her
        time in the hardest ranks of Christ's army, starved even of
        that comforting knowledge of God's reconciled love, wherein His
        holy children are so commonly used even upon earth to rejoice.


        Strengthened in the graces of an angel, the wideness of her
        love embraced in its tender care the salvation of other souls
        as well as of her own. To this end, under the blessing of God,
        and the approbation of Pius IV., she set, first before women
        and then before men, the observance of the stern Rule of the
        Old Carmelites. The blessing of the Almighty and merciful Lord
        did indeed rest most evidently upon this design. This penniless
        virgin, helped by no man, and in the teeth of many that were
        great in this world, was enabled to build two-and-thirty
        houses. The darkness of unbelievers and misbelievers drew from
        her unceasing tears, and she willingly gave up her own body to
        God to be tortured, to soften the fury of His indignation
        against them. His own love so blazed in her heart that she
        attained to see an Angel run her through with a fiery spear,
        and Christ Himself take her by the hand, and to hear Him say
        Henceforth thou shalt love Mine honour as a wife indeed. At His
        inspiration she took the extremely difficult vow to do always
        that which should seem to her to be most perfect. She wrote
        much, full of heavenly wisdom, whereby the minds of the
        faithful are enkindled to long for the Fatherland above.


        Earnest as were the examples of graces which she had shown,
        and grievous as was the state of her body, afflicted by
        disease, she still burnt with the desire of tormenting it. She
        tortured it with sackcloth, chains of spikes, handfuls of
        nettles, and heavy scourging. She rolled herself sometimes
        among thorns, and was used to cry to God "Lord! to suffer or
        to die." As long as she remained exiled from the heavenly
        Fountain of eternal life, her life was to her a lingering
        death. She was eminent for the gift of prophecy, and God did
        indeed so pour forth His bounties upon her, that she often
        cried to Him in entreaty not to bless her so as to make her
        forget her sins. It was worn out rather by the fever of her
        love than by the wasting of disease that she sank upon her
        deathbed at Alba. She foretold the day of her own death,
        received the Sacraments of the Church, and exhorted her
        disciples to peace, love, and strictness in observing the
        Rule, and then her soul, like a pure dove, winged its flight
        to rest with God, being then 67 years of age. At her death she
        had a vision of Christ Jesus surrounded by Angels. A dead tree
        hard by the cell instantly broke into foliage. Her body is
        untouched by corruption even unto this day, and lieth in a
        sort of perfumed oil, regarded with godly reverence. She was
        famous for miracles both before and after her death, and was
        numbered by Gregory XV. among the Saints.
    status: { la: verified, en: verified }
