# Matins Nocturn reading for St. Maurus, Abbot (Jan 15) — a genuine
# Monastic-only saint: no Sancti/01-15*.txt names him at all (that slot
# belongs to Ss. Marius/Martha/Audifax/Abachum and, off-date, St. Paul
# the Hermit — see memory vu-matins-pre1955-saints); his own proper
# vita exists only at web/www/horas/Latin/SanctiM/01-15t.txt. Lectio1-4
# of that file fall back to Common of a Confessor (`CommuneM/C5`), not
# proper text; Lectio5-8 are St. Maurus's own vita, one continuous
# account (a disciple-of-Benedict biography), combined into a single
# reading, no genuine source break.
# No English/SanctiM/01-15t.txt exists in the reference engine at all
# (the English SanctiM tree only covers a subset of dates) — English
# text below is this project's own translation of the Latin, not a
# reference-engine translation, so marked draft rather than verified
# per vu-prefer-text-over-missing. No responsory given in the source.
#
# Checked 2026-09-05 for a missing Nocturn 3 Gospel pairing. SanctiM/
# 01-15t.txt only defines Lectio1-8 itself (1-4 = CommuneM/C5:"in 2
# loco", 5-8 = the proper vita above); Lectio9-12 are left to the same
# ex-C5b Common chain named in the file's own [Rank] line ("ex C5b"),
# following the same "in 2 loco" variant used for Lectio1-4:
# CommuneM/C5b's "Lectio9 in 2 loco" -> Commune/C4:"Lectio7-9 in 4
# loco". That text (Matt 19:27-29, "Et réliqua" -- a bare incipit, no
# full pericope given, same pattern as st-raphael-archangel's Nocturn
# 3) is followed by Bede's homily "In Natali S. Benedicti" (written for
# St. Benedict's own feast, reused generically here as St. Maurus's
# Common-of-a-Confessor-Abbot Nocturn 3). Per the bare-incipit
# convention, only the homily is authored below (isGospel: false, no
# citation field); Lectio7(homily part)-8-9 in 4 loco of Commune/C4.txt
# (Latin) and English/Commune/C4.txt combined into one continuous
# excerpt, no genuine source break.
id: st-maurus-abbot
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Maurus nobilis Romanus, puer a patre Eutychio Deo sub sancti Benedicti disciplína oblatus,
        brevi tantum divina grátia profecit, ut ipsi magistro admiratióni esset; qui illum sæpe,
        véluti regularis observantiæ et virtútum ómnium specimen, ceteris discípulis ad imitándum
        proponebat.


        Cujus adhuc adolescentis illud admirábilis obediéntiæ exemplum a sancto Gregório Papa
        commemorátur. Nam, cum Placidus mónachus in lacum prolapsus, aquárum ímpetu raperétur,
        sancti Patris jussu accurrens Maurus, et super aquas incédens, socium capíllis apprehénsum,
        ad terram attraxit.


        Continentiæ tantá fuit, ut per Quadragesimam bis tantum in hebdomada, et quidem
        parcissime cibum sumeret. Somnum stando, vel cum nimia eum lassitudo compulísset, sedendo,
        super aggéstum calcis et fabuli strato cilício capiébat.


        Missus in Gálliam ab eodem sancto Benedicto, célebri monasterio exstructo, cui annos
        quadragínta præfuit, monasticam disciplínam mirifice propagávit. Denique sanctitáte et
        miraculis clarus, septuagenario major migrávit in cælum, anno salútis quingentésimo
        sexagésimo quinto.
      en: >-
        Maurus, a Roman of noble birth, was offered to God as a boy by his father Eutychius, to be
        formed under the discipline of St. Benedict. So swiftly did he advance by divine grace that
        he became a wonder to his own master, who often held him up to the other disciples as a
        model of regular observance and of every virtue, for them to imitate.


        While Maurus was yet a youth, Pope St. Gregory records this instance of his admirable
        obedience: when the monk Placid fell into a lake and was being swept away by the force of
        the waters, Maurus, running at the command of the holy Father and walking upon the water,
        caught his companion by the hair and drew him safe to land.


        So great was his self-restraint that during Lent he took food only twice in the week, and
        that most sparingly. For sleep, he either stood, or, when overcome by excessive weariness,
        sat upon a heap of lime and rubble spread with a hair shirt.


        Sent into Gaul by the same St. Benedict, he built a renowned monastery, over which he
        presided for forty years, wonderfully spreading monastic discipline. At length, renowned
        for holiness and miracles, he passed to heaven past the age of seventy, in the five hundred
        and sixty-fifth year of salvation.
    status: { la: verified, en: draft }

  - nocturn: 3
    isGospel: false
    source: "Bede, Homily 'In Natali S. Benedicti' (Common of a Confessor-Abbot)"
    text:
      la: >-
        Duo sunt órdines electórum in judício futúri: unus judicántium cum Dómino, de quibus hoc
        loco mémorat, qui reliquérunt ómnia, et secúti sunt illum: alius judicandórum a Dómino, qui
        non quidem ómnia sua páriter reliquérunt, sed de his tamen quæ habébant, quotidiánas dare
        eleemósynas Christi paupéribus curábant: unde et auditúri sunt in judício: Veníte, benedícti
        Patris mei, possidíte præparátum vobis regnum a constitutióne mundi. Esurívi enim, et
        dedístis mihi manducáre: sitívi, et dedístis mihi bíbere.


        Sed et reprobórum duos ibi futúros órdines Dómino narránte comperímus: unum eórum, qui
        fídei christiánæ mystériis initiáti, ópera fídei exercére contémnunt, quibus in judício
        testátur: Discédite a me maledícti in ignem aetérnum, qui præparátus est diábolo, et
        ángelis ejus: esurívi enim, et non dedístis mihi manducáre. Alterum eórum, qui fidem et
        mystéria Christi vel numquam suscepére, vel suscéptam per apostasíam deseruére: de quibus
        dicit: Qui autem non credit, jam judicatus est: quia non credit in nómine unigéniti Fílii
        Dei.


        Verum his cum timóre et pavóre débito paulísper commemorátis, ad lætíssima pótius Dómini
        et Salvatóris nostri promíssa convertámus audítum. Videámus quæ tantæ grátia pietátis: non
        ætérnae tantúmmodo vitæ præmia suis sequácibus, sed et præséntis múnera pollicétur exímia.
        Et omnis, inquit, qui relíquerit domum, vel fratres, aut soróres, aut patrem, aut matrem,
        aut uxórem, aut fílios, aut agros, propter nomen meum, céntuplum accípiet, et vitam
        ætérnam possidébit. Qui enim terrénis afféctibus sive possessiónibus pro Christi
        discipulátu renuntiáverit, quo plus in ejus amórem profécerit, eo plures invéniet, qui se
        intérno suscípere afféctu, et suis gáudeant sustentáre substántiis.
      en: >-
        In the judgment to come, the elect will be in two classes. One class are they who have
        forsaken all, and followed the Lord: and these shall judge along with Him. The other class
        are they who have not equally forsaken all that they had, but who have been careful daily
        to give alms of their goods to the poor of Christ: these shall be the subjects of judgment,
        and these are they who shall then hear these words: "Come, ye blessed of My Father,
        inherit the kingdom prepared for you from the foundation of the world: for I was an
        hungered, and ye gave Me meat: I was thirsty, and ye gave Me drink." (Matth. xxv. 34, 35.)


        Of the reprobate also we gather, from the words of the Lord, that there will be two
        classes. One class are they who, being made partakers in the mystery of Christian faith,
        have neglected to show their faith by their works: these are they to whom it will be said
        at the judgment: "Depart from Me, ye cursed, into everlasting fire, prepared for the devil
        and his angels: for I was an-hungered, and ye gave Me no meat." The other class are they
        who either have never received the faith and mysteries of Christ, or who, having received,
        have apostatised, and abandoned it: and touching these it is said: "But he that believeth
        not is condemned already, because he hath not believed in the name of the only-begotten
        Son of God." (John iii. 18.)


        And now that we have touched for a moment, with fear and just dread, upon these things,
        let us rather turn our hearing to the right joyful promises of our Lord and Saviour. Let us
        look what His so great, beautiful, and fatherly love will give to such as follow Him; not
        the reward of life everlasting only, but gifts exceeding precious in this life also. "Every
        one," saith He, "that hath forsaken houses, or brethren, or sisters, or father, or mother,
        or wife, or children, or lands, for My Name's sake, shall receive an hundredfold, and shall
        inherit everlasting life." For every one that shall forsake earthly affections and goods,
        to go and be Christ's disciple, the further he goeth on in Christ's love, the more shall he
        find who will rejoice to give him a place in their hearts, and to minister to him of their
        substance.
    status: { la: verified, en: verified }
