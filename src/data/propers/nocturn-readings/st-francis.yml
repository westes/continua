# Matins Nocturn 2 reading for St. Francis of Assisi, Confessor (Oct
# 4) — SanctiM/10-04.txt inherits the whole day (`@Sancti/10-04`) with
# no Nocturn 2/3 override, so this saint's own vita is sourced from
# the Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/10-04.txt, English/Sancti/10-04.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. Lectio7-9 reference `@Sancti/02-24` (St. Matthias's
# own lessons, unrelated) — not proper to Francis, so not authored
# here. No responsory given for Lectio4-6.
id: st-francis
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Francíscus, Assísii in Umbria natus, patris exémplum secútus, a prima ætáte
        mercatúram fecit. Qui, quodam die, páuperem, pro Christi amóre flagitántem
        pecúniam, cum præter consuetúdinem repulísset, repénte eo facto commótus, large ei
        misericórdiam impertívit; et ex eo die Deo promísit se némini umquam poscénti
        eleemósynam negatúrum. Cum vero post in gravem morbum incidísset, ex eo aliquándo
        confirmátus, cœpit ardéntius cólere offícia caritátis; qua in exercitatióne tantum
        profécit, ut, evangélicæ perfectiónis cúpidus, quidquid habéret, paupéribus
        largirétur. Quod ferens iníquius pater, eum ad Assisinátem epíscopum duxit, ut coram
        illo bonis céderet patérnis; qui, rejéctis étiam véstibus, patri concéssit ómnia,
        illud subjúngens, sibi in pósterum majórem facultátem fore dicéndi: Pater noster, qui
        es in cælis.


        Cum autem illud ex Evangélio audísset: Nolíte possidére aurum, neque argéntum, neque
        pecúniam in zonis vestris, non peram in via, neque duas túnicas, neque calceaménta;
        sibi eam régulam servándam propósuit. Itaque, detráctis cálceis et una conténtus
        túnica, cum duódecim sócios adhibuísset, órdinem Minórum instítuit. Quare Romam venit,
        ut sui órdinis régula ab apostolica Sede confirmarétur. Quem cum accedéntem ad se
        summus Póntifex Innocéntius tértius rejecísset; quod in somnis póstea sibi ille, quem
        repúlerat, collabéntem Lateranénsem basílicam suis húmeris sustinére visus esset,
        conquisítum accérsi jussit, benignéque accípiens, omnem ejus institutórum ratiónem
        confirmávit. Francíscus ígitur, dimíssis in omnes orbis terræ partes frátribus ad
        prædicándum Christi Evangélium, ipse cúpiens sibi áliquam dari martyrii occasiónem,
        navigávit in Syriam; ubi, a rege soldáno liberalíssime tractátus, cum nihil
        profíceret, rédiit in Itáliam.


        Multis ígitur exstrúctis suæ famíliæ domicíliis, se in solitúdinem montis Alvérni
        cóntulit; ubi quadragínta diérum, propter honórem sancti Michaélis Archángeli, jejúnio
        inchoáto, festo die Exaltatiónis sanctæ Crucis, ei Séraphim crucifíxi effígiem inter
        alas cóntinens appáruit; qui ejus et mánibus, et pédibus, et láteri vestígia clavórum
        impréssit. Quæ sanctus Bonaventúra, cum Alexándri quarti summi Pontíficis
        prædicatióni interésset, narrásse Pontíficem a se visa esse, lítteris commendávit.
        His insígnibus summi in eum Christi amóris, máximam habébat ómnium admiratiónem. Ac
        biénnio post, gráviter ægrótans, deférri vóluit in ecclésiam sanctæ Maríæ Angelórum;
        ut, ubi grátiæ spíritum a Deo accéperat, ibi spíritum vitæ rédderet. Eo in loco
        fratres ad paupertátem ac patiéntiam, et sanctæ Románæ Ecclésiæ fidem servándam
        cohortátus, Psalmum illum pronúntians, Voce mea ad Dóminum clamávi; in eo versículo,
        Me exspéctant justi, donec retríbuas mihi, efflávit ánimam quarto Nonas Octóbris.
        Quem, miráculis clarum, Gregórius nonus Póntifex máximus in Sanctórum númerum
        adscrípsit.
      en: >-
        Francis was born at Assisi in Umbria. From his early youth he followed the example of
        his father, and busied himself with merchandise. It befell one day that, contrary to
        his usage, he had thrust from him a beggar, who cried for money for Christ's sake, when,
        being cut to the heart with regret, he gave him large alms, and promised to God from
        that day forth never to deny to any that asked of him. He fell after this into a
        grievous sickness, and from the time that he was healed thereof, he gave himself more
        earnestly to works of love for his neighbour. At length he became fain in this sort to
        be perfect, even as the Lord hath said in the Gospel, and gave to the poor whatsoever he
        had. His father would not have it so, and brought him before the Bishop of Assisi, that
        he might renounce all right to any inheritance. He cheerfully gave up all to his father,
        even to his clothes, telling them that now he should be able with more utter dependence
        to say Our Father, Who art in heaven.


        When he heard read the words of the Gospel: Provide neither gold, nor silver, nor
        brass in your purses, nor scrip for your journey, neither two coats, neither shoes,
        thereupon he determined that that should be his rule of living. He took off his shoes,
        and contented himself with one coat. When he had gathered twelve comrades, he founded
        the Order of Friars Minor. He went to Rome to get from the Apostolic See a confirmation
        of his Order. When he came Pope Innocent III. thrust him away. Thereafter he dreamt that
        he saw the Church of the most Holy Saviour falling, and whom he had cast forth bearing
        it up with his shoulders. He bade therefore that he should be sought for and brought
        again before him, welcomed him kindly, and approved all the Rule which he had
        established. Francis therefore sent his Friars into all quarters of the world to preach
        the Gospel of Christ. He himself was fain to find some occasion of martyrdom, and
        therefore made a voyage into Syria, but the Sultan treated him with the greatest
        kindness, offering him many gifts, and, since he could do no good, he returned again to
        Italy.


        Many houses of Friars of his Order having already been built, he withdrew himself into
        a most secret place upon Mount Alverno, and began to fast for forty days in honour of
        the holy Archangel Michael. Upon the Feast-day of the Uplifting of the Holy Cross, he
        saw a vision of a crucified Seraph, which left in his hands and feet holes with nails
        therein, and in his side a great wound. Holy BuonaVentura hath left it in writing that
        he once heard Pope Alexander IV., when preaching, testify that he had himself seen these
        marks. It was a sign of such love of Christ toward him as stirred up the great wonder of
        all men. Two years thereafter he fell sick unto death, and was fain to be carried into
        the Church of St. Mary-of-the-Angels, that he might give up the breath of life in the
        same place where God had breathed into him the breath of the life of grace. There he
        exhorted the Friars to be poor and lowly, and to cleave to the faith of the Holy Church
        of Rome, and began to recite the Psalm: I cried unto the Lord with my voice, and in
        uttering the words, the righteous wait for me, till Thou deal bountifully with me, he
        gave up the ghost. He was famous for miracles, and Pope Gregory IX. added his name to
        the list of the Saints.
    status: { la: verified, en: verified }
