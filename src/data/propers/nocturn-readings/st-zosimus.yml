# Matins Nocturn 2 reading for St. Zosimus, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/02-09-Zosimus.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-zosimus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Zosimus Græcus, Abrahami fílius, post sanctum Innocéntium Románæ Ecclésiæ Episcopátum
        suscépit. Is Africanorum Conciliorum decrétis advérsus Pelagianam hærésim in sententiæ suæ
        robur adnexuit, et ad impiórum excidium gládio Petri dexteras ómnium armavit Antístitum; iis
        namque ab ipso probátis, per totum mundum hærésis Pelagiana damnáta est. Damnávit et
        Pelagium ipsum una cum Cœlestio, datis hac de re lítteris ad univérsam Ecclésiam.


        Ecclesiásticæ disciplínæ tenacíssimus fuit, compluribus ad eam ubíque sive servandam, sive
        restituendam destinatis gravibus epístolis. Definiit, juxta probátum Ecclésiæ morem, ut si
        quis ab infántia ecclesiásticis ministériis nomen dedísset, inter lectores usque ad
        vigésimum ætátis annum, continuáta observatione duraret. Si vero major jam, et grandævus
        post baptísmum, sive inter lectores, sive inter exorcistas, quinquennio tenerétur, et inde
        acolythus, vel subdiaconus, quátuor annis, et sic ad diaconatum (si mererétur) accéderet, in
        quo órdine quinque annis hærere debéret, et inde, suffragántibus votis, sacerdótium
        promereri posset.


        Sancívit, ut diáconi lævas linostimis pallis tegerent: potestatemque fecit, ut per paróchias
        paschális cereus benediceretur. Cavit prætérea, ne clerico póculum propinaretur in público,
        prætérquam in fidélium cellis et máxime clericórum. Qui cum sanctíssime rexísset Ecclésiam
        annum unum, menses quátuor, dies septem, quiévit in pace; sepultúsque est juxta corpus
        sancti Lauréntii mártyris via Tiburtina, séptimo Kaléndas Januárii, Honório, et Theodósio
        junióre imperantibus. Una ordinatióne, mense Decémbri, creávit presbyteros decem, diáconos
        tres, epíscopos per divérsa loca octo.
      en: >-
        Zosimus, a Greek, the son of Abraham, took up the episcopate of the Roman Church after holy
        Innocent. He added to the decrees of the African Councils against the Pelagian heresy the
        strength of his own sentence, and armed against the destruction of the impious the right
        hands of all the prelates with the sword of Peter; for by his approval of these, the
        Pelagian heresy was condemned throughout the whole world. He condemned also Pelagius himself
        together with Caelestius, in letters written on this matter to the whole Church.


        He was most tenacious of ecclesiastical discipline, sending grave letters to very many
        places everywhere either to preserve it or to restore it. He defined, according to the
        approved custom of the Church, that anyone who had given his name from infancy to
        ecclesiastical ministries should remain among the readers, with continuous observance, up to
        the twentieth year of age. But if he was older and advanced in years after baptism, he
        should be held five years among either the readers or the exorcists, then four years as
        acolyte or subdeacon, and so come to the diaconate (if he deserved), in which order he
        should remain five years, and from there, with the votes supporting him, be able to merit
        the priesthood.


        He decreed that deacons should cover their left arms with linen palls, and gave permission
        that the Paschal candle be blessed throughout the parishes. He also took care that a cup
        should not be offered to a cleric in public, except in the cells of the faithful and
        especially of clerics. When he had most holily ruled the Church one year, four months, and
        seven days, he rested in peace, and was buried beside the body of the holy martyr Lawrence
        on the Tiburtine Way, on the seventh day before the Kalends of January, in the reign of
        Honorius and Theodosius the Younger. In one ordination in the month of December he created
        ten priests, three deacons, and eight bishops for various places.
    status: { la: verified, en: draft }
