# Matins Nocturn 2-3 readings for St. Boniface, Bishop and Martyr
# (June 5). Sourced directly from web/www/horas/Latin/Sancti/06-05.txt,
# English/Sancti/06-05.txt. Nocturn 2: Lectio4-6 combined into one
# reading, one continuous vita. Nocturn 3: his own Gospel citation ends
# "Et réliqua"/"And so on" with no full pericope given -- per the
# bare-incipit convention, only the homily (Lectio7-9, St. Augustine of
# Hippo) is authored, isGospel: false, no citation field.
id: st-boniface-of-mainz
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bonifátius, ántea Winfrídus appellátus, apud Anglos natus est exeúnte sæculo
        séptimo, et ab ipsa infántia mundum aversátus, vitam monásticam in votis
        hábuit. Cum ejus pater ánimum sæculi illécebris permutáre frustra tentásset,
        monastérium ingréditu, et sub beáti Wolphárdi disciplína ómnium virtútum ac
        scientiárum génere imbúitur. Annum agens trigésimum sacerdótio insignítur, ac
        verbi divíni prædicátor assíduus, magno animárum lucro hoc in múnere versátur.
        Attamen, regnum Christi adaugére desíderans, contínuo flebat ingéntem
        multitúdinem barbarórum, qui ignorántiæ ténebris immérsi dæmoni famulabántur.
        Qui quidem animárum zelus cum in dies inexstinguíbili ardóre accrésceret,
        divíno númine per lácrimas et oratiónes exploráto, facultátem a monastérii
        præpósito obtínuit ad Germánicas oras proficiscéndi.


        Ex Anglia duóbus cum sóciis navem solvens, Dorestádium in Frísiæ óppidum venit.
        Cum autem bellum gravíssimum inter Frísonum regem Radbódum et Cárolum
        Martéllum exarsísset, sine fructu Evangélium prædicávit. Quaprópter in Angliam
        revérsus, ad suum redívit monastérium, cui invítus præfícitur. Post elápsum
        biénnium, ex consénsu epíscopi Vintoniénsis, munus abdicávit, et Romam
        proféctus est, ut apostólica auctoritáte ad Gentílium conversiónem
        delegarétur. Cum ad Urbem pervenísset, a Gregório secúndo benígne excípitur,
        pro Winfrído Bonifátius a Pontífice nominátur. In Germániam diréctus,
        Thuríngiæ Saxoniæque pópulis Christum annuntiávit. Cum intérea Radbódus,
        Frísiæ rex ac infestíssimus christiáni nóminis hostis, occubuísset, Bonifátius
        ad Frísones rédiit, ubi sancti Willibrórdi sócius per triénnium tanto cum
        fructu Evangélium prædicávit, ut, destrúctis idolórum simulácris, innúmeræ vero
        Deo ecclésiæ excitaréntur.


        A sancto Willibrórdo ad episcopále munus expetítus, illud detrectávit ut
        prómpius infidélium salúti instáret. In Germániam proféctus, plura Hassórum
        míllia a dæmonis superstitióne avocávit. A Gregório Pontífice Romam evocátus,
        post insígnem fídei professiónem epíscopus consecrátur. Exínde ad Germános
        redux, Hássiam et Thuríngiam ab idololatríæ relíquiis pénitus expurgávit.
        Tanta propter mérita Bonifátius a Gregório tértio ad dignitátem
        archiepiscopálem evéhitur, et tértio Romam proféctus a summo Pontífice Sedis
        apostólicæ legátus constitúitur. Qua insignítus auctoritáte quátuor
        episcopátus instítuit, et várias synodos celebrávit, inter quas concílium
        Leptinénse memorábile est, apud Belgas in Cameracénsi diœcési celebrátum, quo
        quidem témpore ad fidem in Bélgio adaugéndam egrégie cóntulit. A Zacharía Papa
        creátus Mogúntius archiepíscopus, ipso Pontífice jubénte, Pipínum in regem
        Francórum unxit. Post mortem sancti Willibrórdi Ultrajecténsem ecclésiam
        gubernándum suscépit, primo per Eóbanum, deínde per seípsum, dum ab ecclésia
        Moguntína absolútus Ultrajécti resédit. Frisónibus ad idololatríam relápsis,
        Evangélium prædicáre rursus aggréditur, cumque offício pastoráli occuparétur, a
        bárbaris et ímpiis homínibus juxta Bornam flúvium cum Eóbano coëpíscopo
        multísque áliis cruénta cæde perémptus martyrii palma condecorátur. Corpus
        sancti Bonifátii Mogúntiam translátum, et, ut ipse vivens petíerat, in
        Fuldénsi monastério, quod exstrúxerat, recónditum fuit, ubi multis miráculis
        incláruit.
      en: >-
        Winfried, afterwards called Boniface, was an Englishman, and born in England,
        towards the end of the seventh century. From his very childhood, he turned away
        from the world, and set his heart upon becoming a monk. His father tried in vain
        to turn him from his wishes by the beguilements of the world, and he entered a
        Monastery, where the Blessed Wolphard instructed him in all godliness and
        diverse kinds of learning. At the age of twenty-nine years he was ordained
        Priest, and became an unwearied preacher of the Word of God, wherein he had a
        gift which he used with great gain of souls. Nevertheless, his great desire was
        to spread the kingdom of Christ, and he continually bewailed the vast number of
        savages who were plunged in the darkness of ignorance and were the servants of
        the devil. This zealous love of souls increased in him in intensity day by day,
        till nothing would serve him, but, having implored the blessing of God by tears
        and prayers, and obtained authority from the head of his monastery, to set forth
        for the coast of Germany.


        He set sail from England with two companions and reached the town of Dorestadt
        in Friesland. A great war being then raging between Radbod, King of the
        Frieslanders, and Charles Martel, Winfrid preached the Gospel in vain. He went
        back to England, and betook himself again to his Monastery, whereof he was,
        against his own will, chosen to be the head. After two years he obtained the
        consent of the Bishop of Winchester to resign his office, and went to Rome, to
        seek an Apostolic commission to preach to the heathen. When he arrived at the
        city he was courteously welcomed by Gregory II., who changed his name from
        Winfrid to Boniface. He departed thence to Germany, and preached Christ to the
        tribes in Thuringia and Saxony. Radbod, King of Friesland, who bitterly hated
        the Christian name, being dead, Boniface went a second time among the
        Frieslanders, and there, with his comrade St. Willibrord, preached the Gospel
        for three years with so much fruit, that the idols were hewn down, and
        countless churches arose to the true God.


        Willibrord urged upon him to take the office of a Bishop, but he deferred to
        seek it, that he might the more instantly toil for the salvation of the
        unbelievers. Advancing into Germany, he reclaimed thousands of the Hessians
        from devil-worship. Pope Gregory sent for him to Rome, and after hearing a noble
        profession of his faith, consecrated him a Bishop. He again returned to
        Germany, and thoroughly purged Hesse and Thuringia from all remains of idolatry.
        On account of such great works Gregory III. advanced Boniface to the dignity
        of an Archbishop, and on the occasion of a third journey to Rome, he was
        invested by the Sovereign Pontiff with the powers of Legate of the Apostolic
        See. As such, he founded four Bishoprics, and held diverse Synods, among which
        is especially to be remembered that of Lessines, held in Belgium, in the
        diocese of Cambrai, wherein he made his strongest endeavours to spread the
        Faith among the Belgians. By Pope Zacharias, he was named Archbishop of
        Maintz, and by command of the same Pope, he anointed Pepin to be King of the
        Franks. After the death of St. Willibrord, he undertook the government of the
        Church of Utrecht, at first through Eoban but he afterwards was released from
        the care of the Church of Maintz and established his see at Utrecht. The
        Frieslanders having again fallen back into idolatry, he once more betook
        himself to preach the Gospel among them, and while he was busied in this duty,
        he grasped the crown of martyrdom, being murdered by some ungodly savages,
        along with his fellow-Bishop Eoban, and many others, in a bloody massacre near
        the River Born. In accordance with the wish expressed by himself during life
        the body of St. Boniface was carried to Maintz, and buried in the monastery of
        Fulda, of which he had been the founder, and where God has gloriously honoured
        it by the working of many signs and wonders.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine of Hippo, Book I on the Lord's Sermon on the Mount, ch. 2-3"
    text:
      la: >-
        Beáti mundo corde; quóniam ipsi Deum vidébunt. Quam ergo stulti sunt, qui Deum
        istis exterióribus óculis quærunt, cum corde videátur, sicut álibi scriptum
        est: Et in simplicitáte cordis quærite illum. Hoc est enim mundum cor, quod est
        simplex cor. Et quemádmodum lumen hoc vidéri non potest, nisi óculis mundis;
        ita nec Deus vidétur, nisi mundum sit illud quo vidéri potest. Beáti pacífici;
        quóniam ipsi fílii Dei vocabúntur. In pace perféctio est, ubi nihil repúgnat;
        et ídeo fílii Dei pacífici, quóniam nihil in his resístit Deo, et útique fílii
        similitúdinem patris habére debent.


        Pacífici autem in semetípsis sunt, qui omnes ánimi sui motus componéntes, et
        subjiciéntes ratióni, id est menti et spirítui, carnalésque concupiscéntias
        habéntes edómitas, fiunt regnum Dei. In quo ita sunt ordináta ómnia, ut id
        quod est in hómine præcípuum et excéllens, hoc ímperet, céteris non
        reluctántibus, quæ sunt nobis bestiísque commúnia; atque idípsum quod
        excélluit in hómine, id est mens et rátio, subjiciátur potióri, quod est ipsa
        véritas, unigénitus Fílius Dei. Neque enim imperáre inferióribus potest, nisi
        superióri se ipse subjíciat. Et hæc est pax, quæ datur in terra homínibus
        bonæ voluntátis; hæc vita consummáti perfectíque sapiéntis.


        De hujúsmodi regno pacatíssimo et ordinatíssimo missus est foras princeps
        hujus sæculi, qui pervérsis inordinatísque dominátur. Hac pace intrínsecus
        constitúta atque firmáta, quascúmque persecutiónes ille, qui foras missus est,
        forínsecus concitáverit, auget glóriam, quæ secúndum Deum est; non áliquid in
        illo ædifício labefáctans, sed deficiéntibus máchinis suis innotéscere fáciens,
        quanta fírmitas intus exstrúcta sit. Ideo séquitur: Beáti, qui persecutiónem
        patiúntur propter justítiam; quóniam ipsórum est regnum cælórum.
      en: >-
        Blessed are the pure in heart, for they shall see God. What fools then be they
        that seek God with their outward eyes, since it is in the heart that He is
        seen, as it is written elsewhere: In simplicity of heart seek Him. A simple
        heart is a pure heart. And even as we cannot see this earthly light, unless the
        eyes be open, so cannot God be seen, unless that be open which alone can
        perceive Him. Blessed are the peacemakers, for they shall be called the
        children of God. The perfection of peace is the absence of contrariety, and the
        peacemakers are called the children of God because they offer no contrariety
        against the will of God. As beseemeth children, they have their Father's
        likeness.


        They are peacemakers in themselves, who order all the movements of their own
        mind in obedience to reason, that is, to their intellect and soul, and so
        doing, and taming the lusts of the flesh, become a kingdom for God. In such
        kingdom all things are so ordered, that the chiefest and noblest part of man
        ruleth without contention over those lower things which we have in common with
        beasts. And just in the same way, must that nobler part of man, that is to say,
        intellect and reason, needs be put in subjection to what is above it, namely,
        Truth, the Only begotten Son of God. He only can rule well who hath learnt to
        obey. And this ordering is that peace which is given on earth to men of good
        will; this is the life of whomsoever is thoroughly and perfectly wise.


        From this most peaceful and most orderly kingdom is cast forth the prince of
        this world, whose rule is over the contentious and disorderly. When once this
        peace hath been proclaimed and established within, whatsoever wars he that is
        without can raise, can but heap more glory upon that glory which is according
        to God, for nothing of the castle will yield before him, but the yielding of
        his own engines will witness how strong be its ramparts. And therefore cometh
        next: Blessed are they which are persecuted for righteousness' sake, for theirs
        is the kingdom of heaven.
    status: { la: verified, en: verified }
