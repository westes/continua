# Matins Nocturn 2 reading for St. Alphonsus Liguori, Bishop, Confessor,
# Doctor of the Church (Aug 2). Sourced directly from
# web/www/horas/Latin/Sancti/08-02.txt, English/Sancti/08-02.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break -- same convention st-francis-de-sales.yml uses. Nocturn
# 3's own Lectio7-9 in the source is a cross-reference to a Common homily
# (@Commune/C1a), not proper text, so falls to the existing Common of a
# Confessor Bishop Nocturn 3 pool automatically, same as every other
# saint of this category with nothing proper here.
id: st-alphonsus-liguori
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Alfonsus Maria de Ligorio, Neapoli nobílibus paréntibus natus, ab ineunte ætate non
        obscura præbuit sanctitátis indicia. Eum adhuc infántem cum paréntes obtulissent
        sancto Francisco de Hieronymo e societáte Jesu, is bene precátus edíxit eumdem ad
        nonagesimum usque annum perventurum, ad episcopalem dignitátem evectum iri,
        maximóque Ecclésiæ bono futurum. Jam tum a puerítia, a ludis abhorrens, nóbiles
        ephébos ad christianam modestiam verbo et exemplo componebat. Adoléscens, dato piis
        sodalitátibus nómine, in publicis nosocomíis ægrotis inservire, jugi in templis
        oratióni vacare, ac sacra mysteria frequenter obire in deliciis habebat. Pietátem
        litterárum stúdiis adeo conjunxit, ut séxdecim vix annos natus utriusque juris
        lauream in pátria universitáte fúerit assecutus. Patri obtemperans, causárum
        patrocinia suscépit; in quo munere obeundo, etsi magnam sibi laudem comparasset,
        fori tamen pericula expertus, ejusmodi vitæ institutum ultro dimísit. Spreto ígitur
        præcláro conjugio sibi a patre propósito, avíta primogenitúra abdicata, et ad aram
        Vírginis de Mercede ense suspenso, divinis ministériis se mancipávit. Sacerdos
        factus, tanto zelo irruit in vitia, ut apostolico munere fungens, huc illuc
        pérvolans, ingéntes perditórum hóminum conversiónes perágeret. Páuperum præsertim et
        ruricolárum miseratus, congregatiónem Presbyterórum instituit sanctíssimi
        Redemptoris, qui, ipsum Redemptórem secuti, per agros, pagos, et castella paupéribus
        evangelizarent.


        Ne autem a propósito umquam diverteret, perpetuo se voto obstrinxit nullam témporis
        jacturam faciéndi. Hinc animárum zelo succénsus, tum divini verbi prædicatióne, tum
        scriptis sacra eruditióne et pietáte refertis, ánimas Christo lucrifácere et ad
        perfectiórem vitam adducere studuit. Mirum sane quot odia exstinxerit, quot devios
        ad rectum salútis iter revocaverit. Dei Genitrícis cultor exímius, de illíus
        laudibus librum edidit, ac de iis dum ferventius concionando disserit, a Vírginis
        imagine, in eum immisso miro splendore, totus fácie coruscare et in éxtasim rapi
        coram universo pópulo non semel visus est. Dominicæ passiónis et sacræ Eucharistiæ
        contemplator assiduus, ejus cultum mirifice propagávit. Dum vero ad ejus aram
        oraret vel Sacrum fáceret, quod numquam omisit, præ amoris veheméntia, vel
        seraphicis liquescebat ardóribus, vel insólitis quatiebátur mótibus, vel
        abstrahebátur a sensibus. Miram vitæ innocéntiam, quam nulla umquam lethali labe
        fœdávit, pari cum pœniténtia socians, corpus suum inedia, férreis caténulis,
        ciliciis cruentáque flagellatióne castigábat. Inter hæc prophetíæ, scrutatiónis
        cordium, bilocatiónis et miraculórum donis incláruit.


        Ab ecclesiásticis dignitátibus sibi oblátis constantíssime abhorruit; at, Clementis
        décimi tertii Pontificis auctoritate coactus, sanctæ Agathæ Gothórum ecclésiam
        gubernándum suscépit. Epíscopus, externum dumtaxat habitum, non autem sevéram
        vivéndi ratiónem immutávit. Eadem frugalitas, summus christianæ disciplinæ zelus,
        impensum in vitiis coërcéndis arcendisque erróribus, et in réliquis pastorálibus
        munéribus obeundis studium. Liberalis in páuperes, omnes ecclésiæ proventus iisdem
        distribuebat, ac, urgénte annonæ caritate, ipsam domesticam supellectilem in
        aléndis famélicis erogávit. Omnibus ómnia factus, sanctimoniáles ad perfectiórem
        vivéndi formam redégit, suæque congregatiónis moniálium monastérium constituéndum
        curávit. Episcopatu ob graves habitualésque morbos dimísso, ad alumnos suos, a
        quibus pauper discesserat, revértitur pauper. Demum, quamvis senio laboribúsque,
        diuturna arthrítide aliisque gravíssimis morbis fractus corpore, spíritu tamen
        alacrior, de cæléstibus rebus disseréndi aut scribéndi finem numquam adhibuit,
        donec nonagenarius, Kaléndis Augusti, anno millesimo septingentésimo octogesimo
        séptimo, Nucériæ Paganórum, inter suórum alumnórum lácrimas, placidíssime
        exspirávit. Eum, inde virtútibus et miraculis clarum, Pius septimus Pontifex
        maximus anno millesimo octingentésimo décimo sexto Beatórum fastis; novisque
        fulgentem signis, Gregórius décimus sextus in festo sanctíssimæ Trinitátis, anno
        millesimo octingentésimo trigesimo nono, solemni ritu, Sanctórum catálogo
        accensuit. Tandem Pius nonus Pontifex maximus, ex sacrórum Rituum Congregatiónis
        consulto, universalis Ecclésiæ Doctórem declarávit.
      en: >-
        Alphonsus Mary de Liguori was born at Naples of noble parents, and from his earliest
        years gave no uncertain signs of the sanctity that was to come. While he was still an
        infant, his parents brought him to be blessed by St. Francis Jerome of the Society of
        Jesus, who, having prayed over him, declared that he would live to be ninety years
        old, would be raised to the dignity of the episcopate, and would be of the greatest
        benefit to the Church. Even as a boy he shrank from games, and by word and example
        formed noble youths to Christian modesty. As a young man he enrolled himself among
        pious confraternities, and delighted to wait upon the sick in the public hospitals,
        to give himself continually to prayer in the churches, and to frequent the sacred
        mysteries. He joined devotion to his studies so well that, scarcely sixteen years
        old, he obtained the doctorate in both laws at the university of his own city. In
        obedience to his father he took up the practice of law, and though he won great
        praise in that calling, having learned by experience the perils of the courts, he
        freely gave up that way of life. Rejecting, therefore, the brilliant marriage his
        father had proposed for him, and renouncing his hereditary birthright, he hung up his
        sword before the altar of Our Lady of Mercy and gave himself over to the divine
        ministry. Having been made a priest, he threw himself against vice with such zeal
        that, exercising the apostolic office and travelling here and there, he brought about
        the conversion of great numbers of lost souls. Taking pity especially on the poor and
        on country folk, he founded the Congregation of Priests of the Most Holy Redeemer,
        who, following the Redeemer himself, should preach the Gospel to the poor through the
        fields, villages, and hamlets.


        That he might never turn aside from his purpose, he bound himself by a perpetual vow
        to waste no time. Burning thus with zeal for souls, he labored, both by the preaching
        of God's word and by writings full of sacred learning and piety, to win souls to
        Christ and lead them to a more perfect life. It is wonderful how much hatred he
        extinguished, and how many wanderers he called back to the right way of salvation. A
        devoted client of the Mother of God, he published a book in her praise, and while
        preaching fervently about her, he was seen more than once, before the whole assembled
        people, with his whole countenance shining with a wondrous brightness cast upon him
        from an image of the Virgin, and caught up in ecstasy. An assiduous contemplator of
        the Lord's Passion and of the Holy Eucharist, he wonderfully spread devotion to them.
        Whenever he prayed at the altar or offered the Holy Sacrifice, which he never
        omitted, such was the vehemence of his love that he would melt away in seraphic
        ardor, or be shaken with unwonted movements, or be caught away from his senses. He
        joined to a wonderful innocence of life, which no mortal sin ever stained, an equal
        penance, chastising his body with fasting, with iron chains, with hairshirts, and
        with bloody scourging. Amid all this he became renowned for the gifts of prophecy, of
        reading hearts, of bilocation, and of miracles.


        He shrank with unwavering constancy from every ecclesiastical dignity offered him;
        yet, compelled by the authority of Pope Clement XIII, he took up the governance of
        the church of Sant'Agata dei Goti. As bishop he changed only his outward habit, not
        his austere manner of life. The same frugality, the same supreme zeal for Christian
        discipline, the same effort spent in restraining vice and warding off error, and the
        same diligence in fulfilling every other pastoral duty, remained with him. Generous
        to the poor, he distributed to them all the revenues of the church, and when famine
        pressed hard, he gave away even his own household furnishings to feed the starving.
        Having become all things to all men, he brought the nuns of his diocese to a more
        perfect manner of life, and saw to the founding of a monastery for the sisters of his
        own congregation. When he was released from his bishopric because of serious and
        chronic illnesses, he returned, poor as he was, to the disciples from whom he had
        departed poor. At last, though broken in body by old age, by labors, and by
        long-standing arthritis and other most grievous illnesses, yet ever more eager in
        spirit, he never ceased to discourse or to write of heavenly things, until, in his
        ninetieth year, on the first of August in the year 1787, at Nocera de' Pagani, amid
        the tears of his own disciples, he most peacefully breathed his last. Pope Pius VII,
        in the year 1816, enrolled him, already renowned for virtues and miracles, among the
        Blessed; and Pope Gregory XVI, on the feast of the Most Holy Trinity in the year
        1839, solemnly placed him, resplendent with new signs, in the roll of the Saints. At
        length Pope Pius IX, on the advice of the Congregation of Sacred Rites, declared him
        a Doctor of the Universal Church.
    status: { la: verified, en: verified }
