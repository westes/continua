# Matins Nocturn 2 reading for St. John Cantius, Confessor (Oct 20).
# Sourced directly from web/www/horas/Latin/Sancti/10-20.txt,
# English/Sancti/10-20.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (his `[Rule]` is `vide
# C5`) -- defers to the Common's own Nocturn 3, not transcribed here.
id: st-john-cantius
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joánnes, in oppido Kenty Cracoviénsis diœcesis, a quo Cantii
        cognomen duxit, Stanislao et Anna piis et honestis paréntibus
        natus, morum suavitáte, innocéntia, gravitáte, ab ipsa infántia
        spem fecit maximæ virtútis. In universitáte Cracoviénsi
        philosophíæ ac theologíæ primum auditor, tum, per omnes
        academíæ gradus ascendendo, professor ac doctor, sacra, quam
        annis multis trádidit, doctrina mentes audiéntium non
        illustrábat modo, sed et ad omnem pietátem inflammabat, simul
        docens scilicet et fáciens. Sacerdos factus, nihil de
        litterárum studio remíttens, studium auxit christianæ
        perfectiónis. Utque passim offéndi Deum maxime dolebat, sic eum
        sibi et pópulo placare, oblato quotídie non sine multis
        lácrimis incruento sacrifício, satagebat. Ilkusiensem
        parochiam annis aliquot egregie administrávit; sed animárum
        periculo commótus, póstea dimísit, ac, postulante academía, ad
        prístinum docéndi offícium rediit.


        Quotidie témporis ab studio supérerat, partim salúti proximórum
        sacris præsertim conciónibus curandæ, partim oratióni dabat, in
        qua cæléstibus quandoque visiónibus et colloquiis dignátus
        fertur. Christi vero passióne sic afficiebátur, ut in ea
        contemplanda totas intérdum noctes dúceret insomnes, ejusque
        causa mélius recolendæ Jerosolymam peregrinátus sit; ubi, et
        martyrii desidério flagrans, Turcis ipsis Christum crucifixum
        prædicáre non dubitávit. Quater étiam ad Apostolórum limina,
        pedes atque viaria onustus sárcina, Romam venit, tum ut Sedem
        apostolicam, cui maxime addictus fuit, honoraret, tum ut sui
        (sic enim ajebat) purgatorii pœnas expósita illic quotídie
        peccatórum venia redímeret. Quo in itinere a latrónibus olim
        spoliátus et num quid haberet præterea interrogátus, cum
        negasset, aureos deínde aliquot suo insutos pallio recordatus,
        fugiéntibus hos étiam clamans óbtulit latrónibus; qui, viri
        sancti candórem simul et largitátem admirati, étiam ablatos
        ultro reddidére. Alienæ famæ ne quis detraheret, descriptis,
        beáti Augustíni exemplo, in pariete versiculis, se atque alios
        perpetuo vóluit admónitos. Famélicos de suo étiam obsonio
        satiábat; nudos autem non emptis modo sed detractis quoque
        sibi vestibus et calceis operiebat, demisso ipse interim usque
        ad terram pallio, ne domum núdipes redire viderétur.


        Brevis illi somnus, atque humi; vestis, quæ nuditátem, cibus,
        qui mortem dumtaxat, arcéret. Virginalem pudicítiam, velut
        lílium inter spinas, áspero cilício, flagellis atque jejuniis
        custodívit. Quin et per annos ante óbitum trigínta circiter et
        quinque, ab esu carnium perpetuo abstinuit. Tandem diérum
        juxta ac meritórum plenus, cum vicinæ, quam præsensit, morti
        se diu diligenterque præparasset, ne qua re ámplius tenerétur,
        si quid domi supérerat, id omnino paupéribus distríbuit. Tum
        Ecclésiæ sacramentis rite munítus, dissolvi jam cupiens et
        esse cum Christo, pridie Nativitátis ejus, in cælum evolávit,
        miraculis ante et post mortem clarus. Mortuus ad próximam
        academíæ ecclésiam sanctæ Annæ delátus est, ibique honorifice
        sepúltus. Auctáque in dies pópuli veneratióne ac frequéntia,
        inter primarios Poloniæ ac Lithuaniæ patronos religiosíssime
        cólitur.
      en: >-
        This John was the son of godly and respectable parents named
        Stanislaus and Anne, and was born in the town of Kenty, a
        place in the diocese of Krakow in Poland, from which he took
        the Latin name of Cantius. By his gentleness, innocency, and
        seriousness he gave great hopes even from his childhood. He
        studied Philosophy and Theology in the University of Krakow,
        wherein he rose step by step to be a Professor and teacher of
        those sciences wherein he lectured many years, not only
        enlightening the minds of his hearers, but stirring up in them
        all godliness, instructing them by example as well as by word.
        Having taken Priests' orders, he ceased not to busy himself
        with letters, but added thereto the striving after Christian
        perfection. He grieved exceedingly that God should be offended
        on all hands, and offered up to Him, day by day, not without
        many tears, the Unbloody Sacrifice for a propitiation for
        himself and for his people. He was for some years a faithful
        Parish Priest at Ilkusi, but after a while gave it up for fear
        of the danger of souls, and accepted the call of the
        University to take up again his Professorship.


        What time was left him over from his work, he gave up partly
        to the profit of his neighbour, more especially in preaching,
        and partly in prayer, wherein he is said sometimes to have had
        heavenly visions and messages. The sufferings of Christ took
        such hold upon him, that he sometimes passed whole nights
        without sleep in thinking thereon, and that he might more
        keenly realize them, he made a pilgrimage to Jerusalem. There
        he was seized with such a passionate longing to be a martyr,
        that he preached Christ crucified even to the Turks. He went
        four times to Rome to the thresholds of the Apostles, on foot,
        and laden with a wallet, partly to do honour to the Apostolic
        See, for which he had a great reverence, and partly to use his
        own expression, that he might clear off the pains of his own
        purgatory by use of the Pardons for sin which are there daily
        offered. In one of these journeys he was set upon by highway
        robbers, who plundered him, and having asked him if he had
        any more, whereto he answered, Nay, left him and fled. Then he
        remembered that he had some gold pieces sewn up in his
        clothes. So he ran after the robbers with shouts, and offered
        them these also, but they were so amazed at the simplicity
        and charity of the holy man, that they gave him back even that
        which they had already taken. To hinder scandal-mongering, he
        wrote up upon the walls, after the example of holy Augustine,
        certain texts, to be an unceasing warning to himself and
        others. He gave his own bread to the hungry, and clothed the
        naked, not with bought raiment only, but by stripping himself
        of his own garments and shoes, himself meanwhile letting down
        his own cloak to trail upon the ground, lest any should see
        that he returned home barefoot.


        He slept very little, and that upon the ground; his clothing
        was enough only to clothe his nakedness, and his food to keep
        him alive. He kept his virgin purity guarded like a lily
        among thorns by rough hair-cloth, scourging, and fasting. For
        about thirty-five years before his death he never tasted
        flesh-meat. At length, when he was full of days and good
        works, he felt that death was near, and made himself ready to
        meet it by a long and careful preparation, and to be the
        freer, he gave to the poor everything that was left in his
        house. Strengthened by the Sacraments of the Church, and
        having a desire to depart, and to be with Christ, he took
        flight to heaven upon the day before his Nativity. He was
        famous for miracles both before and after his death. His body
        was carried into the University Church of St. Anne, hard by
        his dwelling, and there honourably buried. The popular
        reverence and the crowds around his sepulchre grew greater day
        by day, till he hath come to be held in honour as one of the
        chiefest holy defenders of Poland and Lithuania.
    status: { la: verified, en: verified }
