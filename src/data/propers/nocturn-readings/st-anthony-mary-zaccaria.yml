# Matins Nocturn 2-3 readings for St. Anthony Mary Zaccaria, Confessor
# (July 5). Sourced directly from web/www/horas/Latin/Sancti/07-05.txt,
# English/Sancti/07-05.txt. Nocturn 2: Lectio4-6 combined into one
# reading, one continuous vita. Nocturn 3: his own Gospel citation ends
# "Et réliqua"/"And so on" with no full pericope given -- per the
# bare-incipit convention, only the homily (Lectio7-9, St. Augustine of
# Hippo) is authored, isGospel: false, no citation field.
id: st-anthony-mary-zaccaria
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Antonius Maria Zaccaría, Cremonæ in Insubria nobili genere natus, jam a
        púero qua futurus esset sanctitáte porténdere visus est. Eximiárum enim in
        eo virtútum significatiónes mature eluxérunt, pietátis in Deum ac beátam
        Vírginem; insígnis præsertim in páuperes misericórdiæ; quorum inópiæ
        sublevandæ, vel pretiósa veste sibi detracta, haud semel præsto fuit.
        Humanióribus litteris in pátria excultus, Ticíni philosophíæ, Patavii
        medicinæ addiscendæ operam dedit; utque ómnibus vitæ integritate, ita et
        æquálibus acúmine ingenii facile antecelluit. Lauream adeptus ac domum
        reversus, ubi intelléxit se Dei mónitu ad animórum magis quam córporum
        morbis medéndum vocari, in sacras disciplínas percipiendas sédulo incúbuit.
        Interea ægrotos vísere, púeros christiana doctrina informare, júvenum
        cœtus pietáte excólere, ætate étiam provectos ad mores emendándos
        frequenter hortari non déstitit. Sacris initiatus, cum primo litáret,
        cælésti oborto lúmine, Angelórum coróna circúmdatus stupénti pópulo
        apparuísse tráditur. Exinde animárum salúti impensius consúlere,
        depravátis móribus summa ope obsístere curæ fuit. Ad hæc ádvenas, egénos,
        afflictos paterno complexus afféctu, piis alloquiis atque subsidiis
        recreatos ita solari, ut ejus domus miserórum perfúgium haberétur, ípseque
        pater pátriæ atque angelus merúerit a suis civibus appellari.


        Mediolani, cum secum agitaret uberióres in rem christianam manare posse
        fructus, si in vinea Dómini sibi labórum socios adscísceret, re
        communicáta cum Bartholomæo Ferrario et Jacobo Morígia, nobilíssimis et
        sanctíssimis viris, sodalitátis Clericórum regulárium fundaménta jecit;
        quam, ob suum in Géntium Apostolum amórem, a sancto Paulo nuncupávit. Quæ,
        Cleménte septimo Pontifice máximo approbante et Paulo tertio confirmánte,
        brevi per complures regiónes propagáta est. Sanctimoniálium quoque
        Angelicárum socíetas ipsum Antónium Mariam parentem et auctórem hábuit.
        Qui tamen adeo de se submisse sentiebat, ut nullo pacto præésse suo
        ordini umquam volúerit. Tanta vero fuit patiéntia, ut formidolosíssimas
        tempestates in suos commótas constanti animo perferret; tanta caritate, ut
        piis adhortatiónibus religiósos viros ad Dei amórem inflammare, sacerdótes
        ad apostolicam vivéndi normam revocare, patrumque familias sodalítia ad
        bonam frugem institúere numquam intermíserit. Immo, intérdum præláta cruce
        per cómpita plateasque cum suis progréssus, férvida ac veheménti oratióne
        aberrántes improbosque hómines ad salútem redúceret.


        Illud étiam memorándum, quod, in Jesum crucifixum amóre flagrans, crucis
        mystérium ab ómnibus, ad statum æris campani indícium, sexta quaque feria
        sub vésperas, recoléndum curávit. Sanctíssimum Christi nomen in suis
        scriptis passim usurpábat et in ore semper habebat; ejusdémque cruciatus,
        vere Pauli discipulus, in corpore suo præ se ferebat. In sacram
        Eucharistiam singulari caritate ferebátur; cujus et frequenter percipiendæ
        consuetúdinem instaurávit, et morem e sublimi throno publice in triduum
        adorandæ invexísse perhibétur. Pudicítiam adeo coluit, ut étiam in
        exsangui corpore, revivíscere visus, ejus amórem testarétur. Accéssere
        cæléstia dona éxtasis, lacrimárum, futurórum eventuum cognitiónis,
        scrutatiónis cordium, virtútis in humani generis hostem. Tandem, magnis
        labóribus ubíque exantlátis, Guastallæ quo pacis sequester accítus fuerat,
        gravi morbo correptus est. Cremonam adductus, inter suórum fletus et
        complexus piíssimæ matris, quam proxime obituram prædixit, superna
        Apostolórum visióne recreatus, sodalitátis suæ increménta prænuntians,
        tertio Nonas Julii anno millesimo quingentésimo trigesimo nono,
        sanctíssime obiit, annos natus sex supra trigínta.
      en: >-
        Anthony Mary Zaccaria was born of a noble family, at Cremona, on the Pau.
        Even in his childhood marks of his future holiness became manifest. There
        shone brightly in him, signs of excellent graces of childlike love toward God
        and the Blessed Virgin, and more especially of tenderness toward the poor,
        for the relief of whose needs he was ready more than once to strip off his
        own costly dress. He studied arts at his own home, philosophy at Ticino, and
        medicine at Padua, and as he excelled all others in goodness, so did he
        surpass all his companions in intellectual power. After taking his degree he
        returned home, and there understood from God that his call was to the
        healing of souls, rather than to that of bodies. He therefore began earnestly
        to study theology while he continued in the meantime to visit the sick, to
        teach Christian doctrine to children, to excite godliness among the young,
        and oftentimes even to exhort the aged to amend their ways. It is said that
        when he first said Mass after his ordination a light broke from heaven, and
        he seemed to the astonished bystanders to be surrounded by a circle of
        angels: from that time forth he laboured more earnestly for the salvation of
        souls, and the struggle against evil living. His fatherly love for strangers,
        for the needy, and for the afflicted, and the godly exhortations and alms
        wherewith he entertained them, made his house to become a refuge for the
        wretched, and earned for himself from his fellow-citizens the title of father
        of the fatherland and of angels.


        While he was at Milan he bethought him that greater Christian good might be
        done if he gathered round him some fellow-labourers in the Lord's vineyard,
        and when he had conferred thereon with those noble and holy men Bartholomew
        Ferrari and James Morigia, he founded the brotherhood of Clerks Regulars, to
        whom on account of his own great love for the Apostle of the Gentiles he gave
        the name of Clerks of St. Paul. Under the approbation of the Supreme Pontiff
        Clement VII. and the confirmation of Paul III. this brotherhood was in a
        short time widely spread abroad. The Congregation of nuns who are called
        Angelicals also regard Anthony Mary as their Father and Founder. His own
        thought of himself was so lowly that he never would be at the head of his own
        Order. In great long-suffering he bore with patience the violent storms which
        were raised against his Institute. In the greatness of his charity he never
        ceased to enkindle the members of religious orders to love toward God, to
        exhort priests to live Apostolic lives, and to found guilds of married men, to
        the bringing forth of much fruit. Somewhiles he and his disciples would walk
        through the streets and squares with a Cross carried before them, and there
        by burning and vehement harangues call to salvation the wandering and the
        wicked.


        It is to be remembered that in his burning love for Jesus Crucified he
        reminded all men of the Mystery of the Cross by the sound of a bell every
        Friday evening, and himself as a true disciple of Paul always bore about in
        his body the dying of the Lord Jesus. The holy Name of Christ is found
        everywhere in his writings and was ever in his mouth. He was moved by a
        singular love toward the Holy Eucharist. He established a custom of receiving
        it often, and is said to have brought in the practice of exposing the same
        upon a lofty throne for three days' adoration. Of his earnest modesty the
        appearance of life which was seen even in his dead body seemed a witness.
        Together with all these things he possessed the gifts of trance, of tears, of
        knowledge of things to come, of reading the thoughts of the heart, and of
        power against the enemy of mankind. He was worn out with toil when he was
        seized with his last illness at Guastalla, whither he had been called as a
        peacemaker. He was carried to Cremona amid the tears of his brethren and the
        embraces of his devoted mother, whose imminent death he foretold. He was
        comforted by a vision of the Apostles above, and predicted the increase of
        his Brotherhood. In the year 1539, he died a holy death at the age of
        thirty-six.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Augustine of Hippo, Sermon 47 (various)"
    text:
      la: >-
        Durum vidétur et grave quod Dóminus imperávit, ut, si quis eum vult sequi
        ábneget seípsum; sed non est durum nec grave quod ille ímperat, qui ádjuvat
        ut fiat quod ímperat. Nam illud verum est quod ei dícitur in Psalmo: Propter
        verba labiórum tuórum ego custodívi vias duras. Quidquid enim durum est in
        præceptis, ut sis lene, caritas facit. Nóvimus quanta ipse amor facit. Quid
        autem est, Neget se? Non præsumat de se, séntiat se hóminem, et respiciat
        dictum propheticum: Maledictus omnis qui spem suam ponit in hómine: subdúcat
        se sibi sed non deorsum versus: subdúcat se sibi, ut hæreat Deo.


        Quo sequendus est Dóminus? Quo iit, novimus; resurréxit enim et ascéndit in
        cælum: illo sequendus est. Plane desperándum non est, quia ipse promísit,
        non quia homo aliquid potest. Jam quare desperémus, si membra illíus cápitis
        sumus? Bonum est illo eum sequi; sed vidéndum est, qua. Etenim verba ista
        Dóminus Jesus non tunc dicebat quando a mórtuis jam resurrexerat; nondum
        erat passus, venturus erat ad crucem, venturus ad exhonoratiónem, ad
        contumelias, ad flagélla, ad spinas, ad vulnera, ad insultatiónes,
        oppróbria, mortem. Quasi exasperáta est via: pigrum te facis, non vis
        sequi: Séquere. Nam quis non velit ire ad exaltatiónem? omnes delectat
        celsitudo, sed humilitas gradus est.


        Tolle crucem tuam, et séquere Dóminum. Crux enim nostra, quam Dóminus
        portari a nobis jubet, ut eum expeditíssimi sequamur, quid aliud quam
        mortalitátem carnis hujus significat? Ipsa enim nos cruciat, donec
        absorbeátur mors in victoriam. Crux ergo hæc ipsa crucifigenda est, et
        transfigenda est clavis timoris Dei, ne solutis et liberis membris
        reluctántem portare non possis; sequi enim Dóminum, nisi eam portans, omnino
        non vales. Nam quómodo eum sequéris, si non es ejus? Qui autem Jesu Christi
        sunt, ait Apóstolus, carnem suam crucifixérunt cum passiónibus et
        desidériis.
      en: >-
        That which the Lord commandeth hard and heavy seemeth: if any man will come
        after Me, let him deny himself, and take up his cross, and follow Me. But
        neither hard nor heavy is that which He commandeth when He that commandeth
        giveth help to fulfil. Whatsoever is hard in the commandment, love maketh
        easy. We know how great is the power of love. And what signifieth this, let
        him deny himself? Let him put no trust in himself, let him feel that he is
        man, and let him have regard unto that which was spoken of the prophet:
        Cursed be the man that trusteth in men. Let him mistrust himself, but not to
        sink; let him mistrust himself, that he may cleave unto God.


        Whither are we to follow the Lord? Whither He is gone, we know. He is risen
        from the dead, and is gone up into heaven. Thither we must follow Him. And we
        must not despair of so doing, not because man is able to do anything, but
        because He is faithful That promised. Why, then, should we despair, since we
        are members of His Body? Good is it to follow Him, but whither we are to
        follow Him we must see. When the Lord Jesus uttered those words bidding us to
        follow Him, He had not Himself as yet arisen from the dead; there lay still
        before Him the cross, shame, mockery, scourging, thorns, wounds, outrages,
        insults, death. Art thou slothful? willest thou not to follow Him? but follow
        Him all the same, for who would not follow unto glory? All men love
        exaltation, but lowliness is the step to rise withal.


        Take up thy cross, and follow the Lord. For our cross, which the Lord
        commandeth us to carry after Him, that we may follow Him most speedfully,
        what is it but the death of this flesh? For it is this flesh that crucifieth
        us until death is swallowed up in victory. Therefore must this our own cross
        itself be crucified and pierced with the nails of the fear of God, lest, if
        it be free, it hamper thee in the carrying of it, and thou canst nowise
        follow the Lord save in carrying it. For how canst thou follow Him if thou be
        none of His? And they that are Christ's, saith the Apostle, have crucified
        the flesh with the affections and lusts.
    status: { la: verified, en: verified }
