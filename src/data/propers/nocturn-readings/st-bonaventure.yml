# Matins Nocturn 2 reading for St. Bonaventure, Bishop, Confessor,
# Doctor (Jul 14) — SanctiM/07-14.txt inherits the whole day
# (`@Sancti/07-14`) with no Nocturn 2/3 override, so this saint's own
# vita is sourced from the Tridentine track exactly as for a pre-1955
# saint (see memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-14.txt, English/Sancti/07-14.txt.
# Lectio4-5 combined with `Lectio6_` (itself a same-file indirection
# referenced by `Lectio6`, alongside a separate `Commune/C4a` insertion
# not used here) — all one continuous vita, no genuine source break.
# The reference engine's English translation is misaligned with the
# Latin section boundaries here (its "Lectio5" paragraph actually
# corresponds to Latin `Lectio6_`'s content, including a summary that
# omits the "Sinámus Sanctum pro Sancto laboráre" anecdote entirely) —
# so `en` here is this project's own translation of the full Latin
# text, marked `draft`, rather than a patchwork of misaligned official
# paragraphs. No responsory given in the source.
id: st-bonaventure
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bonaventúra, Balneorégii in Etrúria natus, a letháli morbo adhuc puer, beáti Francísci
        précibus, cujus religióni, si convaluísset, voto matris dicátus fúerat, evásit
        incólumis. Itaque adoléscens, fratrum Minórum institútum amplécti vóluit, in quo ad eam
        doctrinæ præstántium Alexándro de Ales magístro pervénit, ut séptimo post anno Parísiis
        magistérii láuream adéptus, libros Sententiárum públice summa cum laude sit
        interpretátus, quos étiam præcláris póstea commentáriis illustrávit. Nec sciéntiæ
        solum eruditióne, sed et morum integritáte vitæque innocéntia, humilitáte, mansuetúdine,
        terrenárum rerum contémptu et cæléstium desidério mirífice excélluit; dignus plane, qui
        tamquam perfectiónis exémplar haberétur, et a beáto Thoma Aquináte, cui summa caritáte
        conjúnctus erat, sanctus appellarétur. Is enim, cum sancti Francísci vitam illum
        scribéntem comperísset: Sinámus, ait, Sanctum pro Sancto laboráre.


        Divíni amóris flamma succénsus, erga Christi Dómini passiónem, quam júgiter
        meditabátur, ac Deíparam Vírginem, cui se totum devóverat, singulári ferebátur pietátis
        afféctu; quem in áliis étiam verbo et exémplo excitáre, scriptísque opúsculis augére
        summópere stúduit. Hinc illa morum suávitas, grátia sermónis et cáritas in omnes effúsa,
        qua singulórum ánimos sibi arctíssime devinciébat. Quam ob rem, vix quinque et trigínta
        annos natus, Romæ summo ómnium consénsu generális órdinis miníster eléctus est;
        susceptúmque munus per duodevigínti annos admirábili prudéntia gessit ac laude
        sanctitátis. Plura constítuit regulári disciplínæ et amplificándo órdini utília; quem
        una cum áliis ordínibus mendicántibus advérsus obtrectatórum calúmnias felíciter
        propugnávit.


        Ad Lugdunénse concílium a beáto Gregório décimo accersítus et cardinális epíscopus
        Albanénsis creátus, árduis concílii rebus egrégiam navávit óperam; qua et schísmatis
        dissídia, compósita sunt, et ecclesiástica dógmata vindicáta. Quibus in labóribus, anno
        ætátis suæ quinquagésimo tértio, salútis vero millésimo ducentésimo septuagésimo
        quarto, summo ómnium mæróre decéssit, ab univérso concílio, ipso præsénte Románo
        Pontífice, fúnere honestátus. Eum Xystus quartus, plúrimis maximísque clarum miráculis,
        in Sanctórum númerum rétulit. Multa scripsit, in quibus summam eruditiónem cum pietátis
        ardóre conjúngens, lectórem docéndo movet: quare a Xysto quinto Doctóris Seráphici
        nómine mérito est insignítus.
      en: >-
        Bonaventure was born at Bagnoregio in Tuscany. As a boy he fell dangerously ill, and his
        mother vowed that if he recovered, he should be dedicated to the religious life of
        blessed Francis; he came through unharmed by the prayers of that same Francis. So, as a
        young man, he chose to embrace the Institute of the Friars Minor, in which, under his
        teacher Alexander of Hales, he attained such excellence in learning that, seven years
        later, having taken the laurel of the mastership at Paris, he publicly expounded the
        Books of the Sentences with the greatest applause, and later illustrated them with
        splendid commentaries. He excelled wonderfully not only in the depth of his learning but
        in integrity of character and innocence of life, in humility, gentleness, contempt of
        earthly things, and longing for the things of heaven — worthy indeed to be held up as a
        pattern of perfection, and to be called a saint even by blessed Thomas Aquinas, to whom
        he was joined in the greatest affection. For Thomas, when he found him writing the life
        of St. Francis, said: Let us allow a saint to labour for a saint.


        Kindled with the flame of divine love, he was borne along by a singular devotion toward
        the Passion of the Lord Christ, on which he meditated continually, and toward the
        Mother of God, to whom he had wholly devoted himself; and he strove with the greatest
        earnestness to stir up this same devotion in others, both by word and example, and to
        increase it through his written works. Hence came that sweetness of manner, that grace of
        speech, and that charity poured out upon all, by which he bound the hearts of each to
        himself most closely. For this reason, when he was scarcely thirty-five years old, he was
        chosen at Rome, by the unanimous consent of all, Minister General of the Order; and he
        carried out the office he had undertaken for eighteen years with wonderful prudence and
        renown for holiness. He established many things useful to regular discipline and to the
        enlargement of the Order, which, together with the other mendicant Orders, he
        successfully defended against the slanders of its detractors.


        Summoned by blessed Gregory X to the Council of Lyons and created Cardinal Bishop of
        Albano, he gave outstanding service to the difficult business of the Council, whereby the
        discords of schism were settled and the doctrines of the Church vindicated. In the midst
        of these labours, in the fifty-third year of his age, in the year of salvation 1274, he
        departed this life to the great grief of all, and was honoured with a funeral by the
        whole Council, the Roman Pontiff himself being present. Sixtus IV, renowned for very many
        and very great miracles, enrolled him among the Saints. He wrote much, in which, joining
        the deepest learning with the ardour of devotion, he moves the reader even as he teaches
        him; wherefore he was deservedly distinguished by Sixtus V with the title of the Seraphic
        Doctor.
    status: { la: verified, en: draft }
