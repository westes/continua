# Matins Nocturn content for Friday in the 4th week of Lent — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-5.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-5.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Augustine
# homily split only to fill the fixed 3-lesson slot count). Responsory1 is
# a cross-reference (@Tempora/Quad4-0:Responsory4, the 4th Sunday of
# Lent's own) — used here per the "the first one, when several collapse"
# convention.
id: lent-4-friday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Joann 11:1-45", en: "John 11:1-45" }
    text:
      la: >-
        In illo témpore: Erat quidam languens Lázarus a Bethánia, de castéllo Maríæ et Marthæ,
        soróris ejus. (María autem erat, quæ unxit Dóminum unguénto, et extérsit pedes ejus capíllis
        suis: cujus frater Lázarus infirmabátur.) Misérunt ergo soróres ejus ad eum, dicéntes:
        Dómine, ecce, quem amas infirmátur. Audiens autem Jesus, dixit eis: Infírmitas hæc non est
        ad mortem, sed pro glória Dei, ut glorificétur Fílius Dei per eam. Diligébat autem Jesus
        Martham et sorórem ejus, Maríam, et Lázarum. Ut ergo audívit, quia infirmabátur, tunc quidem
        mansit in eódem loco duóbus diébus. Déinde post hæc dixit discípulis suis: Eámus in Judǽam
        íterum. Dicunt ei discípuli: Rabbi, nunc quærébant te Judǽi lapidáre, et íterum vadis illuc?
        Respóndit Jesus: Nonne duódecim sunt horæ diéi? Si quis ambuláverit in die, non offéndit,
        quia lucem hujus mundi videt: si autem ambuláverit in nocte, offéndit, quia lux non est in
        eo. Hæc ait, et post hæc dixit eis: Lázarus, amícus noster, dormit: sed vado, ut a somno
        éxcitem eum. Dixérunt ergo discípuli ejus: Dómine, si dormit, salvus erit. Díxerat autem
        Jesus de morte ejus: illi autem putavérunt, quia de dormitióne somni díceret. Tunc ergo
        Jesus dixit eis maniféste: Lazarus mórtuus est: et gáudeo propter vos, ut credátis, quóniam
        non eram ibi: sed eámus ad eum. Dixit ergo Thomas, qui dícitur Dídymus, ad condiscípulos:
        Eámus et nos, ut moriámur cum eo. Venit itaque Jesus, et invénit eum quátuor dies jam in
        monuménto habéntem. (Erat autem Bethánia juxta Jerosólymam quasi stádiis quíndecim.) Multi
        autem ex Judǽis vénerant ad Martham et Maríam, ut consolaréntur eas de fratre suo. Martha
        ergo, ut audívit quia Jesus venit, occúrrit illi: María autem domi sedébat. Dixit ergo
        Martha ad Jesum: Dómine, si fuísses hic, frater meus non fuísset mórtuus: sed et nunc scio,
        quia, quæcúmque popósceris a Deo, dabit tibi Deus. Dicit illi Jesus: Resúrget frater tuus.
        Dicit ei Martha: Scio, quia resúrget in resurrectióne in novíssimo die. Dixit ei Jesus: Ego
        sum resurréctio et vita: qui credit in me, étiam si mórtuus fúerit, vivet: et omnis, qui
        vivit et credit in me, non moriétur in ætérnum. Credis hoc? Ait illi: Utique, Dómine, ego
        crédidi, quia tu es Christus, Fílius Dei vivi, qui in hunc mundum venísti. Et cum hæc
        dixísset, ábiit et vocávit Maríam, sorórem suam, siléntio, dicens: Magíster adest, et vocat
        te. Illa ut audívit, surgit cito, et venit ad eum: nondum enim vénerat Jesus in castéllum;
        sed erat adhuc in illo loco, ubi occúrrerat ei Martha. Judǽi ergo, qui erant cum ea in domo
        et consolabántur eam, cum vidíssent Maríam, quia cito surréxit et éxiit, secúti sunt eam,
        dicéntes: Quia vadit ad monuméntum, ut ploret ibi. María ergo, cum venísset, ubi erat Jesus,
        videns eum, cécidit ad pedes ejus, et dicit ei: Dómine, si fuísses hic, non esset mórtuus
        frater meus. Jesus ergo, ut vidit eam plorántem, et Judǽos, qui vénerant cum ea, plorántes,
        infrémuit spíritu, et turbávit seípsum, et dixit: Ubi posuístis eum? Dicunt ei: Dómine, veni
        et vide. Et lacrimátus est Jesus. Dixérunt ergo Judǽi: Ecce, quómodo amábat eum. Quidam
        autem ex ipsis dixérunt: Non póterat hic, qui apéruit óculos cæci nati, facere, ut hic non
        morerétur? Jesus ergo rursum fremens in semetípso, venit ad monuméntum. Erat autem spelúnca,
        et lapis superpósitus erat ei. Ait Jesus: Tóllite lápidem. Dicit ei Martha, soror ejus, qui
        mórtuus fúerat: Dómine, jam fetet, quatriduánus est enim. Dicit ei Jesus: Nonne dixi tibi,
        quóniam, si credíderis, vidébis glóriam Dei? Tulérunt ergo lápidem: Jesus autem, elevátis
        sursum óculis, dixit: Pater, grátias ago tibi, quóniam audísti me. Ego autem sciébam, quia
        semper me audis, sed propter pópulum, qui circúmstat, dixi: ut credant, quia tu me misísti.
        Hæc cum dixísset, voce magna clamávit: Lázare, veni foras. Et statim pródiit, qui fúerat
        mórtuus, ligátus pedes et manus ínstitis, et fácies illíus sudário erat ligáta. Dixit eis
        Jesus: Sólvite eum, et sínite abíre. Multi ergo ex Judǽis, qui vénerant ad Maríam et
        Martham, et víderant quæ fecit Jesus, credidérunt in eum.
      en: >-
        At that time, a certain man was sick, Lazarus of Bethany, the village of Mary and her
        sister Martha. (Now it was Mary who anointed the Lord with ointment, and wiped His feet dry
        with her hair, whose brother Lazarus was sick.) The sisters therefore sent to Him, saying,
        "Lord, behold, he whom You love is sick." But when Jesus heard this, He said to them, "This
        sickness is not unto death, but for the glory of God, that through it the Son of God may be
        glorified." Now Jesus loved Martha and her sister Mary, and Lazarus. So when He heard that
        he was sick, He remained two more days in the same place. Then afterwards He said to His
        disciples, "Let us go again into Judea." The disciples said to Him, "Rabbi, just now the
        Jews were seeking to stone You; and do You go there again?" Jesus answered, "Are there not
        twelve hours in the day? If a man walks in the day, he does not stumble, because he sees the
        light of this world. But if he walks in the night, he stumbles, because the light is not in
        him." These things He spoke, and after this He said to them, "Lazarus, our friend, sleeps.
        But I go that I may wake him from sleep." His disciples therefore said, "Lord, if he sleeps,
        he will be safe." Now Jesus had spoken of his death, but they thought He was speaking of the
        repose of sleep. So then Jesus said to them plainly, "Lazarus is dead; and I rejoice on your
        account that I was not there, that you may believe. But let us go to him." Thomas, who is
        called the Twin, said therefore to his fellow-disciples, "Let us also go, that we may die
        with Him." Jesus therefore came and found him already four days in the tomb. (Now Bethany
        was close to Jerusalem, some fifteen stadia distant.) And many of the Jews had come to
        Martha and Mary, to comfort them on account of their brother. When, therefore, Martha heard
        that Jesus was coming, she went to meet Him. But Mary remained at home. Martha therefore
        said to Jesus, "Lord, if You had been here my brother would not have died. But even now I
        know that whatever You shall ask of God, God will give it to You." Jesus said to her, "Your
        brother shall rise." Martha said to Him, "I know that he will rise at the resurrection, on
        the last day." Jesus said to her, "I am the resurrection and the life; he who believes in
        Me, even if he die, shall live; and whoever lives and believes in Me, shall never die. Do
        you believe this?" She said to Him, "Yes, Lord, I believe that You are the Christ, the Son
        of God, Who have come into the world." And when she had said this, she went away and quietly
        called Mary her sister, saying, "The Master is here and calls you." As soon as she heard
        this, she rose quickly and came to Him, for Jesus had not yet come into the village, but was
        still at the place where Martha had met Him. When, therefore, the Jews who were with her in
        the house and were comforting her, saw Mary rise up quickly and go out, they followed her,
        saying, "She is going to the tomb to weep there." When, therefore, Mary came where Jesus
        was, and saw Him, she fell at His feet, and said to him, "Lord, if You had been here, my
        brother would not have died." When, therefore, Jesus saw her weeping, and the Jews who had
        come with her weeping, He groaned in spirit and was troubled, and said, "Where have you laid
        him?" They said to Him, "Lord, come and see." And Jesus wept. The Jews therefore said, "See
        how He loved him." But some of them said, "Could not He Who opened the eyes of the blind,
        have caused that this man should not die?" Jesus therefore, again groaning in Himself, came
        to the tomb. Now it was a cave and a stone was laid against it. Jesus said, "Take away the
        stone." Martha, the sister of him who was dead, said to Him, "Lord, by this time he is
        already decayed, for he is dead four days." Jesus said to her, "Have I not told you that if
        you believe you shall behold the glory of God?" They therefore removed the stone. And Jesus,
        raising His eyes, said, "Father, I give You thanks that You have heard Me. Yet I knew that
        You always hear Me; but because of the people who stand round, I spoke, that they may
        believe that You have sent Me." When He had said this, He cried out with a loud voice,
        "Lazarus, come forth!" And at once he who had been dead came forth, bound feet and hands
        with bandages, and his face was tied up with a cloth. Jesus said to them, "Unbind him, and
        let him go." Many therefore of the Jews who had come to Mary, and had seen what He did,
        believed in Him.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, 49th Tract on John"
    text:
      la: >-
        In superióri lectióne meminístis, quod Dóminus éxiit de mánibus eórum, qui lapidáre illum
        volúerant, et discéssit trans Jordánem, ubi Joánnes baptizábat. Ibi ergo Dómino constitúto,
        infirmabátur in Bethánia Lázarus: quod castéllum erat próximum Jerosólymis. María autem
        erat, quæ unxit Dóminum unguénto, et extérsit pedes ejus capíllis suis, cujus frater Lázarus
        infirmabátur. Misérunt ergo soróres ejus ad eum. Jam intellégimus quo misérunt, ubi erat
        Jesus: quóniam absens erat, trans Jordánem scílicet. Misérunt ad Dóminum, nuntiántes quod
        ægrotáret frater eárum, ut si dignarétur, veníret, et eum ab ægritúdine liberáret. Ille
        dístulit sanáre, ut posset resuscitáre.


        Quid ergo nuntiavérunt soróres ejus? Dómine, ecce quem amas, infirmátur. Non dixérunt: Veni:
        amánti enim tantúmmodo nuntiándum fuit. Non ausæ sunt dícere: Veni, et sana. Non ausæ sunt
        dícere: Ibi jube, et hic fiet. Cur enim non et istæ, si fides illíus centuriónis inde
        laudátur? Ait enim: Non sum dignus ut intres sub tectum meum; sed tantum dic verbo, et
        sanábitur puer meus. Nihil horum istæ, sed tantúmmodo: Dómine, ecce quem amas, infirmátur.
        Súfficit ut nóveris: non enim amas, et déseris.


        Dicit áliquis: Quómodo per Lázarum peccátor significabátur, et a Dómino sic amabátur? Audiat
        enim dicéntem: Non veni vocáre justos, sed peccatóres. Si enim peccatóres Deus non amáret,
        de cælo ad terram non descénderet. Audiens autem Jesus, dixit eis: Infírmitas hæc non est ad
        mortem, sed pro glória Dei, ut glorificétur Fílius Dei. Talis glorificátio ipsíus non ipsum
        auxit, sed nobis prófuit. Hoc est ergo quod ait: Non est ad mortem, sed pótius ad miráculum:
        quo facto créderent hómines in Christum, et vitárent veram mortem. Sane vidéte quemádmodum
        tamquam ex oblíquo Dóminus Deum se dixit: propter quosdam qui negant Fílium Dei Deum esse.
      en: >-
        Ye remember that in our last reading we learnt how that the Lord escaped out of the hands
        of them which took up stones to stone Him, and went away again beyond Jordan, into the place
        where John at first baptized. While, then, the Lord still tarried there, Lazarus was sick at
        Bethany, which was a town near to Jerusalem. It was that Mary which anointed the Lord with
        ointment, and wiped His Feet with her hair, whose brother Lazarus was sick. Therefore his
        sisters sent unto Him. We know already whither it was that they sent, for we know where
        Jesus was: He was gone away again beyond Jordan. His sisters sent unto Him, saying: Lord,
        behold, he whom Thou lovest is sick, in order that, if He so pleased, He might come and free
        him from his sickness. But Jesus healed not, that He might afterward quicken.


        What therefore sent his sisters to say? Lord, behold, he whom Thou lovest is sick and no
        more. They said not: Come, for Jesus loved him; and to tell Him that he was sick was enough.
        They dared not to say: Come, and heal him; they dared not to say: Speak the word where Thou
        art, and it shall be done here. And wherefore should they not have said this if they had
        the faith which won the Centurion so much praise? He had said: Lord, I am not worthy that
        Thou shouldest come under my roof; but speak the word only, and my servant shall be healed.
        But they said none of these things, only: Lord, behold, he whom Thou lovest is sick. It is
        enough that Thou shouldest know it. Thou art not one that lovest and leavest.


        But some man will say: How shall Lazarus be a type of the sinner, and yet the Lord so love
        him? Let such an one hear the words of the same Lord, which He said: I am not come to call
        the righteous, but sinners. For if God had not loved sinners, He had not come down from
        heaven to earth. When Jesus heard that, He said: This sickness is not unto death, but for
        the glory of God, that the Son of God might be glorified thereby. Such a glorification is no
        increase of majesty for Him, but of profit for us. He therefore meaneth to say: This
        sickness is not unto death, but for the working of a miracle, the which being wrought, if
        men will thereby believe in Christ, they shall escape the real death. Note especially how
        the Lord doth in this place declare Himself to be God, as it were by implication, for the
        sake of some which say that He is not the Son of God.
    responsory:
      la: "R. In mare viæ tuæ, et sémitæ tuæ in aquis multis: * Deduxísti sicut oves pópulum tuum in manu Móysi et Aaron.\nV. Transtulísti illos per mare Rubrum, et transvexísti eos per aquam nímiam.\nR. Deduxísti sicut oves pópulum tuum in manu Móysi et Aaron."
      en: "R. Thy way is in the sea, and thy paths in the great waters. * Thou led thy people like a flock, by the hand of Moses and Aaron.\nV. Thou broughtest them through the Red Sea, and led them through much water.\nR. Thou led thy people like a flock, by the hand of Moses and Aaron."
    status: { la: verified, en: verified }
