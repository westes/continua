# Matins nocturn content for Trinity Sunday (temporalId trinity-sunday,
# Duplex II classis). Sourced from Tempora/Pent01-0.txt (Latin) /
# English/Tempora/Pent01-0.txt, and the Gospel pericope's full text from
# missa/Latin+English/Tempora/Pent01-0.txt's own [Evangelium] (the
# Matins file itself only gives the incipit + "Et réliqua" for Lectio7,
# per this project's Gospel/homily-split convention).
#
# The audit found this id registered in ALWAYS_OVERRIDE_TEMPORAL_IDS,
# with a real collect/antiphons already authored, but no Matins reading.
# Nocturn 1-2 (Lectio1-6, Romans 11) left unauthored here per this
# project's convention of leaving Nocturn 1/2 scripture to the bible-plan
# store when the source itself draws Nocturn 2 from ordinary Scripture
# rather than a patristic sermon (Trinity Sunday's own [Lectio4-6] are a
# continuation of Romans, not a proper sermon on the feast).
#
# Nocturn 3: the Gospel pericope (Matt 28:18-20) authored in full
# (isGospel: true), followed by Lectio7's homily portion (incipit
# dropped) combined with Lectio8/8a as one continuous excerpt of St.
# Gregory of Nazianzus's own Treatise on the Faith. The source's own
# [Lectio9] is a distinct "Commemoratio Dominicæ" (a Gospel+homily pair
# for whichever ordinary Sunday after Pentecost Trinity Sunday displaces,
# not Trinity's own proper content) and is deliberately not carried over
# here — see ferial-commemoration-temporal-leak memory for the general
# principle this follows.
id: trinity-sunday
readings:
  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 28:18-20", en: "Matthew 28:18-20" }
    text:
      la: >-
        In illo témpore: Dixit Jesus discípulis suis: Data est mihi omnis potéstas in
        cælo et in terra. Eúntes ergo docéte omnes gentes, baptizántes eos in nómine
        Patris, et Fílii, et Spíritus Sancti: docéntes eos serváre ómnia, quæcúmque
        mandávi vobis. Et ecce, ego vobíscum sum ómnibus diébus usque ad consummatiónem
        sǽculi.
      en: >-
        At that time, Jesus said to His disciples: All power in heaven and on earth has
        been given to Me. Go, therefore, and make disciples of all nations, baptizing
        them in the Name of the Father, and of the Son, and of the Holy Spirit, teaching
        them to observe all that I have commanded you; and behold, I am with you all
        days, even unto the consummation of the world.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Gregory of Nazianzus, Bishop, Treatise on the Faith"
    text:
      la: >-
        Quis catholicórum ignórat Patrem vere esse Patrem, Fílium vere esse Fílium, et
        Spíritum Sanctum vere esse Spíritum Sanctum? sicut ipse Dóminus ad Apóstolos
        suos dicit: Eúntes baptizáte omnes gentes in nómine Patris, et Fílii, et
        Spíritus Sancti. Hæc est perfécta Trínitas in unitáte consístens, quam scílicet
        uníus substántiæ profitémur. Non enim nos secúndum córporum conditiónem,
        divisiónem in Deo fácimus; sed secúndum divínæ natúræ poténtiam, quæ in matéria
        non est, et nóminum persónas vere constáre crédimus, et unitátem divinitátis
        esse testámur.


        Nec extensiónem partis alicújus ex parte, ut quidam putavérunt, Dei Fílium
        dícimus: nec verbum sine re, velut sonum vocis, accípimus: sed tria nómina et
        tres persónas uníus esse esséntiæ, uníus majestátis atque poténtiæ crédimus. Et
        ídeo unum Deum confitémur: quia únitas majestátis, plúrium vocábulo deos
        próhibet appellári. Dénique Patrem et Fílium cathólice nominámus; duos autem
        Deos dícere, nec póssumus, nec debémus. Non quod Fílius Dei Deus non sit, immo
        verus Deus de Deo vero; sed quia non aliúnde, quam de ipso uno Patre, Dei Fílium
        nóvimus, perínde unum Deum dícimus. Hoc enim Prophétæ, hoc Apóstoli tradidérunt:
        hoc ipse Dóminus dócuit, cum dicit: Ego et Pater unum sumus. Unum ad unitátem
        divinitátis, ut dixi, refert; Sumus autem, persónis assígnat.
      en: >-
        There is no Catholic but knoweth that the Father is a Very Father, the Son a
        Very Son, and the Holy Ghost a Very Holy Ghost, even as the Lord Himself saith
        unto His Apostles: "Go ye and baptize all nations in the Name of the Father, and
        of the Son, and of the Holy Ghost." This is that Perfect Trinity Who is but One
        Being, and of Whom therefore we testify that His Substance is one. For we make
        no division in God, as divisions are made in bodies, but we testify that,
        according to the power of the Divine Nature, Which standeth not in matter, the
        Persons named have a real existence, and that God is One.


        We do not say, as some have dreamt, that the Begetting of the Son of God is an
        outgrowing from one part to another part; neither do we say that He is the Word
        in the sense of a mere sound uttered by a voice, but we do believe that these
        three Names and the Persons meant by them are all of only One Being, One
        Majesty, and One Power. And therefore we testify that God is One, because this
        Oneness of His Majesty forbiddeth that we should use the plural form of speech
        and say "Gods." It is Catholic language to say "Father and Son," but we cannot
        and must not say that the Father and the Son are two gods. And that, not because
        the Son of God is not by Himself God — yea, He is Very God of Very God — but
        because we know that the Son of God is not from elsewhere, but from the One
        Father Himself, and therefore we say that God is One. This is the doctrine
        which Prophets and Apostles have delivered; this is the doctrine which the Lord
        Himself taught when He said, "I and the Father are One" — that is, He meant, as
        touching the one Divine Being; but as touching Persons, We are distinct.
    responsory:
      la: "R. Benedicámus Patrem et Fílium cum Sancto Spíritu: * Laudémus et superexaltémus eum in sǽcula.\nV. Benedíctus es, Dómine, in firmaménto cæli: et laudábilis et gloriósus in sǽcula.\nR. Laudémus et superexaltémus eum in sǽcula."
      en: "R. Let us bless the Father, and the Son, and the Holy Ghost: * let us praise and exalt Him above all for ever.\nV. Blessed art thou, O Lord, in the firmament of heaven: and above all to be praised and glorified for ever.\nR. Let us praise and exalt Him above all for ever."
    status: { la: verified, en: verified }
