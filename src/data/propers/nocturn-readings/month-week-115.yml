# Matins Nocturn 2 for "week V of November" (Tempora/115-0.txt), the last
# November Sunday before Advent — see month-week-081.yml's header for the
# id scheme. Live-verified (2026-11-22: "Dominica XXIV et Ultima Post
# Pentecosten V. Novembris"). Responsory reuses 111's own Responsory4
# (source's own cross-reference).
id: month-week-115
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Basil the Great, Homily on Psalm 33"
    text:
      la: >-
        Cum te appetítus inváserit peccándi, velim cógites horríbile illud et intolerábile Christi
        tribúnal, in quo præsidébit judex in alto et excélso throno; astábit autem omnis creatúra, ad
        gloriósum illíus conspéctum contremíscens. Adducéndi étiam nos sumus sínguli, eórum quæ in
        vita gessérimus ratiónem redditúri. Mox illis qui multa mala in vita perpetrárint, terríbiles
        quidam et deformes assístent ángeli, ígneos vultus præ se feréntes atque ignem spirántes, ea re
        propósiti et voluntátis acerbitátem ostendéntes, nocti vultu símiles, propter mærórem et ódium
        in humánum genus.


        Ad hæc cógites profúndum bárathrum, inextricábiles ténebras, ignem caréntem splendóre, uréndi
        quidem vim habéntem, sed privátum lúmine: deínde vérmium genus venénum immíttens, et carnem
        vorans, inexplebíliter edens neque umquam saturitátem sentiens, intolerábiles dolóres
        corrosióne ipsa infígens: postrémo, quod suppliciórum ómnium graviíssimum est, oppróbrium illud
        et confusiónem sempitérnam. Hæc time, et hoc timóre correptus ánimam a peccatórum
        concupiscéntia tamquam freno quodam réprime.


        Hunc timórem Dómini se doctúrum prophéta promísit. Docére autem non simplíciter promísit, sed
        eos qui eum audíre volúerint: non eos qui longíus prolápsi sunt, sed qui salútem appeténtes
        accúrrunt: non aliénos a promissiónibus, sed ex baptísmate filiórum adoptiónis verbo ipsi
        consiliátos atque conjúnctos. Proptérea, Veníte, inquit, hoc est, per bona ópera accédite ad
        me, fílii, quippe qui per regeneratiónem fílii lucis éffici digni facti estis: audíte, qui
        aures cordis habétis apértas; timórem Dómini docébo vos: illum scílicet, quem paulo ante
        oratióne nostra descrípsimus.
      en: >-
        Whenever the desire to sin cometh over thee, I would that thou couldest think of the awful and
        overwhelming judgment-seat of Christ. There the Judge shall sit upon a throne high and lifted
        up. Every creature shall stand before Him, quaking because of the glory of His presence.
        Presently there will be found, by the sides of those who have in life wrought much evil,
        dreadful and hideous angels with faces of fire, and burning breath, appointed thereto, and
        showing their evil will, in appearance like the night, in their despair and hatred of mankind.


        Think again of the bottomless pit, the impenetrable darkness, the lightless fire, burning, but
        not glowing; the poisonous mass of worms, preying upon the flesh, ever feeding, and never
        filled, causing by their gnawing unbearable agony; lastly, the greatest punishment of all, shame
        and confusion for ever. Have a dread of these things, and let that dread correct thee, and be
        as a curb to thy mind to hold it in from the hankering after sin.


        This fear of the Lord the Prophet hath promised to teach. But he hath not promised to teach it
        to all, but only to such as will hear him; not to such as have fallen far away, but to such as
        run to him, hungry for salvation; not to such as have no part in the promises, but to such as by
        baptism are born children of adoption, set at peace and oneness with the Word. "Come, ye
        children," saith he, that is to say, "Draw nigh unto me by good works, all ye who by the new
        birth have become the worthy children of light; hearken unto me, all ye who have the ears of
        your heart opened; I will teach you the fear of the Lord," even the fear of that Being of Whom
        we have just been speaking.
    responsory:
      la: "Super muros tuos, Jerúsalem, constítui custódes; * Tota die et nocte non tacébunt laudáre nomen Dómini.\nV. Prædicábunt pópulis fortitúdinem meam, et annuntiábunt géntibus glóriam meam.\nR. Tota die et nocte non tacébunt laudáre nomen Dómini."
      en: "I have set watchmen upon thy walls, O Jerusalem; * Which shall never hold their peace day nor night, to praise the name of the Lord.\nV. They shall proclaim My might unto the nations, and declare My glory unto the Gentiles.\nR. Which shall never hold their peace day nor night, to praise the name of the Lord."
    status: { la: verified, en: verified }
