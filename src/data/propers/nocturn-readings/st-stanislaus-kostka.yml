# Matins Nocturn 2 and 3 readings for St. Stanislaus Kostka, Confessor. Sourced from
# web/www/horas/Latin/Sancti/Urbis/12-05-StanislausK.txt. Nocturn 2 is Lectio4-6
# combined into one continuous life (the source has no responsories of its own).
# Nocturn 3 is the Gospel (the source gives only the incipit of Matt 19:13, "Et
# réliqua", and that is all that is carried) and Lectio7-9, St. Augustine on Psalm 118
# (the little one, the "júnior"). Nocturn 1 (the source has none of its own) is the
# Scripture course.
#
# Latin: this file is badly damaged by OCR and is corrected silently in the places
# where words were run together or letters misread -- "nomenJesu", "natumaffirmans",
# "linicum" -> "unicum", "Deibeneficio", "palsestra" -> "palæstra", "identidemgelida",
# "beatarumVirginum", "quam dierimi" -> "quam diérum", "testimoomnia" -> "testimónia",
# "dijffundatur", "Osmeum" -> "Os meum", "cdnfitens", "noi oblítus" -> "non oblítus",
# "sedDei", "de quætiam" -> "de qua étiam", "quamsit"; and full stops restored before
# "Mox" and "Quamóbrem". Everything else is verbatim. English is this project's own
# translation, marked draft.
id: st-stanislaus-kostka
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: |
          Stanisláus, senatória Kostkarum gente ortus in Polonia, quam olim esset milítiam secuturus, nomen Jesu prænuntiavit, parituræ matris grémio divínitus inscriptum. Virginitátem adhuc puer ita cóluit, ut paterna in mensa si quid minus pudice dictum audísset, præ horrore exanimis corrueret. Ad Viennense in Austria seminárium studiórum causa missus, non minus exémplo sodálibus quam veneratióni fuit. Coáctus inde in lutherani hospitis ædes migrare, ibíque a Paulo fratre ad liberiorem vitam omni étiam asperitátum génere incitatus, domesticum bellum toto biénnio constantíssime sustínuit, ad ætérna se, non ad caduca natum affirmans. Ítaque unicum illi erat rerum cœlestium desidérium, perpétua cum Deo consuetúdo, cultus Deíparæ ádeo tener, ut matrem suavissime appellaret.

          Quotidianæ fratris vexationi crebra ipse jejúnia, flagélla, aliósque insontis corpusculi cruciátus adjíciens, lethálem in morbum íncidit. Quo ingravescente, cum dæmonem horrendi canis spécie insilientem signo crucis ter fugasset, sacrum Viaticum, quod in hærética domo decúmbens frustra ab homínibus petebat, ab Ángelis accépit. Mox ad púeri Jesu complexum a beatíssima ejus Matre comiter admíssus, ac Societáti jussus nomen dare, súbito convaluit. Sed cum aditum ad illam patris timor in Germania præcluderet, peregrini hábitu, solus, pedes, mendícus fugam arripit, certus non sistere, nisi voti compos fiat. Iter non uno Dei beneficio prósperum fuit. Nam præter ália, Pauli prófugum fratrem jam assequentis equi, immísso divínitus torpore, constiterunt; et Stanisláus Angelórum pane íterum angélico ministério reféctus, post duodecies centéna passuum míllia, tandem Romæ in Societátem Jesu a sancto Francísco Borgia generáli præpósito méruit cooptári.

          Tironis emeriti virtútes in religiósæ vitæ palæstra splendídius eluxere; cáritas præsértim erga Deum, in quem assídue alienata a sénsibus mente rapiebatur. Inde illi fácies semper accensa, nonnúnquam radians, perénnes lácrimæ; ardor pectoris tantus, ut média quoque hieme foret ingésta identidem gelida temperandus. Ítaque amóre vérius quam febri ǽstuans, die assúmptæ in cœlum Vírgini sacro, ad ejus triumphalem pompam própius, ut optaverat, spectandam, ab ipsa beatárum Vírginum choro stipata vocátus est ex Quirinali domo probationis, anno innocentis vitæ décimo octávo, óperum plenior quam diérum. Multis post óbitum miráculis in sua præsértim Polonia enítuit; cujus armis contra formidabiles Turcárum exércitus spectabilis e cœlo affuit non semel, et civitátes álias peste, álias incéndio liberávit. Quamóbrem Clemens décimus eum inter primários totíus regni Patrónos constítuit; Benedíctus vero décimus tértius (quod a Cleménte undécimo jamprídem fúerat decrétum) in sanctórum númerum rétulit.
      en: |
          Stanislaus, sprung of the senatorial family of the Kostkas in Poland, had the name of Jesus, divinely inscribed upon the womb of his mother about to bear him, foretell the soldiery he was one day to follow. As a boy he so cherished virginity that if at his father's table he heard anything said less than chastely, he would fall fainting for horror. Sent for his studies to the school at Vienna in Austria, he was no less an example to his companions than an object of their veneration. Forced to move thence into the house of a Lutheran host, and there incited by his brother Paul to a freer life with every kind of harshness, he sustained a domestic war most steadfastly for two whole years, affirming that he was born for eternal things, not for things that pass. His one desire, therefore, was for heavenly things, his perpetual converse with God, and his devotion to the Mother of God so tender that he called her most sweetly his mother.

          To his brother's daily vexation he himself added frequent fasts, scourgings, and other torments of his innocent little body, and fell into a mortal illness. As it grew worse, having thrice put to flight with the sign of the cross a demon leaping upon him in the shape of a horrible dog, he received from Angels the holy Viaticum, which, lying sick in a heretical house, he had sought in vain from men. Soon, graciously admitted by the most blessed Mother of the Child Jesus to his embrace, and bidden to enter the Society, he suddenly recovered. But since his father's fear barred the way to it in Germany, in a pilgrim's habit, alone, on foot, a beggar, he took to flight, resolved not to stop until he should obtain his desire. The journey was prosperous by more than one favour of God. For besides other things, the horses of Paul, already overtaking the fugitive, were stopped by a numbness sent from heaven; and Stanislaus, again refreshed by angelic ministry with the bread of Angels, after twelve hundred thousand paces, at last deserved to be received at Rome into the Society of Jesus by St. Francis Borgia, the General.

          The virtues of the novice, whose service was soon ended, shone the more splendidly in the training-ground of religious life; chiefly his love for God, in whom he was continually rapt, his mind estranged from the senses. Hence his face always aglow, sometimes radiant, and tears unceasing; and such the ardour of his breast that even in the midst of winter icy water had repeatedly to be poured on him to temper it. Thus, burning with love more truly than with fever, on the day sacred to the Virgin's Assumption into heaven, that he might behold nearer her triumphal procession, as he had wished, he was called, accompanied by the very choir of blessed virgins, from the Quirinal house of probation, in the eighteenth year of his innocent life, fuller of works than of days. After death he was illustrious for many miracles, especially in his own Poland, whose armies he aided visibly from heaven more than once against the formidable hosts of the Turks, and he freed some cities from plague, others from fire. Wherefore Clement the Tenth established him among the chief patrons of the whole kingdom; and Benedict the Thirteenth (which had long before been decreed by Clement the Eleventh) enrolled him in the number of the saints.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: true
    citation:
      la: "Matt 19:13"
      en: "Matt 19:13"
    text:
      la: "In illo témpore: Oblati sunt Jesu párvuli, ut manus eis imponeret. Et réliqua."
      en: "At that time: Little children were presented to Jesus, that he should lay his hands upon them. And so on."
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: false
    source: "St. Augustine, Bishop, Commentary on Psalm 118"
    text:
      la: |
          Quid párvulus, nisi húmilis? Hæc sunt mirabília testimónia tua Dómine, quæ scrutáta est ánima párvuli hujus: et ídeo invénit, quia humiliátus est, et párvulus factus est. Quis enim facit mandáta tua, sicut facienda sunt, id est ex fide, quæ per dilectiónem Dei operátur, nisi ejus in corde per Spíritum sanctum ipsa dilectio diffundatur? Hoc étiam iste párvulus confitétur. Os meum, inquit, apérui, et attráxi spíritum, quia mandáta tua desiderábam. Quid desiderabat, nisi fácere mandáta divína? Sed non erat unde fáceret infírmus fortia, et párvulus magna. Apéruit os, confitens quod per se ipse non fáceret, et attráxit unde fáceret.

          Júnior sum ego, inquit, et contémptus: justificatiónes tuas non sum oblítus. Non sicut inimíci mei, qui oblíti sunt verbórum tuórum. Vidétur autem minor ætáte non oblítus justificatiónes Dei, dolere pro inimícis suis ætáte majóribus, qui oblíti sunt. Nam quid est, Júnior ego non sum oblítus, nisi illi majóres oblíti sunt? Sed contémptum se dicit hic júnior; ídeo factus est major: quia ignobilia et contemptibilia mundi elégit Deus, et ea quæ non sunt, tamquam sint, ut ea quæ sunt, evacuentur. Et ecce sunt novissimi, qui erant primi, et primi, qui erant novissimi.

          Iste autem júnior non est oblítus, quia non suam vóluit habére justítiam, sed Dei; de qua étiam nunc dicit: Justítia tua, justítia in ætérnum. Propter hanc passus est persecutionem júnior a majore, ut díceret júnior quod séquitur: Tribulátio et necéssitas invenérunt me; mandáta tua meditátio mea est. Sæviant, persequantur; dum tamen mandáta Dei non relinquantur, et ex ipsis mandátis étiam qui sæviunt diligantur. Intelléctum da mihi, et vivam. Intelléctum poscit iste júnior, quem si non habéret, non super seniores intellígeret. Sed eum poscit in tribulatióne et necessitáte, quo intelligat quam sit contemnendum quod ei possunt auferre persequéntes inimíci, a quibus se dicit esse contémptum.
      en: |
          What is a little one, but a humble one? These are the wonderful testimonies, O Lord, which the soul of this little one hath searched: and therefore it found, because it was humbled, and became a little one. For who doth thy commandments as they ought to be done, that is, from faith, which worketh by the love of God, unless the love itself be poured abroad in his heart by the Holy Spirit? This also this little one confesseth. I opened my mouth, he saith, and drew in breath, because I longed for thy commandments. What did he long for, but to do the divine commandments? But the weak one had not wherewith to do strong things, nor the little one great. He opened his mouth, confessing that of himself he could not do them, and drew in whence he might do them.

          I am young, he saith, and despised: I have not forgotten thy justifications. Not as my enemies, who have forgotten thy words. Now he seems, though younger in age, not to have forgotten the justifications of God, and to grieve for his enemies who are older in age, who have forgotten. For what is it, I am young, I have not forgotten, but that those elders have forgotten? But this young one calls himself despised; therefore he was made great: because God hath chosen the base and contemptible things of the world, and things that are not, as though they were, that he may bring to nought the things that are. And behold they are last who were first, and first who were last.

          But this young one hath not forgotten, because he would not have a justice of his own, but God's; of which he also now says: Thy justice is justice for ever. For this he suffered persecution, a younger from an older, that the younger might say what follows: Tribulation and anguish have found me; thy commandments are my meditation. Let them rage, let them persecute; so long as God's commandments are not abandoned, and by those very commandments even they who rage are loved. Give me understanding, and I shall live. This young one asks for understanding, which, had he it not, he would not understand more than the elders. But he asks for it in tribulation and anguish, that he may understand how much is to be despised what the persecuting enemies, by whom he says he is despised, can take from him.
    status: { la: verified, en: draft }
