# Matins Nocturn content for Pentecost Ember Saturday (Sabbato Quattuor
# Temporum Pentecostes) — Gospel pericope (Luke 4:38-44, the healing of
# Simon's mother-in-law) sourced from web/www/missa/Latin/Tempora/
# Pasc7-6.txt and missa/English/Tempora/Pasc7-6.txt (horas/Tempora/
# Pasc7-6.txt only gives the incipit "Luc 4:38" + "Et réliqua"); homily
# sourced from horas/Latin/Tempora/Pasc7-6.txt and horas/English/Tempora/
# Pasc7-6.txt.
#
# Only 2 lessons in the source (not padded to 3, matching this day's own
# real shape — unlike Wednesday/Friday's 3): horas/Latin/Tempora/
# Pasc7-6.txt does carry a bare `[Lectio3]` slot, but it's a cross-season
# pointer (`@Tempora/Quad3-4:Lectio3`, a Lent-week-3-Thursday homily
# continuation with no thematic connection to this day), not this day's
# own content, and its own `[Responsory2]`/`[Responsory3]` are likewise
# bare cross-references elsewhere (`@Tempora/Pasc7-1:Responsory1`, a
# different day in the Octave) rather than anything proper to Saturday
# itself — so only the 2 genuinely-this-day's-own lessons (St. Ambrose's
# unbroken homily on Simon's mother-in-law) are used, recombined into
# one reading per the usual convention (see ember-september-friday.yml's
# own doc comment). Responsory is Lectio1's own (Responsory1 =
# @Tempora/Pasc7-0:Responsory2) per the "first one, when several
# collapse" convention.
id: ember-pentecost-saturday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Luc 4:38-44", en: "Luke 4:38-44" }
    text:
      la: >-
        In illo témpore: Surgens Jesus de synagóga, introívit in domum Simónis. Socrus autem Simónis tenebátur
        magnis fébribus: et rogavérunt illum pro ea. Et stans super illam, imperávit febri: et dimísit illam. Et
        contínuo surgens, ministrábat illis. Cum autem sol occidísset, omnes qui habébant infírmos váriis
        languóribus, ducébant illos ad eum. At ille síngulis manus impónens, curábat eos. Exíbant autem dæmónia
        a multis clamántia et dicéntia: Quia tu es Fílius Dei: et íncrepans non sinébat ea loqui, quia sciébant
        ipsum esse Christum. Facta autem die egréssus ibat in desértum locum, et turbæ requirébant eum, et
        venérunt usque ad ipsum: et detinébant illum, ne discéderet ab eis. Quibus ille ait: Quia et áliis
        civitátibus opórtet me evangelizáre regnum Dei: quia ídeo missus sum. Et erat prǽdicans in synagógis
        Galilǽæ.
      en: >-
        At that time, Jesus rose from the synagogue and entered Simon's house. Now Simon's mother-in-law was
        suffering from a great fever, and they besought Him for her. And standing over her He rebuked the fever,
        and it left her; and she rose at once and began to wait on them. Now when the sun was setting, all who
        had persons sick with various diseases brought them to Him. And He laid His hands upon each of them and
        cured them. And devils also came forth from many, crying out and saying, You are the Son of God. And He
        rebuked them, and did not permit them to speak, because they knew that He was the Christ. Now when it was
        day, He went out and departed into a desert place. And the crowds were seeking after Him, and they came
        to Him, and tried to detain Him, that he might not depart from them. But He said to them, To the other
        towns also I must proclaim the kingdom of God, for this is why I have been sent. And He was preaching in
        the synagogues of Galilee.
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, Book 4 on Luke 4 (on the healing of Simon's mother-in-law)"
    text:
      la: >-
        Vide cleméntiam Dómini Salvatóris: nec indignatióne commótus nec scélere offénsus, nec injúria violátus
        Judǽam déserit: quin étiam ímmemor injúriæ, memor cleméntiæ, nunc docéndo, nunc liberándo, nunc sanándo,
        infídæ plebis corda demúlcet. Et bene sanctus Lucas virum ab spíritu nequítiæ liberátum ante præmísit, et
        subdit féminæ sanitátem. Utrúmque enim sexum Dóminus curatúrus advénerat: sed prior sanári débuit, qui
        prior creátus est; nec prætermítti illa, quæ mobilitáte magis ánimi, quam pravitáte peccáverat.


        Sábbato medicínæ Domínicæ ópera cœpta signíficat, ut inde nova creatúra cœ́perit, ubi vetus creatúra ante
        desívit: nec sub lege esse Dei Fílium, sed supra legem in ipso princípio designáret: nec solvi legem, sed
        impléri. Neque enim per legem, sed verbo factus est mundus, sicut légimus: Verbo Dómini cæli firmáti
        sunt. Non sólvitur ergo lex, sed implétur: ut fiat renovátio hóminis jam labéntis. Unde et Apóstolus ait:
        Exspoliántes vos véterem hóminem, indúite novum, qui secúndum Deum creátus est.
      en: >-
        Behold here how long-suffering is the Lord our Redeemer! Neither moved to anger against them, nor
        sickened at their guilt, nor outraged by their attacks, did He leave the Jews' country. Nay, forgetting
        their iniquity, and mindful only of His mercy, He strove to soften their hard and unbelieving hearts,
        sometimes by His teaching, and sometimes by freeing some of them, and sometimes by healing them. St. Luke
        doth well to tell us first of the man who was delivered from an unclean spirit, and then of the healing
        of a woman. The Lord indeed came to heal both sexes, but that must be healed first which was created
        first, and then must not she be passed by whose first sin arose rather from fickleness of heart than
        from depraved will.


        That the Lord began to heal on the Sabbath-day showeth in a figure how that the new creation beginneth
        where the old creation ended. It showeth, moreover, that the Son of God, Who is come not to destroy the
        law but to fulfill the law, is not under the law, but above the law. Neither was it by the law, but by
        the Word, that the world was created, as it is written — By the Word of the Lord were the heavens made.
        The law, then, is not destroyed, but fulfilled, in the Redemption of fallen man. Whence also the Apostle
        saith: Put off, concerning the former conversation, the old man, which is corrupt according to the
        deceitful lusts, and be renewed in the spirit of your mind, and put on the new man, which after God is
        created in righteousness and true holiness.
    responsory:
      la: "R. Repléti sunt omnes Spíritu Sancto: et cœpérunt loqui, prout Spíritus Sanctus dabat éloqui illis: * Et convénit multitúdo dicéntium, allelúia.\nV. Loquebántur váriis linguis Apóstoli magnália Dei.\nR. Et convénit multitúdo dicéntium, allelúia."
      en: "R. They were all filled with the Holy Ghost, and began to speak, as the Holy Ghost gave them utterance; * And the multitude came together, saying: Alleluia.\nV. The Apostles spoke in diverse tongues the wonderful works of God.\nR. And the multitude came together, saying: Alleluia."
    status: { la: verified, en: verified }
