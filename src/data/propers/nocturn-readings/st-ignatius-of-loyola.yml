id: st-ignatius-of-loyola
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Ignatius, natióne Hispanus, nobili genere Loyolæ in Cantabria natus,
        primo catholici regis aulam, deínde milítiam secutus est. In
        propugnatióne Pampelonénsi accepto vulnere gráviter decumbens, ex
        fortuita piórum librórum lectióne, ad Christi Sanctorúmque sectanda
        vestígia mirabíliter exársit. Ad montem Serrátum profectus, ante aram
        beátæ Vírginis suspénsis armis, noctem éxcubans, sacræ milítiæ
        tirocinium pósuit. Inde, ut erat indútus sacco, traditis antea mendíco
        pretiósis vestibus, Manresam secessit; ubi, emendicato pane et aqua
        víctitans, exceptisque diébus Dominicis, jejunans, aspera catena
        cilicióque carnem domans, humi cubans, et férreis se flagellis
        cruentans, per annum commorátus est, claris adeo illustratiónibus a Deo
        recreatus, ut póstea dicere sólitus sit: Si sacræ Litteræ non
        exstarent, se tamen pro fide mori parátum ex iis solum, quæ sibi
        Manresæ patefécerat Dóminus. Quo témpore, homo litterárum plane rudis,
        admirábilem illum compósuit exercitiórum librum, Sedis apostolicæ
        judício et ómnium utilitate comprobátum.


        Ut vero se ad animárum lucra rite formaret, subsidium litterárum, a
        grammatica inter púeros exorsus, adhibére státuit. Cumque nihil
        interim omitteret de studio alienæ salútis, mirum est quas ubíque
        locórum ærúmnas ac ludibria devoráverit, asperrima quæque, et víncula
        et verbera pene ad mortem usque perpéssus. Lutetiæ Parisiórum
        adjunctis sibi ex illa academía variárum natiónum sociis novem, qui
        omnes artium magistériis et theologíæ gradibus insignes erant, ibidem
        in monte Mártyrum prima ordinis fundaménta jecit, quem póstea Romæ
        instítuens, ad tria consueta quarto addito de Missiónibus voto, Sedi
        apostolicæ arctius adstrinxit; et Paulus tertius primo recepit
        confirmavítque, mox alii Pontifices ac Tridentina synodus probavére.
        Ipse autem, misso ad prædicándum Indis Evangélium sancto Francisco
        Xaverio, aliisque in alias mundi plagas ad religiónem propagandam
        disseminatis, éthnicæ superstitióni hæresique bellum indixit; eo
        successu continuátum, ut constans fúerit ómnium sensus, étiam
        pontificio confirmátus oraculo, Deum, sicut alios aliis tempóribus
        sanctos viros, ita Luthéro ejusdemque témporis hæreticis Ignatium et
        institutam ab eo societátem objecisse.


        Sed in primis inter Catholicos instaurare pietátem curæ fuit.
        Templórum nitor, catechismi traditio, conciónum ac sacramentórum
        frequéntia ab ipso increméntum accepére. Ipse, apertis ubíque locórum
        ad juventútem erudiéndam in litteris ac pietáte gymnasiis, eréctis
        Romæ Germanórum collegio, male nuptárum et periclitántium puellárum
        cœnobiis, utriusque sexus tam orphanórum quam catechumenórum dómibus,
        aliisque pietátis opéribus, indeféssus lucrandis Deo ánimis instábat.
        In dæmones mirum exercuit impérium. Vultum ejus cælésti luce
        radiántem sanctus Philippus Nerius aliique conspexere. Denique,
        ætátis anno sexagesimo quinto, ad Dómini sui amplexum, cujus majórem
        glóriam in ore semper habúerat, semper in ómnibus quæsíerat,
        emigrávit. Quem Gregórius décimus quintus, magnis in Ecclésiam
        meritis et miraculis illustrem, Sanctórum fastis adscripsit.
      en: >-
        Ignatius was a Spaniard by nation, and was born of the noble Biscayan
        family of Loyola. He followed first the Court and then the army of the
        Most Catholic King. At the siege of Pampeluna he received a severe
        wound which laid him up with a long and dangerous illness. During this
        time he chanced to read some godly books, and conceived from them a
        burning desire to follow in the footsteps of Christ and His saints. He
        betook himself to Monserrat, and there entered himself for the heavenly
        warfare, by hanging up his weapons, and watching them for a night
        before the Altar of the Blessed Virgin. Thence he withdrew to Manresa,
        clad in sackcloth, for he had before given his costly raiment to a
        beggar. At Manresa he lived upon bread and water, begging the bread,
        and fasting every day except the Lord's Day. He mastered his flesh by
        the use of a sharp chain and hair-cloth, slept upon the ground, and
        lashed himself to bloodshedding with iron scourges. Thus he dwelt for
        a year, feasted by God with such clear lights, that he was used
        afterwards to say that even if the Holy Bible had not existed, he
        would have been ready to die for the faith only on the evidence of
        those things which the Lord had shown unto him at Manresa. It was at
        this time that, albeit a man of little education, he put together that
        wonderful book entitled Spiritual Exercises, whose worth hath been
        attested by the judgment of the Apostolic See, and by universal
        usefulness.


        To make himself of greater use for the profit of souls, he determined
        to improve himself by education, beginning by going through the
        rudiments among little boys. He left nothing untried that could help
        towards the salvation of others, and it was marvellous what pain and
        mockery he cheerfully accepted on all hands, suffering ill-usage also,
        imprisonment and stripes almost unto death. At Paris he took to him
        seven comrades from the members of that University, men of different
        nations, but who had all taken the Degree of Master of Arts and in
        Divinity. With these seven he laid the first foundations of the
        Society of Jesus in the crypt at Montmartre. When he afterwards
        organised the same Society at Rome he bound it by the closest bonds to
        the Apostolic See, adding to the three accustomed vows of Poverty,
        Chastity, and Obedience, a fourth, concerning Missions. Paul III. was
        the first Pope to receive and confirm the Institute, but it has since
        been approved by other Popes and by the Council of Trent. Ignatius, to
        spread the Faith, sent holy Francis Xavier to preach the Gospel in the
        Indies, and others in other parts of the world, and the war, which he
        thus proclaimed against paganism and heresy, was waged with such
        success, that it was the general belief, confirmed by the utterance of
        the Pope, that even as God had in other times raised up holy men
        specially to meet the needs of their day, so He had raised up against
        Luther and the heretics of that age, Ignatius and the Society which he
        had founded.


        But the first care of Ignatius was to set forward godliness among
        Catholics. He was a great promoter of seemliness in the Churches,
        instruction in the Catechism, and often hearing Sermons and using the
        Sacraments. He opened schools everywhere to train up boys in godliness
        and good learning. At Rome he founded the German College, a home for
        fallen and another for imperilled girls, an orphanage for boys and
        another for girls, houses for converts under instruction, and other
        godly institutions. He never wearied in his work of gaining souls for
        God. He exercised an extraordinary power over devils. Holy Philip
        Neri and others saw heavenly light shining from his face. At last, in
        the year of our Redemption 1556 and of his own age the sixty fifth,
        he passed away to the embrace of that Lord Whose greater glory had
        been the constant theme of his words and aim of all his works. He is
        very illustrious in the Church on account of his great deeds and
        miracles, and Gregory XV. enrolled him in the Kalendar of the Saints.
    status: { la: verified, en: verified }
