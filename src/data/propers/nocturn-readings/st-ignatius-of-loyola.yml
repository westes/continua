# Matins Nocturn 2 reading for St. Ignatius of Loyola, Confessor
# (July 31). Sourced directly from web/www/horas/Latin/Sancti/07-31.txt,
# English/Sancti/07-31.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in his own file (a direct
# `@Commune/C1a:LectioN` cross-reference) -- not transcribed, per the
# bare-cross-reference convention.
#
# Verified 2026-09-05 (Gospel-pairing sweep): confirmed genuinely absent.
# Sancti/07-31.txt's own Lectio7-9 are a bare `@Commune/C1a:Lectio7-9`
# redirection (Common of a Confessor Not a Bishop) with no saint-specific
# citation or homily text of their own in this file -- there is no proper
