id: month-week-094
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, On Elijah and Fasting, ch. 9"
    text:
      la: >-
        Poténtes vinum prohibéntur bíbere, ne, cum bíberint, obliviscántur sapiéntiam. Dénique bibébant
        vinum in ebrietáte poténtes, qui Holoférni príncipi milítiæ regis Assyriórum se trádere
        gestiébant; sed non bibébant fémina Judith, jejúnans ómnibus diébus viduitátis suæ, præter
        festórum diérum solemnitátes. His armis muníta procéssit et omnem Assyriórum circumvénit
        exércitum. Sóbrii vigóre consílii ábstulit Holoférnis caput, servávit pudicítiam, victóriam
        reportávit.


        Hæc enim succíncta jejúnio in castris prætendébat aliénis; ille vino sepúltus jacébat, ut ictum
        vúlneris sentíre non posset. Ítaque uníus mulíeris jejúnium innúmeros stravit exércitus
        Assyriórum. Esther quoque púlchrior facta est jejúnio; Dóminus enim grátiam sóbriæ mentis
        augébat. Omne genus suum, id est, totum pópulum Judæórum a persecutiónis acerbitáte liberávit,
        ita ut regem sibi fáceret esse subjéctum.


        Itaque illa, quæ tríduo jejunávit contínuo, et corpus suum aqua lavit, plus plácuit, et
        vindíctam rétulit. Aman autem, dum se regáli jactat convívio, inter ipsa vina pœnam suæ
        ebrietátis exsólvit. Est ergo jejúnium reconciliatiónis sacrifícium, virtútis increméntum, quod
        fecit étiam féminas fortióres augménto grátiæ. Jejúnium nescit fæneratórem, non sortem fǽnoris
        novit: non rédolet usúras mensa jejunántium. Etiam ipsis jejúnium convíviis dat grátiam:
        dulcióres post famem épulæ fiunt, quæ assiduitáte fastídio sunt, et diutúrna continuatióne
        viléscunt. Condiméntum cibi jejúnium est: quanto avídior appeténtia, tanto esca jucúndior.
      en: >-
        It is not for kings to drink wine, nor for princes strong drink, lest they drink and forget the
        law. (Prov. 31:5.) The rulers drank wine even unto drunkenness, who planned to deliver
        themselves into the hand of Holofernes, captain of the host of the King of the Assyrians; but
        the woman Judith drank not, who fasted all the days of her widowhood, saving the solemn
        Feast-days. She went forth in the harness of this abstinence, and over-reached the whole army
        of the Assyrians. By the clear thought of her soberness she took away the head of Holofernes,
        kept her chastity, and carried off the victory.


        Armed with fasting, she entered the camp of the strangers; he lay soaked in wine, so that he
        could not feel the blow that slew him. And thus the fast of one woman overthrew the countless
        armies of the Assyrians. Esther also became fairer by fasting, for the Lord gave favour unto
        her for her soberness. She delivered all her nation, that is, the whole people of the Jews, from
        the fierceness of persecution, so that she brought down the King himself under her will.


        Thus also she who fasted three days, and washed her body with water, found greater favour, and
        obtained vengeance, whereas Haman, who boasted himself at the King's table, paid the penalty of
        his drunkenness, even while yet he was in his cups. Fasting, therefore, is a sacrifice of
        reconciliation, a means of strength, whereby in the might of grace, women wax manful. Fasting
        knoweth not usury, nor the gain of the usurer; the faster's table smelleth not of usury, but the
        fast itself giveth favour to them that sit at meat. A banquet is all the pleasanter after
        hunger, whereas by constant use it becometh unattractive, and when it is long carried on cometh
        to be lightly esteemed. Fasting is a good sauce for meat. The keener the appetite, the more
        toothsome the food.
    responsory:
      la: "R. Nos álium Deum nescímus præter Dóminum, in quo sperámus: * Qui non déspicit nos, nec ámovet salútem suam a génere nostro.\nV. Indulgéntiam ipsíus fusis lácrimis postulémus, et humiliémus illi ánimas nostras.\nR. Qui non déspicit nos, nec ámovet salútem suam a génere nostro."
      en: "R. We know no strange God before the Lord. In Him we trust. * He despiseth us not, neither putteth He away His salvation from our nation.\nV. His mercy let us seek with tears, and humble our souls before Him.\nR. He despiseth us not, neither putteth He away His salvation from our nation."
    status: { la: verified, en: verified }
