# Matins Nocturn 2-3 readings for St. Andrew, Apostle (Nov 30) —
# SanctiM/11-30.txt inherits the whole day (`@Sancti/11-30`) with no
# Nocturn 2/3 override, so this feast's own proper content is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-30.txt, English/Sancti/11-30.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita
# (including the famous "O bona crux" address to the cross).
# Nocturn 3: Lectio7's Gospel citation (Matt 4:18-22) is a bare
# incipit ("Et réliqua") with no full pericope text given, so — per
# the pre-1955 pass's convention of not transcribing bare incipits —
# only the homily portion is authored (not marked isGospel), a single
# excerpt of Pope St. Gregory the Great's homily. No responsory given
# for either reading.
id: st-andrew
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Andréas Apóstolus, Bethsáidæ natus, qui est Galilǽæ vicus, frater Petri, discípulus
        Joánnis Baptistæ, cum eum de Christo dicéntem audísset: Ecce Agnus Dei; secútus
        Jesum, fratrem quoque suum ad eúndem perdúxit. Cum póstea una cum fratre
        piscarétur in mari Galilǽæ, ambo a prætereúnte Christo Dómino ante álios Apóstolos
        vocáti illis verbis: Veníte post me, fáciam vos fíeri piscatóres hóminum; nullam
        interponéntes moram, et relíctis rétibus, secúti sunt eum. Post cujus passiónem et
        resurrectiónem, Andréas, cum in Scýthiam Európæ, quæ ei província ad Christi fidem
        disseminándam obtígerat, venísset, deínde Epírum ac Thráciam peragrásset; doctrína
        et miráculis innumerábiles hómines ad Christum convértit. Post, Patras Achájæ
        proféctus, et in ea urbe plúrimis ad veritátem evangélicam perdúctis, Ægéam
        procónsulem, prædicatióni evangélicæ resisténtem, libérrime increpávit, quod, qui
        judex hóminum habéri vellet, Christum Deum ómnium júdicem, a dæmónibus elúsus, non
        agnósceret.


        Tum Ægéas irátus, Désine, inquit, Christum jactáre, cui simília verba nihil
        profuérunt, quóminus a Judǽis crucifigerétur. Andréam vero de Christo nihilóminus
        líbere prædicántem quod pro salúte humáni géneris se crucifigéndum obtulísset,
        ímpia oratióne interpéllat, ac demum hortátur, ut sibi cónsulens, diis velit
        immoláre. Cui Andréas: Ego omnipoténti Deo, qui unus et verus est, ímmolo cotídie,
        non taurórum carnes, nec hircórum sánguinem, sed immaculátum Agnum in altári; cujus
        carnem posteáquam omnis pópulus credéntium manducáverit, Agnus, qui sacrificátus
        est, ínteger persevérat et vivus. Quam ob rem ira accénsus Ægéas, jubet eum in
        cárcerem detrúdi unde pópulus Andréam fácile liberásset, nisi ipse sedásset
        multitúdinem, veheméntius rogans, ne se ad optatíssimam martýrii corónam
        properántem impedírent.


        Igitur paulo post in tribúnal prodúctum, cum Ægéas crucis extolléntem mystéria
        sibíque suam impietátem exprobrántem diútius ferre non posset, in crucem tolli, et
        Christi mortem imitári jussit. Addúctus Andréas ad locum martýrii, cum crucem
        vidísset, longe exclamáre cœpit: O bona crux, quæ decórem ex membris Dómini
        suscepísti, diu desideráta, sollícite amáta, sine intermissióne quæsíta, et
        aliquándo cupiénti ánimo præparáta: áccipe me ab homínibus, et redde me magístro
        meo; ut per te me recípiat, qui per te me redémit. Itaque cruci affíxus est: in qua
        bíduum vivus pendens, et Christi fidem prædicáre nunquam intermíttens, ad eum
        migrávit, cujus mortis similitúdinem concupíerat. Ejus ossa primum Constantíno
        imperatóre Constantinópolim, deínde Amálphim transláta sunt. Caput, Pio secúndo
        Pontífice, Romam allátum, in basílica sancti Petri collocátum est.
      en: >-
        The Apostle Andrew was born at Bethsaida, a town of Galilee, and was the brother of
        Peter. He was a disciple of John the Baptist, and heard him say of Christ, Behold the
        Lamb of God, whereupon he immediately followed Jesus, bringing his brother also with
        him. Some while after, they were both fishing in the Sea of Galilee, and the Lord
        Christ, going by, called them both, before any other of the Apostles, in the words,
        Follow Me, and I will make you fishers of men. They made no delay, but left their
        nets, and followed Him. After the death and Resurrection of Christ, Andrew was
        allotted Scythia as the province of his preaching, and, after labouring there, he
        went through Epirus and Thrace, where he turned vast multitudes to Christ by his
        teaching and miracles. Finally he went to Patras in Achaia, and there also he
        brought many to the knowledge of Gospel truth. Aegeas the Pro-consul resisted the
        preaching of the Gospel, and the Apostle freely rebuked him, bidding him know that
        while he held himself a judge of his fellow men, he was himself hindered by devils
        from knowing Christ our God, the Judge of all.


        Then Egeas, being angry, answered him, Boast no more of this thy Christ. He spake
        words even such as thine, but they availed Him not, and He was crucified by the
        Jews. Whereto Andrew boldly answered that Christ had given Himself up to die for
        man's salvation; but the Pro-consul blasphemously interrupted him, and bade him look
        to himself, and sacrifice to the gods. Then said Andrew, We have an altar, whereon
        day by day I offer up to God, the Almighty, the One, and the True, not the flesh of
        bulls nor the blood of goats, but a Lamb without spot; and when all they that believe
        have eaten of the Flesh Thereof, the Lamb That was slain abideth whole and liveth.
        Then Aegeas being filled with wrath, bound the Apostle in prison. Now, the people
        would have delivered him, but he himself calmed the multitude, and earnestly
        besought them not to take away from him the crown of martyrdom, for which he longed
        and which was now drawing near.


        Come a short while after, he was brought before the judgment-seat, where he
        extolled the mystery of the cross, and rebuked Aegeas for his ungodliness. Then
        Aegeas could bear with him no longer, but commanded him to be crucified, in
        imitation of Christ. Andrew, then, was led to the place of martyrdom, and, as soon
        as he came in sight of the cross, he cried out, O precious cross, which the Members
        of my Lord have made so goodly, how long have I desired thee! how warmly have I
        loved thee! how constantly have I sought thee! And, now that thou art come to me, how
        is my soul drawn to thee! Welcome me from among men, and join me again to my Master,
        that as by thee He redeemed me, so by thee also He may take me unto Himself. So he
        was fastened to the cross, whereon he hung living for two days, during which time he
        ceased not to preach the faith of Christ, and, finally, passed into the Presence of
        Him the likeness of Whose death he had loved so well. Under the Emperor Constantine
        the bones of the Apostle were first taken to Constantinople, whence they were
        afterwards brought to Amalfi. In the Pontificate of Pope Pius II his head was carried
        to Rome, where it is kept in the Basilica of St. Peter.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "Pope St. Gregory the Great, Homily 5 on the Gospels (on Matt 4:18-22)"
    text:
      la: >-
        Audístis, fratres caríssimi, quia ad uníus jussiónis vocem Petrus et Andréas
        relíctis rétibus secúti sunt Redemptórem. Nulla vero hunc fácere adhuc mirácula
        víderant, nihil ab eo de prǽmio ætérnæ retributiónis audíerant: et tamen ad unum
        Dómini præcéptum hoc quod possidére videbántur, oblíti sunt. Quanta nos ejus
        mirácula vidémus, quot flagéllis afflígimur, quantis minárum asperitátibus
        deterrémur, et tamen vocántem sequi contémnimus.


        In cælo jam sedet, qui de conversióne nos ádmonet; jam jugo fídei colla géntium
        súbdidit, jam mundi glóriam stravit, jam ruínis ejus crebrescéntibus, distrícti sui
        judícii diem propinquántem denúntiat: et tamen supérba mens nostra adhuc non vult
        hoc sponte desérere, quod cotídie perdit invíta. Quid ergo, fratres caríssimi, quid
        in ejus judício dictúri sumus, qui ab amóre præséntis sǽculi nec præcéptis
        fléctimur, nec verbéribus emendámur?
      en: >-
        Dearly beloved brethren, ye hear how that Peter and Andrew, having once heard the
        Lord call them, left their nets, and followed their Saviour. As yet they had seen
        none of His miracles, as yet they had received no promise of their exceeding and
        eternal reward; nevertheless, at one word of the Lord they forgot all those things
        which they seemed to have. We have seen many of His miracles; we have received many
        of His gracious chastenings; many times hath He warned us of the wrath to come; and
        yet Christ calleth and we do not follow.


        He who calleth us to be converted is now enthroned in heaven; He hath broken the
        necks of the Gentiles to the yoke of the faith, He hath laid low the glory of the
        world, and the wrecks thereof, falling ever more and more to decay, do preach unto us
        that the coming of that day when He is to be revealed as our Judge is drawing nigh;
        and yet, so stubborn is our mind, that we will not yet freely abandon that which,
        will we, nill we, we lose day by day. Dearly beloved brethren, what shall we answer
        at His judgment-seat, we whom no lessons can persuade, and no stripes can break of
        the love of this present world?
    status: { la: verified, en: verified }
