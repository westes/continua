# Matins Nocturn 2-3 readings for the Holy Name of the Blessed Virgin
# Mary (Sep 12). Sourced directly from
# web/www/horas/Latin/Sancti/09-12.txt, English/Sancti/09-12.txt.
# Nocturn 2: Lectio4-6, St. Bernard's own homily on the name of Mary
# ("Star of the Sea"), combined into one reading. Nocturn 3: the
# Gospel citation ends "Et réliqua"/"And so on" with no full pericope
# given -- per the bare-incipit convention, only the homily (Lectio7-9,
# St. Peter Chrysologus) is authored, isGospel: false, no citation
# field.
id: holy-name-of-mary
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Bernard of Clairvaux, 2nd Homily on Luke 1:26 (Missus Est)"
    text:
      la: >-
        Et nomen, inquit, Vírginis Maria. Loquámur pauca, et super hoc
        nómine, quod interpretátum maris stella dícitur, et Matri Vírgini
        valde conveniénter aptátur. Ipsa namque aptíssime síderi
        comparátur, quia sicut sine sui corruptióne sidus suum emíttit
        rádium, sic absque sui læsióne Virgo parturívit Fílium. Nec
        síderi rádius suam mínuit claritátem, nec Vírgini Fílius suam
        integritátem. Ipsa est ígitur nóbilis illa stella ex Jacob orta,
        cujus rádius univérsum orbem illúminat, cujus splendor et
        præfúlget in supérnis, et ínferos pénetrat; terras étiam
        perlústrans, et calefáciens magis mentes quam córpora, fovet
        virtútes, éxcoquit vítia. Ipsa, inquam, est præclára et exímia
        stella super hoc mare magnum et spatiósum necessário subleváta,
        micans méritis, illústrans exémplis.


        O quisquis te intélligis in hujus sǽculi proflúvio magis inter
        procéllas et tempestátes fluctuáre, quam per terram ambuláre; ne
        avértas óculos a fulgóre hujus síderis, si non vis óbrui
        procéllis. Si insúrgant venti tentatiónum, si incúrras scópulos
        tribulatiónum, réspice stellam, voca Maríam. Si jactáris
        supérbiæ undis, si ambitiónis, si detractiónis, si æmulatiónis,
        réspice stellam, voca Maríam. Si iracúndia aut avarítia aut
        carnis illécebra navículam concússerit mentis, réspice ad
        Maríam. Si críminum immanitáte turbátus, consciéntiæ fœditáte
        confúsus, judícii horróre pertérritus, bárathro incípias
        absorbéri tristítiæ, desperatiónis abýsso, cógita Maríam.


        In perículis, in angústiis, in rebus dúbiis Maríam cógita,
        Maríam ínvoca. Non recédat ab ore, non recédat a corde; et, ut
        ímpetres ejus oratiónis suffrágium, non déseras conversatiónis
        exémplum. Ipsam sequens, non dévias; ipsam rogans, non despéras;
        ipsam cógitans, non erras; ipsa tenénte, non córruis; ipsa
        protegénte, non métuis; ipsa duce, non fatigáris; ipsa propítia,
        pérvenis: et sic in temetípso experíris quam mérito dictum sit:
        Et nomen Vírginis María. - Quod quidem venerábile nomen,
        jamprídem in quibúsdam christiáni orbis pártibus speciáli ritu
        cultum, Innocéntius undécimus Románus Póntifex, ob insígnem
        victóriam sub ejusdem Vírginis Maríæ præsídio de immaníssimo
        Turcárum tyránno, cervícibus pópuli christiáni insultánti,
        Viénnæ in Austria partam, et in perenne tanti benefícii
        monuméntum, in Ecclésia universáli síngulis annis celebrári
        præcépit.
      en: >-
        It is said: And the virgin's name was Mary. Let us speak a few
        words upon this name, which signifieth, being interpreted, Star
        of the Sea, and suiteth very well the Maiden Mother, who may very
        meetly be likened unto a star. A star giveth forth her rays
        without any harm to herself, and the Virgin brought forth her
        Son without any hurt to her virginity. The light of a star
        taketh nothing away from the star itself, and the birth of her
        offspring took nothing away from the Virginity of Mary. She is
        that noble star which was to come out of Jacob, whose brightness
        still sheddeth lustre upon all the earth, whose rays are most
        brilliant in heaven, and shine even unto hell, lighting up earth
        midway, and warming souls rather than bodies, fostering good and
        scaring away evil. She, I say, is a clear and shining star,
        twinkling with excellencies, and resplendent with example,
        needfully set to look down upon the surface of this great and
        wide sea.


        Thou, whosoever thou art, that knowest thyself to be here not so
        much walking upon firm ground, as battered to and fro by the
        gales and storms of this life's ocean, if thou wouldest not be
        overwhelmed by the tempest, keep thine eyes fixed upon this
        star's clear shining. If the hurricanes of temptation rise
        against thee, or thou art running upon the rocks of trouble, look
        to the star, call on Mary. If the waves of pride, or ambition, or
        slander, or envy toss thee, look to the star, call on Mary. If
        the billows of anger or avarice, or the enticements of the flesh
        beat against thy soul's bark, look to Mary. If the enormity of
        thy sins trouble thee, if the foulness of thy conscience confound
        thee, if the dread of judgment appall thee, if thou begin to slip
        into the deep of despondency, into the pit of despair, think of
        Mary.


        In danger, in difficulty, or in doubt, think on Mary, call on
        Mary. Let her not be away from thy mouth or from thine heart, and
        that thou mayest not lack the succour of her prayers, turn not
        aside from the example of her conversation. If thou follow her,
        thou wilt never go astray. If thou pray to her, thou wilt never
        have need to despair. If thou keep her in mind, thou wilt never
        wander. If she hold thee, thou wilt never fall. If she lead
        thee, thou wilt never be weary. If she help thee, thou wilt reach
        home safe at the last; and so thou wilt prove in thyself how
        meetly it is said: And the virgin's name was Mary. Particular
        honours were already paid to this worshipful name in diverse
        parts of the Christian world, but the Bishop of Rome, Innocent
        XI, ordered this Feast in honour of it to be held every year
        throughout the whole Church, as an everlasting thanksgiving for
        the great blessing that, under her protection, the brutal Sultan
        of the Turks, who was trampling upon the necks of the Christian
        population, was thoroughly beaten before the walls of Vienna.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Peter Chrysologus, Sermon 142, on the Annunciation"
    text:
      la: >-
        Audístis hódie, fratres caríssimi, Angelum cum muliere de hóminis
        reparatióne tractántem. Audístis agi, ut homo cursibus eisdem,
        quibus delapsus fuerat ad mortem, rediret ad vitam. Agit, agit
        cum Maria Angelus de salúte, quia cum Heva angelus egerat de
        ruína. Audístis Angelum de carnis nostræ limo templum divinæ
        majestátis arte ineffábili construentem. Audístis in terris Deum
        in cælis hóminem sacraménto incomprehensibili collocari. Audístis
        inaudíta ratióne in uno corpore Deum hominémque misceri. Audístis
        frágilem nostræ carnis natúram ad portandam totam Deitátis
        glóriam angelica exhortatióne roborari.


        Denique, ne tanto pónderi cæléstis fabricæ in Maria subtilis
        nostri corporis arena succumberet, et in Vírgine totius generis
        humani portatúra fructum, virga ténuis frangerétur; fugatúra
        metum vox Angeli mox præcessit, dicens: Ne timeas, Maria. Ante
        causam dignitas Vírginis annuntiátur ex nómine; nam Maria Hebræo
        sermóne, Latine Domina nuncupátur. Vocat ergo Angelus Dominam, ut
        Dominatoris Genitricem trepidátio déserat servitutis, quam nasci
        et vocari Dominam ipsa sui Gérminis fecit et impetrávit
        auctoritas. Ne timeas, Maria, invenísti enim grátiam. Verum est,
        quia, qui invénit grátiam, nescit timére: Invenísti grátiam.


        Beata, quæ inter hómines audíre sola méruit præ ómnibus:
        Invenísti grátiam. Quantam? Quantam supérius díxerat: plenam. Et
        vere plenam, quæ largo imbre totam fúnderet et infúnderet
        creatúram: Invenísti enim grátiam apud Deum. Hæc cum dicit, et
        ipse Angelus mirátur, aut féminam tantum, aut omnes hómines vitam
        meruísse per féminam: stupet Angelus totum Deum veníre intra
        virginális úteri angústias, cui tota simul angústa est creatúra.
        Hinc est quod remorátur Angelus, hinc est quod vírginem vocat de
        mérito, de grátia compéllat, vix causam prodit audiénti, sane ut
        sensum promóveat, vix longa trepidatióne compónit.
      en: >-
        Dearly beloved brethren, ye have this day heard how an Angel
        treated with a woman touching the regeneration of mankind. Ye
        have heard how it was arranged that man should return to life by
        the same mean whereby he had fallen into death. The Angel
        treateth, treateth with Mary concerning salvation, because an
        angel had treated with Eve concerning destruction. Ye have heard
        how an Angel set about to raise with unspeakable building a
        temple of the Divine Majesty out of the dust of the earth. Ye
        have heard how by a mystery which cannot be understood, God got a
        place on earth and man a place in heaven. Ye have heard how by a
        working hitherto unheard of, God and man are joined together in
        one Body. Ye have heard how at the message of an angel, the weak
        nature whereof our flesh is sharer, became strong to bear the
        whole glory of the Godhead.


        Then, lest the frail clay of humanity should break down under
        the weight of God's work, and in Mary the tender stem should
        snap, which was about to bear the fruit of all mankind, the
        Angel's first words were a preventive against fear. And the
        Angel said unto her: Fear not, Mary. Even before the matter is
        revealed, the exalted station of this Virgin is made clear by
        her very name, for the name Mary is an Hebrew word, and
        signifieth Lady. The Angel therefore greeteth her as Lady, that
        the Mother of the Lord may lay aside the fearfulness of His
        handmaiden, whom the will of her own Offspring had made to be
        born and to be called a Lady. Fear not, Mary, for thou hast
        found grace. He that hath found grace, need fear no more. Thou
        hast found grace.


        Blessed is she who alone among mankind, and first among mankind
        deserved to hear: Thou hast found grace. And how much grace?
        Even as the Angel had said: Full! Full of grace. Full indeed!
        Grace like a bountiful shower drenched and soaked her whole
        being. For thou hast found grace with God. As he saith this,
        even the Angel doth marvel. He marvelleth that a woman should
        merit eternal life, that all men should merit it through her.
        The Angel marvelleth that the whole Godhead, he to whom the
        entire universe is small, should enter the narrow womb of a
        virgin. So he delayeth. He calleth her virgin. That was her
        right. He haileth her as full of grace.
    status: { la: verified, en: verified }
