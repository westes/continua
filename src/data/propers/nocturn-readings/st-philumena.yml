# Matins Nocturn 2 reading for St. Philumena, Virgin and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/09-06-Philumena.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-philumena
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Inter cétera Mártyrum sepulchra, quæ in cœmetério Priscíllæ ad viam Salariam reperiri
        solent, illud éxstitit quo repósitum fúerat sanctæ Philumenæ corpus, uti ex tumuli
        inscriptione tribus laterculis apposita perlegebatur. Licet vero invénta ibídem fúerit
        phiala sánguinis, et ália insculpta conspicerentur martyrii insígnia, doléndum tamen est,
        res ab eádem gestas, actaque ac genus martyrii quod ipsa fecit, obscúra perstitisse. Ceterum
        ubi primum sacrum hoc corpus, ex beneficéntia Pii séptimi inítio pontificátus ejus accéptum,
        cúltui fidélis pópuli propósitum fuit Mugnani in Nolana diœcési, ingens íllico famæ
        celebritas ac religio erga sanctam Mártyrem percrebuit, præsértim ob signa, quæ ejúsdem
        præsídio accessisse undique ferebátur. Hinc factum est ut complurium antístitum, cultorumque
        Mártyris postulationibus permótus Gregórius décimus sextus Póntifex Máximus, univérsa rei
        ratióne matúre perpensa, festum ejúsdem cum Offício et Missa in memorata Nolana diœcési et
        álibi agendum benigne permiserit.
      en: >-
        Among the other sepulchres of Martyrs which are wont to be found in the cemetery of
        Priscilla on the Salarian Way, there was one in which the body of holy Philumena had been
        laid, as was read from the inscription of the tomb, set with three tiles. Although a phial
        of blood was found there, and other carved signs of martyrdom were seen, it is nevertheless
        to be lamented that the things done by her, and the acts and kind of martyrdom she
        underwent, have remained obscure. But as soon as this sacred body, received through the
        beneficence of Pius the Seventh at the beginning of his pontificate, was set forth for the
        veneration of the faithful people at Mugnano in the diocese of Nola, great celebrity of fame
        and devotion toward the holy Martyr at once spread abroad, especially on account of the
        signs which were reported from everywhere to have occurred through her protection. Whence it
        came about that Gregory the Sixteenth, Supreme Pontiff, moved by the petitions of very many
        prelates and of the Martyr's devotees, the whole matter having been maturely weighed,
        graciously permitted her feast with Office and Mass to be celebrated in the said diocese of
        Nola and elsewhere.
    status: { la: verified, en: draft }
