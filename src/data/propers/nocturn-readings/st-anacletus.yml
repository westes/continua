# Matins Nocturn 2 reading for St. Anacletus, Pope, Martyr (Jul 13).
# No genuine SanctiM match: the only SanctiM file for this date,
# `SanctiM/07-13Moct.txt`, belongs to the Octave of St. Benedict (Jul
# 11-18 is the Monastic calendar's own octave of its patron's Mar 21
# feast) — a missed pre-1955-pool candidate rather than a genuine
# SanctiM case (see memory vu-matins-pre1955-saints,
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/07-13.txt, English/Sancti/07-13.txt.
# Lectio4 (Anacletus's own vita) and Lectio5-6 (St. Ambrose's
# exposition of Psalm 118, a genuinely distinct patristic source) kept
# split. No responsory given in the source.
#
# Checked 2026-09-05 for a Gospel pairing: both readings here are
# Nocturn 2 (Lectio4-6). St. Ambrose's Psalm 118 exposition is a psalm
# commentary applied generically to a persecuted martyr, not tied to
# any Gospel pericope -- no isGospel pairing applies. Note for a future
# pass, of particular interest given this app's own Monastic-1617-track
# structural default: 07-13.txt's default modern rubric ends at
# Lectio94 with no Nocturn 3 at all, but it also carries an explicit
# alternate "(rubrica 1570 aut rubrica 1617)" Lectio7-9 -- a genuine
# Nocturn 3 (Gospel Luke 14:26-33, "Si quis venit ad me, et non odit
# patrem suum", with Pope St. Gregory's Homily 37 on the Gospels) not
# authored anywhere in this store. This is a new reading pair under an
# alternate historical rubric, not a missing Gospel citation on an
# existing homily, so out of scope for this pass.
id: st-anacletus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Anacletus Atheniensis, Trajano imperatore rexit Ecclesiam. Decrevit, ut episcopus a
        tribus episcopis, neque a paucioribus consecraretur, et clerici sacris ordinibus
        publice a proprio episcopo initiarentur: et ut in Missa, peracta consecratione omnes
        communicarent. Beati Petri sepulcrum ornavit, Pontificumque sepulturæ locum attribuit.
        Fecit ordinationes duas mense Decembri, quibus creavit presbyteros quinque, diaconos
        tres, episcopos sex. Sedit annos novem, menses tres, dies decem. Martyrio coronatus,
        sepultus est in Vaticano.
      en: >-
        Anacletus was an Athenian who governed the Church in the time of the Emperor Trajan. He
        ordained that a Bishop should be consecrated by three Bishops and no less, that clerks
        should be publicly ordained to Holy Orders by their own Bishop, and that in the Mass,
        after the Consecration, all should afterwards Communicate. He adorned the grave of
        Blessed Peter, and ordered a place for burying the Popes in. He held two ordinations in
        the month of December, wherein he ordained five Priests, three Deacons, and six Bishops.
        He sat as Pope nine years, three months, and ten days. He received the crown of his
        testimony, and was buried on the Vatican Hill.
    status: { la: verified, en: verified }

  - nocturn: 2
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, Exposition of Psalm 118, Sermon 21"
    text:
      la: >-
        Principes persecuti sunt me gratis: et a verbis tuis trepidavit cor meum. Bene hoc
        Martyr dicit, quod injuste persecutionum tormenta sustineat: qui nihil rapuerit, nullum
        violentus oppresserit, nullius sanguinem fuderit, nullius torum putaverit esse
        violandum: qui nihil legibus debeat, et graviora latronum sustinere cogatur supplicia:
        qui loquatur juste, et non audiatur: qui loquatur plena salutis, et impugnetur: ut
        possit dicere, Cum loquebar illis, impugnabant me gratis. Gratis igitur persecutionem
        patitur, qui impugnatur sine crimine; impugnatur quasi noxius, cum sit in tali
        confessione laudabilis: impugnatur quasi veneficus, qui in nomine Domini gloriatur, cum
        pietas virtutum omnium fundamentum sit.


        Vere frustra impugnatur, qui apud impios et infidos impietatis arcessitur, cum fidei
        sit magister. Verum qui gratis impugnatur, fortis debet esse et constans, quomodo ergo
        subtexuit: Et a verbis tuis trepidavit cor meum? Trepidare infirmitatis est, timoris
        atque formidinis. Sed est étiam infirmitas ad salutem, est étiam timor sanctorum.
        Timete Dominum omnes sancti ejus: et, Beatus vir, qui timet Dominum. Qua ratione beatus?
        Quia in mandatis ejus cupit nimis.
      en: >-
        Princes have persecuted me without a cause; but my heart standeth in awe of thy word.
        These are rightly the words of a martyr, who beareth unjustly the torments of the
        persecutors, who hath robbed no man, who hath violently oppressed no man, who hath shed
        the blood of no man, who hath imagined to defile the bed of no man, who is debtor to the
        laws in nothing, and who is punished more grievously than if he were a robber: who
        speaketh righteousness, and there is none that will hear: who speaketh salvation, and all
        men fight against him: who is able to say: When I spoke unto them, they fought against me
        without a cause. They fight against him without a cause, who can lay no sin to his
        charge; they fight against him as an evildoer, who is by their own acknowledgment
        righteous: they fight against him as a warlock, who glorieth in the name of the Lord, and
        who doeth all things well because he doeth all things for God's sake.


        They fight against him in vain who is accused of ungodliness among the ungodly and the
        unfaithful, because he teacheth Faith. Verily, him that is fought against without a cause
        it behoveth to be strong and patient. Wherefore then saith he: My heart standeth in awe of
        thy word? Awe is the mark of the weak, the timid, and the fearful. But there is also a
        weakness unto salvation, there is a fear which is an holy fear. O fear the Lord, all ye
        His Saints. And again: Blessed is the man that feareth the Lord. And wherefore is he
        blessed? Because he delighteth greatly in His commandments.
    status: { la: verified, en: verified }
