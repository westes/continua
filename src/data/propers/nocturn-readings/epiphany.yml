# Matins Nocturn 2/3 readings for epiphany, generated from the engine render (Monastic Tridentinum 1617, 2027-01-06); Latin and English both from the page.
# Nocturn 1's scripture slot is the user's own reading plan (see DESIGN.md), so the Isaiah lessons are not authored here. Contiguous lessons of the source are folded into one reading, with the responsory of the last lesson of the group (the same convention the Rosary and Circumcision files follow).
id: epiphany
readings:
  - nocturn: 2
    isGospel: false
    source: "From the Sermons of Pope St. Leo (the Great), 2nd for Twelfth-Day."
    text:
      la: |
        Gaudéte in Dómino, dilectíssimi, íterum dico, gaudéte: quóniam brevi intervállo témporis, post solemnitátem Nativitátis Christi, festívitas declaratiónis ejus illúxit: et quem in illo die Virgo péperit, in hoc mundus agnóvit. Verbum enim caro factum, sic susceptiónis nostræ temperávit exórdia, ut natus Jesus et credéntibus maniféstus, et persequéntibus esset occúltus.

        Jam tunc ergo cæli enarravérunt glóriam Dei, et in omnem terram sonus veritátis exívit, quando et pastóribus exércitus Angelórum Salvatóris éditi annuntiátor appáruit, et Magos ad eum adorándum prǽvia stella perdúxit: ut a solis ortu usque ad occásum veri Regis generátio coruscáret, cum rerum fidem et regna Oriéntis per Magos díscerent, et Románum impérium non latéret.

        Nam et sævítia Heródis volens primórdia suspécti sibi Regis exstínguere, huic dispensatíoni nésciens serviébat: ut dum atróci inténtus facínori, ignótum sibi púerum indiscréta infántium cæde perséquitur, annuntiátum cǽlitus dominatóris ortum insígnior ubíque fama loquerétur: quam promptiórem ad narrándum, diligentiorémque faciébat et supérnæ significatiónis nóvitas, et cruentíssimi persecutóris impíetas. Tunc autem étiam Ægýpto Salvátor illátus est, ut gens antíquis erróribus dédita, jam ad vicínam salútem per occúltam grátiam signarétur: et quæ nondum ejécerat ab ánimo superstitiónem, jam hospítio recíperet veritátem.

        Agnoscámus ergo, dilectíssimi, in Magis adoratóribus Christi, vocatiónis nostræ fideíque primítias: et exsultántibus ánimis beátæ spei inítia celebrémus. Exínde enim in ætérnam hereditátem cœ́pimus introíre: exínde nobis Christum loquéntia Scripturárum arcána patuérunt, et véritas, quam Judæórum obcæcátio non récipit, ómnibus natiónibus lumen suum invéxit. Honorétur ítaque a nobis sacratíssimus dies, in quo salútis nostræ Auctor appáruit: et quem Magi infántem veneráti sunt in cunábulis, nos omnipoténtem adorémus in cælis. Ac sicut illi de thesáuris suis mýsticas Dómino múnerum spécies obtulérunt, ita et nos de córdibus nostris, quæ Deo sunt digna, promámus.
      en: |
        Dearly beloved brethren, rejoice in the Lord; again I say, rejoice. But a few days are past since the solemnity of Christ's Birth, and now the glorious light of His Manifestation is breaking upon us. On that day the Virgin brought Him forth, and on this the world knew Him. The Word made Flesh was pleased to reveal Himself by degrees to those for whom He had come. When Jesus was born He was manifested indeed to the believing, but hidden from His enemies.

        Already indeed the heavens declared the glory of God, and their sound went out into all lands, when the Herald Angels appeared to tell to the shepherds the glad tidings of a Saviour's Birth; and now the guiding star leadeth the wise men to worship Him, that from the rising of the sun to the going down thereof, the Birth of the true King may be known abroad; that through those wise men the kingdoms of the east might learn the great truth, and the Roman empire remain no more in darkness.

        The very cruelty of Herod, when he strove to crush at His birth this King Whom he alone feared, was made a blind means to carry out this dispensation of mercy. While the tyrant with horrid guilt sought to slay the little Child he did not know, amid an indiscriminate slaughter of innocents, his infamous act served to spread wider abroad the heaven-told news of the Birth of the Lord. Thus were these glad tidings loudly proclaimed, both by the novelty of their story, and the iniquity of their enemies. Then was the Saviour borne into Egypt, that nation, of a long time hardened in idolatry, might by the mysterious virtue which went out of Him, even when His presence was unknown, be prepared for the saving light so soon to dawn on them, and might receive the Truth as a wanderer even before they had banished falsehood.

        Dearly beloved brethren, we recognize in the wise men who came to worship Christ, the first-fruits of that dispensation to the Gentiles wherein we also are called and enlightened. Let us then keep this Feast with grateful hearts, in thanksgiving for our blessed hope, whereof it doth commemorate the dawn. From that worship paid to the new-born Christ is to be dated the entry of us Gentiles upon our heirship of God and co-heirship with Christ. Since that joyful day the Scriptures which testify of Christ have lain open for us as well as for the Jews. Yea, their blindness rejected that Truth, Which, since that day, hath shed Its bright beams upon all nations. Let all observance, then, be paid to this most sacred day, whereon the Author of our salvation was made manifest, and as the wise men fell down and worshipped Him in the manger, so let us fall down and worship Him enthroned Almighty in heaven. As they also opened their treasures and presented unto Him mystic and symbolic gifts, so let us strive to open our hearts to Him, and offer Him from thence some worthy offering.
    responsory:
      la: "R. Interrogábat Magos Heródes: Quod signum vidístis super natum Regem? † Stellam vídimus fulgéntem, cujus splendor illúminat mundum: * Et nos cognóvimus et vénimus adoráre Dóminum.\nV. Magi véniunt ab Oriénte inquiréntes fáciem Dómini et dicéntes.\nR. Et nos cognóvimus et vénimus adoráre Dóminum."
      en: "R. Herod inquired of the wise men: What sign have you concerning him that is born king? We have seen a star shining, the brightness whereof enlightens the world. * And we have known, and are come to worship the Lord.\nV. There came wise men from the east, seeking the face of the Lord and saying.\nR. And we have known, and are come to worship the Lord."
    status: { la: verified, en: verified }
  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 2:1-12", en: "Matt 2:1-12" }
    text:
      la: "Cum natus esset Jesus in Béthlehem Juda in diébus Heródis regis, ecce Magi ab Oriénte venérunt Jerosólymam, dicéntes: Ubi est qui natus est Rex Judæórum? Et réliqua."
      en: "When Jesus therefore was born in Bethlehem of Juda, in the days of king Herod, behold, there came wise men from the east to Jerusalem, saying: Where is he that is born king of the Jews? And so on."
    status: { la: verified, en: verified }
  - nocturn: 3
    isGospel: false
    source: "Homily by Pope St. Gregory the Great., 10th on the Gospels"
    text:
      la: |
        Sicut in lectióne evangélica, fratres caríssimi, audístis, cæli Rege nato, rex terræ turbátus est: quia nimírum terréna altitúdo confúnditur, cum celsitúdo cæléstis aperítur. Sed quæréndum nobis est, quidnam sit, quod, Redemptóre nato, pastóribus in Judǽa Angelus appáruit, atque ad adorándum hunc ab Oriénte Magos non Angelus, sed stella perdúxit?

        Quia vidélicet Judǽis, tamquam ratióne uténtibus, rationále ánimal, id est, Angelus prædicáre débuit: gentíles vero, quia uti ratióne nesciébant, ad cognoscéndum Dóminum non per vocem, sed per signa perducúntur. Unde étiam per Paulum dícitur: Prophetíæ fidélibus datæ sunt, non infidélibus: signa autem infidélibus, non fidélibus. Quia et illis prophetíæ tamquam fidélibus, non infidélibus: et istis signa tamquam infidélibus, non fidélibus data sunt. Et notándum, quod Redemptórem nostrum, cum jam perféctæ esset ætátis, eísdem gentílibus Apóstoli prǽdicant, eúmque párvulum, et necdum per humáni córporis offícium loquéntem, stella géntibus denúntiat: quia nimírum ratiónis ordo poscébat, ut et loquéntem jam Dóminum loquéntes nobis prædicatóres innotéscerent, et necdum loquéntem eleménta muta prædicárent. Sed in ómnibus signis, quæ vel nascénte Dómino, vel moriénte eo monstráta sunt, considerándum nobis est, quanta fúerit in quorúmdam Judæórum corde durítia, qui hunc nec per prophetíæ donum, nec per mirácula agnovérunt. Omnia quippe eleménta auctórem suum venísse testáta sunt. Ut enim de eis quiddam usu humáno loquar: Deum hunc cæli esse cognovérunt, quia prótinus stellam misérunt. Mare cognóvit, quia sub plantis ejus se calcábile prǽbuit. Terra cognóvit, quia eo moriénte contrémuit. Sol cognóvit, quia lucis suæ rádios abscóndit. Saxa et paríetes cognovérunt, quia témpore mortis ejus scissa sunt. Inférnus agnóvit, quia hos, quos tenébat mórtuos, réddidit. Et tamen hunc, quem Dóminum ómnia insensibília eleménta sensérunt, adhuc infidélium Judæórum corda Deum esse mínime cognóscunt, et durióra saxis, scindi ad pœniténdum nolunt.
      en: |
        Dearly beloved brethren, hear ye from the Gospel lesson how, when the King of heaven was born, the king of earth was troubled? The heights of heaven are opened and the depths of earth are stirred. Let us now consider the question, why, when the Redeemer was born, an angel brought the news to the shepherds of Judea, but a star led the wise men of the East to worship Him.

        It seemeth as if the Jews as reasonable creatures received a revelation from a reasonable being, that is, an angel, but the Gentiles without, being as brutes, are roused not by a voice, but by a sign, that is, a star. Hence Paul hath it: a sign, not to them that believe, but to them that believe not but prophesying serveth not for them that believe not, but for them which believe. 1 Cor. xiv. 22. So the prophesying, that is, of the angel was given to them that believed, and the sign to them that believed not. Thus also we remark that afterwards the Redeemer was preached among the Gentiles not by Himself, but by His Apostles, even as, when a little Child, He is shown to them, not by the voice of angels, but merely by the vision of a star. When He Himself had begun to speak He was made known to us by speakers, but when He lay silent in the manger, by that silent testimony in heaven. But whether we consider the signs which accompanied His birth or His death, this thing is wonderful, namely, the hardness of heart of the Jews, who would not believe in Him either for prophesying or for miracles. All things which He had made, bore witness that their Maker was come. Let me reckon them after the manner of men. The heavens knew that He was God, and sent a star to shine over where He lay. The sea knew it, and bore Him up when He walked upon it. The earth knew it, and quaked when He died. The sun knew it, and was darkened. The rocks and walls knew it, and rent at the hour of His death. Hell knew it, and gave up the dead that were in it. And yet up to this very hour the hearts of the unbelieving Jews will not acknowledge that He to Whom all nature testified is their God, and, being more hardened than the rocks, refuse to be rent by repentance.
    responsory:
      la: "R. Hic est dies præclárus in quo Salvátor mundi appáruit, † quem prophétæ predixérunt, Angeli annuntiavérunt: * Cujus stellam Magi vidéntes gavísi sunt, et múnera ei obtulérunt.\nV. Dies sanctificátus illúxit nobis: † veníte gentes et adoráte Dóminum.\nR. Cujus stellam Magi vidéntes gavísi sunt, et múnera ei obtulérunt."
      en: "R. This is the great day in which the Savior of the world appeared, whom the Prophets foretold, the Angels announced. * At whose star the Magi rejoiced, and offered Him gifts.\nV. The day of sanctification has shined upon us: peoples, come and adore the Lord.\nR. At whose star the Magi rejoiced, and offered Him gifts."
    status: { la: verified, en: verified }
