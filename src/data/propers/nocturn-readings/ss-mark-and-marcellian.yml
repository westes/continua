# Matins Nocturn 2 reading for Ss. Mark and Marcellian, Martyrs (Jun
# 18). No genuine SanctiM match: the correct Tridentine file is the
# suffixed `Sancti/06-18t.txt` (the plain `Sancti/06-18.txt` is St.
# Ephrem the Syrian instead, a different saint occupying the general
# calendar's own June 18 slot), and the only SanctiM file for this
# date, `SanctiM/06-18.txt`, bases `@Sancti/06-18` (Ephrem, not Mark
# and Marcellian) — same "don't trust the plain file" wrinkle as the
# pre-1955 pass (memory vu-matins-pre1955-saints); a missed
# pre-1955-pool candidate rather than a genuine SanctiM case (see
# memory vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-18t.txt, English/Sancti/06-18t.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: ss-mark-and-marcellian
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Marcus et Marcellianus fratres Romani, propter christianam fidem a Fabiano duce
        comprehensi, ad stipitem alligati sunt, pedibus clavis confixis. Ad quos cum ita
        loqueretur judex: Resipiscite miseri, et vos ipsos ab his cruciatibus eripite:
        responderunt: Numquam tam jucunde epulati sumus, quam hæc libenter Jesu Christi causa
        perferimus, in cujus amóre nunc fixi esse cœpimus: utinam tamdiu nos hæc pati sinat,
        quamdiu hoc corruptibili corpore vestiti erimus. Qui diem noctemque in tormentis
        divinas laudes canentes, denique telis transfixi, ad martyrii gloriam pervenerunt.
        Quorum corpora via Ardeatina sepulta sunt.
      en: >-
        Mark and Marcellian were two brothers, Romans, who were arrested by Duke Fabian for
        believing in Christ, and fastened to a beam, to which their feet were nailed. The Judge
        said to them: Wretched creatures, do think for a moment, and free yourselves from such
        suffering. But they answered him: We have never enjoyed any dinner so much as we do what
        we are now undergoing here for Jesus Christ's sake. We have got ourselves a little fast to
        His love now. Would that He would let us suffer this as long as we are clad in this
        corruptible body. Still suffering, they for a day and a night sang the praises of God
        continually, and in the end were thrust through with darts, and so attained the glory of
        Martyrdom. Their bodies are buried upon the Way to Ardea.
    status: { la: verified, en: verified }
