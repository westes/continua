# Matins Nocturn 2-3 readings for the Chair of St. Peter at Rome (Jan
# 18) — SanctiM/01-18.txt inherits the whole day (`@Sancti/01-18`);
# only Lectio4 is overridden (with unrelated Eastertide filler content,
# `@Tempora/Pasc5-0:Lectio3`, evidently a generic 12-lesson-slot filler
# rather than anything about St. Peter, so not used here) — Lectio5-8
# are not overridden and carry through as this feast's own proper
# content, same as a pre-1955 saint (see memory vu-matins-pre1955-saints).
# web/www/horas/Latin/Sancti/01-18.txt, English/Sancti/01-18.txt.
#
# Nocturn 2: Lectio4-6 (St. Leo the Great's sermon on Ss. Peter and
# Paul) combined into one reading, one continuous excerpt.
# Nocturn 3: Lectio7's Gospel pericope (Matt 16:13-19) is a full short
# passage, authored as a genuine Gospel reading; Lectio7's homily
# portion + Lectio8 (St. Hilary of Poitiers's commentary) combined into
# one reading, one continuous excerpt. No responsory given for either.
id: chair-of-st-peter-at-rome
readings:
  - nocturn: 2
    isGospel: false
    source: "Pope St. Leo the Great, Sermon 1 on Ss. Peter and Paul"
    text:
      la: >-
        Cum duódecim Apóstoli, accépta per Spíritum Sanctum ómnium locutióne linguárum, imbuéndum
        Evangélio mundum, distribútis sibi terrárum pártibus, suscepíssent, beatíssimus Petrus,
        princeps apostólici órdinis, ad arcem Románi destinátur impérii, ut lux veritátis, quæ in
        ómnium géntium revelabátur salútem, efficácius se ab ipso cápite per totum mundi corpus
        effúnderet. Cujus autem natiónis hómines in hac tunc urbe non essent? aut quæ usquam
        gentes ignorárent quod Roma didicísset?


        Hic conculcándæ philosophíæ opiniónes, hic dissolvéndæ erant terrénæ sapiéntiæ vanitátes,
        hic confutándi dǽmonum cultus, hic ómnium sacrilegiórum impíetas destruénda, ubi
        diligentíssima superstitióne habebátur colléctum quidquid usquam fúerat vanis erróribus
        institútum. Ad hanc ergo urbem tu, beatíssime Petre Apóstole, veníre non métuis, et,
        consórte glóriæ tuæ Paulo Apóstolo, aliárum adhuc ecclesiárum ordinatiónibus occupáto,
        silvam istam freméntium bestiárum, et turbullentíssimæ profunditátis océanum, constántior
        quam cum supra mare graderéris, ingréderis.


        Jam pópulos, qui ex circumcisióne credíderant, erudíeras: jam Antiochénam ecclésiam, ubi
        primum christiáni nóminis dignitas est orta, fundáveras: jam Pontum, Galátiam,
        Cappadóciam, Asiam atque Bithýniam légibus evangélicæ prædicatiónis impléveras; nec aut
        dúbius de provéctu óperis, aut de spátio tuæ ignárus ætátis, trophǽum crucis Christi
        Románis árcibus inferébas, quo te divínis præordinatiónibus anteíbant, et honor
        potestátis, et glória passiónis.
      en: >-
        When the twelve holy Apostles had received from the Holy Ghost the power to speak all
        languages, they divided the whole world into districts, which they severally allotted to
        themselves as fields for their Gospel labours. Then was Peter, the Prince of the Apostles,
        sent to the capital city of the Roman Empire, that he might cause the light to shine thence
        throughout the whole body of the civilized nations. At that time what nation was there that
        had no representative in Rome? When Rome had learnt, what people that did not learn too?


        In Rome were the dreams of an unbelieving philosophy to be destroyed, in Rome were the
        empty utterances of earthly wisdom to be confuted, in Rome was idolatry to be overcome, in
        Rome profanity to be put down, even in Rome, where the activity of superstition had
        gathered together from the whole earth every error which it could find. O most blessed
        Apostle Peter! this was the city to which thou didst not shrink to come. The Apostle Paul,
        thy comrade in glory, was yet occupied in founding the Churches, and thou didst enter alone
        into that forest of wild beasts roaring furiously; thou didst commit thyself to that stormy
        ocean, more boldly than when thou walkest upon the waters to come to Jesus.


        Thou hadst already taught them of the circumcision who were converted; thou hadst founded
        the Church of Antioch, the first that bore the noble name of Christian; thou hadst
        published the law of the Gospel throughout Pontus, Galatia, Cappadocia, Asia, and
        Bithynia; and thou didst not fear for the hardness of thy work, nor turn back because of
        thine old age, but didst boldly set up the trophy of the cross of Christ upon those Roman
        walls, where the Providence of God had appointed the throne of thine honour, and the
        glorious scene of thy passion.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 16:13-19", en: "Matt 16:13-19" }
    source: "St. Hilary of Poitiers, Bishop, Commentary on Matthew 16"
    text:
      la: >-
        In illo témpore: Venit Jesus in partes Cæsaréæ Philíppi, et interrogábat discipulos suos,
        dicens: Quem dicunt hómines esse Fílium hóminis? Et réliqua.


        Dóminus a discípulis requírit, quem se hómines esse dícerent; ut adjécit, hóminis fílium.
        Hæc enim confessiónis tenénda rátio est, ut sicut Dei Fílium, ita et fílium hóminis
        meminérimus: quia álterum sine áltero nihil spei tríbuit ad salútem. Editis ítaque, quæ
        diversæ de eo erant, hóminum opiniónibus, quid de se ipse séntiant quærit. Petrus
        respóndit: Tu es Christus Fílius Dei vivi. Sed Petrus conditiónes propositiónis expénderat.
        Dóminus enim díxerat: Quem me hómines esse dicunt, fílium hóminis? Et certe fílium hóminis
        contemplátio córporis præferébat. Sed addéndo, Quem me esse dicunt, significávit, præter
        id quod in se videbátur, esse áliud sentiéndum: erat enim hóminis fílius. Quod ígitur de se
        opinándi judícium desiderábat? Non illud arbitrámur, quod de se ipse conféssus est: sed
        occúltum erat de quo quærebátur, in quod se credéntium fides debébat exténdere.


        Et dignum plane conféssio Petri præmium consecúta est, quia Dei Fílium in hómine vidísset.
        Beátus hic est, qui ultra humánum óculos intendísse et vidísse laudátus est: non id quod ex
        carne et sánguine erat cóntuens, sed Dei Fílium cæléstis Patris revelatióne conspíciens;
        dignúsque judicátus, qui quod in Christo Dei esset, primus agnósceret. O in nuncupatióne
        novi nóminis felix Ecclésiæ fundaméntum, dígnaque ædificatióne illíus petra, quæ inférnas
        leges, et tártari portas, et ómnia mortis claustra dissólveret! O beátus cæli jánitor,
        cujus arbítrio claves ætérni áditus tradúntur, cujus terréstre judícium præjudicáta
        auctóritas sit in cælo!
      en: >-
        At that time, Jesus came into the quarters of Cesarea Philippi: and he asked his disciples,
        saying: Whom do men say that the Son of man is? And so on.


        The Lord asketh His disciples who men say that He is, and He addeth, He, the Son of Man.
        Let us ever remember to hold fast this truth of our profession, namely, that the Son of God
        is the Son of Man also. Were He one and not the other, then were He no Saviour for us. The
        Lord then, having heard the various opinions of men, asketh, But Who say ye that I am? And
        Simon Peter answered and said Thou art the Christ, the Son of the living God. Peter had
        weighed the questions. The Lord had asked, Who do men say that I, the Son of Man, am? That
        He was Son of Man was sufficiently evident to all who looked upon His Body. But when He
        spake of His whole Self, and asked, Who do ye say that I am? He showed that the mind had
        something to grasp beyond That Which was seen, for Son of Man He was manifestly. What
        judgment did He wish them to give? I think it was not that which He had owned concerning
        Himself. That something more, which He wished them to own, was a hidden thing, whereunto
        the faith of them that believed in Him was to reach.


        Peter's confession was followed by a proper reward for having seen the Son of God in the
        Son of Man. Blessed is this holy Apostle, in whose praise it is said that he saw with more
        than human eyes That Which was unseen, who gazed upon Flesh and Blood, and by the secret
        revelation of the Heavenly Father recognised the Eternal Son of God; who was the first
        thought worthy to acknowledge the Divinity of Christ. God bless thee, O Peter, thou who by
        uttering for the first time the title of Divine honour, didst lay the goodly foundation of
        the Church! God bless thee, thou worthy rock whereon she is built, for ever triumphant over
        the infernal powers, the gates of hell, and the bands of death! God bless thee, happy
        door-keeper of heaven, to whose keeping are given the keys of the everlasting mansions,
        whose sentences on earth are already confirmed in heaven.
    status: { la: verified, en: verified }
