# Matins Nocturn 2 reading for All Saints (Nov 1) — SanctiM/11-01.txt
# inherits the whole day (`@Sancti/11-01`) with no Nocturn 2/3
# override, so this feast's own proper content is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-01.txt, English/Sancti/11-01.txt.
# Lectio4-6 combined into one reading, one continuous excerpt of the
# Venerable Bede's sermon. No responsory given in the source for these
# lessons.
id: all-saints
readings:
  - nocturn: 2
    isGospel: false
    source: "The Venerable Bede, Priest, Sermon 18 on the Saints"
    text:
      la: >-
        Hódie, dilectíssimi, ómnium Sanctórum sub una solemnitátis lætítia celebrámus
        festivitátem: quorum societáte cælum exsúltat, quorum patrocíniis terra lætátur,
        triúmphis Ecclésia sancta coronátur, quorum conféssio quanto in passióne fórtior,
        tanto est clárior in honóre: quia, dum crevit pugna, crevit et pugnántium glória, et
        martýrii triúmphus multíplici passiónum génere adornátur: perque gravióra torménta,
        gravióra fuére et prǽmia: dum cathólica mater Ecclésia, quæ per totum orbem longe
        latéque diffúsa est, in ipso cápite suo Christo Jesu edúcta est, contumélias, cruces
        et mortem non timére; magis magísque roboráta, non resisténdo, sed perferéndo,
        univérsis, quos ágmine ínclito carcer pœnális inclúsit, pari et símili calóre
        virtútis ad geréndum certámen, glóriam triumphálem inspirávit.


        O vere beáta mater Ecclésia, quam sic honor divínæ dignatiónis illúminat, quam
        vincéntium gloriósus Mártyrum sanguis exórnat, quam inviolátæ confessiónis cándida
        índuit virgínitas! Flóribus ejus nec rosæ nec lília desunt. Certent nunc caríssimi,
        sínguli, ut ad utrósque honóres amplíssimam accípiant dignitátem, corónas, vel de
        virginitáte cándidas, vel de passióne purpúreas. In cæléstibus castris pax et ácies
        habent flores suos, quibus mílites Christi coronántur.


        Dei enim ineffábilis et imménsa bónitas étiam hoc provídit, ut labórum quidem tempus
        et agónis non exténderet, nec longum fáceret, aut ætérnum, sed breve, et ut ita dicam,
        momentáneum: ut in hac brevi et exígua vita agónes essent et labóres; in illa vero
        quæ ætérna est, corónæ et prǽmia meritórum: ut labóres quidem cito finiréntur,
        meritórum vero prǽmia sine fine durárent: ut post hujus mundi ténebras visúri essent
        candidíssimam lucem, et acceptúri majórem passiónum cunctárum acerbitátibus
        beatitúdinem, testánte hoc idem Apóstolo, ubi ait: Non sunt condígnæ passiónes
        hujus témporis ad superventúram glóriam, quæ revelábitur in nobis.
      en: >-
        Dearly beloved brethren: This day we keep, with one great cry of joy, a Feast in memory
        of all God's holy children; His children, whose presence is a gladness to heaven; His
        children, whose prayers are a blessing to earth; His children, whose victories are the
        crown of the Holy Church; His chosen, whose testifying is the more glorious in honour,
        as the agony in which it was given was the sterner in intensity, for as the dreader
        grew the battle, so the grander grew the fighters, and the triumph of martyrdom waxed
        the more incisive by the multiplicity of suffering, and the heavier the torment the
        heavier the prize. And it is our Mother, the Catholic Church, spread far and wide
        throughout all this planet, it is she that hath learnt, in Christ Jesus her Head, not to
        fear shame, nor cross, nor death, but hath waxed lealer and lealer, and, not by
        fighting, but by enduring, hath breathed into all that noble band who have come up to
        the bitter starting-post the hope of conquest and glory which hath warmed them manfully
        to accept the race.


        If a verity thou art blessed, O my Mother the Church! The blaze of God's mercy beateth
        full upon thee; thine adornment is the glorious blood of victorious Martyrs, and thy
        raiment the virgin whiteness of untarnished orthodoxy; thy garlands lack neither roses
        nor lilies. And now, dearly beloved brethren, let each one of us strive to gain the
        goodly crown of one sort or the other, either the glistening whiteness of purity, or
        the red dye of suffering. In the army in heaven peace and war have both chaplets of
        their own, to crown Christ's soldiers withal.


        Moreover, to this also hath the unutterable and boundless goodness of God seen, that
        He spreadeth not the time of working and wrestling, neither maketh it long, nor
        everlasting, and, as it were, but for a moment, so that in this short and scanty life
        there is wrestling and working, but the crown and the prize is in a life which is
        eternal. So the work is soon over, but the wage is paid for ever. And when the night of
        this world is over, the Saints are to see the clearness of the essential light, and to
        receive a blessedness outweighing the pangs of any torment, as testifieth the Apostle
        Paul, where he saith: The sufferings of this present time are not worthy to be compared
        with the glory which shall be revealed in us.
    status: { la: verified, en: verified }
