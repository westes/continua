# Matins Nocturn 2 and 3 readings for St. Felix of Cantalice, Confessor. Sourced from
# web/www/horas/Latin/Sancti/aliquibus locis/05-21-Felix.txt. Nocturn 2 is Lectio4-6
# combined into one continuous life (the source has no responsories of its own).
# Nocturn 3 is the Gospel (Matt 11:25-30; the source gives only its incipit, so the
# text is the one already carried for St. Matthias) and Lectio7-9, St. Augustine,
# Sermon 9 on the words of the Lord. Nocturn 1 (the source has none of its own) is the
# Scripture course.
#
# Latin: "ex terióri" -> "ex exterióri" and "sæéviat" -> "sæviat" corrected silently.
# Everything else is verbatim. English is this project's own translation, marked
# draft; the Gospel is the existing Douay text.
id: st-felix-of-cantalice
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: |
          Felix a Cantalício in Sabínis humílibus sed piis paréntibus natus, a púero pascéndis grégibus, mox et agro coléndo addíctus, multo impénsius rerum coeléstium meditatióne ánimum nutrire, et corpus assiduis vigiliis ac jejúniis domare cœpit, eremíticam agens vitam pótius quam rústicam. Ferventióre autem in Deum pietáte incénsus, cum non posset quotidie, ut optábat, sacris mystériis interésse, grege ad loca solitaria compulso, ipse ante crucem árborum cortícibus incísam diu oráre, seque ácriter flagelláre consuéverat; sed et aliquándo glebas in agro vértere, simúlque Sacris templo adésse visus est. Alias inter arándum furéntibus, quos júnxerat, indómitis juvéncis, humi stratus, et arátro superdúcto plane proscindéndus, laceráta dumtáxat veste, surréxit illǽsus. Quo perículo, ut ad tutiórem reguláris disciplínæ palæstram vocánti jam pridem Deo paréret, admonitus, rústica supelléctili paupéribus distríbui jussa, ad fratres Minóres, quos Capuccínos vocant, própere se cóntulit.

          Adhuc tyro, necdum vota solémnia proféssus, religiósæ perfectiónis ápicem jam attigisse videbátur. Obediéntiæ sédulus cultor, ad præcipiéntis non modo verbum, sed étiam nutum præsto erat; seque cœnóbii juméntum díctitans, vilissima quæque ministéria semper arripuit, ac ludibria et contumélias hilari vultu excipiebat. Paupertatis quam esset studiosus, illústri documénto Deus ipse declarávit. Ostiátim enim per vicos et platéas aléndis frátribus mendícans (quod ille munus per annos quadraginta nudis fere semper pédibus obivit), cum die quadam inusitáto póndere se ópprimi sentíret, mánticam scrutátus, injéctum clam nummum deprehéndit: quo projécto, nec sine indignatióne proculcato, alacer et levis inde abiit. Castitatem, quam usque ad óbitum servávit illibátam (sanctus córpore et spíritu a Paulo quinto propterea appellátus), vígili oculórum custódia et voluntário córporis cruciátu communivit, aspérrimo flagéllo se quotídie cruéntans, ac férreo cilício constrictus, septem étiam Urbis basílicas idéntidem invísens. Jejúnia órdinis inédia quandóque cumulávit. Lectus ejus dolóris pótius quam quiétis erat: brevem quippe somnum flexis nuda super tábula génibus, ac fasce sarmentórum cápiti suppósito, carpébat.

          Vitæ austeritáte sibi asper áliis carus acceptúsque, sanctis præsértim Cárolo et Philippo Nério, simplicitáte atque innocéntia semper fuit. In oratióne pernóctans, dulcíssimam frequénter éxtasim est passus: et aliquándo in ulnis suis reclinátum a Vírgine Matre púerum Jesum suavíssime complécti méruit. Prophetíæ grátia et miraculorum clarus, demórtuum étiam fílium matri vivum restítuit. Méritis tandem in bona senectúte cumulátus, secúnda (ut prædíxerat) féria Pentecóstes ad cœléstem pátriam, Deipara invitánte, lætus ábiit. Ejus corpus in ecclésia sui órdinis summa Urbis veneratióne cólitur, Dómino crebris miráculis servi sui sanctitátem illustrante, quem proptérea Urbánus Papa octávus beatórum, Clemens vero undécimus sanctórum fastis adscrípsit.
      en: |
          Felix was born at Cantalice in the Sabine country, of humble but pious parents, and from boyhood was set to feeding flocks, and soon to tilling the field; he began to nourish his mind far more diligently by meditation on heavenly things, and to subdue his body with constant watchings and fasts, leading rather a hermit's life than a rustic's. Inflamed with more fervent piety toward God, since he could not, as he desired, be present daily at the sacred mysteries, he would drive his flock to solitary places, and pray long before a cross cut in the bark of trees, and scourge himself sharply; and he was sometimes seen turning clods in the field and at the same time present at the Holy Mysteries in the church. Once, while ploughing, the untamed steers he had yoked grew furious, and he was thrown to the ground with the plough drawn over him, plainly to be crushed; only his garment was torn, and he rose unhurt. Warned by this danger to obey God, who had long been calling him to the safer training-ground of a regular discipline, he ordered his rustic goods to be distributed to the poor, and betook himself with haste to the Friars Minor whom they call Capuchins.

          While yet a novice, not yet having made solemn vows, he seemed already to have reached the summit of religious perfection. A diligent cultivator of obedience, he was ready not only at the word but even at the nod of the one commanding; and calling himself the beast of burden of the monastery, he always seized upon the lowliest duties, and received mockeries and insults with a cheerful countenance. How zealous he was for poverty, God himself declared by a striking proof. For as he begged from door to door through the streets and squares to feed the brethren (an office which he discharged for forty years almost always with bare feet), when one day he felt himself oppressed by an unusual weight, he searched his wallet and found a coin secretly thrown in: which he cast away, not without indignation trampling on it, and went off cheerful and light. Chastity, which he preserved unspotted to his death (so that Paul the Fifth called him holy in body and in spirit), he safeguarded by the watchful guard of his eyes and by voluntary bodily torment, daily making himself bleed with a most harsh scourge, and bound with an iron hair-shirt, and repeatedly visiting the seven basilicas of the City. His fasts he sometimes added to by abstinence beyond the order's. His bed was rather of pain than of rest: for he took brief sleep on his knees on a bare board, with a bundle of vine-shoots placed under his head.

          Austere to himself, he was dear and acceptable to others, especially to the saints Charles and Philip Neri, and was always notable for simplicity and innocence. Passing nights in prayer, he often experienced most sweet ecstasy; and once he deserved to embrace most sweetly the Child Jesus, laid in his arms by the Virgin Mother. Illustrious for the gift of prophecy and for miracles, he even restored to its mother her dead son alive. At length, laden with merits in a good old age, on the Monday of Pentecost (as he had foretold), at the invitation of the Mother of God, he went joyfully to his heavenly country. His body is venerated with the greatest devotion of the City in the church of his order, the Lord by frequent miracles illustrating the holiness of his servant, whom therefore Pope Urban the Eighth enrolled among the Blessed, and Clement the Eleventh in the roll of the Saints.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: true
    citation:
      la: "Matt 11:25-30"
      en: "Matt 11:25-30"
    text:
      la: "In illo témpore: Respóndens Jesus, dixit: Confíteor tibi, Pater, Dómine cœli et terræ, quia abscondísti hæc a sapiéntibus et prudéntibus, et revelásti ea párvulis. Ita, Pater: quóniam sic fuit plácitum ante te. Ómnia mihi trádita sunt a Patre meo. Et nemo novit Fílium nisi Pater: neque Patrem quis novit nisi Fílius, et cui volúerit Fílius reveláre. Veníte ad me, omnes, qui laborátis et oneráti estis, et ego refíciam vos. Tóllite jugum meum super vos, et díscite a me, quia mitis sum et húmilis corde: et inveniétis réquiem animábus vestris. Jugum enim meum suáve est et onus meum leve."
      en: "At that time, Jesus answered and said, \"I praise Thee, Father, Lord of heaven and earth, that Thou hast hid these things from the wise and prudent, and hast revealed them to little ones. Yes, Father, for so it hath seemed good in Thy sight. All things are delivered to Me by My Father. And no one knoweth the Son but the Father; neither doth anyone know the Father but the Son, and he to whom it shall please the Son to reveal Him. Come to Me, all you that labour and are burdened, and I will refresh you. Take up My yoke upon you, and learn of Me, because I am meek and humble of heart, and you shall find rest to your souls. For My yoke is sweet, and My burden light.\""
    status: { la: verified, en: verified }
  - nocturn: 3
    isGospel: false
    source: "St. Augustine, Bishop, Sermon 9 on the words of the Lord, n. 70"
    text:
      la: |
          Omnia sæva et immánia, prorsus facília et prope nulla éfficit amor. Quanto ergo cértius ac facilius ad veram beatitúdinem cáritas facit, quod ad misériam, quantum pótuit, cupíditas fecit! Quam fácile toleratur qualibet advérsitas temporális, ut ætérna pœna vitétur, et ætérna réquies comparétur! Non immérito ille vas electiónis cum ingénti lætítia dixit: Non sunt condignæ passiónes hujus témporis ad superventúram glóriam quæ revelábitur in nobis. Ecce unde illud jugum suáve est, et sárcina levis; et si angústa est paucis eligéntibus, fácilis tamen ómnibus diligéntibus. Dixit Psalmista: Propter verba labiórum tuórum ego custodívi vias duras.

          Sed quæ dura sunt laborántibus, eisdem ipsis mitéscunt amántibus. Propter quod ita divína pietátis dispensatióne actum est, ut intérior homo, qui renovátur de die in diem, non adhuc sub lege pósitus, sed jam sub gratia exoneratus sarcinis innumerabílium observationum, quod erat revera grave jugum, sed duræ cervici conveniénter impósitum, facilitáte simplicis fidei, et bonæ spei, et sanctæ caritátis, quidquid molestiárum ex exterióri hómini forínsecus intulisset ille princeps, qui missus est foras, interióri gaúdio feret leve.

          Nihil enim tam fácile bona voluntáti est, quam ipsa sibi, et hæc súfficit Deo. Quantúmlibet ergo sæviat iste mundus, verissime Angeli, nato in carne Dómino, clamavérunt: Glória in excélsis Deo, et in terra pax homínibus bonæ voluntátis. Quia ejus qui natus erat, suáve jugum est, et sárcina levis. Et sicut dicit Apóstolus: Fidélis Deus, qui nos non sinit tentári supra id quod póssumus ferre, sed facit cum tentatióne étiam éxitum, ut possímus sustinére.
      en: |
          Love makes all things cruel and dreadful altogether easy, and almost nothing. How much more surely and easily, then, does charity bring one to true blessedness, as cupidity, so far as it could, brought one to misery! How easily any temporal adversity is borne, that eternal punishment may be avoided and eternal rest obtained! Not undeservedly did the vessel of election say with great joy: The sufferings of this time are not worthy to be compared with the glory to come that shall be revealed in us. Behold whence that yoke is sweet, and the burden light; and if it is narrow to the few who choose it, it is yet easy to all who love. The Psalmist said: For the sake of the words of thy lips I have kept hard ways.

          But what is hard to those who labour becomes gentle to the very same when they love. Wherefore it was so ordered by the dispensation of divine goodness that the inner man, who is renewed from day to day, not yet placed under the law but now under grace, relieved of the burdens of countless observances (which was indeed a heavy yoke, but fitly laid on a hard neck), should bear lightly, with inward joy, by the ease of simple faith and good hope and holy charity, whatever troubles from the outer man that prince, who has been cast out, might bring in from without.

          For nothing is so easy to a good will as itself to itself, and this suffices for God. However much, then, this world may rage, most truly did the Angels cry out, the Lord being born in the flesh: Glory to God in the highest, and on earth peace to men of good will. Because the yoke of him who was born is sweet, and his burden light. And as the Apostle says: God is faithful, who will not suffer you to be tempted above that which you are able to bear, but will make also with the temptation a way out, that you may be able to bear it.
    status: { la: verified, en: draft }
