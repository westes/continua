# Matins Nocturn 2 and 3 readings for the Betrothal of the Blessed Virgin Mary.
# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/01-23-Desponsatio.txt. One
# entry per lesson, each with its responsory: Lectio4-6 (St. Bernard, second homily
# on "Missus est") in Nocturn 2; in Nocturn 3 the Gospel (Matthew 1:18-21, the source
# gives only its incipit, so the text is the one already carried for the Vigil of
# Christmas) and Lectio7-9 (St. Jerome). The source's Responsory7 is the Common of the
# BVM's Responsory8 lines 1-4 (read from Commune/C11.txt, English from the reference's
# English C11). Lectio9 has no responsory (the Te Deum follows). Nocturn 1 (Lectio1-3)
# is not carried: continua's first nocturn runs the Scripture course.
#
# Responsory6 and Responsory8 carry a dagger at a mid-point; they are given here
# without it, with the repeat after the versicle taking the words after the dagger.
# Responsory4 and 5 repeat the part after the asterisk, which the source leaves out.
# Latin typographical spacing before ; : ? is normalised; the lessons and responsories
# are otherwise verbatim (this source is partly unaccented, left as it is). English is
# this project's own translation, marked draft, except the Gospel (existing Douay)
# and Responsory7 (the reference's own English).
id: betrothal-of-the-bvm
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Bernard, Abbot, Homily 2 on \"Missus est\""
    text:
      la: "Oportébat a príncipe mundi áliquam diu celari divíni consílii sacraméntum: non quod Deus, si palam opus suum fácere vellet, impediri posse ab illo metueret: sed quia ipse, qui non solum potenter, sed étiam sapiénter quæcúmque vóluit, fecit, sicut in ómnibus opéribus suis quasdam rerum vel témporum congruentias propter órdinis pulchritúdinem serváre consuevit: ita in hoc quoque tam magnífico ópere suo, nostræ vidélicet reparatiónis, non tantum poténtiam suam, sed et prudéntiam osténdere vóluit."
      en: "It behoved that the mystery of the divine counsel be hidden for some time from the prince of this world: not that God, if he wished to do his work openly, feared that he could be hindered by him; but because he who has done whatever he willed, not only powerfully but also wisely, as in all his works he is wont to observe certain fitnesses of things and of times for the beauty of order, so in this his work also, so magnificent, namely of our restoration, wished to show not only his power but also his prudence."
    responsory:
      la: |
          R. Desponsatio gloriosæ Virginis Mariæ ex semine Abrahæ, ortæ de tribu Juda, clara ex stirpe David, * Cujus vita inclyta cunctas illústrat ecclesias.
          V. Hodie desponsata est beata Virgo Maria ex progenie David.
          R. Cujus vita inclyta cunctas illústrat ecclesias.
      en: |
          R. The betrothal of the glorious Virgin Mary, sprung of the seed of Abraham, of the tribe of Juda, bright from the stock of David, * Whose illustrious life lights up all the churches.
          V. This day the blessed Virgin Mary is betrothed, of the line of David.
          R. Whose illustrious life lights up all the churches.
    status: { la: verified, en: draft }
  - nocturn: 2
    isGospel: false
    source: "St. Bernard, Abbot, Homily 2 on \"Missus est\""
    text:
      la: "Conveniens ergo erat, ut suaviter quoque ómnia, cœlestia scílicet et terréna, disponeret, quátenus et illinc dejiciens inquietum, reliquos in pace firmaret; et hic debellaturus invidum, nobis prius suæ humilitátis et mansuetúdinis valde necessárium exémplum relínqueret: sicque mirábili fíeret moderamine sapiéntiæ, ut et suis suávis, et hóstibus fortis appareret."
      en: "It was fitting, therefore, that he should dispose all things sweetly too, heavenly and earthly alike, so that on the one side, casting down the restless one, he might establish the rest in peace; and here, about to overthrow the envious one, he might first leave us a most necessary example of his humility and meekness: and so it should come to pass by the wonderful governance of wisdom that he should appear both sweet to his own and strong against his enemies."
    responsory:
      la: |
          R. Cum jucunditate Desponsatiónem beatæ Mariæ celebremus: * Ut ipsa pro nobis intercedat ad Dominum Jesum Christum.
          V. Corde et animo Christo canamus gloriam in hac sacra solemnitate præcelsæ Genitricis Dei Mariæ.
          R. Ut ipsa pro nobis intercedat ad Dominum Jesum Christum.
      en: |
          R. With joy let us celebrate the betrothal of blessed Mary: * That she may intercede for us to our Lord Jesus Christ.
          V. With heart and soul let us sing glory to Christ on this holy solemnity of the most exalted Mother of God, Mary.
          R. That she may intercede for us to our Lord Jesus Christ.
    status: { la: verified, en: draft }
  - nocturn: 2
    isGospel: false
    source: "St. Bernard, Abbot, Homily 2 on \"Missus est\""
    text:
      la: "Quid enim prodésset diábolum a Deo vinci, nobis manentibus supérbis? Necessário ígitur desponsáta est María Joseph, quando per hoc et a cánibus sanctum absconditur, et a sponso virgínitas comprobátur, et Vírginis tam verecúndiæ parcitur, quam famæ providetur. Quid sapientius? quid dígnius divína providentia? Uno tali consílio secretis cœlestibus et admittitur testis, et exclúditur hostis, et íntegra servátur fama Vírginis Matris."
      en: "For what would it have profited that the devil be conquered by God, if we remained proud? Of necessity, therefore, Mary was betrothed to Joseph, since by this both the holy thing is hidden from the dogs, and her virginity is attested by her betrothed, and so modest a Virgin is spared, as her good name is provided for. What is wiser? what more worthy of divine providence? By one such counsel both the witness is admitted to the heavenly secrets and the enemy is shut out, and the good name of the Virgin Mother is kept whole."
    responsory:
      la: |
          R. Desponsátio tua, Dei Génitrix Virgo, gaúdium annuntiávit univérso mundo: Ex te enim ortus est sol justítiæ, Christus Deus noster: * Qui solvens maledictiónem, dedit benedictiónem: et confúndens mortem, donávit nobis vitam sempitérnam.
          V. Benedícta tu in mulíeribus, et benedíctus fructus ventris tui.
          R. Ex te enim ortus est sol justítiæ, Christus Deus noster.
      en: |
          R. Thy betrothal, O Virgin Mother of God, hath announced joy to the whole world: for from thee is risen the sun of justice, Christ our God: * Who, loosing the curse, gave blessing, and confounding death, gave us life everlasting.
          V. Blessed art thou among women, and blessed is the fruit of thy womb.
          R. For from thee is risen the sun of justice, Christ our God.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: true
    citation:
      la: "Matt 1:18-21"
      en: "Matt 1:18-21"
    text:
      la: "Cum esset desponsáta Mater Jesu María Joseph, ántequam convenírent, invénta est in útero habens de Spíritu Sancto. Et réliqua."
      en: "When as his mother Mary was espoused to Joseph, before they came together, she was found with child, of the Holy Ghost. And so on."
    status: { la: verified, en: verified }
  - nocturn: 3
    isGospel: false
    source: "St. Jerome, Priest"
    text:
      la: "Quare non de simplici vírgine, sed de desponsáta concipitur? Primum, ut per generatiónem Joseph, orígo Maríæ monstraretur: secúndo, ne lapidaretur a Judǽis ut adultera: tértio, ut in Ægýptum fúgiens habéret solátium. Martyr Ignátius étiam quartam addidit causam, cur a desponsáta concéptus sit: Ut partus, inquiens, ejus celaretur diábolo, dum eum putat non de vírgine, sed de uxore generatum."
      en: "Why is he conceived not of a simple virgin, but of one betrothed? First, that through the genealogy of Joseph the origin of Mary might be shown; second, that she might not be stoned by the Jews as an adulteress; third, that, fleeing into Egypt, she might have a consolation. The martyr Ignatius also added a fourth reason why he was conceived of one betrothed: That his birth, he says, might be hidden from the devil, while he thinks him begotten not of a virgin, but of a wife."
    responsory:
      la: |
          R. Beátam me dicent omnes generatiónes, * Quia fecit mihi Dóminus magna qui potens est, et sanctum nomen ejus.
          V. Et misericórdia ejus a progénie in progénies timéntibus eum.
          R. Quia fecit mihi Dóminus magna qui potens est, et sanctum nomen ejus.
      en: |
          R. All generations shall call me blessed. * For he that is mighty, even the Lord, hath done to me great things; and holy is his name.
          V. And his mercy is on them that fear him, from generation to generation.
          R. For he that is mighty, even the Lord, hath done to me great things; and holy is his name.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: false
    source: "St. Jerome, Priest"
    text:
      la: "Ántequam convenírent, invénta est in útero habens de Spíritu sancto. Non ab álio invénta est, nisi a Joseph, qui pene licentia maritali futúræ uxóris ómnia nóverat. Quod autem dícitur, Ántequam convenírent; non séquitur ut póstea convenerint: sed Scriptúra quod factum non sit, osténdit."
      en: "Before they came together, she was found with child of the Holy Ghost. She was found by no other than by Joseph, who almost by the licence of a husband knew all things concerning his future wife. But when it is said, Before they came together, it does not follow that afterwards they did come together: but Scripture shows what did not happen."
    responsory:
      la: |
          R. Felix namque es, sacra Virgo María, et omni laude digníssima: Quia ex te ortus est sol justítiæ, * Christus, Deus noster.
          V. Ora pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu: séntiant omnes tuum juvámen, quicúmque célebrant tuam sanctam Desponsatiónem.
          R. Quia ex te ortus est sol justítiæ.
      en: |
          R. Happy art thou, O holy Virgin Mary, and most worthy of all praise: for from thee is risen the sun of justice, * Christ our God.
          V. Pray for the people, plead for the clergy, intercede for the devout female sex: let all feel thy help who celebrate thy holy betrothal.
          R. For from thee is risen the sun of justice.
    status: { la: verified, en: draft }
  - nocturn: 3
    isGospel: false
    source: "St. Jerome, Priest"
    text:
      la: "Joseph autem vir ejus, cum esset justus, et nollet eam tradúcere, vóluit occúlte dimíttere eam. Si quis fornicariæ conjungitur, unum corpus effícitur, et in lege præcéptum est, non solum reos, sed et conscios criminum obnoxios esse peccáti: quómodo Joseph, cum crimen celaret uxóris, justus scríbitur? Sed hoc testimónium Maríæ est, quod Joseph sciens illíus castitátem, et admirans quod evenerat, celat siléntio, cujus mystérium nesciebat."
      en: "But Joseph her husband, being a just man, and not willing publicly to expose her, was minded to put her away privately. If a man is joined to a harlot, he is made one body, and it is commanded in the law that not only the guilty but also those who are aware of crimes are liable to sin: how then is Joseph, while concealing the crime of his wife, written just? But this is the testimony of Mary, that Joseph, knowing her chastity, and wondering at what had happened, conceals in silence that whose mystery he knew not."
    status: { la: verified, en: draft }
