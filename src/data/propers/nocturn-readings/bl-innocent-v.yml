# Matins Nocturn 2 reading for Bl. Innocent V, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/06-22-InnocentiusV.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: bl-innocent-v
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Innocéntius, ántea Petrus de Tarentasia dictus, anno supra millésimum círciter bis centésimo
        vigésimo quinto natus est. Dives æque ac nóbilis et elegantioris formæ a tenera ætáte in
        Órdine prædicatórum se suaque ómnia Deo mancipávit. Per annos ferme trigínta in cœnóbio
        Parisiénsi religiósis móribus sacrisque lítteris appríme excultus, sapiéntiæ ac sanctitátis
        culmen ascéndit. Ad theologicas disciplinas in Academía Parisiénsi tradendas, et ad régimen
        Provínciæ sui Órdinis semel et íterum vocátus egrégius fuit sacræ sciéntiæ Magíster, et
        prælatus inter fratres acceptissimus. Uberrimo animárum fructu pópulos Gálliæ verbi Dei
        prædicatióne informavit, sibíque haud exiguam dicendi laudem promeruit.


        A beáto Gregório Décimo Pontífice máximo Ecclésiæ Lugdunensi regendæ præpósitus, cleri
        populique graves ac diuturnas contentiones brevi ac felíciter sedávit. In Senatum
        Purpuratorum Patrum adscítus Œcumenicæ Synodo Lugdúni celebrandæ sollícite ómnia dispósuit:
        tum in ipsa Synodo jussu Pontíficis una cum sancto Bonaventúra majóris momenti negótia
        moderátus est. Ejus præsértim ópera Græcórum conjunctio cum Latinis probata est: quærelæ
        cleri sæcularis contra regulárem sublatæ, et Conclavis statuta ad futuras Romanórum
        Pontíficum electiones sancita.


        Aretii beáto Gregório Décimo vita functo, cunctis Cardinálium suffrágiis ad Petri Cáthedram
        evéctus est. Magnanimi decessoris consília prosecútus, impigre stúduit ut Orientales a jugo
        infidélium liberaret: Carolum Sicíliæ regem cum Italicis civitatibus amice compósuit:
        Rodulphum imperatórem Ecclésiæ Románæ ditioni ab Alpibus minitántem propulsavit: contra
        Saracénos, Hispániam invadentes, celeritate magna exércitum cruce signatorum instruxit:
        normas dedit, quibus religiósa Græcórum cum Latinis reconciliatio perficerétur, a
        successoribus sédulo retentas. Hæc tanta operátus brevi quinque mensium decúrsu, dum majóra
        adhuc ab eo sperabat Ecclésia, febri Romæ corréptus anno ætátis suæ quinquagésimo primo ad
        Súperos piíssime evolávit. Multis in vita et post mortem miráculis cláruit. Quamóbrem statim
        ab éxitu cultus ecclesiasticus beáto Pontífici præstitus fuit: quem nunquam intermissum, ex
        Sacrórum Rítuum Congregatiónis consúlto, Leo Papa Décimus tértius confirmávit.
      en: >-
        Innocent, formerly called Peter of Tarentaise, was born about the year 1225. Rich as well as
        noble and of elegant form, from tender age he gave himself and all his things to God in the
        Order of Preachers. For almost thirty years in the monastery of Paris, cultivated in
        religious morals and sacred letters, he ascended to the summit of wisdom and sanctity. Twice
        and again called to teach theological disciplines in the University of Paris and to govern
        the Province of his Order, he was an eminent Master of sacred science and a prelate most
        acceptable among the brethren. He instructed the peoples of Gaul with most abundant fruit of
        souls by the preaching of the word of God, and won for himself no small praise for
        eloquence.


        By blessed Gregory the Tenth, Supreme Pontiff, he was appointed to govern the church of
        Lyons, and soon and happily settled the grave and long contentions of clergy and people.
        Admitted into the Senate of the Purpled Fathers, he carefully arranged all things for the
        Ecumenical Synod to be celebrated at Lyons: then in the Synod itself, by order of the
        Pontiff, together with holy Bonaventure, he directed matters of greater moment. By his work
        especially the union of the Greeks with the Latins was approved; the complaints of the
        secular clergy against the regular were removed; and the statutes of the Conclave for future
        elections of Roman Pontiffs were sanctioned.


        At Arezzo, blessed Gregory the Tenth having died, by the votes of all the Cardinals he was
        raised to the Chair of Peter. Pursuing the plans of his magnanimous predecessor, he strove
        vigorously to free the Orientals from the yoke of infidels: he amicably reconciled Charles,
        king of Sicily, with the Italian cities: he repulsed the Emperor Rudolf threatening the
        dominion of the Roman Church from the Alps: against the Saracens invading Spain he quickly
        equipped an army of crusaders: he gave rules by which the religious reconciliation of the
        Greeks with the Latins might be completed, diligently retained by his successors. Having
        done so much in the short course of five months, while the Church was still hoping greater
        things from him, seized with fever at Rome, in the fifty-first year of his age he most
        piously flew to those above. He was renowned for many miracles in life and after death.
        Wherefore ecclesiastical cult was at once rendered to the blessed Pontiff from his
        departure: which, never interrupted, Pope Leo the Thirteenth, on the advice of the Sacred
        Congregation of Rites, confirmed.
    status: { la: verified, en: draft }
