# Matins Nocturn 2 reading for St. Clement I, Pope, Martyr (Nov 23,
# sharing the date with St. Felicitas — see st-felicitas.yml) —
# SanctiM/11-23.txt inherits the whole day (`@Sancti/11-23`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-23.txt, English/Sancti/11-23.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
id: st-clement
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Clemens, Románus, Faustíni fílius, de regióne Cǽlii montis, discípulus beáti Petri,
        cujus méminit Paulus scribens ad Philippénses: Etiam rogo et te, germáne compar,
        ádjuva illas quæ mecum laboravérunt in Evangélio, cum Cleménte et céteris
        adjutóribus meis, quorum nómina sunt in libro vitæ. Hic septem Urbis regiónes
        divísit septem notáriis, síngulas síngulis attríbuens, qui passiónes Mártyrum et
        res ab eis gestas, diligentíssime conquisítas, lítteris mandárent. Multa scripsit et
        ipse accuráte et salutáriter, quibus christiánam religiónem illustrávit.


        Cum autem doctrína ac vitæ sanctitáte multos ad Christi fidem convérteret, a
        Trajáno imperatóre relegátus est trans mare Pónticum in solitúdine urbis Chersónæ;
        in qua duo míllia Christianórum réperit, qui ab eódem Trajáno condemnáti fúerant.
        Qui cum in eruéndis et secándis marmóribus aquæ penúria laborárent, Clemens, facta
        oratióne, in vicínum collem ascéndit, in cujus jugo vidit Agnum déxtero pede fontem
        aquæ dulcis, qui inde scatébat, attingéntem; ubi omnes sitim explevérunt. Eóque
        miráculo multi infidéles, ad Christi fidem convérsi, Cleméntis étiam sanctitátem
        venerári cœpérunt.


        Quibus concitátus Trajánus, misit illuc qui Cleméntem, alligáta ad ejus collum
        ánchora, in profúndum dejícerent. Quod cum factum esset, Christiánis ad littus
        orántibus, mare ad tria milliária recéssit; eóque illi accedéntes, ædículam
        marmóream in templi formam et intus arcam lapídeam, ubi Mártyris corpus cónditum
        est. Ecclésia étiam in eo ínsulæ loco unde divínitus fons manárat, ejúsdem nómine
        dedicáta est. Vixit in pontificátu annos novem, menses sex, dies sex. Fecit
        ordinatiónes duas mense Decémbri, quibus creávit presbýteros decem, diáconos duos,
        epíscopos per divérsa loca quíndecim.
      en: >-
        Clement, the son of Faustinus, was a Roman, from the quarter of the Coelian Mount. He
        was a disciple of the blessed Peter, and is the same concerning whom Paul saith,
        writing to the Philippians: And I entreat thee also, true yokefellow, help those
        women which laboured with me in the Gospel, with Clement also, and with other my
        fellow-labourers, whose names are written in the book of life. He it was who divided
        the seven quarters of the city among seven scribes, one to each, whose duty it was to
        search out most carefully, and record in writing the sufferings and acts of the
        Martyrs. He himself also wrote much, and that most orthodox and healthy, whereby he
        clearly explained the Christian Religion.


        His teaching and the holiness of his life brought many to believe in Christ, and he
        was therefore exiled by the Emperor Trajan to Kherson, in the Crimea, where he found
        two thousand Christians, who had been condemned by the same Trajan. There they all
        worked in the marble quarries. During their labour they suffered for want of water,
        and Clement prayed, and then went up an hill hard by, on the top whereof he saw a
        Lamb standing, touching with its right foot a flowing spring of sweet waters.
        Therewith they all quenched their thirst, and by this miracle many unbelievers were
        brought to believe in Christ, and began to honour the holiness of Clement.


        These things moved Trajan to send a messenger to the Crimea, who tied an anchor
        about Clement's neck, and cast him into the deep of the sea. After it had been done,
        while the Christians were praying on the shore, the sea went back three miles, and
        when they followed it, they found a grotto of marble, in form like a temple, and
        therein a stone coffin wherein was laid the body of the Martyr. A Church was also
        built in the place where God had made the water to break forth. Clement lived as
        Pope nine years, six months, and six days. He held two Ordinations in the month of
        December, wherein he made ten Priests, two Deacons, and fifteen Bishops for diverse
        places.
    status: { la: verified, en: verified }
