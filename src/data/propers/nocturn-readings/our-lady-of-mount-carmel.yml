# Matins Nocturn 2 reading for Our Lady of Mount Carmel (July 16).
# Sourced directly from web/www/horas/Latin/Sancti/07-16.txt,
# English/Sancti/07-16.txt. Lectio4-6 combined into one reading. No
# Lectio7-9 in her own file (only a `Responsory7` cross-reference to
# `Commune/C11`) -- defers to the Common of the BVM's own Nocturn 3,
# not transcribed here, same as our-lady-of-the-snows.yml's own note.
#
# Checked 2026-09-05 for a missing Gospel pairing: confirmed via
# horas/Latin/Sancti/07-16.txt directly — the secular file's Rule
# ("ex C11") gives only Lectio4-6 (this file's Nocturn 2) as proper
# text, Lectio7-9 aren't present at all, falling wholesale to
# Commune/C11's own Nocturn 3. horas/Latin/SanctiM/07-16.txt (Monastic
# track) does carry its own Lectio9 Gospel (Luke 11:27-28) + St.
# Bernard homily on it, but that whole Lectio9-12 block is tagged
# "(rubrica cisterciensis)" — a Cistercian-only variant (unsurprising,
# given St. Bernard), not part of the plain Monastic 1617 track vu
# otherwise follows — so it's out of scope here. No pairing added.
id: our-lady-of-mount-carmel
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Cum sacra Pentecostes die Apóstoli, cælitus afflati, variis linguis
        loqueréntur, et, invocato augustíssimo Jesu nómine, mira multa patrarent;
        viri plurimi (ut fertur), qui vestigiis sanctórum prophetárum Elíæ ac
        Eliséi instíterant, et Joánnis Baptistæ præconio ad Christi advéntum
        comparáti fuerant, rerum veritáte perspecta atque probata, evangelicam
        fidem conféstim amplexáti sunt, ac peculiari quodam afféctu beatíssimam
        Vírginem (cujus colloquiis ac familiaritate feliciter frui potuére) adeo
        venerari cœpérunt, ut primi ómnium in eo montis Carmeli loco, ubi Elías
        olim ascendentem nébulam, Vírginis typo insignem, conspexerat, eidem
        puríssimæ Virgini sacellum construxerint.


        Ad novum ergo sacellum sæpe quotídie conveniéntes, rítibus piis,
        precatiónibus ac laudibus beatíssimam Vírginem, velut singularem ordinis
        tutelam, colebant. Quam ob rem fratres beátæ Maríæ de Monte Carmelo
        passim ab ómnibus appellari cœpérunt; eumque titulum summi Pontifices non
        modo confírmarunt, sed et indulgéntias peculiares iis, qui eo titulo vel
        ordinem vel fratres síngulos nuncuparent, concessére. Nec vero
        nomenclatúram tantum magnificentíssima Virgo tríbuit et tutelam, verum et
        insigne sacri scapularis; quod beato Simoni Anglico præbuit, ut cælésti
        hac veste ordo ille sacer dignoscerétur, et a malis ingruéntibus
        protegerétur. Ac demum, cum olim in Europa ordo esset ignotus, et ob id
        apud Honórium tertium non pauci pro illíus exstinctióne instarent,
        ástitit Honorio noctu piíssima Virgo Maria, planeque jussit ut
        institutum et hómines benígne complecterétur.


        Non in hac tantum sæculo ordinem sibi tam acceptum multis prærogativis
        beatíssima Virgo insignívit; verum et in alio (cum ubíque et poténtia et
        misericórdia plurimum valeat) fílios in scapularis societátem relatos,
        qui abstinéntiam modicam precesque paucas eis præscriptas frequentarunt,
        ac pro sui status ratióne castitátem coluérunt, materno plane afféctu,
        dum igne purgatorii expiántur, solari ac in cælestem pátriam obtentu suo
        quantócius pie creditur efferre. Tot ergo tantisque beneficiis ordo
        cumulátus, solemnem beatíssimæ Vírginis Commemoratiónem, ritu perpetuo ad
        ejusdem Vírginis glóriam quotannis celebrandam, instituit.
      en: >-
        Here is a story to the effect that many men who had kept a tradition of the
        holy Prophets Elijah and Elisha, were made ready by the preaching of John
        the Baptist to hail the coming of the Messiah, and that, when the Apostles
        having been filled with the Spirit upon the holy day of Pentecost, spake
        with diverse tongues and worked miracles by calling upon the Name of Jesus
        which is above every other name, these men, seeing and being assured of the
        truth, straightway embraced the faith of the Gospel, and that on account of
        their singular love toward the Most Blessed Virgin, whose conversation and
        friendship they were able to enjoy, they paid her the respect of building
        her a little Chapel, the first which was ever raised in honour of this same
        most pure Maiden, and which stood upon that part of Mount Carmel whence the
        servant of Elijah had in old days espied that manifest type of the Virgin,
        the little cloud like a man's hand, arising out of the sea.


        Now this new Chapel they repaired oftentimes day by day, and in their
        sacred ceremonies, prayers, and praises, honoured the Most Blessed Virgin
        as the particular Guardian of their Congregation. For this reason they came
        to be everywhere called the Brethren of Blessed Mary, of Mount Carmel, and
        the Supreme Pontiffs have not only confirmed to them the right to use this
        name, but have granted particular indulgences to all those who so call
        either the Order itself, or any particular member thereof. Her name and
        protection are not the only gifts which the most bountiful Virgin hath
        given them; yea, she hath given them the badge of the Holy Scapular, which
        she delivered to the Blessed Englishman Simon Stock, even an heavenly
        garment whereby this Holy Order is marked, and harnessed against all
        assaults. Moreover, in old times, when this Order was unknown in Europe,
        and not a few were instant with Honorius III. to put an end to it, the most
        gracious Virgin Mary appeared by night to the said Honorius, and flatly
        commanded him to show kindness to the Order and to the men belonging
        thereto.


        Many godly persons believe that it is not in this world only that the most
        Blessed Virgin hath marked with her favour this Order which pleaseth her so
        well, but that in the next world, where her power and mercy have a freer
        scope than here, they who belong to the Guild of the Scapular, who have
        practised an easy abstinence, have been regular in reciting a few prayers
        enjoined to them, and have kept chastity according to their state of life,
        are comforted by her motherly love while they are being cleansed in the
        fire of Purgatory, and by her help are borne forward towards their home in
        heaven more quickly than others. The Order loaded with so many and so great
        gifts, hath instituted a solemn Commemoration of the Most Blessed Virgin,
        to be made year after year, in perpetual observance, for the glory of the
        same Virgin.
    status: { la: verified, en: verified }
