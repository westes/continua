id: month-week-111
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Gregory the Great, Homilies on Ezekiel, Book 1, Homily 2"
    text:
      la: >-
        Usus prophéticæ locutiónis est, ut prius persónam, tempus, locúmque descríbat, et póstmodum
        dícere mystéria prophetíæ incípiat; quátenus ad veritátem solídius ostendéndam, ante, históriæ
        radícem figat, et post, fructus spíritus per signa et allegorías próferat. Ezéchiel ítaque
        ætátis suæ tempus índicat, dicens: Et factum est in trigésimo anno, in quarto mense, in quinta
        mensis. Locum quoque denúntians, adjúngit: Cum essem in médio captivórum juxta flumen Chobar,
        apérti sunt cæli, et vidi visiónes Dei. Tempus étiam insínuat, subdens, In quinta mensis, ipse
        est annus quintus transmigratiónis regis Jóachin. Qui ut bene persónam índicet, étiam genus
        narrat, cum súbditur: Et factum est verbum Dómini ad Ezechiélem, fílium Buzi, sacerdótem.


        Sed prima quǽstio nobis óritur, cur is qui nihil adhuc díxerat, ita exórsus est dicens: Et
        factum est in trigésimo anno. Et, namque sermo conjunctiónis est: et scimus quia non
        conjúngitur sermo súbsequens, nisi sermóni præcedénti. Qui ígitur nihil díxerat, cur dicit, Et
        factum est: cum non sit sermo, cui hoc quod íncipit, subjúngat? Qua in re intuéndum est, quia
        sicut nos corporália, sic prophétæ sensu spiritália aspíciunt; eísque et illa sunt præséntia,
        quæ nostræ ignorántiæ abséntia vidéntur. Unde fit, ut in mente prophetárum ita conjúncta sint
        exterióribus interióra, quátenus simul útraque vídeant, simúlque in eis fiat et intus verbum
        quod áudiunt, et foris quod dicunt.


        Patet ígitur causa, cur qui nihil díxerat, inchoávit dicens: Et factum est in trigésimo anno:
        quia hoc verbum quod foris prótulit, illi verbo quod intus audíerat, conjúnxit. Continuávit
        ergo verba quæ prótulit visióni íntimæ, et idcírco íncipit dicens, Et factum est. Subjúnxit
        enim hoc quod extérius loqui ínchoat; ac si et illud foris sit, quod intus vidit. Hoc autem
        quod dícitur, quia in trigésimo anno spíritum prophetíæ accéperit, índicat áliquid nobis
        considerándum; vidélicet quia juxta ratiónis usum, doctrínæ sermo non súppetit, nisi in ætáte
        perfécta. Unde et ipse Dóminus anno duodécimo ætátis suæ in médio doctórum in templo sedens,
        non docens sed intérrogans vóluit inveníri.
      en: >-
        It is the use of the Prophetic writers first to give name, date, and place, and then to begin
        to unfold the mysteries of the prophecy; thus, to give certainty of trustworthiness, a
        foundation is laid before, and afterward the fruits of the Spirit are set forth by signs and in
        figures. Thus Ezekiel saith concerning the date: "And it came to pass in the thirtieth year, in
        the fourth month, in the fifth day of the month." And to show the place, he addeth further: "As
        I was among the captives by the river of Chebar, the heavens were opened, and I saw visions of
        God." Then he defineth the time even more exactly, saying, "In the fifth day of the month,
        which was the fifth year of King Jehoiachim's captivity." And he who had thus clearly indicated
        his individuality, goeth on farther to state his kin, saying, "The word of the Lord came unto
        Ezekiel, the son of Buzi, the Priest."


        But the first question which meeteth us is: wherefore doth the Prophet, having hitherto said
        nothing, begin with the words: "And it came to pass in the thirtieth year"? Now, this word
        "And" is a conjunction, and we know that it is so called because it conjoineth that which
        cometh after it with that which goeth before it. Wherefore, then, doth he who hath hitherto
        been silent, commence by "And," when there is nothing going before for the conjunction to join
        to that which cometh after? To explain this, we must consider that our senses perceive only
        things bodily, while those of Prophets perceive also things ghostly, and to them things exist
        which to our ignorance seem not to do so. Hence it cometh that in the mind of a Prophet, things
        outer and things inner are so joined that he seeth both together, and the word which he heareth
        within him and that which he uttereth come together.


        It appeareth plainly, therefore, that he which had hitherto been silent, beginneth by the
        words: "And it came to pass in the thirtieth year," because his first utterance was but the
        continuation of something to which he had already been listening in his own mind. The words
        which he spoke were merely a continuation of the vision already going on within, and therefore
        the first are, "And it came to pass." His language is framed as though his inner revelation had
        been an open one. That it was in the thirtieth year that the word of the Lord came unto Ezekiel
        causeth us to remark that in the ordinary use of human understanding, men receive not a call to
        teach until they be of full age. Hence also even the Lord Himself, when He sat in the Temple in
        the midst of the doctors, in the twelfth year of His age, was pleased to be found, not teaching,
        but hearing them and asking them questions. (Luke 2:46.)
    responsory:
      la: "Super muros tuos, Jerúsalem, constítui custódes; * Tota die et nocte non tacébunt laudáre nomen Dómini.\nV. Prædicábunt pópulis fortitúdinem meam, et annuntiábunt géntibus glóriam meam.\nR. Tota die et nocte non tacébunt laudáre nomen Dómini."
      en: "I have set watchmen upon thy walls, O Jerusalem; * Which shall never hold their peace day nor night, to praise the name of the Lord.\nV. They shall proclaim My might unto the nations, and declare My glory unto the Gentiles.\nR. Which shall never hold their peace day nor night, to praise the name of the Lord."
    status: { la: verified, en: verified }
