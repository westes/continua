# Matins Nocturn 2 reading for St. Cecilia, Virgin, Martyr (Nov 22) —
# SanctiM/11-22.txt inherits the whole day (`@Sancti/11-22`) with no
# Nocturn 2/3 override, so this saint's own vita is sourced from the
# Tridentine track exactly as for a pre-1955 saint (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/11-22.txt, English/Sancti/11-22.txt.
# Lectio4-6 combined into one reading, one continuous vita, no genuine
# source break. No responsory given in the source.
id: st-cecilia
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Cæcília, Virgo Romana, nobili genere nata, a prima ætate christianæ fidei præceptis
        instituta, virginitátem suam Deo vovit. Sed, cum póstea, contra suam voluntátem,
        data esset in matrimónium Valeriáno, prima nuptiárum nocte hunc cum eo sermónem
        hábuit: Ego, Valeriane, in Angeli tutela sum, qui virginitátem meam custódit; quare
        ne quid in me committas, quo ira Dei in te concitétur. Quibus verbis commótus
        Valerianus, illam attingere non est ausus; quin étiam addidit se in Christum
        creditúrum, si eum Angelum vidéret. Cui Cæcília cum sine baptismo negaret id fíeri
        posse, incénsus cupiditate vidéndi Angelum, se baptizari velle respóndit. Quare
        hortatu Vírginis ad Urbanum Papam, qui propter persecutiónem in Mártyrum sepúlcris
        via Appia latebat, veniens, ab eo baptizátur.


        Inde ad Cæciliam reversus, orántem et cum ea Angelum divino splendore fulgentem
        invénit. Quo aspectu obstupefactus, ut primum ex timóre confirmátus est, Tiburtium
        fratrem suum accersit; qui, a Cæcília Christi fide imbutus et ab eodem Urbano
        baptizatus, ipse étiam ejusdem Angeli, quem frater ejus viderat, aspectu dignátus
        est. Uterque autem paulo post, Almachio præfecto, constanter martyrium subiit. Qui
        mox Cæciliam comprehéndi imperat, ab eáque primum, ubi Tiburtii et Valeriáni
        facultates sint, exquirit.


        Cui, cum Virgo ómnia illórum paupéribus distributa esse respondísset, eo furóre
        concitátus est, ut eam, in ipsíus ædes reductam, in balneo comburi jusserit. Quo in
        loco cum diem noctemque ita fuísset ut ne flamma quidem illam attingeret, eo
        immissus est carnifex, qui ter secúri ictam, cum caput abscindere non potuísset,
        semivivam relíquit. Illa triduo post, sextodecimo Kalendas Octobris, Alexandro
        imperatóre, duplici virginitátis et martyrii palma decorata, evolávit in cælum.
        Cujus corpus ab ipso Urbano Papa in Callísti cœmeterio sepúltum est, in ejus ædibus
        ecclésia ipsíus Cæcíliæ consecrata. Ejus et Urbani ac Lucii Pontificum, Tiburtii,
        Valeriáni et Maximi corpora, a Paschali primo Pontifice inde transláta in Urbem, in
        eádem sanctæ Cæcíliæ ecclésia cóndita sunt.
      en: >-
        Cecilia was a Roman maiden of noble birth, trained up from her earliest years in the
        teaching of the Christian faith, and who by vow consecrated her virginity to God. She
        was afterwards given in marriage, against her will, to Valerian. On the first night
        she said to him: Valerian! I am under the wardship of an Angel, who keepeth me always
        a maiden. Therefore do nothing unto me, lest the anger of God should be aroused
        against thee. Valerian was moved at her words, and dared not to touch her. Also he
        added even this, that he would believe in Christ, if he could see the Angel. Cecilia
        answered him that that could not be unless he were first baptized, and for the sake
        of seeing the Angel he was willing. So she bade him go unto Pope Urban, who was hiding
        in the sepulchre of the Martyrs on the Appian Way on account of the persecution. And
        he went unto him and was baptized.


        Whence he came back to Cecilia, and found her praying, and the Angel with her,
        shining from the glory of God. As soon as he had recovered from the shock of wonder
        and fear, he brought his brother Tiburtius, and Cecilia taught him Christ, and he was
        baptized by the same Pope Urban, and he also was vouchsafed to see the Angel whom his
        brother had seen. A little while after, both of them bravely suffered martyrdom under
        the Praefect Almachius, who then caused Cecilia to be taken, and asked of her, first
        of all, where was the property of Tiburtius and Valerian?


        To him the Virgin answered that all their goods had been given to the poor.
        Thereupon he was filled with fury, and commanded her to be taken home, and burnt in
        the bath. She was in that place a day and a night, but the fire had not harmed her.
        Then was sent the executioner, who gave her three strokes of the axe, and, as he
        could not cut off her head, left her half-dead. Three days thereafter, in the reign
        of the Emperor Alexander Severus, she winged her flight for heaven, glorified with
        the two palms of virginity and martyrdom. Her body was buried in the cemetery of
        Callistus by the aforenamed Pope Urban, who also consecrated a Church in her name in
        her own house. Her relics were brought into the city by Pope Paschal I, along with
        those of Tiburtius, Valerian, and Maximus, and all laid together in the said Church
        of St Cecilia.
    status: { la: verified, en: verified }
