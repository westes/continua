# Matins Nocturn content for Ash Wednesday — read from
# web/www/horas/{Latin,English}/Tempora/Quadp3-3.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quadp3-3.txt's own [Evangelium]
# (the missa track carries full Mass-Gospel text where the Office file
# only gives an incipit — same convention as the Ember-day pulls).
#
# Recombined into one reading (Lectio1-3 are one continuous, unbroken
# Augustine homily split only to fill the fixed 3-lesson slot count — this
# store's established default, see post-pentecost-15.yml/ember-september-
# wednesday.yml). Responsory is Lectio1's own (Responsory1, cross-
# referenced from Tempora/Quadp3-0.txt's own Responsory7) per the "the
# first one, when several collapse" convention.
id: ash-wednesday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Matt 6:16-21", en: "Matthew 6:16-21" }
    text:
      la: >-
        In illo témpore: Dixit Jesus discípulis suis: Cum jejunátis, nolíte fíeri, sicut hypócritæ,
        tristes. Extérminant enim fácies suas, ut appáreant homínibus jejunántes. Amen, dico vobis,
        quia recepérunt mercédem suam. Tu autem, cum jejúnas, unge caput tuum, et fáciem tuam lava,
        ne videáris homínibus jejúnans, sed Patri tuo, qui est in abscóndito: et Pater tuus, qui
        videt in abscóndito, reddet tibi. Nolíte thesaurizáre vobis thesáuros in terra: ubi ærúgo et
        tínea demolítur: et ubi fures effódiunt et furántur. Thesaurizáte autem vobis thesáuros in
        coelo: ubi neque ærúgo neque tínea demolítur; et ubi fures non effódiunt nec furántur. Ubi
        enim est thesáurus tuus, ibi est et cor tuum.
      en: >-
        At that time, Jesus said to His disciples, "When you fast, do not look gloomy like the
        hypocrites, who disfigure their face in order to appear to men as fasting. Amen I say to
        you, they have received their reward. But you, when you do fast, anoint your head and wash
        your face, so that you may not be seen fasting by men, but by your Father, Who is in
        secret; and your Father, Who sees in secret, will reward you. Do not lay up for yourselves
        treasures on earth, where rust and moth consume, and where thieves break in and steal; but
        lay up for yourselves treasures in heaven, where neither rust nor moth consumes, nor
        thieves break in and steal. For where your treasure is, there also will your heart be."
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, Book 2 on the Lord's Sermon on the Mount, ch. 12"
    text:
      la: >-
        Maniféstum est, his præcéptis omnem nostram intentiónem in interióra gáudia dírigi: ne foris
        quæréntes mercédem, huic sǽculo conformémur, et amittámus promissiónem tanto solidióris
        atque firmióris, quanto interióris beatitúdinis, qua nos elégit Deus confórmes fíeri
        imáginis Fílii sui. In hoc autem capítulo máxime adverténdum est, non in solo rerum
        corporeárum nitóre atque pompa, sed étiam in ipsis sórdibus luctuósis esse posse jactántiam
        et eo periculosiórem, quo sub nómine servitútis Dei décipit.


        Qui ergo immoderáto cultu córporis atque vestítu, vel ceterárum rerum nitóre præfúlget,
        fácile convíncitur rebus ipsis, pompárum sǽculi esse sectátor, nec quemquam fallit dolósa
        imágine sanctitátis. Qui autem in professióne christianitátis, inusitáto squalóre ac
        sórdibus inténtos in se óculos hóminum facit, cum id voluntáte fáciat, non necessitáte
        patiátur: ex céteris ejus opéribus potest cónici, utrum hoc contémptu supérflui cultus, an
        ambitióne áliqua fáciat: quia et sub ovína pelle cavéndos lupos Dóminus præcépit: Sed ex
        frúctibus, inquit, eórum cognoscétis eos.


        Cum enim cœ́perint alíquibus tentatiónibus ea ipsa scílicet illis súbtrahi, vel negári, quæ
        isto velámine vel consecúti sunt, vel cónsequi cúpiunt: tunc necésse est ut appáreat, utrum
        lupus in ovína pelle sit, an ovis in sua. Non tamen proptérea ornátu supérfluo debet
        aspéctus hóminum mulcére Christiánus, quia illum parcum hábitum ac necessárium étiam
        simulatóres sǽpius usúrpant, ut incáutos decípiant: quia et illæ oves non debent pelles suas
        depónere, si aliquándo eis lupi se cóntegant.
      en: >-
        It is evident that by these precepts we are bidden to seek for inner gladness, lest, by
        running after that reward which is without, we should become conformed to the fashion of
        this world, and should so lose the promise of that blessing which is all the truer and more
        stable that it is inward, that blessing wherein God hath chosen us to be conformed to the
        likeness of His Son. In this chapter we will principally consider the fact that vain-glory
        findeth a ground for its exercise in struggling poverty as much as in worldly distinction
        and display; and this development is the most dangerous, because it entices under pretence
        of being the serving of God.


        He that is characterised by unbridled indulgence in luxury or in dress, or any other
        display, is by these very things easily shown to be a follower of worldly vanities, and
        deceiveth no one by putting on an hypocritical mask of godliness. But those professors of
        Christianity, who turn all eyes on themselves by an eccentric show of grovelling and
        dirtiness, not suffered by necessity, but by their own choice, of them we must judge by
        their other works whether their conduct really proceedeth from the desire of mortification
        by giving up unnecessary comfort, or is only the means of some ambition; the Lord biddeth us
        beware of wolves in sheep's clothing, but by their fruits, saith He, ye shall know them.


        The test is when, by diverse trials, such persons lose those things which under the cover
        of seeming unworldliness they have either gained or sought to gain. Then must it needs
        appear whether they be wolves in sheep's clothing, or indeed sheep in their own. But that
        hypocrites do the contrary maketh it no duty of a Christian to shine before the eyes of men
        with a display of needless luxury; the sheep need not to lay aside their own clothing
        because wolves sometimes falsely assume it.
    responsory:
      la: "R. Veni hódie ad fontem aquæ, et orávi Dóminum, dicens: * Dómine, Deus Abraham, tu prósperum fecísti desidérium meum.\nV. Igitur puélla, cui díxero, Da mihi aquam de hýdria tua, ut bibam: et illa díxerit, Bibe, dómine, et camélis tuis potum tríbuam: ipsa est, quam præparávit Dóminus fílio dómini mei.\nR. Dómine, Deus Abraham, tu prósperum fecísti desidérium meum."
      en: "R. I came this day unto the well, and I besought the Lord, and said: * O Lord God of Abraham, Thou hast prospered my way.\nV. Therefore the virgin to whom I shall say, Give me water of thy pitcher to drink, and she shall say to me, Drink, my lord, and I will give thy camels drink also; let the same be the woman whom the Lord hath appointed out for my master's son.\nR. O Lord God of Abraham, Thou hast prospered my way."
    status: { la: verified, en: verified }
