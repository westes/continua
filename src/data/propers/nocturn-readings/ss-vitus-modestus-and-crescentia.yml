# Matins Nocturn 2 reading for Ss. Vitus, Modestus, and Crescentia,
# Martyrs (Jun 15) — SanctiM/06-15M.txt bases `@Sancti/06-15` (the
# whole day, with no Nocturn 2/3 override) but narrows the Officium to
# St. Vitus alone, the same "Monastic office narrows a joint feast"
# pattern already seen for `ss-vincent-and-anastasius.yml`,
# `ss-cletus-and-marcellinus.yml`, `ss-alexander-eventius-theodulus-and-juvenal.yml`,
# and `ss-marcellinus-peter-and-erasmus.yml` — the full three-martyr
# text is used here per vu-prefer-text-over-missing (see memory
# vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/06-15.txt, English/Sancti/06-15.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: ss-vitus-modestus-and-crescentia
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Vitus admodum puer inscio patre baptizatus est: quod cum ille rescivisset, nihil
        prætermisit, quo filium a christiana religione removeret. Qua in voluntate permanentem,
        Valeriano judici verberibus castigandum tradidit. Sed nihilominus in sententia
        persistens, patri redditus est. Sed dum eum pater gravius punire cogitat, Vitus Angeli
        monitu, comitibus Modesto et Crescentia, ejus educatoribus, migrat in alienas terras:
        ibique eam sanctitatis laudem adeptus est, ut ejus fama ad Diocletianum perlata, ipsum
        imperator accerseret, ut filium suum a dæmone vexatum liberaret: Quo liberato, cum ei
        amplissimis præmiis ingratus imperator, ut deos coleret, persuadere non potuisset, una
        cum Modesto et Crescentia vinculis constrictum mittit in carcerem. Quos ubi
        constantiores esse comperit, demitti jubet in ingens vas liquato plumbo, ferventi resina
        ac pice plenum: in quo cum trium Hebræorum puerorum more divinos hymnos canerent, inde
        erepti leoni objiciuntur: qui prostérnens se, eorum pedes lambebat. Quare inflammatus
        ira imperator, quod multitudinem videbat miraculo commoveri, eos in catasta sterni jubet
        et ita cædi eorum membra, atque ossa divelli. Quo tempore tonitrua, fulgura, magnique
        terræmotus fuere, quibus templa deorum corruerunt, et multi oppressi sunt. Eorum
        reliquias Florentia nobilis femina, unguentis conditas, honorifice sepelivit.
      en: >-
        This Vitus was a child who was baptized without his father's knowledge. When his father
        had found it out, he used his best endeavours to dissuade his son from the Christian
        religion, but as he found him persistent in it, he handed him over to Valerian the judge
        to be whipped. But as he still remained as unshaken as before, he was given back to his
        father. But while his father was turning over in his mind to what severe discipline to
        subject him, Vitus, being warned by an Angel, fled out of the country, in company with his
        foster-parents Modestus and Crescentia. In his new home he gained great praise for
        holiness, so that the fame of it came to Diocletian, which Emperor sent for him to
        deliver his own child which was vexed with a devil. Him Vitus delivered, but when the
        Emperor found that with all his great gifts he could not bring him to worship the gods, he
        had the ingratitude to cast him and Modestus and Crescentia into prison, binding them in
        fetters. But when they were found in their prison more faithful than ever to their
        confession, the Emperor commanded them to be thrown into a great vessel full of melted
        lead, resin, and pitch. Therein these three, like the three Holy Children in the burning
        fiery furnace, sang praise to God, and upon that they were haled forth and cast to a lion,
        but he lay down before them, and licked their feet. Then the Emperor, being filled with
        fury, more especially because he saw that the multitude that looked on were stirred up at
        the miracle, commanded Vitus, Modestus, and Crescentia to be stretched upon a block and
        their limbs crushed, and their bones rent one from the other. While as they were dying
        there came great thunderings, and lightnings, and earthquakes, so that temples of the
        gods fell down, and many men were killed. As for that which remained of the Martyrs, the
        noble lady Florence took it, and embalmed it with spices, and honourably buried it.
    status: { la: verified, en: verified }
