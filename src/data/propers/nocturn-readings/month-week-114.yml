# Matins Nocturn 2 for "week IV of November" (Tempora/114-0.txt) — see
# month-week-081.yml's header for the id scheme. Live-verified (2026-11-15:
# "Dominica VI Post Epiphaniam IV. Novembris"). Responsory reuses 111's
# own Responsory4 (source's own cross-reference).
id: month-week-114
readings:
  - nocturn: 2
    isGospel: false
    source: "St. Augustine, Bishop of Hippo, City of God, Book 18, ch. 28"
    text:
      la: >-
        Osée prophéta, quanto profúndius quidem lóquitur, tanto operósius penetrátur. Sed áliquid inde
        suméndum est, et hic ex nostra promissióne ponéndum. Et erit, inquit, in loco quo dictum est
        eis, Non pópulus meus vos; vocabúntur et ipsi fílii Dei vivi. Hoc testimónium prophéticum de
        vocatióne pópuli Géntium, qui prius non pertinébat ad Deum, étiam Apóstoli intellexérunt.


        Et quia ipse quoque pópulus Géntium spiritáliter est in fíliis Abrahæ, ac per hoc recte
        dícitur Israël; proptérea séquitur, et dicit: Et congregabúntur fílii Juda et fílii Israël in
        idípsum, et ponent síbimet principátum unum, et ascéndent a terra. Hoc si adhuc velímus
        expónere, elóquii prophétici obtundétur sapor. Recolátur tamen lapis ille anguláris, et duo
        illi paríetes, unus ex Judǽis, alter ex Géntibus: ille nómine filiórum Juda, iste nómine
        filiórum Israël, eídem uni principátui suo in idípsum inniténtes, et ascendéntes agnoscántur
        in terra.


        Istos autem carnáles Israëlítas, qui nunc nolunt crédere in Christum, póstea creditúros, id
        est fílios eórum, (nam útique isti in suum locum moriéndo transíbunt) idem prophéta testátur,
        dicens: Quóniam diébus multis sedébunt fílii Israël sine rege, sine príncipe, sine sacrifício,
        sine altári, sine sacerdótio, sine manifestatiónibus. Quis non vídeat, nunc sic esse Judǽos?
      en: >-
        As to the Prophet Hosea, the deeper his meaning, the harder to pierce. But somewhat may be
        gotten out of him, and, as I promised, I will give it here. He saith: "And it shall come to
        pass that, in the place where it shall be said unto them, Ye are not My people, there it shall
        be said unto them, Ye are the sons of the living God." This was understood even by the
        Apostles as a Prophetic witness to the call of the Gentiles, who erst had not been God's
        people. (Rom. 9:24-26.)


        And since the converted Gentiles are the spiritual children of Abraham, and are therefore
        rightly called Israelites, therefore he goeth on, and saith: "Then shall the children of Judah
        and the children of Israel be gathered together, and appoint themselves one head, and they
        shall come up out of the land." If we went on expounding this, we should water down the flavour
        of the prophetic draught. Let there be remembered, however, that Corner Stone, and let there be
        acknowledged those twain walls, (which It bindeth in one,) the Jews and the Gentiles, one
        called the children of Judah and the other the children of Israel, bound together under One
        Head, and coming up out of the land.


        Concerning them that are now Israelites according to the flesh, that will not now believe in
        Christ, but shall believe hereafter (that is, their children shall believe, for these shall
        die, and go to their own place), this same Prophet giveth witness, where he saith: "The
        children of Israel shall abide many days without a King, and without a Prince, and without a
        sacrifice, and without an Altar, and without a Priest, and without oracles." (3:4.) To whom is
        it not manifest that such is the state of the Jews now?
    responsory:
      la: "R. Super muros tuos, Jerúsalem, constítui custódes; * Tota die et nocte non tacébunt laudáre nomen Dómini.\nV. Prædicábunt pópulis fortitúdinem meam, et annuntiábunt géntibus glóriam meam.\nR. Tota die et nocte non tacébunt laudáre nomen Dómini."
      en: "R. I have set watchmen upon thy walls, O Jerusalem; * Which shall never hold their peace day nor night, to praise the name of the Lord.\nV. They shall proclaim My might unto the nations, and declare My glory unto the Gentiles.\nR. Which shall never hold their peace day nor night, to praise the name of the Lord."
    status: { la: verified, en: verified }
