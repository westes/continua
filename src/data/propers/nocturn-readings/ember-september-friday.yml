id: ember-september-friday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Luc 7:36-50", en: "Luke 7:36-50" }
    text:
      la: >-
        In illo témpore: Rogábat Jesum quidam de pharisǽis, ut manducáret cum illo. Et ingréssus
        domum pharisǽi, discúbuit. Et ecce múlier, quæ erat in civitáte peccátrix, ut cognóvit,
        quod accubuísset in domo pharisǽi, áttulit alabástrum unguénti: et stans retro secus pedes
        ejus, lácrimis cœpit rigáre pedes ejus, et capíllis cápitis sui tergébat, et osculabátur
        pedes ejus, et unguénto ungébat. Videns autem pharisǽus, qui vocáverat eum, ait intra se,
        dicens: Hic si esset Prophéta, sciret útique, quæ et qualis est múlier, quæ tangit eum:
        quia peccátrix est. Et respóndens Jesus, dixit ad illum: Simon, hábeo tibi áliquid dícere.
        At ille ait: Magíster, dic. Duo debitóres erant cuidam fœneratóri: unus debébat denários
        quingéntos, et álius quinquagínta. Non habéntibus illis, unde rédderent, donávit
        utrísque. Quis ergo eum plus díligit? Respóndens Simon, dixit: Æstimo, quia is, cui plus
        donávit. At ille dixit ei: Recte judicásti. Et convérsus ad mulíerem, dixit Simóni: Vides
        hanc mulíerem? Intrávi in domum tuam, aquam pédibus meis non dedísti: hæc autem lácrimis
        rigávit pedes meos et capíllis suis tersit. Osculum mihi non dedísti: hæc autem, ex quo
        intrávit, non cessávit osculári pedes meos. Oleo caput meum non unxísti: hæc autem
        unguénto unxit pedes meos. Propter quod dico tibi: Remittúntur ei peccáta multa, quóniam
        diléxit multum. Cui autem minus dimíttitur, minus díligit. Dixit autem ad illam:
        Remittúntur tibi peccáta. Et cœpérunt, qui simul accumbébant, dícere intra se: Quis est
        hic, qui étiam peccáta dimíttit? Dixit autem ad mulíerem: Fides tua te salvam fecit: vade
        in pace.
      en: >-
        At that time, one of the Pharisees asked Jesus to dine with him; so He went into the
        house of the Pharisee and reclined at table. And behold, a woman in the town who was a
        sinner, upon learning that He was at table in the Pharisee's house, brought an alabaster
        jar of ointment; and standing behind Him at His feet, she began to bathe His feet with her
        tears, and wiped them with the hair of her head, and kissed His feet, and anointed them
        with ointment. Now when the Pharisee, who had invited Him, saw it, he said to himself,
        "This man, were He a prophet, would surely know who and what manner of woman this is who
        is touching Him, for she is a sinner." And Jesus answered and said to him, "Simon, I have
        something to say to you." And he said, "Master, speak." "A certain money-lender had two
        debtors; the one owed five hundred denarii, the other fifty. As they had no means of
        paying, he forgave them both. Which of them, therefore, will love him more?" Simon
        answered and said, "He, I suppose, to whom he forgave more." And He said to him, "You have
        judged rightly." And turning to the woman, He said to Simon, "Do you see this woman? I
        came into your house; you gave Me no water for My feet; but she has bathed My feet with
        her tears, and has wiped them with her hair. You gave Me no kiss; but she, from the moment
        she entered, has not ceased to kiss My feet. You did not anoint My head with oil; but she
        has anointed My feet with ointment. Wherefore I say to you, her sins, many as they are,
        shall be forgiven her, because she has loved much. But he to whom little is forgiven,
        loves little." And He said to her, "Your sins are forgiven." And they who were at table
        with Him began to say within themselves, "Who is this man, who even forgives sins?" But He
        said to the woman, "Your faith has saved you; go in peace."
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "Pope St. Gregory the Great, Homily 33 on the Gospels, on Luke 7:36-50"
    text:
      la: >-
        Quem pharisǽus de falsa justítia præsúmens, nisi Judáicum pópulum; quem peccátrix múlier ad vestígia Dómini
        véniens et plorans, nisi convérsam gentilitátem desígnat? Quæ cum alabástro venit, unguéntum fudit, retro
        secus pedes Dómini stetit, lácrimis pedes rigávit, capíllis tersit, eosdémque quos infundébat et tergébat
        pedes osculári non désiit. Nos ergo, nos illa múlier expréssit, si toto corde ad Dóminum post peccáta
        redeámus, si ejus pœniténtiæ luctus imitémur. Quid namque unguénto, nisi bonæ odor opiniónis exprímitur?
        Unde et Paulus dicit: Christi bonus odor sumus Deo in omni loco.


        Si ergo recta ópera ágimus, quibus opiniónis bonæ odóre Ecclésiam respergámus, quid in Dómini córpore, nisi
        unguéntum fúndimus? Sed secus pedes Jesu múlier stetit: contra pedes enim dómini stétimus, cum in peccátis
        pósiti ejus itinéribus renitebámur. Sed si ad veram pœniténtiam post peccáta convértimur, jam retro secus
        pedes stamus; quia ejus vestígia séquimur, quem impugnabámus. Lácrimis múlier pedes ejus rigat: quod nos
        quoque veráciter ágimus, si quibúslibet últimis membris Dómini per compassiónis afféctum inclinámur, si
        sanctis ejus in tribulatióne compátimur, si eórum tristítiam, nostram putámus.


        Capíllis ergo pedes Dómini térgimus, quando sanctis ejus, quibus ex caritáte compátimur, étiam ex his quæ
        nobis supérfluunt, miserémur: quátenus sic mens per compassiónem dóleat, ut étiam larga manus afféctum
        dolóris osténdat. Rigat namque lácrimis Redemptóris pedes, sed capíllis suis non tergit, qui utcúmque
        proximórum dolóri compátitur, sed tamen eis ex his, quæ sibi supérfluunt, non miserétur. Plorat, et non
        tergit, qui verba quidem dolóris tríbuit, sed non ministrándo quæ desunt, vim dolóris mínime abscíndit.
        Osculátur múlier pedes, quos tergit: quod nos quoque plene ágimus, si studióse dilígimus, quos ex
        largitáte continémus: ne gravis nobis sit necéssitas próximi; ne ipsa nobis ejus indigéntia, quæ
        sustentátur, fiat onerósa: et cum manus necessária tríbuit, ánimus a dilectióne torpéscat.
      en: >-
        Of what is the Pharisee that was exalted by self-righteousness a type, but of the Jewish people? And of
        what the woman which was a sinner and came and wept at the Lord's feet, but of the conversion of the
        Gentiles? She brought an alabaster box of ointment, and stood at His feet behind Him weeping, and began to
        wash His Feet with tears, and did wipe them with the hairs of her head, and kissed His Feet, and anointed
        them with the ointment. Of us, therefore, even of us, was that woman a type, if after our sins we turn unto
        the Lord with all our heart, and imitate the example of her repentant grief. And of what is the ointment a
        type, but of the sweet savour of a good reputation? Whence also Paul saith: In every place we are unto God
        a sweet savour of Christ.


        If therefore we do good works, whereby we gain for the Church the savour of good reputation, what do we
        but pour ointment upon the body of the Lord? But the woman stood at the Feet of Jesus, behind Him we stood
        opposite to the Feet of the Lord, what time we were in sin, and went contrary unto His ways. But when we
        turn again, and truly repent us of our sins, we stand behind His Feet, for we follow His footsteps against
        Whom we once contended. The woman washed His Feet with her tears and we do in very deed the same when we
        show the tenderness of sympathy to any of His humbler members, when we feel with His Saints in their
        tribulations, when we make their woes our own.


        She wipes the Lord's Feet with our hair when we give charity, even out of such things as we have ourselves
        no need of, to His holy ones, with whom we feel in their trials, in as far as our heart so sympathizeth,
        that the bounty of our hand showeth the truth of our compassion. He washeth the Feet of the Redeemer, but
        wipeth them not with his hair, who feeleth for the sufferings of his neighbours, but nevertheless,
        relieveth them not, even out of such things as he himself hath no need for. He weepeth, but wipeth not, who
        offereth words of tenderness, but sootheth not sorrow by giving such things as be lacking. The woman
        kissed the Feet and we do fully the same, if we warmly love those whom out of bounty we support, so that
        the neediness of our neighbour is not grievous unto us, nor the penury which we relieve a weariness to us,
        nor, when the hand is giving what is needful, the heart is untouched by compassion.
    responsory:
      la: "R. Sufficiébat nobis paupértas nostra, ut divítiæ computaréntur: numquam fuísset pecúnia ipsa, pro qua misísti fílium nostrum, * Báculum senectútis nostræ!\nV. Heu me, fili mi, ut quid te mísimus peregrinári, lumen oculórum nostrórum?\nR. Báculum senectútis nostræ!"
      en: "R. Our poverty was enough for us, that it might have been accounted riches. O that the money had never been, for which thou hast sent away our son, * The staff of our old age.\nV. Alas, my son, wherefore have we sent thee wandering, even thee, the light of our eyes?\nR. The staff of our old age."
    status: { la: verified, en: verified }
