# Matins Nocturn 2 reading for Ss. Gordian and Epimachus, Martyrs (May 10).
# Sourced from web/www/horas/Latin/Sancti/05-10o.txt, English/Sancti/
# 05-10o.txt. The source carries only a single short lesson (Lectio93,
# headed "Commemoratio" in the English -- these two never had a full
# proper 9-lesson Matins even historically), transcribed whole as one
# Nocturn 2 reading, same "short/single source lesson" handling as
# st-gorgonius.yml. No Nocturn 3 of their own -- defers to the Common of
# Several Martyrs' own, not transcribed here.
id: ss-gordian-and-epimachus
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gordiánus judex, cum ad eum Januárius presbyter, ut condemnarétur, sub Juliáno
        Apostáta ductus esset, ab eódem in christiána fide instrúctus, cum uxóre et
        quinquagínta tribus áliis ex eádem família Romæ baptizátur. Quare præféctus,
        relegáto Januário, Gordiánum a Clementiáno vicário incíudi jubet in cárcerem: qui
        póstea eúmdem Gordiánum vinctum caténis ad se accersítum, cum a fídei propósito
        deterréri non posset, plumbátis diu cæsum, cápite plecti ímperat. Cujus corpus ante
        Apóllinis templum cánibus objéctum, noctu a Christiánis via Latína sepelítur in
        eádem crypta, in quam relíquiæ beáti Epimáchi Mártyris translátæ fúerant ab
        Alexandría: ubi is diu propter Christi confessiónem constríctus in cárcere,
        postrémo combústus, martýrio coronátus est.
      en: >-
        Gordian was a judge before whom, in the reign of Julian the Apostate, Januarius the
        Priest was brought to be condemned. Januarius instructed Gordian in the Christian
        faith, and himself, with his wife, and fifty-three other persons of the same
        household, were all baptized at Rome. On this account the Praetor sent back
        Januarius, and ordered Clementian the Deputy to cast Gordian into prison. Afterward
        he caused the same Gordian to be brought before him in chains, and when he found he
        could not shake him in his will to cleave to the faith, he commanded that he should
        first be scourged with whips loaded with lead, and thereafter beheaded. His body
        was thrown out before the temple of Apollo for dogs to eat, but the Christians
        buried it at night in the catacombs upon the Latin Way, in the same vault where
        were already lying the remains of the blessed Martyr Epimachus. These had been
        brought from Alexandria, in which city Epimachus had long been imprisoned for
        owning Christ, and had in the end grasped the crown of his testimony by being
        burnt alive.
    status: { la: verified, en: verified }
