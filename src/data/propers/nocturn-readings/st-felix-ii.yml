# Matins Nocturn 2 reading for St. Felix II, Pope and Martyr (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/07-29-FelixII.txt, [Lectio4], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-felix-ii
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Felix secúndus Románus, patre Anastasio, ex Románæ Ecclésiæ archidiacono in Pontíficem
        eléctus est, vivénte Libério. Cum autem de Felícis pontificátu, témpore Gregórii décimi
        tértii, non levis controversia incidísset, virique gravissimi diversum sentirent, áccidit eo
        ipso témpore, ut in diaconia sanctórum Mártyrum Cosmæ et Damiáni, in foro Románo, quidam
        thesáurum quæréntes, in arcam marmoream incíderint: in qua corpus sancti Felícis repértum
        est, una cum lapideo laterculo, ibídem intus posito, hisque lítteris exarato: Corpus sancti
        Felícis Papæ et Mártyris, qui damnávit Constantium. Cóntigit id prídie ejus diéi quo Felícis
        in Ecclésia natális dies agi consuéverat, quarto Kaléndas Augústi, anno Dómini millésimo
        quingentésimo octogésimo secúndo. Unde Felice quasi pro se testimónium reddente, festum ejus
        in eádem diaconia, cum majóri solemnitáte síngulis annis celebrári consuevit.
      en: >-
        Felix the Second, a Roman, the son of Anastasius, was chosen Pontiff from being archdeacon
        of the Roman Church, while Liberius was still living. Since in the time of Gregory XIII a
        not slight controversy had arisen about the pontificate of Felix, and weighty men held
        differing views, it happened at that very time that in the deaconry of the holy martyrs
        Cosmas and Damian, in the Roman Forum, certain persons seeking treasure fell upon a marble
        coffin, in which was found the body of St. Felix, together with a stone tablet placed within
        it and inscribed with these letters: The body of St. Felix, Pope and Martyr, who condemned
        Constantius. This happened on the day before that on which Felix's birthday was wont to be
        kept in the Church, the fourth day before the Kalends of August, in the year of the Lord
        1582. Whence, Felix as it were bearing witness for himself, his feast has been customarily
        celebrated in the same deaconry with greater solemnity every year.
    status: { la: verified, en: draft }
