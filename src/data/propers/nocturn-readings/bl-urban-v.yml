# Matins Nocturn 2 reading for Bl. Urban V, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/12-19-Urbanus V.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: bl-urban-v
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Urbánus Quintus, Póntifex Máximus, nóbili Grimoardorum gente natus, in Castro Grisaco
        Diœcésis Mimatensis, quum innocéntia adolescéntia floreret, monásticum hábitum sub régula
        sancti Benedícti índuit, ac in Massiliense cœnóbium sancti Victóris cooptandus, vota
        nuncupávit. In Theologíæ ac Juris disciplínis ita excélluit, ut per plures annos Tolosæ,
        Parísiis, Avenione, in Monte Pessulano, Decréta summa cum laude interpretaretur. Abbas dein
        sancti Germáni Antissiodorensis a Cleménte Sexto, póstmodum ab Innocéntio Sexto sancti
        Victóris Massiliensis præses renuntiátus, tam império, quam obediéntia summus et exímius, ad
        majóra jam parátus, dum árduis negótiis et legatiónibus pro Ecclésia fungeretur, in Petri
        Sedem assúmptus, Avenione ritu solémni coronátus est.


        Vix inito Pontificátu ánimum admovit ad Sedem Apostólicam in Urbem reducendam, ad mores
        Fidélium emendandos, ad Clericórum restaurandam disciplínam, ad Claustra reformanda, ad
        Cathólicam fidem propagándam. Apostolicas enim Missiónes, Frátribus Minóribus, commissas
        promóvit usque ad Tartaros et ultimos Orientales, multósque Hæréticos ex Albania, Valachia
        et Bulgaria ad Ecclésiam Cathólicam redúxit. Nihil étiam omísit ut Græcórum contumaciam
        vinceret, recépta semel et íterum ab Imperatóre Joánne Fídei professióne. Sacrum bellum
        contra Infidéles indíxit, ac Rege Cypri copiis præfécto, Alexandriam Ægýpti felíciter
        expugnávit.


        Ínterim Civilem Sedis Apostólicæ Principatum pene eversum, Ægidio Cardinale Albornotio
        egrégiam opem conferente, ita restítuit, ut sibi et successoribus suis, necessaria tandem
        libertáte parta, lubens et ovans, in almam Urbem, cum ingénti Romanórum gáudio redierit.
        Basílicas Petri et Pauli instauravit, ac sacrosanctam Lateranensem Ecclésiam incéndio
        pénitus absumptam magnis súmptibus restítuit. In qua cápita Príncipum Apostolórum,
        retroáctis tempóribus in sacéllum sancti Lauréntii transláta, recognavit, eáque solémniter
        pópulo románo osténsa et in Thecas inserta auro et gemmis distincta, fidélibus colenda
        propósuit. Monastérium in Monte Pessulano instítuit; prætérea Montis Cassini Cœnóbium in
        priscum decus alter quasi conditor, redintegravit. Demum ab Urbe cum ánimo íterum
        revertendi, ob Ecclésiæ negótia discéssit, et Aveniónem pervénit, ubi letháli morbo
        corréptus, pretiósam mortem oppétiit anno millésimo tercentésimo septuagésimo. Miráculis
        post óbitum clarus de positus est in sancti Victóris Ecclésia ubi adhuc vivens sepúlcrum
        sibi statuerat. Cultum, ab immemorabili témpore eídem exhibitum, post quintum ab óbitu
        revolutum sǽculum Pius Nonus Póntifex Máximus prævio Sacrórum Rítuum Congregatiónis consílio
        approbávit et confirmávit; ej usque Offícium et Missam sub ritu duplici a Clero Románo et a
        plúribus diœcesibus recitari celebrarique benígne indúlsit.
      en: >-
        Urban the Fifth, Supreme Pontiff, born of the noble family of the Grimoards, at Grisac in
        the diocese of Mende, while he flourished in innocent youth, put on the monastic habit under
        the rule of St. Benedict, and, being received into the monastery of St. Victor at
        Marseilles, made his vows. In theological and juridical studies he so excelled that for many
        years at Toulouse, Paris, Avignon, and Montpellier he interpreted the Decretals with the
        highest praise. Abbot afterwards of St. Germain of Auxerre by Clement the Sixth, then
        superior of St. Victor at Marseilles by Innocent the Sixth, eminent alike in authority and
        obedience, already prepared for greater things, while he was discharging arduous affairs and
        legations for the Church, he was raised to the See of Peter, and at Avignon was crowned with
        solemn rite.


        Scarcely had he entered the pontificate when he turned his mind to bringing the Apostolic
        See back to the City, to amending the morals of the Faithful, to restoring the discipline of
        clerics, to reforming the cloisters, and to propagating the Catholic faith. For he promoted
        the apostolic missions entrusted to the Friars Minor as far as the Tartars and the furthest
        Orientals, and brought back many heretics of Albania, Wallachia and Bulgaria to the Catholic
        Church. He also omitted nothing to overcome the obstinacy of the Greeks, the profession of
        faith being received once and again from the Emperor John. He proclaimed a holy war against
        the infidels, and, the King of Cyprus being placed at the head of the forces, happily took
        Alexandria in Egypt.


        Meanwhile the civil principality of the Apostolic See, almost overthrown, with the excellent
        help of Cardinal Gil Albornoz, he so restored that, necessary liberty having at last been
        obtained for himself and his successors, he returned gladly and exultant to the fostering
        City amid the great joy of the Romans. He restored the basilicas of Peter and Paul, and at
        great expense rebuilt the sacrosanct Lateran Church entirely consumed by fire. In it the
        heads of the Princes of the Apostles, translated in earlier times to the chapel of St.
        Lawrence, he recognized, and, solemnly shown to the Roman people and set in reliquaries
        adorned with gold and gems, proposed them to the faithful for veneration. He founded a
        monastery at Montpellier; and besides he restored the monastery of Monte Cassino to its
        ancient splendour, as though a second founder. At length he left the City with the intention
        of returning again, on account of the affairs of the Church, and came to Avignon, where,
        seized with a deadly illness, he met a precious death in the year one thousand three hundred
        and seventy. Renowned for miracles after his death he was laid in the church of St. Victor,
        where while still living he had appointed his sepulchre. The cult rendered to him from time
        immemorial, after the fifth century had revolved from his death, Pius the Ninth, Supreme
        Pontiff, with the previous advice of the Sacred Congregation of Rites, approved and
        confirmed; and he graciously granted that his Office and Mass be recited and celebrated
        under the double rite by the Roman Clergy and by several dioceses.
    status: { la: verified, en: draft }
