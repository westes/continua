# Matins Nocturn 2-3 readings for St. Gabriel of Our Lady of Sorrows,
# Confessor (Feb 27). Sourced directly from
# web/www/horas/Latin/Sancti/02-27.txt, English/Sancti/02-27.txt.
#
# Nocturn 2: Lectio4-6 combined into one reading, one continuous vita.
# Nocturn 3: Lectio7's Gospel citation (Mark 10:13-21) is a bare
# incipit ("Et réliqua") in the horas file, but this same feast's own
# Missale Evangelium (web/www/missa/Latin+English/Sancti/02-27.txt)
# carries the full pericope verbatim, so it is authored in full below
# (isGospel: true, immediately before the homily), the Venerable Bede's
# homily (Lectio7's homily + Lectio8-9 combined).
#
# Update (2026-09-05): the Gospel pericope itself is now authored
# (previously left unauthored per the "bare incipit, skip it"
# convention) — sourced from the day's own Missale Gospel above, not
# guessed at.
id: st-gabriel-of-our-lady-of-sorrows
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Gabriel, Assisii in Umbria, honesto genere natus, et Franciscus ob seráphici civis
        memóriam vocatus, egregiam animi índolem a púero osténdit. Adoléscens, cum Spoleti
        litteris operam daret, inani sæculi spécie et pompa aliquantulum állici visus est.
        Sed miserentis Dei munere, qui eum ad perfectiónem christianæ vitæ jamdúdum
        invitabat, cum in morbum incidísset, sæculi vanitátem fastidire cœpit, atque
        immortalia dumtáxat bona appétere. Quo autem citius Deo vocanti obtemperaret,
        factum est, ut insignem illam beatíssimæ Vírginis Icónem, solemni pompa extra
        Spoletinæ ecclésiæ septa delatam intúitus, divini amoris flammam conciperet,
        simulque Institutum Clericórum a Passióne Jesu amplecti statúeret. Itaque non
        exíguas difficultates eluctatus, in recessu Morrovallénsi, lúgubrem vestem lætus
        induit, et Gabriel a Vírgine perdolénte maluit appellári; ad ejusdem gaudiórum et
        dolórum memóriam perpetuo recoléndam.


        In tirocinio, cum regulari observántia et ómnium exercitatióne virtútum cotidie
        magis eminéret, brevi eo pérvenit, ut absolutæ sanctimoniæ exemplar haberétur non
        modo a sodálibus, vel provectis, sed étiam ultra cœnobii septa, factus bonus odor
        Christi in omni loco. Dominicæ passiónis cultor assiduus, in ea meditanda dies
        noctesque insumebat. In divinam Eucharistiam, quæ ejusdem Passiónis memóriam
        prodit, incredibili quodam studio ferebátur; qua cum se refíceret, seraphico ardore
        flagrábat. Nihil autem insígnius quam ejus erga magnam Dei Parentem pietas fuit.
        Ipsam omni obsequii genere percólere consuevit; sed præsertim confectam
        afflictámque cruciátibus Jesu tam dolenter contemplari, ut vim lacrimárum
        profúnderet. Pérdolens Virgo quasi tota ei vitæ rátio fuit, adeptæque ab eo
        sanctitátis magistra; ita ut inter æquales una fúerit senténtia, ideo excitátum Dei
        famulum divinitus fuísse, ut cultus Maríæ perdolentis magnum exemplo ejus cáperet
        increméntum.


        Inter ceteras virtútes christianam humilitátem et obœdiéntiam maxime diléxit: nam
        inter omnes se minimum exístimans, abjectíssima quæque ministeria domus cupide
        affectabat, et antistitum suórum non modo jussa, sed et optáta diligentíssime
        perficiebat. Idem, refrenátis sensibus et vitæ asperitáte usus, illibátum retinuit
        florem virginitátis ac plane mundo crucifixus unice Deo vixit, intima Dómini sui
        fruítus consuetúdine. Ita brevem vitæ cursum tot virtútibus nobilitátum
        conficiens, Insulæ in Aprutio, caritátis incendio verius quam vi morbi consumptus,
        divinæque Matris ope recreatus, placidíssimo éxitu ad Superos evolávit, anno
        millesimo octingentésimo sexagesimo secundo, ætátis suæ vigesimo quarto. Eum
        deinceps, a Deo miraculis illustrátum, Pius Papa décimus Cælitum beatórum número
        accensuit. Benedíctus vero décimus quintus, Pontifex maximus, anno millesimo
        nongentésimo vigesimo, post cónditum Institutum a Passióne ducentésimo, in
        solemnitate Ascensiónis Dómini, beato júveni Sanctórum honores decrevit; et Pius
        undecimus ejus Offícium et Missam ad universam Ecclésiam extendit.
      en: >-
        Gabriel, born at Assisi in Umbria of a respectable family, and called Francis in
        memory of his seraphic fellow-townsman, showed from boyhood an excellent disposition
        of soul. As a youth, when studying letters at Spoleto, he seemed for a time to be
        allured by the empty beauty and pomp of the world. But by the gift of the merciful
        God, who had already called him to the perfection of a Christian life when he had
        fallen sick, he began to tire of the vanity of the world, and to desire immortal
        treasures alone. But to quicken his obedience to the call of God, it happened that
        as he saw the celebrated Image of the Blessed Virgin being carried with solemn pomp
        outside the precincts of the church of Spoleto, he experienced the flame of divine
        love, and at the same time decided to enter the Institute of the Clerks of the
        Passion of Jesus. Therefore, after overcoming no slight difficulties, he joyfully
        donned the somber habit in the secluded place of Morrovalle, and chose to be called
        Gabriel of Our Lady of Sorrows, to recall forever the memory of her joys and griefs.


        In the novitiate, day by day he became conspicuous for regular observance and for
        the exercise of all the virtues, and in a short time he came to be considered a
        pattern of perfect holiness, not only by his companions and his seniors, but also
        beyond the confines of the monastery; he became a sweet odour in Christ in every
        place. An assiduous devotee of the Lord's Passion, he spent days and nights
        meditating upon it. He was drawn by unbelievable zeal towards the Holy Eucharist, a
        memorial of that Passion; and when he nourished himself with it, he burned with
        seraphic ardour. There was nothing more noticeable than his filial piety towards the
        great Mother of God. He was accustomed to pay her honour for every type of devotion,
        but especially to contemplate her stricken and afflicted by the sufferings of Jesus,
        with such sorrow that he shed floods of tears. The sorrowful Virgin was, as it were,
        the whole reason of his being, and the teacher of the holiness that he had acquired.
        As a result all his associates shared the one opinion that this servant of God had
        been inspired from on high so that the cult of St. Mary of Sorrows through his
        example might receive a great increase.


        Among other virtues, he especially loved Christian humility and obedience; for he
        considered himself the least of all. He therefore strove eagerly to do all the most
        menial work of the house, and he most diligently performed, not only the direct
        commands, but even the unexpressed wishes of his superiors. Curbing his senses, and
        accustoming himself to a life of austerity, he retained unfaded the flower of his
        virginity, and completely crucified to the world, he lived to God alone, enjoying an
        intimate familiarity with his Lord. And so, at Isola in the Abruzzi, filling the
        short span of his life with so many noble virtues, consumed by the fire of charity
        rather than by disease, and refreshed by the aid of the Mother of God, his soul flew
        to heaven in a most peaceful journey in the year 1862, at the age of twenty-four.
        Then, as he had been made illustrious by God through miracles, Pope Pius X added him
        to the number of the Blessed in heaven. Likewise, the Supreme Pontiff Benedict XV in
        1920, two hundred years after the foundation of the Institute of the Passion, on the
        feast of the Ascension of the Lord, decreed the honours of the Saints to the blessed
        youth; and Pius XI extended his Office and Mass to the Universal Church.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Marc 10:13-21", en: "Mark 10:13-21" }
    text:
      la: >-
        In illo témpore: Offerébant Jesu parvulos, ut tángeret illos. Discípuli autem
        comminabántur offeréntibus. Quos cum vidéret Jesus, indígne tulit et ait illis: Sinite
        párvulos veníre ad me, et ne prohibuéritis eos: tálium enim est regnum Dei. Amen, dico
        vobis: Quisquis non recéperit regnum Dei velut párvulus, non intrábit in illud. Et
        compléxans eos et impónens manus super illos, benedicébat eos. Et cum egréssus esset
        in viam, procúrrens quidam genu flexo ante eum, rogábat eum: Magíster bone, quid
        fáciam, ut vitam ætérnam percípiam? Jesus autem dixit ei: Quid me dicis bonum? Nemo
        bonus, nisi unus Deus. Præcépta nosti: Ne adúlteris, Ne occídas, Ne furóris, Ne
        falsum testimónium díxeris, Ne fraudem féceris, Hónora patrem tuum et matrem. At ille
        respóndens, ait illi: Magíster, hæc ómnia observávi a juventúte mea. Jesus autem
        intúitus eum, diléxit eum et dixit ei: Unum tibi deest: vade, quæcúmque habes, vende
        et da paupéribus, et habébis thesáurum in cœlo: et veni, séquere me.
      en: >-
        At that time, they were bringing little children to Jesus that He might touch them;
        but the disciples rebuked those who brought them. But when Jesus saw them, He was
        indignant, and said to them, Let the little children come to Me, and do not hinder
        them, for of such is the kingdom of God. Amen I say to you, whoever does not accept
        the kingdom of God as a little child will not enter into it. And He put His arms
        about them, He began to bless them. And as he was going forth on His journey, a
        certain man running up fell upon his knees before Him, and asked Him, Good Master,
        what shall I do to gain eternal life? But Jesus said to him, Why do you call Me good?
        No one is good but only God. You know the commandments: You shall not commit
        adultery. You shall not kill. You shall not steal. You shall not bear false witness.
        You shall not defraud. Honor your father and mother. And he answered and said,
        Master, all these I have kept ever since I was a child. And Jesus, looking upon him,
        loved him, and said to him, One thing is lacking to you; go, sell whatever you have,
        and give to the poor, and you shall have treasure in heaven; and come, follow Me.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "The Venerable Bede, Commentary on Mark (on Mark 10:13-21)"
    text:
      la: >-
        Ait discípulis Jesus: Sínite párvulos veníre ad me, et ne prohibuéritis eos; talium
        enim est regnum Dei. Significanter dixit: Talium est; non: Istórum; ut osténderet,
        non ætátem regnare, sed mores; et his, qui similem haberent innocéntiam et
        simplicitátem, præmium repromitti: Apóstolo quoque in eandem senténtiam
        congruénte: Fratres, nolíte fíeri púeri sensibus; sed malítia párvuli estote, sensu
        autem ut perfecti sitis. Amen, dico vobis: quisquis non recéperit regnum Dei velut
        párvulus, non intrábit in illud. Sicut puer non persevérat in iracúndia, non læsus
        méminit, non videns pulchram mulierem delectátur, non aliud cogitat, aliud
        lóquitur; sic et vos, nisi talem habuéritis innocéntiam et animi puritátem, regnum
        cælórum non poteritis intrare. Aliter, regnum Dei, id est doctrinam Evangélii,
        sicut párvuli accípere jubemur; quia quómodo párvulus in discéndo non contradicit
        doctóribus neque ratiónes et verba componit advérsum eos resistens, sed fideliter
        suscipit quod docétur et cum metu obtemperat et quiescit; ita et nos, in obœdiéndo
        simpliciter et sine ulla rectractatióne verbis Dómini, fácere debemus. Et
        complexans eos, et impónens manus super illos, benedicebat eos. Complexus benedicit
        párvulos, ut húmiles spíritu sua benedictióne, grátia et dilectióne dignos esse
        significet.


        Et, cum egréssus esset in viam, procurrens quidam, genu flexo ante eum, rogábat
        eum: Magister bone, quid fáciam, ut vitam ætérnam percipiam? Audierat, credo, iste
        quæsítor vitæ ætérnæ a Dómino, tantum eos, qui parvulórum velint esse similes,
        dignos esse introítu regni cæléstis: atque ideo curam gerens tractátus certioris,
        poscit sibi non per parábolas, sed aperte, quibus óperum meritis vitam ætérnam
        cónsequi possit, exponi. Jesus autem dixit ei: Præcepta nosti. Hæc est puerílis
        innocéntiæ castitas, quæ nobis imitanda propónitur, si regnum Dei volumus intrare.
        At ille respondens, ait ille: Magister, hæc ómnia observávi a juventúte mea. Non
        est putandus homo iste vel voto tentántis (ut quidam putavére) Dóminum
        interrogasse, vel de sua esse vita mentitus, cum se legis mandáta custodisse
        dicebat; sed, simpliciter, ut víxerit esse conféssus. Quia si mendacii aut
        simulatiónis noxa reus tenerétur, nequáquam intuitus arcana cordis ejus, eum
        diligere dicerétur Jesus.


        Díligit enim Dóminus eos, qui mandáta legis, quamvis minora, custódiunt: sed
        nihilóminus, quod in lege minus fuerat, iis qui perfecti esse desiderant, osténdit,
        quia non venit solvere legem aut Prophétas, sed adimplere. Ad quam profecto
        adimpletiónem pertinet, quod hic consequenter adjungitur: Vade, quæcúmque habes
        vende et da paupéribus, et habebis thesáurum in cælo, et veni, séquere me.
        Quicúmque perfectus esse volúerit, debet vendere quæ habet; et non ex parte
        véndere, sicut Ananías et Saphira, sed totum véndere: et cum vendiderit, dare omne
        paupéribus, et sic sibi præparáre thesáurum in regno cælórum. Nec hoc ad
        perfectiónem sufficit, nisi, post contemptas divítias, Salvatórem sequátur; id est
        relictis malis, fáciat bona. Facílius enim sæculum contemnitur quam volúntas.
        Multi divítias relinquéntes, Dóminum non sequúntur. Sequitur autem Dóminum, qui
        imitator ejus est et per vestígia illíus graditur. Qui enim dicit se in Christo
        credere, debet, quómodo ille ambulávit, et ipse ambuláre.
      en: >-
        Jesus saith unto his disciples: Suffer the little children to come unto me, and
        forbid them not: for of such is the kingdom of God. It is noteworthy that he saith:
        Of such; not: Of these. That is, he is concerned with conduct, not with age; for the
        reward is promised to all such as are like unto children, not in age, but in
        innocence and simplicity; as saith the Apostle: Be not children in understanding;
        howbeit, in malice be ye children, but in understanding be men. Verily I say unto
        you, Whosoever shall not receive the kingdom of God as a little child, he shall not
        enter therein. A child doth not for long remain angry or remember an injury; he
        taketh no lustful pleasure in looking at a beautiful woman; he doth not think one
        thing and say another. In like manner, ye also, unless ye have this innocence and
        purity of soul, cannot enter the kingdom of heaven. We are commanded to receive the
        kingdom of God (that is, the teaching of the Gospel) like as children, because they,
        when learning, do not contradict their teacher, nor adduce reasons and arguments
        against them, but trustingly accept what they are taught in respectful silence and
        obedience. And the Lord took them up in his arms, put his hands upon them, and
        blessed them. He blesseth the children by taking them up in his arms, to shew that
        such as are poor in spirit do merit his blessing, grace, and love.


        And as he was going forth on his journey, a certain man came running up, and fell
        on his knees before him, and asked him: Good Master, what shall I do that I may
        inherit eternal life? Doubtless this seeker after eternal life was one of those who
        had heard the Lord say that whoso shall not receive the kingdom of God as little
        child shall not enter therein; and therefore, taking the safer course, he asketh
        for himself not in parables, but simply and openly, for teaching concerning the
        meritorious works by which eternal life is to be gained. Whereupon Christ said:
        Thou knowest the commandments. This is the chastity of childlike innocence, which
        is proposed for our imitation, if we wish to enter the kingdom of God. But he
        answering, said unto him: Master, all these have I observed from my youth. This man
        should not be considered as having asked the Lord with a view to tempting him (as
        some have thought), or to have lied about his life when he said he had kept the
        commandments of the law; but that rather he was trying to explain how he had
        hitherto lived. Because, if he be considered guilty of lies and pretence, it would
        not have been said of Jesus, who looketh on the secrets of the heart, that he,
        beholding him, loved him.


        For the love of the Lord goeth out to all those who not only keep the commandments
        of the law, but have regard even for things which are not of strict precept. Which
        latter things he who came not to destroy the Law and the Prophets, but to fulfill
        them, showeth forth unto such as would be perfect, saying: Sell whatsoever thou
        hast, and give to the poor, and thou shalt have treasure in heaven; and come,
        follow me. Whosoever would be perfect must sell all (not merely in part, as did
        Ananias and Sapphira), and thereafter give all to the poor, and thus prepare for
        himself a treasure in the kingdom of heaven. But contempt for riches is not enough
        to achieve perfection. He must also follow the Saviour, leaving evil and doing
        good. For it is easier to spurn the world than the will; and many spurn their
        riches, but fail thereafter to follow the Lord. Whosoever would follow him must be
        his imitator, and walk in his footsteps. For whoso saith he believeth in Christ
        ought also to walk as Christ walked.
    status: { la: verified, en: verified }
