# Matins Nocturn 2-3 readings for All Saints of the Benedictine Order
# (Nov 13) — a genuine Monastic-only feast: no `Sancti/11-13*.txt`
# names it at all (the general Tridentine calendar's own Nov 13 is a
# different, later saint, St. Didacus); its own content exists only at
# web/www/horas/Latin/SanctiM/11-13M.txt (a rare case where an
# English/SanctiM translation also exists, unlike most of this pass's
# genuinely Monastic-only saints — see memory vu-matins-sanctim-saints).
# Nocturn 1 (Lectio1-4) falls back to Common of Several Confessors, not
# proper text, so not authored here.
#
# Nocturn 2: Lectio5-8 (St. John Damascene's excerpt from the Life of
# Barlaam and Josaphat, praising the saints generally) combined into
# one reading, one continuous excerpt. One garbled character in the
# Latin source ("exsultࢱtio") silently corrected to "exsultátio" in
# transcription.
# Nocturn 3: Lectio9's Gospel citation (Matt 19:27-29) is a bare
# incipit ("Et réliqua") in this saint's own file, so the homily
# portion (combined with Lectio10-12 as one continuous excerpt of St.
# Bernard's own sermon on St. Benedict) was originally authored alone.
#
# Update (2026-09-05): the Gospel pericope itself is now authored too
# (isGospel: true, immediately before the homily) — the citation
# resolves (via the Rule's Common of Several Confessors, `@Commune/
# C5b`, the same Common this feast's own Nocturn 1 falls back to) to
# horas/Latin/Commune/C5b.txt's own [Evangelium], not guessed at.
id: all-saints-of-the-benedictine-order
readings:
  - nocturn: 2
    isGospel: false
    source: "St. John Damascene, Life of Barlaam and Josaphat, ch. 2"
    text:
      la: >-
        Beáti isti ac ter beáti, ut qui Dei amóre flagrárunt, atque ob ipsíus caritátem
        ómnia pro níhilo duxérunt. Síquidem lácrimas profudérunt, diéque ac nocte in luctu
        versáti sunt, ut perpétuam consolatiónem adisceréntur: seípsos ultro depressérunt, ut
        illic in altum attolleréntur. Carnes suas fame ac siti et vigíllis confecérunt, ut
        illic paradísis delíciæ et exsultátio ipsos excíperent.


        Spíritus Sancti tabernáculum per cordis puritátem exstitérunt, quemádmodum scriptum
        est: Inhabitábo in ipsis et inambulábo. Seípsis mundo crucifixérunt, ut ad Christi
        déxteram starent: lumbos suos in veritáte succinxérunt, atque in promptu semper
        lámpades habuérunt, immortális Sponsi advéntum expectántes. Nam, cum mentis óculis
        prǽditi essent, hórrendum illum diem semper prospiciébant, atque tum futurórum
        bonórum, tum futúri supplícii contemplatiónem ita in corde defíxam gerébant, ut ab
        ipsa nunquam divelleréntur. Atque hic laboráre studuérunt, ut sempitérnæ glóriæ
        cómpotes essent: perturbatiónum expértes, non secus atque Angeli fuérunt, ac nunc cum
        illis, quorum vitam imitáti sunt, choréas agunt.


        Beáti illi ac ter beáti, quóniam firmis mentis óculis præséntium rerum vanitátem,
        atque humánæ prosperitátis incertitúdinem et inconstántiam perspexérunt, eáque
        reíecta, sempitérna bona sibi ipsis condidérunt, ac vitam eam, quæ nunquam occídit,
        nec morte interrúmpitur, arripuérunt.


        Hos ígitur admirándos et sanctos viros nos quoque indígni ac despicábiles imitári
        studémus. Verum eórum vitæ cæléstis fastígium mínime asséqimur, sed pro
        infirmitátis nostræ ac míseræ facultátis módulo eórum vitam exprímus; atque
        ipsórum hábitum gérimus, étiam sui ópera non assequámur. Etenim, divínam hanc
        professiónem, peccátum propulsáre, atque incorruptiónis per divínum baptísma nobis
        concéssæ sóciam et opitulatrícem esse, perspéctum habémus.
      en: >-
        Blessed, yea, thrice blessed, are they that have them loved God, and, for his love's
        sake, have counted their suffering as nothing worth. For they wept and here mourned,
        day and night, that they might gain glory and everlasting comfort: they humbled
        themselves after willingly, that there they might be exalted: they afflicted the flesh
        with hunger and thirst and vigil, that there they might come to the pleasures and joys
        of Paradise.


        By their purity of heart they became a tabernacle of the Holy Ghost, as it is
        written, I will dwell in them and walk in them. They crucified themselves unto the
        world, that they might stand at the right hand of the Crucified: they girt their loins
        with truth, and alway had their lamps ready, looking for the coming of the immortal
        bridegroom. The eye of their mind being enlightened, they continually looked forward
        to that awful hour, and kept the contemplation of future happiness and everlasting
        punishment immovable from their hearts, and pained themselves to labour, that they
        might not lose eternal glory. They became passionless as the Angels, and now they
        weave the dance in their fellowship, whose lives also they imitated.


        Blessed, yea, thrice blessed are they, because with sure spiritual vision they
        discerned the vanity of this present world and the uncertainty and inconstancy of
        mortal fortune, and cast it aside, and laid up for themselves everlasting blessings,
        and laid hold of that life which never faileth, nor is broken by death.


        These then are the marvellous holy men whose examples we, that are poor and vile,
        strive to imitate, but cannot attain to the high level of the life of these heavenly
        citizens. Nevertheless, so far as is possible for our weakness and feeble power, we
        take this assurance, that this holy profession is a means to perfection and an aid to
        the incorruption given us by holy baptism.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 19:27-29", en: "Matt 19:27-29" }
    text:
      la: >-
        In illo témpore: Dixit Petrus ad Jesum: Ecce, nos relíquimus ómnia, et secúti sumus te:
        quid ergo erit nobis? Jesus autem dixit illis: Amen, dico vobis, quod vos, qui secúti
        estis me, in regeneratióne, cum séderit Fílius hóminis in sede majestátis suæ, sedébitis
        et vos super sedes duódecim, judicántes duódecim tribus Israël. Et omnis, qui relíquerit
        domum, vel fratres, aut soróres, aut patrem, aut matrem, aut uxórem, aut fílios, aut
        agros, propter nomen meum, céntuplum accípiet, et vitam ætérnam possidébit.
      en: >-
        At that time, Peter said to Jesus, "Behold, we have left all and followed You; what then
        shall we have?" And Jesus said to them, "Amen I say to you that you who have followed Me,
        in the regeneration when the Son of Man shall sit on the throne of His glory, shall also
        sit on twelve thrones, judging the twelve tribes of Israel. And everyone who has left
        house, or brothers, or sisters, or father, or mother, or wife, or children, or lands, for
        My name's sake, shall receive a hundredfold, and shall possess life everlasting."
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. Bernard of Clairvaux, Abbot, Sermon on St. Benedict (on Matt 19:27-29)"
    text:
      la: >-
        Modo útique, fratres, audístis in Evangélio promitténtem Dóminum et dicéntem
        discípulis: Sedébitis super sedes, judicántes duódecim tribus Israël. Ecce quies
        sessiónis et honor judícii. Nam et ipse Dóminus ad hæc nóluit perveníre, nisi per
        humilitátem et labórem. Unde et morte turpíssima condemnátus est, interrogátus
        torméntis, et oppróbriis saturátus: útique ut inimícus induátur confusióne, ipse
        páriter et omnes, qui imitántur eum, et prætergrediúntur viam. Ipse est, o iníque,
        ipse est, qui sessúrus est in sede majestátis suæ símilis Altíssimo, et coaltíssimus
        ei. Hoc útique cogitavérunt Angeli sancti, qui, cadénte malígno, apostasíæ illíus
        non consensérunt, nobis relinquéntes exémplum, ut, quemádmodum ipsi elegérunt
        ministráre, sic et nos faciámus.


        Qui enim labórem fúgiunt et honórem captant, illum se nóverint imitári, qui
        sessiónem altitudinémque quæsívit: et si non satis terret eos illíus culpa, térreat
        vel vindícta. Ad hæc vitánda prudéntiam nobis reliquérunt Sancti Dei, qui profécto
        sedébunt; ipsi, inquam, vermículi terræ judicántes sedébunt. Nescítis, ait
        Apóstolus, quia et Angelos judicábimus? Ipsi útique, qui ibant et flebant, mitténtes
        sémina sua, veniéntes autem vénient cum exsultatióne, portántes manípulos suos. Qui
        seminavérunt labórem et vilitátem, metent honórem páriter et quiétem. Pro
        confusiónem enim sua dúplici et labóre, in terra sua duplícia possidébunt. Unde et
        dicébat quidam: Vide humilitátem meam et labórem meum.


        Non solum autem ipsa vita, sed et promíssio vitæ ætérnæ et expectátio justórum,
        lætítia est, et tanta lætítia, ut omne, quod concupíscitur, ei non váleat
        comparári. Hanc quoque prudéntiam nobis Apóstoli sancti seminavérunt, quando,
        recedéntibus his, qui sapiéntiam hujus mundi sequebántur, quæ stultítia est apud
        Deum, et prudéntiam carnis, quæ mortem operátur et inimíca est Deo; ipsi Dómino
        adhæsérunt. Mártyres vero maniféstum est fortitúdinem seminásse. Porro Confessóres
        sectáti sunt justítiam in omni vita sua.


        Hac doctrína nos étiam ínstruit noster cæléstis pater, dux, magíster et légifer
        Benedíctus, et dírigit gressus nostros in viam pacis. Porro vitæ justítia omníno
        róborat et ánimat nos, ut tanto magis accendámur ad agénda quæ dócuit, quanto certi
        sumus eum non ália docuísse quam fécerit. Sermo quidem vivus et éfficax, exemplum
        óperis est, plúrimum fáciens suadíbile quod dícitur, dum monstrat factíbile quod
        suadétur. In hunc ergo modum sánctitas confórtat, pietátis infórmat, justítia
        confírmat. Quantæ enim pietátis fuit, quod non solum præséntibus prófuit, sed et pro
        futúris sollícitus fuit? Pascit vita, pascit doctrína, pascit intercessióne. Per
        quam incessánter adjúti, fructificáte et vos, caríssimi, quóniam in hoc pósiti
        estis, ut eátis et fructum afferátis. Imitémur et hunc; quóniam ad hoc venit, ut
        formam nobis tráderet, et viam demonstráret.
      en: >-
        Brethren, you have just heard our Lord making a promise to His disciples, saying to
        them: You shall sit on seats, judging the twelve tribes of Israel. Behold, the
        restfulness of being seated and the honour of passing judgment are promised. Now our
        Lord Himself was unwilling to receive these rewards except by humility and labour.
        Wherefore He was condemned to a most shameful death, loaded with torments, filled with
        opprobrium. So has He done, together with all who imitate Him in journeying on the
        way, in order that the enemy might be confounded. He it is, O wicked creature, He it
        is who will be seated on the throne of His Majesty, like to the Most High and equal to
        Him. The angels considered this when, at the fall of the evil one, they did not
        consent to his apostasy, thereby leaving us an example that as they chose to serve, so
        should we.


        Let those who fly labour and seek honour know that they imitate him who sought for
        himself power and majesty; and if the devil's crime does not terrify them, his
        punishment should. The saints of God, who indeed will be seated in judgment, have
        given us an example of prudence in avoiding these vices. They, I say, in their own
        esteem wretched worms of the earth, will sit in judgment. Do you not know, says the
        Apostle, that we shall judge even the angels? They indeed who went forth weeping,
        sowing their seed, will come with joy carrying their sheaves. They who have sown
        labour and humility reap honour and rest. Because for their double confusion and
        shame they will receive double in their land. Wherefore also a certain one has said:
        Behold my lowliness and sorrow.


        Not only that life itself, but also the promise of eternal life and the eager
        anticipation of it, are a joy for the just, and a joy so great that anything to be
        desired cannot be compared with it. This too the holy Apostles sowed for us as
        prudence, when, as those who followed the wisdom of this world (which is indeed
        foolishness in God's sight) and the prudence of the flesh (which worketh death and is
        inimical to God) withdrew from Christ, they themselves clung to our Lord. Manifestly,
        the martyrs sowed fortitude; the confessors followed justice throughout their lives.


        Our heavenly father, guide, master, and lawgiver Benedict, also instructs us in this
        doctrine and directs our steps along the way of peace. Moreover, he strengthens and
        animates us for a life of justice in such a way that we are so much the more impelled
        to practice what he taught as we are certain that he taught not otherwise than he
        acted. The example of works is indeed a living and effective sermon, since it makes
        what is spoken most persuasive, showing that that which is urged is possible. In this
        regard his sanctity comforts us, his piety instructs us, his justice strengthens us.
        With what great piety was he not animated who provided not only for his children
        present, but was also solicitous for those of the future! He nourishes us by his life,
        his teaching, and by his intercession. Being always thus helped, dearly beloved,
        become fruitful; since for this were you appointed, that you should go and bring forth
        fruit. Let us imitate him, because for this end he came, that he might give us the
        example and show us the way.
    status: { la: verified, en: verified }
