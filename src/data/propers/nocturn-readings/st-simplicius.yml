# Matins Nocturn 2 reading for St. Simplicius, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/03-02-Simplicius.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-simplicius
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Simplicius, Tiburtinus, patre Castorio, proxime post sanctum Hilarum Románæ Ecclésiæ
        principatum suscépit, ac difficíllimis tempóribus (cum magna ex parte christiáni orbis
        cathólica fides, ob cunctos fere príncipes hærési infectos, nutaret) summa vigilántia
        gubernávit. Leoni imperatóri petenti, ut rata haberéntur concéssa ab epíscopis synodi
        Chalcedonensis ecclésiæ Constantinopolitánæ privilégia, veheméntius réstitit, misso étiam
        eam ob causam Constantinópolim suo legáto. Eádem pastorale sollicitúdine plúrimum laborávit,
        ut Timótheus Ælurus Alexandrinæ ecclésiæ invasor, qui Constantinópoli líbere degens,
        adnitebatur quam máxime propagare hærésim, novumque Zenonis imperatóris ópera cogi
        concílium, pelleretur in exsílium, sicque integritáti suæ Alexandrína redderetur ecclésia.
        Reliquorum item perduellium pro nova synodo indicenda conatibus fórtiter óbstitit, asserens
        nova concilia non fácile convocanda, nisi cum áliquid in pravis sénsibus novum, aut in
        assertione dogmatum emersisset ambiguum.


        Damnávit íterum Petrum Moggum, alterum Alexandrinæ sedis invasorem, curavitque, ut ex urbe
        pelleretur, ne aliquos modicæ fídei inficeret, et ad perversitatis suæ factionem
        pertraheret. Timótheo Solofaciolo, legitimo ejúsdem ecclésiæ antistiti, juxta prístinum
        institútum, per suos legátos erróris sui condonationem expetenti, idcírco quod timóre
        perterritus Dioscorum ad altáre nominasset, véniam impertiit. Antiocheni epíscopi electionem
        ad seditiones vitandas Constantinópoli in concílii Nicæni præjudicium peractam, ea lege
        ratam hábuit, ut deínceps, secúndum patrum definitiones, Orientali comprovincialium
        episcopórum synodo, creatio Antiocheni pontíficis reservaretur. Oblatiónes ecclésiæ ita
        partiendas esse præcépit, ut una dumtáxat pórtio epíscopo, una itidem clero, duæ vero in
        ecclésiæ fabricam et peregrinos ac páuperes erogarentur. Zenonem epíscopum Hispalénsem
        vicária Sedis apostólicæ auctoritáte fulcivit, ne apostólicæ institutiónis decréta et
        sanctórum términos patrum in Hispániis transcendi permitteret.


        Státuit in Urbe hebdomadas, ut, propter baptísmum, et pœniténtiam peténtes, presbyteri
        quidem de regióne prima apud sanctum Paulum, de tértia apud sanctum Lauréntium, et de
        séptima apud sanctum Petrum manerent. Dedicávit basílicas sancti Stéphani in Cœlio monte,
        sancti Andréæ Apóstoli juxta sanctam Maríam, item áliam sancti Stéphani juxta sanctum
        Lauréntium, ac postrémo sanctæ Bibianæ Mártyris aliam intra Urbem juxta palátium Licinianum;
        itémque vasa complúra tum argentea, tum áurea Románæ cóntulit Ecclésiæ. Demum Zenone
        imperatóre, et Odoære Itáliæ rege, migrávit ad Dóminum. Hábuit ordinatiónes tres mense
        Decémbri, quibus creávit presbyteros quinquagínta octo, diáconos quíndecim, epíscopos per
        divérsa loca trigínta sex. Sacerdótium administrávit annos quíndecim, menses quinque, et
        dies decem.
      en: >-
        Simplicius, of Tibur, the son of Castorius, took up the headship of the Roman Church
        immediately after holy Hilary, and governed it with the greatest vigilance in most difficult
        times, when the Catholic faith in great part of the Christian world wavered, because nearly
        all princes were infected with heresy. He vehemently resisted the Emperor Leo, who asked
        that the privileges conceded to the church of Constantinople by the bishops of the synod of
        Chalcedon be held as valid, sending his legate to Constantinople for that cause. With the
        same pastoral solicitude he laboured very much that Timothy Aelurus, invader of the church
        of Alexandria, who, living freely at Constantinople, strove with all his might to propagate
        heresy and to have a new council convened through the efforts of the Emperor Zeno, should be
        driven into exile, and so the church of Alexandria be restored to its integrity. He likewise
        stoutly opposed the efforts of the rest of the rebels for the calling of a new synod,
        asserting that new councils are not easily to be convened unless something new had arisen in
        perverse opinions or some ambiguity in the assertion of dogmas.


        He condemned again Peter Mongus, another invader of the see of Alexandria, and saw to it
        that he was driven from the City, lest he infect some of weak faith and draw them into the
        faction of his perversity. To Timothy Solofaciolus, the lawful bishop of that church, who
        through his legates sought, according to the ancient practice, pardon for his error,
        because, struck with fear, he had named Dioscorus at the altar, he granted forgiveness. The
        election of the bishop of Antioch, carried out at Constantinople to avoid seditions, to the
        prejudice of the Council of Nicaea, he held valid on condition that thereafter, according to
        the definitions of the Fathers, the appointment of the Pontiff of Antioch be reserved to the
        synod of the comprovincial bishops of the East. He directed that the offerings of the church
        be divided in such a way that one portion go to the bishop, one likewise to the clergy, and
        two be spent on the fabric of the church and on pilgrims and the poor. He supported Zeno,
        bishop of Seville, with the vicarial authority of the Apostolic See, that he might not allow
        the decrees of apostolic institution and the boundaries of the holy fathers to be
        overstepped in Spain.


        He established in the City weekly turns, so that, for baptism and penance for those seeking
        them, priests of the first region would stay at St. Paul's, of the third at St. Lawrence's,
        and of the seventh at St. Peter's. He dedicated the basilicas of St. Stephen on the Caelian
        Hill, of St. Andrew the Apostle near St. Mary's, another of St. Stephen near St. Lawrence,
        and finally one of the holy martyr Bibiana within the City near the Licinian palace; he also
        bestowed on the Roman Church many vessels, both of silver and of gold. At last, in the time
        of the Emperor Zeno and Odoacer king of Italy, he departed to the Lord. He held three
        ordinations in the month of December, in which he created fifty-eight priests, fifteen
        deacons, and thirty-six bishops for various places. He administered the priesthood fifteen
        years, five months, and ten days.
    status: { la: verified, en: draft }
