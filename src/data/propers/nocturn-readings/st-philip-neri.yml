# Matins Nocturn 2 reading for St. Philip Neri, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/05-26.txt, English/Sancti/05-26.txt.
# Lectio4-6 combined into one reading, one continuous vita.
id: st-philip-neri
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Philippus Nerius, piis honestisque paréntibus Floréntiæ natus, ab ipsa ineunte
        ætate non obscura dedit futuræ sanctitátis indicia. Adoléscens, ampla patrui
        hereditáte dimissa, Romam se contulit; ubi philosophía ac sacris litteris
        eruditus, totum se Christo dicávit. Ea fuit abstinéntia, ut sæpe jejunus triduum
        permanserit. Vigiliis et oratiónibus intentus, septem Urbis Ecclésias frequenter
        visitans, apud cœmetérium Callísti in cæléstium rerum contemplatióne pernoctare
        consuevit. Sacerdos ex obediéntia factus, in animárum salúte procuranda totus
        fuit; et in confessiónibus audiéndis ad extremum usque diem perseverans,
        innumeros penne fílios Christo péperit; quos verbi Dei quotidiáno pabulo,
        sacramentórum frequéntia, oratiónis assiduitate, aliisque piis exercitatiónibus
        enutriri cupiens, Oratórii congregatiónem instituit.


        Caritate Dei vulnerátus languebat jugiter, tantoque cor ejus æstuábat ardore,
        ut, cum intra fines suos contineri non posset, illíus sinum, confractis atque
        elátis duabus cóstulis, mirabíliter Dóminus ampliaverit. Sacrum vero fáciens aut
        ferventius orans, in áëra quandoque sublatus, mira undique luce fulgere visus
        fuit. Egenos et páuperes omni caritátis officio prosequebátur: dignus, qui et
        Angelo in spécie páuperis eleemosynam erogaret; et, dum egéntibus noctu panem
        deferret, in fóveam lapsus, inde páriter ab Angelo incolumis eriperétur.
        Humilitáti addictus, ab honóribus semper abhorruit, atque ecclesiásticas
        dignitates, étiam primárias, non semel ultro delatas, constantíssime recusávit.


        Prophetíæ dono fuit illustris, et in animórum sensibus penetrandis mirifice
        enituit. Virginitátem perpetuo illibatam servávit; idque assecutus est, ut eos
        qui puritátem cólerent, ex odore, qui vero secus, ex fœtóre dignosceret.
        Abséntibus interdum appáruit, iisque periclitántibus opem tulit. Ægrotos
        plurimos et morti próximos sanitáti restituit. Mortuum quoque ad vitam
        revocávit. Cælestium spirituum et ipsíus Deiparæ Vírginis frequenter fuit
        apparitióne dignátus, ac plurimórum ánimas splendore circumfusas in cælum
        conscéndere vidit. Denique, anno salútis millesimo quingentésimo nonagesimo
        quinto, octavo Kalendas Junias, in quem diem inciderat festum Corporis Christi,
        Sacro maxima spíritus exsultatióne peracto, ceterisque functiónibus expletis,
        post mediam noctem, qua prædixerat hora, octogenarius obdormívit in Dómino. Quem
        Gregórius décimus quintus, miraculis clarum, in Sanctórum númerum rétulit.
      en: >-
        Philip Neri was born of godly and respectable parents at Florence, (on the 23rd
        day of July, in the year of grace 1515) From his earliest childhood he gave
        signs of the holiness of life which he afterwards attained. As a young man he
        gave up the rich inheritance which would have come to him from his uncle, and
        went to Rome, where, in the study of philosophy and theology, he gave himself
        altogether to Christ. His self-control was such that he sometimes fasted from
        all food for three days at a time. He was instant in watching and prayer, and
        during the frequent pilgrimages which he made to the seven churches of Rome, it
        was his custom to remain all night in prayer to God in the Catacomb of
        Kallistus. (On the 23rd of May, 1551) he became a Priest in obedience to the
        advice of his Confessor, and afterwards made the salvation of souls the one
        object of his existence; he heard confessions with unwearied tenderness until
        his dying day, and became the spiritual father in Christ of many sons, whom it
        was his beloved work to feed day by day upon the Word of God, upon the often
        receiving of the Sacraments, upon instant prayer, and upon other godly works: to
        the which end he founded the Congregation of the Oratory.


        He was full of the love of God, and his heart was so hot therewith, that it
        became straitened in its place, and the Lord was pleased to ease him by(the
        gristle which joined) the fourth and fifth ribs (on his left side) breaking, and
        so allowing more play to the internal organs. Sometimes, when he was saying
        Mass, or more intent than usual in prayer, he was seen to be raised off the
        ground, and become, in a strange manner, all shining. He was ever ready to
        succour the poor and needy with kindly services, in which works God was pleased
        to make him meet once to give alms to an Angel, and again, when once by night he
        was carrying bread to the hungry, and was fallen into a pit, an Angel drew him
        out unhurt. He longed to be lowly, and always shrank from honours, and from
        dignities in the Church, whereof several of the highest were diverse times
        offered to him, but he always firmly refused them.


        He was illustrious for the gift of prophecy, and had a marked and very wonderful
        power of reading the thoughts of men's souls. He ever kept his own virginity
        undefiled, and could distinguish those that were pureminded by a sort of sweet
        savour, and the unclean, on the contrary, by a kind of stench. He sometimes
        appeared in double to persons at a distance, and brought them help when they
        were in peril. He healed many that were sick and dying. He also raised one dead
        man to life. He was honoured by seeing several times heavenly spirits, and
        likewise the Virgin Mother of God herself. He saw the souls of diverse persons,
        radiant with glory, ascend to heaven. In the year of salvation 1595 the Feast of
        the Body of Christ fell upon the 25th day of May. Philip, on that day, said Mass
        with extraordinary gladness of spirit, and performed the other religious works
        of the day, and after the hour of midnight, at the time he had himself foretold,
        he fell asleep in the Lord, in the eighty-second year of his life. Gregory XV.,
        finding that God had glorified him by many miracles, enrolled his name among
        those of the saints.
    status: { la: verified, en: verified }
