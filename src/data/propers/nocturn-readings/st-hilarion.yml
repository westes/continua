# Matins Nocturn 2 reading for St. Hilarion, Abbot (Oct 21, sharing
# the date with Ss. Ursula and Companions — no reading authored for
# that feast, see memory vu_matins_sanctim_saints for the Common-only
# finding) — SanctiM/10-21.txt inherits the whole day (`@Sancti/10-21`)
# with no Nocturn 2/3 override, so this saint's own vita is sourced
# from the Tridentine track exactly as for a pre-1955 saint (see
# memory vu-matins-pre1955-saints, vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/10-21.txt, English/Sancti/10-21.txt.
# Single lesson (simplex-feast Lectio93), one continuous account, no
# responsory given in the source.
id: st-hilarion
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Hilarion, ortus Tabáthæ in Palæstina ex paréntibus infidelibus, Alexandríam missus
        studiórum causa, ibi morum et ingenii laude flóruit; ac, Jesu Christi suscepta
        religióne, in fide et caritate mirabíliter profecit. Frequens enim erat in ecclésia,
        assiduus in jejúnio et oratióne; omnes voluptátum illécebras et terrenárum rerum
        cupiditates contemnebat. Cum autem Antonii nomen in Ægypto celeberrimum esset, ejus
        vidéndi studio in solitúdinem conténdit; apud quem duobus mensibus omnem ejus vitæ
        ratiónem didicit. Domum reversus, mórtuis paréntibus, facultates suas paupéribus
        dilargitus est; necdum quintum décimum annum egréssus, rediit in solitúdinem, ubi,
        exstructa exígua casa, quæ vix ipsum cáperet, humi cubábat. Nec vero saccum, quo
        semel amíctus est, umquam aut lavit aut mutávit, cum supervacáneum esse diceret,
        mundítias in cilício quærere. In sanctárum Litterárum lectióne et meditatióne multus
        erat. Paucas ficus et succum herbárum ad victum adhibebat; nec illis ante solis
        occásum vescebátur. Continéntia et humilitate fuit incredibili. Quibus aliisque
        virtútibus varias horribilesque tentatiónes diaboli superávit, et innumerábiles
        dæmones in multis orbis terræ partibus ex hóminum corpóribus ejécit. Qui, octogesimum
        annum agens, multis ædificátis monastériis, et clarus miraculis, in morbum incidit;
        cujus vi cum extremo pene spíritu conflictarétur, dicebat: Egredere, quid times?
        egredere, ánima mea, quid dubitas? septuagínta prope annis servísti Christo, et
        mortem times? Quibus in verbis spíritum exhalávit.
      en: >-
        Hilarion was born of heathens at Tabatha in Palestine. He was sent to study at
        Alexandria, where he bore a fair name for life and wit. There he embraced the religion
        of Jesus Christ, and made wonderful head-way in faith and love. He went oftentimes to
        Church, was careful in fasting and prayer, and set no price upon the pleasures and
        lusts of the world. When the name of Antony became famous in Egypt, Hilarion made a
        journey into the desert on purpose to see him. There he dwelt with him two months, to
        the end that he might learn all his way of life, and then returned home. After the
        death of his father and mother, he gave all that he had to the poor. Before he had
        completed the fifteenth year of his age, he went into the desert, and built there a
        little house, scarcely big enough to hold him, and wherein he was used to sleep on the
        ground. The piece of sackcloth wherewith alone he clad himself he never washed and
        never changed, saying that hair-cloth was a thing not worth the trouble of cleanliness.
        He took great interest in reading and meditating on the Holy Scriptures. His food was a
        few figs and some porridge of vegetables, and this he ate not before set of sun. His
        self-control and lowliness were beyond belief. By these and other arms he overcame
        diverse and fearful attacks of the devil, and drave out countless evil spirits from the
        bodies of men in many parts of the world. He had built many monasteries, and was
        famous for miracles, when, in the eightieth year of his age, he fell sick. When he was
        gasping for his last breath, he said: Go out; what art thou afraid of? Go out, my soul!
        wherefore shrinkest thou? Thou hast served Christ hard on seventy years and art thou
        afraid of death? And so with these words he gave up the Ghost.
    status: { la: verified, en: verified }
