# Matins Nocturn 2 reading for St. John I, Pope, Martyr (May 27). No
# genuine SanctiM match: the plain `Sancti/05-27.txt` is the Venerable
# Bede (a later saint occupying the general calendar's own May 27
# slot), and `SanctiM/05-27.txt` bases `@Sancti/05-27` accordingly —
# John I's own content survives only at the suffixed sibling file —
# same "don't trust the plain file" wrinkle as the pre-1955 pass
# (memory vu-matins-pre1955-saints); a missed pre-1955-pool candidate
# rather than a genuine SanctiM case (see memory
# vu-matins-sanctim-saints).
# web/www/horas/Latin/Sancti/05-27o.txt, English/Sancti/05-27o.txt.
# The file's `Lectio93` itself just re-references its own `Lectio2`/
# `Lectio3` — combined into one reading, one continuous account, no
# genuine source break. No responsory given in the source.
id: st-john-i
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Joannes Etruscus, Justino seniore imperatore, rexit Ecclesiam: ad quem profectus est
        Constantinopolim auxilii causa, quod Theodoricus rex hæreticus divexabat Italiam. Cujus
        étiam iter Deus miraculis illustravit. Nam, cum ei nobilis vir ad Corinthum, equum, quo
        ejus uxor mansueto utebatur, itineris causa commodasset, factum est, ut, domino postea
        remissus equus ita ferox evaderet, ut fremitu et totius corporis agitatione semper
        deinceps dominam expulerit: tamquam indignaretur mulierem recipere, ex quo sedisset in
        eo Jesu Christi Vicarius. Quam ob rem illi equum Pontifici donaverunt. Sed illud majus
        miraculum, quod Constantinopoli, in aditu portæ Aureæ inspectante frequentissimo populo,
        qui una cum imperatore Pontifici honoris causa occurrerat, cæco lumen restituit. Ad
        cujus pedes prostratus étiam imperator eum veneratus est.


        Rebus cum imperatore compositis, in Italiam rediit, statimque epistolam scripsit ad
        omnes Italiæ episcopos, jubens eos Arianorum ecclesias ad catholicum ritum consecrare,
        illud subjungens: Quia et nos, quando fuimus Constantinopoli tam pro religione catholica
        quam pro regis Theodorici causa, quascumque illis in partibus eorum ecclesias reperire
        potuimus, catholicas eas consecravimus. Quod iniquissimo animo ferens Theodoricus, dolo
        accersitum Pontificem Ravennam in carcerem conjecit; ubi, squalore inediaque afflictus,
        paucis diebus cessit e vita, cum sedisset annos duos, menses novem, dies quatuordecim,
        ordinatis eo tempore episcopis quindecim. Paulo post moritur Theodoricus: quem quidam
        eremita, ut scribit sanctus Gregorius, vidit inter Joánnem Pontificem et Symmachum
        patricium, quem idem occiderat, demergi in ignem Liparitanum; ut videlicet illi, quibus
        mortem attulerat, tamquam judices essent ejus interitus. Joannis corpus Ravenna Romam
        portatum est, et in basilica sancti Petri sepultum.
      en: >-
        Pope John I was a Tuscan, who ruled the Church during the reign of the Emperor Justinian.
        He went to Constantinople to get help from Justinian in the troubles which the heretic
        King Theodoric was then causing in Italy. It pleased the Lord to mark this journey with
        wonders. A certain nobleman at Corinth lent to the Pope for his journey a very quiet horse
        on which his own wife was used to ride. But when the horse was returned to his owner he
        was found become so vicious, that by his restiveness and plunging he was always throwing
        off his mistress, as though he were not content to carry the lady after having carried
        the Vicar of Jesus Christ. When the nobleman and his wife found the beast to be thus
        worthless, they gave him for a present to the Pope. But a thing much more marvellous was
        that when the Pope, accompanied by the Emperor, and under the gaze of an immense
        multitude of people, who had come forth with Justinian to do him honour, was at the
        entering in of the Golden Gate of Constantinople, he gave sight to a blind man. Even the
        Emperor fell at his feet to show him respect.


        When he had arranged his business with Justinian he returned into Italy, and forthwith
        sent out a letter to all the Bishops of Italy, bidding them hallow for Catholic worship
        the churches of the Arians, and adding these words: We Ourselves when We were at
        Constantinople on some matters pertaining to the Catholic Religion and others pertaining
        to the King Theodoric, hallowed as Catholic all their Churches which We were able to find
        in those parts. Theodoric took this rule very ill, and, having enticed John by fraud to
        come to Ravenna, he cast him into prison, wherein, in a few days, he died of filth and
        hunger. He had sat in the chair of Peter two years, nine months, and fourteen days,
        within which time he had ordained fifteen Bishops. A little while afterward Theodoric
        also died. St. Gregory writeth that a certain hermit saw him between Pope John and
        Symmachus the Patrician, whom he had likewise slain, going down into the fiery crater of
        Lipari, as though they who had been his victims were become the judges of his punishment.
        The body of John was carried from Ravenna to Rome, and there buried in the Church of St.
        Peter.
    status: { la: verified, en: verified }
