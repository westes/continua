# Matins Nocturn 2 reading for St. Deusdedit, Pope and Confessor (Rome-city calendar office).
# Source: web/www/horas/Latin/Sancti/Urbis/11-14-Deusdedit.txt, [Lectio4]-[Lectio6], combined into one
# reading (one continuous vita, no genuine source break). No English source
# exists for the Urbis directory (English/Sancti/ is flat), so the English
# is this project's own translation, marked draft. OCR damage in the Urbis
# file's Latin corrected here (misspelt and run-together words).
id: st-deusdedit
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Bonifacio hujus nóminis quarto e vivis subláto, postquam Sedes apostólica ménsibus quinque
        et duódecim diébus vacasset, beátus Deusdedit egregiis virtútibus et exímia sanctitáte
        conspícuus, natióne Románus, patre Stéphano, unánimi ómnium consensióne, ex subdiacono
        Románus Póntifex creátus est. Ut autem subdiaconus Póntifex crearétur, tunc primum áccidit
        absque majorum exémplo; sed ut, áliis prætermissis, Deusdedit eligeretur, insígnis ejúsdem
        sanctimónia prǽstitit, qua mirífice inter tot ténebras illustrátus emicuit.


        Hic a domo Dei regíminis inítium fecit. Cleri enim máximam curam gessit, quem cum imminutum
        et valde distractum invenisset, eúmdem plúrimum auxit, in pristinas sedes restítuit, et
        multis benefíciis cumulávit. Sed plane doléndum est, tanti Pontíficis facta, scriptórum
        inópia, aut certe témporis injúria, obscúra mansisse: quæ quidem insígnia fuísse oportuit,
        cum eum antiquitus Ecclésia inter sanctos receperit, et ánnua commemoratione ut sanctum
        fúerit veneráta.


        Illud tamen unum ac singuláre non excidit. Cum enim ob terræmotus vehementissimos,
        elephantiæ lues orta esset, dum afflíctæ Urbi sanctíssimus Póntifex prospiceret, præsensque
        raro exémplo ægros inviseret, unum ex illis, in quo Christum contemplatus est, benígne
        complexus et osculatus, divíno miráculo eúmdem a lepra mundavit, ut vétera Ecclésiæ
        monuménta testantur. Epístolæ ab eo scriptæ fragmentum exstat, in quo luculentum de
        spirituali cognatióne decrétum continétur. Ubi demum tres annos sedisset, ex hac vita
        discéssit, anno Christi sexcentésimo décimo séptimo, et sepúltus est in Vaticáno.
      en: >-
        Boniface, the fourth of that name, having been taken from the living, after the Apostolic
        See had been vacant five months and twelve days, blessed Deusdedit, conspicuous for eminent
        virtues and exceptional sanctity, a Roman by race, son of Stephen, was by the unanimous
        consent of all created Roman Pontiff from subdeacon. That a subdeacon should be created
        Pontiff then first happened without example of predecessors; but that, others being passed
        over, Deusdedit should be elected, his own conspicuous holiness brought about, by which,
        amid so many darknesses, he wonderfully shone forth.


        He began his government with the house of God. For he took the greatest care of the clergy,
        whom, finding diminished and greatly scattered, he much increased, restored to their former
        places, and heaped with many benefits. But it is plainly to be lamented that the deeds of so
        great a Pontiff, through lack of writers or certainly the injury of time, have remained
        obscure: which must indeed have been remarkable, since the Church of old received him among
        the saints, and venerated him by yearly commemoration as a saint.


        One thing, however, singular, has not perished. For when, on account of most violent
        earthquakes, a plague of elephantiasis had arisen, while the most holy Pontiff was providing
        for the afflicted City, and, present, by a rare example visited the sick, one of them, in
        whom he contemplated Christ, he kindly embraced and kissed, and by a divine miracle cleansed
        him from leprosy, as the ancient monuments of the Church attest. A fragment of a letter
        written by him survives, in which an admirable decree on spiritual kinship is contained.
        When at length he had sat three years, he departed from this life, in the year of Christ
        617, and was buried in the Vatican.
    status: { la: verified, en: draft }
