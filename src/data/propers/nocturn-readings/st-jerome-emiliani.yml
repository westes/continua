# Matins Nocturn 2 and 3 reading for St. Jerome Emiliani, Confessor. Sourced directly from
# web/www/horas/Latin/Sancti/07-20.txt, English/Sancti/07-20.txt.
# Lectio4-6 combined into one reading, one continuous vita. Nocturn 3: the Gospel pericope then the saint's own homily.
id: st-jerome-emiliani
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Hieronymus, e gente patrícia Æmiliáni Venetiis ortus, a prima adolescéntia
        milítiæ addictus, difficillimis reipublicæ tempóribus Casto novo ad Quarum in
        móntibus Tarvisinis præfícitur. Arce ab hostibus capta, ipse in teterrimum
        carcerem detrúditur, mánibus ac pédibus vinctus; cui omni humana ope destituto
        beatíssima Virgo, ejus precibus exorata, clemens adest, víncula solvit, et per
        médios hostes, qui vias omnes obséderant, in Tarvisii conspéctum incólumum
        ducit. Urbem ingréssus, ad Deíparæ aram, cui se vóverat, mánicas, compedes,
        catenas, quas secum detulerat, in accepti beneficii testimónium suspendit.
        Reversus Venetias, cœpit pietátis stúdia impensius cólere, in páuperes mire
        effúsus, sed puerórum præsertim misértus, qui paréntibus orbati, egeni et
        sórdidi per urbem vagabántur; quos in ædes a se conductas recepit de suo
        alendos, et christiánis móribus imbuéndos.


        Per eos dies Venetias appúlerant beátus Cajetanus et Petrus Caráfa (postmodum
        Paulus quartus), qui, Hierónymi spíritu novoque instituto colligéndi órphanos
        probato, illum in Incurabílium hospitale adduxérunt, in quo órphanos simul
        educaret, atque ægrotis pari caritate inservíret. Mox eorúmdem hortatu in
        próximam continentem profectus, Brixiæ primum, deínde Bérgomi atque Novocómi
        orphanotróphia eréxit: Bérgomi præsertim, ubi præter duo, pro púeris unum et pro
        puellis álterum, domum excipiendis, novo in illis regiónibus exemplo, muliéribus
        a turpi vita ad pœniténtiam conversis, apéruit. Somaschæ, in humili pago agri
        Bergoménsis ad Vénetæ ditiónis fines, sibi ac suis ibi sedem constítuit,
        formamque indúxit, congregatiónis, cui proptérea a Somascha nomen factum; quam
        subinde auctam et propagatam, nedum orphanórum regímini et ecclesiárum cultui,
        sed ad majórem christianæ reipublicæ utilitátem, adolescéntium in litteris et
        bonis móribus institutióni in collegiis, academíis et seminariis addictam,
        sanctus Pius quintus inter religiósos ordines adscripsit, ceteríque Pontifices
        privilegiis ornarunt.


        Orphanis colligéndis intentus, Mediolanum proficíscitur atque Ticinum; et
        utrobíque collectis agmínibus puerórum, tectum, victum, vestem, magistros,
        nobílibus viris favéntibus, próvide constítuit. Inde Somascham redux, ómnibus
        ómnia factus, a nullo abhorrebat opere, quod in próximi bonum cédere prævidéret.
        Agricolis immixtus per agros sparsis, dum se illis adjutórem in meténdis
        frugibus præbet, mysteria fidei explicábat; puerórum cápita porígine fœda
        abstergens, et patienter tractans curábat; pútridis rusticórum vulnéribus
        medebátur eo successu, ut grátia curatiónum donatus censerétur. In monte, qui
        Somaschæ imminet, repérta specu, in illam se ábdidit; ubi, se flagellis cædens,
        dies integros jejunus tránsigens, oratióne in plurimum noctem protracta, super
        nudo saxo brevem somnum carpens, sui aliorúmque noxárum pœnas luebat. In hujus
        specus interiori recessu ex árido sílice exstillat aqua, precibus servi Dei, ut
        constant tradítio est, impetrata, quæ usque in hodiérnam diem jugiter manans, et
        in varias regiónes delata, ægris sanitátem plerumque conciliat. Tandem, ex
        contagióne quæ per omnem vallem serpebat, dum ægrotántibus inservit, et vita
        functos propriis humeris ad sepultúram defert, contracto morbo, annos natus sex
        et quinquagínta, quam paulo ante prædixerat, pretiósam mortem obiit anno
        millesimo quingentésimo trigesimo septimo. Quem plúribus in vita et post mortem
        miraculis illustrem, Benedíctus décimus quartus Beatórum, Clemens vero décimus
        tertius Sanctórum fastis solemniter adscripsit.
      en: >-
        This Jerome was born at Venice, of the Patrician family of the Miani, (in the
        year of our Lord 1481.) He was trained up to be a soldier, and (in 1508,) in the
        most troublesome times of the Commonwealth, he commanded the fortress of Castel-
        nuovo at Quero, in the mountains near Treviso. After the fall of the place, he
        was chained hand and foot, and cast into a filthy prison. When all hope of help
        from man had forsaken him, the Most Blessed Virgin, in answer to his prayers,
        mercifully came to him, loosed his fetters, and brought him unhurt within sight
        of Treviso, through the midst of the enemy, who kept all the roads. As soon as
        he entered the city of Treviso, as an acknowledgment of the favour he had
        received, he hung up his chains, which he had brought away with him, at an Altar
        of the Mother of God, to whom he had vowed himself. After his return to Venice
        he gave himself up to godly works. Amid his great tenderness to all the poor,
        his compassion was chiefly roused by the fatherless little boys who wandered
        through the city starving and filthy; them he took into an house conducted by
        himself, where at his own cost he provided them with board, lodging, clothing,
        and a Christian education.


        In those days there came to Venice blessed Cajetan (of Tiene,) and Peter Carafa,
        who was afterwards Paul IV. They were pleased with the spirit of Jerome, and
        with his new Asylum for Orphans, and took him to the Hospital for Incurables, as
        well to bring up Orphans, as to extend his charity equally to the sick. Soon
        after, by the advice of the same, he went to the mainland, and built orphanages
        first at Brescia, then at Bergamo and Como. His chief foundations were at
        Bergamo, where besides an orphanage for little boys, and another for little
        girls, he opened an house of Refuge for repentant harlots, being the first
        institution of that kind in that part of the world. In the end he went to dwell
        at Somascha, a hamlet in the district of Bergamo, close to the frontiers of the
        Venetian territory, and there made an house for himself and his disciples, and
        gave shape to a congregation, which is generally called the Congregation of
        Somascha. This congregation grew and spread, and found its work not only in the
        education of orphans and the service of Churches, but also in a wider usefulness
        to the Christian Commonwealth, by training up lads in letters and good manners.
        Holy Pius V. enrolled it among the religious Orders, and other Popes have given
        it diverse privileges.


        Jerome went to Milan and to Ticino to gather orphans together, and in both
        places he gathered a multitude of little boys for whom the charity of noblemen
        enabled him to provide board, lodging, clothes, and schooling. He returned to
        Somascha, and, still making himself all things to all men, refused no toil by
        which he saw that he could be of any use to his neighbour. He was used to go
        about in the fields, helping the reapers in their work, and meanwhile teaching
        them in the mysteries of the faith. He was very patient in cleansing and healing
        the heads of little boys foul with lice, and proved so successful a physician to
        the stinking sores of the poor country-people, that he got a reputation for
        having the gift of healing. He found a cave in the mountain which hangs over
        Somascha, and there he would hide himself, passing whole days without meat or
        drink, and oftentimes scourging himself, continuing in prayer long into the
        night, and taking his short sleep upon the bare rock, in expiation of his own
        sins and the sins of others. In the far end of this cave, there drippeth out of
        the dry stone some water, which is said by an unwavering tradition to have come
        there at the prayers of the man of God. It droppeth freely even to this day, and
        is taken to diverse places at a distance, where it often hath an healing effect
        upon the sick. At length an infectious disorder broke out in all the valley, and
        Jerome, who nursed the sick and carried the dead to burial on his own shoulders,
        caught it, and died a precious death, as he had himself foretold, (upon the 8th
        day of February,) in the fifty-seventh year of his age, and that of salvation
        1537. He was famous for many miracles, both during his life and after his death
        Benedict X. solemnly enrolled his name among those of the Blessed, and Clement
        XIII inserted it in the Kalendar of the Saints.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: true
    citation: { la: "Matt 19:13-21", en: "Matt 19:13-21" }
    text:
      la: >-
        Tunc oblati sunt ei parvuli, ut manus eis imponeret, et oraret. Discipuli autem
        increpabant eos. Jesus vero ait eis: Sinite parvulos, et nolite eos prohibere ad
        me venire: talium est enim regnum caelorum. Et cum imposuisset eis manus, abiit
        inde. Et ecce unus accedens, ait illi: Magister bone, quid boni faciam ut habeam
        vitam aeternam? Qui dixit ei: Quid me interrogas de bono? Unus est bonus, Deus.
        Si autem vis ad vitam ingredi, serva mandata. Dicit illi: Quae? Jesus autem
        dixit: Non homicidium facies; non adulterabis; non facies furtum; non falsum
        testimonium dices; honora patrem tuum, et matrem tuam, et diliges proximum tuum
        sicut teipsum. Dicit illi adolescens: Omnia haec custodivi a juventute mea: quid
        adhuc mihi deest? Ait illi Jesus: Si vis perfectus esse, vade, vende quae habes,
        et da pauperibus, et habebis thesaurum in caelo: et veni, sequere me.
      en: >-
        Then were little children presented to him, that he should impose hands upon
        them and pray. And the disciples rebuked them. But Jesus said to them: Suffer
        the little children, and forbid them not to come to me: for the kingdom of
        heaven is for such. And when he had imposed hands upon them, he departed from
        thence. And behold one came and said to him: Good master, what good shall I do
        that I may have life everlasting? Who said to him: Why asketh thou me concerning
        good? One is good, God. But if thou wilt enter into life, keep the commandments.
        He said to him: Which? And Jesus said: Thou shalt do no murder, Thou shalt not
        commit adultery, Thou shalt not steal, Thou shalt not bear false witness. Honour
        thy father and thy mother: and, Thou shalt love thy neighbour as thyself. The
        young man saith to him: All these I have kept from my youth, what is yet wanting
        to me? Jesus saith to him: If thou wilt be perfect, go sell what thou hast, and
        give to the poor, and thou shalt have treasure in heaven: and come follow me.
    status: { la: verified, en: verified }

  - nocturn: 3
    isGospel: false
    source: "St. John Chrysostom, Patriarch of Constantinople, Homily on Matthew"
    text:
      la: >-
        Cur discípuli púeros abigebant? Dignitátis causa. Quid ergo ille? Ut doceat
        illos modeste sapere, fastumque mundanum conculcare, et suscipit, et ulnis
        complectitur, talibúsque regnum cælórum pollicétur; id quod étiam dixit
        superius. Et nos ígitur, si volumus heredes esse cælórum, hanc virtútem cum
        diligéntia magna sectemur. Hoc est enim philosophíæ culmen, simplicem esse cum
        prudéntia; hæc vita est angelica. Anima enim puéruli ómnibus animi morbis vacua
        est; non memóriam retinet injuriárum, sed eas inferéntes adit ut amicos, ac si
        nihil factum esset. Et quamvis a matre verbéribus cædátur, eam semper quærit, et
        ómnibus antepónit.


        Si regínam ipsi ostendas diadémate ornatam, non præfert eam matri pannis
        detritis vestitæ, malletque illam incultam vidére, quam regínam mirifice
        amíctam. Nam, quod suum, quod aliénum est, non ex paupertáte vel divítiis, sed
        ex amóre existimare solet; et nihil plus requirit quam necessaria, atque ut
        lacte repletus est, statim a mamma abscedit. Non eisdem, quibus nos, ærumnis
        prémitur, nec pecuniárum jactura, rebusque simílibus; nec iisdem, quibus nos,
        fluxis rebus lætátur, neque córporum pulchritúdinem mirátur. Ideo dicebat:
        Talium est enim regnum cælórum; ut ex proposito voluntátis illa operemur, quæ
        natúra sua púeri faciunt.


        Quia enim pharisæi non aliunde quam a nequítia et arrogántia ad agéndum
        ferebántur, ideo ubíque discipulos suos simplices esse jubet, illosque
        subíndicat, dum hos instituit. Nihil enim ita supérbiam parit, ut principátus et
        primi conséssus. Quóniam ígitur discípuli per totum terrárum orbem multum
        honoris consecuturi erant, ipsórum animos prævenit, nec sinit eos humánum quid
        pati, nec honórem a vulgo expétere, vel ante alios sese efferre. Nam, etiamsi
        hæc parva vidéntur esse, at malis ingéntibus causam præbent. Sic enim institúti
        pharisæi in malórum culmen ascendérunt, salutatiónes, primos conséssus et médios
        requiréntes; hinc in ardentem glóriæ cupiditátem, inde vero in impietátem lapsi
        sunt.
      en: >-
        Wherefore did the disciples rebuke them that brought them? From an idea of His
        dignity. What therefore did He To teach them to be lowly, and to be above the
        niceness of the world, He took the little children, and embraced them in His
        Arms, and declared that of such is the kingdom of heaven as also He had said
        above, (xviii. 3, 4.) And we also, if we would fain be heirs of the kingdom of
        heaven, let us seek with great earnestness this virtue. For this is the highest
        peak of philosophy, to be simple and wise this is the life of an Angel. The mind
        of a little child is free from all the diseases of the mind a little child
        keepeth no remembrance of injuries, but goeth unto such as have inflicted them,
        as if unto friends, and as if nothing had happened. Although his mother give him
        stripes, yet a little child ever seeketh her, and putteth her before all.


        If thou wert to show him a Queen adorned with her crown, he would not prefer her
        before his own mother, in raiment how faded soever, and he would rather see her,
        albeit unkempt, than the Queen in all her glorious apparel. For his use is to
        account of things whether they be his own, or of others, not by the standard of
        poverty and riches, but by that of love only. He seeketh no more than he
        needeth. When he is satisfied with milk, he leaveth the pap. The things that
        press upon us, such as the loss of money, and the like, do not press upon him,
        nor do the same transitory things that please us, please him, neither doth he
        gaze with admiration at loveliness of shape. Therefore Christ said: Of such is
        the kingdom of heaven, to make us do by force of will what little children do by
        nature.


        The Pharisees' usual springs of action were spite and vanity; therefore doth the
        Lord everywhere command His disciples to be simple, and in teaching the one,
        pointeth silently at the other class. Nothing breedeth pride so much as
        princedom and precedence. Since, then, His disciples were to receive much honour
        throughout all the world, He warneth their minds beforehand, and letteth them
        not stumble into the snare of men, nor go seeking for honours from the mob, nor
        put themselves forward before others. It is true, these may seem little things,
        but they give occasion for very great evils. It was when they were placed in
        these positions, that the Pharisees fell into their direst misfortunes from
        looking for salutations, and foremost or good places, they got into a keen
        desire of distinction, and from that into ungodliness.
    status: { la: verified, en: verified }
