# Matins Nocturn 2 reading for St. Rose of Lima, Virgin (Aug 30).
# Sourced directly from web/www/horas/Latin/Sancti/08-30.txt,
# English/Sancti/08-30.txt. Lectio4-6 combined into one reading, one
# continuous vita. No Lectio7-9 in her own file (her `[Rule]` is `vide
# C6a`) -- defers to the Common of a Virgin's own Nocturn 3, not
# transcribed here. (The source's own Lectio94, a shorter 3-lesson
# variant of the same biography, and the regional Brasilia file's
# fuller 9-lesson patronal office, are both alternates not used here.)
id: st-rose-of-lima
readings:
  - nocturn: 2
    isGospel: false
    text:
      la: >-
        Primus Americæ Meridionalis flos sanctitatis, virgo Rosa,
        christianis parentibus Limæ progenita, mox ab incunabulis claruit
        futuræ sanctimoniæ indiciis. Nam vultus infantis mirabiliter in
        rosæ effugiem transfiguratus, huic nomini occasionem dedit: cui
        postea Virgo Deipara cognomen adjecit, jubens vocari deinceps
        Rosam a sancta Maria. Quinquennis votum perpetuæ virginitatis
        emisit. Adultior, ne a parentibus ad nuptias cogeretur, clam
        sibimet venustissimam capitis cæsariem præscidit. Jejuniis supra
        humánum modum addicta, integras Quadragesimas transegit, pane
        abstinens, ac dietim solis quinque granulis mali citrini
        victitans.


        Habitu tertii ordinis sancti Dominici assumpto, pristinas vitæ
        austeritates duplicavit: oblongo asperrimoque cilicio sparsim
        mimisculas acus innexuit: sub velo coronam densis aculeis
        introrsus obarmatam interdiu noctuque gestavit. Sanctæ Catharinæ
        Senensis ardua premens vestigia, catena ferrea, triplici nexu
        circumducta, lumbos cinxit. Lectulum sibi e truncis nodosis
        composuit, horumque vacuas commissuras fragminibus testarum
        implevit. Cellulam sibi angustissimam struxit in extremo horti
        angulo, ubi cælestium contemplationi dedita, crebris disciplinis,
        inedia, vigiliis corpusculum extenuans, at spiritu vegetata,
        larvas dæmonum, frequenti certamine victrix, impavide protrivit
        ac superavit.


        Aegritudinum tormentis, domesticorum insultibus, linguarum
        morsibus dire agitata, nondum satis pro merito se affligi
        quærebatur. Per quindecim annos ad plusculas horas desolatione
        spiritus et ariditate miserrime contabescens, forti animo tulit
        agones omni morte amariores. Exinde cœpit supernis abundare
        deliciis, illustrari visionibus, colliquescere seraphicis
        ardoribus. Angelo tutelori, sanctæ Catharinæ Senensi, Virgini
        Deiparæ inter assiduas apparitiones mire familiaris, a Christo
        has voces audire meruit: Rosa cordis mei, tu mihi sponsa esto.
        Denique Sponsi hujus paradiso feliciter invectam, plurimisque
        ante et post obitum miraculis coruscam, Clemens decimus Pontifex
        Maximus sanctarum Virginum catalogo ritu solemni adscripsit.
      en: >-
        The first flower of holiness which came to full blossom in South
        America, was the maiden Rose. She was born at Lima, of a
        Christian father and mother, (upon the 20th of April, in the
        year 1586,) and was remarkable from her childhood for marks of
        saintliness. The occasion of her name was a strange likeness to
        a rose, which her face assumed when she was a babe. To this name
        she afterwards added that of the Virgin Mother of God, desiring
        to be called St. Mary's Rose. At the age of fifteen years she
        uttered a vow of perpetual virginity. As she grew older, lest
        her parents should force her to marry, she polled her head of
        all her hair, which was very beautiful. She fasted to a degree
        almost superhuman, passing whole Lents without taking bread, and
        eating day by day only five pips of a lime.


        She took the habit of the Third Order of St. Dominic, and then
        doubled her former severities. She wore a long and very rough
        hair-cloth, into which she inserted small pins. She wore day and
        night under her veil a crown, the inner side of which was armed
        with pricks. In imitation of the hard steps of St Katharine of
        Sienna, she girded her loins with a threefold iron chain. She
        made to herself a bed of knotty sticks, and filled the gaps with
        broken bits of potsherd. She built herself a very small hut in
        the farthest corner of the garden, where she gave herself up to
        thoughts of heavenly things, and to punishing her body with
        often scourging, starvation, and sleeplessness. But she waxed
        strong in spirit, and though she often had to fight with evil
        ghosts, she conquered them, fearlessly prostrated them, and
        triumphed over them.


        She suffered greatly from painful illnesses, from the
        maltreatment of the servants, and from slanderous accusations,
        but still complained that she did not suffer as much as she
        deserved. For fifteen years she pined in misery from desolation
        and dryness of spirit, bravely enduring torments worse than any
        form of death. After this period she began to overflow with
        consolation, to be enlightened by visions, and to melt with love
        like a Seraph's. She attained, by the frequency of visions, to a
        strange personal familiarity with her Guardian Angel, with St.
        Katharine of Sienna, and with the Virgin Mother of God, and she
        earned from Christ the words, Rose of My Heart, be thou My
        bride. She was famous for many miracles, both before and after
        she departed hence, and was happily transplanted into the
        Bridegroom's garden, (upon the 24th of August 1617, being aged
        31 years.) Pope Clement X. with solemn pomp inscribed her name
        in the list of holy maidens.
    status: { la: verified, en: verified }
