# Matins Nocturn content for Thursday in the 4th week of Lent — read from
# web/www/horas/{Latin,English}/Tempora/Quad4-4.txt. Gospel incipit only
# in that file ("Et réliqua"); full pericope sourced from
# web/www/missa/{Latin,English}/Tempora/Quad4-4.txt's own [Evangelium].
# Recombined into one reading (Lectio1-3 are one continuous Ambrose
# homily split only to fill the fixed 3-lesson slot count). Responsory1 is
# a cross-reference (@Tempora/Quad4-0:Responsory1, the 4th Sunday of
# Lent's own) — used here per the "the first one, when several collapse"
# convention.
id: lent-4-thursday
readings:
  - nocturn: 1
    isGospel: true
    citation: { la: "Luc 7:11-16", en: "Luke 7:11-16" }
    text:
      la: >-
        In illo témpore: Ibat Jesus in civitátem, quæ vocátur Naim: et ibant cum eo discípuli ejus
        et turba copiósa. Cum autem appropinquáret portæ civitátis, ecce, defúnctus efferebátur
        fílius únicus matris suæ: et hæc vídua erat, et turba civitátis multa cum illa. Quam cum
        vidísset Dóminus, misericórdia motus super eam, dixit illi: Noli flere. Et accéssit et
        tétigit lóculum. - Hi autem, qui portábant, stetérunt - Et ait: Adoléscens, tibi dico, surge.
        Et resédit, qui erat mórtuus, et cœpit loqui. Et dedit illum matri suæ. Accépit autem omnes
        timor: et magnificábant Deum, dicéntes: Quia Prophéta magnus surréxit in nobis: et quia Deus
        visitávit plebem suam.
      en: >-
        At that time, Jesus went into a city called Naim; and His disciples and a large crowd went
        with Him. And as He drew near the gate of the town, behold, a dead man was being carried
        out, the only son of his mother, and she was a widow; and a large gathering from the town
        was with her. And the Lord, seeing her, had compassion on her, and said to her, "Do not
        weep." And He went up and touched the stretcher; and the bearers stood still. And He said,
        "Young man, I say to you, arise." And he who was dead, sat up, and began to speak. And He
        gave him to his mother. But fear seized upon all, and they began to glorify God, saying, "A
        great prophet has risen among us, and God has visited His people."
    status: { la: verified, en: verified }

  - nocturn: 1
    isGospel: false
    source: "St. Ambrose, Bishop of Milan, Book 5, Commentary on Luke, ch. 7"
    text:
      la: >-
        Et hic locus ad utrámque redúndat grátiam; et ut cito flecti divínam misericórdiam matris
        víduæ lamentatióne credámus, ejus præcípue, quæ únici fílii vel labóre, vel morte frangátur;
        cui tamen víduæ gravitátis méritum exsequiárum turba concíliet: et ut hanc víduam populórum
        turba septam, plus vidéri esse quam féminam, quæ resurrectiónem únici et adolescéntis fílii
        suis lácrimis merúerit impetráre: eo quod sancta Ecclésia pópulum juniórem a pompa fúneris
        atque a suprémis sepúlcri, suárum révocet ad vitam contemplatióne lacrimárum: quæ flere
        prohibétur eum, cui resurréctio debebátur.


        Qui quidem mórtuus in lóculo materiálibus quátuor ad sepúlcrum ferebátur eleméntis, sed spem
        resurgéndi habébat, quia ferebátur in ligno. Quod etsi nobis ante non próderat, tamen
        posteáquam Jesus id tétigit, profícere cœpit ad vitam: ut esset indício, salútem pópulo per
        crucis patíbulum refundéndam. Audíto ígitur Dei verbo, stetérunt acérbi illi fúneris
        portitóres, qui corpus humánum letháli fluxu natúræ materiális urgébant. Quid enim áliud,
        nisi quasi in quodam féretro, hoc est, suprémi fúneris instruménto, jacémus exánimes, cum
        vel ignis immódicæ cupiditátis exǽstuat, vel frígidus humor exúndat, vel pigra quadam
        terréni córporis habitúdine vigor hebetátur animórum; vel concréta noster spíritus labe,
        puræ lucis vácuus mentem alit? Hi sunt nostri fúneris portitóres.


        Sed quamvis supréma mortis spem vitæ omnis aboléverint, et túmulo próxima córpora jáceant
        defunctórum: verbo tamen Dei jam mórtua resúrgunt cadávera: vox redit, rédditur fílius
        matri, revocátur a túmulo, erípitur a sepúlcro. Quis iste est túmulus tuus, nisi mali mores?
        Túmulus tuus perfídia est: sepúlcrum tuum guttur est. Sepúlcrum enim patens, est guttur
        eórum, unde verba mórtua proferúntur. Ab hoc sepúlcro te líberat Christus: ab hoc túmulo
        surges, si áudias verbum Dei. Et si grave peccátum est, quod pœniténtiæ lácrimis ipse laváre
        non possis; fleat pro te mater Ecclésia, quæ pro síngulis tamquam pro únicis fíliis vídua
        mater intérvenit. Compátitur enim quodam spiritáli dolóre natúræ, cum suos líberos letháli
        vítiis ad mortem cernit urgéri.
      en: >-
        The history which we here read in the Holy Gospel hath for us specially two gracious
        lessons, the one from the literal, the other from the mystic interpretation thereof.
        According to the letter then, we see how quickly the compassion of God was aroused by the
        sorrow of this mother, who was a widow, a widow broken down by nursing her only son, or by
        the bitterness of her grief for his death. She was a widow also whose worshipful
        conversation is borne witness to by this, that, much people of the city was with her.
        Mystically however, this widow encompassed by the multitude was something more than a poor
        woman whose tears won from the Lord the resurrection of her young and only son; for she is
        a type of our holy Mother the Church, who calleth back her young children to life from the
        pursuit of deathly vanities, and soul-slaying honours, by bidding them look on those tears
        which she sheddeth for such as they, and which it is unlawful for her to shed for them of
        whom she knoweth that they will rise again.


        This man, then, being dead, was carried out on a bier to the grave by four bearers, even as
        the sinner is borne to destruction by the four elements of which he is composed. But there
        was hope in his latter end, from this, that that whereon he was carried was of wood, and
        wood, albeit it had profited us little before, is become everything to us now since Jesus
        touched it, being a figure of that gibbet, the Cross, which was made thereof, and wherefrom
        salvation floweth unto all people. When, therefore, the horrid bearers of the corpse heard
        the commandment of God, they stood still, and carried no farther him who was dead through
        the fatal course of a material nature. And is not our case even as that of the widow's son,
        when we lie, as it were, lifeless, in our spiritual coffin, that is, in the last bed of our
        soul's death, consumed by the fever of unbridled lust, or frozen by cold-heartedness, or
        with our whole manliness sapped by some degrading habit of this earthly body, or starved by
        a spiritual lockjaw that shutteth our mouth to the bright food of our soul? These, and such
        as these, are they which carry us out to burial.


        But even at the last hour, when the hope of life hath been utterly extinguished, and the
        bodies of the dead are lying by the side of the grave, by the word of God those carcases
        live again, yea, arise and speak. Then doth Jesus deliver the son to his mother, for Jesus
        calleth him out of the grave, and delivereth him from death. O, what is the grave of the
        soul but a bad life? Sinner! thy grave is unbelief, and thy throat is a sepulchre! Even so is
        it written: Their throat is an open sepulchre, whereout breathe their pestilential words.
        Lo! Christ maketh thee free from that grave! If only thou wilt hear the word of God, thou
        shalt yet arise from that sepulchre! Yea, though thy sin be exceeding weighty, so that the
        tears of thine own sorrow cannot wash it away, let thy Mother the Church weep for thee, that
        longing Mother who weepeth for every one of her children as though he were the only son of
        his mother, and she was a widow. Believe me, her spiritual anguish is keen like the anguish
        of nature, when she seeth her children dead in sin, and carried out to be buried for ever.
    responsory:
      la: "R. Locútus est Dóminus ad Móysen, dicens: Descénde in Ægýptum, et dic Pharaóni: * Ut dimíttat pópulum meum: indurátum est cor Pharaónis: non vult dimíttere pópulum meum, nisi in manu forti.\nV. Clamor filiórum Israël venit ad me, vidíque afflictiónem eórum: sed veni, mittam te ad Pharaónem.\nR. Ut dimíttat pópulum meum: indurátum est cor Pharaónis: non vult dimíttere pópulum meum, nisi in manu forti."
      en: "R. The Lord spake unto Moses, saying: Go down now into Egypt, and say unto Pharaoh: * Let My people go. And the heart of Pharaoh shall be hardened, that he will not let My people go but by a mighty hand.\nV. The cry of the children of Israel is come unto Me, and I have seen their affliction: come now, therefore, and I will send thee unto Pharaoh, and thou shalt say unto him.\nR. Let My people go. And the heart of Pharaoh shall be hardened, that he will not let My people go but by a mighty hand."
    status: { la: verified, en: verified }
