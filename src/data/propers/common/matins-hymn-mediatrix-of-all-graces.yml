# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt (Duplex majus, nine lessons, `ex C11`). English is this project's own translation, marked draft.
id: matins-hymn-mediatrix-of-all-graces
text:
  la: |
      Christus, humáni géneris misértus,
      Morte nos ictos mérita, supérnam
      Rursus ad vitam génuit, suóque
      Sánguine tersit.

      O pium flumen, scelus omne purgans!
      O inexháustum pélagus bonórum,
      Unde septéno fluit usque fonte
      Vita salúsque!

      Hos tamen sacros látices redémptis
      Quis ministrábit? Datur hoc Maríæ
      Munus, ut divæ moderétur undæ,
      Arbitra, cursum.

      Cuncta, quæ nobis méruit Redémptor,
      Dona partítur Génetrix María,
      Cuius ad votum sua fundit ultro
      Múnera Natus

      Te per ætérnos venerémur annos,
      Trínitas, summo celebránda plausu:
      Te fide mentes, resonóque linguæ
      Cármine laudent.
      Amen.
  en: |
      Christ, having pity on the human race,
      struck down as we were by a death we had deserved,
      begot us again unto the life on high,
      and cleansed us with his own blood.

      O holy stream, that purgest away all sin!
      O inexhaustible ocean of good things,
      whence, from a sevenfold fountain,
      life and salvation flow without end!

      But who shall dispense these sacred waters
      to the redeemed? This office is given to Mary,
      that she, as their arbiter, may govern
      the course of the divine wave.

      All the gifts that the Redeemer merited for us
      Mary, the Mother, distributes;
      at her wish her Son freely pours out
      his own bounty.

      Through eternal years let us venerate thee,
      O Trinity, to be celebrated with highest praise:
      let our minds praise thee with faith,
      and our tongues with resounding song.
      Amen.
status:
  la: verified
  en: draft
