# English from English/Sancti/02-23r.txt.
id: collect-st-peter-damian
text:
  la: |
    Orémus.
    Concéde nos, quǽsumus, omnípotens Deus: beáti Petri Confessóris tui atque Pontíficis mónita et exémpla sectári; ut per terréstrium rerum contémptum ætérna gáudia consequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Let us pray.
    Grant, we beseech Thee, Almighty God, so to profit by the teaching and example of thy blessed Confessor and Bishop Peter, that, like him, we may lightly esteem the things which are seen and temporal, and finally attain unto those good things which are unseen and eternal.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

