id: sext-capitulum-quinquagesima
text:
  la: |
    1 Cor 13:8-9 Cáritas nunquam éxcidit: sive prophetíæ evacuabúntur, sive linguæ cessábunt, sive sciéntia destruétur. Ex parte enim cognóscimus, et ex parte prophetámus.
    R. Deo grátias.
    V. Dóminus regit me, et nihil mihi déerit.
    R. In loco páscuæ ibi me collocávit.
  en: |
    1 Cor 13:8-9 Charity never falleth away: whether prophecies shall be made void, or tongues shall cease, or knowledge shall be destroyed. For we know in part, and we prophesy in part.
    R. Thanks be to God.
    V. The Lord ruleth me: and I shall want nothing.
    R. He hath set me in a place of pasture.
