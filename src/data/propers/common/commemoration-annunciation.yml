# Own proper antiphon (annunciation-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (annunciation-collect.yml), unchanged.
id: commemoration-annunciation
text:
  la: |
    Ant. Spíritus Sanctus * in te descéndet, María, et virtus Altíssimi obumbrábit tibi. (Allelúja.)
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Deus, qui de beátæ Maríæ Vírginis útero Verbum tuum, Angelo nuntiánte, carnem suscípere
    voluísti: præsta supplícibus tuis; ut, qui vere eam Genetrícem Dei crédimus, ejus apud
    te intercessiónibus adjuvémur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The Holy Ghost * shall come upon thee, O Mary, and the power of the Highest shall overshadow thee. (Alleluia.)
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    O God, Who didst will that thy Word should, by the message of an Angel, take flesh in
    the womb of the Blessed Virgin Mary, grant unto us, we beseech thee, that all who do
    believe her to be in very deed the Mother of God, may be helped by her prayers in thy
    sight.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
