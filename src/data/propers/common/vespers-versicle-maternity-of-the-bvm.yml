# Divino Afflatu 1954 engine render (2026-10-11, second Vespers; post-1617 feast, no Monastic render exists). Replaces a text that was either the Common BVM's versicle or the Apparition of St. Michael's with its Paschal Alleluia baked in. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: vespers-versicle-maternity-of-the-bvm
text:
  la: |
    V. Benedícta tu in muliéribus.
    R. Et benedíctus fructus ventris tui.
  en: |
    V. Blessed art thou among women.
    R. And blessed is the fruit of thy womb.
status:
  la: verified
  en: verified
