# No distinct Vespers versicle found for this feast in the reference
# source; reusing common-of-the-bvm's own Vespers versicle. Authored to
# make the feast's own bundle (needed for her own hymn, see lauds-
# capitulum-maternity-of-the-bvm.yml -- Vespers falls back to the same Lauds capitulum
# via vespersCapitulumForOverride) render a real versicle instead of an
# unconditionally-rendered empty one.
id: vespers-versicle-maternity-of-the-bvm
text:
  la: |
    V. Dignáre me laudáre te, Virgo sacráta.
    R. Da mihi virtútem contra hostes tuos.
  en: |
    V. Holy Virgin, my praise by thee accepted be.
    R. Give me strength against thine enemies.
status:
  la: verified
  en: verified
