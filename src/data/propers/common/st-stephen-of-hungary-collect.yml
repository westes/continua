id: st-stephen-of-hungary-collect
text:
  la: |
    Orémus.
    Concéde, quǽsumus, Ecclésiæ tuæ, omnípotens Deus: ut beátum Stéphanum
    Confessórem tuum, quem regnántem in terris propagatórem hábuit,
    propugnatórem habére mereátur gloriósum in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    Grant unto thy Church, we beseech thee, O Almighty God, that even as thy
    blessed Confessor Stephen, while he was a King upon earth, was her
    forwarder, so, now that he is a glorious Saint in heaven, he may be her
    defender.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    ℟. Amen.
