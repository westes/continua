# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Scholastica's own day (2026-02-10) -- the Benedictus
# antiphon. The source's own English page didn't render a translation
# (silently duplicated the Latin); translated here in the same register
# as the rest of this project's antiphons, so marked `draft` rather than
# `verified`. Alludes to the legend of her prayer bringing on the storm
# that kept St. Benedict from leaving her that night (Gregory the Great,
# Dialogues II.33).
id: benedictus-antiphon-st-scholastica
text:
  la: "O quam præclára sunt mérita beátæ Scholásticæ! O quanta virtus lacrimárum, per quas ínclyta Virgo áeris serenitátem ad plúviæ traxit inundatiónem."
  en: "O how glorious are the merits of blessed Scholastica! O how great the power of her tears, by which the renowned Virgin turned a clear sky into a flooding rain."
status:
  la: verified
  en: draft
