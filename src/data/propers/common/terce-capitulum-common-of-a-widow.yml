# Commune/C7a.txt [Capitulum Laudes] (a widow takes C7a; several women martyrs take C7b->C7). Terce takes the Lauds chapter and None takes Lectio Prima per the engine. The V/R pair after the chapter is the responsory breve inherited from Commune/C6. Replaced a copy of the Virgin's chapter (2 Cor 10:17 etc.), which the reference does not use for this Common.
id: terce-capitulum-common-of-a-widow
text:
  la: |
    Mulíerem fortem quis invéniet? Procul et de últimis fínibus prétium ejus. Confídit in ea cor viri sui, et spóliis non indigébit.
    R. Deo grátias.
    V. Spécie tua et pulchritúdine tua.
    R. Inténde, próspere procéde, et regna.
  en: |
    Who shall find a valiant woman? Far and from the uttermost coasts is the price of her. The heart of her husband trusteth in her, and he shall have no need of spoils.
    R. Thanks be to God.
    V. In thy comeliness and thy beauty.
    R. Go forward, fare prosperously, and reign.
citation:
  la: "Prov 31:10-11"
  en: "Prov 31:10-11"
status:
  la: verified
  en: verified
