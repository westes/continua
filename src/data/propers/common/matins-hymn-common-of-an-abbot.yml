# The Common-of-a-Confessor's Matins hymn ("Iste Conféssor Dómini sacrátus" /
# "This is the Lord's own hallowed confessor"). Latin is the Monastic-track
# textual variant (reference engine's Commune/C4.txt [HymnusM Vespera] block,
# live-verified for St. Louis, 2026-08-25, version=Monastic Tridentinum
# 1617) — distinct from the secular breviary's later Urban VIII revision
# ("...coléntes... Hac die lætus méruit beátas Scándere sedes"), which vu's
# Monastic-structured Matins does not use. English is an original
# translation (the reference engine's own English/Commune/C4.txt reuses one
# translation for both Latin textual variants — mismatched here: its tomb
# imagery and "merits" wording actually belong to this sacrátus form, not
# the secular one it's nominally paired with there — so it wasn't trusted
# and re-translated fresh instead), hence status.en: draft while
# status.la: verified (transcribed as-is from the reference engine).
#
# Duplicated verbatim under this `common-of-an-abbot` id (2026-08-26):
# live-verified `votive=C5` byte-identical, matching this session's
# earlier Lauds/Vespers finding that Common-of-an-Abbot is really
# Common-of-a-Confessor-Not-Bishop's content under a different label.
id: matins-hymn-common-of-an-abbot
text:
  la: >-
    Iste Conféssor Dómini sacrátus,

    Festa plebs cujus celébrat per orbem,

    Hódie lætus méruit secréta

    Scándere cæli.


    Qui pius, prudens, húmilis, pudícus,

    Sóbrius, castus fuit et quiétus,

    Vita dum præsens vegetávit ejus

    Córporis artus.


    Ob sacrum cujus túmulum frequénter

    Membra languéntum modo sanitáti,

    Quólibet morbo fúerint graváta,

    Restituúntur.


    Unde nunc noster chorus in honórem

    Ipsius, hymnum canit hunc libénter:

    Ut piis ejus méritis juvémur

    Omne per ævum.


    Sit salus illi, decus atque virtus,

    Qui supra cæli résidens cacúmen,

    Tótius mundi máchinam gubérnat

    Trinus et unus. Amen.
  en: >-
    This is the Lord's own hallowed confessor,

    Whose feast today the nations round are keeping;

    Joyful, he merited this day to enter

    Heaven's hid glory.


    Dutiful, prudent, humble, chaste, he flourished,

    Sober and quiet, pure in all his living,

    While in his body yet the breath of this life

    Quickened his members.


    Often at his consecrated tomb, the

    Limbs of those worn by long and grievous sickness,

    Whatsoever ill had laid them low, are

    Wholly restored.


    Therefore our choir today, in glad thanksgiving,

    Sings in his honor this our joyful anthem:

    That by his merits, freely won through goodness,

    We may be aided.


    Praise be to Him, all honor, might, dominion,

    Who from the height of heaven's throne is reigning,

    Governing all the fabric of creation,

    Three and yet One. Amen.
status:
  la: verified
  en: draft
