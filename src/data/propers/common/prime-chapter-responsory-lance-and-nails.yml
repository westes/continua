# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). The short responsory is the standard Prime form (as in prime-chapter-responsory-most-precious-blood.yml) with this feast's own versicle. English is this project's own translation, marked draft.
id: prime-chapter-responsory-lance-and-nails
text:
  la: |
      R.br. Christe, Fili Dei vivi, * Miserére nobis.
      R. Christe, Fili Dei vivi, * Miserére nobis.
      V. Qui vulnerátus es pro nobis.
      R. Miserére nobis.
      V. Glória Patri, et Fílio, * et Spirítui Sancto.
      R. Christe, Fili Dei vivi, * Miserére nobis.
  en: |
      R.br. Christ, Son of the living God, * have mercy on us.
      R. Christ, Son of the living God, * have mercy on us.
      V. Thou who wast wounded for us.
      R. Have mercy on us.
      V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
      R. Christ, Son of the living God, * have mercy on us.
status:
  la: verified
  en: draft
