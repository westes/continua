id: most-precious-blood-collect
text:
  la: |
    Orémus.
    Omnípotens sempitérne Deus, qui unigénitum Fílium tuum mundi Redemptórem
    constituísti, ac ejus Sánguine placári voluísti: concéde, quǽsumus, salútis
    nostræ prétium solémni cultu ita venerári, atque a præséntis vitæ malis ejus
    virtúte deféndi in terris; ut fructu perpétuo lætémur in cælis.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    Almighty, eternal God, Who made thy only-begotten Son the Redeemer of the world,
    and willed to be reconciled by His Blood, grant us, we beseech thee, so to worship
    in this sacred rite the price of our salvation, and to be so protected by its power
    against the evils of the present life on earth, that we may enjoy its everlasting
    fruit in heaven.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee,
    in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
