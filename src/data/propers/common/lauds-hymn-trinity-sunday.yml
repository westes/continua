# Corrected 2026-09-10: this file previously duplicated the Vespers hymn
# ("O lux beáta Trínitas"), based on an earlier live-query capture whose
# premise ("Trinity Sunday's own Lauds hymn is identical to Vespers'") did
# not hold up -- direct read of the reference source
# (Tempora/Pent01-0.txt) shows a genuinely distinct proper Lauds hymn,
# "Tu, Trinitátis Unitas", confirmed against both `[Hymnus Laudes]`
# (secular) and `[HymnusM Laudes]` (Monastic, a substitution overlay on
# the secular block -- applied by hand here, same convention used
# elsewhere in this store for regex-derived Monastic text). No English
# Monastic variant exists in the source; the secular English translation
# is reused (also the existing convention elsewhere). Final stanza is
# fixed/non-swappable -- no `*` marker anywhere in the source block.
id: lauds-hymn-trinity-sunday
text:
  la: >-
    Tu, Trinitátis Únitas,

    Orbem poténter quæ regis,

    Atténde laudum cántica,

    Quæ excubántes psállimus.


    Ortus refúlget Lúcifer,

    Sparsámque lucem núntiat:

    Cadit calígo nóctium:

    Lux sancta nos illúminet.


    Deo Patri sit glória,

    Ejúsque soli Fílio,

    Cum Spíritu Paráclito,

    Et nunc et in perpétuum. Amen.
  en: >-
    O thou, who dost all nature sway,

    Dread Trinity in Unity,

    Accept the trembling praise we pay

    To thy eternal majesty.


    The star that heralds in the dawn

    Is slowly fading in the skies;

    The darkness melts; O thou true light,

    Upon our darkened souls arise.


    To God the Father glory be,

    And to the sole-begotten Son,

    And Holy Ghost co-equally,

    While everlasting ages run. Amen.
status:
  la: verified
  en: verified
