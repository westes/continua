# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
id: sext-capitulum-crown-of-thorns
text:
  la: |
      Vidi, et ecce equus albus, et qui sedébat super illum, habébat arcum: et data est ei coróna, et exívit vincens, ut vínceret.
      R. Deo grátias.
      V. Tuam corónam adorámus Dómine.
      R. Tuam gloriósam recólimus passiónem.
  en: |
      And I saw, and behold a white horse, and he that sat on him had a bow, and there was a crown given him, and he went forth conquering that he might conquer.
      R. Thanks be to God.
      V. We adore thy crown, O Lord.
      R. We recall thy glorious passion.
citation:
  la: "Apoc 6:2"
  en: "Apocalypse 6:2"
status:
  la: verified
  en: draft
