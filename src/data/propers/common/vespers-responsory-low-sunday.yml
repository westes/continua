# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-04-11); Latin and English both taken from the page. Only First Vespers is rendered by the engine (the next day always takes Low Sunday evening), so these serve both evenings.
id: vespers-responsory-low-sunday
text:
  la: |
    R.br. Surréxit Dóminus vere, * Allelúia, allelúia.
    R. Surréxit Dóminus vere, * Allelúia, allelúia.
    V. Et appáruit Simóni.
    R. Allelúia, allelúia.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Surréxit Dóminus vere, * Allelúia, allelúia.
  en: |
    R.br. The Lord is risen indeed, * alleluia, alleluia.
    R. The Lord is risen indeed, * alleluia, alleluia.
    V. And hath appeared to Simon.
    R. Alleluia, alleluia.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. The Lord is risen indeed, * alleluia, alleluia.
status:
  la: verified
  en: verified
