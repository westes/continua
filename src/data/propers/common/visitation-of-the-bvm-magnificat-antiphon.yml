# Vespers' Magnificat antiphon for the Visitation of the BVM -- genuinely
# identical to visitation-of-the-bvm-antiphon.yml: the reference file
# (web/www/horas/Latin/Sancti/07-02.txt) has only one Vespers antiphon
# ([Ant 1], no separate [Ant 3]), reused for both First and Second
# Vespers -- same pattern as exaltation-of-the-holy-cross-magnificat-
# antiphon.yml's own header explains for that feast.
id: visitation-of-the-bvm-magnificat-antiphon
text:
  la: "Beáta es, * María, quæ credidísti: perficiéntur in te quæ dicta sunt tibi a Dómino, allelúja."
  en: "O Mary * blessed art thou that didst believe, for there shall be a performance of those things which were told thee from the Lord. Alleluia."
status:
  la: verified
  en: verified
