# English counterpart.
id: finding-of-the-holy-cross-lectio-prima
text:
  la: "Humiliávit semetípsum factus obédiens usque ad mortem, mortem autem Crucis. Propter quod et Deus exaltávit illum, et donávit illi nomen, quod est super omne nomen."
  en: "He humbled himself, becoming obedient unto death, even to the death of the cross. For which cause God also hath exalted him, and hath given him a name which is above all names"
citation:
  la: "Phil 2:8-9"
  en: "Phil 2:8-9"
status:
  la: verified
  en: verified
