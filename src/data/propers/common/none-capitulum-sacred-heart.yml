text:
  la: |
    Eph 3:17-19 In caritáte radicáti et fundáti, ut possítis comprehéndere cum ómnibus sanctis, quæ sit latitúdo et longitúdo, et sublímitas et profúndum; scire étiam supereminéntem sciéntiæ caritátem Christi, ut impleámini in omnem plenitúdinem Dei.
    R. Deo grátias.
    V. Hauriétis aquas in gáudio.
    R. De fóntibus Salvatóris.
  en: |
    Eph 3:17-19 Being rooted and grounded in love, may ye be able to comprehend with all saints what is the breadth and length and depth and height: and to know the love of Christ, which passeth knowledge, that ye might be filled with all the fullness of God.
    R. Thanks be to God.
    V. With joy shall ye draw water.
    R. Out of the fountains of the Saviour.
