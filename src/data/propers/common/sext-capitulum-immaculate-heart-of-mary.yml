id: sext-capitulum-immaculate-heart-of-mary
text:
  la: |
    Sir 24:15-16 Et sic in Sion firmáta sum, et in civitáte sanctificáta simíliter requiévi, et in Jerúsalem potéstas mea. Et radicávi in pópulo honorificáto, et in parte Dei mei heréditas illíus, et in plenitúdine sanctórum deténtio mea.
    R. Deo grátias.
    V. Elégit eam Deus, et præelégit eam.
    R. In tabernáculo suo habitáre facit eam.
  en: |
    Sir 24:15-16 And so was I established in Sion, and in the holy city likewise I rested, and my power was in Jerusalem. And I took root in an honourable people, and in the portion of my God his inheritance, and my abode is in the full assembly of saints.
    R. Thanks be to God.
    V. God hath chosen her, and fore-chosen her.
    R. He hath made her to dwell in His tabernacle.
