# Own proper antiphon (our-lady-of-mount-carmel-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (our-lady-of-mount-carmel-collect.yml), unchanged.
id: our-lady-of-mount-carmel-commemoration
text:
  la: |
    Ant. Sancta María, succúrre míseris, juva pusillánimes, réfove flébiles, ora pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu: séntiant omnes tuum juvámen, quicúmque célebrant tuam solémnem Commemoratiónem.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Deus, qui beatíssimæ semper Vírginis et Genetrícis tuæ Maríæ singulári título
    Carméli órdinem decorásti: concéde propítius; ut, cujus hódie Commemoratiónem
    solémni celebrámus offício, ejus muníti præsídiis, ad gáudia sempitérna
    perveníre mereámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Ant. Holy Mary, succor the wretched, help the faint-hearted, comfort the sorrowful, pray for the people, plead for the clergy, make intercession for all women vowed to God: may all who keep this thy solemn Commemoration feel the might of thine assistance.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    O Lord, Who hast given this excellency unto the Order of Carmel that the same
    should be especially styled the Order of the Most Blessed Mary, always a Virgin,
    thine Own Mother, mercifully grant that we who on this day do renew her memory in
    solemn worship, may worthily be shielded by her protection, and finally attain
    unto thine everlasting joy.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
status:
  la: verified
  en: verified
