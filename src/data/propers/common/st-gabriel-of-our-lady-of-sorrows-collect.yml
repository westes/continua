id: st-gabriel-of-our-lady-of-sorrows-collect
text:
  la: |
    Orémus.
    Deus, qui beátum Gabriélem dulcíssimæ Matris tuæ dolóres assídue recólere docuísti, ac
    per illam sanctitátis et miraculórum glória sublimásti: da nobis, ejus intercessióne et
    exémplo; ita Genetrícis tuæ consociári flétibus, ut matérna ejúsdem protectióne
    salvémur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who didst teach blessed Gabriel to ponder well the sorrows of thy gentle Mother,
    whereby thou didst also exalt him to the glory of holiness and mighty works: grant us,
    after his example, in such wise to become one with thy Mother in her sorrows; that under
    her kindly protection we may attain everlasting salvation.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world
    without end.
    R. Amen.
