# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Gregory the Great's own day (2026-03-12) -- the
# Benedictus antiphon. The source's own English page didn't render a
# translation (silently duplicated the Latin); translated here in the
# same register as the rest of this project's antiphons, so marked
# `draft` rather than `verified`. Alludes to the well-known "non Angli
# sed Angeli" episode (Bede, Historia Ecclesiastica II.1).
id: st-gregory-the-great-antiphon
text:
  la: "Gregórius, respíciens Anglórum júvenes, ait: Angélicam habent fáciem, et tales Angelórum in cælis decet esse consórtes."
  en: "Gregory, beholding the English youths, said: They have an angelic countenance, and it is meet that such should be companions of the Angels in heaven."
status:
  la: verified
  en: draft
