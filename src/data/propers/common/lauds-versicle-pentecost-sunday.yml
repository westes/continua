id: lauds-versicle-pentecost-sunday
text:
  la: "V. Repléti sunt omnes Spíritu Sancto, allelúia.\nR. Et cœpérunt loqui, allelúia."
  en: "V. They were all filled with the Holy Ghost, alleluia.\nR. And began to speak, alleluia."
