# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2025-11-13 -- byte-identical to Common-of-Several-Martyrs's
# own Vespers responsory. See lauds-capitulum-all-saints-of-the-
# benedictine-order.yml's header.
id: vespers-responsory-all-saints-of-the-benedictine-order
text:
  la: |
    R.br. Exsúltent justi * In conspéctu Dei.
    R. Exsúltent justi * In conspéctu Dei.
    V. Et delecténtur in lætítia.
    R. In conspéctu Dei.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Exsúltent justi * In conspéctu Dei.
  en: |
    R.br. Let the righteous rejoice * before God.
    R. Let the righteous rejoice * before God.
    V. Yea, let them exceedingly rejoice.
    R. Before God.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Let the righteous rejoice * before God.
status:
  la: verified
  en: verified
