# Read from the reference engine: SanctiM/11-13M.txt's own [Hymnus Matutinum]
# is `@Sancti/11-01:HymnusM Laudes:1-5` plus `...:21-30` -- i.e. stanza 1 and
# stanza 5 (the Monks' stanza) plus the doxology of All Saints' Monastic hymn
# "Jesu Salvátor sǽculi", an abbreviated three-stanza hymn for this feast.
# The reference has no English for it, so the English below is a fresh
# translation, marked draft.
id: matins-hymn-all-saints-of-the-benedictine-order
text:
  la: |
    Jesu Salvátor sǽculi,
    Redémptis ope súbveni:
    Et pia Dei Génitrix,
    Salútem posce míseris.

    Monachórum suffrágia,
    Omnésque cives cǽlici
    Annuant votis súpplicum,
    Et vitæ poscant prǽmium.

    Laus, honor, virtus, glória
    Deo Patri, et Fílio,
    Sancto simul Paráclito,
    In sæculórum sǽcula.
    Amen.
  en: |
    Jesus, Saviour of the ages,
    help those whom thou hast redeemed;
    and thou, devout Mother of God,
    ask salvation for the wretched.

    May the prayers of the monks,
    and all the citizens of heaven,
    grant the wishes of suppliants
    and ask for them the reward of life.

    Praise, honour, power, and glory
    to God the Father, and to the Son,
    and likewise to the Holy Paraclete,
    for ever and ever.
    Amen.
status:
  la: verified
  en: draft
