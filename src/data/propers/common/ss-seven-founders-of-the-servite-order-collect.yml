# [Oratio] and its English counterpart.
id: ss-seven-founders-of-the-servite-order-collect
text:
  la: |
    Orémus.
    Dómine Jesu Christe, qui ad recoléndam memóriam dolórum sanctíssimæ Genetrícis tuæ,
    per septem beátos Patres nova Servórum ejus família Ecclésiam tuam fecundásti: concéde
    propítius; ita nos eórum consociári flétibus, ut perfruámur et gáudiis.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Lord Jesus Christ, who, that thou mightest recall to mind the woes of thy most holy
    Mother, didst through the Seven blessed Fathers make thy Church herself the mother of a
    new household of her servants, grant unto us in mercy that we may so share their tears
    as to share their blessedness also.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world
    without end.
    R. Amen.
status:
  la: verified
