id: benedictus-antiphon-holy-name-of-mary
text:
  la: "Sancta María, * succúrre míseris, juva pusillánimes, réfove flébiles, ora pro pópulo, intérveni pro clero, intercéde pro devóto femineo sexu: séntiant omnes tuum juvámen, quicúmque célebrant tui sancti nóminis commemoratiónem."
  en: "O Holy Mary, * be thou an help to the helpless, a strength to the fearful, a comfort to the sorrowful; pray for the people, plead for the clergy, make intercession for all women vowed to God; may all that are keeping this Commemoration of thine holy Name feel the might of thine assistance."
status:
  la: verified
  en: verified
