# Standard de-Communi commemoration for common-of-a-confessor (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-john-capistrano has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-john-capistrano-collect.yml), unchanged.
id: commemoration-st-john-capistrano
text:
  la: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui per beátum Joánnem fidéles tuos in virtúte sanctíssimi nóminis Jesu de
    crucis inimícis triumpháre fecísti: præsta, quǽsumus; ut, spirituálium hóstium, ejus
    intercessióne, superátis insídiis, corónam justítiæ a te accípere mereámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, Who by Thy blessed servant John didst cause Thy faithful people, through the
    power of the most Holy Name of Jesus, to prevail against the enemies of His Cross,
    grant unto us, we beseech Thee, the help of the prayers of the same Thy servant that
    we may prevail against our ghostly enemies, and may be made worthy to receive from
    Thee a crown of righteousness.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
