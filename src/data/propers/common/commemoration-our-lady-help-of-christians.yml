# Ant+V/R+collect commemoration bundle: the feast's own Benedictus antiphon ([Ant 2]) and [Versum 2], then the collect. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-24-Auxilium.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: commemoration-our-lady-help-of-christians
text:
  la: |
      Ant. Ad te, o sancta Dei Génitrix, clamavimus, et per te venit Dómini auxílium nobis.
      V. Diffúsa est grátia in lábiis tuis.
      R. Proptérea benedíxit te Deus in ætérnum.
      Orémus.
      Omnípotens et miséricors Deus, qui ad defensiónem pópuli christiáni in beatíssima Vírgine María perpétuum auxílium mirabíliter constituísti: concéde propítius; ut tali præsídio muniti, certantes in vita, victóriam de hoste malígno cónsequi valeamus in morte.
      Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Ant. To thee, O holy Mother of God, have we cried, and through thee the Lord's help hath come to us.
      V. Grace is poured into thy lips.
      R. Therefore God hath blessed thee for ever.
      Let us pray.
      Almighty and merciful God, who for the defence of the Christian people hast wonderfully appointed perpetual help in the most blessed Virgin Mary: mercifully grant that, fortified by such protection, we who strive in life may be able to obtain victory over the malignant enemy in death.
      Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
