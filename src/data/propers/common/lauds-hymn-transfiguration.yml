# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-08-06 -- own proper hymn ("Amor Jesu dulcíssime").
# See lauds-capitulum-transfiguration.yml's header.
id: lauds-hymn-transfiguration
text:
  la: >-
    Amor Jesu dulcíssime,

    Quando cor nostrum vísitas,

    Pellis mentis calíginem,

    Et nos reples dulcédine.


    Quam felix est quem sátias!

    Consors patérnæ déxteræ,

    Tu vere lumen pátriæ,

    Quod omnem sensum súperat.


    Splendor patérnæ glóriæ,

    Incomprehénsa bónitas,

    Amóris tui cópiam

    Da nobis per præséntiam.


    Glória tibi Dómine,

    Qui apparuísti hódie,

    Cum Patre et Sancto Spíritu,

    In sempitérna sǽcula. Amen.
  en: >-
    Light of the anxious heart,

    Jesus, thou dost appear,

    To bid the gloom of guilt depart,

    And shed thy sweetness here.


    Joyous is he, with whom,

    God's Word, thou dost abide;

    Sweet light of our eternal home,

    To fleshly sense denied.


    Brightness of God above!

    Unfathomable grace!

    Thy presence be a fount of love

    Within thy chosen place.


    To thee, whom children see,

    The Father ever blest,

    The Holy Spirit, One and Three,

    Be endless praise addrest. Amen.
status:
  la: verified
  en: verified
