# Commune/C7a.txt [Capitulum Nona] (a widow takes C7a; several women martyrs take C7b->C7). Terce takes the Lauds chapter and None takes Lectio Prima per the engine. The V/R pair after the chapter is the responsory breve inherited from Commune/C6. Replaced a copy of the Virgin's chapter (2 Cor 10:17 etc.), which the reference does not use for this Common.
id: none-capitulum-common-of-a-widow
text:
  la: |
    Multæ fíliæ congregavérunt divítias: tu supergréssa es univérsas. Fallax grátia, et vana est pulchritúdo: múlier timens Dóminum, ipsa laudábitur.
    R. Deo grátias.
    V. Elégit eam Deus, et præelégit eam.
    R. In tabernáculo suo habitáre facit eam.
  en: |
    Many daughters have gathered together riches: thou hast surpassed them all. Favour is deceitful, and beauty is vain: the woman that feareth the Lord, she shall be praised.
    R. Thanks be to God.
    V. God hath chosen her, and fore-chosen her.
    R. He hath made her to dwell in His tabernacle.
citation:
  la: "Prov 31:29-30"
  en: "Prov 31:29-30"
status:
  la: verified
  en: verified
