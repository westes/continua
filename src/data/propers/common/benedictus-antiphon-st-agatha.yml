# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Agatha's own day (2026-02-05) -- the Benedictus
# antiphon. Corrects the previous version of this file, which had been
# sourced from the Roman/secular rite's Sancti/02-05.txt's own [Ant 1]
# instead: real but different text from what Monastic 1617 actually
# renders at Lauds, same mistake as St. Lawrence's earlier fix.
id: benedictus-antiphon-st-agatha
text:
  la: "Paganórum * multitúdo fúgiens ad sepúlcrum Vírginis, tulérunt velum ejus contra ignem: ut comprobáret Dóminus, quod a perículis incéndii méritis beátæ Agathæ Mártyris suæ eos liberáret."
  en: "The heathen multitude made haste * and came to the grave of the virgin, and took therefrom her veil wherewith to stem the fire; that the Lord might show Himself to be a Deliverer from the burning, for the sake of Agatha, His blessed Martyr."
status:
  la: verified
  en: verified
