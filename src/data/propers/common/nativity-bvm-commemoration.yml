# Own proper antiphon (nativity-bvm-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (nativity-bvm-collect.yml), unchanged.
id: nativity-bvm-commemoration
text:
  la: |
    Ant. Nativitátem hodiérnam perpétuæ Vírginis Genitrícis Dei Maríæ solémniter celebrémus, qua celsitúdo throni procéssit, allelúja.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Fámulis tuis, quǽsumus, Dómine, cæléstis grátiæ munus impertíre: ut, quibus beátæ Vírginis partus éxstitit salútis exórdium; Nativitátis ejus votíva solémnitas pacis tríbuat increméntum.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Let us this day keep solemnly the Birthday of Mary, Mother but still Maiden, her Birth, a step toward the loftiness of her throne. Alleluia.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    Grant unto us thy servants, we beseech thee, O Lord, the gift of thy heavenly grace, unto whom Thou didst give the first sight of a Saviour as the offspring of a Blessed Virgin, and grant that this Feast, which they keep in honour of the same Virgin, may avail them unto the increase of peace.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
