# Own proper antiphon (st-raphael-archangel-antiphon.yml), paired with the standard de-Communi commemoration versicle for common-of-an-angel (inferred from the C4 "structural category" citation in the saint's own file) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (st-raphael-archangel-collect.yml), unchanged.
id: st-raphael-archangel-commemoration
text:
  la: |
    Ant. Ego sum Ráphaël Angelus, * qui asto ante Dóminum: vos autem benedícite Deum, et narráte ómnia mirabília ejus, allelúja.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui beátum Raphaélem Archángelum Tobíæ fámulo tuo cómitem
    dedísti in via: concéde nobis fámulis tuis; ut ejúsdem semper
    protegámur custódia et muniámur auxílio.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. I am the Angel Raphael * who stand before the Lord; but bless ye God, and tell of all His wondrous works, alleluia.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who didst give thy blessed Archangel Raphael unto thy servant
    Tobias to be his fellow wayfarer, grant unto us, thy servants, that
    the same may ever keep and shield us, help and defend us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: draft
  en: draft
