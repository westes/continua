# Collect. Sourced from web/www/horas/Latin/Sancti/Urbis/12-05-StanislausK.txt (Duplex, nine lessons, C5). English is this project's own translation, marked draft.
id: collect-st-stanislaus-kostka
text:
  la: |
      Orémus.
      Deus, qui inter cétera sapiéntiæ tuæ mirácula, étiam in tenera ætáte maturæ sanctitátis grátiam contulisti: da, quǽsumus; ut beáti Stanislai exémplo, tempus instanter operando rediméntes, in ætérnam íngredi réquiem festinémus.
      Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Let us pray.
      O God, who among the other marvels of thy wisdom didst bestow the grace of mature holiness even in tender age: grant, we beseech thee, that by the example of blessed Stanislaus, redeeming the time by earnest labour, we may hasten to enter into eternal rest.
      Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
