# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/11-11.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution. (This feast's own Benedictus antiphon,
# st-martin-of-tours-antiphon.yml, already correctly sources [Ant 1] --
# [Ant 2] there is a bare `@:Ant 1` cross-reference, same text reused
# for both, not a mis-tagging.)
id: magnificat-antiphon-st-martin-of-tours
text:
  la: "O beátum Pontíficem, * qui totis viscéribus diligébat Christum Regem, et non formidábat impérii principátum! o sanctíssima ánima, quam etsi gládius persecutóris non ábstulit, palmam tamen martýrii non amísit!"
  en: "O how blessed a Bishop was he! * All his bowels yearned on the King Christ, and he had no dread for the power of the Empire! O how holy a soul was his, which passed not away by the sword of the persecutor, and yet lost not the palm of martyrdom."
status:
  la: verified
  en: verified
