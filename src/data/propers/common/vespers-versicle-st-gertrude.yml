# No distinct Vespers versicle exists in the reference source for this
# feast; reusing common-of-a-virgin's own Vespers versicle. Authored to
# make her own bundle (needed for her genuinely proper Vespers hymn)
# render a real versicle instead of an unconditionally-rendered empty one.
id: vespers-versicle-st-gertrude
text:
  la: |
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  en: |
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
status:
  la: verified
  en: verified
