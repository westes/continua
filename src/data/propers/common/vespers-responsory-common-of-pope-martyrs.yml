# Commune C3b (Summorum Pontificum Martyrum) inherits C3 wholesale for this
# part (`@Commune/C3`); same text as vespers-responsory-common-of-several-martyrs.yml.
# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# `votive=C3` live query, 2026-08 -- see lauds-capitulum-common-of-
# several-martyrs.yml's header for why the votive-office view was used.
id: vespers-responsory-common-of-pope-martyrs
text:
  la: |
    R.br. Exsúltent justi * In conspéctu Dei.
    R. Exsúltent justi * In conspéctu Dei.
    V. Et delecténtur in lætítia.
    R. In conspéctu Dei.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Exsúltent justi * In conspéctu Dei.
  en: |
    R.br. Let the righteous rejoice * before God.
    R. Let the righteous rejoice * before God.
    V. Yea, let them exceedingly rejoice.
    R. Before God.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Let the righteous rejoice * before God.
status:
  la: verified
  en: verified
