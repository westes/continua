id: ss-cyril-and-methodius-collect
text:
  la: |
    Orémus.
    Omnípotens sempitérne Deus, qui Slavóniæ gentes per beátos Confessóres tuos
    atque Pontífices Cyríllum et Methódium ad agnitiónem tui nóminis veníre
    tribuísti: præsta; ut, quorum festivitáte gloriámur, eórum consórtio
    copulémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Almighty and everlasting God, Who hast granted unto the Slavic peoples the
    knowledge of thy Name through the mean of thy blessed Confessors and Bishops
    Cyril and Methodius, grant that we, who here keep gladly the festival of the
    same thy Saints, may hereafter be gathered unto their company.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
