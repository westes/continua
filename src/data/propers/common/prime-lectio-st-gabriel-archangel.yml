# English counterpart.
id: prime-lectio-st-gabriel-archangel
text:
  la: "Scito ergo et animadvérte: Ab éxitu sermónis, ut íterum ædificétur Jerúsalem, usque ad Christum ducem, hebdómades septem et hebdómades sexagínta duæ erunt."
  en: "Know thou therefore, and take notice: that from the going forth of the word, to build up Jerusalem again, unto Christ the prince, there shall be seven weeks, and sixty-two weeks: and the street shall be built again, and the walls in straitness of times."
citation:
  la: "Dan 9:25"
  en: "Dan 9:25"
status:
  la: verified
  en: verified
