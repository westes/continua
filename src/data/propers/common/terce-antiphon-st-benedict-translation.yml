# Terce reuses Lauds antiphon 2 (the historical minor-hours-borrow-from-Lauds
# convention, as for St. Benedict's March feast). English is a fresh
# translation, marked draft.
id: terce-antiphon-st-benedict-translation
text:
  la: "Completa oratione, * tres petras in loco posuit; et omnipotens Deus in montis excelsa rupe aquam produxit."
  en: "When his prayer was ended, * he set three stones in the place; and almighty God brought forth water on the high rock of the mountain."
status:
  la: verified
  en: draft
