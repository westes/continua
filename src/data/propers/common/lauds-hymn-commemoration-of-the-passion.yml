# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
id: lauds-hymn-commemoration-of-the-passion
text:
  la: |
      Sævo dolórum turbine
      Iactatur, atris óbrutus
      Pœnis, acerba sustinens,
      Redémptor affixus Cruci.

      Pedes manúsque horribili
      Clavi cruentant vúlnere;
      Cor, vultus, artus, pectora
      Sacro redundant sánguine.

      Flet, orat, et clamans obit;
      Cor Matris ictum concídit;
      Heu Mater! Heu Fili! dolor
      Ingrata frangat pectora.

      Montes, sepúlcra, saxaque
      Scinduntur; arva, flúmina,
      Rupes, et æquor contremunt,
      Templique velum scinditur.

      Sol, luna, cælum, sidera
      Plangunt, et Orbis ingemit.
      O vos viri, vos párvuli,
      Nuptæ, puéllæ, plangite,

      Adstate mœrentes Cruci,
      Pedes beátos ungite,
      Lavate fletu, tergite
      Comis, et ore lambite.

      Tu, caritátis victima,
      Ut nostra tollas crímina,
      Nobis salubri perficis
      Adoptiónem Sánguine.

      Nostra ergo pax et gáudium,
      Sis vita, Iesu, et prǽmium,
      Sis ductor et lux in via,
      Merces, coróna in Pátria.
      Amen.
  en: |
      In a savage whirlwind of sorrows
      the Redeemer is tossed, overwhelmed with dark
      pains, enduring bitter things,
      fastened to the Cross.

      The nails make feet and hands bloody
      with a dreadful wound;
      heart, face, limbs, breast
      overflow with sacred blood.

      He weeps, prays, and dies crying out;
      the Mother's stricken heart sinks;
      alas, Mother! alas, Son! let sorrow
      break ungrateful breasts.

      Mountains, tombs and rocks
      are rent; fields, rivers,
      cliffs and sea tremble,
      and the veil of the temple is rent.

      Sun, moon, heaven, stars
      mourn, and the world groans.
      O you men, you little ones,
      brides, maidens, weep,

      stand mourning by the Cross,
      anoint the blessed feet,
      wash them with tears, wipe them
      with your hair, and kiss them with your lips.

      Thou, victim of charity,
      that thou mightest take away our sins,
      dost accomplish for us adoption
      by thy saving Blood.

      Be then our peace and joy,
      be life, Jesus, and reward,
      be leader and light on the way,
      recompense and crown in the Homeland. Amen.
status:
  la: verified
  en: draft
