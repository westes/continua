# Engine render (Monastic Tridentinum 1617, command=praySexta, 2025-04-06); Latin and English both taken from the page.
id: sext-capitulum-passion-sunday
text:
  la: |
    Heb 9:13-14 Si enim sanguis hircórum, et taurórum, et cinis vítulæ aspérsus inquinátos sanctíficat ad emundatiónem carnis: quanto magis sanguis Christi, qui per Spíritum Sanctum semetípsum óbtulit immaculátum Deo, emundábit consciéntiam nostram ab opéribus mórtuis, ad serviéndum Deo vivénti?
    R. Deo grátias.
    V. De ore leónis líbera me, Dómine.
    R. Et a córnibus unicórnium humilitátem meam.
  en: |
    Heb 9:13-14 For if the blood of goats and of oxen, and the ashes of an heifer being sprinkled, sanctify such as are defiled, to the cleansing of the flesh: How much more shall the blood of Christ, who by the Holy Ghost offered himself unspotted unto God, cleanse our conscience from dead works, to serve the living God?
    R. Thanks be to God.
    V. From the lion's mouth, * O Lord, save me.
    R. And my lowness from the horns of the unicorns.
