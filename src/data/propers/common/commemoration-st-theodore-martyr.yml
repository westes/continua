# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-martyr; collect is the saint's own (collect-st-theodore-martyr.yml). Not
# independently live-verified for this category, so marked draft.
id: commemoration-st-theodore-martyr
text:
  la: |
    Ant. Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam.
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
    Orémus.
    Deus, qui nos beáti Theodóri Mártyris tui confessióne gloriósa circúmdas et prótegis: præsta nobis ex ejus imitatióne profícere, et oratióne fulcíri.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Ant. He that hateth his life in this world, shall keep it unto life eternal.
    V. The righteous shall flourish like the palm tree:
    R. He shall grow up like the cedar of Libanus.
    Let us pray.
    O God, Who surround and protect us with the glorious profession of blessed Theodore, Your Martyr, grant us to profit by imitating him and to rejoice in his intercession.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

status:
  la: draft
  en: draft
