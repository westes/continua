# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: sext-capitulum-holy-shroud
text:
  la: |
      Quare ergo rubrum est indumentum tuum, et vestiménta tua sicut calcantium in torculari? Torcular calcavi solus, et de géntibus non est vir mecum.
      R. Deo grátias.
      V. Omnis terra adóret te, et psallat tibi.
      R. Psalmum dicat nómini tuo Dómine.
  en: |
      Why then is thy apparel red, and thy garments like theirs that tread in the winepress? I have trodden the winepress alone, and of the Gentiles there is not a man with me.
      R. Thanks be to God.
      V. Let all the earth adore thee, and sing to thee.
      R. Let it sing a psalm to thy name, O Lord.
citation:
  la: "Is 63:2"
  en: "Isaiah 63:2"
status:
  la: verified
  en: draft
