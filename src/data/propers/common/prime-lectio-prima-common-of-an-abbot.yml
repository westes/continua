# New file, 2026-10-04: the Common-category tier of Prime's Lectio
# Brevis override (see hours/resolve-common.ts's getPrimeLectioBrevis) --
# a saint with no proper Lectio Prima of her own, but who belongs to a
# Common category, uses that category's own text rather than falling all
# the way to the generic per-annum default. Sourced directly from
# web/www/horas/Latin/Commune/C5.txt's own [Lectio Prima] tag and its
# English counterpart.
id: prime-lectio-prima-common-of-an-abbot
text:
  la: "Justum dedúxit Dóminus per vias rectas, et osténdit illi regnum Dei, et dedit illi sciéntiam sanctórum: honestávit illum in labóribus, et complévit labóres illíus."
  en: "She conducted the just, when he fled from his brother's wrath, through the right ways, and showed him the kingdom of God, and gave him the knowledge of the holy things, made him honourable in his labours, and accomplished his labours."
citation:
  la: "Sap 10:10"
  en: "Wis 10:10"
status:
  la: verified
  en: verified
