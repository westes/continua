id: prime-lectio-pasch
text:
  la: "Si consurrexístis cum Christo, quæ sursum sunt quǽrite, ubi Christus est in déxtera Dei sedens: quæ sursum sunt sápite, non quæ super terram."
  en: "If you be risen with Christ, seek the things that are above; where Christ is sitting at the right hand of God: Mind the things that are above, not the things that are upon the earth."
citation:
