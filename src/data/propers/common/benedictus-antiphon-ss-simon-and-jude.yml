# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, Ss. Simon and Jude's own day (2026-10-28) -- the Benedictus
# antiphon (Matt 19:27ff, same verse as St. Matthias/Barnabas/James the
# Greater/Bartholomew/Matthew/Luke's own). The source's own English
# existed but was jarringly modern next to every other antiphon's archaic
# register -- reworded to match (the underlying verse's standard
# Douay-Rheims wording, same fix as those six), marked draft rather than
# a straight source transcription.
id: benedictus-antiphon-ss-simon-and-jude
text:
  la: "Vos qui reliquístis ómnia, et secúti estis me, céntuplum accipiétis, et vitam ætérnam possidébitis."
  en: "Ye who have left all things, and have followed me, shall receive an hundredfold, and shall possess life everlasting."
status:
  la: verified
  en: draft
