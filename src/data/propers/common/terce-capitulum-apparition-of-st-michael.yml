# Verified against Divinum Officium (Monastic Tridentinum 1617), Terce
# live query, the Apparition of St. Michael's own day (2026-05-08, clean year).
id: terce-capitulum-apparition-of-st-michael
text:
  la: |
    Significávit Deus, quæ opórtet fíeri cito, loquens per Angelum suum servo suo Joánni, qui testimónium perhíbuit verbo Dei, et testimónium Jesu Christi, quæcúmque vidit.
    R. Deo grátias.
    V. Stetit Angelus juxta aram templi, allelúja.
    R. Habens thuríbulum áureum in manu sua, allelúja.
  en: |
    God gave unto Jesus Christ to show unto His servants the things which must shortly come to pass and He sent and signified it by His Angel unto His servant John, who bare witness of the Word of God and of the testimony of Jesus Christ, of all the things which he saw.
    R. Thanks be to God.
    V. An Angel stood at the Altar of the Temple. Alleluia.
    R. Having a golden censer in his hand. Alleluia.
citation:
  la: "Apo 1:1-2"
  en: "Rev 1:1-2"
status:
  la: verified
  en: verified
