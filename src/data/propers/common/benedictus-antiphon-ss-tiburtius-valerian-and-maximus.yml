# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, Ss. Tiburtius, Valerian, and Maximus's own day (2027-04-14).
# The Benedictus antiphon -- shared word-for-word with St. George's,
# St. Vitalis's, and St. Peter Martyr's own (all draw on the same
# Eastertide Common of Several Martyrs text, confirmed independently for
# each rather than assumed).
id: benedictus-antiphon-ss-tiburtius-valerian-and-maximus
text:
  la: "Fíliæ Jerúsalem, * veníte et vidéte Mártyres cum corónis, quibus coronávit eos Dóminus in die solemnitátis et lætítiæ, allelúja, allelúja."
  en: "Daughters of Jerusalem, * come and see the crowned martyrs, the Lord crowned them in his solemnity and delight, alleluia, alleluia."
status:
  la: verified
  en: verified
