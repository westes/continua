text:
  la: |
    1 Joann. 5:9-10 Si testimónium hóminum accípimus, testimónium Dei majus est: quóniam hoc est testimónium Dei, quod majus est, quóniam testificátus est de Fílio suo. Qui credit in Fílium Dei, habet testimónium Dei in se.
    R. Deo grátias.
    V. Gavísi sunt discípuli, allelúja.
    R. Viso Dómino, allelúja.
  en: |
    1 John 5:9-10 If we receive the testimony of men, the testimony of God is greater. For this is the testimony of God, which is greater, because he hath testified of his Son. He that believeth in the Son of God, hath the testimony of God in himself.
    R. Thanks be to God.
    V. The disciples therefore were glad, alleluia.
    R. When they saw the Lord, alleluia.
