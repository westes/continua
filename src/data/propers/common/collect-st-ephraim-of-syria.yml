id: collect-st-ephraim-of-syria
text:
  la: |
    Orémus.
    Deus, qui Ecclésiam tuam beáti Ephræm Confessóris tui et Doctóris mira eruditióne et
    præcláris vitæ méritis illustráre voluísti: te súpplices exorámus; ut, ipso intercedénte,
    eam advérsus erróris et pravitátis insídias perénni tua virtúte deféndas.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who didst will to make thy Church glorious by the wondrous learning and the
    shining merits of blessed Ephraim, thy Confessor and Doctor: we humbly beseech thee;
    that, by his intercession, thou wouldst ever defend her by thy power against the snares
    of error and wickedness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
status:
