# First Vespers Magnificat antiphon: web/www/horas/Latin/Sancti/06-26.txt's own [Ant 1]
# and its English counterpart. Second Vespers' [Ant 3] is
# ss-john-and-paul-magnificat-antiphon.yml (the default); see hours/resolve-common.ts's
# withVespersVariant.
id: magnificat-antiphon-ss-john-and-paul-first
text:
  la: "Astitérunt * justi ante Dóminum, et ab invicem non sunt separáti: cálicem Dómini biberunt, et amici Dei appelláti sunt."
  en: "The righteous stand * in the Presence of the Lord, and are not divided the one from the other; they drank of the Lord's Cup, and they are called Friends of God."
status:
  la: verified
  en: verified
