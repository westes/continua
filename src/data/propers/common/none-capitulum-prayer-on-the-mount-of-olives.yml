id: none-capitulum-prayer-on-the-mount-of-olives
text:
  la: |
      Orate pro persequéntibus et calumniántibus vos: ut sitis fílii Patris vestri, qui in cœlis est.
      R. Deo grátias.
      V. Factus est sudor ejus.
      R. Sicut guttæ sánguinis.
  en: |
      Pray for them that persecute and calumniate you, that you may be the children of your Father who is in heaven.
      R. Thanks be to God.
      V. His sweat became.
      R. As drops of blood.
citation:
  la: "Matth 5:44-45"
  en: "Matthew 5:44-45"
status:
  la: verified
  en: draft
