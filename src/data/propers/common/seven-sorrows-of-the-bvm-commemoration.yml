# Own proper antiphon (seven-sorrows-of-the-bvm-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (seven-sorrows-of-the-bvm-collect.yml), unchanged.
id: seven-sorrows-of-the-bvm-commemoration
text:
  la: |
    Ant. Nolíte me consideráre * quod fusca sim, quia decolorávit me sol: fílii matris meæ pugnavérunt contra me.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Deus, in cujus passióne, secúndum Simeónis prophetíam, dulcíssimam
    ánimam gloriósæ Vírginis et Matris Maríæ dolóris gládius pertransívit:
    concéde propítius; ut, qui dolóres ejus venerándo recólimus, passiónis
    tuæ efféctum felícem consequámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    ℟. Amen.
  en: |
    Ant. Look not upon me * because I am black, because the sun hath tanned me. My mother's children were angry with me.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    O God, at Whose suffering the prophecy of Simeon was fulfilled, and a
    sword of sorrow pierced through the gentle soul of the glorious Virgin
    and Mother Mary, mercifully grant that we who speak worshipfully of
    her woes, may obtain the saving purchase of thy suffering.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
