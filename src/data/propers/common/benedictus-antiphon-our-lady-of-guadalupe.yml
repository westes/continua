id: benedictus-antiphon-our-lady-of-guadalupe
text:
  la: "Elégi et sanctificávi locum istum; * Ut sit ibi nomen meum, et permáneant óculi mei, et cor meum ibi cunctis diébus."
  en: "I have chosen and made holy this place, * that my name may be there, and mine eyes, and my heart may remain there for all the days."
