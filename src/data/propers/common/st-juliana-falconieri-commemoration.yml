# Standard de-Communi commemoration for common-of-a-virgin (`[Ant 2]`+
# `[Versum 2]` from the reference engine's Commune files, same pattern
# st-rose-of-lima-commemoration.yml uses). St. Juliana has no proper
# antiphon of her own in the source (a plain "vide C6a" reference), so
# this reuses the Common's own text, marked `draft` per this app's
# "prefer draft over missing" convention. Collect is her own real proper
# (st-juliana-falconieri-collect.yml), unchanged. Needed for the rare
# case Jun 19 falls on a day that outranks her (e.g. a Sunday), demoting
# her to a commemoration alongside Ss. Gervase and Protase.
id: st-juliana-falconieri-commemoration
text:
  la: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui beátam Juliánam Vírginem tuam extrémo morbo laborántem, pretióso Fílii tui
    Córpore mirabíliter recreáre dignátus es: concéde, quǽsumus; ut, ejus intercedéntibus
    méritis, nos quoque eódem in mortis agóne refécti ac roboráti, ad cæléstem pátriam
    perducámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Who wast pleased in wondrous wise to comfort thy blessed Virgin Juliana, lying
    sick unto death, with the Precious Body of thy Son: grant, we beseech thee, that by her
    interceding merits we too may be refreshed and strengthened by that same Food in the
    agony of death, and so be brought to our heavenly Fatherland.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
