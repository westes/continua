# The Exaltation of the Holy Cross's own real, distinct Oratio -- read
# directly from web/www/horas/Latin/Sancti/09-14.txt's own [Oratio] and
# its English counterpart (English/Sancti/09-14.txt). Textually distinct
# from finding-of-the-holy-cross-collect.yml's own ("Deus, qui in
# præclára salutíferæ Crucis Inventióne...") -- previously
# exaltation-of-the-holy-cross.yml pointed its `propers` straight at
# `finding-of-the-holy-cross`, which meant this feast's real, separately-
# authored collect was never used. Corrected 2026-09-14: her `[Rule]`'s
# `ex Sancti/05-03` line governs the untagged/default parts of the
# Monastic office (versicles, Ant 1, Ant Vespera, Lauds capitulum -- see
# exaltation-of-the-holy-cross.yml's own header), not literally every
# category; the collect is one of the parts genuinely her own.
id: collect-exaltation-of-the-holy-cross
text:
  la: |
    Orémus.
    Deus, qui nos hodiérna die Exaltatiónis sanctæ Crucis ánnua solemnitáte lætíficas:
    præsta, quǽsumus; ut, cujus mystérium in terra cognóvimus, ejus redemptiónis prǽmia
    in cælo mereámur.
    Per eúmdem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who dost this day gladden us by the yearly Feast of the Exaltation of the Holy
    Cross, grant, we beseech thee, that even as we have understood the mystery thereof
    upon earth, so we may worthily enjoy in heaven the fruits of the redemption which was
    paid thereon.
    Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
