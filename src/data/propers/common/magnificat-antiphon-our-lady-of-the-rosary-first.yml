# First Vespers Magnificat antiphon: web/www/horas/Latin/Sancti/10-07.txt's
# own [Ant 1] and its English counterpart. Second Vespers' [Ant 3] is
# our-lady-of-the-rosary-magnificat-antiphon.yml (the default); see
# hours/resolve-common.ts's withVespersVariant.
id: magnificat-antiphon-our-lady-of-the-rosary-first
text:
  la: "Beáta es, * Virgo María, Dei Génetrix, quæ credidísti Dómino; perfécta sunt in te quæ dicta sunt tibi, intercéde pro nobis ad Dóminum, Deum nostrum."
  en: "Blessed art thou, * O Virgin Mary, Mother of God, for thou hast believed in the Lord, and because those things are accomplished in thee that were spoken to thee; make intercession for us unto the same Lord our God."
status:
  la: verified
  en: verified
