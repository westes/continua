# Lauds short responsory. Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2026-11-09, the Dedication of the Basilica of the Most Holy Savior; the Nov 18 Dedication of the Basilicas of Ss. Peter and Paul, also ex C8, takes the same Common). Before this file the Common of a Dedication had no Lauds/Vespers bundle and both feasts fell through to the ferial chapter, responsory and hymn.
id: lauds-responsory-common-of-a-dedication
text:
  la: |
    R.br. Domum tuam, Dómine, * Decet sanctitúdo.
    R. Domum tuam, Dómine, * Decet sanctitúdo.
    V. In longitúdinem diérum.
    R. Decet sanctitúdo.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Domum tuam, Dómine, * Decet sanctitúdo.
  en: |
    R.br. Holiness becometh thine house, * O Lord.
    R. Holiness becometh thine house, * O Lord.
    V. For ever.
    R. O Lord.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Holiness becometh thine house, * O Lord.
status:
  la: verified
  en: verified
