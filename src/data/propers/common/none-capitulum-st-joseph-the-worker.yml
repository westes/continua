# [Capitulum Nona] with [Versum 2]. Read from the reference engine: web/www/horas/Latin/Sancti/05-01r.txt (Duplex I classis, a 1955 feast; nine lessons, `proper`), English from the parallel English file.
id: none-capitulum-st-joseph-the-worker
text:
  la: |
    Fratres: Quodcúmque fácitis, ex ánimo operámini sicut Dómino, et non homínibus, sciéntes quod a Dómino accipiétis retributiónem hereditátis. Dómino Christo servíte.
    R. Deo grátias.
    V. Ora pro nobis, sancte Joseph, allelúja.
    R. Labórum nostrórum protéctor fidélis, allelúja.
  en: |
    Brethren: Whatsover you do, do it from the heart, as to the Lord, and not to men, knowing that you shall receive of the Lord the reward of inheritance. Serve ye the Lord Christ.
    R. Thanks be to God.
    V. Pray for us, holy Joseph, alleluia.
    R. Faithful protector of our labours, alleluia.
citation:
  la: "Col 3:24"
  en: "Col 3:24"
