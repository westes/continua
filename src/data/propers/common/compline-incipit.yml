# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08-25
# run. Compline's own opening blessing — distinct from Prime's Regula
# blessing ("Dies et actus nostros...") despite the shared "Jube, domne"
# request line.
id: compline-incipit
text:
  la: |
    V. Jube, domne, benedícere.
    Benedictio.
    Noctem quiétam et finem perféctum concédat nobis Dóminus omnípotens.
    R. Amen.
  en: |
    V. Grant, Lord, a blessing.
    Benediction.
    May almighty God grant us a quiet night and a perfect end.
    R. Amen.
status:
  la: verified
  en: verified
