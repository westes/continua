# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Urban I's own day (2038-05-25 -- 2026-2037 are all
# governed by Ascensiontide/Pentecost/Trinity/Corpus Christi in some
# combination; late Easter years like 2038 are the only clean ones).
# The Benedictus antiphon -- see st-john-before-the-latin-gate-
# antiphon.yml's note on the shared Eastertide Common text.
id: benedictus-antiphon-st-urban-i
text:
  la: "Fíliæ Jerúsalem, * veníte et vidéte Mártyres cum corónis, quibus coronávit eos Dóminus in die solemnitátis et lætítiæ, allelúia, allelúia."
  en: "Daughters of Jerusalem, * come and see the crowned martyrs, the Lord crowned them in his solemnity and delight, alleluia, alleluia."
status:
  la: verified
  en: verified
