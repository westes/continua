# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C6` live query, 2026-08 -- same votive-office-view reasoning as
# vespers-hymn-common-of-a-martyr-bishop.yml's header (real saints in
# this category have their evening/Lauds contaminated by neighboring
# days' anticipation or their own fame — Ss. Agatha/Agnes/Cecilia/Lucy
# all have real proper content of their own — so the votive view gets a
# clean, unambiguous read of the category's real content). Same chapter
# reused for Vespers -- no separate vespers-capitulum-<id> file
# authored, per vespers.ts's vespersCapitulumForOverride fallback.
id: lauds-capitulum-common-of-a-virgin-martyr
text:
  la: "Fratres: Qui gloriátur, in Dómino gloriétur. Non enim qui seípsum comméndat, ille probátus est; sed quem Deus comméndat."
  en: "Brothers: But he that glorieth, let him glory in the Lord. For not he who commendeth himself, is approved, but he, whom God commendeth."
citation:
  la: "2 Cor 10:17-18"
  en: "2 Cor 10:17-18"
status:
  la: verified
  en: verified
