# First Vespers Magnificat antiphon for this Common: Latin/Commune/C3.txt's own
# [Ant 1] (and its English counterpart), where it differs from [Ant 3]. Second
# Vespers' [Ant 3] is magnificat-antiphon-common-of-pope-martyrs.yml (the default); see
# hours/resolve-common.ts's withVespersVariant.
id: magnificat-antiphon-common-of-pope-martyrs-first
text:
  la: "Istórum est enim * regnum cælórum qui contempsérunt vitam mundi, et pervenérunt ad prǽmia regni, et lavérunt stolas suas in sánguine Agni."
  en: "For theirs is the Kingdom of heaven * who love not their lives in this world, and have attained unto the reward of the Kingdom, and have washed their robes in the blood of the Lamb."
status:
  la: verified
  en: verified
