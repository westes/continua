# Sourced from web/www/horas/Latin/Sancti/12-28.txt's own [Lectio Prima] and its
# English counterpart.
id: holy-innocents-lectio-prima
text:
  la: "Hi empti sunt ex homínibus primítiæ Deo et Agno, et in ore ipsórum non est invéntum mendácium: sine mácula enim sunt ante thronum Dei."
  en: "These were purchased from among men, the firstfruits to God and to the Lamb: And in their mouth there was found no lie; for they are without spot before the throne of God."
citation:
  la: "Apo 14:4-5"
  en: "Rev 14:4-5"
status:
  la: verified
  en: verified
