text:
  la: "Ecce tabernáculum Dei cum homínibus, et habitábit cum eis: et ipsi pópulus ejus erunt, et ipse Deus cum eis erit eórum Deus."
  en: "Behold the tabernacle of God with men, * and he will dwell with them: and they shall be his people, and God himself with them shall be their God."
