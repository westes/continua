# Ant+V/R+collect commemoration bundle: the feast's own Benedictus antiphon ([Ant 2]) and [Versum 2], then the collect. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). English is this project's own translation, marked draft.
id: commemoration-most-holy-redeemer
text:
  la: |
      Ant. Ecce Deus noster iste, exspectavimus eum, et salvábit nos: sustinuimus eum; exsultabimus, et lætábimur in salutári ejus, allelúja.
      V. Dómine refúgium factus es nobis.
      R. A generatióne, et progénie.
      Orémus.
      Deus, qui Unigénitum tuum mundi Redemptorem constituísti, et per eum, devícta morte, nos misericórditer ad vitam reparásti: concéde; ut hæc benefícia recoléntes, tibi perpétua caritáte adhærére, et ejúsdem redemptiónis fructum percípere mereámur.
      Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Ant. Behold, this is our God, we have waited for him, and he will save us: this is the Lord, we have patiently waited for him; we shall rejoice and be glad in his salvation, alleluia.
      V. Lord, thou hast been made our refuge.
      R. From generation to generation.
      Let us pray.
      O God, who didst appoint thine only-begotten Son the Redeemer of the world, and through him, death being overcome, didst mercifully restore us to life: grant that, recalling these benefits, we may deserve to cleave to thee with perpetual charity, and to receive the fruit of the same redemption.
      Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
