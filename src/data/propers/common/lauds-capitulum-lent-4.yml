# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2025-03-30); Latin and English both taken from the page.
id: lauds-capitulum-lent-4
text:
  la: "Fratres: Scriptum est, quóniam Abraham duos fílios hábuit: unum de ancílla, et unum de líbera: sed qui de ancílla, secúndum carnem natus est: qui autem de líbera, per repromissiónem: quæ sunt per allegoríam dicta."
  en: "Brothers: For it is written that Abraham had two sons: the one by a bondwoman, and the other by a free woman. But he who was of the bondwoman, was born according to the flesh: but he of the free woman, was by promise, which things are said by an allegory."
citation:
  la: "Gal 4:22-24"
  en: "Gal 4:22-24"
status:
  la: verified
  en: verified
