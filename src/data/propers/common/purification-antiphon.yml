id: purification-antiphon
text:
  la: "Senex * Púerum portábat, Puer autem senem regébat: quem virgo péperit, et post partum virgo permánsit: ipsum quem génuit, adorávit."
  en: "The old man held his Lord * in his arms in the form of a little child, but the Child was the old man's King even that Child whom a virgin bore, and remained a virgin as before the fruit of her womb, and the God of her soul."
status:
  la: verified
  en: verified
