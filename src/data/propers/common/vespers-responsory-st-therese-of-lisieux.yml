# web/www/horas/Latin/SanctiM/10-03b.txt's [Responsory Vespera]. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: vespers-responsory-st-therese-of-lisieux
text:
  la: |
    R.br. Anima mea * Exsultábit in Dómino.
    R. Anima mea * Exsultábit in Dómino.
    V. Et delectábitur super salutári suo.
    R. Exsultábit in Dómino.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Anima mea * Exsultábit in Dómino.
  en: |
    R.br. My soul * shall rejoice in the Lord.
    R. My soul * shall rejoice in the Lord.
    V. And shall be delighted in his salvation.
    R. Shall rejoice in the Lord.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. My soul * shall rejoice in the Lord.
status:
  la: verified
  en: draft
