# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/01-23-Desponsatio.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: magnificat-antiphon-betrothal-of-the-bvm
text:
  la: "Desponsátio tua, Dei Génitrix Virgo, gaúdium annuntiávit univérso mundo: ex te enim ortus est sol justítiæ, Christus Deus noster: qui solvens maledictiónem, dedit benedictiónem: et confúndens mortem, donávit nobis vitam sempitérnam."
  en: "Thy betrothal, O Virgin Mother of God, hath announced joy to the whole world: for from thee is risen the sun of justice, Christ our God: who, loosing the curse, gave blessing, and confounding death, gave us life everlasting."
status:
  la: verified
  en: draft
