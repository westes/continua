text:
  la: "Fratres: Si linguis hóminum loquar, et Angelórum, caritátem autem non hábeam, factus sum velut æs sonans, aut cýmbalum tínniens."
  en: "Brothers: If I speak with the tongues of men, and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal."
