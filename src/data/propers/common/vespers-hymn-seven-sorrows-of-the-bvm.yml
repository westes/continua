id: vespers-hymn-seven-sorrows-of-the-bvm
text:
  la: >-
    Jam toto súbitus vesper eat polo,

    Et sol attónitum præcípitet diem,

    Dum sævæ récolo ludíbrium necis,

    Divinámque catástrophen.


    Spectátrix áderas supplício, Parens,

    Malis uda, gerens cor adamántinum;

    Natus funérea péndulus in cruce

    Altos dum gémitus dabat.


    Pendens ante óculos Natus, atrócibus

    Sectus verbéribus, Natus hiántibus

    Fossus vulnéribus, quot penetrántibus

    Te confíxit acúleis!


    Eheu! Sputa, álapæ, vérbera, vúlnera,

    Clavi, fel, áloë, spóngia, láncea,

    Sitis, spina, cruor, quam vária pium

    Cor pressére tyránnide!


    Cunctis intérea stas generósior,

    Virgo, Martýribus: prodígio novo,

    In tantis móriens non móreris, Parens,

    Diris fixa dolóribus.


    Sit summæ Tríadi glória, laus, honor,

    A qua supplíciter, sollícita prece,

    Posco virgínei róboris ǽmulas

    Vires rebus in ásperis. Amen.
  en: >-
    Now let sudden evening spread over the whole sky,

    and let the sun hasten the astonished day to its close,

    while I recall the mockery of that cruel death,

    and that divine catastrophe.


    Thou wast present, O Mother, a witness of the punishment,

    bathed in woe, bearing a heart of adamant;

    while thy Son, hanging on the funereal cross,

    gave forth deep groans.


    Thy Son hanging before thine eyes, torn

    with cruel scourges, thy Son pierced

    with gaping wounds — with how many piercing

    stings did he transfix thee!


    Alas! Spittings, buffetings, scourgings, wounds,

    nails, gall, aloes, sponge, spear,

    thirst, thorns, blood — with how manifold

    a tyranny did they press upon that loving heart!


    Meanwhile thou standest more noble than all

    the Martyrs, O Virgin: by a new wonder,

    dying amid such sufferings, thou dost not die, O Mother,

    transfixed by dire sorrows.


    Glory, praise, and honour be to the most high Trinity,

    from whom I humbly beg, with earnest prayer,

    strength rivalling the Virgin's fortitude

    amid life's hardships. Amen.
