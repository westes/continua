id: collect-st-thomas-of-villanova
text:
  la: |
    Orémus.
    Deus, qui beátum Thomam Pontíficem insígnis in páuperes misericórdiæ virtúte decorásti: quǽsumus; ut, ejus intercessióne, in omnes, qui te deprecántur, divítias misericórdiæ tuæ benígnus effúndas.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Let us pray.
    O God, Who didst adorn the blessed Bishop Thomas with the grace of an excellent pitifulness toward the needy, we entreat thee for the same thy servant's sake mercifully to pour forth the riches of thine own pitifulness upon all them which cry unto thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

