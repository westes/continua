# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/10-24.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast (own First Vespers
# [Ant 1] already covers st-raphael-archangel-antiphon.yml, used for the
# Benedictus), not a Common substitution.
id: st-raphael-archangel-magnificat-antiphon
text:
  la: "Princeps gloriosíssime, * Ráphaël Archángele, esto memor nostri; hic et ubíque semper precáre pro nobis Fílium Dei."
  en: "O Thou Prince most glorious, * Raphael the Archangel, remember us, and here and everywhere always entreat for us the countenance of the Son of God."
status:
  la: verified
  en: verified
