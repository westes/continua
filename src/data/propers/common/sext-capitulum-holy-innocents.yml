# Verified against Divinum Officium (Monastic Tridentinum 1617), Sext
# live query, Holy Innocents' own day (2029-12-28, clean year).
id: sext-capitulum-holy-innocents
text:
  la: |
    Hi sunt, qui cum muliéribus non sunt coinquináti: vírgines enim sunt. Hi sequúntur Agnum quocúmque íerit.
    R. Deo grátias.
    V. Exsúltent justi in conspéctu Dei.
    R. Et delecténtur in lætítia.
  en: |
    These are they who were not defiled with women: for they are virgins. These follow the Lamb whithersoever he goeth.
    R. Thanks be to God.
    V. Let the righteous rejoice before God.
    R. Yea, let them exceedingly rejoice.
citation:
  la: "Apo 14:4"
  en: "Rev 14:4"
status:
  la: verified
  en: verified
