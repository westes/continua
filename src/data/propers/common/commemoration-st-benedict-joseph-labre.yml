# Ant+V/R+collect commemoration bundle. The source has no antiphon or versicle of its own (`vide C5`), so the Common of a Confessor's are used (commemoration-antiphon-common-of-a-confessor.yml and lauds-versicle-common-of-a-confessor.yml), as for every saint of this category with nothing proper. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/04-16-BenedictusJLabre.txt (Semiduplex, nine lessons, vide C5). English is this project's own translation, marked draft.
id: commemoration-st-benedict-joseph-labre
text:
  la: |
      Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
      V. Justum dedúxit Dóminus per vias rectas.
      R. Et osténdit illi regnum Dei.
      Orémus.
      Deus, qui sanctum Benedíctum Joséphum Confessórem tuum humilitátis stúdio et paupertátis amóre tibi uni adhærére fecísti: da nobis ejus suffragántibus méritis; terréna cuncta despícere et cœléstia semper inquírere.
      Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
      V. The Lord guided the just in right paths.
      R. And showed him the kingdom of God.
      Let us pray.
      O God, who didst make thy Confessor Benedict Joseph cleave to thee alone by his zeal for humility and love of poverty: grant us, by his merits and intercession, to despise all earthly things and ever to seek the things of heaven.
      Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
