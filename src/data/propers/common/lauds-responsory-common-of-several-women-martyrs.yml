# Lauds short responsory. Engine render with votive=C7b (Common of Several Women Martyrs), Monastic Tridentinum 1617, command=prayLaudes. Before this file the Common had no Lauds/Vespers bundle and Ss. Perpetua and Felicity fell through to the seasonal chapter, responsory and hymn.
id: lauds-responsory-common-of-several-women-martyrs
text:
  la: |
    R.br. Spécie tua * Et pulchritúdine tua.
    R. Spécie tua * Et pulchritúdine tua.
    V. Inténde, próspere procéde, et regna.
    R. Et pulchritúdine tua.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Spécie tua * Et pulchritúdine tua.
  en: |
    R.br. In thy comeliness * and in thy beauty.
    R. In thy comeliness * and in thy beauty.
    V. Go forward, fare prosperously, and reign.
    R. In thy beauty.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. In thy comeliness * and in thy beauty.
status:
  la: verified
  en: verified
