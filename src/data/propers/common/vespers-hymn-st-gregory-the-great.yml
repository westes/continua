# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2033-03-12 -- "Anglórum jam Apóstolus," own proper hymn
# recounting Gregory sending Augustine of Canterbury to evangelize
# England and the "non Angli sed Angeli" almsgiving legend; no English
# rendering exists in the reference engine at all -- own original
# translation, marked draft. See lauds-capitulum-st-gregory-the-
# great.yml's header.
id: vespers-hymn-st-gregory-the-great
text:
  la: >-
    Anglórum jam Apóstolus,

    Nunc Angelórum sócius,

    Ut tunc, Gregóri, Géntibus,

    Succúrre jam credéntibus.


    Tu largas opum cópias,

    Omnémque mundi glóriam

    Spernis, ut inops ínopem

    Jesum sequáris príncipem.


    Vidétur egens náufragus,

    Dum stipem petit Ángelus:

    Tu munus jam post géminum

    Præbes et vas argénteum.


    Ex hoc te Christus témpore

    Suæ præfert Ecclésiæ:

    Sic Petri gradum pércipis,

    Cujus et normam séqueris.


    O Póntifex egrégie,

    Lux et decus Ecclésiæ,

    Non sinas in perículis,

    Quos tot mandátis ínstruis.


    Sit Patri laus ingénito,

    Sit decus Unigénito,

    Sit utriúsque párili

    Majéstas summa Flámini. Amen.
  en: >-
    Once the English nation's apostle,

    Now companion of the blest;

    As then to nations, Gregory,

    Now come to aid the faith confessed.


    Abundant riches you disdained,

    And all the glory of the world,

    That, poor yourself, you might pursue

    The poor Prince Jesus, banner unfurled.


    A shipwrecked beggar seemed to stand,

    An angel asking alms of thee:

    Twice having given, yet again

    You gave a vessel, silver, free.


    From that hour Christ sets you over

    His own Church, to steer and guide:

    So Peter's rank is yours to hold,

    Whose rule you follow at his side.


    O Bishop excellent and true,

    Light and adornment of the Church,

    Forsake not, in their perils, those

    Whom you instructed in your search.


    To the unbegotten Father praise,

    To the Only-begotten glory be:

    To both alike, in equal state,

    The Spirit's highest majesty. Amen.
status:
  la: verified
  en: draft
