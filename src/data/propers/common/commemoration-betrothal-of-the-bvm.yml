# Ant+V/R+collect commemoration bundle: the feast's own Benedictus antiphon ([Ant 2]) and [Versum 2], then the collect. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/01-23-Desponsatio.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: commemoration-betrothal-of-the-bvm
text:
  la: |
      Ant. Desponsatiónem hodiérnam perpétuæ Vírginis Genitrícis Dei Maríæ solémniter celebrémus, qua celsitúdo throni procéssit, allelúia.
      V. Desponsátio est hódie sanctæ Maríæ Vírginis.
      R. Cujus vita ínclyta cunctas illústrat ecclésias.
      Orémus.
      Famúlis tuis, quǽsumus Dómine, cœlestis grátiæ munus impertire: ut, quibus beátæ Vírginis partus éxstitit salútis exordium, Desponsatiónis ejus votiva solémnitas pacis tríbuat increméntum.
      Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Ant. Let us solemnly celebrate the betrothal of this day of the ever-virgin Mary, Mother of God, whereby the height of the throne went forth, alleluia.
      V. This day is the betrothal of the holy Virgin Mary.
      R. Whose illustrious life lights up all the churches.
      Let us pray.
      Grant to thy servants, we beseech thee, O Lord, the gift of heavenly grace: that to those for whom the childbearing of the blessed Virgin was the beginning of salvation, the votive solemnity of her Betrothal may bring an increase of peace.
      Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
