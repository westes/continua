# Verified against Divinum Officium (Monastic Tridentinum 1617), Terce
# live query, the Nativity of St. John the Baptist's own day (2026-06-24,
# clean year).
id: terce-capitulum-nativity-of-st-john-the-baptist
text:
  la: |
    Audíte, ínsulæ, et atténdite, pópuli de longe: Dóminus ab útero vocávit me, de ventre matris meæ recordátus est nóminis mei.
    R. Deo grátias.
    V. Fuit homo missus a Deo.
    R. Cui nomen erat Joánnes.
  en: |
    Give ear, ye islands, and hearken, ye people from afar. The Lord hath called me from the womb, from the bowels of my mother he hath been mindful of my name.
    R. Thanks be to God.
    V. There was a man sent from God.
    R. Whose name was John.
citation:
  la: "Isa 49:1"
  en: "Isa 49:1"
status:
  la: verified
  en: verified
