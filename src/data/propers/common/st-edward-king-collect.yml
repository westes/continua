id: st-edward-king-collect
text:
  la: |
    Orémus.
    Deus, qui beátum regem Eduárdum Confessórem tuum æternitátis glória
    coronásti: fac nos, quǽsumus; ita eum venerári in terris, ut cum eo
    regnáre possímus in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who hast set upon the head of thy blessed Confessor King
    Edward a crown of everlasting glory, grant unto us, we beseech thee,
    so to use our reverence for him here upon earth, as to make the same
    a mean whereby to come to reign with him hereafter in heaven.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
