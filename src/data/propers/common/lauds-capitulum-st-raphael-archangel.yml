# Sancti/10-24.txt [Capitulum Laudes]. Replaces a copy of St. Michael's Apparition chapter (Apo 1:1-2), which this feast's own file does not use.
id: lauds-capitulum-st-raphael-archangel
text:
  la: "Quando orábas cum lácrimis, et sepeliébas mórtuos, et derelinquébas prándium tuum, et mórtuos abscondébas per diem in domo tua, et nocte sepeliébas eos, ego óbtuli oratiónem tuam Dómino."
  en: "Then thou didst pray with tears, and didst bury the dead, and didst leave thy dinner, and didst hide the dead in thine house through the day, and bury them in the night, I offered up thy prayer before the Lord."
citation:
  la: "Tob 12:12"
  en: "Tob 12:12"
status:
  la: verified
  en: verified
