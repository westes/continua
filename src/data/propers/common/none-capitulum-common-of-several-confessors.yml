# comment documents this Common category as live-verified identical
# for this hour-part; registered under its own id (rather than
# aliased) matching this codebase's standing convention for shared
# Common content (e.g. prime-antiphon-common-of-a-confessor.yml vs.
# prime-antiphon-common-of-an-abbot.yml).
