# Verified against Divinum Officium (Monastic Tridentinum 1617), None
# live query, St. Andrew's own day (2026-11-30, clean year).
id: none-capitulum-st-andrew
text:
  la: |
    Isaías enim dicit: Dómine, quis crédidit audítui nostro? Ergo fides ex audítu, audítus autem per verbum Christi. Sed dico: Numquid non audiérunt? Et quidem in omnem terram exívit sonus eórum, et in fines orbis terræ verba eórum.
    R. Deo grátias.
    V. Nimis honoráti sunt amíci tui, Deus.
    R. Nimis confortátus est principátus eórum.
  en: |
    For Isaias saith: Lord, who hath believed our report? Faith then cometh by hearing; and hearing by the word of Christ. But I say: Have they not heard? Yes, verily, their sound hath gone forth into all the earth, and their words unto the ends of the whole world.
    R. Thanks be to God.
    V. Thy friends, O Lord, are made exceedingly honourable.
    R. Their principality is exceedingly strengthened.
citation:
  la: "Rom 10:16-18"
  en: "Rom 10:16-18"
status:
  la: verified
  en: verified
