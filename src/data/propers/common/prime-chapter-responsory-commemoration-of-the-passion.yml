# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). The short responsory is the standard Prime form (as in prime-chapter-responsory-most-precious-blood.yml) with this feast's own versicle. English is this project's own translation, marked draft.
id: prime-chapter-responsory-commemoration-of-the-passion
text:
  la: |
      R.br. Christe, Fili Dei vivi, * Miserére nobis.
      R. Christe, Fili Dei vivi, * Miserére nobis.
      V. Qui pro nobis pati dignátus es.
      R. Miserére nobis.
      V. Glória Patri, et Fílio, * et Spirítui Sancto.
      R. Christe, Fili Dei vivi, * Miserére nobis.
  en: |
      R.br. Christ, Son of the living God, * have mercy on us.
      R. Christ, Son of the living God, * have mercy on us.
      V. Thou who didst deign to suffer for us.
      R. Have mercy on us.
      V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
      R. Christ, Son of the living God, * have mercy on us.
status:
  la: verified
  en: draft
