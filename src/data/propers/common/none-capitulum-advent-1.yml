text:
  la: |
    Rom 13:13-14 Sicut in die honéste ambulémus, non in comessatiónibus et ebrietátibus, non in cubílibus et impudicítiis, non in contentióne et æmulatióne; sed induímini Dóminum Jesum Christum.
    R. Deo grátias.
    V. Super te, Jerúsalem, oriétur Dóminus.
    R. Et glória ejus in te vidébitur.
  en: |
    Rom 13:13-14 Let us walk honestly, as in the day: not in rioting and drunkenness, not in chambering and impurities, not in contention and envy: But put ye on the Lord Jesus Christ.
    R. Thanks be to God.
    V. The Lord shall arise upon thee, Jerusalem.
    R. And his glory shall be seen upon thee.
