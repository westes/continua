# Sourced from web/www/horas/Latin/Sancti/Bavaria/09-17-Hildegardis.txt's
# own [Ant 2] (Benedictus). Replaces the Monastic stub's "Sponsa Christi *
# Hildegárdis" antiphon, which is no longer used. English is this
# project's own translation, marked draft.
id: benedictus-antiphon-st-hildegard
text:
  la: "O digníssima Christi sponsa! * quam lux prophetíæ illustrávit, zelus apostólicus inflammávit, divíni amóris incéndium consummávit."
  en: "O most worthy spouse of Christ! * whom the light of prophecy illumined, apostolic zeal inflamed, and the fire of divine love perfected."
status:
  la: verified
  en: draft
