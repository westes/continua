# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Robert's own day (2026-04-29). The Benedictus antiphon.
id: benedictus-antiphon-st-robert
text:
  la: "Euge, serve bone et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui, allelúia."
  en: "Well done, thou good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of thy Lord, alleluia."
status:
  la: verified
  en: verified
