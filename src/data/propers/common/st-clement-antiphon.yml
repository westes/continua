# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Clement I's own day (2026-11-23). The Benedictus
# antiphon.
id: st-clement-antiphon
text:
  la: "Cum iter ad mare cepísset, * pópulus voce magna clamábat: Dómine Jesu Christe, salva illum; et Clemens cum lácrimis dicébat: Súscipe, Pater, spíritum meum."
  en: "As he began to move toward the sea * the people cried out with a loud voice: O Lord Jesus Christ, deliver him! And Clement wept, and said: Father, receive my spirit!"
status:
  la: verified
  en: verified
