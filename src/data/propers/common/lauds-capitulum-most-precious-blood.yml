# Sourced from web/www/horas/Latin/Sancti/07-01.txt's own [Capitulum
# Laudes] and English/Sancti/07-01.txt's own translation. Authoring this
# was necessary for the feast's own hymn (lauds-hymn-most-precious-
# blood.yml) to actually be reached at all: hours/resolve-common.ts's
# resolveOfficeBundle is all-or-nothing per id -- an id with no chapter
# of its own falls through its *whole* bundle to the Common's, hymn
# included, so a proper hymn with no matching proper chapter is silently
# unreachable dead content.
id: lauds-capitulum-most-precious-blood
text:
  la: "Christus assístens Póntifex futurórum bonórum, per ámplius et perféctius tabernáculum non manufáctum, id est, non hujus creatiónis: neque per sánguinem hircórum aut vitulórum, sed per próprium sánguinem introívit semel in Sancta, ætérna redemptióne invénta."
  en: "Christ being come an High Priest of good things to come, by a greater and more perfect tabernacle, not made with hands, that is to say, not of this building neither by the blood of goats and calves, but by His Own Blood, He entered in once into the Holy Place, having obtained eternal redemption."
citation:
  la: "Hebr 9:11-12"
  en: "Heb 9:11-12"
status:
  la: verified
  en: verified
