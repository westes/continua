# First Vespers versicle of the Common of a Holy Woman / Widow:
# Latin/Commune/C7.txt [Versum 1] (inherited by C7a) is "Specie tua"; Second
# Vespers [Versum 3] is "Diffusa est gratia" (the default file). Confirmed
# against the local reference engine on St. Martha (2025-07-28 First Vespers
# "Specie tua", 2025-07-29 Second Vespers "Diffusa est"). See hours/
# resolve-common.ts's withVespersVariant.
id: vespers-versicle-common-of-a-widow-first
text:
  la: |
    V. Spécie tua et pulchritúdine tua.
    R. Inténde, próspere procéde, et regna.
  en: |
    V. In thy comeliness and thy beauty.
    R. Go forward, fare prosperously, and reign.
status:
  la: verified
  en: verified
