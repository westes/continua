# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt (Duplex majus, Tuesday after Septuagesima). English is this project's own translation, marked draft.
id: lauds-hymn-prayer-on-the-mount-of-olives
text:
  la: |
      Venit e cœlo mediátor alto,
      Quem sacri dudum cecinore vates:
      Parce mœrori, lacrimisque amaris,
      Fília Sion.

      Áttulit mortem vetus hortus, unde
      Culpa prodivit: novus iste vitam
      Hortus en affert, ubi nocte Jesus
      Pérmanet orans.

      Vindicem placat Genitoris iram:
      Reprimit forti jacienda dextra
      Fulmina: occurrit sceleri expiando
      Sponte Redémptor.

      Sic teret duros láqueos averni,
      Et diu clausam reserabit aulam,
      Nos ad ætérni revocans beáta
      Gaudia regni.

      Laus, honor Patri, genitæque Proli,
      Cui datum nomen super omne nomen,
      Et Paracleto decus atque virtus,
      Omne per ævum.
      Amen.
  en: |
      The Mediator has come from high heaven,
      whom the holy prophets long ago sang:
      spare thy grief and thy bitter tears,
      daughter of Sion.

      The old garden brought death, whence
      guilt came forth: this new garden brings life,
      behold, where by night Jesus
      remains praying.

      He appeases the avenging wrath of the Father:
      with strong right hand he checks the thunderbolts
      about to be hurled: the Redeemer of his own will
      goes to meet the crime to be expiated.

      So shall he crush the hard snares of hell,
      and unlock the court long shut,
      calling us back to the blessed joys
      of the eternal kingdom.

      Praise and honour to the Father and to the begotten Son,
      to whom was given the name above every name,
      and to the Paraclete glory and power,
      through all ages. Amen.
status:
  la: verified
  en: draft
