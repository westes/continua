# Ant+V/R+collect commemoration bundle, same combined-bundle shape as
# st-canute-commemoration.yml. Ant 2/Versum 2 are the standard de-Communi
# pairing for the Common of Several Martyrs (C3a, the non-Pontiff default
# used for this group -- see ss-charles-lwanga-and-companions.yml's own
# header) -- common-of-several-martyrs-commemoration-antiphon.yml /
# lauds-versicle-common-of-several-martyrs.yml, both already verified
# elsewhere (Common text, not proper to this group). Collect's English
# half is this project's own translation (see ss-charles-lwanga-and-
# companions-collect.yml).
id: ss-charles-lwanga-and-companions-commemoration
text:
  la: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Omnípotens et miséricors Deus, qui univérsum mundum lúmine veritátis illústras, et per gloriósos Mártyres Matthíam, Cárolum et Sócios fídei prodígia in Africæ regiónibus renováre dignátus es: largíre supplícibus tuis; ut, ipsis intercedéntibus, in nobis grátiæ tuæ dona custódias, et inter gentes omnes mérito et número pópulus tibi sérviens augeátur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    Almighty and merciful God, who dost enlighten the whole world with the light of truth, and who through thy glorious Martyrs Matthias, Charles, and their Companions didst vouchsafe to renew the wonders of the faith in the lands of Africa: grant to thy suppliants that, by their intercession, thou wouldst preserve in us the gifts of thy grace, and that among all nations the people who serve thee may increase in merit and in number.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: draft
