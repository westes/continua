# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). English is this project's own translation, marked draft.
id: sext-capitulum-five-holy-wounds
text:
  la: |
      Fáciem meam non avérti ab increpántibus et conspuéntibus in me. Dóminus Deus auxiliátor meus, et ídeo non sum confúsus.
      R. Deo grátias.
      V. Disciplína pacis nostræ super eum.
      R. Et livóre ejus sanáti sumus.
  en: |
      I have not turned away my face from them that rebuked me and spit upon me. The Lord God is my helper, therefore am I not confounded.
      R. Thanks be to God.
      V. The chastisement of our peace was upon him.
      R. And by his bruises we are healed.
citation:
  la: "Is 50:6-7"
  en: "Isaiah 50:6-7"
status:
  la: verified
  en: draft
