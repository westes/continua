# Verified against Divinum Officium (Monastic Tridentinum 1617) — Latin
# read from the live prayTertia query's own real-date output (2025-12-02);
# its English side didn't render an Oratio translation (same gap as All
# Saints and St. Damasus this pull), so the English was read directly from
# the raw source file (web/www/horas/English/Sancti/12-02.txt) instead.
id: st-bibiana-collect
text:
  la: |
    Orémus.
    Deus, ómnium largítor bonórum, qui in fámula tua Bibiána cum virginitátis flore martýrii palmam conjunxísti: mentes nostras ejus intercessióne tibi caritáte conjúnge; ut, amótis perículis, prǽmia consequámur ætérna.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O God, the Giver of all good gifts, Who unto the lily of pure maidenhood in the hand of thy servant Bibiana, didst join the palm of a glorious martyrdom, grant us, we beseech thee, at her pleading, that our hearts and minds being joined to thee by thy love, we may escape all dangers which do presently beset us, and finally attain unto thine everlasting joy.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
