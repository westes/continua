# conversion-of-st-paul (saint file = second). First Vespers variant; the default (second Vespers) file is the
# same id without "-first". See hours/resolve-common.ts's withVespersVariant.
id: magnificat-antiphon-conversion-of-st-paul-first
text:
  la: "Vade, Anania, * et quære Saulum: ecce enim orat: quia vas electiónis est mihi, ut portet nomen meum coram géntibus, et régibus, et fíliis Israël."
  en: "Ananias, go thy way * and seek Saul for, behold, he prayeth for he is a chosen vessel unto Me, to bear My name before the Gentiles, and kings, and the children of Israel."
