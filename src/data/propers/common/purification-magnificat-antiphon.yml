# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/02-02.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution.
id: purification-magnificat-antiphon
text:
  la: "Hódie * beáta Virgo María púerum Jesum præsentávit in templo, et Símeon replétus Spíritu Sancto accépit eum in ulnas suas, et benedíxit Deum in ætérnum."
  en: "This day did the Blessed Virgin Mary * present the Child Jesus in the temple; and Simeon, filled with the Holy Ghost, took Him up in his arms, and blessed God for ever and ever."
status:
  la: verified
  en: verified
