# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2035-06-30 (clean year, per commemoration-of-st-paul.yml's
# own comment). Real proper content is narrower than most individually-
# imported saints this session: only the chapter is his own (2 Tim
# 4:7-8, "Bonum certámen certávi" -- St. Paul's own famous "I have
# fought the good fight"); the responsory, hymn, and versicle are all
# byte-identical to Common-of-an-Apostle's own already-authored content
# -- duplicated here rather than left to fall through, since
# resolveOfficeBundle resolves a whole bundle per id, not per part (a
# missing responsory/hymn/versicle under his own id would render blank,
# not fall back to the Common). Same chapter reused for Vespers -- no
# separate vespers-capitulum-<id> file authored, per vespers.ts's
# vespersCapitulumForOverride fallback.
id: lauds-capitulum-commemoration-of-st-paul
text:
  la: "Bonum certámen certávi, cursum consummávi, fidem servávi. In réliquo repósita est mihi coróna justítiæ, quam reddet mihi Dóminus in illa die justus judex."
  en: "I have fought a good fight, I have finished my course, I have kept the faith. Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteous Judge, shall give me at that day."
citation:
  la: "2 Tim 4:7-8"
  en: "2 Tim 4:7-8"
status:
  la: verified
  en: verified
