# St. Benedict (Transitus): proper Matins hymn, "Quidquid antiqui cecinere vates" (SanctiM/03-21.txt [Hymnus Matutinum]).
# Latin and English as rendered by the local reference engine (Monastic
# Tridentinum 1617, command=prayMatutinum, 03-21-2033); before this file the saint
# fell to the Common's Matins hymn. Four misprints in the source were corrected
# (Monàrchæ, péetas, genitáeque, Témpore).
id: matins-hymn-st-benedict
text:
  la: |
    Quidquid antíqui cecinére vates,
    Quidquid ætérne moniménta legis,
    Cóntinet nobis celebránda summi
    Vita Monárchæ.

    Extulit Móysen píetas benígnum,
    Inclitum proles Abraham decórat,
    Isaac sponsæ decus et sevéri
    Jussa paréntis.

    Ipse virtútum cúmulis onústus,
    Célsior nostri Patriárcha cœtus,
    Isaac, Móysen, Abraham sub uno,
    Péctore clausit.

    Ipse, quos mundi rápuit procéllis,
    Hic pius flatu státuat secúndo:
    Pax ubi nullo, requiésque gliscit
    Mixta pavóre.

    Glória Patri, genitǽque Proli,
    Et tibi, compar utriúsque semper
    Spíritus alme, Deus unus,
    omni témpore sæcli.
    Amen.
  en: |
    All that the ancient prophets preached,
    and all that the books of the divine Law tell us
    of holiness, is contained in the life of the great patriarch
    which we are now extolling.

    Moses was celebrated for his meekness;
    Abraham for his being father of all believers;
    Isaac for the beauty of his bride,
    and his obedience to the trying commands of his father.

    The sublime patriarch of our family was richly laden
    with every virtue; and in his
    Single person represented
    Isaac, Moses, and Abraham.

    May he have a loving care of those
    whom he has delivered from this stormy world,
    and lead them with prosperous gales to the port
    where there is no fear that can ruffle peace and repose.

    Glory be to the Father, and to the Son that is begotten of him!
    To thee, also, O Spirit of love,
    coequal with them, one God,
    be glory for endless ages.
    Amen.
status:
  la: verified
  en: verified
