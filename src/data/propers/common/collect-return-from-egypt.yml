# The Holy Family collect (reference Tempora/Epi1-0.txt [Oratio]), used here
# unchanged; English reworded to this project's collect phrasing.
id: collect-return-from-egypt
text:
  la: |
    Orémus.
    Dómine Jesu Christe, qui, Maríæ et Joseph súbditus, domésticam vitam ineffabílibus virtútibus consecrásti: fac nos, utriúsque auxílio, Famíliæ sanctæ tuæ exémplis ínstrui; et consórtium cónsequi sempitérnum.
    Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Let us pray.
    Lord Jesus Christ, who, subject to Mary and Joseph, didst consecrate family life by thy unspeakable virtues: grant that, by the aid of them both, we may be taught by the examples of thy Holy Family, and attain to their everlasting companionship.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

status:
  la: verified
  en: draft
