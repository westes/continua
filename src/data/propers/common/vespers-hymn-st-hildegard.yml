# Sourced from web/www/horas/Latin/Sancti/Bavaria/09-17-Hildegardis.txt's
# own [Hymnus Vespera] ("Salve, nostra tu glória"). No English exists in the
# reference engine for the Bavarian files; translated here directly, marked
# draft.
id: vespers-hymn-st-hildegard
text:
  la: |
    Salve, nostra tu glória.
    Exemplar es quæ virginum!
    Audi benigna supplices
    Tibi canéntes cánticum.

    O virgo, quæ mirábilis
    Vixísti amóris víctima,
    Et nunc beáris fúlgidis
    Cæli recépta sédibus.

    Vitæ per æquor túrbidum
    Tuos cliéntes dírige,
    Nobísque amícum cómpara,
    Cui te revínxit grátia.

    Sicut dolos intérrita
    Vicísti, et artes hóstium,
    Et robur in discrímine
    Sumens, nitébas púlchrior:

    Sic bella nos quot íngruunt
    Da, te favénte, fúndere,
    Virtútis almæ ac sémitam
    Vultu seréno cúrrere.

    Alat repóstam méntibus
    Fidem supérna cáritas;
    Mores adórnet aureos
    Intemeráta cástitas.

    Summo Parénti ac Fílio
    Tibíque, Sancte Spíritus,
    Sit laus, potéstas, glória,
    Per sempitérna sǽcula.
    Amen.
  en: |
    Hail, thou our glory,
    pattern of virgins!
    Graciously hear us, thy suppliants,
    who sing thee this canticle.

    O wondrous virgin, who didst live
    a victim of love,
    and art now blessed with shining splendours,
    received into the seats of heaven.

    Guide thy clients
    over the troubled sea of life,
    and win for us the Friend
    to whom grace hath bound thee.

    As thou didst fearlessly overcome
    the snares and wiles of the enemy,
    and, taking strength in the hour of peril,
    didst shine the fairer:

    So grant us, by thy favour,
    to scatter the wars that beset us,
    and with serene countenance to run
    the path of kindly virtue.

    May heavenly charity nourish
    the faith laid up in our minds;
    may undefiled chastity
    adorn our golden ways.

    To the Father most high and to the Son,
    and to thee, O Holy Spirit,
    be praise, power and glory
    through everlasting ages. Amen.
status:
  la: verified
  en: draft
