# [Oratio] and its English counterpart.
id: collect-st-jane-frances-de-chantal
text:
  la: |
    Orémus.
    Omnípotens et miséricors Deus, qui beátam Joánnam Francíscam, tuo amóre
    succénsam, admirábili spíritus fortitúdine per omnes vitæ sémitas in via
    perfectiónis donásti, quique per illam illustráre Ecclésiam tuam nova prole
    voluísti: ejus méritis et précibus concéde; ut, qui infirmitátis nostræ
    cónscii de tua virtúte confídimus, cæléstis grátiæ auxílio cuncta nobis
    adversántia vincámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Almighty and merciful God, Who didst enkindle the love of thyself in the
    blessed Jeanne Frances, Who didst give unto her the grace to make every
    path of life temporal the straight and narrow way which leadeth unto life
    eternal, and Who wast pleased to use her as a mean whereby to adorn thy
    Church with a new sisterhood, grant unto us for that thine handmaid's sake,
    and at her prayers, that we who know that we have no strength as of
    ourselves to help ourselves, and therefore do put all our trust in thine
    Almighty power, may by the assistance of thy heavenly grace, always
    prevail in all things against whatsoever shall arise to fight against us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
