# Second Vespers Magnificat antiphon (also the default when no `-first`
# variant applies): web/www/horas/Latin/Sancti/10-07.txt's own [Ant 3] and
# its English counterpart. First Vespers' [Ant 1] is
# our-lady-of-the-rosary-magnificat-antiphon-first.yml; see hours/
# resolve-common.ts's withVespersVariant.
id: magnificat-antiphon-our-lady-of-the-rosary
text:
  la: "Beáta Mater * et intácta Virgo, gloriósa Regína mundi, séntiant omnes tuum juvámen, quicúmque célebrant tuam sacratíssimi Rosárii solemnitátem."
  en: "Blessed Mother * and Inviolate Maiden, Glorious Queen of the World, may all that keep the solemn Feast of thy Most Holy Rosary feel the might of thine assistance."
status:
  la: verified
  en: verified
