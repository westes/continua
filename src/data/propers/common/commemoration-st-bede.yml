# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor-doctor (non-Bishop, C5a), same as
# commemoration-st-ephraim-of-syria.yml, not independently live-verified for
# this category, so marked draft. Collect is the saint's own (collect-st-bede.yml).
id: commemoration-st-bede
text:
  la: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui Ecclésiam tuam beáti Bedæ Confessóris tui atque Doctóris eruditióne claríficas: concéde propítius fámulis tuis; ejus semper illustrári sapiéntia et méritis adjuvári.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, who dost enlighten thy Church by the learning of blessed Bede, thy Confessor and Doctor: mercifully grant unto thy servants ever to be enlightened by his wisdom and helped by his merits.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

status:
  la: draft
  en: draft
