# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt (Duplex majus, Tuesday after Septuagesima). English is this project's own translation, marked draft.
id: lauds-capitulum-prayer-on-the-mount-of-olives
text:
  la: "Venit Jesus ad discípulos suos, et invénit eos dormiéntes, et dicit Petro: Sic non potuistis una hora vigiláre mecum? Vigiláte, et orate, ut non intretis in tentatiónem."
  en: "Jesus cometh to his disciples, and findeth them asleep, and saith to Peter: What, could you not watch one hour with me? Watch ye, and pray that ye enter not into temptation."
citation:
  la: "Mt 26:40-41"
  en: "Matthew 26:40-41"
status:
  la: verified
  en: draft
