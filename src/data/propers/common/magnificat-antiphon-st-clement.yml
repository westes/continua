# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/11-23.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution. (This feast's own Benedictus antiphon,
# st-clement-antiphon.yml, already correctly sourced [Ant 2].)
id: magnificat-antiphon-st-clement
text:
  la: "Dedísti, Dómine, * habitáculum Mártyri tuo Cleménti in mari, in modum templi marmórei angélicis mánibus præparátum: iter præbens pópulo terræ, ut enárrent mirabília tua."
  en: "Lord, * Thou hast given unto thy Martyr Clement a tabernacle in the sea, after the fashion of a temple of marble, builded by the hands of Angels. And Thou givest a way thither unto the people on the land, that they may tell of thy marvellous works."
status:
  la: verified
  en: verified
