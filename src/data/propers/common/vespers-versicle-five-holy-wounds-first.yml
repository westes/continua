# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). English is this project's own translation, marked draft.
id: vespers-versicle-five-holy-wounds-first
text:
  la: |
      V. Vidébunt in quem transfixérunt.
      R. Et dolébunt super eum, ut in morte primogéniti.
  en: |
      V. They shall look on him whom they pierced.
      R. And they shall mourn for him, as in the death of the firstborn.
status:
  la: verified
