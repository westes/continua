id: lauds-capitulum-lent-1
text:
  la: "Fratres: Hortámur vos, ne in vácuum grátiam Dei recipiátis. Ait enim: Témpore accépto exaudívi te, et in die salútis adjúvi te."
  en: "Brothers, we exhort you, that you receive not the grace of God in vain. For he saith: In an accepted time have I heard thee; and in the day of salvation have I helped thee."
citation:
  la: "2 Cor 6:1-2"
  en: "2 Cor 6:1-2"
