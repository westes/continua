# New file, 2026-09-15: the Common-category tier of Prime's Lectio
# Brevis override (see hours/resolve-common.ts's getPrimeLectioBrevis) --
# a saint with no proper Lectio Prima of her own, but who belongs to a
# Common category, uses that category's own text rather than falling all
# the way to the generic per-annum default. Sourced directly from
# web/www/horas/Latin/Commune/C11.txt's own [Lectio Prima] tag and its
# English counterpart.
id: prime-lectio-prima-common-of-the-bvm
text:
  la: "In platéis sicut cinnamómum et bálsamum aromatízans odórem dedi: quasi myrrha elécta, dedi suavitátem odóris."
  en: "As a plane tree by the water in the streets, I gave a sweet smell like cinnamon. and aromatical balm: I yielded a sweet odour like the best myrrh."
citation:
  la: "Sir 24:19-20"
  en: "Sir 24:19-20"
status:
  la: verified
  en: verified
