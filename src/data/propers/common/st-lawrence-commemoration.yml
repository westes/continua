# Own proper antiphon (st-lawrence-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-martyr (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-lawrence-collect.yml), unchanged.
id: st-lawrence-commemoration
text:
  la: |
    Ant. In cratícula * te Deum non negávi, et ad ignem applicátus te Christum conféssus sum: probásti cor meum, et visitásti nocte: igne me examinásti, et non est invénta in me iníquitas.
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
    Orémus.
    Da nobis, quǽsumus, omnípotens Deus: vitiórum nostrórum flammas exstínguere; qui beáto Lauréntio tribuísti tormentórum suórum incéndia superáre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Upon the bars I denied thee not, O God. * And when they put me to the fire, I acknowledged thee to be the Lord, O Christ. Thou hast proved mine heart, and visited it by night; Thou hast tried me with fire, and found no wickedness in me.
    V. The righteous shall flourish like the palm tree:
    R. He shall grow up like the cedar of Libanus.
    Let us pray.
    O Almighty God, Who didst give unto Blessed Lawrence power to be more than conqueror in his fiery torment, grant unto us, we beseech thee, the power to quench the flames of our sinful lusts.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
