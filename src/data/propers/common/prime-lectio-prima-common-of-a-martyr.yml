# New file, 2026-10-04: the Common-category tier of Prime's Lectio
# Brevis override (see hours/resolve-common.ts's getPrimeLectioBrevis) --
# a saint with no proper Lectio Prima of her own, but who belongs to a
# Common category, uses that category's own text rather than falling all
# the way to the generic per-annum default. Sourced directly from
# web/www/horas/Latin/Commune/C2.txt's own [Lectio Prima] tag and its
# English counterpart.
id: prime-lectio-prima-common-of-a-martyr
text:
  la: "Justus cor suum trádidit ad vigilándum dilúculo ad Dóminum, qui fecit illum, et in conspéctu Altíssimi deprecábitur."
  en: "He will give his heart to resort early to the Lord that made him, and he will pray in the sight of the most High."
citation:
  la: "Sir 39:6"
  en: "Sir 39:6"
status:
  la: verified
  en: verified
