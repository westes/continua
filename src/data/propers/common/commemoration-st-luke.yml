# Own proper antiphon (st-luke-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-evangelist (Commune/
# C1a.txt inherits its own `[Ant 2]`/`[Versum 2]` unchanged from
# Commune/C1, Common of an Apostle -- no override of its own) -- not yet
# independently live-verified for this specific category, so marked
# `draft` rather than `verified`. Collect is the saint's own real proper
# (st-luke-collect.yml), unchanged.
id: commemoration-st-luke
text:
  la: |
    Ant. Vos qui reliquístis ómnia, et secúti estis me, céntuplum accipiétis, et vitam ætérnam possidébitis.
    V. Annuntiavérunt ópera Dei.
    R. Et facta ejus intellexérunt.
    Orémus.
    Intervéniat pro nobis, quǽsumus, Dómine, sanctus tuus Lucas Evangelísta: qui crucis mortificatiónem júgiter in suo córpore, pro tui nóminis honóre, portávit.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Ye who have left all things, and have followed me, shall receive an hundredfold, and shall possess life everlasting.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
    O Lord, we beseech thee, that Luke, thy holy Evangelist, who for the honor of thy name bore continually in his body the suffering of the cross, may intercede in our behalf.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
