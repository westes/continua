# Sancti/10-24.txt [Capitulum Laudes] (Terce takes Lauds' chapter, None takes Lectio Prima, per the reference engine); versicle pair from Sancti/05-08.txt [Responsory Breve Tertia], which 10-24 inherits ('ex Sancti/05-08').
id: terce-capitulum-st-raphael-archangel
text:
  la: |
    Quando orábas cum lácrimis, et sepeliébas mórtuos, et derelinquébas prándium tuum, et mórtuos abscondébas per diem in domo tua, et nocte sepeliébas eos, ego óbtuli oratiónem tuam Dómino.
    R. Deo grátias.
    V. Stetit Angelus juxta aram templi.
    R. Habens thuríbulum áureum in manu sua.
  en: |
    Then thou didst pray with tears, and didst bury the dead, and didst leave thy dinner, and didst hide the dead in thine house through the day, and bury them in the night, I offered up thy prayer before the Lord.
    R. Thanks be to God.
    V. An Angel stood at the Altar of the Temple.
    R. Having a golden censer in his hand.
citation:
  la: "Tob 12:12"
  en: "Tob 12:12"
