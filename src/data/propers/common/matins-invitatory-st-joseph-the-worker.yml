id: matins-invitatory-st-joseph-the-worker
text:
  la: "Regem regum Dóminum, qui putári dignátus est fabri fílius, * Veníte, adorémus, allelúja."
  en: "The Lord, King of kings, who deigned to be reckoned the son of a workman, * O come let us adore him, alleluia."
