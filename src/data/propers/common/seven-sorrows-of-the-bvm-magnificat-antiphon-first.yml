id: seven-sorrows-of-the-bvm-magnificat-antiphon-first
text:
  la: "Nolíte me consideráre * quod fusca sim, quia decolorávit me sol: fílii matris meæ pugnavérunt contra me."
  en: "Look not upon me * because I am black, because the sun hath tanned me. My mother's children were angry with me."
