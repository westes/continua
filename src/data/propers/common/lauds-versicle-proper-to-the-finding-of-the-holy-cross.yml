# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-05-03 -- own proper versicle, cross-referencing
# Vespers' own responsory text (a real "double responsory" structure
# for this major feast, not a mistake). See lauds-capitulum-finding-of-
# the-holy-cross.yml's header.
id: lauds-versicle-proper-to-the-finding-of-the-holy-cross
text:
  la: |
    V. Adorámus te, Christe, et benedícimus tibi, allelúja.
    R. Quia per Crucem tuam redemísti mundum, allelúja.
  en: |
    V. We adore thee, O Christ, and we bless thee. Alleluia.
    R. Because that through thy Cross Thou hast redeemed the world. Alleluia.
status:
  la: verified
  en: verified
