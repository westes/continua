id: vespers-responsory-transfiguration
text:
  la: |
    R.br. Glória et honóre coronásti eum, Dómine, * Allelúja, allelúja.
    ℟. Glória et honóre coronásti eum, Dómine, * Allelúja, allelúja.
    ℣. Et constituísti eum super ópera mánuum tuárum.
    ℟. Allelúja, allelúja.
    ℣. Glória Patri, et Fílio, * et Spirítui Sancto.
    ℟. Glória et honóre coronásti eum, Dómine, * Allelúja, allelúja.
  en: |
    R.br. Thou hast crowned him with glory and honour, O Lord. * Alleluia, alleluia.
    ℟. Thou hast crowned him with glory and honour, O Lord. * Alleluia, alleluia.
    ℣. And madest him to have dominion over the works of thy hands.
    ℟. Alleluia, alleluia.
    ℣. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    ℟. Thou hast crowned him with glory and honour, O Lord. * Alleluia, alleluia.
status:
