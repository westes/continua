id: sext-capitulum-advent-1
text:
  la: |
    Rom 13:12-13 Nox præcéssit, dies autem appropinquávit. Abiciámus ergo ópera tenebrárum, et induámur arma lucis. Sicut in die honéste ambulémus.
    R. Deo grátias.
    V. Osténde nobis, Dómine, misericórdiam tuam.
    R. Et salutáre tuum da nobis.
  en: |
    Rom 13:12-13 The night is passed, and the day is at hand. Let us therefore cast off the works of darkness, and put on the armour of light. Let us walk honestly, as in the day.
    R. Thanks be to God.
    V. Show us, O Lord, thy mercy.
    R. And grant us thy salvation.
