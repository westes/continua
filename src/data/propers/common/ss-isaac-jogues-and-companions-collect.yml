# Latin from `Sancti/09-26n.txt`'s own [Oratio]; English from
# `Sancti/10-19n.txt`'s own [Oratio] (a slightly fuller/more polished
# translation of the same prayer than 09-26n's English file carries).
# Both real source text, both marked verified.
id: ss-isaac-jogues-and-companions-collect
text:
  la: |
    Orémus.
    Deus, qui primítias fídei in boreálibus Américæ regiónibus sanctórum Mártyrum tuórum
    Isaáci, Joánnis, eorúmque Sociórum prædicatióne et sánguine consecrásti: concéde
    propítius; ut, eórum intercessióne, flórida christiánorum seges ubíque in dies
    augeátur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who, by the preaching and the blood of your holy Martyrs, Isaac, John, and
    their companions, consecrated the first fruits of the faith in the vast areas of
    North America, mercifully grant that, through their intercession, the fruitful
    harvest of Christians may everywhere increase day by day.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
