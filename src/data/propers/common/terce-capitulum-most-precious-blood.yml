# Sancti/07-01.txt [Capitulum Laudes] and [Responsory Breve Tertia].
id: terce-capitulum-most-precious-blood
text:
  la: |
    Fratres: Christus assístens Póntifex futurórum bonórum, per ámplius et perféctius tabernáculum non manufáctum, id est, non hujus creatiónis: neque per sánguinem hircórum aut vitulórum, sed per próprium sánguinem introívit semel in Sancta, ætérna redemptióne invénta.
    R. Deo grátias.
    V. Redemísti nos, Dómine in sánguine tuo.
    R. Ex omni tribu, et lingua, et pópulo, et natióne.
  en: |
    Brethren, Christ being come an High Priest of good things to come, by a greater and more perfect tabernacle, not made with hands, that is to say, not of this building neither by the blood of goats and calves, but by His Own Blood, He entered in once into the Holy Place, having obtained eternal redemption.
    R. Thanks be to God.
    V. Lord, Thou hast redeemed us by thy Blood.
    R. Out of every kindred, and tongue, and people.
citation:
  la: "Heb 9:11-12"
  en: "Heb 9:11-12"
status:
  la: verified
  en: verified
