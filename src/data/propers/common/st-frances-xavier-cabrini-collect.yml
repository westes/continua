# Read directly from `Sancti/11-13n.txt`'s own [Oratio] and
# `English/Sancti/11-13n.txt`'s own translation.
id: st-frances-xavier-cabrini-collect
text:
  la: |
    Orémus.
    Dómine Jesu Christe, qui sanctam Vírginem Francíscam Xavériam, Sacratíssimi Cordis tui
    igne succénsam, per amplíssimas mundi plagas ad ánimas tibi lucrándas deduxísti, et
    per eam novam in Ecclésia tua Vírginum famíliam suscitásti; quǽsumus; ut ipsa
    intercedénte, ejúsdem Cordis tui virtútibus induámur, atque ad ætérnum beatitúdinis
    portum perveníre mereámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia
    sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Lord Jesus Christ, who, to win souls for thyself, led thy holy virgin Frances,
    burning with love for thy most Sacred Heart, on many journeys throughout the world,
    and through her raised up a new family of Virgins within thy Church, grant, we
    beseech thee, that by her intercession we may put on the virtues of that same Heart
    and be found worthy to reach the eternal haven of happiness.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
