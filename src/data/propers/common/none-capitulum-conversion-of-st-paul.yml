id: none-capitulum-conversion-of-st-paul
text:
  la: |
    Saulus autem multo magis convalescébat, et confundébat Judǽos qui habitábant Damásci, affírmans quóniam hic est Christus.
    R. Deo grátias.
    V. Nimis honoráti sunt amíci tui, Deus.
    R. Nimis confortátus est principátus eórum.
  en: |
    But Saul increased much more in strength, and confounded the Jews who dwelt at Damascus, affirming that this is the Christ.
    R. Thanks be to God.
    V. Thy friends, O Lord, are made exceedingly honourable.
    R. Their principality is exceedingly strengthened.
citation:
  la: "Act 9:22"
  en: "Acts 9:22"
