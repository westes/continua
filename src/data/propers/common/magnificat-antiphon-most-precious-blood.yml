# Domini, not a Common substitution.
id: magnificat-antiphon-most-precious-blood
text:
  la: "Habébitis autem * hunc diem in monuméntum: et celebrábitis eum solémnem Dómino in generatiónibus vestris cultu sempitérno."
  en: "This day shall be * unto you for a memorial, and ye shall keep it a Feast to the Lord throughout your generations; ye shall keep it a Feast by an ordinance for ever."
