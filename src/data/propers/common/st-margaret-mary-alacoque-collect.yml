# Read directly from web/www/horas/Latin/Sancti/10-17.txt's own
# [Oratio] and its English counterpart. Doxology "$Qui vivis" spelled
# out per the convention in st-bibiana-collect.yml.
id: st-margaret-mary-alacoque-collect
text:
  la: |
    Orémus.
    Dómine Jesu Christe, qui investigábiles divítias Cordis tui beátæ
    Margarítæ Maríæ Vírgini mirabíliter revelásti; da nobis ejus méritis
    et imitatióne; ut te in ómnibus et super ómnia diligéntes, jugem in
    eódem Corde tuo mansiónem habére mereámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Lord Jesus Christ, who unto the holy virgin Margaret Mary didst in
    wondrous manner reveal the unsearchable riches of thy Heart, grant
    us, by her merits and example, that loving thee in all things and
    above all things, we may obtain an abode in thy Heart for evermore.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
status:
  la: verified
  en: verified
