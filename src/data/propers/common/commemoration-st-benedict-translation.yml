# Antiphon and versicle as St. Benedict's own commemoration bundle
# (commemoration-st-benedict.yml); collect is the Translation's own.
id: commemoration-st-benedict-translation
text:
  la: |
    Ant. Sanctíssime Conféssor Dómini, Monachórum pater et dux, Benedícte, intercéde pro nostra omniúmque salúte.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui beatíssimum Confessórem tuum Benedíctum ómnium justórum spíritu replére dignátus es: † concéde nobis fámulis tuis, ejus Translatiónem celebrántibus; ut, ejúsdem spíritu repléti, quod te donánte promísimus fidéliter adimpleámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Ant. Most holy Confessor of the Lord, father and leader of monks, Benedict, intercede for our salvation and that of all.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, who didst vouchsafe to fill thy most blessed Confessor Benedict with the spirit of all the righteous: grant to us thy servants, who celebrate his Translation, that, filled with the same spirit, we may faithfully accomplish by thy gift what we have promised.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

status:
  la: draft
  en: draft
