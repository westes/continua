# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/03-25.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution.
id: annunciation-magnificat-antiphon
text:
  la: "Gábriel Angelus * locútus est Maríæ dicens: Ave, grátia plena; Dóminus tecum: benedícta tu in muliéribus. (Allelúja.)"
  en: "The Angel Gabriel said unto Mary: Hail, thou that art full of grace, * the Lord is with thee; blessed art thou among women. (Alleluia.)"
status:
  la: verified
  en: verified
