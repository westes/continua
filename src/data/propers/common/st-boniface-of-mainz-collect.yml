id: st-boniface-of-mainz-collect
text:
  la: |
    Orémus.
    Deus, qui multitúdinem populórum, beáti Bonifátii Mártyris tui atque Pontíficis
    zelo, ad agnitiónem tui nóminis vocáre dignátus es: concéde propítius; ut, cujus
    solémnia cólimus, étiam patrocínia sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who, through the zeal of blessed Boniface, thy Martyr and Bishop, graciously
    called a multitude of people to the knowledge of thy Name, mercifully grant that we
    who keep his feast may also enjoy his patronage.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
