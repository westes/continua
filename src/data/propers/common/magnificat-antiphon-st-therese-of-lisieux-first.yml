# First Vespers Magnificat antiphon: web/www/horas/Latin/SanctiM/10-03b.txt's [Ant 1]. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: magnificat-antiphon-st-therese-of-lisieux-first
text:
  la: "Ego Dóminus * sponsábo te mihi in sempitérnum; et sponsábo te mihi in iustítia et iudício, et in misericórdia et miseratiónibus; et sponsábo te mihi in fide."
  en: "I the Lord * will espouse thee to me for ever; and I will espouse thee to me in justice and judgment, and in mercy and in compassion; and I will espouse thee to me in faith."
status:
  la: verified
  en: draft
