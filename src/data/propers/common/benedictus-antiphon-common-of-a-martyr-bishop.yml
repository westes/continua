# Verified against Divinum Officium (Monastic Tridentinum 1617) -- the
# Bishop/non-Bishop distinction in the martyr Common affects only the
# collect, not these Scripture antiphons. Content is identical to
# benedictus-antiphon-common-of-a-martyr.yml (cross-verified St. Anacletus,
# St. Anicetus, St. Simeon, St. Blaise).
id: benedictus-antiphon-common-of-a-martyr-bishop
text:
  la: "Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam."
  en: "He that hateth his life * in this world, shall keep it unto life eternal."
status:
  la: verified
  en: verified
