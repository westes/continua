# Verified against Divinum Officium (Monastic Tridentinum 1617),
# live query (dedication of the basilicas of ss peter and paul, 11-18-2025) -- common-of-a-dedication.
# For the Dedication of a Church (Commune/C8.txt) -- currently only
# one saint on this app's calendar uses it. `SaintRecord.common` calls
# it `common-of-an-apostle` (Peter and Paul's own basilicas), but its
# actual P/T/S/N and Benedictus antiphon draw from the Dedication
# Common instead (about the building, not the apostles) -- confirmed
# live, not assumed from the collect's own `collect-c8`.
id: none-capitulum-common-of-a-dedication
text:
  la: |
    Et abstérget Deus omnem lácrimam ab óculis eórum: et mors ultra non erit, neque luctus, neque clamor, neque dolor erit ultra, quia prima abiérunt. Et dixit qui sedébat in throno: Ecce nova fácio ómnia.
    R. Deo grátias.
    V. Hæc est domus Dómini fírmiter ædificáta.
    R. Bene fundáta est supra firmam petram.
  en: |
    And God shall wipe away all tears from their eyes, and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain; for the former things are passed away. And He That sat upon the throne said: Behold, I make all things new.
    R. Thanks be to God.
    V. This is the house of God, stoutly builded.
    R. Well founded upon a sure rock.
citation:
  la: "Apo 21:4-5"
  en: "Rev 21:4-5"
status:
  la: verified
  en: verified
