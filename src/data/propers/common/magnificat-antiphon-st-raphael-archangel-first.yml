# First Vespers Magnificat antiphon: web/www/horas/Latin/Sancti/10-24.txt's own [Ant 1]
# and its English counterpart. Second Vespers' [Ant 3] is
# st-raphael-archangel-magnificat-antiphon.yml (the default); see hours/resolve-common.ts's
# withVespersVariant.
id: magnificat-antiphon-st-raphael-archangel-first
text:
  la: "Ego sum Ráphaël Angelus, * qui asto ante Dóminum: vos autem benedícite Deum, et narráte ómnia mirabília ejus, allelúja."
  en: "I am the Angel Raphael * who stand before the Lord; but bless ye God, and tell of all His wondrous works, alleluia."
status:
  la: verified
  en: verified
