# Sancti/10-02.txt [Capitulum Sexta] (Terce takes Lauds' chapter, None takes Lectio Prima, per the reference engine); versicle pair from Sancti/05-08.txt [Responsory Breve Sexta], which 10-02 inherits ('ex Sancti/05-08').
id: sext-capitulum-guardian-angels
text:
  la: |
    Nec contemnéndum putes, quia non dimíttet cum peccáveris, et est nomen meum in illo.
    R. Deo grátias.
    V. Ascéndit fumus arómatum in conspéctu Dómini.
    R. De manu Angeli.
  en: |
    Take notice of him, and hear his voice, and do not think him one to be contemned: for he will not forgive when thou hast sinned, and my name is in him.
    R. Thanks be to God.
    V. The smoke of the incense ascended up before the Lord.
    R. Out of the Angel's hand.
citation:
  la: "Exod 23:21"
  en: "Exod 23:21"
status:
  la: verified
  en: verified
