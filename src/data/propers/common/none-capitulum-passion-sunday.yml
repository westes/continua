text:
  la: |
    Heb 9:15 Et ídeo novi testaménti mediátor est: ut, morte intercedénte, in redemptiónem eárum prævaricatiónum, quæ erant sub prióri testaménto, repromissiónem accípiant, qui vocáti sunt ætérnæ hereditátis in Christo Jesu, Dómino nostro.
    R. Deo grátias.
    V. Ne perdas cum ímpiis, Deus, ánimam meam.
    R. Et cum viris sánguinum vitam meam.
  en: |
    Heb 9:15 And therefore he is the mediator of the new testament: that by means of his death, for the redemption of those trangressions, which were under the former testament, they that are called may receive the promise of eternal inheritance.
    R. Thanks be to God.
    V. Take not away my soul, O God, with the wicked.
    R. Nor my life with bloody men.
