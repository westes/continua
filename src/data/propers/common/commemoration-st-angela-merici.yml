# Standard de-Communi commemoration for common-of-a-virgin (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-angela-merici has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-angela-merici-collect.yml), unchanged.
id: commemoration-st-angela-merici
text:
  la: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui novum per beátam Angelam sacrárum Vírginum collégium in Ecclésia tua
    floréscere voluísti: da nobis, ejus intercessióne, angélicis móribus vívere; ut,
    terrénis ómnibus abdicátis, gáudiis pérfrui mereámur ætérnis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Whose will it hath been to use blessed Angela as a means whereby to make a new
    fellowship of virgins to grow and flourish in Thy Church, grant unto us, at her
    prayers, so angelically to live, that we may freely lay aside all earthly things, and
    worthily enter upon the enjoyment of those things which are eternal.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
