# Own proper antiphon (st-gabriel-archangel-antiphon.yml), paired with the standard de-Communi commemoration versicle for common-of-an-angel (inferred from the C4 "structural category" citation in the saint's own file) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (st-gabriel-archangel-collect.yml), unchanged.
id: commemoration-st-gabriel-archangel
text:
  la: |
    Ant. Angelus Gábriel * appáruit Daniéli et dixit illi: Ab exórdio precum tuárum egréssus est sermo; ego autem veni ut indicárem tibi; tu ergo animadvérte sermónem et intéllige visiónem.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui inter céteros Angelos, ad annuntiándum Incarnatiónis tuæ mystérium, Gabriélem
    Archángelum elegísti: concéde propítius; ut qui festum ejus celebrámus in terris,
    ipsíus patrocínium sentiámus in cælis.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Ant. The Angel Gabriel * appeared to Daniel and said: From the beginning of thy prayers the word came forth: and I am come to show it to thee, because thou art a man of desires: therefore do thou mark the word, and understand the vision.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who didst choose the Archangel Gabriel from among all Thine other Angels, and
    send him to herald the mystery of Thine Incarnation, mercifully grant that we who keep
    his feast upon earth may feel his protection in heaven.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world
    without end.
    R. Amen.
status:
  la: draft
  en: draft
