# Standard de-Communi commemoration for common-of-a-confessor-bishop (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-francis-de-sales has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-francis-de-sales-collect.yml), unchanged.
id: st-francis-de-sales-commemoration
text:
  la: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui ad animárum salútem beátum Francíscum Confessórem tuum atque Pontíficem
    ómnibus ómnia factum esse voluísti: concéde propítius; ut caritátis tuæ dulcédine
    perfúsi, ejus dirigéntibus mónitis ac suffragántibus méritis, ætérna gáudia consequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who didst will that thy Blessed Confessor and Bishop Francis should become all
    things to all men, mercifully grant unto us, that we being filled with the sweetness of
    thy heavenly love, may so take to ourselves his admonitions and be succoured by his
    prayers, that in the end we may with him attain unto thine everlasting joy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
