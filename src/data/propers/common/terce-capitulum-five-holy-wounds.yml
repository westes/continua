# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). English is this project's own translation, marked draft.
id: terce-capitulum-five-holy-wounds
text:
  la: |
      Christus vulnerátus est propter iniquitátes nostras, attrítus est propter scélera nostra: cujus livóre sanáti sumus.
      R. Deo grátias.
      V. O vos omnes, qui transitis per viam.
      R. Atténdite, et vidéte dolórem meum.
  en: |
      Christ was wounded for our iniquities, he was bruised for our sins: by his bruises we are healed.
      R. Thanks be to God.
      V. O all ye that pass by the way.
      R. Attend, and see my sorrow.
citation:
  la: "Is 53:5"
  en: "Isaiah 53:5"
status:
  la: verified
  en: draft
