# Engine render (Monastic Tridentinum 1617, command=prayVespera, 2028-12-17); Latin and English both taken from the page.
id: vespers-versicle-advent-3
text:
  la: "V. Roráte, cæli, désuper, et nubes pluant justum.
R. Aperiátur terra, et gérminet Salvatórem."
  en: "V. Drop down dew, ye heavens, from above, and let the clouds rain the Just.
R. Let the earth be opened, and bud forth the Saviour."
