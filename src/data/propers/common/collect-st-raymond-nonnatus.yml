# [Oratio] and its English counterpart.
id: collect-st-raymond-nonnatus
text:
  la: |
    Orémus.
    Deus, qui in liberándis fidélibus tuis ab impiórum captivitáte beátum
    Raymúndum Confessórem tuum mirábilem effecísti: ejus nobis intercessióne
    concéde; ut, a peccatórum vínculis absolúti, quæ tibi sunt plácita, líberis
    méntibus exsequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who didst make thy blessed Confessor Raymond to do a wonderful work
    in delivering thy faithful ones from bondage to the unbelievers, grant unto
    us at his prayers to be delivered from the chains of sin, and with all
    willingness of mind to do those things that are pleasing in thy sight.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
