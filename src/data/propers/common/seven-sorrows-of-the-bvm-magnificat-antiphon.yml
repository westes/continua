# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/09-15.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not the generic
# Common-of-the-BVM fallback text this feast rendered before 2026-09-14
# (found via a "this reads like the ferial antiphon" report: it wasn't
# literally ferial, but it was a needlessly generic Common substitution
# for a feast whose own source file has real Ant 2/Ant 3 content, missed
# during the same-day sweep that first wired this feast's
# `benedictusCommon` fallback without checking for her own proper text
# first).
id: seven-sorrows-of-the-bvm-magnificat-antiphon
text:
  la: "Oppréssit me dolor, * et fácies mea intúmuit a fletu, et pálpebræ meæ caligavérunt."
  en: "Sorrow hath crushed me; * My face is swollen with weeping, and on mine eyelids is the shadow of death."
status:
  la: verified
  en: verified
