# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-02-10, clean year.
id: lauds-responsory-st-scholastica
text:
  la: |
    R.br. Spécie tua * Et pulchritúdine tua.
    R. Spécie tua * Et pulchritúdine tua.
    V. Inténde, próspere procéde, et regna.
    R. Et pulchritúdine tua.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Spécie tua * Et pulchritúdine tua.
  en: |
    R.br. In thy comeliness * and in thy beauty.
    R. In thy comeliness * and in thy beauty.
    V. Go forward, fare prosperously, and reign.
    R. In thy beauty.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. In thy comeliness * and in thy beauty.
