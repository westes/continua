# Sancti/10-02.txt [Capitulum Nona] (Terce takes Lauds' chapter, None takes Lectio Prima, per the reference engine); versicle pair from Sancti/05-08.txt [Responsory Breve Nona], which 10-02 inherits ('ex Sancti/05-08').
id: none-capitulum-guardian-angels
text:
  la: |
    Quod, si audíeris vocem ejus et féceris ómnia quæ loquor, inimícus ero inimícis tuis et afflígam affligéntes te. Præcedétque te Angelus meus.
    R. Deo grátias.
    V. In conspéctu Angelórum psallam tibi, Deus meus.
    R. Adorábo ad templum sanctum tuum, et confitébor nómini tuo.
  en: |
    But if thou wilt hear his voice, and do all that I speak, I will be an enemy to thy enemies, and will afflict them that afflict thee. And my angel shall go before thee.
    R. Thanks be to God.
    V. Before the Angels will I sing praise unto thee, O my God.
    R. I will worship toward thy holy Temple, and praise thy Name.
citation:
  la: "Exod 23:22-23"
  en: "Exod 23:22-23"
status:
  la: verified
  en: verified
