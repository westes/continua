# St. Bernard: proper Vespers hymn, Latin/SanctiM/08-20.txt's [Hymnus Vespera]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
id: vespers-hymn-st-bernard
text:
  la: |
    Jam Regína discúbuit,
    Sedens post Unigénitum:
    Nardus odórem tríbuit,
    Bernárdus tradens spíritum.

    Dulcis Regínæ gústui
    Fructus sui suávitas:
    Dulcis ejus olfáctui
    Nardi Bernárdi sánctitas.

    Veni sponsa de Líbano,
    Coronánda divínitus,
    Ut Bernárdus de clíbano
    Veníret Sancti Spíritus.

    Quæ est ista progrédiens
    Velut auróra rútilans?
    Quis est iste transíliens
    Colles, sanctis conjúbilans?

    Hæc glória terríbilis,
    Sicut castrórum ácies:
    Hic grátia mirábilis,
    Ut Assuéri fácies.

    Ora pro nobis Dóminum,
    Prædúlcis fumi vírgula:
    Inclína Patrem lúminum,
    Pastor, ardens ut fácula.

    Sit Trinitáti glória,
    Per quam triúmphus Vírginis
    Et Bernárdi felícitas
    Manent in cæli cúria.
    Amen.
  en: |
    Now the Queen has reclined,
    sitting after the Only-begotten;
    the spikenard gives forth its fragrance,
    Bernard giving up his spirit.

    Sweet to the taste of the Queen
    is the sweetness of her fruit;
    sweet to her sense of smell
    is the holiness of Bernard's nard.

    Come, bride, from Lebanon,
    to be crowned by God,
    that Bernard might come
    from the furnace of the Holy Spirit.

    Who is she that goes forth
    like the shining dawn?
    Who is he that leaps over the hills,
    rejoicing with the saints?

    This glory is terrible,
    like an army set in array;
    this grace is wonderful,
    like the face of Assuerus.

    Pray for us to the Lord,
    thou sweet column of smoke;
    incline the Father of lights,
    shepherd, burning like a torch.

    Glory be to the Trinity,
    through which the triumph of the Virgin
    and the happiness of Bernard
    abide in the court of heaven.
    Amen.
status:
  la: verified
  en: draft
