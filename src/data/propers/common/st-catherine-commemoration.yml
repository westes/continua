# Own proper antiphon (st-catherine-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-virgin-martyr (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (st-catherine-collect.yml), unchanged.
id: st-catherine-commemoration
text:
  la: |
    Ant. Símile est regnum cælórum hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui dedísti legem Móysi in summitáte montis Sínai, et in eódem loco per sanctos Angelos tuos corpus beátæ Catharínæ Vírginis et Mártyris tuæ mirabíliter collocásti: præsta, quǽsumus; ut, ejus méritis et intercessióne, ad montem, qui Christus est, perveníre valeámus:
    Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The kingdom of heaven is like unto a merchantman seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Who didst give the Law unto Moses upon the top of Mount Sinai, and there didst cause the body of thy blessed Virgin and Martyr Catharine to be marvelously laid by thine holy Angels, grant unto us, we beseech thee, for her sake and at her prayers, that we may finally attain unto that mountain which is Christ.
    Who with thee liveth and reigneth, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
