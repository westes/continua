# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt (Duplex majus, Tuesday after Septuagesima). English is this project's own translation, marked draft.
id: sext-capitulum-prayer-on-the-mount-of-olives
text:
  la: |
      Vigiláte ítaque omni témpore orantes, ut digni habeamini fugere ista ómnia quæ futúra sunt, et stare ante Fílium hóminis.
      R. Deo grátias.
      V. Vigiláte et oráte.
      R. Ut non intrétis in tentatiónem.
  en: |
      Watch ye, therefore, praying at all times, that you may be accounted worthy to escape all these things that are to come, and to stand before the Son of man.
      R. Thanks be to God.
      V. Watch and pray.
      R. That ye enter not into temptation.
citation:
  la: "Luc 21:36"
  en: "Luke 21:36"
status:
  la: verified
  en: draft
