# Duplicated verbatim from lauds-capitulum-apparition-of-st-michael.yml
# (2026-08-26): Guardian Angels' own saint file already documented this
# ("vide C4 (Common of a Confessor Bishop -- structural category only;
# the feast's own content is fully proper throughout)") -- the reference
# source's own Monastic-track file (SanctiM/10-02.txt) confirms this
# directly, cross-referencing "@Sancti/05-08" (St. Michael's Apparition,
# already fully authored in this app) for its chapter/responsory at every
# hour. So this is proper content reused from a real textual inheritance
# in the source, not a Common-category fallback at all -- no `common-of-
# an-angel` category was authored, since the source itself shows no such
# generic category exists for the Office bundle (`[Rank]`'s "vide C4" is
# a Missal/Mass-propers designation, contradicted by the Monastic
# breviary file's own explicit cross-references). Same reasoning applies
# to St. Gabriel/St. Raphael the Archangels, whose own files say "ex
# Sancti/05-08" wholesale.
id: lauds-capitulum-guardian-angels
text:
  la: "Significávit Deus, quæ opórtet fíeri cito, loquens per Angelum suum servo suo Joánni, qui testimónium perhíbuit verbo Dei, et testimónium Jesu Christi, quæcúmque vidit."
  en: "God gave unto Jesus Christ to show unto His servants the things which must shortly come to pass and He sent and signified it by His Angel unto His servant John, who bare witness of the Word of God and of the testimony of Jesus Christ, of all the things which he saw."
citation:
  la: "Apo 1:1-2"
  en: "Rev 1:1-2"
status:
  la: verified
  en: verified
