# Sancti/10-02.txt [Capitulum Laudes]. Replaces a copy of St. Michael's Apparition chapter (Apo 1:1-2), which this feast's own file does not use.
id: lauds-capitulum-guardian-angels
text:
  la: "Ecce ego mittam Angelum meum, qui præcédat te, et custódiat in via, et introdúcat in locum, quem parávi. Obsérva eum et audi vocem ejus."
  en: "Behold I will send my angel, who shall go before thee, and keep thee in thy journey, and bring thee into the place that I have prepared. Take notice of him, and hear his voice."
citation:
  la: "Exod 23:20-21"
  en: "Exod 23:20-21"
status:
  la: verified
  en: verified
