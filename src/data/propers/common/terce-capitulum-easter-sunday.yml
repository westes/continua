id: terce-capitulum-easter-sunday
text:
  la: |
    1 Cor 5:7 Fratres: Expurgáte vetus ferméntum, ut sitis nova conspérsio, sicut estis ázymi. Etenim Pascha nostrum immolátus est Christus.
    R. Deo grátias.
    V. Hæc dies, quam fecit Dominus, allelúia.
    R. Exsultémus et lætémur in ea, allelúia.
  en: |
    1 Cor 5:7 Brothers: Purge out the old leaven, that you may be a new paste, as you are unleavened. For Christ our pasch is sacrificed.
    R. Thanks be to God.
    V. This is the day which the Lord hath made, alleluia.
    R. Let us rejoice and be glad in it, alleluia.
