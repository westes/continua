# Own proper antiphon (ss-seven-founders-of-the-servite-order-antiphon.yml), paired with the standard de-Communi commemoration versicle for common-of-several-confessors (C5c -- inherits C5's own Ant2/Versum2 with no override) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (ss-seven-founders-of-the-servite-order-collect.yml), unchanged.
id: ss-seven-founders-of-the-servite-order-commemoration
text:
  la: |
    Ant. Non recédet * laus tua, Virgo María, de ore hóminum, qui mémores fúerint virtútis Dómini in ætérnum, pro quibus non pepercísti ánimæ tuæ.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Dómine Jesu Christe, qui ad recoléndam memóriam dolórum sanctíssimæ Genetrícis tuæ,
    per septem beátos Patres nova Servórum ejus família Ecclésiam tuam fecundásti: concéde
    propítius; ita nos eórum consociári flétibus, ut perfruámur et gáudiis.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Ant. Thy praises, O Virgin Mary, shall not depart * from the mouths of men which remember the power of God for ever, because thou hast not spared thy life for our afflictions.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    Lord Jesus Christ, who, that thou mightest recall to mind the woes of thy most holy
    Mother, didst through the Seven blessed Fathers make thy Church herself the mother of a
    new household of her servants, grant unto us in mercy that we may so share their tears
    as to share their blessedness also.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world
    without end.
    R. Amen.
status:
  la: draft
  en: draft
