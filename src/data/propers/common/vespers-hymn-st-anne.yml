# St. Anne: proper Vespers hymn, Latin/SanctiM/07-26r.txt's [Hymnus Vespera]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
id: vespers-hymn-st-anne
text:
  la: |
    Omnis sanctórum cóncio
    Matrem colláudet Vírginis,
    De cujus puerpério,
    Salus procéssit hóminis.

    Hæc prolem devotíssime
    Pétiit a Patre lúminum,
    Et méruit digníssime
    Maríam decus vírginum.

    Ex Jóachim, quem hábuit
    Vitæ virum exímiæ,
    Anna Maríam génuit,
    Matrem Regis justítiæ.

    Stirps Jesse clara déluit
    Evæ matris oppróbrium,
    Dum Anna prolem génuit,
    Florem sanctórum ómnium.

    Glória tibi Dómine,
    Qui natus es de Vírgine,
    Cum Patre et Sancto Spíritu
    In sempitérna sǽcula.
    Amen.
  en: |
    Let the whole assembly of the saints
    praise the Mother of the Virgin,
    from whose childbearing
    the salvation of man proceeded.

    She most devoutly asked a child
    of the Father of lights,
    and most worthily merited
    Mary, the glory of virgins.

    Of Joachim, whom she had
    as a husband of exceptional life,
    Anne bore Mary,
    the Mother of the King of justice.

    The famous stock of Jesse washed away
    the reproach of mother Eve,
    when Anne bore a child,
    the flower of all the saints.

    Glory to thee, O Lord,
    who wast born of the Virgin,
    with the Father and the Holy Spirit,
    for everlasting ages.
    Amen.
status:
  la: verified
  en: draft
