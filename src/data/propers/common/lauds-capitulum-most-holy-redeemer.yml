# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). English is the Douay-Rheims text from the project's scripture store.
id: lauds-capitulum-most-holy-redeemer
text:
  la: "Benedíctum nomen tuum Deus patrum nostrórum: qui cum irátus fúeris, misericórdiam fácies, et in témpore tribulatiónis peccáta dimíttis his, qui ínvocant te."
  en: "Blessed is thy name, O God of our fathers: who when thou hast been angry, wilt shew mercy, and in the time of tribulation forgivest the sins of them that call upon thee."
citation:
  la: "Tob 3:13"
  en: "Tobias 3:13"
status:
  la: verified
  en: verified
