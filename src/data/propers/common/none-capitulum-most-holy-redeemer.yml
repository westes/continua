# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). English is the Douay-Rheims text of Apoc 4:11 and 5:9-10 from the project's scripture store, joined as the source's one sentence is. The source cites it "Apoc 4:".
id: none-capitulum-most-holy-redeemer
text:
  la: |
      v. Dignus es Dómine Deus noster, accípere glóriam, et honórem, et virtútem: quóniam occísus es, et redemísti nos Deo in sánguine tuo ex omni tribu, et lingua, et pópulo, et natióne, et fecísti nos Deo nostro regnum.
      R. Deo grátias.
      V. Dómine refúgium factus es nobis.
      R. A generatióne, et progénie.
  en: |
      Thou art worthy, O Lord our God, to receive glory, and honour, and power: because thou wast slain, and hast redeemed us to God in thy blood, out of every tribe, and tongue, and people, and nation: and hast made us to our God a kingdom.
      R. Thanks be to God.
      V. Lord, thou hast been made our refuge.
      R. From generation to generation.
citation:
  la: "Apoc 4:11; 5:9-10"
  en: "Apocalypse 4:11; 5:9-10"
status:
  la: verified
  en: verified
