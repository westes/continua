# Own [Ant 2] and [Versum 2], then the collect. Read from the reference engine: web/www/horas/Latin/Sancti/05-01r.txt (Duplex I classis, a 1955 feast; nine lessons, `proper`), English from the parallel English file.
id: commemoration-st-joseph-the-worker
text:
  la: |
    Ant. Descéndit Jesus * cum María et Joseph, et venit Názareth, et erat súbditus illis, allelúja.
    V. Ora pro nobis, sancte Joseph, allelúja.
    R. Labórum nostrórum protéctor fidélis, allelúja.
    Orémus.
    Rerum cónditor Deus, qui legem labóris humáno géneri statuísti: concéde propítius; ut, sancti Joseph exémplo et patrocínio, ópera perficiámus quæ prǽcipis, et prǽmia consequámur quæ promíttis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Ant. Jesus went down * with Mary and Joseph, and came to Nazareth, and was subject to them, alleluia.
    V. Pray for us, holy Joseph, alleluia.
    R. Faithful protector of our labours, alleluia.
    Let us pray.
    God, Creator of all things, who didst lay on the human race the law of labour: graciously grant; that by following the example of Saint Joseph and under his patronage, we may carry out the work thou dost command, and obtain the reward thou dost promise.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

