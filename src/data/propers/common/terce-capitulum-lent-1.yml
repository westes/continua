id: terce-capitulum-lent-1
text:
  la: |
    2 Cor 6:1-2 Fratres: Hortámur vos, ne in vácuum grátiam Dei recipiátis. Ait enim: Témpore accépto exaudívi te, et in die salútis adjúvi te.
    R. Deo grátias.
    V. Ipse liberávit me de láqueo venántium.
    R. Et a verbo áspero.
  en: |
    2 Cor 6:1-2 Brothers, we exhort you, that you receive not the grace of God in vain. For he saith: In an accepted time have I heard thee; and in the day of salvation have I helped thee.
    R. Thanks be to God.
    V. For he hath delivered me from the snare of the hunters.
    R. And from the sharp word.
