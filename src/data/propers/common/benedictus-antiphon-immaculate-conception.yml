# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, the Immaculate Conception's own day (2026-12-08) -- the
# Benedictus antiphon. Same formula as the Nativity of the BVM's own
# (Sept 8), adapted for the Conception instead of the Birth, confirmed
# independently rather than assumed. Her Lauds psalmody override (see
