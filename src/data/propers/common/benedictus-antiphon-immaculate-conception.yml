id: benedictus-antiphon-immaculate-conception
text:
  la: "Conceptiónem hodiérnam perpétuæ Vírginis Genitrícis Dei Maríæ solémniter celebrémus, qua celsitúdo throni procéssit, allelúja."
  en: "Let us this day keep solemnly the Conception of Mary, Mother but still Maiden, a step toward the loftiness of her throne. Alleluia."
status:
