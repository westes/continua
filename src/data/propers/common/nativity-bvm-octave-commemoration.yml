# Verified against the reference engine (Monastic Tridentinum 1617,
# ../divinum-officium-reference) -- read directly from Sancti/09-08.txt's
# own [Octava] section (Latin/Sancti/09-08.txt:38-48, English/Sancti/
# 09-08.txt:24-33). This is the "Commemoratio Octavæ Nativitatis Beatæ
# Mariæ Virginis" block said on days within the Nativity's own Sept 8-15
# octave where the Nativity itself does not win the day outright. Same
# collect text already used in nativity-bvm-collect.yml/
# nativity-bvm-commemoration.yml (the feast's own [Oratio]); the antiphon
# and V/R here are the octave's own distinct pair, not reused from the
# feast day's own [Ant 1].
id: nativity-bvm-octave-commemoration
text:
  la: |
    Ant. Natívitas tua, * Dei Génetrix Virgo, gáudium annuntiávit univérso mundo: ex te enim ortus est sol justítiæ, Christus Deus noster: qui solvens maledictiónem, dedit benedictiónem; et confúndens mortem, donávit nobis vitam sempitérnam.
    V. Natívitas est hódie sanctæ Maríæ Vírginis.
    R. Cujus vita ínclita cunctas illústrat ecclésias.
    Orémus.
    Fámulis tuis, quǽsumus, Dómine, cæléstis grátiæ munus impertíre: ut, quibus beátæ Vírginis partus éxstitit salútis exórdium; Nativitátis ejus votíva solémnitas pacis tríbuat increméntum.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Thy Birth, * O Virgin Mother of God, was a message of joy to the whole world, for out of thee rose the Sun of righteousness, even Christ our God, Who hath taken away the curse and brought a blessing, confounded death, and given unto us everlasting life.
    V. This day is the Birthday of the holy Virgin Mary.
    R. Whose famous life still sheddeth lustre upon all the Churches.
    Let us pray.
    Grant unto us thy servants, we beseech thee, O Lord, the gift of thy heavenly grace, unto whom Thou didst give the first sight of a Saviour as the offspring of a Blessed Virgin, and grant that this Feast, which they keep in honour of the same Virgin, may avail them unto the increase of peace.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
