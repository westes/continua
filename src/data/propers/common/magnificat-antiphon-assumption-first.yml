id: magnificat-antiphon-assumption-first
text:
  la: "Virgo prudentíssima, * quo progréderis, quasi auróra valde rútilans? Fília Sion, tota formósa et suávis es, pulchra ut luna, elécta ut sol."
  en: "Maiden most wise, whither goest thou up, like the dawn gloriously rising? * O daughter of Zion, thou art all beautiful and pleasant, fair as the moon, clear as the sun."
