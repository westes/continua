id: collect-ss-hippolytus-and-cassian
text:
  la: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut beatórum Mártyrum tuórum Hippólyti et
    Cassiáni veneránda solémnitas, et devotiónem nobis áugeat, et salútem.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant, we beseech Thee, O Almighty God, that the worshipful Feast of Thy
    blessed Martyrs Hippolytus and Cassian may avail us to the increase both of
    godliness toward Thee, and healthfulness to our own souls.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
