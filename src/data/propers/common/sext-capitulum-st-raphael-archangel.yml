# Sancti/10-24.txt [Capitulum Sexta] (Terce takes Lauds' chapter, None takes Lectio Prima, per the reference engine); versicle pair from Sancti/05-08.txt [Responsory Breve Sexta], which 10-24 inherits ('ex Sancti/05-08').
id: sext-capitulum-st-raphael-archangel
text:
  la: |
    Et nunc misit me Dóminus, ut curárem te, et Saram, uxórem fílii tui, a dæmónio liberárem. Ego enim sum Ráphaël Angelus: unus ex septem, qui astámus ante Dóminum.
    R. Deo grátias.
    V. Ascéndit fumus arómatum in conspéctu Dómini.
    R. De manu Angeli.
  en: |
    And now the Lord sent me to heal thee, and to deliver Sara, thy son's wife, from a devil. For I am the Angel Raphael, one of the seven, which stand before the Lord.
    R. Thanks be to God.
    V. The smoke of the incense ascended up before the Lord.
    R. Out of the Angel's hand.
citation:
  la: "Tob 12:14-15"
  en: "Tob 12:14"
