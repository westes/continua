# Own proper antiphon (st-joseph-of-cupertino-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-confessor (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-joseph-of-cupertino-collect.yml), unchanged.
id: st-joseph-of-cupertino-commemoration
text:
  la: |
    Ant. Mortuus sum, * et vita mea est abscóndita cum Christo in Deo.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui ad unigénitum Fílium tuum exaltátum a terra ómnia tráhere
    disposuísti: pérfice propítius; ut, méritis et exémplo seráphici
    Confessóris tui Joséphi, supra terrénas omnes cupiditátes eleváti, ad
    eum perveníre mereámur.
    Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    ℟. Amen.
  en: |
    Ant. I am dead * and my life is hid with Christ in God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, Who art pleased that thine Only-begotten Son being lifted up
    from the earth should draw all things unto Him, be entreated for the
    sake of thy servant Joseph, whom Thou didst make like unto one of the
    Seraphim, and so effectually work in us, that even as he, we also may
    be drawn up above all earthly lusts, and worthily attain unto Him.
    Who livest and reignest with him, in the unity of the Holy Spirit, God,
    world without end.
    ℟. Amen.
status:
  la: draft
  en: draft
