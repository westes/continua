# Read directly from web/www/horas/Latin/Sancti/07-16.txt's own
# untagged [Ant 1] and its English counterpart -- a real, proper
# antiphon of this feast, not a Common substitution. (A separate
# `(rubrica cisterciensis)`-tagged [Ant 1] cross-references
# `@CommuneCist/C11` instead -- ignored per the untagged-block
# convention.)
id: our-lady-of-mount-carmel-antiphon
text:
  la: "Sancta María, succúrre míseris, juva pusillánimes, réfove flébiles, ora pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu: séntiant omnes tuum juvámen, quicúmque célebrant tuam solémnem Commemoratiónem."
  en: "Holy Mary, succor the wretched, help the faint-hearted, comfort the sorrowful, pray for the people, plead for the clergy, make intercession for all women vowed to God: may all who keep this thy solemn Commemoration feel the might of thine assistance."
status:
  la: verified
  en: draft
