# (hours/matins.ts's resolveMatinsInvitatoryText).
id: matins-invitatory-common-of-a-martyr
text:
  la: "Regem Mártyrum Dóminum, * Veníte, adorémus."
  en: "The Lord, the King of Martyrs, * O come, let us worship."
status:
  la: verified
