# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/12-10-Domus.txt (Duplex majus, nine lessons, `ex C11`; the parts it marks `@Commune/C8` are read from Commune/C8.txt, the Common of a Dedication). English is this project's own translation, marked draft.
id: magnificat-antiphon-translation-of-the-holy-house-first
text:
  la: "Sanctificávit Dóminus * tabernáculum suum: quia hæc est domus Dei, in qua invocábitur nomen ejus, de quo scriptum est: Et erit nomen meum ibi, dicit Dóminus."
  en: "The Most High hath hallowed his tabernacle. * For this is the house of God, whereon his name shall be called, whereof it is written: My name shall be there, saith the Lord."
status:
  la: verified
  en: draft
