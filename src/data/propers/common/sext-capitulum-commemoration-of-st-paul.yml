id: sext-capitulum-commemoration-of-st-paul
text:
  la: "Ne magnitúdo revelatiónum extóllat me, datus est mihi stímulus carnis meæ, ángelus sátanæ, qui me colaphízet: propter quod ter Dóminum rogávi ut discéderet a me, et dixit mihi: Súfficit tibi grátia mea."
  en: "Lest I should be exalted above measure through the greatness of the revelations, there was given to me a thorn in the flesh, the messenger of Satan, to buffet me; for this thing, I besought the Lord thrice, that it might depart from me. And the Lord said unto me: Paul, My grace is sufficient for thee."
citation:
  la: "2 Cor 12:7-9"
  en: "2 Cor 12:7-9"
status:
  la: verified
  en: verified
