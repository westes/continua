# Own proper antiphon (st-joachim-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-confessor (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-joachim-collect.yml), unchanged.
id: st-joachim-commemoration
text:
  la: |
    Ant. Laudémus * virum gloriósum in generatióne sua, quia benedictiónem ómnium géntium dedit illi Dóminus, et testaméntum suum confirmávit super caput ejus.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui præ ómnibus Sanctis tuis beátum Jóachim Genetrícis Fílii tui patrem
    esse voluísti: concéde, quǽsumus; ut, cujus festa venerámur, ejus quoque
    perpétuo patrocínia sentiámus.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Let us praise a man * famous in his generation, with whom the Lord didst establish the blessing of all nations, and on whose head He made His covenant to rest.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, Who, out of all thy Saints, didst choose blessed Joachim to be the
    father of the mother of thy Son, mercifully grant that as we hold his
    Festival in honour, we may ever feel his protection.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with
    thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: draft
  en: draft
