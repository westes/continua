# Verified against Divinum Officium (Latin/English Sancti/12-13.txt's own
# [Ant 1] — the Lauds-hour antiphon, not Terce's.
id: st-lucy-antiphon
text:
  la: "In tua patiéntia * possedísti ánimam tuam, Lúcia, sponsa Christi: odísti quæ in mundo sunt, et coruscas cum Angelis: sánguine proprio inimícum vicisti."
  en: "In patience * hast thou possessed thy soul, Lucy, Bride of Christ thou hast hated the things that are in the world, and art glorified among the Angels; thou hast shed thine own blood, and conquered the Adversary."
status:
  la: verified
  en: verified
