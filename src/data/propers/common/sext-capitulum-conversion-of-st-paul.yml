id: sext-capitulum-conversion-of-st-paul
text:
  la: "Surréxit autem Saulus de terra, apertísque óculis nihil vidébat. Ad manus autem illum trahéntes, introduxérunt Damáscum. Et erat ibi tribus diébus non videns, et non manducávit neque bibit. R. Deo grátias. V. Constítues eos príncipes super omnem terram. R. Mémores erunt nóminis tui, Dómine."
  en: "And Saul arose from the ground; and when his eyes were opened, he saw nothing. But they leading him by the hands, brought him to Damascus. And he was there three days, without sight, and he did neither eat nor drink. R. Thanks be to God. V. Thou shalt make them princes over all the earth. R. They shall remember thy name, O Lord."
citation:
  la: "Act 9:8-9"
  en: "Acts 9:8-9"
status:
