# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2026-05-03 -- own proper responsory. See lauds-capitulum-
# proper-to-the-finding-of-the-holy-cross.yml's header. Paschaltide-only
# variant of the base (non-Paschaltide) responsory of the same name: the
# refrain "Allelúja, allelúja" is the live engine's own dynamic Paschaltide
# substitution for "Miserére nostri, qui passus es pro nobis" (see the base
# file's own header for the parallel-formula sourcing) -- used whenever this
# Common's feast actually falls within Paschaltide (Finding of the Holy
# Cross, May 3); reused Common feasts outside Paschaltide (Exaltation of the
# Holy Cross, Sept 14) get the base file instead.
id: vespers-responsory-proper-to-the-finding-of-the-holy-cross-paschaltide
text:
  la: |
    R.br. Adorámus te, Christe, et benedícimus tibi: * Allelúja, allelúja.
    R. Adorámus te, Christe, et benedícimus tibi: * Allelúja, allelúja.
    V. Quia per Crucem tuam redemísti mundum.
    R. Allelúja, allelúja.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Adorámus te, Christe, et benedícimus tibi: * Allelúja, allelúja.
  en: |
    R.br. We adore thee, O Christ, and we bless thee. * Alleluia, alleluia.
    R. We adore thee, O Christ, and we bless thee. * Alleluia, alleluia.
    V. Because that through thy cross thou hast redeemed the world.
    R. Alleluia, alleluia.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. We adore thee, O Christ, and we bless thee. * Alleluia, alleluia.
status:
  la: verified
  en: verified
