id: collect-st-ignatius-of-loyola
text:
  la: |
    Orémus.
    Deus, qui ad majórem tui nóminis glóriam propagándam, novo per beátum
    Ignátium subsídio militántem Ecclésiam roborásti: concéde; ut, ejus auxílio
    et imitatióne certántes in terris, coronári cum ipso mereámur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who, to spread abroad the greater glory of Thy name through St. Ignatius,
    strengthened the Church militant with new power; grant that we, who are
    struggling on earth, may, by his help and after his example, be found worthy to
    be crowned with him in heaven.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
