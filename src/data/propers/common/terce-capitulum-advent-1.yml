id: terce-capitulum-advent-1
text:
  la: |
    Rom 13:11 Fratres: Hora est jam nos de somno súrgere: nunc enim própior est nostra salus, quam cum credídimus.
    R. Deo grátias.
    V. Veni ad liberándum nos, Dómine, Deus virtútum.
    R. Osténde fáciem tuam, et salvi érimus.
  en: |
    Rom 13:11 And that knowing the season; that it is now the hour for us to rise from sleep. For now our salvation is nearer than when we believed.
    R. Thanks be to God.
    V. Come to my rescue, O God, Lord of hosts.
    R. Show us thy face, and we shall be saved.
