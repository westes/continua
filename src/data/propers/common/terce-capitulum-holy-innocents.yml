# Verified against Divinum Officium (Monastic Tridentinum 1617), Terce
# live query, Holy Innocents' own day (2029-12-28, clean year).
id: terce-capitulum-holy-innocents
text:
  la: |
    Vidi supra montem Sion Agnum stantem, et cum eo centum quadragínta quátuor míllia habéntes nomen ejus, et nomen Patris ejus scriptum in fróntibus suis.
    R. Deo grátias.
    V. Lætámini in Dómino, et exsultáte justi.
    R. Et gloriámini omnes recti corde.
  en: |
    Lo, a lamb stood upon mount Sion, and with him an hundred forty-four thousand, having his name, and the name of his Father, written on their foreheads.
    R. Thanks be to God.
    V. Be glad in the Lord, and rejoice, ye just,
    R. And glory, all ye right of heart.
citation:
  la: "Apo 14:1"
  en: "Rev 14:1"
status:
  la: verified
  en: verified
