id: collect-ss-odo-maiolus-odilo-and-hugh-of-cluny
text:
  la: |
    Orémus.
    Deus, qui nos Sanctórum tuórum et solemnitáte lætíficas, et imitatióne súscitas ad proféctum:
    præsta; ut quos venerámur offício, étiam piæ conversatiónis sequámur exémplo.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who dost gladden us by the solemn feast of Thy Saints, and dost rouse us by their
    example unto growth in virtue: grant that we, who venerate them by this office, may also
    follow the example of their holy manner of life.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of
    the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: draft
