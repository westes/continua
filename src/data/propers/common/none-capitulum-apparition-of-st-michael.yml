# Verified against Divinum Officium (Monastic Tridentinum 1617), None
# live query, the Apparition of St. Michael's own day (2026-05-08, clean year).
# English source had an obvious typo ("The was a great war" for "There
# was") -- corrected, marked draft (same policy as the Immaculate
# Conception antiphon's "her Birth" fix -- see TODO.md).
id: none-capitulum-apparition-of-st-michael
text:
  la: |
    Factum est prǽlium magnum in cælo: Míchaël et Angeli ejus præliabántur cum dracóne, et draco pugnábat et ángeli ejus: et non prævaluérunt, neque locus invéntus est eórum ámplius in cælo.
    R. Deo grátias.
    V. In conspéctu Angelórum psallam tibi, Deus meus, allelúia.
    R. Adorábo ad templum sanctum tuum, et confitébor nómini tuo, allelúia.
  en: |
    There was a great war in heaven: Michael and his angels fought against the dragon, and the dragon fought, and his angels; and they prevailed not, neither was their place found any more in heaven.
    R. Thanks be to God.
    V. Before the Angels will I sing praise unto thee, O my God, alleluia.
    R. I will worship toward thy holy Temple, and praise thy Name, alleluia.
citation:
  la: "Apo 12:7-8"
  en: "Rev 12:7-8"
status:
  la: verified
  en: draft
