# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Athanasius's own day (2026-05-02). The Benedictus
# antiphon.
id: benedictus-antiphon-st-athanasius
text:
  la: "Euge, serve bone et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus, allelúja."
  en: "Well done, thou good and faithful servant thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord, alleluia."
status:
  la: verified
  en: verified
