# Verified against Divinum Officium (Latin/English Sancti/06-30.txt's own
# [Ant 1] — the Lauds-hour antiphon, not Terce's, which falls back to a
# generic Common text instead.
id: commemoration-of-st-paul-antiphon
text:
  la: "Sancte Paule Apóstole, * prædicátor veritátis et doctor géntium, intercéde pro nobis ad Deum, qui te elégit."
  en: "O holy Apostle Paul, * preacher of the truth, and teacher of the Gentiles, pray for us to God, Who hath chosen thee."
status:
  la: verified
  en: verified
