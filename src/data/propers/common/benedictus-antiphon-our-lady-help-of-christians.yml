id: benedictus-antiphon-our-lady-help-of-christians
text:
  la: "Ad te, o sancta Dei Génitrix, clamavimus, et per te venit Dómini auxílium nobis."
  en: "To thee, O holy Mother of God, have we cried, and through thee the Lord's help hath come to us."
