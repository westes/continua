# web/www/horas/Latin/Commune/C7b.txt ("Commune plurimarum non Virginum
# Martyrum") -- its own [Oratio] is itself a cross-reference to C6b
# ("Commune plurium Virginum et Martyrum") with "Vírginum et "/"Virgins
# and " removed, computed by hand here. `{N}` (used twice) stands for
# the two saints' own names, substituted by getDayCollect via
# SaintRecord.collectCommon/collectName.
id: collect-c7b
text:
  la: |
    Orémus.
    Da nobis, quǽsumus, Dómine Deus noster, sanctárum Mártyrum tuárum {N} et {N} palmas
    incessábili devotióne venerári: ut quas digna mente non póssumus celebráre, humílibus
    saltem frequentémus obséquiis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant unto us, we beseech thee, O Lord, our God, that we may ever call to mind, with all
    worship and thanksgiving, the victory of thy holy Martyrs {N} and {N}, and although we
    know that our mind cannot comprehend thee who art this day their exceeding great
    reward, give us always the grace humbly to worship thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
