# Own proper antiphon (queenship-of-the-bvm-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (queenship-of-the-bvm-collect.yml), unchanged.
id: queenship-of-the-bvm-commemoration
text:
  la: |
    Ant. Beáta quæ credidísti, * quæ dicta sunt tibi a Dómino: cum Christo regnas in ætérnum. (Allelúja.)
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Concéde nobis, quǽsumus, Dómine: ut, qui solemnitátem beatæ Maríæ Vírginis Regínæ
    nostræ celebrámus; ejus muníti præsídio, pacem in præsénti et glóriam in futúro
    cónsequi mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Blessed thou who didst believe, * what was spoken to thee by the Lord: with Christ thou reignest for ever. (Alleluia.)
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    Grant, O Lord, we beseech Thee, to those who are celebrating this solemnity of the
    Blessed Virgin Mary our Queen: that safe in her protection we may deserve to enjoy
    present peace and future glory.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
