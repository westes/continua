# Sancti/08-06.txt [Capitulum Laudes] and [Responsory Breve Tertia]; the Monastic source's matching versicle (Versum 1 / Nocturn 2 Versum / Nocturn 3 Versum) carries no Alleluia.
id: terce-capitulum-transfiguration
text:
  la: |
    Salvatórem exspectámus Dóminum nostrum Jesum Christum, qui reformábit corpus humilitátis nostræ configurátum córpori claritátis suæ.
    R. Deo grátias.
    V. Gloriósus apparuísti in conspéctu Dómini.
    R. Proptérea decórem índuit te Dóminus.
  en: |
    We look for the Saviour, the Lord Jesus Christ, Who shall change our vile body, that it may be fashioned like unto His glorious Body.
    R. Thanks be to God.
    V. Thou wast manifested in thy glory in the Presence of the Lord.
    R. Wherefore the Lord hath clothed thee with majesty.
citation:
  la: "Phil 3:20-21"
  en: "Phil 3:20-21"
status:
  la: verified
  en: verified
