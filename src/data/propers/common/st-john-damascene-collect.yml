id: st-john-damascene-collect
text:
  la: |
    Orémus.
    Omnípotens sempitérne Deus, qui ad cultum sacrárum imáginum asseréndum, beátum
    Joánnem cælésti doctrína et admirábili spíritus fortitúdine imbuísti: concéde nobis
    ejus intercessióne et exémplo; ut, quorum cólimus imágines, virtútes imitémur et
    patrocínia sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O Almighty and everlasting God, Who didst fill Thy blessed servant John with heavenly
    teaching, and wondrous strength of spirit to maintain the honouring of holy images.
    Grant unto us at his prayers and after his example to take pattern by their holy lives
    whose images we honour, and ever to feel the power of their help.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    ℟. Amen.
