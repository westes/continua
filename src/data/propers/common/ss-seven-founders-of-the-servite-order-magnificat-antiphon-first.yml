# First Vespers Magnificat antiphon: web/www/horas/Latin/Sancti/02-12.txt's own [Ant 1]
# and its English counterpart. Second Vespers' [Ant 3] is
# ss-seven-founders-of-the-servite-order-magnificat-antiphon.yml (the default); see hours/resolve-common.ts's
# withVespersVariant.
id: ss-seven-founders-of-the-servite-order-magnificat-antiphon-first
text:
  la: "Non recédet * laus tua, Virgo María, de ore hóminum, qui mémores fúerint virtútis Dómini in ætérnum, pro quibus non pepercísti ánimæ tuæ."
  en: "Thy praises, O Virgin Mary, shall not depart * from the mouths of men which remember the power of God for ever, because thou hast not spared thy life for our afflictions."
status:
  la: verified
  en: verified
