id: our-lady-of-ransom-collect
text:
  la: |
    Orémus.
    Deus, qui per gloriosíssimam Fílii tui Matrem, ad liberándos Christi
    fidéles a potestáte paganórum nova Ecclésiam tuam prole amplificáre
    dignátus es: præsta, quǽsumus; ut, quam pie venerámur tanti operis
    institutrícem, ejus páriter méritis et intercessióne, a peccátis
    ómnibus et captivitáte dǽmonis liberémur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O God, Who didst use the glorious Mother of thy Son as a mean to
    ransom Christ's faithful people out of the hands of the unbelievers,
    by enriching thy Church with yet another family, grant, we beseech
    thee, that we who reverently honour her as the Foundress of that
    great work, may for her sake and by her prayers, be redeemed from
    all sin and all bondage unto the evil one.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth
    with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
