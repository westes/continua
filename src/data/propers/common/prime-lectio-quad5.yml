id: prime-lectio-quad5
text:
  la: "Fáciem meam non avérti ab increpántibus, et conspuéntibus in me. Dóminus Deus auxiliátor meus, et ídeo non sum confúsus."
  en: "I have not turned away my face from them that rebuked me, and spit upon me. The Lord God is my helper, therefore am I not confounded."
citation:
  la: "Isa 50:6-7"
  en: "Isa 50:6-7"
