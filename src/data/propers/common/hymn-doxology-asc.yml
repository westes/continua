# Verified against Divinum Officium (Latin/English Doxologies.txt, the
# Monastic "T"-suffixed variant). Seasonal doxology for "Iam lucis orto
# sidere" and any other hymn ending "* Deo Patri sit gloria..." — see
# hours/hymn-doxology.ts.
id: hymn-doxology-asc
text:
  la: "Glória tibi Dómine,\nQui scandis super sídera,\nCum Patre, et Sancto Spíritu,\nIn sempitérna sǽcula. Amen."
  en: "All glory, Lord, to Thee we pay,\nAscending o'er the stars to-day;\nAll glory, as is ever meet,\nTo Father and to Paraclete. Amen."
status:
  la: verified
  en: verified
