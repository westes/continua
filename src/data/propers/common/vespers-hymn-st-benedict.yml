# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2033-03-21 -- "Láudibus cives résonent canóris," own
# proper Sapphic hymn recounting his flight to solitude at Subiaco,
# conquering temptation, and destroying the shrine to Apollo/Venus at
# Monte Cassino to found his own monastery there. No English rendering
# exists in the reference engine -- own original translation, marked
# draft. See lauds-capitulum-st-benedict.yml's header.
id: vespers-hymn-st-benedict
text:
  la: >-
    Láudibus cives résonent canóris,

    Templa solémnes moduléntur hymnos:

    Hac die summi Benedíctus arcem

    Scandit olýmpi.


    Ille floréntes peragébat annos,

    Cum puer dulcis pátriæ penátes

    Liquit, et solus látuit silénti

    Cónditus antro.


    Inter urtícas rigidósque sentes

    Vicit altrícem scélerum juvéntam:

    Inde consrípsit documénta vitæ

    Pulchra beátæ.


    Æream turpis Clárii figúram,

    Et nemus stravit Véneri dicátum,

    Atque Baptístæ pósuit sacráto

    Monte sacéllum.


    Jam que felíci résidens olympo,

    Inter ardéntes Séraphim catévas

    Spectat, et dulci réficit cliéntum

    Corda liquóre.


    Glória Patri, Genitǽque Proli

    Et tibi, compar utriúsque semper

    Spíritus alme, Deus unus, omni

    Témpore sæcli. Amen.
  en: >-
    Let the citizens of heaven sound their tuneful praises,

    Let the temples chant their solemn hymns:

    On this day Benedict scales the heights

    Of highest heaven.


    He was passing through his flowering years,

    When as a boy he left the sweet hearth

    Of his homeland, and lay hidden alone,

    Concealed in a silent cave.


    Among nettles and unyielding briars

    He conquered youth, the nurse of every vice:

    From there he set down the beautiful precepts

    Of the blessed life.


    The bronze image of shameful Apollo,

    And the grove given over to Venus, he cast down,

    And on that sacred mountain he raised

    A shrine to the Baptist.


    And now, dwelling on happy Olympus,

    Amid the burning ranks of the Seraphim,

    He watches, and with sweet nectar refreshes

    The hearts of his own.


    Glory to the Father, and to the begotten Son,

    And, ever equal to them both, to you,

    Kindly Spirit, one God, through every

    Age of the world. Amen.
status:
  la: verified
  en: draft
