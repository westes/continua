id: collect-st-john-bosco
text:
  la: |
    Orémus.
    Deus, qui sanctum Joánnem Confessórem tuum adolescéntium patrem et magístrum excitásti,
    ac per eum, auxiliatríce Vírgine María, novas in Ecclésia tua famílias floréscere
    voluísti: concéde, quǽsumus; ut eódem caritátis igne succénsi, ánimas quǽrere, tibíque
    soli servíre valeámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who didst raise up thy blessed Confessor John, to be a father and teacher of
    youth, and didst will that through him, with the help of the Virgin Mary, new families
    should flourish in the Church, grant we pray that enkindled with the same fire of
    charity we may be strong to seek after souls and to serve thee alone.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
