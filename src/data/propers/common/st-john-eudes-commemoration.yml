# Standard de-Communi commemoration for common-of-a-confessor (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-john-eudes has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-john-eudes-collect.yml), unchanged.
id: st-john-eudes-commemoration
text:
  la: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui beátum Joánnem, Confessórem tuum, ad cultum sacrórum Córdium Jesu
    et Maríæ rite promovéndum, mirabíliter inflammásti, et per eum novas in
    Ecclésia tua famílias congregáre voluísti: præsta, quǽsumus; ut, cujus pia
    mérita venerámur, virtútum quoque instruámur exémplis.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, who did wondrously inspire blessed John, thy Confessor, in promoting
    veneration to the sacred hearts of Jesus and Mary, and didst will to found
    through him new religious families in the Church, grant we pray, that we,
    who venerate his holy merits, may be taught also by the example of his
    virtues.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with
    thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
