# Commune/C7a.txt [Capitulum Sexta] (a widow takes C7a; several women martyrs take C7b->C7). Terce takes the Lauds chapter and None takes Lectio Prima per the engine. The V/R pair after the chapter is the responsory breve inherited from Commune/C6. Replaced a copy of the Virgin's chapter (2 Cor 10:17 etc.), which the reference does not use for this Common.
id: sext-capitulum-common-of-a-widow
text:
  la: |
    Manum suam apéruit ínopi, et palmas suas exténdit ad páuperem. Non timébit dómui suæ a frigóribus nivis.
    R. Deo grátias.
    V. Adjuvábit eam Deus vultu suo.
    R. Deus in médio ejus, non commovébitur.
  en: |
    She hath opened her hand to the needy, and stretched out her hands to the poor. She shall not fear for her house in the cold of snow.
    R. Thanks be to God.
    V. God shall help her with His countenance.
    R. God is in the midst of her she shall not be moved.
citation:
  la: "Prov 31:20-21"
  en: "Prov 31:20-21"
status:
  la: verified
  en: verified
