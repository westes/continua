# User decision (2026-08-21): switched from the pre-1950 collect
# ("Famulórum tuórum...", what Monastic Tridentinum 1617 renders for the
# feast itself and the closing octave day) to the post-1950-dogma
# collect below ("Omnípotens sempitérne Deus, qui Immaculátam..."),
# introduced in the 1954 Divino Afflatu revision after Pius XII defined
# the Assumption dogma. Text read directly from the reference engine's
# Sancti/08-15.txt [Oratio] (Latin) and English/Sancti/08-15.txt
# [Oratio] (English) -- this is also what Monastic 1617 itself actually
# renders for the *interior* octave days (Aug 16/18/19/21), just not
# for the feast/closing day, an inconsistency in D.O.'s own data files
# (see TODO.md/memory for the live-verify trace). vu now uses this
# collect uniformly for the feast and the whole octave, matching the
# majority (interior-day) reference-engine behavior rather than the
# feast/closing-day one.
id: assumption-collect
text:
  la: |
    Orémus.
    Omnípotens sempitérne Deus, qui Immaculátam Vírginem Maríam, Fílii tui Genetrícem, córpore et ánima ad cæléstem glóriam assumpsísti: concéde, quǽsumus; ut ad supérna semper inténti, ipsíus glóriæ mereámur esse consórtes.
    Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Almighty everlasting God, who hast taken body and soul into heaven the Immaculate Virgin Mary, Mother of thy Son: grant, we beseech thee, that by steadfastly keeping heaven as our goal we may be counted worthy to join her in glory.
    Through the same Jesus Christ, thy Son, Our Lord, Who liveth and reigneth with thee in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
