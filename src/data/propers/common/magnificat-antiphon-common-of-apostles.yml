# Second Vespers Magnificat antiphon for `common-of-apostles` (plural
# saint-days' variant of Commune Apostolorum, Latin/Commune/C1.txt's own
# [Ant 3]) -- same source text as magnificat-antiphon-common-of-an-
# apostle.yml, registered under its own id per this codebase's standing
# convention for the singular/plural split (see lauds-hymn-common-of-
# apostles.yml vs. lauds-hymn-common-of-an-apostle.yml's own header).
id: magnificat-antiphon-common-of-apostles
text:
  la: "Estóte fortes * in bello, et pugnáte cum antíquo serpénte: et accipiétis regnum ætérnum, allelúja."
  en: "Be valiant * in battle, fight the ancient serpent and accept the eternal kingdom. Alleluia."
status:
  la: verified
  en: verified
