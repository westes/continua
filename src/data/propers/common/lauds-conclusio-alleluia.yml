# Reference engine (horasscripts.pl Benedicamus_Domino): at Lauds and Vespers
# during Easter week, and at Vespers on the Saturday before Septuagesima
# (the farewell to the Alleluia), the dismissal V/R each take ", allelúja,
# allelúja". Otherwise identical to lauds-conclusio.
id: lauds-conclusio-alleluia
text:
  la: |
    V. Dómine, exáudi oratiónem meam.
    R. Et clamor meus ad te véniat.
    V. Benedicámus Dómino, allelúja, allelúja.
    R. Deo grátias, allelúja, allelúja.
    V. Fidélium ánimæ per misericórdiam Dei requiéscant in pace.
    R. Amen.
  en: |
    V. O Lord, hear my prayer.
    R. And let my cry come unto thee.
    V. Let us bless the Lord, alleluia, alleluia.
    R. Thanks be to God, alleluia, alleluia.
    V. May the souls of the faithful, through the mercy of God, rest in peace.
    R. Amen.
status:
  la: verified
  en: verified
