id: vespers-versicle-mediatrix-of-all-graces
text:
  la: |
      V. Ora pro nobis, Mediátrix nostra potentíssima.
      R. Ut digni efficiámur promissiónibus Christi.
  en: |
      V. Pray for us, O our most powerful Mediatrix.
      R. That we may be made worthy of the promises of Christ.
