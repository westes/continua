# Second Vespers Magnificat antiphon for `common-of-a-confessor-not-bishop`
# (Commune Confessoris non Pontificis, Latin/Commune/C5.txt's own [Ant 3]
# -- same Vespers1(Ant1)/Lauds(Ant2)/Vespers2(Ant3) file layout as the
# other Common-category magnificat files; Ant 2 here matches the
# already-authored benedictus-antiphon-common-of-a-confessor-not-
# bishop.yml exactly ("Euge, serve bone..."), so Ant 3 is trustworthy by
# the same read.
id: magnificat-antiphon-common-of-a-confessor-not-bishop
text:
  la: "Hic vir despíciens mundum * et terréna, triúmphans, divítias cælo cóndidit ore, manu."
  en: "Lo, a servant of God * who esteemed but little things earthly. And by word and work laid him up treasure in heaven."
status:
  la: verified
  en: verified
