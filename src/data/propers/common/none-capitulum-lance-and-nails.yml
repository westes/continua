# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
id: none-capitulum-lance-and-nails
text:
  la: |
      Qui peccáta nostra ipse pértulit in córpore suo super lignum, ut peccátis mórtui justítiæ vivámus: cujus livóre sanáti estis.
      R. Deo grátias.
      V. Disciplína pacis nostræ super eum.
      R. Et livóre ejus sanáti sumus.
  en: |
      Who his own self bore our sins in his body upon the tree: that we, being dead to sins, should live to justice: by whose stripes you were healed.
      R. Thanks be to God.
      V. The chastisement of our peace was upon him.
      R. And by his bruises we are healed.
citation:
  la: "1 Petr 2:24"
  en: "1 Peter 2:24"
status:
  la: verified
  en: draft
