id: st-leo-ii-collect
text:
  la: |
    Orémus.
    Deus, qui beátum Leónem Pontíficem sanctórum tuórum méritis coæquásti: concéde
    propítius; ut, qui commemoratiónis ejus festa percólimus, vitæ quoque imitémur
    exémpla.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who didst make the blessed Pope Leo to work deeds worthy of thy Saints,
    mercifully grant that we who do keep glad holiday in his memory, may steadfastly
    follow after the example of his life.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
