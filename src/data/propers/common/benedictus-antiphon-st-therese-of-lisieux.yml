# Lauds' Benedictus antiphon: web/www/horas/Latin/SanctiM/10-03b.txt's [Ant 2]. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: benedictus-antiphon-st-therese-of-lisieux
text:
  la: "Requiem tibi dabit * Dóminus semper, et implébit splendóribus ánimam tuam; et eris quasi hortus irríguus, et sicut fons aquárum, cujus non defícient aquæ."
  en: "The Lord will give thee rest * always, and will fill thy soul with brightness; and thou shalt be like a watered garden, and like a fountain of water whose waters shall not fail."
status:
  la: verified
  en: draft
