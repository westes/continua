# Read from the reference engine: web/www/horas/Latin/SanctiM/07-11M.txt.
# [HymnusM Vespera] (Vespers hymn, "Gemma caelestis pretiosa Regis"). The
# source prints stanza 2 as "parentes.," and "repardare"; only the stray
# full stop was removed. The reference has no English for it, so the English
# is a fresh translation, marked draft.
id: vespers-hymn-st-benedict-translation
text:
  la: |
    Gemma cælestis pretiosa Regis,
    Norma justorum, via monachorum,
    Nos ab immundi, Benedicte, mundi
    Subtrahe cæno.

    Tu solum spernens, cor in astra figens
    Cogis heredes fieri parentes,
    Vas Deo plenum, repardare fractum
    Promeruisti.

    Magnus in parvis eremita membris
    Vincis ætatem, superas laborem,
    Arcta Districtæ rudimenta vitæ
    Fervidus imples.

    Strage saxorum puerum sepultum,
    Mox ut orasti, prece suscitasti:
    Sensus hinc carni, caro sanitati
    Redditur æque.

    Jure sub blandæ specie columbæ
    Nesciam fellis animam sororis
    Summa stellati penetrare cæli
    Culmina cemis.

    Ipse post clarum referens triumphum,
    Celsa devicto petis astra mundo:
    Luce flammantem radiante callem
    Pallia sternunt.

    Gloria Patri, Genitæque Proli,
    Et tibi, compar utriusque semper
    Spiritus alme, Deus unus, omni
    Tempore sæcli.
    Amen.
  en: |
    Precious jewel of the heavenly King,
    rule of the just, way of monks,
    draw us away, Benedict, from the mire
    of the unclean world.

    Spurning the earth, fixing thy heart upon the stars,
    thou dost bring parents to become heirs;
    a vessel full of God, thou didst merit
    to mend what was broken.

    A great hermit in a little frame,
    thou dost conquer age and overcome toil,
    fervently fulfilling the narrow rudiments
    of a strict life.

    The boy buried beneath the fall of stones
    thou didst raise up as soon as thou hadst prayed;
    hence sense is restored to the flesh,
    and to the flesh its health.

    Rightly, under the form of a gentle dove,
    thou beholdest the soul of thy sister, a stranger to gall,
    pierce the highest summits
    of the starry heaven.

    Thyself, after bringing back a glorious triumph,
    having overcome the world, thou seekest the lofty stars:
    cloaks strew the path that blazes
    with radiant light.

    Glory be to the Father, and to the Son,
    and to thee, equal to both for ever,
    kindly Spirit, one God,
    through all ages.
    Amen.
