# Verified against Divinum Officium (Monastic Tridentinum 1617) — read
# directly from the reference engine's own real-date output (2030-02-14, a
# year that date doesn't collide with a Sunday). Same convention as
# data/propers/temporal/*-collect.yml.
id: st-valentine-collect
text:
  la: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, qui beáti Valentíni, Mártyris tui, natalítia cólimus, a cunctis malis imminéntibus, ejus intercessióne, liberémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant, we beseech thee, O Almighty God, that we who keep the birthday of thy blessed Martyr Valentine may be delivered by his prayers from all the ills that hang over us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
