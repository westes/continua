# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2025-11-13 -- byte-identical to Common-of-Several-Martyrs's
# own Lauds responsory. See lauds-capitulum-all-saints-of-the-
# benedictine-order.yml's header.
id: lauds-responsory-all-saints-of-the-benedictine-order
text:
  la: |
    R.br. Lætámini in Dómino, * Et exsultáte justi.
    R. Lætámini in Dómino, * Et exsultáte justi.
    V. Et gloriámini omnes recti corde.
    R. Et exsultáte justi.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Lætámini in Dómino, * Et exsultáte justi.
  en: |
    R.br. Be glad in the Lord, * and rejoice, ye righteous.
    R. Be glad in the Lord, * and rejoice, ye righteous.
    V. And shout for joy, all ye that are upright in heart.
    R. And rejoice, ye righteous.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Be glad in the Lord, * and rejoice, ye righteous.
status:
  la: verified
  en: verified
