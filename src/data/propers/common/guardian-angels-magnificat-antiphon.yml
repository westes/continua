# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/10-02.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast (own First Vespers
# [Ant 1] already covers guardian-angels-antiphon.yml, used for the
# Benedictus), not a Common substitution.
id: guardian-angels-magnificat-antiphon
text:
  la: "Sancti Angeli, * custódes nostri, deféndite nos in prǽlio, ut non pereámus in treméndo judício."
  en: "Holy Angels, * our Keepers, shield us in the battle, that we perish not in the awful judgment."
status:
  la: verified
  en: verified
