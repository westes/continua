text:
  la: |
    R.br. Hoc signum Crucis erit in cælo: * Allelúja, allelúja.
    R. Hoc signum Crucis erit in cælo: * Allelúja, allelúja.
    V. Cum Dóminus ad judicándum vénerit.
    R. Allelúja, allelúja.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Hoc signum Crucis erit in cælo: * Allelúja, allelúja.
  en: |
    R.br. This sign of the Cross shall be in heaven. * Alleluia, alleluia.
    R. This sign of the Cross shall be in heaven. * Alleluia, alleluia.
    V. When the Lord cometh to judgment.
    R. Alleluia, alleluia.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. This sign of the Cross shall be in heaven. * Alleluia, alleluia.
