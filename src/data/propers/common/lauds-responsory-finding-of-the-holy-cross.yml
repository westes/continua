text:
  la: |
    R.br. Hoc signum Crucis erit in cælo: * Allelúja, allelúja.
    ℟. Hoc signum Crucis erit in cælo: * Allelúja, allelúja.
    ℣. Cum Dóminus ad judicándum vénerit.
    ℟. Allelúja, allelúja.
    ℣. Glória Patri, et Fílio, * et Spirítui Sancto.
    ℟. Hoc signum Crucis erit in cælo: * Allelúja, allelúja.
  en: |
    R.br. This sign of the Cross shall be in heaven. * Alleluia, alleluia.
    ℟. This sign of the Cross shall be in heaven. * Alleluia, alleluia.
    ℣. When the Lord cometh to judgment.
    ℟. Alleluia, alleluia.
    ℣. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    ℟. This sign of the Cross shall be in heaven. * Alleluia, alleluia.
