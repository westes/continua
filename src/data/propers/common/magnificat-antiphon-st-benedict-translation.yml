# [Ant 3] (Magnificat at Second Vespers). The reference has no English, so
# the English is a fresh translation, marked draft.
id: magnificat-antiphon-st-benedict-translation
text:
  la: "O cælestis norma vitæ, Doctor et Dux Benedicte, cujus cum Christo spiritus exsultat in cælestibus: gregem, Pastor alme, serva, sancta prece corrobora, via cælos clarescente fac, te duce, penetrare."
  en: "O heavenly rule of life, Doctor and Leader, Benedict, whose spirit exults with Christ in the heavens: keep thy flock, kindly Shepherd, strengthen it by thy holy prayer, and grant that, by the heavens' shining way, we may under thy guidance enter in."
status:
  la: verified
  en: draft
