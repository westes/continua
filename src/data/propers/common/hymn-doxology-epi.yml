# Verified against Divinum Officium (Latin/English Doxologies.txt, the
# Monastic "T"-suffixed variant). Seasonal doxology for "Iam lucis orto
# sidere" and any other hymn ending "* Deo Patri sit gloria..." — see
# hours/hymn-doxology.ts.
id: hymn-doxology-epi
text:
  la: "Glória tibi, Dómine,\nQui apparuísti hódie,\nCum Patre, et Sancto Spíritu,\nIn sempitérna sǽcula. Amen."
  en: "All glory, Lord, to Thee we pay\nFor Thine Epiphany today;\nAll glory, as is ever meet,\nTo Father, and to Paraclete. Amen."
status:
  la: verified
  en: verified
