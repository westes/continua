# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
id: sext-capitulum-commemoration-of-the-passion
text:
  la: |
      Quid sunt plagæ istæ in médio mánuum tuárum? Et dicet: His plagatus sum in domo eórum qui diligebant me.
      R. Deo grátias.
      V. Factus est obédiens usque ad mortem.
      R. Mortem autem crucis.
  en: |
      What are these wounds in the midst of thy hands? And he shall say: With these I was wounded in the house of them that loved me.
      R. Thanks be to God.
      V. He became obedient unto death.
      R. Even to the death of the cross.
citation:
  la: "Zach 13:6"
  en: "Zechariah 13:6"
status:
  la: verified
  en: draft
