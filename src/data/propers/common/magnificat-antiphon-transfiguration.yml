# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/08-06.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this fully proper Festum
# Domini, not a Common substitution.
id: magnificat-antiphon-transfiguration
text:
  la: "Et audiéntes * discípuli cecidérunt in fáciem suam et timuérunt valde: et accéssit Jesus, et tétigit eos dixítque eis: Súrgite et nolíte timére, allelúia."
  en: "And when the disciples heard it, they fell on their face, * and were sore afraid and Jesus came and touched them, and said unto them: Arise, and be not afraid, alleluia."
status:
  la: verified
  en: verified
