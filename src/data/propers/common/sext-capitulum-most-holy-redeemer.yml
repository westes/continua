# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). English is the Douay-Rheims text from the project's scripture store.
id: sext-capitulum-most-holy-redeemer
text:
  la: |
      Ex ipso autem vos estis in Christo Jesu, qui factus est nobis sapiéntia a Deo, et justítia, et sanctificátio, et redémptio.
      R. Deo grátias.
      V. Redemísti nos Dómine in sánguine tuo.
      R. Et fecísti nos Deo nostro regnum.
  en: |
      But of him are you in Christ Jesus, who of God is made unto us wisdom, and justice, and sanctification, and redemption.
      R. Thanks be to God.
      V. Thou hast redeemed us, O Lord, in thy blood.
      R. And hast made us a kingdom to our God.
citation:
  la: "1 Cor 1:30"
  en: "1 Corinthians 1:30"
status:
  la: verified
  en: verified
