# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2029-12-26, clean year. English final stanza corrected
# 2026-09-10: the live query had baked in the Martyr Common's own generic
# English ending ("All praise to God the Father be...") despite the Latin
# already correctly showing the Nat/NatT-swapped text (St. Stephen falls
# within Christmastide's `Doxology=Nat` window) -- a real bilingual
# mismatch, since the Nat swap should apply to both languages. Corrected to
# the same Nat/NatT English used by vespers-hymn-st-stephen-protomartyr.yml
# ("All honour, praise and glory be...").
id: lauds-hymn-st-stephen-protomartyr
text:
  la: |
    Martyr Dei, qui únicum
    Patris sequéndo Fílium,
    Victis triúmphas hóstibus,
    Victor fruens cæléstibus.

    Tui precátus múnere
    Nostrum reátum dílue,
    Arcens mali contágium,
    Vitæ rémovens tǽdium.

    Solúta sunt jam víncula
    Tui sacráti córporis:
    Nos solve vinclis sǽculi,
    Amóre Fílii Dei.

    * Glória tibi, Dómine,
    Qui natus es de Vírgine,
    Cum Patre, et Sancto Spíritu,
    In sempitérna sǽcula. Amen.
  en: |
    Martyr of God, whose strength was steeled
    To follow close God's only Son,
    Well didst thou brave thy battlefield,
    And well thy heavenly bliss was won!

    Now join thy prayers with ours, who pray
    That God may pardon us and bless;
    For prayer keeps evil's plague away,
    And draws from life its weariness.

    Long, long ago, were loosed the chains
    That held thy body once in thrall;
    For us how many a bond remains!
    O love of God release us all.

    * All honour, praise and glory be,
    O Jesu, Virgin-Born, to thee;
    All glory, as is ever meet,
    To Father, and to Paraclete. Amen.
status:
  la: verified
  en: verified
