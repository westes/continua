# Same text as her/his/their Lauds antiphon 2, per the established
# Terce=Lauds-Ant2 minor-hours-borrow-from-Lauds convention.
id: terce-antiphon-st-agatha
text:
  la: "Medicínam carnálem * córpori meo nunquam exhíbui, sed hábeo Dóminum Jesum Christum, qui solo sermóne restáurat univérsa."
  en: "I have used no earthly medicine * for my body, but I have for a Master Christ Jesus, by Whose Word alone all things were made."
status:
  la: verified
  en: verified
