# Ant+V/R+collect commemoration bundle, same shape as
# st-canute-commemoration.yml. Ant 2/Versum 2 are the standard de-Communi
# pairing for the Common of Several Martyrs (C3, their own real common per
# [Rank]/[Rule]) -- common-of-several-martyrs-commemoration-antiphon.yml /
# lauds-versicle-common-of-several-martyrs.yml, both already verified
# elsewhere. This is in fact the real, historical rendering: they always
# ride as the Transfiguration's own commemoration (see
# ss-sixtus-felicissimus-and-agapitus.yml's own header), never the day's
# winner.
id: ss-sixtus-felicissimus-and-agapitus-commemoration
text:
  la: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Deus, qui nos concédis sanctórum Mártyrum tuórum Xysti, Felicíssimi et Agapíti natalítia cólere: da nobis in ætérna beatitúdine de eórum societáte gaudére.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    O God, who dost permit us to keep the birthday of thy holy Martyrs Xystus, Felicissimus, and Agapitus, grant that we may enjoy their fellowship in everlasting happiness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
