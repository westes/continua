# Sourced from web/www/horas/Latin/Sancti/11-01.txt's own [Lectio Prima] and its
# English counterpart.
id: all-saints-lectio-prima
text:
  la: "Benedíctio, et cláritas, et sapiéntia, et gratiárum áctio, honor, virtus, et fortitúdo Deo nostro, in sǽcula sæculórum. Amen."
  en: "Saying: Amen. Benediction, and glory, and wisdom, and thanksgiving, honour, and power, and strength to our God for ever and ever. Amen."
citation:
  la: "Apo 7:12"
  en: "Rev 7:12"
status:
  la: verified
  en: verified
