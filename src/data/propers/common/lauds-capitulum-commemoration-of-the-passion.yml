# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
id: lauds-capitulum-commemoration-of-the-passion
text:
  la: "Fratres: Hoc enim sentite in vobis, quod et in Christo Jesu: qui cum in forma Dei esset, non rapínam arbitrátus est esse se æquálem Deo: sed semetípsum exinanívit, formam servi accípiens, in similitúdinem hóminum factus, et hábitu invéntus ut homo. Humiliávit semetípsum, factus obédiens usque ad mortem, mortem autem crucis."
  en: "Brethren: For let this mind be in you, which was also in Christ Jesus: who, being in the form of God, thought it not robbery to be equal with God: but emptied himself, taking the form of a servant, being made in the likeness of men, and in habit found as a man. He humbled himself, becoming obedient unto death, even to the death of the cross."
citation:
  la: "Philipp 2:5-8"
  en: "Philippians 2:5-8"
status:
  la: verified
  en: draft
