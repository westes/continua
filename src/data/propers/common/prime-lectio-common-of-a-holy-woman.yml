# Corrected 2026-10: the Common of a Holy Woman (not virgin, not martyr) takes
# Prov 31:29-30 -- Commune/C7a.txt's own [Lectio Prima] -- not the Sir 51:13-14
# text previously here (that is Commune/C6, Virgin Martyr's).
id: prime-lectio-common-of-a-holy-woman
text:
  la: "Multæ fíliæ congregavérunt divítias: tu supergréssa es univérsas. Fallax grátia, et vana est pulchritúdo: múlier timens Dóminum, ipsa laudábitur."
  en: "Many daughters have gathered together riches: thou hast surpassed them all. Favour is deceitful, and beauty is vain: the woman that feareth the Lord, she shall be praised."
citation:
  la: "Prov 31:29-30"
  en: "Prov 31:29-30"
status:
  la: verified
  en: verified
