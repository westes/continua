id: st-nicomedes-collect
text:
  la: |
    Orémus.
    Adésto, Dómine, pópulo tuo: ut, beáti Nicomédis Mártyris tui mérita præclára suscípiens, ad
    impetrándam misericórdiam tuam semper ejus patrocíniis adjuvétur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus
    Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Give ear, O Lord, to thy people: that, receiving the glorious merits of blessed Nicomedes thy
    Martyr, they may ever be helped by his patronage to obtain thy mercy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the
    Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
