# Commune/C7b.txt [Capitulum Sexta] (a widow takes C7a; several women martyrs take C7b->C7). Terce takes the Lauds chapter and None takes Lectio Prima per the engine. The V/R pair after the chapter is the responsory breve inherited from Commune/C6. Replaced a copy of the Virgin's chapter (2 Cor 10:17 etc.), which the reference does not use for this Common.
id: sext-capitulum-common-of-several-women-martyrs
text:
  la: |
    Liberásti me secúndum multitúdinem misericórdiæ nóminis tui a rugiéntibus, præparátis ad escam, de mánibus quæréntium ánimam meam, et de multis tribulatiónibus quæ circumdedérunt me.
    R. Deo grátias.
    V. Adjuvábit eam Deus vultu suo.
    R. Deus in médio ejus, non commovébitur.
  en: |
    And thou hast delivered me, according to the multitude of the mercy of thy name, from them that did roar, prepared to devour. Out of the hands of them that sought my life, and from the gates of afflictions, which compassed me about.
    R. Thanks be to God.
    V. God shall help her with His countenance.
    R. God is in the midst of her she shall not be moved.
citation:
  la: "Sir 51:4-5"
  en: "Sir 51:4-5"
status:
  la: verified
  en: verified
