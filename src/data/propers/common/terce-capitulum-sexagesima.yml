# Engine render (Monastic Tridentinum 1617, command=prayTertia, 2028-02-20); Latin and English both taken from the page.
id: terce-capitulum-sexagesima
text:
  la: |
    2 Cor 11:19-20 Fratres: Libénter suffértis insipiéntes, cum sitis ipsi sapiéntes: sustinétis enim si quis vos in servitútem rédigit, si quis dévorat, si quis áccipit, si quis extóllitur, si quis in fáciem vos cædit.
    R. Deo grátias.
    V. Ego dixi: Dómine, miserére mei.
    R. Sana ánimam meam, quia peccávi tibi.
  en: |
    2 Cor 11:19-20 For you gladly suffer the foolish; whereas yourselves are wise. For you suffer if a man bring you into bondage, if a man devour you, if a man take from you, if a man be lifted up, if a man strike you on the face.
    R. Thanks be to God.
    V. I said: O Lord, be thou merciful to me.
    R. Heal my soul, for I have sinned against thee.
