id: most-precious-blood-lectio-prima
text:
  la: "Accípiens Móyses sánguinem vitulórum, et hircórum cum aqua et lana coccínea et hyssópo: ipsum quoque librum, et omnem pópulum aspérsit, dicens: Hic sanguis testaménti, quod mandávit ad vos Deus."
  en: "Moses took the blood of calves and goats, with water, and scarlet wool and hyssop, and sprinkled both the book itself and all the people, saying: This is the blood of the testament, which God hath enjoined unto you."
citation:
  la: "Heb 9:19-20"
  en: "Heb 9:19-20"
status:
  la: verified
  en: verified
