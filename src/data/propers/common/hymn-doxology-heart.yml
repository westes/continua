# Verified against Divinum Officium (Latin/English Doxologies.txt, the
# Monastic "T"-suffixed variant). Seasonal doxology for "Iam lucis orto
# sidere" and any other hymn ending "* Deo Patri sit gloria..." — see
# hours/hymn-doxology.ts.
id: hymn-doxology-heart
text:
  la: "Glória tibi, Dómine,\nQui Corde fundis grátiam,\nCum Patre, et Sancto Spíritu,\nIn sempitérna sǽcula. Amen."
  en: "All honour, praise and glory be,\nSuch grace, O Jesu, from thy Heart;\nAll glory, as is ever meet,\nTo Father, and to Paraclete. Amen."
status:
  la: verified
  en: verified
