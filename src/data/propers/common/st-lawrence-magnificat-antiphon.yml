# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/08-10.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution. (This feast's own Benedictus antiphon,
# st-lawrence-antiphon.yml, already correctly sourced [Ant 2].)
id: st-lawrence-magnificat-antiphon
text:
  la: "Beátus Lauréntius, * dum in cratícula superpósitus urerétur, ad impiíssimum tyránnum dixit: Assátum est jam, versa et mandúca; nam facultátes Ecclésiæ, quas requíris, in cæléstes thesáuros manus páuperum deportavérunt."
  en: "When the blessed Lawrence was lying, stretched upon the bars, and burning, he said * to the iniquitous magistrate: The cooking is done enough now, turn the meat and eat; for the property of the Church, which thou seekest, hath been garnered up in heaven by the hands of the poor."
status:
  la: verified
  en: verified
