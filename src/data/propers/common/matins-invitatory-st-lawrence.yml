id: matins-invitatory-st-lawrence
text:
  la: "Beátus Lauréntius Christi Martyr triúmphat coronátus in cælis: * Veníte, adorémus Dóminum."
  en: "Christ's blessed Martyr Lawrence is crowned and triumphing in heaven. * O come, let us worship the Lord!"
