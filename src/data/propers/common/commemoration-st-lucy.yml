# Own proper antiphon (st-lucy-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-virgin-martyr (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (st-lucy-collect.yml), unchanged.
id: commemoration-st-lucy
text:
  la: |
    Ant. Colúmna es immóbilis, Lúcia, sponsa Christi: quia omnis plebs te exspéctat, ut accípias corónam vitæ, allelúia.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Exáudi nos, Deus, salutáris noster: ut sicut de beátæ Lúciæ Vírginis et Mártyris tuæ festivitáte gaudémus; ita piæ devotiónis erudiámur afféctu.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Thou art become as a pillar that cannot be shaken, Lucy, O Bride of Christ: all the people wait for thee, until thou receive the crown of life, alleluia.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    Graciously hear us, O God of our salvation: that as we rejoice in the festivity of blessed Lucy, thy Virgin and Martyr, we may be instructed in the affections of a loving devotion.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
