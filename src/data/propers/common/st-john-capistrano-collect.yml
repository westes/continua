id: st-john-capistrano-collect
text:
  la: |
    Orémus.
    Deus, qui per beátum Joánnem fidéles tuos in virtúte sanctíssimi nóminis Jesu de
    crucis inimícis triumpháre fecísti: præsta, quǽsumus; ut, spirituálium hóstium, ejus
    intercessióne, superátis insídiis, corónam justítiæ a te accípere mereámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who by Thy blessed servant John didst cause Thy faithful people, through the
    power of the most Holy Name of Jesus, to prevail against the enemies of His Cross,
    grant unto us, we beseech Thee, the help of the prayers of the same Thy servant that
    we may prevail against our ghostly enemies, and may be made worthy to receive from
    Thee a crown of righteousness.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
