# Sancti/03-24.txt [Capitulum Nona] (Terce takes Lauds' chapter, None takes Lectio Prima, per the reference engine); versicle pair from Sancti/05-08.txt [Responsory Breve Nona], which 03-24 inherits ('ex Sancti/05-08').
id: none-capitulum-st-gabriel-archangel
text:
  la: |
    Scito ergo et animadvérte: Ab éxitu sermónis, ut íterum ædificétur Jerúsalem, usque ad Christum ducem, hebdómades septem et hebdómades sexagínta duæ erunt.
    R. Deo grátias.
    V. In conspéctu Angelórum psallam tibi, Deus meus.
    R. Adorábo ad templum sanctum tuum, et confitébor nómini tuo.
  en: |
    Know thou therefore, and take notice: that from the going forth of the word, to build up Jerusalem again, unto Christ the prince, there shall be seven weeks, and sixty-two weeks: and the street shall be built again, and the walls in straitness of times.
    R. Thanks be to God.
    V. Before the Angels will I sing praise unto thee, O my God.
    R. I will worship toward thy holy Temple, and praise thy Name.
citation:
  la: "Dan 9:25"
  en: "Dan 9:25"
status:
  la: verified
  en: verified
