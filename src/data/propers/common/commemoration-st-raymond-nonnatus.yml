# Corrected (2026-08): originally used Commune/C5.txt's own `[Ant 1]`
# ("Similábo eum"), but cross-checking two other already live-verified
# commemorations (st-clare-commemoration.yml, ss-felix-and-adauctus-
# commemoration.yml) shows the real commemoration antiphon is `[Ant 2]`,
# not `[Ant 1]` -- and specifically the Monastic-rubric variant of it
# where one exists (`horas/Latin-gabc/Commune/C5.txt`'s own "(sed rubrica
# monastica)" block: "Serve bone et fidélis... intra in gáudium Dómini Dei
# tui", distinct from the secular "Euge, serve bone... Dómini tui"). Not
# independently live-verified for Raymond/this category specifically --
# marked `draft`, not `verified`, pending that confirmation, per this
# app's own "prefer draft over missing" convention. Collect is his own
# real proper (st-raymond-nonnatus-collect.yml), unchanged and verified.
id: commemoration-st-raymond-nonnatus
text:
  la: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui in liberándis fidélibus tuis ab impiórum captivitáte beátum Raymúndum Confessórem tuum mirábilem effecísti: ejus nobis intercessióne concéde; ut, a peccatórum vínculis absolúti, quæ tibi sunt plácita, líberis méntibus exsequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, Who didst make thy blessed Confessor Raymond to do a wonderful work in delivering thy faithful ones from bondage to the unbelievers, grant unto us at his prayers to be delivered from the chains of sin, and with all willingness of mind to do those things that are pleasing in thy sight.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
