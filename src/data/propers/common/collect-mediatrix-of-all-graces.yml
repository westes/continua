# Collect. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt (Duplex majus, nine lessons, `ex C11`). English is this project's own translation, marked draft.
id: collect-mediatrix-of-all-graces
text:
  la: |
      Orémus.
      Dómine Jesu Christe, noster apud Patrem mediátor, qui beatíssimam Vírginem, Matrem tuam, matrem quoque nostram et apud te mediatrícem constitúere dignátus es: concéde propítius; ut, quisquis ad te benefícia petitúrus accésserit, cuncta se per eam impetrásse lætétur:
      Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Let us pray.
      O Lord Jesus Christ, our mediator with the Father, who hast vouchsafed to appoint the most blessed Virgin, thy Mother, to be our mother also and our mediatrix with thee: mercifully grant that whosoever shall come to thee to ask for benefits may rejoice to have obtained all things through her:
      Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
