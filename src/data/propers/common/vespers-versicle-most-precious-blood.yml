# Sourced from web/www/horas/Latin/Sancti/07-01.txt's own [Versum 1],
# positioned directly after [Hymnus Vespera] -- the Vespers closing
# versicle. Authoring this was necessary once lauds-capitulum-most-
# precious-blood.yml made the feast's own bundle reachable (Vespers falls
# back to Lauds' own capitulum, see vespersCapitulumForOverride in
# hours/vespers.ts): the bundle's versicle slot is unconditionally
# rendered, not gated on missing status, so an unauthored one would
# otherwise render empty.
id: vespers-versicle-most-precious-blood
text:
  la: |
    V. Redemísti nos, Dómine, in sánguine tuo.
    R. Et fecísti nos Deo nostro regnum.
  en: |
    V. Thou hast redeemed us, O Lord, in thy blood.
    R. And hast made us to our God a kingdom.
status:
  la: verified
  en: verified
