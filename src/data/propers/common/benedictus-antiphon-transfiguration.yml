id: benedictus-antiphon-transfiguration
text:
  la: "Christus Jesus, * splendor Patris et figúra substántiæ ejus, portans ómnia verbo virtútis suæ, purgatiónem peccatórum fáciens, in monte excélso gloriósus apparére hódie dignátus est."
  en: "Christ Jesus, being the Brightness * of the Father's glory, and the express Image of His Person, and upholding all things by the word of His power, when He was about purging our sins, was pleased, as on this day, to manifest forth His glory upon an high mountain."
status:
  la: verified
  en: verified
