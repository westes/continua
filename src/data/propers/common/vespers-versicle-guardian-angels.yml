# Divino Afflatu 1954 engine render (2026-10-02, second Vespers; post-1617 feast, no Monastic render exists). Replaces a text that was either the Common BVM's versicle or the Apparition of St. Michael's with its Paschal Alleluia baked in. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: vespers-versicle-guardian-angels
text:
  la: |
    V. In conspéctu Angelórum psallam tibi, Deus meus.
    R. Adorábo ad templum sanctum tuum, et confitébor nómini tuo.
  en: |
    V. Before the Angels will I sing praise unto thee, O my God.
    R. I will worship toward thy holy Temple, and praise thy Name.
status:
  la: verified
  en: verified
