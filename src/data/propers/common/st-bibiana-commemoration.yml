# Standard de-Communi commemoration for common-of-a-virgin-martyr (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-bibiana has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-bibiana-collect.yml), unchanged.
id: st-bibiana-commemoration
text:
  la: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, ómnium largítor bonórum, qui in fámula tua Bibiána cum virginitátis flore martýrii palmam conjunxísti: mentes nostras ejus intercessióne tibi caritáte conjúnge; ut, amótis perículis, prǽmia consequámur ætérna.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, the Giver of all good gifts, Who unto the lily of pure maidenhood in the hand of thy servant Bibiana, didst join the palm of a glorious martyrdom, grant us, we beseech thee, at her pleading, that our hearts and minds being joined to thee by thy love, we may escape all dangers which do presently beset us, and finally attain unto thine everlasting joy.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
