# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/01-23-Desponsatio.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: benedictus-antiphon-betrothal-of-the-bvm
text:
  la: "Desponsatiónem hodiérnam perpétuæ Vírginis Genitrícis Dei Maríæ solémniter celebrémus, qua celsitúdo throni procéssit, allelúja."
  en: "Let us solemnly celebrate the betrothal of this day of the ever-virgin Mary, Mother of God, whereby the height of the throne went forth, alleluia."
status:
  la: verified
  en: draft
