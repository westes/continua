# Same text as her/his/their Lauds antiphon 3, per the established
# Sext=Lauds-Ant3 minor-hours-borrow-from-Lauds convention.
id: sext-antiphon-st-agatha
text:
  la: "Grátias tibi ago, * Dómine Jesu Christe, quia memor es mei, et misísti ad me Apóstolum tuum curáre vúlnera mea."
  en: "O my Lord Jesus Christ, I thank thee, * because Thou hast been mindful of me, and hast sent unto me thine Apostle, to heal my wounds."
status:
  la: verified
  en: verified
