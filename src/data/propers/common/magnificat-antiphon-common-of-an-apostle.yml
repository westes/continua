# Second Vespers Magnificat antiphon for `common-of-an-apostle` (Commune
# Apostolorum, Latin/Commune/C1.txt's own [Ant 3] -- same Vespers1(Ant1)/
# Lauds(Ant2)/Vespers2(Ant3) file layout as the other Common-category
# magnificat files. Ant 2 here ("Vos qui reliquístis...") matches
