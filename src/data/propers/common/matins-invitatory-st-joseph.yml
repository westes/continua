id: matins-invitatory-st-joseph
text:
  la: "Christum Dei Fílium, qui putári dignátus est fílius Joseph, * Veníte adorémus."
  en: "O come, let us worship * Christ the Son of God, Who vouchsafed to be supposed the son of Joseph."
