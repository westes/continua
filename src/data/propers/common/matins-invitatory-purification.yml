id: matins-invitatory-purification
text:
  la: "Ecce venit ad templum sanctum suum Dominátor Dóminus: * Gaude et lætáre, Sion, occúrrens Deo tuo."
  en: "Behold, the Lord the Ruler cometh unto His holy temple; * Rejoice and be glad, O Zion! Go forth to meet thy God!"
