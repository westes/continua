# web/www/horas/Latin/Sancti/10-07.txt's own [Lectio Prima] (Sir 24:17-18)
# and its English counterpart.
id: prime-lectio-our-lady-of-the-rosary
text:
  la: "Quasi cedrus exaltáta sum in Líbano, et quasi cypréssus in monte Sion: quasi palma exaltáta sum in Cades, et quasi plantátio rosæ in Jéricho."
  en: "I was exalted like a cedar in Libanus, and as a cypress tree on mount Sion. I was exalted like a palm tree in Cades, and as a rose plant in Jericho."
citation:
  la: "Sir 24:17-18"
  en: "Sir 24:17-18"
status:
  la: verified
  en: verified
