id: sext-capitulum-st-scholastica
text:
  la: "Una est colúmba mea, perfécta mea: vidérunt eam fíliæ Sion, et beatíssimam prædicavérunt et regínæ laudavérunt eam. R. Deo grátias. V. Adjuvábit eam Deus vultu suo. R. Deus in médio ejus, non commovébitur."
  en: "My dove is one, my perfect one is but one: the daughters of Sion saw her, and declared her most blessed, and the queens praised her. R. Thanks be to God. V. God shall help her with His countenance. R. God is in the midst of her, she shall not be moved."
citation:
