# First Vespers hymn: web/www/horas/Latin/SanctiM/07-11b.txt's own [Hymnus1
# Vespera] ("Claris conjúbila Gállia"), the Translation's own hymn for its
# first evening. Second Vespers' [HymnusM Vespera] ("Gemma cælestis") is
# vespers-hymn-st-benedict-translation.yml (the default); see
# hours/resolve-common.ts's withVespersVariant. The reference has no English
# for it, so the English is a fresh translation, marked draft.
id: vespers-hymn-st-benedict-translation-first
text:
  la: |
    Claris conjúbila Gállia láudibus,
    Lætéris Benedicti patris óssibus:
    Felix, quæ grémio cóndita próprio
    Servas membra celébria.

    Miris Itália fúlserat áctibus;
    Gallos irrádiat córpore mórtuus;
    Signis ad túmulum crébrius émicat,
    Illústrans pátriam novam.

    Hinc vatum véterum facta resúscitat,
    Morti quod líbuit mórtuus ímperat,
    Extínctum própris óssibus éxcitat:
    O quam mira poténtia!

    Jam cælo résidens, o Pater óptime,
    Divínis fámulos ímbue régulis,
    Angústum per iter scándere lárgiens,
    Dona regna perénnia.

    Cunctórum dóminans Omnipoténtia,
    Tu, qui sede poli cónspicis ómnia,
    Psalléntum plácide súscipe cántica,
    Votis, voce precántia.
    Amen.
  en: |
    Rejoice, France, in resounding praises,
    be glad in the bones of Benedict thy father:
    happy thou, who keepest in thine own bosom
    his hallowed remains laid to rest.

    Italy had shone with his wondrous deeds;
    in death he sheds light upon the Gauls by his body;
    at his tomb he gleams ever more often with signs,
    making bright his newfound country.

    Hence he raises again the deeds of the ancient prophets:
    what he was pleased to command in life, he commands in death,
    and by his own bones he stirs the dead to life:
    O how marvellous is his power!

    Now dwelling in heaven, O best of Fathers,
    fill thy servants with the divine Rules,
    granting them to climb the narrow way,
    and to gain the everlasting kingdom.

    Ruling over all things, Almighty,
    who from thy throne on high beholdest all,
    graciously receive the songs of those who sing,
    who pray with their vows and with their voice.
    Amen.
status:
  la: verified
  en: draft
