id: lauds-responsory-commemoration-of-st-paul
text:
  la: |
    R.br. In omnem terram * Exívit sonus eórum.
    R. In omnem terram * Exívit sonus eórum.
    V. Et in fines orbis terræ verba eórum.
    R. Exívit sonus eórum.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. In omnem terram * Exívit sonus eórum.
  en: |
    R.br. Their sound hath gone * forth into all the earth.
    R. Their sound hath gone * forth into all the earth.
    V. And their words unto the ends of the world.
    R. Forth into all the earth.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Their sound hath gone * forth into all the earth.
