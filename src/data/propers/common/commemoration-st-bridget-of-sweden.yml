# Standard de-Communi commemoration for common-of-a-widow (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-bridget-of-sweden has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-bridget-of-sweden-collect.yml), unchanged.
id: commemoration-st-bridget-of-sweden
text:
  la: |
    Ant. Date ei de frúctu mánuum suárum, et laudent eam in portis ópera ejus.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Dómine, Deus noster, qui beátæ Birgíttæ per Fílium tuum unigénitum
    secréta cæléstia revelásti: ipsíus pia intercessióne da nobis fámulis
    tuis; in revelatióne sempitérnæ glóriæ tuæ gaudére lætántes.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Give her of the fruit of her hands, and let her own works praise her in the gates.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O Lord our God, Who, through thine Only-begotten Son, didst cause thy
    blessed hand-maid Bridget to see certain things which are naturally
    known not on earth but in heaven, grant unto us thy servants at her
    motherly prayers, to be one day blessed for ever in the vision of
    thine eternal glory.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth
    with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
