# Matins hymn: the reference engine's Commune/C8 [HymnusM Matutinum] is '@Commune/C8:HymnusM Vespera', i.e. the Vespers hymn verbatim. Copy of vespers-hymn-common-of-a-dedication.yml.
# Vespers hymn. Engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-11-09, the Dedication of the Basilica of the Most Holy Savior; the Nov 18 Dedication of the Basilicas of Ss. Peter and Paul, also ex C8, takes the same Common). Before this file the Common of a Dedication had no Lauds/Vespers bundle and both feasts fell through to the ferial chapter, responsory and hymn.
id: matins-hymn-common-of-a-dedication
text:
  la: |
    Urbs beáta Jerúsalem,
    Dicta pacis vísio,
    Quæ constrúitur in cælis
    Vivis ex lapídibus,
    Et Ángelis coronáta
    Ut sponsáta cómite.

    Nova véniens e cælo,
    Nuptiáli thálamo
    Præparáta, ut sponsáta
    Copulétur Dómino:
    Platéæ et muri ejus
    Ex auro puríssimo.

    Portæ nitent margarítis
    Ádytis paténtibus,
    Et virtúte meritórum
    Illuc introdúcitur
    Omnis qui ob Christi nomen
    Hic in mundo prémitur.

    Tunsiónibus, pressúris
    Expolíti lápides,
    Suis coaptántur locis
    Per manus artíficis,
    Disponúntur permansúri
    Sacris ædifíciis.

    Glória et honor Deo
    Usquequáque altíssimo,
    Una Patri, Filióque,
    Inclyto Paráclito,
    Cui laus est et potéstas
    Per ætérna sǽcula.
    Amen.
  en: |
    Blessed city, heavenly Salem,
    Vision dear of peace and love,
    Who of living stones art builded
    In the height of heaven above,
    And, with angel hosts encircled,
    As a bride dost earthward move;

    From celestial realms descending,
    Bridal glory round thee shed,
    Meet for him whose love espoused thee,
    To thy Lord shalt thou be led;
    All thy streets and all thy bulwarks
    Of pure gold are fashioned.

    Bright thy gates of pearl are shining;
    They are open evermore;
    And by virtue of his merits
    Thither faithful souls do soar,
    Who for Christ's dear Name in this world
    Pain and tribulation bore.

    Many a blow and biting sculpture
    Polished well those stones elect,
    In their places now compacted
    By the heavenly Architect,
    Who therewith hath willed for ever
    That his palace should be decked.

    Laud and honor to the Father,
    Laud and honor to the Son,
    Laud and honor to the Spirit,
    Ever Three, and ever One,
    Consubstantial, co-eternal,
    While unending ages run.
    Amen.
