# Lauds' Benedictus antiphon, read from web/www/horas/Latin/Sancti/
# 02-02.txt's own [Ant 2] and its English counterpart -- corrected
# 2026-09-14: this file previously held [Ant 1] (this feast's own First
# Vespers Magnificat antiphon, "Senex Púerum portábat..."), the same
# Ant1-for-Benedictus mis-tagging bug already found for the Exaltation
# of the Holy Cross, Annunciation, Apparition of the Immaculate BVM,
# Our Lady of Mount Carmel, and the Seven Sorrows (TODO.md).
id: benedictus-antiphon-purification
text:
  la: "Cum indúcerent * púerum Jesum paréntes ejus, accépit eum Símeon in ulnas suas, et benedíxit Deum, dicens: Nunc dimíttis servum tuum in pace."
  en: "When His parents * brought in the Child Jesus, then took Simeon Him up in his arms, and blessed God, and said: Now lettest Thou thy servant depart in peace."
status:
  la: verified
  en: verified
