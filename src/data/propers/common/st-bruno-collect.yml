id: st-bruno-collect
text:
  la: |
    Orémus.
    Sancti Brunónis Confessóris tui, quǽsumus, Dómine, intercessiónibus
    adjuvémur: ut, qui majestátem tuam gráviter delinquéndo offéndimus,
    ejus méritis et précibus, nostrórum delictórum véniam consequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    May we be aided by the intercession of St. Bruno, thy Confessor, we
    beseech thee, O Lord; that we, who have grievously offended thy
    Majesty by sin, may, by his merits and prayers, obtain forgiveness for
    our offenses.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
