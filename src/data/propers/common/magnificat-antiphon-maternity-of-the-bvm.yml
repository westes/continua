# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/10-11.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution.
id: magnificat-antiphon-maternity-of-the-bvm
text:
  la: "Matérnitas tua, * Dei Génetrix Virgo, gáudium annuntiávit univérso mundo: ex te enim ortus est sol justítiæ, Christus Deus noster."
  en: "Thy maternity, * O Virgin Mother of God, announced joy to the whole world; for out of thee arose the sun of justice, Christ our God."
status:
  la: verified
  en: verified
