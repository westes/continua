# Verified against Divinum Officium (Latin/English Sancti/12-27.txt's own
# [Ant 1] — the Lauds-hour antiphon, not Terce's.
id: st-john-apostle-antiphon
text:
  la: "Iste est Joánnes, * qui supra pectus Dómini in cena recúbuit: beátus Apóstolus, cui reveláta sunt secréta cæléstia."
  en: "This is John * who leaned at supper on the bosom of the Lord. Blessed Apostle, to whom heavenly secrets were revealed."
status:
  la: verified
  en: verified
