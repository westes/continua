id: st-titus-collect
text:
  la: |
    Orémus.
    Deus, qui beátum Titum Confessórem tuum atque Pontíficem apostólicis virtútibus
    decorásti: ejus méritis et intercessióne concéde; ut juste et pie vivéntes in hoc
    sǽculo, ad cæléstem pátriam perveníre mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who didst adorn thy blessed Confessor and Bishop Titus with apostolic virtues:
    grant, by his merits and intercession, that living justly and devoutly in this world,
    we may be found worthy to come to our heavenly Fatherland.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
