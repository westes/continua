id: prime-lectio-nativity-of-st-john-the-baptist
text:
  la: "Reges vidébunt, et consúrgent príncipes et adorábunt Dóminum Deum tuum, et Sanctum Israël, qui elégit te."
  en: "Kings shall see, and princes shall arise, and shall worship the Lord thy God, and the Holy One of Israel that hath chosen thee."
citation:
  la: "Isa 49:7"
  en: "Isa 49:7"
