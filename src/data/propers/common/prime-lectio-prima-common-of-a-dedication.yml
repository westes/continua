# New file, 2026-09-15: the Common-category tier of Prime's Lectio
# Brevis override (see hours/resolve-common.ts's getPrimeLectioBrevis) --
# a saint with no proper Lectio Prima of her own, but who belongs to a
# Common category, uses that category's own text rather than falling all
# the way to the generic per-annum default. Sourced directly from
# web/www/horas/Latin/Commune/C8.txt's own [Lectio Prima] tag and its
# English counterpart. English citation "Rev 21:4-4" in the source is a
# single-character typo (duplicated "4"); corrected to "Rev 21:4-5" to
# match the Latin's own "Apo 21:4-5".
id: prime-lectio-prima-common-of-a-dedication
text:
  la: "Et abstérget Deus omnem lácrimam ab óculis eórum: et mors ultra non erit, neque luctus, neque clamor, neque dolor erit ultra, quia prima abiérunt. Et dixit qui sedébat in throno: Ecce nova fácio ómnia."
  en: "And God shall wipe away all tears from their eyes, and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain; for the former things are passed away. And He That sat upon the throne said: Behold, I make all things new."
citation:
  la: "Apo 21:4-5"
  en: "Rev 21:4-5"
status:
  la: verified
  en: verified
