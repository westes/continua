id: sext-capitulum-epiphany
text:
  la: |
    Isa 60:4 Leva in circúitu óculos tuos, et vide: omnes isti congregáti sunt, venérunt tibi: fílii tui de longe vénient, et fíliæ tuæ de látere surgent.
    R. Deo grátias.
    V. Omnes de Saba vénient, allelúja.
    R. Aurum et thus deferéntes, allelúja.
  en: |
    Isa 60:4 Lift up thy eyes round about, and see: all these are gathered together, they are come to thee: thy sons shall come from afar.
    R. Thanks be to God.
    V. All they from Saba shall come. Alleluia.
    R. They shall bring gold and incense. Alleluia.
