id: ss-protus-and-hyacinth-collect
text:
  la: |
    Orémus.
    Beatórum Mártyrum tuórum Proti et Hyacínthi nos, Dómine, fóveat pretiósa
    conféssio: et pia júgiter intercéssio tueátur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O Lord, we beseech thee, that the feast of thy blessed Martyrs and
    Bishops Protus and Hyacinth may keep us, and their worshipful prayers
    commend us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    ℟. Amen.
