# Presentation of the BVM (Nov 21) Magnificat antiphon, both evenings: engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-11-20 and 2026-11-21).
id: magnificat-antiphon-presentation-of-the-bvm
text:
  la: "Beáta Dei Génitrix, María, * Virgo perpétua, templum Dómini, sacrárium Spíritus Sancti, sola sine exémplo placuísti Dómino nostro Jesu Christo, allelúja."
  en: "O Blessed Mary, * Mother of God, Virgin for ever, temple of the Lord, sanctuary of the Holy Ghost, thou, without any example before thee, didst make thyself well-pleasing in the sight of our Lord Jesus Christ, alleluia."
