id: prime-lectio-st-stephen-protomartyr
text:
  la: "Pósitis autem génibus, clamávit voce magna, dicens: Dómine, ne státuas illis hoc peccátum. Et cum hoc dixísset, obdormívit in Dómino."
  en: "And falling on his knees, he cried with a loud voice, saying: Lord, lay not this sin to their charge. And when he had said this, he fell asleep in the Lord. And Saul was consenting to his death."
citation:
  la: "Act. 7:59"
  en: "Acts 7:59"
status:
  la: verified
  en: verified
