# Lauds' Benedictus antiphon, read from web/www/horas/Latin/Sancti/
# 03-25.txt's own [Ant 2] and its English counterpart -- corrected
# 2026-09-14: this file previously held [Ant 1] (this feast's own First
# Vespers Magnificat antiphon, "Spíritus Sanctus in te descéndet..."),
# the same Ant1-for-Benedictus mis-tagging bug already found for the
# Exaltation of the Holy Cross and the Seven Sorrows (TODO.md).
id: benedictus-antiphon-annunciation
text:
  la: "Quómodo fiet istud, * Angele Dei, quóniam virum non cognósco? Audi, María Virgo: Spíritus Sanctus supervéniet in te, et virtus Altíssimi obumbrábit tibi. (Allelúia.)"
  en: "How shall this be, * thou Angel of God, seeing I know not a man? Hear, O Virgin Mary: the Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee. (Alleluia.)"
status:
  la: verified
  en: verified
