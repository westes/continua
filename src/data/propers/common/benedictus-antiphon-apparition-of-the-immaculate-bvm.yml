# Lauds' Benedictus antiphon, read from web/www/horas/Latin/Sancti/
# 02-11.txt's own [Ant 2] and its English counterpart -- corrected
# 2026-09-14: this file previously held [Ant 1] (this feast's own First
# Vespers Magnificat antiphon, "Ista est colúmba mea..."), the same
# Ant1-for-Benedictus mis-tagging bug already found for the Exaltation
# of the Holy Cross, Annunciation, and the Seven Sorrows (TODO.md).
id: benedictus-antiphon-apparition-of-the-immaculate-bvm
text:
  la: "Præclára salútis auróra, * ex te, Virgo María, exívit sol justítiæ, qui visitávit nos óriens ex alto."
  en: "Beautiful aurora of salvation, * out of thee, O Virgin Mary, came forth the sun of justice who has visited us, the Orient from on high."
status:
  la: verified
  en: verified
