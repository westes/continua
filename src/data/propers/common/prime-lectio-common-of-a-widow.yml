# New file, 2026-09-15: the Common-category tier of Prime's Lectio
# Brevis override (see hours/resolve-common.ts's getPrimeLectioBrevis) --
# a saint with no proper Lectio Prima of her own, but who belongs to a
# Common category, uses that category's own text rather than falling all
# the way to the generic per-annum default. Sourced directly from
# web/www/horas/Latin/Commune/C7.txt's own [Lectio Prima] tag and its
# English counterpart.
id: prime-lectio-common-of-a-widow
text:
  la: "Laudábit usque ad mortem ánima mea Dóminum, quóniam éruis sustinéntes te, et líberas eos de manu angústiæ, Dómine, Deus noster."
  en: "My soul shall praise the Lord even to death. How thou deliverest them that wait for thee, O Lord, and savest them out of the hands of the nations!"
citation:
  la: "Sir 51:8; 51:12"
  en: "Sir 51:8; 51:12"
status:
  la: verified
  en: verified
