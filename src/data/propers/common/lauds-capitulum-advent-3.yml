id: lauds-capitulum-advent-3
text:
  la: "Fratres: Gaudéte in Dómino semper: íterum dico, gaudéte. Modéstia vestra nota sit ómnibus homínibus: Dóminus enim prope est."
  en: "Brothers: Rejoice in the Lord always; again, I say, rejoice. Let your modesty be known to all men. The Lord is nigh."
citation:
  la: "Phil 4:4-5"
  en: "Phil 4:4-5"
