# Verified against Divinum Officium (Monastic Tridentinum 1617), Terce
# live query, St. Scholastica's own day (2026-02-10, clean year).
# The reading body has no English rendering in the reference engine's data
# (only the R./V. versicle-response was given in English); reading body
# translated here per Douay-Rheims Cant 2:13-14, status: draft.
id: terce-capitulum-st-scholastica
text:
  la: "Surge, amíca mea, speciósa mea, et veni, colúmba mea, in foramínibus petræ, in cavérna macériæ, osténde mihi fáciem tuam, sonet vox tua in áuribus meis: vox enim tua dulcis, et fácies tua decóra. R. Deo grátias. V. Spécie tua et pulchritúdine tua. R. Inténde, próspere procéde, et regna."
  en: "Arise, my love, my beautiful one, and come: my dove, in the clefts of the rock, in the hollow places of the wall, shew me thy face, let thy voice sound in my ears; for thy voice is sweet, and thy face comely. R. Thanks be to God. V. In thy comeliness and thy beauty. R. Go forward, fare prosperously, and reign."
citation:
  la: "Cant 2:13-14"
  en: "Cant 2:13-14"
status:
  la: verified
  en: draft
