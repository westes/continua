# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: prime-lectio-holy-shroud
text:
  la: "Circumspexi, et non erat auxiliator: quæsívi, et non fuit qui adjuváret: et salvávit mihi bráchium meum, et indignátio mea ipsa auxiliata est mihi."
  en: "I looked about, and there was no helper: I sought, and there was none to give aid: and my own arm hath saved for me, and my indignation itself hath helped me."
citation:
  la: "Is 63:5"
  en: "Isaiah 63:5"
status:
  la: verified
  en: draft
