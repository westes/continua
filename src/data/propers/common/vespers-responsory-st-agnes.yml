# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# `votive=C6` live query, 2026-08 -- see lauds-capitulum-common-of-a-
# virgin-martyr.yml's header for why the votive-office view was used.
id: vespers-responsory-st-agnes
text:
  la: |
    R.br. Adjuvábit eam * Deus vultu suo.
    R. Adjuvábit eam * Deus vultu suo.
    V. Deus in médio ejus, non commovébitur.
    R. Deus vultu suo.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Adjuvábit eam * Deus vultu suo.
  en: |
    R.br. God shall help her * with His countenance.
    R. God shall help her * with His countenance.
    V. God is in the midst of her, she shall not be moved.
    R. With His countenance.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. God shall help her * with His countenance.
status:
  la: verified
  en: verified
