# Read directly from web/www/horas/Latin/Sancti/08-16.txt's own
# [Ant 1] and its English counterpart -- a real, proper antiphon of
# this feast, not a Common substitution.
id: benedictus-antiphon-st-joachim
text:
  la: "Laudémus * virum gloriósum in generatióne sua, quia benedictiónem ómnium géntium dedit illi Dóminus, et testaméntum suum confirmávit super caput ejus."
  en: "Let us praise a man * famous in his generation, with whom the Lord didst establish the blessing of all nations, and on whose head He made His covenant to rest."
status:
  la: verified
  en: verified
