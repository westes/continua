# Chapter (Sir 51:1-3), same at Lauds and Vespers. Engine render with votive=C7b (Common of Several Women Martyrs), Monastic Tridentinum 1617, command=prayLaudes. Before this file the Common had no Lauds/Vespers bundle and Ss. Perpetua and Felicity fell through to the seasonal chapter, responsory and hymn.
id: lauds-capitulum-common-of-several-women-martyrs
text:
  la: |
    Confitébor tibi, Dómine, Rex, et collaudábo te Deum Salvatórem meum. Confitébor nómini tuo: quóniam adjútor et protéctor factus es mihi, et liberásti corpus meum a perditióne.
    R. Deo grátias.
  en: |
    I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour. I will give glory to thy name: for thou hast been a helper and protector to me, and hast preserved my body from destruction.
    R. Thanks be to God.
status:
  la: verified
  en: verified
