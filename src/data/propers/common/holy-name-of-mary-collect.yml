# [Oratio] and its English counterpart.
id: holy-name-of-mary-collect
text:
  la: |
    Orémus.
    Concéde, quǽsumus, omnípotens Deus: ut fidéles tui, qui sub sanctíssimæ
    Vírginis Maríæ Nómine et protectióne lætántur; ejus pia intercessióne,
    a cunctis malis liberéntur in terris, et ad gáudia ætérna perveníre
    mereántur in cælis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    Grant we beseech thee, O Almighty God, that thy faithful people, who
    rejoice in the Name and keeping of the most holy Virgin Mary, may by
    her Motherly prayers be freed from all ills upon earth, and worthily
    attain unto thine everlasting joy in heaven.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    ℟. Amen.
