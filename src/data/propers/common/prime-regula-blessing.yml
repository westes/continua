# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08-25 run.
# Precedes the day's Regula reading — fixed regardless of which chapter is
# read that day.
id: prime-regula-blessing
text:
  la: |
    V. Jube, domne, benedícere.
    Benedictio. Dies et actus nostros in sua pace dispónat Dóminus omnípotens.
    R. Amen.
  en: |
    V. Grant, Lord, a blessing.
    Benediction. May Almighty God arrange our deeds and our day in His peace.
    R. Amen.
status:
  la: verified
  en: verified
