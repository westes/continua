id: collect-st-gregory-barbarigo
text:
  la: |
    Orémus.
    Deus, qui beátum Gregórium Confessórem tuum atque Pontíficem pastoráli sollicitúdine, et páuperum miseratióne claréscere voluísti: concéde propítius; ut, cujus mérita celebrámus, caritátis imitémur exémpla.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Let us pray.
    O God, Who have willed that Blessed Gregory, Your Confessor and Bishop, be renowned for the care of his flock and compassion for the poor; favorably grant that we who honor his merits may imitate the example of his charity.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

