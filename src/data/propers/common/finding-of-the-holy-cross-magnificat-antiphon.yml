# Vespers' Magnificat antiphon for Finding of the Holy Cross (May 3) /
# Exaltation of the Holy Cross (Sept 14) -- read directly from
# web/www/horas/Latin/Sancti/05-03.txt's own [Ant 1] and its English
# counterpart. Also used by exaltation-of-the-holy-cross.yml, which points
# its own `propers` here directly rather than duplicating this file (her
# `ex Sancti/05-03` Rule reuses this content wholesale).
#
# This text was previously wired as the *Benedictus* antiphon instead (see
# finding-of-the-holy-cross-antiphon.yml's own header) -- corrected
# 2026-09-13: the reference engine's own antiphon-selection rule
# (horas.pl's canticum(), `$key = $num == 3 ? $vespera : $num`) picks
# `[Ant 1]` for First Vespers' Magnificat specifically (a distinct text
# from Lauds/Second Vespers, which both share `[Ant 2]` instead -- same
# "one shared text, First Vespers gets its own" convention already
# established by all-saints-magnificat-antiphon.yml). "O Crux,
# splendidior..." is also independently recognizable as the well-known
# historical Magnificat antiphon for the Invention of the Holy Cross, not
# a Benedictus text.
#
# The source's own trailing "(Allelúja, allelúja.)" is stripped here: it's
# only correct when this feast's own date is in Paschaltide (Finding of the
# Holy Cross, May 3) but this same file is also reused verbatim by
# Exaltation of the Holy Cross (Sept 14, not Paschaltide). Base text here is
# season-neutral; `getMagnificatAntiphon` re-adds a Paschaltide-only
# ", allelúja" suffix via `withPaschaltideAlleluia`.
id: finding-of-the-holy-cross-magnificat-antiphon
text:
  la: "O Crux, * splendídior cunctis astris, mundo célebris, homínibus multum amábilis, sánctior univérsis: quæ sola fuísti digna portáre taléntum mundi, dulce lignum, dulces clavos, dúlcia ferens póndera; salva præséntem catérvam in tuis hódie láudibus congregátam."
  en: "O Cross, * surpassing all the stars in splendour, exceeding dear to all Christian people and world-renowned, holiest of earth's treasures: which only wast counted worthy to hold aloft the Price of our Redemption: sweet is thy wood and sweet thine iron, but sweetest of all the Burden that hung on thee! O that all who come this day to celebrate thy praises may find in thee salvation."
status:
  la: verified
  en: verified
