# Sancti/05-03.txt [Capitulum Nona] and [Responsory Breve Nona] (Alleluia form), used when the Finding or Exaltation falls in Paschaltide.
id: none-capitulum-proper-to-the-finding-of-the-holy-cross-paschaltide
text:
  la: |
    Humiliávit semetípsum factus obédiens usque ad mortem, mortem autem Crucis. Propter quod et Deus exaltávit illum, et donávit illi nomen, quod est super omne nomen.
    R. Deo grátias.
    V. Omnis terra adóret te, et psallat tibi, allelúia, allelúia.
    R. Psalmum dicat nómini tuo, Dómine.
  en: |
    He humbled himself, becoming obedient unto death, even to the death of the cross. For which cause God also hath exalted him, and hath given him a name which is above all names
    R. Thanks be to God.
    V. Let all the earth worship thee, and sing unto thee, alleluia, alleluia.
    R. Let them sing praises to thy Name, O Lord.
citation:
  la: "Phil 2:8-9"
  en: "Phil 2:8-9"
status:
  la: verified
  en: verified
