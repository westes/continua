# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2026-05-03 -- own proper responsory. See lauds-capitulum-
# finding-of-the-holy-cross.yml's header.
id: vespers-responsory-finding-of-the-holy-cross
text:
  la: |
    R.br. Adorámus te, Christe, et benedícimus tibi: * Allelúja, allelúja.
    ℟. Adorámus te, Christe, et benedícimus tibi: * Allelúja, allelúja.
    ℣. Quia per Crucem tuam redemísti mundum.
    ℟. Allelúja, allelúja.
    ℣. Glória Patri, et Fílio, * et Spirítui Sancto.
    ℟. Adorámus te, Christe, et benedícimus tibi: * Allelúja, allelúja.
  en: |
    R.br. We adore thee, O Christ, and we bless thee. * Alleluia, alleluia.
    ℟. We adore thee, O Christ, and we bless thee. * Alleluia, alleluia.
    ℣. Because that through thy cross thou hast redeemed the world.
    ℟. Alleluia, alleluia.
    ℣. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    ℟. We adore thee, O Christ, and we bless thee. * Alleluia, alleluia.
status:
  la: verified
  en: verified
