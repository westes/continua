# Authored for this project from Matthew 2:19-23 (Clementine Vulgate / Douay-Rheims, as in the scripture store); the reference engine has no office for this day, only a Martyrology line. Marked draft.
id: commemoration-return-from-egypt
text:
  la: |
    Ant. Surge, et accipe púerum et matrem ejus, et vade in terram Israël: defúncti sunt enim qui quærébant ánimam púeri.
    V. Surge, et accipe púerum et matrem ejus.
    R. Et vade in terram Israël.
    Orémus.
    Dómine Jesu Christe, qui, Maríæ et Joseph súbditus, domésticam vitam ineffabílibus virtútibus consecrásti: fac nos, utriúsque auxílio, Famíliæ sanctæ tuæ exémplis ínstrui; et consórtium cónsequi sempitérnum.
    Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Arise, and take the child and his mother, and go into the land of Israel: for they are dead that sought the life of the child.
    V. Arise, and take the child and his mother.
    R. And go into the land of Israel.
    Let us pray.
    Lord Jesus Christ, who, subject to Mary and Joseph, didst consecrate family life by thy unspeakable virtues: grant that, by the aid of them both, we may be taught by the examples of thy Holy Family, and attain to their everlasting companionship.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
