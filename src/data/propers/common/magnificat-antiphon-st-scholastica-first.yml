id: magnificat-antiphon-st-scholastica-first
text:
  la: "Exsúltet ómnium * turba fidélium pro glória vírginis almæ Scholásticæ; læténtur præcípue catérvæ vírginum, celebrántes ejus solemnitátem, quæ fundens lácrymas, Dóminum rogávit, et ab eo plus pótuit, quia plus amávit."
