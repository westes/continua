id: collect-st-peter-claver
text:
  la: |
    Orémus.
    Deus, qui, abréptos in servitútem Nigrítas ad agnitiónem tui nóminis vocatúrus, beátum Petrum mira in
    eis juvándis caritáte et patiéntia roborásti: ejus nobis intercessióne concéde; ut, quæ Jesu Christi
    sunt quæréntes, próximos ópere et veritáte diligámus.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus
    Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who to call enslaved Negroes to know your name, strengthened blessed Peter with wondrous love
    and patience in helping them; grant by his intercession, that, seeking the things of Jesus Christ, we
    may love our neighbors in deed and in truth.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of
    the Holy Ghost, God, world without end.
    R. Amen.
