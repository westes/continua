# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, the Apparition of St. Michael's own day (2026-05-08) -- the
# Benedictus antiphon. Corrects the previous version of this file, which
# had been sourced from the Roman/secular rite's Sancti/05-08.txt's own
# [Ant 1] instead: real but different text from what Monastic 1617
# actually renders at Lauds, same mistake as St. Lawrence's earlier fix.
id: benedictus-antiphon-apparition-of-st-michael
text:
  la: "Factum est siléntium in cælo, dum draco commítteret bellum; et Míchaël pugnávit cum eo, et fecit victóriam, allelúja."
  en: "There was silence in heaven while as the dragon made war, and Michael fought against him, and prevailed over him. Alleluia."
status:
  la: verified
  en: verified
