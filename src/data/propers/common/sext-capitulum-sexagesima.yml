id: sext-capitulum-sexagesima
text:
  la: |
    2 Cor 11:25 Ter virgis cæsus sum, semel lapidátus sum: ter naufrágium feci, nocte et die in profúndo maris fui.
    R. Deo grátias.
    V. Dóminus regit me, et nihil mihi déerit.
    R. In loco páscuæ ibi me collocávit.
  en: |
    2 Cor 11:25 Thrice was I beaten with rods, once I was stoned, thrice I suffered shipwreck, a night and a day I was in the depth of the sea.
    R. Thanks be to God.
    V. The Lord ruleth me: and I shall want nothing.
    R. He hath set me in a place of pasture.
