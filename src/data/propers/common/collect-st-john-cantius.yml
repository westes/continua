id: collect-st-john-cantius
text:
  la: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut, sancti Joánnis Confessóris exémplo
    in sciéntia Sanctórum proficiéntes, atque áliis misericórdiam
    exhibéntes; ejus méritis, indulgéntiam apud te consequámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant, we beseech thee, O Almighty God, that we may so follow after
    the example of thy blessed Confessor John in learning ever more and
    more the knowledge which maketh thy Saints, and in showing mercy to
    our neighbour, that Thou for the same thy servant's sake mayest
    forgive us our trespasses.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
