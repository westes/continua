id: terce-capitulum-quinquagesima
text:
  la: |
    1 Cor 13:1 Fratres: Si linguis hóminum loquar, et Angelórum, caritátem autem non hábeam, factus sum velut æs sonans, aut cýmbalum tínniens.
    R. Deo grátias.
    V. Ego dixi: Dómine, miserére mei.
    R. Sana ánimam meam, quia peccávi tibi.
  en: |
    1 Cor 13:1 Brothers: If I speak with the tongues of men, and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal.
    R. Thanks be to God.
    V. I said: O Lord, be thou merciful to me.
    R. Heal my soul, for I have sinned against thee.
