id: magnificat-antiphon-st-andrew
text:
  la: "Cum pervenísset * beátus Andréas ad locum, ubi crux paráta erat, exclamávit et dixit: O bona crux, diu desideráta, et jam concupiscénti ánimo præparáta: secúrus et gaudens vénio ad te, ita et tu exsúltans suscípias me discípulum ejus, qui pepéndit in te."
  en: "When the blessed * Andrew came to the place where the cross was made ready, he cried and said: O precious cross, of a long time have I desired thee, and, now that thou art made ready for me, my soul is drawn to thee, and I come to thee in peace and gladness; thou also oughtest to welcome me with joy, for I am the disciple of Him Who hung on thee."
