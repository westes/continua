# Standard de-Communi commemoration for common-of-a-widow (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-frances-of-rome has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-frances-of-rome-collect.yml), unchanged.
id: st-frances-of-rome-commemoration
text:
  la: |
    Ant. Date ei de frúctu mánuum suárum, et laudent eam in portis ópera ejus.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui beátam Francíscam fámulam tuam, inter cétera grátiæ tuæ dona, familiári Angeli consuetúdine decorásti: concéde, quǽsumus; ut, intercessiónis ejus auxílio, Angelórum consórtium cónsequi mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Give her of the fruit of her hands, and let her own works praise her in the gates.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Who along with other gifts of thy grace honored blessed Frances, thy handmaid, with the close companionship of an angel, grant, we beseech thee, that by the help of her intercession we may be made worthy to attain the companionship of angels.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
