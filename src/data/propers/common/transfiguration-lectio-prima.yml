# Sourced from web/www/horas/Latin/Sancti/08-06.txt's own [Lectio Prima] and its
# English counterpart.
id: transfiguration-lectio-prima
text:
  la: "Sústulit me in spíritu in montem magnum et altum, et osténdit mihi civitátem sanctam Jerúsalem, descendéntem de cælo a Deo, habéntem claritátem Dei; et lucérna ejus est Agnus."
  en: "He carried me away in the Spirit to a great and high mountain, and showed me the holy city Jerusalem, descending out of heaven from God, having the glory of God. And the Lamb is the Light thereof."
citation:
  la: "Apoc 21:10-11; 21:23"
  en: "Rev 21:10-11,23"
status:
  la: verified
  en: verified
