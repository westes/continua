# Lauds commemoration bundle: the feast's own [Ant 2] and [Versum 2]
# (the Lauds/Benedictus pair, per the established commemoration-bundle
# convention -- not [Ant 1]/[Versum 1], which are the First Vespers pair),
# followed by the collect from our-lady-of-the-rosary-collect.yml.
id: commemoration-our-lady-of-the-rosary
text:
  la: |
    Ant. Solemnitátem hodiérnam * sacratíssimi Rosárii Genetrícis Dei Maríæ devóte celebrémus, ut ipsa pro nobis intercédat ad Dóminum Jesum Christum.
    V. Elégit eam Deus, et præelégit eam.
    R. Et habitáre eam fecit in tabernáculo suo.
    Orémus.
    Deus, cujus Unigénitus per vitam, mortem et resurrectiónem suam nobis salútis ætérnæ prǽmia comparávit: concéde, quǽsumus; ut hæc mystéria sacratíssimo beátæ Maríæ Vírginis Rosário recoléntes, et imitémur quod cóntinent, et quod promíttunt, assequámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Let us this day keep * right heartily the solemn Feast of the Most Holy Rosary of Mary the Mother of God, that she may pray for us to our Lord Jesus Christ.
    V. God hath chosen her and forechosen her,
    R. And hath made her to dwell in His tabernacle.
    Let us pray.
    O God, Whose only-begotten Son, by His life, death and resurrection, has merited for us the grace of eternal salvation, grant, we beseech You, that, meditating upon those mysteries in the most holy Rosary of the Blessed Virgin Mary, we may imitate what they contain and obtain what they promise.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
