id: benedictus-antiphon-our-lady-of-mount-carmel
text:
  la: "Caput tuum * ut Carmélus, et comæ cápitis tui sicut púrpura Regis vincta canálibus, allelúja."
  en: "Thine head upon thee * is like Carmel, and the hair of thine head like kingly purple bound in tresses, alleluia."
status:
  la: verified
  en: verified
