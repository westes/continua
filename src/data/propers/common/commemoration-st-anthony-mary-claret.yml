# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor-bishop; collect is the saint's own (collect-st-anthony-mary-claret.yml). Not
# independently live-verified for this category, so marked draft.
id: commemoration-st-anthony-mary-claret
text:
  la: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui beátum Antónium Maríam Confessórem tuum atque Pontíficem, apostólicis virtútibus sublimásti, et per eum novas in Ecclésia clericórum ac vírginum famílias collegísti: concéde, quǽsumus; ut, ejus dirigéntibus mónitis ac suffragántibus méritis, animárum salútem quǽrere júgiter studeámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, with the virtues of an apostle thou didst exalt blessed Anthony Mary, thy Confessor and Bishop, and through him build in thy Church new religious congregations of clerics and virgins: grant, we beseech thee, that led by his counsels and helped by his prayers, we may unremittingly work for the salvation of souls.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

status:
  la: draft
  en: draft
