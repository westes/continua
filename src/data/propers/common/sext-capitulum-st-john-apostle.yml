# Verified against Divinum Officium (Monastic Tridentinum 1617), Sext
# live query, St. John Apostle's own day (2029-12-27, clean year).
id: sext-capitulum-st-john-apostle
text:
  la: "Cibávit illum pane vitæ et intelléctus, et aqua sapiéntiæ salutáris potávit illum Dóminus, Deus noster. R. Deo grátias. V. Constítues eos príncipes super omnem terram. R. Mémores erunt nóminis tui, Dómine."
  en: "With the bread of life and understanding, she shall feed him, and give him the water of wholesome wisdom to drink; God, our Lord. R. Thanks be to God. V. Thou shalt make them princes over all the earth. R. They shall remember thy name, O Lord."
citation:
  la: "Sir 15:3"
  en: "Sir 15:3"
status:
