# Sourced from web/www/horas/Latin/Sancti/09-15.txt's own [Capitulum
# Laudes] and English/Sancti/09-15.txt's own translation. Authoring this
# was necessary for the feast's own hymn (lauds-hymn-seven-sorrows-of-
# the-bvm.yml) to actually be reached at all: hours/resolve-common.ts's
# resolveOfficeBundle is all-or-nothing per id -- her own `common:
# common-of-the-bvm` field means without a chapter of her own, the whole
# bundle (hymn included) fell through to that Common's generic text.
id: lauds-capitulum-seven-sorrows-of-the-bvm
text:
  la: "Cui comparábo te? vel cui assimilábo te, fília Jerúsalem? cui exæquábo te, et consolábor te, virgo fília Sion? Magna est velut mare contrítio tua."
  en: "To what shall I compare thee? or to what shall I liken thee, O daughter of Jerusalem? to what shall I equal thee, that I may comfort thee, O virgin daughter of Sion? for great as the sea is thy destruction: who shall heal thee?"
citation:
  la: "Lam 2:13"
  en: "Lam 2:13"
status:
  la: verified
  en: verified
