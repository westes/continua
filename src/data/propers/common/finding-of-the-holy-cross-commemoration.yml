# Fully proper feast -- own real [Ant 2]/[Versum 2] read directly from the reference engine's own Sancti file (Latin + English), not a Common-category substitute. Collect is the saint's own real proper (finding-of-the-holy-cross-collect.yml), unchanged.
id: finding-of-the-holy-cross-commemoration
text:
  la: |
    Ant. Super ómnia * ligna cedrórum tu sola excélsior, in qua Vita mundi pepéndit, in qua Christus triumphávit, et mors mortem superávit in ætérnum. Allelúja.
    V. Adorámus te, Christe, et benedícimus tibi.
    R. Quia per Crucem tuam redemísti mundum.
    Orémus.
    Deus, qui in præclára salutíferæ Crucis Inventióne, passiónis tuæ mirácula suscitásti:
    concéde; ut vitális ligni prétio, ætérnæ vitæ suffrágia consequámur:
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    ℟. Amen.
  en: |
    Ant. Thou art higher * than all cedars, whereon the Life of the world hung, whereon Christ openly triumphed, and His death trampled down death for ever. Alleluia.
    V. We adore thee, O Christ, and we bless thee.
    R. Because that through thy Cross thou hast redeemed the world.
    Let us pray.
    O God, Who didst cause that the Cross of our salvation should in most honourable wise be
    found again, and Who didst manifest thereby the marvellous efficacy of thy sufferings,
    mercifully grant that by the Ransom which Thou didst pay upon that tree of life we may
    finally attain unto life eternal.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world
    without end.
    ℟. Amen.
