id: prime-lectio-annunciation
text:
  la: "Egrediétur virga de radíce Jesse, et flos de radíce ejus ascéndet. Et requiéscet super eum Spíritus Dómini."
  en: "And there shall come forth a rod out of the root of Jesse, and a flower shall rise up out of his root. And the spirit of the Lord shall rest upon him."
citation:
  la: "Isa 11:1-2"
  en: "Isa 11:1-2"
status:
  la: verified
  en: verified
