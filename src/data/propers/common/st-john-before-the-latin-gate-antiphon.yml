# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. John Before the Latin Gate's own day (2026-05-06) --
# the Benedictus antiphon. Corrects the previous version of this file,
# which had been sourced from the Roman/secular rite's Sancti/05-06.txt's
# own [Ant 1] instead: real but different text from what Monastic 1617
# actually renders at Lauds, same mistake as St. Lawrence's earlier fix
# -- shares the Eastertide Common-of-Several-Martyrs text several other
# May saints this pass also use.
id: st-john-before-the-latin-gate-antiphon
text:
  la: "Fíliæ Jerúsalem, veníte et vidéte Mártyres cum corónis, quibus coronávit eos Dóminus in die solemnitátis et lætítiæ, allelúja, allelúja."
  en: "Daughters of Jerusalem, come and see the crowned martyrs, the Lord crowned them in his solemnity and delight, alleluia, alleluia."
status:
  la: verified
  en: verified
