id: st-anne-collect
text:
  la: |
    Orémus.
    Deus, qui beátæ Annæ grátiam conférre dignátus es, ut Genitrícis unigéniti Fílii tui mater éffici mererétur: concéde propítius; ut, cujus solémnia celebrámus, ejus apud te patrocíniis adjuvémur. Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    
    ℟. Amen.
  en: |
    Let us pray.
    O God, Who in thy kindness gave blessed Anne the grace to be the mother of her who mothered thy only-begotten Son, graciously grant that we who keep her feast may be helped by her intercession with thee. Through the same Jesus Christ, thy Son, Our Lord, Who liveth and reigneth with thee in the unity of the Holy Ghost, God, world without end.
    
    ℟. Amen.
