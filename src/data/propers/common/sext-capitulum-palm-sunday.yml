text:
  la: |
    Phil 2:8-9 Humiliávit semetípsum factus obédiens usque ad mortem, mortem autem crucis. Propter quod et Deus exaltávit illum, et donávit illi nomen, quod est super omne nomen.
    R. Deo grátias.
    V. De ore leónis líbera me, Dómine.
    R. Et a córnibus unicórnium humilitátem meam.
  en: |
    Phil 2:8-9 He humbled himself, becoming obedient unto death, even to the death of the cross. For which cause God also hath exalted him, and hath given him a name which is above all names:
    R. Thanks be to God.
    V. From the lion's mouth, * O Lord, save me.
    R. And my lowness from the horns of the unicorns.
