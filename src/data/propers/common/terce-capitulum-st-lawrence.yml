# Verified against Divinum Officium (Monastic Tridentinum 1617), Terce
# live query, St. Lawrence's own day (2026-08-10) -- "Capitulum Versus
# {ex Proprio Sanctorum}", also shown on every day of his own octave, not
# just his own day (see hours/resolve-common.ts's resolveOfficeWinner).
id: terce-capitulum-st-lawrence
text:
  la: "Fratres: Qui parce séminat, parce et metet; et qui séminat in benedictiónibus, de benedictiónibus et metet. R. Deo grátias. V. Glória et honóre coronásti eum, Dómine. R. Et constituísti eum super ópera mánuum tuarum."
  en: "Brethren: He which soweth sparingly shall reap also sparingly, and he which soweth bountifully shall reap also bountifully. R. Thanks be to God. V. Thou hast crowned him with glory and honour, O Lord. R. And madest him to have dominion over the works of thy hands."
citation:
  la: "2 Cor 9:6"
  en: "2 Cor 9:6"
status:
  la: verified
  en: verified
