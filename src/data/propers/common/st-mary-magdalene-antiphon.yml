# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Mary Magdalene's own day (2026-07-22) -- the Benedictus
# antiphon. Corrects the previous version of this file, which had been
# sourced from the Roman/secular rite's Sancti/07-22.txt's own [Ant 1]
# instead: real but different text from what Monastic 1617 actually
# renders at Lauds, same mistake as St. Lawrence's earlier fix.
id: st-mary-magdalene-antiphon
text:
  la: "María unxit pedes Jesu, et extérsit capíllis suis, et domus impléta est ex odóre unguénti."
  en: "Mary anointed the Feet of Jesus, and wiped Them with her hair; and the house was filled with the odour of the ointment."
status:
  la: verified
  en: verified
