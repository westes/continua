# Content read from the reference engine's live render (Monastic Tridentinum 1617, command=prayVespera): 11-01
# all-saints (saint file = second). First Vespers variant; the default (second Vespers) file is the same id
# without "-first". See hours/resolve-common.ts's withVespersVariant.
id: all-saints-magnificat-antiphon-first
text:
  la: "Ángeli, * Archángeli, Throni et Dominatiónes, Principátus et Potestátes, Virtútes cælórum, Chérubim atque Séraphim, Patriárchæ et Prophétæ, sancti legis Doctóres, Apóstoli, omnes Christi Mártyres, sancti Confessóres, Vírgines Dómini, Anachorítæ, Sanctíque omnes, intercédite pro nobis."
  en: "O ye Angels, * ye Archangels, ye Thrones and Dominions, ye Principalities and Powers, ye mighty ones of the heavens, ye Cherubim and Seraphim, O ye Patriarchs and Prophets, ye holy Teachers of the Law, O ye Apostles, O all ye Martyrs of Christ, ye holy Confessors, ye Virgins of the Lord, ye Hermits, O all ye holy children of God, make intercession for us."
status:
  la: verified
  en: verified
