# Verified against Divinum Officium (Latin/English Doxologies.txt, the
# Monastic "T"-suffixed variant). Seasonal doxology for "Iam lucis orto
# sidere" and any other hymn ending "* Deo Patri sit gloria..." — see
# hours/hymn-doxology.ts.
id: hymn-doxology-pent
text:
  la: "Glória Patri Dómino,\nNatóque, qui a mórtuis\nSurréxit, ac Paráclito,\nIn sæculórum sǽcula. Amen."
  en: "All praise be thine, O risen Lord,\nFrom death to endless life restored;\nWhom with the Father we adore,\nAnd Holy Ghost, for evermore. Amen."
status:
  la: verified
  en: verified
