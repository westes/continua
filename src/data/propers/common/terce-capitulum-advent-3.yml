id: terce-capitulum-advent-3
text:
  la: |
    Phil 4:4-5 Fratres: Gaudéte in Dómino semper: íterum dico, gaudéte. Modéstia vestra nota sit ómnibus homínibus: Dóminus enim prope est.
    R. Deo grátias.
    V. Veni ad liberándum nos, Dómine, Deus virtútum.
    R. Osténde fáciem tuam, et salvi érimus.
  en: |
    Phil 4:4-5 Brothers: Rejoice in the Lord always; again, I say, rejoice. Let your modesty be known to all men. The Lord is nigh.
    R. Thanks be to God.
    V. Come to my rescue, O God, Lord of hosts.
    R. Show us thy face, and we shall be saved.
