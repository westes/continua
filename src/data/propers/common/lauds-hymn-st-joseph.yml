# Sourced from web/www/horas/Latin/Sancti/03-19.txt's own [Hymnus
# Laudes] and English/Sancti/03-19.txt's own translation.
id: lauds-hymn-st-joseph
text:
  la: >-
    Iste, quem læti cólimus, fidéles,

    Cujus excélsos cánimus triúmphos,

    Hac die Joseph méruit perénnis

    Gáudia vitæ.


    O nimis felix, nimis o beátus,

    Cujus extrémam vígiles ad horam

    Christus et Virgo simul astitérunt

    Ore seréno.


    Hinc stygis victor, láqueo solútus

    Carnis, ad sedes plácido sopóre

    Migrat ætérnas, rutilísque cingit

    Témpora sertis.


    Ergo regnántem flagitémus omnes,

    Adsit ut nobis, veniámque nostris

    Obtinens culpis, tríbuat supérnæ

    Múnera pacis.


    Sint tibi plausus, tibi sint honóres,

    Trine, qui regnas, Deus, et corónas

    Aureas servo tríbuis fidéli

    Omne per ævum. Amen.
  en: >-
    Worshipped throughout the Church to earth's far ends

    With prayer and solemn rite,

    Joseph this day triumphantly ascends

    Into the realms of light.


    O blest beyond the lot of mortal men!

    O'er whose last dying sigh

    Christ and the Virgin-Mother watched serene,

    Soothing his agony.


    Loosed from his fleshly chain, gently he fleets,

    As in calm sleep, away;

    And diademed with light, enters the seats

    Of everlasting day.


    There throned in power, let us his loving aid

    With fervent prayers implore;

    So may he gain us pardon in our need,

    And peace forevermore.


    Glory and praise to thee, blest Trinity!

    One only God and Lord,

    Who to thy faithful ones unfailingly

    Their aureoles dost award. Amen.
