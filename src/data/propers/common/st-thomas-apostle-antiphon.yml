# Verified against Divinum Officium (Latin/English Sancti/12-21.txt's own
# [Ant 1] — the Lauds-hour antiphon, not Terce's.
id: st-thomas-apostle-antiphon
text:
  la: "Quia vidísti me * Thoma, credidísti: beáti qui non vidérunt, et credidérunt, allelúja."
  en: "Because thou hast seen me, * Thomas, thou hast believed: blessed are they that have not seen and have believed, alleluia."
status:
  la: verified
  en: verified
