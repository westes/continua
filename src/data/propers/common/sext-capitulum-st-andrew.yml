# Verified against Divinum Officium (Monastic Tridentinum 1617), Sext
# live query, St. Andrew's own day (2026-11-30, clean year).
id: sext-capitulum-st-andrew
text:
  la: "Non enim est distínctio Judǽi et Græci: nam idem Dóminus ómnium, dives in omnes, qui ínvocant illum. Omnis enim, quicúmque invocáverit nomen Dómini, salvus erit. R. Deo grátias. V. Constítues eos príncipes super omnem terram. R. Mémores erunt nóminis tui, Dómine."
  en: "For there is no distinction of the Jew and the Greek: for the same is Lord over all, rich unto all that call upon him. For whosoever shall call upon the name of the Lord, shall be saved. R. Thanks be to God. V. Thou shalt make them princes over all the earth. R. They shall remember thy name, O Lord."
citation:
  la: "Rom 10:12-13"
  en: "Rom 10:12-13"
status:
  la: verified
  en: verified
