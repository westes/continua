# Second Vespers versicle. Engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-11-09, the Dedication of the Basilica of the Most Holy Savior; the Nov 18 Dedication of the Basilicas of Ss. Peter and Paul, also ex C8, takes the same Common). Before this file the Common of a Dedication had no Lauds/Vespers bundle and both feasts fell through to the ferial chapter, responsory and hymn.
id: vespers-versicle-common-of-a-dedication
text:
  la: |
    V. Domum tuam, Dómine, decet sanctitúdo.
    R. In longitúdinem diérum.
  en: |
    V. Holiness becometh thine house, O Lord.
    R. For ever.
status:
  la: verified
  en: verified
