id: st-agapitus-collect
text:
  la: |
    Orémus.
    Lætétur Ecclésia tua, Deus, beáti Agapíti Mártyris tui confísa suffrágiis: atque, ejus
    précibus gloriósis, et devóta permáneat et secúra consístat.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    May thy Church, O God, rejoice with confidence in the pleading of thy holy Martyr
    Agapitus; and, by his glorious prayers, remain ever devout and stand ever secure.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
