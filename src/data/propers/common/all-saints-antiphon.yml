# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, All Saints' own day (2026-11-01). The Benedictus antiphon
# (echoes the Te Deum's own "Te gloriosus Apostolorum chorus..."). Her
# Lauds psalmody override (see hours/lauds-psalmody-overrides.ts,
# TODO.md) is still unauthored -- this is only the Benedictus antiphon,
# a separate lookup.
id: all-saints-antiphon
text:
  la: "Te gloriósus Apostolórum chorus, te Prophetárum laudábilis númerus, te Mártyrum candidátus laudat exércitus, te omnes Sancti et elécti voce confiténtur unánimes, beáta Trínitas, unus Deus."
  en: "The glorious company of the Apostles praise thee. The goodly fellowship of the Prophets praise thee. The white-robed army of Martyrs praise thee. All thy Saints and Elect with one voice do acknowledge thee, O Blessed Trinity, One God!"
status:
  la: verified
  en: verified
