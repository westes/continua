# Reference engine (Monastic Tridentinum 1617, command=prayVespera, 2026-04-04): "Sabbato Sancto special Paschal Vespera" -- Holy Saturday evening is its own short Vespers, not Easter Sunday First Vespers.
id: holy-saturday-vespers-exaudi
text:
  la: |
    V. Dómine, exáudi oratiónem meam.
    R. Et clamor meus ad te véniat.
  en: |
    V. O Lord, hear my prayer.
    R. And let my cry come unto thee.
