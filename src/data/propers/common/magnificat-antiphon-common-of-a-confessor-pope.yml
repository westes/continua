# Second Vespers Magnificat antiphon for `common-of-a-confessor-pope`
# (C4b, Commune Summi Pontificis Confessoris) -- Ant 3 is
# @Commune/C4:Ant 3 summi Pontificis, which is the distinct Pope
# Confessor antiphon, not the same as C4 (confessor-bishop).
# Sourced directly from Latin/Commune/C4b.txt; English is a translation.
id: magnificat-antiphon-common-of-a-confessor-pope
text:
  la: "Dum esset Summus Póntifex, * terréna non métuit, sed ad cæléstia regna gloriósus migrávit."
  en: "When he was Supreme Pontiff, * he feared not earthly things, but migrated gloriously to the heavenly kingdom."
status:
  la: verified
  en: draft
