id: prime-lectio-conversion-of-st-paul
text:
  la: "Saulus autem multo magis convalescébat, et confundébat Judǽos qui habitábant Damásci, affírmans quóniam hic est Christus."
  en: "But Saul increased much more in strength, and confounded the Jews who dwelt at Damascus, affirming that this is the Christ."
citation:
