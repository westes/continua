# Standard de-Communi commemoration for common-of-a-confessor (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-henry has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-henry-collect.yml), unchanged.
id: st-henry-commemoration
text:
  la: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Deus, qui hodiérna die beátum Henrícum Confessórem tuum e terréni cúlmine
    impérii ad regnum ætérnum transtulísti: te súpplices exorámus; ut, sicut
    illum, grátiæ tuæ ubertáte prævéntum, illécebras sǽculi superáre fecísti,
    ita nos fácias, ejus imitatióne, mundi hujus blandiménta vitáre, et ad te
    puris méntibus perveníre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, Who on this day took St. Henry, thy Confessor, to the everlasting kingdom
    from the throne of an earthly empire; we humbly beseech thee, that as thou
    enabled him, protected by the abundance of thy grace, to overcome the
    temptations of the world, so grant that we, in emulation of him, may shun the
    allurements of this world and come to thee with pure hearts.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
