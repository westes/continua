# Sept 29 engine Vespers render (no Alleluia, unlike the Apparition's).
id: vespers-responsory-st-michael
text:
  la: |
    R.br. Ascéndit fumus arómatum * In conspéctu Dómini.
    R. Ascéndit fumus arómatum * In conspéctu Dómini.
    V. De manu Angeli.
    R. In conspéctu Dómini.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Ascéndit fumus arómatum * In conspéctu Dómini.
  en: |
    R.br. The smoke of the incense * ascended up before the Lord.
    R. The smoke of the incense * ascended up before the Lord.
    V. Out of the Angel's hand.
    R. Ascended up before the Lord.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. The smoke of the incense * ascended up before the Lord.
status:
  la: verified
  en: verified
