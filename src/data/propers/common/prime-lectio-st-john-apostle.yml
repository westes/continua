id: prime-lectio-st-john-apostle
text:
  la: "In médio Ecclésiæ apéruit os ejus, et implévit illum Dóminus spíritu sapiéntiæ et intelléctus, et stolam glóriæ índuit eum."
  en: "And in the midst of the church she shall open his mouth, and shall fill him with the spirit of wisdom and understanding, and shall clothe him with a robe of glory."
citation:
  la: "Sir 15:5"
  en: "Sir 15:5"
status:
  la: verified
  en: verified
