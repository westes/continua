# web/www/horas/Latin/Sancti/01-30.txt's own [Hymnus Laudes] ("Tu natále
# solum prótege") and English/Sancti/01-30.txt's translation. The last
# stanza is the fixed martyrs' doxology. [Hymnus Vespera 3] is
# `@:Hymnus Laudes`, so the same text is her Second Vespers hymn
# (vespers-hymn-st-martina-second.yml); First Vespers has no hymn of her own
# in the source and takes her Common's.
id: lauds-hymn-st-martina
text:
  la: |
    Tu natále solum prótege, tu bonæ
    Da pacis réquiem Christíadum plagis;
    Armórum strépitus, et fera prǽlia
    In fines age Thrácios.

    Et regum sócians ágmina sub crucis
    Vexíllo, Sólymas néxibus éxime,
    Vindéxque innócui sánguinis hósticum
    Robur fúnditus érue.

    Tu nostrum cólumen, tu decus ínclitum,
    Nostrárum obséquium réspice méntium;
    Romæ vota libens éxcipe, quæ pio
    Te ritu canit, et colit.

    A nobis ábigas lúbrica gáudia,
    Tu, qui Martýribus dexter ades, Deus
    Une et Trine: tuis da fámulis jubar,
    Quo clemens ánimos beas.
    Amen.
  en: |
    Be thou the guardian of thy native land,
    And to all Christian nations grant repose
    From din of arms, and every hostile band—
    From all our borders drive away our foes.

    Bid Christian princes marshal all their force
    Beneath the sacred standard of the Rood,
    To avenge sweet Salem's sacrilegious loss,
    And crush the Paynim red with guiltless blood.

    On thee our hopes are built, as on a tower;
    Receive the homage we now humbly pay,
    The vows which Rome accomplishes this hour,
    With pious rites, and canticles' sweet lay.

    Keep far from us all dangerous delight,
    O God, who comfortest thy Martyrs' pain;
    One God in Persons Three, bestow thy light
    Wherewith Thou makest strong thy Martyrs slain.
    Amen.
status:
  la: verified
  en: verified
