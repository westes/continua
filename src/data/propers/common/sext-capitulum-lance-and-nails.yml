# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
id: sext-capitulum-lance-and-nails
text:
  la: |
      Fratres: Christus passus est pro nobis, vobis relínquens exémplum, ut sequámini vestígia ejus. Qui peccátum non fecit, nec invéntus est dolus in ore ejus.
      R. Deo grátias.
      V. Ipse vulnerátus est propter iniquitátes nostras.
      R. Attrítus est propter scélera nostra.
  en: |
      Brethren: Christ suffered for us, leaving you an example that you should follow his steps. Who did no sin, neither was guile found in his mouth.
      R. Thanks be to God.
      V. He was wounded for our iniquities.
      R. He was bruised for our sins.
citation:
  la: "1 Petr 2:21-22"
  en: "1 Peter 2:21-22"
status:
  la: verified
  en: draft
