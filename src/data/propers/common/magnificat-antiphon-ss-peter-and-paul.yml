id: magnificat-antiphon-ss-peter-and-paul
text:
  la: "Hódie * Simon Petrus ascéndit crucis patíbulum, allelúja: hódie claviculárius regni gaudens migrávit ad Christum: hódie Paulus Apóstolus, lumen orbis terræ, inclináto cápite, pro Christi nómine martýrio coronátus est, allelúja."
  en: "This is the day * whereon Simon Peter went up upon the gibbet of the cross, alleluia; this day did he, that holdeth the keys of the kingdom, depart hence with joy to be with Christ; this day did the Apostle Paul, the light of the whole world, bow his head, and for Christ's name's sake receive the crown of his testimony. Alleluia."
status:
