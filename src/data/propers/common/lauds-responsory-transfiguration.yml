id: lauds-responsory-transfiguration
text:
  la: |
    R.br. Gloriósus apparuísti in conspéctu Dómini, * Allelúja, allelúja.
    ℟. Gloriósus apparuísti in conspéctu Dómini, * Allelúja, allelúja.
    ℣. Proptérea decórem índuit te Dóminus.
    ℟. Allelúja, allelúja.
    ℣. Glória Patri, et Fílio, * et Spirítui Sancto.
    ℟. Gloriósus apparuísti in conspéctu Dómini, * Allelúja, allelúja.
  en: |
    R.br. Thou wast manifested in thy glory in the Presence of the Lord. * Alleluia, alleluia.
    ℟. Thou wast manifested in thy glory in the Presence of the Lord. * Alleluia, alleluia.
    ℣. Wherefore the Lord hath clothed thee with majesty.
    ℟. Alleluia, alleluia.
    ℣. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    ℟. Thou wast manifested in thy glory in the Presence of the Lord. * Alleluia, alleluia.
status:
