# Prime reuses Lauds antiphon 1 (the historical minor-hours-borrow-from-Lauds
# convention, as for St. Benedict's March feast). English is a fresh
# translation, marked draft.
id: prime-antiphon-st-benedict-translation
text:
  la: "Vir Dei Benedictus * signum crucis edidit, et vas pestiferi potus ita confractum est, ac si pro signo lapidem dedisset."
  en: "The man of God, Benedict, * made the sign of the cross, and the vessel of the poisoned drink was so shattered as if he had given it a stone instead of the sign."
status:
  la: verified
  en: draft
