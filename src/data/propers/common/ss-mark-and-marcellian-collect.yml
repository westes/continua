id: ss-mark-and-marcellian-collect
text:
  la: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, qui sanctórum Mártyrum tuórum Marci et Marcelliáni natalítia cólimus; a cunctis malis imminéntibus eórum intercessiónibus liberémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O Almighty God, grant, we beseech thee, that we who do keep the Birthday of thine Holy Martyrs Mark and Marcellian, may through their prayers be delivered from all evils which do presently hang over us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
