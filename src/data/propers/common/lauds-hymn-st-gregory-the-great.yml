# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2033-03-12 -- "Mella cor obdulcántia," own proper hymn, no
# English rendering exists in the reference engine at all (checked with
# lang2=English explicitly) -- own original translation, marked draft.
# See lauds-capitulum-st-gregory-the-great.yml's header.
id: lauds-hymn-st-gregory-the-great
text:
  la: >-
    Mella cor obdulcántia

    Tua distíllant lábia:

    Fragrántum vim arómatum

    Tuum vincit elóquium.


    Scriptúræ sacræ mýstica

    Mire solvis ænígmata:

    Theórica mystéria

    Te docet ipsa Véritas.


    Tu nactus apostólicam

    Vicem simul et glóriam:

    Nos solve culpæ néxibus,

    Redde polórum sédibus.


    O Póntifex egrégie,

    Lux et decus Ecclésiæ,

    Non sinas in perículis,

    Quos tot mandátis ínstruis.


    Sit Patri laus ingénito,

    Sit decus Unigénito:

    Sit utriúsque párili

    Majéstas summa Flámini. Amen.
  en: >-
    Honeyed sweetness for the heart

    Distills forever from your lips;

    The fragrant power of every spice

    Your eloquence itself outstrips.


    The Scriptures' hidden mysteries

    You wondrously unlock and show;

    For Truth herself, the very Truth,

    Has taught you all you come to know.


    You gained the apostolic call,

    Its office and its glory too:

    Loose us from every bond of sin,

    And bring us to the heavens with you.


    O Bishop excellent and true,

    Light and adornment of the Church,

    Forsake not, in their perils, those

    Whom you instructed in your search.


    To the unbegotten Father praise,

    To the Only-begotten glory be:

    To both alike, in equal state,

    The Spirit's highest majesty. Amen.
status:
  la: verified
  en: draft
