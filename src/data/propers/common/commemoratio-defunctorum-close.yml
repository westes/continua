# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08-25 run.
id: commemoratio-defunctorum-close
text:
  la: |
    V. Réquiem ætérnam * dona eis, Dómine.
    R. Et lux perpétua * lúceat eis.
    V. A porta ínferi.
    R. Erue, Dómine, ánimas eórum.
    V. Requiéscant in pace.
    R. Amen.
    V. Dómine, exáudi oratiónem meam.
    R. Et clamor meus ad te véniat.

    Orémus.
    Deus véniæ largítor et humánæ salútis amátor: quǽsumus cleméntiam tuam: ut nostræ congregatiónis fratres, propínquos et benefactóres, qui ex hoc sǽculo transiérunt, beáta María semper vírgine intercedénte cum ómnibus sanctis tuis ad perpétuæ beatitúdinis consórtium perveníre concédas. Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

    V. Réquiem ætérnam dona eis, Dómine.
    R. Et lux perpétua lúceat eis.
    V. Requiéscant in pace.
    R. Amen.
  en: |
    V. Eternal rest * grant unto them, O Lord.
    R. And let perpetual light * shine upon them.
    V. From the gates of hell.
    R. Deliver their souls, O Lord!
    V. May they rest in peace.
    R. Amen.
    V. O Lord, hear my prayer.
    R. And let my cry come unto thee.

    Let us pray.
    O God the giver of pardon, and the lover of human salvation, we beseech thy clemency: that thou grant the brethren of our congregation, kinsfolk, and benefactors, which are departed out of this world, blessed Mary ever Virgin making intercession with all the saints, to come to the fellowship of eternal blessedness. Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

    V. Eternal rest grant unto them, O Lord.
    R. And let perpetual light shine upon them.
    V. May they rest in peace.
    R. Amen.
