# Lauds' Benedictus antiphon, read from web/www/horas/Latin/Sancti/
# 05-31.txt's own [Ant 2] and its English counterpart -- corrected
# 2026-09-14: this file previously held [Ant 1] (this feast's own First
# Vespers Magnificat antiphon, "Beáta quæ credidísti..."), the same
# Ant1-for-Benedictus mis-tagging bug already found for several other
# feasts this same day (TODO.md).
id: benedictus-antiphon-queenship-of-the-bvm
text:
  la: "Regína mundi digníssima, * María, Virgo perpétua, intercéde pro nostra pace et salúte, quæ genuísti Christum Dóminum, Salvatórem ómnium. (Allelúja.)"
  en: "O worthy Queen of the world, * Mary ever-Virgin, intercede for our peace and salvation, thou who gave birth to Christ the Lord, the Saviour of all. (Alleluia.)"
status:
  la: verified
  en: verified
