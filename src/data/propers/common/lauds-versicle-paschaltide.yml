id: lauds-versicle-paschaltide
text:
  la: |
    V. In resurrectióne tua, Christe, allelúia.
    R. Cæli et terra læténtur, allelúia.
  en: |
    V. Christ, in thy resurrection, alleluia.
    R. Let heaven and earth rejoice, alleluia.
status:
  la: draft
  en: draft
