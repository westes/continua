# Verified against Divinum Officium (prayer id "Conclmart") — a fixed closing
# line appended after every day's Martyrology reading, not day-variable
# content, so it's a common proper rather than baked into each day's file.
id: martyrology-close
text:
  la: |
    V. Et álibi aliórum plurimórum sanctórum Mártyrum et Confessórum, atque sanctárum Vírginum.
    R. Deo grátias.
  en: |
    V. And elsewhere many other holy martyrs, confessors, and holy virgins.
    R. Thanks be to God.
status:
  la: verified
  en: verified
