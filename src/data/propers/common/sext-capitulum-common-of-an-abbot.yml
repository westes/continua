id: sext-capitulum-common-of-an-abbot
text:
  la: "Justus cor suum trádidit ad vigilándum dilúculo ad Dóminum, qui fecit illum, et in conspéctu Altíssimi deprecábitur. R. Deo grátias. V. Os justi meditábitur sapiéntiam. R. Et lingua ejus loquétur judícium."
  en: "The righteous will give his heart to resort early to the Lord that made him, and he will pray in the sight of the most High. R. Thanks be to God. V. The mouth of the righteous speaketh wisdom. R. And his tongue talketh judgment."
citation:
  la: "Sir 39:6"
  en: "Sir 39:6"
status:
