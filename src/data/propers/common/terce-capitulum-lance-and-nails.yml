# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad1-5-LanceaDNJC.txt (Duplex majus, Friday of the first week of Lent). English is this project's own translation, marked draft.
id: terce-capitulum-lance-and-nails
text:
  la: |
      Quis est autem qui vincit mundum, nisi qui credit quóniam Jesus est Fílius Dei? hic est, qui venit per aquam et sánguinem, Jesus Christus: non in aqua solum, sed in aqua et sánguine.
      R. Deo grátias.
      V. Quem tu percussísti, persecúti sunt.
      R. Et super dolórem vúlnerum meórum addidérunt.
  en: |
      Who is he that overcometh the world, but he that believeth that Jesus is the Son of God? This is he that came by water and blood, Jesus Christ: not by water only, but by water and blood.
      R. Thanks be to God.
      V. Whom thou hast smitten, they have persecuted.
      R. And they have added to the grief of my wounds.
citation:
  la: "1 Joann 5:5-6"
  en: "1 John 5:5-6"
status:
  la: verified
  en: draft
