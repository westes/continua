# St. Mary Magdalene's own Matins hymn, Monastic track: Latin/Sancti/07-22.txt's
# [HymnusM Matutinum] ("Nardo María pístico", own doxology). The English
# stanza is the source's English of the secular hymn ("María castis
# ósculis"), shown by the engine beside this Latin; same scene, not a
# word-for-word translation, hence draft.
id: matins-hymn-st-mary-magdalene
text:
  la: |
    Nardo María pístico,
    Unxit beátos Dómini
    Pedes, rigándo lácrimis,
    Et detergéndo crínibus.

    Honor, decus, impérium,
    Sit Trinitáti únicæ
    Patri, Nato, Paráclito,
    Per infiníta sǽcula.
    Amen.
  en: |
    His sacred feet with tears of agony
    She bathes; and prostrate on the ground adores;
    Steeps them in kisses chaste, and wipes them dry
    With her own hair; then forth her precious ointment pours.

    Honour, glory and power be
    To the Trinity;
    The Father, Son and Paraclete,
    While ages evermore of endless ages run.
    Amen.
status:
  la: verified
  en: draft
