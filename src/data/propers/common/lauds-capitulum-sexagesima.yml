# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2028-02-20); Latin and English both taken from the page.
id: lauds-capitulum-sexagesima
text:
  la: "Fratres: Libénter suffértis insipiéntes, cum sitis ipsi sapiéntes: sustinétis enim si quis vos in servitútem rédigit, si quis dévorat, si quis áccipit, si quis extóllitur, si quis in fáciem vos cædit."
  en: "For you gladly suffer the foolish; whereas yourselves are wise. For you suffer if a man bring you into bondage, if a man devour you, if a man take from you, if a man be lifted up, if a man strike you on the face."
citation:
  la: "2 Cor 11:19-20"
  en: "2 Cor 11:19-20"
status:
  la: verified
  en: verified
