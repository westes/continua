id: st-zephyrinus-collect
text:
  la: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut beáti Zephyríni, Mártyris tui atque Pontíficis, cujus gaudémus méritis, instruámur exémplis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    Grant, we beseech thee, O Almighty God, that as the worthy acts of thy blessed Bishop and martyr Zephyrinus are made unto us a cause of joy, so his example may be of betterment.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
