id: st-hildegard-collect
text:
  la: |
    Orémus.
    Deus, qui beátam Hildegárdem Vírginem tuam donis cæléstibus decorásti: tríbue, quæsumus;
    ut, ejus vestígiis et documéntis insisténtes, a præséntis sæculi calígine ad lucem tuam
    delectábilem transíre mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who didst adorn blessed Hildegard, thy Virgin, with heavenly gifts: grant, we
    beseech thee, that, following in her footsteps and her teachings, we may deserve to pass
    from the darkness of this present age unto thy delightful light.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: draft
