# Sourced from web/www/horas/Latin/SanctiM/03-19.txt's own [Responsory
# Vespera]. No English rendering exists in the reference engine's data;
# translated here directly (echoes Sir 51:14, the wisdom canticle already
# associated with Confessor saints in this tradition).
id: vespers-responsory-st-joseph
text:
  la: |
    R.br. Invocávi Dóminum, * Patrem Dómini mei.
    R. Invocávi Dóminum, * Patrem Dómini mei.
    V. Ut non derelínquat me in die tribulatiónis.
    R. Patrem Dómini mei.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Invocávi Dóminum, * Patrem Dómini mei.
  en: |
    R.br. I called upon the Lord, * the Father of my Lord.
    R. I called upon the Lord, * the Father of my Lord.
    V. That he forsake me not in the day of tribulation.
    R. The Father of my Lord.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. I called upon the Lord, * the Father of my Lord.
status:
  la: verified
  en: draft
