id: sext-capitulum-common-of-an-apostle-paschaltide
text:
  la: |
    Ecce quómodo computáti sunt inter fílios Dei, et inter sanctos sors illórum est.
    R. Deo grátias.
    V. Lux perpétua lucébit Sanctis tuis, Dómine, allelúja.
    R. Et ætérnitas témporum, allelúja.
  en: |
    Behold how they are numbered among the children of God, and their lot is among the saints.
    R. Thanks be to God.
    V. Eternal light will shine over your saints, O Lord, alleluia.
    R. And the eternity of times, alleluia.
citation:
  la: "Sap 5:5"
  en: "Wis 5:5"
status:
  la: verified
  en: verified
