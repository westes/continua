# Own proper antiphon (st-mary-magdalene-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-holy-woman (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (st-mary-magdalene-collect.yml), unchanged.
id: st-mary-magdalene-commemoration
text:
  la: |
    Ant. María unxit pedes Jesu, et extérsit capíllis suis, et domus impléta est ex odóre unguénti.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Beátæ Maríæ Magdalénæ, quǽsumus, Dómine, suffrágiis adjuvémur: cujus précibus exorátus, quatriduánum fratrem Lázarum vivum ab ínferis resuscitásti:
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Mary anointed the Feet of Jesus, and wiped Them with her hair; and the house was filled with the odour of the ointment.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O Lord, we pray thee, that we may be helped by the pleading of Blessed Mary Magdalen, whose prayers so much availed with thee, that Thou didst call up her brother Lazarus living from the dead, when he had lain in the grave four days already.
    Who livest and reignest with God the Father in the unity of the Holy Spirit, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
