# Read directly from web/www/horas/Latin/Sancti/11-16.txt's own
# [Oratio] and its English counterpart. Doxology "$Per Dominum"
# spelled out per the convention in st-bibiana-collect.yml.
id: st-gertrude-collect
text:
  la: |
    Orémus.
    Deus, qui in corde beátæ Gertrúdis Vírginis jucúndam tibi mansiónem
    præparásti: ipsíus méritis et intercessióne; cordis nostri máculas
    cleménter abstérge, et ejúsdem tríbue gaudére consórtio.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et
    regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O God, Who didst make unto thyself a pleasant dwelling-place in the
    heart of thy blessed hand-maiden Gertrude, be Thou entreated for the
    same thy servant's sake, and by her prayers, to purge away in thy
    mercy all defilement from our hearts, and to grant us one day to
    rejoice with her in thy presence.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with
    thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
