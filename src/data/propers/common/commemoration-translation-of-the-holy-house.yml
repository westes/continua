# Ant+V/R+collect commemoration bundle: the feast's own Benedictus antiphon ([Ant 2]) and [Versum 2], then the collect. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/12-10-Domus.txt (Duplex majus, nine lessons, `ex C11`; the parts it marks `@Commune/C8` are read from Commune/C8.txt, the Common of a Dedication). English is this project's own translation, marked draft.
id: commemoration-translation-of-the-holy-house
text:
  la: |
      Ant. Ecce tabernáculum Dei cum homínibus, et habitábit cum eis: et ipsi pópulus ejus erunt, et ipse Deus cum eis erit eórum Deus.
      V. Introíbimus in tabernáculum ejus.
      R. Adorábimus in loco, ubi stetérunt pedes ejus.
      Orémus.
      Deus, qui beátæ Maríæ Vírginis Domum per incarnati Verbi mystérium misericórditer consecrasti, eámque in sinu Ecclésiæ tuæ mirabíliter collocasti: concéde; ut segregati a tabernáculis peccatórum, digni efficiamur habitatóres Domus sanctæ tuæ.
      Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Ant. Behold the tabernacle of God with men, * and he will dwell with them: and they shall be his people, and God himself with them shall be their God.
      V. We will go into his tabernacle.
      R. We will adore in the place where his feet stood.
      Let us pray.
      O God, who in thy mercy didst consecrate the House of the blessed Virgin Mary by the mystery of the incarnate Word, and didst wonderfully place it in the bosom of thy Church: grant that, set apart from the tabernacles of sinners, we may be made worthy inhabitants of thy holy House.
      Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
