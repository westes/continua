# Own proper antiphon (st-gregory-the-great-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-confessor-bishop (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-gregory-the-great-collect.yml), unchanged.
id: st-gregory-the-great-commemoration
text:
  la: |
    Ant. Gregórius, respíciens Anglórum júvenes, ait: Angélicam habent fáciem, et tales Angelórum in cælis decet esse consórtes.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui ánimæ fámuli tui Gregórii ætérnæ beatitúdinis prǽmia contulísti: concéde propítius; ut, qui peccatórum nostrórum póndere prémimur, ejus apud te précibus sublevémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Gregory, beholding the English youths, said: They have an angelic countenance, and it is meet that such should be companions of the Angels in heaven.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, who hast blessed the soul of thy servant Gregory with an everlasting blessing, mercifully grant that we, who groan under the burden of our sins, may by his prayers be relieved.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: draft
  en: draft
