id: prime-lectio-queenship-of-the-bvm
text:
  la: "Qui audit me, non confundétur, et qui operántur in me, non peccábunt: qui elúcidant me, vitam ætérnam habébunt."
  en: "He that hearkeneth to me, shall not be confounded: and they that work by me, shall not sin. They that explain me shall have life everlasting."
citation:
  la: "Sir 24:30-31"
  en: "Sir 24:30-31"
status:
  la: verified
  en: verified
