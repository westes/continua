# live query, Conversion of St. Paul's own day (2026-01-25, clean year).
id: terce-capitulum-conversion-of-st-paul
text:
  la: "Saulus autem adhuc spirans minárum et cædis in discípulos Dómini, accéssit ad príncipem sacerdótum, et pétiit ab eo epístolas in Damáscum ad synagógas: ut si quos invenísset hujus viæ viros ac mulíeres, vinctos perdúceret in Jerúsalem. R. Deo grátias. V. In omnem terram exívit sonus eórum. R. Et in fines orbis terræ verba eórum."
  en: "And Saul, as yet breathing out threatenings and slaughter against the disciples of the Lord, went to the high priest, and asked of him letters to Damascus, to the synagogues: that if he found any men and women of this way, he might bring them bound to Jerusalem. R. Thanks be to God. V. Their sound hath gone forth into all the earth: R. And their words unto the ends of the world."
citation:
  la: "Act 9:1-2"
  en: "Acts 9:1-2"
status:
  la: verified
  en: verified
