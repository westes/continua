# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# `votive=C2b` live query, 2026-08 -- used instead of a real saint's own
# day for the same reason recorded in vespers-hymn-common-of-a-martyr-
# bishop.yml's header (every real Common-of-a-Martyr-Bishop saint either
# has proper content of his own -- St. Lawrence, St. Stephen -- or never
# reaches the rank needed to keep his own hour un-outranked -- St.
# Zephyrinus, St. Callistus). Byte-identical to `votive=C2`/`C2a` (plain
# Common of a Martyr), confirming TODO.md's earlier finding that these
# categories share real content, not just their Matins psalmody. Same
# chapter reused for Vespers -- no separate vespers-capitulum-<id> file
# authored, per vespers.ts's lookupPart (Vespers chapter, Lauds sibling) fallback (see
# its own doc comment) -- same convention as Common-of-a-Confessor-Not-
# Bishop's identical Lauds/Vespers chapter.
id: lauds-capitulum-common-of-a-martyr-bishop
text:
  la: "Beátus vir, qui suffert tentatiónem: quóniam cum probátus fúerit, accípiet corónam vitæ, quam repromísit Deus diligéntibus se."
  en: "Blessed is the man that endureth temptation; for when he hath been proved, he shall receive a crown of life, which God hath promised to them that love him."
citation:
  la: "Jac 1:12"
  en: "Jas 1:12"
status:
  la: verified
  en: verified
