id: collect-ss-gervase-and-protase
text:
  la: |
    Orémus.
    Deus, qui nos ánnua sanctórum Mártyrum tuórum Gervásii et Protásii sollemnitáte lætíficas: concéde propítius; ut, quorum gaudémus méritis, accendámur exémplis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who gladden us by the annual festival of Your Martyrs Gervase and Protase, grant that we may be inspired by the example of those in whose merits we rejoice.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
