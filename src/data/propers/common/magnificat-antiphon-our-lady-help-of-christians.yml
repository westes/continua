# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-24-Auxilium.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: magnificat-antiphon-our-lady-help-of-christians
text:
  la: "Sancta María, succurre míseris, juva pusillánimes, réfove flébiles, ora pro pópulo, intérveni pro clero, intercéde pro devóto femíneo sexu: séntiant omnes tuum juvámen, quicúmque tuum sanctum implórant auxílium."
  en: "Holy Mary, succour the wretched, help the faint-hearted, comfort the weeping, pray for the people, plead for the clergy, intercede for the devout female sex: may all feel thy help who implore thy holy aid."
status:
  la: verified
  en: draft
