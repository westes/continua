id: st-dorothea-collect
text:
  la: |
    Orémus.
    Indulgéntiam nobis, quǽsumus, Dómine, beáta Doróthea Virgo et Martyr implóret: quæ tibi grata semper éxstitit, et mérito castitátis, et tuæ professióne virtútis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Lord, we pray thee, that thy blessed handmaiden and witness Dorothy in whom Thou hast ever been well pleased, because of her worthy maidenhood and her mighty showing-forth of thy power, may entreat thy pardon on our behalf.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
