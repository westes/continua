id: st-anthony-mary-zaccaria-collect
text:
  la: |
    Orémus.
    Fac nos, Dómine Deus, supereminéntem Jesu Christi sciéntiam, spíritu Pauli
    Apóstoli, edíscere: qua beátus Antónius María mirabíliter erudítus, novas in
    Ecclésia tua clericórum et vírginum famílias congregávit.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Make us able, O Lord God, in the Spirit of Thy blessed Apostle Paul, to know the
    love of Christ which passeth knowledge, wherein Thy blessed servant Anthony Mary
    was so wonderfully taught when he gathered together in thy Church new households
    of clerks and of virgins.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee,
    in the unity of the Holy Ghost, God, world without end.
    R. Amen.
