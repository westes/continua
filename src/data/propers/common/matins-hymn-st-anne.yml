# St. Anne: proper Matins hymn, Latin/SanctiM/07-26r.txt's [Hymnus Matutinum]. English from English/SanctiM/07-26r.txt.
# Before this file the saint fell to the Common's hymn.
id: matins-hymn-st-anne
text:
  la: |
    Gaude, mater Anna,
    Gaude mater sancta,
    Cum sis Dei facta
    Genetrícis Dei.

    Plaude tali natæ
    Vírgini Maríæ;
    Ejus genitóri
    Jóachim congáude

    In hac nostra terra
    Primo benedícta,
    Quæ fuit in Eva
    Quondam maledícta.

    Ergo sume laudes
    Quas damus ovántes;
    Nos ab omni sorde
    Tua prece terge.

    Sit laus Deo Patri,
    Summo Christo decus,
    Spirítui Sancto
    Tribus honor unus.
    Amen.
  en: |
    O mother Anne, rejoice!
    O mother blest, applaud:
    Your daughter has been born today:
    The Mother of our God.

    The Virgin Mary born!
    A new parental bliss!
    Rejoice, rejoice with Joachim
    For such a babe as this!

    Your daughter is the first
    Of blessings we receive,
    Renewing earth whose early dawn
    Was cursed because of Eve.

    And so we give you praise,
    And banners raise today,
    And ask that through your holy prayers
    Our sins be washed away.

    To God the Father, praise,
    And glory to the Son,
    And honor to the Spirit bright:
    Blest Trinity in One.
    Amen.
status:
  la: verified
  en: verified
