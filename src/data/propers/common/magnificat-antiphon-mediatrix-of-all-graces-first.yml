id: magnificat-antiphon-mediatrix-of-all-graces-first
text:
  la: "Ecce Dóminus meus * ómnia mihi trádidit, nec quidquam est, quod non in mea sit potestáte, vel non tradíderit mihi."
  en: "Behold, my lord * hath delivered all things to me, and there is nothing which is not in my power, or that he hath not delivered to me."
