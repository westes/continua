id: magnificat-antiphon-st-benedict-translation-first
text:
  la: "Exsúltet ómnium * turba fidélium pro glória almi Patris Benedícti; læténtur præcípue catérvæ monachórum, celebrántes ejus Translatiónem in terris, de cujus societáte sancti congáudent in cælis."
  en: "Let the whole multitude of the faithful exult * for the glory of our kindly Father Benedict; let the throngs of monks especially rejoice, celebrating his Translation on earth, in whose company the saints rejoice together in heaven."
