# Verified against Divinum Officium (Monastic Tridentinum 1617),
# live query (St. Anacletus, 07-13-2028) -- common-of-a-martyr.
# Covers both `common-of-a-martyr-bishop` and `common-of-a-martyr`
# saints (SaintRecord.common) -- live-verified identical P/T/S/N across
# both (the Bishop/non-Bishop distinction only affects the collect's
# own wording, not these Scripture-antiphons), cross-checked against
# St. Anicetus/St. Simeon/St. Blaise/St. Pantaleon.
id: sext-capitulum-common-of-a-martyr
text:
  la: "Cibávit illum pane vitæ et intelléctus, et aqua sapiéntiæ salutáris potávit illum Dóminus Deus noster. R. Deo grátias. V. Posuísti, Dómine, super caput ejus. R. Corónam de lápide pretióso."
  en: "With the bread of life and understanding, she shall feed him, and give him the water of wholesome wisdom to drink: and she shall be made strong in him, and he shall not be moved. R. Thanks be to God. V. O Lord, Thou hast set a crown of precious stones. R. Upon his head."
citation:
  la: "Sir 15:3"
  en: "Sir 15:3"
status:
  la: verified
  en: verified
