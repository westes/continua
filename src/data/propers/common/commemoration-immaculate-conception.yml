# Own proper antiphon (immaculate-conception-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (immaculate-conception-collect.yml), unchanged.
id: commemoration-immaculate-conception
text:
  la: |
    Ant. Conceptiónem hodiérnam perpétuæ Vírginis Genitrícis Dei Maríæ solémniter celebrémus, qua celsitúdo throni procéssit, allelúja.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Deus, qui per immaculátam Vírginis Conceptiónem dignum Fílio tuo habitáculum præparásti: quǽsumus; ut qui ex morte ejúsdem Fílii tui prævísa, eam ab omni labe præservásti, nos quoque mundos ejus intercessióne ad te perveníre concédas.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Let us this day keep solemnly the Conception of Mary, Mother but still Maiden, a step toward the loftiness of her throne. Alleluia.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    O God, by the Immaculate Conception of the Virgin, thou prepared a worthy habitation for thy Son; we beseech thee, that, as by the foreseen death of thy same Son thou preserved her from all stain of sin, so thou would grant us also, through her intercession, to come to thee with pure hearts.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
