id: terce-capitulum-common-of-a-virgin
text:
  la: "Fratres: Qui gloriátur, in Dómino gloriétur. Non enim qui seípsum comméndat, ille probátus est; sed quem Deus comméndat. R. Deo grátias. V. Spécie tua et pulchritúdine tua. R. Inténde, próspere procéde, et regna."
  en: "Brothers: But he that glorieth, let him glory in the Lord. For not he who commendeth himself, is approved, but he, whom God commendeth. R. Thanks be to God. V. In thy comeliness and thy beauty. R. Go forward, fare prosperously, and reign."
citation:
  la: "2 Cor 10:17-18"
  en: "2 Cor 10:17-18"
status:
  la: verified
  en: verified
