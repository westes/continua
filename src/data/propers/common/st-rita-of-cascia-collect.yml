# project's own translation, marked draft accordingly.
id: st-rita-of-cascia-collect
text:
  la: |
    Orémus.
    Deus, qui sanctæ Ritæ tantam grátiam conférre dignátus es, ut inimícos dilígeret et in corde ac fronte
    caritátis et passiónis tuæ signa portáret: da nobis, quǽsumus, ejus intercessióne et méritis; inimícis
    nostris sic párcere et passiónis tuæ dolóres contemplári, ut promíssa mítibus ac lugéntibus prǽmia
    consequámur:
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who didst vouchsafe to grant unto Saint Rita such grace that she loved her enemies and bore in
    her heart and on her brow the marks of thy charity and Passion: grant us, we beseech thee, by her
    intercession and merits, so to spare our enemies and to contemplate the sorrows of thy Passion, that we
    may obtain the rewards promised to the meek and to those who mourn.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
status:
  la: verified
