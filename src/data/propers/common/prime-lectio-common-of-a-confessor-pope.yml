# New file, 2026-09-15: the Common-category tier of Prime's Lectio
# Brevis override (see hours/resolve-common.ts's getPrimeLectioBrevis) --
# a saint with no proper Lectio Prima of her own, but who belongs to a
# Common category, uses that category's own text rather than falling all
# the way to the generic per-annum default. Sourced directly from
# web/www/horas/Latin/Commune/C4.txt's own [Lectio Prima] tag and its
# English counterpart.
id: prime-lectio-common-of-a-confessor-pope
text:
  la: "Fungi sacerdótio, et habére laudem in nómine ipsíus, et offérre illi incénsum dignum in odórem suavitátis."
  en: "To execute the office of the priesthood, and to have praise, and to glorify his people in his name. He chose him out of all men living, to offer sacrifice to God, incense, and a good savour."
citation:
  la: "Sir 45:19-20"
  en: "Sir 45:19-20"
status:
  la: verified
  en: verified
