# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
id: terce-capitulum-crown-of-thorns
text:
  la: |
      Egredímini, et vidéte fíliæ Sion, regem Salomónem in diadémate quo coronávit eum mater sua.
      R. Deo grátias.
      V. Glória et honóre coronásti eum Dómine.
      R. Et constituísti eum super ópera mánuum tuárum.
  en: |
      Go forth, and see, ye daughters of Sion, king Solomon in the diadem wherewith his mother crowned him.
      R. Thanks be to God.
      V. Thou hast crowned him, O Lord, with glory and honour.
      R. And hast set him over the works of thy hands.
citation:
  la: "Cant 3:11"
  en: "Canticle of Canticles 3:11"
status:
  la: verified
  en: draft
