# First Vespers Magnificat antiphon for this Common: Latin/Commune/C8.txt's own
# [Ant 1] (and its English counterpart), where it differs from [Ant 3]. Second
# Vespers' [Ant 3] is magnificat-antiphon-common-of-a-dedication.yml (the default); see
# hours/resolve-common.ts's withVespersVariant.
id: magnificat-antiphon-common-of-a-dedication-first
text:
  la: "Sanctificávit Dóminus * tabernáculum suum: quia hæc est domus Dei, in qua invocábitur nomen ejus, de quo scriptum est: Et erit nomen meum ibi, dicit Dóminus."
  en: "The Most High hath hallowed His Tabernacle. * For this is the House of God, whereon His Name shall be called, whereof it is written My Name shall be there, saith the Lord."
status:
  la: verified
  en: verified
