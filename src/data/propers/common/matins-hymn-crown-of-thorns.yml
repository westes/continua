# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
id: matins-hymn-crown-of-thorns
text:
  la: |
      Exite Sion fíliæ,
      Regis pudicæ vírgines,
      Christi Corónam cernite,
      Quam mater ipsa texuit.

      Horret revulsis crinibus
      Spinis cruentatum caput:
      Et vultus ille decolor
      Mortem propinquam réspicit.

      Quæ terra fulcis ínvia,
      Dumis rigens et sentibus,
      Lugubre munus protulit.
      Quæ sæva messuit manus?

      Christi rubescens sánguine
      Aculeos mutat rosis,
      Palmamque vincens fructibus
      Spina est triumphis aptior.

      Culpis satæ mortálium
      Te, Christe, spinæ vulnerant
      Evelle nostras córdibus,
      Tuasque nostris insere.

      Virtus, honor, laus, glória,
      Deo Patri cum Fílio,
      Sancto simul Paráclito,
      In sæculórum sǽcula.
      Amen.
  en: |
      Come forth, daughters of Sion,
      chaste virgins of the King,
      behold the Crown of Christ,
      which his own mother wove.

      The head, bloodied with thorns,
      bristles with its torn-out hair;
      and that pallid countenance
      looks upon death near at hand.

      What land, impassable with furrows,
      stiff with briars and brambles,
      brought forth this mournful gift?
      What cruel hand reaped it?

      Reddening with the blood of Christ,
      the thorn changes its prickles into roses,
      and, surpassing the palm in its fruits,
      the thorn is fitter for triumphs.

      Sown by the sins of mortals,
      the thorns wound thee, O Christ:
      pluck them from our hearts,
      and plant thine own in us.

      Might, honour, praise, glory
      to God the Father with the Son,
      and likewise to the Holy Paraclete,
      for ever and ever. Amen.
status:
  la: verified
  en: draft
