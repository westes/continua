# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2025-11-13 -- own proper hymn ("Salvéte, cedri Líbani"),
# same text at both hours. No English rendering exists in the reference
# engine -- own original translation, marked draft. See lauds-
# capitulum-all-saints-of-the-benedictine-order.yml's header.
id: lauds-hymn-all-saints-of-the-benedictine-order
text:
  la: >-
    Salvéte, cedri Líbani,

    Plantæ viréntes Ordinis,

    Quæ prata nunc cæléstia

    Implétis almo gérmine.


    Vos Trinitátis glória

    Ætérna circumpléctitur:

    Vos aura Matris Vírginis

    Mulcet piis favóniis.


    Vos Angelórum cúriæ

    Cingunt choréa pérpetim,

    Et írrigant puríssimi

    Æternitátis rívuli.


    O ínclytæ propágines,

    Vestros juváte fílios:

    In valle mæsta débiles

    Nos roboráte súrculos.


    Sit laus Patri, cum Fílio,

    Simúlque dulci Flámini,

    Læti quibúscum vívitis

    In sempitérno lúmine. Amen.
  en: >-
    Hail, cedars of Lebanon,

    Thriving plants of the Order,

    Who now fill the meadows of heaven

    With your fruitful growth.


    You the eternal glory

    Of the Trinity embraces round about;

    You the breath of the Virgin Mother

    Soothes with gentle, holy breezes.


    You the courts of Angels

    Encircle forever in dance,

    And the purest streams

    Of eternity water you.


    O renowned offshoots,

    Come to the aid of your own sons:

    In this sorrowful valley, strengthen

    Us, your weak young saplings.


    Praise be to the Father, with the Son,

    And together to the sweet Spirit,

    With whom you live rejoicing

    In everlasting light. Amen.
status:
  la: verified
  en: draft
