id: terce-capitulum-pentecost-sunday
text:
  la: |
    Act. 2:1-2 Cum compleréntur dies Pentecóstes, erant omnes discípuli páriter in eódem loco: et factus est repénte de cælo sonus, tamquam adveniéntis spíritus veheméntis, et replévit totam domum, ubi erant sedéntes.
    R. Deo grátias.
    V. Spíritus Dómini replévit orbem terrárum, allelúia.
    R. Et hoc quod cóntinet ómnia, sciéntiam habet vocis, allelúia.
  en: |
    Acts 2:1-2 When the day of Pentecost was fully come, the disciples were all with one accord in one place and suddenly there came a sound from heaven, as of a rushing mighty wind and it filled all the house where they were sitting.
    R. Thanks be to God.
    V. The Spirit of the Lord filleth the world, alleluia.
    R. And That Which containeth all things hath knowledge of the voice, alleluia.
