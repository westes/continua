# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/11-22.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution. (This feast's own Benedictus antiphon,
# st-cecilia-antiphon.yml, already correctly sourced [Ant 2].)
id: st-cecilia-magnificat-antiphon
text:
  la: "Virgo gloriósa * semper Evangélium Christi gerébat in péctore suo, et non diébus neque nóctibus a collóquiis divínis et oratióne cessábat."
  en: "The glorious maiden * carried the Gospel of Christ always in her breast, and meditated therein day and night talking with God and praying."
status:
  la: verified
  en: verified
