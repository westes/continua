# Own proper antiphon (st-stephen-protomartyr-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-martyr (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-stephen-protomartyr-collect.yml), unchanged.
id: commemoration-st-stephen-protomartyr
text:
  la: |
    Ant. Stéphanus autem * plenus grátia et fortitúdine, faciébat signa magna in pópulo.
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
    Orémus.
    Da nobis, quǽsumus, Dómine, imitári quod cólimus: ut discámus et inimícos dilígere; quia ejus natalícia celebrámus, qui novit étiam pro persecutóribus exoráre Dóminum nostrum Jesum Christum Fílium tuum:
    Qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. And Stephen, full of grace * and fortitude, did great signs among the people.
    V. The righteous shall flourish like the palm tree:
    R. He shall grow up like the cedar of Libanus.
    Let us pray.
    Grant us, we beseech thee, O Lord, so to imitate what we revere, that we may learn to love even our enemies; for we celebrate the heavenly birthday of him who knew how to pray for his very persecutors to our Lord Jesus Christ:
    Who with thee liveth and reigneth, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
