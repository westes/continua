# Ant+V/R+collect commemoration bundle. The source has no antiphon or versicle of its own (`vide C5`), so the Common of a Confessor's are used (commemoration-antiphon-common-of-a-confessor.yml and lauds-versicle-common-of-a-confessor.yml), as for every saint of this category with nothing proper. Sourced from web/www/horas/Latin/Sancti/Urbis/12-05-StanislausK.txt (Duplex, nine lessons, C5). English is this project's own translation, marked draft.
id: commemoration-st-stanislaus-kostka
text:
  la: |
      Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
      V. Justum dedúxit Dóminus per vias rectas.
      R. Et osténdit illi regnum Dei.
      Orémus.
      Deus, qui inter cétera sapiéntiæ tuæ mirácula, étiam in tenera ætáte maturæ sanctitátis grátiam contulisti: da, quǽsumus; ut beáti Stanislai exémplo, tempus instanter operando rediméntes, in ætérnam íngredi réquiem festinémus.
      Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
      V. The Lord guided the just in right paths.
      R. And showed him the kingdom of God.
      Let us pray.
      O God, who among the other marvels of thy wisdom didst bestow the grace of mature holiness even in tender age: grant, we beseech thee, that by the example of blessed Stanislaus, redeeming the time by earnest labour, we may hasten to enter into eternal rest.
      Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
