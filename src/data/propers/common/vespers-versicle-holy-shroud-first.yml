id: vespers-versicle-holy-shroud-first
text:
  la: |
      V. Tuam sindonem veneramur Dómine.
      R. Tuam recólimus passiónem.
  en: |
      V. We venerate thy Shroud, O Lord.
      R. We recall thy Passion.
