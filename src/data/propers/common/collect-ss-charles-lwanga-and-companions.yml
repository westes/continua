id: collect-ss-charles-lwanga-and-companions
text:
  la: |
    Orémus.
    Omnípotens et miséricors Deus, qui univérsum mundum lúmine veritátis illústras, et per
    gloriósos Mártyres Matthíam, Cárolum et Sócios fídei prodígia in Africæ regiónibus renováre
    dignátus es: largíre supplícibus tuis; ut, ipsis intercedéntibus, in nobis grátiæ tuæ dona
    custódias, et inter gentes omnes mérito et número pópulus tibi sérviens augeátur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Almighty and merciful God, who dost enlighten the whole world with the light of truth, and
    who through thy glorious Martyrs Matthias, Charles, and their Companions didst vouchsafe to
    renew the wonders of the faith in the lands of Africa: grant to thy suppliants that, by
    their intercession, thou wouldst preserve in us the gifts of thy grace, and that among all
    nations the people who serve thee may increase in merit and in number.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of
    the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: draft
