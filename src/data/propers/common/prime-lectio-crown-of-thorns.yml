id: prime-lectio-crown-of-thorns
text:
  la: "In die illa erit Dóminus exercítuum coróna glóriæ, et sertum exsultatiónis residuo pópuli sui."
  en: "In that day the Lord of hosts shall be a crown of glory, and a garland of joy to the residue of his people."
citation:
