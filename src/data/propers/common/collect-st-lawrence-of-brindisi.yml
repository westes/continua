id: collect-st-lawrence-of-brindisi
text:
  la: |
    Orémus.
    Deus, qui ad árdua quæque pro nóminis tui glória et animárum salúte beáto Lauréntio, Confessóri tuo atque Doctóri, spíritum sapiéntiæ et fortitúdinis contulísti: da nobis in eódem spíritu et agénda cognóscere; et cógnita, ejus intercessióne, perfícere.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Let us pray.
    O Lord, you conferred the spirit of wisdom and fortitude on St. Lawrence, Confessor and teacher of faith, to help him perform difficult tasks for the glory of Your name and for the salvation of souls. At his intercession grant us by the same Spirit the grace to know what we ought to do and the courage to do it.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

