# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, Ss. John and Paul's own day (2026-06-26) -- the Benedictus
# antiphon. Corrects the previous version of this file, which had been
# sourced from the Roman/secular rite's Sancti/06-26.txt's own [Ant 1]
# instead: real but different text from what Monastic 1617 actually
# renders at Lauds, same mistake as St. Lawrence's earlier fix. These are
# the Roman martyrs John and Paul, not St. John the Baptist/Evangelist or
# St. Paul the Apostle.
id: benedictus-antiphon-ss-john-and-paul
text:
  la: "Isti sunt Sancti, * qui pro Christi amóre minas hóminum contempsérunt: sancti Mártyres in regno cælórum exsúltant cum Angelis. O quam pretiósa est mors Sanctórum, qui assídue assístunt ante Dóminum, et ab ínvicem non sunt separáti!"
  en: "These are the holy ones * who for the love of Christ, recked nothing of the threats of men. In the kingdom of heaven the holy martyrs are filled with joy in the company of Angels. O how precious in the sight of the Lord was the death of these His saints who now stand day and night in His presence and are not divided the one from the other."
status:
  la: verified
  en: verified
