id: collect-st-john-nepomucene
text:
  la: |
    Orémus.
    Deus, qui ob invíctum beáti Joánnis sacramentále siléntium, nova Ecclésiam tuam martýrii
    coróna decorásti: da nobis, ejus intercessióne et exémplo, línguam caute custodíre; ac
    ómnia pótius mala, quam ánimæ detriméntum, in hoc sǽculo toleráre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who for the unconquered sacramental silence of blessed John didst adorn thy
    Church with a new crown of martyrdom: grant us, by his intercession and example, to
    guard our tongue with care, and to endure any evil in this world rather than harm to the
    soul.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: draft
