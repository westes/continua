# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad3-5-QuinqueVulneraDNJC.txt (Duplex majus, Friday of the third week of Lent). English is this project's own translation, marked draft.
id: none-capitulum-five-holy-wounds
text:
  la: |
      Trádidit Christus in mortem ánimam suam, et cum scelerátis reputátus est: et ipse peccáta multórum tulit, et pro transgressóribus rogávit.
      R. Deo grátias.
      V. Oblátus est quia ipse vóluit.
      R. Et livóre ejus sanáti sumus.
  en: |
      Christ delivered his soul unto death, and was reputed with the wicked: and he bore the sins of many, and prayed for the transgressors.
      R. Thanks be to God.
      V. He was offered because it was his own will.
      R. And by his bruises we are healed.
citation:
  la: "Is 53:12"
  en: "Isaiah 53:12"
status:
  la: verified
  en: draft
