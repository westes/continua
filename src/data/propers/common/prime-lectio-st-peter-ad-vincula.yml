# St. Peter's own minor-hour text, shared by Ss. Peter and Paul and St. Peter
# ad Vincula (both feasts are about Peter himself; extracted from their
# independently-authored files and confirmed identical). Previously held in
# prime-lectio-prima-common-of-st-peter.yml as a pseudo-Common; now each feast's own proper.
# Sourced from web/www/horas/Latin/Sancti/06-29.txt's own [Lectio Prima] and its
# English counterpart.
# Used by Peter in Chains: Sancti/08-01.txt's [Lectio Prima] is @Sancti/06-29.
id: prime-lectio-st-peter-ad-vincula
text:
  la: "Et Petrus ad se revérsus dixit: Nunc scio vere quia misit Dóminus Angelum suum, et erípuit me de manu Heródis et de omni exspectatióne plebis Judæórum."
  en: "And when Peter was come to himself, he said Now I know of a surety that the Lord hath sent His Angel, and hath delivered me out of the hand of Herod, and from all the expectation of the people of the Jews."
citation:
  la: "Act 12:11"
  en: "Acts 12:11"
status:
  la: verified
  en: verified
