id: terce-capitulum-patronage-of-st-joseph
text:
  la: |
    Gen 49:26 Benedictiónes patris tui confortátæ sunt benedictiónibus patrum ejus, donec veníret Desidérium cóllium æternórum: fiant in cápite Joseph, et in vértice Nazarǽi inter fratres suos.
    R. Deo grátias.
    V. Confitébor nómini tuo, allelúja.
    R. Quóniam adjútor et protéctor factus es mihi, allelúja.
  en: |
    Gen 49:26 The blessings of thy father are strengthened with the blessings of his fathers: until the desire of the everlasting hills should come; may they be upon the head of Joseph, and upon the crown of the Nazarite among his brethren
    R. Thanks be to God.
    V. I will give praise unto thy Name, Alleluia.
    R. For Thou hast been mine Helper and Defender, Alleluia.
