# web/www/horas/Latin/SanctiM/10-03b.txt's [Capitulum Sexta] with the matching minor-hour versicle from SanctiM's [Responsory SextaM]. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: sext-capitulum-st-therese-of-lisieux
text:
  la: |
    Quómodo si cui mater blandiátur, ita ego consolábor vos, et in Jerúsalem consolabímini.
    R. Deo grátias.
    V. Anima mea, exsultábit in Dómino.
    R. Et delectábitur super salutári suo.
  en: |
    As one whom the mother caresseth, so will I comfort you, and you shall be comforted in Jerusalem.
    R. Thanks be to God.
    V. My soul shall rejoice in the Lord.
    R. And shall be delighted in his salvation.
citation:
  la: "Is 66:13"
  en: "Is 66:13"
status:
  la: verified
  en: draft
