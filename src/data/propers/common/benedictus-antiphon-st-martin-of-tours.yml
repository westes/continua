# Verified against Divinum Officium (Latin/English Sancti/11-11.txt's own
# [Ant 1] — the Lauds-hour antiphon, not Terce's.
id: benedictus-antiphon-st-martin-of-tours
text:
  la: "O beátum virum, * cujus ánima paradísum póssidet! Unde exsúltant Ángeli, lætántur Archángeli, chorus Sanctórum proclámat, turba Vírginum invítat: Mane nobíscum in ætérnum."
  en: "O how blessed a man is he! * His soul hath entered into possession in Paradise. There the Angels cry aloud for joy, there the Archangels make glad, there the whole company of the Saints do shout, there the army of the Virgins do call others to follow, (saying:) Make thine everlasting abode with us."
status:
  la: verified
  en: verified
