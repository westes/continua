# Sourced from web/www/horas/Latin/Sancti/10-15.txt's own [Hymnus
# Laudes] and English/Sancti/10-15.txt's own translation.
id: lauds-hymn-st-teresa-of-avila
text:
  la: >-
    Hæc est dies, qua cándidæ

    Instar colúmbæ, cǽlitum

    Ad sacra templa spíritus

    Se tránstulit Terésiæ.


    Sponsíque voces áudiit:

    Veni, soror, de vértice

    Carméli ad Agni núptias;

    Veni ad corónam glóriæ.


    Te, Sponse Jesu Vírginum,

    Beáti adórent órdines,

    Et nuptiáli cántico

    Laudent per omne sǽculum. Amen.
  en: >-
    Behold the blessed morning,

    When, like a snow-white dove,

    Thy soul arose, Theresa,

    To join the choirs above.


    The Bridegroom calls: "From Carmel

    Come, sister, unto me,

    Partake the Lamb's high nuptials;

    Thy crown awaiteth thee."


    O Jesus, tender Bridegroom,

    By holy virgin throngs

    Be evermore surrounded,

    Be praised in endless songs. Amen.
status:
  la: verified
  en: verified
