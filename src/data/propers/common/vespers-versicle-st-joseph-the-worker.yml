id: vespers-versicle-st-joseph-the-worker
text:
  la: |
    V. Solémnitas est hódie sancti Joseph, allelúja.
    R. Qui mánibus suis Fílio Dei ministrávit, allelúja.
  en: |
    V. Today is the solemnity of holy Joseph, alleluia.
    R. Who with his hands ministered to the Son of God, alleluia.
