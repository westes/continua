# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, the Commemoration of St. Paul's own day (2026-06-30) -- the
# Benedictus antiphon. Corrects the previous version of this file, which
# had been sourced from the Roman/secular rite's Sancti/06-30.txt's own
# [Ant 1] instead: real but different text from what Monastic 1617
# actually renders at Lauds, same mistake as St. Lawrence's earlier fix
# -- the same text as the Conversion of St. Paul's own (already
# corrected), confirmed independently rather than assumed.
id: benedictus-antiphon-commemoration-of-st-paul
text:
  la: "Vos qui secúti estis me, sedébitis super sedes, judicántes duódecim tribus Israël, dicit Dóminus."
  en: "Thus saith the Lord: Ye, which have followed Me, shall sit upon twelve thrones, judging the twelve tribes of Israel."
status:
  la: verified
  en: verified
