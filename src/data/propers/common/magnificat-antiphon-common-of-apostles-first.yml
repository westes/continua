# First Vespers Magnificat antiphon for this Common: Latin/Commune/C1.txt's own
# [Ant 1] (and its English counterpart), where it differs from [Ant 3]. Second
# Vespers' [Ant 3] is magnificat-antiphon-common-of-apostles.yml (the default); see
# hours/resolve-common.ts's withVespersVariant.
id: magnificat-antiphon-common-of-apostles-first
text:
  la: "Tradent enim vos * in concíliis, et in synagógis suis flagellábunt vos, et ante reges et prǽsides ducémini propter me in testimónium illis, et Géntibus."
  en: "For they shall deliver you * up to councils: and in the synagogues you shall be beaten: and you shall stand before governors and kings for my sake, for a testimony unto them."
status:
  la: verified
  en: verified
