# First Vespers Magnificat antiphon: web/www/horas/Latin/Sancti/11-22.txt's own [Ant 1]
# and its English counterpart. Second Vespers' [Ant 3] is
# st-cecilia-magnificat-antiphon.yml (the default); see hours/resolve-common.ts's
# withVespersVariant.
id: st-cecilia-magnificat-antiphon-first
text:
  la: "Est secrétum, * Valeriáne, quod tibi volo dícere: Angelum Dei hábeo amatórem, qui nímio zelo custódit corpus meum."
  en: "Valerian! there is a secret * which I wish to tell thee. I have an Angel of God for a lover, and he is very jealous to keep my body."
status:
  la: verified
  en: verified
