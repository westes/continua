# St. Bernard: proper Lauds hymn, Latin/SanctiM/08-20.txt's [Hymnus Laudes]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
id: lauds-hymn-st-bernard
text:
  la: |
    Lacte quondam profluéntes,
    Ite, montes vos procul:
    Ite, colles, fusa quondam
    Unde mellis flúmina;
    Israël, jactáre late
    Manna priscum désine.

    Ecce cujus corde sudant,
    Cujus ore prófluunt
    Dulcióres lacte fontes,
    Mellis amnes ǽmuli:
    Ore tanto, corde tanto
    Manna nullum dúlcius.

    Quæris unde duxit ortum
    Tanta lactis cópia;
    Unde favus, unde prompta
    Tanta mellis suávitas;
    Unde tantum manna fluxit,
    Unde tot dulcédines.

    Lactis imbres Virgo fudit
    Cǽlitus puérpera:
    Mellis amnes os leónis
    Excitávit mórtui:
    Manna sylvæ, cælitúmque
    Solitúdo próxima.

    Doctor o Bernárde, tantis
    Aucte cæli dótibus,
    Lactis hujus, mellis hujus,
    Funde rores désuper;
    Funde stillas, plenióre
    Jam potítus gúrgite.

    Summa summo laus Parénti,
    Summa laus et Fílio:
    Far tibi sit, sancte, manans
    Ex utróque, Spíritus;
    Ut fuit, nunc et per ævum
    Compar semper glória.
    Amen.
  en: |
    Ye mountains once flowing with milk,
    depart far hence;
    depart, ye hills, whence rivers of honey
    once poured;
    O Israel, cease to boast far and wide
    of the ancient manna.

    Behold him from whose heart they flow,
    from whose mouth pour forth fountains
    sweeter than milk, rivals
    of rivers of honey:
    from so great a mouth, so great a heart,
    no manna is sweeter.

    Dost thou ask whence arose
    so great a plenty of milk;
    whence the honeycomb, whence so ready
    a sweetness of honey;
    whence so much manna flowed,
    whence so many sweetnesses?

    The Virgin, heavenly Mother,
    poured out showers of milk;
    the mouth of the dead lion
    stirred up rivers of honey;
    the manna of the forest, and the solitude
    nearest to the dwellers in heaven.

    O Doctor Bernard, enriched
    with such gifts of heaven,
    pour down from above the dews
    of this milk, of this honey;
    pour out the drops, now possessing
    a fuller flood.

    Highest praise to the supreme Father,
    highest praise to the Son:
    may the Spirit, flowing forth from both,
    be as bread to thee, O holy one;
    as it was, now and for ever,
    equal glory.
    Amen.
status:
  la: verified
  en: draft
