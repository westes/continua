# Was a copy-paste bug carrying Apparition of St. Michael's own capitulum
# ("Significávit Deus...") under Gabriel's id -- found in passing while
# authoring his Matins psalmody (see matins-psalmody-overrides/saints/
# st-gabriel-archangel.yml's own header). His real capitulum, read
# directly from the reference engine's `web/www/horas/{Latin,English}/
# Sancti/03-24.txt` (`[Capitulum Laudes]`), is proper to Gabriel
# specifically -- Daniel's own account of the angel's visitation, not
# shared with Apparition. `03-24.txt`'s whole-file default is "ex
# Sancti/05-08" but this block is one of its own explicit overrides,
# same pattern as his Matins antiphons.
id: lauds-capitulum-st-gabriel-archangel
text:
  la: "Ecce vir Gábriel, quem víderam in visióne a princípio, cito volans tétigit me in témpore sacrifícii vespertíni. Et dócuit me, et locútus est mihi, dixítque: Dániel, nunc egréssus sum ut docérem te, et intellégeres."
  en: "Behold, the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation; and he informed me, and talked with me, and said: O Daniel, I am now come forth to give thee skill and understanding."
citation:
  la: "Dan 9:21-22"
  en: "Dan 9:21-22"
status:
  la: verified
  en: verified
