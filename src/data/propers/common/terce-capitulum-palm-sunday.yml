id: terce-capitulum-palm-sunday
text:
  la: |
    Phil 2:5-7 Fratres: Hoc enim sentíte in vobis, quod et in Christo Jesu: qui, cum in forma Dei esset, non rapínam arbitrátus est esse se æquálem Deo: sed semetípsum exinanívit, formam servi accípiens, in similitúdinem hóminum factus, et hábitu invéntus ut homo.
    R. Deo grátias.
    V. Érue a frámea, Deus, ánimam meam.
    R. Et de manu canis únicam meam.
  en: |
    Phil 2:5-7 Brothers: For let this mind be in you, which was also in Christ Jesus: Who being in the form of God, thought it not robbery to be equal with God: But emptied himself, taking the form of a servant, being made in the likeness of men, and in habit found as a man.
    R. Thanks be to God.
    V. Deliver, O God, my soul from the sword.
    R. My only one from the hand of the dog.
