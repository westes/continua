id: collect-st-cyril-of-jerusalem
text:
  la: |
    Orémus.
    Da nobis, quǽsumus, omnípotens Deus, beato Cyríllo Pontífice intercedénte: te solum
    verum Deum, et quem misísti Jesum Christum ita cognóscere; ut inter oves, quæ vocem
    ejus áudiunt, perpétuo connumerári mereámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O Almighty God, grant unto us, we beseech thee, at the prayers of thy blessed Bishop
    Cyril, so to know thee, the only true God, and Jesus Christ Whom Thou hast sent, that
    we may hear His Voice, and He may give unto us eternal life.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
