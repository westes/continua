# Verified against Divinum Officium (Monastic Tridentinum 1617), Terce
# live query, St. Andrew's own day (2026-11-30, clean year).
id: terce-capitulum-st-andrew
text:
  la: "Fratres: Corde enim créditur ad justítiam, ore autem conféssio fit ad salútem. Dicit enim Scriptúra: Omnis, qui credit in illum, non confundétur. R. Deo grátias. V. In omnem terram exívit sonus eórum. R. Et in fines orbis terræ verba eórum."
  en: "Brothers: For, with the heart, we believe unto justice; but, with the mouth, confession is made unto salvation. For the scripture saith: Whosoever believeth in him, shall not be confounded. R. Thanks be to God. V. Their sound hath gone forth into all the earth: R. And their words unto the ends of the world."
citation:
  la: "Rom 10:10-11"
  en: "Rom 10:10-11"
status:
  la: verified
  en: verified
