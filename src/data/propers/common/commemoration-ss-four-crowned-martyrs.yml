# Ant+V/R+collect commemoration bundle, same combined-bundle shape as
# ss-marius-martha-audifax-and-abachum-commemoration.yml -- Ant 2/Versum 2
# are the standard de-Communi pairing for the Common of Several Martyrs
# (C3/C3a, their own real common per [Rule]), already-verified Common
# text, not proper to these five.
id: commemoration-ss-four-crowned-martyrs
text:
  la: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, qui gloriósos Mártyres fortes in sua confessióne cognóvimus, pios apud te in nostra intercessióne sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    Grant, we beseech thee, O Almighty God: that we who know thy glorious Martyrs to have been valiant in confessing thee, may find them favorable in interceding for us before thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
