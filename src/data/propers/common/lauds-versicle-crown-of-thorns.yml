# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
id: lauds-versicle-crown-of-thorns
text:
  la: |
      V. Eris coróna glóriæ in manu Dómini.
      R. Et diadéma regni in manu Dei tui.
  en: |
      V. Thou shalt be a crown of glory in the hand of the Lord.
      R. And a royal diadem in the hand of thy God.
