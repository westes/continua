id: terce-capitulum-lent-4
text:
  la: |
    Gal 4:22-24 Fratres: Scriptum est, quóniam Abraham duos fílios hábuit: unum de ancílla, et unum de líbera: sed qui de ancílla, secúndum carnem natus est: qui autem de líbera, per repromissiónem: quæ sunt per allegoríam dicta.
    R. Deo grátias.
    V. Ipse liberávit me de láqueo venántium.
    R. Et a verbo áspero.
  en: |
    Gal 4:22-24 Brothers: For it is written that Abraham had two sons: the one by a bondwoman, and the other by a free woman. But he who was of the bondwoman, was born according to the flesh: but he of the free woman, was by promise, which things are said by an allegory.
    R. Thanks be to God.
    V. For he hath delivered me from the snare of the hunters.
    R. And from the sharp word.
