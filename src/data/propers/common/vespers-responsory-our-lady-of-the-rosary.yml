# SanctiM/10-07.txt's [Responsory Vespera] is `@Sancti/10-07:Responsory
# Breve Sexta` ("Post partum, Virgo"), with its English counterpart.
id: vespers-responsory-our-lady-of-the-rosary
text:
  la: |
    R.br. Post partum, Virgo, * Invioláta permansísti.
    R. Post partum, Virgo, * Invioláta permansísti.
    V. Dei Génetrix, intercéde pro nobis.
    R. Invioláta permansísti.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Post partum, Virgo, * Invioláta permansísti.
  en: |
    R.br. After childbirth * thou still remainest a Virgin.
    R. After childbirth * thou still remainest a Virgin.
    V. Mother of God, pray for us.
    R. Thou still remainest a Virgin.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. After childbirth * thou still remainest a Virgin.
status:
  la: verified
  en: verified
