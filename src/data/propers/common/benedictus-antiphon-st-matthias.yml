# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Matthias's own day (2026-02-24) -- the Benedictus
# antiphon (Matt 19:27ff). The source's own English page rendered a real
# but jarringly modern translation ("You who left all... you will have
# eternal life"), out of register with every other antiphon in this
# project -- reworded here to match (the underlying verse's standard
# Douay-Rheims wording), so marked `draft` rather than `verified`.
id: benedictus-antiphon-st-matthias
text:
  la: "Vos qui reliquístis ómnia, et secúti estis me, céntuplum accipiétis, et vitam ætérnam possidébitis."
  en: "Ye who have left all things, and have followed me, shall receive an hundredfold, and shall possess life everlasting."
status:
  la: verified
  en: draft
