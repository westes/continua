id: lauds-capitulum-st-joseph
text:
  la: "Vir fidélis multum laudábitur. Et, qui custos est Dómini sui, glorificábitur."
  en: "A faithful man shall be much praised: and he that is the keeper of his master, shall be glorified."
citation:
  la: "Prov 28:20; 27:18"
  en: "Prov 28:20; 27:18"
status:
  la: verified
  en: verified
