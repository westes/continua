# Verified against Divinum Officium ("Psalterium/Common/Prayers.txt",
# [Alleluia] section's 2nd line). Same opening versicle as
# opening-alleluia.yml, but with "Allelúia" replaced by "Laus tibi,
# Dómine, Rex ætérnæ glóriæ" — used Septuagesima through Holy Saturday
# instead of the default. See hours/opening-versicle.ts.
id: opening-laus-tibi
text:
  la: |
    V. Deus ✠ in adjutórium meum inténde.
    R. Dómine, ad adjuvándum me festína.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen. Laus tibi, Dómine, Rex ætérnæ glóriæ.
  en: |
    V. O God, ✠ come to my assistance;
    R. O Lord, make haste to help me.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. As it was in the beginning, is now, * and ever shall be, world without end. Amen. Praise be to thee, O Lord, King of eternal glory.
status:
  la: verified
  en: verified
