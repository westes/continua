# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, the Nativity of St. John the Baptist's own day
# (2026-06-24) -- the Benedictus antiphon (Luke 1:64,68, the very verse
# the Benedictus canticle itself opens with). Corrects the previous
# version of this file, which had been sourced from the Roman/secular
# rite's Sancti/06-24.txt's own [Ant 1] instead: real but different text
# from what Monastic 1617 actually renders at Lauds, same mistake as
# St. Lawrence's earlier fix.
id: nativity-of-st-john-the-baptist-antiphon
text:
  la: "Apértum est os Zacharíæ, et prophetávit dicens: Benedíctus Deus Israël."
  en: "And the mouth of Zacharias was opened, and he prophesied, saying: Blessed be the Lord God of Israel."
status:
  la: verified
  en: verified
