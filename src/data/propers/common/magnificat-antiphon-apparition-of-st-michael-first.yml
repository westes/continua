id: magnificat-antiphon-apparition-of-st-michael-first
text:
  la: "Dum sacrum mystérium * cérneret Joánnes, Archángelus Míchaël tuba cécinit: Ignósce, Dómine, Deus noster, qui áperis librum, et solvis signácula ejus, allelúja."
  en: "While as John was gazing * upon the holy mystery, the Archangel Michael sounded his trumpet: Forgive us, O Lord our God, Which openest the book, and loosest the seals thereof. Alleluia."
