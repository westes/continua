# Ant+V/R+collect commemoration bundle. Ant 2 is the source's own proper
# `[Ant 2]` from `Sancti/10-25n.txt` ("Exiit qui séminat...", the Sower
# parable), not a generic Common substitution -- a real proper antiphon.
# Versicle is the standard Common of a Confessor Not a Pontiff (C5)
# de-Communi pairing (lauds-versicle-common-of-a-confessor.yml), since the
# source's own file has no distinct [Versum 2] of its own.
id: commemoration-st-isidore-the-farmer
text:
  la: |
    Ant. Exiit qui séminat * semináre semen suum, et áliud cécidit in terram bonam, et ortum fecit fructum céntuplum.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Da nobis, quǽsumus, miséricors Deus, beáto Isidóro Agrícola Confessóre tuo intercedénte, supérbe non sápere: sed ejus méritis et exémplis plácita tibi semper humilitáte deservíre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The sower went out * to sow his seed; and some fell upon good ground, and sprang up and yielded fruit a hundred-fold.
    V. The Lord guided the just in right paths.
    R. And showed him the kingdom of God.
    Let us pray.
    God of mercy, at the intercession of St. Isidore the Farmer, grant that we may not have feelings of pride, but may be helped by his merits and guided by his example to serve thee always with the humility which pleases thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
