# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, the Nativity of the Blessed Virgin Mary's own day
# (2026-09-08) -- the Benedictus antiphon. Corrects the previous version
# of this file, which had been sourced from the Roman/secular rite's
# Sancti/09-08.txt's own [Ant 1] instead: real but different text from
# what Monastic 1617 actually renders at Lauds, same mistake as
# St. Lawrence's earlier fix.
id: benedictus-antiphon-nativity-bvm
text:
  la: "Nativitátem hodiérnam perpétuæ Vírginis Genitrícis Dei Maríæ solémniter celebrémus, qua celsitúdo throni procéssit, allelúia."
  en: "Let us this day keep solemnly the Birthday of Mary, Mother but still Maiden, her Birth, a step toward the loftiness of her throne. Alleluia."
status:
  la: verified
  en: verified
