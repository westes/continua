id: st-vincent-ferrer-collect
text:
  la: |
    Orémus.
    Deus, qui Ecclésiam tuam beáti Vincéntii Confessóris tui méritis et prædicatióne
    illustráre dignátus es: concéde nobis fámulis tuis; ut et ipsíus instruámur exémplis
    et ab ómnibus ejus patrocínio liberémur advérsis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O God, Who wast pleased to enlighten thy Church through the worthy deeds and Gospel
    preaching of thy blessed Confessor Vincent, grant unto us thy servants grace so to
    order our lives after his example, that we, being helped by his protection, may by
    thee be ever delivered from all evil.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    ℟. Amen.
