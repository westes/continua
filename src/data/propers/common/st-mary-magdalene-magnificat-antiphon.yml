# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/07-22.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution. (This feast's own Benedictus antiphon,
# st-mary-magdalene-antiphon.yml, already correctly sourced [Ant 2].)
id: st-mary-magdalene-magnificat-antiphon
text:
  la: "Múlier * quæ erat in civitáte peccátrix, áttulit alabástrum unguénti, et stans retro secus pedes Dómini, lácrimis cœpit rigáre pedes ejus, et capíllis cápitis sui tergébat."
  en: "A woman * in the city, which was a sinner, brought an alabaster box of ointment, and stood at the Lord's feet, behind him, weeping, and began to wash his feet with tears, and did wipe them with the hairs of her head."
status:
  la: verified
  en: verified
