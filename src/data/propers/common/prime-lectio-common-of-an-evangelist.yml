id: prime-lectio-common-of-an-evangelist
text:
  la: "Ibant Apóstoli gaudéntes a conspéctu concílii, quóniam digni hábiti sunt pro nómine Jesu contuméliam pati."
  en: "V. And the Apostles indeed went from the presence of the council, rejoicing that they were accounted worthy to suffer reproach for the name of Jesus."
citation:
  la: "Act 5:41"
  en: "Acts 5:41"
status:
  la: verified
  en: verified
