id: terce-capitulum-sacred-heart
text:
  la: |
    Eph 3:8-9 Fratres: Mihi ómnium sanctórum mínimo data est grátia hæc, in géntibus evangelizáre investigábiles divítias Christi; et illumináre omnes, quæ sit dispensátio sacraménti abscónditi a sǽculis in Deo.
    R. Deo grátias.
    V. Ego dixi, Dómine, miserére mei.
    R. Sana ánimam meam quia peccávi tibi.
  en: |
    Eph 3:8-9 Brethren: Unto me, who am less than the least of all saints, is this grace given, that I should preach among the Gentiles the unsearchable riches of Christ; and to make all men see what is the fellowship of the Mystery, which from the beginning of the world hath been hid in God.
    R. Thanks be to God.
    V. I said: Lord, be merciful unto me.
    R. Heal my soul, for I have sinned against thee.
