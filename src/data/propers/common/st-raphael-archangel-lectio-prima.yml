id: st-raphael-archangel-lectio-prima
text:
  la: "Tempus est ut revértar ad eum qui me misit: vos autem benedícite Deum, et narráte ómnia mirabília ejus."
  en: "It is time therefore that I return to him that sent me: but bless ye God, and publish all his wonderful works."
citation:
  la: "Tob 12:20"
  en: "Tob 12:20"
status:
  la: verified
  en: verified
