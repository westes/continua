# Sancti/10-24.txt [Capitulum Nona] (Terce takes Lauds' chapter, None takes Lectio Prima, per the reference engine); versicle pair from Sancti/05-08.txt [Responsory Breve Nona], which 10-24 inherits ('ex Sancti/05-08').
id: none-capitulum-st-raphael-archangel
text:
  la: |
    Tempus est ut revértar ad eum qui me misit: vos autem benedícite Deum, et narráte ómnia mirabília ejus.
    R. Deo grátias.
    V. In conspéctu Angelórum psallam tibi, Deus meus.
    R. Adorábo ad templum sanctum tuum, et confitébor nómini tuo.
  en: |
    It is time therefore that I return to him that sent me: but bless ye God, and publish all his wonderful works.
    R. Thanks be to God.
    V. Before the Angels will I sing praise unto thee, O my God.
    R. I will worship toward thy holy Temple, and praise thy Name.
citation:
  la: "Tob 12:20"
  en: "Tob 12:20"
status:
  la: verified
  en: verified
