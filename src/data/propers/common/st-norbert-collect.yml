id: st-norbert-collect
text:
  la: |
    Orémus.
    Deus, qui beátum Norbértum Confessórem tuum atque Pontíficem verbi tui præcónem
    exímium effecísti, et per eum Ecclésiam tuam nova prole fecundásti: præsta,
    quǽsumus; ut, ejúsdem suffragántibus méritis, quod ore simul et ópere dócuit, te
    adjuvánte, exercére valeámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who made blessed Norbert, thy Confessor and Bishop, a brilliant preacher of
    thy word, and through him enriched thy Church with a new religious family, grant, we
    beseech thee, that by his prayerful intercession and thy help, we may be able to do
    what he has taught us by his words and deeds.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
