id: terce-capitulum-christ-the-king
text:
  la: |
    Col 1:12-13 Fratres: Grátias ágimus Deo Patri, qui dignos nos fecit in partem sortis sanctórum in lúmine, qui erípuit nos de potestáte tenebrárum, et tránstulit in regnum Fílii dilectiónis suæ.
    R. Deo grátias.
    V. Afférte Dómino, famíliæ populórum.
    R. Afférte Dómino glóriam et impérium.
  en: |
    Col 1:12-13 Brethren: We give thanks to God the Father, who hath made us worthy to be partakers of the lot of the saints in light, who hath delivered us from the power of darkness, and hath translated us into the kingdom of the Son of his love.
    R. Thanks be to God.
    V. Bring ye to the Lord, O ye families of the nations.
    R. Bring ye to the Lord glory and empire.
