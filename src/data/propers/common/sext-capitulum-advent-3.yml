id: sext-capitulum-advent-3
text:
  la: |
    Phil 4:6 Nihil sollíciti sitis: sed in omni oratióne, et obsecratióne cum gratiárum actióne, petitiónes vestræ innotéscant apud Deum.
    R. Deo grátias.
    V. Osténde nobis, Dómine, misericórdiam tuam.
    R. Et salutáre tuum da nobis.
  en: |
    Phil 4:6 Be nothing solicitous; but in every thing, by prayer and supplication, with thanksgiving, let your petitions be made known to God.
    R. Thanks be to God.
    V. Show us, O Lord, thy mercy.
    R. And grant us thy salvation.
