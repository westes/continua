id: magnificat-antiphon-st-hildegard
text:
  la: "Súbveni nobis, Hildegárdis virgo sanctíssima, ætérni regis sponsa, in cujus aula splendéscis sicut stella fulgentíssima."
  en: "Come to our aid, Hildegard, most holy virgin, spouse of the eternal King, in whose court thou shinest like a most radiant star."
status:
  la: verified
  en: draft
