# Sexta] and English/Sancti/01-21.txt's own translation.
id: sext-capitulum-st-agnes
text:
  la: "Liberásti me secúndum multitúdinem misericórdiæ nóminis tui a rugiéntibus, præparátis ad escam, de mánibus quæréntium ánimam meam, et de multis tribulatiónibus quæ circumdedérunt me."
  en: "And thou hast delivered me, according to the multitude of the mercy of thy name, from them that did roar, prepared to devour. Out of the hands of them that sought my life, and from the gates of afflictions, which compassed me about."
citation:
  la: "Sir 51:4-5"
  en: "Sir 51:4-5"
status:
  la: verified
  en: verified
