# web/www/horas/Latin/SanctiM/10-03b.txt's [Versum 2]. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: lauds-versicle-st-therese-of-lisieux
text:
  la: |
    V. Erit tibi Dóminus in lucem sempitérnam.
    R. Et Deus tuus in glóriam tuam.
  en: |
    V. The Lord shall be unto thee for an everlasting light.
    R. And thy God for thy glory.
