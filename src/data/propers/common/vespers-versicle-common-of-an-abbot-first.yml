# First Vespers versicle of the Common of Confessors: Latin/Commune/C4.txt
# [Versum 1] ("Amavit eum"; C5, C5b and C5c inherit it). Second Vespers uses
# [Versum 3] = "Justum deduxit" -- see the default file; see
# hours/resolve-common.ts's withVespersVariant. Confirmed against the local
# reference engine (2024-10-03 St. Francis, 2025-02-06 St. Romuald).
id: vespers-versicle-common-of-an-abbot-first
text:
  la: "V. Amávit eum Dóminus, et ornávit eum.\nR. Stolam glóriæ índuit eum."
  en: "V. The Lord loved him and beautified him.\nR. He clothed him with a robe of glory."
status:
  la: verified
  en: verified
