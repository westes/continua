# Ant+V/R+collect commemoration bundle, same combined-bundle shape as
# st-canute-commemoration.yml. Ant is the source's own Lauds [Ant 2]
# ("Fulgébunt justi...", a stock Wisdom 3:7 text also used elsewhere as a
# Common-of-several-Confessors antiphon, not unique to this file but still
# this file's own real choice, not a substitution). V/R is the source's
# own [Versum 3] cross-reference target, Commune/C1p's [Versum 2]
# ("Pretiósa in conspéctu Dómini..."), which does have a real English
# counterpart in the source (English/Commune/C1p.txt). The antiphon's
# English is this project's own translation (draft) -- no English exists
# for SanctiM/04-29M.txt itself; the collect is ss-odo-maiolus-odilo-and-
# hugh-of-cluny-collect.yml, also draft in English for the same reason.
id: ss-odo-maiolus-odilo-and-hugh-of-cluny-commemoration
text:
  la: |
    Ant. Fulgébunt justi, * et tamquam scintíllæ in arundinéto discúrrent, judicábunt natiónes, et regnábunt in ætérnum, allelúja.
    V. Pretiósa in conspéctu Dómini, allelúja.
    R. Mors Sanctórum ejus, allelúja.
    Orémus.
    Deus, qui nos Sanctórum tuórum et solemnitáte lætíficas, et imitatióne súscitas ad proféctum: præsta; ut quos venerámur offício, étiam piæ conversatiónis sequámur exémplo.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The righteous shall shine forth, * and dart about like sparks among the reeds; they shall judge the nations, and reign for ever, alleluia.
    V. Precious in the sight of the Lord, alleluia.
    R. Is the death of his saints, alleluia.
    Let us pray.
    O God, who dost gladden us by the solemn feast of Thy Saints, and dost rouse us by their example unto growth in virtue: grant that we, who venerate them by this office, may also follow the example of their holy manner of life.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: draft
