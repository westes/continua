# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: lauds-versicle-holy-shroud
text:
  la: |
      V. Dóminus regnávit, decórem índuit.
      R. Induit Dóminus fortitúdinem, et præcínxit se virtúte.
  en: |
      V. The Lord hath reigned, he is clothed with beauty.
      R. The Lord is clothed with strength, and hath girded himself with power.
status:
  la: verified
  en: draft
