# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/03-24.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast (own First Vespers
# [Ant 1] already covers st-gabriel-archangel-antiphon.yml, used for the
# Benedictus), not a Common substitution.
id: magnificat-antiphon-st-gabriel-archangel
text:
  la: "Archángelus Gábriel * ait ad Maríam: Non erit impossíbile apud Deum omne verbum. Dixit autem María: Ecce ancílla Dómini, fiat mihi secúndum verbum tuum. Et discéssit ab ea Angelus."
  en: "The Archangel Gabriel * said unto Mary: With God nothing shall be impossible. And Mary said: Behold the handmaid of the Lord; be it unto me according to thy word. And the Angel departed from her."
status:
  la: verified
  en: verified
