# Read directly from `Sancti/10-25n.txt`'s own [Oratio] and
# `English/Sancti/10-25n.txt`'s own translation.
id: st-isidore-the-farmer-collect
text:
  la: |
    Orémus.
    Da nobis, quǽsumus, miséricors Deus, beáto Isidóro Agrícola Confessóre tuo
    intercedénte, supérbe non sápere: sed ejus méritis et exémplis plácita tibi semper
    humilitáte deservíre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    God of mercy, at the intercession of St. Isidore the Farmer, grant that we may not
    have feelings of pride, but may be helped by his merits and guided by his example to
    serve thee always with the humility which pleases thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
