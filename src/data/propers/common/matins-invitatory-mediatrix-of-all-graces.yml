id: matins-invitatory-mediatrix-of-all-graces
text:
  la: "Christum Redemptórem, qui bona ómnia nos habére vóluit per Maríam: * Veníte, adorémus."
  en: "Christ the Redeemer, who willed that we should have all good things through Mary: * Come, let us adore."
