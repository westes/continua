# Vespers short responsory. Engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-11-09, the Dedication of the Basilica of the Most Holy Savior; the Nov 18 Dedication of the Basilicas of Ss. Peter and Paul, also ex C8, takes the same Common). Before this file the Common of a Dedication had no Lauds/Vespers bundle and both feasts fell through to the ferial chapter, responsory and hymn.
id: vespers-responsory-common-of-a-dedication
text:
  la: |
    R.br. Locus iste sanctus est, * In quo orat sacérdos.
    R. Locus iste sanctus est, * In quo orat sacérdos.
    V. Pro delíctis et peccátis pópuli.
    R. In quo orat sacérdos.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Locus iste sanctus est, * In quo orat sacérdos.
  en: |
    R.br. This place is holy, * wherein the Priest prayeth.
    R. This place is holy, * wherein the Priest prayeth.
    V. For the pardon of the transgressions and offences of the people.
    R. The Priest prayeth.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. This place is holy, * wherein the Priest prayeth.
status:
  la: verified
  en: verified
