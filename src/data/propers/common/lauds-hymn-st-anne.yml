# St. Anne: proper Lauds hymn, Latin/SanctiM/07-26r.txt's [Hymnus Laudes]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
id: lauds-hymn-st-anne
text:
  la: |
    Succédit nocti lúcifer,
    Quem mox auróra séquitur,
    Solis ortum prænúntians
    Mundum lustrántis lúmine.

    Christus sol est justítiæ,
    Auróra Mater grátiæ,
    Quam, Anna, præit rútilans
    Legis propéllens ténebras.

    Anna, radix ubérrima,
    Arbor tu salutífera,
    Virgam prodúcens flóridam
    Quæ Christum nobis áttulit.

    Glória tibi Dómine,
    Qui natus es de Vírgine,
    Cum Patre et sancto Spíritu,
    In sempitérna sǽcula.
    Amen.
  en: |
    The daystar follows the night,
    and soon the dawn follows him,
    foretelling the rising of the sun
    that lights the world with its radiance.

    Christ is the sun of justice,
    the Mother of grace the dawn,
    whom Anne, shining red, goes before,
    driving away the shadows of the Law.

    Anne, most fruitful root,
    thou saving tree,
    bringing forth the flowering branch
    that bore Christ to us.

    Glory to thee, O Lord,
    who wast born of the Virgin,
    with the Father and the Holy Spirit,
    for everlasting ages.
    Amen.
status:
  la: verified
  en: draft
