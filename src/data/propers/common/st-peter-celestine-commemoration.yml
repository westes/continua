# Own proper antiphon (st-peter-celestine-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-confessor-bishop (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-peter-celestine-collect.yml), unchanged.
id: st-peter-celestine-commemoration
text:
  la: |
    Ant. Euge, serve bone et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus, allelúja.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui beátum Petrum Cælestínum ad summi pontificátus ápicem sublimásti, quique illum humilitáti postpónere docuísti: concéde propítius; ut ejus exémplo cuncta mundi despícere, et ad promíssa humílibus prǽmia perveníre felíciter mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Well done, thou good and faithful servant thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord, alleluia.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who raised blessed Peter Celestine to the lofty dignity of Supreme Pontiff and taught him to prefer self-abasement instead; mercifully grant that by his example we may look upon all worldly things as naught, and may be worthy to reap in joy the rewards promised to the humble.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: draft
  en: draft
