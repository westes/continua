# Sancti/05-03.txt [Capitulum Nona] (Exaltation, Sancti/09-14, takes 'ex Sancti/05-03') and the non-Paschal responsory breve of Sancti/09-14.txt [Responsory Breve Nona]; Finding falls in Paschaltide and uses the -paschaltide variant.
id: none-capitulum-proper-to-the-finding-of-the-holy-cross
text:
  la: |
    Humiliávit semetípsum factus obédiens usque ad mortem, mortem autem Crucis. Propter quod et Deus exaltávit illum, et donávit illi nomen, quod est super omne nomen.
    R. Deo grátias.
    V. Omnis terra adóret te et psallat tibi.
    R. Psalmum dicat nómini tuo, Dómine.
  en: |
    He humbled himself, becoming obedient unto death, even to the death of the cross. For which cause God also hath exalted him, and hath given him a name which is above all names
    R. Thanks be to God.
    V. Let all the earth worship thee and sing unto thee.
    R. Let them sing praises to thy Name, O Lord.
citation:
  la: "Phil 2:8-9"
  en: "Phil 2:8-9"
status:
  la: verified
  en: verified
