id: lauds-responsory-common-of-a-martyr-bishop
text:
  la: |
    R.br. Glória et honóre * Coronásti eum, Dómine.
    ℟. Glória et honóre * Coronásti eum, Dómine.
    ℣. Et constituísti eum super ópera mánuum tuárum.
    ℟. Coronásti eum, Dómine.
    ℣. Glória Patri, et Fílio, * et Spirítui Sancto.
    ℟. Glória et honóre * Coronásti eum, Dómine.
  en: |
    R.br. Thou hast crowned him * with glory and honour, O Lord.
    ℟. Thou hast crowned him * with glory and honour, O Lord.
    ℣. And madest him to have dominion over the works of thy hands.
    ℟. With glory and honour, O Lord.
    ℣. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    ℟. Thou hast crowned him * with glory and honour, O Lord.
