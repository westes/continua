# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: matins-invitatory-holy-shroud
text:
  la: "Christum Dóminum, qui passiónis suæ memóriam in sacra síndone rénovat, * Veníte adorémus."
  en: "Christ the Lord, who renews the memory of his passion in the holy shroud, * O come, let us adore."
status:
  la: verified
  en: draft
