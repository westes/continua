# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt (Duplex majus, nine lessons, `ex C11`). English is the Douay-Rheims text from the project's scripture store, the part of the verses the source carries.
id: sext-capitulum-mediatrix-of-all-graces
text:
  la: |
      Audíte audiéntes me, et comédite bonum, et delectábitur in crassitúdine ánima vestra. Inclináte aurem vestram, et veníte ad me: audíte, et vivet ánima vestra.
      R. Deo grátias.
      V. A perículis cunctis líbera nos semper.
      R. Virgo gloriósa et benedícta.
  en: |
      Hearken diligently to me, and eat that which is good, and your soul shall be delighted in fatness. Incline your ear and come to me: hear and your soul shall live.
      R. Thanks be to God.
      V. From all dangers deliver us ever.
      R. O glorious and blessed Virgin.
citation:
  la: "Is 55:2-3"
  en: "Isaiah 55:2-3"
status:
  la: verified
  en: verified
