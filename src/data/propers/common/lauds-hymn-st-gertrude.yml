# Sourced from web/www/horas/Latin/SanctiM/11-16.txt's own [Hymnus
# Laudes]. No English rendering exists in the reference engine's data;
# translated here directly.
id: lauds-hymn-st-gertrude
text:
  la: >-
    Ad sacros virgo thálamos anhélans

    Núptias cælo celebráre gestit,

    Et piis votis nímium morántem

    Próvocat horam.


    Ægra cum languet, maniféstus adstat

    Cǽlitum turma comitánte Christus,

    Atque divíni récreat jacéntem

    Lúmine vultus.


    Surge, conclámat, soror atque sponsa,

    En tibi pando penetrále cordis,

    Ut triumpháli reseráta scandas

    Sídera curru.


    Ista vox omnes pénetrat medúllas

    Atque compáges ánimi resólvit:

    Spíritus liber volat in reclúsa

    Víscera Christi.


    Régios Agni thálamos peténtem

    Júbilans stipat súperum coróna,

    Atque compléxus et amíca cantat

    Óscula Sponsi.


    Vírginum Sponsum, superúmque regem

    Vírginum sanctæ célebrent choréæ,

    Et sacram supplex Tríadem per ævum

    Orbis adóret. Amen.
  en: >-
    The virgin, panting for the sacred bridal chamber, * longs to celebrate her nuptials in heaven, and with pious prayers urges on the hour that seems to tarry too long.


    When she lay sick and languishing, Christ stood manifestly by her, * with a company of the heavenly host, and revived her, as she lay, with the light of His divine countenance.


    Arise, He cried, my sister and my spouse; * behold, I open to thee the inmost chamber of my Heart, that, its door unbarred, thou mayest ascend the stars in a triumphal chariot.


    That voice pierced through her very marrow, * and loosed the framework of her soul: her spirit flew free into the hidden depths of Christ.


    As she sought the royal bridal chamber of the Lamb, * a rejoicing crown of the blessed thronged about her, and sang of the embraces and loving kisses of the Bridegroom.


    Let the holy choirs of virgins celebrate * the Bridegroom of virgins and King of the blessed, and let the world in suppliant prayer adore the sacred Trinity for ever. Amen.
status:
  la: verified
  en: draft
