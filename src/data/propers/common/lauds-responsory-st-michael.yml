# Sept 29 (St. Michael, Dedication of the Basilica): engine Lauds render
# (Monastic Tridentinum 1617, command=prayLaudes, 2026-09-29). Unlike the
# Apparition's own (lauds-responsory-apparition-of-st-michael.yml), no Alleluia.
id: lauds-responsory-st-michael
text:
  la: |
    R.br. In conspéctu Angelórum * Psallam tibi, Deus meus.
    R. In conspéctu Angelórum * Psallam tibi, Deus meus.
    V. Adorábo ad templum sanctum tuum, et confitébor nómini tuo.
    R. Psallam tibi, Deus meus.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. In conspéctu Angelórum * Psallam tibi, Deus meus.
  en: |
    R.br. Before the Angels * will I sing praise unto thee, O my God.
    R. Before the Angels * will I sing praise unto thee, O my God.
    V. I will worship toward thy holy Temple, and praise thy Name.
    R. Will I sing praise unto thee, O my God.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Before the Angels * will I sing praise unto thee, O my God.
status:
  la: verified
  en: verified
