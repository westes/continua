# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: vespers-hymn-holy-shroud
text:
  la: |
      Glóriam sacræ celebremus omnes
      Sindonis: lætis recolamus hymnis.
      Et piis votis monuménta nostræ
      Certa salútis.

      Quæ refert semper veneránda Sindon,
      Sánguine impressis decoráta signis,
      Dum cruce ex alta tulit involutum
      Corpus Iesu.

      Reddit hæc sævos ánimo dolóres,
      Quos tulit casum miserátus Adæ,
      Christus humáni géneris Redémptor,
      Morte perempta.

      Saucium ferro latus, atque palmas,
      Et pedes clavis, lacerata flagris
      Membra, et infixam cápiti corónam
      Monstrat imágo.

      Quis pius siccis óculis, et absque
      Intimi cordis gémitu notata,
      Vivaque indignæ simulácra mortis
      Cérnere possit?

      Nostra cum solum tibi, Christe, culpa
      Causa tantorum fúerit malórum,
      Nostra debétur tibi vita: vitam
      Tradimus ipsam.

      Sit tibi, Fili, decus, atque virtus,
      Qui tuo mundum redimis cruóre.
      Quique cum summo Genitóre, et almo
      Flamine regnas. Amen.
  en: |
      Let us all celebrate the glory
      of the sacred Shroud; let us recall in joyful hymns,
      and with devout vows, the sure memorials
      of our salvation.

      The venerable Shroud ever recalls,
      adorned with signs impressed in blood,
      how it bore, taken down from the high cross,
      the wrapped body of Jesus.

      It brings back to the mind the cruel sorrows
      which Christ, the Redeemer of the human race,
      bore, pitying the fall of Adam,
      death being destroyed.

      The image shows the side pierced with iron,
      the palms and the feet with nails, the limbs
      torn with scourges, and the crown
      fixed upon the head.

      What pious man could look, with dry eyes
      and without deep groaning of the heart,
      upon these marks, and the living images
      of an undeserved death?

      Since our guilt alone, O Christ,
      was the cause of so great evils to thee,
      our life is owed to thee: our very life
      we give up to thee.

      To thee, Son, be glory and power,
      who redeemest the world with thy blood,
      and who reignest with the supreme Father
      and the loving Spirit. Amen.
