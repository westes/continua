id: prime-lectio-five-holy-wounds
text:
  la: "Trádidit Christus in mortem ánimam suam, et cum scelerátis reputátus est: et ipse peccáta multórum tulit, et pro transgressóribus rogávit."
  en: "Christ delivered his soul unto death, and was reputed with the wicked: and he bore the sins of many, and prayed for the transgressors."
citation:
  la: "Is 53:12"
  en: "Isaiah 53:12"
