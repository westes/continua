id: visitation-of-the-bvm-collect
text:
  la: |
    Orémus.
    Fámulis tuis, quǽsumus, Dómine, cæléstis grátiæ munus impertíre: ut, quibus
    beátæ Vírginis partus éxstitit salútis exórdium; Visitatiónis ejus votíva
    solémnitas, pacis tríbuat increméntum.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant, O Lord, we beseech thee, unto all thy servants, the gift of thine heavenly
    grace, that even as the Blessed Virgin being made a Mother hath been unto them the
    first step unto their salvation, so the godly and solemn memorial of her
    Visitation may be the bringer of an increase of peace.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
