# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Peter's Chains's own day (2026-08-01) -- the Benedictus
# antiphon. Corrects the previous version of this file, which had been
# sourced from the Roman/secular rite's Sancti/08-01.txt's own [Ant 1]
# instead: real but different text from what Monastic 1617 actually
# renders at Lauds, same mistake as St. Lawrence's earlier fix -- shares
# the same text as the two Chair-of-Peter feasts' and Ss. Peter and
# Paul's own (all already corrected), confirmed independently rather
# than assumed.
id: benedictus-antiphon-st-peter-ad-vincula
text:
  la: "Quodcúmque ligáveris super terram, erit ligátum et in cælis; et quodcúmque sólveris super terram, erit solútum et in cælis: dicit Dóminus Simóni Petro."
  en: "Thus saith the Lord unto Simon Peter: Whatsoever thou shalt bind on earth, shall be bound in heaven; and whatsoever thou shalt loose on earth, shall be loosed in heaven."
status:
  la: verified
  en: verified
