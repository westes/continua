# Own proper antiphon (ss-john-and-paul-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-several-martyrs (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (ss-john-and-paul-collect.yml), unchanged.
id: ss-john-and-paul-commemoration
text:
  la: |
    Ant. Isti sunt Sancti, * qui pro Christi amóre minas hóminum contempsérunt: sancti Mártyres in regno cælórum exsúltant cum Angelis. O quam pretiósa est mors Sanctórum, qui assídue assístunt ante Dóminum, et ab ínvicem non sunt separáti!
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Quǽsumus, omnípotens Deus: ut nos gemináta lætítia hodiérnæ festivitátis excípiat, quæ de beatórum Joánnis et Pauli glorificatióne procédit; quos éadem fides et pássio vere fecit esse germános.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. These are the holy ones * who for the love of Christ, recked nothing of the threats of men. In the kingdom of heaven the holy martyrs are filled with joy in the company of Angels. O how precious in the sight of the Lord was the death of these His saints who now stand day and night in His presence and are not divided the one from the other.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    Almighty God, fill us, we beseech thee, with the twofold gladness which doth flow down upon this bright day from the glory of thy blessed servants John and Paul, whom one faith and one suffering made to be brothers indeed.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
