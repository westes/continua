# Verified against Divinum Officium (Monastic Tridentinum 1617), Sext
# live query, St. Stephen Protomartyr's own day (2029-12-26, clean year).
id: sext-capitulum-st-stephen-protomartyr
text:
  la: |
    Surrexérunt autem quidam de synagóga, quæ appellátur Libertinórum, et Cyrenénsium, et Alexandrinórum, et eórum qui erant a Cilícia, et Asia, disputántes cum Stéphano: et non póterant resístere sapiéntiæ, et Spirítui qui loquebátur.
    R. Deo grátias.
    V. Posuísti, Dómine, super caput ejus.
    R. Corónam de lápide pretióso.
  en: |
    Now there arose some of that which is called the synagogue of the Libertines, and of the Cyrenians, and of the Alexandrians, and of them that were of Cilicia and Asia, disputing with Stephen. And they were not able to resist the wisdom and the spirit that spoke.
    R. Thanks be to God.
    V. O Lord, Thou hast set a crown of precious stones.
    R. Upon his head.
citation:
  la: "Act 6:9-10"
  en: "Acts 6:9-10"
status:
  la: verified
  en: verified
