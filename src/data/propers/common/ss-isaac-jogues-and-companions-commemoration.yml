id: ss-isaac-jogues-and-companions-commemoration
text:
  la: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Deus, qui primítias fídei in boreálibus Américæ regiónibus sanctórum Mártyrum tuórum Isaáci, Joánnis, eorúmque Sociórum prædicatióne et sánguine consecrásti: concéde propítius; ut, eórum intercessióne, flórida christiánorum seges ubíque in dies augeátur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    O God, who, by the preaching and the blood of your holy Martyrs, Isaac, John, and their companions, consecrated the first fruits of the faith in the vast areas of North America, mercifully grant that, through their intercession, the fruitful harvest of Christians may everywhere increase day by day.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
