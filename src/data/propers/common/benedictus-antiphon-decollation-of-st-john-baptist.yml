# Verified against Divinum Officium (Latin/English Sancti/08-29.txt's own
# [Ant 1] — the Lauds-hour antiphon, not Terce's.
id: benedictus-antiphon-decollation-of-st-john-baptist
text:
  la: "Misso Heródes * spiculatóre, præcépit amputári caput Joánnis in cárcere. Quo audíto, discípuli ejus venérunt, et tulérunt corpus ejus, et posuérunt illud in monuménto."
  en: "Herod sent * an executioner, and commanded that John's head should be cut off in the prison. When they heard thereof, his disciples came and took up his body and laid it in a tomb."
status:
  la: verified
  en: verified
