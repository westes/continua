id: none-capitulum-st-agnes
text:
  la: "Laudábit usque ad mortem ánima mea Dóminum, quóniam éruis sustinéntes te, et líberas eos de manu angústiæ, Dómine, Deus noster."
  en: "My soul shall praise the Lord even to death. How thou deliverest them that wait for thee, O Lord, and savest them out of the hands of the nations."
citation:
  la: "Sir 51:8; 51:12"
  en: "Sir 51:8; 51:12"
status:
  la: verified
  en: verified
