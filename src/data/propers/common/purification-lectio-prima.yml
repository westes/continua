id: purification-lectio-prima
text:
  la: "Et placébit Dómino sacrifícium Juda et Jerúsalem sicut dies sǽculi et sicut anni antíqui, dicit Dóminus omnípotens."
  en: "And the sacrifice of Juda and of Jerusalem shall please the Lord, as in the days of old, and in the ancient years, said the almighty Lord."
citation:
  la: "Mal 3:4"
  en: "Mal 3:4"
status:
  la: verified
  en: verified
