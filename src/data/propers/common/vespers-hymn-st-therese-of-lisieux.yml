# Second Vespers hymn (also the default): web/www/horas/Latin/SanctiM/10-03b.txt's [Hymnus Vespera 3] ("Luce divína rutilántis aulæ"). First Vespers' is vespers-hymn-st-therese-of-lisieux-first.yml. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: vespers-hymn-st-therese-of-lisieux
text:
  la: |
    Luce divína rutilántis aulæ
    Sédibus, virgo, frúeris, secúndans
    Vota, promísso réfoves precántes
    Imbre rosárum.

    Sint rosæ nobis fídei supérnæ
    Lumen affúlgens, columénque rebus
    Spes in advérsis, et amóris almi
    Vívida virtus.

    Sint rosæ nobis tuus ille fidens
    Candor infántis Dómino, patérno
    Grata qui præbet vel acérba nostræ
    Númine vitæ.

    Præstet hoc nobis Déitas beáta
    Patris, ac Nati paritérque Sancti
    Spíritus, cujus réboat in omni
    Glória mundo.
    Amen.
  en: |
    In the divine light of the shining court
    thou enjoyest thy seat, O virgin; favouring our prayers,
    thou refreshest those who pray
    with the promised shower of roses.

    May the roses be to us the shining light
    of heavenly faith, and a support in all things,
    hope in adversity, and the living
    strength of kindly love.

    May the roses be to us thy trusting
    childlike candour before the Lord, which,
    by the Father's will, makes even the bitter things
    of our life pleasing.

    May the blessed Godhead grant us this,
    of the Father, and of the Son, and likewise of the Holy
    Spirit, whose glory echoes
    through all the world.
    Amen.
status:
  la: verified
  en: draft
