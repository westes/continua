# Engine render (Monastic Tridentinum 1617, command=prayPrima, 2025-03-16); Latin and English both taken from the page.
id: prime-antiphon-lent-2
text:
  la: "Dómine, * bonum est nos hic esse: si vis, faciámus hic tria tabernácula; tibi unum, Móysi unum, et Elíæ unum."
  en: "Lord, it is good for us to be here; * if Thou wilt, let us make here three tabernacles, one for thee, and one for Moses, and one for Elias."
