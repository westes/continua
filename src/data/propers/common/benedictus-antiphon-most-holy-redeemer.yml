# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). English is this project's own translation, marked draft.
id: benedictus-antiphon-most-holy-redeemer
text:
  la: "Ecce Deus noster iste, exspectavimus eum, et salvábit nos: sustinuimus eum; exsultabimus, et lætábimur in salutári ejus, allelúja."
  en: "Behold, this is our God, we have waited for him, and he will save us: this is the Lord, we have patiently waited for him; we shall rejoice and be glad in his salvation, alleluia."
status:
  la: verified
  en: draft
