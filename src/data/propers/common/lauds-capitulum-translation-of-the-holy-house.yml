# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/12-10-Domus.txt (Duplex majus, nine lessons, `ex C11`; the parts it marks `@Commune/C8` are read from Commune/C8.txt, the Common of a Dedication). English is the Douay-Rheims text from the project's scripture store, from "In all these" on (the source's Latin begins mid-verse). The source cites it "Eccl. 24:1"; the words are Sir 24:11-12.
id: lauds-capitulum-translation-of-the-holy-house
text:
  la: "In ómnibus réquiem quæsívi, et in hæreditate Dómini morabor. Tunc præcépit, et dixit mihi Creátor ómnium; et qui creávit me, requievit in tabernáculo meo."
  en: "In all these I sought rest, and I shall abide in the inheritance of the Lord. Then the creator of all things commanded, and said to me: and he that made me, rested in my tabernacle."
citation:
  la: "Sir 24:11-12"
  en: "Ecclesiasticus 24:11-12"
status:
  la: verified
  en: verified
