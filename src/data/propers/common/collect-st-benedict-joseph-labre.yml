# Collect. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/04-16-BenedictusJLabre.txt (Semiduplex, nine lessons, vide C5). English is this project's own translation, marked draft.
id: collect-st-benedict-joseph-labre
text:
  la: |
      Orémus.
      Deus, qui sanctum Benedíctum Joséphum Confessórem tuum humilitátis stúdio et paupertátis amóre tibi uni adhærére fecísti: da nobis ejus suffragántibus méritis; terréna cuncta despícere et cœléstia semper inquírere.
      Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Let us pray.
      O God, who didst make thy Confessor Benedict Joseph cleave to thee alone by his zeal for humility and love of poverty: grant us, by his merits and intercession, to despise all earthly things and ever to seek the things of heaven.
      Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
