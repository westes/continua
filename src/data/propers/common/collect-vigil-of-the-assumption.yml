id: collect-vigil-of-the-assumption
text:
  la: |
    Orémus.
    Deus, qui virginálem aulam beátæ Maríæ, in qua habitáres, elígere dignátus es:
    da, quǽsumus; ut, sua nos defensióne munítos, jucúndos fácias suæ interésse
    festivitáti.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who wast pleased to choose for thy dwelling-place the maiden palace of
    Blessed Mary, grant, we beseech thee, that her protection may shield us, and
    make us glad in her commemoration.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
status:
  la: verified
  en: verified
