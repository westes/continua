# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: matins-hymn-holy-shroud
text:
  la: |
      Mystérium mirábile
      Hac luce nobis panditur,
      Verus Dei cum Fílius
      Mortem cruentam sústinet.

      Causam tuendo sérvuli,
      Reique formam vestiens,
      Pro servo Herus suspénditur,
      Pro sonte Iustus plectitur.

      Necis manent insígnia,
      Impressa Sacra in Sindone,
      Quæ post triúmphum nobilem
      Corpus cruentum involverat.

      Sunt mortis hæc, et tartari
      Mundíque victi insígnia:
      Trophæa sunt hæc inclita
      Ductoris invictissimi.

      Debémus ergo hanc grátiam
      Nostræ salútis Vindicti,
      Ut dæmonis contra dolos
      Hac militemus tessera.

      Vitæ vetustæ mórtui
      Surgamus in vitam novam
      Christum secúti: per Crucem
      Christi fruemur glória.

      * Præsta, Pater piíssime,
      Patríque compar Únice,
      Cum Spíritu Paráclito
      Regnans per omne sǽculum. Amen.
  en: |
      A wonderful mystery
      is opened to us on this day,
      when the true Son of God
      undergoes a bloody death.

      Defending the cause of the servant,
      and taking on the guise of the guilty,
      the Master is hung up for the slave,
      the Just One is punished for the guilty.

      The signs of his death remain,
      impressed upon the sacred Shroud,
      which, after the noble triumph,
      had wrapped the bloodied body.

      These are the ensigns of death
      and hell and the conquered world:
      these are the glorious trophies
      of the most unconquered Leader.

      We therefore owe this grace
      to the Champion of our salvation,
      that against the wiles of the devil
      we may fight under this standard.

      Dead to the old life,
      let us rise to a new life,
      following Christ: through the Cross
      we shall enjoy the glory of Christ.

      * Grant, most loving Father,
      and thou, only equal of the Father,
      reigning with the Spirit the Paraclete
      through every age. Amen.
