# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2029-01-21 (clean year, per st-agnes.yml's own comment).
# Byte-identical to St. Agatha's own override (Sir 51:1-3, "Confitébor
# tibi, Dómine, Rex") -- confirmed a real, saint-specific shared
# override between these two ancient Roman virgin martyrs specifically,
# not the general Common-of-a-Virgin-Martyr default: St. Lucy (also one
# of the Canon-of-the-Mass virgin martyrs) uses the plain 2 Cor 10:17-18
# Common chapter on her own clean day (2025-12-13), so this isn't a
# rank-tier variant of the Common either. Responsory, hymn, and versicle
# are the same Common-of-a-Virgin-Martyr content reused (byte-identical
# at both Agatha's and Agnes's own days). Same chapter reused for
# Vespers -- no separate vespers-capitulum-<id> file authored, per
# vespers.ts's vespersCapitulumForOverride fallback.
id: lauds-capitulum-st-agnes
text:
  la: "Confitébor tibi, Dómine, Rex, et collaudábo te Deum Salvatórem meum. Confitébor nómini tuo: quóniam adjútor et protéctor factus es mihi, et liberásti corpus meum a perditióne."
  en: "I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour. I will give glory to thy name: for thou hast been a helper and protector to me, and hast preserved my body from destruction."
citation:
  la: "Eccli 51:1-3"
  en: "Sir 51:1-3"
status:
  la: verified
  en: verified
