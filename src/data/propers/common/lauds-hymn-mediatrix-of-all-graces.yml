# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt (Duplex majus, nine lessons, `ex C11`). The doxology stanza is the source's own `*` stanza; its English is English/Psalterium/Doxologies.txt's [Nat], the same words. English is this project's own translation, marked draft.
id: lauds-hymn-mediatrix-of-all-graces
text:
  la: |
      María, quæ mortálium
      Preces amánter éxcipis,
      Rogámus ecce súpplices,
      Nobis adésto pérpetim.

      Adésto, si nos críminum
      Caténa stringit hórrida;
      Cito resólve cómpedes,
      Quæ corda culpis ílligant.

      Succúrre, si nos sǽculi
      Fallax imágo péllicit,
      Ne mens salútis trámitem,
      Oblíta cǽli, déserat.

      Tuis et esto fíliis
      Tutéla mortis témpore,
      Ut, te iuvánte, cónsequi
      Perénne detur prǽmium.

      * Jesu, tibi sit glória,
      Qui natus es de Vírgine,
      Cum Patre, et almo Spíritu,
      In sempitérna sǽcula.
      Amen.
  en: |
      O Mary, who lovingly receivest
      the prayers of mortals,
      behold, we suppliants beseech thee:
      be ever present to us.

      Be present, if the dreadful chain of sins
      binds us; swiftly loose the fetters
      that bind our hearts with guilt.

      Help us, if the deceitful image of the world
      allures us, lest the mind, forgetful of heaven,
      forsake the path of salvation.

      And to thy children be a protection
      at the hour of death, that by thy help
      they may be granted to obtain the everlasting reward.

      * All honour, laud, and glory be,
      O Jesu, Virgin-Born, to thee;
      Whom with the Father we adore,
      And Holy Ghost, for evermore.
      Amen.
status:
  la: verified
  en: draft
