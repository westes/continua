text:
  la: |
    2 Cor. 6:2-3 Ecce nunc tempus acceptábile, ecce nunc dies salútis: némini dantes ullam offensiónem, ut non vituperétur ministérium nostrum.
    R. Deo grátias.
    V. Scápulis suis obumbrábit tibi.
    R. Et sub pennis ejus sperábis.
  en: |
    2 Cor 6:2-3 For he saith: In an accepted time have I heard thee; and in the day of salvation have I helped thee. Behold, now is the acceptable time; behold, now is the day of salvation, giving no offense to any man, that our ministry be not blamed.
    R. Thanks be to God.
    V. He will overshadow thee with his shoulders.
    R. And under his wings thou shalt trust.
