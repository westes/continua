    Heb 1:11-12 They shall perish, but thou shalt continue: and they shall all grow old as a garment. And as a vesture shalt thou change them, and they shall be changed: but thou art the selfsame, and thy years shall not fail.
    R. Thanks be to God.
    V. All the ends of the earth have seen. Alleluia.
    R. The salvation of our God. Alleluia.
