# Ant+V/R+collect commemoration bundle, same combined-bundle shape as
# st-canute-commemoration.yml. Ant 2/Versum 2 are the standard de-Communi
# pairing for the Common of a Virgin (C6a, per [Rank]/[Rule]) -- the
# source's own file has no distinct [Ant 2]/[Versum 2] of its own (only
# hymns), so common-of-a-virgin-commemoration-antiphon.yml/lauds-versicle-
# common-of-a-virgin.yml supply it, both already verified elsewhere.
id: st-frances-xavier-cabrini-commemoration
text:
  la: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Dómine Jesu Christe, qui sanctam Vírginem Francíscam Xavériam, Sacratíssimi Cordis tui igne succénsam, per amplíssimas mundi plagas ad ánimas tibi lucrándas deduxísti, et per eam novam in Ecclésia tua Vírginum famíliam suscitásti; quǽsumus; ut ipsa intercedénte, ejúsdem Cordis tui virtútibus induámur, atque ad ætérnum beatitúdinis portum perveníre mereámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O Lord Jesus Christ, who, to win souls for thyself, led thy holy virgin Frances, burning with love for thy most Sacred Heart, on many journeys throughout the world, and through her raised up a new family of Virgins within thy Church, grant, we beseech thee, that by her intercession we may put on the virtues of that same Heart and be found worthy to reach the eternal haven of happiness.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
