# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/06-26.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution. (This feast's own Benedictus antiphon,
# ss-john-and-paul-antiphon.yml, already correctly sourced [Ant 2].)
id: ss-john-and-paul-magnificat-antiphon
text:
  la: "Isti sunt * duæ olívæ, et duo candelábra lucéntia ante Dóminum; habent potestátem cláudere cælum núbibus et aperíre portas ejus, quia linguæ eórum claves cæli factæ sunt."
  en: "These are two olive trees * and two candlesticks, giving light in the presence of the Lord; these have power to shut heaven with clouds, and have power again to open the gates thereof, for their tongues are become keys of heaven."
status:
  la: verified
  en: verified
