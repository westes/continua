# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp1-2-OratioDNJC.txt (Duplex majus, Tuesday after Septuagesima). English is this project's own translation, marked draft.
id: vespers-hymn-prayer-on-the-mount-of-olives
text:
  la: |
      Áspice ut Verbum Patris a supernis
      Sedibus, clemens et amóre flagrans,
      Perditis culpa genitis mederi
      Pergit Adami.

      Flebilem mundi míserans ruinam,
      Et volens nostros reparáre casus,
      Orat, et prona véniam precatur
      Fronte magíster.

      Fluctuat secum tot acerba volvens:
      Hunc, ait supplex, cálicem dolóris,
      Mi Pater, transfer; tua sed volúntas,
      Non mea fiat.

      Cum premat tristis pavor ima cordis,
      Déficit languens Dóminus; per artus
      Sánguinis sudor fluit, atque guttis
      Terra madescit.

      At celer summo véniens Olympo
      Ángelus Jesum recreat jacentem:
      Córpori vires redeunt, novoque
      Róbore surgit.

      Laus, honor Patri, genitæque Proli,
      Cui datum nomen super omne nomen,
      Et Paracleto decus atque virtus,
      Omne per ævum.
      Amen.
  en: |
      Behold how the Word of the Father,
      from the heavenly seats, merciful and burning with love,
      goes forth to heal the offspring of Adam
      lost by guilt.

      Pitying the world's lamentable ruin,
      and wishing to repair our falls,
      he prays, and with brow bowed down
      the Master begs pardon.

      He wavers, turning over so many bitter things:
      This chalice of sorrow, he says in supplication,
      my Father, take away; but thy will,
      not mine, be done.

      While sad dread presses the depths of his heart,
      the Lord faints, languishing; through his limbs
      a sweat of blood flows, and with drops
      the earth is wetted.

      But swiftly an Angel, coming from highest heaven,
      refreshes the prostrate Jesus:
      strength returns to his body, and with new
      vigour he rises.

      Praise and honour to the Father and to the begotten Son,
      to whom was given the name above every name,
      and to the Paraclete glory and power,
      through all ages. Amen.
status:
  la: verified
  en: draft
