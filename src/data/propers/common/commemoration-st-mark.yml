# Own proper antiphon (st-mark-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-evangelist (Commune/
# C1a.txt inherits its own `[Ant 2]`/`[Versum 2]` unchanged from
# Commune/C1, Common of an Apostle -- no override of its own) -- not yet
# independently live-verified for this specific category, so marked
# `draft` rather than `verified`. Collect is the saint's own real proper
# (st-mark-collect.yml), unchanged.
id: commemoration-st-mark
text:
  la: |
    Ant. Fíliæ Jerúsalem, veníte et vidéte Mártyres cum corónis, quibus coronávit eos Dóminus in die solemnitátis et lætítiæ, allelúia, allelúia.
    V. Annuntiavérunt ópera Dei.
    R. Et facta ejus intellexérunt.
    Orémus.
    Deus, qui beátum Marcum Evangelístam tuum evangélicæ prædicatiónis grátia sublimásti: tríbue, quǽsumus; ejus nos semper et eruditióne profícere et oratióne deféndi.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Daughters of Jerusalem, come and see the crowned martyrs, the Lord crowned them in his solemnity and delight, alleluia, alleluia.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
    O God, Who didst exalt thy blessed Evangelist Mark, by giving him grace to preach thine Evangel, grant unto us, we beseech thee, ever to follow more and more what he teacheth, and ever to be shielded from all evil by his prayers.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
