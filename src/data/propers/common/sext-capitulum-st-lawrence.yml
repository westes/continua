# Verified against Divinum Officium (Monastic Tridentinum 1617), Sext
# live query, St. Lawrence's own day (2026-08-10) -- "Capitulum Versus
# {ex Proprio Sanctorum}", also shown on every day of his own octave, not
# just his own day (see hours/resolve-common.ts's resolveOfficeWinner).
id: sext-capitulum-st-lawrence
text:
  la: "Unusquísque prout destinávit in corde suo, non ex tristítia aut ex necessitáte; hílarem enim datórem díligit Deus. R. Deo grátias. V. Posuísti, Dómine, super caput ejus. R. Corónam de lápide pretióso."
  en: "Every one as he hath determined in his heart, not with sadness, or of necessity: for God loveth a cheerful giver. R. Thanks be to God. V. O Lord, Thou hast set a crown of precious stones. R. Upon his head."
citation:
  la: "2 Cor 9:7"
  en: "2 Cor 9:7"
status:
  la: verified
  en: verified
