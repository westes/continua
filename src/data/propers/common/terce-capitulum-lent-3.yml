id: terce-capitulum-lent-3
text:
  la: |
    Eph 5:1-2 Fratres: Estóte imitatóres Dei, sicut fílii caríssimi: et ambuláte in dilectióne, sicut et Christus diléxit nos, et trádidit semetípsum pro nobis oblatiónem et hóstiam Deo in odórem suavitátis.
    R. Deo grátias.
    V. Ipse liberávit me de láqueo venántium.
    R. Et a verbo áspero.
  en: |
    Eph 5:1-2 Be ye, therefore, followers of God, as most dear children; And walk in love, as Christ also hath loved us, and hath delivered himself for us, an oblation and a sacrifice to God for an odour of sweetness.
    R. Thanks be to God.
    V. For he hath delivered me from the snare of the hunters.
    R. And from the sharp word.
