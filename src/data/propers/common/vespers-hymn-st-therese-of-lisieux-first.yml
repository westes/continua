# First Vespers hymn: web/www/horas/Latin/SanctiM/10-03b.txt's [Hymnus Vespera] ("Nomen decúsque cóncinant"; its `Terési[a]` is the source's gender-variable marker, resolved to "Terésia"). The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: vespers-hymn-st-therese-of-lisieux-first
text:
  la: |
    Nomen decúsque cóncinant
    Terésiæ almæ vírginis
    Qui sancta divi párvuli
    Credunt amántque múnera.

    Carméli summos vértices
    Patróna Mater déligit:
    Terésia illuc ádvolat,
    Sponsi premens vestígia.

    Affláta Jesu númine,
    Secréta pandit grátiæ;
    Magístra mundo símplices
    Infántium docet vias.

    Virtútis ipsa flósculos
    Olent sacráta límina,
    Quæ casta vir ut ángelus
    immíssus e cælo, colit.

    At júbilum non éxprimit
    Omnes amóris ímpetus;
    Nec septa magnos cláudere
    Ejus valent anhélitus.

    Jesu, tibi sit glória,
    Qui te revélas párvulis,
    Cum Patre et almo Spíritu,
    In sempitérna sǽcula.
    Amen.
  en: |
    Let them sing the name and glory
    of the gracious virgin Teresa,
    who believe in and love
    the holy gifts of the divine Child.

    The Mother, our patroness, chooses
    the highest summits of Carmel:
    Teresa flies thither,
    treading in her Spouse's footsteps.

    Inspired by the divinity of Jesus,
    she lays open the secrets of grace;
    a teacher to the world, she teaches
    the simple ways of little children.

    The consecrated thresholds are fragrant
    with the little flowers of virtue, which she,
    chaste as an angel sent down from heaven, tends.

    But her jubilation does not express
    all the surges of her love;
    nor can the cloister walls confine
    her mighty yearnings.

    Glory be to thee, O Jesus,
    who revealest thyself to little ones,
    with the Father and the loving Spirit,
    for everlasting ages.
    Amen.
status:
  la: verified
  en: draft
