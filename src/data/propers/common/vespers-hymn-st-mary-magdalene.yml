# St. Mary Magdalene's own Vespers hymn: Latin/Sancti/07-22.txt's
# [Hymnus Vespera] (the Monastic track takes it as-is, `[HymnusM Vespera]`
# only cuts the variable doxology after the `*`) and English/Sancti/07-22.txt.
# Confirmed against the engine's live Vespers render (Monastic Tridentinum
# 1617, 2026-07-21/22). Before this file the saint fell to the Common of a
# Holy Woman's hymn.
id: vespers-hymn-st-mary-magdalene
text:
  la: |
    Pater supérni lúminis,
    Cum Magdalénam réspicis,
    Flammas amóris éxcitas,
    Gelúque solvis péctoris.

    Amóre currit sáucia
    Pedes beátos úngere,
    Laváre fletu, térgere
    Comis, et ore lámbere.

    Astáre non timet cruci,
    Sepúlcro inhǽret ánxia,
    Truces nec horret mílites:
    Pellit timórem cáritas.

    O vera, Christe, cáritas,
    Tu nostra purga crímina,
    Tu corda reple grátia,
    Tu redde cæli prǽmia.

    * Patri simúlque Fílio,
    Tibíque, Sancte Spíritus,
    Sicut fuit, sit júgiter
    Sæclum per omne glória.
    Amen.
  en: |
    Father of lights! one glance of thine,
    Whose eyes the universe control,
    Fills Magdalene with holy love,
    And melts the ice within her soul.

    Her precious ointment forth she brings
    Upon those sacred feet to pour;
    She washes them with burning tears,
    And with her hair she wipes them o'er.

    Impassioned, to the cross she clings,
    Nor fears beside the tomb to stay;
    Nor dreads the soldiers' savage mien,
    For love has cast all fear away.

    O Christ, thou very love itself!
    Blest hope of man, through thee forgiven!
    So touch our spirits from above,
    So purify our souls for heaven.

    * To God the Father, with the Son
    And Holy Paraclete, with thee,
    As evermore hath been before,
    Be glory through eternity.
    Amen.
