# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/01-21.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution. (This feast's own Benedictus antiphon,
# st-agnes-antiphon.yml, already correctly sourced [Ant 2].)
id: st-agnes-magnificat-antiphon
text:
  la: "Stans beáta Agnes * in médio flammæ, expánsis mánibus orábat ad Dóminum: Omnípotens, adoránde, colénde, treménde, benedíco te, et glorífico nomen tuum in ætérnum."
  en: "The blessed Agnes stood in the midst of the fire * and stretched forth her hands unto the Lord, and prayed, saying: O Thou Who Alone art Almighty! Who Alone art to be adored! Who Alone art to be worshipped! Who Alone art to be feared! I bless thee, and glorify thy Name for ever and ever!"
status:
  la: verified
  en: verified
