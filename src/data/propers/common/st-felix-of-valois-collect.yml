id: st-felix-of-valois-collect
text:
  la: |
    Orémus.
    Deus, qui beátum Felícem Confessórem tuum ex erémo ad munus
    rediméndi captívos cǽlitus vocáre dignátus es: præsta, quǽsumus; ut
    per grátiam tuam ex peccatórum nostrórum captivitáte, ejus
    intercessióne, liberáti, ad cæléstem pátriam perducámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et
    regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who by a sign from heaven didst call thy blessed Confessor
    Felix out of the desert to become a redeemer of bondsmen, grant, we
    beseech thee, unto his prayers, that thy grace may deliver us from
    the bondage of sin, and bring us home unto our very fatherland,
    which is in heaven.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with
    thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
