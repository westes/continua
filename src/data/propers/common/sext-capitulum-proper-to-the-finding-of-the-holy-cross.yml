# Sancti/05-03.txt [Capitulum Sexta] (Exaltation, Sancti/09-14, takes 'ex Sancti/05-03') and the non-Paschal responsory breve of Sancti/09-14.txt [Responsory Breve Sexta]; Finding falls in Paschaltide and uses the -paschaltide variant.
id: sext-capitulum-proper-to-the-finding-of-the-holy-cross
text:
  la: |
    Mihi autem absit gloriári, nisi in Cruce Dómini nostri Jesu Christi: per quem mihi mundus crucifíxus est, et ego mundo.
    R. Deo grátias.
    V. Adorámus te, Christe et benedícimus tibi.
    R. Quia per Crucem tuam redemísti mundum.
  en: |
    But God forbid that I should glory, save in the Cross of our Lord Jesus Christ, by Whom the world is crucified unto me, and I unto the world.
    R. Thanks be to God.
    V. We adore thee, O Christ and we bless thee.
    R. Because that through thy cross thou hast redeemed the world.
citation:
  la: "Gal 6:14"
  en: "Gal 6:14"
status:
  la: verified
  en: verified
