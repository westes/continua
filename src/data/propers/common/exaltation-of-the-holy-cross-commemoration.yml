# Fully proper feast's commemoration bundle -- own real [Ant 2]/[Versum
# 2] (shared with Finding of the Holy Cross, genuinely, per the Monastic
# reference file's own directive -- see exaltation-of-the-holy-cross-
# antiphon.yml), but the Exaltation's own distinct collect
# (exaltation-of-the-holy-cross-collect.yml), not Finding's. Split off
# 2026-09-14 from the old shared `finding-of-the-holy-cross-commemoration`
# bundle for the same reason as the collect itself.
#
# KNOWN CAVEAT (carried over from finding-of-the-holy-cross-
# commemoration.yml, not fixed here): this file's own hardcoded
# "Allelúja" is only correct when this commemoration is rendering within
# Paschaltide, which Sept 14 never is -- so this feast's own bundle
# should almost certainly drop the Allelúja outright rather than inherit
# a Paschaltide-only convention that can never apply on her own date.
# Left as inherited text pending a real fix to `sanctoralCommemorationPart`
# (resolve-common.ts) threading a `day`/season parameter through, same
# as the caller-side gap already documented on the May 3 file.
id: exaltation-of-the-holy-cross-commemoration
text:
  la: |
    Ant. Super ómnia * ligna cedrórum tu sola excélsior, in qua Vita mundi pepéndit, in qua Christus triumphávit, et mors mortem superávit in ætérnum.
    V. Adorámus te, Christe, et benedícimus tibi.
    R. Quia per Crucem tuam redemísti mundum.
    Orémus.
    Deus, qui nos hodiérna die Exaltatiónis sanctæ Crucis ánnua solemnitáte lætíficas:
    præsta, quǽsumus; ut, cujus mystérium in terra cognóvimus, ejus redemptiónis prǽmia
    in cælo mereámur.
    Per eúmdem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Thou art higher * than all cedars, whereon the Life of the world hung, whereon Christ openly triumphed, and His death trampled down death for ever.
    V. We adore thee, O Christ, and we bless thee.
    R. Because that through thy Cross thou hast redeemed the world.
    Let us pray.
    O God, Who dost this day gladden us by the yearly Feast of the Exaltation of the Holy
    Cross, grant, we beseech thee, that even as we have understood the mystery thereof
    upon earth, so we may worthily enjoy in heaven the fruits of the redemption which was
    paid thereon.
    Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
