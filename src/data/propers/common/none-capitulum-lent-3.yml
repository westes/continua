text:
  la: |
    Eph 5:8-9 Erátis enim aliquándo ténebræ, nunc autem lux in Dómino: ut fílii lucis ambuláte: fructus enim lucis est in omni bonitáte, et justítia, et veritáte.
    R. Deo grátias.
    V. Scuto circúmdabit te véritas ejus.
    R. Non timébis a timóre noctúrno.
  en: |
    Eph 5:8-9 For you were heretofore darkness, but now light in the Lord. Walk then as children of the light. For the fruit of the light is in all goodness, and justice, and truth.
    R. Thanks be to God.
    V. His truth shall compass thee with a shield.
    R. Thou shalt not be afraid of the terror of the night.
