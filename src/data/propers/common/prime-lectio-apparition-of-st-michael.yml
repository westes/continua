# English counterpart.
id: prime-lectio-apparition-of-st-michael
text:
  la: "Factum est prǽlium magnum in cælo: Míchaël et Angeli ejus præliabántur cum dracóne, et draco pugnábat et ángeli ejus: et non prævaluérunt, neque locus invéntus est eórum ámplius in cælo."
  en: "There was a great war in heaven Michael and his angels fought against the dragon and the dragon fought, and his angels prevailed not, neither was their place found anymore in heaven."
citation:
  la: "Apo 12:7-8"
  en: "Rev 12:7-8"
status:
  la: verified
  en: verified
