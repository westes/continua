# Standard de-Communi commemoration for common-of-several-martyrs (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). ss-felix-simplicius-faustinus-and-beatrix has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (ss-felix-simplicius-faustinus-and-beatrix-collect.yml), unchanged.
id: commemoration-ss-felix-simplicius-faustinus-and-beatrix
text:
  la: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Præsta, quǽsumus, Dómine: ut, sicut pópulus christiánus Mártyrum tuórum Felícis, Simplícii, Faustíni et Beatrícis temporáli solemnitáte congáudet, ita perfruátur ætérna; et, quod votis celébrat, comprehéndat efféctu.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    Grant, O Lord, we beseech thee, that as thy Christian people do here in time unite in solemn joy for the blessedness of thy Martyrs Felix, Simplicius, Faustinus, and Beatrix, they may also rejoice with them hereafter in their eternal joy, and may understand by very knowledge, that whereof they now speak in their prayers.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
