# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
id: prime-lectio-commemoration-of-the-passion
text:
  la: "Generatiónem ejus quis enarrabit? Quia abscissus est de terra vivéntium: propter scelus pópuli mei percússi eum."
  en: "Who shall declare his generation? Because he is cut off out of the land of the living: for the wickedness of my people have I struck him."
citation:
  la: "Is 53:8"
  en: "Isaiah 53:8"
status:
  la: verified
  en: draft
