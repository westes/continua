# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Andrew's own day (2026-11-30). The Benedictus antiphon
# (echoes Herod Antipas's plea for John the Baptist's life, applied here
# to Andrew's own captors). Corrects the previous version of this file,
# which had been sourced from the Roman/secular rite's Sancti/11-30.txt's
# own [Ant 1] instead: real but different text from what Monastic 1617
# actually renders at Lauds, same mistake as St. Lawrence's earlier fix.
id: benedictus-antiphon-st-andrew
text:
  la: "Concéde nobis hóminem justum, redde nobis hóminem sanctum: ne interfícias hóminem Deo carum, justum, mansuétum et pium."
  en: "Spare unto us this just man, release unto us this holy one; slay not the friend of God, who is just, courteous, and godly."
status:
  la: verified
  en: verified
