id: st-gabriel-archangel-antiphon
text:
  la: "Angelus Gábriel * appáruit Daniéli et dixit illi: Ab exórdio precum tuárum egréssus est sermo; ego autem veni ut indicárem tibi; tu ergo animadvérte sermónem et intéllige visiónem."
  en: "The Angel Gabriel * appeared to Daniel and said: From the beginning of thy prayers the word came forth: and I am come to show it to thee, because thou art a man of desires: therefore do thou mark the word, and understand the vision."
status:
  la: verified
  en: verified
