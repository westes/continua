# Second Vespers Magnificat antiphon for `common-of-a-martyr-bishop`.
# Content identical to magnificat-antiphon-common-of-a-martyr.yml --
# the bishop/non-bishop distinction affects only the collect (C1 vs C2),
# not these Scripture antiphons. Verified via St. Blaise (02-03-2026).
id: magnificat-antiphon-common-of-a-martyr-bishop
text:
  la: "Qui vult veníre post me, * ábneget semetípsum, et tollat crucem suam, et sequátur me."
  en: "If any man will come after me, * let him deny himself and take up his cross daily and follow me."
status:
  la: verified
  en: verified
