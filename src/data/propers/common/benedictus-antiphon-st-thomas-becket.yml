# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Thomas of Canterbury's own day (2026-12-29). The
# Benedictus antiphon. (He deliberately doesn't get an octave -- see
# st-thomas-becket.yml -- but does still win his own day outright here.)
id: benedictus-antiphon-st-thomas-becket
text:
  la: "Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam."
  en: "He that hateth his life * in this world, shall keep it unto life eternal."
status:
  la: verified
  en: verified
