# Second Vespers Magnificat antiphon (also the default): web/www/horas/Latin/SanctiM/10-03b.txt's [Ant 3]. First Vespers' [Ant 1] is st-therese-of-lisieux-magnificat-antiphon-first.yml (see hours/resolve-common.ts's withVespersVariant). The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: magnificat-antiphon-st-therese-of-lisieux
text:
  la: "Benedíctus Dóminus, * quia hódie nomen tuum ita magnificávit, ut non recédat laus tua de ore hóminum, qui mémores fúerint virtútis Dómini in ætérnum."
  en: "Blessed be the Lord, * who hath so magnified thy name this day that thy praise shall not depart out of the mouth of men, who shall be mindful of the power of the Lord for ever."
status:
  la: verified
  en: draft
