# Verified against Divinum Officium (Monastic Tridentinum 1617),
# live query (Ss. Faustinus and Jovita, 02-15-2038) -- common-of-several-martyrs.
# For groups of martyrs who are not Popes (see
# common-of-pope-martyrs.yml for that distinct, allelúia-toned set) --
# cross-checked against Ss. Cornelius and Cyprian, Ss. Placid and
# Companions (a real Duplex II. classis feast, not just a stub --
# confirms this fallback applies at any rank, per
# resolveMinorHourAntiphon's own "eligible, not gated" design).
id: none-capitulum-common-of-several-martyrs
text:
  la: |
    Fulgébunt justi, et tamquam scintíllæ in arundinéto discúrrent. Judicábunt natiónes, et dominabúntur pópulis: et regnábit Dóminus illórum in perpétuum.
    R. Deo grátias.
    V. Justi autem in perpétuum vivent.
    R. Et apud Dóminum est merces eórum.
  en: |
    The just shall shine, and shall run to and fro like sparks among the reeds. They shall judge nations, and rule over people, and their Lord shall reign for ever.
    R. Thanks be to God.
    V. The righteous live for evermore.
    R. Their reward also is with the Lord.
citation:
  la: "Sap 3:7-8"
  en: "Wis 3:7-8"
status:
  la: verified
  en: verified
