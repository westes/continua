# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-24-Auxilium.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: matins-hymn-our-lady-help-of-christians
text:
  la: |
      Sæpe dum Christi pópulus cruéntis
      Hostis infensi premerétur armis,
      Venit adjutrix pia Virgo cœlo
      Lapsa sereno.

      Prisca sic Patrum monuménta narrant,
      Templa testantur spoliis opimis
      Clara, votivo repetita cultu
      Festa quotánnis.

      En novi grates liceat Maríæ
      Cantici lætis módulis referre
      Pro novis donis, resonante plausu
      Urbis et Orbis.

      Oh dies felix, memoránda fastis,
      Qua Petri Sedes fídei magístrum
      Triste post lustrum reducem beáta
      Sorte recépit!

      Vírgines castæ, puerique puri,
      Gestiens clerus, populusque grato
      Corde Regínæ celebráre cœli
      Múnera certent.

      Vírginum Virgo, benedícta Jesu
      Mater, hæc auge bona; fac precámur,
      Ut gregem Pastor Pius ad salutis
      Pascua ducat.

      Te per ætérnos venerémur annos,
      Trínitas, summo celebranda plausu:
      Te fide mentes, resonoque linguæ
      Carmine laudent. Amen.
  en: |
      Often, when the people of Christ was pressed by the bloody arms of a hostile foe, the loving Virgin came to their aid, gliding down from the clear sky.

      So the ancient records of the Fathers tell, and the temples bear witness, bright with rich spoils, and the feasts renewed each year with votive worship.

      Behold, let us be allowed to render thanks to Mary in a new canticle with joyful measures, for new gifts, while the applause of City and World resounds.

      O happy day, to be remembered in the calendar, on which the See of Peter received back, after a sad five years, by a blessed lot, the teacher of the faith, returned!

      Chaste virgins and pure boys, exulting clergy, and people, let them vie with grateful heart to celebrate the gifts of the Queen of heaven.

      Virgin of virgins, blessed Mother of Jesus, increase these blessings; grant, we pray, that the Shepherd Pius may lead his flock to the pastures of salvation.

      Through eternal years let us venerate thee, O Trinity, to be celebrated with highest praise: let our minds praise thee with faith, and our tongues with resounding song. Amen.
status:
  la: verified
  en: draft
