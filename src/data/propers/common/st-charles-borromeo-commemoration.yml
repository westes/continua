# Standard de-Communi commemoration for common-of-a-confessor-bishop (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). st-charles-borromeo has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-charles-borromeo-collect.yml), unchanged.
id: st-charles-borromeo-commemoration
text:
  la: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Da, quǽsumus, Ecclésiæ tuæ, omnípotens Deus: ut sanctum Cárolum,
    Confessórem tuum atque Pontíficem, et vigilántem custódem habére
    mereátur, et pium sédulæ sollicitúdinis intercessórem.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et
    regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    Grant, we beseech thee, almighty God, unto thy Church, that she may
    have thy holy Confessor and Bishop Charles both for a watchful
    guardian upon earth, and a loving intercessor of pleading
    faithfulness before thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with
    thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: draft
  en: draft
