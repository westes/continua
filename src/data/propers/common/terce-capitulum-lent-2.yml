id: terce-capitulum-lent-2
text:
  la: |
    1 Thess 4:1 Fratres: Rogámus vos, et obsecrámus in Dómino Jesu: ut, quemádmodum accepístis a nobis, quómodo vos opórteat ambuláre, et placére Deo, sic et ambulétis, ut abundétis magis.
    R. Deo grátias.
    V. Ipse liberávit me de láqueo venántium.
    R. Et a verbo áspero.
  en: |
    1 Thess 4:1 For the rest therefore, brethren, we pray and beseech you in the Lord Jesus, that as you have received from us, how you ought to walk, and to please God, so also you would walk, that you may abound the more.
    R. Thanks be to God.
    V. For he hath delivered me from the snare of the hunters.
    R. And from the sharp word.
