# Lauds' Benedictus antiphon: web/www/horas/Latin/Sancti/10-07.txt's own
# [Ant 2] and its English counterpart (not [Ant 1], which is First
# Vespers' Magnificat antiphon -- see the same correction recorded in
# apparition-of-the-immaculate-bvm-antiphon.yml).
id: benedictus-antiphon-our-lady-of-the-rosary
text:
  la: "Solemnitátem hodiérnam * sacratíssimi Rosárii Genetrícis Dei Maríæ devóte celebrémus, ut ipsa pro nobis intercédat ad Dóminum Jesum Christum."
  en: "Let us this day keep * right heartily the solemn Feast of the Most Holy Rosary of Mary the Mother of God, that she may pray for us to our Lord Jesus Christ."
status:
  la: verified
  en: verified
