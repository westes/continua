# Sancti/03-06.txt (Ss. Perpetua and Felicity) says vide C7b, which chains C7 -> C6;
# C6's own [Lectio Prima] is the text below, same as common-of-a-holy-woman's.
id: prime-lectio-prima-common-of-several-women-martyrs
text:
  la: "Dómine, Deus meus, exaltásti super terram habitatiónem meam, et pro morte defluénte deprecáta sum. Invocávi Dóminum, Patrem Dómini mei, ut non derelínquat me in die tribulatiónis meæ, et in témpore superbórum sine adjutório."
  en: "O Lord, my God thou hast exalted my dwelling place upon the earth and I have prayed for death to pass away. I called upon the Lord, the father of my Lord, that he would not leave me in the day of my trouble, and in the time of the proud without help."
citation:
  la: "Sir 51:13-14"
  en: "Sir 51:13-14"
status:
  la: verified
  en: verified
