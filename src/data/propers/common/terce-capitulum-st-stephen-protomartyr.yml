# Verified against Divinum Officium (Monastic Tridentinum 1617), Terce
# live query, St. Stephen Protomartyr's own day (2029-12-26, clean year).
id: terce-capitulum-st-stephen-protomartyr
text:
  la: |
    Stéphanus autem plenus grátia et fortitúdine, faciébat prodígia et signa magna in pópulo.
    R. Deo grátias.
    V. Glória et honóre coronásti eum, Dómine.
    R. Et constituísti eum super ópera mánuum tuárum.
  en: |
    And Stephen, full of grace and fortitude, did great wonders and signs among the people.
    R. Thanks be to God.
    V. Thou hast crowned him with glory and honour, O Lord.
    R. And madest him to have dominion over the works of thy hands.
citation:
  la: "Act 6:8"
  en: "Acts 6:8"
status:
  la: verified
  en: verified
