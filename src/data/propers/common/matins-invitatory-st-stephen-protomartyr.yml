id: matins-invitatory-st-stephen-protomartyr
text:
  la: "Christum natum, qui beátum hódie coronávit Stéphanum, * Veníte, adorémus."
  en: "He That once a little Child, Shivering in the manger lay, Set on Stephen's blessed head, A crown that fadeth not away; * O come, let us worship Him!"
status:
  la: verified
  en: verified
