id: sext-antiphon-common-of-a-martyr
text:
  la: "Qui mihi minístrat, * me sequátur: et ubi ego sum, illic sit et miníster meus."
  en: "If any man serve Me, * let him follow Me and where I am, there shall also My servant be."
