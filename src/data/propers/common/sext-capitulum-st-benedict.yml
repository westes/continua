# Verified against Divinum Officium (Monastic Tridentinum 1617), Sext
# live query, St. Benedict's own day (2033-03-21) -- see
# prime-antiphon-st-benedict.yml's header for the full provenance note.
# The source's own English page rendered the closing versicles but not
# the reading itself (silently duplicated the Latin); only the reading
# is translated here, so `draft`.
id: sext-capitulum-st-benedict
text:
  la: |
    In diébus ipsíus emanavérunt pútei aquárum, et quasi mare adimpléti sunt supra modum. Qui curávit gentem suam, et liberávit eam a perditióne.
    R. Deo grátias.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
  en: |
    In his days wells of water flowed out, and they were filled as it were the sea, above measure. He took care of his nation, and delivered it from destruction.
    R. Thanks be to God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
citation:
  la: "Eccl 50:3-4"
  en: "Eccl 50:3-4"
status:
  la: verified
  en: draft
