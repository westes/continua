# Own proper antiphon (purification-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (purification-collect.yml), unchanged.
id: purification-commemoration
text:
  la: |
    Ant. Senex * Púerum portábat, Puer autem senem regébat: quem virgo péperit, et post partum virgo permánsit: ipsum quem génuit, adorávit.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Omnípotens sempitérne Deus, majestátem tuam súpplices exorámus: ut, sicut unigénitus
    Fílius tuus hodiérna die cum nostræ carnis substántia in templo est præsentátus; ita nos
    fácias purificátis tibi méntibus præsentári.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. The old man held his Lord * in his arms in the form of a little child, but the Child was the old man's King even that Child whom a virgin bore, and remained a virgin as before the fruit of her womb, and the God of her soul.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    Almighty and everliving God, we humbly beseech thy Majesty, that as thy Only-begotten
    Son was this day presented in the temple in substance of our flesh, so we may be
    presented unto thee with pure and clean hearts.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
