id: terce-capitulum-advent-2
text:
  la: |
    Rom 15:4 Fratres: Quæcúmque scripta sunt, ad nostram doctrínam scripta sunt: ut per patiéntiam, et consolatiónem Scripturárum spem habeámus.
    R. Deo grátias.
    V. Veni ad liberándum nos, Dómine, Deus virtútum.
    R. Osténde fáciem tuam, et salvi érimus.
  en: |
    Rom 15:4 Brothers: For what things soever were written, were written for our learning: that through patience and the comfort of the scriptures, we might have hope.
    R. Thanks be to God.
    V. Come to my rescue, O God, Lord of hosts.
    R. Show us thy face, and we shall be saved.
