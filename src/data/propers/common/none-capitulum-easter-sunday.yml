text:
  la: |
    Col 3:1-2 Si consurrexístis cum Christo, quæ sursum sunt quǽrite, ubi Christus est in déxtera Dei sedens: quæ sursum sunt sápite, non quæ super terram.
    R. Deo grátias.
    V. Hæc dies, quam fecit Dominus, allelúja.
    R. Exsultémus et lætémur in ea, allelúja.
  en: |
    Col 3:1-2 If you be risen with Christ, seek the things that are above; where Christ is sitting at the right hand of God: Mind the things that are above, not the things that are upon the earth.
    R. Thanks be to God.
    V. This is the day which the Lord hath made, alleluia.
    R. Let us rejoice and be glad in it, alleluia.
