id: collect-st-john-of-the-cross
text:
  la: |
    Orémus.
    Deus, qui sanctum Joánnem Confessórem tuum atque Doctórem perféctæ sui abnegatiónis et Crucis amatórem exímium effecísti: concéde; ut, ejus imitatióni júgiter inhæréntes, glóriam assequámur ætérnam.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Let us pray.
    O God, who didst give to blessed John, thy Confessor and Doctor, grace to shew forth a singular love of perfect self-denial and of bearing thy Cross: grant, we beseech thee; that we, cleaving steadfastly to his pattern, may attain to everlasting glory.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

