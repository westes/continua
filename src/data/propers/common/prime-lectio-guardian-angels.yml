# Sourced from web/www/horas/Latin/Sancti/10-02.txt's own [Lectio Prima] and its
# English counterpart.
id: prime-lectio-guardian-angels
text:
  la: "Quod, si audíeris vocem ejus et féceris ómnia quæ loquor, inimícus ero inimícis tuis et afflígam affligéntes te. Præcedétque te Angelus meus."
  en: "But if thou wilt hear his voice, and do all that I speak, I will be an enemy to thy enemies, and will afflict them that afflict thee. And my angel shall go before thee."
citation:
  la: "Exod 23:22-23"
  en: "Exod 23:22-23"
status:
  la: verified
  en: verified
