# Verified against Divinum Officium (Monastic Tridentinum 1617),
# live query (Ss. Soter and Caius, 04-22-2042) -- common-of-pope-martyrs.
# For groups of Pope-Martyrs specifically (Commune/C3b.txt) -- real,
# distinct alleluia-toned text, not just several-martyrs with extra
# words; cross-checked against Ss. Cletus and Marcellinus.
id: none-capitulum-common-of-pope-martyrs
text:
  la: |
    Scimus quóniam diligéntibus Deum ómnia cooperántur in bonum, iis qui secúndum propósitum vocáti sunt sancti.
    R. Deo grátias.
    V. Lætítia sempitérna super cápita eórum, allelúja.
    R. Gáudium et exsultatiónem obtinébunt, allelúja.
  en: |
    And we know that to them that love God, all things work together unto good, to such as, according to his purpose, are called to be saints.
    R. Thanks be to God.
    V. Everlasting joy shall be upon their heads, alleluia.
    R. They shall obtain joy and gladness, alleluia.
citation:
  la: "Rom 8:28"
  en: "Rom 8:28"
status:
  la: verified
  en: verified
