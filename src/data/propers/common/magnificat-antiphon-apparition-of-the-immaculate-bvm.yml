# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/02-11.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution.
id: magnificat-antiphon-apparition-of-the-immaculate-bvm
text:
  la: "Hódie gloriósa cæli Regína * in terris appáruit; hódie pópulo suo verba salútis et pígnora pacis áttulit; hódie Angelórum et fidélium chori immaculátam Conceptiónem celebrántes gáudio exsúltant. Allelúja."
  en: "Today the glorious Queen of heaven * appeared on earth; today her word brought to her people a pledge of peace and salvation; today the choirs of Angels and the faithful exult, celebrating with joy the Immaculate Conception. Alleluia."
status:
  la: verified
  en: verified
