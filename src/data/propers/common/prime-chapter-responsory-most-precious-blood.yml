# New file, 2026-09-15: per-feast variant of prime-chapter-responsory-
# per-annum.yml -- same fixed responsory, with just the "V." verse line
# swapped for the feast's own [Versum Prima] (web/www/horas/Latin/Sancti/
# 07-01.txt), found while checking whether the by-feast responsory table
# (prime-chapter-responsory-by-feast.yml) needed real content -- most of
# the 36 Lectio-Prima-bearing saints have no [Versum Prima] of their own
# at all (season/per-annum already covers them); only two do, this feast
# and Christ the King.
id: prime-chapter-responsory-most-precious-blood
text:
  la: |
    R.br. Christe, Fili Dei vivi, * Miserére nobis.
    R. Christe, Fili Dei vivi, * Miserére nobis.
    V. Qui tuo nos sánguine redemísti.
    R. Miserére nobis.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Christe, Fili Dei vivi, * Miserére nobis.
  en: |
    R.br. Christ, Son of the living God, * have mercy on us.
    R. Christ, Son of the living God, * have mercy on us.
    V. Thou, who redeemed us with thy blood.
    R. Have mercy on us.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Christ, Son of the living God, * have mercy on us.
status:
  la: verified
  en: verified
