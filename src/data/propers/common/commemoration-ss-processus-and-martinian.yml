# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-several-martyrs; collect is the saint's own (collect-ss-processus-and-martinian.yml). Not
# independently live-verified for this category, so marked draft.
id: commemoration-ss-processus-and-martinian
text:
  la: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    v. Deus, qui nos sanctórum Mártyrum tuórum Procéssi et Martiniáni gloriósis confessiónibus circúmdas et prótegis: da nobis et eórum imitatióne profícere, et intercessióne gaudére.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    v. O God, Who dost encompass and shield us with the glorious witnessing of thy holy Martyrs Processus and Martinian, grant unto us the grace to improve by their example, and the happiness to rejoice because of their intercession.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

status:
  la: draft
  en: draft
