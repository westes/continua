# Verified -- C5a references C4a, which shares the C4 (confessor-bishop)
# capitulum at Sext. Content identical to
# sext-capitulum-common-of-a-confessor-bishop.yml (Sir 44:20, 44:22).
id: sext-capitulum-common-of-a-confessor-doctor
text:
  la: |
    Non est invéntus símilis illi, qui conserváret legem Excélsi: ídeo jurejurándo fecit illum Dóminus créscere in plebem suam.
    R. Deo grátias.
    V. Elégit eum Dóminus sacerdótem sibi.
    R. Ad sacrificándum ei hóstiam laudis.
  en: |
    There was not found the like to him in glory, who kept the law of the most High, and was in covenant with him. Therefore by an oath he gave him glory in his posterity, that he should increase in his people.
    R. Thanks be to God.
    V. The Lord hath chosen him for a Priest unto Himself.
    R. To offer up unto Him the sacrifice of praise.
citation:
  la: "Sir 44:20; 44:22"
  en: "Sir 44:20; 44:22"
status:
  la: verified
  en: verified
