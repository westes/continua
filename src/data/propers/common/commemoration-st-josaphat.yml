# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-martyr-bishop; collect is the saint's own (collect-st-josaphat.yml). Not
# independently live-verified for this category, so marked draft.
id: commemoration-st-josaphat
text:
  la: |
    Ant. Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam.
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
    Orémus.
    Excita, quǽsumus, Dómine, in Ecclésia tua Spíritum, quo replétus beátus Jósaphat Martyr et Póntifex tuus ánimam suam pro óvibus pósuit: ut, eo intercedénte, nos quoque eódem Spíritu moti ac roboráti, ánimam nostram pro frátribus pónere non vereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Ant. He that hateth his life in this world, shall keep it unto life eternal.
    V. The righteous shall flourish like the palm tree:
    R. He shall grow up like the cedar of Libanus.
    Let us pray.
    Stir up in thy Church, we beseech thee, O Lord, that Spirit which so filled blessed Josaphat, thy Martyr and Bishop, that he laid down his life for his flock; that by his intercession we, being likewise animated and strengthened by that same Spirit, may not fear to lay down our lives for our brethren.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the same Holy Ghost, God, world without end.
    R. Amen.

status:
  la: draft
  en: draft
