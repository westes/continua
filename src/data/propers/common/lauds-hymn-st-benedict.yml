# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2033-03-21 -- "Inter ætérnas súperum corónas," own proper
# Sapphic hymn. No English rendering exists in the reference engine --
# own original translation, marked draft. See lauds-capitulum-st-
# benedict.yml's header.
id: lauds-hymn-st-benedict
text:
  la: >-
    Inter ætérnas súperum corónas,

    Quas sacro partas rétinent agóne,

    Emicas celsis méritis corúscus,

    O Benedícte!


    Sancta te compsit púerum senéctus,

    Nil sibi de te rápuit volúptas,

    Aruit mundi tibi flos, ad alta

    Mente leváto.


    Hinc fuga lapsus, pátriam, paréntes

    Déseris, fervens némorum colónus;

    Edomas carnem, subigísque Christo

    Tortor acérbus.


    Ne diu tutus látebras fovéres,

    Digna te produnt óperum piórum;

    Spárgitur felix céleri per orbem

    Fama volátu.


    Glória Patri genitǽque Proli,

    Et tibi compar utriúsque semper,

    Spíritus alme, Deus unus, omni

    Témpore sæcli. Amen.
  en: >-
    Among the eternal crowns of the blessed,

    Won and held fast through holy contest,

    You shine forth radiant with lofty merits,

    O Benedict!


    A holy old age adorned you while a boy still,

    No pleasure ever seized its share of you,

    The world's flower withered for you, your mind

    Already lifted on high.


    Hence, fleeing ruin, your homeland and parents

    You leave, an ardent dweller of the forest;

    You tame the flesh, and, its harsh tormentor,

    Subdue it wholly to Christ.


    Lest you too long keep safe your hidden refuge,

    Worthy deeds of holiness reveal you;

    Your happy fame is scattered through the whole world

    Borne on swift wing.


    Glory to the Father and the begotten Son,

    And, ever equal to them both, to you,

    Kindly Spirit, one God, through every

    Age of the world. Amen.
status:
  la: verified
  en: draft
