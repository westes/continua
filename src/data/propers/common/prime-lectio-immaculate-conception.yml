id: prime-lectio-immaculate-conception
text:
  la: "Signum magnum appáruit in cælo: Múlier amícta sole, et luna sub pédibus ejus, et in cápite ejus coróna stellárum duódecim."
  en: "And a great sign appeared in heaven: A woman clothed with the sun, and the moon under her feet, and on her head a crown of twelve stars."
citation:
  la: "Apo 12:1"
  en: "Rev 12:1"
status:
  la: verified
  en: verified
