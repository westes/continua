# Sourced from web/www/horas/Latin/SanctiM/11-16.txt's own [Capitulum
# Laudes]. No English rendering exists in the reference engine's data;
# using the standard Douay-Rheims wording for Cant 3:4.
id: lauds-capitulum-st-gertrude
text:
  la: "Invéni quem díligit ánima mea: ténui eum, nec dimíttam, donec introdúcam illum in domum matris meæ, et in cubículum genetrícis meæ."
  en: "I found him whom my soul loveth: I held him: and I will not let him go, till I bring him into my mother's house, and into the chamber of her that bore me."
citation:
  la: "Cant 3:4"
  en: "Song 3:4"
status:
  la: verified
  en: verified
