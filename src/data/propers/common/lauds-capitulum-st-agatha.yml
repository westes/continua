# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2029-02-05 (clean year, per st-agatha.yml's own comment).
# Real proper content is narrow, same shape as Commemoration of St.
# Paul's own: only the chapter is genuinely her own (Sir 51:1-3,
# "Confitébor tibi, Dómine, Rex"); responsory, hymn, and versicle are
# all byte-identical to Common-of-a-Virgin-Martyr's own already-
# authored content -- duplicated under her own id rather than left to
# fall through (resolveOfficeBundle resolves a whole bundle per id, not
# per part). Same chapter reused for Vespers -- no separate vespers-
# capitulum-<id> file authored, per vespers.ts's
# vespersCapitulumForOverride fallback.
id: lauds-capitulum-st-agatha
text:
  la: "Confitébor tibi, Dómine, Rex, et collaudábo te Deum Salvatórem meum. Confitébor nómini tuo: quóniam adjútor et protéctor factus es mihi, et liberásti corpus meum a perditióne."
  en: "I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour. I will give glory to thy name: for thou hast been a helper and protector to me, and hast preserved my body from destruction."
citation:
  la: "Eccli 51:1-3"
  en: "Sir 51:1-3"
status:
  la: verified
  en: verified
