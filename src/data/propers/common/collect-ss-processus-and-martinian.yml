id: collect-ss-processus-and-martinian
text:
  la: |
    Orémus.
    v. Deus, qui nos sanctórum Mártyrum tuórum Procéssi et Martiniáni gloriósis confessiónibus circúmdas et prótegis: da nobis et eórum imitatióne profícere, et intercessióne gaudére.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Let us pray.
    v. O God, Who dost encompass and shield us with the glorious witnessing of thy holy Martyrs Processus and Martinian, grant unto us the grace to improve by their example, and the happiness to rejoice because of their intercession.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

