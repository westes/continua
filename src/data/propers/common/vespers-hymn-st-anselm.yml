# St. Anselm: proper Vespers hymn, Latin/SanctiM/04-21.txt's [Hymnus Vespera]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
id: vespers-hymn-st-anselm
text:
  la: |
    Fortis en præsul, monachus fidélis,
    Láurea doctor redimítus astat:
    Festus Ansélmo chorus æmulétur
    Dícere carmen.

    Ante matúros sápiens hic annos,
    Sǽculi florem pereúntis horret;
    Atque Lanfránci documénta quærens,
    Intrat erémum.

    Intímum pulsans penetrále Verbi,
    Fertur immótæ fidei volátu:
    Dógmatum puros látices an ullus
    Altius hausit?

    Munus abbátis, pater alme, sumens,
    Te voves caræ sóboli: benígnis
    Débiles portas húmeris, alácres
    Prǽvius hortans.

    Prǽsulum defert tibi rex cáthedram;
    Quid times luctam? próperant triúmphi;
    Exteras gentes, generósus exsul,
    Lúmine reples.

    Sacra libértas, óvibus redémptis
    Parta, cui Christus nihil antepónit,
    Urget Ansélmum: stúdio quis æquo
    Víndicat ipsam?

    Clara fit Romæ tua fama, Præsul:
    Póntifex summus tibi fert honóres;
    Te fides poscit: siluére Patres:
    Dogma tuere.

    Sis memor sancti gregis, et patrónus
    Sis ad ætérnam Tríadem, precámur,
    Cuncta cui dignas résonent per orbem
    Sǽcula laudes.
    Amen.
  en: |
    Behold, a bold prelate, a faithful monk,
    the doctor, crowned with laurel, stands here:
    let the festal choir emulate Anselm
    in singing his song.

    Wise before his years were ripe,
    he shrinks from the flower of the passing world;
    and seeking the teaching of Lanfranc,
    he enters the hermitage.

    Knocking at the inmost sanctuary of the Word,
    he is borne on the flight of unshaken faith:
    has anyone drawn the pure waters of doctrine
    more deeply?

    Taking up the office of abbot, kind father,
    thou dost vow thyself to thy dear sons;
    the weak thou dost carry on kindly shoulders,
    going before them and eagerly urging them on.

    The king brings thee the prelate's chair;
    why fear the struggle? triumphs hasten;
    a noble exile, thou fillest foreign nations
    with light.

    Sacred liberty, won for the redeemed flock,
    to which Christ prefers nothing,
    presses upon Anselm: who defends it
    with equal zeal?

    Thy fame grows bright at Rome, O Prelate;
    the supreme pontiff brings thee honours;
    the faith asks for thee, the Fathers were silent:
    defend the dogma.

    Be mindful of thy holy flock, and be
    our patron, we pray, before the eternal Trinity,
    to whom may all the ages resound
    worthy praises throughout the world.
    Amen.
status:
  la: verified
  en: draft
