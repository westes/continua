# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: none-capitulum-holy-shroud
text:
  la: |
      Circumspexi, et non erat auxiliator: quæsívi, et non fuit qui adjuváret: et salvávit mihi bráchium meum, et indignátio mea ipsa auxiliata est mihi.
      R. Deo grátias.
      V. Dóminus regnávit, decórem índuit.
      R. Induit Dóminus fortitúdinem, et præcínxit se virtúte.
  en: |
      I looked about, and there was no helper: I sought, and there was none to give aid: and my own arm hath saved for me, and my indignation itself hath helped me.
      R. Thanks be to God.
      V. The Lord hath reigned, he is clothed with beauty.
      R. The Lord is clothed with strength, and hath girded himself with power.
citation:
  la: "Is 63:5"
  en: "Isaiah 63:5"
status:
  la: verified
  en: draft
