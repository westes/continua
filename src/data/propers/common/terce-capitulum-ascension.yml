id: terce-capitulum-ascension
text:
  la: |
    Act. 1:1-2 Primum quidem sermónem feci de ómnibus, o Theóphile, quæ cœpit Jesus fácere et docére usque in diem, qua præcípiens Apóstolis per Spíritum Sanctum, quos elégit, assúmptus est.
    R. Deo grátias.
    V. Ascéndit Deus in jubilatióne, allelúja.
    R. Et Dóminus in voce tubæ, allelúja.
  en: |
    Act. 1:1-2 The former treatise I made, O Theophilus, of all things which Jesus began to do and to teach, Until the day on which, giving commandments by the Holy Ghost to the apostles whom he had chosen, he was taken up.
    R. Thanks be to God.
    V. God is ascended with jubilee, alleluia.
    R. And the Lord with the sound of trumpet, alleluia.
