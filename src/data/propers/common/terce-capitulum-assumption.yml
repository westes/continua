# Verified against Divinum Officium (Monastic Tridentinum 1617), Terce
# live query, the Assumption's own day (2026-08-15, clean year).
id: terce-capitulum-assumption
text:
  la: |
    In ómnibus réquiem quæsívi, et in hereditáte Dómini morábor. Tunc præcépit, et dixit mihi Creátor ómnium: et qui creávit me, requiévit in tabernáculo meo.
    R. Deo grátias.
    V. Exaltáta est sancta Dei Génitrix.
    R. Super choros Angelórum ad cæléstia regna.
  en: |
    In all these I sought rest, and I will abide in the inheritance of the Lord. So the Creator of all things gave me a commandment and said, and He that made me rested in my tabernacle.
    R. Thanks be to God.
    V. The holy Mother of God hath been exalted.
    R. Over choirs of Angels, into the heavenly kingdom.
citation:
  la: "Sir 24:11-12"
  en: "Sir 24:11-12"
status:
  la: verified
  en: verified
