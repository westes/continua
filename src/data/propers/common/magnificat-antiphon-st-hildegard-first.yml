id: magnificat-antiphon-st-hildegard-first
text:
  la: "Hildegárdis prophetíssa, * Spíritus Sancti splendóribus illustráta, vias Dómini revelávit."
  en: "Hildegard the prophetess, * illumined by the splendours of the Holy Spirit, revealed the ways of the Lord."
