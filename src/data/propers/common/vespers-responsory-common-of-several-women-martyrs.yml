# Vespers short responsory. Engine render with votive=C7b (Common of Several Women Martyrs), Monastic Tridentinum 1617, command=prayVespera. Before this file the Common had no Lauds/Vespers bundle and Ss. Perpetua and Felicity fell through to the seasonal chapter, responsory and hymn.
id: vespers-responsory-common-of-several-women-martyrs
text:
  la: |
    R.br. Adjuvábit eam * Deus vultu suo.
    R. Adjuvábit eam * Deus vultu suo.
    V. Deus in médio ejus, non commovébitur.
    R. Deus vultu suo.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Adjuvábit eam * Deus vultu suo.
  en: |
    R.br. God shall help her * with his countenance.
    R. God shall help her * with his countenance.
    V. God is in the midst of her, she shall not be moved.
    R. With his countenance.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. God shall help her * with his countenance.
status:
  la: verified
  en: verified
