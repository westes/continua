# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/01-23-Desponsatio.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: magnificat-antiphon-betrothal-of-the-bvm-first
text:
  la: "Gloriósæ Vírginis Maríæ Desponsatiónem digníssimam recolámus, quæ et Genitrícis dignitátem obtínuit, et virginálem pudicítiam non amísit."
  en: "Let us recall most worthily the betrothal of the glorious Virgin Mary, who both obtained the dignity of Mother and lost not her virginal chastity."
status:
  la: verified
  en: draft
