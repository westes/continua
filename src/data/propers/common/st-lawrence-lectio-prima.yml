# Sourced from web/www/horas/Latin/Sancti/08-10.txt's own [Lectio Prima] and its
# English counterpart.
id: st-lawrence-lectio-prima
text:
  la: "Potens est autem Deus omnem grátiam abundáre fácere in vobis, ut, in ómnibus semper omnem sufficiéntiam habéntes, abundétis in omne opus bonum, sicut scriptum est: Dispérsit, dedit paupéribus: justítia ejus manet in sǽculum sǽculi."
  en: "And God is able to make all grace abound in you; that ye always, having all sufficiency in all things, may abound to every good work, As it is written: He hath dispersed abroad, he hath given to the poor: his justice remaineth for ever."
citation:
  la: "2 Cor 9:8-9"
  en: "2 Cor 9:8-9"
status:
  la: verified
  en: verified
