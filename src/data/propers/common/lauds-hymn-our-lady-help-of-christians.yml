# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-24-Auxilium.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: lauds-hymn-our-lady-help-of-christians
text:
  la: |
      Te Redemptóris, Dominique nostri
      Dícimus Matrem, speciósa Virgo,
      Christianórum decus, et levámen –
      Rebus in arctis.

      Sæviant portæ licet inferórum,
      Hostis antiquus fremat, et minaces
      Ut Deo, sacrum populetur agmen,
      Suscitet iras.

      Nil truces possunt fúriæ nocére
      Méntibus castis, prece quas vocáta
      Ánnuens Virgo fovet, et superno
      Róbore firmat.

      Tanta si nobis faveat Patrona,
      Bellici cessat scéleris tumultus,
      Mille sternuntur, fugiuntve turmæ,
      Mille cohortes.

      Tollit ut sancta caput in Sione
      Turris, arx firmo fabricáta muro,
      Cívitas David, clypeis, et acri
      Mílite tuta.

      Virgo sic fortis Dómini poténti
      Déxtera, cæli cumulata donis,
      A piis longe famúlis repellit
      Dæmonis ictus.

      Te per ætérnos venerémur annos
      Trínitas, summo celebranda plausu,
      Te fide mentes, resonoque linguæ
      Carmine laudent. Amen.
  en: |
      Thee we call the Mother of our Redeemer and Lord, beautiful Virgin, the glory and relief of Christians in their straits.

      Though the gates of hell rage, and the ancient enemy rave, and stir up threatening angers to lay waste God's holy host,

      the fierce furies can do no harm to chaste minds, which the Virgin, called upon in prayer, nods assent to, cherishes, and strengthens with strength from on high.

      If so great a Patroness favour us, the tumult of the crime of war ceases; a thousand troops are laid low or flee, a thousand cohorts.

      As a holy tower lifts its head on Sion, a citadel built with a firm wall, the city of David, safe with shields and a keen soldiery,

      so the Virgin, strong right hand of the Lord's might, heaped with the gifts of heaven, drives far from her pious servants the blows of the demon.

      Through eternal years let us venerate thee, O Trinity, to be celebrated with highest praise: let our minds praise thee with faith, and our tongues with resounding song. Amen.
status:
  la: verified
  en: draft
