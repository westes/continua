id: matins-invitatory-assumption
text:
  la: "Veníte, adorémus Regem regum, * Cujus hódie ad æthéreum Virgo Mater assúmpta est cælum."
  en: "O come let us worship the King of kings. * This day was His Mother taken to the heavens above."
