# Second Vespers Magnificat antiphon for `common-of-a-widow`.
# Content identical to magnificat-antiphon-common-of-a-virgin.yml --
# the widow Common (C7) references C6 (virgin) for its Magnificat
# antiphon; same "Veni, Sponsa Christi" text.
id: magnificat-antiphon-common-of-a-widow
text:
  la: "Veni, Sponsa Christi, * áccipe corónam, quam tibi Dóminus præparávit in ætérnum."
  en: "Come, Bride of Christ, and take the everlasting crown * which the Lord hath prepared for thee."
status:
  la: verified
  en: verified
