id: st-camillus-de-lellis-collect
text:
  la: |
    Orémus.
    Deus, qui sanctum Camíllum, ad animárum in extrémo agóne luctántium subsídium,
    singulári caritátis prærogatíva decorásti: ejus, quǽsumus, méritis, spíritum nobis tuæ
    dilectiónis infúnde; ut in hora éxitus nostri hostem víncere, et ad cæléstem mereámur
    corónam perveníre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who didst adorn thy holy servant Camillus with a rare grace of charity, to
    comfort souls wrestling in their final agony: pour into us, we beseech thee, through his
    merits, the spirit of thy love; that in the hour of our own departure we may have
    strength to overcome the enemy, and may be found worthy to come to the crown of heaven.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
