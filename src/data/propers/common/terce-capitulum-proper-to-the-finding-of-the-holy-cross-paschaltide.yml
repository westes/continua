# Sancti/05-03.txt [Capitulum Laudes] and [Responsory Breve Tertia] (Alleluia form), used when the Finding or Exaltation falls in Paschaltide.
id: terce-capitulum-proper-to-the-finding-of-the-holy-cross-paschaltide
text:
  la: |
    Fratres: Hoc enim sentíte in vobis, quod et in Christo Jesu: qui, cum in forma Dei esset, non rapínam arbitrátus est esse se æquálem Deo: sed semetípsum exinanívit, formam servi accípiens, in similitúdinem hóminum factus, et hábitu invéntus ut homo.
    R. Deo grátias.
    V. Hoc signum Crucis erit in cælo, allelúia, allelúia.
    R. Cum Dóminus ad judicándum vénerit.
  en: |
    For let this mind be in you, which was also in Christ Jesus: Who being in the form of God, thought it not robbery to be equal with God: But emptied himself, taking the form of a servant, being made in the likeness of men, and in habit found as a man.
    R. Thanks be to God.
    V. This sign of the Cross shall be in heaven, alleluia, alleluia.
    R. When the Lord cometh to judgment.
citation:
  la: "Phil 2:5-7"
  en: "Phil 2:5-7"
status:
  la: verified
  en: verified
