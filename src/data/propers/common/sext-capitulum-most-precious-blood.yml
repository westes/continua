# Sancti/07-01.txt [Capitulum Sexta] and [Responsory Breve Sexta].
id: sext-capitulum-most-precious-blood
text:
  la: |
    Si sanguis hircórum, et taurórum, et cinis vítulæ aspérsus inquinátos sanctíficat ad emundatiónem carnis: quanto magis sanguis Christi, qui per Spíritum Sanctum semetípsum óbtulit immaculátum Deo, emundábit consciéntiam nostram ab opéribus mórtuis, ad serviéndum Deo vivénti?
    R. Deo grátias.
    V. Sanguis Jesu Christi Fílii Dei emúndat nos.
    R. Ab omni peccáto.
  en: |
    If the blood of bulls and of goats, and the ashes of an heifer, sprinkling the unclean, sanctifieth to the purifying of the flesh, how much more shall the Blood of Christ, Who through the Holy Spirit offered Himself without spot to God, purge our conscience from dead works, to serve the living God?
    R. Thanks be to God.
    V. The Blood of Jesus Christ, the Son of God cleanseth us.
    R. From all sin.
citation:
  la: "Heb 9:13-14"
  en: "Heb 9:13-14"
status:
  la: verified
  en: verified
