# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/01-23-Desponsatio.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: vespers-versicle-betrothal-of-the-bvm-first
text:
  la: |
      V. Desponsátio est hódie sanctæ Maríæ Vírginis.
      R. Cujus vita ínclyta cunctas illústrat ecclésias.
  en: |
      V. This day is the betrothal of the holy Virgin Mary.
      R. Whose illustrious life lights up all the churches.
status:
  la: verified
  en: draft
