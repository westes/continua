# No proper antiphon of his own -- standard de-Communi text and versicle for
# common-of-a-confessor-doctor; collect is the saint's own (collect-st-cyril-of-alexandria.yml). Not
# independently live-verified for this category, so marked draft.
id: commemoration-st-cyril-of-alexandria
text:
  la: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui beátum Cyríllum Confessórem tuum atque Pontíficem divínæ maternitátis beatíssimæ Vírginis Maríæ assertórem invíctum effecísti: concéde, ipso intercedénte; ut, qui vere eam Genetrícem Dei crédimus, matérna eíusdem protectióne salvémur.
    Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who didst make thy blessed Confessor and Bishop Cyril to be an unconquered teacher that the Most Blessed Virgin Mary is Mother of God, grant unto us that through his prayers we who believe her to be Mother of God in very deed may find safety under her motherly protection.
    Through the same Jesus Christ, thy Son, Our Lord, Who liveth and reigneth with thee in the unity of the Holy Ghost, God, world without end. 
    R. Amen.

status:
  la: draft
  en: draft
