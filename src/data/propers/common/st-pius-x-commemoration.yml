# No proper antiphon of his own -- standard de-Communi text, paired with the standard de-Communi commemoration versicle for common-of-a-confessor-pope (C4b -- inherits C4's own Ant2/Versum2 with no override) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (st-pius-x-collect.yml), unchanged.
id: st-pius-x-commemoration
text:
  la: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui ad tuéndam cathólicam fidem, et univérsa in Christo instauránda
    sanctum Pium, Summum Pontíficem, cælésti sapiéntia et apostólica
    fortitúdine replevísti: concéde propítius; ut, ejus institúta et
    exémpla sectántes, prǽmia consequámur ætérna.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, who to safeguard Catholic faith and to restore all things in
    Christ, didst fill the Supreme Pontiff, Saint Pius, with heavenly wisdom
    and apostolic fortitude: grant in thy mercy: that by striving to fulfill
    his ordinances and to follow his example, we may reap eternal rewards.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth
    with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: draft
  en: draft
