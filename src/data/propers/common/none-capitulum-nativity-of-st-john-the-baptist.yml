# Verified against Divinum Officium (Monastic Tridentinum 1617), None
# live query, the Nativity of St. John the Baptist's own day (2026-06-24,
# clean year).
id: none-capitulum-nativity-of-st-john-the-baptist
text:
  la: |
    Reges vidébunt, et consúrgent príncipes et adorábunt Dóminum Deum tuum, et Sanctum Israël, qui elégit te.
    R. Deo grátias.
    V. Elísabeth Zacharíæ magnum virum génuit.
    R. Joánnem Baptístam, præcursórem Dómini.
  en: |
    Kings shall see, and princes shall arise, and shall worship the Lord thy God, and the Holy One of Israel that hath chosen thee.
    R. Thanks be to God.
    V. Elizabeth, the wife of Zacharias, was the mother of a mighty man.
    R. Even of John the Baptist, the Fore-runner of the Lord.
citation:
  la: "Isa 49:7"
  en: "Isa 49:7"
status:
  la: verified
  en: verified
