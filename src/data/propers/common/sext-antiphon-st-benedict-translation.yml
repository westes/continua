# Sext reuses Lauds antiphon 3 (the historical minor-hours-borrow-from-Lauds
# convention, as for St. Benedict's March feast). English is a fresh
# translation, marked draft.
id: sext-antiphon-st-benedict-translation
text:
  la: "Gloriosus * Confessor Domini, orationem faciens, benedictionem dedit; et lapis, super quem antiquus hostis sedebat, subito levatus est."
  en: "The glorious * Confessor of the Lord, making prayer, gave his blessing; and the stone upon which the ancient enemy sat was suddenly lifted up."
status:
  la: verified
  en: draft
