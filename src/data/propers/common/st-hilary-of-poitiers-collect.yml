id: st-hilary-of-poitiers-collect
text:
  la: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut beáti Hilárii Confessóris tui atque Pontíficis veneránda solémnitas, et devotiónem nobis áugeat et salútem.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant, we beseech thee, almighty God, that the venerable feast of Hilary thy blessed Confessor and Bishop may increase our devotion and promote our salvation.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
