# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2025-03-23); Latin and English both taken from the page.
id: lauds-capitulum-lent-3
text:
  la: "Fratres: Estóte imitatóres Dei, sicut fílii caríssimi: et ambuláte in dilectióne, sicut et Christus diléxit nos, et trádidit semetípsum pro nobis oblatiónem et hóstiam Deo in odórem suavitátis."
  en: "Be ye, therefore, followers of God, as most dear children; And walk in love, as Christ also hath loved us, and hath delivered himself for us, an oblation and a sacrifice to God for an odour of sweetness."
citation:
  la: "Eph 5:1-2"
  en: "Eph 5:1-2"
