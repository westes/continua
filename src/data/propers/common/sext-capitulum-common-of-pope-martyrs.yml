# Verified against Divinum Officium (Monastic Tridentinum 1617),
# live query (Ss. Soter and Caius, 04-22-2042) -- common-of-pope-martyrs.
# For groups of Pope-Martyrs specifically (Commune/C3b.txt) -- real,
# distinct alleluia-toned text, not just several-martyrs with extra
# words; cross-checked against Ss. Cletus and Marcellinus.
id: sext-capitulum-common-of-pope-martyrs
text:
  la: |
    Ecce quómodo computáti sunt inter fílios Dei, et inter sanctos sors illórum est.
    R. Deo grátias.
    V. Lux perpétua lucébit Sanctis tuis, Dómine, allelúia.
    R. Et ætérnitas témporum, allelúia.
  en: |
    Behold how they are numbered among the children of God, and their lot is among the saints.
    R. Thanks be to God.
    V. Eternal light will shine over your saints, O Lord, alleluia.
    R. And the eternity of times, alleluia.
citation:
  la: "Sap. 5:5"
  en: null
status:
  la: verified
  en: verified
