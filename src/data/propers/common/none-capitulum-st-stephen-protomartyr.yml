id: none-capitulum-st-stephen-protomartyr
text:
  la: |
    Pósitis autem génibus, clamávit voce magna, dicens: Dómine, ne státuas illis hoc peccátum. Et cum hoc dixísset, obdormívit in Dómino.
    R. Deo grátias.
    V. Magna est glória ejus in salutári tuo.
    R. Glóriam et magnum decórem impónes super eum.
  en: |
    And falling on his knees, he cried with a loud voice, saying: Lord, lay not this sin to their charge. And when he had said this, he fell asleep in the Lord. And Saul was consenting to his death.
    R. Thanks be to God.
    V. His glory is great in thy salvation.
    R. Honour and great majesty shalt Thou lay upon him.
citation:
  la: "Act 7:59"
  en: "Acts 7:59"
