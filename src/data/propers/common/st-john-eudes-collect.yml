id: st-john-eudes-collect
text:
  la: |
    Orémus.
    Deus, qui beátum Joánnem, Confessórem tuum, ad cultum sacrórum Córdium Jesu
    et Maríæ rite promovéndum, mirabíliter inflammásti, et per eum novas in
    Ecclésia tua famílias congregáre voluísti: præsta, quǽsumus; ut, cujus pia
    mérita venerámur, virtútum quoque instruámur exémplis.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who did wondrously inspire blessed John, thy Confessor, in promoting
    veneration to the sacred hearts of Jesus and Mary, and didst will to found
    through him new religious families in the Church, grant we pray, that we,
    who venerate his holy merits, may be taught also by the example of his
    virtues.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with
    thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
