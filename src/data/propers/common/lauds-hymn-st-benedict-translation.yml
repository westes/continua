# [HymnusM Laudes] (Lauds hymn, "Aurora surgit aurea"). The reference has no
# English for it, so the English is a fresh translation, marked draft.
id: lauds-hymn-st-benedict-translation
text:
  la: |
    Aurora surgit aurea
    Festa restaurans annua,
    Cum Benedictus arduum
    Cæli scandit palatium.

    Quanta in summis accipit,
    Qui sic in imis claruit,
    Cujus micant prodigia
    Per ampla mundi climata!

    Ejus carentum gratia
    Tellus vomit cadavera,
    Devotis unda liquida
    Sicca lambit vestigia.

    Totius orbis ambitum
    Per solis videt radium,
    Mens in auctore posita
    Subiecta cernit omnia.

    Te, Pater alme, petimus
    Pronæ mentis visceribus,
    Ut cælum des ascendere,
    Quos terrain doces spernere.

    Deo Patri sit gloria,
    Ejusque soli Filio,
    Cum Spiritu Paraclito,
    Et nunc, et in perpetuum.
    Amen.
  en: |
    The golden dawn is rising,
    renewing the yearly feast,
    when Benedict climbed
    the steep palace of heaven.

    How great are the things he receives on high,
    who so shone in the depths below,
    whose wonders gleam
    through the wide regions of the world!

    The earth casts out the corpses
    of those who lack his favour;
    for the devout the flowing wave
    laps their dry footprints.

    The whole circuit of the world
    he sees in a single ray of the sun;
    a mind fixed upon its Author
    beholds all things beneath it.

    Kind Father, we beseech thee
    from the depths of a lowly heart,
    that thou grant to climb to heaven
    those whom thou teachest to scorn the earth.

    To God the Father be glory,
    and to his only Son,
    with the Spirit, the Paraclete,
    now and for evermore.
    Amen.
