id: terce-capitulum-advent-4
text:
  la: |
    1 Cor 4:1-2 Fratres: Sic nos exístimet homo ut minístros Christi, et dispensatóres mysteriórum Dei. Hic jam quǽritur inter dispensatóres, ut fidélis quis inveniátur.
    R. Deo grátias.
    V. Veni ad liberándum nos, Dómine, Deus virtútum.
    R. Osténde fáciem tuam, et salvi érimus.
  en: |
    1 Cor 4:1-2 Brothers: Let a man so account of us as of the ministers of Christ, and the dispensers of the mysteries of God. Here now it is required among the dispensers, that a man be found faithful.
    R. Thanks be to God.
    V. Come to my rescue, O God, Lord of hosts.
    R. Show us thy face, and we shall be saved.
