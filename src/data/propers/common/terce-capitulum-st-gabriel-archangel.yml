# Sancti/03-24.txt [Capitulum Laudes] (Terce takes Lauds' chapter, None takes Lectio Prima, per the reference engine); versicle pair from Sancti/05-08.txt [Responsory Breve Tertia], which 03-24 inherits ('ex Sancti/05-08').
id: terce-capitulum-st-gabriel-archangel
text:
  la: |
    Ecce vir Gábriel, quem víderam in visióne a princípio, cito volans tétigit me in témpore sacrifícii vespertíni. Et dócuit me, et locútus est mihi, dixítque: Dániel, nunc egréssus sum ut docérem te, et intellégeres.
    R. Deo grátias.
    V. Stetit Angelus juxta aram templi.
    R. Habens thuríbulum áureum in manu sua.
  en: |
    Behold, the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation; and he informed me, and talked with me, and said: O Daniel, I am now come forth to give thee skill and understanding.
    R. Thanks be to God.
    V. An Angel stood at the Altar of the Temple.
    R. Having a golden censer in his hand.
citation:
  la: "Dan 9:21-22"
  en: "Dan 9:21-22"
status:
  la: verified
  en: verified
