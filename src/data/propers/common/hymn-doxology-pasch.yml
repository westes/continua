# Verified against Divinum Officium (Latin/English Doxologies.txt, the
# Monastic "T"-suffixed variant). Seasonal doxology for "Iam lucis orto
# sidere" and any other hymn ending "* Deo Patri sit gloria..." — see
# hours/hymn-doxology.ts.
id: hymn-doxology-pasch
text:
  la: "Glória tibi Dómine,\nQui surrexísti a mórtuis,\nCum Patre et Sancto Spíritu,\nIn sempitérna sǽcula. Amen."
  en: "To Thee Who, dead, again dost live,\nAll glory, Lord, Thy people give;\nAll glory, as is ever meet,\nTo Father and to Paraclete. Amen."
status:
  la: verified
  en: verified
