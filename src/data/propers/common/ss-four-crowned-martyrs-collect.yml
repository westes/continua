id: ss-four-crowned-martyrs-collect
text:
  la: |
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, qui gloriósos Mártyres fortes in sua confessióne
    cognóvimus, pios apud te in nostra intercessióne sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus
    Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant, we beseech thee, O Almighty God: that we who know thy glorious Martyrs to have been
    valiant in confessing thee, may find them favorable in interceding for us before thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the
    Holy Ghost, God, world without end.
    R. Amen.
status:
