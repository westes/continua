# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, 2026-06-29, clean year.
id: lauds-hymn-ss-peter-and-paul
text:
  la: |
    Jam bone Pastor Petre, clemens áccipe
    Vota precántum, et peccáti víncula
    Resólve tibi potestáte trádita,
    Qua cunctis cælum verbo claudis, áperis.

    Doctor egrégie Paule, mores ínstrue,
    Et mente polum nos transférre sátage:
    Donec perféctum largiátur plénius,
    Evacuáto quod ex parte gérimus.

    Sit Trinitáti sempitérna glória,
    Honor, potéstas, atque jubilátio,
    In unitáte, cui manet impérium,
    Ex tunc et modo, per ætérna sǽcula. Amen.
  en: |
    Peter, blest shepherd, hearken to our cry,
    And with a word unloose our guilty chain;
    Thou! who hast power to ope the gates on high
    To men below, and power to shut them fast again.

    Lead us, great teacher Paul, in wisdom's ways,
    And lift our hearts with thine to heaven's high throne;
    Till faith beholds the clear meridian blaze;
    And sunlike in the soul reigns charity alone.

    Praise, blessing, majesty, through endless days,
    Be to the Trinity immortal given;
    Who in pure unity profoundly sways
    Eternally alike all things in earth and heaven. Amen.
status:
  la: verified
  en: verified
