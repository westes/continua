id: terce-antiphon-st-lucy
text:
  la: "Lúcia virgo, * quid a me petis quod ipsa póteris præstáre contínuo matri tuæ?"
  en: "O virgin Lucy, * wherefore askest thou of me what thou canst thyself forthwith obtain for thy mother?"
