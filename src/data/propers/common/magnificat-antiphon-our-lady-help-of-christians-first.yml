# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-24-Auxilium.txt (Duplex majus, nine lessons, `ex C11`; "Proprium viz. 1888"). English is this project's own translation, marked draft.
id: magnificat-antiphon-our-lady-help-of-christians-first
text:
  la: "Ecce Maria erat spes nostra, ad quam confugimus in auxilium, ut liberaret nos, et venit in adjutorium nobis."
  en: "Behold, Mary was our hope, to whom we fled for help that she might deliver us, and she came to our aid."
status:
