id: matins-invitatory-seven-sorrows-of-the-bvm
text:
  la: "Stemus juxta crucem cum María Matre Jesu, * Cujus ánimam dolóris gládius pertransívit."
  en: "Let us take our stand by the Cross, in company with Mary, the Mother of Jesus. * A sword of sorrow hath pierced through her own soul also."
