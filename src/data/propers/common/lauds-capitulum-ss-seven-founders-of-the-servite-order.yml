id: lauds-capitulum-ss-seven-founders-of-the-servite-order
text:
  la: "Caríssimi: Communicántes Christi passiónibus gaudéte, ut et in revelatióne glóriæ ejus gaudeátis exsultántes."
  en: "Dearly beloved brethren, rejoice, inasmuch as you are partakers of Christ's sufferings; that, when His glory shall be revealed, ye may be glad also with exceeding joy."
citation:
