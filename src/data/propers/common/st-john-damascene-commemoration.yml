# No proper antiphon of his own -- standard de-Communi text, paired with the standard de-Communi commemoration versicle for common-of-a-confessor-doctor (non-Bishop, C5a -- inherits C5's own Ant2/Versum2 with no override) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (st-john-damascene-collect.yml), unchanged.
id: st-john-damascene-commemoration
text:
  la: |
    Ant. Serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam: intra in gáudium Dómini Dei tui.
    V. Os justi meditábitur sapiéntiam.
    R. Et lingua ejus loquétur judícium.
    Orémus.
    Omnípotens sempitérne Deus, qui ad cultum sacrárum imáginum asseréndum, beátum
    Joánnem cælésti doctrína et admirábili spíritus fortitúdine imbuísti: concéde nobis
    ejus intercessióne et exémplo; ut, quorum cólimus imágines, virtútes imitémur et
    patrocínia sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O Almighty and everlasting God, Who didst fill Thy blessed servant John with heavenly
    teaching, and wondrous strength of spirit to maintain the honouring of holy images.
    Grant unto us at his prayers and after his example to take pattern by their holy lives
    whose images we honour, and ever to feel the power of their help.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
