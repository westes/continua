# Engine render (Monastic Tridentinum 1617, command=praySexta, 2027-05-06); Latin and English both taken from the page.
id: sext-capitulum-ascension
text:
  la: |
    Act. 1:4-5 Et convéscens, præcépit eis, ab Jerosólymis ne discéderent, sed exspectárent promissiónem Patris, quam audístis (inquit) per os meum: quia Joánnes quidem baptizávit aqua, vos autem baptizabímini Spíritu Sancto non post multos hos dies.
    R. Deo grátias.
    V. Ascéndens Christus in altum, allelúja.
    R. Captívam duxit captivitátem, allelúja.
  en: |
    Acts 1:4-5 And eating together with them, he commanded them, that they should not depart from Jerusalem, but should wait for the promise of the Father, which you have heard (saith he) by my mouth. For John indeed baptized with water, but you shall be baptized with the Holy Ghost, not many days hence.
    R. Thanks be to God.
    V. When Christ ascended up on high, alleluia.
    R. He led captivity captive, alleluia.
