# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# `votive=C6` live query, 2026-08 -- same versicle as Lauds (see lauds-
# versicle-common-of-a-virgin-martyr.yml).
id: vespers-versicle-common-of-a-virgin-martyr
text:
  la: |
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  en: |
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
