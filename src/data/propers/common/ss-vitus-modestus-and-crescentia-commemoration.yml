# Own proper antiphon (ss-vitus-modestus-and-crescentia-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-several-martyrs (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (ss-vitus-modestus-and-crescentia-collect.yml), unchanged.
id: ss-vitus-modestus-and-crescentia-commemoration
text:
  la: |
    Ant. Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Da Ecclésiæ tuæ, quǽsumus, Dómine, sanctis Martýribus tuis Vito, Modésto atque Crescéntia intercedéntibus, supérbe non sápere, sed tibi plácita humilitáte profícere: ut, prava despíciens, quæcúmque recta sunt, líbera exérceat caritáte.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    O Lord, we pray thee to grant unto thy Church through the prayers of thine Holy Martyrs Vitus, Modestus, and Crescentia, to mind not high things, but in all lowliness to do ever such things as be pleasing in thy sight, looking down upon all such things as be corrupt, and working ever in love unfeigned such things as be righteous.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
