# Read directly from web/www/horas/Latin/Sancti/07-16.txt's own
# [Oratio] and its English counterpart. Doxology "$Qui vivis" spelled
# out per the convention in st-bibiana-collect.yml.
id: our-lady-of-mount-carmel-collect
text:
  la: |
    Orémus.
    Deus, qui beatíssimæ semper Vírginis et Genetrícis tuæ Maríæ singulári título
    Carméli órdinem decorásti: concéde propítius; ut, cujus hódie Commemoratiónem
    solémni celebrámus offício, ejus muníti præsídiis, ad gáudia sempitérna
    perveníre mereámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O Lord, Who hast given this excellency unto the Order of Carmel that the same
    should be especially styled the Order of the Most Blessed Mary, always a Virgin,
    thine Own Mother, mercifully grant that we who on this day do renew her memory in
    solemn worship, may worthily be shielded by her protection, and finally attain
    unto thine everlasting joy.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
