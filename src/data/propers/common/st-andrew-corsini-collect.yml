id: st-andrew-corsini-collect
text:
  la: |
    Orémus.
    Deus, qui in Ecclésia tua, nova semper instáuras exémpla virtútum: da pópulo tuo beáti
    Andréæ Confessóris tui atque Pontíficis ita sequi vestígia; ut assequátur et prǽmia.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who dost continually raise up in thy Church new examples of godly living, grant
    unto thy people so to follow in the steps of thy blessed Bishop and Confessor Andrew,
    that at the last they may, together with him, attain unto thine eternal reward.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
