# First Vespers versicle: web/www/horas/Latin/SanctiM/10-03b.txt's [Versum 1]. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: vespers-versicle-st-therese-of-lisieux-first
text:
  la: |
    V. Ego autem in Dómino gaudébo.
    R. Et exsultábo in Deo Jesu meo.
  en: |
    V. But I will rejoice in the Lord.
    R. And I will joy in God my Jesus.
status:
  la: verified
  en: draft
