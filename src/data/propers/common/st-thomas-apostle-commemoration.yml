# Own proper antiphon (st-thomas-apostle-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-apostle (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-thomas-apostle-collect.yml), unchanged.
id: st-thomas-apostle-commemoration
text:
  la: |
    Ant. Quia vidísti me * Thoma, credidísti: beáti qui non vidérunt, et credidérunt, allelúja.
    V. Annuntiavérunt ópera Dei.
    R. Et facta ejus intellexérunt.
    Orémus.
    Da nobis, quǽsumus, Dómine, beáti Apóstoli tui Thomæ solemnitátibus gloriári: ut ejus semper et patrocíniis sublevémur; et fidem cóngrua devotióne sectémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Because thou hast seen me, * Thomas, thou hast believed: blessed are they that have not seen and have believed, alleluia.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
    Grant us, Lord, we beseech thee, to glory in the solemnity of thy blessed Apostle Thomas, that we may ever be aided by his patronage, and follow his faith with true devotion.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
