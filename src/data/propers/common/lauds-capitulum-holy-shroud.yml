# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: lauds-capitulum-holy-shroud
text:
  la: "Quis est iste, qui venit de Edom, tinctis véstibus de Bosra?  Iste formósus in stola sua, grádiens in multitúdine fortitúdinis suæ. Ego qui loquor justítiam, et propugnátor sum ad salvándum."
  en: "Who is this that cometh from Edom, with dyed garments from Bosra? This beautiful one in his robe, walking in the greatness of his strength. I, that speak justice, and am a defender to save."
citation:
  la: "Is 63:1"
  en: "Isaiah 63:1"
status:
  la: verified
  en: draft
