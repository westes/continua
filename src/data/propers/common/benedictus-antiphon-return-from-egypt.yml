# Authored for this project from Matthew 2:19-23 (Clementine Vulgate / Douay-Rheims, as in the scripture store); the reference engine has no office for this day, only a Martyrology line. Marked draft.
id: benedictus-antiphon-return-from-egypt
text:
  la: "Surge, et accipe púerum et matrem ejus, et vade in terram Israël: defúncti sunt enim qui quærébant ánimam púeri."
  en: "Arise, and take the child and his mother, and go into the land of Israel: for they are dead that sought the life of the child."
status:
  la: draft
  en: draft
