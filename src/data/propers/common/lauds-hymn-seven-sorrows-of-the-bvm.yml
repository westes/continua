id: lauds-hymn-seven-sorrows-of-the-bvm
text:
  la: >-
    Summæ Deus cleméntiæ,

    Septem dolóres Vírginis

    Plagásque Jesu Fílii

    Fac rite nos revólvere.


    Nobis salútem cónferant

    Deíparæ tot lácrimæ

    Quibus laváre súfficis

    Totíus orbis crímina.


    Sit quinque Jesu vúlnerum

    Amára contemplátio,

    Sint et dolóres Vírginis

    Ætérna cunctis gáudia.
  en: >-
    O God of highest clemency,

    grant that we may rightly ponder

    the seven sorrows of the Virgin

    and the wounds of her Son Jesus.


    May the Mother of God's many tears

    bring us salvation,

    tears with which thou art able to wash away

    the sins of the whole world.


    Let the contemplation of the five wounds

    of Jesus be a bitter one,

    and let the sorrows of the Virgin

    be eternal joys to all.
