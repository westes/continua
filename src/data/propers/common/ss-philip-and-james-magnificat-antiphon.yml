id: ss-philip-and-james-magnificat-antiphon
text:
  la: "Si manséritis in me, * et verba mea in vobis mánserint, quodcúmque petiéritis, fiet vobis, allelúja, allelúja, allelúja."
  en: "If ye abide in Me * and My words abide in you, ye shall ask what ye will, and it shall be done unto you. Alleluia, Alleluia, Alleluia."
