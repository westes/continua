id: collect-st-peter-canisius
text:
  la: |
    Orémus.
    Deus, qui ad tuéndam cathólicam fidem beátum Petrum Confessórem tuum virtúte et
    doctrína roborásti: concéde propítius; ut ejus exémplis et mónitis errántes ad
    salútem resipíscant, et fidéles in veritátis confessióne persevérent.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who didst give strength and learning to blessed Peter thy Confessor for the
    defense of the Catholic faith, mercifully grant, that by his example and teaching,
    the erring may be saved and the faithful remain constant in the confession of truth.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
