id: collect-octave-of-ss-peter-and-paul
text:
  la: |
    Orémus.
    Deus, cujus déxtera beátum Petrum ambulántem in fluctibus, ne mergerétur, eréxit,
    et coapóstolum ejus Paulum, tértio naufragántem, de profúndo pélagi liberávit:
    exáudi nos propítius, et concéde; ut, ambórum meritis, æternitátis glóriam
    consequámur.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, whose right hand upheld blessed Peter, lest he should sink when walking on
    the waters, and did deliver blessed Paul, when shipwrecked for the third time, from
    the depth of the sea, hear us in thy mercy, and grant that, through the merits of
    both we may obtain the glory of the eternal life.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
status:
  la: verified
  en: verified
