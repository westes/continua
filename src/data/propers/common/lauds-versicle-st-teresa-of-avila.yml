# No distinct Lauds versicle exists in the reference source for this
# feast; reusing common-of-a-virgin's own Lauds versicle. Authored to
# make her own bundle (needed for her genuinely proper Lauds hymn) render
# a real versicle instead of an unconditionally-rendered empty one.
id: lauds-versicle-st-teresa-of-avila
text:
  la: |
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  en: |
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
status:
  la: verified
  en: verified
