# First Vespers versicle (engine render 2026-11-17, the Dedication of the Basilicas of Ss. Peter and Paul, ex C8; same as the Lauds versicle). See hours/resolve-common.ts's withVespersVariant.
id: vespers-versicle-common-of-a-dedication-first
text:
  la: |
    V. Hæc est domus Dómini fírmiter ædificáta.
    R. Bene fundáta est supra firmam petram.
  en: |
    V. This is the house of the Lord, firmly built.
    R. It is well founded upon a firm rock.
status:
  la: verified
  en: verified
