text:
  la: |
    2 Cor 6:9-10 Ut castigáti, et non mortificáti: quasi tristes, semper autem gaudéntes: sicut egéntes, multos autem locupletántes tamquam nihil habéntes, et ómnia possidéntes.
    R. Deo grátias.
    V. Scuto circúmdabit te véritas ejus.
    R. Non timébis a timóre noctúrno.
  en: |
    2 Cor 6:9-10 As dying, and behold we live; as chastised, and not killed; as sorrowful, yet always rejoicing; as needy, yet enriching many; as having nothing, and possessing all things.
    R. Thanks be to God.
    V. His truth shall compass thee with a shield.
    R. Thou shalt not be afraid of the terror of the night.
