# Read directly from web/www/horas/Latin/Sancti/09-17.txt's own
# [Oratio] and its English counterpart. Doxology "$Qui vivis" spelled
# out per the convention in st-bibiana-collect.yml.
id: stigmata-of-st-francis-collect
text:
  la: |
    Orémus.
    Dómine Jesu Christe, qui, frigescénte mundo, ad inflammándum corda
    nostra tui amóris igne, in carne beatíssimi Francísci passiónis tuæ
    sacra Stígmata renovásti: concéde propítius; ut ejus méritis et
    précibus crucem júgiter ferámus, et dignos fructus pæniténtiæ
    faciámus.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O Lord Jesus Christ, Who, when the love of many was waxing cold, didst
    manifest once more the holy marks of thine own Suffering in the flesh
    of thy most blessed servant Francis, to the end that our hearts might
    kindle again with the fire of the love of thyself, be Thou entreated
    for thy servant's sake, and grant to his and our prayers that we may
    effectually carry thy Cross and bring forth fruits meet for
    repentance.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
