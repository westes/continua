# Standard de-Communi commemoration for common-of-a-confessor-bishop
# (`[Ant 2]`+`[Versum 2]` from the reference engine's Commune files, same
# pattern st-francis-de-sales-commemoration.yml uses). st-alphonsus-liguori
# has no proper antiphon of his own in the source (a plain "vide C4a"
# reference), so this reuses the Common's own text, marked `draft` per
# this app's "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-alphonsus-liguori-collect.yml), unchanged.
id: st-alphonsus-liguori-commemoration
text:
  la: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui per beátum Alfónsum Maríam Confessórem tuum atque Pontíficem, animárum zelo
    succénsum, Ecclésiam tuam nova prole fecundásti: quǽsumus; ut, ejus salutáribus mónitis
    edócti et exémplis roboráti, ad te perveníre felíciter valeámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who through blessed Alphonsus Mary, thy Confessor and Bishop, enkindled with zeal
    for souls, didst make thy Church fruitful with new offspring: grant, we beseech thee;
    that, taught by his salutary counsels and strengthened by his examples, we may happily
    come unto thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
