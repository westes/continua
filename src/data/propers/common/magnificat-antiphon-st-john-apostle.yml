# St. John Apostle and Evangelist (Dec 27) second-Vespers Magnificat antiphon [Ant 3]:
# engine render, Monastic Tridentinum 1617, 2027-12-27 (Vespers). Before this file the
# saint fell to the Apostles' Common ("Estóte fortes").
id: magnificat-antiphon-st-john-apostle
text:
  la: "Exiit * sermo inter fratres, quod discípulus ille non móritur; et non dixit Jesus, Non móritur: sed, Sic eum volo manére, donec véniam."
  en: "A saying * went abroad among the brethren, that that disciple should not die; and Jesus did not say that he should not die, but so will I have him remain till I come."
status:
  la: verified
  en: verified
