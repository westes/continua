# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Joseph's own day (2026-03-19) -- the Benedictus
# antiphon. Corrects the previous version of this file, which had been
# sourced from the Roman/secular rite's Sancti/03-19.txt's own [Ant 1]
# instead: real but different text from what Monastic 1617 actually
# renders at Lauds, same mistake as St. Lawrence's earlier fix.
id: benedictus-antiphon-st-joseph
text:
  la: "Euge, serve bone et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, intra in gáudium Dómini tui."
  en: "Well done, thou good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of thy Lord."
status:
  la: verified
  en: verified
