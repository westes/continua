# Sunday's own plain ferial Matins invitatory antiphon (Psalterium/Special/
# Matutinum Special.txt's "Invit Trid_" block, `Dominica=`) — the plain
# `{Antiphona ex Psalterio secundum tempora}` weekday cycle genuinely
# varies Sunday-Saturday, same shape as the Matins hymn's own weekday
# cycle (see matins-hymn-ferial-tuesday.yml etc.). `matins-invitatory-
# antiphon.yml` (no day suffix) had been standing in for every day
# including Sunday with what's actually Monday's own text — reported by
# the user 2026-09-06 as suspect and live-verified against Monastic
# Tridentinum 1617 directly.
id: matins-invitatory-antiphon-sunday
text:
  la: "Adorémus Dóminum, * Qui fecit nos."
  en: "Let us worship the Lord, * for He is our Maker."
status:
  la: verified
  en: verified
