# Divino Afflatu 1954 engine render (2026-09-15, second Vespers; post-1617 feast, no Monastic render exists). Replaces a text that was either the Common BVM's versicle or the Apparition of St. Michael's with its Paschal Alleluia baked in. Paschaltide Alleluia is left to hours/paschal-alleluia.ts.
id: vespers-versicle-seven-sorrows-of-the-bvm
text:
  la: |
    V. Regína Mártyrum, ora pro nobis.
    R. Quæ juxta crucem Jesu constitísti.
  en: |
    V. Pray for us, O Queen of Martyrs.
    R. Who didst stand by the Cross of Jesus.
status:
  la: verified
  en: verified
