# Verified against Divinum Officium (Latin/English Sancti/11-22.txt's own
# [Ant 1] — the Lauds-hour antiphon, not Terce's. Refers to Valerian, her
# husband in the traditional legend.
id: st-cecilia-antiphon
text:
  la: "Est secrétum, * Valeriáne, quod tibi volo dícere: Angelum Dei hábeo amatórem, qui nímio zelo custódit corpus meum."
  en: "Valerian! there is a secret * which I wish to tell thee. I have an Angel of God for a lover, and he is very jealous to keep my body."
status:
  la: verified
  en: verified
