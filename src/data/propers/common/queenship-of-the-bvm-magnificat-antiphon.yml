# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/05-31.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution.
id: queenship-of-the-bvm-magnificat-antiphon
text:
  la: "Beáta Mater * et intácta Virgo María, gloriósa Regína mundi, intercéde pro nobis ad Dóminum. (Allelúja.)"
  en: "O Blessed Mother, * and Virgin Mary undefiled, glorious Queen of the world, intercede for us with the Lord. (Alleluia.)"
status:
  la: verified
  en: verified
