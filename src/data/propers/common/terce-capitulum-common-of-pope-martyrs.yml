# Verified against Divinum Officium (Monastic Tridentinum 1617),
# live query (Ss. Soter and Caius, 04-22-2042) -- common-of-pope-martyrs.
# For groups of Pope-Martyrs specifically (Commune/C3b.txt) -- real,
# distinct alleluia-toned text, not just several-martyrs with extra
# words; cross-checked against Ss. Cletus and Marcellinus.
id: terce-capitulum-common-of-pope-martyrs
text:
  la: |
    Stabunt justi in magna constántia advérsus eos qui se angustiavérunt et qui abstulérunt labóres eórum.
    R. Deo grátias.
    V. Sancti et justi in Dómino gaudéte, allelúia.
    R. Vos elégit Deus in hereditátem sibi, allelúia.
  en: |
    Then shall the just stand with great constancy against those that have afflicted them, and taken away their labours.
    R. Thanks be to God.
    V. Saints and just, rejoice in the Lord, alleluia.
    R. The Lord has chosen you for his inheritance, alleluia.
citation:
  la: "Sap 5:1"
  en: "Wis 5:1"
status:
  la: verified
  en: verified
