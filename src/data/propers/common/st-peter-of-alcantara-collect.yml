# [Oratio] and its English counterpart.
id: st-peter-of-alcantara-collect
text:
  la: |
    Orémus.
    Deus, qui beátum Petrum Confessórem tuum admirábilis pœniténtiæ et
    altíssimæ contemplatiónis múnere illustráre dignátus es: da nobis,
    quǽsumus; ut, ejus suffragántibus méritis, carne mortificáti,
    facílius cæléstia capiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O God, Who hast been pleased to set before us in thy blessed
    Confessor Peter a wondrous example of penance and of a mind
    unfathomably rapt in thee, let, we beseech thee, the same thy
    servant pray for us, and him do Thou accept, that we may so die unto
    earthly things, as to take lively hold on heavenly things.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    ℟. Amen.
