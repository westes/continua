# Sancti/10-02.txt [Capitulum Laudes] (Terce takes Lauds' chapter, None takes Lectio Prima, per the reference engine); versicle pair from Sancti/05-08.txt [Responsory Breve Tertia], which 10-02 inherits ('ex Sancti/05-08').
id: terce-capitulum-guardian-angels
text:
  la: |
    Ecce ego mittam Angelum meum, qui præcédat te, et custódiat in via, et introdúcat in locum, quem parávi. Obsérva eum et audi vocem ejus.
    R. Deo grátias.
    V. Stetit Angelus juxta aram templi.
    R. Habens thuríbulum áureum in manu sua.
  en: |
    Behold I will send my angel, who shall go before thee, and keep thee in thy journey, and bring thee into the place that I have prepared. Take notice of him, and hear his voice.
    R. Thanks be to God.
    V. An Angel stood at the Altar of the Temple.
    R. Having a golden censer in his hand.
citation:
  la: "Exod 23:20-21"
  en: "Exod 23:20-21"
status:
  la: verified
  en: verified
