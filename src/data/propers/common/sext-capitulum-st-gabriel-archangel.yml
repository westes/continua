# Sancti/03-24.txt [Capitulum Sexta] (Terce takes Lauds' chapter, None takes Lectio Prima, per the reference engine); versicle pair from Sancti/05-08.txt [Responsory Breve Sexta], which 03-24 inherits ('ex Sancti/05-08').
id: sext-capitulum-st-gabriel-archangel
text:
  la: |
    Ego autem veni, ut indicárem tibi, quia vir desideriórum es. Septuagínta hebdómades abbreviátæ sunt, ut finem accípiat peccátum, et impleátur vísio et prophetía, et ungátur Sanctus sanctórum.
    R. Deo grátias.
    V. Ascéndit fumus arómatum in conspéctu Dómini.
    R. De manu Angeli.
  en: |
    And I have come to show thee, for thou art greatly beloved: Seventy weeks are determined, to finish the trangression, and to make an end of sin, and to seal up the vision and prophecy, and to anoint the Most Holy.
    R. Thanks be to God.
    V. The smoke of the incense ascended up before the Lord.
    R. Out of the Angel's hand.
citation:
  la: "Dan 9:23-24"
  en: "Dan 9:23-24"
status:
  la: verified
  en: verified
