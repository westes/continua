# C4a.txt inherits from C4 and defines no [Lectio Prima] of its own,
# so the doctor Common uses C4's text (Sir 45:19-20), identical to
# prime-lectio-prima-common-of-a-confessor-bishop.yml.
id: prime-lectio-common-of-a-confessor-doctor
text:
  la: "Fungi sacerdótio, et habére laudem in nómine ipsíus, et offérre illi incénsum dignum in odórem suavitátis."
  en: "To execute the office of the priesthood, and to have praise, and to glorify his people in his name. He chose him out of all men living, to offer sacrifice to God, incense, and a good savour."
citation:
  la: "Sir 45:19-20"
  en: "Sir 45:19-20"
status:
  la: verified
  en: verified
