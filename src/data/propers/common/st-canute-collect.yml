id: st-canute-collect
text:
  la: |
    Orémus.
    Deus, qui ad illustrándam Ecclésiam tuam beátum Canútum regem martýrii palma et gloriósis
    miráculis decoráre dignátus es: concéde propítius; ut, sicut ipse Domínicæ passiónis
    imitátor fuit, ita nos, per ejus vestígia gradiéntes, ad gáudia sempitérna perveníre
    mereámur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in
    unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who, for the greater glory of Thy Church, wast pleased to adorn blessed Canute the
    king with the palm of martyrdom and with glorious miracles: mercifully grant that, as he
    was himself an imitator of our Lord's Passion, so we, walking in his footsteps, may
    deserve to attain to everlasting joys.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
