# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-09-02.
# Matins-only, unlike opening-alleluia.yml/opening-laus-tibi.yml (shared
# across every hour). In the Monastic rite this versicle follows "Deus in
# adjutórium" (rather than preceding it, as in the Roman/secular rite) and
# is recited three times ("iij" rubric) — see
# divinum-officium-reference/web/www/horas/Ordinarium/Matutinum.txt.
# No repeated Gloria Patri is needed here since it was already said with
# "Deus in adjutórium" immediately before this block.
id: opening-domine-labia
text:
  la: |
    V. Dómine, lábia mea apéries.
    R. Et os meum annuntiábit laudem tuam.
    V. Dómine, lábia mea apéries.
    R. Et os meum annuntiábit laudem tuam.
    V. Dómine, lábia mea apéries.
    R. Et os meum annuntiábit laudem tuam.
  en: |
    V. O Lord, open Thou my lips.
    R. And my mouth shall declare Thy praise.
    V. O Lord, open Thou my lips.
    R. And my mouth shall declare Thy praise.
