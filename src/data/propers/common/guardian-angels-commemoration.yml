# Own proper antiphon (guardian-angels-antiphon.yml), paired with the standard de-Communi commemoration versicle for common-of-an-angel (inferred from the C4 "structural category" citation in the saint's own file) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (guardian-angels-collect.yml), unchanged.
id: guardian-angels-commemoration
text:
  la: |
    Ant. Omnes sunt administratórii * Spíritus, in ministérium missi propter eos, qui hereditátem capiunt salútis.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui ineffábili providéntia sanctos Angelos tuos ad nostram custódiam
    míttere dignáris: largíre supplícibus tuis; et eórum semper protectióne
    deféndi, et ætérna societáte gaudére.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Are they not all * ministering spirits, sent forth to minister for them who shall be heirs of salvation?
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who in thine unspeakable Providence hast been pleased to give
    thine holy Angels charge over us, to keep us, mercifully grant unto our
    prayers, that we be both ever fenced by their wardship here, and
    everlastingly blessed by their fellowship hereafter.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
