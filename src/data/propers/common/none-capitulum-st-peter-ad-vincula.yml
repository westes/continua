# St. Peter's own minor-hour text, shared by Ss. Peter and Paul and St. Peter
# ad Vincula (both feasts are about Peter himself; extracted from their
# independently-authored files and confirmed identical). Previously held in
# none-capitulum-common-of-st-peter.yml as a pseudo-Common; now each feast's own proper.
# Verified against Divinum Officium (Monastic Tridentinum 1617), None.
# Extracted (2026-08) from St. Peter ad Vincula and Ss. Peter and Paul's
# independently-authored content, confirmed identical via diff — see
# none-antiphon-common-of-st-peter.yml's header (their own per-saint files
# differed only by a stray missing colon in one of the two English
# transcriptions, reconciled here to match the Latin's own punctuation).
id: none-capitulum-st-peter-ad-vincula
text:
  la: |
    Et Petrus ad se revérsus dixit: Nunc scio vere quia misit Dóminus Angelum suum, et erípuit me de manu Heródis et de omni exspectatióne plebis Judæórum.
    R. Deo grátias.
    V. Nimis honoráti sunt amíci tui, Deus.
    R. Nimis confortátus est principátus eórum.
  en: |
    And when Peter was come to himself, he said: Now I know of a surety that the Lord hath sent His Angel, and hath delivered me out of the hand of Herod, and from all the expectation of the people of the Jews.
    R. Thanks be to God.
    V. Thy friends, O Lord, are made exceedingly honourable.
    R. Their principality is exceedingly strengthened.
citation:
  la: "Act 12:11"
  en: "Acts 12:11"
status:
  la: verified
  en: verified
