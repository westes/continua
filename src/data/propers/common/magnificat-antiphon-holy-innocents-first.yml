id: magnificat-antiphon-holy-innocents-first
text:
  la: "Hi sunt, * qui cum muliéribus non sunt coinquináti: vírgines enim sunt, et sequúntur Agnum quocúmque íerit."
  en: "These are they * who were not defiled with women; for they are virgins, and follow the Lamb whithersoever he goeth."
