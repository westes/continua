id: collect-st-andrew-avellino
text:
  la: |
    Orémus.
    Deus, qui in corde beáti Andréæ Confessóris tui, per árduum cotídie in virtútibus proficiéndi votum, admirábiles ad te ascensiónes disposuísti: concéde nobis, ipsíus méritis et intercessióne, ita ejúsdem grátiæ partícipes fíeri; ut, perfectióra semper exsequéntes, ad glóriæ tuæ fastígium felíciter perducámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.

  en: |
    Let us pray.
    O God, Who didst make thy blessed Confessor Andrew to settle in his heart to go up wondrously toward thee by a stern vow daily to advance to the utmost of his power in godliness, grant unto us for the same thy servant's sake and at his prayers the like grace, so that we, seeking ever that which is more perfect, may happily attain the crown of thine everlasting glory.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

