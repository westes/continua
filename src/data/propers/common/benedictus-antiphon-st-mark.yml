# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Mark's own day (2026-04-25). The Benedictus antiphon --
# see ss-tiburtius-valerian-and-maximus-antiphon.yml's note on the shared
# Eastertide Common text (his own rendering happened to only show the
# full form, not a separate incipit, so no '*' is inserted here).
id: benedictus-antiphon-st-mark
text:
  la: "Fíliæ Jerúsalem, veníte et vidéte Mártyres cum corónis, quibus coronávit eos Dóminus in die solemnitátis et lætítiæ, allelúia, allelúia."
  en: "Daughters of Jerusalem, come and see the crowned martyrs, the Lord crowned them in his solemnity and delight, alleluia, alleluia."
status:
  la: verified
  en: verified
