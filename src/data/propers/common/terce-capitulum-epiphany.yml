# Engine render (Monastic Tridentinum 1617, command=prayTertia, 2027-01-06); Latin and English both taken from the page.
id: terce-capitulum-epiphany
text:
  la: |
    Isa 60:1 Surge, illumináre Jerúsalem, quia venit lumen tuum, et glória Dómini super te orta est.
    R. Deo grátias.
    V. Reges Tharsis et ínsulæ múnera ófferent, allelúja.
    R. Reges Arabum et Saba dona addúcent, allelúja.
  en: |
    Isa 60:1 Arise, be enlightened, O Jerusalem: for thy light is come, and the glory of the Lord is risen upon thee.
    R. Thanks be to God.
    V. The kings of Tarshish and of the isles shall bring presents, allelúja.
    R. The kings of Arabia and Saba shall offer gifts, allelúja.
