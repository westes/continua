# Commune/C7b.txt [Capitulum Nona] (a widow takes C7a; several women martyrs take C7b->C7). Terce takes the Lauds chapter and None takes Lectio Prima per the engine. The V/R pair after the chapter is the responsory breve inherited from Commune/C6. Replaced a copy of the Virgin's chapter (2 Cor 10:17 etc.), which the reference does not use for this Common.
id: none-capitulum-common-of-several-women-martyrs
text:
  la: |
    Laudábit usque ad mortem ánima mea Dóminum, quóniam éruis sustinéntes te, et líberas eos de manu angústiæ, Dómine, Deus noster.
    R. Deo grátias.
    V. Elégit eam Deus, et præelégit eam.
    R. In tabernáculo suo habitáre facit eam.
  en: |
    My soul shall praise the Lord even to death. How thou deliverest them that wait for thee, O Lord, and savest them out of the hands of the nations!
    R. Thanks be to God.
    V. God hath chosen her, and fore-chosen her.
    R. He hath made her to dwell in His tabernacle.
citation:
  la: "Sir 51:8; 51:12"
  en: "Sir 51:8; 51:12"
status:
  la: verified
  en: verified
