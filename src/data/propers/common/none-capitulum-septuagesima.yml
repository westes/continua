text:
  la: |
    1 Cor 10:4-5 Bibébant autem de spiritáli, consequénte eos, petra: petra autem erat Christus: sed non in plúribus eórum beneplácitum est Deo.
    R. Deo grátias.
    V. Ab occúltis meis munda me, Dómine.
    R. Et ab aliénis parce servo tuo.
  en: |
    1 Cor 10:4-5 And all drank the same spiritual drink; and they drank of the spiritual rock that followed them, and the rock was Christ. But with most of them God was not well pleased: for they were overthrown in the desert.
    R. Thanks be to God.
    V. From my secret ones cleanse me, O Lord.
    R. And from those of others spare thy servant.
