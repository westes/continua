id: prime-lectio-commemoration-of-st-paul
text:
  la: "Ego enim sum mínimus Apostolórum, qui non sum dignus vocári Apóstolus, quóniam persecútus sum Ecclésiam Dei. Grátia autem Dei sum id quod sum, et grátia ejus in me vácua non fuit."
  en: "For I am the least of the Apostles, that am not worthy to be called an Apostle, because I persecuted the Church of God. But by the grace of God I am what I am, and His grace, which was bestowed upon me, was not in vain."
citation:
  la: "1 Cor 15:9-10"
  en: "1 Cor 15:9-10"
status:
  la: verified
  en: verified
