# Sancti/07-01.txt [Capitulum Nona] and [Responsory Breve Nona].
id: none-capitulum-most-precious-blood
text:
  la: |
    Accípiens Móyses sánguinem vitulórum, et hircórum cum aqua et lana coccínea et hyssópo: ipsum quoque librum, et omnem pópulum aspérsit, dicens: Hic sanguis testaménti, quod mandávit ad vos Deus.
    R. Deo grátias.
    V. Christus diléxit nos, et lavit nos in sánguine suo.
    R. Et fecit nos regnum, et sacerdótes Deo, et Patri.
  en: |
    Moses took the blood of calves and goats, with water, and scarlet wool and hyssop, and sprinkled both the book itself and all the people, saying: This is the blood of the testament, which God hath enjoined unto you.
    R. Thanks be to God.
    V. Christ loved us, and washed us from our sins in His Own Blood.
    R. And hath made us unto our God and Father a kingdom and priests.
citation:
  la: "Heb 9:19-20"
  en: "Heb 9:19-20"
status:
  la: verified
  en: verified
