text:
  la: |
    V. Sub umbra illíus, quem desideráveram, sedi, allelúja.
    R. Et fructus ejus dulcis gútturi meo, allelúja.
  en: |
    V. I sat under His shadow in Whom I delighted. Alleluia.
    R. To my taste. And His fruit was sweet Alleluia.
