# Sancti/08-06.txt [Capitulum Nona] and [Responsory Breve Nona]; the Monastic source's matching versicle (Versum 1 / Nocturn 2 Versum / Nocturn 3 Versum) carries no Alleluia.
id: none-capitulum-transfiguration
text:
  la: |
    Sústulit me in spíritu in montem magnum et altum, et osténdit mihi civitátem sanctam Jerúsalem, descendéntem de cælo a Deo, habéntem claritátem Dei; et lucérna ejus est Agnus.
    R. Deo grátias.
    V. Magna est glória ejus in salutári tuo.
    R. Glóriam et magnum decórem impónes super eum.
  en: |
    He carried me away in the Spirit to a great and high mountain, and showed me the holy city Jerusalem, descending out of heaven from God, having the glory of God. And the Lamb is the Light thereof.
    R. Thanks be to God.
    V. His glory is great in thy salvation.
    R. Honour and great majesty shalt Thou lay upon him.
citation:
  la: "Apoc 21:10-11; 21:23"
  en: "Rev 21:10-11,23."
status:
  la: verified
  en: verified
