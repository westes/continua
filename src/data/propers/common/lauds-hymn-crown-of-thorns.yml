# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
id: lauds-hymn-crown-of-thorns
text:
  la: |
      Legis figuris pingitur
      Christi Coróna nóbilis:
      Implexa Spinis victima,
      Ardensque testátur rubus.

      Arcam coróna cinxerat,
      Mensæque sacrum círculum
      Aramque thure fumidam,
      Corónam nectit ambiens.

      Christi dolórum conscia
      Salve Coróna glóriæ.
      Gemmis et auro pulchrior
      Vinces coronas siderum.

      Virtus, honor, laus, glória
      Deo Patri cum Fílio,
      Sancto simul Paráclito,
      In sæculórum sǽcula.
      Amen.
  en: |
      The noble Crown of Christ is pictured
      in figures of the law:
      the victim entangled in thorns,
      and the burning bush bear witness.

      A crown had girded the ark, and, going round,
      twines a crown about the sacred rim of the table
      and the altar smoking with incense.

      Hail, Crown of glory,
      witness of the sorrows of Christ.
      More beautiful than gems and gold,
      thou shalt surpass the crowns of the stars.

      Might, honour, praise, glory
      to God the Father with the Son,
      and likewise to the Holy Paraclete,
      for ever and ever. Amen.
status:
  la: verified
  en: draft
