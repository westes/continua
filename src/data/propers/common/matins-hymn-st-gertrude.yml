# St. Gertrude: proper Matins hymn, Latin/SanctiM/11-16.txt's [Hymnus Matutinum]. The reference has no English for it, so the English is a fresh translation, marked draft.
# Before this file the saint fell to the Common's hymn.
id: matins-hymn-st-gertrude
text:
  la: |
    Mira noctúrnis, modulánte lingua,
    Gesta Gertrúdis celebrémus horis,
    Quæ sacris instans précibus perégit
    Témpora noctis.

    Illíus votis Deus obsecúndans,
    Mox repentínas plúvias profúdit,
    Moxque suspénsos grávidis coércet
    Núbibus imbres.

    Arva jam dudum glácie rigébant,
    Corde cum mœsto míserans colónos,
    Férvidis Virgo lácrimis resólvit
    Frígora brumæ.

    Ne seges largo vitiétur imbre,
    Sédulis cælum précibus serénat,
    Et graves læsi gemebúnda placat
    Núminis iras.

    Ignéis mentes pénetrat sagíttis,
    Lánguidis confert ánimis medélam,
    Atque succéndit sceleráta castis
    Péctora flammis.

    Vírginum sponsum superúmque Regem
    Vírginum sanctæ célebrent choréæ,
    Et sacram supplex Tríadem per ævum
    Orbis adóret.
    Amen.
  en: |
    Let us celebrate at the night hours,
    with tuneful tongue, the wonderful deeds of Gertrude,
    who, persevering in holy prayers,
    spent the hours of the night.

    God, complying with her prayers,
    soon poured out sudden rains,
    and soon held back the showers
    hanging in heavy clouds.

    The fields had long been stiff with frost,
    when the Virgin, with sad heart pitying the farmers,
    melted the cold of winter
    with fervent tears.

    Lest the crop be spoiled by too much rain,
    she cleared the sky by constant prayers,
    and, groaning, appeased
    the grave wrath of the Godhead.

    She pierces minds with fiery arrows,
    brings healing to languid souls,
    and sets sinful hearts aflame
    with chaste fires.

    Let the holy choirs of virgins celebrate
    the Spouse of virgins and King of the heavenly ones,
    and let the world in supplication adore
    the holy Trinity for ever.
    Amen.
status:
  la: verified
  en: draft
