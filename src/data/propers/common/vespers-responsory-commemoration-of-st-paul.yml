# Duplicated verbatim from Common-of-an-Apostle's own Vespers responsory
# (2026-08-26): unlike Lauds (independently live-verified all-Common-
# except-chapter on 2035-06-30, see lauds-capitulum-commemoration-of-st-
# paul.yml), this saint's real Vespers is permanently masked in the
# reference engine by the (unmodeled-in-this-app) Octave of the
# Nativity of St. John the Baptist closing the same day, every year
# checked (2026-2030) -- inferred by the same "all-Common-except-
# chapter" pattern established at Lauds, not independently verified.
id: vespers-responsory-commemoration-of-st-paul
text:
  la: |
    R.br. Constítues eos príncipes * Super omnem terram.
    R. Constítues eos príncipes * Super omnem terram.
    V. Mémores erunt nóminis tui, Dómine.
    R. Super omnem terram.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Constítues eos príncipes * Super omnem terram.
  en: |
    R.br. Thou shalt make them princes * over all the earth.
    R. Thou shalt make them princes * over all the earth.
    V. They shall remember thy name, O Lord.
    R. All over the earth.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Thou shalt make them princes * over all the earth.
status:
  la: verified
  en: verified
