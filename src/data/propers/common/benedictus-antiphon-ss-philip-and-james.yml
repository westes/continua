# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, Ss. Philip and James's own day (2026-05-01) -- the
# Benedictus antiphon. Corrects the previous version of this file, which
# had been sourced from the Roman/secular rite's Sancti/05-01.txt's own
# [Ant 1] instead: real but different text from what Monastic 1617
# actually renders at Lauds, same mistake as St. Lawrence's earlier fix.
id: benedictus-antiphon-ss-philip-and-james
text:
  la: "Ego sum via, véritas, et vita: nemo venit ad Patrem, nisi per me, allelúia."
  en: "I am the Way the Truth, and the Life: no man cometh unto the Father, but by Me. Alleluia."
status:
  la: verified
  en: verified
