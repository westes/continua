# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/10-23-Redemptor.txt ("Ss. Redemptoris", Duplex majus, nine lessons; no Common: every part is its own or named by an `@` include, read from the file it names). The short responsory is the standard Prime form (as in prime-chapter-responsory-most-precious-blood.yml) with this feast's own versicle. English is this project's own translation, marked draft.
id: prime-chapter-responsory-most-holy-redeemer
text:
  la: |
      R.br. Christe, Fili Dei vivi, * Miserére nobis.
      R. Christe, Fili Dei vivi, * Miserére nobis.
      V. Qui redemísti mundum.
      R. Miserére nobis.
      V. Glória Patri, et Fílio, * et Spirítui Sancto.
      R. Christe, Fili Dei vivi, * Miserére nobis.
  en: |
      R.br. Christ, Son of the living God, * have mercy on us.
      R. Christ, Son of the living God, * have mercy on us.
      V. Thou who hast redeemed the world.
      R. Have mercy on us.
      V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
      R. Christ, Son of the living God, * have mercy on us.
status:
  la: verified
  en: draft
