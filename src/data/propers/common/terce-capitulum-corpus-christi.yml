# Engine render (Monastic Tridentinum 1617, command=prayTertia, 2027-05-27); Latin and English both taken from the page.
id: terce-capitulum-corpus-christi
text:
  la: |
    1 Cor 11:23-24 Fratres: Ego enim accépi a Dómino quod et trádidi vobis, quóniam Dóminus Jesus, in qua nocte tradebátur, accépit panem, et grátias agens fregit, et dixit: Accípite et manducáte: hoc est corpus meum, quod pro vobis tradétur: hoc fácite in meam commemoratiónem.
    R. Deo grátias.
    V. Panem de cælo præstitísti eis, allelúia.
    R. Omne delectaméntum in se habéntem, allelúia.
  en: |
    1 Cor 11:23-24 Brothers: For I have received of the Lord that which also I delivered unto you, that the Lord Jesus, the same night in which he was betrayed, took bread. And giving thanks, broke, and said: Take ye, and eat: this is my body, which shall be delivered for you: this do for the commemoration of me.
    R. Thanks be to God.
    V. Thou didst send them from heaven, alleluia.
    R. Bread able to content every man's delight, alleluia.
