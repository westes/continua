# Verified -- bishop/non-bishop distinction in the martyr Common affects
# only the collect, not these Scripture capitula. Content identical to
# sext-capitulum-common-of-a-martyr.yml (Sir 15:3).
id: sext-capitulum-common-of-a-martyr-bishop
text:
  la: |
    Cibávit illum pane vitæ et intelléctus, et aqua sapiéntiæ salutáris potávit illum Dóminus Deus noster.
    R. Deo grátias.
    V. Posuísti, Dómine, super caput ejus.
    R. Corónam de lápide pretióso.
  en: |
    With the bread of life and understanding, she shall feed him, and give him the water of wholesome wisdom to drink: and she shall be made strong in him, and he shall not be moved.
    R. Thanks be to God.
    V. O Lord, Thou hast set a crown of precious stones.
    R. Upon his head.
citation:
  la: "Sir 15:3"
  en: "Sir 15:3"
status:
  la: verified
  en: verified
