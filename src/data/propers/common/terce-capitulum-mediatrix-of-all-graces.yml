# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt (Duplex majus, nine lessons, `ex C11`). English is the Douay-Rheims text from the project's scripture store.
id: terce-capitulum-mediatrix-of-all-graces
text:
  la: |
      Omnes sitiéntes, veníte ad aquas: et qui non habétis argéntum, properáte, émite et comédite: veníte, émite absque argénto et absque ulla commutatióne vinum et lac.
      R. Deo grátias.
      V. Nostras deprecatiónes ne despícias.
      R. In necessitátibus nostris.
  en: |
      All you that thirst, come to the waters: and you that have no money make haste, buy, and eat: come ye, buy wine and milk without money, and without any price.
      R. Thanks be to God.
      V. Despise not our petitions.
      R. In our necessities.
citation:
  la: "Is 55:1"
  en: "Isaiah 55:1"
status:
  la: verified
  en: verified
