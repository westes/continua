id: sext-capitulum-christmas-octave-sunday
text:
  la: |
    At ubi venit plenitúdo témporis, misit Deus Fílium suum factum ex mulíere, factum sub lege, ut eos, qui sub lege erant, redímeret, ut adoptiónem filiórum reciperémus.
    R. Deo grátias.
    V. Vidérunt omnes fines terræ, allelúia.
    R. Salutáre Dei nostri, allelúia.
  en: |
    But when the fulness of the time was come, God sent his Son, made of a woman, made under the law: That he might redeem them who were under the law: that we might receive the adoption of sons.
    R. Thanks be to God.
    V. All the ends of the earth have seen, alleluia.
    R. The salvation of our God, alleluia.
citation:
  la: "Gal 4:4-5"
  en: "Gal 4:4-5"
status:
  la: verified
  en: verified
