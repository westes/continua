id: magnificat-antiphon-nativity-of-st-john-the-baptist
text:
  la: "Puer * qui natus est nobis, plus quam prophéta est: hic est enim, de quo Salvátor ait: Inter natos mulíerum non surréxit major Joánne Baptísta."
  en: "The child, that unto us is born, * is much more than a Prophet, for this is he of whom the Saviour saith: Among them that are born of women there hath not risen a greater than John the Baptist."
