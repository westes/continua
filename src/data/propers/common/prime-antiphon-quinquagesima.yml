text:
  la: "Iter faciénte * Jesu, dum appropinquáret Jericho, cæcus clamábat ad eum, ut lumen recípere mererétur."
  en: "As Jesus went on His way, * as He was come nigh unto Jericho, a certain blind man cried unto Him, that he might worthily receive his sight."
