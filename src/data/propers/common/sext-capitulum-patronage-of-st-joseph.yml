id: sext-capitulum-patronage-of-st-joseph
text:
  la: |
    Gen 49:25 Deus patris tui erit adjútor tuus, et Omnípotens benedícet tibi benedictiónibus cæli désuper.
    R. Deo grátias.
    V. Justus germinábit sicut lílium, allelúia.
    R. Et florébit in ætérnum ante Dóminum, allelúia.
  en: |
    Gen 49:25 The blessings of thy father are strengthened with the blessings of his fathers: until the desire of the everlasting hills should come; may they be upon the head of Joseph, and upon the crown of the Nazarite among his brethren.
    R. Thanks be to God.
    V. The righteous shall grow as the lily. Alleluia.
    R. Yea, he shall flourish for ever in the presence of the Lord. Alleluia.
