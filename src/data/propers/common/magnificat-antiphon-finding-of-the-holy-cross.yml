id: magnificat-antiphon-finding-of-the-holy-cross
text:
  la: "Crucem sanctam súbiit, * qui inférnum confrégit: accínctus est poténtia, surréxit die tértia. Allelúja. "
  en: "Jesus, our triumphant Head, * on the cross' ransom dread, the hands of power and mercy spread, that broke the prison of the dead. Alleluia."
