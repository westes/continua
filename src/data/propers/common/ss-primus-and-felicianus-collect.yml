id: ss-primus-and-felicianus-collect
text:
  la: |
    Orémus.
    Fac nos, quǽsumus, Dómine, sanctórum Mártyrum tuórum Primi et Feliciáni semper festa sectári: quorum suffrágiis protectiónis tuæ dona sentiámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    Make us, O Lord, we beseech thee, ever heartily to rejoice over thine holy martyrs Primus and Felician, and grant to us at their prayer the gift of thy safe-keeping.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
