id: collect-st-teresa-of-avila
text:
  la: |
    Orémus.
    Exáudi nos, Deus, salutáris noster: ut sicut de beátæ Terésiæ Vírginis
    tuæ festivitáte gaudémus; ita cæléstis ejus doctrínæ pábulo
    nutriámur, et piæ devotiónis erudiámur afféctu.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Hear us, O God, our Savior, that as we rejoice in the feast of
    Blessed Teresa, thy Virgin, so we may be fed with the food of her
    heavenly teaching and be instructed in the affection of pious
    devotion.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
