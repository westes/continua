# Ant+V/R+collect commemoration bundle, same combined-bundle shape as
# st-canute-commemoration.yml -- see hours/resolve-common.ts's
# sanctoralCommemorationPart. Ant is Hildegard's own proper (source's
# `[Ant 2]`, "nisi rubrica cisterciensis" -- the default rubric); the
# source gives no versicle of its own, so Versum is borrowed from the
# Common of a Virgin's own de-Communi pairing
# (lauds-versicle-common-of-a-virgin.yml, already verified elsewhere).
# English Ant/collect are this project's own translation (see
# st-hildegard-collect.yml), marked draft.
id: st-hildegard-commemoration
text:
  la: |
    Ant. Sponsa Christi * Hildegárdis, doctrínæ salutáris lámpade sanctam illuminávit Ecclésiam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui beátam Hildegárdem Vírginem tuam donis cæléstibus decorásti: tríbue, quæsumus; ut, ejus vestígiis et documéntis insisténtes, a præséntis sæculi calígine ad lucem tuam delectábilem transíre mereámur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The spouse of Christ, Hildegard, * illumined the holy Church with the lamp of saving doctrine.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, who didst adorn blessed Hildegard, thy Virgin, with heavenly gifts: grant, we beseech thee, that, following in her footsteps and her teachings, we may deserve to pass from the darkness of this present age unto thy delightful light.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: draft
