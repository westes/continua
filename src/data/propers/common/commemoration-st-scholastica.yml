# Own proper antiphon (st-scholastica-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-virgin (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (st-scholastica-collect.yml), unchanged.
id: commemoration-st-scholastica
text:
  la: |
    Ant. O quam præclára sunt mérita beátæ Scholásticæ! O quanta virtus lacrimárum, per quas ínclyta Virgo áeris serenitátem ad plúviæ traxit inundatiónem.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui ánimam beátæ Vírginis tuæ Scholásticæ ad ostendéndam innocéntiæ viam in colúmbæ spécie cælum penetráre fecísti: da nobis ejus méritis et précibus ita innocénter vívere; ut ad ætérna mereámur gáudia perveníre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. O how glorious are the merits of blessed Scholastica! O how great the power of her tears, by which the renowned Virgin turned a clear sky into a flooding rain.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Who, to show the way of the undefiled, wast pleased that the soul of thy blessed Virgin Scholastica should fly to heaven in a bodily shape, like a dove, mercifully grant unto us thy servants, for her sake, and at her petition, worthily to attain unto thine everlasting joy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
