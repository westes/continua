# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/12-28.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast, not a Common
# substitution. (This feast's own Benedictus antiphon,
# holy-innocents-antiphon.yml, already correctly sources [Ant 1] --
# [Ant 2] there is a bare `@:Ant 1` cross-reference, same text reused
# for both, not a mis-tagging.)
id: holy-innocents-magnificat-antiphon
text:
  la: "Innocéntes pro Christo * infántes occísi sunt, ab iníquo rege lacténtes interfécti sunt: ipsum sequúntur Agnum sine mácula, et dicunt semper: Glória tibi, Dómine."
  en: "Innocent babies * were slain for Christ, sucklings were killed by a wicked king. Now they follow the Lamb without spot and cry without ceasing, Glory be to thee, O Lord."
status:
  la: verified
  en: verified
