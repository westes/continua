id: sext-antiphon-quinquagesima
text:
  la: "Et qui præíbant, * increpábant eum ut tacéret: ipse vero multo magis clamábat: Miserére mei, Fili David."
  en: "And they that went before rebuked him, * that he should hold his peace, but he cried so much the more: Thou Son of David, have mercy on me!"
