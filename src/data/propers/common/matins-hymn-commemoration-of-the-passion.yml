# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
id: matins-hymn-commemoration-of-the-passion
text:
  la: |
      Áspice, infami Deus ipse ligno
      Pendet, effuso madidus cruóre;
      Áspice, immiti manus alma clavo
      Finditur alte.

      Hunc, velut pravi scéleris minístrum;
      Inter indignos médium latrones,
      Cerne; crudelis fuit ista gentis
      Dira volúntas.

      Pallet heu! vultus; caput ecce lapsum
      Flectitur; clausis óculis, Redémptor
      Spíritum sacro, méritis onustum,
      Fundit ab ore.

      O cor, æs durum superas, gemendo,
      Ni scelus tergas; tua culpa Christum
      Stipiti affixit; tua culpa morti
      Súbdidit atræ.

      Sit Deo ætérnum decus omne in ævum,
      Qui pius nostri géneris Redémptor,
      Críminis labem miseris nocentem
      Sánguine tersit.
      Amen.
  en: |
      Behold, God himself hangs on the infamous wood,
      drenched with outpoured blood;
      behold, his kindly hand is deeply
      cleft by the cruel nail.

      Him, as the minister of base crime,
      behold in the midst between unworthy thieves;
      cruel was that terrible
      will of the nation.

      Alas, his face grows pale; behold, the fallen head
      is bowed; with closed eyes the Redeemer
      pours out his spirit, laden with merits,
      from his sacred mouth.

      O heart, thou art harder than bronze, unless
      by groaning thou wipe away thy sin; thy guilt
      fixed Christ to the stake; thy guilt
      subjected him to black death.

      To God be eternal honour for all ages,
      who, loving Redeemer of our race,
      washed away with his blood the stain of guilt
      that harmed us wretched ones. Amen.
status:
  la: verified
  en: draft
