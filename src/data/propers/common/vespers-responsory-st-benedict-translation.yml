id: vespers-responsory-st-benedict-translation
text:
  la: |
    R.br. Sancte Pater Benedícte, * Intercéde pro nobis.
    R. Sancte Pater Benedícte, * Intercéde pro nobis.
    V. Ut digni efficiámur promissiónibus Christi.
    R. Intercéde pro nobis.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Sancte Pater Benedícte, * Intercéde pro nobis.
  en: |
    R.br. Holy Father Benedict, * intercede for us.
    R. Holy Father Benedict, * intercede for us.
    V. That we may be made worthy of the promises of Christ.
    R. Intercede for us.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Holy Father Benedict, * intercede for us.
status:
