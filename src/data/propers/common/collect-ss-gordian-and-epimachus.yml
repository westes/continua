id: collect-ss-gordian-and-epimachus
text:
  la: |
    Orémus.
    Da, quǽsumus, omnípotens Deus: ut, qui beatórum Mártyrum tuórum Gordiáni et Epímachi
    solémnia cólimus, eórum apud te intercessiónibus adjuvémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Grant, we beseech thee, almighty God, that we, who celebrate the solemn feast of thy holy
    Martyrs Gordian and Epimachus, may be helped by their intercession with thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of
    the Holy Ghost, God, world without end.
    R. Amen.
