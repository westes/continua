id: lauds-versicle-st-agatha
text:
  la: |
    ℣. Diffúsa est grátia in lábiis tuis.
    ℟. Proptérea benedíxit te Deus in ætérnum.
  en: |
    ℣. Grace is poured into thy lips.
    ℟. Therefore God hath blessed thee for ever.
