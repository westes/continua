# web/www/horas/Latin/SanctiM/10-03b.txt's [Responsory Laudes]. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: lauds-responsory-st-therese-of-lisieux
text:
  la: |
    R.br. Exsultábo et lætábor, Dómine, * In misericórdia tua.
    R. Exsultábo et lætábor, Dómine, * In misericórdia tua.
    V. Quóniam respéxit humilitátem meam.
    R. In misericórdia tua.
    V. Glória Patri, et Fílio, * et Spirítui Sancto.
    R. Exsultábo et lætábor, Dómine, * In misericórdia tua.
  en: |
    R.br. I will be glad and rejoice, O Lord, * in thy mercy.
    R. I will be glad and rejoice, O Lord, * in thy mercy.
    V. For thou hast regarded my humility.
    R. In thy mercy.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. I will be glad and rejoice, O Lord, * in thy mercy.
status:
  la: verified
  en: draft
