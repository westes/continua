# [Oratio] and its English counterpart.
id: guardian-angels-collect
text:
  la: |
    Orémus.
    Deus, qui ineffábili providéntia sanctos Angelos tuos ad nostram custódiam
    míttere dignáris: largíre supplícibus tuis; et eórum semper protectióne
    deféndi, et ætérna societáte gaudére.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Let us pray.
    O God, Who in thine unspeakable Providence hast been pleased to give
    thine holy Angels charge over us, to keep us, mercifully grant unto our
    prayers, that we be both ever fenced by their wardship here, and
    everlastingly blessed by their fellowship hereafter.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
