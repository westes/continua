# Fully proper feast -- own real [Ant 2]/[Versum 2] read directly from the reference engine's own Sancti file (Latin + English), not a Common-category substitute. Collect is the saint's own real proper (transfiguration-collect.yml), unchanged.
id: commemoration-transfiguration
text:
  la: |
    Ant. Et ecce, * vox de nube dicens: Hic est Fílius meus diléctus, in quo mihi complácui; ipsum audíte, allelúja.
    V. Coróna áurea super caput ejus.
    R. Expréssa signo sanctitátis, glóriæ, et honóris.
    Orémus.
    Deus, qui fídei sacraménta in Unigéniti tui gloriósa Transfiguratióne patrum testimónio
    roborásti, et adoptiónem filiórum perféctam, voce delápsa in nube lúcida, mirabíliter
    præsignásti: concéde propítius; ut ipsíus Regis glóriæ nos coherédes effícias, et
    ejúsdem glóriæ tríbuas esse consórtes.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Ant. And, behold, a voice out of the cloud, * which said: This is My beloved Son, in Whom I am well pleased; hear ye Him, alleluia.
    V. A crown of gold upon his head.
    R. Wherein was engraved holiness, glory, and honour.
    Let us pray.
    O God, Who, in the glorious Transfiguration of thine Only Begotten Son didst attest the
    mysteries of the Faith by the witness of the Fathers, and didst wonderfully signify by a
    voice out of a bright cloud, the adoption of sons, mercifully grant unto us to be made
    co-heirs with the very King of glory, and bestow upon us a partaking of His glory.
    Who liveth and reigneth with God the Father, in the unity of the Holy Ghost, God, world
    without end.
    R. Amen.
