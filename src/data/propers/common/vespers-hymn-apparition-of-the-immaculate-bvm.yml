# No distinct Vespers hymn found for this feast in the reference source
# (both Latin/English [Hymnus Vespera] blocks are empty); reusing
# common-of-the-bvm's own Vespers hymn ("Ave maris stella") verbatim.
# Authored to make the feast's own bundle (needed for her own Lauds
# hymn, see lauds-capitulum-apparition-of-the-immaculate-bvm.yml -- Vespers falls back to the same
# Lauds capitulum via lookupPart (Vespers chapter, Lauds sibling)) render a real hymn
# instead of an unconditionally-rendered empty one.
id: vespers-hymn-apparition-of-the-immaculate-bvm
text:
  la: >-
    Ave maris stella,

    Dei Mater alma,

    Atque semper Virgo,

    Felix cæli porta.


    Sumens illud Ave

    Gabriélis ore,

    Funda nos in pace,

    Mutans Hevæ nomen.


    Solve vincla reis,

    Profer lumen cæcis,

    Mala nostra pelle,

    Bona cuncta posce.


    Monstra te esse matrem,

    Sumat per te preces,

    Qui pro nobis natus,

    Tulit esse tuus.


    Virgo singuláris,

    Inter omnes mitis,

    Nos culpis solútos

    Mites fac et castos.


    Vitam præsta puram,

    Iter para tutum,

    Ut vidéntes Jesum,

    Semper collætémur.


    Sit laus Deo Patri,

    Summo Christo decus,

    Spirítui Sancto,

    Tribus honor unus. Amen.
  en: >-
    Ave, star of ocean,

    Child divine who barest,

    Mother, ever-Virgin,

    Heaven's portal fairest.


    Taking that sweet Ave

    Erst by Gabriel spoken,

    Eva's name reversing,

    Be of peace the token.


    Break the sinners' fetters,

    Light to blind restoring,

    All our ills dispelling,

    Every boon imploring.


    Show thyself a mother

    In thy supplication;

    He will hear who chose thee

    At his incarnation.


    Maid all maids excelling,

    Passing meek and lowly,

    Win for sinners pardon,

    Make us chaste and holy.


    As we onward journey

    Aid our weak endeavour,

    Till we gaze on Jesus

    And rejoice forever.


    Father, Son, and Spirit,

    Three in One confessing,

    Give we equal glory

    Equal praise and blessing. Amen.
status:
  la: verified
  en: verified
