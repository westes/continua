# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quad2-5-SindonDNJC.txt (Duplex majus, Friday of the second week of Lent). English is this project's own translation, marked draft.
id: terce-capitulum-holy-shroud
text:
  la: |
      Quis est iste, qui venit de Edom, tinctis véstibus de Bosra?  Iste formósus in stola sua, grádiens in multitúdine fortitúdinis suæ. Ego qui loquor justítiam, et propugnátor sum ad salvándum.
      R. Deo grátias.
      V. Adoramus te Christe, et benedícimus tibi.
      R. Quia per crucem tuam redemísti mundum.
  en: |
      Who is this that cometh from Edom, with dyed garments from Bosra? This beautiful one in his robe, walking in the greatness of his strength. I, that speak justice, and am a defender to save.
      R. Thanks be to God.
      V. We adore thee, O Christ, and we bless thee.
      R. Because by thy Cross thou hast redeemed the world.
citation:
  la: "Is 63:1"
  en: "Isaiah 63:1"
status:
  la: verified
  en: draft
