id: lauds-capitulum-common-of-a-virgin
text:
  la: "Fratres: Qui gloriátur, in Dómino gloriétur. Non enim qui seípsum comméndat, ille probátus est; sed quem Deus comméndat."
  en: "Brothers: But he that glorieth, let him glory in the Lord. For not he who commendeth himself, is approved, but he, whom God commendeth."
citation:
  la: "2 Cor 10:17-18"
  en: "2 Cor 10:17-18"
