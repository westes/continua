# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/12-10-Domus.txt (Duplex majus, nine lessons, `ex C11`; the parts it marks `@Commune/C8` are read from Commune/C8.txt, the Common of a Dedication). The Lauds hymn is the Common of a Dedication's, copied from lauds-hymn-common-of-a-dedication.yml (Latin and English both).
id: lauds-hymn-translation-of-the-holy-house
text:
  la: |
      Anguláris fundaméntum
      Lapis Christus missus est,
      Qui paríetum compáge
      In utróque néctitur,
      Quem Sion sancta suscépit,
      In quo credens pérmanet.

      Omnis illa Deo sacra
      Et dilécta cívitas,
      Plena módulis, in laude,
      Et canóre júbilo,
      Trinum Deum unicúmque
      Cum fervóre prǽdicat.

      Hoc in templo, summe Deus,
      Exorátus ádveni,
      Et cleménti bonitáte
      Precum vota súscipe,
      Largam benedictiónem
      Hic infúnde júgiter.

      Hic promereántur omnes
      Petíta acquírere,
      Et adépta possidére,
      Cum Sanctis perénniter
      Paradísum introíre,
      Transláti in réquiem.

      Glória et honor Deo
      Usquequáque altíssimo,
      Una Patri, Filióque,
      Inclyto Paráclito,
      Cui laus est et potéstas
      Per ætérna sǽcula.
      Amen.
  en: |
      Christ is made the sure Foundation,
      Christ the Head and Cornerstone;
      Chosen of the Lord, and precious,
      Binding all the Church in one,
      Holy Zion's Help for ever,
      And her Confidence alone.

      All that dedicated city,
      Dearly loved of God on high,
      In exultant jubilation,
      Pours perpetual melody,
      God the One in Three adoring
      In glad hymns eternally.

      To this temple, where we call Thee,
      Come, O Lord of Hosts, today;
      With Thy wonted loving-kindness
      Hear Thy servants as they pray.
      And Thy fullest benediction
      Shed within its walls alway.

      Here vouchsafe to all Thy servants
      What they ask of Thee to gain;
      What they gain from Thee for ever
      With the blessed to retain,
      And hereafter in Thy glory
      Evermore with Thee to reign.

      Laud and honor to the Father,
      Laud and honor to the Son,
      Laud and honor to the Spirit,
      Ever Three, and ever One,
      Consubstantial, co-eternal,
      While unending ages run.
      Amen.
status:
  la: verified
  en: verified
