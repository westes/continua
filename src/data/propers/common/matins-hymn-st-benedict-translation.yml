# [HymnusM Matutinum] (Matins hymn, "Signifer invictissime"); English from
# English/SanctiM/07-11M.txt's [Hymnus Matutinum].
id: matins-hymn-st-benedict-translation
text:
  la: |
    Sígnifer invictíssime,
    Sacráque dux milítiæ,
    Nos, Benedícte, válido
    Precum defénde brácchio.

    His armis exsecrábilem
    Leónis vince rábiem,
    Quibus olim tetérrimam
    Pellis ab ore mérulam.

    Urtícre junctæ vépribus
    Vulnus curant vulnéribus;
    Flammáta mens divínitus
    Ignem exstínguit ígnibus.

    Crucem mittens ut lápidem
    Venéni frangit cálicem:
    Non valet mortis vásculum
    Vitæ ferre signáculum.

    Frater, quem tunc nequíssimus
    Vagum raptábat spíritus,
    Dum tua virga cǽditur,
    Stabilitáti rédditur.

    Deo Patri sit glória,
    Ejusque soli Fílio,
    Cum Spíritu Paráclito,
    Et nunc, et in perpétuum.
    Amen.
  en: |
    Invincible sign-bearer,
    Consecrated as leader of the soldiers,
    defend us, O Benedict,
    with your strong arm of prayer.

    With those same conquering arms defeat
    The lions roar, our ghostly fœ,
    With which you drove once from you
    That fearful blackbird long ago.

    With fresh wounds’ force those wounds were cured,
    With nettles’ sting and thorny briar;
    With mind divinely kindled you
    Didst quench the flame with added fire.

    The cross like crushing stone destroyed
    The fatal cup of poisoned wine
    The cup of death could not prevail
    Against that strong, lifegiving sign.

    A brother’s mind from prayer reft
    Was by a vagrant spirit led:
    Stability returned to him
    When from your staff the demon fled.

    To the Father be glory,
    And for his only Son,
    With the Spirit, the Paraclete,
    Now and forever.
    Amen.
