# Standard de-Communi commemoration for common-of-a-virgin (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). st-therese-of-lisieux has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is the saint's own
# real proper (st-therese-of-lisieux-collect.yml), unchanged.
id: st-therese-of-lisieux-commemoration
text:
  la: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Dómine, qui dixísti: Nisi efficiámini sicut párvuli, non intrábitis in
    regnum cælórum: da nobis, quǽsumus: ita sanctæ Terésiæ Vírginis in
    humilitáte et simplicitáte cordis vestígia sectári, ut prǽmia
    consequámur ætérna.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    ℟. Amen.
  en: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O Lord, who hast said: Unless you become as little children you shall
    not enter the kingdom of heaven, grant us, we pray, so to follow, in
    humility and simplicity of heart, the footsteps of the virgin blessed
    Theresa, that we may attain to an everlasting reward.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
