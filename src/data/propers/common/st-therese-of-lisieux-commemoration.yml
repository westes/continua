# Her own [Ant 2] and [Versum 2] (web/www/horas/Latin/SanctiM/10-03b.txt),
# the tags used for a mere commemoration, followed by her own collect
# (st-therese-of-lisieux-collect.yml, unchanged). Updated 2026-10-07: this
# previously reused common-of-a-virgin's antiphon/versicle because only
# Sancti/10-03.txt (a bare `vide C6a`) had been read; SanctiM/10-03b.txt
# carries her full proper office. English antiphon/versicle are direct
# translations (the source has none), so the English is draft.
id: st-therese-of-lisieux-commemoration
text:
  la: |
    Ant. Requiem tibi dabit * Dóminus semper, et implébit splendóribus ánimam tuam; et eris quasi hortus irríguus, et sicut fons aquárum, cujus non defícient aquæ.
    V. Erit tibi Dóminus in lucem sempitérnam.
    R. Et Deus tuus in glóriam tuam.
    Orémus.
    Dómine, qui dixísti: Nisi efficiámini sicut párvuli, non intrábitis in
    regnum cælórum: da nobis, quǽsumus: ita sanctæ Terésiæ Vírginis in
    humilitáte et simplicitáte cordis vestígia sectári, ut prǽmia
    consequámur ætérna.
    Qui vivis et regnas cum Deo Patre, in unitáte Spíritus Sancti, Deus, per ómnia sǽcula
    sæculórum.
    R. Amen.
  en: |
    Ant. The Lord will give thee rest * always, and will fill thy soul with brightness; and thou shalt be like a watered garden, and like a fountain of water whose waters shall not fail.
    V. The Lord shall be unto thee for an everlasting light.
    R. And thy God for thy glory.
    Let us pray.
    O Lord, who hast said: Unless you become as little children you shall
    not enter the kingdom of heaven, grant us, we pray, so to follow, in
    humility and simplicity of heart, the footsteps of the virgin blessed
    Theresa, that we may attain to an everlasting reward.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
status:
  la: verified
  en: draft
