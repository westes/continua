# Verified against Divinum Officium (Divino Afflatu - 1954), Lauds live
# query for 1955-08-21 (a Sunday, forcing her Duplex feast to yield and
# be commemorated rather than won -- her own Aug 21 slot doesn't fall on
# a Sunday until then) -- the "Commemoratio S. Joannæ Franciscæ ... Viduæ"
# block. Antiphon is her own Benedictus antiphon (see resolve-common.ts's
# getBenedictusAntiphon -- same "Date ei de fructu manuum suarum" text,
# labeled "ex Proprio Sanctorum" in the raw Monastic 1617 file even
# though it's the standard Common-of-a-Holy-Woman antiphon). V/R is the
# Common-of-a-Virgin pair ("Diffusa est gratia"), matching this saint's
# own common fallback to common-of-a-virgin
# (st-jane-frances-de-chantal.yml's own comment: no common-of-a-widow
# file exists in this app). Collect identical to st-jane-frances-de-
# chantal-collect.yml. See hours/resolve-common.ts's getDayCollects for
# how a sanctoral commemoration renders this whole bundle, falling back
# to just the bare collect for a saint without one of these authored.
id: commemoration-st-jane-frances-de-chantal
text:
  la: |
    Ant. Date ei * de frúctu mánuum suárum, et laudent eam in portis ópera ejus.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Omnípotens et miséricors Deus, qui beátam Joánnam Francíscam, tuo amóre succénsam, admirábili spíritus fortitúdine per omnes vitæ sémitas in via perfectiónis donásti, quique per illam illustráre Ecclésiam tuam nova prole voluísti: ejus méritis et précibus concéde; ut, qui infirmitátis nostræ cónscii de tua virtúte confídimus, cæléstis grátiæ auxílio cuncta nobis adversántia vincámus.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Give her * of the fruit of her hands, and let her own works praise her in the gates.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O Almighty and merciful God, Who didst enkindle the love of thyself in the blessed Jeanne Frances, Who didst give unto her the grace to make every path of life temporal the straight and narrow way which leadeth unto life eternal, and Who wast pleased to use her as a mean whereby to adorn thy Church with a new sisterhood, grant unto us for that thine handmaid's sake, and at her prayers, that we who know that we have no strength as of ourselves to help ourselves, and therefore do put all our trust in thine Almighty power, may by the assistance of thy heavenly grace, always prevail in all things against whatsoever shall arise to fight against us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
