# [Capitulum Sexta] with [Nocturn 3 Versum]. Read from the reference engine: web/www/horas/Latin/Sancti/05-01r.txt (Duplex I classis, a 1955 feast; nine lessons, `proper`), English from the parallel English file.
id: sext-capitulum-st-joseph-the-worker
text:
  la: |
    Fratres: Omne quodcúmque fácitis in verbo aut in ópere, ómnia in nómine Dómini Jesu Christi, grátias agéntes Deo et Patri per ipsum. $Deo gratias
    R. Deo grátias.
    V. Verbum Dei, per quod facta sunt ómnia, allelúia.
    R. Dignátus est operári mánibus suis, allelúia.
  en: |
    Brethren: All whatsoever you do in word or in work, do all in the name of the Lord Jesus Christ, giving thanks to God and the Father by him. $Deo gratias
    R. Thanks be to God.
    V. The Word of God, by whom all things were made, alleluia.
    R. Deigned to work with his hands, alleluia.
citation:
  la: "Col 3:17"
  en: "Col 3:17"
status:
  la: verified
  en: verified
