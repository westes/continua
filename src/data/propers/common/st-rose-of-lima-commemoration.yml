# Standard de-Communi commemoration for common-of-a-virgin (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags actually used for
# a mere commemoration, confirmed against this exact category via an
# independently live-verified precedent elsewhere in this app). St. Rose
# has no proper antiphon of her own in the source (a plain "vide C6a"
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper. Collect is her own real
# proper (st-rose-of-lima-collect.yml), unchanged.
id: st-rose-of-lima-commemoration
text:
  la: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Bonórum ómnium largítor, omnípotens Deus, qui beátam Rosam, cæléstis
    grátiæ rore prævéntam, virginitátis et patiéntiæ decóre Indis
    floréscere voluísti: da nobis fámulis tuis; ut, in odórem suavitátis
    ejus curréntes, Christi bonus odor éffici mereámur:
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et
    regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    Almighty God, Giver of all good things, Who willed that blessed Rose,
    imbued in early life with the dew of heavenly grace, should bloom
    among the Indians with the beauty of virginity and patience, grant
    unto us, Your servants, that, following the fragrance of her
    sweetness, we may be found worthy to become a sweet savor of Christ.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with
    thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
