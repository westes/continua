# Verified against Divinum Officium (Latin/English Sancti/06-26.txt's own
# [Ant 1] — the Lauds-hour antiphon, not Terce's, which falls back to a
# generic Common text instead. These are the Roman martyrs John and Paul,
# not St. John the Baptist/Evangelist or St. Paul the Apostle.
id: ss-john-and-paul-antiphon
text:
  la: "Astitérunt * justi ante Dóminum, et ab invicem non sunt separáti: cálicem Dómini biberunt, et amici Dei appelláti sunt."
  en: "The righteous stood * before the Lord, and were not divided from one another: they drank the chalice of the Lord, and were called the friends of God."
status:
  la: verified
  en: verified
