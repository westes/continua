id: our-lady-of-mount-carmel-magnificat-antiphon
text:
  la: "Glória Líbani * data est ei, decor Carméli et Saron, allelúja."
  en: "The glory of Lebanon * shall be given unto it, the excellency of Carmel and Sharon, alleluia."
