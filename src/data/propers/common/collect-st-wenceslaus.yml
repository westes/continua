id: collect-st-wenceslaus
text:
  la: |
    Orémus.
    Deus, qui beátum Wencesláum per martýrii palmam a terréno principátu ad
    cæléstem glóriam transtulísti: ejus précibus nos ab omni adversitáte
    custódi; et ejúsdem tríbue gaudére consórtio.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who didst make thy blessed servant Wenceslaus to pass by the
    palm of martyrdom from dominion on earth to glory in heaven, keep us,
    at his prayers, from all hurt here, and grant unto us the joy of
    fellowship with him hereafter.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
