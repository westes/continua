# Same text as her/his/their Lauds antiphon 3, per the established
# Sext=Lauds-Ant3 minor-hours-borrow-from-Lauds convention.
id: sext-antiphon-st-joseph
text:
  la: "Non inveniéntes * Jesum, regréssi sunt in Jerúsalem requiréntes eum; et post tríduum invenérunt illum in templo sedéntem in médio doctórum, audiéntem et interrogántem eos."
  en: "When they found not Jesus, * they turned back again to Jerusalem, seeking Him; and after three days they found Him in the Temple, sitting in the midst of the Doctors, both hearing them and asking them questions."
status:
  la: verified
  en: verified
