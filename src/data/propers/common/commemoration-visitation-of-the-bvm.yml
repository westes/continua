# Own proper antiphon (visitation-of-the-bvm-antiphon.yml), paired with the standard BVM commemoration versicle already verified elsewhere in this app (propers/common/lauds-suffrage-bvm.yml -- 'V. Ora pro nobis sancta Dei Genitrix'). Collect is the saint's own real proper (visitation-of-the-bvm-collect.yml), unchanged.
id: commemoration-visitation-of-the-bvm
text:
  la: |
    Ant. Beáta es, * María, quæ credidísti: perficiéntur in te quæ dicta sunt tibi a Dómino, allelúia.
    V. Ora pro nobis sancta Dei Génitrix.
    R. Ut digni efficiámur promissiónibus Christi.
    Orémus.
    Fámulis tuis, quǽsumus, Dómine, cæléstis grátiæ munus impertíre: ut, quibus
    beátæ Vírginis partus éxstitit salútis exórdium; Visitatiónis ejus votíva
    solémnitas, pacis tríbuat increméntum.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. O Mary * blessed art thou that didst believe, for there shall be a performance of those things which were told thee from the Lord. Alleluia.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    Grant, O Lord, we beseech thee, unto all thy servants, the gift of thine heavenly
    grace, that even as the Blessed Virgin being made a Mother hath been unto them the
    first step unto their salvation, so the godly and solemn memorial of her
    Visitation may be the bringer of an increase of peace.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
