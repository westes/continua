# Terce's own Pentecost-week hymn -- a full whole-hymn swap, not just a
# doxology-stanza substitution like the other 7 hours get. Confirmed
# against the reference engine's static source (Psalterium/Special/Minor
# Special.txt's own `[Hymnus Pasc7 Tertia]`/`[HymnusM Pasc7 Tertia]`
# blocks): `Tempora/Pasc7-0.txt` (Pentecost Sunday) redirects *Vespers* to
# this same hymn (already authored in vespers-hymn-pentecost-sunday.yml,
# Monastic variant -- this file's body-stanza text is copied verbatim from
# there), and `Pasc7-1.txt` through `Pasc7-6.txt` (the octave weekdays) all
# inherit from `Pasc7-0` via their own `[Rule] ex Pasc7-0`. There is no
# `Pasc7 Sexta`/`Pasc7 Nona` block anywhere in the source, so Sext and None
# are NOT affected -- this swap is Terce-only, all 7 days of Pentecost's
# octave (Sunday included, since the Third Hour is the hour of Pentecost
# itself, Acts 2:15).
#
# Final stanza carries the source's own `*` marker (unlike
# vespers-hymn-pentecost-sunday.yml, which bakes a fixed doxology in) --
# every day this file is used falls within the Pentecost season, so
# `getHymnDoxologyOverrideId`/`hymn-doxology-pent.yml` always supplies the
# real override at render time; the text below the marker is this hymn's
# own source default, kept for fidelity/fallback only.
#
# English is the reference engine's own translation (English/Psalterium/
# Special/Minor Special.txt's `[Hymnus Pasc7 Tertia]`), not a new
# translation -- verified stanza-by-stanza against the Latin.
id: terce-hymn-pentecost-week
text:
  la: |
    Veni Creátor Spíritus,
    Mentes tuórum vísita,
    Imple supérna grátia,
    Quæ tu creásti péctora.

    Qui Paráclitus díceris,
    Donum Dei altíssimi,
    Fons vivus, ignis, cáritas,
    Et spiritális únctio.

    Tu septifórmis múnere,
    Dextræ Dei tu dígitus,
    Tu rite promíssum Patris,
    Sermóne ditans gúttura.

    Accénde lumen sénsibus:
    Infúnde amórem córdibus:
    Infírma nostri córporis
    Virtúte firmans pérpeti.

    Hostem repéllas lóngius,
    Pacémque dones prótinus:
    Ductóre sic te prǽvio
    Vitémus omne nóxium.

    Per te sciámus da Patrem,
    Noscámus atque Fílium,
    Te utriúsque Spíritum
    Credámus omni témpore.

    * Deo Patri sit glória,
    Et Fílio, qui a mórtuis
    Surréxit, ac Paráclito,
    In sæculórum sǽcula.
    Amen.
  en: |
    Creator Spirit, all Divine,
    Come, visit every soul of Thine,
    And fill with Thy celestial flame
    The hearts which Thou Thyself didst frame.

    O gift of God, Thine is the sweet
    Consoling name of Paraclete
    And spring of life and fire and love
    And unction flowing from above.

    The mystic sevenfold gifts are Thine,
    Finger of God's right hand divine;
    The Father's promise sent to teach
    The tongue a rich and heavenly speech.

    Kindle with fire brought from above
    Each sense, and fill our hearts with love;
    And grant our flesh, so weak and frail,
    The strength of Thine which cannot fail.

    Drive far away our deadly foe,
    And grant us Thy true peace to know;
    So we, led by Thy guidance still,
    May safely pass through every ill.

    To us, through Thee, the grace be shown
    To know the Father and the Son;
    And Spirit of Them both, may we
    Forever rest our faith in Thee.

    * To Sire and Son be praises meet,
    And to the Holy Paraclete;
    And may Christ send us from above
    That Holy Spirit's gift of love.
    Amen.
status:
  la: verified
  en: verified
