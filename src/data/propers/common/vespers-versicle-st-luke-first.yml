# St. Luke First Vespers versicle (the Apostles' Common [Versum 1]): engine render (Monastic Tridentinum 1617, command=prayVespera, 2026-10-17). Second Vespers keeps vespers-versicle-st-luke.yml. See hours/resolve-common.ts's withVespersVariant.
id: vespers-versicle-st-luke-first
text:
  la: |
    V. In omnem terram exívit sonus eórum.
    R. Et in fines orbis terræ verba eórum.
  en: |
    V. Their sound hath gone forth into all the earth:
    R. And their words unto the ends of the world.
