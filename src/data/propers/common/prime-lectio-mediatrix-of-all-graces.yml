# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-31-BMVMediatrix.txt (Duplex majus, nine lessons, `ex C11`). English is the Douay-Rheims text from the project's scripture store.
id: prime-lectio-mediatrix-of-all-graces
text:
  la: "Ecce, gentem, quam nesciébas, vocábis: et gentes, quæ te non cognovérunt, ad te current propter Dóminum, Deum tuum, et sanctum Israël, quia glorificávit te."
  en: "Behold thou shalt call a nation, which thou knewest not: and the nations that knew not thee shall run to thee, because of the Lord thy God, and for the Holy One of Israel, for he hath glorified thee."
citation:
  la: "Is 55:5"
  en: "Isaiah 55:5"
status:
  la: verified
  en: verified
