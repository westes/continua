# web/www/horas/Latin/SanctiM/10-03b.txt's [Capitulum Nona] with the matching minor-hour versicle from SanctiM's [Responsory NonaM]. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: none-capitulum-st-therese-of-lisieux
text:
  la: |
    Vidébitis, et gaudébit cor vestrum, et ossa vestra quasi herba germinábunt et cognoscétur manus Dómini servis ejus, et indignábitur inimícis suis.
    R. Deo grátias.
    V. Laudáte Dóminum, quia bonus Dóminus.
    R. Psállite nómini ejus, quoniam suáve.
  en: |
    You shall see, and your heart shall rejoice, and your bones shall flourish like an herb, and the hand of the Lord shall be known to his servants, and he shall be angry with his enemies.
    R. Thanks be to God.
    V. Praise ye the Lord, for the Lord is good.
    R. Sing ye to his name, for it is sweet.
citation:
  la: "Is 66:14"
  en: "Is 66:14"
status:
  la: verified
  en: draft
