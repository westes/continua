# Own proper antiphon (ss-tiburtius-valerian-and-maximus-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-several-martyrs (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (ss-tiburtius-valerian-and-maximus-collect.yml), unchanged.
id: commemoration-ss-tiburtius-valerian-and-maximus
text:
  la: |
    Ant. Fíliæ Jerúsalem, * veníte et vidéte Mártyres cum corónis, quibus coronávit eos Dóminus in die solemnitátis et lætítiæ, allelúia, allelúia.
    V. Exsultábunt Sancti in glória.
    R. Lætabúntur in cubílibus suis.
    Orémus.
    Præsta, quǽsumus, omnípotens Deus: ut, qui sanctórum Mártyrum tuórum Tibúrtii, Valeriáni et Máximi sollémnia cólimus; eórum étiam virtútes imitémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Daughters of Jerusalem, * come and see the crowned martyrs, the Lord crowned them in his solemnity and delight, alleluia, alleluia.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    Almighty God, for Whom holy Tiburtius, Valerian, and Maximus uplifted their testimony, grant, we beseech Thee, unto all whosoever call the same to solemn memory, grace to imitate the example of their godly courage.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
