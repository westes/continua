# Ant+V/R+collect commemoration bundle. The source has no antiphon or versicle of its own (`vide C5`), so the Common of a Confessor's are used (commemoration-antiphon-common-of-a-confessor.yml and lauds-versicle-common-of-a-confessor.yml), as for every saint of this category with nothing proper. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-21-Felix.txt (Semiduplex, nine lessons, vide C5). English is this project's own translation, marked draft.
id: commemoration-st-felix-of-cantalice
text:
  la: |
      Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
      V. Justum dedúxit Dóminus per vias rectas.
      R. Et osténdit illi regnum Dei.
      Orémus.
      Fac nos, Dómine Jesu, in simplicitáte et innocéntia cordis nostri ambuláre: quarum amóre de sinu Matris inter beáti Felícis Confessóris tui bráchia descendisti:
      Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
      V. The Lord guided the just in right paths.
      R. And showed him the kingdom of God.
      Let us pray.
      Grant us, O Lord Jesus, to walk in simplicity and innocence of heart: for love of which thou didst descend from the bosom of thy Mother into the arms of blessed Felix, thy Confessor:
      Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
