# Own proper antiphon (st-monica-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-widow (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (st-monica-collect.yml), unchanged.
id: st-monica-commemoration
text:
  la: |
    Ant. Date ei de fructu mánuum suárum, et laudent eam in portis ópera ejus, allelúja.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, mæréntium consolátor et in te sperántium salus, qui beátæ Mónicæ pias lácrimas in conversióne fílii sui Augustíni misericórditer suscepísti: da nobis utriúsque intervéntu; peccáta nostra deploráre, et grátiæ tuæ indulgéntiam inveníre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Give her of the fruit of her hands, and let her own works praise her in the gates, alleluia.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, the consoler of those Who mourn and the safety of those who put their trust in thee; Who mercifully accepted the holy tears of blessed Monica for the conversion of Augustine, her son; grant us through the intercession of both to bewail our sins and to obtain the grace of thy forgiveness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: verified
  en: verified
