# [Lectio Prima]. Read from the reference engine: web/www/horas/Latin/Sancti/05-01r.txt (Duplex I classis, a 1955 feast; nine lessons, `proper`), English from the parallel English file.
id: prime-lectio-st-joseph-the-worker
text:
  la: "Quodcúmque fácitis, ex ánimo operámini sicut Dómino, et non homínibus, sciéntes quod a Dómino accipiétis retributiónem hereditátis. Dómino Christo servíte."
  en: "Whatsover you do, do it from the heart, as to the Lord, and not to men, knowing that you shall receive of the Lord the reward of inheritance. Serve ye the Lord Christ."
citation:
  la: "Col 3:24"
  en: "Col 3:24"
