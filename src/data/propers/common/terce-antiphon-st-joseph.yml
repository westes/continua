id: terce-antiphon-st-joseph
text:
  la: "Cum redírent, * remánsit puer Jesus in Jerúsalem, et non cognovérunt paréntes ejus."
  en: "When they returned, * the Child Jesus tarried behind in Jerusalem, and His parents knew not of it."
