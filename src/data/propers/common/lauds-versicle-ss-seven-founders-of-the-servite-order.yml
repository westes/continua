id: lauds-versicle-ss-seven-founders-of-the-servite-order
text:
  la: |
    V. Sit memória illórum in benedictióne.
    R. Et ossa eórum púllulent de loco suo.
  en: |
    V. May their memory be blessed.
    R. And let their bones flourish again out of their place.
