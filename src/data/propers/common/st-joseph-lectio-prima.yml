# Sourced from web/www/horas/Latin/Sancti/03-19.txt's own [Lectio Prima] and its
# English counterpart.
id: st-joseph-lectio-prima
text:
  la: "Prófugum justum dedúxit Sapiéntia per vias rectas, et osténdit illi regnum Dei, et dedit illi sciéntiam sanctórum; honestávit illum in labóribus, et complévit labóres illíus."
  en: "She conducted the just, and showed him the kingdom of God, and gave him the knowledge of the holy things, made him honourable in his labours, and accomplished his labours."
citation:
  la: "Sap 10:10"
  en: "Wis 10:10"
status:
  la: verified
  en: verified
