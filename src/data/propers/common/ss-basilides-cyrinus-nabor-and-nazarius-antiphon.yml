# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, Ss. Basilides, Cyrinus, Nabor, and Nazarius's own day
# (2029-06-12 -- St. Barnabas's own day and its transfer-year artifact,
# plus Our Lady's Saturday, occupy the 12th in every other tested year).
# The Benedictus antiphon. Corrects the previous version of this file,
# which had been sourced from the Roman/secular rite's Sancti/06-12.txt's
# own [Ant 1] instead: real but different text from what Monastic 1617
# actually renders at Lauds, same mistake as St. Lawrence's earlier fix.
id: ss-basilides-cyrinus-nabor-and-nazarius-antiphon
text:
  la: "Vestri capílli cápitis * omnes numeráti sunt: nolíte timére: multis passéribus melióres estis vos."
  en: "Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows."
status:
  la: verified
  en: verified
