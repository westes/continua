# Own proper antiphon (st-leo-ii-antiphon.yml), paired with the standard de-Communi commemoration versicle for common-of-a-confessor-pope (C4b) (not yet independently live-verified for this specific category, marked draft). Collect is the saint's own real proper (st-leo-ii-collect.yml), unchanged.
id: st-leo-ii-commemoration
text:
  la: |
    Ant. Euge, serve bone * et fidélis, quia in pauca fuísti fidélis, supra multa te constítuam, dicit Dóminus.
    V. Justum dedúxit Dóminus per vias rectas.
    R. Et osténdit illi regnum Dei.
    Orémus.
    Deus, qui beátum Leónem Pontíficem sanctórum tuórum méritis coæquásti: concéde
    propítius; ut, qui commemoratiónis ejus festa percólimus, vitæ quoque imitémur
    exémpla.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who didst make the blessed Pope Leo to work deeds worthy of thy Saints,
    mercifully grant that we who do keep glad holiday in his memory, may steadfastly
    follow after the example of his life.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
