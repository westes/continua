id: st-aloysius-gonzaga-collect
text:
  la: |
    Orémus.
    Cæléstium donórum distribútor, Deus, qui in angélico júvene Aloísio miram vitæ
    innocéntiam pari cum pœniténtia sociásti: ejus méritis et précibus concéde; ut,
    innocéntem non secúti, pœniténtem imitémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, bestower of heavenly gifts, Who in the angelic youth Aloysius joined
    wondrous innocence of life to an equally wondrous love of penance; grant, by his
    merits and prayers, that we who have not followed him in his innocence may imitate
    him in his penance.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
