id: collect-st-gorgonius
text:
  la: |
    Orémus.
    Sanctus tuus, Dómine, Gorgónius sua nos intercessióne lætíficet: et pia fáciat
    solemnitáte gaudére.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    May thy holy servant Gorgonius, O Lord, gladden us by his prayers, and grant that we may
    rejoice in this his blessed festival.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
status:
