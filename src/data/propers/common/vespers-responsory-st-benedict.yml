id: vespers-responsory-st-benedict
text:
  la: |
    R.br. Sancte Pater Benedícte, * Intercéde pro nobis.
    ℟. Sancte Pater Benedícte, * Intercéde pro nobis.
    ℣. Ut digni efficiámur promissiónibus Christi.
    ℟. Intercéde pro nobis.
    ℣. Glória Patri, et Fílio, * et Spirítui Sancto.
    ℟. Sancte Pater Benedícte, * Intercéde pro nobis.
  en: |
    R.br. Holy Father Benedict, * intercede for us.
    ℟. Holy Father Benedict, * intercede for us.
    ℣. That we may be made worthy of the promises of Christ.
    ℟. Intercede for us.
    ℣. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    ℟. Holy Father Benedict, * intercede for us.
status:
  la: verified
  en: draft
