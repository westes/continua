# Verified against Divinum Officium (Monastic Tridentinum 1617), 2026-08-25
# run. The generic final stanza of "Iam lucis orto sidere" — used whenever
# no seasonal doxology applies. Advent has no special doxology of its own in
# the source data either, so it also falls through to this one.
id: hymn-doxology-per-annum
text:
  la: "Deo Patri sit glória,\nEjúsque soli Fílio,\nCum Spíritu Paráclito,\nEt nunc et in perpétuum. Amen."
  en: "All laud to God the Father be,\nAll praise, Eternal Son, to thee:\nAll glory, as is ever meet,\nTo God the holy Paraclete. Amen."
status:
  la: verified
  en: verified
