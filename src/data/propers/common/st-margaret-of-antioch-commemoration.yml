# Own proper antiphon (st-margaret-of-antioch-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-virgin-martyr (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (st-margaret-of-antioch-collect.yml), unchanged.
id: st-margaret-of-antioch-commemoration
text:
  la: |
    Ant. Símile est regnum cælórum * hómini negotiatóri quærénti bonas margarítas: invénta una pretiósa, dedit ómnia sua, et comparávit eam.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Indulgéntiam nobis, quǽsumus, Dómine, beáta Margaríta Virgo et Martyr implóret: quæ tibi grata semper éxstitit, et mérito castitátis, et tuæ professióne virtútis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O Lord, we pray thee, that thy blessed handmaiden and witness Margaret in whom Thou hast ever been well pleased, because of her worthy maidenhood and her mighty showing-forth of thy power, may entreat thy pardon on our behalf.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
