id: collect-st-hermenegild
text:
  la: |
    Orémus.
    Deus, qui beátum Hermenegíldum Mártyrem tuum cælésti regno terrénum postpónere
    docuísti: da quǽsumus nobis; ejus exémplo cadúca despícere, atque ætérna sectári.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte
    Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, Who didst teach thy blessed Martyr Hermenegild to choose an heavenly rather
    than an earthly crown, grant, we beseech thee, that we, like him, may so pass through
    things temporal that we finally miss not those which are eternal.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
