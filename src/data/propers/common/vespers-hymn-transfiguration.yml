# Verified against Divinum Officium (Monastic Tridentinum 1617), Vespers
# live query, 2026-08-06 -- own proper hymn ("Quicúmque Christum
# quǽritis"). See lauds-capitulum-transfiguration.yml's header. English
# final stanza corrected 2026-09-10, same fix as matins-hymn-
# transfiguration.yml: the live query had baked in the plain `[Epi]`
# doxology's English, mismatched against the Latin's correct Monastic
# `[EpiT]` text. Final stanza marked with a leading "* " -- the source's
# own `[Hymnus Vespera]` carries this marker (Divinum Officium's own
# variable-doxology convention), overridden here to `[EpiT]` per this
# feast's `Doxology=Epi` rule (see hours/hymn-doxology-by-feast.yml's
# `transfiguration` entry) -- see hours/resolve-common.ts's
# substituteDoxology and hours/hymn-doxology.ts.
id: vespers-hymn-transfiguration
text:
  la: >-
    Quicúmque Christum quǽritis,

    Oculos in altum tóllite:

    Illic licébit vísere

    Signum perénnis glóriæ.


    Illústre quiddam cérnimus,

    Quod nésciat finem pati,

    Sublíme, celsum, intérminum,

    Antíquius cælo et chao.


    Hic ille Rex est géntium

    Populíque Rex judáici,

    Promíssus Abrahæ patri

    Ejúsque in ævum sémini.


    Hunc, et prophétis téstibus

    Iisdémque signatóribus,

    Testátor et Pater jubet

    Audíre nos et crédere.


    * Glória tibi, Dómine,

    Qui apparuísti hódie,

    Cum Patre, et Sancto Spíritu,

    In sempitérna sǽcula. Amen.
  en: >-
    All ye who would the Christ descry,

    Lift up your eyes to him on high:

    There mortal gaze hath strength to see

    The token of his majesty.


    A wondrous sign we there behold,

    That knows not death nor groweth old,

    Sublime, most high, that cannot fade,

    That was ere earth and heaven were made.


    Here is the King the gentiles fear,

    The Jews' most mighty King is here

    Promised to Abraham of yore,

    And to his seed forevermore.


    'Tis he the prophets' words foretold,

    And by their signs shown forth of old;

    The Father's witness hath ordained

    That we should hear with faith unfeigned.


    * All glory, Lord, to Thee we pay

    For Thine Epiphany today;

    All glory, as is ever meet,

    To Father, and to Paraclete. Amen.
status:
  la: verified
  en: verified
