id: ss-vincent-and-anastasius-collect
text:
  la: |
    Orémus.
    Adésto, Dómine, supplicatiónibus nostris: ut, qui ex iniquitáte nostra reos nos esse cognóscimus, beatórum Mártyrum tuórum Vincéntii et Anastásii intercessióne liberémur.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    Let thy merciful ears, O Lord, be open unto our prayers, and whereas we do feel ourselves burdened by the guilt of our sins, do Thou graciously relieve us at the petition of thy blessed Martyrs, Vincent and Anastasius.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
