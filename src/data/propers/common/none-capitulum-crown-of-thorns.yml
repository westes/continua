# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp3-5-SpinisDNJC.txt (Duplex majus, Friday after Ash Wednesday). English is this project's own translation, marked draft.
id: none-capitulum-crown-of-thorns
text:
  la: |
      In die illa erit Dóminus exercítuum coróna glóriæ, et sertum exsultatiónis residuo pópuli sui.
      R. Deo grátias.
      V. Plecténtes corónam de spinis.
      R. Posuérunt super caput ejus.
  en: |
      In that day the Lord of hosts shall be a crown of glory, and a garland of joy to the residue of his people.
      R. Thanks be to God.
      V. Plaiting a crown of thorns,
      R. They put it upon his head.
citation:
  la: "Is 28:5"
  en: "Isaiah 28:5"
status:
  la: verified
  en: draft
