# Sourced from web/www/horas/Latin/Sancti/aliquibus locis/Quadp2-2-PassionisDNJC.txt (Duplex majus, Tuesday after Sexagesima; its own Oratio and Lectio4-9, the rest "ex Commune/Votiva/V6", the votive office of the Passion). English is this project's own translation, marked draft.
id: vespers-hymn-commemoration-of-the-passion
text:
  la: |
      Mœrentes óculi spargite lácrimas
      Et luctu resonent íntima córdium,
      Illátas refero Numini ab ímpiis
      Pœnas et fera vúlnera.

      Accincta heu! gladiis turba satellitum.
      Arreptum Dóminum fústibus impetit,
      Nunc cædit cólaphis, nunc quatit horridis
      Divínum Caput íctibus.

      Haud finis sceleri; tráditur improbo
      Christus carnifici; nec mora, barbarus
      In Regem superum non timet, ímpio
      Ausu, vertere déxteram.

      Audíte o Pópuli, Numen amábile,
      Manánte ex húmeris úndique sánguine,
      Lictoris rabidi sústinet impetum,
      Et vocem premit ínnocens.

      Quis non illacrimet! Iam nova condidit
      Torménta indomitæ Gentis iníquitas.
      Infigit cerebro; proh dolor! efferis
      Sertum vepribus asperum.

      Heu crimen! tráhitur funibus improbis
      Funesti Dóminus supplicii ad locum;
      Illic oppétiit, fúnere spíritum
      Patri restituens suo.

      Passo pro miseris tam fera vúlnera
      In terris resonet débita glória;
      Sacrumque assídue Nomen in æthera
      Humánum genus efferat.
      Amen.
  en: |
      Mourning eyes, shed your tears,
      and let the depths of the heart resound with grief:
      I relate the punishments and cruel wounds
      inflicted by the impious upon the Godhead.

      Alas! the band of soldiers, girt with swords,
      falls with clubs upon the seized Lord;
      now it strikes with blows of the fist, now it shakes
      the divine Head with dreadful strokes.

      There is no end to the crime; Christ is handed over
      to the wicked executioner; without delay the barbarian
      does not fear, with impious daring,
      to raise his hand against the King of heaven.

      Hear, O peoples: the lovable Godhead,
      with blood flowing from the shoulders on every side,
      sustains the onslaught of the raging lictor,
      and the innocent One stifles his voice.

      Who would not weep! The iniquity of the untamed nation
      has now devised new torments.
      It fixes into his brain, alas! in its savagery,
      a garland rough with brambles.

      Alas, the crime! The Lord is dragged by wicked ropes
      to the place of the deadly punishment;
      there he met his end, in death
      giving back his spirit to his Father.

      To him who suffered such cruel wounds for wretched men,
      let due glory resound on earth;
      and let mankind ever raise his sacred Name
      to the heavens. Amen.
status:
  la: verified
  en: draft
