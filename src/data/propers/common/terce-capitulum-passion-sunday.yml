# Engine render (Monastic Tridentinum 1617, command=prayTertia, 2025-04-06); Latin and English both taken from the page.
id: terce-capitulum-passion-sunday
text:
  la: |
    Heb 9:11-12 Fratres: Christus assístens Póntifex futurórum bonórum, per ámplius et perféctius tabernáculum non manu factum, id est, non hujus creatiónis: neque per sánguinem hircórum aut vitulórum, sed per próprium sánguinem introívit semel in Sancta, ætérna redemptióne invénta.
    R. Deo grátias.
    V. Érue a frámea, Deus, ánimam meam.
    R. Et de manu canis únicam meam.
  en: |
    Heb 9:11-12 But Christ, being come an high priest of the good things to come, by a greater and more perfect tabernacle not made with hand, that is, not of this creation: Neither by the blood of goats, or of calves, but by his own blood, entered once into the holies, having obtained eternal redemption.
    R. Thanks be to God.
    V. Deliver, O God, my soul from the sword.
    R. My only one from the hand of the dog.
