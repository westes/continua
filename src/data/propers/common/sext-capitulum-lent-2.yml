id: sext-capitulum-lent-2
text:
  la: |
    1 Thess 4:3-4 Hæc est enim volúntas Dei, sanctificátio vestra: ut abstineátis vos a fornicatióne, ut sciat unusquísque vestrum vas suum possidére in sanctificatióne et honóre.
    R. Deo grátias.
    V. Scápulis suis obumbrábit tibi.
    R. Et sub pennis ejus sperábis.
  en: |
    1 Thess 4:3-4 For this is the will of God, your sanctification; that you should abstain from fornication, that every one of you should know how to possess his vessel in sanctification and honour.
    R. Thanks be to God.
    V. He will overshadow thee with his shoulders.
    R. And under his wings thou shalt trust.
