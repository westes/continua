# First Vespers Magnificat antiphon for this Common: Latin/Commune/C2.txt's own
# [Ant 1] (and its English counterpart), where it differs from [Ant 3]. Second
# Vespers' [Ant 3] is magnificat-antiphon-common-of-a-martyr.yml (the default); see
# hours/resolve-common.ts's withVespersVariant.
id: magnificat-antiphon-common-of-a-martyr-first
text:
  la: "Iste Sanctus * pro lege Dei sui certávit usque ad mortem, et a verbis impiórum non tímuit: fundátus enim erat supra firmam petram."
  en: "This man is holy * for he hath striven for the law of his God even unto death, and hath not feared for the words of the ungodly; For he had his foundation upon a strong rock."
status:
  la: verified
  en: verified
