# Collect. Sourced from web/www/horas/Latin/Sancti/aliquibus locis/05-21-Felix.txt (Semiduplex, nine lessons, vide C5). English is this project's own translation, marked draft.
id: collect-st-felix-of-cantalice
text:
  la: |
      Orémus.
      Fac nos, Dómine Jesu, in simplicitáte et innocéntia cordis nostri ambuláre: quarum amóre de sinu Matris inter beáti Felícis Confessóris tui bráchia descendisti:
      Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
      R. Amen.
  en: |
      Let us pray.
      Grant us, O Lord Jesus, to walk in simplicity and innocence of heart: for love of which thou didst descend from the bosom of thy Mother into the arms of blessed Felix, thy Confessor:
      Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
      R. Amen.
status:
  la: verified
  en: draft
