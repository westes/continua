# [Oratio] and its English counterpart.
id: collect-maternity-of-the-bvm
text:
  la: |
    Orémus.
    Deus, qui de beátæ Maríæ Vírginis útero Verbum tuum, Angelo nuntiánte,
    carnem suscípere voluísti: præsta supplícibus tuis: ut qui vere eam
    Genetrícem Dei crédimus, ejus apud te intercessiónibus adjuvémur.
    Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat
    in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Let us pray.
    O God, who didst will that, at the announcement of an Angel, thy Word
    should take flesh in the womb of the Blessed Virgin Mary, grant to us
    thy suppliants, that we who believe her to be truly the Mother of God
    may be helped by her intercession with thee.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth
    with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: verified
  en: verified
