# Standard de-Communi commemoration for common-of-a-martyr-bishop (`[Ant 2]`+`[Versum 2]`
# from the reference engine's Commune files -- the tags used for a mere
# commemoration in every other verified category checked this pass, not
# yet independently live-verified for this specific category). ss-dionysius-and-companions has
# no proper antiphon of his/her own in the source (a plain "vide C..."
# reference), so this reuses the Common's own text, same as every other
# saint of this category with nothing proper -- marked `draft` per this
# app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (ss-dionysius-and-companions-collect.yml), unchanged.
id: ss-dionysius-and-companions-commemoration
text:
  la: |
    Ant. Qui odit * ánimam suam in hoc mundo, in vitam ætérnam custódit eam.
    V. Justus ut palma florébit.
    R. Sicut cedrus Líbani multiplicábitur.
    Orémus.
    Deus, qui hodiérna die beátum Dionýsium, Mártyrem tuum atque Pontíficem, virtúte constantiæ in passióne roborásti, quique illi, ad prædicándum géntibus glóriam tuam, Rústicum et Eleuthérium sociáre dignátus es: tríbue nobis, quǽsumus; eórum imitatióne, pro amóre tuo próspera mundi despícere, et nulla ejus advérsa formidáre.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. He that hateth his life * in this world, shall keep it unto life eternal.
    V. The righteous shall flourish like the palm tree:
    R. He shall grow up like the cedar of Libanus.
    Let us pray.
    O God, Who, as upon this day, didst make thy blessed Witness and Bishop Denis strong to wrestle and to suffer, and Who wast pleased to give unto him, for fellow workers in declaring thy glory among the heathen, thy servants Rusticus and Eleutherius, grant unto us, we beseech thee, to be like unto them in esteeming the good things of this world but lightly, and in fearing not at all the evil things of the same.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
