id: none-capitulum-christ-the-king
text:
  la: |
    Col 1:19-20 In ipso complácuit omnem plenitúdinem inhabitáre, et per eum reconciliáre ómnia in ipsum, pacíficans per sánguinem crucis ejus sive quæ in terris, sive quæ in cælis sunt, in Christo Jesu Dómino nostro.
    R. Deo grátias.
    V. Multiplicábitur ejus impérium.
    R. Et pacis non erit finis.
  en: |
    Col 1:19-20 In him, it hath well pleased the Father, that all fullness should dwell, and through him to reconcile all things unto himself, making peace through the blood of his cross, both as to the things that are on earth, and the things that are in heaven, in Christ Jesus our Lord.
    R. Thanks be to God.
    V. His empire shall be multiplied.
    R. And there shall be no end of peace.
