id: magnificat-antiphon-immaculate-conception
text:
  la: "Conceptio tua, * Dei Genitrix Virgo, gaudium annuntiavit universo mundo: ex te enim ortus est sol justitiæ, Christus Deus noster: qui solvens maledictionem, dedit benedictionem, et confundens mortem, donavit nobis vitam sempiternam."
  en: "Thy Birth * O Virgin Mother of God, was a message of joy to the whole world, for out of thee rose the Sun of righteousness, even Christ our God. Who hath taken away the curse and brought a blessing, confounded death, and given unto us everlasting life."
status:
  la: verified
  en: verified
