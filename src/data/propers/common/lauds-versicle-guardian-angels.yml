# Sancti/10-02.txt [Versum 2] -> Sancti/05-08.txt [Versum 3] (Raphael) / [Versum 1] -> Sancti/05-08.txt [Versum 3] (Guardian Angels). Replaces a copy of St. Michael's 'Stetit Angelus' versicle with a hard-coded Alleluia.
id: lauds-versicle-guardian-angels
text:
  la: "V. In conspéctu Angelórum psallam tibi, Deus meus.\nR. Adorábo ad templum sanctum tuum, et confitébor nómini tuo."
  en: "V. Before the Angels will I sing praise unto thee, O my God.\nR. I will worship toward thy holy Temple, and praise thy Name."
status:
  la: verified
  en: verified
