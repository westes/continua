# web/www/horas/Latin/SanctiM/10-03b.txt's [Capitulum Laudes (Terce reuses the Lauds chapter)] with the matching minor-hour versicle from SanctiM's [Responsory TertiaM]. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: terce-capitulum-st-therese-of-lisieux
text:
  la: |
    Hæc dicit Dóminus: Ecce ego declinábo super eam quasi flúvium pacis, et quasi torréntem inundántem glóriam géntium, quam sugétis: ad úbera portabímini, et super génua blandiéntur vobis.
    R. Deo grátias.
    V. Exsultábo et lætábor, Dómine, in misericórdia tua.
    R. Quóniam respéxit humilitátem meam.
  en: |
    Thus saith the Lord: Behold I will bring upon her as it were a river of peace, and as an overflowing torrent the glory of the Gentiles, which you shall suck: you shall be carried at the breasts, and upon the knees they shall caress you.
    R. Thanks be to God.
    V. I will be glad and rejoice, O Lord, in thy mercy.
    R. For thou hast regarded my humility.
citation:
  la: "Is 66:12"
  en: "Is 66:12"
status:
  la: verified
  en: draft
