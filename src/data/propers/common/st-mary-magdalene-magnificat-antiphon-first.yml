# First Vespers Magnificat antiphon: web/www/horas/Latin/Sancti/07-22.txt's own [Ant 1]
# and its English counterpart. Second Vespers' [Ant 3] is
# st-mary-magdalene-magnificat-antiphon.yml (the default); see hours/resolve-common.ts's
# withVespersVariant.
id: st-mary-magdalene-magnificat-antiphon-first
text:
  la: "Múlier * quæ erat in civitáte peccátrix, ut cognóvit quod Jesus accúbuit in domo Simónis leprósi, áttulit alabástrum unguénti, et stans retro secus pedes Jesu, lácrimis cœpit rigáre pedes ejus, et capíllis cápitis sui tergébat, et osculabátur pedes ejus, et unguénto ungébat."
  en: "A woman in the city * which was a sinner, when she knew that Jesus sat at meat in the house of Simon the leper, brought an alabaster box of ointment, and stood at the Feet of Jesus, behind Him, weeping, and began to wash His Feet with tears, and did wipe them with the hairs of her head, and kissed His Feet, and anointed them with the ointment."
status:
  la: verified
  en: verified
