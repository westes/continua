id: lauds-capitulum-st-gregory-the-great
text:
  la: "Ecce sacérdos magnus, qui in vita sua suffúlsit domum, et in diébus suis corroborávit templum."
  en: "Behold a great priest, who in his life upheld the house of God, and in his days strengthened the temple."
citation:
