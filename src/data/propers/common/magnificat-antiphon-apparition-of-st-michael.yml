# Second Vespers Magnificat antiphon, read directly from
# web/www/horas/Latin/Sancti/05-08.txt's own [Ant 3] and its English
# counterpart -- a real, proper antiphon of this feast (own First Vespers
# [Ant 1] "Dum sacrum mystérium..." is not otherwise transcribed here),
# not a Common substitution. Shared by st-michael.yml (same `propers`).
id: magnificat-antiphon-apparition-of-st-michael
text:
  la: "Princeps gloriosíssime, * Míchaël Archángele, esto memor nostri: hic et ubíque semper precáre pro nobis Fílium Dei, allelúja, allelúja."
  en: "O thou Prince most glorious, * Michael the Archangel, remember us and here, and everywhere, always entreat for us the countenance of the Son of God. Alleluia, Alleluia."
status:
  la: verified
  en: verified
