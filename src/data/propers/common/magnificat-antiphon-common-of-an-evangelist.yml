# Second Vespers Magnificat antiphon for `common-of-an-evangelist`
# (Commune Evangelistarum, Latin/Commune/C1a.txt) -- C1a.txt is
# "@Commune/C1" with only Lectio1-9 overridden (its own Matins-lesson
# content, Ezechiel + St. Gregory); every antiphon section, including
# [Ant 3], is inherited unchanged from C1 (Commune Apostolorum). Same
# text as magnificat-antiphon-common-of-an-apostle.yml, registered under
# its own id per this codebase's standing convention for shared Common
# content rather than aliased (see e.g. benedictus-antiphon-common-of-a-
# confessor-not-bishop.yml's own header for the same pattern).
id: magnificat-antiphon-common-of-an-evangelist
text:
  la: "Estóte fortes * in bello, et pugnáte cum antíquo serpénte: et accipiétis regnum ætérnum, allelúia."
  en: "Be valiant * in battle, fight the ancient serpent and accept the eternal kingdom. Alleluia."
status:
  la: verified
  en: verified
