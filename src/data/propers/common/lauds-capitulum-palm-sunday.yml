# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2026-03-29); Latin and English both taken from the page.
id: lauds-capitulum-palm-sunday
text:
  la: "Fratres: Hoc enim sentíte in vobis, quod et in Christo Jesu: qui, cum in forma Dei esset, non rapínam arbitrátus est esse se æquálem Deo: sed semetípsum exinanívit, formam servi accípiens, in similitúdinem hóminum factus, et hábitu invéntus ut homo."
  en: "Brothers: For let this mind be in you, which was also in Christ Jesus: Who being in the form of God, thought it not robbery to be equal with God: But emptied himself, taking the form of a servant, being made in the likeness of men, and in habit found as a man."
citation:
  la: "Phil 2:5-7"
  en: "Phil 2:5-7"
status:
  la: verified
  en: verified
