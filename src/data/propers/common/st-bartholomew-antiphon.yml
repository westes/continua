# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, St. Bartholomew's own day (2026-08-24) -- the Benedictus
# antiphon (Matt 19:27ff, same verse as St. Matthias/St. Barnabas/
# St. James the Greater's own). The source's own English existed but was
# jarringly modern next to every other antiphon's archaic register --
# reworded to match (the underlying verse's standard Douay-Rheims
# wording, same fix as those three), marked draft rather than a straight
# source transcription.
id: st-bartholomew-antiphon
text:
  la: "Vos qui reliquístis ómnia, et secúti estis me, céntuplum accipiétis, et vitam ætérnam possidébitis."
  en: "Ye who have left all things, and have followed me, shall receive an hundredfold, and shall possess life everlasting."
status:
  la: verified
  en: draft
