# Second Vespers versicle (also the default): web/www/horas/Latin/SanctiM/10-03b.txt's [Versum 3]. First Vespers' [Versum 1] is vespers-versicle-st-therese-of-lisieux-first.yml. The reference source has no English for any of this feast's SanctiM-only proper office (English/SanctiM/10-03b.txt carries only the [Lectio7]/[Lectio8]/[Lectio11]/[Lectio12] overrides), so every English line here is a direct translation of the Latin, marked draft.
id: vespers-versicle-st-therese-of-lisieux
text:
  la: |
    V. Manus Dómini confortávit te.
    R. Et ídeo eris benedícta in ætérnum.
  en: |
    V. The hand of the Lord hath strengthened thee.
    R. And therefore thou shalt be blessed for ever.
status:
  la: verified
  en: draft
