# Own proper antiphon (ss-philip-and-james-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-apostle (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (ss-philip-and-james-collect.yml), unchanged.
id: commemoration-ss-philip-and-james
text:
  la: |
    Ant. Ego sum via, véritas, et vita: nemo venit ad Patrem, nisi per me, allelúja.
    V. Annuntiavérunt ópera Dei.
    R. Et facta ejus intellexérunt.
    Orémus.
    Deus, qui nos ánnua Apostolórum tuórum Philíppi et Jacóbi solemnitáte lætíficas: præsta, quǽsumus; ut, quorum gaudémus méritis, instruámur exémplis.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    R. Amen.
  en: |
    Ant. I am the Way the Truth, and the Life: no man cometh unto the Father, but by Me. Alleluia.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
    O God, Who dost every year gladden us by the solemn memorial of thine Apostles Philip and James, grant us grace, we beseech thee, not only to rejoice because of their worthy deeds, but also to tread in their footsteps.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
status:
  la: draft
  en: draft
