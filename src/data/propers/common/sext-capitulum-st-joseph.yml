id: sext-capitulum-st-joseph
text:
  la: "Diléctus Deo et homínibus, cujus memória in benedictióne est. In fide et lenitáte ipsíus sanctum fecit illum, et elégit eum ex omni carne."
  en: "Beloved of God, and men: whose memory is in benediction. He sanctified him in his faith, and meekness, and chose him out of all flesh."
citation:
  la: "Sir 45:1; 45:4"
  en: "Sir 45:1; 45:4"
status:
  la: verified
  en: verified
