# Verified against Divinum Officium (Monastic Tridentinum 1617), Lauds
# live query, the Chair of St. Peter at Antioch's own day (2027-02-22,
# 2026 is governed by Lent I Sunday). The Benedictus antiphon. Corrects
# the previous version of this file, which had been sourced from the
# Roman/secular rite's Sancti/02-22.txt's own [Ant 1] instead: real but
# different text from what Monastic 1617 actually renders at Lauds, same
# mistake as St. Lawrence's earlier fix -- shared word-for-word with the
# Chair of St. Peter at Rome's own (already corrected), confirmed
# independently rather than assumed.
id: benedictus-antiphon-chair-of-st-peter-at-antioch
text:
  la: "Quodcúmque ligáveris super terram, erit ligátum et in cælis; et quodcúmque sólveris super terram, erit solútum et in cælis: dicit Dóminus Simóni Petro."
  en: "Thus saith the Lord unto Simon Peter: Whatsoever thou shalt bind on earth, shall be bound in heaven; and whatsoever thou shalt loose on earth, shall be loosed in heaven."
status:
  la: verified
  en: verified
