id: none-capitulum-immaculate-heart-of-mary
text:
  la: |
    Sir 24:19-20 In platéis sicut cinnamómum et bálsamum aromatízans odórem dedi: quasi myrrha elécta, dedi suavitátem odóris.
    R. Deo grátias.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
  en: |
    Sir 24:19-20 As a plane tree by the water in the streets, I gave a sweet smell like cinnamon. and aromatical balm: I yielded a sweet odour like the best myrrh.
    R. Thanks be to God.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
