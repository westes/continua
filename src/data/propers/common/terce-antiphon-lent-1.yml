id: terce-antiphon-lent-1
text:
  la: "Tunc assúmpsit * eum diábolus in sanctam civitátem, et státuit eum supra pinnáculum templi, et dixit ei: Si Fílius Dei es, mitte te deórsum."
  en: "Then the devil taketh Him up into the holy city, * and setteth Him on a pinnacle of the temple, and saith unto Him: If Thou be the Son of God, cast thyself down."
