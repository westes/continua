# Own proper antiphon (st-peter-ad-vincula-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-an-apostle (`[Versum 2]`, the tag
# paired with `[Ant 2]` for a mere commemoration in every other verified
# category checked this pass) -- not yet independently live-verified for
# this specific category, so marked `draft` rather than `verified` per
# this app's own "prefer draft over missing" convention. Collect is the
# saint's own real proper (st-peter-ad-vincula-collect.yml), unchanged.
id: st-peter-ad-vincula-commemoration
text:
  la: |
    Ant. Quodcúmque ligáveris super terram, erit ligátum et in cælis; et quodcúmque sólveris super terram, erit solútum et in cælis: dicit Dóminus Simóni Petro.
    V. Annuntiavérunt ópera Dei.
    R. Et facta ejus intellexérunt.
    Orémus.
    Deus, qui beátum Petrum Apóstolum, a vínculis absolútum, illǽsum abíre fecísti: nostrórum, quæsumus, absólve víncula peccatórum; et ómnia mala a nobis propitiátus exclúde.
    Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.
    ℟. Amen.
  en: |
    Ant. Thus saith the Lord unto Simon Peter: Whatsoever thou shalt bind on earth, shall be bound in heaven; and whatsoever thou shalt loose on earth, shall be loosed in heaven.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
    O God, who didst loose the blessed Apostle, Peter, from his chains and didst make him go forth unharmed, loose, we pray, the chains of our sins, and in thy mercy ward off from us every evil.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    ℟. Amen.
status:
  la: draft
  en: draft
