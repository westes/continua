# Matins hymn for St. Michael's Apparition and the whole Angel family
# (Guardian Angels, St. Michael's own Sep 29 feast, St. Gabriel, St.
# Raphael) -- confirmed byte-identical to the Vespers hymn via
# SanctiM/05-08.txt's own [HymnusM Matutinum] `@:HymnusM Vespera`
# cross-reference, live-verified 2026-05-08 (Monastic Tridentinum 1617).
# Same Guardian-Angels/Archangels proper-content-reuse finding as this
# session's earlier Lauds/Vespers pass -- no `common-of-an-angel`
# category exists in the source at all.
id: matins-hymn-guardian-angels
text:
  la: |
    Tibi Christe splendor Patris,
    Vita, virtus córdium,
    In conspéctu Angelórum,
    Votis, voce psállimus:
    Alternántes concrepándo
    Melos damus vócibus.

    Collaudámus venerántes
    Omnes cæli mílites,
    Sed præcípue Primátem
    Cæléstis exércitus:
    Michaélem in virtúte
    Conteréntem zábulum.

    Quo custóde procul pelle,
    Rex Christe piíssime,
    Omne nefas inimíci:
    Mundo corde et córpore,
    Paradíso redde tuo
    Nos sola cleméntia.

    Glóriam Patri melódis
    Personémus vócibus,
    Glóriam Christo canámus,
    Glóriam Paráclito,
    Qui trinus et unus Deus
    Exstat ante sǽcula.
    Amen.
  en: |
    Thee, O Christ, the Father's splendour,
    Life and virtue of the heart,
    In the presence of the Angels
    Sing we now with tuneful art,
    Meetly in alternate chorus
    Bearing our responsive part.

    Thus we praise with veneration
    All the armies of the sky;
    Chiefly him, the warrior Primate,
    Of celestial chivalry,
    Michael, who in princely virtue
    Cast Abaddon from on high.

    By whose watchful care repelling -
    King of everlasting grace -
    Every ghostly adversary,
    All things evil, all things base,
    Grant us of thine only goodness
    In thy Paradise a place.

    Laud and honour to the Father,
    Laud and honour to the Son,
    Laud and honour to the Spirit,
    Ever Three, and ever One,
    Consubstantial, co-eternal,
    While unending ages run.
    Amen.
status:
  la: verified
  en: verified
