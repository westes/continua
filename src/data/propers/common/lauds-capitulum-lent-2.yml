# Engine render (Monastic Tridentinum 1617, command=prayLaudes, 2025-03-16); Latin and English both taken from the page.
id: lauds-capitulum-lent-2
text:
  la: "Fratres: Rogámus vos, et obsecrámus in Dómino Jesu: ut, quemádmodum accepístis a nobis, quómodo vos opórteat ambuláre, et placére Deo, sic et ambulétis, ut abundétis magis."
  en: "For the rest therefore, brethren, we pray and beseech you in the Lord Jesus, that as you have received from us, how you ought to walk, and to please God, so also you would walk, that you may abound the more."
citation:
  la: "1 Thess 4:1"
  en: "1 Thess 4:1"
status:
  la: verified
  en: verified
