id: sext-capitulum-sacred-heart
text:
  la: |
    Eph 3:14-17 Hujus rei grátia flecto génua mea ad Patrem Dómini nostri Jesu Christi, ut det vobis secúndum divítias glóriæ suæ virtúte corroborári per Spíritum ejus in interiórem hóminem: Christum habitáre per fidem in córdibus vestris.
    R. Deo grátias.
    V. Memóriam fecit mirabílium suórum miserátor Dóminus.
    R. Escam dedit timéntibus se.
  en: |
    Eph 3:14-17 For this cause I bow my knees unto the Father of our Lord Jesus Christ, of whom the whole family in heaven and earth is named, that he would grant you, according to the riches of his glory, to be strengthened with might by his Spirit in the inner man, that Christ may dwell in your hearts by faith.
    R. Thanks be to God.
    V. The merciful Lord hath instituted a memorial of his wondrous deeds.
    R. He hath given meat unto them that fear him.
