# Own proper antiphon (st-anne-antiphon.yml), paired with the standard
# de-Communi commemoration versicle for common-of-a-holy-woman (`[Versum 2]`, the tag
# actually paired with `[Ant 2]` in the reference engine's Commune files
# for a mere commemoration -- confirmed against this exact category via
# an independently live-verified precedent elsewhere in this app). Collect
# is the saint's own real proper (st-anne-collect.yml), unchanged.
id: st-anne-commemoration
text:
  la: |
    Ant. Date ei de fructu mánuum suárum, et laudent eam in portis ópera ejus.
    V. Diffúsa est grátia in lábiis tuis.
    R. Proptérea benedíxit te Deus in ætérnum.
    Orémus.
    Deus, qui beátæ Annæ grátiam conférre dignátus es, ut Genitrícis unigéniti Fílii tui mater éffici mererétur: concéde propítius; ut, cujus solémnia celebrámus, ejus apud te patrocíniis adjuvémur. Per eúmdem Dóminum nostrum Jesum Christum Fílium tuum, qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum.

    R. Amen.
  en: |
    Ant. Give her of the fruit of her hands, and let her own works praise her in the gates.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Who in thy kindness gave blessed Anne the grace to be the mother of her who mothered thy only-begotten Son, graciously grant that we who keep her feast may be helped by her intercession with thee. Through the same Jesus Christ, thy Son, Our Lord, Who liveth and reigneth with thee in the unity of the Holy Ghost, God, world without end.

    R. Amen.
status:
  la: verified
  en: verified
