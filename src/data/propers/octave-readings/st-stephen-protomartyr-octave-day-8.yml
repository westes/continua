# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Sancti/01-02.txt) -- day 8, "In Octava," St. Stephen's own octave closing
# day. Unlike the full graduated 8-day octaves (Assumption, Lawrence, etc.),
# this Christmas-week octave's own intervening days (2-7, Dec 27-31) turn
# out to carry NO Lectio override at all in the source -- every suffix file
# checked at those dates (`12-27o`, `12-28o`/`12-28r`, `12-29o`/`12-29r`,
# `12-31o`/`12-31r`; Dec 30 has no suffix file whatsoever) is a bare
# `@Sancti/MM-DD` alias with no `[LectioN]` content of its own, correctly
# left unauthored -- same "vide-only, not a gap" pattern as the fixed-date
# octaves audited earlier (see memory vu-octave-readings-by-date). Only the
# closing day carries real content: St. Augustine's own sermon on Stephen
# (Lectio4-6) + St. Jerome's homily on Matt 23:34-35 (Lectio7-9, bare
# incipit dropped).
id: st-stephen-protomartyr-octave-day-8
source:
  la: "Sermo sancti Augustíni Epíscopi; Homilía sancti Hierónymi Presbýteri"
  en: "Sermon of St. Augustine, Bishop; Homily of St. Jerome, Priest"
text:
  la: |
    Post hestérnum festivíssimum diem, quo Salvatóris nostri Christi nobis Natívitas illúxit, étiam hodiérnus dies beáti Mártyris Stéphani coróna illustrátur. Mártyris illíus mérita nulla pars orbis ignórat: passus enim est in ipso princípio Ecclésiæ, id est, in ipsa urbe Jerosólyma. Ibi enim Diáconus ministrávit: et in ipso juventútis flore decórem ætátis suæ sánguine purpurávit. Pássio ejus insígnis est, multúmque mirábilis. Hanc modo de libro Actuum Apostolórum, cum legerétur, non solum audívimus, sed étiam óculis spectávimus.

    Christus ergo caput Mártyrum prior passus est pro nobis, relínquens vobis exémplum, ut sequámini vestígia ejus. Cujus passiónis vestígia prosecútus beatíssimus Stéphanus, confiténdo Christum lapidátus a Judǽis, corónam méruit tamquam suo sibi nómine pósitam. Stéphanus enim Græce, Latíne coróna appellátur. Jam coróna nomen habébat, et ídeo palmam martýrii suo nómine præferébat.

    Qui cum lapidarétur, non solum non exspectábat de persecutóribus reportáre vindíctam, sed eis pótius a Deo véniam postulábat. Memínerat enim dixísse Dóminum: Mihi vindíctam, ego retríbuam, dicit Dóminus. Et íterum: Ne díxeris, Ulcíscar me de inimícis meis; sed exspécta Dóminum, ut tibi auxílio sit. Exspectáre nos jubet Dóminus Deus, ut in die futúræ retributiónis cum sanctis Martýribus vindicémur.

    Jerúsalem, Jerúsalem, quæ occídis prophétas. Jerúsalem, non saxa et ædifícia civitátis, sed habitatóres vocat: quam plangit patris afféctu, sicut et in álio loco légimus, quod videns eam, fléverit. In eo autem quod dicit: Quóties vólui congregáre fílios tuos: omnes retro prophétas a se missos esse testátur. Gallínæ quoque similitúdinem congregántis sub alas pullos suos, in cántico Deuteronómii légimus: Sicut áquila prótegit nidum suum, et super pullos suos desiderávit: expándens alas suas, suscépit eos, et tulit super pennas suas.

    Ecce relinquétur vobis domus vestra desérta. Hoc ipsum ex persóna Jeremíæ jam ante díxerat: Relíqui domum meam, dimísi hereditátem meam: facta est mihi heréditas mea quasi spelúnca hyǽnæ. Desértam Judæórum domum, id est, templum illud, quod fulgébat augústius, óculis comprobámus, quia habitatórem Christum pérdidit, et hereditátem prærípere géstiens, occídit herédem.

    Dico enim vobis: Non me vidébitis ámodo, donec dicátis: Benedíctus qui venit in nómine Dómini. Ad Jerúsalem lóquitur, et ad pópulum Judæórum. Versículum autem istum, quo et párvuli atque lacténtes in ingréssu Jerúsalem Dómini Salvatóris usi sunt, quando dixérunt: Benedíctus qui venit in nómine Dómini, hosánna in excélsis, sumpsit de centésimo décimo séptimo Psalmo, qui maniféste de advéntu Dómini scriptus est.
  en: |
    Even after the glory of yesterday, bright with the splendour of Christ our Saviour's Birth, this day findeth itself an illumination of its own from the crown of the blessed Martyr Stephen. The whole earth knoweth how manfully he fought and conquered, for he suffered at the very fountain-head of the Church, that is to say, in Jerusalem. It was in the Church there that he ministered as a Deacon, and in the youthful springtime of life dyed with his blood the lily of his purity. His Passion is very glorious, and in many ways wonderful, and when we read it in the Acts of the Apostles, we seem rather to see than to hear.

    Christ, the Captain of the Martyrs, hath first suffered for us, leaving us an example that we should follow His steps. And truly, blessed Stephen followed them, when, having confessed Christ, he was stoned to death by the Jews, and obtained the crown which his name had foreshown. For the meaning of the Greek name Stephanos is a crown. Already he had a crown for his name, a foreshadowing of the martyr's palm which he beareth in heaven.

    When they stoned him, he did not rejoice at the thought that God would take vengeance on his persecutors. On the contrary, he prayed that they might be forgiven. For he remembered the word of the Lord, that saith: "Vengeance belongeth unto Me, I will recompense, saith the Lord," and again: "Say not thou, I will recompense evil to mine enemies; but wait on the Lord, and He shall save thee." The Lord God biddeth us also be patient, knowing that in the great day of retribution, we, as well as His holy martyrs, shall be righted.

    O Jerusalem, Jerusalem, thou that killest the Prophets. The Jerusalem that killed the Prophets was not the material stone and houses, but they that dwelt therein. He wept over her with a father's love, as also it is written in another place that, when He saw the city, He wept over it. "How often would I have gathered thy children together": here observe that Christ avoweth that He had been the Sender of all the former Prophets. Even as an hen gathereth her chickens under her wings — a similar figure is found in the Song of Moses in Deuteronomy: "As an eagle stirreth up her nest, fluttereth over her young, spreadeth abroad her wings, taketh them, and beareth them on her wings."

    "Behold, your house is left unto you desolate." God had already spoken these things once before, by the mouth of Jeremiah, where He saith: "I have forsaken Mine house, I have left Mine heritage; Mine inheritance is become unto Me like an hyaena's den." The house of the Jews, which was to be left unto them desolate — that is, that Temple, whose splendour they loved only too well — they lost when they slew the Owner of it for the sake of it, saying of Christ: "This is the heir; come, let us kill Him, and the inheritance shall be ours."

    "I say unto you, Ye shall not see Me henceforth, till ye shall say: Blessed is He that cometh in the name of the Lord." Here He speaketh to Jerusalem and to the Jewish people. The words, "Blessed is He That cometh in the name of the Lord," were indeed spoken by babes and sucklings when the Saviour entered Jerusalem in triumph, and they that went before and they that followed cried, saying, "Blessed is He That cometh in the name of the Lord; Hosanna in the highest" — but they are originally taken from Psalm 117, which is all evidently written in honour of the coming of our Lord.
status:
  la: verified
  en: verified
