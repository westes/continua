# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-08-14). Matins reading for day 5 of St. Lawrence's
# own octave -- collapsed into one continuous reading per project convention.
# Same recurring responsory as day 2 (see st-lawrence-octave-day-2.yml). The
# source's own English translation is used as-is, including gaps in its own
# punctuation (some older "oct"/"bmv"-suffixed variant files drop question
# marks entirely in places) -- not corrected here, since guessing where they
# belong isn't the same class of fix as an isolated single-character typo.
id: st-lawrence-octave-day-5
source:
  la: "Sermo sancti Maximi Epíscopi"
  en: "Sermon of St. Maximus, Bishop"
text:
  la: |
    Sermo sancti Maximi Epíscopi Homilia 1 de S. Laurentio Sanctum est, fratres, ac Deo placitum, ut natalem beati Laurentii præcipua devotione veneremur: cujus radiantibus flammis victrix in hunc quoque diem toto orbe Christi coruscat Ecclesia. Qui cum in sede gloriosissimi Patriarchæ diaconatus fungeretur officio, puritate innocentis vitæ, fortissimæque mortis triumpho, apostolico se consortio copulavit. Nec immerito eum Apostolorum supparem prædicamus, cui et castitas animi leviticum ministerium dedit, et plenitudo fidei martyrii contulit dignitatem.

    Quem venerabilis Xystus, Romanæ urbis Antistes, cum impietatem sævientis mundi per tormenta superaret, et regnis esset cælestibus jam vicinus, videretque eum paterna de morte tristissimum, ita illum spiritu præscientiæ compellasse narratur: Noli fili mœstus esse: post triduum me sequeris. Unde apparet, carissimi, beatum Laurentium non de sacerdotis sui victoria habuisse tristitiam, sed doluisse, quia non étiam ipse mundum cum suo pariter sacerdote vincebat. Noli, inquit, fili mœstus esse: post triduum me sequeris. Hoc est, Noli tristis esse, velut apud sæculum derelictus: nam nec te fides vítaque tua tali morte privabit.

    Léctio sancti Evangélii secúndum Lucam Luc 11:27-28 In illo témpore: Loquente Jesu ad turbas, extollens vocera quædam mulier de turba, dixit illi: Beatus venter, qui te portavit. Et réliqua. Homilia sancti Augustíni Epíscopi Tract. 10 in Joann., post init. Beata Virgo Maria, quia fecit voluntatem Patris. Hoc in ea magnificavit Dominus, quia fecit voluntatem Patris, non quia caro gonuit carnem. Intendat caritas vestra. Propterea cum Dominus in turba admirabilis videretur, faciens signa et prodigia, et ostendens quid lateret in carne, admiratæ quædam animæ dixerunt: Felix venter, qui te portavit. Et ille: Imo felices, qui audiunt verbum Dei, et custodiunt illud. Hoc est dicere: Et mater mea, quam appellatis felicem, inde felix, quia verbum Dei custodit: non quia in illa Verbum caro factum est, et habitavit in nobis: sed quia custodit ipsum Verbum Dei, per quod facta est, et quod in illa caro factum est.
  en: |
    From the Sermons of St. Maximus, Bishop of Turin. 1st on St. Lawrence. It is an holy thing, brethren, and a thing well-pleasing in the sight of God, to venerate with special earnestness the Birth-day of blessed Lawrence, in the radiance of whose flames the victorious Church of Christ doth, even unto this day, shine splendidly throughout all the world. He discharged the office of a Deacon at the seat of the most glorious of the Patriarchates, and by the purity of his stainless life, and the brilliant victory of his noble death, hath gained himself a place in the fellowship of the Apostles. It is not an exaggeration to claim something in common with the Apostles for one whose purity of soul gave him the ministry of a Levite, and whose fulness of faith hath crowned him with the dignity of Martyrdom.

    When the worshipful Sixtus, Bishop of the city of Rome, was overcoming through suffering the wickedness of a frantic world, and was now drawing very nigh to the kingdom of heaven, he saw Lawrence very sorrowful at the death of his ghostly father, and he is said to have addressed to him, in the spirit of prophecy, these words Be not sorrowful, my son yet three days, and thou shalt follow me. Hence it appeareth, dearly beloved brethren, that the blessed Lawrence was not sorrowful because of his Bishop's victory, but because he was not going to equal his Bishop in conquering the world. Be not sorrowful, my son, said Sixtus, yet three days, and thou shalt follow me, that is to say Be not sorrowful, as though thou wert left alone in the world thy faith and thy life will not suffer thee to go without such a death as thou wouldest.

    For the Eve of the Assumption. From the Holy Gospel according to Luke Luke 11:17-28 At that time As Jesus spake unto multitudes, a certain woman of the company lifted up her voice, and said unto Him Blessed is the womb that bare thee. And so on. Homily by StAugustine, Bishop of Hippo. 10th Tract on John. Blessed is the Virgin Mary, because she did the will of the Father. Matth. xii. 50. This it was that the Lord praised in her, namely, that she did the will of His Father, not that her flesh had given birth to His Flesh. Be kind enough to give me your attention, my dear brethren. When the Lord amazed the crowd by working signs and wonders, and showing thereby What was veiled in His Flesh, a woman, in the astonishment of her mind, cried out Blessed is the womb that bare thee, and the paps which Thou hast sucked. But He said Yea, rather, blessed are they that hear the Word of God, and keep it. That is to say Even My Mother, whom ye call blessed, hath her blessedness from this, that she keepeth the word of God not because it was in her that the Word of God was made Flesh, and dwelt among us, but because she heareth and keepeth that Word of God by Which she was made, John i. 3, and Which in her was made Flesh.
responsory:
  la: |
    ℟. Levíta Lauréntius bonum opus operátus est, qui per signum crucis cæcos illuminávit, * Et thesáuros Ecclésiæ dedit paupéribus. ℣. Dispérsit, dedit paupéribus: justítia ejus manet in sǽculum sǽculi. ℟. Et thesáuros Ecclésiæ dedit paupéribus.
  en: |
    ℟. The Levite Lawrence wrought a good work, in that with the sign of the Cross he gave sight to the blind, * And dispersed among the needy the riches of the Church. ℣. He hath dispersed, he hath given to the poor his righteousness endureth forever. ℟. And dispersed among the needy the riches of the Church.
status:
