# octave closing day, same shape/rationale as sacred-heart-octave-day-2.yml.
# Joins St. Bernard's own sermon on the wounds of Christ (Lectio4-6, from
# his commentary on the Song of Songs) with St. Augustine's Tractate 120 on
# John (Lectio7-9, same Gospel pericope as every other day in this octave;
