id: ascension-octave-day-5
source:
  la: "Sermo sancti Joánnis Chrysóstomi; Homilía sancti Gregórii Papæ"
  en: "Sermon of St. John Chrysostom; Homily of St. Gregory the Great, Pope"
text:
  la: |
    Christus ascéndens in cælum, nostræ natúræ primítias óbtulit Patri, et oblátum donum mirátus est Pater, quod et tanta dígnitas offerébat; et quod offerebátur, nulla mácula fœdabátur. Nam et suis mánibus suscépit oblátum, et suæ sedis fecit esse partícipem, et quod plus est, ad partem suæ déxteræ collocávit. Cognoscámus, quis est ille qui audívit, Sede ad déxteram meam: quæ natúra est, cui Deus dixit, Esto meæ párticeps sedis. Illa natúra est, quæ audívit: Terra es, et in terram ibis.

    Non enim ad omnem glóriam cælos transísse suffécerat, non cum Angelis stare: sed cælos transívit, supra Chérubim ascéndit, ultra Séraphim elevátur, nec ante stetit, nisi sedem Domínicam meruísset. Vide quo spátio cælum separátur a terra, immo terra quanto ab ínferis abest, et ipsum cælum quanto ab altióre cælo separátur, et de altióre cælo ad Angelos quantum spátii est, ad superióres étiam Potestátes, ad ipsam quoque Domínicam sedem. Super hæc ómnia natúra nostra eleváta est, ut homo, qui loco tam húmili tenebátur, ut descéndere non posset ultérius, ad tam excélsam sedem elevarétur, ut áltius non posset ascéndere.

    Et hæc osténdens Paulus dicébat: Qui descéndit, ipse est qui ascéndit. Et íterum: Descéndit ad inferióra terræ, et ascéndit super omnes cælos. Díscite ígitur quisnam ascéndit, et quæ natúra eleváta est. In hoc enim cúpio remorári sermóne, ut humáni géneris commemoratióne, divínam cleméntiam cum omni admiratióne discámus, quæ summum honórem, magnámque glóriam nostræ natúræ largíta est, quæ ómnibus hodiérna die méruit excélsior reperíri. Hódie Angeli atque Archángeli natúram nostram in sede Domínica immortáli glória fulgéntem vidérunt.

    Et Dóminus quidem Jesus, postquam locútus est eis, assúmptus est in cælum, et sedet a dextris Dei. In véteri Testaménto cognóvimus, quod Elias sit raptus in cælum. Sed áliud est cælum ǽreum, áliud æthéreum. Cælum quippe ǽreum terræ est próximum: unde et aves cæli dícimus, quia eas volitáre in aëre vidémus. In cælum ítaque ǽreum Elias sublevátus est, ut in secrétam quamdam terræ regiónem repénte ducerétur, ubi in magna jam carnis et spíritus quiéte víveret, quoúsque ad finem mundi rédeat, et mortis débitum solvat. Ille étenim mortem dístulit, non evásit: Redémptor autem noster, quia non dístulit, superávit, eámque resurgéndo consúmpsit, et resurrectiónis suæ glóriam ascendéndo declarávit.

    Notándum quoque est, quod Elias in curru légitur ascendísse: ut vidélicet apérte demonstrarétur, quia homo purus adjutório indigébat aliéno. Per Angelos quippe facta illa et osténsa sunt adjuménta: quia nec in cælum quidem aéreum per se ascéndere póterat, quem natúræ suæ infírmitas gravábat. Redémptor autem noster non curru, non Angelis sublevátus légitur: quia is, qui fécerat ómnia, nimírum super ómnia sua virtúte ferebátur. Illo étenim revertebátur, ubi erat: et inde redíbat, ubi remanébat: quia cum per humanitátem ascénderet in cælum, per divinitátem suam et terram páriter continébat et cælum.

    Sicut autem Joseph a frátribus vénditus venditiónem Redemptóris nostri figurávit: sic Henoch translátus, atque ad cælum aéreum Elias sublevátus, ascensiónem Domínicam utérque designávit. Ascensiónis ergo suæ Dóminus prænúntios et testes hábuit, unum ante legem, álium sub lege: ut quandóque veníret ipse, qui veráciter cælos penetráre potuísset. Unde et ipse ordo in eórum quoque utrorúmque sublevatióne per quædam increménta distínguitur. Nam Henoch translátus, Elías vero ad cælum subvéctus esse memorátur: ut veníret póstmodum, qui nec translátus nec subvéctus, cælum æthéreum sua virtúte penetráret.
  en: |
    Then Christ went up into heaven, He offered unto the Father the First-fruits of our nature, and the Father marvelled at the offering, seeing the Majesty of the Priest and the Spotlessness of the oblation. He received the Sacrifice into His Own hands, He made It to sit upon His Throne, nay, more, He gave It a place at His Own Right Hand. Let us ask what nature was His Who heard the words: "Sit Thou at My right hand," what nature was His to Whom God said, "Be Thou Partaker of My Throne?" It was the same nature as was his who heard the sentence: "Dust thou art, and unto dust shalt thou return."

    It was not enough of glory for Him to be exalted above the heavens, nor to be ranked with angels; but He was exalted above the heavens, He went up above the Cherubim, He ascended beyond the Seraphim, neither found He His rank beneath the Throne of the Lord of lords. Behold how high the heaven is above the earth, and the earth above hell, how high above the heaven is the heaven of heavens, how high above the heaven of heavens the Angels, above the Angels the Higher Powers, and above the Higher Powers the Throne of the Lord. Above all these hath One of our nature been exalted, so that man, which had fallen so low that there was no farther fall for him, is now in place so high, that there is thence no ascending.

    Paul also, dwelling on this, saith: "He That descended is the Same also That ascended up far above all heavens," even as he had said: "Now, that He ascended, what is it but that He also descended first into the lower parts of the earth." Learn hence Who it was That ascended, and with what nature He was exalted. And with this thought I wish to bring my sermon to an end. From the thought of that glorified Manhood let us learn with amazement what the goodness of God is — that goodness which hath crowned with an honour, higher than which is none, and a glory, greater than which is none, a Person Sharer of our nature, even That Person Which this day hath taken the place which is His of right, above all things other than Himself.

    "So then, after the Lord Jesus had spoken unto them, He was received up into heaven, and sat on the right hand of God." We learn in the Old Testament that Elijah was taken up into heaven. But this word "heaven" may mean either the terrestrial atmosphere, or the space external to the sphere of this planet. Of these the atmosphere closely surrounds the earth, and we call the birds "the fowls of the heaven," because we see them fly therein. It was only up into this that Elijah was taken, that he might be carried off suddenly into some part of the earth, to us unknown, and there live in profound peace of body and soul, until the end of the world, when he will return and pay the debt of nature. For him, therefore, death waiteth, but is not escaped. But our Redeemer made it not to wait for Him, but conquered it, and by rising again shattered it, and by His Ascension showed forth the glory of His Again-rising.

    We must mark also, how that Elijah was taken up in a chariot, as though to show plainly that for a mere man some outward help was needful. This help was given to him by Angels, as plainly appeareth, since it was impossible for one whom a weak nature yet weighed down earthward, to fly up even into the atmosphere. But of our Redeemer we read not that He was borne up in a chariot, or by Angels, since He by Whom all things were made clearly rose above all things by His Own Power. He returned unto Him with Whom He was, and whither He returned, there He abode, for albeit as touching His Manhood He ascended up into heaven, yet, as touching His Godhead, He still comprehended both heaven and earth.

    But as the sale of Joseph by his brethren was a type of the sale of Christ, so were the translations of Enoch and Elijah types of His Ascension. The Lord therefore had had forerunners and witnesses of His Ascension, the one before the Law, the other under the Law, that Himself might one day come, Who was able indeed to pass into the heavens. Hence also there is some difference to be observed in the manner wherein each was translated. Enoch was seen no more, for God took him; Elijah was carried up by a whirlwind into heaven; He That came after them was not taken up, nor carried up, but went up through space by His Own Power.
responsory:
  la: |
    R. Post passiónem suam per dies quadragínta appárens eis, et loquens de regno Dei, allelúia: * Et, vidéntibus illis, elevátus est, allelúia: et nubes suscépit eum ab óculis eórum, allelúia. V. Et convéscens, præcépit eis, ab Jerosólymis ne discéderent, sed exspectárent promissiónem Patris. R. Et, vidéntibus illis, elevátus est, allelúia: et nubes suscépit eum ab óculis eórum, allelúia.
  en: |
    R. Being seen of them forty days after that He had suffered, and speaking of the kingdom of God. Alleluia. * And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia. V. And, eating together with them, He commanded them that they should not depart from Jerusalem, but wait for the Promise of the Father. R. And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia.
