# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-09-11). Matins reading for day 4 of the Nativity
# of the BVM's own octave -- collapsed into one continuous reading per project
# convention. The source's own English translation is used as-is, including
# gaps in its own punctuation (some older "oct"/"bmv"-suffixed variant files
# drop question marks entirely in places) -- not corrected here, since
# guessing where they belong isn't the same class of fix as an isolated
# single-character typo.
id: nativity-bvm-octave-day-4
source:
  la: "Sermo sancti Bernardi Abbatis."
  en: "Sermon of St. Bernard, Abbot"
text:
  la: |
    Sermo sancti Bernardi Abbatis. Sermo in cap. 12. Apocalypsis, ante medium. Novum fecit Dominus super terram, ut mulier circumdaret virum, nec alium quam Christum, de quo dicitur: Ecce vir, Oriens nomen ejus. Novum quoque fecit in cælo, ut mulier sole appareret amicta. Denique et coronavit eum, et vicissim ab eo meruit coronari. Egredimini filiæ Sion, et videte regem Salomonem in diademate, quo coronavit eum mater sua. Verum hoc alias. Interim sane ingredimini magis, et videte Reginam in diademate, quo coronavit eam filius suus. In capite, inquit, ejus corona stellarum duodecim.

    Dignum plane stellis coronari caput, quod et ipsis longe clarius micans, ornet eas potius quam ornetur ab eis. Quidni coronent sidera, quam sol vestit? Sicut dies verni, ait, circumdabant eam flores rosarum et lilia convallium. Nimirum læva sponsi sub capite ejus, et jam dextera illius amplexatur eam. Quis illas æstimet gemmas? Quis stellas nominet, quibus Mariæ regium diadema compactum est?

    Commemoratio pro Ss. Mart. Proto et Hyacintho. Protus et Hyacinthus fratres, beátæ Eugeniæ Vírginis eunuchi, una cum illa ab Héleno episcopo baptizati, ac stúdiis déditi divinárum litterárum, aliquámdiu in Ægypto inter ascetas mira humilitate et vitæ sanctitáte vixérunt. Sed póstea, sanctam Vírginem Eugeniam Romam prosecuti, Gallieno imperatóre, in Urbe propter christianæ fidei professiónem comprehénsi sunt. Aquibus cum nullo modo impetrari posset ut, christianam religiónem deseréntes, deos cólerent, acerbis verbéribus cæsi, secúri feriúntur tertio Idus Septembris.
  en: |
    From the Sermons of St. Bernard, Abbot (of Clairvaux) on Apoc. xii, I The Lord hath created a new thing in the earth, a woman shall compass a man. ~Jer. xxxi. 22. And this man is no other than Christ, of Whom it is said Behold the Man Whose name is The Dayspring Zech. vi. 12.  In heaven also hath the Lord created a new thing, a woman clothed with the sun. She also hath crowned Him and hath earned from Him a crown in return. Go forth, O ye daughters of Zion, and behold King Solomon with the crown wherewith his mother crowned him. Cant. iii. ii. And again go forth now, and behold the Queen with the crown wherewith her Son crowned her. And upon her head, saith St. John, a crown of twelve stars.

    What is an head worthy to be crowned with stars whose own glory is greater than theirs, and rather giveth than receiveth lustre from them. Why should not she have stars for her crown, who hath the sun for her clothing? And about her it was as the flower of roses in the spring of the year, and lilies of the valleys. Ecclus. 1, 8. The left hand of her Bridegroom is under her head, and his right hand doth embrace her. Cant. ii, 6 Who shall appraise these starry jewels whereof is made the Queenly crown of Mary?

    Commemoration for the holy Martyrs Protus and Hyacinth Protus and Hyacinth were brethren, eunuchs of the blessed Virgin Eugenia, and were baptized along with her by Bishop Helenus. They gave themselves to the study of God's Word, and dwelt for a while in wonderful lowliness and holiness of life in a monastery in Egypt. However, they afterwards followed the holy Virgin Eugenia to Rome, in the reign of the Emperor Gallienus, and were arrested in that city for professing the Christian faith. By no means could they be brought to leave the Christian religion and to worship the gods, and they were therefore severely scourged and beheaded, upon the 11th day of September.
responsory:
  la: |
    ℟. Hódie nata est beáta Virgo María ex progénie David; * Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo. ℣. Nativitátem beátæ Maríæ Vírginis cum gáudio celebrémus. ℟. Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo.
  en: |
    ℟. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. ℣. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. ℟. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
