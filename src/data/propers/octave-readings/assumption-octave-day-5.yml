# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-08-19). Matins reading for day 5 of the
# Assumption's own octave -- collapsed into one continuous reading per project
# convention. The source's own English translation is used as-is, including
# gaps in its own punctuation (some older "oct"/"bmv"-suffixed variant files
# drop question marks entirely in places) -- not corrected here, since
# guessing where they belong isn't the same class of fix as an isolated
# single-character typo.
#
# 2026-09-09: both `text.la` and `text.en` had the source citation baked
# into their opening words -- redundant with the `source` field above,
# which already renders as this reading's label. Stripped (kept the
# source's own "n. 1"/"n. 4" paragraph-number markers, which aren't
# citations; part of a repo-wide sweep of octave-readings files with the
# same pattern).
id: assumption-octave-day-5
source:
  la: "Sermo sancti Bernardi Abbátis"
  en: "Sermon of St. Bernard, Abbot"
text:
  la: |
    n. 1 Virgo, hódie gloriósa cælos ascendens, gaudiæ civium copiósis sine dúbio cumulávit augméntis. Hæc est enim, cujus salutatiónis vox et ipsos exsultáre facit in gáudio, quos matérna adhuc víscera claudunt. Quod, si párvuli necdum nati anima liquefácta est, ut María locúta est; quid putámus, quænam illa fúerit cæléstium exsultátio, cum et vocem audíre, et vidére fáciem, et beáta ejus frui præséntia meruérunt?

    n. 4 Sed et illud quis cogitáre sufficiát, quam gloriósa mundi Regína procésserit, et quanto devotiónis afféctu tota in ejus occursum cæléstium legiónum prodíerit multitúdo; quibus ad thronum glóriæ cánticis sit dedúcta; quam plácido vultu, quam seréna fácie, quam divínis ampléxibus suscépta a Fílio, et super omnem exaltáta creatúram, cum eo honóre, quo tanta Mater digna fuit, cum ea glória, quæ tantum décuit Fílium?

    Felicía prorsus óscula lábiis impressa lactentis, cui virgíneo Mater applaudébat in grémio. Verum numquid non felicióra censébimus, quæ ab ore sedéntis in déxtera Patris hódie in beáta salutatióne suscépit, cum ascénderet ad thronum glóriæ, epithalámium canens, et dicens: Osculétur me ósculo oris sui?  Christi generatiónem et Maríæ assumptiónem quis enarrábit? Quantum enim grátiæ in terris adépta est præ céteris, tantum et in cælis óbtinet glóriæ singuláris.
  en: |
    n. 1 When the glorious Virgin this day mounted upon the heavens, without doubt, she abundantly increased the joy of the citizens above. This same is she the voice of whose salutation maketh to leap with joy even such as are still shut up in their mothers' bellies. Luke i. 41, 44. If the soul of an unborn babe melted when Mary spake, what must we imagine to have been the jubilation of the heavenly ones, when it was their reward at once to hear her voice, and to see her face, and to enjoy her blessed presence.

    n. 4 But who also can picture to himself with what glory the Queen of the world went forth, and with what keen desire the whole multitude of the armies which are in heaven came out to meet her, with what hymns she was led to her throne of glory, with what a look of peace, with what a countenance of grace, with what Divine embraces her Son welcomed her, and set her above everything which God hath made? It was that be taken away from her honour of which such a Mother was worthy, and with that glory which beseemed such a Son.

    Sweet indeed were the kisses which the Suckling, Whom His Mother had praised while yet He lay hid in her virginal womb, pressed upon her lips. But shall we not believe that sweeter were those which she received from Him in blessed welcome, when He was sitting at the right hand of His Father, and she went up to the throne of His glory, singing the marriage-song and saying Let Him kiss me with the kisses of His mouth? Cant. i. 2. Who shall declare the generation of Christ or the Assumption of Mary So much as she found grace on earth more than others, so much more excellent than that of others is the glory which she hath in heaven.
responsory:
  la: |
    R. Vidi speciósam sicut colúmbam, ascendéntem désuper rivos aquárum, cujus inæstimábilis odor erat nimis in vestiméntis ejus; * Et sicut dies verni circúmdabant eam flores rosárum et lília convállium. V. Quæ est ista quæ ascéndit per desértum sicut vírgula fumi ex aromátibus myrrhæ et thuris? R. Et sicut dies verni circúmdabant eam flores rosárum et lília convállium.
  en: |
    R. I saw her, when, fair like a dove, she winged her flight above the rivers of waters. The priceless savour of her perfumes hung heavy in her garments. * And about her it was as the flower of roses in the spring of the year, and lilies of the valleys. V. Who is this that cometh out of the wilderness like a pillar of smoke, perfumed with myrrh and frankincense? R. And about her it was as the flower of roses in the spring of the year, and lilies of the valleys.
status:
  la: verified
  en: verified
