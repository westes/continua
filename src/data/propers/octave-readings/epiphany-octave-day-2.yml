# Sourced directly from the raw reference files (web/www/horas/Latin+English/Sancti/01-07.txt): the Epiphany octave's counted day 2 (Sundays not counted -- see OctaveConfig.skipsSunday). Lectio4-6 plus the Lectio7-9 continuation, bare Gospel incipit dropped, collapsed into one reading as every octave reading here is.
id: epiphany-octave-day-2
source:
  la: "Sermo sancti Augustíni Epíscopi; Homilía sancti Gregórii Papæ"
  en: "From the Sermons of St. Augustine, Bishop of Hippo; Homily by Pope St. Gregory the Great"
text:
  la: |
    Ad partum Vírginis adorándum Magi ab Oriénte venérunt. Hunc diem hódie celebrámus: huic debitum solemnitáti sermónem persolvimus. Illis dies iste primus illuxit, anniversaria nobis festivitate rediit. Illi erant primítiæ Géntium, nos pópulus Géntium. Nobis hoc lingua nuntiávit Apostolórum, stella illis tamquam lingua cælórum; et nobis iídem Apóstoli, tamquam alii cæli, enarravérunt glóriam Dei.

    Magnum sacraméntum: in præsepi jacebat, et Magos ab Oriénte ducebat. Abscondebátur in stábulo, et agnoscebátur in cælo: ut ágnitus in cælo manifestarétur in stábulo, et appellarétur Epiphanía dies iste, quod Latine manifestátio dici potest: simul ejus celsitúdinem humilitatémque commendans, ut qui in aperto cælo signis sidéreis monstrabátur magnus, in angusto diversorio quæsítus invenirétur inválidus, infantílibus in membris natus, infantilibúsque pannis involutus, adorarétur a Magis, timerétur a malis.

    Tímuit enim eum rex Herodes, eisdem sibi Magis nuntiántibus, cum adhuc quærerent párvulum, quem cognóverant cælo teste jam natum. Quid erit tribúnal judicántis, quando supérbos reges cunábula terrébant infantis? Quanto consultius reges, non sicut Heródes interfícere quærant, sed sicut Magi potius adorare delecténtur; jam præsertim eum, qui et ipsam mortem, quam cupiebat inimícus inférre, étiam pro ipsis inimícis ab inimícis sustinuit, eamque in suo corpore occisus occídit. Pie timeant reges ad Patris déxteram jam sedéntem, quem rex ímpius tímuit adhuc matris úbera lambéntem.

    Nativitáte Regis nostri cógnita, Heródes ad callida arguménta convértitur; et ne terreno regno privarétur, renuntiari sibi ubi puer inveniátur, postulat. Adorare eum velle se símulat, ut hunc, si inveníri possit, exstinguat. Sed quanta est humana malítia contra consílium divinitátis? Scriptum quippe est: Non est sapiéntia, non est prudéntia, non est consílium contra Dóminum. Nam ea, quæ appáruit stella, Magos perducit: natum Regem reperiunt, múnera déferunt: et ne redire ad Heródem debeant, in somnis admonéntur. Sicque fit, ut Jesum, quem quærit Heródes, inveníre non possit. Cujus persona qui alii, quam hypócritæ designántur, qui dum ficte quærunt, inveníre Dóminum numquam merentur?

    Sed inter hæc sciéndum, quod Priscilliánistæ hæretici nasci unumquemque hóminem sub constitutiónibus stellárum putant: et hoc in adjutórium sui erroris assumunt, quod nova stella éxiit cum Dóminus in carne appáruit; cujus fuísse fatum eamdem, quæ appáruit, stellam putant. Sed si Evangélii verba pensamus, quibus de eádem stella dícitur: Usque dum veniens staret supra, ubi erat puer: dum non puer ad stellam, sed stella ad púerum cucúrrit, si dici liceat, non stella fatum púeri, sed fatum stellæ is, qui appáruit puer fuit.

    Sed a fidelium córdibus absit, ut aliquid esse fatum dicant. Vitam quippe hóminum solus hic Cónditor, qui creávit, adminístrat. Neque enim propter stellas homo, sed stellæ propter hóminem factæ sunt: et si stella fatum hóminis dícitur, ipsis suis ministériis subesse homo perhibétur. Certe cum Jacob de útero egrédiens, prioris fratris plantam tenéret manu, prior perfecte nequáquam égredi pótuit, nisi súbsequens inchoasset: et tamen cum uno témpore, eodémque momento utrumque mater fúderit, non una utriusque vitæ qualitas fuit.
  en: |
    Wise men came from the East to worship the Virgin's Son. This is the event which we this day commemorate, the occasion in honour of which this sermon is preached. On them that day first broke in gladness, which year by year, now cometh round to us for celebration. They were the first-fruits of that Gentile Church whereof we are the in-gathering. To us the voice of Apostles, to them a star, as a voice from heaven, proclaimed the advent of a Saviour; and to us the voice of the Apostolic preachers is also as a voice from heaven, a heaven declaring the glory of God.

    Great is the mystery. While He lay in the manger, He drew to Himself wise men from the East; while He was unknown in the stable, He was recognised in the heavens; and, being recognised in the heavens, made Himself known in the stable. So this day is called in the Greek Epiphaneia, which is, being interpreted, Manifestation. Wherein is manifested both the greatness and the lowliness of Him, Whose greatness was attested in the stars of heaven, and Who, being sought on earth, is found so lowly that there is no room for Him in the inn. And yet, though to be found in fashion as a little Child wrapped in swaddlingclothes, He is the object of worship to the wise men and of terror to the godless.

    Nor Herod feared when he heard from the wise men of Him Whom they sought, and of Whose birth they knew by the witness of a star. What will be the fearful judgment-seat of Him, Who, even as a Suckling, struck terror into haughty kings? How much wiser is the thought of those kings who seek Christ like the wise men, to worship Him, than of those who seek Him, like Herod, to slay Him! who seek to put Him to that same death, which He came to suffer from His.enemies for their own salvation, and which, by His death, He hath trodden down! Kings will do well to fear Him Who now sitteth at the right hand of the Father, and Whom Herod feared when He hung upon His mother's breast.

    When Herod knew of the birth of our King, he betook himself to his cunning wiles, and lest he should be deprived of an earthly kingdom he desired the wise men to search diligently for the young Child, and when they had found Him, to bring him word again. He said, that he also might come and worship Him, but, in reality, that, when he had found Him, he might put Him to death. But, behold, of how light weight is the malice of man, when it is tried against the counsel of God. It is written There is no wisdom, nor understanding, nor counsel, against the Lord, (Prov. xxi. 30.) So the star which the wise men saw in the East, still led them on; they found the new-born King, and presented unto Him gifts; then they were warned in a dream that they should not return to Herod. And as it came to pass that, when Herod sought Jesus, he could not find Him even so is it with hypocrites, who, while they make pretence to seek the Lord to worship Him, find Him not.

    It is as well to know that it is one of the opinions of the Priscillianist heretics l that every man is born under the influence of a star; and, to confirm this notion, they bring forward the instance of the star of Bethlehem, which appeared when the Lord was born; and which they call His star, that is, the star ruling over His fate or destiny. But if we consider the words of the Gospel concerning this star, they are It went before, till it came and stood over where the young Child was. Whence we see that it was not the young Child Who followed the star, but the star which followed the young Child, as if to show that the young Child ruled the star, instead of the star ruling Him.

    But I pray that the hearts of the faithful may ever be free from the thought that anything ruleth their destiny. In this world there is but One Who ruleth the destiny of man, even He Who made man; neither was man made for the stars, but the stars for man; and if we say that they rule his destiny, we set them above him for whose service they were made. When Jacob came out of his mother's womb, and his hand took hold on his elder brother Esau's heel, he could not have done so unless this his first movement had been behind his brother, and, nevertheless, such was not in after life the position of those two brethren whom their mother brought forth at one birth.
responsory:
  la: |
    R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et habent in se divína mystéria: * In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram. V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris suis mýsticas ei múnerum spécies obtulérunt. R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram.
  en: |
    R. There are three precious gifts which the wise men offered unto the Lord on this day, and they speak a mystery of the things of God: * Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying. V. The wise men worshipped the Captain of our Salvation, as He lay in the manger, and when they had opened their treasures, they presented unto Him mystic gifts. R. Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying.
