# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-09-13). Matins reading for day 6 of the Nativity
# of the BVM's own octave -- collapsed into one continuous reading per project
# convention. The source's own English translation is used as-is, including
# gaps in its own punctuation (some older "oct"/"bmv"-suffixed variant files
# drop question marks entirely in places) -- not corrected here, since
# guessing where they belong isn't the same class of fix as an isolated
# single-character typo.
id: nativity-bvm-octave-day-6
source:
  la: "Ex libro sancti Epiphanii Epíscopi adversus hæreses"
  en: "From the book of St. Epiphanius, Bishop, Against Heresies"
text:
  la: |
    Ex libro sancti Epiphanii Epíscopi adversus hæreses Lib. 3. hæresi 78. post medium. Beata Mater Dei Maria per Hevam significatur, quæ per ænigma accepit, ut mater viventium vocetur. Illa etenim mater viventium vocata est, étiam postquam audivit: Terra es, et in terram reverteris, post transgressionem. Et mirum est, quod post transgressionem hoc magnum cognomen habuit. Et quod quidem pertinet ad rem sensibilem, ab illa Heva omnis hominum generatio deducta est in terra: hic autem vere a Maria hæc vita mundo genita est, ut viventem gigneret, et fieret Maria mater viventium. Per ænigma igitur Maria mater viventium appellata est.

    Hevæ datum est operire corpus sensibile propter nuditatem sensibilem: Mariæ vero datum est a Deo, ut pareret nobis Agnum et ovem, et ex gloria ipsius Agni et ovis fieret nobis velut a vellere in sapientia per virtutem ipsius indumentum incorruptibilitatis. Heva étiam mortis causa facta est hominibus: per ipsam enim mors ingressa est in mundum: Maria vero causa vitæ, per quam genita est nobis vita, et per hanc Filius Dei advenit in mundum: et ubi abundavit peccatum, ibi superabundavit et gratia: et unde illata est mors, illinc processit et vita, ut vita pro morte fieret: et qui per mulierem nobis vita factus est, mortem ex muliere inductam excluderet. Et quoniam illic Heva, cum adhuc esset virgo, per inobedientiam transgressa est: e contrario per Virginem obedientia gratiæ facta est, annuntiato adventu in carne de cælo, et vita æterna.

    De Maria accipitur (liceat mihi hoc dicere) quod scriptum est de Ecclesia: Relinquet homo patrem suum et matrem suam, et adhærebit uxori suæ: et erunt duo in carne una. Sanctus autem Apostolus dicit: Mysterium hoc magnum est, ego autem dico in Christo et Ecclesia. Et vide Scripturarum accuratam dicendi proprietatem, quod de Adam quidem dixit, formavit: de Heva vero non formatam esse, sed ædificatam. Accepit enim, inquit, unam de costis ejus, et ædificavit ipsi in uxorem. Quo ostendat, Dominum quidem de Maria efformasse sibi ipsi corpus, ab ipsa vero costa ædificatam esse Ecclesiam, in eo quod punctum et apertum est ipsius latus, et mysteria sanguinis et aquæ, pretia redemptionis facta sunt.
  en: |
    From the Book against heresies written by St. Epiphanius, Archbishop (of Salamis) Bk. iii, 78 Eve, who received the mystic title of Mother of all living Gen. iii. 20, was a type of Mary, the Blessed Mother of God. It was even after she had heard the words, Dust thou art, and unto dust shalt thou return, that Eve was called Mother of all living. And it is certainly strange that after the transgression she should receive this great title. In respect of carnal things all men upon the earth do indeed draw their genealogy from Eve, and in respect of spiritual things life was born upon the earth from Mary, who gave birth to Him That liveth, and so becometh Mother of all that live by Him. And so Mary hath a mystic right to the title of Mother of all living.

    Unto Eve was given a coat of skins to clothe the natural body withal when she knew that she was naked, Gen. iii. 21, but unto Mary it was given to bring forth for us a Lamb with Whose glorious fleece (of merits) we may through wisdom be clothed in a robe of immortality. Eve was a cause of death to all men, for by her, death entered into the world; but Mary is a cause of life whereby life is sprung up for us all, since through her the Son of God entered into the world. ' ' Where sin abounded, grace did much more abound. Rom. v, 20 Whence death was brought in, thence hath life also come forth, that life may take the place of death, and He Who by a woman hath become life unto us may put away the death which was invented by a woman. On the one hand Eve, being still a virgin, transgressed by disobedience; on the other hand, by a virgin came the obedience of grace, the announcement of Him Who came from heaven and took flesh, and life everlasting.

    We may be permitted to say so, the following words, written of the Church, may be taken of Mary Therefore shall a man leave his father and his mother, and shall cleave unto his wife; and they shall be one flesh. Gen. ii. 24. The holy Apostle saith This is a great mystery, but I speak concerning Christ and the Church. Eph. v. 32. See the scrupulous accuracy of the Scriptural language. Concerning Adam it is said that God formed him, but concerning Eve that He builded her. And the rib which the Lord God had taken from man, builded He into a woman. Gen. ii, 22 Hereby is shown that the Lord formed unto Himself a Body out of Mary, but that out of His Rib He builded up the Church, namely, when His Side was pierced and opened, and the mystic streams of Blood and Water flowed for the remission of sin.
responsory:
  la: |
    ℟. Hódie nata est beáta Virgo María ex progénie David; * Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo. ℣. Nativitátem beátæ Maríæ Vírginis cum gáudio celebrémus. ℟. Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo.
  en: |
    ℟. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. ℣. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. ℟. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
