# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-08-11). Matins reading for day 2 of St. Lawrence's
# own octave -- the historical 3 Lectios of this lesser-rank office are
# collapsed into one continuous reading per project convention, not kept
# broken up. Responsory: the first responsory following the lessons, its own
# fixed formulaic preamble ("Tu autem, Domine...") stripped -- the same
# responsory text is reused verbatim across this whole octave, matching St.
# Lawrence's own Lauds antiphon (propers/common/st-lawrence-antiphon.yml).
# English "I belive"/"lam come" corrected as clear transcription typos in the
# source, same judgment call as st-zephyrinus-collect.yml earlier this pull.
# The source's own English translation is used as-is, including gaps in its
# own punctuation (some older "oct"/"bmv"-suffixed variant files drop question
# marks entirely in places) -- not corrected here, since guessing where they
# belong isn't the same class of fix as an isolated single-character typo.
#
# 2026-09-09: both `text.la` and `text.en` had the source citation baked
# into their opening words, redundant with the `source` field above.
# Stripped (part of a repo-wide sweep of octave-readings files with the
# same pattern).
id: st-lawrence-octave-day-2
source:
  la: "Sermo sancti Augustíni Epíscopi."
  en: "Sermon of St. Augustine, Bishop"
text:
  la: |
    Beatissimi Laurentii Martyris, cujus natalem hodie celebramus, passionem nosse vos credo: et quanta in persecutione pertulerit, dilectionem vestram scire posse non dubito. Tanta enim ejus martyrii gloria exstitit, ut passione sua mundum illuminaverit universum. Illuminavit mundum plane Laurentius eo lumine, quo ipse accensus est, et flammis quas ipse pertulit, omnium Christianorum corda calefecit.

    Quis nolit ad horam uri Laurentii igne, ut æternum gehennæ non patiatur incendium? Beati igitur Laurentii exemplo provocamur ad martyrium, et accendimur ad fidem, incalescimus ad devotionem: et si in nobis persecutoris flamma deest, fidei tamen flamma non deest. Non ardemus quidem corpore pro Christo, sed ardemus affectu: non subjicit mihi persecutor ignem: sed suggerit mihi ignem desiderium Salvatoris.

    Esse autem Salvatoris ignem legimus in Evangelio, dicente eodem Domino: Nescitis quia veni ignem mittere in terram? Et quid volo, nisi ut accendatur? Quo igne succensi illi duo discipuli dixerunt: Nonne cor nostrum ardens erat in nobis, dum loqueretur in via, et aperiret nobis Scripturas? Hoc igitur igne beatus Laurentius accensus, flammarum non sentit incendium: et dum Christi ardet desiderio, persecutoris pœnam non sentit.
  en: |
    I believe that ye know the history of the sufferings of that most blessed Martyr, Lawrence, whose birth-day we are keeping this day, and I doubt not, my beloved brethren, but that ye may know what agonies he endured under the persecutors. So illustrious is the glory of his martyrdom, that the splendour thereof shineth throughout the whole world. And this light, which Lawrence maketh so clearly to shine throughout the world, is the light of the fire wherewith he himself was enkindled. By the flames which he endured, he hath made hot every Christian heart.

    Who is there but knoweth how that Lawrence chose rather to burn in earthly flames for a while, than to suffer the eternal fire of hell? The example, therefore, of blessed Lawrence provoketh us to lift up our testimony, kindleth our faith, and setteth our love all a-glow. If for us there are now no fires of persecution, the flame of faith is not therefore quenched. We give not our bodies to be burned for Christ's sake, but our hearts burn with His love. The persecutor stirreth up no fire around me, but a fire is stirred up in me by the longing for the presence of my Saviour.

    But that the Saviour hath a fire of His own we read in the Gospel, where the Lord saith I am come to send fire on the earth, and what will I but that it be kindled? Luke xii. 49. It was this fire which had been enkindled in the two disciples when they said Did not our heart burn within us, while He talked with us by the way, and while He opened to us the Scriptures? Luke xxiv. 32. It was because this fire had been enkindled within him that the blessed Lawrence felt not the burning of the flames, and through eager yearning for the sight of Christ perceived not the cruelty of his persecutor.
responsory:
  la: |
    R. Levíta Lauréntius bonum opus operátus est, qui per signum crucis cæcos illuminávit, * Et thesáuros Ecclésiæ dedit paupéribus. V. Dispérsit, dedit paupéribus: justítia ejus manet in sǽculum sǽculi. R. Et thesáuros Ecclésiæ dedit paupéribus.
  en: |
    R. The Levite Lawrence wrought a good work, in that with the sign of the Cross he gave sight to the blind, * And dispersed among the needy the riches of the Church. V. He hath dispersed, he hath given to the poor his righteousness endureth forever. R. And dispersed among the needy the riches of the Church.
status:
  la: verified
  en: verified
