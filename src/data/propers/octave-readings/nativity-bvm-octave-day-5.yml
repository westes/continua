# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-09-12). Matins reading for day 5 of the Nativity
# of the BVM's own octave -- collapsed into one continuous reading per project
# convention. No English translation exists in the source at all for this
# reading; since it's prose, this English is a translation done for this
# project rather than left missing (2026-08 decision) -- draft, not verified
# against any source. The source's own English translation is used as-is,
# including gaps in its own punctuation (some older "oct"/"bmv"-suffixed
# variant files drop question marks entirely in places) -- not corrected here,
# since guessing where they belong isn't the same class of fix as an isolated
# single-character typo.
id: nativity-bvm-octave-day-5
source: "Sermo Sancti Joánnis Chrysóstomi."
text:
  la: |
    Sermo Sancti Joánnis Chrysóstomi. Apud Metaphrast. Dei Fílius non díuitem, aut locuplétem áliquam féminam sibi matrem elégit, sed beátam vírginem illa, cujus ánima virtútibus ornáta erat. Cum enim beáta María supra omnem humánam natúram castitátem seruáret, proptérea Christum Dóminum in ventre concépit. Ad hanc ígitur sanctíssimam vírginem et Dei matrem accurréntes, ejus patrocíniis utilitátem assequámur. Ítaque quacúmque estis vírgines, ad matrem Dómini confúgite. Illa enim pulchérrimam, pretiosíssimam, et incorruptíbilem possessiónem patrocínio suo vobis conservábit.

    Magnum reuéra miráculum, fratres dilectíssimi, fuit beáta semper virgo María. Quid namque illa majus aut illústrius ullo umquam témpore inuéntum est, seu aliquándo inveníri póterit? Hæc sola cælum ac terram amplitúdine superávit. Quidnam illa sánctius? Non Prophétæ, non Apóstoli, non Mártyres, non Patriárchæ, non Ángeli, non Throni, non Dominatiónes, no Séraphim, non Chérubim, non dénique áliud quídpiam inter creátas res visíbiles aut inuisíbiles, majus aut excelléntius inveníri potest. Eadem ancílla Dei est et mater: éadem virgo et génitrix.

    Hac ejus mater est, qui a Patre ante omne princípium génitus suit, que Ángeli et hómines agnóscunt Dóminum rerum ómnium. Vis ne cognóscere, quanto virgo hæc præstántior fit cæléstibus poténtis? Illæ cum timóre et tremóre assistunt, fáciem velántes suam: hæc humánum genus illi offert quem génuit. Per hanc et peccatórum véniam conséquimur. Ave ígitur mater, cælum, puélla, virgo, thronus, Ecclésiæ nostræ decus, glória et firmaméntum, assídue pro nobis precáre Jesum fílium tuum et Dóminum nostrum: ut per te misericórdiam inveníre in die judícij, et quæ repósita sunt iis qui díligunt Deum, bona cónsequi possímus, grátia et benignitáte Dómini nostri Jesu Christi: cum quo Patri simul et sancto Spirítui glória, honor, et impérium nunc et semper in sǽcula sæculórum, Amen.
  en: |
    The Son of God chose for his mother not some rich or wealthy woman, but that blessed virgin whose soul was adorned with virtues. For because blessed Mary kept a chastity beyond all human nature, therefore she conceived Christ the Lord in her womb. Let us, then, hasten to this most holy Virgin and Mother of God, and obtain profit from her patronage. And so, whoever you are, O virgins, take refuge in the Mother of the Lord; for she will preserve for you, by her patronage, a most beautiful, most precious, and incorruptible possession.

    Truly a great miracle, most beloved brethren, was the ever-blessed Virgin Mary. For what greater or more illustrious thing has ever been found at any time, or could ever be found? She alone has surpassed heaven and earth in greatness. What could be found holier than she? Not the Prophets, not the Apostles, not the Martyrs, not the Patriarchs, not the Angels, not the Thrones, not the Dominations, not the Seraphim, not the Cherubim -- indeed, nothing else among created things, visible or invisible, can be found greater or more excellent. She is at once the handmaid of God and his Mother; at once a virgin and a mother.

    She is the Mother of him who was begotten of the Father before all beginning, whom Angels and men acknowledge as the Lord of all things. Would you know how far this Virgin surpasses the heavenly powers in excellence? They stand by with fear and trembling, veiling their faces; but she offers to him whom she bore the whole human race. Through her also we obtain the forgiveness of sins. Hail, then, O Mother, O heaven, O maiden, O virgin, O throne, the glory, honour, and strength of our Church: pray unceasingly for us to Jesus, thy Son and our Lord, that through thee we may find mercy on the day of judgment, and may attain to those good things which are laid up for them that love God, by the grace and loving-kindness of our Lord Jesus Christ; with whom, together with the Father and the Holy Spirit, be glory, honour, and dominion, now and for ever, world without end. Amen.
responsory:
  la: |
    ℟. Hódie nata est beáta Virgo María ex progénie David; * Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo. ℣. Nativitátem beátæ Maríæ Vírginis cum gáudio celebrémus. ℟. Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo.
  en: |
    ℟. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. ℣. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. ℟. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
status:
  la: verified
