# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Tempora/Pasc3-2.txt) -- day 7 of the Patronage of St. Joseph's own
# movable octave (Tuesday). Joins the continuation of St. Bernard's
# "Super Missus Est" homily (Lectio4-6, Joseph's own reasoning for
# wishing to put Mary away privily) with St. John Damascene's homily on
# the two genealogies (Lectio7-9, same Gospel pericope as the feast day;
# bare incipit dropped). Responsory now sourced -- same resolution as
# day 2: reuse the feast's own well-known Responsory1 (Tempora/
# Pasc2-3.txt, the feast day itself) across every combined-lesson octave
# day.
id: patronage-of-st-joseph-octave-day-7
source:
  la: "Sermo sancti Bernárdi Abbátis; Homilía sancti Joánnis Damascéni"
  en: "Sermon of St. Bernard, Abbot; Homily of St. John Damascene"
text:
  la: |
    Scriptum est: Joseph autem vir ejus, cum esset justus et nollet eam tradúcere, vóluit occúlte dimíttere eam. Bene, cum esset justus, nóluit eam tradúcere; quia, sicut nequáquam justus esset, si cógnitam ream consensísset; sic nihilóminus justus non esset, si probátam innóxiam condemnásset. Cum ergo justus esset et nollet eam tradúcere, vóluit occúlte dimíttere eam. Quare vóluit dimíttere? Accipe et in hoc, non meam, sed Patrum senténtiam. Propter hoc Joseph vóluit dimíttere eam, propter quod et Petrus Dóminum a se repellébat, dicens: Exi a me, Dómine, quia homo peccátor sum; propter quod et centúrio a domo sua eum prohibébat, cum díceret: Dómine, non sum dignus, ut intres sub tectum meum.

    Ita ergo et Joseph, indígnum et peccatórem se réputans, dicébat intra se, a tali et tanta non debére sibi ultra familiáre præstári contubérnium, cujus supra se mirábilem expavescébat dignitátem. Vidébat et horrébat divínæ præséntiæ certíssimum gestántem insígne; et quia mystérium penetráre non póterat, volébat dimíttere eam. Expávit Petrus poténtiæ magnitúdinem: expávit centúrio præséntiæ majestátem: exhórruit nimírum et Joseph, sicut homo, hujus tanti miráculi novitátem. Miráris quod Joseph prægnántis se consórtio Vírginis judicábat indígnum, cum áudias et sanctam Elísabeth ejus non posse ferre præséntiam, nisi cum tremóre quidem et reveréntia? Ait namque: Unde hoc mihi, ut véniat Mater Dómini mei ad me?

    Ideo ítaque Joseph vóluit dimíttere eam. Sed quare occúlte, et non palam? Ne vidélicet divórtii causa inquirerétur, exigerétur rátio. Quid enim vir justus respónderet pópulo duræ cervícis, pópulo non credénti et contradicénti? Si díceret quod sentiébat, quod de illíus puritáte comprobáverat, nonne mox incréduli et crudéles Judæi subsannárent illum, lapidárent illam? Quómodo namque Veritáti créderent tacénti in útero, quam póstea contempsérunt clamántem in templo? quid fácerent necdum apparénti, cui póstmodum ímpias manus injecérunt étiam miráculis coruscánti? Mérito ergo Vir justus, ne aut mentíri aut diffamáre cogerétur innóxiam, vóluit occúlte dimíttere eam.

    Matthæus opus suum ínchoans, Liber generatiónis, inquit, Jesu Christi fílii David, fílii Abraham: verum hic non subsístit; étenim ipsíus sermo étiam usque ad Vírginis Sponsum progréssus est. Lucas autem post Salvatóris in baptísmo declaratiónem, oratiónem suam non nihil derívans, ad hunc modum scribit: Ipse Jesus erat incípiens quasi annórum trigínta, ut putabátur, fílius Joseph, qui fuit Heli, qui fuit Mathat; et sic deínceps in altum ascendéndo usque ad Seth, qui fuit Adæ, qui fuit Dei. Proínde cum Joséphi genus ad hunc modum recenseátur, certe Virgo quoque ipsa ac Dei Génitrix María ejúsdem cum eo tribus esse simul demonstrátur. Síquidem Móysis lege non licébat ulli tríbui cum áltera tribu permiscéri, ne géneris heréditas ab una tribu ad áliam laberétur.

    Non abs re Christi ex Spíritu Sancto natívitas apud vulgus silebátur, ac Joseph loco patris assumebátur; atque inde, ut vero consentáneum est, tamquam Púeri pater recensebátur. Nam, nisi hoc exstitísset, patre carére Puer existimátus fuísset, quod a patérno látere genus ipsíus mínime recenserétur. Quam ob rem ab exímiis Evangelístis necessário tunc factum est, ut Joséphi genus recensérent. Nam si, hoc prætermísso, a matérno látere géneris ipsíus sériem texuíssent, prætérquam quod istud indecórum fuísset, a divinárum quoque Scripturárum consuetúdine abhorruísset. Cómmode ígitur Joséphi genus a Davíde, ob eam quam attúlimus causam, ducéntes, simul quoque Vírginem Maríam ex Davíde ortam esse confírmant, per Sponsum scílicet uxóris genus una inferéntes.

    Quod quidem justítia præditus Joseph esset, ac vitam legi consentáneam dúceret, némini obscúrum est. Ex legis porro præscrípto vivens, profécto non aliúnde quam ex sua tribu ortam uxórem despondébat. Quocírca, si Joseph ex tribu Juda atque ex Davídis sorte ac família erat, an non consentáneum est Maríam quoque ab iísdem proficísci? Ex quo factum est, ut Sponsi genus recenserétur. Nam, cum de Apóstoli senténtia caput mulíeris vir sit; quid tandem afférri potest, quin, cum cápitis genus recensétur, corpus quoque una cum cápite recenséri consequátur? Maniféste ígitur osténsum esse árbitror, Joséphi genus apud Evangelístas non frustra recenséri, ex quo necessário Virgo quoque a Davíde oriúnda esse per consecutiónem intellígitur, et qui præcellénti miráculo ex ipsa génitus est Christus, ante sæcula Dei Fílius.
  en: |
    It is written: "Joseph, her husband, being a just man, and not willing to make her a public example, was minded to put her away privily." Being a just man, he was rightly unwilling to expose her — for as he would not have been a just man had he connived at known guilt, so he would have been no less unjust had he condemned proven innocence. Being a just man, therefore, and not willing to make her a public example, he was minded to put her away privily. Why did he wish to put her away? On this hear, not my opinion, but that of the Fathers. Joseph wished to put her away for the same reason that made Peter seek to put away the Lord, when he said: "Depart from me, for I am a sinful man, O Lord"; and that made the centurion also seek to keep the Lord away from his house, when he said: "Lord, I am not worthy that Thou shouldst come under my roof."

    In like manner Joseph, holding himself unworthy and sinful, said within himself that he ought no longer to enjoy the familiar companionship of one whose marvellous dignity, above his own, filled him with awe. He saw and trembled at the sure sign of the divine presence, and, since he could not fathom the mystery, he wished to put her away. Peter trembled at the greatness of that power; the centurion trembled at the majesty of that presence; Joseph too, being but a man, was filled with awe at the strangeness of this great mystery. Dost thou wonder that Joseph judged himself unworthy of the companionship of this pregnant Virgin, when thou hearest that even holy Elizabeth could not bear her presence save with trembling and reverence? For she said: "Whence is this to me, that the Mother of my Lord should come to me?"

    And so Joseph was minded to put her away. But why privily, and not publicly? Lest, that is, enquiry should be made about this separation, and a reason demanded. What should a just man reply to a stiff-necked people, a faithless and gainsaying people? If he had said what he thought, what he had proved concerning her purity, would not the unbelieving and cruel Jews soon have mocked him, and stoned her? For how would they have believed in the Truth lying silent in her womb, whom afterward they despised as He cried aloud in the temple? What would they have done to Him before He had yet appeared, who afterward laid impious hands even on Him Who shone with miracles? Rightly, then, did the just man, lest he be forced either to lie or to defame the innocent, wish to put her away privily.

    Matthew, beginning his Gospel, saith: "The book of the generation of Jesus Christ, the Son of David, the Son of Abraham" — but he doth not stop there; his own account proceedeth even to the Virgin's Spouse. Luke, however, after the declaration of the Saviour at His baptism, turneth his account somewhat aside, and writeth thus: "Jesus Himself began to be about thirty years of age, being, as was supposed, the son of Joseph, which was the son of Heli, which was the son of Matthat" — and so on, ascending upward even to Seth, "which was the son of Adam, which was the son of God." Since, then, Joseph's lineage is thus reckoned, it is shown at the same time that the Virgin herself, the Mother of God, Mary, was of the same tribe as he. For by the Law of Moses it was not lawful for any tribe to intermarry with another tribe, lest the hereditary right of one tribe should pass into another.

    Not without reason was the birth of Christ by the Holy Ghost kept from common knowledge, and Joseph taken in the place of a father, and thence, as was indeed fitting, reckoned as the Child's father. For had this not been so, the Child would have been thought fatherless, since His lineage would not have been reckoned from the father's side at all. Wherefore it was of necessity that the excellent Evangelists should reckon Joseph's lineage. For had they, passing this over, woven the line of His descent from the mother's side, that would have been unseemly, besides being contrary to the custom of the divine Scriptures. Fittingly, then, tracing Joseph's lineage from David for the reason we have given, they at the same time confirm that the Virgin Mary too sprang from David, inferring the wife's lineage together through the husband.

    That Joseph was endowed with righteousness, and led a life conformable to the Law, is plain to all. Living, moreover, by the precept of the Law, he assuredly betrothed a wife sprung from no other than his own tribe. Wherefore, if Joseph was of the tribe of Judah and of the lot and family of David, is it not fitting that Mary too should proceed from the same? Whence it came about that the Spouse's lineage was recorded. For, since by the Apostle's own word the head of the woman is the man, what can be said against this: that when the lineage of the head is recorded, the body too is recorded together with the head? I judge, then, that it hath been plainly shown that the Evangelists did not record Joseph's lineage in vain, from which it is necessarily understood that the Virgin too descended from David by consequence, and that Christ, Who was born of her by a surpassing miracle, was, before all ages, the Son of God.
responsory:
  la: |
    R. Clamávit pópulus ad regem, aliménta petens: * Quibus ille respóndit: Ite ad Joseph, allelúja. V. Salus nostra in manu tua est: réspice nos tantum, et læti serviémus regi. R. Quibus ille respóndit: Ite ad Joseph, allelúja.
  en: |
    R. The people cried to Pharaoh for bread * And he answered them Go unto Joseph. Alleluia. V. The saving of our lives is in thy hand; only let us find grace in thy sight, and we will gladly be Pharaoh's servants. R. And he answered them Go unto Joseph. Alleluia.
