id: corpus-christi-octave-day-3
source:
  la: "Sermo sancti Joánnis Chrysóstomi; Homilía sancti Augustíni Epíscopi"
  en: "Sermon of St. John Chrysostom; Homily of St. Augustine, Bishop"
text:
  la: |
    Necessárium est, dilectíssimi, mysteriórum díscere miráculum, quodnam sit, et quare sit datum, et quæ ejus rei utílitas. Unum corpus effícimur: membra, inquit, ex carne ejus et ex óssibus ejus. Sequámur autem initiáti, quæ dicúntur. Ut ítaque non tantum per caritátem hoc fiámus, verum étiam ipsa re, in illam misceámur carnem: hoc namque per escam effícitur, quam largítus est nobis volens osténdere desidérium quod erga nos habet. Proptérea semetípsum nobis immíscuit, et corpus suum in nos contemperávit, ut unum quid simus tamquam corpus cápiti coaptátum; ardénter enim amántium hoc est.

    Tamquam leónes ígitur ignem spirántes ab illa mensa recedámus, facti diábolo terríbiles, et caput nostrum mente revolvéntes, et caritátem quam erga nos osténdit. Nam paréntes quidem áliis sæpe fílios tradunt aléndos: ego autem, inquit, non ita, sed cárnibus meis alo, et meípsum vobis appóno, vos omnes generósos esse volens, et spem bonam de futúris vobis præbens: quippe qui vobis hic meípsum trádidi, multo magis id in futúro fáciam. Vólui frater vester fíeri, carni propter vos et sánguini communicávi: vobis vicíssim ipsam carnem et sánguinem, per quæ cognátus vester factus sum, trado.

    Attendámus ítaque nobis ipsis, dilectíssimi, tálibus fruéntes bonis: et, cum áliquid turpe dícere voluérimus, vel nos ab ira córripi vidérimus, vel álio quópiam hujúsmodi vítio, considerémus quibus facti sumus digni; talíque cogitátio nobis irrationabílium mótuum sit corréctio. Quotquot ígitur hujus partícipes córporis effícimur, quotquot sánguinem degustámus; cogitémus quod illum sursum sedéntem, qui ab Angelis adorátur incorruptíbili vicínus virtúti, hunc degustámus. Hei mihi, quot ad salútem nobis viæ! Nos corpus suum effécit; nobis suum communicávit corpus: et horum nos nihil a malis avértit.

    Díximus, fratres, hoc Dóminum commendásse in manducatióne carnis suæ et potatióne sánguinis sui, ut in illo maneámus, et ipse in nobis. Manémus autem in illo, cum sumus membra ejus; manet autem ipse in nobis, cum sumus templum ejus. Ut autem simus membra ejus, únitas nos compáginat: ut compáginet únitas, quæ facit, nisi cáritas? Et cáritas Dei unde? Apóstolum intérroga. Cáritas, inquit, Dei diffúsa est in córdibus nostris per Spíritum Sanctum, qui datus est nobis.

    Ergo spíritus est qui vivíficat; spíritus enim facit viva membra: nec viva membra spíritus facit, nisi quæ in córpore, quod végetat ipse spíritus, invénerit. Nam spíritus, qui est in te, o homo, quo constas ut homo sis, numquid vivíficat membrum quod separátum invénerit a carne tua? Spíritum tuum dico ánimam tuam. Anima tua non vivíficat, nisi membra quæ sunt in carne tua: unum si tollas, jam non vivificátur ex ánima tua, quia unitáti córporis tui non copulátur.

    Hæc dicúntur, ut amémus unitátem et timeámus separatiónem. Nihil enim sic debet formidáre Christiánus quam separári a córpore Christi. Si enim separátur a córpore Christi, non est membrum ejus, non vegetátur Spíritu ejus. Quisquis autem, inquit Apóstolus, Spíritum Christi non habet, hic non est ejus. Spíritus ergo est, qui vivíficat, caro autem non prodest quidquam. Verba, quæ ego locútus sum vobis, spíritus et vita sunt. Quid est, Spíritus et vita sunt? Spiritáliter intelligénda sunt. Intellexísti spiritáliter? Spíritus et vita sunt. Intellexísti carnáliter? Etiam sic illa spíritus et vita sunt, sed tibi non sunt.
  en: |
    Dearly beloved brethren, it behoveth us to learn the miracle of the Mysteries: what the Gift is, and why It was given, and what is the use thereof. "We, being many, are one body," and again, "We are members of His Body, of His Flesh, and of His Bones." Only the initiated will now understand what I say. That this union may take place, not by love only, but verily and indeed, we ought to mingle our own flesh with His. And this is done by eating that Food Which He hath given unto us, being fain to manifest that exceeding great love which He beareth to us-ward. To this end He hath mingled Himself with us, and infused His Body into our bodies, that we may be one together, like as the limbs of a man and his head are all of one body. Such union do they long for that love much.

    When we come back from that Table we ought to be like so many lions breathing fire, dreadful to the devil, our thoughts concentrated on our Great Head and the love which He showeth us. Many fathers and mothers there are who give their children to others to nurse, but I, saith the Lord to His children, I am not so, but I feed you with Mine Own Flesh, and join Myself to you, fain that ye all should be sons of noble blood, and giving you a noble hope of that which ye shall be hereafter. I was content to become your Brother; I for your sakes have taken unto Me Flesh and Blood; and that Flesh and Blood wherein I am become your Brother, the same give I in turn unto you.

    Let us then, dearly beloved brethren, take good heed to ourselves, as unto the holders of so great mercies; and when any foul word springeth to our lips, or we feel anger taking possession of us, or the sting of any other sinful passion, let us call to mind of what we have been counted worthy, and let that remembrance still the unruly motion. As often as we take that Body, as often as we taste that Blood, let us think how that we feed on Him Who is sitting on high, adored of Angels, at the right hand of the Eternal Power. Ah me, how many a way is open to us whereby we may be saved! He hath made us His Own; He hath given His Body to us; and yet none of this turns us away from evil.

    I have said, my brethren, that what the Lord hath set before us, in eating of His Flesh and drinking of His Blood, is that we should dwell in Him, and He in us. We dwell in Him when we are His members, and He dwelleth in us when we are His temple. But the bond whereby we are made His members is oneness; and what is the cause of oneness but love? And love of God, whence is it? Ask the Apostle. "The love of God," saith he, "is shed abroad in our hearts by the Holy Ghost, Which is given unto us."

    So it is the spirit that quickeneth. It is the spirit that maketh lively the limbs, nor is the quickening power of the spirit shed through any limbs but such as remain in union with the body whose the spirit is. The spirit that thou hast in thee, O man, and whereby thou art a man — doth that spirit shed life through any limb cut off from thy flesh? By "spirit," I mean thy soul. The soul quickeneth no limb but such as remain attached to the body. Cut one off, and the soul quickeneth it no more, for it is separate from the oneness of thy body.

    These things I say, that we may love oneness and dread division. In sooth, there is nothing which a Christian ought so much to dread, as to be cut off from the Body of Christ. If he be cut off from the Body of Christ, he is no longer a member of Christ, and the Spirit of Christ no longer quickeneth him. "Now, if any man," saith the Apostle, "have not the Spirit of Christ, he is none of His." It is the Spirit that quickeneth, the flesh profiteth nothing: "the words that I speak unto you, they are spirit and they are life." What meaneth this, "spirit and life"? It is to be taken spiritually. Hast thou taken it spiritually? Then the words the Lord spake, unto thee they are spirit and life. Hast thou taken it carnally? Then the words of the Lord are still indeed spirit and life — but not for thee.
