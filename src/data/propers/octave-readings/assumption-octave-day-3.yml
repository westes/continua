id: assumption-octave-day-3
source:
  la: "Sermo sancti Joannis Damasceni"
  en: "Sermon of St. John Damascene"
text:
  la: |
    Jubilémus in arca Dómini Dei toto ánimo, et muri cadent Jerichuntíni, contrariárum, inquam, potestátum inféstæ munitiónes. Cum David exsultémus spíritu: Arca enim Dómini hódie requiévit. Clamémus cum Gabriéle, qui primum locum óbtinet inter Angelos: Ave, grátia plena; Dóminus tecum. Ave, gáudii pélagus inexháustum: ave, únicum molestiárum levámen: ave, ómnium cordis dolórum medicaméntum. Ave, sancta Virgo, per quam mors quidem fuit expúlsa, vita autem introdúcta.

    Tu vero, o sacrórum sepulcrórum sacratíssimum post Dómini quidem sepúlcrum, quod vitæ dedit princípium, quod fuit fons resurrectiónis (tecum enim loquar, tamquam cum animáto): úbinam est aurum illud purum, quod manus Apostolórum in te condidérunt? Ubi divítiæ, quæ consúmi néqueunt? Ubi pretiósus ille thesáurus, qui vitam suscépit? Ubi novum volúmen, in quo ineffabíliter Dei Verbum sine manu inscríptum fuit? Ubi abýssus grátiæ, ubi pélagus curatiónum? Ubi est desiderábile illud Deíparæ Vírginis corpus?

    Quid quǽritis in sepúlcro eam, quæ ad cæléstia transláta est tabernácula? Cur a me custódiæ ratiónem expóscitis? Non possum ego divínis jussis resístere. Sacrosánctum illud corpus, quod mihi quoque sanctitátem impertívit, ac pretiosíssimi unguénti fragrántia me replévit, et divínum templum effécit, relíctis sindónibus, ábiit raptum sublíme, comitántibus Angelis, Archángelis et ómnibus cæléstibus poténtiis. Nunc me circúmdant Angeli, nunc divína in me hábitat grátia. Ego evási officína medicínæ ægrotántibus: ego fons perénnis curatiónum: ego remédium advérsus dæmones: ego cívitas refúgii ómnibus ad me confugiéntibus.
  en: |
    Let us rejoice with all our heart before the ark of the Lord God, and the walls of Jericho shall fall — I mean the hostile fortifications of the opposing powers. Let us exult in spirit with David: for the Ark of the Lord hath this day found her rest. Let us cry out with Gabriel, who holds the first place among the Angels: Hail, full of grace; the Lord is with thee. Hail, thou unfailing sea of joy: hail, thou sole relief of every affliction: hail, thou remedy for every sorrow of the heart. Hail, holy Virgin, through whom death indeed was driven out, and life brought in.

    But thou, O most holy of sacred sepulchres, second only to the sepulchre of the Lord — which gave life its beginning, which was the fountain of the resurrection (for I will speak to thee as to one who lives): where now is that pure gold which the hands of the Apostles laid up within thee? Where are those riches that can never be spent? Where is that precious treasure which received Life itself? Where is the new scroll, on which the Word of God was ineffably inscribed without hand of man? Where is the abyss of grace, where the sea of healing? Where is that most desirable body of the Virgin, the Mother of God?

    Why do you seek in the tomb her who has been taken up into the heavenly tabernacles? Why do you demand of me an account of my keeping? I cannot resist the divine commands. That most sacred body, which imparted holiness even to me, and filled me with the fragrance of a most precious ointment, and made me a temple of God, left behind its winding-cloths and was borne away on high, with Angels, Archangels, and all the heavenly Powers attending it. Now Angels surround me; now divine grace dwells within me. I have become a workshop of healing for the sick: I am a perennial fountain of cures: I am a remedy against demons: I am a city of refuge for all who flee to me.
responsory:
  la: |
    R. Vidi speciósam sicut colúmbam, ascendéntem désuper rivos aquárum, cujus inæstimábilis odor erat nimis in vestiméntis ejus; * Et sicut dies verni circúmdabant eam flores rosárum et lília convállium. V. Quæ est ista quæ ascéndit per desértum sicut vírgula fumi ex aromátibus myrrhæ et thuris? R. Et sicut dies verni circúmdabant eam flores rosárum et lília convállium.
  en: |
    R. I saw her, when, fair like a dove, she winged her flight above the rivers of waters. The priceless savour of her perfumes hung heavy in her garments. * And about her it was as the flower of roses in the spring of the year, and lilies of the valleys. V. Who is this that cometh out of the wilderness like a pillar of smoke, perfumed with myrrh and frankincense? R. And about her it was as the flower of roses in the spring of the year, and lilies of the valleys.
status:
  la: verified
  en: draft
