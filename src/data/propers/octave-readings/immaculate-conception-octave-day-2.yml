# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Sancti/12-09bmv.txt), not the live prayMatutinum query -- that query,
# scoped to "Monastic Tridentinum 1617," doesn't select this content at all
# (the Immaculate Conception wasn't dogmatically defined until 1854, so the
# 1617 monastic rubric naturally has nothing here; the live engine correctly
# reflects that). Included anyway per explicit user direction (2026-08): this
# project is deliberately more generous with octave content than the strict
# target rubric alone would give. Matins reading for day 2 of the Immaculate
# Conception's own octave -- collapsed into one continuous reading per
# project convention, joining excerpts from Pope Pius IX's dogmatic bull
# "Ineffabilis Deus" (the actual proclamation of the dogma) with a homily of
# St. Sophronius on the Annunciation. Two source typos corrected
# ("Himselfcan" -> "Himself can", "Onlybegotten" -> "Only-begotten", the
# latter matching how the same phrase is correctly hyphenated earlier in the
# same file).
id: immaculate-conception-octave-day-2
source: "Ex Bulla dogmatica Pii Papæ IX; Homilía sancti Sophrónii Epíscopi"
text:
  la: |
    Ineffabilis Deus, cujus viæ misericordia et veritas, cujus voluntas omnipotentia, et cujus sapientia attingit a fine usque ad finem fortiter, et disponit omnia suaviter, cum ab omni æternitate præviderit luctuosissimam totius humani generis ruinam ex Adami transgressione derivandam, atque in mysterio a sæculis abscondito primum suæ bonitatis opus decreverit per Verbi incarnationem sacramento occultiore complere, ut contra misericors suum propositum homo diabolicæ iniquitatis versutia actus in culpam non periret, et quod in primo Adamo casurum erat, in secundo felicius erigeretur, ab initio et ante sæcula unigenito Filio suo Matrem, ex qua caro factus in beata temporum plenitudine nasceretur, elegit atque ordinavit, tantoque præ creaturis universis est prosecutus amóre, ut in illa una sibi propensissima voluntate complacuerit.

    Quapropter illam longe ante omnes angelicos spiritus, cunctosque Sanctos cælestium omnium charismatum copia de thesauro divinitatis deprompta ita mirifice cumulavit, ut ipsa ab omni prorsus peccati labe semper libera, ac tota pulchra et perfecta eam innocentiæ et sanctitatis plenitudinem præ se ferret, qua major sub Deo nullatenus intelligitur et quam præter Deum nemo assequi cogitando potest. Et quidem decebat omnino, ut perfectissimæ sanctitatis splendoribus semper ornata fulgeret, ac vel ab ipsa originalis culpæ labe plane immunis amplissimum de antiquo serpente triumphum referret tam venerabilis mater, cui Deus Pater unicum Filium suum, quem de corde suo æqualem sibi genitum, tamquam seipsum diligit, ita dare disposuit, ut naturaliter esset unus idemque communis Dei Patris et Virginis Filius.

    Quam originalem augustæ Virginis innocentiam cum admirabili ejusdem sanctitate præcelsaque Dei Matris dignitate omnino cohærentem catholica Ecclesia, quæ sancto semper edocta Spiritu columna est ac firmamentum veritatis, tamquam doctrinam possidens divinitus acceptam, et cælestis revelationis deposito comprehensam multiplici continenter ratione, splendidisque factis magis in dies explicare, proponere ac fovere numquam destitit. Hanc enim doctrinam ab antiquissimis temporibus vigentem, ac fidelium animis penitus insitam, et sacrorum Antistitum curis studiisque per catholicum orbem mirifice propagatam, ipsa Ecclesia luculentissime significavit, cum ejusdem Virginis Conceptionem publico fidelium cultui ac venerationi proponere non dubitavit.

    Quid missus beatus ille Angelus ad Virginem integerrimam dicit? Aut quomodo faustissimum hoc nuntium ipsi defert? Ave gratia plena, Dominus tecum. A gaudio incipit eam alloqui ille gaudii nuntius. Noverat enim et plane sciebat, nuntium illud suum universis hominibus atque omnibus pariter creaturis gaudium parare, et quoslibet a quibuscumque dolores expellere; noverat, ex divina hujus mysterii cognitione mundum lumine collustrari; noverat, erroris disjici caliginem; noverat, retundi mortis aculeum; noverat, vim corruptionis infringi; noverat, inferno victoriam auferri; noverat, salutem perdito affulgere homini, qui horum malorum jugo jamdiu premebatur, ex quo scilicet a paradisi deliciis expulsus, et a beato illo domicilio ejectus fuerat.

    Et sane par omnino erat, ut divina gaudii denuntiatio a sermonibus verbisque gaudium elicientibus sumeret initium. Gaude, o supercælestis gaudii genitrix. Gaude, o sublimissimi gaudii nutrix. Gaude, o salutaris gaudii sedes princeps. Gaude o immortalis gaudii auctrix. Gaude, o ineffabilis gaudii mysticum diversorium. Gaude, o indeficientis gaudii fons beatissime. Gaude, o gaudii æterni deiferum cimelium. Gaude, o vivificantis gaudii arbor virentissima. Gaude o innupta Dei Mater. Gaude, o Virgo post partum integerrima.

    Quisnam tuum eloqui splendorem poterit? Quisnam portentum, quod ipsa es, enarrare verbis audeat? Tu hominum exornasti naturam; tu Angelorum ordines superasti; tu fulgores Archangelorum obtenebrasti; tu sublimes Thronorum sedes infra te ostendisti; tu altitudinem Dominationum depressisti; tu Principatuum ducatibus præcucurristi; tu enervasti fortitudinem Potestatum; tu ipsis Virtutibus potentior virtus prodiisti; tu Cherubim oculatissimum visum terrestribus oculis vicisti; tu Seraphim sex alas habentium volatus animæ pennis divinitus agitatis transvolasti: tu denique omnem creaturam longe transgressa es; quippe quæ præ omni creatura enituisti puritate; et omnium creaturarum Conditorem in te excepisti; ipsumque et sinu tuo gestasti, et genuisti; et sola ex omnibus creaturis Dei Mater effecta es.
  en: |
    God is unspeakable. His ways are mercy and truth; His Will is Almighty Power; and His wisdom reacheth mightily from one end to another, and sweetly ordereth all things. He from all eternity foresaw the sorrowful fall of man by the transgression of Adam, and, in His mysterious purpose, He decreed, before the worlds were, that the Word should be made flesh, to the end that man, who had been seduced by the fraud of the devil, might not perish, but that as in the first Adam all die, in Christ all might be made alive. And to this end, the Eternal Creator from the beginning, and before all ages, chose and ordained a woman to be the Mother of His Only-begotten Son, of whom He should take flesh and be born, in the blessed fulness of time. And this woman He loved with so great a love that He allowed His Will to be freely wrought in her.

    Therefore, He bestowed upon her, out of the treasure of the Divinity, such a wealth of gifts of grace as He hath bestowed upon none of the Angels and none of the Saints. He made her always free from any the slightest pollution of sin, so fair and so upright that no other of His works are like to her, and only Himself can we understand to excel her. Verily, this was most fitting, that this most worshipful Mother should be made bright with the brightness of uncontaminated holiness, and should conquer the old serpent by escaping altogether the stain of original sin, for she was that Mother to whom the Eternal Father was willing to give the Co-Eternal and Co-Equal Only-begotten Son of His love, to be her Son also.

    The Catholic Church, which, through the perpetual teaching of the Holy Ghost, is the pillar and ground of the truth, hath always held the original innocence of this most exalted Virgin to be bound up with her wonderful holiness, and her mighty dignity of Mother of God. This doctrine she hath felt herself to hold by the gift of God, and as part of that faith once delivered from heaven unto the Saints, and as time hath gone on, she hath continually explained, put forth, and upheld it. This belief is found strong in the earliest times, and rooted as it were in the hearts of Christ's faithful people; by the care and study of holy Bishops it hath been taught in all parts of the Catholic world; and the Church herself pointed to it when she allowed the Conception of the Blessed Virgin Mary to be held as a feast, for exciting the piety and devotion of her children.

    When this blessed Angel was sent to the most pure virgin what did he say? In what words did he break the happy news of Redemption? Hail, thou that art full of grace, the Lord is with thee. The messenger of joy in his first word biddeth her rejoice. He knew well that his message was a message of good tidings of great joy to men, yea, to all creatures, a message of healing to all sicknesses. He knew well that his message was a message of God's light to a dark world. He knew well that it proclaimed the end of error. He knew well that it blunted the sting of death. He knew well that it broke the power of corruption. He knew well that it brought victory over hell. He knew well that it told of salvation to all the fallen children of Adam, groaning under that yoke of malediction which fell on them when they were thrust out of Eden, and banished from that happy home.

    And, of a truth, it was fitting that God's proclamation of joy should open with the accents of gladness. Rejoice, O mother of joy more than heavenly! Rejoice, O thou that nourishest joy in the highest! Rejoice, O Lady, full of the joy of salvation! Rejoice, O thou that bringest a joy that passeth not away! Rejoice, O mysterious treasury dispensing unspeakable joy! Rejoice, O most blessed fountain, overflowing with unfailing joy! Rejoice, O store-house of God, filled with the everlasting joy of eternity! Rejoice, O fair tree, bearing fruit of life-giving joy! Rejoice, O Maiden Mother of God! Rejoice, O thou that after child-birth remainest a virgin!

    Who shall worthily set forth thy glory? Who shall make bold to say what thou art? Thou art the exaltation of humanity; thou art made much higher than the Angels; thy brightness hath thrown the brightness of the Archangels into shadow; thou lookest down upon the lofty seats of the Thrones; thou makest the height of the Lordships to seem low; thy rank taketh precedence before the rank of the Principalities; compared with thee the Powers are weakness; thou art a Mighty one mightier than all the Mighty; thine earthly eyes see further than the contemplation of the Cherubim can reach; the Seraphim have six wings, but thy flight is nobler than theirs; in a word, thou hast far excelled every other work of God; thou wast far purer than any other creature; and thou hast conceived the Creator of all creatures, carried Him in thy womb, and brought Him forth; thou hast been chosen, out of all that He has made, to be His mother.
