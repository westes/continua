# Verified against Divinum Officium (Sancti/06-27oct.txt, "Quarta die infra
# Octavam Nativitatis S. Joannis Baptistae"), 2026-10-16. Lessons 4-9
# collapsed into one continuous reading per project convention (Basil's
# homily on Psalm 28, the Gospel incipit, Ambrose on Luke). The source's
# own English is used, with its stray bracket and tilde markers removed.
# Opening responsory is the feast's own Responsory1 (Nativity day), per the
# convention in vu-octave-reading-responsory-sweep.
id: nativity-of-st-john-the-baptist-octave-day-4
source:
  la: "Sermo sancti Basilii Magni et Homilia sancti Ambrosii"
  en: "St. Basil the Great, Homily on Psalm 28; St. Ambrose on Luke"
text:
  la: |
    Vox Dómini super aquas. Qualis vox? super quas aquas? Velut prophetíam accipiámus quod dictum est. Memíneris Joánnis, qui interrogátus a Judǽis: Tu quis es? quod respónsum dábimus iis, qui misérunt nos? respóndit: Ego vox clamántis in desérto. Igitur vox Dómini est Joánnes, Angelus a Deo missus ante fáciem Dómini, ut paráret Dómino plebem perféctam. Hæc ígitur vox super aquas, erat super Jordánem, in quo baptizábat prǽdicans pœniténtiæ baptísmum, et non solum in Jordáne, sed étiam in Ænon prope Salim, quia aquæ multæ erant illic.

    Igitur vox Dómini super aquas, Joánnes est super baptísmum. Illic et Deus majestátis intónuit: venit enim vox de cælo, dicens: Hic est Fílius meus diléctus, in quo mihi complácui. Tunc étiam Dóminus super aquas multas dignátus est descéndere in baptísma Joánnis, ut compléret omnem justítiam quæ in lege est. Vox Dómini in virtúte. Auferet enim debilitátes pópuli per pœniténtiæ baptísmum, per ipsum baptízans in aqua ad pœniténtiam. In virtúte est vox, dicens: Pœniténtiam ágite, appropinquávit enim regnum cælórum: et, Fácite fructus dignos pœniténtiæ.

    Vox Dómini confringéntis cedros. Potest dici, quod parans Dómino pópulum perféctum, elátas impietátes et contra cognitiónem Dei exaltátas confríngens, ac cónterens, oblíqua faciébat recta. Qui enim omnem collem ac montem humíliat, hic erat qui confringébat cedros, et Dómino viam adæquábat, per hoc quod ad pœniténtiam inducébat altum, et elátum, et supérbum cor. Unde ejus præparatiónem suscípiens Dóminus, suo advéntu confrégit oppósitas poténtias, cedros Líbani figuráte dictas. Opórtet enim Dóminum regnáre, donec ponat inimícos sub pedes suos, et cedros istas commínuat.

    Elísabeth implétum est tempus pariéndi, et péperit fílium. Et audiérunt vicíni et cognáti ejus quia magnificávit Dóminus misericórdiam suam cum illa, et congratulabántur ei. Et réliqua.

    Et Zacharías pater ejus implétus est Spíritu Sancto, et prophetábat. Vide quam bonus Deus, et fácilis indulgére peccátis; non solum abláta restítuit, sed étiam insperáta concédit. Ille dudum mutus prophétat; hæc enim grátia Dei máxima, quod eum, qui negáverat, confitétur. Nemo ergo diffídat, nemo véterum cónscius delictórum prǽmia divína despéret. Novit Dóminus mutáre senténtiam, si tu nóveris emendáre delíctum.

    Et tu puer, prophéta Altíssimi vocáberis. Pulchre, cum de Dómino prophetáret, ad prophétam sua verba convértit, ut hoc quoque benefícium esse Dómini designáret: ne cum públice enumeráret sua, quasi ingrátus tacuísse viderétur quæ agnoscébat in fílio. Sed fortásse áliqui quasi irrationábilem mentis excéssum putent, quod octo diérum allóquitur infántem. Verum, si teneámus, intelligémus profécto quod pótuit vocem patris natus audíre, qui Maríæ salutatiónem ántequam nascerétur audívit.

    Sciébat profécto álias esse aures prophétæ, quæ Spíritu Dei, non córporis ætáte reserántur. Habébat intelligéndi sensum, qui exsultándi habébat afféctum. Simul illud advérte, quam paucis Elísabeth, quam multis Zacharías prophétet: et utérque Sancto replétus Spíritu loquebátur: sed disciplína servátur, ut múlier díscere magis quæ divína sunt, stúdeat, quam docére.
  en: |
    The voice of the Lord is upon the waters. What voice is this What are these waters Let us take that which is here said as a prophecy. Thou rememberest how that this is the record of John, when the Jews (sent Priests and Levites from Jerusalem to ask him, Who art thou And he confessed and denied not, but confessed, I am not the Christ. And they asked him, What then Art thou Elias And he saith, I am not. Art thou that Prophet? And he answered, No. Then said they unto him, Who art thou that we may give an answer to them that sent us. (What sayest thou of thyself?) He said, I am the voice of one crying in the wilderness. (John i. 19-23; Isa. xl. 3, 4.) Therefore, John is the voice of the Lord. This is he, of whom it is written, Behold, I send My messenger before thy face (Luke vii. 27) to make ready a people prepared for the Lord (i. 17.) This voice upon the waters was heard upon those of Jordan, wherein he baptized, preaching the baptism of repentance for the remission of sins (iii. 3.) Nor was this voice heard upon the waters of Jordan only, but also, in Enon near to Salim, because there was much water there. (John iii. 23.)

    The voice of the Lord upon the waters, then, is John upon baptism. Then also the God of glory thundereth. For (when Jesus came from Nazareth of Galilee, and was baptized of John in Jordan..) there came a voice from heaven, saying, This is My Beloved Son, in Whom I am well pleased. (Mark i. 9, II.) Then also was it true that The Lord is upon many waters when He was pleased to come from Galilee to Jordan unto John, to be baptized of him... to fulfil all righteousness (Matth. iii. 13, 15,) which is of the law. (Rom. x. 5.) The voice of the Lord is powerful powerful to heal the weaknesses of the people through the baptism of repentance, baptizing through John with water unto repentance. (Matth. iii. 11.) The voice of the Lord is powerful, which saith Repent ye, for the kingdom of heaven is at hand, and Bring forth fruits meet for repentance.

    The voice of the Lord breaketh the cedars. This may well be said of him who, being sent as a messenger before the face of the Lord, to make ready for Him a prepared people, made the crooked places straight, by breaking down and treading flat the haughty growths of ungodliness that had lifted themselves up to block out the acknowledgment of God. He by whom every valley was exalted, and every mountain and hill was made low, the same was he who broke the cedars, and made straight in the desert an highway for our God, by laying low in repentance the hearts that were haughty, and proud, and lifted up. The Lord availing Himself of that preparation, smote down at His coming every power that withstood Him, which are spoken of under a similitude as the cedars of Lebanon. For the Lord must reign till He hath put all enemies under His feet, (i Cor. xv. 25,) and trodden down these cedars.

    Elizabeth's full time came that she should be delivered and she brought forth a son. And her neighbours and her cousins heard how the Lord had showed great mercy upon her and they rejoiced with her. And so on

    And his father Zacharias was filled with the Holy Ghost, and prophesied. Behold how good is God, and how ready to forgive sinners Not only doth He give back that which He hath taken away, but He addeth moreover such and such things, more than either we ask or think. He that had hitherto been dumb, now speaketh prophecy. But the greatest grace of God is in this, that he which had denied, now maketh profession. Therefore let no man despair, nay, though he well knoweth what have been his past sins, let him never give up hope of a reward from God. If thou knowest how to amend thy crooked ways, God knoweth how to turn away the judgments of His anger.

    And thou, child, shalt be called the Prophet of the Highest. How gracefully, while as he prophesieth of the Lord, he turneth his address to the Prophet, making mention of this great mercy of the Lord along with the others, lest, while he openly gave thanks for his own benefits, he should seem to keep the silence of unthankfulness regarding those which he knew had been given to his boy. But some will perhaps deem it his folly that he addressed his discourse to a babe of eight days old. Verily, if we call to mind that John heard the voice of Mary's salutation when he was in his mother's womb, we shall understand how much rather he could hear the voice of his father now when he was born.

    Zacharias knew well that a Prophet hath ears which open under the influence of the Spirit of God, instead of that of advancing age. He that had had sense to leap in the womb for joy, wanted not understanding. At the same time remark unto how many Zacharias prophesied, and though both he and his wife were filled with the Holy Ghost, yet all things are done in due order, and the woman studieth rather to learn the things of God than to teach them.
responsory:
  la: |
    R. Fuit homo missus a Deo, cui nomen erat Joánnes: * Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam. V. Erat Joánnes in desérto prǽdicans baptísmum pœniténtiæ. R. Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam.
  en: |
    R. There was a man sent from God, whose name was John: * The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord. V. John was in the wilderness, preaching the baptism of repentance. R. The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord.
