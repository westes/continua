# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-11-4). Matins reading for day 4 of All Saints' own
# octave -- collapsed into one continuous reading per project convention. A
# continuous reading from the book of Ezechiel, read straight through across
# the whole octave (a different excerpt each day), not repeated -- confirmed
# via each day's own Invitatory (the same distinctive All Saints antiphon
# every day, Nov 2 included, so this app's own exclusion of All Souls' Day as
# a different liturgical genre doesn't conflict with this octave's real Matins
# content). The source's own English translation is used as-is, including gaps
# in its own punctuation (some older "oct"/"bmv"-suffixed variant files drop
# question marks entirely in places) -- not corrected here, since guessing
# where they belong isn't the same class of fix as an isolated single-
# character typo.
id: all-saints-octave-day-4
source: "De Ezechiéle Prophéta"
text:
  la: |
    De Ezechiéle Prophéta Ezek 3:1-4 1 Et dixit ad me: Fili hóminis, quodcúmque invéneris, cómede: cómede volúmen istud, et vadens lóquere ad fílios Israël. 2 Et apérui os meum, et cibávit me volúmine illo: 3 Et dixit ad me: Fili hóminis, venter tuus cómedet, et víscera tua complebúntur volúmine isto quod ego do tibi. Et comédi illud, et factum est in ore meo sicut mel dulce. 4 Et dixit ad me: Fili hóminis, vade ad domum Israël, et loquéris verba mea ad eos.

    Ezek 3:5-9 5 Non enim ad pópulum profúndi sermónis et ignótæ linguæ, tu mítteris ad domum Israël; 6 Neque ad pópulos multos profúndi sermónis et ignótæ linguæ, quorum non possis audíre sermónes; et, si ad illos mitteréris, ipsi audírent te; 7 Domus autem Israël nolunt audíre te, quia nolunt audíre me; omnis quippe domus Israël attríta fronte est, et duro corde. 8 Ecce dedi fáciem tuam valentiórem faciébus eórum, et frontem tuam duriórem fróntibus eórum: 9 Ut adamántem et ut sílicem dedi fáciem tuam; ne tímeas eos neque métuas a fácie eórum, quia domus exásperans est.

    Ezek 3:10-13 10 Et dixit ad me: fili hóminis, omnes sermónes meos, quos ego loquor ad te, assúme in corde tuo et áuribus tuis audi; 11 Et vade, ingrédere ad transmigratiónem, ad fílios pópuli tui, et loquéris ad eos; et dices eis: Hæc dicit Dóminus Deus: Si forte áudiant et quiéscant. 12 Et assúmpsit me spíritus, et audívi post me vocem commotiónis magnæ: Benedícta glória Dómini de loco suo; 13 Et vocem alárum animálium percutiéntium álteram ad álteram, et vocem rotárum sequéntium animália, et vocem commotiónis magnæ.
  en: |
    Lesson from the book of Ezekiel Ezek 3:1-4 1 And he said to me: Son of man, eat all that thou shalt find: eat this book, and go speak to the children of Israel. 2 And I opened my mouth, and he caused me to eat that book. 3 And he said to me: Son of man, thy belly shall eat, and thy bowels shall be filled with this book, which I give thee. And I did eat it: and it was sweet as honey in my mouth. 4 And he said to me: Son of man, go to the house of Israel, and thou shalt speak my words to them.

    Ezek 3:5-9 5 For thou art not sent to a people of a profound speech, and of an unknown tongue, but to the house of Israel: 6 Nor to many nations of a strange speech, and of an unknown tongue, whose words thou canst not understand: and if thou wert sent to them, they would hearken to thee. 7 But the house of Israel will not hearken to thee: because they will not hearken to me: for all the house of Israel are of a hard forehead and an obstinate heart. 8 Behold I have made thy face stronger than their faces: and thy forehead harder than their foreheads. 9 I have made thy face like an adamant and like flint: fear them not, neither be thou dismayed at their presence: for they are a provoking house.

    Ezek 3:10-13 10 And he said to me: Son of man, receive in thy heart, and hear with thy ears, all the words that I speak to thee: 11 And go get thee in to them of the captivity, to the children of thy people, and thou shalt speak to them, and shalt say to them: Thus saith the Lord: If so be they will hear and will forbear. 12 And the spirit took me up, and I heard behind me the voice of a great commotion, saying: Blessed be the glory of the Lord, from his place. 13 And the noise of the wings of the living creatures striking one against another, and the noise of the wheels following the living creatures, and the noise of a great commotion.
responsory:
  la: |
    ℟. Vidi Dóminum sedéntem super sólium excélsum et elevátum, et plena erat omnis terra majestáte ejus: * Et ea, quæ sub ipso erant, replébant templum. ℣. Séraphim stabant super illud: sex alæ uni, et sex alæ álteri. ℟. Et ea, quæ sub ipso erant, replébant templum.
  en: |
    ℟. I saw the Lord sitting upon a throne, high and lifted up, and the whole earth was full of His glory; * And His train filled the temple. ℣. Above it stood the Seraphim each one had six wings. ℟. And His train filled the temple.
status:
  la: verified
  en: verified
