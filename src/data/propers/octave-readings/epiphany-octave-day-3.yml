# Sourced directly from the raw reference files (web/www/horas/Latin+English/Sancti/01-08.txt): the Epiphany octave's counted day 3 (Sundays not counted -- see OctaveConfig.skipsSunday). Lectio4-6 plus the Lectio7-9 continuation, bare Gospel incipit dropped, collapsed into one reading as every octave reading here is.
id: epiphany-octave-day-3
source:
  la: "Sermo sancti Augustíni Epíscopi; Homilía sancti Gregórii Papæ"
  en: "From the Sermons of St. Augustine, Bishop of Hippo; Homily by Pope St. Gregory the Great"
text:
  la: |
    Cum tam multi jam nati, atque defuncti essent reges Judæórum, numquid quemquam eórum adorándum Magi quæsiérunt? Non, quia nec quemquam eórum cælo loquénte didicérunt. Verúmtamen, quod prætereundum non est, hæc Magórum illuminátio magnum testimónium cæcitátis exstitit Judæórum. In terra eórum isti requirébant, quem illi in sua non agnoscebant.

    Apud eos isti infántem invenérunt, quem illi apud se negavérunt. In his terris de longinquo isti et peregrini púerum Christum nondum verba proméntem adoravérunt, ubi cives illi juvenem miracula faciéntem crucifixérunt. Isti in membris parvis Deum adoravérunt, illi in magnis factis nec tamquam hómini pepercérunt: quasi plus fúerit vidére novam stellam in ejus nativitáte fulgéntem, quam solem ejus in morte lugéntem.

    Jam vero quod éadem stella, quæ Magos perdúxit ad locum, ubi erat cum matre Vírgine Deus infans, quæ útique póterat eos ad ipsam perducere civitátem, se tamen subtraxit, nec eis prorsus appáruit, donec de civitáte, in qua Christus nascerétur, iídem ipsi interrogaréntur Judæi, et ipsi eam secúndum divinæ Scripturæ testimónium nominárent, ipsi dicerent: In Bethlehem Judæ. Sic enim scriptum est: Et tu Bethlehem terra Juda, non es minima in princípibus Juda: ex te enim éxiet Dux, qui regat pópulum meum Israël. Quid aliud hic significávit divina providéntia, nisi apud Judæos solas divinas litteras remansuras, quibus gentes instrueréntur, illi excæcarentur?

    Magi vero aurum, thus et myrrham déferunt. Aurum quippe Regi congruit, thus vero in Dei sacrifícium pónitur, myrrha autem mortuórum córpora condiúntur. Eum ergo Magi, quem adorant, étiam mysticis munéribus prædicant: auro Regem, thure Deum, myrrha mortalem. Sunt vero nonnulli hæretici, qui hunc Deum credunt, sed ubíque regnare nequáquam credunt. Hi profecto ei thus ófferunt, sed offerre étiam aurum nolunt. Et sunt nonnulli, qui hunc Regem existimant, sed Deum negant. Hi videlicet ei aurum ófferunt, sed offerre thus nolunt.

    Et sunt nonnulli, qui hunc et Deum et Regem faténtur, sed assumpsísse carnem mortalem negant. Hi nimirum ei aurum et thus ófferunt, sed offerre myrrham assumptæ mortalitátis nolunt. Nos ítaque nato Dómino offerámus aurum, ut hunc ubíque regnare fateámur: offerámus thus, ut credamus, quod is, qui in témpore appáruit, Deus ante témpora éxstitit: offerámus myrrham, ut eum, quem crédimus in sua divinitate impassibilem, credámus étiam in nostra fuísse carne mortalem.

    Quamvis in auro, thure, et myrrha intelligi et aliud potest. Auro namque sapiéntia designátur, Salomone attestante, qui ait: Thesaurus desiderábilis requiescit in ore sapiéntis. Thure autem, quod Deo incénditur, virtus oratiónis exprímitur, Psalmista testante, qui dicit: Dirigátur orátio mea sicut incensum in conspéctu tuo. Per myrrham vero carnis nostræ mortificátio figurátur. Unde sancta Ecclésia de suis operariis usque ad mortem pro Deo certántibus dicit: Manus meæ distillavérunt myrrham.
  en: |
    Many kings of the Jews had been born, and died, but which of them was sought after by wise men to worship him? Not one for not one had been proclaimed by the voice of heaven. Let us not also pass by the fact that the enlightenment of the wise men standeth in strong contrast to the blindness of the Jews. The first came from far to find Him, Whom, being born in their midst, the second knew not.

    The wise men found the young Child among those who denied Him. These holy pilgrims came and worshipped the yet silent Christ in the land whose inhabitants, after He grew up and worked miracles, crucified Him. They worshipped in that tiny Body the God Whom, amid great signs and wonders, the Jews would not spare even as a man. They who saw the Star which shone at His birth, put it to more profit than they who saw the sun veiled at His death.

    The star which led the wise men towards the place where the new-born God dwelt with His Virgin Mother, ceased to shine when it came to the city of Jerusalem, while they were inquiring of the Jews where Christ should be born. The Jews answered them according to the testimony of the Divine Scriptures In Bethlehem of Judah for thus it is written And thou Bethlehem in the land of Judah, art not the least among the princes of Judah, for out of thee shall come a Governor, that shall rule My people Israel. What else are we to understand that God's Providence would here signify, than that there should remain among the Jews those Divine Writings only, whereby the Gentiles are enlightened, while they themselves remain dark?

    The wise men brought gold, frankincense, and myrrh. Gold is the fitting gift to a King, frankincense is offered in sacrifice to God, and with myrrh are embalmed the bodies of the dead. By the gifts, therefore, which they presented unto Him, the wise men set forth three things concerning Him unto Whom they offered them; by the gold, that He was King; by the frankincense, that He was God; and by the myrrh, that He was to die. There are some heretics who believe Him to be God, but confess not His Kingly dominion over all things; these offer unto Him frankincense, but refuse Him gold. There are some others who admit that He is King, but deny that He is God; these present unto Him gold, but will not give Him frankincense.

    There are some other heretics who profess that Christ is both God and King, but not that He took a dying nature; these offer Him gold and frankincense, but not myrrh for the Manhood. Let us, however, present gold unto the new-born Lord, acknowledging His universal Kingship; let us offer unto Him frankincense, confessing that He Who hath been made manifest unto us in time, is God before time was; let us give unto Him myrrh, believing that He Who cannot suffer as touching His Godhead, was made capable of death as touching the manhood which He shareth with us.

    There is also another signification in this gold, frankincense, and myrrh. Gold is a type of wisdom; as saith Solomon x In the mouth of the wise abideth a treasure to be desired. Frankincense, which is burnt in honour of God, is a figure of prayer; witness the words of the Psalmist, (Ps. cxl. 2:) Let my prayer be set forth as incense before thee. By myrrh is represented the putting to death of the body; as where the holy Church saith of her labourers who strive for God even unto death My hands dropped with myrrh. (Cant. v. 5.)
responsory:
  la: |
    R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et habent in se divína mystéria: * In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram. V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris suis mýsticas ei múnerum spécies obtulérunt. R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram.
  en: |
    R. There are three precious gifts which the wise men offered unto the Lord on this day, and they speak a mystery of the things of God: * Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying. V. The wise men worshipped the Captain of our Salvation, as He lay in the manger, and when they had opened their treasures, they presented unto Him mystic gifts. R. Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying.
