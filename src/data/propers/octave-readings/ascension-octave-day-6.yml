# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Tempora/Pasc6-2.txt) -- day 6 of the Ascension's own movable octave, same
# shape/rationale as ascension-octave-day-2.yml. Joins a homily of St.
# Maximus, Bishop of Turin (Lectio4-6, the eagle-and-captivity imagery, from
# a homily originally written for Pentecost but placed here in this office)
# with the continuation of Pope St. Gregory's homily on Mark 16:14-20
# (Lectio7-9, same Gospel pericope as days 2-3/5-6, a different homily
