id: ascension-octave-day-6
source:
  la: "Sermo sancti Máximi Epíscopi; Homilía sancti Gregórii Papæ"
  en: "Sermon of St. Maximus, Bishop; Homily of St. Gregory the Great, Pope"
text:
  la: |
    Méminit sánctitas vestra, quod áquilæ illi de Psaltério, cujus innovátam juventútem légimus, comparáverim Salvatórem. Est enim similitúdo non parva. Sicut enim áquila humília déserit, alta petit, cælórum vicína conscéndit: ita et Salvátor humília inférni deséruit, paradísi altióra pétiit, cælórum fastígia penetrávit. Et sicut áquila relíctis terrénis sórdibus, sublíme volans, purióris áëris salubritáte perfrúitur: ita et Dóminus, terrenórum fæcem déserens peccatórum, in Sanctis suis vólitans, purióris vitæ simplicitáte lætátur.

    Per ómnia ígitur áquilæ comparátio cónvenit Salvatóri. Sed quid fácimus, quod áquila prædam frequénter díripit, tollit frequénter aliénum? Nec in hoc tamen dissímilis est Salvátor. Prædam enim quodámmodo sústulit, cum hóminem, quem suscépit, inférni raptum fáucibus portávit ad cælum, et aliénæ dominatiónis, id est, diabólicæ potestátis servum de captivitáte érutum, duxit ad altióra captívum, sicut scriptum est in prophéta: Ascéndens in altum, captívam duxit captivitátem, dedit dona homínibus.

    Ascéndit, inquit, in altum, captívam duxit captivitátem. Quam bene triúmphum Dómini prophéta descríbit! Solébat, sicut dicunt, regum triumphántium currus captivórum pompa præcédere. Ecce Dóminum eúntem ad cælos non præcédit, sed comitátur gloriósa captívitas; non ante vehículum dúcitur, sed ipsa évehit Salvatórem. Quodam enim mystério, dum Fílius Dei Fílium hóminis sústulit ad cælum, ipsa captívitas portátur, et portat.

    Considerándum nobis est, quid est quod Marcus ait: Sedet a dextris Dei: et Stéphanus dicit: Vídeo cælos apértos, et Fílium hóminis stantem a dextris Dei. Quid est quod hunc Marcus sedéntem, Stéphanus vero stantem se vidére testátur? Sed scitis, fratres, quia sedére judicántis est, stare vero pugnántis, vel adjuvántis.

    Quia ergo Redémptor noster assúmptus in cælum et nunc ómnia júdicat, et ad extrémum judex ómnium véniet, hunc post assumptiónem Marcus sedére descríbit, quia post ascensiónis suæ glóriam judex in fine vidébitur. Stéphanus vero hunc in labóre certáminis pósitus stantem vidit, quem adjutórem hábuit: quia ut iste in terra persecutórum infidelitátem vínceret, pro illo de cælo illíus grátia pugnávit.

    Séquitur: Illi autem profécti prædicavérunt ubíque, Dómino cooperánte et sermónem confirmánte sequéntibus signis. Quid in his considerándum est, quid memóriæ commendándum: nisi quod præcéptum obediéntia, obediéntiam vero signa secúta sunt?
  en: |
    My holy brethren, ye remember that I have likened the Saviour to that eagle, touching which it is written in the Book of Psalms, "thy youth is renewed like the eagle's." There are many points of likeness. The eagle riseth above ground, wingeth his way aloft, and mounteth skyward; even so did the Saviour rise from the depth of the grave, mount up unto the exalted mansions of Paradise, and enter the heights of heaven. The eagle leaveth below him the foul mists of earth, flieth above, and drinketh in health from a purer air; even so did the Lord leave below Him the filthy slough of sinners on earth, and rejoice Himself with the honesty of a purer life, when He soared again into His Own holy home.

    In all ways, therefore, is the Saviour aptly likened to an eagle. But what can we make of this, that the eagle is a bird of prey, oft-times a plunderer? Even in this he is like to the Saviour. He bore off His prey, when He carried off from the jaws of hell to heaven the Manhood Which He had swooped to take to Himself, yea, when He led captive to an higher home him whom He had delivered from the mastership of another lord, namely the devil, even as it is written in the Prophet: "Thou hast ascended on high, Thou hast led captivity captive, Thou hast received gifts among men."

    "Thou hast ascended on high, Thou hast led captivity captive." O how nobly doth the Prophet paint the Triumph of the Lord! We hear how that of old time, when kings marched in triumph, the procession of prisoners walked before the chariot of their conqueror. Lo, the Lord entereth the heavens, not preceded by, but amid a most glorious band of captives. That band are not led before His chariot, but themselves bear up their Saviour. In some mystic sense, when the Son of God bore to heaven the Son of man, captivity both led and was led.

    We must ponder the meaning of these words of Mark, "He sat on the right hand of God," and how that Stephen said, "Behold, I see the heavens opened, and the Son of man standing on the right hand of God." Wherefore doth Mark say that He sat, whereas Stephen testifieth that he saw Him standing? But ye know, my brethren, that to sit is for him that judgeth, to stand, for him that fighteth, or helpeth.

    Since therefore our Redeemer is ascended up into heaven, and even now is Judge of all, beside that at the end of the world He will so come, therefore doth Mark say that He sitteth where He hath gone up, because we look for Him, after that His glorious Ascension, that He will come again at the end to be our Judge. But Stephen, while yet he was in the throes of the battle, saw Him That was helping him standing. Stephen on earth was overcoming the unbelief of his persecutors, but it was the grace of Him That is in heaven that fought in him all the while.

    "And they went forth and preached everywhere, the Lord working with them, and confirming the word with signs following." What are we to see in this, what are we to remember, but that obedience followed commandment, and signs obedience?
