# Verified against Divinum Officium (Sancti/07-01t.txt, "In Octava S.
# Joannis Baptistae", Duplex), 2026-10-16. The octave day's own 9-lesson
# office (Maximus of Turin, the Gospel incipit, Ambrose on Luke), collapsed
# into one continuous reading per project convention. The source's own
# English is used, with its tilde markers removed. In Continua this day is
# also the Most Precious Blood (Duplex I), which outranks it, so the
# octave day is normally only commemorated.
id: nativity-of-st-john-the-baptist-octave-day-8
source:
  la: "Sermo sancti Maximi Episcopi et Homilia sancti Ambrosii"
  en: "St. Maximus of Turin, Homily 3 on the Nativity of St. John the Baptist; St. Ambrose on Luke"
text:
  la: |
    Festivitatem præsentis diei, fratres carissimi, venerandi Joannis Baptistæ genuina nativitas consecravit: qui idcirco in hoc sæculum superna dispensatione directus est, ut non solum ipse prophetali sublimaretur gloria, sed ut et omnium étiam per eum prophetarum præconia firmarentur. Nec immerito illum præcipuo honore nunc veneramur, qui speciali quadam gratia, ob hoc Redemptorem mundi novissimus prophetavit, ut ostenderet eum primus. Hic enim solus est prophetarum, qui Dominum nostrum Jesum Christum, quem alii in longa tempora futurum præscierunt, propriis oculis videre meruit, et annuntiare præsentem.

    Hic est ille, quem, inspirante Deo, præscius annuntiat Isaias, dicens: Vox clamantis in deserto, Parate viam Domini. Quam congrue fratres carissimi beatus Joannes prædicatus est vox, qui cælestis Verbi et præco mittebatur, et testis. Hic est ille, cujus per Angelum Gabrielem prænuntiatur nativitas, et nomen, et meritum. Hic est, qui judicio cælestis sententiæ cunctis mortalibus antefertur, dicente Domino: Non surrexit inter natos mulierum major Joanne Baptista. Quam pulchre dictum est, inter natos mulierum non esse majorem: quia ille omnimodis major erat Joanne, qui de Virgine nascebatur.

    Quibus perspectis, advertite dilectissimi, quantam huic reverentiam, quantum devotionis debeamus impendere: qui ut honorabilis sit, a sancto est Spiritu prophetatus, promissus ab Angelo, laudatus a Domino, et perpetua sanctæ mortis gloria consecratus. Decebat namque, ut mysticam nativitatem ejus mirabilis vita sequeretur, et sanctam perfectamque vitam mors Deo devota concluderet. Propter quod, fratres, rectissime toto hodie orbe, Christi Ecclesia primordia nativitatis ejus lætissima festivitate concelebrat, qui æterna mortalibus adesse gaudia, stupenti mundo testis fidelissimus revelavit.

    Elisabeth impletum est tempus pariendi, et peperit filium. Et audierunt vicini et cognati ejus. quia magnificavit Dominus misericordiam suam cum illa, et congratulabantur ei. Et réliqua.

    Joannes est, inquit, nomen ejus. Non poterat Elisabeth Domini ignorare prænuntium, quæ prophetaverat Christum. Bene additur: Quia nemo in cognatione ejus vocabatur hoc nomine, ut intelligas nomen non generis esse, sed vatis. Zacharias quoque nutu interrogatur: sed quia incredulitas ei affatum eripuerat et auditum; quod voce non poterat, manu et litteris est locutus.

    Scripsit enim dicens: Joannes est nomen ejus. Et hic nomen non imponitur, sed astruitur: meritoque continuo resoluta est lingua ejus: quia quam vinxerat incredulitas, fides solvit. Credamus et nos igitur, ut loquamur; ut lingua nostra, quæ incredulitatis vinculis est ligata, rationis voce solvatur.

    Scribamus spiritu mysteria, si volumus loqui: scribamus prænuntium Christi, non in tabulis lapideis, sed in tabulis cordis carnalibus. Etenim qui Joánnem loquitur, Christum prophetat. Loquamur Joánnem, loquamur et Christum: ut nostrum quoque os possit aperiri, quod in sacerdote tanto, irrationabilis modo pecudis, fræna nutantis fidei coërcebant.
  en: |
    Dearly beloved brethren, the feast which we this day keep hath been hallowed by the true Birth of the worshipful Baptist, John. He was a man whom God was pleased to send into this world, not only that he himself might fill the glorious office of a Prophet, but also that by him the words of all the other Prophets might be established. That we should give him, as we now do, the chiefest honour among them all, is right for he had poured upon him this special blessing, that, being the last who prophesied in the world the coming of Him Who came to redeem the world, he was the first who, when He came, pointed to Him as already come. The other Prophets, at the distance of ages, knew that our Lord Jesus Christ was to come the Prophet John alone was worthy to see Him with his very eyes, and to proclaim Him actually present.

    This is he concerning whom the seer Isaiah, by the inspiration of God, said: The voice of him that crieth in the wilderness Prepare ye the way of the Lord. (xl. 3.) How meetly, dearly beloved brethren, is this blessed John called a voice he who was sent to be at once the herald and the witness of the Word from heaven This is he whose birth, whose name, and whose work were foretold by the angel Gabriel. This is he who in the sight of heavenly knowledge is more honourable than any other man, as hath been declared by the Lord Among them that are born of women there hath not risen a greater than John the Baptist. (Matth. xi. 11.) How beautifully is it said, born of women since He Who was infinitely greater than John was born of a Virgin

    In sight of these things, consider, dearly beloved brethren, in how great worship, in how great love ye are behoven to hold him, who is thus honourable, that he hath been foretold by the Holy Ghost, promised by an Angel, extolled by the Lord Himself, and hallowed by the everlasting glory of an holy death. His birth, surrounded with wonders, is the meet beginning of a wondrous life, that holy, sinless life the meet fore-runner of a death which was a gift to God. It is but just then, my brethren, that the Church of Christ should on this day with keen joy keep throughout the whole world the Feast of his Birth, even his, who arose a right faithful witness to tell a wondering world that a life of eternal gladness was lying open to the choice of dying creatures.

    Elizabeth's full time came that she should be delivered and she brought forth a son. And her neighbours and her cousins heard how the Lord had showed great mercy upon her and they rejoiced with her. And so on.

    He shall be called John. Elizabeth who had herself prophesied of Christ, could not fail to recognise the Fore-runner of the Lord. It is well added: There is none of thy kindred that is called by this name whereby we know that he was named, not as the son of Zacharias, but as the Prophet of God. And they made signs to his father, how he would have him called but since unbelief had bereft him of voice and hearing, he was not able to answer them by word of mouth, and he asked for a writing-table and wrote, saying His name is John.

    He asked for a writing-table and wrote, saying His name is John he giveth not this name to his son, but maketh known that it is already his. And his mouth was opened immediately unbelief had shut it, faith opened it. If, then, we likewise would speak, let us believe let our tongues, which unbelief hath tied, be opened to speak wisdom.

    If we be fain to speak, let us engrave deep things upon our memories let us engrave the fact that Christ is at hand, not in tables of stone, but in fleshy tables of the heart. (2 Cor. iii. 3.) He that spake of John prophesied of Christ. Let us so speak of John, as to speak of Christ, that our mouth also may be opened, as was the mouth of the great Priest Zacharias which, like the mouth of a dumb beast constrained by the bit, was forced by a wavering faith to make voiceless signs.
responsory:
  la: |
    R. Fuit homo missus a Deo, cui nomen erat Joánnes: * Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam. V. Erat Joánnes in desérto prǽdicans baptísmum pœniténtiæ. R. Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam.
  en: |
    R. There was a man sent from God, whose name was John: * The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord. V. John was in the wilderness, preaching the baptism of repentance. R. The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord.
