id: st-john-apostle-octave-day-8
source:
  la: "Tractátus sancti Augustíni Epíscopi in Joánnem; Homilía sancti Joánnis Chrysóstomi"
  en: "Tract of St. Augustine, Bishop, on John; Homily of St. John Chrysostom"
text:
  la: |
    In quátuor Evangéliis, vel pótius quátuor libris uníus Evangélii, sanctus Joánnes Apóstolus non immérito secúndum intelligéntiam spiritálem áquilæ comparátus, áltius multóque sublímius áliis tribus eréxit prædicatiónem suam: et in ejus erectióne étiam corda nostra érigi vóluit. Nam céteri tres Evangelístæ tamquam cum hómine Dómino in terra ámbulant, et de divinitáte ejus pauca dixérunt: istum autem quasi pigúerit in terra ambuláre, sicut ipso exórdio sui sermónis intónuit, eréxit se non solum super terram, et super omnem ámbitum áëris et cæli, sed super omnem étiam exércitum Angelórum, omnémque constitutiónem invisibílium Potestátum: et pervénit ad eum, per quem facta sunt ómnia, dicéndo: In princípio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum.

    Huic tantæ sublimitáti princípii étiam cétera cóngrua prædicávit, et de Dómini divinitáte, quómodo nullus álius, est locútus: hoc ructábat, quod bíberat. Non enim sine causa de illo in isto ipso Evangélio narrátur, quia et in convívio super pectus Dómini discumbébat. De illo ergo péctore in secréto bibébat, sed quod in secréto bibit, in manifésto eructávit: ut pervéniat ad omnes gentes non solum incarnátio Fílii Dei, pássio, et resurréctio, sed étiam quod erat ante incarnatiónem únicus Patri, Verbum Patris, coætérnus generánti, æquális ei a quo missus est.

    Aquila ipse est Joánnes, sublímium prædicátor, et lucis intérnæ atque ætérnæ fixis óculis contemplátor. Dicúntur enim et pulli aquilárum a paréntibus sic probári, patris scílicet ungue suspéndi, et rádiis solis oppóni. Qui firme contemplátus fúerit, fílius agnóscitur: si ácie palpitáverit, tamquam adulterínus ab ungue dimíttitur. Jam ergo vidéte, quam sublímia loqui débuit, qui est áquilæ comparátus: et tamen étiam nos humi repéntes, infírmi, et vix ullíus moménti inter hómines, audémus tractáre ista, et ista expónere: et putámus nos aut cápere posse cum cogitámus, aut capi dum dícimus.

    Cum magna Christus Petro communicásset, orbis terrárum curam demandásset, martýrium prædixísset et majórem erga eum dilectiónem testátus esset: cum vellet Petrus Joánnem sócium et collégam, inquit: Hic autem quid? Numquid eámdem viam aggrediétur? Et quemádmodum in cena interrogáre non ausus, Joánnem suffécit; ita nunc vicem reddit, arbitrátus eum velle, sed non audére de se sciscitári. Tum Christus: Si eum volo manére donec véniam, quid ad te?

    Nam cum nímia id caritáte díceret Petrus, nec ab eo dívidi vellet, osténdens Christus, quod quantávis eum dilectióne prosequerétur, suam ássequi non posset, inquit: Si eum volo manére, quid ad te? His verbis nos erúdiens, neque doléndum, neque curiósius præter divínam voluntátem investigándum. Nam cum Petrus semper in hujúsmodi interrogatiónes fervéntius prosilíret, íterum ejus fervórem retúndens, quod non sit ultérius inquiréndum, in hunc modum respóndit.

    Exiit ergo sermo iste inter fratres, quod discípulus ille non móritur: et non dixit ei Jesus, quia non móritur; sed, Si eum volo manére donec véniam quid ad te? Noli arbitrári, inquit, eódem modo me de vobis disposuísse. Hoc autem dixit, ut intempestívum afféctum, et consuetúdinis desidérium tólleret. Cum enim essent orbis terrárum curam susceptúri, simul ámplius esse non oportébat: magnum enim fuísset mundo detriméntum. Idcírco inquit: Opus suscepísti, id consídera: pérfice, labóra, et te certamínibus expóne. Quid ad te, si volo eum manére hic? tu offícium tuum cura, et exséquere.
  en: |
    Of the Four Evangelists, or, rather, the four writers of the one Evangel, the holy Apostle John hath not unworthily been compared by spiritual writers to an eagle, because of the lofty and glorious flight of his teaching, soaring above the other three — a flight that raiseth not himself alone, but also the hearts of all, whosoever will hear him. The other three writers walk with the Lord upon earth, as with a man, and enlarge little upon His Godhead; but John, as though it had wearied him to walk upon earth, in the very first words of his writing riseth not above the earth only, or above the firmament and the heavens, but above every angel, and above every power of things unseen, and flieth directly to Him by Whom all things were made, saying: "In the beginning was the Word, and the Word was with God, and the Word was God."

    Then he goeth on worthily of such a beginning, and speaketh of the Lord's Godhead as none hath ever spoken, uttering freely the things which he had heard. It is not without cause that it is told of him in that Gospel how he lay on Jesus' Breast at supper. Truly he drank secretly from that Breast, and what he drank secretly he hath uttered openly, that all men may know not only how the Son of God became man, suffered, and rose again for us, but likewise how He was with the Father before He took flesh — the Only-Begotten Son, the Word of the Father, co-eternal with Him that begat Him, equal to Him That sent Him.

    John is an eagle that soareth up to the things that are not made, and fixeth his eye unquailing upon the secret and eternal Light. It is said that the father-eagle taketh his young in his talons and flieth with them, that they may look at the sun. Them that look at it boldly, he acknowledgeth for his own offspring, but them whose eyes shrink, he letteth fall from his claws as bastards. Let us consider, then, how mightily he must speak who is likened to an eagle; and yet we who are reptiles crawling on earth, weak, and of small consideration even among men, dare take in hand these utterances, to treat of them and to explain them, and think that our intelligence understandeth them, or our speech commendeth them.

    Christ had made known great things to Peter, charged him with the care of the whole world, announced to him his future martyrdom, and given him testimony of His especial love. Peter then would have John for a fellow and helper, and he said, "What shall this man do?" as it were: "Shall not he also follow the same path with me?" At the supper, when Peter would ask a question of the Lord, he dared not, but got John for his spokesman; and now Peter asketh that which he thought John fain would know, but dared not ask for himself. Christ saith unto him: "If I will that he tarry till I come, what is that to thee?"

    Peter asked because of his great love for John, hoping not to be parted from him, and Christ answered him, that with whatever affection he loved him, he could not love him as He loved him. "If I will that he tarry till I come, what is that to thee?" Let us learn from these words, by the teaching of Christ, neither to chafe, nor to enquire too curiously, where the will of God is concerned. For when Peter would be still asking, the Lord at length checked him in these words for his continued curiosity.

    Then went this saying abroad among the brethren, that that disciple should not die; yet Jesus said not unto him, "He shall not die"; but, "If I will that he tarry till I come, what is that to thee?" That is, He would not have it thought that He had disposed of them both in the same way. He spoke thus that He might check the untimely motion of affection, and the desire to continue the old companionship. The Apostles were about to take in charge the whole earth, and it behoved them no more to continue together, lest the world should suffer thereby. Therefore the Lord saith to Peter: "Thou hast received thy task; bend thyself to it, and do it; work and fight. What is it to thee if I will that he tarry here? Turn thou to thine own appointed labour, and finish it."
