# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2026-05-30) -- this date is also Pentecost's own Ember
# Saturday (see calendar/temporal-categories.yml and
# tests/calendar/transfer.test.ts's St. Felix I case), but Pentecost's own
# octave content still governs Matins here, confirmed via the day's own
# Invitatory. Matins reading for day 7 -- collapsed into one continuous
# reading per project convention. The source's own English translation is used
# as-is, including gaps in its own punctuation (some older
# "oct"/"bmv"-suffixed variant files drop question marks entirely in places)
