id: pentecost-sunday-octave-day-7
source: "Léctio sancti Evangélii secúndum Lucam"
text:
  la: |
    Léctio sancti Evangélii secúndum Lucam Luc 4:38-44 In illo témpore: Surgens Jesus de synagóga, introívit in domum Simónis. Socrus autem Simónis tenebátur magnis fébribus. Et réliqua. Homilía sancti Ambrósii Epíscopi Liber 4 in cap. 4 Lucæ, circa finem Vide cleméntiam Dómini Salvatóris: nec indignatióne commótus nec scélere offénsus, nec injúria violátus Judǽam déserit: quin étiam ímmemor injúriæ, memor cleméntiæ, nunc docéndo, nunc liberándo, nunc sanándo, infídæ plebis corda demúlcet. Et bene sanctus Lucas virum ab spíritu nequítiæ liberátum ante præmísit, et subdit féminæ sanitátem. Utrúmque enim sexum Dóminus curatúrus advénerat: sed prior sanári débuit, qui prior creátus est; nec prætermítti illa, quæ mobilitáte magis ánimi, quam pravitáte peccáverat.

    Sábbato medicínæ Domínicæ ópera cœpta signíficat, ut inde nova creatúra cœ́perit, ubi vetus creatúra ante desívit: nec sub lege esse Dei Fílium, sed supra legem in ipso princípio designáret: nec solvi legem, sed impléri. Neque enim per legem, sed verbo factus est mundus, sicut légimus: Verbo Dómini cæli firmáti sunt. Non sólvitur ergo lex, sed implétur: ut fiat renovátio hóminis jam labéntis. Unde et Apóstolus ait: Exspoliántes vos véterem hóminem, indúite novum, qui secúndum Deum creátus est.

    Et bene sábbato cœpit, ut ipsum se osténderet Creatórem, qui ópera opéribus intéxeret, et prosequerétur opus, quod ipse jam cœ́perat: ut si domum faber renováre dispónat, non a fundaméntis, sed a culmínibus íncipit sólvere vetustátem. Itaque ibi prius manum ádmovet, ubi ante desíerat: deínde a minóribus íncipit, ut ad majóra pervéniat. Liberáre a dǽmone et hómines, sed in verbo Dei possunt: resurrectiónem mórtuis imperáre, divínæ solíus est potestátis. Fortássis étiam in typo mulíeris illíus socrus Simónis et Andréæ, váriis críminum fébribus caro nostra languébat, et diversárum cupiditátum immódicis æstuábat illécebris. Nec minórem febrem amóris esse díxerim, quam calóris. Itaque illa ánimum, hæc corpus inflámmat. Febris enim nostra, avarítia est: febris nostra, libído est: febris nostra, luxúria est: febris nostra, ambítio est: febris nostra, iracúndia est.
  en: |
    Continuation of the Holy Gospel according to Luke Luke 4:38 At that time Jesus arose out of the synagogue, and entered into Simon's house. And Simon's wife's mother was taken with a great fever. And so on. Homily by St. Ambrose, Bishop of Milan Bk. 4 on Luke iv Behold here how long-suffering is the Lord our Redeemer! Neither moved to anger against them, nor sickened at their guilt, nor outraged by their attacks, did He leave the Jews' country. Nay, forgetting their iniquity, and mindful only of His mercy, He strove to soften their hard and unbelieving hearts, sometimes by His teaching, and sometimes by freeing some of them, and sometimes by healing them. St. Luke doth well to tell us first of the man who was delivered from an unclean spirit, and then of the healing of a woman. The Lord indeed came to heal both sexes, but that must be healed first which was created first, and then must not she be passed by whose first sin arose rather from fickleness of heart than from depraved will.

    That the Lord began to heal on the Sabbath-day showeth in a figure how that the new creation beginneth where the old creation ended. It showeth, moreover, that the Son of God, Who is come not to destroy the law but to fulfill the law, Matth. v. 17, is not under the law, but above the law. Neither was it by the law, but by the Word, that the world was created, as it is written “By the Word of the Lord were the heavens made.” Ps. xxxii. 6. The law, then, is not destroyed, but fulfilled, in the Redemption of fallen man. Whence also the Apostle saith: “Put off, concerning the former conversation, the old man, which is corrupt according to the deceitful lusts and be renewed in the spirit of your mind and put on the new man, which after God is created in righteousness and true holiness.” Eph. iv. 22.

    It was well that He began to heal on the Sabbath, that He might show Himself to be the Creator, weaving in one with another of His works, and continuing that which He had already begun, even as a workman, being to repair an house, beginneth not to take down that which is old from the foundations, but from the roof. Thus doth the Lord begin to lay to His hand again, in that place whence last He hath lifted it; then He beginneth which after God is created in righteousness and true holiness: Eph. iv. 22. with things lesser, that He may go on to things greater. Even men are able to deliver other men from evil spirits, albeit with the word of God: to command the dead to rise again is for God's power alone. Perchance, also, this woman, the mother-in-law of Simon and Andrew, was a type of our nature, stricken down with the great fever of sin, and burning with unlawful lusts after diverse objects. Nor would I say that the passion which rageth in the mind is a lesser fire than that fever which burneth the body. Covetousness, and lust, and uncleanness, and vain desires, and strivings, and anger, these be our fevers.
responsory:
  la: |
    ℟. Repléti sunt omnes Spíritu Sancto: et cœpérunt loqui, prout Spíritus Sanctus dabat éloqui illis: * Et convénit multitúdo dicéntium, allelúja. ℣. Loquebántur váriis linguis Apóstoli magnália Dei. ℟. Et convénit multitúdo dicéntium, allelúja.
  en: |
    ℟. They were all filled with the Holy Ghost, and began to speak, as the Holy Ghost gave them utterance; * And the multitude came together, saying: Alleluia. ℣. The Apostles spoke in diverse tongues the wonderful works of God. ℟. And the multitude came together, saying: Alleluia.
status:
  la: verified
  en: verified
