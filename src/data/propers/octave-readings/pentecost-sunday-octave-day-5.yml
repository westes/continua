id: pentecost-sunday-octave-day-5
source:
  la: "Léctio sancti Evangélii secúndum Lucam"
  en: "Reading from the Holy Gospel according to Luke"
text:
  la: |
    Léctio sancti Evangélii secúndum Lucam Luc 9:1-6 In illo témpore: Convocátis Jesus duódecim Apóstolis, dedit illis virtútem et potestátem super ómnia dæmónia, et ut languóres curárent. Et réliqua. Homilía sancti Ambrósii Epíscopi Liber 6 in cap. 9 Lucæ Qualis débeat esse, qui evangelízat regnum Dei, præcéptis evangélicis designátur: ut sine virga, sine pera, sine calceaménto, sine pane, sine pecúnia, hoc est, subsídii sæculáris adminícula non requírens, fidéque tutus, putet sibi quo minus ea requírat, magis posse suppétere. Quæ possunt, qui volunt, ad eum deriváre tractátum, ut spiritálem tantúmmodo locus iste formáre videátur afféctum: qui velut induméntum quoddam videátur córporis exuísse, non solum potestáte rejécta contemptísque divítiis, sed étiam carnis ipsíus illécebris abdicátis. Quibus primo ómnium datur pacis atque constántiæ generále mandátum, ut pacem ferant, constántiam servent, hospitális necessitúdinis jura custódiant: aliénum a prædicatóre regni cæléstis ástruens cursitáre per domos, et inviolábilis hospítii jura mutáre.

    Sed, ut hospítii grátia deferénda censétur: ita étiam, si non recipiántur, excutiéndum púlverem, et egrediéndum de civitáte mandátur. Quo non medíocris boni remunerátio docétur hospítii: ut non solum pacem tribuámus hospítibus, verum étiam, si qua eos terrénæ obúmbrant delícta levitátis, recéptis apostólicæ prædicatiónis vestígiis auferántur. Nec otióse secúndum Matthǽum, domus, quam ingrediántur Apóstoli, eligénda decérnitur: ut mutándi hospítii, necessitudinísque violándæ causa non súppetat. Non tamen éadem cáutio receptóri mandátur hospítii: ne, dum hospes elígitur, hospitálitas ipsa minuátur.

    Sed hæc, ut secúndum lítteram de hospítii religióne venerábilis est forma præcépti: ita étiam de mystério senténtia cæléstis arrídet. Etenim cum domus elígitur, dignus hospes inquíritur. Videámus ígitur, ne forte Ecclésia præferénda designétur, et Christus. Quæ enim dígnior domus apostólicæ prædicatiónis ingréssu, quam sancta Ecclésia? Aut quis præferéndus magis ómnibus vidétur esse quam Christus, qui pedes suis laváre consuévit hospítibus: et quoscúmque sua recéperit domo, pollútis non patiátur habitáre vestígiis; sed maculósos licet vitæ prióris, in réliquum tamen dignétur mundáre procéssus? Hic est ígitur solus, quem nemo debet desérere, nemo mutáre. Cui bene dícitur: Dómine, ad quem íbimus? verba vitæ ætérnæ habes, et nos crédimus.
  en: |
    Continuation of the Holy Gospel according to Luke Luke 9:1-6 At that time: Jesus called His twelve disciples together, and gave them power and authority over all devils, and to cure diseases. And so on. Homily by St. Ambrose, Bishop of Milan Bk. 6 on Luke ix We learn from the commandments of the Gospel what manner of men they ought to be who preach the glad tidings of the kingdom of God “Take nothing for your journey neither staves nor scrip, neither bread neither money.” Thus let the Apostle destitute of earthly help, and panoplies in faith, deem himself able to do all the more, as he needeth all the less Such as please may also put upon these words a spiritual interpretation in that a man may be said to lay as the encumbrances of the body, not only by abdicating power, and casting away riches, but also by denying the very body itself its pleasures. The first general commandment given to the Apostles touching their manners was to be bringers of peace, Matth. x. 13, and to be no gadders about, but keepers of the laws of guests. To wander from house to house, and to abuse the rights of hospitality, are things alien to a preacher of the kingdom of heaven.

    But as the kindness of hospitality is to be met with courtesy, so also is it said “Whosoever will not receive you, when ye go out of that city, shake off the very dust from your feet, for a testimony against them.” Hereby is it taught that hospitality doth meet with a good reward, since not only do we bring peace to such as receive us, but also, if they be shadowed by some earthly vanities, these defects are taken away, where enter the feet of them that bear the glad tidings of Apostolic preachment. It is well written in Matthew x. 11: “Into whatsoever city or town ye shall enter, inquire who in it is worthy and there abide till ye go thence” thus avoiding any possible need of going from house to house. But no such selection is commanded to him that giveth hospitality, lest his hospitality itself should be lessened, while he picketh his guests.

    This passage, taken according to the plain meaning, is a sacred commandment touching the religious duty of hospitality, but its heavenly words likewise hint at a mystery. When the house is chosen, it is asked if the master thereof be worthy. Let us see if this be not perchance a figure of the Church, and her Master, Christ. What worthier house can the Apostolic preacher enter, than the Holy Church? Or what host is more to be preferred before all others, than Christ, Whose use it is to wash the feet of His guests yea, Who suffereth not that any whom He receiveth into His house should dwell there with foul feet, but, defiled as they are by their former wanderings, doth vouchsafe to change them into new and clean livers. He Alone is He, from Whose house no man ought ever to go forth, nor change His roof for any other shelter, for unto Him it is well said “Lord, to whom shall we go? Thou hast the words of eternal life, and we believe.” John vi. 68, 69.
responsory:
  la: |
    ℟. Advénit ignis divínus, non combúrens sed illúminans, non consúmens sed lucens: et invénit corda discipulórum receptácula munda: * Et tríbuit eis charísmatum dona, allelúja, allelúja. ℣. Invénit eos concórdes caritáte, et collustrávit eos inúndans grátia Deitátis. ℟. Et tríbuit eis charísmatum dona, allelúja, allelúja.
  en: |
    ℟. The fire of God fell, not to burn them, but to enlighten them not to devour them, but to illuminate them and found the hearts of the disciples clean vessels. * And He gave them gifts of His grace. Alleluia, Alleluia. ℣. He found them one in love, and the out-poured grace of the Godhead shone through them. ℟. And He gave them gifts of His grace. Alleluia, Alleluia.
