# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2026-05-26). Matins reading for day 3 of Pentecost's
# own octave -- a direct Scripture reading (Joel 2:23-28, the same prophecy
# Pentecost's own feast draws on), resolved from data/scripture/joel-2.yml.
# The source's own English page didn't render a translation for this passage;
# its English is the standard Douay-Rheims wording (a known, recognized
# translation, not a draft).
id: pentecost-sunday-octave-day-3
source:
  la: "De Joéle Prophéta"
  en: "From the Prophet Joel"
passages:
  - { book: joel, chapter: 2, verses: "23-24" }
  - { book: joel, chapter: 2, verses: "25-26" }
  - { book: joel, chapter: 2, verses: "27-28" }
responsory:
  la: |
    R. Apparuérunt Apóstolis dispertítæ linguæ tamquam ignis, allelúia: * Sedítque supra síngulos eórum Spíritus Sanctus, allelúia, allelúia. V. Et cœpérunt loqui váriis linguis, prout Spíritus Sanctus dabat éloqui illis. R. Sedítque supra síngulos eórum Spíritus Sanctus, allelúia, allelúia.
  en: |
    R. There appeared unto the Apostles cloven tongues, like as of fire. Alleluia. * And the Holy Ghost sat upon each of them. Alleluia, Alleluia. V. And they began to speak with other tongues, as the Holy Ghost gave them utterance. R. And the Holy Ghost sat upon each of them. Alleluia, Alleluia.
status:
  la: verified
  en: verified
