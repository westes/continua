# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Tempora/Pent02-4.txt) -- day 8, "In Octava," Corpus Christi's own octave
# closing day, same shape/rationale as corpus-christi-octave-day-2.yml.
# Joins St. Cyril of Jerusalem's mystagogical catechesis on the institution
# narrative (Lectio4-6) with St. Cyril of Alexandria's commentary on John 6
# (Lectio7-9, same Gospel pericope as every other day in this octave; bare
# incipit dropped). Responsory now sourced -- day 2's own resolution
# applies here too: reuse corpus-christi.yml's own Nocturn 2 responsory,
# "Cenántibus illis," across every combined-lesson octave day.
id: corpus-christi-octave-day-8
source:
  la: "Sermo sancti Cyrílli Epíscopi Jerosolymitáni; Homilía sancti Cyrílli Epíscopi Alexandríni"
  en: "Sermon of St. Cyril, Bishop of Jerusalem; Homily of St. Cyril, Bishop of Alexandria"
text:
  la: |
    Ipsa beáti Pauli doctrína abúnde suffícere vidétur, ut certam vobis de divínis mystériis fidem fáciat, quibus digni rédditi, concorpórei, ut ita dicam, et consanguínei Christi facti estis. Ipse enim modo clamábat, quod in nocte qua tradebátur Dóminus noster Jesus Christus, accípiens panem, et grátias agens fregit, et dedit discípulis suis, dicens: Accípite, et manducáte: hoc est corpus meum. Et accípiens cálicem, et grátias agens, dixit: Accípite, et bíbite: hic est sanguis meus. Cum ígitur ipse de pane pronuntiáverit ac díxerit: Hoc est corpus meum; quis audébit deínceps ambígere? Et cum idem ipse tam asseveránter díxerit: Hic est sanguis meus; quis umquam dubitáverit, ut dicat non esse ejus sánguinem?

    Aquam olim in vinum convértit in Cana Galilǽæ, quod habet quamdam cum sánguine propinquitátem: et eum parum dignum existimábimus, cui credámus quod vinum in sánguinem transmutárit? Ad eas núptias, quibus córpora copulántur, vocátus, præter opiniónem ómnium hoc fecit miráculum: et non multo magis sic eum corpus et sánguinem suum fruénda nobis donásse persuásum fírmiter habébimus, ut ea cum omni certitúdine tamquam corpus ipsíus et sánguinem sumámus? Nam in spécie panis dat nobis corpus, et in spécie vini dat nobis sánguinem: ut, cum súmpseris, gustes corpus et sánguinem Christi, factus ejúsdem córporis et sánguinis párticeps. Sic enim effícimur Christíferi, hoc est, Christum in corpóribus nostris feréntes, cum corpus ejus et sánguinem in membra nostra recípimus: sic secúndum beátum Petrum, divínæ natúræ consórtes réddimur.

    Olim cum Judǽis Christus dísserens, Nisi manducavéritis, inquit, carnem meam, et bibéritis meum sánguinem, non habébitis vitam in vobis. Cum autem illi, quæ dicta fúerant, non spiritáliter accepíssent, offénsi abiérunt retro; putábant enim quod eos ad manducándas carnes hortarétur. Erant et in véteri testaménto panes propositiónis; verum illi cum fúerint véteris testaménti, finem jam accepérunt. In novo vero testaménto panis est cæléstis et calix salutáris, qui et ánimam et corpus sanctíficant. Quam ob rem non sic hæc atténdas velim, tamquam sint nudus et simplex panis, nudum et simplex vinum; corpus enim sunt et sanguis Christi. Nam étiam si sensus illud tibi renúntiat, fides tamen te confírmet. Ne júdices rem ex gustu: sed te citra ullam dubitatiónem fides certum reddat, quod sis dignus factus, qui córporis et sánguinis Christi párticeps fíeres.

    Qui mandúcat, inquit, carnem meam et bibit sánguinem meum, in me manet, et ego in illo. Sicut enim si quis liquefáctæ ceræ áliam ceram infúderit, álteram cum áltera per totum commísceat necésse est; sic qui carnem et sánguinem Dómini récipit, cum ipso ita conjúngitur, ut Christus in ipso, et ipse in Christo inveniátur. Símili quodam modo apud Matthǽum compéries. Símile est, inquit, regnum cælórum ferménto, quod accéptum abscóndit múlier in farínæ satis tribus. Sicut parum, ut Paulus ait, ferménti totam massam ferméntat, sic párvula benedíctio totum hóminem in seípsam áttrahit, et sua grátia replet; et hoc modo in nobis Christus manet, et nos in Christo.

    Nos vero, si vitam ætérnam cónsequi vólumus, si largitórem immortalitátis habére in nobis desiderámus, ad recipiéndam benedictiónem libénter concurrámus; caveamúsque ne loco láquei damnósam religiónem diábolus nobis præténdat. Recte, inquis, dicis; scriptum tamen esse non ignorámus, judícium sibi comédere atque bíbere illum, qui de pane cómedit et de cálice bibit indígne. Ego ígitur probo meípsum, et indígnum invénio. Quando ígitur, quicúmque tu es qui ista dicis, dignus eris? quando Christo teípsum ófferes? Nam si peccándo indígnus es, et peccáre non désinis, expers omníno eris vivíficæ hujus sanctificatiónis.

    Quare pias, quæso, cogitatiónes suscípias, studióse sanctéque vivas, et benedictiónem partícipes: quæ, mihi crede, non mortem solum, verum étiam morbos omnes depéllit. Sedat enim, cum in nobis máneat Christus, sæviéntem membrórum nostrórum legem: pietátem corróborat, perturbatiónes ánimi exstínguit, ægrótos curat, collísos redíntegrat: et sicut pastor bonus, qui ánimam suam pro óvibus pósuit, ab omni nos érigit casu.
  en: |
    The teaching of the blessed Paul seemeth of itself enough instruction for you concerning those Divine Mysteries, whereof, if ye be made worthy, ye become therein, so to speak, of one Body and of one Blood with Christ. Paul saith that our Lord Jesus Christ, "the same night in which He was betrayed, took bread; and, when He had given thanks, He brake it, and gave it unto His disciples, saying: Take, eat: this is My Body." After the same manner also He took the cup, and gave thanks, "and said: Take this, and drink it: this is My Blood." Since therefore it is He Who hath definitely stated and said, touching that Bread, "This is My Body" — who will dare any longer to doubt that It is so? And since it is He again that hath absolutely affirmed and said, touching that cup, "This is My Blood" — who is he that will doubt any longer, or say that It is not His Blood?

    At the beginning of His ministry, at Cana in Galilee, the Lord turned water into wine, a thing which hath some qualities in common with blood; and shall we deem Him less worthy that we should believe Him, when He turneth wine into Blood? When He was bidden to that marriage wherein twain were made one flesh, He did the beginning of His miracles to the amazement of all men; and shall we less surely hold that He hath given us His Body and Blood to be our meat and drink, or take them with weaker faith that they are indeed His Body and His Blood? Under the appearance of bread He giveth unto us His Body, and, under the appearance of wine, His Blood; and when thou shalt come to receive, it is on the Body and Blood of Christ that thou wilt feed, being made a partaker of His Body and of His Blood. Thus indeed it is that we become Christ-bearers, namely, by carrying about Christ in our bodies, when we receive His Body and Blood into our own frames. Thus, as the blessed Peter hath it, we are "partakers of the Divine nature."

    Christ once said, in conversing with the Jews: "Except ye eat the Flesh of the Son of Man, and drink His Blood, ye have no life in you." But they took not spiritually that which He said, and "from that time many of His disciples went back, and walked no more with Him." They thought that He had bidden them to eat flesh. The Old Testament also had Shewbread, but this Old Testament bread was now to have an end. The bread of the New Testament is "the Bread Which cometh down from heaven," the cup of the New Testament, the Cup of Salvation, that Bread and that Cup Which hallow both souls and bodies. Wherefore I will have thee to understand that the Bread and Wine whereunto thou art to come are not mere common bread or mere common wine, for they are the Body and the Blood of Christ. Even if thy senses do indeed deny this fact, yet let faith make thee right sure of it. Judge not the Thing by the taste thereof, but let faith assure thee beyond all doubt that thou art partaking of the Body and Blood of Christ.

    "He that eateth My Flesh and drinketh My Blood," saith the Lord, "dwelleth in Me, and I in him." If a man take two pieces of wax and melt them, and pour the one into the other, they necessarily mingle; so also, he that receiveth the Body and Blood of the Lord doth become so joined with the Lord that he is to be found in Christ, and Christ in him. Another comparison thou wilt find in Matthew. The Lord there saith: "The kingdom of heaven is like unto leaven, which a woman took, and hid in three measures of meal, till the whole was leavened," because, as Paul saith, "a little leaven leaveneth the whole lump." So also doth a little of this Blessing draw the whole man unto Itself, and fill him with Its grace; and thus doth Christ dwell in us, and we in Christ.

    As for ourselves, if we would win life everlasting; if we would that the Giver of immortality should dwell in us, let us run freely to receive this Blessing, and let us beware that the devil succeed not in laying a stumbling-block in our way, in the shape of a mistaken reverence. Thou rightly sayest, and we know well, how that it is written: "Whosoever shall eat this Bread and drink this Cup of the Lord unworthily eateth and drinketh damnation to himself." I therefore examine myself and find myself unworthy. And I ask thee, who citest these words to me, who shall ever be found worthy? When wilt thou be such an one as may be worthy to be offered to Christ? If by sin thou art unworthy, and thou ceasest not to sin, thou shalt for ever lack this means of life and sanctification.

    Therefore, I counsel thee to betake thee to godly thoughts, and to live carefully and holily, and so to receive that Blessing — a Blessing which, believe me, doth banish, not death only, but all diseases likewise. For when Christ dwelleth in us, He stilleth the law of death in our members, which warreth against the law of our mind; He giveth strength to godliness, He turneth to calm the turbulent surging of our mind, He cureth them which are sick, He raiseth up them which are fallen, and, like the Good Shepherd, Which giveth His life for the sheep, He prevaileth that the sheep perish not.
responsory:
  la: |
    R. Cenántibus illis, accépit Jesus panem, et benedíxit, ac fregit, dedítque discípulis suis, et ait: * Accípite et comédite: hoc est corpus meum. V. Dixérunt viri tabernáculi mei: Quis det de cárnibus ejus, ut saturémur? R. Accípite et comédite: hoc est corpus meum.
  en: |
    R. As they were eating, Jesus took bread, and blest it, and brake it, and gave it to the disciples, and said: * Take, eat; this is My Body. V. The men of my tabernacle said: O that we had of his flesh, we cannot be satisfied. R. Take, eat; this is My Body.
