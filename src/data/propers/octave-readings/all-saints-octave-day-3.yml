responsory:
  la: |
    R. Vidi Dóminum sedéntem super sólium excélsum et elevátum, et plena erat omnis terra majestáte ejus: * Et ea, quæ sub ipso erant, replébant templum. V. Séraphim stabant super illud: sex alæ uni, et sex alæ álteri. R. Et ea, quæ sub ipso erant, replébant templum.
  en: |
    R. I saw the Lord sitting upon a throne, high and lifted up, and the whole earth was full of His glory; * And His train filled the temple. V. Above it stood the Seraphim each one had six wings. R. And His train filled the temple.
