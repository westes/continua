# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-11-3). Matins reading for day 3 of All Saints' own
# octave -- collapsed into one continuous reading per project convention. A
# continuous reading from the book of Ezechiel, read straight through across
# the whole octave (a different excerpt each day), not repeated -- confirmed
# via each day's own Invitatory (the same distinctive All Saints antiphon
# every day, Nov 2 included, so this app's own exclusion of All Souls' Day as
# a different liturgical genre doesn't conflict with this octave's real Matins
# content). The source's own English translation is used as-is, including gaps
# in its own punctuation (some older "oct"/"bmv"-suffixed variant files drop
# question marks entirely in places) -- not corrected here, since guessing
# where they belong isn't the same class of fix as an isolated single-
# character typo.
id: all-saints-octave-day-3
source: "De Ezechiéle Prophéta"
text:
  la: |
    De Ezechiéle Prophéta Ezek 2:2-5 2 Et audívi loquéntem ad me, 3 Et dicéntem: Fili hóminis, mitto ego te ad fílios Israël, ad gentes apostatríces quæ recessérunt a me; ipse et patres eórum prævaricáti sunt pactum meum usque ad diem hanc; 4 Et fílii dura fácie et indomábili corde sunt, ad quos ego mitto te, et dices ad eos: Hæc dicit Dóminus Deus: 5 Si forte vel ipsi áudiant, et si forte quiéscant, quóniam domus exásperans est: et scient quia prophéta fúerit in médio eórum.

    Ezek 2:6-7 6 Tu ergo, fili hóminis, ne tímeas eos, neque sermónes eórum métuas, quóniam incréduli et subversóres sunt tecum, et cum scorpiónibus hábitas. Verba eórum ne tímeas, et vultus eórum ne formídes, quia domus exásperans est. 7 Loquéris ergo verba mea ad eos, si forte áudiant et quiéscant, quóniam irritatóres sunt.

    Ezek 2:8-9 8 Tu autem, fili hóminis, audi quæcúmque loquor ad te, et noli esse exásperans, sicut domus exasperátrix est: áperi os tuum, et cómede quæcúmque ego do tibi. 9 Et vidi, et ecce manus missa ad me, in qua erat involútus liber: et expándit illum coram me, qui erat scriptus intus et foris, et scriptæ erant in eo lamentatiónes, et carmen, et væ.
  en: |
    Lesson from the book of Ezekiel Ezek 2:2-5 2 And the spirit entered into me after that he spoke to me, and he set me upon my feet: and I heard him speaking to me, 3 And saying: Son of man, I send thee to the children of Israel, to a rebellious people, that hath revolted from me, they, and their fathers, have transgressed my covenant even unto this day. 4 And they to whom I send thee are children of a hard face, and of an obstinate heart: and thou shalt say to them: Thus saith the Lord God: 5 If so be they at least will hear, and if so be they will forbear, for they are a provoking house: and they shall know that there hath been a prophet in the midst of them.

    Ezek 2:6-7 6 And thou, O son of man, fear not, neither be thou afraid of their words: for thou art among unbelievers and destroyers, and thou dwellest with scorpions. Fear not their words, neither be thou dismayed at their looks: for they are a provoking house. 7 And thou shalt speak my words to them, if perhaps they will hear, and forbear: for they provoke me to anger.

    Ezek 2:8-9 8 But thou, O son of man, hear all that I say to thee: and do not thou provoke me, as that house provoketh me: open thy mouth, and eat what I give thee. 9 And I looked, and behold, a hand was sent to me, wherein was a book rolled up: and he spread it before me, and it was written within and without: and there were written in it lamentations, and canticles, and woe.
responsory:
  la: |
    ℟. Vidi Dóminum sedéntem super sólium excélsum et elevátum, et plena erat omnis terra majestáte ejus: * Et ea, quæ sub ipso erant, replébant templum. ℣. Séraphim stabant super illud: sex alæ uni, et sex alæ álteri. ℟. Et ea, quæ sub ipso erant, replébant templum.
  en: |
    ℟. I saw the Lord sitting upon a throne, high and lifted up, and the whole earth was full of His glory; * And His train filled the temple. ℣. Above it stood the Seraphim each one had six wings. ℟. And His train filled the temple.
status:
  la: verified
  en: verified
