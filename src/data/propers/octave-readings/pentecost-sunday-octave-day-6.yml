id: pentecost-sunday-octave-day-6
source:
  la: "Léctio sancti Evangélii secúndum Lucam"
  en: "Reading from the Holy Gospel according to Luke"
text:
  la: |
    Léctio sancti Evangélii secúndum Lucam Luc 5:17-26 In illo témpore: Factum est in una diérum, et Jesus sedébat docens. Et erant pharisǽi sedéntes, et legis doctóres, qui vénerant ex omni castéllo Galilǽæ et Judǽæ, et Jerúsalem: et virtus Dómini erat ad sanándum eos. Et réliqua. Homilía sancti Ambrósii Epíscopi Liber 5 in cap. 5 Lucæ, post initium Non otiósa hujus paralýtici, nec angústa medicína est, quando Dóminus et orásse præmíttitur; non útique propter suffrágium, sed propter exémplum. Imitándi enim spécimen dedit, non precándi ámbitum requisívit. Et conveniéntibus ex omni Galilǽa, et Judǽa, et Jerúsalem, legis doctóribus, inter ceterórum remédia debílium, paralýtici istíus medicína descríbitur. Primum ómnium, quod ante díximus, unusquísque æger peténdæ precatóres salútis debet adhibére, per quos nostræ vitæ compágo resolúta, actuúmque nostrórum clauda vestígia, verbi cæléstis remédio reforméntur.

    Sint ígitur áliqui monitóres mentis, qui ánimum hóminis, quamvis exterióris córporis debilitáte torpéntem, ad superióra érigant. Quorum rursus adminículis et attóllere et humiliáre se fácilis ante Jesum locétur, Domínico vidéri dignus aspéctu. Humilitátem enim réspicit Dóminus: quia respéxit humilitátem ancíllæ suæ. Quorum fidem ut vidit, dixit: Homo, remittúntur tibi peccáta tua. Magnus Dóminus, qui aliórum mérito ignóscit áliis: et dum álios probat, áliis reláxat erráta. Cur apud te, homo, colléga non váleat, cum apud Deum servus et interveniéndi méritum, et jus hábeat impetrándi?

    Disce, qui júdicas, ignóscere: disce, qui æger es, impetráre. Si grávium peccatórum diffídis véniam, ádhibe precatóres, ádhibe Ecclésiam, quæ pro te precétur, cujus contemplatióne, quod tibi Dóminus negáre posset, ignóscat. Et quamvis históriæ fidem non debeámus omíttere, ut vere paralýtici istíus corpus credámus esse sanátum: cognósce tamen interióris hóminis sanitátem, cui peccáta donántur. Cum Judǽi ásserunt peccáta a solo Deo posse concédi, Deum útique eum confiténtur; suóque judício perfídiam suam produnt, qui opus ástruunt, ut persónam negent.
  en: |
    Continuation of the Holy Gospel according to Luke Luke 5:17-26 At that time, it came to pass on a certain day, as Jesus sat and taught, that there were Pharisees, and Doctors of the law sitting by, which were come out of every town in Galilee, and Judaea and Jerusalem and the power of the Lord was present to heal them. And so on. Homily by St. Ambrose, Bishop of Milan Book 5 on Luke v “And, behold, men brought in a bed a man which was taken with a palsy.” The healing of this paralytic was not idle, nor its fruits limited to himself. The Lord healed him, or ever he could ask, not because of the entreaties of others, but for example's sake. He gave a pattern to be followed, and sought not the intercession of prayer. In the presence of the Pharisees and doctors of the law, which were come out of every town of Galilee, and Judaea, and Jerusalem, many sick folk were healed, but among them is specially described the healing of this paralytic. First of all, as we have before said, every sick man ought to engage his friends to offer up prayers for his recovery, that so the tottering framework of this our life, and the distorted feet of our works, may be righted by the healing power of the word from heaven.

    Here ought therefore to be advisers, who should rouse up the minds of the sick to higher things, since when the body becometh languid with sickness, the mind is apt to follow its example. With the help of such friends he can be brought and laid on the ground before the Feet of Jesus, and seem worthy of a glance from the Lord for the Lord looketh upon such as lie lowly before Him, “for He hath regarded the lowliness of His handmaiden” Luke ii. 48. “And when He saw their faith, He said unto him Man, thy sins are forgiven thee.” Great is the Lord, Who, for the sake of some, forgiveth the sins of others Who trieth some, and pardoneth the wanderings of others. Why should thine equal, O man, avail not with thee, if a slave have won power to intercede, and right to obtain, with God?

    O Thou that judgest, learn to forgive thou that art sick, to pray. If thou doubt of the pardon of thy sins, because of their grievousness, get thee to the Church, that she may pray for thee, and that the Lord, accepting her countenance, may grant to her petitions what He refuses to thine. And although we are bound to accept this history as one of fact, and to believe that the body of the paralytic was healed yet remember thou also his inward cure, unto whom his sins were forgiven. The Jews said: “Who can forgive sins but God alone?” And in these words they confessed the Godhead of Him Who forgave the sins of the paralytic, and themselves condemned their own unbelief in Him Whose work they acknowledged, but Whose Person they denied.
responsory:
  la: |
    ℟. Non vos me elegístis, sed ego elégi vos, et pósui vos: * Ut eátis, et fructum afferátis, et fructus vester máneat, allelúja, allelúja. ℣. Sicut misit me Pater, et ego mitto vos. ℟. Ut eátis, et fructum afferátis, et fructus vester máneat, allelúja, allelúja.
  en: |
    ℟. Ye have not chosen Me, but I have chosen you, and ordained you * That ye should go and bring forth fruit, and that your fruit should remain. Alleluia, Alleluia. ℣. As My Father hath sent Me, even so send I you. ℟. That ye should go and bring forth fruit, and that your fruit should remain. Alleluia, Alleluia.
status:
  la: verified
  en: verified
