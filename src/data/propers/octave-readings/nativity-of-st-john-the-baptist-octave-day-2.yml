# Verified against Divinum Officium (Sancti/06-25oct.txt, "Die secunda infra
# Octavam Nativitatis S. Joannis Baptistae"), 2026-10-16. Lessons 4-9
# collapsed into one continuous reading per project convention (Augustine's
# sermon, the Gospel incipit, Ambrose on Luke). The source has no English
# for this day at all, so the English is a translation done for this
# project, draft, not verified against any source (same precedent as
# assumption-octave-day-2.yml). Days 3, 5, 6 and 7 read the feast's own
# lessons in the source and have no reading of their own here.
id: nativity-of-st-john-the-baptist-octave-day-2
source:
  la: "Sermo sancti Augustini Episcopi et Homilia sancti Ambrosii"
  en: "St. Augustine, Sermon 21 on the Saints; St. Ambrose on Luke"
text:
  la: |
    Natálem sancti Joánnis, fratres caríssimi, hódie celebrámus: quod nulli umqua Sanctórum légimus fuísse concéssum. Solíus enim Dómini, et beáti Joánnis dies nativitátis in univérso mundo celebrátur et cólitur. Hunc enim stérilis péperit, illum virgo concépit: in Elísabeth sterílitas víncitur, in beáta María conceptiónis consuetúdo mutátur. Elísabeth virum cognoscéndo, fílium génuit: María Angelo crédidit, et concépit. Hóminem concépit Elísabeth, hóminem et María: sed Elísabeth solum hóminem, María Deum et hóminem.

    Magnus ígitur Joánnes, cujus magnitúdini étiam Salvátor testimónium perhibet, dicens: Non surréxit inter natos mulíerum major Joánne Baptísta. Præcéllit céteros, éminet univérsis: antecéllit Prophétas, supergréditur Patriárchas: et quisquis de mulíere natus est, inférior est Joánne. Dicet fortásse áliquis: Si inter natos mulíerum Joánnes major est, major est Salvatóre? Absit. Joánnes enim natus mulíeris, Christus autem vírginis natus est. Ille corruptíbilis úteri sínibus effúsus est, iste impollútæ vírginis flore progénitus.

    Si ergo intellígimus mystérium, fratres mei, Joánnes homo est, Christus Deus est. Humiliétur homo, ut exaltétur Deus, secúndum illud quod de Dómino ipse Joánnes dixit: Illum opórtet créscere, me autem mínui. Ut humiliarétur homo, hódie natus est Joánnes, quo incípiunt decréscere dies: ut exaltétur Deus, eо die natus est Christus, quo incípiunt créscere dies. Magnum sacraméntum, fratres caríssimi. Ideo celebrámus natálem Joánnis sicut et Christi, quia et ipsa natívitas plena est mystério. Quo mystério, nisi humilitátis nostræ, sicut natívitas Christi plena est mystério altitúdinis nostræ?

    Elísabeth implétum est tempus pariéndi, et péperit fílium. Et audiérunt vicíni et cognáti ejus quia magnificávit Dóminus misericórdiam suam cum illa, et congratulabántur ei. Et réliqua.

    Joánnes est, inquit, nomen ejus. Non póterat Elísabeth Dómini ignoráre prænúntium, quæ prophetáuerat Christum. Et bene ádditur: Quia nemo in cognatióne ejus vocabátur hoc nómine: ut intélligas nomen non géneris esse, sed vatis. Zacharías quoque nutu interrogátor: sed quia incredúlitas ei affátum eripúerat et audítum, quod voce non póterat, manu et lítteris est locútus.

    Scripsit autem dicens: Joánnes est nomen ejus. Et hic nomen non impónitur, sed astrúitur. Meritóque contínuo resolúta est lingua ejus: quia quam vínxerat incredúlitas, fides solvit. Credámus et nos ígitur, ut loquámur; ut lingua nostra, quæ incredulitátis vínculis est ligáta, ratiónis voce solvátur.

    Scribámus spíritu mystéria, si vólumus loqui: scribámus prænúntium Christi, non in tábulis lapidéis, sed in tábulis cordis carnálibus. Etenim qui Joánem lóquitur, Christum prophétat. Loquámur Joánnem, loquámur et Christum: ut nostrum quoque os possit aperíri, quod in sacerdóte tanto, irrationális modo pécudis, fræna nutántis fídei coërcebant.
  en: |
    Today, dearly beloved brethren, we celebrate the birthday of St. John, a thing we read to have been granted to no other of the saints. For of the Lord alone, and of blessed John, is the day of birth kept and honoured throughout the whole world. A barren woman bore him; a virgin conceived the other. In Elizabeth barrenness is overcome; in blessed Mary the common course of conception is changed. Elizabeth bore a son by knowing her husband; Mary believed the Angel, and conceived. Elizabeth conceived a man, and Mary a man also; but Elizabeth conceived only a man, Mary both God and man.

    Great, then, is John, to whose greatness even the Saviour bears witness, saying: Among them that are born of women there hath not risen a greater than John the Baptist. He excels the rest, he stands above them all; he surpasses the Prophets, he rises above the Patriarchs; and whoever is born of a woman is lesser than John. Someone will perhaps say: If John is greater among those born of women, is he greater than the Saviour? Far from it. For John was born of a woman, but Christ was born of a virgin. The one came forth from the bosom of a womb that knew corruption; the other was brought forth by the flower of an untouched virgin.

    If, then, my brethren, we understand the mystery, John is man, Christ is God. Let the man be humbled that God may be exalted, according to what John himself said of the Lord: He must increase, but I must decrease. That the man might be humbled, John was born today, from which day the days begin to shorten; that God might be exalted, Christ was born on the day from which the days begin to lengthen. It is a great mystery, dearly beloved brethren. We therefore celebrate the birthday of John as of Christ, because the birth itself is full of mystery. What mystery? That of our humility, just as the birth of Christ is full of the mystery of our exaltation.

    From the Holy Gospel according to Luke: Elizabeth's full time came that she should be delivered, and she brought forth a son. And her neighbours and her cousins heard how the Lord had showed great mercy upon her, and they rejoiced with her. And so on.

    His name is John, he says. Elizabeth could not fail to recognise the herald of the Lord, she who had prophesied of Christ. And it is well added: There is none of thy kindred that is called by this name; that thou mayest understand the name belongs not to the family, but to the prophet. Zacharias also is questioned by signs; but since unbelief had taken from him speech and hearing, what he could not do with his voice he did with his hand and with letters.

    For he wrote, saying: His name is John. Here the name is not given but confirmed; and rightly his tongue was loosed at once, because faith unbound what unbelief had bound. Let us also believe, therefore, that we may speak; that our tongue, which is tied by the bonds of unbelief, may be loosed by the voice of reason.

    Let us write mysteries in the spirit, if we wish to speak. Let us write the herald of Christ, not on tables of stone, but on the fleshy tables of the heart. For he who speaks of John prophesies Christ. Let us speak of John, and let us speak of Christ, that our mouth also may be opened, which in so great a priest the bridle of a wavering faith, like that on a dumb beast, had held shut.
responsory:
  la: |
    R. Fuit homo missus a Deo, cui nomen erat Joánnes: * Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam. V. Erat Joánnes in desérto prǽdicans baptísmum pœniténtiæ. R. Hic venit in testimónium, ut testimónium perhibéret de lúmine, et paráret Dómino plebem perféctam.
  en: |
    R. There was a man sent from God, whose name was John: * The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord. V. John was in the wilderness, preaching the baptism of repentance. R. The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord.
status:
