# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Tempora/Pasc6-3.txt) -- day 7 of the Ascension's own movable octave, same
# shape/rationale as ascension-octave-day-2.yml. Joins St. Gregory of
# Nyssa's discourse on the Ascension (Lectio4-6, Psalm 23's "Lift up your
# gates" as a dialogue between the ascending Christ and heaven's gatekeeper
# angels) with the continuation of Pope St. Gregory the Great's homily on
# Mark 16:14-20 (Lectio7-9, same Gospel pericope as every other day, a
# different homily passage on the white-robed angels of Acts 1:9-10; bare
# incipit dropped). Responsory: reuses the Ascension's own well-known
# opening Matins responsory (Tempora/Pasc5-4.txt's own Responsory1, "Post
# passiónem suam...") across every combined-lesson octave day -- same
# resolution as ascension-octave-day-2.yml.
id: ascension-octave-day-7
source:
  la: "Sermo sancti Gregórii Nysséni; Homilía sancti Gregórii Papæ"
  en: "Sermon of St. Gregory of Nyssa; Homily of St. Gregory the Great, Pope"
text:
  la: |
    Hodiérnam celebritátem satis per se magnam, prophéta David majórem éfficit, dum illi gáudium e Psalmis adjúngit. Hic enim excélsus Prophéta supra seípsum egrédiens, tamquam córporis ónere nihil premátur, infert se cæléstibus potestátibus, et voces eárum nobis expónit, cum in cælum redeúntem Dóminum ipsæ comitántes, Angelis, qui versántur in terris, quibúsque in humánam vitam ingréssus commíssus est, ímperant ad hunc modum: Tóllite portas, príncipes, vestras; et elevámini, portæ æternáles, et introíbit Rex glóriæ.

    Et quóniam ubicúmque fúerit ille, qui in seípso ómnia cóntinet, pro suscipiéntium captu seípsum dimetítur (neque enim solum inter hómines homo fit, verum étiam dum inter Angelos versátur, ad illórum vocem sese demíttit) idcírco janitóres intérrogant: Quis est iste Rex glóriæ? Respóndent ipsis, demonstrántque fortem et poténtem in prǽlio, qui pugnatúrus erat contra illum, qui natúram humánam in servitúte captívam detinébat, et eversúrus eum, qui mortis habébat impérium: ut gravíssimo hoste superáto, genus hóminum in libertátem et pacem vindicáret.

    Occúrrunt ei custódes, et portas jubent reclúdi, ut in ipsis rursum glóriam assequátur. Verum non agnóscunt eum, qui sórdidam vitæ nostræ stolam indútus est: cujus rubra sunt vestiménta ex humanórum malórum torculári. Itaque rursus cómites ejus vócibus illis interrogántur: Quis est iste Rex glóriæ? Respondétur autem non ámplius, Fortis et potens in prǽlio; sed, Dóminus virtútum, qui mundi principátum obtínuit, qui summátim ómnia in se collégit, qui prístinum in statum cuncta restítuit: ipse est Rex glóriæ.

    Hoc autem nobis primum quæréndum est, quidnam sit, quod, nato Dómino, apparuérunt Angeli, et tamen non legúntur in albis véstibus apparuísse: ascendénte autem Dómino, missi Angeli in albis legúntur véstibus apparuísse. Sic étenim scriptum est: Vidéntibus illis elevátus est, et nubes suscépit eum ab óculis eórum. Cumque intueréntur in cælum eúntem illum, ecce duo viri stetérunt juxta illos in véstibus albis. In albis autem véstibus gáudium et solémnitas mentis osténditur. Quid est ergo, quod, nato Dómino, non in albis véstibus; ascendénte autem Dómino, in albis véstibus Angeli appárent: nisi quod tunc magna solémnitas Angelis facta est, cum cælum Deus homo penetrávit? Quia nascénte Dómino, videbátur divínitas humiliáta; ascendénte vero Dómino, est humánitas exaltáta. Albæ étenim vestes exaltatióni magis cóngruunt, quam humiliatióni.

    In ascensióne ergo ejus Angeli in albis véstibus vidéri debuérunt: quia qui in nativitáte sua appáruit Deus húmilis, in ascensióne sua osténsus est homo sublímis. Sed hoc nobis magnópere, fratres caríssimi, in hac solemnitáte pensándum est: quia delétum est hodiérna die chirógraphum damnatiónis nostræ, mutáta est senténtia corruptiónis nostræ. Illa enim natúra, cui dictum est: Terra es, et in terram ibis; hódie in cælum ivit. Pro hac ipsa namque carnis nostræ sublevatióne, per figúram beátus Job Dóminum avem vocat. Quia enim ascensiónis ejus mystérium Judǽam non intellígere conspéxit, de infidelitáte ejus per figúram beátus Job senténtiam prótulit, dicens: Sémitam ignorávit avis.

    Avis enim recte appellátus est Dóminus, quia corpus cárneum ad ǽthera librávit. Cujus avis sémitam ignorávit, quisquis eum ad cælum ascendísse non crédidit. De hac solemnitáte per Psalmístam dícitur: Eleváta est magnificéntia tua super cælos. De hac rursus ait: Ascéndit Deus in jubilatióne, et Dóminus in voce tubæ. De hac íterum dicit: Ascéndens in altum captívam duxit captivitátem, dedit dona homínibus. Ascéndens quippe in altum, captívam duxit captivitátem: quia corruptiónem nostram virtúte suæ incorruptiónis absórbuit. Dedit vero dona homínibus: quia misso désuper Spíritu, álii sermónem sapiéntiæ, álii sermónem sciéntiæ, álii grátiam virtútum, álii grátiam curatiónum, álii génera linguárum, álii interpretatiónem tríbuit sermónum.
  en: |
    The very thought of this day's Festival is great enough in itself, but the Prophet David hath much inflamed our joyful enthusiasm by the Psalms. This noble Prophet hath, as it were, gone out of himself, as though the body were a weight duller than his spirit could bear; he joineth company with the Powers of heaven, and telleth what they said when they went with the Lord heavenward, and cried in tones of command to those Angels who work on earth, and by whose heralding the Birth of the Incarnate One had been proclaimed: "Lift up your gates, O ye princes, and be ye lift up, ye everlasting doors, and the King of glory shall come in."

    He, Who containeth all things, is everywhere, but for the sake of them which receive Him, He is pleased to make Himself a local Presence which hath bounds. Not only did He become a Man among men, but when conversing among Angels, He alloweth that title also to be given Him. The gatekeepers therefore ask: "Who is this King of glory?" and it is answered them that He is "The Lord, strong and mighty, the Lord, mighty in battle," the Lord, Whose work it had been to fight him who held mankind in bondage, and to "destroy him that had the power of death, that is, the devil," that now that dark enemy was trampled down, and man had won for him freedom and peace.

    The keepers run to the gates, and bid the doors unfold, that the Lord may enter in, to take again the glory which He had there among them before. But when they see Him, clad in the likeness of sinful flesh, they know Him not, even Him Who is red in His apparel, because that He hath trodden Alone the winepress of human pain, and the blood is sprinkled upon His garments. Therefore they cry again to their fellows that bear Him company: "Who is this King of glory?" And they answer them no more: "The Lord, strong and mighty, the Lord mighty in battle," but "The Lord of hosts; the Lord, Whose Own are become the kingdoms of the world; the Lord, Who hath made Himself the Head of all things; the Lord, Who hath made all things new." He is the King of glory!

    The first question we have to ask is why we read that Angels appeared at the time of the Birth of the Lord, but we read not that they appeared in white apparel; whereas, when the Lord ascended into heaven, it is written that the angels which appeared were clad in white. "While they beheld, He was taken up, and a cloud received Him out of their sight. And while they looked steadfastly toward heaven, as He went up, behold, two men stood by them in white apparel." White raiment is an outward sign of solemn inward joy. That the occasion of God-made-Man entering into heaven was a great Festival for Angels, is the reason why we see angels specially named as robed in white at His Ascension, and not at His Birth. At the Birth of the Lord the Godhead was manifested veiled under the form of a servant, but at His Ascension the Manhood was seen exalted; and white vestments are more apt to exaltation than humiliation.

    Therefore were the angels bound to appear in white apparel at the Ascension: at His Birth He Who thought it not robbery to be equal with God was seen in the form in which He had humbled Himself; at His Ascension the Manhood Which He had taken into God was seen glorified. Again, dearly beloved brethren, we must remember today, how that Christ hath "blotted out the hand-writing that was against us," and reversed the sentence which doomed us to corruption. That same nature to which it was said, "Dust thou art, and unto dust shalt thou return," that same nature is His Who hath this day ascended up into heaven. It is because of this up-lifting of our flesh that blessed Job, by a figure, calleth the Lord a bird. The Jews could not understand the Mystery of the Ascension, and in view of this their unbelief, blessed Job said mystically: "He knew not the path of the bird."

    The name of a bird is well given to the Lord, Who bodily soared up into heaven. And the path of that Bird knoweth no man, who believeth not in the Ascension into heaven. It is of this glorious occasion that the Psalmist saith: "Who hast set thy glory above the heavens," and again "God is gone up with a shout, and the Lord with the sound of a trumpet." And yet again he saith: "Thou hast ascended on high, Thou hast led captivity captive." "When Christ ascended up on high, He led captivity captive," because by His Own incorruptibility He swallowed up our corruptibility. "He gave gifts unto men," because by sending the Spirit from above, He gave "to one, the word of wisdom; to another, the word of knowledge; to another, the working of miracles; to another, the gifts of healing; to another, diverse kinds of tongues; to another, the interpretation of tongues."
responsory:
  la: |
    R. Post passiónem suam per dies quadragínta appárens eis, et loquens de regno Dei, allelúia: * Et, vidéntibus illis, elevátus est, allelúia: et nubes suscépit eum ab óculis eórum, allelúia. V. Et convéscens, præcépit eis, ab Jerosólymis ne discéderent, sed exspectárent promissiónem Patris. R. Et, vidéntibus illis, elevátus est, allelúia: et nubes suscépit eum ab óculis eórum, allelúia.
  en: |
    R. Being seen of them forty days after that He had suffered, and speaking of the kingdom of God. Alleluia. * And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia. V. And, eating together with them, He commanded them that they should not depart from Jerusalem, but wait for the Promise of the Father. R. And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia.
