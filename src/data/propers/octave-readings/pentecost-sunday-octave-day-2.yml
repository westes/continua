# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2026-05-25). Matins reading for day 2 of Pentecost's
# own octave -- a direct Scripture reading (Acts 19:1-9), resolved from
# data/scripture/act-19.yml. The source's own English page didn't render a
# translation for this passage; its English is the standard Douay-Rheims
# wording (a known, recognized translation, not a draft).
id: pentecost-sunday-octave-day-2
source:
  la: "De Actibus Apostolórum"
  en: "From the Acts of the Apostles"
passages:
  - { book: act, chapter: 19, verses: "1-3" }
  - { book: act, chapter: 19, verses: "4-7" }
  - { book: act, chapter: 19, verses: "8-9" }
responsory:
  la: |
    R. Cum compleréntur dies Pentecóstes, erant omnes páriter in eódem loco, allelúia: et súbito factus est sonus de cælo, allelúia, * Tamquam spíritus veheméntis, et replévit totam domum, allelúia, allelúia. V. Dum ergo essent in unum discípuli congregáti propter metum Judæórum, sonus repénte de cælo, venit super eos. R. Tamquam spíritus veheméntis, et replévit totam domum, allelúia, allelúia.
  en: |
    R. When the day of Pentecost was fully come, they were all with one accord in one place, alleluia, and suddenly there came a sound from heaven, alleluia. * as of a mighty rushing wind, and it filled all the house, alleluia, alleluia. V. Where the disciples were assembled for fear of the Jews, there suddenly came upon them a sound from heaven. R. As of a rushing mighty wind, and it filled all the house, alleluia, alleluia.
status:
  la: verified
  en: verified
