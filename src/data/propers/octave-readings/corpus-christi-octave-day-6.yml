# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Tempora/Pent02-2.txt) -- day 6 of Corpus Christi's own movable octave,
# same shape/rationale as corpus-christi-octave-day-2.yml. Joins St.
# Cyprian's letter to Caecilius on Melchisedech as a type of the Eucharist
# (Lectio4-6) with another portion of St. Augustine's Tract 26 on John
# (Lectio7-9, same Gospel pericope as every other day in this octave; bare
# incipit dropped). Lectio9's own English opens mid-sentence in the source
# (its lead-in clause, "Quam multi de altari accipiunt, et moriuntur..." --
# "How many receive from the altar, and die..." -- has no English at all);
# supplied here rather than left dropped, so `en` is marked `draft` for
# this file (a missing clause, the same class of repair as
# ascension-octave-day-8.yml, not just an isolated typo). Responsory now
# sourced -- day 2's own resolution applies here too: reuse
# corpus-christi.yml's own Nocturn 2 responsory, "Cenántibus illis,"
# across every combined-lesson octave day.
id: corpus-christi-octave-day-6
source:
  la: "Epístola sancti Cypriáni Epíscopi et Mártyris; Homilía sancti Augustíni Epíscopi"
  en: "Letter of St. Cyprian, Bishop and Martyr; Homily of St. Augustine, Bishop"
text:
  la: |
    In sacerdóte Melchísedech sacrifícii Domínici sacraméntum præfigurátum vidémus, secúndum quod Scriptúra divína testátur, et dicit: Et Melchísedech rex Salem prótulit panem et vinum. Fuit autem sacérdos Dei summi, et benedíxit Abraham. Quod autem Melchísedech typum Christi portáret, declárat in Psalmis Spíritus Sanctus, ex persóna Patris ad Fílium dicens: Ante lucíferum génui te: Tu es sacérdos in ætérnum secúndum órdinem Melchísedech. Qui ordo útique hic est, de sacrifício illo véniens et inde descéndens, quod Melchísedech sacérdos Dei summi fuit, quod panem et vinum óbtulit, quod Abraham benedíxit.

    Nam quis magis sacérdos Dei summi, quam Dóminus noster Jesus Christus? qui sacrifícium Deo Patri óbtulit; et óbtulit hoc idem, quod Melchísedech obtúlerat, id est, panem et vinum, suum scílicet corpus et sánguinem. Et circa Abraham benedíctio illa præcédens, ad nostrum pópulum pertinébat. Nam si Abraham Deo crédidit, et deputátum est ei ad justítiam; útique quisquis Deo credit, et fide vivit, justus invenítur, et jam pridem in Abraham fidéli benedíctus et justificátus osténditur, sicut beátus Apóstolus Paulus probat, dicens: Crédidit Abraham Deo, et deputátum est ei ad justítiam. Cognóscitis ergo quia qui ex fide sunt, hi sunt fílii Abrahæ. Próvidens autem Scriptúra, quia ex fide justíficat gentes Deus, prænuntiávit Abrahæ quia benedicéntur in illo omnes gentes.

    Ut ergo in Génesi per Melchísedech sacerdótem posset rite celebrári, præcédit ante imágo sacrifícii, in pane et vino scílicet constitúta. Quam rem perfíciens et adímplens Dóminus, panem et cálicem mixtum vino óbtulit; et, qui est plenitúdo, veritátem præfigurátæ imáginis adimplévit. Sed et per Salomónem Spíritus Sanctus typum Domínici sacrifícii ante præmónstrat, immolátæ hóstiæ et panis et vini, sed et altáris et Apostolórum fáciens mentiónem: Sapiéntia, inquit, ædificávit sibi domum, et súbdidit colúmnas septem; mactávit suas hóstias, míscuit in cratére vinum suum, et parávit mensam suam. Et misit servos suos cónvocans cum excélsa prædicatióne ad cratérem, dicens: Qui est insípiens, declínet ad me. Et egéntibus sensu dixit: Veníte, édite de meis pánibus, et bíbite vinum quod míscui vobis.

    Non sicut manducavérunt patres vestri manna, et mórtui sunt. Quare manducavérunt, et mórtui sunt? Quia quod vidébant, credébant; quod non vidébant, non intelligébant. Ideo patres vestri, quia símiles estis illórum. Nam quantum pértinet, fratres mei, ad mortem istam visíbilem et corporálem, numquid nos non mórimur, qui manducámus panem de cælo descendéntem? Sic sunt mórtui et illi, quemádmodum et nos sumus moritúri; quantum áttinet, ut dixi, ad mortem hujus córporis visíbilem atque carnálem.

    Quantum autem pértinet ad illam mortem, de qua terret Dóminus, qua mórtui sunt patres istórum; manducávit manna et Móyses, manducávit manna et Aaron, manducávit manna et Phínees, manducavérunt ibi multi, qui Dómino placuérunt, et mórtui non sunt. Quare? Quia visíbilem cibum spiritáliter intellexérunt, spiritáliter esuriérunt, spiritáliter gustavérunt, ut spiritáliter satiaréntur. Nam et nos hódie accípimus visíbilem cibum; sed áliud est sacraméntum, áliud virtus sacraménti.

    Quam multi de altári accípiunt, et moriúntur, et accipiéndo moriúntur! Unde dicit Apóstolus: Judícium sibi mandúcat et bibit. Nonne buccélla Domínica venénum fuit Judæ? Et tamen accépit. Et cum accépit, in eum inimícus intrávit; non quia malum accépit, sed quia bonum male malus accépit. Vidéte ergo, fratres, panem cæléstem spiritáliter manducáte, innocéntiam ad altáre apportáte. Peccáta, etsi sunt quotidiána, vel non sint mortífera; ántequam ad altáre accedátis, atténdite quod dicátis: Dimítte nobis débita nostra, sicut et nos dimíttimus debitóribus nostris. Si dimíttis, dimittétur tibi: secúrus accéde, panis est, non venénum.
  en: |
    In the deed of the Priest Melchisedek we see a type of the Sacrament of the Lord's Sacrifice. For thus it is written in the writings of God: "And Melchisedek King of Salem brought forth bread and wine, for he was the Priest of the Most High God, and he blessed Abraham." That Melchisedek was a type of Christ, the Holy Ghost Himself doth testify in the Psalms, where the First Person of the Holy Trinity, even the Father, is set before us as saying unto the Second Person, that is, the Son: "Before the daystar have I begotten thee. Thou art a Priest for ever, after the order of Melchisedek." And verily that sameness of order cometh of this sacrifice, and proceedeth from this: that Melchisedek was the Priest of the Most High God, that he offered bread and wine, and that he blessed Abraham.

    What Priest of the Most High God is there, more so than is our Lord Jesus Christ? He Who hath made an offering unto God the Father, and the same offering that Melchisedek made — bread and wine, that is to say, His Own Flesh and His Own Blood. And, as touching Abraham, that ancient blessing was spoken likewise by fore-knowledge upon us. For if Abraham believed God, and it was accounted to him for righteousness, verily, whosoever believeth God and liveth by faith, the same is found righteous, and is shown unto us that he is already blessed in faithful Abraham, and justified, as the Apostle Paul proveth, where he saith: "Abraham believed God, and it was accounted unto him for righteousness. Know ye therefore that they which are of faith, the same are the children of Abraham. And the Scripture, foreseeing that God would justify the heathen through faith, preached before the Gospel unto Abraham, saying: In thee shall all nations be blessed."

    In Genesis, therefore, in order that the Priest Melchisedek might in due order pronounce the blessing upon Abraham, there was first offered a typical sacrifice, consisting of bread and wine. This was the offering which our Lord Jesus Christ completed and fulfilled, when He offered up bread and a cup of wine mingled with water. This fulfilment by Him Who came to fulfil, utterly satisfied the truth of the image which had gone before. The Holy Ghost doth by Solomon also clearly foreshadow, as it were in a parable, the Lord's Sacrifice, pointing to the victim slain, and the bread and the wine, and the Altar likewise, and the Apostles, as it is written: "Wisdom hath builded her house, she hath hewn out her seven pillars; she hath killed her beasts, she hath mingled her wine, she hath also furnished her table. She hath sent forth her servants, she crieth upon the highest places of the city, saying: Whoso is simple, let him turn in hither unto me. As for them that want understanding, she saith to them: Come, eat of my bread, and drink of the wine which I have mingled for you."

    "Not as your fathers did eat manna, and are dead." Wherefore did they eat and die? Because they believed only that which they saw, and that which they saw not, they understood not. Therefore were they your fathers, because ye are like unto them. Doth this death, my brethren, mean that death which is outward and bodily? And do not we also die, who eat of that Bread Which cometh down from heaven? That death died they, and so shall we also, as far, as I have said, as is meant that death which is outward and bodily.

    But the death whereof the Lord doth sound the alarm, the death that their fathers died, is another death than that which is outward and bodily. Moses ate manna, Aaron ate manna, Phinehas ate manna, many ate manna in whom the Lord was well pleased, and these are not dead. Wherefore? Because they understood spiritually that outward bread, spiritually hungered thereafter, spiritually tasted thereof, and spiritually were satisfied therewith. So also do we this day feed on a visible food, but the Sacrament is one thing, and the grace of the Sacrament is another.

    How many receive from the Altar, and die, and die by the very receiving! Whence the Apostle saith: "He that eateth and drinketh unworthily eateth and drinketh damnation to himself." Was not the Lord's morsel poison unto Judas? And yet he took it. And when he had eaten it, the enemy entered in and possessed him — not because what he ate was evil, but because he, being evil, dared to eat that which was good. Look to it well, then, brethren: take spiritually the Bread Which cometh down from heaven. Bring innocency with you to the Altar. Though your sins be daily, let them not be deadly. Before ye draw near to the Altar, think well what it is that ye say: "Forgive us our trespasses, as we forgive them that trespass against us." If thou forgivest, it shall be forgiven thee: draw near boldly, for unto thee It is Bread, and not poison.
responsory:
  la: |
    R. Cenántibus illis, accépit Jesus panem, et benedíxit, ac fregit, dedítque discípulis suis, et ait: * Accípite et comédite: hoc est corpus meum. V. Dixérunt viri tabernáculi mei: Quis det de cárnibus ejus, ut saturémur? R. Accípite et comédite: hoc est corpus meum.
  en: |
    R. As they were eating, Jesus took bread, and blest it, and brake it, and gave it to the disciples, and said: * Take, eat; this is My Body. V. The men of my tabernacle said: O that we had of his flesh, we cannot be satisfied. R. Take, eat; this is My Body.
