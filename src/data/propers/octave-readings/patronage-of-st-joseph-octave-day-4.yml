# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Tempora/Pasc2-6.txt) -- day 4 of the Patronage of St. Joseph's own
# movable octave (Saturday), same shape/rationale as
# patronage-of-st-joseph-octave-day-2.yml. Joins the continuation of
# St. John Chrysostom's Homily 4 on Matthew (Lectio4-6, the angel's own
# words to Joseph in Matt 1:20-21) with St. Ambrose's own commentary on
# Luke (Lectio7-9, same Gospel pericope as the feast day; bare incipit
