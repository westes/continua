# Sourced directly from the raw reference files (web/www/horas/Latin+English/Sancti/01-10.txt): the Epiphany octave's counted day 5 (Sundays not counted -- see OctaveConfig.skipsSunday). Lectio4-6 plus the Lectio7-9 continuation, bare Gospel incipit dropped, collapsed into one reading as every octave reading here is.
id: epiphany-octave-day-5
source:
  la: "Sermo sancti Máximi Epíscopi; Homilía sancti Hierónymi Presbýteri"
  en: "From the Sermons of St. Maximus, Bishop of Turin; Homily by St. Jerome, Priest at Bethlehem"
text:
  la: |
    In hac, dilectíssimi, celebritate, sicut relatu paternæ traditiónis instrúimur, multíplici nobis est festivitate lætándum. Ferunt enim, hódie Christum Dóminum nostrum vel stella duce a Géntibus adorátum: vel invitátum ad nuptias, aquas in vina vertisse; vel suscepto a Joánne baptismate, consecrasse fluénta Jordánis, suumque simul purificasse Baptistam.

    Sed quid potíssimum præsénti hoc factum sit die, nóverit ipse qui fecit: nos tamen crédere, nec dubitare debemus, quidquid illud est, factum esse pro nobis. Nam quod eum fulgentioris stellæ radiis incitáti adoravére Chaldæi, Deum verum Géntibus spes data est adorandi. Quod aquæ novo sunt ordine in vina mutátæ, novi nobis póculi prælibátum est sacraméntum. Quod autem baptizátus est Agnus Dei, regenerántis baptismi salutáre nobis munus est dedicátum.

    Oportet ítaque nos, fratres, ad honórem Salvatoris nostri, cujus nativitátem débita nuper cum exsultatióne transégimus, omni cum devotióne étiam hunc virtútum ejus celebrare natalem. Et quam recte tria hæc nobis uno acta in die mysteria prædicántur, qui ineffábilis Trinitátis arcanum uno Dei sub nómine confitemur! Per hæc ergo miracula Christus Dóminus Redémptor noster óculis se vóluit revelare mortalium, quátenus invisibilis ejus divinitas, quæ latebat in hómine, in opere non latéret.

    Vídimus enim stellam ejus in Oriénte. Ad confusiónem Judæórum, ut nativitátem Christi a Géntibus díscerent, óritur in Oriénte stella; quam futuram, Bálaam, cujus successores erant, vaticinio nóverant. Lege Numerórum librum. Deferúntur autem Magi stellæ indicio in Judǽam, ut sacerdótes a Magis interrogati, ubi Christus nascerétur, inexcusábiles fíerent de adventu ejus.

    At illi dixérunt ei: In Bethlehem Judææ. Librariórum hic error est. Putámus enim ab Evangelista primum éditum, sicut in ipso Hebráico légimus, Judæ, non Judææ. Quæ est enim aliárum géntium Bethlehem, ut ad distinctiónem ejus, hic Judææ ponerétur? Judæ autem idcirco scribitur, quia est et alia Bethlehem in Galilæa. Lege librum Jesu fílii Nave. Dénique et in ipso testimonio, quod de Michææ prophetía sumptum est, ita habétur: Et tu Bethlehem terra Juda.

    Et, apertis thesáuris suis, obtulérunt ei múnera, aurum, thus et myrrham. Pulcherrime munerum sacraménta Juvencus Presbyter uno versículo comprehéndit: Thus, aurum, myrrham, Regíque, hominíque, Deóque dona ferunt. Et responso accepto in somnis, ne redirent ad Herodem, per aliam viam reversi sunt in regiónem suam. Qui múnera obtulerant Dómino, consequenter responsum accipiunt, non per Angelum, sed per ipsum Dóminum: ut meritórum Joseph privilegium demonstrarétur. Revertúntur autem per aliam viam: quia infidelitáti miscéndi non erant Judæórum.
  en: |
    Dearly beloved brethren, we are instructed by the tradition of the Fathers, that we have to keep holiday on this solemnity in honour of several joyful events. We are taught that on this day, our Lord Christ was, first, manifested to the Gentiles by the leading of a star; secondly, that being bidden to a marriage, He turned water into wine; and, thirdly, that He received baptism from John, whereby He hallowed the waters of the Jordan, and cleansed him that baptised Him.

    Which of these events was the greatest, He knoweth by Whose Will they came to pass; for us it is needful to believe and doubt not that whatever was wrought was wrought for us. For to the Gentiles is given a hope of worshipping that Very God of Very God, to adore Whom the Chaldaeans were led by the rays of a glorious star. So also He That by His Will changed water into wine, hath given us to drink of the cup of His Blood of the New Testament; and the Lamb of God baptized in the Jordan hath hallowed for us that saving Fountain wherein we are born again.

    Therefore, my brethren, as we have lately celebrated with gladness the Festival of our Saviour's birth, so now it behoveth us with all earnestness to keep holy in His honour, this the birth-day of His wonderworking. And, verily, these three anniversaries are rightly on one day preached to us, who acknowledge the unspeakable mystery of the Trinity under the name of one God. By these miracles the Lord Christ our Redeemer willed to manifest to men some of the power of that Godhead, Which in Him lay hidden under the Manhood.

    We have seen His star in the East. In order that the Jews might be confounded by hearing from the Gentiles of the birth of Christ, the star rose in the East. They knew that it would come, by the prophecy of Balaam, whose successors they were. See the Book of Numbers, (xxiv. 17.) The star led the wise men to Judea, that the Priests, having it demanded of them where Christ should be born, might have no power to plead that they knew not of His coming.

    And they said unto him, In Bethlehem of Judea, this is a mistake of copyists. 1 In our opinion, what the Evangelist wrote must have been, not of Judea, but of Judah. Thus it is in the Hebrew text. Nor is there any town called Bethlehem among any other people, that this should be called of Judea to distinguish it. But it is fitly distinguished as of Judah, because there is in Judea another Bethlehem, namely, the one in Galilee. See the Book of Joshua the son of Nun. ~(xix. 15.) Finally, the passage cited, which is in the prophet Micah, (v. 2,) hath But thou, Bethlehem Ephratah, though thou be little among the thousands of Judah(, yet out of thee shall He come forth unto me that is to be ruler in Israel.)

    And treasures they presented unto Him gifts, gold, and frankincense, and myrrh. The mystic meaning of these gifts is thus neatly expressed by Juvencus the Priest, To God made man, born Israel's King, Frankincense, myrrh, and gold they bring. And being warned of God in a dream that they should not return to Herod, they departed into their own country another way. They who had presented unto the Lord gifts, were honoured by receiving a warning, not from an Angel, but from God Himself; whereas even Joseph was warned only by an Angel. They departed into their own country another way, that they might not be brought into contact with the unbelief of the Jews.
responsory:
  la: |
    R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et habent in se divína mystéria: * In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram. V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris suis mýsticas ei múnerum spécies obtulérunt. R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram.
  en: |
    R. There are three precious gifts which the wise men offered unto the Lord on this day, and they speak a mystery of the things of God: * Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying. V. The wise men worshipped the Captain of our Salvation, as He lay in the manger, and when they had opened their treasures, they presented unto Him mystic gifts. R. Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying.
