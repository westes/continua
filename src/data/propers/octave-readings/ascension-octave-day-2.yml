# Sourced directly from the raw reference files (web/www/horas/Latin+English/
# Tempora/Pasc5-5.txt) -- day 2 of the Ascension's own movable octave (per
# user direction 2026-08-28: movable-feast octave content lives in the
# Tempora/TemporaM directories, keyed by liturgical offset, not a calendar
# date -- no representative year needs picking). Joins St. Leo the Great's
# sermon on the Ascension (Lectio4-6, Nocturn 2) with Pope St. Gregory the
# Great's homily on Mark 16:14-20 (Lectio7-9, Nocturn 3, the bare Gospel
# incipit dropped per the usual rule). Responsory: reuses the Ascension's
# own well-known opening Matins responsory (Tempora/Pasc5-4.txt's own
# Responsory1, "Post passiónem suam...") across every combined-lesson
# octave day, rather than picking one of this day's several per-lesson
# responsories (none of which map cleanly onto a single recombined
# reading) -- the same resolution already used for nativity-bvm's own
# octave (see nativity-bvm-octave-day-3.yml's own header).
id: ascension-octave-day-2
source:
  la: "Sermo sancti Leónis Papæ; Homilía sancti Gregórii Papæ"
  en: "Sermon of St. Leo, Pope; Homily of St. Gregory the Great, Pope"
text:
  la: |
    Sacraméntum, dilectíssimi, salútis nostræ, quam prétio sánguinis sui universitátis Cónditor æstimávit, a die corporális ortus usque ad éxitum passiónis, per dispensatiónem humilitátis implétum est. Et licet multa, étiam in forma servi, divinitátis signa radiáverint; próprie tamen illíus témporis áctio ad demonstrándam suscépti hóminis pertínuit veritátem. Post passiónem vero ruptis mortis vínculis, quæ vim suam in eum, qui peccáti erat néscius, incedéndo perdíderat; infírmitas in virtútem, mortálitas in immortalitátem, contumélia transívit in glóriam: quam Dóminus Jesus Christus in multis manifestísque documéntis, multórum declarávit aspéctibus, donec triúmphum victóriæ, quem reportárat a mórtuis, inférret et cælis.

    Sicut ergo in solemnitáte pascháli resurréctio Dómini fuit nobis causa lætándi: ita ascénsio ejus in cælos præséntium nobis est matéria gaudiórum, recoléntibus illum diem, et rite venerántibus, quo natúra nostræ humilitátis in Christo super omnem cæli milítiam, super omnes órdines Angelórum, et ultra ómnium altitúdinem potestátum, ad Dei Patris est provécta conséssum. Quo órdine óperum divinórum nos fundáti, nos ædificáti sumus: ut mirabílior fíeret grátia Dei, cum remótis a conspéctu hóminum, quæ mérito reveréntiam sui sentiebántur indícere, fides non defíceret, spes non fluctuáret, cáritas non tepéret.

    Magnárum hic vigor est méntium, et valde fidélium lumen est animárum, incunctánter crédere, quæ corpóreo non vidéntur intúitu, et ibi fígere desidérium, quo néqueas inférre conspéctum. Hæc autem píetas unde in nostris córdibus nascerétur, aut quómodo quisquam justificarétur per fidem, si in iis tantum salus nostra consísteret, quæ obtútibus subjacérent? Unde et illi viro, qui de resurrectióne Christi videbátur ambígere, nisi in ipsíus carne vestígia passiónis et visu explorásset et tactu: Quia vidísti me, inquit Dóminus credidísti: beáti qui non vidérunt, et credidérunt.

    Qui credíderit, et baptizátus fúerit, salvus erit: qui vero non credíderit, condemnábitur. Fortásse unusquísque apud semetípsum dicat: Ego jam crédidi, salvus ero. Verum dicit, si fidem opéribus tenet. Vera étenim fides est, quæ in hoc, quod verbis dicit, móribus non contradícit. Hinc est enim quod de quibúsdam falsis fidélibus Paulus dicit: Qui confiténtur se nosse Deum, factis autem negant. Hinc Joánnes ait: Qui dicit se nosse Deum, et mandáta ejus non custódit, mendax est.

    Quod cum ita sit, fídei nostræ veritátem in vitæ nostræ consideratióne debémus agnóscere. Tunc enim veráciter fidéles sumus, si quod verbis promíttimus, opéribus complémus. In die quippe baptísmatis, ómnibus nos antíqui hostis opéribus, atque ómnibus pompis abrenuntiáre promísimus. Itaque unusquísque vestrum ad consideratiónem suam mentis óculos redúcat; et si servat post baptísmum, quod ante baptísmum spopóndit, certus jam, quia fidélis est, gáudeat.

    Sed ecce, si quod promísit, mínime servávit, si ad exercénda prava ópera, ad concupiscéndas mundi pompas dilápsus est: videámus, si jam scit plángere quod errávit. Apud misericórdem namque júdicem nec ille fallax habétur, qui ad veritátem revértitur, étiam postquam mentítur: quia omnípotens Deus, dum libénter nostram pœniténtiam súscipit, ipse suo judício hoc, quod errávimus, abscóndit.
  en: |
    Dearly beloved brethren, that mysterious thing, our salvation, which the Maker of the universe thought worth purchasing with His Own Precious Blood, was aimed at by Him, in the dispensation of His humility, from the hour wherein He was born as touching the flesh, till the moment when, at the end of the Passion, He cried on the Cross: "It is finished." Although from under the form of a servant many marks of His Godhead shone forth, yet, as a whole, the work of those three-and-thirty years was to manifest the verity of the Manhood which the Son of God had taken into Himself. But when the suffering was all over, and the bands of death were broken, (that death which had lost all his power by seeking to bind Him Who knew no sin,) then was weakness changed into strength, mortality into immortality, insult into that glory which the Lord Jesus Christ, on so many occasions, made manifest by so many and infallible proofs, until the day came when that triumphant procession of victory, which He had led from the realms of shattered death, followed Him with unimaginable pomp into the heavens.

    On the solemn Feast of the Passover the cause of our joy was that Christ was risen again. This day we rejoice because that He is ascended up into heaven. We call to mind and justly celebrate that day whereon our lowly nature was, in the Person of Christ, borne up high above all the heavenly armies, above all the circles of Angels, beyond the heights of all the Powers, even to where Christ is sitting on the right hand of the Father. Our foundations are laid, and our house is built upon this succession of the works of God, and His grace is made more wonderful by this, that, though the visible Object of worship is removed from among men, the faith of the Church doth not grow weak, nor her hope wavering, nor her love cold.

    It is the back-bone of a strong mind and the eye of a trusty soul, to believe unhesitatingly that which is not seen with the bodily eyes, and to centre all love where there can be no experimental knowledge. This it is which is the only thing we can have of godliness, for how could a man be justified through faith, if the saving objects were objects of sight? There was a man who would not believe in the Resurrection of Christ until he had examined by sight, and touched the marks of the Passion in the Divine Body, and the Lord said to him, "Because thou hast seen Me, thou hast believed: blessed are they that have not seen, and yet have believed." (John xx. 29.)

    "He that believeth, and is baptized, shall be saved: but he that believeth not shall be damned." Perchance some man will say within himself: "I have already believed, and therefore I shall be saved." Thou hast well said, if thou showest thy faith by thy works. He only hath a true faith whose life doth not give the lie to his confession. Hence it is that Paul saith, touching some who were falsely faithful: "They profess that they know God, but in works they deny Him." (Tit. i. 16.) And John likewise saith: "He that saith, I know Him, and keepeth not His commandments, is a liar." (I. ii. 4.)

    Once, then, it so standeth, it is to our lives we must look for proof of the reality of our faith. Then only are we truly Christ's faithful people when our works are the fulfilment of our profession. The day whereon we were baptized we bound ourselves to renounce all the works of the old enemy, and all his pomps. Therefore let every one of you now turn his inward eye upon his own behaviour, and if, since his baptism, he hath kept that promise which he made before it, let him know that he is in very truth one of Christ's faithful ones, and let him rejoice.

    But if he hath utterly broken his promise, if he hath fallen away to work iniquity, and to lust after the pomps of the world, let us see if he now knoweth how to weep over his backsliding. By the merciful Judge that man is not punished as a perjurer who in the end telleth the truth, even though he hath first lied. Because Almighty God doth, in His tender kindness, so receive our contrition, that, in His judgment, He declareth us not guilty of that which we have done amiss.
responsory:
  la: |
    R. Post passiónem suam per dies quadragínta appárens eis, et loquens de regno Dei, allelúia: * Et, vidéntibus illis, elevátus est, allelúia: et nubes suscépit eum ab óculis eórum, allelúia. V. Et convéscens, præcépit eis, ab Jerosólymis ne discéderent, sed exspectárent promissiónem Patris. R. Et, vidéntibus illis, elevátus est, allelúia: et nubes suscépit eum ab óculis eórum, allelúia.
  en: |
    R. Being seen of them forty days after that He had suffered, and speaking of the kingdom of God. Alleluia. * And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia. V. And, eating together with them, He commanded them that they should not depart from Jerusalem, but wait for the Promise of the Father. R. And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia.
status:
  la: verified
  en: verified
