# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-09-09). Matins reading for day 2 of the Nativity
# of the BVM's own octave -- collapsed into one continuous reading per project
# convention. The source's own English translation is used as-is, including
# gaps in its own punctuation (some older "oct"/"bmv"-suffixed variant files
# drop question marks entirely in places) -- not corrected here, since
# guessing where they belong isn't the same class of fix as an isolated
# single-character typo.
id: nativity-bvm-octave-day-2
source:
  la: "De Sermone sancti Augustíni Epíscopi."
  en: "From a Sermon of St. Augustine, Bishop"
text:
  la: |
    De Sermone sancti Augustíni Epíscopi. Serm. 18. de Sanctis, in med. Exsultat Maria, et matrem se læta miratur, et de Spiritu sancto se peperisse gaudet; nec quia peperit innupta, terretur; sed quia genuerit, cum exsultatione miratur. Ofemina super feminas benedicta, quæ virum omnino non novit, et virum suo utero circumdedit! Circumdat virum Maria Angelo fidem dando, quia Heva perdidit virum, serpenti consentiendo. Ofelix obedientia, o insignis gratia! quæ dum fidem humiliter dedit, cæli in se opificem corporavit. Hinc promeruit gloriam, quam ipsa postmodum auxit. Ecce, ait, ex hoc beatam me dicent omnes generationes.

    Obeata Maria, quis tibi digne valeat jura gratiarum ac laudum præconia rependere, quæ singulari tuo assensu mundo succurristi perdito? Quas tibi laudes fragilitas humani generis persolvat, quæ solo tuo commercio recuperandi aditum invenit? Accipe ítaque quascumque exiles, quascumque meritis tuis impares gratiarum actiones: et cum susceperis vota, culpas nostras orando excusa. Admitte nostras preces intra sacrarium exauditionis et reporta nobis antidotum reconciliationis.

    Commemoratio S. Gorgonii Martyris Gorgonius, Nicomedíæ natus, Diocletiáni imperatóris cubicularius, Dorothéo colléga suo adjutore, réliquos omnes cubículi minístros ad Christi fidem perdúxit. Uterque autem, cum vidísset quodam die Mártyrem coram Diocletiáno acerbíssime cruciari, ejus exemplo martyrii amóre incénsus est. Itaque ambórum hæc vox erupit: Quid est, imperátor, quod hujus condemnáta senténtia, quæ nobis cum eo communis est, unum illum punis? istius nostra étiam est fides, idem propositum. Eos ígitur vinctos imperátor flagellis cóncidi jubet, ita ut toto corpore cutis dirumperétur, et in plagas acetum infundi sale permixtum; mox revinctis in cratícula súbjici ímperat vim candéntium carbónum. Denique, varie torti, suspendio necáti sunt. Ac sancti Gorgonii corpus aliquándo Romam portátum, inter duas Lauros via Latina sepúltum, póstea a Gregório quarto summo Pontifice in basilicam Principis Apostolórum translátum est.
  en: |
    From the Sermons of Saint Augustine, Bishop (of Hippo) Serm. 18 on the Saints Mary is happy, with joyful wonder at her own Motherhood, and her joy is that she is fruitful by the Holy Ghost. She is not alarmed to find herself an unwedded mother, but still is in joyful wonder at her Motherhood. Oh woman blessed above women, who doth nowise know a man, and yet compasseth a man in the womb. Mary compasseth a man by believing the Angel, since Eve lost a man by saying Yea to the serpent. Happy obedience, glorious grace! which yielded lowly belief, and embodied in her Him Who created the heavens. Hence she earned that glory which He afterward increased. Behold, saith she, from henceforth, all generations shall call me blessed.

    Blessed Mary, who is able enough to thank and to praise thee, thou, who by once saying Be it unto me, hast arisen to help a lost world? What blessings shall weak man utter upon thee, thou, who, by thine own one treaty, hast given unto him to find the entrance into new life? Receive these far and random, these unworthy thanksgivings, and, since thou receivest our prayers, by thy prayers obtain pardon for our sins. Let our supplications come into thine hallowed presence, and give us in return the medicine for our healing.

    Commemoratio for the Holy Martyr Gorgonius. Gorgonius was a native of Nicomedia, and one of the chamberlains of the Emperor Diocletian. He, with the help of a fellow-chamberlain named Dorotheus, brought all the other chamber-servants to believe in Christ. Both of them one day saw a martyr hideously tortured in the presence of Diocletian, and the example of his testimony roused them both up to desire the same, and they both said: Why, O Emperor, dost thou punish this man only, by condemning an opinion which we share with him? His belief is our belief. Our will is the same. The Emperor thereupon ordered them to be bound and scourged till their bodies were perfectly flayed, and a mixture of vinegar and salt poured into the wounds. Soon after he commanded them to be bound again and grilled on bars over hot coals. Finally, after a variety of tortures, they were hanged. The body of the holy Gorgonius was some time brought to Rome, and buried between the two laurel-trees upon the Latin Way, but, afterwards, during the Pontificate of Gregory IV., it was brought into the Church of the Prince of the Apostles.
responsory:
  la: |
    R. Hódie nata est beáta Virgo María ex progénie David; * Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo. V. Nativitátem beátæ Maríæ Vírginis cum gáudio celebrémus. R. Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo.
  en: |
    R. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. V. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. R. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
status:
