# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-11-7). Matins reading for day 7 of All Saints' own
# octave -- collapsed into one continuous reading per project convention. A
# continuous reading from the book of Ezechiel, read straight through across
# the whole octave (a different excerpt each day), not repeated -- confirmed
# via each day's own Invitatory (the same distinctive All Saints antiphon
# every day, Nov 2 included, so this app's own exclusion of All Souls' Day as
# a different liturgical genre doesn't conflict with this octave's real Matins
# content). The source's own English translation is used as-is, including gaps
# in its own punctuation (some older "oct"/"bmv"-suffixed variant files drop
# question marks entirely in places) -- not corrected here, since guessing
# where they belong isn't the same class of fix as an isolated single-
# character typo.
id: all-saints-octave-day-7
source: "De Ezechiéle Prophéta"
text:
  la: |
    De Ezechiéle Prophéta Ezek 15:1-5 1 Et factus est sermo Dómini ad me, dicens: 2 Fili hóminis, quid fiet de ligno vitis, ex ómnibus lignis némorum, quæ sunt inter ligna silvárum? 3 Numquid tollétur de ea lignum, ut fiat opus, aut fabricábitur de ea paxíllus, ut depéndeat in eo quodcúmque vas? 4 Ecce igni datum est in escam: utrámque partem ejus consúmpsit ignis, et medíetas ejus redácta est in favíllam. Numquid útile erit ad opus? 5 Etiam cum esset íntegrum, non erat aptum ad opus: quanto magis cum illud ignis devoráverit et combússerit: nihil ex eo fiet óperis?

    Ezek 15:6-8 6 Proptérea hæc dicit Dóminus Deus: Quómodo lignum vitis inter ligna silvárum, quod dedi igni ad devorándum, sic tradam habitatóres Jerúsalem. 7 Et ponam fáciem meam in eos: de igne egrediéntur, et ignis consúmet eos: et sciétis quia ego Dóminus, cum posúero fáciem meam in eos, 8 Et dédero terram ínviam et desolátam, eo quod prævaricatóres exstíterint, dicit Dóminus Deus.

    Ezek 16:1-5 1 Et factus est sermo Dómini ad me, dicens: 2 Fili hóminis, notas fac Jerúsalem abominatiónes suas, 3 Et dices: Hæc dicit Dóminus Deus Jerúsalem: Radix tua et generátio tua de terra Chánaan, pater tuus Amorrhǽus, et mater tua Cethǽa. 4 Et quando nata es, in die ortus tui, non est præcísus umbilícus tuus, et aqua non es lota in salútem, nec sale salíta, nec involúta pannis. 5 Non pepércit super te óculus, ut fáceret tibi unum de his, misértus tui, sed projécta es super fáciem terræ in abjectióne ánimæ tuæ, in die qua nata es.
  en: |
    Lesson from the book of Ezekiel Ezek 15:1-5 1 And the word of the Lord came to me, saying: 2 Son of man, what shall be made of the wood of the vine, out of all the trees of the woods that are among the trees of the forests? 3 Shall wood be taken of if, to do any work, or shall a pin be made of it for any vessel to hang thereon? 4 Behold it is cast into the fire for fuel: the fire hath consumed both ends thereof, and the midst thereof is reduced to ashes: shall it be useful for any work? 5 Even when it was whole it was not fit for work: how much less, when the fire hath devoured and consumed it, shall any work be made of it?

    Ezek 15:6-8 6 Therefore thus saith the Lord God: As the vine tree among the trees of the forests which I have given to the fire to be consumed, so will I deliver up the inhabitants of Jerusalem. 7 And I will set my face against them: they shall go out from fire, and fire shall consume them and you shall know that I am the Lord, when I shall have set my face against them. 8 And I shall have made their land a wilderness, and desolate, because they have been transgressors, saith the Lord God.

    Ezek 16:1-5 1 And the word of the Lord came to me, saying: 2 Son of man, make known to Jerusalem her abominations. 3 And thou shalt say: Thus saith the Lord God to Jerusalem: thy root, and thy nativity is of the land of Chanaan, thy father was an Amorrhite, and thy mother a Cethite. 4 And when thou wast born, in the day of thy nativity thy navel was not cut, neither wast thou washed with water for thy health, nor salted with salt, nor swaddled with clouts. 5 No eye had pity on thee to do any of these things for thee, out of compassion to thee: but thou wast cast out upon the face of the earth in the abjection of thy soul, in the day that thou wast born.
responsory:
  la: |
    ℟. Vidi Dóminum sedéntem super sólium excélsum et elevátum, et plena erat omnis terra majestáte ejus: * Et ea, quæ sub ipso erant, replébant templum. ℣. Séraphim stabant super illud: sex alæ uni, et sex alæ álteri. ℟. Et ea, quæ sub ipso erant, replébant templum.
  en: |
    ℟. I saw the Lord sitting upon a throne, high and lifted up, and the whole earth was full of His glory; * And His train filled the temple. ℣. Above it stood the Seraphim each one had six wings. ℟. And His train filled the temple.
status:
  la: verified
  en: verified
