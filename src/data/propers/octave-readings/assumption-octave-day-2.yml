# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-08-16) -- Aug 16 is day 2 of the Assumption's own
# octave (started Aug 15), not day 7 of St. Lawrence's (which it's also
# nominally within, but Lawrence's weaker octave is entirely overshadowed
# here). Matins reading collapsed into one continuous reading per project
# convention. Not corrected here, since guessing where they belong isn't the
# same class of fix as an isolated single-character typo -- the Latin's own
# punctuation gaps (some older "oct"/"bmv"-suffixed variant files drop
# question marks entirely in places) are left as the source has them.
#
# 2026-09-12: no English translation exists in the source at all for this
# reading -- its own English page falls back to showing the Latin text
# under the "Reading" header. Since it's prose, this English is a
# translation done for this project rather than left missing, same
# precedent already used for assumption-octave-day-4.yml -- draft, not
# verified against any source. This day's Latin is the same John
# Damascene passage as day-3 (assumption-octave-day-3.yml) with only
# orthographic variance, except this text omits one sentence day-3 has
# ("Ubi pretiósus ille thesáurus, qui vitam suscépit?" -- "Where is that
# precious treasure which received Life itself?"); the translation below
# is adapted from day-3's own, with that one sentence dropped to match.
#
# 2026-09-09: `text.la` had the source citation ("Sermo sancti Joannis
# Damasceni Orat. 2 de Dorm. Deiparæ") baked into its opening words, run
# on directly into the sermon's own text with no separating punctuation --
# redundant with the `source` field above, which already renders as this
# reading's label. Stripped (part of a repo-wide sweep of octave-readings
# files with the same pattern).
id: assumption-octave-day-2
source:
  la: "Sermo sancti Joannis Damasceni"
  en: "Sermon of St. John Damascene"
text:
  la: |
    Jubilemus in arca Domini Dei toto animo, et muri cadent Hiericontini, contrariarum, inquam potestatum infestæ munitiones. Cum David exsultemus spiritu. Arca enim Domini hodie requievit. Clamemus cum Gabriele, qui primum locum obtinet inter angelos: Ave gratia plena: dominus tecum. Ave gaudii pelagus inexhaustum. Ave unicum molestiarum levamen. Aue omnium cordis dolorum medicamentum. Ave sancta virgo per quam mors quidem fuit expulsa, vita autem introducta.

    Tu vero o sacrorum sepulcrorum sacratissimum, post domini quidem sepulcrum, quod uitæ dedit principium, quod fuit fons resurrectionis, (tecum enim loquar tamquam cum animato) ubinam est aurum illud purum, quod manus apostolorum in te condiderunt! Ubi divitiæ, quæ consumi nequeunt! Ubi novum uolumen, in quo ineffabiliter deus uerbum sine manu inscriptum fuit! Ubi abyssus gratiæ? Ubi pelagus curationum? Ubi est desiderabile illud deiparæ uirginis corpus?

    Quid quæritis in sepulcro eam, quæ ad cælestia translata est tabernacula? cur a me custodiæ rationem exposcitis? Non possum ego divinis jussis resistere. Sacrosanctum corpus mihi quoque sanctitatem impertivit quod me pretiosissimi unguenti fragrantia replevit, et divinum templum effecit relictis sindonibus, abiit raptum sublime, comitantibus angelis, archangelis, et omnibus cælestibus potentiis. Nunc me circumdant angeli; nunc divina in me habitat gratia. Ergo evasi officina medicinæ ægrotantibus. Ego sum fons perennis curationum: Ego remedium aduersus dæmones: Ego civitas refugii omnibus ad me confugientibus.
  en: |
    Let us rejoice with all our heart before the ark of the Lord God, and the walls of Jericho shall fall — I mean the hostile fortifications of the opposing powers. Let us exult in spirit with David: for the Ark of the Lord hath this day found her rest. Let us cry out with Gabriel, who holds the first place among the Angels: Hail, full of grace; the Lord is with thee. Hail, thou unfailing sea of joy: hail, thou sole relief of every affliction: hail, thou remedy for every sorrow of the heart. Hail, holy Virgin, through whom death indeed was driven out, and life brought in.

    But thou, O most holy of sacred sepulchres, second only to the sepulchre of the Lord — which gave life its beginning, which was the fountain of the resurrection (for I will speak to thee as to one who lives): where now is that pure gold which the hands of the Apostles laid up within thee? Where are those riches that can never be spent? Where is the new scroll, on which the Word of God was ineffably inscribed without hand of man? Where is the abyss of grace? Where is the sea of healing? Where is that most desirable body of the Virgin, the Mother of God?

    Why do you seek in the tomb her who has been taken up into the heavenly tabernacles? Why do you demand of me an account of my keeping? I cannot resist the divine commands. That sacred body imparted holiness even to me, and filled me with the fragrance of a most precious ointment, and made me a temple of God; leaving behind its winding-cloths, it was borne away on high, with angels, archangels, and all the heavenly Powers attending it. Now angels surround me; now divine grace dwells within me. Thus have I become a workshop of healing for the sick: I am a perennial fountain of cures: I am a remedy against demons: I am a city of refuge for all who flee to me.
responsory:
  la: |
    R. Vidi speciósam sicut colúmbam, ascendéntem désuper rivos aquárum, cujus inæstimábilis odor erat nimis in vestiméntis ejus; * Et sicut dies verni circúmdabant eam flores rosárum et lília convállium. V. Quæ est ista quæ ascéndit per desértum sicut vírgula fumi ex aromátibus myrrhæ et thuris? R. Et sicut dies verni circúmdabant eam flores rosárum et lília convállium.
  en: |
    R. I saw her, when, fair like a dove, she winged her flight above the rivers of waters. The priceless savour of her perfumes hung heavy in her garments. * And about her it was as the flower of roses in the spring of the year, and lilies of the valleys. V. Who is this that cometh out of the wilderness like a pillar of smoke, perfumed with myrrh and frankincense? R. And about her it was as the flower of roses in the spring of the year, and lilies of the valleys.
status:
  la: verified
  en: draft
