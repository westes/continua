# Sourced directly from the raw reference files (web/www/horas/Latin+English/Sancti/01-09.txt): the Epiphany octave's counted day 4 (Sundays not counted -- see OctaveConfig.skipsSunday). Lectio4-6 plus the Lectio7-9 continuation, bare Gospel incipit dropped, collapsed into one reading as every octave reading here is.
id: epiphany-octave-day-4
source:
  la: "Sermo sancti Leónis Papæ; Homilía sancti Gregórii Papæ"
  en: "From the Sermons of Pope St. Leo the Great; Homily by Pope St. Gregory the Great"
text:
  la: |
    Celebrato próximo die, quo intemeráta virginitas humani generis edidit Salvatórem, Epiphaníæ nobis, dilectíssimi, veneranda festívitas dat perseverantiam gaudiórum: ut inter cognatárum solemnitátum vicina sacramenta, exsultatiónis vigor, et fervor fidei non tepescat. Ad ómnium enim hóminum spectat salútem, quod infántia mediatoris Dei et hóminum, jam universo declarabátur mundo, cum adhuc exíguo detinerétur oppídulo.

    Quamvis enim Israëliticam gentem, et ipsíus gentis unam familiam delegísset, de qua natúram univérsæ humanitátis assumeret: nóluit tamen intra maternæ habitatiónis angustias ortus sui latére primordia: sed mox ab ómnibus vóluit agnosci, qui dignátus est pro ómnibus nasci. Tribus ígitur Magis in regióne Oriéntis stella novæ claritátis appáruit, quæ illustrior ceteris pulchriorque sidéribus, fácile in se intuéntium óculos animosque convérteret: ut conféstim adverterétur, non esse otiosum, quod tam insólitum videbátur.

    Dedit ergo aspiciéntibus intelléctum, qui præstitit signum: et quod fecit intelligi, fecit inquiri, et se inveniéndum óbtulit requisítus. Sequúntur tres viri superni lúminis ductum, et prævii fulgoris indícium inténta contemplatióne comitántes, ad agnitiónem veritátis, gratiæ splendore ducúntur: qui humano sensu significátum sibi Regis ortum æstimavérunt in civitáte regia esse quæréndum. Sed qui servi susceperat formam, et non judicáre vénerat, sed judicári, Bethlehem præelégit nativitáti, Jerosolymam passióni.

    Magnum vero nobis aliquid Magi ínnuunt, quod in regiónem suam per aliam viam revertúntur. In eo namque quod admóniti faciunt, nobis profecto insinuant quid faciámus. Regio quippe nostra paradisus est: ad quam, Jesu cógnito, redire per viam, qua vénimus, prohibemur. A regióne étenim nostra superbiéndo, inobediendo, visibília sequéndo, cibum vétitum gustando discessimus: sed ad eam necesse est, ut flendo, obediendo, visibília contemnendo, atque appetítum carnis refrenando redeamus.

    Per aliam ergo viam ad regiónem nostram regrédimur: quóniam qui a paradisi gaudiis per delectaménta discessimus, ad hæc per laménta revocamur. Unde necesse est, fratres caríssimi, ut semper pávidi, semperque suspecti, ponámus ante óculos cordis, hinc culpas operis, illinc judícium extremæ districtiónis. Pensemus, quam districtus judex véniat, qui judícium minátur, et latet: terróres peccatóribus intentat, et tamen adhuc sústinet: et idcirco veníre citius differt, ut minus invéniat quod condemnet.

    Puniámus fletibus culpas, et cum Psalmistæ voce, præveniámus fáciem ejus in confessione. Voluptátum nos ergo fallacia nulla decipiat, nulla vana lætítia seducat. In próximo namque est judex, qui dixit: Væ vobis, qui ridetis nunc; quia lugébitis et flébitis. Hinc enim Sálomon ait: Risus dolori miscébitur: et, Extrema gaudii luctus óccupat. Hinc íterum dicit: Risum deputávi errórem, et gáudio dixi, Quid frustra decíperis? Hinc rursus ait: Cor sapiéntium ubi tristítia est: et cor stultórum ubi lætítia.
  en: |
    Dearly beloved brethren, we have but lately celebrated that day whereon the inviolate virginity of Blessed Mary gave to man a Saviour. And now the venerable solemnity of the Epiphany giveth us a continuance of joy. So that by the nearness of these two holy Feasts, the freshness of our gladness and the quickening of our faith hath no time wherein to die away. And truly it concerneth the salvation of all men, that the Mediator between God and men is already made manifest before leaving the humble city of His birth.

    It is true that the Lord chose the nation of Israel, and in that nation one family, whence to take upon Him that nature which He shareth with all mankind, but, at the same time, He would not that the narrow walls of His Mother's house should imprison within them all the brightness of His appearing, and, as He was pleased to be born for all, so willed He to be forthwith made manifest to all. Three wise men in the East, therefore, saw a new and brilliant star, which, by excelling all others in brightness and beauty, attracted the eyes and thoughts of all beholders and thereby it became at once evident that some new and great event had befallen.

    Then He Who had given the sign, gave understanding to those that saw it; and having given to them to understand that He was born, He gave them the grace to seek Him; and, being sought by them, was pleased to be found. The three wise men followed the guiding of the heavenly light, and, with their eyes firmly fixed upon the glory that went before them, were so led by the light of grace as to obtain the knowledge of truth. They, knowing that He was born a King, sought Him in the Royal City; but He Who had taken upon Him the form of a servant, and came not to judge but to be judged, had chosen Bethlehem for His birth, and Jerusalem for His Suffering.

    The wise men teach us a great lesson in that they departed into their own country another way. That which they did, being warned of God in a dream, we ought to do. Our country is heaven; and, when we have once known Jesus, we can never get there by returning on the way wherein we walked before we knew Him. We have left our country far, by the way of pride, and disobedience, and worldliness, and forbidden indulgence we must seek that heavenly Fatherland by tears, by subjection, by contempt of the things which are seen, and by curbing the fleshly appetites.

    Let us then depart into our own country another way. They that have by enjoyment put themselves away from it, must seek it again by sorrow. Therefore, my dearly beloved brethren, it behoveth us to be ever fearful and watch, having continually before the eyes of our heart, on the one hand, the guilt of our doings, and, on the other, the judgment at the latter day. It behoveth us to think how that awful Judge will surely come, Whose judgment is hanging over us, and hath not yet fallen the wrath to come is before sinners, and hath not yet smitten them and the Judge yet tarrieth in order that, when He cometh, there may haply be less to condemn.

    Let us afflict ourselves for our faults with weeping, and, with the Psalmist, let us come before His Presence with thanksgiving. Let us take heed that we be not fooled by the appearance of earthly happiness, or seduced by the vanity of earthly pleasure. For the Judge is at hand, even He That saith Woe unto you that laugh now, for ye shall mourn and weep, (Luke vi. 25.) Hence also Solomon saith Even in laughter the heart is sorrowful; and the end of that mirth is heaviness, (Prov. xiv. 13.) And again: I said of laughter, It is mad; and of mirth, What doeth it? (Eccles. ii. 2.) And yet again The heart of the wise is in the house of mourning, but the heart of fools is in the house of mirth, (vii. 5.)
responsory:
  la: |
    R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et habent in se divína mystéria: * In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram. V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris suis mýsticas ei múnerum spécies obtulérunt. R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram.
  en: |
    R. There are three precious gifts which the wise men offered unto the Lord on this day, and they speak a mystery of the things of God: * Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying. V. The wise men worshipped the Captain of our Salvation, as He lay in the manger, and when they had opened their treasures, they presented unto Him mystic gifts. R. Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying.
