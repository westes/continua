id: sacred-heart-octave-day-7
source:
  la: "Ex lítteris Encyclicis Pii Papæ undécimi; Homilía sancti Cyrílli Alexandríni"
  en: "From the Encyclical Letter of Pope Pius XI; Homily of St. Cyril of Alexandria"
text:
  la: |
    Quantópere autem hujúsmodi expiatiónis seu reparatiónis necéssitas hac nostra potíssimum ætáte úrgeat, némini non maniféstum erit, qui, ut inítio díximus, hunc mundum in malígno pósitum, óculis animóque perlustráverit. Undique enim geméntium ad Nos populórum clamor adscéndit, quorum príncipes vel rectóres vere adstitérunt et convenérunt in unum advérsus Dóminum et advérsus Ecclésiam ejus. At étiam doléndum, quod inter ipsos fidéles, sánguine Agni immaculáti in baptísmo ablútos, gratiáque locupletátos, tot inveniántur cujúsvis órdinis hómines, qui incredíbili rerum divinárum ignorántia laborántes et falsis doctrínis infécti, vítiis irretítam, procul a domo Patris, vitam tradúcant, quam nec veræ fídei lumen collústrat, nec spes futúræ beatitátis deléctat, nec ardor réficit fovétque caritátis, ut sedére in ténebris et in umbra mortis vere videántur.

    Hisce vero malis véluti in cúmulum accédit cum eórum ignávia atque socórdia, qui, dormitántium et fugiéntium instar discipulórum, nutántes in fide, Christum angóribus oppréssum vel Sátanæ satellítibus circumvéntum mísere derelínquunt, tum eórum perfídia, qui, Judæ proditóris exémplum secúti, aut témere et sacrílege de altári libant, aut ad hóstium castra transfúgiunt. Atque ita vel invítum subit cogitátio ánimum, jam própius adventáre témpora de quibus Dóminus Noster vaticinátus est: Et quóniam abundávit iníquitas, refrigéscet cáritas multórum. Quæ quidem ómnia quotquot pie commentáti erunt fidéles, fácere non póterunt, quin, Christi perdoléntis incénsi caritáte, vehementióre stúdio suas aliorúmque culpas éxpient, Christi honórem resárciant, æternámque próvehant animárum salútem.

    Et sane illud Apóstoli: Ubi abundávit delíctum, superabundávit grátia, áliquo pacto ad hanc quoque ætátem nostram describéndam accommodáre licet: nam, aucta ádmodum perversitáte hóminum, mirífice item, Spíritu Sancto afflánte, númerus fidélium utriúsque sexus augétur, qui alacrióre ánimo pro tot illátis injúriis divíno Cordi satisfácere student, immo étiam se ipsos Christo víctimas offérre non dúbitant. Etenim quæ usque adhuc memorávimus si quis secum ánimo réputet amánter eadémque véluti in medúllis defíxa hábeat, fíeri profécto non potest quin is non tam ab omni peccáto tamquam summo malo abhórreat atque abstíneat, quam se totum Dei voluntáti permíttat, et læsum divínæ Majestátis honórem, cum continénter orándo, tum afflictatiónibus sponte suscéptis ærumnísque, si quæ incíderint, patiénter tolerátis, tum tota demum vita hoc expiatiónis stúdio exigénda, resarcíre conténdat.

    Non hæc ait beátus Evangelísta, quasi pietátem ullam efferátis et crudélibus Judǽis tríbuat, sed ut osténdat stulte eos et imperíte excoláre cúlicem, et camélum deglutíre sicut a Christo dictum est. Gravíssima enim et immánia scélera pro níhilo dúcere comperiúntur: mínima vero et exília caute ádmodum ac sollícite obsérvant, suam utrobíque pandéntes inscítiam. Quod in promptu est osténdere. Ecce enim Christo interfécto sábbati honórem magni fáciunt, et incredíbili audácia, violáto legis auctóre, pietátem erga legem præ se ferunt.

    Magnum autem illíus præcípue sábbati diem cólere símulant, qui magnæ diéi Dóminum interemérunt, et grátiam se solis dignam flágitant, ut eórum nempe crura frangántur, intolerábili dolóre acerbiórem morte ipsa perníciem prope jam mórtuis moliéntes. Venérunt ergo mílites, et primi quidem fregérunt crura, et altérius qui crucifíxus est cum eo. Judæórum petitióni mílites obsecúti, qui símili crudelitátis furóre laborábant, duórum quidem latrónum, quippe qui vivi adhuc repérti essent, crura confríngunt. Sed, cum Jesum inclinásse caput comperíssent, et jam exspirásse putárent, frustra ejus crura confríngi exístimant, sed, cum adhuc mórtuum esse nonníhil diffidérent, láncea latus ejus perfódiunt, unde cruor aqua mixtus scatúriit, quod eulógiæ mýsticæ et sancti baptísmatis imágo quædam erat atque primítiæ.

    Ex iis autem quæ contigérunt, sapientíssimus Evangelísta confírmat auditóribus eum esse Christum, qui per sanctas olim prædíctus est Scriptúras; consentánea enim divínis de eo oráculis evenérunt: nec enim os ejus confráctum est, et mílitum láncea transfíxus est, secúndum Scriptúras. Spectatórem vero ejus rei ait exstitísse discípulum ipsum qui testimónium pérhibet de his, et scire se vera testári, seípsum his verbis, non álium dénotans.
  en: |
    Anyone who will use his eyes and mind, if he but think of this world, whereof it is truly said, "The whole world lieth in wickedness," can see how urgent, especially in these our own times, is the need for expiation or atonement. For there come to Our ears from every side the cries of nations, whose rulers or governments have actually risen up, and conspired together, against the Lord, and against His Church. Nor is that other sight less sad: that even among the faithful, washed as they are by Baptism in the blood of the Lamb without spot, and enriched by His grace, we find so many of every station in life who are ignorant of divine things, and poisoned by false doctrine, and who do live a sinful life, far from their Father's house, without the light of the true Faith, without the joy of a hope in the future life, deprived of the strength and comfort which come with the Spirit of Love — so that it may be said of them quite truthfully: "They sit in darkness and in the shadow of death."

    To the aforesaid accumulation of evils must be added the sloth and indifference of many of His followers, who are like unto the disciples that fled from Him or slept — such as are not firmly rooted in the Faith, and have therefore shamefully abandoned Christ at a time when He is burdened with sorrows and attacked by the hosts of Satan. And other of His followers are like unto Judas the traitor, in that they walk in the footsteps of perfidy — such as approach the Sacrament of the Altar with sacrilegious boldness, or even go over to the camp of the enemy. And we are therefore moved to think that now is come the hour of which our Lord prophesied: "Because iniquity shall abound, the love of the many shall grow cold." If those who remain faithful, on fire with love at the sufferings of Christ, will but meditate on these considerations, it is unthinkable that they will do other than strive with greater zeal to expiate both their own faults and the faults of others, and thus seek to make reparation for the dishonour done to Christ, and be filled with zeal for the eternal salvation of souls.

    Surely we shall do well to apply to this our own age what the Apostle wrote: "Where sin abounded, grace did much more abound." For even though the sinfulness of man doth greatly increase, by the grace of the Holy Spirit there doth also increase in number those of both sexes who most cheerfully do endeavour to make satisfaction to the divine Heart for the numerous injuries heaped thereupon; nay more, they even cheerfully offer themselves as victims for sin. Verily, anyone that considereth in a spirit of love all that hath been said above, if he have impressed such things on the fleshly tablets of his own heart, as it were, cannot but abhor and flee sin as the greatest of all evils. Such an one will therefore offer himself wholly and completely to the will of God, and by constant prayer, willing penances, and the patient endurance of all the ills that befall him, will endeavour to repair the injuries done to the Majesty of God. In a word, he will so order his whole life that it be governed by this same spirit of reparation.

    The blessed Evangelist doth not record these things as if they were evidence of some godliness amidst all the savage cruelty which Jewry had manifested. Rather, by them he doth shew how foolishly and ignorantly a gnat can be carefully strained out, and a camel swallowed, as Christ Himself had foresaid. For we perceive that they made light of most grievous and awful crimes, the while they took careful and anxious pains to observe mere trivialities; in the which inconsistency they did in both things but display their ignorance, as can be readily shewn. For lo! they put Christ to death, the while they give honour to the Great Sabbath. Thus, with incredible insolence, they make a shew of reverence for the Law concerning the Sabbath, whose very Author they in so doing do dishonour.

    They pretend to shew especial reverence for that Great Sabbath Day — they who have put to death the Lord of that great day! And thereupon they earnestly beseech a favour worthy of such folk alone, namely, that the legs of the crucified ones may be broken; and thereby was inflicted an intolerable pain, a bitterer misfortune than death itself, on men who were already well nigh at the point of death. The Evangelist saith: "Then came the soldiers and brake the legs of the first, and of the other which was crucified with him." Thus it doth appear that the soldiers who went in answer to this request were labouring under a frenzy of cruelty like to that of Jewry itself, and therefore they brake the legs of the two thieves whom they found yet alive. But when they came to Jesus, whose head was bowed, they concluded that He was dead already, so that it was useless to go to the trouble of breaking His legs. But to make quite certain that He was dead indeed, they did pierce His side with a spear; and forthwith there came out blood and water — a figure of the mystical Banquet and of holy Baptism, and also the first-fruits of the same.

    And from these things which came to pass, the most wise Evangelist proveth to his hearers that this is the Christ, who was long ago foretold by holy Scripture; for all that happened doth agree with what was prophesied through God concerning Him. And so, according to the Scriptures, not a bone of Him was broken, and He was pierced with the soldier's lance. The Evangelist doth certainly say that the one who saw this thing was the same disciple that gave testimony concerning these things, and that he knew that his testimony was true, by this expression meaning not another, but himself.
