# Verified against Divinum Officium (Monastic Tridentinum 1617), live
# prayMatutinum query (2025-09-15). Matins reading for day 8, the Nativity's
# own octave-concluding day (In Octavam Nativitatis B.M.V.) -- collapsed into
# one continuous reading per project convention. A direct Scripture reading
# (Canticles 1:1-3). The source's own English translation is used as-is,
# including gaps in its own punctuation (some older "oct"/"bmv"-suffixed
# variant files drop question marks entirely in places) -- not corrected here,
# since guessing where they belong isn't the same class of fix as an isolated
# single-character typo.
id: nativity-bvm-octave-day-8
source: "Incípiunt Cántica canticórum"
text:
  la: |
    Incípiunt Cántica canticórum Cant 1:1-3 1 Osculétur me ósculo oris sui, quia melióra sunt úbera tua vino, 2 Fragrántia unguéntis óptimis. Oleum effúsum nomen tuum; ídeo adolescéntulæ dilexérunt te. 3 Trahe me: post te currémus in odórem unguentórum tuórum. Introdúxit me rex in cellária sua; exsultábimus et lætábimur in te mémores úberum tuórum super vinum. Recti díligunt te.

    Cant 1:4-6 4 Nigra sum, sed formósa, fíliæ Jerúsalem, sicut tabernácula Cedar, sicut pelles Salomónis. 5 Nolíte me consideráre quod fusca sim, quia decolorávit me sol. Fílii matris meæ pugnavérunt contra me, posuérunt me custódem in víneis, víneam meam non custodívi. 6 Indica mihi, quem díligit ánima mea, ubi pascas, ubi cubes in merídie, ne vagári incípiam post greges sodálium tuórum.

    Cant 1:7-10 7 Si ignóras te, o pulchérrima inter mulíeres, egrédere et abi post vestígia gregum, et pasce hædos tuos juxta tabernácula pastórum. 8 Equitátui meo in cúrribus pharaónis assimilávi te, amíca mea. 9 Pulchræ sunt genæ tuæ sicut túrturis, collum tuum sicut monília. 10 Murénulas áureas faciémus tibi vermiculátas argénto.
  en: |
    Lesson from the book of Canticles Song 1:1-3 1 Let him kiss me with the kiss of his mouth: for thy breasts are better than wine, 2 Smelling sweet of the best ointments. thy name is as oil poured out: therefore young maidens have loved thee. 3 Draw me: we will run after thee to the odour of thy ointments. The king hath brought me into his storerooms: we will be glad and rejoice in thee, remembering thy breasts more than wine: the righteous love thee.

    Song 1:4-6 4 I am black but beautiful, O ye daughters of Jerusalem, as the tents of Cedar, as the curtains of Solomon. 5 Do not consider me that I am brown, because the sun hath altered my colour: the sons of my mother have fought against me, they have made me the keeper in the vineyards: my vineyard I have not kept. 6 Show me, O thou whom my soul loveth, where thou feedest, where thou liest in the midday, lest I begin to wander after the flocks of thy companions.

    Song 1:7-10 7 If thou know not thyself, O fairest among women, go forth, and follow after the steps of the flocks, and feed thy kids beside the tents of the shepherds. 8 To my company of horsemen, in Pharao's chariots, have I likened thee, O my love. 9 Thy cheeks are beautiful as the turtledove's, thy neck as jewels. 10 We will make thee chains of gold, inlaid with silver.
responsory:
  la: |
    ℟. Hódie nata est beáta Virgo María ex progénie David; * Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo. ℣. Nativitátem beátæ Maríæ Vírginis cum gáudio celebrémus. ℟. Per quam salus mundi credéntibus appáruit, cujus vita gloriósa lucem dedit sǽculo.
  en: |
    ℟. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. ℣. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. ℟. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
