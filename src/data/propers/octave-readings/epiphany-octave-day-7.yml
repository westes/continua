# Sourced directly from the raw reference files (web/www/horas/Latin+English/Sancti/01-12.txt): the Epiphany octave's counted day 7 (Sundays not counted -- see OctaveConfig.skipsSunday). Lectio4-6 plus the Lectio7-9 continuation, bare Gospel incipit dropped, collapsed into one reading as every octave reading here is.
id: epiphany-octave-day-7
source:
  la: "Sermo sancti Leónis Papæ; Homilía sancti Joánnis Chrysóstomi"
  en: "From the Sermons of Pope St. Leo the Great; Homily by St. John Chrysostom"
text:
  la: |
    Justum et rationábile, dilectíssimi, veræ pietátis obséquium est in diébus, qui divínæ misericórdiæ ópera protestántur, toto corde gaudére, et honorífice ea, quæ ad salútem nostram gesta sunt, celebráre, vocánte nos ad hanc devotiónem ipsa recurréntium témporum lege, quæ nobis post diem, in quo coætérnus Patri Fílius Dei natus ex Vírgine est, brevi intervállo Epiphaníæ íntulit festum, ex apparitióne Dómini consecrátum.

    In quo fídei nostræ magnum præsídium providéntia divína constítuit: ut, dum solémni veneratióne recólitur adoráta in exórdiis suis Salvatóris infántia, per ipsa originália documénta probarétur veri hóminis in ipso orta natúra. Hoc enim est quod justíficat ímpios, hoc est quod ex peccatóribus facit sanctos, si in uno eodémque Dómino nostro Jesu Christo et vera Déitas, et vera credátur humánitas: Déitas, qua ante ómnia sæcula in forma Dei æquális est Patri: humánitas, qua novíssimis diébus in forma servi unítus est hómini.

    Ad roborándam ergo hanc fidem, quæ contra omnes præmuniebátur erróres, ex magna gestum est divíni pietáte consílii ut gens in longínqua Orientális plagæ regióne consístens, quæ spectandórum síderum arte pollébat, signum nati púeri, qui supra omnem Israël esset regnatúrus, accíperet. Nova étenim cláritas apud Magos stellæ illustrióris appáruit, et intuéntium ánimos ita admiratióne sui splendóris implévit, ut nequáquam sibi créderent negligéndum, quod tanto nuntiabátur indício.

    Magi, intrántes domum, vidérunt púerum cum María, matre ejus. Et procidéntes adoravérunt eum; et, apértis thesáuris, obtulérunt ei múnera, aurum, thus et myrrham. Verum quid illos ad púerum adorándum indúxit? Neque enim Virgo insígne quídpiam præ se ferébat, neque domus magnífica erat, neque istic áliquid áliud erat quod posset illos vel percéllere vel allícere. Illi vero non modo adórant, sed, apértis thesáuris suis, múnera ófferunt, múnera, inquam, non quasi hómini, sed quasi Deo. Thus enim et myrrha máxime Dei symbolum erat. Quid ígitur hoc illis suásit? Idípsum quod excitávit illos, ut, relícta domo, tantum iter suscíperent: nimírum stella et illustrátio mentis a Deo ipsis índita, quæ paulátim illos ad perfectiórem notítiam dedúxit.

    Nisi enim res ita se habéret, cum ómnia quæ istic videbántur, vília essent, non ei tantum exhibuíssent honórem. Ideo autem nihil eórum, quæ sub sensum cadunt, ibi magnum erat, sed præsépe, tugúrium, mater inops; ut nudam Magórum philosophíam perspícias, atque discas, eos non ut hóminem purum, sed ut Deum, et ipsum benéficum, adivísse. Quaprópter nullo eórum quæ extrínsecus videbántur, offénsi sunt, sed adorárunt; et dona obtulérunt, quæ dona multum a Judáica crassítie differébant. Neque enim oves et vítulos immolárunt, sed quæ ecclesiásticæ philosophíæ vicína erant; síquidem sciéntiam, obediéntiam et dilectiónem ipsi offerébant.

    Et, respónso accépto in somnis, ne redírent ad Heródem, per áliam viam revérsi sunt in regiónem suam. Hic mihi vide fidem ipsórum, quómodo non offendántur, sed sint quiéti et obtemperántes, neque turbéntur, neque tália mútuo loquántur: Sane, si magnus hic puer est, et si quam habet poténtiam, quid opus fuga et occúlto discéssu? cur vero nos, qui palam et cum fidúcia accéssimus ad pópulum tantum, et coram furénte rege stétimus, quasi fugitívos ex civitáte dimíttit Angelus? At nihil tale vel dixérunt vel cogitárunt. Illud enim máxime ad fidem pértinet, ut nulla mandatórum exquirátur rátio, sed jussis tantum obediátur.
  en: |
    This meet and right, dearly beloved brethren, yea, it is our bounden duty and godly service, to rejoice with full hearts upon those days which more especially set forth before us the workings of God's mercy; and to have in honourable memory those things that were done for our salvation. Hereto are we called by the seasons of the year which continually return, and notably by this present, which, after but a short time hath passed since that day whereon the Coeternal Son of God was born of a Virgin, bringeth now the Feast of the Epiphany, hallowed by the Manifestation of the Lord.

    In this said Manifestation the good Providence of God hath appointed a strong bulwark to our faith. For now, while in solemn worship we call to mind how the childhood of the Saviour was adored in its first infancy, we receive from the original Scriptures the doctrine that Christ was born with the very nature of man. For this is that which maketh of sinners saints, even to believe that in one and the same our Lord Jesus Christ there is very Godhead and very Manhood very Godhead, as touching Which, He, being in the form of God, is equal to the Father from everlasting to everlasting and very Manhood, wherein He, taking upon Him the form of a servant, hath in these latter days been born Man.

    For the strengthening of this our faith, which we profess in the face of every false doctrine, the mercy of God hath made it to come to pass that one of those peoples who dwell in the uttermost parts of the East, and excel in the skill of reading the stars, should see the sign of the birth of that Child Who was to reign over all Israel. There appeared to the eyes of wise men a new star of such passing beauty, as wrought in the minds of all that saw it the persuasion that the event, which is announced, was of an importance not to be neglected.

    “The wise men entering into the house, they found the child with Mary his mother, and falling down they adored him: and opening their treasures, they offered him gifts; gold, frankincense, and myrrh.” (Matthew 2:11) But what was it that induced them to worship? For neither was the Virgin conspicuous, nor the house distinguished, nor was any other of the things which they saw apt to amaze or attract them. Yet they not only worship, but also open their treasures, and offer gifts; and gifts, not as to a man, but as to God. For the frankincense and the myrrh were a symbol of this. What then was their inducement? That which wrought upon them to set out from home and to come so long a journey; and this was both the star, and the illumination wrought of God in their mind, guiding them little by little to the more perfect knowledge.

    For, surely, had it not been so, all that was in sight being ordinary, they would not have shown so great honor. Therefore none of the outward circumstances was great in that instance, but it was a manger, and a shed, and a mother in poor estate; to set before your eyes, naked and bare, those wise men's love of wisdom, and to prove to you, that not as mere man they approached Him, but as a God, and Benefactor. Wherefore neither were they offended by ought of what they saw outwardly, but even worshipped, and brought gifts; gifts not only free from Judaical grossness, in that they sacrificed not sheep and calves, but also coming near to the self-devotion of the Church, for it was knowledge and obedience and love that they offered unto Him.

    “And having received an answer in sleep that they should not return to Herod, they went back another way into their country.” (Matthew 2:12) See from this also their faith, how they were not offended, but are docile, and considerate; neither are they troubled, nor reason with themselves, saying, And yet, if this Child be great, and has any might, what need of flight, and of a clandestine retreat? And wherefore can it be, that when we have come openly and with boldness, and have stood against so great a people, and against a king's madness, the angel sends us out of the city as runaways and fugitives? But none of these things did they either say or think. For this most especially belongs to faith, not to seek an account of what is enjoined, but merely to obey the commandments laid upon us.
responsory:
  la: |
    R. Tria sunt múnera pretiósa, quæ obtulérunt Magi Dómino in die ista, et habent in se divína mystéria: * In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram. V. Salútis nostræ auctórem Magi veneráti sunt in cunábulis, et de thesáuris suis mýsticas ei múnerum spécies obtulérunt. R. In auro, ut ostendátur Regis poténtia: in thure, Sacerdótem magnum consídera: et in myrrha, Domínicam sepultúram.
  en: |
    R. There are three precious gifts which the wise men offered unto the Lord on this day, and they speak a mystery of the things of God: * Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying. V. The wise men worshipped the Captain of our Salvation, as He lay in the manger, and when they had opened their treasures, they presented unto Him mystic gifts. R. Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying.
