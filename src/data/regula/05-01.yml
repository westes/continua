# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "05-01"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 73: De hoc quod non omnis justítiæ observátio in hac sit régula constitúta"
  en: "The Rule of our Holy Father Benedict. Chapter 73: Concerning This, Namely That Not Every Observance of Righteousness Is Laid Down In This Rule"
text:
  la: |
    Régulam autem hanc descrípsimus, ut hanc observántes in monastériis aliquátenus vel honestátem morum aut inítium conversatiónis nos demonstrémus habére. Céterum ad perfectiónem conversatiónis qui festínat, sunt doctrínæ sanctórum Patrum, quarum observátio perdúcat hóminem ad celsitúdinem perfectiónis. Quæ enim página aut qui sermo divínæ auctoritátis Véteris ac Novi Testaménti non est rectíssima norma vitæ humánæ? Aut quis liber sanctórum catholicórum Patrum hoc non résonat ut recto cursu perveniámus ad Creatórem nostrum? Necnon et Collatiónes Patrum et Institúta et Vitas eórum, sed et régula sancti Patris nostri Basílii, quid áliud sunt nisi bene vivéntium et obœdiéntium monachórum instruménta virtútum? Nobis autem desidiósis et male vivéntibus atque neglegéntibus rubor confusiónis est. Quisquis ergo ad pátriam cæléstem festínas, hanc mínimam inchoatiónis régulam descríptam adjuvánte Christo pérfice; et tunc demum ad majóra, quæ supra commemorávimus, doctrínæ virtutúmque cúlmina Deo protegénte pervénies. Amen.
  en: |
    Now we have written out this rule in order that by observing it in our monasteries we may show ourselves to have, to some degree, integrity of life, or the beginning at least of conversion. For the rest, for those who hasten to the perfection of conversion, there are the teachings of the holy fathers, the observing of which brings a man to the height of perfection: and indeed what page or what text of the divine authority of the Old and the New Testament is not an unerring rule of human life? Or what book of the holy catholic fathers does not re-echo this, that by a straight course we may come to our Creator? Moreover also the conferences of the fathers and their institutes and their lives and also the rule of our holy father Basil, what else are they but store houses of the virtues of good-living and obedient monks? But to us, indolent, ill-living and negligent, belong shame and confusion. Whosoever therefore thou art who dost hasten to the heavenly country, fully carry out, Christ helping thee, this most elementary rule that we have written out; and then at last thou shalt come, God protecting thee, to the loftier heights of doctrine and of virtue which we have mentioned above.
status:
  la: verified
  en: verified
