# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-28"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 22: Quómodo dórmiant mónachi"
  en: "The Rule of our Holy Father Benedict. Chapter 22: How the Monks Are to Sleep"
text:
  la: |
    Sínguli per síngula lecta dórmiant. Lectistérnia pro modo conversatiónis secúndum dispensatiónem abbátis sui accípiant. Si potest fíeri omnes in uno loco dórmiant; sin autem multitúdo non sinit, deni aut vicéni cum senióribus qui super eos sollíciti sint, pausent. Candéla júgiter in eádem cella árdeat usque mane. Vestíti dórmiant et cincti cíngulis aut fúnibus, ut cultéllos suos ad latus suum non hábeant dum dórmiunt, ne forte per sómnium vúlnerent dormiéntem; et ut paráti sint mónachi semper et, facto signo absque mora surgéntes, festínent ínvicem se præveníre ad opus Dei, cum omni tamen gravitáte et modéstia. Adulescentióres fratres juxta se non hábeant lectos, sed permíxti cum senióribus. Surgéntes vero ad opus Dei ínvicem se moderáte cohorténtur propter somnulentórum excusatiónes.
  en: |
    Let them sleep singly in separate beds. Let them receive bedding suitable to their manner of life, at the discretion of the abbot. If it can be done, let all sleep in one room: but if their number does not allow of this, let them repose by tens or by twenties with their seniors who have charge of them. Let a candle burn continually in the dormitory until morning. Let them sleep clothed and girded with girdles or cords, but let them not have knives at their sides while they sleep, lest by chance while dreaming they wound a sleeper; and let them be monks always ready; and upon the signal being given let them rise without delay and hasten one after the other, yet with all gravity and decorum, to be ready in good time for the Work of God. Let not the younger brethren have their beds by themselves, but among those of the seniors: and let them be allowed gently to encourage one another as they rise for the Work of God, because some may feel drowsy and listless.
status:
  la: verified
  en: verified
