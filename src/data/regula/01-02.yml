# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-02"
label:
  la: "Prólogo Sancti Patri Nostri Benedícti in Régulam suam."
  en: "Prologue to the Rule of our Holy Father Benedict. Continued"
text:
  la: |
    Exurgámus ergo tandem aliquándo excitánte nos Scriptúra ac dicénte: Hora est jam nos de somno súrgere, et apértis óculis nostris ad deíficum lumen adtónitis áuribus audiámus divína cotídie clamans quid nos ádmonet vox dicens: Hódie si vocem ejus audiéritis, nolíte obduráre corda vestra. Et íterum: Qui habet aures audiéndi áudiat, quid Spíritus dicat ecclésiis. Et quid dicit? Veníte, fílii, audíte me; timórem Dei docébo vos. Cúrrite dum lumen vitæ habétis, ne ténebræ mortis vos conprehéndant.
  en: |
    Let us therefore now at length rise up as the Scripture incites us when it says: “Now is the hour for us to arise from sleep.” And with our eyes open to the divine light, let us with astonished ears listen to the admonition of God’s voice daily crying out and saying: “Today if ye will hear His voice, harden not your hearts.” And again: “He who has the hearing ear, let him hear what the Spirit announces to the churches.” And what does the Spirit say? “Come, children, listen to me: I will teach you the fear of the Lord. Run while ye have the light of life, that the shades of death envelop you not.”
status:
  la: verified
  en: verified
