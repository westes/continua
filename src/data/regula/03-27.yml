# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-27"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 47: De significánda hora óperis Dei"
  en: "The Rule of our Holy Father Benedict. Chapter 47: of Notifying the Hour of the Work of God"
text:
  la: |
    Nuntiánda hora óperis Dei dies noctísque sit cura abbátis; aut ipse nuntiáre aut tali sollícito fratri injúngat hanc curam, ut ómnia horis conpeténtibus conpleántur. Psalmos autem vel antefánas post abbátem órdine suo quibus jussum fúerit inpónant. Cantáre autem et légere non præsúmat, nisi qui potest ipsud offícium implére ut ædificéntur audiéntes; quod cum humilitáte et gravitáte et tremóre fiat, et cui jússerit abbas.
  en: |
    As to notifying the hour of the Work of God by day and by night, let the abbot be careful either to notify it himself or else let him entrust the responsibility to a reliable brother, that all things be done at the appointed hours. And the psalms and antiphons let those intone, in their order, after the abbot, whom he shall have appointed. But let not any presume to sing or read but such as can do that work reasonably, that those who hear may be edified. And let it be done with humility and gravity and awe by those to whom the abbot has assigned it.
status:
  la: verified
  en: verified
