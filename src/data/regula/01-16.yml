# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-16"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 3: De adhibéndis ad consílium frátribus"
  en: "The Rule of our Holy Father Benedict. Chapter 3: Concerning the Calling of the Brethren to Council"
text:
  la: |
    Quótiens áliqua præcípua sunt in monastério, cónvocet abbas omnem congregatiónem et dicat ipse unde ágitur. Et áudiens consílium fratrum tractet apud se et quod utílius judicáverit fáciat. Ideo autem omnes ad consílium vocári díximus, quia sæpe junióri Dóminus revélat quod mélius est. Sic autem dent fratres consílium cum omni humilitátis subjectióne, et non præsúmant procáciter deféndere quod eis visum fúerit; et magis in abbátis pendat arbítrio, ut quod salúbrius esse judicáverit, ei cuncti obœ́diant. Sed sicut discípulos cónvenit obœdíre magístro, ita et ipsum próvide et juste cóndecet cuncta dispónere.
  en: |
    As often as any special business has to be transacted in the monastery, let the abbot convoke the whole community and himself state what is the matter in hand. And having listened to the counsel of the brethren, let him settle the matter in his own mind and do what seems to him most expedient. And we have thus said that all are to be called to council because it is often to a junior that the Lord reveals what is best. But let the brethren so give counsel with all subjection and humility that they presume not with any forwardness to defend what shall have seemed good to them; but rather let the decision depend upon the abbot’s discretion, so that he shall decide what is best, that they all may yield ready obedience: but just as it behoves the disciples to be obedient to the master, so also it becomes him to arrange all things prudently and justly.
status:
  la: verified
  en: verified
