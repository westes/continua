# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-11"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 9: Quanti psalmi dicéndi sunt noctúrni"
  en: "The Rule of our Holy Father Benedict. Chapter 9: How Many Psalms Are to Be Said At the Night Hours"
text:
  la: |
    Híemis témpore suprascrípto, in primis versu tértio dicéndum: Dómine, lábia mea apéries, et os meum adnuntiábit laudem tuam. Cum subjungéndus est tértius psalmus et Glória. Post hunc, psalmum nonagésimum quartum cum antefána, aut certe decantándum. Inde sequátur Ambrosiánum, deínde sex psalmi cum antefánas. Quibus dictis, dicto versu, benedícat abbas et, sedéntibus ómnibus in scamnis, legántur vicíssim a frátribus in códice super analogíum tres lectiónes, inter quas et tria responsória canténtur. Duo responsória sine Glória dicántur; post tértiam vero lectiónem, qui cantat dicat Glóriam. Quam dum íncipit cantor dícere, mox omnes de sedília sua surgant ob honórem et reveréntiam sanctæ Trinitátis. Códices autem legántur in Vigíliis divínæ auctoritátis tam Véteris Testaménti quam Novi, sed et expositiónes eárum, quæ a nominátis et orthodóxis cathólicis Pátribus factæ sunt. Post has vero tres lectiónes cum responsória sua, sequántur réliqui sex psalmi cum Alle­lúja canéndi. Post hos, léctio Apóstoli sequátur ex corde recitánda, et versus, et supplicátio litaníæ, id est Kýrie eléison. Et sic finiántur Vigíliæ noctúrnæ.
  en: |
    In the above-written time of winter, first, the verse, “O God, make speed to save us; O Lord, make haste to help us,” with Gloria, having been put first, there is to be said, secondly, “O Lord, open Thou my lips and my mouth shall show forth Thy praise” three times, to which is to be subjoined the third psalm and Gloria and after this the ninety-fourth psalm with antiphon should be said or indeed sung. After this let the Ambrosian hymn follow and then six psalms with antiphons; which said and the versicle said, let the abbot ask a blessing and, all sitting on the benches, let three lections be read in turn by the brethren from a book on the reading-stand, between which lections let there be also three responsories sung. Let two responsories be without Gloria, but after the third lection let him who sings begin the Gloria and when the singer begins it let all forthwith rise from their seats in reverence and honour of the Holy Trinity. But let it be the books of divine authority that are read at night office, alike of the Old Testament and of the New; and also those expositions of them which have been compiled by the most renowned of the orthodox catholic fathers. And after these three lections with their responsories, let there follow another six psalms to be sung with Alle­luia. After these let a lection from the Apostle follow, to be recited by heart and a versicle and the supplication of the litany, that is Kyrie eleison. And so let the night office end.
status:
  la: verified
  en: verified
