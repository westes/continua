# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-03"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 26: De his qui sine jussióne jungunt se excommunicátis"
  en: "The Rule of our Holy Father Benedict. Chapter 26: Concerning Those Who Without the Orders of the Abbot Consort With the Excommunicate"
text:
  la: |
    Si quis frater præsúmpserit sine jussióne abbátis fratri excommunicáto quólibet modo se júngere aut loqui cum eo vel mandátum ei dirígere, símilem sortiátur excommunicatiónis vindíctam.
  en: |
    If any brother shall have presumed to consort with an excommunicated brother without the abbot’s orders, in any way whatever, or to talk to him, or to send a message to him, let him incur the like punishment of excommunication.
status:
  la: verified
  en: verified
