# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-05"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Octávus humilitátis gradus est, si nihil agat mónachus, nisi quod commúnis monastérii régula vel majórum cohortátur exémpla.
  en: |
    The eighth step in humility is if a monk do nothing but what the common rule of the monastery and the example of his seniors suggest.
status:
  la: verified
  en: verified
