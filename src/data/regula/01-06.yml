# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-06"
label:
  la: "Prólogo Sancti Patri Nostri Benedícti in Régulam suam."
  en: "Prologue to the Rule of our Holy Father Benedict. Continued"
text:
  la: |
    Cum ergo interrogassémus Dóminum, fratres, de habitatóre tabernáculi ejus, audívimus habitándi præcéptum; sed si conpleámus habitatóris offícium, érimus herédes regni cælórum. Conpleámus habitatóris offícium. Ergo præparánda sunt corda nostra et córpora sanctæ præceptórum obœdiéntiæ militánda, et quod minus habet in nos natúra possíbile, rogémus Dóminum, ut grátiæ suæ júbeat nobis adjutórium ministráre. Et si, fugiéntes gehénnæ pœnas, ad vitam vólumus perveníre perpétuam, dum adhuc vacat et in hoc córpore sumus et hæc ómnia per hanc lucis vitam vacat implére, curréndum et agéndum est modo quod in perpétuo nobis expédiat.
  en: |
    Since therefore, brethren, we asked of the Lord concerning the dweller in His tabernacle, we have heard, as a precept concerning dwelling there, “if we fulfil what is required of a dweller there.” Therefore must our hearts and bodies be prepared as about to serve like soldiers under holy obedience to these precepts; and whatsoever our nature does not make possible let us ask the Lord to direct that the help of His grace shall supply. And if we wish to escape the pains of hell and attain to eternal life we must hasten to do such things only as may profit us for eternity, now, while there is time for this and we are in this body and there is time to fulfil all these precepts by means of this light.
status:
  la: verified
  en: verified
