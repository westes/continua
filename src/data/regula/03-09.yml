# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-09"
label:
  la: "Cápite 31 Régulæ Sancti Patri Nostri Benedícti: De cellarário monastérii qualis sit"
  en: "The Rule of our Holy Father Benedict. Chapter 31: Concerning the Cellarer of the Monastery, What Sort of a Person He Should Be. Continued"
text:
  la: |
    Humilitátem ante ómnia hábeat, et cui substántia non est quod tribuátur, sermo responsiónis porrigátur bonus, ut scriptum est: Sermo bonus super datum óptimum. Omnia quæ ei injúnxerit abbas, ipsa hábeat sub cura sua; a quibus eum prohibúerit, non præsúmat. Frátribus constitútam annónam sine áliquo tyfo vel mora ófferat, ut non scandalizéntur, memor divíni elóquii, quid mereátur qui scandalizáverit unum de pusíllis. Si congregátio major fúerit, solácia ei dentur, a quibus adjútus et ipse æquo ánimo ímpleat offícium sibi commíssum. Horis conpeténtibus et dentur quæ danda sunt et petántur quæ peténda sunt, nemo perturbétur neque contristétur in domo Dei.
  en: |
    Before all things let him have humility; and let him make kindly reply to any to whom he has no goods that he can give, as it is written: “A good word is above the best gift.” All that the abbot shall have assigned to him let him keep under his care: let him not presume to take anything the abbot shall have forbidden him. Let him distribute to the brethren the appointed allowance, without any arrogance or delay, that they be not scandalized, mindful of the divine word as to what he deserves who shall have scandalized one from among the little ones. If the community be large let helpers be given him, that with their assistance he may still fulfil with equanimity the duties entrusted to him. Let what has to be given out be given out and what has to be asked for be asked for at the suitable times, that nobody be disturbed and nobody embittered in the house of God.
status:
  la: verified
  en: verified
