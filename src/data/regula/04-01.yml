# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-01"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 50: De frátribus qui longe ab oratório labórant aut in via sunt"
  en: "The Rule of our Holy Father Benedict. Chapter 50: Concerning Brethren Who Are Working At a Distance From the Oratory, Or Are On the Road"
text:
  la: |
    Fratres qui omníno longe sunt in labóre et non possunt occúrrere hora conpeténti ad oratórium - et abbas hoc perpéndet quia ita est - agant ibídem opus Dei, ubi operántur, cum tremóre divíno flecténtes génua. Simíliter qui in itínere dirécti sunt, non eos prætéreant Horæ constitútæ, sed, ut possunt, agant sibi et servitútis pensum non néglegant réddere.
  en: |
    Let brethren who are at work quite a long way off or are on the road and cannot get to the oratory at the appointed time, the abbot having decided that such is the case, say their office there where they are at work, kneeling with all reverence. Similarly let not those who have been sent on a journey neglect an appointed hour but keep it, by themselves, and not fail to render the full measure of their holy servitude as they are able.
status:
  la: verified
  en: verified
