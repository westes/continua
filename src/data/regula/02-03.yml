# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-03"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Sextus humilitátis gradus est, si omni vilitáte vel extremitáte conténtus sit mónachus, et ad ómnia quæ sibi injungúntur velut operárium malum se júdicet et indígnum, dicens sibi cum Prophéta: Ad níhilum redáctus sum et nescívi; ut juméntum factus sum apud te et ego semper tecum.
  en: |
    The sixth step in humility is if a monk be content with the meanest and worst of everything and with respect to everything enjoined him adjudge himself a profitless workman and unworthy, saying to himself with the prophet: “I was brought to nothing and was ignorant: I became as a beast of burden before Thee and I am always with Thee.”
status:
  la: verified
  en: verified
