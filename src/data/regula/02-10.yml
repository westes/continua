# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-10"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 8: De offíciis divínis in nóctibus"
  en: "The Rule of our Holy Father Benedict. Chapter 8: Concerning the Divine Office At Night"
text:
  la: |
    Híemis témpore, id est a Kaléndas Novémbres usque in Pascha, juxta consideratiónem ratiónis, octáva hora noctis surgéndum est, ut módice ámplius de média nocte pausétur et jam digésti surgant. Quod vero restat post Vigílias a frátribus qui psaltérii vel lectiónum áliquid índigent, meditatióni inserviátur. A Pascha autem usque ad supradíctas Novémbres sic temperétur hora, ut Vigiliárum agénda parvíssimo intervállo, quo fratres ad necessária natúræ éxeant, mox Matutíni qui incipiénte luce agéndi sunt, subsequántur.
  en: |
    In winter time, that is from the first of November until Easter as found by computation, let rising be at the eighth hour of the night, as seems reasonable, that there may be a moderately increased length of rest after midnight and that all may rise fully rested; and let what time remains after night office be devoted to thoughtful study by brethren who at all need it for the psalter or lections. But from Easter till the above-named first of November, let the time of night office be so arranged that after a very short interval during which the brethren can go out for the necessities of nature, the morning office, which is to be said at day-break, may at once follow.
status:
  la: verified
  en: verified
