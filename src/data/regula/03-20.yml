# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-20"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 41: Quibus horis opórtet refícere fratres"
  en: "The Rule of our Holy Father Benedict. Chapter 41: At What Hours the Brethren Ought to Have Their Meals"
text:
  la: |
    A sancto Pascha usque Pentecósten ad sextam refíciant fratres et sera cenent. A Pentecósten autem tota æstáte, si labóres agrórum non habent mónachi aut nimíetas æstátis non pertúrbat, quarta et sexta féria jejúnent usque ad nonam; réliquis diébus ad sextam prándeant. Quam prándii sextam, si óperis in agris habúerint aut æstátis fervor nímius fúerit, continuánda erit et in abbátis sit providéntia. Et sic ómnia témperet atque dispónat, quáliter et ánimæ salvéntur et quod fáciunt fratres absque justa murmuratióne fáciant. Ab Idus autem Septémbres usque caput quadragésimæ ad nonam semper refíciant. In quadragésima vero usque in Pascha ad vésperam refíciant. Ipsa tamen Véspera sic agátur, ut lucérnæ lumen non indígeant reficiéntes, sed luce adhuc diéi ómnia consumméntur. Sed et omni témpore, sive cena sive refectiónis hora sic temperétur, ut luce fiant ómnia.
  en: |
    From holy Easter until Pentecost let the brethren dine at the sixth hour and sup about sunset; but on the Wednesdays and Fridays during the whole summer, from Pentecost, unless the monks have field work, or the excessive heat of the summer tries them, let them fast until the ninth hour; and on the other days let them dine at the sixth hour. And they should continue to dine thus at the sixth hour if they have been doing field work or if the heat of the summer be oppressive; and let this be within the discretion of the abbot; and similarly let him modify and arrange everything in such wise that both souls be saved and also that what the brethren do they may do without just cause for murmuring. From the fourteenth of September until the beginning of Lent let them always dine at the ninth hour; but in Lent until Easter let them dine at an evening hour; but let that evening hour be so ordered that when dining they may not require the light of a lamp, but may be quite finished while daylight still lingers. And indeed on all occasions let the hour, whether of supper or dinner, be so suitably arranged that everything be done by daylight.
status:
  la: verified
  en: verified
