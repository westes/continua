# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-21"
label:
  la: "Cápite 4 Régulæ Sancti Patri Nostri Benedícti: Quæ sunt instruménta bonórum óperum"
  en: "The Rule of our Holy Father Benedict. Chapter 4: What Are the Instruments of Good Works. Continued."
text:
  la: |
    Præcépta Dei factis cotídie adimplére. Castitátem amáre. Nullum odíre. Zelum non habére. Invídiam non exercére. Contentiónem non amáre. Elatiónem fúgere. Et senióres veneráre. Junióres dilígere. In Christi amóre pro inimícis oráre. Cum discordánte ante solis occásum in pacem redíre. Et de Dei misericórdia numquam desperáre. Ecce hæc sunt instruménta artis spiritális. Quæ cum fúerint a nobis die noctúque incessabíliter adimpléta et in die judícii reconsignáta, illa mercis nobis a Dómino reconpensábitur quam ipse promísit: Quod óculus non vidit nec auris audívit, quæ præparávit Deus his qui díligunt illum. Officína vero ubi hæc ómnia diligénter operémur claustra sunt monastérii et stabílitas in congregatióne.
  en: |
    By deeds daily to fulfil the precepts of God. To love chastity. Not to hate anyone. Not to harbour jealousy. Not to love contention. To avoid elation. To venerate seniors. To love juniors. In the love of Christ to pray for one’s enemies. In case of discord with anyone to make peace before the setting of the sun. And never to despair of the mercy of God.

    Behold, these are the instruments of the spiritual art, the which, when they shall have been ceaselessly employed by us day and night and duly given back in the day of judgment, shall be recompensed to us by that reward from God which He promised: “That which the eye hath not seen, nor the ear heard, and that hath not entered into the human heart, the things which God has prepared for them who love Him.”

    And the cloister of the monastery and stability in the community are the workshop wherein we may diligently effect all these works.
status:
  la: verified
  en: verified
