# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-23"
label:
  la: "Cápite 5 Régulæ Sancti Patri Nostri Benedícti: De obœdiéntia"
  en: "The Rule of our Holy Father Benedict. Chapter 5: Concerning Obedience. Continued."
text:
  la: |
    Sed hæc ipsa obœdiéntia tunc acceptábilis erit Deo et dulcis homínibus, si quod jubétur non trépide, non tarde, non tépide, aut cum murmúrio vel cum respónso noléntis efficiátur, quia obœdiéntia quæ majóribus præbétur Deo exhibétur; ipse enim dixit: Qui vos audit me audit. Et cum bono ánimo a discípulis præbéri opórtet, quia hílarem datórem díligit Deus. Nam, cum malo ánimo si obœ́dit discípulus et non solum ore, sed étiam in corde si murmuráverit, étiam si ímpleat jussiónem, tamen accéptum jam non erit Deo, qui cor ejus réspicit murmurántem. Et pro tali facto nullam conséquitur grátiam, immo pœnam murmurántium incúrrit, si non cum satisfactióne emendáverit.
  en: |
    But this same obedience will only then be acceptable to God and pleasing to man when that which is ordered be carried out neither with trepidation nor tardily and lukewarmly, nor yet with murmuring and the back answer of one unwilling; for obedience yielded to superiors is an offering laid before God: for Himself He has said: “Who hears you, hears Me.” And with good-will should disciples yield it because it is the cheerful giver God loves. For if it is with ill-will the disciple obeys, if even he murmur in his heart and not only by actual word of mouth, though he fulfil the command, yet will he not now be accepted as obedient by God, Who regardeth the heart of the murmurer. And for such act he earns no reward; but rather he incurs the murmurer’s penalty, unless he amend and make satisfaction.
status:
  la: verified
  en: verified
