# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-19"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 16: Quáliter divína ópera per diem agántur"
  en: "The Rule of our Holy Father Benedict. Chapter 16: How the Work of God Is to Be Carried Out During the Day"
text:
  la: |
    Ut ait Prophéta: Sépties in die laudem dixi tibi. Qui septenárius sacrátus númerus a nobis sic implébitur, si Matutíno, Primæ, Tértiæ, Sextæ, Nonæ, Vésperæ Conpletoriíque témpore nostræ servitútis offícia persolvámus, quia de his diúrnis Horis dixit: Sépties in die laudem dixi tibi. Nam de noctúrnis Vigíliis idem ipse Prophéta ait: Média nocte surgébam ad confiténdum tibi. Ergo his tempóribus referámus laudes Creatóri nostro super judícia justítiæ suæ, id est Matutínis, Prima, Tértia, Sexta, Nona, Véspera, Conpletórios, et nocte surgámus ad confiténdum ei.
  en: |
    As says the prophet: “Seven times a day have I offered Thee praise.” The which sacred number of seven we fulfill in this way, if at Lauds Prime, Terce, Sext, None, Vespers and Compline time we discharge the duties of our service. For concerning these hours the prophet said: “Seven times a day have I offered Thee praise.” For, again, concerning night office the same prophet says: “In the middle of the night am I wont to rise and praise Thee.” Therefore let us ascribe to our Creator praise for the judgments of His justice at these hours, namely, at Lauds, Prime, Terce, Sext, None, Vespers, Compline; and at night let us rise to praise Him.
status:
  la: verified
  en: verified
