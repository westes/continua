# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-30"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 72: De zelo bono quod debent mónachi habére"
  en: "The Rule of our Holy Father Benedict. Chapter 72: Concerning the Good Zeal Which Monks Ought to Have"
text:
  la: |
    Sicut est zelus amaritúdinis malus qui séparat a Deo et ducit ad inférnum, ita est zelus bonus qui séparat a vítia et ducit ad Deum et ad vitam ætérnam. Hunc ergo zelum ferventíssimo amóre exérceant mónachi, id est ut honóre se ínvicem prævéniant, infirmitátes suas sive córporum sive morum patientíssime tólerent, obœdiéntiam sibi certátim inpéndant: nullus quod sibi útile júdicat sequátur, sed quod magis álio; caritátem fraternitátis caste inpéndant. Amóre Deum tímeant. Abbátem suum sincéra et húmili caritáte díligant. Christo omníno nihil præpónant, qui nos páriter ad vitam ætérnam perdúcat.
  en: |
    Just as there is an evil zeal of bitterness which separates from God and leads to hell, so there is a good zeal which separates from vices and leads to God and to life eternal. By most fervent love therefore let monks exercise this zeal, that is, let them see to it that in honour they prefer one another. Let them most patiently tolerate their infirmities whether physical or of character; let them compete in yielding obedience; let none follow what he judges convenient to himself, but rather what he judges convenient to another; in chaste love let them exercise fraternal charity; let them fear God; let them love their abbot with sincere and humble affection; on no account let them exalt anything above Christ; and may He bring us all alike to eternal life.
status:
  la: verified
  en: verified
