# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-23"
label:
  la: "Cápite 43 Régulæ Sancti Patri Nostri Benedícti: De his qui ad opus Dei vel ad mensam tarde occúrrunt"
  en: "The Rule of our Holy Father Benedict. Chapter 43: Concerning Those Who Come Late to the Work of God Or to Table. Continued."
text:
  la: |
    Ad mensam autem qui ante versu non occúrrerit, ut simul omnes dicant versu et orent et sub uno omnes accédant ad mensam, qui per neglegéntiam suam aut vítio non occúrrerit, usque secúnda vice pro hoc corripiátur; si dénuo non emendáverit, non permittátur ad mensæ commúnis participatiónem, sed sequestrátus a consórtio ómnium refíciat solus, subláta ei portióne sua vinum, usque ad satisfactiónem et emendatiónem. Simíliter autem patiátur, qui et ad illum versum non fúerit præsens, qui post cibum dícitur. Et ne suis præsúmat ante statútam horam vel póstea quicquam cibi aut potus præsúmere; sed et cui offértur áliquid a prióre et accípere rénuit, hora qua desiderávit hoc quod prius recusávit aut áliud, omníno nihil percípiat usque emendatiónem cóngruam.
  en: |
    If anyone has not come to table before the versicle so that all may recite the versicle and say the prayer together, let him who through his own negligence and fault has not come in be corrected for this once and again: but if even then he has not amended let him not be permitted to share in the common table, but separated from the companionship of all let him have his meal alone and be deprived of his measure of wine until he has made satisfaction and amendment. And in like manner let him suffer who is not present at that versicle which is recited after a meal. And let not anyone presume to take food or drink before or after the appointed hour: but if the superior offers anything to anyone and he refuse to accept it, when the time comes that he desires this that he had previously refused or anything else, he shall on no account receive anything, until he has made suitable satisfaction.
status:
  la: verified
  en: verified
