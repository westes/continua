# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-18"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 15: Allelúia quibus tempóribus dicátur"
  en: "The Rule of our Holy Father Benedict. Chapter 15: In Which Seasons Alleluia Is to Be Said"
text:
  la: |
    A sanctum Pascha usque Pentecósten sine intermissióne dicátur Allelúia, tam in psalmis quam in responsóriis. A Pentecósten autem usque caput quadragésimæ, ómnibus noctis, cum sex posterióribus psalmis tantum ad Noctúrnos dicátur. Omni vero Domínica extra quadragésima cántica, Matutínos, Prima, Tértia, Sexta Nonáque cum Allelúia dicátur, Véspera vero jam antefána. Responsória vero numquam dicántur cum Allelúia, nisi a Pascha usque Pentecósten.
  en: |
    From the holy feast of Easter until Pentecost, without intermission, let Alleluia be said both with the psalms and with the responsories. Every night from Pentecost until the beginning of Lent let it be said at Matins with the six latter psalms only. But on every Lord’s day outside Lent let canticles, Lauds, Prime, Terce, Sext and None be said with Alleluia: Vespers however with antiphons: but responsories may never be said with Alleluia, except from Easter to Pentecost.
status:
  la: verified
  en: verified
