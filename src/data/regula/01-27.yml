# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-27"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Et custódiens se omni hora a peccátis et vítiis, id est cogitatiónum, linguæ, mánuum, pedum vel voluntátis própriæ sed et desidéria , ǽstimet se homo de cælis a Deo semper réspici omni hora et facta sua omni loco ab aspéctu Divinitátis vidéri et ab ángelis omni hora renuntiári. Demónstrans nobis hoc Prophéta, cum in cogitatiónibus nostris ita Deum semper præséntem osténdit dicens: Scrutans corda et renes Deus; et item: Dóminus novit cogitatiónes hóminum; et item dicit: Intellexísti cogitatiónes meas a longe; et: Quia cogitátio hóminis confitébitur tibi. Nam ut sollícitus sit circa cogitatiónes suas pervérsas, dicat semper útilis frater in corde suo: Tunc ero immaculátus coram eo si observávero me ab iniquitáte mea.
  en: |
    Let him at all times account that he is a man beheld always by God in heaven and that whatsoever he does in any place is seen by the divine watchfulness and is at all times reported to God by the angels. The prophet makes this plain to us when he shows God always present in our thoughts, saying: “God, scrutinizing the hearts and reins.” And again: “The Lord knows men’s thoughts.” And again he says: “Thou hast understood my thoughts from afar.” And: “Since man’s thought will acknowledge Thee,” in order that he may be careful concerning perverse thoughts, let the humble brother always say in his heart: “Then shall I be spotless in His sight, when I shall have kept me from mine iniquity.”
status:
  la: verified
  en: verified
