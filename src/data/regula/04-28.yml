# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-28"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 70: Ut non præsúmat passim áliquis cǽdere"
  en: "The Rule of our Holy Father Benedict. Chapter 70: That No One Presume to Strike Another Unlawfully"
text:
  la: |
    Vitétur in monastério omnis præsumptiónis occásio; atque constitúimus ut nulli líceat quemquam fratrum suórum excommunicáre aut cǽdere, nisi cui potéstas ab abbáte date fúerit. Peccántes autem coram ómnibus arguántur ut céteri metum hábeant. Infántum vero usque quíndecim annórum ætátes disciplínæ diligéntia ab ómnibus et custódia sit; sed et hoc cum omni mensúra et ratióne. Nam in fortióri ætáte qui præsúmit aliquátenus sine præcépto abbátis vel in ipsis infántibus sine discretióne exárserit, disciplínæ regulári subjáceat, quia scriptum est: Quod tibi non vis fíeri, álio ne féceris.
  en: |
    Let every occasion of presumption be prohibited in the monastery. We ordain that it is not allowed to any to excommunicate or to strike any one of his brethren, except to him to whom authority shall have been given by the abbot. And let those who offend be reproved before all, that the rest be put in fear of offending. But towards children up to fifteen years of age let watchful and diligent discipline be preserved by all, but even this with all moderation and reasonableness. And let anyone who shall have at all presumed in the case of those of greater age than fifteen years, or who shall have been indiscreetly angry in the case of the children, themselves be subjected to the discipline provided by the rule. Because it is written: “What to thyself thou dost not wish to be done, do not to another.”
status:
  la: verified
  en: verified
