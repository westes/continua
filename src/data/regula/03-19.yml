# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-19"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 40: De mensúra potus"
  en: "The Rule of our Holy Father Benedict. Chapter 40: Concerning the Quantity of Drink"
text:
  la: |
    Unusquísque próprium habet donum ex Deo, álius sic, álius vero sic; et ídeo cum áliqua scrupulositáte a nobis mensúra victus aliórum constitúitur. Tamen infirmórum contuéntes inbecillitátem, crédimus emínam vini per síngulos suffícere per diem. Quibus autem donat Deus tolerántiam abstinéntiæ, própriam se habitúros mercédem sciant. Quod si aut loci necéssitas vel labor aut ardor æstátis ámplius popóscerit, in arbítrio prióris consístat, consíderans in ómnibus ne subrépat satíetas aut ebríetas. Licet legámus: Vinum omníno monachórum non esse, sed quia nostris tempóribus id mónachis persuadéri non potest, saltim vel hoc consentiámus ut non usque ad satietátem bibámus, sed párcius, quia: Vinum apostatáre facit étiam sapiéntes. Ubi autem necéssitas loci expóscit, ut nec suprascrípta mensúra inveníri possit, sed multo minus aut ex toto nihil, benedícant Deum qui ibi hábitant et non múrmurent, hoc ante ómnia admonéntes, ut absque murmuratiónibus sint.
  en: |
    Everyone has his own proper gift from God, one after this manner and another after that; and so it is with some misgiving we appoint the measure of other men’s living: however, duly considering the infirmity of the weak we believe that half a pint of wine per head per day suffices; but let those to whom God gives the power of the endurance of abstinence know that they shall have their due reward. But if the necessities of the place, or the work, or the heat of the summer should call for more, let it stand within the discretion of the superior to grant more, he taking all care that neither surfeiting nor drunkenness creep in. Although we read that wine is by no means for monks, yet because in our time monks cannot be persuaded to see this, at all events let us agree as to this, that we will not drink to satiety, but somewhat sparingly; because: “Wine makes even the wise to fall away.” But where the necessities of the place make it clear that not even the above mentioned measure can be found necessary, but less by far, or even none at all, let those who live there bless God and not murmur; for this especially is what we are admonishing, that they be free from murmuring.
status:
  la: verified
  en: verified
