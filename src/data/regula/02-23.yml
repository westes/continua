# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-23"
label:
  la: "Cápite 18 Régulæ Sancti Patri Nostri Benedícti: Quo órdine ipsi psalmi dicéndi sunt"
  en: "The Rule of our Holy Father Benedict. Chapter 18: In What Order the Psalms Themselves Are to Be Said. Continued."
text:
  la: |
    Véspera autem cotídie quáttuor psalmórum modulatióne canátur. Qui psalmi incipiántur a centésimo nono usque centésimo quadragésimo séptimo, excéptis his qui in divérsis Horis ex eis sequestrántur, id est a centésimo séptimo décimo usque centésimo vicésimo séptimo et centésimo tricésimo tértio et centésimo quadragésimo secúndo; réliqui omnes in Véspera dicéndi sunt. Et quia minus véniunt tres psalmi, ídeo dividéndi sunt qui ex número suprascrípto fortióres inveniúntur, id est centésimum tricésimum octávum et centésimum quadragésimum tértium et centésimum quadragésimum quartum; centésimus vero sextus décimus, quia parvus est, cum centésimo quinto décimo conjungátur. Digésto ergo órdine psalmórum vespertinórum, réliqua, id est lectiónem, respónsum, hymnum, versum vel cánticum, sicut supra taxávimus impleátur. Ad Conpletórios vero cotídie idem psalmi repetántur, id est quartum, nonagésimum et centésimum tricésimum tértium.
  en: |
    Let Vespers be sung daily with four psalms and let these psalms be begun with the hundred and ninth and continue up to the hundred and forty-seventh, those of them excepted which are set apart for the other hours, namely from the hundred and seventeenth to the hundred and twenty-seventh; and the hundred and thirty-third and the hundred and forty-second. All the rest are to be said at Vespers. And because the psalms come short by three, therefore those are to be divided which of those enumerated above are found somewhat long, namely the hundred and thirty-eighth, the hundred and forty-third and the hundred and forty-fourth. But let the hundred and sixteenth, because it is short, be joined with the hundred and fifteenth. The order of the Vesper psalms having thus been arranged, let the rest, namely, lessons, responsories, hymns, versicles and canticles, be recited as we have above explained. But at Compline let the same psalms be repeated daily; that is to say the fourth, ninetieth and the hundred and thirty-third.
status:
  la: verified
  en: verified
