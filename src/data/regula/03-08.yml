# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-08"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 31: De cellarário monastérii qualis sit"
  en: "The Rule of our Holy Father Benedict. Chapter 31: Concerning the Cellarer of the Monastery, What Sort of a Person He Should Be"
text:
  la: |
    Cellarárius monastérii elegátur de congregatióne sápiens, matúris móribus, sóbrius, non multum edax, non elátus, non turbuléntus, non injuriósus, non tardus, non pródigus, sed timens Deum; qui omni congregatióni sit sicut pater. Curam gerat de ómnibus. Sine jussióne abbátis nihil fáciat. Quæ jubéntur custódiat. Fratres non contrístet. Si quis frater ab eo foret áliqua inrationabíliter póstulat, non spernéndo eum contrístet, sed rationabíliter cum humilitáte male peténti déneget. Animam suam custódiat, memor semper illud apostólicum, quia: Qui bene ministráverit, gradum bonum sibi adquírit. Infirmórum, infántum, hóspitum pauperúmque cum omni sollicitúdine curam gerat, sciens sine dúbio, quia pro his ómnibus in die judícii ratiónem redditúrus est. Omnia vasa monastérii cunctámque substántiam ac si altáris vasa sacráta conspíciat. Nihil ducat neglegéndum. Neque avarítiæ stúdeat neque pródigus sit et stirpátor substántiæ monastérii, sed ómnia mensuráte fáciat et secúndum jussiónem abbátis.
  en: |
    To be cellarer of the monastery let there be chosen from the community a wise man of mature character, sober, not greedy, not haughty, not turbulent, not unfair, not slothful, not wasteful, but God-fearing, one who may be as a father to the whole community. Let him take care of everything: let him do nothing without the abbot’s orders. Let him take heed to what is commanded him: let him not embitter the brethren. If by any chance any brother asks anything from him unreasonably, let him not embitter him by contemptuously refusing, but let him with reasoning and humility refuse him who is asking amiss. Of his own soul let him take heed, mindful always of that apostolic saying that: “He who shall have ministered well acquires for himself a good degree.” Let him take care of the sick, the children, the guests and the poor, with all solicitude, knowing without doubt that for all these he will have to render account in the day of judgment. Let him regard all the vessels of the monastery as if they were consecrated vessels of the altar; and so with the whole of its property. Let him appraise nothing as negligible, neither have regard to avarice, nor yet be wasteful and a squanderer of the property of the monastery: but let him do everything in moderation and according to his abbot’s orders.
status:
  la: verified
  en: verified
