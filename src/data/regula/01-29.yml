# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-29"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Cavéndum ergo ídeo malum desidérium, quia mors secus intróitum delectatiónis pósita est. Unde Scriptúra præcépit dicens: Post concupiscéntias tuas non eas. Ergo si óculi Dómini speculántur bonos et malos et Dóminus de cælo semper réspicit super fílios hóminum, ut vídeat si est intéllegens aut requírens Deum, et si ab ángelis nobis deputátis cotídie die noctúque Dómino factórum nostrórum ópera nuntiántur, cavéndum est ergo omni hora, fratres, sicut dicit in psalmo Prophéta, ne nos declinántes in malo et inútiles factos áliqua hora aspíciat Deus et, parcéndo nobis in hoc témpore, quia pius est et expéctat nos convérti in mélius, ne dicat nobis in futúro: Hæc fecísti et tácui.
  en: |
    Thus therefore must one beware of evil desires, because death is stationed outside the entrance of delight. So Scripture gives command, saying: “Go not after thy fleshly desires.” Therefore, since the eyes of the Lord behold good men and bad and the Lord is always looking down from heaven upon the children of men to see if anyone have understanding and be a seeker of God; and since our acts and deeds are every day, day and night, reported to the Lord by the angels assigned to us; therefore, brethren, must one beware at all times, as the prophet says in the Psalms: “Lest God at any time should see us become unprofitable and turning aside in evil; and lest, though sparing us for the present because father-like He awaits our conversion to better ways, He should say to us hereafter: ‘These things thou didst and I held My peace.’ ”
status:
  la: verified
  en: verified
