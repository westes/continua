# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-02"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 51: De frátribus qui non longe satis proficiscúntur"
  en: "The Rule of our Holy Father Benedict. Chapter 51: Concerning Brethren Who Do Not Go Far Away"
text:
  la: |
    Frater qui pro quovis respónso dirígitur et ea die sperátur revérti ad monastérium, non præsúmat foris manducáre, étiam si omníno rogétur a quovis, nisi forte ei ab abbáte suo præcipiátur. Quod si áliter fécerit, excommunicétur.
  en: |
    Let not a brother who is sent out on any business but hopes to return to the monastery the same day presume to take food while out, even though he be frankly invited to do so by anyone, unless by chance it has been so ordered him by his abbot. And if he shall have done otherwise, let him be excommunicated.
status:
  la: verified
  en: verified
