# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-12"
label:
  la: "Cápite 2 Régulæ Sancti Patri Nostri Benedícti: Qualis débeat abbas esse"
  en: "The Rule of our Holy Father Benedict. Chapter 2: What Kind of Man an Abbot Ought to Be. Continued."
text:
  la: |
    Non ab eo persóna in monastério discernátur. Non unus plus amétur quam álius, nisi quem in bonis áctibus aut obœdiéntia invénerit meliórem. Non converténti ex servítio præponátur ingénuus, nisi ália rationábilis causa exístat. Quod si ita, justítia dictánte, abbáti visum fúerit, et de cujúslibet órdine id fáciet; sin álias, própria téneant loca, quia: Sive servus sive liber, omnes in Christo unum sumus et sub uno Dómino æquálem servitútis milítiam bajulámus, quia: Non est apud Deum personárum accéptio. Solúmmodo in hac parte apud ipsum discérnimur, si melióres ab áliis in opéribus bonis et húmiles inveniámur. Ergo æquális sit ab eo ómnibus cáritas, una præbeátur in ómnibus secúndum mérita disciplína.
  en: |
    Let him show no favouritism in the monastery. Let not one be loved more than another, unless it be one whom he has found to excel in good deeds and obedience. Let not one of gentle birth be placed higher than one who was recently a serf, unless there be some other and reasonable cause. Let it be so however if it shall have seemed good to the abbot on just grounds; and so let him do concerning the place of anyone whomsoever: but otherwise let them keep their own places: for whether bondmen or freemen we are all one in Christ and under the one Lord bear equal rank of subjection, for there is no acceptation of persons with God. In His sight we are differentiated one from the other in respect to this only, namely, if we be found humble and to excel others in good deeds. Therefore let him have an equal love towards all; let one and the same discipline be meted out to all according to their merits.
status:
  la: verified
  en: verified
