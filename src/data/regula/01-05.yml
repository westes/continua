# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-05"
label:
  la: "Prólogo Sancti Patri Nostri Benedícti in Régulam suam."
  en: "Prologue to the Rule of our Holy Father Benedict. Continued"
text:
  la: |
    Unde et Dóminus in Evangélio ait: Qui audit verba mea hæc et facit ea, similábo eum viro sapiénti qui ædificávit domum suam super petram; venérunt flúmina, flavérunt venti, et inpegérunt in domum illam, et non cécidit, quia fundáta erat super petram. Hæc conplens Dóminus expéctat nos cotídie his suis sanctis mónitis factis nos respondére debére. Ídeo nobis propter emendatiónem malórum hujus vitæ dies ad indútias relaxántur, dicénte Apóstolo: An nescis quia patiéntia Dei ad pæniténtiam te addúcit? Nam pius Dóminus dicit: Nolo mortem peccatóris, sed convertátur et vivat.
  en: |
    Whence the Lord also says in the Gospel: “He who hears these My words and does them, I will liken him to a wise man who built his house upon a rock. There came torrents of rain and rushing winds, and they struck upon that house, but it fell not: for it was founded upon a rock.” As a consequence our Lord daily looks for it that we should respond by deeds to these His holy warnings. Thus it is on account of the need of correcting faults that the days of this life are prolonged for us, as by way of truce; and the Apostle says: “Art thou ignorant that the patience of God leads thee towards penitence?” For the Lord in His tenderness says: “I will not the death of a sinner, but that he may be converted and live.”
status:
  la: verified
  en: verified
