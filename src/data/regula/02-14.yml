# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-14"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 12: Quómodo matutinórum sollémnitas agátur"
  en: "The Rule of our Holy Father Benedict. Chapter 12: How the Office of Lauds Is to Be Sung"
text:
  la: |
    In Matutínis domínico die, in primis dicátur sexagésimus sextus psalmus, sine antefána, in diréctum. Post quem dicátur quinquagésimus cum Alle­lúja. Post quem dicátur centésimus séptimus décimus et sexagésimus secúndus. Inde Benedictiónes et Laudes, lectiónem de Apocalýpsis una ex corde et responsórium, Ambrosiánum, versu, cánticum de Evangélia, litanía, et conplétum est.
  en: |
    At Lauds on the Lord’s day, in the first place let the sixty-sixth psalm be recited without antiphon, straight through; after which let there be recited the fiftieth psalm with Alle­luia; after which let there be recited the hundred and seventeenth and the sixty-second; then the Benedicite and Laudates, one lection from the Apocalypse by heart and responsory and hymn and versicle and Gospel canticle and litany; and that is the end.
status:
  la: verified
  en: verified
