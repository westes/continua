# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-07"
label:
  la: "Prólogo Sancti Patri Nostri Benedícti in Régulam suam."
  en: "Prologue to the Rule of our Holy Father Benedict. Continued"
text:
  la: |
    Constituénda est ergo nobis domínici scola servítii. In qua institutióne nihil ásperum, nihil grave nos constitutúros sperámus; sed et si quid páululum restríctius, dictánte æquitátis ratióne, propter emendatiónem vitiórum vel conservatiónem caritátis procésserit, non ílico pavóre pertérritus refúgias viam salútis, quæ non est nisi angústo inítio incipiénda. Procéssu vero conversatiónis et fídei, dilatáto corde inenarrábili dilectiónis dulcédine cúrritur via mandatórum Dei, ut ab ipsíus numquam magistério discedéntes, in ejus doctrínam usque ad mortem in monastério perseverántes passiónibus Christi per patiéntiam participémur, ut et regno ejus mereámur esse consórtes. Amen.
  en: |
    We have therefore to establish a school of the Lord’s service, in the institution of which we hope we are going to establish nothing harsh, nothing burdensome. But if, prompted by the desire to attain to equity, anything be set forth somewhat strictly for the correction of vice or the preservation of charity, do not therefore in fear and terror flee back from the way of salvation of which the beginning cannot but be a narrow entrance. For it is by progressing in the life of conversion and faith that, with heart enlarged and in ineffable sweetness of love, one runs in the way of God’s commandments, so that never deserting His discipleship but persevering until death in His doctrine within the monastery, we may partake by patience in the suffering of Christ and become worthy inheritors of His kingdom. Amen.
status:
  la: verified
  en: verified
