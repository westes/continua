# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-03"
label:
  la: "Prólogo Sancti Patri Nostri Benedícti in Régulam suam."
  en: "Prologue to the Rule of our Holy Father Benedict. Continued"
text:
  la: |
    Et quærens Dóminus in multitúdine pópuli cui hæc clamat operárium suum íterum dicit: Quis est homo qui vult vitam et cupit vidére dies bonos? Quod si tu áudiens respóndeas: Ego, dicit tibi Deus: Si vis habére veram et perpétuam vitam, próhibe linguam tuam a malo et lábia tua ne loquántur dolum; devérte a malo et fac bonum, inquíre pacem et séquere eam. Et cum hæc fecéritis, óculi mei super vos et aures meas ad preces vestras, et ántequam me invocétis, dicam vobis: Ecce adsum. Quid dúlcius ab hac voce Dómini invitántis nos, fratres caríssimi? Ecce pietáte sua demónstrat nobis Dóminus viam vitæ.
  en: |
    And inquiring for His own labourer among the multitude of the people to whom He proclaims these things, the Lord says again: “Who is the man that wishes for life, and desires to see good days?” And if hearing this thou dost answer “I,” God then says to thee: “If thou dost wish for life true and eternal, refrain thy tongue from evil and let not thy lips speak guile. Turn aside from evil and do good; seek out peace and follow it. And when ye have done this, lo, My eyes are upon you and My ears open to your prayers. And before ye call, I will say, ‘Behold, I am here.’ What, most dear brethren, could be more sweet to us than this voice of the Lord inviting us? Behold the Lord points out the way of life to us by His own fatherly affection.
status:
  la: verified
  en: verified
