# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-30"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Secúndus humilitátis gradus est, si própriam quis non amans voluntátem desidéria sua non delectétur implére, sed vocem illam Dómini factis imitémur dicéntis: Non veni fácere voluntátem meam, sed ejus qui me misit. Item dicit Scriptúra: Volúntas habet pœnam et necéssitas parit corónam.
  en: |
    The second step in humility is, if anyone, loving not his own self-will, delight not to fulfil his natural desires, but in his deeds reproduce that word of the Lord Who says: “I did not come to do My will, but His Who sent Me.” Again the Scripture says: “Self-will has punishment, but necessity acquires a crown.”
status:
  la: verified
  en: verified
