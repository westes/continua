# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-04"
label:
  la: "Prólogo Sancti Patri Nostri Benedícti in Régulam suam."
  en: "Prologue to the Rule of our Holy Father Benedict. Continued"
text:
  la: |
    Succínctis ergo fide vel observántia bonórum áctuum lumbis nostris, per ducátum Evangélii pergámus itínera ejus, ut mereámur eum qui nos vocávit in regnum suum vidére. In cujus regni tabernáculo si vólumus habitáre, nisi illuc bonis áctibus cúrritur, mínime pervenítur. Sed interrogémus cum Prophéta Dóminum dicéntes ei: Dómine, quis habitábit in tabernáculo tuo, aut quis requiéscet in monte sancto tuo? Post hanc interrogatiónem, fratres, audiámus Dóminum respondéntem et ostendéntem nobis viam ipsíus tabernáculi, dicens: Qui ingréditur sine mácula et operátur justítiam; qui lóquitur veritátem in corde suo, qui non egit dolum in lingua sua; qui non fecit próximo suo malum, qui obpróbrium non accépit advérsus próximum suum; qui malígnum diábulum áliqua suadéntem sibi cum ipsa suasióne sua a conspéctibus cordis sui réspuens dedúxit ad níhilum, et párvulos cogitátos ejus ténuit et adlísit ad Christum; qui timéntes Dóminum de bona observántia sua non se reddunt elátos, sed ipsa in se bona non a se posse, sed a Dómino fíeri existimántes, operántem in se Dóminum magníficant, illud cum Prophéta dicéntes: Non nobis, Dómine, non nobis, sed nómini tuo da glóriam; sicut nec Paulus Apóstolus de prædicatióne sua sibi áliquid inputávit dicens: Glória Dei sum id quod sum; et íterum ipse dicit: Qui gloriátur, in Dómino gloriétur.
  en: |
    Let our loins then be girt with faith and the observance of good works, and let us, gospel-led, pursue His paths, that we may be worthy to see Him Who has called us unto His own kingdom.

    But if our wish be to have a dwelling-place in His kingdom, let us remember it can by no means be attained unless one run thither by good deeds. For, with the prophet, let us ask the Lord, saying to Him: “Lord, who will dwell in Thy tabernacle, and who will rest in Thy holy mount?” After putting this question, brethren, let us listen to our Lord showing us in answer the way to that same tabernacle by saying: “He who lives blamelessly and does justice; he who speaks truth from his heart; he who has kept his tongue from guile; he who has done his neighbour no evil and has accepted no slander against his neighbour”: he who has brought to naught the malignant slanderer the devil, rejecting from his heart’s thoughts him and his efforts to persuade him; and who has taken hold of his suggestions or ever they be come to maturity and has dashed them against the Rock which is Christ. Those who fear the Lord are not puffed up by their own good observance of rule, but reckoning that the good that is in them could not be wrought by themselves but by God, magnify the Lord working in them and say with the prophet: “Not unto us, O Lord, not unto us, but to Thy Name give glory.” Just as also the Apostle Paul attributed nothing to himself concerning his own preaching, but said: “By the grace of God, I am what I am.” And again the same Paul said: “He who glories, in the Lord let him glory.”
status:
  la: verified
  en: verified
