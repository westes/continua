# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-18"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 4: Quæ sunt instruménta bonórum óperum"
  en: "The Rule of our Holy Father Benedict. Chapter 4: What Are the Instruments of Good Works"
text:
  la: |
    In primis Dóminum Deum dilígere ex toto corde, tota ánima, tota virtúte. Deínde próximum tamquam seípsum. Deínde non occídere. Non adulteráre. Non fácere furtum. Non concupíscere. Non falsum testimónium dícere. Honoráre omnes hómines. Et quod sibi quis fíeri non vult, álio ne fáciat. Abnegáre semetípsum sibi ut sequátur Christum. Corpus castigáre. Delícias non amplécti. Jejúnium amáre. Páuperes recreáre. Nudum vestíre. Infírmum visitáre. Mórtuum sepelíre. In tribulatióne subveníre. Doléntem consolári. Sǽculi áctibus se fácere aliénum. Nihil amóri Christi præpónere. Iram non perfícere.
  en: |
    In the first place, to love the Lord God with the whole heart, the whole soul and the whole strength.

    * Then one’s neighbour as if oneself. * Then, not to kill. * Not to commit adultery. * Not to steal. * Not to covet. * Not to utter false witness. * To honour all men. * To do as one would be done by. * To deny oneself that one may follow Christ. * To chastise the body. * Not to embrace delights. * To love fasting. * To relieve the poor. * To clothe the naked. * To visit the sick. * To bury the dead. * To help in tribulation. * To console the sorrowing. * To become a stranger to worldly deeds. * To prefer nothing to the love of Christ.
status:
  la: verified
  en: verified
