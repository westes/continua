# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-04"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 27: Quáliter débeat abbas sollícitus esse circa excommunicátos"
  en: "The Rule of our Holy Father Benedict. Chapter 27: How Solicitous the Abbot Should Be For the Excommunicate"
text:
  la: |
    Omni sollicitúdine curam gerat abbas circa delinquéntes fratres, quia: Non est opus sanis médicus, sed male habéntibus. Et ídeo uti debet omni modo ut sápiens médicus: inmíttere senpéctas, id est senióres sapiéntes fratres, qui quasi secréte consoléntur fratrem fluctuántem et próvocent ad humilitátis satisfactiónem et consoléntur eum ne abundantióri tristítia absorbeátur, sed, sicut ait item Apóstolus: Confirmétur in eo cáritas, et orétur pro eo ab ómnibus. Magnópere enim debet sollicitúdinem gérere abbas et omni sagacitáte et indústria cúrrere, ne áliquam de óvibus sibi créditis perdat. Nóverit enim se infirmárum curam suscepísse animárum, non super sanas tyránnidem. Et métuat Prophétæ comminatiónem per quam dicit Deus: Quod crassum videbátis, et quod débile erat proiciebátis. Et Pastóris boni pium imitétur exémplum, qui, relíctis nonagínta novem óvibus in móntibus, ábiit unam ovem quæ erráverat quǽrere. Cujus infirmáti in tantum conpássus est, ut eam in sacris húmeris suis dignarétur inpónere et sic reportáre ad gregem.
  en: |
    With all solicitude let the abbot be careful for offending brethren, because: “It is not the healthy that need a physician, but those that are ill.” And so he ought to use every means in his power like a wise physician and send colleagues, that is to say wise senior brethren, to console as it were hiddenly the wavering brother and incite him to make humble satisfaction; and console him that he be not swallowed up by over-much sorrow, but as the Apostle says: “Let love be strengthened in him”; and let prayer be offered for him by all.

    For the abbot ought to be solicitous with much diligence and to take care, with all sagacity and industry, that not one be lost from among the number of the sheep entrusted to him; for he must know that he has undertaken a cure of weak souls, not a tyranny over strong ones: and let him fear the threat of the prophet through whom God says: “Ye took up that which ye saw to be sleek; and that which was sickly ye cast away.” And let him imitate the Good Shepherd’s example of love, for He, having left upon the mountains ninety-nine sheep, went away to seek one sheep that had strayed, whose infirmity He compassionated to such a degree that He deigned to place that sheep upon His sacred shoulders and so to carry it back to the flock.
status:
  la: verified
  en: verified
