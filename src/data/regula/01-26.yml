# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-26"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Primus ítaque humilitátis gradus est, si timórem Dei sibi ante óculos semper ponens, obliviónem omníno fúgiat et semper sit memor ómnia quæ præcépit Deus, ut quáliter et contemnéntes Deum gehénna de peccátis incéndat et vita ætérna quæ timéntibus Deum præparáta est, ánimo suo semper revólvat.
  en: |
    The first step, then, of humility is if one set the fear of God always before his eyes and altogether avoid forgetfulness; and be always mindful of everything that God has ordered and always ponder over life eternal, which is prepared for those that fear God; and how hell will consume, for their sins, such as despise God; and if he keep himself at all times from sins and faults, alike of thought, of the tongue, of the eye, of the hand, of the foot, or of self-will; and moreover hasten to cut away the desires of the flesh.
status:
  la: verified
  en: verified
