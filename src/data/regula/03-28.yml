# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-28"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 48: De ópera mánuum cotidiána"
  en: "The Rule of our Holy Father Benedict. Chapter 48: Concerning the Daily Manual Work"
text:
  la: |
    Otiósitas inimíca est ánimæ, et ídeo certis tempóribus occupári debent fratres in labóre mánuum, certis íterum horis in lectióne divína. Ideóque hac dispositióne crédimus útraque témpore ordinári: id est: ut a Pascha usque Kaléndas Octóbres a mane exeúntes a prima usque hora pene quarta labórent quod necessárium fúerit. Ab hora autem quarta usque hora qua Sextam agent, lectióni vacent. Post Sextam autem surgéntes a mensa pausent in lecta sua cum omni siléntio, aut forte qui volúerit légere sibi sic legat, ut álium non inquiétet. Et agátur Nonam tempérius mediánte octáva hora, et íterum quod faciéndum est operéntur usque ad Vésperam. Si autem necéssitas locis aut paupértas exégerit, ut ad fruges recollegéndas per se occupéntur, non contristéntur. Quia tunc vere mónachi sunt, si labóre mánuum suárum vivunt, sicut et Patres nostri et Apóstoli. Omnia tamen mensuráte fiant propter pusillánimes.
  en: |
    Idleness is inimical to the soul; and therefore the brethren ought to be occupied, at fixed seasons, with manual work and again at fixed seasons with spiritual reading: and so we think the hours for each should be arranged on this plan: that is to say that from Easter to the first of October they go out in the morning from Prime and work at whatever has to be done until nearly the fourth hour: and from the fourth hour have time for reading until about the sixth hour. And when they rise from table after the sixth hour let them rest upon their beds in complete silence; or if by chance anyone should wish to read, let him so read as that he may not disturb anyone else. Let None be said in good time, about the middle of the eighth hour, and then again let them work at whatever has to be done, until Vespers. And let them not be distressed if poverty or the needs of the place should require that they busy themselves about gathering in the crops with their own hands; for then are they truly monks, when they live by the work of their own hands, as did our fathers and the apostles. Let everything be done in moderation however on account of the faint-hearted.
status:
  la: verified
  en: verified
