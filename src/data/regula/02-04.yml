# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-04"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Séptimus humilitátis gradus est: si ómnibus se inferiórem et viliórem non solum sua lingua pronúntiet, sed étiam íntimo cordis credat afféctu, humílians se et dicens cum Prophéta: Ego autem sum vermis et non homo, obpróbrium hóminum et abjéctio plebis. Exaltátus sum et humiliátus et confúsus. Et item: Bonum mihi quod humiliásti me, et discam mandáta tua.
  en: |
    The seventh step in humility is if he not only with his mouth denounce himself as inferior to all and more worthless, but also believe it in his inner consciousness, humbling himself and saying with the prophet: “But I am a worm and not a man, a shame of men and an outcast of the people: I was exalted and humbled and confounded.” And again: “It is good for me that Thou didst humble me, that I may learn Thy commandments.”
status:
  la: verified
  en: verified
