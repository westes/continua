# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-31"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Tértius humilitátis gradus est, ut quis pro Dei amóre omni obœdiéntia se subdat majóri, ímitans Dóminum, de quo dicit Apóstolus: Factus obœ́diens usque ad mortem.
  en: |
    The third step in humility is that one for love of God subject himself in all obedience to his superior, imitating the Lord, of Whom the Apostle says: “Made obedient even unto death.”
status:
  la: verified
  en: verified
