# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-26"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 68: Si fratri inpossibília injungántur"
  en: "The Rule of our Holy Father Benedict. Chapter 68: If Impossibilities Be Enjoined Upon a Brother"
text:
  la: |
    Si cui fratri áliqua forte grávia aut inpossibília injungúntur suscípiat quidem jubéntis impérium cum omni mansuetúdine et obœdiéntia. Quod si omníno vírium suárum mensúram víderit pondus óneris excédere, inpossibilitátis suæ causas ei qui sibi præest patiénter et oportúne súggerat, non superbiéndo aut resisténdo vel contradicéndo. Quod si post suggestiónem suam in sua senténtia prióris impérium perduráverit, sciat júnior ita sibi expedíre, et ex caritáte, confídens de adjutório Dei, obœ́diat.
  en: |
    If it happen that some very difficult or even impossible things be enjoined upon any brother, let him none the less receive with all gentleness and obedience the command of him who gives the order. But if the burden should seem altogether to exceed his powers, let him patiently and opportunely lay the reason of its being impossible for him to obey before him who is over him, but not in a spirit of pride, rebellion or argumentativeness. But if after this his representation of the matter the senior decides that his order shall still hold good, let the junior thereupon know that it is expedient for him; and of his charity let him obey, trusting in the help of God.
status:
  la: verified
  en: verified
