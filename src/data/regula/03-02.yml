# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-02"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 25: De gravióribus culpis"
  en: "The Rule of our Holy Father Benedict. Chapter 25: Concerning Graver Faults"
text:
  la: |
    Is autem frater qui gravióribus culpæ noxa tenétur, suspendátur a mensa, simul ab oratório. Nullus ei fratrum in nullo jungátur consórtio nec in conlóquio. Solus sit ad opus sibi injúnctum, persístens in pæniténtiæ luctu, sciens illam terríbilem Apóstoli senténtiam dicéntis: Tráditum ejúsmodi hóminem in intéritum carnis, ut spíritus salvus sit in diem Dómini. Cibi autem refectiónem solus percípiat, mensúra vel hora qua prævíderit abbas ei conpétere; nec a quoquam benedicátur transeúnte nec cibum quod ei datur.
  en: |
    But that brother who is found guilty of a grave fault, let him be excluded from the table and likewise from the oratory. Let not any of the brethren consort with him nor talk to him. When at the work assigned him let him be alone, continuing in penitence and sorrow, having in mind that terrible denunciation of the Apostle who says: “A man of such a kind as is this handed over to Satan for the destruction of the flesh, that his spirit may be saved in the day of the Lord.” And by himself let him partake of his food, in quantity and at the hour that the abbot may see to be suitable for him: and neither let him be blessed by anyone who happens to be passing him, nor yet the food that is given to him.
status:
  la: verified
  en: verified
