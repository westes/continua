# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-26"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 20: De reveréntia oratiónis"
  en: "The Rule of our Holy Father Benedict. Chapter 20: Concerning Reverence In Prayer"
text:
  la: |
    Si, cum homínibus poténtibus vólumus áliqua suggérere, non præsúmimus nisi cum humilitáte et reveréntia, quanto magis Dómino Deo universórum cum omni humilitáte et puritátis devotióne supplicándum est. Et non in multilóquio, sed in puritáte cordis et conpunctióne lacrimárum nos exaudíri sciámus. Et ídeo brevis debet esse et pura orátio, nisi forte ex afféctu inspiratiónis divínæ grátiæ protendátur. In convéntu tamen omníno breviétur orátio, et facto signo a prióre páriter surgant.
  en: |
    If when we wish to seek any favour from men of influence we presume not to do so except with humility and reverence, how much more must supplication be made with all humility and purity of devotion to the Lord God of all? And let us bear in mind that it is not in much speaking that we are graciously heard but in purity of heart and tears of penitence. And so our prayer should be pure and short, unless haply it be prolonged as a result of the infusion of divine grace. In any case however let prayer in common be made short and at a signal from the superior let all keep time together in rising to a standing position.
status:
  la: verified
  en: verified
