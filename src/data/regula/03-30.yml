# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-30"
label:
  la: "Cápite 48 Régulæ Sancti Patri Nostri Benedícti: De ópera mánuum cotidiána"
  en: "The Rule of our Holy Father Benedict. Chapter 48: Concerning the Daily Manual Work. Continued."
text:
  la: |
    Domínico item die lectióni vacent omnes, excépto his qui váriis offíciis deputáti sunt. Si quis vero ita néglegens et desidiósus fúerit, ut non velit aut non possit meditáre aut légere, injungátur ei opus quod fáciat, ut non vacet. Frátribus infírmis aut delicátis talis ópera aut ars injungátur, ut nec otiósi sint nec violéntia labóris opprimántur aut effugéntur. Quorum inbecíllitas ab abbáte consideránda est.
  en: |
    Further on the Lord’s day let all have time for reading, except those who have been deputed for various duties; but if there shall be anyone so uninterested or so inert that through lack of will-power or of ability he can neither study nor read let there be some work assigned him that he may not be idle. To weak and delicate brethren let there be assigned such suitable occupation and duties that they be neither overcome of idleness nor so oppressed by exhaustion through work that they be driven to flight. Their weakness is to be taken into consideration by the abbot.
status:
  la: verified
  en: verified
