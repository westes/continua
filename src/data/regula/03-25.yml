# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-25"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 45: De his qui fallúntur in oratório"
  en: "The Rule of our Holy Father Benedict. Chapter 45: Concerning Those Who Make Mistakes In the Oratory"
text:
  la: |
    Si quis dum pronúntiat psalmum, responsórium, antefánam vel lectiónem fállitus fúerit, nisi satisfactióne ibi coram ómnibus humiliátus fúerit, majóri vindíctæ subjáceat, quippe qui nóluit humilitáte corrígere quod neglegéntia delíquit. Infántes autem pro tali culpa vápulent.
  en: |
    If anyone shall have made a mistake in psalm, responsory, or antiphon or lection and unless he shall have there and then humbly made satisfaction before all, let him be subjected to severe punishment as one who was unwilling to correct by humility what by negligence he had done amiss. But in the case of the children, let them, for the like fault, be whipped.
status:
  la: verified
  en: verified
