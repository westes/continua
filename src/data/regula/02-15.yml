# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-15"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 13: Privátis diébus quáliter agántur matutíni"
  en: "The Rule of our Holy Father Benedict. Chapter 13: How Lauds Are to Be Said On Ferias"
text:
  la: |
    Diébus autem privátis Matutinórum sollémnitas ita agátur, id est, ut sexagésimus sextus psalmus sine antefána, subtrahéndo módice, sicut Domínica, ut omnes occúrrant ad quinquagésimum, qui cum antefána dicátur. Post quem álii duo psalmi dicántur secúndum consuetúdinem, id est: secúnda féria quintus et tricésimus quintus; tértia féria quadragésimus secúndus et quinquagésimus sextus; quarta féria sexagésimum tértium et sexagésimum quartum; quinta féria octogésimum séptimum et octogésimum nonum; sexta féria septuagésimum quintum et nonagésimum primum; sabbatórum autem centésimum quadragésimum secúndum et cánticum Deuteronómium, qui dividátur in duas Glórias. Nam céteris diébus cánticum unumquémque die suo ex Prophétis, sicut psallit Ecclésia Romána, dicántur. Post hæc sequántur Laudes; deínde léctio una Apóstoli memóriter recitánda, responsórium, Ambrosiánum, versu, cánticum de Evangélia, litanía et conplétum est.
  en: |
    But on ferias let the office of Lauds be thus recited, namely, in such wise that the sixty-sixth psalm is said without antiphon, somewhat slowly as on the Lord’s days, that all may assemble for the fiftieth which is to be said with antiphon. After it let other two psalms be said, as usual; namely, on Monday the fifth and thirty-fifth; on Tuesday the forty-second and fifty-sixth; on Wednesday the sixty-third and sixty-fourth; on Thursday the eighty-seventh and the eighty-ninth; on Friday the seventy-fifth and ninety-first; and on Saturday the hundred and forty-second and the canticle from Deuteronomy, which is to be divided into two Glorias, for on other days let a canticle from the prophets be said, each on its proper day, as in the psalter of the Roman Church. After this let the Laudates follow, then one lection from the Apostle to be recited from memory, responsory, hymn, versicle, Gospel canticle, litany: and that is the end.
status:
  la: verified
  en: verified
