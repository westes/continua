# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-29"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 23: De excommunicatióne culpárum"
  en: "The Rule of our Holy Father Benedict. Chapter 23: Concerning Excommunication For Offences"
text:
  la: |
    Si quis frater cóntumax aut inobœ́diens aut supérbus aut múrmurans vel in áliquo contrárius sanctæ régulæ et præcéptis seniórum suórum contémptor repértus fúerit, hic secúndum Dómini nostri præcéptum admoneátur semel et secúndo secréte a senióribus suis. Si non emendáverit, objurgétur públice coram ómnibus. Si vero neque sic corréxerit, si intélligit qualis pœna sit, excommunicatióni subjáceat; sin autem ínprobus est, vindíctæ corporáli subdátur.
  en: |
    If any brother be found to be contumacious or disobedient or proud or murmuring or in any other way out of harmony with the holy rule and despising the precepts of his seniors, let such an one be admonished, in accordance with our Lord’s precept, once and again privately by his seniors. If he amend not, let him be publicly rebuked before all. But if even so he be not amended let him be subjected to excommunication, if he understand the nature of that penalty; but if he be obdurate, let him undergo corporal punishment.
status:
  la: verified
  en: verified
