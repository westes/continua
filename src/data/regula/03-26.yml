# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-26"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 46: De his qui in áliis quibúslibet rebus delínquunt"
  en: "The Rule of our Holy Father Benedict. Chapter 46: Concerning Those Who Do Amiss In Any Other Matters"
text:
  la: |
    Si quis dum in labóre quovis, in coquína, in cellário, in ministério, in pistríno, in horto, in arte áliqua dum labórat, vel in quocúmque loco, áliquid delíquerit, aut frégerit quíppiam aut perdíderit, vel áliud quid excésserit ubíubi, et non véniens contínuo ante abbátem vel congregatiónem ipse ultro satisfécerit et prodíderit delíctum suum, dum per álium cógnitum fúerit, majóri subjáceat emendatióni. Si ánimæ vero peccáti causa fúerit latens, tantum abbáti aut spirituálibus senióribus patefáciat, qui sciat curáre et sua et aliéna vúlnera, non detégere et publicáre.
  en: |
    If anyone at any work, in the kitchen, in the cellar, in serving the brethren, in the bakery, in the garden, in working at any occupation or in any place, shall have done anything amiss, or broken or lost anything or transgressed at all and shall not have forthwith come before the abbot and the community to declare his fault and make full satisfaction, when it becomes known through some other member of the community let him be subjected to severe correction. But in a case of the fault upon the conscience being unknown to others, let him lay it open to his spiritual seniors or to the abbot only, since they know how to attend to their own wounds and how to avoid disclosing and making known those of others.
status:
  la: verified
  en: verified
