# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-20"
label:
  la: "Cápite 4 Régulæ Sancti Patri Nostri Benedícti: Quæ sunt instruménta bonórum óperum"
  en: "The Rule of our Holy Father Benedict. Chapter 4: What Are the Instruments of Good Works. Continued."
text:
  la: |
    Diem judícii timére. Gehénnam expavéscere. Vitam ætérnam omni concupiscéntia spiritáli desideráre. Mortem cotídie ante óculos suspéctam habére. Actus vitæ suæ omni hora custodíre. In omni loco Deum se respícere pro certo scire. Cogitatiónes malas cordi suo adveniéntes mox ad Christum adlídere et senióri spiritáli patefácere.Os suum a malo vel pravo elóquio custodíre. Multum loqui non amáre. Verba vana aut rísui apta non loqui. Risum multum aut excússum non amáre. Lectiónes sanctas libénter audíre. Oratióni frequénter incúmbere. Mala sua prætérita cum lácrimis vel gémitu cotídie in oratióne Deo confitéri. De ipsis malis de cétero emendáre. Desidéria carnis non effícere. Voluntátem própriam odíre. Præcéptis abbátis in ómnibus obœdíre, étiam si ipse áliter - quod absit - agat, mémores illud domínicum præcéptum: Quæ dicunt fácite, quæ autem fáciunt fácere nolíte. Non velle dici sanctum ántequam sit, sed prius esse quod vérius dicátur.
  en: |
    To have wholesome fear of the day of judgment. With fear to shrink from hell. To long for eternal life with all spiritual desire. To have the expectation of death daily before one’s eyes. Hour by hour to keep guard over one’s every act. To know for certain that God sees one everywhere. Forthwith to dash down upon the Rock, even Christ, any evil thoughts approaching the heart: and to lay them open before one’s superior. To keep one’s mouth from evil or depraved speech. Not to love to speak much. Not to speak useless or mirth-provoking words. Not to love much or excessive laughter. To listen with goodwill to holy reading. To be frequently occupied in prayer. With tears and groaning daily to confess in prayer to God one’s past sins and concerning those same sins to amend for the future. Not to fulfil the desires of the flesh: to hate one’s own will. To yield obedience in all things to the abbot’s precepts, even if he himself act contrary to their spirit, the which be far from him: being mindful of that precept of the Lord: “What they say, do ye; but what they do, do ye not.” Not to wish to be called holy before one is, but to be so first, whereby one would be so called the more truly.
status:
  la: verified
  en: verified
