# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-25"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 19: De disciplína psalléndi"
  en: "The Rule of our Holy Father Benedict. Chapter 19: Concerning the Discipline of Saying Office"
text:
  la: |
    Ubíque crédimus divínam esse præséntiam et óculos Dómini in omni loco speculári bonos et malos, máxime tamen hoc sine áliqua dubitatióne credámus, cum ad opus divínum adsístimus. Ideo semper mémores simus quod ait Prophéta: Servíte Dómino in timóre, et íterum: Psállite sapiénter, et: In conspéctu angelórum psallam tibi. Ergo considerémus quáliter opórteat in conspéctu Divinitátis et angelórum ejus esse, et sic stemus ad psalléndum, ut mens nostra concórdet voci nostræ.
  en: |
    We believe that the divine presence is on all sides and that the eyes of the Lord behold all, both good and bad wheresoever they may be. Especially however let us believe this without any doubt whatever when we assist at the Work of God: and thus let us be always mindful of what the prophet says: “Serve the Lord in fear”; and again: “Sing wisely”; and: “In the sight of the angels will I sing to Thee.” Therefore let us consider how we ought to comport ourselves in the sight of God and His angels and let us so take our part in the office that mind accord with voice.
status:
  la: verified
  en: verified
