# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-28"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Voluntátem vero própriam ita fácere prohibémur cum dicit Scriptúra nobis: Et a voluntátibus tuis avértere. Et item rogámus Deum in oratióne ut fiat illíus volúntas in nobis. Docémur ergo mérito nostram non fácere voluntátem cum cavémus illud quod dicit Scriptúra: Sunt viæ quæ putántur ab homínibus rectæ, quarum finis usque ad profúndum inférni demérgit, et cum item pavémus illud quod de neglegéntibus dictum est: Corrúpti sunt et abominábiles facti sunt in voluntátibus suis. In desidériis vero carnis ita nobis Deum credámus semper esse præséntem, cum dicit Prophéta Dómino: Ante te est omne desidérium meum.
  en: |
    But our own will we are thus forbidden to do, namely, when the Scripture says to us: “And from thy wishes turn away.” And again in prayer we ask God that His will may be done in us. We are therefore well taught not to do our own will when we avoid what the Scripture mentions: “Ways there are which to men seem right, but of which the end plunges down to the very depth of hell.” And again when we tremble at what is said of the careless: “They are corrupt and become abominable in their pleasures.” For amid the desires of the flesh let us know by faith that God is always present with us, as the prophet says to the Lord: “Lord, every one of my desires is before Thee.”
status:
  la: verified
  en: verified
