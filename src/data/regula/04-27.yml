# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-27"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 69: Ut in monastério non præsúmat alter álterum deféndere"
  en: "The Rule of our Holy Father Benedict. Chapter 69: That In the Monastery One Presume Not to Constitute Himself the Patron of Another"
text:
  la: |
    Præcavéndum est ne quavis occasióne præsúmat alter álium deféndere mónachum in monastério aut quasi tuéri, étiam si qualívis consanguinitátis propinquitáte jungántur. Nec quólibet modo id a mónachis præsumátur, quia exínde gravíssima occásio scandalórum oríri potest. Quod si quis hæc transgréssus fúerit, ácrius coerceátur.
  en: |
    Precautions must be taken lest on any occasion one monk in the monastery presume to constitute himself the patron of another, or as it were to take him under his care, even although they be related by the tie of near kinship. Let no monk presume to do such a thing in any way whatever, because therefrom can arise very grave occasion of scandal. But if anyone shall have transgressed in this respect, let him be somewhat sharply punished.
status:
  la: verified
  en: verified
