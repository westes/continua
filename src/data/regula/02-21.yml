# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-21"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 18: Quo órdine ipsi psalmi dicéndi sunt"
  en: "The Rule of our Holy Father Benedict. Chapter 18: In What Order the Psalms Themselves Are to Be Said"
text:
  la: |
    In primis dicátur versu: Deus, in adjutórium meum inténde; Dómine, ad adjuvándum me festína, Glória, inde hymnum unuscuiúsque Horæ. deínde Prima Hora, Domínica, dicénda quáttuor capítula psalmi centésimi octávi décimi. Réliquis vero Horis, id est Tértia, Sexta vel Nona, terna capítula suprascrípti psalmi centésimi octávi décimi dicántur. Ad Primam autem secúndæ fériæ dicántur tres psalmi, id est primus, secúndus et sextus. Et ita per síngulos dies ad Primam, usque Domínica, dicántur per órdinem terni psalmi usque nonum décimum psalmum, ita sane, ut nonus psalmus et séptimus décimus partiántur in binos. Et sic fit, ut ad Vigílias Domínica semper a vicésimo incipiátur.
  en: |
    First of all let the verse be said: “O God, make speed to save us; O Lord, make haste to help us” and the Gloria. Next the hymn proper to each hour. Then, at Lord’s day Prime are to be said four parts of the hundred and eighteenth psalm. And at the other hours, that is at Terce, Sext and None, let three parts of the said hundred and eighteenth psalm be said. But at Prime on Monday let three other psalms be said, namely, the first, the second and the sixth. And thus at Prime day by day up to the Lord’s day let the psalms be said in order, three each day, up to the nineteenth psalm; in such wise however that the ninth psalm and the seventeenth be apportioned to two Glorias. And so let it come to pass that at night office on the Lord’s day a beginning is always made with the twentieth psalm.
status:
  la: verified
  en: verified
