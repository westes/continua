# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-16"
label:
  la: "Cápite 13 Régulæ Sancti Patri Nostri Benedícti: Privátis diébus quáliter agántur matutíni"
  en: "The Rule of our Holy Father Benedict. Chapter 13: How Lauds Are to Be Said On Ferias. Continued."
text:
  la: |
    Plane agénda matutína vel vespertína non tránseat aliquándo, nisi in último per órdinem orátio domínica, ómnibus audiéntibus, dicátur a prióre propter scandalórum spinas quæ oríri solent, ut convénti per ipsíus oratiónis sponsiónem qua dicunt: Dimítte nobis sicut et nos dimíttimus, purgent se ab hujúsmodi vítio. Céteris vero agéndis última pars ejus oratiónis dicátur, ut ab ómnibus respondeátur: Sed líbera nos a malo.
  en: |
    But when it is Lauds or Vespers that are to be recited, let them not on any occasion conclude without the Lord’s prayer being said at the end, by the superior, audibly, on account of the thorns of scandal that are wont to arise, that those present may purge themselves of evil of this sort through that petition of the prayer in which they say: “Forgive us as we also forgive.” And when other offices are to be recited, let the past part of that prayer be said aloud, that by all answer may be made: “But deliver us from evil.”
status:
  la: verified
  en: verified
