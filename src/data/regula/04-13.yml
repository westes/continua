# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-13"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 59: De fíliis nobílium aut páuperum qui offerúntur"
  en: "The Rule of our Holy Father Benedict. Chapter 59: Concerning Noblemen’s Sons and Poor Men’s Sons Who Are Offered"
text:
  la: |
    Si quis forte de nobílibus offert fílium suum Deo in monastério, si ipse puer minor ætáte est, paréntes ejus fáciant petitiónem quam supra díximus, et cum oblatióne ipsam petitiónem et manum púeri invólvant in palla altáris, et sic eum ófferant. De rebus autem suis aut in præsénti petitióne promíttant sub jurejurándo, quia numquam per se, numquam per sufféctam persónam nec quólibet modo ei aliquándo áliquid dant aut tríbuunt occasiónem habéndi; vel certe si hoc fácere nolúerint et áliquid ófferre volunt in elemósinam monastério pro mercéde sua, fáciant ex rebus quas dare volunt monastério donatiónem, reserváto sibi, si ita volúerint usum fructum. Atque ita ómnia obstruántur ut nulla suspício remáneat púero per quam decéptus períre possit - quod absit - quod experiménto didícimus. Simíliter autem et pauperióres fáciant. Qui vero ex toto nihil habent, simplíciter petitiónem fáciant et cum oblatióne ófferant fílium suum coram téstibus.
  en: |
    If by chance anyone from among the nobility offers his son to God in the monastery, if the boy himself be in infancy let his parents make the petition that we mentioned above; and together with an oblation let them fold that petition and the boy’s hand in the altar cloth and so let them offer him. And concerning his property either let them promise on oath in the present petition that never of themselves, never through any deputy, nor in any way whatever will they give anything to him at any time, or afford him opportunity of possessing: or else, at the least, if they are unwilling to do this and wish to offer something as alms to the monastery so as to obtain merit, let them make a donation from the property that they wish to give to the monastery, having reserved to themselves if they so wish a life interest in it. Thus then let every precaution be taken, so that there may not linger in the boy’s mind any notions of possession, by which notions he might, to his ruin, be deceived, as experience has shewn to be possible, but which God forbid. Let those also who are poorer act similarly: but let those who have nothing at all simply make petition and with the oblation offer their boy before witnesses.
status:
  la: verified
  en: verified
