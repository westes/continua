# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-06"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Nonus humilitátis gradus est, si linguam ad loquéndum prohíbeat mónachus et taciturnitátem habens, usque ad interrogatiónem non loquátur, monstránte Scriptúra quia in multilóquio non effúgitur peccátum, et quia vir linguósus non dirígitur super terram.
  en: |
    The ninth step in humility is if a monk restrain his tongue from speaking so as to keep silence and not speak till questioned, the Scripture showing that: “In much speaking sin may not be avoided”; and that “the talkative man will not be guided aright in the world.”
status:
  la: verified
  en: verified
