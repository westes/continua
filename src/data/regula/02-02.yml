# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-02"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Quintus humilitátis gradus est, si omnes cogitatiónes malas cordi suo adveniéntes vel mala a se abscónse commíssa per húmilem confessiónem abbátem non celáverit suum. Hortans nos de hac re Scriptúra dicens: Revéla ad Dóminum viam tuam et spera in eum. Et item dicit: Confitémini Dómino quóniam bonus, quóniam in ætérnum misericórdia ejus. Et item Prophéta: Delíctum meum cógnitum tibi feci et injustítias meas non opérui. Dixi: pronuntiábo advérsum me injustítias meas Dómino, et tu remisísti impietátem cordis mei.
  en: |
    The fifth step in humility is if one shall have discovered to his abbot, by humble admission, any evil thoughts that come to the heart, or evil deeds done by him in secret. The Scripture makes exhortation concerning this matter, saying: “Reveal to the Lord thy way and hope in Him.” And again it saith: “Confess to the Lord since He is good and since His mercy is for ever.” And again the prophet saith: “My fault I made known to Thee and hid not mine unrighteousness. I said, Against myself I will denounce mine unrighteousness to the Lord, and Thou forgavest the unfilialness of my heart.”
status:
  la: verified
  en: verified
