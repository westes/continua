# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-12"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 10: Quáliter æstátis témpore agátur noctúrna laus"
  en: "The Rule of our Holy Father Benedict. Chapter 10: How Night Praise Is to Be Accomplished In Summer Time"
text:
  la: |
    A Pascha autem usque ad Kaléndas Novémbres, omnis ut supra dictum est psalmódiæ quántitas teneátur excépto quod lectiónes in códice propter brevitátem nóctium legántur, sed pro ipsis tribus lectiónibus una de Véteri Testaménto memóriter dicátur, quam brevis responsórius subsequátur. Et réliqua ómnia, ut dictum est, impleántur, id est ut numquam minus a duódecim psalmórum quantitáte ad Vigílias noctúrnas dicántur, excéptis tértio et nonagésimo quarto psalmo.
  en: |
    But from Easter until the first of November as was mentioned above let every portion of psalmody be retained, not counting that lections from the book are by no means to be read, on account of the shortness of the nights, but instead of those three lections, let one from the Old Testament be recited from memory and be followed by a short responsory; and let all else as has been said be completed as usual, so that there may never be said a less quantity than twelve psalms at night office, not counting the third psalm and the ninety-fourth.
status:
  la: verified
  en: verified
