# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-01"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Quartus humilitátis gradus est, si in ipsa obœdiéntia duris et contráriis rebus vel étiam quibúslibet inrogátis injúriis, tácite consciéntia patiéntiam amplectátur et sústinens non lasséscat vel discédat, dicénte Scriptúra: Qui perseveráverit usque in finem, hic salvus erit. Item: Confortétur cor tuum et sústine Dóminum. Et osténdens fidélem pro Dómino univérsa étiam contrária sustinére debére, dicit ex persóna sufferéntium: Propter te morte adfícimur tota die, æstimáti sumus ut oves occisiónis. Et secúri de spe retributiónis divínæ subsequúntur gaudéntes et dicéntes: Sed in his ómnibus superámus propter eum qui diléxit nos. Et item álio loco Scriptúra: Probásti nos, Deus, igne nos examinásti sicut igne examinátur argéntum; induxísti nos in láqueum; posuísti tribulatiónes in dorso nostro. Et ut osténdat sub prióre debére nos esse, subséquitur dicens: Inposuísti hómines super cápita nostra. Sed et præcéptum Dómini in advérsis et injúriis per patiéntiam adimpléntes, qui percússi in maxíllam præbent et áliam, auferénti túnicam dimíttunt et pállium, angarizáti militário vadunt duo, cum Paulo apóstolo falsos fratres sústinent et persecutiónem sústinent, et maledicéntes se benedícent.
  en: |
    The fourth step in humility is if in that same obedience, though things hard and contrary and even injuries, no matter of what kind, have been inflicted, he keep patience with a quiet conscience and enduring grows not weary nor gives in, for Scripture says: “He who perseveres to the end, the same shall be saved.” And again: “Let thy heart be comforted and wait for the Lord.” And showing that the faithful man ought for the Lord’s sake to wait patiently, seem all things never so contrary, it says in the name of the suffering: “For Thy sake we are afflicted all the day; we are accounted as sheep for the slaughter.”

    And they, secure in their hope of divine retribution, gladly follow on and say: “But in all these things we overcome by Him Who loved us.”

    And again in another place: “Thou, O God, hast tested us,” says Scripture, “Thou hast examined us with fire, as silver is examined with fire. Thou hast led us into the snare, Thou hast placed troubles upon our back.” And to show that we ought to be under a superior, it follows on, saying: “Thou hast placed men over our heads.” Moreover, fulfilling the Lord’s command by patience amid adversities and injuries those struck on the cheek offer the other also; with him who deprives them of their tunic they leave their cloak in addition; constrained to go a thousand paces, they go two thousand; with Paul the Apostle, they endure false brethren and bless those that curse them.
status:
  la: verified
  en: verified
