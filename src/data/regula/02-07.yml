# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-07"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Décimus humilitátis gradus est, si non sit fácilis ac promptus in risu, quia scriptum est: Stultus in risu exáltat vocem suam.
  en: |
    The tenth step in humility is if he be not easily and quickly moved to laughter, because it is written: “The fool lifts up his voice in laughter.”
status:
  la: verified
  en: verified
