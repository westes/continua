# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-19"
label:
  la: "Cápite 4 Régulæ Sancti Patri Nostri Benedícti: Quæ sunt instruménta bonórum óperum"
  en: "The Rule of our Holy Father Benedict. Chapter 4: What Are the Instruments of Good Works. Continued."
text:
  la: |
    Iracúndiæ tempus non reserváre. Dolum in corde non tenére. Pacem falsam non dare. Caritátem non derelínquere. Non juráre ne forte perjúret. Veritátem ex corde et ore proférre. Malum pro malo non réddere. Injúriam non fácere, sed et factas patiénter sufférre. Inimícos dilígere. Maledicéntes se non remaledícere, sed magis benedícere. Persecutiónem pro justítia sustinére. Non esse supérbum. Non vinoléntum. Non multum edácem. Non somnuléntum. Non pigrum. Non murmuriósum. Non detractórem. Spem suam Deo commíttere. Bonum áliquid in se cum víderit, Deo ádplicet, non sibi. Malum vero semper a se factum sciat et sibi réputet.
  en: |
    Not to carry anger into effect. Not to prolong the duration of one’s wrath. Not to retain guile in one’s heart. Not to make a false peace. Not to abandon charity. Not to swear, lest perchance one forswear. To utter only truth from heart and mouth. Not to return evil for evil. Not to do injury, but to suffer it patiently. To love enemies. Not to curse in return those who curse one, but rather to bless them. To bear persecution for righteousness. Not to be proud. Not to be given to much wine. Not to be gluttonous. Not given to much sleep. Not to be sluggish. Not to be given to grumbling. Not to be a detractor. To put one’s hope in God. When one sees any good in oneself to attribute it to God, not to self. But to recognize that evil always comes from self and to refer it to self.
status:
  la: verified
  en: verified
