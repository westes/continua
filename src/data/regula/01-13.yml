# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-13"
label:
  la: "Cápite 2 Régulæ Sancti Patri Nostri Benedícti: Qualis débeat abbas esse"
  en: "The Rule of our Holy Father Benedict. Chapter 2: What Kind of Man an Abbot Ought to Be. Continued."
text:
  la: |
    In doctrína sua namque abbas apostólicam debet illam semper formam serváre in qua dicit: Argue, óbsecra, íncrepa, id est, miscens tempóribus témpora, terróribus blandiménta, dirum magístri, pium patris osténdat afféctum, id est indisciplinátos et inquiétos debet dúrius argúere, obœdiéntes autem et mites et patiéntes, ut in mélius profíciant obsecráre, neglegéntes et contemnéntes ut íncrepat et corrípiat admonémus. Neque dissímulet peccáta delinquéntium; sed ut, mox ut cœ́perint oríri, radícitus ea ut prǽvalet ámputet, memor perículi Heli sacerdótis de Silo. Et honestióres quidem atque intellegíbiles ánimos prima vel secúnda admonitióne verbis corrípiat, ínprobos autem et duros ac supérbos vel inobœdiéntes vérberum vel córporis castigátio in ipso inítio peccáti coérceat, sciens scriptum: Stultus verbis non corrígitur, et íterum: Pércute fílium tuum virga et liberábis ánimam ejus a morte.
  en: |
    For in his teaching the abbot ought always to keep to that apostolic formula in which it is said: “Convince, entreat, rebuke”: that is to say, mingling according to circumstances gentleness with severity, let him show the sternness of a master, the affection of a father: that is to say, he ought to convince the undisciplined and restless almost harshly: but to entreat the obedient, the meek and the patient, that they progress still better. But the negligent and the haughty we admonish him to rebuke and correct. And let him not close his eyes to the sins of those who do amiss, but almost as soon as they begin to appear let him cut them off at the roots and master them, mindful of the judgment against Eli the priest in Silo. The more dignified and the intellectually minded let him correct by word at their first and second admonition; but the froward, the hard, the proud and the disobedient, let him coerce at the very first offence by the stripes of corporal punishment, knowing it is written: “A fool is not corrected by words”; and again: “Strike thy son with the rod and thou wilt free his soul from death.”
status:
  la: verified
  en: verified
