# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-24"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 6: De taciturnitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 6: Concerning Silence"
text:
  la: |
    Faciámus quod ait Prophéta: Dixi: custódiam vias meas, ut non delínquam in lingua mea. Pósui ori meo custódiam, obmútui et humiliátus sum et sílui a bonis. Hic osténdit Prophéta, si a bonis elóquiis intérdum propter taciturnitátem debet tacére, quanto magis a malis verbis propter pœnam peccáti debet cessári. Ergo quamvis de bonis et sanctis et ædificatiónum elóquiis perféctis discípulis propter taciturnitátis gravitátem rara loquéndi concedátur licéntia, quia scriptum est:In multilóquio non effúgies peccátum, et álibi: Mors et vita in mánibus linguæ. Nam loqui et docére magístrum cóndecet, tacére et audíre discípulum cónvenit. Et ídeo, si qua requirénda sunt a prióre, cum omni humilitáte et subjectióne reveréntiæ requirántur. Scurrilitátes vero vel verba otiósa et risum movéntia ætérna clusúra in ómnibus locis damnámus et ad tália elóquia aperíre os non permíttimus.
  en: |
    Let us do what the prophet says: “I said, I will watch my ways, that I transgress not with my tongue. I set a watch upon my mouth, I became dumb and humbled and silent from good.” Here the prophet shows, if one ought sometimes to abstain from speaking good for the sake of keeping silence, how much more ought one to be deterred from evil words on account of the penalty of sin. Wherefore, even though it is always for good and holy converse that tends to edification, let but rare leave to talk be granted to fully trained disciples, on account of the importance of silence; because it is written: “In much speaking thou wilt not escape sin.” And elsewhere: “Death and life are in the power of the tongue.” For to speak and to teach becomes the master, to be silent and to listen beseems the disciple. And so if anything has to be asked of the superior let it be asked with all humility and with reverent subjection.

    But all manner of buffoonery and idle, mirth-provoking words we adjudge should be perpetually restrained in every place; and for such discourse we permit not the disciple to open his mouth.
status:
  la: verified
  en: verified
