# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "03-05"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 28: De his qui sǽpius corrépti emendáre nolúerint"
  en: "The Rule of our Holy Father Benedict. Chapter 28: Concerning Those Who Shall Not Have Amended Though Somewhat Often Corrected"
text:
  la: |
    Si quis frater frequénter corréptus pro quálibet culpa, si étiam excommunicátus non emendáverit, ácrior ei accédat corréptio, id est ut vérberum vindícta in eum procédant. Quod si nec ita corréxerit, aut forte - quod absit - in supérbia elátus étiam deféndere volúerit ópera sua, tunc abbas fáciat quod sápiens médicus: si exhíbuit foménta, si unguénta adhortatiónum, si medicámina Scripturárum divinárum, si ad últimum ustiónem excommunicatiónis vel plagárum virgæ, et jam si víderit nihil suam prævalére indústriam, adhíbeat étiam, quod majus est, suam et ómnium fratrum pro eo oratiónem, ut Dóminus qui ómnia potest operétur salútem circa infírmum fratrem. Quod si nec isto modo sanátus fúerit, tunc jam utátur abbas ferro abscisiónis, ut ait Apóstolus: Auférte malum ex vobis; et íterum: Infidélis si discédit, discédat, ne una ovis mórbida omnem gregem contágiet.
  en: |
    If any brother shall not have amended though frequently corrected for some fault and even excommunicated, let a sharper correction befall him, namely, that the punishment of stripes accrue to him. But if even so he have not amended, or even, which be far from him, carried away by pride he have desired actually to justify his acts, then let the abbot proceed as a wise physician: if he has applied fomentations, if the unguents of exhortation, if the medicaments of divine Scripture, if at last the cauterization of excommunication, or stripes with the rod; and if he still see that his perseverance prevail nothing, let him further add what is still greater, namely, his own prayer for him and the prayer of all the brethren that the Lord, Who is omnipotent, effect deliverance for the sick brother. But if even by this means he have not been healed, then at last let the abbot make use of the blade that cutteth off, as says the Apostle: “Take away the evil from your midst”: and again: “If the unfaithful go away, let him go away”: lest one diseased sheep contaminate the whole flock.
status:
  la: verified
  en: verified
