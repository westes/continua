# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-08"
label:
  la: "Cápite 7 Régulæ Sancti Patri Nostri Benedícti: De humilitáte"
  en: "The Rule of our Holy Father Benedict. Chapter 7: Concerning Humility. Continued."
text:
  la: |
    Undécimus humilitátis gradus est, si cum lóquitur mónachus, léniter et sine risu, humíliter cum gravitáte vel pauca verba et rationabília loquátur, et non sit clamósus in voce, sicut scriptum est: Sápiens verbis innotéscit paucis.
  en: |
    The eleventh step in humility is if when a monk speaks he speak few and reasonable words, calmly and without laughter, humbly and with gravity; and be not noisy in speech, as it is written: “A wise man is known by the fewness of his words.”
status:
  la: verified
  en: verified
