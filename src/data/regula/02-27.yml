# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-27"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 21: De decánis monastérii"
  en: "The Rule of our Holy Father Benedict. Chapter 21: Concerning the Deans of the Monastery"
text:
  la: |
    Si major fúerit congregátio, elegántur de ipsis fratres boni testimónii et sanctæ conversatiónis, et constituántur decáni, qui sollicitúdinem gerant super decánias suas in ómnibus secúndum mandáta Dei et præcépta abbátis sui. Qui decáni tales elegántur in quibus secúrus abbas pártiat ónera sua. Et non elegántur per órdinem, sed secúndum vitæ méritum et sapiéntiæ doctrínam. Quique decáni, si ex eis áliqua forte qui inflátus supérbia repértus fúerit reprehensíbilis, corréptus semel et íterum atque tértio si emendáre nolúerit, deiciátur, et alter in loco ejus qui dignus est subrogétur. Et de præpósito éadem constitúimus.
  en: |
    If the community be large, let some of good character and holy life be chosen from among the brethren and made deans: and let them exercise careful guardianship over their deaneries in all things, in accordance with God’s commandments and their abbot’s precepts. And let such be chosen as deans upon whom the abbot may safely lay a share of his burdens; and let them not be chosen by seniority, but for meritorious life and soundness of wisdom. And these deans if any one among them by any chance puffed up by pride be found worthy of blame, if he will not amend though corrected once and again and a third time, let him be degraded from his deanship and let another who is worthy be put into his place. And we establish the same procedure as regards the provost.
status:
  la: verified
  en: verified
