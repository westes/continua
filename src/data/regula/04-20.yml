# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-20"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 64: De ordinándo abbáte"
  en: "The Rule of our Holy Father Benedict. Chapter 64: Concerning the Election of an Abbot"
text:
  la: |
    In abbátis ordinatióne illa semper considerétur rátio, ut hic constituátur quem sibi omnis concors congregátio secúndum timórem Dei, sive étiam pars quamvis parva congregatiónis sanióre consílio elégerit. Vitæ autem mérito et sapiéntiæ doctrína elegátur qui ordinándus est, étiam si últimus fúerit in órdine congregatiónis. Quod si étiam omnis congregátio vítiis suis - quod quidem absit - consentiéntem persónam pari consílio elégerit, et vítia ipsa aliquátenus in notítia epíscopi ad cujus diocesim pértinet locus ipse vel ab abbátes aut Christiános vicínos clarúerint, prohíbeant pravórum prævalére consénsum, sed dómui Dei dignum constítuant dispensatórem, sciéntes pro hoc se receptúros mercédem bonam, si illud caste et zelo Dei fáciant, sicut e divérso peccátum si néglegant.
  en: |
    At the election of an abbot let this principle be always observed, that he be appointed whom the whole community, being of the same mind and in the fear of God, or even a part albeit a small part of the community shall with calmer deliberation have elected. And let him who is to be elected be chosen for his worthy manner of life and his fundamental wisdom, even if he be last in order of community seniority. But if even the whole community, which God forbid, should by agreement among themselves choose a person who is a consenting party to their faults and those faults somehow should come to the knowledge of the bishop to whose diocese that place belongs, or should be manifest to the abbots and faithful of the vicinity, let them not suffer the agreement of the wicked to prevail, but let them appoint a steward worthy of the house of God, knowing that for this they will receive a good reward if they do it of pure zeal for God, just as, contrariwise, they will receive punishment if they neglect to do so.
status:
  la: verified
  en: verified
