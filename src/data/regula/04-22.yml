# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-22"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 65: De præpósito monastérii"
  en: "The Rule of our Holy Father Benedict. Chapter 65: Concerning the Provost of the Monastery"
text:
  la: |
    Sǽpius quidem cóntigit, ut per ordinatiónem præpósiti sándala grávia in monastériis oriántur, dum sint áliqui malígno spíritu supérbiæ infláti et æstimántes se secúndos esse abbátes, adsuméntes sibi tyránnidem, scándala nútriunt et dissensiónes in congregatiónes fáciunt, et máxime in illis locis ubi ab eódem sacerdóte vel ab eis abbátibus qui abbátem órdinant ab ipsis étiam et præpósitus ordinátur. Quod quam sit absúrdum fácile advértitur, quia ab ipso inítio ordinatiónis matéria ei datur superbiéndi, dum ei suggéritur a cogitatiónibus suis exútum eum esse a potestáte abbátis sui, quia ab ipsis es tu ordinátus a quibus et abbas. Hinc suscitántur invídiæ, rixæ, detractiónes, æmulatiónes, dissensiónes, exordinatiónes, ut dum contrária sibi abbas præpositúsque séntiunt, et ipsórum necésse est sub hanc dissensiónem ánimas periclitári, et hii qui sub ipsi sunt, dum adulántur pártibus, eunt in perditiónem. Cujus perículi malum illos réspicit in cápite qui tálius inordinatiónis se fecérunt auctóres.
  en: |
    It happens and indeed somewhat often that grave scandals arise in monasteries through the appointment of a provost, since some there are who, puffed up with malignant spiritual pride, esteeming themselves to be second abbots and assuming to themselves tyrannical power, foster scandals and cause dissensions in the community and especially in those places where the provost himself also is appointed by the same prelate or by the same abbots who appoint the abbot. And it is easy to discover how absurd is such a method of appointment, because from the very first moment of his appointment there is presented to him an incentive to pride in that it is suggested to him by his own thoughts that he is now freed from the authority of his abbot, because “thou hast been appointed by the very same persons by whom the abbot also was appointed.” Hence are stirred up envies, quarrels, detractions, dissensions, jealousies, disorders; and while the abbot and the provost are at variance with one another their souls under this dissension are of necessity endangered; and those who are subject to them through taking sides travel the road to ruin. And the blame for this danger rests primarily upon the authors of such an arrangement.
status:
  la: verified
  en: verified
