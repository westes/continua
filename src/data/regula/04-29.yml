# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-29"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 71: Ut obœdiéntes sibi sint ínvicem"
  en: "The Rule of our Holy Father Benedict. Chapter 71: That the Brethren Be Obedient Among Themselves"
text:
  la: |
    Obœdiéntiæ bonum non solum abbáti exhibéndum est ab ómnibus, sed étiam sibi ínvicem ita obœ́diant fratres, sciéntes per hanc obœdiéntiæ viam se itúros ad Deum. Præmísso ergo abbátis aut præpositórum qui ab eo constituúntur império, cui non permíttimus priváta impéria præpóni, de cétero omnes junióres prióribus suis omni caritáte et sollicitúdine obœ́diant. Quod si quis contentiósus repperítur, corripiátur. Si quis autem frater pro quavis mínima causa ab abbáte vel a quocúmque prióre corrípitur quólibet modo, vel si léviter sénserit ánimos prióris cujuscúmque contra se irátos vel commótos quamvis módice, mox sine mora támdiu prostrátus in terra ante pedes ejus jáceat satisfáciens, usque dum benedictióne sanétur illa commótio. Quod si contémpserit fácere, aut corporáli vindíctæ subjáceat aut, si cóntumax fúerit, de monastério expellátur.
  en: |
    The excellence of obedience is not only to be shown by all towards the abbot, but likewise let the brethren also be obedient among themselves, bearing in mind that by this way of obedience they will be journeying Godwards.

    Any command from the abbot therefore, or from the provosts who are appointed by him—to which we do not permit private commands to be preferred—having been put first, for the rest let all juniors be obedient to their seniors with most vigilant charity. But if anyone be found contentious, let him be corrected. And if any brother is corrected, it matters not in what way, by the abbot or by any other of those senior to him, or if he shall at all perceive that any senior’s mind is angered or moved against him, however slightly, at once without delay having prostrated on the ground let him lie at his feet, thus making satisfaction until that feeling be healed by giving of benediction. But if anyone should disdain to do so, either let him be subjected to corporal punishment, or else if he be contumacious let him be expelled from the monastery.
status:
  la: verified
  en: verified
