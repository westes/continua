# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "01-09"
label:
  la: "Régula Sancti Patri Nostri Benedícti Caput 2: Qualis débeat abbas esse"
  en: "The Rule of our Holy Father Benedict. Chapter 2: What Kind of Man an Abbot Ought to Be"
text:
  la: |
    Abbas qui præésse dignus est monastério semper memínere debet quod dícitur et nomen majóris factis implére. Christi enim ágere vices in monastério créditur, quando ipsíus vocátur pronómine, dicénte apóstolo: Accepístis spíritum adoptiónis filiórum, in quo clamámus: Abba, Pater. Ideóque abbas nihil extra præcéptum Dómini quod sit debet aut docére aut constitúere vel jubére, sed jússio ejus vel doctrína ferméntum divínæ justítiæ in discipulórum méntibus conspargátur, memor semper abbas quia doctrínæ suæ vel discipulórum obœdiéntiæ, utrarúmque rerum, in treméndo judício Dei faciénda erit discússio.
  en: |
    An abbot who is worthy to preside over a monastery ought always to remember what he is called and to justify his title by his deeds. For he is deemed in the monastery the representative of Christ, since it is by His title he is addressed, for the Apostle says: “Ye have received the Spirit of adoption of sons in which it is we cry out Abba, Father.” And so an abbot ought not to teach, establish, or order anything contrary to the spirit of the Lord’s revealed will, but let his commandments and teaching, as being the leaven of divine justice, sprinkle the minds of the disciples.
status:
  la: verified
  en: verified
