# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "04-03"
label:
  la: "Régula Sancti Patri Nostri Benedícti. Caput 52: De oratório monastérii"
  en: "The Rule of our Holy Father Benedict. Chapter 52: of the Oratory of the Monastery"
text:
  la: |
    Oratórium hoc sit quod dícitur, nec ibi quicquam áliud gerátur aut condátur. Expléto ópere Dei, omnes cum summo siléntio éxeant, et habeátur reveréntia Deo, ut frater qui forte sibi peculiáriter vult oráre, non inpediátur alteríus inprobitáte. Sed et si áliter vult sibi forte secrétius oráre, simplíciter intret et oret, non in clamósa voce, sed in lácrimis et intentióne cordis. Ergo qui símile opus non facit, non permittátur explícito ópere Dei remorári in oratório, sicut dictum est, ne álius impediméntum patiátur.
  en: |
    Let the oratory be an oratory and nothing else, nor let anything be kept or anything be done there that is incongruous. As soon as the Work of God is finished let all reverently leave the oratory, in complete silence, so that any brother who by chance wishes to pray individually may not be hindered by another’s misconduct. And if by chance one wishes to pray somewhat more privately, let him enter without affection and pray, not with audible outcry but by heartfelt penitence. Therefore he who is not so occupied, let him not be permitted to linger in the oratory after office, as has already been said, lest another’s hindrance ensue.
status:
  la: verified
  en: verified
