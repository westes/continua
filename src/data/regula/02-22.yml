# Verified against Divinum Officium (Latin Regula, English translation).
canonicalDate: "02-22"
label:
  la: "Cápite 18 Régulæ Sancti Patri Nostri Benedícti: Quo órdine ipsi psalmi dicéndi sunt"
  en: "The Rule of our Holy Father Benedict. Chapter 18: In What Order the Psalms Themselves Are to Be Said. Continued."
text:
  la: |
    Ad Tértiam vero, Sextam Nonámque secúndæ fériæ novem capítula quæ resídua sunt de centésimo octávo décimo, ipsa terna per eásdem Horas dicántur. Expénso ergo psalmo centésimo octávo décimo duóbus diébus, id est Domínico et secúnda féria, tértia féria jam ad Tértiam, Sextam vel Nonam psallántur terni psalmi a centésimo nono décimo usque centésimo vicésimo séptimo, id est psalmi novem. Quique psalmi semper usque Domínica per eásdem Horas ítidem repetántur, hymnórum nihilóminus, lectiónum vel vérsuum dispositiónem unifórmem cunctis diébus servátam. Et ita scílicet semper Domínica a centésimo octávo décimo incipiétur.
  en: |
    For Terce, Sext and None on Monday are to be said the nine remaining parts of the hundred and eighteenth psalm, three such parts at each of those hours. The hundred and eighteenth being thus exhausted in two days, namely, the Lord’s day and Monday, let there be sung on Tuesday three psalms apiece for Terce, Sext and None, from the hundred and nineteenth to the hundred and twenty-seventh, that is to say nine psalms. And let these psalms be repeated always in this way at these hours until the Lord’s day, a uniform arrangement of hymns, lessons and versicles being likewise observed on all days, in such wise, that is to say, that always on the Lord’s day a beginning will be made with the hundred and eighteenth.
status:
  la: verified
  en: verified
