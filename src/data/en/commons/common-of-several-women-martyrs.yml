collect/c7b:
  text: |
    Let us pray.
    Grant unto us, we beseech thee, O Lord, our God, that we may ever call to mind, with all
    worship and thanksgiving, the victory of thy holy Martyrs {N} and {N}, and although we
    know that our mind cannot comprehend thee who art this day their exceeding great
    reward, give us always the grace humbly to worship thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration-antiphon:
  text: |
    For theirs is * the Kingdom of heaven who love not their lives in this world, and have attained unto the reward of the Kingdom, and have washed their robes in the blood of the Lamb.
  status: verified

matins-hymn:
  text: |
    Fountain of mercy, hear the prayers she offers;
    Purge our offences, pardon our transgressions,
    So that hereafter we to thee may render
    Praise with thanksgiving.

    Thou, the All-Father, thou, the One-Begotten,
    Thou, Holy Spirit, Three in One co-equal,
    Glory be henceforth thine through all the ages,
    World without ending. Amen.
  status: verified

matins-invitatory:
  text: Let us praise our God * for the confession of blessed {N} and {N}.
  status: verified

lauds-capitulum:
  text: |
    I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour. I will give glory to thy name: for thou hast been a helper and protector to me, and hast preserved my body from destruction.
    R. Thanks be to God.
  status: verified

lauds-hymn:
  text: |-
    High let us all our voices raise
    In that heroic woman's praise
    Whose name, with saintly glory bright,
    Shines in the starry realms of light.

    Filled with a pure celestial glow,
    She spurned all love of things below;
    And heedless here on earth to stay,
    Climbed to the skies her toilsome way.

    With fasts her body she subdued,
    But filled her soul with prayer's sweet food:
    In other worlds she tastes the bliss
    For which she left the joys of this.

    O Christ, the strength of all the strong;
    To whom our holiest deeds belong!
    Through her prevailing prayers on high,
    In mercy hear thy people's cry!

    * To God the Father, with the Son,
    And Holy Spirit, Three in One,
    Be glory while the ages flow,
    From all above, and all below. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. In thy comeliness * and in thy beauty.
    R. In thy comeliness * and in thy beauty.
    V. Go forward, fare prosperously, and reign.
    R. In thy beauty.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. In thy comeliness * and in thy beauty.
  status: verified

lauds-versicle:
  text: |
    V. Thou hast crowned them with glory and honour, O Lord.
    R. And madest them to have dominion over the works of thy hands.
  status: verified

prime-lectio:
  text: |
    My soul shall praise the Lord even to death. How thou deliverest them that wait for thee, O Lord, and savest them out of the hands of the nations!
  citation: Sir 51:8; 51:12
  status: verified

terce-capitulum:
  text: |
    I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour. I will give glory to thy name: for thou hast been a helper and protector to me, and hast preserved my body from destruction.
    R. Thanks be to God.
    V. In thy comeliness and thy beauty.
    R. Go forward, fare prosperously, and reign.
  citation: Sir 51:1-3
  status: verified

sext-capitulum:
  text: |
    And thou hast delivered me, according to the multitude of the mercy of thy name, from them that did roar, prepared to devour. Out of the hands of them that sought my life, and from the gates of afflictions, which compassed me about.
    R. Thanks be to God.
    V. God shall help her with His countenance.
    R. God is in the midst of her she shall not be moved.
  citation: Sir 51:4-5
  status: verified

none-capitulum:
  text: |
    My soul shall praise the Lord even to death. How thou deliverest them that wait for thee, O Lord, and savest them out of the hands of the nations!
    R. Thanks be to God.
    V. God hath chosen her, and fore-chosen her.
    R. He hath made her to dwell in His tabernacle.
  citation: Sir 51:8; 51:12
  status: verified

