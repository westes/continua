collect/c4b:
  text: |
    Let us pray.
    Look forgivingly on thy flock, Eternal Shepherd, and keep it in thy constant protection, by the intercession of blessed {N}, thy Sovereign Pontiff, whom thou didst constitute Shepherd of the whole Church.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

matins-hymn:
  text: |-
    This is the Lord's own hallowed confessor,
    Whose feast today the nations round are keeping;
    Joyful, he merited this day to enter
    Heaven's hid glory.

    Dutiful, prudent, humble, chaste, he flourished,
    Sober and quiet, pure in all his living,
    While in his body yet the breath of this life
    Quickened his members.

    Often at his consecrated tomb, the
    Limbs of those worn by long and grievous sickness,
    Whatsoever ill had laid them low, are
    Wholly restored.

    Therefore our choir today, in glad thanksgiving,
    Sings in his honor this our joyful anthem:
    That by his merits, freely won through goodness,
    We may be aided.

    Praise be to Him, all honor, might, dominion,
    Who from the height of heaven's throne is reigning,
    Governing all the fabric of creation,
    Three and yet One. Amen.
  status: draft

matins-invitatory:
  text: The Lord, the King of Confessors, * O come, let us worship.
  status: verified

prime-lectio:
  text: To execute the office of the priesthood, and to have praise, and to glorify his people in his name. He chose him out of all men living, to offer sacrifice to God, incense, and a good savour.
  citation: Sir 45:19-20
  status: verified

terce-capitulum:
  text: |
    Behold an high priest, who in his days pleased God, and was found righteous, and in the time of wrath he was made a propitiation.
    R. Thanks be to God.
    V. The Lord loved him and beautified him.
    R. He clothed him with a robe of glory.
  citation: Sir 44:16-17
  status: verified

sext-capitulum:
  text: |
    There was not found the like to him in glory, who kept the law of the most High, and was in covenant with him. Therefore by an oath he gave him glory in his posterity, that he should increase in his people.
    R. Thanks be to God.
    V. The Lord hath chosen him for a Priest unto Himself.
    R. To offer up unto Him the sacrifice of praise.
  citation: Sir 44:20; 44:22
  status: verified

none-capitulum:
  text: |
    To execute the office of the priesthood, and to have praise, and to glorify his people in his name. He chose him out of all men living, to offer sacrifice to God, incense, and a good savour.
    R. Thanks be to God.
    V. Thou art a Priest for ever.
    R. After the order of Melchisedek.
  citation: Sir 45:19-20
  status: verified

vespers-versicle:
  text: |-
    V. The Lord guided the just in right paths.
    R. And showed him the kingdom of God.
  status: verified

vespers-versicle/~-first:
  text: |-
