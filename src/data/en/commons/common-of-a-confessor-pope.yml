    R. He clothed him with a robe of glory.
  status: verified

benedictus-antiphon:
  text: Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
  status: verified

magnificat-antiphon:
  text: When he was Supreme Pontiff, * he feared not earthly things, but migrated gloriously to the heavenly kingdom.
  status: draft

magnificat-antiphon/~-first:
  text: O thou Priest and Bishop, * thou worker of mighty works, thou good shepherd over God’s people, pray for us unto the Lord.
  status: verified
