  text: Come, Bride of Christ, and take the everlasting crown * which the Lord hath prepared for thee.
  status: verified

matins-psalmody:
  aliases:
    - common-of-several-women-martyrs
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: O how lovely and glorious * is the generation of the chaste.
      - psalms:
          - 18
        antiphon: His left hand is under my head, * and his right hand doth embrace me.
      - psalms:
          - 23
        antiphon: Return, return, O Shulammith * Return, return, that we may look upon thee.
      - psalms:
          - 44
        antiphon: In thy comeliness and thy beauty, * go forward, fare prosperously, and reign.
      - psalms:
          - 45
        antiphon: 'God shall help * her with His countenance: God is in the midst of her; she shall not be moved.'
      - psalms:
          - 47
        antiphon: Many waters cannot * quench love.
    versicle:
      v: In thy comeliness and thy beauty.
      r: Go forward, fare prosperously, and reign.
  nocturn2:
    groups:
      - psalms:
          - 84
        antiphon: I am black but comely, * O ye daughters of Jerusalem; therefore hath the King loved me, and brought me into his chamber.
      - psalms:
          - 86
        antiphon: Draw me after thee * we will run after the savour of thy good ointments; thy name is as oil poured forth.
      - psalms:
          - 95
        antiphon: Come, Bride of Christ, * and take the everlasting crown which the Lord hath prepared for thee.
      - psalms:
          - 96
        antiphon: 'Thy name is as oil poured out: * therefore young maidens have loved thee.'
      - psalms:
          - 97
        antiphon: 'O my love, * sweet and comely as Jerusalem: terrible as an army set in array.'
      - psalms:
          - 98
        antiphon: She hath girded * her loins with strength, and hath strengthened her arm.
    versicle:
      v: God shall help her with His countenance.
      r: God is in the midst of her, she shall not be moved.
  nocturn3:
    antiphon: Having found a good pearl, * she gave all that she had, and bought it.
    canticles:
      - refs:
          - book: matt
            chapter: 13
            verses: 44-46
    versicle:
      v: God hath chosen her, and fore-chosen her.
      r: He hath made her to dwell in His tabernacle.
