collect/c1v:
  text: |
    Let us pray.
    Grant, we beseech thee, almighty God, that the venerable solemnity of thy blessed Apostle {N}, whose vigil we anticipate, may both increase our devotion and further our salvation.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

prime-antiphon:
  text: The Lord liveth, and blessed be my God, my salvation * .
  status: verified

terce-antiphon:
  text: I cried unto the Lord, * and He heard me.
  status: verified

terce-capitulum:
  text: |
    Heal me, O Lord, and I shall be healed: save me, and I shall be saved, for thou art my praise.
    R. Thanks be to God.
    V. Be thou my helper, forsake me not.
    R. Do not thou despise me, O God my Saviour.
  citation: Jer 17:14
  status: verified

sext-antiphon:
  text: Who dwellest * in heaven, have mercy on us.
  status: verified

sext-capitulum:
  text: |
    Bear ye one another's burdens; and so you shall fulfill the law of Christ.
    R. Thanks be to God.
    V. The Lord ruleth me: and I shall want nothing.
    R. He hath set me in a place of pasture.
  citation: Gal 6:2
  status: verified

none-antiphon:
  text: Blessed are all they * that fear the Lord.
  status: verified

none-capitulum:
  text: |
    For you are bought with a great price. Glorify and bear God in your body.
    R. Thanks be to God.
    V. From my secret ones cleanse me, O Lord.
    R. And from those of others spare thy servant.
  citation: 1 Cor 6:20
  status: verified

benedictus-antiphon:
  text: O Lord, give light * to those who sit in darkness and in the shadow of death, and guide our feet into the way of peace.
  status: verified
