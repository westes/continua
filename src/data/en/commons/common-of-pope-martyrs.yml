collect/c3b:
  text: |
    Let us pray.
    Look forgivingly on thy flock, Eternal Shepherd, and keep it in thy constant protection, by the intercession of blessed {N} and {N}, thy Martyrs and Sovereign Pontiffs, whom thou didst constitute Shepherds of the whole Church.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration-antiphon:
  text: |
    Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
  status: verified

matins-hymn:
  text: |-
    The martyrs' triumphs let us sing,
    Their blood poured forth for Christ the King,
    And while due hymns of praise we pay,
    Our thankful hearts cast grief away.

    The world its terrors urged in vain;
    They recked not of the body's pain;
    One step, and holy death made sure
    The life that ever shall endure.

    To flames the martyr saints are hailed;
    By teeth of savage beasts assailed;
    Against them, armed with ruthless brand
    And hooks of steel, their torturers stand.

    The mangled frame is tortured sore,
    The holy life-drops freshly pour;
    They stand unmoved amidst the strife,
    By grace of everlasting life.

    Redeemer, hear us of thy love,
    That, with the martyr host above,
    Hereafter, of thine endless grace,
    Thy servants also may have place. Amen.
  status: verified

matins-invitatory:
  text: The Lord, the King of Martyrs, * O come, let us worship.
  status: verified

lauds-capitulum:
  text: But the souls of the just are in the hand of God, and the torment of death shall not touch them. In the sight of the unwise they seemed to die, but they are in peace.
  citation: Wis 3:1-3
  status: verified

lauds-hymn:
  text: |-
    O glorious King of martyr hosts,
    Thou crown that each confessor boasts,
    Who leadest to celestial day
    Those who have cast earth's joys away:

    Thine ear in mercy, Saviour, lend,
    While unto thee our prayers ascend;
    And as we count their triumphs won,
    Forgive the sins that we have done.

    Martyrs in thee their triumphs gain,
    From thee confessors grace obtain;
    O'ercome in us the lust of sin,
    That we thy pardoning love may win.

    To thee who, dead, again dost live,
    All glory, Lord, thy people give;
    All glory, as is ever meet,
    To Father and to Paraclete. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Be glad in the Lord, * and rejoice, ye righteous.
    R. Be glad in the Lord, * and rejoice, ye righteous.
    V. And shout for joy, all ye that are upright in heart.
    R. And rejoice, ye righteous.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Be glad in the Lord, * and rejoice, ye righteous.
  status: verified

lauds-versicle:
  text: |
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
  status: verified

prime-antiphon:
  text: 'Your saints, O Lord, * flourish like lilies, alleluia: and like the smell of balsam are before you, alleluia.'
  status: verified

prime-lectio:
  text: The just shall shine, and shall run to and fro like sparks among the reeds. They shall judge nations, and rule over people, and their Lord shall reign for ever.
  citation: Wis 3:7-8
  status: verified

terce-antiphon:
  text: 'In the heavenly kingdom is the habitation of the saints, alleluia: and they rest in the eternity, alleluia * .'
  status: verified

terce-capitulum:
  text: |
    Then shall the just stand with great constancy against those that have afflicted them, and taken away their labours.
    R. Thanks be to God.
    V. Saints and just, rejoice in the Lord, alleluia.
    R. The Lord has chosen you for his inheritance, alleluia.
  citation: Wis 5:1
  status: verified

sext-antiphon:
  text: Protected by a veil * your saints turn to you, O Lord, alleluia, alleluia.
  status: verified

sext-capitulum:
  text: |
    Behold how they are numbered among the children of God, and their lot is among the saints.
    R. Thanks be to God.
    V. Eternal light will shine over your saints, O Lord, alleluia.
    R. And the eternity of times, alleluia.
  citation: null
  status: verified

none-antiphon:
  text: The just shine * like the sun at the face of God, alleluia.
  status: verified

none-capitulum:
  text: |
    And we know that to them that love God, all things work together unto good, to such as, according to his purpose, are called to be saints.
    R. Thanks be to God.
    V. Everlasting joy shall be upon their heads, alleluia.
    R. They shall obtain joy and gladness, alleluia.
  citation: Rom 8:28
  status: verified

vespers-hymn:
  text: |-
    Sing, O sons of the Church sounding the martyrs' praise!
    God's true soldiers applaud, who, in their weary days,
    Won bright trophies of good, glad be the voice ye raise,
    While these heroes of Christ ye sing!

    They, while yet in the world were by the world abhorred;
    Felt how fading the joys, fleeting the wealth it stored;
    Spurned all pleasure for thee, and at thy call, O Lord,
    Came forth strong in thy name, as King.

    Lord, how bravely they bore fury and pain for thee!
    Scourge, rod, sword, and the rack strongly endured; but free
    Sang out, bold in thy love, longing on high to be;
    Earth's might never their souls could bend.

    While they, shedding their blood, victims for Jesus fell,
    No sound out of their lips came of their throes to tell;
    Bowed low, patient and meek, loving the Lord so well,
    Turned they still to the Christ, their friend.

    What joys, bright with the blood shed for thy love they share,
    Those brave martyrs of thine crowned with thy laurels rare;
    Man's tongue never can tell, never can half declare,
    How pure now is their bliss above!

    Yet we, Father on high, God of eternal might,
    Lift weak voices in prayer asking for peace and light;
    Cleanse thou out of our hearts every stain and blight,
    So our songs may be songs of love. Amen.
  status: verified

