collect/c11:
  text: |
    Let us pray.
    Grant, we beseech thee, O Lord God, unto all thy servants, that they may remain continually in the enjoyment of soundness both of mind and body, and by the glorious intercession of the Blessed Mary, always a Virgin, may be delivered from present sadness, and enter into the joy of thine eternal gladness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration-antiphon:
  text: |
    O Mary * blessed art thou that didst believe! for there shall be a performance of those things which were told thee from the Lord. Alleluia.
  status: verified

matins-hymn:
  text: |
    The God whom earth, and sea, and sky
    Adore, and laud, and magnify,
    Who o'er their threefold fabric reigns,
    The Virgin's spotless womb contains.

    The God, whose will by moon and sun
    And all things in due course is done,
    Is borne upon a maiden's breast,
    By fullest heavenly grace possest.

    How blest that mother, in whose shrine
    The great artificer divine,
    Whose hand contains the earth and sky,
    Vouchsafed, as in his ark, to lie.

    Blest, in the message Gabriel brought;
    Blest, by the work the Spirit wrought;
    From whom the great desire of earth
    Took human flesh and human birth.

    * All honour, praise and glory be,
    O Jesu, Virgin-Born, to thee;
    All glory, as is ever meet,
    To Father, and to Paraclete. Amen.
  status: verified

matins-invitatory:
  text: Hail Mary, full of grace, * The Lord is with thee.
  status: verified

lauds-capitulum:
  text: From the beginning, and before the world, was I created, and unto the world to come I shall not cease to be, and in the holy dwelling place I have ministered before him.
  citation: Sir 24:14
  status: verified

lauds-hymn:
  text: |-
    O glorious lady! throned on high
    Above the star-illumined sky;
    Thereto ordained, thy bosom lent
    To thy Creator nourishment.

    Through thy sweet offspring we receive
    The bliss once lost through hapless Eve;
    And heaven to mortals open lies
    Now thou art portal of the skies.

    Thou art the door of heaven's high King,
    Light's gateway fair and glistering;
    Life through a Virgin is restored;
    Ye ransomed nations, praise the Lord!

    All honour, laud, and glory be,
    O Jesu, Virgin-born, to thee;
    All glory, as is ever meet,
    To Father and to Paraclete. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Hail Mary full of grace, * the Lord is with thee.
    R. Hail Mary full of grace, * the Lord is with thee.
    V. Blessed art thou among women, and blessed is the fruit of thy womb.
    R. The Lord is with thee.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Hail Mary full of grace, * the Lord is with thee.
  status: verified

lauds-versicle:
  text: |
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
  status: verified

prime-lectio:
  text: 'As a plane tree by the water in the streets, I gave a sweet smell like cinnamon. and aromatical balm: I yielded a sweet odour like the best myrrh.'
  citation: Sir 24:19-20
  status: verified

terce-capitulum:
  text: |
    From the beginning, and before the world, was I created, and unto the world to come I shall not cease to be, and in the holy dwelling place I have ministered before him.
    R. Thanks be to God.
    V. In thy comeliness and thy beauty.
    R. Go forward, fare prosperously, and reign.
  citation: Sir 24:14
  status: verified

sext-capitulum:
  text: |
    And so was I established in Sion, and in the holy city likewise I rested, and my power was in Jerusalem. And I took root in an honourable people, and in the portion of my God his inheritance, and my abode is in the full assembly of saints.
    R. Thanks be to God.
    V. God shall help her with His countenance.
    R. God is in the midst of her, she shall not be moved.
  citation: Sir 24:15-16
  status: verified

none-capitulum:
  text: |
    As a plane tree by the water in the streets, I gave a sweet smell like cinnamon and aromatical balm: I yielded a sweet odour like the best myrrh.
    R. Thanks be to God.
    V. God hath chosen her, and fore-chosen her.
    R. He hath made her to dwell in His tabernacle.
  citation: Sir 24:19-20
  status: verified

vespers-hymn:
  text: |-
    Ave, star of ocean,
    Child divine who barest,
    Mother, ever-Virgin,
    Heaven's portal fairest.

    Taking that sweet Ave
    Erst by Gabriel spoken,
    Eva's name reversing,
    Be of peace the token.

    Break the sinners' fetters,
    Light to blind restoring,
    All our ills dispelling,
    Every boon imploring.

    Show thyself a mother
    In thy supplication;
    He will hear who chose thee
    At his incarnation.

    Maid all maids excelling,
    Passing meek and lowly,
    Win for sinners pardon,
    Make us chaste and holy.

    As we onward journey
    Aid our weak endeavour,
    Till we gaze on Jesus
    And rejoice forever.

    Father, Son, and Spirit,
    Three in One confessing,
    Give we equal glory
    Equal praise and blessing. Amen.
  status: verified

vespers-responsory:
  text: |
    R.br. Hail Mary full of grace, * the Lord is with thee.
    R. Hail Mary full of grace, * the Lord is with thee.
    V. Blessed art thou among women, and blessed is the fruit of thy womb.
    R. The Lord is with thee.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Hail Mary full of grace, * the Lord is with thee.
  status: verified

vespers-versicle:
  text: |
    V. Holy Virgin, my praise by thee accepted be.
    R. Give me strength against thine enemies.
  status: verified

benedictus-antiphon:
  text: O Mary * blessed art thou that didst believe! for there shall be a performance of those things which were told thee from the Lord. Alleluia.
  status: verified

magnificat-antiphon:
  text: All generations shall call me blessed, * for God hath regarded the lowliness of His hand-maiden.
  status: verified

magnificat-antiphon/~-first:
  text: 'O Holy Mary, * be thou an help to the helpless, a strength to the fearful, a comfort to the sorrowful; pray for the people, plead for the clergy, make intercession for all women vowed to God: may all that are keeping this thine holy Feast-day feel the might of thine assistance.'
  status: verified

matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: Blessed art thou among women, * and blessed is the fruit of thy womb.
      - psalms:
          - 18
        antiphon: O Holy Mother of God * thou hast yielded a pleasant odor like the best myrrh.
      - psalms:
          - 23
        antiphon: Sing for us again and again before this maiden's bed * the tender idylls of the play.
      - psalms:
          - 44
        antiphon: In thy comeliness and thy beauty, * go forward, fare prosperously, and reign.
      - psalms:
          - 45
        antiphon: 'God shall help * her with His countenance: God is in the midst of her; she shall not be moved.'
      - psalms:
          - 47
        antiphon: Your lips, * my spouse, are as a dropping honeycomb, honey and milk are under your tongue; and the smell of your garments, as the smell of frankincense.
    versicle:
      v: In thy comeliness and thy beauty.
      r: Go forward, fare prosperously, and reign.
  nocturn2:
    groups:
      - psalms:
          - 84
        antiphon: 'The fountain of gardens: * the well of living waters, which run with a strong stream from Libanus.'
      - psalms:
          - 86
        antiphon: O Holy Mother of God * all we who dwell in thee are in gladness.
      - psalms:
          - 95
        antiphon: Joy to thee, * O Virgin Mary, thou hast trampled down all the heresies in the whole world.
      - psalms:
          - 96
        antiphon: Holy Virgin, my praise by thee accepted be; * give me strength against thine enemies.
      - psalms:
          - 97
        antiphon: After thy delivery thou still remainest a virgin; * undefiled Mother of God, pray for us.
      - psalms:
          - 98
        antiphon: I went down * into the garden of nuts, to see the fruits of the valleys, and to look if the vineyard had flourished, and the pomegranates budded.
    versicle:
      v: God shall help her with His countenance.
      r: God is in the midst of her, she shall not be moved.
  nocturn3:
    antiphon: 'Thou art a garden enclosed, * O Mother of God, a garden enclosed, a fountain sealed: arise, make haste, my love, and come.'
    canticles:
      - refs:
          - book: sir
            chapter: 39
            verses: 17-21
      - refs:
          - book: isa
            chapter: 61
            verses: 10-11
          - book: isa
            chapter: 62
            verses: 1-3
      - refs:
          - book: isa
            chapter: 62
            verses: 4-7
    versicle:
      v: God hath chosen her, and fore-chosen her.
      r: He hath made her to dwell in His tabernacle.

lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: While the King sitteth at his table, * my spikenard sendeth forth the smell thereof.
    - psalms:
        - 99
      antiphon: His left hand is under my head, * and his right hand doth embrace me.
    - psalms:
        - 62
      antiphon: I am black but comely, * O ye daughters of Jerusalem; therefore hath the King loved me, and brought me into his chamber.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Lo the winter is past, * the rain is over and gone. Rise up, my love, and come away.
  laudate:
    antiphon: O Holy Mother of God, thou art become beautiful * and gentle in thy gladness.

