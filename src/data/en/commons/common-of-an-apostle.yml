matins-psalmody:
  aliases:
    - common-of-apostles
    - common-of-an-evangelist
  nocturn1:
    groups:
      - psalms:
          - 18
        antiphon: 'Their sound * hath gone forth into all the earth: and their words unto the ends of the world.'
      - psalms:
          - 33
        antiphon: The just cried * and the Lord heard them.
      - psalms:
          - 44
        antiphon: Thou shalt make them princes * over all the earth. They shall remember thy name, O Lord.
      - psalms:
          - 46
        antiphon: The princes of the people * are gathered together, with the God of Abraham.
      - psalms:
          - 60
        antiphon: Thou hast given an inheritance * to them that fear thy name, O Lord.
      - psalms:
          - 63
        antiphon: They declared * the works of God, and understood his doings.
    versicle:
      v: 'Their sound hath gone forth into all the earth:'
      r: And their words unto the ends of the world.
  nocturn2:
    groups:
      - psalms:
          - 74
        antiphon: The horns of the just * shall be exalted. Alleluia.
      - psalms:
          - 95
        antiphon: 'Declare his glory among the Gentiles: * his wonders among all people.'
      - psalms:
          - 96
        antiphon: Light is risen * to the just, alleluia, and joy to the right of heart. Alleluia.
      - psalms:
          - 97
        antiphon: His right hand hath wrought for him salvation, * and his arm is holy, alleluia.
      - psalms:
          - 98
        antiphon: They kept his testimonies, * and the commandment which he gave them. Alleluia.
      - psalms:
          - 100
        antiphon: I walked in the innocence of my heart, * in the midst of my house.
    versicle:
      v: Thou shalt make them princes over all the earth.
      r: They shall remember thy name, O Lord.
  nocturn3:
    antiphon: Be glad and rejoice, * for your names are written in heaven, said the Lord.
    canticles:
      - refs:
          - book: isa
            chapter: 61
            verses: 6-9
      - refs:
          - book: sap
            chapter: 3
            verses: 7-9
      - refs:
          - book: sap
            chapter: 10
            verses: 17-21
    versicle:
      v: Thy friends, O Lord, are made exceedingly honourable.
      r: Their principality is exceedingly strengthened.

