collect/c5:
  text: |
    Let us pray.
    O God, who, year by year, dost gladden us by the solemn feast day of thy blessed Confessor {N}, mercifully grant unto all who keep his birthday, grace to follow after the pattern of his godly conversation.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration-antiphon:
  text: |
    Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
  status: verified

matins-hymn:
  text: |-
    This is the Lord's own hallowed confessor,
    Whose feast today the nations round are keeping;
    Joyful, he merited this day to enter
    Heaven's hid glory.

    Dutiful, prudent, humble, chaste, he flourished,
    Sober and quiet, pure in all his living,
    While in his body yet the breath of this life
    Quickened his members.

    Often at his consecrated tomb, the
    Limbs of those worn by long and grievous sickness,
    Whatsoever ill had laid them low, are
    Wholly restored.

    Therefore our choir today, in glad thanksgiving,
    Sings in his honor this our joyful anthem:
    That by his merits, freely won through goodness,
    We may be aided.

    Praise be to Him, all honor, might, dominion,
    Who from the height of heaven's throne is reigning,
    Governing all the fabric of creation,
    Three and yet One. Amen.
  status: draft

matins-invitatory:
  text: The Lord, the King of Confessors, * O come, let us worship.
  status: verified

lauds-capitulum:
  text: 'Blessed is the rich man that is found without blemish: and that hath not gone after gold, nor put his trust in money nor in treasures. Who is he, and we will praise him? for he hath done wonderful things in his life.'
  citation: Sir 31:8-9
  status: verified

lauds-hymn:
  text: |
    Jesu, eternal truth sublime,
    Through endless years the same!
    Thou crown of those who through all time
    Confess thy holy name:

    Thy suppliant people, through the prayer
    Of thy blest saint, forgive;
    For his dear sake, thy wrath forbear,
    And bid our spirits live.

    Again returns the sacred day,
    With heavenly glory bright,
    Which saw him go upon his way
    Into the realms of light.

    All objects of our vain desire,
    All earthly joys and gains,
    To him were but as filthy mire;
    And now with thee he reigns.

    Thee, Jesu, his all-gracious Lord,
    Confessing to the last,
    He trod beneath him Satan's fraud,
    And stood forever fast.

    In holy deeds of faith and love,
    In fastings and in prayers,
    His days were spent; and now above
    Thy heavenly feast he shares.

    Then, for his sake thy wrath lay by,
    And hear us while we pray;
    And pardon us, O thou most high,
    On this his festal day.

    All glory to the Father be;
    And sole Incarnate Son;
    Praise, holy Paraclete, to thee;
    While endless ages run.
    Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. The Lord loved him, * and beautified him.
    R. The Lord loved him, * and beautified him.
    V. He clothed him with a robe of glory.
    R. And beautified him.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. The Lord loved him, * and beautified him.
  status: verified

lauds-versicle:
  text: |-
    V. The Lord guided the just in right paths.
    R. And showed him the kingdom of God.
  status: verified

prime-antiphon:
  text: Lord, Thou deliverest unto me five talents * behold, I have gained beside them five talents more.
  status: verified

prime-lectio:
  text: She conducted the just, when he fled from his brother's wrath, through the right ways, and showed him the kingdom of God, and gave him the knowledge of the holy things, made him honourable in his labours, and accomplished his labours.
  citation: Wis 10:10
  status: verified

terce-antiphon:
  text: Well done, thou good servant, * thou hast been faithful in a very little, enter thou into the joy of thy Lord.
  status: verified

terce-capitulum:
  text: |
    Blessed is the rich man that is found without blemish: and that hath not gone after gold, nor put his trust in money nor in treasures. Who is he, and we will praise him? for he hath done wonderful things in his life.
    R. Thanks be to God.
    V. The Lord loved him and beautified him.
    R. He clothed him with a robe of glory.
  citation: Sir 31:8-9
  status: verified

sext-antiphon:
  text: A faithful and wise servant * whom his Lord hath made ruler over His household.
  status: verified

sext-capitulum:
  text: |
    The righteous will give his heart to resort early to the Lord that made him, and he will pray in the sight of the most High.
    R. Thanks be to God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
  citation: Sir 39:6
  status: verified

none-antiphon:
  text: Thou good and faithful servant, * enter thou into the joy of thy Lord.
  status: verified

none-capitulum:
  text: |
    She conducted the just, when he fled from his brother's wrath, through the right ways, and showed him the kingdom of God, and gave him the knowledge of the holy things, made him honourable in his labours, and accomplished his labours.
    R. Thanks be to God.
    V. The law of his God is in his heart.
    R. None of his steps shall slide.
  citation: Wis 10:10
  status: verified

