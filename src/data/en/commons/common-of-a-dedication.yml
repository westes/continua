matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 5
        antiphon: I will come into thy house, O Lord; * and I will worship towards thy holy temple.
      - psalms:
          - 10
        antiphon: The Lord is in his holy temple, * the Lord's throne is in heaven.
      - psalms:
          - 23
        antiphon: Lift up your gates, O ye princes, * and be ye lift up, ye everlasting doors.
      - psalms:
          - 28
        antiphon: Adore ye the Lord * in his holy court.
      - psalms:
          - 45
        antiphon: The Lord shall be my God, * and this stone shall be called God's house.
      - psalms:
          - 47
        antiphon: Moses built an altar * to the Lord God.
    versicle:
      v: Holiness becometh thine house, O Lord.
      r: For ever.
  nocturn2:
    groups:
      - psalms:
          - 83
        antiphon: 'Blessed are they that dwell in thy house, O Lord: * they shall praise thee for ever and ever.'
      - psalms:
          - 86
        antiphon: This is none other * but the house of God, and this is the gate of heaven.
      - psalms:
          - 87
        antiphon: 'The Temple of the Lord is holy: * the same is God''s workmanship and God''s building.'
      - psalms:
          - 90
        antiphon: He that dwelleth in the help of the Most High * shall abide under the shadow of the God of heaven.
      - psalms:
          - 95
        antiphon: Jacob set up the stone for a pillar, * and poured oil upon the top of it.
      - psalms:
          - 98
        antiphon: Blessed be the glory of the Lord * from His holy place. Alleluia.
    versicle:
      v: My house.
      r: Shall be called the house of prayer.
  nocturn3:
    antiphon: 'Jacob beheld a ladder, * the top whereof touched heaven, and angels descending on it, and he said: Surely this place is holy.'
    canticles:
      - refs:
          - book: tob
            chapter: 13
            verses: 10-17
      - refs:
          - book: isa
            chapter: 2
            verses: 2-3
      - refs:
          - book: jer
            chapter: 7
            verses: 2-7
    versicle:
      v: This is the house of God, stoutly builded.
      r: Well founded upon a sure rock.

