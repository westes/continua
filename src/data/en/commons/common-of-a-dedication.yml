collect/c8:
  text: |
    Let us pray.
    O God, who dost bring round unto us again, year by year, the day of the consecration of this thy holy temple, and dost bring us back again in safety to thine holy mysteries, graciously hear the prayers of thy people, and grant that whosoever enters this temple to ask for blessings may rejoice to obtain them all.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration-antiphon:
  text: |
    Zacchaeus, make haste and come down, for today I must abide at thy house. * And he made haste and came down, and received Him joyfully into his house. This day is salvation come from God to this house. Alleluia.
  status: verified

matins-hymn:
  text: |
    Blessed city, heavenly Salem,
    Vision dear of peace and love,
    Who of living stones art builded
    In the height of heaven above,
    And, with angel hosts encircled,
    As a bride dost earthward move;

    From celestial realms descending,
    Bridal glory round thee shed,
    Meet for him whose love espoused thee,
    To thy Lord shalt thou be led;
    All thy streets and all thy bulwarks
    Of pure gold are fashioned.

    Bright thy gates of pearl are shining;
    They are open evermore;
    And by virtue of his merits
    Thither faithful souls do soar,
    Who for Christ's dear Name in this world
    Pain and tribulation bore.

    Many a blow and biting sculpture
    Polished well those stones elect,
    In their places now compacted
    By the heavenly Architect,
    Who therewith hath willed for ever
    That his palace should be decked.

    Laud and honor to the Father,
    Laud and honor to the Son,
    Laud and honor to the Spirit,
    Ever Three, and ever One,
    Consubstantial, co-eternal,
    While unending ages run.
    Amen.
  status: verified

matins-invitatory:
  text: Holiness becometh the house of God. * In her let us worship her Bridegroom, even Christ.
  status: verified

lauds-capitulum:
  text: |
    I saw the holy city, New Jerusalem, coming down from God out of heaven, prepared as a Bride adorned for her husband.
    R. Thanks be to God.
  status: verified

lauds-hymn:
  text: |
    Christ is made the sure Foundation,
    Christ the Head and Cornerstone;
    Chosen of the Lord, and precious,
    Binding all the Church in one,
    Holy Zion's Help for ever,
    And her Confidence alone.

    All that dedicated city,
    Dearly loved of God on high,
    In exultant jubilation,
    Pours perpetual melody,
    God the One in Three adoring
    In glad hymns eternally.

    To this temple, where we call Thee,
    Come, O Lord of Hosts, today;
    With Thy wonted loving-kindness
    Hear Thy servants as they pray.
    And Thy fullest benediction
    Shed within its walls alway.

    Here vouchsafe to all Thy servants
    What they ask of Thee to gain;
    What they gain from Thee for ever
    With the blessed to retain,
    And hereafter in Thy glory
    Evermore with Thee to reign.

    Laud and honor to the Father,
    Laud and honor to the Son,
    Laud and honor to the Spirit,
    Ever Three, and ever One,
    Consubstantial, co-eternal,
    While unending ages run.
    Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Holiness becometh thine house, * O Lord.
    R. Holiness becometh thine house, * O Lord.
    V. For ever.
    R. O Lord.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Holiness becometh thine house, * O Lord.
  status: verified

lauds-versicle:
  text: |
    V. This is the house of God, stoutly builded.
    R. Well founded upon a sure rock.
  status: verified

prime-antiphon:
  text: Holiness becometh thine house, * O Lord, for ever.
  status: verified

prime-lectio:
  text: 'And God shall wipe away all tears from their eyes, and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain; for the former things are passed away. And He That sat upon the throne said: Behold, I make all things new.'
  citation: Rev 21:4-5
  status: verified

terce-antiphon:
  text: My house * shall be called the house of prayer.
  status: verified

terce-capitulum:
  text: |
    I saw the holy city, New Jerusalem, coming down from God out of heaven, prepared as a Bride adorned for her husband.
    R. Thanks be to God.
    V. Holiness becometh thine house, O Lord.
    R. For ever.
  citation: Rev 21:2
  status: verified

sext-antiphon:
  text: This is the Lord's house * stoutly builded, well founded upon a sure rock.
  status: verified

sext-capitulum:
  text: |
    And I heard a great voice out of the throne, saying Behold, the tabernacle of God is with men, and He will dwell with them. And they shall be His people; and God Himself shall be with them, and be their God.
    R. Thanks be to God.
    V. This place is holy, wherein the Priest prayeth.
    R. For the pardon of the transgressions and offences of the people.
  citation: Rev 21:3
  status: verified

