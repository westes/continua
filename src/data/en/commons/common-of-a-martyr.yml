          - 14
        antiphon: He shall dwell * in thy tabernacle, He shall rest upon thy holy hill.
      - psalms:
          - 20
        antiphon: O Lord, Thou hast set a crown * of precious stones upon his head.
      - psalms:
          - 23
        antiphon: He shall receive * a blessing from the Lord, and mercy from God his Saviour.
      - psalms:
          - 63
        antiphon: 'The just shall rejoice * in the Lord, and shall hope in him: and all the upright in heart shall be praised.'
      - psalms:
          - 64
        antiphon: 'Blessed is he * whom thou hast chosen: he shall dwell in thy courts.'
      - psalms:
          - 91
        antiphon: 'The just shall flourish * like the palm tree: he shall grow up like the cedar of Libanus.'
    versicle:
      v: O Lord, Thou hast set a crown of precious stones.
      r: Upon his head.
  nocturn3:
    antiphon: If any man will come after me, * let him deny himself, and take up his cross daily, and follow me.
