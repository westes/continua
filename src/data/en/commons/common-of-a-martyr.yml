collect/c2a:
  text: |
    Let us pray.
    Grant, we beseech thee, almighty God, that we who celebrate the birthday of thy blessed Martyr {N}, may through his intercession be strengthened in the love of thy name.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/c2a-1:
  text: |
    Let us pray.
    Graciously hear us, we beseech thee, O Almighty God, and, at the petition of thy blessed Martyr {N}, be mercifully pleased to deliver us from all things which may hurt our bodies, and from all evil thoughts which may defile our souls.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/c7:
  text: |
    Let us pray.
    O God, Who among the other miracles of thy power hast bestowed the victory of martyrdom even upon the weaker sex, graciously grant that we who keep the birthday of blessed {N}, thy Martyr, may come to thee by the path of her example.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration-antiphon:
  text: |
    He that hateth his life * in this world, shall keep it unto life eternal.
  status: verified

matins-hymn:
  text: |-
    O God, of those that fought thy fight,
    Portion, and prize, and crown of light,
    Break every bond of sin and shame
    As now we praise thy martyr's name.

    He recked not of the world's allure,
    But sin and pomp of sin forswore:
    Knew all their gall, and passed them by,
    And reached the throne prepared on high.

    Bravely the course of pain he ran,
    And bare his torments as a man:
    For love of thee his blood outpoured,
    And thus obtained the great reward.

    With humble voice and suppliant word
    We pray thee therefore, holy Lord,
    While we thy martyr's feast-day keep,
    Forgive thy loved and erring sheep.

    * Glory and praise for aye be done
    To God the Father, and the Son,
    And Holy Ghost, who reign on high,
    One God, to all eternity. Amen.
  status: verified

matins-invitatory:
  text: The Lord, the King of Martyrs, * O come, let us worship.
  status: verified

lauds-capitulum:
  text: Blessed is the man that endureth temptation; for when he hath been proved, he shall receive a crown of life, which God hath promised to them that love him.
  citation: Jas 1:12
  status: verified

lauds-hymn:
  text: |-
    Martyr of God, whose strength was steeled
    To follow close God's only Son,
    Well didst thou brave thy battlefield,
    And well thy heavenly bliss was won!

    Now join thy prayers with ours, who pray
    That God may pardon us and bless;
    For prayer keeps evil's plague away,
    And draws from life its weariness.

    Long, long ago, were loosed the chains
    That held thy body once in thrall;
    For us how many a bond remains!
    O love of God release us all.

    All praise to God the Father be,
    All praise to thee, Eternal Son;
    All praise, O Holy Ghost, to thee,
    While never-ending ages run. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Thou hast crowned him * with glory and honour, O Lord.
    R. Thou hast crowned him * with glory and honour, O Lord.
    V. And madest him to have dominion over the works of thy hands.
    R. With glory and honour, O Lord.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Thou hast crowned him * with glory and honour, O Lord.
  status: verified

lauds-versicle:
  text: |
    V. The righteous shall flourish like the palm-tree.
    R. He shall grow like a cedar in Lebanon.
  status: verified

