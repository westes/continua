        - 109
      antiphon: An Angel stood at the Altar * of the Temple, having a golden censer in his hand.
    - psalms:
        - 110
      antiphon: 'While as the Archangel Michael fought against the dragon, * I heard voices saying: Salvation unto our God. Alleluia.'
    - psalms:
        - 111
      antiphon: Michael Mine Archangel, * I have appointed thee for a prince over the ingathering of souls.
    - psalms:
        - 112
      antiphon: O ye Angels and Archangels, * O ye Thrones and Dominions, O ye Principalities and Powers, O ye mighty Ones of heaven, praise ye the Lord from the heavens. Alleluia.
