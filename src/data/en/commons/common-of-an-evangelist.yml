matins-hymn:
  text: |-
    Th' eternal gifts of Christ the King,
    The Apostles' glory, let us sing;
    And all with hearts of gladness raise
    Due hymns of thankful love and praise.

    For they the Church's princes are,
    Triumphant leaders in the war,
    The heavenly King's own warrior band,
    True lights to lighten every land.

    Theirs was the steadfast faith of saints,
    The hope that never yields nor faints,
    The love of Christ in perfect glow,
    That lay the prince of this world low.

    In them the Father's glory shone,
    In them the Spirit's will was done,
    The Son himself exults in them;
    Joy fills the new Jerusalem.

    * Praise to the Father, with the Son,
    And Holy Spirit, Three in One;
    As ever was in ages past,
    And so shall be while ages last. Amen.
  status: verified

matins-invitatory:
  text: The Lord, the King of Apostles, * O come, let us adore.
  status: verified

prime-antiphon:
  text: This is my commandment * that you love one another, as I have loved you.
  status: verified

prime-antiphon/~-paschaltide:
  text: 'Your saints, O Lord, * flourish like lilies, alleluia: and like the smell of balsam are before you, alleluia.'
  status: verified

prime-lectio:
  text: V. And the Apostles indeed went from the presence of the council, rejoicing that they were accounted worthy to suffer reproach for the name of Jesus.
  citation: Acts 5:41
  status: verified

terce-antiphon:
  text: Greater love than this no man hath, * that a man lay down his life for his friends.
  status: verified

terce-antiphon/~-paschaltide:
  text: 'In the heavenly kingdom * is the habitation of the saints, alleluia: and they rest in the eternity, alleluia.'
  status: verified

terce-capitulum:
  text: |
    Brothers: Now therefore you are no more strangers and foreigners; but you are fellow citizens with the saints, and the domestics of God, built upon the foundation of the apostles and prophets, Jesus Christ himself being the chief corner stone.
    R. Thanks be to God.
    V. Their sound hath gone forth into all the earth:
    R. And their words unto the ends of the world.
  citation: Eph 2:19-20
  status: verified

terce-capitulum/~-paschaltide:
  text: |
    Then shall the just stand with great constancy against those that have afflicted them, and taken away their labours.
    R. Thanks be to God.
    V. Saints and just, rejoice in the Lord, alleluia.
    R. The Lord has chosen you for his inheritance, alleluia.
  citation: Wis 5:1
  status: verified

sext-antiphon:
  text: You are my friends * if you do the things that I command you, said the Lord.
  status: verified

sext-antiphon/~-paschaltide:
  text: Protected by a veil * your saints turn to you, O Lord, alleluia, alleluia.
  status: verified

sext-capitulum:
  text: |
    And by the hands of the apostles were many signs and wonders wrought among the people.
    R. Thanks be to God.
    V. Thou shalt make them princes over all the earth.
    R. They shall remember thy name, O Lord.
  citation: Acts 5:12
  status: verified

sext-capitulum/~-paschaltide:
  text: |
    Behold how they are numbered among the children of God, and their lot is among the saints.
    R. Thanks be to God.
    V. Eternal light will shine over your saints, O Lord, alleluia.
    R. And the eternity of times, alleluia.
  citation: Wis 5:5
  status: verified

none-antiphon:
  text: In your patience * you shall possess your souls.
  status: verified

none-antiphon/~-paschaltide:
  text: The just shine * like the sun at the face of God, alleluia.
  status: verified

none-capitulum:
  text: |
    And the Apostles indeed went from the presence of the council, rejoicing that they were accounted worthy to suffer reproach for the name of Jesus.
    R. Thanks be to God.
    V. Thy friends, O Lord, are made exceedingly honourable.
    R. Their principality is exceedingly strengthened.
  citation: Acts 5:41
  status: verified

none-capitulum/~-paschaltide:
  text: |
    And we know that to them that love God, all things work together unto good, to such as, according to his purpose, are called to be saints.
    R. Thanks be to God.
    V. Everlasting joy shall be upon their heads, alleluia.
    R. They shall obtain joy and gladness, alleluia.
  citation: Rom 8:28
  status: verified

magnificat-antiphon:
  text: Be valiant * in battle, fight the ancient serpent and accept the eternal kingdom. Alleluia.
  status: verified

magnificat-antiphon/~-first:
  text: 'For they shall deliver you * up to councils: and in the synagogues you shall be beaten: and you shall stand before governors and kings for my sake, for a testimony unto them.'
  status: verified
