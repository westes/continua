collect/c4:
  text: |
    Let us pray.
    Grant, we beseech thee, almighty God, that the venerable feast of {N}, thy blessed Confessor and Bishop, may increase our devotion and promote our salvation.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration-antiphon:
  text: |
    Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
  status: verified

matins-hymn:
  text: |-
    This is the Lord's own hallowed confessor,
    Whose feast today the nations round are keeping;
    Joyful, he merited this day to enter
    Heaven's hid glory.

    Dutiful, prudent, humble, chaste, he flourished,
    Sober and quiet, pure in all his living,
    While in his body yet the breath of this life
    Quickened his members.

    Often at his consecrated tomb, the
    Limbs of those worn by long and grievous sickness,
    Whatsoever ill had laid them low, are
    Wholly restored.

    Therefore our choir today, in glad thanksgiving,
    Sings in his honor this our joyful anthem:
    That by his merits, freely won through goodness,
    We may be aided.

    Praise be to Him, all honor, might, dominion,
    Who from the height of heaven's throne is reigning,
    Governing all the fabric of creation,
    Three and yet One. Amen.
  status: draft

matins-invitatory:
  text: The Lord, the King of Confessors, * O come, let us worship.
  status: verified

lauds-capitulum:
  text: Behold an high priest, who in his days pleased God, and was found righteous, and in the time of wrath he was made a propitiation.
  citation: Sir 44:16-17
  status: verified

lauds-hymn:
  text: |-
    Jesu, the world's Redeemer, O hear;
    thy bishops' fadeless crown, draw near:
    Accept with gentlest love today
    The prayers and praises that we pay.

    The meek confessor of thy name
    Today attained a glorious fame;
    Whose yearly feast, in solemn state,
    Thy faithful people celebrate.

    The world and all its boasted good,
    As vain and passing, he eschewed;
    And therefore with angelic bands,
    In endless joy forever stands.

    Grant then that we, most gracious God,
    May follow in the steps he trod:
    And, at his prayer, thy servants free
    From stain of all iniquity.

    * To thee, O Christ, our loving King,
    All glory, praise, and thanks we bring:
    All glory, as is ever meet,
    To Father and to Paraclete. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. The Lord loved him, * and beautified him.
    R. The Lord loved him, * and beautified him.
    V. He clothed him with a robe of glory.
    R. And beautified him.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. The Lord loved him, * and beautified him.
  status: verified

lauds-versicle:
  text: |
    V. The Lord guided the just in right paths.
    R. And showed him the kingdom of God.
  status: verified

prime-antiphon:
  text: Behold an high priest, * who in his days pleased God, and was found righteous.
  status: verified

prime-lectio:
  text: To execute the office of the priesthood, and to have praise, and to glorify his people in his name. He chose him out of all men living, to offer sacrifice to God, incense, and a good savour.
  citation: Sir 45:19-20
  status: verified

terce-antiphon:
  text: None was found like unto him, * to keep the Law of the Most High.
  status: verified

terce-capitulum:
  text: |
    Behold an high priest, who in his days pleased God, and was found righteous, and in the time of wrath he was made a propitiation.
    R. Thanks be to God.
    V. The Lord loved him and beautified him.
    R. He clothed him with a robe of glory.
  citation: Sir 44:16-17
  status: verified

sext-antiphon:
  text: Therefore the Lord assured him * by an oath that He would multiply his seed among His people.
  status: verified

sext-capitulum:
  text: |
    There was not found the like to him in glory, who kept the law of the most High, and was in covenant with him. Therefore by an oath he gave him glory in his posterity, that he should increase in his people.
    R. Thanks be to God.
    V. The Lord hath chosen him for a Priest unto Himself.
    R. To offer up unto Him the sacrifice of praise.
  citation: Sir 44:20; 44:22
  status: verified

none-antiphon:
  text: Good and faithful servant, * enter thou into the joy of thy Lord.
  status: verified

none-capitulum:
  text: |
    To execute the office of the priesthood, and to have praise, and to glorify his people in his name. He chose him out of all men living, to offer sacrifice to God, incense, and a good savour.
    R. Thanks be to God.
    V. Thou art a Priest for ever.
    R. After the order of Melchisedek.
  citation: Sir 45:19-20
  status: verified

