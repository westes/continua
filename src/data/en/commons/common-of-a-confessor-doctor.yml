  text: Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
  status: verified

magnificat-antiphon:
  text: O excellent Doctor, * light of holy Church, blessed N., lover of God's law, pray for us to the Son of God.
  status: draft

