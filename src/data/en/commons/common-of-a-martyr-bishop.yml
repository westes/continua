collect/c2:
  text: |
    Let us pray.
    Mercifully consider our weakness, O Almighty God, and whereas by the burden of our sins we are sore, may the glorious intercession of blessed {N}, thy Martyr and Bishop, sustain us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/c2-1:
  text: |
    Let us pray.
    O God, who year by year dost gladden us by the solemn feast day of thy blessed Martyr and Bishop {N}, mercifully grant that we who keep his birthday, may ever feel the joyful effects of his protection.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/c2b:
  text: |
    Let us pray.
    Look forgivingly on thy flock, Eternal Shepherd, and keep it in thy constant protection, by the intercession of blessed {N}, thy Martyr and Sovereign Pontiff, whom thou didst constitute Shepherd of the whole Church.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration-antiphon:
  text: |
    He that hateth his life * in this world, shall keep it unto life eternal.
  status: verified

matins-hymn:
  text: |-
    O God, of those that fought thy fight,
    Portion, and prize, and crown of light,
    Break every bond of sin and shame
    As now we praise thy martyr's name.

    He recked not of the world's allure,
    But sin and pomp of sin forswore:
    Knew all their gall, and passed them by,
    And reached the throne prepared on high.

    Bravely the course of pain he ran,
    And bare his torments as a man:
    For love of thee his blood outpoured,
    And thus obtained the great reward.

    With humble voice and suppliant word
    We pray thee therefore, holy Lord,
    While we thy martyr's feast-day keep,
    Forgive thy loved and erring sheep.

    * Glory and praise for aye be done
    To God the Father, and the Son,
    And Holy Ghost, who reign on high,
    One God, to all eternity. Amen.
  status: verified

matins-invitatory:
  text: The Lord, the King of Martyrs, * O come, let us worship.
  status: verified

lauds-capitulum:
  text: Blessed is the man that endureth temptation; for when he hath been proved, he shall receive a crown of life, which God hath promised to them that love him.
  citation: Jas 1:12
  status: verified

lauds-hymn:
  text: |-
    Martyr of God, whose strength was steeled
    To follow close God's only Son,
    Well didst thou brave thy battlefield,
    And well thy heavenly bliss was won!

    Now join thy prayers with ours, who pray
    That God may pardon us and bless;
    For prayer keeps evil's plague away,
    And draws from life its weariness.

    Long, long ago, were loosed the chains
    That held thy body once in thrall;
    For us how many a bond remains!
    O love of God release us all.

    All praise to God the Father be,
    All praise to thee, Eternal Son;
    All praise, O Holy Ghost, to thee,
    While never-ending ages run. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Thou hast crowned him * with glory and honour, O Lord.
    R. Thou hast crowned him * with glory and honour, O Lord.
    V. And madest him to have dominion over the works of thy hands.
    R. With glory and honour, O Lord.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Thou hast crowned him * with glory and honour, O Lord.
  status: verified

lauds-versicle:
  text: |
    V. The righteous shall flourish like the palm-tree.
    R. He shall grow like a cedar in Lebanon.
  status: verified

prime-lectio:
  text: He will give his heart to resort early to the Lord that made him, and he will pray in the sight of the most High.
  citation: Sir 39:6
  status: verified

terce-capitulum:
  text: |
    Blessed is the man that endureth temptation; for when he hath been proved, he shall receive a crown of life, which God hath promised to them that love him.
    R. Thanks be to God.
    V. Thou hast crowned him with glory and honour, O Lord.
    R. And madest him to have dominion over the works of thy hands.
  citation: Jas 1:12
  status: verified

sext-capitulum:
  text: |
    With the bread of life and understanding, she shall feed him, and give him the water of wholesome wisdom to drink: and she shall be made strong in him, and he shall not be moved.
    R. Thanks be to God.
    V. O Lord, Thou hast set a crown of precious stones.
    R. Upon his head.
  citation: Sir 15:3
  status: verified

none-capitulum:
  text: |
    He will give his heart to resort early to the Lord that made him, and he will pray in the sight of the most High.
    R. Thanks be to God.
    V. His glory is great in thy salvation.
    R. Honour and great majesty shalt Thou lay upon him.
  citation: Sir 39:6
  status: verified

