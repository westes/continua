collect/c6:
  text: |
    Let us pray.
    O God, Who among the other miracles of thy power hast bestowed the victory of martyrdom even upon the weaker sex, graciously grant that we who keep the birthday of blessed {N}, thy Virgin and Martyr, may come to thee by the path of her example.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/c6-1:
  text: |
    Let us pray.
    We beseech thee, O Lord, that thy blessed Virgin and Martyr {N} may entreat thy pardon for us: she who was ever pleasing unto thee, both by the merit of her chastity and by her profession of thy power.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration-antiphon:
  text: |
    The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
  status: verified

matins-hymn:
  text: |-
    Son of a virgin, maker of thy mother,
    Thou, rod and blossom from a stem unstainèd,
    While we a Virgin's triumphs are rehearsing,
    Hear our petition!

    Lo, on thy handmaid fell a two-fold blessing,
    Who, in her body vanquishing the weakness,
    In that same body, grace from heaven obtaining,
    Bore the world witness.

    Death, nor the rending pains of death appalled her;
    Bondage and torment found her undefeated:
    So by the shedding of her blood attained she
    Heavenly guerdon.

    Fountain of mercy, hear the prayers she offers;
    Purge our offences, pardon our transgressions,
    So that hereafter we to thee may render
    Praise with thanksgiving.

    Thou, the All-Father, thou, the One-Begotten,
    Thou, Holy Spirit, Three in One co-equal,
    Glory be henceforth thine through all the ages,
    World without ending. Amen.
  status: verified

matins-invitatory:
  text: The Lord, the King of Virgins, * O come, let us worship.
  status: verified

lauds-capitulum:
  text: 'Brothers: But he that glorieth, let him glory in the Lord. For not he who commendeth himself, is approved, but he, whom God commendeth.'
  citation: 2 Cor 10:17-18
  status: verified

lauds-hymn:
  text: |-
    Jesu, the virgins' crown, do thou
    Accept us as in prayer we bow;
    Born of that Virgin, whom alone
    The mother and the maid we own.

    Amongst the lilies thou dost feed,
    By virgin choirs accompanied;
    With glory decked, the spotless brides
    Whose bridal gifts thy love provides.

    They, wheresoe'er thy footsteps bend,
    With hymns and praises still attend:
    In blessèd troops they follow thee,
    With dance, and song, and melody.

    We pray thee therefore to bestow
    Upon our senses here below
    Thy grace, that so we may endure
    From taint of all corruption pure.

    * All laud to God the Father be,
    All praise, eternal Son, to thee;
    All glory as is ever meet,
    To God, the holy Paraclete. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. In thy comeliness * and in thy beauty.
    R. In thy comeliness * and in thy beauty.
    V. Go forward, fare prosperously, and reign.
    R. In thy beauty.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. In thy comeliness * and in thy beauty.
  status: verified

lauds-versicle:
  text: |
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
  status: verified

prime-antiphon:
  text: This is one of the wise virgins, * one chosen out of the number of the careful.
  status: verified

prime-lectio:
  text: O Lord, my God thou hast exalted my dwelling place upon the earth and I have prayed for death to pass away. I called upon the Lord, the father of my Lord, that he would not leave me in the day of my trouble, and in the time of the proud without help.
  citation: Sir 51:13-14
  status: verified

terce-antiphon:
  text: This is one of the wise virgins, * whom the Lord found watching.
  status: verified

terce-capitulum:
  text: |
    Brothers: But he that glorieth, let him glory in the Lord. For not he who commendeth himself, is approved, but he, whom God commendeth.
    R. Thanks be to God.
    V. In thy comeliness and thy beauty.
    R. Go forward, fare prosperously, and reign.
  citation: 2 Cor 10:17-18
  status: verified

sext-antiphon:
  text: This, is one which hath not known the sinful bed, * she shall have fruit in the visitation of holy souls.
  status: verified

sext-capitulum:
  text: |
    For I am jealous of you with the jealousy of God. For I have espoused you to one husband that I may present you as a chaste virgin to Christ.
    R. Thanks be to God.
    V. God shall help her with His countenance.
    R. God is in the midst of her she shall not be moved.
  citation: 2 Cor 11:2
  status: verified

none-antiphon:
  text: She is beautiful * among the daughters of Jerusalem.
  status: verified

