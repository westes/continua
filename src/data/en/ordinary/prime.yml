collect-prime:
  text: |
    Let us pray.
    O Lord, our heavenly Father, Almighty and everlasting God, who has safely brought us to the beginning of this day: defend us by thy mighty power; and grant that this day we fall into no sin, but that all our doings may be ordered by thy governance, to do always what is righteous in thy sight. Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.

    V. O Lord, hear my prayer.
    R. And let my cry come unto thee.
    V. Let us bless the Lord.
    R. Thanks be to God.
  status: verified

prime-capitulum-dominica:
  text: Now to the king of ages, immortal, invisible, the only God, be honour and glory for ever and ever. Amen.
  citation: 1 Tim. 1:17
  status: verified

prime-capitulum-feria:
  text: Love ye truth and peace, said the Almighty Lord.
  citation: Zech. 8:19
  status: verified

prime-chapter-office:
  text: |
    V. O God, come to my assistance;
    R. O Lord, make haste to help me.
    V. O God, come to my assistance;
    R. O Lord, make haste to help me.
    V. O God, come to my assistance;
    R. O Lord, make haste to help me.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. As it was in the beginning, is now, * and ever shall be, world without end. Amen.

    Lord have mercy upon us, Christ have mercy upon us, Lord have mercy upon us.

    Our Father, who art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done on earth as it is in heaven. Give us this day our daily bread. And forgive us our trespasses, as we forgive those who trespass against us.
    V. And lead us not into temptation:
    R. But deliver us from evil.

    V. Look upon thy servants and upon thy works: and direct their children.
    R. And let the brightness of the Lord our God be upon us. Direct thou the works of our hands; yea, the work of our hands do thou direct.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. As it was in the beginning, is now, * and ever shall be, world without end. Amen.

    Let us pray.
    O Lord, Almighty God, King of heaven and earth, Saviour of the world, bless, lead, rule and govern our hearts and bodies, our senses, words and deeds today, following thy law and commandments, that here and for eternity with thy help we shall be saved in freedom. Who livest and reignest, world without end.
    R. Amen.
  status: verified

prime-conclusio:
  text: |
    V. Our help is ✠ in the name of the Lord,
    R. Who made heaven and earth.
    V. Let us bless.
    R. God.
    Benediction. May the Lord bless us, ✠ protect us from all evil and bring us to everlasting life. And may the souls of the faithful, through the mercy of God, rest in peace.
    R. Amen.
  status: verified

prime-martyrology-close:
  text: |
    V. Precious in the sight of the Lord
    R. Is the death of his saints.
    Holy Mary and all the Saints, intercede for us with the Lord, our God, so that we may merit His help and salvation, who lives and reigns for ever and ever.
    R. Amen.
  status: verified

prime-preces-conclusion:
  text: |
    V. Our help is ✠ in the name of the Lord,
    R. Who made heaven and earth.

    I confess to almighty God, to blessed Mary ever Virgin, to blessed Michael the Archangel, to blessed John the Baptist, to the holy Apostles Peter and Paul, our holy Father Benedict, and to all the Saints, that I have sinned exceedingly in thought, word and deed: through my fault, through my fault, through my most grievous fault. Therefore I beseech blessed Mary ever Virgin, blessed Michael the Archangel, blessed John the Baptist, the holy Apostles Peter and Paul, our holy Father Benedict, and all the Saints, to pray for me to the Lord our God.

    May almighty God have mercy on us, forgive us our sins, and bring us to everlasting life. Amen.

    May the almighty ✠ and merciful Lord grant us pardon, absolution and remission of our sins. Amen.

    V. Vouchsafe, O Lord,
    R. To keep us this day without sin.
    V. O Lord, have mercy upon us.
    R. Have mercy upon us.
    V. O Lord, let thy mercy lighten upon us,
    R. As our trust is in thee.
    V. O Lord, hear my prayer.
    R. And let my cry come unto thee.
  status: verified

prime-preces-feriales:
  text: |
    V. Deliver me, O Lord, from the evil man.
    R. Rescue me from the unjust man.
    V. Deliver me from my enemies, O my God.
    R. And defend me from them that rise up against me.
    V. Deliver me from them that work iniquity.
    R. And save me from bloody men.
    V. So will I sing a psalm to thy name for ever and ever.
    R. That I may pay my vows from day to day.
    V. Hear us, O God our saviour.
    R. Who art the hope of all the ends of the earth, and of the sea afar off.
    V. O God come to my assistance;
    R. O Lord, make haste to help me.
    V. O holy God, Oh holy strength, Oh holy and immortal one.
    R. Have mercy on us.
    V. Bless the Lord, O my soul.
    R. And let all that is within me bless his holy name.
    V. Bless the Lord, O my soul.
    R. And forget not all his benefits.
    V. Who forgives all thy iniquities.
    R. Who heals all thy infirmities.
    V. Who has redeemed thy life from destruction.
    R. Who crowns thee with mercy and compassion.
    V. Who satisfies thy desire with good things.
    R. Thy youth shall be renewed like the eagle's.
  status: verified

prime-preces-prelude:
  text: |
    Lord have mercy upon us, Christ have mercy upon us, Lord have mercy upon us.

    Our Father, who art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done on earth as it is in heaven. Give us this day our daily bread. And forgive us our trespasses, as we forgive those who trespass against us.
    V. And lead us not into temptation:
    R. But deliver us from evil.

    I believe in God, the Father almighty, Creator of heaven and earth. And in Jesus Christ, his only Son, our Lord; who was conceived by the Holy Ghost, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried: he descended into hell; the third day he arose again from the dead; he ascended into heaven; sitteth at the right hand of God the Father almighty: from thence he shall come to judge the living and the dead. I believe in the Holy Ghost, the holy catholic Church, the communion of Saints, the forgiveness of sins.
    V. The resurrection of the body.
    R. And life everlasting. Amen.

    V. But I, O Lord, have cried unto thee:
    R. And in the morning my prayer shall rise to thee.
    V. Let my mouth be filled with praise,
    R. That I may sing thy glory and thy greatness all the day long.
    V. O Lord, turn away thy face from my sins,
    R. And blot out all my iniquities.
    V. Create a clean heart in me, O God,
    R. And renew a right spirit within me.
    V. Cast me not away from thy presence,
    R. And take not thy Holy Spirit from me.
    V. Restore unto me the joy of thy salvation,
    R. And strengthen me with a perfect spirit.
  status: verified

prime-regula-blessing:
  text: |
    V. Grant, Lord, a blessing.
    Benediction. May Almighty God arrange our deeds and our day in His peace.
    R. Amen.
  status: verified

prime-versicle:
  text: |
    V. Arise, O Christ, and help us.
    R. And deliver us for thy name's sake.
  status: verified

hymn-iam-lucis-orto-sidere:
  text: |
    Now in the sun's new dawning ray,
    Lowly of heart, our God we pray
    That he from harm may keep us free
    In all the deeds this day shall see.

    May fear of him our tongues restrain,
    Lest strife unguarded speech should stain:
    His favouring care our guardian be,
    Lest our eyes feed on vanity.

    May every heart be pure from sin
    And folly find no place therein:
    Scant need of food, excess denied,
    Wear down in us the body's pride.

    That when the light of day is gone,
    And night in course shall follow on.
    We, free from cares the world affords,
    May chant the praise that is our Lord's.

    * All laud to God the Father be,
    All praise, Eternal Son, to thee:
    All glory, as is ever meet,
    To God the holy Paraclete. Amen.
  status: verified

martyrology-close:
  text: |
    V. And elsewhere many other holy martyrs, confessors, and holy virgins.
    R. Thanks be to God.
  status: verified
