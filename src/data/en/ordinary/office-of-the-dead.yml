# The Office of the Dead's fixed texts: the "Requiem gloria" said in place of
# the Gloria Patri after every psalm and canticle, and the special closing
# (Conclusio specialis) that ends each hour instead of Benedicamus Domino.
requiem-gloria-patri:
  text: |-
    Eternal rest * grant unto them, O Lord.
    And let perpetual light * shine upon them.
  status: verified

requiem-conclusio:
  text: |-
    V. Eternal rest grant unto them, O Lord.
    R. And let perpetual light shine upon them.
    V. May they rest in peace.
    R. Amen.
  status: verified

requiem-martyrology-versicle:
  text: |-
    V. The just shall be in everlasting remembrance.
    R. They will not fear from hearing evil.
  status: verified

requiem-collect-deus-veniae:
  text: 'O God the giver of pardon, and the lover of human salvation, we beseech thy clemency: that thou grant unto the souls of all the faithful who are departed out of this world, blessed Mary ever Virgin making intercession with all thy Saints, to come to the fellowship of eternal blessedness. Through Christ our Lord. Amen.'
  status: verified
