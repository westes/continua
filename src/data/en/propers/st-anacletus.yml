nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Anacletus was an Athenian who governed the Church in the time of the Emperor Trajan. He ordained that a Bishop should be consecrated by three Bishops and no less, that clerks should be publicly ordained to Holy Orders by their own Bishop, and that in the Mass, after the Consecration, all should afterwards Communicate. He adorned the grave of Blessed Peter, and ordered a place for burying the Popes in. He held two ordinations in the month of December, wherein he ordained five Priests, three Deacons, and six Bishops. He sat as Pope nine years, three months, and ten days. He received the crown of his testimony, and was buried on the Vatican Hill.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Exposition of Psalm 118, Sermon 21
      text: |-
        Princes have persecuted me without a cause; but my heart standeth in awe of thy word. These are rightly the words of a martyr, who beareth unjustly the torments of the persecutors, who hath robbed no man, who hath violently oppressed no man, who hath shed the blood of no man, who hath imagined to defile the bed of no man, who is debtor to the laws in nothing, and who is punished more grievously than if he were a robber: who speaketh righteousness, and there is none that will hear: who speaketh salvation, and all men fight against him: who is able to say: When I spoke unto them, they fought against me without a cause. They fight against him without a cause, who can lay no sin to his charge; they fight against him as an evildoer, who is by their own acknowledgment righteous: they fight against him as a warlock, who glorieth in the name of the Lord, and who doeth all things well because he doeth all things for God's sake.

        They fight against him in vain who is accused of ungodliness among the ungodly and the unfaithful, because he teacheth Faith. Verily, him that is fought against without a cause it behoveth to be strong and patient. Wherefore then saith he: My heart standeth in awe of thy word? Awe is the mark of the weak, the timid, and the fearful. But there is also a weakness unto salvation, there is a fear which is an holy fear. O fear the Lord, all ye His Saints. And again: Blessed is the man that feareth the Lord. And wherefore is he blessed? Because he delighteth greatly in His commandments.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 14:26-33
      text: At that time, Jesus said to the crowds, If anyone comes to Me and does not hate his father and mother, and wife and children, and brothers and sisters, yes, and even his own life, he cannot be My disciple. And he who does not carry his cross and follow Me, cannot be My disciple. For which of you, wishing to build a tower, does not sit down first and calculate the outlays that are necessary, whether he has the means to complete it? Lest, after he has laid the foundation and is not able to finish, all who behold begin to mock him, saying, "This man began to build and was not able to finish!" Or what king setting out to engage in battle with another king, does not sit down first and consider whether he is able with ten thousand men to meet him who with twenty thousand is coming against him? Or else, whilst the other is yet at a distance, he sends a delegation and asks the terms of peace. So, therefore, every one of you who does not renounce all that he possesses, cannot be My disciple.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 37 on the Gospels
      text: |-
        If we consider, dearly beloved brethren, what and how great are the things that are promised us in heaven, all things that are possessed on earth grow worthless in our sight. For earthly substance, compared to the felicity above, is a burden, not a help. This present life, compared to the life eternal, ought rather to be called death than life; for what else is this daily wasting away of our corruption but a certain lengthening-out of death? But what tongue can tell, or what understanding can grasp, how great are the joys of that city above -- to share the choirs of Angels, to stand with the most blessed spirits in the glory of our Maker, to behold the very Face of God, to see the light that knoweth no bound, to be touched by no fear of death, and to rejoice in the gift of everlasting incorruption? But when we hear these things our heart is kindled, and already longs to be present there, where it hopes to rejoice without end. Yet we cannot come to such great rewards, except through great labors. Whence Paul, that excellent preacher, saith: He shall not be crowned, unless he shall have striven lawfully.

        Let, then, the greatness of the rewards delight the mind, but let not the struggle of the labors deter it. Whence the Truth saith to those who come to Him: If any man come to Me and hate not his father and mother, and wife and children, and brothers and sisters, yea, and his own life also, he cannot be My disciple. But it is fitting to ask how we are commanded to hate our parents and those near to us in the flesh, we who are also bidden to love even our enemies. And indeed the Truth saith of a wife: What God hath joined together, let not man put asunder. And Paul saith: Husbands, love your wives, even as Christ also loved the Church. Behold, the disciple preaches that a wife is to be loved, while the Master says: Whoever does not hate his wife cannot be My disciple. Does the judge, then, proclaim one thing, and the herald cry another? Can we both hate and love at the same time? But if we weigh the force of the precept, we are able to do both through discernment: that we may love our wife, and those joined to us by kinship of the flesh, and those whom we know as our neighbors; and that, as for those whom we suffer as adversaries in the way of God, we may not know them, but hate and flee from them.

        For he is, as it were, loved through hatred, when the one who is carnally minded, while pressing wicked counsel upon us, is not heeded. But that the Lord might show that this hatred toward our neighbors proceeds not from ill-will but from charity, He added at once that we must also hate our own soul. It is clear, then, that he who hates his neighbor as he hates himself must hate him out of love. For then do we rightly hate our own soul, when we do not yield to its carnal desires, when we break its appetite, and resist its pleasures. That which, being held in contempt, is thereby led to something better, is, as it were, loved through hatred. So indeed ought we to show toward our neighbors this discernment of hatred: that in them we may love what they are, while hating what stands in the way of God within them.
      status: draft
