collect:
  text: |
    Let us pray.
    O Lord, we beseech thee mercifully to hear our prayers, and to stretch forth the right hand of thy power against all things that fight against us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    O Lord, we beseech thee to cast thy bright beams of light upon our mind, that we may clearly see whatsoever things Thou wouldst have us to do, and have strength to do always that which is pleasing in thy sight.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: This evil and adulterous generation seeketh after a sign; * and there shall no sign be given to it, but the sign of the Prophet Jonas.
  status: verified

magnificat-antiphon:
  text: As Jonas was three days and three nights in the whale's belly, * so shall the Son of man be three days and three nights in the heart of the earth.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matt 12:38-50
      text: 'At that time, certain of the Scribes and Pharisees answered Him, saying: Master, we would see a sign from You. But He answered and said to them, An evil and adulterous generation demands a sign, and no sign shall be given it but the sign of Jonah the prophet. For even as Jonah was in the belly of the fish three days and three nights, so will the Son of Man be three days and three nights in the heart of the earth. The men of Ninive will rise up in the judgment with this generation and will condemn it; for they repented at the preaching of Jonah, and behold, a greater than Jonah is here. The queen of the South will rise up in the judgment with this generation and will condemn it; for she came from the ends of the earth to hear the wisdom of Solomon, and behold, a greater than Solomon is here. But when the unclean spirit has gone out of a man, he roams through dry places in search of rest, and finds none. Then he says, "I will return to my house which I left"; and when he has come to it, he finds the place unoccupied, swept and decorated. Then he goes and takes with him seven other spirits more evil than himself, and they enter in and dwell there; and the last state of that man becomes worse than the first. So shall it be with this evil generation also. While He was still speaking to the crowds, His mother and His brethren were standing outside, seeking to speak to Him. And someone said to Him, Behold, Your mother and Your brethren are standing outside, seeking You. But He answered and said to him who told Him, Who is My mother and who are My brethren? And stretching forth His hand toward His disciples, He said, Behold My mother and My brethren! For whoever does the will of My Father in heaven, he is My brother and sister and mother.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop, homily on Luke 11 (on the sign of Jonah)
      text: |-
        After the condemnation of the Jewish people, the mystery of the Church is plainly declared in the figures of the repentant Ninevites, and of the Queen of the South. Like that Queen, the Church cometh from the uttermost parts of the earth, to hear the wisdom of the true Solomon, the Prince of Peace. A Queen she is, and a Queen of one indivisible realm, wrought into one body out of all nations, however diverse and distant.

        And thus cometh that great mystery of Christ and the Church, a mystery more excellent now in the fulness of truth, than in the ancient type. For there they had in Solomon only a type of that which Christ is now in His own Person. And the Church is of two classes, whereof the one knoweth not how to sin, and the other sinneth no more. To wash away sin is the work of repentance, to eschew it that of wisdom.

        Lastly, the sign of the Prophet Jonas, as it was a figure of the Lord's sufferings, was also a witness to the gravity of those sins which the Jews committed. At the same time, we see in these words of the Lord a declaration at once of His power, and of His love; for, by turning our eyes on the Ninevites, He showeth us a way of escape, while He setteth before us the horror of what will otherwise be our punishment. Even the Jews need not cease to hope for pardon, if only they would repent.
      responsory: |-
        R. Shut up alms in the breast of the poor, and it shall plead for you with the Lord. * For, as water will quench fire, so alms maketh an atonement for sins.
        V. Give alms, and, behold, all things are clean unto you.
        R. For, as water will quench fire, so alms maketh an atonement for sins.
      status: verified
