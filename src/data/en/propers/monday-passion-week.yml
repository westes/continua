collect:
  text: |
    Let us pray.
    O Lord, we beseech You, make holy our fasting, and graciously lavish upon us forgiveness for all our sins.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

benedictus-antiphon:
  text: 'In the last day, that great day of the Feast, * Jesus stood and cried, saying: If any man thirst, let Him come unto Me, and drink.'
  status: verified

magnificat-antiphon:
  text: If any man thirst, * let him come unto Me, and drink, and out of his belly shall flow living water, saith the Lord.
  status: verified
