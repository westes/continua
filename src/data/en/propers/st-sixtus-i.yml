nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Sixtus, the first of that name, a Roman by birth, of the seventh region of the City, which is called Via Lata, begotten of his father Pastor, was by the votes of the whole clergy put in the place of Alexander the First, Roman Pontiff, who had been crowned with most noble martyrdom; and he discharged that highest office with distinction and great praise nine years, ten months, and eight days, under the Emperors Hadrian and Antoninus Pius Augustus.

        He prudently established certain things pertaining to ecclesiastical discipline, namely: that the sacred vessels and furnishings not be handled by others who were not sacred ministers; that the sacred corporal, as they call it, not be made of any material other than linen; that the people sing the holy Trisagion at Mass; and that no bishop summoned to Rome be received on returning to his diocese unless he were provided with apostolic letters, which the ancients called Formatae and Canonical.

        In accordance with custom he held three ordinations in the month of December, in which he created four Bishops for various places, eleven Priests, and three Deacons. A man truly of singular holiness of life, incredible gentleness of manners, and exceptional liberality toward the poor, distinguished also by frequent miracles, he was at last crowned with illustrious martyrdom on the eighth day before the Ides of April, and was buried in the Vatican.
      status: draft
