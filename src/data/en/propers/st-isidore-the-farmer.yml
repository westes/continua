collect:
  text: |
    Let us pray.
    God of mercy, at the intercession of St. Isidore the Farmer, grant that we may not
    have feelings of pride, but may be helped by his merits and guided by his example to
    serve thee always with the humility which pleases thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. The sower went out * to sow his seed; and some fell upon good ground, and sprang up and yielded fruit a hundred-fold.
    V. The Lord guided the just in right paths.
    R. And showed him the kingdom of God.
    Let us pray.
    God of mercy, at the intercession of St. Isidore the Farmer, grant that we may not have feelings of pride, but may be helped by his merits and guided by his example to serve thee always with the humility which pleases thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Isidore, a farm labourer near Madrid, the city of Spain in which he was born, hired out to till fields for wages, and in a short time reaped for himself, in that employment, a most abundant harvest of great virtues. For, a wonderful imitator of Christ and of the saints, he never betook himself to his work in the morning without first eagerly seeking the kingdom of God and visiting the churches dedicated to the honour of God and of the Mother of God. Wherefore, when the master of the field took this delay ill, and one day waited for the labourer on a rising ground, that he might rebuke him more freely, he beheld two Angels in white garments ploughing with a double yoke of oxen, and Isidore in the midst between them. This miracle being noised abroad, he began thenceforth to be held in great honour, as well by his master as by other men.

        He burned so with charity toward the poor that he gave to the needy the wages which he earned by his labours. Indeed, when once he had brought very many poor people to the common dinner with his fellow-labourers, and, the meal being over, found nothing else kept back for himself than a portion of pottage, the man of God, relying on singular faith, so distributed it that, wonderfully increased, it sufficed to feed and satisfy them all. This also among the rest is to be wondered at: that in the summer heats, when his master asked for a drink of water to quench his thirst in the field, and it welled up nowhere, Isidore struck the ground with the goad which he carried, and drew from it an abundant spring, which flows perennially even to these times.

        Therefore, renowned for holiness, when he had come to extreme old age, he fell asleep in the Lord; and, buried in the cemetery of St. Andrew, he lay there until the citizens, divinely warned to place his body more honourably in the church, found it in the tomb so whole and so incorrupt that from it breathed a most sweet fragrance, which endures even in our own day. The sacred body, being translated into the church and set in a higher place, God made illustrious by very great miracles. Of whose beneficence not once the city of Madrid itself, and also the other places of Spain, have had experience, when his help was implored. Him at last, after almost four hundred years, illustrious for fame of holiness and for miracles, Gregory XV enrolled in the number of the saints.
      status: draft
    - nocturn: 3
      isGospel: true
      citation: John 15:1 ff.
      text: 'At that time Jesus said to his disciples: I am the true vine, and my Father is the husbandman, etc.'
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Gregory the Great (Reg., bk. 7, ep. 32; Tract. on the penitential psalms, at Ps. 6, as cited in the source)
      text: |-
        Truth itself saith: My Father is the husbandman: and every branch in me that beareth not fruit, he will take away: and every one that beareth fruit, he will purge it, that it may bring forth more fruit. For the unfruitful branch is taken away, because the sinner is utterly rooted out. But the fruitful branch is said to be purged, because by discipline it is pruned, that it may be brought to a richer grace. So the grains of corn, beaten by the threshing-sledge, are cleansed of their beards and chaff; so olives, pressed in the press, flow down into the richness of oil; so clusters of the vineyards, pressed by the feet, melt into wine.

        He that abideth in the word is not defrauded of the kingdom. For otherwise we cannot bear fruit, unless we abide in him. And therefore he saith: Abide in me, and I in you. For where must we abide but in him? Houses shall fail, palaces shall fall, cities shall be destroyed, towers shall be uprooted from their lowest foundations: but the word of the Lord abideth for ever. Let us abide, therefore, in him who abideth for ever.

        Let us not follow vanity, forsaking the truth: nor be sad as others who have no hope; but let us wait for him. And if he delay, let us wait, lest that befall us which is spoken by the Prophet: Woe to them that have lost patience. Whosoever, broken by the troubles of worldly adversity, or cast down by the assault of diabolical temptation, shall fall from the hope of the heavenly promises, will lose the reward of the patience which he had before: but he that shall endure shall carry off a great recompense.
      status: draft
