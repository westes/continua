nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Benedict, the second of that name, a Roman by birth, born of his father John, was raised to the Apostolic office after the death of Leo the Second, in the year of Christ 684, and held the supreme helm of the Christian commonwealth about nine months, most worthy indeed to hold it longer, since from the first years of boyhood he had given himself wholly to ecclesiastical ministries, and had applied diligent labour to the sacred letters and to sacred psalmody.

        He was Benedict not only in name, but also by the grace of heavenly blessing and by the example of a holy way of life, gentle, mild and humble, notable also for patience, and a most loving friend of the poor, on whom he lavished the Church's revenues with a generous hand. To restore and adorn the basilica of the Prince of the Apostles and other churches of the City he applied mind and hand, in which he piously spent many thousands of gold pieces.

        He burned with a wonderful zeal for preserving and propagating religion. He laboured with the greatest zeal to bring back to a sounder mind Macarius, Patriarch of Antioch, deposed by the sixth synod for heresy. By letters also to the bishops of Spain he admonished them to declare more openly and more soundly what they had before written on the will of God and the three substances of Christ. The Emperor Constantine so loved and honoured him that he offered him the hair of his sons, as a sign of reverence. At last he rested in a holy end, and was buried in the Vatican.
      status: draft
