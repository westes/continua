collect:
  text: |
    Let us pray.
    Lord, let the constant succour of Thine holy Martyrs Tiburtius and Susanna
    continually defend us, for Thou never failest to look in mercy upon all them
    unto whom Thou dost grant the aid of such helpers.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    Lord, let the constant succour of Thine holy Martyrs Tiburtius and Susanna
    continually defend us, for Thou never failest to look in mercy upon all them
    unto whom Thou dost grant the aid of such helpers.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Tibutrius was son to Chromatius, Praefect of the city of Rome, and was converted to Christianity by holy Sebastian. On this account he was brought before Fabian the judge, and spake boldly in his presence many things concerning belief in Christ. Then Fabian broke out in anger and caused the pavement to be spread with live coals. Now, Tiburtius, said he, thou must either sacrifice to our gods, or walk barefoot on these coals. Tiburtius armed himself with the sign of the Cross and walked boldly on the coals. Learn from this, said he, that there is no God but He whom the Christians worship; for the coals are to me like flowers. For this he was credited with art magic, led forth without the city and smitten with the sword at the third milestone on the Lavican Road, where he was buried by the Christians. On the same day, the noble maiden Susanna, having refused the offer of marriage of Galerius Maximianus, son to the Emperor Diocletian, because she had made a vow of her virginity to God, after diverse torments wherewith her holy resolution was tried, was smitten with the sword, in her own house, by order of the Emperor, and passed to heaven to receive the double reward of virginity and martyrdom.
      status: verified
