magnificat-antiphon:
  text: O how blessed a Bishop was he! * All his bowels yearned on the King Christ, and he had no dread for the power of the Empire! O how holy a soul was his, which passed not away by the sword of the persecutor, and yet lost not the palm of martyrdom.
  status: verified

