nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Martin was born at Sabaria in Pannonia. When he was ten years old he went to the Church, in the spite of his heathen father and mother, and by his own will was numbered among the Catechumens. At fifteen years of age he joined the army, and served as a soldier first under Constantius and then under Julian. Once at the gate of Amiens a poor man asked him for an alms for Christ's name's sake, and since he had nothing to his hand but his arms and his clothes, he gave him half of his cloak. In the night following Christ appeared to him clad in the half of his cloak, and saying (to the angels who bare Him company): While Martin is yet a Catechumen, he hath clad Me in this garment.

        At eighteen years of age he was baptized. He gave up thereupon the life of a soldier, and betook himself to Hilary, Bishop of Poietiers, by whom he was placed in the order of Acolytes. Being afterwards made Bishop of Tours, he built a monastery wherein he lived in holiness for a while in company of four-score monks. At the last he fell sick of a grievous fever at Cande, a village in his diocese, and besought God in constant prayer to set him free from the prison of this dying body. His disciples heard him and said: Father, why wilt thou go away from us? unto whom wilt thou bequeath us in our sorrow? Their words moved Martin, and he said: Lord, if I be still needful to thy people, I refuse not to work.

        When his disciples saw him, in the height of the fever, lying upon his back and praying, they entreated him to turn over and take a little rest upon his side while the violence of his sickness would allow him. But Martin answered them: Suffer me to look heavenward rather than earthward, that my spirit may see the way whereby it is so soon going to the Lord. At the moment of death he saw the enemy of mankind, and cried out: What are you come here for, you bloody brute? You murderer, you'll find nothing in me. With these words on his lips, he gave up his soul to God, being aged eighty years. He was received by a company of Angels, who were heard praising God by many persons, especially by holy Severinus, Bishop of Cologne.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 11:33-36
      text: At that time, Jesus said to His disciples, "No one lights a lamp and puts it in a cellar or even under the measure, but upon the lamp-stand, that they who enter in may see the light. The lamp of your body is your eye. If your eye be sound, your whole body will be full of light. But if it be evil, your body also will be full of darkness. Take care, therefore, that the light that is in you is not darkness. If, then, your whole body is full of light, having no part in darkness, it will all be illumined, as when a bright lamp illumines you."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Bk. 7 (on Luke 11:33-36)
      text: |-
        In that which goeth before, Christ hath set the Church before the synagogue, and He exhorteth us rather to trust in the Church. The candle is faith, even as it is written: thy word is a lamp unto my feet, and a light unto my path. Our faith is the word of God. The word of God is light. Faith is the candle. It is written concerning the Word of God, that That was the true Light, Which lighteth every man that cometh into this world. But a candle cannot shine, unless it be lighted from some other fire.

        Also it is written: What woman, having ten pieces of silver, if she lose one piece, doth not light a candle, and sweep the house, and seek diligently till she find it? And here the candle lighted to find the lost piece is the strength in our understandings and affections. Let no man therefore seek faith under the law. For the law is by measure, but grace without measure; the law overshadoweth, but grace enlighteneth. And therefore let no man shut up his faith within the measure of the law, but give it unto the Church, wherein shineth the sevenfold grace of the Spirit, and whereon the Divine glory of the Great High Priest doth strike from heaven, lest the shadow of the law should rest any more at all upon her. Under the old law there was the sevenfold lamp which the Priest of the Jews lighted every morning and every evening, and this was as it were a candle put under a bushel. That Jerusalem which is upon earth, that Jerusalem which killed the Prophets, lieth hid, as it were, in a dark place in the valley of tears. But that Jerusalem which is in heaven, whereof by faith we are soldiers, is a city set upon the highest of all mountains, even upon Christ. Her the darkness and tempests of earth cannot hide, but she blazeth with the glory of the Eternal Sun, and maketh to fall upon us the light of spiritual grace.
      status: verified
