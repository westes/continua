nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, City of God, Book 18, ch. 45
      text: |-
        The Jewish nation no doubt became worse after it ceased to have prophets, just at the very time when, on the rebuilding of the temple after the captivity in Babylon, it hoped to become better. For so, indeed, did that carnal people understand what was foretold by Haggai the prophet, saying, The glory of this latter house shall be greater than that of the former. Now, that this is said of the new testament, he showed a little above, where he says, evidently promising Christ, And I will move all nations, and the desired One shall come to all nations.

        For by such chosen ones of the nations there is built, through the new testament, with living stones, a house of God far more glorious than that temple was which was constructed by king Solomon, and rebuilt after the captivity. For this reason, then, that nation had no prophets from that time, but was afflicted with many plagues by kings of alien race, and by the Romans themselves, lest they should fancy that this prophecy of Haggai was fulfilled by that rebuilding of the temple. For not long after, on the arrival of Alexander, it was subdued, when, although there was no pillaging, because they dared not resist him, and thus, being very easily subdued, received him peaceably, yet the glory of that house was not so great as it was when under the free power of their own kings.

        Then Ptolemy son of Lagus, after Alexander's death, carried them captive into Egypt. His successor, Ptolemy Philadelphus, most benevolently dismissed them; and by him it was brought about that we should have the Septuagint version of the Scriptures. Then they were crushed by the wars which are explained in the books of the Maccabees. Afterward they were taken captive by Ptolemy king of Alexandria, who was called Epiphanes. Then Antiochus king of Syria compelled them by many and most grievous evils to worship idols, and filled the temple itself with the sacrilegious superstitions of the Gentiles. Yet their most vigorous leader Judas, who is also called Maccabæus, after beating the generals of Antiochus, cleansed it from all that defilement of idolatry.
      responsory: |-
        R. Be ye not afraid of the assault of the enemy; remember how our fathers were delivered. * Now, therefore, let us cry unto heaven, and our God will have mercy upon us.
        V. Remember His marvellous works that He hath done unto Pharaoh and his host in the Red Sea.
        R. Now, therefore, let us cry unto heaven, and our God will have mercy upon us.
      status: verified
