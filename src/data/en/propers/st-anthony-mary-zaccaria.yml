collect:
  text: |
    Let us pray.
    Make us able, O Lord God, in the Spirit of Thy blessed Apostle Paul, to know the
    love of Christ which passeth knowledge, wherein Thy blessed servant Anthony Mary
    was so wonderfully taught when he gathered together in thy Church new households
    of clerks and of virgins.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee,
    in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    Make us able, O Lord God, in the Spirit of Thy blessed Apostle Paul, to know the
    love of Christ which passeth knowledge, wherein Thy blessed servant Anthony Mary
    was so wonderfully taught when he gathered together in thy Church new households
    of clerks and of virgins.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee,
    in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

nocturn-readings:
