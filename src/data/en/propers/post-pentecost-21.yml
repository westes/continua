collect:
  text: |
    Let us pray.
    O Lord, we beseech thee to keep thine household in continual godliness, that, through thy protection, it may be free from all adversities, and devoutly given to serve thee in good works, to the glory of thy Name.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'The lord said unto his servant: Pay me * that thou owest. But the servant fell down and besought him, saying: Have patience with me, and I will pay thee all.'
  status: verified

magnificat-antiphon:
  text: O thou wicked servant, I forgave thee all that debt, * because thou desiredst me. Shouldest not thou also have had compassion on thy fellow-servant, even as I had pity on thee, alleluia.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 18:23-35
      text: 'At that time, Jesus spoke to His disciples this parable: The kingdom of heaven is likened to a king who desired to settle accounts with his servants. And when he had begun the settlement, one was brought to him who owed him ten thousand talents. And as he had no means of paying, his master ordered him to be sold, with his wife and children and all that he had, and payment to be made. But the servant fell down and besought him, saying, ‘Have patience with me and I will pay you all!’ And moved with compassion, the master of that servant released him, and forgave him the debt. But as that servant went out, he met one of his fellow-servants who owed him a hundred denarii and he laid hold of him, and throttled him, saying, ‘Pay what you owe.’ His fellow-servant therefore fell down and began to entreat him, saying, ‘Have patience with me and I will pay you all.’ But he would not; but went away and cast him into prison until he should pay what was due. His fellow-servants therefore, seeing what had happened, were very much saddened, and they went and informed their master of what had taken place. Then his master called him, and said to him, ‘Wicked servant! I forgave you all the debt, because you entreated me. Should not you also have had pity on your fellow-servant, even as I had pity on you?’ And his master, being angry, handed him over to the torturers until he should pay all that was due to him. So also My heavenly Father will do to you, if you do not each forgive your brothers from your hearts.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Book 3, Commentary on Matthew 18
      text: |-
        It is a way much in use with the Syrians, and especially with the inhabitants of Palestine, to illustrate their discourse with parables, that what their hearers may not be able to catch so easily when spoken plainly, they may lay hold on by dint of comparisons and examples. Thus it was that the Lord, by an allegory about a Royal master and a servant who owed him ten thousand talents, and who obtained by entreaty forgiveness of the debt, taught Peter how it was his duty to forgive his fellow-servants their comparatively trifling offences. For if that Royal master so readily forgave his servant his debt of ten thousand talents, should not his servants much more forgive lesser debts unto their fellows?

        Let put this more clearly, let us take a case. If one of us were to commit adultery, or murder, or sacrilege, our sin, great like a debt of ten thousand talents, would be forgiven us in answer to prayer, if we also from our heart forgive our brethren their trespasses against us. But if we refuse to forgive a slight, and keep up unceasing enmity because of an unkind word, how just doth it appear that we should be cast into prison, and entail on ourselves, by the example of our own deeds, that our great debt should not be forgiven unto us.

        "So likewise shall My heavenly Father do also unto you, if ye from your hearts forgive not every one his brother their trespasses." God's awful purpose can be turned and changed but if we will not forgive unto our brethren small things, God will not forgive us great things. And if we forgive them, it must be from our hearts. Any one can say: I have nothing against such-an-one he knoweth what he hath done, and God will judge him for it I do not care what he doeth I have forgiven him. But the Lord maketh His sentence clear, and destroyeth such a mockery of peace as this, where He saith: "So likewise shall My heavenly Father do also unto you, if ye from your hearts forgive not every one his brother their trespasses."
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
