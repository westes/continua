nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Eustace, who was also called Placidus, was distinguished among the Romans by birth, wealth, and military glory, and under the Emperor Trajan earned the title of Master of the Soldiers. One day, while he was engaged in hunting and pursuing a stag of wondrous size as it fled, he suddenly saw, standing between the beast's antlers, a lofty and shining image of Christ the Lord hanging upon the cross. Called by its voice to the pursuit of everlasting life, he enrolled himself in the Christian army, together with his wife Theopista and his two young sons, Agapitus and Theopistus.

        Soon after, returning to the place of his first vision, as the Lord had commanded him, he heard Him foretell how much he would afterward have to endure for His glory. And so, enduring incredible calamities with wondrous patience, he was in a short time reduced to the depths of poverty. Being forced to withdraw secretly, he mourned along the way first the loss of his wife, and then, most pitifully, of his children as well, torn from him. Wrapped in such great afflictions, he lived hidden for a long time in a distant region, working as a farm steward, until, comforted by a voice from heaven and sought out again by Trajan on a new occasion, he was once more placed in command of an army.

        On that campaign, having unexpectedly recovered his wife and children together, he returned victorious to the City amid the great rejoicing of all. But shortly afterward, when he was ordered to sacrifice to false gods for the victory he had won, he most steadfastly refused. And when he was tried in vain by various devices to make him renounce the faith of Christ, he was thrown to the lions together with his wife and children. The emperor, provoked by the lions' gentleness toward them, ordered them to be shut up in a bronze bull heated red-hot by fire placed beneath it, where, their martyrdom completed amid divine praises, they flew away to everlasting happiness on the twelfth day before the Kalends of October. Their bodies, found unharmed, were reverently buried by the faithful, and afterward honorably translated to a church built in their name.
      status: verified
