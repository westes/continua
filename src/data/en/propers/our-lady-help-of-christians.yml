collect:
  text: |
    Let us pray.
    Almighty and merciful God, who for the defence of the Christian people hast wonderfully appointed perpetual help in the most blessed Virgin Mary: mercifully grant that, fortified by such protection, we who strive in life may be able to obtain victory over the malignant enemy in death.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. To thee, O holy Mother of God, have we cried, and through thee the Lord's help hath come to us.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    Almighty and merciful God, who for the defence of the Christian people hast wonderfully appointed perpetual help in the most blessed Virgin Mary: mercifully grant that, fortified by such protection, we who strive in life may be able to obtain victory over the malignant enemy in death.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    Often, when the people of Christ was pressed by the bloody arms of a hostile foe, the loving Virgin came to their aid, gliding down from the clear sky.

    So the ancient records of the Fathers tell, and the temples bear witness, bright with rich spoils, and the feasts renewed each year with votive worship.

    Behold, let us be allowed to render thanks to Mary in a new canticle with joyful measures, for new gifts, while the applause of City and World resounds.

    O happy day, to be remembered in the calendar, on which the See of Peter received back, after a sad five years, by a blessed lot, the teacher of the faith, returned!

    Chaste virgins and pure boys, exulting clergy, and people, let them vie with grateful heart to celebrate the gifts of the Queen of heaven.

    Virgin of virgins, blessed Mother of Jesus, increase these blessings; grant, we pray, that the Shepherd Pius may lead his flock to the pastures of salvation.

    Through eternal years let us venerate thee, O Trinity, to be celebrated with highest praise: let our minds praise thee with faith, and our tongues with resounding song. Amen.
  status: draft

lauds-hymn:
  text: |
    Thee we call the Mother of our Redeemer and Lord, beautiful Virgin, the glory and relief of Christians in their straits.

    Though the gates of hell rage, and the ancient enemy rave, and stir up threatening angers to lay waste God's holy host,

    the fierce furies can do no harm to chaste minds, which the Virgin, called upon in prayer, nods assent to, cherishes, and strengthens with strength from on high.

    If so great a Patroness favour us, the tumult of the crime of war ceases; a thousand troops are laid low or flee, a thousand cohorts.

    As a holy tower lifts its head on Sion, a citadel built with a firm wall, the city of David, safe with shields and a keen soldiery,

    so the Virgin, strong right hand of the Lord's might, heaped with the gifts of heaven, drives far from her pious servants the blows of the demon.

    Through eternal years let us venerate thee, O Trinity, to be celebrated with highest praise: let our minds praise thee with faith, and our tongues with resounding song. Amen.
  status: draft

