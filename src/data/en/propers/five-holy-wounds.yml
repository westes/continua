matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 10
        antiphon: Who is this * that cometh from Edom, with dyed garments from Bosra?
      - psalms:
          - 14
        antiphon: Why then * is thy apparel red, and thy garments like theirs that tread in the winepress?
      - psalms:
          - 23
        antiphon: I have trodden * the winepress alone, and of the Gentiles there is not a man with me.
    versicle:
      v: They have dug my hands and feet.
      r: They have numbered all my bones.
  nocturn2:
    groups:
      - psalms:
          - 21
        antiphon: They have dug * my hands and feet; they have numbered all my bones.
      - psalms:
          - 65
        antiphon: From the sole of the foot * unto the top of the head there is no soundness therein.
      - psalms:
          - 75
        antiphon: Wound, * and bruise, and swelling sore, is not bound up, nor dressed with medicine, nor fomented with oil.
    versicle:
      v: Surely he hath borne our infirmities.
      r: And carried our sorrows.
  nocturn3:
    groups:
      - psalms:
          - 95
        antiphon: What are these wounds in the midst of thy hands?
      - psalms:
          - 96
        antiphon: With these I was wounded in the house of them that loved me.
      - psalms:
          - 97
        antiphon: My speech is in bitterness, and the hand of my scourge is heavier than my groaning.
    versicle:
      v: He was wounded for our iniquities.
      r: He was bruised for our sins.

