nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard of Clairvaux, On the Passion of the Lord
      text: |
        Jesus, then, our most gentle Saviour, having been seized after very many mockeries both of Jews and of Gentiles, after many sheddings of blood, is pierced through hands and feet with merciless nails, and is fastened to the wood of the cross. Behold and consider the rose of the bloody passion, how it reddens as a sign of most ardent charity. Passion and charity contend: the one, that it may burn the more; the other, that it may redden the more.

        See how our best vine has flowered with this flower of the rose, Jesus all red. Look over the whole body, whether anywhere you do not find the flower of the bloody rose. Look at one hand and the other: do you not find the flower of the rose in each? Look at one foot and the other: are they not rosy? Look at the opening of the side, for that too lacks not the rose, though it is somewhat reddish because of the mixture of water; for, as the Evangelist relates, when one of the soldiers had pierced his side with a lance, there came out blood and water.

        Look down, O Lord, holy Father, from thy sanctuary and from the high dwelling-place of the heavens, and behold this most holy victim, which our great high priest, thy holy child the Lord Jesus, offers to thee for the sins of his brethren; and be appeased over the multitude of our malice. Know, Father, the coat of thy son Joseph. Alas! an evil beast hath devoured him, and trampled his garment in its fury: behold, it hath left in it five lamentable rents.
      responsory: |
        R. We see Jesus, for the suffering of death, crowned with glory and honour, * That he might taste death for all.
        V. It became him, who had brought many sons into glory, to consummate the author of their salvation by his passion.
        R. That he might taste death for all.
      status: draft
    - nocturn: 3
      isGospel: true
      citation: John 19:28-35
      text: 'At that time: Jesus, knowing that all things were now accomplished, that the scripture might be fulfilled, said: I thirst. Now there was a vessel set there full of vinegar. And they, putting a sponge full of vinegar about hyssop, put it to his mouth. Jesus therefore, when he had taken the vinegar, said: It is consummated. And bowing his head, he gave up the ghost. Then the Jews (because it was the Parasceve), that the bodies might not remain upon the cross on the sabbath day (for that was a great sabbath day), besought Pilate that their legs might be broken, and that they might be taken away. The soldiers therefore came; and they broke the legs of the first, and of the other that was crucified with him. But after they were come to Jesus, when they saw that he was already dead, they did not break his legs; but one of the soldiers with a spear opened his side, and immediately there came out blood and water. And he that saw it hath given testimony: and his testimony is true.'
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Cyril of Alexandria, Commentary on John, Bk. 12
      text: |
        When all impiety against Christ had been fulfilled by the savage Jews, and nothing was left of the utmost cruelty, at last the most holy flesh of Christ again suffers something proper and natural to it. For, dried up by many and various sorrows, it is tormented by thirst. Grave pains indeed have great power to stir up thirst, consuming the moisture with a certain natural and inexplicable heat, and burning the vitals with fiery ardours.

        He says that the measure of Jewish impiety was fulfilled, and their spirit powerless to rage further. For what did the Jews leave untried, or what extreme of cruelty did they not employ? What kind of punishment or insult did they leave out? Wherefore he rightly says, It is consummated: but the hour now inviting him to preach to the spirits who were in hell (for he came to be Lord of the dead and of the living), he took upon himself death itself for us, and bore in his flesh this common suffering of our nature.
      responsory: |
        R. Thou art worthy, O Lord, to take the book, and to open the seals thereof, because thou wast slain, and hast redeemed us to God * In thy blood.
        V. And hast made us to our God a kingdom and priests.
        R. In thy blood.
      status: draft
