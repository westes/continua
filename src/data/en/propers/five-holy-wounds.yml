collect:
  text: |
    Let us pray.
    O God, who, by the passion of thine only-begotten Son, and by the shedding of his blood through his five Wounds, hast restored human nature lost by sin: grant us, we beseech thee, that we who on earth venerate the Wounds he received may deserve in heaven to obtain the fruit of that same most precious blood.
    Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    Sing, my tongue, the glorious battle
    Sing the last, the dread affray;
    O'er the cross, the victor's trophy,
    Sound the high triumphal lay:
    Tell how Christ, the world's Redeemer,
    As a victim won the day.

    God, his Maker, sorely grieving
    That the first-made Adam fell,
    When he ate the fruit of sorrow,
    Whose reward was death and hell,
    Noted then this wood, the ruin
    Of the ancient wood to quell.

    For the work of our salvation
    Needs would have his order so,
    And the multiform deceiver's
    Art by art would overthrow,
    And from thence would bring the med'cine
    Whence the insult of the foe.

    Wherefore, when the sacred fullness
    Of the appointed time was come,
    This world's Maker left his Father,
    Sent the heav'nly mansion from,
    And proceeded, God Incarnate,
    Of the Virgin's holy womb.

    Weeps the infant in the manger
    That in Bethlehem's stable stands;
    And his limbs the Virgin Mother
    Doth compose in swaddling bands,
    Meetly thus in linen folding
    Of her God the feet and hands.

    To the Trinity be glory
    Everlasting, as is meet;
    Equal to the Father, equal
    To the Son, and Paraclete:
    Trinal Unity, whose praises
    All created things repeat. Amen.
  status: verified

matins-invitatory:
  text: Christ nailed to the cross and wounded with five wounds, * O come, let us adore.
  status: draft

lauds-capitulum:
  text: 'Christ was wounded for our iniquities, he was bruised for our sins: by his bruises we are healed.'
  citation: Isaiah 53:5
  status: draft

lauds-hymn:
  text: |
    Thirty years among us dwelling,
    His appointed time fulfilled,
    Born for this, he meets his passion,
    For that this he freely willed:
    On the cross the Lamb is lifted,
    Where his life-blood shall be spilled.

    He endured the nails, the spitting,
    Vinegar, and spear, and reed;
    From that holy body broken
    Blood and water forth proceed:
    Earth, and stars, and sky, and ocean,
    By that flood from stain are free.

    Faithful cross! above all other,
    One and only noble tree!
    None in foliage, none in blossom,
    None in fruit thy peers may be;
    Sweetest wood and sweetest iron!
    Sweetest weight is hung on thee.

    Bend thy boughs, O tree of glory!
    Thy relaxing sinews bend;
    For awhile the ancient rigour,
    That thy birth bestowed, suspend;
    And the King of heavenly beauty
    On thy bosom gently tend!

    Thou alone wast counted worthy
    This world's ransom to uphold;
    For a shipwrecked race preparing
    Harbour, like the ark of old;
    With the sacred blood anointed
    From the smitten Lamb that rolled.

    * To the Trinity be glory
    Everlasting, as is meet;
    Equal to the Father, equal
    To the Son, and Paraclete:
    Trinal Unity, whose praises
    All created things repeat.
    Amen.
  status: verified

lauds-versicle:
  text: |
    V. They shall look on him whom they pierced.
    R. And they shall mourn for him, as in the death of the firstborn.
  status: draft

prime-chapter/responsory-~:
  text: |
    R.br. Christ, Son of the living God, * have mercy on us.
    R. Christ, Son of the living God, * have mercy on us.
    V. Thou who wast wounded for us.
    R. Have mercy on us.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Christ, Son of the living God, * have mercy on us.
  status: draft

prime-lectio:
  text: 'Christ delivered his soul unto death, and was reputed with the wicked: and he bore the sins of many, and prayed for the transgressors.'
  citation: Isaiah 53:12
  status: draft

terce-capitulum:
  text: |
    Christ was wounded for our iniquities, he was bruised for our sins: by his bruises we are healed.
    R. Thanks be to God.
    V. O all ye that pass by the way.
    R. Attend, and see my sorrow.
  citation: Isaiah 53:5
  status: draft

sext-capitulum:
  text: |
    I have not turned away my face from them that rebuked me and spit upon me. The Lord God is my helper, therefore am I not confounded.
    R. Thanks be to God.
    V. The chastisement of our peace was upon him.
    R. And by his bruises we are healed.
  citation: Isaiah 50:6-7
  status: draft

none-capitulum:
  text: |
    Christ delivered his soul unto death, and was reputed with the wicked: and he bore the sins of many, and prayed for the transgressors.
    R. Thanks be to God.
    V. He was offered because it was his own will.
    R. And by his bruises we are healed.
  citation: Isaiah 53:12
  status: draft

