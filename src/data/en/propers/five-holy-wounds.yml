magnificat-antiphon:
  text: 'I am your redemption: my hands, which made you, were fastened with nails; for you I was scourged, for you crowned with thorns; hanging, I asked for water, and they gave vinegar; for my food they gave me gall, and a lance into my side; dead and buried, I rose again; I am with you, and I live for ever.'
  status: draft

