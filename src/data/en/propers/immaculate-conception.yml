nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, Sermon on the Assumption
      text: |-
        Who and what was the blessed and glorious Mary, always a Virgin, hath been revealed by God by the message of an Angel, in these words: Hail, thou that art full of grace, the Lord is with thee blessed art thou among women. It was fitting that a fullness of grace should be poured into that Virgin who hath given to God glory and to man a Saviour, who hath brought peace to earth, who hath given faith to the Gentiles, who hath killed sin, who hath given law to life, who hath made the crooked ways straight. Verily, she is full of grace. To others grace cometh measure by measure; in Mary grace dwelleth at once in all fullness. Verily, she is full of grace. We believe that the holy Fathers and Prophets had grace; but they were not full of grace. But into Mary came a fullness of all the grace which is in Christ, albeit otherwise than as it is in Him. Therefore is it said: Blessed art thou among women, that is, Blessed art thou above all women. The fulness of blessing in Mary utterly neutralized in her any effects of the curse of Eve. In her praise Solomon writeth in the Song of Songs: Rise up, my dove, my fair one, for the winter is past, the rain is over and gone. And again: Come from Lebanon, my Spouse, come, thou shalt be crowned.

        Not unjustly then is she bidden to come from Lebanon, for Lebanon is so named on account of its stainless and glistening whiteness. The earthly Lebanon is white with snow, but the lonely heights of Mary's holiness are white with purity and grace, brilliantly fair, whiter far than snow, sparkling with the gifts of the Holy Ghost she is undefiled like a dove, all clean, all upright, full of grace and truth. She is full of mercy, and of the righteousness that hath looked down from heaven, and therefore is she without stain because in her hath never been any corruption. She hath compassed a man in her womb, saith holy Jeremiah, but she conceived not by the will of fallen man. The Lord, saith the Prophet, hath created a new thing in the earth; a woman shall compass a man. Verily, it is a new thing. Verily, it was a new work of power, greater than all other works, when God, Whom the world cannot bear, and Whom no man shall see and live, entered the lodging of her womb, breaking not the blissful cloister of her virgin flesh. And in her body He was borne, the Infinite inclosed within her womb. And from her womb He came forth, so that it was fulfilled which was spoken of the Prophet Ezekiel, saying: This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the Lord, the God of Israel, hath entered in by it, therefore it shall be shut. Hence also in the Song of Songs it is said of her: A garden enclosed is my sister, my spouse, a garden enclosed, a fountain sealed, thy perfumes are a garden of delights. Verily a garden of delights, filled with the perfumes of all flowers, rich with the sweet savour of grace. And the most holy Virgin herself is a garden enclosed, whereinto sin and Satan have never entered to sully the blossoms, a fountain sealed, sealed with the seal of the Trinity.
      status: verified
    - nocturn: 2
      isGospel: false
      source: Acts of Pope Pius IX (defining the dogma, 1854)
      text: The fact that the Virgin Mother of God had at the moment of her conception triumphed over the foul enemy of man, hath ever been borne out by the Holy Scriptures, by the venerable tradition of the Church, and by her unceasing belief, as well as by the common conviction of all Bishops and faithful Catholics, and by marked acts and constitutions of the Holy See. At length the Supreme Pontiff Pius IX, in compliance with the wishes of the Universal Church, determined to publish it as a truth of faith, on his own absolute and unerring authority, and accordingly, on the 8th day of December, 1854, in the Vatican Basilica, in presence of a great multitude composed of the Fathers Cardinals of the Holy Roman Church, and Bishops from all parts of the earth, he, with the consent and jubilation of the whole world, declared and defined as follows That doctrine which declareth that the most Blessed Virgin Mary was in the first instant of her Conception preserved, by a special privilege granted unto her by God, from any stain of original sin, is a doctrine taught and revealed by God, and therefore is to be held by all faithful Christians firmly and constantly.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 1:26-28
      text: At that time, the angel Gabriel was sent from God to a town of Galilee called Nazareth, to a virgin betrothed to a man named Joseph, of the house of David, and the virgin's name was Mary. And when the angel came to her, he said, "Hail, full of grace, the Lord is with you. Blessed are you among women."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Germain of Constantinople, Homily on the Presentation of the Blessed Virgin
      text: |-
        Hail, Mary, full of grace, holier than the Saints, higher than the heavens, more glorious than the Cherubim, more honourable than the Seraphim, and the most worshipful thing that the hands of God have made. Hail, O dove, bearing in thy beak the olive-branch of peace that telleth us of salvation from the spiritual flood, dove, blessed omen of a safe harbour, whose wings are of silver, and thy feathers of gold, shining in the bright beams of the Most Holy and Light-giving Spirit. Hail, thou living garden of Eden, planted towards the East by the right hand of the Most Merciful and Mighty God, wherein do grow to His glory rich lilies and unfading roses, for the healing of them that have drunk in death from the blighting and pestilential breezes of the bitter West; Eden, wherein hath sprung that Tree of life, Whereof if any man eat he shall live for ever. Hail, stately Palace of the King, most holy, stainless, purest, House of the Most High God, adorned with His Royal splendour, open to all, filled with Kingly dainties; Palace wherein is that spiritual bridal chamber, not made with hands, nor hung with diverse colours, in the which the Eternal Word, when He would raise up fallen man, wedded flesh unto Himself, that He might reconcile unto the Father them who had cast themselves away.

        Hail, O rich and shady Mountain of God, whereon pastured the True Lamb, Who hath taken away our sins and infirmities, mountain, whereout hath been cut without hands that Stone which hath smitten the altars of the idols, and become the head-stone of the corner, marvellous in our eyes. Hail, thou holy Throne of God, thou divinest store-house, thou temple of glory, thou bright crown, thou chosen treasure, thou mercy-seat for the whole world, thou heaven declaring the glory of God. Hail, thou vessel of pure gold, made to hold the manna that came down from heaven, the sweet food of our souls, even Christ. Hail, O purest Virgin, most praiseworthy and most worshipful, hallowed treasury for the wants of all creatures; thou art the untitled earth, the unploughed field; thou art the vine full of flowers, the well overflowing with waters, Maiden and Mother; thou art the Mother that knew not a man, the hidden treasure of guilelessness, and the clear, bright star of holiness; by thy most acceptable prayers, strong from thy motherly mouth, obtain for all estates of men in the Church that they may continually tend unto Him Who is the Lord, and God, and Maker of thee, and of them, and of all, but of thee the Son also, conceived without man's intervention; obtain this, O Mother, pilot them to the harbour of peace.

        Be it thine to clothe God's priests with righteousness, and to make them shout aloud for joy in approved and stainless, and upright and glorious faith. thine be it to guide in peace the sceptres of orthodox princes, even of princes who put their trust in thee to be the crown of their Majesty, and the Royal Robe of their greatness, and the firm foundation of their dominion, more than in purple, or fine gold, or pearls, or precious stones; thine be it to put under their feet the unfaithful nations, nations that blaspheme thee, and the God That was born of thee; thine be it to keep in meek obedience the people that are under them, according to the commandment of God. Behold, this is thine own city, which hath thee for her towers and her foundations, crown her with victory, gird the house of God with strength, keep undefiled the loveliness of His tabernacles, as for them that praise thy name, be thou their deliverer from strife and bitterness of spirit. Free thou the prisoner, protect the wanderer, and if there be any that hath no refuge, be thou to him a consolation. Stretch forth thine hand and help the whole earth so shall we year by year keep this and all thy feasts, and at last be found with thee in Christ Jesus, Who is Lord of all, and verily our God. To Him, with the Holy Father, Who is the Fountain of Life, and the coeternal Spirit, Three Persons and One Substance, even as there is one Kingdom, be glory and strength, now and for ever. Amen.
      status: verified

octave-readings/~-octave-day-2:
  source: From the Dogmatic Bull of Pope Pius IX; Homily of St. Sophronius, Bishop
  text: |
    God is unspeakable. His ways are mercy and truth; His Will is Almighty Power; and His wisdom reacheth mightily from one end to another, and sweetly ordereth all things. He from all eternity foresaw the sorrowful fall of man by the transgression of Adam, and, in His mysterious purpose, He decreed, before the worlds were, that the Word should be made flesh, to the end that man, who had been seduced by the fraud of the devil, might not perish, but that as in the first Adam all die, in Christ all might be made alive. And to this end, the Eternal Creator from the beginning, and before all ages, chose and ordained a woman to be the Mother of His Only-begotten Son, of whom He should take flesh and be born, in the blessed fulness of time. And this woman He loved with so great a love that He allowed His Will to be freely wrought in her.

    Therefore, He bestowed upon her, out of the treasure of the Divinity, such a wealth of gifts of grace as He hath bestowed upon none of the Angels and none of the Saints. He made her always free from any the slightest pollution of sin, so fair and so upright that no other of His works are like to her, and only Himself can we understand to excel her. Verily, this was most fitting, that this most worshipful Mother should be made bright with the brightness of uncontaminated holiness, and should conquer the old serpent by escaping altogether the stain of original sin, for she was that Mother to whom the Eternal Father was willing to give the Co-Eternal and Co-Equal Only-begotten Son of His love, to be her Son also.

    The Catholic Church, which, through the perpetual teaching of the Holy Ghost, is the pillar and ground of the truth, hath always held the original innocence of this most exalted Virgin to be bound up with her wonderful holiness, and her mighty dignity of Mother of God. This doctrine she hath felt herself to hold by the gift of God, and as part of that faith once delivered from heaven unto the Saints, and as time hath gone on, she hath continually explained, put forth, and upheld it. This belief is found strong in the earliest times, and rooted as it were in the hearts of Christ's faithful people; by the care and study of holy Bishops it hath been taught in all parts of the Catholic world; and the Church herself pointed to it when she allowed the Conception of the Blessed Virgin Mary to be held as a feast, for exciting the piety and devotion of her children.

    When this blessed Angel was sent to the most pure virgin what did he say? In what words did he break the happy news of Redemption? Hail, thou that art full of grace, the Lord is with thee. The messenger of joy in his first word biddeth her rejoice. He knew well that his message was a message of good tidings of great joy to men, yea, to all creatures, a message of healing to all sicknesses. He knew well that his message was a message of God's light to a dark world. He knew well that it proclaimed the end of error. He knew well that it blunted the sting of death. He knew well that it broke the power of corruption. He knew well that it brought victory over hell. He knew well that it told of salvation to all the fallen children of Adam, groaning under that yoke of malediction which fell on them when they were thrust out of Eden, and banished from that happy home.

    And, of a truth, it was fitting that God's proclamation of joy should open with the accents of gladness. Rejoice, O mother of joy more than heavenly! Rejoice, O thou that nourishest joy in the highest! Rejoice, O Lady, full of the joy of salvation! Rejoice, O thou that bringest a joy that passeth not away! Rejoice, O mysterious treasury dispensing unspeakable joy! Rejoice, O most blessed fountain, overflowing with unfailing joy! Rejoice, O store-house of God, filled with the everlasting joy of eternity! Rejoice, O fair tree, bearing fruit of life-giving joy! Rejoice, O Maiden Mother of God! Rejoice, O thou that after child-birth remainest a virgin!

    Who shall worthily set forth thy glory? Who shall make bold to say what thou art? Thou art the exaltation of humanity; thou art made much higher than the Angels; thy brightness hath thrown the brightness of the Archangels into shadow; thou lookest down upon the lofty seats of the Thrones; thou makest the height of the Lordships to seem low; thy rank taketh precedence before the rank of the Principalities; compared with thee the Powers are weakness; thou art a Mighty one mightier than all the Mighty; thine earthly eyes see further than the contemplation of the Cherubim can reach; the Seraphim have six wings, but thy flight is nobler than theirs; in a word, thou hast far excelled every other work of God; thou wast far purer than any other creature; and thou hast conceived the Creator of all creatures, carried Him in thy womb, and brought Him forth; thou hast been chosen, out of all that He has made, to be His mother.
  responsory: |
    R. By one man sin entered into the world, in whom all have sinned. * Fear not, Mary, for thou hast found grace with God. V. The Lord hath delivered thy soul from death, yea, the Lord was thy stay. R. Fear not, Mary, for thou hast found grace with God.
  status: verified

octave-readings/~-octave-day-3:
  source: From the Dogmatic Bull of Pope Pius IX; Homily of St. Bernard, Abbot
  text: |
    Both in her Offices and in the most holy Liturgy the Church hath been accustomed to apply to the creation of Mary the language in which the Holy Scriptures set forth the Eternal Generation of the Uncreated Wisdom, and that, because Mary was predestined in the decree of the Incarnation of the same Wisdom. This practice hath been received by the faithful in all quarters, and plainly showeth what hath been the mind of the Church of Rome, which is the mother and mistress of all Churches, on the subject of the sinless conception of the Virgin. Nevertheless, it is fitting to set forth in greater detail the celebrated acts of this Church, on account of that pre-eminent rank and power which all other Churches are bound to yield her, because she is the centre of Catholic truth and unity, wherein alone Doctrine is always preserved pure, and from whom all the other Churches must needs receive the tradition of the Faith.

    Thus it hath always been one of the most striking features of the Roman Church that she hath most powerfully asserted, guarded, promoted, and vindicated the doctrine that the Virgin was conceived without sin. It hath been the boast of Our Predecessors that by their authority they instituted in the Roman Church the Feast of the Conception of Mary, and caused it to be observed with an Office and a Mass wherein her privilege of immunity from original sin was openly asserted.

    Moreover, Our said Predecessors with great joy ordained that the Feast of the said Conception should be observed as of the same rank as that of the Nativity of the Blessed Virgin, and appointed that it should be kept with an Octave throughout the whole Church. They added this Feast to those which are commanded to be kept with solemnity. And above all did they rejoice in the hope of strengthening this belief in the minds of the faithful, and stirring them up to love and venerate the Virgin conceived without sin, when they granted permission to add to the Litany of Loretto the invocation, Queen conceived without original sin, and to insert the word stainless into the Preface of the Mass on this Feast, that so the law of prayer might become the law of belief.

    Rejoice, father Adam, and yet more thou mother Eve, ye that are the source of all, and the ruin of all, and the unhappy cause of their ruin before ye gave them birth. Be comforted both in your daughter, and such a daughter; but chiefly thou, O woman, of whom the first evil came, and who hast cast thy slur upon all women. The time is come for the slur to be taken away, and for the man to have nothing to say against the woman. At the first, when he unwisely began to make excuse, he scrupled not to throw the blame upon her, saying, The woman whom Thou gavest to be with me, she gave me of the tree, and I did eat. Wherefore, O Eve, betake thyself to Mary Mother, betake thyself to thy daughter; let the daughter answer for the mother; let her take away her mother's reproach; let her make up to her father for her mother's fault; for if man be fallen by means of woman, it is by means of woman that he is raised up again.

    What didst thou say, O Adam? The woman whom Thou gavest to be with me, she gave me of the tree, and I did eat. These are wrathful words, by the which thou dost rather magnify than diminish thine offence. Nevertheless, Wisdom hath defeated thy malice. God asked thee that He might find in thee an occasion of pardon, but, in that He found it not, He hath sought and found it in the Treasure of His Own mercy. One woman answereth for another; the wise for the foolish; the lowly for the proud; for her that gave thee of the tree of death, another that giveth thee to taste of the tree of life; for her that brought thee the bitter food of sin, another that giveth thee of the sweet fruits of righteousness. Wherefore accuse the woman no more, but speak in thanksgiving, and say, Lord, the woman whom Thou hast given me, she hath given me of the tree of life, and I have eaten; and it is in my mouth sweeter than honey, for thereby hast Thou quickened me. Behold, it was for this that the angel Gabriel was sent to the Virgin, to the most worshipful of women, a woman more wonderful than all women, the restorer of them that went before, and the quickener of them that come after her.

    Has it not of this thy daughter, O Adam, that God spake when He said unto the serpent, I will put enmity between thee and the woman? And if thou wilt still doubt that He speaketh of Mary, hear what followeth: She shall bruise thy head. Who won this conquest but Mary? She brought to nought the whole wiles of Satan, whether for the pollution of her body or the injury of her soul.
  responsory: |
    R. By one man sin entered into the world, in whom all have sinned. * Fear not, Mary, for thou hast found grace with God. V. The Lord hath delivered thy soul from death, yea, the Lord was thy stay. R. Fear not, Mary, for thou hast found grace with God.
  status: verified

octave-readings/~-octave-day-5:
  source: From the Dogmatic Bull of Pope Pius IX; Homily of St. Tarasius, Bishop
  text: |
    The language used in public worship is the necessary offspring of the teaching which it expresseth, and the former can have no safety unless the latter be settled. Wherefore Our Predecessors the Roman Pontiffs, while encouraging the pious love of the faithful for the Conception of the Blessed Virgin, have taken care ceaselessly to inculcate the sinlessness of the same. They have always particularly insisted that the Feast should be observed not in honour of Mary's sanctification, a false opinion, most foreign to the mind of the Church, but in honour of her Conception itself.

    The same Our Predecessors have likewise resisted the dreams of those who have imagined that in the sinless Conception there were Two Instants, and that the Church celebrateth the Second and not the First. Indeed, Our said Predecessors have considered the sinlessness of the First Instant to be as much a truth for their assertion, protection, and promulgation, as the sinlessness of the Conception at all.

    It hath always been one of the most weighty cares of Our said Predecessors the Roman Pontiffs to protect the doctrine of the sinlessness of Mary's Conception from any sort of attack or corruption. Our said Predecessors did not stop even here, but in order to preserve the doctrine of the Virgin's sinless Conception from injury they strictly forbade that the opposite opinion should be maintained either in public or in private, to the end that it might at length die out under disapprobation.

    O Mary, where shall I find words to praise thee? Maiden undefiled, virgin unstained, exaltation of women, glory of daughters! Holy Maiden Mother, blessed art thou among women, thy glory is in thy guilelessness, and thy name is a name of purity. In thee the curse of Adam is done away, and the debt of Eve paid. Thou art the clean offering of Abel, a pure sacrifice. Thou art the hope of Enoch, that firm hope that he had in God. Thou art the Holy Ark of Noah, and the bond of reconciliation with God in a new regeneration. Thou art the exceeding glory of the kingdom and Priesthood of Melchisedech. Thou art the unshaken trust of Abraham, and his faith in the promise of children that were to be.

    Thou art the vision of the Prophets and the fulfilment of those things which they foretold. Thou art the gate whereof Ezekiel spake, when he prophesied, and said, This gate shall be shut, it shall not be opened, and no man shall enter in by it; because the Lord, the God of Israel, hath entered in by it. Thou art the Rod of Jesse, whereof Isaiah spake, even that Rod whose Flower is Christ. Thou art the Covenant foretold by Jeremiah, thereby signifying the coming of thy Son. Thou art the great mountain spoken of by Daniel, the man greatly beloved, wherefrom is cut without man's hands the corner-stone, that is, Christ. I honour thee as the unpolluted fountain, I proclaim that thou art full of grace, I praise thee as the clean and undefiled tabernacle of God.

    And now we, the people of God, a holy generation, an acceptable congregation, the nestlings of the dove of peace, children of grace, do with purified minds and unpolluted lips, praise God in the tongues of all nations in this joyful solemnity of the Virgin. Hail, thou Paradise of God the Father, whence the knowledge of Him floweth in broad rivers to the ends of the earth! Hail, Dwelling-place of God the Son, whence He came forth clothed in flesh! Hail, mysterious Tabernacle of God the Holy Ghost! Hail, thou that art holier than the Cherubim! Hail, thou that art more glorious than the Seraphim! Hail, thou that art nobler than the heavens! Hail, thou that art brighter than the sun! Hail, thou that art fairer than the moon! Hail, source of health to dying creatures! Hail, O Queen, ambassadress of peace! Hail, stainless crown of motherhood! Hail, thou that art full of grace, the Lord is with thee, even the Lord that is before thee, and from thee, and that is with us. To Him, with the Father, and the most holy and Life-giving Spirit, be ascribed all praise, now and ever, world without end. Amen.
