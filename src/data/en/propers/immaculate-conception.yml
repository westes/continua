octave-readings/~-octave-day-7:
  source: From the Dogmatic Bull of Pope Pius IX; Homily of St. Sophronius, Bishop
  text: |
    It is known to all men, with what care this doctrine of the sinlessness of the conception of the Mother of God hath been handed down, set forth, and defended by the most distinguished Religious Orders, Theologians, Universities, and Doctors skilled in the things of God. All men know likewise how carefully Christian Bishops, even in their public teaching, have professed the doctrine that through the merits of Christ our Lord and Saviour, foreknown by God, the Holy Virgin Mary, Mother of God, was delivered from ever being the victim of original sin. The most holy Council of Trent, when it decreed that all men are conceived in sin, expressly added that it did not mean thereby to say that the blessed and stainless Mary, Mother of God, did not form an exception to the rule.

    In truth, this doctrine upon the Conception of the most Blessed Virgin is day by day more earnestly set forth by the graver thought of the Church, by her teaching, by her care, by her learning, and by her wisdom. The Church hath received it from the Fathers, as a part of the original faith, attested strongly by the most ancient and venerable monuments of both the Eastern and Western Churches.

    All Commentators on the Book of Genesis remark that passage where God, at the very time of the Fall, speaketh of the Atonement, to the confusion of the lying serpent, and the comfortable hope of man, and saith: I will put enmity between thee and the woman, and between thy seed and her seed; and all the ancients teach that by this passage is meant the most merciful Saviour of mankind, namely, our Lord Jesus Christ, the Only-Begotten Son of God, and His most blessed Mother the Virgin Mary.

    Blessed indeed art thou among women, for thou hast turned the curse of Eve into a blessing; thou hast even brought a blessing upon Adam, when he lay smitten by the first sentence of death. Blessed indeed art thou among women, for thou art the mean whereby the Father's blessing hath come upon man, and delivered him from the old curse. Blessed indeed art thou among women, for by thee thy fathers have found salvation. Blessed indeed art thou among women, for thou, not knowing a man, conceivest a Son through Whom the whole earth shall be blessed. Blessed indeed art thou among women, for thou remainest thyself no more than a woman, and yet art made Mother of God.

    Fear not, Mary, for thou hast found grace with God: abiding grace. Thou hast found grace with God: exceeding grace. Thou hast found grace with God: all desirable grace. Thou hast found grace with God: greater grace than any other. Thou hast found grace with God: unfailing grace. Before thee there have been others, many others, made wonderful in holiness, but to none hath it been given, as to thee, to be full of grace.

    And justly; for none hath ever drawn so near to God as thou hast; none hath ever been gifted by God with good gifts as thou hast; none hath ever received of God's grace as thou hast. None hath ever comprehended the Incomprehensible as thou hast; none hath ever enjoyed His presence so much. Wherefore, O Lady, I have already cried unto thee with the Angel, and full of grace, the Lord is with thee! Blessed art thou among women!
