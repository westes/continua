  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Luke 15:11-32
      text: 'At that time, Jesus spoke to the Pharisees and Scribes this parable: "A certain man had two sons. And the younger of them said to his father, ''Father, give me the share of the property that falls to me.'' And he divided his means between them. And not many days later, the younger son gathered up all his wealth, and took his journey into a far country; and there he squandered his fortune in loose living. And after he had spent all, there came a grievous famine over that country, and he began himself to suffer want. And he went and joined one of the citizens of that country, who sent him to his farm to feed swine. And he longed to fill himself with the pods that the swine were eating, but no one offered to give them to him. But when he came to himself, he said, ''How many hired men in my father''s house have bread in abundance, while I am perishing here with hunger! I will get up and go to my father, and will say to him, Father, I have sinned against heaven and before you. I am no longer worthy to be called your son; make me as one of your hired men.'' And he arose and went to his father. But while he was yet a long way off, his father saw him and was moved with compassion, and ran and fell upon his neck and kissed him. And the son said to him, ''Father, I have sinned against heaven and before you. I am no longer worthy to be called your son.'' But the father said to his servants, ''Fetch quickly the best robe and put it on him, and give him a ring for his finger and sandals for his feet; and bring out the fattened calf and kill it, and let us eat and make merry; because this my son was dead, and has come to life again; he was lost, and is found.'' And they began to make merry. Now his elder son was in the field; and as he came and drew near to the house, he heard music and dancing. And calling one of the servants he inquired what this meant. And he said to him, ''Your brother has come, and your father has killed the fattened calf, because he has got him back safe.'' But he was angered and would not go in. His father, therefore, came out and began to entreat him. But he answered and said to his father, ''Behold, these many years I have been serving you, and have never transgressed one of your commands; and yet you have never given me a kid that I might make merry with my friends. But when this your son comes, who has devoured his means with harlots, you have killed for him the fattened calf.'' But he said to him, ''Son, you are always with me, and all that is mine is yours; but we were bound to make merry and rejoice, for this your brother was dead, and has come to life; he was lost, and is found.''"'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, ch. 15
      text: |-
        Thou seest how that the heavenly goods are given to such as seek them. Neither oughtest thou to think the father to blame, because he gave to his younger son. In the kingdom of God there is no age of weakness, neither doth faith wax infirm with years. He, surely, who asked, deemed himself of sufficient age. And would that he had not left his father! then had he been ignorant of the obstacle of his age! But after that he had left his father's house, and had gone into a far country, he began to be in want. Well is he said to have wasted his substance, who hath cut himself off from the Church!

        "He took his journey into a far country." No man can go farther than to abandon his own better self, to leave, not his country, but his morals, and, as it were, in an hideous fever of lust after the world, to divorce himself from the ties that bind him to holy things. Yea, he that turneth his back on Christ, banisheth himself from his Fatherland, and becometh a citizen of the world. But we are no more strangers and foreigners, but fellow-citizens with the saints, and of the household of God, since we who sometimes were afar off, are made nigh by the Blood of Christ. Let us not envy the pleasures of them who remain in the far country. We too have once been there, but, as saith Isaiah, "they that dwelt in the land of the shadow of death, upon them hath the light shined." And that far country is the land of the shadow of death.

        But we to whom the Lord Christ is the breath of life, are alive under the shadow of Christ. And therefore it is that the Church saith, "I sat down under His shadow with great delight." The prodigal son by riotous living wasted all the gifts of nature. Take warning, O thou who art made in the image and likeness of God, lest thou waste the same by brutish wallowing. Thou art the work of God; say not to a stock, "Thou art my father," lest thou grow into the likeness of a stock, as it is written, "They that make them are like unto them."
      responsory: |-
        R. Father, I have sinned against heaven and before thee, and am no more worthy to be called thy son. * Make me as one of thine hired servants.
        V. How many hired servants of my father's have bread enough and to spare, and I perish with hunger! I will arise and go to my father and will say unto him.
        R. Make me as one of thine hired servants.
      status: verified
