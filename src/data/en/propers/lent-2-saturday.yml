collect:
  text: |
    Let us pray.
    Grant, O Lord, we beseech thee, that our Fasts may bring forth their fruit unto salvation, that so the affliction which we lay upon our bodies may quicken our souls unto spiritual increase.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    We beseech thee, almighty God, look upon the hearty desires of thy humble servants, and stretch forth the right hand of thy Majesty to be our defense against all our enemies.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

