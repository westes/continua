  readings:
    - nocturn: 2
      isGospel: false
      text: Pontian was a Roman, who ruled the Church in the reign of the Emperor Alexander. This Emperor banished him into the Island of Sardinia, along with the Priest Hippolytus, on account of their profession of the Christian faith. There he endured many hardships because of his belief in Christ, and departed this life upon the 19th day of November. His body was brought to Rome by Pope Fabian and his clergy, and buried in the cemetery of Kallistus, upon the Appian Way. He sat in the seat of Peter four years, four months, and twenty-five days. He held two Ordinations in the month of December, wherein he made six Priests, five Deacons, and six Bishops for diverse places.
      status: verified
