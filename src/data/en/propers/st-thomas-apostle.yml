collect:
  text: |
    Let us pray.
    Grant us, Lord, we beseech thee, to glory in the solemnity of thy blessed Apostle Thomas, that we may ever be aided by his patronage, and follow his faith with true devotion.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Because thou hast seen me, * Thomas, thou hast believed: blessed are they that have not seen and have believed, alleluia.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
