nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Anicetus, a Syrian, presided over the Church in the reign of the Emperor Marcus Aurelius Antoninus. He decreed that clerics should not wear their hair long. In the month of December he held five ordinations, ordaining seventeen priests, four deacons, and nine bishops for various places. He held the pontificate for eight years, eight months, and twenty-four days. Crowned with martyrdom for the faith of Christ, he was buried on the Appian Way in the cemetery afterwards called that of Callistus, on the 17th of April.
      status: draft
