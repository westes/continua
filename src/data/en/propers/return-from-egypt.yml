collect:
  text: |
    Let us pray.
    Lord Jesus Christ, who, subject to Mary and Joseph, didst consecrate family life by thy unspeakable virtues: grant that, by the aid of them both, we may be taught by the examples of thy Holy Family, and attain to their everlasting companionship.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. Arise, and take the child and his mother, and go into the land of Israel: for they are dead that sought the life of the child.
    V. Arise, and take the child and his mother.
    R. And go into the land of Israel.
    Let us pray.
