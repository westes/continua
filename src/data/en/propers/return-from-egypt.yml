magnificat-antiphon:
  text: Who arose, and took the child and his mother, and came into the land of Israel.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 2:19-23
      text: 'But when Herod was dead, behold an angel of the Lord appeared in sleep to Joseph in Egypt, Saying: Arise, and take the child and his mother, and go into the land of Israel. For they are dead that sought the life of the child. Who arose, and took the child and his mother, and came into the land of Israel. But hearing that Archelaus reigned in Judea in the room of Herod his father, he was afraid to go thither: and being warned in sleep retired into the quarters of Galilee. And coming he dwelt in a city called Nazareth: that it might be fulfilled which was said by prophets: That he shall be called a Nazarene.'
      status: verified
