collect:
  text: |
    Let us pray.
    Stir up our hearts, O Lord, to make ready the ways of thine Only-begotten Son, that by His coming our minds being purified, we may the more worthily give up ourselves to thy service:
    Who with thee liveth and reigneth, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: verified

lauds-capitulum:
  text: 'Brothers: For what things soever were written, were written for our learning: that through patience and the comfort of the scriptures, we might have hope.'
  citation: Rom 15:4
  status: verified

lauds-hymn:
  text: |
    Hark, a herald voice is calling;
    “Christ is nigh,” it seems to say;
    “Cast away the dreams of darkness,

    Oye children of the day.”

    Startled at the solemn warning,
    Let the earth-bound soul arise;
    Christ, her sun, all sloth dispelling,
    Shines upon the morning skies.

    Lo, the Lamb, so long expected,
    Comes with pardon down from heaven;
    Let us haste, with tears of sorrow,
    One and all to be forgiven.

    So when next he comes with glory,
    Wrapping all the earth in fear,
    May he then as our defender
    On the clouds of heaven appear.

    Honour, glory, virtue, merit,
    To the Father and the Son,
    With the co-eternal Spirit,
    While eternal ages run.
    Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Come to my rescue, * O God, Lord of hosts.
    R. Come to my rescue, * O God, Lord of hosts.
    V. show us thy face, and we shall be saved.
    R. O God Lord of hosts.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Come to my rescue, * O God, Lord of hosts.
  status: verified

lauds-versicle:
  text: 'V. A voice of one crying in the wilderness: Prepare the way of the Lord. R. Make straight his paths.'
  status: verified

