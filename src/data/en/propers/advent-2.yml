    V. And grant us thy salvation.
    R. thy mercy
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Show us, O Lord, * thy mercy;
  status: verified

vespers-versicle:
  text: V. Drop down dew, ye heavens, from above, and let the clouds rain the Just. R. Let the earth be opened, and bud forth the Saviour.
