nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, Commentary on Isaiah, Book 4
      text: |-
        And there shall come forth a rod out of the stem of Jesse. From the beginning of the Book of this Prophet till the thirteenth chapter, where commenceth the vision, or burden of Babylon, the whole of the vision of Isaiah, the son of Amoz, is one continual prophecy of Christ. We must explain it part by part, for if we were to take it all at once, the memory of the reader would be confused. According to the Jewish commentators, the rod and the flower would both relate to the Lord Himself. They take the rod to mean the sceptre of His Royal dominion, and the flower the loveliness of His beauty.

        We, however, understand that the rod out of the root of Jesse signifieth the holy Virgin Mary. She was a clean stem that had as yet put forth no shoot; as we have read above: Behold, the Virgin shall conceive and bear a son. And the flower we believe to mean the Lord our Redeemer, Who hath elsewhere compared Himself to a flower: I am a flower of the plain, and a lily of the valleys.

        The Spirit of the Lord then shall rest upon this flower; this flower which shall come forth from the stem and roots of Jesse by means of the Virgin Mary. And truly the Spirit of the Lord did rest upon our Redeemer. It is written that in Him dwelleth all the fulness of the Godhead bodily. The Spirit was not shed on Him by measure, as it is upon the Saints. To Him we may apply the words of the Hebrew Gospel used by the Nazarenes: The whole fountain of the Holy Ghost shall be poured forth upon Him. The Lord is a spirit, and where the Spirit of the Lord is, there is liberty.
      responsory: |-
        R. Behold, there cometh the Lord, our defender, the Holy One of Israel, * Wearing a royal crown upon His head.
        V. And His dominion shall be from sea even to sea, and from the river even to the ends of the earth.
        R. Wearing a royal crown upon His head.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 11:2-10
      text: 'At that time, when John had heard in prison of the works of Christ, he sent two of his disciples to say to Him, Are You He Who is to come, or shall we look for another? And Jesus answering said to them, Go and report to John what you have heard and seen: the blind see, the lame walk, the lepers are cleansed, the deaf hear, the dead rise, the poor have the gospel preached to them. And blessed is he who is not scandalized in Me. Then, as they went away, Jesus began to say to the crowds concerning John, What did you go out to the desert to see? A reed shaken by the wind? But what did you go out to see? A man clothed in soft garments? Behold, those who wear soft garments are in the houses of kings. But what did you go out to see? A prophet? Yes, I tell you, and more than a prophet. This is he of whom it is written, ''Behold, I send my messenger before Your face, who shall make ready Your way before You.'''
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 6 on the Gospels
      text: |-
        The sight of so many signs and so many mighty works should have been a source of wonder, and not a stumbling-block. And yet the unfaithful found these very works a rock of offence, when they afterwards saw Him Who had worked so many miracles dying on the Cross. Hence Paul saith: "We preach Christ crucified, unto the Jews a stumbling-block and unto the Gentiles foolishness." It is indeed folly in the eyes of men to say that the Author of life died for men and thus men put as a stumbling-block to hinder them from coming to Jesus, the very thing that doth oblige them the most unto Him. For the more humbling God hath undergone for man's sake, the more worthy is He that man should worship Him.

        And blessed is he, whosoever shall not be offended in Me. Now what is this, but a plain mention of that time, when He afterwards humbled Himself, becoming obedient unto death, even the death of the Cross? It is as if He said: I indeed do wonderful works, but the day will come when I shall not refuse to suffer shame and evil treatment. Take heed then, ye who now worship Me for the works' sake, that when I come to die ye despise Me not for My death's sake.

        And, as the disciples of John departed, what did Jesus say unto the multitudes concerning this same John? Let us hear. What went ye out into the wilderness to see? A reed shaken with the wind? Here our Lord teacheth not by assertion, but by negation. Now a reed is a thing so made that as soon as the wind bloweth upon it, it bendeth it over toward the opposite quarter. And the fleshly-minded man is like a human reed. As he is praised or blamed so he bendeth himself in the one direction or the other.
      responsory: |-
        R. The Lord shall go forth out of Samaria unto the gate that looketh toward the East; and He shall come into Bethlehem, walking upon the waters of the redemption of Judah. * Then shall every one be saved for, behold, He cometh.
        V. And in mercy shall His throne be established, and He shall sit upon it in truth.
        R. Then shall every one be saved for, behold, He cometh.
      status: verified
