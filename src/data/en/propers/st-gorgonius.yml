collect:
  text: |
    Let us pray.
    May thy holy servant Gorgonius, O Lord, gladden us by his prayers, and grant that we may
    rejoice in this his blessed festival.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. He that hateth his life * in this world, shall keep it unto life eternal.
    V. The righteous shall flourish like the palm-tree.
    R. He shall grow like a cedar in Lebanon.
    Let us pray.
    May thy holy servant Gorgonius, O Lord, gladden us by his prayers, and grant that we may rejoice in this his blessed festival.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Gorgonius was a native of Nicomedia, and one of the chamberlains of the Emperor Diocletian. He, with the help of a fellow-chamberlain named Dorotheus, brought all the other chamber-servants to believe in Christ. Both of them one day saw a martyr hideously tortured in the presence of Diocletian, and the example of his testimony roused them both to desire the same, and they both said: "Why, O Emperor, dost thou punish this man only, by condemning an opinion which we share with him? His belief is our belief. Our will is the same." The Emperor thereupon ordered them to be bound and scourged till their bodies were wholly flayed, and a mixture of vinegar and salt poured into the wounds. Soon after he commanded them to be bound again and grilled on bars over hot coals. Finally, after a variety of tortures, they were hanged. The body of the holy Gorgonius was some time afterward brought to Rome, and buried between the two laurel trees upon the Latin Way, but later, during the Pontificate of Gregory IV, it was translated into the Church of the Prince of the Apostles.'
      status: verified
