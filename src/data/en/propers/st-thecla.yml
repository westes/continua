collect:
  text: |
    Let us pray.
    Grant, we beseech thee, Almighty God, unto all thy servants who do here keep the birthday of thy blessed Virgin and Martyr Thecla, and do year by year rejoice at her solemn commemoration, that they may have grace to follow after the pattern of her great faith.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    Grant, we beseech thee, Almighty God, unto all thy servants who do here keep the birthday of thy blessed Virgin and Martyr Thecla, and do year by year rejoice at her solemn commemoration, that they may have grace to follow after the pattern of her great faith.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: This virgin Thecla was the daughter of noble parents at Iconium, and a disciple of the Apostle Paul. She is the subject of extraordinary praises by the holy Fathers. In the eighteenth year of her age, she parted from one Thamiris, to whom she had been betrothed, and her kindred accused her of being a Christian. A pile was set a-fire for her, unless she should deny Christ, but she made the sign of the Cross, and willingly entered it, and rain came, and put out the fire. She came to Antioch, where they threw her to wild beasts; and strove to tear her asunder, by tying her to oxen driven different ways; and cast her into a pit with many snakes; but by the mercy of Jesus Christ she was delivered from all. The warmth of her faith and the holiness of her life brought many to Christ. She returned into her own country, and withdrew to be an hermit, alone on a certain mountain, and passed away to be with the Lord, aged ninety years, and famous for many good works and miracles. She was buried at Seleucia.
      status: verified
