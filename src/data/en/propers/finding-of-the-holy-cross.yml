magnificat-antiphon/~-first:
  text: 'O Cross, * surpassing all the stars in splendour, exceeding dear to all Christian people and world-renowned, holiest of earth''s treasures: which only wast counted worthy to hold aloft the Price of our Redemption: sweet is thy wood and sweet thine iron, but sweetest of all the Burden that hung on thee! O that all who come this day to celebrate thy praises may find in thee salvation. Alleluia, Alleluia. '
  status: verified

