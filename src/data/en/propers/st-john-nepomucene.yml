collect:
  text: |
    Let us pray.
    O God, who for the unconquered sacramental silence of blessed John didst adorn thy
    Church with a new crown of martyrdom: grant us, by his intercession and example, to
    guard our tongue with care, and to endure any evil in this world rather than harm to the
    soul.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. He that hateth his life * in this world, shall keep it unto life eternal.
    V. The righteous shall flourish like the palm-tree.
    R. He shall grow like a cedar in Lebanon.
    Let us pray.
    O God, who for the unconquered sacramental silence of blessed John didst adorn thy Church with a new crown of martyrdom: grant us, by his intercession and example, to guard our tongue with care, and to endure any evil in this world rather than harm to the soul.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: John was born in the town of Nepomuk in Bohemia, whence he took the surname Nepomucene. Having received his degrees in philosophy, theology, and the sacred canons, and been ordained to the priesthood, he was made a canon of the metropolitan church of Prague, and was entrusted with the office of preaching the Gospel before King Wenceslaus IV. Appointed by the king to distribute the royal alms among the poor, he was chosen by Queen Joanna as the director of her conscience. But when Wenceslaus was being swept headlong into vice, and bore ill his pious wife's remonstrances, he dared to demand that the secrets which the queen had entrusted to the priest in sacramental confession be disclosed to him by John. But the minister of God, though tempted by flattery, by torments, and by the squalor of imprisonment, stood firm against the king's wicked desire; and when Wenceslaus threatened him with drowning should he persist in his resistance, John with unconquered constancy refused to yield to the terrors and threats. And so, by the king's command, he was cast by night into the river Moldau, which flows through Prague, and thereby won the illustrious palm of martyrdom. Pope Benedict XIII enrolled in the catalogue of the holy Martyrs this first defender of the sacramental seal, who sealed his fidelity to its secret with his own blood.
      status: draft
