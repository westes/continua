nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        At that time the Emperors Diocletian and Maximian were furiously raging against Christians, Januarius, Bishop of Benevento, was taken to Nola, to Timothy, President of Campania, on the charge of professing the Christian faith. There his firmness was tried diverse ways, and he was cast into a burning fiery furnace, but came forth thence unhurt, for neither upon his raiment nor upon the hairs of his head did the flame take any hold. Thereupon the wrath of the President was enkindled, and he commanded the martyr to be torn limb from limb. But in the meanwhile Januarius' Deacon Festus and his Reader Desiderius were taken, and the whole three were led in bonds to Puzzuoli in front of the President's carriage, and there thrown into the same prison wherein were already held four other Christians condemned to be devoured by wild beasts, that is to say, Sosius, a Deacon of Miseno, Proculus, a Deacon of Puzzuoli, and two laymen, named respectively Eutyches and Acutius.

        The next day all seven were exposed to the wild beasts in the amphitheatre, but these creatures forgot their natural fierceness, and lay down at the feet of Januarius. Timothy would have it that this came from charms, and commanded the witnesses of Christ to be beheaded. Thereupon he became of a sudden blind, until Januarius had prayed for him, by the which miracle nearly five thousand persons were turned to Christ. But this good turn roused up no gratitude in the President, yea, rather, the conversion of so many drave him wild, and in his hot fear to obey the decrees of the Emperors he commanded that the holy Bishop and his companions should be smitten with the sword.

        The cities of those coasts strove to obtain their bodies for honourable burial, so as to make sure of having in them advocates with God. By God's will the relics of Januarius were taken to Naples at last, after having been carried from Puzzuoli to Benevento, and from Benevento to Monte Vergine; when they were brought thence to Naples, they were laid in the chief Church there, and there have been famous on account of many miracles. Among these is remarkable the stopping of eruptions of Mount Vesuvius, whereby both that neighbourhood and also places afar off have been like to have been brought to desolation. It is also well known, and is the plain fact, seen even unto this day, that when the blood of Januarius, kept dried up in a small glass phial, is put in sight of the head of the same martyr, it is used to melt and bubble in a very strange way, as though it had but freshly been shed.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matthew 24:3-13
      text: At that time, as Jesus was sitting on the Mount of Olives, the disciples came to Him privately, saying, Tell us, when are these things to happen, and what will be the sign of Your coming and of the end of the world? And in answer Jesus said to them, Take care that no one leads you astray. For many will come in My name, saying, "I am the Christ," and they will lead many astray. For you shall hear of wars and rumors of wars. Take care that you do not be alarmed, for these things must come to pass, but the end is not yet. For nation will rise against nation, and kingdom against kingdom; and there will be pestilences and famines and earthquakes in various places. But all these things are the beginnings of sorrows. Then they will deliver you up to tribulation, and will put you to death; and you will be hated by all nations for My name's sake. And then many will fall away, and will betray one another, and will hate one another. And many false prophets will arise, and will lead many astray. And because iniquity will abound, the charity of the many will grow cold. But whoever perseveres to the end, he shall be saved.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Hilary, Bishop of Poitiers, Commentary on Matthew, ch. 25
      text: |-
        His disciples came unto Him privately, saying: "Tell us, when shall these things be, and what shall be the sign of thy coming and of the end of the world?" Here are in one question three several points, and the answers are to be understood of three several times, and by three several interpretations. "When shall these things be?" And herein He taught them concerning the fall of the city, whereof He made plain announcement, lest the unlearned might fall a prey to any deceiver. For within the lifetime of His then hearers were to come many, saying: I am Christ. He giveth warning therefore beforehand, lest such pestilential liars should gain any belief.

        He confirms them, therefore, to endure sufferings, flight, scourging, death, and the public hatred of all men for His Name's sake. And by these very troubles many shall be troubled, and as such great evils arise they shall be offended, and shall even be stirred up to hatred of one another. And false prophets shall arise, and shall deceive many by their pretended truth; and because iniquity shall abound, the love of many shall wax cold.

        But unto them that endure unto the end salvation is reserved; and then, the apostolic men having been scattered through every part of the world, the truth of the Gospel shall be preached. And when the knowledge of the heavenly mystery has been carried to all, then the fall and end of Jerusalem shall come to pass; so that the faith of the preaching, and the punishment and terror of the unbelievers, may follow from the destroyed city. These things therefore were fulfilled in her, just as they had been foretold; and, the Apostles having been stoned, put to flight, and slain, she was consumed by famine, war, and captivity. And she then proved unworthy to continue, when, having cast out the preachers of Christ, she showed herself unworthy of God's preaching.
      status: verified
