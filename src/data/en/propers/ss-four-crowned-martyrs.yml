collect:
  text: |
    Let us pray.
    Grant, we beseech thee, O Almighty God: that we who know thy glorious Martyrs to have been
    valiant in confessing thee, may find them favorable in interceding for us before thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the
    Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    Grant, we beseech thee, O Almighty God: that we who know thy glorious Martyrs to have been valiant in confessing thee, may find them favorable in interceding for us before thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: In the persecution under Diocletian, four brothers named Severus, Severian, Carpophorus, and Victorinus boldly refused to worship the gods, and were scourged with whips loaded with lead until they gave up their lives for the sake of Christ's Name under the blows. Their bodies were thrown out to be eaten by dogs, but when they remained untouched after a long while, the Christians took them away and buried them in a sand-pit on the Lavican Way, at the third milestone from the City, near the tomb of the holy Martyrs Claudius, Nicostratus, Symphorian, Castorius, and Simplicius, who had suffered under the same Emperor. These five, being master sculptors, could by no means be brought to make statues of the gods, and when led before an image of the sun to venerate it, declared they would never consent to worship the works of men's hands. For this they were thrown into prison, and when after many days they still held to the same resolve, they were first beaten with barbed scourges, then soldered up alive in leaden chests and cast into the river. There stands in the City a church called after the Four Crowned Martyrs, whose names, long unknown, were afterward made known by God; there the bodies not only of these four but also of the other five Martyrs are honorably buried, and their feast is kept on the sixth day before the Ides of November.
      status: verified
