nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Among the other sepulchres of Martyrs which are wont to be found in the cemetery of Priscilla on the Salarian Way, there was one in which the body of holy Philumena had been laid, as was read from the inscription of the tomb, set with three tiles. Although a phial of blood was found there, and other carved signs of martyrdom were seen, it is nevertheless to be lamented that the things done by her, and the acts and kind of martyrdom she underwent, have remained obscure. But as soon as this sacred body, received through the beneficence of Pius the Seventh at the beginning of his pontificate, was set forth for the veneration of the faithful people at Mugnano in the diocese of Nola, great celebrity of fame and devotion toward the holy Martyr at once spread abroad, especially on account of the signs which were reported from everywhere to have occurred through her protection. Whence it came about that Gregory the Sixteenth, Supreme Pontiff, moved by the petitions of very many prelates and of the Martyr's devotees, the whole matter having been maturely weighed, graciously permitted her feast with Office and Mass to be celebrated in the said diocese of Nola and elsewhere.
      status: draft
