  status: verified

magnificat-antiphon:
  text: To eat * with unwashen hands, defileth not a man.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matthew 15:1-20
      text: At that time, the Scribes and Pharisees from Jerusalem came to Jesus, saying, "Why do Your disciples transgress the tradition of the ancients? For they do not wash their hands when they take food." But He answered and said to them, "And why do you transgress the commandment of God because of your tradition? For God said, 'Honor your father and your mother'; and, 'Let him who curses father or mother be put to death.' But you say, 'Whoever shall say to his father or mother, Any support you might have had from me is dedicated to God, does not have to honor his father or his mother.' So you have made void the commandment of God by your tradition. Hypocrites, well did Isaiah prophesy of you, saying, 'This people honors me with their lips, but their heart is far from Me; and in vain do they worship Me, teaching as doctrine the precepts of men.'" Then He called the crowd to Him, and said to them, "Hear, and understand. What goes into the mouth does not defile a man; but it is what comes out of the mouth that defiles a man." Then His disciples came up and said to Him, "Do You know that the Pharisees have taken offense at hearing this saying?" But He answered and said, "Every plant that My heavenly Father has not planted will be rooted up. Let them alone; they are blind guides of blind men. But if a blind man guide a blind man, both fall into a pit." But Peter spoke to Him, saying, "Explain to us this parable." And He said, "Are you also even yet without understanding? Do you not realize that whatever enters the mouth passes into the belly and is cast out into the drain? But the things that proceed out of the mouth come from the heart, and it is they that defile a man. For out of the heart come evil thoughts, murders, adulteries, immorality, thefts, false witness, blasphemies. These are the things that defile a man; but to eat with unwashed hands does not defile a man."
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Jerome, Priest, Book 2, Commentary on Matthew, ch. 15
      text: |-
        The stupidity of the Pharisees and Scribes is something extraordinary. They rebuke the Son of God because He doth not observe the traditions and commandments of men for they wash not their hands when they eat bread. It behoveth us to cleanse, not the hands of the body, but the hands of the soul, namely, our works, that we may do the commandments of God. But He answered and said unto them Why do ye also transgress the commandment of God by your tradition? He meeteth here their false accusation by a true. "How," saith He, "do ye, who pass over the commandments of God, in order to keep to the traditions of men, hold that My disciples are to be rebuked, because they deem the tradition of the elders of little moment in comparison with the doing of what they know to be the Laws of God?"

        Now God commanded, saying: Honour thy father and mother; and: He that curseth father or mother, let him die the death. But ye say: Whosoever shall say to his father or his mother: It is a gift, by whatsoever thou mightest be profited by me; and honour not his father or his mother, he shall be free. The word 'honour' is used in Scripture, not so much in the sense of paying salutations and services, as in that of giving alms and gifts. Honour widows, saith the Apostle, which are widows indeed. And here 'honour' signifieth support. So again: Let the Priests that rule well be counted worthy of double honour, especially they who labour in the word and doctrine. For the Scripture saith, "Thou shalt not muzzle the ox that treadeth out the corn" and "The labourer is worthy of his reward."

        The Lord being mindful of the helplessness, or age, or poverty of parents, had commanded their children to honour them even by giving them the necessaries of life. The Scribes and Pharisees, scrupling not to make of none effect this most benign law, and bringing in ungodliness under the very form of godliness, taught, for the benefit of unnatural children, that if any one vowed to God, Who is our very Father in heaven, whatsoever he was bound to give to his parents, the duty of discharging his debt to his heavenly Father ought to come before that which he owed to his earthly father; or, at least, that parents in such case incurred the guilt of sacrilege by taking for themselves what they knew had been made a gift to God. And so parents were left unsuccoured, and the offerings of such children, under pretence of being given to God and His temple, became the gain of the Priests.
      responsory: |-
        R. We are verily guilty concerning our brother, in that we saw the anguish of his soul, when he besought us, and we would not hear. * Therefore is this distress come upon us.
        V. And Reuben answered his brethren, saying, Spake I not unto you, saying, Do not sin against the child; and ye would not hear?
        R. Therefore is this distress come upon us.
      status: verified
