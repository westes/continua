collect:
  text: |
    Let us pray.
    Grant unto us, O Lord, we beseech thee, that we, being purged by healthful Fasting, and mortified to all sinful lusts, may the more speedily obtain of thee forgiveness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    Grant unto us, we beseech thee, O Almighty God, that we who seek the shelter of thy protection, being defended from all evils, may serve thee in peace and quietness of spirit.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

