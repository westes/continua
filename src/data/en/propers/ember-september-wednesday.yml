nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Mark 9:16-28
      text: At that time, one of the crowd answering, said to Jesus, "Master, I have brought to You my son, who has a dumb spirit; and wherever it seizes him it throws him down, and he foams and grinds his teeth; and he is wasting away. And I told Your disciples to cast it out, but they could not." And He answered and said to them, "O unbelieving generation, how long shall I be with you? How long shall I put up with you? Bring him to Me." And they brought him to Him; and the spirit, when it saw Jesus, immediately threw the boy into convulsions, and he fell down on the ground, and rolled about foaming at the mouth. So He asked his father, "How long is it since this has come upon him?" And he said, "From his infancy. Oftentimes it has thrown him into the fire and into the waters to destroy him. But if You can do anything, have compassion on us and help us." But Jesus said to him, "If you can believe, all things are possible to him who believes." At once the father of the boy cried out, and said with tears, "I do believe; help my unbelief." Now when Jesus saw that a crowd was rapidly gathering, He rebuked the unclean spirit, saying to it, "Deaf and dumb spirit, I command you, go out of him and enter him no more." And crying out and violently convulsing him, it went out of him, and he became like one dead, so that many said, "He is dead." But Jesus took him by the hand, and raised him and he stood up. And when He had come into the house, His disciples asked Him privately, "Why could not we cast it out?" And He said to them, "This kind can be cast out in no way except by prayer and fasting."
      status: verified
    - nocturn: 1
      isGospel: false
      source: The Venerable Bede, Priest, homily on Mark 9:16-28
      text: |-
        Concerning this possessed person whom the Lord healed, after that He was come down from the mount, Mark saith that he was deaf and dumb, and Matthew that he was lunatic. He was a figure of them of whom it is said: A fool changeth as the moon. These are they who continue never in one stay, but change now to one sin, and now to another, waxing and waning dumb, in that they confess not the faith deaf, in that they have no ears for the word of truth. They foam at the mouth also, and pine away with folly. For it is the way with idiots, and swooners, and stupified, to foam their spittle out at their mouths. They gnash their teeth when they are inflamed with the heat of passion. They wither up in the paralysis of sloth and live nerveless lives unbraced by any strong exercise.

        The father saith: And I spake to thy disciples, that they should cast him out, and they could not. Here he maketh a sort of accusation against the Apostles. But that cures cannot be wrought is sometimes owing, not to the powerlessness of them that would heal, but to the want of faith in them that are to be healed as saith the Lord: According to your faith be it unto you. He answereth him, and saith: O faithless generation, how long shall I be with you The meek and lowly One, Who, as a lamb before his shearers, is dumb, so opened not His Mouth, was not wearied out of patience, nor did He break out into words of passion, but He spake as a physician might speak, who saw that the sick man did contrary to his commands. Wherefore should I come unto thine house? How long am I to throw away the exercise of my skill, while I order one thing and thou dost another?

        And He said unto them: This kind can come forth by nothing but by prayer and fasting. While He teacheth the Apostles how the very worst kind of devil must be driven out, He giveth unto all of us an instruction unto life, that we may know that the most grievous trials, either from unclean spirits, or from men, are to be overcome by fasting and prayer. The wrath of the Lord also, when it is kindled to take vengeance of our sins, can be turned away by this remedy only. To fast, in a general sense, is not only to abstain from meats, but to restrain oneself from all the enticements of the flesh, and from all evil passions. So also, to pray, is not only to call in words for the mercy of God, but also, in all things which we do, in earnestness of faith to worship our Maker.
      responsory: |-
        R. We have heard of the tribulation of those cities, which they have suffered, and we have fainted. Fear and confusion of mind are fallen upon us. Even the mountains will not give us a refuge. * Lord, have mercy.
        V. We have sinned like our forefathers, we have done unjustly, and wrought iniquity.
        R. Lord, have mercy.
      status: verified
