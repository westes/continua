nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine of Hippo, Sermon 10 on the Saints
      text: |-
        Dearly beloved brethren, today we keep the birthday of those children, who, as we are informed by the Gospel, were massacred by the savage King Herod. Therefore let earth rejoice with exceeding joy, for she is the mother of these heavenly soldiers, and of this numerous host. The love of the vile Herod could never have crowned these blessed ones as hath his hatred. For the Church testifieth by this holy solemnity, that whereas iniquity did specially abound against these little saints, so much the more were heavenly blessings poured out upon them.

        Blessed art thou, O Bethlehem in the land of Judah, which hast suffered the cruelty of King Herod in the slaughter of thy children; who art found worthy to offer at once to God a whole white-robed army of guileless martyrs! Surely, it is well to keep their birthday, even that blessed birthday which gave them from earth to heaven, more blessed than the day that brought them out of their mother's womb. Scarcely had they entered on the life that now is, when they obtained that glorious life which is to come.

        We praise the death of other martyrs because it was the crowning act of an undaunted and persistent testimony; but these were crowned at once. He That maketh an end to this present life, gave to them at its very gates that eternal blessedness which we hope for at its close. They whom the wickedness of Herod tore from their mothers' breasts are rightfully called the flowers of martyrdom; hardly had these buds of the Church shown their heads above the soil, in the winter of unbelief, when the frost of persecution nipped them.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 2:13-18
      text: 'At that time, an angel of the Lord appeared in a dream to Joseph, saying, "Arise, and take the Child and His mother, and flee into Egypt, and remain there until I tell you. For Herod will seek the Child to destroy Him." So he arose, and took the Child and His mother by night, and withdrew into Egypt, and remained there until the death of Herod; that what was spoken by the Lord through the prophet might be fulfilled, "Out of Egypt I called My Son." Then Herod, seeing that he had been tricked by the Magi, was exceedingly angry; and he sent and slew all the boys in Bethlehem and all its neighborhood who were two years old or under, according to the time that he had carefully ascertained from the Magi. Then was fulfilled what was spoken through Jeremias the prophet: "A voice was heard in Rama, weeping and loud lamentation; Rachel weeping for her children, and she would not be comforted, because they are no more."'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book I, on Matt 2:13-18
      text: |-
        He took the young Child, and His mother, and fled into Egypt, by night and in darkness; and the darkness of that night was a figure of the darkness of ignorance in which they left the unbelievers from whom they fled. But when they returned into Judaea, we learn not from the Gospel that it was by night, or in darkness; which is an image of that light which will lighten the Jews, when, at the end of the world, they shall receive back the faith, which now lighteneth the Gentiles, even as Judaea received Christ returning from Egypt.

        That it might be fulfilled which was spoken of the Lord by the Prophet, saying Out of Egypt have I called My Son. Those who go about to deny the authority of the Hebrew Scriptures, ask where any such passage is to be found in the Septuagint. But, although they find it not there, I tell them that the fact of its being written in the Prophet Hosea can be proved by the texts which I have lately published.

        Then was fulfilled that which was spoken by Jeremias the Prophet, saying; In Rama was there a voice heard, weeping and great mourning; Rachel weeping for her children. The child of Rachel was Benjamin, and Bethlehem is not a town belonging to his tribe. We must therefore seek another reason why Rachel should weep for the children of Judah, to whom Bethlehem belongeth, as for her own. The plain answer is that she is buried at Ephrath close to Bethlehem, and she is called Mother on account of the resting-place of her earthly tabernacle being there. It is possible also that she is called Mother because the tribes of Judah and Benjamin were joined together, and Herod slew not only all the children that were in Bethlehem, but also in all the coasts thereof.
      status: verified

octave-readings/~-octave-day-8:
  source: Sermon of St. Augustine, Bishop; Homily of St. John Chrysostom
  text: |
    The Lord is born, and sorrow breaketh out, not in heaven but on earth; to mothers is proclaimed lamentation, to angels joy, to children translation. God is born, and innocence must be offered up to Him Who cometh to condemn the malice of the world. The Lamb that taketh away the sins of the world is come to be crucified, and the tender flock is brought to the sacrifice. But the mothers will lament over them whose inarticulate bleating is silenced for ever. Let us turn a look on this great martyrdom, this heart-rending sorrow. The sword is drawn, though there is no offence to punish; only jealousy shrieking for Him Who is born, and doth no violence. And here are mothers weeping over the lambs of the flock: "In Ramah was there a voice heard, weeping and great mourning." They are pledges — not lent, but created; not deposited, but exposed to death.

    Nature is herself our witness of what the scene must have been when the tyrant dashed the little ones against the stones. The childless mothers tore their hair; those whose infants had still escaped strove vainly to hide them, and their very cries betrayed them, too young to have learnt the silence of fear. Sometimes the wretched mother struggled with the executioner, as he dragged the child to which she clung from her arms. The fruit of her body is torn from her breast. Was it for this that her womb bore it, and her paps gave it suck? Had she carried it so tenderly, that the murderer might seize it? It had come of her body only to be dashed against the stones.

    Sometimes a broken-hearted woman cried to the ruffian to kill her also: "Wherefore leave her to her childless widowhood? If fault there were, the fault was hers; then why not let her suffer and follow her lost one?" Some must have cried out: "What seek ye? Ye seek but One, and ye slay many, yet cannot ye touch the One that is One." And surely some called for the coming of the Messiah to deliver them: "Come, come, O Saviour, how long do we wait for Thee? Thou fearest none; let the soldier see Thee, and slay not our children." And so the cry of the mothers and the offering of their little ones went up together to heaven.

    When Joseph had heard this he was not troubled, neither did he say, "This is doubtful, or at least obscure. Thou saidst not long ago, that He shall save His people, and now apparently Himself He cannot save; but we are to flee, and journey far, and dwell in a strange land. Thy works belie thy words." But Joseph said none of these things, for he was faithful; neither did he curiously ask of the angel the time of his return, which God was not pleased to show him, but only sent him that word: "Be thou there until I bring thee word."

    He was not slothful, but obeyed cheerfully, and by faith bore all tribulations with joy. God in His mercy mingled some joy with his sorrow, as He doth in all the saints, whom He will have to abide continually neither in sorrow, nor in joy, but weaveth their life ever with a strange diversity. And let us consider how He did it here.

    When St. Joseph knew that the Virgin was with child, he was greatly troubled; but forthwith an Angel came to take away his fears. The Lord was born, and he rejoiced with exceeding joy; but straightway came the great danger, when all Jerusalem was troubled, the king in great wrath, and murderers seeking the young Child's life. The star shone over Bethlehem, and the wise men came to worship; but Herod sought to slay the Saviour, and they arose and fled into a far country.
  responsory: |
    R. A hundred forty four thousand, which were redeemed from the earth; these are they which were not defiled with women. * For they remained virgins; therefore are they kings before God, and the Lamb of God is with them. V. These are they which came out of great tribulation, and have washed their robes in the Blood of the Lamb. R. For they remained virgins; therefore are they kings before God, and the Lamb of God is with them.
  status: draft
