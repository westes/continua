  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Eugenius, the third of that name, formerly called Bernard, was a native of Pisa. His youth over, he enrolled himself in the clerical militia, and afterwards, initiated in the priesthood, by his eminent gifts of mind he deserved to be co-opted among the canons of the metropolitan church of Pisa. Drawn by the example of St. Bernard, who had then come to Pisa, he gave himself to be instructed by him, and in Clairvaux put on the monastic habit. Under the discipline of so great a man he so profited that he was first placed by him over the monastery of Farfa, then elected by Innocent the Second, Supreme Pontiff, abbot of the monastery of Saints Vincent and Anastasius at Aquae Salviae. In discharging this office, when he had shone with a wonderful splendour of sanctity and prudence, after the death of Lucius the Second he was created Supreme Pontiff by the votes of all the cardinals. Scarcely had he begun his pontificate when, rebels striving to overturn the dominion of the Roman Church, he was compelled once and again to depart from the City, and, the storm having then been calmed, returned to it again with the highest honour and the rejoicing of the good.

        Staying at Viterbo, he received legates of England, Scotland, Germany, Spain and Gaul, professing obedience and homage to blessed Peter in his person; likewise some bishops of Armenia, who besides, in the name of the Metropolitan and of their nation, sought his judgment on graver affairs of the Eastern church. Having gone into Gaul, he celebrated councils at Rheims and Trier, in which he proscribed the errors of Eon and of Gilbert de la Porrée, and wisely established many other things for the discipline of the clergy and the liberty of the Church. He then visited the monasteries of Clairvaux and Cîteaux together with St. Bernard, leaving everywhere shining examples of holy conversation. From the same Bernard he sought salutary admonitions for administering the Church and defending the rights of the Apostolic See; and he gave him the precious book On Consideration, in which the prerogatives and duties of Pontiff and prince are declared with heavenly wisdom. An eminent patron also of letters, he reformed the studies of theology and jurisprudence, and instituted academic degrees, as they are called, to make the minds of the young more eager.

        With singular desire for fostering peace, he directed all his care to composing the discords between the Pisans and the Lucchese. He loved exceedingly the beauty of the house of God: for he adorned the Liberian basilica with fairer ornament, and either repaired many other churches or enriched them with precious gifts. To the Vatican basilica he bestowed the fourth part of the offerings which by custom belonged to himself, besides the tenth already assigned to the Prince of the Apostles by St. Leo the Ninth. He enrolled in the catalogue of saints the Emperor Henry, a noble example of Catholic princes. At last at Tivoli, whither he had withdrawn from the City to avoid the summer heats, seized by a grave illness, he sought the death of the just on the eighth day before the Ides of July in the year one thousand one hundred and fifty-three, after he had sat in the chair of Peter eight years and four months. His body was carried to Rome, and laid in the Vatican, together with the remains of St. Gregory the Third and of blessed Peter the Levite. The sacred cult already then rendered to him, the splendour of miracles accruing, and in other regions also flourishing down to these times, the Supreme Pontiff Pius the Ninth, on the advice of the Sacred Congregation of Rites, held valid and confirmed.
      status: draft
