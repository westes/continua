collect:
  text: |
    Let us pray.
    O God, Whose never-failing Providence ordereth all things both in heaven and earth, we humbly beseech thee to put away from us all hurtful things, and to give us those things which be profitable for us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Beware of false prophets, * which come to you in sheep's clothing, but inwardly they are ravening wolves. Ye shall know them by their fruits. Alleluia.
  status: verified

magnificat-antiphon:
  text: A good tree cannot bring forth evil fruit, * neither can a corrupt tree bring forth good fruit. Every tree that bringeth not forth good fruit, is hewn down and cast into the fire. Alleluia.
  status: verified

magnificat-antiphon/~-first:
  text: 'Nathan the Prophet * anointed Solomon King in Gihon, and they went up with joy, and cried, saying: May the King live for ever.'
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, Priest, Epistle 2 to Nepotian
      text: |-
        Then David, who had once been a man of war, was seventy years old, the chill of old age came upon him, and he could get no heat. So they sought out for him throughout all the coasts of Israel Abishag the Shunamite, to sleep with the king and to warm his aged body. Who is this Shunamite, wife and yet virgin, so hot, that she could heat the chilly, so holy, that her warmth provoked him not to lust. Let Solomon the Wise explain his father's enjoyment, and the "Peaceful One" tell of the warrior's embraces. "Get wisdom, get understanding, forget it not, neither decline from the words of my mouth, forsake her not, and she shall preserve thee love her, and she shall keep thee" (Prov. iv. 5-9).

        In old men almost all the powers of the body become weakened, and while wisdom only is increasing, all things else beside wisdom fail. Then faileth strength for fasting, for watching, for "chameuniae," (that is, sleeping on the floor,) for wandering hither and thither, for receiving strangers, for defending the poor, for instance and constancy in prayer, for visiting the sick, for that work with the hands whence alms are given. I need not treat of this with long talk, but, in short, when the body is broken down, all the works of the body wax enfeebled.

        Neither do I say, on the other hand, that wisdom, which in many old men drivelleth into second childhood, is weak, or wanting in such of the young and stout, as win knowledge by work and earnest study, by holiness of life and instancy of prayer to the Lord Jesus, but this I do say, that the more spiritual faculties have in youth many wrestlings with the body to go through, and that, what with violent provocations to vice, and what with the sensual ticklings of the flesh, they are apt to be smothered like fire among green wood, and not able to blaze forth in all their brightness. But when old age cometh upon them, who have spent their youth in acquiring sound knowledge, and have meditated in the law of the Lord day and night, it hath this effect on them, to make them more learned by their increased years, more experienced by constant use, more wise, through the advance of time and, in short, doth offer them the rich harvest of their past diligence.
      responsory: |-
        R. Saul hath slain his thousands, and David his ten thousands. * Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
        V. Is not this David? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, and David his ten thousands?
        R. Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 7:15-21
      text: 'At that time, Jesus said to His disciples: Beware of false prophets, who come to you in sheep’s clothing, but inwardly are ravenous wolves. By their fruits you will know them. Do men gather grapes from thorns, or figs from thistles? Even so, every good tree bears good fruit, but the bad tree bears bad fruit. A good tree cannot bear bad fruit, nor can a bad tree bear good fruit. Every tree that does not bear good fruit is cut down and thrown into the fire. Therefore, by their fruits you will know them. Not everyone who says to Me, ‘Lord, Lord,’ shall enter the kingdom of heaven; but he who does the will of My Father in heaven shall enter the kingdom of heaven.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Hilary, Bishop of Poitiers, Commentary on Matthew, Canon 6
      text: |-
        Blandishments of words and a false show of gentleness must be tried by the fruit of their working; that we look not so much to what a man saith of himself, as to what he doth make of himself; for often under a garment of wool is hidden the raging madness of a wolf. As therefore thorns bear not grapes, nor thistles figs, and as bad trees bring not forth good fruit; so neither can the fruit of a good work rest in such things, and therefore all must be known by their fruits. The kingdom of heaven is not gotten by professions of words alone; neither shall he which saith Lord, Lord, be an heir thereof.

        For what merit is there in saying to the Lord, Lord? Shall He be no Lord unless we call Him so? And what sanctity of duty is there in the calling of a name, when the way to the heavenly kingdom is rather to be found by obedience to the will of God than by the calling upon His Name? Many will say unto Me in that day, Lord, Lord, have we not prophesied in Thy Name? Even here He condemneth the deceitfulness of false prophets and the pretences of hypocrites, who claim glory for themselves out of the power of the word, in prophesying doctrine, and casting out devils, and the powers of works of that kind.

        And hence they promise themselves the kingdom of heaven, as though any of the things which they speak or do were their own, and not all the power of God invoked to perform them, since teaching bringeth knowledge, and it is the Name of Christ that putteth devils to flight. That blessed eternity therefore is to be earned of our own, and something must be furnished from our own part, that we will good and shun all evil, and with all our love obey the heavenly precepts, and by such deeds be known unto God, and do rather what He willeth, than glory in what we are able to do.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
