nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        In the reign of the Emperor Theodosius the younger, his wife went to Jerusalem in fulfilment of a vow, and there was gifted with many presents. Among other things, they gave her in especial an iron chain, adorned with gold and precious stones, which they affirmed to be the same wherewith the Apostle Peter had been bound by King Herod. Eudocia, with godly reverence, afterwards sent this chain to Rome, to her daughter Eudoxia, who brought it to the Pope, and the Pope in return showed to her another chain wherewith the same Apostle had been shackled under the Emperor Nero.

        When then the Pope put together the Roman chain and that which had been brought from Jerusalem, it came to pass that they got so entangled the one with the other that they seemed no longer two but one chain. From this wonder these holy fetters began to receive such honour, that Eudoxia's Church of St. Peter on the Esquiline Mount was dedicated under the name of St. Peter in Chains, and a Feast-Day instituted upon the first day of August in memory of it.

        From that time forth the honour which before had used to be paid to the profane festivity of the Gentiles began to be turned to the Chains of Peter, whose very touch healed the sick, and drove out devils. Among other such cases there befell in the year of man's Redemption 969, that of a certain Count, a servant of the Emperor Otho, who was possessed by an unclean spirit, and tore himself with his own teeth. This man the Emperor ordered to be taken to Pope John, and as soon as he had touched the Count's neck with the hallowed chains, the foul spirit came out of him, and left him free. And thenceforward the reverence for these holy chains greatly increased in the City.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 16:13-19
      text: At that time, Jesus came into the quarters of Cæsarea Philippi, and He asked His disciples, saying, "Whom do men say that the Son of Man is?" But they said, "Some John the Baptist, and other some Elias, and others Jeremias, or one of the prophets." Jesus saith to them, "But whom do you say that I am?" Simon Peter answered and said, "Thou art Christ, the Son of the living God." And Jesus answering, said to him, "Blessed art thou, Simon Bar-Jona, because flesh and blood hath not revealed it to thee, but My Father Who is in heaven. And I say to thee, that thou art Peter, and upon this rock I will build My Church, and the gates of hell shall not prevail against it. And I will give to thee the keys of the kingdom of heaven; and whatsoever thou shalt bind upon earth, it shall be bound also in heaven, and whatsoever thou shalt loose upon earth, it shall be loosed also in heaven."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 29 on the Saints (on Matt 16:13-19)
      text: |-
        Peter was the only one of the Apostles who was worthy to hear the words: Amen, I say unto thee that thou art Peter, and upon this rock I will build My Church. Worthy indeed must he be, who, when the nations are to be built up into a Temple of God, is chosen as the ground-stone whereon the building is to stand, the pillar whereby it is to be held up, and the key wherethrough entrance is to be made into the kingdom. Concerning him the Word of God saith: That they brought forth the sick into the streets, and laid them on beds and couches, that at the least the shadow of Peter passing by might overshadow some of them. If the shadow of his body then could give help, how much more shall the fulness of his strength give help now. If the very air, as he passed by, was then profitable to such as besought him, how much more shall his favour profit where now he abideth. It is with reason that, throughout all the Churches of Christ, the iron chains wherewith he was afflicted are reckoned more precious than gold.

        If his shadow as a visitor was so healthful, what is his chain now that he bindeth and looseth. If his empty image in the air had healing power, how much power must have been contracted from his body by those chains, whose iron weight sank into his holy limbs during his suffering. If, before he testified, he was so mighty to aid them that called upon him, how much mightier is he now since his victory. Blessed were the links, doomed to be changed from fetters and shackles, into a crown, which by touching the Apostle, made him a Martyr. Blessed were the chains, whose prisoner left them for the Cross of Christ, and which brought him thither, not as the instruments of condemnation, but of sanctification.
      status: verified
