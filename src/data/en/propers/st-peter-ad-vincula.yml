collect:
  text: |
    Let us pray.
    O God, who didst loose the blessed Apostle, Peter, from his chains and didst make him go forth unharmed, loose, we pray, the chains of our sins, and in thy mercy ward off from us every evil.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Thus saith the Lord unto Simon Peter: Whatsoever thou shalt bind on earth, shall be bound in heaven; and whatsoever thou shalt loose on earth, shall be loosed in heaven.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
    O God, who didst loose the blessed Apostle, Peter, from his chains and didst make him go forth unharmed, loose, we pray, the chains of our sins, and in thy mercy ward off from us every evil.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    Peter, whatever thou shalt bind on earth,
    The same is bound above the starry sky;
    What here thy delegated power doth loose,
    Is loosed in heaven's supremest court on high:
    To judgement shalt thou come, when the world's end is nigh.

    Praise to the Father, through all ages be;
    Praise to the consubstantial sovereign Son,
    And Holy Ghost, one glorious Trinity;
    To whom all majesty and might belong;
    So sing we now, and such be our eternal song.
    Amen.
  status: verified

lauds-capitulum:
  text: Herod the King stretched forth his hands, to vex certain of the Church. And he killed James, the brother of John, with the sword. And because he saw it pleased the Jews, he proceeded farther to take Peter also.
  citation: Acts 12:1-3
  status: verified

lauds-hymn:
  text: |
    Peter, blest shepherd, hearken to our cry,
    And with a word unloose our guilty chain;
    Thou! who hast power to open the gates on high
    To men below, and power to shut them fast again.

    Praise, blessing, majesty, through endless days,
    Be to the Trinity immortal given;
    Who in pure unity profoundly sways
    Eternally alike all things in earth and heaven. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Their sound hath gone * forth into all the earth.
    R. Their sound hath gone * forth into all the earth.
    V. And their words unto the ends of the world.
    R. Forth into all the earth.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Their sound hath gone * forth into all the earth.
  status: verified

lauds-versicle:
  text: |-
    V. You are Peter.
    R. And on this rock I am going to build my church.
  status: verified

