nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matthew 28:18-20
      text: 'At that time, Jesus said to His disciples: All power in heaven and on earth has been given to Me. Go, therefore, and make disciples of all nations, baptizing them in the Name of the Father, and of the Son, and of the Holy Spirit, teaching them to observe all that I have commanded you; and behold, I am with you all days, even unto the consummation of the world.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Gregory of Nazianzus, Bishop, Treatise on the Faith
      text: |-
        There is no Catholic but knoweth that the Father is a Very Father, the Son a Very Son, and the Holy Ghost a Very Holy Ghost, even as the Lord Himself saith unto His Apostles: "Go ye and baptize all nations in the Name of the Father, and of the Son, and of the Holy Ghost." This is that Perfect Trinity Who is but One Being, and of Whom therefore we testify that His Substance is one. For we make no division in God, as divisions are made in bodies, but we testify that, according to the power of the Divine Nature, Which standeth not in matter, the Persons named have a real existence, and that God is One.

        We do not say, as some have dreamt, that the Begetting of the Son of God is an outgrowing from one part to another part; neither do we say that He is the Word in the sense of a mere sound uttered by a voice, but we do believe that these three Names and the Persons meant by them are all of only One Being, One Majesty, and One Power. And therefore we testify that God is One, because this Oneness of His Majesty forbiddeth that we should use the plural form of speech and say "Gods." It is Catholic language to say "Father and Son," but we cannot and must not say that the Father and the Son are two gods. And that, not because the Son of God is not by Himself God — yea, He is Very God of Very God — but because we know that the Son of God is not from elsewhere, but from the One Father Himself, and therefore we say that God is One. This is the doctrine which Prophets and Apostles have delivered; this is the doctrine which the Lord Himself taught when He said, "I and the Father are One" — that is, He meant, as touching the one Divine Being; but as touching Persons, We are distinct.
      responsory: |-
        R. Let us bless the Father, and the Son, and the Holy Ghost: * let us praise and exalt Him above all for ever.
        V. Blessed art thou, O Lord, in the firmament of heaven: and above all to be praised and glorified for ever.
        R. Let us praise and exalt Him above all for ever.
      status: verified
