  text: 'With all our heart * and with all our voice do we acknowledge thee, praise thee, and bless thee: O God the Father Unbegotten, O God the Only-Begotten Son, O God the Holy Ghost the Comforter, one Holy and Undivided Trinity: to thee be glory for ever.'
  status: verified

