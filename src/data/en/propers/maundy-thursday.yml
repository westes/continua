collect:
  text: |
    V. Christ became obedient for us unto death.
    Our Father (said silently).
    Psalm 50 (Have mercy on me, O God).
    Look down, we beseech Thee, O Lord, upon this Thy family, for which our Lord Jesus Christ did not hesitate to be delivered into the hands of wicked men, and to undergo the torment of the Cross:
    Who liveth and reigneth with Thee in the unity of the Holy Ghost, God, world without end.
    (And it is concluded in silence.)
  status: draft

vespers-versicle:
  text: |
    V. 
    R. 
  status: verified

benedictus-antiphon:
  text: 'Now he that betrayed Him * gave them a sign, saying: Whomsoever I shall kiss, that same is He: hold Him fast.'
  status: verified

magnificat-antiphon:
  text: And as they were eating, * Jesus took bread, and blessed it, and broke it, and gave it to His disciples.
  status: verified

vespers-psalmody:
  groups:
    - psalms:
        - 115
      antiphon: I will take the cup of salvation; * and call upon the Name of the Lord.
    - psalms:
        - 119
      antiphon: With them * that hate peace I was peaceable; when I spoke unto them they fought against me without a cause.
    - psalms:
        - 139
      antiphon: O Lord, preserve me * from the wicked man.
    - psalms:
        - 140
      antiphon: Keep me * from the snare which they have laid for me, and the gins of the workers of iniquity.
    - psalms:
        - 141
      antiphon: 'I looked * on my right hand and beheld: but there was no man that would know me.'
