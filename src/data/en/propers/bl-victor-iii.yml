  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Pope Victor the Third, formerly called Desiderius, born of a family of the princes of Benevento, from his first years shone with exceptional piety and innocence of morals. Scarcely was his youth over when, shunning the earthly marriage which his parents had arranged, he secretly left his betrothed and sought the desert. His mother and kinsmen taking this ill, that he might not be turned from his holy purpose, he embraced the monastic life and successively changed various dwellings. He dwelt at the monastery of Cava, afterwards turned aside to the monastery of the island of Tremiti, and for a time hid among the hermits of Mount Majella. Then, when he had recovered from a grave illness, he ascended Monte Cassino, where on account of his singular virtues he was designated Abbot by the monks, and confirmed by Stephen the Ninth. By the same Pontiff's order he was sent as Legate to Constantinople to restore the communion of the Greek Church with the Apostolic See.

        Stephen having died, he returned to the monastery of Cassino, and shortly was proclaimed by Nicholas the Second cardinal of the holy Roman Church, and at the same time blessed as Abbot of Cassino. The same Pontiff and his successors destined him for the chief and most difficult affairs of the Church, without his being drawn away from the government of the monks; for he not only promoted the observance of the holy rule by increasing their number, but almost entirely rebuilt the monastery. The basilica, moreover, famous for the body of the holy father Benedict, he raised from the foundations so splendidly, and enriched with precious stones brought even from the shores of the East, with mosaic works and sacred furniture wrought with wonderful art and great cost, that it stands an illustrious monument of his munificence and genius. This basilica Alexander the Second consecrated in token of his goodwill toward Desiderius, in the presence of very many bishops and cardinals, among whom are worthy of memory St. Peter Damian and Hildebrand, who afterwards, taking the name of Gregory the Seventh, succeeded the same Alexander.

        When the same holy Gregory, near death, had designated him as most worthy to succeed him in the Apostolic See, Desiderius was elected Pontiff by common suffrage. But his humility then shone most, for he declined so great a dignity for almost a whole year. Induced at length by the earnest prayers of prelates, princes and people, in the Synod of Capua he took the name of Victor and the insignia of the supreme pontificate. Led to Rome, he was consecrated with solemn rite, the antipope Guibert and the men of his faction being cast out thence. He sent an army, gathered under the banner of St. Peter from almost the whole of Italy, against the Saracens into Africa, where, battle being joined, he utterly routed their ranks. At Benevento, a synod having been assembled, he struck the schismatics with anathema, and entirely proscribed investitures, which oppressed the Church's freedom in elections; and he decreed many other things pertaining to ecclesiastical discipline. The synod ended, seized by a deadly illness, he wished to be carried by the Cardinals and Bishops accompanying him to Cassino, where, worn out by labours and hardships undertaken to conciliate the peace of the Church, he gave his soul to God, illustrious for sanctity and miracles, in the year one thousand and eighty-seven. He sat from the day of his consecration four months and seven days; and his body is venerated with the greatest veneration in the Cassinese basilica.
      status: draft
