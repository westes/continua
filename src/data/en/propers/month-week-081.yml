magnificat-antiphon/~-first:
  text: Wisdom * hath builded her house, she hath hewn out her seven pillars, she hath broken the nations under her in the greatness of her strength, she hath trodden under her feet the necks of such as be haughty and proud.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Enarrationes in Psalmum CXVIII, Sermon 5
      text: |-
        The Prophet saith that "the fear of the Lord is the beginning of wisdom." And what is the first act of wisdom but to renounce the world, since to love the things of the world is folly? So indeed saith the Apostle, "The wisdom of this world is foolishness with God." (1 Cor. 3:19.) But the very fear of the Lord itself is useless, nay, harmful, if it be not according to knowledge. The Jews have a truly fervent zeal for God, but since they have not knowledge, their very zeal and fear do cause them to do things contrary to God's will. That they circumcise their children, that they keep holy the Sabbath-Day, showeth how they fear the Lord, but knowing not the spiritual meaning of the Law, they circumcise the body and not the heart.

        But wherefore should I speak of Jews? There are those among ourselves who have the fear of God, but not according to knowledge, and set up hard ordinances which the weakness of man is not able to bear. They fear God in this, that they seem to themselves to be looking to discipline, and to be enforcing the practice of godliness, but they lack knowledge, in that they feel not for the weakness of nature, nor consider whether a thing can, or cannot be done. Let not then the fear of God be unreasonable. True wisdom beginneth with the fear of God, neither is it spiritual wisdom without the fear of God, but neither ought the fear of God to be without wisdom.

        Holy fear is the foundation of all good instruction. Just as a statue is set up upon a pedestal, and thereby receiveth both beauty and strength, even so doth it become the word of God to be set forth based upon an holy fear, and it is in the heart of him that feareth that it getteth the firmest root, even an home wherefrom it droppeth not, neither do the fowls of the air come and carry it away, as from the heart of him that is careless and deceiving.
      responsory: |-
        R. Give me wisdom, O Lord, that sitteth by thy throne, and reject me not from among thy children. * For I am thy servant and son of thine handmaid.
        V. O send her out from the throne of thy glory, to be with me and to labour with me.
        R. For I am thy servant and son of thine handmaid.
      status: verified
