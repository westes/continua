nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        James, the Son of Zebedee and brother of the Apostle John, was a Galilean, and with his brother one of the first of His Apostles whom the Lord called, whileas they were in a ship with Zebedee their father, mending their nets, and they immediately left the ship, and their father, and followed Him. And He surnamed them Boanerges, which is, The sons of thunder. Peter, and James, and John, were the three Apostles whom the Saviour loved best; them He took and brought up into an high mountain apart, and was transfigured before them; when He went to the house of the ruler of the synagogue to raise his daughter from the dead, He suffered no man to follow Him save Peter, and James, and John; and, at the last, just before the Jews took Him, when He cometh unto a place called Gethsemane, and saith unto the disciples: Sit ye here, while I go and pray yonder. He took with Him Peter and the two sons of Zebedee.

        After that Jesus Christ was ascended into heaven, James preached how that He was God, and led many in Judaea and Samaria to the Christian Faith. A while afterward, he went to Spain, and there he brought some to Christ, of whom seven were afterwards ordained Bishops by Blessed Peter, and were the first such sent into that country. From Spain James went back to Jerusalem, where he taught the Faith to diverse persons, and, among others, to the Magician Hermogenes. Thereupon Herod Agrippa, who had been raised to the kingdom under the Emperor Claudius, to curry favour with the Jews, condemned James to death for his firm confession that Jesus Christ is God. The officer who led James to the judgment-seat, at sight of the courage wherewith he was ready to offer up his testimony, declared himself also to be a Christian.

        As they were being hurried to execution, this man asked pardon of James, and the Apostle kissed him, saying, Peace be unto thee. James healed a paralytic, and immediately afterwards both the prisoners were beheaded. The body of the Apostle was afterwards taken to Compostella, where his grave is very famous. Multitudes of pilgrims from all parts of the earth betake themselves thither to pray, out of sheer piety or in fulfilment of vows. The Birthday of James is kept by the Church upon this day, which is that of the bringing of his body to Compostella. It was about Easter-time that he bore witness to Jesus Christ with his blood, at Jerusalem, being the first of the Apostles to do so.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 20:20-23
      text: 'At that time, the mother of the sons of Zebedee came to Jesus with her sons, adoring and asking something of Him. And He said to her: What wilt thou? She saith to Him: Say that these my two sons may sit, the one on Thy right hand and the other on Thy left, in Thy kingdom. And Jesus answering, said: You know not what you ask. Can you drink the chalice that I shall drink? They say to Him: We can. He saith to them: My chalice indeed you shall drink; but to sit on My right hand or left is not Mine to give to you, but to them for whom it is prepared by My Father.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Homily 66 on Matthew (on Matt 20:20-23)
      text: 'Let no man be troubled if we say that the Apostles were still imperfect, for the mystery of the Cross was not yet finished, the grace of the Spirit had not yet been shed abroad in their hearts. If thou wilt behold them in their strength, consider them such as they became after the grace of the Spirit was given them, and thou wilt perceive that they had trodden under foot every vain desire. This is the cause wherefore their present imperfection is made known unto us, that is, that thou mayest see how great a change could be forthwith wrought by grace. But nevertheless let us now look how they came unto Christ, and what they said. Master, they said, we would that Thou shouldest do for us whatsoever we shall desire. And He said unto them: What would ye that I should do for you? not, surely, that He knew not what their wish was, but that He would make them answer, and so uncover the wound, to lay a plaster upon it.'
      status: verified
