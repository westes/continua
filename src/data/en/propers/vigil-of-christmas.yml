collect:
  text: |
    Let us pray.
    O God, thou Who gladden us year after year with the expectation of our redemption, grant that we, who now welcome with joy thy only-begotten Son as our Redeemer, may also gaze upon Him without fear when He comes as our judge, our Lord Jesus Christ, thy Son:
    Who liveth and reigneth with thee, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: verified

prime-lectio:
  text: By whom we have received grace and apostleship for obedience to the faith, in all nations, for his name, among whom are you also the called of Jesus Christ.
  citation: Rom 1:5-6
  status: verified

benedictus-antiphon:
  text: The Saviour of the world * shall rise like the sun, and come down into the womb of the Virgin as the showers upon the grass, alleluia.
  status: verified

lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: 'O Judah and Jerusalem, * fear not: tomorrow ye shall go out, and the Lord will be with you.'
    - psalms:
        - 99
      antiphon: This day ye shall know * that the Lord cometh and in the morning, then ye shall see His glory.
    - psalms:
        - 62
      antiphon: On the morrow * the sins of the earth shall be washed away, and the Saviour of the world will be our King.
  canticle:
    id: canticum-trium-puerorum
    antiphon: The Lord cometh! * Go ye out to meet Him, and say How great is His dominion, and of His kingdom there shall be no end! He is the Mighty God, the Ruler, the Prince of Peace, Alleluia!
  laudate:
    antiphon: On the morrow * ye shall be saved, saith the Lord God of hosts.

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matt 1:18-21
      text: When as his mother Mary was espoused to Joseph, before they came together, she was found with child, of the Holy Ghost. And so on.
      status: verified
      responsory: |
        R. Sanctify yourselves today, and be ready; for on the morrow, ye shall see
        * The majesty of God upon you.
        V. This day ye shall know that the Lord cometh, and in the morning, then ye shall see.
        R. The majesty of God upon you.
    - nocturn: 1
      isGospel: false
      source: Homily by St. Jerome, Priest (at Bethlehem), Book of Commentaries, on Matth. i.
      text: Why was the Lord conceived of an espoused virgin rather than of a free? First, for the sake of the genealogy of Mary, which we have obtained by that of Joseph. Secondly, because she was thus saved from being stoned by the Jews as an adulteress. Thirdly, that Himself and His mother might have a guardian on their journey into Egypt. To these, Ignatius, the martyr of Antioch, has added a fourth reason namely, that the birth might take place unknown to the devil, who would naturally suppose that Mary had conceived by Joseph.
      status: verified
