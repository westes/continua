nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Sixtus, the third of that name, a Roman by country, the son of Sixtus, on the death of holy Celestine was set at the head of the Roman Church as bishop, with wonderful peace and consent of the whole City. While still a priest, holy Augustine eminently commended him, both because he first pronounced anathema on the Pelagians before a crowded people, and because he vehemently fought their error in his writings. When he took up the helm of the Roman priesthood, he published in a volume the decree of the Synod of Ephesus against Nestorius, and gave it to the churches of East and West, confirming that, two natures remaining perfect in Christ, one person of the Son of God is to be believed. On which matter, both to Nestorius himself and to the bishops of the East, he directed letters to cut off his error, writing among other things to the bishop of Antioch: Let no further novelty be allowed, because nothing should be added to antiquity; let the clear faith and belief of our forefathers be disturbed by no admixture of filth.

        Being admonished by blessed Peter the Apostle appearing to him in a vision, together with holy Apollinaris his disciple, first bishop of the church of Ravenna, whom he ought to ordain pontiff of the same church, he set over the Ravennates, against their opinion, Peter, deacon of the church of Forum Cornelii, as bishop, whom the admirable holiness of his morals and his learning, by surname Chrysologus, wonderfully commended. When, however, Sixtus refused that the property of the Church be alienated, and strove to relieve the burdened, he turned upon himself the hatred of Anicius Bassus, ex-consul, and of the patrician Marinian, by whom, harassed with a base calumny, he willed of his own accord that his cause be judged in a synod. And so in the basilica of Helena, which is called the Sessorian Atrium, a council of fifty-six bishops being assembled, in the presence of the Emperor Valentinian, with the whole clergy and senate, Sixtus was declared innocent, but Bassus and Marinian were condemned and proscribed as calumniators, and the goods of Bassus were adjudged to the church; and when Bassus died within three months by divine vengeance, Sixtus, returning good for evil, laid him out himself with his own hands with linens and spices and buried him at the blessed Apostle Peter, in the sepulchre of his ancestors.

        This venerable Pontiff did many magnificent things in the City; for he bestowed on the churches silver and gold vessels and many possessions. He restored the basilica of St. Mary Major at the Crib, and adorned it with golden metals and sacred images. He made also in the Constantinian basilica an ornament above the font which was not there before; for he caused to be set up the marble architraves and porphyry columns which Constantine Augustus had left gathered together, and adorned them with verses. At his request also, Valentinian Augustus restored in the same Constantinian basilica the silver ciborium taken away by the barbarians; in the principate of which emperor and of Theodosius, Sixtus went the way of all flesh and rested in the Lord, and was buried on the Tiburtine Way, in the crypt beside the body of the holy Martyr Lawrence. In one ordination in the month of December he created twenty-eight priests, twelve deacons, and fifty-two bishops for various places, and ruled the Church seven years and eleven months.
      status: draft
