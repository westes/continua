nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Gregory Nazianzen, Sermon 20, On the Maccabees
      text: |-
        Eleazar was the first-fruits of those who suffered before the coming of Christ, even as Stephen was the first-fruits of those who suffered after that coming. He was a Priest and an Elder, grey in years, and grey also in wisdom. Once he had sacrificed and prayed for the people, but now the time came when he offered himself to God as a burnt sacrifice without blemish, a peace-offering for all the people, a blessed beginning in that struggle whereunto his words and his silence were alike their exhortation. He presented likewise the bodies of seven children, the offspring of his teaching, a living sacrifice, holy, acceptable unto God, (Rom. 12:1,) an oblation more glorious and more pure than any legal offering, for to give the father credit of his children is most meet and right.

        There stood the noble and highminded lads, the gallant sons of a noble mother, the glorious champions of the truth, men to whom the epoch of Antiochus was an anachronism, true disciples of the Law of Moses, straitest of the observers of the rites of their forefathers, in that seven-fold number which the Hebrews bless, and which is hallowed and worshipful through the reckoning of Sabbath — there they stood, with one longing, and one aim, looking to one road to life, even to receive death for God's sake; there they stood, brethren in soul not less than in body, only covetous one of the other's death. O what a mystery! They snatched at agony as at treasure, and perilled themselves for the teaching of the Law, with no more fear for what was before than regret for what was behind. Their dread was but one, even lest any should go uncrowned, lest brother should be unwillingly parted from brother, and be saved from the torment of the conflict to gain a disastrous victory.

        There stood the brave and noble mother, burning with love of her children and of God, with her heart rent as few human hearts are riven. Her agony was not so much on account of the tortures which her children suffered, as from fear lest they should shrink therefrom. She yearned not more over those who left this life than she prayed that they who were left might join them; her anxiety was for the living rather than for the dead. The living were still contending, the dead had safely left the field; concerning the living she was straitened in not knowing how God would receive them, the dead she knew that God had joined unto Himself. O what a manly soul in a woman's body! O what an admirable growth of a great soul!
      responsory: |-
        R. Be ye not afraid of the assault of the enemy; remember how our fathers were delivered. * Now, therefore, let us cry unto heaven, and our God will have mercy upon us.
        V. Remember His marvellous works that He hath done unto Pharaoh and his host in the Red Sea.
        R. Now, therefore, let us cry unto heaven, and our God will have mercy upon us.
