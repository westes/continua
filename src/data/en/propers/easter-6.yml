nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, On Belief in the Resurrection
      text: |-
        Since it was impossible that the Wisdom of God could die, and that which could not die could not rise from the dead, He took to Himself Flesh Which could die, that That Whose nature it was to die might die, and rise again. Neither was it possible that the resurrection of the dead should come otherwise than by man, "for since by man came death, by Man came also the resurrection of the dead." Man He rose since Man He died, the Manhood quickened but the Godhead Quickener. Man then, as touching the Flesh: God, now, over all things. For now we know Christ no longer after the Flesh, but we owe it to the Flesh that we know Him as "become the First-fruits of them that slept" "and the First-begotten of the dead."

        The first-fruits are of the same kind and nature as the other fruits, and they are brought as an offering to God, to win His blessing on the in-gathering, an holy offering made on behalf of all, and as it were the homage of restored nature. Christ then is the First-fruits of them that sleep. But is He the First-fruits of only His own loved ones that fall asleep in Him, and lie as it were untouched by death, wrapt in a sweet slumber? Or is He the First-fruits of all the dead? But "as in Adam all die, even so in Christ shall all be made alive." So that, as in Adam were the first-fruits of the death wherein all die, even so in Christ were the first-fruits of the resurrection, wherein all rise again. But let no man be hopeless, neither let it be a grief to the righteous to remember that to rise again will be common to all men, when he looketh for that day wherein the harvest of his life will nobly realise itself. All shall rise again, "but," as saith the Apostle, "every man in his own order." The harvest of God's mercy will be for all, but in reward one man shall differ from another.

        I tell you how grievous an outrage against God it is not to believe in the resurrection. If we shall not rise again, then did Christ die in vain, then is Christ not risen. For if He rose at all, He rose for us, and if He had not us to rise for, then He is plainly not risen. In Him the world, in Him the heavens, in Him the earth rose again. For there shall be "a new heaven, and a new earth." For Himself He needed not to rise, Whom the bands of death held not. For although He died as Man, yet was He free in the netherworld itself. Wouldest thou hear how free? "I am as a man that hath no strength, free among the dead." O how free, Who was able to take up his life again at will, even as it is written that He said: "Destroy this Temple, and in three days I will raise it up." O how free, Who descended into hell only to redeem others therefrom.
      responsory: |-
        R. One of the seven Angels talked with me, saying: Come hither, I will show thee the bride, the Lamb's wife. * And I saw Jerusalem descending out of heaven, adorned with her jewels. Alleluia, Alleluia, Alleluia.
        V. And he carried me away in the Spirit to a great and high mountain.
        R. And I saw Jerusalem descending out of heaven, adorned with her jewels. Alleluia, Alleluia, Alleluia.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 16:23-30
      text: 'At that time, Jesus said to His disciples: Amen, amen I say to you: if you ask the Father any thing in my name, he will give it you. Hitherto you have not asked any thing in my name. Ask, and you shall receive; that your joy may be full. These things I have spoken to you in proverbs. The hour cometh, when I will no more speak to you in proverbs, but will shew you plainly of the Father. In that day you shall ask in my name; and I say not to you, that I will ask the Father for you: For the Father himself loveth you, because you have loved me, and have believed that I came out from God. I came forth from the Father, and am come into the world: again I leave the world, and I go to the Father. His disciples say to him: Behold, now thou speakest plainly, and speakest no proverb. Now we know that thou knowest all things, and thou needest not that any man should ask thee. By this we believe that thou camest forth from God.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 102 on the Gospel of John
      text: |-
        We have now to consider these words of the Lord: "Amen, Amen, I say unto you, Whatsoever ye shall ask the Father in My Name, He will give it you." It hath already been said in the earlier part of this discourse of the Lord, for the sake of some who ask the Father in Christ's Name and receive not, that whatsoever is asked, which tendeth not to salvation, is not asked in the Name of the Saviour. By the words "In My Name" we must not understand the vocalization of letters and syllables, but the meaning of what is said, the honest and true meaning.

        Therefore, whosoever thinketh of Christ as he ought not to think of the Only Son of God, such an one doth not ask anything in Christ's Name, although he do actually utter letters and syllables to that effect, because by these sounds he meaneth not the Real Christ, but a fancied being who hath no existence except in the speaker's imagination. But on the other hand, whosoever thinketh of Christ as he ought to think, the same asketh in Christ's Name, and receiveth, provided only it be nothing against his own everlasting salvation: but if it is good for him to receive, he receiveth. Some things are not given at once, but kept over till a more fitting season. Such is the true interpretation of the words "He will give it you": namely, that those things will be given which are good for them to ask. All the Saints also are heard when they ask for themselves, but not necessarily when they ask for their friends, or their enemies, or others, even as it is written, not simply "He will give it" but "He will give it you."

        Hitherto, saith the Lord, have ye asked nothing in My Name? "Ask, and ye shall receive, that your joy may be full." This their joy, whereof He saith that it shall be full, is to be understood not of fleshly but of spiritual joy: and when that joy is so great that it can be increased no more, then shall it without doubt be full. Whatsoever therefore we ask for the fulfilling of this joy, (that is, if we thereby mean grace, if we ask for that life which is the really blessed one,) that is a thing which it is meet to ask in Christ's Name. If we ask anything else than this, we ask nothing, although we do actually ask something, because all things are nothing in comparison with this.
      responsory: |-
        R. I will sing a new song unto thee, O God, alleluia. * Upon a psaltery of ten strings will I sing praises unto thee, alleluia, alleluia.
        V. Thou art my God, and I will praise thee: Thou art my God, and I will exalt thee.
        R. Upon a psaltery of ten strings will I sing praises unto thee, alleluia, alleluia.
      status: verified
