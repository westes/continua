collect:
  text: |
    Let us pray.
    O Almighty God, grant, we beseech thee, that as many as, to afflict the body, do abstain from meats, may, by following after righteousness, fast from sin.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'Jesus stooped down, * and wrote on the ground: He that is without sin, let him cast a stone at her.'
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: John 8:1-11
      text: At that time, Jesus went to the Mount of Olives. And at daybreak He came again into the temple, and all the people came to Him; and sitting down He began to teach them. Now the Scribes and Pharisees brought a woman caught in adultery, and setting her in the midst, said to Him, "Master, this woman has just now been caught in adultery. And in the Law Moses commanded us to stone such persons. What, therefore, do You say?" Now they were saying this to test Him, in order that they might be able to accuse Him. But Jesus, stooping down, began to write with His finger on the ground. But when they continued asking Him, He raised Himself and said to them, "Let him who is without sin among you be the first to cast a stone at her." And again stooping down, He began to write on the ground. But hearing this, they went away, one by one, beginning with the eldest. And Jesus remained alone, with the woman standing in the midst. And Jesus, raising Himself, said to her, "Woman, where are they? Has no one condemned you?" She said, "No one, Lord." Then Jesus said, "Neither will I condemn you. Go your way, and from now on sin no more."
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, 33rd Tract on John
      text: |-
        Jesus went unto the Mount of Olives, even unto that fruitful Mount, that anointing Mount, that Mount of Chrism. Where else became it Christ to teach, if not on the Mount of Olives? For the word Christ is derived from Chrisma, and Chrisma is the Greek for ointment. He hath anointed us that we may be able to wrestle with the devil. And, early in the morning, He came again into the temple; and all the people came unto Him; and He sat down, and taught them and no man laid hands on Him, because He was not yet pleased to suffer. And now listen how His enemies tried the Lord's meekness.

        And the Scribes and Pharisees brought unto Him a woman taken in adultery; and when they had set her in the midst, they say unto Him: Master, this woman was taken in adultery, in the very act. Now, Moses in the law commanded that such should be stoned; but what sayest Thou? This they said, tempting Him, that they might have to accuse Him. Whereof to accuse Him? Had they taken Him in any sin? Or was the woman said to have anything to do with Him?

        We must understand, my brethren, that there was a wonderful gentleness in the Lord. They knew that He was most mild and most gentle. Of Him indeed it had been said of old time: Gird thy sword upon thy thigh, O most Mighty! In thy comeliness and thy beauty go forward, fare prosperously, and reign, because of truth, and meekness, and righteousness. And He came bringing truth as one that teacheth, meekness as one that delivereth, and righteousness as one that knoweth. Because of these it was that the Prophet declared, in the Holy Ghost, that He was to reign. Whenever He spake, truth shone forth whenever He spared His enemies, meekness was made glorious. And His enemies, racked with envy and hatred by His truth and His meekness, laid a stumbling-block for His righteousness.
      responsory: |-
        R. We are verily guilty concerning our brother, in that we saw the anguish of his soul, when he besought us, and we would not hear. * Therefore is this distress come upon us.
        V. And Reuben answered his brethren, saying, Spake I not unto you, saying, Do not sin against the child; and ye would not hear?
        R. Therefore is this distress come upon us.
      status: verified
