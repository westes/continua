nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Juliana was a daughter of the noble family of the Falconieri, and was born in the year 1270. Her father was the same who at his own costs so splendidly built from the foundations the Church of Our Lady of the Annunciation as it now standeth at Florence. Her mother's name was Reguardata. They were both well stricken in years, and, until the birth of Juliana, had been childless. From her very cradle she gave tokens of the holiness of life to which she afterwards attained. And from the murmuring of her baby lips was caught the sweet sound of the names of Jesus and Mary. As she entered on her girlhood, she delivered herself up entirely to the pursuit of Christian godliness, and so excellently shone therein, that her uncle, the Blessed Alexius, scrupled not to tell her mother that she had given birth to an Angel rather than to a woman. So modest was her carriage, and so clean her soul from the lightest speck of indiscretion, that she never in her whole life stared a man in the face, and the very mention of sin made her shiver. Before she had finished her fifteenth year, she renounced her inheritance, although a rich one, and all prospect of an earthly marriage, and made to God a vow of virginity, before holy Philip Benizi, from whom she was the first to receive the religious habit of what are called the mantled nuns.

        Many of the noblest ladies followed Juliana's example, and her own mother gave herself over to her daughter to be instructed in the religious life; so, their number growing little by little, she founded the Order of Mantled Nuns, and gave them a rule of life full of wisdom and godliness. Holy Philip Benizi, having thorough knowledge of her excellence, chose her above all, as he lay dying, to whom to commend not the women only but the whole Order of the Servants of Mary, of which he had been the propagator and director. Juliana, who deemed ever lowly of herself, even when she was the mistress of the others, ministered to her sisters in the meanest offices of the house. She passed whole days in incessant prayer, and was often rapt in ecstasy, and the rest of her time she spent making peace among the citizens who were at variance, recalling transgressors from the ways of iniquity, and nursing the sick, sometimes even using her own mouth to draw the matter from their sores and so restore them to health. It was her custom to afflict her own body with whips, knotted cords, iron girdles, watchings, and sleeping upon the bare ground. On four days of the week she ate very sparingly of poor food, and on the other two was content with only the Bread of Angels, save on Saturday, when she was nourished by bread and water alone.

        This hard manner of living brought upon her a disease of the stomach, which grew worse until, at the age of seventy, she was brought to the very end of her life. She bore the discomforts of her long illness with a cheerful countenance and a steady heart, and was heard to complain of but one thing: that, being unable to take or keep down any food, she was kept by reverence for the Sacrament from the Eucharistic table. In this distress she begged the priest to bring the divine Bread, which she could not receive with her mouth, and lay It at least outwardly upon her breast. The priest granted her prayer, and — wondrous thing! — at that very moment the divine Bread vanished from sight, and Juliana breathed her last with a peaceful and smiling face. This marvel remained beyond belief until, as the virgin body was being laid out in the customary manner, there was found upon the left side of her breast, as if stamped into the flesh by a seal, the form of a Host bearing the image of Christ crucified. The fame of this wonder and of her other miracles won her veneration not only from Florence but from the whole Christian world, and grew over nearly four entire centuries, until at length Pope Benedict XIII ordered a proper Office in her honor to be recited by the whole Order of the Servants of the Blessed Virgin Mary; and Clement XII, a most generous protector of that same Order, seeing her shine with new miracles day by day, enrolled her among the holy Virgins.
      status: verified
