collect:
  text: |
    Let us pray.
    O God, Who in thy kindness gave blessed Anne the grace to be the mother of her who mothered thy only-begotten Son, graciously grant that we who keep her feast may be helped by her intercession with thee. Through the same Jesus Christ, thy Son, Our Lord, Who liveth and reigneth with thee in the unity of the Holy Ghost, God, world without end.

    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Give her of the fruit of her hands, and let her own works praise her in the gates.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Who in thy kindness gave blessed Anne the grace to be the mother of her who mothered thy only-begotten Son, graciously grant that we who keep her feast may be helped by her intercession with thee. Through the same Jesus Christ, thy Son, Our Lord, Who liveth and reigneth with thee in the unity of the Holy Ghost, God, world without end.

    R. Amen.
  status: verified

matins-hymn:
  text: |
    O mother Anne, rejoice!
    O mother blest, applaud:
    Your daughter has been born today:
    The Mother of our God.

    The Virgin Mary born!
    A new parental bliss!
    Rejoice, rejoice with Joachim
    For such a babe as this!

    Your daughter is the first
    Of blessings we receive,
    Renewing earth whose early dawn
    Was cursed because of Eve.

    And so we give you praise,
    And banners raise today,
    And ask that through your holy prayers
    Our sins be washed away.

    To God the Father, praise,
    And glory to the Son,
    And honor to the Spirit bright:
    Blest Trinity in One.
    Amen.
  status: verified

lauds-hymn:
  text: |
    The daystar follows the night,
    and soon the dawn follows him,
    foretelling the rising of the sun
    that lights the world with its radiance.

    Christ is the sun of justice,
    the Mother of grace the dawn,
    whom Anne, shining red, goes before,
    driving away the shadows of the Law.

    Anne, most fruitful root,
    thou saving tree,
    bringing forth the flowering branch
    that bore Christ to us.

    Glory to thee, O Lord,
    who wast born of the Virgin,
    with the Father and the Holy Spirit,
    for everlasting ages.
    Amen.
  status: draft

vespers-hymn:
  text: |
    Let the whole assembly of the saints
    praise the Mother of the Virgin,
    from whose childbearing
    the salvation of man proceeded.

    She most devoutly asked a child
    of the Father of lights,
    and most worthily merited
    Mary, the glory of virgins.

    Of Joachim, whom she had
    as a husband of exceptional life,
    Anne bore Mary,
    the Mother of the King of justice.

    The famous stock of Jesse washed away
    the reproach of mother Eve,
    when Anne bore a child,
    the flower of all the saints.

    Glory to thee, O Lord,
    who wast born of the Virgin,
    with the Father and the Holy Spirit,
    for everlasting ages.
    Amen.
  status: draft

benedictus-antiphon:
  text: Give her of the fruit of her hands, and let her own works praise her in the gates.
  status: verified

magnificat-antiphon:
  text: She spreadeth out her hand to the poor, * yea, she reacheth forth her hands to the needy, and eateth not the bread of idleness.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. John of Damascus, Sermon 2 on the Nativity of the B.V.M.
      text: |-
        The home of Anne is set before us, wherein to see an example both of married and of maiden life, the one in the person of the mother, the other in that of the daughter, whereof the one hath but now ceased to be barren, and the other is in a little while destined, beyond the course of nature, to become the Mother of the Messiah by a singular birth, specially designed by God to build up anew our nature. It is with reason then that Anne, filled with the Holy Ghost, with joyful and jubilant spirit singeth aloud: Rejoice with me, for out of my barren womb I have borne the bud of promise, and, as I have longed, I nourish at my breasts the fruit of benediction. I have laid aside the mournful garments of barrenness, and put on the joyful raiment of fruitfulness. Let Hannah the adversary of Peninnah make merry with me, and join with me for fellow-feeling, in singing of this new and unhoped-for wonder that is wrought in me.

        Let Sarah be glad that was joyfully pregnant in her old age, and was a shadow cast before of my conception that hitherto have been barren. Let all the barren and fruitless break forth into singing, when they behold in what wondrous wise I have been visited from heaven. Let all mothers likewise, that like Anne are gifted with fruitfulness, say: Blessed be He That gave their desire unto them that besought Him, That gave fruitfulness unto her that was barren, and That granted unto her that from her should bud forth the joy-bringing Virgin, who, according to the flesh, was Mother of God, and whose womb was a heaven wherein He dwelt Whom no place can contain. Let us also with them offer our praises to her that was called barren, but now is become the mother of a maidchild; let us say unto her in the words of the Scripture: O how blessed is the house of David from whence thou art sprung, and that womb wherein God hath fashioned the ark of His holiness, that is, her, by whom He was Himself conceived without man's seed.

        Blessed art thou, and thrice blessed, whom God hath so blessed as to make thee to bring forth, as His own gift, the babe Mary, whose very name is highly honourable, out of whom Christ, the Flower of life, blossomed, a maiden whose rising is glorious, and whose delivery is worth more than the world. We also, O woman most blessed, do wish thee joy. In sooth thou hast brought forth what we have all hoped for, and God hath given us, namely, the babe of promise. Blessed indeed art thou, and blessed is the fruit of thy womb. The tongues of all the godly do magnify thine offspring, and every glad word is spoken concerning her of whom thou art delivered. Meet in truth is it, and most meet to praise her who received a revelation from the goodness of God, and bore for us such and so great a fruit, from whom sweet Jesus sprang.
      status: verified
