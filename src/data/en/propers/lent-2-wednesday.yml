collect:
  text: |
    Let us pray.
    Look down in mercy upon thy people, O Lord, we beseech thee, and grant unto them, whom Thou commandest to abstain from fleshly meats, power to abstain also from the corruption of sin.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    God, the Renewer and Lover of innocency, turn the hearts of all thy servants to thyself, that so they, being enkindled with the fire of thy Spirit, may be found ever rooted in faith, and fruitful in works.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

