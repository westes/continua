collect:
  text: |
    Let us pray.
    O God, who by the Immaculate Conception of the Virgin didst prepare a worthy dwelling
    place for thy Son, we humbly beseech thee; that we, who celebrate the appearance of the
    same Virgin, may obtain health of soul and body.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. O Mary * blessed art thou that didst believe! for there shall be a performance of those things which were told thee from the Lord. Alleluia.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, who by the Immaculate Conception of the Virgin didst prepare a worthy dwelling place for thy Son, we humbly beseech thee; that we, who celebrate the appearance of the same Virgin, may obtain health of soul and body.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: John 19:25-27
      text: 'At that time: There stood by the cross of Jesus, his mother, and his mother''s sister, Mary of Cleophas, and Mary Magdalen. When Jesus therefore had seen his mother and the disciple standing whom he loved, he saith to his mother: Woman, behold thy son. After that, he saith to the disciple: Behold thy mother. And from that hour, the disciple took her to his own.'
      status: verified
