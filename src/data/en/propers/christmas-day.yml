collect:
  text: |
    Lord have mercy upon us, Christ have mercy upon us, Lord have mercy upon us.
    Our Father, who art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done on earth as it is in heaven. Give us this day our daily bread. And forgive us our trespasses, as we forgive those who trespass against us.
    V. And lead us not into temptation:
    R. But deliver us from evil.
    V. O Lord, hear my prayer.
    R. And let my cry come unto thee.
    Let us pray.
    Grant, we beseech thee, almighty God, that the new birth of thy Only-begotten Son as man may set us free, who are held by the old bondage under the yoke of sin.
    Through the same Jesus Christ, thy Son, Our Lord, Who liveth and reigneth with thee in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration/octave-~:
  text: |
    Ant. This day the Christ is born: this day the Saviour is appeared; this day the Angels sing praise in the earth and the Archangels rejoice; this day the righteous are glad and say: Glory to God in the highest. Alleluia.
    V. The Lord hath made known, alleluia.
    R. His salvation, alleluia.
    Let us pray.
    Grant, we beseech thee, almighty God, that the new birth of thy Only-begotten Son as man may set us free, who are held by the old bondage under the yoke of sin.
    Through the same Jesus Christ, thy Son, Our Lord, Who liveth and reigneth with thee in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

matins-hymn:
  text: |
    Jesus, the Ransomer of man,
    Who, ere created light began,
    Didst from the sovereign Father spring,
    His power and glory equalling.

    The Father’s Light and Splendor Thou,
    Their endless hope to Thee that bow;
    Accept the prayers and praise to-day
    That through the world Thy servants pay.

    Salvation’s Author, call to mind
    How, taking form of humankind,
    Born of a Virgin undefiled,
    Thou in man’s flesh becam’st a Child.

    Thus testifies the present day,
    Through every year in long array,
    That Thou, salvation’s source alone,
    Proceedest from the Father’s throne.

    The heavens above, the rolling main
    And all that earth’s wide realms contain,
    With joyous voice now loudly sing
    The glory of their new-born King.

    And we who, by Thy precious Blood
    From sin redeemed, are marked for God,
    On this the day that saw Thy birth,
    Sing the new song of ransomed earth.

    O Lord, the Virgin-born, to Thee
    Eternal praise and glory be,
    Whom with the Father we adore
    And Holy Ghost forevermore.
    Amen.
  status: verified

