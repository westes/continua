nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: From the Sermons of Pope St. Leo (the Great), 1st for Christmas
      text: |
        Dearly beloved brethren, Unto us is born this day a Saviour, Luke ii. 11. Let us rejoice. It would be unlawful to be sad to day, for today is Life's Birthday; the Birthday of that Life, Which, for us dying creatures, taketh away the sting of death, and bringeth the bright promise of the eternal gladness hereafter. It would be unlawful for any man to refuse to partake in our rejoicing. All men have an equal share in the great cause of our joy, for, since our Lord, Who is the destroyer of sin and of death, findeth that all are bound under the condemnation, He is come to make all free.

        Rejoice, O thou that art sinful, thy Saviour offereth thee pardon! Rejoice also, O thou Gentile, God calleth thee to life! For the Son of God, when the fulness of the time was come, which had been fixed by the unsearchable counsel of God, took upon Him the nature of man, that He might reconcile that nature to Him Who made it, and so the devil, the inventor of death, is met and beaten in that very flesh which hath been the field of his victory.

        When our Lord entered the field of battle against the devil, He did so with a great and wonderful fairness. Being Himself the Almighty, He laid aside His uncreated Majesty to fight with our cruel enemy in our weak flesh. He brought against him the very shape, the very nature of our mortality, yet without sin. ~Heb. iv. 15. His birth however was not a birth like other births for no other is born pure, nay, not the little child whose life endureth but a day on the earth. To His birth alone the throes of human passion had not contributed, in His alone no consequence of sin had had part. For His Mother was chosen a Virgin of the kingly lineage of David, and when she was to grow heavy with the sacred Child, her soul had already conceived Him before her body. She knew the counsel of God announced to her by the Angel, lest the unwonted events should alarm her. The future Mother of God knew what was to be wrought in her by the Holy Ghost, and that her modesty was absolutely safe.

        Therefore, dearly beloved brethren, let us give thanks to God the Father, through His Son, in the Holy Ghost: Who, for His great love wherewith He loved us, hath had mercy on us and, even when we were dead in sins, hath quickened us together with Christ, Eph. ii. 4, 5, that in Him we might be a new creature, and a new workmanship. Let us then put off the old man with his deeds Col. iii. 9; and, having obtained a share in the Sonship of Christ, let us renounce the deeds of the flesh. Learn, O Christian, how great thou art, who hast been made partaker of the Divine nature, 2 Pet. i. 4, and fall not again by corrupt conversation into the beggarly elements above which thou art lifted. Remember Whose Body it is Whereof thou art made a member, and Who is its Head, 1 Cor. vi. 15. Remember that it is He That hath delivered thee from the power of darkness and hath translated thee into God's light, and God's kingdom, Col. i. 13.
      responsory: |-
        R. The angel said to the shepherds: 'I bring you tidings of great joy, for the Saviour of the world has been born to you today.' * in the city of David, who is Christ the Lord.
        V. You shall find the infant wrapped in swaddling clothes, and laid in a manger.
        R. In the city of David, who is Christ the Lord.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 1:1-6
      text: The Book of the generation of Jesus Christ, the Son of David, the son of Abraham. Abraham begat Isaac, and Isaac begat Jacob. And so on.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Homily by St. Jerome, Priest at Bethlehem
      text: |
        In Isaiah we read: “Who shall declare His generation?” Let us not think that there is any contradiction between the Prophet and the Evangelist, because the Prophet saith that this thing cannot be done, and the Evangelist beginneth by doing it. The one speaketh of the generation of the Divine (Word by the Eternal Father,) the other of the (family in which the) Incarnation took place. Matthew beginneth with carnal things, that by learning of men we may go on to learn of God. “The Son of David, the son of Abraham.” The reversal of the order in these clauses is a needful change. If Abraham had been put first and David afterwards, Abraham would have had to be taken again, in order to marshal the pedigree properly.

        From the Holy Gospel according to Luke Luke 2:1-14 At that time, it came to pass that there went out a decree from Caesar Augustus, that the whole world should be enrolled. And so on. Homily by Pope St. Gregory (the Great) 8th on the Gospels By God's mercy we are to say three Masses today, so that there is not much time left for preaching; but at the same time the occasion of the Lord's Birthday itself obliges me to speak a few words. I will first ask why, when the Lord was to be born, the world was enrolled? Was it not to herald the appearing of Him by Whom the elect are enrolled in the book of life? Whereas the Prophet saith of the reprobate: Let them be blotted out of the book of the living, and not be written with the righteous. Ps. lxviii. 29. Then, the Lord is born in Bethlehem. Now the name Bethlehem signifieth the House of Bread, and thus it is the birth-place of Him Who hath said: I am the Living Bread, Which came down from heaven. John vi. 51. We see then that this name of Bethlehem was prophetically given to the place where Christ was born, because it was there that He was to appear in the flesh by Whom the souls of the faithful are fed unto life eternal. He was born, not in His Mother's house, but away from home. And this is a mystery, showing that this our mortality into which He was born was not the home of Him Who is begotten of the Father before the worlds.
      responsory: |-
        R. Blessed be the womb of the Virgin Mary, which bore the Son of the Eternal Father, and blessed be the paps which give suck to Christ our Lord. * This day hath He been pleased for the salvation of the world to be born of a Virgin.
        V. This day which is breaking is holy; O come, ye Gentiles, and worship the Lord.
        R. This day hath He been pleased for the salvation of the world to be born of a Virgin.
        V. Grant, Lord, a blessing.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 2:15-20
      text: 'At that time, the shepherds said one to another: Let us go over to Bethlehem, and let us see this word that is come to pass, which the Lord hath showed to us. And so on.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Homily by St. Ambrose, Bishop (of Milan), Book II on Luke II
      text: |
        Behold the beginning of the Church. Christ is born, and the shepherds watch; shepherds, to gather together the scattered sheep of the Gentiles, and to lead them into the fold of Christ, that they might no longer be a prey to the ravages of spiritual wolves in the night of this world's darkness. And that shepherd is wide awake, whom the Good Shepherd stirreth up. The flock then is the people, the night is the world, and the shepherds are the Priests. And perhaps he is a shepherd to whom it is said: Be watchful and strengthen, Apoc. iii. 2, for God hath ordained as the shepherds of His flock not Bishops only, but also Angels.
      responsory: |-
        R. In the beginning was the Word, and the Word was with God, and the Word was God. * The same was in the beginning with God.
        V. All things were made by him: and without him nothing was made
        R. The same was in the beginning with God.
        V. Grant, Lord, a blessing.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 1:1-14
      text: In the beginning was the Word, and the Word was with God, and the Word was God. The same was in the beginning with God. And so on.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Homily by St. Augustine, Bishop (of Hippo), 1st Tract on John
      text: |
        Lest thou shouldest think all things mean, as thou art accustomed to think of things human, hear and digest this The Word was God. Now perhaps there will come forward some Arian unbeliever, and say that the Word of God was a creature. How can the Word of God be a creature, when it was by the Word that all creatures were made? If He be a creature, then there must have been some other Word, not a creature, by which He was made. And what Word is that? If thou sayest that it was by the word of the Word Himself that He was made, I tell thee that God had no other, but One Only-begotten Son. But if thou say not that it was by the word of the Word Himself that He was made, thou art forced to confess that. He by Whom all things were made was not Himself made at all. Believe the Gospel.
      responsory: |-
        R. The Word was made flesh, and dwelt among us. * And we beheld His glory, the glory as of the Only-begotten of the Father, full of grace and truth.
        V. All things were made by Him, and without Him was not anything made.
        R. And we beheld His glory, the glory as of the Only-begotten of the Father, full of grace and truth.
      status: verified

octave-readings/~-octave-day-6:
  source: Reading from the Holy Gospel according to Luke
  text: |
    At that time, his father and mother were wondering at those things which were spoken concerning him. And so on.

    Homily by St. Ambrose, Bishop of Milan. Bk. ii on Luke ii, near the end. We see that God's abounding grace is poured forth on all by the birth of the Lord, and that the gift of prophecy is not denied to the righteous, but to the unbelieving. Simeon prophesieth that our Lord Jesus Christ is set for the fall and rising again of many in Israel, setting forth that the just and the unjust reap different fruits from the coming of the Saviour; so will it be with us; according to our individual works will the True and Just Judge apportion to us punishment or reward.

    See, a sword shall pierce through thine own soul also. We have no record or tradition that Mary left this world by suffering a violent death, and the material sword can pierce the body only, and not the soul. Wherefore here we see the wisdom of Mary in that she was not ignorant of the heavenly mysteries. For, the word of God is quick, and powerful, and sharper than any two-edged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart for all things are naked and opened unto the eyes of the Son of God, from Whom also the secret things of our conscience are not hidden.

    There had been a triple prophecy; the prophecy of Simeon had followed the prophecy of the virgin, and the prophecy of the wife; those, namely, of Mary and Elizabeth. And now ought the widow also to prophesy, that no sex nor state might be wanting. And Anna is brought before us with such a title from her widowhood and her life, that we may well believe that she received the grace to announce the Advent of the Redeemer. In our exhortation addressed to widows we have already treated of her gifts at length, and, as we have much matter before us, we will not now again enter on the subject.
  responsory: |
    R. In the beginning was the Word, and the Word was with God, and the Word was God. * The same was in the beginning with God. V. All things were made by him: and without him nothing was made R. The same was in the beginning with God.
  status: verified
