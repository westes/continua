matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: He shall be like a tree which is planted near the running waters, which shall bring forth its fruit in due season.
      - psalms:
          - 2
        antiphon: They met together against the Lord, and against his Christ.
      - psalms:
          - 4
        antiphon: In tribulation thou hast enlarged me.
    versicle:
      v: Thou hast crowned him, O Lord, with glory and honour.
      r: And hast set him over the works of thy hands.
  nocturn2:
    groups:
      - psalms:
          - 5
        antiphon: O Lord, thou hast crowned him as with a shield of thy good will.
      - psalms:
          - 8
        antiphon: Thou hast made him a little less than the angels, thou hast crowned him with glory and honour.
      - psalms:
          - 10
        antiphon: The sinners have bent their bow, they have prepared their arrows in the quiver, to shoot the just.
    versicle:
      v: Thou hast set, O Lord, upon his head.
      r: A crown of precious stone.
  nocturn3:
    groups:
      - psalms:
          - 14
        antiphon: He that walketh without blemish, and worketh justice, hath been crowned on thy holy mountain.
      - psalms:
          - 20
        antiphon: Thou hast set on his head, O Lord, a crown of precious stones.
      - psalms:
          - 22
        antiphon: Against them that trouble me, thou hast made my head fat with oil.
    versicle:
      v: A crown of gold upon his head.
      r: Expressed with the sign of holiness.

