    - psalms:
        - 99
      antiphon: 'The spirit of the fear of the Lord * hath rested upon him: a crown of wisdom and of rejoicing hath adorned him.'
    - psalms:
        - 62
      antiphon: The Lord hath clothed him * with the garments of salvation, and with the robe of justice, as a bridegroom decked with a crown.
  canticle:
    id: canticum-trium-puerorum
    antiphon: A bundle of myrrh * is my beloved to me, he shall abide between my breasts.
  laudate:
    antiphon: The King of eternal glory, * crowned for us, shall bless the crown of the year of his goodness.

