nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard of Clairvaux, Sermon 2 on the Epiphany and Sermon 41 on the Song of Songs
      text: |
        Go forth, ye daughters of Sion; to you we speak, daughters of Sion, worldly souls, weak and delicate; daughters, and not sons, in whom there is nothing of fortitude, nothing of manly spirit. Go forth from the sense of the flesh to the understanding of the mind, from the servitude of carnal desire to the liberty of spiritual understanding. Go forth from your land, and from your kindred, and from your father's house, and see king Solomon in the diadem wherewith his mother crowned him, in the crown of poverty, in the crown of misery; since he was crowned also by his stepmother with a crown of thorns, a crown of misery, and is to be crowned by his household with the crown of justice, when the Angels shall go out, and shall take out of his kingdom all scandals, when he shall come to judgment with the ancients of his people, when the whole world shall fight for him against the senseless. His Father also crowns him with the crown of glory, as the Psalmist saith: Thou hast crowned him, O Lord, with glory and honour. See him, daughters of Sion, in the diadem wherewith his mother crowned him.

        I, brethren, from the beginning of my conversion, in place of the heap of merits which I knew were wanting to me, took care to gather for myself a little bundle of all the anxieties and bitternesses of my Lord, and to lay it between my breasts. The memory of the abundance of their sweetness I will pour forth as long as I live: for ever I will not forget these mercies, because in them I have been quickened. This saving bundle has been kept for me here; no one shall take it from me: it shall abide between my breasts. These things I have said to be wisdom to meditate: in these I have set the perfection of justice for myself, in these the fullness of knowledge, in these the riches of salvation, in these the abundance of merits. From these I have at times a saving cup of bitterness; from these again a sweet taste of consolation. These raise me up in adversity, they restrain me in prosperity, and between the joys and sorrows of this present life they give me safe guidance on both sides as I walk the king's highway, driving off imminent evils on either hand. These reconcile to me the Judge of the world, while they present him, terrible to the powers, as gentle and humble; while they show him not only as appeasable but also as imitable, who is inaccessible to principalities, terrible among the kings of the earth.

        These things, therefore, are frequently in my mouth, as you know: these ever in my heart, as God knows: these quite familiar to my pen, as appears: this is my sublimer philosophy in the meantime, to know Jesus, and him crucified. I do not seek, like the bride, where he lies at noon, whom I joyfully embrace abiding between my breasts. I do not seek where he feeds at noon, whom I behold as Saviour on the cross. That is more sublime, this more sweet: that is bread, this milk: this refreshes the bowels of little ones; this fills the breasts of mothers; and therefore he shall abide between my breasts. This bundle, so beloved, gather for yourselves also, most beloved; plant it in the marrow of your heart, fortify with it the entrance of your breast, that he may abide between your breasts too. For if you have before your eyes him whom you carry, seeing for certain the straits of the Lord, you will bear your own more lightly, with the help of the Spouse of the Church, who is over all things God blessed for ever. Amen.
      responsory: |
        R. Thou shalt overlay the ark of shittim wood with the purest gold within and without: * And thou shalt make over it a crown of gold round about.
        V. And thou shalt put into the ark the testimony which I shall give thee.
        R. And thou shalt make over it a crown of gold round about.
      status: draft
    - nocturn: 3
      isGospel: true
      citation: John 19:1-5
      text: 'At that time: Pilate therefore took Jesus, and scourged him. And the soldiers platting a crown of thorns, put it upon his head: and they put on him a purple garment. And they came to him, and said: Hail, King of the Jews; and they gave him blows. Pilate therefore went forth again, and saith to them: Behold, I bring him forth unto you, that you may know that I find no cause in him. Jesus therefore came forth, bearing the crown of thorns and the purple garment.'
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Bernard of Clairvaux, Sermon 50 on Various Subjects
      text: |
        See, daughters of Sion, king Solomon. He does not say Ecclesiastes, or Jedidiah. For that king too was called by these names, and he signifies Jesus Christ, our true Solomon, who is Solomon, that is, peaceable, in exile; Ecclesiastes, that is, preacher, in judgment; Jedidiah, that is, beloved of the Lord, in the kingdom, and there king. In exile gentle, in judgment just, in the kingdom glorious. In exile lovable, in judgment terrible, in the kingdom admirable. In the diadem wherewith his mother crowned him. This is the crown of mercy, and in this he is imitable. His stepmother also crowned him with a crown of misery, and in this he is contemptible. I speak of the Synagogue, which showed herself to him not as a mother but as a stepmother.

        His household shall crown him with the crown of justice, and in this he is terrible: his Father crowns him with the crown of glory, and in this he is desirable. Let sinners therefore see him in the crown of misery, that is, of thorns, and be pierced with compunction: let the daughters of Sion, affectionate souls, see him in the crown of mercy, and imitate him. The wicked shall see him in the crown of justice, and shall perish: the saints shall see him in the crown of glory, and shall rejoice for ever. Others also, his imitators, are crowned; but this by industry, helped by grace. He alone was crowned by his mother, because he alone, with ordered affections, like a bridegroom from his chamber, came forth from his mother's womb.
      responsory: |
        R. Christ, knowing sorrow and infirmity, crowned with thorns, * He it is who crowneth you in mercy and compassion.
        V. Wounded for our iniquities, bruised for our sins, by whose bruises we are healed.
        R. He it is who crowneth you in mercy and compassion.
      status: draft
