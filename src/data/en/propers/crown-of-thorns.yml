collect:
  text: |
    Let us pray.
    Grant, we beseech thee, almighty God, that we who on earth venerate the crown of thorns of our Lord Jesus Christ in memory of his passion, may deserve to be crowned by him with glory and honour in heaven:
    Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    Come forth, daughters of Sion,
    chaste virgins of the King,
    behold the Crown of Christ,
    which his own mother wove.

    The head, bloodied with thorns,
    bristles with its torn-out hair;
    and that pallid countenance
    looks upon death near at hand.

    What land, impassable with furrows,
    stiff with briars and brambles,
    brought forth this mournful gift?
    What cruel hand reaped it?

    Reddening with the blood of Christ,
    the thorn changes its prickles into roses,
    and, surpassing the palm in its fruits,
    the thorn is fitter for triumphs.

    Sown by the sins of mortals,
    the thorns wound thee, O Christ:
    pluck them from our hearts,
    and plant thine own in us.

    Might, honour, praise, glory
    to God the Father with the Son,
    and likewise to the Holy Paraclete,
    for ever and ever. Amen.
  status: draft

matins-invitatory:
  text: Christ the King, crowned with thorns, * O come, let us adore.
  status: draft

lauds-capitulum:
  text: Go forth, and see, ye daughters of Sion, king Solomon in the diadem wherewith his mother crowned him.
  citation: Canticle of Canticles 3:11
  status: draft

lauds-hymn:
  text: |
    The noble Crown of Christ is pictured
    in figures of the law:
    the victim entangled in thorns,
    and the burning bush bear witness.

    A crown had girded the ark, and, going round,
    twines a crown about the sacred rim of the table
    and the altar smoking with incense.

    Hail, Crown of glory,
    witness of the sorrows of Christ.
    More beautiful than gems and gold,
    thou shalt surpass the crowns of the stars.

    Might, honour, praise, glory
    to God the Father with the Son,
    and likewise to the Holy Paraclete,
    for ever and ever. Amen.
  status: draft

lauds-versicle:
  text: |
    V. Thou shalt be a crown of glory in the hand of the Lord.
    R. And a royal diadem in the hand of thy God.
  status: draft

prime-lectio:
  text: In that day the Lord of hosts shall be a crown of glory, and a garland of joy to the residue of his people.
  citation: Isaiah 28:5
  status: draft

terce-capitulum:
  text: |
    Go forth, and see, ye daughters of Sion, king Solomon in the diadem wherewith his mother crowned him.
    R. Thanks be to God.
    V. Thou hast crowned him, O Lord, with glory and honour.
    R. And hast set him over the works of thy hands.
  citation: Canticle of Canticles 3:11
  status: draft

sext-capitulum:
  text: |
    And I saw, and behold a white horse, and he that sat on him had a bow, and there was a crown given him, and he went forth conquering that he might conquer.
    R. Thanks be to God.
    V. We adore thy crown, O Lord.
    R. We recall thy glorious passion.
  citation: Apocalypse 6:2
  status: draft

none-capitulum:
  text: |
    In that day the Lord of hosts shall be a crown of glory, and a garland of joy to the residue of his people.
    R. Thanks be to God.
    V. Plaiting a crown of thorns,
    R. They put it upon his head.
  citation: Isaiah 28:5
  status: draft

