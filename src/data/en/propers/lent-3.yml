nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, On Holy Joseph
      text: |-
        The lives of the saints are the models for the lives of others. This is one of the reasons why we have been given the wise tale of the Scriptures, that while, by reading therein, we come to know Abraham, and Isaac, and Jacob, and others of the righteous, we may follow them in that path of innocency which is opened to us for our imitation by the record of their godly conversation. Of them I have often treated, and today the story of the holy Joseph cometh before me. In that story there are patterns of many virtues, but chiefly is he glorious on account of his clean living. Right is it then that ye who have learnt in Abraham the devotedness of a faith that nothing could daunt, in Isaac the transparency of an upright soul, in Jacob a wonderful patience of spirit in great travails, should now turn from their worthy deeds, to see the bright example of Joseph's self-control.

        The holy Joseph is put before us as a pattern of chastity. Modesty shineth in his manners and in his deeds, and a certain loveliness, which is found with chastity, shineth there also. Hence his parents loved him more than their other children. But this love caused him to be the object of an envy, which we must needs not pass by, and upon this the whole story turneth. Yet, at the same time, we learn how that just man was not swayed by any desire to avenge his own sufferings, neither repaid evil for evil. Whence also David saith: If I have rewarded evil.

        In what would Joseph have been worthy to be chosen before others, if he had harmed them which harmed him, and loved them which loved him? For this do many do. But it is a wonder if one do that which the Saviour teacheth, and love his enemy. Well, then, may we wonder at him who did this before the Gospel came; who, being injured, spared; being assailed, forgave; being sold, returned no evil; but repaid insult with favour. We, from the Gospel, have been taught to do all this, and we cannot. Let us also, then, learn how that there was envy even among some of the holy Patriarchs, that we may follow the example of the patience wherewith others of them bore it; and let us feel that they were not men of another and higher nature than ours, but only more heedful; that they were not sinless, but that they repented. But if the passion of envy scorched even some of the holy race, how much more need is there for the sinful to take heed lest it set fire to them?
      responsory: |-
        R. When Jacob saw Joseph's coat he rent his clothes, and mourned; and he said: * An evil beast hath devoured my son Joseph.
        V. And his brethren took his coat, and sent it to his father: and he knew it, and said:
        R. An evil beast hath devoured my son Joseph.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 11:14-28
      text: 'At that time, Jesus was casting out a devil, and the same was dumb; and when He had cast out the devil, the dumb man spoke. And the crowds marveled. But some of them said, By Beelzebub, the prince of devils, He casts out devils. And others, to test Him, demanded from Him a sign from heaven. But He, seeing their thoughts, said to them: Every kingdom divided against itself is brought to desolation, and house will fall upon house. If, then, Satan also is divided against himself, how shall his kingdom stand? because you say that I cast out devils by Beelzebub. Now, if I cast out devils by Beelzebub, by whom do your children cast them out? Therefore they shall be your judges. But if I cast out devils by the finger of God, then the kingdom of God has come upon you. When the strong man, fully armed, guards his courtyard, his property is undisturbed. But if a stronger than he attacks and overcomes him, he will take away all his weapons that he relied upon, and will divide his spoils. He who is not with Me is against Me; and he who does not gather with Me scatters. When the unclean spirit has gone out of a man, he roams through waterless places in search of rest; and finding none, he says, ‘I will return to my house which I left.’ And when he has come to it, he finds the place swept. Then he goes and takes seven other spirits more evil than himself, and they enter in and dwell there; and the last state of that man becomes worse that the first. Now it came to pass as He was saying these things, that a certain woman from the crowd lifted up her voice and said to Him, Blessed is the womb that bore You, and the breasts that nursed You. But He said, Rather, blessed are they who hear the word of God and keep it.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: The Venerable Bede, Priest of Jarrow, Commentary on Luke, Book 4
      text: |-
        We read in Matthew that the devil, by which this poor creature was possessed, was not only dumb, but also blind; and that, when he was healed by the Lord, he saw as well as spake. Three miracles, therefore, were performed on this one man; the blind saw, the dumb spake, and the possessed was delivered. This mighty work was then indeed wrought carnally, but it is still wrought spiritually in the conversion of believers, when the devil is cast out of them, so that their eyes see the light of faith, and the lips, that before were dumb, are opened that their mouth may show forth the praise of God. But some of them said: He casteth out devils through Beelzebub, the chief of the devils. These some were not of the multitude, but liars among the Pharisees and Scribes, as we are told by the other Evangelist.

        While the multitude, who were less instructed, wondered ever at the works of the Lord, the Pharisees and Scribes, on the other hand, denied the facts when they could, and when they were not able, twisted them by an evil interpretation, and asserted that the works of God were the works of an unclean spirit. And others, tempting Him, sought of Him a sign from heaven. They would have had Christ either to call down fire from heaven like Elias, or, like Samuel, to have made thunder roll, and lightning flash, and rain fall at midsummer. And yet, if he had so done, they had been still able to explain away these signs also, as being the natural result of some unusual, though, till that moment, unremarked state of the atmosphere. O thou, who stubbornly deniest that which thine eye seeth, thine hand holdeth, and thy sense perceiveth, what wilt thou say to a sign from heaven? In good sooth, thou wilt say that the magicians in Egypt also wrought diverse signs from heaven.

        But He, knowing their thoughts, said unto them: Every kingdom divided against itself is brought to desolation, and an house divided against an house falleth. He answered not their words, but their thoughts; as though He would compel them to believe in the power of Him Who seeth the secrets of the heart. But if every kingdom divided against itself is brought to desolation, then have not the Father, the Son, and the Holy Ghost a divided kingdom, since His is a kingdom that, without all contradiction, shall never be brought to desolation by any shock, but abideth unchanged and unchangeable for ever. If Satan also be divided against himself, how shall his kingdom stand? Because ye say that I cast out devils by Beelzebub. In saying this, He sought to draw from their own mouth a confession that they had chosen for themselves to be part of that devil's kingdom, which, if it be divided against itself, cannot stand.
      responsory: |-
        R. We are verily guilty concerning our brother, in that we saw the anguish of his soul, when he besought us, and we would not hear. * Therefore is this distress come upon us.
        V. And Reuben answered his brethren, saying: Spake I not unto you, saying: Do not sin against the child; and ye would not hear?
        R. Therefore is this distress come upon us.
      status: verified
