nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Julius, a Roman, the son of Rusticus, raised to the supreme pontificate after blessed Mark, shone remarkably by holiness of life and zeal for upholding the Christian faith. The impiety of the Arian heresy was raging through the East, and very many most holy bishops were being forced into exile from their sees; these, especially holy Athanasius, he received most humanely and defended most constantly against their adversaries. He condemned the Synod of Tyre and of Antioch, assembled by the Arians to abolish the Nicene faith, and convened two councils at Rome, in which he heard the complaints of the exiled bishops and declared their innocence.

        He was the author who induced Constans Augustus, a most religious prince reigning in the West, to move by prayers and threats Constantius his brother, a patron of the Arians, reigning in the East, to recall Athanasius from exile. He rejected the deceitful formula of faith composed by the Eusebians, followers of Arius, in the second Synod of Antioch, and convoked the great Council of Sardica of bishops of the West and the East, and, having sent legates, there decreed usefully many things for the Catholic faith and for the restoration of ecclesiastical discipline.

        Besides these things he built two basilicas in the City, and adorned them with sacred paintings, one near the Roman Forum, the other on the Flaminian Way. He built three cemeteries, one on the same Flaminian Way, another on the Aurelian Way, the third on the Portuensian. He ordained that a priest should plead his cause nowhere but before an ecclesiastical judge, and commanded that all documents pertaining to ecclesiastical affairs be drawn up through a protonotary. In three ordinations in the month of December he created three deacons, eighteen priests, and nine bishops. When he had most holily ruled the Church of God fifteen years, five months, and seventeen days, on the day before the Ides of April he happily departed to the Lord, and was buried in the cemetery of Calepodius. Thence his relics were translated and honourably laid under the high altar of the church of St. Mary across the Tiber, which he himself had enlarged.
      status: draft
