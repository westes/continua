magnificat-antiphon/~-first:
  text: Moreover, all Israel made great lamentation * for Judas, saying How art thou fallen, thou valiant man of war, that didst deliver the Lord's people.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, On the Duties of the Clergy, Book 1, ch. 41
      text: |-
        As fortitude is proved not only by prosperity but also in adversity, let us now consider the death of Judas Maccabæus. For he, after Nicanor, the general of King Demetrius, was defeated, boldly engaged twenty thousand of the king's army with eight hundred men who were anxious to retire for fear of being overcome by so great a multitude, but whom he persuaded to endure a glorious death rather than to retire in disgraceful flight. "Let us not leave," he says, "any stain upon our glory." Thus, then, engaging in battle after having fought from sunrise till evening, he attacks and quickly drives back the right wing, where he sees the strongest troop of the enemy to be. But while pursuing the fugitives from the rear, he gave a chance for a wound to be inflicted. (1 Mac. 9:8.) Thus he found the spot of death more full of glory for himself than any triumph.

        Why need I further mention his brother Jonathan, who fought against the king's force, with but a small troop? (1 Mac. 11:68.) Though forsaken by his men, and left with only two, he retrieved the battle, drove back the enemy, and recalled his own men, who were flying in every direction, to share in his triumph. Here, then, is fortitude in war, which bears no light impress of what is virtuous and seemly upon it, for it prefers death to slavery and disgrace. But what am I to say of the sufferings of the martyrs? Not to go too far abroad, did not the children of Maccabæus gain triumphs over the proud King Antiochus, as great as those of their fathers? The latter in truth were armed, but they conquered without arms.

        The company of the seven brothers stood unconquered, though surrounded by the legions of the king — tortures failed, tormentors ceased; but the martyrs failed not. One, having had the skin of his head pulled off, though changed in appearance, grew in courage. Another, bidden to put forth his tongue, so that it might be cut off, answered: "The Lord hears not only those who speak, for He heard Moses when silent. He hears better the silent thoughts of His own than the voice of all others. Do you fear the scourge of my tongue, and do you not fear the scourge of blood spilt upon the ground? Blood, too, has a voice whereby it cries aloud to God, as it did in the case of Abel."
      responsory: |-
        R. Be ye not afraid of the assault of the enemy; remember how our fathers were delivered. * Now, therefore, let us cry unto heaven, and our God will have mercy upon us.
        V. Remember His marvellous works that He hath done unto Pharaoh and his host in the Red Sea.
        R. Now, therefore, let us cry unto heaven, and our God will have mercy upon us.
      status: verified
