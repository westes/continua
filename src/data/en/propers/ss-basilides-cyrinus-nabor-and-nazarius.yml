nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Basilides, Cyrinus, Nabor, and Nazarius were Roman soldiers, of illustrious birth, and distinguished gallantry. Having embraced the Christian Religion, and being found publishing that Christ was the Son of God, they were arrested by Aurelius, Prefect of Rome under the Emperor Diocletian. As they despised his orders to sacrifice to the gods, they were committed to prison. While they were at prayer there, a brilliant light broke forth before the eyes of all that were there, and shone in all the prison. Marcellinus the keeper of the prison and many others were moved by this heavenly glory to believe in the Lord Christ. Basilides, Cyrinus, Nabor, and Nazarius were afterwards discharged out of the prison. However, in the reign of the Emperor Maximian, when they set light by his commands also, and had ever in their mouth that there is but one Christ, one God, and one Lord, they were tormented with whips loaded with metal, and again cast into chains. Thence, on the seventh day, they were brought out, and set before the Emperor, and there still persisted in mocking at the foolish idols, and declaring that Jesus Christ is God. They were accordingly condemned to death and beheaded. Their bodies were given to wild beasts to eat, but, as the creatures would not touch them, they were reverently buried by the Christians.
      status: draft
