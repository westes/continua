collect:
  text: |
    Let us pray.
    O God, lover of chastity, Who endowed with heavenly gifts blessed Mary Magdalen, a
    virgin on fire with love for You, grant that we who keep this feast-day in her
    honor may imitate her by purity and love.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, lover of chastity, Who endowed with heavenly gifts blessed Mary Magdalen, a
    virgin on fire with love for You, grant that we who keep this feast-day in her
    honor may imitate her by purity and love.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        This Mary Magdalen was born of the noble Florentine family of the Pazzi. She was hardly out of her cradle when she set her feet in the path of perfection. At ten years of age she made a vow of perpetual virginity, and took the habit of the Order of Mount Carmel, in the convent of Saint Mary of the Angels. In that sisterhood she was in all ways a pattern to all. She was pure to that degree, that she did not even know of the existence of anything which can hurt modesty. For the space of five years, by the command of God, she lived upon nothing but bread and water, the Lord's Day only excepted, in which she used the food which is taken in Lent. She chastised her body with hair-cloth, scourging, cold, hunger, watching, nakedness, and all manner of hardships.

        The love of God was so hot within her, that she was sometimes fain to bathe her breast with cold water to allay the agitation. She was oftentimes rapt in the spirit, and that most marvellously, for whole days at a time, during which trances she saw things hidden and heavenly, and was enlightened of God with great gifts. But after all these things she had a stern tussling with the prince of the darkness of this world, while God allowed her spirit to remain dry, deserted, abandoned by all, and tormented with diverse temptations. And all that while she remained an example of unconquered patience and the deepest lowly-mindedness.

        She was very remarkable for her tender love toward her neighbours. Sometimes she went whole nights without sleep, while she was working for the service of the sisters, or waiting upon the sick. She sometimes healed sores even by licking them. That there should be unbelievers and sinners perishing caused her bitter weeping, and she offered herself to God to suffer for their conversion whatsoever He chose. For many years, therefore, before her death, her mighty charity towards others, made her freely to give up that heavenly joy of spirit, wherewith she had once so overflowed. She had often in her mouth the words: To suffer, not to die. At length, in the forty-second year of her age, after a long and grievous sickness, the Bridegroom came, and she entered with Him into the marriage-chamber. Clement IX, finding that God had glorified her by many miracles, both during her life and after her death, enrolled her name among those of the Holy Virgins. Her body, up to the present day, has never shown the least sign of corruption.
      status: verified
