vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Whither is thy beloved gone, * O thou fairest among women? Whither is thy beloved turned aside? that we may seek him with thee.
    - psalms:
        - 112
      antiphon: Look away from me. * I will weep bitterly. Labour not to comfort me.
    - psalms:
        - 121
      antiphon: He hath no form nor comeliness, * and when we shall see him there is no beauty that we should desire him.
    - psalms:
        - 126
      antiphon: From the sole of the foot * even unto the head, there is no soundness in it.

nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: John 19:25-27
      text: At that time, there were standing by the Cross of Jesus His Mother and His Mother's sister, Mary of Cleophas, and Mary Magdalene. When Jesus, therefore, saw His Mother and the disciple standing by, whom He loved, He said to His Mother, Woman, behold your son. Then He said to the disciple, Behold your Mother. And from that hour the disciple took her into his home.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, On Virgins, Bk. 7; Epistle 25 to the Church of Vercelli
      text: |-
        There stood by the Cross His Mother. Men had forsaken Him, but she stood there fearless. Behold how the Mother of Jesus could break through her shrinking modesty, but could not belie her heart. With the eyes of a mother's love she gazed upon the Wounds of her Son, those Wounds through Which she knew that redemption for all mankind was flowing. The Mother, who feared not the executioners, was able to endure the sight of their work. Her Son was hanging upon the Cross, and she braved His tormentors.

        Mary, the Mother of the Lord, stood by the Cross of her Son. My only informant of this fact is the holy Evangelist John. Others have written that when the Lord suffered, the earth quaked, the heavens were veiled in darkness, the sun was hidden, and the thief received, after a good confession, the promise of Paradise. John hath taught us what the others have not taught us. Upon the Cross He called her Mother. It is reckoned a greater thing that in the moment of triumph over agony, He should have discharged the watchful duty of a Son to His Mother, than that He should have made gift of the kingdom of heaven. For if it be a sacred thing to have forgiven the thief, this so great kindness of the Son to the Mother is to be worshipped as the outcome of a tenderer and more touching love.

        Behold, saith the Lord, thy son: Behold thy Mother! Christ bore witness from the Cross, and divided the offices of his tender love between his Mother and his disciple. Thus doth the Lord give us a testament, not only of his love for souls, but also of his natural affection. Moreover, the testimony which John doth give us concerning this same testament, is a worthy testimony to the original Testator himself. It is a good testament, not of earthly riches, but of eternal life, written not in ink, but in the Spirit of the living God, who speaketh of such testimony in the Psalms, saying: My tongue is the pen of a ready writer.
      status: verified
