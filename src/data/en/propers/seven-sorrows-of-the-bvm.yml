collect:
  text: |
    Let us pray.
    O God, at Whose suffering the prophecy of Simeon was fulfilled, and a
    sword of sorrow pierced through the gentle soul of the glorious Virgin
    and Mother Mary, mercifully grant that we who speak worshipfully of
    her woes, may obtain the saving purchase of thy suffering.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Look not upon me * because I am black, because the sun hath tanned me. My mother's children were angry with me.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
