nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: At what time Peter and Paul were kept in the Mamertine Prison, at the foot of the Tarpeian Rock, two of the gaolers, named Processus and Martinian, along with other forty, were moved by the preaching and miracles of the Apostles to believe in Christ, and were baptized in a spring which suddenly brake forth out of the rock. These men let the Apostles depart if they willed it. But Paulinus, Prefect of the soldiers, when he heard what was come to pass, strove to turn away Processus and Martinian from their purpose. And when he found that he but wasted time, he ordered their faces to be bruised and their teeth to be broken, with stones. Moreover, when he had had them led to the image of Jupiter, and they still boldly answered that they would not worship the gods, he caused them to be tormented on the rack, and white-hot plates of metal to be put to their flesh, and that they should be beaten with sticks. While they were suffering all these things they were heard to say only this one word Blessed be the Name of the Lord. They were afterwards cast into prison, and in a little while they were taken outside the city, and slain with the axe, upon the Aurelian Way. The Lady Lucina buried their bodies upon her own farm, upon the 2nd day of July, but they were afterwards brought into the City, and are buried in the Church of the Prince of the Apostles.
      status: verified
