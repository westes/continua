collect:
  text: |
    V. Christ became obedient for us unto death, even the death of the Cross: for which cause God also hath exalted Him, and given Him a Name which is above every name.
    Our Father (said silently).
    Psalm 50 (Have mercy on me, O God).
    Look down, we beseech Thee, O Lord, upon this Thy family, for which our Lord Jesus Christ did not hesitate to be delivered into the hands of wicked men, and to undergo the torment of the Cross:
    Who liveth and reigneth with Thee in the unity of the Holy Ghost, God, world without end.
    (And it is concluded in silence.)
  status: draft

collect/~-vespers:
  text: |
    Let us pray.
    Pour forth, O Lord, we beseech thee, the Spirit of thy love into our hearts, and by thy mercy make all them to be of one mind to whom Thou hast given to eat of thy mystic Passover.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the same Holy Ghost, God, world without end.
  status: verified

benedictus-antiphon:
  text: The women sitting * at the sepulchre made lamentation, weeping for the Lord.
  status: verified

magnificat-antiphon/~-vespers:
  text: And in the end of the sabbath, * when it began to dawn towards the first day of the week, came Mary Magdalen and the other Mary, to see the sepulchre, alleluia.
  status: verified
