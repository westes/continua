  text: While St. Clement prayed, * there appeared unto him the Lamb of God.
  status: verified

terce-antiphon:
  text: Not for my own merits * hath the Lord sent me unto you, that I may share your crowns.
  status: verified

sext-antiphon:
  text: I saw on the mountain * the Lamb standing, from beneath whose foot flowed a fountain of living waters.
  status: verified

none-antiphon:
  text: All the nations * round about believed in Christ the Lord.
  status: verified

benedictus-antiphon:
  text: 'As he began to move toward the sea * the people cried out with a loud voice: O Lord Jesus Christ, deliver him! And Clement wept, and said: Father, receive my spirit!'
  status: verified

magnificat-antiphon:
  text: Lord, * Thou hast given unto thy Martyr Clement a tabernacle in the sea, after the fashion of a temple of marble, builded by the hands of Angels. And Thou givest a way thither unto the people on the land, that they may tell of thy marvellous works.
  status: verified

magnificat-antiphon/~-first:
  text: Let us all pray Our Lord Jesus Christ * to open a spring for those that own His Name.
  status: verified

