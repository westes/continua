nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Clement, the son of Faustinus, was a Roman, from the quarter of the Coelian Mount. He was a disciple of the blessed Peter, and is the same concerning whom Paul saith, writing to the Philippians: And I entreat thee also, true yokefellow, help those women which laboured with me in the Gospel, with Clement also, and with other my fellow-labourers, whose names are written in the book of life. He it was who divided the seven quarters of the city among seven scribes, one to each, whose duty it was to search out most carefully, and record in writing the sufferings and acts of the Martyrs. He himself also wrote much, and that most orthodox and healthy, whereby he clearly explained the Christian Religion.

        His teaching and the holiness of his life brought many to believe in Christ, and he was therefore exiled by the Emperor Trajan to Kherson, in the Crimea, where he found two thousand Christians, who had been condemned by the same Trajan. There they all worked in the marble quarries. During their labour they suffered for want of water, and Clement prayed, and then went up an hill hard by, on the top whereof he saw a Lamb standing, touching with its right foot a flowing spring of sweet waters. Therewith they all quenched their thirst, and by this miracle many unbelievers were brought to believe in Christ, and began to honour the holiness of Clement.

        These things moved Trajan to send a messenger to the Crimea, who tied an anchor about Clement's neck, and cast him into the deep of the sea. After it had been done, while the Christians were praying on the shore, the sea went back three miles, and when they followed it, they found a grotto of marble, in form like a temple, and therein a stone coffin wherein was laid the body of the Martyr. A Church was also built in the place where God had made the water to break forth. Clement lived as Pope nine years, six months, and six days. He held two Ordinations in the month of December, wherein he made ten Priests, two Deacons, and fifteen Bishops for diverse places.
      status: verified
