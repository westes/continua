collect:
  text: |
    Let us pray.
    O God, who hast appointed thine Only-begotten Son to be the Saviour of mankind, and hast commanded that his Name should be called Jesus: mercifully grant that we who here on earth do worship that most holy Name may be made glad in heaven by his Presence.
    Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: verified

matins-hymn:
  text: |
    O Jesu, King most wonderful,
    Thou conqueror renowned,
    Thou sweetness most ineffable,
    In whom all joys are found!

    When once thou visitest the heart,
    Then truth begins to shine;
    Then earthly vanities depart;
    Then kindles love divine.

    O Jesu, light of all below,
    Thou fount of life and fire,
    Surpassing all the joys we know,
    And all we can desire:

    May every heart confess thy Name,
    And ever thee adore;
    And, seeking thee, itself inflame
    To seek thee more and more.

    Thee may our tongues forever bless;
    Thee may we love alone;
    And ever in our lives express
    The image of thine own.
    Amen.
  status: verified

matins-invitatory:
  text: The Name which shall be called Wonderful, the Name of Jesus is the Name which is above every name; * O come, let us worship him.
  status: verified

lauds-capitulum:
  text: 'Brethren: Christ humbled himself, becoming obedient unto death, even to the death of the cross. For which cause God also hath exalted him, and hath given him a name which is above all names: that in the name of Jesus every knee should bow.'
  citation: Phil 2:8-10
  status: verified

lauds-hymn:
  text: |
    O Jesu, thou the beauty art
    Of angel worlds above;
    Thy Name is music to the heart,
    Enchanting it with love.

    Celestial sweetness unalloyed,
    Who eat thee hunger still;
    Who drink of thee still feel a void,
    Which naught but thou canst fill.

    O my sweet Jesu, hear the sigh
    Which unto thee I send;
    To thee mine inmost spirit cries,
    My being's hope and end.

    Stay with us, Lord, and with thy light
    Illume the soul's abyss;
    Scatter the darkness of our night,
    And fill the world with bliss.

    O Jesu, spotless Virgin's flower,
    Our life and joy art thou;
    To thee be praise, and might, and power,
    Through all eternity.
    Amen.
  status: verified

lauds-versicle:
  text: |-
    V. Our help is in the Name of the Lord.
    R. Who made heaven and earth.
  status: verified

prime-lectio:
  text: All whatsoever you do in word or in work, do all in the name of the Lord Jesus Christ, giving thanks to God and the Father by him.
  citation: Col 3:17
  status: verified

vespers-hymn:
  text: |
    Jesu, the very thought of thee,
    With sweetness fills my breast;
    But sweeter far thy face to see,
    And in thy presence rest.

    Nor voice can sing, nor heart can frame,
    Nor can the memory find,
    A sweeter sound than thy blest Name,
    O Saviour of mankind.

    O hope of every contrite heart,
    O joy of all the meek,
    To those who fall, how kind thou art;
    How good to those who seek.

    But what to those who find? This truth
    No tongue nor pen can show:
    The love of Jesus, what it is,
    None but his loved ones know.

    Jesu, our only joy be thou,
    As thou our prize wilt be;
    Jesu, be thou our glory now,
    And through eternity.
    Amen.
  status: verified

vespers-versicle:
  text: |-
    V. Blessed be the Name of the Lord, alleluia.
    R. From this time forth, and for evermore, alleluia.
  status: verified

