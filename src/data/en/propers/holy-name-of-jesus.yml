lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: Thy Name is as oil * poured forth, therefore do the virgins love thee.
    - psalms:
        - 99
      antiphon: Know ye that the Lord he is God, * and his Name endureth for ever.
    - psalms:
        - 62
      antiphon: My soul thirsteth * for thy holy Name, O Lord.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Blessed * is the holy Name of thy glory, and worthy to be praised, and exalted above all for ever.
  laudate:
    antiphon: Young men and maidens, * old men and children, praise the Name of the Lord, for his Name alone is exalted.

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard of Clairvaux, Sermon 15 on the Song of Songs
      text: |-
        It is not idly that the Holy Ghost likeneth the Name of the Bridegroom to oil, when he maketh the Bride say to the Bridegroom: thy Name is as oil poured forth. Oil indeed giveth light, meat, and unction. It feedeth fire, it nourisheth the flesh, it sootheth pain; it is light, food, and healing. Behold, thus also is the Name of the Bridegroom. To preach it is to give light; to think of it is to feed the soul; to call on it is to win grace and unction. Let us take it point by point. What, thinkest thou, hath made the light of faith so suddenly and so brightly to shine in the whole world but the preaching of the Name of Jesus? Is it not in the light of this Name that God hath called us into his marvellous light, even that light wherewith we, being enlightened, and in his light seeing light, Paul saith truly of us: Ye were sometimes darkness, but now are ye light in the Lord?

        This is the Name which the Apostle was commanded to bear before Gentiles, and kings, and the children of Israel, the Name which he bore as a light to enlighten his people, crying everywhere: The night is far spent, the day is at hand; let us therefore cast off the works of darkness, and let us put on the armour of light, let us walk honestly as in the daylight. He pointed out to all that candle set upon a candlestick, preaching in every place Jesus and him crucified. How did that Name shine forth and dazzle every eye that beheld it, when it came like lightning out of the mouth of Peter to give bodily strength to the feet of the lame man, and to clear the sight of many a blind soul? Cast he not fire when he said: In the Name of Jesus Christ of Nazareth, rise up and walk?

        The Name of Jesus is not a Name of light only, but it is meat also. Dost thou ever call it to mind, and remain unstrengthened? Is there anything like it to enrich the soul of him that thinketh of it? What is there like it to restore the weakened senses, to fortify strength, to give birth to good lives and pure affections? The soul is fed on husks if that whereon it feedeth lack seasoning with this salt. If thou writest, thou hast no meaning for me if I read not of Jesus there. If thou preach, or dispute, thou hast no meaning for me if I hear not of Jesus there. The mention of Jesus is honey in the mouth, music in the ear, and gladness in the heart. It is our healing too. Is any sorrowful among us? Let the thought of Jesus come into his heart, and spring to his mouth. Behold, when the day of that Name beginneth to break, every cloud will flee away, and there will be a great calm. Doth any fall into sin? Doth any draw nigh to a hopeless death? And if he but call on the life-giving Name of Jesus, will he not draw the breath of a new life again?
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 2:21
      text: At that time, when eight days were fulfilled for the circumcision of the Child, His name was called Jesus, the name given Him by the angel before He was conceived in the womb.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard of Clairvaux, Sermon 1 on the Circumcision
      text: |-
        Behold a mystery, great and full of wonder! The Child is circumcised, and his Name is called Jesus. Why are these two things thus mentioned together? It would seem that circumcision should rather be for the saved than for the Saviour; that the Saviour ought rather to be Circumciser than circumcised. But behold here the Mediator between God and men, how even from his childhood he joineth the things of the Highest to the things of the lowest, the things of God to the things of men. He is born of a woman, but her womb is made fruitful without the loss of the flower of her virginity. He is wrapped in swaddling-bands, but these swaddling-bands are a theme for the jubilation of angels. He is laid in a manger, but a bright star standeth in heaven over the place. So also in his circumcision, the ceremony gave proof of the reality of the Manhood which he had taken, and that Name which is above every name proclaimed the glory of his blessed Majesty. As very son of Abraham he underwent circumcision; he assumed the Name of Jesus as very Son of God.

        It is no wonder that it should be at his circumcision that the Name of Jesus, being interpreted Saviour, is given to the Child who is born unto us, for it was then that he for the first time shed that sinless Blood which is the means whereby he hath chosen to work out our salvation. It is no matter for the speculation of Christians why the Lord Christ was pleased to be circumcised. He was circumcised for the same reason for which he was born, and for which he suffered. Neither one nor the other was for himself, but all for the sake of the elect. He was not born in sin; he was not circumcised to separate him from sin; neither did he die for sins of his own, but for ours. His Name, it is written, was called Jesus, which was so named of the Angel before he was conceived in the womb. The Angel gave him that title, but not for the first time: Saviour is his Name from everlasting; he hath it of his own proper nature to save.
      status: verified
