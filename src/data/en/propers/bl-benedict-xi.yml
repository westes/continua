nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Benedict the Eleventh, born at Treviso of the honourable family of the Boccasini, in the fourteenth year of his age embraced the institute of the Preachers; in which for fourteen years he applied himself earnestly to human and divine studies, and for as many years taught, privately and publicly, with the highest praise for learning. Conspicuous for fame of sanctity and prudence, he was advanced through various grades and dignities of the order to its supreme mastership; in which office, shining as an example to others, he wonderfully fostered discipline, and in a short time enlarged the order itself. Boniface the Eighth, having happily used his work in pacifying the kings of France and Britain, and visiting the provinces committed to him, created him, travelling in Gaul, cardinal priest of the holy Roman Church, and, summoning him to the City, appointed him legate to Pannonia, where with wonderful dexterity he composed the three princes contending over the succession to that kingdom.

        Having pacified Hungary, he returned to Rome, and when Boniface was besieged at Anagni, stood bravely by him amid the threats and attacks of the enemy, and clung to him indivisibly, almost all the rest having fled from him. Soon, the same Pontiff being taken from human affairs, he was raised to the See of Peter by the wonderful consent of the Fathers. In that summit of dignity, entirely alien from all pride, he cultivated lowliness so that his mother, still living, who had come to him somewhat more splendidly adorned, as seemed fitting, he sent away as not his own; but soon, clothed in her native and humbler dress, he embraced her most lovingly and held her honourably. Those who had violated the pontifical dignity in his predecessor he punished with anathema; but those more severely treated by him he restored to their former honours and received into pardon and grace. To pacify the provinces of Italy, most wretchedly torn by the factions of the Guelphs and Ghibellines, the Whites and Blacks, he created Nicholas, cardinal of Prato, of the Order of Preachers, legate a latere, and ordered him to go to England, Scotland and Ireland to reconcile kings and princes.

        A most zealous lover of peace, he actively promoted it both in Germany, which, labouring under internal dissensions, he came to aid, and in Sicily, which, the interdict being lifted, he restored to communion. But also the concord of the kingdom of the Gauls with the Apostolic See, a little before most gravely injured, he happily re-established. To the East also, and other provinces of the schismatics, he extended apostolic care, and strongly commended to Martin, archbishop of Antivari, the restoration of ecclesiastical discipline. He roused Orosius, king of Serbia, by most loving letters to renounce schism. Intent finally on recovering Syria and Palestine, and thinking and working on other things for the increase of religion, common necessity forestalled him. He died at Perugia, in the year one thousand three hundred and four, the ninth month of his pontificate not yet complete, and was buried, as he himself had ordered, in a lowly place among his brethren the Preachers, renowned for miracles immediately after his death. The cult rendered to him from time immemorial Clement the Twelfth approved, and granted that his feast with Office and Mass be celebrated under the double rite in the whole Order of Preachers, and by the clergy of Treviso and Perugia.
      status: draft
