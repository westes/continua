collect:
  text: |
    Let us pray.
    Grant, we beseech thee, O Almighty God, that we who year by year do prayerfully renew the holy observance of this thy great Fast, may be acceptable in thy sight, as touching both our bodies and our souls.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    O Lord, we beseech thee graciously to hear our supplications, and evermore help and defend all them to whom Thou hast given the mind to pray.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

