collect:
  text: |
    Let us pray.
    O most merciful God, we beseech thee to grant unto thy Church that, forasmuch as she is gathered together in the Holy Ghost, no assaults of her enemies may be able to trouble her.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the same Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'But that ye may know * that the Son of man hath power upon earth to forgive sins, He said unto the sick of the palsy: I say unto thee, Arise, take up thy couch, and go into thine house. Alleluia.'
  status: verified

magnificat-antiphon:
  text: But the Comforter which is the Holy Ghost, * Whom the Father will send in My Name, He shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you. Alleluia.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Luke 5:17-26
      text: At that time, it came to pass on one of the days, that Jesus sat teaching. And there were Pharisees and teachers of the Law sitting by, who had come out of every village of Galilee and Judea and out of Jerusalem. And the power of the Lord was present to heal them. And behold, some men were carrying upon a pallet a man who was paralyzed, and they were trying to bring him in and to lay him before Him. And as they found no way of bringing him in, because of the crowd, they went up onto the roof and lowered him through the tiles, with his pallet, into the midst before Jesus. And seeing their faith, He said, Man, your sins are forgiven you. And the Scribes and Pharisees began to argue, saying, Who is this man who speaks blasphemies? Who can forgive sins, but God only? But Jesus, knowing their thoughts, answered and said to them, "Why are you arguing in your hearts? Which is easier, to say, 'Your sins are forgiven you,' or to say, 'Arise and walk'?" But that you may know that the Son of Man has power on earth to forgive sins — He said to the paralytic — I say to you, arise, take up your pallet and go to your house. And immediately he arose before them, took up what he had been lying on, and went away to his house, glorifying God. And astonishment seized upon them all, and they glorified God and were filled with fear, saying, We have seen wonderful things today.
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Book 5 on Luke 5 (on the healing of the paralytic)
      text: |-
        The healing of this paralytic was not idle, nor its fruits limited to himself. The Lord healed him, or ever he could ask, not because of the entreaties of others, but for example's sake. He gave a pattern to be followed, and sought not the intercession of prayer. In the presence of the Pharisees and doctors of the law, which were come out of every town of Galilee, and Judaea, and Jerusalem, many sick folk were healed, but among them is specially described the healing of this paralytic. First of all, as we have before said, every sick man ought to engage his friends to offer up prayers for his recovery, that so the tottering framework of this our life, and the distorted feet of our works, may be righted by the healing power of the word from heaven.

        Here ought therefore to be advisers, who should rouse up the minds of the sick to higher things, since when the body becometh languid with sickness, the mind is apt to follow its example. With the help of such friends he can be brought and laid on the ground before the Feet of Jesus, and seem worthy of a glance from the Lord — for the Lord looketh upon such as lie lowly before Him, "for He hath regarded the lowliness of His handmaiden." "And when He saw their faith, He said unto him — Man, thy sins are forgiven thee." Great is the Lord, Who, for the sake of some, forgiveth the sins of others — Who trieth some, and pardoneth the wanderings of others. Why should thine equal, O man, avail not with thee, if a slave have won power to intercede, and right to obtain, with God?

        O Thou that judgest, learn to forgive — thou that art sick, to pray. If thou doubt of the pardon of thy sins, because of their grievousness, get thee to the Church, that she may pray for thee, and that the Lord, accepting her countenance, may grant to her petitions what He refuses to thine. And although we are bound to accept this history as one of fact, and to believe that the body of the paralytic was healed — yet remember thou also his inward cure, unto whom his sins were forgiven. The Jews said: "Who can forgive sins but God alone?" And in these words they confessed the Godhead of Him Who forgave the sins of the paralytic, and themselves condemned their own unbelief in Him Whose work they acknowledged, but Whose Person they denied.
      responsory: |-
        R. Ye have not chosen Me, but I have chosen you, and ordained you * That ye should go and bring forth fruit, and that your fruit should remain. Alleluia, Alleluia.
        V. As My Father hath sent Me, even so send I you.
        R. That ye should go and bring forth fruit, and that your fruit should remain. Alleluia, Alleluia.
      status: verified
