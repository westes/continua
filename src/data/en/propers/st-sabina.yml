commemoration:
  text: |
    Ant. Give her of the fruit of her hands, and let her own works praise her in the gates.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Who among the other miracles of thy power hast bestowed the victory of martyrdom even upon the weaker sex, graciously grant that we who keep the birthday of blessed Sabina, thy Martyr, may come to thee by the path of her example.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Sabina was a Roman lady, the wife of a distinguished nobleman named Valentine. The Christian faith was taught to her by a maiden named Seraphia. After the martyrdom of this holy virgin, Sabina gathered together her reliques, and buried them with godly service. For this cause she was in a little while arrested, under the Emperor Hadrian, and brought before the Judge Elpidius. Art thou, said he, the same Sabina who is so distinguished for her blood and for her marriage? She answered: I am, but I give thanks to my Lord Jesus Christ for having delivered me through the prayers of His hand-maiden Seraphia from the troubling of devils. Diverse attempts were made to make her change her mind, but when they proved in vain the Praefect passed sentence of death upon her for despising the gods. The Christians laid her body in the same grave in which she had herself laid that of Seraphia, her teacher in the faith.'
      status: verified
