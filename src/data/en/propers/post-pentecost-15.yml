collect:
  text: |
    Let us pray.
    O Lord, we beseech thee, let thy continual pity cleanse and defend thy Church, and because it cannot continue in safety without thy succour, preserve it evermore by thy help and goodness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Jesus went into a city called Nain * and, behold, there was a dead man carried out, the only son of his mother.
  status: verified

magnificat-antiphon:
  text: A great prophet is risen up among us * and God hath visited His people.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Gregory the Great, Moralia in Job, Book 9, ch. 2
      text: |-
        We know that it is so of a truth, and that a man cannot be justified as against God. When God is put out of the consideration, a man may be considered to be just, but considered as against God, his righteousness vanisheth away. When a man measureth himself by his relation to Him, Who is the Author of all good, he doth thereby acknowledge that of himself he hath no good in him, but hath received from God whatsoever he hath. He that glorifieth himself because of good which hath been given him, fighteth against God with God's own gifts. It is just therefore that the grounds upon which he ought to have been humbled, but upon which he hath puffed himself up, should be used to humble his vain-glory.

        But an holy man, because he perceiveth that the worth of our own good deeds falleth short, when he considereth his own spiritual man, justly saith If He will contend with him, he cannot answer Him one of a thousand.

        In the Holy Scriptures the numeral a thousand is used to be taken as signifying a generalization. Thus, the Psalmist saith The word which He commanded to a thousand generations (Ps. civ. 8), whereas it is notorious that the Evangelist doth not reckon more then seventy-and-seven generations between the very beginning of the world and the coming of our Redeemer. What therefore is to be understood here by a thousand? The general ripeness of the old generation to bring forth a new offspring. Hence also it is said by John And shall reign with Him a thousand years (Apoc. xx. 6), because the reign of the Holy Church will be over all mankind made perfect.

        When times one is ten, and ten times ten is an hundred, and ten times an hundred is a thousand. Observing therefore this connection between one and a thousand, what are we to understand by the one (in the text, connected as it is with the thousand whereby we understand perfection)? Is it not the beginning of a good life, even as the thousand representeth perfection? The contending with God (which is spoken of in the text) is the non-acknowledgment of that which is owed to Him, and the vain-glorying instead in our own strength. But an holy man should see, that even if one had received the gifts of perfection, and were to make them the grounds of self-glorifying, such an one would thereby lose all that he had received.
      responsory: |-
        R. My flesh is clothed with worms and clods of dust. My skin is dry and drawn together. * Remember me, O Lord, for my life is wind.
        V. My days are swifter than a weaver's shuttle, and are spent without hope.
        R. Remember me, Lord, for my life is wind.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 7:11-16
      text: At that time, Jesus went to a town called Naim; and His disciples and a large crowd went with Him. And as He drew near the gate of the town, behold, a dead man was being carried out, the only son of his mother, and she was a widow; and a large gathering from the town was with her. And the Lord, seeing her, had compassion on her, and said to her, Do not weep. And He went up and touched the stretcher; and the bearers stood still. And He said, Young man, I say to you, arise. And he who was dead, sat up, and began to speak. And He gave him to his mother. But fear seized upon all, and they began to glorify God, saying, A great prophet has risen among us, and God has visited His people.
      responsory: |-
        R. O that Thou wouldest hide me in the grave; that Thou wouldest keep me secret, until thy wrath be past, even thine, O Lord, Thou That alone art God; * That Thou wouldest appoint me a set time, and remember me!
        V. Are thy days as the days of man, that Thou inquirest after mine iniquity, and there is none that can deliver out of thine hand.
        R. That Thou wouldest appoint me a set time, and remember me!
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 44 on the Words of the Lord
      text: |-
        That her son was called again to life was the joy of that widowed mother; that souls of men are every day called to life is the joy of our Mother the Church. He was dead in body they have been dead in mind. His death was outward, and was outwardly bewailed; their inward. Death hath been neither mourned for nor seen. But He hath sought for them, Who hath seen that they are dead, and He only hath seen that they are dead, Who hath been able to make them alive. If He had not come to raise the dead, the Apostle had not said: "Awake, thou that sleepest, and arise from the dead, and Christ shall give thee light." (Eph. v. 14.)

        We find written how the Lord raised from the dead three persons visibly, but thousands invisibly. But how many they may have been whom He raised visibly, who knoweth? For all the things which He did are not written. John saith thus: "There are also many other things which Jesus did, the which, if they should be written every one, I suppose that even the world itself could not contain the books that should be written." (John xxi. 25.) There were then, doubtless, many more raised to life, but it is not meaningless that three are recorded.

        For our Lord Jesus Christ hath willed that those things which He did carnally, we should understand also spiritually. He worked not miracles only for the sake of working wonders, but that His works might be at once wonderful to them that beheld, and true to them that understand them. Even as one that looketh upon a scroll right fairly written, and knoweth not how to read therein, praiseth the hand of the old scribe when he seeth the beauty of the points, but what it saith, what those points mean, he knoweth not, and praiseth by the eye, without understanding by the mind.

        Another both praiseth the workmanship, and grasps the meaning: that is, he who can not only see what is common to all, but can also read; which he who hath not learned cannot do. So they who saw the miracles of Christ, and understood not what they meant, and what they intimated in some sort to those who understand, only marvelled that they were done; but others both marvelled at the deeds, and grasped what they meant. Such ought we to be in the school of Christ.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
