collect:
  text: |
    Let us pray.
    O God, who hast blessed the soul of thy servant Gregory with an everlasting blessing, mercifully grant that we, who groan under the burden of our sins, may by his prayers be relieved.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Gregory, beholding the English youths, said: They have an angelic countenance, and it is meet that such should be companions of the Angels in heaven.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, who hast blessed the soul of thy servant Gregory with an everlasting blessing, mercifully grant that we, who groan under the burden of our sins, may by his prayers be relieved.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

lauds-capitulum:
  text: Behold a great priest, who in his life upheld the house of God, and in his days strengthened the temple.
  citation: Sir 50:1
  status: draft

lauds-hymn:
  text: |-
    Honeyed sweetness for the heart
    Distills forever from your lips;
    The fragrant power of every spice
    Your eloquence itself outstrips.

    The Scriptures' hidden mysteries
    You wondrously unlock and show;
    For Truth herself, the very Truth,
    Has taught you all you come to know.

    You gained the apostolic call,
    Its office and its glory too:
    Loose us from every bond of sin,
    And bring us to the heavens with you.

    O Bishop excellent and true,
    Light and adornment of the Church,
    Forsake not, in their perils, those
    Whom you instructed in your search.

    To the unbegotten Father praise,
    To the Only-begotten glory be:
    To both alike, in equal state,
    The Spirit's highest majesty. Amen.
  status: draft

lauds-responsory:
  text: |
    R.br. The Lord loved him, * and beautified him.
    R. The Lord loved him, * and beautified him.
    V. He clothed him with a robe of glory.
    R. And beautified him.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. The Lord loved him, * and beautified him.
  status: verified

lauds-versicle:
  text: |
    V. The Lord guided the just in right paths.
    R. And showed him the kingdom of God.
  status: verified

prime-antiphon:
  text: Blessed Gregory, * raised up to the Chair of Peter, fulfilled in his deeds the name of the Watchman.
  status: draft

terce-antiphon:
  text: An excellent shepherd, * he handed down both the pattern and the rule of the pastoral life.
  status: draft

terce-capitulum:
  text: |
    Behold a great priest, who in his life propped up the house, and in his days strengthened the temple.
    R. Thanks be to God.
    V. The Lord loved him and beautified him.
    R. He clothed him with a robe of glory.
  citation: Eccl 50:1
  status: draft

sext-antiphon:
  text: While he was unfolding * the mysteries of the sacred page, a dove whiter than snow appeared.
  status: draft

sext-capitulum:
  text: |
    He set singers before the altar, and in their sound he made sweet melody. And he gave beauty to the feasts, and set the times in order even to the end of his life.
    R. Thanks be to God.
    V. The Lord hath chosen him for a Priest unto Himself.
    R. To offer up unto Him the sacrifice of praise.
  citation: Eccl 47:11-12
  status: draft

none-antiphon:
  text: Gregory, * the mirror of monks, father of the City, the delight of the world.
  status: draft

none-capitulum:
  text: |
    He took care of his nation, and delivered it from destruction. He prevailed to enlarge the city, and obtained glory by his converse with the people.
    R. Thanks be to God.
    V. Thou art a Priest for ever.
    R. After the order of Melchisedek.
  citation: Eccl 50:4-5
  status: draft

vespers-hymn:
  text: |-
    Once the English nation's apostle,
    Now companion of the blest;
    As then to nations, Gregory,
    Now come to aid the faith confessed.

    Abundant riches you disdained,
    And all the glory of the world,
    That, poor yourself, you might pursue
    The poor Prince Jesus, banner unfurled.

    A shipwrecked beggar seemed to stand,
    An angel asking alms of thee:
    Twice having given, yet again
    You gave a vessel, silver, free.

    From that hour Christ sets you over
    His own Church, to steer and guide:
    So Peter's rank is yours to hold,
    Whose rule you follow at his side.

    O Bishop excellent and true,
    Light and adornment of the Church,
    Forsake not, in their perils, those
    Whom you instructed in your search.

    To the unbegotten Father praise,
    To the Only-begotten glory be:
    To both alike, in equal state,
    The Spirit's highest majesty. Amen.
  status: draft

