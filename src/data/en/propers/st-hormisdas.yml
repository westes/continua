nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Hormisdas, a Campanian by race, his father Justus of Frosinone, on the seventh day after the death of Symmachus, when he was already deacon of the holy Roman Church, was raised, with the consent of all, to the holy See of Peter: in which he so bore himself, and applied such diligent labour to feeding the Lord's flock, that it was clearly seen he had been chosen not without singular providence of God and divine counsel. For in those times the Church needed a man who would take up difficult things to be done with spirit, and bring what he had undertaken vigorously to the desired end.

        When he entered on the supreme office of Pontiff, he found nearly the whole Christian world groaning under barbarian or heretical kings, and the Church torn into parts. But in the space of eight years, a man plainly full of God, by unceasing care and the happy outcome of his labours, he brought it about that the Eastern churches, separated for some eighty years by a foul schism, returned to unity by subscribing the formulary which he had sent through his legates; and the bishops of Africa, whom the Vandals had banished to Sardinia, were restored; and the king and people of the Lazi were led to the faith of Christ by his work; and finally Clovis, king of the Franks, converted to the same faith, offered Hormisdas by solemn legation to the Apostolic See a golden crown set with gems, as a perpetual monument of obedience and faith.

        He also examined the Manichaeans, and burned their books in a fire before the doors of the Constantinian basilica. He wrote very many letters to various persons throughout the whole Christian world, in which his most ardent zeal for spreading religion, with which he burned to the marrow, his knowledge of the sacred letters joined with a most limpid and pleasant style, in which he was very strong, his singular skill in conducting affairs, especially with kings and nobles, in which he excelled beyond others, and other heroic gifts of mind, shine wonderfully. His pious liberality toward the needy and sacred buildings was poured out. At last, master of his wishes, heavy with years and merits, and most celebrated before God and men for the glory of his deeds, after nine years of pontificate he migrated to the heavenly country, in the year of Christ 523, the remains of his lifeless body being left in the Vatican basilica.
      status: draft
