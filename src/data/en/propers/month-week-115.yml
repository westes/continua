magnificat-antiphon/~-first:
  text: I have set watchmen upon thy walls, O Jerusalem, * which shall never hold their peace day nor night, praising the Name of the Lord.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Basil the Great, Homily on Psalm 33
      text: |-
        Whenever the desire to sin cometh over thee, I would that thou couldest think of the awful and overwhelming judgment-seat of Christ. There the Judge shall sit upon a throne high and lifted up. Every creature shall stand before Him, quaking because of the glory of His presence. Presently there will be found, by the sides of those who have in life wrought much evil, dreadful and hideous angels with faces of fire, and burning breath, appointed thereto, and showing their evil will, in appearance like the night, in their despair and hatred of mankind.

        Think again of the bottomless pit, the impenetrable darkness, the lightless fire, burning, but not glowing; the poisonous mass of worms, preying upon the flesh, ever feeding, and never filled, causing by their gnawing unbearable agony; lastly, the greatest punishment of all, shame and confusion for ever. Have a dread of these things, and let that dread correct thee, and be as a curb to thy mind to hold it in from the hankering after sin.

        This fear of the Lord the Prophet hath promised to teach. But he hath not promised to teach it to all, but only to such as will hear him; not to such as have fallen far away, but to such as run to him, hungry for salvation; not to such as have no part in the promises, but to such as by baptism are born children of adoption, set at peace and oneness with the Word. "Come, ye children," saith he, that is to say, "Draw nigh unto me by good works, all ye who by the new birth have become the worthy children of light; hearken unto me, all ye who have the ears of your heart opened; I will teach you the fear of the Lord," even the fear of that Being of Whom we have just been speaking.
      responsory: |-
        R. I have set watchmen upon thy walls, O Jerusalem; * Which shall never hold their peace day nor night, to praise the name of the Lord.
        V. They shall proclaim My might unto the nations, and declare My glory unto the Gentiles.
        R. Which shall never hold their peace day nor night, to praise the name of the Lord.
      status: verified
