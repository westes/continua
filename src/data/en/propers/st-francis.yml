nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Francis was born at Assisi in Umbria. From his early youth he followed the example of his father, and busied himself with merchandise. It befell one day that, contrary to his usage, he had thrust from him a beggar, who cried for money for Christ's sake, when, being cut to the heart with regret, he gave him large alms, and promised to God from that day forth never to deny to any that asked of him. He fell after this into a grievous sickness, and from the time that he was healed thereof, he gave himself more earnestly to works of love for his neighbour. At length he became fain in this sort to be perfect, even as the Lord hath said in the Gospel, and gave to the poor whatsoever he had. His father would not have it so, and brought him before the Bishop of Assisi, that he might renounce all right to any inheritance. He cheerfully gave up all to his father, even to his clothes, telling them that now he should be able with more utter dependence to say Our Father, Who art in heaven.

        When he heard read the words of the Gospel: Provide neither gold, nor silver, nor brass in your purses, nor scrip for your journey, neither two coats, neither shoes, thereupon he determined that that should be his rule of living. He took off his shoes, and contented himself with one coat. When he had gathered twelve comrades, he founded the Order of Friars Minor. He went to Rome to get from the Apostolic See a confirmation of his Order. When he came Pope Innocent III. thrust him away. Thereafter he dreamt that he saw the Church of the most Holy Saviour falling, and whom he had cast forth bearing it up with his shoulders. He bade therefore that he should be sought for and brought again before him, welcomed him kindly, and approved all the Rule which he had established. Francis therefore sent his Friars into all quarters of the world to preach the Gospel of Christ. He himself was fain to find some occasion of martyrdom, and therefore made a voyage into Syria, but the Sultan treated him with the greatest kindness, offering him many gifts, and, since he could do no good, he returned again to Italy.

        Many houses of Friars of his Order having already been built, he withdrew himself into a most secret place upon Mount Alverno, and began to fast for forty days in honour of the holy Archangel Michael. Upon the Feast-day of the Uplifting of the Holy Cross, he saw a vision of a crucified Seraph, which left in his hands and feet holes with nails therein, and in his side a great wound. Holy BuonaVentura hath left it in writing that he once heard Pope Alexander IV., when preaching, testify that he had himself seen these marks. It was a sign of such love of Christ toward him as stirred up the great wonder of all men. Two years thereafter he fell sick unto death, and was fain to be carried into the Church of St. Mary-of-the-Angels, that he might give up the breath of life in the same place where God had breathed into him the breath of the life of grace. There he exhorted the Friars to be poor and lowly, and to cleave to the faith of the Holy Church of Rome, and began to recite the Psalm: I cried unto the Lord with my voice, and in uttering the words, the righteous wait for me, till Thou deal bountifully with me, he gave up the ghost. He was famous for miracles, and Pope Gregory IX. added his name to the list of the Saints.
      status: verified
