nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        This Joseph was born, of godly parents, at Cupertino, a small village of the diocese of Nardo, between Brindisi and Otranto, in the year of Redemption 1603. The love of God came to him early, and he passed his childhood and youth in great guilelessness and harmlessness. After recovering by the help of the Virgin Mother of God from a long and painful sickness which he bore very quietly, he gave himself altogether to godliness and self-improvement. God called him inwardly to higher things, and to give himself more utterly to His service, he determined in himself to join the "Seraphic" Order. After diverse failures and changes, he obtained his wish among the Friars of the convent of "La Grotella." He went first as a lay-brother, on account of his ignorance of letters, but God was pleased to allow him afterwards to be taken among the choir brethren. After taking his solemn vows he was ordained Priest, and then set before him to aim at a more perfect life. To this end (as far as in him lay) he thrust from him all earthly affections and all carnal things, even to such as seem almost needful for life. He tormented his body with haircloth, scourging, spiked chains, and every kind of hardship and affliction. He fed his spirit sweetly upon the constant exercise of holy prayer, and gazing upon the highest matters. And so it came to pass that the love of God, which had been enkindled in his heart from his earliest years, burnt forth day by day more strangely and openly.

        The chief outcome of this love of God was the strong and marvellous trances whereinto he oftentimes fell. It was, nevertheless, strange to observe that after he had entirely lost his senses he could be called out of the trance by the mere order of his superiors. To be utterly obedient was one of his chief aims, and he was used to say that those who ruled him could lead him about like a blind man, and that it was better to die than not to obey. He so imitated the poverty of the Seraphic Patriarch, that when he was at the point of death, he was able to tell his Superior that he had absolutely nothing. Thus bearing about in his body the dying of the Lord Jesus, the life also of Jesus was made manifest in his body. When he saw that certain persons had committed a foul sin of uncleanness, there came from him a strong savour, a proof of that snowy and glorious purity which, in spite of the most hideous temptations whereby the unclean spirit wrestled long to darken it, he kept undefiled, partly by an iron bridling of his senses, partly by the stern punishments he inflicted upon his own body, and partly by the extraordinary protection of the pure Virgin Mary, whom he was used to call his own Mother.

        This eagerness on the part of the blessed Joseph was but one outcome from his love for his neighbours. So great was his zeal for souls, that he vehemently sought in all ways for the salvation of all. They who reviled, and slandered, and insulted himself were not cut off from his love. He was used to welcome such with great long-suffering, meekness, and cheerfulness of countenance. But God, Who exalteth them of low degree, glorified His servant during life with the gifts of heavenly wisdom, of prophecy, of discerning the hidden thoughts of the heart, of healing, and of other spiritual gifts in marvellous abundance, gave him a precious death, and made the place of his rest glorious. He fell asleep in Jesus upon the very day and at the very place foretold by himself, that is, at Osimo, in the 61st year of his own age. He was famous for miracles even after his death, and Benedict XIV. enrolled his name among those of the Blessed, and Clement XIII. among those of the Saints.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matthew 22:1-14
      text: At that time, Jesus spoke to the chief priests and the Pharisees in parables, saying, The kingdom of heaven is like a king who made a marriage feast for his son. And he sent his servants to call in those invited to the marriage feast, but they would not come. Again he sent out other servants, saying, "Tell those who are invited, behold, I have prepared my dinner; my oxen and fatlings are killed, and everything is ready; come to the marriage feast." But they made light of it, and went off, one to his farm, and another to his business; and the rest laid hold of his servants, treated them shamefully, and killed them. But when the king heard of it, he was angry; and he sent his armies, destroyed those murderers, and burnt their city. Then he said to his servants, "The marriage feast indeed is ready, but those who were invited were not worthy; go therefore to the crossroads, and invite to the marriage feast whomever you shall find." And his servants went out into the roads, and gathered all whom they found, both good and bad; and the marriage feast was filled with guests. Now the king went in to see the guests, and he saw there a man who had not on a wedding garment. And he said to him, "Friend, how did you come in here without a wedding garment?" But he was speechless. Then the king said to the attendants, "Bind his hands and feet and cast him forth into the darkness outside, where there will be the weeping and the gnashing of teeth." For many are called, but few are chosen.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Bk. II, Homily 38 on the Gospels
      text: |-
        Dearly beloved brethren, ye have already entered, at the Lord's bidding, into the house where the marriage feast is being held, that is to say, into the Holy Church, and look ye well to it, that when the King cometh in to see the guests, he see nothing amiss in your soul's wedding-garment. For indeed it is with great searchings of heart that we are behoven to consider that which so soon cometh. "And when the King came in to see the guests, he saw there a man which had not on a wedding-garment." Dearly beloved brethren, what are we to think is signified by this wedding garment? Is it baptism or is it faith? But without baptism, or without faith, who could be seated at the marriage-feast? He that believeth not would still be without the house. What then, except love, must we understand by the wedding-garment? He who hath faith and is in the Holy Church, but hath not charity, cometh in unto the wedding indeed, but hath not a wedding-garment. And charity is well called the wedding-garment, for it is the garment wherewithal our Maker decked Himself when He came to wed the Church unto Himself.

        It was the work of God's love alone that His Only-begotten Son should wed Himself unto the souls of the elect. Whence indeed John saith: "God so loved the world, that He gave His Only-begotten Son, that whosoever believeth in Him should not perish, but have everlasting life." He therefore Whom love brought among men, showeth that the same love is His wedding-garment. Each one therefore of you who is in the Church and believeth in God, hath already come in unto the marriage-feast, but if he keep not the grace of charity, he is come in thither not having a wedding-garment. In sooth, my brethren, if one be asked to an earthly marriage, he changeth his attire, to show even by his garments that he rejoiceth in the joy of the Bride and Bridegroom. We are come unto God's marriage-feast, and we make pretence to change the vesture of our hearts.

        We must know that as every garment is woven upon two beams, an upper and a lower, so love is bound unto two commandments, the one bidding us to love God, and the other to love our neighbour. For thus is it written: "Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind." And the second is like unto it: "Thou shalt love thy neighbour as thyself." In the which we are to see that bounds are set to that love wherewith we are to love our neighbour, for it is said: "Thou shalt love thy neighbour as thyself." But to the love wherewith we are to love God are set no bounds, for it is said: "Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind." A man is not commanded to what point he is to love God, but from what point, even as it is said, "with all"; for he only truly loveth God, who leaveth nothing for himself.
      status: verified
