collect:
  text: |
    Let us pray.
    O God, Who art pleased that thine Only-begotten Son being lifted up
    from the earth should draw all things unto Him, be entreated for the
    sake of thy servant Joseph, whom Thou didst make like unto one of the
    Seraphim, and so effectually work in us, that even as he, we also may
    be drawn up above all earthly lusts, and worthily attain unto Him.
    Who livest and reignest with him, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. I am dead * and my life is hid with Christ in God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, Who art pleased that thine Only-begotten Son being lifted up
