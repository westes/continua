nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Joseph, who by the Apostles was surnamed Barnabas, which is, being interpreted, the Son of Consolation, a Levite and of the country of Cyprus, having land, sold it, and brought the money, and laid it at the Apostles' feet. When Paul, after his conversion, was come to Jerusalem, the disciples were all afraid of him, but Barnabas took him, and brought him to the Apostles. When tidings that a great number believed and turned unto the Lord at Antioch came unto the ears of the Church which was at Jerusalem, they sent forth Barnabas that he should go as far as Antioch. Who, when he came, and had seen the grace of God, was glad, and exhorted them all that with purpose of heart they would cleave unto the Lord. For he was a good man, and full of the Holy Ghost, and of faith, and much people was added unto the Lord.

        Then departed Barnabas to Tarsus for to seek Paul, and, when he had found him, he brought him unto Antioch. And it came to pass that a whole year they assembled themselves with the Church, and taught much people. And the disciples were called Christians first in Antioch. Then the disciples, every man according to his ability, determined to send relief unto the brethren which dwelt in Judea, which also they did, and sent it to the elders by the hands of Barnabas and Paul. And Barnabas and Paul returned from Jerusalem, when they had fulfilled their ministry, and took with them John, whose surname was Mark.

        Now there were in the Church that was at Antioch, certain Prophets and teachers and, as Paul and Barnabas, together with them, ministered to the Lord and fasted, the Holy Ghost said: Separate Me Barnabas and Saul for the work whereunto I have called them. And when they had fasted and prayed, and laid their hands on them, they sent them away. So they, being sent forth by the Holy Ghost, departed unto Seleucia; and from thence they sailed to Cyprus, in the which island, and in many other cities and countries, they journeyed about, preaching the Gospel with great gain to them that heard them. Nevertheless, at last, Paul and Barnabas departed asunder one from the other. And so Barnabas took Mark and sailed unto Cyprus once more. And there it was that upon a certain day in June, in or about the seventh year of the reign of Nero, Barnabas crowned the dignity of the Apostolate with the glory of martyrdom. During the reign of the Emperor Zeno, his body was found in its grave in Cyprus; on his breast lay a copy of the Gospel according to Matthew, written by the hand of Barnabas himself.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 10:16-22
      text: 'At that time: Jesus said unto His disciples: Behold, I send you forth as sheep in the midst of wolves. And so on.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Patriarch of Constantinople, Homily 34 on Matthew
      text: |-
        When the Lord had cleared the minds of His disciples of all care, and had armed them by showing forth His mighty works, had estranged them from all business of this world, and freed them from all anxiety touching the things of time, moulding them into a frame of iron-like, nay, diamondlike, hardness, then at length He told them of the contendings against the which they were afterward to wrestle. By this foretelling of things to come they were much holpen. First, they learnt the power of His fore-knowledge. Then, they were guarded against all suspicion that these great sorrows flowed from faultiness in their Master. Again, the future sufferers were made safe from all trouble of being taken unawares. Lastly, seeing that they heard these things at a time nigh to His own suffering, they were not over troubled.

        And now, that they may understand how that this is a new kind of warfare, and an unaccustomed manner of contending, when He sendeth them forth unarmed, providing neither gold, nor silver, nor brass in their purses nor scrip for their journey, neither two coats, neither shoes, nor yet staves, left to the hospitality of whosoever would receive them, He maketh not here an end to His discourse, but, in manifestation of His unspeakable power, He biddeth them, so going, to show forth the meekness of sheep, seeing they were about going unto wolves; neither simply unto wolves, but in the very midst of wolves. Neither is it only the meekness of sheep which He biddeth them have, but also the harmlessness of doves, that He might so much the more gloriously display His power, when the sheep overcame the wolves. These are the sheep which albeit they abide in the midst of wolves, and are mangled by many a bite, not only are not destroyed, but do gradually make the wolves change their nature, and become sheep themselves.

        Beyond all doubt it is a greater and more marvellous thing to change the minds of enemies, and to turn their thoughts round, than to kill them; more especially when the work is to be done by only twelve sheep, and the whole world is full of the wolves. Shame then upon us, whose deeds are so contrary, and who rather run like wolves upon our enemies. For so long as we are sheep we conquer; yea, though a thousand wolves be gathered round about us, we overcome, and are the conquerors; but if we become wolves ourselves, then are we conquered. For then doth the Shepherd's help forsake us, Who feedeth not wolves but sheep.
      status: verified
