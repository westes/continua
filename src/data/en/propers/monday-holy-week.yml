collect:
  text: |
    Let us pray.
    Grant, we beseech Thee, almighty God, that we, who through our own weakness are overcome by so many adversities, may find relief through the intercession of the Passion of Thine Only-begotten Son:
    Who liveth and reigneth with Thee in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    Help us, O God of our salvation, and grant us grace to draw near with joy to the memorial of thy great mercies whereby Thou wast pleased to make us new creatures.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Father, glorify Thou Me * with Thine own self, with the glory which I had with Thee before the world was.
  status: verified

magnificat-antiphon:
  text: Thou couldest have no power at all against Me, * except it were given thee from above.
  status: verified
