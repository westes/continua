collect:
  text: |
    Let us pray.
    Almighty and everlasting God, who, that mankind might have an example of humility to imitate, didst cause our Saviour to take flesh and to undergo the cross: mercifully grant that, as we celebrate the solemn Commemoration of his Passion, so we may deserve to have the lessons of his patience and a share in his resurrection.
    Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    Behold, God himself hangs on the infamous wood,
    drenched with outpoured blood;
    behold, his kindly hand is deeply
    cleft by the cruel nail.

    Him, as the minister of base crime,
    behold in the midst between unworthy thieves;
    cruel was that terrible
    will of the nation.

    Alas, his face grows pale; behold, the fallen head
    is bowed; with closed eyes the Redeemer
    pours out his spirit, laden with merits,
    from his sacred mouth.

    O heart, thou art harder than bronze, unless
    by groaning thou wipe away thy sin; thy guilt
    fixed Christ to the stake; thy guilt
    subjected him to black death.

    To God be eternal honour for all ages,
    who, loving Redeemer of our race,
    washed away with his blood the stain of guilt
    that harmed us wretched ones. Amen.
  status: draft

matins-invitatory:
  text: Christ the King crucified, * O come, let us adore.
  status: draft

lauds-capitulum:
  text: 'Brethren: For let this mind be in you, which was also in Christ Jesus: who, being in the form of God, thought it not robbery to be equal with God: but emptied himself, taking the form of a servant, being made in the likeness of men, and in habit found as a man. He humbled himself, becoming obedient unto death, even to the death of the cross.'
  citation: Philippians 2:5-8
  status: draft

lauds-hymn:
  text: |
    In a savage whirlwind of sorrows
    the Redeemer is tossed, overwhelmed with dark
    pains, enduring bitter things,
    fastened to the Cross.

    The nails make feet and hands bloody
    with a dreadful wound;
    heart, face, limbs, breast
    overflow with sacred blood.

    He weeps, prays, and dies crying out;
    the Mother's stricken heart sinks;
    alas, Mother! alas, Son! let sorrow
    break ungrateful breasts.

    Mountains, tombs and rocks
    are rent; fields, rivers,
    cliffs and sea tremble,
    and the veil of the temple is rent.

    Sun, moon, heaven, stars
    mourn, and the world groans.
    O you men, you little ones,
    brides, maidens, weep,

    stand mourning by the Cross,
    anoint the blessed feet,
    wash them with tears, wipe them
    with your hair, and kiss them with your lips.

    Thou, victim of charity,
    that thou mightest take away our sins,
    dost accomplish for us adoption
    by thy saving Blood.

    Be then our peace and joy,
    be life, Jesus, and reward,
    be leader and light on the way,
    recompense and crown in the Homeland. Amen.
  status: draft

