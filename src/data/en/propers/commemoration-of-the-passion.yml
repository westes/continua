vespers-hymn:
  text: |
    Mourning eyes, shed your tears,
    and let the depths of the heart resound with grief:
    I relate the punishments and cruel wounds
    inflicted by the impious upon the Godhead.

    Alas! the band of soldiers, girt with swords,
    falls with clubs upon the seized Lord;
    now it strikes with blows of the fist, now it shakes
    the divine Head with dreadful strokes.

    There is no end to the crime; Christ is handed over
    to the wicked executioner; without delay the barbarian
    does not fear, with impious daring,
    to raise his hand against the King of heaven.

    Hear, O peoples: the lovable Godhead,
    with blood flowing from the shoulders on every side,
    sustains the onslaught of the raging lictor,
    and the innocent One stifles his voice.

    Who would not weep! The iniquity of the untamed nation
    has now devised new torments.
    It fixes into his brain, alas! in its savagery,
    a garland rough with brambles.

    Alas, the crime! The Lord is dragged by wicked ropes
    to the place of the deadly punishment;
    there he met his end, in death
    giving back his spirit to his Father.

    To him who suffered such cruel wounds for wretched men,
    let due glory resound on earth;
    and let mankind ever raise his sacred Name
    to the heavens. Amen.
  status: draft

