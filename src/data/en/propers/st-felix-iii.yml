nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Felix the Third, a Roman by birth, born of the most noble house of the Anicii, and great-grandfather of the divine Gregory the Great, was raised to the summit of the supreme pontificate after Simplicius. With wonderful constancy of mind, though Rome under the Arian Heruli seemed almost captive, and other Patriarchs had approved the reconciliation with the Emperor Zeno, he alone did not communicate with him. When Zeno promulgated an edict about the faith, he boldly repressed his audacity, deposed Peter the Fuller from the patriarchate of Antioch, compelled Acacius, bishop of Constantinople, to come to Rome to answer the charges brought against him in the judgment of the Apostolic See, and passed on him a sentence of excommunication.

        He ordained that churches be consecrated only by bishops; he forbade, under heavy penalties, that those once baptized be rebaptized. He built the basilica of St. Agapitus. In the third year of his pontificate, the Apostle St. Barnabas, with the Gospel of St. Matthew, appeared in Cyprus to Anthemius, bishop of Salamis; and so, after a threefold revelation, the body of St. Barnabas was found with the aforesaid Gospel. He held two ordinations in the month of December, in which he created at Rome twenty-nine priests, five deacons, and thirty bishops for various places. On the fifth day before the Kalends of March, leaving the earth, he flew to those above.
      status: draft
