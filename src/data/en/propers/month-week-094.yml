magnificat-antiphon/~-first:
  text: O Adonai, O Lord God, * Thou art great and glorious, Who hast given salvation into the hand of a woman, graciously hear the prayers of thy servants.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, On Elijah and Fasting, ch. 9
      text: |-
        It is not for kings to drink wine, nor for princes strong drink, lest they drink and forget the law. (Prov. 31:5.) The rulers drank wine even unto drunkenness, who planned to deliver themselves into the hand of Holofernes, captain of the host of the King of the Assyrians; but the woman Judith drank not, who fasted all the days of her widowhood, saving the solemn Feast-days. She went forth in the harness of this abstinence, and over-reached the whole army of the Assyrians. By the clear thought of her soberness she took away the head of Holofernes, kept her chastity, and carried off the victory.

        Armed with fasting, she entered the camp of the strangers; he lay soaked in wine, so that he could not feel the blow that slew him. And thus the fast of one woman overthrew the countless armies of the Assyrians. Esther also became fairer by fasting, for the Lord gave favour unto her for her soberness. She delivered all her nation, that is, the whole people of the Jews, from the fierceness of persecution, so that she brought down the King himself under her will.

        Thus also she who fasted three days, and washed her body with water, found greater favour, and obtained vengeance, whereas Haman, who boasted himself at the King's table, paid the penalty of his drunkenness, even while yet he was in his cups. Fasting, therefore, is a sacrifice of reconciliation, a means of strength, whereby in the might of grace, women wax manful. Fasting knoweth not usury, nor the gain of the usurer; the faster's table smelleth not of usury, but the fast itself giveth favour to them that sit at meat. A banquet is all the pleasanter after hunger, whereas by constant use it becometh unattractive, and when it is long carried on cometh to be lightly esteemed. Fasting is a good sauce for meat. The keener the appetite, the more toothsome the food.
      responsory: |-
        R. We know no strange God before the Lord. In Him we trust. * He despiseth us not, neither putteth He away His salvation from our nation.
        V. His mercy let us seek with tears, and humble our souls before Him.
        R. He despiseth us not, neither putteth He away His salvation from our nation.
      status: verified
