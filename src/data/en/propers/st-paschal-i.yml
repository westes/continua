nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Paschal, the first of that name, two days after the death of Stephen the Fifth had scarcely passed, by the common votes of the clergy was raised, unwilling indeed and greatly reluctant, to the supreme summit of the Apostolic See, in the year of our Lord Jesus Christ 817. A man of every kind of learning, especially well instructed in sacred things, remarkable for sanctity of life, most eloquent in speech, and finally of singular piety toward God and charity toward his neighbour, so that as he always gave away outward goods with a cheerful mind to the poor, so he laid up the riches of the inner soul by vigils, prayers and fasts.

        From boyhood he was brought up in the patriarchium of the Lateran church under the eyes of the Pontiffs, and so profited in every kind of virtue, in letters and ecclesiastical discipline, that, first initiated into sacred orders, soon, his virtue being perceived, he was placed by Leo the Third over the monastery of St. Stephen; where he both was an example to the monks subject to him, and so received the pilgrims coming in crowds to the thresholds of the Apostles that he supplied all things necessary to all, and, imitating Christ, rendered them even the lowliest services; by which offices of piety and charity he was held most worthy of all to preside over the Lord's flock and the whole Church.

        Nothing, moreover, was wanting in him which pertained to the perfect solicitude of apostolic government; the discipline of the Western Church, which flourished most under him, he kept untouched; the Eastern, shaken by the emperor and the patriarch, the iconoclasts, he refreshed by letters and legation, and to the Greeks fleeing to Rome he kindly granted the monastery of St. Praxedes, furnished by himself with most ample revenues. Many bodies of the saints also from the cemeteries, after the example of Paul the First, and especially of St. Cecilia, she herself showing and revealing it, he brought into the City. He raised new temples, restored, and wonderfully adorned the old. Xenodochia and monasteries of sacred virgins he renewed with new endowment. Illustrious at last for the miracle of a fire extinguished, he departed to the Lord in the eighth year of his pontificate, and was laid in the Vatican basilica.
      status: draft
