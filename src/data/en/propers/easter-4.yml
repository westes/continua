nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 147, de Tempore
      text: |-
        During these Holy Days in commemoration of the Lord's resurrection, we purpose to preach, so far as he will empower us, the doctrine of the resurrection of the body. For this is the Faith, to wit: the gift of resurrection, which was bestowed upon the flesh of our Lord Jesus Christ, is what is promised to us, for it was first made manifest in him that we might know what to hope for ourselves. What he hath thus promised would come to us at the last, he willed not only to foretell but to demonstrate. Those who were present at that time (even though they were terrified and affrighted, and supposed they had seen a spirit), handled him, and saw that a spirit would not have flesh and bones, such as they saw him to have. Thus he spake to them, not only in words which they could hear, but in a body which they could see; as if it had not been enough to shew himself to their sight, but must needs even offer himself to be touched and handled.

        For he said: Why are ye troubled? and why do thoughts arise in your hearts? For they supposed that they had seen a spirit. Therefore he added: Behold my hands and my feet, that it is I myself; handle me and see; for a spirit hath not flesh and bones, as ye see me have. Of course, men have disputed this evidence; for what else could men do, seeing that they are wise only according to man's wisdom, which thus permitteth them to dispute concerning God in spite of what God hath shewn them of himself? He is God, they are men. But God knoweth the thoughts of man, that they are but vain.

        To carnal men, the one rule of understanding is his ordinary experience; seeing is believing. What men are accustomed to see, that they credit; what they are not accustomed to see, that they deem incredible. But God often worketh wonders (that is, things contrary to what we are accustomed), because he is God. Every day many men are born that previously had no existence at all; and this is a greater miracle than that a few, who did exist, have been raised from the dead. Yet this wonder is not recognized as such; on the contrary, it is disregarded because man is accustomed to it. Christ rose again from the dead; that is a fact. He had a body: he took flesh, he hung upon the cross, he gave up the ghost; his flesh was laid in the tomb. After that, he shewed his flesh as alive again, he lived again in the flesh. Why wonder, why deny it? God wrought this.
      responsory: |-
        R. One of the seven Angels talked with me, saying: Come hither, I will show thee the bride, the Lamb's wife. * And I saw Jerusalem descending out of heaven, adorned with her jewels. Alleluia, Alleluia, Alleluia.
        V. And he carried me away in the Spirit to a great and high mountain.
        R. And I saw Jerusalem descending out of heaven, adorned with her jewels. Alleluia, Alleluia, Alleluia.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 16:16-22
      text: 'At that time, Jesus said to His disciples: A little while, and now you shall not see me; and again a little while, and you shall see me: because I go to the Father. Then some of the disciples said one to another: What is this that he saith to us: A little while, and you shall not see me; and again a little while, and you shall see me, and, because I go to the Father? They said therefore: What is this that he saith, A little while? we know not what he speaketh. And Jesus knew that they had a mind to ask him; and he said to them: Of this do you inquire among yourselves, because I said: A little while, and you shall not see me; and again a little while, and you shall see me? Amen, amen I say to you, that you shall lament and weep, but the world shall rejoice; and you shall be made sorrowful, but your sorrow shall be turned into joy. A woman, when she is in labour, hath sorrow, because her hour is come; but when she hath brought forth the child, she remembereth no more the anguish, for joy that a man is born into the world. So also you now indeed have sorrow; but I will see you again, and your heart shall rejoice; and your joy no man shall take from you.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 101 on the Gospel of John
      text: |-
        This little while is the whole duration of this present world. In the same sense this same Evangelist saith in his Epistle: It is the last time. The words, because I go to the Father, refer to the first clause of the text, namely, A little while and ye shall not see Me, and not to the latter clause, that is, and again a little while, and ye shall see Me. By His going to the Father He was about to bring it to pass that they should see Him no more. And thus it was that He said, not that He was about to die, and that after His death they should not see Him until He rose again, but that He was going to the Father, which He did when, after that He was risen again and had manifested Himself to them for forty days, He ascended up into heaven.

        Illis ergo ait: to them which were looking on Him in the Body, He saith: A little while, and ye shall not see Me, a little while, and they who now saw Him clad in a dying nature, should see Him so no more, because He was about to go to the Father. But He saith: And again a little while, and ye shall see Me, and these words are a promise to the Universal Church, just as are those others: Lo, I am with you alway, even unto the end of the world. Our Lord delayeth not His promised coming. Again a little while, and we shall see Him. And, O, when we shall see Him, then we shall beg, we shall ask no more; for no desire will be unsatisfied, and no riddle unsolved.

        This little while seemeth a very long while to us now, while as it is still going on, but when it is over we shall feel indeed how truly it is but a little while. Therefore, may our rejoicing never be like the rejoicing of that world whereof it is said: The world shall rejoice. A woman when she is in travail hath sorrow, and yet, while hitherto our gladness is still coming to the birth through throes of sorrow, let us not be altogether sorrowful, but, as the Apostle hath it: Rejoicing in hope: patient in tribulation. A woman, when she is in travail hath sorrow, because her hour is come: but as soon as she is delivered of the child, she remembereth no more the anguish, for joy that a man is born into the world. And so will it be with us.
      responsory: |-
        R. The people of Israel sung: Alleluia, and all the multitude of Jacob sung in measure. * And David was with the singers, and played upon an harp in the house of the Lord, and sung praises unto God. Alleluia, Alleluia.
        V. So the Priests and the Levites were sanctified, and all Israel brought up the ark of the covenant of the Lord with shouting.
        R. And David was with the singers, and played upon an harp in the house of the Lord, and sung praises unto God. Alleluia, Alleluia.
      status: verified
