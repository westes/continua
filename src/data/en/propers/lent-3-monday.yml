collect:
  text: |
    Let us pray.
    O Lord, we beseech thee mercifully to shed abroad thy grace into our hearts, that we who are now denying carnal meats to our bodily cravings, may have power likewise to withhold from the same all yielding to the deathful lusts of sin.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    Let our help, O Lord, be in thy mercy, that we over whom thy wrath doth most justly hang because of our sins, may in all dangers worthily be shielded by thy protection and delivered by thy salvation.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

