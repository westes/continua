magnificat-antiphon/~-first:
  text: O Lord, the King of kings, That containest the circuit of the heavens and beholdest the depths, That weighest the mountains, and holdest the earth in thine hand, * hear us, O Lord, when we cry unto thee.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, City of God, Book 18, ch. 28
      text: |-
        As to the Prophet Hosea, the deeper his meaning, the harder to pierce. But somewhat may be gotten out of him, and, as I promised, I will give it here. He saith: "And it shall come to pass that, in the place where it shall be said unto them, Ye are not My people, there it shall be said unto them, Ye are the sons of the living God." This was understood even by the Apostles as a Prophetic witness to the call of the Gentiles, who erst had not been God's people. (Rom. 9:24-26.)

        And since the converted Gentiles are the spiritual children of Abraham, and are therefore rightly called Israelites, therefore he goeth on, and saith: "Then shall the children of Judah and the children of Israel be gathered together, and appoint themselves one head, and they shall come up out of the land." If we went on expounding this, we should water down the flavour of the prophetic draught. Let there be remembered, however, that Corner Stone, and let there be acknowledged those twain walls, (which It bindeth in one,) the Jews and the Gentiles, one called the children of Judah and the other the children of Israel, bound together under One Head, and coming up out of the land.

        Concerning them that are now Israelites according to the flesh, that will not now believe in Christ, but shall believe hereafter (that is, their children shall believe, for these shall die, and go to their own place), this same Prophet giveth witness, where he saith: "The children of Israel shall abide many days without a King, and without a Prince, and without a sacrifice, and without an Altar, and without a Priest, and without oracles." (3:4.) To whom is it not manifest that such is the state of the Jews now?
      responsory: |-
        R. I have set watchmen upon thy walls, O Jerusalem; * Which shall never hold their peace day nor night, to praise the name of the Lord.
        V. They shall proclaim My might unto the nations, and declare My glory unto the Gentiles.
        R. Which shall never hold their peace day nor night, to praise the name of the Lord.
      status: verified
