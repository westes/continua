nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Leo, the third of that name, a Roman, the son of Astippius, from boyhood educated in the vestiary of the Lateran patriarchium in all ecclesiastical and divine discipline, from a monk of St. Benedict cardinal priest, and finally Supreme Pontiff, was created with the incredible consent of all, on the very day of the death of Hadrian, in the year 795, and sat in the holy see of Peter twenty years, five months, and seventeen days.

        He showed himself in the pontificate such as he had presented himself before assumption: most pious, namely, most gentle, of singular religion toward God, charity toward his neighbour, prudence in the conduct of affairs, a father of the poor and sick, defender of the Church, promoter of divine worship, as one who diligently accomplished and patiently bore the greatest things for Christ and the Church.

        When by the impious he had had his eyes torn out and been left half-dead, pierced with wounds, on the next day he was found whole by a notable miracle, and by his prayers obtained life for the same parricides. To Charlemagne, king of the Franks, he conferred the Roman empire; he built for pilgrims a most ample xenodochium; he assigned his patrimony and other estates to the poor. He heaped the basilicas of the City, especially the Lateran (in whose patriarchium he founded a great triclinium above all triclinia), and the sacred buildings with so many and such great riches that he seems to surpass all belief. At last he crowned a most religious life with a pious end, on the day before the Ides of June, in the year of the Lord 816, and was buried in the Vatican.
      status: draft
