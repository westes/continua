collect:
  text: |
    Let us pray.
    Graciously hear our supplications, O Lord, and for the sake of thy Blessed Confessor and Bishop Mark, grant to us in thy mercy both pardon and peace.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Well done, thou good and faithful servant * thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    Graciously hear our supplications, O Lord, and for the sake of thy Blessed Confessor and Bishop Mark, grant to us in thy mercy both pardon and peace.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: This Mark was a Roman, who sat as Pope in the reign of the Emperor Constantine the Great. He ordained that the Bishop of Ostia, by whom the Bishop of Rome is consecrated, should use the Pallium. He built two Churches, one in the city and the other on the Ardeatine Way, which Constantine enlarged and richly gifted. Mark lived as Pope eight months, and was buried in the Cemetery of Balbina.
      status: verified
