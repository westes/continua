nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        When blessed Martin, first of that name, had been banished to Cherson by the tyrannical sentence of the heretical emperor, at the instance of the exarch Theodore, Eugenius, a Roman by country, who almost from the cradle had devoted himself to the sacred order of clerics, acted in the place of the absent Pontiff, that the administration of the Roman Church might not seem to have ceased altogether; but he was seen to use this power modestly, since he knew well that, while Martin was living, he was not the lawful Pontiff, but only as it were acting in his stead.

        But when the aforesaid Martyr of Christ, worn out with hardships and hunger, had passed to the blessed life, he sat in the chair of Peter, with the clergy consenting, as the lawful successor of Peter, and in that summit of the Apostolic ministry bore himself as the dignity of the supreme office entrusted to him, and the salvation and utility of all the faithful of Christ committed to his care, required; for he was gentle, kind and meek, and, what is chief, illustrious for sanctity of life.

        He had singular care of the clergy, whom he always pursued with paternal love and many benefits. Toward the needy, however, his wonderful beneficence shone, to whom he distributed with liberal hand the revenues of the Church, living and dying, deeming above all that the Church's wealth could not be applied to nobler uses, and that it was rightly handed over from the hands of the needy to the treasury of eternity, with incredible gain of spiritual usury. After two years and almost nine months he rested in a holy end, in the year of Christ 655, and his body was laid in the basilica of St. Peter.
      status: draft
