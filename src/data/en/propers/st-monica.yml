nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Monica was twice over the mother of St. Augustine, for, under God, he owed to her both earth and heaven. When her husband was very old she made him a friend of Jesus Christ, and after his death she lived a widow in all purity and constantly occupied in works of mercy. Her son Augustine had fallen into the heresy of the Manichaeans, and for his conversion she earnestly pleaded with God for years, with strong crying and tears. She followed Augustine to Milan, and tenderly and constantly besought him to confer with Ambrose the Bishop. This he consented to do, and at last, through the public sermons and private conversations of Ambrose, his eyes were opened to see the truth of the Catholic Religion, and he received baptism at the Bishop's hands.

        The mother and son set out to return to their home in Africa, but after they had reached Ostia at the mouth of the Tiber, she was stricken down by a fever. One day as she lay sick, she came to herself after her mind had been long wandering, and said: "Where am I?" Then she saw who were standing by, and said: "Let your mother lie here only; remember me at the altar of the Lord." On the ninth day this blessed lady surrendered her spirit to God. Her body was buried there at Ostia in the Church of St. Aurea, but, long after, in the papacy of Martin V, it was carried to Rome and honourably buried again in the Church of St. Augustine.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Confessions, Book 9, ch. 12
      text: We did not think that hers was a death which it was seemly to mark with repining, or tears, or lamentations, seeing that she died not sorrowfully, nor at all as touching her best and noblest part. This we knew, because we knew what her life had been, her faith unfeigned, her sure and certain hope. And then, nevertheless, I remembered again what thine handmaid was used to be, her walk with thee, how godly and holy it was, and with us so gentle and long-suffering; and that it was all gone away from me now. And I wept, over her and for her. And if any man will make it blame to me that I wept for a little while, when I saw lying dead before mine eyes my mother, who had wept over me so many years, that she might see me live, I say, if any man will make it blame to me, I pray him not to sneer at me, but rather (if his charity be so great) himself to weep over my sins before thee, who art a Father to all them to whom thy Christ is a Brother.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 7:11-16
      text: At that time, Jesus went to a town called Naim; and His disciples and a large crowd went with Him. And as He drew near the gate of the town, behold, a dead man was being carried out, the only son of his mother, and she was a widow; and a large gathering from the town was with her. And the Lord, seeing her, had compassion on her, and said to her, Do not weep. And He went up and touched the stretcher; and the bearers stood still. And He said, Young man, I say to you, arise. And he who was dead, sat up, and began to speak. And He gave him to his mother. But fear seized upon all, and they began to glorify God, saying, A great prophet has risen among us, and God has visited His people.
      responsory: |-
        R. O that Thou wouldest hide me in the grave; that Thou wouldest keep me secret, until thy wrath be past, even thine, O Lord, Thou That alone art God; * That Thou wouldest appoint me a set time, and remember me!
        V. Are thy days as the days of man, that Thou inquirest after mine iniquity, and there is none that can deliver out of thine hand.
        R. That Thou wouldest appoint me a set time, and remember me!
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 44 on the Words of the Lord
      text: |-
        That her son was called again to life was the joy of that widowed mother; that souls of men are every day called to life is the joy of our Mother the Church. He was dead in body; they have been dead in mind. His death was outward, and was outwardly bewailed; their inward death hath been neither mourned for nor seen. But He hath sought for them, Who hath seen that they are dead, and He only hath seen that they are dead, Who hath been able to make them alive. If He had not come to raise the dead, the Apostle had not said: "Awake, thou that sleepest, and arise from the dead, and Christ shall give thee light."

        It is written how the Lord raised from the dead three persons visibly, but thousands invisibly. But how many they may have been whom He raised visibly, who knoweth? For all the things which He did are not written. John saith thus: "There are also many other things which Jesus did, the which, if they should be written every one, I suppose that even the world itself could not contain the books that should be written." There were then, doubtless, many more raised to life, but it is not meaningless that three are recorded. For our Lord Jesus Christ hath willed that those things which He did carnally, we should understand also spiritually. He worked not miracles only for the sake of working wonders, but that His works might be at once wonderful to them that beheld, and true to them that understand them.

        Even as one that looketh upon a scroll right fairly written, and knoweth not how to read therein, praiseth the hand of the old scribe when he seeth the beauty of the points, but what it saith, what those points mean, he knoweth not, and praiseth by the eye, without understanding by the mind; and as, on the other hand, he that can not only gaze on it, as can all men, but also can read it, praiseth the penmanship, and catcheth the sense likewise, which the unlearned cannot do: even so, there were some that saw the miracles which Christ did, and understood not what they meant, nor what they, as it were, hinted to such as did understand them, and these only marvelled to see them wrought. And other some there were which saw the works, and marvelled, and understood them, and profited by them. And it is as these last that we ought to be in the school of Christ.
      responsory: |-
        R. Does God pervert judgment, or does the Almighty overthrow that which is just? Deliver me, O Lord, and set me beside you, * And let any man's hand fight against me.
        V. Take hold of arms and shield: and rise up to help me.
        R. And let any man's hand fight against me.
      status: verified
