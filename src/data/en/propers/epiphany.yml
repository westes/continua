      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 2:1-11
      text: At that time, a marriage took place at Cana of Galilee, and the mother of Jesus was there. Now Jesus too was invited to the marriage, and also His disciples. And the wine having run short, the mother of Jesus said to Him, They have no wine. And Jesus said to her, What would you have me do, woman? My hour has not yet come. His mother said to the attendants, Do whatever He tells you. Now six stone water-jars were placed there, after the Jewish manner of purification, each holding two or three measures. Jesus said to them, Fill the jars with water. And they filled them to the brim. And Jesus said to them, Draw out now, and take to the chief steward. And they took it to him. Now when the chief steward had tasted the water after it had become wine, not knowing whence it was - though the attendants who had drawn the water knew, - the chief steward called the bridegroom, and said to him, Every man at first sets forth the good wine, and when they have drunk freely, then that which is poorer. But you have kept the good wine until now. This first of His signs Jesus worked at Cana of Galilee; and He manifested His glory, and His disciples believed in Him.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 9 on the Gospel of John
      text: |-
        Even setting aside any mystical interpretation, the fact that the Lord was pleased to be asked, and to go to a marriage, showeth plainly enough that He is the Author and Blesser of marriage. There were yet to be those of whom the Apostle hath warned us as forbidding to marry; who say that marriage is a bad thing in itself, and a work of the devil. Yet we read in the Gospel that when the Lord was asked, Is it lawful for a man to put away his wife for every cause? He answered that it was not lawful, except it were for fornication. In which answer ye will remember that He used these words: What God hath joined together, let not man put asunder.

        They who are well instructed in the Catholic religion know that God is the Author and Blesser of marriage; and that, whereas joining together in marriage is of God, divorce is of the devil. But it is lawful for a man to put away his wife in case of fornication, for by not keeping a wife's faith to her husband she herself hath first willed not to be wife. They also who have made a vow of their virginity to God and have thereby attained to an higher degree of honour and holiness in the Church, are not unmarried, for they are a special part of the marriage of the whole Church, which is the Bride of Christ.

        And by this, therefore, the Lord being asked, went to the marriage, to strengthen the marriage tie, and to shed light on the hidden meaning of matrimony. In that marriage feast the Bridegroom to whom it was said, "Thou hast kept the good wine until now," was a figure of the Lord Christ, Who hath kept until now the good wine, namely the Gospel.
      responsory: |-
        R. Unto thee, O Lord, do I lift up my soul. * O my God, I trust in thee, let me not be ashamed.
        V. O keep my soul and deliver me.
        R. O my God, I trust in thee, let me not be ashamed.
      status: verified

nocturn-readings/post-~-3:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Exposition of the Epistle to the Galatians
      text: |-
        The reason of the Apostle's writing to the Galatians was this: that they might understand that the grace of God had worked in them that they were no longer under the law. For when the grace of the Gospel was preached to them, there had not been wanting to them some of them of the circumcision, Christians indeed in name, but who had not yet apprehended that great benefit of grace, and desiring still to be bound with burdens of the law: burdens which the Lord God had laid, not upon such as serve righteousness, but upon such as serve sin, laying, that is to say, upon the unrighteous a righteous law, whereby their unrighteousness was made manifest, not taken away. For there is not anything which taketh away sin, save only the grace of faith which worketh by love.

        The men of the circumcision would have the Galatians, who were under grace, to be under the burdens of the law, persuading them that the Gospel profited them nothing, unless they should be circumcised, and take on them the other outward observances of the Jews' religion. Whence the Galatians began to have doubts of the Apostle Paul, by whom the Gospel had been preached to them, as one that held not the doctrine of the other Apostles, who compelled the Gentiles to come under the law.

        The same question is discussed in the Epistle to the Romans, but with this difference: in that case the Apostle putteth an end to the discussion, and stilleth the strife which had arisen between the Jewish and the Gentile converts, in consequence of the Jews holding that they had earned the knowledge of the Gospel as a reward for their observance of the law, and grudging the same knowledge to the uncircumcised, as to men who had done nothing to deserve it; and the Gentiles, on the contrary, maintaining that they were superior to the Jews, in that they were not the murderers of the Lord. Now, in this Epistle to the Galatians, the Apostle addresseth himself to those who were troubled by the authority claimed by them who were of the circumcision, and sought to bring into subjection to the law them who were of the uncircumcision.
      responsory: |-
        R. O Lord, Thou hast shown me the path of life. * Thou shalt fill me with joy in thy presence, at thy right hand there are pleasures for evermore.
        V. Thou art He That shalt restore mine inheritance unto me.
        R. Thou shalt fill me with joy in thy presence, at thy right hand there are pleasures for evermore.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 8:1-13
      text: At that time, when Jesus had come down from the mountain, great crowds followed Him. And behold, a leper came up and worshipped Him, saying, Lord, if You will, You can make me clean. And stretching forth His hand Jesus touched him, saying, I will; be made clean. And immediately his leprosy was cleansed. And Jesus said to him, See that you tell no one; but go, show yourself to the priest, and offer the gift that Moses commanded, for a witness to them. Now when He had entered Capharnaum, there came to Him a centurion who entreated Him, saying, Lord, my servant is lying sick in the house, paralyzed, and is grievously afflicted. Jesus said to him, I will come and cure him. But in answer the centurion said, Lord, I am not worthy that You should come under my roof; but only say the word, and my servant will be healed. For I too am a man subject to authority, and have soldiers subject to me; and I say to one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it. And when Jesus heard this, He marveled, and said to those who were following Him, Amen I say to you, I have not found such great faith in Israel. And I tell you that many will come from the east and from the west and will feast with Abraham and Isaac and Jacob in the kingdom of heaven, but the children of the kingdom will be put forth into the darkness outside; there will be the weeping, and the gnashing of teeth. Then Jesus said to the centurion, Go your way; as you have believed, so be it done to you. And the servant was healed in that hour.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book 1
      text: |-
        When the Lord was come down from the mountain, great multitudes followed Him. They were not able to follow Him when He went up. And first there came a leper. This poor creature's disease had prevented him from hearing the Saviour's long sermon on the Mount. Let it be noted that he is the first person specially named as being healed. The second was the Centurion's servant; the third was Peter's wife's mother, who was sick of a fever at Capernaum; the fourth were they who were brought unto Christ as being troubled with evil spirits, from whom He by His word cast out the evil spirits, at the same time that He healed all that were sick.

        And, behold, there came a leper, and worshipped Him, saying: Properly after preaching and doctrine cometh occasion for a sign, that the power of the miracle might confirm in the hearers the truth of the teaching that had gone before. Lord, if Thou wilt, Thou canst make me clean. He that prayeth the Lord to have the will, doubteth not but that He hath the power. And Jesus put forth His hand, and touched him, saying: I will; be thou clean. As soon as the Lord put forth His Hand, the leprosy departed. Let us remark how lowly and unbragging is the Lord's language. The leper had said, If Thou wilt; the Lord answereth, I will. The leper, Thou canst make me clean; the Lord, Be thou clean. Most Latin readers, misled by the identity of form in that language between the Present Infinitive Active and the Second Person Singular Present Imperative Passive of the Verb, read Christ's answer as if it were, I will to make thee clean. This is wrong. The sentences are separate. First cometh the expression of volition, I will, then the command, Be thou clean.

        And Jesus saith unto him: See thou tell no man. What need was there to tell what his body showed? But go thy way, show thyself to the Priest. There were diverse reasons why Christ should send him to the Priest. First, for humility's sake, that He might show reverence to God's Priest. Then there was a command in the law that they that were cleansed of leprosy should make an offering to the Priests. Moreover, that, when the Priests saw the leper cleansed, they might either believe in the Saviour, or refuse to believe; if they believed, that they might be saved, and, if they believed not, that they might have no excuse. Lastly, that He might give no ground for the accusation that was so often brought against Him, that He was unobservant of the law.
      responsory: |-
        R. Unto thee, O Lord, do I lift up my soul. * O my God, I trust in thee, let me not be ashamed.
        V. O keep my soul and deliver me.
        R. O my God, I trust in thee, let me not be ashamed.
      status: verified

nocturn-readings/post-~-4:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Moralia in Job, Book 4
      text: |-
        We refresh the body lest it should grow too weak and fail us; we chasten it by abstinence, lest it should wax gross, and become lord over us; we strengthen it with exercise, lest it perish by the not using; and straightway we give it rest, lest it faint through weariness; we succour it with raiment, lest the cold should blight it; and we strip it of the raiment wherewith we have clothed it, lest the heat should afflict it. In all these so many offices what do we but serve the corruptible? Upon what is all this care spent but upon that whereover hangeth the doom of weakness and change?

        Therefore Paul saith: For the creature was made subject to vanity, not willingly, but by reason of Him Who hath subjected the same in hope: because the creature itself also shall be delivered from the bondage of corruption into the glorious liberty of the children of God. The creature was made subject to vanity, not willingly: for when man had of his own free will abdicated his state of unchangeable blessedness, the just sentence of death was passed upon him, and whether he willed or not, he became subject to the state of change and corruption. But the creature itself also shall be delivered from the bondage of corruption when it shall rise again incorruptible and be made partaker of the glory of the children of God.

        Here, then, the elect are still subject to sorrow, being yet bound by the sentence of corruption; but when we shall have put off this corruptible we shall be loosed from that sentence, and shall sorrow no more. For though we earnestly desire to appear before God, we are still hindered by the burden of this dying body. Rightly then are we called prisoners, since we are not free to go whither we will, that is to say, to God; and rightly did the prisoner Paul, yearning after the things which are eternal, and still weighed down with the burden of this corruptible, rightly did he cry out: I have a desire to depart and to be with Christ. He would not have felt this keenness if he had not felt himself bound down.
      responsory: |-
        R. O Lord, Thou hast shown me the path of life. * Thou shalt fill me with joy in thy presence, at thy right hand there are pleasures for evermore.
        V. Thou art He That shalt restore mine inheritance unto me.
