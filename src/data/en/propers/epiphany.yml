nocturn-readings/post-~-5:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 8 on the Words of the Apostle
      text: |-
        This is a saying made for man, and worthy of all acceptation, that Christ Jesus came into this world to save sinners. Listen to the words of the Gospel: The Son of man is come to seek, and to save that which was lost. If man had not been lost, the Son of man would not have come. Wherefore, man had been lost; God came made Man, and man was found; man had perished by his own free will: God made Man came by grace which setteth free.

        Dost thou ask how free-will availeth to evil? Call to mind a sinner. Dost thou ask what God made Man availeth to help? Consider in Him the grace which setteth free. There is no example which so showeth what availeth the free will of man, when it is taken possession of by pride, to use it without God's help: of evil is there no greater and plainer example, than the first man. The first man fell, and where had he been if the second Man had not come? As the first was man, so was the second Man, and therefore is this saying a saying made for man.

        Neither is there any example which so showeth what availeth the tenderness of the grace and the abundance of the All-might of God, as the Man That is the Mediator between God and men, the Man Christ Jesus. For what do we say, my brethren? I speak to them that have been bred up in the Catholic Church, or who have been reconciled to that Church. We know and hold that the Mediator between God and men, the Man Christ Jesus, as touching upon His Manhood, is of the same nature as we. For our flesh is not of one nature, and His Flesh of another nature, neither our soul of one nature and His Soul of another nature. He took upon Himself the same nature which He had freely ordained to save.
      responsory: |-
        R. O Lord, Thou hast shown me the path of life. * Thou shalt fill me with joy in thy presence, at thy right hand there are pleasures for evermore.
        V. Thou art He That shalt restore mine inheritance unto me.
        R. Thou shalt fill me with joy in thy presence, at thy right hand there are pleasures for evermore.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 13:24-30
      text: 'At that time, Jesus spoke this parable to the crowds: The kingdom of heaven is like a man who sowed good seed in his field; but while men were asleep, his enemy came and sowed weeds among the wheat, and went away. And when the blade sprang up and brought forth fruit, then the weeds appeared as well. And the servants of the householder came and said to him, ‘Sir, did you not sow good seed in your field? How then does it have weeds?’ He said to them, ‘An enemy has done this.’ And the servants said to him, ‘Will you have us go and gather them up?’ ‘No,’ he said, ‘lest in gathering the weeds you root up the wheat along with them. Let both grow together until the harvest; and at harvest time I will say to the reapers: Gather up the weeds first, and bind them in bundles to burn; but gather the wheat into my barns.’'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Questions on the Gospels (on Matthew 11)
      text: |-
        When the Shepherds of the Church wax careless, and since the Apostles sleep the sleep of death, cometh the devil, and soweth them whom the Lord calleth a seed of evil-doers. Now, are these seed of evil-doers the heretics, or Catholics of bad lives? It is possible to call even the heretics a seed of evil-doers because they have sprung up from the seed of the Gospel, and been begotten in the Name of Christ, though afterwards they have turned after crooked ways and lying doctrines.

        But whereas it is written that they were sown in the midst of the wheat, we ought haply to understand that they are of one communion with the righteous. Nevertheless, forasmuch as the Lord saith, The field is the world, (and not, the Church,) we may well understand that the seed of evil doers are the heretics, since in this world they are mingled together with the good, not in one common Communion, but only under one common name of Christian. But they which are of one faith with the good seed, and yet are themselves worthless, may more fitly be likened to straw than to tares, since the straw springeth from one soil and one root with the good ear.

        However, as touching the net cast into the sea, and enclosing a great multitude of fishes, both bad and good, we may well understand that by the bad are meant Catholics of bad lives. For the sea is one thing whereby we may understand to be signified the world; and the net another, which seemeth to signify our faith, or the Communion of one Church. Between heretics and sinful Catholics there is this difference, that heretics believe a lie, and sinful Catholics believe the truth, but live not as they believe.
      responsory: |-
        R. Unto thee, O Lord, do I lift up my soul. * O my God, I trust in thee, let me not be ashamed.
        V. O keep my soul and deliver me.
        R. O my God, I trust in thee, let me not be ashamed.
      status: verified

nocturn-readings/post-~-6:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Athanasius, Bishop of Alexandria, 2nd Oration against the Arians
      text: |-
        If the heretics had but known the person, the matter, and the times of the Apostle who spoke, they would never have spoken of Godhead as if It were human, nor borne themselves so wickedly, and withal so foolishly against Christ. It will be permitted to us to return, and to take again the first words of the Lesson. The Apostle then saith: God, Who at sundry times and in diverse manners, spake in time past unto the fathers by the Prophets, hath in these last days spoken unto us by His Son: and again, a little farther on: When the Son had purged our sins, He sat down on the right hand of the Majesty on high: being made so much better than the angels as He hath by inheritance obtained a more excellent name than they. The Apostle here expressly nameth the times wherein God hath spoken unto us by His Son, and wherein the Same His Son hath purged our sins; for when hath He spoken unto us by His Son, when did the Son purge our sins, or when was He born a Man, but since God spake unto the Fathers by the Prophets, namely, in these last days?

        The Apostle, about to enter on the subject of the Word's human dispensation and the last days, naturally mentioneth first that God had not up to those days been silent, but had spoken unto the fathers by the Prophets: and, after the Prophets had discharged their office, and the law had been given by the ministry of angels, that the Son also came down unto us to minister: and then he addeth, being made so much better than the angels, to show that as the Son differeth from a servant, so is the ministry of the Son better than the duty and office of servants.

        The Apostle, therefore, seeing the difference between the new ministry and the old, maketh very bold in writing and speaking to the Jews. For this cause, therefore, he doth not compare the details of the two ministries, and then come to the general conclusion that the new was greater or more honourable than the old, (lest any should understand that the two ministries were of the same kind, and that the conclusion that the new is better is arrived at by comparing the degrees in each of things which they had in common,) but he saith that the Son was made better, to distinguish at once and completely the nature of the Son from the nature of things created.
      responsory: |-
        R. O Lord, Thou hast shown me the path of life. * Thou shalt fill me with joy in thy presence, at thy right hand there are pleasures for evermore.
        V. Thou art He That shalt restore mine inheritance unto me.
        R. Thou shalt fill me with joy in thy presence, at thy right hand there are pleasures for evermore.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 13:31-35
      text: 'At that time, Jesus spoke this parable to the crowds: The kingdom of heaven is like a grain of mustard seed, which a man took and sowed in his field. This indeed is the smallest of all the seeds; but when it grows up it is larger than any herb and becomes a tree, so that the birds of the air come and dwell in its branches. He told them another parable: The kingdom of heaven is like leaven, which a woman took and buried in three measures of flour, until all of it was leavened. All these things Jesus spoke to the crowds in parables, and without parables he did not speak to them; that what was spoken by the prophet might be fulfilled, I will open My mouth in parables, I will utter things hidden since the foundation of the world.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book 2
      text: |-
        The kingdom of heaven is the proclamation of the Gospel, and that knowledge of the Scriptures, which leadeth unto life, and whereof it is said to the Jews: The kingdom of God shall be taken from you, and given to a nation bringing forth the fruits thereof. Therefore is this kingdom like to a grain of mustard-seed, which a man took and sowed in his field. By the man that sowed it in his field, many understand to be meant the Saviour, because He is the Sower That soweth in the souls of believers; others understand every man that soweth good seed in his own field, that is, in himself and in his own heart.

        Who is he that soweth, but our own mind and soul, which take the grain from preaching, and by nourishing it in the soil, cause it to sprout in the field of our own breast? The preaching of the Gospel is the least of all doctrines. He that preacheth, for his first lesson, God made man, Christ dead, and the stumbling-block of the Cross, receiveth at first but little credit. Compare such teaching as this with the doctrines of the Philosophers, with their books, their magnificent eloquence, and their rounded sentences, and thou shalt see how the grain of the Gospel, when it is sown, is the humblest of all seeds.

        But when the doctrines of men grow up, there is therein nothing piercing, nothing healthy, nothing life-giving. The plant is drooping, and delicate, and soft. There are herbs and grass whereof it may truly be said that the grass withereth and the flower fadeth. But the grain of Gospel seed, though, when it was sown, it seemed to be the least of all seeds, when once it is rooted in the soul of man, or in the whole world, groweth not into an herb, but becometh a tree, so that the birds of the air (whereby we may understand, either the souls of believers, or the angelic powers bound to the service of God,) come and lodge in the branches thereof. I consider that the branches of the Gospel tree, which groweth from the grain of mustard-seed, are the diverse developments of doctrine, on which the birds above mentioned find resting-places.
      responsory: |-
        R. Unto thee, O Lord, do I lift up my soul. * O my God, I trust in thee, let me not be ashamed.
        V. O keep my soul and deliver me.
        R. O my God, I trust in thee, let me not be ashamed.
      status: verified

octave-readings/~-octave-day-2:
  source: From the Sermons of St. Augustine, Bishop of Hippo; Homily by Pope St. Gregory the Great
  text: |
    Wise men came from the East to worship the Virgin's Son. This is the event which we this day commemorate, the occasion in honour of which this sermon is preached. On them that day first broke in gladness, which year by year, now cometh round to us for celebration. They were the first-fruits of that Gentile Church whereof we are the in-gathering. To us the voice of Apostles, to them a star, as a voice from heaven, proclaimed the advent of a Saviour; and to us the voice of the Apostolic preachers is also as a voice from heaven, a heaven declaring the glory of God.

    Great is the mystery. While He lay in the manger, He drew to Himself wise men from the East; while He was unknown in the stable, He was recognised in the heavens; and, being recognised in the heavens, made Himself known in the stable. So this day is called in the Greek Epiphaneia, which is, being interpreted, Manifestation. Wherein is manifested both the greatness and the lowliness of Him, Whose greatness was attested in the stars of heaven, and Who, being sought on earth, is found so lowly that there is no room for Him in the inn. And yet, though to be found in fashion as a little Child wrapped in swaddlingclothes, He is the object of worship to the wise men and of terror to the godless.

    Nor Herod feared when he heard from the wise men of Him Whom they sought, and of Whose birth they knew by the witness of a star. What will be the fearful judgment-seat of Him, Who, even as a Suckling, struck terror into haughty kings? How much wiser is the thought of those kings who seek Christ like the wise men, to worship Him, than of those who seek Him, like Herod, to slay Him! who seek to put Him to that same death, which He came to suffer from His.enemies for their own salvation, and which, by His death, He hath trodden down! Kings will do well to fear Him Who now sitteth at the right hand of the Father, and Whom Herod feared when He hung upon His mother's breast.

    When Herod knew of the birth of our King, he betook himself to his cunning wiles, and lest he should be deprived of an earthly kingdom he desired the wise men to search diligently for the young Child, and when they had found Him, to bring him word again. He said, that he also might come and worship Him, but, in reality, that, when he had found Him, he might put Him to death. But, behold, of how light weight is the malice of man, when it is tried against the counsel of God. It is written There is no wisdom, nor understanding, nor counsel, against the Lord, (Prov. xxi. 30.) So the star which the wise men saw in the East, still led them on; they found the new-born King, and presented unto Him gifts; then they were warned in a dream that they should not return to Herod. And as it came to pass that, when Herod sought Jesus, he could not find Him even so is it with hypocrites, who, while they make pretence to seek the Lord to worship Him, find Him not.

    It is as well to know that it is one of the opinions of the Priscillianist heretics l that every man is born under the influence of a star; and, to confirm this notion, they bring forward the instance of the star of Bethlehem, which appeared when the Lord was born; and which they call His star, that is, the star ruling over His fate or destiny. But if we consider the words of the Gospel concerning this star, they are It went before, till it came and stood over where the young Child was. Whence we see that it was not the young Child Who followed the star, but the star which followed the young Child, as if to show that the young Child ruled the star, instead of the star ruling Him.

    But I pray that the hearts of the faithful may ever be free from the thought that anything ruleth their destiny. In this world there is but One Who ruleth the destiny of man, even He Who made man; neither was man made for the stars, but the stars for man; and if we say that they rule his destiny, we set them above him for whose service they were made. When Jacob came out of his mother's womb, and his hand took hold on his elder brother Esau's heel, he could not have done so unless this his first movement had been behind his brother, and, nevertheless, such was not in after life the position of those two brethren whom their mother brought forth at one birth.
  responsory: |
    R. There are three precious gifts which the wise men offered unto the Lord on this day, and they speak a mystery of the things of God: * Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying. V. The wise men worshipped the Captain of our Salvation, as He lay in the manger, and when they had opened their treasures, they presented unto Him mystic gifts. R. Gold, to show His kingly power; frankincense, for our Great High Priest; and myrrh, against the Lord's burying.
