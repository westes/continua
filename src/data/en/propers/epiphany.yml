nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: From the Sermons of Pope St. Leo (the Great), 2nd for Twelfth-Day.
      text: |
        Dearly beloved brethren, rejoice in the Lord; again I say, rejoice. But a few days are past since the solemnity of Christ's Birth, and now the glorious light of His Manifestation is breaking upon us. On that day the Virgin brought Him forth, and on this the world knew Him. The Word made Flesh was pleased to reveal Himself by degrees to those for whom He had come. When Jesus was born He was manifested indeed to the believing, but hidden from His enemies.

        Already indeed the heavens declared the glory of God, and their sound went out into all lands, when the Herald Angels appeared to tell to the shepherds the glad tidings of a Saviour's Birth; and now the guiding star leadeth the wise men to worship Him, that from the rising of the sun to the going down thereof, the Birth of the true King may be known abroad; that through those wise men the kingdoms of the east might learn the great truth, and the Roman empire remain no more in darkness.

        The very cruelty of Herod, when he strove to crush at His birth this King Whom he alone feared, was made a blind means to carry out this dispensation of mercy. While the tyrant with horrid guilt sought to slay the little Child he did not know, amid an indiscriminate slaughter of innocents, his infamous act served to spread wider abroad the heaven-told news of the Birth of the Lord. Thus were these glad tidings loudly proclaimed, both by the novelty of their story, and the iniquity of their enemies. Then was the Saviour borne into Egypt, that nation, of a long time hardened in idolatry, might by the mysterious virtue which went out of Him, even when His presence was unknown, be prepared for the saving light so soon to dawn on them, and might receive the Truth as a wanderer even before they had banished falsehood.

        Dearly beloved brethren, we recognize in the wise men who came to worship Christ, the first-fruits of that dispensation to the Gentiles wherein we also are called and enlightened. Let us then keep this Feast with grateful hearts, in thanksgiving for our blessed hope, whereof it doth commemorate the dawn. From that worship paid to the new-born Christ is to be dated the entry of us Gentiles upon our heirship of God and co-heirship with Christ. Since that joyful day the Scriptures which testify of Christ have lain open for us as well as for the Jews. Yea, their blindness rejected that Truth, Which, since that day, hath shed Its bright beams upon all nations. Let all observance, then, be paid to this most sacred day, whereon the Author of our salvation was made manifest, and as the wise men fell down and worshipped Him in the manger, so let us fall down and worship Him enthroned Almighty in heaven. As they also opened their treasures and presented unto Him mystic and symbolic gifts, so let us strive to open our hearts to Him, and offer Him from thence some worthy offering.
      responsory: |-
        R. Herod inquired of the wise men: What sign have you concerning him that is born king? We have seen a star shining, the brightness whereof enlightens the world. * And we have known, and are come to worship the Lord.
        V. There came wise men from the east, seeking the face of the Lord and saying.
        R. And we have known, and are come to worship the Lord.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 2:1-12
      text: 'When Jesus therefore was born in Bethlehem of Juda, in the days of king Herod, behold, there came wise men from the east to Jerusalem, saying: Where is he that is born king of the Jews? And so on.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Homily by Pope St. Gregory the Great., 10th on the Gospels
      text: |
        Dearly beloved brethren, hear ye from the Gospel lesson how, when the King of heaven was born, the king of earth was troubled? The heights of heaven are opened and the depths of earth are stirred. Let us now consider the question, why, when the Redeemer was born, an angel brought the news to the shepherds of Judea, but a star led the wise men of the East to worship Him.

        It seemeth as if the Jews as reasonable creatures received a revelation from a reasonable being, that is, an angel, but the Gentiles without, being as brutes, are roused not by a voice, but by a sign, that is, a star. Hence Paul hath it: a sign, not to them that believe, but to them that believe not but prophesying serveth not for them that believe not, but for them which believe. 1 Cor. xiv. 22. So the prophesying, that is, of the angel was given to them that believed, and the sign to them that believed not. Thus also we remark that afterwards the Redeemer was preached among the Gentiles not by Himself, but by His Apostles, even as, when a little Child, He is shown to them, not by the voice of angels, but merely by the vision of a star. When He Himself had begun to speak He was made known to us by speakers, but when He lay silent in the manger, by that silent testimony in heaven. But whether we consider the signs which accompanied His birth or His death, this thing is wonderful, namely, the hardness of heart of the Jews, who would not believe in Him either for prophesying or for miracles. All things which He had made, bore witness that their Maker was come. Let me reckon them after the manner of men. The heavens knew that He was God, and sent a star to shine over where He lay. The sea knew it, and bore Him up when He walked upon it. The earth knew it, and quaked when He died. The sun knew it, and was darkened. The rocks and walls knew it, and rent at the hour of His death. Hell knew it, and gave up the dead that were in it. And yet up to this very hour the hearts of the unbelieving Jews will not acknowledge that He to Whom all nature testified is their God, and, being more hardened than the rocks, refuse to be rent by repentance.
      responsory: |-
        R. This is the great day in which the Savior of the world appeared, whom the Prophets foretold, the Angels announced. * At whose star the Magi rejoiced, and offered Him gifts.
        V. The day of sanctification has shined upon us: peoples, come and adore the Lord.
        R. At whose star the Magi rejoiced, and offered Him gifts.
      status: verified

nocturn-readings/post-~-1:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Sermon 4 on the Epiphany
      text: |-
        It is meet and right, dearly beloved brethren, yea, it is our bounden duty and godly service, to rejoice with full hearts upon those days which more especially set forth before us the workings of God's mercy; and to have in honourable memory those things that were done for our salvation. Hereto are we called by the seasons of the year which continually return, and notably by this present, which, after but a short time hath passed since that day whereon the Coeternal Son of God was born of a Virgin, bringeth now the Feast of the Epiphany, hallowed by the Manifestation of the Lord.

        In this said Manifestation the good Providence of God hath appointed a strong bulwark to our faith. For now, while in solemn worship we call to mind how the childhood of the Saviour was adored in its first infancy, we receive from the original Scriptures the doctrine that Christ was born with the very nature of man. For this is that which maketh of sinners saints, even to believe that in one and the same our Lord Jesus Christ there is very Godhead and very Manhood - very Godhead, as touching Which, He, being in the form of God, is equal to the Father from everlasting to everlasting - and very Manhood, wherein He, taking upon Him the form of a servant, hath in these latter days been born Man.

        For the strengthening of this our faith, which we profess in the face of every false doctrine, the mercy of God hath made it to come to pass that one of those peoples who dwell in the uttermost parts of the East, and excel in the skill of reading the stars, should see the sign of the birth of that Child Who was to reign over all Israel. There appeared to the eyes of wise men a new star of such passing beauty, as wrought in the minds of all that saw it the persuasion that the event, which is announced, was of an importance not to be neglected.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 2:42-52
      text: When Jesus was twelve years old, they went up to Jerusalem according to the custom of the feast. And after they had fulfilled the days, when there were returning, the Boy Jesus remained in Jerusalem, and His parents did not know it. But thinking that He was in the caravan, they had come a day’s journey before it occurred to them to look for Him among their relatives and acquaintances. And not finding Him, they returned to Jerusalem in search of Him. And it came to pass after three days, that they found Him in the temple, sitting in the midst of the teachers, listening to them and asking them questions. And all who were listening to Him were amazed at His understanding and His answers. And when they saw Him, they were astonished. And His Mother said to Him, Son, why have You done so to us? Behold, in sorrow Your father and I have been seeking You. And He said to them, How is it that you sought Me? Did you not know that I must be about My Father’s business? And they did not understand the word that He spoke to them. And He went down with them and came to Nazareth, and was subject to them; and His Mother kept all these things carefully in her heart. And Jesus advanced in wisdom and age and grace before God and men.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Book 2
      text: |-
        We read that when He was twelve years old the Lord began to dispute. The number of His years was the same as the number of the Apostles whom He afterwards sent forth to preach the Faith. He Who, as touching His Manhood, was filled with wisdom and grace from God, was not careless of the parents of the same Manhood, and, after three days, was pleased to be found in the Temple: thereby foreshadowing that, after the three days of His victorious Passion, He That had been reckoned with the dead, would present Himself, living, to our faith, in His heavenly Kingship and Divine Majesty.

        How is it that ye sought Me? Christ hath two Generations; one from His Father, another from His Mother. That from His Father is His Eternal Generation as God the Son; that from His Mother is that whereby He came to work for us and minister to us. Those acts, therefore, of His, which are above nature, beyond His age, and different to His custom, proceeded not from the strength of His Manhood, but from the power of His Godhead. On another occasion His Mother moveth Him to work a miracle; here He answereth her, because she treateth that which was of the Godhead, as though it had been of the Manhood. On this occasion it is said that He was twelve years old, but on the other He had already disciples. His mother had seen His wonders on the earlier occasion, and had learnt from her Son to call on the mightier nature for a work of power.

        He came to Nazareth, and was subject unto them. No wonder that the great Teacher should practise. And shall we marvel how He Who was subject to His Mother, was about His Father's business? His subjection to His Mother proceeded, not from weakness, but from dutiful affection. Nevertheless, the false serpent lifteth its head from its cruel lair, and spitteth poison from its venomous breast. The heretics say that, as the Son was sent by the Father, therefore the Father is greater than the Son, and, if the Father be greater than the Son, there is that, than which the Son is less; yea, that He Who is sent, hath of necessity, need of some strengthening from outside Himself. He was subject to His Mother? Was He less than she? God forbid!
      status: verified

nocturn-readings/post-~-2:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. John Chrysostom, Preface to the Epistles of St. Paul
      text: |-
        As I listen intently to the reading of St. Paul's Epistles, often two or three times a week, whenever we commemorate the holy martyrs, I am filled with joy, delighting in the sound of that spiritual trumpet. And as I recognize the voice of a friend, I am roused, and enkindled with love so that I almost seem to see him present, and to hear him speaking. But nevertheless I am grieved, and am troubled, that all do not know this great man as he deserves to be known. Indeed, many are so ignorant that they do not even know how many epistles he wrote. But this ignorance is not due to a want of intelligence on their part, but because they will not carefully study the writings of this great man.

        For what we know, if we know anything, we do not know it owing to any superlative talent or penetration, but, being strongly drawn towards this great man, we never cease from reading his works. For so it is that those who love any one usually know better than others what he has done, because they take the trouble to learn all about him. The blessed Paul himself shows that this is so, when he says to the Philippians: As it is meet for me to think this for you all: for that I have you in my heart; and in my bands, and in the defence and confirmation of the gospel.

        And if you also will diligently attend to the reading, you will have no need of other instruction. Most true are those words of Christ: Seek and you shall find: knock and it shall be opened unto you. For the rest, since many of those who are assembled here are charged with the care of a wife, and with providing for a family, and with the bringing-up of children, and therefore cannot devote themselves wholly to this study; let them at least bestir themselves to receive what others have gathered; showing as much eagerness in listening to what is said about him as in acquiring wealth. For though it is unseemly to demand from you no more than this, yet it is to be wished that you do this at least.
      responsory: |-
        R. O Lord, Thou hast shown me the path of life. * Thou shalt fill me with joy in thy presence, at thy right hand there are pleasures for evermore.
        V. Thou art He That shalt restore mine inheritance unto me.
