    - nocturn: 2
      isGospel: false
      text: |-
        Patrick, called the Apostle of Ireland, was born in Great Britain. The name of his father was Calphurnius, and that of his mother Conchessa. She is said to have been a relation of St. Martin, Bishop of Tours. When Patrick was a lad, he was several times taken prisoner by savages, and while being in their hands he was employed as a shepherd, he already showed marks of his saintliness to come. His spirit was filled with faith, and love, and fear of God, so that he would rise before the light, in snow, and frost, and rain, to make his prayers to God, being accustomed to address God in prayer an hundred times every day, and an hundred times every night. After being rescued from his third captivity, he was placed among the clergy, and for a long time exercised himself in sacred learning. To this end he travelled with much labour, through Gaul, Italy, and the islands of the Tyrrhenian Sea, but at last being called of God to work for the salvation of the Irish, and, having received from the Blessed Pope Celestine a commission to preach the gospel, and likewise being consecrated a Bishop, he betook himself to Ireland.

        In the discharge of his calling it is a marvel with how many evils, with how many sufferings and labours, and with how many adversaries the Apostolic Patrick had to bear. Nevertheless, by the goodness of God, that island, which had up to that time been given over to the serving of idols, was, through the preaching of Patrick, so wrought on that she soon brought forth the fruit which won her the name of the Island of Saints. Patrick caused many of her people to be born again by the washing of regeneration; he ordained many Bishops and clerks; he decreed rules for virgins and widows living in continency. By the authority of the Bishop of Rome he established the See of Armagh as the Primatial See of all Ireland, and enriched the Church with relics of the Saints brought from Rome. Patrick, moreover, was so eminently adorned with heavenly visions, with the gift of prophecy, and with great signs and wonders from God, that the fame of him spread itself abroad more and more, day by day.

        Besides that which came upon him daily, the care of all the Churches of Ireland, he never suffered his spirit to weary in constant prayer. They say that it was his custom to repeat every day the whole Book of Psalms, together with Songs and Hymns, and two hundred Prayers; that he bent his knees to God in worship three hundred times every day, and that he made on himself the sign of the Cross an hundred times at each of the Seven Hours of the Church Service. He divided the night into three portions; during the first he repeated the first hundred Psalms, and bent his knees two hundred times; during the second he remained plunged in cold water, with heart, eyes, and hands lifted up to heaven, and in that state repeated the remaining fifty Psalms; during the third he took his short rest, lying upon a bare stone. He was a great practicer of lowliness, and, after the pattern of the Apostle, he always continued to work with his own hands. At last he fell asleep in the Lord in extreme old age, refreshed with the Divine Mysteries, worn out with unceasing care for the Churches, and glorious both in word and work. His body is buried in Down in Ulster. He passed away in the fifth century after the giving of salvation by Christ.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 9 on the Gospels (Common of a Confessor Bishop)
      text: |-
        Dearly beloved brethren, this Lesson from the Holy Gospel moveth us to take good heed lest we, who are seen in this world to have received more than others, should thereby bring ourselves into greater condemnation from the Maker of this world. To whom much is given, of the same is much required. Therefore, let him that receiveth much, strive to be all the more lowly, and all the more ready to do God service, for his very gifts' sake, knowing that he will be obliged to give account thereof. Behold, a man, travelling into a far country, calleth his own servants, and delivereth unto them talents, to the end that they may trade therewith. After a long time, the lord of those servants cometh, and reckoneth with them, and to them that have done well He rendereth a reward of their labours, but that servant which was careless of his master's work He condemneth.

        What other, then, is that man travelling into a far country but our Redeemer, Who is gone up from us into heaven in that Flesh Which He had taken into Himself? For the earth is the home of the Flesh, Which travelleth into a far country when our Redeemer giveth It a place in heaven. But that man travelling into a far country delivered unto his servants his goods and so doth our Redeemer give spiritual gifts unto His faithful people. "And unto one he gave five talents, to another two, and to another one." There are five bodily senses that is, sight, hearing, taste, smell, and touch. By the five talents therefore are signified the five senses, that is, outward knowledge. By the two, wit and work. And by the figure of the one talent, understanding, which is alone.

        And so he that had received five talents, gained other five talents for some there be who, while yet they are not able to go on unto things inward and mystic, do yet so desire our Fatherland which is above, that they teach well all whom they can, and of those very outward things which they have received make gain double. These are they which keep themselves clean from the unruly motions of the flesh, and from the lust of the world, and from the delight of things which are seen, and, by their preaching, keep other men also clean from all these things. And some there are who receive, as their two talents, the power to think and the power to work. These are they which inwardly understand dark things, and outwardly work wonders. And these, since they preach unto others, both through their understanding and their works, gain, as it were, double, for the talents which they have received.
      status: verified
