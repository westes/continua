collect:
  text: |
    Let us pray.
    Grant we beseech thee, O Almighty God, that thy faithful people, who
    rejoice in the Name and keeping of the most holy Virgin Mary, may by
    her Motherly prayers be freed from all ills upon earth, and worthily
    attain unto thine everlasting joy in heaven.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. O Holy Mary, * be thou an help to the helpless, a strength to the fearful, a comfort to the sorrowful; pray for the people, plead for the clergy, make intercession for all women vowed to God; may all that are keeping this Commemoration of thine holy Name feel the might of thine assistance.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    Grant we beseech thee, O Almighty God, that thy faithful people, who
    rejoice in the Name and keeping of the most holy Virgin Mary, may by
    her Motherly prayers be freed from all ills upon earth, and worthily
    attain unto thine everlasting joy in heaven.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

