lauds-capitulum:
  text: 'I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour. I will give glory to thy name: for thou hast been a helper and protector to me, and hast preserved my body from destruction.'
  citation: Sir 51:1-3
  status: verified

lauds-hymn:
  text: |-
    Jesu, the virgins' crown, do thou
    Accept us as in prayer we bow;
    Born of that Virgin, whom alone
    The mother and the maid we own.

    Amongst the lilies thou dost feed,
    By virgin choirs accompanied;
    With glory decked, the spotless brides
    Whose bridal gifts thy love provides.

    They, wheresoe'er thy footsteps bend,
    With hymns and praises still attend:
    In blessèd troops they follow thee,
    With dance, and song, and melody.

    We pray thee therefore to bestow
    Upon our senses here below
    Thy grace, that so we may endure
    From taint of all corruption pure.

    All laud to God the Father be,
    All praise, eternal Son, to thee;
    All glory as is ever meet,
    To God, the holy Paraclete. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. In thy comeliness * and in thy beauty.
    R. In thy comeliness * and in thy beauty.
    V. Go forward, fare prosperously, and reign.
    R. In thy beauty.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. In thy comeliness * and in thy beauty.
  status: verified

lauds-versicle:
  text: |
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
  status: verified

prime-antiphon:
  text: Who art thou * who comest to heal my wounds? I am an Apostle of Christ, have no fear of me, my daughter.
  status: verified

terce-antiphon:
  text: I have used no earthly medicine * for my body, but I have for a Master Christ Jesus, by Whose Word alone all things were made.
  status: verified

sext-antiphon:
  text: O my Lord Jesus Christ, I thank thee, * because Thou hast been mindful of me, and hast sent unto me thine Apostle, to heal my wounds.
  status: verified

none-antiphon:
  text: Upon Him Who hath vouchsafed * to heal me of all my wounds, and to put new paps on my breasts, upon Him will I call, even upon the Living God.
  status: verified

