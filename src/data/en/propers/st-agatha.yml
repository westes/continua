benedictus-antiphon:
  text: The heathen multitude made haste * and came to the grave of the virgin, and took therefrom her veil wherewith to stem the fire; that the Lord might show Himself to be a Deliverer from the burning, for the sake of Agatha, His blessed Martyr.
  status: verified

magnificat-antiphon:
  text: 'The blessed Agatha * stood in the midst of the prison, and stretched forth her hands, and prayed unto the Lord, saying: O Lord Jesus Christ, my Good Master, I thank thee because Thou hast made me to overcome the cruelty of the executioners and now, O Lord, may it please thee that I should happily attain unto thy glory, which fadeth not away.'
  status: verified

