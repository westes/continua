nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Petronilla, daughter of St. Peter, was a virgin of exceptional bodily beauty, but far more excellent in the beauty of her soul. When she was ill, it was asked of blessed Peter why he, who healed others, did not restore health to his own daughter. He answered: because it is expedient for her thus. Nevertheless, so that none might have occasion to doubt his power, he bade her rise from her bed and wait upon the guests at table. Not long after she fell back into the same sickness; and when she had at length recovered from it, Count Flaccus, stirred by the fame of her beauty though he had not even seen her, fell in love with her, and earnestly strove that she might be given him in marriage.

        But Petronilla, understanding that snares were being laid by the bitterest enemy of mankind against the virginity which she had dedicated to Jesus Christ, took for herself a space of three days for deliberation, and spent that whole time in fasting and prayer, constantly beseeching her heavenly Bridegroom not to allow violence to be done to her holy resolve. And so on the third day God came to the virgin's aid: for, burning with love of her divine Spouse, as soon as she had received the Eucharist, he called her to the heavenly nuptials. Her body was buried on the Ardeatine Way, and afterward was translated by Pope Paul I into the basilica of the Prince of the Apostles.
      status: draft
