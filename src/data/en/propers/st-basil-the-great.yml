nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        This Basil was a noble Cappadocian who studied earthly learning at Athens, in company with Gregory of Nazianzus, to whom he was united in a warm and tender friendship. He afterwards studied things sacred in a monastery, where he quickly attained an eminent degree of excellence in doctrine and life, whereby he gained to himself the surname of the Great. He was called to Pontus to preach the Gospel of Christ Jesus, and brought back into the way of salvation that country which before had been wandering astray from the rules of Christian discipline. He was shortly united as coadjutor to Eusebius, Bishop of Caesarea, for the edification of that city, and afterwards became his successor in the see. One of his greatest labours was to maintain that the Son is of one Substance with the Father, and when the Emperor Valens, moved to wrath against him, was willing to send him into exile, he so bent him by dint of the miracles which he worked that he forced him to forego his intention.

        The chair upon which Valens sat down, in order to sign the decree of Basil's ejectment from the city, broke down under him, and three pens which he took one after the other to sign the edict of banishment, all would not write; and when nevertheless he remained firm to write the ungodly order, his right hand shook. Valens was so frightened at these omens, that he tore the paper in two. During the night which was allowed to Basil to make up his mind, Valens' wife had a severe stomach-ache, and their only son was taken seriously ill. These things alarmed Valens so much that he acknowledged his wickedness, and sent for Basil, during whose visit the child began to get better. However, when Valens sent for some heretics to see it, it presently died.

        The abstinence and self-control of Basil were truly wonderful. He was content to wear nothing but one single garment. In observance of fasting he was most earnest, and so instant in prayer, that he would oftentimes pass the whole night therein. His virginity he kept always unsullied. He built monasteries, wherein he so adapted the institution of monasticism, that he exquisitely united for the inmates the advantages of the contemplative and of the active life. He was the author of many learned writings, and, according to the witness of Gregory of Nazianzus, no one hath ever composed more faithful and edifying explanations of the books of the Holy Scripture. He died upon the 1st day of January, at which time so essentially spiritual was his life, that his body showed nothing but skin and bones.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 14:26-35
      text: At that time Jesus said to the multitudes, "If anyone comes to Me and does not hate his father and mother, and wife and children, and brothers and sisters, yes, and even his own life, he cannot be My disciple. And he who does not carry his cross and follow Me, cannot be My disciple. For which of you, wishing to build a tower, does not sit down first and calculate the outlays that are necessary, whether he has the means to complete it? Lest, after he has laid the foundation and is not able to finish, all who behold begin to mock him, saying, 'This man began to build and was not able to finish!' Or what king setting out to engage in battle with another king, does not sit down first and consider whether he is able with ten thousand men to meet him who with twenty thousand is coming against him? Or else, while the other is yet at a distance, he sends a delegation and asks the terms of peace. So, therefore, every one of you who does not renounce all that he possesses, cannot be My disciple. Salt is good; but if even the salt loses its strength, what shall it be seasoned with? It is fit neither for the land nor for the manure heap, but must be thrown out. He who has ears to hear, let him hear."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Basil, Archbishop of Caesarea, Paraphrase of his Rule, Q. 8 (on Luke 14:26-35)
      text: |-
        This is perfect self-renunciation, when we attain to indifference as regards our own lives, and wring from death himself the confession that our trust is not in our own strength. The first step toward this crown of abnegation is to estrange ourselves from outward things, such as property, public reputation, habits of life, and affection for things unnecessary, whereof the immediate disciples of our Holy Lord have left us a fine example: James, for instance, and John, who left their father Zebedee and the boats which were their only means of getting their daily bread; or Matthew, who got up from the receipt of custom, and straightway followed the Lord.

        But what need have we for our own arguments, or for the examples of holy men to confirm what we say, when we are able to cite the very words of the Lord Himself, and by them to move any earnest soul that loveth God? Such were they unto whom He plainly and unhesitatingly declared: Whosoever he be of you that forsaketh not all that he hath, he cannot be My disciple. And again, in another place, when He had said: If thou wilt be perfect, go, and sell that thou hast, and give to the poor; the completion of the sentence was: And come and follow Me.

        This then, as we have taught, is self-renunciation: to unlock the chains of this earthly life, which passeth away, and to set oneself free from the business of men, and so to make ourselves lither and meeter to enter on that path which leadeth to God, and let our reason be more unhampered to gain and to use those things which are far more precious than gold or precious stones. In short, it is to have our heart in heaven and not on earth, so as to be able to say: Our conversation is in heaven. And, which is the great thing, this is the first step towards the attaining to be like Christ, who, though He was rich, yet for our sakes He became poor.
      status: verified
