  status: verified

vespers-hymn:
  text: |
    Gertrude, ark of the Godhead, *
    joined to the Bridegroom of virgins, grant us to sing the chaste loves of thy nuptial covenant.

    Marriageable to Christ at four years old, *
    thou didst swiftly fly to the cloister; and, spurning thy nurse's bosom, didst seek the kisses of the Bridegroom.

    Like a gleaming white lily *
    thou dost sweeten the stars with thy fragrance, and by thy virginal beauty dost draw down the King of the heavens.

    He who liveth in the bosom of the Father, *
    girt with everlasting glory, lovingly, as a bridegroom, reclineth between thy breasts.

    Thou woundest Christ with love; *
    He in turn wounds thee, and deeply brands His own stigmata upon thy heart.

    O singular charity, and wondrous exchange! *
    He breathes within thy heart: thou livest by His spirit.

    May the blessed hosts praise thee, O Bridegroom of virgins, Jesus: *
    to the Father, together with the Paraclete, be equal glory for ever. Amen.
  status: draft

