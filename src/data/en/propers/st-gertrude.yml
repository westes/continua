matins-hymn:
  text: |
    Let us celebrate at the night hours,
    with tuneful tongue, the wonderful deeds of Gertrude,
    who, persevering in holy prayers,
    spent the hours of the night.

    God, complying with her prayers,
    soon poured out sudden rains,
    and soon held back the showers
    hanging in heavy clouds.

    The fields had long been stiff with frost,
    when the Virgin, with sad heart pitying the farmers,
    melted the cold of winter
    with fervent tears.

    Lest the crop be spoiled by too much rain,
    she cleared the sky by constant prayers,
    and, groaning, appeased
    the grave wrath of the Godhead.

    She pierces minds with fiery arrows,
    brings healing to languid souls,
    and sets sinful hearts aflame
    with chaste fires.

    Let the holy choirs of virgins celebrate
    the Spouse of virgins and King of the heavenly ones,
    and let the world in supplication adore
    the holy Trinity for ever.
    Amen.
  status: draft

