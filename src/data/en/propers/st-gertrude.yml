lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: 'Rejoice * and be glad, O daughter of Sion: for, lo, I come, and I will dwell in the midst of thee, saith the Lord.'
    - psalms:
        - 99
      antiphon: O blessed soul, * who didst merit to be the seat of Wisdom, whose delight it is to be with the sons of men!
    - psalms:
        - 62
      antiphon: My Lord Jesus Christ hath betrothed me * with seven rings, and adorned me with a crown as His bride.
  canticle:
    id: canticum-trium-puerorum
    antiphon: 'Gertrude had the power to shut heaven with clouds, * and to open its gates: for her tongue became the key of heaven.'
  laudate:
    antiphon: The faithful handmaid * and chosen bride entered into the heart and joy of her Lord, for whose love she languished.

vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: The chaste dove, * nesting in the cleft of the wall of the sacred side of Jesus Christ, sucked the sweetest honey from the rock.
    - psalms:
        - 112
      antiphon: Christ spoke * to His beloved Gertrude face to face, as a man is wont to speak to his friend.
    - psalms:
        - 121
      antiphon: 'The words of blessed Gertrude * were darts of divine love: her lamps were lamps of fire and flame.'
    - psalms:
        - 126
      antiphon: Christ received into His arms * the soul of His beloved, as it went forth from the prison of the body, and lovingly opened His Heart to her.

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gertrude was born of a noble family at Eisleben, in Saxony, (about the year of our Lord 1264.) At five years of age she offered her virginity and herself to Jesus Christ, in the Benedictine nunnery at Rodalsdorf. From that time forth she was utterly estranged from earthly things, ever striving for things higher, and began to lead a kind of heavenly life. To learning in human letters she added knowledge of the things of God. In the thought thereof she earnestly desired, and soon reached, the perfection of a Christian soul. Of Christ, and of the things in His life, she spoke oftentimes with movings of spirit. The glory of God was the one end of all her thoughts, and to that her every longing and her every act were given. Though God had crowned her with so many and so noble gifts both of nature and of grace, her belief regarding herself was so humble that she was used to number as among the greatest of the wonders of His goodness that He had always in His mercy borne with one who was so utterly unworthy.

        In the thirtieth year of her age she was elected Abbess of Rodalsdorf, where she had professed herself in the religious life, and afterwards of Heldelfs. This office she bore for forty years in love, wisdom, and zeal for strict observance, so that the house seemed like an ideal example of a sisterhood of perfect nuns. To each one she was a mother and a teacher, and yet would be as the least of all, being in sooth in all lowliness among them as she that served. That she might be more utterly God's only, she tormented her body with sleeplessness, hunger, and other afflictions, but withal ever true to herself, stood forth a pattern of innocency, gentleness, and long-suffering. The salvation of her neighbours was her constant earnest endeavour, and her godly toil bore abundant fruit. The love of God oftentimes threw her into trances, and she was given the grace of the deepest contemplation, even to union of spirit with God.

        Christ Himself, to show what such a bride was to Him, revealed that He had in the heart of Gertrude a pleasant dwelling-place. The Virgin Mother of God she ever sought with deep reverence as a mother and warden whom she had received from Jesus Himself, and from her she had many benefits. Toward the most Divine Sacrament of the Eucharist, and the sufferings of the Lord, her soul was moved with love and gratitude, so that she sometimes wept abundantly. She helped with daily gifts and prayers the souls of the just condemned to the purifying fire. She wrote much for the fostering of godliness. She was glorified also by revelations from God, and by the gift of prophecy. Her last illness was rather the wasting of a home-sickness to be with God than a decay of the flesh, and she left this life (to live the undying life in Him, upon the 17th day of November,) in the year of our Lord 1292. God made her bright with miracles both during her life and after her death.
      status: verified
