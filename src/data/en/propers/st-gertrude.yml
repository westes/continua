lauds-hymn:
  text: |
    The virgin, panting for the sacred bridal chamber, *
    longs to celebrate her nuptials in heaven, and with pious prayers urges on the hour that seems to tarry too long.

    When she lay sick and languishing, Christ stood manifestly by her, *
    with a company of the heavenly host, and revived her, as she lay, with the light of His divine countenance.

    Arise, He cried, my sister and my spouse; *
    behold, I open to thee the inmost chamber of my Heart, that, its door unbarred, thou mayest ascend the stars in a triumphal chariot.

    That voice pierced through her very marrow, *
    and loosed the framework of her soul: her spirit flew free into the hidden depths of Christ.

    As she sought the royal bridal chamber of the Lamb, *
    a rejoicing crown of the blessed thronged about her, and sang of the embraces and loving kisses of the Bridegroom.

    Let the holy choirs of virgins celebrate *
    the Bridegroom of virgins and King of the blessed, and let the world in suppliant prayer adore the sacred Trinity for ever. Amen.
  status: draft

