collect:
  text: |
    Let us pray.
    O God, Who didst make unto thyself a pleasant dwelling-place in the
    heart of thy blessed hand-maiden Gertrude, be Thou entreated for the
    same thy servant's sake, and by her prayers, to purge away in thy
    mercy all defilement from our hearts, and to grant us one day to
    rejoice with her in thy presence.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with
    thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
