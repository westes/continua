nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, On Grace and Free Will, ch. 6-7
      text: |-
        The Apostle Paul was a man, who, when we first hear of him, had not only no merits, but a great many demerits. That man received the grace of God, Who returneth good for evil, and let us see in what sort of language, when the hour of his last sufferings was at hand, he wrote to Timothy. He saith: I am now ready to be offered, and the time of my departure is at hand. I have fought a good fight, I have finished my course, I have kept the faith. Here he counteth his merits, whereon a crown was immediately to follow, just as grace had followed immediately on his demerits. Listen to what cometh next: Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteous Judge, shall give me at that day. Unto whom would the Lord give a crown as a righteous Judge, if He had not first given grace, as a merciful Father? And how would that crown be a crown of righteousness, if there had not first come grace which justifieth the ungodly? How could a reward have been earned unless the power to earn had first been given unearned?

        Let us now consider what were the merits of the Apostle Paul, which entitled him to look for a crown of righteousness from the Lord, the righteous Judge, and let us see whether these merits sprang from himself or were God's gifts to him. He saith: I have fought a good fight, I have finished my course, I have kept the faith. To begin with, these good works would have been nothing worth, unless they had come from good thoughts. Listen therefore to what this same Paul saith concerning good thoughts. He writeth to the Corinthians: Not that we are sufficient of ourselves to think anything, as of ourselves; but our sufficiency is of God. Now let us take point by point.

        He saith: I have fought a good fight. I should like to know in whose strength he fought; in his own strength or in strength given him from above? God forbid that this great teacher should be supposed not to have known the Law of his God, Who saith in the Book of Deuteronomy: Say not in thine heart: My power and the might of mine hand hath gotten me this wealth. But thou shalt remember the Lord thy God, for it is He That giveth thee power to get wealth. And, again, what is the good of a fight except it end in victory? And who is he that giveth victory save He of Whom this very same Paul saith: Thanks be to God, Which giveth us the victory, through our Lord Jesus Christ!
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 10:16-22
      text: At that time, Jesus said to His disciples, "Behold, I am sending you forth like sheep in the midst of wolves. Be therefore wise as serpents, and guileless as doves. But beware of men; for they will deliver you up to councils, and scourge you in their synagogues, and you will be brought before governors and kings for My sake, for a witness to them and to the Gentiles. But when they deliver you up, do not be anxious how or what you are to speak; for what you are to speak will be given you in that hour. For it is not you who are speaking, but the Spirit of your Father Who speaks through you. And brother will hand over brother to death, and the father his child; children will rise up against parents and put them to death. And you will be hated by all for My name's sake; but he who has persevered to the end will be saved."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Homily 34 on Matthew (on Matt 10:16-22)
      text: |-
        It is as though He said: Let not your heart be troubled, although when I send you forth as sheep in the midst of wolves, I bid you be harmless as doves; for, albeit, if I would, I could now make things otherwise, and suffer not that ye should have to bear anything grievous, neither be at the mercy of the wolves as are other sheep, but on the contrary, could make you more dreadful to the lions than the lions to you; nevertheless, thus must it needs be, and yourselves it will make more glorious, and My power it will wholly show forth. For thus was it that afterwards the Same Lord said unto Paul: My grace is sufficient for thee, for My strength is made perfect in weakness. It is I that have made you to be what ye are.

        But let us look what wisdom it is which the Lord requireth. It is the wisdom of the serpent. The serpent draweth all the rest of his body after his head, and it is no matter to him if his body be cut through, so long as he keepeth his head unharmed. Thus, O Christian, is it with thee. It is no matter to thee that for thy faith's sake thou shouldest lose all things else, money, or body, or, if need be, life itself; thy faith is thy head, and the root of thy being; hold fast to that, and, as long as thou hast that, although thou shouldest lose all things else, it will only be to receive them back again with interest an hundredfold. And thus it is that the Lord biddeth us, not to be single-hearted only, nor wise only, but both together, that therefrom we may be strong.

        If thou wilt see how these words were brought to the proof in very deed, read the Book of the Acts of the Apostles. There thou wilt see how that oftentimes the Jewish people rose against the Apostles and gnashed on them with their teeth, but they, with dove-like guilelessness, gave them smooth answers, and turned away their wrath, and quenched their fury, and stopped their onset. When the Jews said: Did not we straitly command you, that ye should not teach in this Name? although the Apostles could have worked any miracles they chose, yet they neither said nor did anything sharp, but answered them with all meekness: Whether it be right in the sight of God to hearken unto you more than unto God, judge ye. Here thou hast the harmlessness of doves; listen now to the wisdom of serpents: We cannot but speak the things which we have seen and heard.
      status: verified
