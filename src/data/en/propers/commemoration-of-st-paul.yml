  text: 'Lest I should be exalted above measure through the greatness of the revelations, there was given to me a thorn in the flesh, the messenger of Satan, to buffet me; for this thing, I besought the Lord thrice, that it might depart from me. And the Lord said unto me: Paul, My grace is sufficient for thee.'
  citation: 2 Cor 12:7-9
