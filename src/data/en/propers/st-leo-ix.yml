  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Leo, the ninth of that name, sprung from the noble stock of the Franks, Count of Dagsburg and Bishop of Toul, formerly called Bruno, was raised to the most holy see of Peter by the votes of all the Cardinals and with the common rejoicing of the faithful, and sat in it five years, two months, and eight days. A man eminent in every kind of virtue and in sacred doctrine, he spared no labours, no expenses, no inconveniences to fulfil this Apostolic office.

        He visited Germany and Italy often, and Gaul once. He held nine councils, at Rheims, Mainz, Vercelli, Pavia, and Rome, for the restoration of the morals of Christians. He wrote many letters, burning with zeal and piety, to emperors, kings, patriarchs, and bishops. He sent legates to the emperor of Constantinople, once and again, for the reunion of the Greeks; he condemned Berengarius the heretic once and again, and struck Michael Cerularius, a notorious schismatic patriarch, with anathema.

        While he was at Rome, three times a week he used to go by night, barefoot, praying and singing psalms, from the most holy Lateran church to the Vatican. To the Prince of the Apostles he ceded by pontifical diploma the tenth part of the offerings which by custom belonged to himself. He spent his own patrimony on the erection of a monastery, whence money was sent every year for the expense of the golden rose, which the Roman Pontiffs bless with an ancient and solemn rite. He exercised a poured-out liberality toward the poor and pilgrims. Under the form and habit of a leper he once received Christ in his own bed. At last, having endured many labours for the Church, he died on the nineteenth day of April, in the year one thousand and fifty-four, renowned before and after death for many miracles, and was buried in the Vatican.
      status: draft
