nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'Felix the Second, a Roman, the son of Anastasius, was chosen Pontiff from being archdeacon of the Roman Church, while Liberius was still living. Since in the time of Gregory XIII a not slight controversy had arisen about the pontificate of Felix, and weighty men held differing views, it happened at that very time that in the deaconry of the holy martyrs Cosmas and Damian, in the Roman Forum, certain persons seeking treasure fell upon a marble coffin, in which was found the body of St. Felix, together with a stone tablet placed within it and inscribed with these letters: The body of St. Felix, Pope and Martyr, who condemned Constantius. This happened on the day before that on which Felix''s birthday was wont to be kept in the Church, the fourth day before the Kalends of August, in the year of the Lord 1582. Whence, Felix as it were bearing witness for himself, his feast has been customarily celebrated in the same deaconry with greater solemnity every year.'
      status: draft
