nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: John 18:33-37
      text: 'At that time, Pilate said to Jesus: Art thou the King of the Jews? Jesus answered: Sayest thou this thing of thyself, or have others told it thee of me? Pilate answered: Am I a Jew? Thine own nation and the chief priests have delivered thee to me: what hast thou done? Jesus answered: My kingdom is not of this world. If my kingdom were of this world, my servants would certainly fight, that I should not be delivered to the Jews: but now my kingdom is not from hence. Pilate therefore said to him: Art thou a king, then? Jesus answered: Thou sayest that I am a king. For this was I born, and for this came I into the world, that I should give testimony to the truth. Every one that is of the truth heareth my voice.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractates 51 and 115 on John
      text: |-
        What great matter was it for the King of all worlds to become King of men? For Christ was not King of Israel for exacting of tribute, or arming a host with the sword, and visibly subduing enemies: but King of Israel that he should rule minds, that he should counsel for eternity, that he should bring unto the kingdom of heaven them that believe, hope, and love. Being then, Son of God, the Word by whom all things were made, that it should be his will to be King of Israel is condescension, not preferment, a betokening of mercy, not an increasing of power. For he who was called on earth King of the Jews is in heaven Lord of the Angels. But is Christ King of the Jews only, or also King of the Gentiles? Yea, of the Gentiles also. For when he said in the prophecy: But I am set by him as King upon Sion his holy mountain, preaching the precepts of the Lord, lest on account of the Mount Sion, any should say that he was set as King only of the Jews, he hath straightway subjoined: The Lord hath said unto me, Thou art my Son: this day I have begotten thee. Ask of me, and I shall give thee the heathen for thy inheritance, and the uttermost parts of the earth for thy possession.

        Jesus answered: My kingdom is not of this world: if my kingdom were of this world, then would my servants fight, that I should not be delivered to the Jews; but now is my kingdom not from hence. This it is which was the will of our Good Master that we should know: but first we were to be shown the vanity of the opinion concerning his kingdom, entertained by men, whether Gentiles or Jews, from whom Pilate had heard that: as if the reason why he must be punished by death, were that he had affected a kingdom to which he had no right; or because the reigning are wont to look with an evil eye upon those destined to reign; and there were indeed need to beware lest his kingdom should be adverse either to the Romans or the Jews. Now the Lord might have answered at once, My kingdom is not from hence, to the first question put by the Governor, Art thou the King of the Jews? But in putting a question in return, namely, whether he spake this of himself, or had been told it by others, it was his will to show by Pilate's reply that this had been laid up to him as a crime by the Jews in their conference with the Governor: thus laying open to us the thoughts of men, which he knew, that they are vain; and to them, after Pilate's answer, making a reply which was more reasonable and suitable both to Jews and to Gentiles: My kingdom is not of this world.
      responsory: |-
        R. The kingdom of this world has become the kingdom of our Lord, and of his Christ: * and he shall reign for ever and ever.
        V. All the families of the nations shall bow down before him; for dominion is the Lord's.
        R. And he shall reign for ever and ever.
      status: verified
