collect:
  text: |
    Let us pray.
    Grant unto us, O Lord, we beseech thee, the help of thy grace, that we, who are now bent on fasting and prayer, may be freed from enemies both of our bodies and of our souls.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    O Lord, help thy servants, and grant unto their prayers this abiding effect of thy mercy that as they do make their boast in thee, that it is Thou which hast created and dost govern them, so Thou wilt renew in them the gifts wherewith Thou didst bountifully endow them, and wilt preserve what Thou hast renewed.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

