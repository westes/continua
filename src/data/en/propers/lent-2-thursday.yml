magnificat-antiphon:
  text: That rich man * who had refused Lazarus bread-crumbs, cried for a drop of water.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Luke 16:19-31
      text: 'At that time, Jesus said to the Pharisees, "There was a certain rich man who used to clothe himself in purple and fine linen, and who feasted every day in splendid fashion. And there was a certain poor man, named Lazarus, who lay at his gate, covered with sores, and longing to be filled with the crumbs that fell from the rich man''s table; even the dogs would come and lick his sores. And it came to pass that the poor man died and was borne away by the angels into Abraham''s bosom; but the rich man also died and was buried in hell. And lifting up his eyes, being in torments, he saw Abraham afar off and Lazarus in his bosom. And he cried out and said, ''Father Abraham, have pity on me, and send Lazarus to dip the tip of his finger in water and cool my tongue, for I am tormented in this flame.'' But Abraham said to him, ''Son, remember that you in your lifetime have received good things, and Lazarus in like manner evil things; but now here he is comforted whereas you are tormented. And besides all that, between us and you a great gulf is fixed, so that they who wish to pass over from this side to you cannot, and they cannot pass from your side to us.'' And he said, ''Then, father, I beseech you to send him to my father''s house, for I have five brothers, that he may testify to them, lest they too come into this place of torments.'' And Abraham said to him, ''They have Moses and the Prophets: let them hearken to them.'' But he answered, ''No, father Abraham, but if someone from the dead goes to them, they will repent.'' But he said to him, ''If they do not hearken to Moses and the Prophets, they will not believe even if someone rises from the dead.''"'
      status: verified
    - nocturn: 1
      isGospel: false
      source: Pope St. Gregory the Great, Homily 40 on the Gospels
      text: |-
        Whom, dearly beloved brethren, whom are we to understand as signified by that rich man which was clothed in purple and fine linen, and fared sumptuously every day, whom, I ask, are we to understand, but the Jewish people, who had all the outward life of religious ordinances, and who turned the treasure of the law they had received to show and not to use? What but the herd of the Gentiles is figured in Lazarus, full of sores? Whosoever turneth himself to God and is not ashamed to confess his sin, hath his sores on the skin, for in a sore on the skin breaketh out the corruption, which is drawn from within.

        What is, then, the confession of our sins but the breaking out of our sores? The corrupt matter of sin is healthily opened in confession, instead of remaining in the mind to rot it. Open sores on the skin bring the poisonous matter to the surface, and when we confess our sins, what do we but open up the evil that there is lurking in us? But Lazarus desired to be fed with the crumbs which fell from the rich man's table, and no man gave unto him; even so did that proud people scorn to admit a Gentile to the knowledge of their law.

        The teaching of the law moved them to pride, and not to love, as though they swelled with self-importance at the thought of their riches, and the words which some Gentiles caught of their knowledge were as crumbs falling from their sumptuous table. On the other hand, the dogs came and licked the sores of the beggar that was laid at their gate. Sometimes in Holy Writ, under the figure of dogs, preachers are understood. A dog's tongue healeth the sore which it licketh, and so do holy teachers, when we confess our sins, and they speak to us, mollify by their tongues the sores of our souls.
      responsory: |-
        R. Take thy weapons, thy quiver and thy bow, and bring me some of thy venison, that I may eat, * and my soul may bless thee.
        V. And when thou hast taken somewhat, make me thereof savoury meat, that I may eat.
        R. And my soul may bless thee.
      status: verified
