nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Sermon 4 on Lent
      text: |-
        Dearly beloved brethren, I am to preach to you the holiest and the greatest of Fasts; and with what words can I more fitly begin than with those words of the Apostle, in whom Christ spake, which have just been read? Behold, now is the acceptable time! Behold, now is the day of salvation! It is true that there are no times which are not rich with God's gifts; His grace doth ever give us an entry unto His mercy; nevertheless, more especially at this time doth it behove that the minds of all men be earnestly stirred up to make progress in things spiritual, and to be nerved by a trust in God stronger than ever; for now the anniversary of that day on which we were redeemed is drawing near, and thereby moving us to work all godliness, to the end that we may be able to celebrate, with clean minds and bodies, that mystery which exceedeth all others, the mystery of the Lord's sufferings.

        Mysteries so great demand sustained earnestness, and continuous worship, if we would ever abide in the sight of God, such as it is meet that He should find us on the Feast of the Passover. But since few have the strength to do thus, and the frailty of the body rebelleth against such hardness, while the diverse actions of this life distract us with their cares, it necessarily befalleth that the dust of earth befouleth the hearts even of the godly. To meet this befoulment therefore, and to restore the cleanness of our souls, it is provided by the healthful institution of God, that we should be purged by an exercise of forty days, wherein godly works may redeem the mis-spending of our other time, and purifying fasts rid us of the same.

        Therefore, dearly beloved brethren, as we are now about to enter upon these mystic days, the end of whose most holy ordinance is the cleansing both of our souls and bodies, let us take heed that we be obedient unto the command of the Apostle, putting far away from us every defilement of flesh and spirit, ordering the strife which there is between the two substances whereof we are compounded; that the soul, which is ordained under the rule of God, and which it beseemeth under His rule to rule the body, may enjoy the fulness of her lordship; giving no offence to any so that we may give no cause to such as revile us. For if our ways during the Fast agree not with the purity of perfect temperance, the reproaches of the unbelievers will be just, and our sins will arm the tongues of the ungodly to the harming of our religion. The sum of our Fast standeth not only in abstaining from meats; neither is it profitable to deny food to the body, if the mind be not bridled from iniquity.
      responsory: |-
        R. Let us amend for the better in that wherein we have sinned unknowingly, or ever the day of death suddenly prevent us, and we seek a place of repentance, and find none. * Give heed, O Lord, and have mercy upon us, for we have sinned against thee.
        V. Help us, O God of our salvation, and for the glory of thy Name deliver us, O Lord.
        R. Give heed, O Lord, and have mercy upon us, for we have sinned against thee.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 4:1-11
      text: At that time, Jesus was led into the desert by the Spirit, to be tempted by the devil. And after fasting forty days and forty nights, He was hungry. And the tempter came and said to Him, If You are the Son of God, command that these stones become loaves of bread. But He answered and said, It is written, ‘Not by bread alone does man live, but by every word that comes forth from the mouth of God.’ Then the devil took Him into the holy city and set Him on the pinnacle of the temple, and said to Him, If You are the Son of God, throw Yourself down; for it is written, ‘He has given His angels charge concerning You; and upon their hands they shall bear You up, lest You dash Your foot against a stone.’ Jesus said to him, It is written further, ‘You shall not tempt the Lord your God.’ Again, the devil took Him to a very high mountain, and showed Him all the kingdoms of the world and the glory of them. And he said to Him, All these things will I give You, if You will fall down and worship me. Then Jesus said to him, Begone, Satan, for it is written, ‘The Lord your God shall you worship and Him only shall you serve.’ Then the devil left Him; and behold, angels came and ministered to Him.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 16 on the Gospels
      text: |-
        Some persons are accustomed to question what Spirit it was of which Jesus was led up into the wilderness, on account of the words a little farther on: Then the devil taketh Him up into the holy city: and again: The devil taketh Him up into an exceeding high mountain. But in truth, and without any searching, we may very fitly take it that we are to believe it was the Holy Ghost Who led Him up into the wilderness; His own Spirit led Him where the evil spirit found Him to tempt Him. When however it is said that He, God and man, was taken up by the devil either into an exceeding high mountain or into the holy city, the mind shrinketh from believing, and the ears of man tingle to hear it. Yet these things we know not to be incredible, when we consider certain other things concerning Him.

        In truth, the devil is the head of all the wicked, and every wicked man is a member of this body, of which the devil is the head. Was not Pilate a limb of Satan? Were not the Jews that persecuted, and the soldiers that crucified Christ, likewise limbs of Satan? Is it then strange that He should allow Himself to be led up into a mountain by the head, Who allowed Himself to be crucified by the members? Therefore it is not unworthy of our Redeemer, Who came to be slain, that He was willing to be tempted. It was meet that He should thus overcome our temptations by His own, even as He came to conquer our death by His own.

        We ought to know that temptation worketh through three forms. There is, first, the suggestion; then the delectation; lastly, the consent. When we are tempted, it often happeneth that we fall into delectation, and even into consent, because in the sinful flesh of which we are begotten, we carry in ourselves matter to favor the attack. But God, when He took Flesh in the womb of the Virgin, and came into the world without sin, did so without having in Himself anything of this lusting of the flesh against the spirit. It was possible therefore for Him to be tempted in the first stage, namely suggestion; but there was nothing in His Mind in which delectation could fix its teeth. And thus all the temptation which He endured from the devil was without, and none within Him.
      responsory: |-
        R. Rend your hearts and not your garments, and turn unto the Lord your God; * For He is gracious and merciful.
        V. Let the wicked forsake his way, and the unrighteous man his thoughts, and let him return unto the Lord, and He will have mercy upon him.
        R. For He is gracious and merciful.
      status: verified
