collect:
  text: |
    Let us pray.
    Almighty and everlasting God, Who art always more ready to hear than we to pray, and art wont to give more than either we desire or deserve, pour down upon us the abundance of thy mercy, forgiving us those things whereof our conscience is afraid, and giving us those good things which we are not worthy to ask.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: When the Lord had departed from the coasts of Tyre, * He made both the deaf to hear and the dumb to speak.
  status: verified

magnificat-antiphon:
  text: He hath done all things well, * He maketh both the deaf to hear and the dumb to speak.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, Priest, Exposition of the Prophet Isaiah, Book 11, ch. 38
      text: |-
        Lest the heart of Hezekiah should be puffed up by his strange and unlooked for triumphs, and by his victory when he was but a prisoner, he was visited by bodily weakness, and told that he was to die that he might betake himself to the Lord, and turn Him from carrying out the sentence. This is not because that God is a Being capable of changing His mind, but because He willeth to mankind to know Him, how that "He repenteth Him of the evil" (Joel ii. 13). Hezekiah turned his face unto the wall, not being able to go up to the Temple.

        Having been told that he was about to die, he prayed not for life and many years, but left it to God to do as in His good judgment He was pleased to will. He knew how this had pleased God on the part of Solomon (3 Kings iii. 11). So, when he betook him to the Lord, he only made mention of his works, how he had walked before Him in truth, and with a perfect heart. Happy is he whose conscience in the hour of affliction can assure him of good works. Yea, "blessed are the pure in heart, for they shall see God" (Matth. v. 8).

        "And Hezekiah wept sore." He had then no children, and it seemed as though the promise which God had made unto David, that his seed should endure for ever, was about to fail in his own death. It is written that "Manasseh was twelve years old when he began to reign" (xxi. 1) - whence it is evident that Hezekiah begat him not till after three years of his new lease of life. Sore therefore wept he, when all hope was torn from him that the Messiah should spring from his seed.
      responsory: |-
        R. Saul hath slain his thousands, and David his ten thousands. * Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
        V. Is not this David? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, and David his ten thousands?
        R. Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Mark 7:31-37
      text: At that time, Jesus departing from the district of Tyre came by way of Sidon to the sea of Galilee, through the midst of the district of Decapolis. And they brought to Him one deaf and dumb, and entreated Him to lay His hand upon him. And taking him aside from the crowd, He put His fingers into the man’s ears, and spitting, He touched his tongue. And looking up to heaven, He sighed, and said to him, Ephpheta, that is, Be opened. And his ears were at once opened, and the bond of his tongue was loosed, and he began to speak correctly. And He charged them to tell no one. But the more He charged them, so much the more did they continue to publish it. And so much the more did they wonder, saying, He has done all things well. He has made both the deaf to hear and the dumb to speak.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 10, Book 1 on Ezekiel
      text: |-
        What signifieth it that when God, the Maker of all, would heal a deaf and dumb man, "He put His Fingers into his ears, and He spit, and touched his tongue." What is figured by the Fingers of the Redeemer but the gifts of the Holy Ghost? Hence it is written in another place (Luke xi. 20) that after He had cast out an evil spirit, He said: "If I with the finger of God cast out devils, no doubt the kingdom of God is come upon you." By setting this passage together with another (Matth. xii. 28) we see that the Spirit is called the Finger. For our Lord, then, to put His Fingers into the deaf man's ears was by the gift of the Holy Spirit to enlighten his dark mind unto obedience.

        That signifieth it also that "He spit and touched his tongue." We receive spittle out of the Redeemer's mouth upon our tongues when we receive wisdom to speak God's truth. Spittle is a secretion of the head which floweth into the mouth. And so, that wisdom, which is Himself, the great Head of His Church, as soon as it hath touched our tongue, doth straightway take the form of preaching. "And looking up to heaven, He sighed," not that He had any need to sigh, Who gave whatsoever He asked, but that He was fain to teach us to look up and sigh toward Him Whose throne is in heaven, confessing our need, that our ears should be opened by the gift of the Holy Spirit, and our tongue loosed by the spittle of our Saviour's Mouth, before we can use it to preach to others.

        "And He said unto him: Ephphatha, that is, be opened. And straightway his ears were opened, and the string of his tongue was loosed." Herein we must remark the command, "Be opened" was addressed to the deaf ears, but the tongue also was immediately loosed. Just so, when the ears of a man's heart have been opened to learn the obedience of faith, the string of his tongue also is thereupon loosed, that he may exhort others to do the good things which himself doth. It is well added "And he spake plain." He only doth well preach obedience to others who hath first learnt himself to obey.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
