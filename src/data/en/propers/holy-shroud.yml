nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Commentary on Luke, Bk. 10, on ch. 23
      text: |
        What is the meaning of this, that not the Apostles, but Joseph and Nicodemus, as John says, bury Christ? One just and steadfast, the other a master in Israel. For such is the burial of Christ, that it should have justice and teaching. The room for evasion is therefore closed, and they are refuted by the domestic testimony of a Jew. For if the Apostles had buried him, they would of course have said that he had not been buried, whom they said, though buried, had been stolen away. But the just man covers the body of Christ with linen; the innocent man anoints it with ointment. For we do not find that these things are distinguished idly: justice clothes the Church, innocence supplies grace.

        Do thou also, therefore, clothe the body of the Lord with his own glory, that thou thyself mayest be just. And if thou believest him dead, yet cover him with the fullness of his own divinity. Anoint him with myrrh and aloes, that thou mayest be the good odour of Christ. That just man Joseph sent a good linen cloth, and perhaps that which Peter saw let down to him from heaven, in which were kinds of four-footed beasts, and wild beasts, and fowls, figured after the likeness of the Gentiles. With that mystical ointment of spikenard, therefore, the Church is buried together with him, which joined the diversity of peoples in the communion of its faith.

        Luke called this Joseph just; Matthew, rich. And rightly is he called rich in this place, where he receives the body of Christ: for in receiving the Rich One he knew nothing of poverty of faith. He is rich, then, who is just. The just man therefore wraps in the linen; the Israelite mingles besides the various odours of virtues, and puts in aloes, about a hundred pounds, that is, the measure of perfect faith. And they bound the body of Jesus according to the special custom of the Jews: surely not with the knots of unbelief, but with the bonds of faith; and they laid him in a garden, to which the Church is often compared, which has the fruits of various merits and the flowers of virtues.
      responsory: |
        R. Christ suffered for us, leaving you an example that you should follow his steps: * Who did no sin, neither was guile found in his mouth.
        V. Who, when he was reviled, did not revile; when he suffered, he threatened not.
        R. Who did no sin, neither was guile found in his mouth.
      status: draft
    - nocturn: 3
      isGospel: true
      citation: Mark 15:42-46
      text: 'At that time: When evening was now come (because it was the Parasceve, that is, the day before the sabbath), Joseph of Arimathea, a noble counsellor, who also himself was looking for the kingdom of God, came and went in boldly to Pilate, and begged the body of Jesus. But Pilate wondered that he should be already dead. And sending for the centurion, he asked him if he were already dead. And when he had understood it by the centurion, he gave the body of Jesus. And Joseph, buying fine linen, and taking him down, wrapped him up in the fine linen, and laid him in a sepulchre which was hewn out of a rock. And he rolled a stone to the door of the sepulchre.'
      status: draft
    - nocturn: 3
      isGospel: false
      source: The Venerable Bede, Homily for Tuesday of Holy Week
      text: |
        Parasceve in Greek is called preparation in Latin, by which name the Jews who dwelt among the Greeks called the sixth day of the week, because on it they were wont to prepare what was necessary for the rest of the sabbath; according to what was once commanded about the manna: But on the sixth day you shall gather double. Because, then, on the sixth day man was made and the whole creation of the world was perfected, and on the seventh the Creator rested from his work, whence he willed that day also to be called the sabbath, that is, rest: rightly the Saviour, crucified on that same sixth day, fulfilled the mystery of human restoration; and therefore, when he had received the vinegar, he said: It is consummated; that is, of the sixth day, the work which I undertook for the remaking of the world is now wholly completed. And resting on the sabbath in the sepulchre, he awaited the event of the resurrection, which was to come on the eighth day.

        Joseph, he says, came from Arimathea, a noble counsellor, who also himself was looking for the kingdom of God, and boldly went in to Pilate, and begged the body of Jesus. This Joseph is indeed praised as one of great dignity in the world, but of greater merit before God. For it was fitting that he should be such who was to bury the body of the Lord: one who by the justice of his merits was worthy of such a ministry, and who by the nobility of worldly power could obtain the means of serving; for not just anyone, unknown or ordinary, could approach the governor and obtain the body of the crucified.
      responsory: |
        R. This is the most worthy shroud, * In which the author of salvation, taken down from the cross, deigned to be wrapped.
        V. That we, buried together with him, having laid aside the spoils of the old man, might be covered with the shroud of innocence.
        R. In which the author of salvation, taken down from the cross, deigned to be wrapped.
      status: draft
