collect:
  text: |
    Let us pray.
    O God, who hast left us the traces of thy passion in the holy Shroud in which thy most sacred body, taken down from the cross, was wrapped by Joseph: mercifully grant that through thy death and burial we may be brought to the glory of the resurrection:
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    A wonderful mystery
    is opened to us on this day,
    when the true Son of God
    undergoes a bloody death.

    Defending the cause of the servant,
    and taking on the guise of the guilty,
    the Master is hung up for the slave,
    the Just One is punished for the guilty.

    The signs of his death remain,
    impressed upon the sacred Shroud,
    which, after the noble triumph,
    had wrapped the bloodied body.

    These are the ensigns of death
    and hell and the conquered world:
    these are the glorious trophies
    of the most unconquered Leader.

    We therefore owe this grace
    to the Champion of our salvation,
    that against the wiles of the devil
    we may fight under this standard.

    Dead to the old life,
    let us rise to a new life,
    following Christ: through the Cross
    we shall enjoy the glory of Christ.

    * Grant, most loving Father,
    and thou, only equal of the Father,
    reigning with the Spirit the Paraclete
    through every age. Amen.
  status: draft

matins-invitatory:
  text: Christ the Lord, who renews the memory of his passion in the holy shroud, * O come, let us adore.
  status: draft

lauds-capitulum:
  text: Who is this that cometh from Edom, with dyed garments from Bosra? This beautiful one in his robe, walking in the greatness of his strength. I, that speak justice, and am a defender to save.
  citation: Isaiah 63:1
  status: draft

lauds-hymn:
  text: |
    Jesus, my sweet love,
    as though thou wert present, I draw near:
    I embrace thee with affection,
    mindful of thy Wounds.

    O how naked I behold thee here,
    wounded and stretched out,
    defiled, wrapped
    in this sacred covering!

    Hail, Head bloodied with thorns,
    whose sweet countenance
    hath lost its bloom,
    which the court of heaven trembles before.

    Hail, Side of the Saviour,
    hail, gentle opening,
    redder than the rose,
    salutary remedy.

    Holy hands, I greet you,
    pierced by cruel nails.
    Cast me not away, O Saviour,
    from thy holy Feet. Amen.
  status: draft

lauds-versicle:
  text: |
    V. The Lord hath reigned, he is clothed with beauty.
    R. The Lord is clothed with strength, and hath girded himself with power.
  status: draft

prime-lectio:
  text: 'I looked about, and there was no helper: I sought, and there was none to give aid: and my own arm hath saved for me, and my indignation itself hath helped me.'
  citation: Isaiah 63:5
  status: draft

terce-capitulum:
  text: |
    Who is this that cometh from Edom, with dyed garments from Bosra? This beautiful one in his robe, walking in the greatness of his strength. I, that speak justice, and am a defender to save.
    R. Thanks be to God.
    V. We adore thee, O Christ, and we bless thee.
    R. Because by thy Cross thou hast redeemed the world.
  citation: Isaiah 63:1
  status: draft

sext-capitulum:
  text: |
    Why then is thy apparel red, and thy garments like theirs that tread in the winepress? I have trodden the winepress alone, and of the Gentiles there is not a man with me.
    R. Thanks be to God.
    V. Let all the earth adore thee, and sing to thee.
    R. Let it sing a psalm to thy name, O Lord.
  citation: Isaiah 63:2
  status: draft

