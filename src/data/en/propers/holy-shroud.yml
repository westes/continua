          - 4
        antiphon: Thy apparel is red, and thy garments like theirs that tread in the winepress.
      - psalms:
          - 15
        antiphon: Blood hath been sprinkled upon my garments, and I have stained all my apparel.
      - psalms:
          - 14
        antiphon: They have parted my garments among them, and upon my vesture they have cast lots.
    versicle:
      v: We venerate thy Shroud, O Lord.
      r: We recall thy Passion.
  nocturn2:
    groups:
      - psalms:
          - 23
        antiphon: His look was as it were hidden and despised; whereupon we esteemed him not.
      - psalms:
          - 26
        antiphon: All they that saw me laughed me to scorn; they have spoken with the lips, and wagged the head.
      - psalms:
          - 29
        antiphon: He hath delivered his soul unto death, and he hath borne the sins of many.
    versicle:
      v: We adore thee, O Christ, and we bless thee.
      r: Because by thy Cross thou hast redeemed the world.
  nocturn3:
    groups:
      - psalms:
          - 52
        antiphon: My flesh shall rest in hope, for thou wilt not give thy Holy One to see corruption.
      - psalms:
          - 75
        antiphon: Thou hast turned my mourning into joy for me; thou hast cut my sackcloth, and hast compassed me with gladness.
      - psalms:
          - 87
        antiphon: I am become as a man without help, free among the dead.
    versicle:
      v: Let all the earth adore thee, and sing to thee.
      r: Let it sing a psalm to thy name, O Lord.

