vespers-hymn:
  text: |
    Let us all celebrate the glory
    of the sacred Shroud; let us recall in joyful hymns,
    and with devout vows, the sure memorials
    of our salvation.

    The venerable Shroud ever recalls,
    adorned with signs impressed in blood,
    how it bore, taken down from the high cross,
    the wrapped body of Jesus.

    It brings back to the mind the cruel sorrows
    which Christ, the Redeemer of the human race,
    bore, pitying the fall of Adam,
    death being destroyed.

    The image shows the side pierced with iron,
    the palms and the feet with nails, the limbs
    torn with scourges, and the crown
    fixed upon the head.

    What pious man could look, with dry eyes
    and without deep groaning of the heart,
    upon these marks, and the living images
    of an undeserved death?

    Since our guilt alone, O Christ,
    was the cause of so great evils to thee,
    our life is owed to thee: our very life
    we give up to thee.

    To thee, Son, be glory and power,
    who redeemest the world with thy blood,
    and who reignest with the supreme Father
    and the loving Spirit. Amen.
  status: draft

