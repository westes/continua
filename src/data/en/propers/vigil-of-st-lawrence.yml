collect:
  text: |
    Let us pray.
    Be near, O Lord, to our supplications: and through the intercession of blessed Lawrence, thy Martyr, whose festival we anticipate, graciously bestow upon us thy perpetual mercy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: true
      citation: Matt 16:24-27
      text: At that time, Jesus said to His disciples, "If any one wishes to come after Me, let him deny himself, and take up his cross, and follow Me. For he who would save his life will lose it; but he who loses his life for My sake will find it. For what does it profit a man, if he gain the whole world, but suffer the loss of his own soul? Or what will a man give in exchange for his soul? For the Son of Man is to come with His Angels in the glory of His Father, and then He will render to everyone according to his conduct."
      status: verified
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Homily 32 on the Gospels (on Matt 16:24-27)
      text: |-
        Our Lord and Redeemer came into the world a new Man, and gave the world new commandments. For against the ways of our old life, brought and bred up in sin, He set the contrast of His new life. It was the old way, according to the knowledge of the carnal man, for every man to keep his own goods, and, if he were able to do it, to take his neighbour's goods also, and, if he were not able to take them, at least to lust after them. But the Heavenly Physician hath medicines wherewith to meet all the diseases of sin. For, even, as by the art of the physician, things hot are healed by things cold, and things cold by things hot, so doth our Lord set against sin holiness, ordaining for the lecherous purity, for the miserly munificence, for the hot-tempered meekness, and for the proud lowliness.

        So the Lord, when He would give a new commandment unto them that came to Him, said Whosoever he be of you that forsaketh not all that he hath, he cannot be My disciple, as though He had said openly: All ye that according to the old man lust after your neighbour's goods, must, according to the zeal of the new man, give away even that which is your own. But let us hear again what He saith in this place If any man will come after Me, let him deny himself. First He saith that we must deny to ourselves that which is our own, and now that we must even deny ourselves to ourselves. Perchance it is not hard for a man to give up that which is his own, but it is exceeding hard to give up himself. To deny himself his possessions is little but to deny himself himself is a denial exceeding great.

        Let when we come unto Him the Lord will have us deny to ourselves even ourselves, since as many of us as are entered into the battle of faith, are entered into a contention against evil spirits. But the evil spirits have nothing of their own in this world, and therefore must we wrestle with them, naked with naked. For if he that is clothed, wrestle with him that is naked, he faileth swiftly, because he hath whereon he that is naked taketh hold. And what are all things earthly but things wherewith the soul is clothed upon? whosoever therefore will wrestle with Satan, let him cast away his clothes, lest he be thereby endangered.
      status: verified
