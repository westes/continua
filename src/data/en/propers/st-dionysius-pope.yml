nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Dionysius, from a monk, was established Bishop of the Roman Church after blessed Sixtus the Second. He wrote against the Sabellians, and put forth many volumes against those who asserted that the Son of God was a work or a creature. When Dionysius, Bishop of Alexandria, was accused before him, as though he said that the Son of God was made and not of one substance with the Father, he examined the cause in the Roman Synod, and wrote to him the sentence of that Synod, which he took ill; but when the Alexandrian prelate, sending his writings to Rome again and again, had cleared and defended himself, he was at length acquitted after mature counsel. Dionysius assigned the churches in the city to priests, and divided the cemeteries, parishes, and dioceses. At last, having performed many labours for the Church and being renowned for proofs of faith, under the Emperor Aurelian he departed to the Lord, and was buried in the cemetery of Callistus on the Appian Way, on the sixth day before the Kalends of January. He held in the month of December two ordinations, in which he created twelve Priests, six Deacons, and seven Bishops for various places. He sat eleven years, three months, and fourteen days.
      status: draft
