collect:
  text: |
    Let us pray.
    O God, our Refuge and Strength, Who art the author of all godliness, be ready, we beseech thee, to hear the devout prayers of thy Church, and grant that those things which we ask faithfully, we may obtain effectually.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Master, we know that Thou art true, * and teachest the way of God in truth, alleluia.
  status: verified

magnificat-antiphon:
  text: Render therefore unto Caesar the things which are Caesar's, * and unto God the things that are God's, alleluia.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 22:15-21
      text: 'At that time, the Pharisees went and took counsel how they might trap Jesus in His talk. And they sent to Him their disciples with the Herodians, saying, Master, we know that You are truthful, and that You teach the way of God in truth, and that You care naught for any man; for You do not regard the person of men. Tell us, therefore, what do You think: Is it lawful to give tribute to Caesar, or not? But Jesus, knowing their wickedness, said, Why do you test Me, you hypocrites? Show Me the coin of the tribute. So they offered Him a denarius. Then Jesus said to them, Whose are this image and the inscription? They said to Him, Caesar’s. Then He said to them, Render, therefore, to Caesar the things that are Caesar’s, and to God the things that are God’s.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Hilary, Bishop of Poitiers, Commentary on Matthew, Canon 23
      text: |-
        The Pharisees had oftentimes been put to confusion, and were not able to find any ground to accuse Him out of anything that He had hitherto said or done. His words and works are, of necessity, faultless, but still, from spite, they set themselves to seek in every direction for some cause to accuse Him. He was calling all to turn away from the corruptions of the world, and the superstitious practices of devotion invented by men, and to fix their hopes upon the kingdom of heaven. They therefore arranged a question calculated to entrap Him into an offense against civil government, namely: "Is it lawful to give tribute unto Caesar or not?"

        But Jesus perceived their wickedness, for in sooth there is nothing hidden in the heart of man, but what God seeth it, "and said Why tempt ye Me, ye hypocrites? Show Me the tribute-money. And they brought unto Him a penny. And He saith unto them Whose is this image and superscription They say unto Him Caesar's. Then saith He unto them: Render therefore unto Caesar the things which are Caesar's, and unto God the things that are God's." How wonderful is this answer? How perfect the fulfillment of the Divine Law herein prescribed So beautifully doth He here strike the balance between caring not for the things of the world, on the one hand, and the offense of injuring Caesar, on the other, that He proveth the perfect freedom of minds, however devoted to God, to discharge all human cares and duties, by commanding them to render unto Caesar the things which are Caesar's.

        If we have nothing which is Caesar's, then we have nothing which we are bound to render unto him. But if we are concerned with the things which are his, if we are entrusted by him with the use of delegated power, if we are subject to him as paid servants to take care of property which is not our own, there can be no dispute but that it is our duty to render unto Caesar the things which are Caesar's. But unto God all of us are bound always to render the things that are God's, that is to say, our body, soul, and will. These are things which we hold from Him, and whereof He is the Author and Maker. It is therefore simply just that they, who acknowledge that they owe to Him their being and creation, should render to Him all that they are.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
