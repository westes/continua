matins-hymn:
  text: |-
    Sing, my tongue, the glorious battle
    Sing the last, the dread affray;
    O'er the cross, the victor's trophy,
    Sound the high triumphal lay:
    Tell how Christ, the world's Redeemer,
    As a victim won the day.

    God, his Maker, sorely grieving
    That the first-made Adam fell,
    When he ate the fruit of sorrow,
    Whose reward was death and hell,
    Noted then this wood, the ruin
    Of the ancient wood to quell.

    For the work of our salvation
    Needs would have his order so,
    And the multiform deceiver's
    Art by art would overthrow,
    And from thence would bring the med'cine
    Whence the insult of the foe.

    Wherefore, when the sacred fullness
    Of the appointed time was come,
    This world's Maker left his Father,
    Sent the heav'nly mansion from,
    And proceeded, God Incarnate,
    Of the Virgin's holy womb.

    Weeps the infant in the manger
    That in Bethlehem's stable stands;
    And his limbs the Virgin Mother
    Doth compose in swaddling bands,
    Meetly thus in linen folding
    Of her God the feet and hands.

    To the Trinity be glory
    Everlasting, as is meet;
    Equal to the Father, equal
    To the Son, and Paraclete:
    Trinal Unity, whose praises
    All created things repeat. Amen.
  status: verified

lauds-capitulum:
  text: Come, let us put wood on his bread, and cut him off from the land of the living, and let his name be remembered no more.
  citation: Jer 11:19
  status: draft

lauds-hymn:
  text: |
    Thirty years among us dwelling,
    His appointed time fulfilled,
    Born for this, he meets his passion,
    For that this he freely willed:
    On the cross the Lamb is lifted,
    Where his life-blood shall be spilled.

    He endured the nails, the spitting,
    Vinegar, and spear, and reed;
    From that holy body broken
    Blood and water forth proceed:
    Earth, and stars, and sky, and ocean,
    By that flood from stain are free.

    Faithful cross! above all other,
    One and only noble tree!
    None in foliage, none in blossom,
    None in fruit thy peers may be;
    Sweetest wood and sweetest iron!
    Sweetest weight is hung on thee.

    Bend thy boughs, O tree of glory!
    Thy relaxing sinews bend;
    For awhile the ancient rigour,
    That thy birth bestowed, suspend;
    And the King of heavenly beauty
    On thy bosom gently tend!

    Thou alone wast counted worthy
    This world's ransom to uphold;
    For a shipwrecked race preparing
    Harbour, like the ark of old;
    With the sacred blood anointed
    From the smitten Lamb that rolled.

    * To the Trinity be glory
    Everlasting, as is meet;
    Equal to the Father, equal
    To the Son, and Paraclete:
    Trinal Unity, whose praises
    All created things repeat.
    Amen.
  status: draft

lauds-responsory:
  text: |
    R.br. Deliver, * O God, my soul from the sword.
    R. Deliver, * O God, my soul from the sword.
    V. My only one from the hand of the dog.
    R. O God, my soul from the sword.
    R. Deliver, * O God, my soul from the sword.
  status: draft

lauds-versicle:
  text: |
    V. Deliver me from my enemies, O my God.
    R. And defend me from them that rise up against me.
  status: draft

vespers-capitulum:
  text: 'But thou, O Lord of Sabaoth, who judgest justly, and triest the reins and hearts, let me see thy revenge on them: for to thee I have revealed my cause, O Lord my God.'
  citation: Jer 11:20
  status: draft

vespers-hymn:
  text: |
    Abroad the regal banners fly,
    Now shines the cross's mystery;
    Upon it Life did death endure,
    And yet by death did life procure.

    Who, wounded with a direful spear,
    Did, purposely to wash us clear
    From stain of sin, pour out a flood
    Of precious water mixed with blood.

    That which the prophet-king of old
    Hath in mysterious verse foretold,
    Is now accomplished, whilst we see
    God ruling nations from a tree.

    O lovely and refulgent tree,
    Adorned with purpled majesty;
    Culled from a worthy stock, to bear
    Those limbs which sanctified were.

    Blest tree, whose happy branches bore
    The wealth that did the world restore;
    The beam that did that body weigh
    Which raised up hell's expected prey.

    O Cross, our one reliance, hail!
    On this triumphant day avail,
    This holy Passiontide,
    To give fresh merit to the saint,
    And pardon to the penitent.

    * Blest Trinity, salvation's spring,
    May every soul thy praises sing;
    To those thou grantest conquest by
    The holy cross, rewards apply.
    Amen.
  status: draft

vespers-responsory:
  text: |
    R.br. From the lion's mouth, * O Lord, save me.
    R. From the lion's mouth, * O Lord, save me.
    V. And my lowness from the horns of the unicorns.
    R. O Lord, save me.
    R. From the lion's mouth, * O Lord, save me.
  status: draft

vespers-versicle:
  text: |
    V. Deliver me, O Lord, from the evil man.
    R. Rescue me from the unjust man.
  status: draft
