nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Leo the Great, Sermon 1 for the Birthday of the Holy Apostles Peter and Paul
      text: |-
        Dearly beloved brethren, in the joy of all the holy Feast-days the whole world is partaker. There is but one love of God, and whatsoever is solemnly called to memory, if it hath been done for the salvation of all, must needs be worth the honour of a joyful memorial at the hands of all. Nevertheless, this feast which we are keeping today, besides that world-wide worship which it doth of right get throughout all the earth, doth deserve from this city of ours an outburst of gladness altogether special and our own. In this place it was that the two chiefest of the Apostles did so right gloriously finish their race. And upon this day whereon they lifted up that their last testimony, let it be in this place that the memory thereof receiveth the chiefest of jubilant celebrations. O Rome, these twain are the men who brought the light of the Gospel of Christ to shine upon thee! These are they by whom thou, from being the teacher of lies, wast turned into a learner of the truth.

        These twain be thy fathers, these be in good sooth thy shepherds, these twain be they who laid for thee, as touching the kingdom of heaven, better and happier foundations, than did they that first planned thine earthly ramparts, wherefrom he that gave thee thy name took occasion to pollute thee with a brother's blood. These are they who have set on thine head this thy glorious crown, that thou art become an holy nation, a chosen people, a city both Priestly and Kingly, whom the Sacred Throne of blessed Peter hath exalted till thou art become the Lady of the world, unto whom the world-wide love for God hath conceded a broader lordship than is the possession of any mere earthly empire. Thou wast once waxen great by victories, until thy power was spread haughtily over land and sea, but thy power was narrower then which the toils of war had won for thee, than that thou now hast which hath been laid at thy feet by the peace of Christ.

        It well suited for the doing of the work which God had decreed that the multitude of kingdoms should be bound together under one rule, and that so the universal preaching of the Gospel should find easier entry into all peoples, since all were governed by the empire of one city. But this city, knowing not Him, Who had been pleased to make her great, used her lordship over almost all nations to make herself the minister of all their falsehoods, and seemed to herself exceeding godly because there was no false god whom she rejected. But the tighter that Satan had bound her, the more wondrous was the work of Christ in setting her free.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 16:13-19
      text: At that time, Jesus came into the quarters of Caesarea Philippi, and He asked His disciples, saying, "Whom do men say that the Son of man is?" But they said, "Some John the Baptist, and other some Elias, and others Jeremias, or one of the prophets." Jesus said to them, "But whom do you say that I am?" Simon Peter answered and said, "You are the Christ, the Son of the living God." And Jesus answering, said to him, "Blessed are you, Simon Bar-Jona, because flesh and blood has not revealed it to you, but My Father Who is in heaven. And I say to you, that you are Peter, and upon this rock I will build My Church, and the gates of hell shall not prevail against it. And I will give to you the keys of the kingdom of heaven. And whatever you shall bind upon earth, it shall be bound also in heaven; and whatever you shall loose upon earth, it shall be loosed also in heaven."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Commentary on Matthew, Bk. 3 (on Matt 16:13-19)
      text: |-
        Who do men say that I, the Son of man, am? This question is well put, for they who speak of Him as the Son of man are men, while they that know of Him that He is God are called not men but gods. And they said: Some say that Thou art John the Baptist, some, Elias. I marvel that some commentators have thought it worth their while to search into the origin of each of these blunders, and to engage in a discussion of weary length as to why some thought that our Lord Jesus Christ was John the Baptist, some, Elias and others, Jeremias, or one of the Prophets. Their blunders concerning Elias and Jeremias were but of a piece with Herod's concerning John the Baptist: It is John, whom I beheaded; he is risen from the dead and therefore mighty works do show forth themselves in him.

        But who say ye that I am? Mark, discreet reader, from the context, that a distinction is here drawn between the Apostles and mere men. The Apostles are called gods. Who, asketh the Lord, do men say that I am, but, on the other hand, who say ye that I am? They, being but men, deal in human speculations, but ye that are gods, who be ye persuaded that I am. And then Peter, as the representative of all the Apostles, uttered the testimony: Thou art the Christ, the Son of the living God. He calleth God living, to mark the difference between Him and all other that be called gods, and who are indeed dead.

        And Jesus answered and said unto him: Blessed art thou, Simon Bar-Jona. The Apostle having testified of the Lord, the Lord in turn testifieth of the Apostle. Peter had said: Thou art the Christ, the Son of the living God, and he received, in return for that his testimony to the truth, the words: Blessed art thou, Simon Bar-Jona. Why blessed? For flesh and blood hath not revealed it unto thee, but My Father. What flesh and blood could not reveal, the grace of the Holy Ghost had revealed. Meet for him therefore, because of his confession, is his name, as the name of one who hath revelation from the Holy Ghost, and therefore is called His son. Bar-Jona is, being interpreted, The-son-of-the-Dove.
      status: verified
