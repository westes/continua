nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Anterus, a Greek by race, the son of Romulus, was ordained Bishop at Rome after holy Pontian. He diligently had the acts of the martyrs sought out from the notaries and laid them up in the Church. For this reason he was crowned with martyrdom by the Prefect Maximus on the third day before the Nones of January, and was buried in the cemetery of Callistus on the Appian Way, in the principate of Maximinus. In a single ordination, in the month of December, he ordained a bishop for the city of Fundi in Campania. He sat in the pontificate one month and twelve days.
      status: draft
