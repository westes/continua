collect:
  text: |
    Let us pray.
    O God, Who seest that by reason of our sins we are sorely afflicted, mercifully grant unto us by thy visitation effectually to be comforted.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: O thou Angel of God, * how shall this be, seeing I know not a man? Hear, O Virgin Mary! the Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee!
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Luke 3:1-6
      text: Now in the fifteenth year of the reign of Tiberius Caesar, when Pontius Pilate was procurator of Judea, and Herod tetrarch of Galilee, and Philip his brother tetrarch of the district of Abilene, during the high priesthood of Annas and Caiphas, the word of God came to John, the son of Zachary, in the desert. And he went into all the region about the Jordan, preaching a baptism of repentance for the forgiveness of sins, as it is written in the book of the words of Isaias the prophet, "The voice of one crying in the desert, 'Make ready the way of the Lord, make straight His paths. Every valley shall be filled, and every mountain and hill shall be brought low, and the crooked ways shall be made straight, and the rough ways smooth; and all mankind shall see the salvation of God.'"
      status: verified
    - nocturn: 1
      isGospel: false
      source: Pope St. Gregory the Great, Homily 20 on the Gospels, on Luke 3:1-6
      text: |-
        The date, at which the Fore-runner of our Redeemer entered on his public office of preaching, is indicated to us by the name of the ruler of the Roman Commonwealth, and by those of the princes of Palestine. The time of his preaching is indicated by these names, because he came as the Fore-runner of Him Who was to be the Redeemer of some Jews and many Gentiles. Moreover in the enumeration of these worldly monarchs there is a foreshadowing of the fact, that the Gentiles were about to be gathered into one, and the Jews to be scattered abroad in punishment of their unbelief; in the whole heathen Commonwealth we find the title of one Emperor, but in the small kingdom of Judaea are mentioned four masters.

        The blessed voice of the Saviour itself hath said, Every kingdom divided against itself is brought to desolation. And we may well look for the ruin of the Jewish state when we see it divided among so many rulers. We observe likewise that the names of the reigning priests as well as kings are given. The Evangelist Luke hath left on record the chiefs both of the monarchy and of the priesthood who held office when John the Baptist began to preach, because John preached Him Who is at once our Priest and our King.

        And he came into all the country about Jordan, preaching the baptism of repentance for the remission of sins. It is evident from these words that John the Baptist not only preached, but also administered the baptism of repentance, and yet that baptism of repentance which he gave, was not really a baptism for the remission of sins. For there is only one baptism for the remission of sins, and that is our Christian baptism. It is worthy of note here that the words used are, preaching the baptism of repentance for the remission of sins, for he himself owned that his baptism was not the true baptism that washes away sin. Even as the Eternal Word of God made Flesh was greater than the preacher that went before Him, so was His holy baptism, by which our sins are washed away, far greater than that baptism of repentance which the Fore-runner preached, and which could never wash away sin.
      responsory: |-
        R. There shall come forth a rod out of the stem of Jesse, and a flower shall grow out of his roots. * And righteousness shall be the girdle of his loins, and faithfulness the girdle of his reins.
        V. And the Spirit of the Lord shall rest upon him the spirit of wisdom and understanding the spirit of counsel and might.
        R. And righteousness shall be the girdle of his loins, and faithfulness the girdle of his reins.
      status: verified
