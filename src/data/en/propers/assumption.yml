octave-readings/~-octave-day-4:
  source: From a Sermon of St. John Damascene
  text: |
    We have received from ancient tradition that at the time of the glorious falling-asleep of the Blessed Virgin, all the holy Apostles, who were traveling through the world for the salvation of the nations, were caught up on high in a moment of time and gathered together at Jerusalem. And while they were there, an angelic vision appeared to them, and the psalmody of the heavenly Powers was heard; and thus, with divine glory, she delivered her holy soul into the hands of God. But her body, which had received God in some ineffable manner, was taken up with angelic and apostolic hymnody and laid in a tomb at Gethsemane; in which place the singing of the Angels continued for three whole days.

    But after three days, when the angelic singing had ceased, the Apostles who were present (since Thomas alone, who had been absent, arrived after the third day, and wished to adore the body which had received God) opened the tomb; but nowhere could they find her sacred body at all. And finding only those things in which it had been wrapped, and being filled with the ineffable fragrance that came forth from them, they closed the tomb again. Astonished at the wonder of this mystery, they could think of nothing but this: that he who was pleased to take flesh of the Virgin Mary, and to become man and be born, though he was God the Word and the Lord of glory, and who after her childbearing preserved her virginity incorrupt, was pleased also, after her passing, to honor her spotless body, kept incorrupt, with translation before the common and universal resurrection.

    There were present then with the Apostles the most holy Timothy, first Bishop of the Ephesians, and Dionysius the Areopagite, as he himself testifies in what he wrote to the aforesaid Timothy concerning the blessed Hierotheus, who was likewise present at that time, saying thus: For even among those God-inspired high priests of holy things, when we too, as thou knowest, together with many of our holy brethren, had come together to look upon the body which had given the beginning of Life and had received God (there being present also James, the brother of the Lord, and Peter, the highest and most ancient of theologians): and when the sacred body had been seen, it pleased all, each as he was able, to celebrate with hymns the infinite goodness of the divine power.
  responsory: |
    R. I saw her, when, fair like a dove, she winged her flight above the rivers of waters. The priceless savour of her perfumes hung heavy in her garments. * And about her it was as the flower of roses in the spring of the year, and lilies of the valleys. V. Who is this that cometh out of the wilderness like a pillar of smoke, perfumed with myrrh and frankincense? R. And about her it was as the flower of roses in the spring of the year, and lilies of the valleys.
  status: draft

octave-readings/~-octave-day-5:
  source: Sermon of St. Bernard, Abbot
  text: |
    n. 1 When the glorious Virgin this day mounted upon the heavens, without doubt, she abundantly increased the joy of the citizens above. This same is she the voice of whose salutation maketh to leap with joy even such as are still shut up in their mothers' bellies. Luke i. 41, 44. If the soul of an unborn babe melted when Mary spake, what must we imagine to have been the jubilation of the heavenly ones, when it was their reward at once to hear her voice, and to see her face, and to enjoy her blessed presence.

    n. 4 But who also can picture to himself with what glory the Queen of the world went forth, and with what keen desire the whole multitude of the armies which are in heaven came out to meet her, with what hymns she was led to her throne of glory, with what a look of peace, with what a countenance of grace, with what Divine embraces her Son welcomed her, and set her above everything which God hath made? It was that be taken away from her honour of which such a Mother was worthy, and with that glory which beseemed such a Son.

    Sweet indeed were the kisses which the Suckling, Whom His Mother had praised while yet He lay hid in her virginal womb, pressed upon her lips. But shall we not believe that sweeter were those which she received from Him in blessed welcome, when He was sitting at the right hand of His Father, and she went up to the throne of His glory, singing the marriage-song and saying Let Him kiss me with the kisses of His mouth? Cant. i. 2. Who shall declare the generation of Christ or the Assumption of Mary So much as she found grace on earth more than others, so much more excellent than that of others is the glory which she hath in heaven.
  responsory: |
    R. I saw her, when, fair like a dove, she winged her flight above the rivers of waters. The priceless savour of her perfumes hung heavy in her garments. * And about her it was as the flower of roses in the spring of the year, and lilies of the valleys. V. Who is this that cometh out of the wilderness like a pillar of smoke, perfumed with myrrh and frankincense? R. And about her it was as the flower of roses in the spring of the year, and lilies of the valleys.
  status: verified

