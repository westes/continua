octave-readings/~-octave-day-7:
  source: Sermon of St. Bernard, Abbot
  text: |
    n. 1 It is the time for all flesh to speak when the Mother of the Incarnate Word is taken up into heaven, nor ought human mortality cease to give praise when the nature of man is in the Virgin exalted above the immortal spirits. But neither does our devotion allow us to be silent, nor can our sterile thought conceive, nor our unlearned speech give forth, anything worthy concerning her glory. Hence it is that those princes of the heavenly court in the consideration of such an unheard thing cry out with admiration: "Who is she who ascends from the desert abounding with delights?" Why should I not call delights the glory of virginity with the gift of fecundity, the ensign of humility distilling the honeycomb of charity, the bowels of mercy, the plenitude of grace, the prerogative of singular glory?

    As if to say more plainly: how great is this, or whence to her, thus ascending from the desert, comes so great an abundance of delights? For not even among us are the like delights found, we whom the rushing river gladdens in the city of the Lord, we who drink from the torrent of pleasure that flows from the countenance of glory. Who is this, who from beneath the sun, where there is nothing but labor and sorrow and affliction of spirit, ascends abounding in spiritual delights? Why should I not call them delights: the glory of virginity joined with the gift of fruitfulness, the mark of humility distilling the honeycomb of charity, the depths of mercy, the fullness of grace, the prerogative of a glory all her own?

    Ascending, therefore, from the desert, the Queen of the world, as the Church sings, was made beautiful even to the holy angels and sweet in her delights. But let them cease to wonder at the delights of the desert, for the Lord has given goodness and our earth has yielded its fruit. Why do they wonder that Mary ascends from the desert of the earth abounding with delights; let them wonder rather at Christ, being poor, descending from the plentitude of the heavenly Kingdom, for it seems by far a greater miracle that the Son of God deigned to be made a little less than the angels than that the Mother of God should be exalted above the angels. Indeed, his humiliation has been made our exaltation; his miseries are the delights of the world. Finally, being rich, he was made poor on account of us, that he might enrich us by his poverty.
  responsory: |
    R. I saw her, when, fair like a dove, she winged her flight above the rivers of waters. The priceless savour of her perfumes hung heavy in her garments. * And about her it was as the flower of roses in the spring of the year, and lilies of the valleys. V. Who is this that cometh out of the wilderness like a pillar of smoke, perfumed with myrrh and frankincense? R. And about her it was as the flower of roses in the spring of the year, and lilies of the valleys.
  status: draft

