nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Boniface, a Roman, the son of the priest Jucundus, obtained the episcopate of the Roman Church after blessed Zosimus was taken from human affairs. An aged priest, most learned in the law, and approved by good morals, unwilling and reluctant, by the acclamation of the whole people and the consent of the multitude of nobles, by seventy priests and nine bishops of various provinces, the order of divine institution being kept, he was consecrated in the basilica of Julius: at which time Eulalius the archdeacon, the deacons having been circumvented, and a very few of the clergy and a multitude of the disturbed people, rushing by ambition into a place not due to him, was ordained in the Constantinian basilica. In that schism Boniface, the lawful Pontiff, being vehemently oppressed, was compelled to leave the basilica of blessed Peter, and to retire with his own to that of blessed Paul. The cause being soon brought to a council of bishops, when the fathers differed among themselves, the whole matter was reserved for a fuller synod, the Emperor Honorius meanwhile ordering both Boniface and Eulalius to depart from the City. Whence the latter went to Antium, the former sought the basilica of St. Felicity.

        But when Eulalius had thrust himself into the City, and given occasion for public sedition, Honorius, moved by the affair, wrote that Eulalius be expelled from the City, and Boniface led into it; which was confirmed by a numerous synod of bishops. And so Boniface, returned, endeavoured with solicitous care to restore all to mutual concord, and provided for the future that after his death the Church should not be torn by a graver rent. He rejoiced in the devotion of the most pious emperors, and against the enemies of the grace of God used not only apostolic but also royal edicts; and though he was himself most learned, he nevertheless asked the answers of blessed Augustine, bishop, against the books of the Pelagians: to whom Augustine so deferred that he sent him his writings not so much to be learned as to be examined and corrected.

        He repressed Patroclus, bishop of Arles, who was invading the rights of another metropolis; and by letters to Hilary, bishop of Narbonne, ordered him to go, by the right of metropolitan and the precept of the Apostolic See, to the invaded place, and see to what was to be done, and refer all to the Apostolic See. He ordained that a woman or nun should not touch or wash the sacred palls; nor should anyone place incense in the church unless he were a minister. He forbade a slave, or one bound to the curia or to any obligation, to become a cleric. He made an oratory in the cemetery of St. Felicity the Martyr, beside her body, and likewise adorned the sepulchre of St. Silvanus, with many gifts offered. At last, most celebrated for fame, and full of the grace of God, he obtained the same glory, in the time of the princes Honorius and Theodosius, and was buried in the cemetery of St. Felicity on the Salarian Way, on the eighth day before the Kalends of November. Once in the month of December he created thirteen priests, three deacons, and thirty-six bishops for various places. He held the pontificate five years, less two months and three days.
      status: draft
