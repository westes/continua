collect:
  text: |
    Let us pray.
    In Your mercy, O Lord, may this hallowing fast enlighten the hearts of Your faithful people, and since You have given them the desire to serve You, lend a gracious ear to their prayers.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

benedictus-antiphon:
  text: My sheep hear My voice, * and I, the Lord, know them.
  status: verified

magnificat-antiphon:
  text: Many good works * have I wrought among you, and for them ye go about to kill Me?
  status: verified
