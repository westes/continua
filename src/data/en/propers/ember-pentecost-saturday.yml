collect:
  text: |
    Let us pray.
    We beseech thee, O Lord, mercifully to pour into our hearts thy Holy Spirit, by Whose Wisdom we have been created, and by Whose Providence all our ways are ordered.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the same Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: The charity of God * is poured forth in our hearts, by the Holy Ghost, who is given to us.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Luke 4:38-44
      text: At that time, Jesus rose from the synagogue and entered Simon's house. Now Simon's mother-in-law was suffering from a great fever, and they besought Him for her. And standing over her He rebuked the fever, and it left her; and she rose at once and began to wait on them. Now when the sun was setting, all who had persons sick with various diseases brought them to Him. And He laid His hands upon each of them and cured them. And devils also came forth from many, crying out and saying, You are the Son of God. And He rebuked them, and did not permit them to speak, because they knew that He was the Christ. Now when it was day, He went out and departed into a desert place. And the crowds were seeking after Him, and they came to Him, and tried to detain Him, that he might not depart from them. But He said to them, To the other towns also I must proclaim the kingdom of God, for this is why I have been sent. And He was preaching in the synagogues of Galilee.
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Book 4 on Luke 4 (on the healing of Simon's mother-in-law)
      text: |-
        Behold here how long-suffering is the Lord our Redeemer! Neither moved to anger against them, nor sickened at their guilt, nor outraged by their attacks, did He leave the Jews' country. Nay, forgetting their iniquity, and mindful only of His mercy, He strove to soften their hard and unbelieving hearts, sometimes by His teaching, and sometimes by freeing some of them, and sometimes by healing them. St. Luke doth well to tell us first of the man who was delivered from an unclean spirit, and then of the healing of a woman. The Lord indeed came to heal both sexes, but that must be healed first which was created first, and then must not she be passed by whose first sin arose rather from fickleness of heart than from depraved will.

        That the Lord began to heal on the Sabbath-day showeth in a figure how that the new creation beginneth where the old creation ended. It showeth, moreover, that the Son of God, Who is come not to destroy the law but to fulfill the law, is not under the law, but above the law. Neither was it by the law, but by the Word, that the world was created, as it is written — By the Word of the Lord were the heavens made. The law, then, is not destroyed, but fulfilled, in the Redemption of fallen man. Whence also the Apostle saith: Put off, concerning the former conversation, the old man, which is corrupt according to the deceitful lusts, and be renewed in the spirit of your mind, and put on the new man, which after God is created in righteousness and true holiness.
      responsory: |-
        R. They were all filled with the Holy Ghost, and began to speak, as the Holy Ghost gave them utterance; * And the multitude came together, saying: Alleluia.
        V. The Apostles spoke in diverse tongues the wonderful works of God.
        R. And the multitude came together, saying: Alleluia.
      status: verified
