  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gelasius, an African by race, his father Valerius, was put in the place of Felix the Third, and held the pontificate four years, eight months, and eighteen days. In a double ordination he created two deacons, thirty-two priests, and sixty-seven bishops for various places. A man indeed most ardent with singular zeal for propagating and preserving the faith, most instructed in all learning, especially sacred, and armed with the strength of an undaunted heart both to vindicate the rights of the Church and of the Apostolic See and to repel the insolence of heretics and schismatics.

        By his care and zeal not only the clergy was greatly increased, but the whole Church grew with great increase. In which his prudence was certainly wonderful, since at that time Anastasius, a heretic emperor, and Theoderic the Arian held the rule of both empires. When the danger of famine threatened, he freely relieved the City with grain. The Lupercalia and other pagan spectacles, which it is agreed had lasted down to those times, despite so many imperial edicts against idolatry and the zeal of the Roman Pontiffs to root it out, he abolished entirely, although Andromachus the senator and other Romans resisted in vain.

        Very many other things pertaining to the dignity and discipline of the Church he performed, ordained and wrote. The defenders of Acacius, especially Euphemius of Constantinople, he condemned; and by most forceful and most learned letters written to various persons, he either kept them to their duty or brought back those who strayed. The Pelagians, Manichaeans and other heretics he restrained, and caused their books to be given to public flames. Besides decretals and ecclesiastical hymns, he wrote excellent treatises against Nestorius, Arius, Pelagius and Eutyches. But this above all is to be remembered: that in a Roman synod of seventy bishops, by a singular decree, he distinguished the canonical books from the others, and the approved from the apocryphal. After many labours endured in ruling the universal Church, this most holy and most learned Pontiff piously died in the Lord on the eleventh day before the Kalends of December, in the year of Christ 496, and was buried in the Vatican.
      status: draft
