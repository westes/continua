nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Nicholas, the first of that name, a Roman by race, son of the regionary Theodore, Benedict the Third having been taken from the living, by the wonderful consent of all, in the year of Christ 858, was elected by the clergy, and, drawn by force from the basilica of the Prince of the Apostles, in which he was hiding, and led into the Lateran patriarchium, was proclaimed Roman Pontiff. From earliest boyhood he cultivated piety and every virtue, and made such progress in sacred letters that Sergius the Second in that same patriarchium made him subdeacon of the Roman Church, Leo the Fourth indeed deacon, and finally Benedict the Third administered the whole Church by his counsel and guidance.

        Very many letters written by him exist, in which he corrected the erring, humbled the proud, and revived the oppressed. He kept bishops, kings, and emperors to their duty: he broke the contumacy of John, archbishop of Ravenna: he sharply rebuked Hincmar, archbishop of Rheims, for the unjust deposition of Rothad, bishop of Soissons; he annulled his judgment and that of the Synod of Senlis on that matter; then, celebrating the solemnities of the Masses at St. Mary Major on the vigil of the Lord's Nativity, he fully restored the bishop himself to his former dignity, and soon after to his see. King Lothair, who, having cast off his lawful wife Theutberga, had taken Waldrada as concubine, he brought back to a saner mind by threatening anathema. He rejected the election of Photius, a layman, and restored the patriarch Ignatius to his former see. He so defended the rights of the Roman Church that each of his letters seems to be so many most strong bulwarks of the Apostolic See.

        As his zeal could not be confined within the then prescribed limits of the Church, he turned his mind to the conversion of infidels, and brought it about that the very large nation of the Bulgarians, together with their king, converted to the faith of Christ, joined the Roman Church, though the schismatic emperor raged. He also diligently applied his work to private offices of piety. Hence he wished to have with him a list of the names of all the needy, that he might the more carefully relieve each. He laid a liberal hand also to repairing and adorning the basilicas of the City, especially the Lateran patriarchium, and spared no expense. At last, the tenth year of his pontificate begun, he migrated to heaven, and was buried in the Vatican.
      status: draft
