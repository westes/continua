prime-chapter/responsory-per-annum:
  text: |
    R.br. Christ, Son of the living God, * have mercy on us.
    R. Christ, Son of the living God, * have mercy on us.
    V. Thou, who sittest at the right hand of the Father.
    R. Have mercy on us.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Christ, Son of the living God, * have mercy on us.
  status: verified

prime-lectio:
  text: And the Lord direct your hearts, in the charity of God, and the patience of Christ.
  citation: 2 Thess. 3:5
  status: verified

terce-capitulum:
  text: |
    Heal me, O Lord, and I shall be healed: save me, and I shall be saved, for thou art my praise.
    R. Thanks be to God.
    V. Be thou my helper, forsake me not.
    R. Do not thou despise me, O God my Saviour.
  citation: Jer. 17:14
  status: verified

sext-capitulum:
  text: |
    Bear ye one another's burdens; and so you shall fulfill the law of Christ.
    R. Thanks be to God.
    V. The Lord ruleth me: and I shall want nothing.
    R. He hath set me in a place of pasture.
  citation: Gal. 6:2
  status: verified

none-capitulum:
  text: |
    For you are bought with a great price. Glorify and bear God in your body.
    R. Thanks be to God.
    V. From my secret ones cleanse me, O Lord.
    R. And from those of others spare thy servant.
  citation: 1 Cor. 6:20
  status: verified
