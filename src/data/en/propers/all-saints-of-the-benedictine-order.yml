collect:
  text: |
    Let us pray.
    Grant, we beseech thee, almighty God, that the examples of thy holy Monks may call us to a better life: so that, whose feasts we keep, we may also imitate their deeds.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. You who left all and follow me, you will receive hundredfolds, and you will have eternal life.
    V. Pray for us, all ye Saints of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    Grant, we beseech thee, almighty God, that the examples of thy holy Monks may call us to a better life: so that, whose feasts we keep, we may also imitate their deeds.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

matins-hymn:
  text: |
    Jesus, Saviour of the ages,
    help those whom thou hast redeemed;
    and thou, devout Mother of God,
    ask salvation for the wretched.

    May the prayers of the monks,
    and all the citizens of heaven,
    grant the wishes of suppliants
    and ask for them the reward of life.

    Praise, honour, power, and glory
    to God the Father, and to the Son,
    and likewise to the Holy Paraclete,
    for ever and ever.
    Amen.
  status: draft

matins-invitatory:
  text: O come, let us worship the Lord, the King of kings, * for He is Himself the Crown of all the Saints.
  status: verified

lauds-capitulum:
  text: Behold, I and my children whom the Lord hath given me for a sign, and for a wonder in Israel from the Lord of hosts, who dwelleth in mount Sion.
  citation: Isa 8:18
  status: verified

lauds-hymn:
  text: |-
    Hail, cedars of Lebanon,
    Thriving plants of the Order,
    Who now fill the meadows of heaven
    With your fruitful growth.

    You the eternal glory
    Of the Trinity embraces round about;
    You the breath of the Virgin Mother
    Soothes with gentle, holy breezes.

    You the courts of Angels
    Encircle forever in dance,
    And the purest streams
    Of eternity water you.

    O renowned offshoots,
    Come to the aid of your own sons:
    In this sorrowful valley, strengthen
    Us, your weak young saplings.

    Praise be to the Father, with the Son,
    And together to the sweet Spirit,
    With whom you live rejoicing
    In everlasting light. Amen.
  status: draft

lauds-responsory:
  text: |
    R.br. Be glad in the Lord, * and rejoice, ye righteous.
    R. Be glad in the Lord, * and rejoice, ye righteous.
    V. And shout for joy, all ye that are upright in heart.
    R. And rejoice, ye righteous.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Be glad in the Lord, * and rejoice, ye righteous.
  status: verified

lauds-versicle:
  text: |
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
  status: verified

prime-antiphon:
  text: The just shall shine * as the sun in the kingdom of their Father, saith the Lord.
  status: draft

terce-antiphon:
  text: 'Blessed shall you be when men shall hate you, * and when they shall separate you, and shall reproach you, and cast out your name as evil, for the Son of Man''s sake: be glad and rejoice, for behold your reward is great in heaven.'
  status: draft

terce-capitulum:
  text: |
    Behold I and my children, whom the Lord hath given me for a sign, and for a portent in Israel, from the Lord of hosts, who dwelleth in Mount Sion.
    R. Thanks be to God.
    V. Be glad in the Lord, and rejoice, ye just.
    R. And glory, all ye right of heart.
  citation: Isa 8:18
  status: draft

sext-antiphon:
  text: 'The souls of the Saints rejoice in heaven, * who have followed the footsteps of Christ: and because for love of him they shed their blood, therefore they exult with Christ without end.'
  status: draft

sext-capitulum:
  text: |
    All these have gained glory in their generations, and are praised in their days.
    R. Thanks be to God.
    V. Let the righteous rejoice before God.
    R. Yea, let them exceedingly rejoice.
  citation: Sir 44:7
  status: draft

none-antiphon:
  text: O how glorious is the kingdom * in which all the Saints rejoice with Christ; clothed in white robes, they follow the Lamb whithersoever He goeth!
  status: draft

none-capitulum:
  text: |
    Their children for their sakes remain for ever: their seed and their glory shall not be forsaken.
    R. Thanks be to God.
    V. The righteous shall live for evermore.
    R. And their reward is with the Lord.
  citation: Sir 44:13
  status: draft

