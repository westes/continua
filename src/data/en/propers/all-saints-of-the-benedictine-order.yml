nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. John Damascene, Life of Barlaam and Josaphat, ch. 2
      text: |-
        Blessed, yea, thrice blessed, are they that have them loved God, and, for his love's sake, have counted their suffering as nothing worth. For they wept and here mourned, day and night, that they might gain glory and everlasting comfort: they humbled themselves after willingly, that there they might be exalted: they afflicted the flesh with hunger and thirst and vigil, that there they might come to the pleasures and joys of Paradise.

        By their purity of heart they became a tabernacle of the Holy Ghost, as it is written, I will dwell in them and walk in them. They crucified themselves unto the world, that they might stand at the right hand of the Crucified: they girt their loins with truth, and alway had their lamps ready, looking for the coming of the immortal bridegroom. The eye of their mind being enlightened, they continually looked forward to that awful hour, and kept the contemplation of future happiness and everlasting punishment immovable from their hearts, and pained themselves to labour, that they might not lose eternal glory. They became passionless as the Angels, and now they weave the dance in their fellowship, whose lives also they imitated.

        Blessed, yea, thrice blessed are they, because with sure spiritual vision they discerned the vanity of this present world and the uncertainty and inconstancy of mortal fortune, and cast it aside, and laid up for themselves everlasting blessings, and laid hold of that life which never faileth, nor is broken by death.

        These then are the marvellous holy men whose examples we, that are poor and vile, strive to imitate, but cannot attain to the high level of the life of these heavenly citizens. Nevertheless, so far as is possible for our weakness and feeble power, we take this assurance, that this holy profession is a means to perfection and an aid to the incorruption given us by holy baptism.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 19:27-29
      text: At that time, Peter said to Jesus, "Behold, we have left all and followed You; what then shall we have?" And Jesus said to them, "Amen I say to you that you who have followed Me, in the regeneration when the Son of Man shall sit on the throne of His glory, shall also sit on twelve thrones, judging the twelve tribes of Israel. And everyone who has left house, or brothers, or sisters, or father, or mother, or wife, or children, or lands, for My name's sake, shall receive a hundredfold, and shall possess life everlasting."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard of Clairvaux, Abbot, Sermon on St. Benedict (on Matt 19:27-29)
      text: |-
        Brethren, you have just heard our Lord making a promise to His disciples, saying to them: You shall sit on seats, judging the twelve tribes of Israel. Behold, the restfulness of being seated and the honour of passing judgment are promised. Now our Lord Himself was unwilling to receive these rewards except by humility and labour. Wherefore He was condemned to a most shameful death, loaded with torments, filled with opprobrium. So has He done, together with all who imitate Him in journeying on the way, in order that the enemy might be confounded. He it is, O wicked creature, He it is who will be seated on the throne of His Majesty, like to the Most High and equal to Him. The angels considered this when, at the fall of the evil one, they did not consent to his apostasy, thereby leaving us an example that as they chose to serve, so should we.

        Let those who fly labour and seek honour know that they imitate him who sought for himself power and majesty; and if the devil's crime does not terrify them, his punishment should. The saints of God, who indeed will be seated in judgment, have given us an example of prudence in avoiding these vices. They, I say, in their own esteem wretched worms of the earth, will sit in judgment. Do you not know, says the Apostle, that we shall judge even the angels? They indeed who went forth weeping, sowing their seed, will come with joy carrying their sheaves. They who have sown labour and humility reap honour and rest. Because for their double confusion and shame they will receive double in their land. Wherefore also a certain one has said: Behold my lowliness and sorrow.

        Not only that life itself, but also the promise of eternal life and the eager anticipation of it, are a joy for the just, and a joy so great that anything to be desired cannot be compared with it. This too the holy Apostles sowed for us as prudence, when, as those who followed the wisdom of this world (which is indeed foolishness in God's sight) and the prudence of the flesh (which worketh death and is inimical to God) withdrew from Christ, they themselves clung to our Lord. Manifestly, the martyrs sowed fortitude; the confessors followed justice throughout their lives.

        Our heavenly father, guide, master, and lawgiver Benedict, also instructs us in this doctrine and directs our steps along the way of peace. Moreover, he strengthens and animates us for a life of justice in such a way that we are so much the more impelled to practice what he taught as we are certain that he taught not otherwise than he acted. The example of works is indeed a living and effective sermon, since it makes what is spoken most persuasive, showing that that which is urged is possible. In this regard his sanctity comforts us, his piety instructs us, his justice strengthens us. With what great piety was he not animated who provided not only for his children present, but was also solicitous for those of the future! He nourishes us by his life, his teaching, and by his intercession. Being always thus helped, dearly beloved, become fruitful; since for this were you appointed, that you should go and bring forth fruit. Let us imitate him, because for this end he came, that he might give us the example and show us the way.
      status: verified
