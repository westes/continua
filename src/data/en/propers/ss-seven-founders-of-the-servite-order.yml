nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        In the thirteenth century, when the more cultured parts of Italy were rent by the dread dissension of the Emperor Frederick the Second and by bloody civil wars, the mercy of God set forth diverse men eminent for holiness, and among others raised up seven nobles of Florence, who were bound one to another in charity and gave an illustrious example of brotherly love. Their names were Bonfiglio Monaldi, Bonajuncta Manetti, Manetto Antalli, Amadeo de' Amidei, Uguccio de' Uguccioni, Sosteneo de' Sostenei, and Alexis de' Falconieri. Upon the holiday of the Assumption of the Virgin into heaven, in the year 1233, they were praying in the oratory of a guild called the Guild of Praise, when the same Mother of God appeared to each one of them, and bade them embrace a life of greater holiness and perfection. These seven men discussed the matter with the Bishop of Florence, and then, considering neither the nobility of their birth nor their wealth, and clad in haircloth under vile and worn-out garments, withdrew into a little house in the country upon the eighth day of September, that they might begin their holier life upon the same day whereon the Mother of God herself had by her birth begun her life of holiness upon earth.

        She showed by a miracle how acceptable in His sight should be their manner of life, for a short while after, when these seven men were begging alms from door to door through the city of Florence, it came to pass that some children, among whom was holy Philip Benizi, who had then scarcely entered the fifth month of his age, called them blessed Mary's servants, by the which name they were called ever after. To avoid meeting people, and in the desire to be alone, they all withdrew together to the solitude of Monte Senario, and there began a kind of heavenly life. They lived in caves and upon herbs and water only, while they wore out their bodies with watching and other hardships, while they contemplated unweariedly the sufferings of Christ and the woes of His most sorrowful Mother. One Good Friday, when their thoughts were fixed thereon more than ever, the Blessed Virgin appeared to them twice, and showed them her garments of mourning as those wherein they should clothe themselves. She bade them know that she would take it right well that they should raise up in the Church a new order to recall the memory of the sorrows which she bore beneath the Cross of the Lord. Holy Peter, the illustrious martyr of the Order of Friars Preachers, learnt this not only from his familiar converse with these holy men, but also from a special vision of the Mother of God, and it was on his incitement that they founded the regular Order called that of the Servites, or servants of the Blessed Virgin, the which Order was afterward approved by the Supreme Pontiff Innocent IV.

        These holy men, when they had gathered to themselves some companions, began to go through the cities and towns of Italy, and especially of Tuscany, everywhere preaching Christ crucified, stilling contests among the citizens, and calling back almost countless backsliders into the path of grace. Neither did they make Italy only the field of their Gospel labours, but also France, Germany, and Poland. They passed away to be ever with the Lord when they had spread far and wide a sweet savour of Christ, and were famous also for the glory of signs and wonders. As one love of brotherhood and of the monastic life had joined them together upon earth, so one grave held their dead bodies, and one honour was paid them by the people. For this reason the Supreme Pontiffs Clement XI. and Benedict XIII. confirmed the honour which had for centuries been paid to them individually, and Leo XIII., after proof of their miracles which had been wrought by God on the common invocation of these saints, after their veneration had been sanctioned in the jubilee year of his priesthood, decreed to them the honours paid to Saints, and ordered that their memory should every year be kept throughout the universal Church with an office and Mass.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 19:27-29
      text: At that time, Peter said to Jesus, "Behold, we have left all and followed You; what then shall we have?" And Jesus said to them, "Amen I say to you that you who have followed Me, in the regeneration when the Son of Man shall sit on the throne of His glory, shall also sit on twelve thrones, judging the twelve tribes of Israel. And everyone who has left house, or brothers, or sisters, or father, or mother, or wife, or children, or lands, for My name's sake, shall receive a hundredfold, and shall possess life everlasting."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book III (on Matt 19:27-29)
      text: |-
        Peter was a fisherman, he was not rich, he earned his bread by his hand and skill, and nevertheless he is thus bold, and saith confidently: We have forsaken all. And because it sufficeth not to forsake only, he addeth that which to do is to be perfect: and followed thee. We have done that which Thou hast commanded us, what reward therefore wilt Thou give us? And Jesus said unto them Amen I say unto you, that ye which have followed Me, in the regeneration, when the Son of Man shall sit in the throne of His glory, ye also shall sit upon twelve thrones, judging the twelve tribes of Israel. He said not, Ye which have forsaken all, for this did even Crates the philosopher, and they which have set nothing by riches are many, but, Ye which have followed Me. This did the Apostles, and this do believers do.

        In the regeneration, when the Son of Man shall sit in the throne of His glory, and when the dead shall rise again from corruption incorruptible, ye also shall sit upon twelve thrones of judgment, condemning the twelve tribes of Israel, because, when ye believed in Me, they would not. And every one that hath forsaken houses, or brethren, or sisters, or father, or mother, or wife, or children, or lands, for My Name's sake, shall receive an hundredfold, and shall inherit everlasting life. This place agreeth well with that other where the Saviour saith I came not to send peace, but a sword. For I am come to set a man at variance against his father, and the daughter against her mother, and the daughter-in-law against her mother-in-law; and a man's foes shall be they of his own household. Every one, therefore, that hath set no store by affection, and riches, and the pleasures of the world, for Christ's faith's sake, and the preaching of the Gospel, shall receive an hundred-fold, and shall inherit everlasting life.

        By reason of these words, an hundredfold, some will have that there shall be a thousand years after the resurrection, wherein they that have forsaken all things shall receive an hundredfold of those things which they have forsaken, and shall inherit everlasting life. Such men consider not that though in other things this were worthy, as touching wives it is unseemly for it becometh us not to think that he that hath forsaken one wife in this world, shall receive an hundred wives in that which is to come. But the meaning is this, that every one that for the Saviour's sake hath forsaken earthly things, shall receive spiritual things which things, being rightly weighed against earthly things, are as though an hundredfold were weighed against one.
      status: verified
