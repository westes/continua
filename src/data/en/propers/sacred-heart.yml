octave-readings/~-octave-day-6:
  source: From the Encyclical Letter of Pope Pius XI; Homily of St. Peter Canisius, Priest
  text: |
    But in what sense can it be said that our expiatory practices can give consolation to Christ, since He is now reigning in heavenly joy? We answer in the words of Saint Augustine, from a passage entirely appropriate to this subject: "Give me a lover, and he will feel the truth of what I say." Every soul which is on fire with the love of God, if it but turns its thoughts to the past, doth in its meditation perceive and contemplate Christ suffering for mankind, afflicted by grief in the midst of sorrows endured for us men and for our salvation, almost overcome by afflictions, vexations, and reproaches — yea, "bruised for our iniquities," and healing us by His own stripes. And devout souls will have an appreciation in proportion to their understanding of these mysteries, if they perceive that the sins and crimes of men, no matter when committed, were the real reason why the Son of God was condemned to death, and that sins committed at this present are able in some wise to cause the death of Christ, renewing as they do the cause of that selfsame death, with its sufferings and agonies, which was accomplished on the Cross; for every sin must be said to renew, in some fashion, the Lord's passion, concerning which we read in the Scriptures: "They crucify to themselves the Son of God afresh, and put Him to an open shame."

    And since, in view of our own future sins which were foreseen by Him, the soul of Christ became sorrowful even unto death, there can be no doubt that at the same time He was in some way consoled, through the provision of our acts of reparation, when the Angel from heaven appeared unto Him to comfort Him in the sorrows of His Heart, which was so bowed down with weariness and grief. And so, even at this present time, we can and we ought to console, in a mystical but nonetheless real manner, that most Sacred Heart, which same is being wounded continually by the sins of thankless men. It is in this sense that Christ is grieved over His abandonment by His friends, in the words of the Psalmist, which we are accustomed to interpret thus in the holy liturgy: "Thy rebuke hath broken My Heart; I am full of heaviness; I looked for some to have pity on Me, but there was no man, neither found I any to comfort Me."

    To the foregoing we should add that the expiatory passion of Christ is renewed, and in a certain manner continued and fulfilled, in His mystical body, which same is the Church. In this connection, once more the words of Saint Augustine are appropriate: "Christ suffered all that He needed to suffer; nothing at all is lacking in the number of His sufferings; therefore His sufferings are completed in Him as the Head; but there remaineth even yet the sufferings of Christ to be endured in the body." Which truth verily the Lord Jesus Himself made known, at the time that Saul was "breathing out threatenings and slaughter against the disciples," to whom the Lord said: "I am Jesus, Whom thou persecutest." By these words He plainly affirmed that persecutions visited on the Church are in reality directed against the Head of the Church. Meet it is therefore that Christ, thus still suffering in His mystical body, should desire to have us sharers in His own work of expiation, even as our own union with Him doth require. And since we are "the body of Christ, and members one of another," whatever the Head must suffer, all the members of the body must needs suffer together with Him.

    Have thou all diligence to turn over in thy mind this matter, namely: that He, Who is God over all, endured with unutterable charity a most bitter death on the Cross, in the exceeding anguish of His Heart, whilst the whole world mocked Him — and this He did for thee, who art but a paltry little worm! Meditate on the boundless generosity which Christ the Saviour manifested to all His own people. For at one time, standing in the midst of the people, He cried out: "If any man thirst, let him come to Me and drink," thereby shewing how ready He was to welcome everyone, and help him in his every need. Consider how freely He giveth thee to drink of His Heart's precious blood, seeing that His sacred side was opened, wherefrom He poured forth whatever blood was still left in His body.

    Wherefore, that I may not be utterly ungrateful, I will often set before mine eyes those perennial fountains of gifts and of all good things, since of them there standeth that most sweet promise: "Ye shall draw waters with joy out of the founts of the Saviour, and ye shall say in that day: Praise ye the Lord." To these same thrice-blessed clefts of the rock that can never be broken down will I flee; there will I build for myself a most steadfast nest, holding nothing dearer, in all my sorrows and perils, than to find rest by calling to mind the wounds of the Lord.

    And do thou, in every trial, flee quickly to the lovable Heart of Christ, and call to mind His goodness and charity, setting them against thine own vileness, malice, unfaithfulness, and pride. For consider how great was the charity of Christ in inviting all men unto Himself: "Come unto Me, all ye that labour and are heavy laden, and I will refresh you." It is with this intent that He offereth Himself to us, ready and desirous, out of love for us, to carry the burdens of each and all! Cast then thy sins into the abyss of His charity, and straightway thou shalt find thyself lightened of thy load.
