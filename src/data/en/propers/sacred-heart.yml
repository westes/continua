collect:
  text: |
    Let us pray.
    O God, who hast suffered the Heart of thy Son to be wounded by our sins, and in that very Heart hast mercifully bestowed on us the abundant riches of thy love: grant, we beseech thee, that offering him the devout homage of our piety, we may also render him a worthy tribute of satisfaction.
    Through the same Jesus Christ, thy Son, Our Lord, Who liveth and reigneth with thee in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

