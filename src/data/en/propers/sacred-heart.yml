nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Matins Lesson (historical), Feast of the Most Sacred Heart
      text: |-
        Among the wonderful advances of sacred doctrine and devotion, whereby the counsels of the divine Wisdom are made ever clearer to the Church day by day, scarcely anything is more conspicuous than the triumphant progress of the devotion to the Most Sacred Heart of Jesus. Often indeed, in earlier times, the Fathers, Doctors, and Saints celebrated the love of our Redeemer, and called the wound opened in Christ's side the hidden fountain of all graces. But from the Middle Ages onward, as the faithful began to be moved by a more tender devotion toward the most holy Manhood of the Saviour, contemplative souls were wont to penetrate, through that wound, to the very Heart itself, wounded by love of men. And from that time this contemplation became so familiar to holy souls that there is neither region nor religious order in which notable witnesses of it are not found in that age. In more recent centuries, and especially in the time when heretics, under the pretext of a false piety, were striving to deter Christians from the most holy Eucharist, public devotion to the Most Sacred Heart began to be shown, chiefly through the work of St. John Eudes, who is not unworthily called the author of the liturgical cult of the Sacred Hearts of Jesus and Mary.

        But to establish the devotion to the Most Sacred Heart of Jesus fully and perfectly, and to spread it throughout the whole world, God Himself chose as His instrument a most humble virgin of the Order of the Visitation, St. Margaret Mary Alacoque, to whom, from her earliest years already burning with love for the Sacrament of the Eucharist, the Lord Christ, appearing to her many times, deigned to show forth both the riches and the desires of His divine Heart. The most famous of these apparitions is that in which, as she prayed before the Blessed Sacrament, Jesus showed Himself to her, revealed His Most Sacred Heart, and, lamenting that in return for His boundless love He received nothing but the contempt of ungrateful men, commanded her to see to it that a new feast be instituted, on the Friday after the Octave of Corpus Christi, whereby His Heart might be honored with due reverence, and the injuries inflicted on Him in the Sacrament of love by sinners might be worthily atoned for. No one is ignorant of how many and how great difficulties this handmaid of God endured in carrying out Christ's commands; but, confirmed by the Lord Himself, and vigorously assisted by the spiritual directors of her soul, who labored with incredible zeal to promote this devotion, she did not cease faithfully to fulfil the office entrusted to her from heaven, even unto death.

        At length, in the year one thousand seven hundred and sixty-five, Pope Clement the Thirteenth approved the office and Mass in honor of the Most Sacred Heart of Jesus; and Pope Pius the Ninth extended the feast to the universal Church. Thenceforth the devotion to the Most Sacred Heart, like an overflowing river, having burst through every obstacle, spread itself throughout the whole world, and, as the new century dawned, Pope Leo the Thirteenth, proclaiming a jubilee, willed that the whole human race be consecrated to the Most Sacred Heart. This consecration, solemnly carried out in all the churches of the Catholic world, brought a great increase of this devotion, and drew to it not only peoples but also individual families, who devote themselves in countless numbers to the Divine Heart and submit themselves to His royal rule. Finally, Pope Pius the Eleventh, that the solemnity of the feast might more fully answer to the widespread devotion of the Christian people, raised the feast of the Most Sacred Heart of Jesus to the rite of a Double of the First Class with an Octave; and moreover, that the violated rights of Christ the supreme King and most loving Lord might be repaired, and the sins of peoples bewailed, he commanded that on that same feast day an expiatory prayer be recited every year in all the churches of the Christian world.
      responsory: |-
        R. All nations whom thou hast made shall come * and worship before thee, O Lord.
        V. And they shall glorify thy name, for thou art great and doest wondrous things.
        R. And worship before thee, O Lord.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 19:31-37
      text: At that time, the Jews, since it was the Preparation Day, in order that the bodies might not remain upon the cross on the Sabbath — for that Sabbath was a solemn day — besought Pilate that their legs might be broken, and that they might be taken away. The soldiers therefore came and broke the legs of the first, and of the other, who had been crucified with Him. But when they came to Jesus, and saw that He was already dead, they did not break His legs; but one of the soldiers opened His side with a lance, and immediately there came out blood and water. And he who saw it has borne witness, and his witness is true; and he knows that he tells the truth, that you also may believe. For these things came to pass that the Scripture might be fulfilled, Not a bone of Him shall you break. And again another Scripture says, They shall look upon Him Whom they have pierced.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bonaventure, Bishop, The Tree of Life, n. 30, and On the Mystical Vine, ch. 3
      text: |-
        In order that the Church might be taken out of the side of Christ, in his deep sleep on the Cross, and that the Scripture might be fulfilled which saith: They shall look on him whom they pierced: it was divinely ordained that one of the soldiers should pierce his sacred side with a spear, and open it. Then forthwith there came flowing out blood and water, which was the price of our salvation, pouring forth from its mountain-source, in sooth, from the secret places of his Heart, to give power to the Sacraments of the Church, to bestow the life of grace, and to be as a saving drink of living waters, flowing up to life eternal for those who were already quickened in Christ. Arise, then, O soul beloved of Christ. Cease not thy vigilance, place there thy lips, and drink the waters from the fount of salvation.

        Because we are now come to the sweet Heart of Jesus, and because it is good for us to be here, let us not too soon turn away therefrom. O how good and joyful a thing it is to dwell in this Heart. What a good treasure, what a precious pearl, is thy Heart, O most excellent Jesu, which we have found hidden in the field of thy body. Who would cast away such a pearl? Nay, rather, for this same I would give all my pearls. I will sell all my thoughts and affections, and buy the same for myself, turning all my thoughts to the Heart of the good Jesus, and without fail it will support me. Therefore, O most sweet Jesu, having found this Heart that is thine and mine, I will pray to thee, my God: admit my prayers into the shrine of hearkening; and draw me even more altogether into thy Heart.

        For to this end was thy side pierced, that an entry might be open unto us. To this end was thy Heart wounded, that in it we might be able to dwell secure from alarms from without. And it was wounded none the less on this account that, because of the visible wound, we may perceive the wound of love which is invisible. How could this fire of love better shine forth than for him to permit that not only his body, but that even his Heart, should be wounded with the spear? Who would not love that Heart so wounded? Who would not, in return, love one who is so loving? Who would not embrace one so chaste? Wherefore let us who are in the flesh love in return, as much as we can, him who so loveth, embrace our wounded one, whose hands and feet, side and Heart, have been pierced by wicked husbandmen; and let us pray that he may deign to bind our hearts, still hard and impenitent, with the chain of his love, and wound them with the dart thereof.
      responsory: |-
        R. If I be lifted up from the earth, * I will draw all things unto myself.
        V. This he said, signifying what death he should die.
        R. I will draw all things unto myself.
      status: verified

octave-readings/~-octave-day-2:
  source: From the Encyclical Letter of Pope Pius XI; Homily of St. John Chrysostom
  text: |
    Among all other proofs of the infinite kindness of our Redeemer, this one is especially conspicuous, that, as the love of the Christian believers grew cold, He, Divine Love itself, was proposed to be honoured by a special devotion, and that the rich treasures of His goodness were thrown wide open by means of that form of worship with which we honour the most Sacred Heart of Jesus, "in whom are hid all the treasures of wisdom and knowledge." For, as formerly God wished to give light to the human race as they came out of Noah's ark by the signal of a treaty of friendship, "a bow appearing in the clouds," so, in those most troublous times of a more recent age, when that most subtle of heresies, Jansenism — an enemy of the love of God and of piety, preaching that God was not so much to be loved as a father, as to be feared as an unrelenting judge — was everywhere creeping in, the most kind Jesus manifested unto the nations His most Sacred Heart, borne on high like unto a banner of peace and love, an augury of certain victory in battle.

    Because Our predecessor, Leo XIII, of happy memory, desiring to obtain the advantages of such a great devotion to the most Sacred Heart of Jesus, in his Encyclical Letter "Annum Sacrum" most fittingly did not hesitate to proclaim: "When the Church, in the early period of her history, was oppressed by the yoke of the Caesars, a cross appeared in the heavens to a youthful emperor, which was at the same time both the sign and the cause of that most complete victory, which was soon to follow. Behold this day another most auspicious and most holy sign presented to our eyes: that is to say, the most Sacred Heart of Jesus, with a Cross set upon it, shining forth among flames of a most brilliant radiance. In this, all our hopes are to be placed; from this, the salvation of mankind is to be asked for and to be awaited."

    And it is indeed justly so; for in this most auspicious sign, and in that form of piety which doth follow from it, is there not contained the sum of the whole of religion, and therefore the rule of the more perfect life, inasmuch as it leadeth our minds the more easily to a deeper knowledge of Christ the Lord, and moveth our souls more effectually to a more vehement love of Him and a closer imitation of Him? Therefore no one will be surprised that Our predecessors have continuously vindicated this most approved form of devotion from the accusations of its detractors, that they have extolled it with the highest praises, and have promoted it with the most ardent zeal, according as considerations of the period and of affairs in general have demanded. And it hath come to pass by the providence of God, that the devout affection of Christ's faithful people towards the most Sacred Heart of Jesus obtaineth daily a greater increase.

    See ye not how mighty is the Truth? Through the zeal of the Jews the prophecy is fulfilled. And more than one prophecy was fulfilled. For when the soldiers came and brake the legs of the others, they brake not the legs of Christ. But yet these soldiers, to please the Jews, did pierce His side with a lance, and treat His body with contumely. O wicked and accursed crime! But be not troubled, beloved, or cast down. They indeed did it in ill-will, but they unwittingly contended for the truth, as verily the prophecy foretold: "They shall look on Him whom they have pierced." And more than this, the evil deed served as a demonstration even afterwards to those who were without faith, such as Thomas and others like him. This ineffable mystery was also consummated to another end: "Forthwith came there out blood and water." Nor causelessly or by mere chance did these fountains flow, but because the Church was founded with Water and Blood.

    This is well-known to those who have been initiated, namely, to all who have been regenerated by the Water, and nourished with the Flesh and Blood, so that when thou dost approach to the awesome Cup, thou shouldst come as if thou wert about to drink from this very side of Christ. "And he that saw it bare record, and his record is true": as though to say, "Not from others have I heard it, but I myself was present, and saw it, and therefore my record of it is true." Truly indeed doth he thus speak. For he speaketh to us as of an insult, and not as of something great and wonderful, else thou mightest doubt his testimony; but he, thus shutting the mouth of heretics, and foretelling future mysteries, and mindful of the treasure to be contained in them, doth enumerate one by one the events as they took place. These things were done that the Scriptures should be fulfilled: "A bone of him shall not be broken." For even though this was written concerning the lamb which the Jews used for their Passover, nevertheless this lamb was a figure which came first to shew forth the reality yet to come, wherein the prophecy was to be perfectly fulfilled; and that is why the Evangelist quoteth the passage as a prophecy.

    Since the testimony he himself beareth might not everywhere be held worthy of belief, he citeth Moses, to intimate that this thing was not done by chance, but had already long ago been foretold in writing. By Moses it was said: "A bone of him shall not be broken." And again he resteth his faith on the same Prophet: "These things I have said," saith he, "that ye may learn how great is the resemblance between the figure and the reality." Seest thou what great care he taketh, that what appeareth as disgraceful and ignominious may be believed? For that the body should be treated with contempt by the soldier, was far worse than its crucifixion. But nevertheless, saith he, I have both said these things, and have said them most emphatically, that ye may believe. Let no one, therefore, deny credence to these things, nor in shame tamper with our beliefs. For those things which seem to be the most dishonouring, are in fact our greatest pride.
  responsory: |
    R. I will make an everlasting Covenant with them, and I will not cease from doing them good, and I will put my fear in their hearts, * So that they shall not depart from me. V. Yea, I will rejoice over them, to do them good with my whole Heart. R. So that they shall not depart from me.
  status: verified

octave-readings/~-octave-day-4:
  source: From the Encyclical Letter of Pope Pius XI; Homily of St. Lawrence Justinian, Bishop
  text: |
    No effort on our part could have availed for the expiation of human sin, if the Son of God had not assumed human nature in order to redeem men from their sins. This truth the Saviour of mankind hath made known in the words of the Psalmist: "Sacrifice and offering thou wouldest not, but a body hast thou prepared me; in burnt offerings and sacrifices for sin thou hast had no pleasure; then said I, Lo, I come." Surely He hath borne our griefs, and carried our sorrows: He was wounded for our transgressions, He was bruised for our iniquities: Who His own self bare our sins in His body on the Tree; and blotting out the handwriting of ordinances that was against us, which same was contrary to us, He took it out of the way, nailing it to His Cross: that we, being dead unto sins, should live unto righteousness. But although this plenteous redemption of Christ was more than sufficient to satisfy for all our offenses, nevertheless, due to the wondrous dispensation of the divine Wisdom, whereby in our own flesh we may fill up that which is behind of the afflictions of Christ for His body's sake, which is the Church, we can, and in fact we should, add our own acts of praise and satisfaction to those acts of praise and satisfaction which Christ, in the name of sinners, presented to God.

    However, we must always remember this: the expiatory value of our acts is dependent upon the Bloody Sacrifice of Christ, which same is presented bloodlessly on our altars, without pretermission. Note that in both the Unbloody and the Bloody Sacrifice, the Victim is one and the same. He that offered Himself on the Cross is the very same that doth offer Himself by means of our ministerial priesthood; the only difference being the manner in which the Sacrifice is made; for which reason there must needs be conjoined to the august Sacrifice of the Holy Eucharist an act of immolation from the priests and the faithful, whereby they offer up themselves also, to be a reasonable, holy, and living sacrifice, acceptable unto God. With this in mind, Saint Cyprian dared to affirm that the Sacrifice of the Lord is not complete, so far as our sanctification is concerned, until our personal offerings and sacrifices are brought into union with His passion. To which end we have been given apostolic admonition: that we should always bear about in the body the dying of the Lord Jesus, and thereby, buried with Him by Baptism unto death, not only can we crucify the flesh with its affections and lusts, thus escaping the corruption that is in the world through lust, but also thereby the life of Jesus can be made manifest in our bodies; and so, having been made partakers of Christ in His holy and eternal priesthood, we should offer both gifts and sacrifices for sins.

    And note who they are that be partakers in the mysteries of such a priesthood, and in the duty of offering sacrifices and satisfaction to God: not only they who have been ordained as ministers of such sacrifices, to offer unto the divine Name in every place a pure offering, from the rising of the sun even unto the going down of the same, but also all others who are Christians, which same, by the Prince of the Apostles, are called, and rightly so, a chosen generation, a royal priesthood, who are to offer sacrifices for sin, not only for themselves but for all mankind, and this in much the same way as every priest and high priest taken from among men is ordained for men in the things that appertain to God.

    But when they came to Jesus, and saw that He was dead already, they brake not His legs, but one of the soldiers with a spear pierced His side, and forthwith came there out blood and water. Truly this is a great and unheard-of wonder, that from a lifeless body should gush out blood and water! And thereby we are constrained to believe that God willed to set forth the great mystery, namely, the oneness between Christ and the Church. Consider how aforetime a figure of this spiritual union was given us in the Scriptures, where we are told that, from the side of Adam as he slept, one of his ribs was taken, wherefrom was formed Eve, the mother of us all, which same is understood to be a type of the Church. For thereby the Holy Ghost signified that there was to be a true and spiritual Adam, fashioned by the same Paraclete, from whose side, while He slept on the Cross, the Church would be formed, a comely spouse radiant with youth, that is, without spot or wrinkle, or any such thing.

    For the blood and water are the Sacraments of the Church, whereby the whole body of the Church is washed and sanctified. Certain it is that in the laver of regenerating water, which same was consecrated by the death of Christ, the Church is cleansed from original sin. And not only is purification given thereby, but entrance to the heavenly kingdom is also made. Both these things are done at one and the same time, nor doth one avail for salvation without the other; for no one can take unto himself the inheritance of the blessedness which is to come without the Sacrament of Baptism and the remission of sins. This truth is confessed all the world over by holy Mother Church, and confirmed by manifold testimonies in the Word of God. Moreover, he too bare witness, who saw the water and blood flow forth from the side of Christ, and his testimony is true. Now this is John the Apostle and Evangelist, who was loved with an exceeding great love by the Lord.

    Verily, all these things were done that the Scriptures might be fulfilled, which say: "A bone of him shall not be broken" — which same was in obedience to the Lord's commandment to Moses, that in the sacrifice of the Passover, wherein was celebrated the offering up of the lamb, no bone should be broken. Wherefrom, when this ancient prototype was fulfilled in the most innocent Lamb, the Lord Jesus Himself, obedience to the ancient command was also fulfilled. For in no wise were His legs broken, after the manner of what was done to the two malefactors hanging with Him; but His side alone was opened, that another Scripture might be fulfilled, which saith: "They shall look upon Him whom they have pierced." Moreover, the Lord willed to retain the marks of the Wounds in His body, thereby to incite the devotion of the elect, and also be an unanswerable testimony of damnation to the reprobate. And so all things were consummated in Christ, which had been long before declared by the oracles of the Prophets, that the Catholic faith might be strengthened both in itself and against the errors of the heretics.
  responsory: |
