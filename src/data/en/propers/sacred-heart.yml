octave-readings/~-octave-day-8:
  source: Sermon of St. Bernard, Abbot; Homily of St. Augustine, Bishop
  text: |
    For us who are so frail and weak, where is to be found a sure and certain place of abiding safety, or of everlasting rest? Where except in the Wounds of the Saviour? There alone I may dwell safely. There alone I may find a safety as great as His mighty power to save. The world may rage around me; the body may weigh me down; the devil may lay snares for me; but if I hide me there I cannot fall, for I am founded on the firm Rock. If I have committed a great sin; if my conscience is sore troubled; I will not despair, for I have always in remembrance the Wounds of the Lord. For in all truth: He was wounded for our transgressions. And there is no sin so deadly that it cannot be remitted through Christ's death. If then I keep in remembrance a remedy so powerful and efficacious, I cannot in this present life be terrified by any evil, no matter how malignant.

    But as for me, since mercies thus abound, I take unto myself whatever is lacking in me; yea, I take it unto myself with confidence; I take it unto myself from the compassion of the Lord, with whom every kind of mercy aboundeth. For openings are not wanting, through which these mercies may flow forth. "They have pierced My hands and My feet"; yea, and His side too they have pierced with a spear. It is through these clefts that I am permitted to suck honey from the Rock, and oil out of the flinty Rock, and to taste and see how gracious the Lord is. "His thoughts are thoughts of peace," and I knew it not. For "who hath known the mind of the Lord? or who hath been His counsellor?" But the nail which did pierce hath become unto me a key which doth unlock, so that the will of the Lord is set open unto me. How could I, with such an opening, do other than see His will? For the nails cry aloud, and the Wounds speak, saying the truth: to wit, that God is in Christ reconciling the world unto Himself.

    "The iron entered into his soul," and came nigh unto His Heart, that He might truly know compassion for mine infirmities. The secrets of His Heart lie open, through the Wounds of His body. Thus is that great mystery of love laid open; there lie open the bowels of the mercy of our God, whereby "the Day-Spring from on high hath visited us." But why should not the bowels of mercy lie open through the wounds? For in what hath it appeared more clearly than in Thy wounds, that Thou, O Lord, art sweet and gentle, and of great mercy? For "greater love hath no man than this, that a man lay down his life" for those who were doomed and condemned to death. From this pity of the Lord is all my merit. I am not entirely destitute of merit, so long as He is not wanting in compassion. And if the mercies of the Lord are from eternity unto eternity, I also will sing the mercies of the Lord forever.

    But when they came to Jesus, and saw that He was dead already, they brake not His legs; but one of the soldiers with a spear opened His side, and forthwith came there out blood and water. Note that the Evangelist maketh use of a word of special significance: he saith not "pierced His side," nor "wounded," nor any other thing, but "opened," that thereby in a sense the door of life might be thrown open, from whence the Sacraments of the Church have flowed forth, without which there is no entrance into the life which is the only true life. For that blood was shed for the remission of sins; and that water hath brought into being the life-giving cup, which same is both the laver of Baptism and the drink that giveth refreshment to them that thirst. All this was announced long before, when Noah was commanded to make a door in the side of the ark, through which might enter all living creatures which were not destined to perish in the flood; and this same is a figure of the Church.

    Another figure is also to be found in the first woman. For she was made out of the side of the first man whilst he slept a deep sleep, and she was called "Life," or, as it may be interpreted, "The Mother of all living." Thus was indicated the great good which was later to come to pass, even before the great evil of transgression had come into being. Here, in the Gospel, the second Adam is shewn bowing His head, and sleeping His deep sleep upon the Cross, that a bride might be formed for Him out of that which came forth from His side as He slept. O death, whereby the dead are raised anew to life! What is cleaner than this blood? What is more health-giving than this wound? "And he that saw it," saith he, "bare record, and his record is true; and he knoweth that he saith true, that ye might believe." He said not "that ye might know," but "that ye might believe." For he who hath seen knoweth, that he who hath not seen might believe his record. And believing belongeth more to the nature of faith than doth seeing.

    From the Scriptures he giveth two testimonies, one for each of the things which he hath recorded as having been done. To the words, "When they came to Jesus, and saw that He was dead already, they brake not His legs," belongeth the testimony: "A bone of him shall not be broken" — which same cometh from the Mosaic injunction laid upon the Jews, who were commanded by the Old Law to celebrate the Passover by the sacrifice of a lamb, which same was a foreshadowing of the passing of Christ, whence we have the passage: "Christ our Passover is sacrificed for us," concerning which the Prophet Isaiah also foretold: "He is brought as a lamb to the slaughter." To the words, "One of the soldiers with a spear pierced His side," belongeth the other testimony: "They shall look on Him whom they pierced," which same is a promise of the coming of Christ in that selfsame flesh wherein He was afterwards crucified.
