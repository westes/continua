nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, On the Duties of the Clergy, Book 1, ch. 40
      text: |-
        There may perchance be some who are so blinded by the glory of war as to think there is no valour but warlike valour, and that the reason why I have taken up other subjects is that among us there is no warlike valour whereof to speak. But what was the valour of Josue the son of Nun, when in one battle he laid low five nations, and took prisoners their kings? When he was fighting against the Gibeonites, and feared lest the closing in of night should cut short his victory, he cried aloud in the greatness of his mind and of his faith: "Sun, stand thou still over against Gibeon, and thou, Moon, over against the valley of Ajalon" — and the sun stood still, and the moon stayed, until the people had avenged themselves upon their enemies. (Josue 10:12-13.) Gideon, with three hundred men, won the victory over the vast people, and the savage enemy. The lad Jonathan waxed valiant in fight.

        Shall I speak of the Maccabees? But before I speak of them, I will speak of their fathers, even of them who, when they were ready to fight for the Temple of God and for their own rights, were assailed by a trick of their enemies upon the Sabbath day, and were willing rather to offer their bodies naked to the sword than to strike back again and break the Sabbath, and so they gave themselves up gladly to death; but when the Maccabees bethought them that the whole nation might thus perish, they avenged the innocent blood of their brethren even upon the Sabbath day when they were provoked to battle, and afterward, when King Antiochus had been stirred up to make war on them by his generals, even Lysias and Nicanor and Gorgias, he and his Eastern and Assyrian forces were so crushed that forty and eight thousand were laid low on the field by three thousand.

        What was the valour of Judas the Maccabean leader we may judge by the type of one of his men. When Eleazar saw an elephant bigger than the rest, and adorned with the King's harness, he thought that the King was riding thereon, and he threw himself into the midst of the enemy, and cast away his shield and slew on either hand until he was come to the beast, and ran underneath it, and killed it with his sword, and so the beast fell upon Eleazar and crushed him, and he died. What valour was here! To begin with, he feared not to die, and when the enemy surrounded him he cast himself into the midst of their ranks, pierced their column, and becoming all the fiercer through his mockery of death, he threw away his shield and upheld with both hands the huge bulk of the wounded monster beneath which he had gone the better to spite it, so that when he died with it he might well have been said not so much to be crushed as to be swallowed up in victory.
      responsory: |-
        R. Be ye not afraid of the assault of the enemy; remember how our fathers were delivered. * Now, therefore, let us cry unto heaven, and our God will have mercy upon us.
        V. Remember His marvellous works that He hath done unto Pharaoh and his host in the Red Sea.
        R. Now, therefore, let us cry unto heaven, and our God will have mercy upon us.
      status: verified
