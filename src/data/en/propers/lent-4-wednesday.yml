collect:
  text: |
    Let us pray.
    O God, Who by mean of fasting dost give unto the righteous the reward of their good works, and unto sinners pardon; have mercy upon us, we beseech thee, and grant that we, humbly confessing our guiltiness, may so be enabled to obtain thy forgiveness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    Let thy merciful ears, O Lord, be open unto the prayers of all them that entreat thee, and that Thou mayest grant us ever such things as we ask, teach us ever to ask such things as are pleasing in thy sight.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'Rabbi, who did sin, this man, or his parents, * that he was born blind? Jesus answered, and said: Neither hath this man sinned, nor his parents; but that the works of God shall be made manifest in him.'
  status: verified

magnificat-antiphon:
  text: The Man that is called Jesus * made clay of His Spittle, and anointed mine eyes, and now I do see.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: John 9:1-38
      text: At that time, Jesus, passing by, saw a man blind from birth. And His disciples asked Him, "Rabbi, who has sinned, this man or his parents, that he should be born blind?" Jesus answered, "Neither has this man sinned, nor his parents, but the works of God were to be made manifest in him. I must do the works of Him Who sent Me while it is day; night is coming, when no one can work. As long as I am in the world I am the light of the world." When He had said these things, He spat on the ground and made clay with the spittle, and spread the clay over his eyes, and said to him, "Go, wash in the pool of Siloe" - which is interpreted 'Sent'. - So he went away, and washed, and returned seeing. The neighbors therefore and they who were wont to see him before as a beggar, began saying, "Is not this he who used to sit and beg?" Some said, "It is he." But others said, "By no means, he only resembles him." Yet the man declared, "I am he." They therefore said to him, "How were your eyes opened?" He answered, "The man who is called Jesus made clay and anointed my eyes, and said to me, 'Go to the pool of Siloe and wash.' And I went and washed, and I see." And they said to him, "Where is He?" He said, "I do not know." They took him who had been blind to the Pharisees. Now it was a Sabbath on which Jesus made the clay and opened his eyes. Again, therefore, the Pharisees asked him how he received his sight. But he said to them, "He put clay upon my eyes, and I washed, and I see." Therefore some of the Pharisees said, "This man is not from God, for He does not keep the Sabbath." But others said, "How can a man who is a sinner work these signs?" And there was a division among them. Again therefore they said to the blind man, "What do you say of Him Who opened your eyes?" But he said, "He is a prophet." The Jews therefore did not believe of him that he had been blind and had got his sight, until they called the parents of the one who had gained his sight, and questioned them, saying, "Is this your son, of whom you say that he was born blind? How then does he now see?" His parents answered them and said, "We know that this is our son, and that he was born blind; but how he now sees we do not know, or who opened his eyes we ourselves do not know. Ask him; he is of age, let him speak for himself." These things his parents said because they feared the Jews. For already the Jews had agreed that if anyone were to confess Him to be the Christ, he should be put out of the synagogue. This is why his parents said, "He is of age; question him." They therefore called a second time the man who had been blind, and said to him, "Give glory to God! We ourselves know that this man is a sinner." He therefore said, "Whether He is a sinner, I do not know. One thing I do know, that whereas I was blind, now I see." They therefore said to him, "What did He do to you? How did He open your eyes?" He answered them, "I have told you already, and you have heard. Why would you hear again? Would you also become His disciples?" They heaped abuse on him therefore, and said, "You are His disciple, but we are disciples of Moses. We know that God spoke to Moses; but as for this man, we do not know where He is from." In answer the man said to them, "Why, herein is the marvel, that you do not know where He is from, and yet He opened my eyes. Now we know that God does not hear sinners; but if anyone is a worshipper of God, and does His will, him He hears. Not from the beginning of the world has it been heard that anyone opened the eyes of a man born blind. If this man were not from God, He could do nothing." They answered and said to him, "You were altogether born in sins, and do you teach us?" And they turned him out. Jesus heard that they had cast him out, and when He had found him, said to him, "Do you believe in the Son of God?" He answered and said, "Who is He, Lord, that I may believe in Him?" And Jesus said to him, "You have both seen Him, and He it is Who speaks with you." And he said, "I believe, Lord." (Kneel.) And falling down, he worshipped Him.
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, 44th Tract on John
      text: |-
        Dread and wondrous are all the things which our Lord Jesus Christ did, both His works and His words; the works, because He wrought them; the words, because they are deep. If, therefore, we consider the meaning of this work of His, we see that that man which was blind from his birth was a figure of mankind. This spiritual blindness was the consequence of the sin of the first man, from whom we all inherit by birth, not death only, but depravity also. For if blindness be unbelief, and faith, light, whom, when Christ came, did He find faithful? Nay, the Apostle who had himself been born of the race of which the Prophets came, saith: We also were by nature children of wrath, even as others. And if children of wrath, then children also of vengeance, children of damnation, children of hell. And wherefore so by nature, unless it were that the sin of the first man had made all his descendants to be born in sin, in that they partook of his nature? If, then, our nature bring sin with it, all men, according to the spirit, are born blind.

        The Lord came; and what did He? He set before us a great mystery. Jesus spat on the ground, and made clay of the Spittle — for the Word was made flesh. And He anointed the eyes of the blind man with the clay; but yet that man saw not. He was anointed, indeed, but yet still he saw not. And He said unto him: Go, wash in the Pool of Siloam. Now, it was the duty of the Evangelist to impress upon us the name of this Pool, and therefore he saith Siloam, which is, by interpretation, Sent. Ye, my brethren, know Who is signified where it is written. Yea, He it is, Who, if He had not been sent, we had never been loosed out of the prison-house of sin. The blind man went his way therefore, and washed his eyes in that Pool, which is, by interpretation, Sent; in other words, he was baptized in Christ. When, therefore, he had figuratively been baptized in Him Whom the Father hath Sent into the world, he came seeing. When he was anointed, he was perchance made a figure of a Catechumen.

        We have heard this great mystery. Ask of a man: Art thou a Christian? He answereth thee: I am not. Then, if thou ask him: Art thou a pagan then, or a Jew? And he still saith unto thee Nay; and thou say: Art thou then a Catechumen, though not yet one of the faithful? and he saith Yea, a Catechumen; then there thou seest a man anointed, but not yet washed. With what hath he been anointed? Ask of him, and he will tell thee. Ask of him in Whom he believeth, and, being a Catechumen, he will say: In Christ. But, behold, I speak before both Faithful and Catechumens. What said I touching the Spittle and the clay? I said: for 'the Word was made flesh.' This the Catechumens hear, but it is not enough for them to be anointed; they must make haste to the washing, if they would have their eyes opened.
      responsory: |-
        R. After that the Lord had looked upon him, the face of Moses shone. * And when the elders saw that his face shone, they marvelled and were sore afraid.
        V. And when he came down from Mount Sinai with the two tables of testimony in his hand, he wist not that his face shone, because that God had spoken with him.
        R. And when the elders saw that his face shone, they marvelled and were sore afraid.
      status: verified
