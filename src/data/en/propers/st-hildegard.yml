collect:
  text: |
    Let us pray.
    O God, who didst adorn blessed Hildegard, thy Virgin, with heavenly gifts: grant, we
    beseech thee, that, following in her footsteps and her teachings, we may deserve to pass
    from the darkness of this present age unto thy delightful light.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. O most worthy spouse of Christ! * whom the light of prophecy illumined, apostolic zeal inflamed, and the fire of divine love perfected.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, who didst adorn blessed Hildegard, thy Virgin, with heavenly gifts: grant, we beseech thee, that, following in her footsteps and her teachings, we may deserve to pass from the darkness of this present age unto thy delightful light.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

vespers-hymn:
  text: |
    Hail, thou our glory,
    pattern of virgins!
    Graciously hear us, thy suppliants,
    who sing thee this canticle.

    O wondrous virgin, who didst live
    a victim of love,
    and art now blessed with shining splendours,
    received into the seats of heaven.

    Guide thy clients
    over the troubled sea of life,
    and win for us the Friend
    to whom grace hath bound thee.

    As thou didst fearlessly overcome
    the snares and wiles of the enemy,
    and, taking strength in the hour of peril,
    didst shine the fairer:

    So grant us, by thy favour,
    to scatter the wars that beset us,
    and with serene countenance to run
    the path of kindly virtue.

    May heavenly charity nourish
    the faith laid up in our minds;
    may undefiled chastity
    adorn our golden ways.

    To the Father most high and to the Son,
    and to thee, O Holy Spirit,
    be praise, power and glory
    through everlasting ages. Amen.
  status: draft

benedictus-antiphon:
  text: O most worthy spouse of Christ! * whom the light of prophecy illumined, apostolic zeal inflamed, and the fire of divine love perfected.
  status: draft

magnificat-antiphon:
  text: Come to our aid, Hildegard, most holy virgin, spouse of the eternal King, in whose court thou shinest like a most radiant star.
  status: draft

magnificat-antiphon/~-first:
  text: Hildegard the prophetess, * illumined by the splendours of the Holy Spirit, revealed the ways of the Lord.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Hildegard was born in the Lower Palatinate, of a father Hildebert and a mother Mechtild, both conspicuous for nobility of birth and fame of piety. While still of tender age she was already enlightened from above by wonderful visions; and, despising the delights of this world, at the age of eight she withdrew to Christ, under the rule of her kinswoman Jutta, a most holy abbess, to be shut up with her on the mount of St. Disibod. Having then professed the monastic life, she soon became known by wonderful signs of divine grace. Almost continually racked by most acute illnesses, she so showed to all an example of patience that her whole life, nailed with Christ to the cross, was a kind of image of long-drawn martyrdom. When blessed Jutta was taken from the living, Hildegard, though unwilling, was put in her place. In which office she took counsel with the utmost love and foresight for all the needs of the sisters, above all for those who in any way laboured under trouble of conscience. When, however, her monastery was no longer sufficient to hold so great a number of nuns, she set out with very many of them to another mountain, called after St. Rupert, and there established her abbatial seat. At about forty years of age, wonderfully enlightened by a fiery whirlwind and a prodigious light fallen from heaven, she received, by a singular benefit of God, the gift of understanding and expounding the sacred Scriptures. Likewise, when a voice sent to her from on high bade her diligently commit to writing whatever she should deserve henceforth to see and hear, and she refused, she was compelled by the Godhead. Having therefore begun to write, she earned the eternal gratitude of all posterity: for she composed books of rare excellence and plainly heavenly, from which she is known to have been taught by the Holy Spirit.

        Filled with the spirit of prophecy, to the many who flocked to her from divers and most distant regions she foretold things altogether marvellous, and beheld their thoughts and the hidden secrets of their hearts; some, too, who came to her with a perverse or fraudulent mind she rebuked, and these, being corrected and amended, were forthwith brought back to a sounder mind. No one ever came to her who, instructed by her wholesome counsel, did not depart with the resolve of a better life. Meanwhile, often impelled by the divine Spirit, and burning with apostolic zeal, she went to Cologne, Trier, Metz, Würzburg, Bamberg and many other places far apart, and most boldly proclaimed what had been divinely revealed to her, at God's command. Heretics she refuted and put to rout, by word and writing, with astonishing authority and grace: above all the most pestilent heresy of the Cathars, which then had its supporters in some provinces of Germany, and the reviving error of Berengarius, did that most holy woman baffle and convict in a most learned book. The mellifluous Doctor of the Church, St. Bernard, thought so highly of her, and followed her divine writings with such veneration, that, chiefly by his agency, they were vindicated from the detractions of their adversaries, and were even confirmed by public sentence of the Supreme Pontiff Eugenius III, in the Council of Trier, in the presence of cardinals and many bishops.

        Finally, by unceasing labours and by the example of a most holy life, she took counsel for the whole Church in a wonderful manner; so that Eugenius III and the three Roman Pontiffs who followed, not a few bishops, emperors, and other highest princes of France, Germany and Italy, and all the holiest and most learned men, in every gravest matter, sought her counsel, and commended to her prayers the Roman Church, the Empire, their own province and themselves. At last, after countless signs of virtue and of divinely infused knowledge, renowned for the grace of heavenly revelations and miracles, in the eighty-second year of her age, having foretold the hour of her death, which God had made known to her, she passed to the Bridegroom on the fifteenth day before the Kalends of October, in the year of the Lord 1179: rightly and deservedly called the great wonder of her sex, indeed the wonder of Germany, of the Order of St. Benedict and of the Church, and the oracle of the whole world. Her sacred body, laid first in the church of St. Rupert near Bingen, then carried off to Cologne in the Thirty Years' War, was at last translated to the church of the monastery of Eibingen which she had founded, where in the year of salvation 1857 it was solemnly recognised, and is honoured with the highest veneration of the faithful.
      responsory: |-
        R. Heavenly spirits appeared, who invited Hildegard to the marriage of the Lamb, saying: * Come, lady, for the delights of heaven await thee.
        V. Come from Lebanon, my spouse; come from Lebanon; come, thou shalt be crowned.
        R. Come, lady, for the delights of heaven await thee.
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Augustine, On Holy Virginity, chs. 25, 29, 30
      text: |-
        Go on, therefore, holy ones of God, boys and girls, men and women, unmarried and married; go on, persevering to the end. Praise the Lord the more sweetly, the more fully ye think of him; hope the more happily, the more earnestly ye serve him; love the more ardently, the more attentively ye please him. With loins girded and lamps burning, wait for the Lord, when he shall return from the wedding. Ye shall bring to the wedding of the Lamb a new canticle, which ye shall sing upon your harps, such as no one shall be able to say but you. For so did one see you in the Apocalypse, he who was beloved of the Lamb beyond the rest, who was wont to lie upon his breast, and had drunk in, and poured forth, wonders concerning the heavenly Word of God. Follow the Lamb, holding fast with perseverance what ye have willed; ardently, and quietly while ye can, lest the good of virginity perish from you, when ye can do nothing to bring it back. The rest of the multitude of the faithful, who cannot follow the Lamb so far, will see you; they will see, and will not envy, and, rejoicing with you for what they have not in themselves, they will have it in you.

        Presume, therefore, trust, be strengthened, abide, ye who vow, and render to the Lord your God, vows of perpetual continence, not for the sake of the present world, but for the kingdom of heaven. Ye also who have not yet so vowed, who can take it, take it; run perseveringly, that ye may lay hold. Take each his own offerings, and enter into the courts of the Lord, not of necessity, but having power over your own will. Think on whatever that may be: "In his wall a named place, much better than that of sons and daughters." Think on the eternal name there. Who shall explain what that name shall be? Whatever it shall be, it shall be eternal. By believing and hoping and loving this, ye have been able not to shun lawful marriage, which was forbidden to none, but to fly beyond what was permitted.
      responsory: |-
        R. O noble spouse of Christ! O venerable mother! intercede for us with the Lord, the King of Angels, whom thou didst ever love with a pure heart, in whose embrace thou dwellest without end: * That he may forgive us all that we have sinned against him.
        V. Granting us the fervour of his most holy love, and after this exile a dwelling in the heavenly home.
        R. That he may forgive us all that we have sinned against him.
      status: draft
