nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Lucius, a Roman, the son of Porphyrius, held the episcopate of the Roman Church after the consummation of holy Cornelius. He ordained that two priests and three deacons, for the sake of ecclesiastical testimony, should not abandon the bishop in any place. And, full of the Spirit of God (as holy Cyprian wrote), he made known by his letters that peace must be given to the lapsed, and that, once penance has been done, the fruit of communion is not to be denied. Banished for the faith of Christ, and afterwards permitted to return safe to his own Church, at last, having first delivered all the Church's property to his archdeacon Stephen, he was beheaded on the fourth day before the Nones of March, in the principate of Gallus and Volusian. He held two ordinations in the month of December, in which he created four priests and seven bishops for various places. His body was first buried on the Appian Way near St. Sixtus, in the cemetery of Callistus, and afterwards by Pope Paschal was translated to the title of St. Cecilia, together with the bodies of that same virgin and her companions, and there was placed under the holy altar.
      status: draft
