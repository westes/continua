collect:
  text: |
    Let us pray.
    Graciously pour forth Your grace into our hearts, we beseech You, O Lord, that, keeping our sinful inclinations under control by self-denial, we may suffer for a brief while rather than be condemned to everlasting punishment.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

prime-lectio:
  text: 'He was taken away from distress, and from judgment: who shall declare his generation? because he is cut oh out of the land of the living: for the wickedness of my people have I struck him.'
  citation: Isa 53:8
  status: verified

benedictus-antiphon:
  text: Now the Jews' Feastday * was at hand, and the chief Priests sought how they might kill Jesus; but they feared the people.
  status: verified

magnificat-antiphon:
  text: 'The chief Priests * consulted that they might kill Jesus, but they said: Not on the Feast-day, lest there be an uproar among the people.'
  status: verified
