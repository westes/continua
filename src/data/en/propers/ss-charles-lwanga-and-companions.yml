collect:
  text: |
    Let us pray.
    Almighty and merciful God, who dost enlighten the whole world with the light of truth, and
    who through thy glorious Martyrs Matthias, Charles, and their Companions didst vouchsafe to
    renew the wonders of the faith in the lands of Africa: grant to thy suppliants that, by
    their intercession, thou wouldst preserve in us the gifts of thy grace, and that among all
    nations the people who serve thee may increase in merit and in number.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of
    the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    Almighty and merciful God, who dost enlighten the whole world with the light of truth, and who through thy glorious Martyrs Matthias, Charles, and their Companions didst vouchsafe to renew the wonders of the faith in the lands of Africa: grant to thy suppliants that, by their intercession, thou wouldst preserve in us the gifts of thy grace, and that among all nations the people who serve thee may increase in merit and in number.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft
