collect:
  text: |
    Let us pray.
    O Lord Jesus Christ, who in the garden didst teach us by word and example to pray, that we may overcome the dangers of temptation: mercifully grant that, ever intent upon prayer, we may deserve to obtain its abundant fruit:
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    Behold how the Word of the Father,
    from the heavenly seats, merciful and burning with love,
    goes forth to heal the offspring of Adam
    lost by guilt.

    Pitying the world's lamentable ruin,
    and wishing to repair our falls,
    he prays, and with brow bowed down
    the Master begs pardon.

    He wavers, turning over so many bitter things:
    This chalice of sorrow, he says in supplication,
    my Father, take away; but thy will,
    not mine, be done.

    While sad dread presses the depths of his heart,
    the Lord faints, languishing; through his limbs
    a sweat of blood flows, and with drops
    the earth is wetted.

    But swiftly an Angel, coming from highest heaven,
    refreshes the prostrate Jesus:
    strength returns to his body, and with new
    vigour he rises.

    Praise and honour to the Father and to the begotten Son,
    to whom was given the name above every name,
    and to the Paraclete glory and power,
    through all ages. Amen.
  status: draft

matins-invitatory:
  text: Christ Jesus praying on the Mount of Olives, * O come, let us adore.
  status: draft

lauds-capitulum:
  text: 'Jesus cometh to his disciples, and findeth them asleep, and saith to Peter: What, could you not watch one hour with me? Watch ye, and pray that ye enter not into temptation.'
  citation: Matthew 26:40-41
  status: draft

lauds-hymn:
  text: |
    The Mediator has come from high heaven,
    whom the holy prophets long ago sang:
    spare thy grief and thy bitter tears,
    daughter of Sion.

    The old garden brought death, whence
    guilt came forth: this new garden brings life,
    behold, where by night Jesus
    remains praying.

    He appeases the avenging wrath of the Father:
    with strong right hand he checks the thunderbolts
    about to be hurled: the Redeemer of his own will
    goes to meet the crime to be expiated.

    So shall he crush the hard snares of hell,
    and unlock the court long shut,
    calling us back to the blessed joys
    of the eternal kingdom.

    Praise and honour to the Father and to the begotten Son,
    to whom was given the name above every name,
    and to the Paraclete glory and power,
    through all ages. Amen.
  status: draft

lauds-versicle:
  text: |
    V. Teach us to pray.
    R. Thus therefore shall you pray.
  status: draft

prime-lectio:
  text: Pray for them that persecute and calumniate you, that you may be the children of your Father who is in heaven.
  citation: Matthew 5:44-45
  status: draft

terce-capitulum:
  text: |
    Jesus cometh to his disciples, and findeth them asleep, and saith to Peter: What, could you not watch one hour with me? Watch ye, and pray that ye enter not into temptation.
    R. Thanks be to God.
    V. My Father, if it be possible.
    R. Let this chalice pass from me.
  citation: Matthew 26:40-41
  status: draft

sext-capitulum:
  text: |
    Watch ye, therefore, praying at all times, that you may be accounted worthy to escape all these things that are to come, and to stand before the Son of man.
    R. Thanks be to God.
    V. Watch and pray.
    R. That ye enter not into temptation.
  citation: Luke 21:36
  status: draft

none-capitulum:
  text: |
    Pray for them that persecute and calumniate you, that you may be the children of your Father who is in heaven.
    R. Thanks be to God.
    V. His sweat became.
    R. As drops of blood.
  citation: Matthew 5:44-45
  status: draft

