matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 16
        antiphon: Before prayer prepare thy soul, and be not as a man that tempteth God.
      - psalms:
          - 27
        antiphon: Be not hindered from praying always, and be not afraid to be justified even to death.
      - psalms:
          - 141
        antiphon: All things whatsoever you shall ask in prayer, believing, you shall receive.
    versicle:
      v: My soul is sorrowful.
      r: Even unto death.
  nocturn2:
    groups:
      - psalms:
          - 42
        antiphon: When you pray, you shall not be as the hypocrites, that love to stand and pray in the synagogues and corners of the streets, that they may be seen by men.
      - psalms:
          - 63
        antiphon: But thou, when thou shalt pray, enter into thy chamber, and having shut the door, pray to thy Father in secret.
      - psalms:
          - 120
        antiphon: And it came to pass in those days, that he went out into a mountain to pray, and he passed the whole night in the prayer of God.
    versicle:
      v: My Father, if it be possible.
      r: Let this chalice pass from me.
  nocturn3:
    groups:
      - psalms:
          - 3
        antiphon: Trouble and anguish have found me; thy commandments are my meditation.
      - psalms:
          - 12
        antiphon: I looked for one that would grieve together with me, and there was none; and for one that would comfort me, and I found none.
      - psalms:
          - 87
        antiphon: 'My soul hath cleaved to the pavement: quicken thou me according to thy word.'
    versicle:
      v: Watch and pray.
      r: That ye enter not into temptation.

lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: 'Jesus came * with his disciples into a country place which is called Gethsemani, and he said to them: Sit you here, till I go yonder and pray.'
    - psalms:
        - 99
      antiphon: And taking with him Peter * and the two sons of Zebedee, he began to grow sorrowful and to be sad.
    - psalms:
        - 62
      antiphon: 'Then he saith to them: * My soul is sorrowful even unto death: stay you here, and watch with me.'
  canticle:
    id: canticum-trium-puerorum
    antiphon: 'And going a little further, * he fell upon his face, praying, and saying: My Father, if it be possible, let this chalice pass from me.'
  laudate:
    antiphon: My Father, * if this chalice may not pass away, but I must drink it, thy will be done.

