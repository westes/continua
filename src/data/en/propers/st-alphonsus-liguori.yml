nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Alphonsus Mary de Liguori was born at Naples of noble parents, and from his earliest years gave no uncertain signs of the sanctity that was to come. While he was still an infant, his parents brought him to be blessed by St. Francis Jerome of the Society of Jesus, who, having prayed over him, declared that he would live to be ninety years old, would be raised to the dignity of the episcopate, and would be of the greatest benefit to the Church. Even as a boy he shrank from games, and by word and example formed noble youths to Christian modesty. As a young man he enrolled himself among pious confraternities, and delighted to wait upon the sick in the public hospitals, to give himself continually to prayer in the churches, and to frequent the sacred mysteries. He joined devotion to his studies so well that, scarcely sixteen years old, he obtained the doctorate in both laws at the university of his own city. In obedience to his father he took up the practice of law, and though he won great praise in that calling, having learned by experience the perils of the courts, he freely gave up that way of life. Rejecting, therefore, the brilliant marriage his father had proposed for him, and renouncing his hereditary birthright, he hung up his sword before the altar of Our Lady of Mercy and gave himself over to the divine ministry. Having been made a priest, he threw himself against vice with such zeal that, exercising the apostolic office and travelling here and there, he brought about the conversion of great numbers of lost souls. Taking pity especially on the poor and on country folk, he founded the Congregation of Priests of the Most Holy Redeemer, who, following the Redeemer himself, should preach the Gospel to the poor through the fields, villages, and hamlets.

        That he might never turn aside from his purpose, he bound himself by a perpetual vow to waste no time. Burning thus with zeal for souls, he labored, both by the preaching of God's word and by writings full of sacred learning and piety, to win souls to Christ and lead them to a more perfect life. It is wonderful how much hatred he extinguished, and how many wanderers he called back to the right way of salvation. A devoted client of the Mother of God, he published a book in her praise, and while preaching fervently about her, he was seen more than once, before the whole assembled people, with his whole countenance shining with a wondrous brightness cast upon him from an image of the Virgin, and caught up in ecstasy. An assiduous contemplator of the Lord's Passion and of the Holy Eucharist, he wonderfully spread devotion to them. Whenever he prayed at the altar or offered the Holy Sacrifice, which he never omitted, such was the vehemence of his love that he would melt away in seraphic ardor, or be shaken with unwonted movements, or be caught away from his senses. He joined to a wonderful innocence of life, which no mortal sin ever stained, an equal penance, chastising his body with fasting, with iron chains, with hairshirts, and with bloody scourging. Amid all this he became renowned for the gifts of prophecy, of reading hearts, of bilocation, and of miracles.

        He shrank with unwavering constancy from every ecclesiastical dignity offered him; yet, compelled by the authority of Pope Clement XIII, he took up the governance of the church of Sant'Agata dei Goti. As bishop he changed only his outward habit, not his austere manner of life. The same frugality, the same supreme zeal for Christian discipline, the same effort spent in restraining vice and warding off error, and the same diligence in fulfilling every other pastoral duty, remained with him. Generous to the poor, he distributed to them all the revenues of the church, and when famine pressed hard, he gave away even his own household furnishings to feed the starving. Having become all things to all men, he brought the nuns of his diocese to a more perfect manner of life, and saw to the founding of a monastery for the sisters of his own congregation. When he was released from his bishopric because of serious and chronic illnesses, he returned, poor as he was, to the disciples from whom he had departed poor. At last, though broken in body by old age, by labors, and by long-standing arthritis and other most grievous illnesses, yet ever more eager in spirit, he never ceased to discourse or to write of heavenly things, until, in his ninetieth year, on the first of August in the year 1787, at Nocera de' Pagani, amid the tears of his own disciples, he most peacefully breathed his last. Pope Pius VII, in the year 1816, enrolled him, already renowned for virtues and miracles, among the Blessed; and Pope Gregory XVI, on the feast of the Most Holy Trinity in the year 1839, solemnly placed him, resplendent with new signs, in the roll of the Saints. At length Pope Pius IX, on the advice of the Congregation of Sacred Rites, declared him a Doctor of the Universal Church.
      status: verified
