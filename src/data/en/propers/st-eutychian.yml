nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Eutychian, a Tuscan by race and a native of Luni, the son of Marinus, took up the episcopate of the Roman Church after the priesthood of blessed Felix. He ordained that fruits, beans and grapes be blessed upon the altar; and likewise that no martyr be buried by the faithful without a dalmatic or a purple colobium. When in various places he had buried with his own hand three hundred and sixty-two martyrs, he was himself joined with them, and was crowned with martyrdom under the Emperor Numerian on the sixth day before the Ides of December, and was buried in the cemetery of Callistus on the Appian Way. In five ordinations in the month of December he created fourteen Priests, five Deacons, and nine Bishops for various places. He lived in the pontificate eight years, five months, and some days.
      status: draft
