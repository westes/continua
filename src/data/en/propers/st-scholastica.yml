magnificat-antiphon:
  text: 'Hódie * sacra virgo Scholástica in spécie colúmbæ, ad ǽthera tota festíva perréxit: hódie cœlestis vitæ gáudiis cum fratre suo pérfrui merétur in sempitérnum.'
  status: verified

magnificat-antiphon/~-first:
  text: Exsúltet ómnium * turba fidélium pro glória vírginis almæ Scholásticæ; læténtur præcípue catérvæ vírginum, celebrántes ejus solemnitátem, quæ fundens lácrymas, Dóminum rogávit, et ab eo plus pótuit, quia plus amávit.
  status: verified

