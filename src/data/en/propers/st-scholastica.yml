collect:
  text: |
    Let us pray.
    O God, Who, to show the way of the undefiled, wast pleased that the soul of thy blessed Virgin Scholastica should fly to heaven in a bodily shape, like a dove, mercifully grant unto us thy servants, for her sake, and at her petition, worthily to attain unto thine everlasting joy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. O how glorious are the merits of blessed Scholastica! O how great the power of her tears, by which the renowned Virgin turned a clear sky into a flooding rain.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Who, to show the way of the undefiled, wast pleased that the soul of thy blessed Virgin Scholastica should fly to heaven in a bodily shape, like a dove, mercifully grant unto us thy servants, for her sake, and at her petition, worthily to attain unto thine everlasting joy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

lauds-capitulum:
  text: 'Arise, my love, my beautiful one, and come: my dove, in the clefts of the rock, in the hollow places of the wall, shew me thy face, let thy voice sound in my ears; for thy voice is sweet, and thy face comely.'
  citation: Cant 2:13-14
  status: draft

lauds-hymn:
  text: |
    Now the shadows of night fall away,
    and the longed-for day is born,
    on which the everlasting Bridegroom
    is joined to the virgin Scholastica.

    The gloom of winter withdraws,
    the rain-clouds are put to flight,
    and the fields bloom
    with the stars' eternal flowers.

    The author of love calls her forth;
    the beloved one puts on wings;
    ardent for the kisses of his mouth,
    the swift dove flies away.

    How beautiful is thy going forth,
    O dear daughter of the Prince!
    The Abbot of Nursia beholds it,
    and renders thanks to the Godhead.

    Embracing the right hand of the Bridegroom,
    she reaps the crowns that are her due,
    immersed in streams of glory,
    and drinking deep of the joys of God.

    Thee, O Christ, flower of the valleys,
    and the Father with the Paraclete,
    may every age adore,
    through all the corners of the world. Amen.
  status: draft

lauds-responsory:
  text: |
    R.br. In thy comeliness * and in thy beauty.
    R. In thy comeliness * and in thy beauty.
    V. Go forward, fare prosperously, and reign.
    R. In thy beauty.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. In thy comeliness * and in thy beauty.
  status: verified

lauds-versicle:
  text: |-
    V. Behold, thou art fair, my love.
    R. Behold, thou art fair; thy eyes are doves' eyes.
  status: draft

