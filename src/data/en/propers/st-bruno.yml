collect:
  text: |
    Let us pray.
    May we be aided by the intercession of St. Bruno, thy Confessor, we
    beseech thee, O Lord; that we, who have grievously offended thy
    Majesty by sin, may, by his merits and prayers, obtain forgiveness for
    our offenses.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
