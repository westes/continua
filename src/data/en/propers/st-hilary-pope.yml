nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Hilarus, a Sardinian by race, begotten of his father Crispinus, became Pontiff of the Roman Church after the passing of holy Leo. While still a deacon, the same Leo had sent him as legate for the celebration of the Synod of Ephesus. But when unworthy deeds were perpetrated at Ephesus through the fury and violence and fear of Dioscorus, bishop of Alexandria, Hilarus, scarcely escaping by pathless places and many perils, delivered by divine help, returned to Leo. Proclaimed Pontiff, he held nothing more ancient than to confirm by his own decree what had been established against the heretics. Wherefore he wrote an encyclical letter on the condemnation of Nestorius and Eutyches, and on the confirmation of the three principal councils.

        Invited by him, Victorinus, an Aquitanian by race, composed the Paschal cycle with most careful investigation. Most retentive of ecclesiastical discipline, he willed that no bishop be consecrated for the churches without the metropolitan's consent, nor any bishop be transferred from his own church to another, nor the boundaries set by the Fathers be crossed. He appointed Leontius, bishop of Arles, his vicar through the Gauls, to whom he delegated the care of assembling the bishops every year. He forbade the lands of the Church, which were neither deserted nor useless, and from which the needs of very many were relieved, to be alienated unless the reason for the alienation had first been stated before a Council; and he holily decreed several other things in the synod which he assembled at St. Mary Major.

        When Philotheus the Macedonian, supported by the familiarity of the Emperor Anthemius, was trying to bring into the City new conventicles of various sects, he restrained him by openly rebuking him at the tomb of blessed Peter the Apostle, so that the emperor promised, with an oath interposed, that they should not be introduced. He made in the baptistery of the Constantinian basilica four oratories, namely of the Holy Cross, of St. John the Baptist, of St. John the Evangelist, and of St. Stephen, and in addition two libraries. He built a monastery with a bath and a praetorium at St. Lawrence outside the walls, and another in the City at the Moon. Many other magnificent ornaments also of gold, silver, and precious stones he bestowed on sacred places. He appointed in the City ministers to attend the appointed stations. For the common concord of the priests of the Lord he carefully took care that they should not dare to seek their own things, but strive to obtain what were Christ's. At last, released from the body, he went to heaven to reign with Christ, on the fourth day before the Ides of September, under the emperors Leo and Anthemius; and his body was buried at St. Lawrence in the crypt beside the body of blessed Sixtus. In one ordination in the month of December he created twenty-five priests, six deacons, and twenty-two bishops for various places. He held the government of the Apostolic See six years, nine months, and twenty-eight days.
      status: draft
