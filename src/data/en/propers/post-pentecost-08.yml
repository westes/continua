collect:
  text: |
    Let us pray.
    Grant to us, Lord, we beseech thee, the spirit to think and do always such things as be rightful, that we, who cannot do anything that is good without thee, may by thee be enabled to live according to thy will.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'The lord said unto his steward: * How is it that I hear this of thee? Give an account of thy stewardship. Alleluia.'
  status: verified

magnificat-antiphon:
  text: What shall I do? * For my lord taketh away from me the stewardship. I cannot dig, to beg I am ashamed. I am resolved what to do, that, when I am put out of the stewardship, they may receive me into their houses.
  status: verified

magnificat-antiphon/~-first:
  text: O Lord, Thou hast hearkened unto the prayer of thy servant, * that I might build a temple unto thy Name.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, City of God, Book 17, ch. 8
      text: |-
        Things which were then still to come were in a certain manner imagined in Solomon, who built the temple, who had that peace which his name implieth (for the name Solomon signifieth "the Peaceful One") and who, at the beginning of his reign, was marvellously praiseworthy. By these things he foreshadowed in his own person, though he set not forth with his mouth, our Lord Christ. Thus are some things written of Solomon which are, as it were, things written concerning Christ, the Holy Scripture in this way, by giving the history of things past, prophesying all the while of things to come.

        Nor besides the books of the Divine history wherein his reign is recorded, the 71st Psalm is superscribed with his name. In this Psalm are many things which cannot suit him, but are most clearly applicable to the Lord Christ, thus showing that Solomon was, as it were, a shadowy figure cast before, of that which was afterwards revealed in very truth in the Person of Christ.

        Without going into the rest, I may say that it is known what were the limits of Solomon's dominions, and yet in that Psalm we read: "He shall have dominion also from sea to sea, and from the river unto the ends of the earth." This we see fulfilled in Christ. It was from the river, that is, from His Baptism by John in Jordan, that He began His assumption of dominion, for then it was when John bare testimony unto Him that His disciples began to acknowledge Him, calling Him, not Master only, but Lord.
      responsory: |-
        R. Saul hath slain his thousands, and David his ten thousands. * Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
        V. Is not this David? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, and David his ten thousands?
        R. Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 16:1-9
      text: 'At that time, Jesus spoke to His disciples this parable: There was a certain rich man who had a steward, who was reported to him as squandering his possessions. And he called him and said to him, ‘What is this that I hear of you? Make an accounting of your stewardship, for you can be steward no longer.’ And the steward said within himself, ‘What shall I do, seeing that my master is taking away the stewardship from me? To dig I am not able; to beg I am ashamed. I know what I shall do, that when I am removed from my stewardship they may receive me into their houses.’ And he summoned each of his master’s debtors and said to the first, ‘How much do you owe my master?’ And he said, ‘A hundred jars of oil.’ He said to him, ‘Take your bond and sit down at once and write fifty.’ Then he said to another, ‘How much do you owe?’ He said, ‘A hundred kors of wheat.’ He said to him, ‘Take your bond and write eighty.’ And the master commended the unjust steward, in that he had acted prudently; for the children of this world, in relation to their own generation, are more prudent than the children of the light. And I say to you, make friends for yourselves with the mammon of wickedness, so that when you fail they may receive you into the everlasting dwellings.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Letter 151 to Algasia
      text: |-
        The lord commended the unjust steward, because he had done wisely though wickedly. The lord, although himself defrauded by it, could not but praise the shrewdness of his dishonest servant, because he had cheated him with profit to himself. How much more will our Master Christ, Who is above any defrauding by us, and is Himself the Great Forgiver, praise us if we win a blessing from Him by dealing indulgently with those who are to believe in Him?

        After this parable the Lord saith: "Make to yourselves friends of the mammon of unrighteousness." This word "mammon" is a Syriac, not an Hebrew, word, signifying ill-gotten gains. If then even ill-gotten gains can be so used by such as have them as to profit them, how much more can they who, like the Apostles, are "stewards of the mysteries of God" (1 Cor. iv. 1), those true and blameless riches, how much more can they profit themselves, even everlastingly, by their right use of them?

        Therefore it is immediately written: "He that is faithful in that which is least," that is to say, in bodily things, "is faithful also in much," that is to say, in spiritual things. "And he that is unjust in the least," that is to say, by not giving to his needy brother succour of those things which are needful for the body, and which God hath made for all men, such an one is unjust also in much, that is to say, he will deal out spiritual things unfairly, this to one and that to another, and not according to their true spiritual needs. "If therefore," saith the Lord, "ye have not been faithful in the use of earthly riches which pass away, who will commit to your trust the true and abiding riches," that is, the spiritual riches of the word of God?
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
