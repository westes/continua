nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. John Chrysostom, Homily 84 on John, ch. 19
      text: |-
        Wouldest thou hear the power of the Blood of Christ? Then let us look at the figure thereof, let us call to mind the old type, and tell the story written in the ancient Scriptures. The Egyptians would not let God take away Israel His firstborn, and Moses said: Thus saith the Lord: About midnight will I go out into the midst of Egypt, and all the first-born in the land of Egypt shall die. Then Moses called for all the elders of Israel, and said unto them: Draw out and take you a lamb according to your families and kill the Passover. And ye shall take a bunch of hyssop and dip it in the blood that is in the basin, and strike the lintel and the two side-posts with the blood; and when he seeth the blood upon the lintel and on the two side-posts, the Lord will pass over the door, and will not suffer the destroyer to come in unto your houses to smite you. And could the blood of a sheep save a man? Yea, in good sooth, not because it was blood, but because it represented in a figure the Blood of the Lord.

        The statues of monarchs, mindless and speechless images though they be, have sometimes been an helpful refuge to men endowed with soul and reason, not because they are works of the brazier's skill, but because the likeness they bear is a King's. And just so did this unconscious blood deliver the lives of men, not because it was blood, but because it foreshadowed the shedding of the Blood of Jesus. On that night in Egypt, when the destroying Angel saw the blood upon the lintel and on the two side-posts, he passed over the door, and came not in unto the house. Even so now much more will the destroyer of souls flee away when he seeth, not the lintel and the two side-posts sprinkled with the blood of a lamb, but the mouth of the faithful Christian, the living dwelling of the Holy Ghost, shining with the blood of the True Messiah. If the Angel let the type be, how shall not the enemy quail before the Reality? Wouldest thou hear more of the power of that Blood? I am willing. Consider from what source it welleth, from what fountain it springeth. Its fountain is the Heart of the Lord, pierced for us upon the Cross.

        And so was it done concerning that Lamb: the Jews killed a sheep, and I have learned the value of the sacrament. From the Side flowed forth Blood and Water. I would not, O my hearer, that thou shouldest pass by the depths of such a mystery as this without pausing; for I have yet a mystic and mysterious discourse to deliver. I have said that the Water and Blood shewed forth symbolically baptism and the sacraments. For from these, holy Church was founded by the laver of regeneration, and the renovation of the Holy Ghost. It was therefore out of the Side of Christ that the Church was created, just as it was out of the side of Adam that Eve was raised up to be his bride. This is the reason why Paul saith: We are members of his Body, and of his bones; for even as God made the woman Eve out of the rib which he had taken out of the side of Adam, so hath Christ made the Church out of the Blood and Water which he made to flow for us out of his own Side.

        On the occasion of the nineteenth centenary of the accomplishment of the redemption of mankind, as a fitting celebration of this ineffable blessing, Pope Pius XI decreed an extraordinary Jubilee. During that year the Supreme Pontiff, wishing that the fruits of the Precious Blood of Christ, the Lamb without spot, might redound more abundantly upon mankind and that the minds of the faithful be impressed with more vivid recollections of this same Blood as the price of their redemption, elevated the Feast of the Most Precious Blood of our Lord Jesus Christ to the rank of a double of the first class, to be celebrated as such every year by the universal Church.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 19:30-35
      text: At that time, when Jesus had taken the wine, He said, It is consummated! And bowing His head, He gave up His spirit. The Jews therefore, since it was the Preparation Day, in order that the bodies might not remain upon the cross on the Sabbath, for that Sabbath was a solemn day, besought Pilate that their legs might be broken, and that they might be taken away. The soldiers therefore came and broke the legs of the first, and of the other, who had been crucified with Him. But when they came to Jesus, and saw that He was already dead, they did not break His legs; but one of the soldiers opened His side with a lance, and immediately there came out Blood and water. And he who saw it has borne witness, and his witness is true.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine of Hippo, Tractate 120 on John
      text: |-
        The Evangelist speaketh carefully. He saith not that he smote the Side, nor yet that he wounded It, nor yet anything else, but pierced It, to fling wide the entrance unto life, whence flow the Sacraments of the Church, those Sacraments without which there is no entrance unto the life which is life indeed. That Blood which was shed there was shed for the remission of sins, that Water is the water that mantleth in the cup of salvation. Therein are we washed, and thereof do we drink. Of this was it a type when it was said unto Noah: The door of the ark shalt thou set in the side thereof. This name set forth a great good, before it became associated with the bitter fruit of a great evil. And here we have the Second Adam bowing His Head, and the deep sleep of death falling upon Him upon the Cross, and He sleepeth, that the Lord God may take a thing out of His side, and may make thereof a wife for Him. O what a death was His, which quickeneth the dead! What is cleaner than His Blood? What more health-giving than His wounding?

        Then were being held bondsmen to the devil, slaves to evil spirits. But they have been redeemed from that bondage. They had been able to sell themselves, but they were not able to redeem themselves. A Redeemer came and paid the price for them. He shed His Blood, and at that cost bought the world. Ye ask what He bought? Look what He paid, and ye shall see what He bought. Christ's Blood was the price. What is His Blood worth? What, but the whole world? What, but all men? They are very unthankful for His redemption, or very proud, who say that It is only precious enough to buy the Africans, or that they themselves are so precious that It was shed only for them. Let there be an end to such conceit, an end to such vainglory. What He paid, He paid for all.

        That Blood was his own, and thereby he redeemed us. Yea, it was to this end that he took Flesh and Blood, namely that he might shed his Blood in order to redeem us. If thou wilt accept it, the Blood of thy Lord was given for thee. If thou wilt not accept it, it was not given for thee. For perchance thou sayest: My God had Blood, with which he redeemed me, but now since he hath suffered, he hath given it all; what hath remained to him, that he may also give any of it for me? This is a great thing, because he gave once, and he gave for all. The Blood of Christ is salvation to him that doth accept it, punishment to him that doth not accept it. Why therefore dost thou hesitate to be set free from the second death, thou who dost not wish to die? By this thou art set free, if thou art willing to take up thy Cross, and follow the Lord; for he took up his Cross and sought his servant.
      status: verified

