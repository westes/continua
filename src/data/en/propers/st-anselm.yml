vespers-hymn:
  text: |
    Behold, a bold prelate, a faithful monk,
    the doctor, crowned with laurel, stands here:
    let the festal choir emulate Anselm
    in singing his song.

    Wise before his years were ripe,
    he shrinks from the flower of the passing world;
    and seeking the teaching of Lanfranc,
    he enters the hermitage.

    Knocking at the inmost sanctuary of the Word,
    he is borne on the flight of unshaken faith:
    has anyone drawn the pure waters of doctrine
    more deeply?

    Taking up the office of abbot, kind father,
    thou dost vow thyself to thy dear sons;
    the weak thou dost carry on kindly shoulders,
    going before them and eagerly urging them on.

    The king brings thee the prelate's chair;
    why fear the struggle? triumphs hasten;
    a noble exile, thou fillest foreign nations
    with light.

    Sacred liberty, won for the redeemed flock,
    to which Christ prefers nothing,
    presses upon Anselm: who defends it
    with equal zeal?

    Thy fame grows bright at Rome, O Prelate;
    the supreme pontiff brings thee honours;
    the faith asks for thee, the Fathers were silent:
    defend the dogma.

    Be mindful of thy holy flock, and be
    our patron, we pray, before the eternal Trinity,
    to whom may all the ages resound
    worthy praises throughout the world.
    Amen.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Anselm was born of noble and Catholic parents, named Gundulph and Hermenberga, at Aosta, in Piedmont. From his tenderest years his diligence in study, and his aspirations to a more perfect state of life, gave no indistinct foreshadowing of the holiness and learning to which he afterwards attained. The heat of youth drew him for a while into the snares of the world, but he soon returned to his first courses, and, forsaking his country and his goods, betook himself to the monastery of Bec, under the rule of St. Benedict. There he made his profession as a monk, and under the rigid discipline of Herluin, the Abbot, and the learned instruction of the profound Lanfranc, with great zeal of spirit and eager obedience to the Rule, he made such progress in learning and godliness, that he shone before all others as an example of holiness of life, and power of doctrine.

        Certification and purity were his marked characteristics, and by constant fasting all taste for food seemed to have died in him. He spent the day in the monastic work, in teaching, and in answering hard questions upon religion, and he took away from sleep during what remained to him of the night, that he might refresh his soul by thoughts of God, wherein he was alway comforted by an unceasing flow of tears. When he was chosen Prior of the monastery, he so won over, by his charity, lowliness, and wisdom, some brethren who looked ill upon him, that from enviers, as he had found them, he turned them into lovers of God and of himself likewise, with exceeding gain to the strictness of observance in that Abbey. After the death of the Abbot, Anselm, though against his own will, was chosen to succeed him. In this high place the light of his learning and holiness so shone all round about, that he was reverenced not only by Kings and Bishops, but was taken up by the holy Pope Gregory VII., who, amid the great persecutions which were then trying him, wrote with words of great love to Anselm to recommend himself and the Catholic Church to his prayers.

        After the death of Lanfranc, Archbishop of Canterbury, Anselm, whose teacher Lanfranc had formerly been, was driven by William II., King of England, supported by the entreaties of the clergy and people, though sorely against his own wishes to take upon him the government of that Church. Raised to that See, he straightway set himself to reform the corrupt manners of the people, and, first by his word and example, and then by his writings and the Councils which he held, succeeded in restoring the ancient godliness and discipline of the Church. But when the aforesaid King William tried by force and threats to seize on the rights of the Church, Anselm withstood him as beseemed a Priest, and after that he had suffered the plundering of all his goods and been sent into banishment, he betook himself to Rome to Urban II. There he was received with great worship, and won high praise for that in the Council of Bari, he maintained by countless proofs from Scripture and the holy Fathers, against the error of the Greeks, that the Holy Ghost proceedeth from the Son also. When William lived no more, his brother Henry I., King of England, called back Anselm thither, and there he fell asleep in the Lord. His is a name illustrious not for miracles only, nor for holiness, and indeed he had a wondrous love for his Lord Who had suffered for him, and for the blessed Maiden Mother of the Same our Lord, but also for the deep learning which he used for the defence of the Christian Religion and the good of souls. That wonderful knowledge of theology which he had, and which is shown in all the books which he wrote, seemeth to have been given him from heaven for the teaching of all writers on the same subject, who have used what is called the Scholastic method.
      status: verified
