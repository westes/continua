collect:
  text: |
    Let us pray.
    Grant, we beseech You, almighty God, that the dignity of human nature, weakened by excessive self-indulgence, may be restored by the earnest practice of healing self-denial.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

benedictus-antiphon:
  text: 'The Master saith: * My time is at hand; I will keep the Passover at thy house with My disciples.'
  status: verified

magnificat-antiphon:
  text: With desire I have desired * to eat this Passover with you before I suffer.
  status: verified
