nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Pope, Sermon 1 on the fast of the tenth month
      text: Dearly beloved brethren, if we study attentively the history of the creation of our race, we shall find that man was made in the image of God, that his ways also might be an imitation of the ways of his Maker. This is the natural, real, and highest dignity to which we are capable of attaining, that the goodness of the Divine nature should have a reflection in us, as in a glass. As a mean of reaching this dignity, we are daily offered the grace of our Saviour, for as in the first Adam all men are fallen, so in the Second Adam can all men be raised up again. Our restoration from the consequences of Adam's fall is sheer mercy of God, and nothing else; we should not have loved him unless he had first loved us, and scattered the darkness of our ignorance by the light of his truth.
      responsory: |
        R. The Lord is at my right hand, that I be not moved: * Therefore my heart hath been glad, and my tongue hath rejoiced.
        V. The Lord is the portion of my inheritance and of my cup.
        R. Therefore my heart hath been glad, and my tongue hath rejoiced.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Pope, Sermon 1 on the fast of the tenth month
      text: 'For his great love then wherewith he hath loved us, God reneweth his likeness in us. And, moreover, in order that he may find in us the reflection of his goodness, he giveth us that whereby to work along with himself, who worketh all in all, lighting, as it were, candles in our dark minds, and kindling in us the fire of his love, to make us love not himself only, but likewise, in him, whatsoever he loveth. For if among men that friendship alone is firm which likeness of character has joined, though equality of wills often tends toward the affections of the wicked: how greatly must we desire and strive that in nothing we differ from those things which are pleasing to God? Of whom the Prophet says: For wrath is in his indignation, and life in his will; because otherwise the dignity of the divine majesty shall not be ours, unless imitation of his will shall have been.'
      responsory: |
        R. With the Lord there is mercy, * And with him plentiful redemption.
        V. The humble in spirit he will save.
        R. And with him plentiful redemption.
      status: draft
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Pope, Sermon 1 on the fast of the tenth month
      text: 'The Lord therefore saying: Thou shalt love the Lord thy God with thy whole heart, and with thy whole mind; and thou shalt love thy neighbour as thyself, let the faithful soul take up the unfading charity of its Author and Ruler, and subject itself wholly to his will, in whose works and judgments nothing is void of the truth of justice, nothing of the compassion of clemency. For even if one be wearied with great labours and many troubles, he has a good reason for enduring, who understands that by adversities he is either corrected or proved.'
      responsory: |
        R. They remembered that God is their helper: * And the most high God is their redeemer.
        V. And he fed them in the innocence of his heart.
        R. And the most high God is their redeemer.
      status: draft
    - nocturn: 3
      isGospel: true
      citation: John 3:13-18
      text: 'At that time: Jesus said to Nicodemus: And no man hath ascended into heaven, but he that descended from heaven, the Son of man who is in heaven. And as Moses lifted up the serpent in the desert, so must the Son of man be lifted up: That whosoever believeth in him, may not perish; but may have life everlasting. For God so loved the world, as to give his only begotten Son; that whosoever believeth in him, may not perish, but may have life everlasting. For God sent not his Son into the world, to judge the world, but that the world may be saved by him. He that believeth in him is not judged. But he that doth not believe, is already judged: because he believeth not in the name of the only begotten Son of God.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop, Tractate 12 on the Gospel of John, ch. 3
      text: 'No man hath ascended into heaven, but he that came down from heaven. For he came down, and died, and by that very death delivered us from death. Slain by death, he slew death. And you know, brethren, that this death entered into the world through the envy of the devil. God made not death, Scripture saith: Neither doth he delight in the destruction of the living; for he created all things that they might be. But what does it say there? But by the envy of the devil, death entered into the world. Man would not have come to the death offered by the devil, driven by force: for the devil had not the power of compelling, but the craft of persuading. Hadst thou not consented, the devil would have brought in nothing; thy consent, O man, led thee to death. Mortals born of a mortal, and made mortal from immortal. From Adam all men are mortal; but Jesus the Son of God, the Word of God, by whom all things were made, the only one, equal to the Father, was made mortal, because the Word was made flesh and dwelt among us. If, therefore, he took death, and hung death upon the cross, mortals are delivered from death itself. Which was done in a figure among the ancients, the Lord recalled.'
      responsory: |
        R. A people to be praised, * Whom the Lord of hosts hath blessed, saying: The work of my hands art thou, Israel, my inheritance.
        V. Blessed is the nation whose God is the Lord: the people whom he hath chosen for his inheritance.
        R. Whom the Lord of hosts hath blessed, saying: The work of my hands art thou, Israel, my inheritance.
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop, Tractate 12 on the Gospel of John, ch. 3
      text: And as Moses, he says, lifted up the serpent in the desert, so must the Son of man be lifted up. Who is the serpent lifted up? The death of the Lord on the cross. For because death was from the serpent, death was figured by the likeness of a serpent. The bite of serpents was deadly, the death of the Lord is life-giving. The serpent is gazed upon, that the serpent may avail nothing. What is this? Death is gazed upon, that death may avail nothing. But whose death? The death of Life. Is not Christ life? And yet Christ died.
      responsory: |
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; the whole earth is full of his glory.
        V. There are Three that bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. Holy, Holy, Holy is the Lord God of hosts.
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop, Tractate 12 on the Gospel of John, ch. 3
      text: 'Meanwhile, brethren, that we may be healed of sin, let us look upon Christ crucified: because as Moses, he says, lifted up the serpent in the desert, so must the Son of man be lifted up; that whosoever believeth in him may not perish, but may have life everlasting. As they who looked upon that serpent perished not by the bites of serpents, so they who gaze upon the death of Christ with faith are healed of the bites of sins. But they were healed from death to a temporal life: here he says, that they may have life everlasting. For this is the difference between the figured image and the thing itself: the figure afforded temporal life; the thing itself, of which that was the figure, affords life everlasting.'
      status: draft
