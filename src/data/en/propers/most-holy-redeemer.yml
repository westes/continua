prime-lectio:
  text: 'Thou art worthy, O Lord our God, to receive glory, and honour, and power: because thou wast slain, and hast redeemed us to God in thy blood, out of every tribe, and tongue, and people, and nation: and hast made us to our God a kingdom.'
  citation: Apocalypse 4:11; 5:9-10
  status: verified

terce-capitulum:
  text: |
    Blessed is thy name, O God of our fathers: who when thou hast been angry, wilt shew mercy, and in the time of tribulation forgivest the sins of them that call upon thee.
    R. Thanks be to God.
    V. Remember us, O Lord, in the favour of thy people.
    R. Visit us with thy salvation.
  citation: Tobias 3:13
  status: verified

sext-capitulum:
  text: |
    But of him are you in Christ Jesus, who of God is made unto us wisdom, and justice, and sanctification, and redemption.
    R. Thanks be to God.
    V. Thou hast redeemed us, O Lord, in thy blood.
    R. And hast made us a kingdom to our God.
  citation: 1 Corinthians 1:30
  status: verified

