collect:
  text: |
    Let us pray.
    Give ear, O Lord, to thy people: that, receiving the glorious merits of blessed Nicomedes thy
    Martyr, they may ever be helped by his patronage to obtain thy mercy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the
    Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. He that hateth his life * in this world, shall keep it unto life eternal.
    V. The righteous shall flourish like the palm-tree.
    R. He shall grow like a cedar in Lebanon.
    Let us pray.
    Give ear, O Lord, to thy people: that, receiving the glorious merits of blessed Nicomedes thy Martyr, they may ever be helped by his patronage to obtain thy mercy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Nicomedes was a priest who was ordered to be seized during the persecution of the Christians by the Emperor Domitian, because he had buried the body of the Virgin Felicula, who had been slain by the Count Flaccus for confessing the Christian Faith. He was led to the statues of the gods, and forasmuch as he steadfastly refused to sacrifice to them, as he was commanded, since sacrifice is due only to the one true God who reigneth in heaven, he was beaten with scourges loaded with lead until, by that martyrdom, he gave up his soul to God. When the same Count ordered his body to be thrown into the flowing Tiber, Justus, a clerk of Nicomedes, diligently sought it out and buried it honorably in a tomb by the walls of the City, along the Via Nomentana.
      status: verified
