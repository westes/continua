collect:
  text: |
    Let us pray.
    O God, Who, through the teaching of the Blessed Apostle Paul, hast caused the light of the Gospel to shine throughout the world, grant, we beseech thee, that we, having his wonderful conversion as on this day in remembrance, may show forth our thankfulness unto thee for the same, by following the holy example which he hath set.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Thus saith the Lord: Ye, which have followed Me, shall sit upon twelve thrones, judging the twelve tribes of Israel.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
    O God, Who, through the teaching of the Blessed Apostle Paul, hast caused the light of the Gospel to shine throughout the world, grant, we beseech thee, that we, having his wonderful conversion as on this day in remembrance, may show forth our thankfulness unto thee for the same, by following the holy example which he hath set.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-invitatory:
  text: For the conversion of the Teacher of the Gentiles, * let us praise our God.
  status: verified

lauds-capitulum:
  text: 'And Saul, as yet breathing out threatenings and slaughter against the disciples of the Lord, went to the high priest, and asked of him letters to Damascus, to the synagogues: that if he found any men and women of this way, he might bring them bound to Jerusalem.'
  citation: Acts 9:1-2
  status: verified

lauds-hymn:
  text: |
    Now let the earth with joy resound,
    And heaven the chant re-echo round;
    Nor heaven nor earth too high can raise
    The great Apostles' glorious praise.

    O ye who, throned in glory dread,
    Shall judge the living and the dead,
    Lights of the world forevermore!
    To you the suppliant prayer we pour.

    Ye close the sacred gates on high;
    At your command apart they fly:
    Oh! loose for us the guilty chain
    We strive to break, and strive in vain.

    Sickness and health your voice obey;
    At your command they go or stay:
    From sin's disease our souls restore;
    In good confirm us more and more.

    So when the world is at its end,
    And Christ to judgement shall descend,
    May we be called those joys to see
    Prepared from all eternity.

    Praise to the Father, with the Son,
    And Holy Spirit, Three in One;
    As ever was in ages past,
    And so shall be while ages last. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Their sound hath gone * forth into all the earth.
    R. Their sound hath gone * forth into all the earth.
    V. And their words unto the ends of the world.
    R. Forth into all the earth.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Their sound hath gone * forth into all the earth.
  status: verified

