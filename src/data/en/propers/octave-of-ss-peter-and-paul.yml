nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. John Chrysostom, quoted by Metaphrastes
      text: |-
        The blessed Apostles, who have toiled so much for us, what thanks shall we give you? When I remember thee, O Peter, I am lost in amazement; Paul, when I think of thee, my heart overwhelmeth me, and I weep. When I look at your sufferings I know not what to say or what to speak. How many prisons have ye made holy! How many fetters have ye made honourable! How many torments have ye endured! How many reproaches have ye borne! How have ye carried Christ! How have ye made the Churches glad by your preaching! Verily, your tongues were blessed instruments; it was for the Church's sake that your limbs were bloody. Ye have been made in all things followers of Christ. Your sound is gone out through all the earth, and your words to the ends of the world.

        Rejoice, O Peter, who hast been gladdened by the wood of the Cross of Christ. It was a showing forth of thy Teacher that thou didst will to be crucified, not like the Lord Christ, standing upright, but with thine head toward the earth, as one that made a way from earth to heaven. Blessed are the nails which pierced thine holy limbs. With sure and certain hope didst thou commend thy spirit into the hands of the Lord, thou who hadst been a faithful servant to Him and to His Bride the Church, thou who in thy warm heart hadst loved the Lord more loyally than all the Apostles.

        Rejoice thou also, O blessed Paul, whose head was cut off by the sword, thou whose fearless devotion no words can express. What sword was that which divided thine holy neck, that instrument of the Lord's work, worthy that heaven should wonder at it, and earth worship it? What place was that which drank in thy blood, that appeared like drops of milk upon the raiment of him who smote thee, and made the savage and his comrades to become strangely gentle and faithful? Would that I could have that sword for a crown, and the nails of Peter set therein as the jewels of the diadem.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 14:22-33
      text: 'And forthwith Jesus obliged his disciples to go up into the boat, and to go before him over the water, till he dismissed the people. And having dismissed the multitude, he went into a mountain alone to pray. And when it was evening, he was there alone. But the boat in the midst of the sea was tossed with the waves: for the wind was contrary. And in the fourth watch of the night, he came to them walking upon the sea. And they seeing him walk upon the sea, were troubled, saying: It is an apparition. And they cried out for fear. And immediately Jesus spoke to them, saying: Be of good heart: it is I, fear ye not. And Peter making answer, said: Lord, if it be thou, bid me come to thee upon the waters. And he said: Come. And Peter going down out of the boat, walked upon the water to come to Jesus. But seeing the wind strong, he was afraid: and when he began to sink, he cried out, saying: Lord, save me. And immediately Jesus stretching forth his hand took hold of him, and said to him: O thou of little faith, why didst thou doubt? And when they were come up into the boat, the wind ceased. And they that were in the boat came and adored him, saying: Indeed thou art the Son of God.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Bk. II, ch. 14
      text: |-
        The Lord commanded His disciples to cross over to the other side, and constrained them to get into a ship. By these expressions we perceive that they were unwilling to leave the Lord, the love of their Teacher making them desire not to lose a moment of His company. And when He had sent the multitudes away, He went up into a mountain apart to pray. Perchance, if Peter, and James, and John, who had seen Him in the glory of the Transfiguration, had been with Him, they would have gone up into the mountain with Him, but the common herd could not follow Him, save when He taught them on the sea shore, or fed them in the wilderness.

        He went up into a mountain apart to pray, not as He Who, with five loaves and two fishes, had satisfied about five thousand men, besides women and children, but as He, Who when He heard of the death of John, departed into a desert place apart. Not that we make two Persons in the Lord, but some of His works He did as God, and some as man. But the ship was now in the midst of the sea, tossed with waves. The Apostles were right to be slow and unwilling to leave the Lord, for, when He was not with them, they were in peril of shipwreck.

        Whilst the Lord abode alone upon the top of the mountain, a contrary wind arose, and the sea raged, and the Apostles were endangered, and yet the threatening shipwreck held off until Jesus came. And in the fourth watch of the night, Jesus went unto them, walking on the sea. The watches of soldiers are divided into three. When therefore it is said that the Lord came unto them in the fourth watch, it appeareth that they had been in peril all night, and that it was at the end of the night, as it will again be at the end of the world, that He came to the rescue of His disciples.
      status: verified
