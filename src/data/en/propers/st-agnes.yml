collect:
  text: |
    Let us pray.
    O Almighty and everlasting God, Who hast chosen the weak things of the world to confound the things which are mighty, mercifully grant unto us that we who keep the solemn feast of thy blessed Virgin and Martyr Agnes, may feel the power of her intercession with thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Behold, now I see that which I have desired; now I possess that for which I have hoped now am I united in heaven to Him Whom I loved with my whole heart upon earth.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
