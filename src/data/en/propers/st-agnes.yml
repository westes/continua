magnificat-antiphon:
  text: The blessed Agnes * stood in the midst of the fire, and stretched forth her hands, and prayed, saying O Father! Who Alone art Almighty! Who Alone art to be adored! Who Alone art to be worshipped! Who Alone art to be feared! I thank thee because that through thy Holy Son Thou hast delivered me from the threatenings of the godless tyrant, and hast made me to walk with clean feet over the filthy slough of fleshly sin and now, behold, I come unto thee, unto thee Whom I have loved, Whom I have sought, Whom I have ever desired.
  status: verified

matins-psalmody:
  category: common-of-a-virgin
  nocturn1:
    groups:
      - psalms:
          - 1
        antiphon: Depart from me, prey of death, for I am prevented by another Lover.
      - psalms:
          - 2
        antiphon: My right hand and my neck hath He clasped with precious stones, and put pearls beyond price in mine ears.
      - psalms:
          - 4
        antiphon: He hath sealed me in my forehead that I may let in no other lover but Him.
      - psalms:
          - 5
        antiphon: The Lord hath clothed me with a vesture of wrought gold, and adorned me with a necklace of great price.
      - psalms:
          - 8
        antiphon: I have sucked honey and milk out of His Mouth, and His Blood is red on my cheeks.
      - psalms:
          - 10
        antiphon: The Virgin of Christ * is not shaken by terror nor seduced by favours.
    versicle:
      v: In thy comeliness and thy beauty.
      r: Go forward, fare prosperously, and reign.
  nocturn2:
    groups:
      - psalms:
          - 14
        antiphon: Christ hath crowned me with the bright and priceless blossoms of the eternal spring-time.
      - psalms:
          - 44
        antiphon: I am wedded to the Lord of Angels, at Whose beauty the sun and the moon do wonder.
      - psalms:
          - 45
        antiphon: His Holy body * is already united to me, and his blood is red upon my cheeks.
      - psalms:
          - 47
        antiphon: I keep my troth to Him Alone, at Whose beauty the sun and the moon do wonder.
      - psalms:
          - 84
        antiphon: A lamb whiter than snow stood at her right hand, Christ consecrating her his bride and martyr.
      - psalms:
          - 86
        antiphon: I keep my troth to Him alone, and commit me altogether to Him.
    versicle:
      v: God shall help her with His countenance.
      r: God is in the midst of her, she shall not be moved.
  nocturn3:
    antiphon: The Lord hath sent his angel, * and hath delivered me out of the fire I was not burnt.
    canticles:
      - refs:
          - book: sir
            chapter: 39
            verses: 17-21
      - refs:
          - book: isa
            chapter: 61
            verses: 10-11
          - book: isa
            chapter: 62
            verses: 1-3
      - refs:
          - book: isa
            chapter: 62
            verses: 4-7
    versicle:
      v: God hath chosen her, and fore-chosen her.
      r: He hath made her to dwell in His tabernacle.

