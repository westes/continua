nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Robert was born in Champagne of noble parents; when his mother was with child of him, the Mother of God appeared to her, and betrothed her finger with a ring, saying that she willed the son she was carrying in her womb to be her own spouse — for which cause all his monasteries were consecrated to the name of that same Mother of God. At the age of eleven he took the religious habit at the monastery of Saint-Pierre-de-Cella. There, devoting himself to fasting and prayer by night and by day, he rendered service pleasing to God, subjecting the flesh to the spirit, and the spirit to the Creator. By God's own disposing he was chosen Prior by the monks of that monastery, and afterwards co-opted Abbot by those of Tonnerre.

        Afterwards he was asked by certain hermits to take up the same office over them; whose wishes he would have granted, had not the monks of Tonnerre protested. Sending back their messengers, he gave them sure hope that he would come to them as soon as the Lord should grant him the means. Later, taking two companions with him, he went to the forest called Molesme, where, labouring with their own hands, they built dwellings and an oratory out of the branches of trees, and there offered to the Lord saving sacrifices and the sacrifice of a contrite heart. But as he greatly desired that, wherever servants of God were to be found, he himself might also be found among them, he came to the place called Aux, and being devoutly received by those monks, was shortly afterwards chosen their Abbot.

        The monks of Molesme, grieved at his withdrawal, went to the Supreme Pontiff; and, relying on his authority, recalled the man of God to Molesme. Meanwhile certain of the brethren — Alberic, Stephen, and two others — desiring the eremitical life, set out for the place called Vivicus; but being driven from there, they came to the forest called Cîteaux, where, having built an Oratory in honour of the Blessed Mary, they persevered. When blessed Robert heard of their holy manner of life, he took with him twenty-two monks and went to join them, that he might share in and assist their holy purpose; and, being received by them with the greatest devotion, he governed them for a time with fatherly solicitude.

        The monks of Molesme, taking it ill to be deprived of so great a shepherd, went again to the Supreme Pontiff, that he might compel blessed Robert to return to Molesme. The Pontiff, granting their request, wrote to the Bishop of Châlons that, another Abbot having been ordained for the Cistercians, he should compel Robert to return to Molesme. Having therefore settled what pertained to the observance according to the Rule of St. Benedict, he set Alberic over them in his own place as Abbot, and upon his death Stephen succeeded him. And so blessed Robert, having been the founder of that new planting, while holding the government of both monasteries — that of Molesme, and that of Cîteaux — returned a second time to Molesme. At length, when his death drew near, the Lord revealed to him the hour of it, and in the ninety-third year of his age, renowned for miracles, he sent forth his spirit to heaven, on the third day before the Kalends of May, in the year of the Lord one thousand ninety-eight.
      status: draft
