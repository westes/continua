nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        The Apostle Bartholomew was a Galilean. In the division of the world among the Apostles it fell to his lot to preach the Gospel of Jesus Christ in hither India. He went thither and preached to those nations the coming of the Lord Jesus, according to the Gospel of St. Matthew. When he had turned many in that province to Jesus Christ, and had endured many toils and woes, he came into the Greater Armenia.

        There he brought to the Christian faith Polymius the King, and his wife, and likewise the inhabitants of twelve cities. This stirred up a great hatred against him among the priests of that nation. They so inflamed against the Apostle Astyages the brother of King Polymius, that he savagely ordered Bartholomew to be flayed alive and beheaded; under the which martyrdom he gave up his soul to God.

        His body was buried at the town of Albanopolis in the Greater Armenia, where he had suffered. It was afterwards taken to the Island of Lipari, and thence carried to Benevento. Lastly, the Emperor Otto III brought it to Rome, where it was laid in the Church dedicated to God in his name on the Island in the Tiber.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 6:12-19
      text: At that time Jesus went out into a mountain to pray, and continued all night in prayer to God. And when it was day, He called unto Him His disciples. And so on.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Book 5
      text: |-
        All they who go up into the mountain are the great and the aspiring. It is not to every man that the Prophet saith: O thou that tellest good tidings to Zion, get thee up into the high mountain, Thou that tellest good tidings to Jerusalem, lift up thy voice with strength. Not with bodily feet, but by high deeds get thee up into this mountain, and follow Christ, that thou mayest be a mountain thyself. Therefore it is that thou findest in the Gospel that none but His disciples went up into the mountain with the Lord. The Lord therefore prayeth, not to entreat anything for Himself, but to obtain somewhat for me. For, albeit the Father had given the Son power over all flesh, that He might give eternal life to as many as He had given Him, the Son Himself, being found in fashion as a man, thinketh well to pray the Father on our behalf, inasmuch as He is our Advocate with the Father.

        And continued all night in prayer to God. Herein, O Christian, a pattern is set before thee, an example is given thee, after the which thou oughtest to aspire. What doth it not behove thee to do for thy salvation, when Christ spent an whole night in prayer for the same? What doth it become thee to do, when thou willest some good work, when Christ prayed before He sent forth His Apostles? He prayed first, and He prayed alone. Neither, unless I am mistaken, do we anywhere find that He ever joined in prayer with His disciples. He ever prayed alone. Human desires cannot grasp the counsel of God, nor can any man, however spiritually minded, share the thoughts of God.

        The Evangelist continueth thus: And when it was day, He called unto Him His disciples and of them He chose twelve whom He sent forth to help the salvation of men by sowing the seed of the faith throughout the whole world. Consider here the counsel of heaven. He chose out for His mission men, not wise, nor rich, nor noble, but fishermen and publicans, lest He should seem to have converted any to His grace by skill, or bought them with money, or drawn them by the power and authority of greatness, and the simple force of the truth, not the charms of argument, might have the victory.
      status: verified
