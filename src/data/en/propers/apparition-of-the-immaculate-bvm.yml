collect:
  text: |
    Let us pray.
    O God, who by the Immaculate Conception of the Virgin didst prepare a worthy dwelling
    place for thy Son, we humbly beseech thee; that we, who celebrate the appearance of the
    same Virgin, may obtain health of soul and body.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. She is my dove, * my perfect one, my undefiled.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
    O God, who by the Immaculate Conception of the Virgin didst prepare a worthy dwelling
    place for thy Son, we humbly beseech thee; that we, who celebrate the appearance of the
    same Virgin, may obtain health of soul and body.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

matins-hymn:
  text: |
    Thee would we hymn, O spotless one,
    Blest Mother of a virgin Son,
    And as we chant thy praises meet,
    Do thou for us God's grace entreat.

    Poor Adam's guilty heirs are we,
    His sin-infected progeny;
    But thou, for Christ's sake, we believe,
    From sins' infection hadst reprieve.

    Thus, boast of mankind, free from sin
    In thy so glorious origin,
    The envious dragon, 'neath thy heel,
    On his crushed head Christ's might doth feel.

    O flower of the human race,
    Who took'st away poor Eve's disgrace,
    Obtain for every wavering one
    To serve without reproach thy Son.

    When that old serpent would beguile
    Our foolish hearts with sinful wile,
    Gain us the might to smite him down
    And win the blessed victor's crown.

    * All honour, laud, and glory be,
    O Jesu, Virgin-born, to thee,
    Whom with the Father we adore,
    And Holy Ghost, for evermore. 
    Amen.
  status: verified

matins-invitatory:
  text: 'Let us celebrate the Immaculate Conception of the Virgin Mary: * Let us adore her Son, Christ the Lord.'
  status: verified

lauds-capitulum:
  text: 'Arise, my love, my beautiful one, and come: My dove in the clefts of the rock, in the hollow places of the wall, show me thy face, let thy voice sound in my ears.'
  citation: Song 2:13-14
  status: verified

lauds-hymn:
  text: |-
    O rosy dawn! that dost proclaim
    Salvation's happy day,
    To thee, O Virgin, 'mid night's shades,
    Thy people humbly pray.

    The torrent, that engulfs all those
    Within this whirlpool drawn,
    Rests calm as o'er its softened wave
    The ark of God was borne.

    While earth is parched with scorching heat,
    Alone art thou bedewed;
    With dew o'erspread the earth around,
    And thou untouched art view'd.

    The serpent rears his head aloft
    Disgorging poisoned spleen;
    But thou his proud, inflated head
    Dost crush with pow'r as Queen.

    O loving Mother, hear our pray'r,
    As suppliant we cry;
    Protect us in our strife with hell,
    Who dost its power defy.

    O Jesu, born of Virgin bright,
    All glory be to thee,
    With Father and with Paraclete,
    Through all eternity. Amen.
  status: verified

lauds-versicle:
  text: |
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
  status: verified

prime-lectio:
  text: In me is all grace of the way and of the truth, in me is all hope of life and of virtue. Come over to me, all ye that desire me, and be filled with my fruits.
  citation: Sir 24:25-26
  status: verified

vespers-hymn:
  text: |-
    Ave, star of ocean,
    Child divine who barest,
    Mother, ever-Virgin,
    Heaven's portal fairest.

    Taking that sweet Ave
    Erst by Gabriel spoken,
    Eva's name reversing,
    Be of peace the token.

    Break the sinners' fetters,
    Light to blind restoring,
    All our ills dispelling,
    Every boon imploring.

    Show thyself a mother
    In thy supplication;
    He will hear who chose thee
    At his incarnation.

    Maid all maids excelling,
    Passing meek and lowly,
    Win for sinners pardon,
    Make us chaste and holy.

    As we onward journey
    Aid our weak endeavour,
    Till we gaze on Jesus
    And rejoice forever.

    Father, Son, and Spirit,
    Three in One confessing,
    Give we equal glory
    Equal praise and blessing. Amen.
  status: verified

vespers-hymn/~-second:
  text: |
    Lo! Mary is exempt from stain of sin,
    Proclaims the Pontiff high;
    And earth applauding celebrates with joy
    Her triumph, far and nigh.

    Unto a lowly timid maid she shows
    Her form in beauty fair,
    And the Immaculate Conception truth
    Her sacred lips declare.

    O honoured cave, by Mary's smile adorned!
    O hallow'd rock, whence spring
    The living waters of a gushing stream,
    The gifts of life to bring.

    And thither from the farmost bounds of earth
    The pilgrims wend their way,
    And suppliant around the Virgin's shrine
    Her powerful help they pray.

    The sufferers' cry the Mother fondly hears,
    And grants the longed-for grace;
    And health restored, the pilgrim throng returns
    Unto its native place.

    O Virgin! have compassion on our needs,
    Refresh us labouring on;
    Obtain for us the joys of heavenly life,
    When sorrow all is gone.

    * All honour, praise and glory be,
    O Jesu, Virgin-Born, to thee;
    All glory, as is ever meet,
    To Father, and to Paraclete. Amen.
  status: verified

vespers-versicle:
  text: |
    V. Holy Virgin, my praise by thee accepted be.
    R. Give me strength against thine enemies.
  status: verified

benedictus-antiphon:
  text: Beautiful aurora of salvation, * out of thee, O Virgin Mary, came forth the sun of justice who has visited us, the Orient from on high.
  status: verified

magnificat-antiphon:
  text: Today the glorious Queen of heaven * appeared on earth; today her word brought to her people a pledge of peace and salvation; today the choirs of Angels and the faithful exult, celebrating with joy the Immaculate Conception. Alleluia.
  status: verified

magnificat-antiphon/~-first:
  text: She is my dove, * my perfect one, my undefiled.
  status: verified

vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: She is the brightness * of eternal light, and the unspotted mirror.
    - psalms:
        - 112
      antiphon: A woman * clothed with the sun, and the moon under her feet, and on her head a crown of twelve stars.
    - psalms:
        - 121
      antiphon: Thou art the glory of Jerusalem, * thou art the joy of Israel, thou art the honour of our people.
    - psalms:
        - 126
      antiphon: Blessed art thou, * O Virgin Mary, by the Lord, the most high God, above all women upon the earth.

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        In the fourth year from the dogmatic definition of the Immaculate Conception of the Blessed Virgin, at the bank of the river Gave near the town of Lourdes of the diocese of Tarbes in France, the Virgin herself in a bend of the rock above the grotto of Massabiele, often shewed herself to a certain girl, called in the vernacular tongue Bernadette, indeed most poor but noble and pious, to be seen. The Immaculate Virgin appeared with a young and kind appearance, clothed with a white garment and white veil, and girt with a blue girdle; she adorned her bare feet with a golden rose. On the first day of the apparition, which was the eleventh of February in 1858, she taught the girl the sign of the cross to be duly and piously made, and she incited her, by her example, to the recitation of the sacred rosary. On the second day of the apparition, the girl in the simplicity of her heart, fearing diabolic fraud, flung holy water on the Virgin; but the blessed Virgin, smiling gently, shewed her face more kindly to her. And when she appeared a third time, she invited the girl to the grotto for fifteen days. Thence she often addressed her; then commanded, that it might be declared to the priests, a chapel to be built there, and to be approached there for supplications in a manner of solemnity. Moreover she commanded that from the spring, which thus far was hidden under the sand but now was about to erupt, she might drink the water, and by it cleanse herself. Finally on the feast day of the Annunciation, to the girl earnestly inquiring her name, the Virgin, her hands having been moved to her breast and her eyes raised to heaven, answered: I am the Immaculate Conception.

        The fame of favours becoming widespread, which the faithful were said to have received in the sacred grotto, in time the assembly of men increased, whom the sanctity of the place called to the grotto. Therefore the bishop of Tarbes moved by the fame of the wonders and the purity of the girl, after a juridical inquiry of the happenings, approved by his decree the signs of the apparition to be supernatural, and permitted the worship of the immaculate Virgin in the same grotto. Soon a chapel is built: from that day the almost innumerable crowds of the faithful, for the purpose of prayer and supplication, from France, Belgium, Italy, Spain, and the other provinces of Europe and also from the remote regions of America arrived there in every year, and the name of the Immaculate of Lourdes becometh famous of countries everywhere. The water of the spring, having been carried into all parts of the world, restored health to the sick. And the Catholic world mindful of such great favours, built holy shrines there with wonderful work.

        It is known by all for certain the pilgrimages of this sort to have stirred up faith, in a world becoming cold, the soul to have increased to profess the Christian law, and to have spread the worship of the immaculate Virgin in a wonderful manner. Pius the ninth, with sacred indulgences, distinguished it with the privilege of an archconfraternity and title of a minor Basilica; and willed the image honoured there of the Godbearer to be adorned with a crown by his apostolic legate in France. And Leo the thirteenth also conferred innumerable benefits, and arranged to complete by his name the solemn dedication of the Church under the title of the Rosary; he accumulated the extent of which benefits, when, with the asking of many bishops, he kindly granted a solemn feast to be celebrated under the title of the Apparition of the blessed Virgin Mary immaculate with a proper Office and proper Mass. Finally supreme Pontiff Pius the tenth extended the same feast to the universal Church.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 1:26-28
      text: At that time, the angel Gabriel was sent from God to a town of Galilee called Nazareth, to a virgin betrothed to a man named Joseph, of the house of David, and the virgin's name was Mary. And when the angel came to her, he said, "Hail, full of grace, the Lord is with you. Blessed are you among women."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard of Clairvaux, Homily 2 on the text "Missus est" (on Luke 1:26-28)
      text: |-
        Rejoice, father Adam, and yet more thou mother Eve, ye that are the source of all, and the ruin of all, and the unhappy cause of their ruin before ye gave them birth. Be comforted both in your daughter, and such a daughter; but chiefly thou, O woman, of whom the first evil came, and who hast cast thy slur upon all women. The time is come for the slur to be taken away, and for the man to have nothing to say against the woman. At the first, when he unwisely began to make excuse, he scrupled not to throw the blame upon her, saying, The woman whom Thou gavest to be with me, she gave me of the tree, and I did eat. Wherefore, O Eve, betake thyself to Mary Mother, betake thyself to thy daughter let the daughter answer for the mother let her take away her mother's reproach; let her make up to her father for her mother's fault for if man be fallen by means of woman, it is by means of woman that he is raised up again.

        What didst thou say, O Adam? The woman whom Thou gavest to be with me, she gave me of the tree, and I did eat. These are wrathful words, by the which thou dost rather magnify than diminish thine offence. Nevertheless, Wisdom hath defeated thy malice. God asked thee that He might find in thee an occasion of pardon, but, in that He found it not, He hath sought and found it in the Treasure of His Own mercy. One woman answereth for another; the wise for the foolish; the lowly for the proud; for her that gave thee of the tree of death, another that giveth thee to taste of the tree of life; for her that brought thee the bitter food of sin, another that giveth thee of the sweet fruits of righteousness. Wherefore accuse the woman no more, but speak in thanksgiving, and say, Lord, the woman whom Thou hast given me, she hath given me of the tree of life, and I have eaten; and it is in my mouth sweeter than honey, for thereby hast Thou quickened me. Behold, it was for this that the angel Gabriel was sent to the Virgin, to the most worshipful of women, a woman more wonderful than all women, the restorer of them that went before, and the quickener of them that come after her.

        Has it not of this thy daughter, O Adam, that God spake when He said unto the serpent, I will put enmity between thee and the woman And if thou wilt still doubt that He speaketh of Mary, hear what followeth She shall bruise thy head. Who won this conquest but Mary? She brought to nought the whole wiles of Satan, whether for the pollution of her body or the injury of her soul. Was it not of her that Solomon spake, where he saith, Who shall find a virtuous woman? The wise man knew the weaknesses of women, how frail they are in body, and how changeable in mind. But he had read that God had promised that the enemy, who had prevailed by means of a woman, was by a woman to be overthrown, and he believed. But he wondered greatly, and said, Who shall find a virtuous woman? that is to say If our salvation, and the bringing back of that which is lost, and the final triumph over the enemy, is in the hand of a woman, it must needs be that a virtuous woman be found, meet to work in that matter.
      status: verified
