nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Boniface, the fourth of that name, having been taken from the living, after the Apostolic See had been vacant five months and twelve days, blessed Deusdedit, conspicuous for eminent virtues and exceptional sanctity, a Roman by race, son of Stephen, was by the unanimous consent of all created Roman Pontiff from subdeacon. That a subdeacon should be created Pontiff then first happened without example of predecessors; but that, others being passed over, Deusdedit should be elected, his own conspicuous holiness brought about, by which, amid so many darknesses, he wonderfully shone forth.

        He began his government with the house of God. For he took the greatest care of the clergy, whom, finding diminished and greatly scattered, he much increased, restored to their former places, and heaped with many benefits. But it is plainly to be lamented that the deeds of so great a Pontiff, through lack of writers or certainly the injury of time, have remained obscure: which must indeed have been remarkable, since the Church of old received him among the saints, and venerated him by yearly commemoration as a saint.

        One thing, however, singular, has not perished. For when, on account of most violent earthquakes, a plague of elephantiasis had arisen, while the most holy Pontiff was providing for the afflicted City, and, present, by a rare example visited the sick, one of them, in whom he contemplated Christ, he kindly embraced and kissed, and by a divine miracle cleansed him from leprosy, as the ancient monuments of the Church attest. A fragment of a letter written by him survives, in which an admirable decree on spiritual kinship is contained. When at length he had sat three years, he departed from this life, in the year of Christ 617, and was buried in the Vatican.
      status: draft
