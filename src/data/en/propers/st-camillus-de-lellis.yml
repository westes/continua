      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 83 on John
      text: |-
        What think ye, my brethren? Is this his only commandment, this, that we love one another? Is there not another and a greater, the commandment to love God? Or hath God commanded us only to love, so that we need seek to do no more? Surely the Apostle commendeth three things: And now abideth Faith, Hope, Charity, these three, but the greatest of these is Charity. And although in charity, that is, in love, he included the two first and great commandments, and charity he called the greatest, yet is charity not said to be alone. Concerning Faith, concerning Hope, how much is commanded us? Who can gather them all together? Who can reckon them all? And yet let us consider how the same Apostle saith: Love is the fulfilling of the Law.

        Where therefore charity is, what can be lacking? Or where charity is not, what can there be availing? The devil believeth and loveth not; but there is no one that loveth and believeth not. Useless though it be, it is still possible for one that loveth not to hope to be forgiven; but for one that loveth, it is impossible to give up hope. Therefore, where love is, there also must faith and hope needs be; and where there is love toward one's neighbor, there also must there needs be love toward God. For one that loveth not God, how can he love his neighbor as himself, seeing he hateth even himself? For he is a wicked and blasphemous wretch; and the lover of wickedness is not the lover, but the deadly enemy, of his own self.

        Let us, therefore, hold fast to this precept of the Lord, to love one another; and then all else that is commanded we shall do, for all else is contained in this. But this love is distinguished from that which men bear to one another as such; for in order to mark the distinction, it is added, As I have loved you. And wherefore is it that Christ loves us, but that we may be fitted to reign with Christ? With this aim, therefore, let us also love one another, that we may show the difference of our love from that of others, who have no such motive in loving one another, because such love itself is wanting to them. But those whose mutual love has the possession of God himself for its object, truly love one another; and therefore, even for the very purpose of loving one another, they love God. There is no such love as this in all men; for few love one another for this reason, that God may be all in all.
      status: verified
