collect:
  text: |
    Let us pray.
    O God, Who didst adorn thy holy servant Camillus with a rare grace of charity, to
    comfort souls wrestling in their final agony: pour into us, we beseech thee, through his
    merits, the spirit of thy love; that in the hour of our own departure we may have
    strength to overcome the enemy, and may be found worthy to come to the crown of heaven.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Well done, thou good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of thy Lord.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, Who didst adorn thy holy servant Camillus with a rare grace of charity, to
    comfort souls wrestling in their final agony: pour into us, we beseech thee, through his
    merits, the spirit of thy love; that in the hour of our own departure we may have
    strength to overcome the enemy, and may be found worthy to come to the crown of heaven.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Camillus was a son of the noble family of the Lelli, and was born at Bacchianico, a town in the Diocese of Chieti. His mother was sixty years of age at the time of his birth. While she was great with child, she dreamed that she brought forth a babe bearing the mark of a Cross upon his breast, and going before a troop of other babes marked likewise. When Camillus was a young man he served as a soldier, and yielded himself for a while to the sins of the world. In the twenty-fifth year of his age light from God broke upon him, together with such sorrow at having offended him, that in a violent fit of tears he determined to wipe away without ceasing the evil relics of his past life, and to put on the new man. That very day, being the holiday of the Purification of the Most Blessed Virgin, he ran to the Friars Minor, who are commonly called Capuchins, and implored them, with the most earnest prayers, to enrol him among them. His wish was granted, once and then again; but when a loathsome running sore in the leg, from which he had suffered before, broke out afresh in that same leg, he humbly submitted himself to the greater plan of divine providence for him, and, conquering himself, twice laid aside the habit of that Order which he had twice sought and received.

        He went to Rome and was received as an inmate in the Hospital for Incurables. In consequence of his tried and proven virtues, the administration of the Hospital was committed to his charge, and he discharged this office with the most thorough trustworthiness and with a tenderness like a father's. He counted himself the slave of all the sick, and made it his settled practice to make their beds, clean them, dress their sores, and help by godly prayers and exhortations such as were in their last agony; in these offices he gave brilliant examples of wonderful patience, unconquered fortitude, and heroic charity. But when he came to understand how greatly a knowledge of letters could aid the comfort of souls in their extremity, which was his one concern, he did not blush, at the age of thirty-two, to undergo again among little boys the first rudiments of grammar. Having afterward been duly ordained a priest, and joined by some companions, he laid the first foundations of the Congregation of Regular Clerks for ministering to the sick, though the enemy of mankind strove in vain to hinder it. For Camillus, wonderfully strengthened by a voice from heaven that came from an image of Christ Crucified — whose very hands, by an admirable wonder, stretched forth from the wood — obtained the approval of his Order from the Apostolic See; its members being bound by a fourth and most arduous vow, to minister to the sick, even those infected with the plague. How pleasing to God and how profitable to the salvation of souls this institute would be, holy Philip Neri, who was confessor to Camillus, himself confirmed, testifying that he had often seen Angels suggesting words to Camillus's own disciples as they assisted the dying in their agony.

        Bound by these still closer ties to the service of the sick, it is wonderful with what eagerness Camillus, broken by no labors, deterred by no dangers to his own life, watched over their welfare day and night to his very last breath. Becoming all things to all men, he took up even the most menial duties with the humblest submission, and very often on bended knee, as though he beheld Christ himself in the sick; and that he might be free to answer everyone's need, he of his own accord laid down the general governance of his Order, and the heavenly delights in which he was steeped when fixed in contemplation. His fatherly love for the wretched shone brightest of all when Rome was afflicted first by a contagious sickness, and then by the direst want of grain, and when a fearful plague was raging at Nola in Campania. So greatly did he burn with love for God and neighbor that he deserved to be called an angel, and to find the help of Angels amid the various perils of his journeys. Endowed with the gift of prophecy and the grace of healing, he also read the secrets of hearts; and by his prayers food was at times multiplied, and water turned into wine. Worn out at last by watching, fasting, and unceasing labor, until he seemed to be nothing but skin and bone, he bore bravely five distressing and long-lasting illnesses, which he called the mercies of the Lord, and, fortified with the Sacraments, at Rome, amid the sweetest names of Jesus and Mary, at the very words, "May the mild and joyous countenance of Christ Jesus appear to thee," he fell asleep in the Lord at the hour he had himself foretold, on the day before the Ides of July, in the year of salvation 1614, in the sixty-fifth year of his age. Benedict XIV, in solemn rite, enrolled him, renowned for many miracles, among the Saints; and Leo XIII, at the petition of the bishops of the whole Catholic world and on the advice of the Congregation of Sacred Rites, declared him the heavenly patron of all hospitals and of the sick everywhere, and ordered that his name be invoked in the litany for the dying.
      status: verified
    - nocturn: 3
