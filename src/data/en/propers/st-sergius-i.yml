nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Sergius, an Antiochene by race, his father Tiberius, born at Palermo in Sicily, Conon having departed this life, in the year of Christ 687, God assenting and with the votes of all supporting, was taken up in the sacred Lateran palace, and stifled at its very birth the most foul schism which the avarice of the exarch of the emperor and the ambition of Paschal the archdeacon had stirred up. Coming to Rome in the time of the Pontiff Adeodatus, he was admitted by him into the clergy of the Roman Church, and by Leo the second of that name was ordained priest of the title of St. Susanna, and tirelessly discharged his office.

        The canons which were afterwards fastened upon the sixth synod by the Greeks, though the emperor insisted and threatened direly, he would not admit, but as spurious, not without peril of life, constantly rejected. A great portion of the Lord's cross, found by himself by the revelation of God, he placed in the Constantinian basilica to be adored by the people. The body of St. Leo, laid in an obscure corner, he removed thence by God's will, and set in a more honourable place for all to venerate. And he adorned the Vatican basilica with innumerable gifts, certainly outstanding monuments of his love for the Prince of the Apostles.

        Kilian and his companions, afterwards martyred, he sent into Germany; Willibrord and Switbert with their companions into Frisia and the surrounding regions, in which they converted a very great number of pagans to the faith of Christ. Caedwalla, king of the Britons, coming to Rome, he received and washed in sacred baptism. For the Ravennates he ordained Damian, for the people of Liège Hubert, for the Britons Berechtwald as bishops. He decreed that the pious verse, Agnus Dei, qui tollis peccata mundi, miserere nobis, be added to the sacred Liturgy. At last, full of merits, after he had sat thirteen years and eight months, he rested in a holy end, and was buried in the Vatican.
      status: draft
