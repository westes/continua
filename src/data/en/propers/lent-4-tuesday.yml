collect:
  text: |
    Let us pray.
    O Lord, we beseech thee, that the observance of this holy fast may avail us both to the increase of godliness in our conversation, and the stablishing upon us of the help of thy mercy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    O Lord, have mercy upon thy people, and be graciously pleased to grant relief unto the same, who are ever toiling amid the storms of diverse tribulations.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

