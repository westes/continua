nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Cyril of Jerusalem was given to the study of the Holy Scriptures from a child, and so learnt therein that he became an eminent champion of the orthodox faith. He embraced the monastic institute in perpetual continency, and all hardship of living. He was ordained Priest by holy Maximus, Patriarch of Jerusalem, and undertook with eminent success the task of preaching the word of God to the faithful and of instructing the catechumens. Thus did he compose those truly wonderful Catecheses, wherein he has embraced, clearly and fully, all the teaching of the Church, and stoutly defended every one of her doctrines against the enemies of the faith. His treatment of these subjects was such that he has overthrown therein, not only the heresies which had then come into being, but, by a kind of foreknowledge, even those which were to arise in later times. Of this an instance is his contention for the real Presence of the Body and Blood of Christ in the wondrous Sacrament of the Eucharist. After the death of holy Maximus, the bishops of the province chose Cyril in his place.

        In his office of Bishop he had for the faith's sake, like his blessed contemporary Athanasius, to endure many wrongs and sufferings at the hands of the Arian sect. The Arians could not bear that Cyril should steadfastly withstand their heresy. They assailed him with calumnies, deposed him in a pretended council, and drove him out of his see. To escape their rage he fled to Tarsus in Cilicia, and as long as Constantius lived he bore the hardships of exile. After his death and the accession to the imperial throne of the Apostate Julian, Cyril was able to return to Jerusalem, where he set himself with burning zeal to deliver his flock from false doctrine and from sin. He was driven into exile a second time under the Emperor Valens. But when peace was restored to the Church by Theodosius the Great, and the cruelty and insolence of the Arians were restrained, Cyril was received with honour by the Emperor as one of Christ's most eminent soldiers, and was restored to his see. With what earnestness and holiness he fulfilled the duties of his exalted office was made manifest by the flourishing state of the church of Jerusalem at that time, of which a picture hath been left for us by holy Basil, who dwelt there for a while when he went to worship at the holy places.

        Tradition hath handed down that God Himself crowned with signs from heaven the holiness of this venerable Patriarch. Among these signs is numbered an apparition of a cross, more resplendent than the beams of the sun, which appeared at the beginning of his Patriarchate. Not only Cyril himself, but heathens and Christians alike were eye-witnesses of this marvel, and Cyril first gave thanks to God therefore in the church, and then sent news thereof by letter to the Emperor Constantius. A thing no less wonderful came to pass when the Jews were commanded by the profane Emperor Julian to attempt the restoration of the temple which had been destroyed by Titus. A great earthquake arose, and great masses of fire broke forth from the earth and consumed all the works, so that the Jews and Julian were dismayed and stayed their hand, all the which it can be proved that Cyril had foretold. A little while before his death he was present at the second Council of Constantinople; herein was condemned the heresy of Macedonius, and once more the Arian heresy. After his return to Jerusalem he died a holy death in the 69th year of his age and the 35th of his episcopate. The Supreme Pontiff Leo XIII. commanded that his office and Mass should be celebrated throughout the universal Church.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 10:23-28
      text: At that time, Jesus said to His disciples, "When they persecute you in one town, flee to another. Amen I say to you, you will not have gone through the towns of Israel before the Son of Man comes. No disciple is above his teacher, nor is the servant above his master. It is enough for the disciple to be like his teacher, and for the servant to be like his master. If they have called the master of the house Beelzebub, how much more those of his household! Therefore do not be afraid of them. For there is nothing concealed that will not be disclosed, and nothing hidden that will not be made known. What I tell you in darkness, speak it in the light; and what you hear whispered, preach it on the housetops. And do not be afraid of those who kill the body but cannot kill the soul. But rather be afraid of Him Who is able to destroy both soul and body in hell."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Athanasius, Defence of his Own Flight (on Matt 10:23-28)
      text: 'It is written in the Law, Ye shall appoint you cities to be cities of refuge for you, that in these cities they which were pursued to put them to death might enter and be safe. And in the latter days when He was come, even that very Word of the Father, Which had spoken aforetime unto Moses, He gave again the same commandment When they persecute you in this city, flee ye into another. And, a while afterward, He said: "When ye shall see the abomination of desolation, spoken of by Daniel the Prophet, stand in the Holy Place, whoso readeth, let him understand, then let them which be in Judaea flee unto the mountains; let him which is on the house-top not come down to take anything out of his house; neither let him which is in the field return back to take his clothes."'
      status: verified
