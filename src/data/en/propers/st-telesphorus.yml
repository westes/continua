nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Telesphorus, a Greek by race and a native of Thurii in Magna Graecia, was made Supreme Pontiff from being a priest of the Roman Church, of which he had been a worthy minister. He discharged this highest office so well that he seemed to have been chosen an outstanding successor of Peter. He sat in his chair under the Emperor Antoninus Pius, in the fervent heat of persecution. Yet this did not prevent him from devoting careful and anxious labour to the governance of Christ's Church.

        We read that from this he established many things excellently by new decrees, touching the morals of the faithful, the freedom of the clergy, and sacred rites: namely, that he renewed by a new edict the Lenten fast, handed down long ago by the Apostles; and commanded that on the Nativity of the Lord the holy sacrifice of the Mass be celebrated three times, at midnight, at the dawning of the day, and at the third hour after sunrise; and established that the angelic hymn of the sacred Liturgy, Glory be to God on high, be added.

        He also decreed that priests should not be accused by the people, so as to safeguard the dignity of the exalted order. In four ordinations, in the month of December, he created twelve priests, eight deacons, and thirteen bishops for various places. Since he was most ardent in propagating the faith, and for that reason hateful to the priests of the idols, he was at length seized and completed his martyrdom by beheading on the Nones of January, and his body was buried in the Vatican.
      status: draft
