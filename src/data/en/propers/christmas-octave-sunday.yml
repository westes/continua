collect:
  text: |
    Let us pray.
    O Almighty and everlasting God, do Thou order all our actions in conformity with thy good pleasure, that through the name of thy well-beloved Son, we may worthily abound in all good works.
    Who with thee liveth and reigneth, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: verified

lauds-capitulum:
  text: 'Brothers: As long as the heir is a child, he differeth nothing from a servant, though he be lord of all; But is under tutors and governors until the time appointed by the father.'
  citation: Gal 4:1-2
  status: verified

lauds-hymn:
  text: |
    From lands that see the sun arise
    To earth's remotest boundaries,
    The Virgin-born today we sing,
    The Son of Mary, Christ the King.

    Blest Author of this earthly frame,
    To take a servant's form He came,
    That, liberating flesh by flesh,
    Whom He had made might live afresh.

    In that chaste parent's holy womb
    Celestial grace hath found its home;
    And she, as earthly bride unknown,
    Yet calls that Offspring blest her own.

    The mansion of the modest breast
    Becomes a shrine where God shall rest:
    The pure and undefilèd one
    By the Word conceived the Son.

    That Son, that Royal Son she bore,
    Whom Gabriel's voice had told afore;
    Whom, in His mother yet concealed,
    The infant Baptist had revealed.

    The manger and the straw He bore,
    The cradle did He not abhor;
    By milk in infant portions fed,
    Who gives e'en fowls their daily bread.

    The heavenly chorus filled the sky,
    The Angels sang to God on high,
    What time to shepherds, watching lone,
    They made creation's Shepherd known.

    All honor, laud, and glory be,
    O Jesu, Virgin-born to thee:
    All glory, as is ever meet,
    To Father and to Paraclete.
    Amen.
  status: verified

lauds-versicle:
  text: |-
    V. The Word was made flesh, alleluia.
    R. And dwelt among us, alleluia.
  status: verified

prime-antiphon:
  text: Alleluia, * Give glory to the Lord, for his mercy endureth for ever, alleluia, alleluia.
  status: verified

prime-lectio:
  text: Therefore now he is not a servant, but a son. And if a son, an heir also through God.
  citation: Gal 4:7
  status: verified

terce-antiphon:
  text: Alleluia, * Lead me into the path of thy commandments, alleluia, alleluia.
  status: verified

terce-capitulum:
  text: |
    Brothers: As long as the heir is a child, he differeth nothing from a servant, though he be lord of all; But is under tutors and governors until the time appointed by the father.
    R. Thanks be to God.
    V. He shall cry unto Me, alleluia.
    R. Thou art My Father, alleluia.
  citation: Gal 4:1-2
  status: verified

sext-antiphon:
  text: Alleluia, * I am thine, save thou me, O Lord, alleluia, alleluia.
  status: verified

sext-capitulum:
  text: |
    But when the fulness of the time was come, God sent his Son, made of a woman, made under the law: That he might redeem them who were under the law: that we might receive the adoption of sons.
    R. Thanks be to God.
    V. All the ends of the earth have seen, alleluia.
    R. The salvation of our God, alleluia.
  citation: Gal 4:4-5
  status: verified

none-antiphon:
  text: Alleluia, * make thy face to shine upon thy servant, alleluia, alleluia.
  status: verified

none-capitulum:
  text: |
    Therefore now he is not a servant, but a son. And if a son, an heir also through God.
    R. Thanks be to God.
    V. The Word was made flesh, alleluia.
    R. And dwelt among us, alleluia.
  citation: Gal 4:7
  status: verified

vespers-hymn:
  text: |-
    Jesu, the very thought of thee
    With sweetness fills my breast;
    But sweeter far thy face to see,
    And in thy presence rest.

    Nor voice can sing, nor heart can frame,
    Nor can the memory find,
    A sweeter sound than thy blest Name,
    O Saviour of mankind!

    O Hope of every contrite heart,
    O Joy of all the meek,
    To those who fall, how kind Thou art!
    How good to those who seek!

    But what to those who find? Ah! this
    Nor tongue nor pen can show:
    The love of Jesus, what it is
    None but his loved ones know.

    Jesu, our only joy be Thou,
    As Thou our prize wilt be;
    Jesu, be Thou our glory now,
    And through eternity.
    Amen.
  status: verified

vespers-versicle:
  text: |
    V. The Lord hath made known, alleluia.
    R. His salvation, alleluia.
  status: verified

vespers-versicle/~-first:
  text: |
    V. Tomorrow the iniquity of the earth shall be blotted out.
    R. And the Saviour of the world shall reign over us.
  status: verified

benedictus-antiphon:
  text: While all things were in quiet silence * and that night was in the midst of her swift course, thine Almighty Word, O Lord, leapt down out of thy Royal Throne.
  status: verified

magnificat-antiphon:
  text: 'This day the Christ is born this day the Saviour is appeared; * this day the Angels sing praise in the earth and the Archangels rejoice; this day the righteous are glad and say: Glory to God in the highest. Alleluia.'
  status: verified

magnificat-antiphon/~-first:
  text: When the sun shall have risen * from heaven, ye shall see the King of kings proceeding from the Father, as a bridegroom from his chamber.
  status: verified

lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: O ye shepherds, speak, * and tell us what ye have seen; who is appeared in the earth? We saw the newborn Child, and angels singing praise to the Lord, alleluia, alleluia.
    - psalms:
        - 99
      antiphon: The Mother brought forth the King, * Whose name is called The Eternal; the joy of a Mother was hers, remaining a Virgin unsullied; neither before nor henceforth hath there been or shall be such another, alleluia.
    - psalms:
        - 62
      antiphon: The Angel said unto the shepherds * I bring you good tidings of great joy; for unto you is born this day a Saviour of the world, alleluia.
  canticle:
    id: canticum-trium-puerorum
    antiphon: There was with the Angel a multitude of the heavenly host, * praising God, and saying Glory to God in the highest, and on earth peace, to men of good will, alleluia.
  laudate:
    antiphon: Unto us this day a little Child is born, * and His name shall be called the Mighty God, alleluia, alleluia.

vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Thine shall be the dominion * in the day of thy power, amid the brightness of the saints, from the womb, before the day-star, have I begotten thee.
    - psalms:
        - 110
      antiphon: The Lord sent redemption * unto His people, He hath commanded His covenant for ever.
    - psalms:
        - 111
      antiphon: Unto the upright there ariseth * light in the darkness; the Lord is gracious, and full of compassion, and righteous.
    - psalms:
        - 129
      antiphon: With the Lord * there is mercy, and with Him is plenteous redemption.

vespers-psalmody/~-first:
  groups:
    - psalms:
        - 109
      antiphon: The King of Peace * is magnified, whose face the whole earth desireth.
    - psalms:
        - 110
      antiphon: The Peaceful King * exceeded all the kings of the whole earth.
    - psalms:
        - 111
      antiphon: The days of Mary * were accomplished that she should bring forth her first-born Son.
    - psalms:
        - 112
      antiphon: Lift up your heads; * behold, your redemption draweth nigh.

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Sermon 9 on Christmas
      text: |-
        Dearly beloved brethren, the greatness of God's work, in its breadth and height, passeth the power of man's utterance; and, therefore, when we must needs not keep silence, we find it hard to know what to say. The words of the Prophet: Who shall declare His generation? look not only to the Divine, but also to the human birth of Jesus Christ, the Son of God. Faith believeth, but words cannot explain, how the two natures were joined in one Person, and therein we find that we shall never lack matter of praise in Him, Whose abundance ever outrunneth the power of our expression.

        Therefore let us rejoice, that this mystery of mercy is greater than we can ever speak; and let us feel that it is good for us to fail if we try to express the height and depth of redeeming love. He cometh nearest to the knowledge of the truth, who, the farther he advanceth, seeth all the more clearly that he can never overtake that whereafter he searcheth. For he that imagineth therein that he hath ever attained unto the goal, hath not found that which he seeketh, but hath altogether missed.

        But lest we should be confounded at the weakness of our mortality, we have help in the words of the Prophets and Evangelists; and they are able so to inflame and teach us that we may see the Birth of the Lord, wherein the Word was made Flesh, not so much as a thing past, as a thing present. The proclamation of the angel to the shepherds who watched their flocks by night, ringeth in our ears also; and for this end are we appointed to rule the Lord's flock, that we may ever keep in our heart the word revealed from heaven, and say unto you, as we do this day: Behold, I bring you good tidings of great joy, which shall be to all people; for unto you is born this day, in the city of David, a Saviour, Which is Christ the Lord!
      responsory: |-
        R. Blessed is God's holy Mother, Mary, maiden undefiled. * This day hath she brought forth the Saviour of the world.
        V. Blessed is she that believed; for there is a performance of all those things which were told her from the Lord.
        R. This day hath she brought forth the Saviour of the world.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 2:33-40
      text: At that time, Joseph and Mary, the mother of Jesus were marvelling at the things spoken concerning Him. And Simeon blessed them, and said to Mary His mother, Behold, this Child is destined for the fall and for the rise of many in Israel, and for a sign that shall be contradicted. And your own soul a sword shall pierce, that the thoughts of many hearts may be revealed. There was also Anna, a prophetess, daughter of Phanuel, of the tribe of Aser. She was of a great age, having lived with her husband seven years from her maidenhood, and by herself as a widow to eighty-four years. She never left the temple, with fastings and prayers worshipping night and day. And coming up at that very hour, she began to give praise to the Lord, and spoke of Him to all who were awaiting the redemption of Israel. And when they had fulfilled all things as prescribed in the Law of the Lord, they returned to Galilee, into their own town of Nazareth. And the Child grew and became strong. He was full of wisdom, and the grace of God was upon Him.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Book 2
      text: |-
        We see that God's abounding grace is poured forth on all by the birth of the Lord, and that the gift of prophecy is not denied to the righteous, but to the unbelieving. Simeon prophesieth that our Lord Jesus Christ is set for the fall and rising again of many in Israel, setting forth that the just and the unjust reap different fruits from the coming of the Saviour; so will it be with us; according to our individual works will the True and Just Judge apportion to us punishment or reward.

        See, a sword shall pierce through thine own soul also. We have no record or tradition that Mary left this world by suffering a violent death, and the material sword can pierce the body only, and not the soul. Wherefore here we see the wisdom of Mary in that she was not ignorant of the heavenly mysteries. For, the word of God is quick, and powerful, and sharper than any two-edged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart: for all things are naked and opened unto the eyes of the Son of God, from Whom also the secret things of our conscience are not hidden.

        There had been a triple prophecy; the prophecy of Simeon had followed the prophecy of the virgin, and the prophecy of the wife; those, namely, of Mary and Elizabeth. And now ought the widow also to prophesy, that no sex nor state might be wanting. And Anna is brought before us with such a title from her widowhood and her life, that we may well believe that she received the grace to announce the Advent of the Redeemer. In our exhortation addressed to widows we have already treated of her gifts at length, and, as we have much matter before us, we will not now again enter on the subject.
      responsory: |-
        R. The Word was made flesh, and dwelt among us. * And we beheld His glory, the glory as of the Only-begotten of the Father, full of grace and truth.
        V. All things were made by Him, and without Him was not anything made.
        R. And we beheld His glory, the glory as of the Only-begotten of the Father, full of grace and truth.
      status: verified
