nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gregory, the third of that name, a Syrian by race, son of John, Gregory the Second having died, by the unanimous consent of clergy and people, and also by a certain divine instinct, since he was the most worthy of all, was put in his place, in the year of Christ 731. A man of singular learning and virtue, versed in Latin and Greek, of wonderful fluency of speech, and of so happy a memory that he recited the whole Psalter from memory; one whom the wisest men judged to be equalled in learning and prudence to his predecessor Gregory.

        A most keen defender of the Catholic faith, he tried by paternal admonitions and letters to bring Leo the Isaurian, the iconoclast emperor, back to a saner mind. But when he accomplished nothing, having convened at Rome a council of ninety-five bishops, he confirmed the veneration of sacred images by apostolic decree and struck the iconoclasts with a dread anathema. When these things came to the ears of Leo, he began to rage more loudly, and sent against Gregory a most flourishing fleet with a most powerful army: but this, by the will and vengeance of God, tossed by a cruel tempest in the Adriatic, perished in foul shipwreck.

        He also suffered many unjust things from Liutprand king of the Lombards, who both besieged the City in a long siege and plundered the basilica of St. Peter with sacrilegious hand. In these straits the most holy Pontiff, after the example of his predecessor, sent legates with sacred gifts to Charles Martel. He fortified the walls of the City: he distributed large alms to the poor, built new basilicas from the foundations, adorned and restored the old, the Vatican especially, within which he erected an oratory enriched with gold, silver, gems, and every kind of precious work, in which he placed and exposed for veneration the relics of the holy Apostles and Martyrs, sought out with the greatest care and diligence through the whole circuit of the Christian world, at the very time when the image-destroyers were trampling on them with diabolical fury. He restored many monasteries, and furnished them with holy laws; and he decreed that priests and monks should celebrate the divine praises in turns, by night and by day. At length, worn out by labours, though renowned for merits and virtues, the eleventh year of his pontificate not yet completed, on the fourth day before the Kalends of December he piously died in the Lord, and was buried in the aforesaid oratory in the Vatican.
      status: draft
