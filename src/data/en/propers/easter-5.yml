nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Cyprian, Bishop and Martyr, On the Good of Patience
      text: |-
        In speaking of patience, beloved brethren, and in preaching on its benefits and advantages, how can I better begin than by pointing out the fact that now, just for you to listen to me, I see that patience is necessary, as you could not even do this, namely, listen and learn, without patience. For only then is the word of God and way of salvation effectively learned, if one listens with patience to what is being said. Dearly beloved brethren, there are diverse paths of heavenly wisdom, wherein we are invited to walk, if we would reach in the end the reward which God hath prepared to crown hope and faith: but I find no path more useful toward life, nor more sure toward glory than this, that while we humbly strive, in all fear, and in all godliness, to obey the commandments of the Lord, we should set our chiefest guard in an unceasing watch over our patience. The philosophers also say that they take this path, but their patience is as much a sham as their wisdom is a cheat, for who can be wise or patient who knoweth nothing of God's wisdom or God's patience?

        But as for us, dearly beloved brethren, we are the real philosophers, whose wisdom lieth not in words but in deeds, and is manifested not in dresses but in the truth. We are they whose knowledge hath the inward consciousness, not the idle boasting, of strength. We are not speakers of high-sounding words, but livers of holy lives, as servants and worshippers of God. Yea, God is Himself the Source, the Fountain, and the Greatness of patience, and it behoveth man to love what is beloved of God. That good thing which he loveth is commended unto him of God's Majesty. If God be our Lord and Father, let us follow after the example of our Lord and Father's patience, since it is the duty of servants to be obedient, and of sons to be home-minded.

        By our patience God draweth us toward Himself, and keepeth us His Own. Patience doth soothe anger, bridle the tongue, govern the mind, keep peace, set rules of self-control, break the onset of lust, still the swelling of temper, put out the fire begotten of hatred, make the rich meek, and relieve the need of the poor: patience doth guard in virgins their blessed wholeness; in widows, their careful purity; in such as be married, their single-hearted love one toward the other. Patience doth teach such as be successful to be lowly-minded: such as be unfortunate, to be brave: and all to be gentle when they are wronged and insulted. Patience maketh a man soon to forgive them that trespass against him, and if he have trespassed against any, long and humbly to ask his pardon. Patience doth fight down temptations, bear persecution, and endure unto the end in suffering, and in uplifting of our testimony. Patience is the moat that guardeth the stout foundations of the castle of our faith.
      responsory: |-
        R. Bless ye God in the congregations, alleluia. * Even the Lord, ye that are of the fountains of Israel, alleluia, alleluia.
        V. Sing forth the honour of His Name, make His praise glorious.
        R. Even the Lord, ye that are of the fountains of Israel, alleluia, alleluia.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 16:5-14
      text: 'At that time, Jesus said to His disciples: I go to him that sent me, and none of you asketh me: Whither goest thou? But because I have spoken these things to you, sorrow hath filled your heart. But I tell you the truth: it is expedient to you that I go: for if I go not, the Paraclete will not come to you; but if I go, I will send him to you. And when he is come, he will convince the world of sin, and of justice, and of judgment. Of sin: because they believed not in me. And of justice: because I go to the Father; and you shall see me no longer. And of judgment: because the prince of this world is already judged. I have yet many things to say to you: but you cannot bear them now. But when he, the Spirit of truth, is come, he will teach you all truth. For he shall not speak of himself; but what things soever he shall hear, he shall speak; and the things that are to come, he shall shew you. He shall glorify me; because he shall receive of mine, and shall shew it to you.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 94 on the Gospel of John
      text: |-
        The Lord Jesus told His disciples what things they should suffer after that He was gone away from them, and then He said: "These things I said not unto you at the beginning, because I was with you; but now I go My way to Him That sent Me." Let us first see whether it had been that He had not told them before this what they were to suffer in time coming. That He had done so amply before the night of the last Supper, is testified by the three first Evangelists, but it was when that Supper was ended that, according to John, He said: "These things I said not unto you at the beginning, because I was with you."

        Are we then to try and loose the knot of this difficulty by asserting that, according to these three Evangelists, it was on the eve of the Passion, albeit before the Supper, that He had said these things unto them, and therefore not at the beginning, when He was with them, but when He was about to leave them, and go His way to the Father? And in this way we might reconcile the truthfulness of what this Evangelist saith here, "These things I said not unto you at the beginning," with the truthfulness of the other three. But this explanation is rendered impossible by the Gospel according to Matthew, who telleth us how that the Lord spake to His Apostles concerning their sufferings to come, not only when He was on the point of eating the Passover with them, but at the very beginning, when the names of the twelve are first given, and they were sent forth to do the work of God.

        It would seem then that when He said: "These things I said not unto you at the beginning, because I was with you," He meant by "these things," not the sufferings which they were to bear for His sake, but His promise of the Comforter Who should come to them, and testify while they suffered. This Comforter then, or Advocate, (for the Greek word "Parakletos" will bear either interpretation,) would be needful to them when they saw Christ no more, and therefore it was that Christ spoke not of Him "at the beginning" while He Himself "was with" His disciples, because His visible Presence was then their sufficient comfort.
      responsory: |-
        R. I will sing a new song unto thee, O God, alleluia. * Upon a psaltery of ten strings will I sing praises unto thee, alleluia, alleluia.
        V. Thou art my God, and I will praise thee: Thou art my God, and I will exalt thee.
        R. Upon a psaltery of ten strings will I sing praises unto thee, alleluia, alleluia.
      status: verified
