collect:
  text: |
    Let us pray.
    Grant us, we beseech thee, O Lord, so to imitate what we revere, that we may learn to love even our enemies; for we celebrate the Finding of the holy body of him who knew how to pray for his very persecutors to our Lord Jesus Christ:
    Who with thee liveth and reigneth, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. And Stephen, full of grace * and fortitude, did great signs among the people.
    V. The righteous shall flourish like the palm tree:
    R. He shall grow up like the cedar of Libanus.
    Let us pray.
    Grant us, we beseech thee, O Lord, so to imitate what we revere, that we may learn to love even our enemies; for we celebrate the Finding of the holy body of him who knew how to pray for his very persecutors to our Lord Jesus Christ:
    Who with thee liveth and reigneth, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: draft

prime-antiphon:
  text: 'They stoned Stephen, * calling upon God, and saying: Lay not this sin to their charge.'
  status: verified

prime-lectio:
  text: 'And falling on his knees, he cried with a loud voice, saying: Lord, lay not this sin to their charge. And when he had said this, he fell asleep in the Lord. And Saul was consenting to his death.'
  citation: Acts 7:59
  status: verified

terce-antiphon:
  text: The stones of the brook * were sweet to him; all the souls of the righteous follow him.
  status: verified

terce-capitulum:
  text: |
    And Stephen, full of grace and fortitude, did great wonders and signs among the people.
    R. Thanks be to God.
    V. Thou hast crowned him with glory and honour, O Lord.
    R. And madest him to have dominion over the works of thy hands.
  citation: Acts 6:8
  status: verified

sext-antiphon:
  text: O my God, my soul followeth hard after thee, * for my flesh hath been stoned for thy sake.
  status: verified

sext-capitulum:
  text: Now there arose some of that which is called the synagogue of the Libertines, and of the Cyrenians, and of the Alexandrians, and of them that were of Cilicia and Asia, disputing with Stephen. And they were not able to resist the wisdom and the spirit that spoke.
  citation: Acts 6:9-10
  status: verified

