  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Eusebius, a Greek by race, the son of a physician, was established Bishop of the Roman Church after holy Marcellus. He found heretics in the City, whom, upon their repentance, he reconciled to the Church by the laying on of hands alone. To him the noble woman Restituta, coming from Sardinia, entrusted her son to be instructed; him, excellently imbued with the Christian faith, he baptized, and gave his own name, calling him Eusebius. A scion plainly worthy of so great a Pontiff, through whom, as afterwards Bishop of Vercelli, the Catholic faith, almost extinguished in the East, revived in a happier offspring.

        This holy Pontiff, imitating the mercy of Christ Jesus the good shepherd, showed himself kindly even toward those who through fear of persecution had fallen into idolatry; but he thereby offended the harsh severity of some of the clergy, under a certain Heraclius as leader. Their ardent zeal flared up so against Eusebius that they not only provoked him but, by stirring up disorders and discord at Rome, gave the tyrant Maxentius occasion to banish the holy Pontiff to Sicily, as though he were an author of sedition, to restore public quiet, he being the mediator of peace. There, worn out by the hardships of exile, he ended his life on the sixth day before the Nones of October. His body was afterwards carried to the City and laid in the cemetery of Callistus on the Appian Way. Later the holy Supreme Pontiff Damasus placed a metrical epitaph on the sepulchre of Eusebius, in which, recalling the calumnies of the malicious, his exile and his death, he declared the holy bishop Eusebius a Martyr. He ruled the Church two years, eight months, and sixteen days; and in one ordination in the month of December he created thirteen priests, three deacons, and fourteen bishops for various places.
      status: draft
