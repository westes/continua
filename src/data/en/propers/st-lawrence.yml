nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Leo the Great, Sermon for St. Lawrence's Birthday
      text: |-
        Then the fury of the heathen power was raging against Christ's choicest members, in aiming in especial at such as were of the Priestly Order, the wicked persecutor turned fiercely on the Levite Lawrence, who was remarkable, not only as a minister of the Sacraments, but also as distributor of the property of the Church, promising himself a double prey by the taking of this one man, namely, to make him betray the consecrated treasure, and apostatise from the true faith. The wretch was thus doubly fired by his greed for money and his hatred of the truth, his greed urging him to seize the gold, and his wickedness to rob a believer of Christ. He demanded of the upright keeper of the sacred treasury, to bring him the wealth of the Church, for which his rapacity longed. But the pureminded Levite showed him where these riches were stored, by bringing before him a great multitude of holy poor, by the feeding and clothing of whom he had laid up all that he had, in such wise, that it could be lost no more, and was now all the safer, as the way of spending it had been the holier.

        The baffled thief chafed, and his hatred for the godliness which had appointed such an use of riches, flaming forth, he attempted the robbery of a dearer treasure from him in whose hands he had found no coin, even to take from him that possession wherein he had holier wealth. He commanded Lawrence to deny Christ, and made ready to assail the immovable firmness of the Levite's soul with appalling tortures, of which the failure of the first was followed by the application of others more fearful still. When his limbs had been mangled and cut by many stripes, his tormentor ordered them to be roasted over a fire. He was laid on an iron grating, the bars of which by the continual fire below, became themselves burning hot, so that by turning and rearranging his limbs upon them, his agony was kept keener, and his suffering made to last longer.

        Cruel savage! thou gainest nothing, and advancest nothing. That which can die passeth by degrees beyond the reach of thy tortures, and when Lawrence departeth to heaven, thou and thy fires are conquered. The love of Christ could not be overcome by the flames, and the glow that scorched the outward man was colder than that that burnt in the inner. Thou didst rage, O thou persecutor, thou didst rage against the Martyr, but by making keener his agony, thou hast but made nobler his palm. What did thine imagination fail to discover that could minister to the glory of him who conquered thee, since even the means of his execution have turned to the honour of his triumph? Wherefore, dearly beloved brethren, let us rejoice with spiritual joy, and make our boast in the Lord, Who is wonderful in His Saints, and hath given unto us, in them an help and an example. Let us, I say, make our boast of the extraordinary happiness of the illustrious Lawrence's end, in that same Lord Who hath so glorified the name of His servant throughout the whole world, that from the rising of the sun unto the going down thereof, wheresoever the constellation of the Levitical lights shineth, even as Jerusalem is made glorious by Stephen, so Rome is made famous by Lawrence.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 12:24-26
      text: At that time, Jesus said to His disciples, Amen, amen, I say to you, unless the grain of wheat falls into the ground and dies, it remains alone. But if it dies, it brings forth much fruit. He who loves his life, loses it; and he who hates his life in this world, keeps it unto life everlasting. If anyone serves Me, let him follow Me; and where I am there also shall My servant be. If anyone serves me, My Father will honor him.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tract 51 on John (on John 12:24-26)
      text: |-
        The Lord Jesus was Himself a corn of wheat that was to die and bring forth much fruit; to die by the unbelief of the Jews, and to bring forth much fruit in the faith of the Gentiles. He, exhorting men to follow His steps, saith: He that loveth his life shall lose it. Now, these words may be understood in two ways. First: he that loveth his life shall lose it, that is, If thou love life, thou wilt lose it; if thou wilt live for ever in Christ, refuse not to die for Christ. Or secondly: he that loveth his life shall lose it; love not then that which thou shalt lose; love not this present life, so that thou be thereby in jeopardy of losing life eternal.

        What this second interpretation is the meaning of the Gospel appeareth most probable from the words which follow: And he that hateth his life in this world, shall keep it unto life eternal. From which we may suppose the sense of the first words to be: He that loveth his life in this world shall lose it unto life eternal. This is a great and marvellous saying, showing how a man may so love life as to lose life, and so hate life as to keep life. If thou love it too well, then dost thou hate it; if thou hate it with an holy hatred, then dost thou love it. Blessed are they that, lest they should so love it as to lose it, so hate it as to keep it.

        Beware, lest thou take these words: He that hateth his life in this world shall keep it unto life eternal as some do, for an approval of suicide. Some evil and perverse men, bloody and guilty murderers of themselves, do indeed throw themselves into the fire, drown themselves in water, and cast themselves down precipices, and so perish. This is not the teaching of Christ, Who, when the devil would have Him cast Himself down from an high place, answered: Get thee behind Me, Satan. It is written, Thou shalt not tempt the Lord thy God. Who also said to Peter, signifying by what death he should glorify God: When thou wast young thou girdedst thyself and walkedst whither thou wouldest; but when thou shalt be old, another shall gird thee, and carry thee whither thou wouldest not. From which it is evident that he that would follow Christ's footsteps, must be slain, not by himself, but by another.
      status: verified

octave-readings/~-octave-day-2:
  source: Sermon of St. Augustine, Bishop
  text: |
    I believe that ye know the history of the sufferings of that most blessed Martyr, Lawrence, whose birth-day we are keeping this day, and I doubt not, my beloved brethren, but that ye may know what agonies he endured under the persecutors. So illustrious is the glory of his martyrdom, that the splendour thereof shineth throughout the whole world. And this light, which Lawrence maketh so clearly to shine throughout the world, is the light of the fire wherewith he himself was enkindled. By the flames which he endured, he hath made hot every Christian heart.

    Who is there but knoweth how that Lawrence chose rather to burn in earthly flames for a while, than to suffer the eternal fire of hell? The example, therefore, of blessed Lawrence provoketh us to lift up our testimony, kindleth our faith, and setteth our love all a-glow. If for us there are now no fires of persecution, the flame of faith is not therefore quenched. We give not our bodies to be burned for Christ's sake, but our hearts burn with His love. The persecutor stirreth up no fire around me, but a fire is stirred up in me by the longing for the presence of my Saviour.

    But that the Saviour hath a fire of His own we read in the Gospel, where the Lord saith I am come to send fire on the earth, and what will I but that it be kindled? Luke xii. 49. It was this fire which had been enkindled in the two disciples when they said Did not our heart burn within us, while He talked with us by the way, and while He opened to us the Scriptures? Luke xxiv. 32. It was because this fire had been enkindled within him that the blessed Lawrence felt not the burning of the flames, and through eager yearning for the sight of Christ perceived not the cruelty of his persecutor.
  responsory: |
    R. The Levite Lawrence wrought a good work, in that with the sign of the Cross he gave sight to the blind, * And dispersed among the needy the riches of the Church. V. He hath dispersed, he hath given to the poor his righteousness endureth forever. R. And dispersed among the needy the riches of the Church.
  status: verified

octave-readings/~-octave-day-3:
  source: From a Sermon of St. Augustine, Bishop
  text: |
    We read that Ananias, Azarias, and Misael, those most blessed youths, being shut up by the king in a furnace of fire, walked amid the flames of their torment, and trod the fiery globes beneath their feet. Wherefore blessed Lawrence too is to be set before us with no less glory; for they walked amid the flames of their torment, but he lay down in the very fire of his own punishment; they trampled the flames beneath the tread of their feet, but he quenched them by the stretching out of his own sides.

    Again, blessed Lawrence is turned upon his back, and his loins are burned with fire, that the prophecy of the psalm might be fulfilled, which speaks in the person of Lawrence: Prove me, O Lord, and try me; burn my loins and my heart. He asks, indeed, to be burned with a twofold fire. For if he spoke only of the one fire of this world, it would have been enough to offer his loins alone to be burned by the flames. But nothing burns the heart save the flame of Christ.

    Let us pray, then, brethren, to blessed Lawrence, who by his faith overcame the flames of his persecutor, and hath shown us how, through the fire of faith, to overcome the fires of hell, and by the love of Christ to have no fear of the day of judgment. But let us, most beloved brethren, if we wish to attain to the fellowship of the holy martyrs, think on the imitation of the martyrs. For they ought to recognize in us something of their own virtues, that they may be found worthy to intercede with the Lord on our behalf.
  responsory: |
    R. The Levite Lawrence wrought a good work, in that with the sign of the Cross he gave sight to the blind, * And dispersed among the needy the riches of the Church. V. He hath dispersed, he hath given to the poor his righteousness endureth forever. R. And dispersed among the needy the riches of the Church.
  status: draft

octave-readings/~-octave-day-4:
  source: From the book On the Duties of the Clergy of St. Ambrose, Bishop
  text: |
    Let us not pass by the holy Lawrence, who began to weep when he saw Sixtus his Bishop being led to martyrdom, not because Sixtus was going to suffer, but because he himself was going to remain behind. And so he began to say to him such words as these Father, whither goest thou without thy son Holy Priest, dost thou fare hence without a Deacon It hath never been thy use to offer sacrifice without a minister. What therefore in me hath displeased thee, my Father Hast thou tried me and found me unworthy to be called thy son Make trial if I am indeed an useless servant, even I, whom thou didst choose to commit unto me the administration of the cup of the Blood of the Lord unto me, to whom thou gavest part in the celebration of the Sacraments, dost thou refuse part with thee in thy blood-shedding

    Lib. 2., cap. 28., post medium. When he was asked for the treasures of the Church, he answered that he would show them. The next day he brought the poor. When he was asked where were the treasures which he had promised, he pointed to the poor and said These are the treasures of the Church. And in good sooth, he was right. They are treasures indeed, in whom Christ is, and in whom the belief in Christ is. The Apostle saith We have this treasure in earthen vessels. 2 Cor. iv. 7. What better treasures hath Christ than they in whom He hath said that He Himself is For thus is it written I was an hungered, and ye gave Me meat I was thirsty, and ye gave Me drink I was a stranger, and ye took Me in, and then Inasmuch as ye have done it unto one of the least of these My brethren, ye have done it unto Me. Matth. xxv. 35, 40. These were the treasures which Lawrence showed, and he had the better of his persecutors, for these were treasures which they could not take away.

    Was it not said to blessed Lawrence Thou hadst no right to disperse the riches of the Church, or to sell the vessels which were used for the Sacraments If any man is to do thus, it is a thing which must be done with the most upright honesty and the most wise discretion. If any man do it for his own profit, it is surely a sin, but if it be done to help the poor or redeem slaves, it is a work of mercy. For no man can say, Why doth the needy live or, Why ought we to ransom slaves No man can challenge it, if it be done to build the temple of God. No man can rebuke it, if a rule be stretched to bury the remains of the faithful. No man can grieve that the departed find rest in Christian burial-places. For these three objects it is lawful to break, melt down, or sell the vessels of the Church, even after they have been in use.
  responsory: |
    R. The Levite Lawrence wrought a good work, in that with the sign of the Cross he gave sight to the blind, * And dispersed among the needy the riches of the Church. V. He hath dispersed, he hath given to the poor his righteousness endureth forever. R. And dispersed among the needy the riches of the Church.
  status: verified

octave-readings/~-octave-day-5:
  source: Sermon of St. Maximus, Bishop
  text: |
    It is an holy thing, brethren, and a thing well-pleasing in the sight of God, to venerate with special earnestness the Birth-day of blessed Lawrence, in the radiance of whose flames the victorious Church of Christ doth, even unto this day, shine splendidly throughout all the world. He discharged the office of a Deacon at the seat of the most glorious of the Patriarchates, and by the purity of his stainless life, and the brilliant victory of his noble death, hath gained himself a place in the fellowship of the Apostles. It is not an exaggeration to claim something in common with the Apostles for one whose purity of soul gave him the ministry of a Levite, and whose fulness of faith hath crowned him with the dignity of Martyrdom.

    When the worshipful Sixtus, Bishop of the city of Rome, was overcoming through suffering the wickedness of a frantic world, and was now drawing very nigh to the kingdom of heaven, he saw Lawrence very sorrowful at the death of his ghostly father, and he is said to have addressed to him, in the spirit of prophecy, these words Be not sorrowful, my son yet three days, and thou shalt follow me. Hence it appeareth, dearly beloved brethren, that the blessed Lawrence was not sorrowful because of his Bishop's victory, but because he was not going to equal his Bishop in conquering the world. Be not sorrowful, my son, said Sixtus, yet three days, and thou shalt follow me, that is to say Be not sorrowful, as though thou wert left alone in the world thy faith and thy life will not suffer thee to go without such a death as thou wouldest.

    For the Eve of the Assumption. At that time, as Jesus spake unto multitudes, a certain woman of the company lifted up her voice, and said unto Him: Blessed is the womb that bare thee. And so on.

    Homily by St. Augustine, Bishop of Hippo. 10th Tract on John, near the beginning. Blessed is the Virgin Mary, because she did the will of the Father. Matth. xii. 50. This it was that the Lord praised in her, namely, that she did the will of His Father, not that her flesh had given birth to His Flesh. Be kind enough to give me your attention, my dear brethren. When the Lord amazed the crowd by working signs and wonders, and showing thereby What was veiled in His Flesh, a woman, in the astonishment of her mind, cried out Blessed is the womb that bare thee, and the paps which Thou hast sucked. But He said Yea, rather, blessed are they that hear the Word of God, and keep it. That is to say Even My Mother, whom ye call blessed, hath her blessedness from this, that she keepeth the word of God not because it was in her that the Word of God was made Flesh, and dwelt among us, but because she heareth and keepeth that Word of God by Which she was made, John i. 3, and Which in her was made Flesh.
  responsory: |
    R. The Levite Lawrence wrought a good work, in that with the sign of the Cross he gave sight to the blind, * And dispersed among the needy the riches of the Church. V. He hath dispersed, he hath given to the poor his righteousness endureth forever. R. And dispersed among the needy the riches of the Church.
  status: verified

octave-readings/~-octave-day-8:
  source: From the Book of Ecclesiasticus
  text: |
    Sir 51:1-3 1 A prayer of Jesus the son of Sirach. I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour. 2 I will give glory to thy name: for thou hast been a helper and protector to me. 3 And hast preserved my body from destruction, from the snare of an unjust tongue, and from the lips of them that forge lies, and in the sight of them that stood by, thou hast been my helper.

    Sir 51:4-7 4 And thou hast delivered me, according to the multitude of the mercy of thy name, from them that did roar, prepared to devour. 5 Out of the hands of them that sought my life, and from the gates of afflictions, which compassed me about: 6 From the oppression of the flame which surrounded me, and in the midst of the fire I was not burnt.

    Sir 51:8-13 8 My soul shall praise the Lord even to death. 9 And my life was drawing near to hell beneath. 10 They compassed me on every side, and there was no one that would help me. I looked for the succour of men, and there was none. 11 I remembered thy mercy, O Lord, and thy works, which are from the beginning of the world. 12 How thou deliverest them that wait for thee, O Lord, and savest them out of the hands of the nations. 13 Thou hast exalted my dwelling place upon the earth and I have prayed for death to pass away.

    Sir 51:14-17 14 I called upon the Lord, the father of my Lord, that he would not leave me in the day of my trouble, and in the time of the proud without help. 15 I will praise thy name continually, and will praise it with thanksgiving, and my prayer was heard. 16 And thou hast saved me from destruction, and hast delivered me from the evil time. 17 Therefore I will give thanks, and praise thee, and bless the name of the Lord.

    From one of the Tracts upon John, written by St. Augustine, Bishop of Hippo. 27th, near the end. Brethren, we know that all we who are in the body of the Lord, and abide in Him that He also may abide in us, must needs in this world live even unto the end among the wicked; by the wicked I mean not such as blaspheme Christ, for it is now but few who are found who blaspheme Him with their tongue, but many there be who do it by their lives. Among such we must needs live, even unto the end. But what is it that He said, He that abideth in Me and I in him? John xv. 5. Is it not that whereunto the Martyrs gave ear, He that endureth to the end shall be saved? Matth. x. 22.

    In what wise abode in Him the holy Lawrence whose Feast-day we keep to-day? He abode in Him until trial came; he abode in Him until He was browbeaten by the tyrant; he abode in Him until his fearful sentence came; he abode in Him even unto death. That is saying but a little of him; he abode in Him even in savage torture. He was not slain quickly, but tortured in the fire. He was allowed to remain long alive, and yet not allowed to remain long alive, but slowly put to death.

    During that long death, in all that agony, since he had well eaten and well drunk, filled with that Food, and drunken with that Cup, he felt not the torture. Nor the holy Martyr Xystus, whose day we kept five days ago, had said unto him: Be not sorrowful, my son (for he was the Bishop and Lawrence the Deacon,) be not sorrowful, said he, yet three days and thou shalt follow me.

    These three days of which he spake were the three clear days which elapse between the day of the passion of holy Xystus, and this day, the day of the passion of holy Lawrence. The three days are those between. Owhat a strange comfort! He saith not: Be not sorrowful, my son; the persecution will come to an end, and thou wilt be safe, but Be not sorrowful, whither I go, thither shalt thou follow me, and the time will not be long. Three clear days shall pass, and then thou shalt be with me. Lawrence received the prophecy, conquered the devil, and entered into his triumph.

    From the Holy Gospel according to John. John 12:24-28.

    At that time: Jesus said unto His disciples: Amen, Amen, I say unto you, Except a corn of wheat fall into the ground and die, it abideth alone. And so on.

    Homily by St. John Chrysostom, Patriarch of Constantinople. 66th on John. This present life is sweet, and full of many pleasures, not indeed for all, but for those who love it. But if one should have cast his looks heavenward, and studied the excellent things that are there, he will forthwith despise this present life and hold it of no moment. So is bodily comeliness esteemed, only as long as we see none fairer, but as soon as a comelier appeareth, the first is held cheap.

    And thus if we will look at the beauty above, and study the loveliness of the kingdom in heaven, we shall forthwith loose the ties that bind us to this world. The ties that bind us to this world are the love of earthly things. Listen to what Christ saith, to draw us to loosen these ties. He that loveth his life shall lose it, and he that hateth his life in this world shall keep it unto life eternal.

    This hath the sound of a puzzle, and yet it is full of the most excellent wisdom. How shall he that loveth his life lose it? He shall lose it by yielding to its senseless lusts, by indulging any of its lusts more than he ought. Whereas he that hateth his life in this world, shall keep it unto life eternal, by not obeying it when it demandeth things hurtful.

    Christ saith not, He that obeyeth it not, but, He that hateth it. For even as we cannot bear to hear the voice or see the face of them whom we hate, so doth it behove us to turn angrily away from our own life, if it demand from us anything contrary to the will of God. He was about to speak to them touching death, even His Own death, and He foresaw their grief and faintness, and spake in strong expressions, as though He said: What shall I say, if ye take not My death bravely? Unless ye also die, ye shall gain no profit.
