collect:
  text: |
    Let us pray.
    Stir up, we beseech thee, Lord, the wills of thy faithful people, that they, plenteously bringing forth the fruit of good works, may of thee be plenteously rewarded.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: The kingdom of heaven * is like to a grain of mustard-seed, which is the least of all seeds, but, when it is grown, it is the greatest among herbs.
  status: verified

magnificat-antiphon:
  text: The kingdom of heaven * is like unto leaven, which a woman took and hid in three measures of meal till the whole was leavened.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 24:15-35
      text: 'At that time, Jesus said to His disciples: When you see the abomination of desolation, which was spoken of by Daniel the prophet, standing in the holy place - let him who reads understand - then let those who are in Judea flee to the mountains; and let him who is on the housetop not go down to take anything from his house; and let him who is in the field not turn back to take his cloak. But woe to those who are with child, or have infants at the breast in those days! But pray that your flight may not be in the winter, or on the Sabbath. For then there will be great tribulation, such as has not been from the beginning of the world until now, nor will be. And unless those days had been shortened, no living creature would be saved. But for the sake of the elect those days will be shortened. Then if anyone say to you, ‘Behold, here is the Christ,’ or ‘There He is,’ do not believe it. For false christs and false prophets will arise, and will show great signs and wonders, so as to lead astray, if possible, even the elect. Behold, I have told it to you beforehand. If therefore they say to you, ‘Behold, He is in the desert,’ do not go forth; ‘Behold, He is in the inner chambers,’ do not believe it. For as the lightning comes forth from the east and shines even to the west, so also will the coming of the Son of Man be. Wherever the body is, there will the eagles be gathered together. But immediately after the tribulation of those days, the sun will be darkened, and the moon will not give her light, and the stars will fall from heaven, and the powers of heaven will be shaken. And then will appear the sign of the Son of Man in heaven; and then will all tribes of the earth mourn, and they will see the Son of Man coming upon the clouds of heaven with great power and majesty. And He will send forth His angels with a trumpet and a great sound, and they will gather His elect from the four winds, from one end of the heavens to the other. Now from the fig tree learn this parable. When its branch is now tender, and the leaves break forth, you know that summer is near. Even so, when you see all these things, know that it is near, even at the door. Amen I say to you, this generation will not pass away till all these things have been accomplished. Heaven and earth will pass away, but my words will not pass away.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Book 4, Commentary on Matthew 24
      text: |-
        This injunction to whoso readeth, to understand, showeth that there is here something mysterious. In Daniel we read as followeth: "And in the midst of the week the sacrifice and the oblations shall be taken away and in the temple there shall be the abomination of desolation, even until the consummation of the time and a consummation shall be given to the desolation" (ix. 27). It is of this same thing that the Apostle speaketh, when he saith that a man of iniquity, even an adversary, shall be exalted against whatsoever is called God, or is worshipped so that he shall even dare to stand in the temple of God, and to show himself as God whose coming shall, according to the working of Satan, destroy and banish away from God all who shall receive him.

        This prophecy may be understood either (first) simply of Antichrist, (secondly) of the statue of Caesar, which Pilate set up in the Temple, or (thirdly) of the statue of Hadrian on horse-back, which hath stood, even until our own day, upon the site of the Holy of Holies. In the Scriptures of the Old Testament "abomination" is a word very often used for an idol, and the farther title "of desolation" is added to identify an idol erected upon the site of the desolate and ruined temple.

        But we may also understand by the abomination of desolation, any bad doctrine and when we see such a thing get a standing in the Holy Place, that is, in the Church, and showing itself that it is God, that is, pretending that it is His revealed truth, then will be the time when it will be our duty to flee from Judea into the mountains, that is to say, to leave the letter, which passeth away, and all guise of Jewish superstition, and to hie us unto the everlasting hills, from whence God doth right wondrously cause His light to shine forth (Ps. lxxv. 5). Then will it be our duty to find ourselves under a roof and in an house, wherethrough the fiery darts of the wicked one can never pierce to smite us, and not to come down to take anything out of the house of our old conversation, or to have regard unto those things which are behind but rather to sow in the field of the spiritual Scriptures, that we may reap thereof a bountiful harvest neither to have two coats, that thing forbidden to Apostles (Matth. x. 10).
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
