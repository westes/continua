collect:
  text: |
    Let us pray.
    O God, Who didst give thy blessed Archangel Raphael unto thy servant
    Tobias to be his fellow wayfarer, grant unto us, thy servants, that
    the same may ever keep and shield us, help and defend us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. I am the Angel Raphael * who stand before the Lord; but bless ye God, and tell of all His wondrous works, alleluia.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who didst give thy blessed Archangel Raphael unto thy servant
    Tobias to be his fellow wayfarer, grant unto us, thy servants, that
    the same may ever keep and shield us, help and defend us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |-
    Christ, of the angels praise and adoration,
    Father and Saviour thou, of every nation,
    Graciously grant us all to gain a station,
    Where Thou art reigning.

    Angel Physician, health on man bestowing,
    Raphael send us from the skies all glowing,
    All sickness curing, wisest counsel showing
    In doubt and danger.

    May the fair Mother of the Light be over us,
    Virgin of peace, with all the angel chorus,
    And may the heavenly army go before us,
    Guiding and guarding.

    O May the Godhead, endless bliss possessing,
    Father, Son, Spirit, grant to us this blessing;
    All His creation joins His praise confessing,
    Now and forever. Amen.
  status: verified

lauds-capitulum:
  text: Then thou didst pray with tears, and didst bury the dead, and didst leave thy dinner, and didst hide the dead in thine house through the day, and bury them in the night, I offered up thy prayer before the Lord.
  citation: Tob 12:12
  status: verified

lauds-hymn:
  text: |
    Christ, of the angels praise and adoration,
    Father and Saviour thou, of every nation,
    Graciously grant us all to gain a station,
    Where thou art reigning.

    Angel all peaceful, to our dwellings send us,
    Michael, from heaven coming to befriend us,
    Breathing serenest peace may he attend us,
    Grim war dispelling.

    Angel of strength, who triumphed, tumults quelling,
    Gabriel send us, ancient foes expelling,
    Oft in these temples may he make his dwelling,
    Dear unto heaven.

    Angel physician, health on man bestowing,
    Raphael send us from the skies all glowing,
    All sickness curing, wisest counsel showing
    In doubt and danger.

    May the fair Mother of the Light be o'er us,
    Virgin of peace, with all the angel chorus,
    And may the heavenly army go before us,
    Guiding and guarding.

    O may the Godhead, endless bliss possessing,
    Father, Son, Spirit, grant to us this blessing;
    All his creation joins his praise confessing,
    Now and forever. Amen.
  status: verified

