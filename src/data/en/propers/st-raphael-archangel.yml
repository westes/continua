matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: When Tobias went in, * he found a young man with his loins girded, and as it were ready to set forth, and knowing not that it was an Angel, he saluted him.
      - psalms:
          - 10
        antiphon: 'The Angel Raphael * hid himself, and said: I am Azarias, the son of Ananias the Great.'
      - psalms:
          - 14
        antiphon: I will bring thy son safely * into the land of the Medes, and bring him back safely unto thee again, alleluia.
      - psalms:
          - 18
        antiphon: 'And the Angel said: * Take the fish by the gill, and draw him out of the water.'
      - psalms:
          - 23
        antiphon: Tell me, I pray thee, * brother Azarias, to what use is that which thou hast bidden me keep of the fish.
      - psalms:
          - 33
        antiphon: The gall is a healing to the eyes, * but the virtue of the heart and the liver putteth the power of the devil to flight.
    versicle:
      v: There was given unto the Angel much incense.
      r: That he should offer it upon the golden altar, which is before the presence of the Lord.
  nocturn2:
    groups:
      - psalms:
          - 95
        antiphon: Here is Sara * the daughter of Raguel, who shall be given unto thee to wife, and all her substance with her.
      - psalms:
          - 96
        antiphon: She hath had seven husbands, * who were all strangled by an evil spirit; I am afraid lest the like should befall me.
      - psalms:
          - 102
        antiphon: Spend three days * in prayer with thy wife, that thou mayest obtain the blessing of sons, in the seed of Abraham.
    versicle:
      v: The smoke of the incense ascended up before the Lord.
      r: Out of the Angel's hand.
  nocturn3:
    versicle:
      v: The Angel Raphael took hold on the evil spirit.
      r: And drove him away into the desert of Upper Egypt.

vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: The Angel Raphael was sent * unto Tobias and Sara to heal them.
    - psalms:
        - 110
      antiphon: 'The Angel went in unto Tobias, * and said: Joy be ever with thee.'
    - psalms:
        - 111
      antiphon: Be of good courage, Tobias, * for it is nigh at hand that God shall heal thee.
    - psalms:
        - 112
      antiphon: Bless ye the God of Heaven, * and confess Him before all living, for He hath had mercy upon you.

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bonaventure, Sermon 5 on the Holy Angels
      text: |-
        Raphael means God's healing, and we should observe that the way out of evil lies through three blessings bestowed on us through Raphael's healing. For Raphael the Healer leads us forth from weakness of soul and brings us into the bitterness of contrition; whence in the book of Tobit Raphael says: When thou enterest into thy house, anoint his eyes with gall. He did so, and he saw. Why could not Raphael do this himself? Because an Angel does not bestow compunction, but he shows the way to it. By gall, the bitterness of contrition is to be understood, for it heals the inner eyes of the mind. The Psalmist says: He healeth those that are broken in heart. This is the best eye salve. In the second chapter of the Book of Judges it is written that an angel came up to the place of the weepers, and said to the people: I made you to go up out of Egypt; I have done all of these good things for you: and all the people wept, so that the place was called the Place of the Weepers. Dearly beloved, all day long the Angels are telling us of God's blessings, and recalling them to our minds: Who hath created thee? Who hath redeemed thee? What hast thou done? Whom hast thou offended? When thou considerest this, thine only remedy is to weep.

        Secondly, Raphael brings us forth from our slavery to the devil, by recalling Christ's Passion to our mind. There is a figure of the Passion in the sixth chapter of Tobit, where it is said that if a piece of the heart is put on the embers, its smoke will drive out all kinds of devils. It is said in the eighth chapter of Tobit that Tobias put a piece of the heart on the embers, and Raphael bound the devil in the utmost parts of Egypt. What does this mean? Was Raphael unable to bind the devil unless the heart was put on the embers? Surely a fish's heart could not give such strength to an Angel? By no means! It would be impossible unless there was a mystery in this. We are to understand that nothing so frees us from the devil's slavery as the Passion of Christ, which issued from the root of his heart, or of his love. For the heart is the fountain, or hot centre, of all life. Therefore if thou puttest the heart of Christ, that is the Passion, that he underwent, issuing from the root of charity and the fountain of heat, on the embers, that is, on the flame of memory: then immediately the devil will be bound, and he will be unable to hurt thee.

        Thirdly Raphael delivers us from God's displeasure, which we incur by transgressing against God; he does this by leading us to instant prayer: and this is what Raphael said to Tobit in the twelfth chapter: When thou didst pray with tears, I did bring your prayers before the Lord. For the Angels reconcile us to God, as far as they are able. The devils are accusers before God, but the angels excuse us, when they offer our prayers, and when they urge us to pray devoutly. In the eighth chapter of the Revelation of St. John it is said: The smoke of the incense ascended up before God out of the Angel's hand. This sweet smelling incense is the prayer of the saints. Dost thou wish to appease God, whom thou hast offended? Then pray devoutly. They offer thy prayer, so that they may reconcile thee to God. It is said in the Gospel of St. Luke, that Christ being in an agony, prayed more earnestly, and there appeared an Angel of the Lord strengthening him. And all of this was done for our sake: for he had no need of strengthening, but it was to show that the Angels willingly assist those who pray devoutly, and help and strengthen them, and bring their prayers before God.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 5:1-4
      text: At that time, there was a feast of the Jews, and Jesus went up to Jerusalem. Now there is at Jerusalem, by the Sheepgate, a pool called in Hebrew Bethsaida, having five porticoes. In these were lying a great multitude of the sick, blind, lame, and those with shriveled limbs, waiting for the moving of the water. For an Angel of the Lord used to come down at certain times into the pool, and the water was troubled. And the first to go down into the pool after the troubling of the water was cured of whatever infirmity he had.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Homily 35 (or 36) on John
      text: |-
        What manner of mystery is this? What does it reveal? for it is not written without a purpose: but the future is foretold in figure and similitude lest the unexpected occurrence of a wondrous event should in any way disturb the faith of the hearers. What, then, is here described? In the future a baptism was to be given, full of power and of the greatest grace, a baptism that would wash away all sin, that would restore life to dead men. These facts then are depicted figuratively, in the pool and in all the other circumstances. And first in this figure the water is set forth, which washes away stains of the body, and those things that are not actually dirty, though they were thought to be so, such as coming in contact with a corpse, or a leper, and such like: it is to be seen that many things under the old law are cleansed by water, in accordance with this idea.

        But let us now return to the subject. First defilements of the body are washed out, and then God heals various infirmities by means of water. For because God would bring us nearer to the grace of baptism, he not only cleanses defilements but heals diseases. For those figures which come nearest to the reality, in baptism, the Passion, and others are seen more clearly than the older ones. For it is the same with those who form a king's bodyguard: they are more splendidly apparelled than those at the other end of his equipage. And the angel came down and troubled the water, and imbued it with healing power; so that the Jews might learn that the Lord of Angels had far more power to heal all the diseases of the soul. But just as here it was not simply the natural property of the water that healed, but it happened through the work of the Angel: so it is not simply water that works on us, but after the water has received the grace of the Spirit, then it looses us from all sin.

        Around this pool lay a great multitude of impotent folk, of blind, halt, withered, waiting for the moving of the water. But then those who wished for healing were prevented by infirmity from receiving it, while now everyone is able to come forward. For the Angel does not trouble the water, but the Lord of Angels brings all things to come to pass. We may no longer say, While I am coming, another steppeth down before me. But even should the whole world come, the grace would not be used up, neither would its power nor effectual working come to an end. For as the sun's rays shine forth each day without burning out, and as they spread abroad without losing any of their light: far less is the operation of the Spirit diminished by the multitudes who receive it.
      status: verified
