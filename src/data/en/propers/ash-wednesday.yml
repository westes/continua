nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matthew 6:16-21
      text: At that time, Jesus said to His disciples, "When you fast, do not look gloomy like the hypocrites, who disfigure their face in order to appear to men as fasting. Amen I say to you, they have received their reward. But you, when you do fast, anoint your head and wash your face, so that you may not be seen fasting by men, but by your Father, Who is in secret; and your Father, Who sees in secret, will reward you. Do not lay up for yourselves treasures on earth, where rust and moth consume, and where thieves break in and steal; but lay up for yourselves treasures in heaven, where neither rust nor moth consumes, nor thieves break in and steal. For where your treasure is, there also will your heart be."
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Book 2 on the Lord's Sermon on the Mount, ch. 12
      text: |-
        It is evident that by these precepts we are bidden to seek for inner gladness, lest, by running after that reward which is without, we should become conformed to the fashion of this world, and should so lose the promise of that blessing which is all the truer and more stable that it is inward, that blessing wherein God hath chosen us to be conformed to the likeness of His Son. In this chapter we will principally consider the fact that vain-glory findeth a ground for its exercise in struggling poverty as much as in worldly distinction and display; and this development is the most dangerous, because it entices under pretence of being the serving of God.

        He that is characterised by unbridled indulgence in luxury or in dress, or any other display, is by these very things easily shown to be a follower of worldly vanities, and deceiveth no one by putting on an hypocritical mask of godliness. But those professors of Christianity, who turn all eyes on themselves by an eccentric show of grovelling and dirtiness, not suffered by necessity, but by their own choice, of them we must judge by their other works whether their conduct really proceedeth from the desire of mortification by giving up unnecessary comfort, or is only the means of some ambition; the Lord biddeth us beware of wolves in sheep's clothing, but by their fruits, saith He, ye shall know them.

        The test is when, by diverse trials, such persons lose those things which under the cover of seeming unworldliness they have either gained or sought to gain. Then must it needs appear whether they be wolves in sheep's clothing, or indeed sheep in their own. But that hypocrites do the contrary maketh it no duty of a Christian to shine before the eyes of men with a display of needless luxury; the sheep need not to lay aside their own clothing because wolves sometimes falsely assume it.
      responsory: |-
        R. I came this day unto the well, and I besought the Lord, and said: * O Lord God of Abraham, Thou hast prospered my way.
        V. Therefore the virgin to whom I shall say, Give me water of thy pitcher to drink, and she shall say to me, Drink, my lord, and I will give thy camels drink also; let the same be the woman whom the Lord hath appointed out for my master's son.
        R. O Lord God of Abraham, Thou hast prospered my way.
      status: verified
