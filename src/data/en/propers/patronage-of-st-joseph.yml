nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        The general rule governing all the singular graces communicated to any rational creature is this: whenever divine grace chooseth someone for some sublime state of grace, it bestoweth upon him every gift that is necessary for that person so chosen and for his office, and that adorneth him abundantly. This was most of all verified in St. Joseph, the supposed father of our Lord Jesus Christ, and true spouse of the Queen of the world and Lady of the Angels — who was chosen by the eternal Father to be the faithful nurse and guardian of His principal treasures, namely His Son and His Spouse, an office which he fulfilled most faithfully. For this the Lord saith unto him: Well done, good and faithful servant, enter thou into the joy of thy lord.

        If thou compare him to the whole Church of Christ, is he not that chosen and singular man through whom, and under whom, Christ was orderly and honourably brought into the world? If, then, the whole holy Church is debtor to the Virgin Mother, because through her she was made worthy to receive Christ, so, next after her, doth she owe to Joseph a singular grace and reverence. For he is the key of the Old Testament, in which the dignity of the patriarchs and prophets attaineth the fruit that was promised them. Moreover, he alone is he who bodily possessed what divine condescension had promised them. Rightly, then, is he prefigured by that patriarch Joseph, who kept in store the grain for the peoples. But he surpasseth him even in this: for he nourished with much diligence, not only bread for the bodily life of the Egyptians, but for all the elect the Bread from heaven, which bestoweth heavenly life.

        Assuredly we ought not to doubt that Christ, in heaven, did not deny — but rather fulfilled and consummated — the familiarity, reverence, and most sublime dignity which He showed him while He lived among men, as a son toward his father. Whence not without cause is it added, in the word proposed by the Lord: Enter thou into the joy of thy lord. And though the joy of eternal blessedness entereth into the heart of man, the Lord chose rather to say to him, Enter into the joy, that it might be mystically understood that this joy is not only within him, but on every side surrounding and absorbing him, and, as it were, an infinite abyss engulfing him. Remember us, then, blessed Joseph, and by the pleading of thy prayer intercede with thy supposed Son; and render to us gracious the most blessed Virgin, thy spouse, who is the Mother of Him Who liveth and reigneth with the Father and the Holy Ghost, world without end. Amen.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 3:21-23
      text: 'At that time: it came to pass, when all the people were baptized, that Jesus also being baptized and praying, heaven was opened; and the Holy Ghost descended in a bodily shape, as a dove, upon him; and a voice came from heaven: Thou art my beloved Son; in thee I am well pleased. And Jesus himself was beginning about the age of thirty years, being -- as it was supposed -- the son of Joseph.'
      status: verified
    - nocturn: 3
      isGospel: false
      text: |-
        It is plain that the words, "As was supposed, the son of Joseph," were said on account of those who thought him born of Joseph as other men are born of their fathers. But as for those who are troubled that Matthew names one set of ancestors, descending from David down to Joseph, while Luke names another, ascending from Joseph up to David, it is easy for them to see that Joseph could have had two fathers: one by whom he was begotten, another by whom he was adopted. For it was an ancient custom, even among that people of God, to adopt as sons those whom one had not begotten. Whence it is understood that Luke took up in his Gospel the father of Joseph by whom he was adopted, not by whom he was begotten, and traces his ancestors upward until he reaches David.

        For since it must needs be, both Evangelists narrating truly — that is, Matthew and Luke — that one of them should hold to the origin of the father who begot him, and the other to the origin of the father who adopted Joseph, which is it more probable that we should understand held to the origin of the adopter, rather than of him who refused to say Joseph was begotten by him whose son he nonetheless narrates him to be? Matthew, however, saying, "Abraham begot Isaac, Isaac begot Jacob," and so persevering in this word, "begot," until at the last he saith, "And Jacob begot Joseph," hath sufficiently shown that he traced the line down to the father by whom Joseph was not adopted, but begotten.

        Yet even if Luke had said that Joseph was begotten by Heli, this word ought not to trouble us so as to make us believe otherwise than that one Evangelist commemorated the begetting father, the other the adopting father. For it is not absurd to say that a man hath begotten, not by flesh but by love, one whom he hath adopted as his son. Indeed even we, to whom God hath given power to become His sons, He begot not of His own nature and substance, as He did His Only Son, but rather adopted us through love.
      status: verified

octave-readings/~-octave-day-2:
  source: Sermon of St. Bernardine of Siena; Homily of St. Augustine, Bishop
  text: |
    The marriage between Mary and Joseph was a real marriage, for it was contracted under divine inspiration. Now in marriage there is so close a union of souls that the bridegroom and the bride are said to be one person, for which reason marriage is like unto the very perfection of unity. Hence how can any discerning mind think that the Holy Spirit would unite, in a union of this intimacy, a mind such as the Virgin's, with the soul of a man who had not within him the operation of a godliness like unto hers? Wherefore I believe that this Joseph was holy, the chastest of men and a virgin, completely humble, burning with a passion of charity towards God, and full of the highest graces of contemplation. And since the Virgin knew that he was given her by the Holy Spirit to be her spouse, and the faithful guardian of her virginity, and to share besides in devoted love and affectionate care towards that One who was, in the divinest fashion, the very offspring of God, therefore I believe that she sincerely loved Saint Joseph with all the affection of her heart.

    Now Joseph was most ardent in his love for Christ. For who, pray, would deny that Christ, whether as a child or as a grown man, would most deeply inspire ineffable affection, and the peculiar joys which he alone could give, in one who held him in his arms and conversed at will with him? Who can reckon the bliss of receiving from the Christ Child those gazes of filial love, or his words spoken as a devoted son, or the giving of his trustful embraces? O how sweet were the kisses that Joseph received from him! O how sweet to hear the little One lisp the name of father, and how delightful to feel his gentle caresses! Think again how often, when the little Jesus was growing bigger and was wearied with much walking on the journeys which they made, Joseph must have been filled with compassion, and so carried him at rest in his bosom. For Joseph bore towards Jesus all the fulness of an adoptive love, as to a most dear son, given to him by the Holy Ghost in his Virgin bride.

    Hence it was that a most prudent Mother, who knew the devotion of Joseph to Jesus, said to her Son, when she found him in the temple: "Son, why hast thou thus dealt with us? Behold, thy father and I have sought thee sorrowing." In order to understand this, we must note that Christ hath within himself, as it were, two savours: sweetness and bitterness. And since the most holy Joseph was in a wonderful manner a partaker of these two savours, therefore the Blessed Virgin doth bestow upon him, in a special sense, the title of Father of Christ. This is the only place where we read that she did call Saint Joseph the father of Jesus — doubtless because the bitterness of sorrow which he felt at the loss of Jesus showed the fatherly affection which he bore him. For if, according to human laws which are approved by God, a man can adopt as his son the child of another family, how much more truly ought the Son of God to be called the Son of Joseph, seeing he was given to this Joseph by his most holy Spouse, in the wonderful mystery of a virginal marriage. And so it is also to be believed that in Joseph there were these two savours toward Jesus, the sweetness of paternal love and the bitterness of his compassion.

    Joseph cannot be denied the name of father of Christ, merely because he did not beget him by union of the flesh; for he would have been called the father of any child whom he adopted, even if the child were not the issue of his wife, but from another family. It is true that Christ was supposed to be the son of Joseph in another sense — namely, in that of having been actually begotten by Joseph according to the flesh; but this supposition was made only by those from whom Mary's virginity was concealed. Of this Luke saith: "And Jesus himself began to be about thirty years of age, being, as was supposed, the son of Joseph." Yet Luke sheweth no hesitation in giving the name of parent, not to Mary only, but also to Joseph, when in another place he saith: "And the child grew, and waxed strong in spirit, filled with wisdom, and the grace of God was upon him; and his parents went every year to Jerusalem, at the Feast of Passover."

    But lest anyone should think that by the word "parents" there is here to be understood Mary and her forbears only, we must take into account what Luke recordeth earlier: "And Joseph and his mother marvelled at those things which were spoken of him." Since, therefore, Luke witnesseth that Christ was born, not by the begetting of Joseph, but of the Virgin Mary, how can he call Joseph the father of Jesus, except in the sense that Joseph was a real husband to Mary by virtue of the true bond of marriage, saving only that there never was any carnal intercourse between them? And yet, on account of this bond of marriage, Joseph was the father of Jesus in a much closer sense — seeing that the Christ Child was born of his wife — than if Joseph had adopted Jesus from another family. Hence, also, if anyone could prove that Mary did not trace her origin from David, the same reasoning by which Joseph is called the father of Christ would be sufficient reason for giving Christ the name Son of David.

    Luke giveth the genealogy not at the beginning of his Gospel, but after the account of the Baptism of Christ, and not in the descending order, but in the ascending — more as if he were pointing to Christ as Priest, making atonement for sins, since this was the occasion when the voice spake in testimony from heaven, and when John also gave testimony, saying: "Behold the Lamb of God, Which taketh away the sin of the world." By thus beginning with Jesus and tracing back, Luke passeth up through Abraham and eventually cometh to God, to whom we are reconciled after purification and atonement. Rightly then doth Luke give the origin by adoption, for through adoption and faith in the Son of God we become God's sons. In this fashion Luke sheweth clearly enough why he nameth Joseph as the son of Heli — not because Joseph was begotten by Heli, but because he was adopted by him. For Luke calleth Adam himself the son of God, and this because he was made by God — but by grace, which afterwards he lost in sinning, being set as a son in the paradise of Eden.
  responsory: |
    R. The people cried to Pharaoh for bread * And he answered them Go unto Joseph. Alleluia. V. The saving of our lives is in thy hand; only let us find grace in thy sight, and we will gladly be Pharaoh's servants. R. And he answered them Go unto Joseph. Alleluia.
  status: verified

octave-readings/~-octave-day-3:
  source: Sermon of St. John Chrysostom; Homily of St. Augustine, Bishop
  text: |
    It was the custom in ancient times for betrothed brides to dwell in the houses of their bridegrooms; and it would seem that Mary thus dwelt with her Spouse. And herein we find answer to the question: Why did not the virgin conception take place before Mary was wedded? In order that the mystery might be hid in the meantime, and that the Virgin might escape all danger of evil suspicion. For Joseph had the best right to be moved by jealousy; yet we see that he not only refrained from sending away his espoused, or branding her with infamy, but that he received her as his own, and did cherish her after she conceived. And verily it is evident that he would never have kept her in his house, or ministered to all her needs, if he had not clearly come to know that she had conceived by the operation of the Holy Ghost.

    "Joseph, being a just man, and not willing to make her a public example, was minded to put her away privily." After the Evangelist hath told us that she was with child of the Holy Ghost, and not of any carnal union, he bringeth testimony from another source to confirm the statement. For lest anyone should say, "And how can this be proved? Who saw it? Who ever heard of any such thing having happened?" and lest you might think that a disciple had invented this tale to please his Master, the Evangelist thus bringeth forward the grief of Joseph, and what he did thereafter, to confirm the story — as if to say: "If ye will not believe me, or if ye hold my testimony in suspicion, at least believe the husband."

    "Joseph her husband," it saith, "being a just man." To be just, as the word is here used, implieth that full growth of righteousness which cometh from the habitual service of God. Being therefore a just man — that is, a worthy and good man — he was minded to put her away privily. Thus the Evangelist recordeth the grief of this just man before he knew the secret of the virgin conception, lest thou shouldst have doubts concerning what happened after he knew that secret. And certainly, if Mary had been such as suspicion would make her out to be, she would have deserved not only to be denounced, but to be punished by the authority of the Law. But Joseph was not only unwilling to condemn her, but even to denounce her. Herein thou dost see an instance of a man full of spiritual understanding, and free from the tyranny of suspicion. But was this a matter of mere suspicion, seeing that the very swelling of her body seemed to prove the fact? Nonetheless, this man was so pure, and so free from that kind of jealousy, that he would not cause the Virgin even the slightest grief; and although he lived under the Law, his understanding was above the Law — for now that the reign of grace was approaching, it was fitting that there should be a shining example of a more sublime spirituality than was common under the Law.

    Thus was it said from heaven over the water of the Jordan: "This is My beloved Son, in Whom I am well pleased" — even as it was said also on the mount. Nor is it that, because a voice from heaven sounded there too, He was not the Son of God before; since He Who took the form of a servant from the Virgin's womb, being in the form of God, thought it not robbery to be equal with God. Indeed the same Apostle Paul clearly declareth elsewhere: "But when the fulness of the time was come, God sent forth His Son, made of a woman, made under the Law, that He might redeem them that were under the Law, that we might receive the adoption of sons." He therefore is the Son of God, Who, according to His divinity, is the Lord of David, and at the same time, according to the flesh, is the Son of David, and of the seed of David.

    Were it not profitable for us to believe this, the same Apostle would not have exhorted Timothy so earnestly, saying: "Remember that Jesus Christ, of the seed of David, is risen again from the dead, according to my Gospel." Why then should any follower of the holy Gospel be troubled that Christ, Who was born of the Virgin without union with Joseph, hath His line of descent traced by the Evangelist Matthew through Joseph rather than through Mary — or that, because of Joseph's descent from David, the Evangelist should call Christ the Son of David? First, because the genealogy of her husband would be preferred to hers as a matter of honour to the male sex — for even though he was not joined to her in the union of the flesh, he was not on that account any the less her husband, since Matthew himself witnesseth that Mary was called the wife of Joseph by the Angel, and yet also saith that she had conceived by the Holy Ghost.

    Since, then, one and the same narrator both maketh and approveth all these statements — that Joseph was the husband of Mary; that the Mother of Christ was a Virgin; that Christ was of the seed of David; and that Joseph was in the line of Christ's ancestors from David — what remains, but that Mary too was not a stranger to the kindred of David, and that she was not falsely given the title of Joseph's wife on account of the due order of sex and the bond of their souls; and that Joseph, chiefly on account of his dignity as a man, was not to be separated from that line of genealogy, lest he should thereby appear separated from that woman to whom the affection of his heart bound him?
  responsory: |
    R. The people cried to Pharaoh for bread * And he answered them Go unto Joseph. Alleluia. V. The saving of our lives is in thy hand; only let us find grace in thy sight, and we will gladly be Pharaoh's servants. R. And he answered them Go unto Joseph. Alleluia.
  status: verified

octave-readings/~-octave-day-4:
  source: Sermon of St. John Chrysostom; Homily of St. Ambrose, Bishop
  text: |
    "Joseph, thou son of David, fear not to take unto thee Mary thy wife." But what is "to take"? Undoubtedly, to maintain, and that in his own house — for he had already sent her away in his mind. But now the Angel commandeth: her whom thou wouldst send away, maintain; her, do thou, and not her parents, maintain, for God joineth her to thee — joineth her to thee, not in the sacred commerce of marriage, but in the fellowship of a common home, and joineth her to thee through the ministry of my words. Just as Christ Himself later entrusted her to the care of His disciple, so now the Angel giveth her to her spouse, in such manner that she may have the consolation of his company without other conjugal rights. By this means her confinement would be explained in a worthier and more honourable way, and suspicion would be wholly allayed. It is as though the Angel said: Not only was she not dishonoured by an unlawful embrace, but indeed she is fruitful in a manner above nature and usage; therefore grieve not at the happy confinement of thy Bride, but break forth into greater joy — for that which is conceived in her is of the Holy Ghost.

    "And she shall bring forth a Son, and thou shalt call His Name Jesus." That is: think not that the ministry of this great dispensation, because it is of the Holy Ghost, is a thing apart from thee. For even though thou hast no part in His generation, since the Virgin remaineth inviolate, yet do I readily grant thee this — namely, that thine are all the rights of a father, in so far as they obscure not the dignity of the Virgin; thou shalt certainly give the new-born His Name, thou shalt be the first to call Him by His Name. For even though He Who is born is not thy son, nonetheless thou shalt shew Him the care and solicitude of a parent, and therefore I unite thee to Him by this immediate giving of the Name. But, lest anyone might think from this that Joseph was the begetter of Christ, the Angel was first careful to say: "She shall bring forth a Son." He doth not say, "She shall bear thee a son," but maketh His statement in an undetermined and indefinite way; for Mary did not bear a son to Joseph, but brought forth Christ to the whole world.

    Therefore the Evangelist relateth that the Angel brought His Name from heaven, so that thus might be shewn how wonderful was His birth, seeing that He Himself taught His Name to Joseph by an Angel sent from God. For this Name, which verily containeth a thousand treasures of good, was not given without meaning. Therefore the Angel doth himself interpret it, thereby consoling Joseph's grief with good hopes, and thus also inviting him to believe these words — for we are easily summoned to that which is pleasant, and give prompt credence unto good tidings. Wherefore the Angel said: "He shall save His people from their sins." This also sheweth the novelty of the gift. For he announceth that this people are to be saved, not indeed from external wars, nor from the swords of barbarians, but from what is far greater than these — from their sins — which no mere man could ever accomplish.

    No one should be troubled at the words, "As was supposed, the son of Joseph." For it was no more than a supposition, seeing that Christ was not the son of Joseph by nature; but it was so supposed because Mary, who was espoused to her husband Joseph, gave Christ birth. And so, referring to Joseph as father, it is written: "Is not this the carpenter's son?" We have already discussed why the Lord of salvation chose to be born of a Virgin; we have also discussed why she was an espoused Virgin when her conception took place, and why it took place at the time of the enrollment for taxing. Nor does it seem out of place to explain why Christ had a working-man for His father. For thereby is figured Christ's divine Father, Who as Maker of all things framed the world. Even though human and divine matters be not equal to each other, yet is this figure a complete one: Christ's Father worketh by fire and by breathing on things. Yea, like a good carpenter of the soul, He chippeth away our defects; promptly doth He lay His axe to the barren trees and hew them down; skilful is He in correcting whatever is built scantily, and in buttressing whatever is to be built magnificently; He tempereth the hardness of hearts as with fire and with His gentle breath, and by His diverse workings He formeth the quality of the human race.

    We might wonder why the genealogy of Joseph, rather than of Mary, is given — since Mary conceived Christ by the Holy Ghost, and Joseph had no part in the Lord's conception — were it not that Holy Scripture teacheth us how it was the custom to trace descent on the male side. For in this fashion the person of the man is set forth as pre-eminent, and his dignity maintained, even as it is wont to be done in the Senate and the other high places of the commonwealth. And how unseemly it would have been to have passed over the lineage of the father, and to have given that of the mother, since the doing so would have appeared to proclaim to all the peoples of the world that Christ had no father! It is a world-wide custom to trace the genealogy of a family in the male line. Therefore be not perplexed that the lineage of Joseph is given: forasmuch as Christ was born in the flesh, He was bound to follow this custom of the flesh, and He Who came into the world had to be enrolled for taxing in the worldly manner — the more so that Joseph's descent was the same as Mary's.

    But some explanation is required as to why Saint Matthew reckoneth Christ's descent from Abraham forward, whilst Saint Luke traceth the same from Christ backward to the creation of Adam by God. By this Luke would have us understand that Christ's lineage should be traced to God, because God was Christ's true Progenitor — both as His Father, of Whom He was begotten, and as the Author, in the laver of baptism, of the mystical gift of the Spirit. Wherefore Luke doth not begin his Gospel with the reckoning of Christ's lineage, but recordeth it after the account of the Baptism, thereby shewing forth in baptism the working of God, the Author of all things. Thus also Luke asserteth that Christ came forth from God according to a certain rule of orderliness, for he weaveth all things together to prove that Christ is, by nature, by grace, and in the flesh, the Son of God. But what more evident proof of Christ's divine descent could we have than what Luke giveth? For before the Evangelist reckoneth the genealogy of Christ, he giveth the words of the Father Himself: "This is My beloved Son, in Whom I am well pleased."
