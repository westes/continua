octave-readings/~-octave-day-8:
  source: Sermon of St. Augustine, Bishop; Homily of St. Augustine, Bishop
  text: |
    The Angel did not speak falsely when he said to Joseph: "Fear not to take unto thee Mary thy wife." She is called wife because of the mutual confidence established between them at the time of her espousal, although he had not known her carnally, nor was he ever so to do; and the name of wife was not lost or rendered untrue because there had not been, nor would there ever be, any union of the flesh. For she was indeed the Virgin, and therefore was she a holier and more wonderful source of joy to her husband, in that she became fruitful without a man's part — unlike him in her offspring, yet like him in faithfulness. On account of this faithful union, both of them merited the name of Christ's parents: not only is she called His Mother, but he also is called His father, as the husband of His Mother — both in mind, not in flesh. But whether he was a father only in mind, or she a mother both in mind and flesh, yet both were the parents of His humility, not of His glory; of His infirmity, not of His divinity.

    For the Gospel doth not lie, where it saith: "And His Father and His Mother marvelled at those things which were spoken of Him." And in another place: "His parents went to Jerusalem every year." And a little further on: "And His Mother said unto Him: Son, why hast Thou thus dealt with us? Behold, Thy father and I have sought Thee sorrowing." But He, to shew that, apart from them, He had a Father Who begat Him without a mother, answered them: "How is it that ye sought Me? Wist ye not that I must be about My Father's business?" And, lest anyone should think that by these words He denied His parents, the Evangelist immediately addeth: "And they understood not the saying which He spoke unto them; and He went down with them, and came to Nazareth, and was subject unto them." To whom was He subject but to His parents? And who was thus subject but Jesus Christ, Who, being in the form of God, thought it not robbery to be equal to God?

    Why then was He subject to them, who were so far below the form of God, except that He emptied Himself, taking upon Himself the form of a servant, of which form they were the parents? But truly, neither of them would have attained to the parenthood of this form of a servant, had they not also been, between themselves, husband and wife, albeit without any union of the flesh. And hence, when the ancestors of Christ are recounted in the direct line of succession, the genealogy was fittingly traced down to Joseph, as indeed it was; lest it should be a slight upon the male sex, which is rightly accorded the greater dignity — and the truth suffered nothing thereby, for both Joseph and Mary were of the seed of David, from which it was foretold that Christ should come. Thus all the goods of marriage are found fulfilled in these parents of Christ: offspring, fidelity, and the sacred bond. The offspring we know was the Lord Jesus Himself; the fidelity, in that there was no adultery; the sacred bond, in that there was no divorce.

    The day of His baptism is, in a manner, a second birthday of the Saviour. For we know that He was born with the same signs and the same wonders, but now baptized with a still greater mystery. For God saith: "This is My beloved Son, in Whom I am well pleased." Plainly the second birth is more glorious than the first. For that birth, in silence and without a witness, brought forth Christ; this baptism, with a proclamation of His divinity, revealed the Lord. There, Joseph, who was supposed to be His father, excuseth himself from the claim; here, the Father, Who was not believed, declareth Himself. There, the Mother laboureth under suspicion, because no father could be acknowledged; here, she that bore Him is honoured, because the Godhead proclaimeth Him as Its Son.

    More honoured, I say, is the second birth than the first. For here the Father is inscribed as the God of majesty; there Joseph was reckoned a craftsman. And although in both the Lord was born and baptized through the Holy Ghost, yet He That crieth out from heaven is more honoured than he that laboureth on earth. Joseph, then, a workman on earth, was supposed to be the father of the Lord and Saviour; nor is God, Who is truly the Father of our Lord Jesus Christ, excluded from this same work, for He too is a craftsman.

    For He is the Artificer Who hath wrought the fabric of this world with power not only wondrous but ineffable — like a wise architect He hath hung the heavens on high, founded the earth in its mass, and bound the seas within their bounds. He is the Artificer Who, by a certain measure, bringeth low the heights of pride and exalteth the depths of humility. He is the Artificer Who, in our own conduct, cutteth away what is superfluous and preserveth what is useful. He is the Artificer whose axe, as John the Baptist warneth us, is laid to the root of our tree: that every tree which exceedeth the rule of just discernment be cut down at the root and given to the fire, but that which hath the measure of truth be counted worthy of His heavenly building.
  responsory: |
