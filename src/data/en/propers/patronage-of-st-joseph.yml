octave-readings/~-octave-day-6:
  source: Sermon of St. Bernard, Abbot; Homily of St. Ambrose, Bishop
  text: |
    Mary was espoused to Joseph, or rather, as saith the Evangelist Luke, "to a man whose name was Joseph." He is called a man, not because he was her husband, but because he was a person of manliness; or rather, because the other Evangelist calleth him not simply "a man," but "her man," he is rightly given by desert the title which was necessarily supposed of him. He was bound, then, to be called her man, because it was necessary that he should also be so supposed; just as the Saviour's father he was not, indeed, in fact, but was worthy to be called, that he might be supposed to be so — the Evangelist himself saying: "And Jesus Himself began to be about thirty years of age, being, as it was supposed, the son of Joseph."

    There is no doubt that this Joseph, to whom the Mother of the Saviour was espoused, was a good and faithful man. Faithful, I say, and a wise servant, whom the Lord appointed to be the comfort of His Mother, the nurse of His own flesh, and, in a word, His sole and most faithful helper on earth in His great counsel. Add to this, that he is said to have been of the house of David. For truly, of the house of David, truly of royal stock, did this Joseph descend — noble in birth, nobler yet in mind. A true son of David, not degenerate from his father David; utterly, I say, a son of David, not only in flesh, but in faith, in holiness, in devotion — whom, like another David, the Lord found to be a man after His own heart, to whom He therefore safely entrusted the most holy and hidden secret of His heart; to whom also, like another David, He manifested the uncertain and hidden things of His wisdom, and granted that he should not be ignorant of a mystery which none of the princes of this world had known.

    To him, in short, was given what many kings and prophets, when they desired to see, saw not, and to hear, heard not — not only to see and to hear, but even to carry, to lead, to embrace, to kiss, and to nourish and guard. We must believe that not only Joseph, but Mary too, was descended from the house of David — for she would not have been espoused to a man of the house of David, had she not herself been of the house of David. Both, therefore, were of the house of David; but in the one was fulfilled the truth which the Lord had sworn to David, while in the other was given a conscious witness to the fulfilment of that promise.

    That Matthew should trace the lineage of Christ through Solomon, and Luke through Nathan, would seem to indicate that the one desireth to shew the royalty of Christ's descent, and the other the priestliness thereof. We need not infer from this that one is more accurate than the other; rather, each agreeth with the other, with equal good faith and veracity. For He was indeed, according to the flesh, of both a royal and a priestly family, a King sprung from kings, a Priest from priests — though the oracle speaketh not of carnal but of heavenly things: since the King rejoiceth in the strength of God, from Whom the Royal Father's judgment is given him, and He is Priest for ever, according as it is written: "Thou art a Priest for ever after the order of Melchisedech."

    Therefore both Evangelists keep well within the truth: for Matthew doth establish descent through the kings, whereas Luke, by tracing through the priests the lineage transmitted to Christ from God, manifesteth his more sacred origin. In this too is signified the figure of the calf, for everywhere he bringeth forward the mystery of the sacrificial priesthood. Nor need it surprise us that Luke giveth many more generations from Abraham to Christ than doth Matthew, since we can recognize that the line of descent is traced through different persons: it may be that some lived long lives, while men of the other line died at an immature age; for we see many old men living with their grandchildren, and others dying as soon as their children are born.

    We notice also this: that Saint Matthew recordeth Jacob, who was the father of Joseph, as the son of Matthan; whereas Luke recordeth that Joseph, to whom Mary was espoused, was the son of Heli, and that Heli was the son of Melchi. How then could one man have two fathers, namely Heli and Jacob? He is called the son of two, because he was made the son of the one according to nature, and of the other according to the Law. In this provision of the Law — regarding the raising up of seed to a brother who had died — the Jewish people did not understand that a future perpetuity of the seed of the dead was promised to us; but, taking it according to the letter, they corrupted the grace of the oracle. For that other was called brother who raised up the seed of the dead, not a brother according to the kinship of the flesh, but according to the purity of grace. And therefore, perchance, it was not the brother who redeemed, but the Man who redeemed — for it was not that own brother, but the Mediator between God and men, the Man Christ Jesus, Who spread abroad the grace of the resurrection.
  responsory: |
