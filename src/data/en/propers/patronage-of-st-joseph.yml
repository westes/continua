octave-readings/~-octave-day-7:
  source: Sermon of St. Bernard, Abbot; Homily of St. John Damascene
  text: |
    It is written: "Joseph, her husband, being a just man, and not willing to make her a public example, was minded to put her away privily." Being a just man, he was rightly unwilling to expose her — for as he would not have been a just man had he connived at known guilt, so he would have been no less unjust had he condemned proven innocence. Being a just man, therefore, and not willing to make her a public example, he was minded to put her away privily. Why did he wish to put her away? On this hear, not my opinion, but that of the Fathers. Joseph wished to put her away for the same reason that made Peter seek to put away the Lord, when he said: "Depart from me, for I am a sinful man, O Lord"; and that made the centurion also seek to keep the Lord away from his house, when he said: "Lord, I am not worthy that Thou shouldst come under my roof."

    In like manner Joseph, holding himself unworthy and sinful, said within himself that he ought no longer to enjoy the familiar companionship of one whose marvellous dignity, above his own, filled him with awe. He saw and trembled at the sure sign of the divine presence, and, since he could not fathom the mystery, he wished to put her away. Peter trembled at the greatness of that power; the centurion trembled at the majesty of that presence; Joseph too, being but a man, was filled with awe at the strangeness of this great mystery. Dost thou wonder that Joseph judged himself unworthy of the companionship of this pregnant Virgin, when thou hearest that even holy Elizabeth could not bear her presence save with trembling and reverence? For she said: "Whence is this to me, that the Mother of my Lord should come to me?"

    And so Joseph was minded to put her away. But why privily, and not publicly? Lest, that is, enquiry should be made about this separation, and a reason demanded. What should a just man reply to a stiff-necked people, a faithless and gainsaying people? If he had said what he thought, what he had proved concerning her purity, would not the unbelieving and cruel Jews soon have mocked him, and stoned her? For how would they have believed in the Truth lying silent in her womb, whom afterward they despised as He cried aloud in the temple? What would they have done to Him before He had yet appeared, who afterward laid impious hands even on Him Who shone with miracles? Rightly, then, did the just man, lest he be forced either to lie or to defame the innocent, wish to put her away privily.

    Matthew, beginning his Gospel, saith: "The book of the generation of Jesus Christ, the Son of David, the Son of Abraham" — but he doth not stop there; his own account proceedeth even to the Virgin's Spouse. Luke, however, after the declaration of the Saviour at His baptism, turneth his account somewhat aside, and writeth thus: "Jesus Himself began to be about thirty years of age, being, as was supposed, the son of Joseph, which was the son of Heli, which was the son of Matthat" — and so on, ascending upward even to Seth, "which was the son of Adam, which was the son of God." Since, then, Joseph's lineage is thus reckoned, it is shown at the same time that the Virgin herself, the Mother of God, Mary, was of the same tribe as he. For by the Law of Moses it was not lawful for any tribe to intermarry with another tribe, lest the hereditary right of one tribe should pass into another.

    Not without reason was the birth of Christ by the Holy Ghost kept from common knowledge, and Joseph taken in the place of a father, and thence, as was indeed fitting, reckoned as the Child's father. For had this not been so, the Child would have been thought fatherless, since His lineage would not have been reckoned from the father's side at all. Wherefore it was of necessity that the excellent Evangelists should reckon Joseph's lineage. For had they, passing this over, woven the line of His descent from the mother's side, that would have been unseemly, besides being contrary to the custom of the divine Scriptures. Fittingly, then, tracing Joseph's lineage from David for the reason we have given, they at the same time confirm that the Virgin Mary too sprang from David, inferring the wife's lineage together through the husband.

    That Joseph was endowed with righteousness, and led a life conformable to the Law, is plain to all. Living, moreover, by the precept of the Law, he assuredly betrothed a wife sprung from no other than his own tribe. Wherefore, if Joseph was of the tribe of Judah and of the lot and family of David, is it not fitting that Mary too should proceed from the same? Whence it came about that the Spouse's lineage was recorded. For, since by the Apostle's own word the head of the woman is the man, what can be said against this: that when the lineage of the head is recorded, the body too is recorded together with the head? I judge, then, that it hath been plainly shown that the Evangelists did not record Joseph's lineage in vain, from which it is necessarily understood that the Virgin too descended from David by consequence, and that Christ, Who was born of her by a surpassing miracle, was, before all ages, the Son of God.
  responsory: |
