nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Against Lying
      text: |-
        If we consider faithfully and carefully what it was that Jacob did by the advice of his mother, and wherein he seemeth to have deceived his father, it will appear that it is not a lie, but an allegory. If we denounce this, its mystic sense, as a lie, then must we also give the name of lies to even all parable, and to every figure devised to set forth the nature of anything, which is not to be taken in its literal sense, but in which one thing is to be understood under the name of another. And this be far from us. Whoso should do this, would bring the charge of falsehood against very many figures of speech, including that one called metaphor, in which a word is transferred from that meaning which belongeth to it, to some other, to which would, by such reasoning, be given the name of a lie.

        The deep meaning is given; but what is considered is the lie, because men do not understand the way in which that signification, which is a truth, is set forth: but the falsehood is plainly expressed, and believed. That we may understand this more plainly by taking some points in illustration, consider with me what Jacob did. It is certain that he covered his limbs with the skins of goats. If we consider his object in point of fact, we shall find that it was to lie, because he did this that he might be thought to be he who he was not. But if we consider this his deed in that deep typical sense which it undoubtedly possesseth, we find that by the goat-skins are represented sins, and by him who covered himself therewith Him Who bore not His own sins, but the sins of others.

        Verax ergo significátio nullo modo mendácium recte dici potest: as it was in the deed, so also was it in the word. For when his father said to Jacob, Who art thou, my son? he answered, I am Esau, thy first-born. If we take this in its sense relative to the two brothers, it will be apparent that it was a lie. If, however, we look at it relatively to that for the sake of which these words and deeds were written down, we shall see that Christ is here signified in His mystic body, the Church. Concerning her, He saith: Ye shall see Abraham, and Isaac, and Jacob, and all the Prophets in the kingdom of God, and you yourselves thrust out. And they shall come from the east, and from the west, and from the north, and from the south, and shall sit down in the kingdom of God. And, behold, there are last which shall be first, and there are first which shall be last. Thus did the younger take away the title and inheritance from the elder, and acquire it to himself.
      responsory: |-
        R. As Jacob went out from his own land, he saw the glory of God, and said: How dreadful is this place. * This is none other but the house of God and this is the gate of heaven.
        V. Surely God is in this place, and I knew it not.
        R. This is none other but the house of God and this is the gate of heaven.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 17:1-9
      text: At that time, Jesus took Peter, James and his brother John, and led them up a high mountain by themselves, and was transfigured before them. And His face shone as the sun, and His garments became white as snow. And behold, there appeared to them Moses and Elias talking together with Him. Then Peter addressed Jesus, saying, Lord, it is good for us to be here. If You will, let us set up three tents here, one for You, one for Moses, and one for Elias. As he was still speaking, behold, a bright cloud overshadowed them, and behold, a voice out of the cloud said, This is My beloved Son, in Whom I am well pleased; hear Him. And on hearing it the disciples fell on their faces and were exceedingly afraid. And Jesus came near and touched them, and said to them, Arise, and do not be afraid. But lifting up their eyes, they saw no one but Jesus only. And as they were coming down from the mountain, Jesus cautioned them, saying, Tell the vision to no one, till the Son of Man has risen from the dead.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Leo the Great, Homily on the Transfiguration of the Lord
      text: |-
        Jesus took Peter, and James, and John his brother, and brought them up into an exceeding high mountain apart, and manifested forth the brightness of His glory. Hitherto, though they understood that there was in Him the Majesty of God, they knew not the power of that Body which veiled the Godhead. And therefore He had individually and markedly promised to some of the disciples that had stood by Him that they should "not taste of death till they had seen the Son of Man coming in His kingdom", that is, in the kingly splendour, which is the right of the Manhood taken into God, and which He willed to make visible to those three men. This it was that they saw, for the unspeakable and unapproachable vision of the Godhead Himself, which will be the everlasting life of the pure in heart, can no man, who is still burdened with a dying body, see and live.

        When the Father saith: "This is My beloved Son, in Whom I am well pleased; hear ye Him", did they not plainly hear Him say: "This is My Son, Whose it is to be of Me and with Me without all time. For neither is He That begetteth, before Him That is begotten, neither He That is begotten, after Him That begetteth Him." This is My Son, between Whom and Me, to be God is not a point of difference; to be Almighty, a point of separation; nor to be Eternal, a point of distinction. "This is My Son, not by adoption, but My very Own; not created from, or of another substance, or out of nothing, but begotten of Me: not of another nature, and made like unto Me, but of Mine own Being, born of Me, equal unto Me."

        "This is My Son by Whom all things were made, and without Whom was not anything made that was made, Who maketh likewise all things whatsoever I make, and what things soever I do He doeth likewise, inseparably and indifferently." This is My Son Who thought it not robbery, nor hath taken it by violence, to be equal with Me, but, abiding still in the form of My glory, that He may fulfill Our common decree for the restoration of mankind, hath bowed the unchangeable Godhead even to the form of a servant. Him therefore in Whom I am in all things well pleased, by Whose preaching I am manifested, and by Whose lowliness I am glorified, Him instantly hear ye. For He is the Truth and the Life, My Power, and My Wisdom.
      responsory: |-
        R. The Angel said unto Jacob: * Let me go, for the day breaketh. And he said: I will not let thee go, except thou bless me. And he blessed him there.
        V. And when Jacob arose, behold there wrestled a man with him, until the breaking of the day; and, when he saw that he prevailed not, he said unto him:
        R. Let me go, for the day breaketh. And he said: I will not let thee go, except thou bless me. And he blessed him there.
      status: verified
