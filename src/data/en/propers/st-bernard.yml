lauds-hymn:
  text: |
    Ye mountains once flowing with milk,
    depart far hence;
    depart, ye hills, whence rivers of honey
    once poured;
    O Israel, cease to boast far and wide
    of the ancient manna.

    Behold him from whose heart they flow,
    from whose mouth pour forth fountains
    sweeter than milk, rivals
    of rivers of honey:
    from so great a mouth, so great a heart,
    no manna is sweeter.

    Dost thou ask whence arose
    so great a plenty of milk;
    whence the honeycomb, whence so ready
    a sweetness of honey;
    whence so much manna flowed,
    whence so many sweetnesses?

    The Virgin, heavenly Mother,
    poured out showers of milk;
    the mouth of the dead lion
    stirred up rivers of honey;
    the manna of the forest, and the solitude
    nearest to the dwellers in heaven.

    O Doctor Bernard, enriched
    with such gifts of heaven,
    pour down from above the dews
    of this milk, of this honey;
    pour out the drops, now possessing
    a fuller flood.

    Highest praise to the supreme Father,
    highest praise to the Son:
    may the Spirit, flowing forth from both,
    be as bread to thee, O holy one;
    as it was, now and for ever,
    equal glory.
    Amen.
  status: draft

vespers-hymn:
  text: |
    Now the Queen has reclined,
    sitting after the Only-begotten;
    the spikenard gives forth its fragrance,
    Bernard giving up his spirit.

    Sweet to the taste of the Queen
    is the sweetness of her fruit;
    sweet to her sense of smell
    is the holiness of Bernard's nard.

    Come, bride, from Lebanon,
    to be crowned by God,
    that Bernard might come
    from the furnace of the Holy Spirit.

    Who is she that goes forth
    like the shining dawn?
    Who is he that leaps over the hills,
    rejoicing with the saints?

    This glory is terrible,
    like an army set in array;
    this grace is wonderful,
    like the face of Assuerus.

    Pray for us to the Lord,
    thou sweet column of smoke;
    incline the Father of lights,
    shepherd, burning like a torch.

    Glory be to the Trinity,
    through which the triumph of the Virgin
    and the happiness of Bernard
    abide in the court of heaven.
    Amen.
  status: draft

