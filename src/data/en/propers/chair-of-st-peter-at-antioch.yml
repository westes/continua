  text: Thou art the Shepherd of the sheep, and the Prince of the Apostles * and unto thee hath God given the keys of the kingdom of heaven.
  status: verified

lauds-capitulum:
  text: Behold an high priest, who in his days pleased God, and was found righteous, and in the time of wrath he was made a propitiation.
  citation: Sir 44:16-17
  status: verified

lauds-hymn:
  text: |
    Peter, blest shepherd, hearken to our cry,
    And with a word unloose our guilty chain;
    Thou! who hast power to open the gates on high
    To men below, and power to shut them fast again.

    Praise, blessing, majesty, through endless days,
    Be to the Trinity immortal given;
    Who in pure unity profoundly sways
    Eternally alike all things in earth and heaven. Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. The Lord loved him, * and beautified him.
    R. The Lord loved him, * and beautified him.
    V. He clothed him with a robe of glory.
    R. And beautified him.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. The Lord loved him, * and beautified him.
  status: verified

lauds-versicle:
  text: |-
    V. Let them exalt Him in the congregation of the people.
    R. And praise Him in the assembly of the elders.
  status: verified

vespers-hymn:
  text: |
    Peter, whatever thou shalt bind on earth,
    The same is bound above the starry sky;
    What here thy delegated power doth loose,
    Is loosed in heaven's supremest court on high:
    To judgement shalt thou come, when the world's end is nigh.

    Praise to the Father, through all ages be;
    Praise to the consubstantial sovereign Son,
    And Holy Ghost, one glorious Trinity;
    To whom all majesty and might belong;
    So sing we now, and such be our eternal song.
    Amen.
  status: verified

vespers-responsory:
  text: |
    R.br. The Lord hath chosen him * for a Priest unto Himself.
    R. The Lord hath chosen him * for a Priest unto Himself.
    V. To offer up unto Him the sacrifice of praise.
    R. For a Priest unto Himself.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. The Lord hath chosen him * for a Priest unto Himself.
  status: verified

vespers-versicle:
  text: |-
    V. You are Peter.
    R. And on this rock I am going to build my church.
  status: verified

