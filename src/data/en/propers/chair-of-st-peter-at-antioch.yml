collect:
  text: |
    Let us pray.
    O God, Who hast given unto thy Blessed Apostle Peter the keys of the kingdom of heaven, and the power to bind and to loose, loose us, we beseech thee, at his mighty intercession, from all the bands of our sins.
    Who livest and reignest with God the Father in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Thus saith the Lord unto Simon Peter: Whatsoever thou shalt bind on earth, shall be bound in heaven; and whatsoever thou shalt loose on earth, shall be loosed in heaven.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
    O God, Who hast given unto thy Blessed Apostle Peter the keys of the kingdom of heaven, and the power to bind and to loose, loose us, we beseech thee, at his mighty intercession, from all the bands of our sins.
    Who livest and reignest with God the Father in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: draft

