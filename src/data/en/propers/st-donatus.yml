collect:
  text: |
    Let us pray.
    O God, Who art thyself the glory of thy priests, grant unto us, we beseech thee, to feel the help of thine holy martyr and bishop Donatus, whose Feast we are keeping.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. He that hateth his life * in this world, shall keep it unto life eternal.
    V. The righteous shall flourish like the palm tree:
    R. He shall grow up like the cedar of Libanus.
    Let us pray.
    O God, Who art thyself the glory of thy priests, grant unto us, we beseech thee, to feel the help of thine holy martyr and bishop Donatus, whose Feast we are keeping.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Donatus was the child of a father and mother who had both been slain for Jesus Christ's sake. He fled with the monk Hilarinus to Arezzo in Tuscany, of which city he afterwards became Bishop. There the Prefect Quadratian, during the persecution under Julian, commanded both Hilarinus and Donatus to worship idols, and when they both refused to commit such abominable iniquity, Hilarinus was beaten with clubs before the eyes of Quadratian, until he gave up the ghost. Donatus also was savagely tortured, and slain with the sword. The Christians buried their bodies honourably hard by the city.
      status: verified
