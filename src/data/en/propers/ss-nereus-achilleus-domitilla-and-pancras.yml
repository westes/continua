collect:
  text: |
    Let us pray.
    May the holy feast of thy Martyrs, Nereus, Achilleus, Domitilla and Pancras, ever comfort us, we beseech thee, O Lord, and make us worthy to serve thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Daughters of Jerusalem, * come and see the crowned martyrs, the Lord crowned them in his solemnity and delight, alleluia, alleluia.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    May the holy feast of thy Martyrs, Nereus, Achilleus, Domitilla and Pancras, ever comfort us, we beseech thee, O Lord, and make us worthy to serve thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Daughters of Jerusalem, * come and see the crowned martyrs, the Lord crowned them in his solemnity and delight, alleluia, alleluia.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Nereus and Achilles were brethren, eunuchs belonging to Flavia Domitilla, who were baptized by blessed Peter, along with her and her mother Plautilla. They had advised Domitilla to consecrate her virginity to God, and on this account Aurelian, to whom she was betrothed, accused them of being Christians. They nobly confessed the faith, and were banished to the island of Ponza. Then they were again put to the torture, and after being scourged, were taken to Terracina. At Terracina, Minutius Rufus tormented them with the rack and with fire, but as they constantly affirmed that having once been baptized by the blessed Apostle Peter, no torture could ever make them sacrifice to idols, they were beheaded. Auspicius, their own disciple and the tutor of Domitilla, took their bodies to Rome, where they were buried on the road to Ardea.
      status: verified
    - nocturn: 2
      isGospel: false
      text: The Virgin Flavia Domitilla was a Roman, the niece of the Emperors Titus and Domitian, and was veiled by the blessed Pope Clement. Aurelian, son of the Consul Titus Aurelius, to whom she was betrothed, accused her of being a Christian, and the Emperor Domitian banished her into the island of Ponza, where she long suffered and testified in prison. At length she was taken to Terracina, where she again confessed Christ, and as she seemed ever to grow firmer, the judge, under the Emperor Trajan, caused her chamber to be set on fire, and there Domitilla, with her foster-sisters the maidens Theodora and Euphrosyne, finished the race of faith by grasping the crown of glory, on the 7th day of May. Their bodies were found whole, and were buried by the Deacon Caesarius.
      status: verified
    - nocturn: 2
      isGospel: false
      text: Pancras was the son of a noble family of Phrygia. He came to Rome in the reign of the Emperors Diocletian and Maximian, being then a boy of fourteen years of age. There he was baptized by the Bishop of Rome, and brought up in the Christian faith. On this account he was soon after taken, and having constantly refused to sacrifice to the gods, he offered his neck to the executioner with manly courage, and won a glorious crown of martyrdom. The Lady Octavilla took his body by night, embalmed it with precious ointments, and buried it on the Aurelian Way.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 4:46-53
      text: At that time, there was a certain royal official whose son was lying sick at Capharnaum. When he heard that Jesus had come from Judea into Galilee, he went to him and besought Him to come down and heal his son, for he was at the point of death. Jesus therefore said to him, "Unless you see signs and wonders, you do not believe." The royal official said to Him, "Sir, come down before my child dies." Jesus said to him, "Go your way, your son lives." The man believed the word that Jesus spoke to him, and departed. But even as he was now going down, his servants met him and brought word saying that his son lived. He asked of them therefore the hour in which he had got better. And they told him, "Yesterday, at the seventh hour, the fever left him." The father knew then that it was at that very hour in which Jesus had said to him, "Your son lives." And he himself believed, and his whole household.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 28 (preached in the Basilica of these Martyrs on their feast day, on John 4:46-53)
      text: |-
        Wherefore was it that when this nobleman besought the Lord to come down where his child died, the Lord, albeit He healed him, would not come, and yet, when the Centurion prayed Him to heal his servant, albeit not asked to come down, He went with them? He deemed not that the nobleman's son was worthy of His bodily presence, but He refused not to go to help the Centurion's servant. What is this but a rebuke to earthly pride, which maketh us to respect in men their honours and riches rather than that Divine image wherein they are created? It was not so with our Redeemer, who would not go to the son of the nobleman, but was ready to come down for the Centurion's servant, to show that to Him the things which are great among men are but of little moment, and the things which are little esteemed among men are not beneath His notice.

        Our pride then standeth rebuked, that pride which maketh us forget for the sake of one man that another man is a man at all. This pride, as we have said, looketh only at the surroundings of men, not at their nature, and seeth not that God is to be honoured in a man because he is a man. Lo, how the Son of God will not go unto the nobleman's son, but is ready to go and heal the servant. Of myself I know that if any one's servant were to ask me to go to him, I have a sort of pride which would say to me silently inside my heart: Go not, thou wilt lower thyself; the Papal dignity will be lightly esteemed, thy exalted station will be degraded. Behold how He Which came down from heaven, doth not deem it below Him to go to help a servant, and yet I who am of the earth earthly, shrink from being trodden on.

        Think not therefore within yourselves what ye have, but what ye are. Behold, the world which I love, is a world which passeth away. Those holy servants of God, by whose grave I am standing, ennobled themselves mentally above the world at its fairest. To them was offered length of days, robust health, plenty in possessions, fruitfulness in offspring, comfort under perpetual peace: and yet while the spring-tide of life was unfolding before them, their hearts had already condemned it to an arid winter. Behold, winter in their hearts, spring in mine! Death, and pain, and barrenness occur all around me, I am attacked on all sides, and I feel very bitter, and yet the sting of fleshly lust so blindeth me, that I love the bitter feelings, I hunt after that which flees from me, and cling to that which would leave me.
      status: verified
