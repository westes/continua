    - nocturn: 2
      isGospel: false
      text: |-
        Among the hallowed places which have from of old time been held in honour among Christians, the most famous and sought after were those where the bodies of the Saints were buried, or where there was some trace or token of the Martyrs. Among these spots so hallowed hath been ever among the most noteworthy that place on the Vatican Hill which is called the Confession of St. Peter. Thither Christians do come from all parts of the earth as unto the rock of faith and the foundation-stone of the Church, and surround with godly reverence and love the spot hallowed by the grave of the Prince of the Apostles.

        Whither came the Emperor Constantine the Great upon the eighth day after his Baptism, and, taking off his crown, cast himself down upon the ground, and wept abundantly. Then presently he took a spade and pick-axe, and began to break up the earth, whereof he carried away twelve baskets-full in honour of the twelve Apostles, and built a Church upon that spot, appointed for the Cathedral Church of the Prince of the Apostles. This Church was hallowed by holy Pope Silvester, in like manner as he had hallowed the Church of the Lateran. In this Church did the Pope set up an altar of stone, and pour ointment thereon, and ordain that from thenceforth no altars should be set up, save of stone.

        The same Emperor Constantine likewise built a very stately Church upon the road to Ostia, in honour of the holy Apostle Paul, which Church also was hallowed by the blessed Sylvester. These Churches the Emperor enriched by grants of much land, and adorned with exceedingly rich gifts. So great was this Emperor's zeal for religion that, having destroyed the temples of idols, he built churches in many places throughout the earth, and especially at Rome, among which were the Basilica of the Holy Cross at Jerusalem in the Sessorian estate, that of St. Lawrence outside the walls in the Verano field, that of Ss. Peter and Marcellinus on the Lavican Way, and very many others.
      status: draft
    - nocturn: 3
      isGospel: true
      citation: Luke 19:1-10
      text: At that time, Jesus entered and was passing through Jericho. And behold there was a man named Zacchaeus; and he was a leading publican, and he was rich. And he was trying to see Jesus, Who He was, but could not, on account of the crowd, because he was small of stature. So he ran on ahead and climbed up into a sycamore tree to see Him, for He was going to pass that way. And when Jesus came to the place, He looked up and saw him, and said to him, "Zacchaeus, make haste and come down; for I must stay in your house today." And he made haste and came down, and welcomed Him joyfully. And upon seeing it all began to murmur, saying, "He has gone to be the guest of a man who is a sinner." But Zacchaeus stood and said to the Lord, "Behold, Lord, I give one-half of my possessions to the poor, and if I have defrauded anyone of anything, I restore it fourfold." Jesus said to him, "Today salvation has come to this house, since he, too, is a son of Abraham. For the Son of Man came to seek and to save what was lost."
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Moralia in Job, Bk. 28, ch. 27 (on Luke 19:1-10)
      text: |-
        If we would be truly wise, and behold wisdom herself, we must humbly acknowledge ourselves to be fools. Let us cast away harmful wisdom, and learn praiseworthy folly. For this reason indeed is it written: God hath chosen the foolish things of the world, to confound the wise. And again it is said: If any man among you seemeth to be wise in this world, let him become a fool, that he may be wise. And unto this doth the very Gospel bear witness, wherein it is said that Zacchaeus sought to see Jesus, Who He was; and could not for the press, because he was little of stature. And he ran before, and climbed up into a sycamore tree to see Him; for He was to pass that way. For this name Sycamore, being interpreted, signifieth the Foolish Fig.

        Little Zacchaeus therefore accepted the humiliation of having recourse to the sycamore and saw the Lord. They who humbly choose to be fools in the estimation of the world, have a deep insight into the wisdom of God. The press standeth in our way, on account of our little stature, when we are fain to see the Lord; for the toilsome din of worldly business tormenteth our weak minds, so as to hinder our perceiving the light of the truth. But we climb up wisely into the sycamore tree, if we willingly give up our minds to that folly which God giveth unto us. What can be more utter folly in this world than not to seek for that we have lost, to leave that whereof we have been robbed in the hands of our despoilers, to take no revenge for wrongs which have been done us, yea, even to offer to him that taketh away our cloak, our coat also, and be patient?

        The Lord biddeth us, as it were, to climb up into the sycamore, where He saith: Of him that taketh away thy goods, ask them not again. And again: Whosoever shall smite thee on thy right cheek, turn to him the other also. From the boughs of this sycamore tree, the Lord is seen passing by. He may indeed, as yet, not be seen face to face, but by this wise folly the inward eye may see the Wisdom of God, as it were, passing by, even that Wisdom Which they that are wise in their own conceit cannot see. They are mixed up in the overbearing press of their own imaginations, and have not yet found the sycamore tree whereinto to climb up, if they would see the Lord.
      status: verified
