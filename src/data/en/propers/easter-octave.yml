collect:
  text: |
    Let us pray.
    Grant, we beseech Thee, almighty God, that we who have celebrated the Paschal Feast, may, by Thy bounty, retain its fruits in our daily habits and behaviour.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'Now when it was late the same day, the first of the week, and the doors were shut, where the disciples were gathered together, for fear of the Jews, Jesus came and stood in the midst and said to them: Peace be to you, alleluia.'
  status: verified

magnificat-antiphon:
  text: 'After eight days * came the Lord, the doors being shut, and said unto them: Peace be unto you, alleluia, alleluia.'
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 157, for the Octave of Easter
      text: |-
        The Feast of this day is the end of the Paschal solemnity, and therefore it is today that the Newly-Baptized put off their white garments: but, though they lay aside the outward mark of washing in their raiment, the mark of that washing in their souls remaineth to eternity. Now are the days of the Pass-over, that is, of God's Passing-over our iniquity by His pardon and remission; and therefore our first duty is so to sanctify the mirth of these holy days, that our bodily recreation may be taken without defilement to our spiritual cleanness. Let us strive that our relaxation may be sober and our freedom holy, holding ourselves carefully aloof from anything like excess, drunkenness or lechery. Let us try so to keep in our souls their Lenten cleansing, that if our Fasting hath left us aught yet unwon, we may still be able to seek it.

        My discourse concerneth all them which are committed unto my spiritual charge; but, nevertheless, since the first happy week of your Sacramental life draweth this day to a close, I address myself in especial to you who are the new olive-plants of holiness round about the Table of the Lord, to you, who have but a little while been born again of water and the Holy Ghost, to you, O holy generation, to you, O new creation, to you, the excellency of my dignity, and the fruit of my labour, my brethren dearly beloved and longed for, my joy and my crown, all ye who now stand so fast in the Lord. To you I address the words of the Apostle: Behold! the night is past! the day is come! Cast off therefore the works of darkness, and put on the armour of light. Let us walk honestly, as in the day; not in rioting and drunkenness, not in chambering and wantonness, not in strife and envying: but put ye on the Lord Jesus Christ.

        We have, saith Peter, a more sure word of Prophecy, whereunto ye do well that ye take heed, as unto a light that shineth in a dark place, until the day dawn, and the day-star arise in your hearts. Let your loins therefore be girded about, and your lights burning in your hands, and ye yourselves like unto men that wait for their lord, when he will return from the wedding. Behold, the days come, whereof the Lord saith, A little while, and ye shall not see Me, and again a little while and ye shall see Me. Now is the hour whereof He said: Ye shall weep and lament, but the world shall rejoice: that is to say, this present life, wherein we walk as strangers and pilgrims, far away from Him Who is our Home, this present life is very full of trials. But, saith Jesus, I will see you again, and your heart shall rejoice, and your joy no man taketh from you.
      responsory: |-
        R. Mary Magdalene and the other Mary went very early to the sepulchre. * That Jesus whom ye seek, is not here: for He is risen, as He said: He goeth before you into Galilee; there shall ye see Him, alleluia, alleluia.
        V. And very early in the morning, the first day of the week, they came unto the sepulchre, at the rising of the sun; and, entering into the sepulchre, they saw a young man sitting upon the right side, who saith unto them:
        R. That Jesus Whom ye seek is not here: for He is risen, as He said: He goeth before you into Galilee: there shall ye see Him, alleluia, alleluia.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 20:19-31
      text: 'At that time, when it was late that same day, the first of the week, and the doors were shut, where the disciples were gathered together for fear of the Jews, Jesus came, and stood in the midst and said to them: Peace be to you. And when He had said this, He showed them His hands and His side. The disciples therefore were glad, when they saw the Lord. He said therefore to them again: Peace be to you. As the Father hath sent Me, I also send you. When He had said this, He breathed on them, and He said to them: Receive ye the Holy Ghost: whose sins you shall forgive, they are forgiven them; and whose sins you shall retain, they are retained. Now Thomas, one of the Twelve, who is called Didymus, was not with them when Jesus came. The other disciples therefore said to him: We have seen the Lord. But he said to them: Except I shall see in His hands the print of the nails, and put my finger into the place of the nails, and put my hand into His side, I will not believe. And after eight days, again His disciples were within, and Thomas with them. Jesus cometh, the doors being shut, and stood in the midst, and said: Peace be to you. Then He saith to Thomas: Put in thy finger hither, and see My hands, and bring hither thy hand, and put into My side; and be not faithless, but believing. Thomas answered and said to Him: my Lord and my God. Jesus saith to him: Because thou hast seen Me, Thomas, thou hast believed; blessed are they that have not seen, and have believed. Many other signs also did Jesus in the sight of His disciples, which are not written in this book. But these are written, that you may believe that Jesus is the Christ, the Son of God; and that, believing, you may have life in His Name.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 26 on the Gospels
      text: |-
        When we hear this passage of the Gospel read, a question straightway knocketh at the door of our mind. How was it that the Body of the Risen Lord was a real Body, if It was able to pass through closed doors into the assembly of His disciples? But we ought to know that the works of God are no more wonderful when they can be understood by man's reason, and faith has lost her worth when her subject-matter is the subject-matter of human demonstration. Nevertheless, those very works of our Redeemer which are in themselves impossible to be understood, must be thought over in connection with other of His works, that we may be led to believe in things wonderful, by mean of things more wonderful still. That Body of the Lord, Which came into the assembly of the disciples through closed doors, was the Same, Which at Its birth, had become manifest to the eyes of men by passing out of the cloister of the Virgin's womb without breaking the seal thereof. What wonder is it if that Body Which had come out of the Virgin's womb, without opening the matrix, albeit It was then on Its way to die, now that It was risen again from the dead and instinct for ever with undying life, what wonder is it, I say, if that Body passed through closed doors?

        But since the beholders doubted of the reality of that Body Which they saw, He showed unto them His Hands and His Side, and allowed them to handle that Same Flesh Which had just passed through the closed doors. In this there were two strange things manifested; yea, things which, according to our understanding, are contrary the one to the other. His Risen Body was incorruptible and yet palpable. For whatever can be touched, must needs be subject to corruption; and whatever is not subject to corruption, cannot be touched. But, in a way altogether wonderful and incomprehensible, our Redeemer after His Resurrection revealed Himself in a Body at once palpable and incorruptible: revealed Himself in an incorruptible Body, that we might learn to seek a like glorification; and in a palpable Body, for the strengthening of our faith. He revealed Himself in a Body at once incorruptible and palpable, that He might thereby make manifest the fact that His Risen Body was unaltered in nature, albeit transfigured in glory.

        Then said Jesus to them again: Peace be unto you. As My Father hath sent Me, even so send I you: that is, as My Father, Who is God, hath sent Me, Who am God, even so do I, Who am Man, send you, who are men. The Father sent the Son, Whom He appointed to be made Man for the redemption of man. Him He willed to send into the world to suffer, albeit He Whom He sent to suffer was the Son of His love. The Lord sendeth His chosen Apostles into the world, not to be happy in the world, but, as He had been Himself sent, to suffer. As the Father loveth the Son and yet sendeth Him to suffer, even so doth the Lord love His disciples, albeit He sendeth them into the world, to suffer therein; and therefore it is well said: "As My Father hath sent Me, even so send I you"; that is, while I send you into the wild storm of persecution, I love you all the same, I love you, yea, I love you with a love like that wherewith the Father loveth Me, Who sent Me into the world to bear agony therein.
      responsory: |-
        R. From the mouth of the wise doth proceed honey, alleluia: the sweetness of honey is under his tongue, alleluia. * His lips drop as the honey-comb, alleluia, alleluia.
        V. Wisdom doth abide in his heart, and out of his mouth cometh understanding.
        R. His lips drop as the honey-comb, alleluia, alleluia.
      status: verified
