collect:
  text: |
    Let us pray.
    Let thy merciful ears, O Lord, be open to the prayers of thy humble servants; and, that they may obtain their petitions, make them to ask such things as shall please thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'When the Lord was come near to Jerusalem, He beheld the city, and wept * over it, saying: If thou hadst known, even thou! For the days shall come upon thee, that thine enemies shall cast a trench about thee, and compass thee round, and keep thee in on every side and shall lay thee even with the ground because thou knewest not the time of thy visitation, alleluia.'
  status: verified

magnificat-antiphon:
  text: 'It is written: My house is the house of prayer * for all nations but ye have made it a den of thieves. And He taught daily in the Temple.'
  status: verified

magnificat-antiphon/~-first:
  text: 'When the Lord would take up * Elijah into heaven by a whirlwind, Elisha cried, and said: My father, my father, the chariot of Israel, and the horsemen thereof.'
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 201 for the Season
      text: |-
        Dearly beloved brethren, in the Lessons which are now being read to us day by day, I have often warned you that we must not follow the deathful letter, to the abandonment of the quickening spirit. For it is thus that the Apostle saith: "The letter killeth, but the spirit giveth life" (2 Cor. iii. 6). If we will understand only the plain meaning of the letter, we shall get little or no edification from our readings in the Divine Scriptures. All those things whereof we hear were types and images of things to come.

        The Blessed Elias was a type of the Lord our Saviour. Just as Elias was rejected by the Jews, so was the true Elias, even our Lord, rejected and despised by the same Jews. Elias went away out of his own country, and Christ hath left the synagogue Elias went into the desert, and Christ hath come into the world. Elias, when he was in the desert, was fed by ravens, and Christ in the desert of this world is comforted by the faith of the Gentiles.

        For the ravens which, at the command of the Lord, ministered unto Elias, were a type of the flock of Gentiles. Wherefore also it is said for the Gentile Church: "I am black, but comely, O daughters of Jerusalem!" (Cant. i. 4.) Why is the Church black but comely She is black by nature, but comely by grace. Why is she black? Because she must needs own: "Behold, I was shapen in iniquity, and in sin did my mother conceive me" (Ps. l. 7). Why is she comely? "Sprinkle me with hyssop, and I shall be clean wash me, and I shall be whiter than snow."
      responsory: |-
        R. Saul hath slain his thousands, and David his ten thousands. * Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
        V. Is not this David? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, and David his ten thousands?
        R. Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 19:41-47
      text: At that time, when Jesus drew near to Jerusalem and saw the city, He wept over it, saying, If you had known, in this your day, even you, the things that are for your peace! But now they are hidden from your eyes. For days will come upon you when your enemies will throw up a rampart about you, and surround you and shut you in on every side, and will dash you to the ground and your children within you, and will not leave in you one stone upon another, because you have not known the time of your visitation. And He entered the temple, and began to cast out those who were selling and buying in it, saying to them, It is written, ‘My house is a house of prayer,’ but you have made it a den of thieves. And He was teaching daily in the temple.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 39 on the Gospels
      text: |-
        No man that hath read the history of the destruction of Jerusalem by the Roman Princes Vespasian and Titus, can be ignorant that it was of that destruction that the Lord spoke when He wept over the ruin of the city. It is these Princes that are pointed at where it is said "For the days shall come upon thee that thine enemies shall cast a trench about thee." The truth of what followeth: "They shall not leave in thee one stone upon another" is even now fulfilled in the change of site of the city, which hath been re-built round about that place without the gates, where the Lord was crucified, while the ancient city hath been, as I am told, rooted up from the very foundations.

        What the sin of Jerusalem was which brought upon her the punishment of this destruction, we find written after: "Because thou knewest not the time of thy visitation." The Maker of men, through the mystery of His Incarnation, was pleased to visit her, but she remembered not to fear and to love Him. Hence also the Prophet, rebuking the hardness of man's heart, calleth the birds of the air to testify against it, saying "The stork in the heaven knoweth her appointed time and the turtle, and the swallow, and the crane, observe the time of their coming but my people know not the judgment of the Lord" (Jer. viii. 7).

        The Saviour wept over the ruin of the unfaithful city, while she herself as yet knew not that it was coming. If thou hadst known, said He, even thou and we may understand Him to have meant thou wouldest thyself have wept, in place of making merry as thou now dost, knowing not what hangeth over thee. And hence He saith farther: "at least in this thy day, the things which belong unto thy peace." While she was giving herself up to fleshly pleasures, and casting no look ahead upon coming sorrows, she had still for a day in her power the things which might have brought unto her peace.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
