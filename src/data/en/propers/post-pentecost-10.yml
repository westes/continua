collect:
  text: |
    Let us pray.
    O God, Who declarest thine Almighty power most chiefly in showing mercy and pity, mercifully grant unto us such a measure of thy grace, that we, running the way of thy commandments, may obtain thy gracious promises, and be made partakers of thy heavenly treasure.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'The publican, standing afar off, * would not lift up so much as his eyes unto heaven, but smote upon his breast, saying: God, be merciful to me, a sinner.'
  status: verified

magnificat-antiphon:
  text: This man went down to his house * justified rather than the other, for every one that exalteth himself shall be abased, and he that humbleth himself shall be exalted.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. John Chrysostom, Homily 25 on the Epistle to the Romans
      text: |-
        Let us not dream that we are ourselves to be held less guilty, when we find that we have not been alone in sin. On the contrary, such fellowship addeth to our punishment. The serpent was more heavily punished than Eve, and Eve than Adam, and Jezebel suffered more than Ahab, who took the vineyard of Naboth. She it had been that planned the whole matter, and opened the way for her husband's crime. Even so thou also, who shalt have caused another's perdition, shalt suffer more grievously than shall they, whom thou hast ruined. Since, for a man to commit sin himself is less wicked than to lead others into sin.

        If, therefore, we should see others sinning, let us not only not help them, but let us do what in us lieth to draw them out of the bottomless pit of destruction, lest we should suffer as accomplices in their trespass. Let our memory never forget that right awful judgment-seat, the river of fire, the chains that can never be unlocked, the darkness that cannot be pierced, the sound of teeth gnashing, the deadly worm. But thou sayest God is good. Are then all these things but idle words? Is there no punishment for the rich man which giveth no heed to Lazarus (Luke xvi. 20-26)? Doth the bridegroom open to the foolish virgins the door of the marriage-chamber (Matth. xxv. 1-12)?

        But these are perhaps only threats on God's part, no doubt, quoth thou. I ask thee: How darest thou say such a thing out loud, and deliver this judgment from thine own imagining? For sooth, I can prove to thee, from the things which God hath done, that thou art wrong. If thou wilt not believe for things to come, at least believe for things past. Of them at least it cannot be said that they are nought but threats and mere words, for they have happened, and actually been realised in fact. Who was He which brought in a great flood, until the whole land was standing water, and our whole race perished, save eight persons? Was it not God, and none other, Which brought upon them all these things, and more also?
      responsory: |-
        R. Saul hath slain his thousands, and David his ten thousands. * Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
        V. Is not this David? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, and David his ten thousands?
        R. Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 18:9-14
      text: 'At that time, Jesus spoke this parable to some who trusted in themselves as being just and despised others. Two men went up to the temple to pray, the one a Pharisee and the other a publican. The Pharisee stood and began to pray thus within himself: ‘O God, I thank You that I am not like the rest of men, robbers, dishonest, adulterers, or even like this publican. I fast twice a week; I pay tithes of all that I possess.’ But the publican, standing afar off, would not so much as lift up his eyes to heaven, but kept striking his breast, saying, ‘O God, be merciful to me the sinner!’ I tell you, this man went back to his home justified rather than the other; for everyone who exalts himself shall be humbled, and he who humbles himself shall be exalted.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 36 on the Words of the Lord
      text: |-
        The Pharisee might at least have said: "I am not as many men are." But what meaneth "other men"? All other men except himself. "I," said he, "am righteous; others are sinners." "I am not as other men are, extortioners, unjust, adulterers," and then he took occasion, from the neighborhood of the publican, to plume himself "or even," quoth he, "as this publican." "I am alone," he thought, "that publican" is one of the others. Mine own righteousness maketh the gulf between me and the wicked, such as he is.

        "I fast twice in the week; I give tithes of all that I possess." If we look in his prayer to find what he went to the Temple to pray to God for, we shall find nothing. He went up to pray, but his prayer was not a request of anything from God, but a glorification of himself. It was little enough not to pray to God, but he also glorified himself and despised his neighbour. But the publican stood afar off and yet drew nigh to God. Self-knowledge bade him keep at a distance, but his earnestness made him close. The publican stood afar off, but the Lord was at hand to hear him.

        "Though the Lord be high, yet hath He respect unto the lowly" but the proud, such as was this Pharisee, "He knoweth afar off" (Ps. cxxxvii. 6). He knoweth the proud, all the same, but they are afar off from Him. Consider now the lowliness of the publican. It was not only that he stood afar off, but "he would not lift up so much as his eyes unto heaven." He looked carefully, lest he should look up, he dared not to lift up his eyes unto heaven. Self-knowledge kept him down, though hope raised him up. Consider again, how that he "smote upon his breast." He afflicted himself, and therefore the Lord had compassion upon his acknowledgment of guilt. He smote upon his breast, saying "Lord, be merciful to me a sinner." Hearken here to a prayer and wonderest thou that when the sinner remembereth, God forgetteth.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
