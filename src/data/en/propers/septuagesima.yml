nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Enchiridion, Chapters 25-27
      text: |-
        The Lord threatened man with the punishment of death, in case he sinned. Thus did He gift him with free will, while He yet kept His lordship over him, and helped him with the dread of destruction. And so He put him in that happy garden, under the very shadow of the tree of life, in that good place from whence, had he kept his righteousness, he might have passed to a better. But the first man sinned, and was banished from Eden, and infected all his descendants with the disease of sin, poisoning their very root, and bringing upon all that sentence of death and damnation, which he had earned for himself. So that all that descend by fleshly generation from Adam, and from the guilty woman, who was the cause of his sin and the partaker of his punishment, derive from them original sin; whereby they are drawn through a way of diverse sins and sorrows, towards that final ruin which they shall share with the rebel angels who are at once their corrupters, their lords, and their comrades.

        So by one man sin entered into the world, and death by sin, and so death passed upon all men, in whom all have sinned. By the world the Apostle signified in this place all mankind. Thus then hath the matter stood. The damned mass of humanity lay in misery, or rather wallowed in it, and fell from bad to worse, till it joined the company of the sinning angels, and both together suffered the deserved punishment of their vile treason.

        So the wrath of God appertained: whatever sin man, through the blind and untamed sting of his flesh, willingly committeth, and whatever punishment, declared and open, he unwillingly suffereth. There is, indeed, no pause in that goodness of the Creator whereby He giveth even to the traitor angels life and strength, (which if He gave not, they would be annihilated,) and whereby He formeth the seed of men, though they come of a corrupt and condemned stock, quickeneth them, strengtheneth and fitteth their limbs for the changing seasons of their life, extendeth their knowledge in diverse places, and giveth them whereon to live. It hath been His will rather to draw good out of evil, than to suffer that there should be no evil.
      responsory: |-
        R. God took the man and put him into the garden of Eden * To dress it and to keep it.
        V. And the Lord God had planted a garden aforetime in Eden, and there He put the man whom He had formed.
        R. To dress it and to keep it.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 20:1-16
      text: 'At that time, Jesus spoke to His disciples this parable: The kingdom of heaven is like a householder who went out early in the morning to hire laborers for his vineyard. And having agreed with the laborers for a denarius a day, he sent them into his vineyard. And about the third hour, he went out and saw others standing in the market place idle; and he said to them, ‘Go you also into the vineyard, and I will give you whatever is just.’ So they went. And again he went out about the sixth, and about the ninth hour, and did as before. But about the eleventh hour he went out and found others standing about and he said to them, ‘Why do you stand here all day idle?’ They said to him, ‘Because no man has hired us.’ He said to them, ‘Go you also into the vineyard.’ But when evening had come, the owner of the vineyard said to his steward, ‘Call the laborers, and pay them their wages, beginning from the last even to the first.’ Now when they of the eleventh hour came, they received each a denarius. And when the first in their term came, they thought that they would receive more; but they also received each his denarius. And on receiving it, they began to murmur against the householder, saying, ‘These last have worked a single hour, and you have put them on a level with us, who have borne the burden of the day’s heat.’ But answering one of them, he said, ‘Friend, I do you no injustice; did you not agree with me for a denarius? Take what is yours and go; I choose to give to this last even as to you. Have I not a right to do what I choose? Or are you envious because I am generous?’ Even so the last shall be first, and the first last; for many are called, but few are chosen.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 19 on the Gospels
      text: |-
        We hear that the kingdom of heaven is like unto a man that is an householder, which went out early in the morning, to hire labourers into his vineyard. Who indeed is more justly to be likened to an householder than our Maker, Who is the Head of the household of faith, bearing rule over them whom He hath made, and being Master of His chosen ones in the world, as a Master over those that are in his house? He it is That hath the Church for a vineyard, a vineyard that ceaseth not to bring forth branches of the True Vine, from righteous Abel to the last of the elect that shall be born in the world.

        This householder, then, for the cultivation of his vineyard, goeth out early in the morning, and at the third hour, and the sixth hour, and the ninth hour, and the eleventh hour, to hire labourers into his vineyard. Thus the Lord, from the beginning to the end of the world, ceaseth not to gather together preachers for the instruction of His faithful people. The early morning of the world was from Adam until Noah; the third hour from Noah until Abraham; the sixth hour from Abraham until Moses; the ninth hour from Moses until the coming of the Lord; the eleventh hour from the coming of the Lord until the end of the world. At this eleventh hour are sent forth as preachers the Holy Apostles, who have received full wages, albeit they be come in late.

        For the cultivation of His vineyard, (that is, the instruction of His people,) the Lord hath never ceased to send into it labourers. First, by the Fathers, then, by the Prophets and Teachers of the Law, and lastly, by the Apostles He hath dressed and tended the lives of His people, as the owner of a vineyard dresseth and tendeth it by means of workmen. Whoever in whatever degree joined to a right faith the teaching of righteousness, was so far one of God's labourers in God's vineyard. By the labourers at early morning, and at the third hour, the sixth hour, and the ninth hour, may be understood God's ancient people, the Hebrews, who strove to worship Him with a right faith in company with His chosen ones from the very beginning of the world, and thus continually laboured in His vineyard. And now, at the eleventh hour, it is said unto the Gentiles also: Why stand ye here all the day idle?
      responsory: |-
        R. And the Lord God had planted a garden aforetime in Eden, * And there He put the man whom He had formed.
        V. And out of the ground made the Lord God to grow every tree that is pleasant to the sight, and good for food, the tree of life also in the midst of the garden.
        R. And there He put the man whom He had formed.
      status: verified
