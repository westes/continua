nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        John, the second of that name, having been taken from the living, Agapitus, a Roman by race, his father Gordian, archdeacon of the holy Roman Church, on account of the singular learning with which he was thoroughly and eminently instructed, and the well-ordered morals of a most chaste life in which he excelled beyond others, was raised to the holy see of Peter by the common votes of the whole clergy and the rejoicing of all the good; and he administered that sublime charge as though he had been chosen not by men but by God himself.

        He was adorned by the ancient Fathers with eminent titles of praise, and was called by them herald of justice, trumpet of the Gospel, Catholic vessel, a man most celebrated for piety and miracles, by which God made illustrious his heroic virtues and the sanctity of his apostolic life. Some decretals of this most holy Prelate exist, in which the dogmas of the Catholic faith are kept safe and sound, the form and rule of ecclesiastical discipline are handed down, the integrity of the sacred canons and ancient traditions is provided for, and finally all and each part of pastoral solicitude is fulfilled.

        He went to Constantinople with a purpose quite other than that for which men had destined him, namely by divine instinct and will: that he might depose and condemn Anthimus the heretic, patriarch of Constantinople, intruded by the evil arts of the Empress Theodora, and put Menas in his place; and that he might restore the patriarchal sees of Alexandria and Antioch, the heretics being expelled, to Catholic pastors. But at length, the second year of his pontificate not yet complete, that most holy man, in whom Catholics had desired nothing except a longer life, piously died at Constantinople, in the year of Christ 536. His body, translated to Rome, was laid in the Vatican.
      status: draft
