collect:
  text: |
    Let us pray.
    O Lord, we beseech thee, that the feast of thy blessed Martyrs and
    Bishops Protus and Hyacinth may keep us, and their worshipful prayers
    commend us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    O Lord, we beseech thee, that the feast of thy blessed Martyrs and
    Bishops Protus and Hyacinth may keep us, and their worshipful prayers
    commend us.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Protus and Hyacinth were brethren, eunuchs of the blessed Virgin Eugenia, and were baptized along with her by Bishop Helenus. They gave themselves to the study of God's Word, and dwelt for a while in wonderful lowliness and holiness of life in a monastery in Egypt. However, they afterwards followed the holy Virgin Eugenia to Rome, in the reign of the Emperor Gallienus, and were arrested in that city for professing the Christian faith. By no means could they be brought to leave the Christian religion and to worship the gods, and they were therefore severely scourged and beheaded, upon the 11th day of September.
      status: verified
