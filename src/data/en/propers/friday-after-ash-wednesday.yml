collect:
  text: |
    Let us pray.
    Further with thy gracious favor, we beseech thee, O Lord, the fasts which we have begun, that we may be able to practice the bodily fasts which we keep, with sincere minds.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    Guard, O Lord, thy people, and from all their sins cleanse them; for no adversity shall harm them if no iniquity dominates them.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

