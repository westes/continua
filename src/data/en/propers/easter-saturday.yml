collect:
  text: |
    Let us pray.
    Grant, we beseech thee, O Almighty God, that we who have kept worshipfully the Easter solemnities, may at last worthily pass from keeping Feasts unto thee here to the everlasting jubilation hereafter.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

benedictus-antiphon:
  text: They ran both together, * and that other disciple did outrun Peter, and came first to the Sepulchre, alleluia.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: John 20:1-9
      text: 'At that time, on the first day of the week, Mary Magdalen cometh early, when it was yet dark, unto the sepulchre; and she saw the stone taken away from the sepulchre. She ran, therefore, and cometh to Simon Peter, and to the other disciple whom Jesus loved, and saith to them: They have taken away the Lord out of the sepulchre, and we know not where they have laid Him. Peter therefore went out, and that other disciple, and they came to the sepulchre. And they both ran together, and that other disciple did outrun Peter, and came first to the sepulchre. And when he stooped down, he saw the linen cloths lying; but yet he went not in. Then cometh Simon Peter, following him, and went into the sepulchre, and saw the linen cloths lying, and the napkin that had been about His head, not lying with the linen cloths, but apart, wrapped up into one place. Then that other disciple also went in, who came first to the sepulchre: and he saw, and believed. For as yet they knew not the scripture, that He must rise again from the dead.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: Pope St. Gregory the Great, Homily 22 on the Gospels
      text: |-
        Dearly beloved brethren, the portion of the Holy Gospel which hath just now been read in your ears, is exceeding simple on the face of it, which is its historical sense; but the mystic sense, which underlieth that other, requireth from us a little searching. Mary Magdalene came unto the Sepulchre when it was yet dark. The historic sense telleth us what was the hour of day; the mystic sense, the state of her understanding who sought. Mary Magdalene sought for Him, by Whom all things were made, and Whom she had seen die, as concerning the flesh; she sought for Him, I say, in the grave, and finding Him not, she believed that He had been stolen away. Yea, it was yet dark, when she came unto the sepulchre. Then she ran and told the disciples, but they who had loved Him most, namely Peter and John, did outrun the others.

        So they ran both together, but John did outrun Peter, and came first to the Sepulchre, but yet took he not upon himself to go in first. Then cometh Peter following him, and went in. What, my brethren, what did the racing of these Apostles signify? Can we believe that the description given by the deepest of the Evangelists is without a mystic interpretation? By no means. John had never told how that he did outrun Peter, and yet went not into the Sepulchre, if he had not believed that his hesitation veiled some mystery. What signifieth John but the Synagogue? or Peter, but the Church?

        Neither must ye take it as strange that the elder Apostle should represent the Church, and the younger the Synagogue: for although the Synagogue was first to worship God, yet the herd of Gentiles is in the world older than the Synagogue, as witnesseth Paul where he saith: That was not first which is spiritual, but that which is natural. By Peter, then, who was the elder, is signified the Church of the Gentiles; and by John, who was the younger, the Synagogue of the Jews. They run both of them together, for from the time of her birth until now, and so will it be until the end, the Church of the Gentiles hath run in a parallel road and manywise a common road with the Synagogue, albeit not with equal understandings. The Synagogue came first to the Sepulchre, but she hath not yet entered in; for, though she hath received the commandments of the law, and hath heard the Prophets tell of the Incarnation and Passion of the Lord, she will not believe in Him Who died for her.
      responsory: |-
        R. Knowing that Christ rising again from the dead, dieth now no more, death shall no more have dominion over Him. For in that He died to sin, He died once: * In that He liveth, He liveth unto God, alleluia, alleluia.
        V. He died once for our sins, and He rose again for our justification.
        R. In that He liveth, He liveth unto God, alleluia, alleluia.
      status: verified
