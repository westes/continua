nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Sermon 9 for Lent
      text: |-
        Dearly beloved brethren, we know that of all the solemn Feasts which are kept by Christians the Passover is the chief. The ordinances of the whole rest of the year are ordered to the end of preparing us to come to this one in worthy and meet manner. But these days, which now are, are they which ought most especially to stir up a godly mind in us, seeing that they are they which are nearest to that most glorious mystery of God's mercy. In these days the holy Apostles, taught by the Holy Ghost, ordered the chiefest store of Fasting, that we, sharing His Cross with Christ, might, albeit we are what we are, in Him, do some of the same things which He did for our sakes, and so realise the saying of the Apostle: "If we suffer with Him, we shall be also glorified together." He that is partaker of the sufferings of the Lord hath a sure and certain hope of that blessedness which He hath promised unto us.

        Dearly beloved brethren, there is no man to whom the state of the age in which he liveth denieth a share in this glory of partaking, first the sufferings, and then the triumph and joy, of Christ. It is not as though this time of peace were barren in occasions of valour. The Apostle giveth us this warning: All that will live godly in Christ Jesus shall suffer persecution. And therefore, as long as godliness is watchful, persecution will never be asleep. The Lord Himself saith in one of His own exhortations: He that taketh not his cross, and followeth after Me, is not worthy of Me. And we must not doubt that these words of Christ apply not only to His immediate disciples, to whom He spoke them, but belong to all the faithful and to the whole Church, who, whosoever be the believers of whom she is for the time composed on earth, heareth in these words the way to be saved which her Lord hath appointed for them.

        As then, it is the duty of the whole body of the Church to live godly, so is it her right at all times to be a-bearing of her Master's Cross, and that not only in her general body, but individually in the person of each one of her members, who differ every one from another in the way in which they have to carry it, and the shape in which it is laid upon them. The one common name for all their carrying of the Cross is persecution, but the manner of his wrestling is special to each; and there is often more danger in the ambush than in the pitched field of battle. Blessed Job, who had tried both the goods and the ills of this world, said: Is not the life of man upon earth a warfare? The attack upon the faithful soul arrayeth itself not alone in bodily torture and punishment; yea, when the limbs are sound enough, fearful is the ravage that threateneth us when the lusts of the flesh unman us. But when the flesh lusteth against the spirit, and the spirit against the flesh, the reasonable mind findeth her reinforcement in the helpful Cross of Christ, and though she be lured by foul cravings, yet refuseth to give her consent, for God maketh her pure thoughts to tremble for fear of Him.
      responsory: |-
        R. Thou art my God; be not far from me, for trouble is near; * For there is none to help.
        V. But be not thy strength far from me; O Lord, haste thee to help me.
        R. For trouble is near; for there is none to help.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 8:46-59
      text: 'At that time, Jesus said to the crowds of the Jews: Which of you can convict Me of sin? If I speak the truth, why do you not believe Me? He who is of God hears the words of God. The reason why you do not hear is that you are not of God. The Jews therefore in answer said to Him, Are we not right in saying that You are a Samaritan, and have a devil? Jesus answered, I have not a devil, but I honor My Father, and you dishonor Me. Yet, I do not seek My own glory; there is One Who seeks and Who judges. Amen, amen, I say to you, if anyone keep My word, he will never see death. The Jews therefore said, Now we know that You have a devil. Abraham is dead, and the prophets, and You say, ''If anyone keep My word he will never taste death.'' Are You greater than our father Abraham, who is dead? And the prophets are dead. Whom do You make Yourself? Jesus answered, If I glorify Myself, My glory is nothing. It is My Father Who glorifies Me, of Whom you say that He is your God. And you do not know Him, but I know Him. And if I say that I do not know Him, I shall be like you, a liar. But I know Him, and I keep His word. Abraham your father rejoiced that he was to see My day. He saw it and was glad. The Jews therefore said to Him, You are not yet fifty years old, and have You seen Abraham? Jesus said to them, Amen, amen, I say to you, before Abraham came to be, I am. They therefore took up stones to cast at Him; but Jesus hid Himself, and went out from the temple.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 18 on the Gospels
      text: |-
        Dearly beloved brethren, consider the gentleness of God. He came to take away sins, and He saith: Which of you convinceth Me of sin? He Who, through the might of His Godhead, was able to justify sinners, was contented to show by argument that He was not Himself a sinner. But exceeding dread is that which followeth: He that is of God heareth God's words; ye, therefore, hear them not, because ye are not of God. If, then, whosoever is of God heareth God's words, and whosoever is not of Him cannot hear His words, let each one ask himself if he, in the ear of his heart, heareth God's words, and understandeth Whose words they are? The Truth commandeth us to long for a Fatherland in heaven, to bridle the lusts of the flesh, to turn away from the glory of the world, to seek no man's goods, and to give away our own.

        Let each of you, therefore, think within himself if this voice of God is heard in the ear of his heart, and if he knoweth already if he is of God. For some there be, whom it pleaseth not to hear the commandments of God even with their bodily ears. And some there be, who receive the same with their bodily ears, but whose heart is far from them. And some also there be, who hear the words of God with joy, so that they are moved thereby even to tears; but when their fit of weeping is past they turn again to iniquity. They hear not the words of God, who despise to do them. Therefore, dearly beloved brethren, call up your own life before your mind's eye, and then ponder with trembling those awful words which the mouth of the Truth spoke: Ye therefore hear them not, because ye are not of God.

        But the Truth speaketh these words concerning the reprobate; but the reprobate make manifest the same thing concerning themselves, by their evil works. Thus immediately followeth: Then answered the Jews, and said unto Him: Say we not well that Thou art a Samaritan, and hast a devil? But let us hear what the Lord said to this insult: I have not a devil, but I honour My Father, and ye do dishonour Me. The Lord said: I have not a devil, but He did not say: I am not a Samaritan, for in a sense a Samaritan He was indeed, since the word Samaritan, in the Hebrew tongue, signifieth, being interpreted, a Watcher, and the Lord is that Watcher, of Whom the Psalmist saith that unless He keep the city, other watchman waketh but in vain. He also is that Watchman unto Whom crieth Isaiah: Watchman, what of the night? Watchman, what of the night? Therefore the Lord said: I have not a devil, but not: I am not a Samaritan. Of the two things brought against Him He denied one; but by His silence, admitted the other.
      responsory: |-
        R. O Lord, I go mourning all the day long, for my soul is filled with a loathsome disease: * They also that sought after my life have used violence against me.
        V. My friends and my neighbours draw near, and stand over against me; and they that are nearest to me stand afar off.
        R. They also that sought after my life have used violence against me.
      status: verified
