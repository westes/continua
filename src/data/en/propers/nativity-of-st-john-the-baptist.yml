nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 20 on the Saints
      text: |-
        Outside the most holy Birthday of the Lord, we find celebrated in the Gospel the birth of only one other, namely, that of the blessed Baptist, John. As regardeth all others among God's holy and chosen ones we know that that day is observed whereon, with their work finished, and the world conquered and finally trampled down, they were born from this into a better life, even one of everlasting blessedness. In others is honoured the crowning of the struggle on their last day of dying life, but in John is honoured the first day; in him the very beginning is found hallowed. And the reason of this is, without doubt, because he was sent from God to bear witness to the coming of the Light, lest when It came It might take the darkness by surprise, and the darkness might not comprehend It. Now, John was a figure of the Old Testament, and showed in his own person a typical embodiment of the Law; and therefore John heralded beforehand the coming of the Saviour, even as the Law was our schoolmaster to bring us to the grace of Christ.

        But as touching this, that he prophesied while yet in the hidden depths of his mother's womb, and while himself lightless bore testimony to the truth, we are to understand it as a figure how that while himself wrapped round with the veil and carnal ordinances of the letter, he by the spirit preached unto the world a Redeemer, and testified that Jesus is our Lord even while for himself, working under the law, the birth of the new dispensation was still in the womb of the future, and not come to day. The Jews were estranged from the womb, that is from the Law, that womb heavy with the Christ That was to be; they went astray from the belly, speaking lies; and therefore John came for a witness, to bear witness of the Light, that all men through him might believe.

        But as for this, that when John had heard in the prison the works of Christ, he sent two of his disciples; this is the Law sending to the Gospel. For John here was a figure of the Law, imprisoned in ignorance, lying in the dark, and in a hidden place, and he was fettered through Jewish misunderstanding within the bonds of the letter. But of him was it said, as is written in the Blessed Evangelist: He was a burning and a shining light; that is to say, that, when the whole world was wrapt in the night of ignorance, this Saint was kindled by the fire of the Holy Ghost, to show before men the light of salvation, and at the hour of the thickest darkness of sin, appeared like a bright morning star to herald the rising of that Sun so right gloriously radiant, the Son of righteousness, Christ our Lord. And this is why John said of himself: I am the voice of one crying in the wilderness, Make straight the way of the Lord.
      status: verified
      responsory: |-
        R. They made signs to his father, how he would have him called; and he asked for a writing-table, and wrote, saying: * His name is John.
        V. The mouth of Zacharias was opened, and he prophesied, saying:
        R. His name is John.
    - nocturn: 3
      isGospel: true
      citation: Luke 1:57-68
      text: Elizabeth's time was fulfilled that she should be delivered, and she brought forth a son. And her neighbors and kinsfolk heard that the Lord had magnified His mercy toward her, and they rejoiced with her. And it came to pass on the eighth day, that they came to circumcise the child, and they were going to call him by his father's name, Zachary. And his mother answered and said, "Not so, but he shall be called John." And they said to her, "There is none of your kindred that is called by this name." And they kept inquiring by signs of his father what he would have him called. And asking for a writing-tablet he wrote the words, "John is his name." And they all marveled. And immediately his mouth was opened and his tongue loosed, and he began to speak, blessing God. And fear came on all their neighbors; and all these things were spoken abroad in all the hill country of Judea. And all who heard them laid them up in their heart, saying, "What then will this child be?" For the hand of the Lord was with him. And Zachary his father was filled with the Holy Spirit, and prophesied, saying, "Blessed be the Lord, the God of Israel, because He has visited and wrought redemption for His people."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Bk. 2 (on Luke 1:57-69)
      text: |-
        Elizabeth's full time came that she should be delivered, and she brought forth a son. And her neighbours rejoiced with her. The birth of a Saint is a joy for many, for it is a good to all. Righteousness is an help to all, and therefore when a righteous man is born it is an heralding of his life, which is still to come, that the helpful excellency of his future should be hailed by the, as it were, prophetic joy of the neighbours. It is well that we should be told concerning the prophet, while he was yet in the womb, that we may know how that Mary was there; but we hear nothing of his childhood, because we know that it was safe and strong through the nearness of the Lord, Himself then in that womb which was free from the sorrows of pregnancy. And therefore we read in the Gospel nothing touching him save his coming, the annunciation thereof to his father, the leap which he gave in the womb, and his crying in the wilderness.

        It was not for him to feel childishness, who beyond all use of nature or of his age, when as yet he lay in his mother's womb, leapt at once unto the measure of the stature of the fullness of Christ. It is strange how that the Holy Evangelist hath judged meet to tell us that they thought to call the child Zacharias, after the name of his father, that thou mayest notice that the mother would have none of the names whereby their kindred were called, but only that name which the Holy Ghost had dictated, and which the Angel had told before unto Zacharias. The dumb man had certainly not been able to tell his wife by what name to call the child, and Elizabeth must needs have learnt by revelation what she could not have heard from her husband.

        His name is John; that is, it is not for us to choose a name now for him to whom God hath given a name already. He hath a name, which we know, but it is not one of our choosing. To receive a name from God is one of the honours of the Saints. Thus was it that Jacob's name was no more called Jacob but Israel, because he saw God face to face. Thus was it that our Lord Jesus was named before He was born, with a name not given by an Angel, but by the Father. Thou seest that Angels tell that which they have been bidden to tell, not matters of their own choosing. Nor oughtest thou to wonder that Elizabeth named a name which she had not heard, since it had been revealed to her by the same Holy Ghost Who had commanded the Angel to tell it.
      status: verified
      responsory: |-
        R. The Angel Gabriel appeared unto Zacharias, and said thy wife Elizabeth shall bear thee a son, and thou shalt call his name John; * And many shall rejoice at his birth.
        V. For he shall be great in the sight of the Lord, and shall drink neither wine nor strong drink.
        R. And many shall rejoice at his birth.

octave-readings/~-octave-day-2:
  source: St. Augustine, Sermon 21 on the Saints; St. Ambrose on Luke
  text: |
    Today, dearly beloved brethren, we celebrate the birthday of St. John, a thing we read to have been granted to no other of the saints. For of the Lord alone, and of blessed John, is the day of birth kept and honoured throughout the whole world. A barren woman bore him; a virgin conceived the other. In Elizabeth barrenness is overcome; in blessed Mary the common course of conception is changed. Elizabeth bore a son by knowing her husband; Mary believed the Angel, and conceived. Elizabeth conceived a man, and Mary a man also; but Elizabeth conceived only a man, Mary both God and man.

    Great, then, is John, to whose greatness even the Saviour bears witness, saying: Among them that are born of women there hath not risen a greater than John the Baptist. He excels the rest, he stands above them all; he surpasses the Prophets, he rises above the Patriarchs; and whoever is born of a woman is lesser than John. Someone will perhaps say: If John is greater among those born of women, is he greater than the Saviour? Far from it. For John was born of a woman, but Christ was born of a virgin. The one came forth from the bosom of a womb that knew corruption; the other was brought forth by the flower of an untouched virgin.

    If, then, my brethren, we understand the mystery, John is man, Christ is God. Let the man be humbled that God may be exalted, according to what John himself said of the Lord: He must increase, but I must decrease. That the man might be humbled, John was born today, from which day the days begin to shorten; that God might be exalted, Christ was born on the day from which the days begin to lengthen. It is a great mystery, dearly beloved brethren. We therefore celebrate the birthday of John as of Christ, because the birth itself is full of mystery. What mystery? That of our humility, just as the birth of Christ is full of the mystery of our exaltation.

    From the Holy Gospel according to Luke: Elizabeth's full time came that she should be delivered, and she brought forth a son. And her neighbours and her cousins heard how the Lord had showed great mercy upon her, and they rejoiced with her. And so on.

    His name is John, he says. Elizabeth could not fail to recognise the herald of the Lord, she who had prophesied of Christ. And it is well added: There is none of thy kindred that is called by this name; that thou mayest understand the name belongs not to the family, but to the prophet. Zacharias also is questioned by signs; but since unbelief had taken from him speech and hearing, what he could not do with his voice he did with his hand and with letters.

    For he wrote, saying: His name is John. Here the name is not given but confirmed; and rightly his tongue was loosed at once, because faith unbound what unbelief had bound. Let us also believe, therefore, that we may speak; that our tongue, which is tied by the bonds of unbelief, may be loosed by the voice of reason.

    Let us write mysteries in the spirit, if we wish to speak. Let us write the herald of Christ, not on tables of stone, but on the fleshy tables of the heart. For he who speaks of John prophesies Christ. Let us speak of John, and let us speak of Christ, that our mouth also may be opened, which in so great a priest the bridle of a wavering faith, like that on a dumb beast, had held shut.
  responsory: |
    R. There was a man sent from God, whose name was John: * The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord. V. John was in the wilderness, preaching the baptism of repentance. R. The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord.
  status: draft

octave-readings/~-octave-day-4:
  source: St. Basil the Great, Homily on Psalm 28; St. Ambrose on Luke
  text: |
    The voice of the Lord is upon the waters. What voice is this What are these waters Let us take that which is here said as a prophecy. Thou rememberest how that this is the record of John, when the Jews (sent Priests and Levites from Jerusalem to ask him, Who art thou And he confessed and denied not, but confessed, I am not the Christ. And they asked him, What then Art thou Elias And he saith, I am not. Art thou that Prophet? And he answered, No. Then said they unto him, Who art thou that we may give an answer to them that sent us. (What sayest thou of thyself?) He said, I am the voice of one crying in the wilderness. (John i. 19-23; Isa. xl. 3, 4.) Therefore, John is the voice of the Lord. This is he, of whom it is written, Behold, I send My messenger before thy face (Luke vii. 27) to make ready a people prepared for the Lord (i. 17.) This voice upon the waters was heard upon those of Jordan, wherein he baptized, preaching the baptism of repentance for the remission of sins (iii. 3.) Nor was this voice heard upon the waters of Jordan only, but also, in Enon near to Salim, because there was much water there. (John iii. 23.)

    The voice of the Lord upon the waters, then, is John upon baptism. Then also the God of glory thundereth. For (when Jesus came from Nazareth of Galilee, and was baptized of John in Jordan..) there came a voice from heaven, saying, This is My Beloved Son, in Whom I am well pleased. (Mark i. 9, II.) Then also was it true that The Lord is upon many waters when He was pleased to come from Galilee to Jordan unto John, to be baptized of him... to fulfil all righteousness (Matth. iii. 13, 15,) which is of the law. (Rom. x. 5.) The voice of the Lord is powerful powerful to heal the weaknesses of the people through the baptism of repentance, baptizing through John with water unto repentance. (Matth. iii. 11.) The voice of the Lord is powerful, which saith Repent ye, for the kingdom of heaven is at hand, and Bring forth fruits meet for repentance.

    The voice of the Lord breaketh the cedars. This may well be said of him who, being sent as a messenger before the face of the Lord, to make ready for Him a prepared people, made the crooked places straight, by breaking down and treading flat the haughty growths of ungodliness that had lifted themselves up to block out the acknowledgment of God. He by whom every valley was exalted, and every mountain and hill was made low, the same was he who broke the cedars, and made straight in the desert an highway for our God, by laying low in repentance the hearts that were haughty, and proud, and lifted up. The Lord availing Himself of that preparation, smote down at His coming every power that withstood Him, which are spoken of under a similitude as the cedars of Lebanon. For the Lord must reign till He hath put all enemies under His feet, (i Cor. xv. 25,) and trodden down these cedars.

    Elizabeth's full time came that she should be delivered and she brought forth a son. And her neighbours and her cousins heard how the Lord had showed great mercy upon her and they rejoiced with her. And so on

    And his father Zacharias was filled with the Holy Ghost, and prophesied. Behold how good is God, and how ready to forgive sinners Not only doth He give back that which He hath taken away, but He addeth moreover such and such things, more than either we ask or think. He that had hitherto been dumb, now speaketh prophecy. But the greatest grace of God is in this, that he which had denied, now maketh profession. Therefore let no man despair, nay, though he well knoweth what have been his past sins, let him never give up hope of a reward from God. If thou knowest how to amend thy crooked ways, God knoweth how to turn away the judgments of His anger.

    And thou, child, shalt be called the Prophet of the Highest. How gracefully, while as he prophesieth of the Lord, he turneth his address to the Prophet, making mention of this great mercy of the Lord along with the others, lest, while he openly gave thanks for his own benefits, he should seem to keep the silence of unthankfulness regarding those which he knew had been given to his boy. But some will perhaps deem it his folly that he addressed his discourse to a babe of eight days old. Verily, if we call to mind that John heard the voice of Mary's salutation when he was in his mother's womb, we shall understand how much rather he could hear the voice of his father now when he was born.

    Zacharias knew well that a Prophet hath ears which open under the influence of the Spirit of God, instead of that of advancing age. He that had had sense to leap in the womb for joy, wanted not understanding. At the same time remark unto how many Zacharias prophesied, and though both he and his wife were filled with the Holy Ghost, yet all things are done in due order, and the woman studieth rather to learn the things of God than to teach them.
  responsory: |
    R. There was a man sent from God, whose name was John: * The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord. V. John was in the wilderness, preaching the baptism of repentance. R. The same came for a witness, to bear witness of the Light, to make ready a people prepared for the Lord.
  status: verified

