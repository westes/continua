nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Cletus was a Roman, the son of Emilian, of the Fifth Region of the city, and the street called Noble. He ruled the Church in the time of the Emperors Vespasian and Titus. In accordance with the precept of the Prince of the Apostles He ordained twenty-five Priests for the city. He was the first Pope who made use in his letters of the phrase "Health and Apostolic Benediction." When he had ruled the Church for twelve years, seven months, and two days, and brought it into an excellent state of order, in the reign of the Emperor Domitian, and the second persecution since the time of Nero, he was crowned with martyrdom, and buried on the Vatican mount, hard by the body of blessed Peter.
      status: verified
    - nocturn: 2
      isGospel: false
      text: Marcellinus was a Roman; he ruled the Church from the year 296 to the year 304, during the savage persecution which was ordered by the Emperor Diocletian. He suffered through the false severity of those who blamed him as being too indulgent toward them who had fallen into idolatry, and for this reason also hath been slandered to the effect that he himself burnt incense to idols; but this blessed Pope, on account of his confession of the faith, was put to death along with three other Christians, whose names are Claudius, Cyrinus, and Antoninus. At the command of the Emperor their bodies were cast out unburied, and lay so for thirty-six days. At the end of that time St. Peter appeared in a dream to Blessed Marcellus, and in obedience to his command the said Marcellus went with certain Priests and Deacons, singing hymns, and carrying lights, and buried these four bodies honourably in the Cemetery of Priscilla upon the Salarian Way. Marcellinus ruled the Church for seven years, eleven months, and twenty-three days. During this time he held two Advent ordinations, and ordained at them four Priests, and five Bishops for diverse Sees.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Sermon 22
      text: 'Dearly beloved brethren, it is very meet and right that after the gladness of Easter, which we have celebrated in the Church, we should mingle our own joy with the joy of the holy Martyrs; yea, that we should tell of the glory of the Lord''s rising again, to them that have been made partakers of the Lord''s sufferings. It truly must needs be that they which have been partakers of His sufferings, should be also of His joy. For thus saith the blessed Apostle: As ye are partakers of the sufferings, so shall ye be also of the consolation. And again: If we suffer, we shall also reign with Him. He, therefore, that endureth sorrow for Christ, must needs also have glory with Christ.'
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 16:13-19
      text: At that time, Jesus came into the quarters of Cæsarea Philippi, and He asked His disciples, saying, "Whom do men say that the Son of Man is?" But they said, "Some John the Baptist, and other some Elias, and others Jeremias, or one of the prophets." Jesus saith to them, "But whom do you say that I am?" Simon Peter answered and said, "Thou art Christ, the Son of the living God." And Jesus answering, said to him, "Blessed art thou, Simon Bar-Jona, because flesh and blood hath not revealed it to thee, but My Father Who is in heaven. And I say to thee, that thou art Peter, and upon this rock I will build My Church, and the gates of hell shall not prevail against it. And I will give to thee the keys of the kingdom of heaven; and whatsoever thou shalt bind upon earth, it shall be bound also in heaven, and whatsoever thou shalt loose upon earth, it shall be loosed also in heaven."
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Leo the Great, Sermon 2 on the Anniversary of his own Election (on Matt 16:13-19)
      text: |-
        When the Lord, as we read in the Evangelist, asked His disciples: Who did men, amid their diverse speculations, believe that He, the Son of Man, was; blessed Peter answered and said: Thou art the Christ, the Son of the living God. And Jesus answered and said unto him: Blessed art thou, Simon Barjona: for flesh and blood hath not revealed it unto thee, but My Father, Which is in heaven: and I say also unto thee, that thou art Peter, and upon this rock I will build My Church, and the gates of hell shall not prevail against it; and I will give unto thee the keys of the kingdom of heaven; and whatsoever thou shalt bind on earth shall be bound in heaven; and whatsoever thou shalt loose on earth shall be loosed in heaven. Thus therefore standeth the ordinance of the Truth, and blessed Peter, abiding still that firm rock which God hath made him, hath never lost that right to rule in the Church which God hath given unto him.

        In the universal Church it is Peter that doth still say every day, Thou art the Christ, the Son of the living God, and every tongue which confesseth that Jesus is Lord is taught that confession by the teaching of Peter. This is the faith that overcometh the devil and looseth the bands of his prisoners. This is the faith which maketh men free of the world and bringeth them to heaven, and the gates of hell are impotent to prevail against it. With such ramparts of salvation hath God fortified this rock, that the contagion of heresy will never be able to infect it, nor idolatry and unbelief to overcome it. This teaching it is, my dearly beloved brethren, which maketh the keeping of this Feast to-day to be our reasonable service, even the teaching which maketh you to know and honour in myself, lowly though I be, that Peter who is still entrusted with the care of all other shepherds and of all the flocks to them committed, and whose authority I have, albeit unworthy to be his heir.

        When therefore, we address our exhortations to your godly ears, believe ye that ye are hearing him speak whose office we are discharging. Yea, it is with his love for you that we warn you, and we preach unto you no other thing than that which he taught, entreating you that ye would gird up the loins of your mind and lead pure and sober lives in the fear of God. My disciples dearly beloved, ye are to me, as the disciples of the Apostle Paul were to him, a crown and a joy, if your faith, which, in the first times of the Gospel, was spoken of throughout the whole world, abide still lovely and holy. For, albeit it behoveth the whole Church which is spread throughout all the world, to be strong in righteousness, you it chiefly becometh above all other peoples to excel in worth and godliness, whose house is built upon the very crown of the Rock of the Apostle, and whom not only hath our Lord Jesus Christ, as He hath redeemed all men, but whom also His blessed Apostle Peter hath made the foremost object of his teaching.
      status: verified
