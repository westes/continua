nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Paul, the first of that name, a Roman by race, the son of Constantine, after the death of Stephen the Third, his brother, was in the year of Christ 757, by a new example, put in his place. But this was owing to his exceptional virtue. For when he had been excellently formed by Gregory the Second in the Lateran patriarchium, together with his brother, from his first years in Christian morals and all ecclesiastical learning, the clergy had no one worthier to elect as successor to his pious brother in those most troubled times.

        He urged Constantine Copronymus, by letters sent through a legate, once and again, to embrace sounder doctrine; but the heretical and hardened prince would not hear the voice of the solicitous pastor, and did not cease to rage against the Catholics, and especially the monks: very many of whom, that they might withdraw themselves from the tyrant, took refuge in Italy; these Paul kindly received, and assigned them temples and monasteries, furnished with fitting revenues, in which they might perform the sacred rites in the Greek tongue and the rite of their country.

        There exist many letters of his written to Pepin king of the Franks, in which he gives thanks to the excellent prince, deserving well of the Roman Church, for the defence of the Church undertaken against the incursions of the Lombards; and heaping him with rare praises he earnestly exhorts him never to desist from what he has begun. When the cemeteries outside the walls had been destroyed by the Lombards, he brought many relics of saints thence into the City, lest they fall as prey to the barbarians; of which he placed no small part in the church of a monastery built by himself in his paternal house and enriched with a fat income. For the rest, whatever time the care of ecclesiastical government left him, all of it he spent in feeding Christ's poor, the sick, the widows, and consoling those detained in prison, and freeing the oppressed from debt. And at last, ripe for heaven, he piously died, the eleventh year of his pontificate already begun, and was buried in the Vatican.
      status: draft
