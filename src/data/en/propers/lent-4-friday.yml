collect:
  text: |
    Let us pray.
    O God, who dost quicken the whole world anew by thine unspeakable Sacraments, grant, we beseech thee, that thy Church may both profit by whatsoever Thou hast ordained touching the things which are eternal, nor be comfortless of such help as is needful unto her touching the things which are temporal.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    Grant, we beseech thee, O Almighty God, unto all us who know that we are weak, and who trust in thee, because we know that Thou art strong, the gladsome help of thy loving-kindness, both here in time and hereafter in eternity.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Our friend Lazarus sleepeth; * let us go and awake him out of sleep.
  status: verified

magnificat-antiphon:
  text: Lord, if Thou hadst been here * Lazarus had not died; behold, by this time he stinketh, for he hath lain in the grave four days already.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: John 11:1-45
      text: At that time, a certain man was sick, Lazarus of Bethany, the village of Mary and her sister Martha. (Now it was Mary who anointed the Lord with ointment, and wiped His feet dry with her hair, whose brother Lazarus was sick.) The sisters therefore sent to Him, saying, "Lord, behold, he whom You love is sick." But when Jesus heard this, He said to them, "This sickness is not unto death, but for the glory of God, that through it the Son of God may be glorified." Now Jesus loved Martha and her sister Mary, and Lazarus. So when He heard that he was sick, He remained two more days in the same place. Then afterwards He said to His disciples, "Let us go again into Judea." The disciples said to Him, "Rabbi, just now the Jews were seeking to stone You; and do You go there again?" Jesus answered, "Are there not twelve hours in the day? If a man walks in the day, he does not stumble, because he sees the light of this world. But if he walks in the night, he stumbles, because the light is not in him." These things He spoke, and after this He said to them, "Lazarus, our friend, sleeps. But I go that I may wake him from sleep." His disciples therefore said, "Lord, if he sleeps, he will be safe." Now Jesus had spoken of his death, but they thought He was speaking of the repose of sleep. So then Jesus said to them plainly, "Lazarus is dead; and I rejoice on your account that I was not there, that you may believe. But let us go to him." Thomas, who is called the Twin, said therefore to his fellow-disciples, "Let us also go, that we may die with Him." Jesus therefore came and found him already four days in the tomb. (Now Bethany was close to Jerusalem, some fifteen stadia distant.) And many of the Jews had come to Martha and Mary, to comfort them on account of their brother. When, therefore, Martha heard that Jesus was coming, she went to meet Him. But Mary remained at home. Martha therefore said to Jesus, "Lord, if You had been here my brother would not have died. But even now I know that whatever You shall ask of God, God will give it to You." Jesus said to her, "Your brother shall rise." Martha said to Him, "I know that he will rise at the resurrection, on the last day." Jesus said to her, "I am the resurrection and the life; he who believes in Me, even if he die, shall live; and whoever lives and believes in Me, shall never die. Do you believe this?" She said to Him, "Yes, Lord, I believe that You are the Christ, the Son of God, Who have come into the world." And when she had said this, she went away and quietly called Mary her sister, saying, "The Master is here and calls you." As soon as she heard this, she rose quickly and came to Him, for Jesus had not yet come into the village, but was still at the place where Martha had met Him. When, therefore, the Jews who were with her in the house and were comforting her, saw Mary rise up quickly and go out, they followed her, saying, "She is going to the tomb to weep there." When, therefore, Mary came where Jesus was, and saw Him, she fell at His feet, and said to him, "Lord, if You had been here, my brother would not have died." When, therefore, Jesus saw her weeping, and the Jews who had come with her weeping, He groaned in spirit and was troubled, and said, "Where have you laid him?" They said to Him, "Lord, come and see." And Jesus wept. The Jews therefore said, "See how He loved him." But some of them said, "Could not He Who opened the eyes of the blind, have caused that this man should not die?" Jesus therefore, again groaning in Himself, came to the tomb. Now it was a cave and a stone was laid against it. Jesus said, "Take away the stone." Martha, the sister of him who was dead, said to Him, "Lord, by this time he is already decayed, for he is dead four days." Jesus said to her, "Have I not told you that if you believe you shall behold the glory of God?" They therefore removed the stone. And Jesus, raising His eyes, said, "Father, I give You thanks that You have heard Me. Yet I knew that You always hear Me; but because of the people who stand round, I spoke, that they may believe that You have sent Me." When He had said this, He cried out with a loud voice, "Lazarus, come forth!" And at once he who had been dead came forth, bound feet and hands with bandages, and his face was tied up with a cloth. Jesus said to them, "Unbind him, and let him go." Many therefore of the Jews who had come to Mary, and had seen what He did, believed in Him.
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, 49th Tract on John
      text: |-
        Ye remember that in our last reading we learnt how that the Lord escaped out of the hands of them which took up stones to stone Him, and went away again beyond Jordan, into the place where John at first baptized. While, then, the Lord still tarried there, Lazarus was sick at Bethany, which was a town near to Jerusalem. It was that Mary which anointed the Lord with ointment, and wiped His Feet with her hair, whose brother Lazarus was sick. Therefore his sisters sent unto Him. We know already whither it was that they sent, for we know where Jesus was: He was gone away again beyond Jordan. His sisters sent unto Him, saying: Lord, behold, he whom Thou lovest is sick, in order that, if He so pleased, He might come and free him from his sickness. But Jesus healed not, that He might afterward quicken.

        What therefore sent his sisters to say? Lord, behold, he whom Thou lovest is sick and no more. They said not: Come, for Jesus loved him; and to tell Him that he was sick was enough. They dared not to say: Come, and heal him; they dared not to say: Speak the word where Thou art, and it shall be done here. And wherefore should they not have said this if they had the faith which won the Centurion so much praise? He had said: Lord, I am not worthy that Thou shouldest come under my roof; but speak the word only, and my servant shall be healed. But they said none of these things, only: Lord, behold, he whom Thou lovest is sick. It is enough that Thou shouldest know it. Thou art not one that lovest and leavest.

        But some man will say: How shall Lazarus be a type of the sinner, and yet the Lord so love him? Let such an one hear the words of the same Lord, which He said: I am not come to call the righteous, but sinners. For if God had not loved sinners, He had not come down from heaven to earth. When Jesus heard that, He said: This sickness is not unto death, but for the glory of God, that the Son of God might be glorified thereby. Such a glorification is no increase of majesty for Him, but of profit for us. He therefore meaneth to say: This sickness is not unto death, but for the working of a miracle, the which being wrought, if men will thereby believe in Christ, they shall escape the real death. Note especially how the Lord doth in this place declare Himself to be God, as it were by implication, for the sake of some which say that He is not the Son of God.
      responsory: |-
        R. Thy way is in the sea, and thy paths in the great waters. * Thou led thy people like a flock, by the hand of Moses and Aaron.
        V. Thou broughtest them through the Red Sea, and led them through much water.
        R. Thou led thy people like a flock, by the hand of Moses and Aaron.
      status: verified
