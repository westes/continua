collect:
  text: |
    Let us pray.
    O God, Who art ever multiplying the Children of thy Church, grant unto the same thy servants that they may lead the rest of their lives according to this beginning wherein Thou hast given them faith to receive the Sacrament of the New Birth.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

benedictus-antiphon:
  text: 'Jesus stood in the midst of His disciples * and said unto them: Peace be unto you, alleluia, alleluia.'
  status: verified

magnificat-antiphon:
  text: Behold My Hands * and my Feet, that it is I myself, alleluia, alleluia.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Luke 24:36-47
      text: 'At that time, Jesus stood in the midst of them, and saith to them: Peace be to you; it is I, fear not. But they being troubled and frightened, supposed that they saw a spirit. And He said to them: Why are you troubled, and why do thoughts arise in your hearts? See My hands and feet, that it is I Myself; handle, and see: for a spirit hath not flesh and bones, as you see Me to have. And when He had said this, He showed them His hands and feet. But while they yet believed not, and wondered for joy, He said: Have you any thing to eat? And they offered Him a piece of a broiled fish, and a honeycomb. And when He had eaten before them, taking the remains, He gave to them. And He said to them: These are the words which I spoke to you, while I was yet with you, that all things must needs be fulfilled, which are written in the law of Moses, and in the prophets, and in the psalms, concerning Me. Then He opened their understanding, that they might understand the scriptures. And He said to them: Thus it is written, and thus it behoved Christ to suffer, and to rise again from the dead, the third day: And that penance and remission of sins should be preached in His name, unto all nations, beginning at Jerusalem. And you are witnesses of these things.'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Book 10, Commentary on Luke 24
      text: |-
        We see here the marvelous nature of the Lord's glorified Body. It could enter unseen, and then become seen. It could easily be touched, but Its nature is hard to understand. The disciples were affrighted, and supposed that they had seen a spirit. And therefore the Lord, that He might show us the evidence of His Resurrection, said: Handle Me, and see; for a spirit hath not flesh and bones as ye see Me have. Therefore it was not by being in a disembodied state, but by the peculiar qualities of the risen and glorified Body that He had passed through closed doors. For that which is touched or handled is a body.

        We shall all rise again with our bodies. But it is sown a natural body; it is raised a spiritual body. The spiritual body is the finer, and the natural body is the grosser, besodden as yet by the corruption of earth. Was not that a real Body, wherein remained those marks of His Wounds, those holes of the nail-prints, which the Lord bade His disciples to handle? Hereby, also, He hath not only strengthened our faith, but also quickened our love, since we know that it has been His will to carry to heaven those Wounds which He bore for our sake, and wherewith He would not make away; but plainly showeth to His Eternal Father the price of our freedom. It is as marked with these Wounds and embracing the trophy of our salvation that the Father hath said to Him, Sit Thou at My right Hand: and it is, like Him, marked with their wounds, that He hath shown us that the Martyrs, whose Crown He is, are, and will be with Him there.

        And now, since our Lesson from Luke here faileth, let us have recourse to John, and consider how that, according to him, then were the disciples glad when they saw the Lord, and received the grace of faith. According to Luke, He upbraided them with their unbelief, but according to John He said also, Receive ye the Holy Ghost. Luke, not John, hath, Tarry ye in the city of Jerusalem, until ye be endued with power from on high. Indeed, to me it seemeth as though the one Evangelist had busied himself with the greater and higher matters, and the other with the narrative, and such things as are more human: the one with the course, the other with the essence, of history. For as it is impossible to doubt the word of him who testifieth of these things, and who saw these things, and concerning whom we know that his testimony is true, so is it sinful to think of negligence or falsehood as attaching to the other, even Luke, who earned to himself to be an Evangelist, albeit he was not an Apostle, and therefore we hold that both are truthful, neither are they at variance one with the other, either in the difference of the words they use, or in the sacredness of their characters as Evangelists. For though Luke saith that at the first the Apostles believed not, yet he showeth that afterward they believed: and although, if we regard only the first fact, the Evangelists seem divergent one from the other, yet, when we consider what cometh afterward, we see that they are at one.
      responsory: |-
        R. With great power gave the Apostles * witness of the Resurrection of our Lord Jesus Christ, alleluia, alleluia.
        V. They were all filled with the Holy Ghost, and they spoke the Word of God with boldness.
        R. Witness of the Resurrection of our Lord Jesus Christ, alleluia, alleluia.
      status: verified
