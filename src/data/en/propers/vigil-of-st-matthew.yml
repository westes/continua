nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: true
      citation: Luke 5:27-32
      text: 'At that time: Jesus saw a publican named Levi sitting at the tax office, and said to him: Follow me. And leaving all things, he rose up and followed him. And Levi made him a great feast in his own house; and there was a great crowd of publicans and others reclining at table with them. And the Pharisees and their scribes murmured, saying to his disciples: Why do you eat and drink with publicans and sinners? And Jesus answering said to them: They who are in health do not need a physician, but they who are sick. I have not come to call the just, but sinners to repentance.'
      status: draft
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Book 5
      text: |-
        There is a mystery in this calling of the publican, whom He biddeth to follow Him, not so much by bodily steps as by change of heart. Hitherto Levi had been making greedy gains from merchandise, cruel riches at the cost of sailors' toils and dangers; but now, at the call of a word, he, who had been plundering other men's goods, leaveth his own. He leaveth that base station, and followeth hard after the Lord with all his heart. And Levi made Him a great feast in his own house. He that welcometh Christ into his home, feasteth upon the excellency of all pleasures.

        And so the Lord gladly enters in, and reclines in the affection of him who has believed. But again the envy of the faithless is kindled, and the likeness of a punishment to come is prefigured. For while the faithful feast and recline in that kingdom of the heavens, unbelief, famished, will be tormented. At the same time it is shown how great a difference there is between the rivals of the Law and of grace: that those who follow the Law suffer an eternal hunger of a fasting mind, while those who have received the Word in the inward parts of the soul, refreshed by the abundance of heavenly food and of the fountain, cannot hunger or thirst.

        And so those who fasted in spirit murmured, saying: Why does he eat and drink with publicans and sinners? This is a serpent's voice. For indeed the serpent uttered this very first word, saying to Eve: Why indeed did God say, Do not eat of every tree? So they who say, Why indeed does he eat and drink with publicans and sinners, spread abroad the poison of their father. Whence the Lord, by eating with sinners, does not forbid us to enter also into feasting with the Gentiles, saying: They that are well have no need of a physician, but they that are sick.
      status: draft
