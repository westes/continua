    R. We will adore in the place where his feet stood.
  status: draft

terce-capitulum:
  text: |
    In all these I sought rest, and I shall abide in the inheritance of the Lord. Then the creator of all things commanded, and said to me: and he that made me, rested in my tabernacle.
    R. Thanks be to God.
    V. Lord, I have loved the beauty of thy house.
    R. And the place where thy glory dwelleth.
  citation: Ecclesiasticus 24:11-12
  status: verified

