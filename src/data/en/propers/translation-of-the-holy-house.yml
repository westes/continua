nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard, Abbot, Sermon 52 on Various Subjects
      text: 'Wisdom, which was God''s and was God, coming to us from the bosom of the Father, built herself a house, namely her own Mother, the Virgin Mary, in which she hewed out seven pillars. What is it to hew out seven pillars in her, but to prepare for herself a dwelling worthy of her by faith and by works? The number three belongs to faith, doubtless, on account of the holy Trinity; the number four to morals, on account of the four cardinal virtues. And that in blessed Mary the holy Trinity was, I say was, by the presence of majesty, where the Son alone was by the assumption of humanity, the heavenly messenger bears witness, who, unfolding to her the secret mysteries, says: Hail, full of grace, the Lord is with thee; and a little after: The Holy Ghost shall come upon thee, and the power of the Most High shall overshadow thee. Behold, thou hast the Lord, thou hast the power of the Most High, thou hast the Holy Ghost, thou hast the Father, the Son, and the Holy Ghost.'
      responsory: |
        R. How dreadful is this place! * Surely this is none other but the house of God, and the gate of heaven.
        V. This is the house of the Lord, stoutly builded, well founded upon a sure rock.
        R. Surely this is none other but the house of God, and the gate of heaven.
      status: draft
    - nocturn: 2
      isGospel: false
      source: St. Bernard, Abbot, Sermon 52 on Various Subjects
      text: 'But whether she also possessed the four cardinal virtues, as four pillars, seems worth inquiring. First, then, let us see whether she had fortitude. How could that virtue be wanting to her, who, casting away worldly pomps and despising the pleasures of the flesh, resolved to live for God alone in virginity? Unless I am mistaken, this is the Virgin of whom it is read in Solomon: Who shall find a valiant woman? Far and from the uttermost coasts is the price of her. Further, that she was temperate and just, we prove more clearly than light from her conversation with the Angel and her own answer. For being saluted so reverently by the Angel: Hail, full of grace, the Lord is with thee, she did not exalt herself, as one blessed by a singular privilege of grace, but was silent, and thought within herself what manner of salutation this was. In which what was she, if not temperate? But indeed, when she was taught by the same Angel concerning the heavenly mysteries, she diligently asked how she should conceive and bear, who certainly knew not man; and in this she undoubtedly showed herself prudent.'
      responsory: |
        R. The Lord's house is established in the top of the mountains, and exalted above the hills; * And all nations shall flow unto it, and shall say: Glory be to thee, O Lord!
        V. They shall doubtless come again with rejoicing, bringing their sheaves with them.
        R. And all nations shall flow unto it, and shall say: Glory be to thee, O Lord!
      status: draft
    - nocturn: 2
      isGospel: false
      source: St. Bernard, Abbot, Sermon 52 on Various Subjects, and the Office's own account of the Translation
      text: 'She bears the mark of justice, moreover, when she confesses herself the handmaid of the Lord; for that confession belongs to the just, he witnesses who says: But the just shall give glory to thy name. The blessed Virgin Mary was therefore strong in purpose, temperate in silence, prudent in questioning, just in confession. With these four pillars of morals, then, and the three aforesaid of faith, heavenly Wisdom built herself a house in her, which so filled her mind that from the fullness of her mind the flesh also was made fruitful. The very natal house of the Virgin, consecrated by divine mysteries, was by the ministry of Angels carried from the power of unbelievers first into Dalmatia, then into the Laurentan field of the province of Picenum, in the time of Pope Celestine the Fifth: and that it is the very one in which the Word was made flesh and dwelt among us, is proved both by pontifical diplomas and by the most celebrated veneration of the whole world, and by the continual power of miracles and the grace of heavenly benefits. Moved by these things, Innocent the Twelfth, that the memory of the Faithful might be stirred up more fervently toward the worship of the most loving Mother, ordered the Translation of the same holy House, venerated with an annual solemnity in the whole province of Picenum, to be celebrated also with Mass and Office of its own.'
      responsory: |
        R. My house shall be called the house of prayer, saith the Lord. Therein, he that asketh, receiveth; he that seeketh, findeth; * And to him that knocketh, it shall be opened.
        V. Ask, and ye shall receive; seek, and ye shall find.
        R. And to him that knocketh, it shall be opened.
      status: draft
    - nocturn: 3
      isGospel: true
      citation: Luke 1:26-38
      text: 'At that time, the angel Gabriel was sent from God to a town of Galilee called Nazareth, to a virgin betrothed to a man named Joseph, of the house of David, and the virgin''s name was Mary. And when the angel had come to her, he said, "Hail, full of grace, the Lord is with you. Blessed are you among women." When she had heard him she was troubled at his word, and kept pondering what manner of greeting this might be. And the angel said to her, "Do not be afraid, Mary, for you have found grace with God. Behold, you shall conceive in your womb and shall bring forth a son; and you shall call His name Jesus. He shall be great, and shall be called the Son of the most High; and the Lord God will give Him the throne of David His father, and He shall be king over the house of Jacob forever; and of His kingdom there shall be no end." But Mary said to the angel, "How shall this happen, since I do not know man?" And the angel answered and said to her, "The Holy Spirit shall come upon you, and the power of the Most High shall overshadow you, and therefore the Holy One to be born shall be called the Son of God. And, behold, Elizabeth your kinswoman also has conceived a son in her old age, and she who was called barren is now in her sixth month; for nothing shall be impossible with God." But Mary said: "Behold the handmaid of the Lord; be it done to me according to your word."'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard, Abbot, Homily 1 on "Missus est"
      text: 'Who is this Virgin, so venerable as to be saluted by an Angel? so humble as to be betrothed to a carpenter? A beautiful mingling of virginity and humility: and not moderately does that soul please God in which humility commends virginity, and virginity adorns humility. But how great, thinkest thou, must that one be held worthy of veneration, in whom fruitfulness exalts humility, and childbearing consecrates virginity? Thou hearest a virgin, thou hearest a humble one? Virginity is a praiseworthy virtue, but humility more necessary: the one is counselled, the other commanded.'
      responsory: |
        R. Grace is poured abroad in thy lips, * Therefore hath God blessed thee for ever.
        V. Myrrh, and stacte, and cassia from thy garments, from the ivory houses, whereby the daughters of kings have made thee glad in thy glory.
        R. Therefore hath God blessed thee for ever.
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Bernard, Abbot, Homily 2 on "Missus est"
      text: 'An Angel, he says, was sent to a virgin: a virgin in body, a virgin in mind, a virgin by profession, a virgin finally such as the Apostle describes, holy in mind and body, found neither newly nor by chance, but chosen from of old, foreknown by the Most High, and prepared for himself, guarded by Angels, prefigured by the Fathers, promised by the Prophets. To say few things out of many: what other did God seem to have foretold, when he said to the serpent: I will put enmities between thee and the woman? And if thou doubtest still whether he spoke of Mary, hear what follows: She shall crush thy head; for whom was this victory reserved, if not for Mary?'
      responsory: |
        R. Blessed art thou, O Virgin Mary, Mother of God, who hast believed in the Lord: the things that were spoken to thee are accomplished in thee: behold, thou art exalted above the choirs of Angels: * Intercede for us with the Lord our God.
        V. Hail, Mary, full of grace: the Lord is with thee.
        R. Intercede for us with the Lord our God.
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Bernard, Abbot, Homily 3 on "Missus est"
      text: 'And the Angel being come in unto her, said: Hail, full of grace, the Lord is with thee. Where did he come in to her? I think into the shrine of her chaste chamber, where she, perhaps with the door shut upon her, was praying to the Father in secret. Angels are wont to stand by those who pray, and to delight in those whom they see lifting pure hands in prayer. They rejoice to offer to God the holocaust of holy devotion for an odour of sweetness. But how much the prayers of Mary pleased in the sight of the Most High, the Angel showed, who coming in to her saluted her so reverently.'
      status: draft
