collect:
  text: |
    Let us pray.
    O God, who in thy mercy didst consecrate the House of the blessed Virgin Mary by the mystery of the incarnate Word, and didst wonderfully place it in the bosom of thy Church: grant that, set apart from the tabernacles of sinners, we may be made worthy inhabitants of thy holy House.
    Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. Behold the tabernacle of God with men, * and he will dwell with them: and they shall be his people, and God himself with them shall be their God.
    V. We will go into his tabernacle.
    R. We will adore in the place where his feet stood.
    Let us pray.
    O God, who in thy mercy didst consecrate the House of the blessed Virgin Mary by the mystery of the incarnate Word, and didst wonderfully place it in the bosom of thy Church: grant that, set apart from the tabernacles of sinners, we may be made worthy inhabitants of thy holy House.
    Through the same our Lord Jesus Christ, thy Son, who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    Blessed city, heavenly Salem,
    Vision dear of peace and love,
    Who of living stones art builded
    In the height of heaven above,
    And, with angel hosts encircled,
    As a bride dost earthward move;

    From celestial realms descending,
    Bridal glory round thee shed,
    Meet for him whose love espoused thee,
    To thy Lord shalt thou be led;
    All thy streets and all thy bulwarks
    Of pure gold are fashioned.

    Bright thy gates of pearl are shining;
    They are open evermore;
    And by virtue of his merits
    Thither faithful souls do soar,
    Who for Christ's dear Name in this world
    Pain and tribulation bore.

    Many a blow and biting sculpture
    Polished well those stones elect,
    In their places now compacted
    By the heavenly Architect,
    Who therewith hath willed for ever
    That his palace should be decked.

    Laud and honor to the Father,
    Laud and honor to the Son,
    Laud and honor to the Spirit,
    Ever Three, and ever One,
    Consubstantial, co-eternal,
    While unending ages run.
    Amen.
  status: verified

matins-invitatory:
  text: 'The Saviour of the world, conceived of the Holy Ghost in the house of the Virgin: * Come, let us adore.'
  status: draft

lauds-capitulum:
  text: 'In all these I sought rest, and I shall abide in the inheritance of the Lord. Then the creator of all things commanded, and said to me: and he that made me, rested in my tabernacle.'
  citation: Ecclesiasticus 24:11-12
  status: verified

lauds-hymn:
  text: |
    Christ is made the sure Foundation,
    Christ the Head and Cornerstone;
    Chosen of the Lord, and precious,
    Binding all the Church in one,
    Holy Zion's Help for ever,
    And her Confidence alone.

    All that dedicated city,
    Dearly loved of God on high,
    In exultant jubilation,
    Pours perpetual melody,
    God the One in Three adoring
    In glad hymns eternally.

    To this temple, where we call Thee,
    Come, O Lord of Hosts, today;
    With Thy wonted loving-kindness
    Hear Thy servants as they pray.
    And Thy fullest benediction
    Shed within its walls alway.

    Here vouchsafe to all Thy servants
    What they ask of Thee to gain;
    What they gain from Thee for ever
    With the blessed to retain,
    And hereafter in Thy glory
    Evermore with Thee to reign.

    Laud and honor to the Father,
    Laud and honor to the Son,
    Laud and honor to the Spirit,
    Ever Three, and ever One,
    Consubstantial, co-eternal,
    While unending ages run.
    Amen.
  status: verified

lauds-versicle:
  text: |
