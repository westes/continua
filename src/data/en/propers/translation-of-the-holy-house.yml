matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: Thy magnificence is elevated above the heavens.
      - psalms:
          - 18
        antiphon: He hath set his tabernacle in the sun, and he, as a bridegroom coming out of his bride-chamber.
      - psalms:
          - 23
        antiphon: Who shall ascend into the mountain of the Lord? or who shall stand in his holy place? The innocent in hands and clean of heart.
    versicle:
      v: This is the house of God, and the gate of heaven.
      r: And it shall be called the court of God.
  nocturn2:
    groups:
      - psalms:
          - 44
        antiphon: Grace is poured abroad in thy lips; therefore hath God blessed thee for ever, and for ever and ever.
      - psalms:
          - 45
        antiphon: The Most High hath sanctified his tabernacle.
      - psalms:
          - 86
        antiphon: A man is born in her, and the Most High himself hath founded her.
    versicle:
      v: Lord, I have loved the beauty of thy house.
      r: And the place where thy glory dwelleth.
  nocturn3:
    groups:
      - psalms:
          - 95
        antiphon: 'Bring up sacrifices, and come into his courts: * adore ye the Lord in his holy court.'
      - psalms:
          - 96
        antiphon: All people have seen his glory.
      - psalms:
          - 97
        antiphon: Sing ye to the Lord a new canticle, for the Lord hath done wonderful things, alleluia.
    versicle:
      v: Holiness becometh thy house, O Lord.
      r: For length of days.

lauds-psalmody:
