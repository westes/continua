magnificat-antiphon:
  text: A woman * in the city, which was a sinner, brought an alabaster box of ointment, and stood at the Lord's feet, behind him, weeping, and began to wash his feet with tears, and did wipe them with the hairs of her head.
  status: verified

magnificat-antiphon/~-first:
  text: A woman in the city * which was a sinner, when she knew that Jesus sat at meat in the house of Simon the leper, brought an alabaster box of ointment, and stood at the Feet of Jesus, behind Him, weeping, and began to wash His Feet with tears, and did wipe them with the hairs of her head, and kissed His Feet, and anointed them with the ointment.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Homily 25 on the Gospels
      text: |-
        Mary Magdalen, a woman in the city, which was a sinner, through love of the truth, washed away in her tears the defilement of her sins, and the words of the Truth are fulfilled which He spake: Her sins, which are many, are forgiven; for she loved much. She who had remained chilly in sin, became fiery through love. When even His disciples went away again unto their own home, Mary still stood without at the sepulchre of Christ, weeping. She sought Him Whom her soul loved, but she found Him not. She searched for Him with tears; she yearned with strong desire for Him Who, she believed, had been taken away. And thus it befell her, that being the only one who had remained to seek Him, she was the only one that saw Him. It is the truth that the backbone of a good work is perseverance.

        At first when she sought Him, she found Him not; she went on searching, and so it came to pass that she found Him; and this was so, to the end that her longing might grow in earnestness, and so in its earnestness might find what it sought. Hence is it that the Bride in the Song of Songs saith as representing the Church: By night on my bed I sought him whom my soul loveth. We seek on our bed for Him Whom our soul loveth, when, having got some little rest in this world, we still sigh for the Presence of our Redeemer; but it is by night that we so seek Him, for though our mind may be on the alert for Him, yet still He is hidden from our eyes by the darkness that now is.

        But if we find not Him Whom our soul loveth, it remaineth that we should rise and go about the city, that is, by thought and questioning, go through the holy Church of the elect; seek Him in the streets, and in the broad ways, that is, walk anxiously looking about us both in the narrow and the broad places, that if we can, we may find His footsteps there; for there are some even of those who live for the world, from whom something may be learnt to be imitated by a godly man. As we thus go wakefully about, the watchmen, that keep the city, find us; the holy Fathers, who are the watchmen of the bulwarks of the Church, come to meet our good endeavours, and to teach us either by their words or by their writings. And it needeth but a little to pass from them, but we find Him Whom our soul loveth, for albeit our Redeemer in lowliness became a man among men, yet by right of His Divine Nature He is still above men.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 7:36-50
      text: At that time, one of the Pharisees asked Jesus to dine with him; so He went into the house of the Pharisee and reclined at table. And behold, a woman in the town who was a sinner, upon learning that He was at table in the Pharisee's house, brought an alabaster jar of ointment; and standing behind Him at His feet, she began to bathe His feet with her tears, and wiped them with the hair of her head, and kissed His feet, and anointed them with ointment. Now when the Pharisee, who had invited Him, saw it, he said to himself, "This man, were He a prophet, would surely know who and what manner of woman this is who is touching Him, for she is a sinner." And Jesus answered and said to him, "Simon, I have something to say to you." And he said, "Master, speak." "A certain money-lender had two debtors; the one owed five hundred denarii, the other fifty. As they had no means of paying, he forgave them both. Which of them, therefore, will love him more?" Simon answered and said, "He, I suppose, to whom he forgave more." And He said to him, "You have judged rightly." And turning to the woman, He said to Simon, "Do you see this woman? I came into your house; you gave Me no water for My feet; but she has bathed My feet with her tears, and has wiped them with her hair. You gave Me no kiss; but she, from the moment she entered, has not ceased to kiss My feet. You did not anoint My head with oil; but she has anointed My feet with ointment. Wherefore I say to you, her sins, many as they are, shall be forgiven her, because she has loved much. But he to whom little is forgiven, loves little." And He said to her, "Your sins are forgiven." And they who were at table with Him began to say within themselves, "Who is this man, who even forgives sins?" But He said to the woman, "Your faith has saved you; go in peace."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Homily 23 (on Luke 7:36-50)
      text: Ye have listened carefully to the Gospel while it was being read, so that the thing told hath, as it were, passed before the eyes of your heart. Ye have seen in your mind's eye, albeit not with bodily sight, the Lord Jesus Christ sitting down to meat in the Pharisee's house, and not refusing when He is bidden of him. Ye have seen also an infamous woman of the city, one of utterly bad character, a sinner, thrusting herself in an uninvited guest, to the banquet where her Healer was sitting, and seeking health at His hands with godly shamelessness; thrusting herself in eager for mercy, as though eager for the feast. She knew under what a disease she laboured, and she knew that He unto Whom she came was mighty to cure it.
      status: verified
