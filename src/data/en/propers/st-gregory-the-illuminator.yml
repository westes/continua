nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gregory, sprung from the kings of Armenia, who was first after the holy Apostle Bartholomew to bring the faith of Christ into that province, and therefore called in his native tongue the Illuminator, snatched away secretly as an infant to avoid the death with which his family was sought, was piously brought up at Caesarea in Cappadocia, and, instructed in the law of Christ, received baptism. Thither had withdrawn Tiridates, the son of Chosroes king of the Armenians, treacherously slain by Anak the father of Gregory, deprived of his kingdom by the Persians, to whom Gregory, well aware of his father's crime, gave himself in servitude, and returned with him, who had now recovered his kingdom from the Romans, into Armenia, where, tempted often by Tiridates to sacrifice to idols, since he most constantly refused, he was forced to undergo almost innumerable and incredible kinds of torments.

        Tiridates first shut Gregory up in strict custody; then he ordered his hands to be so bound to his sides that the elbows stood out, and a muzzle to be put into his mouth, and lumps of cut salt to be laid on his back, and, bound round the chest with a strap tightly drawn, to be hung up in a very high place. He remained thus hanging seven days, after which, as he persevered in his resolve, hung by one foot he was forced to inhale the smoke raised from foul-smelling dung, while meanwhile he was strongly beaten with wet rods. Among these things he besought God with earnest prayers for the salvation of all, especially of the nation of the Armenians, and that He would grant him constancy for the faith. The king, wondering at this indeed, raged yet more cruelly, and ordered logs of wood to be brought, and boards laid upon the front parts of his feet, and tightly bound with knotted ropes, until the blood flowed out at the tips of the toes. He was also bruised with blows of the fist, and his head was set in an artful screw, and, a tube being applied to his nostril, salt, natron and vinegar mixed together were poured in. Many like and worse kinds of cruelty he endured, so that the king himself greatly wondered that he remained alive and made light of the intense pains.

        When however one of the satraps, speaking to the king, had made known to him that Gregory was the son of Anak, the murderer of his father Chosroes, he ordered him bound hands and feet and neck to be led into the province of Ararat, and thrust to the summit of the fortress of Artaxata, and let down into the lowest pit, until he should die there. But God, who had snatched him living from such tortures, likewise kept him unharmed from this, and after a long time brought Tiridates himself, like another Nebuchadnezzar proved by trial, to the light of faith, whom Gregory, purified by fasting, reconciled to God through baptism. And so, power being given him to preach publicly the Gospel of Christ, he instructed the nation of Greater Armenia in the faith and washed them in the sacred font, and raised churches everywhere, the images of superstition being destroyed and their temples overthrown; ordained at Caesarea archbishop of his nation, he more earnestly instructed the Armenians in divine doctrine, and confirmed them in the faith received. At last, most desirous of quiet and of divine leisure, he withdrew into solitude, where, given to fasting and contemplation, laden with merits, in good old age he fell asleep in the Lord, in the time of Constantine the Great. His body those fleeing from Armenia carried into Italy; his head with the chains by which he had been bound was placed at Naples, and his arm in the cathedral of Nardò.
      status: draft
