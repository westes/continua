collect/~-after-ascension:
  text: |
    Let us pray.
    O Almighty and everlasting God, grant that our will be ever meekly subject unto thy will, and our heart ever honestly ready to serve thy majesty.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

matins-hymn:
  text: |-
    Now, from the slumbers of the night arising,
    Chant we the holy psalmody of David,
    Hymns to our Master, with a voice concordant,
    Sweetly intoning.

    So may our Monarch pitifully hear us,
    That we may merit with his saints to enter
    Mansions eternal, therewithal possessing
    Joy beatific.

    This be our portion, God forever blessed,
    Father eternal, Son, and Holy Spirit,
    Whose is the glory, which through all creation
    Ever resoundeth. Amen.
  status: verified

matins-invitatory/antiphon-~:
  text: Let us worship the Lord, * for He is our Maker.
  status: verified

lauds-capitulum:
  text: Benediction, and glory, and wisdom, and thanksgiving, honour, and power, and strength to our God for ever and ever. Amen.
  citation: Rev 7:12
  status: verified

lauds-hymn:
  text: |
    Lo, the dim shadows of the night are waning;
    Lightsome and blushing, dawn of day returneth;
    Fervent in spirit, to the world’s Creator
    Pray we devoutly:

    That he may pity sinners in their sighing,
    Banish all troubles, kindly health bestowing;
    And may he grant us, of his countless blessings,
    Peace that is endless.

    * This be our portion, God forever blessed,
    Father eternal, Son, and Holy Spirit,
    Whose is the glory, which through all creation
    Ever resoundeth.
    Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Incline my heart * into thy testimonies.
    R. Incline my heart * into thy testimonies.
    V. Turn away my eyes that they may not behold vanity: quicken me in thy way.
    R. Into thy testimonies.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Incline my heart * into thy testimonies.
  status: verified

lauds-versicle:
  text: |-
    V. The Lord reigns, he is clothed with beauty.
    R. The Lord is clothed with strength, and has girded Himself with power.
  status: verified

vespers-capitulum/~-ferial:
  text: Blessed be the God and Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort, who comforteth us in all our tribulation.
  citation: 2 Cor 1:3-4
  status: draft

vespers-hymn:
  text: |
    O blest Creator of the light,
    Who mak'st the day with radiance bright,
    And o'er the forming world didst call
    The light from chaos first of all;

    Whose wisdom joined in meet array
    The morn and eve, and named them day:
    Night comes with all its darkling fears;
    Regard thy people's prayers and tears.

    Lest, sunk in sin, and whelmed with strife,
    They lose the gift of endless life;
    While thinking but the thoughts of time,
    They weave new chains of woe and crime.

    But grant them grace that they may strain
    The heavenly gate and prize to gain:
    Each harmful lure aside to cast,
    And purge away each error past.

    * O Father, that we ask be done,
    Through Jesus Christ, thine only Son;
    Who, with the Holy Ghost and thee,
    Doth live and reign eternally.
    Amen.
  status: draft

vespers-responsory:
  text: |
    R.br. How great are thy works, * O Lord.
    R. How great are thy works, * O Lord.
    V. Thou hast made all things in wisdom.
    R. Thy works, O Lord.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. How great are thy works, * O Lord.
  status: draft

vespers-versicle/~-ferial:
  text: |
    V. O Lord, direct my prayer.
    R. As incense in thy sight.
  status: draft

