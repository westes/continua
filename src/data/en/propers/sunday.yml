nocturn-readings/~-after-ascension:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 175, on the Ascension
      text: |-
        Dearly beloved brethren, our Saviour is gone up from us into heaven, but let us not be troubled on earth. Let only our heart be there with Him, and we shall have peace here. Let us in heart thither ascend with Christ in the mean while, and when that glad day which He hath promised cometh, our body will follow. But we must know, my brethren, that there are some things that cannot ascend with Christ: pride cannot, nor covetousness, nor brutishness: no one of our diseases can ascend thither where our Healer is. And, therefore, if we would follow our Healer, we must needs leave our diseases and sins behind us. All such things tie us down, as it were, with bands, and hamper us in the meshes of a net of sins: but, with God's help, we will say with the Psalmist: "Let us break their bands asunder," that we may be able honestly to say to the Lord: "Thou hast loosed my bonds, I will offer to thee the sacrifice of thanksgiving."

        The Resurrection of the Lord is our hope: the Ascension of the Lord is our glorification. To-day we keep the solemn holiday of the Ascension. If, therefore, our keeping of this holiday is to be a right, faithful, earnest, holy, godly keeping, we must in mind likewise ascend, and lift up our hearts unto the Lord. When we ascend we must not be high-minded, nor flatter ourselves with our good works, as though they were our own. We must lift up our hearts unto the Lord. When man's heart is lifted up, but not unto the Lord, such lifting-up is pride: to lift up the heart unto the Lord, is to make the Most High our Refuge. Behold, my brethren, a great wonder. God is high, but if thou art lifted up He fleeth from thee, whereas, if thou humblest thyself, He cometh down to thee. Wherefore? "The Lord is high, yet hath He respect unto the lowly: but the proud He knoweth from afar." To the lowly He hath respect, that He may raise them up: the proud He knoweth from afar, that He may thrust them down.

        Christ arose again, to give us hope that this mortal will yet put on immortality: He hath assured us against an hopeless death, and against the thought that death endeth life. We were troubled, even as touching the soul: but Christ, arising from the grave, hath assured to us the resurrection of the body also. Believe therefore, that thou mayest be made pure. First it behoveth thee to believe, if by faith thou wouldest in the end worthily see God. And wouldest thou see God? Give ear to His own words: "Blessed are the pure in heart, for they shall see God." Think first, then, how to purify thine heart; take from it whatsoever thou seest in it which displeaseth God. God would come to thee: hear Him saying: "I and the Father will come, and make our abode with him."
      responsory: |-
        R. My time is come that I should return unto Him That sent Me, saith the Lord. Be not sorrowful, neither let your heart be troubled. * I pray the Father for you, that He may keep you. Alleluia, Alleluia.
        V. If I go not away, the Comforter will not come unto you; where I am ascended, I will send Him unto you.
        R. I pray the Father for you, that He may keep you. Alleluia, Alleluia.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 15:26-27; 16:1-4
      text: 'At that time, Jesus said to His disciples: When the Advocate has come, Whom I will send you from the Father, the Spirit of truth Who proceeds from the Father, He will bear witness concerning Me. And you also will bear witness, because from the beginning you are with Me. These things I have spoken to you that you may not be scandalized. They will expel you from the synagogues. Yes, the hour is coming for everyone who kills you to think he is offering worship to God. And these things they will do because they have not known the Father nor Me. But these things I have spoken to you, that when the time for them has come you may remember that I told you.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 92 on the Gospel of John
      text: |-
        The Lord Jesus, in that discourse which He addressed to His disciples after the Last Supper, when He was on the very eve of the Passion, when He was, as it were, about to go away and leave them as touching His bodily Presence, albeit as touching His spiritual Presence, He is with us alway even unto the end of the world, in that discourse He exhorted them to bear patiently the persecution of wicked men, of whom He speaketh as "the world", out of which world, nevertheless, He saith that He hath chosen even His disciples themselves, that they might know that it was by the grace of God that they were what they were, whereas it was by their own sins that they had been what they had been.

        "If they have persecuted Me, they will also persecute you." Here He clearly pointeth to the Jews, the persecutors both of Himself and of His disciples, so that we see that they which persecute His holy ones are as much citizens of the world of damnation as they which persecuted Himself. He saith: "They know not Him That sent Me," and yet again, "They have hated both Me and My Father," that is to say, both the Sender and the Sent, the meaning of which words we have already treated in other discourses: and with that He cometh to the words: "That the word might be fulfilled that is written in their law: They hated Me without a cause."

        Then saith the Lord, as though in continuation: "But when the Comforter is come, Whom I will send unto you from the Father, even the Spirit of truth, Which proceedeth from the Father, He shall testify of Me. And ye also shall bear witness, because ye have been with Me from the beginning." What connection hath this with the words: "Now have they both seen and hated both Me and My Father": but that the word might be fulfilled that is written in their law: "They hated Me without a cause." Is it that when the Comforter is come, even the Spirit of truth, He will confound by irrefragable testimony them who have both seen and hated both God the Son and God the Father? Yea, indeed, some there were who had seen and still hated, whom the testimony of the Comforter converted to the faith which worketh by love.
      responsory: |-
        R. I will pray the Father, and He shall give you another Comforter, * That He may abide with you for ever, even the Spirit of truth. Alleluia.
        V. For if I go not away, the Comforter will not come unto you; but if I depart, I will send Him unto you.
        R. That He may abide with you for ever, even the Spirit of truth. Alleluia.
      status: verified
