octave-readings/~-octave-day-7:
  source: Book of St. Ambrose, Bishop, on the Sacraments; Homily of St. Hilary, Bishop
  text: |
    Who invented the Sacraments but the Lord Jesus? The Sacraments came down from heaven, for all counsel is from heaven. Nevertheless, it was a great and wonderful work of God when He rained down manna upon His people, and the people laboured not, and yet were fed. Perchance thou sayest: "Here, it is my bread which is used." But that bread is bread only till the Sacramental words are spoken: at the Consecration, instead of bread, there cometh to be the Body of Christ. This therefore let us establish. How cometh it that that which was bread becometh the Body of Christ? Through the Consecration. And in what words, and in Whose language, doth the Consecration take place? In those of the Lord Jesus. All the other things which are said, the ascription of praise to God, the prayer for the people, for kings, and for others, are put in the mouth of the Priest; but when that point is reached when this worshipful Sacrament is to be consecrated, then the Priest useth no more his own words, but Christ's.

    It is the word of Christ, therefore, Which doth the needful work in this Sacrament. And what is the word of Christ? It is the word of Him at Whose bidding all things were made. The Lord commanded, and the heavens were created; the Lord commanded, and the earth was formed; the Lord commanded, and the seas were made; the Lord commanded, and all creatures sprang into being. Thou seest, then, how mightily working a word is the word of Christ. If then the word of Christ hath such power that it can make that to be which hath never been, wherein doth it appear less mighty that it maketh one thing to be changed into another? There was once no heaven; there was once no sea; there was once no earth. But hear Him Who saith: "He spake, and it was done; He commanded, and it stood fast." If, then, I am to answer thee, I tell thee, that before the Consecration it is not the Body of Christ, but after the Consecration it is the Body of Christ, for Himself "hath spoken, and it is done; He hath commanded, and it standeth fast."

    And now I come back to my text. It is indeed a great and worshipful fact that manna was rained down upon the Jews; but think thou, which was the more great and worshipful, the manna from heaven, or the Body of Christ, the Body of that Same Christ by Whom the heavens were made? And, again, the fathers "did eat manna, and are dead"; he that eateth of this Bread, it is unto him "the remission of sins," and "he shall never die." Therefore it is not idly that, when thou art receiving, thou sayest "Amen," testifying in thine heart that That Which thou art taking is the Body of Christ. The Priest saith unto thee: "The Body of Christ" — and thou answerest: "Amen," that is to say, "It is true." What then thy tongue confesseth, let thine heart hold to.

    When we speak concerning the things of God, we must not speak after the manner of men, nor after the manner of the world. Let us read those things which are written, and understand those things which we read, and then let us act as having a perfect faith. We shall speak but folly and godlessness if we speak concerning the natural truth of Christ in us, unless we have learnt from Him how we should speak. He Himself saith: "My Flesh is meat indeed, and My Blood is drink indeed. He that eateth My Flesh and drinketh My Blood, dwelleth in Me, and I in him." There is here no room left for doubt as to what is His Flesh and what is His Blood.

    Now we know, by the declaration of the Lord Himself and by our Faith, the reality of His Flesh and Blood. And when we eat the One and drink the Other, They work effectually in us to make us dwell in Him and He in us. Is not this a reality? Surely it befalleth not them to find it true, who deny that Christ Jesus is Very God. He is in us by means of His Flesh, and we are in Him when that which we are is with Him in God. That we dwell in Him through that Sacrament wherein His Flesh and Blood are given unto us, He Himself doth testify, where He saith: "Yet a little while, and the world seeth Me no more; but ye see Me, because I live, ye shall live also: I am in My Father, and ye in Me, and I in you."

    But that this union in us is a real one, He testifieth thus: "He that eateth My Flesh and drinketh My Blood, dwelleth in Me, and I in him." For no one dwelleth in Him in whom He doth not dwell, since he which receiveth hath but received that Flesh of the same nature as his own, which Christ hath taken into Himself. The mystery of this perfect union He had taught before, when He said: "As the living Father hath sent Me, and I live by the Father, so, he that eateth Me, even he shall live by Me." He therefore liveth by the Father; and, as He liveth by the Father, so shall we live by Him.
