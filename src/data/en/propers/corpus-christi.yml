nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Thomas Aquinas, Sermon for Corpus Christi (Opusculum 57)
      text: |-
        The immeasurable benefits, which the goodness of God hath bestowed on Christian people, have conferred on them also a dignity beyond all price. For what nation is there so great, who hath gods so nigh unto them, as the Lord, our God, is unto us? The Only-begotten Son of God, being pleased to make us partakers of the Divine nature, took our nature upon Him, being Himself made Man that He might make men gods. And all, as much of ours as He took, He applied to our salvation. On the Altar of the Cross He offered up His Body to God the Father as a sacrifice for our reconciliation; He shed His Blood as the price whereby He redeemeth us from wretchedness and bondage, and the washing whereby He cleanseth us from all sin. And for a noble and abiding memorial of that so great work of His goodness, He hath left unto His faithful ones the Same His very Body for Meat, and the Same His very Blood for Drink, to be fed upon under the appearance of bread and wine.

        How precious a thing then, how marvelous, how health-giving, how furnished with all dainties, is the Supper of the Lord! Than His Supper can anything be more precious? Therein there is put before us for meat, not, as of old time, the flesh of bulls and of goats, but Christ Himself, our very God. Than this Sacrament can anything be more marvelous? Therein it cometh to pass that bread and wine are bread and wine no more, but in the stead thereof there is the Body and there is the Blood of Christ; that is to say, Christ Himself, Perfect God and Perfect Man, is there, under the appearance of a little bread and wine. His faithful ones eat Him, but He is not mangled; nay, when this Sacrament is broken, in each broken piece thereof remaineth whole Christ Himself, Perfect God and Perfect Man. All that the senses can reach in this Sacrament abide of bread and wine, but the Thing is not bread and wine. And thus room is left for faith; Christ is here taken and received not only unseen, but seeming to be bread and wine, and the senses, which judge by the wonted look, are warranted against error.

        Than this Sacrament can anything be more health-giving? Thereby are sins purged away, strength renewed, and the soul fed upon the fatness of spiritual gifts. This Supper is offered up in the Church both for the quick and the dead; it was ordained to the health of all, and all get the good of it. Than this Sacrament can anything be more furnished with dainties? The glorious sweetness thereof is of a truth such that no man can fully tell it. Therein ghostly comfort is sucked from its very well-head. Therein a memorial is made of that exceeding great love which Christ showed in the time of His sufferings. It was in order that the boundless goodness of that His great love might be driven home into the hearts of His faithful ones, that when He had celebrated the Passover with His disciples, and was about to pass out of this world to the Father, He instituted this Sacrament, this everlasting memorial of His Passion, the fulfilment of all the ancient figures, and the greatest of the miracles He ever wrought; and to them that were sorrowful at His going He left it as a singular comfort at His absence.
      responsory: |-
        R. As they were eating, Jesus took bread, and blest it, and brake it, and gave it to the disciples, and said: * Take, eat; this is My Body.
        V. The men of my tabernacle said: O that we had of his flesh, we cannot be satisfied.
        R. Take, eat; this is My Body.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 6:56-59
      text: 'At that time, Jesus said to the crowds of the Jews: My Flesh is food indeed, and My Blood is drink indeed. He who eats My Flesh, and drinks My Blood, abides in Me and I in him. As the living Father has sent Me, and as I live because of the Father, so he who eats Me, he also shall live because of Me. This is the Bread that has come down from heaven; not as your fathers ate the manna, and died. He who eats this Bread shall live forever.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 26 on John
      text: |-
        By use of meat and drink men would fain that they shall hunger no more, neither thirst any more, and yet there is but one Meat and one Drink, Which doth work in them that feed thereon that this corruptible must put on incorruption, and this mortal put on immortality, namely communion with that general assembly and Church of God's holy children, who are kept in perfect peace, and are all one, fully and utterly. And therefore it is, as men of God before our time have taken it, that our Lord Jesus Christ hath set before us His Body and His Blood in the likeness of things which, from being many, are reduced into one. In one loaf are many grains of corn, and in one cup of wine the juice of many grapes. And now He giveth us to know how that which He spake cometh to pass, and how indeed this Man can give us His Flesh to eat, and His Blood to drink. He that eateth My Flesh, and drinketh My Blood, dwelleth in Me, and I in him. To dwell in Christ, therefore, and to have Him dwelling in us, is to eat of that Bread and drink of that Cup, and he which dwelleth not in Christ, and in whom Christ dwelleth not, without all doubt doth not spiritually eat His Flesh nor drink His Blood, although he do carnally and visibly press the Sacrament with his teeth; but, contrariwise, he eateth and drinketh damnation to himself, because he dareth to draw nigh filthy to that secret and holy thing of Christ, whereunto none draweth nigh worthily, save he which is pure, even he which is of them concerning whom it is said: Blessed are the pure in heart, for they shall see God.

        As the living Father hath sent Me, and I live by the Father, so he that eateth Me, even he shall live by Me. This is as though He said: The Father hath sent Me into the world, and I have emptied Myself and taken upon Me the form of a servant. I have My life from the Father, as One That is greater than I. He that eateth Me, even he, by thereby taking part in Me, shall live by Me. It is as having humbled Myself that I live by the Father, but he that eateth Me, him will I raise up, and so he shall live by Me. It is said "I live by the Father," that is to say, He is of the Father, not the Father of Him, and yet not so, but that the Father and the Son are co-equal together. Also it is said "So he that eateth Me, even he shall live by Me," whereby He showeth the gracious work towards His people of Him Who is the one Mediator between God and man, and not that He Which is eaten and he which eateth Him are co-equal together.
      responsory: |-
        R. He that eateth My Flesh and drinketh My Blood, * dwelleth in Me, and I in him.
        V. What nation is there so great, who hath gods so nigh unto them, as the Lord our God is to us?
        R. Dwelleth in Me, and I in him.
      status: verified

octave-readings/~-octave-day-2:
  source: Sermon of St. Thomas Aquinas; Homily of St. Augustine, Bishop
  text: |
    It serveth well therefore to the edifying of the faithful to make memorial of the institution of this so health-giving and so wonderful a Sacrament, that we may worship the unspeakable way by the which the Divine Presence in-dwelleth in this Sacrament, Which we see, and may praise the power of God whereby in this Sacrament are wrought so many wonders, yea, and also give God some of those thanks which we owe unto Him for this so health-giving gift of His loving-kindness. It is true that on the Day of the Supper of the Lord, on which day we know it to have been that He ordained this Sacrament, at the solemn celebration of the Mass, the memory of the instituting thereof is more particularly mentioned, but all the rest of the Services on that day deal chiefly with Christ Suffering, to worshipping of Whom the Church doth at that season give all her mind.

    But, that the congregation of Christ's faithful people might celebrate with an whole Festal Office all to itself the institution of this so great Sacrament, Urban IV, Bishop of Rome, being touched with love toward this said Sacrament, hath made a godly ordinance that the memory of the said institution should be celebrated by all the faithful upon the Fifth Day of the week, next after the Eighth Day of Pentecost. From one end of the year to the other we use this Sacrament to our souls' health, and we more particularly celebrate the institution thereof at that season wherein the Holy Ghost taught the hearts of the disciples to acknowledge the mysteries thereof, for then it was, as we read, that they continued steadfastly in the breaking of Bread.

    And, moreover, to the end that on the aforesaid Thursday, and the seven days next following, the memory of this health-giving Institution might be the more honourably celebrated, and the Feast thereby be held in more excellent worship, the abovenamed Bishop of Rome, after the manner of the doles which in Cathedral Churches are given to such as come to the singing or saying of the Canonical Hours by night and day, hath out of his Apostolic bounty granted spiritual rewards to all such as in their own persons are present in the Church at the diverse Canonical Hours during all this Festival, thereby to stir up the faithful to come to the keeping of this great Feast in greater eagerness and numbers.

    We have heard from the Gospel the words of the Lord which follow those that formed the subject of my earlier discourse. To your ears and understandings we owe a discourse on these also, and to-day it becometh very well, for it is upon that Body of the Lord, Which He professeth Himself that He will give for the life of the world, that a man may eat thereof and not die. He hath made manifest how He giveth, and What is His Gift, where He saith: "He that eateth My Flesh and drinketh My Blood, dwelleth in Me and I in him." The sign to show whether a man hath or hath not eaten that Flesh and drunk that Blood, is whether or not he dwelleth in Christ and Christ in him, whether or not he is a guest of Christ and Christ of his, whether or not he so cleaveth unto Christ, that Christ be not parted from him.

    This hath He taught, and warned us, by words of deep meaning, that we should be in His Body, under Himself as Head, among His members, eating His Flesh, not forsaking His unity. But many who were there, not understanding, were offended: for, hearing this, they thought of nothing but flesh, such as they themselves were made of. But the Apostle saith, and saith truly: "To be carnally minded is death." The Lord giveth us His Flesh to eat; and to be carnally minded is death. Yet He saith of His own Flesh that there is life eternal in it; therefore we ought not to understand the flesh carnally. Hearing these words, many, therefore — not of His enemies, but of His disciples — said: "This is a hard saying; who can hear it?"

    If His disciples found this saying hard, what would His enemies find it? And yet it was fitting that it should be so said, that it might not be understood by all. A secret of God ought to make us attentive, not averse; but these soon fell away, when the Lord Jesus Christ spoke such things. They did not believe that He was saying something great, and covering it with some grace of words; but, as they wished, so they understood, and after the manner of men — namely, that Jesus was able, or that Jesus intended, to distribute, as it were cut in pieces, the Flesh in which the Word was clothed, to them that believe in Him. "This is a hard saying," they say: "who can hear it?"
  responsory: |
    R. As they were eating, Jesus took bread, and blest it, and brake it, and gave it to the disciples, and said: * Take, eat; this is My Body. V. The men of my tabernacle said: O that we had of his flesh, we cannot be satisfied. R. Take, eat; this is My Body.
  status: draft

octave-readings/~-octave-day-3:
  source: Sermon of St. John Chrysostom; Homily of St. Augustine, Bishop
  text: |
    Dearly beloved brethren, it behoveth us to learn the miracle of the Mysteries: what the Gift is, and why It was given, and what is the use thereof. "We, being many, are one body," and again, "We are members of His Body, of His Flesh, and of His Bones." Only the initiated will now understand what I say. That this union may take place, not by love only, but verily and indeed, we ought to mingle our own flesh with His. And this is done by eating that Food Which He hath given unto us, being fain to manifest that exceeding great love which He beareth to us-ward. To this end He hath mingled Himself with us, and infused His Body into our bodies, that we may be one together, like as the limbs of a man and his head are all of one body. Such union do they long for that love much.

    When we come back from that Table we ought to be like so many lions breathing fire, dreadful to the devil, our thoughts concentrated on our Great Head and the love which He showeth us. Many fathers and mothers there are who give their children to others to nurse, but I, saith the Lord to His children, I am not so, but I feed you with Mine Own Flesh, and join Myself to you, fain that ye all should be sons of noble blood, and giving you a noble hope of that which ye shall be hereafter. I was content to become your Brother; I for your sakes have taken unto Me Flesh and Blood; and that Flesh and Blood wherein I am become your Brother, the same give I in turn unto you.

    Let us then, dearly beloved brethren, take good heed to ourselves, as unto the holders of so great mercies; and when any foul word springeth to our lips, or we feel anger taking possession of us, or the sting of any other sinful passion, let us call to mind of what we have been counted worthy, and let that remembrance still the unruly motion. As often as we take that Body, as often as we taste that Blood, let us think how that we feed on Him Who is sitting on high, adored of Angels, at the right hand of the Eternal Power. Ah me, how many a way is open to us whereby we may be saved! He hath made us His Own; He hath given His Body to us; and yet none of this turns us away from evil.

    I have said, my brethren, that what the Lord hath set before us, in eating of His Flesh and drinking of His Blood, is that we should dwell in Him, and He in us. We dwell in Him when we are His members, and He dwelleth in us when we are His temple. But the bond whereby we are made His members is oneness; and what is the cause of oneness but love? And love of God, whence is it? Ask the Apostle. "The love of God," saith he, "is shed abroad in our hearts by the Holy Ghost, Which is given unto us."

    So it is the spirit that quickeneth. It is the spirit that maketh lively the limbs, nor is the quickening power of the spirit shed through any limbs but such as remain in union with the body whose the spirit is. The spirit that thou hast in thee, O man, and whereby thou art a man — doth that spirit shed life through any limb cut off from thy flesh? By "spirit," I mean thy soul. The soul quickeneth no limb but such as remain attached to the body. Cut one off, and the soul quickeneth it no more, for it is separate from the oneness of thy body.

    These things I say, that we may love oneness and dread division. In sooth, there is nothing which a Christian ought so much to dread, as to be cut off from the Body of Christ. If he be cut off from the Body of Christ, he is no longer a member of Christ, and the Spirit of Christ no longer quickeneth him. "Now, if any man," saith the Apostle, "have not the Spirit of Christ, he is none of His." It is the Spirit that quickeneth, the flesh profiteth nothing: "the words that I speak unto you, they are spirit and they are life." What meaneth this, "spirit and life"? It is to be taken spiritually. Hast thou taken it spiritually? Then the words the Lord spake, unto thee they are spirit and life. Hast thou taken it carnally? Then the words of the Lord are still indeed spirit and life — but not for thee.
  responsory: |
    R. As they were eating, Jesus took bread, and blest it, and brake it, and gave it to the disciples, and said: * Take, eat; this is My Body. V. The men of my tabernacle said: O that we had of his flesh, we cannot be satisfied. R. Take, eat; this is My Body.
  status: draft

octave-readings/~-octave-day-5:
  source: Sermon of St. John Chrysostom; Homily of St. Augustine, Bishop
  text: |
    In this mysterious Sacrament Christ doth mingle Himself with all and each of His faithful ones. They are His children, and He nurseth them Himself, and giveth them not over unto another, herein again assuring us that the Flesh He hath taken unto Himself is ours. We then, who have been deemed meet to be treated with such love and such honour, let us be wakeful. See ye not how eagerly the sucklings seize on the breasts, how readily they fix their mouths on the paps? Let us, with like eagerness, draw nigh to that Table, and suck at that spiritual Cup. Yea, let us prize that gracious Food as the suckling doth its mother's breast, and hold it the great woe of life to be cut off from that Banquet. Here there are set before us no works of man's power: He That worked at that Last Supper, the Same worketh the same here still. As for us Priests, we hold the place of His ministers, but He Which halloweth and changeth is He. Hither let there draw nigh no Judas, nor covetous one: this is no Table for him. But he which is Christ's disciple, let him come, for the Lord saith: "I will keep the Passover with My disciples." This is that Passover Table, and it is all Christ's: what is wrought there is not some of it Christ's work, and some of it man's work, but it is all His work and not another's.

    Whither let there draw nigh none brutal, none cruel, none merciless, none, in good sooth, unclean. I speak to all that take that Holy Communion, and to you also, O ye that do administer the same. To you now I turn my speech, to warn you with how great care that Gift is to be given. No slight vengeance is that which awaiteth you, if ye admit for a partaker at the Lord's Table the sinner whose guiltiness ye know: at your hands will his blood be required. If a man be a General, a Governor, a crowned Monarch, yet if he come there unworthily, forbid him: thou hast greater power than he. To this end hath God exalted you to the honour ye hold, that ye may judge in such matters. This office is your dignity, this is your strength, this is all your crown — this, and not the going about in white robes and glittering vestments. And thou, O layman, when thou seest the Priest making the oblation, think not that He Which is then the real Worker is such a Priest as thou seest, but know of a surety that it is Christ's Hand Which is stretched out, albeit unseen by thee.

    Let us hear, all of us, both Priests and laymen, let us hear what Food it is whereof we are made worthy: let us hear, I say, and let us quake. The Lord satisfieth us with His Own holy Flesh, setting Himself slain before us. What excuse therefore shall we have, if, being so fed as we are, we sin as we do? If, eating of the Lamb, we are still wolves? If, pastured as the sheep of the flock, we raven like lions? This mysterious Sacrament forbiddeth unto us not outrage only, but any the least enmity: it is the Mystery of peace. Upon the Jews God laid it, to make year by year, by solemn festivals, a yearly commemoration of His mercies unto them; but upon thee, to do this in remembrance of His love to thee, day by day. To this Table then let there draw nigh no Judas Iscariot, no Simon Magus. These men fell through covetousness: let us fly that bottomless pit.

    "This is the bread which cometh down from heaven." By "this bread" the Lord here signifieth both the manna, and That Which we receive at the Altar of God. Both these are, as it were, Sacramental signs, differing indeed somewhat in their outward and visible part, but pointing to the Same Thing signified. Hear what the Apostle saith: "Moreover, brethren, I would not that ye should be ignorant how that all our fathers were under the cloud, and all passed through the sea, and were all baptized unto Moses in the cloud and in the sea, and did all eat the same spiritual meat." This meat was the same spiritually, but not really: they ate manna, we eat Something else. Spiritually they ate what we eat, but our fathers, not their fathers, unto whom we are like, not unto whom they are like. And it is added: "And did all drink the same spiritual drink." They drank one thing, and we drink Another, the difference being in the outer show, the sameness in that the Same Thing is pointed to by both. And what was that same Drink? "They drank of the spiritual Rock that followed them, and that Rock was Christ." Him did bread and rock alike signify. The Rock was a figure, but by the Word and in the Flesh there is the very Christ Himself. And how came they to drink of that rock? "Moses lift up his hand, and with his rod he smote the rock twice, and the water came out abundantly." These two strokes of the rod upon the rock are a figure of the two beams whereof the Cross was made.

    Christ's faithful ones discern the Lord's Body while they remain watchful members of His Body. They remain members of His Body as long as they will to live according to His Spirit. The Spirit of Christ giveth life to nothing but the body of Christ. Now, my brethren, understand what I am going to say. Thou art a man, and hast a body and a spirit. By spirit I mean the soul, which causeth thee to be a man at all — thou art a man, made up of soul and body. Thy spirit is unseen, thy body seen. Tell me, which of them is it which giveth animation to the other? Doth thy spirit derive animation from thy body, or thy body from thy spirit? Every one who liveth will answer — for if any one cannot answer this, I know not if he be alive. What will whosoever hath life answer? "Verily, it is my spirit which doth animate my body." Wilt thou then live by the Spirit of Christ? Be of the Body of Christ.

    Is it not my spirit which doth animate my body? My spirit doth animate my body, and thy spirit doth animate thy body. The Body of Christ liveth not save by the Spirit of Christ. Hence it is that the Apostle Paul saith, touching this Bread: "We, being many, are one bread, and one body, for we are all partakers of that one Bread." O what a Sacrament of love! O what a seal of union! O what a bond of charity! He that willeth to live hath here where to live, and whence to live. Let him come near, let him believe, let him enter into that Body, that he may be quickened. Let him not sever himself from the fit joining-together of all the members; let him not be as a mortifying limb, that must needs be cut off, nor a mis-shapen limb, a cause to blush. Let him be goodly, and useful, and healthy: let him cleave unto the body, let him live by God to God; let him labour now on earth, that he may reign hereafter in heaven.
  responsory: |
