collect:
  text: |
    Let us pray.
    O Lord, who hast said: Unless you become as little children you shall
    not enter the kingdom of heaven, grant us, we pray, so to follow, in
    humility and simplicity of heart, the footsteps of the virgin blessed
    Theresa, that we may attain to an everlasting reward.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. The Lord will give thee rest * always, and will fill thy soul with brightness; and thou shalt be like a watered garden, and like a fountain of water whose waters shall not fail.
    V. The Lord shall be unto thee for an everlasting light.
    R. And thy God for thy glory.
    Let us pray.
    O Lord, who hast said: Unless you become as little children you shall
    not enter the kingdom of heaven, grant us, we pray, so to follow, in
    humility and simplicity of heart, the footsteps of the virgin blessed
    Theresa, that we may attain to an everlasting reward.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
  status: draft

lauds-capitulum:
  text: 'Thus saith the Lord: Behold I will bring upon her as it were a river of peace, and as an overflowing torrent the glory of the Gentiles, which you shall suck: you shall be carried at the breasts, and upon the knees they shall caress you.'
  citation: Is 66:12
  status: draft

lauds-hymn:
  text: |
    The immense charity of Christ
    drives her to undertake greater things,
    the Virgin, enlarged with the crown
    of Apostles and Martyrs.

    Desiring to be a victim of love,
    to be consumed by mystical fire,
    she begs her Spouse to kindle
    the last devouring flames.

    The longed-for death, herald of eternity,
    has now come:
    sighing "I love thee!",
    Teresa departs to Christ.

    Now enjoying the joys of heaven,
    from the citadel of the stars,
    remember to scatter the roses
    thou didst so generously promise.

    O King most gentle of heart,
    who preparest the kingdom for little ones,
    grant that we who follow her
    may enter those blessed thresholds.

    Praise, honour, might and glory
    to God the Father and the Son,
    and together to the Holy Paraclete,
    for everlasting ages.
    Amen.
  status: draft

lauds-responsory:
  text: |
    R.br. I will be glad and rejoice, O Lord, * in thy mercy.
    R. I will be glad and rejoice, O Lord, * in thy mercy.
    V. For thou hast regarded my humility.
    R. In thy mercy.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. I will be glad and rejoice, O Lord, * in thy mercy.
  status: draft

lauds-versicle:
  text: |
    V. The Lord shall be unto thee for an everlasting light.
    R. And thy God for thy glory.
  status: draft

terce-capitulum:
  text: |
    Thus saith the Lord: Behold I will bring upon her as it were a river of peace, and as an overflowing torrent the glory of the Gentiles, which you shall suck: you shall be carried at the breasts, and upon the knees they shall caress you.
    R. Thanks be to God.
    V. I will be glad and rejoice, O Lord, in thy mercy.
    R. For thou hast regarded my humility.
  citation: Is 66:12
  status: draft

sext-capitulum:
  text: |
    As one whom the mother caresseth, so will I comfort you, and you shall be comforted in Jerusalem.
    R. Thanks be to God.
    V. My soul shall rejoice in the Lord.
    R. And shall be delighted in his salvation.
  citation: Is 66:13
  status: draft

none-capitulum:
  text: |
    You shall see, and your heart shall rejoice, and your bones shall flourish like an herb, and the hand of the Lord shall be known to his servants, and he shall be angry with his enemies.
    R. Thanks be to God.
    V. Praise ye the Lord, for the Lord is good.
    R. Sing ye to his name, for it is sweet.
  citation: Is 66:14
  status: draft

vespers-hymn:
  text: |
    In the divine light of the shining court
    thou enjoyest thy seat, O virgin; favouring our prayers,
    thou refreshest those who pray
    with the promised shower of roses.

    May the roses be to us the shining light
    of heavenly faith, and a support in all things,
    hope in adversity, and the living
    strength of kindly love.

    May the roses be to us thy trusting
    childlike candour before the Lord, which,
    by the Father's will, makes even the bitter things
    of our life pleasing.

    May the blessed Godhead grant us this,
    of the Father, and of the Son, and likewise of the Holy
    Spirit, whose glory echoes
    through all the world.
    Amen.
  status: draft

vespers-hymn/~-first:
  text: |
    Let them sing the name and glory
    of the gracious virgin Teresa,
    who believe in and love
    the holy gifts of the divine Child.

    The Mother, our patroness, chooses
    the highest summits of Carmel:
    Teresa flies thither,
    treading in her Spouse's footsteps.

    Inspired by the divinity of Jesus,
    she lays open the secrets of grace;
    a teacher to the world, she teaches
    the simple ways of little children.

    The consecrated thresholds are fragrant
    with the little flowers of virtue, which she,
    chaste as an angel sent down from heaven, tends.

    But her jubilation does not express
    all the surges of her love;
    nor can the cloister walls confine
    her mighty yearnings.

    Glory be to thee, O Jesus,
    who revealest thyself to little ones,
    with the Father and the loving Spirit,
    for everlasting ages.
    Amen.
  status: draft

vespers-responsory:
  text: |
    R.br. My soul * shall rejoice in the Lord.
    R. My soul * shall rejoice in the Lord.
