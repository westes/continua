    R. Shall rejoice in the Lord.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. My soul * shall rejoice in the Lord.
  status: draft

vespers-versicle:
  text: |
    V. The hand of the Lord hath strengthened thee.
    R. And therefore thou shalt be blessed for ever.
  status: draft

vespers-versicle/~-first:
