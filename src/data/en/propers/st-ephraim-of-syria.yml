collect:
  text: |
    Let us pray.
    O God, Who didst will to make thy Church glorious by the wondrous learning and the
    shining merits of blessed Ephraim, thy Confessor and Doctor: we humbly beseech thee;
    that, by his intercession, thou wouldst ever defend her by thy power against the snares
    of error and wickedness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, Who didst will to make thy Church glorious by the wondrous learning and the
    shining merits of blessed Ephraim, thy Confessor and Doctor: we humbly beseech thee;
    that, by his intercession, thou wouldst ever defend her by thy power against the snares
    of error and wickedness.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Ephraim was a Syrian by birth, the son of a father from Nisibis. While still a young man he attached himself to the holy bishop James, by whom he was baptized, and in a short time made such progress in holiness and learning that he was made master of the flourishing school at Nisibis, a city of Mesopotamia. After the death of Bishop James, when Nisibis was taken by the Persians, he went to Edessa, where he first dwelt on a mountain among monks, and afterward, to avoid the great numbers of people who flocked to him, took up the life of a hermit. Ordained deacon of the church of Edessa, and refusing the priesthood out of humility, he shone with the splendor of every virtue, and strove to join true wisdom to piety and religion. Fixing all his hope in God alone, and despising all things human and transitory, he continually longed for the things that are divine and everlasting.

        Led by the divine Spirit, he went to Caesarea in Cappadocia, where he saw Basil, that very mouthpiece of the Church, and each made profitable use of the other's company. To refute the countless errors that were then rife and vexing the Church of God, and to set forth diligently the mysteries of our Lord Jesus Christ, he published many works, composed in the Syriac tongue, nearly all of which were translated into Greek; and, as St. Jerome bears witness, he attained to such renown that, after the reading of the Scriptures, his writings were publicly read aloud in certain churches.

        All his works were so filled with the splendid light of learning that this same Saint, even while still living, was held in great honor as a Doctor of the Church. He also composed metrical hymns in praise of the most blessed Virgin Mary and of the Saints, for which reason he was rightly called by the Syrians the Harp of the Holy Spirit. He excelled above all in a wonderful and devout love for that same Immaculate Virgin. Full of merits, he died at Edessa in Mesopotamia, on the fourteenth day before the Kalends of July, under the emperor Valens; and, at the urgent petition of many Cardinals, Patriarchs, Archbishops, Bishops, Abbots, and religious communities of the Holy Roman Church, Pope Benedict XV, on the advice of the Congregation of Sacred Rites, declared him a Doctor of the Universal Church.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 5:13-19
      text: At that time, Jesus said to His disciples, "You are the salt of the earth. But if the salt lose its savour, wherewith shall it be salted? It is good for nothing any more but to be cast out, and to be trodden on by men. You are the light of the world. A city seated on a mountain cannot be hid. Neither do men light a candle and put it under a bushel, but upon a candlestick, that it may shine to all that are in the house. So let your light shine before men, that they may see your good works, and glorify your Father Who is in heaven. Do not think that I am come to destroy the law, or the prophets. I am not come to destroy, but to fulfill. For amen I say unto you, till heaven and earth pass, one jot or one tittle shall not pass of the law, till all be fulfilled. He therefore that shall break one of these least commandments, and shall so teach men, shall be called the least in the kingdom of heaven; but he that shall do and teach, he shall be called great in the kingdom of heaven."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ephraim the Syrian, Sermon on the Monastic Life and its Practice
      text: |-
        It is a noble thing to begin a good work and to bring it to completion, to be pleasing to God and useful to one's neighbor, and to please Christ Jesus himself, our highest and sweetest Ruler, who says: You are the salt of the earth, and the pillar of the heavens. The labor of your affliction, most beloved, is like a sleep; but the rest that follows labor is beyond telling and beyond price. Watch over yourself carefully, then, lest you lose both alike, by pursuing neither fully — namely, present joy and everlasting joy together. Strive rather to attain perfect virtue, adorned and marked with all that God loves. If you attain this, you will never provoke God, nor wrong your neighbor.

        Now this virtue is called one, of a single kind, yet it holds within itself the beauty of all the various virtues. A royal crown cannot be fashioned and woven together without precious stones and shining pearls; so too this one virtue cannot stand firm without the brightness of the other virtues. For indeed it is very like a royal crown. For just as, if one stone or pearl is missing, a crown cannot shine in its fullness upon a royal head, so too this one virtue, unless it is bound together with the honor of the other virtues, cannot be called perfect virtue. It is likewise like the most costly banquet, prepared with the choicest seasonings, but lacking salt. For just as those costly dishes cannot be eaten without salt, so too this uniform virtue — unless it is adorned with the glory and honor of the other virtues, that is, love of God and of neighbor — is altogether worthless and contemptible.
      status: verified
