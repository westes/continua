nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Leo II was a Sicilian. He was learned in sacred and worldly letters in the Greek and Latin tongues, and was moreover an excellent musician. He re-arranged and improved the music of the sacred hymns and Psalms used in the Church. He approved the acts of the sixth general Council, which was held at Constantinople, under the Presidency of the Legates of the Apostolic See, in the presence of the Emperor Constantine, the Patriarchs of Constantinople and Antioch, and one hundred and seventy Bishops. Leo also translated the decrees of the Council from Greek into Latin.

        It was in this Council that Cyrus, Sergius, and Pyrrhus were condemned for teaching that there is in Christ only one Will and one Working. Leo broke the pride of the Archbishops of Ravenna, who had puffed themselves up under the power of the Exarchs to set at naught the power of the Apostolic See. Wherefore he decreed that the elections of the clergy of Ravenna should be nothing worth, until they had been confirmed by the authority of the Bishop of Rome.

        He was a very father to the poor. Not by money only, but by his work, his labours, and his advice he relieved the poverty and loneliness of widows and orphans. He was leading all to live holy and godly lives, not by mere preaching, but by his own life, when he fell asleep in the Lord, having sat as Pope nine months and twenty-seven days. He was buried in the Church of St. Peter. In the month of June he held one ordination whereat he ordained nine Priests, three Deacons, and twenty-three Bishops for diverse places.
      status: verified
