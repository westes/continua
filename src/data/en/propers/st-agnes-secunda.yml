nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: 'The night when the parents of the blessed Agnes were watching at her grave, she appeared to them in company with a band of virgins, and said to them: Father and Mother, weep not for me as though I were dead; for now these virgins and I live together in Him Whose love was my whole life upon earth. Some years afterwards, Constance, the daughter of the Emperor Constantine, being sick of an incurable ulcer, betook herself to the said grave, although she was not yet a Christian, and as she lay by it and slept, she seemed to hear the voice of Agnes, saying to her: Constance, be of good courage, believe in Jesus Christ the Son of God, and He will make thee whole. The Princess, being healed, was baptized, along with many others of the Emperor''s family and household, and afterwards built over the grave of the blessed Agnes a Church named in her honour.'
      status: verified
