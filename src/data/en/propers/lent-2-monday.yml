collect:
  text: |
    Let us pray.
    Almighty God, grant, we beseech thee, unto this thy family, that as they do abstain from meals to afflict the flesh, so by following after righteousness they may fast from sin.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    Graciously hear our prayers, O Almighty God, and as Thou dost give us to look with confidence for thy favour for which we hope, so grant us, in thy goodness, the manifestation of thine accustomed mercy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

