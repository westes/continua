nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, On the Patriarch Abraham, Book 1
      text: |-
        Abraham was truly a great man, illustrious as an example of many virtues; one the like of whom the day-dreams of Philosophy have not been able to produce. That which she imagineth is less than that which he did; his simple truth and faith were something grander than her lying rounded periods. Let us then consider what this man's loyalty was. For that virtue is first to be taken which was the source of all the others, and thus this was the first which God called for from him, when He said: Get thee out of thy country, and from thy kindred, and from thy father's house. It would have been enough to have said, Get thee out of thy country, for there were his kindred, and there his father's house.

        But He gave the details of his sacrifice one by one, that He might see whether he loved Him, lest also he should begin rashly, or should seek to evade the heavenly commandment. But as the whole of the precept was plainly set forth, lest anything should be unconsidered, so also were the rewards set forth, lest the burden should seem hopeless. He was tried as one that is strong, he was roused as one that is true, he was called as one that is righteous; and he departed loyally as the Lord had spoken unto him. And Lot went forth with him. That saying of the Seven Wise Men of Greece is much spoken of: Follow God. But this did Abraham before the Seven Wise Men were thought of; he followed God, and went out of his own land.

        But, forasmuch as Abraham had before had another country, namely, the land of the Chaldees, whence went forth Terah the father of Abraham, and came unto Haran, and forasmuch as he to whom it had been said, Get thee out from thy kindred, took Lot, his brother's son, with him, let us consider whether this Get thee out of thy country signifieth not: get thee out of this earthly dwelling, namely, our body, from which Paul came forth, who said: Our conversation is in heaven.
      responsory: |-
        R. The Angel of the Lord called unto Abraham and said: * Lay not thine hand upon the lad; for now I know that thou fearest God.
        V. And Abraham stretched forth his hand to slay his son; and, behold, the Angel of the Lord called unto him out of heaven, and said:
        R. Lay not thy hand upon the lad; for now I know that thou fearest God.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 18:31-43
      text: At that time, Jesus taking to Himself the Twelve said to them, Behold, we are going up to Jerusalem, and all things that have been written by the prophets concerning the Son of Man will be accomplished. For He will be delivered to the Gentiles, and will be mocked and scourged and spit upon; and after they have scourged Him, they will put Him to death; and on the third day He will rise again. And they understood none of these things and this saying was hidden from them, neither did they get to know the things that were being said. Now it came to pass as He drew near to Jericho, that a certain blind man was sitting by the wayside, begging; but hearing a crowd passing by, he inquired what this might be. And they told him that Jesus of Nazareth was passing by. And he cried out, saying, Jesus, Son of David, have mercy on me! And they who went in front angrily tried to silence him. But he cried out all the louder, Son of David, have mercy on me! Then Jesus stopped and commanded that he should be brought to Him. And when he drew near, He asked him, saying, What would you have Me do for you? And he said, Lord, that I may see. And Jesus said to him, Receive your sight, your faith has saved you. And at once he received his sight, and followed Him, glorifying God. And all the people upon seeing it gave praise to God.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 2 on the Gospels
      text: |-
        Our Redeemer, foreseeing that the minds of His disciples would be troubled by His suffering, told them long before both of the pains of that suffering, and of the glory of His rising again, to the end that, when they should see Him die as He had prophesied, they might not doubt that He was likewise to rise again. But, since His disciples were yet carnal, and could not receive the words telling of this mystery, He wrought a miracle before them. A blind man received his sight before their eyes, that if they could not receive heavenly things by words, they might be persuaded of heavenly things by deeds.

        But, dearly beloved brethren, we must so take the miracles of our Lord and Saviour, as believing both that they were actually wrought, and that they have some mystic interpretation for our instruction. For in His works, power speaketh one thing and mystery again another. Behold here, for instance. We know not historically who this blind man was, but we do know of what he was mystically the figure. Mankind is blind, driven out from Eden in the persons of his first parents, knowing not the light of heaven, and suffering the darkness of condemnation. But, nevertheless, through the coming of his Redeemer, he is enlightened, so that now he seeth by hope already the gladness of inward light, and walketh by good works in the path of life.

        One must note that as Jesus drew to Jericho a blind man received his sight. Now, this name Jericho, being interpreted, signifieth the city of the moon: and in Holy Scripture the moon is used as a figure of our imperfect flesh, of whose gradual corruption her monthly waning is a type. As, therefore, our Maker draweth nigh to Jericho, a blind man receiveth his sight. While the Godhead taketh into itself our weak manhood, man receiveth again the light which he had lost. By God's suffering in the Manhood, man is raised up toward God. This blind man is also well described as sitting by the wayside begging, for the Truth saith: I am the Way.
      responsory: |-
        R. I came this day unto the well, and I besought the Lord, and said: * O Lord God of Abraham, Thou hast prospered my way.
        V. Therefore the virgin to whom I shall say: Give me water of thy pitcher to drink; and she shall say to me: Drink, my lord, and I will give thy camels drink also; let the same be the woman whom the Lord hath appointed out for my master's son.
        R. O Lord God of Abraham, Thou hast prospered my way.
      status: verified
