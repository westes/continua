nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 18 on the Saints
      text: |-
        Dearly beloved brethren, the day for which we have longed, the Feast-day of the Blessed and Worshipful and Ever-Virgin Mary, that day is come. Let our land laugh and sing with merriment, bathed in the glory of this great Virgin's rising. She is the flower of the fields on which the priceless lily of the valleys hath blossomed. This is she whose delivery changed the nature that we draw from our first parents, and cleansed away their offence. At her that dolorous sentence which was pronounced over Eve ended its course; to her it was never said: In sorrow thou shalt bring forth children. She brought forth a Child, even the Lord, but she brought Him forth, not in sorrow, but in joy.

        Eve wept, but Mary laughed. Eve's womb was big with tears, but Mary's womb was big with gladness. Eve gave birth to a sinner, but Mary gave birth to the sinless One. The mother of our race brought punishment into the world, but the Mother of our Lord brought salvation into the world. Eve was the foundress of sin, but Mary was the foundress of righteousness. Eve welcomed death, but Mary helped in life. Eve smote, but Mary healed. For Eve's disobedience, Mary offered obedience, and for Eve's unbelief, Mary offered faith.

        Let Mary now make a loud noise upon the organ, and between its quick notes let the rattling of the Mother's timbrel be heard. Let the gladsome choirs sing with her, and their sweet hymns mingle with the changing music. Hearken to what a song her timbrel will make accompaniment. She saith: My soul doth magnify the Lord, and my spirit hath rejoiced in God my Saviour. For He hath regarded the lowliness of His hand-maiden, for, behold, from henceforth all generations shall call me blessed; for He That is Mighty hath done to me great things. The new miracle of Mary's delivery hath effaced the curse of the frail backslider, and the singing of Mary hath silenced the wailing of Eve.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 1:1-16
      text: The book of the origin of Jesus Christ, the Son of David, the son of Abraham. Abraham begot Isaac, Isaac begot Jacob, Jacob begot Judas and his brethren. Judas begot Phares and Zara of Thamar, Phares begot Esron, Esron begot Aram. And Aram begot Aminadab, Aminadab begot Naasson, Naasson begot Salmon. Salmon begot Booz of Rahab. Booz begot Obed of Ruth, Obed begot Jesse, Jesse begot David the King. And David the king begot Solomon of the former wife of Urias. Solomon begot Roboam, Roboam begot Abia, Abia begot Asa. And Asa begot Josaphat, Josaphat begot Joram, Joram begot Ozias. And Ozias begot Joatham, Joatham begot Achaz, Achaz begot Ezechias. And Ezechias begot Manasses, Manasses begot Amon, Amon begot Josias. And Josias begot Jechonias and his brethren at the time of the carrying away to Babylon. And after the carrying away to Babylon, Jechonias begot Salathiel, Salathiel begot Zorobabel. And Zorobabel begot Abiud, Abiud begot Eliachim, Eliachim begot Azor. And Azor begot Sadoc, Sadoc begot Achim, Achim begot Eliud. And Eliud begot Eleazar, Eleazar begot Matthan, Matthan begot Jacob. And Jacob begot Joseph, the husband of Mary, and of her was born Jesus Who is called Christ.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Commentary on Matthew, Bk. 1, at the beginning
      text: |-
        In Isaiah we read: Who shall declare his generation? Let us not, then, think that the Evangelist is contrary to the Prophet, so that what the Prophet said was impossible to utter, the Evangelist should begin to narrate: for there it is spoken of the generation of His Godhead, here of His Incarnation. He began from the things of the flesh, that through man we might begin to know God. The son of David, the son of Abraham. The order is reversed, but of necessity changed. For if he had put Abraham first and David after, Abraham would have had to be repeated again, that the series of the generation might be woven together.

        Matthew first calleth Christ the son of these twain only, Abraham and David, all others being passed over, because unto these twain only was the promise concerning Christ made. To Abraham: In thy seed, saith He, shall all nations be blessed, which is Christ. To David: Of the fruit of thy body will I set upon thy throne. And Judas begat Phares and Zara of Thamar. It is to be noted that in the genealogy of the Saviour none of the holy women is taken, but those whom Scripture reproves; that He Who came for the sake of sinners, being born of sinners, might blot out the sins of all. Whence also in what follows is set Ruth the Moabitess, and Bathsheba the wife of Urias.

        And Jacob begat Joseph. This passage Julian Augustus objected to us on account of the seeming disagreement of the Evangelists, why the Evangelist Matthew called Joseph the son of Jacob, and Luke calls him the son of Heli; not understanding the custom of the Scriptures, that one is his father according to nature, another according to the law. For we know this was commanded through Moses, at God's bidding, that if a brother or kinsman should die without children, another should take his wife to raise up seed to his brother or kinsman. Joseph the husband of Mary. When you hear the word husband, let no suspicion of marriage come upon you; but remember the custom of the Scriptures, that betrothed men and women are called husbands and wives.
      status: verified

octave-readings/~-octave-day-2:
  source: From a Sermon of St. Augustine, Bishop
  text: |
    Mary is happy, with joyful wonder at her own Motherhood, and her joy is that she is fruitful by the Holy Ghost. She is not alarmed to find herself an unwedded mother, but still is in joyful wonder at her Motherhood. Oh woman blessed above women, who doth nowise know a man, and yet compasseth a man in the womb. Mary compasseth a man by believing the Angel, since Eve lost a man by saying Yea to the serpent. Happy obedience, glorious grace! which yielded lowly belief, and embodied in her Him Who created the heavens. Hence she earned that glory which He afterward increased. Behold, saith she, from henceforth, all generations shall call me blessed.

    Blessed Mary, who is able enough to thank and to praise thee, thou, who by once saying Be it unto me, hast arisen to help a lost world? What blessings shall weak man utter upon thee, thou, who, by thine own one treaty, hast given unto him to find the entrance into new life? Receive these far and random, these unworthy thanksgivings, and, since thou receivest our prayers, by thy prayers obtain pardon for our sins. Let our supplications come into thine hallowed presence, and give us in return the medicine for our healing.
  responsory: |
    R. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. V. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. R. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
  status: verified

octave-readings/~-octave-day-3:
  source: From a Homily of St. Jerome, Priest (on Matt. 1:1-17)
  text: |
    And after the removal to Babylon, Jechonias begot Salathiel. If we wish to place Jechonias at the end of the first set of fourteen generations, the following set will not have fourteen, but thirteen. Let us understand, then, that this earlier Jechonias is the one also called Joachim, and is the father, not the son, of the second Jechonias; it is the first of the two who is described here — a confusion arising, among both Greeks and Latins, from the fault of copyists and the long lapse of time.

    And Jacob begot Joseph. The emperor Julian raised this passage against us as a supposed disagreement among the evangelists: why does Matthew call Joseph the son of Jacob, while Luke calls him the son of Heli? He did not understand the usage of Scripture, whereby one is his father by nature, the other by the law. For we know that this was commanded through Moses at God's bidding: that if a brother or kinsman should die without children, another of his brothers should take the wife, to raise up seed for his brother or kinsman. So when you hear that Joseph is the husband of Mary, let no suspicion of ordinary marriage arise in you, but remember the usage of Scripture, whereby betrothed men and women are called husbands and wives.

    And from the removal to Babylon unto Christ are fourteen generations. Count from Jechonias to Joseph, and you will find thirteen generations; the fourteenth generation, then, is reckoned in Christ himself. Now the birth of Christ was on this wise. Let the careful reader inquire and say: since Joseph was not the father of the Lord and Saviour, what does the line of descent traced down to Joseph have to do with the Lord? To this we answer, first, that it is not the usage of Scripture to weave the line of descent through women; and second, that Joseph and Mary were of one tribe, on account of which he was bound by the Law to take her as his kinswoman.
  responsory: |
    R. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. V. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. R. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
  status: draft

octave-readings/~-octave-day-4:
  source: Sermon of St. Bernard, Abbot
  text: |
    The Lord hath created a new thing in the earth, a woman shall compass a man. ~Jer. xxxi. 22. And this man is no other than Christ, of Whom it is said Behold the Man Whose name is The Dayspring Zech. vi. 12.  In heaven also hath the Lord created a new thing, a woman clothed with the sun. She also hath crowned Him and hath earned from Him a crown in return. Go forth, O ye daughters of Zion, and behold King Solomon with the crown wherewith his mother crowned him. Cant. iii. ii. And again go forth now, and behold the Queen with the crown wherewith her Son crowned her. And upon her head, saith St. John, a crown of twelve stars.

    What is an head worthy to be crowned with stars whose own glory is greater than theirs, and rather giveth than receiveth lustre from them. Why should not she have stars for her crown, who hath the sun for her clothing? And about her it was as the flower of roses in the spring of the year, and lilies of the valleys. Ecclus. 1, 8. The left hand of her Bridegroom is under her head, and his right hand doth embrace her. Cant. ii, 6 Who shall appraise these starry jewels whereof is made the Queenly crown of Mary?
  responsory: |
    R. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. V. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. R. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
  status: verified

octave-readings/~-octave-day-5:
  source: Sermon of St. John Chrysostom
  text: |
    The Son of God chose for his mother not some rich or wealthy woman, but that blessed virgin whose soul was adorned with virtues. For because blessed Mary kept a chastity beyond all human nature, therefore she conceived Christ the Lord in her womb. Let us, then, hasten to this most holy Virgin and Mother of God, and obtain profit from her patronage. And so, whoever you are, O virgins, take refuge in the Mother of the Lord; for she will preserve for you, by her patronage, a most beautiful, most precious, and incorruptible possession.

    Truly a great miracle, most beloved brethren, was the ever-blessed Virgin Mary. For what greater or more illustrious thing has ever been found at any time, or could ever be found? She alone has surpassed heaven and earth in greatness. What could be found holier than she? Not the Prophets, not the Apostles, not the Martyrs, not the Patriarchs, not the Angels, not the Thrones, not the Dominations, not the Seraphim, not the Cherubim -- indeed, nothing else among created things, visible or invisible, can be found greater or more excellent. She is at once the handmaid of God and his Mother; at once a virgin and a mother.

    She is the Mother of him who was begotten of the Father before all beginning, whom Angels and men acknowledge as the Lord of all things. Would you know how far this Virgin surpasses the heavenly powers in excellence? They stand by with fear and trembling, veiling their faces; but she offers to him whom she bore the whole human race. Through her also we obtain the forgiveness of sins. Hail, then, O Mother, O heaven, O maiden, O virgin, O throne, the glory, honour, and strength of our Church: pray unceasingly for us to Jesus, thy Son and our Lord, that through thee we may find mercy on the day of judgment, and may attain to those good things which are laid up for them that love God, by the grace and loving-kindness of our Lord Jesus Christ; with whom, together with the Father and the Holy Spirit, be glory, honour, and dominion, now and for ever, world without end. Amen.
  responsory: |
    R. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. V. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. R. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
