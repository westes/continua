octave-readings/~-octave-day-6:
  source: From the book of St. Epiphanius, Bishop, Against Heresies
  text: |
    Eve, who received the mystic title of Mother of all living Gen. iii. 20, was a type of Mary, the Blessed Mother of God. It was even after she had heard the words, Dust thou art, and unto dust shalt thou return, that Eve was called Mother of all living. And it is certainly strange that after the transgression she should receive this great title. In respect of carnal things all men upon the earth do indeed draw their genealogy from Eve, and in respect of spiritual things life was born upon the earth from Mary, who gave birth to Him That liveth, and so becometh Mother of all that live by Him. And so Mary hath a mystic right to the title of Mother of all living.

    Unto Eve was given a coat of skins to clothe the natural body withal when she knew that she was naked, Gen. iii. 21, but unto Mary it was given to bring forth for us a Lamb with Whose glorious fleece (of merits) we may through wisdom be clothed in a robe of immortality. Eve was a cause of death to all men, for by her, death entered into the world; but Mary is a cause of life whereby life is sprung up for us all, since through her the Son of God entered into the world. ' ' Where sin abounded, grace did much more abound. Rom. v, 20 Whence death was brought in, thence hath life also come forth, that life may take the place of death, and He Who by a woman hath become life unto us may put away the death which was invented by a woman. On the one hand Eve, being still a virgin, transgressed by disobedience; on the other hand, by a virgin came the obedience of grace, the announcement of Him Who came from heaven and took flesh, and life everlasting.

    We may be permitted to say so, the following words, written of the Church, may be taken of Mary Therefore shall a man leave his father and his mother, and shall cleave unto his wife; and they shall be one flesh. Gen. ii. 24. The holy Apostle saith This is a great mystery, but I speak concerning Christ and the Church. Eph. v. 32. See the scrupulous accuracy of the Scriptural language. Concerning Adam it is said that God formed him, but concerning Eve that He builded her. And the rib which the Lord God had taken from man, builded He into a woman. Gen. ii, 22 Hereby is shown that the Lord formed unto Himself a Body out of Mary, but that out of His Rib He builded up the Church, namely, when His Side was pierced and opened, and the mystic streams of Blood and Water flowed for the remission of sin.
  responsory: |
    R. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. V. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. R. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
  status: verified

octave-readings/~-octave-day-8:
  source: From the Sermons of St. Cyril, Bishop of Alexandria. Against Nestorius.
  text: |
    Behold a joyful congregation of all the Saints, who have come together with glad hearts at the bidding of Holy Mary, Mother of God, and always a Virgin. Praise and glory be unto thee, O Holy Trinity! Who hast called us unto this Feast! Praise be to thee also, Holy Mother of God! Thou art the priceless Pearl of earth, thou art the undying lamp, thou art the crown of virginity, thou art the staff of the orthodox faith, thou art the everlasting temple, thou art the limits of the Illimitable, thou art Mother and Maiden, wherethrough cometh He of whom the Gospels tell, that Blessed One Who cometh in the Name of the Lord!

    Through thee is the name of the Trinity hallowed, through thee is the precious Cross preached and worshipped throughout all the world. Through thee there is joy in heaven, through thee Angels and Archangels shout aloud, through thee the devils are put to flight, and man is recalled to Paradise. Through thee every creature once in bondage to idols turneth to the knowledge of the truth, through thee believers come to holy Baptism, through thee Churches are built in all the earth.

    By thy help, the heathen turn to repentance. What more? Through thee the Only-begotten Son of God, He in Whom is Life, and the Life is the Light of men, hath shined upon them that sat in darkness and in the shadow of death. Through thee the Prophets have prophesied, through thee the Apostles have preached salvation unto the Gentiles. Who can set forth all thy praise, O Mary, Mother and Maiden? Dearly beloved brethren, let us glorify her, while we worship her Son, the Sinless Bridegroom of the Church, unto Whom be honour and glory for ever and ever. Amen.
  responsory: |
    R. This day was the Blessed Virgin Mary born of the lineage of David. * The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world. V. Let us keep with rejoicing the Birthday of the Blessed Virgin Mary. R. The same is she through whom the salvation of the world hath been manifested before the eyes of all believers. This is she whose glorious life hath given light to the world.
