magnificat-antiphon:
  text: These are two olive trees * and two candlesticks, giving light in the presence of the Lord; these have power to shut heaven with clouds, and have power again to open the gates thereof, for their tongues are become keys of heaven.
  status: verified

magnificat-antiphon/~-first:
  text: The righteous stand * in the Presence of the Lord, and are not divided the one from the other; they drank of the Lord's Cup, and they are called Friends of God.
  status: verified

lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: 'Paul and John * said unto Julian: We worship One God, Who hath made heaven and earth.'
    - psalms:
        - 99
      antiphon: 'Paul and John * said unto Terentian: If thy Lord be Julian, keep thou at peace with him, but as for us, we have no other Lord but the Lord Jesus Christ.'
    - psalms:
        - 62
      antiphon: John and Paul, * when they had heard the tyrannous command of Julian, began to disperse abroad their goods among the poor.
  canticle:
    id: canticum-trium-puerorum
    antiphon: O ye holy Spirits and Souls of the righteous, * bless ye the Lord. Alleluia.
  laudate:
    antiphon: 'John and Paul * said unto Gallican: Make thy vow unto the God of heaven, and thou shalt be yet a greater conqueror than ever thou hast been heretofore.'

