collect:
  text: |
    Let us pray.
    O God, whom sin doth justly move to anger, and at repentance doth turn again to forgive the same; mercifully regard the prayers of your people, and turn aside the scourges of thy wrath, which we deserve for our sins.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    Spare, O Lord, spare thy people, that they, being deservedly chastened, they may find solace through thy tender mercy.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Lord, * my servant lieth at home sick of the palsy, and is grieviously tormented. Amen, I say unto thee, I will come and heal him.
  status: verified

magnificat-antiphon:
  text: 'O Lord, * I am not worthy that thou shouldst enter under my roof: but only say the word, and my servant shall be healed.'
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matthew 8:5-13
      text: At that time, when Jesus had entered Capharnaum, there came to Him a centurion, who entreated Him, saying, "Lord, my servant is lying sick in the house, paralyzed, and is grievously afflicted." Jesus said to him, "I will come and cure him." But in answer the centurion said, "Lord, I am not worthy that You should come under my roof; but only say the word, and my servant will be healed. For I too am a man subject to authority, and have soldiers subject to me; and I say to one, 'Go,' and he goes; and to another, 'Come,' and he comes; and to my servant, 'Do this,' and he does it." And when Jesus heard this, He marveled, and said to those who were following Him, "Amen I say to you, I have not found such great faith in Israel. And I tell you that many will come from the east and from the west, and will feast with Abraham and Isaac and Jacob in the kingdom of heaven, but the children of the kingdom will be put forth into the darkness outside; there will be the weeping, and the gnashing of teeth." Then Jesus said to the centurion, "Go your way; as you have believed, so be it done to you." And the servant was healed in that hour.
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Book 2 on the Agreement of the Evangelists, ch. 20
      text: |-
        Let us consider whether Matthew and Luke are at one as touching this centurion's servant. Matthew saith, "There came unto Him a centurion, beseeching Him, and saying, 'Lord, my servant lieth at home sick of the palsy.'" This seemeth to differ from what Luke saith, namely, "And when he heard of Jesus, he sent unto Him the elders of the Jews, beseeching Him that He would come and heal his servant. And when they came to Jesus, they besought him instantly, saying, 'That he was worthy for whom He should do this; for he loveth our nation, and he hath built us a synagogue.' Then Jesus went with them; and when He was now not far from the house, the centurion sent friends to Him, saying unto Him, 'Lord, trouble not thyself; for I am not worthy that Thou shouldest enter under my roof.'"

        If it were done thus, how is Matthew truthful, when he saith that the centurion came unto Him, seeing that, in fact, he sent his friends? We must then look well into this, and we shall see that Matthew only made use of a common form of speech. Now, we use to say of a man that he cometh to a place even though he be not already come; whence also we say, He arrived close, or He arrived a long way off, that is, to that place to which he would come; yea, we speak of that coming, toward which he tendeth, as though it had already taken place, when he that should be come at, seeth not yet him that cometh, but is come at for him by friends, to obtain his favour, which is needful for him that would come to him. And so much doth this manner of speaking hold, that they are commonly said to come at a great man, (who is beyond their personal reach,) who, by means of suitable persons, succeed in laying before him such things as they desire.

        Therefore it is not strange that Matthew should make use of the common short phrase, and say of the centurion, who reached the Lord's sympathies, by means of friends, that he came unto Him. Also we must needs not pass by lightly the mystic depth which underlieth the words of this holy Evangelist. It is written in the Psalms, "Draw near unto Him and be enlightened." Thus did the centurion in faith draw near unto Jesus, and the Lord so praised him that He said, "I have not found so great faith, no, not in Israel." Of him of whom these words were spoken, the Evangelist deemeth it wiser to say that he had found his way to Jesus, that he had got to Christ, than that they came, through whom he sent his message unto Him.
      responsory: |-
        R. Lord, my servant lieth at home sick of the palsy, and grievously tormented. * Amen, I say unto thee, I will come and heal him.
        V. Lord, I am not worthy that Thou shouldest enter under my roof, but speak the word only, and my servant shall be healed.
        R. Amen, I say unto thee, I will come and heal him.
      status: verified
