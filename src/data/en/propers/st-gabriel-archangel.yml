nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: true
      citation: Luke 1:11-20
      text: At that time, there appeared to him an angel of the Lord, standing at the right of the altar of incense. And Zachary, seeing him, was troubled, and fear fell upon him. But the angel said to him, Do not be afraid, Zachary, for your petition has been heard, and your wife Elizabeth shall bear you a son and you shall call his name John. And you shall have joy and gladness, and many will rejoice at his birth. For he shall be great before the Lord; he shall drink no wine or strong drink, and shall be filled with the Holy Spirit even from his mother's womb. And he shall bring back to the Lord their God many of the children of Israel, and he shall himself go before Him in the spirit and power of Elias, to turn the hearts of fathers to their children and the incredulous to the wisdom of the just; to prepare for the Lord a perfect people. And Zachary said to the angel, How shall I know this? For I am an old man, and my wife is advanced in years. And the angel answered and said to him, I am Gabriel, who stand before God, and have been sent to speak to you, and to bring you this good news. And behold, you shall be silent and unable to speak until the day when these things come to pass, because you have not believed my words, which shall be fulfilled in their proper time.
      status: verified
    - nocturn: 2
      isGospel: false
      source: The Venerable Bede, Exposition on Luke 1:11-20
      text: |-
        The Angel appeared to Zacharias in the sanctuary of the temple at the right side of the altar of incense. Which same was fitting, thus: he appeared in the sanctuary because he came to proclaim sacrifice; and at the right side thereof, to indicate how joyous was the honour about to be bestowed on mankind by the heavenly gift. The right side is the side of honour, and therefore words indicating a position at the right hand are often used to signify an eternal good, and by the same token, to be at the left side doth sometimes signify only present good. As for example where the Book of Proverbs singeth thus in praise of wisdom: Length of days in her right hand, and in her left hand riches and honour. First of all the Angel comforteth the trembling Zacharias. Fear not, saith he. For just as it is natural for human frailty to fear spiritual manifestations, so it is natural for Angels to comfort with good words the mortals that be in this wise fearful. Contrariwise, when the devil perceiveth that his audacious manifestations do frighten, he proceedeth to frighten as much as he can, and that with an increasing fearsomeness. There is no better way to overcome his workings than by a courageous faith.

        Next, the Angel saith that the prayer of Zacharias was heard, and then straightway promiseth that the wife of Zacharias should bear a child. We are not to understand that he had been praying for the birth of a son whilst he was offering the sacrifice according to the liturgy of that time, for we are told that he had given up hope of a son, and no one prayeth for that which he hath no hope of obtaining. Yea, so hopeless was he of ever having children of his own, because Elizabeth was barren, and they were both now well stricken in years, that he did not even believe the Angel's promise. Therefore the words of the Angel: Thy prayer is heard: refer to the redemption of the people, for which Zacharias had prayed in the pleading of the sacrifice. And the words: Thy wife shall bear a son: do shew the manner of that redemption, for he addeth that the son of Zacharias shall go before the Redeemer as a herald, to make ready his way amongst the people. Thus, in this saying that the prayer of supplication offered by Zacharias was heard of God, the Angel sheweth in what manner the people can be brought to salvation and perfection; namely, by repentance at the preaching of John, whereby they are to be led to faith in Christ.

        But Zacharias hesitateth because of the sublime things which have been promised. Wherefore he asketh for a sign, that he may believe, albeit the coming of the Angel and his words of promise ought to have been a sufficient sign. Hence he was stricken dumb as a just penalty for his slowness of belief: to be dumb was both a sign to stir him up to the faith which he sought, and the penance which he deserved for his unbelief. We may thus understand that if a man of earth had promised such things, it would be lawful to seek for a sign, but that when an Angel is sent from heaven to give God's promise, there should have been no occasion for doubt. And yet the Angel giveth the desired sign, so that he who spake from disbelief may learn from silence to believe. Note that the Angel saith: I am Gabriel, that stand in the presence of God, and am sent to speak unto thee these glad tidings. Doubtless when Angels come to us they fulfill this active and outward ministry in such a way that they yet do always remain in God's presence by contemplation. Wherefore, they stand in his presence even though they be sent from him on a mission. An Angel is a created spirit, and therefore hath many limitations. But God hath no limitations, and is everywhere. Thus when he sendeth his Angels from his presence, they yet do stand therein, for whithersoever they go on a mission, they go in him.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 1:26-38
      text: At that time, the angel Gabriel was sent from God to a town of Galilee called Nazareth, to a virgin betrothed to a man named Joseph, of the house of David, and the virgin's name was Mary. And when the angel had come to her, he said, Hail, full of grace, the Lord is with you. Blessed are you among women. When she had heard him she was troubled at his word, and kept pondering what manner of greeting this might be. And the angel said to her, Do not be afraid, Mary, for you have found grace with God. Behold, you shall conceive in your womb and shall bring forth a Son; and you shall call His name Jesus. He shall be great, and shall be called the Son of the Most High; and the Lord God will give Him the throne of David His father, and He shall be king over the house of Jacob forever; and of His kingdom there shall be no end. But Mary said to the angel, How shall this happen, since I do not know man? And the angel answered and said to her, The Holy Spirit shall come upon you, and the power of the Most High shall overshadow you; and therefore the Holy One to be born shall be called the Son of God. And behold, Elizabeth your kinswoman also has conceived a son in her old age, and she who was called barren is now in her sixth month; for nothing shall be impossible with God. But Mary said, Behold the handmaid of the Lord; be it done to me according to your word.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernard of Clairvaux, Homily 1 on the text "Missus est" (on Luke 1:26-38)
      text: |-
        Consider that this Angel was not one of lesser rank, even though such are, on one account or another, often sent on embassies to this earth. That he was an Angel of greater rank is indicated by his name which signifieth: Strength of God: and by the fact that he was sent, not by some Angel perhaps more excellent than he (as is usual), but from God himself. Therefore for this reason it is said: From God. Or, it might be for another reason, namely, lest it should be thought that God had discourteously revealed his counsel to any of the blessed spirits, except only the Archangel Gabriel, before he did so to the Virgin. For Gabriel alone was found so eminent among his compeers as to be held worthy both of such a name and message.

        Neither do his name and his message disagree. For whom did it more behove to announce Christ, who is the Power of God, than him who is honoured by a like name? For what else is power than strength? Neither doth it appear to be unbecoming or unseemly that the Lord and his messenger should be known by a like title. Christ is called the power or strength of God in a very different sense from that in which this appellation is given to the Angel. In the Angel it is but a name. In the case of Christ, it is also an eternal attribute.

        Christ is called, and truly is, the power of God. When the strong man armed was wont to keep his house in peace, a stronger came upon him, and overcame him by the strength of his arm, and forcibly deprived him of all his spoils. But the Angel is called the strength of God, either because this title was his right, as herald of the power of God; or because it was his duty to comfort the Virgin (who was naturally timid, simple, and bashful) lest she should be affrighted at the novelty of the miracle. This he certainly did by saying: Fear not, Mary, for thou hast found favour with God. Thus was Gabriel fitly chosen for this work. Yea, because he was entrusted with so great a mission, rightly was so great a name assigned to him.
      status: verified

