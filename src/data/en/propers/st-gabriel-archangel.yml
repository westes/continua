collect:
  text: |
    Let us pray.
    O God, Who didst choose the Archangel Gabriel from among all Thine other Angels, and
    send him to herald the mystery of Thine Incarnation, mercifully grant that we who keep
    his feast upon earth may feel his protection in heaven.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world
    without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. The Angel Gabriel * appeared to Daniel and said: From the beginning of thy prayers the word came forth: and I am come to show it to thee, because thou art a man of desires: therefore do thou mark the word, and understand the vision.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who didst choose the Archangel Gabriel from among all Thine other Angels, and
    send him to herald the mystery of Thine Incarnation, mercifully grant that we who keep
    his feast upon earth may feel his protection in heaven.
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world
    without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |-
    Christ, of the angels praise and adoration,
    Father and Saviour thou, of every nation,
    Graciously grant us all to gain a station,
    Where thou art reigning.

    Angel of strength, who triumphed, tumults quelling,
    Gabriel send us, ancient foes expelling,
    Oft in these temples may he make his dwelling,
    Dear unto heaven.

    May the fair Mother of the Light be o'er us,
    Virgin of peace, with all the angel chorus,
    And may the heavenly army go before us,
    Guiding and guarding.

    O may the Godhead, endless bliss possessing,
    Father, Son, Spirit, grant to us this blessing;
    All his creation joins his praise confessing,
    Now and forever. Amen.
  status: verified

matins-invitatory:
  text: The Lord, he is the King of the Archangels, * O come, let us worship him. Alleluia.
  status: verified

lauds-capitulum:
  text: 'Behold, the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation; and he informed me, and talked with me, and said: O Daniel, I am now come forth to give thee skill and understanding.'
  citation: Dan 9:21-22
  status: verified

lauds-hymn:
  text: |
    Christ, of the angels praise and adoration,
    Father and Saviour thou, of every nation,
    Graciously grant us all to gain a station,
    Where thou art reigning.

    Angel all peaceful, to our dwellings send us,
    Michael, from heaven coming to befriend us,
    Breathing serenest peace may he attend us,
    Grim war dispelling.

    Angel of strength, who triumphed, tumults quelling,
    Gabriel send us, ancient foes expelling,
    Oft in these temples may he make his dwelling,
    Dear unto heaven.

    Angel physician, health on man bestowing,
    Raphael send us from the skies all glowing,
    All sickness curing, wisest counsel showing
    In doubt and danger.

    May the fair Mother of the Light be o'er us,
    Virgin of peace, with all the angel chorus,
    And may the heavenly army go before us,
    Guiding and guarding.

    O may the Godhead, endless bliss possessing,
    Father, Son, Spirit, grant to us this blessing;
    All his creation joins his praise confessing,
    Now and forever. Amen.
  status: verified

