collect:
  text: |
    Let us pray.
    O God, the protector of all them that trust in thee, without whom nothing is strong, nothing is holy; increase and multiply upon us thy mercy, that thou being our ruler and guide, we may so pass through things temporal, that we finally lose not the things eternal.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: What man of you * that hath an hundred sheep, and if he shall lose one of them, doth he not leave the ninety-nine in the desert and go after that which was lost, until he find it? Alleluia.
  status: verified

magnificat-antiphon:
  text: What woman * having ten pieces of silver, if she lose one piece, doth not light a candle, and sweep the house, and seek diligently till she find it?
  status: verified

magnificat-antiphon/~-first:
  text: And they all knew, * from Dan even unto Beersheba, that Samuel was established to be a Prophet of the Lord.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope Pius XI, Encyclical Letter (Miserentissimus Redemptor)
      text: |-
        Among the various devotions paid to the Sacred Heart, the one foremost in importance and interest is assuredly the Act of Consecration, whereby we give to the divine Heart of Jesus both ourselves and all that is ours; in recognition of the truth that all we have cometh unto us out of the infinite charity of the eternal Deity. But it is expedient that any attempt of ours at self-consecration be accompanied with the purpose of making expiation (otherwise called reparation) to the most Sacred Heart of Jesus. In consecration the predominant intention may be said to be the purpose to repay (as it were) the love of the Creator by the love of us his creatures. But since Love Uncreate is passed over by human forgetfulness, and dishonoured by the sins of mankind, we should endeavour to repair such outrages; and the performance of this duty is ordinarily known as reparation.

        If we are, for the aforesaid reasons, to undertake both of those practices, we must recognize that we are impelled to the duty of reparation by the most powerful motives of justice and love: of justice, in order to expiate the injury done to God by our sins, and to re-establish through penance the divine order which was violated by them; of love, in order to suffer together with Christ, (who patiently endured all possible dishonour,) so that we may offer him some solace in return for his sufferings. For it is our duty to do more than honour God by the worship of adoration, whereby we adore his infinite Majesty, or by means of prayer, when we recognize his supreme dominion over us, or by acts of thanksgiving, when we praise his infinite generosity towards us. Because we are sinners, burdened with many offences, we must also make satisfaction to the offended justice of God, because of the numberless sins, offences and negligences we have committed.

        All men are under obligation to make reparation; for our souls are disfigured as the Christian faith teacheth by original sin as a result of the pitiable fall of Adam. We are also subject to passions, whereby we are corrupted in a truly sad state, and have thus made ourselves worthy of everlasting condemnation.
      responsory: |-
        R. Saul hath slain his thousands, and David his ten thousands. * Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
        V. Is not this David? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, and David his ten thousands?
        R. Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 15:1-10
      text: At that time, the publicans and sinners were drawing near to Him to listen to Him. And the Pharisees and the Scribes murmured, saying, This man welcomes sinners and eats with them. But He spoke to them this parable, saying, What man of you having a hundred sheep, and losing one of them, does not leave the ninety-nine in the desert, and go after that which is lost, until he finds it? And when he has found it, he lays it upon his shoulders rejoicing. And on coming home he calls together his friends and neighbors, saying to them, 'Rejoice with me, because I have found my sheep that was lost.' I say to you that, even so, there will be joy in heaven over one sinner who repents, more then over ninety-nine just who have no need of repentance. Or what woman, having ten drachmas, if she loses one drachma, does not light a lamp and sweep the house and search carefully until she finds it? And when she has found it, she calls together her friends and neighbors, saying, 'Rejoice with me, for I have found the drachma that I had lost.' Even so, I say to you, there will be joy among the angels of God over one sinner who repents.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 34 on the Gospels
      text: |-
        Ye have heard, my brethren, from the Gospel which hath but now been read, how that the publicans and sinners drew near unto our Redeemer, and how that He received them, not only to converse, but also to eat with Him. And when the Pharisees and Scribes saw it, they murmured. From this learn ye, that true righteousness is merciful, and false righteousness is contemptuous, albeit that the righteous also oft-times feel moved with just indignation at sinners. But it is one thing to feel thus indignant through pride, and another to feel so through love of law.

        The righteous indeed look down upon sinners, and yet, as not despising them; they abandon them, and yet, as not without hope; they fight against them, and yet, as loving them all the while; for if they be behoven to chasten them grievously as touching the outer man, yet is it through charity which offereth sweetness to their inner man. In their hearts they prefer before themselves them whom they are correcting; they hold as better than themselves them whom they judge. And thus doing, they watch by carefulness over them, which are committed unto their charge, and, by lowly-mindedness, over themselves.

        On the other hand, they whose exaltation cometh of a false righteousness, look down upon their neighbour, but are softened by no mercy toward his misery, and are all the more sinful, because they perceive not that they themselves are sinners. Of such were those Pharisees who judged the Lord because He received sinners, and, in the dryness of their own heart, rebuked the very Fountain of mercy. They were sick of so desperate a sickness that they knew not of themselves that they were sick; but, that they might know that they were so, the Heavenly Physician applied to them His tender ointments, and, by means of a gracious parable, lanced the boil of their pride of heart.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
