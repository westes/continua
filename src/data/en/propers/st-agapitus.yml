collect:
  text: |
    Let us pray.
    May thy Church, O God, rejoice with confidence in the pleading of thy holy Martyr
    Agapitus; and, by his glorious prayers, remain ever devout and stand ever secure.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. He that hateth his life * in this world, shall keep it unto life eternal.
    V. The righteous shall flourish like the palm-tree.
    R. He shall grow like a cedar in Lebanon.
    Let us pray.
    May thy Church, O God, rejoice with confidence in the pleading of thy holy Martyr Agapitus; and, by his glorious prayers, remain ever devout and stand ever secure.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Agapitus was a young man of Palestrina, who eagerly accepted martyrdom at the age of fifteen years, under the Emperor Aurelian. On account of his firmness in his religion, the Emperor ordered him first to receive an exceedingly long scourging with cat-gut, and then to be thrown into a foul dungeon, where he remained for four days without food. Being brought out of prison, live embers were put upon his head, but, whereas he still gave God thanks, he was whipped again, and hung up naked by the feet, in such wise that a thick smoke from a fire kindled beneath might pour into his mouth. Afterward, boiling water was poured upon his belly, and his jaws were broken. Then presently the judge fell from his judgment seat, and shortly after died. Whereupon the Emperor was enraged, and commanded the holy youth to be thrown to wild beasts, but these dared not to touch him, and he was struck by the sword at Palestrina.
      status: verified
