collect:
  text: |
    Let us pray.
    Almighty and everlasting God, grant us so to keep the mysteries of the Lord's Passion, that we may deserve to obtain Thy pardon.
    Through the same Jesus Christ, Thy Son, Our Lord, Who liveth and reigneth with Thee in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Before the feast of the Passover, * Jesus, knowing that His hour was come, having loved His own, loved them unto the end.
  status: verified

magnificat-antiphon:
  text: I have power * to lay down My life, and I have power to take it up again.
  status: verified
