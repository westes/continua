prime-antiphon:
  text: God bless thee, precious cross, * be welcome to the follower of Him That hung on thee, even my Master Christ.
  status: verified

prime-lectio:
  text: 'For Isaias saith: Lord, who hath believed our report? Faith then cometh by hearing; and hearing by the word of Christ. But I say: Have they not heard? Yes, verily, their sound hath gone forth into all the earth, and their words unto the ends of the whole world.'
  citation: Rom 10:16-18
  status: verified

terce-antiphon:
  text: 'The blessed Andrew prayed and said: * O Lord, King of everlasting glory, receive me hanging on this gallows.'
  status: verified

