        antiphon: But Andrew besought the people * not to hinder his passion.
      - psalms:
          - 100
        antiphon: Welcome me from among men and join me again to my Master; * that, as by thee He redeemed me, so by thee also He may take me unto Himself. Alleluia.
    versicle:
      v: Thou shalt make them princes over all the earth.
      r: They shall remember thy name, O Lord.
