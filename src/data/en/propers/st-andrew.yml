nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        The Apostle Andrew was born at Bethsaida, a town of Galilee, and was the brother of Peter. He was a disciple of John the Baptist, and heard him say of Christ, Behold the Lamb of God, whereupon he immediately followed Jesus, bringing his brother also with him. Some while after, they were both fishing in the Sea of Galilee, and the Lord Christ, going by, called them both, before any other of the Apostles, in the words, Follow Me, and I will make you fishers of men. They made no delay, but left their nets, and followed Him. After the death and Resurrection of Christ, Andrew was allotted Scythia as the province of his preaching, and, after labouring there, he went through Epirus and Thrace, where he turned vast multitudes to Christ by his teaching and miracles. Finally he went to Patras in Achaia, and there also he brought many to the knowledge of Gospel truth. Aegeas the Pro-consul resisted the preaching of the Gospel, and the Apostle freely rebuked him, bidding him know that while he held himself a judge of his fellow men, he was himself hindered by devils from knowing Christ our God, the Judge of all.

        Then Egeas, being angry, answered him, Boast no more of this thy Christ. He spake words even such as thine, but they availed Him not, and He was crucified by the Jews. Whereto Andrew boldly answered that Christ had given Himself up to die for man's salvation; but the Pro-consul blasphemously interrupted him, and bade him look to himself, and sacrifice to the gods. Then said Andrew, We have an altar, whereon day by day I offer up to God, the Almighty, the One, and the True, not the flesh of bulls nor the blood of goats, but a Lamb without spot; and when all they that believe have eaten of the Flesh Thereof, the Lamb That was slain abideth whole and liveth. Then Aegeas being filled with wrath, bound the Apostle in prison. Now, the people would have delivered him, but he himself calmed the multitude, and earnestly besought them not to take away from him the crown of martyrdom, for which he longed and which was now drawing near.

        Come a short while after, he was brought before the judgment-seat, where he extolled the mystery of the cross, and rebuked Aegeas for his ungodliness. Then Aegeas could bear with him no longer, but commanded him to be crucified, in imitation of Christ. Andrew, then, was led to the place of martyrdom, and, as soon as he came in sight of the cross, he cried out, O precious cross, which the Members of my Lord have made so goodly, how long have I desired thee! how warmly have I loved thee! how constantly have I sought thee! And, now that thou art come to me, how is my soul drawn to thee! Welcome me from among men, and join me again to my Master, that as by thee He redeemed me, so by thee also He may take me unto Himself. So he was fastened to the cross, whereon he hung living for two days, during which time he ceased not to preach the faith of Christ, and, finally, passed into the Presence of Him the likeness of Whose death he had loved so well. Under the Emperor Constantine the bones of the Apostle were first taken to Constantinople, whence they were afterwards brought to Amalfi. In the Pontificate of Pope Pius II his head was carried to Rome, where it is kept in the Basilica of St. Peter.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 4:18-22
      text: At that time, as Jesus was walking by the sea of Galilee, He saw two brothers, Simon, who is called Peter, and his brother Andrew, casting a net into the sea — for they were fishermen. And He said to them, "Come, follow Me, and I will make you fishers of men." And at once they left the nets, and followed Him. And going farther on, He saw two other brothers, James the son of Zebedee, and his brother John, in a boat with Zebedee their father, mending their nets; and He called them. And immediately they left their nets and their father, and followed Him.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 5 on the Gospels (on Matt 4:18-22)
      text: |-
        Dearly beloved brethren, ye hear how that Peter and Andrew, having once heard the Lord call them, left their nets, and followed their Saviour. As yet they had seen none of His miracles, as yet they had received no promise of their exceeding and eternal reward; nevertheless, at one word of the Lord they forgot all those things which they seemed to have. We have seen many of His miracles; we have received many of His gracious chastenings; many times hath He warned us of the wrath to come; and yet Christ calleth and we do not follow.

        He who calleth us to be converted is now enthroned in heaven; He hath broken the necks of the Gentiles to the yoke of the faith, He hath laid low the glory of the world, and the wrecks thereof, falling ever more and more to decay, do preach unto us that the coming of that day when He is to be revealed as our Judge is drawing nigh; and yet, so stubborn is our mind, that we will not yet freely abandon that which, will we, nill we, we lose day by day. Dearly beloved brethren, what shall we answer at His judgment-seat, we whom no lessons can persuade, and no stripes can break of the love of this present world?
      status: verified
