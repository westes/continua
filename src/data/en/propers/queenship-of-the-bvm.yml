matins-hymn:
  text: |
    Above the heavens reignest thou,
    O Virgin Queen forever blest;
    Above all creatures thou art now
    Adorned with beauty, golden dressed.

    Creation's culminating work
    Thou shinest in thy Maker's sight,
    Whose destiny it is to bear
    The Son who made thee, God of light.

    As Christ reigns King from high upon
    The Cross, empurpled by his Blood,
    Thou art the Queen of all to whom
    Redemption came from Holy Rood.

    Thou who with such glories art adorned,
    Look down upon us as we sing,
    Accept the grateful praises now
    We offer thee, our blessed Queen.

    All honor, laud, and glory be,
    O Jesu, Virgin-Born, to thee;
    Whom with the Father we adore,
    And Holy Ghost, for evermore.
    Amen.
  status: verified

matins-invitatory:
  text: Christ our King, who crowned his Mother, * Come, let us adore. (Alleluia.)
  status: verified

prime-lectio:
  text: 'He that hearkeneth to me, shall not be confounded: and they that work by me, shall not sin. They that explain me shall have life everlasting.'
  citation: Sir 24:30-31
  status: verified

benedictus-antiphon:
  text: O worthy Queen of the world, * Mary ever-Virgin, intercede for our peace and salvation, thou who gave birth to Christ the Lord, the Saviour of all. (Alleluia.)
  status: verified

magnificat-antiphon:
  text: O Blessed Mother, * and Virgin Mary undefiled, glorious Queen of the world, intercede for us with the Lord. (Alleluia.)
  status: verified

