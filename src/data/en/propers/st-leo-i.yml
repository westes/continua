nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Leo was an Etruscan who ruled the Church at the time when Attila, king of the Huns, whose surname is the Scourge of God, invaded Italy, and after a siege of three years, took, sacked, and burnt Aquileia. Thence he was hurrying to Rome, on fire with anger, and his troops were already preparing to cross the Po, at the place where that river is joined by the Mincio, when he was met by Leo, moved with compassion at the thought of the ruin which hung over Italy. By his God-given eloquence, Attila was persuaded to turn back, and when he was afterwards asked by his servants why, contrary to his custom, he had so meekly yielded to the entreaties of the Bishop of Rome, he answered that he had been alarmed by a figure dressed like a Priest, which had appeared at the side of Leo while he was speaking, holding a drawn sword, and had made as though to kill the king unless he consented. And so he returned into Pannonia.

        Leo went back to Rome, where he was received with rejoicing by all men. A while later, Genseric entered the city, but Leo, by the power of his eloquence and the authority of his holy life, persuaded him to abstain from fire, insult, and slaughter. When Leo beheld how the Church was assailed by many heresies, and in dire trouble through the Nestorians and Eutychians, to purify the same and establish her in the Catholic Faith, he called the Council of Chalcedon, where, in an assembly of six hundred and thirty Bishops, Nestorius was again condemned, along with Eutyches and Dioscorus; the decrees of which Council were confirmed by the authority of Leo.

        After these matters, this holy Pope set himself to the restoration and building of Churches. By his advice that godly woman Demetria built the Church of St. Stephen upon her farm on the Latin Road, at the third milestone from the city. He himself built another Church upon the Appian Way, which Church is called that of St. Cornelius. He restored likewise many other Churches, and the holy vessels used therein. He built Clergy-houses at the three Basilicas of Peter, Paul, and Constantine. He built a monastery hard by the Basilica of St. Peter. He appointed for the graves of the Apostles certain keepers, whom he called the Chamberlains of the said Apostles. He ordained that in the action of the Mystery should be uttered the words An holy sacrifice, an offering without spot. He ordered that no nun should have the covering of her head blessed until she had made trial of her virginity for forty years. After doing all these and other illustrious works, and after he had written much that is both godly and easy to be understood, he fell asleep in the Lord on the eleventh day of April. He held the Papal See for twenty years, one month, and thirteen days.
      status: verified
