collect:
  text: |
    Let us pray.
    Hear, O Lord, we beseech thee, the prayers which we offer thee on this the solemn feast-day of thy blessed Confessor and bishop Leo, and, for the sake of him who so nobly served thee, forgive us our trespasses.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Well done, thou good and faithful servant thou hast been faithful over a few things, I will make thee ruler over many things, saith the Lord, alleluia.
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
