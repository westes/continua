nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Hyginus, an Athenian, the son of a philosopher, was already a priest of the Roman Church when he was chosen by the votes of the clergy to succeed Telesphorus. He sat in the holy see of Peter, under the Emperor Antoninus Pius Augustus, three years, eleven months, and twenty-eight days. As soon as he was proclaimed Pontiff, he distinguished the orders of clerics into their grades, and arranged that in those churches called Titles there should be both principal ministers and others subject to them, to minister the sacred things to the faithful when need required.

        He also established that temples or oratories not be consecrated with sacred rite without the celebration of Mass; that new ones not be built, nor existing ones destroyed, without the bishop being consulted; and that the material gathered and set apart for that sacred use not be turned to profane uses. He further decreed that godparents be present at baptism to lift the infants from the sacred font; and that no bishop be condemned as guilty of a crime unless his case had been properly examined by the bishops of his province. All these things stand ratified under his title and name. He held three ordinations in the month of December, in which he created six bishops, fifteen priests, and five deacons.

        Now a little before this, Justin, a most illustrious philosopher and martyr of Christ, had written an apology for the Christian religion, addressed to the Emperor Antoninus Pius Augustus, and had obtained that the persecution should abate. Hence the slaughter of Christians was restrained by a public edict of the prince, not indeed altogether, yet very greatly. Nevertheless the most holy shepherd, by whose care the Lord's flock had been provided for, was not spared; for he ended his most innocent life by a glorious martyrdom, so as not to be unlike his predecessors, on the eleventh day of January, and was buried in the Vatican.
      status: draft
