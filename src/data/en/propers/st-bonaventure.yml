    - nocturn: 2
      isGospel: false
      text: |-
        Bonaventure was born at Bagnoregio in Tuscany. As a boy he fell dangerously ill, and his mother vowed that if he recovered, he should be dedicated to the religious life of blessed Francis; he came through unharmed by the prayers of that same Francis. So, as a young man, he chose to embrace the Institute of the Friars Minor, in which, under his teacher Alexander of Hales, he attained such excellence in learning that, seven years later, having taken the laurel of the mastership at Paris, he publicly expounded the Books of the Sentences with the greatest applause, and later illustrated them with splendid commentaries. He excelled wonderfully not only in the depth of his learning but in integrity of character and innocence of life, in humility, gentleness, contempt of earthly things, and longing for the things of heaven — worthy indeed to be held up as a pattern of perfection, and to be called a saint even by blessed Thomas Aquinas, to whom he was joined in the greatest affection. For Thomas, when he found him writing the life of St. Francis, said: Let us allow a saint to labour for a saint.

        Kindled with the flame of divine love, he was borne along by a singular devotion toward the Passion of the Lord Christ, on which he meditated continually, and toward the Mother of God, to whom he had wholly devoted himself; and he strove with the greatest earnestness to stir up this same devotion in others, both by word and example, and to increase it through his written works. Hence came that sweetness of manner, that grace of speech, and that charity poured out upon all, by which he bound the hearts of each to himself most closely. For this reason, when he was scarcely thirty-five years old, he was chosen at Rome, by the unanimous consent of all, Minister General of the Order; and he carried out the office he had undertaken for eighteen years with wonderful prudence and renown for holiness. He established many things useful to regular discipline and to the enlargement of the Order, which, together with the other mendicant Orders, he successfully defended against the slanders of its detractors.

        Summoned by blessed Gregory X to the Council of Lyons and created Cardinal Bishop of Albano, he gave outstanding service to the difficult business of the Council, whereby the discords of schism were settled and the doctrines of the Church vindicated. In the midst of these labours, in the fifty-third year of his age, in the year of salvation 1274, he departed this life to the great grief of all, and was honoured with a funeral by the whole Council, the Roman Pontiff himself being present. Sixtus IV, renowned for very many and very great miracles, enrolled him among the Saints. He wrote much, in which, joining the deepest learning with the ardour of devotion, he moves the reader even as he teaches him; wherefore he was deservedly distinguished by Sixtus V with the title of the Seraphic Doctor.
      status: draft
