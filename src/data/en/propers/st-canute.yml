nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Canute IV, son of Svend Estridsen, King of the Danes, was conspicuous from his tender years for faith, piety, and integrity of character, giving a token of exceptional holiness. Having obtained his father's sceptre by the acclamation of all, he began zealously to devote himself to the advancement of religion, to enrich the churches with revenues, and to adorn them with precious furnishings. Then, fired with zeal for spreading the faith, he attacked barbarous kingdoms in a just war, and brought the conquered and subjected nations under the Christian law. Glorious with many victories, and enriched with wealth, he cast down his royal diadem at the feet of Christ crucified, subjecting himself and his kingdom to Him who is King of kings and Lord of lords. He chastised his body with fasts, hairshirts, and scourges. Assiduous in prayer and contemplation, generous to the poor, and ever beneficent to all, he never once strayed from the path of justice and the divine law.

        Endowed with these and other virtues, the holy king hastened toward the highest peak of perfection. Now it happened that the kingdom of England was invaded by William, Duke of the Normans, with a formidable army. When the English begged the aid of the Danes, and the king had resolved to come to their help, he entrusted the expedition to his brother Olaf. But Olaf, enticed by the desire to reign, turned his arms to the king's destruction, stirring up the soldiers and the people against him. Nor were fuels for rebellion lacking. For when the king had decreed by law that tithes should be paid to the churches, that the precepts of God and the Church should be kept, and that transgressors should be punished, many perverse and wicked men, exasperated by this, first began to riot, then to stir up the common people, and at last set about plotting the death of the most holy king.

        The king, therefore, knowing beforehand that death threatened him for the sake of justice, and having foretold it, set out for the church of St. Alban the Martyr at Odense, as to the place of his combat; and fortified with the sacraments, he commended his final struggle to the Lord. Soon a multitude of the conspirators arrived there, and attempted to set fire to the church, to break down its doors, and to burst into it. When they could not succeed in this, they came up to the windows, and did not cease to hurl stones and arrows with great force at the holy king, who knelt praying for his enemies, until, pierced by the blows of stones and darts, and at last transfixed by a spear, he sank forward before the altar with arms outstretched, and was crowned with glorious martyrdom, while Gregory VII sat upon the apostolic throne. Afterward God glorified His martyr with many miracles. For Denmark, oppressed by grievous want and various calamities, paid the penalty for the sacrilege committed. Many also, afflicted with various infirmities, obtained healing and health at his tomb. And when the queen attempted secretly by night to steal away his sacred body and transfer it elsewhere, she was terrified by a great splendor sent from heaven, and desisted from her purpose.
      status: draft
