benedictus-antiphon:
  text: Let us solemnly celebrate the betrothal of this day of the ever-virgin Mary, Mother of God, whereby the height of the throne went forth, alleluia.
  status: draft

magnificat-antiphon:
  text: 'Thy betrothal, O Virgin Mother of God, hath announced joy to the whole world: for from thee is risen the sun of justice, Christ our God: who, loosing the curse, gave blessing, and confounding death, gave us life everlasting.'
  status: draft

magnificat-antiphon/~-first:
  text: Let us recall most worthily the betrothal of the glorious Virgin Mary, who both obtained the dignity of Mother and lost not her virginal chastity.
  status: draft

lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: The betrothal * of the glorious Virgin Mary, sprung of the seed of Abraham, of the tribe of Juda, bright from the stock of David.
    - psalms:
        - 99
      antiphon: This day is the betrothal * of the holy Virgin Mary, whose illustrious life lights up all the churches.
    - psalms:
        - 62
      antiphon: 'From a royal lineage * Mary sprung forth shines: by whose prayers we most devoutly beg to be helped in mind and spirit.'
  canticle:
    id: canticum-trium-puerorum
    antiphon: With heart and soul * let us sing glory to Christ on this holy solemnity of the most exalted Mother of God, Mary.
  laudate:
    antiphon: With joy * let us celebrate the betrothal of blessed Mary, that she may intercede for us to our Lord Jesus Christ.

