nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Agatho, a Sicilian by race, from a most learned and most holy monk was made Roman Pontiff, in the year of Christ 678. A man endowed with the highest humanity, exceptional candour of mind, and singular sweetness and courtesy of manners, loving all and most lovable to all. By nature and grace he was so fitted that he seemed born or made to bear that supreme dignity.

        Having received letters from Constantine Pogonatus, written to his predecessor Donus, for the convening of an ecumenical council, to remove the long schism with which the Church was afflicted, and to define the controversies of faith which had stirred up the greatest storms and ruin through almost all the East, he caused provincial synods to be held in the West, in which the cause of the Monothelites should be discussed and their errors condemned.

        These things having been prepared, he sent his Legates, and those of the Roman council, to Constantinople with two letters to the emperor, in which the aforesaid heresy was learnedly and solidly refuted, and its chief followers, Sergius, Cyrus, Paul, Pyrrhus, Peter and others, condemned, and he declared in express words that his predecessors had been free hitherto from all stain of error. By the authority of Agatho, therefore, the sixth universal synod was gathered, in which the same errors and the same erring men were condemned. At last, when he had sat about three years and five months, he piously died in the Lord, and was committed to burial in the basilica of the Prince of the Apostles.
      status: draft
