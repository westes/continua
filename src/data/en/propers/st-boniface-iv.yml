nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Boniface, the fourth of that name, the son of John, born in Valeria of the Marsi, from a monk of St. Sebastian outside the City and a Cardinal Priest, was raised to the pontificate under the Emperor Phocas, and consecrated on Sunday, the fifth day before the Kalends of September, in the year of the Lord 607; and he sat six years, eight months and thirteen days, having completed two ordinations in the month of December, in which he created twenty-five bishops and eight deacons.

        Immediately he turned his paternal home into a monastery, and assigned his estates to the same monastery for the use of the monks; but, that he might bind men to himself by a far greater benefit of this institute, having convoked the bishops of Italy to a synod, by holy laws he restored the failing discipline of the monks. Mellitus, Bishop of London, who had come to Rome to consult the Vicar of Christ about the affairs of England, took part in the synod, and carried its decrees, with the letters of Boniface, into Britain.

        From the Emperor Phocas the most holy Pontiff obtained a noble temple of Rome, the Pantheon, and, consecrating it with the Christian rite, changed it into a church dedicated to the Virgin Mother of God and to the holy Martyrs. To win greater sanctity he had an incredible quantity of sacred relics brought, taken from various sand-pits, and laid beside the chief altar. At last, renowned for virtue and merits under Heraclius, he fell asleep in the Lord on the eighth day before the Kalends of June, and was buried in the Vatican.
      status: draft
