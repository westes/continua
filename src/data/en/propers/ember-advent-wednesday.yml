collect:
  text: |
    Let us pray.
    Grant, we beseech thee, Almighty God, that the solemn Feast of our redemption, which is now at hand, may both help us in the life which now is, and further us toward the attaining of thine eternal joy in that which is to come.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: The angel Gabriel * was sent to Mary, a virgin espoused to Joseph.
  status: verified

magnificat-antiphon:
  text: Behold the handmaid * of the Lord; be it unto me according to thy word.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Luke 1:26-38
      text: 'At that time, the angel Gabriel was sent from God to a town of Galilee called Nazareth, to a virgin betrothed to a man named Joseph, of the house of David, and the virgin''s name was Mary. And when the angel had come to her, he said, "Hail, full of grace, the Lord is with you. Blessed are you among women." When she had heard him she was troubled at his word, and kept pondering what manner of greeting this might be. And the angel said to her, "Do not be afraid, Mary, for you have found grace with God. Behold, you shall conceive in your womb and shall bring forth a son; and you shall call His name Jesus. He shall be great, and shall be called the Son of the most High; and the Lord God will give Him the throne of David His father, and He shall be king over the house of Jacob forever; and of His kingdom there shall be no end." But Mary said to the angel, "How shall this happen, since I do not know man?" And the angel answered and said to her, "The Holy Spirit shall come upon you, and the power of the Most High shall overshadow you, and therefore the Holy One to be born shall be called the Son of God. And, behold, Elizabeth your kinswoman also has conceived a son in her old age, and she who was called barren is now in her sixth month; for nothing shall be impossible with God." But Mary said: "Behold the handmaid of the Lord; be it done to me according to your word."'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Commentary on Luke, Book 2 (from the Annunciation's own Common)
      text: |-
        The mysteries of God are unsearchable, and it is especially declared by a Prophet, that a man can hardly know His counsels. Nevertheless, some things have been revealed to us, and we may gather from some of the words and works of the Lord our Saviour, that there was a special purpose of God, in the fact that she who was chosen to be the mother of the Lord was espoused to a man. Why did not the power of the Highest overshadow her before she was so espoused? Perhaps it was lest any might blasphemously say that she had conceived in fornication the Holy One.

        And the angel came in unto her. Let us learn from this Virgin how to bear ourselves, let us learn her modesty, let us learn by her devout utterance, above all let us learn by the holy mystery enacted. It is the part of a maiden to be timid, to avoid the advances of men, and to shrink from men's addresses. Would that our women would learn from the example of modesty here set before us. She upon whom the stare of men had never been fixed was alone in her chamber, and was found only by an angel. There was neither companion nor witness there, that what passed might not be debased in gossip and the angel saluted her.

        The message of God to the Virgin was a mystery, which it was not lawful for the mouth of men, but only of angels, to utter. For the first time on earth the words are spoken The Holy Ghost shall come upon thee. The holy maiden heareth, and believeth. At length she saith Behold the handmaid of the Lord be it unto me according to thy word. Here is an example of lowliness, here is a pattern of true devotion. At the very moment that she is told she is chosen to be the mother of the Lord she at once declareth herself His handmaid. The knowledge that she was Mother of God caused in the heart of Mary only an act of humility.
      responsory: |-
        R. O thou that bringest good tidings of peace to Jerusalem, lift up thy voice with strength! * Say unto the cities of Judah, and to the inhabitants of Jerusalem: Behold, our God will come, for Whom we waited.
        V. O thou that tellest good tidings to Zion, get thee up into the high mountain, lift up thy voice with strength.
        R. Behold, our God will come, for Whom we waited.
      status: verified
