collect:
  text: |
    Let us pray.
    Almighty and everlasting God, you have given thy servants in the confession of the true faith, to acknowledge the glory of the Eternal Trinity, and to adore the unity in the power of thy Majesty; grant, that by steadfastness in this faith we may ever be defended from all adversities.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Blessed be the Holy One the Maker and Lord of all things. Blessed be the Holy and Undivided Trinity, now and always, and unto unending ages of ages.
  status: verified

magnificat-antiphon:
  text: With all our heart * and with all our voice do we acknowledge thee, praise thee, and bless thee, O God the Father the Unbegotten, O God the Only-Begotten Son, O God the Holy Ghost the Comforter, One Holy and Undivided Trinity, To thee be glory for ever.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Fulgentius, Bishop of Ruspe, On the Faith, Addressed to Peter
      text: |-
        The Faith which the holy Patriarchs and Prophets received from God before His Son was made Flesh, the Faith which the holy Apostles heard from the Lord Himself when Present in the Flesh, the Faith which the same Apostles learnt by the teaching of the Holy Ghost not only to preach by word of mouth, but also to leave behind them in their writings for the healthful instruction of all that should come after, that Faith teacheth that the Trinity, that is to say, the Father, the Son, and the Holy Ghost, is but One God. But we could not truly call the Father, the Son, and the Holy Ghost a Trinity, if One and the Selfsame Person were named Father, Son, and Holy Ghost.

        Nor if as the Being of the Father, the Son, and the Holy Ghost is One Being, so were there but One Person, then were it untrue to say that God is a Trinity. On the other hand, if, as the Persons of the Father, the Son, and the Holy Ghost are distinguished One from Another by that which is proper to Each, so were They diverse by difference of nature, then were it untrue to say that God is One. But since concerning the nature of the One True God, Who is a Trinity, it is the Truth to say that God is One, and the Truth to say that God is a Trinity, therefore the True God is a Trinity in Persons, and an Unity in nature.

        Through this Oneness of nature All That the Father is is in the Son and the Holy Ghost, All That the Son is is in the Father and the Holy Ghost, and All That the Holy Ghost is is in the Father and the Son. Of the Father, the Son, and the Holy Ghost, None is without Other, None is before Other, None is Greater than Other, None is Mightier than Other. The Father, as touching the One Divine Nature, is neither before nor greater than the Son and the Holy Ghost neither is it possible that the Eternity and Infinity of the Son, whether as before or greater, should be before or greater than the Eternity and Infinity of the Spirit.
      responsory: |-
        R. Saul hath slain his thousands, and David his ten thousands. * Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
        V. Is not this David? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, and David his ten thousands?
        R. Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 28:18-20
      text: All power in heaven and on earth has been given to Me. Go, therefore, and make disciples of all nations, baptizing them in the Name of the Father, and of the Son, and of the Holy Spirit, teaching them to observe all that I have commanded you; and behold, I am with you all days, even unto the consummation of the world.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Gregory Nazianzen, Patriarch of Constantinople, Treatise on the Faith
      text: |-
        There is no Catholic but knoweth that the Father is a Very Father, the Son a Very Son, and the Holy Ghost a Very Holy Ghost, even as the Lord Himself saith unto His Apostles: "Go ye and baptize all nations in the Name of the Father, and of the Son, and of the Holy Ghost." This is that Perfect Trinity Who is but One being, and of Whom therefore we testify that His Substance is one. For we make no division in God, as divisions are made in bodies, but we testify, that, according to the power of the Divine Nature, Which standeth not in matter, the Persons named have a real existence, and that God is One.

        We do not say, as some have dreamt, that the Begetting of the Son of God is an outgrowing from one part to another part neither do we say that He is the Word in the sense of a mere sound uttered by a voice, but we do believe that these three Names and the Persons meant by them are all of only One Being, One Majesty, and One Power. And therefore we testify that God is one, because this One-ness of His Majesty forbiddeth that we should use the Plural form of speech and say, "Gods." It is Catholic language to say, "Father and Son," but we cannot and must not say that the Father and the Son are two gods. And that, not because the Son of God is not by Himself God; yea, He is Very God of Very God but because we know that the Son of God is not from elsewhere, but from the One Father Himself, and therefore we say that God is One. This is the doctrine which Prophets and Apostles have delivered; this is the doctrine which the Lord Himself taught when He said: "I and the Father are One" (John x. 30), that is, He meant, as touching the one Divine Being, but as touching Persons, We are distinct.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 6:36-42
      text: 'Be merciful, as your Father also is merciful. Judge not, and you shall not be judged; condemn not, and you shall not be condemned. Forgive, and you shall be forgiven. Give, and it shall be given to you: good measure, pressed down, shaken together, and running over, shall they give into your bosom. For with the same measure that you shall mete withal, it shall be measured to you again. And He spoke also to them a parable: Can the blind lead the blind? Do they not both fall into the ditch? The disciple is not above his master, but everyone shall be perfect, if he be as his master. And why do you see the speck in your brother''s eye, but do not consider the beam that is in your own eye? Or how can you say to your brother, Brother, let me pull the speck out of your eye, when you yourself do not see the beam in your own eye? Hypocrite, cast out first the beam out of your own eye, and then you shall see clearly to take out the speck from your brother''s eye.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: 'Commemoration of the First Sunday after Pentecost: St. Augustine, Bishop of Hippo, Sermon 15 on the Words of the Lord in Matthew'
      text: 'There are two works of mercy which free us, and which the Lord Himself hath briefly named in the Gospel "Forgive, and ye shall be forgiven give, and it shall be given unto you." "Forgive, and ye shall be forgiven", such is the promise of pardon. "Give, and it shall be given unto you", such is the promise of favour. As touching forgiveness thou hast trespasses which thou wouldest fain have forgiven, and them which have trespassed against thee, whom thou canst forgive. As touching favour, there are beggars that beg from thee, and thou art a beggar to God. When we pray, we are all beggars to God, standing at the door of the Great Householder, yea, falling down on our knees, and beseeching Him to give us somewhat and that somewhat is God Himself. What doth a beggar ask of thee Bread. And what dost thou ask of God but that Christ Who saith: "I am the Living Bread Which came down from heaven?" If ye will be forgiven, forgive ye. If ye will be pardoned, pardon ye. If ye will receive, "give, and it shall be given unto you."'
      status: verified
