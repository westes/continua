collect:
  text: |
    Let us pray.
    O God, Who in thine unspeakable Providence hast been pleased to give
    thine holy Angels charge over us, to keep us, mercifully grant unto our
    prayers, that we be both ever fenced by their wardship here, and
    everlastingly blessed by their fellowship hereafter.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Are they not all ministering spirits, * sent forth to minister for them who shall be heirs of salvation?
    V. The Lord led the just through the right ways:
    R. And showed him the kingdom of God.
    Let us pray.
    O God, Who in thine unspeakable Providence hast been pleased to give
    thine holy Angels charge over us, to keep us, mercifully grant unto our
    prayers, that we be both ever fenced by their wardship here, and
    everlastingly blessed by their fellowship hereafter.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |-
    Angel-guardians of men, spirits and powers we sing,
    Whom our Father hath sent, aids to our weakly frame,
    Heavenly friends and guides, help from on high to bring,
    Lest we fail through the foeman's wile.

    He, the spoiler of souls, angel-traitor of old,
    Cast in merited wrath out of his honoured place,
    Burns with envy and hate, seeking their souls to gain
    Whom God's mercy invites to heaven.

    Therefore come to our help, watchful ward of our lives:
    Turn aside from the land God to thy care confides
    Sickness and woe of soul, yea, and what else of ill
    Peace of heart to its folk denies.

    Now to the Holy Three praise evermore resound:
    Under whose hand divine resteth the triple world
    Governed in wondrous wise: glory be theirs and might
    While the ages unending run. Amen.
  status: verified

matins-invitatory:
  text: The Lord, He is the King of the Angels, * O come, let us worship Him.
  status: verified

lauds-capitulum:
  text: Behold I will send my angel, who shall go before thee, and keep thee in thy journey, and bring thee into the place that I have prepared. Take notice of him, and hear his voice.
  citation: Exod 23:20-21
  status: verified

lauds-hymn:
  text: |-
    Ruler of the dread immense!
    Maker of this mighty frame!
    Whose eternal providence
    Guides it, as from thee it came:

    Low before thy throne we bend;
    Hear our supplicating cries;
    And thy light celestial send
    With the freshly dawning skies.

    King of kings, and Lord most high!
    This of thy dear love we pray:
    May thy guardian angel nigh,
    Keep us from all sin this day.

    May he crush the deadly wiles
    Of the envious serpent's art,
    Ever spreading cunning toils
    Round about the thoughtless heart.

    May he scatter ruthless war
    Ere to this our land it come;
    Plague and famine drive away,
    Fix securely peace at home.

    Father, Son, and Holy Ghost,
    One eternal Trinity!
    Guard by thy angelic host
    Us who put our trust in thee. Amen.
  status: verified

