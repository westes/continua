  text: |
    R.br. An Angel stood at the Altar of the Temple, * Alleluia, alleluia.
    R. An Angel stood at the Altar of the Temple, * Alleluia, alleluia.
    V. Having a golden censer in his hand.
    R. Alleluia, alleluia.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. An Angel stood at the Altar of the Temple, * Alleluia, alleluia.
  status: verified

lauds-versicle:
  text: |-
    V. Before the Angels will I sing praise unto thee, O my God.
    R. I will worship toward thy holy Temple, and praise thy Name.
  status: verified

prime-lectio:
  text: But if thou wilt hear his voice, and do all that I speak, I will be an enemy to thy enemies, and will afflict them that afflict thee. And my angel shall go before thee.
  citation: Exod 23:22-23
  status: verified

terce-capitulum:
  text: |
    Behold I will send my angel, who shall go before thee, and keep thee in thy journey, and bring thee into the place that I have prepared. Take notice of him, and hear his voice.
    R. Thanks be to God.
    V. An Angel stood at the Altar of the Temple.
    R. Having a golden censer in his hand.
  citation: Exod 23:20-21
  status: verified

sext-capitulum:
  text: |
    Take notice of him, and hear his voice, and do not think him one to be contemned: for he will not forgive when thou hast sinned, and my name is in him.
    R. Thanks be to God.
    V. The smoke of the incense ascended up before the Lord.
    R. Out of the Angel's hand.
  citation: Exod 23:21
  status: verified

