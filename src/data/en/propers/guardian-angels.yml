nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard of Clairvaux, On Psalm 90 (Qui habitat)
      text: |-
        He hath given His Angels charge over thee. A wonderful graciousness, and a wonderful outpouring of love. For who hath given charge? And what charge? Unto whom? And over whom? Let us carefully consider, my brethren, let us carefully hold in mind this great charge. For who hath given this charge? To Whom belong the Angels? Whose commandments do they obey, and Whose will do they do? He hath given His Angels charge over thee, to keep thee in all thy ways, and that not carelessly, for they shall bear thee up in their hands. The Highest Majesty, therefore, hath given charge unto Angels, even His Angels. Unto these beings so excellently exalted, so blessed, so near to Himself, even as His own household, unto these hath He given charge over thee. Who art thou? What is man, that Thou art mindful of him? or the son of man, that Thou visitest him? Even as though man were not rottenness, and the son of man, a worm. But what charge hath He given them over thee? To keep thee in all thy ways.

        What respect, what thankfulness, what trust, ought this word to work in thee! Respect for their presence, thankfulness for their kindness, trust in their safe keeping. Walk carefully, as one with whom are Angels, as hath been laid in charge upon them, in all thy ways. In every lodging, in every nook, have reverence for thine Angel. Dare not to do in his presence what thou wouldst not dare to do in mine. Or dost thou doubt whether he be indeed present, because thou seest him not? What if thou heardest him? What if thou touchedst him? What if thou smelledst him? Behold, not by sight alone is the presence of things made manifest.

        Let us also, brethren, dearly love His Angels, as them with whom we are one day to be co-heirs, and who in the meanwhile are leaders and guardians set over us by the Father. With such guardians, whereof shall we be afraid? They that keep us in all our ways, can neither be conquered nor corrupted, far less can they corrupt. They are trusty, they are wary, they are mighty. Whereof shall we be afraid? Only let us follow them, only let us cleave unto them, and we shall abide under the shadow of the God of heaven. As often then as the gloom of temptation threateneth thee, or the sharpness of tribulation hangeth over thee, call upon Him That keepeth thee, thy Shepherd, thy Refuge in times of trouble, call upon Him, and say: "Lord, save us, we perish."
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matthew 18:1-10
      text: At that time, the disciples came to Jesus, saying, "Who thinkest thou is the greater in the kingdom of heaven?" And Jesus, calling unto him a little child, set him in the midst of them, and said, "Amen I say to you, unless you be converted, and become as little children, you shall not enter into the kingdom of heaven. Whosoever therefore shall humble himself as this little child, he is the greater in the kingdom of heaven. And he that shall receive one such little child in my name, receiveth me. But he that shall scandalize one of these little ones that believe in me, it were better for him that a millstone should be hanged about his neck, and that he should be drowned in the depth of the sea. Woe to the world because of scandals. For it must needs be that scandals come, but nevertheless woe to that man by whom the scandal cometh. And if thy hand, or thy foot scandalize thee, cut it off, and cast it from thee. It is better for thee to go into life maimed or lame, than having two hands or two feet, to be cast into everlasting fire. And if thy eye scandalize thee, pluck it out, and cast it from thee. It is better for thee having one eye to enter into life, than having two eyes to be cast into hell fire. See that you despise not one of these little ones, for I say to you that their angels in heaven always see the face of my Father who is in heaven."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Hilary of Poitiers, Commentary on Matthew, ch. 18
      text: |-
        Unless ye become as little children, saith the Lord, ye shall not enter into the kingdom of heaven, that is, unless by the uprooting of bodily and mental depravity, we bring our souls to the innocency of childhood. But He giveth the name of children to all such as believe by the hearing of faith. Children follow their father, love their mother, know not how to wish evil to their neighbours, are not careful for earthly riches; they insult not, they hate not, they lie not, they believe what they are told, and take for truth what they hear. Us then it behoveth to return to the simpleness of little children, for when we are well rooted therein, we shall so far bear about in ourselves an image of the sublime simpleness of the Lord Jesus.

        Woe unto the world because of offences! The lowliness of the Passion is an offence unto the world. Such is the state of stupidity to which man's ignorance hath reduced itself, that it turneth away from the Lord of Eternal Glory, because of the unsightliness of the Cross! And what is so certain to bring woe unto the world as to turn away from Christ? And therefore He saith it must needs be that offences come, because his fulfilling the lowliness of the Passion was the predestined mean whereby He was to give us eternal life.

        Take heed that ye despise not one of these little ones that believe in Me. He hath laid on us a most meet tie to constrain us to love one another, especially such as indeed believe in the Lord. For I say unto you that in heaven their Angels do always behold the face of My Father Which is in heaven. For the Son of Man is come to save that which was lost. From these words we see, first, that the Son of Man saveth; secondly, that the Angels do see God; and thirdly, that the Angels of these little ones have the wardship over the prayers of the faithful. That the Angels have this wardship is taught us absolutely. The Angels therefore do every day offer to God the prayers, which they which are saved, do make to Him in the Name of Christ. Therefore it is dangerous for a man to despise them, seeing that these are they by whose watchful service and ministry his wishes and requests are presented before the throne of the eternal and unseen God.
      status: verified

