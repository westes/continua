collect:
  text: |
    Let us pray.
    O Lord Jesus Christ, who unto the holy virgin Margaret Mary didst in
    wondrous manner reveal the unsearchable riches of thy Heart, grant
    us, by her merits and example, that loving thee in all things and
    above all things, we may obtain an abode in thy Heart for evermore.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O Lord Jesus Christ, who unto the holy virgin Margaret Mary didst in
    wondrous manner reveal the unsearchable riches of thy Heart, grant
    us, by her merits and example, that loving thee in all things and
    above all things, we may obtain an abode in thy Heart for evermore.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Margaret Mary Alacoque was born of a respectable family in a village in the diocese of Autun. From her earliest years she gave signs of holiness. Filled with a burning love of the Virgin Mother of God, and of the august mystery of the Eucharist, while still a young girl she dedicated her virginity to God. Above all else she strove to realize in her life the performance of Christian virtues. She delighted to spend continuous hours in prayers and in meditation upon the things of heaven. She was humble, and patient in adversity. She practised bodily penance. She was charitable towards her neighbours, especially the poor. By every means within her power she strove diligently to imitate the most holy example left by our divine Redeemer.

        Margaret entered the Order of the Visitation. There her life became immediately a shining example to others. God endowed her highly with the gift of prayer. He gave her other favours, such as frequent visitations. The most famous of these was that one when Jesus appeared to her as she knelt in prayer before the Blessed Sacrament. Opening his breast, He revealed his divine Heart glowing with flames and encircled with a crown of thorns. He bade her in return for his excessive love and in atonement for the insults of ungrateful men, to seek to have established public adoration of his Heart. This devotion he promised to enrich with treasures of heavenly grace. When, out of humility, she hesitated to undertake so great a task, the loving Saviour encouraged her. At the same time he pointed out Claude de la Colombiere, a man of great holiness, as one who could guide and help her. Our Lord also comforted her with the assurance that very great blessings would accrue afterwards to the Church from the worship of his divine Heart.

        Margaret strove ardently to fulfill the Redeemer's command. Vexations, even bitter insults, were her portion from some who maintained that she was subject to mental aberrations. She not only bore these sufferings patiently, she even profited by them, offering herself in anguish and reproach as a victim acceptable to God, bearing all things as a more sure means of accomplishing her purpose. Renowned for her religious perfection, becoming each day more closely united with her divine spouse by contemplation of celestial things, she took flight to him in the forty-third year of her age, and in the year of restored salvation 1690. She became famous for miracles. Benedict XV added her to the list of the saints; Pius XI extended her office to the universal Church.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 11:25-30
      text: At that time, Jesus spoke and said, I praise You, Father, Lord of heaven and earth, that You hid these things from the wise and prudent, and revealed them to little ones. Yes, Father, for such was Your good pleasure. All things have been delivered to Me by My Father; and no one knows the Son except the Father; nor does anyone know the Father except the Son, and him to whom the Son chooses to reveal Him. Come to Me, all you who labor and are burdened, and I will give you rest. Take My yoke upon you, and learn from Me, for I am meek and humble of heart; and you will find rest for your souls. For My yoke is easy, and My burden light.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Francis de Sales, Sermons for Pentecost, the Third Sunday after Pentecost, and Easter Monday
      text: |-
        There is no other true knowledge given but that which is given by the Holy Ghost. And this is granted to the humble only. Have we not known great theologians who spake marvellously of the virtues but did not practice them? Have we not seen, on the contrary, many women who did not know how to discourse on the virtues, practice the works of virtue worthily? The Holy Spirit hath made these wise because they had fear of the Lord, piety and humility.

        Our Lord is the great and excellent physician of all our infirmities. Before he came into the world he announced openly to his prophets, I will bind up that which was broken, and I will strengthen that which is weak. Finally with his own lips he invited us, saying, Come unto me, all ye that labour and are burdened, and I will give you rest. What wonder is it, then, if we see him surrounded by the sick, by sinners, and by publicans. Is it not the glory of the physician to be sought out by the sick?

        The Lord beareth our miseries and ennobleth them. He layeth our miseries to his Heart; he sheweth his side. It is meet then, that we should make some return to him, lest he who now sheweth us his wounds out of love, may one day shew them with wrath and indignation. Grant, O good Jesu, that we may receive the peace which thou dost offer and let us see thy wounds. Since there remain faith, hope and charity, grant that, rooted in faith, rejoicing in hope, glowing in charity, we may await thy coming in the blessed expectation that we may see thee as the Lamb upon the right, and not as the lion on the left; and, for faith, may we have vision, and for hope, possession, and for imperfect charity, perfect charity, in which we may rejoice for ever and ever. Amen.
      status: verified
