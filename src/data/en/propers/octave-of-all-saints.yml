vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: I beheld, and, lo, great multitude, which no man could number, * of all nations, (and kindreds, and people, and tongues,) stood before the throne.
    - psalms:
        - 111
      antiphon: And all the Angels stood round about the throne, * (and about the Elders, and the four living creatures,) and fell before the throne on their faces, and worshipped God.
    - psalms:
        - 112
      antiphon: Thou, O Lord God, hast redeemed us by thy Blood, * out of every kindred, and tongue, and people, and nation, and hast made us a kingdom unto our God.
    - psalms:
        - 115
      antiphon: The praise of all His Saints, * even of the children of Israel, a people near unto Him; this honour have all His Saints.

