nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Cornelius was a Roman who held the Papacy during the reign of the Emperors Gallus and Volusian. He, and that most holy Lady Lucina, took the bodies of the Apostles Peter and Paul out of the Catacombs and put them in more convenient places. Lucina laid the body of Paul in a farm of her own upon the road to Ostia, hard by the place where he had received the sword-stroke. Cornelius placed that of the Prince of the Apostles hard by where he had been crucified. When this was told to the Emperors, and likewise that Cornelius was the means of making many Christians, he was banished to Civitavecchia, where Cyprian, the holy Bishop of Carthage, comforted him by letters.

        They continued thus to write often one to the other, till the Emperors took in bad part these exchanges of Christian love, and sent for Cornelius to Rome. There they commanded him to be lashed with scourges loaded with lead as though he were a traitor, and then to be carried to offer sacrifice before the image of Mars. He firmly refused to commit this great wickedness, and was forthwith beheaded, upon the 14th day of September. The blessed Lucina, with the help of the clergy, buried his body in the sand-pit on her own farm, near the Cemetery of Callistus. He lived as Pope about two years.
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Jerome, Priest, On Illustrious Men, ch. 67
      text: Cyprian was an African. He was first distinguished as a teacher of Rhetoric. He afterwards became a Christian at the persuasion of the Priest Caecilius, whose surname he took, and parted all his goods among the poor. It was not long before he was chosen a Priest, and then made Bishop of Carthage. It would be idle to enlarge upon his wit, seeing that his works are as well known as the sun. He suffered under the Emperors Valerian and Gallienus, in the eighth persecution, and upon the same day, though not in the same year, that Cornelius testified at Rome.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 21:9-19
      text: At that time, Jesus said to His disciples, When you hear of wars and insurrections, do not be terrified; these things must first come to pass, but the end will not be at once. Then He said to them, Nation will rise against nation, and kingdom against kingdom; and there will be great earthquakes in various places, and pestilences and famines, and there will be terrors and great signs from heaven. But before all these things they will arrest you and persecute you, delivering you up to the synagogues and prisons, dragging you before kings and governors for My name's sake. It shall lead to your bearing witness. Resolve therefore in your hearts not to meditate beforehand how you are to make your defense. For I Myself will give you utterance and wisdom, which all your adversaries will not be able to resist or gainsay. But you will be delivered up by your parents and brothers and relatives and friends; and some of you they will put to death. And you will be hated by all for My name's sake; yet not a hair of your head shall perish. By your patience you will win your souls.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 35 on the Gospels
      responsory: |-
        R. Because of the covenant of the Lord, and the laws of their fathers, the Saints of God abode in brotherly love: * For one spirit and one faith was ever in them.
        V. Behold how good and how pleasant it is for brethren to dwell together in unity.
        R. For one spirit and one faith was ever in them.
      text: |-
        Our Lord and Redeemer willeth us to know what shall be the signs that the end of the world is at hand, to the end that ye may be the less terrified, when that cometh whereof ye have already had warning. Darts strike less which are seen coming: and the plagues of the earth will be to us more bearable, if we are harnessed against them with the shield of foreknowledge. Behold, how He saith, When ye shall hear of wars and commotions be not terrified, for these things must first come to pass; but the end is not by and by. It behoveth us to ponder these words of our Redeemer, wherein He warneth us of suffering, from without, and from within. Wars are the work of a foreign enemy, commotions of the citizens. Therefore, that He may let us know that we shall be troubled from within and from without, He showeth that our wrestling shall be in part against strangers, and in part against our brethren.

        When these woes come, the end is not by and by. And He saith further, Nation shall rise against nation, and kingdom against kingdom; and great earthquakes shall be in diverse places, and pestilences, and famines, and fearful sights and great signs shall there be from heaven. Before the last tribulation cometh, shall come many other tribulations: and, by the many woes which shall come first, shall be foreshadowed the everlasting woe which shall come in the end. And therefore, after wars and commotions, the end is not yet by and by; many woes must come first, to give warning of the woe that hath no end.

        But, forasmuch as the signs and troubles whereof the Lord speaketh are so manifold, we must needs shortly consider each; for, of necessity, we must suffer some things from heaven, some from the earth, some from the powers of nature, and some from men. For where He saith, Nation shall rise against nation, He speaketh concerning the troubling of men; where, great earthquakes shall be in diverse places, concerning wrath from above; where, and pestilences, concerning the frailty of the body; where, and famines, concerning the barrenness of the earth: where, fearful signs from heaven, and tempests, concerning commotions of the air. As, then, all things shall have an end, so, before the end, shall all things be troubled; and we, who have sinned and come short in all things, shall in all things be afflicted, that it may be fulfilled that is written: And the world shall fight with Him against the unwise.
      status: verified
