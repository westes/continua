nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Melchiades, an African, held the Roman Church after Eusebius. While he was still a priest, he sent deacons with the letters of Maxentius the Emperor, and the letters of the Praetorian Prefect to the Prefect of the City, that they might receive back the places which had belonged to the Christians and been taken away in the time of persecution. When peace was given back to the Churches, the Donatists approached Constantine Augustus, that he might give judges in their cause against Caecilian, Bishop of Carthage. To whom Constantine replied: You have asked of me a judgment in the world, when I myself await the judgment of Christ. Nevertheless three bishops were given as judges and sent to Rome to the Pontiff Melchiades, that there a Synod might be assembled for the concord and unity of the brethren.

        These three, therefore, set out for the City and met with fifteen other bishops and with Melchiades himself in the house of Fausta in the Lateran, where the cause was discussed, and Caecilian was pronounced innocent by the sentences of all the bishops, and the judgment was closed by decree of the same Melchiades. And that the Donatists might be united to the Catholic Church, Melchiades (as holy Augustine writes), as a most excellent man, a son of Christian peace and father of the Christian people, laboured greatly, even offering the condition that in whatever places there were two bishops of opposing factions, the one who had been ordained first should be confirmed, and for the other another people be provided to rule.

        He ordained that on no account should any of the faithful fast on Sunday or Thursday, because the pagans kept those days as if devoted to a sacred fast. He likewise decreed that the offerings consecrated by the bishop, which were called the fermentum, be sent to the churches, so that priests celebrating in their titles with their people should not think themselves separated from communion with the bishop. When he had suffered much in the persecution of Maximian, he at last rested in the Lord under Constantine, on the fourth day before the Ides of December, and was buried in the cemetery of Callistus on the Appian Way. In one ordination he created six Priests, five Deacons, and eleven Bishops for various places.
      status: draft
