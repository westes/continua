nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Joseph Calasanz, called of the Mother of God, was born of a noble family at Petralta in Aragon. From his tender years he began to show that fondness for children, and that gift of instructing them for which he was afterwards distinguished. He called them around him when he was still but a child himself, and taught them the mysteries of the faith and godly prayers. He was deeply learned in profane and sacred letters, and it was while he was studying theology at Valencia that he bravely overcame the wiles of a noble and powerful lady and, by a brilliant victory, kept untarnished that virginity which he had vowed to God. He became a Priest in consequence of a vow, and was summoned by many Bishops in the kingdoms of New Castile, Aragon, and Catalonia to help them in their work, wherein he surpassed the hopes of all, correcting depraved manners, restoring the discipline of the Church, and marvellously putting an end to hatreds and bloody feuds. But in obedience to a vision from heaven and many warnings from the voice of God, he left Spain and went to Rome.

        In Rome he afflicted his body with extraordinary hardness of living, with watching, and with fasting, and so passed his days and nights in prayer, and in the contemplation of heavenly things. He was used to visit the Seven Churches almost every night, a custom which he kept for many years. Having joined several godly Brotherhoods, it was strange how eagerly he relieved the poor by alms and every sort of kindness, choosing especially the sick and the imprisoned. When the city was ravaged by a pestilence, such was the charitable zeal with which he joined in the labours of St. Camillus de' Lelli, that besides the great help which he brought to the sick poor, he would even carry the bodies of the dead on his own shoulders to burial. Having understood from God that his call was to bring up children in godliness and good learning, he founded the Order of the Poor Regular Clerks of the Pious Schools of the Mother of God, who profess as the special object of their Institute a singular care for the teaching of the poor. This Institute received the warm approval of Clement VIII., Paul V., and other Popes, and in a short time obtained a marvellous extension through many provinces and kingdoms of Europe.

        Then when he was at the head of his whole Order, and toiling with all his might for the salvation of souls, he never ceased to teach children, especially the poor, to sweep out the school-rooms, and to accompany the scholars home. Thus in spite of broken health he worked on for two and fifty years, with the greatest longsuffering and lowliness. He won that God should glorify him by many miracles worked in the presence of his disciples, and that the Most Blessed Virgin should appear to him, with the Child Jesus in her arms, blessing them as they prayed. He foretold the day of his own death, and the restoration and growth of his Order, which seemed at that time to be almost entirely destroyed. He fell asleep in the Lord at Rome, upon the 25th day of August, in the year of salvation 1648, and of his own age the 92nd. An hundred years after his death his heart and tongue were found whole and incorrupt. God glorified him by many miracles even after his death, and he was first crowned by Benedict XIV. with the honours paid to the Blessed, and then solemnly enrolled by Clement XIII. among the Saints.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 18:1-10
      text: At that time, the disciples came to Jesus, saying, "Who, thinkest thou, is the greater in the kingdom of heaven?" And Jesus, calling unto Him a little child, set him in the midst of them, and said, "Amen I say to you, unless you be converted, and become as little children, you shall not enter into the kingdom of heaven. Whosoever therefore shall humble himself as this little child, he is the greater in the kingdom of heaven. And he that shall receive one such little child in My name, receiveth Me. But he that shall scandalize one of these little ones that believe in Me, it were better for him that a millstone should be hanged about his neck, and that he should be drowned in the depth of the sea. Woe to the world because of scandals! For it must needs be that scandals come, but nevertheless woe to that man by whom the scandal cometh! And if thy hand, or thy foot scandalize thee, cut it off, and cast it from thee. It is better for thee to go into life maimed or lame, than having two hands or two feet, to be cast into everlasting fire. And if thy eye scandalize thee, pluck it out, and cast it from thee. It is better for thee having one eye to enter into life, than having two eyes to be cast into hell fire. See that you despise not one of these little ones, for I say to you, that their Angels in heaven always see the face of My Father Who is in heaven."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. John Chrysostom, Homily 60 on Matthew, ch. 18
      text: |-
        Take heed, saith Jesus, that ye despise not one of these little ones, for I say unto you, that in heaven their angels do always behold the face of My Father; and that for their sake am I come, and this is the will of My Father. Hereby the Lord stirreth us up to guard and save these little ones. Thou seest how mighty are the walls which He raiseth to protect little children, and how great thought and care He hath lest they should be lost, threatening on the one hand the uttermost punishment against whosoever shall offend one of these little ones which believe in Him, and promising on the other hand, the highest reward to whosoever shall receive one such little child in His Name, and this His teaching He giveth both in His Own, and in His Father's Name.

        Let us therefore take example by the Lord, and let us leave nothing undone for the good of any of our brethren, even for such as seem to us the least and lowliest, but if there be any need that we should serve any, low and outcast though he be, let us serve him though the thing look hard to us and calling for a great deal of work, let such things, I pray, be looked on as light and easy if they be required for our neighbour's salvation, for of such price and such care did God count his soul to be worth, that He spared not to purchase it, even His Own Son.

        If it be not enough for our salvation that we should ourselves live well, but we must also seek the salvation of others, what shall we answer, if we neither live well ourselves, nor exhort others? What hope that we shall be saved is then left to us? What more important task is there than to train up minds, and teach to the young how to live? He that is skilled to mould well the minds of children I reckon a nobler workman than any painter or sculptor, or such like artist.
      status: verified
