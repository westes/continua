nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Gregory, the second of that name, a Roman by race, the son of Marcellus, in the year of Christ 714, by the wonderful concord of all the clergy and people, was raised to the supreme pontificate of the Catholic Church. From boyhood devoted to divine worship, he had lived in the Lateran patriarchium under the eyes and discipline of blessed Sergius, discharging first the office of subdeacon, then of sacellarius. Soon the care of the library was entrusted to him, and at last he was promoted to the order of deacon, and he set out for the royal city together with the most holy Pope Constantine. There, questioned by the emperor on certain points, being most skilled in the sacred writings and a most constant defender of ecclesiastical affairs, he satisfied the prince with an excellent and Catholic answer.

        He repaired in some part the walls of the City against the incursions of the Lombards. He restored several basilicas fallen through injury of time. He brought back almost deserted monasteries in the City, and the monks, to their former form and discipline. Indeed, after the death of his mother Honesta, he changed his paternal home into a church and monastery, which he left furnished with many estates. He sent Corbinian and Boniface, men full of apostolic spirit, into Germany to preach the Gospel of Christ to the Gentiles, and adorned them with the sacred insignia of the episcopate, after he had learned that an innumerable multitude of pagans had been converted by them to the faith of Christ. That he might fulfil all the parts of a good shepherd, he equipped ecclesiastical discipline and the morals of Christians with excellent laws. He held two synods at Rome, one against illicit marriages, the other against the Iconoclasts.

        He strove by various letters to turn Leo the Isaurian, destroyer of sacred images, away from that heresy, and to win him by every kind of service; yet he, to heap up his crime, tried six times to deliver the best of Pontiffs to death by the sword, and once to corrupt him with gold and gifts, though in vain. When Liutprand, with the exarch, was hastening to the destruction of the City, the most holy Pontiff, trusting in God's protection, met him at the meadows of Nero, and by pious warnings so softened the king's heart that, no longer an enemy but a pious worshipper, he offered his sword and crown to the Prince of the Apostles. And when the emperor was plotting destruction, he struck him with a dire anathema, and, by a treaty entered into with the Franks, deterred him from his impious design. At length, having done glorious things, by which he is likened to the greatest of his predecessors, he piously died in the Lord in the sixth year of his pontificate, and was laid in the Vatican basilica.
      status: draft
