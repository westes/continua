nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Wenceslaus, Duke of Bohemia, was the son of a Christian father, Duke Wratislaus I., and an heathen mother named Drahomira. He had for his grandmother a most holy woman, named Ludmilla, who trained him up in godliness. He was a man eminent in all graces, and one who carefully held his virginity unsullied throughout the whole course of his life. His mother seized the supreme power by the foul murder of Ludmilla, and lived foully with her younger son Boleslaus, and the nobles roused thereby to indignation, and wearied with her tyranny and wicked government, cast off the yoke of both of them, and hailed Wenceslaus in the city of Prague as their King.

        He ruled his kingdom by his virtues rather than by force. To the orphaned, the widowed, and the destitute he was very charitable, so that some whiles in the winter he carried firewood to the needy on his own shoulders. He helped oftentimes to bury the poor, he set captives free, and went many times to the prisons at the dead of night to comfort with money and advice them that were detained therein. To a Prince of so tender an heart it was a great grief to be behoven to condemn any to death, however guilty. For Priests he had a most earnest respect, and with his own hands sowed the corn and pressed the grapes for the bread and wine which they were to use for the Sacrifice. He would walk round the Church by night with bare feet upon the snow and ice, leaving behind him bloody footprints that warmed the ground.

        As his Body-guard he had angels. For when Radislaus, Prince of Gurinna, invaded Bohemia, and Wenceslaus, to save the effusion of his people's blood, went out to meet him in single combat, angels were seen serving him with arms, and heard to say to the adversary: Strike not. Therefore, his enemy was stricken with terror, fell down in reverence before him, and begged his forgiveness. When he went to Germany, the Emperor saw two angels carrying a golden Cross before him as he drew nigh him, and arose from his throne, embraced him in his arms, created him a King, and gifted him with the arm of the holy Martyr Vitus. Nevertheless, his godless brother, at the exhortation of their mother, bade him to a feast, and when Wenceslaus, with a foreboding of the death prepared for him, went afterwards into the Church, and was praying there, together with some accomplices of his crime, despatched him, running him through the body with a lance. The stains of his blood may still be seen upon the walls. By the judgment of God, his unnatural mother was swallowed up by the earth, and his murderers, in diverse ways, perished miserably.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 10:34-42
      text: 'At that time, Jesus said to his disciples: Do not think that I have come to send peace upon earth; I have not come to send peace, but the sword. For I have come to set a man at variance against his father, and the daughter against her mother, and the daughter-in-law against her mother-in-law: and a man''s enemies shall be they of his own household. He that loves father or mother more than Me, is not worthy of Me; and he that loves son or daughter more than Me, is not worthy of Me. And he that does not take up his cross, and follows Me, is not worthy of Me. He that finds his life, shall lose it; and he that shall lose his life for Me, shall find it. He that receives you, receives Me; and he that receives Me, receives Him that sent Me. He that receives a prophet in the name of a prophet, shall receive the reward of a prophet; and he that receives a just man in the name of a just man, shall receive the reward of a just man. And whosoever shall give a cup of cold water to drink to one of these little ones, only in the name of a disciple, amen I say to you, he shall not lose his reward.'
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Hilary of Poitiers, Commentary on Matthew, ch. 10
      text: |-
        What meaneth such division in the earth, by reason of the Lord's coming? Amongst the foremost commandments of the Law we have received this: Honour thy father and thy mother. And the Lord himself said: Peace I leave with you, my peace I give unto you. What meaneth this sword sent upon the earth? Why is father set at variance against son, and daughter against mother, and daughter-in-law against mother-in-law? Why shall a man's foes be they of his own household? From all this it might seem that open sanction is given to the neglect of natural duties—hatred everywhere, warfare everywhere, the sword of the Lord furiously raging between father and son, mother and daughter.

        The sharpest weapon of all weapons is the sword, whereby is enforced the law of might, the severity of judgment, the punishment of sinners. Furthermore, the word Sword is in common use amongst the Prophets as a figure of the preaching of the new Gospel. Ye are to understand, then, that the word of God is often called a sword; and that this sword is sent upon the earth when the preaching of God's word entereth into the hearts of men. For then at once cometh grave dissension in the new man's old home, and thus a man's foes are they of his own household. For he is set at variance against them by the word of God, whereby he joyously abideth in newness of spirit both within and without, that is, in soul and body.

        The Lord continueth in the same strain of exhortation and discernment. For after bidding us leave whatever we hold dearest in the world, he addeth: He that taketh not up his cross, and followeth after me, is not worthy of me; because they that are Christ's have crucified the flesh with the affections and lusts. And hence he is unworthy of Christ who taketh not up his cross, because thereon we suffer, and so thereon we die with the Lord; yea, thereby are we buried with him, and do rise again with him; thereby we follow the Lord to victory, in newness of spirit and in the mystery of faith.
      status: verified
