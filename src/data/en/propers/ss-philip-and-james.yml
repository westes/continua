collect:
  text: |
    Let us pray.
    O God, Who dost every year gladden us by the solemn memorial of thine Apostles Philip and James, grant us grace, we beseech thee, not only to rejoice because of their worthy deeds, but also to tread in their footsteps.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. I am the Way the Truth, and the Life: no man cometh unto the Father, but by Me. Alleluia.
    V. They have declared the works of God:
    R. And have wisely considered of his doings.
    Let us pray.
    O God, Who dost every year gladden us by the solemn memorial of thine Apostles Philip and James, grant us grace, we beseech thee, not only to rejoice because of their worthy deeds, but also to tread in their footsteps.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

lauds-capitulum:
  text: Then shall the just stand with great constancy against those that have afflicted them, and taken away their labours.
  citation: Wis 5:1
  status: verified

lauds-hymn:
  text: |
    In this our bright and Paschal day
    The sun shines out with purer ray,
    When Christ, to earthly sight made plain,
    The glad Apostles see again.

    The wounds, the riven wounds He shows
    In that His flesh with light that glows,
    In loud accord both far and nigh
    The Lord's arising testify.

    O Christ, the King Who lovest to bless,
    Do Thou our hearts and souls possess;
    To Thee our praise that we may pay,
    To Whom our praise is due for aye.

    We pray Thee, King with glory decked,
    In this our Paschal joy, protect
    From all that death would fain effect
    Thy ransomed flock, Thine own elect.

    To Thee Who, dead, again dost live,
    All glory, Lord, Thy people give;
    All glory, as is ever meet,
    To Father and to Paraclete. Amen.
  status: verified

