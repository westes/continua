nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Leo the Great, Sermon 1 on Ss. Peter and Paul
      text: |-
        When the twelve holy Apostles had received from the Holy Ghost the power to speak all languages, they divided the whole world into districts, which they severally allotted to themselves as fields for their Gospel labours. Then was Peter, the Prince of the Apostles, sent to the capital city of the Roman Empire, that he might cause the light to shine thence throughout the whole body of the civilized nations. At that time what nation was there that had no representative in Rome? When Rome had learnt, what people that did not learn too?

        In Rome were the dreams of an unbelieving philosophy to be destroyed, in Rome were the empty utterances of earthly wisdom to be confuted, in Rome was idolatry to be overcome, in Rome profanity to be put down, even in Rome, where the activity of superstition had gathered together from the whole earth every error which it could find. O most blessed Apostle Peter! this was the city to which thou didst not shrink to come. The Apostle Paul, thy comrade in glory, was yet occupied in founding the Churches, and thou didst enter alone into that forest of wild beasts roaring furiously; thou didst commit thyself to that stormy ocean, more boldly than when thou walkest upon the waters to come to Jesus.

        Thou hadst already taught them of the circumcision who were converted; thou hadst founded the Church of Antioch, the first that bore the noble name of Christian; thou hadst published the law of the Gospel throughout Pontus, Galatia, Cappadocia, Asia, and Bithynia; and thou didst not fear for the hardness of thy work, nor turn back because of thine old age, but didst boldly set up the trophy of the cross of Christ upon those Roman walls, where the Providence of God had appointed the throne of thine honour, and the glorious scene of thy passion.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 16:13-19
      source: St. Hilary of Poitiers, Bishop, Commentary on Matthew 16
      text: |-
        At that time, Jesus came into the quarters of Cesarea Philippi: and he asked his disciples, saying: Whom do men say that the Son of man is? And so on.

        The Lord asketh His disciples who men say that He is, and He addeth, He, the Son of Man. Let us ever remember to hold fast this truth of our profession, namely, that the Son of God is the Son of Man also. Were He one and not the other, then were He no Saviour for us. The Lord then, having heard the various opinions of men, asketh, But Who say ye that I am? And Simon Peter answered and said Thou art the Christ, the Son of the living God. Peter had weighed the questions. The Lord had asked, Who do men say that I, the Son of Man, am? That He was Son of Man was sufficiently evident to all who looked upon His Body. But when He spake of His whole Self, and asked, Who do ye say that I am? He showed that the mind had something to grasp beyond That Which was seen, for Son of Man He was manifestly. What judgment did He wish them to give? I think it was not that which He had owned concerning Himself. That something more, which He wished them to own, was a hidden thing, whereunto the faith of them that believed in Him was to reach.

        Peter's confession was followed by a proper reward for having seen the Son of God in the Son of Man. Blessed is this holy Apostle, in whose praise it is said that he saw with more than human eyes That Which was unseen, who gazed upon Flesh and Blood, and by the secret revelation of the Heavenly Father recognised the Eternal Son of God; who was the first thought worthy to acknowledge the Divinity of Christ. God bless thee, O Peter, thou who by uttering for the first time the title of Divine honour, didst lay the goodly foundation of the Church! God bless thee, thou worthy rock whereon she is built, for ever triumphant over the infernal powers, the gates of hell, and the bands of death! God bless thee, happy door-keeper of heaven, to whose keeping are given the keys of the everlasting mansions, whose sentences on earth are already confirmed in heaven.
      status: verified
