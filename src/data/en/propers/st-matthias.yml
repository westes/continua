nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 11:25-30
      text: At that time, Jesus answered and said, "I praise Thee, Father, Lord of heaven and earth, that Thou hast hid these things from the wise and prudent, and hast revealed them to little ones. Yes, Father, for so it hath seemed good in Thy sight. All things are delivered to Me by My Father. And no one knoweth the Son but the Father; neither doth anyone know the Father but the Son, and he to whom it shall please the Son to reveal Him. Come to Me, all you that labour and are burdened, and I will refresh you. Take up My yoke upon you, and learn of Me, because I am meek and humble of heart, and you shall find rest to your souls. For My yoke is sweet, and My burden light."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Sermon 10 on the Words of the Lord (on Matt 11:25-30)
      text: |-
        Come unto Me, all ye that labour! And wherefore labour we all, but because we are frail, sickly, dying creatures, burdened with earthen vessels which distress us? But if these fleshly vessels be distressful, let the open expanse of love be free and wide. Come unto Me, all ye that labour! and why? That we may labour no more. His promise is an instant promise, for He calleth such as are labouring. Perchance they will ask Him what shall be their reward? And I, saith He, will give you rest. Take My yoke upon you, and learn of me, not how to make the world, not how to create all things visible and invisible, not to work wonders in the earth, nor to raise the dead, but for I am meek and lowly in heart.

        Wilt thou be great? Begin by being little. Dost thou think to raise up a lofty building? Then lay the foundations thereof in lowliness. The greater soever, and the more massy, be that which any man thinketh to build, so much the deeper doth he dig his foundation. And when the house is built, it towereth heavenward; but he which layeth the foundation goeth down into the earth. The building, therefore, is low before it is high, and, after it is low, it riseth high to the roof.

        What is the roof of the house on which we labour? Whither do its spires rise? I answer you at once; to the presence of God. You see how high it is, yea, what it is to see God. He that will, understandeth what I say, and he heareth. What is promised you is to see God, God, the True, God, the Supreme. Blessed is he who seeth Him by Whom he is seen. Such as worship false gods see them easily, but they see them who have eyes and see not. But unto us it is promised that we shall see that God Who liveth and seeth.
      status: verified
