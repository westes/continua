collect:
  text: |
    Let us pray.
    Grant, we beseech thee, almighty God, that we, who celebrate the solemn feast of thy holy
    Martyrs Gordian and Epimachus, may be helped by their intercession with thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of
    the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Even the very hairs of your head are all numbered: * fear not therefore; ye are of more value than many sparrows.
    V. The saints shall rejoice in glory:
    R. They shall be joyful in their beds.
    Let us pray.
    Grant, we beseech thee, almighty God, that we, who celebrate the solemn feast of thy holy Martyrs Gordian and Epimachus, may be helped by their intercession with thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Gordian was a judge before whom, in the reign of Julian the Apostate, Januarius the Priest was brought to be condemned. Januarius instructed Gordian in the Christian faith, and himself, with his wife, and fifty-three other persons of the same household, were all baptized at Rome. On this account the Praetor sent back Januarius, and ordered Clementian the Deputy to cast Gordian into prison. Afterward he caused the same Gordian to be brought before him in chains, and when he found he could not shake him in his will to cleave to the faith, he commanded that he should first be scourged with whips loaded with lead, and thereafter beheaded. His body was thrown out before the temple of Apollo for dogs to eat, but the Christians buried it at night in the catacombs upon the Latin Way, in the same vault where were already lying the remains of the blessed Martyr Epimachus. These had been brought from Alexandria, in which city Epimachus had long been imprisoned for owning Christ, and had in the end grasped the crown of his testimony by being burnt alive.
      status: verified
