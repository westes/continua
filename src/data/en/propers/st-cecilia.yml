collect:
  text: |
    Let us pray.
    O God, Who year by year dost gladden thy people by the solemn feast of thy blessed Virgin and Martyr Cecilia, grant unto us, we beseech thee, not only devoutly to observe the same, but also to follow after the pattern of her godly conversation.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. As dawn was fading * into day, Cecilia cried and said: Arise, O soldiers of Christ, cast away the works of darkness, and put on the armour of light.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, Who year by year dost gladden thy people by the solemn feast of thy blessed Virgin and Martyr Cecilia, grant unto us, we beseech thee, not only devoutly to observe the same, but also to follow after the pattern of her godly conversation.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

prime-antiphon:
  text: 'The musicians played, and Cecilia sang unto the Lord, * saying: Let my heart be undefiled, that I be not ashamed.'
  status: verified

terce-antiphon:
  text: Valerian found Cecilia praying in her chamber, * and with her the Angel.
  status: verified

sext-antiphon:
  text: Busy like a bee, * O Lord, did thine handmaiden Cecilia serve thee.
  status: verified

none-antiphon:
  text: I have asked the Lord for three days, * that I may consecrate my house as a Church.
  status: verified

benedictus-antiphon:
  text: 'As dawn was fading * into day, Cecilia cried and said: Arise, O soldiers of Christ, cast away the works of darkness, and put on the armour of light.'
  status: verified

magnificat-antiphon:
  text: The glorious maiden * carried the Gospel of Christ always in her breast, and meditated therein day and night talking with God and praying.
  status: verified

magnificat-antiphon/~-first:
  text: Valerian! there is a secret * which I wish to tell thee. I have an Angel of God for a lover, and he is very jealous to keep my body.
  status: verified

