    - nocturn: 2
      isGospel: false
      source: Life of St. Mary of Egypt, ascribed to Sophronius of Jerusalem, tr. Paul the Deacon (PL 73, 671-690), excerpts
      text: |-
        I had Egypt for my country, father; and while my parents were still living, when I was in my twelfth year, scorning their affection, I came to Alexandria; and how I first violated my virginity, and how unceasingly and insatiably I lay in bondage to the vice of lust, I blush to consider. For it is not short to tell; but this I shall say quickly, that you may know the insatiable burning of my vice, which I had as a love of lust. For seventeen years and more, forgive me, I spent publicly among the people, lying in the fire of lust. It was not for any man's gift that I lost my virginity; for I accepted nothing from any who wished to give; for in the frenzy of my passion I considered this, that I might cause more to run to me freely, fulfilling the desire of my lust and wickedness. And do not suppose that I took nothing out of love of riches; for I lived by begging, or often by spinning flax. For I had, as I said, an insatiable desire, so that I wallowed unceasingly in the dunghill of lust. And this was pleasing to me, and this I reckoned life, if I should unceasingly do injury to nature. While I was leading this life, I saw on a certain feast-day a multitude of Libyans and Egyptians running together as if to the sea. I found someone, and asked: Where are these men hurrying, who run? He said to me: They are all going up to Jerusalem for the exaltation of the holy cross, which is celebrated in a few days as usual. I too said to him: Do you think they will take me, if I wish to go with them? And he said: If you have the fare, no one will forbid you. I said to him: Truly, brother, I have neither fare nor provisions. But I will go and board one of the ships they have hired. And though they refuse, I will give myself; for having my body in their power, they will take it for the fare. For this reason I wished to go with them (forgive me, my abba), that I might have many partners in my passion of lust.

        When the feast of the exaltation of the precious holy cross came, I, as before, went about ahead, ensnaring and capturing the souls of the young. At first dawn I saw all running together to the church with one accord. I too went, running with those who ran, and came with them into the court of the temple; and when the hour of the exaltation of the divine cross had come, I pushed and was pushed, and was driven back in a manner, hastening to enter with the people, forced as far as the door of the temple with those who were going in, drawing near, wretched as I was, with great toil and distress: but when I wished to enter, they all entered without hindrance, while some divine power kept me from it, not allowing me entrance. At once, therefore, repulsed, I was cast outside; and being cast out, I found myself standing alone in the court. Thinking that this befell me through the weakness of a woman, I mingled again with others, and did myself a sort of violence to enter, but I laboured in vain. For as soon as I touched the threshold with my foot, all were received within, having no hindrance, but me alone it did not receive; but as if a military multitude had been stationed to shut the entrance against me as I came in, so some sudden power kept me back, and again I found myself in the court. Having suffered this three and four times, and trying, and getting nowhere, despairing of the rest, and unable to go any further (for my body had indeed been greatly bruised by the force of those pressing), I withdrew and went away, and stood in a certain corner of the court of the temple; and scarcely at last did I bring to mind why I was forbidden to see the life-giving wood. For the understanding of salvation touched my mind and the eyes of my heart, reflecting that the squalid crimes of my deeds shut against me the way of entering. And so I began, weeping greatly, to be troubled and to beat my breast, and drawing sighs from the depth of my heart, and groaning and wailing, I looked up in the place where I stood and saw above me an image of the holy Mother of God standing, and I said, looking at her and gazing steadfastly: Lady Virgin, who didst bear God according to the flesh, I know that it is neither fitting nor seemly that I, so foul, should adore thy image or gaze upon it with eyes polluted by such filth, thou who art known to be virgin and chaste, who hast body and soul immaculate: it is just that I, a lustful woman, should be abhorred and cast out from the cleanness of thy most pure chastity. Yet since, as I have heard, God became man, whom thou, worthy, didst bear, for this reason, that he might call sinners to repentance, help me, alone and having no helper, receive my confession, and grant me leave to enter the opened door of the church, and let me not be made a stranger to the sight of the most precious wood, on which God made man was fixed, whom thou, the Virgin, didst conceive and bear, and gave his own blood for my deliverance. Command, O Lady, that the door be opened also to me, unworthy, for the veneration of the divine cross, and I give thee, born of thee, Christ, as a most worthy surety, that I will never again defile my flesh by the horrid sport of unions; but as soon as I shall see the wood of thy Son, holy Virgin, I renounce the world and its works, and all that is in it, and straightway go forth wherever thou, as surety, shalt lead me. Saying this, and as if receiving some satisfaction, kindled with the heat of faith, and presuming on the tender mercies of the Mother of God, I moved from that same place in which I had stood to pray; and coming, I mingled again with those going in, and there was no one any longer to drive me back, or to forbid me to approach the doors by which they entered the temple. A great trembling then took me, and an ecstasy, and wholly trembling I was disturbed. And so, joining myself to the door, the entrance of which was first closed to me (as if the whole power which before forbade me to enter now prepared the way for entering), I entered without any labour of hindrance, and so was found within the holy of holies, and was made worthy to adore the mystery of the precious and life-giving wood of the cross.

        With these words in his prayer he came to the place which had been marked out like a torrent-bed, and at its upper end he saw the sun shining, and looking, he saw the dead body of the saint lying there, with the hands folded as is fitting, and the body lying looking to the East. Running to her, he washed the feet of the most blessed one with his tears, for he dared touch no other member of her body. And weeping for some time, and saying psalms fitting to the time and the matter, he made the prayer of burial, and said to himself: Perhaps this does not please the saint. While he was thinking this, writing had been marked out on the ground, where this was read: Bury, abba Zosimas, the little body of wretched Mary. Give back to the earth what is its own, and add dust to dust. Pray for me, however, to the Lord, who passed away in the month of Pharmuthi according to the Egyptians, which is April according to the Romans, on the ninth day, that is the fifth day before the Ides of April, on the night of the saving Passion, after the communion of the divine and sacred Supper. When the old man had read this writing, he at first wondered who it was who had written it; for she, as she had said herself, was ignorant of letters. Yet in this he rejoiced greatly, because he had learned her holy name. He knew, therefore, that as soon as she had shared in the divine mysteries at the Jordan, in that same hour she had come to that place where she at once passed from this world, and the same journey which Zosimas, walking twenty days, scarcely accomplished with labour, Mary completed in the course of one hour, and at once departed to the Lord. Then Zosimas, glorifying the Lord and bathing her body with his tears, said: It is time, wretched Zosimas, to finish what is thine. But what shall I do, unhappy man, for I have nothing to dig with? There is no mattock, no rake, and I have nothing at all in my hands. As he said these things in his heart, he saw a small piece of wood lying there; taking it, he began to dig. But the ground was very hard and exceedingly firm, and he could by no means dig, because he was both worn out with fasting and utterly exhausted by the toil of the long journey. For he laboured, and was pressed with many sighs, and bathed in sweat, he groaned heavily from the very depth of his heart. And looking up, he saw a lion of huge size standing by the body of the saint and licking her feet. Seeing it, he trembled with fear of that very great beast, especially since he had heard that holy woman say that she had never seen any wild beast. But he strengthened himself with the sign of the cross, believing that the power of her who lay there could keep him unharmed. And the lion began to nod to the old man, greeting him with gentle gestures. Zosimas said to the lion: Since thou hast come sent by God, chiefest of beasts, that the body of this handmaid of God may be committed to the earth, fulfil the work of thy office, that her little body may be buried. For I, worn out with age, am not able to dig, nor have I anything fit for this work; and again I am not able to hasten, for the length of so great a journey, to bring it. Do thou this work by divine command with thy claws, that we may commit this holy little body to the earth. Immediately, then, at the old man's word, the lion made a pit with its forelegs, large enough to suffice for the burial of the holy body. And the old man, washing her feet with his tears, and pouring out prayer in many ways, praying for all, begging her then and still more to pray for him, covered the naked body with earth, the lion standing by, just as he had first found her, and having nothing else but that torn garment which Zosimas had cast to her before, with which Mary covered some members of her body. Then they departed together; and the lion went away into the inner parts of the wilderness like a gentle sheep; and Zosimas returned, blessing and praising God, and singing a hymn of praise to Christ our Lord.
      status: draft
    - nocturn: 3
      isGospel: true
      text: At that time, the publicans and sinners were drawing near to Him to listen to Him. And the Pharisees and the Scribes murmured, saying, This man welcomes sinners and eats with them. But He spoke to them this parable, saying, What man of you having a hundred sheep, and losing one of them, does not leave the ninety-nine in the desert, and go after that which is lost, until he finds it? And when he has found it, he lays it upon his shoulders rejoicing. And on coming home he calls together his friends and neighbors, saying to them, 'Rejoice with me, because I have found my sheep that was lost.' I say to you that, even so, there will be joy in heaven over one sinner who repents, more then over ninety-nine just who have no need of repentance. Or what woman, having ten drachmas, if she loses one drachma, does not light a lamp and sweep the house and search carefully until she finds it? And when she has found it, she calls together her friends and neighbors, saying, 'Rejoice with me, for I have found the drachma that I had lost.' Even so, I say to you, there will be joy among the angels of God over one sinner who repents.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 34 on the Gospels
      text: Ye have heard, my brethren, from the Gospel which hath but now been read, how that the publicans and sinners drew near unto our Redeemer, and how that He received them, not only to converse, but also to eat with Him. And when the Pharisees and Scribes saw it, they murmured. From this learn ye, that true righteousness is merciful, and false righteousness is contemptuous, albeit that the righteous also oft-times feel moved with just indignation at sinners. But it is one thing to feel thus indignant through pride, and another to feel so through love of law. The righteous indeed look down upon sinners, and yet, as not despising them; they abandon them, and yet, as not without hope; they fight against them, and yet, as loving them all the while; for if they be behoven to chasten them grievously as touching the outer man, yet is it through charity which offereth sweetness to their inner man. In their hearts they prefer before themselves them whom they are correcting; they hold as better than themselves them whom they judge. And thus doing, they watch by carefulness over them, which are committed unto their charge, and, by lowly-mindedness, over themselves. On the other hand, they whose exaltation cometh of a false righteousness, look down upon their neighbour, but are softened by no mercy toward his misery, and are all the more sinful, because they perceive not that they themselves are sinners. Of such were those Pharisees who judged the Lord because He received sinners, and, in the dryness of their own heart, rebuked the very Fountain of mercy. They were sick of so desperate a sickness that they knew not of themselves that they were sick; but, that they might know that they were so, the Heavenly Physician applied to them His tender ointments, and, by means of a gracious parable, lanced the boil of their pride of heart.
      status: verified
