nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Fulgentius of Ruspe, Sermon 3 on St. Stephen
      text: |-
        Yesterday we were celebrating the birth in time of our Eternal King; today we celebrate the victory, through suffering, of one of His soldiers. Yesterday our King was pleased to come forth from His royal palace of the Virgin's womb, clothed in a robe of flesh, to visit the world; today His soldier, laying aside the tabernacle of the body, entereth in triumph into the heavenly palaces. The One, preserving unchanged that glory of the Godhead which He had before the world was, girded Himself with the form of a servant, and entered the arena of this world to fight sin; the other taketh off the garments of this corruptible body, and entereth into the heavenly mansions, where he will reign for ever. The One cometh down, veiled in flesh; the other goeth up, clothed in a robe of glory, red with blood.

        The One cometh down amid the jubilation of angels; the other goeth up amid the stoning of the Jews. Yesterday the holy angels were singing, Glory to God in the highest; today there is joy among them, for they receive Stephen into their company. Yesterday the Lord came forth from the Virgin's womb; today His soldier is delivered from the prison of the body. Yesterday Christ was for our sakes wrapped in swaddling bands; today He girdeth Stephen with a robe of immortality. Yesterday the new-born Christ lay in a narrow manger; today Stephen entereth victorious into the boundless heavens. The Lord came down alone that He might raise many up; our King humbled Himself that He might set His soldiers in high places.

        Why brethren, it behoveth us to consider with what arms Stephen was able, amid all the cruelty of the Jews, to remain more than conqueror, and worthily to attain to so blessed a triumph. Stephen, in that struggle which brought him to the crown whereof his name is a prophecy, had for armour the love of God and man, and by it he remained victorious on all hands. The love of God strengthened him against the cruelty of the Jews; and the love of his neighbour made him pray even for his murderers. Through love he rebuked the wandering, that they might be corrected; through love he prayed for them that stoned him, that they might not be punished. By the might of his love he overcame Saul his cruel persecutor; and earned for a comrade in heaven, the very man who had done him to death upon earth.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 23:34-39
      text: 'At that time, Jesus said to the scribes and Pharisees, "Behold, I send to you prophets, and wise men, and scribes: and some of them you will put to death and crucify, and some you will scourge in your synagogues, and persecute from city to city, that upon you may come all the just blood that hath been shed upon the earth, from the blood of Abel the just, even unto the blood of Zacharias the son of Barachias, whom you killed between the temple and the altar. Amen I say to you, all these things shall come upon this generation. Jerusalem, Jerusalem, thou that killest the prophets, and stonest them that are sent unto thee, how often would I have gathered together thy children, as the hen doth gather her chickens under her wings, and thou wouldest not? Behold, your house shall be left to you, desolate. For I say to you, you shall not see Me henceforth till you say, ''Blessed is He that cometh in the name of the Lord.''"'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Commentary on Matthew, Book IV, on Matt 23:34-39
      text: |-
        We have already remarked that the Lord's words, Fill ye up the measure of your fathers, refer in the first place to Himself, Whom the Jews afterwards put to death. In a secondary sense it may likewise be applied to His disciples, of whom He saith, Behold, I send unto you Prophets, and wise men, and Scribes. Here observe that, according to the Apostle writing to the Corinthians, there are diversities of gifts among Christ's followers. Some are Prophets of that which is to come; some are wise men, who know the due season for rebuke and exhortation; some are Scribes learned in the law. And of these they stoned Stephen, slew Paul with the sword, crucified Peter, and scourged the Disciples mentioned in the Acts of the Apostles.

        It is a subject of dispute among commentators who is meant by Zacharias the son of Barachias. We read of several persons of the name of Zacharias. But here, in order to prevent any mistake, it is particularly said, Whom ye slew between the temple and the altar. I have read various opinions in various places upon this question, and I will give each. First, some hold that Zacharias the son of Barachias is the eleventh of the twelve Minor Prophets; and this opinion is supported by the father's name. But the Bible nowhere telleth us that this Prophet was slain between the temple and the altar; and it is hardly possible that he can have been, for in his time it could scarcely be said that even the ruins of the temple were in existence. Secondly, others maintain that this Zacharias was Zacharias, the father of John the Baptist. This interpretation is derived from the dreams of the Apocryphal Gospels, wherein it is asserted that he was martyred for preaching Christ's coming.

        A third school will have it that this Zacharias, the son of Barachias, was that Zacharias of whom we read, in Chron. xxiv. 22, that he was slain by Joash, king of Judah, between the temple and the altar. Against this it is to be remarked, that that Zacharias was not the son of Barachias, but of Jehoiada the priest; whence it is written, Joash remembered not the kindness which Jehoiada his father had done to him. The question therefore ariseth, if this opinion be true, why, the name and manner of death both agreeing with this explanation, Zacharias is called the son, not of Jehoiada, but of Barachias. In Hebrew, Barachias signifieth the Blessed of the Lord, and Jehoiada proves his Righteousness. In the Gospel used by the Nazarenes the name of Jehoiada is used instead of Barachias.
      status: verified

octave-readings/~-octave-day-8:
  source: Sermon of St. Augustine, Bishop; Homily of St. Jerome, Priest
  text: |
    Even after the glory of yesterday, bright with the splendour of Christ our Saviour's Birth, this day findeth itself an illumination of its own from the crown of the blessed Martyr Stephen. The whole earth knoweth how manfully he fought and conquered, for he suffered at the very fountain-head of the Church, that is to say, in Jerusalem. It was in the Church there that he ministered as a Deacon, and in the youthful springtime of life dyed with his blood the lily of his purity. His Passion is very glorious, and in many ways wonderful, and when we read it in the Acts of the Apostles, we seem rather to see than to hear.

    Christ, the Captain of the Martyrs, hath first suffered for us, leaving us an example that we should follow His steps. And truly, blessed Stephen followed them, when, having confessed Christ, he was stoned to death by the Jews, and obtained the crown which his name had foreshown. For the meaning of the Greek name Stephanos is a crown. Already he had a crown for his name, a foreshadowing of the martyr's palm which he beareth in heaven.

    When they stoned him, he did not rejoice at the thought that God would take vengeance on his persecutors. On the contrary, he prayed that they might be forgiven. For he remembered the word of the Lord, that saith: "Vengeance belongeth unto Me, I will recompense, saith the Lord," and again: "Say not thou, I will recompense evil to mine enemies; but wait on the Lord, and He shall save thee." The Lord God biddeth us also be patient, knowing that in the great day of retribution, we, as well as His holy martyrs, shall be righted.

    O Jerusalem, Jerusalem, thou that killest the Prophets. The Jerusalem that killed the Prophets was not the material stone and houses, but they that dwelt therein. He wept over her with a father's love, as also it is written in another place that, when He saw the city, He wept over it. "How often would I have gathered thy children together": here observe that Christ avoweth that He had been the Sender of all the former Prophets. Even as an hen gathereth her chickens under her wings — a similar figure is found in the Song of Moses in Deuteronomy: "As an eagle stirreth up her nest, fluttereth over her young, spreadeth abroad her wings, taketh them, and beareth them on her wings."

    "Behold, your house is left unto you desolate." God had already spoken these things once before, by the mouth of Jeremiah, where He saith: "I have forsaken Mine house, I have left Mine heritage; Mine inheritance is become unto Me like an hyaena's den." The house of the Jews, which was to be left unto them desolate — that is, that Temple, whose splendour they loved only too well — they lost when they slew the Owner of it for the sake of it, saying of Christ: "This is the heir; come, let us kill Him, and the inheritance shall be ours."

    "I say unto you, Ye shall not see Me henceforth, till ye shall say: Blessed is He that cometh in the name of the Lord." Here He speaketh to Jerusalem and to the Jewish people. The words, "Blessed is He That cometh in the name of the Lord," were indeed spoken by babes and sucklings when the Saviour entered Jerusalem in triumph, and they that went before and they that followed cried, saying, "Blessed is He That cometh in the name of the Lord; Hosanna in the highest" — but they are originally taken from Psalm 117, which is all evidently written in honour of the coming of our Lord.
  responsory: |
    R. And Stephen, full of grace and power * Did great wonders and miracles among the people. V. There arose certain of the synagogue, disputing with Stephen; and they were not able to resist the wisdom, and the Spirit which spoke. R. Did great wonders and miracles among the people.
  status: verified
