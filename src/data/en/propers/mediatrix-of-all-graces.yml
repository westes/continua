  status: draft

matins-hymn:
  text: |
    Christ, having pity on the human race,
    struck down as we were by a death we had deserved,
    begot us again unto the life on high,
    and cleansed us with his own blood.

    O holy stream, that purgest away all sin!
    O inexhaustible ocean of good things,
    whence, from a sevenfold fountain,
    life and salvation flow without end!

    But who shall dispense these sacred waters
    to the redeemed? This office is given to Mary,
    that she, as their arbiter, may govern
    the course of the divine wave.

    All the gifts that the Redeemer merited for us
    Mary, the Mother, distributes;
    at her wish her Son freely pours out
    his own bounty.

    Through eternal years let us venerate thee,
    O Trinity, to be celebrated with highest praise:
    let our minds praise thee with faith,
    and our tongues with resounding song.
    Amen.
  status: draft

matins-invitatory:
  text: 'Christ the Redeemer, who willed that we should have all good things through Mary: * Come, let us adore.'
  status: draft

lauds-capitulum:
  text: 'All you that thirst, come to the waters: and you that have no money make haste, buy, and eat: come ye, buy wine and milk without money, and without any price.'
  citation: Isaiah 55:1
  status: verified

lauds-hymn:
  text: |
    O Mary, who lovingly receivest
    the prayers of mortals,
    behold, we suppliants beseech thee:
    be ever present to us.

    Be present, if the dreadful chain of sins
    binds us; swiftly loose the fetters
    that bind our hearts with guilt.

    Help us, if the deceitful image of the world
    allures us, lest the mind, forgetful of heaven,
    forsake the path of salvation.

    And to thy children be a protection
    at the hour of death, that by thy help
    they may be granted to obtain the everlasting reward.

    * All honour, laud, and glory be,
    O Jesu, Virgin-Born, to thee;
    Whom with the Father we adore,
    And Holy Ghost, for evermore.
    Amen.
  status: draft

lauds-versicle:
  text: |
    V. Pray for us, O our most powerful Mediatrix.
    R. That we may be made worthy of the promises of Christ.
  status: draft

prime-lectio:
  text: 'Behold thou shalt call a nation, which thou knewest not: and the nations that knew not thee shall run to thee, because of the Lord thy God, and for the Holy One of Israel, for he hath glorified thee.'
  citation: Isaiah 55:5
  status: verified

terce-capitulum:
  text: |
    All you that thirst, come to the waters: and you that have no money make haste, buy, and eat: come ye, buy wine and milk without money, and without any price.
    R. Thanks be to God.
    V. Despise not our petitions.
    R. In our necessities.
  citation: Isaiah 55:1
  status: verified

sext-capitulum:
  text: |
    Hearken diligently to me, and eat that which is good, and your soul shall be delighted in fatness. Incline your ear and come to me: hear and your soul shall live.
    R. Thanks be to God.
    V. From all dangers deliver us ever.
    R. O glorious and blessed Virgin.
  citation: Isaiah 55:2-3
  status: verified

