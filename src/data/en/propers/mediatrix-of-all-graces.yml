nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ephrem the Syrian, Deacon, Prayer to the Mother of God
      text: My Lady, most holy Mother of God and full of grace, inexhaustible ocean of divine and hidden largesses and gifts, dispenser of all good things, Lady of all after the Trinity, another Consoler after the Paraclete, and after the Mediator Mediatrix of the whole world, behold my faith and my desire, divinely given. Despise not the unworthy one, and let not the foulness of my deeds interrupt thy immense mercy, Mother of God, my most desirable name; for there is no firmer trophy than thy help. For thou hast taken away all tears from the face of the earth; thou hast filled creation with every kind of benefit, hast brought joy to the heavenly beings, hast saved the things of earth. Through thee we hold the most certain pledge of our resurrection; through thee we hope to obtain the heavenly kingdom; through thee all glory, honour and holiness, from the first Adam himself even to the consummation of the world, has been derived, is derived and shall be derived to the Apostles, the Prophets, the just and the humble of heart, thou alone being immaculate; and in thee, full of grace, every creature rejoices.
      responsory: |
        R. Behold, my lord hath delivered all things to me, * And there is nothing which is not in my power, or which he hath not delivered to me.
        V. He that is mighty hath done great things to me, and holy is his name.
        R. And there is nothing which is not in my power, or which he hath not delivered to me.
      status: draft
    - nocturn: 2
      isGospel: false
      source: St. Germanus, Bishop of Constantinople, Sermon (Oratio 9)
      text: 'We who are poor in divine works and in virtues, while through thee, O Mary, we behold the riches of kindness shown to us, let us say with fervour: The earth is full of the mercy of the Lord. We, exiled from God by the multitude of our sins, have through thee sought God and found him, and having found him have been made safe. Mighty therefore to bring salvation is thy help, O Mother of God, and such that it needs no other mediator with God. For plainly there is no end to thy magnificence; thy succour is insatiable. There is no number to thy gifts. For no one, save through thee, O most holy, obtains salvation. No one, save through thee, O most immaculate, is delivered from evils. No one, save through thee, O most chaste, is granted pardon. No one, save through thee, O most honoured, is granted by mercy the gift of grace. Wherefore, who will not proclaim thee blessed? Thee, I say, glorious, thee worthy to be called blessed, who hast received from thy very Son and God great and wonderful things; wherefore all generations praise thee.'
      responsory: |
        R. Set over all, she governeth the house committed to her, and all things that are delivered to her. * Without her command no man shall move hand or foot in all the land.
        V. The Lord gave her the blessing of all nations, and confirmed his covenant upon her head.
        R. Without her command no man shall move hand or foot in all the land.
      status: draft
    - nocturn: 2
      isGospel: false
      source: St. Bernard, Abbot, Sermon on the Nativity of the Blessed Virgin Mary, n. 6
      text: 'Behold, O man, the counsel of God; acknowledge the counsel of wisdom, the counsel of piety. About to water the threshing-floor with heavenly dew, he first poured the whole fleece; about to redeem the human race, he laid out the entire price in Mary. To what end? Perhaps that Eve might be excused through her daughter, and the man''s complaint against the woman be henceforth quieted. Say no more, O Adam: The woman whom thou gavest me gave me of the forbidden tree; say rather: The woman whom thou gavest me fed me with the blessed fruit. A most pious counsel indeed; but perhaps there is another hidden, and this is not the whole. Look more deeply, therefore, with what devotion of heart he would have her honoured by us, who placed the fullness of all good in Mary; so that, accordingly, if there is any hope in us, any grace, any salvation, we may know that it overflows from her. With the whole marrow of our hearts, then, with all the affections of our breast and with all our vows, let us venerate this Mary: for such is the will of him who willed that we should have all through Mary. This, I say, is his will, but it is for our sake.'
      responsory: |
        R. Praise the Lord our God, who hath not forsaken them that hope in him: * And by me his handmaid hath he fulfilled his mercy, which he promised to the house of Israel.
        V. God hath exalted me, that I might save many peoples.
        R. And by me his handmaid hath he fulfilled his mercy, which he promised to the house of Israel.
      status: draft
    - nocturn: 3
      isGospel: true
      citation: John 19:25-27
      text: At that time, there were standing by the Cross of Jesus His Mother and His Mother's sister, Mary of Cleophas, and Mary Magdalene. When Jesus, therefore, saw His Mother and the disciple standing by, whom He loved, He said to His Mother, Woman, behold your son. Then He said to the disciple, Behold your Mother. And from that hour the disciple took her into his home.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Bernardine of Siena, Lenten sermons on Christian religion, Sermon 51 on the Passion of the Lord, part 2, art. 1, ch. 3
      text: 'The minds of all who read or hear are struck with wonder, namely, by what motion, what sense, what possibility, what true authority these things are said: that the disciple passes over into the son of the Virgin, and that the Virgin has as her son a mere man whom she did not bear: just as it is not to be thought that he should be the son of a Virgin who had been born of corrupt parents from seed. These things indeed seem impossible, but nothing is impossible with God. Piety and prayer are needed to enter upon such a mystery. For the blessed Virgin is called Woman by Christ, whom he never addressed by the word mother. Woman, and not woman: but a woman surpassing angels, and men, and women. She received from the Son, whom with the eternal Father she possessed as the only one, a son apart from the womb, whom she before had in the flesh as her nephew.'
      responsory: |
        R. Mary is made a refuge to the poor, * A helper in due time, in tribulation.
        V. A powerful Virgin, like the tower of David: a thousand bucklers hang upon it, all the armour of valiant men.
        R. A helper in due time, in tribulation.
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Bernardine of Siena, Lenten sermons on Christian religion, Sermon 51 on the Passion of the Lord, part 2, art. 1, ch. 3
      text: 'But in what kind of sonship was John made the son of the Virgin, or she his mother? Nature does not favour this; conception does not, nor birth follow, nor entrance into the womb to be born anew, nor adoption for obtaining an inheritance in temporal things, nor imitation, nor delivered teaching. Nor were these things to be explained by the word of Christ, nor was the saying made so as to be an "as if", but thus we read it said by Christ: Woman, behold thy son; so that, all superfluity of words excluded, we may penetrate the secret of the mystery. Mystically, therefore, we understand in John all the souls of the elect, of whom the blessed Virgin was made mother through love: for "son" in Greek is a name of love. For all the love of Christ passes into love of the Virgin, so that he is deservedly called son, that is, love of the Virgin, and has the Virgin more as mother than her who, having received seed, bore him, condemned by sin, to the world.'
      responsory: |
        R. Let us go with confidence to the throne of grace, * That we may obtain mercy, and find grace in seasonable aid.
        V. To thee, O Virgin, we sigh, mourning and weeping in this vale of tears.
        R. That we may obtain mercy, and find grace in seasonable aid.
      status: draft
    - nocturn: 3
      isGospel: false
      source: St. Bernardine of Siena, Lenten sermons on Christian religion, Sermon 51 on the Passion of the Lord, part 2, art. 1, ch. 3
      text: 'This motherhood and sonship is transferred by the authority of the words of Christ hanging on the cross. Therefore nature passes into grace, and grace surely ennobles nature; not that the one is changed into the other, but because nature is perfected by grace. The evil woman, Eve, by the corruption of nature: the good woman, Mary, mother of grace, mother of mercy. A mother of grace is given for the mother of nature; yet the mother by nature remains, and the mother by grace remains also. For John had Mary Salome as mother in the order of succeeding nature; and the blessed Virgin is also mother to him in the order of grace. Eve is the mother of all by the channel of nature; and the Virgin Mary is the mother of all who love Christ by the infusion of invisible grace.'
      status: draft
