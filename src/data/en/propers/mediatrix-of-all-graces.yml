matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 8
        antiphon: The fountain of gardens, * the well of living waters, which run with a strong stream from Libanus.
      - psalms:
          - 18
        antiphon: My hands * have dropped with myrrh, and my fingers are full of the choicest myrrh.
      - psalms:
          - 23
        antiphon: I will go * to the mountain of myrrh, and to the hill of frankincense.
    versicle:
      v: Under thy protection we all take refuge.
      r: O holy Mother of God.
  nocturn2:
    groups:
      - psalms:
          - 44
        antiphon: She found grace * and mercy before the king above all women.
      - psalms:
          - 45
        antiphon: Ask, my mother; * for it is not right that I should turn away thy face.
      - psalms:
          - 86
        antiphon: Do thou call upon the Lord, * and speak to the King for us, and deliver us from death.
    versicle:
      v: Despise not our petitions.
      r: In our necessities.
  nocturn3:
    groups:
      - psalms:
          - 95
        antiphon: If I have found favour * in thy eyes, O king, give me my people, for whom I beseech thee.
      - psalms:
          - 96
        antiphon: Blessed art thou * above all women upon the earth, because thou hast succoured our ruin before the sight of our God.
      - psalms:
          - 97
        antiphon: 'Rule thou over us, * thou and thy Son: for thou hast delivered us from the hand of our enemies.'
    versicle:
      v: From all dangers deliver us ever.
      r: O glorious and blessed Virgin.

lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: The Lord gave her the blessing of all nations, * and confirmed his covenant upon her head.
    - psalms:
        - 99
      antiphon: Her mercy * is for ever, and unto generation and generation.
    - psalms:
        - 62
      antiphon: I will bless thee * as long as I live, and in thy name I will lift up my hands.
  canticle:
    id: canticum-trium-puerorum
    antiphon: Thou hast not spared * thy life, by reason of the distress and tribulation of thy people.
  laudate:
    antiphon: Remember, * O Virgin Mother of God, when thou shalt stand in the sight of the Lord, to speak good things for us.

