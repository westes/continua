collect:
  text: |
    Let us pray.
    O Lord, Who hast given this excellency unto the Order of Carmel that the same
    should be especially styled the Order of the Most Blessed Mary, always a Virgin,
    thine Own Mother, mercifully grant that we who on this day do renew her memory in
    solemn worship, may worthily be shielded by her protection, and finally attain
    unto thine everlasting joy.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Holy Mary, succor the wretched, help the faint-hearted, comfort the sorrowful, pray for the people, plead for the clergy, make intercession for all women vowed to God: may all who keep this thy solemn Commemoration feel the might of thine assistance.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
