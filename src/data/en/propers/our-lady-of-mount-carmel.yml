benedictus-antiphon:
  text: Thine head upon thee * is like Carmel, and the hair of thine head like kingly purple bound in tresses, alleluia.
  status: verified

magnificat-antiphon:
  text: The glory of Lebanon * shall be given unto it, the excellency of Carmel and Sharon, alleluia.
  status: verified

magnificat-antiphon/~-first:
  text: 'O Holy Mary, * be thou an help to the helpless, a strength to the fearful, a comfort to the sorrowful; pray for the people, plead for the clergy, make intercession for all women vowed to God: may all that are keeping this thy solemn Commemoration feel the might of thine assistance.'
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Here is a story to the effect that many men who had kept a tradition of the holy Prophets Elijah and Elisha, were made ready by the preaching of John the Baptist to hail the coming of the Messiah, and that, when the Apostles having been filled with the Spirit upon the holy day of Pentecost, spake with diverse tongues and worked miracles by calling upon the Name of Jesus which is above every other name, these men, seeing and being assured of the truth, straightway embraced the faith of the Gospel, and that on account of their singular love toward the Most Blessed Virgin, whose conversation and friendship they were able to enjoy, they paid her the respect of building her a little Chapel, the first which was ever raised in honour of this same most pure Maiden, and which stood upon that part of Mount Carmel whence the servant of Elijah had in old days espied that manifest type of the Virgin, the little cloud like a man's hand, arising out of the sea.

        Now this new Chapel they repaired oftentimes day by day, and in their sacred ceremonies, prayers, and praises, honoured the Most Blessed Virgin as the particular Guardian of their Congregation. For this reason they came to be everywhere called the Brethren of Blessed Mary, of Mount Carmel, and the Supreme Pontiffs have not only confirmed to them the right to use this name, but have granted particular indulgences to all those who so call either the Order itself, or any particular member thereof. Her name and protection are not the only gifts which the most bountiful Virgin hath given them; yea, she hath given them the badge of the Holy Scapular, which she delivered to the Blessed Englishman Simon Stock, even an heavenly garment whereby this Holy Order is marked, and harnessed against all assaults. Moreover, in old times, when this Order was unknown in Europe, and not a few were instant with Honorius III. to put an end to it, the most gracious Virgin Mary appeared by night to the said Honorius, and flatly commanded him to show kindness to the Order and to the men belonging thereto.

        Many godly persons believe that it is not in this world only that the most Blessed Virgin hath marked with her favour this Order which pleaseth her so well, but that in the next world, where her power and mercy have a freer scope than here, they who belong to the Guild of the Scapular, who have practised an easy abstinence, have been regular in reciting a few prayers enjoined to them, and have kept chastity according to their state of life, are comforted by her motherly love while they are being cleansed in the fire of Purgatory, and by her help are borne forward towards their home in heaven more quickly than others. The Order loaded with so many and so great gifts, hath instituted a solemn Commemoration of the Most Blessed Virgin, to be made year after year, in perpetual observance, for the glory of the same Virgin.
      status: verified
