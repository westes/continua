prime-lectio:
  text: I was exalted like a cedar in Libanus, and as a cypress tree on mount Sion. I was exalted like a palm tree in Cades, and as a rose plant in Jericho.
  citation: Sir 24:17-18
  status: verified

sext-capitulum:
  text: |
    Send forth flowers, as the lily, and yield a smell, and bring forth leaves in grace, and praise with canticles, and bless the Lord in his works.
    R. Thanks be to God.
    V. After childbirth thou still remainest a virgin.
    R. Mother of God, pray for us.
  citation: Sir 39:19
  status: verified

