octave-readings/~-octave-day-8:
  source: Sermon of St. Augustine, Bishop; Homily of St. Gregory the Great, Pope
  text: |
    Dearly beloved brethren, all the wonderful works which our Lord Jesus Christ did in this world, under the weakness of our nature, are profitable for us: when He exalted His Manhood above the stars, He showed that heaven may open for a believer; and while He, the Conqueror of death, went up into the heavenly mansions, He showed to him that overcometh, whither he also may follow. Therefore the Ascension of the Lord is the seal of the Catholic Faith, which assureth in us the hope of the gift which is yet to come to us, from a miracle whereof we already feel the fruits. Thus let every one that is faithful, having already received so much, learn to hope for that which is promised, on the ground of that which he knoweth to have been given, and hold the goodness of God in times which have been, and times which now are, as a sure pledge of the same in times to come.

    An earthly Body, then, is now lifted up above the heights of heaven; the Bones, Which but a little while before had lain within the narrow walls of the grave, have made their entry among the angelic hosts; human nature hath been given a place in the lap of immortality; and therefore the Apostle, whose account we have heard read, saith: "When He had spoken these things, while they beheld, He was taken up." While thou hearest these words, "taken up," thou must understand thereby the ministry of the angelic army, whereby this Festival revealeth to us the Mystery of Him Who is both God and Man. United in One Person, we see in Him Who lifted up, Divine Power, and in Him Who was lifted up, very Man.

    Therefore are utterly to be loathed those pestiferous teachings of Eastern falsehood, those brand-new inventions of ungodliness which dare to assert that He Who in One Person is both Son of God and Son of Man hath but one nature. On the one hand, if a man say that Christ is only man, he hath denied the glory of his Maker; on the other, he who saith He is only God, hath denied the mercy of his Redeemer. By this same error an Arian can hardly hold to the truth of the Gospel, where we read the Son of God now equal, now less, than the Father. For whoever, by this deadly persuasion, believeth our Saviour to be of one nature only, is forced to say that either only man, or only God, was crucified. But it is not so: for neither could God alone have felt death, nor man alone have overcome it.

    The Prophet Habakkuk also hath spoken of the glory of Christ's Ascension in the words: "The sun was lifted up, and the moon stood still in her habitation." Who is here signified by the Sun, if not the Lord; or by the Moon, if not the Church? Until the Lord ascended to heaven, His holy Church was in every way fearful before the world's hostility; but after she was strengthened by His Ascension, she preached openly what she had believed in secret. "The sun was lifted up, and the moon stood still in her habitation": for when the Lord sought heaven, His holy Church grew in the authority of her preaching.

    Hence it is that Solomon hath put into the mouth of that same Church the words: "Behold, He cometh leaping upon the mountains, skipping upon the hills." For she considered the heights of such great works, and said: "Behold, He cometh leaping upon the mountains." When He came to redeem us, He came, if I may so say, in leaps. My dearly beloved brethren, would you know what His leaps were? From heaven He leapt into the womb, from the womb into the manger, from the manger on to the Cross, from the Cross into the grave, and from the grave He returned into heaven. Lo, that He might make us run after Him, Truth made manifest in the Flesh gave, for our sakes, certain leaps: for He rejoiced as a strong man to run his course, that we might say to Him from our heart: "Draw us: we will run after thee, to the savour of thy good ointments."

    Wherefore, dearly beloved brethren, it behoveth us to follow thither in heart, where we believe Him to have ascended in body. Let us flee earthly desires; let nothing here below delight us any more, we who have a Father in heaven. And this we must weigh most earnestly: that He Who ascended in gentleness will return in terror, and whatsoever He hath commanded us with meekness, that will He require of us with strict account. Let no man, therefore, think lightly of this season of granted repentance; let no man neglect to care for his own soul while he is able: for our Redeemer will come the more strict to judgment, the more patience He hath shown us before that judgment.
  responsory: |
