nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Leo the Great, Pope, Sermon 1 on the Ascension of the Lord
      text: |-
        After the blessed and glorious Resurrection of our Lord Jesus Christ, whereby the true temple of God, cast down through Jewish impiety, was raised up again by the divine power in three days, there is fulfilled this day, beloved, the number of forty holy days, appointed by a most sacred ordinance, and devoted to our profitable instruction; so that, while the Lord's bodily presence was thus prolonged, our faith in the Resurrection might be fortified by all necessary proofs. For the death of Christ had greatly troubled the hearts of the disciples, and a certain sluggishness of distrust had crept over minds weighed down with sorrow at the punishment of the cross, the giving up of the spirit, and the burial of the lifeless body.

        Wherefore the most blessed Apostles, and all the disciples, who had been fearful at the outcome of the cross, and doubtful of the truth of the Resurrection, were so strengthened by the clear evidence of the truth that, when the Lord went up into the height of the heavens, they were affected not by sadness but rather filled with great joy. And truly great and unspeakable was their cause for rejoicing, when, in the sight of that holy multitude, the nature of mankind rose up above the dignity of all heavenly creatures, destined to pass beyond the ranks of the Angels and to be raised higher than the Archangels themselves: nor would it find any limit to its ascent, save by being received into the fellowship of the eternal Father, sharing His throne in that same glory to which it was joined by nature in the Person of the Son.

        Since, then, the Ascension of Christ is our own advancement, and where the glory of the Head has gone before, there the hope of the Body is called also: let us, beloved, exult with fitting joy, and be glad with devout thanksgiving. For this day we are established not only as possessors of paradise, but we have also in Christ penetrated the very heights of the heavens, gaining more abundant gifts through the ineffable grace of Christ than we had lost through the envy of the devil. For those whom the venomous enemy cast down from the happiness of their first home, these the Son of God, having made them members of His own Body, has set at the right hand of the Father: with Whom He liveth and reigneth in the unity of the Holy Ghost, God, world without end. Amen.
      responsory: |-
        R. Let not your heart be troubled: I go to the Father; and when I have been taken up from you, I will send unto you, alleluia, * the Spirit of truth, and your heart shall rejoice, alleluia.
        V. I will ask the Father, and He shall give you another Comforter.
        R. The Spirit of truth, and your heart shall rejoice, alleluia.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Mark 16:14-20
      text: 'At that time, Jesus appeared unto the eleven disciples as they sat at table: and he upbraided them with their incredulity and hardness of heart, because they did not believe them who had seen him after he was risen again. And he said to them: Go ye into the whole world, and preach the gospel to every creature. He that believeth and is baptized, shall be saved: but he that believeth not shall be condemned. And these signs shall follow them that believe: In my name they shall cast out devils; they shall speak with new tongues; they shall take up serpents; and if they shall drink any deadly thing, it shall not hurt them; they shall lay their hands upon the sick, and they shall recover. And the Lord Jesus, after he had spoken to them, was taken up into heaven and sitteth on the right hand of God. But they going forth preached everywhere, the Lord working withal, and confirming the word with signs that followed.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 29 on the Gospels
      text: |-
        I may be allowed to say that the disciples' slowness to believe that the Lord had indeed risen from the dead, was not so much their weakness as our strength. In consequence of their doubts, the fact of the Resurrection was demonstrated by many infallible proofs. These proofs we read and acknowledge. What then assureth our faith, if not their doubt? For my part, I put my trust in Thomas, who doubted long, much more than in Mary Magdalene, who believed at once. Through his doubting, he came actually to handle the holes of the Wounds, and thereby closed up any wound of doubt in our hearts.

        To confirm to our minds the trustworthiness of the fact that our Lord did indeed rise again from the dead, it is well for us to remark one of the statements of Luke: "Eating together with them, He commanded them that they should not depart from Jerusalem"; and a little afterward: "While they beheld, He was taken up, and a cloud received Him out of their sight." Consider these words, note well these mysteries. After "eating together with them He was taken up." He ate and ascended: that the fact of His eating might show the reality of the Body in Which He went up. But Mark telleth us that before the Lord ascended into heaven, He upbraided His disciples with their unbelief and hardness of heart. From this I know not why we should gather, but that the Lord then upbraided His disciples, for whom He was about to be parted in the body, to the end that the words which He spoke unto them as He left them might be the deeper imprinted on their hearts.

        When then He had rebuked the hardness of their heart, what command did He give them? Let us hear. "Go ye into all the world and preach the Gospel to every creature." Was the Holy Gospel, then, my brethren, to be preached to things insensate, or to brute beasts, that the Lord said to His disciples, "Preach the Gospel to every creature"? Nay, but by the words "every creature" we must understand man, in whom are combined qualities of all creatures. Being he hath in common with stones, life in common with trees, feeling in common with beasts, understanding in common with angels. If, then, man hath something in common with every creature, man is to a certain extent every creature. The Gospel, then, if it be preached to man only, is preached to every creature.
      responsory: |-
        R. I will pray the Father, and He shall give you another Comforter, * that He may abide with you for ever, even the Spirit of truth, alleluia.
        V. For if I go not away, the Comforter will not come unto you; but if I depart, I will send Him unto you.
        R. That He may abide with you for ever, even the Spirit of truth, alleluia.
      status: verified

octave-readings/~-octave-day-2:
  source: Sermon of St. Leo, Pope; Homily of St. Gregory the Great, Pope
  text: |
    Dearly beloved brethren, that mysterious thing, our salvation, which the Maker of the universe thought worth purchasing with His Own Precious Blood, was aimed at by Him, in the dispensation of His humility, from the hour wherein He was born as touching the flesh, till the moment when, at the end of the Passion, He cried on the Cross: "It is finished." Although from under the form of a servant many marks of His Godhead shone forth, yet, as a whole, the work of those three-and-thirty years was to manifest the verity of the Manhood which the Son of God had taken into Himself. But when the suffering was all over, and the bands of death were broken, (that death which had lost all his power by seeking to bind Him Who knew no sin,) then was weakness changed into strength, mortality into immortality, insult into that glory which the Lord Jesus Christ, on so many occasions, made manifest by so many and infallible proofs, until the day came when that triumphant procession of victory, which He had led from the realms of shattered death, followed Him with unimaginable pomp into the heavens.

    On the solemn Feast of the Passover the cause of our joy was that Christ was risen again. This day we rejoice because that He is ascended up into heaven. We call to mind and justly celebrate that day whereon our lowly nature was, in the Person of Christ, borne up high above all the heavenly armies, above all the circles of Angels, beyond the heights of all the Powers, even to where Christ is sitting on the right hand of the Father. Our foundations are laid, and our house is built upon this succession of the works of God, and His grace is made more wonderful by this, that, though the visible Object of worship is removed from among men, the faith of the Church doth not grow weak, nor her hope wavering, nor her love cold.

    It is the back-bone of a strong mind and the eye of a trusty soul, to believe unhesitatingly that which is not seen with the bodily eyes, and to centre all love where there can be no experimental knowledge. This it is which is the only thing we can have of godliness, for how could a man be justified through faith, if the saving objects were objects of sight? There was a man who would not believe in the Resurrection of Christ until he had examined by sight, and touched the marks of the Passion in the Divine Body, and the Lord said to him, "Because thou hast seen Me, thou hast believed: blessed are they that have not seen, and yet have believed." (John xx. 29.)

    "He that believeth, and is baptized, shall be saved: but he that believeth not shall be damned." Perchance some man will say within himself: "I have already believed, and therefore I shall be saved." Thou hast well said, if thou showest thy faith by thy works. He only hath a true faith whose life doth not give the lie to his confession. Hence it is that Paul saith, touching some who were falsely faithful: "They profess that they know God, but in works they deny Him." (Tit. i. 16.) And John likewise saith: "He that saith, I know Him, and keepeth not His commandments, is a liar." (I. ii. 4.)

    Once, then, it so standeth, it is to our lives we must look for proof of the reality of our faith. Then only are we truly Christ's faithful people when our works are the fulfilment of our profession. The day whereon we were baptized we bound ourselves to renounce all the works of the old enemy, and all his pomps. Therefore let every one of you now turn his inward eye upon his own behaviour, and if, since his baptism, he hath kept that promise which he made before it, let him know that he is in very truth one of Christ's faithful ones, and let him rejoice.

    But if he hath utterly broken his promise, if he hath fallen away to work iniquity, and to lust after the pomps of the world, let us see if he now knoweth how to weep over his backsliding. By the merciful Judge that man is not punished as a perjurer who in the end telleth the truth, even though he hath first lied. Because Almighty God doth, in His tender kindness, so receive our contrition, that, in His judgment, He declareth us not guilty of that which we have done amiss.
  responsory: |
    R. Being seen of them forty days after that He had suffered, and speaking of the kingdom of God. Alleluia. * And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia. V. And, eating together with them, He commanded them that they should not depart from Jerusalem, but wait for the Promise of the Father. R. And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia.
  status: verified

octave-readings/~-octave-day-3:
  source: Sermon of St. Leo, Pope; Homily of St. Gregory the Great, Pope
  text: |
    And so the seen Presence of our Redeemer in the Body was changed for an unseen Presence in the Sacraments, and hearing was given to the Church in place of seeing, that her faith, rightly so called, might be the more victorious and stedfast, and that teaching, which the hearts of all her children are called on to hear, is a teaching enlightened by rays from heaven. This faith, strengthened by the Ascension of the Lord, and established by the gift of the Holy Ghost, neither bonds, nor imprisonment, nor exile, nor famine, nor fire, nor savage beasts, nor those forms of death, finewrought in cruelty, wherein they that persecute us are well skilled, have been able to scare. For this faith there have striven throughout the whole world, even unto the out-pouring of their blood, not men only, but women also, not little lads only, but tender maidens. This is the faith which hath cast out devils, healed diseases, raised the dead.

    Hence even the blessed Apostles themselves, who had been comforted by so many miracles and taught by so many discourses, were sickened by the horrors of their Lord's Passion, and received but doubtfully the assurance of His Resurrection, till after the Lord's Ascension, and then fared on so bravely, that all that had been fearful to them before became joyful then. The reason was that they had lifted up all their mind to think of the Godhead of Him Who sitteth at the right hand of the Father. They asked no longer for a seen Presence, when their spiritual eye had caught the fact that, even as, when He had come down to earth, He had not left His Father, so now that He was gone up into heaven, He had not left His disciples. So then it was, dearly beloved brethren, that the Son of man more excellently and more sacredly revealed Himself as the Son of God, when He had withdrawn Himself again into that glory which He had with the Father before the world was. In some unspeakable way He began to be more present, as touching His Godhead, when He removed Himself farther from us, as touching His Manhood.

    Then it was that a better instructed faith began intellectually to approach the idea of a Son equal to the Father, and no longer to need to handle in Christ the bodily Matter, which is of a nature as touching which He is inferior to the Father — since, Its nature still remaining in the glorified Body, the faith of believers was summoned to that place where the Only-Begotten Son, Who is equal to the Father, is felt, not by the application of a bodily hand, but by the effort of a spiritual-minded intellect. Hence it was that after His Resurrection, when Mary Magdalene (in whom was there represented the Person of the whole Church) wished to handle the Lord, He said: "Touch Me not, for I am not yet ascended to My Father"; that is, "I will no more that thy nearness to Me should be a nearness of body to Body, nor that thine experience of Me should henceforward be one proceeding from fleshly experiment — for that, I appoint thee an higher world, I make ready for thee a nobler form of it than this: after that I have ascended to My Father, a time will come when thou shalt indeed touch Me, but after a manner more perfect, more real than this, even a time when thou shalt lay hold on that which thou touchest not now, and believe that which thou seest not now."

    "And these signs shall follow them that believe: In My Name they shall cast out devils, they shall speak with new tongues, they shall take up serpents, and if they drink any deadly thing, it shall not hurt them, they shall lay hands on the sick, and they shall recover." My brethren, these signs do not follow us. Do we, then, not believe? Nay. The truth is, these things were needful when the Church was young. That she might grow by the increase of the faithful, she needed to be nourished with miracles. Even so we, when we plant a young tree, continually water and tend it till we see that it hath taken firm root in the earth; but when once it hath taken firm root, it can grow of itself. Hence, Paul saith of tongues: "Tongues are for a sign, not to them that believe, but to them that believe not." (1 Cor. xiv. 22.)

    We have a deeper matter of thought touching these signs and mighty works. It is the work of the holy Church to do every day spiritually that which the Apostles then did carnally. When her Priests, armed with the power of exorcism, lay their hands upon believers, and command evil spirits to dwell no longer in their souls, what is it they do but cast out devils? When Christ's faithful people themselves give up the language of their old life, and speak the wonderful works of God, the glory and power of their Maker, telling of them with all their strength, what is it they do then but speak with new tongues? When either the one or the other doth by his exhortation charm the wickedness out of his neighbour's heart, what is it he doth but take up serpents?

    When they hear the voice of temptation inviting to deadly sin, but are not drawn thereby to work iniquity, do they not then drink a deadly thing, and it doth not hurt them? As often as they see their neighbour fainting in well-doing, and run to help him with all their might, so that their example braceth the feeble life of the waverer, what do they but lay hands on the sick, and they recover? And indeed, such miracles as these are the greatest miracles, which are spiritual — the greatest, for they bring health, not to the dying body, but to the immortal soul.
  responsory: |
    R. Being seen of them forty days after that He had suffered, and speaking of the kingdom of God. Alleluia. * And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia. V. And, eating together with them, He commanded them that they should not depart from Jerusalem, but wait for the Promise of the Father. R. And while they beheld, He was taken up, and a cloud received Him out of their sight. Alleluia.
  status: verified

octave-readings/~-octave-day-4:
  source: Sermon of St. Augustine, Bishop; Tract of St. Augustine on John
  text: |
    Dearly beloved brethren, our Saviour is gone up from us into heaven, but let us not be troubled on earth. Let only our heart be there with Him, and we shall have peace here. Let us in heart thither ascend with Christ in the mean while, and when that glad day which He hath promised cometh, our body will follow. But we must know, my brethren, that there are some things that cannot ascend with Christ: pride cannot, nor covetousness, nor brutishness; no one of our diseases can ascend thither where our Healer is. And, therefore, if we would follow our Healer, we must needs leave our diseases and sins behind us. All such things tie us down, as it were, with bands, and hamper us in the meshes of a net of sins; but, with God's help, we will say with the Psalmist: "Let us break their bands asunder," that we may be able honestly to say to the Lord: "Thou hast loosed my bonds, I will offer to thee the sacrifice of thanksgiving."

    The Resurrection of the Lord is our hope; the Ascension of the Lord is our glorification. To-day we keep the solemn holiday of the Ascension. If, therefore, our keeping of this holiday is to be a right, faithful, earnest, holy, godly keeping, we must in mind likewise ascend, and lift up our hearts unto the Lord. When we ascend we must not be high-minded, nor flatter ourselves with our good works, as though they were our own. We must lift up our hearts unto the Lord. When man's heart is lifted up, but not unto the Lord, such lifting-up is pride; to lift up the heart unto the Lord, is to make the Most High our Refuge. Behold, my brethren, a great wonder. God is high, but if thou art lifted up He fleeth from thee, whereas, if thou humblest thyself, He cometh down to thee. Wherefore? "The Lord is high, yet hath He respect unto the lowly; but the proud He knoweth from afar." To the lowly He hath respect, that He may raise them up; the proud He knoweth from afar, that He may thrust them down.

    Christ arose again, to give us hope that this mortal will yet put on immortality. He hath assured against an hopeless death, and against the thought that death endeth life. We were troubled, even as touching the soul; but Christ, arising from the grave, hath assured to us the resurrection of the body also. Believe therefore, that thou mayest be made pure. First it behoveth thee to believe, if by faith thou wouldest in the end worthily see God. And wouldest thou see God? Give ear to His own words: "Blessed are the pure in heart, for they shall see God." Think first, then, how to purify thine heart; take from it whatsoever thou seest in it which displeaseth God.

    The Lord Jesus, in that discourse which He addressed to His disciples after the Last Supper, when He was on the very eve of the Passion, when He was, as it were, about to go away and leave them as touching His bodily Presence — albeit, as touching His spiritual Presence, He is with us alway even unto the end of the world — in that discourse He exhorted them to bear patiently the persecution of wicked men, of whom He speaketh as "the world," out of which world, nevertheless, He saith that He hath chosen even His disciples themselves, that they might know that it was by the grace of God that they were what they were, whereas it was by their own sins that they had been what they had been.

    "If they have persecuted Me, they will also persecute you." Here He clearly pointeth to the Jews, the persecutors both of Himself and of His disciples, so that we see that they which persecute His holy ones are as much citizens of the world of damnation as they which persecuted Himself. He saith: "They know not Him That sent Me," and yet again, "They have hated both Me and My Father," that is to say, both the Sender and the Sent — the meaning of which words we have already treated in other discourses — and with that He cometh to the words: "That the word might be fulfilled that is written in their law: They hated Me without a cause."

    Then saith the Lord, as though in continuation: "But when the Comforter is come, Whom I will send unto you from the Father, even the Spirit of truth, Which proceedeth from the Father, He shall testify of Me. And ye also shall bear witness, because ye have been with Me from the beginning." What connection hath this with the words: "Now have they both seen and hated both Me and My Father" — but that the word might be fulfilled that is written in their law: "They hated Me without a cause"? Is it that when the Comforter is come, even the Spirit of truth, He will confound by irrefragable testimony them who have both seen and hated both God the Son and God the Father? Yea, indeed, some there were who had seen and still hated, whom the testimony of the Comforter converted to the faith which worketh by love.
  responsory: |
