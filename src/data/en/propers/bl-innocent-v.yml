nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Innocent, formerly called Peter of Tarentaise, was born about the year 1225. Rich as well as noble and of elegant form, from tender age he gave himself and all his things to God in the Order of Preachers. For almost thirty years in the monastery of Paris, cultivated in religious morals and sacred letters, he ascended to the summit of wisdom and sanctity. Twice and again called to teach theological disciplines in the University of Paris and to govern the Province of his Order, he was an eminent Master of sacred science and a prelate most acceptable among the brethren. He instructed the peoples of Gaul with most abundant fruit of souls by the preaching of the word of God, and won for himself no small praise for eloquence.

        By blessed Gregory the Tenth, Supreme Pontiff, he was appointed to govern the church of Lyons, and soon and happily settled the grave and long contentions of clergy and people. Admitted into the Senate of the Purpled Fathers, he carefully arranged all things for the Ecumenical Synod to be celebrated at Lyons: then in the Synod itself, by order of the Pontiff, together with holy Bonaventure, he directed matters of greater moment. By his work especially the union of the Greeks with the Latins was approved; the complaints of the secular clergy against the regular were removed; and the statutes of the Conclave for future elections of Roman Pontiffs were sanctioned.

        At Arezzo, blessed Gregory the Tenth having died, by the votes of all the Cardinals he was raised to the Chair of Peter. Pursuing the plans of his magnanimous predecessor, he strove vigorously to free the Orientals from the yoke of infidels: he amicably reconciled Charles, king of Sicily, with the Italian cities: he repulsed the Emperor Rudolf threatening the dominion of the Roman Church from the Alps: against the Saracens invading Spain he quickly equipped an army of crusaders: he gave rules by which the religious reconciliation of the Greeks with the Latins might be completed, diligently retained by his successors. Having done so much in the short course of five months, while the Church was still hoping greater things from him, seized with fever at Rome, in the fifty-first year of his age he most piously flew to those above. He was renowned for many miracles in life and after death. Wherefore ecclesiastical cult was at once rendered to the blessed Pontiff from his departure: which, never interrupted, Pope Leo the Thirteenth, on the advice of the Sacred Congregation of Rites, confirmed.
      status: draft
