collect:
  text: |
    Let us pray.
    O God, who dost gladden us by the solemn feast of Thy Saints, and dost rouse us by their
    example unto growth in virtue: grant that we, who venerate them by this office, may also
    follow the example of their holy manner of life.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of
    the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. The righteous shall shine forth, * and dart about like sparks among the reeds; they shall judge the nations, and reign for ever, alleluia.
    V. Precious in the sight of the Lord, alleluia.
    R. Is the death of his saints, alleluia.
    Let us pray.
    O God, who dost gladden us by the solemn feast of Thy Saints, and dost rouse us by their example unto growth in virtue: grant that we, who venerate them by this office, may also follow the example of their holy manner of life.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: From the Epistle of St. Peter Damian, Bishop, to St. Hugh, Abbot. What else should I call the monastery of Cluny but a full field of the Lord, where there is, as it were, a heap of heavenly harvest, a choir of so many monks living together in charity? That field is daily broken up by the plough of holy preaching, and in it the seeds of heavenly eloquence are scattered. There the increase of spiritual fruits is gathered together, that it may afterward be carried into the heavenly barns. Cluny, moreover, is a certain spiritual field, where heaven and earth meet, and, as it were, an arena of combat, where, after the manner of a spiritual wrestling-ground, the frail flesh wrestles against the powers of the air. For we wrestle not against flesh and blood, but against the rulers of this world of darkness, against spiritual wickedness in high places. There Joshua — not the son of Nun, but the heavenly leader of the host, and the instructor of spiritual warriors — teaches his soldiers to trample down the proud necks of the five kings; for those, indeed, are known to win the triumphant victory over them who restrain the five senses of the body under the discipline of strict watchfulness.
      status: draft
