collect:
  text: |
    Let us pray.
    Mercifully grant, O Lord, that thine effectual goodness may in all things direct our hearts, forasmuch as without thee we are not able to please thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'The Lord said unto the sick * of the palsy: Son, be of good cheer, thy sins be forgiven thee.'
  status: verified

magnificat-antiphon:
  text: And immediately, he that had been sick of the palsy arose, * and took up his bed whereon he lay, glorifying God and all the people, when they saw it, gave praise to God.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 9:1-8
      text: At that time, Jesus, getting into a boat, crossed over and came to his own town. And behold, they brought to Him a paralytic lying on a pallet. And Jesus, seeing their faith, said to the paralytic, Take courage, son; your sins are forgiven you. And behold, some of the scribes said within themselves, This man blasphemes. And Jesus, knowing their thoughts, said, Why do you harbor evil thoughts in your hearts? For which is easier, to say, ‘Your sins are forgiven you,’ or to say, ‘Arise, and walk’? But that you may know that the Son of Man has power on earth to forgive sins, - then He said to the paralytic - Arise, take up your pallet and go to your house. And he arose, and went away to his house. But when the crowds saw it, they were struck with fear, and glorified God Who had given such power to men.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Peter Chrysologus, Archbishop of Ravenna, Sermon 50
      text: |-
        This day's reading hath shown us an instance of how Christ, in those things which He did as Man, worked deep works of God, and by things which were seen wrought things which were not seen. The Evangelist saith Jesus "entered into a ship, and passed over, and came into His Own city." Was not This He Who had once parted the waves hither and thither, and made the dry ground appear at the bottom of the sea, so that His people Israel passed dry-shod between masses of water standing still, as through an hollow glen in a mountain? Was not This He Who made the depths of the sea solid under the feet of Peter, so that the watery path offered a firm way for human footsteps?

        Therefore then denied He unto Himself a like service from the sea, but crossed over that narrow lake at the cost of a voyage on shipboard "He entered into a ship, and passed over." What wonder, my brethren: Christ came to take our weakness upon Him, that He might make us partakers of His strength to seek the things of men, that He might give to men the things of God to receive insults, that He might bestow honours to bear weariness, that He might grant rest for the physician that is himself beset by no frailties, knoweth not how to treat the frailties of others, nor he that is not weak with the weak, how to make the weak strong.

        Therefore, if Christ had abode still in His strength, He had in no wise been a fellow of men if in Him Flesh had not run the way of flesh, then had it been idle for Him to have taken Flesh at all. "He entered into a ship, and passed over, and came into His Own city." The Lord, the Maker of the world, and of all things that are therein, having been pleased for our sakes to prison Himself in our flesh, began to have an human home, and to be a citizen of a Jewish city Himself the Father of all, to have parents and all, that His love might invite, His charity draw, His tenderness bind, His gentleness persuade them whom His Kingship had scared, His awfulness scattered, and His power terrified out of His dominion.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
