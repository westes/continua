nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        It came to pass one day at Capernaum, that Christ went forth, and saw a publican, named Levi, sitting at the receipt of custom; and He said unto him: Follow Me. And he left all, rose up, and followed Him. And Levi made Him a great feast in his own house. This Levi is the Apostle and Evangelist Matthew. After that Christ was risen again from the dead, and while he was yet in Judea, before he set forth for that land which had fallen to the lot of his preaching, he wrote the Gospel of Jesus Christ in the Hebrew tongue, for the sake of them of the circumcision who had believed. His was the first written of the four Gospels. Thereafter he went to Ethiopia, and there preached the Gospel, confirming his preaching with many miracles.

        Of his miracles, the most notable was that he raised the King's daughter from the dead, and thereby brought to believe in Christ the King her father, his wife, and all that region. After that the King was dead, Hirtacus, who came after him, was fain to take his daughter Iphigenia to wife, but by the exhortation of Matthew she had made vow of her maidenhood to God, and stood firm to that holy resolution, for which cause Hirtacus commanded to slay the Apostle at the Altar while he was performing the mystery. He crowned the dignity of the Apostleship with the glory of martyrdom upon the 21st day of September. His body had been brought to Salerno, where it was afterwards buried in a Church dedicated in his name during the papacy of Gregory VII, and there it is held in great worship and sought to by great gatherings of people.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 9:9-13
      text: 'At that time, Jesus saw a man named Matthew sitting in the tax-collector''s place, and said to him, "Follow Me." And he arose and followed Him. And it came to pass as He was at table in the house, that, behold, many publicans and sinners came to the table with Jesus and His disciples. And the Pharisees seeing it, said to His disciples, "Why does your Master eat with publicans and sinners?" But Jesus heard it, and said, "It is not the healthy who need a physician, but they who are sick. But go, and learn what this means: ''I desire mercy, and not sacrifice.'' For I have come to call sinners, not the just."'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Commentary on Matthew, Bk. 1 (on Matt 9:9-13)
      text: 'The other Evangelists, out of tenderness towards the reputation and honour of Matthew, have abstained from speaking of him as a publican by his ordinary name, and have called him Levi. Both names were his. But Matthew himself, according to what Solomon saith: The just man is the first to accuse himself, and again, in another place: Declare thou thy sins that thou mayest be justified, doth plainly call himself Matthew the publican, to show unto his readers that none need be hopeless of salvation if he will but strive to do better, since he himself had been all of a sudden changed from a publican into an Apostle.'
      status: verified
