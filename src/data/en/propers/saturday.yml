matins-invitatory/antiphon-~:
  text: 'The Lord our God: * O come, let us worship Him.'
  status: verified

lauds-capitulum:
  text: The night is passed, and the day is at hand. Let us therefore cast off the works of darkness, and put on the armour of light. Let us walk honestly, as in the day.
  citation: Rom 13:12-13
  status: verified

lauds-hymn:
  text: |
    The dawn is sprinkling in the east
    Its golden shower, as day flows in;
    Fast mount the pointed shafts of light:
    Farewell to darkness and to sin!

    Away, ye midnight phantoms all!
    Away, despondence and despair!
    Whatever guilt the night has brought,
    Now let it vanish into air.

    So, Lord, when that last morning breaks,
    Looking to which we sigh and pray,
    O may it to thy minstrels prove
    The dawning of a better day.

    * To God the Father glory be,
    And to his sole-begotten Son;
    Glory, O Holy Ghost, to thee,
    While everlasting ages run.
    Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Heal my soul, * for I have sinned against thee.
    R. Heal my soul, * for I have sinned against thee.
    V. I said: O Lord, be thou merciful to me.
    R. For I have sinned against thee.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Heal my soul, * for I have sinned against thee.
  status: verified

lauds-versicle:
  text: |-
    V. We are filled in the morning with thy mercy.
    R. And we have rejoiced, and are delighted.
  status: verified

vespers-capitulum:
  text: O the depth of the riches of the wisdom and of the knowledge of God! How incomprehensible are his judgments, and how unsearchable his ways!
  citation: Rom 11:33
  status: draft

vespers-hymn:
  text: |
    O Trinity of blessed Light,
    O Unity of sovereign might,
    as now the fiery sun departs,
    shed Thou Thy beams within our hearts.

    To Thee our morning song of praise,
    to Thee our evening prayer we raise;
    Thee may our glory evermore
    in lowly reverence adore.

    * All laud to God the Father be;
    all praise, Eternal Son, to Thee;
    all glory, as is ever meet,
    to God the Holy Paraclete.
    Amen.
  status: draft

vespers-responsory:
  text: |
    R.br. Great is our Lord, * and great is his power.
    R. Great is our Lord, * and great is his power.
    V. And of his wisdom there is no number.
    R. And great is his power.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Great is our Lord, * and great is his power.
  status: draft

vespers-versicle:
  text: |
    V. Let the evening prayer ascend unto thee, O Lord.
    R. And let there descend upon us thy mercy.
  status: draft
