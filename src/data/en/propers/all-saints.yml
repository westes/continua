nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: The Venerable Bede, Priest, Sermon 18 on the Saints
      text: |-
        Dearly beloved brethren: This day we keep, with one great cry of joy, a Feast in memory of all God's holy children; His children, whose presence is a gladness to heaven; His children, whose prayers are a blessing to earth; His children, whose victories are the crown of the Holy Church; His chosen, whose testifying is the more glorious in honour, as the agony in which it was given was the sterner in intensity, for as the dreader grew the battle, so the grander grew the fighters, and the triumph of martyrdom waxed the more incisive by the multiplicity of suffering, and the heavier the torment the heavier the prize. And it is our Mother, the Catholic Church, spread far and wide throughout all this planet, it is she that hath learnt, in Christ Jesus her Head, not to fear shame, nor cross, nor death, but hath waxed lealer and lealer, and, not by fighting, but by enduring, hath breathed into all that noble band who have come up to the bitter starting-post the hope of conquest and glory which hath warmed them manfully to accept the race.

        If a verity thou art blessed, O my Mother the Church! The blaze of God's mercy beateth full upon thee; thine adornment is the glorious blood of victorious Martyrs, and thy raiment the virgin whiteness of untarnished orthodoxy; thy garlands lack neither roses nor lilies. And now, dearly beloved brethren, let each one of us strive to gain the goodly crown of one sort or the other, either the glistening whiteness of purity, or the red dye of suffering. In the army in heaven peace and war have both chaplets of their own, to crown Christ's soldiers withal.

        Moreover, to this also hath the unutterable and boundless goodness of God seen, that He spreadeth not the time of working and wrestling, neither maketh it long, nor everlasting, and, as it were, but for a moment, so that in this short and scanty life there is wrestling and working, but the crown and the prize is in a life which is eternal. So the work is soon over, but the wage is paid for ever. And when the night of this world is over, the Saints are to see the clearness of the essential light, and to receive a blessedness outweighing the pangs of any torment, as testifieth the Apostle Paul, where he saith: The sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 5:1-12
      text: At that time, Jesus seeing the crowds, went up the mountain. And when He was seated, His disciples came to Him. And opening His mouth He taught them, saying, Blessed are the poor in spirit, for theirs is the kingdom of heaven. Blessed are the meek, for they shall possess the earth. Blessed are they who mourn, for they shall be comforted. Blessed are they who hunger and thirst for justice, for they shall be satisfied. Blessed are the merciful, for they shall obtain mercy. Blessed are the clean of heart, for they shall see God. Blessed are the peacemakers, for they shall be called children of God. Blessed are they who suffer persecution for justice' sake, for theirs is the kingdom of heaven. Blessed are you when men reproach you, and persecute you, and, speaking falsely, say all manner of evil against you, for My sake. Rejoice and exult, because your reward is great in heaven.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop, Book 1 on the Lord's Sermon on the Mount
      text: |-
        If it be asked what is signified by the mountain, the said mountain may well be understood to figure the higher and greater commandments of righteousness, since those that have been given to the Jews are the lesser. The one God, in an excellent order of times, gave, by His holy Prophets and servants, His lesser commandments unto the people whom it still behoved to be bound by fear, but by His Son He gave the greater unto the people whom it now beseemed to set free by love. But whether it be the lesser to the lesser, or the greater to the greater, all are alike the gift of Him Who alone knoweth what is in each epoch the seasonable medicine of mankind.

        Neither is it marvel that the greater commandments be given touching the kingdom of heaven, and the lesser touching a commonwealth upon earth, since both are alike the gifts of that one God Who is the Maker alike of heaven and of earth. The higher and greater righteousness, then, is that whereof the Prophet saith: Thy righteousness is like the mountains of God. Thus is that Teacher, Who alone can give such teaching, mystically represented as teaching upon a mountain. And when He was set. The attitude of sitting while teaching appertaineth to the majesty of His instruction. His disciples came unto Him nearer in the body, to hear those precepts, by the fulfillment of which they should be nearer in spirit. And He opened His Mouth, and taught them, saying these words appear redundant to the sense. It may possibly be that this more pompous introduction is adopted on account of the exceptional length of the discourse to follow. But it may also be that these words are not really redundant, but the pointed declaration that He now opened His Own Mouth, Who, under the Old Law, had been used to open the mouths of the Prophets.

        And now, what saith He? Blessed are the poor in spirit, for theirs is the kingdom of heaven. We have read where it is written concerning the lusting after temporal things: The wandering of the desire is vanity and presumption of spirit. Presumption of spirit signifieth rashness and pride. We are used to say of proud people that they are men of high spirit, and we say well, since spirit is only one of the Latin names for wind. Who hath not heard the proud spoken of as puffed up, as if they were blown out with wind? Hence, alas, the Apostle saith: Knowledge puffeth up, but charity edifieth. By the poor in spirit, who are here called blessed, are rightly to be understood such as are lowly and fear God, that is, have not got minds puffed up with windy vanity.
      status: verified

