# Further Matins readings for the All Saints octave days that have them in the reference
# source (Sancti/11-0Xoct.txt, Lectio4-9): Bede (or Bernard, Chrysostom) sermon, then Augustine's
# homily on the Gospel (Matt 5:1-12). Generously kept alongside the Ezekiel reading (DESIGN.md:
# every active octave gets its own reading), see octave-readings.ts getOctaveReadings.
octave-readings/~-octave-day-2-homily:
  source: 'The Venerable Bede, Priest, Sermon 18 on the Saints'
  text: |
    With what a passion of welcome doth the land above receive them that are coming home from the battle, and go forth to meet them that bear the spoils of the down - trodden foe! The men who walk in the procession of victory are mingled with women, who have conquered world and weakness together, and there also are damsels and lads who have understood more than the ancients, because they have kept the precepts of the Eternal. But besides these there is another great host, who will have entry into the everlasting Palace, even they who have kept pure the unity of the faith in the bond of peace, and the unshaken observance of the commandments given us from heaven.

    Home now, therefore, my brethren, and let us enter upon the way; let us turn our faces homeward and heavenward, toward that land wherein our names are written down and we are citizens elect. We are no more strangers and foreigners, but fellow-citizens with the Saints, and of the household of God, (Eph. ii. 19,) yea, heirs of God, and joint-heirs with Christ. (Rom. viii. 17.) Bravery can open, and lealty keep wide the entry for us into that city. Let us think then for awhile what is the brilliant happiness of that city that is to say, as well as we can, for what it really is, no words can utter.

    Concerning that city it is written in a certain place Sorrow and mourning shall flee away. What can be more blessed than that life wherein poverty will not threaten, nor sickness weaken? There, there will be no hurts and no angering. There, there will be no envying; there, will burn no covetousness; no ambition of honour nor seeking of power will give trouble, there. There, the devil will be no more an object of fear; there, no evil spirits lie in wait; the dread of hell will be gone, there. There, there will be no death either for the body or for the soul, but life glorious in the gift of immortality.
  status: verified

octave-readings/~-octave-day-2-gospel-homily:
  source: 'St. Augustine, Bishop, homily on Matt 5:1-12, Book 1 on the Lord''s Sermon on the Mount, ch. 1-2'
  text: |
    Blessed are the poor in spirit. If blessedness is to attain unto the highest wisdom, it must needs be that it begin by the being poor in spirit. The fear of the LORD is the beginning of wisdom, (Ps. ex. 10,) even as, on the other hand, it is written that pride is the beginning of all sin. (Ecclus. x. i 5.) The proud covet and love earthly kingdoms. Blessed are the meek, for they shall inherit the earth. The earth which they shall inherit I believe to be that earth whereof it is written in the cxli. Psalm, Thou art my refuge, and my portion in the land of the living. (6) And the heritage of the meek in this land is an heritage everlastingly sure and fixed, wherein the soul resteth by good will, at home there, as carnal owners rest at home in sure earthly possessions; and on the income from that land they live, as earthly owners from the income of earthly possessions; this is the home and the abiding-place of the Saints. And the meek heirs are they who when they be evil-entreated, suffer it, and are not overcome of evil, but overcome evil with good. (Rom. xii. 21.)

    Blessed are they that mourn, for they shall be comforted. This mourning is sorrow for the things once loved and now lost. By turning to God, they lose things in this world which they once loved. But now their true joy is no longer in those things wherein they joyed aforetime, and by the growing love of the eternal things this their carnal mourning is abundantly comforted. They are comforted by the Holy Ghost Who chiefly for this very reason hath His title of the Comforter. They lose things temporal, but they gain the enjoyment of things eternal.

    Blessed are they that do hunger and thirst after righteousness, for they shall be filled. They of whom He speaketh here are they who have a love for whatever is good, because it is good. And such as these shall have their hunger satisfied with that meat whereof the Lord Himself said My meat is to do the will of Him that sent Me, and to finish His work, (John iv. 34,) and their thirst slaked with that water which the same Lord Himself shall give them, whereof whosoever drinketh shall never thirst, but the water that He shall have given him, shall be in him a well of water springing up into everlasting life. (14.) Blessed are the merciful, for they shall obtain mercy. He calleth them blessed which succour the needy, for, with the measure wherewith they have meted, shall it be measured unto them withal, and they shall not be left unsuccoured in their own need.
  status: verified

octave-readings/~-octave-day-3-homily:
  source: 'The Venerable Bede, Priest, Sermon 18 on the Saints'
  text: |
    Never shall there be discord anywhere there, but all things in harmony. For everywhere there, things are in such concord that all the Saints are at unity with each other in one peace and joy. Everywhere there, all things are tranquil and quiet. Perpetual is the splendour there; not like unto the sunlight which we know here, but a light which is the brighter, as it is the more blessed. For that city, as saith Scripture, needeth not the light of the sun, because the Lord Almighty doth enlighten it by the Lamb which is the Light thereof. There the Saints shall shine like as the brightness of the firmament, and they that have turned many to righteousness, as the stars, for ever and ever.

    And so there is no night there, no darkness, no gathering of clouds, no asperity of heat or cold. But such is the nature of things there as no eye hath seen, nor ear heard, neither hath it entered into the heart of man, except of those only who have been found worthy to enjoy it, whose names are written in the book of life; and who have washed their robes in the blood of the Lamb, and are before the throne of God, serving him day and night. There is no old age anywhere there, nor misery of old age, for all are come to perfect manhood, to the measure of the stature of the fulness of Christ.

    But far above all these things is the fellowship there. That is, to enjoy the companionship of the heavenly citizens: to look upon the choirs of Angels and Archangels, of Thrones and Dominions, Principalities, Powers, and all the heavenly Virtues on high: and to behold the army of the Saints shining more gloriously than the stars; of the Patriarchs glowing with faith; of the Prophets rejoicing in hope; of the Apostles judging the world reformed into twelve tribes of the new Israel; of the Martyrs resplendent in their ruddy crowns of victory; and of the Virgins wearing garlands of the purest white.
  status: verified

octave-readings/~-octave-day-3-gospel-homily:
  source: 'St. Augustine, Bishop, homily on Matt 5:1-12, Book 1 on the Lord''s Sermon on the Mount, ch. 2-3'
  text: |
    Blessed are the pure in heart, for they shall see God. How foolish therefore be they that seek God with their outward eyes, since it is in the heart that he is seen. Thus it is written elsewhere: In simplicity of heart seek him. For a pure heart is one that hath the simplicity of single-mindedness. And just as light can be seen only insofar as the bodily eyes have clear vision, so God can be seen only insofar as the heart is clear by reason of its single-mindedness of purpose. Blessed are the peacemakers for they shall be called the children of God. Peace is perfect where there is no strife. And the children of God are peacemakers because there is nothing in them which withstandeth God. And surely children ought to be like unto their father.

    Peacemakers are all those that have peace within themselves. That is, those who have set all the passions of their souls in order. This they do by subjecting their passions to reason, namely, to the mind and spirit. Thus, by conquering their fleshly desires, they have made of themselves a little kingdom of God. In this kingdom, everything is ordered into an harmonious whole, by virtue of the fact that the element which chief and pre-eminent in man (namely, mind or reason) ruleth, without resistance, over the elements which we have in common with the beasts. And in this fashion, the element of mind or reason, which is pre-eminent in man, is made subject to something pre-eminent to itself, namely, the Truth, even the Only-Begotten Son of God. For no one is able to govern except he be subject unto the higher powers. Now, herein we have set forth the peace which is given on earth to men of good-will. This is the life of one who is thoroughly and completely wise.

    From a kingdom such as this, which is a state of complete peace and order, the prince of this world is cast out. For he is one that can rule only through perversity and disorder. When this peace hath been inwardly established and confirmed, then whatever persecutions the prince of this world, who is now cast out, shall stir up from without, he only increaseth the glory which doth redound to God. For he is unable to tear down anything in that which is so upbuilt. And by the failure of his machinations, he doth but make manifest the strength with which it hath been inwardly built. Hence it followeth: Blessed are they that are persecuted for righteousness' sake, for theirs is the kingdom of heaven.
  status: verified

octave-readings/~-octave-day-5-homily:
  source: 'The Venerable Bede, Priest, Sermon 18 on the Saints'
  text: |
    Therefore, may it be our delight to go on unto this prize of good living. Freely and cheerfully let us strive in the race, running under the eyes of God and of Christ. We have already taken a station above floating and earthly things, and let us allow no love for things fleeting to hamper our running. If the last day shall find us lithe and speedful in the race of good living, we shall never have to complain that our Master is a scanty rewarder of our works.

    That giveth a red crown for suffering under persecution, the same giveth a white crown to them that under peace, prevail in battles of righteousness. Neither Abraham, nor Isaac, nor Jacob, were slain, and nevertheless in honour for faith and righteousness, they have gained the first place among the Patriarchs, and it is to sit down with them in the kingdom of God that are gathered the faithful, the righteous, and the praiseworthy. We must remember that it is God's will, and not our own will, that we must do, for he that doeth His will abideth for ever, even as He abideth for ever.

    Therefore, dearly beloved brethren, with mind clear, faith firm, courage true, love thorough, let us be ready to do whatever God willeth, keeping stoutly all the commandments of the Lord, having innocency in simplicity, peaceableness in love, modesty in lowliness, in ministering diligence, in helping them that toil watchfulness, in succouring the poor mercifulness, in standing up for the truth firmness, in keeping of discipline sternness, lest we be found wanting in any good work. These are the steps which the Saints who have already gone home have left marked for us, that we may be able to keep in their footprints, and so to follow them into their joy.
  status: verified

octave-readings/~-octave-day-5-gospel-homily:
  source: 'St. Augustine, Bishop, homily on Matt 5:1-12, Book 1 on the Lord''s Sermon on the Mount, ch. 3-4'
  text: |
    First, Blessed are the poor in spirit. Secondly, Blessed are the meek. Thirdly, Blessed are they that mourn. They that are blessed under this third head, having knowledge, do mourn that they possess not yet the Highest Good, which possession belongeth unto the end of their course. But in the fourth place, Blessed are they which do hunger and thirst after righteousness. Here there is that earnest striving, wherewith the mind doth struggle to tear herself away from those things whose deathful sweetness would make her fain to cling unto them. Here is hungering and thirsting after righteousness, and there is sore need of firmness, for what it is a joy to have, it must be a grief to lose. But the fifth head is the declaration that Blessed are the merciful, and in these words a door of comfort and reward is opened unto the toiling. Entangled in such straits a man can be of no use to himself, unless One That is stronger than he help him; and if he be helped of the Stronger, it is but just that he in turn should help such as is weaker than himself. And so, Blessed are the merciful, for, in their turn, they shall obtain mercy from God.

    Blessed are the pure in heart. This sixth benediction is pronounced upon those hearts which by pure, clear consciousness of good works are able to look to that Highest Good, Which only the clear, calm mind can perceive. Lastly cometh in the seventh place that Blessed are the peacemakers, that is to say, blessed are they who cultivate wisdom, which is the contemplation of the True, since it is the fruit of this contemplation of the True to produce profound and utter internal peace in man, and to catch the reflection of the Divine, this being the idea which is expressed in the words: Blessed are the peacemakers, for they shall be called the children of God. The eighth phrase is a return to the first, since it showeth lowliness of spirit in its aspect of completion and crowning; and thence the kingdom of heaven is the reward mentioned in both places. Blessed are the poor in spirit, for their's is the kingdom of heaven. Blessed are they which are persecuted for righteousness' sake, for their's is the kingdom of heaven.

    Paul saith Who shall separate us from the love of Christ? Shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword? There are therefore seven things which bring to perfection, for the eighth is the glorification and manifestation of that which is perfected, that from this head others again may begin, and be finished. It seemeth to me also that these heads and sayings have some connection with the seven gifts of the Holy Ghost whereof Isaiah speaketh. But there is a difference of order, for there the highest is taken first, but here the lowest; there the wisdom of God, but here the fear of God, but the beginning of wisdom is the fear of the Lord.
  status: verified

octave-readings/~-octave-day-6-homily:
  source: 'St. Bernard, Abbot, Sermons 2 and 5 on the Feast of All Saints'
  text: |
    Dearly beloved brethren, since we keep on this day the memory of all the Saints, that memory so joyous and so worthy of all our thoughts, it seemeth to me worth the while, the Holy Ghost helping me, to address to your kind indulgence some remarks upon that happiness which they are all enjoying in blessed restfulness, and that final consummation they are awaiting. It is a faithful saying, and worthy of all acceptation, that if we thus solemnly honour them, we should follow the example of their conversation; if we proclaim them so blessed, we should strive our best to reach the same blessedness; if we are well pleased to hear them praised, we should be bettered by their prayers.

    What is it to the Saints that we should praise them? What to them that we should glorify them? What is this our Feast to them? What are honours on earth to them whom, according as the Son hath faithfully promised, His Father is honouring? What are our eulogies to them? They are full. Verily, dearly beloved brethren, of our goods the Saints have no need, and our devotion toward them doth nothing for them. Our honouring their memory hath to do with ourselves and not with them. Would ye know what it hath to do with us? In me I confess that at their remembrance I feel kindled a vehement longing, yea, a three-fold longing.

    It is a common saying that out of sight, out of mind. The memory is a kind of sight, and to think of the Saints, is to call them up before the mind's eye. Such is our portion in the land of the living, but it is not a little portion, if love, (as it ought to do,) be joined with remembrance; it is in such sense that we must say that our conversation is in heaven. (Phil. iii. 20.) Very differently to what is theirs. For they are there actually, where we are only in desire; they in very presence, we only in thought.
  status: verified

octave-readings/~-octave-day-6-gospel-homily:
  source: 'St. Augustine, Bishop, homily on Matt 5:1-12, Book 1 on the Lord''s Sermon on the Mount, ch. 4'
  text: |
    Wherefore, if we reckon up the Beatitudes as ascending steps, the first is the fear of God; the second, godliness; the third, knowledge; the fourth, firmness; the fifth, counsel; the sixth, understanding; the seventh, wisdom. The fear of God pertaineth unto the lowly, as it is said Blessed are the poor in spirit, for their's is the kingdom of heaven, that is, it is for them that are not puffed up, for them that are not proud, as also saith the Apostle Be not highminded, but fear, (Rom. xi. 20,) that is, Be not puffed up. Godliness pertaineth unto the meek; for he that seeketh after a godly sort, honoureth the Holy Scripture, and when he findeth therein that which he doth not yet understand he blameth not the Scripture, nor gainstandeth. And this is to be meek. Therefore is it said here Blessed are the meek, for they shall inherit the earth.

    Is knowledge pertaineth unto them that mourn, who have already learnt from the Scriptures amid what ills they are entangled, even in those things which once in their ignorance they affected as being good and useful. Of such is it said Blessed are ye that weep now. (Luke vi. 21.) Firmness pertaineth unto such as hunger and thirst after righteousness. These are they who toil bravely, animated by the longing for that joy which is caused by real blessedness, and striving therefore to wean their love away from so-called joys whose origin is merely earthly and fleshly. Of them is it said Blessed are they which do hunger and thirst after righteousness. Counsel pertaineth unto the merciful, for our only way of escape from the horrors of our own guilt's punishment is that we should forgive even as we hope to be ourselves forgiven, and should help others as much as we can, even as we would fain be holpen in that wherein we can ourselves do nothing. And of such as so do, it is said Blessed are the merciful, for they shall obtain mercy from God.

    Understanding pertaineth unto the pure in heart, for these are they whose clear eye can see that which the fleshly eye hath not seen, neither the ear heard, neither hath it entered into the heart of man to conceive; and therefore of them it is said: Blessed are the pure in heart, for they shall see God. Wisdom pertaineth unto the peacemakers, even unto them in whom all things are well ordered, and passion no longer maketh insurrection against reason, but all things are subject unto human common sense, even as the same again is made subject unto God. And of such is it said: Blessed are the peacemakers. But for all these forms of blessedness there is one and the same reward, although diversely named, and that reward is the kingdom of heaven.
  status: verified

octave-readings/~-octave-day-7-homily:
  source: 'St. John Chrysostom, Sermon on the Martyrs: they are either to be imitated or not to be praised'
  text: |
    He that wondereth with reverential love at the mighty deeds of the holy, he that hath oftentimes on his tongue praises for the glory of the righteous, let such an one copy their holy lives and their righteousness; for if any take pleasure in the work of a Saint, he ought to take pleasure in serving God as that Saint served Him. If he praiseth the Saint, he ought to imitate him, and if he is not ready to imitate him, he ought not to praise him. Let him that praiseth another make himself worthy of a like praise, and if he be in admiration of the Saints, let his own admirable life reflect the holiness of theirs. If we love the good and leal because they are good and leal, let us not forget that we can be what they are, by doing as they did.

    It ought not to be hard for us to copy others, when we see what they of old time did without any examples before them, so that in them who copied not others, but set example for others to copy, and in us who copy them, and in them which take example by us, Christ may be glorified in His holy Church. Thus from the very beginning of the world there have been the harmless Abel who was slain, Enoch who walked with God, and was seen no more, for God took him, Noah who was found righteous, Abraham who was tried and found faithful, Moses who was the meekest of men, Joshua who was chaste, David who was gentle, Elijah who was accepted, Daniel who was holy, and the three Children who were victorious.

    The Apostles, the disciples of Christ, are held the teachers of believers. Confessors taught of them fight right manfully, the noble martyrs triumph, and the Christian army armed with the armour of God, ever prevaileth in warfare against the devil. All these have been men of like lealty, diverse warfarings, and glorious victories. And thou, O Christian, art but a carpet-knight, if thou thinkest to conquer without a fight, to triumph without a struggle. Nerve thyself, strive manfully, hit hard in the press. Consider thine engagement, look to thy state, know thine arm, even the engagement which thou hast taken, the state wherein thou art come, and the arm wherewith thou hast enrolled thyself a soldier.
  status: verified

octave-readings/~-octave-day-7-gospel-homily:
  source: 'St. Augustine, Bishop, homily on Matt 5:1-12, Book 1 on the Lord''s Sermon on the Mount, ch. 4'
  text: |
    At the first step in blessedness is set forth, as was behoven, the kingdom of heaven, the realisation of the perfect and highest wisdom of the reasonable soul. Thus is it said Blessed are the poor in spirit, for their's is the kingdom of heaven, as though it were said The fear of the Lord is the beginning of wisdom. Then unto the meek is given an inheritance, as the legacy of a father to dutiful children. Blessed are the meek, for they shall inherit the earth. Thirdly, there is comfort for such as mourn, knowing what they have lost, and what encompasseth them. Blessed are they that mourn (now), for they shall be comforted. Fourthly, the hungry and thirsty are promised that they shall be filled, a refreshment for the strugglers for life, and for the weary. Blessed are they which do hunger and thirst after righteousness, for they shall be filled.

    Mercy is proclaimed unto the merciful, as unto them who have taken the true and best counsel how to obtain from Him That is Mightier than they what they that are weaker than they obtain from them. Blessed are the merciful, for they shall obtain mercy from God. Unto the pure in heart it pertaineth to see God, for their eye is clear to take in the things eternal. Blessed are the pure in heart, for they shall see God. To the peacemakers it is given to be in the likeness and image of God, for these are the perfectly wise, created anew in the image of God, by the regeneration of the new man. Blessed are the peacemakers, for they shall be called the children of God. The foregoing are forms of blessedness which we believe can be thoroughly attained in this life. The Apostles, for instance, did, we believe, attain them. As for that entire change into the likeness of Angels, which is promised us when this life is done, no words can set it forth.

    Blessed are they which are persecuted for righteousness' sake, for their's is the kingdom of heaven. In this eighth word, which returneth back again to the fountainhead and setteth forth the perfect crown of human blessedness, is contained perchance a (mystic) connection with the fact that it was upon the eighth day that the old Law commanded that circumcision should be performed, and that it was upon the day next after the Sabbath (being the seventh day) that the Lord rose again, the day whereon He so rose being thus the eighth day, (had a week contained more than seven days,) and the first day (as a matter of fact.) There is perchance also a connection with the fact that we observe eight days ~(being from the Lord's Day whereon He rose to the Lord's Day in White both inclusive,) in honour of the creation of the new man. And yet again there is perchance a connection with the number contained in (the name of) the Feast of Pentecost, (which is, being interpreted, the Feast of the FiftiethDay.) For this number of fifty days is reckoned (from that of the offering of the Sheaf of the Passover) by counting (seven weeks, that is to say,) seven multiplied by seven, which is forty-nine, and thereto adding one, which joined with seven maketh eight, and so making full fifty. And thus borne backward to our fountainhead, the day whereon the Holy Ghost was sent down, we are borne unto the kingdom of heaven, and inherit the earth, and are comforted, and are filled, and obtain mercy, and are made pure, and are set at peace. And when we have thus been perfected within, we bear for truth's and righteousness' sake any troubles that may come upon us from without.
  status: verified

