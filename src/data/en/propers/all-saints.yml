terce-antiphon:
  text: And all the Angels stood round about the throne, * (and about the Elders, and the four living creatures,) and fell before the throne on their faces, and worshipped God.
  status: verified

terce-capitulum:
  text: |
    And I, John, saw another angel ascending from the rising of the sun, having the sign of the living God; and he cried with a loud voice to the four angels, to whom it was given to hurt the earth and the sea, saying: Hurt not the earth, nor the sea, nor the trees, till we sign the servants of our God in their foreheads.
    R. Thanks be to God.
    V. Be glad in the Lord, and rejoice, ye just,
    R. And glory, all ye right of heart.
  citation: Rev 7:2-3
