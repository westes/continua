sext-antiphon:
  text: Thou, O Lord God, hast redeemed us by thy Blood, * out of every kindred, and tongue, and people, and nation, and hast made us a kingdom unto our God.
  status: verified

sext-capitulum:
  text: |
    After this I saw a great multitude, which no man could number, of all nations, and tribes, and peoples, and tongues, standing before the throne, and in sight of the Lamb, clothed with white robes, and palms in their hands.
    R. Thanks be to God.
    V. Let the righteous rejoice before God.
    R. Yea, let them exceedingly rejoice.
  citation: Rev 7:9
  status: verified

