nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: Pope St. Gregory the Great, Homily 34 on the Gospels
      text: |-
        We say that there are nine Orders of Angels, for, by the witness of the holy Word, we know that there be Angels, Archangels, Mights, Powers, Principalities, Dominions, Thrones, Cherubim, and Seraphim. Nearly every page of the holy Word witnesseth that there be Angels and Archangels. The books of the Prophets, as is well known, do oftentimes make mention of Cherubim and Seraphim. Paul, writing to the Ephesians, counteth up the names of four Orders, where he saith: The Father of glory raised Christ from the dead, and set Him at His own right hand in the heavenly places, far above all Principality, and Power, and Might, and Dominion. And the same, again, writing to the Colossians, saith: By the Son were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be Thrones, or Dominions, or Principalities, or Powers. If, then, we add the Thrones to the four Orders of which he spake unto the Ephesians, we have five Orders; and when we add unto them the Angels and the Archangels, the Cherubim and the Seraphim, we find that the Orders of Angels are beyond all doubt nine.

        But we must know that the word Angel is the designation, not of a nature, but of an office. Those holy spirits in the heavenly fatherland are always spirits, but they may no wise be always called Angels, which is, being interpreted, messengers, for they are Angels only when they are sent as Messengers. Hence also it is said by the Psalmist: Who makest spirits thine Angels! As if it were: Of them who are always with Him as spirits, He doth somewhiles make use as Messengers. They who go on the lesser messages are called Angels; they who go on the greater, Archangels. Hence it is that unto the Virgin Mary was sent no common Angel, but the Archangel Gabriel. For the delivery of this, the highest message, it was meet that there should be sent the highest Angel. Their individual names also are so given as to signify the kind of ministry wherein each is powerful. Michael signifieth: Who-is-like-unto-God? Gabriel, the Strength-of-God, and Raphael, the Medicine-of-God.

        As often as anything very mighty is to be done, we see that Michael is sent, that by that very thing, and by his name, we may remember that none is able to do as God doeth. Hence that old enemy whose pride hath puffed him up to be fain to be like unto God, even he who said, I will ascend unto heaven, I will exalt my throne above the stars of God, I will be like the Most High, this old enemy, when at the end of the world he is about to perish in the last death, having no strength but his own, is shown unto us a-fighting with Michael the Archangel, even as saith John: There was war in heaven; Michael and his Angels fought against the dragon; and the dragon fought and his angels. Unto Mary is sent Gabriel, whose name is interpreted the Strength of God, for he came to herald the appearing of Him Who was content to appear lowly that He might fight down the powers of the air. Raphael, also, as we have said, signifieth the Medicine-of-God, and it is the name of him who touched as a physician the eyes of Tobias, and cleared away his blindness.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 18:1-10
      text: At that time, the disciples came to Jesus, saying, "Who, thinkest thou, is the greater in the kingdom of heaven?" And Jesus, calling unto Him a little child, set him in the midst of them, and said, "Amen I say to you, unless you be converted, and become as little children, you shall not enter into the kingdom of heaven. Whosoever therefore shall humble himself as this little child, he is the greater in the kingdom of heaven. And he that shall receive one such little child in My name, receiveth Me. But he that shall scandalize one of these little ones that believe in Me, it were better for him that a millstone should be hanged about his neck, and that he should be drowned in the depth of the sea. Woe to the world because of scandals! For it must needs be that scandals come, but nevertheless woe to that man by whom the scandal cometh! And if thy hand, or thy foot scandalize thee, cut it off, and cast it from thee. It is better for thee to go into life maimed or lame, than having two hands or two feet, to be cast into everlasting fire. And if thy eye scandalize thee, pluck it out, and cast it from thee. It is better for thee having one eye to enter into life, than having two eyes to be cast into hell fire. See that you despise not one of these little ones, for I say to you, that their Angels in heaven always see the face of My Father Who is in heaven."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Commentary on Matthew, Bk. 3 (on Matt 18:1-10)
      text: |-
        After the finding of the piece of money in the fish's mouth, after the payment of the tribute, what meaneth this sudden question of the Apostles? Who is the greatest in the kingdom of heaven? They had seen that the same tribute-money was paid for Peter as for the Lord, and from this equality of reckoning they gathered that Peter was Prince of all the Apostles, seeing that he had been appraised at the same price as his Master. Therefore they ask, Who is the greatest in the kingdom of heaven? And Jesus, seeing their thoughts, and understanding wherefore they erred, is fain to take away the desire of glory by the love of lowliness.

        Therefore, if thy hand or thy foot offend thee, cut them off, and cast them from thee; for it must needs be that offences come, but woe to that man by whom the offence cometh! because by his sin he maketh, and maketh to be his own work, that which must needs be in the world. Away, then, with every affection and every kinship, lest thy love should throw a stumbling-block before a single believer. Be there any, saith He, who is as near to thee as thine hand, thy foot, or thine eye, useful, careful, far-seeing, but who layeth a stumbling-block before thee, and whose diverse way of life may draw thee to hell; it is better for thee to lose such an one and thy worldly happiness with him, than to live surrounded by them that are near and needful to thee, and to pile up unto thyself damnation.

        I say unto you that in heaven their angels do always behold the face of My Father. Above, He had said that every tie of kinship or of convenience which might become a stumbling-block, albeit close and needful as hand, or foot, or eye, was to be cut off, but here He softeneth the hardness of that precept: Take heed that ye despise not one of these little ones. Hardness, saith He, I command not save as teaching tenderness withal; in heaven their Angels do always behold the face of My Father. Oh, how great is the dignity of souls, whereof every one hath from its birth an Angel appointed to guard it! Hence, we read in the Revelation of John: unto the Angel of the Church of Ephesus, and so of the others, write, and so on. And the Apostle Paul also saith: The woman ought to have a covering on her head, because of the Angels.
      status: verified

