nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Jerome, On Illustrious Men, ch. 9; Commentary on Galatians, Book 3, ch. 6
      text: |-
        The Apostle John whom Jesus loved was a son of Zebedee, and brother of the Apostle James, who was beheaded by Herod soon after our Lord suffered. He was the last of the Evangelists to write his Gospel, which he published at the request of the Bishops of Asia, against Cerinthus and other heretics, and particularly against the then spreading doctrine of the Ebionites, who asserted that Christ had had no existence before Mary. It was therefore needful for the Evangelist to declare His Eternal and Divine Generation.

        In the fourteenth year after Nero, Domitian stirred up the second persecution, and John was exiled to the island of Patmos, where he wrote his Apocalypse, which hath been explained by Justin the Martyr and Irenaeus. When Domitian was killed, the Senate annulled all his acts, on account of his savage cruelty, and the Apostle returned to Ephesus, during the reign of Nerva. He remained at Ephesus until the time of Trajan, and founded and governed all the Churches of Asia. There, in an extreme old age, he died, in the sixty-eighth year after the Lord's passion, and was buried near the city.

        The Blessed Evangelist John lived at Ephesus down to an extreme old age, and, at length, when he was with difficulty carried to the Church, and was not able to exhort the congregation at length, he was used simply to say at each meeting, My little children, love one another. At last the disciples and brethren were weary with hearing these words continually, and asked him, Master, wherefore ever sayest thou this only? Whereto he replied to them, (worthy of John,) It is the commandment of the Lord, and if this only be done, it is enough.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 21:19-24
      text: 'At that time, Jesus said to Peter: Follow Me. Peter, turning about, saw the disciple whom Jesus loved following, who also had leaned on His breast at supper, and said: Lord, who is he that shall betray Thee? Him therefore when Peter had seen, he saith to Jesus: Lord, and what shall this man do? Jesus saith to him: So I will have him to remain till I come, what is it to thee? Follow thou Me. This saying therefore went abroad among the brethren, that that disciple should not die. And Jesus did not say to him: He should not die; but, So I will have him to remain till I come, what is it to thee? This is that disciple who giveth testimony of these things, and hath written these things; and we know that his testimony is true.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine of Hippo, Tractate 124 on John (on John 21:19-24)
      text: |-
        The Church knoweth of two different lives, which God hath revealed and blessed: one is the life of faith, the other the life of knowledge; one the life of this pilgrimage, the other the life of the eternal mansions; one the life of work, the other the life of rest; one the life of the journey, the other the life of home; one the life of action, the other the life of contemplation. The one escheweth evil and doeth good; the other hath no evil to eschew, and only an exceeding good to enjoy. The one striveth with the enemy, the other hath no enemies, and reigneth.

        The one succoureth the needy; the other is where there are no needy to succour. The one forgiveth them that trespass against it, that its own trespasses may be forgiven; the other neither hath trespasses to forgive nor to be forgiven. The one is chastened with evil, lest it be exalted above measure by good; the other enjoyeth such a fulness of grace that it feeleth no evil, and cleaveth so firmly unto the Highest Good, that it hath no temptation to pride.

        Therefore the one is good, but still sorrowful; the other is better and perfectly blessed. And of these two lives there are types, of the one in the Apostle Peter, of the other in John. The one laboureth here even unto the end, and findeth its end hereafter; the other stretcheth out into the hereafter, and in eternity findeth no end. Therefore is it said unto the one, Follow Me; but of the other, If I will that he tarry till I come, what is that to thee? Follow thou Me. What is the meaning of these words? who can know? who can understand? what is it? is it Follow thou Me, imitating Me in the bearing of earthly sorrow; let him tarry till I come again, bringing the everlasting reward?
      status: verified

octave-readings/~-octave-day-8:
  source: Tract of St. Augustine, Bishop, on John; Homily of St. John Chrysostom
  text: |
    Of the Four Evangelists, or, rather, the four writers of the one Evangel, the holy Apostle John hath not unworthily been compared by spiritual writers to an eagle, because of the lofty and glorious flight of his teaching, soaring above the other three — a flight that raiseth not himself alone, but also the hearts of all, whosoever will hear him. The other three writers walk with the Lord upon earth, as with a man, and enlarge little upon His Godhead; but John, as though it had wearied him to walk upon earth, in the very first words of his writing riseth not above the earth only, or above the firmament and the heavens, but above every angel, and above every power of things unseen, and flieth directly to Him by Whom all things were made, saying: "In the beginning was the Word, and the Word was with God, and the Word was God."

    Then he goeth on worthily of such a beginning, and speaketh of the Lord's Godhead as none hath ever spoken, uttering freely the things which he had heard. It is not without cause that it is told of him in that Gospel how he lay on Jesus' Breast at supper. Truly he drank secretly from that Breast, and what he drank secretly he hath uttered openly, that all men may know not only how the Son of God became man, suffered, and rose again for us, but likewise how He was with the Father before He took flesh — the Only-Begotten Son, the Word of the Father, co-eternal with Him that begat Him, equal to Him That sent Him.

    John is an eagle that soareth up to the things that are not made, and fixeth his eye unquailing upon the secret and eternal Light. It is said that the father-eagle taketh his young in his talons and flieth with them, that they may look at the sun. Them that look at it boldly, he acknowledgeth for his own offspring, but them whose eyes shrink, he letteth fall from his claws as bastards. Let us consider, then, how mightily he must speak who is likened to an eagle; and yet we who are reptiles crawling on earth, weak, and of small consideration even among men, dare take in hand these utterances, to treat of them and to explain them, and think that our intelligence understandeth them, or our speech commendeth them.

    Christ had made known great things to Peter, charged him with the care of the whole world, announced to him his future martyrdom, and given him testimony of His especial love. Peter then would have John for a fellow and helper, and he said, "What shall this man do?" as it were: "Shall not he also follow the same path with me?" At the supper, when Peter would ask a question of the Lord, he dared not, but got John for his spokesman; and now Peter asketh that which he thought John fain would know, but dared not ask for himself. Christ saith unto him: "If I will that he tarry till I come, what is that to thee?"

    Peter asked because of his great love for John, hoping not to be parted from him, and Christ answered him, that with whatever affection he loved him, he could not love him as He loved him. "If I will that he tarry till I come, what is that to thee?" Let us learn from these words, by the teaching of Christ, neither to chafe, nor to enquire too curiously, where the will of God is concerned. For when Peter would be still asking, the Lord at length checked him in these words for his continued curiosity.

    Then went this saying abroad among the brethren, that that disciple should not die; yet Jesus said not unto him, "He shall not die"; but, "If I will that he tarry till I come, what is that to thee?" That is, He would not have it thought that He had disposed of them both in the same way. He spoke thus that He might check the untimely motion of affection, and the desire to continue the old companionship. The Apostles were about to take in charge the whole earth, and it behoved them no more to continue together, lest the world should suffer thereby. Therefore the Lord saith to Peter: "Thou hast received thy task; bend thyself to it, and do it; work and fight. What is it to thee if I will that he tarry here? Turn thou to thine own appointed labour, and finish it."
  responsory: |
    R. Right worthy of honour is the blessed Apostle John, who leaned on the Lord's bosom at the Last Supper. * To Him did Christ upon the Cross commit His mother, virgin to virgin. V. The Lord chose him for his clean maidenhood, and loved him more than all the rest. R. To him did Christ upon the Cross commit His mother, virgin to virgin.
  status: verified
