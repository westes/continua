collect:
  text: |
    Let us pray.
    O Lord, we beseech thee, absolve thy people from their offences, that through thy bountiful goodness we may all be delivered from the bands of those sins, which by our frailty we have committed.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'For she said within herself: * If I may but touch the hem of His garment, I shall be whole.'
  status: verified

magnificat-antiphon:
  text: 'But Jesus turned Him about, * and when He saw her, He said: Daughter, be of good comfort; thy faith hath made thee whole, alleluia.'
  status: verified

nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 9:18-26
      text: At that time, as Jesus was speaking to the crowds, behold, a ruler came up and worshipped Him, saying, “Lord, my daughter has just now died; but come and lay Your hand upon her, and she will return to life.” And Jesus arose and followed him, and so did His disciples. Now a woman who for twelve years had been suffering from hemorrhage, came up behind him and touched the tassel of His cloak saying to herself, “If I touch but His cloak I shall be saved.” But Jesus, turning and seeing her, said, “Take courage, daughter; your faith has saved you.” And the woman was restored to health from that moment. And when Jesus came to the ruler's house, and saw the flute players and the crowd making a din, He said, “Begone, the girl is asleep, not dead.” And they laughed Him to scorn. But when the crowd had been put out, He went in and took her by the hand; and the girl arose. And the report of this spread throughout all that district.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Jerome, Priest, Book 1, Commentary on Matthew 9
      text: |-
        The eighth miracle took place upon the occasion when a certain ruler, desiring not to be kept out of the mystery of the true circumcision, besought Christ to recall his daughter to life. But a woman, which was diseased with an issue of blood, thrust herself in, and her cure occupieth the eighth place, so that the resurrection of the ruler's daughter is postponed and made the ninth in enumeration even as it is written in the Psalms: "Ethiopia shall soon stretch forth her hands unto God" (lxvii. 32). And again: "Blindness in part is happened to Israel, until the fullness of the Gentiles is come in and so all Israel shall be saved" (Rom. xi. 25, 26).

        "And, behold, a woman, which was diseased with an issue of blood, twelve years, came behind Him, and touched the hem of His garment." In the Gospel according to Luke (viii. 42) it is written that the ruler's daughter was about twelve years of age. Note therefore that this woman, who typifies the Gentiles, had been diseased for the same time that the Jewish nation, typified by the ruler's daughter, had been living in faith. We see not clearly the hideousness of evil, until we compare it with good.

        This woman with the issue of blood came not to the Lord in an house or in a city, for such as she were by the Law banished out of cities (Lev. xv. 25), but in the way, as He walked so that the Lord healed one, even while He was on the road to heal another. Whence also the Apostles said: "It was necessary that the word of God should first have been spoken to you but, seeing ye put it from you, and judge yourselves unworthy of everlasting life, lo, we turn to the Gentiles" (Acts xiii. 46).
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
