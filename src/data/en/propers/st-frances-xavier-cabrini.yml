collect:
  text: |
    Let us pray.
    O Lord Jesus Christ, who, to win souls for thyself, led thy holy virgin Frances,
    burning with love for thy most Sacred Heart, on many journeys throughout the world,
    and through her raised up a new family of Virgins within thy Church, grant, we
    beseech thee, that by her intercession we may put on the virtues of that same Heart
    and be found worthy to reach the eternal haven of happiness.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God,
    world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O Lord Jesus Christ, who, to win souls for thyself, led thy holy virgin Frances, burning with love for thy most Sacred Heart, on many journeys throughout the world, and through her raised up a new family of Virgins within thy Church, grant, we beseech thee, that by her intercession we may put on the virtues of that same Heart and be found worthy to reach the eternal haven of happiness.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: Frances Xavier, born in the town of Sant'Angelo in the diocese of Lodi, from her earliest years dedicated her life to God. When she was thirteen years old, she vowed virginity to the Most Sacred Heart of Jesus. She then taught at Lodi and thereafter the Bishop appointed her directress of an orphanage and also urged her to found a new religious congregation which would be devoted to the missions. And so, when she was thirty years old, in the chapel of Our Lady of Grace at Codogno, she laid the foundation of the Institute of the Missionary Sisters of the Sacred Heart. She was uncertain where to undertake missionary work, but when Leo XIII told her to go West she recognized in his word the will of God. She traveled across the ocean twenty-four times and earned the title of mother of the Italians in North America. Her mind and heart were in constant union with God in whom her confidence was implicit. She hailed the Blessed Virgin Mary as the Mother of her Congregation. She effected the wonderful spread of her Institute as is evidenced from the fact that she established sixty-seven houses. Finally, her life came to an end at Chicago on December 22, 1917, and her remains were translated to New York. She was beatified by Pius XI, whereas Pius XII added her name to the list of holy Virgins.
      status: verified
