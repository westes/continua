        antiphon: What are these wounds in the midst of thy hands?
      - psalms:
          - 8
        antiphon: With these I was wounded in the house of them that loved me.
    versicle:
      v: He was wounded for our iniquities.
      r: He was bruised for our sins.
  nocturn3:
    groups:
      - psalms:
          - 95
        antiphon: They have dug my hands and feet; they have numbered all my bones.
      - psalms:
          - 96
        antiphon: Except I shall see in his hands the print of the nails, and put my finger into the place of the nails, and put my hand into his side, I will not believe.
      - psalms:
          - 97
        antiphon: Put in thy finger hither, and see my hands; and bring hither thy hand, and put it into my side.
    versicle:
      v: The chastisement of our peace was upon him.
      r: And by his bruises we are healed.

