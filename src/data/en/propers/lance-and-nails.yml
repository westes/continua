collect:
  text: |
    Let us pray.
    O God, who, in the weakness of the flesh which thou didst assume, wast pleased to be fastened with nails and wounded with a lance for the salvation of the world: mercifully grant that we who on earth venerate the solemnity of these same Nails and Lance may rejoice in heaven at the glorious triumph of thy victory:
    Who livest and reignest with God the Father, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    Hail, nails and lance,
    lately overgrown with filth,
    which, sunk in the body of Christ,
    glow red with his gracious blood.

    The faithless Jewish people
    had chosen you for crime;
    but God from heaven turned you
    into servants of grace.

    For as many wounds as you once cut
    in those sacred limbs,
    from so many opened fountains
    heavenly gifts flow forth.

    O Jesus, pierced by nails and lance,
    to thee be glory,
    with the Father and the loving Spirit,
    now and for evermore. Amen.
  status: draft

matins-invitatory:
  text: Christ, wounded by the lance and the nails, * O come, let us adore.
  status: draft

lauds-capitulum:
  text: 'Who is he that overcometh the world, but he that believeth that Jesus is the Son of God? This is he that came by water and blood, Jesus Christ: not by water only, but by water and blood.'
  citation: 1 John 5:5-6
  status: draft

lauds-hymn:
  text: |
    Turn upon me, then, the point
    stained with the blood of Christ;
    strike my heart, my feet, my hands;
    take the penalty from the guilty one.

    But I beg: the wounds you rightly
    deal for my debts, smeared with divine blood,
    let them become the medicines of my spirit.

    Let my step be powerless for evil,
    let my hands cease from doing harm,
    and from my wounded heart
    let every unholy fire go out.

    O Jesus, pierced by nails and lance,
    to thee be glory,
    with the Father and the loving Spirit,
    now and for evermore. Amen.
  status: draft

lauds-versicle:
  text: |
    V. They have dug my hands and feet.
    R. They have numbered all my bones.
  status: draft

prime-chapter/responsory-~:
  text: |
    R.br. Christ, Son of the living God, * have mercy on us.
    R. Christ, Son of the living God, * have mercy on us.
    V. Thou who wast wounded for us.
    R. Have mercy on us.
    V. Glory be to the Father, and to the Son, * and to the Holy Ghost.
    R. Christ, Son of the living God, * have mercy on us.
  status: draft

prime-lectio:
  text: 'Who his own self bore our sins in his body upon the tree: that we, being dead to sins, should live to justice: by whose stripes you were healed.'
  citation: 1 Peter 2:24
  status: draft

terce-capitulum:
  text: |
    Who is he that overcometh the world, but he that believeth that Jesus is the Son of God? This is he that came by water and blood, Jesus Christ: not by water only, but by water and blood.
    R. Thanks be to God.
    V. Whom thou hast smitten, they have persecuted.
    R. And they have added to the grief of my wounds.
  citation: 1 John 5:5-6
  status: draft

sext-capitulum:
  text: |
    Brethren: Christ suffered for us, leaving you an example that you should follow his steps. Who did no sin, neither was guile found in his mouth.
    R. Thanks be to God.
    V. He was wounded for our iniquities.
    R. He was bruised for our sins.
  citation: 1 Peter 2:21-22
  status: draft

none-capitulum:
  text: |
    Who his own self bore our sins in his body upon the tree: that we, being dead to sins, should live to justice: by whose stripes you were healed.
    R. Thanks be to God.
    V. The chastisement of our peace was upon him.
    R. And by his bruises we are healed.
  citation: 1 Peter 2:24
  status: draft

vespers-hymn:
  text: |
    What tongue, O Lance, is fit
    to render thee thanks as thou dost deserve?
    For thou openest the life-giving side of Christ,
    whence the Church is born.

    This is Eve, coming forth from the side of the man,
    while heavy sleep took hold of his limbs;
    for the second Adam brings her forth
    from a heart welling with water and blood.

    O Nails, as great thanks await you also,
    since, fixed in the sacred limbs of Christ,
    you fasten to the Cross, blotted out in the Lord's blood,
    the bond of death.

    Let the heavenly host extol thee with praises, Jesus,
    who keepest in heaven the openings of the Nails
    and the marks of the Lance, where thou livest and reignest
    with the Father and the Paraclete. Amen.
  status: draft

