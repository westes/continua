        antiphon: But when they came to Jesus, they did not break his legs, but one of the soldiers opened his side with a lance.
      - psalms:
          - 2
        antiphon: Blood and water came out; and he that saw it hath given testimony, and his testimony is true.
      - psalms:
          - 3
        antiphon: 'Another scripture saith: They shall look on him whom they pierced.'
    versicle:
