nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Anastasius, a Roman, the son of Maximus, was ordained bishop of the Roman Church when Siricius had passed from life; and while he was nobly governing it, a savage storm of Origenist heretics from the regions of the East tried to pollute and shake the simplicity of the faith which was praised by the voice of the Apostle. But Anastasius, a man of richest poverty and apostolic solicitude, at once crushed the noxious head and silenced the hissing mouths of the hydra, and, pursuing the heretics lurking in their holes, he condemned in the West by his letters what had been condemned in the East. Nor was there ever lacking in him care to keep the faith of the Gospel among his peoples, and to address, as far as he could by letters, the parts of his people spread through various regions of the earth, lest any origin of profane interpretation creep in and shake devout souls by its imported darkness.

        To him, and to Venerius, priest of the church of Milan, the African synod sent a bishop as legate, that help might be given to the same African church, in great need of sacred ministers, lest in various almost lifeless congregations (in which not even one deacon or literate person was to be found) innumerable souls perish. To the same African bishops Anastasius sent a letter, exhorting them with the solicitude and sincerity of paternal and fraternal charity not in any way to overlook the snares and wickedness of the heretics and schismatic Donatists, with which they vexed the African Catholic church. By the authority likewise of this holy Pontiff it was brought about that Donatist bishops, or any clerics, as far as ecclesiastical offices were concerned, should be received into Catholic unity as seemed expedient for those whose salvation was being provided for through their office, whether to be exercised or omitted.

        He ordained that no man from overseas be received into the honour of the clergy without the written testimony of five bishops. He likewise decreed that whenever the holy Gospels were recited, priests should not sit but stand bowed. He built in the City the Crescentian basilica in the second region, on the Mamertine Way. After two ordinations in the month of December, in which he created eight priests, five deacons, and ten bishops for various places, he rested in peace, and was buried in his own cemetery at the Bear in the Cap, under Arcadius and Honorius: whom (as St. Jerome writes) Rome long did not deserve to have, lest the head of the world be cut off under such a Bishop; indeed, therefore he was snatched away and translated, lest he try to bend by his prayers a sentence already passed; for not long after his death, Rome was taken and ruined by the Goths.
      status: draft
