  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        John de la Mata, the founder of the Order of the Most Holy Trinity for the Ransom of Prisoners, was born at Faucon, in Provence, and was the child of parents equally distinguished for their rank and their godly life. He went for his education first to Aix and then to Paris. At the University of Paris, where he went through the course of Divinity and took the degree of Doctor, he became eminent for learning and virtue. For this reason the Bishop of Paris ordained him Priest, an honour from which his lowliness caused him to shrink, in the hope that he should induce him to remain at Paris, and be a bright example of wisdom and manners to the students who resorted thither. He offered up the Holy Sacrifice to God for the first time in the private Chapel of the Bishop, and in the presence of that Prelate and diverse other persons. In the midst of the ceremony, a vision from God appeared to John. There appeared to him an angel, clad in raiment white and glistering; having sewn on his breast a cross of red and blue. His arms were crossed before him, and his hands were upon the heads of two slaves, one a Christian and the other a Moor. And immediately the man of God was in the spirit, and knew that he was called to the work of ransoming bondsmen from the power of the unbelievers.

        That he might set himself with due forethought to the carrying out of his work, he withdrew into a certain desert, and there, by the will of God, he found Felix de Valois, who had already spent many years in that place. With him he joined company, and they passed three years together in continual prayer, meditation, and all spiritual exercises. It came to pass, one day, when they were sitting on the bank of a spring, that there came to them a stag having between his horns a cross of red and blue. Felix cried out in wonder at that sight, and John then told him of the vision that had appeared to him when he was saying his first Mass. Thenceforth they gave themselves with redoubled fervour to prayer, and, being three times warned in sleep, they determined to go to Rome, and pray the Pope to institute an Order for the ransom of prisoners. They arrived at the time of the election of Innocent III., who received them courteously, and entertained in his mind their petition. While he was in consideration, he went to the Lateran Cathedral, on the second Feast of St. Agnes, and there, while Mass was being solemnly sung, at the moment of the elevation of the Sacred Host, there appeared to him an angel, clad in raiment white and glistering, having sewn on his breast a cross of red and blue, and making as though he would free prisoners. Thereupon the Pope founded the Order, commanding that it should be called the Order of the Most Holy Trinity for the Ransom of prisoners, and that they who professed in it should be clad in white raiment, having sewn on their breasts a cross of red and blue.

        The Order being thus established, the holy Founders returned into France, and built their first Convent at Cerfroid, in the diocese of Meaux. Felix remained in charge of this house, and John went back to Rome with several companions. To them Innocent gave the house, Church, and hospital of St. Thomas de Formis on the Coelian Mount, with great endowments and property. Moreover he gave them a letter of introduction to Miramolin, King of Morocco, and they began with bright hopes the work of ransoming prisoners. John next betook himself to Spain, great part of which was then in the hands of the Saracens, and stirred up the hearts of the kings, princes, and all the faithful to have pity on slaves and the poor. He built Convents, founded Hospitals, and ransomed many bondsmen, to the great gain of souls. At last he returned to Rome, still busied in good works, but worn out by unceasing toil, and weakened by sickness. As he drew near the end of his earthly pilgrimage, his burning love for God and for his neighbour suffered no diminution. He called together his brethren, and earnestly exhorted them to go on with that work of ransom which had been pointed out to them from heaven, and then fell asleep in the Lord, on the 21st day of December, 1213. His body was buried with due honour in the Church of St. Thomas de Formis.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 12:35-40
      text: At that time, Jesus said to His disciples, Let your loins be girt about and your lamps burning, and you yourselves like men waiting for their master's return from the wedding; so that when he comes and knocks, they may straight-way open to him. Blessed are those servants whom the master, on his return, shall find watching. Amen I say to you, he will gird himself, and will make them recline at table, and will come and serve them. And if he comes in the second watch, and if in the third, and finds them so, blessed are those servants! But of this be assured, that if the householder had known at what hour the thief was coming, he would certainly have watched, and not have let his house be broken into. You also must be ready, because at an hour that you do not expect, the Son of Man is coming.
      status: verified
    - nocturn: 3
      isGospel: false
      source: Pope St. Gregory the Great, Homily 13 on the Gospels (on Luke 12:35-40)
      text: |-
        Dearly beloved brethren, the words of the Holy Gospel, which have just been read, lie open before you, and, lest their very plainness should make them seem to some to be hard, we will go through them with such shortness as that neither may they which understand not remain unenlightened, nor they which understand be wearied. The Lord saith Let your loins be girded about. Now, we gird our loins about, when by continency we master the lustful inclination of the flesh. But, forasmuch as it sufficeth not for a man to abstain from evil deeds, if he strive not to join thereto the earnest doing of good works, it is immediately added And your lights burning. Our lights burn when, by good works, we give bright example to our neighbour; concerning which works the Lord saith Let your light so shine before men, that they may see your good works, and glorify your Father Which is in heaven.

        Here, then, are two commandments, to gird our loins about, and to keep our lights burning the cleanness of purity in our body, and the light of the truth in our works. Whoso hath the one and not the other, pleaseth not thereby our Redeemer; that is, he pleaseth Him not which doth good works, but bridleth not himself from the pollutions of lust, neither he which is eminent in chastity, but exerciseth not himself in good works. Neither is chastity a great thing without good works, nor good works anything without chastity. And if any man do both, it remaineth that he must look by hope toward our Fatherland above, and not have for his reason wherethrough he turneth himself away from vice, the love of honour in this present world.

        And ye yourselves like unto men that wait for their lord, when he will return from the wedding that, when he cometh and knocketh, they may open unto him immediately. The Lord cometh at the hour of judgment He knocketh when, by the pains of sickness, He biddeth us know that death is nigh. To Him open we immediately, if we receive Him in love. Whoso feareth to leave this body, will not open to the Judge when He knocketh, for he dreadeth to see that Judge, Whom he knoweth that he hath despised. But whosoever knoweth that his hope and works are built upon a good foundation, when he heareth the Judge knock, openeth to Him immediately, for to such an one that coming is blessed, yea, when the hour of death is at hand, such an one haileth with gladness a glorious reward.
      status: verified
