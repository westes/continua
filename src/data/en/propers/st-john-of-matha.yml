collect:
  text: |
    Let us pray.
    O God, Who by a sign from heaven didst choose thy holy servant John to be the founder of
    the Order of the Most Holy Trinity for the Ransom of Prisoners held in the power of the
    Saracens, mercifully grant unto us for his sake that we may be delivered by thine
    Almighty power from all bonds and chains of sin, whether in our bodies or in our souls.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, Who by a sign from heaven didst choose thy holy servant John to be the founder of
    the Order of the Most Holy Trinity for the Ransom of Prisoners held in the power of the
    Saracens, mercifully grant unto us for his sake that we may be delivered by thine
    Almighty power from all bonds and chains of sin, whether in our bodies or in our souls.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
