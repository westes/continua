collect:
  text: |
    Let us pray.
    O Lord, we beseech thee, mercifully incline thine ears unto our prayers, and lighten the darkness of our minds by the grace of thy heavenly visitation.
    Who livest and reignest with God the Father in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: verified

lauds-capitulum:
  text: 'Brothers: Rejoice in the Lord always; again, I say, rejoice. Let your modesty be known to all men. The Lord is nigh.'
  citation: Phil 4:4-5
  status: verified

lauds-hymn:
  text: |
    Hark, a herald voice is calling;
    “Christ is nigh,” it seems to say;
    “Cast away the dreams of darkness,

    Oye children of the day.”

    Startled at the solemn warning,
    Let the earth-bound soul arise;
    Christ, her sun, all sloth dispelling,
    Shines upon the morning skies.

    Lo, the Lamb, so long expected,
    Comes with pardon down from heaven;
    Let us haste, with tears of sorrow,
    One and all to be forgiven.

    So when next he comes with glory,
    Wrapping all the earth in fear,
    May he then as our defender
    On the clouds of heaven appear.

    Honour, glory, virtue, merit,
    To the Father and the Son,
    With the co-eternal Spirit,
    While eternal ages run.
    Amen.
  status: verified

lauds-responsory:
  text: |
    R.br. Come to my rescue, * O God, Lord of hosts.
