collect:
  text: |
    Let us pray.
    Look down mercifully, O Lord, we beseech thee, upon thy people, and graciously turn away from them the scourges of thy wrath.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Jesus took His disciples, * and went up into a mountain, and was transfigured before them.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matt 17:1-9
      text: At that time, Jesus took Peter, James and his brother John, and led them up a high mountain by themselves, and was transfigured before them. And His face shone as the sun, and His garments became white as snow. And behold, there appeared to them Moses and Elias talking together with Him. Then Peter addressed Jesus, saying, Lord, it is good for us to be here. If You will, let us set up three tents here, one for You, one for Moses, and one for Elias. As he was still speaking, behold, a bright cloud overshadowed them, and behold, a voice out of the cloud said, This is My beloved Son, in Whom I am well pleased; hear Him. And on hearing it the disciples fell on their faces and were exceedingly afraid. And Jesus came near and touched them, and said to them, Arise, and do not be afraid. But lifting up their eyes, they saw no one but Jesus only. And as they were coming down from the mountain, Jesus cautioned them, saying, Tell the vision to no one, till the Son of Man has risen from the dead.
      status: verified
    - nocturn: 1
      isGospel: false
      source: Pope St. Leo the Great, homily on the Transfiguration of the Lord
      text: |-
        Dearly beloved brethren, the Lesson from the Holy Gospel which, entering in by our bodily ears, hath knocked at the door of our inner mind, calleth us to understand a great mystery. This, by the grace of God, we shall the more readily do, if we return to consider what hath been told us just before. The Saviour of mankind, even Jesus Christ, laying the foundations of that faith whereby the ungodly are called to righteousness and the dead to life, instilled into the minds of His disciples, both by the voice of His teaching and the wonder of His works, that they should believe Him, the one Christ, to be both the Only-begotten Son of God and the Son of man. Had they believed Him one of these and not the other, it had availed them nothing to salvation; and the danger was equally great, of holding the Lord Jesus Christ to be God without the Manhood, or Man only without the Godhead, since we are constrained to acknowledge that He is perfect God and perfect Man, and that as there is in the Godhead perfect Manhood, so there is in the Manhood perfect Godhead.

        To strengthen, therefore, the saving knowledge of this faith, the Lord had asked His disciples what, among the differing opinions of men, it was their own belief and judgment as to Who He was. Then did the Apostle Peter, by the revelation of That Father Who is above all, rising above fleshly things, yea, outstripping the thoughts of men, then did he fix the eyes of his mind upon the Son of the living God, and confess the glory of the Godhead, for he looked not on the substance of the flesh and blood only. And in all the exaltation of this faith so well did he please God, that he was gifted with that joyous blessing, the hallowed establishment of that impregnable rock, whereon the Church being founded, should prevail against the gates of hell and the laws of death; neither, when anything is to be bound or loosed, is any bound or loosed in heaven, otherwise than as the judgment of Peter hath bound or loosed it upon earth.

        But, dearly beloved brethren, it behoved that the height of this understanding, which the Lord praised, should rest upon a foundation, and that foundation, the mystery of the lower nature, lest the faith of the Apostle, carried away by the glorious acknowledgment of the Godhead in Christ, should deem it unworthy and unnatural for the impassible God to take into Himself the frailty of our nature; and should thus believe that in Christ the Manhood had been so glorified as to be no longer able to suffer pain, or be dissolved in death. And therefore it was that, when the Lord said how that He must go up unto Jerusalem, and suffer many things of the elders and chief priests, and scribes, and be killed, and rise again the third day, and the blessed Peter, bright with heavenly illumination, and still glowing from the passionate acknowledgment of the Divine Sonship, by a natural, and, as seemed to him, a godly shrinking, could not bear the mention of mockery and insult and a cruel death, he was corrected by the merciful rebuke of Jesus, and moved rather to desire to be a partaker in the sufferings of his Master.
      responsory: |-
        R. Shut up alms in the breast of the poor, and it shall plead for you with the Lord. * For, as water will quench fire, so alms maketh an atonement for sins.
        V. Give alms, and, behold, all things are clean unto you.
        R. For, as water will quench fire, so alms maketh an atonement for sins.
      status: verified
