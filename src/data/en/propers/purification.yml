benedictus-antiphon:
  text: 'When His parents * brought in the Child Jesus, then took Simeon Him up in his arms, and blessed God, and said: Now lettest Thou thy servant depart in peace.'
  status: verified

magnificat-antiphon:
  text: This day did the Blessed Virgin Mary * present the Child Jesus in the temple; and Simeon, filled with the Holy Ghost, took Him up in his arms, and blessed God for ever and ever.
  status: verified

