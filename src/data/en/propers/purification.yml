vespers-psalmody:
  groups:
    - psalms:
        - 109
      antiphon: Simeon was just * and devout, waiting for the consolation of Israel, and the Holy Ghost was upon him.
    - psalms:
        - 112
      antiphon: It was revealed unto Simeon * by the Holy Ghost that he should not see death before he had seen the Lord.
    - psalms:
        - 121
      antiphon: Simeon took * the Child up in his arms, and gave thanks, and blessed the Lord.
    - psalms:
        - 126
      antiphon: They offered for Him * unto the Lord, a pair of turtle doves, or two young pigeons.

vespers-psalmody/~-first:
  groups:
    - psalms:
        - 109
      antiphon: 'O wondrous interchange! * the Creator of mankind, taking upon him a living body, vouchsafed to be born of a pure Virgin: and by his Humanity, which was begotten in no earthly wise, hath made us partakers of his Divinity.'
    - psalms:
        - 112
      antiphon: When thou wast born * all ineffably of a Virgin, then were the Scriptures fulfilled; thou camest down like the dew upon the fleece of wool, to bring salvation unto all mankind; we praise thee, O our God.
    - psalms:
        - 121
      antiphon: 'In the bush which Moses saw * unconsumed, we recognize the preservation of thy glorious virginity: holy Mother of God, intercede for us.'
    - psalms:
        - 126
      antiphon: 'Lo, Mary hath brought forth * the Saviour of whom when John saw him, he did proclaim: Behold the Lamb of God that taketh away the sins of the world.'

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Augustine of Hippo, Sermon 13 de Tempore
      text: |-
        In old time it was written: And of Zion shall it not be said This and that man was born in her, and the Highest Himself shall establish her? Blessed be the omnipotence of Him That was born! Blessed the glory of Him That came from heaven to earth! While yet He was borne in His Mother's womb, He was saluted by John the Baptist; He was presented in the temple, and recognised by that famous, ancient, and glorious worthy, the old man Simeon. As soon as he knew Him he worshipped Him, and said Lord, now lettest Thou thy servant depart in peace for mine eyes have seen thy Salvation.

        He lingered in the world to see the birth of Him Who made the world. The old man knew the Child, and in that Child became a child himself, for in the love wherewith he regarded the Father of all, he felt his own years to be but as of yesterday. The old man Simeon bore the new-born Christ, and all the while, Christ was the old man's Lord. It had been told him by the Lord that he should not taste of death before he had seen the birth of the Lord's Christ. Now Christ is born, and all the old man's wishes on earth are fulfilled. He That came to a decrepit world came to an old man.

        He wished not to remain long in the world, but he longed to see Christ in the world, singing with the Prophet, and saying: Show us thy mercy, O Lord, and grant us thy salvation. And now at last, that ye may know that the cause of his joy was that this prayer was granted, he saith: Now lettest Thou thy servant depart in peace, for mine eyes have seen thy salvation. The Prophets have sung that the Maker of heaven and earth would converse on earth with men, an angel hath declared that the Creator of flesh and spirit would come in the flesh, the unborn John, yet in the womb, hath saluted the unborn Saviour yet in the womb. The old man Simeon hath seen God, a little Child.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 2:22-32
      text: 'At that time, when the days of Mary''s purification were fulfilled according to the Law of Moses, they took Jesus up to Jerusalem to present Him to the Lord — as it is written in the Law of the Lord, "Every male that opens the womb shall be called holy to the Lord" — and to offer a sacrifice according to what is said in the Law of the Lord, "a pair of turtle doves or two young pigeons." And behold, there was in Jerusalem a man named Simeon, and this man was just and devout, looking for the consolation of Israel, and the Holy Spirit was upon him. And it had been revealed to him by the Holy Spirit that he should not see death before he had seen the Christ of the Lord. And he came by inspiration of the Spirit into the temple. And when His parents brought in the Child Jesus, to do for Him according to the custom of the Law, he also received Him into his arms and blessed God, saying, "Now You dismiss Your servant, O Lord, according to Your word, in peace; because my eyes have seen Your salvation, which You have prepared before the face of all peoples: a light of revelation to the Gentiles, and a glory for Your people Israel."'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Commentary on Luke, Book II (on Luke 2:22-32)
      text: |-
        And, behold, there was a man in Jerusalem, whose name was Simeon, and the same man was just and devout, waiting for the consolation of Israel. The birth of the Lord is attested not only by Angels and Prophets, and shepherds, but also by elders and just men. Every age, and both sexes, as well as the miracles of the events themselves, are here to strengthen our faith. A virgin conceiveth, a barren woman beareth, a dumb man speaketh, Elizabeth prophesieth, the wise man worshippeth, the unborn child leapeth, the widow praiseth, and the just man waiteth.

        Well is he called just, who looked not for favour for himself, but for consolation for his people. He desired to be set free from the bondage of this frail body, but he waited to see the Promised One for he knew that blessed are the eyes that see Him. Then took he Him up in his arms, and blessed God, and said: Lord, now lettest Thou thy servant depart in peace, according to thy word. Behold a just man, confined in the weary prison of the body, desiring to be dissolved and to begin to be with Christ. For to be dissolved and to be with Christ is much better.

        Whosoever will be dissolved and be with Christ, let him come into the Temple, let him come to Jerusalem, let him wait for the Lord's Christ, let him take hold on the Word of God, let him embrace it with good works, as it were with arms of faith and then let him depart in peace, for he shall not see death, who hath seen life. Behold how the Lord's Birth doth overflow with abounding grace for all, and prophecy is not denied to the just, but to the unbelieving. Behold, Simeon prophesieth that the Lord Jesus Christ is come for the fall and rising again of many; yea, He shall separate the just from the unjust by their deserts, and according as our work shall be, so shall the true and righteous Judge command us to be punished or rewarded.
      status: verified
