collect:
  text: |
    Let us pray.
    Almighty and everliving God, we humbly beseech thy Majesty, that as thy Only-begotten
    Son was this day presented in the temple in substance of our flesh, so we may be
    presented unto thee with pure and clean hearts.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. The old man held his Lord * in his arms in the form of a little child, but the Child was the old man's King even that Child whom a virgin bore, and remained a virgin as before the fruit of her womb, and the God of her soul.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
