collect:
  text: |
    Let us pray.
    Hearken, O Lord, to our supplications; and grant that we may celebrate with devout service this solemn fast, which thou hast instituted for the healing of soul and body.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: For they seek me * from day to day, and desire to know my ways.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Mark 6:47-56
      text: At that time, when it was late, the ship was in the midst of the sea, and Jesus alone on the land. And seeing His disciples straining at the oars, for the wind was against them, about the fourth watch of the night He came to them, walking upon the sea, and He would have passed by them. But they, seeing Him walking upon the sea, thought it was a ghost, and cried out. For they all saw Him, and were troubled. Then He immediately spoke to them, and said to them, "Take courage; it is I, do not be afraid." And He got into the boat with them, and the wind fell. And they were utterly beside themselves with astonishment, for they had not understood about the loaves, because their heart was blinded. And crossing over, they came to the land of Genesareth and moored the boat. And when they had gotten out of the boat, the people at once recognized Him; and they hurried through the whole country, and began to bring the sick on their pallets, wherever they heard He was. And wherever He went, into village or hamlet or town, they laid the sick in the market places, and entreated Him to let them touch but the tassel of His cloak; and as many as touched Him were saved.
      status: verified
    - nocturn: 1
      isGospel: false
      source: The Venerable Bede, Priest, Book 2, ch. 28, on Mark 6:45
      text: |-
        The toil of the disciples in rowing, and the wind contrary to them, is a figure of the diverse toils of the Holy Church, as, amid the waves of a world that fighteth against her, and the stormy blasts of unclean spirits, she laboureth to reach the rest of her Fatherland above, as a shore safe for her anchor. Here also it is well said that the ship was in the midst of the sea, and He alone on the land; for sometimes it cometh to pass that the Church is, by the great pressure of the Gentiles, not only so afflicted, but also befouled, that it seemeth as though, if it were possible, her Redeemer had for the time forsaken her.

        Whence it is that there cometh that cry of hers, when she is taken amid the waves, and the winds of temptations that break upon her, and with piteous entreaty she calleth on Him to protect her: Why standest Thou afar off, O Lord, why hidest Thou thyself in times of trouble? And then, in the verses that follow, she telleth Him what saith the enemy that persecuted her, saying, For he hath said in his heart God hath forgotten; He hideth His face, He will never see it.

        Verily, He forgetteth not the prayer of the poor, neither turneth He His face away from any that putteth his trust in Him; yea, rather, to him whosoever is striving with the enemy, He giveth help to conquer, and, whosoever conquereth, to him He giveth an everlasting crown. For the which reason also it is here said plainly He saw them toiling in rowing. The Lord seeth them that are toiling in the sea, albeit He be Himself on the land. Although He seem for a moment to tarry in succouring the distressed, nevertheless the look of His love is strengthening them, all the while, lest they should faint; and sometimes He setteth them free, even by an open deliverance, conquering all their adversaries for them, as when He walked upon the swelling of the waves, and stilled them.
      responsory: |-
        R. I came this day unto the well, and I besought the Lord, and said: * O Lord God of Abraham, Thou hast prospered my way.
        V. Therefore the virgin to whom I shall say, Give me water of thy pitcher to drink, and she shall say to me, Drink, my lord, and I will give thy camels drink also; let the same be the woman whom the Lord hath appointed out for my master's son.
        R. O Lord God of Abraham, Thou hast prospered my way.
      status: verified
