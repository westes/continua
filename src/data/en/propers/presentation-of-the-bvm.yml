nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Joachim took to wife that most eminent and praiseworthy woman, Anne. And even as the ancient Hannah, being stricken with barrenness, by prayer and promise became the mother of Samuel, so likewise this woman also through prayer and promise received from God the Mother of God, that in fruitfulness she might not be behind any of the famous matrons. And thus grace (for such is the signification of the name of Anne) is mother of the Lady (for such is the signification of the name of Mary.) And indeed she became the Lady of every creature, since she hath been mother of the Creator. She first saw the light in Joachim's house, hard by the Pool of Bethesda, at Jerusalem, and was carried to the Temple. There planted in the Lord, the dew of His Spirit made her to flourish in the courts of her God, and like a green olive she became a tree, so that all the doves of grace came and lodged in her branches. And so she raised her mind utterly above the lust of life and the lust of the flesh, and kept her soul virgin in her virgin body, as became her that was to receive God into her womb.

        Such was Mary that her single life offereth an example to all. If then the doer displease us not, let us applaud the deed; if any other woman seek like reward, let her follow after like works. In the one Virgin how many glorious examples do shine forth. Her's was the hidden treasure of modesty, her's the high standard of faith, her's the self-sacrifice of earnestness, her's to be the pattern of maidenhood at home, of kinswomanhood in ministry, of motherhood in the Temple. O to how many virgins hath she been helpful, how many hath she taken in her arms and presented unto the Lord, saying Here is one who, (like me,) hath kept stainlessly clean the wedding -chamber, the marriage -bed of my Son!

        Why should I go on to speak of the scantiness of her eating, or of the multiplicity of her work? how her labour seemed above human capacity, and her refreshment insufficient for human strength, her toil never missing a moment, her fasting taking two days together. And when she was fain to eat, she took not dainties, but whatsoever food came first to hand that would keep body and soul together. She would not sleep till need was, and even then, while her body rested, her soul watched, for she often talked in her sleep, either repeating things that she had read, or going on with what she was doing before sleep interrupted her, or rehearsing things executed, or talking of things projected.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Luke 11:27-28
      text: At that time, as Jesus was speaking to the multitudes, a certain woman from the crowd lifted up her voice and said to Him, "Blessed is the womb that bore You, and the breasts that nursed You." But He said, "Rather, blessed are they who hear the word of God and keep it."
      status: verified
    - nocturn: 3
      isGospel: false
      source: The Venerable Bede, Commentary on Luke, Book IV, ch. 49 (on Luke 11:27-28)
      text: |-
        It is plain that this was a woman of great earnestness and faith. The Scribes and Pharisees were at once tempting and blaspheming the Lord, but this woman so clearly grasped His Incarnation, and so bravely confessed the same, that she confounded both the lies of the great men who were present, and the faithlessness of the heretics who were yet to come. Even as the Jews then, blaspheming the works of the Holy Ghost, denied the very Son of God Who is of one substance with the Father, so afterwards did the heretics, by denying that Mary always a Virgin did, under the operation of the Holy Ghost, supply flesh to the Only begotten One of God, when He was about being born in an human Body, even so, I say, did the heretics deny that the Son of Man should be called a true Son, Who is of one substance with His Mother.

        If we shall say that the Flesh, Wherewith the Son of God was born in the flesh, was something outside of the flesh of the Virgin His Mother, without reason should we bless the womb that bore Him, and the paps which He hath sucked. But the Apostle saith: "God sent forth His Son, made of a woman, made under the law", and they are not to be listened to who read this passage: "Born of a woman, made under the law." He was made of a woman, for He was conceived in a virgin's womb, and took His Flesh, not from nothing, not from elsewhere, but from the flesh of His Mother. Otherwise, and if He had not been sprung of a woman, He could not with truth be called the Son of man. Let us therefore, denying the doctrine of Eutyches, lift up our voice, along with the Universal Church, whereof that woman was a figure, let us lift up our heart as well as our voice from the company, and say unto the Saviour: Blessed is the womb that bare thee, and the paps which thou hast sucked. Blessed Mother, of whom one hath said thou art His Mother, Who reigns over earth and over heaven for ever.

        Yea, rather, blessed are they that hear the Word of God and keep it. How nobly doth the Saviour say "Yea" to the woman's blessing, declaring also that not only is she blessed who was meet to give bodily birth to the Word of God, but that all they who spiritually conceive the same Word by the hearing of faith, and, by keeping it through good works, bring it forth and, as it were, carefully nurse it, in their own hearts, and in the hearts of their neighbours, are also blessed. Yea, and that the very Mother of God herself was blessed in being for a while the handmaid of the Word of God made Flesh, but that she was much more blessed in this, that through her love she keepeth Him for ever.
      status: verified
