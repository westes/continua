collect:
  text: |
    Let us pray.
    O God, Who wast pleased that the blessed Mary always a Virgin, being herself the
    dwelling-place of the Holy Ghost, should, as on this day, be presented in thine earthly
    Temple, grant, we beseech thee, that by her prayers we may worthily be presented in the
    heavenly Temple of thy glory.
    Through the same Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in
    the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. O Blessed Mary, * Mother of God, Virgin for ever, temple of the Lord, sanctuary of the Holy Ghost, thou, without any example before thee, didst make thyself well-pleasing in the sight of our Lord Jesus Christ, alleluia.
    V. Pray for us, holy Mother of God.
    R. That we may be made worthy of the promises of Christ.
    Let us pray.
