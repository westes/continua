collect:
  text: |
    Let us pray.
    God, Who didst vouchsafe to enkindle in blessed Fidelis the fire of thy Seraphim, and
    to glorify his toil to give men a true knowledge of thee by the palm-branch of
    martyrdom and by great signs and wonders, be entreated, we beseech thee, for his sake
    and by his prayers, and so establish us in the knowledge and love of thee, that we
    also, like him, may be found faithful even unto death in serving of thee.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the
    unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. He that hateth his life * in this world, shall keep it unto life eternal.
    V. The righteous shall flourish like the palm tree:
    R. He shall grow up like the cedar of Libanus.
    Let us pray.
