collect:
  text: |
    Let us pray.
    O God, who didst deign wonderfully to rise up blessed John thy confessor, for the propagation of the faith among the Gentiles, and through him didst organize in Thy Church a new family for the instruction of the faithful, grant to us, Thy servants, so to profit by his works that we may attain unto eternal rewards
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Well done, thou good and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of thy Lord.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
