magnificat-antiphon/~-first:
  text: 'When Job heard the words * of the messengers, he suffered it patiently, and said: What! shall we receive good at the hand of the Lord, and shall we not receive evil? In all this did not Job sin with his lips, nor charged God foolishly.'
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Gregory the Great, Moralia in Job, Book 2, ch. 1
      text: |-
        The Holy Scripture is put before the eyes of our mind somewhat after the fashion of a looking-glass, that we may see therein the aspect of our inward man. Therein we see what are our unsightly, and what our comely traits; thereby we judge how we are growing, and how far yet we are from fullness of stature. The Holy Scripture telleth of the doings of the Saints, and stirreth up the heart of us weaklings to follow them. While it maketh memorial of their victorious deeds, it strengtheneth our frailty to strive against sin. And so by the words of the Scripture it cometh to pass that the soul trembleth less at the battle, for that she seeth how many times the enemies before her have been beaten by brave men.

        And sometimes the Scripture showeth unto us, not only how the Saints fought bravely, but also how they fell, that we may see by the example of the mighty, not only what weapons we must take, if we would conquer, but also what snares we must keep clear of, if we would avoid falling. For example, here is Job on the one hand, waxing nobler under trial, and on the other hand, David, tried, and failing utterly. And so the glory of the great strengtheneth our hope, and the backsliding of the same doth stir us up to be watchful and lowly, the one cheering us with gladness, and the other putting us on our guard through fear, so that the soul of him which heareth of these things may by the one gain sure and certain hope, and by the other fearfulness and watchfulness, and so neither be rashly puffed up, nor hopelessly cast down.

        There was a man in the land of Uz, whose name was Job. We are told where this holy man lived, that thereby we may gauge the worth of his bravery. Who knoweth not that Uz is a place in the countries of the Gentiles? The Gentile world had been so degraded and corrupted by sin, that they had ceased to know that they had a Maker. Therefore is it told us where Job dwelt, that it may redound to his praise that he was good in the midst of the wicked. It is not very praiseworthy to be good among the good, but to be good among the bad. For even as it is more grievous to be bad among the good, so is it right praiseworthy to have remained good among the bad.
      responsory: |-
        R. My flesh is clothed with worms and clods of dust. My skin is dry and drawn together. * Remember me, O Lord, for my life is wind.
        V. My days are swifter than a weaver's shuttle, and are spent without hope.
        R. Remember me, Lord, for my life is wind.
      status: verified
