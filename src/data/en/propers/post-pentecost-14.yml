collect:
  text: |
    Let us pray.
    Keep, we beseech thee, O Lord, thy Church with thy perpetual mercy, and because the frailty of man without thee cannot but fall, keep us ever by thy help from all things hurtful, and lead us to all things profitable to our salvation.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'Take no thought, saying: What shall we eat? * or: What shall we drink? For your Father knoweth what things ye have need of, alleluia.'
  status: verified

magnificat-antiphon:
  text: Seek ye first the kingdom of God * and His righteousness, and all these things shall be added unto you, alleluia.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 3
      isGospel: true
      citation: Matt 6:24-33
      text: 'At that time, Jesus said to His disciples: No man serve two masters; for either he will hate the one and love the other, or else he will stand by the one and despise the other. You cannot serve God and mammon. Therefore I say to you, do not be anxious for your life, what you shall eat; nor yet for your body, what you shall put on. Is not the life a greater thing than the food, and the body than the clothing? Look at the birds of the air: they do not sow, or reap, or gather into barns; yet your heavenly Father feeds them. Are not you of much more value than they? But which of you by being anxious about it can add to his stature a single cubit? And as for clothing, why are you anxious? Consider how the lilies of the field grow; they neither toil nor spin, yet I say to you that not even Solomon in all his glory was arrayed like one of those. But if God so clothes the grass of the field, which flourishes today but tomorrow is thrown into the oven, how much more you, O you of little faith! Therefore do not be anxious, saying, ‘What shall we eat?’ or, ‘What shall we drink?’ or, ‘What are we to put on?’ - for after all these things the Gentiles seek; - for your Father knows that you need all these things. But seek first the Kingdom of God and His justice, and all these things shall be given you besides.'
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Book 2 on the Lord's Sermon on the Mount, ch. 14
      text: |-
        "No man can serve two masters," and this is further explained "for either he will hate the one, and love the other; or else he will hold to the one, and despise the other." These words we ought carefully to weigh, for the Lord showeth straightway who be the two masters whom we have choice of: "Ye cannot serve God and Mammon." Mammon is a term which the Hebrews are said to use for riches. It is also a Carthaginian word for the Punic for "gain" is "mammon."

        He which serveth mammon, serveth that evil one who hath perversely chosen to be lord of these earthly things, and is called by the Lord "the prince of this world" (John xiv. 30). Of these two masters, either a man will hate the one and love the other, that is God or he will hold to the one and despise the other. He which serveth mammon holdeth to an hard and destroying master, for he is led captive by his lust, and sold a slave to the devil, and him loveth no man is there any man that loveth the devil And yet there be that hold to him.

        "Therefore, I say unto you, Take no thought for your life, what ye shall eat, or what ye shall drink; nor yet for your body, what ye shall put on", lest, albeit such things are not idle, but needful to be sought after, yet the seeking for things even needful should divide the heart and our intention should be corrupted when we do something as it were mercifully that is, lest, when we would seem to be seeking another's good, it should be profit to ourselves, rather than benefit to him, that we seek and therefore we seem not to ourselves to sin, because we would seek things not idle, but needful.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
