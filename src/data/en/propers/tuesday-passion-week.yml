collect:
  text: |
    Let us pray.
    May our fasting be acceptable to You, we beseech You, O Lord; may it be atonement for our sins, make us worthy of Your grace, and lead us to the everlasting remedy of the life to come.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

benedictus-antiphon:
  text: My time is not yet come, * but your time is always ready.
  status: verified

magnificat-antiphon:
  text: Go ye up unto this Feast; * I go not up (yet) unto this Feast, for My time is not yet full come.
  status: verified
