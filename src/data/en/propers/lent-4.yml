nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Basil the Great, Archbishop of Caesarea, Homily 1 on Fasting
      text: |-
        We know that it was with and by fasting that Moses went up into the Mount, for he had not dared to go up to that smoking summit, nor to have entered that darkness, except he had been made strong by a Fast. It was with fasting that he received the commandments, written by the finger of God upon tables of stone. Upon the mountain, that Fast made interest with Him Whose law was given unto it; but, below, gluttony was leading the people to the worship of idols and polluting them. It is written: The people sat down to eat and to drink, and rose up to play. That one fit of drunken frenzy, on the part of the people, made void and of none effect all the toil and patience of the forty days, during the which the servant of God had fasted and prayed unceasingly. To the Fast had been given those tables of stone written on with the finger of God; the Feast's work was to break them, by the hand of the most holy prophet, who deemed a nation of drunkards a nation unmeet to receive law from God.

        In a moment of time, that people, who had by great wonders been taught to worship God, were, by gluttony, dropped back into the cesspool of Egyptian idolatry. The which things if thou wilt consider, thou shalt see that the tendency of fasting is to God-ward, and that that of feasting is to hell-ward. What was it that degraded Esau, and made him a slave to his brother? Was it not that one dish of pottage for which he sold his birthright? Was it not prayer when joined to fasting that gave Samuel to his mother? What made the mighty Samson invincible? Was it not the fast during the which he was conceived in his mother's womb? The fast it was which made him to be conceived; the fast, which fed him; the fast, which made a man of him, even as the Angel of the Lord commanded his mother, saying: She may not eat of anything that cometh of the vine, neither let her drink wine or strong drink. Fasting is the mother of prophets, the strength and stay of mighty men.

        It is fasting which giveth wisdom to lawgivers; fasting which is the trustiest keeper of the soul, and the safest companion for the body. It is fasting which is strength and armour to mighty men; fasting which maketh supple them which run and which wrestle. It is fasting which maketh a man strong to strive against temptation, and which is to godliness as a fenced city; even fasting, whose fellow is soberness, and her work temperance. It is fasting which maketh men to wax valiant in fight; fasting which teacheth to rest in time of peace. Fasting maketh a Nazarite to be holy, and a priest perfect. Without a fast it is unlawful to touch the Sacrifice, not only in that mystic and true worship of God which now is, but also according to the law, in those sacrifices which were offered of old time as figures of the true. It was fasting which opened the eyes of Elias to look upon the visions of God, even as it is written, that when he had fasted forty days and forty nights he was in the mount of God, even Horeb, and he was made able, so far as man may be made able, to see God. Even so also was Moses in that Mount forty days and forty nights, fasting, at what time he again received the Law. Unless the Ninevites had fasted, both man and beast, herd and flock, they had not escaped from the ruin that hung over them. In the wilderness fell some: and who were they? Yea, they were such as lusted after flesh meat.
      responsory: |-
        R. Thy way is in the sea, and thy paths in the great waters. * Thou led thy people like a flock, by the hand of Moses and Aaron.
        V. Thou broughtest them through the Red Sea, and led them through much water.
        R. Thou leddest thy people like a flock by the hand of Moses and Aaron.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: John 6:1-15
      text: At that time, Jesus went away to the other side of the sea of Galilee, which is that of Tiberias. And there followed Him a great crowd, because they witnessed the signs He worked on those who were sick. Jesus therefore went up the mountain, and sat there with His disciples. Now the Passover, the feast of the Jews, was near. When, therefore, Jesus had lifted up His eyes and seen that a very great crowd had come to Him, He said to Philip, Whence shall we buy bread that these may eat? But He said this to try him, for He Himself knew what He would do. Philip answered Him, Two hundred denarii worth of bread is not enough for them, that each one may receive a little. One of His disciples, Andrew, the brother of Simon Peter, said to Him, There is a young boy here who has five barley loaves and two fishes; but what are these among so many? Jesus then said, Make the people recline. Now there was much grass in the place. The men therefore reclined, in number about five thousand. Jesus then took the loaves, and when He had given thanks, distributed them to those reclining; and likewise the fishes, as much as they wished. But when they were filled, He said to His disciples, Gather the fragments that are left over, lest they be wasted. They therefore gathered them up; and they filled twelve baskets with the fragments of the five barley loaves left over by those who had eaten. When the people, therefore, had seen the sign which Jesus had worked, they said, This is indeed the Prophet Who is to come into the world. So when Jesus perceived that they would come to take Him by force and make Him king He fled again to the mountain, Himself alone.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 24 on the Gospel of John
      text: |-
        The miracles which our Lord Jesus Christ did were the very works of God, and they enlighten the mind of man by mean of things which are seen, that he may know more of God. God is Himself of such a Substance as eye cannot see, and the miracles, by the which He ruleth the whole world continually, and satisfieth the need of everything that He hath made, are by use become so common, that scarce any will vouchsafe to see that there are wonderful and amazing works of God in every grain of seed of grass. According to His mercy He kept some works to be done in their due season, but out of the common course and order of nature, that men might see them and be astonished, not because they are greater, but because they are rarer than those which they lightly esteem, since they see them day by day.

        Or it is a greater miracle to govern the whole universe, than to satisfy five thousand men with five loaves of bread; and yet no man marvelleth at it. At the feeding of the five thousand, men marvel, not because it is a greater miracle than the other, but because it is rarer. For Who is He Who now feedeth the whole world, but He Who, from a little grain that is sown, maketh the fulness of the harvest? God worketh in both cases in one and the same manner. He Who of the sowing maketh to come the harvest, is He Who of the five barley loaves in His Hands made bread to feed five thousand men; for Christ's are the Hands which are able to do both the one and the other. He Who multiplieth the grains of corn multiplied the loaves, only not by committing them to the earth whereof He is the Maker.

        This miracle, then, is brought to bear upon our bodies, that our souls may thereby be quickened; shown to our eyes, to give food to our understanding; that, through His works which we see, we may marvel at that God Whom we cannot see, and, being roused up to believe, and purified by believing, we may long to see Him, yea, may know by things which are seen Him Who is Unseen. Nor yet sufficeth it for us to see only this meaning in Christ's miracles. Let us ask of the miracles themselves what they have to tell us concerning Christ: for, soothly, they have a tongue of their own, if only we will understand it. For, because Christ is the Word of God, therefore the work of the Word is a Word for us.
      responsory: |-
        R. After that the Lord had looked upon him, the face of Moses shone. * And when the elders saw that his face shone, they marvelled and were sore afraid.
        V. And when he came down from Mount Sinai with the two tables of testimony in his hand, he wist not that his face shone, because that God had spoken with him.
        R. And when the elders saw that his face shone, they marvelled and were sore afraid.
      status: verified
