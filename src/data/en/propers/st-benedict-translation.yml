collect:
  text: |
    Let us pray.
    O God, who didst vouchsafe to fill thy most blessed Confessor Benedict with the spirit of all the righteous: grant to us thy servants, who celebrate his Translation, that, filled with the same spirit, we may faithfully accomplish by thy gift what we have promised.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. Most holy Confessor of the Lord, father and leader of monks, Benedict, intercede for our salvation and that of all.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    O God, who didst vouchsafe to fill thy most blessed Confessor Benedict with the spirit of all the righteous: grant to us thy servants, who celebrate his Translation, that, filled with the same spirit, we may faithfully accomplish by thy gift what we have promised.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    Invincible sign-bearer,
    Consecrated as leader of the soldiers,
    defend us, O Benedict,
    with your strong arm of prayer.

    With those same conquering arms defeat
    The lions roar, our ghostly fœ,
    With which you drove once from you
    That fearful blackbird long ago.

    With fresh wounds’ force those wounds were cured,
    With nettles’ sting and thorny briar;
    With mind divinely kindled you
    Didst quench the flame with added fire.

    The cross like crushing stone destroyed
    The fatal cup of poisoned wine
    The cup of death could not prevail
    Against that strong, lifegiving sign.

    A brother’s mind from prayer reft
    Was by a vagrant spirit led:
    Stability returned to him
    When from your staff the demon fled.

    To the Father be glory,
    And for his only Son,
    With the Spirit, the Paraclete,
    Now and forever.
    Amen.
  status: verified

matins-invitatory:
  text: Let us praise our God * As we venerate our holy father Benedict.
  status: verified

lauds-capitulum:
  text: Behold a great confessor, like the morning star amid a cloud, and like the full moon shining in his days; and like the sun in its brightness, so did he shine in the temple of God.
  citation: Sir 50:6-7
  status: draft

lauds-hymn:
  text: |
    The golden dawn is rising,
    renewing the yearly feast,
    when Benedict climbed
    the steep palace of heaven.

    How great are the things he receives on high,
    who so shone in the depths below,
    whose wonders gleam
    through the wide regions of the world!

    The earth casts out the corpses
    of those who lack his favour;
    for the devout the flowing wave
    laps their dry footprints.

    The whole circuit of the world
    he sees in a single ray of the sun;
    a mind fixed upon its Author
    beholds all things beneath it.

    Kind Father, we beseech thee
    from the depths of a lowly heart,
    that thou grant to climb to heaven
    those whom thou teachest to scorn the earth.

    To God the Father be glory,
    and to his only Son,
    with the Spirit, the Paraclete,
    now and for evermore.
    Amen.
  status: draft

