nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Bernard, Abbot, Sermon on the Birthday of St. Benedict
      text: |
        The most sweet name of our glorious Father, Benedict, ought to be embraced and honored by you with every sign of joy because he is your leader, your master, and your lawgiver. Let his sanctity, his piety, his justice refresh you. The blessed Benedict was a great and fruitful tree, like a tree which is planted near the running waters. He was so planted near the running waters that he brought forth his fruit in due season. To his fruit belong the three things whereof I have made mention above: his sanctity, his justice, his piety. Miracles prove his sanctity; his teaching, his piety; his life, his justice.

        But why am I to propose his miracles to you? In order that you may want to perform miracles? By no means! But that you may lean on his miracles for support. In other words, that you may be confident and glad because you have merited such a great protector. For most certainly he who was so great and powerful on earth is very powerful in heaven, being exalted to a greatness of glory corresponding to the magnitude of his grace. For the branches are known to shoot forth according to the size of the roots, and with as many roots as the tree is supported, with so many branches, as they say, is it adorned. Thus, then, though we may not have the power to perform miracles, the miracles of our patron should be a great consolation to us.

        His teaching, too, instructs us and guides our steps to the path of peace. Further, the justice of his life in every way strengthens and vivifies us, so that we are so much the more enkindled to do the things he has taught us as we are assured that he has not taught us otherwise than he acted. The example of his work is, indeed, a living and effective sermon, making what is said very pleasing to hear in that it shows that what is urged can be done. Consequently, in this manner his sanctity consoles us; his piety enlightens us; his justice strengthens us. Of what great piety was he that he not only benefited those present to him, but was also solicitous for those to come? Not only for those who lived then did this tree produce its fruit, but even today its fruit multiplies and remains.

        Surely beloved of God and men is he whose presence was not only in benediction (for there are many who are beloved of God alone because they are now known to God alone), but his memory also is even now in benediction. For even until this day, as a threefold confession of his love for his Lord, he feeds the flock of the Lord with this three-fold fruit. He feeds it by his life; he feeds it by his teaching; he feeds it through his intercession. Being unceasingly aided by him, do you also, dearest brethren, bear fruit, because for this have you been appointed, “that you should go and bring forth fruit.”
      responsory: |
        R. In making the rock to yield forth water, Moses; in the iron, which came from the bottom of the lake, Eliseus; in the walking upon the water, Peter; in the obedience of the crow, Elias;
        * In lamenting the death of his enemy, David is brought forth.
        V. This one man was full of the spirit of all good men.
        R. In lamenting the death of his enemy, David is brought forth.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Matt 19:27-29
      text: At that time, Peter said to Jesus, "Behold, we have left all and followed You; what then shall we have?" And Jesus said to them, "Amen I say to you that you who have followed Me, in the regeneration when the Son of Man shall sit on the throne of His glory, shall also sit on twelve thrones, judging the twelve tribes of Israel. And everyone who has left house, or brothers, or sisters, or father, or mother, or wife, or children, or lands, for My name's sake, shall receive a hundredfold, and shall possess life everlasting."
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Peter Damian, Bishop, Sermon 9, On the Nativity of St. Benedict, Abbot (on Matt 19:27-29)
      text: |-
        Behold, we have left all things, and have followed thee. A solemn word, a great promise, a holy work, worthy of a blessing: to leave all things, and follow Christ. These are the words that willingly persuade to poverty, which have brought forth monasteries, which have filled cloisters with monks and the woods more abundantly with hermits. For these are they of whom the Church sings: Because of the words of thy lips I have kept hard ways; about to receive rest for labour, riches for poverty, reward for tribulation. It is indeed a great thing to leave all things, but a greater thing to follow Christ, since we read that many left all things, yet did not follow Christ. This is the work, this is the labour, herein lies the sum of man's salvation; nor can we follow Christ unless we leave all things, because He rejoiceth as a giant to run the way, and one who is burdened cannot follow Him.

        Behold, he saith, we have left all things — not only the goods of the world, but also the desires of the mind: for he does not leave all things who has kept even himself; indeed it profits nothing to have left all else without leaving oneself, since no burden is heavier upon a man than the man himself. For what tyrant is more cruel, what power more savage upon a man, than the will of the man himself? There follows: What then shall we have? Peter has already left all things; he not only follows now, but has long followed; and now for the first time he asks what he is to receive. What is this, Peter? Didst thou not promise obedience upon hearing with thine ears, not upon the striking of a bargain? But hear now what the Lord God says, and attend to the hope in which we ought to hope while the world is tossed about: Ye shall sit, says the Lord, says the Truth. A solemn sitting, a welcome rest, a full sufficiency.

        But lest a long-drawn-out waiting should twist the sweetness of the great promise, He tempers the fickleness of our mind with a sweeter word. For He himself knows our frame, since our faintheartedness cannot bear the delays of postponement; and so in His kindness He meets this thought also, and comes to meet us on this side too, saying: And every one that hath left house, or brethren, or sisters, or father, or mother, or wife, or children, or lands, for my name's sake, shall receive an hundredfold, and shall possess life everlasting. Surely the mouth of them that speak unjust things is stopped. Now let all be confounded that work iniquity in vain. For we have the promise of this life, which now is, together with that which is to come; and it is plain that the hundredfold promise belongs to the present time, from what follows: and shall possess life everlasting.

        Let those, then, who have not yet received the hundredfold, search their own hearts, and diligently examine all the labours of their hands; and there is no doubt they will find a corner and a lodging-place which the Saviour does not know. But what is this hundredfold, but the consolations and visitations and firstfruits of the Spirit, which is sweeter than honey; but the testimony of our own conscience; but the glad and most joyful expectation of the just; but the memory of the abundance of God's sweetness, and the truly great multitude of His sweetness, which it is not necessary to tell to those who have experienced it, nor can any words express it to those who have not? But to whom can this whole course of the Gospel reading be so specially assigned, as to our Father and Master, blessed Benedict? He from boyhood left the world in its flower, and followed the running Christ with the swiftest course, nor did he cease until he had overtaken Him.
      responsory: |
        R. In the same manner as Elias, you made rain come from heaven, O Father, you led oil to flow quickly
        * You restored the dead to life and performed innumerable other miracles.
        V. For that reason we celebrate your memory with devoted minds, O Benedict.
        R. You restored the dead to life and performed innumerable other miracles.
      status: draft
