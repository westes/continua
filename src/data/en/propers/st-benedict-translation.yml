none-capitulum:
  text: |
    As a golden vessel, solid, and adorned with every precious stone. As an olive tree budding forth, and a cypress tree growing up on high. And around him a crown of brethren: like the planting of a cedar upon Mount Lebanon, so around him stood as it were the branches of palm trees; and all the sons of Aaron in their glory.
    R. Thanks be to God.
    V. The law of his God is in his heart.
    R. None of his steps shall slide.
  citation: Eccl 50:10-11,13-14
  status: draft

vespers-hymn:
  text: |
    Precious jewel of the heavenly King,
    rule of the just, way of monks,
    draw us away, Benedict, from the mire
    of the unclean world.

    Spurning the earth, fixing thy heart upon the stars,
    thou dost bring parents to become heirs;
    a vessel full of God, thou didst merit
    to mend what was broken.

    A great hermit in a little frame,
    thou dost conquer age and overcome toil,
    fervently fulfilling the narrow rudiments
    of a strict life.

    The boy buried beneath the fall of stones
    thou didst raise up as soon as thou hadst prayed;
    hence sense is restored to the flesh,
    and to the flesh its health.

    Rightly, under the form of a gentle dove,
    thou beholdest the soul of thy sister, a stranger to gall,
    pierce the highest summits
    of the starry heaven.

    Thyself, after bringing back a glorious triumph,
    having overcome the world, thou seekest the lofty stars:
    cloaks strew the path that blazes
    with radiant light.

    Glory be to the Father, and to the Son,
    and to thee, equal to both for ever,
    kindly Spirit, one God,
    through all ages.
    Amen.
  status: draft

vespers-hymn/~-first:
  text: |
    Rejoice, France, in resounding praises,
    be glad in the bones of Benedict thy father:
    happy thou, who keepest in thine own bosom
    his hallowed remains laid to rest.

    Italy had shone with his wondrous deeds;
    in death he sheds light upon the Gauls by his body;
    at his tomb he gleams ever more often with signs,
    making bright his newfound country.

    Hence he raises again the deeds of the ancient prophets:
    what he was pleased to command in life, he commands in death,
    and by his own bones he stirs the dead to life:
    O how marvellous is his power!

    Now dwelling in heaven, O best of Fathers,
    fill thy servants with the divine Rules,
    granting them to climb the narrow way,
    and to gain the everlasting kingdom.

    Ruling over all things, Almighty,
    who from thy throne on high beholdest all,
    graciously receive the songs of those who sing,
    who pray with their vows and with their voice.
    Amen.
  status: draft

