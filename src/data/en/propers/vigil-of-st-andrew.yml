nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: true
      citation: John 1:35-51
      text: 'At that time: John stood, and two of his disciples. And looking at Jesus walking, he said: Behold the Lamb of God. And the two disciples heard him speak, and followed Jesus. And Jesus turned, and seeing them following him, said to them: What seek ye? And they said to him: Rabbi (which is to say, being interpreted, Teacher), where dwellest thou? He saith unto them: Come and see. They came and saw where he abode, and abode with him that day: and it was about the tenth hour. Now Andrew, Simon Peter''s brother, was one of the two which heard John, and followed him. He first findeth his own brother Simon, and saith unto him: We have found the Messiah (which is to say, being interpreted, Christ). And he brought him to Jesus. And Jesus looking at him said, Thou art Simon, the son of Jonah: thou shalt be called Cephas, which is by interpretation, Peter. The next day he would go forth into Galilee, and findeth Philip. And Jesus saith unto him, Follow me. Now Philip was of Bethsaida, the city of Andrew and Peter. Philip findeth Nathanael, and saith unto him, Of whom Moses in the law, and the prophets, wrote, Jesus the son of Joseph, of Nazareth. And Nathanael saith unto him, Can any good thing come out of Nazareth? Philip saith unto him, Come and see. Jesus saw Nathanael coming unto him, and saith of him, Behold an Israelite indeed, in whom is no guile. Nathanael saith unto him, Whence knowest thou me? Jesus answered and said unto him, Before Philip called thee, when thou wast under the fig tree, I saw thee. Nathanael answered him and said, Rabbi, you are the Son of God, you are the King of Israel. Jesus answered and said to him, Because I said to you, I saw you under the fig tree, do you believe? You will see greater things than these. And he said to him, Truly, truly, I say to you, you will see heaven opened, and the angels of God ascending and descending on the Son of Man.'
      status: verified
    - nocturn: 2
      isGospel: false
      source: St. Augustine, Bishop of Hippo, Tractate 7 on John
      text: |-
        Since John was the friend of the Bridegroom, he sought not his own glory, but bare witness to the truth. Would he that his disciples should remain with him rather than that they should follow the Lord? Nay, he showed his disciples Whom they should follow. They thought that he himself was the Lamb; but he saith: Why wait ye on me? I am not the Lamb. Behold the Lamb of God! This was He of Whom he had already said above: Behold the Lamb of God! And what use to us is the Lamb of God? Behold the Lamb of God, saith John, Which taketh away the sin of the world. And the two disciples heard him speak, and they followed Jesus.

        Let us see what followed. John stood, and two of his disciples; and looking on Jesus as He walked, he saith: Behold the Lamb of God! And the two disciples heard him speak, and they followed Jesus. They followed Him, not yet to cleave unto Him, for it is manifest that they clave unto Him only after that He had called them out of the ship. One of the two which heard John speak, and followed Him, was Andrew, Simon Peter's brother. And we know how it is written in the Gospel of Matthew: Jesus walking by the sea of Galilee, saw two brethren, Simon called Peter, and Andrew his brother, casting a net into the sea, for they were fishers. And He saith unto them: Follow Me, and I will make you fishers of men. And they straightway left their nets and followed Him.

        From that time, therefore, was it that they clave unto Him continuously. Then Jesus turned, and saw them following, and saith unto them: What seek ye? They said unto Him: Rabbi, which is to say, being interpreted, Master, where dwellest Thou? So they follow Him now, not as to cleave unto Him for ever, but as to know where He dwelt, and to obey that which is written: If thou see a man of understanding, go to him early in the morning, and let thy foot wear the steps of his doors. He saith unto them: Come and see. They came and saw where He dwelt, and abode with Him that day. O what a blessed day! O what a blessed night! for it was about the tenth hour. Who shall tell what they heard from the Lord? O let us also build an house in our hearts, where He may come, and teach us, and talk with us!
      status: verified
