  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Zachary, a Greek by race, the son of Polychronius, after Gregory the Third was taken from this light, was raised to the Chair of blessed Peter. He was a man of most gentle disposition, of wondrous sweetness and grace, a lover of the clergy and people of Rome, slow to anger, most ready to mercy and clemency, returning evil for evil to no one, but overcoming evil with good; so that those whom he had had as rivals and enemies he honoured and rewarded at the beginning of his pontificate. Made Pontiff, to restore to its tranquillity Italy vexed by the arms of the Lombards, he sent legates to King Liutprand, then staying at Terni, and went himself, where by the elegance of his speech and the holiness of his life he so softened the king that he restored the cities, towns, and patrimonies he had taken from the Church.

        But he also went as far as Pavia and bent the same king to cease from his oppression of the people of Ravenna. He went to Rachis, who was pressing Perugia with a fierce siege, and so moved him by the majesty of his prayer that he both desisted from every attack, and, kindled with love of religion, exchanged his royal dignity and mantle for the monastic institute and habit. Consulted by the Franks, he transferred that kingdom, by apostolic authority, from Childeric, a stupid and slothful man, to Pepin, distinguished for piety and fortitude. He celebrated many synods and councils for the restoration of ecclesiastical discipline.

        At Rome he either repaired or enriched all the sacred places. He renewed images of the saints worn by age, and almost rebuilt from new the Lateran patriarchium, which he had found in great poverty, and distributed to various churches many relics found there. He assigned revenues for feeding the poor. He built the library of St. Peter, founded the basilica of St. George in Velabro, and built the oratory of St. Cecilia on the Tiburtine Way. He greatly loved the clergy, and gave a gift to each priest and deacon. He translated into Greek the books of the Dialogues of St. Gregory, and, having done various things for the utility of the Church no less piously than prosperously, he was crowned with the laurel of holiness.
