collect:
  text: |
    Let us pray.
    Almighty and everlasting God, who on this day didst raise up to heaven thy most holy Confessor Benedict, delivered from the prison-house of the flesh: grant, we beseech thee, unto thy servants keeping this feast, forgiveness of all their sins; that they who with exultant souls rejoice in his glory may, through his intercession with thee, be joined also to his merits.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. Most holy Confessor of the Lord, father and leader of monks, Benedict, intercede for our salvation and that of all.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
    Let us pray.
    Almighty and everlasting God, who on this day didst raise up to heaven thy most holy Confessor Benedict, delivered from the prison-house of the flesh: grant, we beseech thee, unto thy servants keeping this feast, forgiveness of all their sins; that they who with exultant souls rejoice in his glory may, through his intercession with thee, be joined also to his merits.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

matins-hymn:
  text: |
    All that the ancient prophets preached,
    and all that the books of the divine Law tell us
    of holiness, is contained in the life of the great patriarch
    which we are now extolling.

    Moses was celebrated for his meekness;
    Abraham for his being father of all believers;
    Isaac for the beauty of his bride,
    and his obedience to the trying commands of his father.

    The sublime patriarch of our family was richly laden
    with every virtue; and in his
    Single person represented
    Isaac, Moses, and Abraham.

    May he have a loving care of those
    whom he has delivered from this stormy world,
    and lead them with prosperous gales to the port
    where there is no fear that can ruffle peace and repose.

    Glory be to the Father, and to the Son that is begotten of him!
    To thee, also, O Spirit of love,
    coequal with them, one God,
    be glory for endless ages.
    Amen.
  status: verified

lauds-capitulum:
  text: Behold a great confessor, like the morning star amid a cloud, and like the full moon shining in his days; and like the sun in its brightness, so did he shine in the temple of God.
  citation: Sir 50:6-7
  status: draft

lauds-hymn:
  text: |-
    Among the eternal crowns of the blessed,
    Won and held fast through holy contest,
    You shine forth radiant with lofty merits,
    O Benedict!

    A holy old age adorned you while a boy still,
    No pleasure ever seized its share of you,
    The world's flower withered for you, your mind
    Already lifted on high.

    Hence, fleeing ruin, your homeland and parents
    You leave, an ardent dweller of the forest;
    You tame the flesh, and, its harsh tormentor,
    Subdue it wholly to Christ.

    Lest you too long keep safe your hidden refuge,
    Worthy deeds of holiness reveal you;
    Your happy fame is scattered through the whole world
    Borne on swift wing.

    Glory to the Father and the begotten Son,
    And, ever equal to them both, to you,
    Kindly Spirit, one God, through every
    Age of the world. Amen.
  status: draft

