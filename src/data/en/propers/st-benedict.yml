  status: verified

prime-antiphon:
  text: There was a man * of venerable life, Benedict by grace and by name, who from the time of his boyhood carried the heart of an old man, and surpassing his age by the gravity of his character, gave his soul to no pleasure.
  status: draft

terce-antiphon:
  text: Blessed Benedict * desired rather to endure the evils of the world than its praises; to be wearied with labors for God rather than to be exalted by the favors of this life.
  status: draft

terce-capitulum:
  text: |
    Behold a great Confessor, who as the morning star in the midst of a cloud, and as the moon at the full, shineth in his days. And as the sun when it shineth, so did he shine in the temple of God.
    R. Thanks be to God.
    V. The Lord loved him and beautified him.
    R. He clothed him with a robe of glory.
  citation: Eccl 50:6-7
  status: draft

sext-antiphon:
  text: 'The glorious * Confessor of the Lord, Benedict, leading an angelic life on earth, became a mirror of good works to the world: and therefore now rejoices with Christ without end in heaven.'
  status: draft

sext-capitulum:
  text: |
    In his days wells of water flowed out, and they were filled as it were the sea, above measure. He took care of his nation, and delivered it from destruction.
    R. Thanks be to God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
  citation: Eccl 50:3-4
  status: draft

none-antiphon:
  text: 'The man of God, Benedict, * was full of the spirit of all the just: may he intercede for all who are of the monastic profession.'
  status: draft

none-capitulum:
  text: |
    As a golden vessel, solid, and adorned with every precious stone. As an olive tree budding forth, and a cypress tree growing up on high. And around him a crown of brethren: like the planting of a cedar upon Mount Lebanon, so around him stood as it were the branches of palm trees; and all the sons of Aaron in their glory.
    R. Thanks be to God.
    V. The law of his God is in his heart.
    R. None of his steps shall slide.
  citation: Eccl 50:10-11,13-14
  status: draft

vespers-hymn:
  text: |-
    Let the citizens of heaven sound their tuneful praises,
    Let the temples chant their solemn hymns:
    On this day Benedict scales the heights
    Of highest heaven.

    He was passing through his flowering years,
    When as a boy he left the sweet hearth
    Of his homeland, and lay hidden alone,
    Concealed in a silent cave.

    Among nettles and unyielding briars
    He conquered youth, the nurse of every vice:
    From there he set down the beautiful precepts
    Of the blessed life.

    The bronze image of shameful Apollo,
    And the grove given over to Venus, he cast down,
    And on that sacred mountain he raised
    A shrine to the Baptist.

    And now, dwelling on happy Olympus,
    Amid the burning ranks of the Seraphim,
    He watches, and with sweet nectar refreshes
    The hearts of his own.

    Glory to the Father, and to the begotten Son,
    And, ever equal to them both, to you,
    Kindly Spirit, one God, through every
    Age of the world. Amen.
  status: draft

