collect:
  text: |
    Let us pray.
    O God, who didst vouchsafe to grant unto Saint Rita such grace that she loved her enemies and bore in
    her heart and on her brow the marks of thy charity and Passion: grant us, we beseech thee, by her
    intercession and merits, so to spare our enemies and to contemplate the sorrows of thy Passion, that we
    may obtain the rewards promised to the meek and to those who mourn.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. The kingdom of heaven is like unto a merchantman * seeking goodly pearls, who, when he had found one pearl of great price, went and sold all that he had, and bought it.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
    Let us pray.
    O God, who didst vouchsafe to grant unto Saint Rita such grace that she loved her enemies and bore in her heart and on her brow the marks of thy charity and Passion: grant us, we beseech thee, by her intercession and merits, so to spare our enemies and to contemplate the sorrows of thy Passion, that we may obtain the rewards promised to the meek and to those who mourn.
    Who livest and reignest with God the Father, in the unity of the Holy Spirit, God, world without end.
    R. Amen.
  status: draft

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      text: |-
        Rita was born at Roccaporena, near Cascia in Umbria, in the year 1381, to parents already advanced in age. From childhood she desired to give herself wholly to God, but in obedience to her parents' wishes she was given in marriage to a man of violent and quarrelsome temper. For eighteen years she bore his harshness and infidelities with patience, at length winning him to repentance before his death, which came at the hands of enemies he had made. Her two sons, moved by filial anger, resolved to avenge their father's murder; Rita, fearing they would stain their souls with the guilt of vengeance, prayed rather that God would take them to himself than let them fall into mortal sin, and both died of illness soon after, reconciled to God.

        Left a widow without heirs, Rita sought to enter the Augustinian convent of Cascia, but was at first refused, since its rule admitted only virgins or the widows of men who had themselves died in peace. She persevered in prayer, and tradition holds that she was brought within the convent walls by the intervention of her three patrons, Augustine, Nicholas of Tolentino, and John the Baptist. Within the cloister she gave herself to austerity and to constant meditation on the Passion of Christ. Praying once before a crucifix, she received upon her forehead a wound as if from a thorn of his crown, which never healed and which she bore, often in great suffering and offensive to those near her, for the last fifteen years of her life. She died at Cascia in the year 1457, and was canonized by Pope Leo the Thirteenth in the year 1900. She is invoked above all by those bearing heavy burdens in marriage, widowhood, and hardship, as a patroness of desperate and seemingly impossible causes.
      status: draft
