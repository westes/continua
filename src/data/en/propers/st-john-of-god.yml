collect:
  text: |
    Let us pray.
    O God, Who didst so enkindle in thy servant John the fire of thy Divine love, that when
    he walked in the midst of earthly fire the flame thereof had on his body no power, and
    Who didst choose him for a means whereby Thou hast given unto thy Church a new family of
    sons, mercifully grant unto us, for his sake, that the fire of thy love may burn up in
    us all things that displease thee, and make us meet for thy heavenly kingdom.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity
    of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

commemoration:
  text: |
    Ant. Well done, thou good * and faithful servant; thou hast been faithful over a few things, I will make thee ruler over many things; enter thou into the joy of the Lord thy God.
    V. The mouth of the righteous speaketh wisdom.
    R. And his tongue talketh judgment.
