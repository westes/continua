collect:
  text: |
    Let us pray.
    Grant, we beseech Thee, almighty God, that we, who are unceasingly afflicted by reason of our own transgressions, may be set free through the Passion of Thine Only-begotten Son:
    Who liveth and reigneth with Thee in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: Simon, sleepest thou? * Couldest thou not watch one hour with Me?
  status: verified

magnificat-antiphon:
  text: 'The maid said * unto Peter: Surely thou also art one of them, for thy speech betrayeth thee.'
  status: verified
