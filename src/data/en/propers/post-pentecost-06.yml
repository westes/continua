collect:
  text: |
    Let us pray.
    Lord of all power and might, Who art the Author and Giver of all good things, graft in our hearts the love of thy Name, increase in us true religion, nourish us with all goodness, and, of thy great mercy, keep us in the same.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

benedictus-antiphon:
  text: 'The multitude being very great, * and having nothing to eat, Jesus called His disciples unto Him, and saith unto them: I have compassion on the multitude, because they have now been with Me three days, and have nothing to eat. Alleluia.'
  status: verified

magnificat-antiphon:
  text: I have compassion on the multitude, * because they have now been with Me three days, and have nothing to eat; and if I send them away fasting, they will faint by the way. Alleluia.
  status: verified

magnificat-antiphon/~-first:
  text: I beseech thee, * O Lord, do away the iniquity of thy servant, for I have done very foolishly.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 2
      isGospel: false
      source: St. Ambrose, Bishop of Milan, Apology of David, ch. 1-2
      text: |-
        In how many things doth each one of us transgress every hour! And nevertheless not one of all us common men thinketh it well to confess his sin. Yet that strong and great King would not suffer the acknowledgment of his iniquity to remain, even for a moment, hidden in his own heart. With eager confession and bitter sorrow, he admitted that he had sinned against the Lord. Which of you will easily find me now some honoured and wealthy person, who will not take it ill if I rebuke him for a fault whereof he is guilty? But David, amid the splendours of a throne and the certainty of Divine revelations, when he was rebuked by one of his subjects for his grievous transgression, was not roused to anger, but contrariwise, acknowledged his sin with groans and affliction.

        The heart-felt sorrow of David moved the Lord to compassion, so that Nathan said Because thou hast repented, the Lord also hath put away thy sin. The instant gift of pardon declareth the depth of the King's repentance, which was able to obtain the forgiveness of so grievous a transgression. Other men, when they be rebuked of Priests, do but aggravate the heinousness of their sins by the seeking to deny or to excuse them, and thereby make deeper their fall by means of that which should have helped them up. But the saints of the Lord who will to fight a good fight of godliness unto the end and to finish their course by saving their souls, howbeit, they may perchance have fallen like other men, have done so rather through man's weakness than through lust for iniquity, and rise more eager to go on than before. Shame goadeth them on to fly at higher things.

        David sinned; and so oftentimes do other kings. David repented with groaning and tears; and so do not oftentimes other kings. He admitted his guilt; he implored forgiveness; he cast himself down upon the ground, and there wept over his crime; he fasted; he prayed; by publishing his sorrow he left an everlasting witness of his acknowledgment. What meaner men blush to do, the King was not ashamed to own. They who are answerable to law are bold to deny their crimes, and too haughty to ask pardon. Not so he, though he could be haled before no earthly judgment-seat. That he sinned was a matter flowing from his nature; that he asked for pardon, his own repentance. To fall is common to all men, but his confession was his own. To transgress thus was nature; to efface his guilt, greatness.
      responsory: |-
        R. Saul hath slain his thousands, and David his ten thousands. * Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
        V. Is not this David? Did they not sing one to another of him in dances, saying: Saul hath slain his thousands, and David his ten thousands?
        R. Because the hand of the Lord was with him, he smote the Philistine, and took away the reproach from Israel.
      status: verified
    - nocturn: 3
      isGospel: true
      citation: Mark 8:1-9
      text: At that time, when there was a great crowd with Jesus, and they had nothing to eat, He called His disciples together and said to them, I have compassion on the crowd, for behold, they have now been with Me three days, and have nothing to eat; and if I send them away to their homes fasting, they will faint on the way, for some of them have come from a distance. And His disciples answered Him, How will anyone be able to satisfy these with bread, here in a desert? And He asked them, How many loaves have you? And they said, Seven. And He bade the crowd recline on the ground. Then taking the seven loaves, He gave thanks, broke them and gave them to His disciples to distribute; and they set them before the crowd. And they had a few little fishes; and He blessed them, and ordered them to be distributed. And they ate and were satisfied; and they took up what was left of the fragments, seven baskets. Now those who had eaten were about four thousand. And He dismissed them.
      status: verified
    - nocturn: 3
      isGospel: false
      source: St. Ambrose, Bishop of Milan, on Luke, Book 6, ch. 9
      text: |-
        After that woman, who is a type of the Church, was healed of the issue of blood (Luke viii. 43-48); the Lord had sent His disciples to preach the kingdom of God (ix. 2). His heavenly tenderness gave food. But consider who they were unto whom He gave it. He gave it not to such as dwell at ease, not to men in cities, not to such as sit in places of worldly splendour, but to men seeking Christ in a desert place. Such as are not given to niceness are they whom Christ receiveth, and unto whom the Word of God speaketh, not of earthly things, but of the kingdom of God (11). And if any bear in them the running sores of fleshly passion, He healeth them.

        And then it came to pass that, as He had healed them that had need of healing, He fed their hunger with ghostly meat. Thus it is that no man taketh Christ's meat, unless he be first healed, and they, that are bidden to the supper, are first cured by the invitation. The lame receive the power to walk, that they may be able to come; the blind cannot see the door of the house of the Lord, unless light be given them.

        Everywhere is preserved the order of the Sacraments. The sinful soul is first healed by the remission of sins, and afterward is filled at the Table of the Lord albeit this multitude now present is of such as do not yet feed on those strong meats, nor pasture their starving spirits upon the Body and Blood of Christ, as do they of a manlier faith. To use the words of Paul, I have fed you with milk and not with meat, for hitherto ye were not able to bear it, neither yet now are ye able (1 Cor. iii. 2). The five loaves are, as it were, your milk; the stronger meat will be the Body of Christ; the more generous cup, the Blood of the Lord.
      responsory: |-
        R. One Seraph cried unto another: * Holy, Holy, Holy is the Lord God of hosts; * The whole earth is full of His glory.
        V. There are Three That bear record in heaven: the Father, the Word, and the Holy Ghost, and these Three are One.
        R. The whole earth is full of His glory.
      status: verified
