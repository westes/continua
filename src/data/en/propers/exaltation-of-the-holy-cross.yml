matins-invitatory:
  text: Come adore * Christ the King who was exalted to the cross for us.
  status: verified

benedictus-antiphon:
  text: Thou art higher * than all cedars, whereon the Life of the world hung, whereon Christ openly triumphed, and His death trampled down death for ever.
  status: verified

magnificat-antiphon:
  text: O blessed art thou, O Cross * thou which wast counted the only tree worthy to bear the Lord and King of heaven. Alleluia.
  status: verified

magnificat-antiphon/~-first:
  text: 'O Cross, * surpassing all the stars in splendour, exceeding dear to all Christian people and world-renowned, holiest of earth''s treasures: which only wast counted worthy to hold aloft the Price of our Redemption: sweet is thy wood and sweet thine iron, but sweetest of all the Burden that hung on thee! O that all who come this day to celebrate thy praises may find in thee salvation. '
  status: verified

matins-psalmody:
  nocturn1:
    groups:
      - psalms:
          - 1
          - 2
          - 4
          - 5
          - 8
          - 14
        antiphon: O sweet wood, O sweet nails, that bore his sweet burden, which alone were worthy to support his body.
    versicle:
      v: This sign of the Cross shall be in heaven.
      r: When the Lord cometh to judgment.
  nocturn2:
    groups:
      - psalms:
          - 22
          - 26
          - 75
          - 95
          - 96
          - 97
        antiphon: Your rod and your staff, they have comforted me, O Lord, my God.
    versicle:
      v: We adore thee, O Christ, and we bless thee.
      r: Because through thy Cross thou hast redeemed the world.
  nocturn3:
    antiphon: But God forbid that I should glory, save in the cross of our Lord Jesus Christ; by whom the world is crucified to me, and I to the world.
    canticles:
      - refs:
          - book: hab
            chapter: 3
            verses: 1-6
      - refs:
          - book: hab
            chapter: 3
            verses: 7-12
      - refs:
          - book: hab
            chapter: 3
            verses: 13-19
    versicle:
      v: Let all the earth adore thee, and sing to thee.
      r: Let it sing a psalm to thy name, O Lord.

lauds-psalmody:
  groups:
    - psalms:
        - 92
      antiphon: O what a work of love was that * when Life and death died together upon the Tree.
    - psalms:
        - 99
      antiphon: Save us, * O Christ the Saviour, save us through the might of thy Cross Thou Who didst save Peter when he was ready to sink in the sea, have mercy upon us.
    - psalms:
        - 62
      antiphon: Behold, the Cross of the Lord! * fly, ye ranks of the adversary! The Lion of the tribe of Judah, the Root of David, hath prevailed. Alleluia.
  canticle:
    id: canticum-trium-puerorum
    antiphon: But us it behoveth to glory * in the Cross of our Lord Jesus Christ.
  laudate:
    antiphon: By thy Cross' holy sign, * Jesus, guard this soul of mine from my ghostly enemy.

