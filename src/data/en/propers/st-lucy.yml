prime-antiphon:
  text: While St. Lucy was praying, * the blessed Agatha appeared unto her, and consoled the handmaiden of Christ.
  status: verified

terce-antiphon:
  text: O virgin Lucy, * wherefore askest thou of me what thou canst thyself forthwith obtain for thy mother?
  status: verified

sext-antiphon:
  text: Through thee, O virgin Lucy, * the city of Syracuse shall be made glorious by the Lord Jesus Christ.
  status: verified

none-antiphon:
  text: Lucy, my sister, * thou virgin consecrated to God, wherefore askest thou of me what thou canst thyself forthwith obtain for thy mother?
  status: verified

benedictus-antiphon:
  text: 'Thou art become as a pillar that cannot be shaken, Lucy, O Bride of Christ: all the people wait for thee, until thou receive the crown of life, alleluia.'
  status: verified

magnificat-antiphon:
  text: With such power * did the Holy Spirit fix her to the ground, that the virgin of Christ remained immovable.
  status: verified

magnificat-antiphon/~-first:
  text: In patience * hast thou possessed thy soul, Lucy, Bride of Christ thou hast hated the things that are in the world, and art glorified among the Angels; thou hast shed thine own blood, and conquered the Adversary.
  status: verified

