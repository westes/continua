collect:
  text: |
    Let us pray.
    Graciously hear us, O God of our salvation: that as we rejoice in the festivity of blessed Lucy, thy Virgin and Martyr, we may be instructed in the affections of a loving devotion.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: draft

commemoration:
  text: |
    Ant. Thou art become as a pillar that cannot be shaken, Lucy, O Bride of Christ: all the people wait for thee, until thou receive the crown of life, alleluia.
    V. Grace is poured into thy lips.
    R. Therefore God hath blessed thee for ever.
