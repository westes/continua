magnificat-antiphon:
  text: As long as you did it to one * of these my least brethren, you did it to me, said the Lord.
  status: verified

nocturn-readings:
  readings:
    - nocturn: 1
      isGospel: true
      citation: Matthew 25:31-46
      text: 'At that time, Jesus said to His disciples: "When the Son of Man shall come in His majesty, and all the angels with Him, then He will sit on the throne of His glory; and before Him will be gathered all the nations, and He will separate them one from another, as the shepherd separates the sheep from the goats; and He will set the sheep on His right hand, but the goats on the left. Then the king will say to those on his right hand, ''Come, blessed of My Father, take possession of the kingdom prepared for you from the foundation of the world; for I was hungry and you gave Me to eat; I was thirsty and you gave Me to drink; I was a stranger and you took Me in; naked and you covered Me; sick and you visited Me; I was in prison and you came to Me.'' Then the just will answer Him, saying, ''Lord, when did we see You hungry, and feed You; or thirsty, and give you to drink? And when did we see You a stranger, and take You in; or naked, and clothe You? Or when did we see You sick, or in prison, and come to You?'' And, answering, the king will say to them, ''Amen I say to you, as long as you did it for one of these, the least of My brethren, you did it for Me.'' Then He will say to those on His left hand, ''Depart from Me, accursed ones, into the everlasting fire which was prepared for the devil and his angels. For I was hungry, and you did not give Me to eat; I was thirsty and you gave Me no drink; I was a stranger and you did not take Me in; naked, and you did not clothe Me; sick, and in prison, and you did not visit Me.'' Then they also will answer and say, ''Lord, when did we see You hungry, or thirsty, or a stranger, or naked, or sick, or in prison, and did not minister to You?'' Then He will answer them, saying, ''Amen I say to you, as long as you did not do it for one of these least ones, you did not do it for Me.'' And these will go into everlasting punishment, but the just into everlasting life."'
      status: verified
    - nocturn: 1
      isGospel: false
      source: St. Augustine, Bishop of Hippo, On Faith and Works, ch. 15
      text: |-
        If, without keeping the commandments, it be possible to attain unto life by faith only, (and faith, if it hath not works, is dead,) how can it be true that the Lord will say to such as He shall have set on His left hand, "Depart from Me, ye cursed, into everlasting fire, prepared for the devil and his angels"? He rebuketh them, not because they have not believed in Him, but because they have not wrought good works. Yea, lest any man should promise himself life eternal by faith only, (and faith, if it hath not works, is dead,) the Lord saith that He will gather together all nations, nations who have lived mingled together in the same countries, that we may seem to hear them which have believed indeed in Him, but have not wrought good works, (as though that their dead faith could, being alone, lead them into life eternal,) that we may seem to hear such crying unto Him, "Lord, when saw we thee suffering such and such things, and did not minister unto thee?"

        If they shall go into everlasting fire who have not done works of mercy, shall not they go who have taken their neighbour's goods? Or shall not they go who have outraged the temple of God in their own selves, and so been merciless to themselves? As if works of mercy could avail anything without love, contrary to the words of the Apostle, "Though I bestow all my goods to feed the poor, and have not charity, it profiteth me nothing." And what manner of love to his neighbour hath he who loveth him as himself and loveth not himself? remembering that he that loveth iniquity hateth his own soul.

        Neither dare we say here that by which some delude themselves, namely, that the fire indeed is everlasting, but that they will not burn therein everlastingly. Such men say that they whose faith is dead, will pass through that everlasting fire, and that they are they to whom it is promised that they themselves shall be saved, yet so as by fire. So that, though the fire itself be everlasting, the burning of the damned therein, that is, the work of the fire upon them, will not be everlasting. As though the Lord were answering this beforehand, the last words of His Sermon are, "And these shall go away into everlasting punishment, but the righteous into life eternal." As the fire, so shall the burning be; and the Truth biddeth us know that they shall burn therein, who have lacked, not faith, but good works.
      responsory: |-
        R. Behold, now is the acceptable time; behold, now is the day of salvation: let us approve ourselves in much patience, in much fasting; * In the power of God, by the armour of righteousness.
        V. In all things let us approve ourselves as the ministers of God, in much patience, in much fasting.
        R. In the power of God, by the armour of righteousness.
      status: verified
