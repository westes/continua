collect:
  text: |
    Let us pray.
    Turn us, O God of our salvation, and that the Fast of these Forty Days may profit us, do Thou order all our thoughts according to thy heavenly teaching.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

collect/~-vespers:
  text: |
    Let us pray.
    Loose us, O Lord, we beseech thee, from all bonds of our sins, and in thy mercy turn away from us all pains which for the same we do justly deserve.
    Through Jesus Christ, thy Son our Lord, Who liveth and reigneth with thee, in the unity of the Holy Ghost, God, world without end.
    R. Amen.
  status: verified

