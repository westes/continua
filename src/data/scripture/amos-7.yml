# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: amos
chapter: 7
verses:
  - n: 1
    text:
      la: "haec ostendit mihi Dominus Deus et ecce fictor lucustae in principio germinantium serotini imbris et ecce serotinus post tonsorem regis"
      en: "These things the Lord God shewed to me: and behold the locust was formed in the beginning of the shooting up of the latter rain, and lo, it was the latter rain after the king's mowing."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et factum est cum consummasset comedere herbam terrae et dixi Domine Deus propitius esto obsecro quis suscitabit Iacob quia parvulus est"
      en: "And it came to pass, that when they had made an end of eating the grass of the land, I said: O Lord God, be merciful, I beseech thee: who shall raise up Jacob, for he is very little?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "misertus est Dominus super hoc non erit dixit Dominus"
      en: "The Lord had pity upon this: It shall not be, said the Lord."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "haec ostendit mihi Dominus Deus et ecce vocabat iudicium ad ignem Dominus Deus et devoravit abyssum multam et comedit simul partem"
      en: "These things the Lord God shewed to me: and behold the Lord called for judgment unto fire, and it devoured the great deep, and ate up a part at the same time."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dixi Domine Deus quiesce obsecro quis suscitabit Iacob quia parvulus est"
      en: "And I said: O Lord God, cease, I beseech thee, who shall raise up Jacob, for he is a little one?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "misertus est Dominus super hoc sed et istud non erit dixit Dominus Deus"
      en: "The Lord had pity upon this. Yea this also shall not be, said the Lord God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "haec ostendit mihi et ecce Dominus stans super murum litum et in manu eius trulla cementarii"
      en: "These things the Lord shewed to me: and behold the Lord was standing upon a plastered wall, and in his hand a mason's trowel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et dixit Dominus ad me quid tu vides Amos et dixi trullam cementarii et dixit Dominus ecce ego ponam trullam in medio populi mei Israhel non adiciam ultra superinducere eum"
      en: "And the Lord said to me: What seest thou, Amos? And I said: A mason's trowel. And the Lord said: Behold, I will lay down the trowel in the midst of my people Israel. I will plaster them over no more."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et demolientur excelsa idoli et sanctificationes Israhel desolabuntur et consurgam super domum Hieroboam in gladio"
      en: "And the high places of the idol shall be thrown down, and the sanctuaries of Israel shall be laid waste: and I will rise up against the house of Jeroboam with the sword."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et misit Amasias sacerdos Bethel ad Hieroboam regem Israhel dicens rebellavit contra te Amos in medio domus Israhel non poterit terra sustinere universos sermones eius"
      en: "And Amasias the priest of Bethel sent to Jeroboam king of Israel, saying: Amos hath rebelled against thee in the midst of the house of Israel: the land is not able to bear all his words."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "haec enim dicit Amos in gladio morietur Hieroboam et Israhel captivus migrabit de terra sua"
      en: "For thus saith Amos: Jeroboam shall die by the sword, and Israel shall be carried away captive out of their own land."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dixit Amasias ad Amos qui vides gradere fuge in terram Iuda et comede ibi panem et ibi prophetabis"
      en: "And Amasias said to Amos: Thou seer, go, flee away into the land of Juda: and eat bread there, and prophesy there."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et in Bethel non adicies ultra ut prophetes quia sanctificatio regis est et domus regni est"
      en: "But prophesy not again any more in Bethel: because it is the king's sanctuary, and it is the house of the kingdom."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et respondit Amos et dixit ad Amasiam non sum propheta et non sum filius prophetae sed armentarius ego sum vellicans sycomoros"
      en: "And Amos answered and said to Amasias: I am not a prophet, nor am I the son of a prophet: but I am a herdsman plucking wild figs."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et tulit me Dominus cum sequerer gregem et dixit ad me Dominus vade propheta ad populum meum Israhel"
      en: "And the Lord took me when I followed the flock, and the Lord said to me: Go, prophesy to my people Israel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et nunc audi verbum Domini tu dicis non prophetabis super Israhel et non stillabis super domum idoli"
      en: "And now hear thou the word of the Lord: Thou sayest, thou shalt not prophesy against Israel, and thou shalt not drop thy word upon the house of the idol."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "propter hoc haec dicit Dominus uxor tua in civitate fornicabitur et filii tui et filiae tuae in gladio cadent et humus tua funiculo metietur et tu in terra polluta morieris et Israhel captivus migrabit de terra sua"
      en: "Therefore thus saith the Lord: Thy wife shall play the harlot in the city, and thy sons and thy daughters shall fall by the sword, and thy land shall be measured by a line: and thou shalt die in a polluted land, and Israel shall go into captivity out of their land."
    status: { la: verified, en: verified }
