# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 10
verses:
  - n: 1
    text:
      la: "Ipse autem ego Paulus obsecro vos per mansuetudinem et modestiam Christi, qui in facie quidem humilis sum inter vos, absens autem confido in vos."
      en: "Now I Paul myself beseech you, by the mildness and modesty of Christ, who in presence indeed am lowly among you, but being absent, am bold toward you."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Rogo autem vos ne praesens audeam per eam confidentiam, qua existimor audere in quosdam, qui arbitrantur nos tamquam secundum carnem ambulemus."
      en: "But I beseech you, that I may not be bold when I am present, with that confidence wherewith I am thought to be bold, against some, who reckon us as if we walked according to the flesh."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "In carne enim ambulantes, non secundum carnem militamus."
      en: "For though we walk in the flesh, we do not war according to the flesh."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nam arma militiae nostrae non carnalia sunt, sed potentia Deo ad destructionem munitionum, consilia destruentes,"
      en: "For the weapons of our warfare are not carnal, but mighty to God unto the pulling down of fortifications, destroying counsels,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et omnem altitudinem extollentem se adversus scientiam Dei, et in captivitatem redigentes omnem intellectum in obsequium Christi,"
      en: "And every height that exhalteth itself against the knowledge of God, and bringing into captivity every understanding unto the obedience of Christ;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et in promptu habentes ulcisci omnem inobedientiam, cum impleta fuerit vestra obedientia."
      en: "And having in readiness to revenge all disobedience, when your obedience shall be fulfilled."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quae secundum faciem sunt, videte. Si quis confidit sibi Christi se esse, hoc cogitet iterum apud se: quia sicut ipse Christi est, ita et nos."
      en: "See the things that are according to outward appearance. If any man trust to himself, that he is Christ's, let him think this again with himself, that as he is Christ's, so are we also."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nam etsi amplius aliquid gloriatus fuero de potestate nostra, quam dedit nobis Dominus in aedificationem, et non in destructionem vestram, non erubescam."
      en: "For if also I should boast somewhat more of our power, which the Lord hath given us unto edification, and not for your destruction, I should not be ashamed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ut autem non existimer tamquam terrere vos per epistolas:"
      en: "But that I may not be thought as it were to terrify you by epistles,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quoniam quidem epistolae, inquiunt, graves sunt et fortes: praesentia autem corporis infirma, et sermo contemptibilis:"
      en: "(For his epistles indeed, say they, are weighty and strong; but his bodily presence is weak, and his speech contemptible,)"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "hoc cogitet qui ejusmodi est, quia quales sumus verbo per epistolas absentes, tales et praesentes in facto."
      en: "Let such a one think this, that such as we are in word by epistles, when absent, such also we will be indeed when present."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Non enim audemus inserere, aut comparare nos quibusdam, qui seipsos commendant: sed ipsi in nobis nosmetipsos metientes, et comparantes nosmetipsos nobis."
      en: "For we dare not match, or compare ourselves with some, that commend themselves; but we measure ourselves by ourselves, and compare ourselves with ourselves."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nos autem non in immensum gloriabimur, sed secundum mensuram regulae, qua mensus est nobis Deus, mensuram pertingendi usque ad vos."
      en: "But we will not glory beyond our measure; but according to the measure of the rule, which God hath measured to us, a measure to reach even unto you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non enim quasi non pertingentes ad vos, superextendimus nos: usque ad vos enim pervenimus in Evangelio Christi."
      en: "For we stretch not ourselves beyond our measure, as if we reached not unto you. For we are come as far as to you in the gospel of Christ."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Non in immensum gloriantes in alienis laboribus: spem autem habentes crescentis fidei vestrae, in vobis magnificari secundum regulam nostram in abundantiam,"
      en: "Not glorying beyond measure in other men's labours; but having hope of your increasing faith, to be magnified in you according to our rule abundantly;"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "etiam in illa, quae ultra vos sunt, evangelizare, non in aliena regula in iis quae praeparata sunt gloriari."
      en: "Yea, unto those places that are beyond you, to preach the gospel, not to glory in another man's rule, in those things that are made ready to our hand."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Qui autem gloriatur, in Domino glorietur."
      en: "But he that glorieth, let him glory in the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Non enim qui seipsum commendat, ille probatus est: sed quem Deus commendat."
      en: "For not he who commendeth himself, is approved, but he, whom God commendeth."
    status: { la: verified, en: verified }
