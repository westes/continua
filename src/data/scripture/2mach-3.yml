# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2mach
chapter: 3
verses:
  - n: 1
    text:
      la: "Igitur cum sancta civitas habitaretur in omni pace, leges etiam adhuc optime custodirentur, propter Oniae pontificis pietatem, et animos odio habentes mala,"
      en: "Therefore when the holy city was inhabited with all peace, and the laws as yet were very well kept, because of the godliness of Onias the high priest, and the hatred his soul had of evil,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fiebat ut et ipsi reges, et principes locum summo honore dignum ducerent, et templum maximis muneribus illustrarent:"
      en: "It came to pass that even the kings themselves, and the princes esteemed the place worthy of the highest honour, and glorified the temple with very great gifts:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ita ut Seleucus Asiae rex de redditibus suis praestaret omnes sumptus ad ministerium sacrificiorum pertinentes."
      en: "So that Seleucus king of Asia allowed out of his revenues all the charges belonging to the ministry of the sacrifices."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Simon autem de tribu Benjamin, praepositus templi constitutus, contendebat, obsistente sibi principe sacerdotum, iniquum aliquid in civitate moliri."
      en: "But one Simon of the tribe of Benjamin, who was appointed overseer of the temple, strove in opposition to the high priest, to bring about some unjust thing in the city."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sed cum vincere Oniam non posset, venit ad Apollonium Tharsaeae filium, qui eo tempore erat dux Coelesyriae et Phoenicis:"
      en: "And when he could not overcome Onias he went to Apollonius the son of Tharseas, who at that time was governor of Celesyria and Phenicia:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et nuntiavit ei pecuniis innumerabilibus plenum esse aerarium Jerosolymis, et communes copias immensas esse, quae non pertinent ad rationem sacrificiorum: esse autem possibile sub potestate regis cadere universa."
      en: "And told him, that the treasury in Jerusalem was full of immense sums of money, and the common store was infinite, which did not belong to the account of the sacrifices: and that it was possible to bring all into the king's hands."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cumque retulisset ad regem Apollonius de pecuniis quae delatae erant, illae accitum Heliodorum, qui erat super negotia ejus, misit cum mandatis, ut praedictam pecuniam transportaret."
      en: "Now when Apollonius had given the king notice concerning the money that he was told of, he called for Heliodorus, who had the charge over his affairs, and sent him with commission to bring him the foresaid money."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Statimque Heliodorus iter est agressus, specie quidem quasi per Coelesyriam et Phoenicen civitates esset peragraturus, re vera autem regis propositum perfecturus."
      en: "So Heliodorus forthwith began his journey, under a colour of visiting the cities of Celesyria and Phenicia, but indeed to fulfill the king's purpose."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sed cum venisset Jerosolymam, et benigne a summo sacerdote in civitate esset exceptus, narravit de dato indicio pecuniarum: et cujus rei gratia adesset, aperuit: interrogabat autem si vere haec ita essent."
      en: "And when he was come to Jerusalem, and had been courteously received in the city by the high priest, he told him what information had been given concerning the money: and declared the cause for which he was come: and asked if these things were so indeed."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tunc summus sacerdos ostendit deposita esse haec, et victualia viduarum, et pupillorum:"
      en: "Then the high priest told him that these were sums deposited, and provisions for the subsistence of the widows and the fatherless."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quaedam vero esse Hircani Tobiae viri valde eminentis, in his quae detulerat impius Simon: universa autem argenti talenta esse quadringenta, et auri ducenta:"
      en: "And that some part of that which wicked Simon had given intelligence of, belonged to Hircanus son of Tobias, a man of great dignity: and that the whole was four hundred talents of silver, and two hundred of gold:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "decipi vero eos, qui credidissent loco et templo, quod per universum mundum honoratur pro sui veneratione, et sanctitate omnino impossibile esse."
      en: "But that to deceive them who had trusted to the place and temple which is honoured throughout the whole world, for the reverence and holiness of it, was a thing which could not by any means be done."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "At ille pro his quae habebat in mandatis a rege, dicebat omni genere regi ea esse deferenda."
      en: "But he, by reason of the orders he had received from the king, said that by all means the money must be carried to the king."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Constituta autem die intrabat de his Heliodorus ordinaturus. Non modica vero per universam civitatem erat trepidatio."
      en: "So on the day he had appointed, Heliodorus entered in to order this matter. But there was no small terror throughout the whole city."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sacerdotes autem ante altare cum stolis sacerdotalibus jactaverunt se, et invocabant de caelo eum, qui de depositis legem posuit, ut his qui deposuerant ea salva custodiret."
      en: "And the priests prostrated themselves before the altar in their priests' vestments, and called upon him from heaven, who made the law concerning things given to be kept, that he would preserve them safe, for them that had deposited them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Jam vero qui videbat summi sacerdotis vultum, mente vulnerabatur: facies enim et color immutatus declarabat internum animi dolorem:"
      en: "Now whosoever saw the countenance of the high priest, was wounded in heart: for his face, and the changing of his colour declared the inward sorrow of his mind."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "circumfusa enim erat moestitia quaedam viro, et horror corporis, per quem manifestus aspicientibus dolor cordis ejus efficiebatur."
      en: "For the man was so compassed with sadness and horror of the body, that it was manifest to them that beheld him, what sorrow he had in his heart."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Alii etiam gregatim de domibus confluebant, publica supplicatione obsecrantes, pro eo quod in contemptum locus esset venturus."
      en: "Others also came flocking together out of their houses, praying and making public supplication, because the place was like to come into contempt."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Accinctaeque mulieres ciliciis pectus, per plateas confluebant: sed et virgines, quae conclusae erant, procurrebant ad Oniam, aliae autem ad muros, quaedam vero per fenestras aspiciebant:"
      en: "And the women, girded with haircloth about their breasts, came together in the streets. And the virgins also that were shut up, came forth, some to Onias, and some to the walls, and others looked out of the windows."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "universae autem protendentes manus in caelum, deprecabantur:"
      en: "And all holding up their hands towards heaven, made supplication."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "erat enim misera commistae multitudinis, et magni sacerdotis in agone constituti exspectatio."
      en: "For the expectation of the mixed multitude, and of the high priest who was in an agony, would have moved any one to pity."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et hi quidem invocabant omnipotentem Deum, ut credita sibi his qui crediderant, cum omni integritate conservarentur."
      en: "And these indeed called upon almighty God, to preserve the things that had been committed to them, safe and sure for those that had committed them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Heliodorus autem, quod decreverat, perficiebat eodem loco ipse cum satellitibus circa aerarium praesens."
      en: "But Heliodorus executed that which he had resolved on, himself being present in the same place with his guard about the treasury."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Sed spiritus omnipotentis Dei magnam fecit suae ostensionis evidentiam, ita ut omnes, qui ausi fuerant parere ei, ruentes Dei virtute, in dissolutionem et formidinem converterentur."
      en: "But the spirit of the almighty God gave a great evidence of his presence, so that all that had presumed to obey him, falling down by the power of God, were struck with fainting and dread."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Apparuit enim illis quidam equus terribilem habens sessorem, optimis operimentis adornatus: isque cum impetu Heliodoro priores calces elisit: qui autem ei sedebat, videbatur arma habere aurea."
      en: "For there appeared to them a horse with a terrible rider upon him, adorned with a very rich covering: and he ran fiercely and struck Heliodorus with his fore feet, and he that sat upon him seemed to have armour of gold."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Alii etiam apparuerunt duo juvenes virtute decori, optimi gloria, speciosique amictu: qui circumsteterunt eum, et ex utraque parte flagellabant, sine intermissione multis plagis verberantes."
      en: "Moreover there appeared two other young men beautiful and strong, bright and glorious, and in comely apparel: who stood by him, on either side, and scourged him without ceasing with many stripes."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Subito autem Heliodorus concidit in terram, eumque multa caligine circumfusum rapuerunt, atque in sella gestatoria positum ejecerunt."
      en: "And Heliodorus suddenly fell to the ground, and they took him up covered with great darkness, and having put him into a litter they carried him out."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et is, qui cum multis cursoribus, et satellitibus praedictum ingressus est aerarium, portabatur nullo sibi auxilium ferente, manifesta Dei cognita virtute:"
      en: "So he that came with many servants, and all his guard into the aforesaid treasury, was carried out, no one being able to help him, the manifest power of God being known."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et ille quidem per divinam virtutem jacebat mutus, atque omni spe et salute privatus."
      en: "And he indeed by the power of God lay speechless, and without all hope of recovery."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Hi autem Dominum benedicebant, quia magnificabat locum suum: et templum, quod paulo ante timore ac tumultu erat plenum, apparente omnipotente Domino, gaudio et laetitia impletum est."
      en: "But they praised the Lord because he had glorified his place: and the temple, that a little before was full of fear and trouble, when the almighty Lord appeared, was filled with joy and gladness."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Tunc vero ex amicis Heliodori quidam rogabant confestim Oniam, ut invocaret Altissimum, ut vitam donaret ei, qui in supremo spiritu erat constitutus."
      en: "Then some of the friends of Heliodorus forthwith begged of Onias, that he would call upon the most High to grant him his life, who was ready to give up the ghost."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Considerans autem summus sacerdos ne forte rex suspicaretur malitiam aliquam ex Judaeis circa Heliodorum consummatum, obtulit pro salute viri hostiam salutarem."
      en: "So the high priest considering that the king might perhaps suspect that some mischief had been done to Heliodorus by the Jews, offered a sacrifice of health for the recovery of the man."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Cumque summus sacerdos exoraret, iidem juvenes eisdem vestibus amicti, astantes Heliodoro, dixerunt: Oniae sacerdoti gratias age: nam propter eum Dominus tibi vitam donavit."
      en: "And when the high priest was praying, the same young men in the same clothing stood by Heliodorus, and said to him: Give thanks to Onias the priest: because for his sake the Lord hath granted thee life."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Tu autem a Deo flagellatus, nuntia omnibus magnalia Dei, et potestatem. Et his dictis, non comparuerunt."
      en: "And thou having been scourged by God, declare unto all men the great works and the power of God. And having spoken thus, they appeared no more."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Heliodorus autem, hostia Deo oblata, et votis magnis promissis ei, qui vivere illi concessit, et Oniae gratias agens, recepto exercitu, repedabat ad regem."
      en: "So Heliodorus after he had offered a sacrifice to God, and made great vows to him, that had granted him life, and given thanks to Onias, taking his troops with him, returned to the king."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Testabatur autem omnibus ex quae sub oculis suis viderat opera magni Dei."
      en: "And he testified to all men the works of the great God, which he had seen with his own eyes."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Cum autem rex interrogasset Heliodorum, quis esset aptus adhuc semel Jerosolymam mitti, ait:"
      en: "And when the king asked Heliodorus, who might be a fit man to be sent yet once more to Jerusalem, he said:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Si quem habes hostem, aut regni tui insidiatorem, mitte illuc, et flagellatum eum recipies, si tamen evaserit: eo quod in loco sit vere Dei quaedam virtus."
      en: "If thou hast any enemy or traitor to thy kingdom, send him thither, and thou shalt receive him again scourged, if so be he escape: for there is undoubtedly in that place a certain power of God."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Nam ipse, qui habet in caelis habitationem, visitator et adjutor est loci illius, et venientes ad malefaciendum percutit, ac perdit."
      en: "For he that hath his dwelling in the heavens, is the visitor, and protector of that place, and he striketh and destroyeth them that come to do evil to it."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Igitur de Heliodoro, et aerarii custodia ita res se habet."
      en: "And the things concerning Heliodorus, and the keeping of the treasury fell out in this manner."
    status: { la: verified, en: verified }
