# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 3
verses:
  - n: 1
    text:
      la: "Et angelo ecclesiae Sardis scribe: Haec dicit qui habet septem spiritus Dei, et septem stellas: Scio opera tua, quia nomen habes quod vivas, et mortuus es."
      en: "And to the angel of the church of Sardis, write: These things saith he, that hath the seven spirits of God, and the seven stars: I know thy works, that thou hast the name of being alive: and thou art dead."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Esto vigilans, et confirma cetera, quae moritura erant. Non enim invenio opera tua plena coram Deo meo."
      en: "Be watchful and strengthen the things that remain, which are ready to die. For I find not thy works full before my God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "In mente ergo habe qualiter acceperis, et audieris, et serva, et poenitentiam age. Si ergo non vigilaveris, veniam ad te tamquam fur et nescies qua hora veniam ad te."
      en: "Have in mind therefore in what manner thou hast received and heard: and observe, and do penance. If then thou shalt not watch, I will come to thee as a thief, and thou shalt not know at what hour I will come to thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sed habes pauca nomina in Sardis qui non inquinaverunt vestimenta sua: et ambulabunt mecum in albis, quia digni sunt."
      en: "But thou hast a few names in Sardis, which have not defiled their garments: and they shall walk with me in white, because they are worthy."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui vicerit, sic vestietur vestimentis albis, et non delebo nomen ejus de libro vitae, et confitebor nomen ejus coram Patre meo, et coram angelis ejus."
      en: "He that shall overcome, shall thus be clothed in white garments, and I will not blot out his name out of the book of life, and I will confess his name before my Father, and before his angels."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui habet aurem, audiat quid Spiritus dicat ecclesiis."
      en: "He that hath an ear, let him hear what the Spirit saith to the churches."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et angelo Philadelphiae ecclesiae scribe: Haec dicit Sanctus et Verus, qui habet clavem David: qui aperit, et nemo claudit: claudit, et nemo aperit:"
      en: "And to the angel of the church of Philadelphia, write: These things saith the Holy One and the true one, he that hath the key of David; he that openeth, and no man shutteth; shutteth, and no man openeth:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Scio opera tua. Ecce dedi coram te ostium apertum, quod nemo potest claudere: quia modicam habes virtutem, et servasti verbum meum, et non negasti nomen meum."
      en: "I know thy works. Behold, I have given before thee a door opened, which no man can shut: because thou hast a little strength, and hast kept my word, and hast not denied my name."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ecce dabo de synagoga Satanae, qui dicunt se Judaeos esse, et non sunt, sed mentiuntur: ecce faciam illos ut veniant, et adorent ante pedes tuos: et scient quia ego dilexi te,"
      en: "Behold, I will bring of the synagogue of Satan, who say they are Jews, and are not, but do lie. Behold, I will make them to come and adore before thy feet. And they shall know that I have loved thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quoniam servasti verbum patientiae meae, et ego servabo te ab hora tentationis, quae ventura est in orbem universum tentare habitantes in terra."
      en: "Because thou hast kept the word of my patience, I will also keep thee from the hour of the temptation, which shall come upon the whole world to try them that dwell upon the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ecce venio cito: tene quod habes, ut nemo accipiat coronam tuam."
      en: "Behold, I come quickly: hold fast that which thou hast, that no man take thy crown."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Qui vicerit, faciam illum columnam in templo Dei mei, et foras non egredietur amplius: et scribam super eum nomen Dei mei, et nomen civitatis Dei mei novae Jerusalem, quae descendit de caelo a Deo meo, et nomen meum novum."
      en: "He that shall overcome, I will make him a pillar in the temple of my God; and he shall go out no more; and I will write upon him the name of my God, and the name of the city of my God, the new Jerusalem, which cometh down out of heaven from my God, and my new name."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Qui habet aurem, audiat quid Spiritus dicat ecclesiis."
      en: "He that hath an ear, let him hear what the Spirit saith to the churches."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et angelo Laodiciae ecclesiae scribe: Haec dicit: Amen, testis fidelis et verus, qui est principium creaturae Dei."
      en: "And to the angel of the church of Laodicea, write: These things saith the Amen, the faithful and true witness, who is the beginning of the creation of God:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Scio opera tua: quia neque frigidus es, neque calidus: utinam frigidus esses, aut calidus:"
      en: "I know thy works, that thou art neither cold, nor hot. I would thou wert cold, or hot."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sed quia tepidus es, et nec frigidus, nec calidus, incipiam te evomere ex ore meo:"
      en: "But because thou art lukewarm, and neither cold, nor hot, I will begin to vomit thee out of my mouth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quia dicis: Quod dives sum, et locupletatus, et nullius egeo: et nescis quia tu es miser, et miserabilis, et pauper, et caecus, et nudus."
      en: "Because thou sayest: I am rich, and made wealthy, and have need of nothing: and knowest not, that thou art wretched, and miserable, and poor, and blind, and naked."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Suadeo tibi emere a me aurum ignitum probatum, ut locuples fias, et vestimentis albis induaris, et non appareat confusio nuditatis tuae, et collyrio inunge oculos tuos ut videas."
      en: "I counsel thee to buy of me gold fire tried, that thou mayest be made rich; and mayest be clothed in white garments, and that the shame of thy nakedness may not appear; and anoint thy eyes with eyesalve, that thou mayest see."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ego quos amo, arguo, et castigo. Aemulare ergo, et poenitentiam age."
      en: "Such as I love, I rebuke and chastise. Be zealous therefore, and do penance."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ecce sto ad ostium, et pulso: si quis audierit vocem meam, et aperuerit mihi januam, intrabo ad illum, et coenabo cum illo, et ipse mecum."
      en: "Behold, I stand at the gate, and knock. If any man shall hear my voice, and open to me the door, I will come in to him, and will sup with him, and he with me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui vicerit, dabo ei sedere mecum in throno meo: sicut et ego vici, et sedi cum Patre meo in throno ejus."
      en: "To him that shall overcome, I will give to sit with me in my throne: as I also have overcome, and am set down with my Father in his throne."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Qui habet aurem, audiat quid Spiritus dicat ecclesiis."
      en: "He that hath an ear, let him hear what the Spirit saith to the churches."
    status: { la: verified, en: verified }
