# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 28
verses:
  - n: 1
    text:
      la: "Habet argentum venarum suarum principia, et auro locus est in quo conflatur."
      en: "Silver hath beginnings of its veins, and gold hath a place wherein it is melted."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ferrum de terra tollitur, et lapis solutus calore in aes vertitur."
      en: "Iron is taken out of the earth, and stone melted with heat is turned into brass."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tempus posuit tenebris, et universorum finem ipse considerat, lapidem quoque caliginis et umbram mortis."
      en: "He hath set a time for darkness, and the end of all things he considereth, the stone also that is in the dark and the shadow of death."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dividit torrens a populo peregrinante, eos quos oblitus est pes egentis hominis, et invios."
      en: "The flood divideth from the people that are on their journey, those whom the food of the needy man hath forgotten, and who cannot be come at."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Terra, de qua oriebatur panis, in loco suo igni subversa est."
      en: "The land, out of which bread grew in its place, hath been overturned with fire."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Locus sapphiri lapides ejus, et glebae illius aurum."
      en: "The stones of it are the place of sapphires, and the clods of it are gold."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Semitam ignoravit avis, nec intuitus est eam oculus vulturis."
      en: "The bird hath not known the path, neither hath the eye of the vulture beheld it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non calcaverunt eam filii institorum, nec pertransivit per eam leaena."
      en: "The children of the merchants have not trodden it, neither hath the lioness passed by it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ad silicem extendit manum suam, subvertit a radicibus montes."
      en: "He hath stretched forth his hand to the flint, he hath overturned mountains from the roots."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "In petris rivos excidit, et omne pretiosum vidit oculus ejus."
      en: "In the rocks he hath cut out rivers, and his eye hath seen every precious thing."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Profunda quoque fluviorum scrutatus est, et abscondita in lucem produxit."
      en: "The depths also of rivers he hath searched, and hidden things he hath brought forth to light."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sapientia vero ubi invenitur? et quis est locus intelligentiae?"
      en: "But where is wisdom to be found, and where is the place of understanding?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nescit homo pretium ejus, nec invenitur in terra suaviter viventium."
      en: "Man knoweth not the price thereof, neither is it found in the land of them that live in delights."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Abyssus dicit: Non est in me, et mare loquitur: Non est mecum."
      en: "The depth saith: It is not in me: and the sea saith: It is not with me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Non dabitur aurum obrizum pro ea, nec appendetur argentum in commutatione ejus."
      en: "The finest gold shall not purchase it, neither shall silver be weighed in exchange for it."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non conferetur tinctis Indiae coloribus, nec lapidi sardonycho pretiosissimo, vel sapphiro."
      en: "It shall not be compared with the dyed colours of India, or with the most precious stone sardonyx, or the sapphire."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non adaequabitur ei aurum vel vitrum, nec commutabuntur pro ea vasa auri."
      en: "Gold or crystal cannot equal it, neither shall any vessels of gold be changed for it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Excelsa et eminentia non memorabuntur comparatione ejus: trahitur autem sapientia de occultis."
      en: "High and eminent things shall not be mentioned in comparison of it: but wisdom is drawn out of secret places."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Non adaequabitur ei topazius de Aethiopia, nec tincturae mundissimae componetur."
      en: "The topaz of Ethiopia shall not be equal to it, neither shall it be compared to the cleanest dyeing."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Unde ergo sapientia venit? et quis est locus intelligentiae?"
      en: "Whence then cometh wisdom? and where is the place of understanding?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Abscondita est ab oculis omnium viventium: volucres quoque caeli latet."
      en: "It is hid from the eyes of all living. and the fowls of the air know it not."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Perditio et mors dixerunt: Auribus nostris audivimus famam ejus."
      en: "Destruction and death have said: With our ears we have heard the fame thereof."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Deus intelligit viam ejus, et ipse novit locum illius."
      en: "God understandeth the way of it, and he knoweth the place thereof."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ipse enim fines mundi intuetur, et omnia quae sub caelo sunt respicit."
      en: "For he beholdeth the ends of the world: and looketh on all things that are under heaven."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Qui fecit ventis pondus, et aquas appendit in mensura."
      en: "Who made a weight for the winds and weighed the waters by measure."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Quando ponebat pluviis legem, et viam procellis sonantibus:"
      en: "When he gave a law for the rain, and a way for the sounding storms."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "tunc vidit illam et enarravit, et praeparavit, et investigavit."
      en: "Then he saw it, and declared, and prepared, and searched it."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et dixit homini: Ecce timor Domini, ipsa est sapientia, et recedere a malo, intelligentia."
      en: "And he said to man: Behold the fear of the Lord, that is wisdom: and to depart from evil, is understanding."
    status: { la: verified, en: verified }
