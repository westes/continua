# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 25
verses:
  - n: 1
    text:
      la: "Abraham vero aliam duxit uxorem nomine Ceturam:"
      en: "And Abraham married another wife, named Cetura:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quae peperit ei Zamran et Jecsan, et Madam, et Madian, et Jesboc, et Sue."
      en: "Who bore him Zamran, and Jecsan, and Madan, and Madian, and Jesboc, and Sue."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Jecsan quoque genuit Saba et Dadan. Filii Dadan fuerunt Assurim, et Latusim, et Loomin."
      en: "Jecsan also begot Saba and Dadan. The children of Dadan were Assurim, and Latusim, and Loomin."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "At vero ex Madian ortus est Epha, et Opher, et Henoch, et Abida, et Eldaa: omnes hi filii Ceturae."
      en: "But of Madian was born Epha, and Opher, and Henoch, and Abida, and Eldaa: all these were the children of Cetura."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Deditque Abraham cuncta quae possederat, Isaac:"
      en: "And Abraham gave all his possessions to Isaac."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "filiis autem concubinarum largitus est munera, et separavit eos ab Isaac filio suo, dum adhuc ipse viveret, ad plagam orientalem."
      en: "And to the children of the concubines he gave gifts, and separated them from Isaac his son, while he yet lived, to the east country."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Fuerunt autem dies vitae Abrahae, centum septuaginta quinque anni."
      en: "And the days of Abraham's life were a hundred and seventy-five years."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et deficiens mortuus est in senectute bona, provectaeque aetatis et plenus dierum: congregatusque est ad populum suum."
      en: "And decaying he died in a good old age, and having lived a long time, and being full of days: and was gathered to his people."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et sepelierunt eum Isaac et Ismael filii sui in spelunca duplici, quae sita est in agro Ephron filii Seor Hethaei, e regione Mambre,"
      en: "And Isaac and Ismael his sons buried him in the double cave, which was situated in the field of Ephron the son of Seor the Hethite, over against Mambre;"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quem emerat a filiis Heth: ibi sepultus est ipse, et Sara uxor ejus."
      en: "Which he had bought of the children of Heth: there was he buried, and Sara his wife."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et post obitum illius benedixit Deus Isaac filio ejus, qui habitabat juxta puteum nomine Viventis et videntis."
      en: "And after his death, God blessed Isaac his son, who dwelt by the well named Of the living and seeing."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Hae sunt generationes Ismael filii Abrahae, quem peperit ei Agar Aegyptia, famula Sarae: et"
      en: "These are the generations of Ismael the son of Abraham, whom Agar the Egyptian, Sara's servant, bore unto him:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "haec nomina filiorum ejus in vocabulis et generationibus suis. Primogenitus Ismaelis Nabaioth, deinde Cedar, et Adbeel, et Mabsam,"
      en: "And these are the names of his children according to their calling and generations. The firstborn of Ismael was Nabajoth, then Cedar, and Adbeel, and Mabsam."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Masma quoque, et Duma, et Massa,"
      en: "And Masma, and Duma, and Massa,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Hadar, et Thema, et Jethur, et Naphis, et Cedma."
      en: "Hadar, and Thema, and Jethur, and Naphis, and Cedma."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Isti sunt filii Ismaelis: et haec nomina per castella et oppida eorum, duodecim principes tribuum suarum."
      en: "These are the sons of Ismael: and these are their names by their castles and towns, twelve princes of their tribes."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et facti sunt anni vitae Ismaelis centum triginta septem, deficiensque mortuus est, et appositus ad populum suum."
      en: "And the years of Ismael's life were a hundred and thirty-seven, and decaying he died, and was gathered unto his people."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Habitavit autem ab Hevila usque Sur, quae respicit Aegyptum introeuntibus Assyrios; coram cunctis fratribus suis obiit."
      en: "And he dwelt from Hevila as far as Sur, which looketh towards Egypt, to them that go towards the Assyrians. He died in the presence of all his brethren."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Hae quoque sunt generationes Isaac filii Abraham: Abraham genuit Isaac:"
      en: "These also are the generations of Isaac the son of Abraham: Abraham begot Isaac:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui cum quadraginta esset annorum, duxit uxorem Rebeccam filiam Bathuelis Syri de Mesopotamia, sororem Laban."
      en: "Who when he was forty years old, took to wife Rebecca the daughter of Bathuel the Syrian of Mesopotamia, sister to Laban."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Deprecatusque est Isaac Dominum pro uxore sua, eo quod esset sterilis: qui exaudivit eum, et dedit conceptum Rebeccae."
      en: "And Isaac besought the Lord for his wife, because she was barren; and he heard him, and made Rebecca to conceive."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Sed collidebantur in utero ejus parvuli; quae ait: Si sic mihi futurum erat, quid necesse fuit concipere? perrexitque ut consuleret Dominum."
      en: "But the children struggled in her womb: and she said: If it were to be so with me, what need was there to conceive? And she went to consult the Lord."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui respondens ait: Duae gentes sunt in utero tuo, et duo populi ex ventre tuo dividentur, populusque populum superabit, et major serviet minori."
      en: "And he answering said: Two nations are in thy womb, and two peoples shall be divided out of thy womb, and one people shall overcome the other, and the elder shall serve the younger."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Jam tempus pariendi advenerat, et ecce gemini in utero ejus reperti sunt."
      en: "And when her time was come to be delivered, behold twins were found in her womb."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Qui prior egressus est, rufus erat, et totus in morem pellis hispidus: vocatumque est nomen ejus Esau. Protinus alter egrediens, plantam fratris tenebat manu: et idcirco appellavit eum Jacob."
      en: "He that came forth first was red, and hairy like a skin: and his name was called Esau. Immediately the other coming forth, held his brother's foot in his hand, and therefore he was called Jacob."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sexagenarius erat Isaac quando nati sunt ei parvuli."
      en: "Isaac was threescore years old when the children were born unto him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quibus adultis, factus est Esau vir gnarus venandi, et homo agricola: Jacob autem vir simplex habitabat in tabernaculis."
      en: "And when they were grown up, Esau became a skillful hunter, and a husbandman, but Jacob a plain man dwelt in tents."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Isaac amabat Esau, eo quod de venationibus illius vesceretur: et Rebecca diligebat Jacob."
      en: "Isaac loved Esau, because he ate of his hunting: and Rebecca loved Jacob."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Coxit autem Jacob pulmentum: ad quem cum venisset Esau de agro lassus,"
      en: "And Jacob boiled pottage: to whom Esau, coming faint out of the field,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ait: Da mihi de coctione hac rufa, quia oppido lassus sum. Quam ob causam vocatum est nomen ejus Edom."
      en: "Said: Give me of this red pottage, for I am exceeding faint. For which reason his name was called Edom."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Cui dixit Jacob: Vende mihi primogenita tua."
      en: "And Jacob said to him: Sell me thy first birthright."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ille respondit: En morior, quid mihi proderunt primogenita?"
      en: "He answered: Lo I die, what will the first birthright avail me?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ait Jacob: Jura ergo mihi. Juravit ei Esau et vendidit primogenita."
      en: "Jacob said: Swear therefore to me. Esau swore to him, and sold his first birthright."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et sic, accepto pane et lentis edulio, comedit et bibit, et abiit, parvipendens quod primogenita vendidisset."
      en: "And so taking bread and the pottage of lentils, he ate, and drank, and went his way; making little account of having sold his first birthright."
    status: { la: verified, en: verified }
