# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1reg
chapter: 2
verses:
  - n: 1
    text:
      la: "exultavit cor meum in Domino exaltatum est cornu meum in Domino dilatatum est os meum super inimicos meos quia laetata sum in salutari tuo"
      en: "My heart hath rejoiced in the Lord, and my horn is exalted in my God: my mouth is enlarged over my enemies: because I have joyed in thy salvation."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "non est sanctus ut est Dominus neque enim est alius extra te et non est fortis sicut Deus noster"
      en: "There is none holy as the Lord is: for there is no other beside thee, and there is none strong like our God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nolite multiplicare loqui sublimia gloriantes recedant vetera de ore vestro quoniam Deus scientiarum Dominus est et ipsi praeparantur cogitationes"
      en: "Do not multiply to speak lofty things, boasting: let old matters depart from your mouth: for the Lord is a God of all knowledge, and to him are thoughts prepared."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "arcus fortium superatus est et infirmi accincti sunt robore"
      en: "The bow of the mighty is overcome, and the weak are girt with strength."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "saturati prius pro pane se locaverunt et famelici saturati sunt donec sterilis peperit plurimos et quae multos habebat filios infirmata est"
      en: "They that were full before have hired out themselves for bread: and the hungry are filled, so that the barren hath borne many: and she that had many children is weakened."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dominus mortificat et vivificat deducit ad infernum et reducit"
      en: "The Lord killeth and maketh alive, he bringeth down to hell and bringeth back again."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dominus pauperem facit et ditat humiliat et sublevat"
      en: "The Lord maketh poor and maketh rich, he humbleth and he exalteth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "suscitat de pulvere egenum et de stercore elevat pauperem ut sedeat cum principibus et solium gloriae teneat Domini enim sunt cardines terrae et posuit super eos orbem"
      en: "He raiseth up the needy from the dust, and lifteth up the poor from the dunghill: that he may sit with princes, and hold the throne of glory. For the poles of the earth are the Lord's, and upon them he hath set the world."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "pedes sanctorum suorum servabit et impii in tenebris conticescent quia non in fortitudine roborabitur vir"
      en: "He will keep the feet of his saints, and the wicked shall be silent in darkness, because no man shall prevail by his own strength."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dominum formidabunt adversarii eius super ipsos in caelis tonabit Dominus iudicabit fines terrae et dabit imperium regi suo et sublimabit cornu christi sui"
      en: "The adversaries of the Lord shall fear him: and upon them shall he thunder in the heavens. The Lord shall judge the ends of the earth, and he shall give empire to his king, and shall exalt the horn of his Christ."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et abiit Helcana Ramatha in domum suam puer autem erat minister in conspectu Domini ante faciem Heli sacerdotis"
      en: "And Elcana went to Ramatha, to his house: but the child ministered in the sight of the Lord before the face of Heli the priest."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "porro filii Heli filii Belial nescientes Dominum"
      en: "Now the sons of Heli were children of Belial, not knowing the Lord,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "neque officium sacerdotum ad populum sed quicumque immolasset victimam veniebat puer sacerdotis dum coquerentur carnes et habebat fuscinulam tridentem in manu sua"
      en: "Nor the office of the priests to the people: but whosoever had offered a sacrifice, the servant of the priest came, while the flesh was in boiling, with a fleshhook of three teeth in his hand,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et mittebat eam in lebetem vel in caldariam aut in ollam sive in caccabum et omne quod levabat fuscinula tollebat sacerdos sibi sic faciebant universo Israheli venientium in Silo"
      en: "And thrust it into the kettle, or into the caldron, or into the pot, or into the pan: and all that the fleshhook brought up, the priest took to himself. Thus did they to all Israel that came to Silo."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "etiam antequam adolerent adipem veniebat puer sacerdotis et dicebat immolanti da mihi carnem ut coquam sacerdoti non enim accipiam a te carnem coctam sed crudam"
      en: "Also before they burnt the fat, the servant of the priest came, and said to the man that sacrificed: Give me flesh to boil for the priest: for I will not take of thee sodden flesh, but raw."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dicebatque illi immolans incendatur primum iuxta morem hodie adeps et tolle tibi quantumcumque desiderat anima tua qui respondens aiebat ei nequaquam nunc enim dabis alioquin tollam vi"
      en: "And he that sacrificed said to him: Let the fat first be burnt to day according to the custom, and then take as much as thy soul desireth. But he answered and said to him: Not so: but thou shalt give it me now, or else I will take it by force."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "erat ergo peccatum puerorum grande nimis coram Domino quia detrahebant homines sacrificio Domini"
      en: "Wherefore the sin of the young men was exceeding great before the Lord: because they withdrew men from the sacrifice of the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Samuhel autem ministrabat ante faciem Domini puer accinctus ephod lineo"
      en: "But Samuel ministered before the face of the Lord: being a child girded with a linen ephod."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et tunicam parvam faciebat ei mater sua quam adferebat statutis diebus ascendens cum viro suo ut immolaret hostiam sollemnem"
      en: "And his mother made him a little coat, which she brought to him on the appointed days, when she went up with her husband, to offer the solemn sacrifice."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et benedixit Heli Helcanae et uxori eius dixitque reddat Dominus tibi semen de muliere hac pro fenore quod commodasti Domino et abierunt in locum suum"
      en: "And Heli blessed Elcana and his wife: and he said to him: The Lord give thee seed of this woman, for the loan thou hast lent to the Lord. And they went to their own home."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "visitavit ergo Dominus Annam et concepit et peperit tres filios et duas filias et magnificatus est puer Samuhel apud Dominum"
      en: "And the Lord visited Anna, and she conceived, and bore three sons and two daughters: and the child Samuel became great before the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Heli autem erat senex valde et audivit omnia quae faciebant filii sui universo Israheli et quomodo dormiebant cum mulieribus quae observabant ad ostium tabernaculi"
      en: "Now Heli was very old, and he heard all that his sons did to all Israel: and how they lay with the women that waited at the door of the tabernacle:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et dixit eis quare facitis res huiuscemodi quas ego audio res pessimas ab omni populo"
      en: "And he said to them: Why do ye these kinds of things, which I hear, very wicked things, from all the people?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "nolite filii mi non enim est bona fama quam ego audio ut transgredi faciatis populum Domini"
      en: "Do not so, my sons: for it is no good report that I hear, that you make the people of the Lord to transgress."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "si peccaverit vir in virum placari ei potest Deus si autem in Domino peccaverit vir quis orabit pro eo et non audierunt vocem patris sui quia voluit Dominus occidere eos"
      en: "If one man shall sin against another, God may be appeased in his behalf: but if a man shall sin against the Lord, who shall pray for him? And they hearkened not to the voice of their father, because the Lord would slay them."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "puer autem Samuhel proficiebat atque crescebat et placebat tam Deo quam hominibus"
      en: "But the child Samuel advanced, and grew on, and pleased both the Lord and men."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "venit autem vir Dei ad Heli et ait ad eum haec dicit Dominus numquid non aperte revelatus sum domui patris tui cum essent in Aegypto in domo Pharaonis"
      en: "And there came a man of God to Heli, and said to him: Thus saith the Lord: Did I not plainly appear to thy father's house, when they were in Egypt in the house of Pharao?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et elegi eum ex omnibus tribubus Israhel mihi in sacerdotem ut ascenderet altare meum et adoleret mihi incensum et portaret ephod coram me et dedi domui patris tui omnia de sacrificiis filiorum Israhel"
      en: "And I chose him out of all the tribes of Israel to be my priest, to go up to my sitar, and burn incense to me, and to wear the ephod before me: and I gave to thy father's house of all the sacrifices of the children of Israel."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quare calce abicitis victimam meam et munera mea quae praecepi ut offerrentur in templo et magis honorasti filios tuos quam me ut comederetis primitias omnis sacrificii Israhel populi mei"
      en: "Why have you kicked away my victims, and my gifts which I commanded to be offered in the temple: and thou hast rather honoured thy sons than me, to eat the firstfruits of every sacrifice of my people Israel?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "propterea ait Dominus Deus Israhel loquens locutus sum ut domus tua et domus patris tui ministraret in conspectu meo usque in sempiternum nunc autem dicit Dominus absit hoc a me sed quicumque glorificaverit me glorificabo eum qui autem contemnunt me erunt ignobiles"
      en: "Wherefore thus saith the Lord the God of Israel: I said indeed that thy house, and the house of thy father should minister in my sight, for ever. But now saith the Lord: Far be this from me: but whosoever shall glorify me, him will I glorify: but they that despise me, shall be despised."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ecce dies veniunt et praecidam brachium tuum et brachium domus patris tui ut non sit senex in domo tua"
      en: "Behold the days come: and I will cut off thy arm, and the arm of thy father's house, that there shall not be an old man in thy house."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et videbis aemulum tuum in templo in universis prosperis Israhel et non erit senex in domo tua omnibus diebus"
      en: "And thou shalt see thy rival in the temple, in all the prosperity of Israel, and there shall not be an old man in thy house for ever."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "verumtamen non auferam penitus virum ex te ab altari meo sed ut deficiant oculi tui et tabescat anima tua et pars magna domus tuae morietur cum ad virilem aetatem venerit"
      en: "However I will not altogether take away a man of thee from my altar: but that thy eyes may faint and thy soul be spent: and a great part of thy house shall die when they come to man's estate."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "hoc autem erit tibi signum quod venturum est duobus filiis tuis Ofni et Finees in die uno morientur ambo"
      en: "And this shall be a sign to thee, that shall come upon thy two sons, Ophni and Phinees: In one day they shall both of them die."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et suscitabo mihi sacerdotem fidelem qui iuxta cor meum et animam meam faciat et aedificabo ei domum fidelem et ambulabit coram christo meo cunctis diebus"
      en: "And I will raise me up a faithful priest, who shall do according to my heart, and my soul, and I will build him a faithful house, and he shall walk all days before my anointed."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "futurum est autem ut quicumque remanserit in domo tua veniat ut oretur pro eo et offerat nummum argenteum et tortam panis dicatque dimitte me obsecro ad unam partem sacerdotalem ut comedam buccellam panis"
      en: "And it shall come to pass, that whosoever shall remain in thy house, shall come that he may be prayed for, and shall offer a piece of silver, and a roll of bread, and shall say: Put me, I beseech thee, to somewhat of the priestly office, that I may eat a morsel of bread."
    status: { la: verified, en: verified }
