# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 24
verses:
  - n: 1
    text:
      la: "cumque vidisset Balaam quod placeret Domino ut benediceret Israheli nequaquam abiit ut ante perrexerat ut augurium quaereret sed dirigens contra desertum vultum suum"
      en: "And when Balaam saw that it pleased the Lord that he should bless Israel. he went not as he had gone before, to seek divination: but setting his face towards the desert,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et elevans oculos vidit Israhel in tentoriis commorantem per tribus suas et inruente in se spiritu Dei"
      en: "And lifting up his eyes, he saw Israel abiding in their tents by their tribes: and the spirit of God rushing upon him,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "adsumpta parabola ait dixit Balaam filius Beor dixit homo cuius obturatus est oculus"
      en: "He took up his parable and said: Balaam the son of Beor hath said: The man hath said, whose eye ire stopped up:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixit auditor sermonum Dei qui visionem Omnipotentis intuitus est qui cadit et sic aperiuntur oculi eius"
      en: "The hearer of the words of God hath said, he that hath beheld the vision of the Almighty, he that falleth, and so his eyes are opened:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quam pulchra tabernacula tua Iacob et tentoria tua Israhel"
      en: "How beautiful are thy tabernacles, O Jacob, and thy tents, O Israel!"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut valles nemorosae ut horti iuxta fluvios inrigui ut tabernacula quae fixit Dominus quasi cedri propter aquas"
      en: "As woody valleys, as watered gardens near the rivers, as tabernacles which the Lord hath pitched, as cedars by the waterside."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "fluet aqua de situla eius et semen illius erit in aquas multas tolletur propter Agag rex eius et auferetur regnum illius"
      en: "Water shall flow out of his bucket, and his seed shall be in many waters. For Agag his king shall be removed, and his kingdom shall be taken awry."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Deus eduxit illum de Aegypto cuius fortitudo similis est rinocerotis devorabunt gentes hostes illius ossaque eorum confringent et perforabunt sagittis"
      en: "God hath brought him out of Egypt, whose strength is like to the rhinoceros. They shall devour the nations that are his enemies, and break their bones, and pierce them with arrows."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "accubans dormivit ut leo et quasi leaena quam suscitare nullus audebit qui benedixerit tibi erit ipse benedictus qui maledixerit in maledictione reputabitur"
      en: "Lying down he hath slept as a lion, and as a lioness, whom none shall dare to rouse. He that blesseth thee, shall also himself be blessed: he that curseth thee shall be reckoned accursed."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "iratusque Balac contra Balaam conplosis manibus ait ad maledicendum inimicis meis vocavi te quibus e contrario tertio benedixisti"
      en: "And Balac being angry against Balaam, clapped his hands together and said: I called thee to curse my enemies, and thou on the contrary hast blessed them three times."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "revertere ad locum tuum decreveram quidem magnifice honorare te sed Dominus privavit te honore disposito"
      en: "Return to thy place. I had determined indeed greatly to honour thee, but the Lord hath deprived thee of the honour designed for thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "respondit Balaam ad Balac nonne nuntiis tuis quos misisti ad me dixi"
      en: "Balaam made answer to Balac: Did I not say to thy messengers, whom thou sentest to me:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "si dederit mihi Balac plenam domum suam argenti et auri non potero praeterire sermonem Domini Dei mei ut vel boni quid vel mali proferam ex corde meo sed quicquid Dominus dixerit hoc loquar"
      en: "If Balac would give me his house full of silver and gold, I cannot go beyond the word of the Lord my God, to utter any thing of my own head either good or evil: but whatsoever the Lord shall say, that I will speak?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "verumtamen pergens ad populum meum dabo consilium quid populus tuus huic populo faciat extremo tempore"
      en: "But yet going to my people, I will give thee counsel, what this people shall do to thy people in the latter days."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sumpta igitur parabola rursum ait dixit Balaam filius Beor dixit homo cuius obturatus est oculus"
      en: "Therefore taking up his parable, again he said: Balaam the son of Beor hath said: The man whose eye is stopped up, hath said:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixit auditor sermonum Dei qui novit doctrinam Altissimi et visiones Omnipotentis videt qui cadens apertos habet oculos"
      en: "The hearer of the words of God hath said, who knoweth the doctrine of the Highest, and seeth the visions of the Almighty, who falling hath his eyes opened:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "videbo eum sed non modo intuebor illum sed non prope orietur stella ex Iacob et consurget virga de Israhel et percutiet duces Moab vastabitque omnes filios Seth"
      en: "I shall see him, but not now: I shall behold him, but not near. A STAR SHALL RISE out of Jacob and a sceptre shall spring up from Israel: and shall strike the chiefs of Moab, and shall waste all the children of Seth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et erit Idumea possessio eius hereditas Seir cedet inimicis suis Israhel vero fortiter aget"
      en: "And he shall possess Idumea: the inheritance of Seir shall come to their enemies, but Israel shall do manfully"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "de Iacob erit qui dominetur et perdat reliquias civitatis"
      en: "Out of Jacob shall he come that shall rule, and shall destroy the remains of the city."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "cumque vidisset Amalech adsumens parabolam ait principium gentium Amalech cuius extrema perdentur"
      en: "And when he saw Amalec, he took up his parable, and said: Amalec the beginning of nations, whose latter ends shall be destroyed."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "vidit quoque Cineum et adsumpta parabola ait robustum est quidem habitaculum tuum sed si in petra posueris nidum tuum"
      en: "He saw also the Cinite: and took up his parable, and said: Thy habitation in- deed is strong: but though thou build thy nest in a rock,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et fueris electus de stirpe Cain quamdiu poteris permanere Assur enim capiet te"
      en: "And thou be chosen of the stock of Cin, how long shalt thou be able to continue? For Assur shall take thee captive."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "adsumptaque parabola iterum locutus est heu quis victurus est quando ista faciet Deus"
      en: "And taking up his parable, again he said: Alas, who shall live when God shall do these things?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "venient in trieribus de Italia superabunt Assyrios vastabuntque Hebraeos et ad extremum etiam ipsi peribunt"
      en: "They shall come in galleys from Italy, they shall overcome the Assyrians, and shall waste the Hebrews, and at the last they themselves also shall perish."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "surrexitque Balaam et reversus est in locum suum Balac quoque via qua venerat rediit"
      en: "And Balaam rose, and returned to his place: Balac also returned the way that he came."
    status: { la: verified, en: verified }
