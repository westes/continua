# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 19
verses:
  - n: 1
    text:
      la: "Et egressa est sors secunda filiorum Simeon per cognationes suas: fuitque haereditas"
      en: "And the second lot came forth for the children of Simeon by their kindreds: and their inheritance was"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "eorum in medio possessionis filiorum Juda: Bersabee et Sabee et Molada"
      en: "In the midst of the possession of the children of Juda: Bersabee and Sabee and Molada,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et Hasersual, Bala et Asem"
      en: "And Hasersual, Bala and Asem,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et Eltholad, Bethul et Harma"
      en: "And Eltholad, Bethul and Harma,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et Siceleg et Bethmarchaboth et Hasersusa"
      en: "And Siceleg and Bethmarchaboth and Hasersusa,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et Bethlebaoth et Sarohen: civitates tredecim, et villae earum."
      en: "And Bethlebaoth and Sarohen: thirteen cities, and their villages."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ain et Remmon et Athar et Asan: civitates quatuor, et villae earum:"
      en: "Ain and Remmon and Athor and Asan: four cities, and their villages."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "omnes viculi per circuitum urbium istarum usque ad Baalath Beer Ramath contra australem plagam. Haec est haereditas filiorum Simeon juxta cognationes suas,"
      en: "And all the villages round about these cities to Baalath Beer Ramath to the south quarter. This is the inheritance of the children of Simeon according to their kindreds,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in possessione et funiculo filiorum Juda: quia major erat: et idcirco filii Simeon possederunt in medio haereditatis eorum."
      en: "In the possession and lot of the children of Juda: because it was too great, and therefore the children of Simeon had their possession in the midst of their inheritance."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ceciditque sors tertia filiorum Zabulon per cognationes suas: factus est terminus possessionis eorum usque Sarid."
      en: "And the third lot fell to the children of Zabulon by their kindreds: and the border of their possession was unto Sarid."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ascenditque de mari et Merala, et pervenit in Debbaseth, usque ad torrentem qui est contra Jeconam."
      en: "And it went up from the sea and from Merala, and came to Debbaseth: as far as the torrent, which is over against Jeconam."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et revertitur de Sared contra orientem in fines Ceseleththabor: et egreditur ad Dabereth, ascenditque contra Japhie."
      en: "And it returneth from Sarid eastward to the borders of Ceseleththabor: and it goeth out to Dabereth, and ascendeth towards Japhie."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et inde pertransit usque ad orientalem plagam Gethepher et Thacasin: et egreditur in Remmon, Amthar et Noa."
      en: "And it passeth along from thence to the east side of Gethhepher and Thacasin: and goeth out to Remmon, Amthar and Noa."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et circuit ad aquilonem Hanathon: suntque egressus ejus vallis Jephthael,"
      en: "And it turneth about to the north of Hanathon: and the outgoings thereof are the valley of Jephtahel,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et Cateth et Naalol et Semeron et Jerala et Bethlehem: civitates duodecim, et villae earum."
      en: "And Cateth and Naalol and Semeron and Jedala and Bethlehem: twelve cities and their villages."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Haec est haereditas tribus filiorum Zabulon per cognationes suas, urbes et viculi earum."
      en: "This is the inheritance of the tribe of the children of Zabulon by their kindreds, the cities and their villages."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Issachar egressa est sors quarta per cognationes suas:"
      en: "The fourth lot came out to Issachar by their kindreds."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "fuitque ejus haereditas Jezrael et Casaloth et Sunem"
      en: "And his inheritance was Jezrael and Casaloth and Sunem,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et Hapharaim et Seon, et Anaharath"
      en: "And Hapharaim and Seen and Anaharath,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et Rabboth et Cesion, Abes,"
      en: "And Rabboth and Cesion, Abes,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et Rameth, et Engannim, et Enhadda et Bethpheses."
      en: "And Rameth and Engannim and Enhadda and Bethpheses."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et pervenit terminus ejus usque Thabor et Sehesima et Bethsames: eruntque exitus ejus Jordanis: civitates sedecim, et villae earum."
      en: "And the border thereof cometh to Thabor and Sehesima and Bethsames: and the outgoings thereof shall be at the Jordan: sixteen cities, and their villages."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Haec est possessio filiorum Issachar per cognationes suas, urbes et viculi earum."
      en: "This is the possession of the sons of Issachar by their kindreds, the cities and their villages."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ceciditque sors quinta tribui filiorum Aser per cognationes suas:"
      en: "And the fifth lot fell to the tribe of the children of Aser by their kindreds:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "fuitque terminus eorum Halcath et Chali et Beten et Axaph"
      en: "And their border was Halcath and Chali and Beten and Axaph,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et Elmelech et Amaad et Messal: et pervenit usque ad Carmelum maris et Sihor et Labanath."
      en: "And Elmelech and Amaad and Messal: and it reacheth to Carmel by the sea and Sihor and Labanath,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ac revertitur contra orientem Bethdagon: et pertransit usque Zabulon et vallem Jephthael contra aquilonem in Bethemec et Nehiel. Egrediturque ad laevam Cabul,"
      en: "And it returneth towards the east to Bethdagon: and passeth along to Zabulon and to the valley of Jephthael towards the north to Bethemec and Nehiel. And it goeth out to the left side of Cabul,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et Abran et Rohob et Hamon et Cana, usque ad Sidonem magnam."
      en: "And to Abaran and Rohob and Hamon and Cana, as far as the great Sidon."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Revertiturque in Horma usque ad civitatem munitissimam Tyrum, et usque Hosa: eruntque exitus ejus in mare de funiculo Achziba:"
      en: "And it returneth to Horma to the strong city of Tyre, and to Hosa: and the outgoings thereof shall be at the sea from the portion of Achziba:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et Amma et Aphec et Rohob: civitates viginti duae, et villae earum."
      en: "And Amma and Aphec and Rohob: twenty-two cities, and their villages."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Haec est possessio filiorum Aser per cognationes suas, urbesque et viculi earum."
      en: "This is the possession of the children of Aser by their kindreds, and the cities and their villages."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Filiorum Nephthali sexta sors cecidit per familias suas:"
      en: "The sixth lot came out to the sons of Nephtali by their families:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et coepit terminus de Heleph et Elon in Saananim, et Adami, quae est Neceb, et Jebnael usque Lecum: et egressus eorum usque ad Jordanem:"
      en: "And the border began from Heleph and Elon to Saananim, and Adami, which is Neceb, and Jebnael even to Lecum: and their outgoings unto the Jordan:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "revertiturque terminus contra occidentem in Azanotthabor, atque inde egreditur in Hucuca, et pertransit in Zabulon contra meridiem, et in Aser contra occidentem, et in Juda ad Jordanem contra ortum solis:"
      en: "And the border returneth westward to Azanotthabor, and goeth out from thence to Hucuca, and passeth along to Zabulon southward, and to Aser westward, and to Juda upon the Jordan towards the rising of the sun."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "civitates munitissimae, Assedim, Ser, et Emath, et Reccath et Cenereth,"
      en: "And the strong cities are Assedim, Ser, and Emath, and Reccath and Cenereth,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et Edema et Arama, Asor"
      en: "And Edema and Arama, Asor,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et Cedes et Edrai, Enhasor,"
      en: "And Cedes and Edri, Enhasor,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et Jeron et Magdalel, Horem et Bethanath et Bethsames: civitates decem et novem, et villae earum."
      en: "And Jeron and Magdalel, Herem, and Bethanath and Bethsames: nineteen cities, and their villages."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Haec est possessio tribus filiorum Nephthali per cognationes suas, urbes et viculi earum."
      en: "This is the possession of the tribe of the children of Nephtali by their kindreds, the cities and their villages."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Tribui filiorum Dan per familias suas egressa est sors septima:"
      en: "The seventh lot came out to the tribe of the children of Dan by their families:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et fuit terminus possessionis ejus Sara et Esthaol, et Hirsemes, id est, civitas solis."
      en: "And the border of their possession was Saraa and Esthaol, and Hirsemes, that is, the city of the sun."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Selebin et Ajalon et Jethela,"
      en: "Selebin and Aialon and Jethela,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Elon et Themna et Acron,"
      en: "Elon and Themna and Acron,"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Elthece, Gebbethon et Balaath,"
      en: "Elthece, Gebbethon and Balaath,"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et Jud et Bane et Barach et Gethremmon:"
      en: "And Jud and Bane and Barach and Gethremmon:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et Mejarcon et Arecon, cum termino qui respicit Joppen,"
      en: "And Mejarcon and Arecon, with the border that looketh towards Joppe,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et ipso fine concluditur. Ascenderuntque filii Dan, et pugnaverunt contra Lesem, ceperuntque eam: et percusserunt eam in ore gladii, et possederunt, et habitaverunt in ea, vocantes nomen ejus Lesem Dan, ex nomine Dan patris sui."
      en: "And is terminated there. And the children of Dan went up and fought against Lesem, and took it: and they put it to the sword, and possessed it, and dwelt in it, calling the name of it Lesem Dan, by the name of Dan their father."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Haec est possessio tribus filiorum Dan, per cognationes suas, urbes et viculi earum."
      en: "This is the possession of the tribe of the sons of Dan, by their kindreds, the cities and their villages."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Cumque complesset sorte dividere terram singulis per tribus suas, dederunt filii Israel possessionem Josue filio Nun in medio sui,"
      en: "And when he had made an end of dividing the land by lot to each one by their tribes, the children of Israel gave a possession to Josue the son of Nun in the midst of them,"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "juxta praeceptum Domini, urbem quam postulavit Thamnath Saraa in monte Ephraim: et aedificavit civitatem, habitavitque in ea."
      en: "According to the commandment of the Lord, the city which he asked for, Thamnath Saraa, in mount Ephraim: and he built up the city, and dwelt in it."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Hae sunt possessiones, quas sorte diviserunt Eleazar sacerdos, et Josue filius Nun, et principes familiarum ac tribuum filiorum Israel in Silo, coram Domino ad ostium tabernaculi testimonii, partitique sunt terram."
      en: "These are the possessions which Eleazar the priest, and Josue the son of Nun, and the princes of the families, and of the tribes of the children of Israel, distributed by lot in Silo, before the Lord at the door of the tabernacle of the testimony, and they divided the land."
    status: { la: verified, en: verified }
