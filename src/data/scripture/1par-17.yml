# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 17
verses:
  - n: 1
    text:
      la: "Cum autem habitaret David in domo sua, dixit ad Nathan prophetam: Ecce ego habito in domo cedrina: arca autem foederis Domini sub pellibus est."
      en: "Now when David was dwelling in his house, he said to Nathan the prophet: Behold I dwell in a house of cedar: and the ark of the covenant of the Lord is under skins."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et ait Nathan ad David: Omnia, quae in corde tuo sunt, fac: Deus enim tecum est."
      en: "And Nathan said to David: Do all that is in thy heart: for God is with thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Igitur nocte illa factus est sermo Dei ad Nathan, dicens:"
      en: "Now that night the word of God came to Nathan, saying:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vade, et loquere David servo meo: Haec dicit Dominus: Non aedificabis tu mihi domum ad habitandum."
      en: "Go, and speak to David my servant: Thus saith the Lord: Thou shalt not build me a house to dwell in."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Neque enim mansi in domo ex eo tempore, quo eduxi Israel, usque ad diem hanc: sed fui semper mutans loca tabernaculi, et in tentorio"
      en: "For I have not remained in a house from the time that I brought up Israel, to this day: but I have been always changing places in a tabernacle, and in a tent,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "manens cum omni Israel. Numquid locutus sum saltem uni judicum Israel, quibus praeceperam ut pascerent populum meum, et dixi: Quare non aedificastis mihi domum cedrinam?"
      en: "Abiding with all Israel. Did I ever speak to any one, of all the judges of Israel, whom I charged to feed my people, saying: Why have you not built me a house of cedar?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nunc itaque sic loqueris ad servum meum David: Haec dicit Dominus exercituum: Ego tuli te, cum in pascuis sequereris gregem, ut esses dux populi mei Israel."
      en: "Now therefore thus shalt thou say to my servant David: Thus saith the Lord of hosts: I took thee from the pastures, from following the flock, that thou shouldst be ruler of my people Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et fui tecum quocumque perrexisti: et interfeci omnes inimicos tuos coram te, fecique tibi nomen quasi unius magnorum, qui celebrantur in terra."
      en: "And I have been with thee whithersoever thou hast gone: and have slain all thy enemies before thee, and have made thee a name like that of one of the great ones that are renowned in the earth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dedi locum populo meo Israel: plantabitur, et habitabit in eo, et ultra non commovebitur: nec filii iniquitatis atterent eos, sicut a principio,"
      en: "And I have given a place to my people Israel: they shall be planted, and shall dwell therein, and shall be moved no more, neither shall the children of iniquity waste them, as at the beginning,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ex diebus quibus dedi judices populo meo Israel, et humiliavi universos inimicos tuos. Annuntio ergo tibi, quod aedificaturus sit tibi Dominus domum."
      en: "Since the days that I gave judges to my people Israel, and have humbled all thy enemies. And I declare to thee, that the Lord will build thee a house."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque impleveris dies tuos ut vadas ad patres tuos, suscitabo semen tuum post te, quod erit de filiis tuis: et stabiliam regnum ejus."
      en: "And when thou shalt have ended thy days to go to thy fathers, I will raise up thy seed after thee, which shall be of thy sons: and I will establish his kingdom."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ipse aedificabit mihi domum, et firmabo solium ejus usque in aeternum."
      en: "He shall build me a house, and I will establish his throne for ever."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ego ero ei in patrem, et ipse erit mihi in filium: et misericordiam meam non auferam ab eo, sicut abstuli ab eo qui ante te fuit."
      en: "I will be to him a father, and he shall be to me a son: and I will not take my mercy away from him, as I took it from him that was before thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et statuam eum in domo mea, et in regno meo usque in sempiternum: et thronus ejus erit firmissimus in perpetuum."
      en: "But I will settle him in my house, and in my kingdom for ever: and his throne shall be most firm for ever."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Juxta omnia verba haec, et juxta universam visionem istam, sic locutus est Nathan ad David."
      en: "According to all these words, and according to all this vision, so did Nathan speak to David."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cumque venisset rex David, et sedisset coram Domino, dixit: Quis ego sum, Domine Deus, et quae domus mea, ut praestares mihi talia?"
      en: "And king David came and sat before the Lord, and said: Who am I, O Lord God, and what is my house, that thou shouldst give such things to me?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed et hoc parum visum est in conspectu tuo, ideoque locutus es super domum servi tui etiam in futurum: et fecisti me spectabilem super omnes homines, Domine Deus."
      en: "But even this hath seemed little in thy sight, and therefore thou hast also spoken concerning the house of thy servant for the time to come: and hast made me remarkable above all men, O Lord God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quid ultra addere potest David, cum ita glorificaveris servum tuum, et cognoveris eum?"
      en: "What can David add more, seeing thou hast thus glorified thy servant, and known him?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Domine, propter famulum tuum juxta cor tuum fecisti omnem magnificentiam hanc, et nota esse voluisti universa magnalia."
      en: "O Lord, for thy servant's sake, according to thy own heart, thou hast shewn all this magnificence, and wouldst have all the great things to be known."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Domine, non est similis tui: et non est alius Deus absque te, ex omnibus, quos audivimus auribus nostris."
      en: "O Lord there is none like thee: and there is no other God beside thee, of all whom we have heard of with our ears."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quis enim est alius, ut populus tuus Israel, gens una in terra, ad quam perrexit Deus ut liberaret, et faceret populum sibi, et magnitudine sua atque terroribus, ejiceret nationes a facie ejus, quem de Aegypto liberarat?"
      en: "For what other nation is there upon earth like thy people Israel, whom God went to deliver, and make a people for himself, and by his greatness and terrors cast out nations before their face whom he had delivered out of Egypt?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et posuisti populum tuum Israel tibi in populum usque in aeternum, et tu, Domine, factus es Deus ejus."
      en: "And thou hast made thy people Israel to be thy own people for ever, and thou, O Lord, art become their God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Nunc igitur Domine, sermo quem locutus es famulo tuo, et super domum ejus, confirmetur in perpetuum, et fac sicut locutus es."
      en: "Now therefore, O Lord, let the word which thou hast spoken to thy servant, and concerning his house, be established for ever, and do as thou hast said."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Permaneatque et magnificetur nomen tuum usque in sempiternum, et dicatur: Dominus exercituum Deus Israel, et domus David servi ejus permanens coram eo."
      en: "And let thy name remain and be magnified for ever: and let it be said: The Lord of hosts is God of Israel, and the house of David his servant remaineth before him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Tu enim, Domine Deus meus, revelasti auriculam servi tui, ut aedificares ei domum: et idcirco invenit servus tuus fiduciam, ut oret coram te."
      en: "For thou, O Lord my God, hast revealed to the ear of thy servant, that thou wilt build him a house: and therefore thy servant hath found confidence to pray before thee."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Nunc ergo Domine, tu es Deus: et locutus es ad servum tuum tanta beneficia."
      en: "And now O Lord, thou art God: and thou hast promised to thy servant such great benefits."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et coepisti benedicere domui servi tui, ut sit semper coram te: te enim, Domine, benedicente, benedicta erit in perpetuum."
      en: "And thou hast begun to bless the house of thy servant, that it may be always before thee: for seeing thou blessest it, O Lord, it shall be blessed for ever."
    status: { la: verified, en: verified }
