# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 62
verses:
  - n: 1
    text:
      la: "propter Sion non tacebo et propter Hierusalem non quiescam donec egrediatur ut splendor iustus eius et salvator eius ut lampas accendatur"
      en: "For Sion's sake I will not hold my peace, and for the sake of Jerusalem, I will not rest till her just one come forth as brightness, and her saviour be lighted as a lamp."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et videbunt gentes iustum tuum et cuncti reges inclitum tuum et vocabitur tibi nomen novum quod os Domini nominabit"
      en: "And the Gentiles shall see thy just one, and all kings thy glorious one: and thou shalt be called by a new name, which the mouth of the Lord shall name."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et eris corona gloriae in manu Domini et diadema regni in manu Dei tui"
      en: "And thou shalt be a crown of glory in the hand of the Lord, and a royal diadem in the hand of thy God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non vocaberis ultra Derelicta et terra tua non vocabitur amplius Desolata sed vocaberis Voluntas mea in ea et terra tua Inhabitata quia conplacuit Domino in te et terra tua inhabitabitur"
      en: "Thou shalt no more be called Forsaken: and thy land shall no more be called Desolate: but thou shalt be called My pleasure in her, and thy land inhabited. Because the Lord hath been well pleased with thee: and thy land shall be inhabited."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "habitabit enim iuvenis cum virgine et habitabunt in te filii tui et gaudebit sponsus super sponsam gaudebit super te Deus tuus"
      en: "For the young man shall dwell with the virgin, and thy children shall dwell in thee. And the bridegroom shall rejoice over the bride, and thy God shall rejoice over thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "super muros tuos Hierusalem constitui custodes tota die et tota nocte perpetuo non tacebunt qui reminiscimini Domini ne taceatis"
      en: "Upon thy wails, O Jerusalem, I have appointed watchmen all the day, and all the night, they shall never hold their peace. You that are mindful of the Lord, hold not your peace,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ne detis silentium ei donec stabiliat et donec ponat Hierusalem laudem in terra"
      en: "And give him no silence till he establish, and till he make Jerusalem a praise in the earth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "iuravit Dominus in dextera sua et in brachio fortitudinis suae si dedero triticum tuum ultra cibum inimicis tuis et si biberint filii alieni vinum tuum in quo laborasti"
      en: "The Lord hath sworn by his right hand, and by the arm of his strength: Surely I will no more give thy corn to be meat for thy enemies: and the sons of the strangers shall not drink thy wine, for which thou hast laboured."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia qui congregabunt illud comedent et laudabunt Dominum et qui conportant illud bibent in atriis sanctis meis"
      en: "For they that gather it, shall eat it, and shall praise the Lord: and they that bring it together, shall drink it in my holy courts."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "transite transite per portas praeparate viam populo planum facite iter et eligite lapides elevate signum ad populos"
      en: "Go through, go through the gates, prepare the way for the people, make the road plain, pick out the stones, and lift up the standard to the people."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ecce Dominus auditum fecit in extremis terrae dicite filiae Sion ecce salvator tuus venit ecce merces eius cum eo et opus eius coram illo"
      en: "Behold the Lord hath made it to be heard in the ends of the earth, tell the daughter of Sion: Behold thy Saviour cometh: behold his reward is with him, and his work before him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et vocabunt eos Populus sanctus Redempti a Domino tu autem vocaberis Quaesita civitas et non Derelicta"
      en: "And they shall call them, The holy people, the redeemed of the Lord. But thou shalt be called: A city sought after, and not forsaken."
    status: { la: verified, en: verified }
