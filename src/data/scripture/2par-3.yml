# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 3
verses:
  - n: 1
    text:
      la: "et coepit Salomon aedificare domum Domini in Hierusalem in monte Moria qui demonstratus fuerat David patri eius in loco quem paraverat David in area Ornan Iebusei"
      en: "And Solomon began to build the house of the Lord in Jerusalem, in mount Moria, which had been shewn to David his father, in the place which David had prepared in the thrashingfloor of Ornan the Jebusite."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "coepit autem aedificare mense secundo anno quarto regni sui"
      en: "And he began to build in the second month, in the fourth year of his reign."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et haec sunt fundamenta quae iecit Salomon ut aedificaret domum Dei longitudinis cubitos in mensura prima sexaginta latitudinis cubitos viginti"
      en: "Now these are the foundations, which Solomon laid, to build the house of God, the length by the first measure sixty cubits, the breadth twenty cubits."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "porticum vero ante frontem quae tendebatur in longum iuxta mensuram latitudinis domus cubitorum viginti porro altitudo centum viginti cubitorum erat et deauravit eam intrinsecus auro mundissimo"
      en: "And the porch in the front, which was extended in length according to the measure of the breadth of the house, twenty cubits: and the height was a hundred and twenty cubits: and he overlaid it within with pure gold."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "domum quoque maiorem texit tabulis ligneis abiegnis et lamminas auri obrizi adfixit per totum scalpsitque in ea palmas et quasi catenulas se invicem conplectentes"
      en: "And the greater house he ceiled with deal boards, and overlaid them with plates of fine gold throughout: and he graved in them palm trees, and like little chains interlaced with one another."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "stravit quoque pavimentum templi pretiosissimo marmore decore multo"
      en: "He paved also the floor of the temple with most precious marble, of great beauty."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "porro aurum erat probatissimum de cuius lamminis texit domum et trabes eius et postes et parietes et ostia et celavit cherubin in parietibus"
      en: "And the gold of the plates with which he overlaid the house, and the beams thereof, and the posts, and the walls, and the doors was of the finest: and he graved cherubims on the walls."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "fecit quoque domum sancti sanctorum longitudinem iuxta latitudinem domus cubitorum viginti et latitudinem similiter viginti cubitorum et lamminis aureis texit eam quasi talentis sescentis"
      en: "He made also the house of the holy of holies: the length of it according to the breadth of the temple, twenty cubits, and the breadth of it in like manner twenty cubits: and he overlaid it with plates of gold, amounting to about six hundred talents."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sed et clavos fecit aureos ita ut singuli clavi siclos quinquagenos adpenderent cenacula quoque texit auro"
      en: "He made also nails of gold, and the weight of every nail was fifty sicles: the upper chambers also he overlaid with gold."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "fecit etiam in domo sancti sanctorum cherubin duo opere statuario et texit eos auro"
      en: "He made also in the house of the holy of holies two cherubims of image work: and he overlaid them with gold."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "alae cherubin viginti cubitis extendebantur ita ut una ala haberet cubitos quinque et tangeret parietem domus et altera quinque cubitos habens alam tangeret alterius cherub"
      en: "The wings of the cherubims were extended twenty cubits, so that one wing was five cubits long, and reached to the wall of the house: and the other was also five cubits long, and reached to the wing of the other cherub."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "similiter cherub alterius ala quinque habebat cubitos et tangebat parietem et ala eius altera quinque cubitorum alam cherub alterius contingebat"
      en: "In like manner the wing of the other cherub, was five cubits long, and reached to the wall: and his other wing was five cubits long, and touched the wing of the other cherub."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "igitur alae utriusque cherubin expansae erant et extendebantur per cubitos viginti ipsi autem stabant erectis pedibus et facies eorum versae erant ad exteriorem domum"
      en: "So the wings of the two cherubims were spread forth, and were extended twenty cubits: and they stood upright on their feet, and their faces were turned toward the house without."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "fecit quoque velum ex hyacintho purpura coccino et bysso et intexuit ei cherubin"
      en: "He made also a veil of violet, purple, scarlet, and silk: and wrought in it cherubims."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ante fores etiam templi duas columnas quae triginta et quinque cubitos habebant altitudinis porro capita earum quinque cubitorum"
      en: "He made also before the doors of the temple two pillars, which were five and thirty cubits high: and their chapiters were five cubits."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "necnon et quasi catenulas in oraculo et superposuit eas capitibus columnarum malagranata etiam centum quae catenulis interposuit"
      en: "He made also as it were little chains in the oracle, and he put them on the heads of the pillars: and a hundred pomegranates, which he put between the little chains."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ipsas quoque columnas posuit in vestibulo templi unam a dextris et alteram a sinistris eam quae a dextris erat vocavit Iachin et quae ad levam Booz"
      en: "These pillars he put at the entrance of the temple, one on the right hand, and the other on the left: that which was on the right hand, he called Jachin: and that on the left hand, Boot."
    status: { la: verified, en: verified }
