# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 3
verses:
  - n: 1
    text:
      la: "Et coepit Salomon aedificare domum Domini in Jerusalem in monte Moria, qui demonstratus fuerat David patri ejus, in loco, quem paraverat David in area Ornan Jebusaei."
      en: "And Solomon began to build the house of the Lord in Jerusalem, in mount Moria, which had been shewn to David his father, in the place which David had prepared in the threshingfloor of Ornan the Jebusite."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Coepit autem aedificare mense secundo, anno quarto regni sui."
      en: "And he began to build in the second month, in the fourth year of his reign."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et haec sunt fundamenta, quae jecit Salomon, ut aedificaret domum Dei: longitudinis cubitos in mensura prima sexaginta, latitudinis cubitos viginti."
      en: "Now these are the foundations, which Solomon laid, to build the house of God, the length by the first measure sixty cubits, the breadth twenty cubits."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Porticum vero ante frontem, quae tendebatur in longum juxta mensuram latitudinis domus, cubitorum viginti: porro altitudo centum viginti cubitorum erat: et deauravit eam intrinsecus auro mundissimo."
      en: "And the porch in the front, which was extended in length according to the measure of the breadth of the house, twenty cubits: and the height was a hundred and twenty cubits: and he overlaid it within with pure gold."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Domum quoque majorem texit tabulis ligneis abiegnis, et laminas auri obrizi affixit per totum: sculpsitque in ea palmas, et quasi catenulas se invicem complectentes."
      en: "And the greater house he ceiled with deal boards, and overlaid them with plates of fine gold throughout: and he graved in them palm trees, and like little chains interlaced with one another."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Stravit quoque pavimentum templi pretiosissimo marmore, decore multo."
      en: "He paved also the floor of the temple with most precious marble, of great beauty."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Porro aurum erat probatissimum, de cujus laminis texit domum, et trabes ejus, et postes, et parietes, et ostia: et caelavit cherubim in parietibus."
      en: "And the gold of the plates with which he overlaid the house, and the beams thereof, and the posts, and the walls, and the doors was of the finest: and he graved cherubims on the walls."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Fecit quoque domum Sancti sanctorum: longitudinem juxta latitudinem domus cubitorum viginti: et latitudinem similiter viginti cubitorum: et laminis aureis texit eam, quasi talentis sexcentis."
      en: "He made also the house of the holy of holies: the length of it according to the breadth of the temple, twenty cubits, and the breadth of it in like manner twenty cubits: and he overlaid it with plates of gold, amounting to about six hundred talents."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sed et clavos fecit aureos, ita ut singuli clavi siclos quinquagenos appenderent: coenacula quoque texit auro."
      en: "He made also nails of gold, and the weight of every nail was fifty sicles: the upper chambers also he overlaid with gold."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Fecit etiam in domo Sancti sanctorum cherubim duos, opere statuario: et texit eos auro."
      en: "He made also in the house of the holy of holies two cherubims of image work: and he overlaid them with gold."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Alae cherubim viginti cubitis extendebantur, ita ut una ala haberet cubitos quinque et tangeret parietem domus: et altera quinque cubitos habens, alam tangeret alterius cherub."
      en: "The wings of the cherubims were extended twenty cubits, so that one wing was five cubits long, and reached to the wall of the house: and the other was also five cubits long, and reached to the wing of the other cherub."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Similiter cherub alterius ala, quinque habebat cubitos, et tangebat parietem: et ala ejus altera quinque cubitorum, alam cherub alterius contingebat."
      en: "In like manner the wing of the other cherub, was five cubits long, and reached to the wall: and his other wing was five cubits long, and touched the wing of the other cherub."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Igitur alae utriusque cherubim expansae erant et extendebantur per cubitos viginti: ipsi autem stabant erectis pedibus, et facies eorum erant versae ad exteriorem domum."
      en: "So the wings of the two cherubims were spread forth, and were extended twenty cubits: and they stood upright on their feet, and their faces were turned toward the house without."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Fecit quoque velum ex hyacintho, purpura, cocco, et bysso: et intexuit ei cherubim."
      en: "He made also a veil of violet, purple, scarlet, and silk: and wrought in it cherubims."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ante fores etiam templi duas columnas, quae triginta et quinque cubitos habebant altitudinis: porro capita earum, quinque cubitorum."
      en: "He made also before the doors of the temple two pillars, which were five and thirty cubits high: and their chapiters were five cubits."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Necnon et quasi catenulas in oraculo, et superposuit eas capitibus columnarum: malogranata etiam centum, quae catenulis interposuit."
      en: "He made also as it were little chains in the oracle, and he put them on the heads of the pillars: and a hundred pomegranates, which he put between the little chains."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ipsas quoque columnas posuit in vestibulo templi, unam a dextris, et alteram a sinistris: eam, quae a dextris erat, vocavit Jachin: et quae ad laevam, Booz."
      en: "These pillars he put at the entrance of the temple, one on the right hand, and the other on the left: that which was on the right hand, he called Jachin: and that on the left hand, Booz."
    status: { la: verified, en: verified }
