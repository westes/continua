book: ezek
chapter: 26
verses:
  - n: 1
    text:
      la: "et factum est in undecimo anno prima mensis factus est sermo Domini ad me dicens"
      en: "And it came to pass in the eleventh year, the first day of the month, that the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fili hominis pro eo quod dixit Tyrus de Hierusalem euge confractae sunt portae populorum conversa est ad me implebor deserta est"
      en: "Son of man, because Tyre hath said of Jerusalem: Aha, the gates of the people are broken, she is turned to me: I shall be filled, now she is laid waste."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "propterea haec dicit Dominus Deus ecce ego super te Tyre et ascendere faciam ad te gentes multas sicut ascendit mare fluctuans"
      en: "Therefore thus saith the Lord God: Behold I come against thee, O Tyre, and I will cause many nations to come up to thee, as the waves of the sea rise up."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dissipabunt muros Tyri et destruent turres eius et radam pulverem eius de ea et dabo eam in limpidissimam petram"
      en: "And they shall break down the walls of Tyre, and destroy the towers thereof: and I will scrape her dust from her, and make her like a smooth rock."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "siccatio sagenarum erit in medio maris quia ego locutus sum ait Dominus Deus et erit in direptionem gentibus"
      en: "She shall be a drying place for nets in the midst of the sea, because I have spoken it, saith the Lord God: and she shall be a spoil to the nations."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "filiae quoque eius quae sunt in agro gladio interficientur et scient quia ego Dominus"
      en: "Her daughters also that are in the field, shall be slain by the sword: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia haec dicit Dominus Deus ecce ego adducam ad Tyrum Nabuchodonosor regem Babylonis ab aquilone regem regum cum equis et curribus et equitibus et coetu populoque magno"
      en: "For thus saith the Lord God: Behold I will bring against Tyre Nabuchodonosor king of Babylon, the king of kings, from the north, with horses, and chariots, and horsemen, and companies, and much people."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "filias tuas quae sunt in agro gladio interficiet et circumdabit te munitionibus et conportabit aggerem in gyro et levabit contra te clypeum"
      en: "Thy daughters that are in the field, he shall kill with the sword: and he shall compass thee with forts, and shall cast up a mount round about: and he shall lift up the buckler against thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et vineas et arietes temperabit in muros tuos et turres tuas destruet in armatura sua"
      en: "And he shall set engines of mar and battering rams against thy walls, and shall destroy thy towers with his arms."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "inundatione equorum eius operiet te pulvis eorum a sonitu equitum et rotarum et curruum movebuntur muri tui dum ingressus fuerit portas tuas quasi per introitus urbis dissipatae"
      en: "By reason of the multitude of his horses, their dust shall cover thee: thy walls shall shake at the noise of the horsemen, and wheels, and chariots, when they shall go in at thy gates, as by the entrance of a city that is destroyed."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ungulis equorum suorum conculcabit omnes plateas tuas populum tuum gladio caedet et statuae tuae nobiles in terram corruent"
      en: "With the hoofs of his horses he shall tread down all thy streets: thy people he shall kill with the sword, and thy famous statues shall fall to the ground."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vastabunt opes tuas diripient negotiationes tuas et destruent muros tuos et domos tuas praeclaras subvertent et lapides tuos et ligna tua et pulverem tuum in medio aquarum ponent"
      en: "They shall waste thy riches, they shall make a spoil of thy merchandise: and they shall destroy thy walls, and pull down thy fine houses: and they shall lay thy stones and thy timber, and thy dust in the midst of the waters."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et quiescere faciam multitudinem canticorum tuorum et sonitus cithararum tuarum non audietur amplius"
      en: "And I will make the multitude of thy songs to cease, and the sound of thy harps shall be heard no more."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dabo te in limpidissimam petram siccatio sagenarum eris nec aedificaberis ultra quia ego locutus sum dicit Dominus Deus"
      en: "And I will make thee like a naked rock, then shalt be a drying place for nets, neither shalt thou be built any more: for I have spoken it, saith. the Lord God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "haec dicit Dominus Deus Tyro numquid non a sonitu ruinae tuae et gemitu interfectorum tuorum cum occisi fuerint in medio tui commovebuntur insulae"
      en: "Thus saith the Lord God to Tyre: Shall not the islands shake at the sound of thy fall, and the groans of thy slain when they shall be killed in the midst of thee?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et descendent de sedibus suis omnes principes maris et auferent exuvias suas et vestimenta sua varia abicient et induentur stupore in terra sedebunt et adtoniti super repentino casu tuo admirabuntur"
      en: "Then all the princes of the sea shall come down from their thrones: and take off their robes, and cast away their broidered garments, and be clothed with astonishment: they shall sit on the ground, and with amazement shall wonder at thy sudden fall."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et adsumentes super te lamentum dicent tibi quomodo peristi quae habitas in mari urbs inclita quae fuisti fortis in mari cum habitatoribus tuis quos formidabant universi"
      en: "And taking up a lamentation over thee, they shall sag to thee: How art thou fallen, that dwellest in the sea, renowned city that wast strong in the sea, with thy inhabitants whom all did dread?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "nunc stupebunt naves in die pavoris tui et turbabuntur insulae in mari eo quod nullus egrediatur ex te"
      en: "Now shall the ships be astonished in the day of thy terror: and the islands in the sea shall be troubled because no one cometh out of thee."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quia haec dicit Dominus Deus cum dedero te urbem desolatam sicut civitates quae non habitantur et adduxero super te abyssum et operuerint te aquae multae"
      en: "For thus saith the Lord God: When I shall make thee a desolate city like the cities that are not inhabited: and shall bring the deep upon thee, and many waters shall cover thee:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et detraxero te cum his qui descendunt in lacum ad populum sempiternum et conlocavero te in terra novissima sicut solitudines veteres cum his qui deducuntur in lacum ut non habiteris porro dedero gloriam in terra viventium"
      en: "And when I shall bring thee down with those that descend into the pit to the everlasting people, and shall set thee in the lowest parts of the earth, as places desolate of old, with them that are brought down into the pit, that thou be not inhabited: and when I shall give glory in the land of the living,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "in nihilum redigam te et non eris et requisita non invenieris ultra in sempiternum dicit Dominus Deus"
      en: "I will bring thee to nothing, and thou shalt not be, and if thou be sought for, thou shalt not be found any more for ever, saith the Lord God."
    status: { la: verified, en: verified }
