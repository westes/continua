# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 30
verses:
  - n: 1
    text:
      la: "Hoc verbum quod factum est ad Jeremiam a Domino, dicens:"
      en: "This is the word that came to Jeremias from the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Haec dicit Dominus Deus Israel, dicens: Scribe tibi omnia verba, quae locutus sum ad te, in libro."
      en: "Thus saith the Lord, the God of Israel, saying: Write thee all the words that I have spoken to thee, in a book."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ecce enim dies veniunt, dicit Dominus, et convertam conversionem populi mei Israel et Juda, ait Dominus: et convertam eos ad terram quam dedi patribus eorum, et possidebunt eam."
      en: "For behold the days come, saith the Lord, and I will bring again the captivity of my people Israel and Juda, saith the Lord: and I will cause them to return to the land which I gave to their fathers, and they shall possess it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et haec verba quae locutus est Dominus ad Israel et ad Judam:"
      en: "And these are the words that the Lord hath spoken to Israel and to Juda:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quoniam haec dicit Dominus: Vocem terroris audivimus: formido, et non est pax."
      en: "For thus saith the Lord: We have heard a voice of terror: there is fear and no peace."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Interrogate, et videte si generat masculus: quare ergo vidi omnis viri manum super lumbum suum, quasi parturientis, et conversae sunt universae facies in auruginem?"
      en: "Ask ye, and see if a man bear children? why then have I seen every man with his hands on his loins, like a woman in labour, and all faces are turned yellow?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vae! quia magna dies illa, nec est similis ejus: tempusque tribulationis est Jacob, et ex ipso salvabitur."
      en: "Alas, for that day is great, neither is there the like to it; and it is the time of tribulation to Jacob, but he shall be saved out of it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et erit in die illa, ait Dominus exercituum, conteram jugum ejus de collo tuo: et vincula ejus dirumpam, et non dominabuntur ei amplius alieni:"
      en: "And it shall come to pass in that day, saith the Lord of hosts, that I will break his yoke from off thy neck, and will burst his bands: and strangers shall no more rule over him:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sed servient Domino Deo suo, et David regi suo, quem suscitabo eis."
      en: "But they shall serve the Lord their God, and David their king, whom I will raise up to them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tu ergo ne timeas, serve meus Jacob, ait Dominus: neque paveas, Israel, quia ecce ego salvabo te de terra longinqua, et semen tuum de terra captivitatis eorum: et revertetur Jacob, et quiescet, et cunctis affluet bonis, et non erit quem formidet:"
      en: "Therefore fear thou not, my servant Jacob, saith the Lord, neither be dismayed, O Israel: for behold, I will save thee from a country afar off, and thy seed from the land of their captivity: and Jacob shall return, and be at rest, and abound with all good things, and there shall be none whom he may fear:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quoniam tecum ego sum, ait Dominus, ut salvem te. Faciam enim consummationem in cunctis gentibus in quibus dispersi te: te autem non faciam in consummationem: sed castigabo te in judicio, ut non videaris tibi innoxius."
      en: "For I am with thee, saith the Lord, to save thee: for I will utterly consume all the nations, among which I have scattered thee: but I will not utterly consume thee: but I will chastise thee in judgment, that thou mayst not seem to thyself innocent."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quia haec dicit Dominus: Insanabilis fractura tua, pessima plaga tua:"
      en: "For thus saith the Lord: Thy bruise is incurable, thy wound is very grievous."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "non est qui judicet judicium tuum ad alligandum: curationum utilitas non est tibi."
      en: "There is none to judge thy judgment to bind it up: thou hast no healing medicines."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Omnes amatores tui obliti sunt tui, teque non quaerent: plaga enim inimici percussi te castigatione crudeli: propter multitudinem iniquitatis tuae dura facta sunt peccata tua."
      en: "All thy lovers have forgotten thee, and will not seek after thee: for I have wounded thee with the wound of an enemy, with a cruel chastisement: by reason of the multitude of thy iniquities, thy sins are hardened."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quid clamas super contritione tua? insanabilis est dolor tuus: propter multitudinem iniquitatis tuae, et propter dura peccata tua, feci haec tibi."
      en: "Why criest thou for thy affliction? thy sorrow is incurable: for the multitude of thy iniquity, and for thy hardened sins I have done these things to thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Propterea omnes qui comedunt te devorabuntur, et universi hostes tui in captivitatem ducentur: et qui te vastant vastabuntur, cunctosque praedatores tuos dabo in praedam."
      en: "Therefore all they that devour thee shall be devoured: and all thy enemies shall be carried into captivity: and they that waste thee shall be wasted, and all that prey upon thee will I give for a prey."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Obducam enim cicatricem tibi, et a vulneribus tuis sanabo te, dicit Dominus. Quia electam vocaverunt te, Sion: haec est, quae non habebat requirentem."
      en: "For I will close up thy scar, and will heal thee of thy wounds, saith the Lord. Because they have called thee, O Sion, an outcast: This is she that hath none to seek after her."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Haec dicit Dominus: Ecce ego convertam conversionem tabernaculorum Jacob, et tectis ejus miserebor, et aedificabitur civitas in excelso suo, et templum juxta ordinem suum fundabitur:"
      en: "Thus saith the Lord: Behold I will bring back the captivity of the pavilions of Jacob, and will have pity on his houses, and the city shall be built in her high place, and the temple shall be founded according to the order thereof."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et egredietur de eis laus, voxque ludentium. Et multiplicabo eos, et non minuentur: et glorificabo eos, et non attenuabuntur."
      en: "And out of them shall come forth praise, and the voice of them that play: and I will multiply them, and they shall not be made few: and I will glorify them, and they shall not be lessened."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et erunt filii ejus sicut a principio, et coetus ejus coram me permanebit, et visitabo adversum omnes qui tribulant eum."
      en: "And their children shall be as from the beginning, and their assembly shall be permanent before me: and I will visit against all that afflict them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et erit dux ejus ex eo, et princeps de medio ejus producetur: et applicabo eum, et accedet ad me. Quis enim iste est qui applicet cor suum ut appropinquet mihi? ait Dominus:"
      en: "And their leader shall be of themselves: and their prince shall come forth from the midst of them: and I will bring him near, and he shall come to me: for who is this that setteth his heart to approach to me, saith the Lord?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et eritis mihi in populum, et ego ero vobis in Deum."
      en: "And you shall be my people: and I will be your God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ecce turbo Domini, furor egrediens, procella ruens: in capite impiorum conquiescet."
      en: "Behold the whirlwind of the Lord, his fury going forth, a violent storm, it shall rest upon the head of the wicked."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Non avertet iram indignationis Dominus, donec faciat et compleat cogitationem cordis sui: in novissimo dierum intelligetis ea."
      en: "The Lord will not turn away the wrath of his indignation, till he have executed and performed the thought of his heart: in the latter days you shall understand these things."
    status: { la: verified, en: verified }
