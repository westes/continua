# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jon
chapter: 2
verses:
  - n: 1
    text:
      la: "Et praeparavit Dominus piscem grandem ut deglutiret Jonam: et erat Jonas in ventre piscis tribus diebus et tribus noctibus."
      en: "Now the Lord prepared a great fish to swallow up Jonas: and Jonas was in the belly of the fish three days and three nights."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et oravit Jonas ad Dominum Deum suum de ventre piscis,"
      en: "And Jonas prayed to the Lord his God out of the belly of the fish."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixit: Clamavi de tribulatione mea ad Dominum, et exaudivit me; de ventre inferi clamavi, et exaudisti vocem meam."
      en: "And he said: I cried out of my affliction to the Lord, and he heard me: I cried out of the belly of hell, and thou hast heard my voice."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et projecisti me in profundum in corde maris, et flumen circumdedit me: omnes gurgites tui, et fluctus tui super me transierunt."
      en: "And thou hast cast me forth into the deep in the heart of the sea, and a flood hath compassed me: all thy billows, and thy waves have passed over me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ego dixi: Abjectus sum a conspectu oculorum tuorum; verumtamen rursus videbo templum sanctum tuum."
      en: "And I said: I am cast away out of the sight of thy eyes: but yet I shall see thy holy temple again."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Circumdederunt me aquae usque ad animam: abyssus vallavit me, pelagus operuit caput meum."
      en: "The waters compassed me about even to the soul: the deep hath closed me round about, the sea hath covered my head."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ad extrema montium descendi; terrae vectes concluserunt me in aeternum: et sublevabis de corruptione vitam meam, Domine Deus meus."
      en: "I went down to the lowest parts of the mountains: the bars of the earth have shut me up for ever: and thou wilt bring up my life from corruption, O Lord my God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cum angustiaretur in me anima mea, Domini recordatus sum: ut veniat ad te oratio mea, ad templum sanctum tuum."
      en: "When my soul was in distress within me, I remembered the Lord: that my prayer may come to thee, unto thy holy temple."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui custodiunt vanitates frustra, misericordiam suam derelinquunt."
      en: "They that are vain observe vanities, forsake their own mercy."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ego autem in voce laudis immolabo tibi: quaecumque vovi, reddam pro salute Domino."
      en: "But I with the voice of praise will sacrifice to thee: I will pay whatsoever I have vowed for my salvation to the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixit Dominus pisci, et evomuit Jonam in aridam."
      en: "And the Lord spoke to the fish: and it vomited out Jonas upon the dry land."
    status: { la: verified, en: verified }
