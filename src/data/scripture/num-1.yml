book: num
chapter: 1
verses:
  - n: 1
    text:
      la: "locutusque est Dominus ad Mosen in deserto Sinai in tabernaculo foederis prima die mensis secundi anno altero egressionis eorum ex Aegypto dicens"
      en: "And the Lord spoke to Moses in the desert of Sinai in the tabernacle of the covenant, the first day of the second month, the second year of their going out of Egypt, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tollite summam universae congregationis filiorum Israhel per cognationes et domos suas et nomina singulorum quicquid sexus est masculini"
      en: "Take the sum of all the congregation of the children of Israel by their families, and houses, and the names of every one, as many as are of the male sex,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "a vicesimo anno et supra omnium virorum fortium ex Israhel et numerabitis eos per turmas suas tu et Aaron"
      en: "From twenty years old and upwards, of all the men of Israel fit for war, and you shall number them by their troops, thou and Aaron."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "eruntque vobiscum principes tribuum ac domorum in cognationibus suis"
      en: "And there shall be with you the princes of the tribes, and of the houses in their kindreds,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quorum ista sunt nomina de Ruben Elisur filius Sedeur"
      en: "Whose names are these: Of Ruben, Elisur the son of Sedeur."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "de Symeon Salamihel filius Surisaddai"
      en: "Of Simeon, Salamiel the son of Surisaddai."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "de Iuda Naasson filius Aminadab"
      en: "Of Juda, Nahasson the son of Aminadab."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "de Isachar Nathanahel filius Suar"
      en: "Of Issachar, Nathanael the son of Suar."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "de Zabulon Heliab filius Helon"
      en: "Of Zabulon, Eliab the son of Helon."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "filiorum autem Ioseph de Ephraim Helisama filius Ammiud de Manasse Gamalihel filius Phadassur"
      en: "And of the sons of Joseph: of Ephraim, Elisama the son of Ammiud: of Manasses, Gamaliel the son of Phadassur."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "de Beniamin Abidan filius Gedeonis"
      en: "Of Benjamin, Abidan the son of Gedeon."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "de Dan Ahiezer filius Amisaddai"
      en: "Of Dan, Ahiezer the son of Ammisaddai."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "de Aser Phegihel filius Ochran"
      en: "Of Aser, Phegiel the son of Ochran."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "de Gad Heliasaph filius Duhel"
      en: "Of Gad, Eliasaph the son of Duel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "de Nepthali Ahira filius Henan"
      en: "Of Nephtali, Ahira the son of Enan."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hii nobilissimi principes multitudinis per tribus et cognationes suas et capita exercitus Israhel"
      en: "These are the most noble princes of the multitude by their tribes and kindreds, and the chiefs of the army of Israel:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quos tulerunt Moses et Aaron cum omni vulgi multitudine"
      en: "Whom Moses and Aaron took with all the multitude of the common people:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et congregaverunt primo die mensis secundi recensentes eos per cognationes et domos ac familias et capita et nomina singulorum a vicesimo anno et supra"
      en: "And assembled them on the first day of the second month, reckoning them up by the kindreds, and houses, and families, and heads, and names of every one from twenty years old and upward,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "sicut praeceperat Dominus Mosi numeratique sunt in deserto Sinai"
      en: "As the Lord had commanded Moses. And they were numbered in the desert of Sinai."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "de Ruben primogenito Israhelis per generationes et familias ac domos suas et nomina capitum singulorum omne quod sexus est masculini a vicesimo anno et supra procedentium ad bellum"
      en: "Of Ruben the eldest son of Israel, by their generations and families and houses and names of every head, all that were of the male sex, from twenty years old and upward, that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quadraginta sex milia quingenti"
      en: "Were forty-six thousand five hundred."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "de filiis Symeon per generationes et familias ac domos cognationum suarum recensiti sunt per nomina et capita singulorum omne quod sexus est masculini a vicesimo anno et supra procedentium ad bellum"
      en: "Of the sons of Simeon by their generations and families, and houses of their kindreds, were reckoned up by the names and heads of every one, all that were of the male sex, from twenty years old and upward, that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quinquaginta novem milia trecenti"
      en: "Fifty-nine thousand three hundred."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "de filiis Gad per generationes et familias ac domos cognationum suarum recensiti sunt per nomina singulorum a viginti annis et supra omnes qui ad bella procederent"
      en: "Of the sons of Gad, by their generations and families and houses of their kindreds were reckoned up by the names of every one from twenty years old and upward, all that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quadraginta quinque milia sescenti quinquaginta"
      en: "Forty-five thousand six hundred and fifty."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "de filiis Iuda per generationes et familias ac domos cognationum suarum per nomina singulorum a vicesimo anno et supra omnes qui poterant ad bella procedere"
      en: "Of the sons of Juda, by their generations and families and houses of their kindreds, by the names of every one from twenty years old and upward, all that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "recensiti sunt septuaginta quattuor milia sescenti"
      en: "Were reckoned up seventy-four thousand six hundred."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "de filiis Isachar per generationes et familias ac domos cognationum suarum per nomina singulorum a vicesimo anno et supra omnes qui ad bella procederent"
      en: "Of the sons of Issachar, by their generations and families and houses of their kindreds, by the names of every one from twenty years old and upward, all that could go forth to war,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "recensiti sunt quinquaginta quattuor milia quadringenti"
      en: "Were reckoned up fifty-four thousand four hundred."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "de filiis Zabulon per generationes et familias ac domos cognationum suarum recensiti sunt per nomina singulorum a vicesimo anno et supra omnes qui poterant ad bella procedere"
      en: "Of the sons of Zabulon, by the generations and families and houses of their kindreds, were reckoned up by the names of every one from twenty years old and upward, all that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quinquaginta septem milia quadringenti"
      en: "Fifty-seven thousand four hundred."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "de filiis Ioseph filiorum Ephraim per generationes et familias ac domos cognationum suarum recensiti sunt per nomina singulorum a vicesimo anno et supra omnes qui poterant ad bella procedere"
      en: "Of the sons of Joseph, namely, of the sons of Ephraim, by the generations and families and houses of their kindreds, were reckoned up by the names of every one, from twenty years old and upward, all that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "quadraginta milia quingenti"
      en: "Forty thousand five hundred."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "porro filiorum Manasse per generationes et familias ac domos cognationum suarum recensiti sunt per nomina singulorum a viginti annis et supra omnes qui poterant ad bella procedere"
      en: "Moreover of the sons of Manasses, by the generations and families and houses of their kindreds, were reckoned up by the names of every one from twenty years old and upward, all that could go forth to war,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "triginta duo milia ducenti"
      en: "Thirty-two thousand two hundred."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "de filiis Beniamin per generationes et familias ac domos cognationum suarum recensiti sunt nominibus singulorum a vicesimo anno et supra omnes qui poterant ad bella procedere"
      en: "Of the sons of Benjamin, by their generations and families and houses of their kindreds, were reckoned up by the names of every one from twenty years old and upward, all that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "triginta quinque milia quadringenti"
      en: "Thirty-five thousand four hundred."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "de filiis Dan per generationes et familias ac domos cognationum suarum recensiti sunt nominibus singulorum a vicesimo anno et supra omnes qui poterant ad bella procedere"
      en: "Of the sons of Dan, by their generations and families and houses of their kindreds, were reckoned up by the names of every one from twenty years old and upward, all that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "sexaginta duo milia septingenti"
      en: "Sixty-two thousand seven hundred."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "de filiis Aser per generationes et familias ac domos cognationum suarum recensiti sunt per nomina singulorum a vicesimo anno et supra omnes qui poterant ad bella procedere"
      en: "Of the sons of Aser, by their generations and families and houses of their kindreds, were reckoned up by the names of every one from twenty years old and upward, all that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "quadraginta milia et mille quingenti"
      en: "Forty-one thousand and five hundred."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "de filiis Nepthali per generationes et familias ac domos cognationum suarum recensiti sunt nominibus singulorum a vicesimo anno et supra omnes qui poterant ad bella procedere"
      en: "Of the sons of Nephtali, by their generations and families and houses of their kindreds, were reckoned up by the names of every one from twenty years old and upward, all that were able to go forth to war,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "quinquaginta tria milia quadringenti"
      en: "Fifty-three thousand four hundred."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "hii sunt quos numeraverunt Moses et Aaron et duodecim principes Israhel singulos per domos cognationum suarum"
      en: "These era they who were numbered by Moses and Aaron, and the twelve princes of Israel, every one by the houses of their kindreds."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "fueruntque omnes filiorum Israhel per domos et familias suas a vicesimo anno et supra qui poterant ad bella procedere"
      en: "And the whole number of the children of Israel by their houses and families, from twenty years old and upward, that were able to go to war,"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "sescenta tria milia virorum quingenti quinquaginta"
      en: "Were six hundred and three thousand five hundred and fifty men."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Levitae autem in tribu familiarum suarum non sunt numerati cum eis"
      en: "But the Levites in the tribes of their families were not numbered with them."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "tribum Levi noli numerare neque ponas summam eorum cum filiis Israhel"
      en: "Number not the tribe of Levi, neither shalt thou put down the sum of them with the children of Israel:"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "sed constitue eos super tabernaculum testimonii cuncta vasa eius et quicquid ad caerimonias pertinet ipsi portabunt tabernaculum et omnia utensilia eius et erunt in ministerio ac per gyrum tabernaculi metabuntur"
      en: "But appoint them over the tabernacle of the testimony, and all the vessels thereof, and whatsoever pertaineth to the ceremonies. They shall carry the tabernacle and all the furniture thereof: and they shall minister, and shall encamp round about the tabernacle."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "cum proficiscendum fuerit deponent Levitae tabernaculum cum castra metanda erigent quisquis externorum accesserit occidetur"
      en: "When you are to go forward, the Levites shall take down the tabernacle: when you are to camp, they shall set it up. What stranger soever cometh to it, shall be slain."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "metabuntur autem castra filii Israhel unusquisque per turmas et cuneos atque exercitum suum"
      en: "And the children of Israel shall camp every man by his troops and bands and army."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "porro Levitae per gyrum tabernaculi figent tentoria ne fiat indignatio super multitudinem filiorum Israhel et excubabunt in custodiis tabernaculi testimonii"
      en: "But the Levites shall pitch their tents round about the tabernacle, lest there come indignation upon the multitude of the children of Israel, and they shall keep watch, and guard the tabernacle of the testimony."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "fecerunt ergo filii Israhel iuxta omnia quae praeceperat Dominus Mosi"
      en: "And the children of Israel did according to all things which the Lord had commanded Moses."
    status: { la: verified, en: verified }
