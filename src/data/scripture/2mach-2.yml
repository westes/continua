# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2mach
chapter: 2
verses:
  - n: 1
    text:
      la: "invenitur autem in descriptionibus Hieremiae prophetae quod iussit accipere ignem eos qui transmigrabantur ut significatum est et ut mandavit transmigratis"
      en: "Now it is found in the descriptions of Jeremias the prophet, that he commanded them that went into captivity, to take the fire, as it hath been signified, and how he gave charge to them that were carried away into captivity."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et dedit illis legem ne obliviscerentur praecepta Domini et ut non exerrarent mentibus videntes simulacra aurea et argentea et ornamenta eorum"
      en: "And how he gave them the law that they should not forget the commandments of the Lord, and that they should not err in their minds, seeing the idols of gold, and silver, and the ornaments of them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et alia huiuscemodi dicens hortabatur ne legem amoverent a corde suo"
      en: "And with other such like speeches, he exhorted them that they would not remove the law from their heart."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "erat autem in ipsa scriptura quomodo tabernaculum et arcam iussit propheta divino responso ad se facto comitari secum usquequo exiit in montem in quo Moses ascendit et vidit Dei hereditatem"
      en: "It was also contained in the same writing, how the prophet, being warned by God, commanded that the tabernacle and the ark should accompany him, till he came forth to the mountain \" where Moses went up, and saw the inheritance of God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et veniens ibi Hieremias invenit locum speluncae et tabernaculum et arcam et altare incensi intulit illuc et ostium obstruxit"
      en: "And when Jeremias came thither he found a hollow cave: and he carried in thither the tabernacle, and the ark, and the altar of incense, and so stopped the door."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et accesserunt quidam simul qui sequebantur ut notarent sibi locum et non potuerunt invenire"
      en: "Then some of them that followed him, came up to mark the place: but they could not And it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ut autem cognovit Hieremias culpans illos dixit quod ignotus erit locus donec congreget Deus congregationem populi et propitius fiat"
      en: "And when Jeremias perceived it, he blamed them, saying: The place shall be unknown, till God gather together the congregation of the people, and receive them to mercy."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et tunc Dominus ostendet haec et apparebit maiestas Domini et nubes erit sicut et Mosi manifestabatur et sicut cum Salomon petiit ut locus sanctificaretur magno Deo manifestabat haec"
      en: "And then the Lord will shew these things, and the majesty of the Lord shall appear, and there shall be a cloud as it was also shewed to Moses, \"and he shewed it when Solomon prayed that the place might be sanctified to the great God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ut sapientiam habens obtulit sacrificium dedicationis et consummationis templi"
      en: "For he treated wisdom in a magnificent manner: and like a wise man, he offered the sacrifice of the dedication, and of the finishing of the temple."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sicut et Moses orabat ad Dominum et descendit ignis de caelo et consumpsit holocaustum"
      en: "And as Moses prayed to the Lord and fire came down from heaven, and consumed the holocaust: so Solomon also prayed, and fire came down from heaven and consumed the holocaust."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dixit Moses eo quod non sit mundatum quod erat pro peccato et consumptum est"
      en: "And Moses said: Because the sin offering was not eaten, it was consumed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "similiter et Salomon octo diebus celebravit dedicationem"
      en: "So Solomon also celebrated the dedication eight days."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "inferebantur autem in descriptionibus et commentariis Neemiae haec eadem et ut construens bibliothecam congregavit de regibus libros et prophetarum et David et epistulas regum et de donariis"
      en: "And these same things were set down in the memoirs and commentaries of Nehemias: and how he made a library, and gathered together out of the countries, the books both of the prophets, and of David, and the epistles of the kings. and concerning the holy gifts."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "similiter autem et Iudas ea quae didicerat per bellum quod nobis acciderat congregavit omnia et sunt apud nos"
      en: "And in like manner Judas also gathered together all such things as were lost by the war we had, and they are in our possession."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "si ergo desiderastis haec mittite qui perferant vobis"
      en: "Wherefore if you want these things, send some that may fetch them to you."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "acturi itaque purificationem scripsimus vobis bene igitur facietis si egeritis hos dies"
      en: "As we are then about to celebrate the purification, we have written unto you: and you shall do well, if you keep the same days."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Deus autem qui liberavit populum suum et reddidit hereditatem omnibus et regnum et sacerdotium et sanctificationem"
      en: "And we hope that God who hath delivered his people, and hath rendered to all the inheritance, and the kingdom, and the priesthood, and the sanctuary,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sicut promisit in lege speramus quod cito nostri miserebitur et congregabit de sub caelo in locum sanctum"
      en: "As he promised in the law, will shortly have mercy upon us, and will gather us together from every land under heaven into the holy place."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "eripuit enim nos de magnis periculis et locum purgavit"
      en: "For he hath delivered us out of great perils, and hath cleansed the place."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "de Iuda vero Macchabeo et fratribus eius et de templi magni purificatione et de arae dedicatione"
      en: "Now as concerning Judas Machabeus. and his brethren, and the purification of the great temple, and the dedication o the altar:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sed et de proeliis quae pertinent ad Antiochum Nobilem et filium eius Eupatorem"
      en: "As also the wars against Antioch the Illustrious, and his son Eupator:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et de inluminationibus quae de caelo factae sunt ad eos qui pro Iudaeis fortiter fecerunt ita ut universam regionem cum pauci essent vindicarent et barbaram multitudinem fugarent"
      en: "And the manifestations that from heaven to them, that behaved themselves manfully on the behalf of the Jews, so that, being but a few, they made themselves masters of the whole country, and put to flight; the barbarous multitude :"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et famosissimum in toto orbe templum recuperarent et civitatem liberarent ut leges quae abolendae erant restituerentur Domino cum omni tranquillitate propitio facto illis"
      en: "And recovered again the most renowned temple in all the world, and delivered the city, and restored the laws that were abolished, the Lord with all clemency shewing mercy to them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "itemque ab Iasone Cyreneo quinque libris conprehensa temptavimus nos uno volumine breviare"
      en: "And all such things as have been comprised in five books by Jason of Cyrene, we have attempted to abridge in one book."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "considerantes enim multitudinem librorum et difficultatem volentibus adgredi narrationes historiarum propter multitudinem rerum"
      en: "For considering the multitude of books, and the difficulty that they find that desire to undertake the narrations of histories, because of the multitude of the matter,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "curavimus volentibus quidem legere ut esset animi oblectatio studiosis vero ut facile possint memoriae commendare omnibus autem legentibus utilitas conferatur"
      en: "We have taken care for those indeed that are willing to read, that it might be a pleasure of mind: and for the studious, that they may more easily commit to memory: and that all that read might receive profit."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et nobis quidem ipsis qui opus hoc breviandi causa suscepimus non facilem laborem immo vero negotium plenum vigiliarum et sudoris adsumpsimus"
      en: "And as to ourselves indeed, in under- taking this work of abridging, we have taken in hand no easy task, yea rather a business full of watching and sweat."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sicut hii qui praeparant convivium et quaerunt aliorum voluntati parere propter multorum gratiam libenter laborem sustinemus"
      en: "But as they that prepare a feast, and seek to satisfy the will of others: for the sake of many, we willingly undergo the labour."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "veritatem quidem de singulis auctori concedentes ipsi autem secundum datam formam brevitati studentes"
      en: "Leaving to the authors the exact handling of every particular, and as for ourselves, according to the plan pro- posed, studying to be brief."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "sicut enim novae domus architecto de universa structura curandum est ei vero qui pingere conatur quae apta sunt ad ornatum exquirenda sunt ita aestimandum est et in nobis"
      en: "For as the master builder of a new house must have care of the whole building: but he that taketh care to paint it, must seek out fit things for the adorning of it: so must it be judged for us."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "etenim intellectum colligere et ordinare sermonem et curiosius partes singulas quasque disquaerere historiae congruit auctori"
      en: "For to collect all that is to be known, to put the discourse in order, and curiously to discuss every particular point, is the duty of the author of a history:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "brevitatem vero dictionis sectari et exsecutiones rerum vitare brevitati concedendum est"
      en: "But to pursue brevity of speech, and to avoid nice declarations of things, is to be granted to him that maketh an abridgment."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "hinc igitur narrationem incipiemus de praefatione tantum dixisse sufficiat stultum etenim est ante historiam effluere in ipsa autem historia succingi"
      en: "Here then we will begin the narration: let this be enough by way of a preface: for it is a foolish thing to make a long prologue, and to be short in the story itself."
    status: { la: verified, en: verified }
