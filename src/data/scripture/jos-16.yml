# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 16
verses:
  - n: 1
    text:
      la: "Cecidit quoque sors filiorum Joseph ab Jordane contra Jericho et aquas ejus ab oriente: solitudo quae ascendit de Jericho ad montem Bethel:"
      en: "And the lot of the sons of Joseph fell from the Jordan over against Jericho and the waters thereof, on the east: the wilderness which goeth up from Jericho to the mountain of Bethel:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et egreditur de Bethel Luza: transitque terminum Archi, Ataroth:"
      en: "And goeth out from Bethel to Luza: and passeth the border of Archi, to Ataroth,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et descendit ad occidentem juxta terminum Jephleti, usque ad terminos Beth-horon inferioris, et Gazer: finiunturque regiones ejus mari magno:"
      en: "And goeth down westward, by the border of Jephleti, unto the borders of Beth-horon the nether, and to Gazer: and the countries of it are ended by the great sea:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "possederuntque filii Joseph Manasses et Ephraim."
      en: "And Manasses and Ephraim the children of Joseph possessed it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et factus est terminus filiorum Ephraim per cognationes suas: et possessio eorum contra orientem Ataroth Addar usque Beth-horon superiorem."
      en: "And the border of the children of Ephraim was according to their kindreds: and their possession towards the east was Ataroth-addar unto Beth-horon the upper."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Egrediunturque confinia in mare: Machmethath vero aquilonem respicit, et circuit terminos contra orientem in Thanathselo: et pertransit ab oriente Janoe."
      en: "And the confines go out unto the sea: but Machmethath looketh to the north, and it goeth round the borders eastward into Thanath-selo: and passeth along on the east side to Janoe."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Descenditque de Janoe in Ataroth et Naaratha: et pervenit in Jericho, egrediturque ad Jordanem."
      en: "And it goeth down from Janoe into Ataroth and Naaratha: and it cometh to Jericho, and goeth out to the Jordan."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "De Taphua pertransit contra mare in vallem arundineti, suntque egressus ejus in mare salsissimum. Haec est possessio tribus filiorum Ephraim per familias suas."
      en: "From Taphua it passeth on towards the sea into the valley of reeds, and the goings out thereof are at the most salt sea. This is the possession of the tribe of the children of Ephraim by their families."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Urbesque separatae sunt filiis Ephraim in medio possessionis filiorum Manasse, et villae earum."
      en: "And there were cities with their villages separated for the children of Ephraim in the midst of the possession of the children of Manasses."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et non interfecerunt filii Ephraim Chananaeum, qui habitabat in Gazer: habitavitque Chananaeus in medio Ephraim usque in diem hanc tributarius."
      en: "And the children of Ephraim slew not the Chanaanite, who dwelt in Gazer: and the Chanaanite dwelt in the midst of Ephraim until this day, paying tribute."
    status: { la: verified, en: verified }
