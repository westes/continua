# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jos
chapter: 16
verses:
  - n: 1
    text:
      la: "cecidit quoque sors filiorum Ioseph ab Iordane contra Hiericho et aquas eius ab oriente solitudo quae ascendit de Hiericho ad montana Bethel"
      en: "And the lot of the sons of Joseph fell from the Jordan over against Jericho and the waters thereof, on the east: the wilderness which goeth up from Jericho to the mountain of Bethel:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et egreditur de Bethel Luzam transitque terminum Archiatharoth"
      en: "And goeth out from Bethel to Luza: and passeth the border of Archi, to Ataroth,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et descendit ad occidentem iuxta terminum Ieflethi usque ad terminos Bethoron inferioris et Gazer finiunturque regiones eius mari Magno"
      en: "And goeth down westward, by the border of Jephleti, unto the borders of Beth-horon the nether, and to Gazer :and the countries of it are ended by the great sea:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "possederuntque filii Ioseph Manasse et Ephraim"
      en: "And Manasses and Ephraim the children of Joseph possessed it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et factus est terminus filiorum Ephraim per cognationes suas et possessio eorum contra orientem Atharothaddar usque Bethoron superiorem"
      en: "And the border of the children of Ephraim was according to their kindreds: and their possession towards the east was Ataroth-addar unto Beth-horon the upper."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "egrediunturque confinia in mare Machmethath vero aquilonem respicit et circuit terminus contra orientem in Thanathselo et pertransit ab oriente Ianoe"
      en: "And the confines go out unto the sea: but Machmethath looketh to the north, and it goeth round the borders eastward into Thanath-selo: and passeth along on the east side to Janoe."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "descenditque de Ianoe in Atharoth et Noaratha et pervenit in Hiericho et egreditur ad Iordanem"
      en: "And it goeth down from Janoe into Ataroth and Naaratha: and it cometh to Jericho, and goeth out to the Jordan."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "de Taffua pertransitque contra mare in valle Harundineti suntque egressus eius in mare Salsissimum haec est possessio tribus filiorum Ephraim per familias suas"
      en: "From Taphua it passeth on towards the sea into the valley of reeds, and the goings out thereof are at the most salt sea. This is the possession of the tribe of the children of Ephraim by their families."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "urbesque quae separatae sunt filiis Ephraim in medio possessionis filiorum Manasse et villae earum"
      en: "And there were cities with their villages separated for the children of Ephraim in the midst of the possession of the children of Manasses."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et non interfecerunt filii Ephraim Chananeum qui habitabat in Gazer habitavitque Chananeus in medio Ephraim usque in diem hanc tributarius"
      en: "And the children of Ephraim slew not the Chanaanite, who dwelt in Gazer: and the Chanaanite dwelt in the midst of Ephraim until this day, paying tribute."
    status: { la: verified, en: verified }
