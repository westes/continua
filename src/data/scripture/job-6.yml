# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 6
verses:
  - n: 1
    text:
      la: "respondens autem Iob dixit"
      en: "But Job answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "utinam adpenderentur peccata mea quibus iram merui et calamitas quam patior in statera"
      en: "O that my sins, whereby I have deserved wrath, and the calamity that I suffer, were weighed in a balance."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quasi harena maris haec gravior appareret unde et verba mea dolore sunt plena"
      en: "As the sand of the sea this would appear heavier: therefore my words are full of sorrow :"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia sagittae Domini in me sunt quarum indignatio ebibit spiritum meum et terrores Domini militant contra me"
      en: "For the arrows of the Lord are in me, the rage whereof drinketh up my spirit, and the terrors of the Lord war against me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "numquid rugiet onager cum habuerit herbam aut mugiet bos cum ante praesepe plenum steterit"
      en: "Will the wild ass bray when he hath grass? or will the ox low when he standeth before a full manger?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "aut poterit comedi insulsum quod non est sale conditum aut potest aliquis gustare quod gustatum adfert mortem"
      en: "Or can an unsavoury thing be eaten, that is not seasoned with salt? or can a man taste that which when tasted bringeth death?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quae prius tangere nolebat anima mea nunc prae angustia cibi mei sunt"
      en: "The things which before my soul would not touch, now, through anguish are my meats."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quis det ut veniat petitio mea et quod expecto tribuat mihi Deus"
      en: "Who will grant that my request may come: and that God may give me what I look for?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et qui coepit ipse me conterat solvat manum suam et succidat me"
      en: "And that he that hath begun may destroy me, that he may let loose his hand, and cut me off?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et haec mihi sit consolatio ut adfligens me dolore non parcat nec contradicam sermonibus Sancti"
      en: "And that this may be my comfort, that afflicting me with sorrow, he spare not, nor I contradict the words of the Holy One."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quae est enim fortitudo mea ut sustineam aut quis finis meus ut patienter agam"
      en: "For what is my strength, that I can hold out? or what is my end that I should keep patience?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nec fortitudo lapidum fortitudo mea nec caro mea aerea est"
      en: "My strength is not the strength of stones, nor is my flesh of brass."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ecce non est auxilium mihi in me et necessarii quoque mei recesserunt a me"
      en: "Behold there is no help for me in myself, and my familiar friends also are departed from me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui tollit ab amico suo misericordiam timorem Domini derelinquit"
      en: "He that taketh away mercy from his friend, forsaketh the fear of the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "fratres mei praeterierunt me sicut torrens qui raptim transit in convallibus"
      en: "My brethren have passed by me, as the torrent that passeth swiftly in the valleys."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui timent pruinam inruet super eos nix"
      en: "They that fear the hoary frost, the snow shall fall upon them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "tempore quo fuerint dissipati peribunt et ut incaluerit solventur de loco suo"
      en: "At the time when they shall be scattered they shall perish: and after it groweth hot they shall be melted out of their place."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "involutae sunt semitae gressuum eorum ambulabunt in vacuum et peribunt"
      en: "The paths of their steps are entangled: they shall walk in vain, and shall perish."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "considerate semitas Theman itinera Saba et expectate paulisper"
      en: "Consider the paths of Thema, the ways of Saba, and wait a little while."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "confusi sunt quia speravi venerunt quoque usque ad me et pudore cooperti sunt"
      en: "They are confounded, because I have hoped: they are come also even unto me, and are covered with shame."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nunc venistis et modo videntes plagam meam timetis"
      en: "Now you are come: and now seeing my affliction you are afraid."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "numquid dixi adferte mihi et de substantia vestra donate mihi"
      en: "Did I say: Bring to me, and give me of your substance?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "vel liberate me de manu hostis et de manu robustorum eruite me"
      en: "Or deliver me from the hand of the enemy, and rescue me out of the hand of the mighty?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "docete me et ego tacebo et si quid forte ignoravi instruite me"
      en: "Teach me, and I will hold my peace: and if I have been ignorant in any thing, instruct me."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quare detraxistis sermonibus veritatis cum e vobis nullus sit qui possit arguere"
      en: "Why have you detracted the words of truth, whereas there is none of you that can reprove me?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ad increpandum tantum eloquia concinnatis et in ventum verba profertis"
      en: "You dress up speeches only to rebuke, and you utter words to the wind."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "super pupillum inruitis et subvertere nitimini amicum vestrum"
      en: "You rush in upon the fatherless, and you endeavour to overthrow your friend."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "verumtamen quod coepistis explete praebete aurem et videte an mentiar"
      en: "However finish what you have begun, give ear, and see whether I lie."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "respondete obsecro absque contentione et loquentes id quod iustum est iudicate"
      en: "Answer, I beseech you, without contention: and speaking that which is just, judge ye."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et non invenietis in lingua mea iniquitatem nec in faucibus meis stultitia personabit"
      en: "And you shall not And iniquity in my tongue, neither shall folly sound in my mouth."
    status: { la: verified, en: verified }
