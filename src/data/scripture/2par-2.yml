# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 2
verses:
  - n: 1
    text:
      la: "decrevit autem Salomon aedificare domum nomini Domini et palatium sibi"
      en: "And Solomon determined to build a house to the name of the Lord, and a palace for himself."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et numeravit septuaginta milia virorum portantium umeris et octoginta milia qui caederent lapides in montibus praepositosque eorum tria milia sescentos"
      en: "And he numbered out seventy thousand men to bear burdens, and eighty thousand to hew stones in the mountains, and three thousand six hundred to over- see them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "misit quoque ad Hiram regem Tyri dicens sicut egisti cum David patre meo et misisti ei ligna cedrina ut aedificaret sibi domum in qua et habitavit"
      en: "He sent also to Hiram king of Tyre, saying: As thou didst with David my father, and didst send him cedars, to build him a house, in which he dwelt:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sic fac mecum ut aedificem domum nomini Domini Dei mei et consecrem eam ad adolendum incensum coram illo et fumiganda aromata et ad propositionem panum sempiternam et holocaustomata mane et vespere sabbatis quoque et neomeniis et sollemnitatibus Domini Dei nostri in sempiternum quae mandata sunt Israheli"
      en: "So do with me that I may build a house to the name of the Lord my God, to dedicate it to burn incense before him, and to perfume with aromatical spices, and for the continual setting forth of bread, and for the holocausts, morning and evening, and on the sabbaths, and on the new moons, and the solemnities of the Lord our God for ever, which are commanded for Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "domus autem quam aedificare cupio magna est magnus est enim Deus noster super omnes deos"
      en: "For the house which I desire to build, is great: for our God is great above all gods."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quis ergo poterit praevalere ut aedificet ei dignam domum si caelum et caeli caelorum capere eum non queunt quantus ego sum ut possim ei aedificare domum sed ad hoc tantum ut adoleatur incensum coram illo"
      en: "Who then can be able to build him a worthy house? if heaven, and the heavens of heavens cannot contain him: who am I that I should be able to build him a house? but to this end only, that incense may be burnt before him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "mitte igitur mihi virum eruditum qui noverit operari in auro et argento aere ferro purpura coccino et hyacintho et qui sciat scalpere celata cum his artificibus quos mecum habeo in Iudaea et in Hierusalem quos praeparavit David pater meus"
      en: "Send me therefore a skilful man, that knoweth how to work in gold, and in silver, in brass, and in iron, in purple, in scarlet and in blue, and that hath skill in engraving, with the artificers, which I have with me in Judea and Jerusalem, whom David my father provided."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed et ligna cedrina mitte mihi et arceuthina et pinea de Libano scio enim quod servi tui noverint caedere ligna de Libano et erunt servi mei cum servis tuis"
      en: "Send me also cedars, and fir trees, and pine trees from Libanus: for I know that thy servants are skilful in cutting timber in Libanus, and my servants shall be with thy servants,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ut parentur mihi ligna plurima domus enim quam cupio aedificare magna est nimis et inclita"
      en: "To provide me timber in abundance. For the house which I desire to build, is to be exceeding great, and glorious."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "praeterea operariis qui caesuri sunt ligna servis tuis dabo in cibaria tritici choros viginti milia et hordei choros totidem olei quoque sata viginti milia"
      en: "And I will give thy servants the workmen that are to cut down the trees, for their food twenty thousand cores of wheat, and as many cores of barley, and twenty thousand measures of wine, and twenty thousand measures of oil."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixit autem Hiram rex Tyri per litteras quas miserat Salomoni quia dilexit Dominus populum suum idcirco te regnare fecit super eum"
      en: "And Hiram king of Tyre sent a letter to Solomon, saying: Because the Lord hath loved his people, therefore he hath made thee king over them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et addidit dicens benedictus Dominus Deus Israhel qui fecit caelum et terram qui dedit David regi filium sapientem et eruditum et sensatum atque prudentem ut aedificaret domum Domino et palatium sibi"
      en: "And he added, saying: Blessed be the Lord the God of Israel, who made heaven and earth, who hath given to king David a wise and knowing son, endued with understanding and prudence, to build a house to the Lord, and a palace for himself."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "misi ergo tibi virum prudentem et scientissimum Hiram patrem meum"
      en: "I therefore have sent thee my father Hiram, a wise and most skilful man,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "filium mulieris de filiabus Dan cuius pater Tyrius fuit qui noverit operari in auro et argento et aere et ferro et marmore et lignis in purpura quoque et hyacintho et bysso et coccino et qui sciat celare omnem scalpturam et adinvenire prudenter quodcumque in opere necessarium est cum artificibus tuis et cum artificibus domini mei David patris tui"
      en: "The son of a woman of the daughters of Dan, whose father was a Tyrian, who knoweth how to work in gold, and in silver, in brass, and in iron, and in marble, and in timber, in purple also, and violet, and silk and scarlet: and who knoweth to grave all sort of graving, and to devise ingeniously all that there may be need of in the work with thy artificers, and with the artificers of my lord David thy father."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "triticum ergo et hordeum et oleum et vinum quae pollicitus es domine mi mitte servis tuis"
      en: "The wheat therefore, and the barley and the oil, and the wine, which thou, my lord, hast promised, send to thy servants."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nos autem caedemus ligna de Libano quot necessaria habueris et adplicabimus ea ratibus per mare in Ioppe tuum erit transferre ea in Hierusalem"
      en: "And we will cut down as many trees out of Libanus, as thou shalt want, and will convey them in floats by sea to Joppe: and it will be thy part to bring them thence to Jerusalem."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "numeravit igitur Salomon omnes viros proselytos qui erant in terra Israhel post dinumerationem quam dinumeravit David pater eius et inventi sunt centum quinquaginta milia et tria milia sescenti"
      en: "And Solomon numbered all the proselytes in the land of Israel, after the numbering which David his father had made, and they were found a hundred and fifty-three thousand and six hundred."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "fecitque ex eis septuaginta milia qui umeris onera portarent et octoginta milia qui lapides in montibus caederent tria milia autem et sescentos praepositos operum populi"
      en: "And he set seventy thousand of them to carry burdens on their shoulders, and eighty thousand to hew stones in the mountains: and three thousand and six hundred to be overseers of the work of the people."
    status: { la: verified, en: verified }
