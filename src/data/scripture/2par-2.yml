# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 2
verses:
  - n: 1
    text:
      la: "Decrevit autem Salomon aedificare domum nomini Domini, et palatium sibi."
      en: "And Solomon determined to build a house to the name of the Lord, and a palace for himself."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et numeravit septuaginta millia virorum portantium humeris, et octoginta millia qui caederent lapides in montibus, praepositosque eorum tria millia sexcentos."
      en: "And he numbered out seventy thousand men to bear burdens, and eighty thousand to hew stones in the mountains, and three thousand six hundred to oversee them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Misit quoque ad Hiram regem Tyri, dicens: Sicut egisti cum David patre meo, et misisti ei ligna cedrina ut aedificaret sibi domum, in qua et habitavit:"
      en: "He sent also to Hiram king of Tyre, saying: As thou didst with David my father, and didst send him cedars, to build him a house, in which he dwelt:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sic fac mecum ut aedificem domum nomini Domini Dei mei, ut consecrem eam ad adolendum incensum coram illo, et fumiganda aromata, et ad propositionem panum sempiternam, et ad holocautomata mane, et vespere, sabbatis quoque, et neomeniis, et solemnitatibus Domini Dei nostri in sempiternum, quae mandata sunt Israeli."
      en: "So do with me that I may build a house to the name of the Lord my God, to dedicate it to burn incense before him, and to perfume with aromatical spices, and for the continual setting forth of bread, and for the holocausts, morning and evening, and on the sabbaths, and on the new moons, and the solemnities of the Lord our God for ever, which are commanded for Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Domus enim, quam aedificare cupio, magna est: magnus est enim Deus noster super omnes deos."
      en: "For the house which I desire to build, is great: for our God is great above all gods."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quis ergo poterit praevalere, ut aedificet ei dignam domum? Si caelum, et caeli caelorum capere eum nequeunt: quantus ego sum, ut possim aedificare ei domum? sed ad hoc tantum, ut adoleatur incensum coram illo."
      en: "Who then can be able to build him a worthy house? if heaven, and the heavens of heavens cannot contain him: who am I that I should be able to build him a house? but to this end only, that incense may be burnt before him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Mitte ergo mihi virum eruditum, qui noverit operari in auro, et argento, aere, et ferro, purpura, coccino, et hyacintho, et qui sciat sculpere caelaturas cum his artificibus, quos mecum habeo in Judaea, et Jerusalem, quos praeparavit David pater meus."
      en: "Send me therefore a skillful man, that knoweth how to work in gold, and in silver, in brass, and in iron, in purple, in scarlet and in blue, and that hath skill in engraving, with the artificers, which I have with me in Judea and Jerusalem, whom David my father provided."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sed et ligna cedrina mitte mihi, et arceuthina, et pinea de Libano: scio enim quod servi tui noverint caedere ligna de Libano, et erunt servi mei cum servis tuis,"
      en: "Send me also cedars, and fir trees, and pine trees from Libanus: for I know that thy servants are skillful in cutting timber in Libanus, and my servants shall be with thy servants,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ut parentur mihi ligna plurima. Domus enim, quam cupio aedificare, magna est nimis, et inclyta."
      en: "To provide me timber in abundance. For the house which I desire to build, is to be exceeding great, and glorious."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Praeterea operariis, qui caesuri sunt ligna, servis tuis dabo in cibaria tritici coros viginti millia, et hordei coros totidem, et vini viginti millia metretas, olei quoque sata viginti millia."
      en: "And I will give thy servants the workmen that are to cut down the trees, for their food twenty thousand cores of wheat, and as many cores of barley, and twenty thousand measures of wine, and twenty thousand measures of oil."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dixit autem Hiram rex Tyri per litteras, quas miserat Salomoni: Quia dilexit Dominus populum suum, idcirco te regnare fecit super eum."
      en: "And Hiram king of Tyre sent a letter to Solomon, saying: Because the Lord hath loved his people, therefore he hath made thee king over them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et addidit, dicens: Benedictus Dominus Deus Israel, qui fecit caelum et terram: qui dedit David regi filium sapientem et eruditum et sensatum atque prudentem, ut aedificaret domum Domino, et palatium sibi."
      en: "And he added, saying: Blessed be the Lord the God of Israel, who made heaven and earth, who hath given to king David a wise and knowing son, endued with understanding and prudence, to build a house to the Lord, and a palace for himself."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Misi ergo tibi virum prudentem et scientissimum Hiram patrem meum,"
      en: "I therefore have sent thee my father Hiram, a wise and most skillful man,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "filium mulieris de filiabus Dan, cujus pater fuit Tyrius, qui novit operari in auro, et argento, aere, et ferro, et marmore, et lignis, in purpura quoque, et hyacintho, et bysso, et coccino: et qui scit caelare omnem sculpturam, et adinvenire prudenter quodcumque in opere necessarium est cum artificibus tuis, et cum artificibus domini mei David patris tui."
      en: "The son of a woman of the daughters of Dan, whose father was a Tyrian, who knoweth how to work in gold, and in silver, in brass, and in iron, and in marble, and in timber, in purple also, and violet, and silk and scarlet: and who knoweth to grave all sort of graving, and to devise ingeniously all that there may be need of in the work with thy artificers, and with the artificers of my lord David thy father."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Triticum ergo, et hordeum, et oleum, et vinum, quae pollicitus es, domine mi, mitte servis tuis."
      en: "The wheat therefore, and the barley and the oil, and the wine, which thou, my lord, hast promised, send to thy servants."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nos autem caedemus ligna de Libano, quot necessaria habueris, et applicabimus ea ratibus per mare in Joppe: tuum autem erit transferre ea in Jerusalem."
      en: "And we will cut down as many trees out of Libanus, as thou shalt want, and will convey them in floats by sea to Joppe: and it will be thy part to bring them thence to Jerusalem."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Numeravit igitur Salomon omnes viros proselytos, qui erant in terra Israel, post dinumerationem, quam dinumeravit David pater ejus, et inventi sunt centum quinquaginta millia, et tria millia sexcenti."
      en: "And Solomon numbered all the proselytes in the land of Israel, after the numbering which David his father had made, and they were found a hundred and fifty-three thousand and six hundred."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Fecitque ex eis septuaginta millia, qui humeris onera portarent, et octoginta millia, qui lapides in montibus caederent: tria autem millia et sexcentos praepositos operum populi."
      en: "And he set seventy thousand of them to carry burdens on their shoulders, and eighty thousand to hew stones in the mountains: and three thousand and six hundred to be overseers of the work of the people."
    status: { la: verified, en: verified }
