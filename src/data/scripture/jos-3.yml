# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jos
chapter: 3
verses:
  - n: 1
    text:
      la: "igitur Iosue de nocte consurgens movit castra egredientesque de Setthim venerunt ad Iordanem ipse et omnes filii Israhel et morati sunt ibi per tres dies"
      en: "And Josue rose before daylight, and removed the camp: and they departed from Setim, and came to the Jordan, he, and all the children of Israel, and they abode there for three days."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quibus evolutis transierunt praecones per castrorum medium"
      en: "After which, the heralds went through the midst of the camp,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et clamare coeperunt quando videritis arcam foederis Domini Dei vestri et sacerdotes stirpis leviticae portantes eam vos quoque consurgite et sequimini praecedentes"
      en: "And began to proclaim: When you shall see the ark of the covenant of the Lord your God, and the priests of the race of Levi carrying it, rise you up also, and follow them as they go before:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sitque inter vos et arcam spatium cubitorum duum milium ut procul videre possitis et nosse per quam viam ingrediamini quia prius non ambulastis per eam et cavete ne adpropinquetis ad arcam"
      en: "And let there be between you and the ark the space of two thousand cubits: that you may see it afar off, and know which way you must go: for you have not gone this way before: and take care you come not near the ark."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque Iosue ad populum sanctificamini cras enim faciet Dominus inter vos mirabilia"
      en: "And Josue said to the people: Be ye sanctified: for to morrow the Lord will do wonders among you."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ait ad sacerdotes tollite arcam foederis et praecedite populum qui iussa conplentes tulerunt et ambulaverunt ante eos"
      en: "And he said to the priests: Take up the ark of the covenant, and go before the people. And they obeyed his commands, and took it up and walked before them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixitque Dominus ad Iosue hodie incipiam exaltare te coram omni Israhel ut sciant quod sicut cum Mosi fui ita et tecum sim"
      en: "And the Lord said to Josue: This day will I begin to exalt thee before Israel: that they may know that as I was with Moses, so I am with thee also."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tu autem praecipe sacerdotibus qui portant arcam foederis et dic eis cum ingressi fueritis partem aquae Iordanis state in ea"
      en: "And do thou command the priests that carry the ark of the covenant, and say to them: When you shall have entered into part of the water of the Jordan, stand in it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixitque Iosue ad filios Israhel accedite huc et audite verba Domini Dei vestri"
      en: "And Josue said to the children of Israel: Come hither and hear the word of the Lord your God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et rursum in hoc inquit scietis quod Dominus Deus vivens in medio vestri est et disperdat in conspectu vestro Chananeum Hettheum Eveum et Ferezeum Gergeseum quoque et Amorreum et Iebuseum"
      en: "And again he said: By this you shall know that the Lord the living God is in the midst of you, and that he shall destroy before your sight the Chanaanite and the Hethite, the Hevite and the Pherezite, the Gergesite also and the Jebusite, and the Amorrhite."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ecce arca foederis Domini omnis terrae antecedet vos per Iordanem"
      en: "Behold the ark of the covenant of the Lord of all the earth shall go before you into the Jordan."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "parate duodecim viros de tribubus Israhel singulos per singulas tribus"
      en: "Prepare ye twelve men of the tribes of Israel, one of every tribe."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et cum posuerint vestigia pedum suorum sacerdotes qui portant arcam Domini Dei universae terrae in aquis Iordanis aquae quae inferiores sunt decurrent atque deficient quae autem desuper veniunt in una mole consistent"
      en: "And when the priests, that carry the ark of the Lord the God of the whole earth, shall set the soles of their feet in the waters of the Jordan, the waters that are beneath shall run down and go off: and those that come from above, shall stand together upon a heap."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "igitur egressus est populus de tabernaculis suis ut transirent Iordanem et sacerdotes qui portabant arcam foederis pergebant ante eum"
      en: "So the people went out of their tents, to pass over the Jordan: and the priests that carried the ark of the covenant. went on before them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ingressisque eis Iordanem et pedibus eorum tinctis in parte aquae cum Iordanis autem ripas alvei sui tempore messis impleret"
      en: "And as soon as they came into the Jordan, and their feet were dipped in part of the water, (now the Jordan, it being harvest time, had filled the banks of its channel,)"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "steterunt aquae descendentes in uno loco et instar montis intumescentes apparebant procul ab urbe quae vocatur Adom usque ad locum Sarthan quae autem inferiores erant in mare Solitudinis quod nunc vocatur Mortuum descenderunt usquequo omnino deficerent"
      en: "The waters that came down from above stood in one place, and swelling up like a mountain, were seen afar off from the city that is called Adom, to the place of Sarthan: but those that were beneath, ran down into the sea of the wilderness (which now is called the Dead Sea) until they wholly failed."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "populus autem incedebat contra Iordanem et sacerdotes qui portabant arcam foederis Domini stabant super siccam humum in medio Iordanis accincti omnisque populus per arentem alveum transiebat"
      en: "And the people marched over against Jericho: and the priests that carried the ark of the covenant of the Lord, stood girded upon the dry ground in the midst of the Jordan, and all the people passed over through the channel that was dried up."
    status: { la: verified, en: verified }
