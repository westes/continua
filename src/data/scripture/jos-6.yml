# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 6
verses:
  - n: 1
    text:
      la: "Jericho autem clausa erat atque munita, timore filiorum Israel, et nullus egredi audebat aut ingredi."
      en: "Now Jericho was close shut up and fenced, for fear of the children of Israel, and no man durst go out or come in."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixitque Dominus ad Josue: Ecce dedi in manu tua Jericho, et regem ejus, omnesque fortes viros."
      en: "And the Lord said to Josue: Behold I have given into thy hands Jericho, and the king thereof, and all the valiant men."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Circuite urbem cuncti bellatores semel per diem: sic facietis sex diebus."
      en: "Go round about the city, all ye fighting men, once a day: so shall ye do for six days."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Septimo autem die, sacerdotes tollant septem buccinas, quarum usus est in jubilaeo, et praecedant arcam foederis: septiesque circuibitis civitatem, et sacerdotes clangent buccinis."
      en: "And on the seventh day the priests shall take the seven trumpets, which are used in the jubilee, and shall go before the ark of the covenant: and you shall go about the city seven times, and the priests shall sound the trumpets."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque insonuerit vox tubae longior atque concisior, et in auribus vestris increpuerit, conclamabit omnis populus vociferatione maxima, et muri funditus corruent civitatis, ingredienturque singuli per locum contra quem steterint."
      en: "And when the voice of the trumpet shall give a longer and broken tune, and shall sound in your ears, all the people shall shout together with a very great shout, and the walls of the city shall fall to the ground, and they shall enter in every one at the place against which they shall stand."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Vocavit ergo Josue filius Nun sacerdotes, et dixit ad eos: Tollite arcam foederis: et septem alii sacerdotes tollant septem jubilaeorum buccinas, et incedant ante arcam Domini."
      en: "Then Josue the son of Nun called the priests, and said to them: Take the ark of the covenant: and let seven other priests take the seven trumpets of the jubilee, and march before the ark of the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ad populum quoque ait: Ite, et circuite civitatem, armati, praecedentes arcam Domini."
      en: "And he said to the people: Go, and compass the city, armed, marching before the ark of the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque Josue verba finisset, et septem sacerdotes septem buccinis clangerent ante arcam foederis Domini,"
      en: "And when Josue had ended his words, and the seven priests blew the seven trumpets before the ark of the covenant of the Lord,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "omnisque praecederet armatus exercitus, reliquum vulgus arcam sequebatur, ac buccinis omnia concrepabant."
      en: "And all the armed men went before, the rest of the common people followed the ark, and the sound of the trumpets was heard on all sides."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Praeceperat autem Josue populo, dicens: Non clamabitis, nec audietur vox vestra, neque ullus sermo ex ore vestro egredietur, donec veniat dies in quo dicam vobis: Clamate, et vociferamini."
      en: "But Josue had commanded the people, saying: You shall not shout, nor shall your voice be heard, nor any word go out of your mouth: until the day come wherein I shall say to you: Cry, and shout."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Circuivit ergo arca Domini civitatem semel per diem, et reversa in castra mansit ibi."
      en: "So the ark of the Lord went about the city once a day, and returning into the camp, abode there."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Igitur Josue de nocte consurgente, tulerunt sacerdotes arcam Domini,"
      en: "And Josue rising before day, the priests took the ark of the Lord,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et septem ex eis septem buccinas, quarum in jubilaeo usus est: praecedebantque arcam Domini ambulantes atque clangentes: et armatus populus ibat ante eos, vulgus autem reliquum sequebatur arcam, et buccinis personabat."
      en: "And seven of them seven trumpets, which are used in the jubilee: and they went before the ark of the Lord walking and sounding the trumpets: and the armed men went before them, and the rest of the common people followed the ark, and they blew the trumpets."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Circuieruntque civitatem secundo die semel, et reversi sunt in castra. Sic fecerunt sex diebus."
      en: "And they went round about the city the second day once, and returned into the camp. So they did six days."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dies autem septimo, diluculo consurgentes, circuierunt urbem, sicut dispositum erat, septies."
      en: "But the seventh day, rising up early, they went about the city, as it was ordered, seven times."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cumque septimo circuitu clangerent buccinis sacerdotes, dixit Josue ad omnem Israel: Vociferamini: tradidit enim vobis Dominus civitatem:"
      en: "And when in the seventh going about the priests sounded with the trumpets, Josue said to all Israel: Shout: for the Lord hath delivered the city to you:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sitque civitas haec anathema, et omnia quae in ea sunt, Domino: sola Rahab meretrix vivat cum universis, qui cum ea in domo sunt: abscondit enim nuntios quos direximus."
      en: "And let this city be an anathema, and all things that are in it, to the Lord. Let only Rahab the harlot live, with all that are with her in the house: for she hid the messengers whom we sent."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vos autem cavete ne de his, quae praecepta sunt, quippiam contingatis, et sitis praevaricationis rei, et omnia castra Israel sub peccato sint atque turbentur."
      en: "But beware ye lest you touch ought of those things that are forbidden, and you be guilty of transgression, and all the camp of Israel be under sin, and be troubled."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quidquid autem auri et argenti fuerit, et vasorum aeneorum ac ferri, Domino consecretur, repositum in thesauris ejus."
      en: "But whatsoever gold or silver there shall be, or vessels of brass and iron, let it be consecrated to the Lord, laid up in his treasures."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Igitur omni populo vociferante, et clangentibus tubis, postquam in aures multitudinis vox sonitusque increpuit, muri illico corruerunt: et ascendit unusquisque per locum, qui contra se erat: ceperuntque civitatem,"
      en: "So all the people making a shout, and the trumpets sounding, when the voice and the sound thundered in the ears of the multitude, the walls forthwith fell down: and every man went up by the place that was over against him: and they took the city,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et interfecerunt omnia quae erant in ea, a viro usque ad mulierem, ab infante usque ad senem. Boves quoque et oves et asinos in ore gladii percusserunt."
      en: "And killed all that were in it, man and woman, young and old. The oxen also and the sheep, and the asses, they slew with the edge of the sword."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Duobus autem viris, qui exploratores missi fuerant, dixit Josue: Ingredimini domum mulieris meretricis, et producite eam, et omnia quae illius sunt, sicut illi juramento firmastis."
      en: "But Josue said to the two men that had been sent for spies: Go into the harlot's house, and bring her out, and all things that are hers, as you assured her by oath."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ingressique juvenes eduxerunt Rahab, et parentes ejus, fratres quoque, et cunctam supellectilem ac cognationem illius, et extra castra Israel manere fecerunt."
      en: "And the young men went in and brought out Rahab, and her parents, her brethren also and all her goods and her kindred, and made them to stay without the camp."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Urbem autem, et omnia quae erant in ea, succenderunt, absque auro et argento, et vasis aeneis, ac ferro, quae in aerarium Domini consecrarunt."
      en: "But they burned the city, and all things that were therein; except the gold and silver, and vessels of brass and iron, which they consecrated into the treasury of the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Rahab vero meretricem, et domum patris ejus, et omnia quae habebat, fecit Josue vivere, et habitaverunt in medio Israel, usque in praesentem diem: eo quod absconderit nuntios, quos miserat ut explorarent Jericho. In tempore illo, imprecatus est Josue, dicens:"
      en: "But Josue saved Rahab the harlot and her father's house, and all she had, and they dwelt in the midst of Israel until this present day: because she hid the messengers whom he had sent to spy out Jericho. At that time, Josue made an imprecation, saying:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Maledictus vir coram Domino, qui suscitaverit et aedificaverit civitatem Jericho. In primogenito suo fundamenta illius jaciat, et in novissimo liberorum ponat portas ejus."
      en: "Cursed be the man before the Lord, that shall raise up and build the city of Jericho. In his firstborn may he lay the foundation thereof, and in the last of his children set up its gates."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Fuit ergo Dominus cum Josue, et nomen ejus vulgatum est in omni terra."
      en: "And the Lord was with Josue, and his name was noised throughout all the land."
    status: { la: verified, en: verified }
