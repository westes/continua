# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 49
verses:
  - n: 1
    text:
      la: "Vocavit autem Jacob filios suos, et ait eis: Congregamini, ut annuntiem quae ventura sunt vobis in diebus novissimis."
      en: "And Jacob called his sons, and said to them: Gather yourselves together that I may tell you the things that shall befall you in the last days."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Congregamini, et audite, filii Jacob, audite Israel patrem vestrum:"
      en: "Gather yourselves together, and hear, O ye sons of Jacob, hearken to Israel your father:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ruben, primogenitus meus, tu fortitudo mea, et principium doloris mei; prior in donis, major in imperio."
      en: "Ruben, my firstborn, thou art my strength, and the beginning of my sorrow: excelling in gifts, greater in command."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Effusus es sicut aqua, non crescas: quia ascendisti cubile patris tui, et maculasti stratum ejus."
      en: "Thou art poured out as water, grow thou not: because thou wentest up to thy father's bed, and didst defile his couch."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Simeon et Levi fratres vasa iniquitatis bellantia."
      en: "Simeon and Levi brethren: vessels of iniquity, waging war."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In consilium eorum non veniat anima mea, et in coetu illorum non sit gloria mea: quia in furore suo occiderunt virum, et in voluntate sua suffoderunt murum."
      en: "Let not my soul go into their counsel, nor my glory be in their assembly: because in their fury they slew a man, and in their selfwill they undermined a wall."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Maledictus furor eorum, quia pertinax: et indignatio eorum, quia dura: dividam eos in Jacob, et dispergam eos in Israel."
      en: "Cursed be their fury, because it was stubborn: and their wrath because it was cruel: I will divide them in Jacob, and will scatter them in Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Juda, te laudabunt fratres tui: manus tua in cervicibus inimicorum tuorum, adorabunt te filii patris tui."
      en: "Juda, thee shall thy brethren praise: thy hands shall be on the necks of thy enemies: the sons of thy father shall bow down to thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Catulus leonis Juda: ad praedam, fili mi, ascendisti: requiescens accubuisti ut leo, et quasi leaena: quis suscitabit eum?"
      en: "Juda is a lion's whelp: to the prey, my son, thou art gone up: resting thou hast couched as a lion, and as a lioness, who shall rouse him?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Non auferetur sceptrum de Juda, et dux de femore ejus, donec veniat qui mittendus est, et ipse erit expectatio gentium."
      en: "The sceptre shall not be taken away from Juda, nor a ruler from his thigh, till he come that is to be sent, and he shall be the expectation of nations."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ligans ad vineam pullum suum, et ad vitem, o fili mi, asinam suam, lavabit in vino stolam suam et in sanguine uvae pallium suum."
      en: "Tying his foal to the vineyard, and his ass, O my son, to the vine. He shall wash his robe in wine, and his garment in the blood of the grape."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Pulchriores sunt oculi ejus vino, et dentes ejus lacte candidiores."
      en: "His eyes are more beautiful than wine, and his teeth whiter than milk."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Zabulon in littore maris habitabit, et in statione navium pertingens usque ad Sidonem."
      en: "Zabulon shall dwell on the sea shore, and in the road of ships, reaching as far as Sidon."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Issachar asinus fortis accubans inter terminos."
      en: "Issachar shall be a strong ass lying down between the borders."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vidit requiem, quod esset bona et terram, quod optima: et supposuit humerum suum ad portandum, factusque est tributis serviens."
      en: "He saw rest that it was good: and the land that it was excellent: and he bowed his shoulder to carry, and became a servant under tribute."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dan judicabit populum suum sicut et alia tribus in Israel."
      en: "Dan shall judge his people like another tribe in Israel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Fiat Dan coluber in via, cerastes in semita, mordens ungulas equi, ut cadat ascensor ejus retro."
      en: "Let Dan be a snake in the way, a serpent in the path, that biteth the horse's heels that his rider may fall backward."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Salutare tuum expectabo, Domine."
      en: "I will look for thy salvation, O Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Gad, accinctus praeliabatur ante eum: et ipse accingetur retrorsum."
      en: "Gad, being girded, shall fight before him: and he himself shall be girded backward."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Aser, pinguis panis ejus, et praebebit delicias regibus."
      en: "Aser, his bread shall be fat, and he shall yield dainties to kings."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Nephthali, cervus emissus, et dans eloquia pulchritudinis."
      en: "Nephtali, a hart let loose, and giving words of beauty."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Filius accrescens Joseph, filius accrescens et decorus aspectu: filiae discurrerunt super murum."
      en: "Joseph is a growing son, a growing son and comely to behold; the daughters run to and fro upon the wall."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Sed exasperaverunt eum et jurgati sunt, invideruntque illi habentes jacula."
      en: "But they that held darts provoked him, and quarrelled with him, and envied him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Sedit in forti arcus ejus, et dissoluta sunt vincula brachiorum et manuum illius per manus potentis Jacob: inde pastor egressus est, lapis Israel."
      en: "His bow rested upon the strong, and the bands of his arms and his hands were loosed, by the hands of the mighty one of Jacob: thence he came forth a pastor, the stone of Israel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Deus patris tui erit adjutor tuus, et omnipotens benedicet tibi benedictionibus caeli desuper, benedictionibus abyssi jacentis deorsum, benedictionibus uberum et vulvae."
      en: "The God of thy father shall be thy helper, and the Almighty shall bless thee with the blessings of heaven above, with the blessings of the deep that lieth beneath, with the blessings of the breasts and of the womb."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Benedictiones patris tui confortatae sunt benedictionibus patrum ejus, donec veniret desiderium collium aeternorum: fiant in capite Joseph, et in vertice Nazaraei inter fratres suos."
      en: "The blessings of thy father are strengthened with the blessings of his fathers: until the desire of the everlasting hills should come; may they be upon the head of Joseph, and upon the crown of the Nazarite among his brethren."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Benjamin lupus rapax, mane comedat praedam, et vespere dividet spolia."
      en: "Benjamin a ravenous wolf, in the morning shall eat the prey, and in the evening shall divide the spoil."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Omnes hi in tribubus Israel duodecim: haec locutus est eis pater suus, benedixitque singulis benedictionibus propriis."
      en: "All these are the twelve tribes of Israel: these things their father spoke to them, and he blessed every one, with their proper blessings."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et praecepit eis, dicens: Ego congregor ad populum meum: sepelite me cum patribus meis in spelunca duplici quae est in agro Ephron Hethaei,"
      en: "And he charged them, saying: I am now going to be gathered to my people: bury me with my fathers in the double cave, which is in the field of Ephron the Hethite,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "contra Mambre in terra Chanaan, quam emit Abraham cum agro ab Ephron Hethaeo in possessionem sepulchri."
      en: "Over against Mambre in the land of Chanaan, which Abraham bought together with the field of Ephron the Hethite for a possession to bury in."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ibi sepelierunt eum, et Saram uxorem ejus: ibi sepultus est Isaac cum Rebecca conjuge sua: ibi et Lia condita jacet."
      en: "There they buried him, and Sara his wife: there was Isaac buried with Rebecca his wife: there also Lia doth lie buried."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Finitisque mandatis quibus filios instruebat, collegit pedes suos super lectulum, et obiit: appositusque est ad populum suum."
      en: "And when he had ended the commandments, wherewith he instructed his sons, he drew up his feet upon the bed, and died: and he was gathered to his people."
    status: { la: verified, en: verified }
