# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 13
verses:
  - n: 1
    text:
      la: "In die illa erit fons patens domui David et habitantibus Jerusalem, in ablutionem peccatoris et menstruatae."
      en: "In that day there shall be a fountain open to the house of David, and to the inhabitants of Jerusalem: for the washing of the sinner, and of the unclean woman."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et erit in die illa, dicit Dominus exercituum: disperdam nomina idolorum de terra, et non memorabuntur ultra: et pseudoprophetas, et spiritum immundum auferam de terra."
      en: "And it shall come to pass in that day, saith the Lord of hosts, that I will destroy the names of idols out of the earth, and they shall be remembered no more: and I will take away the false prophets, and the unclean spirit out of the earth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et erit: cum prophetaverit quispiam ultra, dicent ei pater ejus et mater ejus, qui genuerunt eum: Non vives, quia mendacium locutus es in nomine Domini: et configent eum pater ejus et mater ejus, genitores ejus, cum prophetaverit."
      en: "And it shall come to pass, that when any man shall prophesy any more, his father and his mother that brought him into the world, shall say to him: Thou shalt not live: because thou hast spoken a lie in the name of the Lord. And his father, and his mother, his parents, shall thrust him through, when he shall prophesy."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et erit: in die illa confundentur prophetae, unusquisque ex visione sua cum prophetaverit: nec operientur pallio saccino, ut mentiantur:"
      en: "And it shall come to pass in that day, that the prophets shall be confounded, every one by his own vision, when he shall prophesy, neither shall they be clad with a garment of sackcloth, to deceive:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sed dicet: Non sum propheta: homo agricola ego sum, quoniam Adam exemplum meum ab adolescentia mea."
      en: "But he shall say: I am no prophet, I am a husbandman: for Adam is my example from my youth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dicetur ei: Quid sunt plagae istae in medio manuum tuarum? Et dicet: His plagatus sum in domo eorum qui diligebant me."
      en: "And they shall say to him: What are these wounds in the midst of thy hands? And he shall say: With these I was wounded in the house of them that loved me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Framea, suscitare super pastorem meum, et super virum cohaerentem mihi, dicit Dominus exercituum: percute pastorem, et dispergentur oves: et convertam manum meam ad parvulos."
      en: "Awake, O sword, against my shepherd, and against the man that cleaveth to me, saith the Lord of hosts: strike the shepherd, and the sheep shall be scattered: and I will turn my hand to the little ones."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et erunt in omni terra, dicit Dominus: partes duae in ea dispergentur, et deficient: et tertia pars relinquetur in ea."
      en: "And there shall be in all the earth, saith the Lord, two parts in it shall be scattered, and shall perish: but the third part shall be left therein."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ducam tertiam partem per ignem, et uram eos sicut uritur argentum, et probabo eos sicut probatur aurum. Ipse vocabit nomen meum, et ego exaudiam eum. Dicam: Populus meus es: et ipse dicet: Dominus Deus meus."
      en: "And I will bring the third part through the fire, and will refine them as silver is refined: and I will try them as gold is tried. They shall call on my name, and I will hear them. I will say: Thou art my people: and they shall say: The Lord is my God."
    status: { la: verified, en: verified }
