# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 14
verses:
  - n: 1
    text:
      la: "Et vidi: et ecce Agnus stabat supra montem Sion, et cum eo centum quadraginta quatuor millia, habentes nomen ejus, et nomen Patris ejus scriptum in frontibus suis."
      en: "And I beheld, and lo a lamb stood upon mount Sion, and with him an hundred forty-four thousand, having his name, and the name of his Father, written on their foreheads."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et audivi vocem de caelo, tamquam vocem aquarum multarum, et tamquam vocem tonitrui magni: et vocem, quam audivi, sicut citharoedorum citharizantium in citharis suis."
      en: "And I heard a voice from heaven, as the noise of many waters, and as the voice of great thunder; and the voice which I heard, was as the voice of harpers, harping on their harps."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et cantabant quasi canticum novum ante sedem, et ante quatuor animalia, et seniores: et nemo poterat dicere canticum, nisi illa centum quadraginta quatuor millia, qui empti sunt de terra."
      en: "And they sung as it were a new canticle, before the throne, and before the four living creatures, and the ancients; and no man could say the canticle, but those hundred forty-four thousand, who were purchased from the earth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Hi sunt, qui cum mulieribus non sunt coinquinati: virgines enim sunt. Hi sequuntur Agnum quocumque ierit. Hi empti sunt ex hominibus primitiae Deo, et Agno:"
      en: "These are they who were not defiled with women: for they are virgins. These follow the Lamb whithersoever he goeth. These were purchased from among men, the firstfruits to God and to the Lamb:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et in ore eorum non est inventum mendacium: sine macula enim sunt ante thronum Dei."
      en: "And in their mouth there was found no lie; for they are without spot before the throne of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et vidi alterum angelum volantem per medium caeli, habentem Evangelium aeternum, ut evangelizaret sedentibus super terram, et super omnem gentem, et tribum, et linguam, et populum:"
      en: "And I saw another angel flying through the midst of heaven, having the eternal gospel, to preach unto them that sit upon the earth, and over every nation, and tribe, and tongue, and people:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dicens magna voce: Timete Dominum, et date illi honorem, quia venit hora judicii ejus: et adorate eum, qui fecit caelum, et terram, mare, et fontes aquarum."
      en: "Saying with a loud voice: Fear the Lord, and give him honour, because the hour of his judgment is come; and adore ye him, that made heaven and earth, the sea, and the fountains of waters."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et alius angelus secutus est dicens: Cecidit, cecidit Babylon illa magna: quae a vino irae fornicationis suae potavit omnes gentes."
      en: "And another angel followed, saying: That great Babylon is fallen, is fallen; which made all nations to drink of the wine of the wrath of her fornication."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et tertius angelus secutus est illos, dicens voce magna: Si quis adoraverit bestiam, et imaginem ejus, et acceperit caracterem in fronte sua, aut in manu sua:"
      en: "And the third angel followed them, saying with a loud voice: If any man shall adore the beast and his image, and receive his character in his forehead, or in his hand;"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et hic bibet de vino irae Dei, quod mistum est mero in calice irae ipsius, et cruciabitur igne, et sulphure in conspectu angelorum sanctorum, et ante conspectum Agni:"
      en: "He also shall drink of the wine of the wrath of God, which is mingled with pure wine in the cup of his wrath, and shall be tormented with fire and brimstone in the sight of the holy angels, and in the sight of the Lamb."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et fumus tormentorum eorum ascendet in saecula saeculorum: nec habent requiem die ac nocte, qui adoraverunt bestiam, et imaginem ejus, et si quis acceperit caracterem nominis ejus."
      en: "And the smoke of their torments shall ascend up for ever and ever: neither have they rest day nor night, who have adored the beast, and his image, and whoever receiveth the character of his name."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Hic patientia sanctorum est, qui custodiunt mandata Dei, et fidem Jesu."
      en: "Here is the patience of the saints, who keep the commandments of God, and the faith of Jesus."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et audivi vocem de caelo, dicentem mihi: Scribe: Beati mortui qui in Domino moriuntur. Amodo jam dicit Spiritus, ut requiescant a laboribus suis: opera enim illorum sequuntur illos."
      en: "And I heard a voice from heaven, saying to me: Write: Blessed are the dead, who die in the Lord. From henceforth now, saith the Spirit, that they may rest from their labours; for their works follow them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et vidi: et ecce nubem candidam, et super nubem sedentem similem Filio hominis, habentem in capite suo coronam auream, et in manu sua falcem acutam."
      en: "And I saw, and behold a white cloud; and upon the cloud one sitting like to the Son of man, having on his head a crown of gold, and in his hand a sharp sickle."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et alius angelus exivit de templo, clamans voce magna ad sedentem super nubem: Mitte falcem tuam, et mete, quia venit hora ut metatur, quoniam aruit messis terrae."
      en: "And another angel came out from the temple crying with a loud voice to him that sat upon the cloud: Thrust in thy sickle, and reap, because the hour is come to reap: for the harvest of the earth is ripe."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et misit qui sedebat super nubem, falcem suam in terram, et demessa est terra."
      en: "And he that sat on the cloud thrust his sickle into the earth, and the earth was reaped."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et alius angelus exivit de templo, quod est in caelo, habens et ipse falcem acutam."
      en: "And another angel came out of the temple which is in heaven, he also having a sharp sickle."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et alius angelus exivit de altari, qui habebat potestatem supra ignem: et clamavit voce magna ad eum qui habebat falcem acutam, dicens: Mitte falcem tuam acutam, et vindemia botros vineae terrae: quoniam maturae sunt uvae ejus."
      en: "And another angel came out from the altar, who had power over fire; and he cried with a loud voice to him that had the sharp sickle, saying: Thrust in thy sharp sickle, and gather the clusters of the vineyard of the earth; because the grapes thereof are ripe."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et misit angelus falcem suam acutam in terram, et vindemiavit vineam terrae, et misit in lacum irae Dei magnum:"
      en: "And the angel thrust in his sharp sickle into the earth, and gathered the vineyard of the earth, and cast it into the great press of the wrath of God:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et calcatus est lacus extra civitatem, et exivit sanguis de lacu usque ad frenos equorum per stadia mille sexcenta."
      en: "And the press was trodden without the city, and blood came out of the press, up to the horses' bridles, for a thousand and six hundred furlongs."
    status: { la: verified, en: verified }
