# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 10
verses:
  - n: 1
    text:
      la: "In tempore illo dixit Dominus ad me: Dola tibi duas tabulas lapideas, sicut priores fuerunt, et ascende ad me in montem: faciesque arcam ligneam,"
      en: "At that time the Lord said to me: Hew thee two tables of stone like the former, and come up to me into the mount: and thou shalt make an ark of wood,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et scribam in tabulis verba quae fuerunt in his qui ante confregisti: ponesque eas in arca."
      en: "And I will write on the tables the words that were in them, which thou brokest before, and thou shalt put them in the ark."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Feci igitur arcam de lignis setim. Cumque dolassem duas tabulas lapideas instar priorum, ascendi in montem, habens eas in manibus."
      en: "And I made an ark of setim wood And when I had hewn two tables of stone like the former, I went up into the mount, having them in my hands."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Scripsitque in tabulis, juxta id quod prius scripserat, verba decem, quae locutus est Dominus ad vos in monte de medio ignis, quando populus congregatus est: et dedit eas mihi."
      en: "And he wrote in the tables, according as he had written before, the ten words, which the Lord spoke to you in the mount from the midst of the fire, when the people were assembled: and he gave them to me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Reversusque de monte, descendi, et posui tabulas in arcam, quam feceram, quae hucusque ibi sunt, sicut mihi praecepit Dominus."
      en: "And returning from the mount, I came down, and put the tables into the ark, that I had made, and they are there till this present, as the Lord commanded me."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Filii autem Israel moverunt castra ex Beroth filiorum Jacan in Mosera, ubi Aaron mortuus ac sepultus est, pro quo sacerdotio functus est Eleazar filius ejus."
      en: "And the children of Israel removed their camp from Beroth of the children of Jacan into Mosera, where Aaron died and was buried, and Eleazar his son succeeded him in the priestly office."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Inde venerunt in Gadgad: de quo loco profecti, castrametati sunt in Jetebatha, in terra aquarum atque torrentium."
      en: "From thence they came to Gadgad, from which place they departed, and camped in Jetebatha, in a land of waters and torrents."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Eo tempore separavit tribum Levi, ut portaret arcam foederis Domini, et staret coram eo in ministerio, ac benediceret in nomine illius usque in praesentem diem."
      en: "At that time he separated the tribe of Levi, to carry the ark of the covenant of the Lord, and to stand before him in the ministry, and to bless in his name until this present day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quam ob rem non habuit Levi partem, neque possessionem cum fratribus suis: quia ipse Dominus possessio ejus est, sicut promisit ei Dominus Deus tuus."
      en: "Wherefore Levi hath no part nor possession with his brethren: because the Lord himself is his possession, as the Lord thy God promised him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ego autem steti in monte, sicut prius, quadraginta diebus ac noctibus: exaudivitque me Dominus etiam hac vice, et te perdere noluit."
      en: "And I stood in the mount, as before, forty days and nights: and the Lord heard me this time also, and would not destroy thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dixitque mihi: Vade, et praecede populum, ut ingrediatur, et possideat terram, quam juravi patribus eorum ut traderem eis."
      en: "And he said to me: Go, and walk before the people, that they may enter, and possess the land, which I swore to their fathers that I would give them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et nunc Israel, quid Dominus Deus tuus petit a te, nisi ut timeas Dominum Deum tuum, et ambules in viis ejus, et diligas eum, ac servias Domino Deo tuo in toto corde tuo, et in tota anima tua:"
      en: "And now, Israel, what doth the Lord thy God require of thee, but that thou fear the Lord thy God, and walk in his ways, and love him, and serve the Lord thy God, with all thy heart, and with all thy soul:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "custodiasque mandata Domini, et caeremonias ejus, quas ego hodie praecipio tibi, ut bene sit tibi?"
      en: "And keep the commandments of the Lord, and his ceremonies, which I command thee this day, that it may be well with thee?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "En Domini Dei tui caelum est, et caelum caeli, terra, et omnia quae in ea sunt:"
      en: "Behold heaven is the Lord's thy God, and the heaven of heaven, the earth and all things that are therein."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et tamen patribus tuis conglutinatus est Dominus, et amavit eos, elegitque semen eorum post eos, id est, vos, de cunctis gentibus, sicut hodie comprobatur."
      en: "And yet the Lord hath been closely joined to thy fathers, and loved them and chose their seed after them, that is to say, you, out of all nations, as this day it is proved."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Circumcidite igitur praeputium cordis vestri, et cervicem vestram ne induretis amplius:"
      en: "Circumcise therefore the foreskin of your heart, and stiffen your neck no more."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quia Dominus Deus vester ipse est Deus deorum, et Dominus dominantium, Deus magnus, et potens, et terribilis, qui personam non accipit, nec munera."
      en: "Because the Lord your God he is the God of gods, and the Lord of lords, a great God and mighty and terrible, who accepteth no person nor taketh bribes."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Facit judicium pupillo et viduae; amat peregrinum, et dat ei victum atque vestitum."
      en: "He doth judgment to the fatherless and the widow, loveth the stranger, and giveth him food and raiment."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et vos ergo amate peregrinos, quia et ipsi fuistis advenae in terra Aegypti."
      en: "And do you therefore love strangers, because you also were strangers in the land of Egypt."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dominum Deum tuum timebis, et ei soli servies: ipsi adhaerebis, jurabisque in nomine illius."
      en: "Thou shalt fear the Lord thy God, and serve him only: to him thou shalt adhere, and shalt swear by his name."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ipse est laus tua, et Deus tuus, qui fecit tibi haec magnalia et terribilia, quae viderunt oculi tui."
      en: "He is thy praise, and thy God, that hath done for thee these great and terrible things, which thy eyes have seen."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "In septuaginta animabus descenderunt patres tui in Aegyptum, et ecce nunc multiplicavit te Dominus Deus tuus sicut astra caeli."
      en: "In seventy souls thy fathers went down into Egypt: and behold now the Lord thy God hath multiplied thee as the stars of heaven."
    status: { la: verified, en: verified }
