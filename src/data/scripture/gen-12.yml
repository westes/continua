# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 12
verses:
  - n: 1
    text:
      la: "Dixit autem Dominus ad Abram: Egredere de terra tua, et de cognatione tua, et de domo patris tui, et veni in terram quam monstrabo tibi."
      en: "And the Lord said to Abram: Go forth out of thy country, and from thy kindred, and out of thy father's house, and come into the land which I shall shew thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Faciamque te in gentem magnam, et benedicam tibi, et magnificabo nomen tuum, erisque benedictus."
      en: "And I will make of thee a great nation, and I will bless thee, and magnify thy name, and thou shalt be blessed."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Benedicam benedicentibus tibi, et maledicam maledicentibus tibi, atque in te benedicentur universae cognationes terrae."
      en: "I will bless them that bless thee, and curse them that curse thee, and IN THEE shall all the kindred of the earth be blessed:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Egressus est itaque Abram sicut praeceperat ei Dominus, et ivit cum eo Lot: septuaginta quinque annorum erat Abram cum egrederetur de Haran."
      en: "So Abram went out as the Lord had commanded him, and Lot went with him: Abram was seventy-five years old when he went forth from Haran."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tulitque Sarai uxorem suam, et Lot filium fratris sui, universamque substantiam quam possederant, et animas quas fecerant in Haran: et egressi sunt ut irent in terram Chanaan. Cumque venissent in eam,"
      en: "And he took Sarai his wife, and Lot his brother's son, and all the substance which they had gathered, and the souls which they had gotten in Haran: and they went out to go into the land of Chanaan. And when they were come into it,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "pertransivit Abram terram usque ad locum Sichem, usque ad convallem illustrem: Chananaeus autem tunc erat in terra."
      en: "Abram passed through the country into the place of Sichem, as far as the noble vale: now the Chanaanite was at that time in the land."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Apparuit autem Dominus Abram, et dixit ei: Semini tuo dabo terram hanc. Qui aedificavit ibi altare Domino, qui apparuerat ei."
      en: "And the Lord appeared to Abram, and said to him: To thy seed will I give this land. And he built there an altar to the Lord, who had appeared to him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et inde transgrediens ad montem, qui erat contra orientem Bethel, tetendit ibi tabernaculum suum, ab occidente habens Bethel, et ab oriente Hai: aedificavit quoque ibi altare Domino, et invocavit nomen ejus."
      en: "And passing on from thence to a mountain, that was on the east side of Bethel, he there pitched his tent, having Bethel on the west, and Hai on the east; he built there also an altar to the Lord, and called upon his name."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Perrexitque Abram vadens, et ultra progrediens ad meridiem."
      en: "And Abram went forward, going, and proceeding on to the south."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Facta est autem fames in terra: descenditque Abram in Aegyptum, ut peregrinaretur ibi: praevaluerat enim fames in terra."
      en: "And there came a famine in the country; and Abram went down into Egypt, to sojourn there: for the famine was very grievous in the land."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque prope esset ut ingrederetur Aegyptum, dixit Sarai uxori suae: Novi quod pulchra sis mulier:"
      en: "And when he was near to enter into Egypt, he said to Sarai his wife: I know that thou art a beautiful woman:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et quod cum viderint te Aegyptii, dicturi sunt: Uxor ipsius est: et interficient me, et te reservabunt."
      en: "And that when the Egyptians shall see thee, they will say: She is his wife: and they will kill me, and keep thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dic ergo, obsecro te, quod soror mea sis: ut bene sit mihi propter te, et vivat anima mea ob gratiam tui."
      en: "Say, therefore, I pray thee, that thou art my sister: that I may be well used for thee, and that my soul may live for thy sake."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cum itaque ingressus esset Abram Aegyptum, viderunt Aegyptii mulierem quod esset pulchra nimis."
      en: "And when Abram was come into Egypt, the Egyptians saw the woman that she was very beautiful."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et nuntiaverunt principes Pharaoni, et laudaverunt eam apud illum: et sublata est mulier in domum Pharaonis."
      en: "And the princes told Pharao, and praised her before him: and the woman was taken into the house of Pharao."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Abram vero bene usi sunt propter illam: fueruntque ei oves et boves et asini, et servi et famulae, et asinae et cameli."
      en: "And they used Abram well for her sake. And he had sheep and oxen, and he asses, and men servants and maid servants, and she asses, and camels."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Flagellavit autem Dominus Pharaonem plagis maximis, et domum ejus, propter Sarai uxorem Abram."
      en: "But the Lord scourged Pharao and his house with most grievous stripes for Sarai, Abram's wife."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vocavitque Pharao Abram, et dixit ei: Quidnam est hoc quod fecisti mihi? quare non indicasti quod uxor tua esset?"
      en: "And Pharao called Abram, and said to him: What is this that thou hast done to me? Why didst thou not tell me that she was thy wife?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quam ob causam dixisti esse sororem tuam, ut tollerem eam mihi in uxorem? Nunc igitur ecce conjux tua, accipe eam, et vade."
      en: "For what cause didst thou say, she was thy sister, that I might take her to my wife? Now, therefore, there is thy wife, take her, and go thy way."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Praecepitque Pharao super Abram viris: et deduxerunt eum, et uxorem illius, et omnia quae habebat."
      en: "And Pharao gave his men orders concerning Abram: and they led him away, and his wife, and all that he had."
    status: { la: verified, en: verified }
