# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 24
verses:
  - n: 1
    text:
      la: "Ostendit mihi Dominus: et ecce duo calathi pleni ficis, positi ante templum Domini, postquam transtulit Nabuchodonosor rex Babylonis Jechoniam filium Joakim, regem Juda, et principes ejus, et fabrum, et inclusorem, de Jerusalem, et adduxit eos in Babylonem."
      en: "The Lord shewed me: and behold two baskets full of figs, set before the temple of the Lord: after that Nabuchodonosor king of Babylon had carried away Jechonias the son of Joakim the king of Juda, and his chief men, and the craftsmen, and engravers of Jerusalem, and had brought them to Babylon."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Calathus unus ficus bonas habebat nimis, ut solent ficus esse primi temporis: et calathus unus ficus habebat malas nimis, quae comedi non poterant eo quod essent malae."
      en: "One basket had very good figs, like the figs of the first season: and the other basket had very bad figs, which could not be eaten, because they were bad."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dixit Dominus ad me: Quid tu vides, Jeremia? Et dixi: Ficus, ficus bonas, bonas valde: et malas, malas valde, quae comedi non possunt eo quod sint malae."
      en: "And the Lord said to me: What seest thou, Jeremias? And I said: Figs, the good figs, very good: and the bad figs, very bad, which cannot be eaten because they are bad."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Haec dicit Dominus Deus Israel: Sicut ficus hae bonae, sic cognoscam transmigrationem Juda, quam emisi de loco isto in terram Chaldaeorum, in bonum."
      en: "Thus saith the Lord the God of Israel: Like these good figs, so will I regard the captives of Juda, whom I have sent forth out of this place into the land of the Chaldeans, for their good."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ponam oculos meos super eos ad placandum, et reducam eos in terram hanc: et aedificabo eos, et non destruam: et plantabo eos, et non evellam."
      en: "And I will set my eyes upon them to be pacified, and I will bring them again into this land: and I will build them up, and not pull them down: and I will plant them, and not pluck them up."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et dabo eis cor ut sciant me, quia ego sum Dominus: et erunt mihi in populum, et ego ero eis in Deum, quia revertentur ad me in toto corde suo."
      en: "And I will give them a heart to know me, that I am the Lord: and they shall be my people, and I will be their God: because they shall return to me with their whole heart."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et sicut ficus pessimae quae comedi non possunt, eo quod sint malae: haec dicit Dominus: sic dabo Sedeciam, regem Juda, et principes ejus, et reliquos de Jerusalem, qui remanserunt in urbe hac, et qui habitant in terra Aegypti."
      en: "And as the very bad figs, that cannot be eaten, because they are bad: thus saith the Lord: So will I give Sedecias the king of Juda, and his princes, and the residue of Jerusalem, that have remained in this city, and that dwell in the land of Egypt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dabo eos in vexationem, afflictionemque omnibus regnis terrae, in opprobrium, et in parabolam, et in proverbium, et in maledictionem in universis locis ad quae ejeci eos."
      en: "And I will deliver them up to vexation, and affliction, to all the kingdoms of the earth: to be a reproach, and a byword, and a proverb, and to be a curse in all places, to which I have cast them out."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et mittam in eis gladium, et famem, et pestem, donec consumantur de terra quam dedi eis et patribus eorum."
      en: "And I will send among them the sword, and the famine, and the pestilence: till they be consumed out of the land which I gave to them, and their fathers."
    status: { la: verified, en: verified }
