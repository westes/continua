# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 39
verses:
  - n: 1
    text:
      la: "Sapientiam omnium antiquorum exquiret sapiens, et in prophetis vacabit."
      en: "The wise men will seek out the wisdom of all the ancients, and will be occupied in the prophets."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Narrationem virorum nominatorum conservabit, et in versutias parabolarum simul introibit."
      en: "He will keep the sayings of renowned men, and will enter withal into the subtilties of parables."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Occulta proverbiorum exquiret, et in absconditis parabolarum conversabitur."
      en: "He will search out the hidden meanings of proverbs, and will be conversant in the secrets of parables."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "In medio magnatorum ministrabit, et in conspectu praesidis apparebit."
      en: "He shall serve among great men, and: appear before the governor."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "In terram alienigenarum gentium pertransiet: bona enim et mala in hominibus tentabit."
      en: "He shall pass into strange countries: for he shall try good and evil among men."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cor suum tradet ad vigilandum diluculo ad Dominum, qui fecit illum, et in conspectu Altissimi deprecabitur."
      en: "He will give his heart to resort early to the Lord that made him, and he will pray in the sight of the most High."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Aperiet os suum in oratione, et pro delictis suis deprecabitur."
      en: "He will open his mouth in prayer, and will make supplication for his sins."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si enim Dominus magnus voluerit, spiritu intelligentiae replebit illum:"
      en: "For if it shall please the great Lord, he will fill him with the spirit of understanding:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ipse tamquam imbres mittet eloquia sapientiae suae, et in oratione confitebitur Domino:"
      en: "And he will pour forth the words of his wisdom as showers, and in his prayer he will confess to the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ipse diriget consilium ejus, et disciplinam, et in absconditis suis consiliabitur."
      en: "And he shall direct his counsel, and his knowledge, and in his secrets shall he meditate."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ipse palam faciet disciplinam doctrinae suae, et in lege testamenti Domini gloriabitur."
      en: "He shall shew forth the discipline he hath learned, and shall glory in the law of the covenant of the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Collaudabunt multi sapientiam ejus, et usque in saeculum non delebitur."
      en: "Many shall praise his wisdom, and it shall never be forgotten."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Non recedet memoria ejus, et nomen ejus requiretur a generatione in generationem."
      en: "The memory of him shall not depart away, and his name shall be in request from generation to generation."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sapientiam ejus enarrabunt gentes, et laudem ejus enuntiabit ecclesia."
      en: "Nations shall declare his wisdom, and the church shall shew forth his praise."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Si permanserit, nomen derelinquet plus quam mille: et si requieverit, proderit illi."
      en: "If he continue, he shall leave a name above a thousand: and if he rest, it shall be to his advantage."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Adhuc consiliabor ut enarrem: ut furore enim repletus sum."
      en: "I will yet meditate that I may declare: for I am filled as with a holy transport."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "In voce dicit: Obaudite me, divini fructus, et quasi rosa plantata super rivos aquarum fructificate."
      en: "By a voice he saith: Hear me, ye divine offspring, and bud forth as the rose planted by the brooks of waters."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quasi Libanus odorem suavitatis habete."
      en: "Give ye a sweet odour as frankincense."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Florete flores quasi lilium: et date odorem, et frondete in gratiam: et collaudate canticum, et benedicite Dominum in operibus suis."
      en: "Send forth flowers, as the lily, and yield a smell, and bring forth leaves in grace, and praise with canticles, and bless the Lord in his works."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Date nomini ejus magnificentiam, et confitemini illi in voce labiorum vestrorum, et in canticis labiorum, et citharis: et sic dicetis in confessione:"
      en: "Magnify his name, and give glory to him with the voice of your lips, and with the canticles of your mouths, and with harps, and in praising him, you shall say in this manner:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Opera Domini universa bona valde."
      en: "All the works of the Lord are exceeding good."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "In verbo ejus stetit aqua sicut congeries: et in sermone oris illius sicut exceptoria aquarum:"
      en: "At his word the waters stood as a heap: and at the words of his mouth the receptacles of waters:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quoniam in praecepto ipsius placor fit, et non est minoratio in salute ipsius."
      en: "For at his commandment favour is shewn, and there is no diminishing of his salvation."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Opera omnis carnis coram illo, et non est quidquam absconditum ab oculis ejus."
      en: "The works of all flesh are before him, and there is nothing hid from his eyes."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "A saeculo usque in saeculum respicit, et nihil est mirabile in conspectu ejus."
      en: "He seeth from eternity to eternity, and there is nothing wonderful before him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Non est dicere: Quid est hoc, aut quid est istud? omnia enim in tempore suo quaerentur."
      en: "There is no saying: What is this, or what is that? for all things shall be sought in their time."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Benedictio illius quasi fluvius inundavit."
      en: "His blessing hath overflowed like a river."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quomodo cataclysmus aridam inebriavit, sic ira ipsius gentes quae non exquisierunt eum haereditabit."
      en: "And as a flood hath watered the earth; so shall his wrath inherit the nations, that have not sought after him:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Quomodo convertit aquas in siccitatem, et siccata est terra, et viae illius viis illorum directae sunt, sic peccatoribus offensiones in ira ejus."
      en: "Even as he turned the waters into a dry land, and the earth was made dry: and his ways were made plain for their journey: so to sinners they are stumblingblocks in his wrath."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Bona bonis creata sunt ab initio: sic nequissimis bona et mala."
      en: "Good things were created for the good from the beginning, so for the wicked, good and evil things."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Initium necessariae rei vitae hominum, aqua, ignis, et ferrum, sal, lac, et panis similagineus, et mel, et botrus uvae, et oleum, et vestimentum."
      en: "The principal things necessary for the life of men, are water, fire, and iron, salt, milk, and bread of flour, and honey, and the cluster of the grape, and oil, and clothing."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Haec omnia sanctis in bona, sic et impiis et peccatoribus in mala convertentur."
      en: "All these things shall be for good to the holy, so to the sinners and the ungodly they shall be turned into evil."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Sunt spiritus qui ad vindictam creati sunt, et in furore suo confirmaverunt tormenta sua."
      en: "There are spirits that are created for vengeance, and in their fury they lay on grievous torments."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "In tempore consummationis effundent virtutem, et furorem ejus qui fecit illos placabunt."
      en: "In the time of destruction they shall pour out their force: and they shall appease the wrath of him that made them."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Ignis, grando, fames, et mors, omnia haec ad vindictam creata sunt:"
      en: "Fire, hail, famine, and death, all these were created for vengeance."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "bestiarum dentes, et scorpii, et serpentes, et rhomphaea vindicans in exterminium impios."
      en: "The teeth of beasts, and scorpions, and serpents, and the sword taking vengeance upon the ungodly unto destruction."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "In mandatis ejus epulabuntur: et super terram in necessitatem praeparabuntur, et in temporibus suis non praeterient verbum."
      en: "In his commandments they shall feast, and they shall be ready upon earth when need is, and when their time is come they shall not transgress his word."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Propterea ab initio confirmatus sum, et consiliatus sum, et cogitavi, et scripta dimisi."
      en: "Therefore from the beginning I was resolved, and I have meditated, and thought on these things and left them in writing."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Omnia opera Domini bona, et omne opus hora sua subministrabit."
      en: "All the works of the Lord are good, and he will furnish every work in due time."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Non est dicere: Hoc illo nequius est: omnia enim in tempore suo comprobabuntur."
      en: "It is not to be said: This is worse than that: for all shall be well approved in their time."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et nunc in omni corde et ore collaudate, et benedicite nomen Domini."
      en: "Now therefore with the whole heart and mouth praise ye him, and bless the name of the Lord."
    status: { la: verified, en: verified }
