# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 15
verses:
  - n: 1
    text:
      la: "responsio mollis frangit iram sermo durus suscitat furorem"
      en: "A mild answer breaketh wrath: but a harsh word stirreth up fury."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "lingua sapientium ornat scientiam os fatuorum ebullit stultitiam"
      en: "The tongue of the wise adorneth knowledge: but the mouth of fools bubbleth out folly."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in omni loco oculi Domini contemplantur malos et bonos"
      en: "The eyes of the Lord in every place behold the good and the evil."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "lingua placabilis lignum vitae quae inmoderata est conteret spiritum"
      en: "A peaceable tongue is a tree of life: but that which is immoderate, shall crush the spirit."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "stultus inridet disciplinam patris sui qui autem custodit increpationes astutior fiet"
      en: "A fool laugheth at the instruction of his father: but he that regardeth reproofs shall become prudent. In abundant justice there is the greatest strength: but the devices of the wicked shall be rooted out."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "domus iusti plurima fortitudo et in fructibus impii conturbatur"
      en: "The house of the just is very much strength: and in the fruits of the wicked is trouble."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "labia sapientium disseminabunt scientiam cor stultorum dissimile erit"
      en: "The lips of the wise shall disperse knowledge: the heart of fools shall be unlike."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "victimae impiorum abominabiles Domino vota iustorum placabilia"
      en: "The victims of the wicked are abominable to the Lord: the vows of the just are acceptable."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "abominatio est Domino via impii qui sequitur iustitiam diligetur ab eo"
      en: "The way of the wicked is an abomination to the Lord: he that followeth justice is beloved by him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "doctrina mala deserenti viam qui increpationes odit morietur"
      en: "Instruction is grievous to him that forsaketh the way of life: he that hateth reproof shall die."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "infernus et perditio coram Domino quanto magis corda filiorum hominum"
      en: "Hell and destruction are before the Lord: how much more the hearts of the children of men?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non amat pestilens eum qui se corripit nec ad sapientes graditur"
      en: "A corrupt man loveth not one that reproveth him: nor will he go to the wise."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cor gaudens exhilarat faciem in maerore animi deicitur spiritus"
      en: "A glad heart maketh a cheerful countenance: but by grief of mind the spirit is cast down."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cor sapientis quaerit doctrinam et os stultorum pascetur inperitia"
      en: "The heart of the wise seeketh instruction: and the mouth of fools feedeth on foolishness."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "omnes dies pauperis mali secura mens quasi iuge convivium"
      en: "All the days of the poor are evil: a secure mind is like a continual feast."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "melius est parum cum timore Domini quam thesauri magni et insatiabiles"
      en: "Better is a little with the fear of the Lord, than great treasures without content,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "melius est vocare ad holera cum caritate quam ad vitulum saginatum cum odio"
      en: "It is better to be invited to herbs with love, than to a fatted calf with hatred."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "vir iracundus provocat rixas qui patiens est mitigat suscitatas"
      en: "A passionate man stirreth up strifes: he that is patient appeaseth those that are stirred up."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "iter pigrorum quasi sepes spinarum via iustorum absque offendiculo"
      en: "The way of the slothful is as a hedge of thorns; the way of the just is without offence."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "filius sapiens laetificat patrem et stultus homo despicit matrem suam"
      en: "A wise son maketh a father joyful: but the foolish man despiseth his mother."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "stultitia gaudium stulto et vir prudens dirigit gressus"
      en: "Folly is joy to the fool: and the wise man maketh straight his steps."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dissipantur cogitationes ubi non est consilium ubi vero plures sunt consiliarii confirmantur"
      en: "Designs are brought to nothing where there is no counsel: but where there are many counsellors, they are established."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "laetatur homo in sententia oris sui et sermo oportunus est optimus"
      en: "A man rejoiceth in the sentence of his mouth: and a word in due time is best."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "semita vitae super eruditum ut declinet de inferno novissimo"
      en: "The path of life is above for the wise, that he may decline from the lowest hell."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "domum superborum demolietur Dominus et firmos facit terminos viduae"
      en: "The Lord will destroy the house of the proud: and will strengthen the borders of the widow."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "abominatio Domini cogitationes malae et purus sermo pulcherrimus"
      en: "Evil thoughts are an abomination to the Lord: and pure words most beautiful shall be confirmed by him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "conturbat domum suam qui sectatur avaritiam qui autem odit munera vivet"
      en: "He that is greedy of gain troubleth his own house: but he that hateth bribes shall live. By mercy and faith sins are purged away: and by the fear of the Lord every one declineth from evil."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "mens iusti meditatur oboedientiam os impiorum redundat malis"
      en: "The mind of the just studieth obedience: the mouth of the wicked over floweth with evils."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "longe est Dominus ab impiis et orationes iustorum exaudiet"
      en: "The Lord is far from the wicked: and he will hear the prayers of the just."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "lux oculorum laetificat animam fama bona inpinguat ossa"
      en: "The light of the eyes rejoiceth the soul: a good name maketh the bones fat."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "auris quae audit increpationes vitae in medio sapientium commorabitur"
      en: "The ear that heareth the reproofs of life, shall abide in the midst of the wise."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "qui abicit disciplinam despicit animam suam qui adquiescit increpationibus possessor est cordis"
      en: "He that rejecteth instruction, despiseth his own soul: but he that yieldeth to reproof possesseth understanding."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "timor Domini disciplina sapientiae et gloriam praecedit humilitas"
      en: "The fear of the Lord is the lesson of wisdom: and humility goeth before glory."
    status: { la: verified, en: verified }
