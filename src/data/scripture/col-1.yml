# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: col
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus apostolus Christi Iesu per voluntatem Dei et Timotheus frater"
      en: "Paul, an apostle of Jesus Christ, by the will of God, and Timothy, a brother,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "his qui sunt Colossis sanctis et fidelibus fratribus in Christo Iesu gratia vobis et pax a Deo Patre nostro"
      en: "To the saints and faithful brethren in Christ Jesus, who are at Colossa."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "gratias agimus Deo et Patri Domini nostri Iesu Christi semper pro vobis orantes"
      en: "Grace be to you and peace from God our Father, and from the Lord Jesus Christ. We give thanks to God, and the Father of our Lord Jesus Christ, praying always for you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "audientes fidem vestram in Christo Iesu et dilectionem quam habetis in sanctos omnes"
      en: "Hearing your faith in Christ Jesus, and the love which you have towards all the saints."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "propter spem quae reposita est vobis in caelis quam audistis in verbo veritatis evangelii"
      en: "For the hope that is laid up for you in heaven, which you have heard in the word of the truth of the gospel,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quod pervenit ad vos sicut et in universo mundo est et fructificat et crescit sicut in vobis ex ea die qua audistis et cognovistis gratiam Dei in veritate"
      en: "Which is come unto you, as also it is in the whole world, and bringeth forth fruit and groweth, even as it doth in you, since the day you heard and knew the grace of God in truth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sicut didicistis ab Epaphra carissimo conservo nostro qui est fidelis pro vobis minister Christi Iesu"
      en: "As you learned of Epaphras, our most beloved fellow servant, who is for you a faithful minister of Christ Jesus;"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui etiam manifestavit nobis dilectionem vestram in Spiritu"
      en: "Who also hath manifested to us your love in the spirit."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ideo et nos ex qua die audivimus non cessamus pro vobis orantes et postulantes ut impleamini agnitione voluntatis eius in omni sapientia et intellectu spiritali"
      en: "Therefore we also, from the day that we heard it, cease not to pray for you, and to beg that you may be filled with the knowledge of his will, in all wisdom, and spiritual understanding:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut ambuletis digne Deo per omnia placentes in omni opere bono fructificantes et crescentes in scientia Dei"
      en: "That you may walk worthy of God, in all things pleasing; being fruitful in every good work, and increasing in the knowledge of God:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in omni virtute confortati secundum potentiam claritatis eius in omni patientia et longanimitate cum gaudio"
      en: "Strengthened with all might, according to the power of his glory, in all patience and longsuffering with joy,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "gratias agentes Patri qui dignos nos fecit in partem sortis sanctorum in lumine"
      en: "Giving thanks to God the Father, who hath made us worthy to be partakers of the lot of the saints in light:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui eripuit nos de potestate tenebrarum et transtulit in regnum Filii dilectionis suae"
      en: "Who hath delivered us from the power of darkness, and hath translated us into the kingdom of the Son of his love,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "in quo habemus redemptionem remissionem peccatorum"
      en: "In whom we have redemption through his blood, the remission of sins;"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui est imago Dei invisibilis primogenitus omnis creaturae"
      en: "Who is the image of the invisible God, the firstborn of every creature:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quia in ipso condita sunt universa in caelis et in terra visibilia et invisibilia sive throni sive dominationes sive principatus sive potestates omnia per ipsum et in ipso creata sunt"
      en: "For in him were all things created in heaven and on earth, visible and invisible, whether thrones, or dominations, or principalities, or powers: all things were created by him and in him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ipse est ante omnes et omnia in ipso constant"
      en: "And he is before all, and by him all things consist."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ipse est caput corporis ecclesiae qui est principium primogenitus ex mortuis ut sit in omnibus ipse primatum tenens"
      en: "And he is the head of the body, the church, who is the beginning, the firstborn from the dead; that in all things he may hold the primacy:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quia in ipso conplacuit omnem plenitudinem habitare"
      en: "Because in him, it hath well pleased the Father, that all fullness should dwell;"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et per eum reconciliare omnia in ipsum pacificans per sanguinem crucis eius sive quae in terris sive quae in caelis sunt"
      en: "And through him to reconcile all things unto himself, making peace through the blood of his cross, both as to the things that are on earth, and the things that are in heaven."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et vos cum essetis aliquando alienati et inimici sensu in operibus malis"
      en: "And you, whereas you were some time alienated and enemies in mind in evil works:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "nunc autem reconciliavit in corpore carnis eius per mortem exhibere vos sanctos et inmaculatos et inreprehensibiles coram ipso"
      en: "Yet now he hath reconciled in the body of his flesh through death, to present you holy and unspotted, and blameless before him:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "si tamen permanetis in fide fundati et stabiles et inmobiles ab spe evangelii quod audistis quod praedicatum est in universa creatura quae sub caelo est cuius factus sum ego Paulus minister"
      en: "If so ye continue in the faith, grounded and settled, and immoveable from the hope of the gospel which you have heard, which is preached in all the creation that is under heaven, whereof I Paul am made a minister."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui nunc gaudeo in passionibus pro vobis et adimpleo ea quae desunt passionum Christi in carne mea pro corpore eius quod est ecclesia"
      en: "Who now rejoice in my sufferings for you, and fill up those things that are wanting of the sufferings of Christ, in my flesh, for his body, which is the church:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cuius factus sum ego minister secundum dispensationem Dei quae data est mihi in vos ut impleam verbum Dei"
      en: "Whereof I am made a minister according to the dispensation of God, which is given me towards you, that I may fulfil the word of God:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "mysterium quod absconditum fuit a saeculis et generationibus nunc autem manifestatum est sanctis eius"
      en: "The mystery which hath been hidden from ages and generations, but now is manifested to his saints,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quibus voluit Deus notas facere divitias gloriae sacramenti huius in gentibus quod est Christus in vobis spes gloriae"
      en: "To whom God would make known the riches of the glory of this mystery among the Gentiles, which is Christ, in you the hope of glory."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quem nos adnuntiamus corripientes omnem hominem et docentes omnem hominem in omni sapientia ut exhibeamus omnem hominem perfectum in Christo Iesu"
      en: "Whom we preach, admonishing every man, and teaching every man in all wisdom, that we may present every man perfect in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "in quo et laboro certando secundum operationem eius quam operatur in me in virtute"
      en: "Wherein also I labour, striving according to his working which he worketh in me in power."
    status: { la: verified, en: verified }
