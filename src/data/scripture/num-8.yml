book: num
chapter: 8
verses:
  - n: 1
    text:
      la: "locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "loquere Aaroni et dices ad eum cum posueris septem lucernas contra eam partem quam candelabrum respicit lucere debebunt"
      en: "Speak to Aaron, and thou shalt say to him: When thou shalt place the seven lamps, let the candlestick be set up on the south side. Give orders therefore that the lamps look over against the north, towards the table of the leaves of proposition, over against that part shall they give light, towards which the candlestick looketh."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "fecitque Aaron et inposuit lucernas super candelabrum ut praeceperat Dominus Mosi"
      en: "And Aaron did so, and he put the lamps upon the candlestick, as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "haec autem erat factura candelabri ex auro ductili tam medius stipes quam cuncta ex utroque calamorum latera nascebantur iuxta exemplum quod ostendit Dominus Mosi ita operatus est candelabrum"
      en: "Now this was the work of the candlestick, it was of beaten gold, both the shaft in the middle, and all that came out of both sides of the branches: according to the pattern which the Lord had shewn to Moses, so he made the candlestick."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying :"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tolle Levitas de medio filiorum Israhel et purificabis eos"
      en: "Take the Levites out of the midst of the children of Israel, and thou shalt purify them,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "iuxta hunc ritum aspergantur aqua lustrationis et radant omnes pilos carnis suae cumque laverint vestimenta sua et mundati fuerint"
      en: "According to this rite: Let them be sprinkled with the water of purification, and let them shave all the hairs of their flesh. And when they shall have washed their garments, and are cleansed,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tollant bovem de armentis et libamentum eius similam oleo conspersam bovem autem alterum de armento tu accipies pro peccato"
      en: "They shall take an ox of the herd, and for the offering thereof fine flour tempered with oil: and thou shalt take another ox of the herd for a sin offering:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et adplicabis Levitas coram tabernaculo foederis convocata omni multitudine filiorum Israhel"
      en: "And thou shalt bring the Levites before the tabernacle of the covenant, calling together all the multitude of the children of Israel:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque Levitae fuerint coram Domino ponent filii Israhel manus suas super eos"
      en: "And when the Levites are before the Lord, the children of Israel shall put their hands upon them:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et offeret Aaron Levitas munus in conspectu Domini a filiis Israhel ut serviant in ministerio eius"
      en: "And Aaron shall offer the Levites, as a gift in the sight of the Lord from the children of Israel, that they may serve in his ministry."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Levitae quoque ponent manus suas super capita boum e quibus unum facies pro peccato et alterum in holocaustum Domini ut depreceris pro eis"
      en: "The Levites also shall put their hands upon the heads of the oxen, of which thou shalt sacrifice one for sin, and the other for a holocaust to the Lord, to pray for them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "statuesque Levitas in conspectu Aaron et filiorum eius et consecrabis oblatos Domino"
      en: "And thou shalt set the Levites in the sight of Aaron and of his sons, and shalt consecrate them being offered to the Lord,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ac separabis de medio filiorum Israhel ut sint mei"
      en: "And shalt separate them from the midst of the children of Israel, to be mine."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et postea ingrediantur tabernaculum foederis ut serviant mihi sicque purificabis et consecrabis eos in oblationem Domini quoniam dono donati sunt mihi a filiis Israhel"
      en: "And afterwards they shall enter into the tabernacle of the covenant, to serve me. And thus shalt thou purify and consecrate them for an oblation of the Lord: for as a gift they were given me by the children of Israel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "pro primogenitis quae aperiunt omnem vulvam in Israhel accepi eos"
      en: "I have taken them instead of the firstborn that open every womb in Israel,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "mea sunt omnia primogenita filiorum Israhel tam ex hominibus quam ex iumentis ex die quo percussi omnem primogenitum in terra Aegypti sanctificavi eos mihi"
      en: "For all the firstborn of the children of Israel, both of men and of beasts, are mine. From the day that I slew every firstborn in the land of Egypt, have I sanctified them to myself:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et tuli Levitas pro cunctis primogenitis filiorum Israhel"
      en: "And I have taken the Levites for all the firstborn of the children of Israel:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "tradidique eos dono Aaroni et filiis eius de medio populi ut serviant mihi pro Israhel in tabernaculo foederis et orent pro eis ne sit in populo plaga si ausi fuerint accedere ad sanctuarium"
      en: "And have delivered them for a gift to Aaron and his sons out of the midst of the people, to serve me for Israel in the tabernacle of the covenant, and to pray for them, lest there should be a plague among the people, if they should presume to approach unto my sanctuary."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "feceruntque Moses et Aaron et omnis multitudo filiorum Israhel super Levitas quae praeceperat Dominus Mosi"
      en: "And Moses and Aaron and all the multitude of the children of Israel did with the Levites all that the Lord had commanded Moses:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "purificatique sunt et laverunt vestimenta sua elevavitque eos Aaron in conspectu Domini et oravit pro eis"
      en: "And they were purified, and washed their garments. And Aaron lifted them up in the sight of the Lard, and prayed for them,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ut purificati ingrederentur ad officia sua in tabernaculum foederis coram Aaron et filiis eius sicut praeceperat Dominus Mosi de Levitis ita factum est"
      en: "That being purified they might go into the tabernacle of the covenant to do their services before Aaron and his sons. As the Lord had commanded Moses touching the Levites, so was it done."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "haec est lex Levitarum a viginti quinque annis et supra ingredientur ut ministrent in tabernaculo foederis"
      en: "This is the law of the Levites: From twenty-five years old and upwards, they shall go in to minister in the tabernacle of the covenant."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cumque quinquagesimum annum aetatis impleverint servire cessabunt"
      en: "And when they shall have accomplished the fiftieth year of their age, they shall cease to serve:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "eruntque ministri fratrum suorum in tabernaculo foederis ut custodiant quae sibi fuerint commendata opera autem ipsa non faciant sic dispones Levitas in custodiis suis"
      en: "And they shall be the ministers of their brethren in the tabernacle of the covenant, to keep the things that are committed to their care, but not to do the works. Thus shalt thou order the Levites touching their charge."
    status: { la: verified, en: verified }
