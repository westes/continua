book: joan
chapter: 17
verses:
  - n: 1
    text:
      la: "haec locutus est Iesus et sublevatis oculis in caelum dixit Pater venit hora clarifica Filium tuum ut Filius tuus clarificet te"
      en: "These things Jesus spoke, and lifting up his eyes to heaven, he said: Father, the hour is come, glorify thy Son, that thy Son may glorify thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sicut dedisti ei potestatem omnis carnis ut omne quod dedisti ei det eis vitam aeternam"
      en: "As thou hast given him power over all flesh, that he may give eternal life to all whom thou hast given him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "haec est autem vita aeterna ut cognoscant te solum verum Deum et quem misisti Iesum Christum"
      en: "Now this is eternal life: That they may know thee, the only true God, and Jesus Christ, whom thou hast sent."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ego te clarificavi super terram opus consummavi quod dedisti mihi ut faciam"
      en: "I have glorified thee on the earth; I have finished the work which thou gavest me to do."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et nunc clarifica me tu Pater apud temet ipsum claritatem quam habui priusquam mundus esset apud te"
      en: "And now glorify thou me, O Father, with thyself, with the glory which I had, before the world was, with thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "manifestavi nomen tuum hominibus quos dedisti mihi de mundo tui erant et mihi eos dedisti et sermonem tuum servaverunt"
      en: "I have manifested thy name to the men whom thou hast given me out of the world. Thine they were, and to me thou gavest them; and they have kept thy word."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nunc cognoverunt quia omnia quae dedisti mihi abs te sunt"
      en: "Now they have known, that all things which thou hast given me, are from thee:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quia verba quae dedisti mihi dedi eis et ipsi acceperunt et cognoverunt vere quia a te exivi et crediderunt quia tu me misisti"
      en: "Because the words which thou gavest me, I have given to them; and they have received them, and have known in very deed that I came out from thee, and they have believed that thou didst send me."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ego pro eis rogo non pro mundo rogo sed pro his quos dedisti mihi quia tui sunt"
      en: "I pray for them: I pray not for the world, but for them whom thou hast given me: because they are thine:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et mea omnia tua sunt et tua mea sunt et clarificatus sum in eis"
      en: "And all my things are thine, and thine are mine; and I am glorified in them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et iam non sum in mundo et hii in mundo sunt et ego ad te venio Pater sancte serva eos in nomine tuo quos dedisti mihi ut sint unum sicut et nos"
      en: "And now I am not in the world, and these are in the world, and I come to thee. Holy Father, keep them in thy name whom thou has given me; that they may be one, as we also are."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cum essem cum eis ego servabam eos in nomine tuo quos dedisti mihi custodivi et nemo ex his perivit nisi filius perditionis ut scriptura impleatur"
      en: "While I was with them, I kept them in thy name. Those whom thou gavest me have I kept; and none of them is lost, but the son of perdition, that the scripture may be fulfilled."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nunc autem ad te venio et haec loquor in mundo ut habeant gaudium meum impletum in semet ipsis"
      en: "And now I come to thee; and these things I speak in the world, that they may have my joy filled in themselves."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ego dedi eis sermonem tuum et mundus odio eos habuit quia non sunt de mundo sicut et ego non sum de mundo"
      en: "I have given them thy word, and the world hath hated them, because they are not of the world; as I also am not of the world."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "non rogo ut tollas eos de mundo sed ut serves eos ex malo"
      en: "I pray not that thou shouldst take them out of the world, but that thou shouldst keep them from evil."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "de mundo non sunt sicut et ego non sum de mundo"
      en: "They are not of the world, as I also am not of the world."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sanctifica eos in veritate sermo tuus veritas est"
      en: "Sanctify them in truth. Thy word is truth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sicut me misisti in mundum et ego misi eos in mundum"
      en: "As thou hast sent me into the world, I also have sent them into the world."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et pro eis ego sanctifico me ipsum ut sint et ipsi sanctificati in veritate"
      en: "And for them do I sanctify myself, that they also may be sanctified in truth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "non pro his autem rogo tantum sed et pro eis qui credituri sunt per verbum eorum in me"
      en: "And not for them only do I pray, but for them also who through their word shall believe in me;"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ut omnes unum sint sicut tu Pater in me et ego in te ut et ipsi in nobis unum sint ut mundus credat quia tu me misisti"
      en: "That they all may be one, as thou, Father, in me, and I in thee; that they also may be one in us; that the world may believe that thou hast sent me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ego claritatem quam dedisti mihi dedi eis ut sint unum sicut nos unum sumus"
      en: "And the glory which thou hast given me, I have given to them; that they may be one, as we also are one:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ego in eis et tu in me ut sint consummati in unum et cognoscat mundus quia tu me misisti et dilexisti eos sicut me dilexisti"
      en: "I in them, and thou in me; that they may be made perfect in one: and the world may know that thou hast sent me, and hast loved them, as thou hast also loved me."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Pater quos dedisti mihi volo ut ubi ego sum et illi sint mecum ut videant claritatem meam quam dedisti mihi quia dilexisti me ante constitutionem mundi"
      en: "Father, I will that where I am, they also whom thou hast given me may be with me; that they may see my glory which thou hast given me, because thou hast loved me before the creation of the world."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Pater iuste et mundus te non cognovit ego autem te cognovi et hii cognoverunt quia tu me misisti"
      en: "Just Father, the world hath not known thee; but I have known thee: and these have known that thou hast sent me."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et notum feci eis nomen tuum et notum faciam ut dilectio qua dilexisti me in ipsis sit et ego in ipsis"
      en: "And I have made known thy name to them, and will make it known; that the love wherewith thou hast loved me, may be in them, and I in them."
    status: { la: verified, en: verified }
