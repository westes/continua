# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: eph
chapter: 4
verses:
  - n: 1
    text:
      la: "Obsecro itaque vos ego vinctus in Domino, ut digne ambuletis vocatione, qua vocati estis,"
      en: "I therefore, a prisoner in the Lord, beseech you that you walk worthy of the vocation in which you are called,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cum omni humilitate, et mansuetudine, cum patientia, supportantes invicem in caritate,"
      en: "With all humility and mildness, with patience, supporting one another in charity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "solliciti servare unitatem Spiritus in vinculo pacis."
      en: "Careful to keep the unity of the Spirit in the bond of peace."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Unum corpus, et unus Spiritus, sicut vocati estis in una spe vocationis vestrae."
      en: "One body and one Spirit; as you are called in one hope of your calling."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Unus Dominus, una fides, unum baptisma."
      en: "One Lord, one faith, one baptism."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Unus Deus et Pater omnium, qui est super omnes, et per omnia, et in omnibus nobis."
      en: "One God and Father of all, who is above all, and through all, and in us all."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Unicuique autem nostrum data est gratia secundum mensuram donationis Christi."
      en: "But to every one of us is given grace, according to the measure of the giving of Christ."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Propter quod dicit: Ascendens in altum, captivam duxit captivitatem: dedit dona hominibus."
      en: "Wherefore he saith: Ascending on high, he led captivity captive; he gave gifts to men."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quod autem ascendit, quid est, nisi quia et descendit primum in inferiores partes terrae?"
      en: "Now that he ascended, what is it, but because he also descended first into the lower parts of the earth?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui descendit, ipse est et qui ascendit super omnes caelos, ut impleret omnia."
      en: "He that descended is the same also that ascended above all the heavens, that he might fill all things."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et ipse dedit quosdam quidem apostolos, quosdam autem prophetas, alios vero evangelistas, alios autem pastores et doctores,"
      en: "And he gave some apostles, and some prophets, and other some evangelists, and other some pastors and doctors,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ad consummationem sanctorum in opus ministerii, in aedificationem corporis Christi:"
      en: "For the perfecting of the saints, for the work of the ministry, for the edifying of the body of Christ:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "donec occurramus omnes in unitatem fidei, et agnitionis Filii Dei, in virum perfectum, in mensuram aetatis plenitudinis Christi:"
      en: "Until we all meet into the unity of faith, and of the knowledge of the Son of God, unto a perfect man, unto the measure of the age of the fulness of Christ;"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ut jam non simus parvuli fluctuantes, et circumferamur omni vento doctrinae in nequitia hominum, in astutia ad circumventionem erroris."
      en: "That henceforth we be no more children tossed to and fro, and carried about with every wind of doctrine by the wickedness of men, by cunning craftiness, by which they lie in wait to deceive."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Veritatem autem facientes in caritate, crescamus in illo per omnia, qui est caput Christus:"
      en: "But doing the truth in charity, we may in all things grow up in him who is the head, even Christ:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ex quo totum corpus compactum et connexum per omnem juncturam subministrationis, secundum operationem in mensuram uniuscujusque membri, augmentum corporis facit in aedificationem sui in caritate."
      en: "From whom the whole body, being compacted and fitly joined together, by what every joint supplieth, according to the operation in the measure of every part, maketh increase of the body, unto the edifying of itself in charity."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Hoc igitur dico, et testificor in Domino, ut jam non ambuletis, sicut et gentes ambulant in vanitate sensus sui,"
      en: "This then I say and testify in the Lord: That henceforward you walk not as also the Gentiles walk in the vanity of their mind,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "tenebris obscuratum habentes intellectum, alienati a vita Dei per ignorantiam, quae est in illis, propter caecitatem cordis ipsorum,"
      en: "Having their understanding darkened, being alienated from the life of God through the ignorance that is in them, because of the blindness of their hearts."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui desperantes, semetipsos tradiderunt impudicitiae, in operationem immunditiae omnis in avaritiam."
      en: "Who despairing, have given themselves up to lasciviousness, unto the working of all uncleanness, unto covetousness."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vos autem non ita didicistis Christum,"
      en: "But you have not so learned Christ;"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "si tamen illum audistis, et in ipso edocti estis, sicut est veritas in Jesu,"
      en: "If so be that you have heard him, and have been taught in him, as the truth is in Jesus:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "deponere vos secundum pristinam conversationem veterem hominem, qui corrumpitur secundum desideria erroris."
      en: "To put off, according to former conversation, the old man, who is corrupted according to the desire of error."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Renovamini autem spiritu mentis vestrae,"
      en: "And be renewed in the spirit of your mind:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et induite novum hominem, qui secundum Deum creatus est in justitia, et sanctitate veritatis."
      en: "And put on the new man, who according to God is created in justice and holiness of truth."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Propter quod deponentes mendacium, loquimini veritatem unusquisque cum proximo suo: quoniam sumus invicem membra."
      en: "Wherefore putting away lying, speak ye the truth every man with his neighbour; for we are members one of another."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Irascimini, et nolite peccare: sol non occidat super iracundiam vestram."
      en: "Be angry, and sin not. Let not the sun go down upon your anger."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Nolite locum dare diabolo:"
      en: "Give not place to the devil."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui furabatur, jam non furetur: magis autem laboret, operando manibus suis, quod bonum est, ut habeat unde tribuat necessitatem patienti."
      en: "He that stole, let him now steal no more; but rather let him labour, working with his hands the thing which is good, that he may have something to give to him that suffereth need."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Omnis sermo malus ex ore vestro non procedat: sed si quis bonus ad aedificationem fidei ut det gratiam audientibus."
      en: "Let no evil speech proceed from your mouth; but that which is good, to the edification of faith, that it may administer grace to the hearers."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et nolite constristare Spiritum Sanctum Dei: in quo signati estis in diem redemptionis."
      en: "And grieve not the holy Spirit of God: whereby you are sealed unto the day of redemption."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Omnis amaritudo, et ira, et indignatio, et clamor, et blasphemia tollatur a vobis cum omni malitia."
      en: "Let all bitterness, and anger, and indignation, and clamour, and blasphemy, be put away from you, with all malice."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Estote autem invicem benigni, misericordes, donantes invicem sicut et Deus in Christo donavit vobis."
      en: "And be ye kind one to another; merciful, forgiving one another, even as God hath forgiven you in Christ."
    status: { la: verified, en: verified }
