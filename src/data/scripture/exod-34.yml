# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 34
verses:
  - n: 1
    text:
      la: "ac deinceps praecide ait tibi duas tabulas lapideas instar priorum et scribam super eas verba quae habuerunt tabulae quas fregisti"
      en: "And after this he said: Hew thee two tables of stone like unto the former, and I will write upon them the words which were in the tables, which thou brokest."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "esto paratus mane ut ascendas statim in montem Sinai stabisque mecum super verticem montis"
      en: "Be ready in the morning, that thou mayst forthwith go up into mount Sinai, and thou shalt stand with me upon the top of the mount."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nullus ascendat tecum nec videatur quispiam per totum montem boves quoque et oves non pascantur e contra"
      en: "Let no man go up with thee: and let not any man be seen throughout all the mount: neither let the oxen nor the sheep feed over against it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "excidit ergo duas tabulas lapideas quales ante fuerant et de nocte consurgens ascendit in montem Sinai sicut ei praeceperat Dominus portans secum tabulas"
      en: "Then he cut out two tables of stone, such as had been before: and rising very early he went up into the mount Sinai, as the Lord had commanded him, carrying with him the tables."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque descendisset Dominus per nubem stetit Moses cum eo invocans nomen Domini"
      en: "And when the Lord was come down in a cloud, Moses stood with him, calling upon the name of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quo transeunte coram eo ait Dominator Domine Deus misericors et clemens patiens et multae miserationis ac verus"
      en: "And when he passed before him, he said: O the Lord, the Lord God, merciful and gracious, patient and of much compassion, and true,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui custodis misericordiam in milia qui aufers iniquitatem et scelera atque peccata nullusque apud te per se innocens est qui reddis iniquitatem patrum in filiis ac nepotibus in tertiam et quartam progeniem"
      en: "Who keepest mercy unto thousands: who takest away iniquity, and wickedness, and sin, and no man of himself is innocent before thee. Who renderest the iniquity of the fathers to the children, and to the grandchildren, unto the third and fourth generation."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "festinusque Moses curvatus est pronus in terram et adorans"
      en: "And Moses making haste, bowed down prostrate unto the earth, and adoring,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ait si inveni gratiam in conspectu tuo Domine obsecro ut gradiaris nobiscum populus enim durae cervicis est et auferas iniquitates nostras atque peccata nosque possideas"
      en: "Said: If I have found grace in thy sight: O Lord, I beseech thee, that thou wilt go with us, (for it is a stiffnecked people,) and take away our iniquities and sin, and possess us."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "respondit Dominus ego inibo pactum videntibus cunctis signa faciam quae numquam sunt visa super terram nec in ullis gentibus ut cernat populus in cuius es medio opus Domini terribile quod facturus sum"
      en: "The Lord answered: I will make a covenant in the sight of all. I will do signs such as were never seen upon the earth, nor in any nation: that this people, in the midst of whom thou art, may see the terrible work of the Lord which I will do."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "observa cuncta quae hodie mando tibi ego ipse eiciam ante faciem tuam Amorreum et Chananeum et Hettheum Ferezeum quoque et Eveum et Iebuseum"
      en: "Observe all things which this day I command thee: I myself will drive out before thy face the Amorrhite, and the Chanaanite, and the Hethite, and the Pherezite, and the Hevite, and the Jebusite."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cave ne umquam cum habitatoribus terrae illius iungas amicitias quae tibi sint in ruinam"
      en: "Beware thou never join in friendship with the inhabitants of that land, which may be thy ruin:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed aras eorum destrue confringe statuas lucosque succide"
      en: "But destroy their altars, break their statues, and cut down their groves:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "noli adorare deum alienum Dominus Zelotes nomen eius Deus est aemulator"
      en: "Adore not any strange god. The Lord his name is Jealous, he is a jealous God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ne ineas pactum cum hominibus illarum regionum ne cum fornicati fuerint cum diis suis et adoraverint simulacra eorum vocet te quispiam ut comedas de immolatis"
      en: "Make no covenant with the men of those countries lest, when they have committed fornication with their gods, and have adored their idols, some one call thee to eat of the things sacrificed."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nec uxorem de filiabus eorum accipies filiis tuis ne postquam ipsae fuerint fornicatae fornicari faciant et filios tuos in deos suos"
      en: "Neither shalt thou take of their daughters a wife for thy son, lest after they themselves have committed fornication, they make thy sons also to commit fornication with their gods."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "deos conflatiles non facies tibi"
      en: "Thou shalt not make to thyself any molten gods."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sollemnitatem azymorum custodies septem diebus vesceris azymis sicut praecepi tibi in tempore mensis novorum mense enim verni temporis egressus es de Aegypto"
      en: "Thou shalt keep the feast of the unleavened bread. Seven days shalt thou eat unleavened bread, as I commanded thee in the time of the month of the new corn: for in the month of the springtime thou camest out from Egypt."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "omne quod aperit vulvam generis masculini meum erit de cunctis animantibus tam de bubus quam de ovibus meum erit"
      en: "All of the male kind, that openeth the womb, shall be mine. Of all beasts, both of oxen and of sheep, it shall be mine."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "primogenitum asini redimes ove sin autem nec pretium pro eo dederis occidetur primogenitum filiorum tuorum redimes nec apparebis in conspectu meo vacuus"
      en: "The firstling of an ass thou shalt redeem with a sheep: but if thou wilt not give a price for it, it shall be slain. The firstborn of thy sons thou shalt redeem: neither shalt thou appear before me empty."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sex diebus operaberis die septimo cessabis arare et metere"
      en: "Six days shalt thou work, the seventh day thou shalt cease to plough, and to reap."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sollemnitatem ebdomadarum facies tibi in primitiis frugum messis tuae triticeae et sollemnitatem quando redeunte anni tempore cuncta conduntur"
      en: "Thou shalt keep the feast of weeks with the firstfruits of the corn of thy wheat harvest, and the feast when the time of the year returneth that all things are laid in."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "tribus temporibus anni apparebit omne masculinum tuum in conspectu omnipotentis Domini Dei Israhel"
      en: "Three times in a year all thy males shall appear in the sight of the Almighty Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cum enim tulero gentes a facie tua et dilatavero terminos tuos nullus insidiabitur terrae tuae ascendente te et apparente in conspectu Domini Dei tui ter in anno"
      en: "For when I shall have taken away the nations from thy face, and shall have enlarged thy borders, no man shall lie in wait against thy land when thou shalt go up, and appear in the sight of the Lord thy God thrice in a year."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "non immolabis super fermento sanguinem hostiae meae neque residebit mane de victima sollemnitatis phase"
      en: "Thou shalt not offer the blood of my sacrifice upon leaven: neither shall there remain in the morning any thing of the victim of the solemnity of the Lord."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "primitias frugum terrae tuae offeres in domum Domini Dei tui non coques hedum in lacte matris suae"
      en: "The first of the fruits of thy ground thou shalt offer in the house of the Lord thy God. Thou shalt not boil a kid in the milk of his dam."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "dixitque Dominus ad Mosen scribe tibi verba haec quibus et tecum et cum Israhel pepigi foedus"
      en: "And the Lord said to Moses: Write these words by which I have made a covenant both with thee and with Israel."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "fecit ergo ibi cum Domino quadraginta dies et quadraginta noctes panem non comedit et aquam non bibit et scripsit in tabulis verba foederis decem"
      en: "And he was there with the Lord forty days and forty nights: he neither ate bread nor drank water, and he wrote upon the tables the ten words of the covenant."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "cumque descenderet Moses de monte Sinai tenebat duas tabulas testimonii et ignorabat quod cornuta esset facies sua ex consortio sermonis Dei"
      en: "And when Moses came down from the mount Sinai, he held the two tables of the testimony, and he knew not that his face was horned from the conversation of the Lord."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "videntes autem Aaron et filii Israhel cornutam Mosi faciem timuerunt prope accedere"
      en: "And Aaron and the children of Israel seeing the face of Moses horned, were afraid to come near."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "vocatique ab eo reversi sunt tam Aaron quam principes synagogae et postquam locutus est"
      en: "And being called by him, they returned, both Aaron and the rulers of the congregation. And after that he spoke to them."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "venerunt ad eum etiam omnes filii Israhel quibus praecepit cuncta quae audierat a Domino in monte Sinai"
      en: "And all the children of Israel came to him: and he gave them in commandment all that he had heard of the Lord in mount Sinai."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "impletisque sermonibus posuit velamen super faciem suam"
      en: "And having done speaking, he put a veil upon his face."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "quod ingressus ad Dominum et loquens cum eo auferebat donec exiret et tunc loquebatur ad filios Israhel omnia quae sibi fuerant imperata"
      en: "But when he went in to the Lord, and spoke with him, he took it away until he came forth, and then he spoke to the children of Israel all things that had been commanded him."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "qui videbant faciem egredientis Mosi esse cornutam sed operiebat rursus ille faciem suam si quando loquebatur ad eos"
      en: "And they saw that the face of Moses when he came out was horned, but he covered his face again, if at any time he spoke to them."
    status: { la: verified, en: verified }
