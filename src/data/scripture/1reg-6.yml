# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 6
verses:
  - n: 1
    text:
      la: "Fuit ergo arca Domini in regione Philisthinorum septem mensibus."
      en: "Now the ark of God was in the land of the Philistines seven months."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et vocaverunt Philisthiim sacerdotes et divinos, dicentes: Quid faciemus de arca Domini? indicate nobis quomodo remittamus eam in locum suum. Qui dixerunt:"
      en: "And the Philistines called for the priests and the diviners, saying: What shall we do with the ark of the Lord? tell us how we are to send it back to its place? And they said:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Si remittitis arcam Dei Israel, nolite dimittere eam vacuam, sed quod debetis, reddite ei pro peccato, et tunc curabimini: et scietis quare non recedat manus ejus a vobis."
      en: "If you send back the ark of the God of Israel, send it not away empty, but render unto him what you owe for sin, and then you shall be healed: and you shall know why his hand departeth not from you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui dixerunt: Quid est quod pro delicto reddere debeamus ei? Responderuntque illi:"
      en: "They answered: What is it we ought to render unto him for sin? and they answered:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Juxta numerum provinciarum Philisthinorum quinque anos aureos facietis, et quinque mures aureos: quia plaga una fuit omnibus vobis, et satrapis vestris. Facietisque similitudines anorum vestrorum, et similitudines murium, qui demoliti sunt terram: et dabitis Deo Israel gloriam: si forte relevet manum suam a vobis, et a diis vestris, et a terra vestra."
      en: "According to the number of the provinces of the Philistines you shall make five golden emerods, and five golden mice: for the same plague hath been upon you all, and upon your lords. And you shall make the likeness of your emerods, and the likeness of the mice that have destroyed the land, and you shall give glory to the God of Israel: to see if he will take off his hand from you, and from your gods, and from your land."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quare aggravatis corda vestra, sicut aggravavit Aegyptus et Pharao cor suum? Nonne postquam percussus est, tunc dimisit eos, et abierunt?"
      en: "Why do you harden your hearts, as Egypt and Pharao hardened their hearts? did not he, after he was struck, then let them go, and they departed?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nunc ergo arripite et facite plaustrum novum unum, et duas vaccas foetas, quibus non est impositum jugum, jungite in plaustro, et recludite vitulos earum domi."
      en: "Now therefore take and make a new cart: and two kine that have calved, on which there hath come no yoke, tie to the cart, and shut up their calves at home."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Tolletisque arcam Domini, et ponetis in plaustro, et vasa aurea, quae exsolvistis ei pro delicto, ponetis in capsellam ad latus ejus: et dimittite eam ut vadat."
      en: "And you shall take the ark of the Lord, and lay it on the cart, and the vessels of gold, which you have paid him for sin, you shall put into a little box, at the side thereof: and send it away that it may go."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et aspicietis: et si quidem per viam finium suorum ascenderit contra Bethsames, ipse fecit nobis hoc malum grande: sin autem, minime: sciemus quia nequaquam manus ejus tetigit nos, sed casu accidit."
      en: "And you shall look: and if it go up by the way of his own coasts towards Bethsames, then he hath done us this great evil: but if not, we shall know that it is not his hand hath touched us, but it hath happened by chance."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Fecerunt ergo illi hoc modo: et tollentes duas vaccas, quae lactabant vitulos, junxerunt ad plaustrum, vitulosque earum concluserunt domi."
      en: "They did therefore in this manner: and taking two kine, that had suckling calves, they yoked them to the cart, and shut up their calves at home."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et posuerunt arcam Dei super plaustrum, et capsellam, quae habebat mures aureos et similitudines anorum."
      en: "And they laid the ark of God upon the cart, and the little box that had in it the golden mice and the likeness of the emerods."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ibant autem in directum vaccae per viam, quae ducit Bethsames, et itinere uno gradiebantur, pergentes et mugientes: et non declinabant neque ad dextram neque ad sinistram: sed et satrapae Philisthiim sequebantur usque ad terminos Bethsames."
      en: "And the kine took the straight way that leadeth to Bethsames, and they went along the way, lowing as they went: and turned not aside neither to the right hand nor to the left: and the lords of the Philistines followed them as far as the borders of Bethsames."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Porro Bethsamitae metebant triticum in valle: et elevantes oculos suos, viderunt arcam, et gavisi sunt cum vidissent."
      en: "Now the Bethsamites were reaping wheat in the valley: and lifting up their eyes they saw the ark, and rejoiced to see it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et plaustrum venit in agrum Josue Bethsamitae, et stetit ibi. Erat autem ibi lapis magnus, et conciderunt ligna plaustri, vaccasque imposuerunt super ea holocaustum Domino."
      en: "And the cart came into the field of Josue a Bethsamite, and stood there. And there was a great stone, and they cut in pieces the wood of the cart, and laid the kine upon it a holocaust to the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Levitae autem deposuerunt arcam Dei, et capsellam, quae erat juxta eam, in qua erant vasa aurea, et posuerunt super lapidem grandem. Viri autem Bethsamitae obtulerunt holocausta, et immolaverunt victimas in die illa Domino."
      en: "And the Levites took down the ark of God, and the little box that was at the side of it, wherein were the vessels of gold, and they put them upon the great stone. The men also of Bethsames offered holocausts and sacrificed victims that day to the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et quinque satrapae Philisthinorum viderunt, et reversi sunt in Accaron in die illa."
      en: "And the five princes of the Philistines saw, and they returned to Accaron the same day."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Hi sunt autem ani aurei, quos reddiderunt Philisthiim pro delicto, Domino: Azotus unum, Gaza unum, Ascalon unum, Geth unum, Accaron unum:"
      en: "And these are the golden emerods, which the Philistines returned for sin to the Lord: For Azotus one, for Gaza one, for Ascalon one, for Geth one, for Accaron one:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et mures aureos secundum numerum urbium Philisthiim, quinque provinciarum, ab urbe murata usque ad villam quae erat absque muro, et usque ad Abelmagnum, super quem posuerunt arcam Domini, quae erat usque in illum diem in agro Josue Bethsamitis."
      en: "And the golden mice according to the number of the cities of the Philistines, of the five provinces, from the fenced city to the village that was without wall, and to the great Abel (the stone) whereon they set down the ark of the Lord, which was till that day in the field of Josue the Bethsamite."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Percussit autem de viris Bethsamitibus, eo quod vidissent arcam Domini: et percussit de populo septuaginta viros, et quinquaginta millia plebis. Luxitque populus, eo quod Dominus percussisset plebem plaga magna."
      en: "But he slew of the men of Bethsames, because they had seen the ark of the Lord: and he slew of the people seventy men, and fifty thousand of the common people. And the people lamented, because the Lord had smitten the people with a great slaughter."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et dixerunt viri Bethsamitae: Quis poterit stare in conspectu Domini Dei sancti hujus? et ad quem ascendet a nobis?"
      en: "And the men of Bethsames said: Who shall be able to stand before the Lord this holy God? and to whom shall he go up from us?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Miseruntque nuntios ad habitatores Cariathiarim, dicentes: Reduxerunt Philisthiim arcam Domini, descendite, et reducite eam ad vos."
      en: "And they sent messengers to the inhabitants of Cariathiarim, saying: The Philistines have brought back the ark of the Lord, come ye down and fetch it up to you."
    status: { la: verified, en: verified }
