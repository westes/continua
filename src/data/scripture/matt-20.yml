# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 20
verses:
  - n: 1
    text:
      la: "simile est enim regnum caelorum homini patri familias qui exiit primo mane conducere operarios in vineam suam"
      en: "The kingdom of heaven is like to an householder, who went out early in the morning to hire labourers into his vineyard."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "conventione autem facta cum operariis ex denario diurno misit eos in vineam suam"
      en: "And having agreed with the labourers for a penny a day, he sent them into his vineyard."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et egressus circa horam tertiam vidit alios stantes in foro otiosos"
      en: "And going about the third hour, he saw others standing in the market place idle."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et illis dixit ite et vos in vineam et quod iustum fuerit dabo vobis"
      en: "And he said to them: Go you also into my vineyard, and I will give you what shall be just."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "illi autem abierunt iterum autem exiit circa sextam et nonam horam et fecit similiter"
      en: "And they went their way. And again he went out about the sixth and the ninth hour, and did in like manner."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "circa undecimam vero exiit et invenit alios stantes et dicit illis quid hic statis tota die otiosi"
      en: "But about the eleventh hour he went out and found others standing, and he saith to them: Why stand you here all the day idle?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dicunt ei quia nemo nos conduxit dicit illis ite et vos in vineam"
      en: "They say to him: Because no man hath hired us. He saith to them: Go you also into my vineyard."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cum sero autem factum esset dicit dominus vineae procuratori suo voca operarios et redde illis mercedem incipiens a novissimis usque ad primos"
      en: "And when evening was come, the lord of the vineyard saith to his steward: Call the labourers and pay them their hire, beginning from the last even to the first."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cum venissent ergo qui circa undecimam horam venerant acceperunt singulos denarios"
      en: "When therefore they were come, that came about the eleventh hour, they received every man a penny."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "venientes autem et primi arbitrati sunt quod plus essent accepturi acceperunt autem et ipsi singulos denarios"
      en: "But when the first also came, they thought that they should receive more: and they also received every man a penny."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et accipientes murmurabant adversus patrem familias"
      en: "And receiving it they murmured against the master of the house,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dicentes hii novissimi una hora fecerunt et pares illos nobis fecisti qui portavimus pondus diei et aestus"
      en: "Saying: These last have worked but one hour, and thou hast made them equal to us, that have borne the burden of the day and the heats."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "at ille respondens uni eorum dixit amice non facio tibi iniuriam nonne ex denario convenisti mecum"
      en: "But he answering said to one of them: Friend, I do thee no wrong: didst thou not agree with me for a penny?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tolle quod tuum est et vade volo autem et huic novissimo dare sicut et tibi"
      en: "Take what is thine, and go thy way: I will also give to this last even as to thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "aut non licet mihi quod volo facere an oculus tuus nequam est quia ego bonus sum"
      en: "Or, is it not lawful for me to do what I will? is thy eye evil, because I am good?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sic erunt novissimi primi et primi novissimi multi sunt enim vocati pauci autem electi"
      en: "So shall the last be first, and the first last. For many are called, but few chosen."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ascendens Iesus Hierosolymam adsumpsit duodecim discipulos secreto et ait illis"
      en: "And Jesus going up to Jerusalem, took the twelve disciples apart, and said to them:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ecce ascendimus Hierosolymam et Filius hominis tradetur principibus sacerdotum et scribis et condemnabunt eum morte"
      en: "Behold we go up to Jerusalem, and the Son of man shall be betrayed to the chief priests and the scribes, and they shall condemn him to death."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et tradent eum gentibus ad deludendum et flagellandum et crucifigendum et tertia die resurget"
      en: "And shall deliver him to the Gentiles to be mocked, and scourged, and crucified, and the third day he shall rise again."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "tunc accessit ad eum mater filiorum Zebedaei cum filiis suis adorans et petens aliquid ab eo"
      en: "Then came to him the mother of the sons of Zebedee with her sons, adoring and asking something of him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui dixit ei quid vis ait illi dic ut sedeant hii duo filii mei unus ad dexteram tuam et unus ad sinistram in regno tuo"
      en: "Who said to her: What wilt thou? She saith to him: Say that these my two sons may sit, the one on thy right hand, and the other on thy left, in thy kingdom."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "respondens autem Iesus dixit nescitis quid petatis potestis bibere calicem quem ego bibiturus sum dicunt ei possumus"
      en: "And Jesus answering, said: You know not what you ask. Can you drink the chalice that I shall drink? They say to him: We can."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ait illis calicem quidem meum bibetis sedere autem ad dexteram meam et sinistram non est meum dare vobis sed quibus paratum est a Patre meo"
      en: "He saith to them: My chalice indeed you shall drink; but to sit on my right or left hand, is not mine to give to you, but to them for whom it is prepared by my Father."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et audientes decem indignati sunt de duobus fratribus"
      en: "And the ten hearing it, were moved with indignation against the two brethren."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Iesus autem vocavit eos ad se et ait scitis quia principes gentium dominantur eorum et qui maiores sunt potestatem exercent in eos"
      en: "But Jesus called them to him, and said: You know that the princes of the Gentiles lord it over them; and they that are the greater, exercise power upon them."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "non ita erit inter vos sed quicumque voluerit inter vos maior fieri sit vester minister"
      en: "It shall not be so among you: but whosoever will be the greater among you, let him be your minister:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et qui voluerit inter vos primus esse erit vester servus"
      en: "And he that will be first among you, shall be your servant."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sicut Filius hominis non venit ministrari sed ministrare et dare animam suam redemptionem pro multis"
      en: "Even as the Son of man is not come to be ministered unto, but to minister, and to give his life a redemption for many."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et egredientibus eis ab Hiericho secuta est eum turba multa"
      en: "And when they went out from Jericho, a great multitude followed him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et ecce duo caeci sedentes secus viam audierunt quia Iesus transiret et clamaverunt dicentes Domine miserere nostri Fili David"
      en: "And behold two blind men sitting by the way side, heard that Jesus passed by, and they cried out, saying: O Lord, thou son of David, have mercy on us."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "turba autem increpabat eos ut tacerent at illi magis clamabant dicentes Domine miserere nostri Fili David"
      en: "And the multitude rebuked them that they should hold their peace. But they cried out the more, saying: O Lord, thou son of David, have mercy on us."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et stetit Iesus et vocavit eos et ait quid vultis ut faciam vobis"
      en: "And Jesus stood, and called them, and said: What will ye that I do to you?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "dicunt illi Domine ut aperiantur oculi nostri"
      en: "They say to him: Lord, that our eyes be opened."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "misertus autem eorum Iesus tetigit oculos eorum et confestim viderunt et secuti sunt eum"
      en: "And Jesus having compassion on them, touched their eyes. And immediately they saw, and followed him."
    status: { la: verified, en: verified }
