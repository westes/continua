# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: rom
chapter: 2
verses:
  - n: 1
    text:
      la: "Propter quod inexcusabilis es, o homo omnis qui judicas. In quo enim judicas alterum, teipsum condemnas: eadem enim agis quae judicas."
      en: "Wherefore thou art inexcusable, O man, whosoever thou art that judgest. For wherein thou judgest another, thou condemnest thyself. For thou dost the same things which thou judgest."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Scimus enim quoniam judicium Dei est secundum veritatem in eos qui talia agunt."
      en: "For we know that the judgment of God is, according to truth, against them that do such things."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Existimas autem hoc, o homo, qui judicas eos qui talia agunt, et facis ea, quia tu effugies judicium Dei?"
      en: "And thinkest thou this, O man, that judgest them who do such things, and dost the same, that thou shalt escape the judgment of God?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "an divitias bonitatis ejus, et patientiae, et longanimitatis contemnis? ignoras quoniam benignitas Dei ad poenitentiam te adducit?"
      en: "Or despisest thou the riches of his goodness, and patience, and longsuffering? Knowest thou not, that the benignity of God leadeth thee to penance?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Secundum autem duritiam tuam, et impoenitens cor, thesaurizas tibi iram in die irae, et revelationis justi judicii Dei,"
      en: "But according to thy hardness and impenitent heart, thou treasurest up to thyself wrath, against the day of wrath, and revelation of the just judgment of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui reddet unicuique secundum opera ejus:"
      en: "Who will render to every man according to his works."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "iis quidem qui secundum patientiam boni operis, gloriam, et honorem, et incorruptionem quaerunt, vitam aeternam:"
      en: "To them indeed, who according to patience in good work, seek glory and honour and incorruption, eternal life:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "iis autem qui sunt ex contentione, et qui non acquiescunt veritati, credunt autem iniquitati, ira et indignatio."
      en: "But to them that are contentious, and who obey not the truth, but give credit to iniquity, wrath and indignation."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Tribulatio et angustia in omnem animam hominis operantis malum, Judaei primum, et Graeci:"
      en: "Tribulation and anguish upon every soul of man that worketh evil, of the Jew first, and also of the Greek."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "gloria autem, et honor, et pax omni operanti bonum, Judaeo primum, et Graeco:"
      en: "But glory, and honour, and peace to every one that worketh good, to the Jew first, and also to the Greek."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non enim est acceptio personarum apud Deum."
      en: "For there is no respect of persons with God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quicumque enim sine lege peccaverunt, sine lege peribunt: et quicumque in lege peccaverunt, per legem judicabuntur."
      en: "For whosoever have sinned without the law, shall perish without the law; and whosoever have sinned in the law, shall be judged by the law."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Non enim auditores legis justi sunt apud Deum, sed factores legis justificabuntur."
      en: "For not the hearers of the law are just before God, but the doers of the law shall be justified."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cum autem gentes, quae legem non habent, naturaliter ea, quae legis sunt, faciunt, ejusmodi legem non habentes, ipsi sibi sunt lex:"
      en: "For when the Gentiles, who have not the law, do by nature those things that are of the law; these having not the law are a law to themselves:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui ostendunt opus legis scriptum in cordibus suis, testimonium reddente illis conscientia ipsorum, et inter se invicem cogitationibus accusantibus, aut etiam defendentibus,"
      en: "Who shew the work of the law written in their hearts, their conscience bearing witness to them, and their thoughts between themselves accusing, or also defending one another,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in die, cum judicabit Deus occulta hominum, secundum Evangelium meum per Jesum Christum."
      en: "In the day when God shall judge the secrets of men by Jesus Christ, according to my gospel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Si autem tu Judaeus cognominaris, et requiescis in lege, et gloriaris in Deo,"
      en: "But if thou art called a Jew and restest in the law, and makest thy boast of God,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et nosti voluntatem ejus, et probas utiliora, instructus per legem,"
      en: "And knowest his will, and approvest the more profitable things, being instructed by the law,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "confidis teipsum esse ducem caecorum, lumen eorum qui in tenebris sunt,"
      en: "Art confident that thou thyself art a guide of the blind, a light of them that are in darkness,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "eruditorem insipientium, magistrum infantium, habentem formam scientiae, et veritatis in lege."
      en: "An instructor of the foolish, a teacher of infants, having the form of knowledge and of truth in the law."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui ergo alium doces, teipsum non doces: qui praedicas non furandum, furaris:"
      en: "Thou therefore that teachest another, teachest not thyself: thou that preachest that men should not steal, stealest:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui dicis non moechandum, moecharis: qui abominaris idola, sacrilegium facis:"
      en: "Thou that sayest, men should not commit adultery, committest adultery: thou that abhorrest idols, committest sacrilege:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "qui in lege gloriaris, per praevaricationem legis Deum inhonoras."
      en: "Thou that makest thy boast of the law, by transgression of the law dishonourest God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "( Nomen enim Dei per vos blasphematur inter gentes, sicut scriptum est.)"
      en: "(For the name of God through you is blasphemed among the Gentiles, as it is written.)"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Circumcisio quidem prodest, si legem observes: si autem praevaricator legis sis, circumcisio tua praeputium facta est."
      en: "Circumcision profiteth indeed, if thou keep the law; but if thou be a transgressor of the law, thy circumcision is made uncircumcision."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Si igitur praeputium justitias legis custodiat, nonne praeputium illius in circumcisionem reputabitur?"
      en: "If, then, the uncircumcised keep the justices of the law, shall not this uncircumcision be counted for circumcision?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et judicabit id quod ex natura est praeputium, legem consummans, te, qui per litteram et circumcisionem praevaricator legis es?"
      en: "And shall not that which by nature is uncircumcision, if it fulfill the law, judge thee, who by the letter and circumcision art a transgressor of the law?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Non enim qui in manifesto, Judaeus est: neque quae in manifesto, in carne, est circumcisio:"
      en: "For it is not he is a Jew, who is so outwardly; nor is that circumcision which is outwardly in the flesh:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sed qui in abscondito, Judaeus est: et circumcisio cordis in spiritu, non littera: cujus laus non ex hominibus, sed ex Deo est."
      en: "But he is a Jew, that is one inwardly; and the circumcision is that of the heart, in the spirit, not in the letter; whose praise is not of men, but of God."
    status: { la: verified, en: verified }
