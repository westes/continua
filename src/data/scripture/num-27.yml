# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 27
verses:
  - n: 1
    text:
      la: "Accesserunt autem filiae Salphaad, filii Hepher, filii Galaad, filii Machir, filii Manasse, qui fuit filius Joseph: quarum sunt nomina, Maala, et Noa, et Hegla, et Melcha, et Thersa."
      en: "Then came the daughters of Salphaad, the son of Hepher, the son of Galaad, the son of Machir, the son of Manasses, who was the son of Joseph: and their names are Maala, and Noa, and Hegla, and Melcha, and Thersa."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Steteruntque coram Moyse et Eleazaro sacerdote et cunctis principibus populi ad ostium tabernaculi foederis, atque dixerunt:"
      en: "And they stood before Moses and Eleazar the priest, and all the princes of the people at the door of the tabernacle of the covenant, and said:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Pater noster mortuus est in deserto, nec fuit in seditione, quae concitata est contra Dominum sub Core, sed in peccato suo mortuus est: hic non habuit mares filios. Cur tollitur nomen illius de familia sua, quia non habuit filium? date nobis possessionem inter cognatos patris nostri."
      en: "Our father died in the desert, and was not in the sedition, that was raised against the Lord under Core, but he died in his own sin: and he had no male children. Why is his name taken away out of his family, because he had no son? Give us a possession among the kinsmen of our father."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Retulitque Moyses causam earum ad judicium Domini."
      en: "And Moses referred their cause to the judgment of the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui dixit ad eum:"
      en: "And the Lord said to him:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Justam rem postulant filiae Salphaad: da eis possessionem inter cognatos patris sui, et ei in haereditatem succedant."
      en: "The daughters of Salphaad demand a just thing: Give them a possession among their father's kindred, and let them succeed him in his inheritance."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ad filios autem Israel loqueris haec:"
      en: "And to the children of Israel thou shalt speak these things:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Homo cum mortuus fuerit absque filio, ad filiam ejus transibit haereditas."
      en: "When a man dieth without a son, his inheritance shall pass to his daughter."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si filiam non habuerit, habebit successores fratres suos."
      en: "If he have no daughter, his brethren shall succeed him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quod si et fratres non fuerint, dabitis haereditatem fratribus patris ejus."
      en: "And if he have no brethren, you shall give the inheritance to his father's brethren."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sin autem nec patruos habuerit, dabitur haereditas his qui ei proximi sunt. Eritque hoc filiis Israel sanctum lege perpetua, sicut praecepit Dominus Moysi."
      en: "But if he have no uncles by the father, the inheritance shall be given to them that are the next akin. And this shall be to the children of Israel sacred by a perpetual law, as the Lord hath commanded Moses."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dixit quoque Dominus ad Moysen: Ascende in montem istum Abarim, et contemplare inde terram, quam daturus sum filiis Israel."
      en: "The Lord also said to Moses: Go up into this mountain Abarim, and view from thence the land which I will give to the children of Israel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cumque videris eam, ibis et tu ad populum tuum, sicut ivit frater tuus Aaron:"
      en: "And when thou shalt have seen it, thou also shalt go to thy people, as thy brother Aaron is gone:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quia offendistis me in deserto Sin in contradictione multitudinis, nec sanctificare me voluistis coram ea super aquas. Hae sunt aquae contradictionis in Cades deserti Sin."
      en: "Because you offended me in the desert of Sin in the contradiction of the multitude, neither would you sanctify me before them at the waters. These are the waters of contradiction in Cades of the desert of Sin."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cui respondit Moyses:"
      en: "And Moses answered him:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Provideat Dominus Deus spirituum omnis carnis hominem, qui sit super multitudinem hanc:"
      en: "May the Lord the God of the spirits of all flesh provide a man, that may be over this multitude:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et possit exire et intrare ante eos, et educere eos vel introducere: ne sit populus Domini sicut oves absque pastore."
      en: "And may go out and in before them, and may lead them out, or bring them in: lest the people of the Lord be as sheep without a shepherd."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dixitque Dominus ad eum: Tolle Josue filium Nun, virum in quo est spiritus, et pone manum tuam super eum."
      en: "And the Lord said to him: Take Josue the son of Nun, a man in whom is the Spirit, and put thy hand upon him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Qui stabit coram Eleazaro sacerdote et omni multitudine:"
      en: "And he shall stand before Eleazar the priest and all the multitude:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et dabis ei praecepta cunctis videntibus, et partem gloriae tuae, ut audiat eum omnis synagoga filiorum Israel."
      en: "And thou shalt give him precepts in the sight of all, and part of thy glory, that all the congregation of the children of Israel may hear him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Pro hoc, si quid agendum erit, Eleazar sacerdos consulet Dominum. Ad verbum ejus egredietur et ingredietur ipse, et omnes filii Israel cum eo, et cetera multitudo."
      en: "If any thing be to be done, Eleazar the priest shall consult the Lord for him. He and all the children of Israel with him, and the rest of the multitude shall go out and go in at his word."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Fecit Moyses ut praeceperat Dominus: cumque tulisset Josue, statuit eum coram Eleazaro sacerdote et omni frequentia populi."
      en: "Moses did as the Lord had commanded. And when he had taken Josue, he set him before Eleazar the priest, and all the assembly of the people,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et impositis capiti ejus manibus, cuncta replicavit quae mandaverat Dominus."
      en: "And laying his hands on his head, he repeated all things that the Lord had commanded."
    status: { la: verified, en: verified }
