# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eccl
chapter: 3
verses:
  - n: 1
    text:
      la: "omnia tempus habent et suis spatiis transeunt universa sub caelo"
      en: "All things have their season, and in their times all things pass under heaven."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tempus nascendi et tempus moriendi tempus plantandi et tempus evellendi quod plantatum est"
      en: "A time to be born and a time to die. A time to plant, and a time to pluck up that which is planted."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tempus occidendi et tempus sanandi tempus destruendi et tempus aedificandi"
      en: "A time to kill, and a time to heal. A time to destroy, and a time to build."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "tempus flendi et tempus ridendi tempus plangendi et tempus saltandi"
      en: "A time to weep, and a time to laugh. A time to mourn, and a time to dance."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tempus spargendi lapides et tempus colligendi tempus amplexandi et tempus longe fieri a conplexibus"
      en: "A time to scatter stones, and a time to gather. A time to embrace, and a time to be far from embraces."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tempus adquirendi et tempus perdendi tempus custodiendi et tempus abiciendi"
      en: "A time to get, and a time to lose. A time to keep, and a time to cast away."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tempus scindendi et tempus consuendi tempus tacendi et tempus loquendi"
      en: "A time to rend, and a time to sew. A time to keep silence, and a time to speak."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tempus dilectionis et tempus odii tempus belli et tempus pacis"
      en: "A time of love, and a time of hatred. A time of war, and a time of peace."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quid habet amplius homo de labore suo"
      en: "What hath man more of his labour?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vidi adflictionem quam dedit Deus filiis hominum ut distendantur in ea"
      en: "I have seen the trouble, which God hath given the sons of men to be exercised in it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cuncta fecit bona in tempore suo et mundum tradidit disputationi eorum ut non inveniat homo opus quod operatus est Deus ab initio usque ad finem"
      en: "He hath made all things good in their time, and hath delivered the world to their consideration, so that man cannot flnd out the work which God hath made from the beginning to the end."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et cognovi quod non esset melius nisi laetari et facere bene in vita sua"
      en: "And I have known that there was no better thing than to rejoice, and to do well in this life."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "omnis enim homo qui comedit et bibit et videt bonum de labore suo hoc donum Dei est"
      en: "For every man that eateth and drinketh, and seeth good of his labour, this is the gift of God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "didici quod omnia opera quae fecit Deus perseverent in perpetuum non possumus eis quicquam addere nec auferre quae fecit Deus ut timeatur"
      en: "I have learned that all the works which God hath made, continue for ever: we cannot add any thing, nor take away from those things which God hath made that he may be feared."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quod factum est ipsum permanet quae futura sunt iam fuerunt et Deus instaurat quod abiit"
      en: "That which hath been made, the same continueth: the things that shall be, have already been: and God restoreth that which is past."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "vidi sub sole in loco iudicii impietatem et in loco iustitiae iniquitatem"
      en: "I saw under the sun in the place of judgment wickedness, and in the place of justice iniquity."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et dixi in corde meo iustum et impium iudicabit Deus et tempus omni rei tunc erit"
      en: "And I said in my heart: God shall judge both the just and the wicked, and then shall be the time of every thing."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixi in corde meo de filiis hominum ut probaret eos Deus et ostenderet similes esse bestiis"
      en: "I said in my heart concerning the sons of men, that God would prove them, and shew them to be like beasts."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "idcirco unus interitus est hominis et iumentorum et aequa utriusque condicio sicut moritur homo sic et illa moriuntur similiter spirant omnia et nihil habet homo iumento amplius cuncta subiacent vanitati"
      en: "Therefore the death of man, and of beasts is one, and the condition of them both is equal: as man dieth, so they also die: all things breathe alike, and man hath nothing more than beast: all things are subject to vanity."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et omnia pergunt ad unum locum de terra facta sunt et in terram pariter revertentur"
      en: "And all things go to one place: of earth they were made, and into earth they return together."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quis novit si spiritus filiorum Adam ascendat sursum et si spiritus iumentorum descendat deorsum"
      en: "Who knoweth if the spirit of the children of Adam ascend upward, and if the spirit of the beasts descend downward?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et deprehendi nihil esse melius quam laetari hominem in opere suo et hanc esse partem illius quis enim eum adducet ut post se futura cognoscat"
      en: "And I have found that nothing is better than for a man to rejoice in his work, and that this is his portion. For who shall bring him to know the things that shall be after him?"
    status: { la: verified, en: verified }
