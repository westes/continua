# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: apoc
chapter: 9
verses:
  - n: 1
    text:
      la: "et quintus angelus tuba cecinit et vidi stellam de caelo cecidisse in terram et data est illi clavis putei abyssi"
      en: "And the fifth angel sounded the trumpet, and I saw a star fall from heaven upon the earth, and there was given to him the key of the bottomless pit."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et aperuit puteum abyssi et ascendit fumus putei sicut fumus fornacis magnae et obscuratus est sol et aer de fumo putei"
      en: "And he opened the bottomless pit: and the smoke of the pit arose, as the smoke of a great furnace; and the sun and the air were darkened with the smoke of the pit."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et de fumo exierunt lucustae in terram et data est illis potestas sicut habent potestatem scorpiones terrae"
      en: "And from the smoke of the pit there came out locusts upon the earth. And power was given to them, as the scorpions of the earth have power:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et praeceptum est illis ne laederent faenum terrae neque omne viride neque omnem arborem nisi tantum homines qui non habent signum Dei in frontibus"
      en: "And it was commanded them that they should not hurt the grass of the earth, nor any green thing, nor any tree: but only the men who have not the sign of God on their foreheads."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et datum est illis ne occiderent eos sed ut cruciarentur mensibus quinque et cruciatus eorum ut cruciatus scorpii cum percutit hominem"
      en: "And it was given unto them that they should not kill them; but that they should torment them five months: and their torment was as the torment of a scorpion when he striketh a man."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et in diebus illis quaerent homines mortem et non invenient eam et desiderabunt mori et fugiet mors ab ipsis"
      en: "And in those days men shall seek death, and shall not find it: and they shall desire to die, and death shall fly from them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et similitudines lucustarum similes equis paratis in proelium et super capita earum tamquam coronae similes auro et facies earum sicut facies hominum"
      en: "And the shapes of the locusts were like unto horses prepared unto battle: and on their heads were, as it were, crowns like gold: and their faces were as the faces of men."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et habebant capillos sicut capillos mulierum et dentes earum sicut leonum erant"
      en: "And they had hair as the hair of women; and their teeth were as lions:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et habebant loricas sicut loricas ferreas et vox alarum earum sicut vox curruum equorum multorum currentium in bellum"
      en: "And they had breastplates as breastplates of iron, and the noise of their wings was as the noise of chariots and many horses running to battle."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et habebant caudas similes scorpionum et aculei in caudis earum potestas earum nocere hominibus mensibus quinque"
      en: "And they had tails like to scorpions, and there were stings in their tails; and their power was to hurt men five months. And they had over them"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et habebant super se regem angelum abyssi cui nomen hebraice Abaddon graece autem Apollyon et latine habet nomen Exterminans"
      en: "A king, the angel of the bottomless pit; whose name in Hebrew is Abaddon, and in Greek Apollyon; in Latin Exterminans,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vae unum abiit ecce veniunt adhuc duo vae post haec"
      en: "One woe is past, and behold there come yet two woes more hereafter."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et sextus angelus tuba cecinit et audivi vocem unum ex cornibus altaris aurei quod est ante oculos Dei"
      en: "And the sixth angel sounded the trumpet: and I heard a voice from the four horns of the great altar, which is before the eyes of God,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dicentem sexto angelo qui habebat tubam solve quattuor angelos qui alligati sunt in flumine magno Eufrate"
      en: "Saying to the sixth angel, who had the trumpet: Loose the four angels, who are bound in the great river Euphrates."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et soluti sunt quattuor angeli qui parati erant in horam et diem et mensem et annum ut occiderent tertiam partem hominum"
      en: "And the four angels were loosed, who were prepared for an hour, and a day, and a month, and a year: for to kill the third part of men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et numerus equestris exercitus vicies milies dena milia audivi numerum eorum"
      en: "And the number of the army of horsemen was twenty thousand times ten thousand. And I heard the number of them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ita vidi equos in visione et qui sedebant super eos habentes loricas igneas et hyacinthinas et sulphureas et capita equorum erant tamquam capita leonum et de ore ipsorum procedit ignis et fumus et sulphur"
      en: "And thus I saw the horses in the vision: and they that sat on them, had breastplates of fire and of hyacinth and of brimstone, and the heads of the horses were as the heads of lions: and from their mouths proceeded fire, and smoke, and brimstone."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ab his tribus plagis occisa est tertia pars hominum de igne et fumo et sulphure qui procedebat ex ore ipsorum"
      en: "And by these three plagues was slain the third part of men, by the fire and by the smoke and by the brimstone, which issued out of their mouths."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "potestas enim equorum in ore eorum est et in caudis eorum nam caudae illorum similes serpentibus habentes capita et in his nocent"
      en: "For the power of the horses is in their mouths, and in their tails. For, their tails are like to serpents, and have heads: and with them they hurt."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et ceteri homines qui non sunt occisi in his plagis neque paenitentiam egerunt de operibus manuum suarum ut non adorarent daemonia et simulacra aurea et argentea et aerea et lapidea et lignea quae neque videre possunt neque audire neque ambulare"
      en: "And the rest of the men, who were not slain by these plagues, did not do penance from the works of their hands, that they should not adore devils, and idols of gold, and silver, and brass, and stone, and wood, which neither can see, nor hear, nor walk:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et non egerunt paenitentiam ab homicidiis suis neque a veneficiis suis neque a fornicatione sua neque a furtis suis"
      en: "Neither did they penance from their murders, nor from their sorceries, nor from their fornication, nor from their thefts."
    status: { la: verified, en: verified }
