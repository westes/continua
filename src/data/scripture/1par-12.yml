book: 1par
chapter: 12
verses:
  - n: 1
    text:
      la: "hii quoque venerunt ad David in Siceleg cum adhuc fugeret Saul filium Cis qui erant fortissimi et egregii pugnatores"
      en: "Now these are they that came to David to Siceleg, while he yet fled from Saul the son of Cia, and they were most valiant and excellent warriors,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tendentes arcum et utraque manu fundis saxa iacientes et dirigentes sagittas de fratribus Saul ex Beniamin"
      en: "Bending the bow, and using either hand in hurling stones with slings, and shooting arrows: of the brethren of Saul of Benjamin."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "princeps Ahiezer et Ioas filii Sammaa Gabathites et Iazihel et Phallet filii Azmoth et Baracha et Ieu Anathothites"
      en: "The chief was Ahiezer, and Joas, the sons of Samaa of Gabaath, and Jaziel, and Phallet the sons of Azmoth, and Beracha, and Jehu an Anathothite."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Samaias quoque Gabaonites fortissimus inter triginta et super triginta Hieremias et Iezihel et Iohanan et Iezbad Gaderothites"
      en: "And Samaias of Gabaon, the stoutest amongst the thirty and over the thirty; Jeremias, and Jeheziel, and Johanan, and Jezabad of Gaderoth;"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Eluzai et Ierimuth et Baalia et Samaria et Saphatia Aruphites"
      en: "And Eluzai, and Jerimuth, and Baalia, and Samaria, and Saphatia the Haruphite;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Helcana et Iesia et Azrahel et Ioezer et Iesbaam de Careim"
      en: "Elcana, and Jesia, and Azareel, and Joezer, and Jesbaam of Carehim:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ioeela quoque et Zabadia filii Ieroam de Gedor"
      en: "And Joela, and Zabadia the sons of Jeroham of Gedor."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed et de Gaddi transfugerunt ad David cum lateret in deserto viri robustissimi et pugnatores optimi tenentes clypeum et hastam facies eorum quasi facies leonis et veloces quasi capreae in montibus"
      en: "From Gaddi also there went over to David, when he lay hid in the wilderness most valiant men, and excellent warriors, holding shield and spear: whose faces were like the faces of a lion, and they were swift like the roebucks on the mountains."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ezer princeps Obdias secundus Eliab tertius"
      en: "Ezer the chief, Obdias the second, Eliab the third,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Masmana quartus Hieremias quintus"
      en: "Masmana the fourth, Jeremias the fifth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Hetthi sextus Helihel septimus"
      en: "Ethi the sixth, Eliel the seventh,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Iohanan octavus Helzebad nonus"
      en: "Johanan the eighth, Elzebad the ninth,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Hieremias decimus Bachannai undecimus"
      en: "Jerenias the tenth, Machbani the eleventh,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "hii de filiis Gad principes exercitus novissimus centum militibus praeerat et maximus mille"
      en: "These were of the sons of Gad, captains of the army: the least of them was captain over a hundred soldiers, and the greatest over a thousand."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "isti sunt qui transierunt Iordanem mense primo quando inundare consuevit super ripas suas et omnes fugaverunt qui morabantur in vallibus ad orientalem plagam et occidentalem"
      en: "These are they who passed over the Jordan in the first month, when it is used to how over its banks: and they put to flight all that dwelt in the valleys both toward the east and toward the west."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "venerunt autem et de Beniamin et de Iuda ad praesidium in quo morabatur David"
      en: "And there came also of the men of Benjamin, and of Juda to the hold, in which David abode."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "egressusque est David obviam eis et ait si pacifice venistis ad me ut auxiliemini mihi cor meum iungatur vobis si autem insidiamini mihi pro adversariis meis cum ego iniquitatem in manibus non habeam videat Deus patrum nostrorum et iudicet"
      en: "And David went out to meet them, and said: If you are come peaceably to me to help me, let my heart be joined to you: but if you plot against me for my enemies whereas I have no iniquity in my hands, let the God of our fathers see, and judge."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "spiritus vero induit Amessai principem inter triginta et ait tui sumus o David et tecum fili Isai pax pax tibi et pax adiutoribus tuis te enim adiuvat Deus tuus suscepit ergo eos David et constituit principes turmae"
      en: "But the spirit came upon Amasai the chief among thirty, and he said: We are thine, O David, and for thee, O son of Isai: peace, peace be to thee, and peace to thy helpers. For thy God helpeth thee. So David received them, and made them captains of the band."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "porro de Manasse transfugerunt ad David quando veniebat cum Philisthim adversum Saul ut pugnaret et non dimicavit cum eis quia inito consilio remiserunt eum principes Philisthinorum dicentes periculo capitis nostri revertetur ad dominum suum Saul"
      en: "And there were some of Manasses that went over to David, when he came with the Philistines against Saul to fight: but he did not fight with them: because the lords of the Philistines taking counsel sent him back, saying: With the danger of our heads he will return to his master Saul."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quando igitur reversus est in Siceleg transfugerunt ad eum de Manasse Ednas et Iozabad et Iedihel et Michahel et Iozabad et Heliu et Salathi principes milium in Manasse"
      en: "So when he went back to Siceleg, m there fled to him of Manasses, Ednas and Jozabad, and Jedihel, and Michael, and Ednas, and Jozabad, and Eliu, and Salathi, captains of thousands in Manasses."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "hii praebuerunt auxilium David adversum latrunculos omnes enim erant viri fortissimi et facti sunt principes in exercitu"
      en: "These helped David against the rovers: for they were all most valiant men, and were made commanders in the army."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sed et per singulos dies veniebant ad David ad auxiliandum ei usque dum fieret grandis numerus quasi exercitus Dei"
      en: "Moreover day by day there came some to David to help him till they became a great number, like the army of God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "iste quoque est numerus principum exercitus qui venerunt ad David cum esset in Hebron ut transferrent regnum Saul ad eum iuxta verbum Domini"
      en: "And this is the number of the chiefs of the army who came to David, when he was in Hebron, to transfer to him the kingdom of Saul, according to the word of the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filii Iuda portantes clypeum et hastam sex milia octingenti expediti ad proelium"
      en: "The sons of Juda bearing shield and spear, six thousand eight hundred well appointed to war."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "de filiis Symeon virorum fortissimorum ad pugnandum septem milia centum"
      en: "Of the sons of Simeon valiant men for war, seven thousand one hundred."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "de filiis Levi quattuor milia sescenti"
      en: "Of the sons of Levi, four thousand six hundred."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ioiada quoque princeps de stirpe Aaron et cum eo tria milia septingenti"
      en: "And Joiada prince of the race of Aaron, and with him three thousand seven hundred."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Sadoc etiam puer egregiae indolis et domus patris eius principes viginti duo"
      en: "Sadoc also a young man of excellent disposition, and the house of his father, twenty-two principal men."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "de filiis autem Beniamin fratribus Saul tria milia magna enim pars eorum adhuc sequebatur domum Saul"
      en: "And of the sons of Benjamin the brethren of Saul, three thousand: for hitherto a great part of them followed the house of Saul."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "porro de filiis Ephraim viginti milia octingenti fortissimi robore viri nominati in cognationibus suis"
      en: "And of the sons of Ephraim twenty thousand eight hundred, men of great valour renowned in their kindreds."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et ex dimidia parte tribus Manasse decem et octo milia singuli per nomina sua venerunt ut constituerent regem David"
      en: "And of the half tribe of Manasses, eighteen thousand, every one by their names, came to make David king."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "de filiis quoque Isachar viri eruditi qui norant singula tempora ad praecipiendum quid facere deberet Israhel principes ducenti omnis autem reliqua tribus eorum consilium sequebatur"
      en: "Also of the sons of Issachar men of understanding, that knew all times to order what Israel should do, two hundred principal men: and all the rest of the tribe followed their counsel."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "porro de Zabulon qui egrediebantur ad proelium et stabant in acie instructi armis bellicis quinquaginta milia venerunt in auxilium non in corde duplici"
      en: "And of Zabulon such as went forth to battle, and stood in array well appointed with armour for war, there came fifty thousand to his aid, with no double heart."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et de Nepthali principes mille et cum eis instructa clypeo et hasta triginta septem milia"
      en: "And of Nephtali, a thousand leaders: and with them seven and thirty thousand, furnished with shield and spear."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "de Dan etiam praeparata ad proelium viginti octo milia sescentorum"
      en: "Of Dan also twenty-eight thousand six hundred prepared for battle."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et de Aser egredientes ad pugnam et in acie provocantes quadraginta milia"
      en: "And of Aser forty thousand going forth to fight, and challenging in battle."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "trans Iordanem autem de filiis Ruben et Gad et dimidia parte tribus Manasse instructa armis bellicis centum viginti milia"
      en: "And on the other side of the Jordan of the sons of Ruben, and of Gad, and of the half of the tribe of Manasses a hundred and twenty thousand, furnished with arms for war."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "omnes isti viri bellatores et expediti ad pugnandum corde perfecto venerunt in Hebron ut constituerent regem David super universum Israhel sed et omnes reliqui ex Israhel uno corde erant ut rex fieret David"
      en: "All these men of war well appointed to fight, came with a perfect heart to Hebron, to make David king over all Israel: and all the rest also of Israel, were of one heart to make David king."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "fueruntque ibi apud David tribus diebus comedentes et bibentes praeparaverunt enim eis fratres sui"
      en: "And they were there with David three days eating and drinking: for their brethren had prepared for them."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "sed et qui iuxta eos erant usque ad Isachar et Zabulon et Nepthalim adferebant panes in asinis et camelis et mulis et bubus ad vescendum farinam palatas uvam passam vinum oleum boves arietes ad omnem copiam gaudium quippe erat in Israhel"
      en: "Moreover they that were near them even as far as Issachar, and Zabulon, and Nephtali, brought leaves on asses, and on camels, and on mules, and on oxen, to eat: meal, figs, raisins, wine, oil, and oxen, and sheep in abundance, for there was joy in Israel."
    status: { la: verified, en: verified }
