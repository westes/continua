# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: esth
chapter: 7
verses:
  - n: 1
    text:
      la: "intravit itaque rex et Aman ut biberent cum regina"
      en: "So the king and Aman went in, to drink with the queen."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque ei rex etiam in secundo die postquam vino incaluerat quae est petitio tua Hester ut detur tibi et quid vis fieri etiam si dimidiam regni mei partem petieris inpetrabis"
      en: "And the king said to her again the second day, after he was warm with wine: What is thy petition, Esther, that it may be granted thee? and what wilt thou have done: although thou ask the half of my kingdom, thou shalt have it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ad quem illa respondit si inveni gratiam in oculis tuis o rex et si tibi placet dona mihi animam meam pro qua rogo et populum meum pro quo obsecro"
      en: "Then she answered: If I have found Favour in thy sight, O king, and if it please thee, give me my life for which I ask, and my people for which I request."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "traditi enim sumus ego et populus meus ut conteramur iugulemur et pereamus atque utinam in servos et famulas venderemur esset tolerabile malum et gemens tacerem nunc autem hostis noster est cuius crudelitas redundat in regem"
      en: "For we are given up, I and my people, to be destroyed, to be slain, and to perish. And would God we were sold for bondmen and bondwomen: the evil might be borne with, and I would have mourned in silence: but now we have an enemy, whose cruelty redoundeth upon the king."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "respondensque rex Asuerus ait quis est iste et cuius potentiae ut haec audeat facere"
      en: "And king Assuerus answered and said: Who is this, and of what power, that he should do these things?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixit Hester hostis et inimicus noster pessimus iste est Aman quod ille audiens ilico obstipuit vultum regis ac reginae ferre non sustinens"
      en: "And Esther said: It is this Aman that is our adversary and most wicked enemy. Aman hearing this was forthwith astonished, not being able to bear the countenance of the king and of the queen."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "rex autem surrexit iratus et de loco convivii intravit in hortum arboribus consitum Aman quoque surrexit ut rogaret Hester reginam pro anima sua intellexit enim a rege sibi paratum malum"
      en: "But the king being angry rose up, and went from the place of the banquet into the garden set with trees. Aman also rose up to entreat Esther the queen for his life, for he understood that evil was prepared for him by the king."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui cum reversus esset de horto nemoribus consito et intrasset convivii locum repperit Aman super lectulum corruisse in quo iacebat Hester et ait etiam reginam vult opprimere me praesente in domo mea necdum verbum de ore regis exierat et statim operuerunt faciem eius"
      en: "And when the king came back out of the garden set with trees, and entered into the place of the banquet, he found Aman was fallen upon the bed on which Esther lay, and he said: He will force the queen also in my presence, in my own house. The word was not yet gone out of the king's mouth, and immediately they covered his face."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixitque Arbona unus de eunuchis qui stabant in ministerio regis en lignum quod paraverat Mardocheo qui locutus est pro rege stat in domo Aman habens altitudinis quinquaginta cubitos cui dixit rex adpendite eum in eo"
      en: "And Harbona, one of the eunuchs that stood waiting on the king, said: Behold the gibbet which he hath prepared for Mardochai, who spoke for the king, standeth in Aman's house, being fifty cubits high. And the king said to him: Hang him upon it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "suspensus est itaque Aman in patibulo quod paraverat Mardocheo et regis ira quievit"
      en: "So Aman was hanged on the gibbet, which he had prepared for Mardochai: and the king's wrath ceased."
    status: { la: verified, en: verified }
