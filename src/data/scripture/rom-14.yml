# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: rom
chapter: 14
verses:
  - n: 1
    text:
      la: "Infirmum autem in fide assumite, non in disceptationibus cogitationum."
      en: "Now him that is weak in faith, take unto you: not in disputes about thoughts."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Alius enim credit se manducare omnia: qui autem infirmus est, olus manducet."
      en: "For one believeth that he may eat all things: but he that is weak, let him eat herbs."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Is qui manducat, non manducantem non spernat: et qui non manducat, manducantem non judicet: Deus enim illum assumpsit."
      en: "Let not him that eateth, despise him that eateth not: and he that eateth not, let him not judge him that eateth. For God hath taken him to him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Tu quis es, qui judicas alienum servum? domino suo stat, aut cadit: stabit autem: potens est enim Deus statuere illum."
      en: "Who art thou that judgest another man's servant? To his own lord he standeth or falleth. And he shall stand: for God is able to make him stand."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Nam alius judicat diem inter diem: alius autem judicat omnem diem: unusquisque in suo sensu abundet."
      en: "For one judgeth between day and day: and another judgeth every day: let every man abound in his own sense."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui sapit diem, Domino sapit, et qui manducat, Domino manducat: gratias enim agit Deo. Et qui non manducat, Domino non manducat, et gratias agit Deo."
      en: "He that regardeth the day, regardeth it unto the Lord. And he that eateth, eateth to the Lord: for he giveth thanks to God. And he that eateth not, to the Lord he eateth not, and giveth thanks to God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nemo enim nostrum sibi vivit, et nemo sibi moritur."
      en: "For none of us liveth to himself; and no man dieth to himself."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sive enim vivemus, Domino vivimus: sive morimur, Domino morimur. Sive ergo vivimus, sive morimur, Domini sumus."
      en: "For whether we live, we live unto the Lord; or whether we die, we die unto the Lord. Therefore, whether we live, or whether we die, we are the Lord's."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "In hoc enim Christus mortuus est, et resurrexit: ut et mortuorum et vivorum dominetur."
      en: "For to this end Christ died and rose again; that he might be Lord both of the dead and of the living."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tu autem quid judicas fratrem tuum? aut tu quare spernis fratrem tuum? omnes enim stabimus ante tribunal Christi."
      en: "But thou, why judgest thou thy brother? or thou, why dost thou despise thy brother? For we shall all stand before the judgment seat of Christ."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Scriptum est enim: Vivo ego, dicit Dominus, quoniam mihi flectetur omne genu: et omnis lingua confitebitur Deo."
      en: "For it is written: As I live, saith the Lord, every knee shall bow to me, and every tongue shall confess to God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Itaque unusquisque nostrum pro se rationem reddet Deo."
      en: "Therefore every one of us shall render account to God for himself."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Non ergo amplius invicem judicemus: sed hoc judicate magis, ne ponatis offendiculum fratri, vel scandalum."
      en: "Let us not therefore judge one another any more. But judge this rather, that you put not a stumblingblock or a scandal in your brother's way."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Scio, et confido in Domino Jesu, quia nihil commune per ipsum, nisi ei qui existimat quid commune esset, illi commune est."
      en: "I know, and am confident in the Lord Jesus, that nothing is unclean of itself; but to him that esteemeth any thing to be unclean, to him it is unclean."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Si enim propter cibum frater tuus contristatur, jam non secundum caritatem ambulas. Noli cibo tuo illum perdere, pro quo Christus mortuus est."
      en: "For if, because of thy meat, thy brother be grieved, thou walkest not now according to charity. Destroy not him with thy meat, for whom Christ died."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non ergo blasphemetur bonum nostrum."
      en: "Let not then our good be evil spoken of."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non est enim regnum Dei esca et potus: sed justitia, et pax, et gaudium in Spiritu Sancto:"
      en: "For the kingdom of God is not meat and drink; but justice, and peace, and joy in the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui enim in hoc servit Christo, placet Deo, et probatus est hominibus."
      en: "For he that in this serveth Christ, pleaseth God, and is approved of men."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Itaque quae pacis sunt, sectemur: et quae aedificationis sunt, in invicem custodiamus."
      en: "Therefore let us follow after the things that are of peace; and keep the things that are of edification one towards another."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Noli propter escam destruere opus Dei, omnia quidem sunt munda: sed malum est homini, qui per offendiculum manducat."
      en: "Destroy not the work of God for meat. All things indeed are clean: but it is evil for that man who eateth with offence."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Bonum est non manducare carnem, et non bibere vinum, neque in quo frater tuus offenditur, aut scandalizatur, aut infirmatur."
      en: "It is good not to eat flesh, and not to drink wine, nor any thing whereby thy brother is offended, or scandalized, or made weak."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Tu fidem habes? penes temetipsum habe coram Deo. Beatus qui non judicat semetipsum in eo quod probat."
      en: "Hast thou faith? Have it to thyself before God. Blessed is he that condemneth not himself in that which he alloweth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui autem discernit, si manducaverit, damnatus est: quia non ex fide. Omne autem, quod non est ex fide, peccatum est."
      en: "But he that discerneth, if he eat, is condemned; because not of faith. For all that is not of faith is sin."
    status: { la: verified, en: verified }
