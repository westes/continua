# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 26
verses:
  - n: 1
    text:
      la: "cumque intraveris terram quam Dominus Deus tuus tibi daturus est possidendam et obtinueris eam atque habitaveris in illa"
      en: "And when thou art come into the land which the Lord thy God will give thee to possess, and hast conquered it, and dwellest in it:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tolles de cunctis frugibus primitias et pones in cartallo pergesque ad locum quem Dominus Deus tuus elegerit ut ibi invocetur nomen eius"
      en: "Thou shalt take the first of all thy fruits, and put then? in a basket, and shalt go to the place which the Lord thy God shall choose, that his name may be invocated there:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "accedesque ad sacerdotem qui fuerit in diebus illis et dices ad eum profiteor hodie coram Domino Deo tuo quod ingressus sim terram pro qua iuravit patribus nostris ut daret eam nobis"
      en: "And thou shalt go to the priest that shall be in those days, and say to him: I profess this day before the Lord thy God, that I am come into the land, for which he swore to our fathers, that he would give it us."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "suscipiensque sacerdos cartallum de manu eius ponet ante altare Domini Dei tui"
      en: "And the priest taking the basket at thy hand, shall set it before the altar of the Lord thy God:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et loqueris in conspectu Domini Dei tui Syrus persequebatur patrem meum qui descendit in Aegyptum et ibi peregrinatus est in paucissimo numero crevitque in gentem magnam et robustam et infinitae multitudinis"
      en: "And thou shalt speak thus in the sight of the Lord thy God: The Syrian pursued my father, who went down into Egypt, and sojourned there in a very small number, and grew into a nation great and strong and of an infinite multitude."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "adflixeruntque nos Aegyptii et persecuti sunt inponentes onera gravissima"
      en: "And the Egyptians afflicted us, and persecuted us, laying on us most grievous burdens :"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et clamavimus ad Dominum Deum patrum nostrorum qui exaudivit nos et respexit humilitatem nostram et laborem atque angustias"
      en: "And we cried to the Lord God of our fathers: who heard us, and looked down upon our af"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et eduxit nos de Aegypto in manu forti et brachio extento in ingenti pavore in signis atque portentis"
      en: "And brought us out of Egypt with a strong hand, and a stretched out arm, with great terror, with signs and wonders:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et introduxit ad locum istum et tradidit nobis terram lacte et melle manantem"
      en: "And brought us into this place, and gave us this land flowing with milk and honey."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et idcirco nunc offero primitias frugum terrae quam dedit Dominus mihi et dimittes eas in conspectu Domini Dei tui adorato Domino Deo tuo"
      en: "And therefore now I offer the firstfruits of the land which the Lord hath given me. And thou shalt leave them in the sight of the ford thy God, adoring the Lord thy God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et epulaberis in omnibus bonis quae Dominus Deus tuus dederit tibi et domui tuae tu et Levites et advena qui tecum est"
      en: "And thou shalt feast in all the good things which the Lord thy God hath given thee, and thy house, thou and the Levite, and the stranger that is with thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quando conpleveris decimam cunctarum frugum tuarum anno decimarum tertio dabis Levitae et advenae et pupillo et viduae ut comedant intra portas tuas et saturentur"
      en: "When thou hast made an end of tithing all thy fruits, in the third year of tithes thou shalt give it to the Levite, and to the stranger, and to the fatherless, and to the widow, that they may eat within thy gates, and be filled:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "loquerisque in conspectu Domini Dei tui abstuli quod sanctificatum est de domo mea et dedi illud Levitae et advenae pupillo et viduae sicut iussisti mihi non praeterivi mandata tua nec sum oblitus imperii"
      en: "And thou shalt speak thus in the sight of the Lord thy God: I have taken that which was sanctified out of my house, and I have given it to the Levite, and to the stranger, and to the fatherless, and to the widow, as thou hast commanded me: I have not transgressed thy commandments nor forgotten thy precepts."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "non comedi ex eis in luctu meo nec separavi ea in qualibet inmunditia nec expendi ex his quicquam in re funebri oboedivi voci Domini Dei mei et feci omnia sicut praecepisti mihi"
      en: "I have not eaten of them is my mourning, nor separated them for any uncleanness, nor spent any thing of them in funerals. I have obeyed the voice of the Lord my God, and have done all things as thou hast commanded me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "respice de sanctuario tuo de excelso caelorum habitaculo et benedic populo tuo Israhel et terrae quam dedisti nobis sicut iurasti patribus nostris terrae lacte et melle mananti"
      en: "Look from thy sanctuary, and thy high habitation of heaven, and bless thy people Israel, and the land which thou hast given us, as thou didst swear to our fathers, a land flowing with milk and honey."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hodie Dominus Deus tuus praecepit tibi ut facias mandata haec atque iudicia et custodias et impleas ex toto corde tuo et ex tota anima tua"
      en: "This day the Lord thy God hath commanded thee to do these commandments and judgments: and to keep and fulfil them with all thy heart, and with all thy soul."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dominum elegisti hodie ut sit tibi Deus et ambules in viis eius et custodias caerimonias illius et mandata atque iudicia et oboedias eius imperio"
      en: "Thou hast chosen the Lord this day to be thy God, and to walk in his ways and keep his ceremonies, and precepts, end judgments, and obey his command."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Dominus elegit te hodie ut sis ei populus peculiaris sicut locutus est tibi et custodias omnia praecepta eius"
      en: "And the Lord hath chosen thee this day, to be his peculiar people, as he hath spoken to thee, and to keep all his commandments:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et faciat te excelsiorem cunctis gentibus quas creavit in laudem et nomen et gloriam suam ut sis populus sanctus Domini Dei tui sicut locutus est"
      en: "And to make thee higher than all nations which he hath created, to his own praise, and name, and glory: that thou mayst be a holy people of the Lord thy God, as he hath spoken."
    status: { la: verified, en: verified }
