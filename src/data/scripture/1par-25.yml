book: 1par
chapter: 25
verses:
  - n: 1
    text:
      la: "igitur David et magistratus exercitus secreverunt in ministerium filios Asaph et Heman et Idithun qui prophetarent in citharis et psalteriis et cymbalis secundum numerum suum dedicato sibi officio servientes"
      en: "Moreover David and the chief .officers of the army separated for the ministry the sons of Asaph, and of Heman, and of Idithun : to prophesy with harps, and with psalteries, and with cymbals according to their number serving in their appointed office."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "de filiis Asaph Zacchur et Ioseph et Nathania et Asarela filii Asaph sub manu Asaph prophetantis iuxta regem"
      en: "Of the sons of Asaph: Zacchur, and Joseph, and Nathania, and Asarela, sons of Asaph: under the hand of Asaph prophesying near the king."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "porro Idithun filii Idithun Godolias Sori Iesaias et Sabias et Matthathias sex sub manu patris sui Idithun qui in cithara prophetabat super confitentes et laudantes Dominum"
      en: "And of Idithun: the sons of Idithun, Godolias, Serf, Jeseias, and Hasabias, and Mathathias, six, under the hand of their father Idithun, who prophesied with a harp to give thanks and to praise the Lord."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Heman quoque filii Heman Bocciau Matthaniau Ozihel Subuhel et Ierimoth Ananias Anani Elietha Geddelthi et Romemthiezer et Iesbacasa Mellothi Othir Mazioth"
      en: "Of Heman also: the sons of Heman, Bocciau, Mathaniau, Oziel, Subuel, and Jerimoth, Hananias, Hanani, Eliatha, Geddelthi, and Romemthiezer, and Jesbacassa, Mellothi, Othir, Mahazioth:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "omnes isti filii Heman videntis regis in sermonibus Dei ut exaltaret cornu deditque Deus Heman filios quattuordecim et filias tres"
      en: "All these were the sons of Heman the seer of the king in the words of God, to lift up the horn: and God gave to Heman fourteen sons and three daughters."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "universi sub manu patris sui ad cantandum in templo Domini distributi erant in cymbalis et psalteriis et citharis in ministeria domus Domini iuxta regem Asaph videlicet et Idithun et Heman"
      en: "All these under their father's hand were distributed to sing in the temple of the Lord, with cymbals, and psalteries and harps, for the service of the house of the Lord near the king: to wit, Asaph, and Idithun, and Heman."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "fuit autem numerus eorum cum fratribus suis qui erudiebant canticum Domini cuncti doctores ducenti octoginta octo"
      en: "And the number of them with their brethren, that taught the song of the Lord, all the teachers, were two hundred and eighty-eight,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "miseruntque sortes per vices suas ex aequo tam maior quam minor doctus pariter et indoctus"
      en: "And they cast lots by their courses, the elder equally with the younger, the learned and the unlearned together."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "egressaque est sors prima Ioseph qui erat de Asaph secunda Godoliae ipsi et filiis eius et fratribus duodecim"
      en: "And the first lot came forth to Joseph, who was of Asaph. The second to Godolias, to him and his sons, and his brethren twelve."
