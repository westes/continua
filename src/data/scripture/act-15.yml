# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 15
verses:
  - n: 1
    text:
      la: "Et quidam descendentes de Judaea, docebant fratres: Quia nisi circumcidamini secundum morem Moysi, non potestis salvari."
      en: "And some coming down from Judea, taught the brethren: That except you be circumcised after the manner of Moses, you cannot be saved."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Facta ergo seditione non minima Paulo et Barnabae adversus illos, statuerunt ut ascenderent Paulus, et Barnabas, et quidam alii ex aliis ad Apostolos et presbyteros in Jerusalem super hac quaestione."
      en: "And when Paul and Barnabas had no small contest with them, they determined that Paul and Barnabas, and certain others of the other side, should go up to the apostles and priests to Jerusalem about this question."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Illi ergo deducti ab ecclesia pertransibant Phoenicen et Samariam, narrantes conversionem gentium: et faciebant gaudium magnum omnibus fratribus."
      en: "They therefore being brought on their way by the church, passed through Phenice, and Samaria, relating the conversion of the Gentiles; and they caused great joy to all the brethren."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cum autem venissent Jerosolymam, suscepti sunt ab ecclesia, et ab Apostolis, et senioribus annuntiantes quanta Deus fecisset cum illis."
      en: "And when they were come to Jerusalem, they were received by the church, and by the apostles and ancients, declaring how great things God had done with them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Surrexerunt autem quidam de haeresi pharisaeorum, qui crediderunt, dicentes: Quia oportet circumcidi eos, praecipere quoque servare legem Moysi."
      en: "But there arose some of the sect of the Pharisees that believed, saying: They must be circumcised, and be commanded to observe the law of Moses."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Conveneruntque Apostoli et seniores videre de verbo hoc."
      en: "And the apostles and ancients assembled to consider of this matter."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum autem magna conquisitio fieret, surgens Petrus dixit ad eos: Viri fratres, vos scitis quoniam ab antiquis diebus Deus in nobis elegit, per os meum, audire gentes verbum Evangelii, et credere."
      en: "And when there had been much disputing, Peter, rising up, said to them: Men, brethren, you know, that in former days God made choice among us, that by my mouth the Gentiles should hear the word of the gospel, and believe."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et qui novit corda Deus, testimonium perhibuit, dans illis Spiritum Sanctum, sicut et nobis,"
      en: "And God, who knoweth the hearts, gave testimony, giving unto them the Holy Ghost, as well as to us;"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et nihil discrevit inter nos et illos, fide purificans corda eorum."
      en: "And put no difference between us and them, purifying their hearts by faith."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nunc ergo quid tentatis Deum, imponere jugum super cervices discipulorum quod neque patres nostri, neque nos portare potuimus?"
      en: "Now therefore, why tempt you God to put a yoke upon the necks of the disciples, which neither our fathers nor we have been able to bear?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sed per gratiam Domini Jesu Christi credimus salvari, quemadmodum et illi."
      en: "But by the grace of the Lord Jesus Christ, we believe to be saved, in like manner as they also."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tacuit autem omnis multitudo: et audiebant Barnabam et Paulum narrantes quanta Deus fecisset signa et prodigia per eos."
      en: "And all the multitude held their peace; and they heard Barnabas and Paul telling what great signs and wonders God had wrought among the Gentiles by them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et postquam tacuerunt, respondit Jacobus, dicens: Viri fratres, audite me."
      en: "And after they had held their peace, James answered, saying: Men, brethren, hear me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Simon narravit quemadmodum primum Deus visitavit sumere ex gentibus populum nomini suo."
      en: "Simon hath related how God first visited to take of the Gentiles a people to his name."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et huic concordant verba prophetarum sicut scriptum est:"
      en: "And to this agree the words of the prophets, as it is written:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Post haec revertar, et reaedificabo tabernaculum David, quod decidit: et diruta ejus reaedificabo, et erigam illud:"
      en: "After these things I will return, and will rebuild the tabernacle of David, which is fallen down; and the ruins thereof I will rebuild, and I will set it up:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut requirant ceteri hominum Dominum, et omnes gentes, super quas invocatum est nomen meum, dicit Dominus faciens haec."
      en: "That the residue of men may seek after the Lord, and all nations upon whom my name is invoked, saith the Lord, who doth these things."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Notum a saeculo est Domino opus suum."
      en: "To the Lord was his own work known from the beginning of the world."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Propter quod ego judico non inquietari eos qui ex gentibus convertuntur ad Deum,"
      en: "For which cause I judge that they, who from among the Gentiles are converted to God, are not to be disquieted."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sed scribere ad eos ut abstineant se a contaminationibus simulacrorum, et fornicatione, et suffocatis, et sanguine."
      en: "But that we write unto them, that they refrain themselves from the pollutions of idols, and from fornication, and from things strangled, and from blood."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Moyses enim a temporibus antiquis habet in singulis civitatibus qui eum praedicent in synagogis, ubi per omne sabbatum legitur."
      en: "For Moses of old time hath in every city them that preach him in the synagogues, where he is read every sabbath."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Tunc placuit Apostolis, et senioribus cum omni ecclesia, eligere viros ex eis, et mittere Antiochiam cum Paulo et Barnaba, Judam, qui cognominabatur Barsabas, et Silam, viros primos in fratribus,"
      en: "Then it pleased the apostles and ancients, with the whole church, to choose men of their own company, and to send to Antioch, with Paul and Barnabas, namely, Judas, who was surnamed Barsabas, and Silas, chief men among the brethren."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "scribentes per manus eorum: Apostoli et seniores fratres, his qui sunt Antiochiae, et Syriae, et Ciliciae, fratribus ex gentibus, salutem."
      en: "Writing by their hands: The apostles and ancients, brethren, to the brethren of the Gentiles that are at Antioch, and in Syria and Cilicia, greeting."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Quoniam audivimus quia quidam ex nobis exeuntes, turbaverunt vos verbis, evertentes animas vestras, quibus non mandavimus:"
      en: "Forasmuch as we have heard, that some going out from us have troubled you with words, subverting your souls; to whom we gave no commandment:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "placuit nobis collectis in unum eligere viros, et mittere ad vos cum carissimis nostris Barnaba et Paulo,"
      en: "It hath seemed good to us, being assembled together, to choose out men, and to send them unto you, with our well beloved Barnabas and Paul:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "hominibus qui tradiderunt animas suas pro nomine Domini nostri Jesu Christi."
      en: "Men that have given their lives for the name of our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Misimus ergo Judam et Silam, qui et ipsi vobis verbis referent eadem."
      en: "We have sent therefore Judas and Silas, who themselves also will, by word of mouth, tell you the same things."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Visum est enim Spiritui Sancto, et nobis nihil ultra imponere vobis oneris quam haec necessaria:"
      en: "For it hath seemed good to the Holy Ghost and to us, to lay no further burden upon you than these necessary things:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ut abstineatis vos ab immolatis simulacrorum, et sanguine, et suffocato, et fornicatione, a quibus custodientes vos, bene agetis. Valete."
      en: "That you abstain from things sacrificed to idols, and from blood, and from things strangled, and from fornication; from which things keeping yourselves, you shall do well. Fare ye well."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Illi ergo dimissi, descendeunt Antiochiam: et congregata multitudine tradiderunt epistolam."
      en: "They therefore being dismissed, went down to Antioch; and gathering together the multitude, delivered the epistle."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Quam cum legissent, gavisi sunt super consolatione."
      en: "Which when they had read, they rejoiced for the consolation."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Judas autem, et Silas, et ipsi cum essent prophetae, verbo plurimo consolati sunt fratres, et confirmaverunt."
      en: "But Judas and Silas, being prophets also themselves, with many words comforted the brethren, and confirmed them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Facto autem ibi aliquanto tempore, dimissi sunt cum pace a fratribus ad eos, qui miserant illos."
      en: "And after they had spent some time there, they were let go with peace by the brethren, unto them that had sent them."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Visum est autem Silae ibi remanere: Judas autem solus abiit Jerusalem."
      en: "But it seemed good unto Silas to remain there; and Judas alone departed to Jerusalem."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Paulus autem et Barnabas demorabantur Antiochiae docentes, et evangelizantes cum aliis pluribus verbum Domini."
      en: "And Paul and Barnabas continued at Antioch, teaching and preaching, with many others, the word of the Lord."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Post aliquot autem dies, dixit ad Barnabam Paulus: Revertentes visitemus fratres per universas civitates, in quibus praedicavimus verbum Domini, quomodo se habeant."
      en: "And after some days, Paul said to Barnabas: Let us return and visit our brethren in all the cities wherein we have preached the word of the Lord, to see how they do."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Barnabas autem volebat secum assumere et Joannem, qui cognominabatur Marcus."
      en: "And Barnabas would have taken with them John also, that was surnamed Mark;"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Paulus autem rogabat eum ( ut qui discessisset ab eis de Pamphylia, et non isset cum eis in opus) non debere recipi."
      en: "But Paul desired that he (as having departed from them out of Pamphylia, and not gone with them to the work) might not be received."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Facta est autem dissensio, ita ut discederent ab invicem et Barnabas quidem, assumpto Marco, navigaret Cyprum."
      en: "And there arose a dissension, so that they departed one from another; and Barnabas indeed taking Mark, sailed to Cyprus."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Paulus vero, electo Sila, profectus est, traditus gratiae Dei a fratribus."
      en: "But Paul choosing Silas, departed, being delivered by the brethren to the grace of God."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Perambulabat autem Syriam et Ciliciam, confirmans ecclesias: praecipiens custodire praecepta Apostolorum et seniorum."
      en: "And he went through Syria and Cilicia, confirming the churches, commanding them to keep the precepts of the apostles and the ancients."
    status: { la: verified, en: verified }
