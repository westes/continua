# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 19
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen et Aaron, dicens:"
      en: "And the Lord spoke to Moses and Aaron, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ista est religio victimae, quam constituit Dominus. Praecipe filiis Israel, ut adducant ad te vaccam rufam aetatis integrae, in qua nulla sit macula, nec portaverit jugum:"
      en: "This is the observance of the victim, which the Lord hath ordained. Command the children of Israel, that they bring unto thee a red cow of full age, in which there is no blemish, and which hath not carried the yoke:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tradetisque eam Eleazaro sacerdoti, qui eductam extra castram, immolabit in conspectu omnium:"
      en: "And you shall deliver her to Eleazar the priest, who shall bring her forth without the camp, and shall immolate her in the sight of all:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et tingens digitum in sanguine ejus, asperget contra fores tabernaculi septem vicibus,"
      en: "And dipping his finger in her blood, shall sprinkle it over against the door of the tabernacle seven times,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "comburetque eam cunctis videntibus, tam pelle et carnibus ejus quam sanguine et fimo flammae traditis."
      en: "And shall burn her in the sight of all, delivering up to the fire her skin, and her flesh, and her blood, and her dung."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Lignum quoque cedrinum, et hyssopum, coccumque bis tinctum sacerdos mittet in flammam, quae vaccam vorat."
      en: "The priest shall also take cedar wood, and hyssop, and scarlet twice dyed, and cast it into the flame, with which the cow is consumed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et tunc demum, lotis vestibus et corpore suo, ingredietur in castra, commaculatusque erit usque ad vesperum."
      en: "And then after washing his garments, and body, he shall enter into the camp, and shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sed et ille qui combusserit eam, lavabit vestimenta sua et corpus, et immundus erit usque ad vesperum."
      en: "He also that hath burned her, shall wash his garments, and his body, and shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Colliget autem vir mundus cineres vaccae, et effundet eos extra castra in loco purissimo, ut sint multitudini filiorum Israel in custodiam, et in aquam aspersionis: quia pro peccato vacca combusta est."
      en: "And a man that is clean shall gather up the ashes of the cow, and shall pour them forth without the camp in a most clean place, that they may be reserved for the multitude of the children of Israel, and for a water of aspersion: because the cow was burnt for sin."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cumque laverit qui vaccae portaverat cineres vestimenta sua, immundus erit usque ad vesperum. Habebunt hoc filii Israel, et advenae qui habitant inter eos, sanctum jure perpetuo."
      en: "And when he that carried the ashes of the cow, hath washed his garments, he shall be unclean until the evening. The children of Israel, and the strangers that dwell among them, shall observe this for a holy thing by a perpetual ordinance."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui tetigerit cadaver hominis, et propter hoc septem diebus fuerit immundus,"
      en: "He that toucheth the corpse of a man, and is therefore unclean seven days,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "aspergetur ex hac aqua die tertio et septimo, et sic mundabitur. Si die tertio aspersus non fuerit, septimo non poterit emundari."
      en: "Shall be sprinkled with this water on the third day, and on the seventh, and so shall be cleansed. If he were not sprinkled on the third day, he cannot be cleansed on the seventh."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Omnis qui tetigerit humanae animae morticinum, et aspersus hac commistione non fuerit, polluet tabernaculum Domini et peribit ex Israel: quia aqua expiationis non est aspersus, immundus erit, et manebit spurcitia ejus super eum."
      en: "Every one that toucheth the corpse of a man, and is not sprinkled with mixture, shall profane the tabernacle of the Lord, and shall perish out of Israel: because he was not sprinkled with the water of expiation, he shall be unclean, and his uncleanness shall remain upon him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ista est lex hominis qui moritur in tabernaculo: omnes qui ingrediuntur tentorium illius, et universa vasa quae ibi sunt, polluta erunt septem diebus."
      en: "This is the law of a man that dieth in a tent: All that go into his tent and all the vessels that are there, shall be unclean seven days."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vas, quod non habuerit operculum nec ligaturam desuper, immundum erit."
      en: "The vessel that hath no cover, nor binding over it, shall be unclean."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Si quis in agro tetigerit cadaver occisi hominis, aut per se mortui, sive os illius, vel sepulchrum, immundus erit septem diebus."
      en: "If any man in the field touch the corpse of a man that was slain, or that died of himself, or his bone, or his grave, he shall be unclean seven days."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tollentque de cineribus combustionis atque peccati, et mittent aquas vivas super eos in vas:"
      en: "And they shall take of the ashes of the burning and of the sin offering, and shall pour living waters upon them into a vessel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "in quibus cum homo mundus tinxerit hyssopum, asperget ex eo omne tentorium, et cunctam supellectilem, et homines hujuscemodi contagione pollutos:"
      en: "And a man that is clean shall dip hyssop in them, and shall sprinkle therewith all the tent, and all the furniture, and the men that are defiled with touching any such thing:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "atque hoc modo mundus lustrabit immundum tertio et septimo die: expiatusque die septimo, lavabit et se et vestimenta sua, et immundus erit usque ad vesperum."
      en: "And in this manner he that is clean shall purify the unclean on the third and on the seventh day. And being expiated the seventh day, he shall wash both himself and his garments, and be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Si quis hoc ritu non fuerit expiatus, peribit anima illius de medio ecclesiae: quia sanctuarium Domini polluit, et non est aqua lustrationis aspersus."
      en: "If any man be not expiated after this rite, his soul shall perish out of the midst of the church: because he hath profaned the sanctuary of the Lord, and was not sprinkled with the water of purification."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Erit hoc praeceptum legitimum sempiternum. Ipse quoque qui aspergit aquas, lavabit vestimenta sua. Omnis qui tetigerit aquas expiationis, immundus erit usque ad vesperum."
      en: "This precept shall be an ordinance for ever. He also that sprinkled the water, shall wash his garments. Every one that shall touch the waters of expiation, shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quidquid tetigerit immundus, immundum faciet: et anima, quae horum quippiam tetigerit, immunda erit usque ad vesperum."
      en: "Whatsoever a person toucheth who is unclean, he shall make it unclean: and the person that toucheth any of these things, shall be unclean until the evening."
    status: { la: verified, en: verified }
