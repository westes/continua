# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 15
verses:
  - n: 1
    text:
      la: "cumque omnis exercitus decollatum Holofernem audisset fugit mens et consilium ab eis et solo tremore et metu agitati fugae praesidium sumunt"
      en: "And when all the army heard that Holofernes was beheaded, courage and counsel fled from them, and being seized with trembling and fear they thought only to save themselves by flight:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ita ut nullus loqueretur cum proximo suo sed inclinato capite relictis omnibus evadere Hebraeos quos armatos venire super se audierant fugientes per vias camporum et semitas collium"
      en: "So that no one spoke to his neighbor, but hanging down the head, leaving all things behind, they made haste to escape from the Hebrews, who, as they heard, were coming armed upon them, and fled by the ways of the fields, and the paths of the hills."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "videntes itaque filii Israhel fugientes illos descenderunt clangentes tubis et ululantes post ipsos"
      en: "So the children of Israel seeing them fleeing, followed after them. And they went down sounding with trumpets and shouting after them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et quoniam Assyrii non adunati in fuga ibant praecipites filii autem Israhel uno agmine persequentes debilitabant omnes quos invenire potuissent"
      en: "And because the Assyrians were not united together, they went without order in their flight ; but the children of Israel pursuing in one body, defeated all that they could find."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "misitque Ozias nuntios per omnes civitates et regiones Israhel"
      en: "And Ozias sent messengers through all the cities and countries of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "omnis itaque regio omnisque urbs electam iuventutem misit armatam post eos et persecuti sunt eos in ore gladii quousque pervenirent ad extremitatem finium suarum"
      en: "And every country, and every city, sent their chosen young men armed after them, and they pursued them with the edge of the sword until they came to the extremities of their confines."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "reliqui autem qui erant in Bethulia ingressi sunt castra Assyriorum et praedam quam fugientes Assyrii reliquerant abstulerunt et honestati sunt valde"
      en: "And the rest that were in Bethulia went into the camp of the Assyrians, and took away the spoils, which the Assyrians in their flight had left behind them, and they were laden exceedingly."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "hii vero qui victores reversi sunt ad Bethuliam omnia quaeque erant illorum abstulerunt secum ita ut non esset numerus in pecoribus in iumentis et universis mobilibus eorum ut a minimo usque ad magnum omnes divites fierent de praedationibus eorum"
      en: "But they that returned conquerors to Bethulia, brought with them all things that were theirs, so that there was no numbering of their cattle, and beasts, and all their moveables, insomuch that from the least to the greatest all were made rich by their spoils."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ioachim autem summus pontifex de Hierusalem venit in Bethuliam cum universis presbyteris suis ut videret Iudith"
      en: "And Joachim the high priest came from Jerusalem to Bethulia with all his ancients to see Judith."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quae cum exisset ad illum benedixerunt illam omnes una voce dicentes tu gloria Hierusalem tu laetitia Israhel tu honorificentia populi nostri"
      en: "And when she was come out to him, they all blessed her with one voice, saying: Thou art the glory of Jerusalem, thou art the joy of Israel, thou art the honour of our people:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quia fecisti viriliter et confortatum est cor tuum eo quod castitatem amaveris et post virum tuum alterum non scieris ideo et manus Domini confortavit te et ideo eris benedicta in aeternum"
      en: "For thou hast done manfully, and thy heart has been strengthened, because thou hast loved chastity, and after thy husband hast not known any other: therefore also the hand of the Lord hath strengthened thee, and therefore thou shalt be blessed for ever."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dixit omnis populus fiat fiat"
      en: "And all the people said: So be it, so be it"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "per dies autem triginta vix collecta est spolia Assyriorum a populo Israhel"
      en: "And thirty days were scarce sufficient for the people of Israel to gather up the spoils of the Assyrians."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "porro autem universa quae Holofernis peculiaria fuisse probata sunt dederunt Iudith in auro et argento et vestibus et gemmis et omni supellectile et tradita sunt illi omnia a populo"
      en: "But all those things that were proved to be the peculiar goods of Holofernes, they gave to Judith in gold, and silver, and garments and precious stones, and all household stuff, and they all were delivered to her by the people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et omnes populi gaudebant cum mulieribus et virginibus et iuvenibus in organis et citharis"
      en: "And all the people rejoiced, with the women, and virgins, and young men, playing on instruments and harps."
    status: { la: verified, en: verified }
