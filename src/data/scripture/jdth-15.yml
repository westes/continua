# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdth
chapter: 15
verses:
  - n: 1
    text:
      la: "Cumque omnis exercitus decollatum Holofernem audisset, fugit mens et consilium ab eis, et solo tremore et metu agitati, fugae praesidium sumunt,"
      en: "And when all the army heard that Holofernes was beheaded, courage and counsel fled from them, and being seized with trembling and fear they thought only to save themselves by flight:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ita ut nullus loqueretur cum proximo suo, sed inclinato capite, relictis omnibus, evadere festinabant Hebraeos, quos armatos super se venire audiebant, fugientes per vias camporum et semitas collium."
      en: "So that no one spoke to his neighbour, but hanging down the head, leaving all things behind, they made haste to escape from the Hebrews, who, as they heard, were coming armed upon them, and fled by the ways of the fields, and the paths of the hills."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Videntes itaque filii Israel fugientes, secuti sunt illos. Descenderuntque clangentes tubis, et ululantes post ipsos."
      en: "So the children of Israel seeing them fleeing, followed after them. And they went down sounding with trumpets and shouting after them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et quoniam Assyrii non adunati, in fugam ibant praecipites: filii autem Israel uno agmine persequentes debilitabant omnes, quos invenire potuissent."
      en: "And because the Assyrians were not united together, they went without order in their flight; but the children of Israel pursuing in one body, defeated all that they could find."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Misit itaque Ozias nuntios per omnes civitates et regiones Israel."
      en: "And Ozias sent messengers through all the cities and countries of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Omnis itaque regio, omnisque urbs electam juventutem armatam misit post eos, et persecuti sunt eos in ore gladii, quousque pervenirent ad extremitatem finium suorum."
      en: "And every country, and every city, sent their chosen young men armed after them, and they pursued them with the edge of the sword until they came to the extremities of their confines."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Reliqui autem, qui erant in Bethulia, ingressi sunt castra Assyriorum, et praedam, quam fugientes Assyrii reliquerant, abstulerunt, et onustati sunt valde."
      en: "And the rest that were in Bethulia went into the camp of the Assyrians, and took away the spoils, which the Assyrians in their flight had left behind them, and they were laden exceedingly."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Hi vero, qui victores reversi sunt ad Bethuliam, omnia quae erant illorum attulerunt secum, ita ut non esset numerus in pecoribus et jumentis et universis mobilibus eorum, ut a minimo usque ad maximum omnes divites fierent de praedationibus eorum."
      en: "But they that returned conquerors to Bethulia, brought with them all things that were theirs, so that there was no numbering of their cattle, and beasts, and all their moveables, insomuch that from the least to the greatest all were made rich by their spoils."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Joacim autem summus pontifex de Jerusalem venit in Bethuliam cum universis presbyteris suis ut videret Judith."
      en: "And Joachim the high priest came from Jerusalem to Bethulia with all his ancients to see Judith."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quae cum exisset ad illum, benedixerunt eam omnes una voce, dicentes: Tu gloria Jerusalem; tu laetitia Israel; tu honorificentia populi nostri:"
      en: "And when she was come out to him, they all blessed her with one voice, saying: Thou art the glory of Jerusalem, thou art the joy of Israel, thou art the honour of our people:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quia fecisti viriliter, et confortatum est cor tuum, eo quod castitatem amaveris, et post virum tuum, alterum nescieris: ideo et manus Domini confortavit te, et ideo eris benedicta in aeternum."
      en: "For thou hast done manfully, and thy heart has been strengthened, because thou hast loved chastity, and after thy husband hast not known any other: therefore also the hand of the Lord hath strengthened thee, and therefore thou shalt be blessed for ever."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et dixit omnis populus: Fiat, fiat."
      en: "And all the people said: So be it, so be it."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Per dies autem triginta, vix collecta sunt spolia Assyriorum a populo Israel."
      en: "And thirty days were scarce sufficient for the people of Israel to gather up the spoils of the Assyrians."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Porro autem universa quae Holofernis peculiaria fuisse probata sunt, dederunt Judith in auro, et argento, et vestibus, et gemmis, et omni supellectili, et tradita sunt omnia illi a populo."
      en: "But all those things that were proved to be the peculiar goods of Holofernes, they gave to Judith in gold, and silver, and garments and precious stones, and all household stuff, and they all were delivered to her by the people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et omnes populi gaudebant cum mulieribus, et virginibus, et juvenibus, in organis, et citharis."
      en: "And all the people rejoiced, with the women, and virgins, and young men, playing on instruments and harps."
    status: { la: verified, en: verified }
