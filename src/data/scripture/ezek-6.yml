# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 6
verses:
  - n: 1
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hominis, pone faciem tuam ad montes Israel, et prophetabis ad eos,"
      en: "Son of man, set thy face towards the mountains of Israel, and prophesy against them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dices: Montes Israel, audite verbum Domini Dei. Haec dicit Dominus Deus montibus et collibus, rupibus et vallibus: Ecce ego inducam super vos gladium, et disperdam excelsa vestra,"
      en: "And say: Ye mountains of Israel, hear the word of the Lord God: Thus saith the Lord God to the mountains, and to the hills, and to the rocks, and the valleys: Behold, I will bring upon you the sword, and I will destroy your high places."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et demoliar aras vestras, et confringentur simulacra vestra, et dejiciam interfectos vestros ante idola vestra:"
      en: "And I will throw down your altars, and your idols shall be broken in pieces: and I will cast down your slain before your idols."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dabo cadavera filiorum Israel ante faciem simulacrorum vestrorum, et dispergam ossa vestra circum aras vestras:"
      en: "And I will lay the dead carcasses of the children of Israel before your idols: and I will scatter your bones round about your altars,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in omnibus habitationibus vestris urbes desertae erunt, et excelsa demolientur et dissipabuntur: et interibunt arae vestrae, et confringentur, et cessabunt idola vestra, et conterentur delubra vestra, et delebuntur opera vestra:"
      en: "In all your dwelling places. The cities shall be laid waste, and the high places shall be thrown down, and destroyed, and your altars shall be abolished, and shall be broken in pieces: and your idols shall be no more, and your temples shall be destroyed, and your works shall be defaced."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et cadet interfectus in medio vestri, et scietis quia ego sum Dominus."
      en: "And the slain shall fall in the midst of you: and you shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et relinquam in vobis eos qui fugerint gladium in gentibus, cum dispersero vos in terris:"
      en: "And I will leave in you some that shall escape the sword among the nations, when I shall have scattered you, through the countries."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et recordabuntur mei liberati vestri in gentibus ad quas captivi ducti sunt: quia contrivi cor eorum fornicans et recedens a me, et oculos eorum fornicantes post idola sua: et displicebunt sibimet super malis quae fecerunt in universis abominationibus suis."
      en: "And they that are saved of you shall remember me amongst the nations to which they are carried captives: because I have broken their heart that was faithless, and revolted from me: and their eyes that went a fornicating after their idols: and they shall be displeased with themselves because of the evils which they have committed in all their abominations."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et scient quia ego Dominus non frustra locutus sum, ut facerem eis malum hoc."
      en: "And they shall know that I the Lord have not spoken in vain that I would do this evil to them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Haec dicit Dominus Deus: Percute manum tuam et allide pedem tuum, et dic, Heu! ad omnes abominationes malorum domus Israel, quia gladio, fame et peste ruituri sunt."
      en: "Thus saith the Lord God: Strike with thy hand, and stamp with thy foot, and say: Alas, for all the abominations of the evils of the house of Israel: for they shall fall by the sword, by the famine and by the pestilence."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Qui longe est, peste morietur: qui autem prope, gladio corruet: et qui relictus fuerit et obsessus, fame morietur: et complebo indignationem meam in eis."
      en: "He that is far off shall die of the pestilence: and he that is near, shall fall by the sword: and he that remaineth, and is besieged, shall die by the famine: and I will accomplish my indignation upon them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et scietis quia ego Dominus, cum fuerint interfecti vestri in medio idolorum vestrorum, in circuitu ararum vestrarum, in omni colle excelso, et in cunctis summitatibus montium, et subtus omne lignum nemorosum, et subtus universam quercum frondosam, locum ubi accenderunt thura redolentia universis idolis suis."
      en: "And you shall know that I am the Lord, when your slain shall be amongst your idols, round about your altars, in every high hill, and on all the tops of mountains, and under every woody tree, and under every thick oak, the place where they burnt sweet smelling frankincense to all their idols."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et extendam manum meam super eos: et faciam terram desolatam, et destitutam, a deserto Deblatha, in omnibus habitationibus eorum: et scient quia ego Dominus."
      en: "And I will stretch forth my hand upon them: and I will make the land desolate, and abandoned from the desert of Deblatha in all their dwelling places: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
