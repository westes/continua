# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1reg
chapter: 8
verses:
  - n: 1
    text:
      la: "factum est autem cum senuisset Samuhel posuit filios suos iudices Israhel"
      en: "And it came to pass when Samuel was old, that he appointed his sons to be judges over Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fuitque nomen filii eius primogeniti Iohel et nomen secundi Abia iudicum in Bersabee"
      en: "Now the name of his firstborn son was Joel: and the name of the second was Abia, judges in Bersabee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et non ambulaverunt filii illius in viis eius sed declinaverunt post avaritiam acceperuntque munera et perverterunt iudicium"
      en: "And his sons walked not in his ways: but they turned aside after lucre, and took bribes, and perverted judgment."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "congregati ergo universi maiores natu Israhel venerunt ad Samuhel in Ramatha"
      en: "Then all the ancients of Israel being assembled, came to Samuel to Ramatha."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixeruntque ei ecce tu senuisti et filii tui non ambulant in viis tuis constitue nobis regem ut iudicet nos sicut universae habent nationes"
      en: "And they said to him: Behold thou art old, and thy sons walk not in thy ways: make us a king, to judge us, as all nations have."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "displicuitque sermo in oculis Samuhelis eo quod dixissent da nobis regem ut iudicet nos et oravit Samuhel Dominum"
      en: "And the word was displeasing in the eyes of Samuel, that they should say: Give us a king, to judge us. And Samuel prayed to the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit autem Dominus ad Samuhel audi vocem populi in omnibus quae loquuntur tibi non enim te abiecerunt sed me ne regnem super eos"
      en: "And the Lord said to Samuel: Hearken to the voice of the people in all that they say to thee. For they have not rejected thee, but me, that I should not reign over them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "iuxta omnia opera sua quae fecerunt a die qua eduxi eos de Aegypto usque ad diem hanc sicut dereliquerunt me et servierunt diis alienis sic faciunt etiam tibi"
      en: "According to all their works, they have done from the day that I brought them out of Egypt until this day: as they have forsaken me, and served strange gods, so do they also unto thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "nunc ergo audi vocem eorum verumtamen contestare eos et praedic eis ius regis qui regnaturus est super eos"
      en: "Now therefore hearken to their voice: but yet testify to them, and foretell them the right of the king, that shall reign over them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixit itaque Samuhel omnia verba Domini ad populum qui petierat a se regem"
      en: "Then Samuel told all the words of the Lord to the people that had desired a king of him,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ait hoc erit ius regis qui imperaturus est vobis filios vestros tollet et ponet in curribus suis facietque sibi equites et praecursores quadrigarum suarum"
      en: "And said: This will be the right of the king, that shall reign over you: He will take your sons, and put them in his chariots, and will make them his horsemen, and his running footmen to run before his chariots,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et constituet sibi tribunos et centuriones et aratores agrorum suorum et messores segetum et fabros armorum et curruum suorum"
      en: "And he will appoint of them to be his tribunes, and centurions, and to plough his fields, and to reap his corn, and to make him arms and chariots."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "filias quoque vestras faciet sibi unguentarias et focarias et panificas"
      en: "Your daughters also he will take to make him ointments, and to be his cooks, and bakers."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "agros quoque vestros et vineas et oliveta optima tollet et dabit servis suis"
      en: "And he will take your fields, and your vineyards, and your best oliveyards, and give them to his servants."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sed et segetes vestras et vinearum reditus addecimabit ut det eunuchis et famulis suis"
      en: "Moreover he will take the tenth of your corn, and of the revenues of your vineyards, to give his eunuchs and servants."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "servos etiam vestros et ancillas et iuvenes optimos et asinos auferet et ponet in opere suo"
      en: "Your servants also and handmaids, and your goodliest young men, and your asses he will take away, and put them to his work."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "greges vestros addecimabit vosque eritis ei servi"
      en: "Your flocks also he will tithe, and you shall be his servants."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et clamabitis in die illa a facie regis vestri quem elegistis vobis et non exaudiet vos Dominus in die illa"
      en: "And you shall cry out in that day from the face of the king, whom you have chosen to yourselves. and the Lord will not hear you in that day, because you desired unto yourselves a king."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "noluit autem populus audire vocem Samuhel sed dixerunt nequaquam rex enim erit super nos"
      en: "But the people would not hear the voice of Samuel, and they said: Nay: but there shall be a king over us."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et erimus nos quoque sicut omnes gentes et iudicabit nos rex noster et egredietur ante nos et pugnabit bella nostra pro nobis"
      en: "And we also will be like all nations: and our king shall judge us, and go out before us, and tight our battles for us."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et audivit Samuhel omnia verba populi et locutus est ea in auribus Domini"
      en: "And Samuel heard all the words of the people, and rehearsed them in the ears of the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dixit autem Dominus ad Samuhel audi vocem eorum et constitue super eos regem et ait Samuhel ad viros Israhel vadat unusquisque in civitatem suam"
      en: "And the Lord said to Samuel: Hearken to their voice, and make them a king. And Samuel said to the men of Israel: Let every man go to his city."
    status: { la: verified, en: verified }
