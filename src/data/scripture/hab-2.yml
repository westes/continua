# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: hab
chapter: 2
verses:
  - n: 1
    text:
      la: "super custodiam meam stabo et figam gradum super munitionem et contemplabor ut videam quid dicatur mihi et quid respondeam ad arguentem me"
      en: "I will stand upon my watch, and fix my foot upon the tower: and I will watch, to see what will be said to me, and what I may answer to him that reproveth me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et respondit mihi Dominus et dixit scribe visum et explana eum super tabulas ut percurrat qui legerit eum"
      en: "And the Lord answered me, and said: Write the vision, and make it plain upon tables: that he that readeth it may run over it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia adhuc visus procul et apparebit in finem et non mentietur si moram fecerit expecta illum quia veniens veniet et non tardabit"
      en: "For as yet the vision is far off, and it shall appear at the end, and shall not lie: if it make any delay, wait for it: for it shall surely come, and it shall not be slack."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ecce qui incredulus est non erit recta anima eius in semet ipso iustus autem in fide sua vivet"
      en: "Behold, he that is unbelieving, his soul shall not be right in himself: but the just shall live in his faith."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et quomodo vinum potantem decipit sic erit vir superbus et non decorabitur qui dilatavit quasi infernus animam suam et ipse quasi mors et non adimpletur et congregabit ad se omnes gentes et coacervabit ad se omnes populos"
      en: "And as wine deceiveth him that drinketh it: so shall the proud man be, and he shall not be honoured: who hath enlarged his desire like hell: and is himself like death, and he is never satisfied: but will gather together unto him all nations, and heap together unto him all people."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "numquid non omnes isti super eum parabolam sument et loquellam enigmatum eius et dicetur vae ei qui multiplicat non sua usquequo et adgravat contra se densum lutum"
      en: "Shall not all these take up a parable against him, and a dark speech concerning him: and it shall be said: Woe to him that heapeth together that which is not his own? how long also doth he load himself with thick clay?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "numquid non repente consurgent qui mordeant te et suscitabuntur lacerantes te et eris in rapinam eis"
      en: "Shall they not rise up suddenly that shall bite thee: and they be stirred up that shall tear thee, and thou shalt be a spoil to them?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quia tu spoliasti gentes multas spoliabunt te omnes qui reliqui fuerint de populis propter sanguinem hominis et iniquitatem terrae civitatis et omnium habitantium in ea"
      en: "Because thou hast spoiled many nations, all that shall be left of the people shall spoil thee: because of men's blood, and for the iniquity of the land, of the city, and of all that dwell therein."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "vae qui congregat avaritiam malam domui suae ut sit in excelso nidus eius et liberari se putat de manu mali"
      en: "Woe to him that gathereth together an evil covetousness to his house, that his nest may be on high, and thinketh he may be delivered out of the hand of evil."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cogitasti confusionem domui tuae concidisti populos multos et peccavit anima tua"
      en: "Thou hast devised confusion to thy house, thou hast cut off many people, and thy soul hath sinned."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quia lapis de pariete clamabit et lignum quod inter iuncturas aedificiorum est respondebit"
      en: "For the stone shall cry out of the wall: and the timber that is between the joints of the building, shall answer."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vae qui aedificat civitatem in sanguinibus et praeparat urbem in iniquitate"
      en: "Woe to him that buildeth a town with blood, and prepareth a city by iniquity."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "numquid non haec a Domino sunt exercituum laborabunt enim populi in multo igni et gentes in vacuum et deficient"
      en: "Are not these things from the Lord of hosts? for the people shall labour in a great fire: and the nations in vain, and they shall faint."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quia replebitur terra ut cognoscat gloriam Domini quasi aquae operientes mare"
      en: "For the earth shall be filled, that men may know the glory of the Lord, as waters covering the sea."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vae qui potum dat amico suo mittens fel suum et inebrians ut aspiciat nuditatem eius"
      en: "Woe to him that giveth drink to his friend, and presenteth his gall, and maketh him drunk, that he may behold his nakedness."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "repletus est ignominia pro gloria bibe tu quoque et consopire circumdabit te calix dexterae Domini et vomitus ignominiae super gloriam tuam"
      en: "Thou art filled with shame instead of glory: drink thou also, and fall fast asleep: the cup of the right hand of the Lord shall compass thee, and shameful vomiting shall be on thy glory."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quia iniquitas Libani operiet te et vastitas animalium deterrebit eos de sanguinibus hominis et iniquitate terrae et civitatis et omnium habitantium in ea"
      en: "For the iniquity of Libanus shall cover thee, and the ravaging of beasts shall terrify them because of the blood of men, and the iniquity of the land, and of the city, and of all that dwell therein."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quid prodest sculptile quia sculpsit illud fictor suus conflatile et imaginem falsam quia speravit in figmento fictor eius ut faceret simulacra muta"
      en: "What doth the graven thing avail, because the maker thereof hath graven it, a molten, and a false image? because the forger thereof hath trusted in a thing of his own forging, to make dumb idols."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "vae qui dicit ligno expergiscere surge lapidi tacenti numquid ipse docere poterit ecce iste coopertus est auro et argento et omnis spiritus non est in visceribus eius"
      en: "Woe to him that saith to wood: Awake: to the dumb stone: Arise: can it teach? Behold, it is laid over with gold, and silver, and there is no spirit in the bowels thereof."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dominus autem in templo sancto suo sileat a facie eius omnis terra"
      en: "But the Lord is in his holy temple: let all the earth keep silence before him."
    status: { la: verified, en: verified }
