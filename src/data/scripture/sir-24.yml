# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 24
verses:
  - n: 1
    text:
      la: "sapientiae laus sapientia laudabit animam suam et in Deo honorabitur et in medio populi sui gloriabitur"
      en: "Wisdom shall praise her own self, and shall be honoured in God, and shall glory in the midst of her people,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et in ecclesiis Altissimi aperiet os suum et in conspectu virtutis illius gloriabitur"
      en: "And shall open her mouth in the churches of the most High, and shall glorify herself in the sight of his power,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in medio populo exaltabitur et in plenitudine sancta admirabitur"
      en: "And in the midst of her own people she shall be exalted, and shall be ad- mired in the holy assembly."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in multitudine electorum habebit laudem et inter benedictos benedicetur dicens"
      en: "And in the multitude of the elect she shall have praise, and among the blessed she shall be blessed, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ego ex ore Altissimi prodivi primogenita ante omnem creaturam"
      en: "I came out of the mouth of the most High, the firstborn before all creatures:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ego in caelis feci ut oriretur lumen indeficiens et sicut nebula texi omnem terram"
      en: "I made that in the heavens there should rise light that never faileth, and as a cloud I covered all the earth:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ego in altis habitavi et thronus meus in columna nubis"
      en: "I dwelt in the highest places, and my throne is in a pillar of a cloud."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "gyrum caeli circuivi sola et in profundum abyssi penetravi et in fluctibus maris ambulavi"
      en: "I alone have compassed the circuit of heaven, and have penetrated into the bottom of the deep, and have walked in the waves of the sea,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et in omni terra steti et in omni populo"
      en: "And have stood in all the earth: and in every people,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et in omni gente primatum habui"
      en: "And in every nation I have had the chief rule:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et omnium excellentium et humilium corda virtute calcavi et in his omnibus requiem quaesivi et in hereditate eius morabor"
      en: "And by my power I have trodden under my feet the hearts of all the high and low: and in all these I sought rest, and I shall abide in the inheritance of the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tunc praecepit et dixit mihi creator omnium et qui creavit me requievit in tabernaculo meo"
      en: "Then the creator of all things commanded, and said to me: and he that made me, rested in my tabernacle,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dixit mihi in Iacob inhabita et in Israhel hereditare et in electis meis ede radices"
      en: "And he said to me: Let thy dwelling be in Jacob, and thy inheritance in Israel, and take root in my elect."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ab initio ante saeculum creata sum et usque ad futurum saeculum non desinam et in habitatione sancta coram ipso ministravi"
      en: "From the beginning, and before the world, was I created, and unto the world to come I shall not cease to be, and in the holy dwelling place I have ministered before him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et sic in Sion firmata sum et in civitate sanctificata similiter requievi et in Hierusalem potestas mea"
      en: "And so was I established in Sion, and in the holy city likewise I rested, and my power was in Jerusalem."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et radicavi in populo honorificato et in parte Dei mei hereditas illius et in plenitudine sanctorum detentio mea"
      en: "And I took root in an honourable people, and in the portion of mg God his inheritance, and my abode is in the full assembly of saints."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quasi cedrus exaltata sum in Libano et quasi cypressus in monte Sion"
      en: "I was exalted like a cedar in Libanus, and as a cypress tree on mount Sion."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et quasi palma exaltata sum in Cades et quasi plantatio rosae in Hiericho"
      en: "I was exalted like a palm tree in Cades, and as a rose plant in Jericho:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quasi oliva speciosa in campis et quasi platanus exaltata sum iuxta aquam in plateis"
      en: "As a fair olive tree in the plains, and as a plane tree by the water in the streets, was I exalted."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sicut cinnamomum et aspaltum aromatizans odorem dedi quasi murra electa dedi suavitatem odoris"
      en: "I gave a sweet smell like cinnamon. and aromatical balm: I yielded a sweet odour like the best myrrh:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et quasi storax et galbanus et ungula et gutta et quasi libanus non incisus vaporavi habitationem meam et quasi balsamum non mixtum odor meus"
      en: "And I perfumed my dwelling as storax, and galbanum, and onyx, and aloes, and as the frankincense not cut, and my odour is as the purest balm."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ego quasi terebinthus extendi ramos meos et rami mei honoris et gratiae"
      en: "I have stretched out my branches as the turpentine tree, and my branches are of honour and grace."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ego quasi vitis fructificavi suavitatem odoris et flores mei fructus honoris et honestatis"
      en: "As the vine I have brought forth a pleasant odour: and my flowers are the fruit of honour and riches."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ego mater pulchrae dilectionis et timoris et agnitionis et sanctae spei"
      en: "I am the mother of fair love, and of fear, and of knowledge, and of holy hope."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "in me gratia omnis vitae et veritatis in me omnis spes vitae et virtutis"
      en: "In me is all grace of the way and of the truth, in me is all hope of life and of virtue."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "transite ad me omnes qui concupiscitis me et a generationibus meis implemini"
      en: "Come over to me, all ye that desire me, and be filled with my fruits."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "spiritus enim meus super melle dulcis et hereditas mea super mel et favum"
      en: "For my spirit is sweet above honey, and my inheritance above honey and the honeycomb."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "memoria mea in generatione saeculorum"
      en: "My memory is unto everlasting generations."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "qui edunt me adhuc esurient et qui bibunt me adhuc sitient"
      en: "They that eat me, shall yet hunger: and they that drink me, shall yet thirst."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui audit me non confundetur et qui operantur in me non peccabunt"
      en: "He that hearkeneth to me, shall not be confounded: and they that work by me, shall not sin."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "qui elucidant me vitam aeternam habebunt"
      en: "They that explain me shall have life everlasting."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "haec omnia liber vitae testamentum Altissimi et agnitio veritatis"
      en: "All these things are the book of life, and the covenant of the most High, and the knowledge of truth."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "legem mandavit Moses in praeceptis iustitiarum et hereditatem domui Iacob et Israhel promissionis"
      en: "Moses commanded a law in the precepts of justices, and an inheritance to the house of Jacob, and the promises to Israel."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "posuit David puero suo excitare regem ex ipso fortissimum in throno honoris sedentem in sempiternum"
      en: "He appointed to David his servant to raise up of him a most mighty king, and sitting on the throne of glory for ever."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "qui implet quasi Phison sapientiam et sicut Tigris in diebus novorum"
      en: "Who filleth up wisdom as the Phison, and as the Tigris in the days of the new fruits."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "qui adimplet quasi Eufrates sensum qui multiplicat quasi Iordanis in tempore messis"
      en: "Who maketh understanding to abound as the Euphrates, who multiplieth it as the Jordan in the time of harvest."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "qui mittit disciplinam sicut lucem et adsistens quasi Geon in die vindemiae"
      en: "Who sendeth knowledge as the light, and riseth up as Gehon in the time of the vintage."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "qui perficit primus scire ipsam et infirmior non investigavit eam"
      en: "Who first hath perfect knowledge of her, and a weaker shall not search her out."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "a mari enim abundavit cogitatio eius et consilium illius abysso magna"
      en: "For her thoughts are more vast than the sea, and her counsels more deep than the great ocean."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "ego sapientia effudi flumina"
      en: "I, wisdom, have poured out rivers."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "ego quasi tramis aquae inmensae de fluvio ego quasi fluvius Doryx et sicut aquaeductus exivi a paradiso"
      en: "I, like a brook out of a river of a mighty water; I, like a channel of a river. and like an aqueduct, came out of paradise."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "dixi rigabo meum hortum plantationum et inebriabo pratus mei fructum"
      en: "I said: I will water my garden of plants, and I will water abundantly the fruits of my meadow."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et ecce facta est mihi tramis abundans et fluvius meus propinquavit ad mare"
      en: "And behold my brook became a great river, and my river came near to a sea:"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "quoniam doctrinam quasi antelucanum inlumino omnibus et enarrabo illam usque in longinquo"
      en: "For I make doctrine to shine forth to all as the morning light, and I will declare it afar off."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "penetrabo inferiores partes terrae et inspiciam omnes dormientes et inluminabo sperantes in Deo"
      en: "I will penetrate to all the lower parts of the earth, and will behold all that sleep, and will enlighten all that hope in the Lord."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "adhuc doctrinam quasi prophetiam effundam et relinquam illam quaerentibus sapientiam et non desinam in progenies illorum usque in aevum sanctum"
      en: "I will yet pour out doctrine as prophecy, and will leave it to them that seek wisdom, and will not cease to instruct their offspring even to the holy age."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "videte quoniam non soli mihi laboravi sed omnibus exquirentibus veritatem"
      en: "See ye that I have not laboured for myself only, but for all that seek out the truth."
    status: { la: verified, en: verified }
