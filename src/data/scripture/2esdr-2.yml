# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2esdr
chapter: 2
verses:
  - n: 1
    text:
      la: "Factum est autem in mense Nisan, anno vigesimo Artaxerxis regis: et vinum erat ante eum, et levavi vinum, et dedi regi: et eram quasi languidus ante faciem ejus."
      en: "And it came to pass in the month of Nisan, in the twentieth year of Artaxerxes the king: that wine was before him, and I took up the wine, and gave it to the king: and I was as one languishing away before his face."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixitque mihi rex: Quare vultus tuus tristis est, cum te aegrotum non videam? non est hoc frustra, sed malum nescio quod in corde tuo est. Et timui valde, ac nimis:"
      en: "And the king said to me: Why is thy countenance sad, seeing thou dost not appear to be sick? this is not without cause, but some evil, I know not what, is in thy heart. And I was seized with an exceeding great fear:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixi regi: Rex in aeternum vive: quare non moereat vultus meus, quia civitas domus sepulchrorum patris mei deserta est, et portae ejus combustae sunt igni?"
      en: "And I said to the king: O king, live for ever: why should not my countenance be sorrowful, seeing the city of the place of the sepulchres of my fathers is desolate, and the gates thereof are burnt with fire?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et ait mihi rex: Pro qua re postulas? Et oravi Deum caeli,"
      en: "Then the king said to me: For what dost thou make request? And I prayed to the God of heaven,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dixi ad regem: Si videtur regi bonum, et si placet servus tuus ante faciem tuam, ut mittas me in Judaeam ad civitatem sepulchri patris mei, et aedificabo eam."
      en: "And I said to the king: If it seem good to the king, and if thy servant hath found favour in thy sight, that thou wouldst send me into Judea to the city of the sepulchre of my father, and I will build it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixitque mihi rex, et regina quae sedebat juxta eum: Usque ad quod tempus erit iter tuum, et quando reverteris? Et placuit ante vultum regis, et misit me: et constitui ei tempus."
      en: "And the king said to me, and the queen that sat by him: For how long shall thy journey be, and when wilt thou return? And it pleased the king, and he sent me: and I fixed him a time."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et dixi regi: Si regi videtur bonum, epistolas det mihi ad duces regionis trans flumen, ut traducant me, donec veniam in Judaeam:"
      en: "And I said to the king: If it seem good to the king, let him give me letters to the governors of the country beyond the river, that they convey me over, till I come into Judea:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et epistolam ad Asaph custodem saltus regis, ut det mihi ligna, ut tegere possim portas turris domus, et muros civitatis, et domum, quam ingressus fuero. Et dedit mihi rex juxta manum Dei mei bonam mecum."
      en: "And a letter to Asaph the keeper of the king's forest, to give me timber that I may cover the gates of the tower of the house, and the walls of the city, and the house that I shall enter into. And the king gave me according to the good hand of my God with me."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et veni ad duces regionis trans flumen, dedique eis epistolas regis. Miserat autem rex mecum principes militum, et equites."
      en: "And I came to the governors of the country beyond the river, and gave them the king's letters. And the king had sent with me captains of soldiers, and horsemen."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et audierunt Sanaballat Horonites, et Tobias servus Ammanites: et contristati sunt afflictione magna, quod venisset homo, qui quaereret prosperitatem filiorum Israel."
      en: "And Sanaballat the Horonite, and Tobias the servant, the Ammonite, heard it, and it grieved them exceedingly, that a man was come, who sought the prosperity of the children of Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et veni Jerusalem, et eram ibi tribus diebus."
      en: "And I came to Jerusalem, and was there three days."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et surrexi nocte ego, et viri pauci mecum, et non indicavi cuiquam quid Deus dedisset in corde meo ut facerem in Jerusalem, et jumentum non erat mecum, nisi animal, cui sedebam."
      en: "And I arose in the night, I and some few men with me, and I told not any man what God had put in my heart to do in Jerusalem, and there was no beast with me, but the beast that I rode upon."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et egressus sum per portam vallis nocte, et ante fontem draconis, et ad portam stercoris, et considerabam murum Jerusalem dissipatum, et portas ejus consumptas igni."
      en: "And I went out by night by the gate of the valley, and before the dragon fountain, and to the dung gate, and I viewed the wall of Jerusalem which was broken down, and the gates thereof which were consumed with fire."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et transivi ad portam fontis, et ad aquaeductum regis, et non erat locus jumento, cui sedebam, ut transiret."
      en: "And I passed to the gate of the fountain, and to the king's aqueduct, and there was no place for the beast on which I rode to pass."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ascendi per torrentem nocte, et considerabam murum, et reversus veni ad portam vallis, et redii."
      en: "And I went up in the night by the torrent, and viewed the wall, and going back I came to the gate of the valley, and returned."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Magistratus autem nesciebant quo abiissem, aut quid ego facerem: sed et Judaeis et sacerdotibus, et optimatibus, et magistratibus, et reliquis qui faciebant opus, usque ad id loci nihil indicaveram."
      en: "But the magistrates knew not whither I went, or what I did: neither had I as yet told any thing to the Jews, or to the priests, or to the nobles, or to the magistrates, or to the rest that did the work."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et dixi eis: Vos nostis afflictionem in qua sumus: quia Jerusalem deserta est, et portae ejus consumptae sunt igni: venite, et aedificemus muros Jerusalem, et non simus ultra opprobrium."
      en: "Then I said to them: You know the affliction wherein we are, because Jerusalem is desolate, and the gates thereof are consumed with fire: come, and let us build up the walls of Jerusalem, and let us be no longer a reproach."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et indicavi eis manum Dei mei, quod esset bona mecum, et verba regis, quae locutus esset mihi, et aio: Surgamus, et aedificemus. Et confortatae sunt manus eorum in bono."
      en: "And I shewed them how the hand of my God was good with me, and the king's words, which he had spoken to me, and I said: Let us rise up, and build. And their hands were strengthened in good."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Audierunt autem Sanaballat Horonites, et Tobias servus Ammanites, et Gosem Arabs, et subsannaverunt nos, et despexerunt, dixeruntque: Quae est haec res, quam facitis? numquid contra regem vos rebellatis?"
      en: "But Sanaballat the Horonite, and Tobias the servant, the Ammonite, and Gossem the Arabian heard of it, and they scoffed at us, and despised us, and said: What is this thing that you do? are you going to rebel against the king?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et reddidi eis sermonem, dixique ad eos: Deus caeli ipse nos juvat, et nos servi ejus sumus: surgamus et aedificemus: vobis autem non est pars, et justitia, et memoria in Jerusalem."
      en: "And I answered them, and said to them: The God of heaven he helpeth us, and we are his servants: let us rise up and build: but you have no part, nor justice, nor remembrance in Jerusalem."
    status: { la: verified, en: verified }
