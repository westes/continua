# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 16
verses:
  - n: 1
    text:
      la: "Factus est autem sermo Domini ad Jehu filium Hanani contra Baasa, dicens:"
      en: "Then the word of the Lord came to Jehu the son of Hanani against Baasa, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Pro eo quod exaltavi te de pulvere, et posui te ducem super populum meum Israel, tu autem ambulasti in via Jeroboam, et peccare fecisti populum meum Israel, ut me irritares in peccatis eorum:"
      en: "Forasmuch as I have exalted thee out of the dust, and made thee prince over my people Israel, and thou hast walked in the way of Jeroboam, and hast made my people Israel to sin, to provoke me to anger with their sins:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ecce ego demetam posteriora Baasa, et posteriora domus ejus: et faciam domum tuam sicut domum Jeroboam filii Nabat."
      en: "Behold, I will cut down the posterity of Baasa, and the posterity of his house, and I will make thy house as the house of Jeroboam the son of Nabat."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui mortuus fuerat de Baasa in civitate, comedent eum canes: et qui mortuus fuerit ex eo in regione, comedent eum volucres caeli."
      en: "Him that dieth of Baasa in the city, the dogs shall eat: and him that dieth of his in the country, the fowls of the air shall devour."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Reliqua autem sermonum Baasa, et quaecumque fecit, et praelia ejus, nonne haec scripta sunt in libro verborum dierum regum Israel?"
      en: "But the rest of the acts of Baasa and all that he did, and his battles, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dormivit ergo Baasa cum patribus suis, sepultusque est in Thersa: et regnavit Ela filius ejus pro eo."
      en: "So Baasa slept with his fathers, and was buried in Thersa: and Ela his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum autem in manu Jehu filii Hanani prophetae verbum Domini factum esset contra Baasa, et contra domum ejus, et contra omne malum quod fecerat coram Domino, ad irritandum eum in operibus manuum suarum, ut fieret sicut domus Jeroboam: ob hanc causam occidit eum, hoc est, Jehu filium Hanani, prophetam."
      en: "And when the word of the Lord came in the hand of Jehu the son of Hanani the prophet, against Baasa, and against his house, and against all the evil that he had done before the Lord, to provoke him to anger by the works of his hands, to become as the house of Jeroboam: for this cause he slew him, that is to say, Jehu the son of Hanani, the prophet."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Anno vigesimo sexto Asa regis Juda, regnavit Ela filius Baasa super Israel in Thersa duobus annis."
      en: "In the six and twentieth year of Asa king of Juda, Ela the son of Baasa reigned over Israel in Thersa two years."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et rebellavit contra eum servus suus Zambri, dux mediae partis equitum: erat autem Ela in Thersa bibens, et temulentus in domo Arsa praefecti Thersa."
      en: "And his servant Zambri, who was captain of half the horsemen, rebelled against him: now Ela was drinking in Thersa, and drunk in the house of Arsa the governor of Thersa."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Irruens ergo Zambri, percussit, et occidit eum, anno vigesimo septimo Asa regis Juda, et regnavit pro eo."
      en: "And Zambri rushing in, struck him and slew him in the seven and twentieth year of Asa king of Juda, and he reigned in his stead."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque regnasset, et sedisset super solium ejus, percussit omnem domum Baasa, et non dereliquit ex ea mingentem ad parietem, et propinquos et amicos ejus."
      en: "And when he was king and sat upon his throne, he slew all the house of Baasa, and he left not one thereof to piss against a wall, and all his kinsfolks and friends."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Delevitque Zambri omnem domum Baasa, juxta verbum Domini, quod locutus fuerat ad Baasa in manu Jehu prophetae,"
      en: "And Zambri destroyed all the house of Baasa, according to the word of the Lord, that he had spoken to Baasa in the hand of Jehu the prophet,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "propter universa peccata Baasa, et peccata Ela filii ejus, qui peccaverunt, et peccare fecerunt Israel, provocantes Dominum Deum Israel in vanitatibus suis."
      en: "For all the sins of Baasa, and the sins of Ela his son, who sinned, and made Israel to sin, provoking the Lord the God of Israel with their vanities."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Reliqua autem sermonum Ela, et omnia quae fecit, nonne haec scripta sunt in libro verborum dierum regum Israel?"
      en: "But the rest of the acts of Ela, and all that he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Anno vigesimo septimo Asa regis Juda, regnavit Zambri septem diebus in Thersa: porro exercitus obsidebat Gebbethon urbem Philisthinorum."
      en: "In the seven and twentieth year of Asa king of Juda, Zambri reigned seven days in Thersa: now the army was besieging Gebbethon a city of the Philistines."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cumque audisset rebellasse Zambri, et occidisse regem, fecit sibi regem omnis Israel Amri, qui erat princeps militiae super Israel in die illa in castris."
      en: "And when they heard that Zambri had rebelled, and slain the king, all Israel made Amri their king, who was general over Israel in the camp that day."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ascendit ergo Amri, et omnis Israel cum eo, de Gebbethon, et obsidebant Thersa."
      en: "And Amri went up, and all Israel with him from Gebbethon, and they besieged Thersa."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Videns autem Zambri quod expugnanda esset civitas, ingressus est palatium, et succendit se cum domo regia: et mortuus est"
      en: "And Zambri seeing that the city was about to be taken, went into the palace and burnt himself with the king's house: and he died"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "in peccatis suis, quae peccaverat faciens malum coram Domino, et ambulans in via Jeroboam, et in peccato ejus, quo fecit peccare Israel."
      en: "In his sins, which he had sinned, doing evil before the Lord, and walking in the way of Jeroboam, and in his sin, wherewith he made Israel to sin."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Reliqua autem sermonum Zambri, et insidiarum ejus, et tyrannidis, nonne haec scripta sunt in libro verborum dierum regum Israel?"
      en: "But the rest of the acts of Zambri, and of his conspiracy and tyranny, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Tunc divisus est populus Israel in duas partes: media pars populi sequebatur Thebni filium Gineth, ut constitueret eum regem: et media pars Amri."
      en: "Then were the people of Israel divided into two parts: one half of the people followed Thebni the son of Gineth, to make him king: and one half followed Amri."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Praevaluit autem populus qui erat cum Amri, populo qui sequebatur Thebni filium Gineth: mortuusque est Thebni, et regnavit Amri."
      en: "But the people that were with Amri, prevailed over the people that followed Thebni the son of Gineth: and Thebni died, and Amri reigned."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Anno trigesimo primo Asa regis Juda, regnavit Amri super Israel, duodecim annis: in Thersa regnavit sex annis."
      en: "In the one and thirtieth year of Asa king of Juda, Amri reigned over Israel twelve years: in Thersa he reigned six years."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Emitque montem Samariae a Somer duobus talentis argenti: et aedificavit eum, et vocavit nomen civitatis, quam exstruxerat, nomine Semer domini montis, Samariam."
      en: "And he bought the hill of Samaria of Semer for two talents of silver: and he built upon it, and he called the city which he built Samaria, after the name of Semer the owner of the hill."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Fecit autem Amri malum in conspectu Domini, et operatus est nequiter, super omnes qui fuerunt ante eum."
      en: "And Amri did evil in the sight of the Lord, and acted wickedly above all that were before him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ambulavitque in omni via Jeroboam filii Nabat, et in peccatis ejus quibus peccare fecerat Israel: ut irritaret Dominum Deum Israel in vanitatibus suis."
      en: "And he walked in all the way of Jeroboam the son of Nabat, and in his sins wherewith he made Israel to sin: to provoke the Lord the God of Israel to anger with their vanities."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Reliqua autem sermonum Amri, et praelia ejus, quae gessit, nonne haec scripta sunt in libro verborum dierum regum Israel?"
      en: "Now the rest of the acts of Amri, and the battles he fought, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Dormivitque Amri cum patribus suis, et sepultus est in Samaria: regnavitque Achab filius ejus pro eo."
      en: "And Amri slept with his fathers, and was buried in Samaria, and Achab his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Achab vero filius Amri regnavit super Israel anno trigesimo octavo Asa regis Juda. Et regnavit Achab filius Amri super Israel in Samaria viginti et duobus annis."
      en: "Now Achab the son of Amri reigned over Israel in the eight and thirtieth year of Asa king of Juda. And Achab the son of Amri reigned over Israel in Samaria two and twenty years."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et fecit Achab filius Amri malum in conspectu Domini super omnes qui fuerunt ante eum."
      en: "And Achab the son of Amri did evil in the sight of the Lord above all that were before him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Nec suffecit ei ut ambularet in peccatis Jeroboam filii Nabat: insuper duxit uxorem Jezabel filiam Ethbaal regis Sidoniorum. Et abiit, et servivit Baal, et adoravit eum."
      en: "Nor was it enough for him to walk in the sins of Jeroboam the son of Nabat: but he also took to wife Jezabel daughter of Ethbaal king of the Sidonians. And he went, and served Baal, and adored him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et posuit aram Baal in templo Baal, quod aedificaverat in Samaria,"
      en: "And he set up an altar for Baal in the temple of Baal, which he had built in Samaria,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et plantavit lucum: et addidit Achab in opere suo, irritans Dominum Deum Israel super omnes reges Israel qui fuerunt ante eum."
      en: "And he planted a grove: and Achab did more to provoke the Lord the God of Israel, than all the kings of Israel that were before him."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "In diebus ejus aedificavit Hiel de Bethel Jericho: in Abiram primitivo suo fundavit eam, et in Segub novissimo suo posuit portas ejus: juxta verbum Domini, quod locutus fuerat in manu Josue filii Nun."
      en: "In his days Hiel of Bethel built Jericho: in Abiram his firstborn he laid its foundations: and in his youngest son Segub he set up the gates thereof: according to the word of the Lord, which he spoke in the hand of Josue the son of Nun."
    status: { la: verified, en: verified }
