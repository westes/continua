# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 3reg
chapter: 9
verses:
  - n: 1
    text:
      la: "factum est autem cum perfecisset Salomon aedificium domus Domini et aedificium regis et omne quod optaverat et voluerat facere"
      en: "And it came to pass when Solomon had finished the building of the house of the Lord, and the king's house, and all that he desired, and was pleased to do,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "apparuit Dominus ei secundo sicut apparuerat ei in Gabaon"
      en: "That the Lord appeared to him the second time, as he had appeared to him in Gabaon."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixitque Dominus ad eum exaudivi orationem tuam et deprecationem tuam qua deprecatus es coram me sanctificavi domum hanc quam aedificasti ut ponerem nomen meum ibi in sempiternum et erunt oculi mei et cor meum ibi cunctis diebus"
      en: "And the Lord said to him: I have heard thy prayer and thy supplication, which thou hast made before me: I have sanctified this house, which thou hast built, to put my name there for ever, and my eyes and my heart shall be there always."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "tu quoque si ambulaveris coram me sicut ambulavit pater tuus in simplicitate cordis et in aequitate et feceris omnia quae praecepi tibi et legitima mea et iudicia mea servaveris"
      en: "And if thou wilt walk before me, as thy father walked, in simplicity of heart, and in uprightness: and wilt do all that I have commanded thee, and wilt keep my ordinances and my judgments,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ponam thronum regni tui super Israhel in sempiternum sicut locutus sum David patri tuo dicens non auferetur de genere tuo vir de solio Israhel"
      en: "I will establish the throne of thy kingdom over Israel for ever, as I promised David thy father, saying: There shall not fail a man of thy race upon the throne of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "si autem aversione aversi fueritis vos et filii vestri non sequentes me nec custodientes mandata mea et caerimonias quas proposui vobis sed abieritis et colueritis deos alienos et adoraveritis eos"
      en: "But if you and your children revolting shall turn away from following me, and will not keep my commandments, and my ceremonies, which I have set before you, but will go and worship strange gods, and adore them:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "auferam Israhel de superficie terrae quam dedi eis et templum quod sanctificavi nomini meo proiciam a conspectu meo eritque Israhel in proverbium et in fabulam cunctis populis"
      en: "I will take away Israel from the face of the land which I have given them; and the temple which I have sanctified to my name, I will cast out of my sight; and Israel shall be a proverb, and a byword among all people."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et domus haec erit in exemplum omnis qui transierit per eam stupebit et sibilabit et dicet quare fecit Dominus sic terrae huic et domui huic"
      en: "And this house shall be made an example of: every one that shall pass by it, shall be astonished, and shall hiss, and say: Why hath the Lord done thus to this land, and to this house:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et respondebunt quia dereliquerunt Dominum Deum suum qui eduxit patres eorum de terra Aegypti et secuti sunt deos alienos et adoraverunt eos et coluerunt idcirco induxit Dominus super eos omne malum hoc"
      en: "And they shall answer: Because they forsook the Lord their God, who brought their fathers out of the land of Egypt, and followed strange gods, and adored them, and worshipped them: therefore hath the Lord brought upon them all this evil."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "expletis autem annis viginti postquam aedificaverat Salomon duas domos id est domum Domini et domum regis"
      en: "And when twenty years were ended after Solomon had built the two houses, that is, the house of the Lord, and the house of the king,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Hiram rege Tyri praebente Salomoni ligna cedrina et abiegna et aurum iuxta omne quod opus habuerat tunc dedit Salomon Hiram viginti oppida in terra Galileae"
      en: "(Hiram the king of Tyre furnishing Solomon with cedar trees and fir trees, and gold according to all he had need of.) then Solomon gave Hiram twenty cities in the land of Galilee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "egressusque est Hiram de Tyro ut videret oppida quae dederat ei Salomon et non placuerunt ei"
      en: "And Hiram came out of Tyre, to see the towns which Solomon had given him, and they pleased him not,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ait haecine sunt civitates quas dedisti mihi frater et appellavit eas terram Chabul usque in diem hanc"
      en: "And he said: Are these the cities which thou hast given me, brother? And he called them the land of Chabul, unto this day."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "misit quoque Hiram ad regem centum viginti talenta auri"
      en: "And Hiram sent to king Solomon a hundred and twenty talents of gold."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "haec est summa expensarum quam obtulit rex Salomon ad aedificandam domum Domini et domum suam et Mello et murum Hierusalem et Eser et Mageddo et Gazer"
      en: "This is the sum of the expenses, which king Solomon offered to build the house of the Lord, and his own house, and Mello, and the wall of Jerusalem, and Heser, and Mageddo, and Gazer."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Pharao rex Aegypti ascendit et cepit Gazer succenditque eam igni et Chananeum qui habitabat in civitate interfecit et dedit eam in dote filiae suae uxori Salomonis"
      en: "Pharao the king of Egypt came up and took Gazer, and burnt it with fire: and slew the Chanaanite that dwelt in the city, and gave it for a dowry to his daughter, Solomon's wife."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "aedificavit ergo Salomon Gazer et Bethoron inferiorem"
      en: "So Solomon built: Gazer, and Beth-horon the nether,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Baalath et Palmyram in terra solitudinis"
      en: "And Baalath, and Palmira in the land of the wilderness."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et omnes vicos qui ad se pertinebant et erant absque muro munivit et civitates curruum et civitates equitum et quodcumque ei placuit ut aedificaret in Hierusalem et in Libano et in omni terra potestatis suae"
      en: "And all the towns that belonged to himself, and were not walled, he fortified, the cities also of the chariots, and the cities of the horsemen, and whatsoever he had a mind to build in Jerusalem, and in Libanus, and in all the land of his dominion."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "universum populum qui remanserat de Amorreis et Hettheis et Ferezeis et Eveis et Iebuseis qui non sunt de filiis Israhel"
      en: "All the people that were left of the Amorrhites, and Hethites, and Pherezites, and Hevites, and Jebusites, that are not of the children of Israel:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "horum filios qui remanserant in terra quos scilicet non potuerant filii Israhel exterminare fecit Salomon tributarios usque ad diem hanc"
      en: "Their children, that were left in the land, to wit, such as the children of Israel had not been able to destroy, Solomon made tributary unto this day."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "de filiis autem Israhel non constituit Salomon servire quemquam sed erant viri bellatores et ministri eius et principes et duces et praefecti curruum et equorum"
      en: "But of the children of Israel Solomon made not any to be bondmen, but they were men of war, and his servants, and his princes, and captains, and overseers of the chariots and horses."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "erant autem principes super omnia opera Salomonis praepositi quingenti quinquaginta qui habebant subiectum populum et statutis operibus imperabant"
      en: "And there were five hundred and fifty chief officers set over all the works of Solomon, and they had people under them, and had charge over the appointed works."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filia autem Pharaonis ascendit de civitate David in domum suam quam aedificaverat ei tunc aedificavit Mello"
      en: "And the daughter of Pharao came up out of the city of David to her house, which Solomon had built for her: then did he build Mello."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "offerebat quoque Salomon tribus vicibus per annos singulos holocausta et pacificas victimas super altare quod aedificaverat Domino et adolebat thymiama coram Domino perfectumque est templum"
      en: "Solomon also offered three times every year holocausts, and victims of peace offerings upon the altar which he had built to the Lord, and he burnt incense before the Lord: and the temple was finished."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "classem quoque fecit rex Salomon in Asiongaber quae est iuxta Ahilam in litore maris Rubri in terra Idumea"
      en: "And king Solomon made a fleet in Asiongaber, which is by Ailath on the shore of the Red Sea in the land of Edom."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "misitque Hiram in classe illa servos suos viros nauticos et gnaros maris cum servis Salomonis"
      en: "And Hiram sent his servants in the fleet, sailors that had knowledge of the sea, with the servants of Solomon."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui cum venissent in Ophir sumptum inde aurum quadringentorum viginti talentorum detulerunt ad regem Salomonem"
      en: "And they came to Ophir, and they brought from thence to king Solomon four hundred and twenty talents of gold."
    status: { la: verified, en: verified }
