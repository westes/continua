# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 29
verses:
  - n: 1
    text:
      la: "et haec sunt verba libri quae misit Hieremias propheta de Hierusalem ad reliquias seniorum transmigrationis et ad sacerdotes et ad prophetas et ad omnem populum quem transduxerat Nabuchodonosor de Hierusalem in Babylonem"
      en: "Now these are the words of the letter which Jeremias, the prophet sent from Jerusalem to the residue of the ancients that were carried into captivity, and to the priests, and to the prophets, and to all the people, whom Nabuchodonosor had carried away from Jerusalem to Babylon:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "postquam egressus est Iechonias rex et domina et eunuchi et principes Iuda et Hierusalem et faber et inclusor de Hierusalem"
      en: "After that Jechonias the king, and the queen, and the eunuchs, and the princes of Juda, and of Jerusalem, and the craftsman, and the engravers were departed out of Jerusalem :"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in manu Ellasa filii Saphan et Gamaliae filii Helciae quos misit Sedecias rex Iuda ad Nabuchodonosor regem Babylonis in Babylonem dicens"
      en: "By the hand of Elasa the son of Saphan, and Gamarias the son of Helcias, whom Sedecias king of Juda sent to Babylon to Nabuchodonosor king of Babylon, saying:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "haec dicit Dominus exercituum Deus Israhel omni transmigrationi quam transtuli de Hierusalem in Babylonem"
      en: "Thus saith the Lord of hosts the God of Israel, to all that are carried away captives, whom I have caused to be carried away from Jerusalem to Babylon:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "aedificate domos et habitate et plantate hortos et comedite fructum eorum"
      en: "Build ye houses, and dwell in them: and plant orchards, and eat the fruit of them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "accipite uxores et generate filios et filias date filiis vestris uxores et filias vestras date viris et pariant filios et filias et multiplicamini ibi et nolite esse pauci numero"
      en: "Take ye wives, and beget sons and daughters: and take wives for your sons, and give your daughters to husbands, and let them bear sons and daughters: and be ye multiplied there, and be not few in number."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et quaerite pacem civitatis ad quam transmigrare vos feci et orate pro ea ad Dominum quia in pace illius erit pax vobis"
      en: "And seek the peace of the city, to which I have caused you to be carried away captives; and pray to the Lord for it: for in the peace thereof shall be your peace."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "haec enim dicit Dominus exercituum Deus Israhel non vos inducant prophetae vestri qui sunt in medio vestrum et divini vestri et ne adtendatis ad somnia vestra quae vos somniatis"
      en: "For thus saith the Lord of hoses the God of Israel: Let not your prophets that are in the midst of you, and your diviners deceive you: and give no heed to your dreams which you dream:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia falso ipsi prophetant vobis in nomine meo et non misi eos dicit Dominus"
      en: "For they prophesy falsely to you in my name: and I have not sent them, saith the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quia haec dicit Dominus cum coeperint impleri in Babylone septuaginta anni visitabo vos et suscitabo super vos verbum meum bonum ut reducam vos ad locum istum"
      en: "For thus saith the Lord: When the seventy years shall begin to be accomplished in Babylon, I will visit you: and I will perform my good word in your favour, to bring you again to this place."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ego enim scio cogitationes quas cogito super vos ait Dominus cogitationes pacis et non adflictionis ut dem vobis finem et patientiam"
      en: "For I know the thoughts that I think towards you, saith the Lord, thoughts of peace, and not of affliction, to give you an end and patience."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et invocabitis me et ibitis et orabitis me et exaudiam vos"
      en: "And you shall call upon me, and you shall go: and you shall pray to me, and I will hear you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quaeretis me et invenietis cum quaesieritis me in toto corde vestro"
      en: "You shall seek me, and shall And me: when you shall seek me with all your heart."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et inveniar a vobis ait Dominus et reducam captivitatem vestram et congregabo vos de universis gentibus et de cunctis locis ad quae expuli vos dicit Dominus et reverti vos faciam de loco ad quem transmigrare vos feci"
      en: "And I will be found by you, saith the Lord: and I will bring back your captivity, and I will gather you out of all nations, and from all the places to which I have driven you out, saith the Lord: and I will bring you back from the place to which I caused you to be carried away captive."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quia dixistis suscitavit nobis Dominus prophetas in Babylone"
      en: "Because you have said: The Lord hath raised us up prophets in Babylon:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quia haec dicit Dominus ad regem qui sedet super solium David et ad omnem populum habitatorem urbis huius ad fratres vestros qui non sunt egressi vobiscum in transmigrationem"
      en: "For thus saith the Lord to the king that sitteth upon the throne of David, and to all the people that dwell in this city, to your brethren that are not gone forth with you into captivity."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "haec dicit Dominus exercituum ecce mittam in eis gladium et famem et pestem et ponam eos quasi ficus malas quae comedi non possunt eo quod pessimae sint"
      en: "Thus saith the Lord of hosts: Behold I will send upon them the sword, and the famine, and the pestilence: and I will make them like bad figs that cannot be eaten, because they are very bad."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et persequar eos in gladio in fame et in pestilentia et dabo eos in vexationem universis regnis terrae in maledictionem et in stuporem et in sibilum et in obprobrium cunctis gentibus ad quas ego eieci eos"
      en: "And I will persecute them with the sword, and with famine, and pith the pestilence: and I will give them up unto affliction to all the kingdoms of the earth: to be a curse, and an astonishment, and a hissing, and a reproach to all the nations to which I have driven them out:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "eo quod non audierint verba mea dicit Dominus quae misi ad eos per servos meos prophetas de nocte consurgens et mittens et non audistis dicit Dominus"
      en: "Because they have not hearkened to my words, saith the Lord: which I sent to them by my servants the prophets, rising by night, and sending: and you have not heard, saith the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "vos ergo audite verbum Domini omnis transmigratio quam emisi de Hierusalem in Babylonem"
      en: "Hear ye therefore the word of the Lord, all ye of the captivity, whom I have sent out from Jerusalem to Babylon."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "haec dicit Dominus exercituum Deus Israhel ad Ahab filium Culia et ad Sedeciam filium Maasiae qui prophetant vobis in nomine meo mendaciter ecce ego tradam eos in manu Nabuchodonosor regis Babylonis et percutiet eos in oculis vestris"
      en: "Thus saith the Lord of hosts the God of Israel, to Achab the son of Colias, and to Sedecias the son of Maasias, who prophesy unto you in my name falsely: Behold I will deliver them up into the hands of Nabuchodonosor the king of Babylon: and he shall kill them before your eyes."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et adsumetur ex eis maledictio omni transmigrationi Iuda quae est in Babylone dicentium ponat te Dominus sicut Sedeciam et sicut Ahab quos frixit rex Babylonis in igne"
      en: "And of them shall be taken up a curse by all the captivity of Juda, that are in Babylon, saying: The Lord make thee like Sedecias, and like Achab, whom the king of Babylon fried in the fire :"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "pro eo quod fecerint stultitiam in Israhel et moechati sunt in uxores amicorum suorum et locuti sunt verbum in nomine meo mendaciter quod non mandavi eis ego sum iudex et testis dicit Dominus"
      en: "Because they have acted folly in Israel, and have committed adultery with the wives of their friends, and have spoken lying words in my name, which I commanded them not: I am the judge and the witness, saith the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et ad Semeiam Neelamiten dices"
      en: "And to Semeias the Nehelamite thou shalt say:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "haec dicit Dominus exercituum Deus Israhel pro eo quod misisti in nomine tuo libros ad omnem populum qui est in Hierusalem et ad Sophoniam filium Maasiae sacerdotem et ad universos sacerdotes dicens"
      en: "Thus saith the Lord of hosts the God of Israel: Because thou hast sent letters in thy name to all the people that are in Jerusalem, and to Sophonias the son of Maasias the priest, and to all the priests, saying:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dominus dedit te sacerdotem pro Ioiadae sacerdote ut sis dux in domo Domini super omnem virum arrepticium et prophetantem ut mittas eum in nervum et in carcerem"
      en: "The Lord hath made thee priest in- stead of Joiada the priest, that thou shouldst be ruler in the house of the Lord, over every man that raveth and prophesieth, to put him in the stocks, and into prison."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et nunc quare non increpasti Hieremiam Anathothiten qui prophetat vobis"
      en: "And now why hast thou not rebuked Jeremias the Anathothite, who prophesieth to you?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quia super hoc misit ad nos in Babylonem dicens longum est aedificate domos et habitate et plantate hortos et comedite fructum eorum"
      en: "For he hath also sent to us in Babylon, saying: It is a long time: build ye houses, and dwell in them: and plant gardens, and eat the fruits of them."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "legit ergo Sophonias sacerdos librum istum in auribus Hieremiae prophetae"
      en: "So Sophonias the priest read this letter, in the hearing of Jeremias the prophet."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et factum est verbum Domini ad Hieremiam dicens"
      en: "And the word of the Lord came to Jeremias, saying:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "mitte ad omnem transmigrationem dicens haec dicit Dominus ad Semeiam Neelamiten pro eo quod prophetavit vobis Semeias et ego non misi eum et fecit vos confidere in mendacio"
      en: "Send to all them of the captivity, saying: Thus saith the Lord to Semeias the Nehelamite: Because Semeias hath prophesied to you, and I sent him not: and hath caused you to trust in a lie :"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "idcirco haec dicit Dominus ecce ego visitabo super Semeiam Neelamiten et super semen eius non erit ei vir sedens in medio populi huius et non videbit bonum quod ego faciam populo meo ait Dominus quia praevaricationem locutus est adversum Dominum"
      en: "Therefore thus saith the Lord: behold I will visit upon Semeias the Nehelamite, and upon his seed: he shall not have a man to sit in the midst of this people, and he shall not see the good that I will do to my people, saith the Lord: because he hath spoken treason against the Lord."
    status: { la: verified, en: verified }
