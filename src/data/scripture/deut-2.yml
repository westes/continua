# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 2
verses:
  - n: 1
    text:
      la: "Profectique inde, venimus in solitudinem, quae ducit ad mare Rubrum, sicut mihi dixerat Dominus: et circuivimus montem Seir longo tempore."
      en: "And departing from thence we came into the wilderness that leadeth to the Red Sea, as the Lord had spoken to me: and we compassed mount Seir a long time."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixitque Dominus ad me:"
      en: "And the Lord said to me:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sufficit vobis circuire montem istum: ite contra aquilonem:"
      en: "You have compassed this mountain long enough: go toward the north:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et populo praecipe, dicens: Transibitis per terminos fratrum vestrorum filiorum Esau, qui habitant in Seir, et timebunt vos."
      en: "And command thou the people, saying: You shall pass by the borders of your brethren the children of Esau, who dwell in Seir, and they will be afraid of you."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Videte ergo diligenter ne moveamini contra eos. Neque enim dabo vobis de terra eorum quantum potest unius pedis calcare vestigium, quia in possessionem Esau dedi montem Seir."
      en: "Take ye then good heed that you stir not against them. For I will not give you of their land so much as the step of one foot can tread upon, because I have given mount Seir to Esau, for a possession."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cibos emetis ab eis pecunia, et comedetis: aquam emptam haurietis, et bibetis."
      en: "You shall buy meats of them for money and shall eat: you shall draw waters for money, and shall drink."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dominus Deus tuus benedixit tibi in omni opere manuum tuarum: novit iter tuum, quomodo transieris solitudinem hanc magnam, per quadraginta annos habitans tecum Dominus Deus tuus, et nihil tibi defuit."
      en: "The Lord thy God hath blessed thee in every work of thy hands: the Lord thy God dwelling with thee, knoweth thy journey, how thou hast passed through this great wilderness, for forty years, and thou hast wanted nothing."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque transissemus fratres nostros filios Esau, qui habitabant in Seir, per viam campestrem de Elath, et de Asiongaber, venimus ad iter quod ducit in desertum Moab."
      en: "And when we had passed by our brethren the children of Esau, that dwelt in Seir, by the way of the plain from Elath and from Asiongaber, we came to the way that leadeth to the desert of Moab."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixitque Dominus ad me: Non pugnes contra Moabitas, nec ineas adversus eos praelium: non enim dabo tibi quidquam de terra eorum, quia filiis Loth tradidi Ar in possessionem."
      en: "And the Lord said to me: Fight not against the Moabites, neither go to battle against them: for I will not give thee any of their land, because I have given Ar to the children of Lot in possession."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Emim primi fuerunt habitatores ejus, populus magnus, et validus, et tam excelsus ut de Enacim stirpe,"
      en: "The Emims first were the inhabitants thereof, a people great, and strong, and so tall, that like the race of the Enacims,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quasi gigantes crederentur, et essent similes filiorum Enacim. Denique Moabitae appellant eos Emim."
      en: "They were esteemed as giants, and were like the sons of the Enacims. But the Moabites call them Emims."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "In Seir autem prius habitaverunt Horrhaei: quibus expulsis atque deletis, habitaverunt filii Esau, sicut fecit Israel in terra possessionis suae, quam dedit illi Dominus."
      en: "The Horrhites also formerly dwelt in Seir: who being driven out and destroyed, the children of Esau dwelt there, as Israel did in the land of his possession, which the Lord gave him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Surgentes ergo ut transiremus torrentem Zared, venimus ad eum."
      en: "Then rising up to pass the torrent Zared, we came to it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tempus autem, quo ambulavimus de Cadesbarne usque ad transitum torrentis Zared, triginta et octo annorum fuit: donec consumeretur omnis generatio hominum bellatorum de castris, sicut juraverat Dominus:"
      en: "And the time that we journeyed from Cadesbarne till we passed over the torrent Zared, was thirty-eight years: until all the generation of the men that were fit for war was consumed out of the camp, as the Lord had sworn:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cujus manus fuit adversum eos, ut interirent de castrorum medio."
      en: "For his hand was against them, that they should perish from the midst of the camp."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Postquam autem universi ceciderunt pugnatores,"
      en: "And after all the fighting men were dead,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "locutus est Dominus ad me, dicens:"
      en: "The Lord spoke to me, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tu transibis hodie terminos Moab, urbem nomine Ar:"
      en: "Thou shalt pass this day the borders of Moab, the city named Ar:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et accedens in vicina filiorum Ammon, cave ne pugnes contra eos, nec movearis ad praelium: non enim dabo tibi de terra filiorum Ammon, quia filiis Loth dedi eam in possessionem."
      en: "And when thou comest nigh the frontiers of the children of Ammon, take heed thou fight not against them, nor once move to battle: for I will not give thee of the land of the children of Ammon, because I have given it to the children of Lot for a possession."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Terra gigantum reputata est: et in ipsa olim habitaverunt gigantes, quos Ammonitae vocant Zomzommim,"
      en: "It was accounted a land of giants: and giants formerly dwelt in it, whom the Ammonites call Zomzommims,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "populus magnus, et multus, et procerae longitudinis, sicut Enacim, quos delevit Dominus a facie eorum: et fecit illos habitare pro eis,"
      en: "A people great and many, and of tall stature, like the Enacims whom the Lord destroyed before their face: and he made them to dwell in their stead,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sicut fecerat filiis Esau, qui habitant in Seir, delens Horrhaeos, et terram eorum illis tradens, quam possident usque in praesens."
      en: "As he had done in favour of the children of Esau, that dwell in Seir, destroying the Horrhites, and delivering their land to them, which they possess to this day."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Hevaeos quoque, qui habitabant in Haserim usque Gazan, Cappadoces expulerunt: qui egressi de Cappadocia deleverunt eos, et habitaverunt pro illis."
      en: "The Hevites also, that dwelt in Haserim as far as Gaza, were expelled by the Cappadocians: who came out of Cappadocia, and destroyed them, and dwelt in their stead."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Surgite, et transite torrentem Arnon: ecce tradidi in manu tua Sehon regem Hesebon Amorrhaeum, et terram ejus incipe possidere, et committe adversus eum praelium."
      en: "Arise ye, and pass the torrent Arnon: Behold I have delivered into thy hand Sehon king of Hesebon the Amorrhite, and begin thou to possess his land and make war against him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Hodie incipiam mittere terrorem atque formidinem tuam in populos, qui habitant sub omni caelo: ut audito nomine tuo paveant, et in morem parturientium contremiscant, et dolore teneantur."
      en: "This day will I begin to send the dread and fear of thee upon the nations that dwell under the whole heaven: that when they hear thy name they may fear and tremble, and be in pain like women in travail."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Misi ergo nuntios de solitudine Cademoth ad Sehon regem Hesebon verbis pacificis, dicens:"
      en: "So I sent messengers from the wilderness of Cademoth to Sehon the king of Hesebon with peaceable words, saying:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Transibimus per terram tuam: publica gradiemur via; non declinabimus neque ad dexteram, neque ad sinistram."
      en: "We will pass through thy land, we will go along by the highway: we will not turn aside neither to the right hand nor to the left."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Alimenta pretio vende nobis, ut vescamur: aquam pecunia tribue, et sic bibemus. Tantum est ut nobis concedas transitum,"
      en: "Sell us meat for money, that we may eat: give us water for money and so we will drink. We only ask that thou wilt let us pass through,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sicut fecerunt filii Esau, qui habitant in Seir, et Moabitae, qui morantur in Ar: donec veniamus ad Jordanem, et transeamus ad terram, quam Dominus Deus noster daturus est nobis."
      en: "As the children of Esau have done, that dwell in Seir, and the Moabites, that abide in Ar: until we come to the Jordan, and pass to the land which the Lord our God will give us."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Noluitque Sehon rex Hesebon dare nobis transitum: quia induraverat Dominus Deus tuus spiritum ejus, et obfirmaverat cor illius, ut traderetur in manus tuas, sicut nunc vides."
      en: "And Sehon the king of Hesebon would not let us pass: because the Lord thy God had hardened his spirit, and fixed his heart, that he might be delivered into thy hands, as now thou seest."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Dixitque Dominus ad me: Ecce coepi tibi tradere Sehon, et terram ejus: incipe possidere eam."
      en: "And the Lord said to me: Behold I have begun to deliver unto thee Sehon and his land, begin to possess it."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Egressusque est Sehon obviam nobis cum omni populo suo ad praelium in Jasa."
      en: "And Sehon came out to meet us with all his people to fight at Jasa."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et tradidit eum Dominus Deus noster nobis: percussimusque eum cum filiis suis et omni populo suo."
      en: "And the Lord our God delivered him to us: and we slew him with his sons and all his people."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Cunctasque urbes in tempore illo cepimus, interfectis habitatoribus earum, viris ac mulieribus et parvulis: non reliquimus in eis quidquam,"
      en: "And we took all his cities at that time, killing the inhabitants of them, men and women and children. We left nothing of them:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "absque jumentis, quae in partem venere praedantium: et spoliis urbium, quas cepimus"
      en: "Except the cattle which came to the share of them that took them: and the spoils of the cities, which we took:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "ab Aroer, quae est super ripam torrentis Arnon, oppido quod in valle situm est, usque Galaad. Non fuit vicus et civitas, quae nostras effugeret manus: omnes tradidit Dominus Deus noster nobis,"
      en: "From Aroer, which is upon the bank of the torrent Arnon, a town that is situate in a valley, as far as Galaad. There was not a village or city, that escaped our hands: the Lord our God delivered all unto us:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "absque terra filiorum Ammon, ad quam non accessimus: et cunctis quae adjacent torrenti Jeboc, et urbibus montanis, universisque locis, a quibus nos prohibuit Dominus Deus noster."
      en: "Except the land of the children of Ammon, to which we approached not: and all that border upon the torrent Jeboc, and the cities in the mountains, and all the places which the Lord our God forbade us."
    status: { la: verified, en: verified }
