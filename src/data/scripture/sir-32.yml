# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 32
verses:
  - n: 1
    text:
      la: "rectorem te posuerunt noli extolli esto in illis quasi unus ex ipsis"
      en: "Have they made thee ruler? be not lifted up: be among them as one of them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "curam illorum habe et sic conside et omni cura tua explicita recumbe"
      en: "Have care of them, and so sit down, and when thou hast acquitted thyself of all thy charge, take thy place :"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ut laeteris propter illos et ornamentum gratiae accipias coronam et dignationem consequaris conrogationis"
      en: "That thou mayst rejoice for them, and receive a crown as an ornament of grace, and get the honour of the contribution."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "loquere maior natu decet enim te"
      en: "Speak, thou that art elder: for it becometh thee,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "primum verbum diligenti scientiam et non inpedias musica"
      en: "To speak the first word with care knowledge, and hinder not music."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ubi auditus est non effundas sermonem et inportune noli extolli in sapientia tua"
      en: "Where there is no hearing, pour out words, and be not lifted up out season with thy wisdom."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "gemmula carbunculi in ornamento auri et conparatio musicorum in convivio vini"
      en: "7A concert of music in a banquet wine is as a carbuncle set in gold."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sicut in fabricatione auri signum est zmaragdi sic numerus musicorum in iucundo et moderato vino"
      en: "As a signet of an emerald in a work of gold: so is the melody of music with pleasant and moderate wine."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "audi tacens et pro reverentia accedet tibi bona gratia"
      en: "Hear in silence, and for thy reverence good grace shall come to thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "adulescens loquere in tua causa vix"
      en: "Young man, scarcely speak in thy own cause."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si bis interrogatus fueris habeat caput responsum tuum"
      en: "If thou be asked twice, let thy answer be short."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in multis esto quasi inscius et audi tacens simul et quaerens"
      en: "In many things be as if thou wert ignorant, and hear in silence and withal seeking."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "in medio magnatorum non praesumas et ubi sunt senes non multum loquaris"
      en: "In the company of great men bake not upon thee: and when the ancients are present, speak not much."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ante grandinem praeibit coruscatio et pro reverentia accedet tibi bona gratia"
      en: "Before a storm goeth lightning: and before shamefacedness goeth favour: and for thy reverence good grace shall come to thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et hora surgendi non te trices praecurre autem prior in domum tuam et illic avocare et illic lude"
      en: "And at the time of rising be not slack: but be first to run home to thy house, and there withdraw thyself, and there take thy pastime."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et age conceptiones tuas et non in delictis et verbo superbo"
      en: "And do what thou hast a mind, but not in sin or proud speech."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et super his omnibus benedicito Dominum qui fecit te et inebriantem te ab omnibus bonis suis"
      en: "And for all these things bless the Lord, that made thee, and that replenisheth thee with all his good things."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui timet Deum excipiet doctrinam eius et qui vigilaverint ad illum invenient benedictionem"
      en: "He that feareth the Lord, will receive his discipline: and they that will seek him early, shall find a blessing."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui quaerit legem replebitur ab ea et qui insidiose agit scandalizabitur in ea"
      en: "He that seeketh the law, shall be filled with it: and he that dealeth deceitfully, shall meet with a stumblingblock therein."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui timent Dominum invenient iudicium iustum et iustitias quasi lucem accendent"
      en: "They that fear the Lord, shall find just judgment, and shall kindle justice as a light."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "peccator homo devitabit correptionem et secundum voluntatem suam inveniet conparationem"
      en: "A sinful man will flee reproof, and will find an excuse according to his will."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vir consilii non disperiet intellegentia alienus et superbus non pertimescit timorem"
      en: "A man of counsel will not neglect understanding, a strange and proud man will not dread fear:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "etiam postquam fecit cum eo sine consilio et suis insectationibus arguetur"
      en: "Even after he hath done with fear without counsel, he shall be controlled by the things of his own seeking."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "fili sine consilio nihil facias et post factum non paeniteberis"
      en: "My son, do thou nothing without counsel, and thou shalt not repent when thou hast done."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "in via ruinae non eas et non offendes in lapides ne credas te viae laboriosae ne ponas animae tuae scandalum"
      en: "Go not in the way of ruin, and thou shalt not stumble against the stones; trust not thyself to a rugged may, lest thou set a stumblingblock to thy soul."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et a filiis tuis cave et a domesticis tuis adtende"
      en: "And beware of thy own children, and take heed of them of thy household."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "in omni opere crede ex fide animae tuae haec est enim conservatio mandatorum"
      en: "In every work of thine regard thy soul in faith: for this is the keeping of the commandments."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui credit Deo adtendit mandatis et qui confident in illo non minorabuntur"
      en: "He that believeth God, taketh heed to the commandments: and he that trusteth in him, shall fare never the worse."
    status: { la: verified, en: verified }
