# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 14
verses:
  - n: 1
    text:
      la: "anno secundo Ioas filii Ioachaz regis Israhel regnavit Amasias filius Ioas regis Iuda"
      en: "In the second year of Joas son of Joachaz, king of Israel, reigned Amasias son of Joas king of Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "viginti quinque annorum erat cum regnare coepisset viginti autem et novem annis regnavit in Hierusalem nomen matris eius Ioaden de Hierusalem"
      en: "He was five and twenty years old when he began to reign: and nine and twenty gears he reigned in Jerusalem: the name of his mother was Joadan of Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et fecit rectum coram Domino verumtamen non ut David pater eius iuxta omnia quae fecit Ioas pater suus fecit"
      en: "And he did that which was right before the Lord, but yet not like David his father. He did according to all things that Joas his father did:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nisi hoc tantum quod excelsa non abstulit adhuc enim populus immolabat et adolebat in excelsis"
      en: "But this only, that he took not away the high places: for yet the people sacrificed and burnt incense in the high places."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque obtinuisset regnum percussit servos suos qui interfecerant regem patrem suum"
      en: "And when he had possession of the kingdom, he put his servants to death that had slain the king his father:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "filios autem eorum qui occiderant non occidit iuxta quod scriptum est in libro legis Mosi sicut praecepit Dominus dicens non morientur patres pro filiis neque filii morientur pro patribus sed unusquisque in peccato suo morietur"
      en: "But the children of the murderers he did not put to death, according to that which is written in the book of the law of Moses, wherein the Lord commanded, saying: The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: but every man shall die for his own sins."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ipse percussit Edom in valle Salinarum decem milia et adprehendit Petram in proelio vocavitque nomen eius Iecethel usque in praesentem diem"
      en: "He slew of Edom h in the valley of the Saltpits ten thousand men, and took the rock by war, and called the name thereof Jectehel, unto this day."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tunc misit Amasias nuntios ad Ioas filium Ioachaz filii Hieu regis Israhel dicens veni et videamus nos"
      en: "Then Amasias sent messengers to Joas son of Joachaz, son of Jehu king of Israel, saying: Come let us see one another."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "remisitque Ioas rex Israhel ad Amasiam regem Iuda dicens carduus Libani misit ad cedrum quae est in Libano dicens da filiam tuam filio meo uxorem transieruntque bestiae saltus quae sunt in Libano et conculcaverunt carduum"
      en: "And Joas king of Israel sent again to Amasias king of Juda, saying: A thistle of Libanus sent to a cedar tree, which is in Libanus, saying: Give thy daughter to my son to wife. And the beasts of the forest, that are in Libanus, passed and trod down the thistle."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "percutiens invaluisti super Edom et sublevavit te cor tuum contentus esto gloria et sede in domo tua quare provocas malum ut cadas tu et Iuda tecum"
      en: "Thou hast beaten and prevailed over Edom, and thy heart hath lifted thee up: be content with the glory, and sit at home: why provokest thou evil, that thou shouldst fall, and Juda with thee?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et non adquievit Amasias ascenditque Ioas rex Israhel et viderunt se ipse et Amasias rex Iuda in Bethsames oppido Iudae"
      en: "But Amasias did not rest satisfied. So Joas king of Israel went up, and he and Amasias king of Juda saw one another in Bethsames a town in Juda."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "percussusque est Iuda coram Israhel et fugerunt unusquisque in tabernacula sua"
      en: "And Juda was put to the worst before Israel, and they fled every man to their dwellings."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Amasiam vero regem Iuda filium Ioas filii Ahaziae cepit Ioas rex Israhel in Bethsames et adduxit eum in Hierusalem et interrupit murum Hierusalem a porta Ephraim usque ad portam Anguli quadringentis cubitis"
      en: "But Joas king of Israel took Amasias, king of Juda the son of Joas, the son of Ochozias, in Bethsames, and brought him into Jerusalem: and he broke down the wall of Jerusalem, from the gate of Ephraim to the gate of the corner, four hundred cubits."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tulitque omne aurum et argentum et universa vasa quae inventa sunt in domo Domini et in thesauris regis et obsides et reversus est Samariam"
      en: "And he took all the gold, and silver, and all the vessels, that were found in the house of the Lord, and in the king's treasures, and hostages, and returned to Samaria."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "reliqua autem verborum Ioas quae fecit et fortitudo eius qua pugnavit contra Amasiam regem Iuda nonne haec scripta sunt in libro sermonum dierum regum Israhel"
      en: "But the rest of the acts of Joas, which he did, and his valour, wherewith he fought against Amasias king of Juda, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dormivitque Ioas cum patribus suis et sepultus est in Samaria cum regibus Israhel et regnavit Hieroboam filius eius pro eo"
      en: "And Joas slept with his fathers, and was buried in Samaria, with the kings of Israel: and Jeroboam his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "vixit autem Amasias filius Ioas rex Iuda postquam mortuus est Ioas filius Ioachaz regis Israhel viginti quinque annis"
      en: "And Amasias the son of Joas king of Juda lived, after the death of Joas son of Joachaz king of Israel fifteen years."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "reliqua autem sermonum Amasiae nonne haec scripta sunt in libro sermonum dierum regum Iuda"
      en: "And the rest of the acts of Amasias, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "factaque est contra eum coniuratio in Hierusalem at ille fugit in Lachis miseruntque post eum in Lachis et interfecerunt eum ibi"
      en: "Now they made a conspiracy against him in Jerusalem: and he fled to Lachis. And they sent after him to Lachis, and killed him there."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et asportaverunt in equis sepultusque est in Hierusalem cum patribus suis in civitate David"
      en: "And they brought him away upon horses, and he was buried in Jerusalem with his fathers in the city of David."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "tulit autem universus populus Iudae Azariam annos natum sedecim et constituerunt eum regem pro patre eius Amasia"
      en: "And all the people of Juda took Azarias, who was sixteen years old, and made him king instead of his father Amasias."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ipse aedificavit Ahilam et restituit eam Iudae postquam dormivit rex cum patribus suis"
      en: "He built Elath, and restored it to Juda, after that the king slept with his fathers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "anno quintodecimo Amasiae filii Ioas regis Iuda regnavit Hieroboam filius Ioas regis Israhel in Samaria quadraginta et uno anno"
      en: "In the fifteenth year of Amasias k son of Joas king of Juda, reigned Jeroboam the son of Joas king of Israel in Samaria, one and forty years :"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et fecit quod malum est coram Domino non recessit ab omnibus peccatis Hieroboam filii Nabath qui peccare fecit Israhel"
      en: "And he did that which was evil before the Lord. He departed not from all the sins of Jeroboam the son of Nabat, who made Israel to sin."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ipse restituit terminos Israhel ab introitu Emath usque ad mare Solitudinis iuxta sermonem Domini Dei Israhel quem locutus est per servum suum Ionam filium Amathi prophetam qui erat de Geth quae est in Opher"
      en: "He restored the borders of Israel from the entrance of Emath, unto the sea of the wilderness, according to the word of the Lord the God of Israel, which he spoke by his servant Jonas the son of Amathi, the prophet, who was of Geth, which is in Opher."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "vidit enim Dominus adflictionem Israhel amaram nimis et quod consumpti essent usque ad clausos carcere et extremos et non esset qui auxiliaretur Israhel"
      en: "For the Lord saw the affliction of Israel that it was exceeding bitter, and that they were consumed even to them that were shut up in prison, and the lowest persons, and that there was no one to help Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "nec locutus est Dominus ut deleret nomen Israhel sub caelo sed salvavit eos in manu Hieroboam filii Ioas"
      en: "And the Lord did not say that he would blot out the name of Israel from under heaven, but he saved them by the hand of Jeroboam the son of Joas."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "reliqua autem sermonum Hieroboam et universa quae fecit et fortitudo eius qua proeliatus est et quomodo restituit Damascum et Emath Iudae in Israhel nonne haec scripta sunt in libro sermonum dierum regum Israhel"
      en: "But the rest of the acts of Jeroboam, and all that he did, and his velour, where- with he fought, and how he restored Damascus, and Emath to Juda in Israel, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "dormivitque Hieroboam cum patribus suis regibus Israhel et regnavit Zaccharias filius eius pro eo"
      en: "And Jeroboam slept with his fathers the kings of Israel, and Zacharias his son reigned in his stead."
    status: { la: verified, en: verified }
