# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 14
verses:
  - n: 1
    text:
      la: "In anno secundo Joas filii Joachaz regis Israel, regnavit Amasias filius Joas regis Juda."
      en: "In the second year of Joas son of Joachaz, king of Israel, reigned Amasias son of Joas king of Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Viginti quinque annorum erat cum regnare coepisset: viginti autem et novem annis regnavit in Jerusalem. Nomen matris ejus Joadan de Jerusalem."
      en: "He was five and twenty years old when he began to reign: and nine and twenty years he reigned in Jerusalem: the name of his mother was Joadan of Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et fecit rectum coram Domino, verumtamen non ut David pater ejus. Juxta omnia, quae fecit Joas pater suus, fecit:"
      en: "And he did that which was right before the Lord, but yet not like David his father. He did according to all things that Joas his father did:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nisi hoc tantum quod excelsa non abstulit: adhuc enim populus immolabat, et adolebat incensum in excelsis."
      en: "But this only, that he took not away the high places: for yet the people sacrificed and burnt incense in the high places."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque obtinuisset regnum, percussit servos suos, qui interfecerant regem patrem suum:"
      en: "And when he had possession of the kingdom, he put his servants to death that had slain the king his father:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "filios autem eorum, qui occiderant, non occidit, juxta quod scriptum est in libro legis Moysi, sicut praecepit Dominus, dicens: Non morientur patres pro filiis, neque filii morientur pro patribus: sed unusquisque in peccato suo morietur."
      en: "But the children of the murderers he did not put to death, according to that which is written in the book of the law of Moses, wherein the Lord commanded, saying: The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: but every man shall die for his own sins."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ipse percussit Edom in valle Salinarum decem millia, et apprehendit petram in praelio, vocavitque nomen ejus Jectehel usque in praesentem diem."
      en: "He slew of Edom in the valley of the Saltpits ten thousand men, and took the rock by war, and called the name thereof Jectehel, unto this day."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Tunc misit Amasias nuntios ad Joas filium Joachaz, filii Jehu regis Israel, dicens: Veni, et videamus nos."
      en: "Then Amasias sent messengers to Joas son of Joachaz, son of Jehu king of Israel, saying: Come let us see one another."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Remisitque Joas rex Israel ad Amasiam regem Juda, dicens: Carduus Libani misit ad cedrum, quae est in Libano, dicens: Da filiam tuam filio meo uxorem. Transieruntque bestiae saltus, quae sunt in Libano, et conculcaverunt carduum."
      en: "And Joas king of Israel sent again to Amasias king of Juda, saying: A thistle of Libanus sent to a cedar tree, which is in Libanus, saying: Give thy daughter to my son to wife. And the beasts of the forest, that are in Libanus, passed and trod down the thistle."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Percutiens invaluisti super Edom, et sublevavit te cor tuum: contentus esto gloria, et sede in domo tua: quare provocas malum, ut cadas tu et Judas tecum?"
      en: "Thou hast beaten and prevailed over Edom, and thy heart hath lifted thee up: be content with the glory, and sit at home: why provokest thou evil, that thou shouldst fall, and Juda with thee?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et non acquievit Amasias. Ascenditque Joas rex Israel, et viderunt se, ipse et Amasias rex Juda, in Bethsames oppido Judae."
      en: "But Amasias did not rest satisfied. So Joas king of Israel went up, and he and Amasias king of Juda saw one another in Bethsames a town in Juda."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Percussusque est Juda coram Israel, et fugerunt unusquisque in tabernacula sua."
      en: "And Juda was put to the worst before Israel, and they fled every man to their dwellings."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Amasiam vero regem Juda, filium Joas filii Ochoziae, cepit Joas rex Israel in Bethsames, et adduxit eum in Jerusalem: et interrupit murum Jerusalem, a porta Ephraim usque ad portam anguli, quadringentis cubitis."
      en: "But Joas king of Israel took Amasias, king of Juda the son of Joas, the son of Ochozias, in Bethsames, and brought him into Jerusalem: and he broke down the wall of Jerusalem, from the gate of Ephraim to the gate of the corner, four hundred cubits."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tulitque omne aurum, et argentum, et universa vasa, quae inventa sunt in domo Domini, et in thesauris regis, et obsides, et reversus est in Samariam."
      en: "And he took all the gold, and silver, and all the vessels, that were found in the house of the Lord, and in the king's treasures, and hostages, and returned to Samaria."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Reliqua autem verborum Joas quae fecit, et fortitudo ejus qua pugnavit contra Amasiam regem Juda, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "But the rest of the acts of Joas, which he did, and his valour, wherewith he fought against Amasias king of Juda, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dormivitque Joas cum patribus suis, et sepultus est in Samaria cum regibus Israel, et regnavit Jeroboam filius ejus pro eo."
      en: "And Joas slept with his fathers, and was buried in Samaria, with the kings of Israel: and Jeroboam his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Vixit autem Amasias, filius Joas, rex Juda, postquam mortuus est Joas filius Joachaz regis Israel, quindecim annis."
      en: "And Amasias the son of Joas king of Juda lived, after the death of Joas son of Joachaz king of Israel fifteen years."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Reliqua autem sermonum Amasiae, nonne haec scripta sunt in libro sermonum dierum regum Juda?"
      en: "And the rest of the acts of Amasias, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Factaque est contra eum conjuratio in Jerusalem: at ille fugit in Lachis. Miseruntque post eum in Lachis, et interfecerunt eum ibi."
      en: "Now they made a conspiracy against him in Jerusalem: and he fled to Lachis. And they sent after him to Lachis, and killed him there."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et asportaverunt in equis, sepultusque est in Jerusalem cum patribus suis in civitate David."
      en: "And they brought him away upon horses, and he was buried in Jerusalem with his fathers in the city of David."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Tulit autem universus populus Judae Azariam annos natum sedecim, et constituerunt eum regem pro patre ejus Amasia."
      en: "And all the people of Juda took Azarias, who was sixteen years old, and made him king instead of his father Amasias."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ipse aedificavit Aelath, et restituit eam Judae, postquam dormivit rex cum patribus suis."
      en: "He built Elath, and restored it to Juda, after that the king slept with his fathers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Anno quintodecimo Amasiae filii Joas regis Juda, regnavit Jeroboam filius Joas regis Israel in Samaria, quadraginta et uno anno:"
      en: "In the fifteenth year of Amasias son of Joas king of Juda, reigned Jeroboam the son of Joas king of Israel in Samaria, one and forty years:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et fecit quod malum est coram Domino. Non recessit ab omnibus peccatis Jeroboam filii Nabat, qui peccare fecit Israel."
      en: "And he did that which was evil before the Lord. He departed not from all the sins of Jeroboam the son of Nabat, who made Israel to sin."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ipse restituit terminos Israel ab introitu Emath, usque ad mare solitudinis, juxta sermonem Domini Dei Israel, quem locutus est per servum suum Jonam filium Amathi prophetam, qui erat de Geth, quae est in Opher."
      en: "He restored the borders of Israel from the entrance of Emath, unto the sea of the wilderness, according to the word of the Lord the God of Israel, which he spoke by his servant Jonas the son of Amathi, the prophet, who was of Geth, which is in Opher."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Vidit enim Dominus afflictionem Israel amaram nimis, et quod consumpti essent usque ad clausos carcere, et extremos, et non esset qui auxiliaretur Israeli."
      en: "For the Lord saw the affliction of Israel that it was exceeding bitter, and that they were consumed even to them that were shut up in prison, and the lowest persons, and that there was no one to help Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Nec locutus est Dominus ut deleret nomen Israel de sub caelo, sed salvavit eos in manu Jeroboam filii Joas."
      en: "And the Lord did not say that he would blot out the name of Israel from under heaven, but he saved them by the hand of Jeroboam the son of Joas."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Reliqua autem sermonum Jeroboam, et universa quae fecit, et fortitudo ejus, qua praeliatus est, et quomodo restituit Damascum et Emath Judae in Israel, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "But the rest of the acts of Jeroboam, and all that he did, and his valour, wherewith he fought, and how he restored Damascus, and Emath to Juda in Israel, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Dormivitque Jeroboam cum patribus suis regibus Israel, et regnavit Zacharias filius ejus pro eo."
      en: "And Jeroboam slept with his fathers the kings of Israel, and Zacharias his son reigned in his stead."
    status: { la: verified, en: verified }
