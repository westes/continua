# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 20
verses:
  - n: 1
    text:
      la: "Et factum est in una dierum, docente illo populum in templo, et evangelizante, convenerunt principes sacerdotum, et scribae cum senioribus,"
      en: "And it came to pass, that on one of the days, as he was teaching the people in the temple, and preaching the gospel, the chief priests and the scribes, with the ancients, met together,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et aiunt dicentes ad illum: Dic nobis in qua potestate haec facis? aut quis est qui dedit tibi hanc potestatem?"
      en: "And spoke to him, saying: Tell us, by what authority dost thou these things? or, Who is he that hath given thee this authority?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Respondens autem Jesus, dixit ad illos: Interrogabo vos et ego unum verbum. Respondete mihi:"
      en: "And Jesus answering, said to them: I will also ask you one thing. Answer me:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "baptismus Joannis de caelo erat, an ex hominibus?"
      en: "The baptism of John, was it from heaven, or of men?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "At illi cogitabant intra se, dicentes: Quia si dixerimus: De caelo, dicet: Quare ergo non credidistis illi?"
      en: "But they thought within themselves, saying: If we shall say, From heaven: he will say: Why then did you not believe him?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Si autem dixerimus: Ex hominibus, plebs universa lapidabit nos: certi sunt enim Joannem prophetam esse."
      en: "But if we say, Of men, the whole people will stone us: for they are persuaded that John was a prophet."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et responderunt se nescire unde esset."
      en: "And they answered, that they knew not whence it was."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et Jesus ait illis: Neque ego dico vobis in qua potestate haec facio."
      en: "And Jesus said to them: Neither do I tell thee by what authority I do these things."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Coepit autem dicere ad plebem parabolam hanc: Homo plantavit vineam, et locavit eam colonis: et ipse peregre fuit multis temporibus."
      en: "And he began to speak to the people this parable: A certain man planted a vineyard, and let it out to husbandmen: and he was abroad for a long time."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et in tempore misit ad cultores servum, ut de fructu vineae darent illi. Qui caesum dimiserunt eum inanem."
      en: "And at the season he sent a servant to the husbandmen, that they should give him of the fruit of the vineyard. Who, beating him, sent him away empty."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et addidit alterum servum mittere. Illi autem hunc quoque caedentes, et afficientes contumelia, dimiserunt inanem."
      en: "And again he sent another servant. But they beat him also, and treating him reproachfully, sent him away empty."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et addidit tertium mittere: qui et illum vulnerantes ejecerunt."
      en: "And again he sent the third: and they wounded him also, and cast him out."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixit autem dominus vineae: Quid faciam? Mittam filium meum dilectum: forsitan, cum hunc viderint, verebuntur."
      en: "Then the lord of the vineyard said: What shall I do? I will send my beloved son: it may be, when they see him, they will reverence him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quem cum vidissent coloni, cogitaverunt intra se, dicentes: Hic est haeres, occidamus illum, ut nostra fiat haereditas."
      en: "Whom when the husbandmen saw, they thought within themselves, saying: This is the heir, let us kill him, that the inheritance may be ours."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ejectum illum extra vineam, occiderunt. Quid ergo faciet illis dominus vineae?"
      en: "So casting him out of the vineyard, they killed him. What therefore will the lord of the vineyard do to them?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "veniet, et perdet colonos istos, et dabit vineam aliis. Quo audito, dixerunt illi: Absit."
      en: "He will come, and will destroy these husbandmen, and will give the vineyard to others. Which they hearing, said to him: God forbid."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ille autem aspiciens eos, ait: Quid est ergo hoc quod scriptum est: Lapidem quem reprobaverunt aedificantes, hic factus est in caput anguli?"
      en: "But he looking on them, said: What is this then that is written, The stone, which the builders rejected, the same is become the head of the corner?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Omnis qui ceciderit super illum lapidem, conquassabitur: super quem autem ceciderit, comminuet illum."
      en: "Whosoever shall fall upon that stone, shall be bruised: and upon whomsoever it shall fall, it will grind him to powder."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et quaerebant principes sacerdotum et scribae mittere in illum manus illa hora, et timuerunt populum: cognoverunt enim quod ad ipsos dixerit similitudinem hanc."
      en: "And the chief priests and the scribes sought to lay hands on him the same hour: but they feared the people, for they knew that he spoke this parable to them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et observantes miserunt insidiatores, qui se justos simularent, ut caparent eum in sermone, ut traderent illum principatui, et potestati praesidis."
      en: "And being upon the watch, they sent spies, who should feign themselves just, that they might take hold of him in his words, that they might deliver him up to the authority and power of the governor."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et interrogaverunt eum, dicentes: Magister, scimus quia recte dicis et doces: et non accipis personam, sed viam Dei in veritate doces."
      en: "And they asked him, saying: Master, we know that thou speakest and teachest rightly: and thou dost not respect any person, but teachest the way of God in truth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Licet nobis tributum dare Caesari, an non?"
      en: "Is it lawful for us to give tribute to Caesar, or no?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Considerans autem dolum illorum, dixit ad eos: Quid me tentatis?"
      en: "But he considering their guile, said to them: Why tempt you me?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ostendite mihi denarium. Cujus habet imaginem et inscriptionem? Respondentes dixerunt ei: Caesaris."
      en: "shew me a penny. Whose image and inscription hath it? They answering, said to him, Caesar's."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et ait illis: Reddite ergo quae sunt Caesaris, Caesari: et quae sunt Dei, Deo."
      en: "And he said to them: Render therefore to Caesar the things that are Caesar's: and to God the things that are God's."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et non potuerunt verbum ejus reprehendere coram plebe: et mirati in responso ejus, tacuerunt."
      en: "And they could not reprehend his word before the people: and wondering at his answer, they held their peace."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Accesserunt autem quidam sadducaeorum, qui negant esse resurrectionem, et interrogaverunt eum,"
      en: "And there came to him some of the Sadducees, who deny that there is any resurrection, and they asked him,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dicentes: Magister, Moyses scripsit nobis: Si frater alicujus mortuus fuerit habens uxorem, et hic sine liberis fuerit, ut accipiat eam frater ejus uxorem, et suscitet semen fratri suo."
      en: "Saying: Master, Moses wrote unto us, If any man's brother die, having a wife, and he leave no children, that his brother should take her to wife, and raise up seed unto his brother."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Septem ergo fratres erant: et primus accepit uxorem, et mortuus est sine filiis."
      en: "There were therefore seven brethren: and the first took a wife, and died without children."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et sequens accepit illam, et ipse mortuus est sine filio."
      en: "And the next took her to wife, and he also died childless."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et tertius accepit illam. Similiter et omnes septem, et non reliquerunt semen, et mortui sunt."
      en: "And the third took her. And in like manner all the seven, and they left no children, and died."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Novissime omnium mortua est et mulier."
      en: "Last of all the woman died also."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "In resurrectione ergo, cujus eorum erit uxor? siquidem septem habuerunt eam uxorem."
      en: "In the resurrection therefore, whose wife of them shall she be? For all the seven had her to wife."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et ait illis Jesus: Filii hujus saeculi nubunt, et traduntur ad nuptias:"
      en: "And Jesus said to them: The children of this world marry, and are given in marriage:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "illi vero qui digni habebuntur saeculo illo, et resurrectione ex mortuis, neque nubent, neque ducent uxores:"
      en: "But they that shall be accounted worthy of that world, and of the resurrection from the dead, shall neither be married, nor take wives."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "neque enim ultra mori potuerunt: aequales enim angelis sunt, et filii sunt Dei, cum sint filii resurrectionis."
      en: "Neither can they die any more: for they are equal to the angels, and are the children of God, being the children of the resurrection."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Quia vero resurgant mortui, et Moyses ostendit secus rubum, sicut dicit Dominum, Deum Abraham, et Deum Isaac, et Deum Jacob."
      en: "Now that the dead rise again, Moses also shewed, at the bush, when he called the Lord, The God of Abraham, and the God of Isaac, and the God of Jacob;"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Deus autem non est mortuorum, sed vivorum: omnes enim vivunt ei."
      en: "For he is not the God of the dead, but of the living: for all live to him."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Respondentes autem quidam scribarum, dixerunt ei: Magister, bene dixisti."
      en: "And some of the scribes answering, said to him: Master, thou hast said well."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et amplius non audebant eum quidquam interrogare."
      en: "And after that they durst not ask him any more questions."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Dixit autem ad illos: Quomodo dicunt Christum filium esse David?"
      en: "But he said to them: How say they that Christ is the son of David?"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et ipse David dicit in libro Psalmorum: Dixit Dominus Domino meo: sede a dextris meis,"
      en: "And David himself saith in the book of Psalms: The Lord said to my Lord, sit thou on my right hand,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "donec ponam inimicos tuos scabellum pedum tuorum."
      en: "Till I make thy enemies thy footstool."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "David ergo Dominum illum vocat: et quomodo filius ejus est?"
      en: "David then calleth him Lord: and how is he his son?"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Audiente autem omni populo, dixit discipulis suis:"
      en: "And in the hearing of all the people, he said to his disciples:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Attendite a scribis, qui volunt ambulare in stolis, et amant salutationes in foro, et primas cathedras in synagogis, et primos discubitus in conviviis,"
      en: "Beware of the scribes, who desire to walk in long robes, and love salutations in the marketplace, and the first chairs in the synagogues, and the chief rooms at feasts:"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "qui devorant domos viduarum, simulantes longam orationem: hi accipient damnationem majorem."
      en: "Who devour the houses of widows, feigning long prayer. These shall receive greater damnation."
    status: { la: verified, en: verified }
