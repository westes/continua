# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 8
verses:
  - n: 1
    text:
      la: "in tempore illo ait Dominus eicient ossa regis Iuda et ossa principum eius et ossa sacerdotum et ossa prophetarum et ossa eorum qui habitaverunt Hierusalem de sepulchris suis"
      en: "At that time, saith the Lord, they shall cast out the bones of the kings of Juda, and the bones of the princes thereof, and the bones of the priests, and the bones of the inhabitants of Jerusalem, out of their graves."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et pandent ea ad solem et lunam et omnem militiam caeli quae dilexerunt et quibus servierunt et post quae ambulaverunt et quae quaesierunt et adoraverunt non colligentur et non sepelientur in sterquilinium super faciem terrae erunt"
      en: "And they shall spread them abroad to the sun, and the moon, and all the host of heaven, whom they have loved, and whom they have served, and after whom they have walked, and whom they have sought, and adored: they shall not be gathered, and they shall not be buried: they shall be as dung upon the face of the earth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et eligent magis mortem quam vitam omnes qui residui fuerint de cognatione hac pessima in universis locis quae derelicta sunt ad quae eieci eos dicit Dominus exercituum"
      en: "And death shall be chosen rather than life by all that shall remain of this wicked kindred in all places, which are left, to which I have cast them out, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dices ad eos haec dicit Dominus numquid qui cadet non resurget et qui aversus est non revertetur"
      en: "And thou shalt say to them: Thus saith the Lord: Shall not he that falleth, rise again? and he that is turned away, shall he not turn again?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quare ergo aversus est populus iste in Hierusalem aversione contentiosa adprehenderunt mendacium et noluerunt reverti"
      en: "Why then is this people in Jerusalem turned away with a stubborn revolting? they have laid hold on lying, and have refused to return."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "adtendi et auscultavi nemo quod bonum est loquitur nullus est qui agat paenitentiam super peccato suo dicens quid feci omnes conversi sunt ad cursum suum quasi equus impetu vadens in proelio"
      en: "I attended, and hearkened; no man speaketh what is good, there is none that doth penance for his sin, saying: What have I done? They are all turned to their own course, as a horse rushing to the battle."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "milvus in caelo cognovit tempus suum turtur et hirundo et ciconia custodierunt tempus adventus sui populus autem meus non cognovit iudicium Domini"
      en: "The kite in the air hath known her time: the turtle, and the swallow, and the stork have observed the time of their coming: but my people have not known the judgment of the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quomodo dicitis sapientes nos sumus et lex Domini nobiscum est vere mendacium operatus est stilus mendax scribarum"
      en: "How do you say: We are wise, and the law of the Lord is with us? Indeed the lying pen of the scribes hath wrought falsehood."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "confusi sunt sapientes perterriti et capti sunt verbum enim Domini proiecerunt et sapientia nulla est in eis"
      en: "The wise men are confounded, they are dismayed, and taken: for they have cast away the word of the Lord, and there is no wisdom in them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "propterea dabo mulieres eorum exteris agros eorum heredibus quia a minimo usque ad maximum omnes avaritiam sequuntur a propheta usque ad sacerdotem cuncti faciunt mendacium"
      en: "Therefore I will give their women to strangers, their fields to others for an inheritance: because from the least even to the greatest all follow covetousness: from the prophet even to the priest, all deal deceitfully."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et sanabant contritionem filiae populi mei ad ignominiam dicentes pax pax cum non esset pax"
      en: "And they healed the breach of the daughter of my people disgracefully, saying Peace, peace: when there was no peace."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "confusi sunt quia abominationem fecerunt quinimmo confusione non sunt confusi et erubescere nescierunt idcirco cadent inter corruentes in tempore visitationis suae corruent dicit Dominus"
      en: "They are confounded, because they have committed abomination: yea rather they are not confounded with confusion, and they have not know how to blush: therefore shall they fall among them that fall; in the time of their visitation they shall fall, saith the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "congregans congregabo eos ait Dominus non est uva in vitibus et non sunt ficus in ficulnea folium defluxit et dedi eis quae praetergressa sunt"
      en: "Gathering I will gather them together, saith the Lord, there is no grape on the vines, and there are no figs on the fig tree, the leaf is fallen: and I have given them the things that are passed away."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quare sedemus convenite et ingrediamur civitatem munitam et sileamus ibi quia Dominus noster silere nos fecit et potum dedit nobis aquam fellis peccavimus enim Domino"
      en: "Why do we sit still? assemble yourselves, and let us enter into the fenced city, and let us be silent there: for the Lord our God hath put us to silence, and hath given us water of gall to drink: for we have sinned against the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "expectavimus pacem et non erat bonum tempus medellae et ecce formido"
      en: "We looked for peace and no good came: for a time of healing, and behold fear."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "a Dan auditus est fremitus equorum eius a voce hinnituum pugnatorum eius commota est omnis terra et venerunt et devoraverunt terram et plenitudinem eius urbem et habitatores eius"
      en: "The snorting of his horse was heard from Dan, all the land was moved at the sound of the neighing of his warriors: and they came and devoured the land, and all that was in it: the city and its inhabitants."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quia ecce ego mittam vobis serpentes regulos quibus non est incantatio et mordebunt vos ait Dominus"
      en: "For behold I will send among you serpents, basilisks, against which there is no charm: and they shall bite you, saith the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dolor meus super dolorem in me cor meum maerens"
      en: "My sorrow is above sorrow, my heart mourneth within me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ecce vox clamoris filiae populi mei de terra longinqua numquid Dominus non est in Sion aut rex eius non est in ea quare ergo me ad iracundiam concitaverunt in sculptilibus suis et in vanitatibus alienis"
      en: "Behold the voice of the daughter my people from a far country: Is not the Lord in Sion, or is not her king in her? why then have they provoked me to wrath with their idols, and strange vanities?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "transiit messis finita est aestas et nos salvati non sumus"
      en: "The harvest is passed, the summer is ended, and we are not saved."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "super contritionem filiae populi mei contritus sum et contristatus stupor obtinuit me"
      en: "For the affliction of the daughter of my people I am afflicted, and made sorrowful, astonishment hath taken hold on me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "numquid resina non est in Galaad aut medicus non est ibi quare igitur non est obducta cicatrix filiae populi mei"
      en: "Is there no balm in Galaad? or is no physician there? Why then is not the wound of the daughter of my people closed?"
    status: { la: verified, en: verified }
