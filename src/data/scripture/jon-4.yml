# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jon
chapter: 4
verses:
  - n: 1
    text:
      la: "et adflictus est Iona adflictione magna et iratus est"
      en: "And Jonas was exceedingly troubled, and was angry:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et oravit ad Dominum et dixit obsecro Domine numquid non hoc est verbum meum cum adhuc essem in terra mea propter hoc praeoccupavi ut fugerem in Tharsis scio enim quia tu Deus clemens et misericors es patiens et multae miserationis et ignoscens super malitia"
      en: "And he prayed to the Lord, and said: I beseech thee, O Lord, is not this what I said, when I was yet in my own country? therefore I went before to flee into Tharsis: for I know that thou art a gracious and merciful God, patient, and of much compassion, and easy to forgive evil."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et nunc Domine tolle quaeso animam meam a me quia melior est mihi mors quam vita"
      en: "And now, O Lord, I beseech thee take my life from me: for it is better for me to die than to live."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixit Dominus putasne bene irasceris tu"
      en: "And the Lord said: Dost thou think thou hast reason to be angry?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et egressus est Iona de civitate et sedit contra orientem civitatis et fecit sibimet ibi umbraculum et sedebat subter eum in umbra donec videret quid accideret civitati"
      en: "Then Jonas went out of the city, and sat toward the east side of the city: and he made himself a booth there, and he sat under it in the shadow, till he might see what would befall the city."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et praeparavit Dominus Deus hederam et ascendit super caput Ionae ut esset umbra super caput eius et protegeret eum laboraverat enim et laetatus est Iona super hedera laetitia magna"
      en: "And the Lord God prepared an ivy, and it came up over the head of Jonas, to be a shadow over his head, and to cover him (for he was fatigued): and Jonas was exceeding glad of the ivy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et paravit Deus vermem ascensu diluculo in crastinum et percussit hederam et exaruit"
      en: "But God prepared a worm, when the morning arose on the following day: and it struck the ivy and it withered."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et cum ortus fuisset sol praecepit Dominus vento calido et urenti et percussit sol super caput Ionae et aestuabat et petivit animae suae ut moreretur et dixit melius est mihi mori quam vivere"
      en: "And when the sun was risen, the Lord commanded a hot and burning wind: and the sun beat upon the head of Jonas, and he broiled with the heat: and he desired for his soul that he might die, and said: It is better for me to die than to live."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit Dominus ad Ionam putasne bene irasceris tu super hederam et dixit bene irascor ego usque ad mortem"
      en: "And the Lord said to Jonas: Dost thou think thou hast reason to be angry, for the ivy? And he said: I am angry with reason even unto death."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dixit Dominus tu doles super hederam in qua non laborasti neque fecisti ut cresceret quae sub una nocte nata est et una nocte periit"
      en: "And the Lord said: Thou art grieved for the ivy, for which thou hast not laboured, nor made it to grow, which in one night came up, and in one night perished."
    status: { la: verified, en: verified }
