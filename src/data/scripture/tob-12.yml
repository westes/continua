# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: tob
chapter: 12
verses:
  - n: 1
    text:
      la: "tunc vocavit ad se Tobias filium suum dixitque ei quid possumus dare viro isti sancto qui venit tecum"
      en: "Then Tobias called to him his son, and said to him: What can we give to this holy man, that is come with thee?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "respondens Tobias dixit pater quam mercedem dabimus ei aut quid dignum poterit esse beneficiis eius"
      en: "Tobias answering, said to his father: Father, what wages shall we give him? or what can be worthy of his benefits?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "me duxit et reduxit sanum pecuniam a Gabelo ipse suscepit uxorem ipse me habere fecit et daemonium ab ea conpescuit gaudium parentibus eius fecit me ipsum a devoratione piscis eripuit te quoque fecit videre lumen caeli et bonis omnibus per eum repleti sumus quid illi ad haec dignum poterimus dare"
      en: "He conducted me and brought me safe again, he received the money of Gabelus, he caused me to have my wife, and he chased from her the evil spirit, he gave joy to her parents, myself he delivered from being devoured by the fish, thee also he hath made to see the light of heaven, and we are filled with all good things through him. What can we give him sufficient for these things?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed peto te pater mi ut roges eum si forte dignabitur medietatem de omnibus quae adlata sunt sibi adsumere"
      en: "But I beseech thee, my father, to desire him, that he would vouchsafe to accept one half of all things that have been brought."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et vocantes eum pater scilicet et filius tulerunt eum in partem et rogare coeperunt ut dignaretur dimidiam partem omnium quae adtulerant acceptam habere"
      en: "So the father and the son, calling him, took him aside: and began to desire him that he would vouchsafe to accept of half of all things that they had brought."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tunc dixit eis occulte benedicite Deum caeli et coram omnibus viventibus confitemini illi quoniam fecit vobiscum misericordiam suam"
      en: "Then he said to them secretly: Bless ye the God of heaven, give glory to him in the sight of all that live, because he hath shewn his mercy to you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "etenim sacramentum regis abscondere bonum est opera autem Dei revelare et confiteri honorificum est"
      en: "For it is good to hide the secret of a king: but honourable to reveal and confess the works of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "bona est oratio cum ieiunio et elemosyna magis quam thesauros auri condere"
      en: "Prayer is good with fasting and alms more than to lay up treasures of gold:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quoniam elemosyna a morte liberat et ipsa est quae purgat peccata et faciet invenire vitam aeternam"
      en: "For alms delivereth from death, and the same is that which purgeth away sins, and maketh to find mercy and life everlasting."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui autem faciunt peccatum et iniquitatem hostes sunt animae suae"
      en: "But they that commit sin and iniquity, are enemies to their own soul."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "manifesto ergo vobis veritatem et non abscondam a vobis sermonem occultum"
      en: "I discover then the truth unto you, and I will not hide the secret from you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quando orabas cum lacrimis et sepeliebas mortuos et derelinquebas prandium et mortuos abscondebas per diem in domo tua et nocte sepeliebas ego obtuli orationem tuam Domino"
      en: "When thou didst pray with tears, and didst bury the dead, and didst leave thy dinner, and hide the dead by day in thy house, and bury them by night, I offered thy prayer to the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et quia acceptus eras Deo necesse fuit ut temptatio probaret te"
      en: "And because thou wast acceptable to God, it was necessary that temptation should prove thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et nunc misit me Dominus ut curarem te et Sarram uxorem filii tui a daemonio liberarem"
      en: "And now the Lord hath sent me to heal thee, and to deliver Sara thy son's wife from the devil."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ego enim sum Rafahel angelus unus ex septem qui adstamus ante Dominum"
      en: "For I am the angel Raphael, one of the seven, who stand before the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cumque haec audissent turbati sunt et trementes ceciderunt super faciem suam"
      en: "And when they had heard these things, they were troubled, and being seized with fear they fell upon the ground on their face."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixitque eis angelus pax vobis nolite timere"
      en: "And the angel said to them: Peace be to you, fear not."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "etenim cum essem vobiscum per voluntatem Dei ipsum benedicite et cantate illi"
      en: "For when I was with you, I was there by the will of God: bless ye him, and sing praises to him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "videbar quidem vobiscum manducare et bibere sed ego cibo invisibili et potu qui ab hominibus videri non potest utor"
      en: "I seemed indeed to eat and to drink with you: but I use an invisible meat and drink, which cannot be seen by men."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "tempus est ergo ut revertar ad eum qui me misit vos autem benedicite Deum et narrate omnia mirabilia eius"
      en: "It is time therefore that I return to him that sent me: but bless ye God, and publish all his wonderful works."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et cum haec dixisset ab aspectu eorum ablatus est et ultra eum videre non potuerunt"
      en: "And when he had said these things, he was taken from their sight, and they could see him no more."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "tunc prostrati per horas tres in faciem benedixerunt Deum et exsurgentes narraverunt omnia mirabilia eius"
      en: "Then they lying prostrate for three hours upon their face, blessed God: and rising up, they told all his wonderful works."
    status: { la: verified, en: verified }
