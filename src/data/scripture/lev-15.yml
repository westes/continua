# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 15
verses:
  - n: 1
    text:
      la: "locutusque est Dominus ad Mosen et Aaron dicens"
      en: "And the Lord spoke to Moses and Aaron, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "loquimini filiis Israhel et dicite eis vir qui patitur fluxum seminis inmundus erit"
      en: "Speak to the children of Israel, and say to them: The man that hath an issue of seed, shall be unclean."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et tunc iudicabitur huic vitio subiacere cum per momenta singula adheserit carni illius atque concreverit foedus humor"
      en: "And then shall he be judged subject to this evil, when a filthy humour, at every moment, cleaveth to his flesh, and gathereth there."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "omne stratum in quo dormierit inmundum erit et ubicumque sederit"
      en: "Every bed on which he sleepeth, shall be unclean, and every place on which he sitteth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si quis hominum tetigerit lectum eius lavabit vestimenta sua et ipse lotus aqua inmundus erit usque ad vesperum"
      en: "If ally man touch his bed, he shall wash his clothes: and being washed with water, he shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "si sederit ubi ille sederat et ipse lavabit vestimenta sua et lotus aqua inmundus erit usque ad vesperum"
      en: "If a man sit where that man hath sitten, he also shall wash his clothes: and being washed with water, shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui tetigerit carnem eius lavabit vestimenta sua et ipse lotus aqua inmundus erit usque ad vesperum"
      en: "He that toucheth his flesh, shall wash his clothes: and being himself washed with water shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "si salivam huiuscemodi homo iecerit super eum qui mundus est lavabit vestem suam et lotus aqua inmundus erit usque ad vesperum"
      en: "If such a man cast his spittle upon him that is clean, he shall wash his clothes: and being washed with water, he shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sagma super quo sederit inmundum erit"
      en: "The saddle on which he hath sitten shall be unclean."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et quicquid sub eo fuerit qui fluxum seminis patitur pollutum erit usque ad vesperum qui portaverit horum aliquid lavabit vestem suam et ipse lotus aqua inmundus erit usque ad vesperum"
      en: "And whatsoever has been under him that hath the issue of seed, shall be unclean until the evening. He that carrieth any of these things, shall wash his clothes: and being washed with water, he shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "omnis quem tetigerit qui talis est non lotis ante manibus lavabit vestimenta sua et lotus aqua inmundus erit usque ad vesperum"
      en: "Every person whom such a one shall touch, not having washed his hands before, shall wash his clothes: and being washed with water, shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vas fictile quod tetigerit confringetur vas autem ligneum lavabitur aqua"
      en: "If he touch a vessel of earth, it shall be broken: but if a vessel of wood, if shall be washed with water."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "si sanatus fuerit qui huiuscemodi sustinet passionem numerabit septem dies post emundationem sui et lotis vestibus ac toto corpore in aquis viventibus erit mundus"
      en: "If he who suffereth this disease be healed, he shall number seven days after his cleansing, and having washed his clothes, and all his body in living water, he shall be clean."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "die autem octavo sumet duos turtures aut duos pullos columbae et veniet in conspectu Domini ad ostium tabernaculi testimonii dabitque eos sacerdoti"
      en: "And on the eighth day he shall take two turtles, or two young pigeons, and he shall come before the Lord, to the door of the tabernacle of the testimony, and shall give them to the priest:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui faciet unum pro peccato et alterum in holocaustum rogabitque pro eo coram Domino ut emundetur a fluxu seminis sui"
      en: "Who shall offer one for sin, and the other for a holocaust: and he shall pray for him before the Lord, that he may be cleansed of the issue of his seed."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "vir de quo egreditur semen coitus lavabit aqua omne corpus suum et inmundus erit usque ad vesperum"
      en: "The man from whom the seed of copulation goeth out, shall wash all his body with water: and he shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "vestem et pellem quam habuerit lavabit aqua et inmunda erit usque ad vesperum"
      en: "The garment or skin that he weareth, he shall wash with water, and it shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "mulier cum qua coierit lavabitur aqua et inmunda erit usque ad vesperum"
      en: "The woman, with whom he copulateth, shall be washed with water, and shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "mulier quae redeunte mense patitur fluxum sanguinis septem diebus separabitur"
      en: "The woman, who at the return of the month, hath her issue of blood, shall be separated seven days."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "omnis qui tetigerit eam inmundus erit usque ad vesperum"
      en: "Every one that toucheth her, shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et in quo dormierit vel sederit diebus separationis suae polluetur"
      en: "21And every thing that she sleepeth on, or that she sitteth on in the days of her separation, shall be defiled."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui tetigerit lectum eius lavabit vestimenta sua et ipse lotus aqua inmundus erit usque ad vesperum"
      en: "He that toucheth her bed shall wash his clothes: and being himself washed with water, shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "omne vas super quo illa sederit quisquis adtigerit lavabit vestimenta sua et lotus aqua pollutus erit usque ad vesperum"
      en: "Whosoever shall touch any vessel on which she sitteth, shall wash his clothes: and himself being washed with water, shall be defiled until the evening."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "si coierit cum ea vir tempore sanguinis menstrualis inmundus erit septem diebus et omne stratum in quo dormierit polluetur"
      en: "If a man copulateth with her in the time of her flowers, he shall be unclean seven days: and every bed on which he shall sleep shall be defiled."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "mulier quae patitur multis diebus fluxum sanguinis non in tempore menstruali vel quae post menstruum sanguinem fluere non cessat quamdiu huic subiacet passioni inmunda erit quasi sit in tempore menstruo"
      en: "The woman that hath an issue of blood many days out of her ordinary time, or that ceaseth not to flow after the monthly courses, as long as she is subject to this disease, shall be unclean, in the same manner as if she were in her flowers."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "omne stratum in quo dormierit et vas in quo sederit pollutum erit"
      en: "Every bed on which she sleepeth, and every vessel on which she sitteth, shall be defiled."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quicumque tetigerit eam lavabit vestimenta sua et ipse lotus aqua inmundus erit usque ad vesperum"
      en: "Whosoever toucheth them shall wash his clothes: and himself being washed with water, shall be unclean until the evening."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "si steterit sanguis et fluere cessarit numerabit septem dies purificationis suae"
      en: "If the blood stop and cease to run, she shall count seven days of her purification:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et octavo die offeret pro se sacerdoti duos turtures vel duos pullos columbae ad ostium tabernaculi testimonii"
      en: "And on the eighth day she shall offer for herself to the priest, two turtles, or two young pigeons, at the door of the tabernacle of the testimony:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui unum faciet pro peccato et alterum in holocaustum rogabitque pro ea coram Domino et pro fluxu inmunditiae eius"
      en: "And he shall offer one for sin, and the other for a holocaust, and he shall pray for her before the Lord, and for the issue of her uncleanness."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "docebitis ergo filios Israhel ut caveant inmunditiam et non moriantur in sordibus suis cum polluerint tabernaculum meum quod est inter eos"
      en: "You shall teach therefore the children of Israel to take heed of uncleanness, that they may not die in their filth, when they shall have defiled my tabernacle that is among them."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ista est lex eius qui patitur fluxum seminis et qui polluitur coitu"
      en: "This is the law of him that hath the issue of seed, and that is defiled by copulation."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et quae menstruis temporibus separatur vel quae iugi fluit sanguine et hominis qui dormierit cum ea"
      en: "And of the woman that is separated in her monthly times, or that hath a continual issue of blood, and of the man that sleepeth with her."
    status: { la: verified, en: verified }
