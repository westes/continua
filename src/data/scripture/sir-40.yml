# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 40
verses:
  - n: 1
    text:
      la: "Occupatio magna creata est omnibus hominibus, et jugum grave super filios Adam, a die exitus de ventre matris eorum usque in diem sepulturae in matrem omnium."
      en: "Great labour is created for all men, and a heavy yoke is upon the children of Adam, from the day of their coming out of their mother's womb, until the day of their burial into the mother of all."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cogitationes eorum, et timores cordis, adinventio exspectationis, et dies finitionis,"
      en: "Their thoughts, and fears of the heart, their imagination of things to come, and the day of their end:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "a residente super sedem gloriosam, usque ad humiliatum in terra et cinere:"
      en: "From him that sitteth on a glorious throne, unto him that is humbled in earth and ashes:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ab eo qui utitur hyacintho et portat coronam, usque ad eum qui operitur lino crudo: furor, zelus, tumultus, fluctuatio, et timor mortis, iracundia perseverans, et contentio:"
      en: "From him that weareth purple, and beareth the crown, even to him that is covered with rough linen: wrath, envy, trouble, unquietness, and the fear of death, continual anger, and strife,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et in tempore refectionis in cubili, somnus noctis immutat scientiam ejus."
      en: "And in the time of rest upon his bed, the sleep of the night changeth his knowledge."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Modicum tamquam nihil in requie, et ab eo in somnis, quasi in die respectus."
      en: "A little and as nothing is his rest, and afterward in sleep, as in the day of keeping watch."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Conturbatus est in visu cordis sui, tamquam qui evaserit in die belli: in tempore salutis suae exsurrexit, et admirans ad nullum timorem:"
      en: "He is troubled in the vision of his heart, as if he had escaped in the day of battle. In the time of his safety he rose up, and wondereth that there is no fear:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cum omni carne, ab homine usque ad pecus, et super peccatores septuplum."
      en: "Such things happen to all flesh, from man even to beast, and upon sinners are sevenfold more."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ad haec mors, sanguis, contentio, et rhomphaea, oppressiones, fames, et contritio, et flagella:"
      en: "Moreover, death, and bloodshed, strife, and sword, oppressions, famine, and affliction, and scourges:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "super iniquos creata sunt haec omnia: et propter illos factus est cataclysmus."
      en: "All these things are created for the wicked, and for their sakes came the flood."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Omnia quae de terra sunt in terram convertentur, et omnes aquae in mare revertentur."
      en: "All things that are of the earth, shall return to the earth again, and all waters shall return to the sea."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Omne munus et iniquitas delebitur, et fides in saeculum stabit."
      en: "All bribery, and injustice shall blotted out, and fidelity shall stand for ever."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Substantiae injustorum sicut fluvius siccabuntur, et sicut tonitruum magnum in pluvia personabunt."
      en: "The riches of the unjust shall be dried up like a river, and shall pass away with a noise like a great thunder in rain."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "In aperiendo manus suas laetabitur: sic praevaricatores in consummatione tabescent."
      en: "While he openeth his hands he shall rejoice: but transgressors shall pine away in the end."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Nepotes impiorum non multiplicabunt ramos: et radices immundae super cacumen petrae sonant."
      en: "The offspring of the ungodly shall not bring forth many branches, and make a noise as unclean roots upon the top of a rock."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Super omnem aquam viriditas, et ad oram fluminis ante omne foenum evelletur."
      en: "The weed growing over every water, and at the bank of the river, shall be pulled up before all grass."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Gratia sicut paradisus in benedictionibus, et misericordia in saeculum permanet."
      en: "Grace is like a paradise in blessings, and mercy remaineth for ever."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vita sibi sufficientis operarii condulcabitur, et in ea invenies thesaurum."
      en: "The life of a labourer that is content with what he hath, shall be sweet, and in it thou shalt find a treasure."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Filii et aedificatio civitatis confirmabit nomen: et super haec mulier immaculata computabitur."
      en: "Children, and the building of a city shall establish a name, but a blameless wife shall be counted above them both."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vinum et musica laetificant cor: et super utraque dilectio sapientiae."
      en: "Wine and music rejoice the heart, but the love of wisdom is above them both."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Tibiae et psalterium suavem faciunt melodiam: et super utraque lingua suavis."
      en: "The flute and the psaltery make a sweet melody, but a pleasant tongue is above them both."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Gratiam et speciem desiderabit oculus tuus: et super haec virides sationes."
      en: "Thy eye desireth favour and beauty, but more than these green sown fields."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Amicus et sodalis in tempore convenientes, et super utrosque mulier cum viro."
      en: "A friend and companion meeting together in season, but above them both is a wife with her husband."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Fratres in adjutorium in tempore tribulationis: et super eos misericordia liberabit."
      en: "Brethren are a help in the time of trouble, but mercy shall deliver more than they."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Aurum et argentum est constitutio pedum: et super utrumque consilium beneplacitum."
      en: "Gold and silver make the feet stand sure: but wise counsel is above them both."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Facultates et virtutes exaltant cor, et super haec timor Domini."
      en: "Riches and strength lift up the heart: but above these is the fear of the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Non est in timore Domini minoratio: et non est in eo inquirere adjutorium."
      en: "There is no want in the fear of the Lord, and it needeth not to seek for help."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Timor Domini sicut paradisus benedictionis, et super omnem gloriam operuerunt illum."
      en: "The fear of the Lord is like a paradise of blessing, and they have covered it above all glory."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Fili, in tempore vitae tuae ne indigeas: melius est enim mori quam indigere."
      en: "My son, in thy lifetime be not indigent: for it is better to die than to want."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Vir respiciens in mensam alienam, non est vita ejus in cogitatione victus: alit enim animam suam cibis alienis:"
      en: "The life of him that looketh toward another man's table is not to be counted a life: for he feedeth his soul with another man's meat."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "vir autem disciplinatus et eruditus custodiet se."
      en: "But a man, well instructed and taught, will look to himself."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "In ore imprudentis condulcabitur inopia, et in ventre ejus ignis ardebit."
      en: "Begging will be sweet in the mouth of the unwise, but in his belly there shall burn a fire."
    status: { la: verified, en: verified }
