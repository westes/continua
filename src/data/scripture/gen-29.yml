# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 29
verses:
  - n: 1
    text:
      la: "profectus ergo Iacob venit ad terram orientalem"
      en: "Then Jacob went on in his journey, and came into the east country."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et vidit puteum in agro tresque greges ovium accubantes iuxta eum nam ex illo adaquabantur pecora et os eius grandi lapide claudebatur"
      en: "And he saw a well in the field, and three flocks of sheep lying by it: for the beasts were watered out of it, and the mouth thereof was closed with a great stone."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "morisque erat ut cunctis ovibus congregatis devolverent lapidem et refectis gregibus rursum super os putei ponerent"
      en: "And the custom was, when all the sheep were gathered together to roll away the stone, and after the sheep were watered, to put it on the mouth of the well again."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixitque ad pastores fratres unde estis qui responderunt de Haran"
      en: "And he said to the shepherds: Brethren, whence are you? They answered: Of Haran."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quos interrogans numquid ait nostis Laban filium Nahor dixerunt novimus"
      en: "And he asked them, saying: Know you Laban the son of Nachor? They said: We know him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sanusne est inquit valet inquiunt et ecce Rahel filia eius venit cum grege suo"
      en: "He said: Is he in health? He is in health, say they: and behold Rachel his daughter cometh with his flock."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixitque Iacob adhuc multum diei superest nec est tempus ut reducantur ad caulas greges date ante potum ovibus et sic ad pastum eas reducite"
      en: "And Jacob said: There is yet much day remaining, neither is it time to bring the flocks into the folds again: first give the sheep drink, and so lead them back to feed."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui responderunt non possumus donec omnia pecora congregentur et amoveamus lapidem de ore putei ut adaquemus greges"
      en: "They answered: We cannot, till all the cattle be gathered together, and we remove the stone from the well's mouth, that we may water the flocks."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "adhuc loquebantur et ecce Rahel veniebat cum ovibus patris sui nam gregem ipsa pascebat"
      en: "They were yet speaking, and behold Rachel came with her father's sheep: for she fed the flock."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quam cum vidisset Iacob et sciret consobrinam suam ovesque Laban avunculi sui amovit lapidem quo puteus claudebatur"
      en: "And when Jacob saw her, and knew her to be his cousin-german, and that they were the sheep of Laban, his uncle: he removed the stone wherewith the well was closed."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et adaquato grege osculatus est eam elevataque voce flevit"
      en: "And having watered the flock, he kissed her: and lifting up his voice, wept."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et indicavit ei quod frater esset patris eius et filius Rebeccae at illa festinans nuntiavit patri suo"
      en: "And he told her that he was her father's brother, and the son of Rebecca: but she went in haste and told her father."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui cum audisset venisse Iacob filium sororis suae cucurrit obviam conplexusque eum et in oscula ruens duxit in domum suam auditis autem causis itineris"
      en: "Who, when he heard that Jacob his sister's son was come, ran forth to meet him; and embracing him, and heartily kissing him, brought him into his house. And when he had heard the causes of his journey,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "respondit os meum es et caro mea et postquam expleti sunt dies mensis unius"
      en: "He answered: Thou art my bone and my flesh. And after the days of one month were expired,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixit ei num quia frater meus es gratis servies mihi dic quid mercedis accipias"
      en: "He said to him: Because thou art my brother, shalt thou serve me without wages? Tell me what wages thou wilt have."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "habebat vero filias duas nomen maioris Lia minor appellabatur Rahel"
      en: "Now he had two daughters, the name of the elder was Lia: and the younger was called Richel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed Lia lippis erat oculis Rahel decora facie et venusto aspectu"
      en: "But Lia was blear eyed: Rachel was well favoured, and of a beautiful countenance."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quam diligens Iacob ait serviam tibi pro Rahel filia tua minore septem annis"
      en: "And Jacob being in love with her, said: I will serve thee seven years for Rachel thy younger daughter."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "respondit Laban melius est ut tibi eam dem quam viro alteri mane apud me"
      en: "Lahan answered: It is better that I give her thee than to another man; stay with me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "servivit igitur Iacob pro Rahel septem annis et videbantur illi pauci dies prae amoris magnitudine"
      en: "So Jacob served seven years for Rachel: and they seemed but a few days, because of the greatness of his love."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixitque ad Laban da mihi uxorem meam quia iam tempus expletum est ut ingrediar ad eam"
      en: "And he said to Laban: Give me my wife; for now the time is fulfilled, that I may go in unto her."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui vocatis multis amicorum turbis ad convivium fecit nuptias"
      en: "And he, having invited a great number of his friends to the feast, made the marriage."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et vespere filiam suam Liam introduxit ad eum"
      en: "And at night he brought in Lia his daughter to him,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dans ancillam filiae Zelpham nomine ad quam cum ex more Iacob fuisset ingressus facto mane vidit Liam"
      en: "Giving his daughter a handmaid, named Zalpha. Now when Jacob had gone in to her according to custom when morning was come he saw it was Lia:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et dixit ad socerum quid est quod facere voluisti nonne pro Rahel servivi tibi quare inposuisti mihi"
      en: "And he said to his father in law: What is it that thou didst mean to do? did not I serve thee for Rachel? why hast thou deceived me?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "respondit Laban non est in loco nostro consuetudinis ut minores ante tradamus ad nuptias"
      en: "Laban answered: It is not the custom in this place, to give the younger in marriage first."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "imple ebdomadem dierum huius copulae et hanc quoque dabo tibi pro opere quo serviturus es mihi septem annis aliis"
      en: "Make up the week of days of this match: and I will give thee her also, for the service that thou shalt render me other seven years."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "adquievit placito et ebdomade transacta Rahel duxit uxorem"
      en: "He yielded to his pleasure: and after the week was past, he married Rachel:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "cui pater servam Balam dederat"
      en: "To whom her father gave Bala for her servant."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "tandemque potitus optatis nuptiis amorem sequentis priori praetulit serviens apud eum septem annis aliis"
      en: "And having at length obtained the marriage he wished for, he preferred the love of the latter before the former, and served with him other seven years."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "videns autem Dominus quod despiceret Liam aperuit vulvam eius sorore sterili permanente"
      en: "And the Lord seeing that he despised Lia, opened her womb, but her sister remained barren."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quae conceptum genuit filium vocavitque nomen eius Ruben dicens vidit Dominus humilitatem meam nunc amabit me vir meus"
      en: "And she conceived and bore a son, and called his name Ruben, saying: The Lord saw my affliction: now my husband will love me."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "rursumque concepit et peperit filium et ait quoniam audivit Dominus haberi me contemptui dedit etiam istum mihi vocavitque nomen illius Symeon"
      en: "And again she conceived and bore a son, and said: Because the Lord heard that I was despised, he hath given this also to me: and she called his name Simeon."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "concepit tertio et genuit alium dixitque nunc quoque copulabitur mihi maritus meus eo quod pepererim illi tres filios et idcirco appellavit nomen eius Levi"
      en: "And she conceived the third time, and bore another son: and said: Now also my husband will be joined to me, because I have borne him three sons: and therefore she called hi sname Levi."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "quarto concepit et peperit filium et ait modo confitebor Domino et ob hoc vocavit eum Iudam cessavitque parere"
      en: "The fourth time she conceived and bore a son, and said: now will I praise the Lord: and for this she called him Juda. And she left bearing."
    status: { la: verified, en: verified }
