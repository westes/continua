# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 6
verses:
  - n: 1
    text:
      la: "Noli fieri pro amico inimicus proximo: improperium enim et contumeliam malus haereditabit: et omnis peccator invidus et bilinguis."
      en: "Instead of a friend become not an enemy to thy neighbour: for an evil man shall inherit reproach and shame, so shall every sinner that is envious and double tongued."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Non te extollas in cogitatione animae tuae velut taurus, ne forte elidatur virtus tua per stultitiam:"
      en: "Extol not thyself in the thoughts of thy soul like a bull: lest thy strength be quashed by folly,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et folia tua comedat, et fructus tuos perdat, et relinquaris velut lignum aridum in eremo."
      en: "And it eat up thy leaves, and destroy thy fruit: and thou be left as a dry tree in the wilderness."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Anima enim nequam disperdet qui se habet, et in gaudium inimicis dat illum, et deducet in sortem impiorum."
      en: "For a wicked soul shall destroy him that hath it, and maketh him to be a joy to his enemies, and shall lead him into the lot of the wicked."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Verbum dulce multiplicat amicos et mitigat inimicos, et lingua eucharis in bono homine abundat."
      en: "A sweet word multiplieth friends, and appeaseth enemies, and a gracious tongue in a good man aboundeth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Multi pacifici sint tibi: et consiliarius sit tibi unus de mille."
      en: "Be in peace with many, but let one of a thousand be thy counsellor."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Si possides amicum, in tentatione posside eum, et ne facile credas ei."
      en: "If thou wouldst get a friend, try him before thou takest him, and do not credit him easily."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Est enim amicus secundum tempus suum, et non permanebit in die tribulationis."
      en: "For there is a friend for his own occasion, and he will not abide in the day of thy trouble."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et est amicus qui convertitur ad inimicitiam, et est amicus qui odium et rixam et convitia denudabit."
      en: "And there is a friend that turneth to enmity; and there is a friend that will disclose hatred and strife and reproaches."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Est autem amicus socius mensae, et non permanebit in die necessitatis."
      en: "And there is a friend a companion at the table, and he will not abide in the day of distress."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Amicus si permanserit fixus, erit tibi quasi coaequalis, et in domesticis tuis fiducialiter aget."
      en: "A friend if he continue steadfast, shall be to thee as thyself, and shall act with confidence among them of thy household."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Si humiliaverit se contra te, et a facie tua absconderit se, unanimem habebis amicitiam bonam."
      en: "If he humble himself before thee, and hide himself from thy face, thou shalt have unanimous friendship for good."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ab inimicis tuis separare, et ab amicis tuis attende."
      en: "Separate thyself from thy enemies, and take heed of thy friends."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Amicus fidelis protectio fortis: qui autem invenit illum, invenit thesaurum."
      en: "A faithful friend is a strong defence: and he that hath found him, hath found a treasure."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Amico fideli nulla est comparatio, et non est digna ponderatio auri et argenti contra bonitatem fidei illius."
      en: "Nothing can be compared to a faithful friend, and no weight of gold and silver is able to countervail the goodness of his fidelity."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Amicus fidelis medicamentum vitae et immortalitatis: et qui metuunt Dominum, invenient illum."
      en: "A faithful friend is the medicine of life and immortality: and they that fear the Lord, shall find him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Qui timet Deum aeque habebit amicitiam bonam, quoniam secundum illum erit amicus illius."
      en: "He that feareth God, shall likewise have good friendship: because according to him shall his friend be."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Fili, a juventute tua excipe doctrinam, et usque ad canos invenies sapientiam."
      en: "My son, from thy youth up receive instruction, and even to thy grey hairs thou shalt find wisdom."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quasi is qui arat et seminat accede ad eam, et sustine bonos fructus illius."
      en: "Come to her as one that plougheth, and soweth, and wait for her good fruits:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In opere enim ipsius exiguum laborabis, et cito edes de generationibus illius."
      en: "For in working about her thou shalt labour a little, and shalt quickly eat of her fruits."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quam aspera est nimium sapientia indoctis hominibus! et non permanebit in illa excors."
      en: "How very unpleasant is wisdom to the unlearned, and the unwise will not continue with her."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quasi lapidis virtus probatio erit in illis: et non demorabuntur projicere illam."
      en: "She shall be to them as a mighty stone of trial, and they will cast her from them before it be long."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Sapientia enim doctrinae secundum nomen est ejus, et non est multis manifestata: quibus autem cognita est, permanet usque ad conspectum Dei."
      en: "For the wisdom of doctrine is according to her name, and she is not manifest unto many, but with them to whom she is known, she continueth even to the sight of God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Audi, fili, et accipe consilium intellectus, et ne abjicias consilium meum."
      en: "Give ear, my son, and take wise counsel, and cast not away my advice."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Injice pedem tuum in compedes illius, et in torques illius collum tuum."
      en: "Put thy feet into her fetters, and thy neck into her chains:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Subjice humerum tuum, et porta illam, et ne acedieris vinculis ejus."
      en: "Bow down thy shoulder, and bear her, and be not grieved with her bands."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "In omni animo tuo accede ad illam, et in omni virtute tua conserva vias ejus."
      en: "Come to her with all thy mind, and keep her ways with all thy power."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Investiga illam, et manifestabitur tibi: et continens factus, ne derelinquas eam:"
      en: "Search for her, and she shall be made known to thee, and when thou hast gotten her, let her not go:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "in novissimis enim invenies requiem in ea, et convertetur tibi in oblectationem."
      en: "For in the latter end thou shalt find rest in her, and she shall be turned to thy joy."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et erunt tibi compedes ejus in protectionem fortitudinis et bases virtutis, et torques illius in stolam gloriae:"
      en: "Then shall her fetters be a strong defence for thee, and a firm foundation, and her chain a robe of glory:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "decor enim vitae est in illa, et vincula illius alligatura salutaris."
      en: "For in her is the beauty of life, and her bands are a healthful binding."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Stolam gloriae indues eam, et coronam gratulationis superpones tibi."
      en: "Thou shalt put her on as a robe of glory, and thou shalt set her upon thee as a crown of joy."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Fili, si attenderis mihi, disces: et si accomodaveris animum tuum, sapiens eris."
      en: "My son, if thou wilt attend to me, thou shalt learn: and if thou wilt apply thy mind, thou shalt be wise."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Si inclinaveris aurem tuam, excipies doctrinam: et si dilexeris audire, sapiens eris."
      en: "If thou wilt incline thy ear, thou shalt receive instruction: and if thou love to hear, thou shalt be wise."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "In multitudine presbyterorum prudentium sta, et sapientiae illorum ex corde conjungere, ut omnem narrationem Dei possis audire, et proverbia laudis non effugiant a te."
      en: "Stand in the multitude of ancients that are wise, and join thyself from thy heart to their wisdom, that thou mayst hear every discourse of God, and the sayings of praise may not escape thee."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et si videris sensatum, evigila ad eum, et gradus ostiorum illius exterat pes tuus."
      en: "And if thou see a man of understanding, go to him early in the morning, and let thy foot wear the steps of his doors."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Cogitatum tuum habe in praeceptis Dei, et in mandatis illius maxime assiduus esto: et ipse dabit tibi cor, et concupiscentia sapientiae dabitur tibi."
      en: "Let thy thoughts be upon the precepts of God, and meditate continually on his commandments: and he will give thee a heart, and the desire of wisdom shall be given to thee."
    status: { la: verified, en: verified }
