# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2mach
chapter: 10
verses:
  - n: 1
    text:
      la: "Macchabeus autem et qui cum illo erant Domino se protegente templum quidem et civitatem recepit"
      en: "But Machabeus, and they that were with him, by the protection of the Lord, recovered the temple and the city again."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "aras autem quas alienigenae per plateas extruxerant itemque delubra demolitus est"
      en: "But he threw down the altars, which the heathens had set up in the streets, as also the temples of the idols."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et purgato templo aliud altare fecerunt et de ignitis lapidibus igne concepto obtulerunt sacrificia post biennium et incensum et lucernas et panes propositionis posuerunt"
      en: "And having purified the temple, they made another altar: and taking fire out of the fiery stones, they offered sacrifices after two years, and set forth incense, and lamps, and the leaves of proposition."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quibus gestis rogabant Dominum prostrati in terram ne amplius malis talibus inciderent sed et si quando peccassent ut ab ipso mitius corriperentur et non blasphemis ac barbaris hominibus traderentur"
      en: "And when they had done these things, they besought the Lord, lying prostrate on the ground, that they might no more fall into such evils; but if they should at any time sin, that they might be chastised by him more gently, and not be delivered up to barbarians and blasphemous men."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qua die autem templum ab alienigenis pollutum fuerat contigit eadem die purgationem fieri vicesima et quinta mensis qui fuit casleu"
      en: "Now upon the same day that the temple had been polluted by the strangers, on the very same day it was cleansed again, to wit, on the five and twentieth day of the month of Casleu."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et cum laetitia diebus octo egerunt in modum tabernaculorum recordantes quod ante modicum temporis diem sollemnem tabernaculorum in montibus more bestiarum egerant"
      en: "And they kept eight days with joy, after the manner of the feast of the tabernacles, remembering that not long before they had kept the feast of the tabernacles when they were in the mountains, and in dens like wild beasts."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "propter quod tyrsos et ramos virides et palmas praeferebant ei qui prosperavit mundari locum suum"
      en: "Therefore they now, carried boughs, and green branches, and palms for Him that had given them good success in cleansing his place."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et decreverunt communi praecepto et decreto universae genti Iudaeorum omnibus annis agere dies istos"
      en: "And they ordained by a common statute, and decree, that all the nation of the Jews should keep those days every year."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et Antiochi quidem qui appellatus est Nobilis vitae excessus ita se habuit"
      en: "And this was the end of Antiochus that was called the Illustrious."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "nunc autem de Eupatore Antiochi filio impii quae gesta sunt narrabimus breviantes mala quae in bellis gesta sunt"
      en: "But now we will relate the acts of Eupator the son of that wicked Antiochus, abridging the account of the evils that happened in the wars."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "hic suscepto regno constituit super negotia regni Lysiam quendam Foenicis et Syriae militiae principem"
      en: "For when he was come to the crown. he appointed over the affairs of his realm one Lysias, general of the army of Phenicia and Syria."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nam Ptolomeus qui dicebatur Macer iusti tenax erga Iudaeos esse instituit et praecipue propter iniquitatem quae facta erat in eos et pacifice agere cum eis"
      en: "For Ptolemee that was called Macer, was determined to be strictly just to the Jews, and especially by reason of the wrong that had been done them, and to deal peaceably with them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed ob hoc accusatus ab amicis apud Eupatorem cum frequenter proditor audiret eo quod Cyprum creditus a Filometore Nobilem translatus etiam ab eo recessisset veneno vitam finivit"
      en: "But being accused for this to Eupator by his friends, and being oftentimes called traitor, because he had left Cyprus which Philometor had committed to him, and coming over to Antiochus the Illustrious, had revolted also from him, he put an end to his life by poison."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Gorgias autem cum esset dux locorum adsumptis advenis frequenter Iudaeos debellabat"
      en: "But Gorgias, who was governor of the holds, taking with him the strangers, often fought against the Jews."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Iudaei vero qui tenebant oportunas munitiones fugatos ab Hierosolymis suscipiebant et bellare temptabant"
      en: "And the Jews that occupied the most commodious hold, received those that were driven out of Jerusalem, and at- tempted to make war."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hii vero qui erant cum Macchabeo per orationes Dominum rogantes ut esset sibi adiutor impetum fecerunt in munitiones Idumeorum"
      en: "Then they that were with Machabeus, beseeching the Lord by prayers to be their helper, made a strong attack upon the strong holds of the Idumeans:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "multaque vi insistentes loca obtinuerunt occurrentes interemerunt et omnes simul non minus a viginti milibus trucidaverunt"
      en: "And assaulting them with great force, won the holds, killed them that came in the way, and slew altogether no fewer than twenty thousand."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quidam autem cum confugissent in duas turres valde munitas omnem adparatum ad repugnandum habentes"
      en: "And whereas some were fled into very strong towers, having all manner of provision to sustain a siege,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Macchabeus ad eorum expugnationem relicto Simone et Ioseppho item Macchabeo eisque qui cum ipsis erant satis multis ipse ad eas quae amplius perurguebant pugnas conversus est"
      en: "Machabeus left Simon and Joseph, and Zacheus, and them that were with them in sufficient number to besiege them, and departed to those expeditions which urged more."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "hii vero qui cum Simone erant cupiditate ducti a quibusdam qui in turribus erant suasi sunt pecunia et septuaginta milibus didragmis acceptis dimiserunt quosdam effugere"
      en: "Now they that were with Simon, being led with covetousness, were persuaded For the sake of money by some that were in the towers: and taking seventy thousand didrachmas, let some of them escape."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "cum autem Macchabeo nuntiatum esset quod factum est congregatis principibus populi accusavit quod pecunia fratres vendidissent adversariis eorum dimissis"
      en: "But when it was told Machabeus what was done, he assembled the rulers of the people, and accused those men that they had sold their brethren for money, having let their adversaries escape."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "hos igitur proditores factos interfecit et confestim duas turres occupavit"
      en: "So he put these traitors to death, and forthwith took the two towers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "armis autem ac manibus omnia prospere agendo in duabus munitionibus plus quam viginti milia peremit"
      en: "And having good success in arms and in all things he took in hand, he slew more than twenty thousand in the two holds."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Timotheus qui prius a Iudaeis fuerat superatus convocato exercitu peregrinae multitudinis et congregato exercitu asiano advenit quasi armis Iudaeam capturus"
      en: "But Timotheus who before had been overcome by the Jews, having called together a multitude of foreign troops, and assembled horsemen out of Asia, came as though he would take Judea by force of arms."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Macchabeus autem et qui cum ipso erant adpropiante illo deprecabantur Deum caput terra aspergentes lumbosque ciliciis praecincti"
      en: "But Machabeus and they that were with him, when he drew near, prayed to the Lord, sprinkling earth upon their heads and girding their loins with hair- cloth,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ad altaris crepidinem provoluti ut sibi propitius inimicis autem eorum esset inimicus et adversaretur sicut lex dicit"
      en: "And lying prostrate at the foot of the altar, besought him to be merciful to them, and to be an enemy to their enemies, and an adversary to their adversaries, as the law saith."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et ita post orationem sumptis armis longius de civitate procedentes et proximi hostibus effecti resederunt"
      en: "And so after prayer taking their arms, they went forth further from the city, and when they were come very near the enemies they rested."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "primo autem solis ortu utrique commiserunt isti quidem victoriae et prosperitatis sponsorem cum virtute Dominum habentes illi autem ducem belli animum habebant"
      en: "But as soon as the sun was risen both sides joined battle: the one part having with their valour the Lord for a surety o victory and success: but the other side making their rage their leader in battle."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sed cum vehemens pugna esset apparuerunt adversariis de caelo viri quinque in equis frenis aureis decori ducatum Iudaeis praestantes"
      en: "But when they were in the heat of the engagement there appeared to the enemies from heaven five men upon horses, comely with golden bridles, con- ducting the Jews:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ex quibus duo Macchabeum medium habentes armis suis circumseptum incolomem conservabant in adversarios autem tela et fulmina iaciebant ex quo et caecitate confusi et repleti perturbatione cadebant"
      en: "Two of whom took Machabeus between them, and covered him on every side with their arms, and kept him safe: but cast darts and fireballs against the enemy, so that they fell down, being both confounded with blindness, and filled with trouble."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "interfecti sunt autem viginti milia quingenti et equites sescenti"
      en: "And there were slain twenty thousand five hundred, and six hundred horsemen."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Timotheus autem confugit in Gazara praesidium munitum cui praeerat Caereas"
      en: "But Timotheus fled into Gazara a strong hold, where Chereas was governor."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Macchabeus autem et qui cum eo erant laetantes obsederunt praesidium diebus quattuor"
      en: "Then Machabeus, and they that were with him, cheerfully laid siege to the fortress four days."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "at hii qui in turres erant loci firmitate confisi super modum maledicebant et sermones nefandos iactabant"
      en: "But they that were within, trusting to the strength of the place, blasphemed exceedingly, and cast forth abominable words."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "sed cum dies quinta inlucesceret viginti iuvenes ex his qui cum Macchabeo erant accensi animis propter blasphemiam viriliter accesserunt ad murum et feroci animo incedentes ascendebant"
      en: "But when the fifth day appeared, twenty young men of them that were with Machabeus, inflamed in their minds because of the blasphemy, approached manfully to the wall, and pushing forward with fierce courage got up upon it."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "sed et alii similiter ascendentes turres portasque succendere adgressi atque ipsos maledicos vivos concremare"
      en: "Moreover others also getting up after them, went to set Are to the towers and the gates, and to burn the blasphemers alive."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "per continuum autem biduum praesidio vastato Timotheum occultantem se in quodam reppertum loco peremerunt et fratrem illius Caerean et Apollofanem occiderunt"
      en: "And having for two days together pillaged and sacked the fortress, they killed Timotheus, who was found hid in a certain place: they slew also his brother Chereas, and Apollophanes."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "quibus gestis in hymnis et confessionibus benedicebant Dominum qui magna fecit cum Israhel et victoriam illi dedit"
      en: "And when this was done, they blessed the Lord with hymns and thanksgiving, who had done great things in Israel, and given them the victory."
    status: { la: verified, en: verified }
