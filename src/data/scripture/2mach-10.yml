# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2mach
chapter: 10
verses:
  - n: 1
    text:
      la: "Machabaeus autem, et qui cum eo erant, Domino se protegente, templum quidem, et civitatem recepit:"
      en: "But Machabeus, and they that were with him, by the protection of the Lord, recovered the temple and the city again."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "aras autem, quas alienigenae per plateas exstruxerant, itemque delubra demolitus est:"
      en: "But he threw down the altars, which the heathens had set up in the streets, as also the temples of the idols."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et purgato templo, aliud altare fecerunt, et de ignitis lapidibus igne concepto sacrificia obtulerunt post biennium, et incensum, et lucernas, et panes propositionis posuerunt."
      en: "And having purified the temple, they made another altar: and taking fire out of the fiery stones, they offered sacrifices after two years, and set forth incense, and lamps, and the loaves of proposition."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quibus gestis, rogabant Dominum prostrati in terram, ne amplius talibus malis inciderent: sed et, siquando peccassent, ut ab ipso mitius corriperentur, et non barbaris ac blasphemis hominibus traderentur."
      en: "And when they had done these things, they besought the Lord, lying prostrate on the ground, that they might no more fall into such evils; but if they should at any time sin, that they might be chastised by him more gently, and not be delivered up to barbarians and blasphemous men."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qua die autem templum ab alienigenis pollutum fuerat, contigit eadem die purificationem fieri, vigesima quinta mensis qui fuit Casleu."
      en: "Now upon the same day that the temple had been polluted by the strangers, on the very same day it was cleansed again, to wit, on the five and twentieth day of the month of Casleu."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et cum laetitia diebus octo egerunt in modum tabernaculorum, recordantes quod ante modicum temporis diem solemnem tabernaculorum in montibus, et in speluncis more bestiarum egerant."
      en: "And they kept eight days with joy, after the manner of the feast of the tabernacles, remembering that not long before they had kept the feast of the tabernacles when they were in the mountains, and in dens like wild beasts."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Propter quod thyrsos, et ramos virides, et palmas praeferebant ei, qui prosperavit mundari locum suum."
      en: "Therefore they now, carried boughs, and green branches, and palms for Him that had given them good success in cleansing his place."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et decreverunt communi praecepto, et decreto universae genti Judaeorum omnibus annis agere dies istos."
      en: "And they ordained by a common statute, and decree, that all the nation of the Jews should keep those days every year."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et Antiochi quidem, qui appellatus est Nobilis, vitae excessus ita se habuit."
      en: "And this was the end of Antiochus that was called the Illustrious."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nunc autem de Eupatore Antiochi impii filio, quae gesta sunt narrabimus, breviantes mala, quae in bellis gesta sunt."
      en: "But now we will relate the acts of Eupator the son of that wicked Antiochus, abridging the account of the evils that happened in the wars."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Hic enim suscepto regno, constituit super negotia regni Lysiam quemdam, Phoenicis et Syriae militiae principem."
      en: "For when he was come to the crown, he appointed over the affairs of his realm one Lysias, general of the army of Phenicia and Syria."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nam Ptolemaeus, qui dicebatur Macer, justi tenax, erga Judaeos esse constituit, et praecipue propter iniquitatem, quae facta erat in eos, et pacifice agere cum eis."
      en: "For Ptolemee that was called Macer, was determined to be strictly just to the Jews, and especially by reason of the wrong that had been done them, and to deal peaceably with them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sed ob hoc accusatus ab amicis apud Eupatorem, cum frequenter proditor audiret, eo quod Cyprum creditam sibi a Philometore deseruisset, et ad Antiochum Nobilem translatus etiam ab eo recessisset, veneno vitam finivit."
      en: "But being accused for this to Eupator by his friends, and being oftentimes called traitor, because he had left Cyprus which Philometor had committed to him, and coming over to Antiochus the Illustrious, had revolted also from him, he put an end to his life by poison."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Gorgias autem, cum esset dux locorum, assumptis advenis, frequenter Judaeos debellabat."
      en: "But Gorgias, who was governor of the holds, taking with him the strangers, often fought against the Jews."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Judaei vero, qui tenebant opportunas munitiones, fugatos ab Jerosolymis suscipiebant, et bellare tentabant."
      en: "And the Jews that occupied the most commodious hold, received those that were driven out of Jerusalem, and attempted to make war."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Hi vero, qui erant cum Machabaeo, per orationes Dominum rogantes ut esset sibi adjutor, impetum fecerunt in munitiones Idumaeorum:"
      en: "Then they that were with Machabeus, beseeching the Lord by prayers to be their helper, made a strong attack upon the strong holds of the Idumeans:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "multaque vi insistentes, loca obtinuerunt, occurrentes interemerunt, et omnes simul non minus viginti millibus trucidaverunt."
      en: "And assaulting them with great force, won the holds, killed them that came in the way, and slew altogether no fewer than twenty thousand."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quidam autem, cum confugissent in duas turres valde munitas omnem apparatum ad repugnandum habentes."
      en: "And whereas some were fled into very strong towers, having all manner of provision to sustain a siege,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Machabaeus ad eorum expugnationem, relicto Simone, et Josepho, itemque Zachaeo: eisque qui cum ipsis erant satis multis, ipse ad eas, quae amplius perurgebant, pugnas conversus est."
      en: "Machabeus left Simon and Joseph, and Zacheus, and them that were with them in sufficient number to besiege them, and departed to those expeditions which urged more."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Hi vero, qui cum Simone erant, cupiditate ducti, a quibusdam, qui in turribus erant, suasi sunt pecunia: et septuaginta millibus didrachmis acceptis, dimiserunt quosdam effugere."
      en: "Now they that were with Simon, being led with covetousness, were persuaded for the sake of money by some that were in the towers: and taking seventy thousand didrachmas, let some of them escape."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Cum autem Machabaeo nuntiatum esset quod factum est, principibus populi congregatis, accusavit, quod pecunia fratres vendidissent, adversariis eorum dimissis."
      en: "But when it was told Machabeus what was done, he assembled the rulers of the people, and accused those men that they had sold their brethren for money, having let their adversaries escape."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Hos igitur proditores factos interfecit, et confestim duas turres occupavit."
      en: "So he put these traitors to death, and forthwith took the two towers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Armis autem ac manibus omnia prospere agendo in duabus munitionibus plus quam viginti millia peremit."
      en: "And having good success in arms and in all things he took in hand, he slew more than twenty thousand in the two holds."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "At Timotheus, qui prius a Judaeis fuerat superatus, convocato exercitu peregrinae multitudinis, et congregato equitatu Asiano, advenit quasi armis Judaeam capturus."
      en: "But Timotheus who before had been overcome by the Jews, having called together a multitude of foreign troops, and assembled horsemen out of Asia, came as though he would take Judea by force of arms."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Machabaeus autem, et qui cum ipso erant, appropinquante illo, deprecabantur Dominum, caput terra aspergentes, lumbosque ciliciis praecincti,"
      en: "But Machabeus and they that were with him, when he drew near, prayed to the Lord, sprinkling earth upon their heads and girding their loins with haircloth,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ad altaris crepidinem provoluti, ut sibi propitius, inimicis autem eorum esset inimicus, et adversariis adversaretur, sicut lex dicit."
      en: "And lying prostrate at the foot of the altar, besought him to be merciful to them, and to be an enemy to their enemies, and an adversary to their adversaries, as the law saith."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et ita post orationem, sumptis armis, longius de civitate procedentes, et proximi hostibus effecti resederunt."
      en: "And so after prayer taking their arms, they went forth further from the city, and when they were come very near the enemies they rested."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Primo autem solis ortu utrique commiserunt: isti quidem victoriae et prosperitatis sponsorem cum virtute Dominum habentes: illi autem ducem belli animum habebant."
      en: "But as soon as the sun was risen both sides joined battle: the one part having with their valour the Lord for a surety of victory and success: but the other side making their rage their leader in battle."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Sed cum vehemens pugna esset, apparuerunt adversariis de caelo viri quinque in equis, frenis aureis decori, ducatum Judaeis praestantes:"
      en: "But when they were in the heat of the engagement there appeared to the enemies from heaven five men upon horses, comely with golden bridles, conducting the Jews:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ex quibus duo Machabaeum medium habentes, armis suis circumseptum incolumem conservabant: in adversarios autem tela et fulmina jaciebant, ex quo et caecitate confusi, et repleti perturbatione, cadebant."
      en: "Two of whom took Machabeus between them, and covered him on every side with their arms, and kept him safe: but cast darts and fireballs against the enemy, so that they fell down, being both confounded with blindness, and filled with trouble."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Interfecti sunt autem viginti millia quingenti, et equites sexcenti."
      en: "And there were slain twenty thousand five hundred, and six hundred horsemen."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Timotheus vero confugit in Gazaram praesidium munitum, cui praeerat Chaereas."
      en: "But Timotheus fled into Gazara a strong hold, where Chereas was governor."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Machabaeus autem, et qui cum eo erant, laetantes obsederunt praesidium diebus quatuor."
      en: "Then Machabeus, and they that were with him, cheerfully laid siege to the fortress four days."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "At hi qui intus erant, loci firmitate confisi, supra modum maledicebant, et sermones nefandos jactabant."
      en: "But they that were within, trusting to the strength of the place, blasphemed exceedingly, and cast forth abominable words."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Sed cum dies quinta illucesceret, viginti juvenes ex his qui cum Machabaeo erant, accensi animis propter blasphemiam, viriliter accesserunt ad murum, et feroci animo incedentes ascendebant:"
      en: "But when the fifth day appeared, twenty young men of them that were with Machabeus, inflamed in their minds because of the blasphemy, approached manfully to the wall, and pushing forward with fierce courage got up upon it."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "sed et alii similiter ascendentes, turres portasque succendere aggressi sunt, atque ipsos maledicos vivos concremare."
      en: "Moreover others also getting up after them, went to set fire to the towers and the gates, and to burn the blasphemers alive."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Per continuum autem biduum praesidio vastato, Timotheum occultantem se in quodam repertum loco peremerunt: et fratrem illius Chaeream et Apollophanem occiderunt."
      en: "And having for two days together pillaged and sacked the fortress, they killed Timotheus, who was found hid in a certain place: they slew also his brother Chereas, and Apollophanes."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Quibus gestis, in hymnis et confessionibus benedicebant Dominum, qui magna fecit in Israel, et victoriam dedit illis."
      en: "And when this was done, they blessed the Lord with hymns and thanksgiving, who had done great things in Israel, and given them the victory."
    status: { la: verified, en: verified }
