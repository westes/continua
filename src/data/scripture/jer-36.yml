# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 36
verses:
  - n: 1
    text:
      la: "Et factum est in anno quarto Joakim filii Josiae regis Juda, factum est verbum hoc ad Jeremiam a Domino, dicens:"
      en: "And it came to pass in the fourth year of Joakim the son of Josias king of Juda, that this word came to Jeremias by the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tolle volumen libri, et scribes in eo omnia verba quae locutus sum tibi adversum Israel et Judam, et adversum omnes gentes, a die qua locutus sum ad te, ex diebus Josiae usque ad diem hanc:"
      en: "Take thee a roll of a book, and thou shalt write in it all the words that I have spoken to thee against Israel and Juda, and against all the nations from the day that I spoke to thee, from the days of Josias even to this day."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si forte, audiente domo Juda universa mala quae ego cogito facere eis, revertatur unusquisque a via sua pessima, et propitius ero iniquitati et peccato eorum."
      en: "If so be, when the house of Juda shall hear all the evils that I purpose to do unto them, that they may return every man from his wicked way: and I will forgive their iniquity, and their sin."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vocavit ergo Jeremias Baruch filium Neriae: et scripsit Baruch ex ore Jeremiae omnes sermones Domini quos locutus est ad eum, in volumine libri:"
      en: "So Jeremias called Baruch the son of Nerias: and Baruch wrote from the mouth of Jeremias all the words of the Lord, which he spoke to him, upon the roll of a book."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et praecepit Jeremias Baruch, dicens: Ego clausus sum, nec valeo ingredi domum Domini."
      en: "And Jeremias commanded Baruch, saying: I am shut up, and cannot go into the house of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ingredere ergo tu, et lege de volumine in quo scripsisti ex ore meo verba Domini, audiente populo in domo Domini, in die jejunii, insuper et audiente universo Juda, qui veniunt de civitatibus suis, leges eis,"
      en: "Go thou in therefore, and read out of the volume, which thou hast written from my mouth, the words of the Lord, in the hearing of all the people in the house of the Lord on the fasting day: and also thou shalt read them in the hearing of all Juda that come out of their cities:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si forte cadat oratio eorum in conspectu Domini, et revertatur unusquisque a via sua pessima, quoniam magnus furor et indignatio est quam locutus est Dominus adversus populum hunc."
      en: "If so be they may present their supplication before the Lord, and may return every one from his wicked way: for great is the wrath and indignation which the Lord hath pronounced against this people."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et fecit Baruch filius Neriae juxta omnia quae praeceperat ei Jeremias propheta, legens ex volumine sermones Domini in domo Domini."
      en: "And Baruch the son of Nerias did according to all that Jeremias the prophet had commanded him, reading out of the volume the words of the Lord in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Factum est autem in anno quinto Joakim filii Josiae regis Juda, in mense nono: praedicaverunt jejunium in conspectu Domini omni populo in Jerusalem, et universae multitudini quae confluxerat de civitatibus Juda in Jerusalem."
      en: "And it came to pass in the fifth year of Joakim the son of Josias king of Juda, in the ninth month, that they proclaimed a fast before the Lord to all the people in Jerusalem, and to all the people that were come together out of the cities of Juda to Jerusalem."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Legitque Baruch ex volumine sermones Jeremiae in domo Domini, in gazophylacio Gamariae, filii Saphan scribae, in vestibulo superiori, in introitu portae novae domus Domni, audiente omni populo."
      en: "And Baruch read out of the volume the words of Jeremias in the house of the Lord, in the treasury of Gamarias the son of Saphan the scribe, in the upper court, in the entry of the new gate of the house of the Lord, in the hearing of all the people."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque audisset Michaeas filius Gamariae filii Saphan, omnes sermones Domini ex libro,"
      en: "And when Micheas the son of Gamarias the son of Saphan had heard out of the book all the words of the Lord,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "descendit in domum regis, ad gazophylacium scribae, et ecce ibi omnes principes sedebant: Elisama scriba, et Dalaias filius Semeiae, et Elnathan filius Achobor, et Gamarias filius Saphan, et Sedecias filius Hananiae, et universi principes:"
      en: "He went down into the king's house to the secretary's chamber: and behold all the princes sat there, Elisama the scribe, and Dalaias the son of Semeias, and Elnathan the son of Achobor, and Gamarias the son of Saphan, and Sedecias the son of Hananias, and all the princes."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et nuntiavit eis Michaeas omnia verba quae audivit, legente Baruch ex volumine in auribus populi."
      en: "And Micheas told them all the words that he had heard when Baruch read out of the volume in the hearing of the people."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Miserunt itaque omnes principes ad Baruch Judi filium Nathaniae filii Selemiae filii Chusi, dicentes: Volumen ex quo legisti, audiente populo, sume in manu tua, et veni. Tulit ergo Baruch filius Neriae volumen in manu sua, et venit ad eos,"
      en: "Therefore all the princes sent Judi the son of Nathanias, the son of Selemias, the son of Chusi, to Baruch, saying: Take in thy hand the volume in which thou hast read in the hearing of the people, and come. So Baruch the son of Nerias took the volume in his hand, and came to them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dixerunt ad eum: Sede, et lege haec in auribus nostris. Et legit Baruch in auribus eorum."
      en: "And they said to him: Sit down and read these things in our hearing. And Baruch read in their hearing."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Igitur cum audissent omnia verba, obstupuerunt unusquisque ad proximum suum, et dixerunt ad Baruch: Nuntiare debemus regi omnes sermones istos."
      en: "And when they had heard all the words, they looked upon one another with astonishment, and they said to Baruch: We must tell the king all these words."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et interrogaverunt eum, dicentes: Indica nobis quomodo scripsisti omnes sermones istos ex ore ejus."
      en: "And they asked him, saying: Tell us how didst thou write all these words from his mouth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dixit autem eis Baruch: Ex ore suo loquebatur quasi legens ad me omnes sermones istos, et ego scribebam in volumine atramento."
      en: "And Baruch said to them: With his mouth he pronounced all these words as if he were reading to me: and I wrote in a volume with ink."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et dixerunt principes ad Baruch: Vade, et abscondere, tu et Jeremias, et nemo sciat ubi sitis."
      en: "And the princes said to Baruch: Go, and hide thee, both thou and Jeremias, and let no man know where you are."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et ingressi sunt ad regem in atrium: porro volumen commendaverunt in gazophylacio Elisamae scribae, et nuntiaverunt, audiente rege, omnes sermones."
      en: "And they went in to the king into the court: but they laid up the volume in the chamber of Elisama the scribe: and they told all the words in the hearing of the king."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Misitque rex Judi ut sumeret volumen: qui tollens illud de gazophylacio Elisamae scribae, legit, audiente rege et universis principibus qui stabant circa regem."
      en: "And the king sent Judi that he should take the volume: who bringing it out of the chamber of Elisama the scribe, read it in the hearing of the king, and of all the princes that stood about the king."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Rex autem sedebat in domo hiemali, in mense nono, et posita erat arula coram eo plena prunis."
      en: "Now the king sat in the winter house, In the ninth month: and there was a hearth before him full of burning coals."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cumque legisset Judi tres pagellas vel quatuor, scidit illud scalpello scribae, et projecit in ignem qui erat super arulam, donec consumeretur omne volumen igni qui erat in arula."
      en: "And when Judi had read three or four pages, he cut it with the penknife, and he cast it into the fire, that was upon the hearth, till all the volume was consumed with the fire that was on the hearth."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et non timuerunt, neque sciderunt vestimenta sua, rex et omnes servi ejus qui audierunt universos sermones istos."
      en: "And the king and all his servants that heard all these words were not afraid, nor did they rend their garments."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Verumtamen Elnathan, et Dalaias, et Gamarias, contradixerunt regi, ne combureret librum: et non audivit eos."
      en: "But yet Elnathan, and Dalaias, and Gamarias spoke to the king, not to burn the book: and he heard them not."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et praecepit rex Jeremiel filio Amelech, et Saraiae filio Ezriel, et Selemiae filio Abdeel, ut comprehenderent Baruch scribam, et Jeremiam prophetam: abscondit autem eos Dominus."
      en: "And the king commanded Jeremiel the son of Amelech, and Saraias the son of Ezriel, and Selemias the son of Abdeel, to take up Baruch the scribe, and Jeremias the prophet: but the Lord hid them."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et factum est verbum Domini ad Jeremiam prophetam, postquam combusserat rex volumen et sermones quos scripserat Baruch ex ore Jeremiae, dicens:"
      en: "And the word of the Lord came to Jeremias the prophet, after that the king had burnt the volume, and the words that Baruch had written from the mouth of Jeremias, saying:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Rursum tolle volumen aliud, et scribe in eo omnes sermones priores qui erant in primo volumine, quod combussit Joakim rex Juda."
      en: "Take thee again another volume: and write in it all the former words that were in the first volume which Joakim the king of Juda hath burnt."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et ad Joakim regem Juda dices: Haec dicit Dominus: Tu combussisti volumen illud, dicens: Quare scripsisti in eo annuntians: Festinus veniet rex Babylonis, et vastabit terram hanc, et cessare faciet ex illa hominem et jumentum?"
      en: "And thou shalt say to Joakim the king of Juda: Thus saith the Lord: Thou hast burnt that volume, saying: Why hast thou written therein, and said: The king of Babylon shall come speedily, and shall lay waste this land: and shall cause to cease from thence man and beast?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Propterea haec dicit Dominus contra Joakim regem Juda: Non erit ex eo qui sedeat super solium David: et cadaver ejus projicietur ad aestum per diem, et ad gelu per noctem."
      en: "Therefore thus saith the Lord against Joakim the king of Juda: He shall have none to sit upon the throne of David: and his dead body shall be cast out to the heat by day, and to the frost by night."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et visitabo contra eum, et contra semen ejus, et contra servos ejus, iniquitates suas: et adducam super eos, et super habitatores Jerusalem, et super viros Juda, omne malum quod locutus sum ad eos, et non audierunt."
      en: "And I will punish him, and his seed and his servants, for their iniquities, and I will bring upon them, and upon the inhabitants of Jerusalem, and upon the men of Juda all the evil that I have pronounced against them, but they have not heard."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Jeremias autem tulit volumen aliud, et dedit illud Baruch filio Neriae scribae: qui scripsit in eo ex ore Jeremiae omnes sermones libri quem combusserat Joakim rex Juda igni: et insuper additi sunt sermones multo plures quam antea fuerant."
      en: "And Jeremias took another volume, and gave it to Baruch the son of Nerias the scribe: who wrote in it from the mouth of Jeremias all the words of the book which Joakim the king of Juda had burnt with fire: and there were added besides many more words than had been before."
    status: { la: verified, en: verified }
