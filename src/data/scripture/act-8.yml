# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 8
verses:
  - n: 1
    text:
      la: "Facta est autem in illa die persecutio magna in ecclesia, quae erat Jerosolymis, et omnes dispersi sunt per regiones Judaeae et Samariae praeter Apostolos."
      en: "And at that time there was raised a great persecution against the church which was at Jerusalem; and they were all dispersed through the countries of Judea, and Samaria, except the apostles."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Curaverunt autem Stephanum viri timorati, et fecerunt planctum magnum super eum."
      en: "And devout men took order for Stephen's funeral, and made great mourning over him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Saulus autem devastabat ecclesiam per domos intrans, et trahens viros ac mulieres tradebat in custodiam."
      en: "But Saul made havock of the church, entering in from house to house, and dragging away men and women, committed them to prison."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Igitur qui dispersi erant pertransibant, evangelizantes verbum Dei."
      en: "They therefore that were dispersed, went about preaching the word of God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Philippus autem descendens in civitatem Samariae, praedicabant illis Christum."
      en: "And Philip going down to the city of Samaria, preached Christ unto them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Intendebant autem turbae his quae a Philippo dicebantur unanimiter audientes, et videntes signa quae faciebat."
      en: "And the people with one accord were attentive to those things which were said by Philip, hearing, and seeing the miracles which he did."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Multi enim eorum qui habebant spiritus immundos, clamantes voce magna exibant. Multi autem paralytici et claudi curati sunt."
      en: "For many of them who had unclean spirits, crying with a loud voice, went out."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Factum est ergo gaudium magnum in illa civitate."
      en: "And many, taken with the palsy, and that were lame, were healed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vir autem quidam nomine Simon, qui ante fuerat in civitate magnus, seducens gentem Samariae, dicens se esse aliquem magnum:"
      en: "There was therefore great joy in that city. Now there was a certain man named Simon, who before had been a magician in that city, seducing the people of Samaria, giving out that he was some great one:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cui auscultabant omnes a minimo usque ad maximum, dicentes: Hic est virtus Dei, quae vocatur magna."
      en: "To whom they all gave ear, from the least to the greatest, saying: This man is the power of God, which is called great."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Attendebant autem eum: propter quod multo tempore magiis suis dementasset eos."
      en: "And they were attentive to him, because, for a long time, he had bewitched them with his magical practices."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum vero credidissent Philippo evangelizanti de regno Dei, in nomine Jesu Christi baptizabantur viri ac mulieres."
      en: "But when they had believed Philip preaching of the kingdom of God, in the name of Jesus Christ, they were baptized, both men and women."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tunc Simon et ipse credidit: et cum baptizatus esset, adhaerebat Philippo. Videns etiam signa et virtutes maximas fieri, stupens admirabatur."
      en: "Then Simon himself believed also; and being baptized, he adhered to Philip. And being astonished, wondered to see the signs and exceeding great miracles which were done."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cum autem audissent Apostoli, qui erant Jerosolymis, quod recepisset Samaria verbum Dei, miserunt ad eos Petrum et Joannem."
      en: "Now when the apostles, who were in Jerusalem, had heard that Samaria had received the word of God, they sent unto them Peter and John."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Qui cum venissent, oraverunt pro ipsis ut acciperent Spiritum Sanctum:"
      en: "Who, when they were come, prayed for them, that they might receive the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nondum enim in quemquam illorum venerat, sed baptizati tantum erant in nomine Domini Jesu."
      en: "For he was not as yet come upon any of them; but they were only baptized in the name of the Lord Jesus."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tunc imponebant manus super illos, et accipiebant Spiritum Sanctum."
      en: "Then they laid their hands upon them, and they received the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cum vidisset autem Simon quia per impositionem manus Apostolorum daretur Spiritus Sanctus, obtulit eis pecuniam,"
      en: "And when Simon saw, that by the imposition of the hands of the apostles, the Holy Ghost was given, he offered them money,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dicens: Date et mihi hanc potestatem, ut cuicumque imposuero manus, accipiat Spiritum Sanctum. Petrus autem dixit ad eum:"
      en: "Saying: Give me also this power, that on whomsoever I shall lay my hands, he may receive the Holy Ghost. But Peter said to him:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Pecunia tua tecum sit in perditionem: quoniam donum Dei existimasti pecunia possideri."
      en: "Keep thy money to thyself, to perish with thee, because thou hast thought that the gift of God may be purchased with money."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Non est tibi pars, neque sors in sermone isto; cor enim tuum non est rectum coram Deo."
      en: "Thou hast no part nor lot in this matter. For thy heart is not right in the sight of God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Poenitentiam itaque age ab hac nequitia tua: et roga Deum, si forte remittatur tibi haec cogitatio cordis tui."
      en: "Do penance therefore for this thy wickedness; and pray to God, that perhaps this thought of thy heart may be forgiven thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "In felle enim amaritudinis, et obligatione iniquitatis video te esse."
      en: "For I see thou art in the gall of bitterness, and in the bonds of iniquity."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Respondens autem Simon, dixit: Precamini vos pro me ad Dominum, ut nihil veniat super me horum quae dixistis."
      en: "Then Simon answering, said: Pray you for me to the Lord, that none of these things which you have spoken may come upon me."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et illi quidem testificati, et locuti verbum Domini, redibant Jerosolymam, et multis regionibus Samaritanorum evangelizabant."
      en: "And they indeed having testified and preached the word of the Lord, returned to Jerusalem, and preached the gospel to many countries of the Samaritans."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Angelus autem Domini locutus est ad Philippum, dicens: Surge, et vade contra meridianum, ad viam quae descendit ab Jerusalem in Gazam: haec est deserta."
      en: "Now an angel of the Lord spoke to Philip, saying: Arise, go towards the south, to the way that goeth down from Jerusalem into Gaza: this is desert."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et surgens abiit. Et ecce vir Aethiops, eunuchus, potens Candacis reginae Aethiopum, qui erat super omnes gazas ejus, venerat adorare in Jerusalem:"
      en: "And rising up, he went. And behold a man of Ethiopia, an eunuch, of great authority under Candace the queen of the Ethiopians, who had charge over all her treasures, had come to Jerusalem to adore."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et revertebatur sedens super currum suum, legensque Isaiam prophetam."
      en: "And he was returning, sitting in his chariot, and reading Isaias the prophet."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Dixit autem Spiritus Philippo: Accede, et adjunge te ad currum istum."
      en: "And the Spirit said to Philip: Go near, and join thyself to this chariot."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Accurrens autem Philippus, audivit eum legentem Isaiam prophetam, et dixit: Putasne intelligis quae legis?"
      en: "And Philip running thither, heard him reading the prophet Isaias. And he said: Thinkest thou that thou understandest what thou readest?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Qui ait: Et quomodo possum, si non aliquis ostenderit mihi? Rogavitque Philippum ut ascenderet, et sederet secum."
      en: "Who said: And how can I, unless some man shew me? And he desired Philip that he would come up and sit with him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Locus autem Scripturae, quem legebat, erat hic: Tamquam ovis ad occisionem ductus est: et sicus agnus coram tondente se, sine voce, sic non aperuit os suum."
      en: "And the place of the scripture which he was reading was this: He was led as a sheep to the slaughter; and like a lamb without voice before his shearer, so openeth he not his mouth."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "In humilitate judicium ejus sublatum est. Generationem ejus quis enarrabit, quoniam tolletur de terra vita ejus?"
      en: "In humility his judgment was taken away. His generation who shall declare, for his life shall be taken from the earth?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Respondens autem eunuchus Philippo, dixit: Obsecro te, de quo propheta dicit hoc? de se, an de alio aliquo?"
      en: "And the eunuch answering Philip, said: I beseech thee, of whom doth the prophet speak this? of himself, or of some other man?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Aperiens autem Philippus os suum, et incipiens a Scriptura ista, evangelizavit illi Jesum."
      en: "Then Philip, opening his mouth, and beginning at this scripture, preached unto him Jesus."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et dum irent per viam, venerunt ad quamdam aquam: et ait eunuchus: Ecce aqua, quid prohibet me baptizari?"
      en: "And as they went on their way, they came to a certain water; and the eunuch said: See, here is water: what doth hinder me from being baptized?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Dixit autem Philippus: Si credis ex toto corde, licet. Et respondens ait: Credo Filium Dei esse Jesum Christum."
      en: "And Philip said: If thou believest with all thy heart, thou mayest. And he answering, said: I believe that Jesus Christ is the Son of God."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et jussit stare currum: et descenderunt uterque in aquam, Philippus et eunuchus, et baptizavit eum."
      en: "And he commanded the chariot to stand still; and they went down into the water, both Philip and the eunuch: and he baptized him."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Cum autem ascendissent de aqua, Spiritus Domini rapuit Philippum, et amplius non vidit eum eunuchus. Ibat autem per viam suam gaudens."
      en: "And when they were come up out of the water, the Spirit of the Lord took away Philip; and the eunuch saw him no more. And he went on his way rejoicing."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Philippus autem inventus est in Azoto, et pertransiens evangelizabat civitatibus cunctis, donec veniret Caesaream."
      en: "But Philip was found in Azotus; and passing through, he preached the gospel to all the cities, till he came to Caesarea."
    status: { la: verified, en: verified }
