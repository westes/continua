# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 11
verses:
  - n: 1
    text:
      la: "audierunt autem apostoli et fratres qui erant in Iudaea quoniam et gentes receperunt verbum Dei"
      en: "And the apostles and brethren, who were in Judea, heard that the Gentiles also had received the word of God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cum ascendisset autem Petrus in Hierosolymam disceptabant adversus illum qui erant ex circumcisione"
      en: "And when Peter was come up to Jerusalem, they that were of the circumcision contended with him,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dicentes quare introisti ad viros praeputium habentes et manducasti cum illis"
      en: "Saying: Why didst thou go in to men uncircumcised, and didst eat with them?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "incipiens autem Petrus exponebat illis ordinem dicens"
      en: "But Peter began and declared to them the matter in order, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ego eram in civitate Ioppe orans et vidi in excessu mentis visionem descendens vas quoddam velut linteum magnum quattuor initiis submitti de caelo et venit usque ad me"
      en: "I was in the city of Joppe praying, and I saw in an ecstasy of mind a vision, a certain vessel descending, as it were a great sheet let down from heaven by four corners, and it came even unto me."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in quod intuens considerabam et vidi quadrupedia terrae et bestias et reptilia et volatilia caeli"
      en: "Into which looking, I considered, and saw fourfooted creatures of the earth, and beasts, and creeping things, and fowls of the air:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "audivi autem et vocem dicentem mihi surgens Petre occide et manduca"
      en: "And I heard also a voice saying to me: Arise, Peter; kill and eat."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixi autem nequaquam Domine quia commune aut inmundum numquam introivit in os meum"
      en: "And I said: Not so, Lord; for nothing common or unclean hath ever entered into my mouth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "respondit autem vox secundo de caelo quae Deus mundavit tu ne commune dixeris"
      en: "And the voice answered again from heaven: What God hath made clean, do not thou call common."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "hoc autem factum est per ter et recepta sunt rursum omnia in caelum"
      en: "And this was done three times: and all were taken up again into heaven."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ecce confestim tres viri adstiterunt in domo in qua eram missi a Caesarea ad me"
      en: "And behold, immediately there were three men come to the house wherein I was, sent to me from Caesarea."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixit autem Spiritus mihi ut irem cum illis nihil haesitans venerunt autem mecum et sex fratres isti et ingressi sumus in domum viri"
      en: "And the Spirit said to me, that I should go with them, nothing doubting. And these six brethren went with me also: and we entered into the man's house."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "narravit autem nobis quomodo vidisset angelum in domo sua stantem et dicentem sibi mitte in Ioppen et accersi Simonem qui cognominatur Petrus"
      en: "And he told us how he had seen an angel in his house, standing, and saying to him: Send to Joppe, and call hither Simon, who is surnamed Peter,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui loquetur tibi verba in quibus salvus eris tu et universa domus tua"
      en: "Who shall speak to thee words, whereby thou shalt be saved, and all thy house."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cum autem coepissem loqui decidit Spiritus Sanctus super eos sicut et in nos in initio"
      en: "And when I had begun to speak, the Holy Ghost fell upon them, as upon us also in the beginning."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "recordatus sum autem verbi Domini sicut dicebat Iohannes quidem baptizavit aqua vos autem baptizabimini Spiritu Sancto"
      en: "And I remembered the word of the Lord, how that he said: John indeed baptized with water, but you shall be baptized with the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "si ergo eandem gratiam dedit illis Deus sicut et nobis qui credidimus in Dominum Iesum Christum ego quis eram qui possem prohibere Deum"
      en: "If then God gave them the same grace, as to us also who believed in the Lord Jesus Christ; who was I, that could withstand God?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "his auditis tacuerunt et glorificaverunt Deum dicentes ergo et gentibus Deus paenitentiam ad vitam dedit"
      en: "Having heard these things, they held their peace, and glorified God, saying: God then hath also to the Gentiles given repentance unto life."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et illi quidem qui dispersi fuerant a tribulatione quae facta fuerat sub Stephano perambulaverunt usque Foenicen et Cyprum et Antiochiam nemini loquentes verbum nisi solis Iudaeis"
      en: "Now they who had been dispersed by the persecution that arose on occasion of Stephen, went about as far as Phenice and Cyprus and Antioch, speaking the word to none, but to the Jews only."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "erant autem quidam ex eis viri cyprii et cyrenei qui cum introissent Antiochiam loquebantur et ad Graecos adnuntiantes Dominum Iesum"
      en: "But some of them were men of Cyprus and Cyrene, who, when they were entered into Antioch, spoke also to the Greeks, preaching the Lord Jesus."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et erat manus Domini cum eis multusque numerus credentium conversus est ad Dominum"
      en: "And the hand of the Lord was with them: and a great number believing, were converted to the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "pervenit autem sermo ad aures ecclesiae quae erat Hierosolymis super istis et miserunt Barnaban usque Antiochiam"
      en: "And the tidings came to the ears of the church that was at Jerusalem, touching these things: and they sent Barnabas as far as Antioch."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "qui cum pervenisset et vidisset gratiam Dei gavisus est et hortabatur omnes proposito cordis permanere in Domino"
      en: "Who, when he was come, and had seen the grace of God, rejoiced: and he exhorted them all with purpose of heart to continue in the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quia erat vir bonus et plenus Spiritu Sancto et fide et adposita est turba multa Domino"
      en: "For he was a good man, and full of the Holy Ghost and of faith. And a great multitude was added to the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "profectus est autem Tarsum ut quaereret Saulum quem cum invenisset perduxit Antiochiam"
      en: "And Barnabas went to Tarsus to seek Saul: whom, when he had found, he brought to Antioch."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et annum totum conversati sunt in ecclesia et docuerunt turbam multam ita ut cognominarentur primum Antiochiae discipuli Christiani"
      en: "And they conversed there in the church a whole year; and they taught a great multitude, so that at Antioch the disciples were first named Christians."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "in his autem diebus supervenerunt ab Hierosolymis prophetae Antiochiam"
      en: "And in these days there came prophets from Jerusalem to Antioch:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et surgens unus ex eis nomine Agabus significabat per Spiritum famem magnam futuram in universo orbe terrarum quae facta est sub Claudio"
      en: "And one of them named Agabus, rising up, signified by the Spirit, that there should be a great famine over the whole world, which came to pass under Claudius."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "discipuli autem prout quis habebat proposuerunt singuli eorum in ministerium mittere habitantibus in Iudaea fratribus"
      en: "And the disciples, every man according to his ability, purposed to send relief to the brethren who dwelt in Judea:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quod et fecerunt mittentes ad seniores per manus Barnabae et Sauli"
      en: "Which also they did, sending it to the ancients, by the hands of Barnabas and Saul."
    status: { la: verified, en: verified }
