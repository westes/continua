# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 4
verses:
  - n: 1
    text:
      la: "Addideruntque filii Israel facere malum in conspectu Domini post mortem Aod,"
      en: "And the children of Israel again did evil in the sight of the Lord after the death of Aod,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et tradidit illos Dominus in manus Jabin regis Chanaan, qui regnavit in Asor: habuitque ducem exercitus sui nomine Sisaram, ipse autem habitabat in Haroseth gentium."
      en: "And the Lord delivered them up into the hands of Jaban king of Chanaan, who reigned in Asor: and he had a general of his army named Sisara, and he dwelt in Haroseth of the Gentiles."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Clamaveruntque filii Israel ad Dominum: nongentos enim habebat falcatos currus, et per viginti annos vehementer oppresserat eos."
      en: "And the children of Israel cried to the Lord: for he had nine hundred chariots set with scythes, and for twenty years had grievously oppressed them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Erat autem Debbora prophetis uxor Lapidoth, quae judicabat populum in illo tempore."
      en: "And there was at that time Debbora a prophetess the wife of Lapidoth, who judged the people,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et sedebat sub palma, quae nomine illius vocabatur, inter Rama et Bethel in monte Ephraim: ascendebantque ad eam filii Israel in omne judicium."
      en: "And she sat under a palm tree, which was called by her name, between Rama and Bethel in mount Ephraim: and the children of Israel came up to her for all judgment."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quae misit et vocavit Barac filium Abinoem de Cedes Nephthali: dixitque ad eum: Praecepit tibi Dominus Deus Israel: Vade, et duc exercitum in montem Thabor, tollesque tecum decem millia pugnatorum de filiis Nephthali, et de filiis Zabulon:"
      en: "And she sent and called Barac the son of Abinoem out of Cedes in Nephtali: and she said to him: The Lord God of Israel hath commanded thee: Go, and lead an army to mount Thabor, and thou shalt take with thee ten thousand fighting men of the children of Nephtali, and of the children of Zabulon:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ego autem adducam ad te in loco torrentis Cison, Sisaram principem exercitus Jabin, et currus ejus, atque omnem multitudinem, et tradam eos in manu tua."
      en: "And I will bring unto thee in the place of the torrent Cison, Sisara the general of Jabin's army, and his chariots, and all his multitude, and will deliver them into thy hand."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixitque ad eam Barac: Si venis mecum, vadam: si nolueris venire mecum, non pergam."
      en: "And Barac said to her: If thou wilt come with me, I will go: if thou wilt not come with me, I will not go."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quae dixit ad eum: Ibo quidem tecum, sed in hac vice victoria non reputabitur tibi, quia in manu mulieris tradetur Sisara. Surrexit itaque Debbora, et perrexit cum Barac in Cedes."
      en: "She said to him: I will go indeed with thee, but at this time the victory shall not be attributed to thee, because Sisara shall be delivered into the hand of a woman. Debbora therefore arose, and went with Barac to Cedes."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui, accitis Zabulon et Nephthali, ascendit cum decem millibus pugnatorum, habens Debboram in comitatu suo."
      en: "And he called unto him Zabulon and Nephtali, and went up with ten thousand fighting men, having Debbora in his company."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Haber autem Cinaeus recesserat quondam a ceteris Cinaeis fratribus suis filiis Hobab, cognati Moysi: et tetenderat tabernacula usque ad vallem, quae vocatur Sennim, et erat juxta Cedes."
      en: "Now Haber the Cinite had some time before departed from the rest of the Cinites his brethren the sons of Hobab, the kinsman of Moses: and had pitched his tents unto the valley which is called Sellnim, and was near Cedes."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nuntiatumque est Sisarae quod ascendisset Barac filius Abinoem in montem Thabor:"
      en: "And it was told Sisara, that Barac the son of Ablinoem was gone up to mount Thabor:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et congregavit nongentos falcatos currus, et omnem exercitum de Haroseth gentium ad torrentem Cison."
      en: "And he gathered together his nine hundred chariots armed with scythes, and all his army from Haroseth of the Gentiles to the torrent Cison."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixitque Debbora ad Barac: Surge, haec est enim dies, in qua tradidit Dominus Sisaram in manus tuas: en ipse ductor est tuus. Descendit itaque Barac de monte Thabor, et decem millia pugnatorum cum eo."
      en: "And Debbora said to Barac: Arise, for this is the day wherein the Lord hath delivered Sisara into thy hands: behold he is thy leader. And Barac went down from mount Thabor, and ten thousand fighting men with him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Perterruitque Dominus Sisaram, et omnes currus ejus, universamque multitudinem in ore gladii ad conspectum Barac: in tantum, ut Sisara de curru desiliens, pedibus fugeret,"
      en: "And the Lord struck a terror into Sisara, and all his chariots, and all his multitude, with the edge of the sword, at the sight of Barac, insomuch that Sisara leaping down from off his chariot, fled away on foot."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Barac persequeretur fugientes currus, et exercitum usque ad Haroseth gentium, et omnis hostium multitudo usque ad internecionem caderet."
      en: "And Barac pursued after the fleeing chariots and the army unto Haroseth of the Gentiles, and all the multitude of the enemies was utterly destroyed."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sisara autem fugiens pervenit ad tentorium Jahel uxoris Haber Cinaei. Erat enim pax inter Jabin regem Asor, et domum Haber Cinaei."
      en: "But Sisara fleeing came to the tent of Jahel the wife of Haber the Cinite, for there was peace between Jabin the king of Asor, and the house of Haber the Cinite."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Egressa igitur Jahel in occursum Sisarae, dixit ad eum: Intra ad me, domine mi: intra, ne timeas. Qui ingressus tabernaculum ejus, et opertus ab ea pallio,"
      en: "And Jahel went forth to meet Sisara, and said to him: Come in to me, my lord, come in, fear not. He went in to her tent, and being covered by her with a cloak,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dixit ad eam: Da mihi, obsecro, paululum aquae, quia sitio valde. Quae aperuit utrem lactis, et dedit ei bibere, et operuit illum."
      en: "Said to her: Give me, I beseech thee, a little water, for I am very thirsty. She opened a bottle of milk, and gave him to drink, and covered him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixitque Sisara ad eam: Sta ante ostium tabernaculi: et cum venerit aliquis interrogans te, et dicens: Numquid hic est aliquis? respondebis: Nullus est."
      en: "And Sisara said to her: Stand before the door of the tent, and when any shall come and inquire of thee, saying: Is there any man here? thou shalt say: There is none."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Tulit itaque Jahel uxor Haber clavum tabernaculi, assumens pariter et malleum: et ingressa abscondite et cum silentio, posuit supra tempus capitis ejus clavum, percussumque malleo defixit in cerebrum usque ad terram: qui soporem morti consocians defecit, et mortuus est."
      en: "So Jahel Haber's wife took a nail of the tent, and taking also a hammer: and going in softly, and with silence, she put the nail upon the temples of his head, and striking it With the hammer, drove it through his brain fast into the ground: and so passing from deep sleep to death, he fainted away and died."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ecce Barac sequens Sisaram veniebat: egressaque Jahel in occursum ejus, dixit ei: Veni, et ostendam tibi virum quem quaeris. Qui cum intrasset ad eam, vidit Sisaram jacentem mortuum, et clavum infixum in tempore ejus."
      en: "And behold Barac came pursuing after Sisara: and Jahel went out to meet him, and said to him: Come, and I will shew thee, the man whom thou seekest. And when he came into her tent, he saw Sisara lying dead, and the nail fastened in his temples."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Humiliavit ergo Deus in die illo Jabin regem Chanaan coram filiis Israel:"
      en: "So God that day humbled Jabin the king of Chanaan before the children of Israel:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui crescebant quotidie, et forti manu opprimebant Jabin regem Chanaan, donec delerent eum."
      en: "Who grew daily stronger, and with a mighty hand overpowered Jabin king of Chanaan, till they quite destroyed him."
    status: { la: verified, en: verified }
