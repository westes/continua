# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1esdr
chapter: 5
verses:
  - n: 1
    text:
      la: "prophetaverunt autem Aggeus propheta et Zaccharias filius Addo prophetantes ad Iudaeos qui erant in Iudaea et Hierusalem in nomine Dei Israhel"
      en: "Now Aggeus the prophet, and Zacharias the son of Addo, prophesied to the Jews that were in Judea and Jerusalem, in the name of the God of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tunc surrexerunt Zorobabel filius Salathihel et Iosue filius Iosedech et coeperunt aedificare templum Dei in Hierusalem et cum eis prophetae Dei adiuvantes eos"
      en: "Then rose up Zorobabel the son of Salathiel, and Josue the son of Josedec, and began to build the temple of God in Jerusalem, and with them were the prophets of God helping them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in ipso tempore venit ad eos Tatannai qui erat dux trans Flumen et Starbuzannai et consiliarii eorum sicque dixerunt eis quis dedit vobis consilium ut domum hanc aedificaretis et muros hos instauraretis"
      en: "And at the same time came to them Thathanai, who was governor beyond the river, and Stharbuzanai, and their counsellors: and said thus to them: Who hath given you counsel to build this house, and to repair the walls thereof?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ad quod respondimus eis quae essent nomina hominum auctorum illius aedificationis"
      en: "In answer to which we gave them the names of the men who were the promoters of that building."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "oculus autem Dei eorum factus est super senes Iudaeorum et non potuerunt inhibere eos placuitque ut res ad Darium referretur et tunc satisfacerent adversus accusationem illam"
      en: "But the eye of their God was upon the ancients of the Jews, and they could not hinder them. And it was agreed that the matter should be referred to Darius, and then they should give satisfaction concerning that accusation."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "exemplar epistulae quam misit Tatannai dux regionis trans Flumen et Starbuzannai et consiliatores eius Apharsacei qui erant trans Flumen ad Darium regem"
      en: "The copy of the letter that Thathanai governor of the country beyond the river, and Stharbuzanai, and his counsellors the Arphasachites, who dwelt beyond the river, sent to Darius the king."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sermo quem miserant ei sic scriptus erat Dario regi pax omnis"
      en: "The letter which they sent him, was written thus: To Darius the king all peace."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "notum sit regi isse nos ad Iudaeam provinciam ad domum Dei magni quae aedificatur lapide inpolito et ligna ponuntur in parietibus opusque illud diligenter extruitur et crescit in manibus eorum"
      en: "Be it known to the king, that we went to the province of Judea, to the house of the great God, which they are building with unpolished stones, and timber is laid in the walls: and this work is carried on diligently, and advanceth in their hands."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "interrogavimus ergo senes illos et ita diximus eis quis dedit vobis potestatem ut domum hanc aedificaretis et muros instauraretis"
      en: "And we asked those ancients, and said to them thus: Who hath given you authority to build this house, and to repair these walls?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sed et nomina eorum quaesivimus ab eis ut nuntiaremus tibi quae scripsimus nomina virorum qui sunt principes in eis"
      en: "We asked also of them their names, that we might give thee notice: and we have written the names of the men that are the chief among them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "huiuscemodi autem sermonem responderunt nobis dicentes nos sumus servi Dei caeli et terrae et aedificamus templum quod erat extructum ante hos annos multos quodque rex Israhel magnus aedificaverat et extruxerat"
      en: "And they answered us in these words, saying: We are the servants of the God of heaven and earth, and we are building a temple that was built these many years ago, and which a great king of Israel built and set up."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "postquam autem ad iracundiam provocaverunt patres nostri Deum caeli et tradidit eos in manu Nabuchodonosor regis Babylonis Chaldei domum quoque hanc destruxit et populum eius transtulit in Babylonem"
      en: "But after that our fathers had provoked the God of heaven to wrath, he delivered them into the hands of Nabuchodonosor the king of Babylon the Chaldean: and he destroyed this house, and carried away the people to Babylon."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "anno autem primo Cyri regis Babylonis Cyrus rex proposuit edictum ut domus Dei aedificaretur"
      en: "But in the first year of Cyrus the king of Babylon, king Cyrus set forth al decree, that this house of God should be built."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nam et vasa templi Dei aurea et argentea quae Nabuchodonosor tulerat de templo quod erat in Hierusalem et asportaverat ea in templum Babylonis protulit Cyrus rex de templo Babylonis et data sunt Sasabassar vocabulo quem et principem constituit"
      en: "And the vessels also of gold and silver of the temple of God, which Nabuchodonosor had taken out of the temple, that was in Jerusalem, and had brought them to the temple of Babylon, king Cyrus brought out of the temple of Babylon, and they were delivered to one Sassabasar, whom also he appointed governor,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixitque ei haec vasa tolle et vade et pone ea in templo quod est in Hierusalem et domus Dei aedificetur in loco suo"
      en: "And said to him: Take these vessels, and go, and put them in the temple that is in Jerusalem, and let the house of God be built in its place."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tunc itaque Sasabassar ille venit et posuit fundamenta templi Dei in Hierusalem et ex eo tempore usque nunc aedificatur et necdum conpletum est"
      en: "Then came this same Sassabasar, and laid the foundations of the temple of God in Jerusalem, and from that time until now it is in building, and is not yet finished."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nunc ergo si videtur regi bonum recenseat in bibliotheca regis quae est in Babylone utrumnam a Cyro rege iussum sit ut aedificaretur domus Dei in Hierusalem et voluntatem regis super hac re mittat ad nos"
      en: "Now therefore if it seem good to the king, let him search in the king's library, which is in Babylon, whether it hath been decreed by Cyrus the king, that the house of God in Jerusalem should be built, and let the king send his pleasure to us concerning this matter."
    status: { la: verified, en: verified }
