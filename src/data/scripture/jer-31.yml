# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 31
verses:
  - n: 1
    text:
      la: "in tempore illo dicit Dominus ero Deus universis cognationibus Israhel et ipsi erunt mihi in populum"
      en: "At that time, saith the Lord, I will be the God of all the families of and they shall be my people."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec dicit Dominus invenit gratiam in deserto populus qui remanserat gladio vadet ad requiem suam Israhel"
      en: "Thus saith the Lord: The people were left and escaped from the sword, found grace in the desert: Israel shall to his rest."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "longe Dominus apparuit mihi et in caritate perpetua dilexi te ideo adtraxi te miserans"
      en: "The Lord hath appeared from afar to me. Yea I have loved thee with everlasting love, therefore have I drawn thee, taking pity on thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "rursumque aedificabo te et aedificaberis virgo Israhel adhuc ornaberis tympanis tuis et egredieris in choro ludentium"
      en: "And I will build thee again, and thou shalt be built, 0 virgin of Israel: thou shalt again be adorned with thy timbrels, and shalt go forth in the dances of them that make merry."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "adhuc plantabis vineas in montibus Samariae plantabunt plantantes et donec tempus veniat non vindemiabunt"
      en: "Thou shalt yet plant vineyards in the mountains of Samaria: the planters shall plant, and they shall not gather the vintage before the time."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia erit dies in qua clamabunt custodes in monte Ephraim surgite et ascendamus in Sion ad Dominum Deum nostrum"
      en: "For there shall be a day, in which the watchmen on mount Ephraim, shall cry: Arise, and let us go up to Sion to the Lord our God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia haec dicit Dominus exultate in laetitia Iacob et hinnite contra caput gentium personate canite et dicite salva Domine populum tuum reliquias Israhel"
      en: "For thus saith the Lord: Rejoice ye in the joy of Jacob, and neigh before the head of the Gentiles: shout ye, and sing, and say: Save, O Lord, thy people, the remnant of Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ecce ego adducam eos de terra aquilonis et congregabo eos ab extremis terrae inter quos erunt caecus et claudus et praegnans et pariens simul coetus magnus revertentium huc"
      en: "Behold I will bring them from the north country, and will gather them from the ends of the earth: and among them shall be the blind, and the lame, the woman with child, and she that is bringing forth, together, a great company of them returning hither."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in fletu venient et in precibus deducam eos et adducam eos per torrentes aquarum in via recta et non inpingent in ea quia factus sum Israheli pater et Ephraim primogenitus meus est"
      en: "They shall come with weeping: and I will bring them back in mercy: and I will bring them through the torrents of waters in a right way, and they shall not stumble in it: for I am a father to Israel, and Ephraim is my firstborn."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "audite verbum Domini gentes et adnuntiate insulis quae procul sunt et dicite qui dispersit Israhel congregabit eum et custodiet eum sicut pastor gregem suum"
      en: "Hear the word of the Lord, O ye nations, and declare it in the islands that are afar off, and say: He that scattered Israel will gather him: and he will keep him as the shepherd doth his flock."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "redemit enim Dominus Iacob et liberavit eum de manu potentioris"
      en: "For the Lord hath redeemed Jacob, and delivered him out of the hand of one that was mightier than he."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et venient et laudabunt in monte Sion et confluent ad bona Domini super frumento et vino et oleo et fetu pecorum et armentorum eritque anima eorum quasi hortus inriguus et ultra non esurient"
      en: "And they shall come, and shall give praise in mount Sion: and they shall flow together to the good things of the Lord, for the corn, and wine, and oil, and the increase of cattle and herds, and their soul shall be as a watered garden, and they shall be hungry no more."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tunc laetabitur virgo in choro iuvenes et senes simul et convertam luctum eorum in gaudium et consolabor eos et laetificabo a dolore suo"
      en: "Then shall the virgin rejoice in the dance, the young men and old men together: and I will turn their mourning into joy, and will comfort them, and make them joyful after their sorrow."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et inebriabo animam sacerdotum pinguedine et populus meus bonis meis adimplebitur ait Dominus"
      en: "And I will fill the soul of the priests with fatness: and my people shall be filled with my good things, saith the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "haec dicit Dominus vox in excelso audita est lamentationis fletus et luctus Rachel plorantis filios suos et nolentis consolari super eis quia non sunt"
      en: "Thus saith the Lord: A voice was heard on high of lamentation, of mourning, and weeping, of Rachel weeping for her children, and refusing to be comforted for them, because they are not."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "haec dicit Dominus quiescat vox tua a ploratu et oculi tui a lacrimis quia est merces operi tuo ait Dominus et revertentur de terra inimici"
      en: "Thus saith the Lord: Let thy voice cease from weeping, and thy eyes from tears: for there is a reward for thy work, saith the Lord: and they shall return out of the land of the enemy."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et est spes novissimis tuis ait Dominus et revertentur filii ad terminos suos"
      en: "And here is hope for thy last end, saith the Lord: and the children shall return to their own borders."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "audiens audivi Ephraim transmigrantem castigasti me et eruditus sum quasi iuvenculus indomitus converte me et revertar quia tu Dominus Deus meus"
      en: "Hearing I heard Ephraim when he went into captivity: thou hast chastised me, and I was instructed, as a young bullock unaccustomed to the yoke. Convert me, and I shall be converted, for thou art the Lord my God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "postquam enim convertisti me egi paenitentiam et postquam ostendisti mihi percussi femur meum confusus sum et erubui quoniam sustinui obprobrium adulescentiae meae"
      en: "For after thou didst convert me, I did penance: and after thou didst shew unto me, I struck my thigh: I am confounded and ashamed, because I have borne the reproach of my youth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "si filius honorabilis mihi Ephraim si puer delicatus quia ex quo locutus sum de eo adhuc recordabor eius idcirco conturbata sunt viscera mea super eum miserans miserebor eius ait Dominus"
      en: "Surely Ephraim is an honourable son to me, surely he is a tender child: for since I spoke of him, I will still remember him. Therefore are my bowels troubled for him: pitying I will pity him, saith the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "statue tibi speculam pone tibi amaritudines dirige cor tuum in viam directam in qua ambulasti revertere virgo Israhel revertere ad civitates tuas istas"
      en: "Set thee up a watchtower, make to thee bitterness: direct thy heart into the right way, wherein thou hast walked: return, O virgin of Israel, return to these thy cities."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "usquequo deliciis dissolveris filia vaga quia creavit Dominus novum super terram femina circumdabit virum"
      en: "How long wilt thou be dissolute in deliciousness, O wandering daughter? for the Lord hath created a new thing upon the earth: A WOMAN SHALL COMPASS A MAN."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "haec dicit Dominus exercituum Deus Israhel adhuc dicent verbum istud in terra Iuda et in urbibus eius cum convertero captivitatem eorum benedicat tibi Dominus pulchritudo iustitiae mons sanctus"
      en: "Thus saith the Lord of hosts, the God of Israel: As yet shall they say this word in the land of Juda, and in the cities thereof, when I shall bring back their captivity: The Lord bless thee, the beauty of justice, the holy mountain."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et habitabunt in eo Iudas et omnes civitates eius simul agricolae et minantes greges"
      en: "And Juda and all his cities shall dwell therein together: the husbandmen and they that drive the docks."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quia inebriavi animam lassam et omnem animam esurientem saturavi"
      en: "For I have inebriated the weary soul: and I have filled every hungry soul."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ideo quasi de somno suscitatus sum et vidi et somnus meus dulcis mihi"
      en: "Upon this I was as it were awaked out of a sleep, and I saw, and my sleep was sweet to me."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ecce dies veniunt dicit Dominus et seminabo domum Israhel et domum Iuda semine hominis et semine iumentorum"
      en: "Behold the days come, saith the Lord: and I will sow the house of Israel and the house of Juda with the seed of men, and with the seed of beasts."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et sicut vigilavi super eos ut evellerem et demolirer et dissiparem et disperderem et adfligerem sic vigilabo super eos ut aedificem et plantem ait Dominus"
      en: "And as I have watched over them, to pluck up, and to throw down, and to scatter, and destroy, and afflict: so will I watch over them, to build up, and to plant them, saith the Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "in diebus illis non dicent ultra patres comederunt uvam acerbam et dentes filiorum obstipuerunt"
      en: "In those days they shall say no more: The fathers have eaten a sour grape, and the teeth of the children are set on edge."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "sed unusquisque in iniquitate sua morietur omnis homo qui comederit uvam acerbam obstupescent dentes eius"
      en: "But every one shall die for his own iniquity: every man that shall eat the sour grape, his teeth shall be set on edge."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ecce dies veniunt dicit Dominus et feriam domui Israhel et domui Iuda foedus novum"
      en: "Behold the days shall come, saith the Lord, and I will make a new covenant with the house of Israel, and with the house of Juda:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "non secundum pactum quod pepigi cum patribus vestris in die qua adprehendi manum eorum ut educerem eos de terra Aegypti pactum quod irritum fecerunt et ego dominatus sum eorum dicit Dominus"
      en: "Not according to the covenant which I made with their fathers, in the day that I took them by the hand to bring them out of the land of Egypt: the covenant which they made void, and I had dominion over them, saith the Lord."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "sed hoc erit pactum quod feriam cum domo Israhel post dies illos dicit Dominus dabo legem meam in visceribus eorum et in corde eorum scribam eam et ero eis in Deum et ipsi erunt mihi in populum"
      en: "But this shall be the covenant that I will make with the house of Israel, after those days, saith the Lord: I will give my law in their bowels, and I will write it in their heart: and I will be their God, and they shall be my people."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et non docebunt ultra vir proximum suum et vir fratrem suum dicens cognoscite Dominum omnes enim cognoscent me a minimo eorum usque ad maximum ait Dominus quia propitiabor iniquitati eorum et peccati eorum non ero memor amplius"
      en: "And they shall teach no more every man his neighbour, and every man his brother, saying: Know the Lord: for all shall know me from the least of them even to the greatest, saith the Lord: for I will forgive their iniquity, and I will remember their sin no more."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "haec dicit Dominus qui dat solem in lumine diei ordinem lunae et stellarum in lumine noctis qui turbat mare et sonant fluctus eius Dominus exercituum nomen illi"
      en: "Thus saith the Lord, who giveth the sun for the light of the day, the order of the moon and of the stars, for the light of the night: who stirreth up the sea, and the waves thereof roar, the Lord of hosts is his name."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "si defecerint leges istae coram me dicit Dominus tunc et semen Israhel deficiet ut non sit gens coram me cunctis diebus"
      en: "If these ordinances shall fail before me, saith the Lord: then also the seed of Israel shall fail, so as not to be a nation before me for ever."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "haec dicit Dominus si mensurari potuerint caeli sursum et investigari fundamenta terrae deorsum et ego abiciam universum semen Israhel propter omnia quae fecerunt dicit Dominus"
      en: "Thus saith the Lord: If the heavens above can be measured, and the foundations of the earth searched out beneath, I also will cast away all the seed of Israel, for all that they have done, saith the Lord."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "ecce dies veniunt dicit Dominus et aedificabitur civitas Domino a turre Ananehel usque ad portam Anguli"
      en: "Behold the days come, saith the Lord, that the city shall be built to the Lord from the tower of Hanameel even to the gate of the corner."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et exibit ultra norma mensurae in conspectu eius super collem Gareb et circuibit Goatha"
      en: "And the measuring line shall go out farther in his sight upon the hill Gareb: and it shall compass Goatha,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et omnem vallem cadaverum et cineris et universam regionem mortis usque ad torrentem Cedron et usque ad angulum portae Equorum orientalis sanctum Domini non evelletur et non destruetur ultra in perpetuum"
      en: "And the whole valley of dead bodies and of ashes, and all the country of death, even to the torrent Cedron, and the corner of the horse gate towards the east, the Holy of the Lord: it shall not be plucked up, and it shall not be destroyed any more for ever."
    status: { la: verified, en: verified }
