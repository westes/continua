book: 1reg
chapter: 1
verses:
  - n: 1
    text:
      la: "fuit vir unus de Ramathaimsophim de monte Ephraim et nomen eius Helcana filius Hieroam filii Heliu filii Thau filii Suph Ephratheus"
      en: "There was a man of Ramathaimsophim, of mount Ephraim, and his name was Elcana, the son of Jeroham, the son of Eliu, the son of Thohu, the son of Suph, an Ephraimite:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et habuit duas uxores nomen uni Anna et nomen secundae Fenenna fueruntque Fenennae filii Annae autem non erant liberi"
      en: "And he had two wives, the name of one was Anna, and the name of the other Phenenna. Phenenna had children: but Anna had no children."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ascendebat vir ille de civitate sua statutis diebus ut adoraret et sacrificaret Domino exercituum in Silo erant autem ibi duo filii Heli Ofni et Finees sacerdotes Domini"
      en: "And this man went up out of his city upon the appointed days, to adore and to offer sacrifice to the Lord of hosts in Silo. And the two sons of Heli, Ophni and Phinees, were there priests of the Lord."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "venit ergo dies et immolavit Helcana deditque Fenennae uxori suae et cunctis filiis eius et filiabus partes"
      en: "Now the day came, and Elcana offered sacrifice, and gave to Phenenna his wife, and to all her sons and daughters, portions:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Annae autem dedit partem unam tristis quia Annam diligebat Dominus autem concluserat vulvam eius"
      en: "But to Anna he gave one portion with sorrow, because he loved Anna. And the Lord had shut up her womb."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "adfligebat quoque eam aemula eius et vehementer angebat in tantum ut exprobraret quod conclusisset Dominus vulvam eius"
      en: "Her rival also afflicted her, and troubled her exceedingly, insomuch that she upbraided her, that the Lord had shut up her womb:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sicque faciebat per singulos annos cum redeunte tempore ascenderent templum Domini et sic provocabat eam porro illa flebat et non capiebat cibum"
      en: "And thus she did every year, when the time returned that they went up to the temple of the Lord: and thus she provoked her: but Anna wept, and did not eat."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixit ergo ei Helcana vir suus Anna cur fles et quare non comedis et quam ob rem adfligitur cor tuum numquid non ego melior sum tibi quam decem filii"
      en: "Then Elcana her husband said to her: Anna, why weepest thou? and why dost thou not eat? And why dost thou afflict thy heart? Am not I better to thee than ten children?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "surrexit autem Anna postquam comederat in Silo et biberat et Heli sacerdote sedente super sellam ante postes templi Domini"
      en: "So Anna arose after she had eaten and drunk in Silo: And Heli the priest sitting upon a stool, before the door of the temple of the Lord:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cum esset amaro animo oravit Dominum flens largiter"
      en: "As Anna had her heart full of grief, she prayed to the Lord, shedding many tears,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et votum vovit dicens Domine exercituum si respiciens videris adflictionem famulae tuae et recordatus mei fueris nec oblitus ancillae tuae dederisque servae tuae sexum virilem dabo eum Domino omnes dies vitae eius et novacula non ascendet super caput eius"
      en: "And she made a vow, saying: O Lord, of hosts, if thou wilt look down on the affliction of thy servant, and wilt be mindful of me, and not forget thy handmaid, and wilt give to thy servant a man child: I will give him to the Lord all the days of his life, and no razor shall come upon his head."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "factum est ergo cum illa multiplicaret preces coram Domino ut Heli observaret os eius"
      en: "And it came to pass, as she multiplied prayers before the Lord, that Heli observed her mouth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "porro Anna loquebatur in corde suo tantumque labia illius movebantur et vox penitus non audiebatur aestimavit igitur eam Heli temulentam"
      en: "Now Anna spoke in her heart, and only her lips moved, but her voice was not heard at all. Heli therefore thought her to be drunk,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dixitque ei usquequo ebria eris digere paulisper vinum quo mades"
      en: "And said to her: How long wilt thou, be drunk? digest a little the wine, of which thou hast taken too much."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "respondens Anna nequaquam inquit domine mi nam mulier infelix nimis ego sum vinumque et omne quod inebriare potest non bibi sed effudi animam meam in conspectu Domini"
      en: "Anna answering, said: Not so, my lord: for I am an exceeding unhappy woman, and have drunk neither wine nor any strong drink, but I have poured out my soul before the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ne reputes ancillam tuam quasi unam de filiabus Belial quia ex multitudine doloris et maeroris mei locuta sum usque in praesens"
      en: "Count not thy handmaid for one of the daughters of Belial: for out of the abundance of my sorrow and grief have I spoken till now."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "tunc Heli ait ei vade in pace et Deus Israhel det tibi petitionem quam rogasti eum"
      en: "Then Heli said to her: Go in peace: and the God of Israel grant thee thy petition, which thou hast asked of him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et illa dixit utinam inveniat ancilla tua gratiam in oculis tuis et abiit mulier in viam suam et comedit vultusque eius non sunt amplius in diversa mutati"
      en: "And she said: Would to God thy handmaid may find grace in thy eyes. So the woman went on her way, and ate, and her countenance was no more changed."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et surrexerunt mane et adoraverunt coram Domino reversique sunt et venerunt in domum suam Ramatha cognovit autem Helcana Annam uxorem suam et recordatus est eius Dominus"
      en: "And they rose in the morning, and worshipped before the Lord: and they returned, and came into their house at Ramatha. And Elcana knew Anna his wife: and the Lord remembered her."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et factum est post circulum dierum concepit Anna et peperit filium vocavitque nomen eius Samuhel eo quod a Domino postulasset eum"
      en: "And it came to pass when the time was come about, Anna conceived and bore a son, and called his name Samuel: because she had asked him of the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ascendit autem vir Helcana et omnis domus eius ut immolaret Domino hostiam sollemnem et votum suum"
      en: "And Elcana her husband went up, and all his house, to offer to the Lord the solemn sacrifice, and his vow."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et Anna non ascendit dixit enim viro suo non vadam donec ablactetur infans et ducam eum et appareat ante conspectum Domini et maneat ibi iugiter"
      en: "But Anna went not up: for she said to her husband: I will not go till the child be weaned, and till I may carry him, that he may appear before the Lord, and may abide always there."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et ait ei Helcana vir suus fac quod bonum tibi videtur et mane donec ablactes eum precorque ut impleat Dominus verbum suum mansit ergo mulier et lactavit filium suum donec amoveret eum a lacte"
      en: "And Elcana her husband said to her: Do what seemeth good to thee, and stay till thou wean him: and I pray that the Lord may fulfil his word. So the woman stayed at home, and gave her son suck, till she weaned him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et adduxit eum secum postquam ablactaverat in vitulis tribus et tribus modiis farinae et amphora vini et adduxit eum ad domum Domini in Silo puer autem erat adhuc infantulus"
      en: "And after she had weaned him, she carried him with her, with three calves, and three bushels of flour, and a bottle of wine, and she brought him to the house of the Lord in Silo. Now the child was as yet very young:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et immolaverunt vitulum et obtulerunt puerum Heli"
      en: "And they immolated a calf, and offered the child to Heli."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ait obsecro mi domine vivit anima tua domine ego sum illa mulier quae steti coram te hic orans Dominum"
      en: "And Anna said: I beseech thee, my lord, as thy soul liveth, my lord: I am that woman who stood before thee here praying to the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "pro puero isto oravi et dedit Dominus mihi petitionem meam quam postulavi eum"
      en: "For this child did I pray, and the Lord hath granted me my petition, which I asked of him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "idcirco et ego commodavi eum Domino cunctis diebus quibus fuerit accommodatus Domino et adoraverunt ibi Dominum et oravit Anna et ait"
      en: "Therefore I also have lent him to the Lord all the days of his life, he shall be lent to the Lord. And they adored the Lord there. And Anna prayed, and said:"
    status: { la: verified, en: verified }
