# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 13
verses:
  - n: 1
    text:
      la: "filius sapiens doctrina patris qui autem inlusor est non audit cum arguitur"
      en: "A wise son heareth the doctrine of his father: but he that is a scorner, beareth not when he is reproved."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "de fructu oris homo saturabitur bonis anima autem praevaricatorum iniqua"
      en: "Of the fruit of his own mouth shall a man be filled with good things: but the soul of transgressors is wicked."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui custodit os suum custodit animam suam qui autem inconsideratus est ad loquendum sentiet mala"
      en: "He that keepeth his mouth, keepeth his soul: but he that hath no guard on his speech shall meet with evils."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "vult et non vult piger anima autem operantium inpinguabitur"
      en: "The sluggard willeth and willeth not: but the soul of them that work, shall be made fat."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "verbum mendax iustus detestabitur impius confundit et confundetur"
      en: "The just shall hate a lying word: but the wicked confoundeth, and shall be confounded."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "iustitia custodit innocentis viam impietas vero peccato subplantat"
      en: "Justice keepeth the way of the innocent: but wickedness overthroweth the sinner."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "est quasi dives cum nihil habeat et est quasi pauper cum in multis divitiis sit"
      en: "One is as it were rich, when he hath nothing: and another is as it were poor, when he hath great riches."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "redemptio animae viri divitiae suae qui autem pauper est increpationem non sustinet"
      en: "The ransom of a man's life are his riches: but he that is poor beareth not reprehension."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "lux iustorum laetificat lucerna autem impiorum extinguetur"
      en: "The light of the just giveth joy: but the lamp of the wicked shall be put out."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "inter superbos semper iurgia sunt qui autem agunt cuncta consilio reguntur sapientia"
      en: "Among the proud there are always contentions: but they that do all things with counsel, are ruled by wisdom."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "substantia festinata minuetur quae autem paulatim colligitur manu multiplicabitur"
      en: "Substance got in haste shall be diminished: but that which by little and little is gathered with the hand shall increase."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "spes quae differtur adfligit animam lignum vitae desiderium veniens"
      en: "Hope that is deferred afflicteth the soul: desire when it cometh is a tree of life."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui detrahit alicui rei ipse se in futurum obligat qui autem timet praeceptum in pace versabitur"
      en: "Whosoever speaketh ill of any thing, bindeth himself for the time to come: but he that feareth the commandment, shall dwell in peace. Deceitful souls go astray in sins: the just are merciful, and shew mercy."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "lex sapientis fons vitae ut declinet a ruina mortis"
      en: "The law of the wise is a fountain of life, that he may decline from the ruin of death."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "doctrina bona dabit gratiam in itinere contemptorum vorago"
      en: "Good instruction shall give grace: in the way of scorners is a deep pit."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "astutus omnia agit cum consilio qui autem fatuus est aperit stultitiam"
      en: "The prudent mall doth all things with counsel: but he that is a fool, layeth open his folly."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nuntius impii cadet in malum legatus fidelis sanitas"
      en: "The messenger of the wicked shall fall into mischief: but a faithful ambassador is health."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "egestas et ignominia ei qui deserit disciplinam qui autem adquiescit arguenti glorificabitur"
      en: "Poverty and shame to him that refuseth instruction: but he that yieldeth to reproof, shall be glorified."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "desiderium si conpleatur delectat animam detestantur stulti eos qui fugiunt mala"
      en: "The desire that is accomplished, delighteth the soul: fools hate them that flee from evil things."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui cum sapientibus graditur sapiens erit amicus stultorum efficietur similis"
      en: "He that walketh with the wise, shall be wise: a friend of fools shall become like to them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "peccatores persequetur malum et iustis retribuentur bona"
      en: "21Evil pursueth sinners: and to the just good shall be repaid."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "bonus relinquet heredes filios et nepotes et custoditur iusto substantia peccatoris"
      en: "The good man leaveth heirs, sons, and grandsons: and the substance of the sinner is kept for the just."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "multi cibi in novalibus patrum et alii congregantur absque iudicio"
      en: "Much food is in the tillage of fathers: but for others it is gathered with out judgment."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui parcit virgae suae odit filium suum qui autem diligit illum instanter erudit"
      en: "He that spareth the rod hateth his son: but he that loveth him correcteth him betimes."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "iustus comedit et replet animam suam venter autem impiorum insaturabilis"
      en: "The just eateth and filleth his soul: but the belly of the wicked is never to be filled."
    status: { la: verified, en: verified }
