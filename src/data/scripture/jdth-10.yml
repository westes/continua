# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 10
verses:
  - n: 1
    text:
      la: "factum est autem cum cessasset clamare ad Dominum surrexit de loco quo iacuerat prostrata Domino"
      en: "And it came to pass, when she had ceased to cry to the Lord, that she rose from the place wherein she lay prostrate before the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "vocavitque abram suam et descendens in domum suam abstulit a se cilicium et exuit se vestimentis viduitatis suae"
      en: "And she called her maid, and going down into her house she took off her haircloth, and put away the garments of her widowhood,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et lavit corpus suum et unxit se myrro optimo et discriminavit crinem capitis sui et inposuit mitram super caput suum et induit se vestimentis iucunditatis suae induitque sandalia pedibus suis adsumpsitque dextraliola et lilia et inaures et anulos et omnibus ornamentis suis ornavit se"
      en: "And she washed her body, and anointed herself with the best ointment, and plaited the hair of her head, and put a bonnet upon her head, and clothed herself with the garments of her gladness, and put sandals on her feet, and took her bracelets, and lilies, and earlets, and rings, and adorned herself with all her ornaments."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cui etiam Dominus contulit splendorem quoniam omnis ista conpositio non ex libidine sed ex virtute pendebat et ideo Dominus hanc in illam pulchritudinem ampliavit ut inconparabili decore omnium oculis appareret"
      en: "And the Lord also gave her more beauty: because all this dressing up did not proceed from sensuality, lent from virtue: and therefore the Lord increased this her beauty, so that she appeared to all men's eyes incomparably lovely."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "inposuit itaque abrae suae ascopam vini et vas olei et pulenta et palatas et panes et caseum et profecta est"
      en: "And she gave to her maid a bottle of wine to carry, and a vessel of oil, and parched corn, and dry figs, and bread and cheese, and went out."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cumque venisset ad portas civitatis invenerunt expectantem Oziam et presbyteros civitatis"
      en: "And when they came to the gate of the city, they found Ozias, and the ancients of the city waiting."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui cum vidissent eam stupentes mirati sunt nimis pulchritudinem eius"
      en: "And when they saw her they were astonished, and admired her beauty exceedingly."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nihil tamen interrogantes eam dimiserunt transire dicentes Deus patrum nostrorum det tibi gratiam et omne consilium tui cordis sua virtute corroboret ut glorietur super te Hierusalem et sit nomen tuum in numero sanctorum et iustorum"
      en: "But they asked her no question, only they let her pass, saying: The God of our fathers give thee grace, and may he strengthen all the counsel of thy heart with his power, that Jerusalem may glory in thee, and thy name may be in the number of the holy and just."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixerunt hii qui illic erant omnes una voce fiat fiat"
      en: "And they that were there said, all with one voice: So be it, so be it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Iudith vero orans Dominum transiit portas ipsa et abra eius"
      en: "But Judith praying to the Lord, passed through the gates, she and her maid."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "factum est autem cum descenderet montem circa ortum diei occurrerunt ei exploratores Assyriorum et tenuerunt illam dicentes unde venis aut quo vadis"
      en: "And it came to pass, when she went down the hill, about break of day, that the watchmen of the Assyrians met her and stopped her, saying: Whence comest thou? or whither goest thou?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quae respondit filia sum Hebraeorum ideo ego fugi a facie eorum quoniam futurum agnovi quod dentur vobis in depraedationem pro eo quod contemnentes vos noluerunt ultro tradere se ipsos ut invenirent misericordiam in conspectu vestro"
      en: "And she answered: I am a daughter of the Hebrews, and I am fled from them, because I knew they would be made a prey to you, because they despised you, and would not of their own accord yield themselves, that they might find mercy in your sight."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "hac de causa cogitavi mecum dicens vadam ad faciem principis Holofernis ut indicem illi secreta illorum et ostendam illi quo aditu possit obtinere eos ita ut non cadat unus vir de exercitu eius"
      en: "For this reason I thought with myself, saying: I will go to the presence of the prince Holofernes, that I may tell him their secrets, and shew him by what way he may take them, without the loss of one man of his army."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et cum audissent viri verba eius considerabant faciem eius et erat in oculis eorum stupor quoniam mirabantur pulchritudinem eius nimis"
      en: "And when the men had heard her words, they beheld her face, and their eyes were amazed, for they wondered exceedingly at her beauty."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dixerunt ad eam conservasti animam tuam eo quod tale repperisti consilium ut descenderes ad dominum nostrum"
      en: "And they said to her: Thou hast saved thy life by taking this resolution, to come down to our lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hoc autem scias quoniam cum steteris in conspectu eius bene tibi faciet et eris gratissima in corde eius duxeruntque illam ad tabernaculum Holofernis et nuntiantes eam"
      en: "And be assured of this, that when thou shalt stand before him, he will treat thee well, and thou wilt be most acceptable to his heart. And they brought her to the tent of Holofernes, telling him of her."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cumque intrasset ante faciem eius statim captus est in suis oculis Holofernis"
      en: "And when she was come into his presence, forthwith Holofernes was caught by his eyes."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixeruntque ad eum satellites eius quis contemnat populum Hebraeorum qui tam decoras mulieres habent ut non pro his merito pugnare contra eos debeamus"
      en: "And his officers said to him: Who can despise the people of the Hebrews who have such beautiful women, that we should not think it worth our while for their sakes to fight against them?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "videns itaque Holofernem Iudith sedentem in conopeo quod erat ex purpura et auro et zmaragdo et lapidibus pretiosis intextum"
      en: "And Judith seeing Holofernes sitting under a canopy, which was woven of purple and gold, with emeralds and precious stones:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et cum in faciem eius intendisset adoravit eum prosternens se super terram et levaverunt illam servi Holofernis iubente domino suo"
      en: "After she had looked on his face bowed down to him, prostrating herself to the ground. And the servants of Holofernes lifted her up, by the command of their master."
    status: { la: verified, en: verified }
