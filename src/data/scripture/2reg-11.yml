# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2reg
chapter: 11
verses:
  - n: 1
    text:
      la: "factum est ergo vertente anno eo tempore quo solent reges ad bella procedere misit David Ioab et servos suos cum eo et universum Israhel et vastaverunt filios Ammon et obsederunt Rabba David autem remansit in Hierusalem"
      en: "And it came to pass at the return of the year, at the time when kings go forth to war, that David sent Joab and his servants with him, and all Israel, and they spoiled the children of Ammon, and besieged Rabba: but David remained in Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dum haec agerentur accidit ut surgeret David de stratu suo post meridiem et deambularet in solario domus regiae viditque mulierem se lavantem ex adverso super solarium suum erat autem mulier pulchra valde"
      en: "In the mean time it happened that David arose from his bed after noon, and walked upon the roof of the king's house: and he saw from the roof of his house a woman washing herself, over against him: and the woman was very beautiful."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "misit ergo rex et requisivit quae esset mulier nuntiatumque ei est quod ipsa esset Bethsabee filia Heliam uxor Uriae Hetthei"
      en: "And the king sent, and inquired who the woman was. And it was told him, that she was Bethsabee the daughter of Eliam, the wife of Urias the Hethite."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "missis itaque David nuntiis tulit eam quae cum ingressa esset ad illum dormivit cum ea statimque sanctificata est ab inmunditia sua"
      en: "And David sent messengers, and took her, and she came in to him, and he slept with her: and presently she was purified from her uncleanness:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et reversa est domum suam concepto fetu mittensque nuntiavit David et ait concepi"
      en: "And she returned to her house having conceived. And she sent and told David, and said: I have conceived."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "misit autem David ad Ioab dicens mitte ad me Uriam Hettheum misitque Ioab Uriam ad David"
      en: "And David sent to Joab, saying: Send me Urias the Hethite. And Joab sent Urias to David."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et venit Urias ad David quaesivitque David quam recte ageret Ioab et populus et quomodo administraretur bellum"
      en: "And Urias came to David. And David asked how Joab did, and the people, and how the war was carried on."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et dixit David ad Uriam vade in domum tuam et lava pedes tuos egressus est Urias de domo regis secutusque est eum cibus regius"
      en: "And David said to Urias: Go into thy house, and wash thy feet. And Urias went out from the king's house, and there went out after him a mess of meat from the king."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dormivit autem Urias ante portam domus regiae cum aliis servis domini sui et non descendit ad domum suam"
      en: "But Urias slept before the gate of the king's house, with the other servants of his lord, and went not down to his own house."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "nuntiatumque est David a dicentibus non ivit Urias ad domum suam et ait David ad Uriam numquid non de via venisti quare non descendisti ad domum tuam"
      en: "And it was told David by some that said: Urias went not to his house. And David said to Urias: Didst thou not come from thy journey? why didst thou not go down to thy house?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ait Urias ad David arca et Israhel et Iuda habitant in papilionibus et dominus meus Ioab et servi domini mei super faciem terrae manent et ego ingrediar domum meam ut comedam et bibam et dormiam cum uxore mea per salutem tuam et per salutem animae tuae quod non faciam rem hanc"
      en: "And Urias said to David: The ark of God and Israel and Juda dwell in tents, and my lord Joab and the servants of my lord abide upon the face of the earth: and shall I go into my house, to eat and to drink, and to sleep with my wife? By thy welfare and by the welfare of thy soul I will not do this thing."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ait ergo David ad Uriam mane hic etiam hodie et cras dimittam te mansit Urias in Hierusalem die illa et altera"
      en: "Then David said to Urias: Tarry here to day, and to morrow I will send thee away. Urias tarried in Jerusalem that day and the next."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et vocavit eum David ut comederet coram se et biberet et inebriavit eum qui egressus vespere dormivit in stratu suo cum servis domini sui et in domum suam non descendit"
      en: "And David called him to eat and to drink before him, and he made him drunk: and he went out in the evening, and slept on his couch with the servants of his lord, and went not down into his house."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "factum est ergo mane et scripsit David epistulam ad Ioab misitque per manum Uriae"
      en: "And when the morning was come, David wrote a letter to Joab: and sent it by the hand of Urias,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "scribens in epistula ponite Uriam ex adverso belli ubi fortissimum proelium est et derelinquite eum ut percussus intereat"
      en: "Writing in the letter: Set ye Urias in the front of the battle, where the fight is strongest: and leave ye him, that he may be wounded and die."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "igitur cum Ioab obsideret urbem posuit Uriam in loco quo sciebat viros esse fortissimos"
      en: "Wherefore as Joab was besieging the city, he put Urias in the place where he knew the bravest men were."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "egressique viri de civitate bellabant adversum Ioab et ceciderunt de populo servorum David et mortuus est etiam Urias Hettheus"
      en: "And the men coming out of the city, fought against Joab, and there fell some of the people of the servants of David, and Urias the Hethite was killed also."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "misit itaque Ioab et nuntiavit David omnia verba proelii"
      en: "Then Joab sent, and told David all things concerning the battle."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "praecepitque nuntio dicens cum conpleveris universos sermones belli ad regem"
      en: "And he charged the messenger, saying: When thou hast told all the words of the battle to the king,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "si eum videris indignari et dixerit quare accessistis ad murum ut proeliaremini an ignorabatis quod multa desuper ex muro tela mittantur"
      en: "If thou see him to be angry, and he shall say: Why did you approach so near to the wall to fight? knew you not that many darts are thrown from above off the wall?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quis percussit Abimelech filium Hieroboseth nonne mulier misit super eum fragmen molae de muro et interfecit eum in Thebes quare iuxta murum accessistis dices etiam servus tuus Urias Hettheus occubuit"
      en: "Who killed Abimelech the son of Jerobaal? did not a woman cast a piece of a millstone upon him from the wall, and slew him in Thebes? Why did you go near the wall? Thou shalt say: Thy servant Urias the Hethite is also slain."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "abiit ergo nuntius et venit et narravit David omnia quae ei praeceperat Ioab"
      en: "So the messenger departed, and came and told David all that Joab had commanded him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et dixit nuntius ad David praevaluerunt adversum nos viri et egressi sunt ad nos in agrum nos autem facto impetu persecuti eos sumus usque ad portam civitatis"
      en: "And the messenger said to David: The men prevailed against us, and they came out to us into the field: and we vigorously charged and pursued them even to the gate of the city."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et direxerunt iacula sagittarii ad servos tuos ex muro desuper mortuique sunt de servis regis quin etiam servus tuus Urias Hettheus mortuus est"
      en: "And the archers shot their arrows at thy servants from off the wall above: and some of the king's servants are slain, and thy servant Urias the Hethite is also dead."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et dixit David ad nuntium haec dices Ioab non te frangat ista res varius enim eventus est proelii et nunc hunc nunc illum consumit gladius conforta bellatores tuos adversum urbem ut destruas eam et exhortare eos"
      en: "And David said to the messenger: Thus shalt thou say to Joab: Let not this thing discourage thee: for various is the event of war: and sometimes one, sometimes another is consumed by the sword: encourage thy warriors against The city, and exhort them that thou mayest overthrow it."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "audivit autem uxor Uriae quod mortuus esset Urias vir suus et planxit eum"
      en: "And the wife of Urias heard that Urias her husband was dead, and she mourned for him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "transactoque luctu misit David et introduxit eam domum suam et facta est ei uxor peperitque ei filium et displicuit verbum hoc quod fecerat David coram Domino"
      en: "And the mourning being over, David sent and brought her into his house, and she became his wife, and she bore him a son: and this thing which David had done, was displeasing to the Lord."
    status: { la: verified, en: verified }
