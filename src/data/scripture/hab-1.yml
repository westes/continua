# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: hab
chapter: 1
verses:
  - n: 1
    text:
      la: "onus quod vidit Abacuc propheta"
      en: "The burden that Habacuc the prophet saw."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "usquequo Domine clamabo et non exaudies vociferabor ad te vim patiens et non salvabis"
      en: "How long, O Lord, shall I cry, and thou wilt not hear? shall I cry out to thee suffering violence, and thou wilt not save?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quare ostendisti mihi iniquitatem et laborem videre praeda et iniustitia contra me et factum est iudicium et contradictio potentior"
      en: "Why hast thou shewn me iniquity and grievance, to see rapine and injustice before me? and there is a judgment, but opposition is more powerful."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "propter hoc lacerata est lex et non pervenit usque ad finem iudicium quia impius praevalet adversus iustum propterea egreditur iudicium perversum"
      en: "Therefore the law is torn in pieces, and judgment cometh not to the end: because the wicked prevaileth against the just, therefore wrong judgment goeth forth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "aspicite in gentibus et videte et admiramini et obstupescite quia opus factum est in diebus vestris quod nemo credet cum narrabitur"
      en: "Behold ye among the nations, and see: wonder, and be astonished: for a work is done in your days, which no man will believe when it shall be told."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia ecce ego suscitabo Chaldeos gentem amaram et velocem ambulantem super latitudinem terrae ut possideat tabernacula non sua"
      en: "For behold, I will raise up the Chaldeans, a bitter and swift nation, marching upon the breadth of the earth, to possess the dwelling places that are not their own."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "horribilis et terribilis est ex semet ipsa iudicium et onus eius egredietur"
      en: "They are dreadful, and terrible: from themselves shall their judgment, and their burden proceed."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "leviores pardis equi eius et velociores lupis vespertinis et diffundentur equites eius equites namque eius de longe venient volabunt quasi aquila festinans ad comedendum"
      en: "Their horses are lighter than leopards, and swifter than evening wolves; and their horsemen shall be spread abroad: for their horsemen shall come from afar, they shall fly as an eagle that maketh haste to eat."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "omnes ad praedam venient facies eorum ventus urens et congregabit quasi harenam captivitatem"
      en: "They shall all come to the prey, their face is like a burning wind: and they shall gather together captives as the sand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ipse de regibus triumphabit et tyranni ridiculi eius erunt ipse super omnem munitionem ridebit et conportabit aggerem et capiet eam"
      en: "And their prince shall triumph over kings, and princes shall be his laughingstock: and he shall laugh at every strong hold, and shall cast up a mount, and shall take it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "tunc mutabitur spiritus et pertransibit et corruet haec est fortitudo eius dei sui"
      en: "Then shall his spirit be changed, and he shall pass, and fall: this is his strength of his god."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "numquid non tu a principio Domine Deus meus Sancte meus et non moriemur Domine in iudicium posuisti eum et fortem ut corriperes fundasti eum"
      en: "Wast thou not from the beginning, O Lord my God, my holy one, and we shall not die? Lord, thou hast appointed him for judgment: and made him strong for correction."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "mundi sunt oculi tui ne videas malum et respicere ad iniquitatem non poteris quare non respicis super inique agentes et taces devorante impio iustiorem se"
      en: "Thy eyes are too pure to behold evil, and thou canst not look on iniquity. Why lookest thou upon them that do unjust things, and holdest thy peace when the wicked devoureth the man that is more just than himself?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et facies homines quasi pisces maris et quasi reptile non habens principem"
      en: "And thou wilt make men as the fishes of the sea, and as the creeping things that have no ruler."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "totum in hamo sublevavit traxit illud in sagena sua et congregavit in rete suo super hoc laetabitur et exultabit"
      en: "He lifted up all them with his hook, he drew them in his drag, and gathered them into his net: for this he will be glad and rejoice."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "propterea immolabit sagenae suae et sacrificabit reti suo quia in ipsis incrassata est pars eius et cibus eius electus"
      en: "Therefore will he offer victims to his drag, and he will sacrifice to his net: because through them his portion is made fat, and his meat dainty."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "propter hoc ergo expandit sagenam suam et semper interficere gentes non parcet"
      en: "For this cause therefore he spreadeth his net, and will not spare continually to slay the nations."
    status: { la: verified, en: verified }
