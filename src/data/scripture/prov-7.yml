# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 7
verses:
  - n: 1
    text:
      la: "Fili mi, custodi sermones meos, et praecepta mea reconde tibi."
      en: "My son, keep my words, and lay up my precepts with thee. Son,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili, serva mandata mea, et vives; et legem meam quasi pupillam oculi tui:"
      en: "Keep my commandments, and thou shalt live: and my law as the apple of thy eye:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "liga eam in digitis tuis, scribe illam in tabulis cordis tui."
      en: "Bind it upon thy fingers, write it upon the tables of thy heart."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dic sapientiae: Soror mea es, et prudentiam voca amicam tuam:"
      en: "Say to wisdom: Thou art my sister: and call prudence thy friend,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut custodiant te a muliere extranea, et ab aliena quae verba sua dulcis facit."
      en: "That she may keep thee from the woman that is not thine, and from the stranger who sweeteneth her words."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "De fenestra enim domus meae per cancellos prospexi,"
      en: "For I look out of the window of my house through the lattice,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et video parvulos; considero vecordem juvenem,"
      en: "And I see little ones, I behold a foolish young man,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui transit per plateam juxta angulum et prope viam domus illius graditur:"
      en: "Who passeth through the street by the corner, and goeth nigh the way of her house."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in obscuro, advesperascente die, in noctis tenebris et caligine."
      en: "In the dark, when it grows late, in the darkness and obscurity of the night,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ecce occurrit illi mulier ornatu meretricio, praeparata ad capiendas animas: garrula et vaga,"
      en: "And behold a woman meeteth him in harlot's attire prepared to deceive souls; talkative and wandering,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quietis impatiens, nec valens in domo consistere pedibus suis;"
      en: "Not bearing to be quiet, not able to abide still at home,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nunc foris, nunc in plateis, nunc juxta angulos insidians."
      en: "Now abroad, now in the streets, now lying in wait near the corners."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Apprehensumque deosculatur juvenem, et procaci vultu blanditur, dicens:"
      en: "And catching the young man, she kisseth him, and with an impudent face, flattereth, saying:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Victimas pro salute vovi, hodie reddidi vota mea;"
      en: "I vowed victims for prosperity, this day I have paid my vows."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "idcirco egressa sum in occursum tuum, desiderans te videre, et reperi."
      en: "Therefore I am come out to meet thee, desirous to see thee, and I have found thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Intexui funibus lectulum meum, stravi tapetibus pietis ex Aegypto;"
      en: "I have woven my bed with cords, I have covered it with painted tapestry, brought from Egypt."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "aspersi cubile meum myrrha, et aloe, et cinnamomo."
      en: "I have perfumed my bed with myrrh, aloes, and cinnamon."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Veni, inebriemur uberibus, et fruamur cupitis amplexibus donec illucescat dies."
      en: "Come, let us be inebriated with the breasts, and let us enjoy the desired embraces, till the day appear."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Non est enim vir in domo sua: abiit via longissima;"
      en: "For my husband is not at home, he is gone a very long journey."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sacculum pecuniae secum tulit; in die plenae lunae reversurus est in domum suam."
      en: "He took with him a bag of money: he will return home the day of the full moon."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Irretivit eum multis sermonibus, et blanditiis labiorum protraxit illum."
      en: "She entangled him with many words, and drew him away with the flattery of her lips."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Statim eam sequitur quasi bos ductus ad victimam, et quasi agnus lasciviens; et ignorans quod ad vincula stultus trahatur:"
      en: "Immediately he followeth her as an ox led to be a victim, and as a lamb playing the wanton, and not knowing that he is drawn like a fool to bonds,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "donec transfigat sagitta jecur ejus; velut si avis festinet ad laqueum, et nescit quod de periculo animae illius agitur."
      en: "Till the arrow pierce his liver: as if a bird should make haste to the snare, and knoweth not that his life is in danger."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Nunc ergo, fili mi, audi me, et attende verbis oris mei."
      en: "Now therefore, my son, hear me, and attend to the words of my mouth."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ne abstrahatur in viis illius mens tua, neque decipiaris semitis ejus;"
      en: "Let not thy mind be drawn away in her ways: neither be thou deceived with her paths."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "multos enim vulneratos dejecit, et fortissimi quique interfecti sunt ab ea."
      en: "For she hath cast down many wounded, and the strongest have been slain by her."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Viae inferi domus ejus, penetrantes in interiora mortis."
      en: "Her house is the way to hell, reaching even to the inner chambers of death."
    status: { la: verified, en: verified }
