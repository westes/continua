# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 14
verses:
  - n: 1
    text:
      la: "factum est autem in illo tempore ut Amrafel rex Sennaar et Arioch rex Ponti et Chodorlahomor rex Aelamitarum et Thadal rex Gentium"
      en: "And it came to pass at that time, that Amraphel king of Sennaar, and Arioch king of Pontus, and Chodorlahomor king of the Elamites, and Thadal king of nations,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "inirent bellum contra Bara regem Sodomorum et contra Bersa regem Gomorrae et contra Sennaab regem Adamae et contra Semeber regem Seboim contraque regem Balae ipsa est Segor"
      en: "Made war against Bara king of Sodom, and against Bersa king of Gomorrha, and against Sennaab king of Adama, and against Semeber king of Seboim, and against the king of Bala, which is Segor."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "omnes hii convenerunt in vallem Silvestrem quae nunc est mare Salis"
      en: "All these came together into the woodland vale, which now is the salt sea."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "duodecim enim annis servierant Chodorlahomor et tertiodecimo anno recesserunt ab eo"
      en: "For they had served Chodorlahomor twelve years, and in the thirteenth year they revolted from him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "igitur anno quartodecimo venit Chodorlahomor et reges qui erant cum eo percusseruntque Rafaim in Astharothcarnaim et Zuzim cum eis et Emim in Savecariathaim"
      en: "And in the fourteenth year came Chodorlahomor, and the kings that were with him: and they smote the Raphaim in Astarothcarnaim, and the Zuzim with them, and the Emim in Save of Cariathaim."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et Chorreos in montibus Seir usque ad campestria Pharan quae est in solitudine"
      en: "And the Chorreans in the mountains of Seir, even to the plains of Pharan, which is in the wilderness."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "reversique sunt et venerunt ad fontem Mesfat ipsa est Cades et percusserunt omnem regionem Amalechitarum et Amorreum qui habitabat in Asasonthamar"
      en: "And they returned, and came to the fountain of Misphat, the same is Cades: and they smote all the country of the Amalecites, and the Amorrhean that dwelt in Asasonthamar."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et egressi sunt rex Sodomorum et rex Gomorrae rexque Adamae et rex Seboim necnon et rex Balae quae est Segor et direxerunt contra eos aciem in valle Silvestri"
      en: "And the king of Sodom, and the king of Gomorrha, and the king of Adama, and the king of Seboim, and the king of Bala, which is Segor, went out: and they set themselves against them in battle array in the woodland vale:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "scilicet adversum Chodorlahomor regem Aelamitarum et Thadal regem Gentium et Amrafel regem Sennaar et Arioch regem Ponti quattuor reges adversus quinque"
      en: "To wit, against Chodorlahomor king of the Elamites, and Thadal king of nations, and Amraphel king of Sennaar, and Arioch king of Pontus: four kings against five."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vallis autem Silvestris habebat puteos multos bituminis itaque rex Sodomorum et Gomorrae terga verterunt cecideruntque ibi et qui remanserant fugerunt ad montem"
      en: "Now the woodland vale had many pits of slime. And the king of Sodom, and the king of Gomorrha turned their backs and were overthrown there: and they that remained fled to the mountain."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "tulerunt autem omnem substantiam Sodomorum et Gomorrae et universa quae ad cibum pertinent et abierunt"
      en: "And they took all the substance of the Sodomites, and Gomorrhites, and all their victuals, and went their way:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "necnon et Loth et substantiam eius filium fratris Abram qui habitabat in Sodomis"
      en: "And Lot also, the son of Abram's brother, who dwelt in Sodom, and his substance."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ecce unus qui evaserat nuntiavit Abram Hebraeo qui habitabat in convalle Mambre Amorrei fratris Eschol et fratris Aner hii enim pepigerant foedus cum Abram"
      en: "And behold one that had escaped told Abram the Hebrew, who dwelt in the vale of Mambre the Amorrhite, the brother of Escol, and the brother of Aner: for these had made league with Abram."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quod cum audisset Abram captum videlicet Loth fratrem suum numeravit expeditos vernaculos suos trecentos decem et octo et persecutus est eos usque Dan"
      en: "Which when Abram had heard, to wit, that his brother Lot was taken, he numbered of the servants born in his house, three hundred and eighteen well appointed: and pursued them to Dan."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et divisis sociis inruit super eos nocte percussitque eos et persecutus est usque Hoba quae est ad levam Damasci"
      en: "And dividing his company, he rushed upon them in the night: and defeated them, and pursued them as far as Hoba, which is on the left hand of Damascus."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "reduxitque omnem substantiam et Loth fratrem suum cum substantia illius mulieres quoque et populum"
      en: "And he brought back all the substance, and Lot his brother, with his substance, the women also the people."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "egressus est autem rex Sodomorum in occursum eius postquam reversus est a caede Chodorlahomor et regum qui cum eo erant in valle Save quae est vallis Regis"
      en: "And the king of Sodom went out to meet him, after he returned from the slaughter of Chodorlahomor, and of the kings that were with him in the vale of Save, which is the king's vale."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "at vero Melchisedech rex Salem proferens panem et vinum erat enim sacerdos Dei altissimi"
      en: "But Melchisedech the king of Salem, bringing forth bread and wine, for he was the priest of the most high God,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "benedixit ei et ait benedictus Abram Deo excelso qui creavit caelum et terram"
      en: "Blessed him, and said: Blessed be Abram by the most high God, who created heaven and earth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et benedictus Deus excelsus quo protegente hostes in manibus tuis sunt et dedit ei decimas ex omnibus"
      en: "And blessed be the most high God, by whose protection the enemies are in thy hands. And he gace him the tithes of all."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixit autem rex Sodomorum ad Abram da mihi animas cetera tolle tibi"
      en: "And the king of Sodom said to Abram: Give me the persons, and the rest take to thyself."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui respondit ei levo manum meam ad Dominum Deum excelsum possessorem caeli et terrae"
      en: "And he answered him: I lift up my hand to the Lord God the most high, the possessor of heaven and earth,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quod a filo subteminis usque ad corrigiam caligae non accipiam ex omnibus quae tua sunt ne dicas ego ditavi Abram"
      en: "That from the very woof thread unto the shoe latchet, I will not take of any things that are thine, lest thou say I have enriched Abram:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "exceptis his quae comederunt iuvenes et partibus virorum qui venerunt mecum Aner Eschol et Mambre isti accipient partes suas"
      en: "Except such things as the young men have eaten, and the shares of the men that came with me, Aner, Escol, and Mambre: these shall take their shares."
    status: { la: verified, en: verified }
