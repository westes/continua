# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: apoc
chapter: 4
verses:
  - n: 1
    text:
      la: "post haec vidi et ecce ostium apertum in caelo et vox prima quam audivi tamquam tubae loquentis mecum dicens ascende huc et ostendam tibi quae oportet fieri post haec"
      en: "After these things I looked, and behold a door was opened in heaven, and the first voice which I heard, as it were, of a trumpet speaking with me, said: Come up hither, and I will shew thee the things which must be done hereafter."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "statim fui in spiritu et ecce sedis posita erat in caelo et supra sedem sedens"
      en: "And immediately I was in the spirit: and behold there was a throne set in heaven, and upon the throne one sitting."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et qui sedebat similis erat aspectui lapidis iaspidis et sardini et iris erat in circuitu sedis similis visioni zmaragdinae"
      en: "And he that sat, was to the sight like the jasper and the sardine stone; and there was a rainbow round about the throne, in sight like unto an emerald."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et in circuitu sedis sedilia viginti quattuor et super thronos viginti quattuor seniores sedentes circumamictos vestimentis albis et in capitibus eorum coronas aureas"
      en: "And round about the throne were four and twenty seats; and upon the seats, four and twenty ancients sitting, clothed in white garments, and on their heads were crowns of gold."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et de throno procedunt fulgura et voces et tonitrua et septem lampades ardentes ante thronum quae sunt septem spiritus Dei"
      en: "And from the throne proceeded lightnings, and voices, and thunders; and there were seven lamps burning before the throne, which are the seven spirits of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et in conspectu sedis tamquam mare vitreum simile cristallo et in medio sedis et in circuitu sedis quattuor animalia plena oculis ante et retro"
      en: "And in the sight of the throne was, as it were, a sea of glass like to crystal; and in the midst of the throne, and round about the throne, were four living creatures, full of eyes before and behind."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et animal primum simile leoni et secundum animal simile vitulo et tertium animal habens faciem quasi hominis et quartum animal simile aquilae volanti"
      en: "And the first living creature was like a lion: and the second living creature like a calf: and the third living creature, having the face, as it were, of a man: and the fourth living creature was like an eagle flying."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et quattuor animalia singula eorum habebant alas senas et in circuitu et intus plena sunt oculis et requiem non habent die et nocte dicentia sanctus sanctus sanctus Dominus Deus omnipotens qui erat et qui est et qui venturus est"
      en: "And the four living creatures had each of them six wings; and round about and within they are full of eyes. And they rested not day and night, saying: Holy, holy, holy, Lord God Almighty, who was, and who is, and who is to come."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et cum darent illa animalia gloriam et honorem et benedictionem sedenti super thronum viventi in saecula saeculorum"
      en: "And when those living creatures gave glory, and honour, and benediction to him that sitteth on the throne, who liveth for ever and ever;"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "procident viginti quattuor seniores ante sedentem in throno et adorabunt viventem in saecula saeculorum et mittent coronas suas ante thronum dicentes"
      en: "The four and twenty ancients fell down before him that sitteth on the throne, and adored him that liveth for ever and ever, and cast their crowns before the throne, saying:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dignus es Domine et Deus noster accipere gloriam et honorem et virtutem quia tu creasti omnia et propter voluntatem tuam erant et creata sunt"
      en: "Thou art worthy, O Lord our God, to receive glory, and honour, and power: because thou hast created all things; and for thy will they were, and have been created."
    status: { la: verified, en: verified }
