# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: marc
chapter: 15
verses:
  - n: 1
    text:
      la: "Et confestim, mane consilium facientes summi sacerdotes cum senioribus, et scribis, et universo concilio, vincientes Jesum, duxerunt, et tradiderunt Pilato."
      en: "And straightway in the morning, the chief priests holding a consultation with the ancients and the scribes and the whole council, binding Jesus, led him away, and delivered him to Pilate."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et interrogavit eum Pilatus: Tu es rex Judaeorum? At ille respondens, ait illi: Tu dicis."
      en: "And Pilate asked him: Art thou the king of the Jews? But he answering, saith to him: Thou sayest it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et accusabant eum summi sacerdotes in multis."
      en: "And the chief priests accused him in many things."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Pilatus autem rursum interrogavit eum, dicens: Non respondes quidquam? vide in quantis te accusant."
      en: "And Pilate again asked him, saying: Answerest thou nothing? behold in how many things they accuse thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Jesus autem amplius nihil respondit, ita ut miraretur Pilatus."
      en: "But Jesus still answered nothing; so that Pilate wondered."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Per diem autem festum solebat dimittere illis unum ex vinctis, quemcumque petissent."
      en: "Now on the festival day he was wont to release unto them one of the prisoners, whomsoever they demanded."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Erat autem qui dicebatur Barrabas, qui cum seditiosis erat vinctus, qui in seditione fecerat homicidium."
      en: "And there was one called Barabbas, who was put in prison with some seditious men, who in the sedition had committed murder."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et cum ascendisset turba, coepit rogare, sicut semper faciebat illis."
      en: "And when the multitude was come up, they began to desire that he would do, as he had ever done unto them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Pilatus autem respondit eis, et dixit: Vultis dimittam vobis regem Judaeorum?"
      en: "And Pilate answered them, and said: Will you that I release to you the king of the Jews?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Sciebat enim quod per invidiam tradidissent eum summi sacerdotes."
      en: "For he knew that the chief priests had delivered him up out of envy."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Pontifices autem concitaverunt turbam, ut magis Barabbam dimitteret eis."
      en: "But the chief priests moved the people, that he should rather release Barabbas to them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Pilatus autem iterum respondens, ait illis: Quid ergo vultis faciam regi Judaeorum?"
      en: "And Pilate again answering, saith to them: What will you then that I do to the king of the Jews?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "At illi iterum clamaverunt: Crucifige eum."
      en: "But they again cried out: Crucify him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Pilatus vero dicebat illis: Quid enim mali fecit? At illi magis clamabant: Crucifige eum."
      en: "And Pilate saith to them: Why, what evil hath he done? But they cried out the more: Crucify him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Pilatus autem volens populo satisfacere, dimisit illis Barabbam, et tradidit Jesum flagellis caesum, ut crucifigeretur."
      en: "And so Pilate being willing to satisfy the people, released to them Barabbas, and delivered up Jesus, when he had scourged him, to be crucified."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Milites autem duxerunt eum in atrium praetorii, et convocant totam cohortem,"
      en: "And the soldiers led him away into the court of the palace, and they called together the whole band:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et induunt eum purpura, et imponunt ei plectentes spineam coronam."
      en: "And they clothe him with purple, and platting a crown of thorns, they put it upon him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et coeperunt salutare eum: Ave rex Judaeorum."
      en: "And they began to salute him: Hail, king of the Jews."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et percutiebant caput ejus arundine: et conspuebant eum, et ponentes genua, adorabant eum."
      en: "And they struck his head with a reed: and they did spit on him. And bowing their knees, they adored him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et postquam illuserunt ei, exuerunt illum purpura, et induerunt eum vestimentis suis: et educunt illum ut crucifigerent eum."
      en: "And after they had mocked him, they took off the purple from him, and put his own garments on him, and they led him out to crucify him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et angariaverunt praetereuntem quempiam, Simonem Cyrenaeum venientem de villa, patrem Alexandri et Rufi, ut tolleret crucem ejus."
      en: "And they forced one Simon a Cyrenian who passed by, coming out of the country, the father of Alexander and of Rufus, to take up his cross."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et perducunt illum in Golgotha locum: quod est interpretatum Calvariae locus."
      en: "And they bring him into the place called Golgotha, which being interpreted is, The place of Calvary."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et dabant ei bibere myrrhatum vinum: et non accepit."
      en: "And they gave him to drink wine mingled with myrrh; but he took it not."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et crucifigentes eum, diviserunt vestimenta ejus, mittentes sortem super eis, quis quid tolleret."
      en: "And crucifying him, they divided his garments, casting lots upon them, what every man should take."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Erat autem hora tertia: et crucifixerunt eum."
      en: "And it was the third hour, and they crucified him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et erat titulus causae ejus inscriptus: Rex Judaeorum."
      en: "And the inscription of his cause was written over: THE KING OF THE JEWS."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et cum eo crucifigunt duos latrones: unum a dextris, et alium a sinistris ejus."
      en: "And with him they crucify two thieves; the one on his right hand, and the other on his left."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et impleta est Scriptura, quae dicit: Et cum iniquis reputatus est."
      en: "And the scripture was fulfilled, which saith: And with the wicked he was reputed."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et praetereuntes blasphemabant eum, moventes capita sua, et dicentes: Vah qui destruis templum Dei, et in tribus diebus reaedificas:"
      en: "And they that passed by blasphemed him, wagging their heads, and saying: Vah, thou that destroyest the temple of God, and in three days buildest it up again;"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "salvum fac temetipsum descendens de cruce."
      en: "Save thyself, coming down from the cross."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Similiter et summi sacerdotes illudentes, ad alterutrum cum scribis dicebant: Alios salvos fecit, seipsum non potest salvum facere."
      en: "In like manner also the chief priests mocking, said with the scribes one to another: He saved others; himself he cannot save."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Christus rex Israel descendat nunc de cruce, ut videamus, et credamus. Et qui cum eo crucifixi erant, convitiabantur ei."
      en: "Let Christ the king of Israel come down now from the cross, that we may see and believe. And they that were crucified with him reviled him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et facta hora sexta, tenebrae factae sunt per totam terram usque in horam nonam."
      en: "And when the sixth hour was come, there was darkness over the whole earth until the ninth hour."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et hora nona exclamavit Jesus voce magna, dicens: Eloi, eloi, lamma sabacthani? quod est interpretatum: Deus meus, Deus meus, ut quid dereliquisti me?"
      en: "And at the ninth hour, Jesus cried out with a loud voice, saying: Eloi, Eloi, lamma sabacthani? Which is, being interpreted, My God, my God, why hast thou forsaken me?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et quidam de circumstantibus audientes, dicebant: Ecce Eliam vocat."
      en: "And some of the standers by hearing, said: Behold he calleth Elias."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Currens autem unus, et implens spongiam aceto, circumponensque calamo, potum dabat ei, dicens: Sinite, videamus si veniat Elias ad deponendum eum."
      en: "And one running and filling a sponge with vinegar, and putting it upon a reed, gave him to drink, saying: Stay, let us see if Elias come to take him down."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Jesus autem emissa voce magna expiravit."
      en: "And Jesus having cried out with a loud voice, gave up the ghost."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et velum templi scissum est in duo, a summo usque deorsum."
      en: "And the veil of the temple was rent in two, from the top to the bottom."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Videns autem centurio, qui ex adverso stabat, quia sic clamans expirasset, ait: Vere hic homo Filius Dei erat."
      en: "And the centurion who stood over against him, seeing that crying out in this manner he had given up the ghost, said: Indeed this man was the son of God."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Erant autem et mulieres de longe aspicientes: inter quas erat Maria Magdalene, et Maria Jacobi minoris, et Joseph mater, et Salome:"
      en: "And there were also women looking on afar off: among whom was Mary Magdalen, and Mary the mother of James the less and of Joseph, and Salome:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et cum esset in Galilaea, sequebantur eum, et ministrabant ei, et aliae multae, quae simul cum eo ascenderant Jerosolymam."
      en: "Who also when he was in Galilee followed him, and ministered to him, and many other women that came up with him to Jerusalem."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et cum jam sero esset factum ( quia erat parasceve, quod est ante sabbatum),"
      en: "And when evening was now come, (because it was the Parasceve, that is, the day before the sabbath,)"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "venit Joseph ab Arimathaea nobilis decurio, qui et ipse erat exspectans regnum Dei, et audacter introivit ad Pilatum, et petiit corpus Jesu."
      en: "Joseph of Arimathea, a noble counsellor, who was also himself looking for the kingdom of God, came and went in boldly to Pilate, and begged the body of Jesus."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Pilatus autem mirabatur si jam obiisset. Et accersito centurione, interrogavit eum si jam mortuus esset."
      en: "But Pilate wondered that he should be already dead. And sending for the centurion, he asked him if he were already dead."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et cum cognovisset a centurione, donavit corpus Joseph."
      en: "And when he had understood it by the centurion, he gave the body to Joseph."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Joseph autem mercatus sindonem, et deponens eum involvit sindone, et posuit eum in monumento quod erat excisum de petra, et advolvit lapidem ad ostium monumenti."
      en: "And Joseph buying fine linen, and taking him down, wrapped him up in the fine linen, and laid him in a sepulchre which was hewed out of a rock. And he rolled a stone to the door of the sepulchre."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Maria autem Magdalene et Maria Joseph aspiciebant ubi poneretur."
      en: "And Mary Magdalen, and Mary the mother of Joseph, beheld where he was laid."
    status: { la: verified, en: verified }
