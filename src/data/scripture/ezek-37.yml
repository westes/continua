# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 37
verses:
  - n: 1
    text:
      la: "Facta est super me manus Domini, et eduxit me in spiritu Domini, et dimisit me in medio campi, qui erat plenus ossibus."
      en: "The hand of the Lord was upon me, and brought me forth in the spirit of the Lord: and set me down in the midst of a plain that was full of bones."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et circumduxit me per ea in gyro: erant autem multa valde super faciem campi, siccaque vehementer."
      en: "And he led me about through them on every side: now they were very many upon the face of the plain, and they were exceeding dry."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dixit ad me: Fili hominis, putasne vivent ossa ista? Et dixi: Domine Deus, tu nosti."
      en: "And he said to me: Son of man, dost thou think these bones shall live? And I answered: O Lord God, thou knowest."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dixit ad me: Vaticinare de ossibus istis, et dices eis: Ossa arida, audite verbum Domini."
      en: "And he said to me: Prophesy concerning these bones; and say to them: Ye dry bones, hear the word of the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Haec dicit Dominus Deus ossibus his: Ecce ego intromittam in vos spiritum, et vivetis."
      en: "Thus saith the Lord God to these bones: Behold, I will send spirit into you, and you shall live."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dabo super vos nervos, et succrescere faciam super vos carnes, et superextendam in vobis cutem, et dabo vobis spiritum, et vivetis: et scietis quia ego Dominus."
      en: "And I will lay sinews upon you, and will cause flesh to grow over you, and will cover you with skin: and I will give you spirit and you shall live, and you shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et prophetavi sicut praeceperat mihi: factus est autem sonitus, prophetante me, et ecce commotio: et accesserunt ossa ad ossa, unumquodque ad juncturam suam."
      en: "And I prophesied as he had commanded me: and as I prophesied there was a noise, and behold a commotion: and the bones came together, each one to its joint."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et vidi, et ecce super ea nervi et carnes ascenderunt, et extenta est in eis cutis desuper, et spiritum non habebant."
      en: "And I saw, and behold the sinews, and the flesh came up upon them: and the skin was stretched out over them, but there was no spirit in them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dixit ad me: Vaticinare ad spiritum: vaticinare, fili hominis, et dices ad spiritum: Haec dicit Dominus Deus: A quatuor ventis veni, spiritus, et insuffla super interfectos istos, et reviviscant."
      en: "And he said to me: Prophesy to the spirit, prophesy, O son of man, and say to the spirit: Thus saith the Lord God: Come, spirit, from the four winds, and blow upon these slain, and let them live again."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et prophetavi sicut praeceperat mihi: et ingressus est in ea spiritus, et vixerunt: steteruntque super pedes suos, exercitus grandis nimis valde."
      en: "And I prophesied as he had commanded me: and the spirit came into them, and they lived: and they stood up upon their feet, an exceeding great army."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixit ad me: Fili hominis, ossa haec universa, domus Israel est. Ipsi dicunt: Aruerunt ossa nostra, et periit spes nostra, et abscissi sumus."
      en: "And he said to me: Son of man: All these bones are the house of Israel: they say: Our bones are dried up, and our hope is lost, and we are cut off."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Propterea vaticinare, et dices ad eos: Haec dicit Dominus Deus: Ecce ego aperiam tumulos vestros, et educam vos de sepulchris vestris, populus meus, et inducam vos in terram Israel."
      en: "Therefore prophesy, and say to them: Thus saith the Lord God: Behold I will open your graves, and will bring you out of your sepulchres, O my people: and will bring you into the land of Israel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et scietis quia ego Dominus, cum aparuero sepulchra vestra, et eduxero vos de tumulis vestris, popule meus,"
      en: "And you shall know that I am the Lord, when I shall have opened your sepulchres, and shall have brought you out of your graves, O my people:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dedero spiritum meum in vobis, et vixeritis: et requiescere vos faciam super humum vestram, et scietis quia ego Dominus locutus sum, et feci, ait Dominus Deus."
      en: "And shall have put my spirit in you, and you shall live, and I shall make you rest upon your own land: and you shall know that I the Lord have spoken, and done it, saith the Lord God:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et tu, fili hominis, sume tibi lignum unum, et scribe super illud: Judae, et filiorum Israel sociorum ejus: et tolle lignum alterum, et scribe super illud: Joseph, ligno Ephraim, et cunctae domui Israel sociorumque ejus."
      en: "And thou son of man, take thee a stick: and write upon it: Of Juda, and of the children of Israel his associates: and take another stick and write upon it: For Joseph the stick of Ephraim, and for all the house of Israel, and of his associates."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et adjunge illa unum ad alterum tibi in lignum unum: et erunt in unionem in manu tua."
      en: "And join them one to the other into one stick, and they shall become one in thy hand."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cum autem dixerint ad te filii populi tui loquentes: Nonne indicas nobis quid in his tibi velis?"
      en: "And when the children of thy people shall speak to thee, saying: Wilt thou not tell us what thou meanest by this?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "loqueris ad eos: Haec dicit Dominus Deus: Ecce ego assumam lignum Joseph, quod est in manu Ephraim, et tribus Israel, quae sunt ei adjunctae, et dabo eas pariter cum ligno Juda, et faciam eas in lignum unum: et erunt unum in manu ejus."
      en: "Say to them: Thus saith the Lord God: Behold, I will take the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel that are associated with him, and I will put them together with the stick of Juda, and will make them one stick: and they shall be one in his hand."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Erunt autem ligna super quae scripseris in manu tua, in oculis eorum."
      en: "And the sticks whereon thou hast written, shall be in thy hand, before their eyes."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et dices ad eos: Haec dicit Dominus Deus: Ecce ego assumam filios Israel de medio nationum ad quas abierunt: et congregabo eos undique, et adducam eos ad humum suam."
      en: "And thou shalt say to them: Thus saith the Lord God: Behold, I will take the children of Israel from the midst of the nations whither they are gone: and I will gather them on every side, and will bring them to their own land."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et faciam eos in gentem unam in terra in montibus Israel, et rex unus erit omnibus imperans: et non erunt ultra duae gentes, nec dividentur amplius in duo regna:"
      en: "And I will make them one nation in the land on the mountains of Israel, and one king shall be king over them all: and they shall no more be two nations, neither shall they be divided any more into two kingdoms."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "neque polluentur ultra in idolis suis, et abominationibus suis, et cunctis iniquitatibus suis: et salvos eos faciam de universis sedibus in quibus peccaverunt, et emundabo eos: et erunt mihi populus, et ego ero eis Deus."
      en: "Nor shall they be defiled any more with their idols, nor with their abominations, nor with all their iniquities: and I will save them out of all the places in which they have sinned, and I will cleanse them: and they shall be my people, and I will be their God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et servus meus David rex super eos, et pastor unus erit omnium eorum. In judiciis meis ambulabunt, et mandata mea custodient, et facient ea."
      en: "And my servant David shall be king over them, and they shall have one shepherd: they shall walk in my judgments, and shall keep my commandments, and shall do them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et habitabunt super terram quam dedi servo meo Jacob, in qua habitaverunt patres vestri: et habitabunt super eam ipsi, et filii eorum, et filii filiorum eorum, usque in sempiternum: et David servus meus princeps eorum in perpetuum."
      en: "And they shall dwell in the land which I gave to my servant Jacob, wherein your fathers dwelt, and they shall dwell in it, they and their children, and their children's children, for ever: and David my servant shall be their prince for ever."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et percutiam illis foedus pacis: pactum sempiternum erit eis. Et fundabo eos, et multiplicabo, et dabo sanctificationem meam in medio eorum in perpetuum."
      en: "And I will make a covenant of peace with them, it shall be an everlasting covenant with them: and I will establish them, and will multiply them, and will set my sanctuary in the midst of them for ever."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et erit tabernaculum meum in eis: et ero eis Deus, et ipsi erunt mihi populus."
      en: "And my tabernacle shall be with them: and I will be their God, and they shall be my people."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et scient gentes quia ego Dominus sanctificator Israel, cum fuerit sanctificatio mea in medio eorum in perpetuum."
      en: "And the nations shall know that I am the Lord the sanctifier of Israel, when my sanctuary shall be in the midst of them for ever."
    status: { la: verified, en: verified }
