# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 17
verses:
  - n: 1
    text:
      la: "Non immolabis Domino Deo tuo ovem, et bovem, in quo est macula, aut quippiam vitii: quia abominatio est Domino Deo tuo."
      en: "Thou shalt not sacrifice to the Lord thy God a sheep, or an ox, wherein there is blemish, or any fault: for that is an abomination to the Lord thy God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cum reperti fuerint apud te intra unam portarum tuarum, quas Dominus Deus tuus dabit tibi, vir aut mulier qui faciant malum in conspectu Domini Dei tui, et transgrediantur pactum illius,"
      en: "When there shall be found among you within any of thy gates, which the Lord thy God shall give thee, man or woman that do evil in the sight of the Lord thy God, and transgress his covenant,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ut vadant et servant diis alienis, et adorent eos, solem et lunam, et omnem militiam caeli, quae non praecepi:"
      en: "So as to go and serve strange gods, and adore them, the sun and the moon. and all the host of heaven, which I have not commanded:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et hoc tibi fuerit nuntiatum, audiensque inquisieris diligenter et verum esse repereris, et abominatio facta est in Israel:"
      en: "And this is told thee, and hearing it thou hast inquired diligently, and found it to be true, and that the abomination is committed in Israel:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "educes virum ac mulierem, qui rem sceleratissimam perpetrarunt, ad portas civitatis tuae, et lapidibus obruentur."
      en: "Thou shalt bring forth the man or the woman, who have committed that most wicked thing, to the gates of thy city, and they shall be stoned."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In ore duorum aut trium testium peribit qui interficietur. Nemo occidatur, uno contra se dicente testimonium."
      en: "By the mouth of two or three witnesses shall he die that is to be slain. Let no man be put to death, when only one beareth witness against him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Manus testium prima interficiet eum, et manus reliqui populi extrema mittetur: ut auferas malum de medio tui."
      en: "The hands of the witnesses shall be first upon him to kill him, and afterwards the hands of the rest of the people: that thou mayst take away the evil out of the midst of thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si difficile et ambiguum apud te judicium esse perspexeris inter sanguinem et sanguinem, causam et causam, lepram et lepram: et judicum intra portas tuas videris verba variari: surge, et ascende ad locum, quem elegerit Dominus Deus tuus."
      en: "If thou perceive that there be among you a hard and doubtful matter in judgment between blood and blood, cause and cause, leprosy and leprosy: and thou see that the words of the judges within thy gates do vary: arise, and go up to the place, which the Lord thy God shall choose."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Veniesque ad sacerdotes Levitici generis, et ad judicem qui fuerit illo tempore: quaeresque ab eis, qui indicabunt tibi judicii veritatem."
      en: "And thou shalt come to the priests of the Levitical race, and to the judge, that shall be at that time: and thou shalt ask of them, and they shall shew thee the truth of the judgment."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et facies quodcumque dixerint qui praesunt loco quem elegerit Dominus, et docuerint te"
      en: "And thou shalt do whatsoever they shall say, that preside in the place, which the Lord shall choose, and what they shall teach thee,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "juxta legem ejus, sequerisque sententiam eorum, nec declinabis ad dexteram neque ad sinistram."
      en: "According to his law; and thou shalt follow their sentence: neither shalt thou decline to the right hand nor to the left hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Qui autem superbierit, nolens obedire sacerdotis imperio, qui eo tempore ministrat Domino Deo tuo, et decreto judicis, morietur homo ille, et auferes malum de Israel:"
      en: "But he that will be proud, and refuse to obey the commandment of the priest, who ministereth at that time to the Lord thy God, and the decree of the judge, that man shall die, and thou shalt take away the evil from Israel:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cunctusque populus audiens timebit, ut nullus deinceps intumescat superbia."
      en: "And all the people hearing it shall fear, that no one afterwards swell with pride."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cum ingressus fueris terram, quam Dominus Deus tuus dabit tibi, et possederis eam, habitaverisque in illa, et dixeris: Constituam super me regem, sicut habent omnes per circuitum nationes:"
      en: "When thou art come into the land, which the Lord thy God will give thee, and possessest it, and shalt say: I will set a king over me, as all nations have that are round about:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "eum constitues, quem Dominus Deus tuus elegerit de numero fratrum tuorum. Non poteris alterius gentis hominem regem facere, qui non sit frater tuus."
      en: "Thou shalt set him whom the Lord thy God shall choose out of the number of thy brethren. Thou mayst not make a man of another nation king, that is not thy brother."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cumque fuerit constitutus, non multiplicabit sibi equos, nec reducet populum in Aegyptum, equitatus numero sublevatus, praesertim cum Dominus praeceperit vobis ut nequaquam amplius per eamdem viam revertamini."
      en: "And when he is made king, he shall not multiply horses to himself, nor lead back the people into Egypt, being lifted up with the number of his horsemen, especially since the Lord hath commanded you to return no more the same way."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non habebit uxores plurimas, quae alliciant animum ejus, neque argenti et auri immensa pondera."
      en: "He shall not have many wives, that may allure his mind, nor immense sums of silver and gold."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Postquam autem sederit in solio regni sui, describet sibi Deuteronomium legis hujus in volumine, accipiens exemplar a sacerdotibus Leviticae tribus,"
      en: "But after he is raised to the throne of his kingdom, he shall copy out to himself the Deuteronomy of this law in a volume, taking the copy of the priests of the Levitical tribe,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et habebit secum, legetque illud omnibus diebus vitae suae, ut discat timere Dominum Deum suum, et custodire verba et caeremonias ejus, quae in lege praecepta sunt."
      en: "And he shall have it with him, and shall read it all the days of his life, that he may learn to fear the Lord his God, and keep his words and ceremonies, that are commanded in the law;"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Nec elevetur cor ejus in superbiam super fratres suos, neque declinet in partem dexteram vel sinistram, ut longo tempore regnet ipse et filii ejus super Israel."
      en: "And that his heart be not lifted up with pride over his brethren, nor decline to the right or to the left, that he and his sons may reign a long time over Israel."
    status: { la: verified, en: verified }
