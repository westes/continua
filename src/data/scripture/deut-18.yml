# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 18
verses:
  - n: 1
    text:
      la: "Non habebunt sacerdotes et Levitae, et omnes qui de eadem tribu sunt, partem et haereditatem cum reliquo Israel, quia sacrificia Domini, et oblationes ejus comedent,"
      en: "The priests and Levites, and all that are of the same tribe, shall have no part nor inheritance with the rest of Israel, because they shall eat the sacrifices of the Lord, and his oblations,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et nihil aliud accipient de possessione fratrum suorum: Dominus enim ipse est haereditas eorum, sicut locutus est illis."
      en: "And they shall receive nothing else. of the possession of their brethren: for the Lord himself is their inheritance, as he hath said to them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Hoc erit judicium sacerdotum a populo, et ab his qui offerunt victimas: sive bovem, sive ovem immolaverint, dabunt sacerdoti armum ac ventriculum:"
      en: "This shall be the priest's due from the people, and from them that offer victims: whether they sacrifice an ox, or a sheep, they shall give to the priest the shoulder and the breast:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "primitias frumenti, vini, et olei, et lanarum partem ex ovium tonsione."
      en: "The firstfruits also of corn, of wine, and of oil, and a part of the wool from the shearing of their sheep."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ipsum enim elegit Dominus Deus tuus de cunctis tribubus tuis, ut stet, et ministret nomini Domini, ipse, et filii ejus in sempiternum."
      en: "For the Lord thy God hath chosen him of all thy tribes, to stand and to minister to the name of the Lord, him and his sons for ever."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Si exierit Levites ex una urbium tuarum ex omni Israel in qua habitat, et voluerit venire, desiderans locum quem elegerit Dominus,"
      en: "If a Levite go out of any one of the cities throughout all Israel, in which he dwelleth, and have a longing mind to come to the place which the Lord shall choose,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ministrabit in nomine Domini Dei sui, sicut omnes fratres ejus Levitae, qui stabunt eo tempore coram Domino."
      en: "He shall minister in the name of the Lord his God, as all his brethren the Levites do, that shall stand at that time before the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Partem ciborum eamdem accipiet, quam et ceteri: excepto eo, quod in urbe sua ex paterna ei successione debetur."
      en: "He shall receive the same portion of food that the rest do: besides that which is due to him in his own city, by succession from his fathers."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quando ingressus fueris terram, quam Dominus Deus tuus dabit tibi, cave ne imitari velis abominationes illarum gentium."
      en: "When thou art come into the land which the Lord thy God shall give thee, beware lest thou have a mind to imitate the abominations of those nations."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nec inveniatur in te qui lustret filium suum, aut filiam, ducens per ignem: aut qui ariolos sciscitetur, et observet somnia atque auguria, nec sit maleficus,"
      en: "Neither let there be found among you any one that shall expiate his son or daughter, making them to pass through the fire: or that consulteth soothsayers, or observeth dreams and omens, neither let there be any wizard,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nec incantantor, nec qui pythones consulat, nec divinos, aut quaerat a mortuis veritatem."
      en: "Nor charmer, nor any one that consulteth pythonic spirits, or fortune tellers, or that seeketh the truth from the dead."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Omnia enim haec abominatur Dominus, et propter istiusmodi scelera delebit eos in introitu tuo."
      en: "For the Lord abhorreth all these things, and for these abominations he will destroy them at thy coming."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Perfectus eris, et absque macula cum Domino Deo tuo."
      en: "Thou shalt be perfect, and without spot before the Lord thy God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Gentes istae, quarum possidebis terram, augures et divinos audiunt: tu autem a Domino Deo tuo aliter institutus es."
      en: "These nations, whose land thou shalt possess, hearken to soothsayers and diviners: but thou art otherwise instructed by the Lord thy God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Prophetam de gente tua et de fratribus tuis, sicut me, suscitabit tibi Dominus Deus tuus: ipsum audies,"
      en: "The Lord thy God will raise up to thee a PROPHET of thy nation and of thy brethren like unto me: him thou shalt hear:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ut petisti a Domino Deo tuo in Horeb, quando concio congregata est, atque dixisti: Ultra non audiam vocem Domini Dei mei, et ignem hunc maximum amplius non videbo, ne moriar."
      en: "As thou desiredst of the Lord thy God in Horeb, when the assembly was gathered together, and saidst: Let me not hear any more the voice of the Lord my God, neither let me see any more this exceeding great fire, lest I die."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ait Dominus mihi: Bene omnia sunt locuti."
      en: "And the Lord said to me: They have spoken all things well."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Prophetam suscitabo eis de medio fratrum suorum similem tui: et ponam verba mea in ore ejus, loqueturque ad eos omnia quae praecepero illi."
      en: "I will raise them up a prophet out of the midst of their brethren like to thee: and I will put my words in his mouth, and he shall speak to them all that I shall command him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Qui autem verba ejus, quae loquetur in nomine meo, audire noluerit, ego ultor existam."
      en: "And he that will not hear his words, which he shall speak in my name, I will be the revenger."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Propheta autem qui arrogantia depravatus voluerit loqui in nomine meo, quae ego non praecepi illi ut diceret, aut ex nomine alienorum deorum, interficietur."
      en: "But the prophet, who being corrupted with pride, shall speak in my name things that I did not command him to say, or in the name of strange gods, shall be slain."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quod si tacita cogitatione responderis: Quomodo possum intelligere verbum, quod Dominus non est locutus?"
      en: "And if in silent thought thou answer: How shall I know the word that the Lord hath not spoken?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "hoc habebis signum: quod in nomine Domini propheta ille praedixerit, et non evenerit: hoc Dominus non est locutus, sed per tumorem animi sui propheta confinxit: et idcirco non timebis eum."
      en: "Thou shalt have this sign: Whatsoever that same prophet foretelleth in the name of the Lord, and it cometh not to pass: that thing the Lord hath not spoken, but the prophet hath forged it by the pride of his mind: and therefore thou shalt not fear him."
    status: { la: verified, en: verified }
