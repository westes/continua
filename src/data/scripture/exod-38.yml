# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 38
verses:
  - n: 1
    text:
      la: "fecit et altare holocausti de lignis setthim quinque cubitorum per quadrum et trium in altitudine"
      en: "He made also the altar of holocaust of setim wood, five cubits square, and three in height:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cuius cornua de angulis procedebant operuitque illud aeneis lamminis"
      en: "The horns whereof went out from the corners, and he overlaid it with plates of brass."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et in usus eius paravit ex aere vasa diversa lebetas forcipes fuscinulas uncinos et ignium receptacula"
      en: "And for the uses thereof, he prepared divers vessels of brass, cauldrons, tongs, fleshhooks, pothooks, and firepans."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "craticulamque eius in modum retis fecit aeneam et subter eam in altaris medio arulam"
      en: "And he made the grate thereof of brass, in manner of a net, and under it in the midst of the altar a hearth,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "fusis quattuor anulis per totidem retiaculi summitates ad inmittendos vectes ad portandum"
      en: "Casting four rings at the four ends of the net at the top, to put in bars to carry it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quos et ipsos fecit de lignis setthim et operuit lamminis aeneis"
      en: "And he made the bars of setim wood, and overlaid them with plates of brass:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "induxitque in circulos qui in altaris lateribus eminebant ipsum autem altare non erat solidum sed cavum ex tabulis et intus vacuum"
      en: "And he drew them through the rings that stood out in the sides of the altar. And the altar itself was not solid, but hollow, of boards, and empty within."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "fecit et labrum aeneum cum base sua de speculis mulierum quae excubabant in ostio tabernaculi"
      en: "He made also the laver of brass, with the foot thereof, of the mirrors of the women that watch at the door of the tabernacle."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et atrium in cuius australi plaga erant tentoria de bysso retorta cubitorum centum"
      en: "He made also the court, in the south side whereof were hangings of fine twisted linen, of a hundred cubits,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "columnae aeneae viginti cum basibus suis capita columnarum et tota operis celatura argentea"
      en: "Twenty pillars of brass with their sockets, the heads of the pillars, and the whole graving of the work, of silver."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "aeque ad septentrionalis plagam tentoria columnae basesque et capita columnarum eiusdem et mensurae et operis ac metalli erant"
      en: "In like manner at the north side the hangings, the pillars, and the sockets and heads of the pillars were of the same measure, and work and metal."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in ea vero plaga quae occidentem respicit fuere tentoria cubitorum quinquaginta columnae decem cum basibus suis aeneae et capita columnarum celata argentea"
      en: "But on that side that looketh to the west, there were hangings of fifty cubits, ten pillars of brass with their sockets, and the heads of the pillars, and all the graving of the work, of silver."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "porro contra orientem quinquaginta cubitorum paravit tentoria"
      en: "Moreover towards the east he prepared hangings of fifty cubits:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "e quibus quindecim cubitos columnarum trium cum basibus suis unum tenebat latus"
      en: "Fifteen cubits of which were on one side with three pillars, and their sockets:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et in parte altera quia utraque introitum tabernaculi facit quindecim aeque cubitorum erant tentoria columnae tres et bases totidem"
      en: "And on the other side (for between the two he made the entry of the tabernacle) there were hangings equally of fifteen cubits, and three pillars, and as many sockets."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cuncta atrii tentoria byssus torta texuerat"
      en: "All the hangings of the court were woven with twisted linen."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "bases columnarum fuere aeneae capita autem earum cum celaturis suis argentea sed et ipsas columnas atrii vestivit argento"
      en: "The sockets of the pillars were of brass, and their heads with all their gravings of silver: and he overlaid the pillars of the court also with silver."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et in introitu eius opere plumario fecit tentorium ex hyacintho purpura vermiculo ac bysso retorta quod habebat viginti cubitos in longitudine altitudo vero quinque cubitorum erat iuxta mensuram quam cuncta atrii habebant tentoria"
      en: "And he made in the entry thereof an embroidered hanging of violet, purple, scarlet, and fine twisted linen, that was twenty cubits long, and five cubits high according to the measure of all the hangings of the court."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "columnae autem ingressus fuere quattuor cum basibus aeneis capitaque earum et celaturae argenteae"
      en: "And the pillars in the entry were four with sockets of brass, and their heads and gravings of silver."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "paxillos quoque tabernaculi et atrii per gyrum fecit aeneos"
      en: "The pins also of the tabernacle and of the court round about he made of brass."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "haec sunt instrumenta tabernaculi testimonii quae numerata sunt iuxta praeceptum Mosi in caerimonias Levitarum per manum Ithamar filii Aaron sacerdotis"
      en: "These are the instruments of the tabernacle of the testimony, which were counted according to the commandment of Moses, in the ceremonies of the Levites, by the hand of Ithamar son of Aaron the priest:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quas Beselehel filius Uri filii Hur de tribu Iuda Domino per Mosen iubente conpleverat"
      en: "Which Beseleel the son of Uri the son of Hur of the tribe of Juda had made as the Lord commanded by Moses,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "iuncto sibi socio Hooliab filio Achisamech de tribu Dan qui et ipse artifex lignorum egregius fuit et polymitarius atque plumarius ex hyacintho purpura vermiculo et bysso"
      en: "Having for his companion Ooliab the son of Achisamech of the tribe of Dan: who also was an excellent artificer in wood, and worker in tapestry and embroidery in violet, purple, scarlet, and fine linen."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "omne aurum quod expensum est in opere sanctuarii et quod oblatum in donariis viginti novem talentorum fuit et septingentorum triginta siclorum ad mensuram sanctuarii"
      en: "All the gold that was spent in the work of the sanctuary, and that was offered in gifts was nine and twenty talents, and seven hundred and thirty sicles according to the standard of the sanctuary."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "oblatum est autem ab his qui transierant ad numerum a viginti annis et supra de sescentis tribus milibus et quingentis quinquaginta armatorum"
      en: "And it was offered by them that went to be numbered, from twenty years old and upwards, of six hundred and three thousand five hundred and fifty men able to bear arms."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "fuerunt praeterea centum talenta argenti e quibus conflatae sunt bases sanctuarii et introitus ubi velum pendet"
      en: "There were moreover a hundred talents of silver, whereof were cast the sockets of the sanctuary, and of the entry where the veil hangeth."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "centum bases factae sunt de talentis centum singulis talentis per bases singulas supputatis"
      en: "A hundred sockets were made of a hundred talents, one talent being reckoned for every socket."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "de mille autem septingentis et septuaginta quinque fecit capita columnarum quas et ipsas vestivit argento"
      en: "And of the thousand seven hundred and seventy-five he made the heads of the pillars, which also he overlaid with silver."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "aeris quoque oblata sunt talenta septuaginta duo milia et quadringenti supra sicli"
      en: "And there were offered of brass also seventy-two thousand talents, and four hundred sicles besides."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ex quibus fusae sunt bases in introitu tabernaculi testimonii et altare aeneum cum craticula sua omniaque vasa quae ad usum eius pertinent"
      en: "Of which were cast the sockets in the entry of the tabernacle of the testimony, and the altar of brass with the grate thereof, and all the vessels that belong to the use thereof."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et bases atrii tam in circuitu quam in ingressu eius et paxilli tabernaculi atque atrii per gyrum"
      en: "And the sockets of the court as well round about as in the entry thereof, and the pins of the tabernacle and of the court round about."
    status: { la: verified, en: verified }
