book: ezek
chapter: 23
verses:
  - n: 1
    text:
      la: "et factus est sermo Domini ad me dicens"
      en: "And the word of the Lord came to me, saying: Son of man, there were two women, daughters of one mother."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fili hominis duae mulieres filiae matris unius fuerunt"
      en: ""
    status: { la: verified, en: missing }
  - n: 3
    text:
      la: "et fornicatae sunt in Aegypto in adulescentia sua fornicatae sunt ibi subacta sunt ubera earum et fractae sunt mammae pubertatis earum"
      en: "And they committed fornication in Egypt, in their youth they committed fornication: there were their breasts pressed down, and the teats of their virginity were bruised."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nomina autem earum Oolla maior et Ooliba soror eius et habui eas et pepererunt filios et filias porro earum nomina Samaria Oolla et Hierusalem Ooliba"
      en: "And their names were Oolla the elder, and Ooliba her younger sister: and I took them, and they bore sons and daughters. Now for their names, Samaria is Oolla, and Jerusalem is Ooliba."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "fornicata est igitur Oolla super me et insanivit in amatores suos in Assyrios propinquantes"
      en: "And Oolla committed fornication against me, and doted on her lovers, on the Assyrians that came to her,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "vestitos hyacintho principes et magistratus iuvenes cupidinis universos equites ascensores equorum"
      en: "Who were clothed with blue, princes, and rulers, beautiful youths, all horsemen, mounted upon horses."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dedit fornicationes suas super eos electos filios Assyriorum universos et in omnibus in quos insanivit in inmunditiis eorum polluta est"
      en: "And she committed her fornications with those chosen men, all sons of the Assyrians: and she defiled herself with the uncleanness of all them on whom she doted."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "insuper et fornicationes suas quas habuerat in Aegypto non reliquit nam et illi dormierant cum ea in adulescentia eius et illi confregerant ubera pubertatis eius et effuderant fornicationem suam super eam"
      en: "Moreover also she did not forsake her fornications which she had committed in Egypt: for they also lay with her in her youth, and they bruised the breasts of her virginity, and poured out their fornication upon her."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "propterea tradidi eam in manu amatorum suorum in manus filiorum Assur super quorum insanivit libidinem"
      en: "Therefore have I delivered her into the hands of her lovers, into the hands of the sons of the Assyrians, upon whose lust she doted."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ipsi discoperuerunt ignominiam eius filios et filias illius tulerunt et ipsam occiderunt gladio et factae sunt famosae mulieres et iudicia perpetrarunt in ea"
      en: "They discovered her disgrace, took away her sons and daughters, and slew her with the sword: and they became infamous women, and they executed judgments in her."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quod cum vidisset soror eius Ooliba plus quam illa insanivit libidine et fornicationem suam super fornicationem sororis suae"
      en: "And when her sister Ooliba saw this, she was mad with lust more than she: and she carried her fornication beyond the fornication of her sister."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ad filios Assyriorum praebuit inpudenter ducibus et magistratibus ad se venientibus indutis veste varia equitibus qui vectabantur equis et adulescentibus forma cunctis egregia"
      en: "Impudently prostituting herself to the children of the Assyrians, the princes, and rulers that came to her, clothed with divers colours, to the horsemen that rode upon horses, and to young men all of great beauty."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et vidi quod polluta esset via una ambarum"
      en: "And I saw that she was defiled, and that they both took one way."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et auxit fornicationes suas cumque vidisset viros depictos in pariete imagines Chaldeorum expressas coloribus"
      en: "And she increased her fornications: and when she had seen men painted on the wall, the images of the Chaldeans set forth in colours,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et accinctos balteis renes et tiaras tinctas in capitibus eorum formam ducum omnium similitudinem filiorum Babylonis terraeque Chaldeorum in qua orti sunt"
      en: "And girded with girdles about their reins, and with dyed turbans on their heads, the resemblance of all the captains, the likeness of the sons of Babylon, and of the land of the Chaldeans wherein they were born,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et insanivit super eos concupiscentia oculorum suorum et misit nuntios ad eos in Chaldeam"
      en: "She doted upon them with the lust of her eyes, and she sent messengers to them into Chaldea."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cumque venissent ad eam filii Babylonis ad cubile mammarum polluerunt eam stupris suis et polluta est ab eis et saturata est anima eius ab illis"
      en: "And when the sons of Babylon were come to her to the bed of love, they defiled her with their fornications, and she was polluted by them, and her soul was glutted with them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "denudavit quoque fornicationes suas et discoperuit ignominiam suam et recessit anima mea ab ea sicut recesserat anima mea a sorore eius"
      en: "And she discovered her fornications, and discovered her disgrace: and my soul was alienated from her, as my soul was alienated from her sister."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "multiplicavit enim fornicationes suas recordans dies adulescentiae suae quibus fornicata est in terra Aegypti"
      en: "For she multiplied her fornications, remembering the days of her youth, in which she played the harlot in the land of Egypt."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et insanivit libidine super concubitu eorum quorum carnes sunt ut carnes asinorum et sicut fluxus equorum fluxus eorum"
      en: "And she was mad with lust after lying with them whose flesh is as the flesh of asses: and whose issue as the issue of horses."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et visitasti scelus adulescentiae tuae quando subacta sunt in Aegypto ubera tua et confractae mammae pubertatis tuae"
      en: "And thou hast renewed the wickedness of thy youth, when thy breasts were pressed in Egypt, and the papa of thy virginity broken."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "propterea Ooliba haec dicit Dominus Deus ecce ego suscitabo omnes amatores tuos contra te de quibus satiata est anima tua et congregabo eos adversum te in circuitu"
      en: "Therefore, Ooliba, thus saith the Lord God: Behold I will raise up against thee all thy lovers with whom thy soul hath been glutted: and I will gather them together against thee round about."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "filios Babylonis et universos Chaldeos nobiles tyrannosque et principes omnes filios Assyriorum iuvenes forma egregia duces et magistratus universos principes principum et nominatos ascensores equorum"
      en: "The children of Babylon, and all the Chaldeans, the nobles, and the kings, and princes, all the sons of the Assyrians, beautiful young men, all the captains, and rulers, the princes of princes, and the renowned horsemen."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et venient super te instructi curru et rota multitudo populorum lorica et clypeo et galea armabuntur contra te undique et dabo coram eis iudicium et iudicabunt te iudiciis suis"
      en: "And they shall come upon thee well appointed with chariot and wheel, a multitude of people: they shall be armed against thee on every side with breastplate, and buckler, and helmet: and I will set judgment before them, and they shall judge thee by their judgments."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ponam zelum meum in te quem exercent tecum in furore nasum tuum et aures tuas praecident et quae remanserint gladio concident ipsi filios tuos et filias tuas capient et novissimum tuum devorabitur igni"
      en: "And I will set my jealousy against thee, which they shall execute upon thee with fury: they shall cut off thy nose and thy ears: and what remains shall fall by the sword: they shall take thy sons, and thy daughters, and thy residue shall be devoured by fire."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et denudabunt te vestimentis tuis et tollent vasa gloriae tuae"
      en: "And they shall strip thee of thy garments, and take away the instruments of thy glory."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et requiescere faciam scelus tuum de te et fornicationem tuam de terra Aegypti nec levabis oculos tuos ad eos et Aegypti non recordaberis amplius"
      en: "And I will put an end to thy wickedness in thee, and thy fornication brought out of the land of Egypt: neither shalt thou lift up thy eyes to them, nor remember Egypt any more."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quia haec dicit Dominus Deus ecce ego tradam te in manu eorum quos odisti in manu de quibus satiata est anima tua"
      en: "For thus saith the Lord God: Behold, I will deliver thee into the hands of them whom thou hatest, into their hands with whom thy soul hath been glutted."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et agent tecum in odio et tollent omnes labores tuos et dimittent te nudam et ignominia plenam revelabitur ignominia fornicationum tuarum scelus tuum et fornicationes tuae"
      en: "And they shall deal with thee in hatred, and they shall take away all thy labours, and shall let thee go naked, and full of disgrace, and the disgrace of thy fornication shall be discovered, thy wickedness, and thy fornications."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "fecerunt haec tibi quia fornicata es post gentes inter quas polluta es in idolis eorum"
      en: "They have done these things to thee, because thou hast played the harlot with the nations among which thou wast defiled with their idols."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "in via sororis tuae ambulasti et dabo calicem eius in manu tua"
      en: "Thou hast walked in the way of thy sister, and I will give her cup into thy hand."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "haec dicit Dominus Deus calicem sororis tuae bibes profundum et latum eris in derisum et in subsannationem quae es capacissima"
      en: "Thus saith the Lord God: Thou shalt drink thy sister's cup, deep, and wide: thou shalt be had in derision and scorn, which containeth very much."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ebrietate et dolore repleberis calice maeroris et tristitiae calice sororis tuae Samariae"
      en: "Thou shalt be filled with drunkenness, and sorrow: with the cup of grief, and sadness, with the cup of thy sister Samaria."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et bibes illum et epotabis usque ad feces et fragmenta eius devorabis et ubera tua lacerabis quia ego locutus sum ait Dominus Deus"
      en: "And thou shalt drink it, and shalt drink it up even to the dregs, and thou shalt devour the fragments thereof, thou shalt rend thy breasts: because I have spoken it, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "propterea haec dicit Dominus Deus quia oblita es mei et proiecisti me post corpus tuum tu quoque porta scelus tuum et fornicationes tuas"
      en: "Therefore thus saith the Lord God: Because thou hast forgotten me, and hast cast me off behind thy back, bear thou also thy wickedness, and thy fornications."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et ait Dominus ad me dicens fili hominis numquid iudicas Oollam et Oolibam et adnuntias eis scelera earum"
      en: "And the Lord spoke to me, saying: Son of man, dost thou judge Oolla, and Ooliba, and dost thou declare to them their wicked deeds?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "quia adulterae sunt et sanguis in manibus earum et cum idolis suis fornicatae sunt insuper et filios suos quos genuerunt mihi obtulerunt eis ad devorandum"
      en: "Because they have committed adultery, and blood is in their hands, and they have committed fornication with their idols: moreover also their children, whom they bore to me, they have offered to them to be devoured."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "sed et hoc fecerunt mihi polluerunt sanctuarium meum in die illa et sabbata mea profanaverunt"
      en: "Yea, and they have done this to me. They polluted my sanctuary on the same day, and profaned my sabbaths."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "cumque immolarent filios suos idolis suis et ingrederentur sanctuarium meum in die illa ut polluerent illud etiam haec fecerunt in medio domus meae"
      en: "And when they sacrificed their children to their idols, and went into my sanctuary the same day to profane it: they did these things even in the midst of my house."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "miserunt ad viros venientes de longe ad quos nuntium miserant itaque ecce venerunt quibus te lavisti et circumlevisti stibio oculos tuos et ornata es mundo muliebri"
      en: "They sent for men coming from afar, to whom they had sent a messenger: and behold they came: for whom thou didst wash thyself, and didst paint thy eyes, and wast adorned with women's ornaments."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "sedisti in lecto pulcherrimo et mensa ordinata est ante te thymiama meum et unguentum meum posuisti super eam"
      en: "Thou sattest on a very fine bed, and a table was decked before thee: whereupon thou didst set my incense, and my ointment."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et vox multitudinis exultantis erat in ea et in viris qui de multitudine hominum adducebantur et veniebant de deserto posuerunt armillas in manibus eorum et coronas speciosas in capitibus eorum"
      en: "And there was in her the voice of a multitude rejoicing: and to some that were brought of the multitude of men, and that came from the desert, they put bracelets on their hands, and beautiful crowns on their heads."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et dixi ei quae adtrita est in adulteriis nunc fornicabitur in fornicatione sua etiam haec"
      en: "And I said to her that was worn out in her adulteries: Now will this woman still continue in her fornication."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et ingressi sunt ad eam quasi ad mulierem meretricem sic ingrediebantur ad Oollam et ad Oolibam mulieres nefarias"
      en: "And they went in to her, as to a harlot: so went they in unto Oolla, and Ooliba, wicked women."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "viri ergo iusti sunt hii iudicabunt eas iudicio adulterarum et iudicio effundentium sanguinem quia adulterae sunt et sanguis in manibus earum"
      en: "They therefore are k just men: these shall judge them as adulteresses are judged, and as shedders of blood are judged: because they are adulteresses, and blood is in their hands."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "haec enim dicit Dominus Deus adduc ad eas multitudinem et trade eas in tumultum et in rapinam"
      en: "For thus saith the Lord God: Bring a multitude upon them, and deliver them over to tumult and rapine:"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et lapidentur lapidibus populorum et confodiantur gladiis eorum filios et filias earum interficient et domos earum igne succendent"
      en: "And lee the people stone them with stones, and let them be stabbed with their swords: they shall kill their sons and daughters, and their houses they shall burn with fire."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et auferam scelus de terra et discent omnes mulieres ne faciant secundum scelus earum"
      en: "And I will take away wickedness out of the land: and all women shall learn, not to do according to the wickedness of them."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et dabunt scelus vestrum super vos et peccata idolorum vestrorum portabitis et scietis quia ego Dominus Deus"
      en: "And they shall render your wickedness upon you, and you shall bear the sins of your idols: and you shall know that I am the Lord God."
    status: { la: verified, en: verified }
