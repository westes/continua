# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 60
verses:
  - n: 1
    text:
      la: "Surge, illuminare, Jerusalem, quia venit lumen tuum, et gloria Domini super te orta est."
      en: "Arise, be enlightened, O Jerusalem: for thy light is come, and the glory of the Lord is risen upon thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quia ecce tenebrae operient terram, et caligo populos; super te autem orietur Dominus, et gloria ejus in te videbitur."
      en: "For behold darkness shall cover the earth, and a mist the people: but the Lord shall arise upon thee, and his glory shall be seen upon thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ambulabunt gentes in lumine tuo, et reges in splendore ortus tui."
      en: "And the Gentiles shall walk in thy light, and kings in the brightness of thy rising."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Leva in circuitu oculos tuos, et vide: omnes isti congregati sunt, venerunt tibi; filii tui de longe venient et filiae tuae de latere surgent."
      en: "Lift up thy eyes round about, and see: all these are gathered together, they are come to thee: thy sons shall come from afar, and thy daughters shall rise up at thy side."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tunc videbis, et afflues, mirabitur et dilatabitur cor tuum, quando conversa fuerit ad te multitudo maris, fortitudo gentium venerit tibi."
      en: "Then shalt thou see, and abound, and thy heart shall wonder and be enlarged, when the multitude of the sea shall be converted to thee, the. strength of the Gentiles shall come to thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Inundatio camelorum operiet te, dromedarii Madian et Epha; omnes de Saba venient, aurum et thus deferentes, et laudem Domino annuntiantes."
      en: "The multitude of camels shall cover thee, the dromedaries of Madian and Epha: all they from Saba shall come, bringing gold and frankincense: and shewing forth praise to the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Omne pecus Cedar congregabitur tibi; arietes Nabaioth ministrabunt tibi: offerentur super placabili altari meo, et domum majestatis meae glorificabo."
      en: "All the flocks of Cedar shall be gathered together unto thee, the rams of Nabaioth shall minister to thee: they shall be offered upon my acceptable altar, and I will glorify the house of my majesty."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui sunt isti qui ut nubes volant, et quasi columbae ad fenestras suas?"
      en: "Who are these, that fly as clouds, and as doves to their windows?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Me enim insulae exspectant, et naves maris in principio, ut adducam filios tuos de longe; argentum eorum, et aurum eorum cum eis, nomini Domini Dei tui, et Sancto Israel, quia glorificavit te."
      en: "For, the islands wait for me, and the ships of the sea in the beginning: that I may bring thy sons from afar: their silver, and their gold with them, to the name of the Lord thy God, and to the Holy One of Israel, because he hath glorified thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et aedificabunt filii peregrinorum muros tuos, et reges eorum ministrabunt tibi; in indignatione enim mea percussi te, et in reconciliatione mea misertus sum tui."
      en: "And the children of strangers shall build up thy walls, and their kings shall minister to thee: for in my wrath have I struck thee, and in my reconciliation have I had mercy upon thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et aperientur portae tuae jugiter; die ac nocte non claudentur, ut afferatur ad te fortitudo gentium, et reges earum adducantur."
      en: "And thy gates shall be open continually: they shall not be shut day nor night, that the strength of the Gentiles may be brought to thee, and their kings may be brought."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Gens enim et regnum quod non servierit tibi peribit, et gentes solitudine vastabuntur."
      en: "For the nation and the kingdom that will not serve thee, shall perish: and the Gentiles shall be wasted with desolation."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Gloria Libani ad te veniet, abies, et buxus, et pinus simul ad ornandum locum sanctificationis meae; et locum pedum meorum glorificabo."
      en: "The glory of Libanus shall come to thee, the fir tree, and the box tree, and the pine tree together, to beautify the place of my sanctuary: and I will glorify the place of my feet."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et venient ad te curvi filii eorum qui humiliaverunt te, et adorabunt vestigia pedum tuorum omnes qui detrahebant tibi, et vocabunt te civitatem Domini, Sion Sancti Israel."
      en: "And the children of them that afflict thee, shall come bowing down to thee, and all that slandered thee shall worship the steps of thy feet, and shall call thee the city of the Lord, the Sion of the Holy One of Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Pro eo quod fuisti derelicta et odio habita, et non erat qui per te transiret, ponam te in superbiam saeculorum, gaudium in generationem et generationem;"
      en: "Because thou wast forsaken, and hated, and there was none that passed through thee, I will make thee to be an everlasting glory, a joy unto generation and generation:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et suges lac gentium, et mamilla regum lactaberis; et scies quia ego Dominus salvans te, et redemptor tuus, Fortis Jacob."
      en: "And thou shalt suck the milk of the Gentiles, and thou shalt be nursed with the breasts of kings: and thou shalt know that I am the Lord thy Saviour, and thy Redeemer, the Mighty One of Jacob."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Pro aere afferam aurum, et pro ferro afferam argentum, et pro lignis aes, et pro lapidibus ferrum, et ponam visitationem tuam pacem, et praepositos tuos justitiam."
      en: "For brass I will bring gold, and for iron I will bring silver: and for wood brass, and for stones iron: and I will make thy visitation peace, and thy overseers justice."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Non audietur ultra iniquitas in terra tua, vastitas et contritio in terminis tuis; et occupabit salus muros tuos, et portas tuas laudatio."
      en: "Iniquity shall no more be heard in thy land, wasting nor destruction in thy borders, and salvation shall possess thy walls, and praise thy gates."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Non erit tibi amplius sol ad lucendum per diem, nec splendor lunae illuminabit te; sed erit tibi Dominus in lucem sempiternam, et Deus tuus in gloriam tuam."
      en: "Thou shalt no more have the sun for thy light by day, neither shall the brightness of the moon enlighten thee: but the Lord shall be unto thee for an everlasting light, and thy God for thy glory."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Non occidet ultra sol tuus, et luna tua non minuetur, quia erit tibi Dominus in lucem sempiternam, et complebuntur dies luctus tui."
      en: "Thy sun shall go down no more, and thy moon shall not decrease: for the Lord shall be unto thee for an everlasting light, and the days of thy mourning shall be ended."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Populus autem tuus omnes justi; in perpetuum haereditabunt terram, germen plantationis meae, opus manus meae ad glorificandum."
      en: "And thy people shall be all just, they shall inherit the land for ever, the branch of my planting, the work of my hand to glorify me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Minimus erit in mille, et parvulus in gentem fortissimam. Ego Dominus, in tempore ejus subito faciam istud."
      en: "The least shall become a thousand, and a little one a most strong nation: I the Lord will suddenly do this thing in its time."
    status: { la: verified, en: verified }
