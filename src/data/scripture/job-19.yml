# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 19
verses:
  - n: 1
    text:
      la: "Respondens autem Job, dixit:"
      en: "Then Job answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Usquequo affligitis animam meam, et atteritis me sermonibus?"
      en: "How long do you afflict my soul, and break me in pieces with words?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "En decies confunditis me, et non erubescitis opprimentes me."
      en: "Behold, these ten times you confound me, and are not ashamed to oppress me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nempe, et si ignoravi, mecum erit ignorantia mea."
      en: "For if I have been ignorant, my ignorance shall be with me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "At vos contra me erigimini, et arguitis me opprobriis meis."
      en: "But you have set yourselves up against me, and reprove me with my reproaches."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Saltem nunc intelligite quia Deus non aequo judicio afflixerit me, et flagellis suis me cinxerit."
      en: "At least now understand, that God hath not afflicted me with an equal judgment, and compassed me with his scourges."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ecce clamabo, vim patiens, et nemo audiet: vociferabor, et non est qui judicet."
      en: "Behold I cry suffering violence, and no one will hear: I shall cry aloud, and there is none to judge."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Semitam meam circumsepsit, et transire non possum: et in calle meo tenebras posuit."
      en: "He hath hedged in my path round about, and I cannot pass, and in my way he hath set darkness."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Spoliavit me gloria mea, et abstulit coronam de capite meo."
      en: "He hath stripped me of my glory, and hath taken the crown from my head."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Destruxit me undique, et pereo: et quasi evulsae arbori abstulit spem meam."
      en: "He hath destroyed me on every side, and I am lost, and he hath taken away my hope, as from a tree that is plucked up."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Iratus est contra me furor ejus, et sic me habuit quasi hostem suum."
      en: "His wrath is kindled against me, and he hath counted me as his enemy."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Simul venerunt latrones ejus, et fecerunt sibi viam per me, et obsederunt in gyro tabernaculum meum."
      en: "His troops have come together, and have made themselves a way by me, and have besieged my tabernacle round about."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Fratres meos longe fecit a me, et noti mei quasi alieni recesserunt a me."
      en: "He hath put my brethren far from me, and my acquaintance like strangers have departed from me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dereliquerunt me propinqui mei, et qui me noverant obliti sunt mei."
      en: "My kinsmen have forsaken me, and they that knew me, have forgotten me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Inquilini domus meae et ancillae meae sicut alienum habuerunt me, et quasi peregrinus fui in oculis eorum."
      en: "They that dwelt in my house, and my maidservants have counted me a stranger, and I have been like an alien in their eyes."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Servum meum vocavi, et non respondit: ore proprio deprecabar illum."
      en: "I called my servant, and he gave me no answer, I entreated him with my own mouth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Halitum meum exhorruit uxor mea, et orabam filios uteri mei."
      en: "My wife hath abhorred my breath, and I entreated the children of my womb."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Stulti quoque despiciebant me: et cum ab eis recessissem, detrahebant mihi."
      en: "Even fools despise me; and when I was gone from them, they spoke against me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Abominati sunt me quondam consiliarii mei, et quem maxime diligebam, aversatus est me."
      en: "They that were sometime my counsellors, have abhorred me: and he whom I love most is turned against me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Pelli meae, consumptis carnibus, adhaesit os meum, et derelicta sunt tantummodo labia circa dentes meos."
      en: "The flesh being consumed. My bone hath cleaved to my skin, and nothing but lips are left about my teeth."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Miseremini mei, miseremini mei, saltem vos, amici mei, quia manus Domini tetigit me."
      en: "Have pity on me, have pity on me, at least you my friends, because the hand of the Lord hath touched me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quare persequimini me sicut Deus, et carnibus meis saturamini?"
      en: "Why do you persecute me as God, and glut yourselves with my flesh?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quis mihi tribuat ut scribantur sermones mei? quis mihi det ut exarentur in libro,"
      en: "Who will grant me that my words may be written? Who will grant me that they may be marked down in a book?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "stylo ferreo et plumbi lamina, vel celte sculpantur in silice?"
      en: "With an iron pen and in a plate of lead, or else be graven with an instrument in flint stone."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Scio enim quod redemptor meus vivit, et in novissimo die de terra surrecturus sum:"
      en: "For I know that my Redeemer liveth, and in the last day I shall rise out of the earth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et rursum circumdabor pelle mea, et in carne mea videbo Deum meum."
      en: "And I shall be clothed again with my skin, and in my flesh I will see my God."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quem visurus sum ego ipse, et oculi mei conspecturi sunt, et non alius: reposita est haec spes mea in sinu meo."
      en: "Whom I myself shall see, and my eyes shall behold, and not another: this my hope is laid up in my bosom."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quare ergo nunc dicitis: Persequamur eum, et radicem verbi inveniamus contra eum?"
      en: "Why then do you say now: Let us persecute him, and let us find occasion of word against him?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Fugite ergo a facie gladii, quoniam ultor iniquitatum gladius est: et scitote esse judicium."
      en: "Flee then from the face of the sword, for the sword is the revenger of iniquities: and know ye that there is judgment."
    status: { la: verified, en: verified }
