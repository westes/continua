# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 44
verses:
  - n: 1
    text:
      la: "praecepit autem Ioseph dispensatori domus suae dicens imple saccos eorum frumento quantum possunt capere et pone pecuniam singulorum in summitate sacci"
      en: "And Joseph commanded the steward of his house, saying: Fill their sacks with corn, as much as they can hold: and put the money of every one in the top of his sack."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "scyphum autem meum argenteum et pretium quod dedit tritici pone in ore sacci iunioris factumque est ita"
      en: "And in the mouth of the younger's sack put my silver cup, and the price which he gave for the wheat. And it was so done."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et orto mane dimissi sunt cum asinis suis"
      en: "And when the morning arose, they were sent away with their asses."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "iamque urbem exierant et processerant paululum tum Ioseph arcessito dispensatore domus surge inquit persequere viros et adprehensis dicito quare reddidistis malum pro bono"
      en: "And when they were now departed out of the city, and had gone forward a little way; Joseph sendingfor the steward of his house, said: Arise, and pursue after the men: and when thou hast overtaken them, say to them: Why have you returned evil for good?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "scyphum quem furati estis ipse est in quo bibit dominus meus et in quo augurari solet pessimam rem fecistis"
      en: "The cup which you have stolen is that in which my lord drinketh, and in which he is wont to divine: you have done a very evil thing."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "fecit ille ut iusserat et adprehensis per ordinem locutus est"
      en: "He did as he had commanded him. And having overtaken them, he spoke to them the same words."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui responderunt quare sic loquitur dominus noster ut servi tui tantum flagitii commiserint"
      en: "And they answered: Why doth our lord speak so, as though thy servants had committed so heinous a fact?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "pecuniam quam invenimus in summitate saccorum reportavimus ad te de terra Chanaan et quomodo consequens est ut furati simus de domo domini tui aurum vel argentum"
      en: "The money, that we found in the top of our sacks, we brought back to thee from the land of Chanaan: how then should it be that we should steal out of thy lord's house, gold or silver?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "apud quemcumque fuerit inventum servorum tuorum quod quaeris moriatur et nos servi erimus domini nostri"
      en: "With whomsoever of thy servants shall be found that which thou seekest, let him die, and we will be the bondmen of my lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui dixit fiat iuxta vestram sententiam apud quem fuerit inventum ipse sit servus meus vos autem eritis innoxii"
      en: "And he said to them: Let it be according to your sentence: with whomsoever it shall be found, let him be my servant, and you shall be blameless."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "itaque festinato deponentes in terram saccos aperuerunt singuli"
      en: "Them they speedily took down their sacks to the ground, and every man opened his sack."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quos scrutatus incipiens a maiore usque ad minimum invenit scyphum in sacco Beniamin"
      en: "Which when he had searched, beginning at the eldest and ending at the youngest, he found the cup in Benjamin's sack."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "at illi scissis vestibus oneratisque rursum asinis reversi sunt in oppidum"
      en: "Then they rent their garments, and loading their asses again, returned into the town."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "primusque Iudas cum fratribus ingressus est ad Ioseph necdum enim de loco abierat omnesque ante eum in terra pariter corruerunt"
      en: "And Juda at the head of his brethren went in to Joseph, (for he was not yet gone out of the place, ) and they altogether fell down before him on the ground."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quibus ille ait cur sic agere voluistis an ignoratis quod non sit similis mei in augurandi scientia"
      en: "And he said to them: Why would you do so? know you not that there is no one like me in the science of divining."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cui Iudas quid respondebimus inquit domino meo vel quid loquemur aut iusti poterimus obtendere Deus invenit iniquitatem servorum tuorum en omnes servi sumus domini mei et nos et apud quem inventus est scyphus"
      en: "And Juda said to him: What shall we answer my lord? or what shall we say, or be able justly to allege? God hath found out the iniquity of thy servants: behold, we are all bondmen to my lord, both we, and he with whom the cup was found."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "respondit Ioseph absit a me ut sic agam qui furatus est scyphum ipse sit servus meus vos autem abite liberi ad patrem vestrum"
      en: "Joseph answered: God forbid that should do so: he that stole the cup, he shall be my bondman: and go you away free to your father."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "accedens propius Iudas confidenter ait oro domine mi loquatur servus tuus verbum in auribus tuis et ne irascaris famulo tuo tu es enim post Pharaonem"
      en: "Then Juda coming hearer, said boldly: I beseech thee, my lord, let thy servant speak a word in thy ears,and be not angry with thy servant: for after Pharao thou art,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dominus meus interrogasti prius servos tuos habetis patrem aut fratrem"
      en: "My lord. Thou didst ask thy servants the first time: Have you a father or a brother?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et nos respondimus tibi domino meo est nobis pater senex et puer parvulus qui in senecta illius natus est cuius uterinus frater est mortuus et ipsum solum habet mater sua pater vero tenere diligit eum"
      en: "And we answered thee, my lord: We have a father an old man, and a young boy, that was born in his old age; whose brother by the mother is dead: and he alone is left of his mother, and his father loveth him tenderly."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixistique servis tuis adducite eum ad me et ponam oculos meos super illum"
      en: "And thou saidst to thy servants: Bring him hither to me, and I will set my eyes on him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "suggessimus domino meo non potest puer relinquere patrem suum si enim illum dimiserit morietur"
      en: "We suggested to my lord: The boy cannot leave his father: for if he leave him, he will die."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et dixisti servis tuis nisi venerit frater vester minimus vobiscum non videbitis amplius faciem meam"
      en: "And thou saidst to thy servants: Except your youngest brother come with you, you shall see my face no more."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cum ergo ascendissemus ad famulum tuum patrem nostrum narravimus ei omnia quae locutus est dominus meus"
      en: "Therefore when we were gone up to thy servant our father, we told him all that my lord had said."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et dixit pater noster revertimini et emite nobis parum tritici"
      en: "And our father said: Go again, and buy us a little wheat."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cui diximus ire non possumus si frater noster minimus descendet nobiscum proficiscemur simul alioquin illo absente non audemus videre faciem viri"
      en: "And we said to him: We cannot go: if our youngest brother go down with us, we will set out together: otherwise, without him we dare not see the man's face."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "atque ille respondit vos scitis quod duos genuerit mihi uxor mea"
      en: "Whereunto he answered: You know that my wife bore two."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "egressus est unus et dixistis bestia devoravit eum et hucusque non conparet"
      en: "One went out, and you said: A beast devoured him: and hitherto he appeareth not."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "si tuleritis et istum et aliquid ei in via contigerit deducetis canos meos cum maerore ad inferos"
      en: "If you take this also, and any thing befall him in the way you will bring down my gray hairs with sorrow unto hell."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "igitur si intravero ad servum tuum patrem nostrum et puer defuerit cum anima illius ex huius anima pendeat"
      en: "Therefore if I shall go to thy servant our father, and the boy be wanting, (whereas his life dependeth upon the life of him,)"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "videritque eum non esse nobiscum morietur et deducent famuli tui canos eius cum dolore ad inferos"
      en: "And he shall see that he is not with us, he will die, and thy servants shall bring down his gray hairs with sorrow unto hell."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ego proprie servus tuus qui in meam hunc recepi fidem et spopondi dicens nisi reduxero eum peccati reus ero in patrem meum omni tempore"
      en: "Let me be tht proper servant, who took him into my trust, and promised, saying: If I bring him not again, I will be guilty of sin against my father for ever."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "manebo itaque servus tuus pro puero in ministerium domini mei et puer ascendat cum fratribus suis"
      en: "Therefore I thy servant will stay instead of the boy in the service of my lord, and let the boy go up with his brethren."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "non enim possum redire ad patrem absente puero ne calamitatis quae oppressura est patrem meum testis adsistam"
      en: "For I cannot return to my father without the boy, lest I be a witness of the calamity that will oppress my father."
    status: { la: verified, en: verified }
