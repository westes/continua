# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 9
verses:
  - n: 1
    text:
      la: "Benedixitque Deus Noe et filiis ejus. Et dixit ad eos: Crescite, et multiplicamini, et replete terram."
      en: "And God blessed Noe and his sons. And he said to them: Increase and multiply, and fill the earth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et terror vester ac tremor sit super cuncta animalia terrae, et super omnes volucres caeli, cum universis quae moventur super terram: omnes pisces maris manui vestrae traditi sunt."
      en: "And let the fear and dread of you be upon all the beasts of the earth, and upon all the fowls of the air, and all that move upon the earth: all the fishes of the sea are delivered into your hand."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et omne, quod movetur et vivit, erit vobis in cibum: quasi olera virentia tradidi vobis omnia."
      en: "And every thing that moveth and liveth shall be meat for you: even as the green herbs have I delivered them all to you:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Excepto, quod carnem cum sanguine non comedetis."
      en: "Saving that flesh with blood you shall not eat."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sanguinem enim animarum vestrarum requiram de manu cunctarum bestiarum: et de manu hominis, de manu viri, et fratris ejus requiram animam hominis."
      en: "For I will require the blood of your lives at the hand of every beast, and at the hand of man, at the hand of every man, and of his brother, will I require the life of man."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quicumque effuderit humanum sanguinem, fundetur sanguis illius: ad imaginem quippe Dei factus est homo."
      en: "Whosoever shall shed man's blood, his blood shall be shed: for man was made to the image of God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vos autem crescite et multiplicamini, et ingredimini super terram, et implete eam."
      en: "But increase you and multiply, and go upon the earth, and fill it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Haec quoque dixit Deus ad Noe, et ad filios ejus cum eo:"
      en: "Thus also said God to Noe, and to his sons with him,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ecce ego statuam pactum meum vobiscum, et cum semine vestro post vos:"
      en: "Behold I will establish my covenant with you, and with your seed after you:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ad omnem animam viventem, quae est vobiscum, tam in volucribus quam in jumentis et pecudibus terrae cunctis, quae egressa sunt de arca, et universis bestiis terrae."
      en: "And with every living soul that is with you, as well in all birds as in cattle and beasts of the earth, that are come forth out of the ark, and in all the beasts of the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Statuam pactum meum vobiscum, et nequaquam ultra interficietur omnis caro aquis diluvii, neque erit deinceps diluvium dissipans terram."
      en: "I will establish my covenant with you, and all flesh shall be no more destroyed with the waters of a flood, neither shall there be from henceforth a flood to waste the earth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dixitque Deus: Hoc signum foederis quod do inter me et vos, et ad omnem animam viventem, quae est vobiscum in generationes sempiternas:"
      en: "And God said: This is the sign of the covenant which I give between me and you, and to every living soul that is with you, for perpetual generations."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "arcum meum ponam in nubibus, et erit signum foederis inter me et inter terram."
      en: "I will set my bow in the clouds, and it shall be the sign of a covenant between me, and between the earth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cumque obduxero nubibus caelum, apparebit arcus meus in nubibus:"
      en: "And when I shall cover the sky with clouds, my bow shall appear in the clouds:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et recordabor foederis mei vobiscum, et cum omni anima vivente quae carnem vegetat: et non erunt ultra aquae diluvii ad delendum universam carnem."
      en: "And I will remember my covenant with you, and with every living soul that beareth flesh: and there shall no more be waters of a flood to destroy all flesh."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Eritque arcus in nubibus, et videbo illum, et recordabor foederis sempiterni quod pactum est inter Deum et omnem animam viventem universae carnis quae est super terram."
      en: "And the bow shall be in the clouds, and I shall see it, and shall remember the everlasting covenant, that was made between God and every living soul of all flesh which is upon the earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixitque Deus ad Noe: Hoc erit signum foederis, quod constitui inter me et omnem carnem super terram."
      en: "And God said to Noe: This shall be the sign of the covenant which I have established between me and all flesh upon the earth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Erant ergo filii Noe, qui egressi sunt de arca, Sem, Cham et Japheth: porro Cham ipse est pater Chanaan."
      en: "And the sons of Noe who came out of the ark, were Sem, Cham, and Japheth: and Cham is the father of Chanaan."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tres isti filii sunt Noe: et ab his disseminatum est omne genus hominum super universam terram."
      en: "These three are the sons of Noe: and from these was all mankind spread over the whole earth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Coepitque Noe vir agricola exercere terram, et plantavit vineam."
      en: "And Noe, a husbandman, began to till the ground, and planted a vineyard."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Bibensque vinum inebriatus est, et nudatus in tabernaculo suo."
      en: "And drinking of the wine was made drunk, and was uncovered in his tent."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quod cum vidisset Cham, pater Chanaan, verenda scilicet patris sui esse nudata, nuntiavit duobus fratribus suis foras."
      en: "Which when Cham the father of Chanaan had seen, to wit, that his father's nakedness was uncovered, he told it to his two brethren without."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "At vero Sem et Japheth pallium imposuerunt humeris suis, et incedentes retrorsum, operuerunt verenda patris sui: faciesque eorum aversae erant, et patris virilia non viderunt."
      en: "But Sem and Japheth put a cloak upon their shoulders, and going backward, covered the nakedness of their father: and their faces were turned away, and they saw not their father's nakedness."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Evigilans autem Noe ex vino, cum didicisset quae fecerat ei filius suus minor,"
      en: "And Noe awaking from the wine, when he had learned what his younger son had done to him,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ait: Maledictus Chanaan, servus servorum erit fratribus suis."
      en: "He said: Cursed be Chanaan, a servant of servants shall he be unto his brethren."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dixitque: Benedictus Dominus Deus Sem, sit Chanaan servus ejus."
      en: "And he said: Blessed be the Lord God of Sem, be Chanaan his servant."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Dilatet Deus Japheth, et habitet in tabernaculis Sem, sitque Chanaan servus ejus."
      en: "May God enlarge Japheth, and may he dwell in the tents of Sem, and Chanaan be his servant."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Vixit autem Noe post diluvium trecentis quinquaginta annis."
      en: "And Noe lived after the flood three hundred and fifty years:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et impleti sunt omnes dies ejus nongentorum quinquaginta annorum: et mortuus est."
      en: "And all his days were in the whole nine hundred and fifty years: and he died."
    status: { la: verified, en: verified }
