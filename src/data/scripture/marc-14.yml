# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: marc
chapter: 14
verses:
  - n: 1
    text:
      la: "erat autem pascha et azyma post biduum et quaerebant summi sacerdotes et scribae quomodo eum dolo tenerent et occiderent"
      en: "Now the feast of the pasch, and of the Azymes was after two days; and the chief priests and the scribes sought how they might by some wile lay hold on him, and kill him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dicebant enim non in die festo ne forte tumultus fieret populi"
      en: "But they said: Not on the festival day, lest there should be a tumult among the people."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et cum esset Bethaniae in domo Simonis leprosi et recumberet venit mulier habens alabastrum unguenti nardi spicati pretiosi et fracto alabastro effudit super caput eius"
      en: "And when he was in Bethania, in the house of Simon the leper, and was at meat, there came a woman having an alabaster box of ointment of precious spikenard: and breaking the alabaster box, she poured it out upon his head."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "erant autem quidam indigne ferentes intra semet ipsos et dicentes ut quid perditio ista unguenti facta est"
      en: "Now there were some that had indignation within themselves, and said: Why was this waste of the ointment made?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "poterat enim unguentum istud veniri plus quam trecentis denariis et dari pauperibus et fremebant in eam"
      en: "For this ointment might have been sold for more than three hundred pence, and given to the poor. And they murmured against her."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Iesus autem dixit sinite eam quid illi molesti estis bonum opus operata est in me"
      en: "But Jesus said: Let her alone, why do you molest her? She hath wrought a good work upon me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "semper enim pauperes habetis vobiscum et cum volueritis potestis illis benefacere me autem non semper habetis"
      en: "For the poor you have always with you: and whensoever you will, you may do them good: but me you have not always."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quod habuit haec fecit praevenit unguere corpus meum in sepulturam"
      en: "She hath done what she could: she is come beforehand to anoint my body for burial."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "amen dico vobis ubicumque praedicatum fuerit evangelium istud in universum mundum et quod fecit haec narrabitur in memoriam eius"
      en: "Amen, I say to you, wheresoever this gospel shall be preached in the whole world, that also which she hath done, shall be told for a memorial of her."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et Iudas Scariotis unus de duodecim abiit ad summos sacerdotes ut proderet eum illis"
      en: "And Judas Iscariot, one of the twelve, went to the chief priests, to betray him to them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui audientes gavisi sunt et promiserunt ei pecuniam se daturos et quaerebat quomodo illum oportune traderet"
      en: "Who hearing it were glad; and they promised him they would give him money. And he sought how he might conveniently betray him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et primo die azymorum quando pascha immolabant dicunt ei discipuli quo vis eamus et paremus tibi ut manduces pascha"
      en: "Now on the first day of the unleavened bread, when they sacrificed the pasch, the disciples say to him: Whither wilt thou that we go, and prepare for thee to eat the pasch?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et mittit duos ex discipulis suis et dicit eis ite in civitatem et occurret vobis homo laguenam aquae baiulans sequimini eum"
      en: "And he sendeth two of his disciples, and saith to them: Go ye into the city; and there shall meet you a man carrying a pitcher of water, follow him;"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et quocumque introierit dicite domino domus quia magister dicit ubi est refectio mea ubi pascha cum discipulis meis manducem"
      en: "And whithersoever he shall go in, say to the master of the house, The master saith, Where is my refectory, where I may eat the pasch with my disciples?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ipse vobis demonstrabit cenaculum grande stratum et illic parate nobis"
      en: "And he will shew you a large dining room furnished; and there prepare ye for us."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et abierunt discipuli eius et venerunt in civitatem et invenerunt sicut dixerat illis et praeparaverunt pascha"
      en: "And his disciples went their way, and came into the city; and they found as he had told them, and they prepared the pasch."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "vespere autem facto venit cum duodecim"
      en: "And when evening was come, he cometh with the twelve."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et discumbentibus eis et manducantibus ait Iesus amen dico vobis quia unus ex vobis me tradet qui manducat mecum"
      en: "And when they were at table and eating, Jesus saith: Amen I say to you, one of you that eateth with me shall betray me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "at illi coeperunt contristari et dicere ei singillatim numquid ego"
      en: "But they began to be sorrowful, and to say to him one by one: Is it I?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui ait illis unus ex duodecim qui intinguit mecum in catino"
      en: "Who saith to them: One of the twelve, who dippeth with me his hand in the dish."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et Filius quidem hominis vadit sicut scriptum est de eo vae autem homini illi per quem Filius hominis traditur bonum ei si non esset natus homo ille"
      en: "And the Son of man indeed goeth, as it is written of him: but woe to that man by whom the Son of man shall be betrayed. It were better for him, if that man had not been born."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et manducantibus illis accepit Iesus panem et benedicens fregit et dedit eis et ait sumite hoc est corpus meum"
      en: "And whilst they were eating, Jesus took bread; and blessing, broke, and gave to them, and said: Take ye. This is my body."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et accepto calice gratias agens dedit eis et biberunt ex illo omnes"
      en: "And having taken the chalice, giving thanks, he gave it to them. And they all drank of it."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et ait illis hic est sanguis meus novi testamenti qui pro multis effunditur"
      en: "And he said to them: This is my blood of the new testament, which shall be shed for many."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "amen dico vobis quod iam non bibam de genimine vitis usque in diem illum cum illud bibam novum in regno Dei"
      en: "Amen I say to you, that I will drink no more of the fruit of the vine, until that day when I shall drink it new in the kingdom of God."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et hymno dicto exierunt in montem Olivarum"
      en: "And when they had said an hymn, they went forth to the mount of Olives."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et ait eis Iesus omnes scandalizabimini in nocte ista quia scriptum est percutiam pastorem et dispergentur oves"
      en: "And Jesus saith to them: You will all be scandalized in my regard this night; for it is written, I will strike the shepherd, and the sheep shall be dispersed."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sed posteaquam resurrexero praecedam vos in Galilaeam"
      en: "But after I shall be risen again, I will go before you into Galilee."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Petrus autem ait ei et si omnes scandalizati fuerint sed non ego"
      en: "But Peter saith to him: Although all shall be scandalized in thee, yet not I."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et ait illi Iesus amen dico tibi quia tu hodie in nocte hac priusquam bis gallus vocem dederit ter me es negaturus"
      en: "And Jesus saith to him: Amen I say to thee, to day, even in this night, before the cock crow twice, thou shall deny me thrice."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "at ille amplius loquebatur et si oportuerit me simul conmori tibi non te negabo similiter autem et omnes dicebant"
      en: "But he spoke the more vehemently: Although I should die together with thee, I will not deny thee. And in like manner also said they all."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et veniunt in praedium cui nomen Gethsemani et ait discipulis suis sedete hic donec orem"
      en: "And they came to a farm called Gethsemani. And he saith to his disciples: Sit you here, while I pray."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et adsumit Petrum et Iacobum et Iohannem secum et coepit pavere et taedere"
      en: "And he taketh Peter and James and John with him; and he began to fear and to be heavy."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et ait illis tristis est anima mea usque ad mortem sustinete hic et vigilate"
      en: "And he saith to them: My soul is sorrowful even unto death; stay you here, and watch."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et cum processisset paululum procidit super terram et orabat ut si fieri posset transiret ab eo hora"
      en: "And when he was gone forward a little, he fell flat on the ground; and he prayed, that if it might be, the hour might pass from him."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et dixit Abba Pater omnia possibilia tibi sunt transfer calicem hunc a me sed non quod ego volo sed quod tu"
      en: "And he saith: Abba, Father, all things are possible to thee: remove this chalice from me; but not what I will, but what thou wilt."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et venit et invenit eos dormientes et ait Petro Simon dormis non potuisti una hora vigilare"
      en: "And he cometh, and findeth them sleeping. And he saith to Peter: Simon, sleepest thou? couldst thou not watch one hour?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "vigilate et orate ut non intretis in temptationem spiritus quidem promptus caro vero infirma"
      en: "Watch ye, and pray that you enter not into temptation. The spirit indeed is willing, but the flesh is weak."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et iterum abiens oravit eundem sermonem dicens"
      en: "A going away again, he prayed, saying the same words."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et reversus denuo invenit eos dormientes erant enim oculi illorum ingravati et ignorabant quid responderent ei"
      en: "And when he returned, he found them again asleep, (for their eyes were heavy,) and they knew not what to answer him."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et venit tertio et ait illis dormite iam et requiescite sufficit venit hora ecce traditur Filius hominis in manus peccatorum"
      en: "And he cometh the third time, and saith to them: Sleep ye now, and take your rest. It is enough: the hour is come: behold the Son of man shall be betrayed into the hands of sinners."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "surgite eamus ecce qui me tradit prope est"
      en: "Rise up, let us go. Behold, he that will betray me is at hand."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et adhuc eo loquente venit Iudas Scarioth unus ex duodecim et cum illo turba cum gladiis et lignis a summis sacerdotibus et a scribis et a senioribus"
      en: "And while he was yet speaking, cometh Judas Iscariot, one of the twelve: and with him a great multitude with swords and staves, from the chief priests and the scribes and the ancients."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "dederat autem traditor eius signum eis dicens quemcumque osculatus fuero ipse est tenete eum et ducite"
      en: "And he that betrayed him, had given them a sign, saying: Whomsoever I shall kiss, that is he; lay hold on him, and lead him away carefully."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et cum venisset statim accedens ad eum ait rabbi et osculatus est eum"
      en: "And when he was come, immediately going up to him, he saith: Hail, Rabbi; and he kissed him."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "at illi manus iniecerunt in eum et tenuerunt eum"
      en: "But they laid hands on him, and held him."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "unus autem quidam de circumstantibus educens gladium percussit servum summi sacerdotis et amputavit illi auriculam"
      en: "An one of them that stood by, drawing a sword, struck a servant of the chief priest, and cut off his ear."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et respondens Iesus ait illis tamquam ad latronem existis cum gladiis et lignis conprehendere me"
      en: "And Jesus answering, said to them: Are you come out as to a robber, with swords and staves to apprehend me?"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "cotidie eram apud vos in templo docens et non me tenuistis sed ut adimpleantur scripturae"
      en: "I was daily with you in the temple teaching, and you did not lay hands on me. But that the scriptures may be fulfilled."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "tunc discipuli eius relinquentes eum omnes fugerunt"
      en: "Then his disciples leaving him, all fled away."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "adulescens autem quidam sequebatur illum amictus sindone super nudo et tenuerunt eum"
      en: "And a certain young man followed him, having a linen cloth cast about his naked body; and they laid hold on him."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "at ille reiecta sindone nudus profugit ab eis"
      en: "But he, casting off the linen cloth, fled from them naked."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et adduxerunt Iesum ad summum sacerdotem et conveniunt omnes sacerdotes et scribae et seniores"
      en: "And they brought Jesus to the high priest; and all the priests and the scribes and the ancients assembled together."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Petrus autem a longe secutus est eum usque intro in atrium summi sacerdotis et sedebat cum ministris et calefaciebat se ad ignem"
      en: "And Peter followed him from afar off, even into the court of the high priest; and he sat with the servants at the fire, and warmed himself."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "summi vero sacerdotes et omne concilium quaerebant adversum Iesum testimonium ut eum morti traderent nec inveniebant"
      en: "And the chief priests and all the council sought for evidence against Jesus, that they might put him to death, and found none."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "multi enim testimonium falsum dicebant adversus eum et convenientia testimonia non erant"
      en: "For many bore false witness against him, and their evidences were not agreeing."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "et quidam surgentes falsum testimonium ferebant adversus eum dicentes"
      en: "And some rising up, bore false witness against him, saying:"
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "quoniam nos audivimus eum dicentem ego dissolvam templum hoc manufactum et per triduum aliud non manufactum aedificabo"
      en: "We heard him say, I will destroy this temple made with hands, and within three days I will build another not made with hands."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "et non erat conveniens testimonium illorum"
      en: "And their witness did not agree."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "et exsurgens summus sacerdos in medium interrogavit Iesum dicens non respondes quicquam ad ea quae tibi obiciuntur ab his"
      en: "And the high priest rising up in the midst, asked Jesus, saying: Answerest thou nothing to the things that are laid to thy charge by these men?"
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "ille autem tacebat et nihil respondit rursum summus sacerdos interrogabat eum et dicit ei tu es Christus Filius Benedicti"
      en: "But he held his peace, and answered nothing. Again the high priest asked him, and said to him: Art thou the Christ the Son of the blessed God?"
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Iesus autem dixit illi ego sum et videbitis Filium hominis a dextris sedentem Virtutis et venientem cum nubibus caeli"
      en: "And Jesus said to him: I am. And you shall see the Son of man sitting on the right hand of the power of God, and coming with the clouds of heaven."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "summus autem sacerdos scindens vestimenta sua ait quid adhuc desideramus testes"
      en: "Then the high priest rending his garments, saith: What need we any further witnesses?"
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "audistis blasphemiam quid vobis videtur qui omnes condemnaverunt eum esse reum mortis"
      en: "You have heard the blasphemy. What think you? Who all condemned him to be guilty of death."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "et coeperunt quidam conspuere eum et velare faciem eius et colaphis eum caedere et dicere ei prophetiza et ministri alapis eum caedebant"
      en: "And some began to spit on him, and to cover his face, and to buffet him, and to say unto him: Prophesy: and the servants struck him with the palms of their hands."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "et cum esset Petrus in atrio deorsum venit una ex ancillis summi sacerdotis"
      en: "Now when Peter was in the court below, there cometh one of the maidservants of the high priest."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "et cum vidisset Petrum calefacientem se aspiciens illum ait et tu cum Iesu Nazareno eras"
      en: "And when she had seen Peter warming himself, looking on him she saith: Thou also wast with Jesus of Nazareth."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "at ille negavit dicens neque scio neque novi quid dicas et exiit foras ante atrium et gallus cantavit"
      en: "But he denied, saying: I neither know nor understand what thou sayest. And he went forth before the court; and the cock crew."
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "rursus autem cum vidisset illum ancilla coepit dicere circumstantibus quia hic ex illis est"
      en: "And again a maidservant seeing him, began to say to the standers by: This is one of them."
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "at ille iterum negavit et post pusillum rursus qui adstabant dicebant Petro vere ex illis es nam et Galilaeus es"
      en: "But he denied again. And after a while they that stood by said again to Peter: Surely thou art one of them; for thou art also a Galilean."
    status: { la: verified, en: verified }
  - n: 71
    text:
      la: "ille autem coepit anathematizare et iurare quia nescio hominem istum quem dicitis"
      en: "But he began to curse and to swear, saying; I know not this man of whom you speak."
    status: { la: verified, en: verified }
  - n: 72
    text:
      la: "et statim iterum gallus cantavit et recordatus est Petrus verbi quod dixerat ei Iesus priusquam gallus cantet bis ter me negabis et coepit flere"
      en: "And immediately the cock crew again. And Peter remembered the word that Jesus had said unto him: Before the cock crow twice, thou shalt thrice deny me. And he began to weep."
    status: { la: verified, en: verified }
