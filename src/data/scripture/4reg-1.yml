# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 1
verses:
  - n: 1
    text:
      la: "Praevaricatus est autem Moab in Israel, postquam mortuus est Achab."
      en: "And Moab rebelled against Israel, after the death of Achab."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ceciditque Ochozias per cancellos coenaculi sui, quod habebat in Samaria, et aegrotavit: misitque nuntios, dicens ad eos: Ite, consulite Beelzebub deum Accaron, utrum vivere queam de infirmitate mea hac."
      en: "And Ochozias fell through the lattices of his upper chamber which he had in Samaria, and was sick: and he sent messengers, saying to them: Go, consult Beelzebub, the god of Accaron, whether I shall recover of this my illness."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Angelus autem Domini locutus est ad Eliam Thesbiten, dicens: Surge, et ascende in occursum nuntiorum regis Samariae, et dices ad eos: Numquid non est Deus in Israel, ut eatis ad consulendum Beelzebub deum Accaron?"
      en: "And an angel of the Lord spoke to Elias the Thesbite, saying: Arise, and go up to meet the messengers of the king of Samaria, and say to them: Is there not a God in Israel, that ye go to consult Beelzebub the god of Accaron?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quam ob rem haec dicit Dominus: De lectulo, super quem ascendisti, non descendes, sed morte morieris. Et abiit Elias."
      en: "Wherefore thus saith the Lord: From the bed, on which thou art gone up, thou shalt not come down, but thou shalt surely die. And Elias went away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Reversique sunt nuntii ad Ochoziam. Qui dixit eis: Quare reversi estis?"
      en: "And the messengers turned back to Ochozias. And he said to them: Why are you come back?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "At illi responderunt ei: Vir occurrit nobis, et dixit ad nos: Ite, et revertimini ad regem, qui misit vos, et dicetis ei: Haec dicit Dominus: Numquid, quia non erat Deus in Israel, mittis ut consulatur Beelzebub deus Accaron? Idcirco de lectulo, super quem ascendisti, non descendes, sed morte morieris."
      en: "But they answered him: A man met us, and said to us: Go, and return to the king, that sent you, and you shall say to him: Thus saith the Lord: Is it because there was no God in Israel that thou sendest to Beelzebub the god of Accaron? Therefore thou shalt not come down from the bed, on which thou art gone up, but thou shalt surely die."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui dixit eis: Cujus figurae et habitus est vir ille, qui occurrit vobis, et locutus est verba haec?"
      en: "And he said to them: What manner of man was he who met you, and spoke these words?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "At illi dixerunt: Vir pilosus, et zona pellicea accinctus renibus. Qui ait: Elias Thesbites est."
      en: "But they said: A hairy man with a girdle of leather about his loins. And he said: It is Elias the Thesbite."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Misitque ad eum quinquagenarium principem, et quinquaginta qui erant sub eo. Qui ascendit ad eum: sedentique in vertice montis, ait: Homo Dei, rex praecepit ut descendas."
      en: "And he sent to him a captain of fifty, and the fifty men that were under him. And he went up to him, and as he was sitting on the top of a hill, said to him: Man of God, the king hath commanded that thou come down."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Respondensque Elias, dixit quinquagenario: Si homo Dei sum, descendat ignis de caelo, et devoret te, et quinquaginta tuos. Descendit itaque ignis de caelo, et devoravit eum, et quinquaginta qui erant cum eo."
      en: "And Elias answering, said to the captain of fifty: If I be a man of God, let fire come down from heaven, and consume thee, and thy fifty. And there came down fire from heaven, and consumed him, and the fifty that were with him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Rursumque misit ad eum principem quinquagenarium alterum, et quinquaginta cum eo. Qui locutus est illi: Homo Dei, haec dicit rex: Festina, descende."
      en: "And again he sent to him another captain of fifty men, and his fifty with him. And he said to him: Man of God, thus saith the king: Make haste and come down."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Respondens Elias, ait: Si homo Dei ego sum, descendat ignis de caelo, et devoret te, et quinquaginta tuos. Descendit ergo ignis de caelo, et devoravit illum, et quinquaginta ejus."
      en: "Elias answering, said: If I be a man of God, let fire come down from heaven, and consume thee and thy fifty. And fire came down from heaven, and consumed him and his fifty."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Iterum misit principem quinquagenarium tertium, et quinquaginta qui erant cum eo. Qui cum venisset, curvavit genua contra Eliam, et precatus est eum, et ait: Homo Dei, noli despicere animam meam, et animas servorum tuorum qui mecum sunt."
      en: "Again he sent a third captain of fifty men, and the fifty that were with him. And when he was come, he fell upon his knees, before Elias, and besought him and said: Man of God, despise not my life, and the lives of thy servants that are with me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ecce descendit ignis de caelo, et devoravit duos principes quinquagenarios primos, et quinquagenos qui cum eis erant: sed nunc obsecro ut miserearis animae meae."
      en: "Behold fire came down from heaven, and consumed the two first captains of fifty men, and the fifties that were with them: but now I beseech thee to spare my life."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Locutus est autem angelus Domini ad Eliam, dicens: Descende cum eo, ne timeas. Surrexit igitur, et descendit cum eo ad regem,"
      en: "And the angel of the Lord spoke to Elias, saying: Go down with him, fear not. He arose therefore, and went down with him to the king,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et locutus est ei: Haec dicit Dominus: Quia misisti nuntios ad consulendum Beelzebub deum Accaron, quasi non esset Deus in Israel, a quo posses interrogare sermonem, ideo de lectulo super quem ascendisti, non descendes, sed morte morieris."
      en: "And said to him: Thus saith the Lord: Because thou hast sent messengers to consult Beelzebub the god of Accaron, as though there were not a God in Israel, of whom thou mightest inquire the word; therefore from the bed on which thou art gone up, thou shalt not come down, but thou shalt surely die."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Mortuus est ergo juxta sermonem Domini, quem locutus est Elias, et regnavit Joram frater ejus pro eo, anno secundo Joram filii Josaphat regis Judae: non enim habebat filium."
      en: "So he died according to the word of the Lord which Elias spoke, and Joram his brother reigned in his stead, in the second year of Joram the son of Josaphat king of Juda: because he had no son."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Reliqua autem verborum Ochoziae, quae operatus est, nonne haec scripta sunt in libro sermonum dierum regum Israel?"
      en: "But the rest of the acts of Ochozias which he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
