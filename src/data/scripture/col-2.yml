# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: col
chapter: 2
verses:
  - n: 1
    text:
      la: "Volo enim vos scire qualem sollicitudinem habeam pro vobis, et pro iis qui sunt Laodiciae, et quicumque non viderunt faciem meam in carne:"
      en: "For I would have you know, what manner of care I have for you and for them that are at Laodicea, and whosoever have not seen my face in the flesh:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ut consolentur corda ipsorum, instructi in caritate, et in omnes divitias plenitudinis intellectus, in agnitionem mysterii Dei Patris et Christi Jesu:"
      en: "That their hearts may be comforted, being instructed in charity, and unto all riches of fulness of understanding, unto the knowledge of the mystery of God the Father and of Christ Jesus:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in quo sunt omnes thesauri sapientiae et scientiae absconditi."
      en: "In whom are hid all the treasures of wisdom and knowledge."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Hoc autem dico, ut nemo vos decipiat in sublimitate sermonum."
      en: "Now this I say, that no man may deceive you by loftiness of words."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Nam etsi corpore absens sum, sed spiritu vobiscum sum: gaudens, et videns ordinem vestrum, et firmamentum ejus, quae in Christo est, fidei vestrae."
      en: "For though I be absent in body, yet in spirit I am with you; rejoicing, and beholding your order, and the steadfastness of your faith which is in Christ."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sicut ergo accepistis Jesum Christum Dominum, in ipso ambulate,"
      en: "As therefore you have received Jesus Christ the Lord, walk ye in him;"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "radicati, et superaedificati in ipso, et confirmati fide, sicut et didicistis, abundantes in illo in gratiarum actione."
      en: "Rooted and built up in him, and confirmed in the faith, as also you have learned, abounding in him in thanksgiving."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Videte ne quis vos decipiat per philosophiam, et inanem fallaciam secundum traditionem hominum, secundum elementa mundi, et non secundum Christum:"
      en: "Beware lest any man cheat you by philosophy, and vain deceit; according to the tradition of men, according to the elements of the world, and not according to Christ:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia in ipso inhabitat omnis plenitudo divinitatis corporaliter:"
      en: "For in him dwelleth all the fulness of the Godhead corporeally;"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et estis in illo repleti, qui est caput omnis principatus et potestatis:"
      en: "And you are filled in him, who is the head of all principality and power:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in quo et circumcisi estis circumcisione non manu facta in expoliatione corporis carnis, sed in circumcisione Christi:"
      en: "In whom also you are circumcised with circumcision not made by hand, in despoiling of the body of the flesh, but in the circumcision of Christ:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "consepulti ei in baptismo, in quo et resurrexistis per fidem operationis Dei, qui suscitavit illum a mortuis."
      en: "Buried with him in baptism, in whom also you are risen again by the faith of the operation of God, who hath raised him up from the dead."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et vos cum mortui essetis in delictis, et praeputio carnis vestrae, convivificavit cum illo, donans vobis omnia delicta:"
      en: "And you, when you were dead in your sins, and the uncircumcision of your flesh; he hath quickened together with him, forgiving you all offences:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "delens quod adversus nos erat chirographum decreti, quod erat contrarium nobis, et ipsum tulit de medio, affigens illud cruci:"
      en: "Blotting out the handwriting of the decree that was against us, which was contrary to us. And he hath taken the same out of the way, fastening it to the cross:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et expolians principatus, et potestates traduxit confidenter, palam triumphans illos in semetipso."
      en: "And despoiling the principalities and powers, he hath exposed them confidently in open shew, triumphing over them in himself."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nemo ergo vos judicet in cibo, aut in potu, aut in parte diei festi, aut neomeniae, aut sabbatorum:"
      en: "Let no man therefore judge you in meat or in drink, or in respect of a festival day, or of the new moon, or of the sabbaths,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quae sunt umbra futurorum: corpus autem Christi."
      en: "Which are a shadow of things to come, but the body is of Christ."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Nemo vos seducat, volens in humilitate, et religione angelorum, quae non vidit ambulans, frustra inflatus sensu carnis suae,"
      en: "Let no man seduce you, willing in humility, and religion of angels, walking in the things which he hath not seen, in vain puffed up by the sense of his flesh,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et non tenens caput, ex quo totum corpus per nexus, et conjunctiones subministratum, et constructum crescit in augmentum Dei."
      en: "And not holding the head, from which the whole body, by joints and bands, being supplied with nourishment and compacted, groweth unto the increase of God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Si ergo mortui estis cum Christo ab elementis hujus mundi: quid adhuc tamquam viventes in mundo decernitis?"
      en: "If then you be dead with Christ from the elements of this world, why do you yet decree as though living in the world?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ne tetigeritis, neque gustaveritis, neque contrectaveritis:"
      en: "Touch not, taste not, handle not:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quae sunt omnia in interitum ipso usu, secundum praecepta et doctrinas hominum:"
      en: "Which all are unto destruction by the very use, according to the precepts and doctrines of men."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quae sunt rationem quidem habentia sapientiae in superstitione, et humilitate, et non ad parcendum corpori, non in honore aliquo ad saturitatem carnis."
      en: "Which things have indeed a shew of wisdom in superstition and humility, and not sparing the body; not in any honour to the filling of the flesh."
    status: { la: verified, en: verified }
