# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 8
verses:
  - n: 1
    text:
      la: "et factum est deinceps et ipse iter faciebat per civitatem et castellum praedicans et evangelizans regnum Dei et duodecim cum illo"
      en: "And it came to pass afterwards, that he travelled through the cities and towns, preaching and evangelizing the kingdom of God; and the twelve with him:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et mulieres aliquae quae erant curatae ab spiritibus malignis et infirmitatibus Maria quae vocatur Magdalene de qua daemonia septem exierant"
      en: "And certain women who had been healed of evil spirits and infirmities; Mary who is called Magdalen, out of whom seven devils were gone forth,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et Iohanna uxor Chuza procuratoris Herodis et Susanna et aliae multae quae ministrabant eis de facultatibus suis"
      en: "And Joanna the wife of Chusa, Herod's steward, and Susanna, and many others who ministered unto him of their substance."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cum autem turba plurima conveniret et de civitatibus properarent ad eum dixit per similitudinem"
      en: "And when a very great multitude was gathered together, and hastened out of the cities unto him, he spoke by a similitude."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "exiit qui seminat seminare semen suum et dum seminat aliud cecidit secus viam et conculcatum est et volucres caeli comederunt illud"
      en: "The sower went out to sow his seed. And as he sowed, some fell by the way side, and it was trodden down, and the fowls of the air devoured it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et aliud cecidit supra petram et natum aruit quia non habebat humorem"
      en: "And other some fell upon a rock: and as soon as it was sprung up, it withered away, because it had no moisture."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et aliud cecidit inter spinas et simul exortae spinae suffocaverunt illud"
      en: "And other some fell among thorns, and the thorns growing up with it, choked it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et aliud cecidit in terram bonam et ortum fecit fructum centuplum haec dicens clamabat qui habet aures audiendi audiat"
      en: "And other some fell upon good ground; and being sprung up, yielded fruit a hundredfold. Saying these things, he cried out: He that hath ears to hear, let him hear."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "interrogabant autem eum discipuli eius quae esset haec parabola"
      en: "And his disciples asked him what this parable might be."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quibus ipse dixit vobis datum est nosse mysterium regni Dei ceteris autem in parabolis ut videntes non videant et audientes non intellegant"
      en: "To whom he said: To you it is given to know the mystery of the kingdom of God; but to the rest in parables, that seeing they may not see, and hearing may not understand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "est autem haec parabola semen est verbum Dei"
      en: "Now the parable is this: The seed is the word of God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui autem secus viam sunt qui audiunt deinde venit diabolus et tollit verbum de corde eorum ne credentes salvi fiant"
      en: "And they by the way side are they that hear; then the devil cometh, and taketh the word out of their heart, lest believing they should be saved."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nam qui supra petram qui cum audierint cum gaudio suscipiunt verbum et hii radices non habent qui ad tempus credunt et in tempore temptationis recedunt"
      en: "Now they upon the rock, are they who when they hear, receive the word with joy: and these have no roots; for they believe for a while, and in time of temptation, they fall away."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quod autem in spinis cecidit hii sunt qui audierunt et a sollicitudinibus et divitiis et voluptatibus vitae euntes suffocantur et non referunt fructum"
      en: "And that which fell among thorns, are they who have heard, and going their way, are choked with the cares and riches and pleasures of this life, and yield no fruit."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quod autem in bonam terram hii sunt qui in corde bono et optimo audientes verbum retinent et fructum adferunt in patientia"
      en: "But that on the good ground, are they who in a good and perfect heart, hearing the word, keep it, and bring forth fruit in patience."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nemo autem lucernam accendens operit eam vaso aut subtus lectum ponit sed supra candelabrum ponit ut intrantes videant lumen"
      en: "Now no man lighting a candle covereth it with a vessel, or putteth it under a bed; but setteth it upon a candlestick, that they who come in may see the light."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "non enim est occultum quod non manifestetur nec absconditum quod non cognoscatur et in palam veniat"
      en: "For there is not any thing secret that shall not be made manifest, nor hidden, that shall not be known and come abroad."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "videte ergo quomodo auditis qui enim habet dabitur illi et quicumque non habet etiam quod putat se habere auferetur ab illo"
      en: "Take heed therefore how you hear. For whosoever hath, to him shall be given: and whosoever hath not, that also which he thinketh he hath, shall be taken away from him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "venerunt autem ad illum mater et fratres eius et non poterant adire ad eum prae turba"
      en: "And his mother and brethren came unto him; and they could not come at him for the crowd."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et nuntiatum est illi mater tua et fratres tui stant foris volentes te videre"
      en: "And it was told him: Thy mother and thy brethren stand without, desiring to see thee."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui respondens dixit ad eos mater mea et fratres mei hii sunt qui verbum Dei audiunt et faciunt"
      en: "Who answering, said to them: My mother and my brethren are they who hear the word of God, and do it."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "factum est autem in una dierum et ipse ascendit in naviculam et discipuli eius et ait ad illos transfretemus trans stagnum et ascenderunt"
      en: "And it came to pass on a certain day that he went into a little ship with his disciples, and he said to them: Let us go over to the other side of the lake. And they launched forth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "navigantibus autem illis obdormiit et descendit procella venti in stagnum et conplebantur et periclitabantur"
      en: "And when they were sailing, he slept; and there came down a storm of wind upon the lake, and they were filled, and were in danger."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "accedentes autem suscitaverunt eum dicentes praeceptor perimus at ille surgens increpavit ventum et tempestatem aquae et cessavit et facta est tranquillitas"
      en: "And they came and awaked him, saying: Master, we perish. But he arising, rebuked the wind and the rage of the water; and it ceased, and there was a calm."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixit autem illis ubi est fides vestra qui timentes mirati sunt dicentes ad invicem quis putas hic est quia et ventis imperat et mari et oboediunt ei"
      en: "And he said to them: Where is your faith? Who being afraid, wondered, saying one to another: Who is this, (think you), that he commandeth both the winds and the sea, and they obey him?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "enavigaverunt autem ad regionem Gerasenorum quae est contra Galilaeam"
      en: "And they sailed to the country of the Gerasens, which is over against Galilee."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et cum egressus esset ad terram occurrit illi vir quidam qui habebat daemonium iam temporibus multis et vestimento non induebatur neque in domo manebat sed in monumentis"
      en: "And when he was come forth to the land, there met him a certain man who had a devil now a very long time, and he wore no clothes, neither did he abide in a house, but in the sepulchres."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "is ut vidit Iesum procidit ante illum et exclamans voce magna dixit quid mihi et tibi est Iesu Fili Dei altissimi obsecro te ne me torqueas"
      en: "And when he saw Jesus, he fell down before him; and crying out with a loud voice, he said: What have I to do with thee, Jesus, Son of the most high God? I beseech thee, do not torment me."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "praecipiebat enim spiritui inmundo ut exiret ab homine multis enim temporibus arripiebat illum et vinciebatur catenis et conpedibus custoditus et ruptis vinculis agebatur a daemonio in deserta"
      en: "For he commanded the unclean spirit to go out of the man. For many times it seized him, and he was bound with chains, and kept in fetters; and breaking the bonds, he was driven by the devil into the deserts."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "interrogavit autem illum Iesus dicens quod tibi nomen est at ille dixit Legio quia intraverunt daemonia multa in eum"
      en: "And Jesus asked him, saying: What is thy name? But he said: Legion; because many devils were entered into him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et rogabant illum ne imperaret illis ut in abyssum irent"
      en: "And they besought him that he would not command them to go into the abyss."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "erat autem ibi grex porcorum multorum pascentium in monte et rogabant eum ut permitteret eos in illos ingredi et permisit illos"
      en: "And there was there a herd of many swine feeding on the mountain; and they besought him that he would suffer them to enter into them. And he suffered them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "exierunt ergo daemonia ab homine et intraverunt in porcos et impetu abiit grex per praeceps in stagnum et suffocatus est"
      en: "The devils therefore went out of the man, and entered into the swine; and the herd ran violently down a steep place into the lake, and were stifled."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "quod ut viderunt factum qui pascebant fugerunt et nuntiaverunt in civitatem et in villas"
      en: "Which when they that fed them saw done, they fled away, and told it in the city and in the villages."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "exierunt autem videre quod factum est et venerunt ad Iesum et invenerunt hominem sedentem a quo daemonia exierant vestitum ac sana mente ad pedes eius et timuerunt"
      en: "And they went out to see what was done; and they came to Jesus, and found the man, out of whom the devils were departed, sitting at his feet, clothed, and in his right mind; and they were afraid."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "nuntiaverunt autem illis et qui viderant quomodo sanus factus esset a Legione"
      en: "And they also that had seen, told them how he had been healed from the legion."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et rogaverunt illum omnis multitudo regionis Gerasenorum ut discederet ab ipsis quia timore magno tenebantur ipse autem ascendens navem reversus est"
      en: "And all the multitude of the country of the Gerasens besought him to depart from them; for they were taken with great fear. And he, going up into the ship, returned back again."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et rogabat illum vir a quo daemonia exierant ut cum eo esset dimisit autem eum Iesus dicens"
      en: "Now the man, out of whom the devils were departed, besought him that he might be with him. But Jesus sent him away, saying:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "redi domum tuam et narra quanta tibi fecit Deus et abiit per universam civitatem praedicans quanta illi fecisset Iesus"
      en: "Return to thy house, and tell how great things God hath done to thee. And he went through the whole city, publishing how great things Jesus had done to him."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "factum est autem cum redisset Iesus excepit illum turba erant enim omnes expectantes eum"
      en: "And it came to pass, that when Jesus was returned, the multitude received him: for they were all waiting for him."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et ecce venit vir cui nomen Iairus et ipse princeps synagogae erat et cecidit ad pedes Iesu rogans eum ut intraret in domum eius"
      en: "And behold there came a man whose name was Jairus, and he was a ruler of the synagogue: and he fell down at the feet of Jesus, beseeching him that he would come into his house:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "quia filia unica erat illi fere annorum duodecim et haec moriebatur et contigit dum iret a turbis conprimebatur"
      en: "For he had an only daughter, almost twelve years old, and she was dying. And it happened as he went, that he was thronged by the multitudes."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et mulier quaedam erat in fluxu sanguinis ab annis duodecim quae in medicos erogaverat omnem substantiam suam nec ab ullo potuit curari"
      en: "And there was a certain woman having an issue of blood twelve years, who had bestowed all her substance on physicians, and could not be healed by any."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "accessit retro et tetigit fimbriam vestimenti eius et confestim stetit fluxus sanguinis eius"
      en: "She came behind him, and touched the hem of his garment; and immediately the issue of her blood stopped."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et ait Iesus quis est qui me tetigit negantibus autem omnibus dixit Petrus et qui cum illo erant praeceptor turbae te conprimunt et adfligunt et dicis quis me tetigit"
      en: "And Jesus said: Who is it that touched me? And all denying, Peter and they that were with him said: Master, the multitudes throng and press thee, and dost thou say, Who touched me?"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et dixit Iesus tetigit me aliquis nam ego novi virtutem de me exisse"
      en: "And Jesus said: Somebody hath touched me; for I know that virtue is gone out from me."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "videns autem mulier quia non latuit tremens venit et procidit ante pedes illius et ob quam causam tetigerit eum indicavit coram omni populo et quemadmodum confestim sanata sit"
      en: "And the woman seeing that she was not hid, came trembling, and fell down before his feet, and declared before all the people for what cause she had touched him, and how she was immediately healed."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "at ipse dixit illi filia fides tua te salvam fecit vade in pace"
      en: "But he said to her: Daughter, thy faith hath made thee whole; go thy way in peace."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "adhuc illo loquente venit a principe synagogae dicens ei quia mortua est filia tua noli vexare illum"
      en: "As he was yet speaking, there cometh one to the ruler of the synagogue, saying to him: Thy daughter is dead, trouble him not."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Iesus autem audito hoc verbo respondit patri puellae noli timere crede tantum et salva erit"
      en: "And Jesus hearing this word, answered the father of the maid: Fear not; believe only, and she shall be safe."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et cum venisset domum non permisit intrare secum quemquam nisi Petrum et Iohannem et Iacobum et patrem et matrem puellae"
      en: "And when he was come to the house, he suffered not any man to go in with him, but Peter and James and John, and the father and mother of the maiden."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "flebant autem omnes et plangebant illam at ille dixit nolite flere non est mortua sed dormit"
      en: "And all wept and mourned for her. But he said: Weep not; the maid is not dead, but sleepeth."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et deridebant eum scientes quia mortua esset"
      en: "And they laughed him to scorn, knowing that she was dead."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "ipse autem tenens manum eius clamavit dicens puella surge"
      en: "But he taking her by the hand, cried out, saying: Maid, arise."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "et reversus est spiritus eius et surrexit continuo et iussit illi dari manducare"
      en: "And her spirit returned, and she arose immediately. And he bid them give her to eat."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "et stupuerunt parentes eius quibus praecepit ne alicui dicerent quod factum erat"
      en: "And her parents were astonished, whom he charged to tell no man what was done."
    status: { la: verified, en: verified }
