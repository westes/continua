# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 19
verses:
  - n: 1
    text:
      la: "Post haec audivi quasi vocem turbarum multarum in caelo dicentium: Alleluia: salus, et gloria, et virtus Deo nostro est:"
      en: "After these things I heard as it were the voice of much people in heaven, saying: Alleluia. Salvation, and glory, and power is to our God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quia vera et justa judicia sunt ejus, qui judicavit de meretrice magna, quae corrupit terram in prostitutione sua, et vindicavit sanguinem servorum suorum de manibus ejus."
      en: "For true and just are his judgments, who hath judged the great harlot which corrupted the earth with her fornication, and hath revenged the blood of his servants, at her hands."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et iterum dixerunt: Alleluia. Et fumus ejus ascendit in saecula saeculorum."
      en: "And again they said: Alleluia. And her smoke ascendeth for ever and ever."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et ceciderunt seniores viginti quatuor, et quatuor animalia, et adoraverunt Deum sedentem super thronum, dicentes: Amen: alleluia."
      en: "And the four and twenty ancients, and the four living creatures fell down and adored God that sitteth upon the throne, saying: Amen; Alleluia."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ex vox de throno exivit, dicens: Laudem dicite Deo nostro omnes servi ejus: et qui timetis eum pusilli et magni."
      en: "And a voice came out from the throne, saying: Give praise to our God, all ye his servants; and you that fear him, little and great."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et audivi quasi vocem turbae magnae, et sicut vocem aquarum multarum, et sicut vocem tonitruorum magnorum, dicentium: Alleluia: quoniam regnavit Dominus Deus noster omnipotens."
      en: "And I heard as it were the voice of a great multitude, and as the voice of many waters, and as the voice of great thunders, saying, Alleluia: for the Lord our God the Almighty hath reigned."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Gaudeamus, et exsultemus: et demus gloriam ei: quia venerunt nuptiae Agni, et uxor ejus praeparavit se."
      en: "Let us be glad and rejoice, and give glory to him; for the marriage of the Lamb is come, and his wife hath prepared herself."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et datum est illi ut cooperiat se byssino splendenti et candido. Byssinum enim justificationes sunt sanctorum."
      en: "And it is granted to her that she should clothe herself with fine linen, glittering and white. For the fine linen are the justifications of saints."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dixit mihi: Scribe: Beati qui ad coenam nuptiarum Agni vocati sunt; et dixit mihi: Haec verba Dei vera sunt."
      en: "And he said to me: Write: Blessed are they that are called to the marriage supper of the Lamb. And he saith to me: These words of God are true."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et cecidi ante pedes ejus, ut adorarem eum. Et dicit mihi: Vide ne feceris: conservus tuus sum, et fratrum tuorum habentium testimonium Jesu. Deum adora. Testimonium enim Jesu est spiritus prophetiae."
      en: "And I fell down before his feet, to adore him. And he saith to me: See thou do it not: I am thy fellow servant, and of thy brethren, who have the testimony of Jesus. Adore God. For the testimony of Jesus is the spirit of prophecy."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et vidi caelum apertum, et ecce equus albus, et qui sedebat super eum, vocabatur Fidelis, et Verax, et cum justitia judicat et pugnat."
      en: "And I saw heaven opened, and behold a white horse; and he that sat upon him was called faithful and true, and with justice doth he judge and fight."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Oculi autem ejus sicut flamma ignis, et in capite ejus diademata multa, habens nomen scriptum, quod nemo novit nisi ipse."
      en: "And his eyes were as a flame of fire, and on his head were many diadems, and he had a name written, which no man knoweth but himself."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et vestitus erat veste aspersa sanguine: et vocatur nomen ejus: Verbum Dei."
      en: "And he was clothed with a garment sprinkled with blood; and his name is called, THE WORD OF GOD."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et exercitus qui sunt in caelo, sequebantur eum in equis albis, vestiti byssino albo et mundo."
      en: "And the armies that are in heaven followed him on white horses, clothed in fine linen, white and clean."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et de ore ejus procedit gladius ex utraque parte acutus, ut in ipso percutiat gentes. Et ipse reget eas in virga ferrea: et ipse calcat torcular vini furoris irae Dei omnipotentis."
      en: "And out of his mouth proceedeth a sharp two edged sword; that with it he may strike the nations. And he shall rule them with a rod of iron; and he treadeth the winepress of the fierceness of the wrath of God the Almighty."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et habet in vestimento et in femore suo scriptum: Rex regum et Dominus dominantium."
      en: "And he hath on his garment, and on his thigh written: KING OF KINGS, AND LORD OF LORDS."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et vidi unum angelum stantem in sole, et clamavit voce magna, dicens omnibus avibus, quae volabant per medium caeli: Venite, et congregamini ad coenam magnam Dei:"
      en: "And I saw an angel standing in the sun, and he cried with a loud voice, saying to all the birds that did fly through the midst of heaven: Come, gather yourselves together to the great supper of God:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ut manducetis carnes regum, et carnes tribunorum, et carnes fortium, et carnes equorum, et sedentium in ipsis, et carnes omnium liberorum, et servorum, et pusillorum et magnorum."
      en: "That you may eat the flesh of kings, and the flesh of tribunes, and the flesh of mighty men, and the flesh of horses, and of them that sit on them, and the flesh of all freemen and bondmen, and of little and of great."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et vidi bestiam, et reges terrae, et exercitus eorum congregatos ad faciendum praelium cum illo, qui sedebat in equo, et cum exercitu ejus."
      en: "And I saw the beast, and the kings of the earth, and their armies gathered together to make war with him that sat upon the horse, and with his army."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et apprehensa est bestia, et cum ea pseudopropheta: qui fecit signa coram ipso, quibus seduxit eos, qui acceperunt caracterem bestiae, et qui adoraverunt imaginem ejus. Vivi missi sunt hi duo in stagnum ignis ardentis sulphure:"
      en: "And the beast was taken, and with him the false prophet, who wrought signs before him, wherewith he seduced them who received the character of the beast, and who adored his image. These two were cast alive into the pool of fire, burning with brimstone."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et ceteri occisi sunt in gladio sedentis super equum, qui procedit de ore ipsius: et omnes aves saturatae sunt carnibus eorum."
      en: "And the rest were slain by the sword of him that sitteth upon the horse, which proceedeth out of his mouth; and all the birds were filled with their flesh."
    status: { la: verified, en: verified }
