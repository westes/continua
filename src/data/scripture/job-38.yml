# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 38
verses:
  - n: 1
    text:
      la: "respondens autem Dominus Iob de turbine dixit"
      en: "Then the Lord answered Job out of a whirlwind, and said :"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quis est iste involvens sententias sermonibus inperitis"
      en: "Who is this that wrappeth up sentences in unskillful words?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "accinge sicut vir lumbos tuos interrogabo te et responde mihi"
      en: "Gird up thy loins like a man : I will ask thee, and answer thou me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ubi eras quando ponebam fundamenta terrae indica mihi si habes intellegentiam"
      en: "Where wast thou when I laid up the foundations of the earth ? tell me if thou hast understanding."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quis posuit mensuras eius si nosti vel quis tetendit super eam lineam"
      en: "Who hath laid the measures thereof, if thou knowest? or who hath stretched the line upon it?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "super quo bases illius solidatae sunt aut quis dimisit lapidem angularem eius"
      en: "Upon what are its bases grounded? or who laid the corner stone thereof,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cum me laudarent simul astra matutina et iubilarent omnes filii Dei"
      en: "When the morning stars praised me together, and all the sons of God made a joyful melody?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quis conclusit ostiis mare quando erumpebat quasi de vulva procedens"
      en: "Who shut up the sea with doors, when it broke forth as issuing out of the womb :"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cum ponerem nubem vestimentum eius et caligine illud quasi pannis infantiae obvolverem"
      en: "when I made a cloud the garment thereof, and wrapped it in a mist as in swaddling bands?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "circumdedi illud terminis meis et posui vectem et ostia"
      en: "I set my bounds around it, and made it bars and doors :"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dixi usque huc venies et non procedes amplius et hic confringes tumentes fluctus tuos"
      en: "And I said : Hitherto thou shalt come, and shalt go no further, and here thou shalt break thy swelling waves."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "numquid post ortum tuum praecepisti diluculo et ostendisti aurorae locum suum"
      en: "Didst thou since thy birth command the morning, and shew the dawning of the day its place?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et tenuisti concutiens extrema terrae et excussisti impios ex ea"
      en: "And didst thou hold the extremities of the earth shaking them, and hast thou shaken the ungodly out of it?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "restituetur ut lutum signaculum et stabit sicut vestimentum"
      en: "The seal shall be restored as clay, and shall stand as a garment :"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "auferetur ab impiis lux sua et brachium excelsum confringetur"
      en: "From the wicked their light shall be taken away, and the high arm shall be broken."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "numquid ingressus es profunda maris et in novissimis abyssis deambulasti"
      en: "Hast thou entered into the depths of the sea, and walked in the lowest parts of the deep?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "numquid apertae tibi sunt portae mortis et ostia tenebrosa vidisti"
      en: "Have the gates of death been opened to thee, and hast thou seen the darksome doors?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "numquid considerasti latitudines terrae indica mihi si nosti omnia"
      en: "Hast thou considered the breadth of the earth? tell me, if thou knowest all things?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "in qua via habitet lux et tenebrarum quis locus sit"
      en: "Where is the way where light dwelleth, and where is the place of darkness :"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ut ducas unumquodque ad terminos suos et intellegas semitas domus eius"
      en: "That thou mayst bring every thing to its own bounds, and understand the paths of the house thereof."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sciebas tunc quod nasciturus esses et numerum dierum tuorum noveras"
      en: "Didst thou know then that thou shouldst be born ? and didst thou know the number of thy days?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "numquid ingressus es thesauros nivis aut thesauros grandinis aspexisti"
      en: "Hast thou entered into the storehouses of the snow, or has thou beheld the treasures of the hail :"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quae praeparavi in tempus hostis in diem pugnae et belli"
      en: "Which I have prepared for the time of the enemy, against the day of battle and war?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "per quam viam spargitur lux dividitur aestus super terram"
      en: "By what way is the light spread, and heat divided upon the earth?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quis dedit vehementissimo imbri cursum et viam sonantis tonitrui"
      en: "Who gave a course to violent showers, or a way for noisy thunder :"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ut plueret super terram absque homine in deserto ubi nullus mortalium commoratur"
      en: "That it should rain on the earth without man in the wilderness, where no mortal dwelleth :"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ut impleret inviam et desolatam et produceret herbas virentes"
      en: "That it should fill the desert and desolate land, and should bring forth green grass?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quis est pluviae pater vel quis genuit stillas roris"
      en: "Who is the father of rain ? or who begot the drops of dew?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "de cuius utero egressa est glacies et gelu de caelo quis genuit"
      en: "Out of whose womb came the ice; and the frost from heaven who hath gendered it?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "in similitudinem lapidis aquae durantur et superficies abyssi constringitur"
      en: "The waters are hardened like a stone, and the surface of the deep is congealed."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "numquid coniungere valebis micantes stellas Pliadis aut gyrum Arcturi poteris dissipare"
      en: "Shalt thou be able to join together the shining stars the Pleiades, or canst thou stop the turning about of Arcturus?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "numquid producis luciferum in tempore suo et vesperum super filios terrae consurgere facis"
      en: "Canst thou bring forth the day star in its time, and make the evening star to rise upon the children of the earth?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "numquid nosti ordinem caeli et pones rationem eius in terra"
      en: "Dost thou know the order of heaven, and canst thou set down the reason thereof on the earth?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "numquid elevabis in nebula vocem tuam et impetus aquarum operiet te"
      en: "Canst thou lift up thy voice to the clouds, that an abundance of waters may cover thee?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "numquid mittes fulgura et ibunt et revertentia dicent tibi adsumus"
      en: "Canst thou send lightnings, and will they go, and will they return and say to thee : Here we are?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "quis posuit in visceribus hominis sapientiam vel quis dedit gallo intellegentiam"
      en: "Who hath put wisdom in the heart of man? or who gave the cock understanding?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "quis enarravit caelorum rationem et concentum caeli quis dormire faciet"
      en: "Who can declare the order of the heavens, or who can make the harmony of heaven to sleep?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "quando fundebatur pulvis in terram et glebae conpingebantur"
      en: "When was the dust poured on the earth, and the clods fastened together?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "numquid capies leaenae praedam et animam catulorum eius implebis"
      en: "Wilt thou take the prey for the lioness, and satisfy the appetite of her whelps,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "quando cubant in antris et in specubus insidiantur"
      en: "When they couch in the dens and lie in wait in holes?"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "quis praeparat corvo escam suam quando pulli eius ad Deum clamant vagantes eo quod non habeant cibos"
      en: "Who provideth food for the raven, when her young ones cry to God, wandering about, because they have no meat?"
    status: { la: verified, en: verified }
