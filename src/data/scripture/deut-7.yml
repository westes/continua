book: deut
chapter: 7
verses:
  - n: 1
    text:
      la: "cum introduxerit te Dominus Deus tuus in terram quam possessurus ingredieris et deleverit gentes multas coram te Hettheum et Gergeseum et Amorreum Chananeum et Ferezeum et Eveum et Iebuseum septem gentes multo maioris numeri quam tu es et robustiores te"
      en: "When the Lord thy God shall have brought thee into the land, which thou art going in to possess, and shall have destroyed many nations before thee, the Hethite, and the Gergezite, and the Amorrhite, and the Chanaanite, and the Pherezite, and the Hevite, and the Jebusite, seven nations much more numerous than thou art, and stronger than thou:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tradideritque eas Dominus Deus tuus tibi percuties eas usque ad internicionem non inibis cum eis foedus nec misereberis earum"
      en: "And the Lord thy God shall have delivered them to thee, thou shalt utterly destroy them. Thou shalt make no league with them, nor shew mercy to them:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "neque sociabis cum eis coniugia filiam tuam non dabis filio eius nec filiam illius accipies filio tuo"
      en: "Neither shalt thou make marriages with them. Thou shalt not give thy daughter to his son, nor take his daughter for thy son:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia seducet filium tuum ne sequatur me et ut magis serviat diis alienis irasceturque furor Domini et delebit te cito"
      en: "For she will turn away thy son from following me, that he may rather serve strange gods, and the wrath of the Lord will be kindled, and will quickly destroy thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quin potius haec facietis eis aras eorum subvertite confringite statuas lucosque succidite et sculptilia conburite"
      en: "But thus rather shall you deal with them: Destroy their altars, and break their statues, and cut down their groves, and burn their graven things."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia populus sanctus es Domino Deo tuo te elegit Dominus Deus tuus ut sis ei populus peculiaris de cunctis populis qui sunt super terram"
      en: "Because thou art a holy people to the Lord thy God. The Lord thy God hath chosen thee, to be his peculiar people of all peoples that are upon the earth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "non quia cunctas gentes numero vincebatis vobis iunctus est Dominus et elegit vos cum omnibus sitis populis pauciores"
      en: "Not because you surpass all nations in number, is the Lord joined unto you, and hath chosen you, for you are the fewest of any people:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed quia dilexit vos Dominus et custodivit iuramentum quod iuravit patribus vestris eduxitque vos in manu forti et redemit de domo servitutis de manu Pharaonis regis Aegypti"
      en: "But because the Lord hath loved you, and hath kept his oath, which he swore to your fathers: and hath brought you out with a strong hand, and redeemed you from the house of bondage, out of the hand of Pharao the king of Egypt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et scies quia Dominus Deus tuus ipse est Deus fortis et fidelis custodiens pactum et misericordiam diligentibus se et his qui custodiunt praecepta eius in mille generationes"
      en: "And thou shalt know that the Lord thy God, he is a strong and faithful God, keeping his covenant and mercy to them that love him, and to them that keep his commandments, unto a thousand generations:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et reddens odientibus se statim ita ut disperdat eos et ultra non differat protinus eis restituens quod merentur"
      en: "And repaying forthwith them that hate him, so as to destroy them, without further delay immediately rendering to them what they deserve."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "custodi ergo praecepta et caerimonias atque iudicia quae ego mando tibi hodie ut facias"
      en: "11Keep therefore the precepts and ceremonies and judgments, which I command thee this day to do."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si postquam audieris haec iudicia custodieris ea et feceris custodiet et Dominus Deus tuus tibi pactum et misericordiam quam iuravit patribus tuis"
      en: "If after thou hast heard these judgments, thou keep and do them, the Lord thy God will also keep his covenant to thee, and the mercy which he swore to thy fathers:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et diliget te ac multiplicabit benedicetque fructui ventris tui et fructui terrae tuae frumento tuo atque vindemiae oleo et armentis gregibus ovium tuarum super terram pro qua iuravit patribus tuis ut daret eam tibi"
      en: "And he will love thee and multiply thee, and will bless the fruit of thy womb, and the fruit of thy land, thy corn, and thy vintage, thy oil, and thy herds, and the flocks of thy sheep upon the land, for which he swore to thy fathers that he would give it thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "benedictus eris inter omnes populos non erit apud te sterilis utriusque sexus tam in hominibus quam in gregibus tuis"
      en: "Blessed shalt thou be among all people. No one shall be barren among you of either sex, neither of men nor cattle."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "auferet Dominus a te omnem languorem et infirmitates Aegypti pessimas quas novisti non inferet tibi sed cunctis hostibus tuis"
      en: "The Lord will take away from thee all sickness: and the grievous infirmities of Egypt, which thou knowest, he will not bring upon thee, but upon thy enemies."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "devorabis omnes populos quos Dominus Deus tuus daturus est tibi non parcet eis oculus tuus nec servies diis eorum ne sint in ruinam tui"
      en: "Thou shalt consume all the people, which the Lord thy God will deliver to thee. Thy eye shall not spare them, neither shalt thou serve their gods, lest they be thy ruin."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "si dixeris in corde tuo plures sunt gentes istae quam ego quomodo potero delere eas"
      en: "If thou say in thy heart: These nations are more than I, how shall I be able to destroy them?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "noli metuere sed recordare quae fecerit Dominus Deus tuus Pharaoni et cunctis Aegyptiis"
      en: "Fear not, but remember what the Lord thy God did to Pharao and to all the Egyptians,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "plagas maximas quas viderunt oculi tui et signa atque portenta manumque robustam et extentum brachium ut educeret te Dominus Deus tuus sic faciet cunctis populis quos metuis"
      en: "The exceeding great plagues, which thy eyes saw, and the signs and wonders, and the strong hand, and the stretched out arm, with which the Lord thy God brought thee out: so will he do to all the people, whom thou fearest."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "insuper et crabrones mittet Dominus Deus tuus in eos donec deleat omnes atque disperdat qui te fugerint et latere potuerint"
      en: "Moreover the Lord thy God will send also hornets among them, until he destroy and consume all that have escaped thee, and could hide themselves."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non timebis eos quia Dominus Deus tuus in medio tui est Deus magnus et terribilis"
      en: "Thou shalt not fear them, because the Lord thy God is in the midst of thee, a God mighty and terrible:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ipse consumet nationes has in conspectu tuo paulatim atque per partes non poteris delere eas pariter ne forte multiplicentur contra te bestiae terrae"
      en: "He will consume these nations in thy sight by little and little and by degrees. Thou wilt not be able to destroy them altogether: lest perhaps the beasts of the earth should increase upon thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dabitque eos Dominus Deus tuus in conspectu tuo et interficiet illos donec penitus deleantur"
      en: "But the Lord thy God shall deliver them in thy sight: and shall slay them until they be utterly destroyed."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "tradet reges eorum in manus tuas et disperdes nomina eorum sub caelo nullus poterit resistere tibi donec conteras eos"
      en: "And he shall deliver their kings into thy hands, and thou shalt destroy their names from under Heaven: no man shall be able to resist thee, until thou destroy them."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sculptilia eorum igne conbures non concupisces argentum et aurum de quibus facta sunt neque adsumes ex eis tibi quicquam ne offendas propter ea quia abominatio est Domini Dei tui"
      en: "Their graven things thou shalt burn with fire: thou shalt not covet the silver and gold of which they are made, neither shalt thou take to thee any thing thereof, lest thou offend, because it is an abomination to the Lord thy God."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "nec inferes quippiam ex idolo in domum tuam ne fias anathema sicut et illud est quasi spurcitiam detestaberis et velut inquinamentum ac sordes abominationi habebis quia anathema est"
      en: "Neither shalt thou bring any thing of the idol into thy house, lest thou become an anathema, like it. Thou shalt detest it as dung, and shalt utterly abhor it as uncleanness and filth, because it is an anathema."
    status: { la: verified, en: verified }
