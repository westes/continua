# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 47
verses:
  - n: 1
    text:
      la: "quod factum est verbum Domini ad Hieremiam prophetam contra Palestinos antequam percuteret Pharao Gazam"
      en: "The word of the Lord that came to Jeremias the prophet against the people of Palestine, before Pharao took Gaza."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec dicit Dominus ecce aquae ascendunt ab aquilone et erunt quasi torrens inundans et operient terram et plenitudinem eius urbem et habitatores eius clamabunt homines et ululabit omnis habitator terrae"
      en: "Thus saith the Lord: Behold there come up waters out of the north, and they shall be as an overflowing torrent, and they shall cover the land, and all that is therein, the city and the inhabitants thereof: then the men shall cry, and all the inhabitants of the land shall howl,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ab strepitu pompae armorum et bellatorum eius a commotione quadrigarum eius et multitudine rotarum illius non respexerunt patres filios manibus dissolutis"
      en: "At the noise of the marching of arms, and of his soldiers, at the rushing of his chariots, and the multitude of his wheels. The fathers have not looked back to the children, for feebleness of hands,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "pro adventu diei in quo vastabuntur omnes Philisthim et dissipabitur Tyrus et Sidon cum omnibus reliquis auxiliis suis depopulatus est enim Dominus Palestinos reliquias insulae Cappadociae"
      en: "Because of the coming of the day, in which all the Philistines shall be laid waste, and Tyre and Sidon shall be destroyed, with all the rest of their helpers. For the Lord hath wasted the Philistines, the remnant of the isle of Cappadocia."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "venit calvitium super Gazam conticuit Ascalon et reliquiae vallis earum usquequo concideris"
      en: "Baldness is come upon Gaza: Ascalon hath held her peace with the remnant of their valley: how long shalt thou cut thyself?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "o mucro Domini usquequo non quiescis ingredere in vaginam tuam refrigerare et sile"
      en: "O thou sword of the Lord, how long wilt thou not be quiet? Go into thy scabbard, rest, and be still."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quomodo quiescet cum Dominus praeceperit ei adversus Ascalonem et adversus maritimas eius regiones ibique condixerit illi"
      en: "How shall it be quiet, when the Lord hath given it a charge against Ascalon, and against the countries thereof by the sea side, and there hath made an appointment for it?"
    status: { la: verified, en: verified }
