# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1esdr
chapter: 6
verses:
  - n: 1
    text:
      la: "Tunc Darius rex praecepit: et recensuerunt in bibliotheca librorum, qui erant repositi in Babylone,"
      en: "Then king Darius gave orders, and they searched in the library of the books that were laid up in Babylon,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et inventum est in Ecbatanis, quod est castrum in Medena provincia volumen unum, talisque scriptus erat in eo commentarius:"
      en: "And there was found in Ecbatana, which is a castle in the province of Media, a book in which this record was written."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Anno primo Cyri regis, Cyrus rex decrevit ut domus Dei aedificaretur, quae est in Jerusalem, in loco ubi immolent hostias, et ut ponant fundamenta supportantia altitudinem cubitorum sexaginta, et latitudinem cubitorum sexaginta,"
      en: "In the first year of Cyrus the king: Cyrus the king decreed, that the house of God should be built, which is in Jerusalem, in the place where they may offer sacrifices, and that they lay the foundations that may support the height of threescore cubits, and the breadth of threescore cubits,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ordines de lapidibus impolitis tres, et sic ordines de lignis novis: sumptus autem de domo regis dabuntur."
      en: "Three rows of unpolished stones, and so rows of new timber: and the charges shall be given out of the king's house."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sed et vasa templi Dei aurea et argentea, quae Nabuchodonosor tulerat de templo Jerusalem, et attulerat ea in Babylonem, reddantur, et referantur in templum in Jerusalem in locum suum, quae et posita sunt in templo Dei."
      en: "And also let the golden and silver vessels of the temple of God, which Nabuchodonosor took out of the temple of Jerusalem, and brought to Babylon, be restored, and carried back to the temple of Jerusalem to their place, which also were placed in the temple of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nunc ergo Thathanai dux regionis, quae est trans flumen, Stharbuzanai, et consiliarii vestri Apharsachaei, qui estis trans flumen, procul recedite ab illis,"
      en: "Now therefore Thathanai, governor of the country beyond the river, Stharbuzanai, and your counsellors the Apharsachites, who are beyond the river, depart far from them,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dimittite fieri templum Dei illud a duce Judaeorum, et a senioribus eorum, ut domum Dei illam aedificent in loco suo."
      en: "And let that temple of God be built by the governor of the Jews, and by their ancients, that they may build that house of God in its place."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sed et a me praeceptum est quid oporteat fieri a presbyteris Judaeorum illis ut aedificetur domus Dei, scilicet ut de arca regis, id est, de tributis, quae dantur de regione trans flumen, studiose sumptus dentur viris illis, ne impediatur opus."
      en: "I also have commanded what must be done by those ancients of the Jews, that the house of God may be built, to wit, that of the king's chest, that is, of the tribute that is paid out of the country beyond the river, the charges be diligently given to those men, lest the work be hindered."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quod si necesse fuerit, et vitulos, et agnos, et haedos in holocaustum Deo caeli, frumentum, sal, vinum, et oleum, secundum ritum sacerdotum, qui sunt in Jerusalem, detur eis per singulos dies, ne sit in aliquo querimonia."
      en: "And if it shall be necessary, let calves also, and lambs, and kids, for holocausts to the God of heaven, wheat, salt, wine, and oil, according to the custom of the priests that are in Jerusalem, be given them day by day, that there be no complaint in any thing."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et offerant oblationes Deo caeli, orentque pro vita regis, et filiorum ejus."
      en: "And let them offer oblations to the God of heaven, and pray for the life of the king, and of his children."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "A me ergo positum est decretum: ut omnis homo qui hanc mutaverit jussionem, tollatur lignum de domum ipsius, et erigatur, et configatur in eo, domus autem ejus publicetur."
      en: "And I have made a decree: That if any whosoever, shall alter this commandment, a beam be taken from his house. and set up, and he be nailed upon it, and his house be confiscated."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Deus autem, qui habitare fecit nomen suum ibi, dissipet omnia regna, et populum qui extenderit manum suam ut repugnet, et dissipet domum Dei illam, quae est in Jerusalem. Ego Darius statui decretum, quod studiose impleri volo."
      en: "And may the God, that hath caused his name to dwell there, destroy all kingdoms, and the people that shall put out their hand to resist, and to destroy the house of God, that is in Jerusalem. I Darius have made the decree, which I will have diligently complied with."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Igitur Thathanai dux regionis trans flumen, et Stharbuzanai, et consiliarii ejus, secundum quod praeceperat Darius rex, sic diligenter executi sunt."
      en: "So then Thathanai, governor of the country beyond the river, and Stharbuzanai, and his counsellors diligently executed what Darius the king had commanded."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Seniores autem Judaeorum aedificabant, et prosperabantur juxta prophetiam Aggaei prophetae, et Zachariae filii Addo: et aedificaverunt et construxerunt, jubente Deo Israel, et jubente Cyro, et Dario, et Artaxerxe regibus Persarum:"
      en: "And the ancients of the Jews built and prospered according to the prophecy of Aggeus the prophet, and of Zacharias the son of Addo: and they built and finished, by the commandment of the God of Israel, and by the commandment of Cyrus, and Darius, and Artaxerxes kings of the Persians."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et compleverunt domum Dei istam, usque ad diem terium mensis Adar, qui est annus sextus regni Darii regis."
      en: "And they were finishing this house of God, until the third day of the month of Adar, which was in the sixth year of the reign of king Darius."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Fecerunt autem filii Israel sacerdotes et Levitae, et reliqui filiorum transmigrationis, dedicationem domus Dei in gaudio."
      en: "And the children of Israel, the priests and the Levites, and the rest of the children of the captivity kept the dedication of the house of God with joy."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et obtulerunt in dedicationem domus Dei, vitulos centum, arietes ducentos, agnos quadringentos, hircos caprarum pro peccato totius Israel duodecim, juxta numerum tribuum Israel."
      en: "And they offered at the dedication of the house of God, a, hundred calves, two hundred rams, four hundred lambs, and for a sin offering for all Israel twelve he goats, according to the number of the tribes of Israel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et statuerunt sacerdotes in ordinibus suis, et Levitas in vicibus suis, super opera Dei in Jerusalem, sicut scriptum est in libro Moysi."
      en: "And they set the priests in their divisions, and the Levites in their courses over the works of God in Jerusalem, as it is written in the book of Moses."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Fecerunt autem filii Israel transmigrationis Pascha, quartadecima die mensis primi."
      en: "And the children of Israel of the captivity kept the phase, on the fourteenth day of the first month."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Purificati enim fuerant sacerdotes et Levitae quasi unus: omnes mundi ad immolandum Pascha universis filiis transmigrationis, et fratribus suis sacerdotibus, et sibi."
      en: "For all the priests and the Levites were purified as one man: all were clear to kill the phase for all the children of the captivity, and for their brethren the priests, and themselves."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et comederunt filii Israel, qui reversi fuerant de transmigratione, et omnes qui se separaverant a coinquinatione gentium terrae ad eos, ut quaererent Dominum Deum Israel."
      en: "And the children of Israel that were returned from captivity, and all that had separated themselves from the filthiness of the nations of the earth to them, to seek the Lord the God of Israel, did eat."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et fecerunt solemnitatem azymorum septem diebus in laetitia, quoniam laetificaverat eos Dominus, et converterat cor regis Assur ad eos, ut adjuvaret manus eorum in opere domus Domini Dei Israel."
      en: "And they kept the feast of unleavened bread seven days with joy, for the Lord had made them joyful, and had turned the heart of the king of Assyria to them, that he should help their hands in the work of the house of the Lord the God of Israel."
    status: { la: verified, en: verified }
