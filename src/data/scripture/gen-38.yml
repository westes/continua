# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 38
verses:
  - n: 1
    text:
      la: "eo tempore descendens Iudas a fratribus suis divertit ad virum odollamitem nomine Hiram"
      en: "At that time Juda went down from his brethren, and turned in to a certain Odollamite, named Hiras."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "viditque ibi filiam hominis chananei vocabulo Suae et uxore accepta ingressus est ad eam"
      en: "And he saw there the daughter of a man of Chanaan, called Sue: and taking her to wife, he went in unto her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quae concepit et peperit filium vocavitque nomen eius Her"
      en: "And she conceived, and bore a son, and called his name Her."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "rursum concepto fetu natum filium nominavit Onam"
      en: "And conceiving again, she bore a son, and called him Onan."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tertium quoque peperit quem appellavit Sela quo nato parere ultra cessavit"
      en: "She bore also a third: whom she called Sela. after whose birth, she ceased to bear any more."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dedit autem Iudas uxorem primogenito suo Her nomine Thamar"
      en: "And Juda took a wife for Her his firstborn, whose name was Thamar."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "fuitque Her primogenitus Iudae nequam in conspectu Domini et ab eo occisus est"
      en: "And Her, the firstborn of Juda, was wicked in the sight of the Lord: and was slain by him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixit ergo Iudas ad Onam filium suum ingredere ad uxorem fratris tui et sociare illi ut suscites semen fratri tuo"
      en: "Juda, therefore add to Onan his son: Go in to thy brother's wife and marry her, that thou mayst raise seed to thy brother."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ille sciens non sibi nasci filios introiens ad uxorem fratris sui semen fundebat in terram ne liberi fratris nomine nascerentur"
      en: "He knowing that the children should not be his, when he went in to his brother's wife, spilled his seed upon the ground, lest children should be born in his brother's name."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et idcirco percussit eum Dominus quod rem detestabilem faceret"
      en: "And therefore the Lord slew him, be- cause he did a detestable thing."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quam ob rem dixit Iudas Thamar nurui suae esto vidua in domo patris tui donec crescat Sela filius meus timebat enim ne et ipse moreretur sicut fratres eius quae abiit et habitavit in domo patris sui"
      en: "Wherefore Juda said to Thamar his daughter in law: Remain a widow in thy father's house, till Sela my son grow up: for he was afraid lest he also might die, as his brethren did. She went her way and dwelt in her father's house."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "evolutis autem multis diebus mortua est filia Suae uxor Iudae qui post luctum consolatione suscepta ascendebat ad tonsores ovium suarum ipse et Hiras opilio gregis Odollamita in Thamnas"
      en: "And after many days were past, the daughter of Sue the wife of Juda died: and when he had taken comfort after his mourning, he went up to Thamnas, to the shearers of his sheep, he and Hiras the Odollamite the shepherd of his flock."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nuntiatumque est Thamar quod socer illius ascenderet in Thamnas ad tondendas oves"
      en: "And it was told Thamar that her father in law was come up to Thamnas to shear his sheep."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quae depositis viduitatis vestibus adsumpsit theristrum et mutato habitu sedit in bivio itineris quod ducit Thamnam eo quod crevisset Sela et non eum accepisset maritum"
      en: "And she put off the garments of her widowhood, and took a veil: and changing her dress, sat in the cross way, that leadeth to Thamnas: because Sela was grown up, and she had not been married to him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quam cum vidisset Iudas suspicatus est esse meretricem operuerat enim vultum suum ne cognosceretur"
      en: ""
    status: { la: verified, en: missing }
  - n: 16
    text:
      la: "ingrediensque ad eam ait dimitte me ut coeam tecum nesciebat enim quod nurus sua esset qua respondente quid mihi dabis ut fruaris concubitu meo"
      en: "And going to her, he said: Suffer me to lie with thee: for he knew her not to be his daughter in law. And she answered: What wilt thou give me to en joy my company?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixit mittam tibi hedum de gregibus rursum illa dicente patiar quod vis si dederis mihi arrabonem donec mittas quod polliceris"
      en: "He said: I will send thee a kid out of the flock. And when she said again: I will suffer what thou wilt, if thou give a pledge, till thou send what thou promisest,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ait Iudas quid vis tibi pro arrabone dari respondit anulum tuum et armillam et baculum quem manu tenes ad unum igitur coitum concepit mulier"
      en: "Juda said: What wilt thou have for a pledge ? She answered: Thy ring and bracelet, and the staff which thou holdest in thy hand. The woman therefore at one copulation conceived."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et surgens abiit depositoque habitu quem adsumpserat induta est viduitatis vestibus"
      en: "And she arose and went her way: and putting off the apparel which she had taken, put on the garments of her widowhood."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "misit autem Iudas hedum per pastorem suum Odollamitem ut reciperet pignus quod dederat mulieri qui cum non invenisset eam"
      en: "And Juda sent a kid by his shepherd, the Odollamite, that he might receive the pledge again, which he had given to the woman: but he, not finding her,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "interrogavit homines loci illius ubi est mulier quae sedebat in bivio respondentibus cunctis non fuit in loco isto meretrix"
      en: "asked the men of that place : Where is the woman that sat in the cross way? And when they all made answer: There was no harlot in this place,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "reversus est ad Iudam et dixit ei non inveni eam sed et homines loci illius dixerunt mihi numquam ibi sedisse scortum"
      en: "He returned to Juda, and said to him: I have not found her; moreover the men of that place said to me, that there never sat a harlot there."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ait Iudas habeat sibi certe mendacii nos arguere non poterit ego misi hedum quem promiseram et tu non invenisti eam"
      en: "Juda said : Let her take it to herself ; surely she cannot charge us with a,lie: I sent the kid which I promised: and thou didst not find her."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ecce autem post tres menses nuntiaverunt Iudae dicentes fornicata est Thamar nurus tua et videtur uterus illius intumescere dixit Iudas producite eam ut conburatur"
      en: "And behold after three months they told a lie, saying: Thamar, thy daughter in law hath played the harlot, and she appeareth to have a big belly. And Juda said : Bring her out that she may be burnt."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quae cum educeretur ad poenam misit ad socerum suum dicens de viro cuius haec sunt concepi cognosce cuius sit anulus et armilla et baculus"
      en: ""
    status: { la: verified, en: missing }
  - n: 26
    text:
      la: "qui agnitis muneribus ait iustior me est quia non tradidi eam Sela filio meo attamen ultra non cognovit illam"
      en: "But he acknowledging the gifts, said: She is juster than I: because I did not give her to Sela, my son. However, he knew her no more."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "instante autem partu apparuerunt gemini in utero atque in ipsa effusione infantum unus protulit manum in qua obsetrix ligavit coccinum dicens"
      en: "And when she was ready to be brought to bed, there appeared twins in her womb: and in the very delivery of the infants, one put forth a hand, whereon the midwife tied a scarlet thread, saying:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "iste egreditur prior"
      en: "This shall come forth the first."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "illo vero retrahente manum egressus est alter dixitque mulier quare divisa est propter te maceria et ob hanc causam vocavit nomen eius Phares"
      en: "But he drawing back his hand, the other came forth: and the woman said: Why is the partition divided for thee? and therefore called his name Phares."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "postea egressus est frater in cuius manu erat coccinum quem appellavit Zara"
      en: "Afterwards his brother came out, on whose hand was the scarlet thread: and she called him Zara."
    status: { la: verified, en: verified }
