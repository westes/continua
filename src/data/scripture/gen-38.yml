# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 38
verses:
  - n: 1
    text:
      la: "Eodem tempore, descendens Judas a fratribus suis, divertit ad virum Odollamitem, nomine Hiram."
      en: "At that time Juda went down from his brethren, and turned in to a certain Odollamite, named Hiras."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Viditque ibi filiam hominis Chananaei, vocabulo Sue: et accepta uxore, ingressus est ad eam."
      en: "And he saw there the daughter of a man of Chanaan, called Sue: and taking her to wife, he went in unto her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quae concepit, et peperit filium, et vocavit nomen ejus Her."
      en: "And she conceived, and bore a son, and called his name Her."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Rursumque concepto foetu, natum filium vocavit Onan."
      en: "And conceiving again, she bore a son, and called him Onan."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tertium quoque peperit: quem appellavit Sela; quo nato, parere ultra cessavit."
      en: "She bore also a third: whom she called Sela. After whose birth, she ceased to bear any more."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dedit autem Judas uxorem primogenito suo Her, nomine Thamar."
      en: "And Juda took a wife for Her his firstborn, whose name was Thamar."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Fuit quoque Her primogenitus Judae nequam in conspectu Domini: et ab eo occisus est."
      en: "And Her, the firstborn of Juda, was wicked in the sight of the Lord: and was slain by him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixit ergo Judas ad Onan filium suum: Ingredere uxorem fratris tui, et sociare illi, ut suscites semen fratri tuo."
      en: "Juda, therefore said to Onan his son: Go in to thy brother's wife and marry her, that thou mayst raise seed to thy brother."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ille sciens non sibi nasci filios, introiens ad uxorem fratris sui, semen fundebat in terram, ne liberi fratris nomine nascerentur."
      en: "He knowing that the children should not be his, when he went in to his brother's wife, spilled his seed upon the ground, lest children should be born in his brother's name."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et idcirco percussit eum Dominus, quod rem detestabilem faceret."
      en: "And therefore the Lord slew him, because he did a detestable thing."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quam ob rem dixit Judas Thamar nurui suae: Esto vidua in domo patris tui, donec crescat Sela filius meus: timebat enim ne et ipse moreretur, sicut fratres ejus. Quae abiit, et habitavit in domo patris sui."
      en: "Wherefore Juda said to Thamar his daughter in law: Remain a widow in thy father's house, till Sela my son grow up: for he was afraid lest he also might die, as his brethren did. She went her way and dwelt in her father's house."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Evolutis autem multis diebus, mortua est filia Sue uxor Judae: qui, post luctum consolatione suscepta, ascendebat ad tonsores ovium suarum, ipse et Hiras opilio gregis Odollamites, in Thamnas."
      en: "And after many days were past, the daughter of Sue the wife of Juda died: and when he had taken comfort after his mourning, he went up to Thamnas, to the shearers of his sheep, he and Hiras the Odollamite the shepherd of his flock."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nuntiatumque est Thamar quod socer illius ascenderet in Thamnas ad tondendas oves."
      en: "And it was told Thamar that her father in law was come up to Thamnas to shear his sheep."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quae, depositis viduitatis vestibus, assumpsit theristrum: et mutato habitu, sedit in bivio itineris, quod ducit Thamnam: eo quod crevisset Sela, et non eum accepisset maritum."
      en: "And she put off the garments of her widowhood, and took a veil: and changing her dress, sat in the cross way, that leadeth to Thamnas: because Sela was grown up, and she had not been married to him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quam cum vidisset Judas, suspicatus est esse meretricem: operuerat enim vultum suum, ne agnosceretur."
      en: "When Juda saw her, he thought she was a harlot: for she had covered her face, lest she should be known."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ingrediensque ad eam, ait: Dimitte me ut coeam tecum: nesciebat enim quod nurus sua esset. Qua respondente: Quid dabis mihi ut fruaris concubitu meo?"
      en: "And going to her, he said: Suffer me to lie with thee: for he knew her not to be his daughter in law. And she answered: What wilt thou give me to enjoy my company?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixit: Mittam tibi haedam de gregibus. Rursumque illa dicente: Patiar quod vis, si dederis mihi arrhabonem, donec mittas quod polliceris."
      en: "He said: I will send thee a kid out of the flock. And when she said again: I will suffer what thou wilt, if thou give a pledge, till thou send what thou promisest,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ait Judas: Quid tibi vis pro arrhabone dari? Respondit: Annulum tuum, et armillam, et baculum quem manu tenes. Ad unum igitur coitum mulier concepit,"
      en: "Juda said: What wilt thou have for a pledge? She answered: Thy ring and bracelet, and the staff which thou holdest in thy hand. The woman therefore at one copulation conceived."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et surgens abiit: depositoque habitu quem sumpserat, induta est viduitatis vestibus."
      en: "And she arose and went her way: and putting off the apparel which she had taken, put on the garments of her widowhood."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Misit autem Judas haedum per pastorem suum Odollamitem, ut reciperet pignus quod dederat mulieri: qui cum non invenisset eam,"
      en: "And Juda sent a kid by his shepherd, the Odollamite, that he might receive the pledge again, which he had given to the woman: but he, not finding her,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "interrogavit homines loci illius: Ubi est mulier quae sedebat in bivio? Respondentibus cunctis: Non fuit in loco ista meretrix."
      en: "Asked the men of that place: Where is the woman that sat in the cross way? And when they all made answer: There was no harlot in this place,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Reversus est ad Judam, et dixit ei: Non inveni eam: sed et homines loci illius dixerunt mihi, numquam sedisse ibi scortum."
      en: "He returned to Juda, and said to him: I have not found her; moreover the men of that place said to me, that there never sat a harlot there."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ait Judas: Habeat sibi, certe mendacii arguere nos non potest, ego misi haedum quem promiseram: et tu non invenisti eam."
      en: "Juda said: Let her take it to herself; surely she cannot charge us with a lie: I sent the kid which I promised: and thou didst not find her."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ecce autem post tres menses nuntiaverunt Judae, dicentes: Fornicata est Thamar nurus tua, et videtur uterus illius intumescere. Dixitque Judas: Producite eam ut comburatur."
      en: "And behold after three months they told Juda, saying: Thamar, thy daughter in law hath played the harlot, and she appeareth to have a big belly. And Juda said: Bring her out that she may be burnt."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quae cum duceretur ad poenam, misit ad socerum suum, dicens: De viro, cujus haec sunt, concepi: cognosce cujus sit annulus, et armilla, et baculus."
      en: "But when she was led to execution, she sent to her father in law, saying: By the man, to whom these things belong, I am with child. See whose ring, and bracelet, and staff this is."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Qui, agnitis muneribus, ait: Justior me est: quia non tradidi eam Sela filio meo. Attamen ultra non cognovit eam."
      en: "But he acknowledging the gifts, said: She is juster than I: because I did not give her to Sela, my son. However, he knew her no more."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Instante autem partu, apparuerunt gemini in utero: atque in ipsa effusione infantium unus protulit manum, in qua obstetrix ligavit coccinum, dicens:"
      en: "And when she was ready to be brought to bed, there appeared twins in her womb: and in the very delivery of the infants, one put forth a hand, whereon the midwife tied a scarlet thread, saying:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Iste egredietur prior."
      en: "This shall come forth the first."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Illo vero retrahente manum, egressus est alter: dixitque mulier: Quare divisa est propter te maceria? et ob hanc causam, vocavit nomen ejus Phares."
      en: "But he drawing back his hand, the other came forth: and the woman said: Why is the partition divided for thee? and therefore called his name Phares."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Postea egressus est frater ejus, in cujus manu erat coccinum: quem appellavit Zara."
      en: "Afterwards his brother came out, on whose hand was the scarlet thread: and she called him Zara."
    status: { la: verified, en: verified }
