# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: osee
chapter: 3
verses:
  - n: 1
    text:
      la: "et dixit Dominus ad me adhuc vade dilige mulierem dilectam amico et adulteram sicut diligit Dominus filios Israhel et ipsi respectant ad deos alienos et diligunt vinacea uvarum"
      en: "And the Lord said to me: Go yet again, and love a woman beloved of her friend, and an adulteress : as the Lord loveth the children of Israel, and they look to strange gods, and love the husks of the grapes."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et fodi eam mihi quindecim argenteis et choro hordei et dimidio choro hordei"
      en: "And I bought her to me for fifteen pieces of silver, and for a core of barley, and for half a core of barley."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixi ad eam dies multos expectabis me non fornicaberis et non eris viro sed et ego expectabo te"
      en: "And I said to her: Thou shalt wait for me many days: thou shalt not play the harlot, and thou shalt be no man's, and I also will wait for thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia dies multos sedebunt filii Israhel sine rege et sine principe et sine sacrificio et sine altari et sine ephod et sine therafin"
      en: "For the children of Israel shall sit many days without king, and without prince, and without sacrifice, and without altar, and without ephod, and without theraphim."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et post haec revertentur filii Israhel et quaerent Dominum Deum suum et David regem suum et pavebunt ad Dominum et ad bonum eius in novissimo dierum"
      en: "And after this the children of Israel shall return, and shall seek the Lord their God, and David their king: and they shall fear the Lord, and his goodness in the last days."
    status: { la: verified, en: verified }
