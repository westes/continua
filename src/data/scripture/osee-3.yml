# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: osee
chapter: 3
verses:
  - n: 1
    text:
      la: "Et dixit Dominus ad me: Adhuc vade, et dilige mulierem dilectam amico et adulteram, sicut diligit Dominus filios Israel, et ipsi respiciunt ad deos alienos, et diligunt vinacia uvarum."
      en: "And the Lord said to me: Go yet again, and love a woman beloved of her friend, and an adulteress: as the Lord loveth the children of Israel, and they look to strange gods, and love the husks of the grapes."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et fodi eam mihi quindecim argenteis, et coro hordei, et dimidio coro hordaei."
      en: "And I bought her to me for fifteen pieces of silver, and for a core of barley, and for half a core of barley."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dixi ad eam: Dies multos exspectabis me; non fornicaberis, et non eris viro; sed et ego exspectabo te."
      en: "And I said to her: Thou shalt wait for me many days: thou shalt not play the harlot, and thou shalt be no man's, and I also will wait for thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quia dies multos sedebunt filii Israel sine rege, et sine principe, et sine sacrificio, et sine altari, et sine ephod, et sine theraphim."
      en: "For the children of Israel shall sit many days without king, and without prince, and without sacrifice, and without altar, and without ephod, and without theraphim."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et post haec revertentur filii Israel, et quaerent Dominum Deum suum, et David regem suum: et pavebunt ad Dominum, et ad bonum ejus, in novissimo dierum."
      en: "And after this the children of Israel shall return, and shall seek the Lord their God, and David their king: and they shall fear the Lord, and his goodness in the last days."
    status: { la: verified, en: verified }
