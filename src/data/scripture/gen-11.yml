# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 11
verses:
  - n: 1
    text:
      la: "erat autem terra labii unius et sermonum eorundem"
      en: "And the earth was of one tongue, and of the same speech."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cumque proficiscerentur de oriente invenerunt campum in terra Sennaar et habitaverunt in eo"
      en: "And when they removed from the east, they found a plain in the land of Sennaar, and dwelt in it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixitque alter ad proximum suum venite faciamus lateres et coquamus eos igni habueruntque lateres pro saxis et bitumen pro cemento"
      en: "And each one said to his neighbour: Come, let us make brick, and bake them of stones, and slime instead of mortar."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixerunt venite faciamus nobis civitatem et turrem cuius culmen pertingat ad caelum et celebremus nomen nostrum antequam dividamur in universas terras"
      en: "And they said: Come, let us make a city and a tower, the top whereof may reach to heaven: and let us make our name famous before we be scattered abroad into all lands."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "descendit autem Dominus ut videret civitatem et turrem quam aedificabant filii Adam"
      en: "And the Lord came down to see the city and the tower, which the children of Adam were building."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et dixit ecce unus est populus et unum labium omnibus coeperuntque hoc facere nec desistent a cogitationibus suis donec eas opere conpleant"
      en: "And he said: Behold, it is one people, and all have one tongue: and they have begun to do this, neither will they leave off from their designs, till they accomplish them in deed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "venite igitur descendamus et confundamus ibi linguam eorum ut non audiat unusquisque vocem proximi sui"
      en: "Come ye, therefore, let us go down, and there may not understand one another's speech."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "atque ita divisit eos Dominus ex illo loco in universas terras et cessaverunt aedificare civitatem"
      en: "And so the Lord scattered them from that place into all lands, and they ceased to build the city."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et idcirco vocatum est nomen eius Babel quia ibi confusum est labium universae terrae et inde dispersit eos Dominus super faciem cunctarum regionum"
      en: "And therefore the name thereof was called Babel, because there the language of the whole earth was confounded: and from thence the Lord scattered them abroad upon the face of all countries."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "hae generationes Sem Sem centum erat annorum quando genuit Arfaxad biennio post diluvium"
      en: "These are the generations of Sem: Sem was a hundred years old when he begot Arphaxad, two years old when he begot Arphaxad, two years after the flood."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "vixitque Sem postquam genuit Arfaxad quingentos annos et genuit filios et filias"
      en: "And Sem lived after he begot Arphaxad, five hundred years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "porro Arfaxad vixit triginta quinque annos et genuit Sale"
      en: "And Arphaxad lived thirty-five years, and begot Sale."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "vixitque Arfaxad postquam genuit Sale trecentis tribus annis et genuit filios et filias"
      en: "And Arphaxad lived after he begot Sale, three hundred and three years; and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sale quoque vixit triginta annis et genuit Eber"
      en: "Sale also lived thirty years, and begot Heber."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vixitque Sale postquam genuit Eber quadringentis tribus annis et genuit filios et filias"
      en: "And Sale lived after he begot Heber, four hundred and three years; and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "vixit autem Eber triginta quattuor annis et genuit Faleg"
      en: "And Heber lived thirty-four years, and begot Phaleg."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et vixit Eber postquam genuit Faleg quadringentis triginta annis et genuit filios et filias"
      en: "And Heber lived after he begot Phaleg, four hundred and thirty years: and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "vixit quoque Faleg triginta annis et genuit Reu"
      en: "Phaleg also lived thirty years, and begot Reu."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "vixitque Faleg postquam genuit Reu ducentis novem annis et genuit filios et filias"
      en: "And Phaleg lived after he begot Reu, two hundred and nine years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "vixit autem Reu triginta duobus annis et genuit Sarug"
      en: "And Reu lived thirty-two years, and begot Sarug."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "vixitque Reu postquam genuit Sarug ducentis septem annis et genuit filios et filias"
      en: "And Reu lived after he begot Sarug, two hundred and seven years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vixit vero Sarug triginta annis et genuit Nahor"
      en: "And Sarug lived thirty years, and begot Nachor."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "vixitque Sarug postquam genuit Nahor ducentos annos et genuit filios et filias"
      en: "And Sarug lived after he begot Nachor, two hundred years: and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "vixit autem Nahor viginti novem annis et genuit Thare"
      en: "And Nachor lived nine and twenty years, and begot Thare."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "vixitque Nahor postquam genuit Thare centum decem et novem annos et genuit filios et filias"
      en: "And Nachor lived after he begot Thare, a hundred and nineteen years: and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "vixitque Thare septuaginta annis et genuit Abram et Nahor et Aran"
      en: "And Thare lived seventy years, and begot Abram, and Nachor, and Aran."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "hae sunt autem generationes Thare Thare genuit Abram et Nahor et Aran porro Aran genuit Loth"
      en: "And these are the generations of Thare: Thare begot Abram, Nachor, and Aran. And Aran begot Lot."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "mortuusque est Aran ante Thare patrem suum in terra nativitatis suae in Ur Chaldeorum"
      en: "And Aran died before Thare his father, in the land of his nativity in Ur of the Chaldees."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "duxerunt autem Abram et Nahor uxores nomen autem uxoris Abram Sarai et nomen uxoris Nahor Melcha filia Aran patris Melchae et patris Ieschae"
      en: "And Abram and Nachor married wives: the name of Abram's wife was Sarai: and the name of Nachor's wife, Melcha, the daughter of Aran, father of Melcha, and father of Jescha."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "erat autem Sarai sterilis nec habebat liberos"
      en: "And Sarai was barren, and had no children."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "tulit itaque Thare Abram filium suum et Loth filium Aran filium filii sui et Sarai nurum suam uxorem Abram filii sui et eduxit eos de Ur Chaldeorum ut irent in terram Chanaan veneruntque usque Haran et habitaverunt ibi"
      en: "And Thare took Abram, his son, and Lot the son of Aran, his son's son, and Sarai his daughter in law, the wife of Abram his son, and brought them out of Ur of the Chaldees, to go into the land of Chanaan: and they came as far as Haran, and dwelt there."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et facti sunt dies Thare ducentorum quinque annorum et mortuus est in Haran"
      en: "And the days of Thare were tow hundred and five years, and he died in Haran."
    status: { la: verified, en: verified }
