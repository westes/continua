# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 11
verses:
  - n: 1
    text:
      la: "Erat autem terra labii unius, et sermonum eorumdem."
      en: "And the earth was of one tongue, and of the same speech."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cumque proficiscerentur de oriente, invenerunt campum in terra Senaar, et habitaverunt in eo."
      en: "And when they removed from the east, they found a plain in the land of Sennaar, and dwelt in it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixitque alter ad proximum suum: Venite, faciamus lateres, et coquamus eos igni. Habueruntque lateres pro saxis, et bitumen pro caemento:"
      en: "And each one said to his neighbour: Come, let us make brick, and bake them with fire. And they had brick instead of stones, and slime instead of mortar."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixerunt: Venite, faciamus nobis civitatem et turrim, cujus culmen pertingat ad caelum: et celebremus nomen nostrum antequam dividamur in universas terras."
      en: "And they said: Come, let us make a city and a tower, the top whereof may reach to heaven: and let us make our name famous before we be scattered abroad into all lands."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Descendit autem Dominus ut videret civitatem et turrim, quam aedificabant filii Adam,"
      en: "And the Lord came down to see the city and the tower, which the children of Adam were building."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et dixit: Ecce, unus est populus, et unum labium omnibus: coeperuntque hoc facere, nec desistent a cogitationibus suis, donec eas opere compleant."
      en: "And he said: Behold, it is one people, and all have one tongue: and they have begun to do this, neither will they leave off from their designs, till they accomplish them in deed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Venite igitur, descendamus, et confundamus ibi linguam eorum, ut non audiat unusquisque vocem proximi sui."
      en: "Come ye, therefore, let us go down, and there confound their tongue, that they may not understand one another's speech."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Atque ita divisit eos Dominus ex illo loco in universas terras, et cessaverunt aedificare civitatem."
      en: "And so the Lord scattered them from that place into all lands, and they ceased to build the city."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et idcirco vocatum est nomen ejus Babel, quia ibi confusum est labium universae terrae: et inde dispersit eos Dominus super faciem cunctarum regionum."
      en: "And therefore the name thereof was called Babel, because there the language of the whole earth was confounded: and from thence the Lord scattered them abroad upon the face of all countries."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Hae sunt generationes Sem: Sem erat centum annorum quando genuit Arphaxad, biennio post diluvium."
      en: "These are the generations of Sem: Sem was a hundred years old when he begot Arphaxad, two years after the flood."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vixitque Sem, postquam genuit Arphaxad, quingentis annis: et genuit filios et filias."
      en: "And Sem lived after he begot Arphaxad, five hundred years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Porro Arphaxad vixit triginta quinque annis, et genuit Sale."
      en: "And Arphaxad lived thirty-five years, and begot Sale."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Vixitque Arphaxad, postquam genuit Sale, trecentis tribus annis: et genuit filios et filias."
      en: "And Arphaxad lived after he begot Sale, three hundred and three years; and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sale quoque vixit triginta annis, et genuit Heber."
      en: "Sale also lived thirty years, and begot Heber."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vixitque Sale, postquam genuit Heber, quadringentis tribus annis: et genuit filios et filias."
      en: "And Sale lived after he begot Heber, four hundred and three years; and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vixit autem Heber triginta quatuor annis, et genuit Phaleg."
      en: "And Heber lived thirty-four years, and begot Phaleg."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et vixit Heber postquam genuit Phaleg, quadringentis triginta annis: et genuit filios et filias."
      en: "And Heber lived after he begot Phaleg, four hundred and thirty years: and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vixit quoque Phaleg triginta annis, et genuit Reu."
      en: "Phaleg also lived thirty years, and begot Reu."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Vixitque Phaleg, postquam genuit Reu, ducentis novem annis: et genuit filios et filias."
      en: "And Phaleg lived after he begot Reu, two hundred and nine years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vixit autem Reu triginta duobus annis, et genuit Sarug."
      en: "And Reu lived thirty-two years, and begot Sarug."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Vixit quoque Reu, postquam genuit Sarug, ducentis septem annis: et genuit filios et filias."
      en: "And Reu lived after he begot Sarug, two hundred and seven years, and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Vixit vero Sarug triginta annis, et genuit Nachor."
      en: "And Sarug lived thirty years, and begot Nachor."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Vixitque Sarug, postquam genuit Nachor, ducentis annis: et genuit filios et filias."
      en: "And Sarug lived after he begot Nachor, two hundred years: and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Vixit autem Nachor viginti novem annis, et genuit Thare."
      en: "And Nachor lived nine and twenty years, and begot Thare."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Vixitque Nachor, postquam genuit Thare, centum decem et novem annis: et genuit filios et filias."
      en: "And Nachor lived after he begot Thare, a hundred and nineteen years: and begot sons and daughters."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Vixitque Thare septuaginta annis, et genuit Abram, et Nachor, et Aran."
      en: "And Thare lived seventy years, and begot Abram, and Nachor, and Aran."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Hae sunt autem generationes Thare: Thare genuit Abram, Nachor et Aran. Porro Aran genuit Lot."
      en: "And these are the generations of Thare: Thare begot Abram, Nachor, and Aran. And Aran begot Lot."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Mortuusque est Aran ante Thare patrem suum, in terra nativitatis suae, in Ur Chaldaeorum."
      en: "And Aran died before Thare his father, in the land of his nativity in Ur of the Chaldees."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Duxerunt autem Abram et Nachor uxores: nomen uxoris Abram, Sarai: et nomen uxoris Nachor, Melcha filia Aran, patris Melchae, et patris Jeschae."
      en: "And Abram and Nachor married wives: the name of Abram's wife was Sarai: and the name of Nachor's wife, Melcha, the daughter of Aran, father of Melcha, and father of Jescha."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Erat autem Sarai sterilis, nec habebat liberos."
      en: "And Sarai was barren, and had no children."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Tulit itaque Thare Abram filium suum, et Lot filium Aran, filium filii sui, et Sarai nurum suam, uxorem Abram filii sui, et eduxit eos de Ur Chaldaeorum, ut irent in terram Chanaan: veneruntque usque Haran, et habitaverunt ibi."
      en: "And Thare took Abram, his son, and Lot the son of Aran, his son's son, and Sarai his daughter in law, the wife of Abram his son, and brought them out of Ur of the Chaldees, to go into the land of Chanaan: and they came as far as Haran, and dwelt there."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et facti sunt dies Thare ducentorum quinque annorum, et mortuus est in Haran."
      en: "And the days of Thare were two hundred and five years, and he died in Haran."
    status: { la: verified, en: verified }
