# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 9
verses:
  - n: 1
    text:
      la: "quis dabit capiti meo aquam et oculis meis fontem lacrimarum et plorabo die et nocte interfectos filiae populi mei"
      en: "Who will give water to my head, and a fountain of tears to my eyes? and I will weep day and night for the slain of the daughter of my people."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quis dabit me in solitudine diversorium viatorum et derelinquam populum meum et recedam ab eis quia omnes adulteri sunt coetus praevaricatorum"
      en: "Who will give me in the wilderness a lodging place of wayfaring men, and I will leave my people, and depart from them? because they are all adulterers, an assembly of transgressors."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et extenderunt linguam suam quasi arcum mendacii et non veritatis confortati sunt in terra quia de malo ad malum egressi sunt et me non cognoverunt dicit Dominus"
      en: "And they have bent their tongue, as a bow, for lies, and not for truth: they have strengthened themselves upon the earth, for they have proceeded from evil to evil, and me they have not known, saith the Lord."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "unusquisque se a proximo suo custodiat et in omni fratre suo non habeat fiduciam quia omnis frater subplantans subplantabit et omnis amicus fraudulenter incedet"
      en: "Let every man take heed of his neighbor, and let his not trust in any brother of his: for every brother will utterly supplant, and every friend will walk deceitfully."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et vir fratrem suum deridebit et veritatem non loquentur docuerunt enim linguam suam loqui mendacium ut inique agerent laboraverunt"
      en: "And a man shall mock his brother, and they will not speak the truth: for they have taught their tongue to speak lies: they have laboured to commit iniquity."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "habitatio tua in medio doli in dolo rennuerunt scire me dicit Dominus"
      en: "Thy habitation is in the midst of deceit: Through deceit they have refused to know me, saith the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "propterea haec dicit Dominus exercituum ecce ego conflabo et probabo eos quid enim aliud faciam a facie filiae populi mei"
      en: "Therefore thus saith the Lord of hosts: Behold I will melt, and try them: for what else shall I do before the daughter of my people?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sagitta vulnerans lingua eorum dolum locuta est in ore suo pacem cum amico suo loquitur et occulte ponit ei insidias"
      en: "Their tongue is a piercing arrow, it hath spoken deceit: with his mouth one speaketh peace with his friend, and secretly he lieth in wait for him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "numquid super his non visitabo dicit Dominus aut in gentem huiuscemodi non ulciscetur anima mea"
      en: "Shall I not visit them for these things, saith the Lord? or shall not my soul be revenged on such a nation?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "super montes adsumam fletum ac lamentum et super speciosa deserti planctum quoniam incensa sunt eo quod non sit vir pertransiens et non audierunt vocem possidentis a volucre caeli usque ad pecora transmigraverunt et recesserunt"
      en: "For the mountains I will take up weeping and lamentation, and for the beautiful places of the desert, mourning: because they are burnt up, for that there is not a man that passeth through them: and they have not heard the voice of the owner: from the fowl of the air to the beasts they are gone away and departed."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dabo Hierusalem in acervos harenae et cubilia draconum et civitates Iuda dabo in desolationem eo quod non sit habitator"
      en: "And I will make Jerusalem to be heaps of sand, and dens of dragons: and I will make the cities of Juda desolate, for want of an inhabitant."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quis est vir sapiens qui intellegat hoc et ad quem verbum oris Domini fiat ut adnuntiet istud quare perierit terra exusta sit quasi desertum eo quod non sit qui pertranseat"
      en: "Who is the wise man, that may understand this, and to whom the word of the mouth of the Lord may come that he may declare this, why the land hath perished, and is burnt up like a wilderness, which none passeth through?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dixit Dominus quia dereliquerunt legem meam quam dedi eis et non audierunt vocem meam et non ambulaverunt in ea"
      en: "And the Lord said: Because they have forsaken my law, which I gave them, and have not heard my voice, and have not walked in it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et abierunt post pravitatem cordis sui et post Baalim quos didicerunt a patribus suis"
      en: "But they have gone after the perverseness of their own heart, and after Baalim, which their fathers taught them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "idcirco haec dicit Dominus exercituum Deus Israhel ecce ego cibabo eos populum istum absinthio et potum dabo eis aquam fellis"
      en: "Therefore thus saith the Lord of hosts the God of Israel: Behold I will feed this people with wormwood, and give them water of gall to drink."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dispergam eos in gentibus quas non noverunt ipsi et patres eorum et mittam post eos gladium donec consumantur"
      en: "And I will scatter them among the nations, which they and their fathers have not known: and I will send the sword after them till they be consumed."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "haec dicit Dominus exercituum contemplamini et vocate lamentatrices et veniant et ad eas quae sapientes sunt mittite et properent"
      en: "Thus saith the Lord of hosts the God of Israel: Consider ye, and call for the mourning women, and let them come: and send to them that are wise women, and let them make haste:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "festinent et adsumant super nos lamentum deducant oculi nostri lacrimas et palpebrae nostrae defluant aquis"
      en: "Let them hasten and take up a lamentation for us: let our eyes shed tears, and our eyelids run down with waters."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quia vox lamentationis audita est de Sion quomodo vastati sumus et confusi vehementer quia dereliquimus terram quoniam deiecta sunt tabernacula nostra"
      en: "For a voice of wailing is heard out of Sion: How are we wasted and greatly confounded? because we have left the land, because our dwellings are cast down."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "audite ergo mulieres verbum Domini et adsumat auris vestra sermonem oris eius et docete filias vestras lamentum et unaquaeque proximam suam planctum"
      en: "Hear therefore, ye women, the word of the Lord: and let your ears receive the word of his mouth: and teach your daughters wailing: and every one her neighbor mourning."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quia ascendit mors per fenestras nostras ingressa est domos nostras disperdere parvulos de foris iuvenes de plateis"
      en: "For death is come up through our windows, it is entered into our houses to destroy the children from without, the young men from the streets."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "loquere haec dicit Dominus et cadet morticinum hominis quasi stercus super faciem regionis et quasi faenum post tergum metentis et non est qui colligat"
      en: "Speak: Thus saith the Lord: Even the carcass of man shall fall as dung upon the face of the country, and as grass behind the back of the mower, and there is none to gather it."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "haec dicit Dominus non glorietur sapiens in sapientia sua et non glorietur fortis in fortitudine sua et non glorietur dives in divitiis suis"
      en: "Thus saith the Lord: Let not the wise man glory in his wisdom, and let not the strong man glory in his strength, and let not the rich man glory in his riches:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sed in hoc glorietur qui gloriatur scire et nosse me quia ego sum Dominus qui facio misericordiam et iudicium et iustitiam in terra haec enim placent mihi ait Dominus"
      en: "But let him that glorieth glory in this, that he understandeth and knoweth me, for I am the Lord that exercise mercy, and judgment, and justice in the earth: for these things please me, saith the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ecce dies veniunt dicit Dominus et visitabo super omnem qui circumcisum habet praeputium"
      en: "Behold, the days come, saith the Lord, and I will visit upon every one that hath the foreskin circumcised."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "super Aegyptum et super Iudam et super Edom et super filios Ammon et super Moab et super omnes qui adtonsi sunt in comam habitantes in deserto quia omnes gentes habent praeputium omnis autem domus Israhel incircumcisi sunt corde"
      en: "Upon Egypt, and upon Juda, and upon Edom, and upon the children of Ammon, and upon Moab, and upon all that have their hair polled round, that dwell in the desert: for all the nations are uncircumcised in the flesh, but all the house of Israel are uncircumcised in the heart."
    status: { la: verified, en: verified }
