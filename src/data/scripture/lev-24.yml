# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 24
verses:
  - n: 1
    text:
      la: "et locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "praecipe filiis Israhel ut adferant tibi oleum de olivis purissimum ac lucidum ad concinnandas lucernas iugiter"
      en: "Command the children of Israel, that they bring unto thee the finest and dearest oil of olives, to furnish the lamps continually,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "extra velum testimonii in tabernaculo foederis ponetque eas Aaron a vespere usque in mane coram Domino cultu rituque perpetuo in generationibus vestris"
      en: "Without the veil of the testimony in the tabernacle of the covenant. And Aaron shall set them from evening until morning before the Lord, by a perpetual service and rite in your generations."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "super candelabro mundissimo ponentur semper in conspectu Domini"
      en: "They shall be set upon the most pure candlestick before the Lord continually."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "accipies quoque similam et coques ex ea duodecim panes qui singuli habebunt duas decimas"
      en: "Thou shalt take also fine hour, and shalt bake twelve leaves thereof, two tenths shall be in every loaf :"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quorum senos altrinsecus super mensam purissimam coram Domino statues"
      en: "And thou shalt set them six and six one against another upon the most clean table before the Lord:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et pones super eos tus lucidissimum ut sit panis in monumentum oblationis Domini"
      en: "And thou shalt put upon them the dearest frankincense, that the bread may be for a memorial of the oblation of the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "per singula sabbata mutabuntur coram Domino suscepti a filiis Israhel foedere sempiterno"
      en: "Every sabbath they shall be changed before the Lord, being received of the children of Israel by an everlasting covenant:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "eruntque Aaron et filiorum eius ut comedant eos in loco sancto quia sanctum sanctorum est de sacrificiis Domini iure perpetuo"
      en: "And they shall be Aaron's and his sons', that they may eat them in the holy place: because it is most holy of the sacrifices of the Lord by a perpetual right."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ecce autem egressus filius mulieris israhelitis quem pepererat de viro aegyptio inter filios Israhel iurgatus est in castris cum viro israhelite"
      en: "And behold there went out the son of a woman of Israel, whom she had of an Egyptian, among the children of Israel, and fell at words in the camp with a man of Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque blasphemasset nomen et maledixisset ei adductus est ad Mosen vocabatur autem mater eius Salumith filia Dabri de tribu Dan"
      en: "And when he had blasphemed the name, and had cursed it, he was brought to Moses: (now his mother was called Salumith, the daughter of Dabri, of the tribe of Dan:)"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "miseruntque eum in carcerem donec nossent quid iuberet Dominus"
      en: "And they put him into prison, till they might know what the Lord would command."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui locutus est ad Mosen"
      en: "And the Lord spoke to Moses,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dicens educ blasphemum extra castra et ponant omnes qui audierunt manus suas super caput eius et lapidet eum populus universus"
      en: "Saying: Bring forth the blasphemer without the camp, and let them that heard him, put their hands upon his head, and let all the people stone him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ad filios Israhel loqueris homo qui maledixerit Deo suo portabit peccatum suum"
      en: "And thou shalt speak to the children of Israel: the man that curseth his God, shall bear his sin:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et qui blasphemaverit nomen Domini morte moriatur lapidibus opprimet eum omnis multitudo sive ille civis seu peregrinus fuerit qui blasphemaverit nomen Domini morte moriatur"
      en: "And he that blasphemeth the name of the Lord, dying let him die: all the multitude shall stone him, whether he be a native or a stranger. He that blasphemeth the name of the Lord, dying let him die."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui percusserit et occiderit hominem morte moriatur"
      en: "He that striketh and killeth a man, dying let him die."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui percusserit animal reddat vicarium id est animam pro anima"
      en: "He that killeth a beast, shall make it good, that is to say, shall give beast for beast."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui inrogaverit maculam cuilibet civium suorum sicut fecit fiet ei"
      en: "He that giveth a blemish to any of his neighbours: as he hath done, so shall it be done to him:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "fracturam pro fractura oculum pro oculo dentem pro dente restituet qualem inflixerit maculam talem sustinere cogetur"
      en: "Breach for breach, eye for eye, tooth for tooth, shall he restore. What blemish he gave, the like shall he be compelled to suffer."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui percusserit iumentum reddet aliud qui percusserit hominem punietur"
      en: "He that striketh a beast, shall render another. He that striketh a man shall be punished."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "aequum iudicium sit inter vos sive peregrinus sive civis peccaverit quia ego sum Dominus Deus vester"
      en: "Let there be equal judgment among you, whether he be a stranger, or a native that offends: because I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "locutusque est Moses ad filios Israhel et eduxerunt eum qui blasphemaverat extra castra ac lapidibus oppresserunt feceruntque filii Israhel sicut praeceperat Dominus Mosi"
      en: "And Moses spoke to the children of Israel: and they brought forth him that had blasphemed, without the camp, and they stoned him. And the children of Israel did as the Lord had commanded Moses."
    status: { la: verified, en: verified }
