# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 4
verses:
  - n: 1
    text:
      la: "fili elemosynam pauperis ne fraudes et oculos tuos ne transvertas a paupere"
      en: "Son, defraud not the poor of alms, and turn not away thy eyes from the poor."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "animam esurientem ne despexeris et non exasperes pauperem in inopia sua"
      en: "Despise not the hungry soul: and provoke not the Boor in his want."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cor inopis ne adflixeris et non protrahas datum angustianti"
      en: "Afflict not the heart of the needy, and defer not to give to him that is in distress."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "rogationem contribulati ne abicias et non avertas faciem tuam ab egeno"
      en: "Reject not the petition of the afflicted: and turn not away thy face from the needy."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ab inope ne avertas oculos propter iram et non relinquas quaerentibus tibi retro maledicere"
      en: "Turn not away thy eyes from the poor for fear of anger: and leave not to them that ask of thee to curse thee behind thy back."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "maledicentis enim te in amaritudine exaudietur precatio illius exaudiet autem eum qui fecit illum"
      en: "For the prayer of him that curseth thee in the bitterness of his soul, shall be heard, for he that made him will hear him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "congregationi pauperum affabilem te facito et presbytero humilia animam tuam et magnato humilia caput tuum"
      en: "Make thyself affable to the congregation of the poor, and humble thy soul to the ancient, and bow thy head to a great man."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "declina pauperi aurem tuam et redde debitum tuum et responde pacifica in mansuetudine"
      en: "Bow down thy ear cheerfully to the poor, and pay what thou owest, and answer him peaceable words with mildness."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "libera eum qui iniuriam patitur de manu superbi et non acide feras in anima tua"
      en: "Deliver him that suffereth wrong out of the hand of the proud: and be not fainthearted in thy soul."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in iudicando esto pupillis misericors ut pater et pro viro matri illorum"
      en: "In judging be merciful to the fatherless as a father, and as a husband to their mother."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et eris velut filius Altissimi obaudiens et miserebitur tui magis quam mater"
      en: "And thou shalt be as the obedient son of the most High, and he will have mercy on thee more than a mother."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sapientia filiis suis vitam inspiravit et suscipit exquirentes se et praeibit in viam iustitiae"
      en: "Wisdom inspireth life into her children, and protecteth them that seek after her, and will go before them in the way of justice."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et qui illam diligit diligit vitam et qui vigilaverint ad illam conplectebuntur placorem eius"
      en: "And he that loveth her, loveth life: and they that watch for her, shall embrace her sweetness."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui tenuerint illam vitam hereditabunt et quo introibit benedicit Deus"
      en: "They that hold her fast, shall inherit life: and whithersoever she entereth, God will give a blessing."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui serviunt ei obsequentes erunt Sancto et eos qui diligunt illam diligit Deus"
      en: "They that serve her, shall be servants to the holy one: and God loveth them that love her."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui audit illam iudicat gentes et qui intuetur illam permanebit confidens"
      en: "He that hearkeneth to her, shall judge nations: and he that looketh upon her, shall remain secure."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "si crediderit ei hereditabit illam et erunt in confirmatione creaturae illorum"
      en: "If he trust to her, he shall inherit her, and his generation shall be in assurance."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quoniam in temptatione ambulat cum eo et in primis eligit eum"
      en: "For she walketh with him in temptation, and at the first she chooseth him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "timorem et metum et adprobationem inducet super illum et cruciabit illum in tribulatione doctrinae suae donec temptet illum in cogitationibus illius et credat animae illius"
      en: "She will bring upon him fear and dread and trial: and she will scourge him with the affliction of her discipline, till she try him by her laws, and trust his soul."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et firmabit illum et iterum adducet directum ad illum"
      en: "Then she will strengthen him, and make a straight way to him, and give him joy,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et denudat absconsa sua et thesaurizat super illum scientiam et intellectum iustitiae"
      en: "And will disclose her secrets to him, and will heap upon him treasures of knowledge and understanding of justice."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "si autem oberraverit derelinquet eum et tradet illum in manus inimici sui"
      en: "But if he go astray, she will forsake him, and deliver him into the hands of his enemy."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "fili conserva tempus et devita a malo"
      en: "Son, observe the time, and fly from evil."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "pro anima tua non confundaris dicere verum"
      en: "For thy soul be not ashamed to say the truth."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "est enim confusio adducens peccatum et est confusio adducens gloriam et gratiam"
      en: "For there is a shame that bringeth sin, and there is a shame that bringeth glory and grace."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ne accipias faciem adversus faciem tuam nec adversus animam tuam mendacium"
      en: "Accept no person against thy own person, nor against thy soul a lie."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "non reverearis proximum tuum in casum suum"
      en: "Reverence not thy neighbour in his fall:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "nec retineas verbum in tempus salutis non abscondas sapientiam tuam in decore eius"
      en: "And refrain not to speak in the time of salvation. Hide not thy wisdom in her beauty."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "in lingua enim agnoscitur sapientia et sensus et scientia et doctrina in verbis veritatis et firmamentum in operibus iustitiae"
      en: "For by the tongue wisdom is discerned: and understanding, and knowledge, and learning by the word of the wise, and steadfastness in the works of justice."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "non contradicas veritati ullo modo et de mendacio ineruditionis tuae confundere"
      en: "In nowise speak against the truth, but be ashamed of the lie of thy ignorance."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "non confundaris confiteri peccata tua et ne subicias te homini pro peccato"
      en: "Be not ashamed to confess thy sins, but submit not thyself to every man for sin."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "noli resistere contra faciem potentis nec coneris contra ictum fluvii"
      en: "Resist not against the face of the mighty, and do not strive against the stream of the river."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "pro iustitia agoniare pro anima tua et usque ad mortem certa pro iustitia et Deus expugnabit pro te inimicos tuos"
      en: "Strive for justice for thy soul, and even unto death fight for justice, and God will overthrow thy enemies for thee."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "noli citatus esse in lingua tua et inutilis et remissus in operibus tuis"
      en: "Be not hasty in thy tongue: and slack and remiss in thy works."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "noli esse sicut leo in domo tua evertens domesticos tuos et opprimens subiectos tibi"
      en: "Be not as a lion in thy house, terrifying them of thy household, and oppressing them that are under thee."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "non sit porrecta manus tua ad accipiendum et ad reddendum collecta"
      en: "Let not thy hand be stretched out to receive, and shut when thou shouldst give."
    status: { la: verified, en: verified }
