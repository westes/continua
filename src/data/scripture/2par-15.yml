# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 15
verses:
  - n: 1
    text:
      la: "Azarias autem filius Oded, facto in se spiritu Dei,"
      en: "And the spirit of God came upon Azarias the son of Oded,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "egressus est in occursum Asa, et dixit ei: Audite me, Asa, et omnis Juda et Benjamin: Dominus vobiscum, quia fuistis cum eo. Si quaesieritis eum, invenietis: si autem dereliqueritis eum, derelinquet vos."
      en: "And he went out to meet Asa, and said to him: Hear ye me, Asa, and all Juda and Benjamin: The Lord is with you, because you have been with him. If you seek him, you shall find: but if you forsake him, he will forsake you."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Transibant autem multi dies in Israel absque Deo vero, et absque sacerdote doctore, et absque lege."
      en: "And many days shall pass in Israel without the true God, and without a priest a teacher, and without the law."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cumque reversi fuerint in angustia sua ad Dominum Deum Israel, et quaesierint eum, reperient eum."
      en: "And when in their distress they shall return to the Lord the God of Israel, and shall seek him, they shall find him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "In tempore illo, non erit pax egredienti et ingredienti, sed terrores undique in cunctis habitatoribus terrarum:"
      en: "At that time there shall be no peace to him that goeth out and cometh in, but terrors on every side among all the inhabitants of the earth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "pugnavit enim gens contra gentem, et civitas contra civitatem, quia Dominus conturbabit eos in omni angustia."
      en: "For nation shall fight against nation, and city against city, for the Lord will trouble them with all distress."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vos ergo confortamini, et non dissolvantur manus vestrae: erit enim merces operi vestro."
      en: "Do you therefore take courage, and let not your hands be weakened: for there shall be a reward for your work."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quod cum audisset Asa, verba scilicet, et prophetiam Azariae filii Oded prophetae, confortatus est, et abstulit idola de omni terra Juda et de Benjamin et ex urbibus, quas ceperat, montis Ephraim, et dedicavit altare Domini quod erat ante porticum Domini."
      en: "And when Asa had heard the words, and the prophecy of Azarias the son of Oded the prophet, he took courage, and took away the idols out of all the land of Juda, and out of Benjamin, and out of the cities of mount Ephraim, which he had taken, and he dedicated the altar of the Lord, which was before the porch of the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Congregavitque universum Judam et Benjamin, et advenas cum eis de Ephraim, et de Manasse, et de Simeon: plures enim ad eum confugerant ex Israel, videntes quod Dominus Deus illius esset cum eo."
      en: "And he gathered together all Juda and Benjamin, and the strangers with them of Ephraim, and Manasses, and Simeon: for many were come over to him out of Israel, seeing that the Lord his God was with him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cumque venissent in Jerusalem mense tertio, anno decimoquinto regni Asa,"
      en: "And when they were come to Jerusalem in the third month, in the fifteenth year of the reign of Asa,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "immolaverunt Domino in die illa de manubiis, et praeda, quam adduxerant, boves septingentos, et arietes septem millia."
      en: "They sacrificed to the Lord in that day of the spoils, and of the prey, that they had brought, seven hundred oxen, and seven thousand rams."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et intravit ex more ad corroborandum foedus ut quaererent Dominum Deum patrum suorum in toto corde, et in tota anima sua."
      en: "And he went in to confirm as usual the covenant, that they should seek the Lord the God of their fathers with all their heart, and with all their soul."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si quis autem, inquit, non quaesierit Dominum Deum Israel, moriatur, a minimo usque ad maximum, a viro usque ad mulierem."
      en: "And if any one, said he, seek not the Lord the God of Israel, let him die, whether little or great, man or woman."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Juraveruntque Domino voce magna in jubilo, et in clangore tubae, et in sonitu buccinarum,"
      en: "And they swore to the Lord with a loud voice with joyful shouting, and with sound of trumpet, and sound of comets,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "omnes qui erant in Juda cum execratione: in omni enim corde suo juraverunt, et in tota voluntate quaesierunt eum, et invenerunt: praestititque eis Dominus requiem per circuitum."
      en: "All that were in Juda with a curse: for with all their heart they swore, and with all their will they sought him, and they found him, and the Lord gave them rest round about."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sed et Maacham matrem Asa regis ex augusto deposuit imperio, eo quod fecisset in luco simulacrum Priapi: quod omne contrivit, et in frustra comminuens combussit in torrente Cedron."
      en: "Moreover Maacha the mother of king Asa he deposed from the royal authority, because she had made in a grove an idol of Priapus: and he entirely destroyed it, and breaking it into pieces, burnt it at the torrent Cedron."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Excelsa autem derelicta sunt in Israel: attamen cor Asa erat perfectum cunctis diebus ejus,"
      en: "But high places were left in Israel: nevertheless the heart of Asa was perfect all his days."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "eaque quae voverat pater suus, et ipse, intulit in domum Domini, argentum, et aurum, vasorumque diversam supellectilem."
      en: "And the things which his father had vowed, and he himself had vowed, he brought into the house of the Lord, gold and silver, and vessels of divers uses."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Bellum vero non fuit usque ad trigesimum quintum annum regni Asa."
      en: "And there was no war unto the five and thirtieth year of the kingdom of Asa."
    status: { la: verified, en: verified }
