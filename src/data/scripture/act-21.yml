# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 21
verses:
  - n: 1
    text:
      la: "cum autem factum esset ut navigaremus abstracti ab eis recto cursu venimus Cho et sequenti die Rhodum et inde Patara"
      en: "And when it came to pass that, being parted from them, we set sail, we came with a straight course to Coos, and the day following to Rhodes, and from thence to Patara."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et cum invenissemus navem transfretantem in Foenicen ascendentes navigavimus"
      en: "And when we had found a ship sailing over to Phenice, we went aboard, and set forth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cum paruissemus autem Cypro et relinquentes eam ad sinistram navigabamus in Syriam et venimus Tyrum ibi enim navis erat expositura onus"
      en: "And when we had discovered Cyprus, leaving it on the left hand, we sailed into Syria, and came to Tyre: for there the ship was to unlade her burden."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "inventis autem discipulis mansimus ibi diebus septem qui Paulo dicebant per Spiritum ne ascenderet Hierosolymam"
      en: "And finding disciples, we tarried there seven days: who said to Paul through the Spirit, that he should not go up to Jerusalem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et explicitis diebus profecti ibamus deducentibus nos omnibus cum uxoribus et filiis usque foras civitatem et positis genibus in litore oravimus"
      en: "And the days being expired, departing we went forward, they all bringing us on our way, with their wives and children, till we were out of the city: and we kneeled down on the shore, and we prayed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et cum valefecissemus invicem ascendimus in navem illi autem redierunt in sua"
      en: "And when we had bid one another farewell, we took ship; and they returned home."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nos vero navigatione explicita a Tyro descendimus Ptolomaida et salutatis fratribus mansimus die una apud illos"
      en: "But we having finished the voyage by sea, from Tyre came down to Ptolemais: and saluting the brethren, we abode one day with them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "alia autem die profecti venimus Caesaream et intrantes in domum Philippi evangelistae qui erat de septem mansimus apud eum"
      en: "And the next day departing, we came to Caesarea. And entering into the house of Philip the evangelist, who was one of the seven, we abode with him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "huic autem erant filiae quattuor virgines prophetantes"
      en: "And he had four daughters, virgins, who did prophesy."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et cum moraremur per dies aliquot supervenit quidam a Iudaea propheta nomine Agabus"
      en: "And as we tarried there for some days, there came from Judea a certain prophet, named Agabus."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "is cum venisset ad nos tulit zonam Pauli et alligans sibi pedes et manus dixit haec dicit Spiritus Sanctus virum cuius est zona haec sic alligabunt in Hierusalem Iudaei et tradent in manus gentium"
      en: "Who, when he was come to us, took Paul's girdle: and binding his own feet and hands, he said: Thus saith the Holy Ghost: The man whose girdle this is, the Jews shall bind in this manner in Jerusalem, and shall deliver him into the hands of the Gentiles."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quod cum audissemus rogabamus nos et qui loci illius erant ne ascenderet Hierosolymam"
      en: "Which when we had heard, both we and they that were of that place, desired him that he would not go up to Jerusalem."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tunc respondit Paulus et dixit quid facitis flentes et adfligentes cor meum ego enim non solum alligari sed et mori in Hierusalem paratus sum propter nomen Domini Iesu"
      en: "Then Paul answered, and said: What do you mean weeping and afflicting my heart? For I am ready not only to be bound, but to die also in Jerusalem, for the name of the Lord Jesus."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et cum ei suadere non possemus quievimus dicentes Domini voluntas fiat"
      en: "And when we could not persuade him, we ceased, saying: The will of the Lord be done."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "post dies autem istos praeparati ascendebamus Hierusalem"
      en: "And after those days, being prepared, we went up to Jerusalem."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "venerunt autem et ex discipulis a Caesarea nobiscum adducentes apud quem hospitaremur Mnasonem quendam Cyprium antiquum discipulum"
      en: "And there went also with us some of the disciples from Caesarea, bringing with them one Mnason a Cyprian, an old disciple, with whom we should lodge."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et cum venissemus Hierosolymam libenter exceperunt nos fratres"
      en: "And when we were come to Jerusalem, the brethren received us gladly."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sequenti autem die introibat Paulus nobiscum ad Iacobum omnesque collecti sunt seniores"
      en: "And the day following, Paul went in with us unto James; and all the ancients were assembled."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quos cum salutasset narrabat per singula quae fecisset Deus in gentibus per ministerium ipsius"
      en: "Whom when he had saluted, he related particularly what things God had wrought among the Gentiles by his ministry."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "at illi cum audissent magnificabant Deum dixeruntque ei vides frater quot milia sint in Iudaeis qui crediderunt et omnes aemulatores sunt legis"
      en: "But they hearing it, glorified God, and said to him: Thou seest, brother, how many thousands there are among the Jews that have believed: and they are all zealous for the law."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "audierunt autem de te quia discessionem doceas a Mose eorum qui per gentes sunt Iudaeorum dicens non debere circumcidere eos filios suos neque secundum consuetudinem ingredi"
      en: "Now they have heard of thee that thou teachest those Jews, who are among the Gentiles, to depart from Moses: saying, that they ought not to circumcise their children, nor walk according to the custom."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quid ergo est utique oportet convenire multitudinem audient enim te supervenisse"
      en: "What is it therefore? the multitude must needs come together: for they will hear that thou art come."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "hoc ergo fac quod tibi dicimus sunt nobis viri quattuor votum habentes super se"
      en: "Do therefore this that we say to thee. We have four men, who have a vow on them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "his adsumptis sanctifica te cum illis et inpende in illis ut radant capita et scient omnes quia quae de te audierunt falsa sunt sed ambulas et ipse custodiens legem"
      en: "Take these, and sanctify thyself with them: and bestow on them, that they may shave their heads: and all will know that the things which they have heard of thee, are false; but that thou thyself also walkest keeping the law."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "de his autem qui crediderunt ex gentibus nos scripsimus iudicantes ut abstineant se ab idolis immolato et sanguine et suffocato et fornicatione"
      en: "But as touching the Gentiles that believe, we have written, decreeing that they should only refrain themselves from that which has been offered to idols, and from blood, and from things strangles, and from fornication."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "tunc Paulus adsumptis viris postera die purificatus cum illis intravit in templum adnuntians expletionem dierum purificationis donec offerretur pro unoquoque eorum oblatio"
      en: "Then Paul took the men, and the next day being purified with them, entered into the temple, giving notice of the accomplishment of the days of purification, until an oblation should be offered for every one of them."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "dum autem septem dies consummarentur hii qui de Asia erant Iudaei cum vidissent eum in templo concitaverunt omnem populum et iniecerunt ei manus clamantes"
      en: "But when the seven days were drawing to an end, those Jews that were of Asia, when they saw him in the temple, stirred up all the people, and laid hands upon him, crying out:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "viri israhelitae adiuvate hic est homo qui adversus populum et legem et locum hunc omnes ubique docens insuper et gentiles induxit in templum et violavit sanctum locum istum"
      en: "Men of Israel, help: This is the man that teacheth all men every where against the people, and the law, and this place; and moreover hath brought in Gentiles into the temple, and hath violated this holy place."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "viderant enim Trophimum Ephesium in civitate cum ipso quem aestimaverunt quoniam in templum induxisset Paulus"
      en: "(For they had seen Trophimus the Ephesian in the city with him, whom they supposed that Paul had brought into the temple.)"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "commotaque est civitas tota et facta est concursio populi et adprehendentes Paulum trahebant eum extra templum et statim clausae sunt ianuae"
      en: "And the whole city was in an uproar: and the people ran together. And taking Paul, they drew him out of the temple, and immediately the doors were shut."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quaerentibus autem eum occidere nuntiatum est tribuno cohortis quia tota confunditur Hierusalem"
      en: "And as they went about to kill him, it was told the tribune of the band, That all Jerusalem was in confusion."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "qui statim adsumptis militibus et centurionibus decucurrit ad illos qui cum vidissent tribunum et milites cessaverunt percutere Paulum"
      en: "Who, forthwith taking with him soldiers and centurions, ran down to them. And when they saw the tribune and the soldiers they left off beating Paul."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "tunc accedens tribunus adprehendit eum et iussit alligari catenis duabus et interrogabat quis esset et quid fecisset"
      en: "Then the tribune coming near, took him, and commanded him to be bound with two chains: and demanded who he was, and what he had done."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "alii autem aliud clamabant in turba et cum non posset certum cognoscere prae tumultu iussit duci eum in castra"
      en: "And some cried one thing, some another, among the multitude. And when he could not know the certainty for the tumult, he commanded him to be carried into the castle."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et cum venisset ad gradus contigit ut portaretur a militibus propter vim populi"
      en: "And when he was come to the stairs, it fell out that he was carried by the soldiers, because of the violence of the people."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "sequebatur enim multitudo populi clamans tolle eum"
      en: "For the multitude of the people followed after, crying: Away with him."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et cum coepisset induci in castra Paulus dicit tribuno si licet mihi loqui aliquid ad te qui dixit graece nosti"
      en: "And as Paul was about to be brought into the castle, he saith to the tribune: May speak something to thee? Who said: Canst thou speak Greek?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "nonne tu es Aegyptius qui ante hos dies tumultum concitasti et eduxisti in desertum quattuor milia virorum sicariorum"
      en: "Art not thou that Egyptian who before these days didst raise a tumult, and didst lead forth into the desert four thousand men that were murderers?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et dixit ad eum Paulus ego homo sum quidem iudaeus a Tarso Ciliciae non ignotae civitatis municeps rogo autem te permitte mihi loqui ad populum"
      en: "But Paul said to him: I am a Jew of Tarsus in Cilicia, a citizen of no mean city. And I beseech thee, suffer me to speak to the people."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et cum ille permisisset Paulus stans in gradibus annuit manu ad plebem et magno silentio facto adlocutus est hebraea lingua dicens"
      en: "And when he had given him leave, Paul standing on the stairs, beckoned with his hand to the people. And a great silence being made, he spoke unto them in the Hebrew tongue, saying:"
    status: { la: verified, en: verified }
