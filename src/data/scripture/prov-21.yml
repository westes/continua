# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 21
verses:
  - n: 1
    text:
      la: "Sicut divisiones aquarum, ita cor regis in manu Domini; quocumque voluerit inclinabit illud."
      en: "As the divisions of waters, so the heart of the king is in the hand of the Lord: whithersoever he will he shall turn it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Omnis via viri recta sibi videtur, appendit autem corda Dominus."
      en: "Every way of a man seemeth right to himself: but the Lord weigheth the hearts."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Facere misericordiam et judicium magis placet Domino quam victimae."
      en: "To do mercy and judgment, pleaseth the Lord more than victims."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Exaltatio oculorum est dilatatio cordis; lucerna impiorum peccatum."
      en: "Haughtiness of the eyes is the enlarging of the heart: the lamp of the wicked is sin."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cogitationes robusti semper in abundantia, omnis autem piger semper in egestate est."
      en: "The thoughts of the industrious always bring forth abundance: but every sluggard is always in want."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui congregat thesauros lingua mendacii vanus et excors est, et impingetur ad laqueos mortis."
      en: "He that gathereth treasures by a lying tongue, is vain and foolish, and shall stumble upon the snares of death."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Rapinae impiorum detrahent eos, quia noluerunt facere judicium."
      en: "The robberies of the wicked shall be their downfall, because they would not do judgment."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Perversa via viri aliena est; qui autem mundus est, rectum opus ejus."
      en: "The perverse way of a man is strange: but as for him that is pure, his work is right."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Melius est sedere in angulo domatis, quam cum muliere litigiosa, et in domo communi."
      en: "It is better to sit in a corner of the housetop, than with a brawling woman, and in a common house."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Anima impii desiderat malum: non miserebitur proximo suo."
      en: "The soul of the wicked desireth evil, he will not have pity on his neighbour."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Mulctato pestilente, sapientior erit parvulus, et si sectetur sapientem, sumet scientiam."
      en: "When a pestilent man is punished, the little one will be wiser: and if he follow the wise, he will receive knowledge."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Excogitat justus de domo impii, ut detrahat impios a malo."
      en: "The just considereth seriously the house of the wicked, that he may withdraw the wicked from evil."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Qui obturat aurem suam ad clamorem pauperis, et ipse clamabit, et non exaudietur."
      en: "He that stoppeth his ear against the cry of the poor, shall also cry himself and shall not be heard."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Munus absconditum extinguit iras, et donum in sinu indignationem maximam."
      en: "A secret present quencheth anger: and a gift in the bosom the greatest wrath."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Gaudium justo est facere judicium, et pavor operantibus iniquitatem."
      en: "It is joy to the just to do judgment: and dread to them that work iniquity."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vir qui erraverit a via doctrinae in coetu gigantum commorabitur."
      en: "A man that shall wander out of the way of doctrine, shall abide in the company of the giants."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Qui diligit epulas in egestate erit; qui amat vinum et pinguia non ditabitur."
      en: "He that loveth good cheer, shall be in want: he that loveth wine, and fat things, shall not be rich."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Pro justo datur impius, et pro rectis iniquus."
      en: "The wicked is delivered up for the just: and the unjust for the righteous."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Melius est habitare in terra deserta, quam cum muliere rixosa et iracunda."
      en: "It is better to dwell in a wilderness, than with a quarrelsome and passionate woman."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Thesaurus desiderabilis, et oleum in habitaculo justi: et imprudens homo dissipabit illud."
      en: "There is a treasure to be desired, and oil in the dwelling of the just: and the foolish man shall spend it."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui sequitur justitiam et misericordiam inveniet vitam, justitiam, et gloriam."
      en: "He that followeth justice and mercy, shall find life, justice, and glory."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Civitatem fortium ascendit sapiens, et destruxit robur fiduciae ejus."
      en: "The wise man hath scaled the city of the strong, and hath cast down the strength of the confidence thereof."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui custodit os suum et linguam suam custodit ab angustiis animam suam."
      en: "He that keepeth his mouth and his tongue, keepeth his soul from distress."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Superbus et arrogans vocatur indoctus, qui in ira operatur superbiam."
      en: "The proud and the arrogant is called ignorant, who in anger worketh pride."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Desideria occidunt pigrum: noluerunt enim quidquam manus ejus operari."
      en: "Desires kill the slothful: for his hands have refused to work at all."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Tota die concupiscit et desiderat; qui autem justus est tribuet, et non cessabit."
      en: "He longeth and desireth all the day: but he that is just, will give, and will not cease."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Hostiae impiorum abominabiles, quia offeruntur ex scelere."
      en: "The sacrifices of the wicked are abominable, because they are offered of wickedness."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Testis mendax peribit; vir obediens loquetur victoriam."
      en: "A lying witness shall perish: an obedient man shall speak of victory."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Vir impius procaciter obfirmat vultum suum; qui autem rectus est corrigit viam suam."
      en: "The wicked man impudently hardeneth his face: but he that is righteous, correcteth his way."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Non est sapientia, non est prudentia, non est consilium contra Dominum."
      en: "There is no wisdom, there is no prudence, there is no counsel against the Lord."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Equus paratur ad diem belli; Dominus autem salutem tribuit."
      en: "The horse is prepared for the day of battle: but the Lord giveth safety."
    status: { la: verified, en: verified }
