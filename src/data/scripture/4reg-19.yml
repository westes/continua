# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 19
verses:
  - n: 1
    text:
      la: "quae cum audisset rex Ezechias scidit vestimenta sua et opertus est sacco ingressusque est domum Domini"
      en: "And when king Ezechias heard these words, he rent his garments, and covered himself with sackcloth, and went into the house of the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et misit Eliachim praepositum domus et Sobnam scribam et senes de sacerdotibus opertos saccis ad Esaiam prophetam filium Amos"
      en: "And he sent Eliacim, who was over the house, and Sobna the scribe, and the ancients of the priests covered with sackcloths, to Isaias the prophet the son of Amos,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui dixerunt haec dicit Ezechias dies tribulationis et increpationis et blasphemiae dies iste venerunt filii usque ad partum et vires non habet parturiens"
      en: "And they said to him: Thus saith Ezechias: This day is a day of tribulation, and of rebuke, and of blasphemy: the children are come to the birth, and the woman in travail hath not strength."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si forte audiat Dominus Deus tuus universa verba Rabsacis quem misit rex Assyriorum dominus suus ut exprobraret Deum viventem et argueret verbis quae audivit Dominus Deus tuus et fac orationem pro reliquiis quae reppertae sunt"
      en: "It may be the Lord thy God will hear all the words of Rabsaces, whom the king of the Assyrians his master hath sent to reproach the living God, and to reprove with words, which the Lord thy God hath heard: and do thou offer prayer for the remnants that are found."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "venerunt ergo servi regis Ezechiae ad Esaiam"
      en: "So the servants of king Ezechias came to Isaias."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixitque eis Esaias haec dicetis domino vestro haec dicit Dominus noli timere a facie sermonum quos audisti quibus blasphemaverunt pueri regis Assyriorum me"
      en: "And Isaias said to them: Thus shall you say to your master: Thus saith the Lord: Be not afraid for the words which thou hast heard, with which the servants of the king of the Assyrians have blasphemed me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ecce ego inmittam ei spiritum et audiet nuntium et revertetur in terram suam et deiciam eum gladio in terra sua"
      en: "Behold I will send a spirit upon him, and he shall hear a message, and shall return into his own country, and I will make him fall by the sword in his own country."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "reversus est igitur Rabsaces et invenit regem Assyriorum expugnantem Lobnam audierat enim quod recessisset de Lachis"
      en: "And Rabsaces returned, and found the king of the Assyrians besieging Lobna: for he had heard that he was departed from Lachis."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque audisset de Tharaca rege Aethiopiae dicentes ecce egressus est ut pugnet adversum te et iret contra eum misit nuntios ad Ezechiam dicens"
      en: "And when he heard of Theraca king of Ethiopia: Behold, he is come out to fight with thee: and was going against him, he sent messengers to Ezechias, saying:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "haec dicite Ezechiae regi Iudae non te seducat Deus tuus in quo habes fiduciam neque dicas non tradetur Hierusalem in manu regis Assyriorum"
      en: "Thus shall you say to Ezechias king of Juda: Let not thy God deceive thee, in whom thou trustest: and do not say: Jerusalem shall not be delivered into the hands of the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "tu enim ipse audisti quae fecerint reges Assyriorum universis terris quomodo vastaverint eas num ergo solus poteris liberari"
      en: "Behold thou hast heard what the kings of the Assyrians have done to all countries, how they have laid them waste: and canst thou alone be delivered?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "numquid liberaverunt dii gentium singulos quos vastaverunt patres mei Gozan videlicet et Aran et Reseph et filios Eden qui erant in Thelassar"
      en: "Have the gods of the nations delivered any of them, whom my fathers have destroyed, to wit, Gozan, and Haran, and Reseph, and the children of Eden that were in Thelassar?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ubi est rex Emath et rex Arfad et rex civitatis Sepharvaim Ana et Ava"
      en: "Where is the king of Emath, and the king of Arphad, and the king of the city of Sepharvaim, of Ana and of Ava?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "itaque cum accepisset Ezechias litteras de manu nuntiorum et legisset eas ascendit in domum Domini et expandit eas coram Domino"
      en: "And when Ezechias had received the letter of the hand of the messengers, and had read it, he went up to the house of the Lord, and spread it before the Lord,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et oravit in conspectu eius dicens Domine Deus Israhel qui sedes super cherubin tu es Deus solus regum omnium terrae tu fecisti caelum et terram"
      en: "And he prayed in his sight, saying: O Lord God of Israel, who sitteth upon the cherubims, thou alone art the God of all the kings of the earth: thou madest heaven and earth:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "inclina aurem tuam et audi aperi Domine oculos tuos et vide et audi omnia verba Sennacherib qui misit ut exprobraret nobis Deum viventem"
      en: "Incline thy ear, and hear: open, O Lord, thy eyes, and see: and hear all the words of Sennacherib, who hath sent to upbraid unto us the living God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "vere Domine dissipaverunt reges Assyriorum gentes et terras omnium"
      en: "Of a truth, O Lord, the kings of the Assyrians have destroyed nations, and the lands of them all."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et miserunt deos eorum in ignem non enim erant dii sed opera manuum hominum e ligno et lapide et perdiderunt eos"
      en: "And they have cast their gods into the fire: for they were not Rods, but the works of men's hands of wood and stone, and they destroyed them."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nunc igitur Domine Deus noster salvos nos fac de manu eius ut sciant omnia regna terrae quia tu es Dominus Deus solus"
      en: "Now therefore, O Lord our God, save us from his hand, that all the kingdoms of the earth may know, that thou art the Lord the only God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "misit autem Esaias filius Amos ad Ezechiam dicens haec dicit Dominus Deus Israhel quae deprecatus es me super Sennacherib rege Assyriorum audivi"
      en: "And Isaias the son of Amos sent to Ezechias, saying: Thus saith the Lord the God of Israel: I have heard the prayer thou hast made to me concerning Sennacherib king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "iste est sermo quem locutus est Dominus de eo sprevit te et subsannavit virgo filia Sion post tergum tuum caput movit filia Hierusalem"
      en: "This is the word, that the Lord hath spoken of him: The virgin the daughter of Sion hath despised thee, and laughed thee to scorn: the daughter of Jerusalem hath wagged her head behind thy back."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cui exprobrasti et quem blasphemasti contra quem exaltasti vocem et elevasti in excelsum oculos tuos contra Sanctum Israhel"
      en: "Whom hast thou reproached, and whom hast thou blasphemed? against whom hast thou exalted thy voice, and lifted up thy eyes on high? against the holy one of Israel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "per manum servorum tuorum exprobrasti Domino et dixisti in multitudine curruum meorum ascendi excelsa montium in summitate Libani et succidi sublimes cedros eius electas abietes eius et ingressus sum usque ad terminos eius saltum Carmeli eius"
      en: "By the hand of thy servants thou hast reproached the Lord, and hast said: With the multitude of my chariots I have gone up to the height of the mountains, to the top of Libanus, and have cut down its tall cedars, and its choice fir trees. And I have entered into the furthest parts thereof, and the forest of its Carmel."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ego succidi et bibi aquas alienas et siccavi vestigiis pedum meorum omnes aquas clausas"
      en: "I have cut down, and I have drunk strange waters, and have dried up with the soles of my feet all the shut up waters."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "numquid non audisti quid ab initio fecerim ex diebus antiquis plasmavi illud et nunc adduxi eruntque in ruinam collium pugnantium civitates munitae"
      en: "Hast thou not heard what I have done from the beginning? from the days of old I have formed it, and now I have brought it to effect: that fenced cities of fighting men should be turned to heaps of ruin:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et qui sedent in eis humiles manu contremuerunt et confusi sunt facti sunt quasi faenum agri et virens herba tectorum quae arefacta est antequam veniret ad maturitatem"
      en: "And the inhabitants of them, were weak of hand, they trembled and were confounded, they became like the grass of the field, and the green herb on the tops of houses, which withered before it came to maturity."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "habitaculum tuum et egressum tuum et viam tuam ego praescivi et furorem tuum contra me"
      en: "Thy dwelling and thy going out, and thy coming in, and thy way I knew before, and thy rage against me."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "insanisti in me et superbia tua ascendit in aures meas ponam itaque circulum in naribus tuis et camum in labris tuis et reducam te in viam per quam venisti"
      en: "Thou hast been mad against me, and thy pride hath come up to my ears: therefore I will put a ring in thy nose, and a bit between thy lips, and I will turn thee back by the way, by which thou camest."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "tibi autem Ezechia hoc erit signum comede hoc anno quod reppereris in secundo autem anno quae sponte nascuntur porro in anno tertio seminate et metite plantate vineas et comedite fructum earum"
      en: "And to thee, O Ezechias, this shall be a sign: Eat this year what thou shalt find: and in the second year, such things as spring of themselves: but in the third year sow and reap: plant vineyards, and eat the fruit of them."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et quodcumque reliquum fuerit de domo Iuda mittet radicem deorsum et faciet fructum sursum"
      en: "And whatsoever shall be left of the house of Juda, shall take root downward, and bear fruit upward."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "de Hierusalem quippe egredientur reliquiae et quod salvetur de monte Sion zelus Domini exercituum faciet hoc"
      en: "For out of Jerusalem shall go forth a remnant, and that which shall be saved out of mount Sion: the zeal of the Lord of hosts shall do this."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quam ob rem haec dicit Dominus de rege Assyriorum non ingredietur urbem hanc nec mittet in eam sagittam nec occupabit eam clypeus nec circumdabit eam munitio"
      en: "Wherefore thus saith the Lord concerning the king of the Assyrians: He shall not come into this city, nor shoot an arrow into it, nor come before it with shield, nor cast a trench about it."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "per viam qua venit revertetur et civitatem hanc non ingredietur dicit Dominus"
      en: "By the way that he came, he shall return: and into this city he shall not come, saith the Lord."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "protegamque urbem hanc et salvabo eam propter me et propter David servum meum"
      en: "And I will protect this city, and will save it for my own sake, and for David my servant's sake."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "factum est igitur in nocte illa venit angelus Domini et percussit castra Assyriorum centum octoginta quinque milia cumque diluculo surrexisset vidit omnia corpora mortuorum et recedens abiit"
      en: "And it came to pass that night, that an angel of the Lord came, and slew in the camp of the Assyrians a hundred and eighty-five thousand. And when he arose early in the morning, he saw all the bodies of the dead."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et reversus est Sennacherib rex Assyriorum et mansit in Nineve"
      en: "And Sennacherib king of the Assyrians departing went away, and he re- turned and abode in Ninive."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "cumque adoraret in templo Neserach deum suum Adramelech et Sarasar filii eius percusserunt eum gladio fugeruntque in terram Armeniorum et regnavit Eseraddon filius eius pro eo"
      en: "And as he was worshipping in the temple of Nesroch his god, Adramelech and Sarasar his sons slew him with the sword, and they fled into the land of the Armenians, and Asarhaddon his son reigned in his stead."
    status: { la: verified, en: verified }
