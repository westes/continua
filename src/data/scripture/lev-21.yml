# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 21
verses:
  - n: 1
    text:
      la: "dixit quoque Dominus ad Mosen loquere ad sacerdotes filios Aaron et dices eis ne contaminetur sacerdos in mortibus civium suorum"
      en: "The Lord said also to Moses: Speak to the priests the sons of Aaron, and thou shalt say to them: Let not a priest incur an uncleanness at the death of his citizens:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "nisi tantum in consanguineis ac propinquis id est super matre et patre et filio ac filia fratre quoque"
      en: "But only for his kin, such as are near in blood, that is to say, for his father and for his mother, and for his son, and for his daughter, for his brother also,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et sorore virgine quae non est nupta viro"
      en: "And for a maiden sister, who hath had no husband:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed nec in principe populi sui contaminabitur"
      en: "But not even for the prince of his people shall he do any thing that may make him unclean."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non radent caput nec barbam neque in carnibus suis facient incisuras"
      en: "Neither shall they shave their head, nor their beard, nor make incisions in their flesh."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sancti erunt Deo suo et non polluent nomen eius incensum enim Domini et panes Dei sui offerunt et ideo sancti erunt"
      en: "They shall be holy to their God, and shall not profane his name: for they offer the burnt offering of the Lord, and the bread of their God, and therefore they shall be holy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "scortum et vile prostibulum non ducet uxorem nec eam quae repudiata est a marito quia consecratus est Deo suo"
      en: "They shall not take to wife a harlot or a vile prostitute, nor one that has been put away from her husband: because they are consecrated to their God,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et panes propositionis offert sit ergo sanctus quia et ego sanctus sum Dominus qui sanctifico vos"
      en: "And offer the leaves of proposition. Let them therefore be holy, because I also am holy, the Lord, who sanctify them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sacerdotis filia si deprehensa fuerit in stupro et violaverit nomen patris sui flammis exuretur"
      en: "If the daughter of a priest be taken in whoredom, and dishonour the name of her father, she shall be burnt with fire."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "pontifex id est sacerdos maximus inter fratres suos super cuius caput fusum est unctionis oleum et cuius manus in sacerdotio consecratae sunt vestitusque est sanctis vestibus caput suum non discoperiet vestimenta non scindet"
      en: "The high priest, that is to say, the priest, is the greatest among his brethren. upon whose head the oil of unction hath been poured, and whose hands have been consecrated for the priesthood, and who hath been vested with the holy vestments, shall not uncover his head, he shall not rend his garments:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ad omnem mortuum non ingredietur omnino super patre quoque suo et matre non contaminabitur"
      en: "Nor shall he go in at all to any dead person: not even for his father, or his mother, shall he be defiled:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nec egredietur de sanctis ne polluat sanctuarium Domini quia oleum sanctae unctionis Dei sui super eum est ego Dominus"
      en: "Neither shall he go out of the holy places, lest he defile the sanctuary of the Lord, because the oil of the holy unction of his God is upon him. I am the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "virginem ducet uxorem"
      en: "He shall take a virgin unto his wife:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "viduam et repudiatam et sordidam atque meretricem non accipiet sed puellam de populo suo"
      en: "But a widow or one that is divorced, or defiled, or a harlot, he shall not take, but a maid of his own people :"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ne commisceat stirpem generis sui vulgo gentis suae quia ego Dominus qui sanctifico eum"
      en: "He shall not mingle the stock of his kindred with the common people of his nation: for I am the Lord who sanctify him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "loquere ad Aaron homo de semine tuo per familias qui habuerit maculam non offeret panes Deo suo"
      en: "Say to Aaron: Whosoever of thy seed throughout their families, hath a blemish, he shall not offer bread to his God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "nec accedet ad ministerium eius si caecus fuerit si claudus si vel parvo vel grandi et torto naso"
      en: "Neither shall he approach to minister to him: If he be blind, if he be lame, if he have a little, or a great, or a crooked nose,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "si fracto pede si manu"
      en: "If his foot, or if his hand be broken,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "si gibbus si lippus si albuginem habens in oculo si iugem scabiem si inpetiginem in corpore vel hirniosus"
      en: "If he be crookbacked, or blear eyed, or have a pearl in his eye, or a continual scab, or a dry scurf in his body, or a rupture:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "omnis qui habuerit maculam de semine Aaron sacerdotis non accedet offerre hostias Domino nec panes Deo suo"
      en: "Whosoever of the seed of Aaron the priest hath a blemish, he shall not approach to offer sacrifices to the Lord, nor bread to his God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vescetur tamen panibus qui offeruntur in sanctuario"
      en: "He shall eat nevertheless of the loaves, that are offered in the sanctuary,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ita dumtaxat ut intra velum non ingrediatur nec accedat ad altare quia maculam habet et contaminare non debet sanctuarium meum ego Dominus qui sanctifico eos"
      en: "Yet so that he enter not within the veil, nor approach to the altar, because he hath a blemish, and he must not defile my sanctuary. I am the Lord who sanctify them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "locutus est ergo Moses ad Aaron et filios eius et ad omnem Israhel cuncta quae sibi fuerant imperata"
      en: "Moses therefore spoke to Aaron, and to his sons and to all Israel, all the things that had been commanded him."
    status: { la: verified, en: verified }
