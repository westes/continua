book: deut
chapter: 31
verses:
  - n: 1
    text:
      la: "abiit itaque Moses et locutus est omnia verba haec ad universum Israhel"
      en: "And Moses went, and spoke all these words to all Israel,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et dixit ad eos centum viginti annorum sum hodie non possum ultra egredi et ingredi praesertim cum et Dominus dixerit mihi non transibis Iordanem istum"
      en: "And he said to them: I am this day a hundred and twenty years old, I can no longer go out and come in, especially as the Lord also hath said to me: O Thou shalt not pass over this Jordan."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dominus ergo Deus tuus transibit ante te ipse delebit omnes gentes has in conspectu tuo et possidebis eas et Iosue iste transibit ante te sicut locutus est Dominus"
      en: "The Lord thy God then will pass over before thee: he will destroy all these nations in thy sight, and thou shalt possess them: and this Josue shall go over before thee, as the Lord hath spoken."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "facietque Dominus eis sicut fecit Seon et Og regibus Amorreorum et terrae eorum delebitque eos"
      en: "And the Lord shall do to them as he did to Sehon and Og the kings of the Amorrhites, and to their land, and shall destroy them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cum ergo et hos tradiderit vobis similiter facietis eis sicut praecepi vobis"
      en: "Therefore when the Lord shall have delivered these also to you, you shall do in like manner to them as I have commanded you,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "viriliter agite et confortamini nolite timere nec paveatis a conspectu eorum quia Dominus Deus tuus ipse est ductor tuus et non dimittet nec derelinquet te"
      en: "Do manfully and be of good heart: fear not, nor be ye dismayed at their sight: for the Lord thy God he himself is thy leader, and will not leave thee nor forsake thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vocavitque Moses Iosue et dixit ei coram omni Israhel confortare et esto robustus tu enim introduces populum istum in terram quam daturum se patribus eorum iuravit Dominus et tu eam sorte divides"
      en: "And Moses called Josue, and said to him before all Israel: Take courage, and be valiant: for thou shalt bring this people into the land which the Lord swore he would give to their fathers, and thou shalt divide it by lot."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et Dominus qui ductor vester est ipse erit tecum non dimittet nec derelinquet te noli timere nec paveas"
      en: "And the Lord who is your leader, he himself will be with thee: he will not leave thee, nor forsake thee: fear not, neither be dismayed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "scripsit itaque Moses legem hanc et tradidit eam sacerdotibus filiis Levi qui portabant arcam foederis Domini et cunctis senioribus Israhelis"
      en: "And Moses wrote this law, and delivered it to the priests the sons of Levi, who carried the ark of the covenant of the Lord, and to all the ancients of Israel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "praecepitque eis dicens post septem annos anno remissionis in sollemnitate tabernaculorum"
      en: "And he commanded them, saying: After seven years, in the year of remission, in the feast of tabernacles,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "convenientibus cunctis ex Israhel ut appareant in conspectu Domini Dei tui in loco quem elegerit Dominus leges verba legis huius coram omni Israhel audientibus eis"
      en: "When all Israel come together, to appear in the sight of the Lord thy God in the place which the Lord shall choose, thou shalt read the words of this law before all Israel, in their hearing,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et in unum omni populo congregato tam viris quam mulieribus parvulis et advenis qui sunt intra portas tuas ut audientes discant et timeant Dominum Deum vestrum et custodiant impleantque omnes sermones legis huius"
      en: "And the people being all assembled together, both men and women, children and strangers, that are within thy gates: that hearing they may learn, and fear the Lord your God, and keep, and fulfil all the words of this law:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "filii quoque eorum qui nunc ignorant audire possint et timeant Dominum Deum suum cunctis diebus quibus versantur in terra ad quam vos Iordane transito pergitis obtinendam"
      en: "That their children also, who now are ignorant, may hear, and fear the Lord their God, all the days that they lire in the land whither you are going over the Jordan to possess it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et ait Dominus ad Mosen ecce prope sunt dies mortis tuae voca Iosue et state in tabernaculo testimonii ut praecipiam ei abierunt ergo Moses et Iosue et steterunt in tabernaculo testimonii"
      en: "And the Lord said to Moses: Behold the days of thy death are nigh: call Josue, and stand ye in the tabernacle of the testimony, that I may give him a charge. So Moses and Josue went and stood in the tabernacle of the testimony:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "apparuitque Dominus ibi in columna nubis quae stetit in introitu tabernaculi"
      en: "And the Lord appeared there in the pillar of a cloud, which stood in the en try of the tabernacle."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixitque Dominus ad Mosen ecce tu dormies cum patribus tuis et populus iste consurgens fornicabitur post deos alienos in terra ad quam ingredietur et habitabit in ea ibi derelinquet me et irritum faciet foedus quod pepigi cum eo"
      en: "And the Lord said to Moses: Behold thou shalt sleep with thy fathers, and this people rising up will go a fornicating after strange gods in the land, to which it goeth in to dwell: there will they forsake me, and will make void the covenant, which I have made with them,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et irascetur furor meus contra eum in die illo et derelinquam eum et abscondam faciem meam ab eo et erit in devorationem invenient eum omnia mala et adflictiones ita ut dicat in illo die vere quia non est Deus mecum invenerunt me haec mala"
      en: "And my wrath shall be kindled against them in that day: and I will forsake them, and will hide my face from them, and they shall be devoured: all evils and afflictions shall find them, so that they shall say in that day: In truth it is because God is not with me, that these evils have found me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ego autem abscondam et celabo faciem meam in die illo propter omnia mala quae fecit quia secutus est deos alienos"
      en: "But I will hide, and cover my face in that day, for all the evils which they have done, because they have followed strange gods.."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nunc itaque scribite vobis canticum istud et docete filios Israhel ut memoriter teneant et ore decantent et sit mihi carmen istud pro testimonio inter filios Israhel"
      en: "Now therefore write you this canticle, and teach the children of Israel: that they may know it by heart, and sing it by mouth, and this song may be unto me for a testimony among the children of Israel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "introducam enim eum in terram pro qua iuravi patribus eius lacte et melle manantem cumque comederint et saturati crassique fuerint avertentur ad deos alienos et servient eis et detrahent mihi et irritum facient pactum meum"
      en: "For I will bring them into the land, for which I swore to their fathers, that floweth with milk and honey. And when they have eaten, and are full and fat, they will turn away after strange gods, and will serve them: and will despise me, and make void my covenant."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "postquam invenerint eum mala multa et adflictiones respondebit ei canticum istud pro testimonio quod nulla delebit oblivio ex ore seminis tui scio enim cogitationes eius quae facturus sit hodie antequam introducam eum in terram quam ei pollicitus sum"
      en: "And after many evils and afflictions shall have come upon them, this canticle shall answer them for a testimony, which no oblivion shall take away out of the mouth of their seed. For I know their thoughts, and what they are about to de this day, before that I bring them into the land which I have promised them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "scripsit ergo Moses canticum et docuit filios Israhel"
      en: "Moses therefore wrote the canticle and taught it to the children of Israel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "praecepitque Iosue filio Nun et ait confortare et esto robustus tu enim introduces filios Israhel in terram quam pollicitus sum et ego ero tecum"
      en: "And the Lord commanded Josue the son of Nun, and said: Take courage, and be valiant: for thou shalt bring the children of Israel into the land which I have promised, and I will be with thee."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "postquam ergo scripsit Moses verba legis huius in volumine atque conplevit"
      en: "Therefore after Moses had wrote the words of this law in a volume, and finished it:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "praecepit Levitis qui portabant arcam foederis Domini dicens"
      en: "He commanded the Levites, who carried the ark of the covenant of the Lord. saying:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "tollite librum istum et ponite eum in latere arcae foederis Domini Dei vestri ut sit ibi contra te in testimonio"
      en: "Take this book, and put it in the side of the ark of the covenant of the Lord your God: that it may be there for a testimony against thee."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ego enim scio contentionem tuam et cervicem tuam durissimam adhuc vivente me et ingrediente vobiscum semper contentiose egistis contra Dominum quanto magis cum mortuus fuero"
      en: "For I know thy obstinacy, and thy most stiff neck, While I am yet living, and going in with you, you have always been rebellious against the Lord: how much more when I shall be dead?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "congregate ad me omnes maiores natu per tribus vestras atque doctores et loquar audientibus eis sermones istos et invocabo contra eos caelum et terram"
      en: "Gather unto me all the ancients of your tribes, and your doctors, and I will speak these words in their hearing, and will call heaven and earth to witness against them."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "novi enim quod post mortem meam inique agetis et declinabitis cito de via quam praecepi vobis et occurrent vobis mala in extremo tempore quando feceritis malum in conspectu Domini ut inritetis eum per opera manuum vestrarum"
      en: "For I know that, after my death, you will do wickedly, and will quickly turn aside from the way that I have commanded you: and evils shall come upon you in the latter times, when you shall do evil in the sight of the Lord, to provoke him by the works of your hands."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "locutus est ergo Moses audiente universo coetu Israhel verba carminis huius et ad finem usque conplevit"
      en: "Moses therefore spoke, in the hearing of the whole assembly of Israel, the words of this canticle, and finished it even to the end,"
    status: { la: verified, en: verified }
