# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 20
verses:
  - n: 1
    text:
      la: "Post haec congregati sunt filii Moab, et filii Ammon, et cum eis de Ammonitis, ad Josaphat, ut pugnarent contra eum."
      en: "After this the children of Moab, and the children of Ammon, and with them of the Ammonites, were gathered together to fight against Josaphat."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Veneruntque nuntii, et indicaverunt Josaphat, dicentes: Venit contra te multitudo magna de his locis quae trans mare sunt, et de Syria: et ecce consistunt in Asasonthamar, quae est Engaddi."
      en: "And there came messengers, and told Josaphat, saying: There cometh a great multitude against thee from beyond the sea, and out of Syria, and behold they are in Asasonthamar, which is Engaddi."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Josaphat autem timore perterritus, totum se contulit ad rogandum Dominum, et praedicavit jejunium universo Juda."
      en: "And Josaphat being seized with fear betook himself wholly to pray to the Lord, and he proclaimed a fast for all Juda."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Congregatusque est Judas ad deprecandum Dominum: sed et omnes de urbibus suis venerunt ad obsecrandum eum."
      en: "And Juda gathered themselves together to pray to the Lord: and all came out of their cities to make supplication to him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque stetisset Josaphat in medio coetu Juda, et Jerusalem, in domo Domini ante atrium novum,"
      en: "And Josaphat stood in the midst of the assembly of Juda, and Jerusalem, in the house of the Lord before the new court,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ait: Domine Deus patrum nostrorum, tu es Deus in caelo, et dominaris cunctis regnis gentium: in manu tua est fortitudo, et potentia, nec quisquam tibi potest resistere."
      en: "And said: O Lord God of our fathers, thou art God in heaven, and rulest over all the kingdoms and nations, in thy hand is strength and power, and no one can resist thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nonne tu, Deus noster, interfecisti omnes habitatores terrae hujus coram populo tuo Israel, et dedisti eam semini Abraham amici tui in sempiternum?"
      en: "Didst not thou our God kill all the inhabitants of this land before thy people Israel, and gavest it to the seed of Abraham thy friend for ever?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Habitaveruntque in ea, et exstruxerunt in illa sanctuarium nomini tuo, dicentes:"
      en: "And they dwelt in it, and built in it a sanctuary to thy name, saying:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si irruerint super nos mala, gladius judicii pestilentia, et fames, stabimus coram domo hac in conspectu tuo, in qua invocatum est nomen tuum: et clamabimus ad te in tribulationibus nostris, et exaudies, salvosque facies."
      en: "If evils fall upon us, the sword of judgment, or pestilence, or famine, we will stand in thy presence before this house, in which thy name is called upon: and we will cry to thee in our afflictions, and thou wilt hear, and save us."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nunc igitur ecce filii Ammon, et Moab, et mons Seir, per quos non concessisti Israel ut transirent quando egrediebantur de Aegypto, sed declinaverunt ab eis, et non interfecerunt illos,"
      en: "Now therefore behold the children of Ammon, and of Moab, and mount Seir, through whose lands thou didst not allow Israel to pass, when they came out of Egypt, but they turned aside from them, and slew them not,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "e contrario agunt, et nituntur ejicere nos de possessione, quam tradidisti nobis."
      en: "Do the contrary, and endeavour to cast us out of the possession which thou hast delivered to us."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Deus noster, ergo non judicabis eos? in nobis quidem non est tanta fortitudo, ut possimus huic multitudini resistere, quae irruit super nos. Sed cum ignoremus quid agere debeamus, hoc solum habemus residui, ut oculos nostros dirigamus ad te."
      en: "O our God, wilt thou not then judge them? as for us we have not strength enough, to be able to resist this multitude, which cometh violently upon us. But as we know not what to do, we can only turn our eyes to thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Omnis vero Juda stabat coram Domino cum parvulis, et uxoribus, et liberis suis."
      en: "And all Juda stood before the Lord with their little ones, and their wives, and their children."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Erat autem Jahaziel filius Zachariae filii Banaiae filii Jehiel filii Mathaniae, Levites de filiis Asaph, super quem factus est spiritus Domini in medio turbae,"
      en: "And Jahaziel the son of Zacharias, the son of Banaias, the son of Jehiel, the son of Mathanias, a Levite of the sons of Asaph, was there, upon whom the spirit of the Lord came in the midst of the multitude,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ait: Attendite, omnis Juda, et qui habitatis Jerusalem, et tu, rex Josaphat: haec dicit Dominus vobis: Nolite timere, nec paveatis hanc multitudinem: non est enim vestra pugna, sed Dei."
      en: "And he said: Attend ye, all Juda, and you that dwell in Jerusalem, and thou king Josaphat: Thus saith the Lord to you: Fear ye not, and be not dismayed at this multitude: for the battle is not yours, but God's."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cras descendetis contra eos: ascensuri enim sunt per clivum nomine Sis, et invenietis illos in summitate torrentis, qui est contra solitudinem Jeruel."
      en: "Tomorrow you shall go down against them: for they will come up by the ascent named Sis, and you shall find them at the head of the torrent, which is over against the wilderness of Jeruel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non eritis vos qui dimicabitis, sed tantummodo confidenter state, et videbitis auxilium Domini super vos, o Juda, et Jerusalem: nolite timere, nec paveatis: cras egrediemini contra eos, et Dominus erit vobiscum."
      en: "It shall not be you that shall fight, but only stand with confidence, and you shall see the help of the Lord over you, O Juda, and Jerusalem: fear ye not, nor be you dismayed: tomorrow you shall go out against them, and the Lord will be with you."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Josaphat ergo, et Juda, et omnes habitatores Jerusalem ceciderunt proni in terram coram Domino, et adoraverunt eum."
      en: "Then Josaphat, and Juda, and all the inhabitants of Jerusalem fell flat on the ground before the Lord, and adored him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Porro Levitae de filiis Caath, et de filiis Core laudabant Dominum Deum Israel voce magna in excelsum."
      en: "And the Levites of the sons of Caath, and of the sons of Core praised the Lord the God of Israel with a loud voice, on high."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cumque mane surrexissent, egressi sunt per desertum Thecue: profectisque eis, stans Josaphat in medio eorum, dixit: Audite me, viri Juda, et omnes habitatores Jerusalem: credite in Domino Deo vestro, et securi eritis: credite prophetis ejus, et cuncta evenient prospera."
      en: "And they rose early in the morning, and went out through the desert of Thecua: and as they were marching, Josaphat standing in the midst of them, said: Hear me, ye men of Juda, and all the inhabitants of Jerusalem: believe in the Lord your God, and you shall be secure: believe his prophets, and all things shall succeed well."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Deditque consilium populo, et statuit cantores Domini, ut laudarent eum in turmis suis, et antecederent exercitum, ac voce consona dicerent: Confitemini Domino, quoniam in aeternum misericordia ejus."
      en: "And he gave counsel to the people, and appointed the singing men of the Lord, to praise him by their companies, and to go before the army, and with one voice to say: Give glory to the Lord, for his mercy endureth for ever."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cumque coepissent laudes canere, vertit Dominus insidias eorum in semetipsos, filiorum scilicet Ammon, et Moab, et montis Seir, qui egressi fuerant ut pugnarent contra Judam: et percussi sunt."
      en: "And when they began to sing praises, the Lord turned their ambushments upon themselves, that is to say, of the children of Ammon, and of Moab, and of mount Seir, who were come out to fight against Juda, and they were slain."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Namque filii Ammon, et Moab, consurrexerunt adversum habitatores Seir, ut interficerent et delerent eos: cumque hoc opere perpetrassent, etiam in semetipsos versi, mutuis concidere vulneribus."
      en: "For the children of Ammon, and of Moab, rose up against the inhabitants of mount Seir, to kill and destroy them: and when they had made an end of them, they turned also against one another, and destroyed one another."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Porro Juda cum venisset ad speculam, quae respicit solitudinem, vidit procul omnem late regionem plenam cadaveribus, nec superesse quemquam, qui necem potuisset evadere."
      en: "And when Juda came to the watch tower, that looketh toward the desert, they saw afar off all the country, for a great space, full of dead bodies, and that no one was left that could escape death."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Venit ergo Josaphat, et omnis populus cum eo ad detrahenda spolia mortuorum: inveneruntque inter cadavera variam supellectilem, vestes quoque, et vasa pretiosissima, et diripuerunt ita ut omnia portare non possent, nec per tres dies spolia auferre prae praedae magnitudine."
      en: "Then Josaphat came, and all the people with him to take away the spoils of the dead, and they found among the dead bodies, stuff of various kinds, and garments, and most precious vessels: and they took them for themselves, insomuch that they could not carry all, nor in three days take away the spoils, the booty was so great."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Die autem quarto congregati sunt in Valle benedictionis: etenim quoniam ibi benedixerant Domino, vocaverunt locum illum Vallis benedictionis usque in praesentem diem."
      en: "And on the fourth day they were assembled in the valley of Blessing: for there they blessed the Lord, and therefore they called that place the valley of Blessing until this day."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Reversusque est omnis vir Juda, et habitatores Jerusalem, et Josaphat ante eos, in Jerusalem cum laetitia magna, eo quod dedisset eis Dominus gaudium de inimicis suis."
      en: "And every man of Juda, and the inhabitants of Jerusalem returned, and Josaphat at their head, into Jerusalem with great joy, because the Lord had made them rejoice over their enemies."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ingressique sunt in Jerusalem cum psalteriis, et citharis, et tubis in domum Domini."
      en: "And they came into Jerusalem with psalteries, and harps, and trumpets into the house of the Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Irruit autem pavor Domini super universa regna terrarum cum audissent quod pugnasset Dominus contra inimicos Israel."
      en: "And the fear of the Lord fell upon all the kingdoms of the lands when they heard that the Lord had fought against the enemies of Israel."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Quievitque regnum Josaphat, et praebuit ei Deus pacem per circuitum."
      en: "And the kingdom of Josaphat was quiet, and God gave him peace round about."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Regnavit igitur Josaphat super Judam, et erat triginta quinque annorum cum regnare coepisset: viginti autem et quinque annis regnavit in Jerusalem, et nomen matris ejus Azuba filia Selahi."
      en: "And Josaphat reigned over Juda, and he was five and thirty years old when he began to reign: and he reigned five and twenty years in Jerusalem: and the name of his mother was Azuba the daughter of Selahi."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et ambulavit in via patris suis Asa, nec declinavit ab ea, faciens quae placita erant coram Domino."
      en: "And he walked in the way of his father Asa, and departed not from it, doing the things that were pleasing before the Lord."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Verumtamen excelsa non abstulit, et adhuc populus non direxerat cor suum ad Dominum Deum patrum suorum."
      en: "But yet he took not away the high places, and the people had not yet turned their heart to the Lord the God of their fathers."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Reliqua autem gestorum Josaphat priorum, et novissimorum, scripta sunt in verbis Jehu filii Hanani, quae digessit in libros regum Israel."
      en: "But the rest of the acts of Josaphat, first and last, are written in the words of Jehu the son of Hanani, which he digested into the books of the kings of Israel."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Post haec iniit amicitias Josaphat rex Juda cum Ochozia rege Israel, cujus opera fuerunt impiissima."
      en: "After these things Josaphat king of Juda made friendship with Ochozias king of Israel, whose works were very wicked."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et particeps fuit ut facerent naves, quae irent in Tharsis: feceruntque classem in Asiongaber."
      en: "And he was partner with him in making ships, to go to Tharsis: and they made the ships in Asiongaber."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Prophetavit autem Eliezer filius Dodau de Maresa ad Josaphat, dicens: Quia habuisti foedus cum Ochozia, percussit Dominus opera tua, contritaeque sunt naves, nec potuerunt ire in Tharsis."
      en: "And Eliezer the son of Dodau of Maresa prophesied to Josaphat, saying: Because thou hast made a league with Ochozias, the Lord hath destroyed thy works, and the ships are broken, and they could not go to Tharsis."
    status: { la: verified, en: verified }
