book: ruth
chapter: 4
verses:
  - n: 1
    text:
      la: "ascendit ergo Booz ad portam et sedit ibi cumque vidisset propinquum praeterire de quo prius sermo habitus est dixit ad eum declina paulisper et sede hic vocans eum nomine suo qui devertit et sedit"
      en: "Then Booz went up to the gate, and sat there. And when he had seen the kinsman going by, of whom he had spoken before, he said to him, calling him by his name: Turn aside for a little while, and sit down here. He turned aside, and sat down."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tollens autem Booz decem viros de senioribus civitatis dixit ad eos sedete hic"
      en: "And Booz taking ten men of the ancients of the city, said to them: Sit ye down here."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quibus residentibus locutus est ad propinquum partem agri fratris nostri Helimelech vendit Noemi quae reversa est de regione moabitide"
      en: "They sat down, and he spoke to the kinsman: Noemi, who is returned from the country of Moab, will sell a parcel of land that belonged to our brother Elimelech."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quod audire te volui et tibi dicere coram cunctis sedentibus et maioribus natu de populo meo si vis possidere iure propinquitatis eme et posside sin autem tibi displicet hoc ipsum indica mihi ut sciam quid facere debeam nullus est enim propinquus excepto te qui prior es et me qui secundus sum at ille respondit ego agrum emam"
      en: "I would have thee to understand this, and would tell thee before all that sit here, and before the ancients of my people. If thou wilt take possession of it by the right of kindred: buy it and possess it: but if it please thee not, tell me so, that I may know what I have to do. For there is no near kinsman besides thee, who art first, and me, who am second. But he answered: I will buy the field."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cui dixit Booz quando emeris agrum de manu mulieris Ruth quoque Moabitidem quae uxor defuncti fuit debes accipere ut suscites nomen propinqui tui in hereditate sua"
      en: "And Booz said to him: When thou shalt buy the field at the woman's hand, thou must take also Ruth the Moabitess, who was the wife of the deceased: to raise up the name of thy kinsman in his inheritance."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui respondit cedo iure propinquitatis neque enim posteritatem familiae meae delere debeo tu meo utere privilegio quo me libenter carere profiteor"
      en: "He answered: I yield up my right of next akin: for I must not cut off the posterity of my own family. Do thou make use of my privilege, which I profess I do willingly forego."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "hic autem erat mos antiquitus in Israhel inter propinquos et si quando alter alteri suo iure cedebat ut esset firma concessio solvebat homo calciamentum suum et dabat proximo suo hoc erat testimonium cessionis in Israhel"
      en: "Now this in former times was the manner in Israel between kinsmen, that if at any time one yielded his right to another: that the grant might be sure, the man put off his shoe, and gave it to his neighhour; this was a testimony of cession of right in Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixit ergo propinquus Booz tolle calciamentum quod statim solvit de pede suo"
      en: "So Booz said to his kinsman: Put off thy shoe. And immediately he took it off from his foot."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "at ille maioribus natu et universo populo testes inquit vos estis hodie quod possederim omnia quae fuerunt Helimelech et Chellion et Maalon tradente Noemi"
      en: "And he said to the ancients and to all the people: You are witnesses this day, that I have bought all that was Elimelech's, and Chelion's, and Mahalon's, of the hand of Noemi:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et Ruth Moabitidem uxorem Maalon in coniugium sumpserim ut suscitem nomen defuncti in hereditate sua ne vocabulum eius de familia sua ac fratribus et populo deleatur vos inquam huius rei testes estis"
      en: "And have taken to wife Ruth the Moabitess, the wife of Mahalon, to raise up the name of the deceased in his inheritance lest his name be cut off, from among his family and his brethren and his people. You, I say, are witnesses of this thing."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "respondit omnis populus qui erat in porta et maiores natu nos testes sumus faciat Dominus hanc mulierem quae ingreditur domum tuam sicut Rachel et Liam quae aedificaverunt domum Israhel ut sit exemplum virtutis in Ephrata et habeat celebre nomen in Bethleem"
      en: "Then all the people that were in the gate, and the ancients answered: We are witnesses: The Lord make this woman who cometh into thy house, like Rachel, and Lia, who built up the house of Israel: that she may be an example of virtue in Ephrata, and may have a famous name in Bethlehem:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "fiatque domus tua sicut domus Phares quem Thamar peperit Iudae de semine quod dederit Dominus tibi ex hac puella"
      en: "And that the house may be, as the house of Phares, whom Thamar bore unto Juda, of the seed which the Lord shall give thee of this young woman."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tulit itaque Booz Ruth et accepit uxorem ingressusque est ad eam et dedit illi Dominus ut conciperet et pareret filium"
      en: "Booz therefore took Ruth, and married her: and went in unto her, and the Lord gave her to conceive and to bear a son."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dixeruntque mulieres ad Noemi benedictus Dominus qui non est passus ut deficeret successor familiae tuae et vocaretur nomen eius in Israhel"
      en: "And the women said to Noemi: Blessed be the Lord, who hath not suffered thy family to want a successor, that his name should be preserved in Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et habeas qui consoletur animam tuam et enutriat senectutem de nuru enim tua natus est quae te diligit et multo tibi est melior quam si septem haberes filios"
      en: "And thou shouldst have one to comfort thy soul, and cherish thy old age. For he is born of thy daughter in law: who loveth thee: and is much better to thee, than if thou hadst seven sons."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "susceptumque Noemi puerum posuit in sinu suo et nutricis ac gerulae officio fungebatur"
      en: "And Noemi taking the child laid it in her bosom, and she carried it, and was a nurse unto it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "vicinae autem mulieres congratulantes ei et dicentes natus est filius Noemi vocaverunt nomen eius Obed hic est pater Isai patris David"
      en: "And the women her neighbours, congratulating with her and saying: There is a son born to Noemi: called his name Obed: he is the father of Isai, the father of David."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "hae sunt generationes Phares Phares genuit Esrom"
      en: "These are the generations of Phares: Phares begot Esron,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Esrom genuit Aram Aram genuit Aminadab"
      en: "Esron begot Aram, Aram begot Aminadab,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Aminadab genuit Naasson Naasson genuit Salma"
      en: "Aminadab begot Nahasson, Nahasson begot Salmon,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Salma genuit Booz Booz genuit Obed"
      en: "Salmon begot Booz, Booz begot Obed,"
    status: { la: verified, en: verified }
