# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 22
verses:
  - n: 1
    text:
      la: "Et respondens Jesus, dixit iterum in parabolis eis, dicens:"
      en: "And Jesus answering, spoke again in parables to them, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Simile factum est regnum caelorum homini regi, qui fecit nuptias filio suo."
      en: "The kingdom of heaven is likened to a king, who made a marriage for his son."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et misit servos suos vocare invitatos ad nuptias, et nolebant venire."
      en: "And he sent his servants, to call them that were invited to the marriage; and they would not come."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Iterum misit alios servos, dicens: Dicite invitatis: Ecce prandium meum paravi, tauri mei et altilia occisa sunt, et omnia parata: venite ad nuptias."
      en: "Again he sent other servants, saying: Tell them that were invited, Behold, I have prepared my dinner; my calves and fatlings are killed, and all things are ready: come ye to the marriage."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Illi autem neglexerunt: et abierunt, alius in villam suam, alius vero ad negotiationem suam:"
      en: "But they neglected, and went their own ways, one to his farm, and another to his merchandise."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "reliqui vero tenuerunt servos ejus, et contumeliis affectos occiderunt."
      en: "And the rest laid hands on his servants, and having treated them contumeliously, put them to death."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Rex autem cum audisset, iratus est: et missis exercitibus suis, perdidit homicidas illos, et civitatem illorum succendit."
      en: "But when the king had heard of it, he was angry, and sending his armies, he destroyed those murderers, and burnt their city."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Tunc ait servis suis: Nuptiae quidem paratae sunt, sed qui invitati erant, non fuerunt digni:"
      en: "Then he saith to his servants: The marriage indeed is ready; but they that were invited were not worthy."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ite ergo ad exitus viarum, et quoscumque inveneritis, vocate ad nuptias."
      en: "Go ye therefore into the highways; and as many as you shall find, call to the marriage."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et egressi servi ejus in vias, congregaverunt omnes quos invenerunt, malos et bonos: et impletae sunt nuptiae discumbentium."
      en: "And his servants going forth into the ways, gathered together all that they found, both bad and good: and the marriage was filled with guests."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Intravit autem rex ut viderent discumbentes, et vidit ibi hominem non vestitum veste nuptiali."
      en: "And the king went in to see the guests: and he saw there a man who had not on a wedding garment."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et ait illi: Amice, quomodo huc intrasti non habens vestem nuptialem? At ille obmutavit."
      en: "And he saith to him: Friend, how camest thou in hither not having a wedding garment? But he was silent."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tunc dicit rex ministris: Ligatis manibus et pedibus ejus, mittite eum in tenebras exteriores: ibi erit fletus et stridor dentium."
      en: "Then the king said to the waiters: Bind his hands and feet, and cast him into the exterior darkness: there shall be weeping and gnashing of teeth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Multi enim sunt vocati, pauci vero electi."
      en: "For many are called, but few are chosen."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Tunc abeuntes pharisaei, consilium inierunt ut caperent eum in sermone."
      en: "Then the Pharisees going, consulted among themselves how to insnare him in his speech."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et mittunt ei discipulos suos cum Herodianis, dicentes: Magister, scimus quia verax es, et viam Dei in veritate doces, et non est tibi cura de aliquo: non enim respicis personam hominum:"
      en: "And they sent to him their disciples with the Herodians, saying: Master, we know that thou art a true speaker, and teachest the way of God in truth, neither carest thou for any man: for thou dost not regard the person of men."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dic ergo nobis quid tibi videtur, licet censum dare Caesari, an non?"
      en: "Tell us therefore what dost thou think, is it lawful to give tribute to Caesar, or not?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cognita autem Jesus nequitia eorum, ait: Quid me tentatis hypocritae?"
      en: "But Jesus knowing their wickedness, said: Why do you tempt me, ye hypocrites?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ostendite mihi numisma census. At illi obtulerunt ei denarium."
      en: "Shew me the coin of the tribute. And they offered him a penny."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et ait illis Jesus: Cujus est imago haec, et superscriptio?"
      en: "And Jesus saith to them: Whose image and inscription is this?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dicunt ei: Caesaris. Tunc ait illis: Reddite ergo quae sunt Caesaris, Caesari: et quae sunt Dei, Deo."
      en: "They say to him: Caesar's. Then he saith to them: Render therefore to Caesar the things that are Caesar's; and to God, the things that are God's."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et audientes mirati sunt, et relicto eo abierunt."
      en: "And hearing this they wondered, and leaving him, went their ways."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "In illo die accesserunt ad eum sadducaei, qui dicunt non esse resurrectionem: et interrogaverunt eum,"
      en: "That day there came to him the Sadducees, who say there is no resurrection; and asked him,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dicentes: Magister, Moyses dixit: Si quis mortuus fuerit non habens filium, ut ducat frater ejus uxorem illius, et suscitet semen fratri suo."
      en: "Saying: Master, Moses said: If a man die having no son, his brother shall marry his wife, and raise up issue to his brother."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Erant autem apud nos septem fratres: et primus, uxore ducta, defunctus est: et non habens semen, reliquit uxorem suam fratri suo."
      en: "Now there were with us seven brethren: and the first having married a wife, died; and not having issue, left his wife to his brother."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Similiter secundus, et tertius usque ad septimum."
      en: "In like manner the second, and the third, and so on to the seventh."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Novissime autem omnium et mulier defuncta est."
      en: "And last of all the woman died also."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "In resurrectione ergo cujus erit de septem uxor? omnes enim habuerunt eam."
      en: "At the resurrection therefore whose wife of the seven shall she be? for they all had her."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Respondens autem Jesus, ait illis: Erratis nescientes Scripturas, neque virtutem Dei."
      en: "And Jesus answering, said to them: You err, not knowing the Scriptures, nor the power of God."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "In resurrectione enim neque nubent, neque nubentur: sed erunt sicut angeli Dei in caelo."
      en: "For in the resurrection they shall neither marry nor be married; but shall be as the angels of God in heaven."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "De resurrectione autem mortuorum non legistis quod dictum est a Deo dicente vobis:"
      en: "And concerning the resurrection of the dead, have you not read that which was spoken by God, saying to you:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ego sum Deus Abraham, et Deus Isaac, et Deus Jacob? Non est Deus mortuorum, sed viventium."
      en: "I am the God of Abraham, and the God of Isaac, and the God of Jacob? He is not the God of the dead, but of the living."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et audientes turbae, mirabantur in doctrina ejus."
      en: "And the multitudes hearing it, were in admiration at his doctrine."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Pharisaei autem audientes quod silentium imposuisset sadducaeis, convenerunt in unum:"
      en: "But the Pharisees hearing that he had silenced the Sadducees, came together:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et interrogavit eum unus ex eis legis doctor, tentans eum:"
      en: "And one of them, a doctor of the law, asking him, tempting him:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Magister, quod est mandatum magnum in lege?"
      en: "Master, which is the greatest commandment in the law?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Ait illi Jesus: Diliges Dominum Deum tuum ex toto corde tuo, et in tota anima tua, et in tota mente tua."
      en: "Jesus said to him: Thou shalt love the Lord thy God with thy whole heart, and with thy whole soul, and with thy whole mind."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Hoc est maximum, et primum mandatum."
      en: "This is the greatest and the first commandment."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Secundum autem simile est huic: Diliges proximum tuum, sicut teipsum."
      en: "And the second is like to this: Thou shalt love thy neighbour as thyself."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "In his duobus mandatis universa lex pendet, et prophetae."
      en: "On these two commandments dependeth the whole law and the prophets."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Congregatis autem pharisaeis, interrogavit eos Jesus,"
      en: "And the Pharisees being gathered together, Jesus asked them,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "dicens: Quid vobis videtur de Christo? cujus filius est? Dicunt ei: David."
      en: "Saying: What think you of Christ? whose son is he? They say to him: David's."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Ait illis: Quomodo ergo David in spiritu vocat eum Dominum, dicens:"
      en: "He saith to them: How then doth David in spirit call him Lord, saying:"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Dixit Dominus Domino meo: Sede a dextris meis, donec ponam inimicos tuos scabellum pedum tuorum?"
      en: "The Lord said to my Lord, Sit on my right hand, until I make thy enemies thy footstool?"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Si ergo David vocat eum Dominum, quomodo filius ejus est?"
      en: "If David then call him Lord, how is he his son?"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Et nemo poterat ei respondere verbum: neque ausus fuit quisquam ex illa die eum amplius interrogare."
      en: "And no man was able to answer him a word; neither durst any man from that day forth ask him any more questions."
    status: { la: verified, en: verified }
