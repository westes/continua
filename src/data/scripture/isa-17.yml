# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 17
verses:
  - n: 1
    text:
      la: "Onus Damasci. Ecce Damascus desinet esse civitas, et erit sicut acervus lapidum in ruina."
      en: "The burden of Damascus. Behold Damascus shall cease to be a city, and shall be as a ruinous heap of stones."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Derelictae civitates Aroer gregibus erunt, et requiescent ibi, et non erit qui exterreat."
      en: "The cities of Aroer shall be left for flocks, and they shall rest there, and there shall be none to make them afraid."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et cessabit adjutorium ab Ephraim, et regnum a Damasco; et reliquiae Syriae sicut gloria filiorum Israel erunt, dicit Dominus exercituum."
      en: "And aid shall cease from Ephraim, and the kingdom from Damascus: and the remnant of Syria shall be as the glory of the children of Israel: saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et erit in die illa: attenuabitur gloria Jacob, et pinguedo carnis ejus marcescet."
      en: "And it shall come to pass in that day, that the glory of Jacob shall be made thin, and the fatness of his flesh shall grow lean."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et erit sicut congregans in messe quod restiterit, et brachium ejus spicas leget; et erit sicut quaerens spicas in valle Raphaim."
      en: "And it shall be as when one gathereth in the harvest that which remaineth, and his arm shall gather the ears of corn: and it shall be as he that seeketh ears in the vale of Raphaim."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et relinquetur in eo sicut racemus et sicut excussio oleae duarum vel trium olivarum in summitate rami, sive quatuor aut quinque in cacuminibus ejus fructus ejus, dicit Dominus Deus Israel."
      en: "And the fruit thereof that shall be left upon it, shall be as one cluster of grapes, and as the shaking of the olive tree, two or three berries in the top of a bough, or four or five upon the top of the tree, saith the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "In die illa inclinabitur homo ad factorem suum, et oculi ejus ad Sanctum Israel respicient;"
      en: "In that day man shall bow down himself to his Maker, and his eyes shall look to the Holy One of Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et non inclinabitur ad altaria quae fecerunt manus ejus; et quae operati sunt digiti ejus non respiciet lucos et delubra."
      en: "And he shall not look to the altars which his hands made: and he shall not have respect to the things that his fingers wrought, such as groves and temples."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "In die illa erunt civitates fortitudinis ejus derelictae sicut aratra, et segetes quae derelictae sunt a facie filiorum Israel; et eris deserta."
      en: "In that day his strong cities shall be forsaken, as the ploughs, and the corn that were left before the face of the children of Israel, and thou shalt be desolate."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quia oblitus es Dei salvatoris tui, et fortis adjutoris tui non es recordata: propterea plantabis plantationem fidelem, et germen alienum seminabis;"
      en: "Because thou hast forgotten God thy saviour, and hast not remembered thy strong helper: therefore shalt thou plant good plants, and shalt sow strange seed."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in die plantationis tuae labrusca, et mane semen tuum florebit; ablata est messis in die haereditatis, et dolebit graviter."
      en: "In the day of thy planting shall be the wild grape, and in the morning thy seed shall flourish: the harvest is taken away in the day of inheritance, and shall grieve thee much."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Vae multitudini populorum multorum, ut multitudo maris sonantis; et tumultus turbarum, sicut sonitus aquarum multarum."
      en: "Woe to the multitude of many people, like the multitude of the roaring sea: and the tumult of crowds, like the noise of many waters."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sonabunt populi sicut sonitus aquarum inundantium, et increpabit eum, et fugiet procul; et rapietur sicut pulvis montium a facie venti, et sicut turbo coram tempestate."
      en: "Nations shall make a noise like the noise of waters overflowing, but he shall rebuke him, and he shall flee far off: and he shall be carried away as the dust of the mountains before the wind, and as a whirlwind before a tempest."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "In tempore vespere, et ecce turbatio; in matutino, et non subsistet. Haec est pars eorum qui vastaverunt nos, et sors diripientium nos."
      en: "In the time of the evening, behold there shall be trouble: the morning shall come, and he shall not be: this is the portion of them that have wasted us, and the lot of them that spoiled us."
    status: { la: verified, en: verified }
