# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 10
verses:
  - n: 1
    text:
      la: "et dixit Dominus ad Mosen ingredere ad Pharao ego enim induravi cor eius et servorum illius ut faciam signa mea haec in eo"
      en: "And the Lord said to Moses: Go in to Pharao; for I have hardened his heart, and the heart of his servants: that I may work these my signs in him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et narres in auribus filii tui et nepotum tuorum quotiens contriverim Aegyptios et signa mea fecerim in eis et sciatis quia ego Dominus"
      en: "And thou mayest tell in the ears of thy sons, and of they grandsons, how often I have plagued the Egyptians, and wrought my signs amongst them: and you may know that I am the Lord:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "introierunt ergo Moses et Aaron ad Pharaonem et dixerunt ad eum haec dicit Dominus Deus Hebraeorum usquequo non vis subici mihi dimitte populum meum ut sacrificet mihi"
      en: "Therefore Moses and Aaron went in to Pharao, and said to him: Thus saith the Lord God of the Hebrews: How long refusest thou to submit to me? let my people go, to sacrifice to me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sin autem resistis et non vis dimittere eum ecce ego inducam cras lucustam in fines tuos"
      en: "But if thou resist, and wilt not let them go, behold I will bring in to morrow the locust into thy coasts:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quae operiat superficiem terrae nec quicquam eius appareat sed comedatur quod residuum fuit grandini conrodet enim omnia ligna quae germinant in agris"
      en: "To cover the face of the earth that nothing thereof may appear, but that which the hail hath left may be eaten: for they shall feed upon all the trees that spring in the fields."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et implebunt domos tuas et servorum tuorum et omnium Aegyptiorum quantam non viderunt patres tui et avi ex quo orti sunt super terram usque in praesentem diem avertitque se et egressus est a Pharaone"
      en: "And they shall fill thy houses, and the houses of thy servants, and of all the Egyptians: such a number as thy fathers have not seen, nor thy grandfathers, from the time they were first upon the earth, until this present day. And he turned himself away, and went forth from Pharao."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixerunt autem servi Pharaonis ad eum usquequo patiemur hoc scandalum dimitte homines ut sacrificent Domino Deo suo nonne vides quod perierit Aegyptus"
      en: "And Pharao's servants said to him: How long shall we endure this scandal? let the men go to sacrifice to the Lord their God. Dost thou not see that Egypt is undone?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "revocaveruntque Mosen et Aaron ad Pharaonem qui dixit eis ite sacrificate Domino Deo vestro quinam sunt qui ituri sunt"
      en: "And they called back Moses and Aaron to Pharao: and he said to them: Go, sacrifice to the Lord your God: who are they that shall go?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ait Moses cum parvulis nostris et senibus pergemus cum filiis et filiabus cum ovibus et armentis est enim sollemnitas Domini nostri"
      en: "Moses said: We will go with our young and old, with our sons and daughters, with our sheep and herds: for it is the solemnity of the Lord our God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et respondit sic Dominus sit vobiscum quomodo ego dimittam vos et parvulos vestros cui dubium est quod pessime cogitetis"
      en: "And Pharao answered: So be the Lord with you, as I shall let you and your children go: who can doubt but that you intend some great evil?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non fiet ita sed ite tantum viri et sacrificate Domino hoc enim et ipsi petistis statimque eiecti sunt de conspectu Pharaonis"
      en: "It shall not be so: but go ye men only, and sacrifice to the Lord: for this yourselves also desired. And immediately they were cast out from Pharao's presence."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixit autem Dominus ad Mosen extende manum tuam super terram Aegypti ad lucustam ut ascendat super eam et devoret omnem herbam quae residua fuit grandini"
      en: "And the Lord said to Moses: Stretch forth thy hand upon the land of Egypt unto the locust, that it may come upon it, and devour every herb that is left after the hail."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "extendit Moses virgam super terram Aegypti et Dominus induxit ventum urentem tota illa die ac nocte et mane facto ventus urens levavit lucustas"
      en: "And Moses stretched forth his rod upon the land of Egypt: and the Lord brought a burning wind all that day, and night: and when it was morning, the burning wind raised the locusts:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quae ascenderunt super universam terram Aegypti et sederunt in cunctis finibus Aegyptiorum innumerabiles quales ante illud tempus non fuerant nec postea futurae sunt"
      en: "And they came up over the whole land of Egypt: and rested in all the coasts of the Egyptians innumerable, the like as had not been before that time, nor shall be hereafter."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "operueruntque universam superficiem terrae vastantes omnia devorata est igitur herba terrae et quicquid pomorum in arboribus fuit quae grando dimiserat nihilque omnino virens relictum est in lignis et in herbis terrae in cuncta Aegypto"
      en: "And they covered the whole face of the earth, wasting all things. And the grass of the earth was devoured, and what fruits soever were on the trees, which the hail had left: and there remained not any thing that was green on the trees, or in the herbs of the earth in all Egypt."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quam ob rem festinus Pharao vocavit Mosen et Aaron et dixit eis peccavi in Dominum Deum vestrum et in vos"
      en: "Wherefore Pharao in haste called Moses and Aaron, and said to them: I have sinned against the Lord your God, and against you."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed nunc dimittite peccatum mihi etiam hac vice et rogate Dominum Deum vestrum ut auferat a me mortem istam"
      en: "But now forgive me my sin this time also, and pray to the Lord your God, that he take away from me this death."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "egressusque est de conspectu Pharaonis et oravit Dominum"
      en: "And Moses going forth from the presence of Pharao, prayed to the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui flare fecit ventum ab occidente vehementissimum et arreptam lucustam proiecit in mare Rubrum non remansit ne una quidem in cunctis finibus Aegypti"
      en: "And he made a very strong wind to blow from the west, and it took the locusts and cast them into the Red Sea: there remained not so much as one in all the coasts of Egypt."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et induravit Dominus cor Pharaonis nec dimisit filios Israhel"
      en: "And the Lord hardened Pharao's heart, neither did he let the children of Israel go."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixit autem Dominus ad Mosen extende manum tuam in caelum et sint tenebrae super terram Aegypti tam densae ut palpari queant"
      en: "And the Lord said to Moses: Stretch out they hand towards heaven: and may there be darkness upon the land of Egypt, so thick that it may be felt."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "extendit Moses manum in caelum et factae sunt tenebrae horribiles in universa terra Aegypti tribus diebus"
      en: "And Moses stretch forth his hand towards heaven: and there came horrible darkness in all the land of Egypt for three days."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "nemo vidit fratrem suum nec movit se de loco in quo erat ubicumque autem habitabant filii Israhel lux erat"
      en: "No man saw his brother, nor moved himself out of the place where he was: but wheresoever the children of Israel dwelt there was light."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "vocavitque Pharao Mosen et Aaron et dixit eis ite sacrificate Domino oves tantum vestrae et armenta remaneant parvuli vestri eant vobiscum"
      en: "And Pharao called Moses and Aaron, and said to them: Go sacrifice to the Lord: let your sheep only, and herds remain; let your children go with you."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ait Moses hostias quoque et holocausta dabis nobis quae offeramus Domino Deo nostro"
      en: "Moses said: Thou shalt give us also sacrifices and burnt offerings, to the Lord our God."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cuncti greges pergent nobiscum non remanebit ex eis ungula quae necessaria sunt in cultum Domini Dei nostri praesertim cum ignoremus quid debeat immolari donec ad ipsum locum perveniamus"
      en: "All the flocks shall go with us: there shall not a hoof remain of them: for they are necessary for the service of the Lord our God: especially as we know not what must be offered, till we come to the very place."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "induravit autem Dominus cor Pharaonis et noluit dimittere eos"
      en: "And the Lord hardened Pharao's heart, and he would not let them go."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dixitque Pharao ad eum recede a me cave ne ultra videas faciem meam quocumque die apparueris mihi morieris"
      en: "And Pharao said to Moses: Get thee from me, and beware thou see not my face any more: in what day soever thou shalt come in my sight, thou shalt die."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "respondit Moses ita fiat ut locutus es non videbo ultra faciem tuam"
      en: "Moses answered: So shall it be as thou hast spoken, I will not see thy face any more."
    status: { la: verified, en: verified }
