# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 12
verses:
  - n: 1
    text:
      la: "si benefeceris scito cui feceris et erit gratia in bonis tuis multa"
      en: "If thou do good, know to whom thou dost it, and there shall be much thanks for thy good deeds."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "benefac iusto et invenies retributionem magnam et si non ab ipso certe a Domino"
      en: "Do good to the just, and thou shalt find great recompense: and if not of him, assuredly of the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "non est ei bene qui adsiduus est malis et elemosynam non danti quoniam et Altissimus odio habet peccatores et misertus est paenitentibus"
      en: "For there is no good for him that is always occupied in evil, and that giveth no alms: for the Highest hateth sinners, and hath mercy on the penitent."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "da misericordi et ne suscipias peccatorem et impiis et peccatoribus reddet vindictam custodiens eos in die vindictae"
      en: "Give to the merciful and uphold not the sinner: God will repay vengeance to the ungodly and to sinners, and keep them against the day of vengeance."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "da bono et non receperis peccatorem"
      en: "Give to the good, and receive not a sinner."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "benefac humili et non dederis impio prohibe panes illi dare ne in ipsis potentior te sit"
      en: "Do good to the humble, and give not to the ungodly: hold back thy bread, and give it not to him, lest thereby he overmaster thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nam duplicia mala invenies in omnibus bonis quoniam et Altissimus odio habet peccatores et impiis reddet vindictam"
      en: "For thou shalt receive twice as much evil for all the good thou shalt have done to him: for the Highest also hateth sinners, and will repay vengeance to the ungodly."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "non agnoscetur in bonis amicus et non abscondetur in malis inimicus"
      en: "A friend shall not be known in prosperity, and an enemy shall not be hidden in adversity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in bonis viri inimici illius in tristitia et in malitia illius amicus agnitus est"
      en: "In the prosperity of a man, his enemies are grieved: and a friend is known in his adversity."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "non credas inimico tuo in aeternum sicut enim aeramentum eruginat nequitia illius"
      en: "Never trust thy enemy: for as a brass pot his wickedness rusteth:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et si humiliatus vadat curvus adice animum tuum et custodi te ab illo"
      en: "11Though he humble himself and go crouching, yet take good heed and beware of him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non statuas illum penes te nec sedeat ad dexteram tuam ne conversus stet in loco tuo ne forte conversus in locum tuum inquirat cathedram tuam et in novissimo cognoscas verba mea et in sermonibus meis stimuleris"
      en: "Set him not by thee, neither let him sit on thy right hand, lest he turn into thy place, and seek to take thy seat: and at the last thou acknowledge my words, and be pricked with my sayings."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quis miserebitur incantatori a serpente percusso et omnibus qui adpropiant bestiis et qui comitatur cum viro iniquo et obvolutus est in peccatis eius"
      en: "Who will pity an enchanter struck by a serpent, or any that come near wild beasts? so is it with him that keepeth company with a wicked man, and is involved in his sins."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "una hora tecum permanebit si autem declinaveris non subportabit"
      en: "For an hour he will abide with thee: but if thou begin to decline, he will not endure it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "in labiis suis indulcat inimicus et in corde suo insidiatur ut subvertat te in foveam"
      en: "An enemy speaketh sweetly with his lips, but in his heart he lieth in wait, to throw thee into a pit."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in oculis suis lacrimatur inimicus et si invenerit tempus non satiabitur sanguine"
      en: "An enemy weepeth with his eyes: but if he find an opportunity he will not be satisfied with blood:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "si incurrerint tibi mala invenies eum illic priorem"
      en: "And if evils come upon thee, thou shalt find him there first."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "in oculis suis lacrimatur inimicus et quasi adiuvans suffodiet plantas tuas"
      en: "An enemy hath tears in his eyes, and while he pretendeth to help thee, will undermine thy feet."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "caput suum movebit et plaudebit manu et multa susurrans commutabit vultum suum"
      en: "He will shake his head, and clap his hands, and whisper much, and change his countenance."
    status: { la: verified, en: verified }
