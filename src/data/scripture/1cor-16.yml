# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1cor
chapter: 16
verses:
  - n: 1
    text:
      la: "De collectis autem, quae fiunt in sanctos, sicut ordinavi ecclesiis Galatiae, ita et vos facite."
      en: "Now concerning the collections that are made for the saints, as I have given order to the churches of Galatia, so do ye also."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Per unam sabbati unusquisque vestrum apud se seponat, recondens quod ei bene placuerit: ut non, cum venero, tunc collectae fiant."
      en: "On the first day of the week let every one of you put apart with himself, laying up what it shall well please him; that when I come, the collections be not then to be made."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cum autem praesens fuero, quos probaveritis per epistolas, hos mittam perferre gratiam vestram in Jerusalem."
      en: "And when I shall be with you, whomsoever you shall approve by letters, them will I send to carry your grace to Jerusalem."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quod si dignum fuerit ut et ego eam, mecum ibunt."
      en: "And if it be meet that I also go, they shall go with me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Veniam autem ad vos, cum Macedoniam pertransiero: nam Macedoniam pertransibo."
      en: "Now I will come to you, when I shall have passed through Macedonia. For I shall pass through Macedonia."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Apud vos autem forsitan manebo, vel etiam hiemabo: ut vos me deducatis quocumque iero."
      en: "And with you perhaps I shall abide, or even spend the winter: that you may bring me on my way whithersoever I shall go."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nolo enim vos modo in transitu videre, spero enim me aliquantulum temporis manere apud vos, si Dominus permiserit."
      en: "For I will not see you now by the way, for I trust that I shall abide with you some time, if the Lord permit."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Permanebo autem Ephesi usque ad Pentecosten."
      en: "But I will tarry at Ephesus until Pentecost."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ostium enim mihi apertum est magnum, et evidens: et adversarii multi."
      en: "For a great door and evident is opened unto me: and many adversaries."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si autem venerit Timotheus, videte ut sine timore sit apud vos: opus enim Domini operatur, sicut et ego."
      en: "Now if Timothy come, see that he be with you without fear, for he worketh the work of the Lord, as I also do."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ne quis ergo illum spernat: deducite autem illum in pace, ut veniat ad me: exspecto enim illum cum fratribus."
      en: "Let no man therefore despise him, but conduct ye him on his way in peace: that he may come to me. For I look for him with the brethren."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "De Apollo autem fratre vobis notum facio, quoniam multum rogavi eum ut veniret ad vos cum fratribus: et utique non fuit voluntas ut nunc veniret: veniet autem, cum ei vacuum fuerit."
      en: "And touching our brother Apollo, I give you to understand, that I much entreated him to come unto you with the brethren: and indeed it was not his will at all to come at this time. But he will come when he shall have leisure."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Vigilate, state in fide, viriliter agite, et confortamini."
      en: "Watch ye, stand fast in the faith, do manfully, and be strengthened."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Omnia vestra in caritate fiant."
      en: "Let all your things be done in charity."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Obsecro autem vos fratres, nostis domum Stephanae, et Fortunati, et Achaici: quoniam sunt primitiae Achaiae, et in ministerium sanctorum ordinaverunt seipsos:"
      en: "And I beseech you, brethren, you know the house of Stephanas, and of Fortunatus, and of Achaicus, that they are the firstfruits of Achaia, and have dedicated themselves to the ministry of the saints:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ut et vos subditi sitis ejusmodi, et omni cooperanti, et laboranti."
      en: "That you also be subject to such, and to every one that worketh with us, and laboureth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Gaudeo autem in praesentia Stephanae, et Fortunati, et Achaici: quoniam id, quod vobis deerat, ipsi suppleverunt:"
      en: "And I rejoice in the presence of Stephanas, and Fortunatus, and Achaicus, because that which was wanting on your part, they have supplied."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "refecerunt enim et meum spiritum, et vestrum. Cognoscite ergo qui hujusmodi sunt."
      en: "For they have refreshed both my spirit and yours. Know them, therefore, that are such."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Salutant vos ecclesiae Asiae. Salutant vos in Domino multum, Aquila et Priscilla cum domestica sua ecclesia: apud quos et hospitor."
      en: "The churches of Asia salute you. Aquila and Priscilla salute you much in the Lord, with the church that is in their house, with whom I also lodge."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Salutant vos omnes fratres. Salutate invicem in osculo sancto."
      en: "All the brethren salute you. Salute one another with a holy kiss."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Salutatio, mea manu Pauli."
      en: "The salutation of me Paul, with my own hand."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Si quis non amat Dominum nostrum Jesum Christum, sit anathema, Maran Atha."
      en: "If any man love not our Lord Jesus Christ, let him be anathema, maranatha."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Gratia Domini nostri Jesu Christi vobiscum."
      en: "The grace of our Lord Jesus Christ be with you."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Caritas mea cum omnibus vobis in Christo Jesu. Amen."
      en: "My charity be with you all in Christ Jesus. Amen."
    status: { la: verified, en: verified }
