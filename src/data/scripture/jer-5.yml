# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 5
verses:
  - n: 1
    text:
      la: "circuite vias Hierusalem et aspicite et considerate et quaerite in plateis eius an inveniatis virum facientem iudicium et quaerentem fidem et propitius ero eius"
      en: "Go about through the streets of Jerusalem, and see, and consider, and seek in the broad places thereof, if you can fins a man that executeth judgement, and seeketh faith: and I will be merciful unto it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quod si etiam vivit Dominus dixerint et hoc falso iurabunt"
      en: "And though they say: The Lord liveth; this also they will swear falsely."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Domine oculi tui respiciunt fidem percussisti eos et non doluerunt adtrivisti eos et rennuerunt accipere disciplinam induraverunt facies suas super petram noluerunt reverti"
      en: "O Lord, thy eyes are upon truth: thou hast struck them, and they have not grieved: thou hast bruised them, and they have refused to receive correction: they have made their faces harder than the rock, and they have refused to return."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ego autem dixi forsitan pauperes sunt et stulti ignorantes viam Domini iudicium Dei sui"
      en: "But I said: Perhaps these are poor and foolish, that know not the way of the Lord, the judgement of their God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ibo igitur ad optimates et loquar eis ipsi enim cognoverunt viam Domini iudicium Dei sui et ecce magis hii simul confregerunt iugum ruperunt vincula"
      en: "I will go therefore to the great men, and I will speak to them: for they known the way of the Lord, the judgement of their God: and behold these have together broken the yoke more, and have burst the bonds."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "idcirco percussit eos leo de silva lupus ad vesperam vastavit eos pardus vigilans super civitates eorum omnis qui egressus fuerit ex eis capietur quia multiplicatae sunt praevaricationes eorum confortatae sunt aversiones eorum"
      en: "Wherefore a lion out of the wood hath slain them, a wolf in the evening, hath spoiled them, a leopard watcheth for their cities: every one that shall go out thence shall be taken, because their transgressions are multiplied, their rebellions are strengthened."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "super quo propitius tibi esse potero filii tui dereliquerunt me et iurant in his qui non sunt dii saturavi eos et moechati sunt et in domo meretricis luxuriabantur"
      en: "How can I be merciful to thee? thy children have forsaken me, and swear by them that are not gods: I fed them to the full, and they committed adultery, and rioted in the harlot's house."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "equi amatores et admissarii facti sunt unusquisque ad uxorem proximi sui hinniebat"
      en: "They are become as amorous horses and stallions, every one neighed after his neighbor's wife."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "numquid super his non visitabo dicit Dominus et in gente tali non ulciscetur anima mea"
      en: "Shall I not visit for these things, sayeth the Lord? and shall not my soul take revenge on such a nation?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ascendite muros eius et dissipate consummationem autem nolite facere auferte propagines eius quia non sunt Domini"
      en: "Scale down the walls thereof, and throw them down, but do not utterly destroy: take away the branches thereof, because they are not the Lord's."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "praevaricatione enim praevaricata est in me domus Israhel et domus Iuda ait Dominus"
      en: "For the house of Israel, and the house of Juda have greatly transgressed against me, saith the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "negaverunt Dominum et dixerunt non est ipse neque veniet super nos malum gladium et famem non videbimus"
      en: "They have denied the Lord, and said, It is not he: and the evil shall not come upon us: we shall not see the sword and famine."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "prophetae fuerunt in ventum et responsum non fuit in eis haec ergo evenient illis"
      en: "The prophets have spoken in the wind, and there was no word of God in them: these things therefore shall befall them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "haec dicit Dominus Deus exercituum quia locuti estis verbum istud ecce ego do verba mea in ore tuo in ignem et populum istum ligna et vorabit eos"
      en: "Thus saith the Lord the God of hosts: Because you have spoken this word, behold I will make my words in thy mouth as fire, and this people as wood, and it shall devour them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ecce ego adducam super vos gentem de longinquo domus Israhel ait Dominus gentem robustam gentem antiquam gentem cuius ignorabis linguam nec intelleges quid loquatur"
      en: "Behold I will bring upon you a nation from afar, O house of Israel, saith the Lord: a strong nation, an ancient nation, a nation whose language thou shalt not know, nor understand what they say."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "faretra eius quasi sepulchrum patens universi fortes"
      en: "Their quiver is as an open sepulchre, they are all valiant."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et comedet segetes tuas et panem tuum devorabit filios tuos et filias tuas comedet gregem tuum et armenta tua comedet vineam tuam et ficum tuam et conteret urbes munitas tuas in quibus tu habes fiduciam gladio"
      en: "And they shall eat up thy corn, and thy bread: they shall devour thy sons, and thy daughters: they shall eat up thy flocks, and thy herds: they shall eat thy vineyards, and thy figs: and with the sword they shall destroy thy strong cities, wherein thou trustest."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "verumtamen et diebus illis ait Dominus non faciam vos in consummationem"
      en: "Nevertheless in those days, saith the Lord, I will not bring you to utter destruction."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quod si dixeritis quare fecit Dominus Deus noster nobis haec omnia dices ad eos sicut dereliquistis me et servistis deo alieno in terra vestra sic servietis alienis in terra non vestra"
      en: "And if you shall say: why hath the Lord our God done all these things to us? thou shalt say to them: As you have forsaken me, and served a strange god in your own land, so shall you serve strangers in a land that is not your own."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "adnuntiate hoc domui Iacob et auditum facite in Iuda dicentes"
      en: "Declare ye this to the house of Jacob, and publish it in Juda, saying:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "audi populus stulte qui non habes cor qui habentes oculos non videtis et aures et non auditis"
      en: "Hear, O foolish people, and without understanding: who have eyes, and see not: and ears, and hear not."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "me ergo non timebitis ait Dominus et a facie mea non dolebitis qui posui harenam terminum mari praeceptum sempiternum quod non praeteribit et commovebuntur et non poterunt et intumescent fluctus eius et non transibunt illud"
      en: "Will not you then fear me, saith the Lord: and will you not repent at my presence? I have set the sand a bound for the sea, an everlasting ordinance, which it shall not pass over: and the waves thereof shall toss themselves, and shall not prevail: they shall swell, and shall not pass over it."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "populo autem huic factum est cor incredulum et exasperans recesserunt et abierunt"
      en: "But the heart of this people is become hard of belief and provoking, they are revolted and gone away."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et non dixerunt in corde suo metuamus Dominum Deum nostrum qui dat nobis pluviam temporaneam et serotinam in tempore suo plenitudinem annuae messis custodientem nobis"
      en: "And they have not said in their heart: let us fear the Lord our God, who giveth us the early and the latter rain in due season: who preserveth for us the fullness of the yearly harvest."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "iniquitates nostrae declinaverunt haec et peccata nostra prohibuerunt bonum a nobis"
      en: "Your iniquities have turned these things away, and your sins have withholden good things from you."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quia inventi sunt in populo meo impii insidiantes quasi aucupes laqueos ponentes et pedicas ad capiendos viros"
      en: "For among my people are found wicked men, that lie in wait as fowlers, setting snares and traps to catch men."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sicut decipula plena avibus sic domus eorum plenae dolo ideo magnificati sunt et ditati"
      en: "As a net is full of birds, so their houses are full of deceit: therefore are they become great and enriched."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "incrassati sunt et inpinguati et praeterierunt sermones meos pessime causam non iudicaverunt causam pupilli non direxerunt et iudicium pauperum non iudicaverunt"
      en: "They are grown gross and fat: andhave most wickedly transgressed my words. They have not judged the cause of the widow, they have not managed the cause of the fatherless, they have not judged the judgement of the poor."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "numquid super his non visitabo dicit Dominus aut super gentem huiuscemodi non ulciscetur anima mea"
      en: "Shall I not visit for these things, saith the Lord? or shall not my soul take revenge on such a nation?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "stupor et mirabilia facta sunt in terra"
      en: "Astonishing and wonderful things have been done in the land."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "prophetae prophetabant mendacium et sacerdotes adplaudebant manibus suis et populus meus dilexit talia quid igitur fiet in novissimo eius"
      en: "The prophets prophesied falsehood, and the priests clapped their hands: and my people loved such things: what then shall be done in the end thereof?"
    status: { la: verified, en: verified }
