# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 21
verses:
  - n: 1
    text:
      la: "et cum adpropinquassent Hierosolymis et venissent Bethfage ad montem Oliveti tunc Iesus misit duos discipulos"
      en: "And when they drew nigh to Jerusalem, and were come to Bethphage, unto mount Olivet, then Jesus sent two disciples,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dicens eis ite in castellum quod contra vos est et statim invenietis asinam alligatam et pullum cum ea solvite et adducite mihi"
      en: "Saying to them: Go ye into the village that is over against you, and immediately you shall find an ass tied, and a colt with her: loose them and bring them to me."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et si quis vobis aliquid dixerit dicite quia Dominus his opus habet et confestim dimittet eos"
      en: "And if any man shall say anything to you, say ye, that the Lord hath need of them: and forthwith he will let them go."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "hoc autem factum est ut impleretur quod dictum est per prophetam dicentem"
      en: "Now all this was done that it might be fulfilled which was spoken by the prophet, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dicite filiae Sion ecce rex tuus venit tibi mansuetus et sedens super asinam et pullum filium subiugalis"
      en: "Tell ye the daughter of Sion: Behold thy king cometh to thee, meek, and sitting upon an ass, and a colt the foal of her that is used to the yoke."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "euntes autem discipuli fecerunt sicut praecepit illis Iesus"
      en: "And the disciples going, did as Jesus commanded them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et adduxerunt asinam et pullum et inposuerunt super eis vestimenta sua et eum desuper sedere fecerunt"
      en: "And they brought the ass and the colt, and laid their garments upon them, and made him sit thereon."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "plurima autem turba straverunt vestimenta sua in via alii autem caedebant ramos de arboribus et sternebant in via"
      en: "And a very great multitude spread their garments in the way: and others cut boughs from the trees, and strewed them in the way:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "turbae autem quae praecedebant et quae sequebantur clamabant dicentes osanna Filio David benedictus qui venturus est in nomine Domini osanna in altissimis"
      en: "And the multitudes that went before and that followed, cried, saying: Hosanna to the son of David: Blessed is he that cometh in the name of the Lord: Hosanna in the highest."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et cum intrasset Hierosolymam commota est universa civitas dicens quis est hic"
      en: "And when he was come into Jerusalem, the whole city was moved, saying: Who is this?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "populi autem dicebant hic est Iesus propheta a Nazareth Galilaeae"
      en: "And the people said: This is Jesus the prophet, from Nazareth of Galilee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et intravit Iesus in templum Dei et eiciebat omnes vendentes et ementes in templo et mensas nummulariorum et cathedras vendentium columbas evertit"
      en: "And Jesus went into the temple of God, and cast out all them that sold and bought in the temple, and overthrew the tables of the money changers, and the chairs of them that sold doves:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dicit eis scriptum est domus mea domus orationis vocabitur vos autem fecistis eam speluncam latronum"
      en: "And he saith to them: It is written, My house shall be called the house of prayer; but you have made it a den of thieves."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et accesserunt ad eum caeci et claudi in templo et sanavit eos"
      en: "And there came to him the blind and the lame in the temple; and he healed them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "videntes autem principes sacerdotum et scribae mirabilia quae fecit et pueros clamantes in templo et dicentes osanna Filio David indignati sunt"
      en: "And the chief priests and scribes, seeing the wonderful things that he did, and the children crying in the temple, and saying: Hosanna to the son of David; were moved with indignation."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dixerunt ei audis quid isti dicant Iesus autem dicit eis utique numquam legistis quia ex ore infantium et lactantium perfecisti laudem"
      en: "And said to him: Hearest thou what these say? And Jesus said to them: Yea, have you never read: Out of the mouth of infants and of sucklings thou hast perfected praise?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et relictis illis abiit foras extra civitatem in Bethaniam ibique mansit"
      en: "And leaving them, he went out of the city into Bethania, and remained there."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "mane autem revertens in civitatem esuriit"
      en: "And in the morning, returning into the city, he was hungry."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et videns fici arborem unam secus viam venit ad eam et nihil invenit in ea nisi folia tantum et ait illi numquam ex te fructus nascatur in sempiternum et arefacta est continuo ficulnea"
      en: "And seeing a certain fig tree by the way side, he came to it, and found nothing on it but leaves only, and he saith to it: May no fruit grow on thee henceforward for ever. And immediately the fig tree withered away."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et videntes discipuli mirati sunt dicentes quomodo continuo aruit"
      en: "And the disciples seeing it wondered, saying: How is it presently withered away?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "respondens autem Iesus ait eis amen dico vobis si habueritis fidem et non haesitaveritis non solum de ficulnea facietis sed et si monti huic dixeritis tolle et iacta te in mare fiet"
      en: "And Jesus answering, said to them: Amen, I say to you, if you shall have faith, and stagger not, not only this of the fig tree shall you do, but also if you shall say to this mountain, Take up and cast thyself into the sea, it shall be done."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et omnia quaecumque petieritis in oratione credentes accipietis"
      en: "And in all things whatsoever you shall ask in prayer, believing, you shall receive."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et cum venisset in templum accesserunt ad eum docentem principes sacerdotum et seniores populi dicentes in qua potestate haec facis et quis tibi dedit hanc potestatem"
      en: "And when he was come into the temple, there came to him, as he was teaching, the chief priests and ancients of the people, saying: By what authority dost thou these things? and who hath given thee this authority?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "respondens Iesus dixit illis interrogabo vos et ego unum sermonem quem si dixeritis mihi et ego vobis dicam in qua potestate haec facio"
      en: "Jesus answering, said to them: I also will ask you one word, which if you shall tell me, I will also tell you by what authority I do these things."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "baptismum Iohannis unde erat e caelo an ex hominibus at illi cogitabant inter se dicentes si dixerimus e caelo dicet nobis quare ergo non credidistis illi"
      en: "The baptism of John, whence was it? from heaven or from men? But they thought within themselves, saying:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "si autem dixerimus ex hominibus timemus turbam omnes enim habent Iohannem sicut prophetam"
      en: "If we shall say, from heaven, he will say to us: Why then did you not believe him? But if we shall say, from men, we are afraid of the multitude: for all held John as a prophet."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et respondentes Iesu dixerunt nescimus ait illis et ipse nec ego dico vobis in qua potestate haec facio"
      en: "And answering Jesus, they said: We know not. He also said to them: Neither do I tell you by what authority I do these things."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quid autem vobis videtur homo habebat duos filios et accedens ad primum dixit fili vade hodie operare in vinea mea"
      en: "But what think you? A certain man had two sons; and coming to the first, he said: Son, go work to day in my vineyard."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ille autem respondens ait nolo postea autem paenitentia motus abiit"
      en: "And he answering, said: I will not. But afterwards, being moved with repentance, he went."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "accedens autem ad alterum dixit similiter at ille respondens ait eo domine et non ivit"
      en: "And coming to the other, he said in like manner. And he answering, said: I go, Sir; and he went not."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quis ex duobus fecit voluntatem patris dicunt novissimus dicit illis Iesus amen dico vobis quia publicani et meretrices praecedunt vos in regno Dei"
      en: "Which of the two did the father's will? They say to him: The first. Jesus saith to them: Amen I say to you, that the publicans and the harlots shall go into the kingdom of God before you."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "venit enim ad vos Iohannes in via iustitiae et non credidistis ei publicani autem et meretrices crediderunt ei vos autem videntes nec paenitentiam habuistis postea ut crederetis ei"
      en: "For John came to you in the way of justice, and you did not believe him. But the publicans and the harlots believed him: but you, seeing it, did not even afterwards repent, that you might believe him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "aliam parabolam audite homo erat pater familias qui plantavit vineam et sepem circumdedit ei et fodit in ea torcular et aedificavit turrem et locavit eam agricolis et peregre profectus est"
      en: "Hear ye another parable. There was a man an householder, who planted a vineyard, and made a hedge round about it, and dug in it a press, and built a tower, and let it out to husbandmen; and went into a strange country."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "cum autem tempus fructuum adpropinquasset misit servos suos ad agricolas ut acciperent fructus eius"
      en: "And when the time of the fruits drew nigh, he sent his servants to the husbandmen that they might receive the fruits thereof."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et agricolae adprehensis servis eius alium ceciderunt alium occiderunt alium vero lapidaverunt"
      en: "And the husbandmen laying hands on his servants, beat one, and killed another, and stoned another."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "iterum misit alios servos plures prioribus et fecerunt illis similiter"
      en: "Again he sent other servants more than the former; and they did to them in like manner."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "novissime autem misit ad eos filium suum dicens verebuntur filium meum"
      en: "And last of all he sent to them his son, saying: They will reverence my son."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "agricolae autem videntes filium dixerunt intra se hic est heres venite occidamus eum et habebimus hereditatem eius"
      en: "But the husbandmen seeing the son, said among themselves: This is the heir: come, let us kill him, and we shall have his inheritance."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et adprehensum eum eiecerunt extra vineam et occiderunt"
      en: "And taking him, they cast him forth out of the vineyard, and killed him."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "cum ergo venerit dominus vineae quid faciet agricolis illis"
      en: "When therefore the lord of the vineyard shall come, what will he do to those husbandmen?"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "aiunt illi malos male perdet et vineam locabit aliis agricolis qui reddant ei fructum temporibus suis"
      en: "They say to him: He will bring those evil men to an evil end; and will let out his vineyard to other husbandmen, that shall render him the fruit in due season."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "dicit illis Iesus numquam legistis in scripturis lapidem quem reprobaverunt aedificantes hic factus est in caput anguli a Domino factum est istud et est mirabile in oculis nostris"
      en: "Jesus saith to them: Have you never read in the Scriptures: The stone which the builders rejected, the same is become the head of the corner? By the Lord this has been done; and it is wonderful in our eyes."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "ideo dico vobis quia auferetur a vobis regnum Dei et dabitur genti facienti fructus eius"
      en: "Therefore I say to you, that the kingdom of God shall be taken from you, and shall be given to a nation yielding the fruits thereof."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et qui ceciderit super lapidem istum confringetur super quem vero ceciderit conteret eum"
      en: "And whosoever shall fall on this stone, shall be broken: but on whomsoever it shall fall, it shall grind him to powder."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et cum audissent principes sacerdotum et Pharisaei parabolas eius cognoverunt quod de ipsis diceret"
      en: "And when the chief priests and Pharisees had heard his parables, they knew that he spoke of them."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et quaerentes eum tenere timuerunt turbas quoniam sicut prophetam eum habebant"
      en: "And seeking to lay hands on him, they feared the multitudes: because they held him as a prophet."
    status: { la: verified, en: verified }
