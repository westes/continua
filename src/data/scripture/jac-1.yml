# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jac
chapter: 1
verses:
  - n: 1
    text:
      la: "Jacobus, Dei et Domini nostri Jesu Christi servus, duodecim tribubus, quae sunt in dispersione, salutem."
      en: "James the servant of God, and of our Lord Jesus Christ, to the twelve tribes which are scattered abroad, greeting."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Omne gaudium existimate fratres mei, cum in tentationes varias incideritis:"
      en: "My brethren, count it all joy, when you shall fall into divers temptations;"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "scientes quod probatio fidei vestrae patientiam operatur."
      en: "Knowing that the trying of your faith worketh patience."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Patientia autem opus perfectum habet: ut sitis perfecti et integri in nullo deficientes."
      en: "And patience hath a perfect work; that you may be perfect and entire, failing in nothing."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Si quis autem vestrum indiget sapientia, postulet a Deo, qui dat omnibus affluenter, et non improperat: et dabitur ei."
      en: "But if any of you want wisdom, let him ask of God, who giveth to all men abundantly, and upbraideth not; and it shall be given him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Postulet autem in fide nihil haesitans: qui enim haesitat, similis est fluctui maris, qui a vento movetur et circumfertur:"
      en: "But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea, which is moved and carried about by the wind."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "non ergo aestimet homo ille quod accipiat aliquid a Domino."
      en: "Therefore let not that man think that he shall receive any thing of the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Vir duplex animo inconstans est in omnibus viis suis."
      en: "A double minded man is inconstant in all his ways."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Glorietur autem frater humilis in exaltatione sua:"
      en: "But let the brother of low condition glory in his exaltation:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dives autem in humilitate sua, quoniam sicut flos foeni transibit;"
      en: "And the rich, in his being low; because as the flower of the grass shall he pass away."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "exortus est enim sol cum ardore, et arefecit foenum, et flos ejus decidit, et decor vultus ejus deperiit: ita et dives in itineribus suis marcescet."
      en: "For the sun rose with a burning heat, and parched the grass, and the flower thereof fell off, and the beauty of the shape thereof perished: so also shall the rich man fade away in his ways."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Beatus vir qui suffert tentationem: quoniam cum probatus fuerit, accipiet coronam vitae, quam repromisit Deus diligentibus se."
      en: "Blessed is the man that endureth temptation; for when he hath been proved, he shall receive a crown of life, which God hath promised to them that love him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nemo cum tentatur, dicat quoniam a Deo tentatur: Deus enim intentator malorum est: ipse autem neminem tentat."
      en: "Let no man, when he is tempted, say that he is tempted by God. For God is not a tempter of evils, and he tempteth no man."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Unusquisque vero tentatur a concupiscentia sua abstractus, et illectus."
      en: "But every man is tempted by his own concupiscence, being drawn away and allured."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Deinde concupiscentia cum conceperit, parit peccatum: peccatum vero cum consummatum fuerit, generat mortem."
      en: "Then when concupiscence hath conceived, it bringeth forth sin. But sin, when it is completed, begetteth death."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nolite itaque errare, fratres mei dilectissimi."
      en: "Do not err, therefore, my dearest brethren."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Omne datum optimum, et omne donum perfectum desursum est, descendens a Patre luminum, apud quem non est transmutatio, nec vicissitudinis obumbratio."
      en: "Every best gift, and every perfect gift, is from above, coming down from the Father of lights, with whom there is no change, nor shadow of alteration."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Voluntarie enim genuit nos verbo veritatis, ut simus initium aliquod creaturae ejus."
      en: "For of his own will hath he begotten us by the word of truth, that we might be some beginning of his creatures."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Scitis, fratres mei dilectissimi. Sit autem omnis homo velox ad audiendum: tardus autem ad loquendum, et tardus ad iram."
      en: "You know, my dearest brethren. And let every man be swift to hear, but slow to speak, and slow to anger."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ira enim viri justitiam Dei non operatur."
      en: "For the anger of man worketh not the justice of God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Propter quod abjicientes omnem immunditiam, et abundantiam malitiae, in mansuetudine suscipite insitum verbum, quod potest salvare animas vestras."
      en: "Wherefore casting away all uncleanness, and abundance of naughtiness, with meekness receive the ingrafted word, which is able to save your souls."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Estote autem factores verbi, et non auditores tantum: fallentes vosmetipsos."
      en: "But be ye doers of the word, and not hearers only, deceiving your own selves."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quia si quis auditor est verbi, et non factor, hic comparabitur viro consideranti vultum nativitatis suae in speculo:"
      en: "For if a man be a hearer of the word, and not a doer, he shall be compared to a man beholding his own countenance in a glass."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "consideravit enim se, et abiit, et statim oblitus est qualis fuerit."
      en: "For he beheld himself, and went his way, and presently forgot what manner of man he was."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Qui autem perspexerit in legem perfectam libertatis, et permanserit in ea, non auditor obliviosus factus, sed factor operis: hic beatus in facto suo erit."
      en: "But he that hath looked into the perfect law of liberty, and hath continued therein, not becoming a forgetful hearer, but a doer of the work; this man shall be blessed in his deed."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Si quis autem putat se religiosum esse, non refrenans linguam suam, sed seducens cor suum, hujus vana est religio."
      en: "And if any man think himself to be religious, not bridling his tongue, but deceiving his own heart, this man's religion is vain."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Religio munda et immaculata apud Deum et Patrem, haec est: visitare pupillos et viduas in tribulatione eorum, et immaculatum se custodire ab hoc saeculo."
      en: "Religion clean and undefiled before God and the Father, is this: to visit the fatherless and widows in their tribulation: and to keep one's self unspotted from this world."
    status: { la: verified, en: verified }
