# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eph
chapter: 3
verses:
  - n: 1
    text:
      la: "huius rei gratia ego Paulus vinctus Christi Iesu pro vobis gentibus"
      en: "For this cause, I Paul, the prisoner of Jesus Christ, for you Gentiles;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "si tamen audistis dispensationem gratiae Dei quae data est mihi in vobis"
      en: "If yet you have heard of the dispensation of the grace of God which is given me towards you:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quoniam secundum revelationem notum mihi factum est sacramentum sicut supra scripsi in brevi"
      en: "How that, according to revelation, the mystery has been made known to me, as I have written above in a few words;"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "prout potestis legentes intellegere prudentiam meam in mysterio Christi"
      en: "As you reading, may understand my knowledge in the mystery of Christ,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quod aliis generationibus non est agnitum filiis hominum sicuti nunc revelatum est sanctis apostolis eius et prophetis in Spiritu"
      en: "Which in other generations was not known to the sons of men, as it is now revealed to his holy apostles and prophets in the Spirit:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "esse gentes coheredes et concorporales et conparticipes promissionis in Christo Iesu per evangelium"
      en: "That the Gentiles should be fellow heirs, and of the same body, and co-partners of his promise in Christ Jesus, by the gospel:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cuius factus sum minister secundum donum gratiae Dei quae data est mihi secundum operationem virtutis eius"
      en: "Of which I am made a minister, according to the gift of the grace of God, which is given to me according to the operation of his power:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "mihi omnium sanctorum minimo data est gratia haec in gentibus evangelizare ininvestigabiles divitias Christi"
      en: "To me, the least of all the saints, is given this grace, to preach among the Gentiles, the unsearchable riches of Christ,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et inluminare omnes quae sit dispensatio sacramenti absconditi a saeculis in Deo qui omnia creavit"
      en: "And to enlighten all men, that they may see what is the dispensation of the mystery which hath been hidden from eternity in God, who created all things:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut innotescat principibus et potestatibus in caelestibus per ecclesiam multiformis sapientia Dei"
      en: "That the manifold wisdom of God may be made known to the principalities and powers in heavenly places through the church,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "secundum praefinitionem saeculorum quam fecit in Christo Iesu Domino nostro"
      en: "According to the eternal purpose, which he made, in Christ Jesus our Lord:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in quo habemus fiduciam et accessum in confidentia per fidem eius"
      en: "In whom we have boldness and access with confidence by the faith of him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "propter quod peto ne deficiatis in tribulationibus meis pro vobis quae est gloria vestra"
      en: "Wherefore I pray you not to faint at my tribulations for you, which is your glory."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "huius rei gratia flecto genua mea ad Patrem Domini nostri Iesu Christi"
      en: "For this cause I bow my knees to the Father of our Lord Jesus Christ,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ex quo omnis paternitas in caelis et in terra nominatur"
      en: "Of whom all paternity in heaven and earth is named,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ut det vobis secundum divitias gloriae suae virtute corroborari per Spiritum eius in interiore homine"
      en: "That he would grant you, according to the riches of his glory, to be strengthened by his Spirit with might unto the inward man,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "habitare Christum per fidem in cordibus vestris in caritate radicati et fundati"
      en: "That Christ may dwell by faith in your hearts; that being rooted and founded in charity,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ut possitis conprehendere cum omnibus sanctis quae sit latitudo et longitudo et sublimitas et profundum"
      en: "You may be able to comprehend, with all the saints, what is the breadth, and length, and height, and depth:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "scire etiam supereminentem scientiae caritatem Christi ut impleamini in omnem plenitudinem Dei"
      en: "To know also the charity of Christ, which surpasseth all knowledge, that you may be filled unto all the fulness of God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ei autem qui potens est omnia facere superabundanter quam petimus aut intellegimus secundum virtutem quae operatur in nobis"
      en: "Now to him who is able to do all things more abundantly than we desire or understand, according to the power that worketh in us;"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ipsi gloria in ecclesia et in Christo Iesu in omnes generationes saeculi saeculorum amen"
      en: "To him be glory in the church, and in Christ Jesus unto all generations, world without end. Amen."
    status: { la: verified, en: verified }
