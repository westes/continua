# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: joan
chapter: 18
verses:
  - n: 1
    text:
      la: "haec cum dixisset Iesus egressus est cum discipulis suis trans torrentem Cedron ubi erat hortus in quem introivit ipse et discipuli eius"
      en: "When Jesus had said these things, he went forth with his disciples over the brook Cedron, where there was a garden, into which he entered with his disciples."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sciebat autem et Iudas qui tradebat eum ipsum locum quia frequenter Iesus convenerat illuc cum discipulis suis"
      en: "And Judas also, who betrayed him, knew the place; because Jesus had often resorted thither together with his disciples."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Iudas ergo cum accepisset cohortem et a pontificibus et Pharisaeis ministros venit illuc cum lanternis et facibus et armis"
      en: "Judas therefore having received a band of soldiers and servants from the chief priests and the Pharisees, cometh thither with lanterns and torches and weapons."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Iesus itaque sciens omnia quae ventura erant super eum processit et dicit eis quem quaeritis"
      en: "Jesus therefore, knowing all things that should come upon him, went forth, and said to them: Whom seek ye?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "responderunt ei Iesum Nazarenum dicit eis Iesus ego sum stabat autem et Iudas qui tradebat eum cum ipsis"
      en: "They answered him: Jesus of Nazareth. Jesus saith to them: I am he. And Judas also, who betrayed him, stood with them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut ergo dixit eis ego sum abierunt retrorsum et ceciderunt in terram"
      en: "As soon therefore as he had said to them: I am he; they went backward, and fell to the ground."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "iterum ergo eos interrogavit quem quaeritis illi autem dixerunt Iesum Nazarenum"
      en: "Again therefore he asked them: Whom seek ye? And they said, Jesus of Nazareth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "respondit Iesus dixi vobis quia ego sum si ergo me quaeritis sinite hos abire"
      en: "Jesus answered, I have told you that I am he. If therefore you seek me, let these go their way."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ut impleretur sermo quem dixit quia quos dedisti mihi non perdidi ex ipsis quemquam"
      en: "That the word might be fulfilled which he said: Of them whom thou hast given me, I have not lost any one."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Simon ergo Petrus habens gladium eduxit eum et percussit pontificis servum et abscidit eius auriculam dextram erat autem nomen servo Malchus"
      en: "Then Simon Peter, having a sword, drew it, and struck the servant of the high priest, and cut off his right ear. And the name of the servant was Malchus."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixit ergo Iesus Petro mitte gladium in vaginam calicem quem dedit mihi Pater non bibam illum"
      en: "Jesus therefore said to Peter: Put up thy sword into the scabbard. The chalice which my Father hath given me, shall I not drink it?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cohors ergo et tribunus et ministri Iudaeorum conprehenderunt Iesum et ligaverunt eum"
      en: "Then the band and the tribune, and the servants of the Jews, took Jesus, and bound him:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et adduxerunt eum ad Annam primum erat enim socer Caiaphae qui erat pontifex anni illius"
      en: "And they led him away to Annas first, for he was father in law to Caiphas, who was the high priest of that year."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "erat autem Caiaphas qui consilium dederat Iudaeis quia expedit unum hominem mori pro populo"
      en: "Now Caiphas was he who had given the counsel to the Jews: That it was expedient that one man should die for the people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sequebatur autem Iesum Simon Petrus et alius discipulus discipulus autem ille erat notus pontifici et introivit cum Iesu in atrium pontificis"
      en: "And Simon Peter followed Jesus, and so did another disciple. And that disciple was known to the high priest, and went in with Jesus into the court of the high priest."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Petrus autem stabat ad ostium foris exivit ergo discipulus alius qui erat notus pontifici et dixit ostiariae et introduxit Petrum"
      en: "But Peter stood at the door without. The other disciple therefore, who was known to the high priest, went out, and spoke to the portress, and brought in Peter."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dicit ergo Petro ancilla ostiaria numquid et tu ex discipulis es hominis istius dicit ille non sum"
      en: "The maid therefore that was portress, saith to Peter: Art not thou also one of this man's disciples? He saith: I am not."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "stabant autem servi et ministri ad prunas quia frigus erat et calefiebant erat autem cum eis et Petrus stans et calefaciens se"
      en: "Now the servants and ministers stood at a fire of coals, because it was cold, and warmed themselves. And with them was Peter also, standing, and warming himself."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "pontifex ergo interrogavit Iesum de discipulis suis et de doctrina eius"
      en: "The high priest therefore asked Jesus of his disciples, and of his doctrine."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "respondit ei Iesus ego palam locutus sum mundo ego semper docui in synagoga et in templo quo omnes Iudaei conveniunt et in occulto locutus sum nihil"
      en: "Jesus answered him: I have spoken openly to the world: I have always taught in the synagogue, and in the temple, whither all the Jews resort; and in secret I have spoken nothing."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quid me interrogas interroga eos qui audierunt quid locutus sum ipsis ecce hii sciunt quae dixerim ego"
      en: "Why asketh thou me? ask them who have heard what I have spoken unto them: behold they know what things I have said."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "haec autem cum dixisset unus adsistens ministrorum dedit alapam Iesu dicens sic respondes pontifici"
      en: "And when he had said these things, one of the servants standing by, gave Jesus a blow, saying: Answerest thou the high priest so?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "respondit ei Iesus si male locutus sum testimonium perhibe de malo si autem bene quid me caedis"
      en: "Jesus answered him: If I have spoken evil, give testimony of the evil; but if well, why strikest thou me?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et misit eum Annas ligatum ad Caiaphan pontificem"
      en: "And Annas sent him bound to Caiphas the high priest."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "erat autem Simon Petrus stans et calefaciens se dixerunt ergo ei numquid et tu ex discipulis eius es negavit ille et dixit non sum"
      en: "And Simon Peter was standing, and warming himself. They said therefore to him: Art not thou also one of his disciples? He denied it, and said: I am not."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dicit unus ex servis pontificis cognatus eius cuius abscidit Petrus auriculam nonne ego te vidi in horto cum illo"
      en: "One of the servants of the high priest (a kinsman to him whose ear Peter cut off) saith to him: Did I not see thee in the garden with him?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "iterum ergo negavit Petrus et statim gallus cantavit"
      en: "Again therefore Peter denied; and immediately the cock crew."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "adducunt ergo Iesum a Caiapha in praetorium erat autem mane et ipsi non introierunt in praetorium ut non contaminarentur sed manducarent pascha"
      en: "Then they led Jesus from Caiphas to the governor's hall. And it was morning; and they went not into the hall, that they might not be defiled, but that they might eat the pasch."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "exivit ergo Pilatus ad eos foras et dixit quam accusationem adfertis adversus hominem hunc"
      en: "Pilate therefore went out to them, and said: What accusation bring you against this man?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "responderunt et dixerunt ei si non esset hic malefactor non tibi tradidissemus eum"
      en: "They answered, and said to him: If he were not a malefactor, we would not have delivered him up to thee."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "dixit ergo eis Pilatus accipite eum vos et secundum legem vestram iudicate eum dixerunt ergo ei Iudaei nobis non licet interficere quemquam"
      en: "Pilate therefore said to them: Take him you, and judge him according to your law. The Jews therefore said to him: It is not lawful for us to put any man to death;"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ut sermo Iesu impleretur quem dixit significans qua esset morte moriturus"
      en: "That the word of Jesus might be fulfilled, which he said, signifying what death he should die."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "introivit ergo iterum in praetorium Pilatus et vocavit Iesum et dixit ei tu es rex Iudaeorum"
      en: "Pilate therefore went into the hall again, and called Jesus, and said to him: Art thou the king of the Jews?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et respondit Iesus a temet ipso hoc dicis an alii tibi dixerunt de me"
      en: "Jesus answered: Sayest thou this thing of thyself, or have others told it thee of me?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "respondit Pilatus numquid ego Iudaeus sum gens tua et pontifices tradiderunt te mihi quid fecisti"
      en: "Pilate answered: Am I a Jew? Thy own nation, and the chief priests, have delivered thee up to me: what hast thou done?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "respondit Iesus regnum meum non est de mundo hoc si ex hoc mundo esset regnum meum ministri mei decertarent ut non traderer Iudaeis nunc autem meum regnum non est hinc"
      en: "Jesus answered: My kingdom is not of this world. If my kingdom were of this world, my servants would certainly strive that I should not be delivered to the Jews: but now my kingdom is not from hence."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "dixit itaque ei Pilatus ergo rex es tu respondit Iesus tu dicis quia rex sum ego ego in hoc natus sum et ad hoc veni in mundum ut testimonium perhibeam veritati omnis qui est ex veritate audit meam vocem"
      en: "Pilate therefore said to him: Art thou a king then? Jesus answered: Thou sayest that I am a king. For this was I born, and for this came I into the world; that I should give testimony to the truth. Every one that is of the truth, heareth my voice."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "dicit ei Pilatus quid est veritas et cum hoc dixisset iterum exivit ad Iudaeos et dicit eis ego nullam invenio in eo causam"
      en: "Pilate saith to him: What is truth? And when he said this, he went out again to the Jews, and saith to them: I find no cause in him."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "est autem consuetudo vobis ut unum dimittam vobis in pascha vultis ergo dimittam vobis regem Iudaeorum"
      en: "But you have a custom that I should release one unto you at the pasch: will you, therefore, that I release unto you the king of the Jews?"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "clamaverunt rursum omnes dicentes non hunc sed Barabban erat autem Barabbas latro"
      en: "Then cried they all again, saying: Not this man, but Barabbas. Now Barabbas was a robber."
    status: { la: verified, en: verified }
