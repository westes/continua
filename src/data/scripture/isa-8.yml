# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 8
verses:
  - n: 1
    text:
      la: "et dixit Dominus ad me sume tibi librum grandem et scribe in eo stilo hominis Velociter spolia detrahe Cito praedare"
      en: "And the Lord said to me: Take thee a great book, and write in it with a man's pen. Take sway the spoils with speed, quickly take the prey."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et adhibui mihi testes fideles Uriam sacerdotem et Zacchariam filium Barachiae"
      en: "And I took unto me faithful witnesses, Urias the priest, and Zacharias the son of Barachias."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et accessi ad prophetissam et concepit et peperit filium et dixit Dominus ad me voca nomen eius Adcelera spolia detrahere Festina praedari"
      en: "And I went to the prophetess, and she conceived, and bore a son. And the Lord said to me: Call his name, Hasten to take away the spoils: Make haste to take away the prey."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia antequam sciat puer vocare patrem suum et matrem suam auferetur fortitudo Damasci et spolia Samariae coram rege Assyriorum"
      en: "For before the child know to call his father and his mother, the strength of Damascus, and the spoils of Samaria shall be taken away before the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et adiecit Dominus loqui ad me adhuc dicens"
      en: "And the Lord spoke to me again, saying:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "pro eo quod abiecit populus iste aquas Siloae quae vadunt cum silentio et adsumpsit magis Rasin et filium Romeliae"
      en: "Forasmuch as this people hath cast away the waters of Siloe, that go with silence, and hath rather taken Basin, and the son of Romelia:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "propter hoc ecce Dominus adducet super eos aquas Fluminis fortes et multas regem Assyriorum et omnem gloriam eius et ascendet super omnes rivos eius et fluet super universas ripas eius"
      en: "Therefore behold the Lord will bring upon them the waters of the river strong and many, the king of the Assyrians, and all his glory: and he shall come up over all his channels, and shall overflow all his banks,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ibit per Iudam inundans et transiens usque ad collum veniet et erit extensio alarum eius implens latitudinem terrae tuae o Emmanuhel"
      en: "And shall pass through Juda, overflowing, and going over shall reach even to the neck. And the stretching out of his wings shall fill the breadth of thy land, O Emmanuel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "congregamini populi et vincimini et audite universae procul terrae confortamini et vincimini accingite vos et vincimini"
      en: "Gather yourselves together, O ye people, and be overcome, and give ear, all ye lands afar off: strengthen yourselves, end be overcome, gird yourselves, and be overcome."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "inite consilium et dissipabitur loquimini verbum et non fiet quia nobiscum Deus"
      en: "Take counsel together, and it shall be defeated: speak a word, and it shall not be done: because God is with us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "haec enim ait Dominus ad me sicut in forti manu erudivit me ne irem in via populi huius dicens"
      en: "For thus saith the Lord to me: As he hath taught me, with a strong arm, that I should not walk in the way of this people, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non dicatis coniuratio omnia enim quae loquitur populus iste coniuratio est et timorem eius ne timeatis neque paveatis"
      en: "Say ye not: A conspiracy: for all that this people speaketh, is a conspiracy: neither fear ye their fear, nor be afraid."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dominum exercituum ipsum sanctificate ipse pavor vester et ipse terror vester"
      en: "Sanctify the Lord of hosts himself: and let him be your fear, and let him be your dread."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et erit vobis in sanctificationem in lapidem autem offensionis et in petram scandali duabus domibus Israhel in laqueum et in ruinam habitantibus Hierusalem"
      en: "And he shall be a sanctification to you. But for a stone or stumbling, and for a rock of offence to the two houses of Israel, for a snare and a ruin to the inhabitants of Jerusalem."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et offendent ex eis plurimi et cadent et conterentur et inretientur et capientur"
      en: "And very many of them shall stumble and fall, and shall be broken in pieces, and shall be snared, and taken."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "liga testimonium signa legem in discipulis meis"
      en: "Bind up the testimony, seal the law among my disciples."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et expectabo Dominum qui abscondit faciem suam a domo Iacob et praestolabor eum"
      en: "And I will wait for the Lord, who hath hid his face from the house of Jacob, and I will look for him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ecce ego et pueri quos mihi dedit Dominus in signum et in portentum Israhelis a Domino exercituum qui habitat in monte Sion"
      en: "Behold I and my children, whom the Lord hath given me for a sign, and for a wonder in Israel from the Lord of hosts, who dwelleth in mount Sion."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et cum dixerint ad vos quaerite a pythonibus et a divinis qui stridunt in incantationibus suis numquid non populus a Deo suo requirit pro vivis a mortuis"
      en: "And when they shall say to you: Seek of pythons, and of diviners, who mutter in their enchantments: should not the people seek of their God, for the living of the dead?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ad legem magis et ad testimonium quod si non dixerint iuxta verbum hoc non erit eis matutina lux"
      en: "To the law rather, and to the testimony. And if they speak not according to this word, they shall not have the morning light."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et transibit per eam corruet et esuriet et cum esurierit irascetur et maledicet regi suo et Deo suo et suspiciet sursum"
      en: "And they shall pass by it, they shall fall, and be hungry: and when they shall be hungry, they will be angry, and curse their king, and their God, and look upwards."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ad terram intuebitur et ecce tribulatio et tenebrae dissolutio angustia et caligo persequens et non poterit avolare de angustia sua"
      en: "And they shall look to the earth, and behold trouble and darkness, weakness and distress, and a mist following them, and they cannot fly away from their distress."
    status: { la: verified, en: verified }
