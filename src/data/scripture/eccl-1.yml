# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: eccl
chapter: 1
verses:
  - n: 1
    text:
      la: "Verba Ecclesiastae, filii David, regis Jerusalem."
      en: "The words of Ecclesiastes, the son of David, king of Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Vanitas vanitatum, dixit Ecclesiastes; vanitas vanitatum, et omnia vanitas."
      en: "Vanity of vanities, said Ecclesiastes vanity of vanities, and all is vanity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quid habet amplius homo de universo labore suo quo laborat sub sole?"
      en: "What hath a man more of all his labour, that he taketh under the sun?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Generatio praeterit, et generatio advenit; terra autem in aeternum stat."
      en: "One generation passeth away, and another generation cometh: but the earth standeth for ever."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Oritur sol et occidit, et ad locum suum revertitur; ibique renascens,"
      en: "The sun riseth, and goeth down, and returneth to his place: and there rising again,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "gyrat per meridiem, et flectitur ad aquilonem. Lustrans universa in circuitu pergit spiritus, et in circulos suos revertitur."
      en: "Maketh his round by the south, and turneth again to the north: the spirit goeth forward surveying all places round about, and returneth to his circuits."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Omnia flumina intrant in mare, et mare non redundat; ad locum unde exeunt flumina revertuntur ut iterum fluant."
      en: "All the rivers run into the sea, yet the sea doth not overflow: unto the place from whence the rivers come, they return, to flow again."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cunctae res difficiles; non potest eas homo explicare sermone. Non saturatur oculus visu, nec auris auditu impletur."
      en: "All things are hard: man cannot explain them by word. The eye is not filled with seeing, neither is the ear filled with hearing."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quid est quod fuit? Ipsum quod futurum est. Quid est quod factum est? Ipsum quod faciendum est."
      en: "What is it that hath been? the same thing that shall be. What is it that hath been done? the same that shall be done."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nihil sub sole novum, nec valet quisquam dicere: Ecce hoc recens est: jam enim praecessit in saeculis quae fuerunt ante nos."
      en: "Nothing under the sun is new, neither is any man able to say: Behold this is new: for it hath already gone before in the ages that were before us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Non est priorum memoria; sed nec eorum quidem quae postea futura sunt erit recordatio apud eos qui futuri sunt in novissimo."
      en: "There is no remembrance of former things: nor indeed of those things which hereafter are to come, shall there be any remembrance with them that shall be in the latter end."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ego Ecclesiastes fui rex Israel in Jerusalem;"
      en: "I Ecclesiastes was king over Israel in Jerusalem,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et proposui in animo meo quaerere et investigare sapienter de omnibus quae fiunt sub sole. Hanc occupationem pessimam dedit Deus filiis hominum, ut occuparentur in ea."
      en: "And I proposed in my mind to seek and search out wisely concerning all things that are done under the sun. This painful occupation hath God given to the children of men, to be exercised therein."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Vidi cuncta quae fiunt sub sole, et ecce universa vanitas et afflictio spiritus."
      en: "I have seen all things that are done under the sun, and behold all is vanity, and vexation of spirit."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Perversi difficile corriguntur, et stultorum infinitus est numerus."
      en: "The perverse are hard to be corrected, and the number of fools is infinite."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Locutus sum in corde meo, dicens: Ecce magnus effectus sum, et praecessi omnes sapientia qui fuerunt ante me in Jerusalem; et mens mea contemplata est multa sapienter, et didici."
      en: "I have spoken in my heart, saying: Behold I am become great, and have gone beyond all in wisdom, that were before me in Jerusalem: and my mind hath contemplated many things wisely, and I have learned."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dedique cor meum ut scirem prudentiam atque doctrinam, erroresque et stultitiam; et agnovi quod in his quoque esset labor et afflictio spiritus:"
      en: "And I have given my heart to know prudence, and learning, and errors, and folly: and I have perceived that in these also there was labour, and vexation of spirit,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "eo quod in multa sapientia multa sit indignatio; et qui addit scientiam, addit et laborem."
      en: "Because In much wisdom there is much indignation: and he that addeth knowledge, addeth also labour."
    status: { la: verified, en: verified }
