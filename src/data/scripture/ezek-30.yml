book: ezek
chapter: 30
verses:
  - n: 1
    text:
      la: "et factum est verbum Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fili hominis propheta et dic haec dicit Dominus Deus ululate vae vae diei"
      en: "Son of man prophesy, and say: Thus saith the Lord God: Howl ye, Woe, woe to the day:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia iuxta est dies et adpropinquavit dies Domini dies nubis tempus gentium erit"
      en: "For the day is near, yea the day of the Lord is near: a cloudy day, it shall be the time of the nations."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et veniet gladius in Aegyptum et erit pavor in Aethiopia cum ceciderint vulnerati in Aegypto et ablata fuerit multitudo illius et destructa fundamenta eius"
      en: "And the sword shall come upon Egypt: and there shall be dread in Ethiopia, when the wounded shall fall in Egypt, and the multitude thereof shall be taken away, and the foundations thereof shall be destroyed."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Aethiopia et Lybia et Lydii et omne reliquum vulgus et Chub et filii terrae foederis cum eis gladio cadent"
      en: "Ethiopia, and Libya, and Lydia, and all the rest of the crowd, and Chub, and the children of the land of the covenant, shall fall with them by the sword."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "haec dicit Dominus Deus et corruent fulcientes Aegyptum et destruetur superbia imperii eius a turre Syenes gladio cadent in ea ait Dominus exercituum"
      en: "Thus saith the Lord God: They also that uphold Egypt shall fall, and the pride of her empire shall be brought down: from the tower of Syene shall they fall in it by the sword, saith the Lord the God of hosts."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dissipabuntur in medio terrarum desolatarum et urbes eius in medio civitatum desertarum erunt"
      en: "And they shall be desolate in the midst of the lands that are desolate, and the cities thereof shall be in the midst of the cities that are wasted."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et scient quoniam ego Dominus cum dedero ignem in Aegyptum et adtriti fuerint omnes auxiliatores eius"
      en: "And they shall know that I am the Lord: when I shall have set a fire in Egypt, and all the helpers thereof shall be destroyed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in die illa egredientur nuntii a facie mea in trieribus ad conterendam Aethiopiae confidentiam et erit pavor in eis in die Aegypti quia absque dubio veniet"
      en: "In that day shall messengers go forth from my face in ships to destroy the confidence of Ethiopia, and there shall be dread among them in the day of Egypt: because it shall certainly come."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "haec dicit Dominus Deus et cessare faciam multitudinem Aegypti in manu Nabuchodonosor regis Babylonis"
      en: "Thus saith the Lord God : I will make the multitude of Egypt to cease by the hand of Nabuchodonosor the king of Babylon."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ipse et populus eius cum eo fortissimi gentium adducentur ad disperdendam terram et evaginabunt gladios suos super Aegyptum et implebunt terram interfectis"
      en: "He and his people with him, the strongest of nations, shall be brought to destroy the land: and they shall draw their swords upon Egypt: and shall fill the land with the slain."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et faciam alveos fluminum aridos et tradam terram in manu pessimorum et dissipabo terram et plenitudinem eius in manu alienorum ego Dominus locutus sum"
      en: "And I will make the channels of the rivers dry, and will deliver the land into the hand of the wicked: and will lay waste the land and all that is therein by the hands of strangers, I the Lord have spoken it."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "haec dicit Dominus Deus et disperdam simulacra et cessare faciam idola de Memphis et dux de terra Aegypti non erit amplius et dabo terrorem in terra Aegypti"
      en: "Thus saith the Lord God: I will also destroy the idols, and I will make an end of the idols of Memphis: and there shall be no more a prince of the land of Egypt: and I will cause a terror in the land of Egypt."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et disperdam terram Fatures et dabo ignem in Tafnis et faciam iudicia in Alexandriam"
      en: "And I will destroy the land of Phatures, and will make a fire in Taphnis, and will execute judgments in Alexandria."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et effundam indignationem meam super Pelusium robur Aegypti et interficiam multitudinem Alexandriae"
      en: "And I will pour out my indignation upon Pelusium the strength of Egypt, and will cut off the multitude of Alexandria."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dabo ignem in Aegypto quasi parturiens dolebit Pelusium et Alexandria erit dissipata et in Memphis angustiae cotidianae"
      en: "And I will make a fire in Egypt: Pelusium shall be in pain like a woman in labour, and Alexandria shall be laid waste, and in Memphis there shall be daily distresses."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "iuvenes Eliupoleos et Bubasti gladio cadent et ipsae captivae ducentur"
      en: "The young men of Heliopolis, and of Bubastus shall fall by the sword, and they themselves shall go into captivity."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et in Tafnis nigrescet dies cum contrivero ibi sceptra Aegypti et defecerit in ea superbia potentiae eius ipsam nubes operiet filiae autem eius in captivitatem ducentur"
      en: "And in Taphnis the day shall be darkened, when I shall break there the sceptres of Egypt, and the pride of her power shall cease in her: a cloud shall cover her, and her daughters shall be led into captivity."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et faciam iudicia in Aegypto et scient quia ego Dominus"
      en: "And I will execute judgments in Egypt: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et factum est in undecimo anno in primo in septima mensis factum est verbum Domini ad me dicens"
      en: "And it came to pass in the eleventh year, in the first month, in the seventh day of the month, that the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "fili hominis brachium Pharao regis Aegypti confregi et ecce non est obvolutum ut restitueretur ei sanitas ut ligaretur pannis et farciretur linteolis et recepto robore posset tenere gladium"
      en: "Son of man, I have broken the arm of Pharao king of Egypt: and behold it is not bound up, to be healed, to be tied up with clothes, and swathed with linen, that it might recover strength, and hold the sword."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "propterea haec dicit Dominus Deus ecce ego ad Pharao regem Aegypti et comminuam brachium eius forte sed confractum et deiciam gladium de manu eius"
      en: "Therefore, thus saith the Lord God: Behold, I come against Pharao king of Egypt, and I will break into pieces his strong arm, which is already broken: and I will cause the sword to fall out of his hand:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et dispergam Aegyptum in gentibus et ventilabo eos in terris"
      en: "And I will disperse Egypt among the nations, and scatter them through the countries."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et confortabo brachia regis Babylonis daboque gladium meum in manu eius et confringam brachia Pharaonis et gement gemitibus interfecti coram facie eius"
      en: "And I will strengthen the arms of the king of Babylon, and will put my sword in his hand: and I will break the arms of Pharao, and they shall groan bitterly being slain before his face."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et confortabo brachia regis Babylonis et brachia Pharaonis concident et scient quia ego Dominus cum dedero gladium meum in manu regis Babylonis et extenderit eum super terram Aegypti"
      en: "And I will strengthen the arms of the king of Babylon, and the arms of Pharao shall fall: and they shall know that I am the Lord, when I shall have given my sword into the hand of the king of Babylon, and he shall have stretched it forth upon the land of Egypt."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et dispergam Aegyptum in nationes et ventilabo eos in terris et scient quia ego Dominus"
      en: "And I will disperse Egypt among the nations, and will scatter them through the countries, and they shall know that I am the Lord."
    status: { la: verified, en: verified }
