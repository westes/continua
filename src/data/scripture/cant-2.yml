# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: cant
chapter: 2
verses:
  - n: 1
    text:
      la: "Ego flos campi, et lilium convallium."
      en: "I am the flower of the field, and the lily of the valleys."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "SPONSUS. Sicut lilium inter spinas, sic amica mea inter filias."
      en: "As the lily among thorns, so is my love among the daughters."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "SPONSA. Sicut malus inter ligna silvarum, sic dilectus meus inter filios. Sub umbra illius quem desideraveram sedi, et fructus ejus dulcis gutturi meo."
      en: "As the apple tree among the trees of the woods, so is my beloved among the sons. I sat down under his shadow, whom I desired: and his fruit was sweet to my palate."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Introduxit me in cellam vinariam; ordinavit in me caritatem."
      en: "He brought me into the cellar of wine, he set in order charity in me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Fulcite in me floribus, stipate me malis, quia amore langueo."
      en: "Stay me up with flowers, compass me about with apples: because I languish with love."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Laeva ejus sub capite meo, et dextera illius amplexabitur me."
      en: "His left hand is under my head, and his right hand shall embrace me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "SPONSUS. Adjuro vos, filiae Jerusalem, per capreas cervosque camporum, ne suscitetis, neque evigilare faciatis dilectam, quoadusque ipsa velit."
      en: "I adjure you, O ye daughters of Jerusalem, by the roes, and the harts of the, fields, that you stir not up, nor make the beloved to awake, till she please."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "SPONSA. Vox dilecti mei; ecce iste venit, saliens in montibus, transiliens colles."
      en: "The voice of my beloved, behold he cometh leaping upon the mountains, skipping over the hills."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Similis est dilectus meus capreae, hinnuloque cervorum. En ipse stat post parietem nostrum, respiciens per fenestras, prospiciens per cancellos."
      en: "My beloved is like a roe, or a young hart. Behold he standeth behind our wall, looking through the windows, looking through the lattices."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "En dilectus meus loquitur mihi. SPONSUS. Surge, propera, amica mea, columba mea, formosa mea, et veni:"
      en: "Behold my beloved speaketh to me: Arise, make haste, my love, my dove, my beautiful one, and come."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "jam enim hiems transiit; imber abiit, et recessit."
      en: "For winter is now past, the rain is over and gone."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Flores apparuerunt in terra nostra; tempus putationis advenit: vox turturis audita est in terra nostra;"
      en: "The flowers have appeared in our land, the time of pruning is come: the voice of the turtle is heard in our land:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ficus protulit grossos suos; vineae florentes dederunt odorem suum. Surge, amica mea, speciosa mea, et veni:"
      en: "The fig tree hath put forth her green figs: the vines in flower yield their sweet smell. Arise, my love, my beautiful one, and come:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "columba mea, in foraminibus petrae, in caverna maceriae, ostende mihi faciem tuam, sonet vox tua in auribus meis: vox enim tua dulcis, et facies tua decora."
      en: "My dove in the clefts of the rock, in the hollow places of the wall, shew me thy face, let thy voice sound in my ears: for thy voice is sweet, and thy face comely."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "SPONSA. Capite nobis vulpes parvulas quae demoliuntur vineas: nam vinea nostra floruit."
      en: "Catch us the little foxes that destroy the vines: for our vineyard hath flourished."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dilectus meus mihi, et ego illi, qui pascitur inter lilia,"
      en: "My beloved to me, and I to him who feedeth among the lilies,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "donec aspiret dies, et inclinentur umbrae. Revertere; similis esto, dilecte mi, capreae, hinnuloque cervorum super montes Bether."
      en: "Till the day break, and the shadows retire. Return: be like, my beloved, to a roe, or to a young hart upon the mountains of Bether."
    status: { la: verified, en: verified }
