# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1mach
chapter: 14
verses:
  - n: 1
    text:
      la: "anno centesimo septuagesimo secundo et congregavit rex Demetrius exercitus suos et abiit Mediam ad contrahenda sibi auxilia et expugnare Tryfonem"
      en: "In the year one hundred and seventy-two, king Demetrius assembled has army, and went into Media to get him succours to fight against Tryphon."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et audivit Arsaces rex Persidis et Mediae quia intravit Demetrius confines suos et misit unum de principibus suis ut conprehenderent eum vivum et adducerent eum ad se"
      en: "And Arsaces the king of Persia and Media heard that Demetrius was entered within his borders, and he sent one of his princes to take him alive, and bring him to him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et abiit et percussit castra Demetrii et conprehendit eum et duxit eum ad Arsacen et posuit eum in custodiam"
      en: "And he went and defeated the army of Demetrius: and took him, and brought him to Arsaces, and he put him into custody."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et siluit terra Iuda omnibus diebus Simonis et quaesivit bona genti suae et placuit illis potestas eius et gloria eius omnibus diebus"
      en: "And all the land of Juda was at rest all the days of Simon, and he sought the good of his nation: and his power, and his glory pleased them well all his days."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et cum omni gloria sua accepit Ioppen in portum et fecit introitum in insulis maris"
      en: "And with all his glory he took Joppe for a haven, and made an entrance to the isles of the sea."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et dilatavit fines gentis suae et obtinuit regionem"
      en: "And he enlarged the bounds of his nation, and made himself master of the country."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et congregavit captivitatem multam et dominatus est Gazarae et Bethsurae et arci et abstulit inmunditias ex ea et non erat qui resisteret ei"
      en: "And he gathered together a great number of captives, and had the dominion of Gazara, and of Bethsura, and of the castle: and took away all uncleanness out of it and there was none that resisted him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et unusquisque colebat terram suam cum pace et terra dabat fructus suos et ligna camporum fructum suum"
      en: "And every man tilled his land with peace: and the land of Juda yielded her increase, and the trees of the fields their fruit."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "seniores in plateis sedebant omnes et de bonis terrae tractabant et iuvenes induebant se gloriam et stolas belli"
      en: "The ancient men sat all in the streets, and treated together of the good things of the land, and the young men put on them glory, and the robes of war."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "civitatibus tribuebat alimonias et constituebat eas ut essent vasa munitionis quoadusque nominatum est nomen gloriae eius usque ad extremum terrae"
      en: "And he provided victuals for the cities, and he appointed that they should be furnished with ammunition, so that the fame of his glory was renowned even to the end of the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "fecit pacem super terram et laetatus est Israhel laetitia magna"
      en: "He made peace in the land, and Israel rejoiced with great joy."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et sedit unusquisque sub vite sua et sub ficulnea nec erat qui eos terreret"
      en: "And every man sat under his vine, and under his fig tree: and there was none to make them afraid."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "defecit inpugnans eos super terram reges contriti sunt in diebus illis"
      en: "There was none left in the land to fight against them: kings were discomfited in those days."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et confirmavit omnes humiles populi sui et legem exquisivit et abstulit omnem iniquum et malum"
      en: "And he strengthened all those of his people that were brought low, and he sought the law, and took away every unjust and wicked man."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sancta glorificavit et multiplicavit vasa sanctorum"
      en: "He glorified the sanctuary, and multiplied the vessels of the holy places."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et auditum est Romae quia defunctus est Ionathas et usque in Sparta et contristati sunt valde"
      en: "And it was heard at Rome, and as far as Sparta, that Jonathan was dead: and they were very sorry."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut audierunt autem quod Simon frater eius factus esset summus sacerdos loco eius et ipse obtineret regionem et civitates in ea"
      en: "But when they heard that Simon his brother was made high priest in his place, and was possessed of all the country, and the cities therein:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "scripserunt ad eum tabulis aereis ut renovaret amicitias et societatem quam fecerunt cum Iuda et Ionatha fratribus eius"
      en: "They wrote to him in tables of brass, to renew the friendship and alliance which they had made with Judas, and with Jonathan his brethren."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et lectae sunt in conspectu ecclesiae in Hierusalem et hoc exemplum epistularum quas miserunt Spartiatae"
      en: "And they were read before the assembly in Jerusalem. And this is the copy of the letters that the Spartans sent."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Spartianorum princeps et civitatis Simoni sacerdoti magno et senioribus et sacerdotibus et reliquo populo Iudaeorum fratribus salutem"
      en: "The princes and the cities of the Spartans to Simon the high priest, and to the ancients, and the priests, and the rest of the people of the Jews their brethren, greeting."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "legati qui missi sunt ad populum nostrum nuntiaverunt nobis de vestra gloria et honore ac laetitia et gavisi sumus in introitu eorum"
      en: "The ambassadors that were sent to our people, have told us of your glory, and honour, and joy: and we rejoice at their coming."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et scripsimus quae ab ipsis erant dicta in conciliis populi sic Numenius Antiochi et Antipater Iasonis filius legati Iudaeorum venerunt ad nos renovantes nobiscum amicitiam"
      en: "And we registered what was said by them in the councils of the people in this manner: Numenius the son of Antiochus, and Antipater the son of Jason, ambassadors of the Jews, came to us to renew the former friendship with us."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et placuit populo excipere viros gloriose et ponere exemplum sermonum eorum in segregatis populi libris ut sit ad memoriam populo Spartiarum exemplum autem horum scripsimus Simoni magno sacerdoti"
      en: "And it pleased the people to receive the men honourably, and to put a copy of their words in the public records, to be a memorial to the people of the Spartans. And we have written a copy of them to Simon the high priest."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "post haec autem misit Simon Numenium Romam habentem clypeum aureum magnum pondus minarum mille ad statuendam cum eis societatem cum audisset autem populus romanus"
      en: "And after this Simon sent Numenius to Rome, with a great shield of gold the weight of a thousand pounds, to confirm the league with them. And when the people of Rome had heard"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sermones istos dixerunt quam gratiarum actionem reddemus Simoni et filiis eius"
      en: "These words, they said: What thanks shall we give to Simon, and his sons?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "restituit enim ipse fratres suos et expugnavit inimicos Israhel et statuerunt ei libertatem et descripserunt in tabulis aereis et posuerunt in titulis in montem Sion"
      en: "For he hath restored his brethren, and hath driven away in fight the enemies of Israel from them: and they decreed him liberty, and registered it in tables of brass, and set it upon pillars in mount Sion."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "octava decima die mensis elul anno centesimo septuagesimo secundo anno tertio sub Simone sacerdote magno in Asaramel"
      en: "And this is a copy of the writing: The eighteenth day of the month Elul, in the year one hundred and seventy-two, being the third year under Simon the high priest at Asaramel,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "in conventu magno sacerdotum et populi et principum gentis et seniorum regis nota facta sunt haec quoniam frequenter facta sunt proelia in regione nostra"
      en: "In a great assembly of the priests, and of the people, and the princes of the nation, and the ancients of the country, these things were notified: Forasmuch as there have often been wars in our country,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Simon autem Matthathiae filius ex filiis Iarib et fratres eius dederunt se periculo et restiterunt adversariis gentis suae ut starent sancta ipsorum et lex et gloria magna glorificaverunt gentem suam"
      en: "And Simon the son of Mathathias of the children of Jarib, and his brethren have put themselves in danger, and have resisted the enemies of their nation, for the maintenance of their holy places, and the law: and have raised their nation to great glory."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et congregavit Ionathas gentem suam et factus est illis sacerdos magnus et adpositus est ad populum suum"
      en: "And Jonathan gathered together his nation, and was made their high priest, and he was laid to his people."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et voluerunt inimici eorum calcare et adterere regionem ipsorum et extendere manus in sancta eorum"
      en: "And their enemies desired to tread down and destroy their country, and to stretch forth their hands against their holy places."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "tunc restitit Simon et pugnavit pro gente sua et erogavit multas pecunias et armavit viros virtutis gentis suae et dedit eis stipendia"
      en: "Then Simon resisted and fought for his nation, and laid out much of his money, and armed the valiant men of his nation, and gave them wages:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et munivit civitates Iudaeae et Bethsuram quae erat in finibus Iudaeae ubi erant arma hostium antea et posuit illic praesidium viros iudaeos"
      en: "And he fortified the cities of Judea, and Bethsura that lieth in the borders of Judea, where the armour of the enemies was before: and he placed there a garrison of Jews."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et Ioppen munivit quae erat ad mare et Gazaram quae est in finibus Azoti in qua hostes antea habitabant et conlocavit illic Iudaeos et quaecumque apta erant ad correptionem eorum posuit in eis"
      en: "And he fortified Joppe which lieth by the sea: and Gazara, which bordereth upon Azotus, wherein the enemies dwelt before, and he placed Jews here: and furnished them with all things convenient for their reparation."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et vidit populus actum Simonis et gloriam quam cogitabat facere genti suae et posuerunt ducem suum et principem sacerdotum eo quod ipse fecerat haec omnia et iustitiam et fidem quam conservavit genti suae et exquisivit omni modo exaltare populum suum"
      en: "And the people seeing the acts of Simon, and to what glory he meant to bring his nation, made him their prince, and high priest, because he had done all these things, and for the justice, and faith, which he kept to his nation, and for that he sought by all means to advance his people."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et in diebus eius prosperatum est in manibus eius ut tollerentur gentes de regione ipsorum qui in civitate David erant in Hierusalem in arce de qua procedebant et contaminabant omnia quae in circuitu sanctorum sunt et inferebant plagam magnam castitati"
      en: "And in his days things prospered in his hands, so that the heathens were taken away out of their country, and they also that were in the city of David in Jerusalem in the castle, out of which they issued forth, and profaned all places round about the sanctuary, and did much evil to its purity."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et conlocavit in ea viros iudaeos tutamentum regionis et civitatis et exaltavit muros Hierusalem"
      en: "And he placed therein Jews for the defence of the country, and of the city, and he raised up the walls of Jerusalem."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et rex Demetrius statuit illi summum sacerdotium"
      en: "And king Demetrius confirmed him in the high priesthood."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "secundum haec fecit eum amicum suum et glorificavit eum gloria magna"
      en: "According to these things he made him his friend, and glorified him with great glory."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "audivit enim quod appellati sunt Iudaei a Romanis amici et socii et fratres et quia susceperunt legatos Simonis gloriose"
      en: "For he had heard that the Romans had called the Jews their friends, and confederates, and brethren, and that they had received Simon's ambassadors with honour:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et quia Iudaei et sacerdotes eorum consenserunt esse eum ducem suum et summum sacerdotem in aeternum donec surgat propheta fidelis"
      en: "And that the Jews, and their priests, had consented that he should be their prince, and high priest for ever, till there should arise a faithful prophet:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et ut sit super eos dux et ut cura esset illi pro sanctis et ut constitueret praepositos super opera eorum et super regionem et super arma et super praesidia"
      en: "And that he should be chief over them, and that he should have the charge of the sanctuary, and that he should appoint rulers over their works, and over the country, and over the armour, and over the strong holds."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et cura sit illi de sanctis et ut audiatur ab omnibus et ut scribantur in nomine eius omnes conscriptiones in regione et ut operiatur purpura et auro"
      en: "And that he should have care of the holy places: and that he should be obeyed by all, and that all the writings in the country should be made in his name: and that he should be clothed with purple, and gold:"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et ne liceat ulli ex populo et ex sacerdotibus irritum facere aliquid horum et contradicere his quae ab eo dicuntur aut convocare conventum in regione sine ipso et vestiri purpura et uti fibula aurea"
      en: "And that it should not be lawful for any of the people, or of the priests, to disannul any of these things, or to gainsay his words, or to call together an assembly in the country without him: or to be clothed with purple, or to wear a buckle of gold:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "qui autem fecerit extra haec aut irritum fecerit aliquid horum reus erit"
      en: "And whosoever shall do otherwise, or shall make void any of these things shall be punished."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et conplacuit omni populo statuere Simonem et facere secundum verba ista"
      en: "And it pleased all the people to establish Simon, and to do according to these words."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et suscepit Simon et placuit ut summo sacerdotio fungeretur et esset dux et princeps gentis Iudaeorum et sacerdotum et praeesset omnibus"
      en: "And Simon accepted thereof, and was well pleased to execute the office of the high priesthood, and to be captain, and prince of the nation of the Jews, and of the priests, and to be chief over all."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et scripturam istam dixerunt ponere in tabulis aereis et ponere eas in peribolo sanctorum in loco celebri"
      en: "And they commanded that this writing should be put in tables of brass, and that they should be set up within the compass of the sanctuary, in a conspicuous place:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "exemplum autem eorum ponere in aerario ut habeat Simon et filii eius"
      en: "And that a copy thereof should be put in the treasury, that Simon and his sons may have it."
    status: { la: verified, en: verified }
