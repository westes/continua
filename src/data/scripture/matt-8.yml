# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 8
verses:
  - n: 1
    text:
      la: "Cum autem descendisset de monte, secutae sunt eum turbae multae:"
      en: "And when he was come down from the mountain, great multitudes followed him:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ecce leprosus veniens, adorabat eum, dicens: Domine, si vis, potes me mundare."
      en: "And behold a leper came and adored him, saying: Lord, if thou wilt, thou canst make me clean."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et extendens Jesus manum, tetigit eum, dicens: Volo. Mundare. Et confestim mundata est lepra ejus."
      en: "And Jesus stretching forth his hand, touched him, saying: I will, be thou made clean. And forthwith his leprosy was cleansed."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et ait illi Jesus: Vide, nemini dixeris: sed vade, ostende te sacerdoti, et offer munus, quod praecepit Moyses, in testimonium illis."
      en: "And Jesus saith to him: See thou tell no man: but go, shew thyself to the priest, and offer the gift which Moses commanded for a testimony unto them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cum autem introisset Capharnaum, accessit ad eum centurio, rogans eum,"
      en: "And when he had entered into Capharnaum, there came to him a centurion, beseeching him,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et dicens: Domine, puer meus jacet in domo paralyticus, et male torquetur."
      en: "And saying, Lord, my servant lieth at home sick of the palsy, and is grieviously tormented."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ait illi Jesus: Ego veniam, et curabo eum."
      en: "And Jesus saith to him: I will come and heal him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et respondens centurio, ait: Domine, non sum dignus ut intres sub tectum meum: sed tantum dic verbo, et sanabitur puer meus."
      en: "And the centurion making answer, said: Lord, I am not worthy that thou shouldst enter under my roof: but only say the word, and my servant shall be healed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nam et ego homo sum sub potestate constitutus, habens sub me milites, et dico huic: Vade, et vadit: et alii: Veni, et venit: et servo meo: Fac hoc, et facit."
      en: "For I also am a man subject to authority, having under me soldiers; and I say to this, Go, and he goeth, and to another, Come, and he cometh, and to my servant, Do this, and he doeth it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Audiens autem Jesus miratus est, et sequentibus se dixit: Amen dico vobis, non inveni tantam fidem in Israel."
      en: "And Jesus hearing this, marvelled; and said to them that followed him: Amen I say to you, I have not found so great faith in Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dico autem vobis, quod multi ab oriente et occidente venient, et recumbent cum Abraham, et Isaac, et Jacob in regno caelorum:"
      en: "And I say to you that many shall come from the east and the west, and shall sit down with Abraham, and Isaac, and Jacob in the kingdom of heaven:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "filii autem regni ejicientur in tenebras exteriores: ibi erit fletus et stridor dentium."
      en: "But the children of the kingdom shall be cast out into the exterior darkness: there shall be weeping and gnashing of teeth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dixit Jesus centurioni: Vade, et sicut credidisti, fiat tibi. Et sanatus est puer in illa hora."
      en: "And Jesus said to the centurion: Go, and as thou hast believed, so be it done to thee. And the servant was healed at the same hour."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et cum venisset Jesus in domum Petri, vidit socrum ejus jacentem, et febricitantem:"
      en: "And when Jesus was come into Peter's house, he saw his wife's mother lying, and sick of a fever:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et tetigit manum ejus, et dimisit eam febris, et surrexit, et ministrabat eis."
      en: "And he touched her hand, and the fever left her, and she arose and ministered to them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vespere autem facto, obtulerunt ei multos daemonia habentes: et ejiciebat spiritus verbo, et omnes male habentes curavit:"
      en: "And when evening was come, they brought to him many that were possessed with devils: and he cast out the spirits with his word: and all that were sick he healed:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut adimpleretur quod dictum est per Isaiam prophetam, dicentem: Ipse infirmitates nostras accepit: et aegrotationes nostras portavit."
      en: "That it might be fulfilled, which was spoken by the prophet Isaias, saying: He took our infirmities, and bore our diseases."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Videns autem Jesus turbas multas circum se, jussit ire trans fretum."
      en: "And Jesus seeing great multitudes about him, gave orders to pass over the water."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et accedens unus scriba, ait illi: Magister, sequar te, quocumque ieris."
      en: "And a certain scribe came and said to him: Master, I will follow thee whithersoever thou shalt go."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et dicit ei Jesus: Vulpes foveas habent, et volucres caeli nidos; Filius autem hominis non habet ubi caput reclinet."
      en: "And Jesus saith to him: The foxes have holes, and the birds of the air nests: but the son of man hath not where to lay his head."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Alius autem de discipulis ejus ait illi: Domine, permitte me primum ire, et sepelire patream meum."
      en: "And another of his disciples said to him: Lord, suffer me first to go and bury my father."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Jesus autem ait illi: Sequere me, et dimitte mortuos sepelire mortuos suos."
      en: "But Jesus said to him: Follow me, and let the dead bury their dead."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ascendente eo in naviculam, secuti sunt eum discipuli ejus:"
      en: "And when he entered into the boat, his disciples followed him:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et ecce motus magnus factus est in mari, ita ut navicula operiretur fluctibus, ipse vero dormiebat."
      en: "And behold a great tempest arose in the sea, so that the boat was covered with waves, but he was asleep."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et accesserunt ad eum discipuli ejus, et suscitaverunt eum, dicentes: Domine, salva nos, perimus."
      en: "And they came to him, and awaked him, saying: Lord, save us, we perish."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et dicit eis Jesus: Quid timidi estis, modicae fidei? Tunc surgens imperavit ventis, et mari, et facta est tranquillitas magna."
      en: "And Jesus saith to them: Why are you fearful, O ye of little faith? Then rising up he commanded the winds, and the sea, and there came a great calm."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Porro homines mirati sunt, dicentes: Qualis est hic, quia venti et mare obediunt ei?"
      en: "But the men wondered, saying: What manner of man is this, for the winds and the sea obey him?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et cum venisset trans fretum in regionem Gerasenorum, occurrerunt ei duo habentes daemonia, de monumentis exeuntes, saevi nimis, ita ut nemo posset transire per viam illam."
      en: "And when he was come on the other side of the water, into the country of the Gerasens, there met him two that were possessed with devils, coming out of the sepulchres, exceeding fierce, so that none could pass by that way."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et ecce clamaverunt, dicentes: Quid nobis et tibi, Jesu fili Dei? Venisti huc ante tempus torquere nos?"
      en: "And behold they cried out, saying: What have we to do with thee, Jesus Son of God? art thou come hither to torment us before the time?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Erat autem non longe ab illis grex multorum porcorum pascens."
      en: "And there was, not far from them, an herd of many swine feeding."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Daemones autem rogabant eum, dicentes: Si ejicis nos hinc, mitte nos in gregem porcorum."
      en: "And the devils besought him, saying: If thou cast us out hence, send us into the herd of swine."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et ait illis: Ite. At illi exeuntes abierunt in porcos, et ecce impetu abiit totus grex per praeceps in mare: et mortui sunt in aquis."
      en: "And he said to them: Go. But they going out went into the swine, and behold the whole herd ran violently down a steep place into the sea: and they perished in the waters."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Pastores autem fugerunt: et venientes in civitatem, nuntiaverunt omnia, et de eis qui daemonia habuerant."
      en: "And they that kept them fled: and coming into the city, told every thing, and concerning them that had been possessed by the devils."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et ecce tota civitas exiit obviam Jesu: et viso eo, rogabant ut transiret a finibus eorum."
      en: "And behold the whole city went out to meet Jesus, and when they saw him, they besought him that he would depart from their coasts."
    status: { la: verified, en: verified }
