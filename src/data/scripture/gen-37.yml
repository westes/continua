# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 37
verses:
  - n: 1
    text:
      la: "Habitavit autem Jacob in terra Chanaan, in qua pater suus peregrinatus est."
      en: "And Jacob dwelt in the land of Chanaan wherein his father sojourned."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et hae sunt generationes ejus: Joseph cum sedecim esset annorum, pascebat gregem cum fratribus suis adhuc puer: et erat cum filiis Balae et Zelphae uxorum patris sui: accusavitque fratres suos apud patrem crimine pessimo."
      en: "And these are his generations: Joseph, when he was sixteen years old, was feeding the flock with his brethren, being but a boy: and he was with the sons of Bala and of Zelpha his father's wives: and he accused his brethren to his father of a most wicked crime."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Israel autem diligebat Joseph super omnes filios suos, eo quod in senectute genuisset eum: fecitque ei tunicam polymitam."
      en: "Now Israel loved Joseph above all his sons, because he had him in his old age: and he made him a coat of divers colours."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Videntes autem fratres ejus quod a patre plus cunctis filiis amaretur, oderant eum, nec poterant ei quidquam pacifice loqui."
      en: "And his brethren seeing that he was loved by his father, more than all his sons, hated him, and could not speak peaceably to him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Accidit quoque ut visum somnium referret fratribus suis: quae causa majoris odii seminarium fuit."
      en: "Now it fell out also that he told his brethren a dream, that he had dreamed: which occasioned them to hate him the more."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixitque ad eos: Audite somnium meum quod vidi:"
      en: "And he said to them: Hear my dream which I dreamed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "putabam nos ligare manipulos in agro: et quasi consurgere manipulum meum, et stare, vestrosque manipulos circumstantes adorare manipulum meum."
      en: "I thought we were binding sheaves in the field: and my sheaf arose as it were, and stood, and your sheaves standing about, bowed down before my sheaf."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Responderunt fratres ejus: Numquid rex noster eris? aut subjiciemur ditioni tuae? Haec ergo causa somniorum atque sermonum, invidiae et odii fomitem ministravit."
      en: "His brethren answered: Shalt thou be our king? or shall we be subject to thy dominion? Therefore this matter of his dreams and words ministered nourishment to their envy and hatred."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Aliud quoque vidit somnium, quod narrans fratribus, ait: Vidi per somnium, quasi solem, et lunam, et stellas undecim adorare me."
      en: "He dreamed also another dream, which he told his brethren, saying: I saw in a dream, as it were the sun, and the moon, and eleven stars worshipping me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quod cum patri suo, et fratribus retulisset, increpavit eum pater suus, et dixit: Quid sibi vult hoc somnium quod vidisti? num ego et mater tua, et fratres tui adorabimus te super terram?"
      en: "And when he had told this to his father and brethren, his father rebuked him, and said: What meaneth this dream that thou hast dreamed? shall I and thy mother, and thy brethren worship thee upon the earth?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Invidebant ei igitur fratres sui: pater vero rem tacitus considerabat."
      en: "His brethren therefore envied him: but his father considered the thing with himself."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cumque fratres illius in pascendis gregibus patris morarentur in Sichem,"
      en: "And when his brethren abode in Sichem feeding their father's flocks,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit ad eum Israel: Fratres tui pascunt oves in Sichimis: veni, mittam te ad eos. Quo respondente,"
      en: "Israel said to him: Thy brethren feed the sheep in Sichem: come, I will send thee to them. And when he answered:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Praesto sum, ait ei: Vade, et vide si cuncta prospera sint erga fratres tuos, et pecora: et renuntia mihi quid agatur. Missus de valle Hebron, venit in Sichem:"
      en: "I am ready: he said to him: Go, and see if all things be well with thy brethren, and the cattle: and bring me word again what is doing. So being sent from the vale of Hebron, he came to Sichem:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "invenitque eum vir errantem in agro, et interrogavit quid quaereret."
      en: "And a man found him there wandering in the field, and asked what he sought."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "At ille respondit: Fratres meos quaero: indica mihi ubi pascant greges."
      en: "But he answered: I seek my brethren; tell me where they feed the flocks."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixitque ei vir: Recesserunt de loco isto: audivi autem eos dicentes: Eamus in Dothain. Perrexit ergo Joseph post fratres suos, et invenit eos in Dothain."
      en: "And the man said to him: They are departed from this place: for I heard them say: Let us go to Dothain. And Joseph went forward after his brethren, and found them in Dothain."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui cum vidissent eum procul, antequam accederet ad eos, cogitaverunt illum occidere:"
      en: "And when they saw him afar off, before he came nigh them, they thought to kill him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et mutuo loquebantur: Ecce somniator venit:"
      en: "And said one to another: Behold the dreamer cometh."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "venite, occidamus eum, et mittamus in cisternam veterem: dicemusque: Fera pessima devoravit eum: et tunc apparebit quid illi prosint somnia sua."
      en: "Come, let us kill him, and cast him into some old pit: and we will say: Some evil beast hath devoured him: and then it shall appear what his dreams avail him:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Audiens autem hoc Ruben, nitebatur liberare eum de manibus eorum, et dicebat:"
      en: "And Ruben hearing this, endeavoured to deliver him out of their hands, and said:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non interficiatis animam ejus, nec effundatis sanguinem: sed projicite eum in cisternam hanc, quae est in solitudine, manusque vestras servate innoxias: hoc autem dicebat, volens eripere eum de manibus eorum, et reddere patri suo."
      en: "Do not take away his life, nor shed his blood: but cast him into this pit, that is in the wilderness, and keep your hands harmless: now he said this, being desirous to deliver him out of their hands and to restore him to his father."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Confestim igitur ut pervenit ad fratres suos, nudaverunt eum tunica talari et polymita:"
      en: "And as soon as he came to his brethren, they forthwith stript him of his outside coat, that was of divers colours:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "miseruntque eum in cisternam veterem, quae non habebat aquam."
      en: "And cast him into an old pit, where there was no water."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et sedentes ut comederent panem, viderunt Ismaelitas viatores venire de Galaad, et camelos eorum portantes aromata, et resinam, et stacten in Aegyptum."
      en: "And sitting down to eat bread, they saw some Ismaelites on their way coming from Galaad, with their camels, carrying spices, and balm, and myrrh to Egypt."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dixit ergo Judas fratribus suis: Quid nobis prodest si occiderimus fratrem nostrum, et celaverimus sanguinem ipsius?"
      en: "And Juda said to his brethren: What will it profit us to kill our brother, and conceal his blood?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "melius est ut venundetur Ismaelitis, et manus nostrae non polluantur: frater enim et caro nostra est. Acquieverunt fratres sermonibus illius."
      en: "It is better that he be sold to the Ismaelites, and that our hands be not defiled: for he is our brother and our flesh. His brethren agreed to his words."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et praetereuntibus Madianitis negotiatoribus, extrahentes eum de cisterna, vendiderunt eum Ismaelitis, viginti argenteis: qui duxerunt eum in Aegyptum."
      en: "And when the Madianite merchants passed by, they drew him out of the pit, and sold him to the Ismaelites, for twenty pieces of silver: and they led him into Egypt."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Reversusque Ruben ad cisternam, non invenit puerum:"
      en: "And Ruben, returning to the pit, found not the boy:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et scissis vestibus pergens ad fratres suos, ait: Puer non comparet, et ego quo ibo?"
      en: "And rending his garments he went to his brethren, and said: The boy doth not appear and whither shall I go?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Tulerunt autem tunicam ejus, et in sanguine haedi, quem occiderant, tinxerunt:"
      en: "And they took his coat, and dipped it in the blood of a kid, which they had killed:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "mittentes qui ferrent ad patrem, et dicerent: Hanc invenimus: vide utrum tunica filii tui sit, an non."
      en: "Sending some to carry it to their father, and to say: This we have found: see whether it be thy son's coat, or not."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Quam cum agnovisset pater, ait: Tunica filii mei est: fera pessima comedit eum, bestia devoravit Joseph."
      en: "And the father acknowledging it, said: It is my son's coat, an evil wild beast hath eaten him, a beast hath devoured Joseph."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Scissisque vestibus, indutus est cilicio, lugens filium suum multo tempore."
      en: "And tearing his garments, he put on sackcloth, mourning for his son a long time."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Congregatis autem cunctis liberis ejus ut lenirent dolorem patris, noluit consolationem accipere, sed ait: Descendam ad filium meum lugens in infernum. Et illo perseverante in fletu,"
      en: "And all his children being gathered together to comfort their father in his sorrow, he would not receive comfort, but said: I will go down to my son into hell, mourning. And whilst he continued weeping,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Madianitae vendiderunt Joseph in Aegypto Putiphari eunucho Pharaonis, magistro militum."
      en: "The Madianites sold Joseph in Egypt to Putiphar, an eunuch of Pharao, captain of the soldiers."
    status: { la: verified, en: verified }
