# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 37
verses:
  - n: 1
    text:
      la: "habitavit autem Iacob in terra Chanaan in qua peregrinatus est pater suus"
      en: "And Jacob dwelt in the land of Chanaan wherein his father sojourned."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et hae sunt generationes eius Ioseph cum sedecim esset annorum pascebat gregem cum fratribus suis adhuc puer et erat cum filiis Balae et Zelphae uxorum patris sui accusavitque fratres suos apud patrem crimine pessimo"
      en: "And these are his generations: Joseph, when he was sixteen years old, was feeding the dock with his brethren, being but a boy: and he was with the sons of and of Zelpha his father's wives : and he accused his brethren to his father of a most wicked crime."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Israhel autem diligebat Ioseph super omnes filios suos eo quod in senectute genuisset eum fecitque ei tunicam polymitam"
      en: "Now Israel loved Joseph above all his sons, because he had him in his old age: and he made him a coat of divers colours."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "videntes autem fratres eius quod a patre plus cunctis filiis amaretur oderant eum nec poterant ei quicquam pacificum loqui"
      en: "And his brethren seeing that he was loved by his father, more than all his sons, hated him, and could not speak peaceably to him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "accidit quoque ut visum somnium referret fratribus quae causa maioris odii seminarium fuit"
      en: "Now it fell out also that he told his brethren a dream, that he had dreamed: which occasioned them to hate him the more."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixitque ad eos audite somnium meum quod vidi"
      en: "And he said to them: Hear my dream which I dreamed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "putabam ligare nos manipulos in agro et quasi consurgere manipulum meum et stare vestrosque manipulos circumstantes adorare manipulum meum"
      en: "I thought we were binding sheaves in the field: and my sheaf arose as it were, end stood, and your sheaves standing about, bowed down before my sheaf."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "responderunt fratres eius numquid rex noster eris aut subiciemur dicioni tuae haec ergo causa somniorum atque sermonum invidiae et odii fomitem ministravit"
      en: "His brethren answered : Shalt thou be our king? or shall we be subject to thy dominion? Therefore this matter of his dreams and words ministered nourishment to their envy and hatred."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "aliud quoque vidit somnium quod narrans fratribus ait vidi per somnium quasi solem et lunam et stellas undecim adorare me"
      en: "He dreamed also another dream, which he told his brethren, saying: I saw in a dream, as it were the sun, and the moon, and eleven stars worshipping me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quod cum patri suo et fratribus rettulisset increpavit eum pater et dixit quid sibi vult hoc somnium quod vidisti num ego et mater tua et fratres adorabimus te super terram"
      en: "And when he had told this to his father and brethren, his father rebuked him, and said: What meaneth this dream that thou hast dreamed? shall I and thy mother, and thy brethren worship thee upon the earth?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "invidebant igitur ei fratres sui pater vero rem tacitus considerabat"
      en: "His brethren therefore envied him: but his father considered the thing with himself."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cumque fratres illius in pascendis gregibus patris morarentur in Sychem"
      en: "And when his brethren abode in Sichem feeding their father's docks,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit ad eum Israhel fratres tui pascunt oves in Sycimis veni mittam te ad eos quo respondente"
      en: "Israel said to him : Thy brethren feed the sheep in Sichem: come, I will send thee to them. And when he answered:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "praesto sum ait vade et vide si cuncta prospera sint erga fratres tuos et pecora et renuntia mihi quid agatur missus de valle Hebron venit in Sychem"
      en: "I am ready: he said to him: Go, and see if all things be well with thy brethren, and the cattle: and bring me word again what is doing. So being sent from the vale of Hebron, he came to Sichem:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "invenitque eum vir errantem in agro et interrogavit quid quaereret"
      en: "And a man found him there wandering in the field, and asked what he sought."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "at ille respondit fratres meos quaero indica mihi ubi pascant greges"
      en: "But he answered: I seek my brethren; tell me where they feed the docks."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixitque ei vir recesserunt de loco isto audivi autem eos dicentes eamus in Dothain perrexit ergo Ioseph post fratres suos et invenit eos in Dothain"
      en: "And the man said to him: They are departed from this place: for I heard them say: Let us go to Dothain. And Joseph went forward after his brethren, and found them in Dothain."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui cum vidissent eum procul antequam accederet ad eos cogitaverunt illum occidere"
      en: "And when they saw him afar off, be- fore he came nigh them, they thought to kill him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et mutuo loquebantur ecce somniator venit"
      en: "And said one to another: Behold the dreamer cometh."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "venite occidamus eum et mittamus in cisternam veterem dicemusque fera pessima devoravit eum et tunc apparebit quid illi prosint somnia sua"
      en: "Come, let us kill him, and cast him into some old pit : and we will say : Some evil beast hath devoured him: and then it shall appear what his dreams avail him :"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "audiens hoc Ruben nitebatur liberare eum de manibus eorum et dicebat"
      en: "And Ruben hearing this, endeavoured to deliver him out of their hands, end said:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non interficiamus animam eius nec effundatis sanguinem sed proicite eum in cisternam hanc quae est in solitudine manusque vestras servate innoxias hoc autem dicebat volens eripere eum de manibus eorum et reddere patri suo"
      en: "Do not take away his life, nor shed his blood: but cast him into this pit, that is in the wilderness, and keep your hands harmless: now he said this, being desirous to deliver him out of their hands and to restore him to his father."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "confestim igitur ut pervenit ad fratres nudaverunt eum tunica talari et polymita"
      en: "And as soon as he came to his brethren, they forthwith stript him of his outside coat, that was of divers colours:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "miseruntque in cisternam quae non habebat aquam"
      en: "And cast him into an old pit, where there was no water."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et sedentes ut comederent panem viderunt viatores Ismahelitas venire de Galaad et camelos eorum portare aromata et resinam et stacten in Aegyptum"
      en: "And sitting down to eat bread, they saw some Ismaelites on their way coming from Calaad, with their camels, carrying spices, and balm, and myrrh to Egypt."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dixit ergo Iudas fratribus suis quid nobis prodest si occiderimus fratrem nostrum et celaverimus sanguinem ipsius"
      en: "And Juda said to his brethren: What will it profit us to kill our brother, and conceal his blood?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "melius est ut vendatur Ismahelitis et manus nostrae non polluantur frater enim et caro nostra est adquieverunt fratres sermonibus eius"
      en: "It is better that he be sold to the Ismaelites, and that our hands be not defiled: for he is our brother and our flesh. His brethren agreed to his words."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et praetereuntibus Madianitis negotiatoribus extrahentes eum de cisterna vendiderunt Ismahelitis viginti argenteis qui duxerunt eum in Aegyptum"
      en: "And when the Madianite merchants passed by, they drew him out of the pit, and sold him to the Ismaelites, for twenty pieces of silver: and they led him into Egypt."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "reversusque Ruben ad cisternam non invenit puerum"
      en: "And Ruben, returning to the pit, found not the boy:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et scissis vestibus pergens ad fratres ait puer non conparet et ego quo ibo"
      en: "And rending his garments he went to his brethren, and said: The boy doth not appear and whither shall I go?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "tulerunt autem tunicam eius et in sanguinem hedi quem occiderant tinxerunt"
      en: "And they took his coat, and dipped it in the blood of a kid, which they had killed :"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "mittentes qui ferrent ad patrem et dicerent hanc invenimus vide utrum tunica filii tui sit an non"
      en: "Sending some to carry it to their father, and to say: This we have found: see whether it be thy son's coat, or not."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "quam cum agnovisset pater ait tunica filii mei est fera pessima comedit eum bestia devoravit Ioseph"
      en: "And the father acknowledging it, said: It is my son's coat, an evil wild beast hath eaten him, a beast hath devoured Joseph."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "scissisque vestibus indutus est cilicio lugens filium multo tempore"
      en: "And tearing his garments, he put an sackcloth, mourning for his son a long time."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "congregatis autem cunctis liberis eius ut lenirent dolorem patris noluit consolationem recipere et ait descendam ad filium meum lugens in infernum et illo perseverante in fletu"
      en: "And alibis children being gathered together to comfort their father in his sorrow, he would not receive comfort, but said: I will go down to my son into hell, mourning. And whilst he continued weeping,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Madianei vendiderunt Ioseph in Aegypto Putiphar eunucho Pharaonis magistro militiae"
      en: "The Madianites sold Joseph in Egypt to Putiphar, an eunuch of Pharao, captain of the soldiers."
    status: { la: verified, en: verified }
