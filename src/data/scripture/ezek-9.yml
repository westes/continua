book: ezek
chapter: 9
verses:
  - n: 1
    text:
      la: "et clamavit in auribus meis voce magna dicens adpropinquaverunt visitationes urbis et unusquisque vas interfectionis habet in manu sua"
      en: "And he cried in my ears with a loud voice, saying: The visitations of the city are at hand, and every one hath a destroying weapon in his hand."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ecce sex viri veniebant de via portae superioris quae respicit ad aquilonem et uniuscuiusque vas interitus in manu eius vir quoque unus in medio eorum vestitus lineis et atramentarium scriptoris ad renes eius et ingressi sunt et steterunt iuxta altare aereum"
      en: "And behold six men came from the way of the upper gate, which looketh to the north: and each one had his weapon of destruction in his hand: and there was one man in the midst of them clothed with linen, with a writer's inkhorn at his reins: and they went in, and stood by the brazen altar."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et gloria Domini Israhel adsumpta est de cherub quae erat super eum ad limen domus et vocavit virum qui indutus erat lineis et atramentarium scriptoris habebat in lumbis suis"
      en: "And the glory of the Lord of Israel went up from the cherub, upon which he was, to the threshold of the house: and he called to the man that was clothed with linen, and had a writer's inkhorn at his loins."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixit Dominus ad eum transi per mediam civitatem in medio Hierusalem et signa thau super frontes virorum gementium et dolentium super cunctis abominationibus quae fiunt in medio eius"
      en: "And the Lord said to him: Go through the midst of the city, through the midst of Jerusalem: and mark Thau upon the foreheads of the men that sigh, and mourn for all the abominations that are committed in the midst thereof."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et illis dixit audiente me transite per civitatem sequentes eum et percutite non parcat oculus vester neque misereamini"
      en: "And to the others he said in my hearing: Go ye after him through the city, and strike: let not your eyes spare, nor be ye moved with pity."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "senem adulescentulum et virginem parvulum et mulieres interficite usque ad internicionem omnem autem super quem videritis thau ne occidatis et a sanctuario meo incipite coeperunt ergo a viris senioribus qui erant ante faciem domus"
      en: "Utterly destroy old and young, maidens, children and women: but upon whomsoever you shall see Thau, kill him not, and begin ye at my sanctuary. So they began at the ancient men who mere before the house."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dixit ad eos contaminate domum et implete atria interfectis egredimini et egressi sunt et percutiebant eos qui erant in civitate"
      en: "And he said to them: Defile the house, and ill the courts with the slain: go ye forth. And they went forth, and slew them that were in the city."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et caede conpleta remansi ego ruique super faciem meam et clamans aio heu heu heu Domine Deus ergone disperdes omnes reliquias Israhel effundens furorem tuum super Hierusalem"
      en: "And the slaughter being ended I was left: and I fell upon my face, and crying, I said: Alas, alas, alas, O Lord God, wilt thou then destroy all the remnant of Israel, by pouring out thy fury upon Jerusalem?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit ad me iniquitas domus Israhel et Iuda magna est nimis valde et repleta est terra sanguinibus et civitas repleta est aversione dixerunt enim dereliquit Dominus terram et Dominus non videt"
      en: "And he said to me: The iniquity of the house of Israel, and of Juda, is exceeding great, and the land is filled with blood, and the city is filled with perverseness: for they have said: The Lord hath forsaken the earth, and the Lord seeth not."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "igitur et meus non parcet oculus neque miserebor viam eorum super caput eorum reddam"
      en: "Therefore neither shall my eye spare, nor will I have pity: I will requite their way upon their head."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ecce vir qui indutus erat lineis qui habebat atramentarium in dorso suo respondit verbum dicens feci sicut praecepisti mihi"
      en: "And behold the man that was clothed with linen, that had the inkhorn at his back, returned the word, saying: I have done as thou hast commanded me."
    status: { la: verified, en: verified }
