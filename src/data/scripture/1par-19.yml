# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 19
verses:
  - n: 1
    text:
      la: "accidit autem ut moreretur Naas rex filiorum Ammon et regnaret filius eius pro eo"
      en: "Now it came to pass that Naas the king of the children of Ammon died, and his son reigned is his stead."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque David faciam misericordiam cum Hanon filio Naas praestitit enim pater eius mihi gratiam misitque David nuntios ad consolandum eum super morte patris sui qui cum pervenissent in terram filiorum Ammon ut consolarentur Hanon"
      en: "And David said: I will shew kindness to Hanon the son of Naas: for his father did a favour to me. And David sent messengers to comfort him upon the death of his father. But when they were come into the land of the children of Ammon, to comfort Hanon,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixerunt principes filiorum Ammon ad Hanon tu forsitan putas quod David honoris causa in patrem tuum miserit qui consolentur te nec animadvertis quod ut explorent et investigent et scrutentur terram tuam venerint ad te servi eius"
      en: "The princes of the children of Ammon said to Hanon: Thou thinkest perhaps that David to do honour to thy father hath sent comforters to thee: and thou dost not take notice, that his servants are come to thee to consider, and search, and spy out thy land."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "igitur Hanon pueros David decalvavit et rasit et praecidit tunicas eorum a natibus usque ad pedes et dimisit eos"
      en: "Wherefore Hanon shaved the heads and beards of the servants of David, and cut away their garments from the buttocks to the feet, and sent them away."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui cum abissent et hoc mandassent David misit in occursum eorum grandem enim contumeliam sustinuerant et praecepit ut manerent in Hiericho donec cresceret barba eorum et tunc reverterentur"
      en: "And when they were gone, they sent word to David, who sent to meet them (for they had suffered a great affront) and ordered them to stay at Jericho till their beards grew and then to return."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "videntes autem filii Ammon quod iniuriam fecissent David tam Hanon quam reliquus populus miserunt mille talenta argenti ut conducerent sibi de Mesopotamia et de Syria Macha et de Suba currus et equites"
      en: "And when the children of Ammon saw that they had done an injury to David, Hanon and the rest of the people sent a thousand talents of silver, to hire them chariots and horsemen out of Mesopotamia, and out of Syria Maacha, and out of Soba."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "conduxeruntque triginta duo milia curruum et regem Macha cum populo eius qui cum venissent castrametati sunt e regione Medaba filii quoque Ammon congregati de urbibus suis venerunt ad bellum"
      en: "And they hired two and thirty thousand chariots, and the king of Maacha, with his people. And they came and camped over against Medaba. And the children of Ammon gathered themselves together out of their cities, and came to battle."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quod cum audisset David misit Ioab et omnem exercitum virorum fortium"
      en: "And when David heard of it, he sent Joab, and all the army of valiant men:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "egressique filii Ammon direxerunt aciem iuxta portam civitatis reges autem qui ad auxilium venerant separatim in agro steterunt"
      en: "And the children of Ammon came out and put their army in array before the gate of the city : and the kings, that were come to their aid, stood apart in the field."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "igitur Ioab intellegens bellum et ex adverso et post tergum contra se fieri elegit viros fortissimos de universo Israhel et perrexit contra Syrum"
      en: "Wherefore Joab understanding that the battle was set against him before and behind, chose out the bravest men of all Israel, and marched against the Syrians,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "reliquam autem partem populi dedit sub manu Abisai fratris sui et perrexerunt contra filios Ammon"
      en: "And the rest of the people he delivered into the hand of Abisai his brother, and they went against the children of Ammon."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixitque si vicerit me Syrus auxilio eris mihi sin autem superaverint te filii Ammon ero tibi in praesidium"
      en: "And he said: If the Syrians be too strong for me, then thou shalt help me: but if the children of Ammon be too strong for thee, I will help thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "confortare et agamus viriliter pro populo nostro et pro urbibus Dei nostri Dominus autem quod in conspectu suo bonum est faciet"
      en: "Be of good courage and let us behave ourselves manfully for our people, and for the cities of our God: and the Lord will do that which is good in his sight."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "perrexit ergo Ioab et populus qui cum eo erat contra Syrum ad proelium et fugavit eos"
      en: "So Joab and the people that were with him, went against the Syrians to the battle : and he put them to flight."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "porro filii Ammon videntes quod fugisset Syrus ipsi quoque fugerunt Abisai fratrem eius et ingressi sunt civitatem reversusque est etiam Ioab in Hierusalem"
      en: "And the children of Ammon seeing that the Syrians were fled, they likewise fled from Abisai his brother, and went into the city: and Joab also returned to Jerusalem."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "videns autem Syrus quod cecidisset coram Israhel misit nuntios et adduxit Syrum qui erat trans Fluvium Sophach autem princeps militiae Adadezer erat dux eorum"
      en: "But the Syrians seeing that they had fallen before Israel, sent messengers, and brought to them the Syrians that were beyond the river: and Sophach, general of the army of Adarezer, was their leader."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quod cum nuntiatum esset David congregavit universum Israhel et transivit Iordanem inruitque in eos et direxit ex adverso aciem illis contra pugnantibus"
      en: "And it was told David, and he gathered together all Israel, and passed the Jordan, and came upon them, and put his army in array against them, and they fought with him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "fugit autem Syrus Israhel et interfecit David de Syris septem milia curruum et quadraginta milia peditum et Sophach exercitus principem"
      en: "But the Syrian fled before Israel: and David slew of the Syrians seven thousand chariots, and forty thousand footmen, and Sophach the general of the army."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "videntes autem servi Adadezer se ab Israhel esse superatos transfugerunt ad David et servierunt ei noluitque ultra Syria auxilium praebere filiis Ammon"
      en: "And when the servants of Adarezer saw themselves overcome by Israel, they went over to David, and served him: and Syria would not help the children of Ammon any more."
    status: { la: verified, en: verified }
