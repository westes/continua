book: 1mach
chapter: 6
verses:
  - n: 1
    text:
      la: "et rex Antiochus perambulavit superiores regiones et audivit esse civitatem Elymaidem in Perside nobilissimam et copiosam in argento et auro"
      en: "Now king Antiochus was going through the higher countries, and he heard that the city of Elymais in Persia was greatly renowned, and abounding in silver and gold."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "templumque in ea locuples valde et illic velamina aurea et loricae et scuta quae reliquit Alexander Philippi rex Macedo qui regnavit primus in Graecia"
      en: "And that there was in it a temple, exceeding rich: and coverings of gold, and breastplates, and shields which king Alexander, son of Philip the Macedonian that reigned first in Greece, had left there."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et venit et quaerebat civitatem capere et praedare eam et non potuit quoniam innotuit sermo his qui erant in civitate"
      en: "Lo, he came, and sought to take the city and to pillage it: But he was not able, because the design was known to them that were in the city."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et insurrexerunt in proelium et fugit inde et abiit cum tristitia magna et reversus est Babyloniam"
      en: "And they rose up against him in battle, and he fled away from thence, and departed with great sadness, and returned towards Babylonia."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et venit qui nuntiaret ei in Perside quia fugata sunt castra quae erant in terra Iuda"
      en: "And whilst he was in Persia, there came one that told him, how the armies that were in the land of Juda were put to flight:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et quia abiit Lysias cum virtute forti in primis et fugatus est a facie Iudaeorum et invaluerunt armis et viribus et spoliis multis quas ceperunt"
      en: "And that Lysias went with a very great power, and was put to flight before the face of the Jews, and that thy were grown strong by the armour, and power, and store of spoils, which they had gotten out of the camps which they had destroyed:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et quia diruerunt abominationem quam aedificaverat super altare quod erat in Hierusalem et sanctificationem sicut prius circumdederunt muris excelsis sed et Bethsuram civitatem suam"
      en: "And that they had thrown down the abomination which he had set up upon the altar in Jerusalem, and that they had compassed about the sanctuary with high walls as before, and Bethsura also his city."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et factum est ut audivit rex sermones istos expavit et commotus est valde et decidit in lectum et incidit in languorem prae tristitia quia non est factum sicut cogitabat"
      en: "And it came to pass when the king heard these words, that he was struck with fear, and exceedingly moved: and he laid himself down upon his bed, and fell sick for grief, because it had not fallen out to him as he imagined."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et erat illic dies multos quia renovata est in eo tristitia magna et arbitratus est se mori"
      en: "And he remained there many days: for great grief came more and more and more upon him, and he made account that he should die."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et vocavit omnes amicos suos et dixit illis recessit somnus ab oculis meis et concidi et corrui corde prae sollicitudine"
      en: "And he called for all his friends, and said to them: Sleep is gone from my eyes, and I am fallen away, and my heart is cast down for anxiety."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dixi in corde meo in quantam tribulationem deveni et in quos fluctus tristitiae in qua nunc sum qui iucundus eram et dilectus in potestate mea"
      en: "And I said in my heart: Into how much tribulation am I come, and into what floods of sorrow, wherein now I am: I that was pleasant and beloved in my power!"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nunc vero reminiscor malorum quae feci in Hierusalem unde abstuli omnia spolia argentea et aurea quae erant in ea et misi auferri habitantes Iudaeam sine causa"
      en: "But now I remember the evils that I have done in Jerusalem, from whence also I took away all the spoils of gold, and of silver that were in it, and I sent to destroy the inhabitants of Juda without cause."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cognovi ergo quia propterea invenerunt me mala ista et ecce pereo tristitia magna in terra aliena"
      en: "I know therefore that for this cause these evils have found me: and behold I perish with great grief in a strange land."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et vocavit Philippum unum de amicis suis et praeposuit eum super universum regnum suum"
      en: "Then he called Philip, one of his friends, and he made him regent over all his kingdom."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dedit ei diadema et stolam suam et anulum ut adduceret Antiochum filium suum et nutriret eum et regnaret"
      en: "And he gave him the crown, and his robe, and his ring, that he should go to Antiochus his son, and should bring him up for the kingdom."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et mortuus est illic Antiochus rex anno centesimo quadragesimo et nono"
      en: "So king Antiochus died there in the year one hundred and forty-nine."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et cognovit Lysias quoniam mortuus est rex et constituit regnare Antiochum filium eius quem nutrivit adulescentem et vocavit nomen eius Eupator"
      en: "And Lysias understood that the king was dead, and he set up Antiochus his son to reign, whom he brought up young: and he called his name Eupator."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et hii qui erant in arce concluserant Israhel in circuitu sanctorum et quaerebant eis mala semper ad firmamentum gentium"
      en: "Now they that were in the castle, had shut up the Israelites round about the holy places: and they were continually seeking their hurt, and to strengthen the Gentiles."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et cogitavit Iudas disperdere eos et convocavit universum populum ut obsiderent eos"
      en: "And Judas purposed to destroy them: and he called together all the people, to besiege them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et coirent simul et obsederunt eos anno centesimo quinquagesimo et fecerunt ballistas et machinas"
      en: "And they came together, and besieged them in the year one hundred and fifty, and they made battering slings and engines."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et exierunt quidam ex eis qui obsidebantur et adiunxerunt se illis aliqui ex impiis Israhel"
      en: "And some of the besieged got out: and some wicked men of Israel joined themselves unto them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et abierunt ad regem et dixerunt quousque non facies iudicium et vindicas fratres nostros"
      en: "And they went to the king, and said: How long dost thou delay to execute the judgment, and to revenge our brethren?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "nos decrevimus servire patri tuo et ambulare in praeceptis eius et obsequi edictis eius"
      en: "We determined to serve thy father and to do according to his orders, and obey his edicts:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et filii populi nostri propter hoc abalienabantur se a nobis et quicumque inveniebantur ex nobis interficiebantur et hereditates nostrae diripiebantur"
      en: "And for this they of our nation are alienated from us, and have slain as many of us as they could find, and have spoiled our inheritances."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et non ad nos tantum extenderunt manum sed et in omnes fines nostros"
      en: "Neither have they put forth their hand against us only, but also against all our borders."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ecce adplicuerunt hodie ad arcem in Hierusalem occupare eam et munitionem in Bethsuram munierunt"
      en: "And behold they have approached this day to the castle of Jerusalem to take it, and they have fortified the stronghold of Bethsura:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et nisi praeveneris eos velocius maiora quam haec facient nec poteris obtinere eos"
      en: "And unless thou speedily prevent them, they will do greater things than these, and thou shalt not be able to subdue them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et iratus est rex ut audivit et convocavit omnes amicos suos et principes exercitus sui et eos qui super equites erant"
      en: "Now when the king heard this, he was angry: and he called together all his friends, and the captains of his army, and them that were over the horsemen."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sed et de regnis aliis et insulis et maritimis venerunt ad eum exercitus conducticius"
      en: "There came also to him from other realms, and from the islands of the sea hired troops."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et erat numerus exercitus centum milia peditum et viginti milia equitum et elefanti triginta duo docti ad proelium"
      en: "And the number of his army was an hundred thousand footmen, and twenty thousand horsemen, and thirty-two elephants, trained to battle."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et venerunt per Idumeam et adplicuerunt ad Bethsuram et pugnaverunt dies multos et fecerunt machinas et exierunt et succenderunt eas igni et pugnaverunt viriliter"
      en: "And they went through Idumea, and approached to Bethsura, and fought many days, and they made engines: but they sallied forth and burnt them with fire, and fought manfully."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et recessit Iudas ab arce et admovit castra ad Bethzacara contra castra regis"
      en: "And Judas departed from the castle, and removed the camp to Bethzacharam, over against the king's camp."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et surrexit ante lucem et concitavit exercitus impetum contra viam Bethzacara et conparaverunt se exercitus in proelium et tubis cecinerunt"
      en: "And the king rose before it was light, and made his troops march on fiercely towards the way of Bethzacharam: and the armies made themselves ready for the battle, and they sounded the trumpets:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et elefantis ostenderunt sanguinem uvae et mori ad acuendos eos in proelium"
      en: "And they shewed the elephants the blood of grapes, and mulberries to provoke them to fight."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et diviserunt bestias per legiones et adstiterunt singulis elefantis mille viri in loricis concatenatis et galeae aereae in capitibus eorum et quingenti equites ordinati unicuique bestiae electi erant"
      en: "And they distributed the beasts by the legions: and there stood by every elephant a thousand men in coats of mail, and with helmets of brass on their heads: and five hundred horsemen set in order were chosen for every beast."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "hii ante tempus ubicumque erat bestia erant et quocumque ibat ibant non discedebant ab ea"
      en: "These before the time wheresoever the beast was, the were there: and withersoever it went, they went, and they departed not from it."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "sed et turres ligneas super eos firmae protegentes super singulas bestias et super eas machinae et super singulas viri virtutis triginta duo qui pugnabant desuper et intus magister bestiae"
      en: "And upon the beast, there were strong wooden towers, which covered every one of them: and engines upon them: and upon every one thirty-two valiant men, who fought from above; and an Indian to rule the beast."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et residuum equitatum hinc et inde statuit in duas partes tubis et exercitum commovere et perurguere constipati in legionibus eius"
      en: "And the rest of the horsemen he placed on this side and on that side at the two wings, with trumpets to stir up the army, and to hasten them forward that stood thick together in the legions thereof."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et ut refulsit sol in clypeos aureos et aereos resplenduerunt montes ab eis resplenduerunt sicut lampades ignis"
      en: "Now when the sun shone upon the shields of gold, and of brass, the mountains glittered therewith, and they shone like lamps of fire."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et distincta est pars exercitus regis per montes excelsos et alii per loca humilia et ibant caute et ordinate"
      en: "And part of the king's army was distinguished by the high mountains, and the other part by the low places: and they marched on warily and orderly."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et commovebantur omnes inhabitantes a voce multitudinis eorum et incessu turbae et conlisionis armorum erat enim exercitus magnus valde et fortis"
      en: "And all the inhabitants of the land were moved at the noise of their multitude, and the marching of the company, and the rattling of the armour, for the army was exceeding great and strong."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et adpropiavit Iudas et exercitus eius in proelium et ceciderunt de exercitu regis sescenti viri"
      en: "And Judas and his army drew near for battle: and there fell of the king's army six hundred men."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et vidit Eleazar filius Saura unam de bestiis loricatam loricis regis et erat eminens super ceteras bestias et visum est ei quod in ea esset rex"
      en: "And Eleazar the son of Saura saw one of the beasts harnessed with the king's harness: and it was higher than the other beasts: and it seemed to him that the king was on it:"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et dedit se ut liberaret populum suum et adquireret sibi nomen aeternum"
      en: "And he exposed himself to deliver his people and to get himself an everlasting name."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et cucurrit ad eam audaciter in medio legionis interficiens a dextris et a sinistris et cadebant ab eo huc et illuc"
      en: "And he ran up to it boldly in the midst of the legion, killing on the right hand, and on the left, and they fell by him on this side and that side."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et ivit sub pedes elefanti et subposuit ei et occidit eum et cecidit in terram super ipsum et mortuus est illic"
      en: "And he went between the feet of the elephant, and put himself under it: and slew it, and it fell to the ground upon him, and he died there."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et videntes virtutem regis et impetum exercitus eius deverterunt ab eis"
      en: "Then they seeing the strength of the king and the fierceness of his army, turned away from them."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "castra autem regis ascenderunt contra eos in Hierusalem et adplicuit castra rex ad Iudaeam et montem Sion"
      en: "But the king's army went up against them to Jerusalem: and the king's army pitched their tents against Judea and mount Sion."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et fecit pacem cum his qui erant in Bethsuram et exierunt de civitate quia non erant eis ibi alimenta conclusis quia sabbata erant terrae"
      en: "And he made peace with them that were in Bethsura: and they came forth out of the city, because they had no victuals, being shut up there, for it was the year of rest to the land."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et conprehendit rex Bethsuram et constituit illic custodiam servare eam"
      en: "And the king took Bethsura: and he placed there a garrison to keep it."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et convertit castra ad locum sanctificationis dies multos et statuit illic ballistas et machinas et ignis iacula et tormenta ad lapides iactandos et spicula et scorpios ad mittendas sagittas et fundibula"
      en: "And he turned his army against the sanctuary for many days: and he set up there battering slings, and engines and instruments to cast fire, and engines to cast stones and javelins, and pieces to shoot arrows, and slings."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "fecerunt autem et ipsi machinas adversus machinas eorum et pugnaverunt dies multos"
      en: "And they also made engines against their engines, and they fought for many days."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "escae autem non erant in civitate eo quod septimus annus esset et qui remanserant in Iudaea de gentibus consumpserant reliquias eorum quae repositae fuerant"
      en: "But there were no victuals in the city, because it was the seventh year: and such as had stayed in Judea of them that came from among the nations, had eaten the residue of all that which had been stored up."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "et remanserunt in sanctis viri pauci quoniam obtinuerat eos fames et dispersi sunt unusquisque in locum suum"
      en: "And there remained in the holy places but a few, for the famine had prevailed over them: and they were dispersed every man to his own place."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "et audivit Lysias quod Philippus quem constituit rex Antiochus cum adhuc viveret et nutriret Antiochum filium suum ut regnaret"
      en: "Now Lysias heard that Philip, whom king Antiochus while he lived had appointed to bring up his son Antiochus, and to reign, to be king,"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "et reversus esset a Perside et Media et exercitus qui abierat cum ipso et quia quaerit suscipere regni negotia"
      en: "Was returned from Persia, and Media, with the army that went with him, and that he sought to take upon him the affairs of the kingdom:"
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "festinavit ire et dicere ad regem et duces exercitus deficimus cotidie et esca nobis modica est et locus quem obsidemus est munitus et incumbit nobis ordinare de regno"
      en: "Wherefore he made haste to go, and say to the king and to the captains of the army: We decay daily, and our provision of victuals is small, and the place that we lay siege to is strong, and it lieth upon us to take order for the affairs of the kingdom."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "nunc itaque demus dextras hominibus istis et faciamus cum illis pacem et cum omni gente eorum"
      en: "Now therefore let us come to an agreement with these men, and make peace with them and with all their nation."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "et constituamus illis ut ambulent in legitimis suis sicut prius propter legitima enim ipsorum quae despeximus irati sunt et fecerunt omnia haec"
      en: "And let us covenant with them, that they may live according to their own laws as before. For because of our despising their laws, they have been provoked, and have done all these things."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "et placuit sermo in conspectu regis et principum et misit ad eos pacem facere et receperunt illam"
      en: "And the proposal was acceptable in the sight of the king, and of the princes: and he sent to them to make peace: and they accepted of it."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "et iuravit illis rex et principes et exierunt de munitione"
      en: "And the king and the princes swore to them: and they came out of the stronghold."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "et intravit rex montem Sion et vidit munitionem loci et rupit ius iuramenti quod iuravit et mandavit destruere murum in gyro"
      en: "Then the king entered into mount Sion, and saw the strength of the place: and he quickly broke the oath that he had taken, and gave commandment to throw down the wall round about."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "et discessit festinanter et reversus est Antiochiam et invenit Philippum dominantem civitati et pugnavit adversus eum et occupavit civitatem"
      en: "And he departed in haste, and returned to Antioch, where he found Philip master of the city: and he fought against him, and took the city."
    status: { la: verified, en: verified }
