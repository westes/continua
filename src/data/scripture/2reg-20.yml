book: 2reg
chapter: 20
verses:
  - n: 1
    text:
      la: "accidit quoque ut ibi esset vir Belial nomine Seba filius Bochri vir iemineus et cecinit bucina et ait non est nobis pars in David neque hereditas in filio Isai vir in tabernacula tua Israhel"
      en: "And there happened to be there a man of Belial, whose name was Seba, the son of Bochri, a man of Jemini: and he sounded the trumpet, and said: We have no part in David, nor inheritance in the son of Isai: return to thy dwellings, O Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et separatus est omnis Israhel a David secutusque est Seba filium Bochri viri autem Iuda adheserunt regi suo a Iordane usque Hierusalem"
      en: "And all Israel departed from David, and followed Seba the son of Bochri: but the men of Juda stuck to their king from the Jordan unto Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cumque venisset rex in domum suam Hierusalem tulit decem mulieres concubinas quas dereliquerat ad custodiendam domum et tradidit eas in custodiam alimenta eis praebens et non est ingressus ad eas sed erant clausae usque ad diem mortis suae in viduitate viventes"
      en: "And when the king was come into his house at Jerusalem, he took the ten women his concubines, whom he had left to keep the house, and put them in ward, allowing them provisions: and he went not in unto them, but they were shut up unto the day of their death living in widowhood."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixit autem rex Amasae convoca mihi omnes viros Iuda in diem tertium et tu adesto praesens"
      en: "And the king said to Amasa: Assemble to me all the men of Juda against the third day, and be thou here present."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "abiit ergo Amasa ut convocaret Iudam et moratus est extra placitum quod ei constituerat"
      en: "So Amasa went to assemble the men of Juda, but he tarried beyond the set time which the king had appointed him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ait autem David ad Abisai nunc magis adflicturus est nos Seba filius Bochri quam Absalom tolle igitur servos domini tui et persequere eum ne forte inveniat civitates munitas et effugiat nos"
      en: "And David said to Abisai: Now will Seba the son of Bochri do us more harm than did Absalom: take thou therefore the servants of thy lord, and pursue after him, lest he find fenced cities, and escape us."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "egressi sunt ergo cum eo viri Ioab Cherethi quoque et Felethi et omnes robusti exierunt de Hierusalem ad persequendum Seba filium Bochri"
      en: "So Joab's men went out with him, and the Cerethi and the Phelethi: and all the valiant men went out of Jerusalem to pursue after Seba the son of Bochri."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cumque illi essent iuxta lapidem grandem qui est in Gabaon Amasa veniens occurrit eis porro Ioab vestitus erat tunica stricta ad mensuram habitus sui et desuper accinctus gladio dependente usque ad ilia in vagina qui fabrefactus levi motu egredi poterat et percutere"
      en: "And when they were at the great stone which is in Gabaon, Amasa coming met them. And Joab had on a close coat of equal length with his habit, and over it was girded with a sword hanging down to his flank, in a scabbard, made in such manner as to come out with the least motion and strike."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixit itaque Ioab ad Amasa salve mi frater et tenuit manu dextra mentum Amasae quasi osculans eum"
      en: "And Joab said to Amasa: God save thee, my brother. And he took Amasa by the chin with his right hand to kiss him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "porro Amasa non observavit gladium quem habebat Ioab qui percussit eum in latere et effudit intestina eius in terram nec secundum vulnus adposuit Ioab autem et Abisai frater eius persecuti sunt Seba filium Bochri"
      en: "But Amasa did not take notice of the sword, which Joab had, and he struck him in the side, and shed out his bowels to the ground, and gave him not a second wound, and he died. And Joab, and Abisai his brother pursued after Seba the son of Bochri."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "interea quidam viri cum stetissent iuxta cadaver Amasae de sociis Ioab dixerunt ecce qui esse voluit pro Ioab comes David pro Ioab"
      en: "In the mean time some men of Joab's company stopping at the dead body of Amasa, said: Behold he that would have been in Joab's stead the companion of David."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Amasa autem conspersus sanguine iacebat in media via vidit hoc quidam vir quod subsisteret omnis populus ad videndum eum et amovit Amasam de via in agrum operuitque eum vestimento ne subsisterent transeuntes propter eum"
      en: "And Amasa imbrued with blood, lay in the midst of the way. A certain man saw this that all the people stood still to look upon him, so he removed Amasa out of the highway into the field, and covered him with a garment, that they who passed might not stop on his account."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "amoto igitur illo de via transiebat omnis vir sequens Ioab ad persequendum Seba filium Bochri"
      en: "And when he was removed out of the way, all the people went on following Joab to pursue after Seba the son of Bochri."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "porro ille transierat per omnes tribus Israhel in Abelam et in Bethmacha omnesque electi congregati fuerant ad eum"
      en: "Now he had passed through all the tribes of Israel unto Abela and Bethmaacha: and all the chosen men were gathered together unto him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "venerunt itaque et obpugnabant eum in Abela et in Bethmacha et circumdederunt munitionibus civitatem et obsessa est urbs omnis autem turba quae erat cum Ioab moliebatur destruere muros"
      en: "And they came, and besieged him in Abela, and in Bethmaacha, and they cast up works round the city, and the city was besieged: and all the people that were with Joab, laboured to throw down the walls."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et exclamavit mulier sapiens de civitate audite audite dicite Ioab adpropinqua huc et loquar tecum"
      en: "And a wise woman cried out from the city: Hear, hear, and say to Joab: Come near hither, and I will speak with thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui cum accessisset ad eam ait illi tu es Ioab et ille respondit ego ad quem sic locuta est audi sermones ancillae tuae qui respondit audio"
      en: "And when he was come near to her, she said to him: Art thou Joab? And he answered: I am. And she spoke thus to him: Hear the words of thy handmaid. He answered: I do hear."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "rursumque illa sermo inquit dicebatur in veteri proverbio qui interrogant interrogent in Abela et sic perficiebant"
      en: "And she again said: A saying was used in the old proverb: They that inquire, let them inquire in Abela: and so they made an end."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nonne ego sum quae respondeo veritatem Israhel et tu quaeris subruere civitatem et evertere matrem in Israhel quare praecipitas hereditatem Domini"
      en: "Am not I she that answer truth in Israel, and thou seekest to destroy the city, and to overthrow a mother in Israel? Why wilt thou throw down the inheritance of the Lord?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "respondensque Ioab ait absit absit hoc a me non praecipito neque demolior"
      en: "And Joab answering said: God forbid, God forbid that I should, I do not throw down, nor destroy."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non se sic habet res sed homo de monte Ephraim Seba filius Bochri cognomine levavit manum contra regem David tradite illum solum et recedemus a civitate et ait mulier ad Ioab ecce caput eius mittetur ad te per murum"
      en: "The matter is not so, but a man of mount Ephraim, Seba the son of Bochri by name, hath lifted up his hand against king David: deliver him only, and we will depart from the city. And the woman said to Joab: Behold his head shall be thrown to thee from the wall."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ingressa est ergo ad omnem populum et locuta est eis sapienter qui abscisum caput Seba filii Bochri proiecerunt ad Ioab et ille cecinit tuba et recesserunt ab urbe unusquisque in tabernacula sua Ioab autem reversus est Hierusalem ad regem"
      en: "So she went to all the people, and spoke to them wisely: and they cut off the head of Seba the son of Bochri, and cast it out to Joab. And he sounded the trumpet, and they departed from the city, every one to their home: and Joab returned to Jerusalem to the king."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "fuit ergo Ioab super omnem exercitum Israhel Banaias autem filius Ioiadae super Cheretheos et Feletheos"
      en: "So Joab was over all the army of Israel: and Banaias the son of Joiada was over the Cerethites and Phelethites,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Aduram vero super tributa porro Iosaphat filius Ahilud a commentariis"
      en: "But Aduram over the tributes: and Josaphat the son of Ahilud was recorder."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Sia autem scriba Sadoc vero et Abiathar sacerdotes"
      en: "And Siva was scribe: and Sadoc and Abiathar, priests."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Hira autem Hiaiarites erat sacerdos David"
      en: "And Ira the Jairite was the priest of David."
    status: { la: verified, en: verified }
