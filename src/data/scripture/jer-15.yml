# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 15
verses:
  - n: 1
    text:
      la: "et dixit Dominus ad me si steterit Moses et Samuhel coram me non est anima mea ad populum istum eice illos a facie mea et egrediantur"
      en: "And the Lord said to me: If Moses and Samuel shall stand before me, my soul is not towards this people: cast them out from my sight, and let them go forth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quod si dixerint ad te quo egrediemur dices ad eos haec dicit Dominus qui ad mortem ad mortem et qui ad gladium ad gladium et qui ad famem ad famem et qui ad captivitatem ad captivitatem"
      en: "And if they shall say unto thee: Whither shall we go forth? thou shalt say to them: Thus saith the Lord: Such as are for death, to death: and such as are to the sword, to the sword: and such as are for famine, to famine: and such as are to captivity, to captivity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et visitabo super eos quattuor species dicit Dominus gladium ad occisionem et canes ad lacerandum et volatilia caeli et bestias terrae ad devorandum et dissipandum"
      en: "And I will visit them with four kinds, saith the Lord: The sword to kill, and the dogs to tear, and the fowls of the air, and the beasts of the earth, to devour and destroy."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dabo eos in fervorem universis regnis terrae propter Manassem filium Ezechiae regis Iuda super omnibus quae fecit in Hierusalem"
      en: "And I will give them up to the rage of all the kingdoms of the earth: because of Manasses the son of Ezechias the king of Juda, for all that he did in Jerusalem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quis enim miserebitur tui Hierusalem aut quis contristabitur pro te aut quis ibit ad rogandum pro pace tua"
      en: "For who shall have pity on thee, O Jerusalem? or who shall bemoan thee? or who shall go to pray for thy peace?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tu reliquisti me dicit Dominus retrorsum abisti et extendam manum meam super te et interficiam te laboravi rogans"
      en: "Thou hast forsaken me, saith the Lord, thou art gone backward: and I will stretch out my hand against thee, and I will destroy thee: I am weary of entreating thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et dispergam eos ventilabro in portis terrae interfeci et perdidi populum meum et tamen a viis suis non sunt reversi"
      en: "And I will scatter them with a fan in the gates of the land: I have killed and destroyed my people, and yet they are not returned form their ways."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "multiplicatae sunt mihi viduae eius super harenam maris induxi eis super matrem adulescentis vastatorem meridie misi super civitates repente terrorem"
      en: "Their widows are multiplied unto me above the sand of the sea: I have brought upon them against the mother of the young man a spoiler at noonday: I have cast a terror on a sudden upon the cities."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "infirmata est quae peperit septem defecit anima eius occidit ei sol cum adhuc esset dies confusa est et erubuit et residuos eius in gladium dabo in conspectu inimicorum eorum ait Dominus"
      en: "She that hath borne seven is become weak, her soul hath fainted away: her sun is gone down, while it was yet day: she is confounded, and ashamed: and the residue of them I will give up to the sword in the sight of their enemies, saith the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vae mihi mater mea quare genuisti me virum rixae virum discordiae in universa terra non feneravi nec feneravit mihi quisquam omnes maledicunt mihi"
      en: "Woe is me, my mother: why hast thou borne me a man of strife, a man of contention to all the earth? I have not lent on usury, neither hath any man lent to me on usury: yet all curse me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dicit Dominus si non reliquiae tuae in bonum si non occurri tibi in tempore adflictionis et in tempore tribulationis adversum inimicum"
      en: "The Lord saith to me: Assuredly it shall be well with thy remnant, assuredly I shall help thee in the time of affliction, and in the time of tribulation against the enemy."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "numquid foederabitur ferrum ferro ab aquilone et aes"
      en: "Shall iron be allied with the iron from the north, and the brass?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "divitias tuas et thesauros tuos in direptionem dabo gratis in omnibus peccatis tuis et in omnibus terminis tuis"
      en: "Thy riches and thy treasures I will give unto spoil for nothing, because of all thy sins, even in all thy borders."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et adducam inimicos tuos de terra qua nescis quia ignis succensus est in furore meo super vos ardebit"
      en: "And I will bring thy enemies out of a land, which thou knowest not: for a fire is kindled in my rage, it shall burn upon you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "tu scis Domine recordare mei et visita me et tuere me ab his qui persequuntur me noli in patientia tua suscipere me scito quoniam sustinui pro te obprobrium"
      en: "O Lord, thou knowest, remember me, and visit me, and defend me from them that persecute me, do not defend me in thy patience: know that for thy sake I have sufferred reproach."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "inventi sunt sermones tui et comedi eos et factum est mihi verbum tuum in gaudium et in laetitiam cordis mei quoniam invocatum est nomen tuum super me Domine Deus exercituum"
      en: "Thy words were found, and I did eat them, and thy word was to me a joy and gladness of my heart: for thy name is called upon me, O Lord God of hosts."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "non sedi in concilio ludentium et gloriatus sum a facie manus tuae solus sedebam quoniam comminatione replesti me"
      en: "I sat not in the assembly of jesters, nor did I make a boast of the presence of thy hand: I sat alone, because thou hast filled me with threats."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quare factus est dolor meus perpetuus et plaga mea desperabilis rennuit curari facta est mihi quasi mendacium aquarum infidelium"
      en: "Why is my sorrow become perpetual, and my wound desperate so as to refuse to be healed? it is become to me as the falsehood of deceitful waters that cannot be trusted."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "propter hoc haec dicit Dominus si converteris convertam te et ante faciem meam stabis et si separaveris pretiosum a vili quasi os meum eris convertentur ipsi ad te et tu non converteris ad eos"
      en: "Therefore thus saith the Lord: If thou wilt be converted, I will convert thee, and thou shalt stand before my face; and if thou wilt separate the precious from the vile, thou shalt be as my mouth: they shall be turned to thee, and thou shalt not be turned to them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et dabo te populo huic in murum aereum fortem et bellabunt adversum te et non praevalebunt quia ego tecum sum ut salvem te et eruam dicit Dominus"
      en: "And I will make thee to this people as a strong wall of brass: and they shall fight against thee, and shall not prevail: for I am with thee to save thee, and to deliver thee, saith the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et liberabo te de manu pessimorum et redimam te de manu fortium"
      en: "And I will deliver thee out of the hand of the wicked, and I will redeem thee out of the hand of the mighty."
    status: { la: verified, en: verified }
