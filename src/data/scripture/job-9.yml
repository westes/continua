# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 9
verses:
  - n: 1
    text:
      la: "Et respondens Job, ait:"
      en: "And Job answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Vere scio quod ita sit, et quod non justificetur homo compositus Deo."
      en: "Indeed I know it is so, and that man cannot be justified compared with God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Si voluerit contendere cum eo, non poterit ei respondere unum pro mille."
      en: "If he will contend with him, he cannot answer him one for a thousand."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sapiens corde est, et fortis robore: quis restitit ei, et pacem habuit?"
      en: "He is wise in heart, and mighty in strength: who hath resisted him, and hath had peace?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui transtulit montes, et nescierunt hi quos subvertit in furore suo."
      en: "Who hath removed mountains, and they whom he overthrew in his wrath, knew it not."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui commovet terram de loco suo, et columnae ejus concutiuntur."
      en: "Who shaketh the earth out of her place, and the pillars thereof tremble."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui praecipit soli, et non oritur, et stellas claudit quasi sub signaculo."
      en: "Who commandeth the sun and it riseth not: and shutteth up the stars as it were under a seal:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui extendit caelos solus, et graditur super fluctus maris."
      en: "Who alone spreadeth out the heavens, and walketh upon the waves of the sea."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui facit Arcturum et Oriona, et Hyadas et interiora austri."
      en: "Who maketh Arcturus, and Orion, and Hyades, and the inner parts of the south."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui facit magna, et incomprehensibilia, et mirabilia, quorum non est numerus."
      en: "Who doth things great and incomprehensible, and wonderful, of which there is no number."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Si venerit ad me, non videbo eum; si abierit, non intelligam."
      en: "If he come to me, I shall not see him: if he depart I shall not understand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Si repente interroget, quis respondebit ei? vel quis dicere potest: Cur ita facis?"
      en: "If he examine on a sudden, who shall answer him? or who can say: Why dost thou so?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Deus, cujus irae nemo resistere potest, et sub quo curvantur qui portant orbem."
      en: "God, whose wrath no man can resist, and under whom they stoop that bear up the world."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quantus ergo sum ego, ut respondeam ei, et loquar verbis meis cum eo?"
      en: "What am I then, that I should answer him, and have words with him?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Qui, etiam si habuero quippiam justum, non respondebo: sed meum judicem deprecabor."
      en: "I, who although I should have any just thing, would not answer, but would make supplication to my judge."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et cum invocantem exaudierit me, non credo quod audierit vocem meam."
      en: "And if he should hear me when I call, I should not believe that he had heard my voice."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "In turbine enim conteret me, et multiplicabit vulnera mea, etiam sine causa."
      en: "For he shall crush me in a whirlwind, and multiply my wounds even without cause."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Non concedit requiescere spiritum meum, et implet me amaritudinibus."
      en: "He alloweth not my spirit to rest, and he filleth me with bitterness."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Si fortitudo quaeritur, robustissimus est; si aequitas judicii, nemo audet pro me testimonium dicere."
      en: "If strength be demanded, he is most strong: if equity of judgment, no man dare bear witness for me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Si justificare me voluero, os meum condemnabit me; si innocentem ostendero, pravum me comprobabit."
      en: "If I would justify myself, my own mouth shall condemn me: if I would shew myself innocent, he shall prove me wicked."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Etiam si simplex fuero, hoc ipsum ignorabit anima mea, et taedebit me vitae meae."
      en: "Although I should be simple, even this my soul shall be ignorant of, and I shall be weary of my life."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Unum est quod locutus sum: et innocentem et impium ipse consumit."
      en: "One thing there is that I have spoken, both the innocent and the wicked he consumeth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Si flagellat, occidat semel, et non de poenis innocentum rideat."
      en: "If he scourge, let him kill at once, and not laugh at the pains of the innocent."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Terra data est in manus impii, vultum judicum ejus operit. Quod si non ille est, quis ergo est?"
      en: "The earth is given into the hand of the wicked, he covereth the face of the judges thereof: and if it be not he, who is it then?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dies mei velociores fuerunt cursore; fugerunt, et non viderunt bonum."
      en: "My days have been swifter than a post: they have fled away and have not seen good."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Pertransierunt quasi naves poma portantes, sicut aquila volans ad escam."
      en: "They have passed by as ships carrying fruits, as an eagle flying to the prey."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cum dixero: Nequaquam ita loquar, commuto faciem meam, et dolore torqueor."
      en: "If I say: I will not speak so: I change my face, and am tormented with sorrow."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Verebar omnia opera mea, sciens quod non parceres delinquenti."
      en: "I feared all my works, knowing that thou didst not spare the offender."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Si autem et sic impius sum, quare frustra laboravi?"
      en: "But if so also I am wicked, why have I laboured in vain?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Si lotus fuero quasi aquis nivis, et fulserit velut mundissimae manus meae,"
      en: "If I be washed as it were with snow waters, and my hands shall shine ever so clean:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "tamen sordibus intinges me, et abominabuntur me vestimenta mea."
      en: "Yet thou shalt plunge me in filth, and my garments shall abhor me,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Neque enim viro qui similis mei est, respondebo; nec qui mecum in judicio ex aequo possit audiri."
      en: "For I shall not answer a man that is like myself: nor one that may be heard with me equally in judgment."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Non est qui utrumque valeat arguere, et ponere manum suam in ambobus."
      en: "There is none that may be able to reprove both, and to put his hand between both."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Auferat a me virgam suam, et pavor ejus non me terreat."
      en: "Let him take his rod away from me, and let not his fear terrify me."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Loquar, et non timebo eum; neque enim possum metuens respondere."
      en: "I will speak, and will not fear him: for I cannot answer while I am in fear."
    status: { la: verified, en: verified }
