# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1tim
chapter: 5
verses:
  - n: 1
    text:
      la: "Seniorem ne increpaveris, sed obsecra ut patrem: juvenes, ut fratres:"
      en: "An ancient man rebuke not, but entreat him as a father: young men, as brethren:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "anus, ut matres: juvenculas, ut sorores in omni castitate:"
      en: "Old women, as mothers: young women, as sisters, in all chastity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "viduas honora, quae vere viduae sunt."
      en: "Honour widows, that are widows indeed."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Si qua autem vidua filios, aut nepotes habet: discat primum domum suam regere, et mutuam vicem reddere parentibus: hoc enim acceptum est coram Deo."
      en: "But if any widow have children, or grandchildren, let her learn first to govern her own house, and to make a return of duty to her parents: for this is acceptable before God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quae autem vere vidua est, et desolata, speret in Deum, et instet obsecrationibus, et orationibus nocte ac die."
      en: "But she that is a widow indeed, and desolate, let her trust in God, and continue in supplications and prayers night and day."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nam quae in deliciis est, vivens mortua est."
      en: "For she that liveth in pleasures, is dead while she is living."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et hoc praecipe, ut irreprehensibiles sint."
      en: "And this give in charge, that they may be blameless."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si quis autem suorum, et maxime domesticorum, curam non habet, fidem negavit, et est infideli deterior."
      en: "But if any man have not care of his own, and especially of those of his house, he hath denied the faith, and is worse than an infidel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vidua eligatur non minus sexaginta annorum, quae fuerit unius viri uxor,"
      en: "Let a widow be chosen of no less than threescore years of age, who hath been the wife of one husband."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in operibus bonis testimonium habens, si filios educavit, si hospitio recepit, si sanctorum pedes lavit, si tribulationem patientibus subministravit, si omne opus bonum subsecuta est."
      en: "Having testimony for her good works, if she have brought up children, if she have received to harbour, if she have washed the saints' feet, if she have ministered to them that suffer tribulation, if she have diligently followed every good work."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Adolescentiores autem viduas devita: cum enim luxuriatae fuerint in Christo, nubere volunt:"
      en: "But the younger widows avoid. For when they have grown wanton in Christ, they will marry:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "habentes damnationem, quia primam fidem irritam fecerunt;"
      en: "Having damnation, because they have made void their first faith."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "simul autem et otiosae discunt circuire domos: non solum otiosae, sed et verbosae, et curiosae, loquentes quae non oportet."
      en: "And withal being idle they learn to go about from house to house: and are not only idle, but tattlers also, and busybodies, speaking things which they ought not."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Volo ergo juniores nubere, filios procreare, matresfamilias esse, nullam occasionem dare adversario maledicti gratia."
      en: "I will therefore that the younger should marry, bear children, be mistresses of families, give no occasion to the adversary to speak evil."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Jam enim quaedam conversae sunt retro Satanam."
      en: "For some are already turned aside after Satan."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Si quis fidelis habet viduas, subministret illis, et non gravetur ecclesia: ut iis quae vere viduae sunt, sufficiat."
      en: "If any of the faithful have widows, let him minister to them, and let not the church be charged: that there may be sufficient for them that are widows indeed."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Qui bene praesunt presbyteri, duplici honore digni habeantur: maxime qui laborant in verbo et doctrina."
      en: "Let the priests that rule well, be esteemed worthy of double honour: especially they who labour in the word and doctrine:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dicit enim Scriptura: Non alligabis os bovi trituranti. Et: Dignus est operarius mercede sua."
      en: "For the scripture saith: Thou shalt not muzzle the ox that treadeth out the corn: and, The labourer is worthy of his reward."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Adversus presbyterum accusationem noli recipere, nisi sub duobus aut tribus testibus."
      en: "Against a priest receive not an accusation, but under two or three witnesses."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Peccantes coram omnibus argue: ut et ceteri timorem habeant."
      en: "Them that sin reprove before all: that the rest also may have fear."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Testor coram Deo et Christo Jesu, et electis angelis, ut haec custodias sine praejudicio, nihil faciens in alteram partem declinando."
      en: "I charge thee before God, and Christ Jesus, and the elect angels, that thou observe these things without prejudice, doing nothing by declining to either side."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Manus cito nemini imposueris, neque communicaveris peccatis alienis. Teipsum castum custodi."
      en: "Impose not hands lightly upon any man, neither be partaker of other men's sins. Keep thyself chaste."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Noli adhuc aquam bibere, sed modico vino utere propter stomachum tuum, et frequentes tuas infirmitates."
      en: "Do not still drink water, but use a little wine for thy stomach's sake, and thy frequent infirmities."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Quorumdam hominum peccata manifesta sunt, praecedentia ad judicium: quosdam autem et subsequuntur."
      en: "Some men's sins are manifest, going before to judgment: and some men they follow after."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Similiter et facta bona, manifesta sunt: et quae aliter se habent, abscondi non possunt."
      en: "In like manner also good deeds are manifest: and they that are otherwise, cannot be hid."
    status: { la: verified, en: verified }
