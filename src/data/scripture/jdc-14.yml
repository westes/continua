# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 14
verses:
  - n: 1
    text:
      la: "Descendit ergo Samson in Thamnatha: vidensque ibi mulierem de filiabus Philisthiim,"
      en: "Then Samson went down to Thamnatha, and seeing there a woman of the daughters of the Philistines,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ascendit, et nuntiavit patri suo et matri suae, dicens: Vidi mulierem in Thamnatha de filiabus Philisthinorum: quam quaeso ut mihi accipiatis uxorem."
      en: "He came up, and told his father and his mother, saying: I saw a woman in Thamnatha of the daughters of the Philistines: I beseech you, take her for me to wife."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cui dixerunt pater et mater sua: Numquid non est mulier in filiabus fratrum tuorum, et in omni populo meo, quia vis accipere uxorem de Philisthiim, qui incircumcisi sunt? Dixitque Samson ad patrem suum: Hanc mihi accipe: quia placuit oculis meis."
      en: "And his father and mother said to him: Is there no woman among the daughters of thy brethren, or among all my people, that thou wilt take a wife of the Philistines, who are uncircumcised? And Samson said to his father: Take this woman for me, for she hath pleased my eyes."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Parentes autem ejus nesciebant quod res a Domino fieret, et quaereret occasionem contra Philisthiim: eo enim tempore Philisthiim dominabantur Israeli."
      en: "Now his parents knew not that the thing was done by the Lord, and that he sought an occasion against the Philistines: for at that time the Philistines had dominion over Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Descendit itaque Samson cum patre suo et matre in Thamnatha. Cumque venissent ad vineas oppidi, apparuit catulus leonis saevus, et rugiens, et occurrit ei."
      en: "Then Samson went down with his father and mother to Thamnatha. And when they were come to the vineyards of the town, behold a young lion met him raging and roaring."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Irruit autem spiritus Domini in Samson, et dilaceravit leonem, quasi haedum in frustra discerpens, nihil omnino habens in manu: et hoc patri et matri noluit indicare."
      en: "And the spirit of the Lord came upon Samson, and he tore the lion as he would have torn a kid in pieces, having nothing at all in his hand: and he would not tell this to his father and mother."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Descenditque et locutus est mulieri, quae placuerat oculis ejus."
      en: "And he went down and spoke to the woman that had pleased his eyes."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et post aliquot dies revertens ut acciperet eam, declinavit ut videret cadaver leonis, et ecce examen apum in ore leonis erat ac favus mellis."
      en: "And after some days returning to take her, he went aside to see the carcass of the lion, and behold there was a swarm of bees in the mouth of the lion and a honeycomb."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quem cum sumpsisset in manibus comedebat in via: veniensque ad patrem suum et matrem, dedit eis partem, qui et ipsi comederunt: nec tamen eis voluit indicare quod mel de corpore leonis assumpserat."
      en: "And when be had taken it in his hands, he went on eating: and coming to his father and mother, he gave them of it, and they ate: but he would not tell them, that he had taken the honey from the body of the lion."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Descendit itaque pater ejus ad mulierem, et fecit filio suo Samson convivium: sic enim juvenes facere consueverant."
      en: "So his father went down to the woman, and made a feast for his son Samson: for so the young men used to do."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cum ergo cives loci illius vidissent eum, dederunt ei sodales triginta ut essent cum eo."
      en: "And when the citizens of that place saw him, they brought him thirty companions to be with him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quibus locutus est Samson: Proponam vobis problema: quod si solveritis mihi intra septem dies convivii, dabo vobis triginta sindones, et totidem tunicas:"
      en: "And Samson said to them: I will propose to you a riddle, which if you declare unto me within the seven days of the feast, I will give you thirty shirts, and as many coats:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sin autem non potueritis solvere, vos dabitis mihi triginta sindones, et ejusdem numeri tunicas. Qui responderunt ei: Propone problema, ut audiamus."
      en: "But if you shall not be able to declare it, you shall give me thirty shirts and the same number of coats. They answered him: Put forth the riddle that we may hear it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixitque eis: De comedente exivit cibus, et de forti egressa est dulcedo. Nec potuerunt per tres dies propositionem solvere."
      en: "And he said to them: Out of the eater came forth meat, and out of the strong came forth sweetness. And they could not in three days expound the riddle."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque adesset dies septimus, dixerunt ad uxorem Samson: Blandire viro tuo et suade ei ut indicet tibi quid significet problema: quod si facere nolueris, incendemus te, et domum patris tui: an idcirco vocastis nos ad nuptias ut spoliaretis?"
      en: "And when the seventh day came, they said to the wife of Samson: Soothe thy husband, and persuade him to tell thee what the riddle meaneth. But if thou wilt not do it, we will burn thee, and thy father's house. Have you called us to the wedding on purpose to strip us?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quae fundebat apud Samson lacrimas, et quaerebatur, dicens: Odisti me, et non diligis: idcirco problema, quod proposuisti filiis populi mei, non vis mihi exponere. At ille respondit: Patri meo et matri nolui dicere: et tibi indicare potero?"
      en: "So she wept before Samson and complained, saying: Thou hatest me, and dost not love me: therefore thou wilt not expound to me the riddle which thou hast proposed to the sons of my people. But he answered: I would not tell it to my father and mother, and how can I tell it to thee?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Septem igitur diebus convivii flebat ante eum: tandemque die septimo cum ei esset molesta, exposuit. Quae statim indicavit civibus suis."
      en: "So she wept before him the seven days of the feast: and at length on the seventh day as she was troublesome to him, he expounded it. And she immediately told her countrymen."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et illi dixerunt ei die septimo ante solis occubitum: Quid dulcius melle, et quid fortius leone? Qui ait ad eos: Si non arassetis in vitula mea, non invenissetis propositionem meam."
      en: "And they on the seventh day before the sun went down said to him: What is sweeter than honey? and what is stronger than a lion? And he said to them: If you had not ploughed with my heifer, you had not found out my riddle."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Irruit itaque in eum spiritus Domini, descenditque Ascalonem, et percussit ibi triginta viros: quorum ablatas vestes dedit iis qui problema solverant. Iratusque nimis ascendit in domum patris sui:"
      en: "And the spirit of the Lord came upon him, and he went down to Ascalon, and slew there thirty men, whose garments he took away and gave to them that had declared the riddle. And being exceeding angry he went up to his father's house:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "uxor autem ejus accepit maritum unum de amicis ejus et pronubis."
      en: "But his wife took one of his friends and bridal companions for her husband."
    status: { la: verified, en: verified }
