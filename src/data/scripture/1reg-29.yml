# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1reg
chapter: 29
verses:
  - n: 1
    text:
      la: "congregata sunt ergo Philisthim universa agmina in Afec sed et Israhel castrametatus est super fontem qui erat in Iezrahel"
      en: "Now all the troops of the Philistines were gathered together to Aphec: and Israel also camped by the fountain which is in Jezrahel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et satrapae quidem Philisthim incedebant in centuriis et milibus David autem et viri eius erant in novissimo agmine cum Achis"
      en: "And the lords of the Philistines marched with their hundreds and their thousands: but David and his men were in the rear with Achis."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixeruntque principes Philisthim quid sibi volunt Hebraei isti et ait Achis ad principes Philisthim num ignoratis David qui fuit servus Saul regis Israhel et est apud me multis diebus vel annis et non inveni in eo quicquam ex die qua transfugit ad me usque ad diem hanc"
      en: "And the princes of the Philistines said to Achis: What mean these Hebrews? And Achis said to the princes of the Philistines: Do you not know David, who was the servant of Saul the king of Israel, and hath been with me many days, or years, and I have found no fault in him, since the day that he fled over to me until this day?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "irati sunt autem adversus eum principes Philisthim et dixerunt ei revertatur vir et sedeat in loco suo in quo constituisti eum et non descendat nobiscum in proelium ne fiat nobis adversarius cum proeliari coeperimus quomodo enim aliter placare poterit dominum suum nisi in capitibus nostris"
      en: "But the princes of the Philistines were angry with him, and they said to him: Let this man return, and abide in his place, which thou hast appointed him, and let him not go down with us to battle, lest he be an adversary to us, when we shall begin to fight: for how can he otherwise appease his master, but with our heads?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nonne iste est David cui cantabant in choro dicentes percussit Saul in milibus suis et David in decem milibus suis"
      en: "Is not this David, to whom they sung in their dances, saying: Saul slew his thousands, and David his ten thousands?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "vocavit ergo Achis David et ait ei vivit Dominus quia rectus es tu et bonus in conspectu meo et exitus tuus et introitus tuus mecum est in castris et non inveni in te quicquam mali ex die qua venisti ad me usque ad diem hanc sed satrapis non places"
      en: "Then Achis called David, and said to him: As the Lord liveth, thou art upright and good in my sight: and so is thy going out, and thy coming in with me in the army: and I have not found my evil in thee, since the day that thou camest to me unto this day: but thou pleasest not the lords."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "revertere ergo et vade in pace et non offendes oculos satraparum Philisthim"
      en: "Return therefore, and go in peace, and offend not the eyes of the princes of the Philistines."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixitque David ad Achis quid enim feci et quid invenisti in me servo tuo a die qua fui in conspectu tuo usque in diem hanc ut non veniam et pugnem contra inimicos domini mei regis"
      en: "And David said to Achis: But what have I done, and what hast thou found in me thy servant, from the day that I have been in thy sight until this day, that I may not go and fight against the enemies of my lord the king?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "respondens autem Achis locutus est ad David scio quia bonus es tu in oculis meis sicut angelus Dei sed principes Philisthim dixerunt non ascendet nobiscum in proelium"
      en: "And Achis answering said to David: I know that thou art good in my sight, as an angel of God: but the princes of the Philistines have said: He shall not go up with us to the battle."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "igitur consurge mane tu et servi domini tui qui venerunt tecum et cum de nocte surrexeritis et coeperit dilucescere pergite"
      en: "Therefore arise in the morning, thou, and the servants of thy lord, who came with thee: and when you are up before day, and it shall begin to be light, go on your way."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "surrexit itaque de nocte David ipse et viri eius ut proficiscerentur mane et reverterentur ad terram Philisthim Philisthim autem ascenderunt in Iezrahel"
      en: "So David and his men arose in the night, that they might set forward in the morning, and returned to the land of the Philistines: and the Philistines went up to Jezrahel."
    status: { la: verified, en: verified }
