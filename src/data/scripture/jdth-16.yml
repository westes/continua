# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdth
chapter: 16
verses:
  - n: 1
    text:
      la: "Tunc cantavit canticum hoc Domino Judith, dicens:"
      en: "Then Judith sung this canticle to the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Incipite Domino in tympanis; cantate Domino in cymbalis; modulamini illi psalmum novum: exaltate, et invocate nomen ejus."
      en: "Begin ye to the Lord with timbrels, sing ye to the Lord with cymbals, tune unto him a new psalm, extol and call upon his name."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dominus conterens bella, Dominus nomen est illi."
      en: "The Lord putteth an end to wars, the Lord is his name."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui posuit castra sua in medio populi sui, ut eriperet nos de manu omnium inimicorum nostrorum."
      en: "He hath set his camp in the midst of his people, to deliver us from the hand of all our enemies."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Venit Assur ex montibus ab aquilone in multitudine fortitudinis suae: cujus multitudo obturavit torrentes, et equi eorum cooperuerunt valles."
      en: "The Assyrians came out of the mountains from the north in the multitude of his strength: his multitude stopped up the torrents, and their horses covered the valleys."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixit se incensurum fines meos, et juvenes meos occisurum gladio; infantes meos dare in praedam, et virgines in captivitatem."
      en: "He bragged that he would set my borders on fire, and kill my young men with the sword, to make my infants a prey, and my virgins captives."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dominus autem omnipotens nocuit eum, et tradidit eum in manus feminae, et confodit eum."
      en: "But the almighty Lord hath struck him, and hath delivered him into the hands of a woman, and hath slain him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non enim cecidit potens eorum a juvenibus, nec filii Titan percusserunt eum, nec excelsi gigantes opposuerunt se illi: sed Judith filia Merari in specie faciei suae dissolvit eum."
      en: "For their mighty one did not fall by young men, neither did the sons of Titan strike him, nor tall giants oppose themselves to him, but Judith the daughter of Merari weakened him with the beauty of her face."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Exuit enim se vestimento viduitatis, et induit se vestimento laetitiae in exultatione filiorum Israel."
      en: "For she put off her the garments of widowhood, and put on her the garments of joy, to give joy to the children of Israel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Unxit faciem suam unguento, et colligavit cincinnos suos mitra; accepit stolam novem ad decipiendum illum."
      en: "She anointed her face with ointment, and bound up her locks with a crown, she took a new robe to deceive him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sandalia ejus rapuerunt oculos ejus; pulchritudo ejus captivam fecit animam ejus: amputavit pugione cervicem ejus."
      en: "Her sandals ravished his eyes, her beauty made his soul her captive, with a sword she cut off his head."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Horruerunt Persae constantiam ejus, et Medi audaciam ejus."
      en: "The Persians quaked at her constancy, and the Medes at her boldness."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tunc ululaverunt castra Assyriorum, quando apparuerunt humiles mei, arescentes in siti."
      en: "Then the camp of the Assyrians howled, when my lowly ones appeared, parched with thirst."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Filii puellarum compunxerunt eos, et sicut pueros fugientes occiderunt eos: perierunt in praelio a facie Domini Dei mei."
      en: "The sons of the damsels have pierced them through, and they have killed them like children fleeing away: they perished in battle before the face of the Lord my God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Hymnum cantemus Domino; hymnum novum cantemus Deo nostro."
      en: "Let us sing a hymn to the Lord, let us sing a new hymn to our God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Adonai Domine, magnus es tu, et praeclarus in virtute tua: et quem superare nemo potest."
      en: "O Adonai, Lord, great art thou, and glorious in thy power, and no one can overcome thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tibi serviat omnis creatura tua, quia dixisti, et facta sunt; misisti spiritum tuum, et creata sunt: et non est qui resistat voci tuae."
      en: "Let all thy creatures serve thee: because thou hast spoken, and they were made: thou didst send forth thy spirit, and they were created, and there is no one that can resist thy voice."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Montes a fundamentis movebuntur cum aquis: petrae, sicut cera, liquescent ante faciem tuam."
      en: "The mountains shall be moved from the foundations with the waters: the rocks shall melt as wax before thy face."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Qui autem timent te, magni erunt apud te per omnia."
      en: "But they that fear thee, shall be great with thee in all things."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vae genti insurgenti super genus meum: Dominus enim omnipotens vindicabit in eis; in die judicii visitabit illos."
      en: "Woe be to the nation that riseth up against my people: for the Lord almighty will take revenge on them, in the day of judgment he will visit them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dabit enim ignem et vermes in carnes eorum, ut urantur et sentiant usque in sempiternum."
      en: "For he will give fire, and worms into their flesh, that they may burn, and may feel for ever."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et factum est post haec, omnis populus post victoriam venit in Jerusalem adorare Dominum: et mox ut purificati sunt, obtulerunt omnes holocausta, et vota, et repromissiones suas."
      en: "And it came to pass after these things, that all the people, after the victory, came to Jerusalem to adore the Lord: and as soon as they were purified, they all offered holocausts, and vows, and their promises."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Porro Judith universa vasa bellica Holofernis, quae dedit illi populus, et conopeum, quod ipsa sustulerat de cubili ipsius, obtulit in anathema oblivionis."
      en: "And Judith offered for an anathema of oblivion all the arms of Holofernes, which the people gave her, and the canopy that she had taken away out of his chamber."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Erat autem populus jucundus secundum faciem sanctorum: et per tres menses gaudium hujus victoriae celebratum est cum Judith."
      en: "And the people were joyful in the sight of the sanctuary, and for three months the joy of this victory was celebrated with Judith."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Post dies autem illos, unusquisque rediit in domum suam: et Judith magna facta est in Bethulia, et praeclarior erat universae terrae Israel."
      en: "And after those days every man returned to his house, and Judith was made great in Bethulia, and she was most renowned in all the land of Israel."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Erat enim virtuti castitas adjuncta, ita ut non cognosceret virum omnibus diebus vitae suae, ex quo defunctus est Manasses, vir ejus."
      en: "And chastity was joined to her virtue, so that she knew no man all the days of her life, after the death of Manasses her husband."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Erat autem, diebus festis, procedens cum magna gloria."
      en: "And on festival days she came forth with great glory."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Mansit autem in domo viri sui annos centum quinque, et dimisit abram suam liberam, et defuncta est ac sepulta cum viro suo in Bethulia."
      en: "And she abode in her husband's house a hundred and five years, and made her handmaid free, and she died, and was buried with her husband in Bethulia."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Luxitque illam omnis populus diebus septem."
      en: "And all the people mourned for seven days."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "In omni autem spatio vitae ejus non fuit qui perturbaret Israel, et post mortem ejus annis multis."
      en: "And all the time of her life there was none that troubled Israel, nor many years after her death."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Dies autem victoriae hujus festivitatis ab Hebraeis in numero sanctorum dierum accipitur, et colitur a Judaeis ex illo tempore usque in praesentem diem."
      en: "But the day of the festivity of this victory is received by the Hebrews in the number of holy days, and is religiously observed by the Jews from that time until this day."
    status: { la: verified, en: verified }
