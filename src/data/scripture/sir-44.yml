# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 44
verses:
  - n: 1
    text:
      la: "laus patrum laudemus viros gloriosos et parentes nostros in generatione sua"
      en: "Let us now praise men of renown, and our fathers in their generation."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "multam gloriam fecit Dominus magnificentia sua a saeculo"
      en: "The Lord hath wrought great glory through his magnificence from the beginning."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dominantes in potestatibus suis homines magni virtute et prudentia sua praediti nuntiantes in dignitate prophetarum"
      en: "Such as have borne rule in their dominions, men of great power, and endued with their wisdom, shewing forth in the prophets the dignity of prophets,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et imperantes in praesenti populo et virtute prudentiae populi sanctissima verba"
      en: "And ruling over the present people, and by the strength of wisdom instructing the people in most holy words."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in pueritia sua requirentes modos musicos et narrantes carmina in scriptura"
      en: "Such as by their skill sought out musical tunes, and published canticles of the scriptures."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "homines divites in virtute pulchritudinis studium habentes pacificantes in domibus suis"
      en: "Rich men in virtue, studying beautifulness: living at peace in their houses."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "omnes isti in generationibus gentis suae gloriam adepti sunt et in diebus suis habentur in laudibus"
      en: "All these have gained glory in their generations, and were praised in their days."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui de illis nati sunt reliquerunt nomen narrandi laudes eorum"
      en: "They that were born of them have left a name behind them, that their praises might be related:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et sunt quorum non est memoria perierunt quasi non fuerint et nati sunt quasi non nati et filii ipsorum cum illis"
      en: "And there are some, of whom there is no memorial: who are perished, as if they had never been: and are become as if they had never been born, and their children with them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sed illi viri misericordiae sunt quorum pietates non defuerunt"
      en: "But these were men of mercy, whose godly deeds have not failed:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et cum semine ipsorum perseverat bona"
      en: "Good things continue with their seed,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "hereditas nepotum illorum et in testamentis stetit semen eorum"
      en: "Their posterity are a holy inheritance, and their seed hath stood in the covenants."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et filii ipsorum propter illos usque in aeternum manet semen eorum et gloria eorum non derelinquetur"
      en: "And their children for their sakes remain for ever: their seed and their glory shall not be forsaken."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "corpora ipsorum in pace sepulta sunt et nomen eorum vivet in generationes et generationes"
      en: "Their bodies are buried in peace, and their name liveth unto generation and generation."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sapientiam ipsorum narrent populi laudem eorum nuntiet ecclesia"
      en: "Let the people shew forth their wisdom, and the church declare their praise."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Enoch placuit Deo et translatus est in paradiso ut det gentibus paenitentiam"
      en: "Henoch pleased God, and was translated into paradise, that he may give repentance to the nations."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Noe inventus est perfectus iustus et in tempore iracundiae factus est reconciliatio"
      en: "Noe was found perfect, just, and in the time of wrath he was made a reconciliation."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ideo dimissum est reliquum terrae cum factum est diluvium"
      en: "Therefore was there a remnant left to the earth, when the flood came."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "testamenta saeculi posita sunt apud illum ne deleri possit diluvio omnis caro"
      en: "The covenants of the world were made with him, that all flesh should no more be destroyed with the hood."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Abraham magnus pater multitudinis gentium et non est inventus similis illi in gloria qui conservavit legem Excelsi et fuit in testamento cum illo"
      en: "Abraham was the great father of a multitude of nations, and there was not found the like to him in glory, who kept the law of the most High, and was in covenant with him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "in carne eius stare fecit testamentum et in temptatione inventus est fidelis"
      en: "In his flesh he established the covenant, and in temptation he was found faithful."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ideo iureiurando dedit illi semen in gente sua crescere illum quasi terrae cumulum"
      en: "Therefore by an oath he gave him glory in his posterity, that he should increase as the dust of the earth,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et ut stellas exaltare semen eius et hereditari illos a mari usque ad mare et a Flumine usque ad terminos terrae"
      en: "And that he would exalt his seed as the stars, and they should inherit from sea to sea, and from the river to the ends of the earth."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et in Isaac eodem fecit modo propter Abraham patrem ipsius"
      en: "And he did in like manner with Isaac for the sake of Abraham his father."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "benedictionem omnium gentium dedit illi et testamentum confirmavit super caput Iacob"
      en: "The Lord gave him the blessing of all nations, and confirmed his covenant upon the head of Jacob."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "agnovit eum in benedictionibus suis et dedit illi hereditatem et divisit ei partem in tribus duodecim"
      en: "He acknowledged him in his blessings, and gave him an inheritance, and divided him his portion in twelve tribes."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et conservavit illis homines misericordiae invenientes gratiam in oculis omnis carnis"
      en: "And he preserved for him men of mercy, that found grace in the eyes of all flesh."
    status: { la: verified, en: verified }
