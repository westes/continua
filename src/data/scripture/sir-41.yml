# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 41
verses:
  - n: 1
    text:
      la: "O mors, quam amara est memoria tua homini pacem habenti in substantiis suis:"
      en: "O death, how bitter is the remembrance of thee to a man that hath peace in his possessions!"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "viro quieto, et cujus viae directae sunt in omnibus, et adhuc valenti accipere cibum!"
      en: "To a man that is at rest, and whose ways are prosperous in all things, and that is yet able to take meat!"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "O mors, bonum est judicium tuum homini indigenti, et qui minoratur viribus,"
      en: "O death, thy sentence is welcome to the man that is in need, and to him whose strength faileth:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "defecto aetate, et cui de omnibus cura est, et incredibili, qui perdit patientiam!"
      en: "Who is in a decrepit age, and that is in care about all things, and to the distrustful that loseth patience!"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Noli metuere judicium mortis: memento quae ante te fuerunt, et quae superventura sunt tibi: hoc judicium a Domino omni carni."
      en: "Fear not the sentence of death. Remember what things have been before thee, and what shall come after thee: this sentence is from the Lord upon all flesh."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et quid superveniet tibi in beneplacito Altissimi? sive decem, sive centum, sive mille anni:"
      en: "And what shall come upon thee by the good pleasure of the most High? Whether ten, or a hundred, or a thousand years."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "non est enim in inferno accusatio vitae."
      en: "For among the dead there is no accusing of life."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Filii abominationum fiunt filii peccatorum, et qui conversantur secus domos impiorum."
      en: "The children of sinners become children of abominations, and they that converse near the houses of the ungodly."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Filiorum peccatorum periet haereditas, et cum semine illorum assiduitas opprobrii."
      en: "The inheritance of the children of sinners shall perish, and with their posterity shall be a perpetual reproach."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "De patre impio queruntur filii, quoniam propter illum sunt in opprobrio."
      en: "The children will complain of an ungodly father, because for his sake they are in reproach."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vae vobis, viri impii, qui dereliquistis legem Domini Altissimi!"
      en: "Woe to you, ungodly men, who have forsaken the law of the most high Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et si nati fueritis, in maledictione nascemini: et si mortui fueritis, in maledictione erit pars vestra."
      en: "And if you be born, you shall be born in malediction: and if you die, in malediction shall be your portion."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Omnia quae de terra sunt in terram convertentur: sic impii a maledicto in perditionem."
      en: "All things that are of the earth, shall return into the earth: so the ungodly shall from malediction to destruction."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Luctus hominum in corpore ipsorum: nomen autem impiorum delebitur."
      en: "The mourning of men is about their body, but the name of the ungodly shall be blotted out."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Curam habe de bono nomine: hoc enim magis permanebit tibi quam mille thesauri pretiosi et magni."
      en: "Take care of a good name: for this shall continue with thee, more than a thousand treasures precious and great."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Bonae vitae numerus dierum: bonum autem nomen permanebit in aevum."
      en: "A good life hath its number of days: but a good name shall continue for ever."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Disciplinam in pace conservate, filii: sapientia enim abscondita, et thesaurus invisus, quae utilitas in utrisque?"
      en: "My children, keep discipline in peace: for wisdom that is hid, and a treasure that is not seen, what profit is there in them both?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Melior est homo qui abscondit stultitiam suam, quam homo qui abscondit sapientiam suam."
      en: "Better is the man that hideth his folly, than the man that hideth his wisdom."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Verumtamen reveremini in his quae procedunt de ore meo:"
      en: "Wherefore have a shame of these things I am now going to speak of."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "non est enim bonum omnem reverentiam observare, et non omnia omnibus bene placent in fide."
      en: "For it is not good to keep all shamefacedness: and all things do not please all men in opinion."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Erubescite a patre et a matre de fornicatione: et a praesidente et a potente de mendacio:"
      en: "Be ashamed of fornication before father and mother: and of a lie before a governor and a man in power:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "a principe et a judice de delicto: a synagoga et plebe de iniquitate:"
      en: "Of an offence before a prince, and a judge: of iniquity before a congregation and a people:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "a socio et amico de injustitia, et de loco in quo habitas:"
      en: "Of injustice before a companion and friend: and in regard to the place where thou dwellest,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "de furto, de veritate Dei, et testamento: de discubitu in panibus, et ab obfuscatione dati et accepti:"
      en: "Of theft, and of the truth of God, and the covenant: of leaning with thy elbow over meat, and of deceit in giving and taking:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "a salutantibus de silentio, a respectu mulieris fornicariae, et ab aversione vultus cognati."
      en: "Of silence before them that salute thee: of looking upon a harlot: and of turning away thy face from thy kinsman."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ne avertas faciem a proximo tuo, et ab auferendo partem et non restituendo."
      en: "Turn not away thy face from thy neighbour, and of taking away a portion and not restoring."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ne respicias mulierem alieni viri, et ne scruteris ancillam ejus, neque steteris ad lectum ejus."
      en: "Gaze not upon another man's wife, and be not inquisitive after his handmaid, and approach not her bed."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ab amicis de sermonibus improperii: et cum dederis, ne improperes."
      en: "Be ashamed of upbraiding speeches before friends: and after thou hast given, upbraid not."
    status: { la: verified, en: verified }
