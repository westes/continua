# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdc
chapter: 6
verses:
  - n: 1
    text:
      la: "fecerunt autem filii Israhel malum in conspectu Domini qui tradidit eos in manu Madian septem annis"
      en: "1O And I said: I am the Lord your God, fear not the gods of the Amorrhites, in whose land you dwell. And you would not hear my voice."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et oppressi sunt valde ab eis feceruntque sibi antra et speluncas in montibus et munitissima ad repugnandum loca"
      en: "And they were grievously oppressed by them. And they made themselves dens and eaves in the mountains, and strong holds to resist."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cumque sevisset Israhel ascendebat Madian et Amalech et ceteri orientalium nationum"
      en: "And when Israel had sown, Madian and Amalec, and the rest of the eastern nations came up:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et apud eos figentes tentoria sicut erant in herbis cuncta vastabant usque ad introitum Gazae nihilque omnino ad vitam pertinens relinquebant in Israhel non oves non boves non asinos"
      en: "And pitching their tents among them, wasted all things as they were in the blade even to the entrance of Gaza: and they left nothing at all in Israel for sustenance of life, nor sheep, nor oxen, nor asses."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ipsi enim et universi greges eorum veniebant cum tabernaculis et instar lucustarum universa conplebant innumera multitudo hominum et camelorum quicquid tetigerant devastantes"
      en: "For they and all their flocks came with their tents, and like locusts filled all places, an innumerable multitude of men, and of camels, wasting whatsoever they touched."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "humiliatusque est Israhel valde in conspectu Madian"
      en: "And Israel was humbled exceedingly in the sight of Madian."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et clamavit ad Dominum postulans auxilium contra Madianitas"
      en: "And he cried to the Lord desiring help against the Madianites."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui misit ad eos virum prophetam et locutus est haec dicit Dominus Deus Israhel ego vos feci conscendere de Aegypto et eduxi de domo servitutis"
      en: "And he sent unto them a prophet, and he spoke: Thus saith the Lord the God of Israel: I made you to come up out of Egypt, and brought you out of the house of bondage,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et liberavi de manu Aegyptiorum et omnium inimicorum qui adfligebant vos eiecique eos ad introitum vestrum et tradidi vobis terram eorum"
      en: "And delivered you out of the hands of the Egyptians, and of all the enemies that afflicted you: and I cast them out at your coming in, and gave you their land."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dixi ego Dominus Deus vester ne timeatis deos Amorreorum in quorum terra habitatis et noluistis audire vocem meam"
      en: ""
    status: { la: verified, en: missing }
  - n: 11
    text:
      la: "venit autem angelus Domini et sedit sub quercu quae erat in Ephra et pertinebat ad Ioas patrem familiae Ezri cumque Gedeon filius eius excuteret atque purgaret frumenta in torculari ut fugeret Madian"
      en: "And an angel of the Lord came, and sat under an oak, that was in Ephra, and belonged to Joas the father of the family of Ezri. And when Gedeon his son was threshing and cleansing wheat by the winepress, to flee from Madian,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "apparuit ei et ait Dominus tecum virorum fortissime"
      en: "The angel of the Lord appeared to him, and said: The Lord is with thee, O most valiant of men."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixitque ei Gedeon obsecro Domine si Dominus nobiscum est cur adprehenderunt nos haec omnia ubi sunt mirabilia eius quae narraverunt patres nostri atque dixerunt de Aegypto eduxit nos Dominus nunc autem dereliquit nos et tradidit in manibus Madian"
      en: "And Gedeon said to him: I beseech thee, my lord, if the Lord be with us, why have these evils fallen upon us? Where are his miracles, which our fathers have told us of, saying: The Lord brought us Out of Egypt? but now the Lord hath forsaken us, and delivered us into the bands of Madian."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "respexitque ad eum Dominus et ait vade in hac fortitudine tua et liberabis Israhel de manu Madian scito quod miserim te"
      en: "And the Lord looked upon him, and said: Go in this thy strength, and then shalt deliver Israel out of the hand of Madian: know that I have sent thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui respondens ait obsecro Domine mi in quo liberabo Israhel ecce familia mea infima est in Manasse et ego minimus in domo patris mei"
      en: "He answered and said: I beseech thee, my lord, wherewith shall I deliver Israel? Behold my family is the meanest in Manasses, and I am the least in my father's house."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixitque ei Dominus ego ero tecum et percuties Madian quasi unum virum"
      en: "And the Lord said to him: I will be with thee: and thou shalt cut off Madian as one man."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ille si inveni inquit gratiam coram te da mihi signum quod tu sis qui loquaris ad me"
      en: "And he said: If I have found grace before thee, give me a sign that it is thou that speakest to me,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ne recedas hinc donec revertar ad te portans sacrificium et offerens tibi qui respondit ego praestolabor adventum tuum"
      en: "And depart not hence, till I return to thee, and bring a sacrifice, and offer it to thee. And he answered: I will wait thy coming."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ingressus est itaque Gedeon et coxit hedum et de farinae modio azymos panes carnesque ponens in canistro et ius carnium mittens in ollam tulit omnia sub quercum et obtulit ei"
      en: "So Gedeon went in, and boiled a kid, and made unleavened loaves of a measure of flour: and putting the flesh in a basket, and the broth of the flesh into a pot, he carried all under the oak, and presented to him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "cui dixit angelus Domini tolle carnes et panes azymos et pone super petram illam et ius desuper funde cumque fecisset ita"
      en: "And the angel of the Lord said to him: Take the flesh and the unleavened loaves, and lay them upon that rock, and pour out the broth thereon. And when he had done so,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "extendit angelus Domini summitatem virgae quam tenebat in manu et tetigit carnes et azymos panes ascenditque ignis de petra et carnes azymosque consumpsit angelus autem Domini evanuit ex oculis eius"
      en: "The angel of the Lord put forth the tip of the rod, which he held in his hand, and touched the flesh and the unleavened loaves: and there arose a fire from the rock, and consumed the flesh and the unleavened loaves: and the angel of the Lord vanished out of his sight."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vidensque Gedeon quod esset angelus Domini ait heu mihi Domine Deus quia vidi angelum Domini facie ad faciem"
      en: "And Gedeon seeing that it was the angel of the Lord, said: Alas, my Lord God: for I have seen the angel of the Lord face to face."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dixitque ei Dominus pax tecum ne timeas non morieris"
      en: "And the Lord said to him: Peace be with thee: fear not, thou shalt not die."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "aedificavit ergo ibi Gedeon altare Domino vocavitque illud Domini pax usque in praesentem diem cum adhuc esset in Ephra quae est familiae Ezri"
      en: "And Gedeon built there an altar to the Lord, and called it the Lord's peace, until this present day. And when he was yet in Ephra, which is of the family of Ezri,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "nocte illa dixit Dominus ad eum tolle taurum patris tui et alterum taurum annorum septem destruesque aram Baal quae est patris tui et nemus quod circa aram est succide"
      en: "That night the Lord said to him: Take a bullock of thy father's, and another bullock of seven years, and thou shalt destroy the altar of Baal, which is thy father's: and cut down the grove that is about the altar:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et aedificabis altare Domino Deo tuo in summitate petrae huius super quam sacrificium ante posuisti tollesque taurum secundum et offeres holocaustum super lignorum struem quae de nemore succideris"
      en: "And thou shalt build an altar to the Lord thy God in the top of this rock, whereupon thou didst lay the sacrifice before: and thou shalt take the second bullock, and shalt offer a holocaust upon a pile of the wood, which thou shalt cut down out of the grove."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "adsumptis igitur Gedeon decem viris de servis suis fecit sicut praeceperat Dominus timens autem domum patris sui et homines illius civitatis per diem facere noluit sed omnia nocte conplevit"
      en: "Then Gedeon taking ten men of his servants, did as the Lord had commanded him. But fearing his father's house, and the men of that city, he would not do it by day, but did all by night."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "cumque surrexissent viri oppidi eius mane viderunt destructam aram Baal lucumque succisum et taurum alterum inpositum super altare quod tunc aedificatum erat"
      en: "And when the men of that town were risen in the morning, they saw the altar of Baal destroyed, and the grove cut down, and the second bullock laid upon the altar, which then was built."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "dixeruntque ad invicem quis hoc fecit cumque perquirerent auctorem facti dictum est Gedeon filius Ioas fecit haec omnia"
      en: "And they said one to another: Who hath done this? And when they inquired for the author of the fact, it was said: Gedeon the son of Joas did all this."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et dixerunt ad Ioas produc filium tuum ut moriatur quia destruxit aram Baal et succidit nemus"
      en: "And they said to Joas: Bring out thy son hither, that he may die: because he hath destroyed the altar of Baal, and hath cut down his grove."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quibus ille respondit numquid ultores estis Baal et pugnatis pro eo qui adversarius eius est moriatur antequam lux crastina veniat si deus est vindicet se de eo qui suffodit aram eius"
      en: "He answered them: Are you the avengers of Baal, that you fight for him? he that is his adversary, let him die before to morrow light appear: if he be a god, let him revenge himself on him that hath cast down his altar."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ex illo die vocatus est Gedeon Hierobbaal eo quod dixisset Ioas ulciscatur se de eo Baal qui suffodit altare eius"
      en: "From that day Gedeon was called Jerobaal, because Joss had said: Let Baal revenge himself on him that hath cast down his altar."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "igitur omnis Madian et Amalech et orientales populi congregati sunt simul et transeuntes Iordanem castrametati sunt in valle Iezrahel"
      en: "Now all Madian, and Amalec, and the eastern people were gathered together, and passing over the Jordan, camped in the valley of Jezrael."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "spiritus autem Domini induit Gedeon qui clangens bucina convocavit domum Abiezer ut sequeretur"
      en: "But the spirit of the Lord came upon Gedeon, and be sounded the trumpet and called together the house of Abiezer, to follow him."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "misitque nuntios in universum Manassen qui et ipse secutus est eum et alios nuntios in Aser et Zabulon et Nepthalim qui occurrerunt ei"
      en: "And he sent messengers into all Manasses, and they also followed him: and other messengers into Aser and Zabulon and Nephtali, and they came to meet him."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dixitque Gedeon ad Dominum si salvum facis per manum meam Israhel sicut locutus es"
      en: "And Gedeon said to God: If thou wilt save Israel by my hand, as thou hast said,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "ponam vellus hoc lanae in area si ros in solo vellere fuerit et in omni terra siccitas sciam quod per manum meam sicut locutus es liberabis Israhel"
      en: "I will put this fleece of wool on the floor: if there be dew on the fleece only, and it be dry on all the ground beside, I, shall know that by my hand, as thou hast said, thou wilt deliver Israel."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "factumque est ita et de nocte consurgens expresso vellere concam rore conplevit"
      en: "And it was so. And rising before day wringing the fleece, he filled a vessel with the dew."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "dixitque rursus ad Dominum ne irascatur furor tuus contra me si adhuc semel temptavero signum quaerens in vellere oro ut solum vellus siccum sit et omnis terra rore madens"
      en: "And he said again to God: let not thy wrath be kindled against me if I try once more, seeking a sign in the fleece. I pray that the fleece only may be dry, and all the ground wet with dew."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "fecitque Dominus nocte illa ut postulaverat et fuit siccitas in solo vellere et ros in omni terra"
      en: "And God did that night as he had requested: and it was dry on the fleece only, and there was dew on all the ground."
    status: { la: verified, en: verified }
