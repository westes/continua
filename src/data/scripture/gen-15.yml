# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 15
verses:
  - n: 1
    text:
      la: "His itaque transactis, factus est sermo Domini ad Abram per visionem dicens: Noli timere, Abram: ego protector tuus sum, et merces tua magna nimis."
      en: "Now when these things were done, the word of the Lord came to Abram by a vision, saying: Fear not, Abram, I am thy protector, and thy reward exceeding great."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixitque Abram: Domine Deus, quid dabis mihi? ego vadam absque liberis, et filius procuratoris domus meae iste Damascus Eliezer."
      en: "And Abram said: Lord God, what wilt thou give me? I shall go without children: and the son of the steward of my house is this Damascus Eliezer."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Addiditque Abram: Mihi autem non dedisti semen, et ecce vernaculus meus, haeres meus erit."
      en: "And Abram added: But to me thou hast not given seed: and lo my servant, born in my house, shall be my heir."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Statimque sermo Domini factus est ad eum, dicens: Non erit hic haeres tuus, sed qui egredietur de utero tuo, ipsum habebis haeredem."
      en: "And immediately the word of the Lord came to him, saying: He shall not be thy heir: but he that shall come out of thy bowels, him shalt thou have for thy heir."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Eduxitque eum foras, et ait illi: Suscipe caelum, et numera stellas, si potes. Et dixit ei: Sic erit semen tuum."
      en: "And he brought him forth abroad, and said to him: Look up to heaven and number the stars, if thou canst. And he said to him: So shall thy seed be."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Credidit Abram Deo, et reputatum est illi ad justitiam."
      en: "Abram believed God, and it was reputed to him unto justice."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dixitque ad eum: Ego Dominus qui eduxi te de Ur Chaldaeorum ut darem tibi terram istam, et possideres eam."
      en: "And he said to him: I am the Lord who brought thee out from Ur of the Chaldees, to give thee this land, and that thou mightest possess it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "At ille ait: Domine Deus, unde scire possum quod possessurus sim eam?"
      en: "But he said: Lord God, whereby may I know that I shall possess it?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et respondens Dominus: Sume, inquit, mihi vaccam trienem, et capram trimam, et arietem annorum trium, turturem quoque et columbam."
      en: "And the Lord answered, and said: Take me a cow of three years old, and a she goat of three years, and a ram of three years, a turtle also, and a pigeon."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui tollens universa haec, divisit ea per medium, et utrasque partes contra se altrinsecus posuit; aves autem non divisit."
      en: "And he took all these, and divided them in the midst, and laid the two pieces of each one against the other; but the birds he divided not."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Descenderuntque volucres super cadavera, et abigebat eas Abram."
      en: "And the fowls came down upon the carcasses, and Abram drove them away."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cumque sol occumberet, sopor irruit super Abram, et horror magnus et tenebrosus invasit eum."
      en: "And when the sun was setting, a deep sleep fell upon Abram, and a great and darksome horror seized upon him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dictumque est ad eum: Scito praenoscens quod peregrinum futurum sit semen tuum in terra non sua, et subjicient eos servituti, et affligent quadringentis annis."
      en: "And it was said unto him: Know thou beforehand that thy seed shall be a stranger in a land not their own, and they shall bring them under bondage, and afflict them four hundred years."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Verumtamen gentem, cui servituri sunt, ego judicabo: et post haec egredientur cum magna substantia."
      en: "But I will judge the nation which they shall serve, and after this they shall come out with great substance."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Tu autem ibis ad patres tuos in pace, sepultus in senectute bona."
      en: "And thou shalt go to thy fathers in peace, and be buried in a good old age."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Generatione autem quarta revertentur huc: necdum enim completae sunt iniquitates Amorrhaeorum usque ad praesens tempus."
      en: "But in the fourth generation they shall return hither: for as yet the iniquities of the Amorrhites are not at the full until this present time."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cum ergo occubuisset sol, facta est caligo tenebrosa, et apparuit clibanus fumans, et lampas ignis transiens inter divisiones illas."
      en: "And when the sun was set, there arose a dark mist, and there appeared a smoking furnace and a lamp of fire passing between those divisions."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "In illo die pepigit Dominus foedus cum Abram, dicens: Semini tuo dabo terram hanc a fluvio Aegypti usque ad fluvium magnum Euphraten,"
      en: "That day God made a covenant with Abram, saying: To thy seed will I give this land, from the river of Egypt even to the great river Euphrates."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cinaeos, et Cenezaeos, Cedmonaeos,"
      en: "The Cineans and Cenezites, the Cedmonites,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et Hethaeos, et Pherezaeos, Raphaim quoque,"
      en: "And the Hethites, and the Pherezites, the Raphaim also,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et Amorrhaeos, et Chananaeos, et Gergesaeos, et Jebusaeos."
      en: "And the Amorrhites, and the Chanaanites, and the Gergesites, and the Jebusites."
    status: { la: verified, en: verified }
