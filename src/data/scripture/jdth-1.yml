# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdth
chapter: 1
verses:
  - n: 1
    text:
      la: "Arphaxad itaque, rex Medorum, subjugaverat multas gentes imperio suo, et ipse aedificavit civitatem potentissimam, quam appellavit Ecbatanis,"
      en: "Now Arphaxad king of the Medes had brought many nations under his dominions, and he built a very strong city, which he called Ecbatana,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ex lapidibus quadratis et sectis: fecit muros ejus in altitudinem cubitorum septuaginta, et in latitudinem cubitorum triginta, turres vero ejus posuit in altitudinem cubitorum centum."
      en: "Of stones squared and hewed: he made the walls thereof seventy cubits broad, and thirty cubits high, and the towers thereof he made a hundred cubits high. But on the square of them, each side was extended the space of twenty feet."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Per quadrum vero earum latus utrumque vicenorum pedum spatio tendebatur, posuitque portas ejus in altitudinem turrium:"
      en: "And he made the gates thereof according to the height of the towers:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et gloriabatur quasi potens in potentia exercitus sui, et in gloria quadrigarum suarum."
      en: "And he gloried as a mighty one in the force of his army and in the glory of his chariots."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Anno igitur duodecimo regni sui, Nabuchodonosor rex Assyriorum, qui regnabat in Ninive civitate magna, pugnavit contra Arphaxad, et obtinuit eum"
      en: "Now in the twelfth year of his reign, Nabuchodonosor king of the Assyrians, who reigned in Ninive the great city, fought against Arphaxad and overcame him,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in campo magno, qui appellatur Ragau, circa Euphraten, et Tigrin, et Jadason, in campo Erioch regis Elicorum."
      en: "In the great plain which is called Ragua, about the Euphrates, and the Tigris, and the Jadason, in the plain of Erioch the king of the Elicians."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tunc exaltatum est regnum Nabuchodonosor, et cor ejus elevatum est: et misit ad omnes, qui habitabant in Cilicia, et Damasco, et Libano,"
      en: "Then was the kingdom of Nabuchodonosor exalted, and his heart was elevated: and he sent to all that dwelt in Cilicia and Damascus, and Libanus,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ad gentes quae sunt in Carmelo et Cedar, et inhabitantes Galilaeam in campo magno Esdrelon,"
      en: "And to the nations that are in Carmelus, and Cedar, and to the inhabitants of Galilee in the great plain of Asdrelon,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ad omnes qui erant in Samaria, et trans flumen Jordanem usque ad Jerusalem, et omnem terram Jesse quousque perveniatur ad terminos Aethiopiae."
      en: "And to all that were in Samaria, and beyond the river Jordan even to Jerusalem, and all the land of Jesse till you come to the borders of Ethiopia."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ad hos omnes misit nuntios Nabuchodonosor rex Assyriorum:"
      en: "To all these Nabuchodonosor king of the Assyrians, sent messengers:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui omnes uno animo contradixerunt, et remiserunt eos vacuos, et sine honore abjecerunt."
      en: "But they all with one mind refused, and sent them back empty, and rejected them without honour."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tunc indignatus Nabuchodonosor rex adversus omnem terram illam, juravit per thronum et regnum suum quod defenderet se de omnibus regionibus his."
      en: "Then king Nabuchodonosor being angry against all that land, swore by his throne and kingdom that he would revenge himself of all those countries."
    status: { la: verified, en: verified }
