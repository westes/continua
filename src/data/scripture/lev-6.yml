# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 6
verses:
  - n: 1
    text:
      la: "Locutus est Dominus ad Moysen, dicens:"
      en: "The Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Anima quae peccaverit, et contempto Domino, negaverit proximo suo depositum quod fidei ejus creditum fuerat, vel vi aliquid extorserit, aut calumniam fecerit,"
      en: "Whosoever shall sin, and despising the Lord, shall deny to his neighbour the thing delivered to his keeping, which was committed to his trust; or shall by force extort any thing, or commit oppression;"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sive rem perditam invenerit, et inficians insuper pejeraverit, et quodlibet aliud ex pluribus fecerit, in quibus solent peccare homines,"
      en: "Or shall find a thing lost, and denying it, shall also swear falsely, or shall do any other of the many things, wherein men are wont to sin:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "convicta delicti,"
      en: "Being convicted of the offence, he shall restore"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "reddet omnia, quae per fraudem voluit obtinere, integra, et quintam insuper partem domino cui damnum intulerat."
      en: "All that he would have gotten by fraud, in the principal, and the fifth part besides to the owner, whom he wronged."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Pro peccato autem suo offeret arietem immaculatum de grege, et dabit eum sacerdoti, juxta aestimationem mensuramque delicti:"
      en: "Moreover for his sin he shall offer a ram without blemish out of the flock, and shall give it to the priest, according to the estimation and measure of the offence:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui rogabit pro eo coram Domino, et dimittetur illi pro singulis quae faciendo peccavit."
      en: "And he shall pray for him before the Lord, and he shall have forgiveness for every thing in doing of which he hath sinned."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Praecipe Aaron et filiis ejus: Haec est lex holocausti: cremabitur in altari tota nocte usque mane: ignis ex eodem altari erit."
      en: "Command Aaron and his sons: This is the law of a holocaust: It shall be burnt upon the altar, all night until morning: the fire shall be of the same altar."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Vestietur tunica sacerdos et feminalibus lineis: tolletque cineres, quos vorans ignis exussit, et ponens juxta altare,"
      en: "The priest shall be vested with the tunick and the linen breeches, and he shall take up the ashes of that which the devouring fire hath burnt, and putting them beside the altar,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "spoliabitur prioribus vestimentis, indutusque aliis, efferret eos extra castra, et in loco mundissimo usque ad favillam consumi faciet."
      en: "Shall put off his former vestments, and being clothed with others, shall carry them forth without the camp, and shall cause them to be consumed to dust in a very clean place,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ignis autem in altari semper ardebit, quem nutriet sacerdos subjiciens ligna mane per singulos dies, et imposito holocausto, desuper adolebit adipes pacificorum."
      en: "And the fire on the altar shall always burn, and the priest shall feed it, putting wood on it every day in the morning, and laying on the holocaust, shall burn thereupon the fat of the peace offerings."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ignis est iste perpetuus, qui numquam deficiet in altari."
      en: "This is the perpetual fire which shall never go out on the altar."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Haec est lex sacrificii et libamentorum, quae offerent filii Aaron coram Domino, et coram altari."
      en: "This is the law of the sacrifice and libations, which the children of Aaron shall offer before the Lord, and before the altar."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Tollet sacerdos pugillum similae, quae conspersa est oleo, et totum thus, quod super similam positum est: adolebitque illud in altari in monimentum odoris suavissimi Domino:"
      en: "The priest shall take a handful of the flour that is tempered with oil, and all the frankincense that is put upon the flour: and he shall burn it on the altar for a memorial of most sweet odour to the Lord:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "reliquam autem partem similae comedet Aaron cum filiis suis, absque fermento: et comedet in loco sancto atrii tabernaculi."
      en: "And the part of the flour that is left, Aaron and his sons shall eat, without leaven: and he shall eat it in the holy place of the court of the tabernacle."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ideo autem non fermentabitur, quia pars ejus in Domini offertur incensum. Sanctum sanctorum erit, sicut pro peccato atque delicto."
      en: "And therefore it shall not be leavened, because part thereof is offered for the burnt sacrifice of the Lord. It shall be most holy, as that which is offered for sin and for trespass."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Mares tantum stirpis Aaron comedent illud. Legitimum ac sempiternum erit in generationibus vestris de sacrificiis Domini: omnis qui tetigerit illa, sanctificabitur."
      en: "The males only of the race of Aaron shall eat it. It shall be an ordinance everlasting in your generations concerning the sacrifices of the Lord: Every one that toucheth them shall be sanctified."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Haec est oblatio Aaron, et filiorum ejus, quam offerre debent Domino in die unctionis suae. Decimam partem ephi offerent similae in sacrificio sempiterno, medium ejus mane, et medium ejus vespere:"
      en: "This is the oblation of Aaron, and of his sons, which they must offer to the Lord, in the day of their anointing: They shall offer the tenth part of an ephi of flour for a perpetual sacrifice, half of it in the morning, and half of it in the evening:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quae in sartagine oleo conspersa frigetur. Offeret autem eam calidam in odorem suavissimum Domino"
      en: "It shall be tempered with oil, and shall be fried in a fryingpan."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sacerdos, qui jure patri successerit, et tota cremabitur in altari."
      en: "And the priest that rightfully succeedeth his father, shall offer it hot, for a most sweet odour to the Lord, and it shall be wholly burnt on the altar."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Omne enim sacrificium sacerdotum igne consumetur, nec quisquam comedet ex eo."
      en: "For every sacrifice of the priest shall be consumed with fire, neither shall any man eat thereof."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Locutus est autem Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Loquere Aaron et filiis ejus: Ista est lex hostiae pro peccato: in loco ubi offertur holocaustum, immolabitur coram Domino. Sanctum sanctorum est."
      en: "Say to Aaron and his sons: This is the law of the victim for sin: in the place where the holocaust is offered, it shall be immolated before the Lord. It is holy of holies."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sacerdos, qui offert, comedet eam in loco sancto, in atrio tabernaculi."
      en: "The priest that offereth it, shall eat it in a holy place, in the court of the tabernacle."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quidquid tetigerit carnes ejus, sanctificabitur. Si de sanguine illius vestis fuerit aspersa, lavabitur in loco sancto."
      en: "Whatsoever shall touch the flesh thereof, shall be sanctified. If a garment be sprinkled with the blood thereof, it shall be washed in a holy place."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Vas autem fictile, in quo cocta est, confringetur; quod si vas aeneum fuerit, defricabitur, et lavabitur aqua."
      en: "And the earthen vessel, wherein it was sodden, shall be broken, but if the vessel be of brass, it shall be scoured, and washed with water."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Omnis masculus de genere sacerdotali vescetur de carnibus ejus, quia Sanctum sanctorum est."
      en: "Every male of the priestly race shall eat of the flesh thereof, because it is holy of holies."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Hostia enim quae caeditur pro peccato, cujus sanguis infertur in tabernaculum testimonii ad expiandum in sanctuario, non comedetur, sed comburetur igni."
      en: "For the victim that is slain for sin, the blood of which is carried into the tabernacle of the testimony to make atonement in the sanctuary, shall not be eaten, but shall be burnt with fire."
    status: { la: verified, en: verified }
