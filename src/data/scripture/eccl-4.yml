# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: eccl
chapter: 4
verses:
  - n: 1
    text:
      la: "Verti me ad alia, et vidi calumnias quae sub sole geruntur, et lacrimas innocentium, et neminem consolatorem, nec posse resistere eorum violentiae, cunctorum auxilio destitutos,"
      en: "I turned myself to other things, and I saw the oppressions that are done under the sun, and the tears of the innocent, and they had no comforter; and they were not able to resist their violence, being destitute of help from any."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et laudavi magis mortuos quam viventes;"
      en: "And I praised the dead rather than the living:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et feliciorem utroque judicavi qui necdum natus est, nec vidit mala quae sub sole fiunt."
      en: "And I judged him happier than them both, that is not yet born, nor hath seen the evils that are done under the sun."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Rursum contemplatus sum omnes labores hominum, et industrias animadverti patere invidiae proximi; et in hoc ergo vanitas et cura superflua est."
      en: "Again I considered all the labours of men, and I remarked that their industries are exposed to the envy of their neighhour: so in this also there is vanity, and fruitless care."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Stultus complicat manus suas, et comedit carnes suas, dicens:"
      en: "The fool foldeth his hands together, and eateth his own flesh, saying:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Melior est pugillus cum requie, quam plena utraque manus cum labore et afflictione animi."
      en: "Better is a handful with rest, than both hands full with labour, and vexation of mind."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Considerans, reperi et aliam vanitatem sub sole."
      en: "Considering I found also another vanity under the sun:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Unus est, et secundum non habet, non filium, non fratrem, et tamen laborare non cessat, nec satiantur oculi ejus divitiis; nec recogitat, dicens: Cui laboro, et fraudo animam meam bonis? In hoc quoque vanitas est et afflictio pessima."
      en: "There is but one, and he hath not a second, no child, no brother, and yet he ceaseth not to labour, neither are his eyes satisfied with riches, neither doth he reflect, saying: For whom do I labour, and defraud my soul of good things? in this also is vanity, and a grievous vexation."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Melius est ergo duos esse simul quam unum; habent enim emolumentum societatis suae."
      en: "It is better therefore that two should be together, than one: for they have the advantage of their society:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si unus ceciderit, ab altero fulcietur. Vae soli, quia cum ceciderit, non habet sublevantem se."
      en: "If one fall he shall be supported by the other: woe to him that is alone, for when he falleth, he hath none to lift him up."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et si dormierint duo, fovebuntur mutuo; unus quomodo calefiet?"
      en: "And if two lie together, they shall warm one another: how shall one alone be warmed?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et si quispiam praevaluerit contra unum, duo resistunt ei; funiculus triplex difficile rumpitur."
      en: "And if a man prevail against one, two shall withstand him: a threefold cord is not easily broken."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Melior est puer pauper et sapiens, rege sene et stulto, qui nescit praevidere in posterum."
      en: "Better is a child that is poor and wise, than a king that is old and foolish, who knoweth not to foresee for hereafter."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quod de carcere catenisque interdum quis egrediatur ad regnum; et alius, natus in regno, inopia consumatur."
      en: "Because out of prison and chains sometimes a man cometh forth to a kingdom: and another born king is consumed with poverty."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vidi cunctos viventes qui ambulant sub sole cum adolescente secundo, qui consurget pro eo."
      en: "I saw all men living, that walk under the sun with the second young man, who shall rise up in his place."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Infinitus numerus est populi omnium qui fuerunt ante eum, et qui postea futuri sunt non laetabuntur in eo; sed et hoc vanitas et afflictio spiritus."
      en: "The number of the people, of all that were before him is infinite: and they that shall come afterwards, shall not rejoice in him: but this also is vanity, and vexation of spirit."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Custodi pedem tuum ingrediens domum Dei, et appropinqua ut audias. Multo enim melior est obedientia quam stultorum victimae, qui nesciunt quid faciunt mali."
      en: "Keep thy foot, when thou goest into the house of God, and draw nigh to hear. For much better is obedience, than the victims of fools, who know not what evil they do."
    status: { la: verified, en: verified }
