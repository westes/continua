# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 3
verses:
  - n: 1
    text:
      la: "post haec aperuit Iob os suum et maledixit diei suo"
      en: "After this Job opened his mouth, and cursed his day,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et locutus est"
      en: "and he said:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "pereat dies in qua natus sum et nox in qua dictum est conceptus est homo"
      en: "Let the day perish wherein I was born, and the night in which it was said: A man child is conceived."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dies ille vertatur in tenebras non requirat eum Deus desuper et non inlustret lumine"
      en: "Let that day be turned into darkness, let not God regard it from above, and let not the light shine upon it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "obscurent eum tenebrae et umbra mortis occupet eum caligo et involvatur amaritudine"
      en: "Let darkness, and the shadow of death cover it, let a mist overspread it, and let it be wrapped up in bitterness."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "noctem illam tenebrosus turbo possideat non conputetur in diebus anni nec numeretur in mensibus"
      en: "Let a darksome whirlwind seize upon that night, let it not be counted in the days of the year, nor numbered in the months."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sit nox illa solitaria nec laude digna"
      en: "Let that night be solitary, and not worthy of praise."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "maledicant ei qui maledicunt diei qui parati sunt suscitare Leviathan"
      en: "Let them curse it who curse the day. who are ready to raise up a leviathan:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "obtenebrentur stellae caligine eius expectet lucem et non videat nec ortum surgentis aurorae"
      en: "Let the stars be darkened with the mist thereof: let it expect light and not see it, nor the rising of the dawning of the day:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quia non conclusit ostia ventris qui portavit me nec abstulit mala ab oculis meis"
      en: "Because it shut not up the doors of the womb that bore me, nor took away evils from my eyes."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quare non in vulva mortuus sum egressus ex utero non statim perii"
      en: "Why did I not die in the womb, why did I not perish when I came out of the belly?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quare exceptus genibus cur lactatus uberibus"
      en: "Why received upon the knees? why suckled at the breasts ?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nunc enim dormiens silerem et somno meo requiescerem"
      en: "For now I should have been asleep and still, and should have rest in my sleep."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cum regibus et consulibus terrae qui aedificant sibi solitudines"
      en: "With kings and consuls of the earth, who build themselves solitudes:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "aut cum principibus qui possident aurum et replent domos suas argento"
      en: "Or with princes, that possess gold, and All their houses with silver:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "aut sicut abortivum absconditum non subsisterem vel qui concepti non viderunt lucem"
      en: "Or as a hidden untimely birth I should not be, or as they that being conceived have not seen the light."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ibi impii cessaverunt a tumultu et ibi requieverunt fessi robore"
      en: "There the wicked cease from tumult, and there the wearied in strength are at rest."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et quondam vincti pariter sine molestia non audierunt vocem exactoris"
      en: "And they sometime bound together without disquiet, have not heard the voice of the oppressor."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "parvus et magnus ibi sunt et servus liber a domino suo"
      en: "The small and great are there, and the servant is free from his master."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quare data est misero lux et vita his qui in amaritudine animae sunt"
      en: "Why is light given to him that is in misery, and life to them that are in bitterness of soul?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui expectant mortem et non venit quasi effodientes thesaurum"
      en: "That look for death, and it cometh not, as they that dig for a treasure:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "gaudentque vehementer cum invenerint sepulchrum"
      en: "And they rejoice exceedingly when they have found the grave."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "viro cuius abscondita est via et circumdedit eum Deus tenebris"
      en: "To a man whose way is hidden, and God hath surrounded him with darkness?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "antequam comedam suspiro et quasi inundantes aquae sic rugitus meus"
      en: "Before I eat I sigh: and as overflowing waters, so is my roaring:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quia timor quem timebam evenit mihi et quod verebar accidit"
      en: "For the fear which I feared hath come upon me: and that which I was afraid of, hath befallen me."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "nonne dissimulavi nonne silui nonne quievi et venit super me indignatio"
      en: "Have I not dissembled ? have I not kept silence ? have I not been quiet? and indignation is come upon me."
    status: { la: verified, en: verified }
