# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 5
verses:
  - n: 1
    text:
      la: "Et conversus sum, et levavi oculos meos, et vidi, et ecce volumen volans."
      en: "And I turned and lifted up my eyes: and I saw, and behold a volume flying."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et dixit ad me: Quid tu vides? Et dixi: Ego video volumen volans: longitudo ejus viginti cubitorum, et latitudo ejus decem cubitorum."
      en: "And he said to me: What seest thou? And I said: I see a volume flying: the length thereof is twenty cubits, and the breadth thereof ten cubits."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dixit ad me: Haec est maledictio quae egreditur super faciem omnis terrae: quia omnis fur, sicut ibi scriptum est, judicabitur, et omnis jurans ex hoc similiter judicabitur."
      en: "And he said to me: This is the curse that goeth forth over the face of the earth: for every thief shall be judged as is there written: and every one that sweareth in like manner shall be judged by it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Educam illud, dicit Dominus exercituum: et veniet ad domum furis, et ad domum jurantis in nomine meo mendaciter: et commorabitur in medio domus ejus, et consumet eam, et ligna ejus, et lapides ejus."
      en: "I will bring it forth, saith the Lord of hosts: and it shall come to the house of the thief, and to the house of him that sweareth falsely by my name: and it shall remain in the midst of his house, and shall consume it, with the timber thereof, and the stones thereof."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et egressus est angelus qui loquebatur in me, et dixit ad me: Leva oculos tuos, et vide quid est hoc quod egreditur."
      en: "And the angel went forth that spoke in me, and he said to me: Lift up thy eyes, and see what this is, that goeth forth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dixi: Quidnam est? Et ait: Haec est amphora egrediens. Et dixit: Haec est oculus eorum in universa terra."
      en: "And I said: What is it? And he said: This is a vessel going forth. And he said: This is their eye in all the earth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ecce talentum plumbi portabatur, et ecce mulier una sedens in medio amphorae."
      en: "And behold a talent of lead was carried, and behold a woman sitting in the midst of the vessel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et dixit: Haec est impietas. Et projecit eam in medio amphorae, et misit massam plumbeam in os ejus."
      en: "And he said: This is wickedness. And he cast her into the midst of the vessel, and cast the weight of lead upon the mouth thereof."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et levavi oculos meos, et vidi: et ecce duae mulieres egredientes: et spiritus in alis earum, et habebant alas quasi alas milvi, et levaverunt amphoram inter terram et caelum."
      en: "And I lifted up my eyes and looked: and behold there came out two women, and wind was in their wings, and they had wings like the wings of a kite: and they lifted up the vessel between the earth and the heaven."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dixi ad angelum qui loquebatur in me: Quo istae deferunt amphoram?"
      en: "And I said to the angel that spoke in me: Whither do these carry the vessel?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixit ad me: Ut aedificetur ei domus in terra Sennaar, et stabiliatur, et ponatur ibi super basem suam."
      en: "And he said to me: That a house may be built for it in the land of Sennaar, and that it may be established, and set there upon its own basis."
    status: { la: verified, en: verified }
