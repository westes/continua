# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 27
verses:
  - n: 1
    text:
      la: "Ne glorieris in crastinum, ignorans quid superventura pariat dies."
      en: "Boast not for tomorrow, for thou knowest not what the day to come may bring forth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Laudet te alienus, et non os tuum; extraneus, et non labia tua."
      en: "Let another praise thee, and not thy own mouth: a stranger, and not thy own lips."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Grave est saxum, et onerosa arena, sed ira stulti utroque gravior."
      en: "A stone is heavy, and sand weighty: but the anger of a fool is heavier than them both."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ira non habet misericordiam nec erumpens furor, et impetum concitati ferre quis poterit?"
      en: "Anger hath no mercy, nor fury when it breaketh forth: and who can bear the violence of one provoked?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Melior est manifesta correptio quam amor absconditus."
      en: "Open rebuke is better than hidden love."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Meliora sunt vulnera diligentis quam fraudulenta oscula odientis."
      en: "Better are the wounds of a friend, than the deceitful kisses of an enemy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Anima saturata calcabit favum, et anima esuriens etiam amarum pro dulci sumet."
      en: "A soul that is full shall tread upon the honeycomb: and a soul that is hungry shall take even bitter for sweet."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sicut avis transmigrans de nido suo, sic vir qui derelinquit locum suum."
      en: "As a bird that wandereth from her nest, so is a man that leaveth his place."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Unguento et variis odoribus delectatur cor, et bonis amici consiliis anima dulcoratur."
      en: "Ointment and perfumes rejoice the heart: and the good counsels of a friend are sweet to the soul."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Amicum tuum, et amicum patris tui ne dimiseris, et domum fratris tui ne ingrediaris in die afflictionis tuae. Melior est vicinus juxta, quam frater procul."
      en: "Thy own friend, and thy father's friend forsake not: and go not into thy brother's house in the day of thy affliction. Better is a neighbour that is near, than a brother afar off."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Stude sapientiae, fili mi, et laetifica cor meum, ut possis exprobranti respondere sermonem."
      en: "Study wisdom, my son, and make my heart joyful, that thou mayst give an answer to him that reproacheth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Astutus videns malum, absconditus est: parvuli transeuntes sustinuerunt dispendia."
      en: "The prudent man seeing evil hideth himself: little ones passing on have suffered losses."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tolle vestimentum ejus qui spopondit pro extraneo, et pro alienis aufer ei pignus."
      en: "Take away his garment that hath been surety for a stranger: and take from him a pledge for strangers."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui benedicit proximo suo voce grandi, de nocte consurgens maledicenti similis erit."
      en: "He that blesseth his neighbour with a loud voice, rising in the night, shall be like to him that curseth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Tecta perstillantia in die frigoris et litigiosa mulier comparantur."
      en: "Roofs dropping through in a cold day, and a contentious woman are alike."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Qui retinet eam quasi qui ventum teneat, et oleum dexterae suae vocabit."
      en: "He that retaineth her, is as he that would hold the wind, and shall call in the oil of his right hand."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ferrum ferro exacuitur, et homo exacuit faciem amici sui."
      en: "Iron sharpeneth iron, so a man sharpeneth the countenance of his friend."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui servat ficum comedet fructus ejus, et qui custos est domini sui glorificabitur."
      en: "He that keepeth the fig tree, shall eat the fruit thereof: and he that is the keeper of his master, shall be glorified."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quomodo in aquis resplendent vultus prospicientium, sic corda hominum manifesta sunt prudentibus."
      en: "As the faces of them that look therein, shine in the water, so-the hearts of men are laid open to the wise."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Infernus et perditio numquam implentur: similiter et oculi hominum insatiabiles."
      en: "Hell and destruction are never filled: so the eyes of men are never satisfied."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quomodo probatur in conflatorio argentum et in fornace aurum, sic probatur homo ore laudantis. Cor iniqui inquirit mala, cor autem rectum inquirit scientiam."
      en: "As silver is tried in the fining-pot and gold in the furnace: so a man is tried by the mouth of him that praiseth. The heart of the wicked seeketh after evils, but the righteous heart seeketh after knowledge."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Si contuderis stultum in pila quasi ptisanas feriente desuper pilo, non auferetur ab eo stultitia ejus."
      en: "Though thou shouldst bray a fool in the mortar, as when a pestle striketh upon sodden barley, his folly would not be taken from him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Diligenter agnosce vultum pecoris tui, tuosque greges considera:"
      en: "Be diligent to know the countenance of thy cattle, and consider thy own flocks:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "non enim habebis jugiter potestatem, sed corona tribuetur in generationem et generationem."
      en: "For thou shalt not always have power: but a crown shall be given to generation and generation."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Aperta sunt prata, et apparuerunt herbae virentes, et collecta sunt foena de montibus."
      en: "The meadows are open, and the green herbs have appeared, and the hay is gathered out of the mountains."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Agni ad vestimentum tuum, et haedi ad agri pretium."
      en: "Lambs are for thy clothing: and kids for the price of the field."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sufficiat tibi lac caprarum in cibos tuos, et in necessaria domus tuae et ad victum ancillis tuis."
      en: "Let the milk of the goats be enough for thy food, and for the necessities of thy house, and for maintenance for thy handmaids."
    status: { la: verified, en: verified }
