# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for isa 5 specifically; see TODO.md's bulk scripture import entry.
book: isa
chapter: 5
verses:
  - n: 1
    text:
      la: "Cantabo dilecto meo canticum patruelis mei vineae suae. Vinea facta est dilecto meo in cornu filio olei."
      en: "I will sing to my beloved the canticle of my cousin concerning his vineyard. My beloved had a vineyard on a hill in a fruitful place."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et sepivit eam, et lapides elegit ex illa, et plantavit eam electam; et aedificavit turrim in medio ejus, et torcular exstruxit in ea; et exspectavit ut faceret uvas, et fecit labruscas."
      en: "And he fenced it in, and picked the stones out of it, and planted it with the choicest vines, and built a tower in the midst thereof, and set up a winepress therein: and he looked that it should bring forth grapes, and it broutht forth wild grapes."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nunc ergo, habitatores Jerusalem et viri Juda, judicate inter me et vineam meam."
      en: "And now, O ye inhabitants of Jerusalem, and ye men of Juda, judge between me and my vineyard."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quid est quod debui ultra facere vineae meae, et non feci ei? an quod exspectavi ut faceret uvas, et fecit labruscas?"
      en: "What is there that I ought to do more to my vineyard, that I have not done to it?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et nunc ostendam vobis quid ego faciam vineae meae : auferam sepem ejus, et erit in direptionem; diruam maceriam ejus, et erit in conculcationem."
      en: "And now I will shew you what I will do to my vineyard. I will take away the hedge thereof, and it shall be wasted: I will break down the wall thereof, and it shall be trodden down."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ponam eam desertam; non putabitur et non fodietur : et ascendent vepres et spinae, et nubibus mandabo ne pluant super eam imbrem."
      en: "And I will make it desolate: it shall not be pruned, and it shall not be digged: but briers and thorns shall come up: and I will command the clouds to rain no rain upon it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vinea enim Domini exercituum domus Israel est; et vir Juda germen ejus delectabile : et exspectavi ut faceret judicium, et ecce iniquitas; et justitiam, et ecce clamor."
      en: "For the vineyard of the Lord of hosts is the house of Israel: and the man of Juda, his pleasant plant: and I looked that he should do judgment, and behold iniquity: and do justice, and behold a cry."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Vae qui conjungitis domum ad domum, et agrum agro copulatis usque ad terminum loci! Numquid habitabitis vos soli in medio terrae?"
      en: "Woe to you that join house to house and lay field to field, even to the end of the place: shall you alone dwell in the midst of the earth?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "In auribus meis sunt haec, dicit Dominus exercituum; nisi domus multae desertae fuerint, grandes et pulchrae, absque habitatore."
      en: "These things are in my ears, saith the Lord of hosts: unless many great and fair houses shall become desolate, without an inhabitant."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Decem enim jugera vinearum facient lagunculam unam, et triginta modii sementis facient modios tres."
      en: "For ten acres of vineyard shall yield one little measure, and thirty bushels of seed shall yield three bushels."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vae qui consurgitis mane ad ebrietatem sectandam, et potandum usque ad vesperam, ut vino aestuetis!"
      en: "Woe to you that rise up early in the morning to follow drunkenness, and to drink till the evening, to be inflamed with wine."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cithara, et lyra, et tympanum, et tibia, et vinum in conviviis vestris; et opus Domini non respicitis, nec opera manuum ejus consideratis."
      en: "The harp, and the lyre, and the timbrel, and the pipe, and wine are in your feasts: and the work of the Lord you regard not, nor do you consider the works of his hands."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Propterea captivus ductus est populus meus, quia non habuit scientiam, et nobiles ejus interierunt fame, et multitudo ejus siti exaruit."
      en: "Therefore is my people led away captive, because they had not knowledge, and their nobles have perished with famine, and their multitude were dried up with thirst."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Propterea dilatavit infernus animam suam, et aperuit os suum absque ullo termino; et descendent fortes ejus, et populus ejus, et sublimes gloriosique ejus, ad eum."
      en: "Therefore hath hell enlarged her soul, and opened her mouth without any bounds, and their strong ones, and their people, and their high and glorious ones shall go down into it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et incurvabitur homo, et humiliabitur vir, et oculi sublimium deprimentur."
      en: "And man shall be brought down, and man shall be humbled, and the eyes of the lofty shall be brought low."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et exaltabitur Dominus exercituum in judicio; et Deus sanctus sanctificabitur in justitia."
      en: "And the Lord of hosts shall be exalted in judgment, and the holy God shall be sanctified in justice."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et pascentur agni juxta ordinem suum, et deserta in ubertatem versa advenae comedent."
      en: "And the lambs shall feed according to their order, and strangers shall eat the deserts turned into fruitfulness."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vae qui trahitis iniquitatem in funiculis vanitatis, et quasi vinculum plaustri peccatum!"
      en: "Woe to you that draw iniquity with cords of vanity, and sin as the rope of a cart."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui dicitis : Festinet, et cito veniat opus ejus, ut videamus; et appropiet, et veniat consilium sancti Israel, et sciemus illud!"
      en: "That say: Let him make haste, and let his work come quickly, that we may see it: and let the counsel of the Holy One of Israel come, that we may know it."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vae qui dicitis malum bonum, et bonum malum; ponentes tenebras lucem, et lucem tenebras; ponentes amarum in dulce, et dulce in amarum!"
      en: "Woe to you that call evil good, and good evil: that put darkness for light, and light for darkness: that put bitter for sweet, and sweet for bitter."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Vae qui sapientes estis in oculis vestris, et coram vobismetipsis prudentes."
      en: "Woe to you that are wise in your own eyes, and prudent in your own conceits."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Vae qui potentes estis ad bibendum vinum, et viri fortes ad miscendam ebrietatem!"
      en: "Woe to you that are mighty to drink wine, and stout men at drunkenness."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "qui justificatis impium pro muneribus, et justitiam justi aufertis ab eo!"
      en: "That justify the wicked for gifts, and take away the justice of the just from him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Propter hoc, sicut devorat stipulam lingua ignis, et calor flammae exurit, sic radix eorum quasi favilla erit, et germen eorum ut pulvis ascendet; abjecerunt enim legem Domini exercituum, et eloquium sancti Israel blasphemaverunt."
      en: "Therefore as the tongue of the fire devoureth the stubble, and the heat of the flame consumeth it: so shall their root be as ashes, and their bud shall go up as dust: for they have cast away the law of the Lord of hosts, and have blasphemed the word of the Holy One of Israel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ideo iratus est furor Domini in populum suum, et extendit manum suam super eum, et percussit eum : et conturbati sunt montes, et facta sunt morticina eorum quasi stercus in medio platearum. In his omnibus non est adversus furor ejus, sed adhuc manus ejus extenta."
      en: "Therefore is the wrath of the Lord kindled against his people, and he hath stretched out his hand upon them, and struck them: and the mountains were troubled, and their carcasses became as dung in the midst of the streets. For all this his anger is not turned away, but his hand is stretched out still."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et elevabit signum in nationibus procul, et sibilabit ad eum de finibus terrae : et ecce festinus velociter veniet."
      en: "And he will lift up a sign to the nations afar off, and will whistle to them from the ends of the earth: and behold they shall come with speed swiftly."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Non est deficiens neque laborans in eo; non dormitabit, neque dormiet; neque solvetur cingulum renum ejus, nec rumpetur corrigia calceamenti ejus."
      en: "There is none that shall faint, nor labour among them: they shall not slumber nor sleep, neither shall the girdle of their loins be loosed, nor the latchet of their shoes be broken."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Sagittae ejus acutae, et omnes arcus ejus extenti. Ungulae equorum ejus ut silex, et rotae ejus quasi impetus tempestatis."
      en: "Their arrows are sharp, and all their bows are bent. The hoofs of their horses shall be like the flint, and their wheels like the violence of a tempest."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Rugitus ejus ut leonis; rugiet ut catuli leonum : et frendet, et tenebit praedam, et amplexabitur, et non erit qui eruat."
      en: "Their roaring like that of a lion, they shall roar like young lions: yea they shall roar, and take hold of the prey, and they shall keep fast hold of it, and there shall be none to deliver it."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et sonabit super eum in die illa sicut sonitus maris : aspiciemus in terram, et ecce tenebrae tribulationis, et lux obtenebrata est in caligine ejus."
      en: "And they shall make a noise against them that day, like the roaring of the sea; we shall look towards the land, and behold darkness of tribulation, and the light is darkened with the mist thereof."
    status: { la: verified, en: verified }
