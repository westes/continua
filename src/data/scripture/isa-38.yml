# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 38
verses:
  - n: 1
    text:
      la: "in diebus illis aegrotavit Ezechias usque ad mortem et introivit ad eum Isaias filius Amos propheta et dixit ei haec dicit Dominus dispone domui tuae quia morieris tu et non vives"
      en: "In those days Ezechias was sick even to death, and Isaias the son of Amos the prophet came unto him, and said to him: Thus saith the Lord: Take order with thy house, for thou shalt die, and not live."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et convertit Ezechias faciem suam ad parietem et oravit ad Dominum"
      en: "And Ezechias turned his face toward the wall, and prayed to the Lord,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixit obsecro Domine memento quaeso quomodo ambulaverim coram te in veritate et in corde perfecto et quod bonum est in oculis tuis fecerim et flevit Ezechias fletu magno"
      en: "And said: I beseech thee, O Lord, remember how I have walked before thee in truth, and with a perfect heart, and have done that which is good in thy sight. And Ezechias wept with great weeping."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et factum est verbum Domini ad Isaiam dicens"
      en: "And the word of the Lord came to Isaias, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "vade et dic Ezechiae haec dicit Dominus Deus David patris tui audivi orationem tuam vidi lacrimam tuam ecce ego adiciam super dies tuos quindecim annos"
      en: "Go and say to Ezechias: Thus saith the Lord the God of David thy father: I have heard thy prayer, and I have seen thy tears: behold I will add to thy days fifteen years:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et de manu regis Assyriorum eruam te et civitatem istam et protegam eam"
      en: "And I will deliver thee and this city out of the hand of the king of the Assyrians, and I will protect it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "hoc autem tibi erit signum a Domino quia faciet Dominus verbum hoc quod locutus est"
      en: "And this shall be a sign to thee from the Lord, that the Lord will do this word which he hath spoken:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ecce ego reverti faciam umbram linearum per quas descenderat in horologio Ahaz in sole retrorsum decem lineis et reversus est sol decem lineis per gradus quos descenderat"
      en: "Behold I will bring again the shadow of the lines, by which it is now gone down in the sun dial of Achaz with the sun, ten lines backward. And the sun returned ten lines by the degrees by which it was gone down."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "scriptura Ezechiae regis Iuda cum aegrotasset et convaluisset de infirmitate sua"
      en: "The writing of Ezechias king of Juda, when he had been sick, and was recovered of his sickness."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ego dixi in dimidio dierum meorum vadam ad portas inferi quaesivi residuum annorum meorum"
      en: "I said: In the midst of my days I shall go to the gates of hell: I sought for the residue of my years."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixi non videbo Dominum Dominum in terra viventium non aspiciam hominem ultra et habitatorem quievit"
      en: "I said: I shall not see the Lord God in the land of the living. I shall behold man no more, nor the inhabitant of rest."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "generatio mea ablata est et convoluta est a me quasi tabernaculum pastorum praecisa est velut a texente vita mea dum adhuc ordirer succidit me de mane usque ad vesperam finies me"
      en: "My generation is at an end, and it is rolled away from me, as a shepherd's tent. My life is cut off, as by a weaver: whilst I was yet but beginning, he out me off: from morning even to night thou wilt make an end of me."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sperabam usque ad mane quasi leo sic contrivit omnia ossa mea de mane usque ad vesperam finies me"
      en: "I hoped till morning, as a lion so hath he broken all my bones: from morning even to night thou wilt make an end of me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sicut pullus hirundinis sic clamabo meditabor ut columba adtenuati sunt oculi mei suspicientes in excelsum Domine vim patior sponde pro me"
      en: "I will cry like a young swallow, I will meditate like a dove: my eyes are weakened looking upward: Lord, I suffer violence, answer thou for me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quid dicam aut quid respondebit mihi cum ipse fecerit recogitabo omnes annos meos in amaritudine animae meae"
      en: "What shall I say, or what shall he answer for me, whereas he himself hath done it? I will recount to thee all my years in the bitterness of my soul."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Domine sic vivitur et in talibus vita spiritus mei corripies me et vivificabis me"
      en: "O Lord, if man's life be such, and the life of my spirit be in such things as these, thou shalt correct me, and make me to live."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ecce in pace amaritudo mea amarissima tu autem eruisti animam meam ut non periret proiecisti post tergum tuum omnia peccata mea"
      en: "Behold in peace is my bitterness most bitter: but thou best delivered my soul that it should not perish, thou hast cast all my sins behind thy back."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quia non infernus confitebitur tibi neque mors laudabit te non expectabunt qui descendunt in lacum veritatem tuam"
      en: "For hell shall not confess to thee, neither shall death praise thee: nor shall they that go down into the pit, look for thy truth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "vivens vivens ipse confitebitur tibi sicut et ego hodie pater filiis notam faciet veritatem tuam"
      en: "The living, the living, he shall give praise to thee, as I do this day: the father shall make thy truth known to the children."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Domine salvum me fac et psalmos nostros cantabimus cunctis diebus vitae nostrae in domo Domini"
      en: "O Lord, save me, and we will sing our psalms all the days of our life in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et iussit Isaias ut tollerent massam de ficis et cataplasmarent super vulnus et sanaretur"
      en: "Now Isaias had ordered that they should take a lump of figs, and lay it as it plaster upon the wound, and that he should be healed."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et dixit Ezechias quod erit signum quia ascendam in domo Domini"
      en: "And Ezechias bed said: What shah be the sign that I shah go up to the house of the Lord?"
    status: { la: verified, en: verified }
