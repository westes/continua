# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 30
verses:
  - n: 1
    text:
      la: "Misit quoque Ezechias ad omnem Israel et Judam: scripsitque epistolas ad Ephraim et Manassen ut venirent ad domum Domini in Jerusalem, et facerent Phase Domino Deo Israel."
      en: "And Ezechias sent to all Israel and Juda: and he wrote letters to Ephraim and Manasses, that they should come to the house of the Lord in Jerusalem, and keep the phase to the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Inito ergo consilio regis et principum, et universi coetus Jerusalem, decreverunt ut facerent Phase mense secundo."
      en: "For the king, taking counsel, and the princes, and all the assembly of Jerusalem, decreed to keep the phase the second month."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Non enim potuerant facere in tempore suo, quia sacerdotes, qui possent sufficere, sanctificati non fuerant, et populus nondum congregatus fuerat in Jerusalem."
      en: "For they could not keep it in its time; because there were not priests enough sanctified, and the people was not as yet gathered together to Jerusalem."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Placuitque sermo regi, et omni multitudini."
      en: "And the thing pleased the king, and all the people."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et decreverunt ut mitterent nuntios in universum Israel, de Bersabee usque Dan, ut venirent, et facerent Phase Domino Deo Israel in Jerusalem: multi enim non fecerant sicut lege praescriptum est."
      en: "And they decreed to send messengers to all Israel from Bersabee even to Dan, that they should come, and keep the phase to the Lord the God of Israel in Jerusalem: for many had not kept it as it is prescribed by the law."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Perrexeruntque cursores cum epistolis ex regis imperio, et principum ejus, in universum Israel et Judam, juxta id, quod rex jusserat, praedicantes: Filii Israel, revertimini ad Dominum Deum Abraham, et Isaac, et Israel: et revertetur ad reliquias, quae effugerunt manum regis Assyriorum."
      en: "And the posts went with letters by commandment of the king, and his princes, to all Israel and Juda, proclaiming according to the king's orders: Ye children of Israel, turn again to the Lord the God of Abraham, and of Isaac, and of Israel: and he will return to the remnant of you that have escaped the hand of the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nolite fieri sicut patres vestri et fratres, qui recesserunt a Domino Deo patrum suorum, qui tradidit eos in interitum, ut ipsi cernitis."
      en: "Be not like your fathers, and brethren, who departed from the Lord the God of their fathers, and he hath given them up to destruction, as you see."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nolite indurare cervices vestras, sicut patres vestri: tradite manus Domino, et venite ad sanctuarium ejus, quod sanctificavit in aeternum: servite Domino Deo patrum vestrorum, et avertetur a vobis ira furoris ejus."
      en: "Harden not your necks, as your fathers did: yield yourselves to the Lord, and come to his sanctuary, which he hath sanctified for ever: serve the Lord the God of your fathers, and the wrath of his indignation shall be turned away from you."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si enim vos reversi fueritis ad Dominum: fratres vestri, et filii habebunt misericordiam coram dominis suis, qui illos duxerunt captivos, et revertentur in terram hanc: pius enim et clemens est Dominus Deus vester, et non avertet faciem suam a vobis, si reversi fueritis ad eum."
      en: "For if you turn again to the Lord: your brethren, and children shall find mercy before their masters, that have led them away captive, and they shall return into this land: for the Lord your God is merciful, and will not turn away his face from you, if you return to him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Igitur cursores pergebant velociter de civitate in civitatem per terram Ephraim et Manasse usque ad Zabulon, illis irridentibus et subsannantibus eos."
      en: "So the posts went speedily from city to city, through the land of Ephraim, and of Manasses, even to Zabulon, whilst they laughed at them and mocked them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Attamen quidam viri ex Aser, et Manasse, et Zabulon acquiescentes consilio, venerunt Jerusalem."
      en: "Nevertheless some men of Aser, and of Manasses, and of Zabulon, yielding to the counsel, came to Jerusalem."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "In Juda vero facta est manus Domini ut daret eis cor unum, ut facerent juxta praeceptum regis et principum verbum Domini."
      en: "But the hand of God was in Juda, to give them one heart to do the word of the Lord, according to the commandment of the king, and of the princes."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Congregatique sunt in Jerusalem populi multi ut facerent solemnitatem azymorum, in mense secundo:"
      en: "And much people were assembled to Jerusalem to celebrate the solemnity of the unleavened bread in the second month:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et surgentes destruxerunt altaria quae erant in Jerusalem, atque universa, in quibus idolis adolebatur incensum, subvertentes, projecerunt in torrentem Cedron."
      en: "And they arose and destroyed the altars that were in Jerusalem, and took away all things in which incense was burnt to idols, and cast them into the torrent Cedron."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Immolaverunt autem Phase quartadecima die mensis secundi. Sacerdotes quoque atque Levitae tandem sanctificati, obtulerunt holocausta in domo Domini:"
      en: "And they immolated the phase on the fourteenth day of the second month. And the priests and the Levites being at length sanctified offered holocausts in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "steteruntque in ordine suo juxta dispositionem, et legem Moysi hominis Dei: sacerdotes vero suscipiebant effundendum sanguinem de manibus Levitarum,"
      en: "And they stood in their order according to the disposition, and law of Moses the man of God: but the priests received the blood which was to be poured out, from the hands of the Levites,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "eo quod multa turba sanctificata non esset: et idcirco immolarent Levitae Phase his, qui non occurrerant sanctificari Domino."
      en: "Because a great number was not sanctified: and therefore the Levites immolated the phase for them that came not in time to be sanctified to the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Magna etiam pars populi de Ephraim et Manasse, et Issachar, et Zabulon, quae sanctificata non fuerat, comedit Phase, non juxta quod scriptum est: et oravit pro eis Ezechias, dicens: Dominus bonus propitiabitur"
      en: "For a great part of the people from Ephraim, and Manasses, and Issachar, and Zabulon, that had not been sanctified, ate the phase otherwise than it is written: and Ezechias prayed for them, saying: The Lord who is good will shew mercy,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cunctis, qui in toto corde requirunt Dominum Deum patrum suorum: et non imputabit eis quod minus sanctificati sunt."
      en: "To all them, who with their whole heart, seek the Lord the God of their fathers: and will not impute it to them that they are not sanctified."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quem exaudivit Dominus, et placatus est populo."
      en: "And the Lord heard him, and was merciful to the people."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Feceruntque filii Israel, qui inventi sunt in Jerusalem, solemnitatem azymorum septem diebus in laetitia magna, laudantes Dominum per singulos dies: Levitae quoque, et sacerdotes per organa, quae suo officio congruebant."
      en: "And the children of Israel, that were found at Jerusalem, kept the feast of unleavened bread seven days with great joy, praising the Lord every day: the Levites also, and the priests, with instruments that agreed to their office."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et locutus est Ezechias ad cor omnium Levitarum, qui habebant intelligentiam bonam super Domino: et comederunt septem diebus solemnitatis, immolantes victimas pacificorum, et laudantes Dominum Deum patrum suorum."
      en: "And Ezechias spoke to the heart of all the Levites, that had good understanding concerning the Lord: and they ate during the seven days of the solemnity, immolating victims of peace offerings, and praising the Lord the God of their fathers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Placuitque universae multitudini ut celebrarent etiam alios dies septem: quod et fecerunt cum ingenti gaudio."
      en: "And it pleased the whole multitude to keep other seven days: which they did with great joy."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ezechias enim rex Juda praebuerat multitudini mille tauros, et septem millia ovium: principes vero dederant populo tauros mille, et oves decem millia: sanctificata est ergo sacerdotum plurima multitudo."
      en: "For Ezechias the king of Juda had given to the multitude a thousand bullocks, and seven thousand sheep: and the princes had given the people a thousand bullocks, and ten thousand sheep: and a great number of priests was sanctified."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et hilaritate perfusa omnis turba Juda, tam sacerdotum et Levitarum, quam universae frequentiae, quae venerat ex Israel: proselytorum quoque de terra Israel, et habitantium in Juda."
      en: "And all the multitude of Juda with the priests and Levites, and all the assembly, that came out of Israel; and the proselytes of the land of Israel, and that dwelt in Juda were full of joy."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Factaque est grandis celebritas in Jerusalem, qualis a diebus Salomonis filii David regis Israel in ea urbe non fuerat."
      en: "And there was a great solemnity in Jerusalem, such as had not been in that city since the time of Solomon the son of David king of Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Surrexerunt autem sacerdotes atque Levitae benedicentes populo: et exaudita est vox eorum: pervenitque oratio in habitaculum sanctum caeli."
      en: "And the priests and the Levites rose up and blessed the people: and their voice was heard: and their prayer came to the holy dwelling place of heaven."
    status: { la: verified, en: verified }
