# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 12
verses:
  - n: 1
    text:
      la: "Et dices in die illa: Confitebor tibi, Domine, quoniam iratus es mihi; conversus est furor tuus, et consolatus es me."
      en: "And thou shalt say in that day: I will give thanks to thee, O Lord, for thou wast angry with me: thy wrath is turned away, and thou hast comforted me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ecce Deus salvator meus; fiducialiter agam, et non timebo: quia fortitudo mea et laus mea Dominus, et factus est mihi in salutem."
      en: "Behold, God is my saviour, I will deal confidently, and will not fear: O because the Lord is my strength, and my praise, and he is become my salvation."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Haurietis aquas in gaudio de fontibus salvatoris."
      en: "You shall draw waters with joy out of the saviour's fountains:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dicetis in die illa: Confitemini Domino et invocate nomen ejus; notas facite in populis adinventiones ejus; mementote quoniam excelsum est nomen ejus."
      en: "And you shall say in that day: Praise ye the Lord, and call upon his name: make his works known among the people: remember that his name is high."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cantate Domino, quoniam magnifice fecit; annuntiate hoc in universa terra."
      en: "Sing ye to the Lord, for he hath done great things: shew this forth in all the earth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Exsulta et lauda, habitatio Sion, quia magnus in medio tui Sanctus Israel."
      en: "Rejoice, and praise, O thou habitation of Sion: for great is he that is in the midst of thee, the Holy One of Israel."
    status: { la: verified, en: verified }
