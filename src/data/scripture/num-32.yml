# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 32
verses:
  - n: 1
    text:
      la: "Filii autem Ruben et Gad habebant pecora multa, et erat illis in jumentis infinita substantia. Cumque vidissent Jazer et Galaad aptas animalibus alendis terras,"
      en: "And the sons of Ruben and Gad had many flocks of cattle, and their substance in beasts was infinite. And when they saw the lands of Jazer and Galaad fit for feeding cattle,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "venerunt ad Moysen, et ad Elezarum sacerdotem, et principes multitudinis, atque dixerunt:"
      en: "They came to Moses and Eleazar the priest, and the princes of the multitude, and said:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ataroth, et Dibon, et Jazer, et Nemra, Hesebon, et Eleale, et Saban, et Nebo, et Beon,"
      en: "Ataroth, and Dibon, and Jazer, and Nemra, Hesebon, and Eleale, and Saban, and Nebo, and Beon,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "terra, quam percussit Dominus in conspectu filiorum Israel, regio uberrima est ad pastum animalium: et nos servi tui habemus jumenta plurima,"
      en: "The land, which the Lord hath conquered in the sight of the children of Israel, is a very fertile soil for the feeding of beasts: and we thy servants have very much cattle:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "precamurque si invenimus gratiam coram te, ut des nobis famulis tuis eam in possessionem, nec facias nos transire Jordanem."
      en: "And we pray thee, if we have found favour in thy sight, that thou give it to us thy servants in possession, and make us not pass over the Jordan."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quibus respondit Moyses: Numquid fratres vestri ibunt ad pugnam, et vos hic sedebitis?"
      en: "And Moses answered them: What, shall your brethren go to fight, and will you sit here?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cur subvertitis mentes filiorum Israel, ne transire audeant in locum, quem eis daturus est Dominus?"
      en: "Why do ye overturn the minds of the children of Israel, that they may not dare to pass into the place which the Lord hath given them?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nonne ita egerunt patres vestri, quando misi de Cadesbarne ad explorandam terram?"
      en: "Was it not thus your fathers did, when I sent from Cadesbarne to view the land?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque venissent usque ad Vallem botri, lustrata omni regione, subverterunt cor filiorum Israel, ut non intrarent fines, quos eis Dominus dedit."
      en: "And when they were come as far as the valley of the cluster, having viewed all the country, they overturned the hearts of the children of Israel, that they should not enter into the coasts, which the Lord gave them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui iratus juravit, dicens:"
      en: "And he swore in his anger, saying:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Si videbunt homines isti, qui ascenderunt ex Aegypto a viginti annis et supra, terram, quam sub juramento pollicitus sum Abraham, Isaac, et Jacob: et noluerunt sequi me,"
      en: "If these men, that came up out of Egypt, from twenty years old and upward, shall see the land, which I promised with an oath to Abraham, Isaac, and Jacob: because they would not follow me,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "praeter Caleb filium Jephone Cenezaeum, et Josue filium Nun: isti impleverunt voluntatem meam."
      en: "Except Caleb the son of Jephone the Cenezite, and Josue the son of Nun: these have fulfilled my will."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Iratusque Dominus adversum Israel, circumduxit eum per desertum quadraginta annis, donec consumeretur universa generatio, quae fecerat malum in conspectu ejus."
      en: "And the Lord being angry against Israel, led them about through the desert forty years, until the whole generation, that had done evil in his sight, was consumed."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et ecce, inquit, vos surrexistis pro patribus vestris, incrementa et alumni hominum peccatorum, ut augeretis furorem Domini contra Israel."
      en: "And behold, said he, you are risen up instead of your fathers, the increase and offspring of sinful men, to augment the fury of the Lord against Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quod si nolueritis sequi eum, in solitudine populum derelinquet, et vos causa eritis necis omnium."
      en: "For if you will not follow him, he will leave the people in the wilderness, and you shall be the cause of the destruction of all."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "At illi prope accedentes, dixerunt: Caulas ovium fabricabimus, et stabula jumentorum, parvulis quoque nostris urbes munitas:"
      en: "But they coming near, said: We will make sheepfolds, and stalls for our cattle, and strong cities for our children:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nos autem ipsi armati et accincti pergemus ad praelium ante filios Israel, donec introducamus eos ad loca sua. Parvuli nostri, et quidquid habere possumus, erunt in urbibus muratis, propter habitatorum insidias."
      en: "And we ourselves will go armed and ready for battle before the children of Israel, until we bring them in unto their places. Our little ones, and all we have, shall be in walled cities, for fear of the ambushes of the inhabitants."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Non revertemur in domos nostras, usque dum possideant filii Israel haereditatem suam:"
      en: "We will not return into our houses until the children of Israel possess their inheritance:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nec quidquam quaeremus trans Jordanem, quia jam habemus nostram possessionem in orientali ejus plaga."
      en: "Neither will we seek any thing beyond the Jordan, because we have already our possession on the east side thereof,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quibus Moyses ait: Si facitis quod promittitis, expediti pergite coram Domino ad pugnam:"
      en: "And Moses said to them: If you do what you promise, go on well appointed for war before the Lord:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et omnis vir bellator armatus Jordanem transeat, donec subvertat Dominus inimicos suos,"
      en: "And let every fighting man pass over the Jordan, until the Lord overthrow his enemies:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et subjiciatur ei omnis terra: tunc eritis inculpabiles apud Dominum et apud Israel, et obtinebitis regiones, quas vultis, coram Domino."
      en: "And all the land be brought under him, then shall you be blameless before the Lord and before Israel, and you shall obtain the countries that you desire, before the Lord."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Sin autem quod dicitis, non feceritis, nulli dubium est quin peccetis in Deum: et scitote quoniam peccatum vestrum apprehendet vos."
      en: "But if you do not what you say, no man can doubt but you sin against God: and know ye, that your sin shall overtake you."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Aedificate ergo urbes parvulis vestris, et caulas, et stabula ovibus ac jumentis: et quod polliciti estis, implete."
      en: "Build therefore cities for your children, and folds and stalls for your sheep and beasts, and accomplish what you have promised."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dixeruntque filii Gad et Ruben ad Moysen: Servi tui sumus: faciemus quod jubet dominus noster."
      en: "And the children of Gad and Ruben said to Moses: We are thy servants, we will do what my lord commandeth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Parvulos nostros, et mulieres, et pecora, ac jumenta relinquemus in urbibus Galaad:"
      en: "We will leave our children, and our wives and sheep and cattle, in the cities of Galaad:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "nos autem famuli tui omnes expediti pergemus ad bellum, sicut tu, domine, loqueris."
      en: "And we thy servants all well appointed will march on to the war, as thou, my lord, speakest."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Praecepit ergo Moyses Eleazaro sacerdoti, et Josue filio Nun, et principibus familiarum per tribus Israel, et dixit ad eos:"
      en: "Moses therefore commanded Eleazar the priest, and Josue the son of Nun, and the princes of the families of all the tribes of Israel, and said to them:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Si transierint filii Gad et filii Ruben vobiscum Jordanem omnes armati ad bellum coram Domino, et vobis fuerit terra subjecta, date eis Galaad in possessionem."
      en: "If the children of Gad, and the children of Ruben pass with you over the Jordan, all armed for war before the Lord, and the land be made subject to you: give them Galaad in possession."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Sin autem noluerint transire armati vobiscum in terram Chanaan, inter vos habitandi accipiant loca."
      en: "But if they will not pass armed with you into the land of Chanaan, let them receive places to dwell in among you."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Responderuntque filii Gad et filii Ruben: Sicut locutus est Dominus servis suis, ita faciemus:"
      en: "And the children of Gad, and the children of Ruben answered: As the Lord hath spoken to his servants, so will we do:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ipsi armati pergemus coram Domino in terram Chanaan, et possessionem jam suscepisse nos confitemur trans Jordanem."
      en: "We will go armed before the Lord into the land of Chanaan, and we confess that we have already received our possession beyond the Jordan."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dedit itaque Moyses filiis Gad et Ruben, et dimidiae tribui Manasse filii Joseph, regnum Sehon regis Amorrhaei, et regnum Og regis Basan, et terram eorum cum urbibus suis per circuitum."
      en: "Moses therefore gave to the children of Gad and of Ruben, and to the half tribe of Manasses the son of Joseph, the kingdom of Sehon king of the Amorrhites, and the kingdom of Og king of Basan, and their land and the cities thereof round about."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Igitur exstruxerunt filii Gad, Dibon, et Ataroth, et Aroer,"
      en: "And the sons of Gad built Dibon, and Ataroth, and Aroer,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et Etroth, et Sophan, et Jazer, et Jegbaa,"
      en: "And Etroth, and Sophan, and Jazer, and Jegbaa,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et Bethnemra, et Betharan, urbes munitas, et caulas pecoribus suis."
      en: "And Bethnemra, and Betharan, fenced cities, and folds for their cattle."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Filii vero Ruben aedificaverunt Hesebon, et Eleale, et Cariathaim,"
      en: "But the children of Ruben built Hesebon, and Eleale, and Cariathaim,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et Nabo, et Baalmeon versis nominibus, Sabama quoque: imponentes vocabula urbibus, quas exstruxerunt."
      en: "And Nabo, and Baalmeon (their names being changed) and Sabama: giving names to the cities which they had built."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Porro filii Machir filii Manasse, perrexerunt in Galaad, et vastaverunt eam interfecto Amorrhaeo habitatore ejus."
      en: "Moreover the children of Machir, the son of Manasses, went into Galaad, and wasted it, cutting off the Amorrhites, the inhabitants thereof."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Dedit ergo Moyses terram Galaad Machir filio Manasse, qui habitavit in ea."
      en: "And Moses gave the land of Galaad to Machir the son of Manasses, and he dwelt in it."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Jair autem filius Manasse abiit, et occupavit vicos ejus, quos appellavit Havoth Jair, id est, Villas Jair."
      en: "And Jair the son of Manasses went, and took the villages thereof, and he called them Havoth Jair, that is to say, the villages of Jair."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Nobe quoque perrexit, et apprehendit Chanath cum viculis suis: vocavitque eam ex nomine suo Nobe."
      en: "Nobe also went, and took Canath with the villages thereof: and he called it by his own name, Nobe."
    status: { la: verified, en: verified }
