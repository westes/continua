# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: osee
chapter: 14
verses:
  - n: 1
    text:
      la: "Pereat Samaria, quoniam ad amaritudinem concitavit Deum suum! in gladio pereant, parvuli eorum elidantur, et foetae ejus discindantur!"
      en: "Let Samaria perish, because she hath stirred up her God to bitterness: let them perish by the sword, let their little ones be dashed, and let the women with child be ripped up."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Convertere, Israel, ad Dominum Deum tuum, quoniam corruisti in iniquitate tua."
      en: "Return, O Israel, to the Lord thy God: for thou hast fallen down by thy iniquity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tollite vobiscum verba, et convertimini ad Dominum; et dicite ei: Omnem aufer iniquitatem, accipe bonum, et reddemus vitulos labiorum nostrorum."
      en: "Take with you words, and return to the Lord, and say to him: Take away all iniquity, and receive the good: and we will render the calves of our lips."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Assur non salvabit nos: super equum non ascendemus, nec dicemus ultra, Dii nostri opera manuum nostrarum: quia ejus, qui in te est, misereberis pupilli."
      en: "Assyria shall not save us, we will not ride upon horses, neither will we say any more: The works of our hands are our gods, for thou wilt have mercy on the fatherless that is in thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sanabo contritiones eorum; diligam eos spontanee: quia aversus est furor meus ab eis."
      en: "I will heal their breaches, I will love them freely: for my wrath is turned away from them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ero quasi ros; Israel germinabit sicut lilium, et erumpet radix ejus ut Libani."
      en: "I will be as the dew, Israel shall spring as the lily, and his root shall shoot forth as that of Libanus."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ibunt rami ejus, et erit quasi oliva gloria ejus, et odor ejus ut Libani."
      en: "His branches shall spread, and his glory shall be as the olive tree: and his smell as that of Libanus."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Convertentur sedentes in umbra ejus; vivent tritico, et germinabunt quasi vinea; memoriale ejus sicut vinum Libani."
      en: "They shall be converted that sit under his shadow: they shall live upon wheat, and they shall blossom as a vine: his memorial shall be as the wine of Libanus."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ephraim, quid mihi ultra idola? Ego exaudiam, et dirigam eum ego ut abietem virentem; ex me fructus tuus inventus est."
      en: "Ephraim shall say, What have I to do any more with idols? I will hear him, and I will make him flourish like a green fir tree: from me is thy fruit found."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quis sapiens, et intelliget ista? intelligens, et sciet haec? quia rectae viae Domini, et justi ambulabunt in eis; praevaricatores vero corruent in eis."
      en: "Who is wise, and he shall understand these things? prudent, and he shall know these things? for the ways of the Lord are right, and the just shall walk in them: but the transgressors shall fall in them."
    status: { la: verified, en: verified }
