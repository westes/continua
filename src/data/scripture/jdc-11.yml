# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdc
chapter: 11
verses:
  - n: 1
    text:
      la: "fuit illo tempore Iepthae Galaadites vir fortissimus atque pugnator filius meretricis mulieris qui natus est de Galaad"
      en: "There was at that time Jephte the Galaadite, a most valiant man and a warrior, the son of a woman that was a harlot, and his father was Galaad."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "habuit autem Galaad uxorem de qua suscepit filios qui postquam creverant eiecerunt Iepthae dicentes heres in domo patris nostri esse non poteris quia de altera matre generatus es"
      en: "Now Galaad had a wife of whom he had sons: who after they were grown up, thrust out Jephte, saying: Thou canst not inherit in the house of our father, because thou art born of another mother."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quos ille fugiens atque devitans habitavit in terra Tob congregatique sunt ad eum viri inopes et latrocinantes et quasi principem sequebantur"
      en: "Then he fled and avoided them and dwelt in the land of Tob: and there were gathered to him needy men, and robbers, and they followed him as their prince."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in illis diebus pugnabant filii Ammon contra Israhel"
      en: "In those days the children of Ammon made war against Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quibus acriter instantibus perrexerunt maiores natu de Galaad ut tollerent in auxilium sui Iepthae de terra Tob"
      en: "And as they pressed hard upon them, the ancients of Galaad went to fetch Jephte out of the land of Tob to help them:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixeruntque ad eum veni et esto princeps noster et pugna contra filios Ammon"
      en: "And they said to him: Come thou and be our prince, and fight against the children of Ammon."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quibus ille respondit nonne vos estis qui odistis me et eiecistis de domo patris mei et nunc venistis ad me necessitate conpulsi"
      en: "And he answered them: Are not you the men that hated me, and cast me out of my father's house, and now you are come to me constrained by necessity?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixeruntque principes Galaad ad Iepthae ob hanc igitur causam nunc ad te venimus ut proficiscaris nobiscum et pugnes contra filios Ammon sisque dux omnium qui habitant in Galaad"
      en: "And the princes of Galaad said to Jephte: For this cause we are now come to thee, that thou mayst go with us, and fight against the children of Ammon, and be head over all the inhabitants of Galaad."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Iepthae quoque dixit eis si vere venistis ad me ut pugnem pro vobis contra filios Ammon tradideritque eos Dominus in manus meas ego ero princeps vester"
      en: "Jephte also said to them: If you be come to me sincerely, that I should fight for you against the children of Ammon, and the Lord shall deliver them into my band, shall I be your prince?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui responderunt ei Dominus qui haec audit ipse mediator ac testis est quod nostra promissa faciamus"
      en: "They answered him: The Lord who heareth these things, he himself is mediator and witness that we will do as we have promised."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "abiit itaque Iepthae cum principibus Galaad fecitque eum omnis populus principem sui locutusque est Iepthae omnes sermones suos coram Domino in Maspha"
      en: "Jephte therefore went with the princes of Galaad, and all the people made him their prince. And Jephte spoke all his words before the Lord in Maspha."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et misit nuntios ad regem filiorum Ammon qui ex persona sua dicerent quid mihi et tibi est quia venisti contra me ut vastares terram meam"
      en: "And he sent messengers to the king of the children of Ammon, to say in his name, What hast thou to do with me, that thou art come against me, to waste my land?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quibus ille respondit quia tulit Israhel terram meam quando ascendit de Aegypto a finibus Arnon usque Iaboc atque Iordanem nunc igitur cum pace redde mihi eam"
      en: "And he answered them: I Because Israel took away my land when he came up out of Egypt, from the confines of the Arnon unto the Jaboc and the Jordan: now therefore restore the same peaceably to me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "per quos rursum mandavit Iepthae et imperavit eis ut dicerent regi Ammon"
      en: "And Jephte again sent word by them, and commanded them to say to the king of Ammon:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "haec dicit Iepthae non tulit Israhel terram Moab nec terram filiorum Ammon"
      en: "Thus saith Jephte: Israel did not take away the land of Moab, nor the land of the children of Ammon:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sed quando de Aegypto conscenderunt ambulavit per solitudinem usque ad mare Rubrum et venit in Cades"
      en: "But when they came up out of Egypt, he walked through the desert to the Red Sea and came into Cades."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "misitque nuntios ad regem Edom dicens dimitte ut transeam per terram tuam qui noluit adquiescere precibus eius misit quoque et ad regem Moab qui et ipse transitum praebere contempsit mansit itaque in Cades"
      en: "And he sent messengers to the king of Edom, saying: Suffer me to pass through thy land. But he would not condescend to his request. He sent also to the king of Moab, who likewise refused to give him passage. He abode therefore in Cades,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et circuivit ex latere terram Edom et terram Moab venitque contra orientalem plagam terrae Moab et castrametatus est trans Arnon nec voluit intrare terminos Moab Arnon quippe confinium est terrae Moab"
      en: "And went round the land of Edom at the side, and the land of Moab: and came over against the east coast of the land of Moab, and camped on the other side of the Arnon: and he would not enter the bounds of Moab."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "misit itaque Israhel nuntios ad Seon regem Amorreorum qui habitabat in Esebon et dixerunt ei dimitte ut transeam per terram tuam usque ad fluvium"
      en: "So Israel sent messengers to Sehon king of the Amorrhites, who dwelt in Hesebon, and they said to him: Suffer me to pass through thy land to the river."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui et ipse Israhel verba despiciens non dimisit eum transire per terminos suos sed infinita multitudine congregata egressus est contra eum in Iassa et fortiter resistebat"
      en: "But he also despising the words of Israel, suffered him not to pass through his borders: but gathering an infinite multitude, went out against him to Jasa, and made strong opposition."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "tradiditque eum Dominus in manu Israhel cum omni exercitu suo qui percussit eum et possedit omnem terram Amorrei habitatoris regionis illius"
      en: "And the Lord delivered him with all his army into the hands of Israel, and he slew him, and possessed all the land of the Amorrhite the inhabitant of that country,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et universos fines eius de Arnon usque Iaboc et de solitudine usque ad Iordanem"
      en: "And all the coasts thereof from the Arnon to the Jaboc, and from the wilderness to the Jordan."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dominus ergo Deus Israhel subvertit Amorreum pugnante contra illum populo suo Israhel et tu nunc vis possidere terram eius"
      en: "So the Lord the God of Israel destroyed the Amorrhite, his people of Israel fighting against him, and wilt thou now possess this land?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "nonne ea quae possedit Chamos deus tuus tibi iure debentur quae autem Dominus Deus noster victor obtinuit in nostram cedent possessionem"
      en: "Are not those things which thy god Chamos possesseth, due to thee by right? But what the Lord our God hath obtained by conquest, shall be our possession:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "nisi forte melior es Balac filio Sepphor rege Moab aut docere potes quod iurgatus sit contra Israhel et pugnaverit contra eum"
      en: "Unless perhaps thou art better than Balac the son of Sephor king of Moab: or canst shew that he strove against Israel and fought against him,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quando habitavit in Esebon et viculis eius et in Aroer et villis illius vel in cunctis civitatibus iuxta Iordanem per trecentos annos quare tanto tempore nihil super hac repetitione temptastis"
      en: "Whereas he hath dwelt in Hesebon, and the villages thereof, and in Aroer, and its villages, and in all the cities near the Jordan, for three hundred years. Why have you for so long a time attempted nothing about this claim?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "igitur non ego pecco in te sed tu contra me male agis indicens mihi bella non iusta iudicet Dominus arbiter huius diei inter Israhel et inter filios Ammon"
      en: "Therefore I do not trespass against thee, but thou wrongest me by declaring an unjust war against me. The Lord be judge and decide this day between Israel and the children of Ammon."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "noluitque adquiescere rex filiorum Ammon verbis Iepthae quae per nuntios mandaverat"
      en: "And the king of the children of Ammon would not hearken to the words of Jephte, which he sent him by the messengers."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "factus est ergo super Iepthae spiritus Domini et circumiens Galaad et Manasse Maspha quoque Galaad et inde transiens ad filios Ammon"
      en: "Therefore the spirit of the Lord came upon Jephte, and going round Galaad, and Manasses, and Maspha of Galaad, and passing over from thence to the children of Ammon,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "votum vovit Domino dicens si tradideris filios Ammon in manus meas"
      en: "He made a vow to the Lord, saying: If thou wilt deliver the children of Ammon into my hands,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quicumque primus fuerit egressus de foribus domus meae mihique occurrerit revertenti cum pace a filiis Ammon eum holocaustum offeram Domino"
      en: "Whosoever shall first come forth out of the doors of my house, and shall meet me when I return in peace from the children of Ammon, the same will I offer a holocaust to the Lord."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "transivitque Iepthae ad filios Ammon ut pugnaret contra eos quos tradidit Dominus in manus eius"
      en: "And Jephte passed over to the children of Ammon, to fight against them: and the Lord delivered them into his hands."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "percussitque ab Aroer usque dum venias in Mennith viginti civitates et usque ad Abel quae est vineis consita plaga magna nimis humiliatique sunt filii Ammon a filiis Israhel"
      en: "And he smote them from Aroer till you come to Mennith, twenty cities, and as far as Abel, which is set with vineyards, with a very great slaughter: and the children of Ammon were humbled by the children of Israel."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "revertenti autem Iepthae in Maspha domum suam occurrit unigenita filia cum tympanis et choris non enim habebat alios liberos"
      en: "And when Jephte returned into Maspha to his house, his only daughter met him with timbrels and with dances: for he had no other children."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "qua visa scidit vestimenta sua et ait heu filia mi decepisti me et ipsa decepta es aperui enim os meum ad Dominum et aliud facere non potero"
      en: "And when he saw her, he rent his garments, and said: Alas! my daughter, thou hast deceived me, and thou thyself art deceived: for I have opened my mouth to the Lord, and I can do no other thing."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "cui illa respondit pater mi si aperuisti os tuum ad Dominum fac mihi quodcumque pollicitus es concessa tibi ultione atque victoria de hostibus tuis"
      en: "And she answered him: My father, if thou hast opened thy mouth to the Lord, do unto me whatsoever thou hast promised, since the victory hath been granted to thee, and revenge of thy enemies."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "dixitque ad patrem hoc solum mihi praesta quod deprecor dimitte me ut duobus mensibus circumeam montes et plangam virginitatem meam cum sodalibus meis"
      en: "And she said to her father: Grant me only this which I desire: Let me go, that I may go about the mountains for two months, and may bewail my virginity with my companions."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "cui ille respondit vade et dimisit eam duobus mensibus cumque abisset cum sociis ac sodalibus suis flebat virginitatem suam in montibus"
      en: "And he answered her: Go. And he sent her away for two months. And when she was gone with her comrades and companions, she mourned her virginity in the mountains."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "expletisque duobus mensibus reversa est ad patrem suum et fecit ei sicut voverat quae ignorabat virum exinde mos increbuit in Israhel et consuetudo servata est"
      en: "And the two months being expired, she returned to her father, and he did to her as he had vowed, and she knew no man. From thence came a fashion in Israel, and a custom has been kept:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "ut post anni circulum conveniant in unum filiae Israhel et plangant filiam Iepthae Galaaditae diebus quattuor"
      en: "That from year to year the daughters of Israel assemble together, and lament the daughter of Jephte the Galaadite for four days."
    status: { la: verified, en: verified }
