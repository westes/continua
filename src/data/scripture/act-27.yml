# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 27
verses:
  - n: 1
    text:
      la: "ut autem iudicatum est eum navigare in Italiam et tradi Paulum cum reliquis custodiis centurioni nomine Iulio cohortis Augustae"
      en: "And when it was determined that he should sail into Italy, and that Paul, with the other prisoners, should be delivered to a centurion, named Julius, of the band Augusta,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ascendentes autem navem hadrumetinam incipientem navigare circa Asiae loca sustulimus perseverante nobiscum Aristarcho Macedone Thessalonicense"
      en: "Going on board a ship of Adrumetum, we launched, meaning to sail by the coasts of Asia, Aristarchus, the Macedonian of Thessalonica, continuing with us."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sequenti autem die devenimus Sidonem humane autem tractans Iulius Paulum permisit ad amicos ire et curam sui agere"
      en: "And the day following we came to Sidon. And Julius treating Paul courteously, permitted him to go to his friends, and to take care of himself."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et inde cum sustulissemus subnavigavimus Cypro propterea quod essent venti contrarii"
      en: "And when we had launched from thence, we sailed under Cyprus, because the winds were contrary."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et pelagus Ciliciae et Pamphiliae navigantes venimus Lystram quae est Lyciae"
      en: "And sailing over the sea of Cilicia, and Pamphylia, we came to Lystra, which is in Lycia:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ibi inveniens centurio navem alexandrinam navigantem in Italiam transposuit nos in eam"
      en: "And there the centurion finding a ship of Alexandria sailing into Italy, removed us into it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et cum multis diebus tarde navigaremus et vix devenissemus contra Cnidum prohibente nos vento adnavigavimus Cretae secundum Salmonem"
      en: "And when for many days we had sailed slowly, and were scarce come over against Gnidus, the wind not suffering us, we sailed near Crete by Salmone:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et vix iuxta navigantes venimus in locum quendam qui vocatur Boni portus cui iuxta erat civitas Thalassa"
      en: "And with much ado sailing by it, we came into a certain place, which is called Good-havens, nigh to which was the city of Thalassa."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "multo autem tempore peracto et cum iam non esset tuta navigatio eo quod et ieiunium iam praeterisset consolabatur Paulus"
      en: "And when much time was spent, and when sailing now was dangerous, because the fast was now past, Paul comforted them,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dicens eis viri video quoniam cum iniuria et multo damno non solum oneris et navis sed etiam animarum nostrarum incipit esse navigatio"
      en: "Saying to them: Ye men, I see that the voyage beginneth to be with injury and much damage, not only of the lading and ship, but also of our lives."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "centurio autem gubernatori et nauclerio magis credebat quam his quae a Paulo dicebantur"
      en: "But the centurion believed the pilot and the master of the ship, more than those things which were said by Paul."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et cum aptus portus non esset ad hiemandum plurimi statuerunt consilium navigare inde si quo modo possent devenientes Phoenice hiemare portum Cretae respicientem ad africum et ad chorum"
      en: "And whereas it was not a commodious haven to winter in, the greatest part gave counsel to sail thence, if by any means they might reach Phenice to winter there, which is a haven of Crete, looking towards the southwest and northwest."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "adspirante autem austro aestimantes propositum se tenere cum sustulissent de Asson legebant Cretam"
      en: "And the south wind gently blowing, thinking that they had obtained their purpose, when they had loosed from Asson, they sailed close by Crete."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "non post multum autem misit se contra ipsam ventus typhonicus qui vocatur euroaquilo"
      en: "But not long after, there arose against it a tempestuous wind, called Euroaquilo."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cumque arrepta esset navis et non posset conari in ventum data nave flatibus ferebamur"
      en: "And when the ship was caught, and could not bear up against the wind, giving up the ship to the winds, we were driven."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "insulam autem quandam decurrentes quae vocatur Caudam potuimus vix obtinere scapham"
      en: "And running under a certain island, that is called Cauda, we had much work to come by the boat."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qua sublata adiutoriis utebantur accingentes navem timentes ne in Syrtim inciderent submisso vase sic ferebantur"
      en: "Which being taken up, they used helps, undergirding the ship, and fearing lest they should fall into the quicksands, they let down the sail yard, and so were driven."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "valide autem nobis tempestate iactatis sequenti die iactum fecerunt"
      en: "And we being mightily tossed with the tempest, the next day they lightened the ship."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et tertia die suis manibus armamenta navis proiecerunt"
      en: "And the third day they cast out with their own hands the tackling of the ship."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "neque sole autem neque sideribus apparentibus per plures dies et tempestate non exigua inminente iam ablata erat spes omnis salutis nostrae"
      en: "And when neither sun nor stars appeared for many days, and no small storm lay on us, all hope of our being saved was now taken away."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et cum multa ieiunatio fuisset tunc stans Paulus in medio eorum dixit oportebat quidem o viri audito me non tollere a Creta lucrique facere iniuriam hanc et iacturam"
      en: "And after they had fasted a long time, Paul standing forth in the midst of them, said: You should indeed, O ye men, have hearkened unto me, and not have loosed from Crete, and have gained this harm and loss."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et nunc suadeo vobis bono animo esse amissio enim nullius animae erit ex vobis praeterquam navis"
      en: "And now I exhort you to be of good cheer. For there shall be no loss of any man's life among you, but only of the ship."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "adstitit enim mihi hac nocte angelus Dei cuius sum ego et cui deservio"
      en: "For an angel of God, whose I am, and whom I serve, stood by me this night,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dicens ne timeas Paule Caesari te oportet adsistere et ecce donavit tibi Deus omnes qui navigant tecum"
      en: "Saying: Fear not, Paul, thou must be brought before Caesar; and behold, God hath given thee all them that sail with thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "propter quod bono animo estote viri credo enim Deo quia sic erit quemadmodum dictum est mihi"
      en: "Wherefore, sirs, be of good cheer; for I believe God that it shall so be, as it hath been told me."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "in insulam autem quandam oportet nos devenire"
      en: "And we must come unto a certain island."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sed posteaquam quartadecima nox supervenit navigantibus nobis in Hadria circa mediam noctem suspicabantur nautae apparere sibi aliquam regionem"
      en: "But after the fourteenth night was come, as we were sailing in Adria, about midnight, the shipmen deemed that they discovered some country."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui submittentes invenerunt passus viginti et pusillum inde separati invenerunt passus quindecim"
      en: "Who also sounding, found twenty fathoms; and going on a little further, they found fifteen fathoms."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "timentes autem ne in aspera loca incideremus de puppi mittentes anchoras quattuor optabant diem fieri"
      en: "Then fearing lest we should fall upon rough places, they cast four anchors out of the stern, and wished for the day."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "nautis vero quaerentibus fugere de navi cum misissent scapham in mare sub obtentu quasi a prora inciperent anchoras extendere"
      en: "But as the shipmen sought to fly out of the ship, having let down the boat into the sea, under colour, as though they would have cast anchors out of the forepart of the ship,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "dixit Paulus centurioni et militibus nisi hii in navi manserint vos salvi fieri non potestis"
      en: "Paul said to the centurion, and to the soldiers: Except these stay in the ship, you cannot be saved."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "tunc absciderunt milites funes scaphae et passi sunt eam excidere"
      en: "Then the soldiers cut off the ropes of the boat, and let her fall off."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et cum lux inciperet fieri rogabat Paulus omnes sumere cibum dicens quartadecima hodie die expectantes ieiuni permanetis nihil accipientes"
      en: "And when it began to be light, Paul besought them all to take meat, saying: This day is the fourteenth day that you have waited, and continued fasting, taking nothing."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "propter quod rogo vos accipere cibum pro salute vestra quia nullius vestrum capillus de capite peribit"
      en: "Wherefore I pray you to take some meat for your health's sake; for there shall not an hair of the head of any of you perish."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et cum haec dixisset sumens panem gratias egit Deo in conspectu omnium et cum fregisset coepit manducare"
      en: "And when he had said these things, taking bread, he gave thanks to God in the sight of them all; and when he had broken it, he began to eat."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "animaequiores autem facti omnes et ipsi adsumpserunt cibum"
      en: "Then were they all of better cheer, and they also took some meat."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "eramus vero universae animae in navi ducentae septuaginta sex"
      en: "And we were in all in the ship, two hundred threescore and sixteen souls."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et satiati cibo adleviabant navem iactantes triticum in mare"
      en: "And when they had eaten enough, they lightened the ship, casting the wheat into the sea."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "cum autem dies factus esset terram non agnoscebant sinum vero quendam considerabant habentem litus in quem cogitabant si possent eicere navem"
      en: "And when it was day, they knew not the land; but they discovered a certain creek that had a shore, into which they minded, if they could, to thrust in the ship."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et cum anchoras abstulissent committebant se mari simul laxantes iuncturas gubernaculorum et levato artemone secundum flatum aurae tendebant ad litus"
      en: "And when they had taken up the anchors, they committed themselves to the sea, loosing withal the rudder bands; and hoisting up the mainsail to the wind, they made towards shore."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et cum incidissemus in locum bithalassum inpegerunt navem et prora quidem fixa manebat inmobilis puppis vero solvebatur a vi maris"
      en: "And when we were fallen into a place where two seas met, they run the ship aground; and the forepart indeed, sticking fast, remained unmoveable: but the hinder part was broken with the violence of the sea."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "militum autem consilium fuit ut custodias occiderent ne quis cum enatasset effugeret"
      en: "And the soldiers' counsel was, that they should kill the prisoners, lest any of them, swimming out, should escape."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "centurio autem volens servare Paulum prohibuit fieri iussitque eos qui possent natare mittere se primos et evadere et ad terram exire"
      en: "But the centurion, willing to save Paul, forbade it to be done; and he commanded that they who could swim, should cast themselves first into the sea, and save themselves, and get to land."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et ceteros alios in tabulis ferebant quosdam super ea quae de navi essent et sic factum est ut omnes animae evaderent ad terram"
      en: "And the rest, some they carried on boards, and some on those things that belonged to the ship. And so it came to pass, that every soul got safe to land."
    status: { la: verified, en: verified }
