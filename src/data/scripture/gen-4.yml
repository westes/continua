# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 4
verses:
  - n: 1
    text:
      la: "Adam vero cognovit uxorem suam Hevam, quae concepit et peperit Cain, dicens: Possedi hominem per Deum."
      en: "And Adam knew Eve his wife: who conceived and brought forth Cain, saying: I have gotten a man through God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Rursumque peperit fratrem ejus Abel. Fuit autem Abel pastor ovium, et Cain agricola."
      en: "And again she brought forth his brother Abel. And Abel was a shepherd, and Cain a husbandman."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Factum est autem post multos dies ut offerret Cain de fructibus terrae munera Domino."
      en: "And it came to pass after many days, that Cain offered, of the fruits of the earth, gifts to the Lord."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Abel quoque obtulit de primogenitis gregis sui, et de adipibus eorum: et respexit Dominus ad Abel, et ad munera ejus."
      en: "Abel also offered of the firstlings of his flock, and of their fat: and the Lord had respect to Abel, and to his offerings."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ad Cain vero, et ad munera illius non respexit: iratusque est Cain vehementer, et concidit vultus ejus."
      en: "But to Cain and his offerings he had no respect: and Cain was exceedingly angry, and his countenance fell."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixitque Dominus ad eum: Quare iratus es? et cur concidit facies tua?"
      en: "And the Lord said to him: Why art thou angry? and why is thy countenance fallen?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nonne si bene egeris, recipies: sin autem male, statim in foribus peccatum aderit? sed sub te erit appetitus ejus, et tu dominaberis illius."
      en: "If thou do well, shalt thou not receive? but if ill, shall not sin forthwith be present at the door? but the lust thereof shall be under thee, and thou shalt have dominion over it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixitque Cain ad Abel fratrem suum: Egrediamur foras. Cumque essent in agro, consurrexit Cain adversus fratrem suum Abel, et interfecit eum."
      en: "And Cain said to Abel his brother: Let us go forth abroad. And when they were in the field, Cain rose up against his brother Abel, and slew him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ait Dominus ad Cain: Ubi est Abel frater tuus? Qui respondit: Nescio: num custos fratris mei sum ego?"
      en: "And the Lord said to Cain: Where is thy brother Abel? And he answered, I know not: am I my brother's keeper?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixitque ad eum: Quid fecisti? vox sanguinis fratris tui clamat ad me de terra."
      en: "And he said to him: What hast thou done? the voice of thy brother's blood crieth to me from the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nunc igitur maledictus eris super terram, quae aperuit os suum, et suscepit sanguinem fratris tui de manu tua."
      en: "Now, therefore, cursed shalt thou be upon the earth, which hath opened her mouth and received the blood of thy brother at thy hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum operatus fueris eam, non dabit tibi fructus suos: vagus et profugus eris super terram."
      en: "When thou shalt till it, it shall not yield to thee its fruit: a fugitive and a vagabond shalt thou be upon the earth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixitque Cain ad Dominum: Major est iniquitas mea, quam ut veniam merear."
      en: "And Cain said to the Lord: My iniquity is greater than that I may deserve pardon."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ecce ejicis me hodie a facie terrae, et a facie tua abscondar, et ero vagus et profugus in terra: omnis igitur qui invenerit me, occidet me."
      en: "Behold thou dost cast me out this day from the face of the earth, and I shall be hidden from thy face, and I shall be a vagabond and a fugitive on the earth: every one, therefore, that findeth me, shall kill me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixitque ei Dominus: Nequaquam ita fiet: sed omnis qui occiderit Cain, septuplum punietur. Posuitque Dominus Cain signum, ut non interficeret eum omnis qui invenisset eum."
      en: "And the Lord said to him: No, it shall not be so: but whosoever shall kill Cain, shall be punished sevenfold. And the Lord set a mark upon Cain, that whosoever found him should not kill him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Egressusque Cain a facie Domini, habitavit profugus in terra ad orientalem plagam Eden."
      en: "And Cain went out from the face of the Lord, and dwelt as a fugitive on the earth, at the east side of Eden."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cognovit autem Cain uxorem suam, quae concepit, et peperit Henoch: et aedificavit civitatem, vocavitque nomen ejus ex nomine filii sui, Henoch."
      en: "And Cain knew his wife, and she conceived, and brought forth Henoch: and he built a city, and called the name thereof by the name of his son Henoch."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Porro Henoch genuit Irad, et Irad genuit Maviael, et Maviael genuit Mathusael, et Mathusael genuit Lamech."
      en: "And Henoch begot Irad, and Irad begot Maviael, and Maviael begot Mathusael, and Mathusael begot Lamech:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Qui accepit duas uxores, nomen uni Ada, et nomen alteri Sella."
      en: "Who took two wives: the name of the one was Ada, and the name of the other Sella."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Genuitque Ada Jabel, qui fuit pater habitantium in tentoriis, atque pastorum."
      en: "And Ada brought forth Jabel: who was the father of such as dwell in tents, and of herdsmen."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et nomen fratris ejus Jubal: ipse fuit pater canentium cithara et organo."
      en: "And his brother's name was Jubal; he was the father of them that play upon the harp and the organs."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Sella quoque genuit Tubalcain, qui fuit malleator et faber in cuncta opera aeris et ferri. Soror vero Tubalcain, Noema."
      en: "Sella also brought forth Tubalcain, who was a hammerer and artificer in every work of brass and iron. And the sister of Tubalcain was Noema."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dixitque Lamech uxoribus suis Adae et Sellae: Audite vocem meam, uxores Lamech; auscultate sermonem meum: quoniam occidi virum in vulnus meum, et adolescentulum in livorem meum."
      en: "And Lamech said to his wives Ada and Sella: Hear my voice, ye wives of Lamech, hearken to my speech: for I have slain a man to the wounding of myself, and a stripling to my own bruising."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Septuplum ultio dabitur de Cain: de Lamech vero septuagies septies."
      en: "Sevenfold vengeance shall be taken for Cain: but for Lamech seventy times sevenfold."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Cognovit quoque adhuc Adam uxorem suam: et peperit filium, vocavitque nomen ejus Seth, dicens: Posuit mihi Deus semen aliud pro Abel, quem occidit Cain."
      en: "Adam also knew his wife again: and she brought forth a son, and called his name Seth, saying: God hath given me another seed, for Abel whom Cain slew."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sed et Seth natus est filius, quem vocavit Enos: iste coepit invocare nomen Domini."
      en: "But to Seth also was born a son, whom he called Enos; this man began to call upon the name of the Lord."
    status: { la: verified, en: verified }
