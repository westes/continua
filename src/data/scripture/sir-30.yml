# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 30
verses:
  - n: 1
    text:
      la: "de filiis qui diligit filium suum adsiduat illi flagella ut laetetur in novissimo suo"
      en: "He that loveth his son, frequently chastiseth him, that he may rejoice in his latter end, and not grope after the doors of his neighbours."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui docet filium suum laudabitur in illo et in medio domesticorum in illo gloriabitur"
      en: "He that instructeth his son shall be praised in him, and shall glory in him in the midst of them of his household."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui docet filium suum in zelum mittit inimicum et in medio amicorum gloriabitur in illo"
      en: "He that teacheth his son, maketh his enemy jealous, and in the midst of his friends he shall glory in him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "mortuus est pater illius et quasi non est mortuus similem enim reliquit sibi post se"
      en: "His father is dead, and he is as if he were not dead: for he hath left one behind him that is like himself."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in vita ipsius vidit et laetatus est in illo in obitu illius non est contristatus nec confusus est coram inimicis"
      en: "While he lived he saw and rejoiced in him: and when he died he was not sorrowful, neither was he confounded before his enemies."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "reliquit enim defensorem domus et amicis reddentem gratiam"
      en: "For he left behind him a defender of his house against his enemies, and one that will requite kindness to his friends."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "pro animabus filiorum conligabit vulnera sua et super omnem vocem turbabuntur viscera eius"
      en: "For the souls of his sons he shall bind up his wounds, and at every cry his bowels shall be troubled."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "equus indomitus evadit durus et filius remissus evadit praeceps"
      en: "A horse not broken becometh stubborn, and a child left to himself will become headstrong."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "lacta filium et paventem te faciet lude cum eo et contristabit te"
      en: "Give thy son his way, and he shall make thee afraid: play with him, and he shall make thee sorrowful."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "non conrideas illi ne doleas et in novissimo obstupescent dentes tui"
      en: "Laugh not with him, lest thou have sorrow, and at the last thy teeth be set on edge."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non des illi potestatem in iuventute et ne despicias cogitatus illius"
      en: "Give him not liberty in his youth, and wink not at his devices."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "curva cervicem eius in iuventute et tunde latera illius dum infans est ne forte induret et non credat tibi et erit tibi dolor animae"
      en: "Bow down his neck while he is young, and beat his sides while he is a child, lest he grow stubborn, and regard thee not, and so be a sorrow of heart to thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "doce filium tuum et operare in illum ne in turpitudinem illius offendas"
      en: "Instruct thy son, and labour about him, lest his lewd behaviour be an offence to thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "melior est pauper sanus et fortis viribus quam dives inbecillis et flagellatus malitia"
      en: "Better is a poor man who is sound, and strong of constitution, than a rich man who is weak and afflicted with evils."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "salus animae in sanctitate iustitiae et melior omni auro et argento et corpus validum quam census inmensus"
      en: "Health of the soul in holiness of justice, is better then all gold and silver: and a sound body, than immense revenues."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non est census super censum salutis corporis et non est oblectatio super cordis gaudium"
      en: "There is no riches above the riches of the health of the body: and there is no pleasure above the joy of the heart."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "melior est mors quam vita amara et requies aeterna quam languor perseverans"
      en: "Better is death than a bitter life: and everlasting rest, than continual sickness."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "bona absconsa in ore cluso quasi adpositiones epularum circumpositae sepulchro"
      en: "Good things that are hidden in a mouth that is shut, are as masses of meat set about a grave."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quid proderit libatio idolo nec enim manducat nec odorabitur"
      en: "What good shall an offering do to an idol? for it can neither eat, nor smell:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sic qui effugatur a Domino et portans mercedes iniquitatis"
      en: "So is he that is persecuted by the Lord, bearing the reward of his iniquity:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "videns oculis et ingemescens sicut spado conplectens virginem et suspirans"
      en: "He seeth with his eyes, and groaneth, as an eunuch embracing a virgin, and sighing."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "tristitiam non des animae tuae et non adfligas temet ipsum in consilio tuo"
      en: "Give not up thy soul to sadness, and afflict not thyself in thy own counsel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "iucunditas cordis haec est vita hominis et thesaurus sine defectione sanctitatis et exultatio viri est longevitas"
      en: "The joyfulness of the heart, is the life of a man, and a never failing treasure of holiness: and the joy of a man is length of life."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "miserere animae tuae placens Deo et contine et congrega cor tuum in sanctitate eius et tristitiam longe expelle a te"
      en: "Have pity on thy own soul, pleasing God, and contain thyself: gather up thy heart in his holiness: and drive away sadness far from thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "multos enim occidit tristitia et non est utilitas in illa"
      en: "For sadness hath killed many, and there is no profit in it."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "zelus et iracundia minuit dies et ante tempus senectam adducit cogitatus"
      en: "Envy and anger shorten a man's days, and pensiveness will bring old age before the time."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "splendidum cor bonum in epulis epulae enim illius diligenter fiunt"
      en: "A Cheerful and good heart is always feasting: for his banquets are prepared with diligence."
    status: { la: verified, en: verified }
