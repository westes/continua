# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 27
verses:
  - n: 1
    text:
      la: "Viginti quinque annorum erat Joatham cum regnare coepisset, et sedecim annis regnavit in Jerusalem: nomen matris ejus Jerusa filia Sadoc."
      en: "Joatham was five and twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: the name of his mother was Jerusa the daughter of Sadoc."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fecitque quod rectum erat coram Domino juxta omnia quae fecerat Ozias pater suus, excepto quod non est ingressus templum Domini, et adhuc populus delinquebat."
      en: "And he did that which was right before the Lord, according to all that Ozias his father had done, only that he entered not into the temple of the Lord, and the people still transgressed."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ipse aedificavit portam domus Domini excelsam, et in muro Ophel multa construxit."
      en: "He built the high gate of the house of the Lord, and on the wall of Ophel he built much."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Urbes quoque aedificavit in montibus Juda, et in saltibus castella, et turres."
      en: "Moreover he built cities in the mountains of Juda, and castles and towers in the forests."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ipse pugnavit contra regem filiorum Ammon, et vicit eos, dederuntque ei filii Ammon in tempore illo centum talenta argenti, et decem millia coros tritici, ac totidem coros hordei: haec ei praebuerunt filii Ammon in anno secundo et tertio."
      en: "He fought against the king of the children of Ammon, and overcame them, and the children of Ammon gave him at that time a hundred talents of silver, and ten thousand measures of wheat, and as many measures of barley: so much did the children of Ammon give him in the second and third year."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Corroboratusque est Joatham, eo quod direxisset vias suas coram Domino Deo suo."
      en: "And Joatham was strengthened, because he had his way directed before the Lord his God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Reliqua autem sermonum Joatham, et omnes pugnae ejus, et opera, scripta sunt in libro regum Israel et Juda."
      en: "Now the rest of the acts of Joatham, and all his wars, and his works, are written in the book of the kings of Israel and Juda."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Viginti quinque annorum erat cum regnare coepisset, et sedecim annis regnavit in Jerusalem."
      en: "He was five and twenty years old when he began to reign, and he reigned sixteen years in Jerusalem."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dormivitque Joatham cum patribus suis, et sepelierunt eum in civitate David: et regnavit Achaz filius ejus pro eo."
      en: "And Joatham slept with his fathers, and they buried him in the city of David: and Achaz his son reigned in his stead."
    status: { la: verified, en: verified }
