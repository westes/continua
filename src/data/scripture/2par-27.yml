# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 27
verses:
  - n: 1
    text:
      la: "viginti quinque annorum erat Ioatham cum regnare coepisset et sedecim annis regnavit in Hierusalem nomen matris eius Hierusa filia Sadoc"
      en: "Joatham was five and twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: the name of his mother was Jerusa the daughter of Sadoc."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fecitque quod rectum erat coram Domino iuxta omnia quae fecerat Ozias pater suus excepto quod non est ingressus templum Domini et adhuc populus delinquebat"
      en: "And he did that which was right before the Lord, according to all that Ozias his father had done, only that he entered not into the temple of the Lord, and the people still transgressed."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ipse aedificavit portam domus Domini Excelsam et in muro Ophel multa construxit"
      en: "He built the high gate of the house of the Lord, and on the wall of Ophel he built much."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "urbes quoque aedificavit in montibus Iuda et in saltibus castella et turres"
      en: "Moreover he built cities in the mountains of Juda, and castles and towers in the forests."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ipse pugnavit contra regem filiorum Ammon et vicit eos dederuntque ei filii Ammon in tempore illo centum talenta argenti et decem milia choros tritici ac totidem choros hordei haec ei praebuerunt filii Ammon in anno secundo et tertio"
      en: "Ho fought against the king of the children of Ammon, and overcame them, and the children of Ammon gave him at that time a hundred talents of silver, and ten thousand measures of wheat, and as many measures of barley: so much did the children of Ammon give him in the second and third year."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "corroboratusque est Ioatham eo quod direxisset vias suas coram Domino Deo suo"
      en: "And Joatham was strengthened, be- cause he had his way directed before the Lord his God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "reliqua autem sermonum Ioatham et omnes pugnae eius et opera scripta sunt in libro regum Israhel et Iuda"
      en: "Now the rest of the acts of Joatham, and all his wars, and his works, are written in the book of the kings of Israel and Juda."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "viginti quinque annorum erat cum regnare coepisset et sedecim annis regnavit in Hierusalem"
      en: "He was five and twenty years old when he began to reign, and he reigned sixteen years in Jerusalem."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dormivitque Ioatham cum patribus suis et sepelierunt eum in civitate David et regnavit Achaz filius eius pro eo"
      en: "And Joatham slept with his fathers, and they buried him in the city of David: and Achaz his son reigned in his stead."
    status: { la: verified, en: verified }
