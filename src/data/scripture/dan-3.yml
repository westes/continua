  - n: 80
    text:
      la: "Benedicite, omnes volucres caeli, Domino: laudate et superexaltate eum in saecula."
      en: "O all ye fowls of the air, bless the Lord: praise and exalt him above all for ever."
    status: { la: verified, en: verified }
  - n: 81
    text:
      la: "Benedicite, omnes bestiae et pecora, Domino: laudate et superexaltate eum in saecula."
      en: "O all ye beasts and cattle, bless the Lord: praise and exalt him above all for ever."
    status: { la: verified, en: verified }
  - n: 82
    text:
      la: "Benedicite, filii hominum, Domino: laudate et superexaltate eum in saecula."
      en: "O ye sons of men, bless the Lord, praise and exalt him above all for ever."
    status: { la: verified, en: verified }
  - n: 83
    text:
      la: "Benedicat Israel Dominum: laudet et superexaltet eum in saecula."
      en: "O let Israel bless the Lord: let them praise and exalt him above all for ever."
    status: { la: verified, en: verified }
  - n: 84
    text:
      la: "Benedicite, sacerdotes Domini, Domino: laudate et superexaltate eum in saecula."
      en: "O ye priests of the Lord, bless the Lord: praise and exalt him above all for ever."
    status: { la: verified, en: verified }
  - n: 85
    text:
      la: "Benedicite, servi Domini, Domino: laudate et superexaltate eum in saecula."
      en: "O ye servants of the Lord, bless the Lord: praise and exalt him above all for ever."
    status: { la: verified, en: verified }
  - n: 86
    text:
      la: "Benedicite, spiritus et animae justorum, Domino: laudate et superexaltate eum in saecula."
      en: "O ye spirits and souls of the just, bless the Lord: praise and exalt him above all for ever."
    status: { la: verified, en: verified }
  - n: 87
    text:
      la: "Benedicite, sancti et humiles corde, Domino: laudate et superexaltate eum in saecula."
      en: "O ye holy and humble of heart, bless the Lord: praise and exalt him above all for ever."
    status: { la: verified, en: verified }
  - n: 88
    text:
      la: "Benedicite, Anania, Azaria, Misael, Domino: laudate et superexaltate eum in saecula: quia eruit nos de inferno, et salvos fecit de manu mortis: et liberavit nos de medio ardentis flammae, et de medio ignis eruit nos."
      en: "O Ananias, Azarias, and Misael, bless ye the Lord: praise and exalt him above all for ever. For he hath delivered us from hell, and saved us out of the hand of death, and delivered us out of the midst of the burning flame, and saved us out of the midst of the fire."
    status: { la: verified, en: verified }
  - n: 89
    text:
      la: "Confitemini Domino, quoniam bonus: quoniam in saeculum misericordia ejus."
      en: "O give thanks to the Lord, because he is good: because his mercy endureth for ever and ever."
    status: { la: verified, en: verified }
  - n: 90
    text:
      la: "Benedicite, omnes religiosi, Domino Deo deorum: laudate et confitemini ei, quia in omnia saecula misericordia ejus."
      en: "O all ye religious, bless the Lord the God of gods: praise him and give him thanks, because his mercy endureth for ever and ever."
    status: { la: verified, en: verified }
  - n: 91
    text:
      la: "Tunc Nabuchodonosor rex obstupuit, et surrexit propere, et ait optimatibus suis: Nonne tres viros misimus in medium ignis compeditos? Qui respondentes regi, dixerunt: Vere, rex."
      en: "Then Nabuchodonosor the king was astonished, and rose up in haste, and said to his nobles: Did we not cast three men bound into the midst of the fire? They answered the king, and said: True, O king."
    status: { la: verified, en: verified }
  - n: 92
    text:
      la: "Respondit, et ait: Ecce ego video quatuor viros solutos, et ambulantes in medio ignis, et nihil corruptionis in eis est, et species quarti similis filio Dei."
      en: "He answered, and said: Behold I see four men loose, and walking in the midst of the fire, and there is no hurt in them, and the form of the fourth is like the Son of God."
    status: { la: verified, en: verified }
  - n: 93
    text:
      la: "Tunc accessit Nabuchodonosor ad ostium fornacis ignis ardentis, et ait: Sidrach, Misach, et Abdenago, servi Dei excelsi, egredimini, et venite. Statimque egressi sunt Sidrach, Misach, et Abdenago de medio ignis."
      en: "Then Nabuchodonosor came to the door of the burning fiery furnace, and said: Sidrach, Misach, and Abdenago, ye servants of the most high God, go ye forth, and come. And immediately Sidrach, Misach, and Abdenago went out from the midst of the fire."
    status: { la: verified, en: verified }
  - n: 94
    text:
      la: "Et congregati satrapae, et magistratus, et judices, et potentes regis contemplabantur viros illos, quoniam nihil potestatis habuisset ignis in corporibus eorum, et capillus capitis eorum non esset adustus, et sarabala eorum non fuissent immutata, et odor ignis non transisset per eos."
      en: "And the nobles, and the magistrates, and the judges, and the great men of the king being gathered together, considered these men, that the fire had no power on their bodies, and that not a hair of their head had been singed, nor their garments altered, nor the smell of the fire had passed on them."
    status: { la: verified, en: verified }
  - n: 95
    text:
      la: "Et erumpens Nabuchodonosor, ait: Benedictus Deus eorum, Sidrach videlicet, Misach, et Abdenago: qui misit angelum suum, et eruit servos suos, qui crediderunt in eum: et verbum regis immutaverunt, et tradiderunt corpora sua ne servirent, et ne adorarent omnem deum, excepto Deo suo."
      en: "Then Nabuchodonosor breaking forth, said: Blessed be the God of them, to wit, of Sidrach, Misach, and Abdenago, who hath sent his angel, and delivered his servants that believed in him: and they changed the king's word, and delivered up their bodies that they might not serve, nor adore any god, except their own God."
    status: { la: verified, en: verified }
  - n: 96
    text:
      la: "A me ergo positum est hoc decretum: ut omnis populus, tribus, et lingua, quaecumque locuta fuerit blasphemiam contra Deum Sidrach, Misach, et Abdenago, dispereat, et domus ejus vastetur: neque enim est alius Deus, qui possit ita salvare."
      en: "By me therefore this decree is made, that every people, tribe, and tongue, which shall speak blasphemy against the God of Sidrach, Misach, and Abdenago, shall be destroyed, and their houses laid waste: for there is no other God that can save in this manner."
    status: { la: verified, en: verified }
  - n: 97
    text:
      la: "Tunc rex promovit Sidrach, Misach, et Abdenago in provincia Babylonis."
      en: "Then the king promoted Sidrach, Misach, and Abdenago, in the province of Babylon."
    status: { la: verified, en: verified }
  - n: 98
    text:
      la: "Nabuchodonosor rex, omnibus populis, gentibus, et linguis, qui habitant in universa terra, pax vobis multiplicetur."
      en: "Nabuchodonosor the king, to all peoples, nations, and tongues, that dwell in all the earth, peace be multiplied unto you."
    status: { la: verified, en: verified }
  - n: 99
    text:
      la: "Signa, et mirabilia fecit apud me Deus excelsus. Placuit ergo mihi praedicare"
      en: "The most high God hath wrought signs and wonders toward me. It hath seemed good to me therefore to publish"
    status: { la: verified, en: verified }
  - n: 100
    text:
      la: "signa ejus, quia magna sunt: et mirabilia ejus, quia fortia: et regnum ejus regnum sempiternum, et potestas ejus in generationem et generationem."
      en: "His signs, because they are great: and his wonders, because they are mighty: and his kingdom is an everlasting kingdom, and his power to all generations."
    status: { la: verified, en: verified }
