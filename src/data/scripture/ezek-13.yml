# Ezekiel (Vulgate "Ezechiel," cited "Ezech"), chapter 13.
# Verses transcribed from all-saints-octave-day-6.yml (already pulled
# from Divinum Officium, Monastic Tridentinum 1617) as part of the
# migration to a dedicated scripture store (2026-08 decision).
book: ezek
chapter: 13
verses:
  - n: 1
    text:
      la: "Et factus est sermo Dómini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hóminis, vaticináre ad prophétas Israël, qui prophétant, et dices prophetántibus de corde suo: Audíte verbum Dómini."
      en: "Son of man, prophesy thou against the prophets of Israel that prophesy: and thou shalt say to them that prophesy out of their own heart: Hear ye the word of the Lord:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Hæc dicit Dóminus Deus: Væ prophétis insipiéntibus, qui sequúntur spíritum suum, et nihil vident!"
      en: "Thus saith the Lord God: Woe to the foolish prophets that follow their own spirit, and see nothing."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quasi vulpes in desértis prophétæ tui, Israël, erant."
      en: "Thy prophets, O Israel, were like foxes in the deserts."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Non ascendístis ex advérso, neque opposuístis murum pro domo Israël, ut starétis in prǽlio in die Dómini."
      en: "You have not gone up to face the enemy, nor have you set up a wall for the house of Israel, to stand in battle in the day of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Vident vana, et divínant mendácium, dicéntes: Ait Dóminus, cum Dóminus non míserit eos, et perseveravérunt confirmáre sermónem."
      en: "They see vain things, and they foretell lies, saying: The Lord saith: whereas the Lord hath not sent them: and they have persisted to confirm what they have said."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Numquid non visiónem cassam vidístis, et divinatiónem mendácem locúti estis, et dícitis: Ait Dóminus, cum ego non sim locútus?"
      en: "Have you not seen a vain vision and spoken a lying divination: and you say: The Lord saith: whereas I have not spoken."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Proptérea hæc dicit Dóminus Deus: Quia locúti estis vana, et vidístis mendácium, ídeo ecce ego ad vos, dicit Dóminus Deus."
      en: "Therefore thus saith the Lord God: Because you have spoken vain things, and have seen lies: therefore behold I come against you, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et erit manus mea super prophétas, qui vident vana et divínant mendácium: in consílio pópuli mei non erunt, et in scriptúra domus Israël non scribéntur, nec in terram Israël ingrediéntur, et sciétis quia ego Dóminus Deus."
      en: "And my hand shall be upon the prophets that see vain things, and that divine lies: they shall not be in the council of my people, nor shall they be written in the writing of the house of Israel, neither shall they enter into the land of Israel, and you shall know that I am the Lord God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Eo quod decéperint pópulum meum, dicéntes: Pax, et non est pax, et ipse ædificábat paríetem, illi autem liniébant eum luto absque páleis."
      en: "Because they have deceived my people, saying: Peace, and there is no peace: and the people built up a wall, and they daubed it with dirt without straw."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dic ad eos qui líniunt absque temperatúra, quod casúrus sit; erit enim imber inúndans et dabo lápides prægrándes désuper irruéntes et ventum procéllæ dissipántem."
      en: "Say to them that daub without tempering, that it shall fall: for there shall be an overflowing shower, and I will cause great hailstones to fall violently from above, and a stormy wind to throw it down."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Síquidem ecce cécidit páries; numquid non dicétur vobis: Ubi est litúra quam linístis?"
      en: "Behold, when the wall is fallen: shall it not be said to you: Where is the daubing wherewith you have daubed it?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Proptérea hæc dicit Dóminus Deus: Et erúmpere fáciam spíritum tempestátum in indignatióne mea, et imber inúndans in furóre meo erit, et lápides grandes in ira in consumptiónem,"
      en: "Therefore thus saith the Lord God: Lo, I will cause a stormy wind to break forth in my indignation, and there shall be an overflowing shower in my anger: and great hailstones in my wrath to consume."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et déstruam paríetem, quem linístis absque temperaménto."
      en: "And I will break down the wall that you have daubed with untempered mortar."
    status: { la: verified, en: verified }
