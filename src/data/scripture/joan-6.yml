# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 6
verses:
  - n: 1
    text:
      la: "Post haec abiit Jesus trans mare Galilaeae, quod est Tiberiadis:"
      en: "After these things Jesus went over the sea of Galilee, which is that of Tiberias."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et sequebatur eum multitudo magna, quia videbant signa quae faciebat super his qui infirmabantur."
      en: "And a great multitude followed him, because they saw the miracles which he did on them that were diseased."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Subiit ergo in montem Jesus et ibi sedebat cum discipulis suis."
      en: "Jesus therefore went up into a mountain, and there he sat with his disciples."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Erat autem proximum Pascha dies festus Judaeorum."
      en: "Now the pasch, the festival day of the Jews, was near at hand."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cum sublevasset ergo oculos Jesus, et vidisset quia multitudo maxima venit ad eum, dixit ad Philippum: Unde ememus panes, ut manducent hi?"
      en: "When Jesus therefore had lifted up his eyes, and seen that a very great multitude cometh to him, he said to Philip: Whence shall we buy bread, that these may eat?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Hoc autem dicebat tentans eum: ipse enim sciebat quid esset facturus."
      en: "And this he said to try him; for he himself knew what he would do."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Respondit ei Philippus: Ducentorum denariorum panes non sufficiunt eis, ut unusquisque modicum quid accipiat."
      en: "Philip answered him: Two hundred pennyworth of bread is not sufficient for them, that every one may take a little."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dicit ei unus ex discipulis ejus, Andreas, frater Simonis Petri:"
      en: "One of his disciples, Andrew, the brother of Simon Peter, saith to him:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Est puer unus hic qui habet quinque panes hordeaceos et duos pisces: sed haec quid sunt inter tantos?"
      en: "There is a boy here that hath five barley loaves, and two fishes; but what are these among so many?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixit ergo Jesus: Facite homines discumbere. Erat autem foenum multum in loco. Discumberunt ergo viri, numero quasi quinque millia."
      en: "Then Jesus said: Make the men sit down. Now there was much grass in the place. The men therefore sat down, in number about five thousand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Accepit ergo Jesus panes: et cum gratias egisset, distribuit discumbentibus: similiter et ex piscibus quantum volebant."
      en: "And Jesus took the loaves: and when he had given thanks, he distributed to them that were set down. In like manner also of the fishes, as much as they would."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ut autem impleti sunt, dixit discipulis suis: Colligite quae superaverunt fragmenta, ne pereant."
      en: "And when they were filled, he said to his disciples: Gather up the fragments that remain, lest they be lost."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Collegerunt ergo, et impleverunt duodecim cophinos fragmentorum ex quinque panibus hordeaceis, quae superfuerunt his qui manducaverant."
      en: "They gathered up therefore, and filled twelve baskets with the fragments of the five barley loaves, which remained over and above to them that had eaten."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Illi ergo homines cum vidissent quod Jesus fecerat signum, dicebant: Quia hic est vere propheta, qui venturus est in mundum."
      en: "Now those men, when they had seen what a miracle Jesus had done, said: This is of a truth the prophet, that is to come into the world."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Jesus ergo cum cognovisset quia venturi essent ut raperent eum, et facerent eum regem, fugit iterum in montem ipse solus."
      en: "Jesus therefore, when he knew that they would come to take him by force, and make him king, fled again into the mountain himself alone."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ut autem sero factum est, descenderunt discipuli ejus ad mare."
      en: "And when evening was come, his disciples went down to the sea."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et cum ascendissent navim, venerunt trans mare in Capharnaum: et tenebrae jam factae erant et non venerat ad eos Jesus."
      en: "And when they had gone up into a ship, they went over the sea to Capharnaum; and it was now dark, and Jesus was not come unto them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Mare autem, vento magno flante, exsurgebat."
      en: "And the sea arose, by reason of a great wind that blew."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cum remigassent ergo quasi stadia viginti quinque aut triginta, vident Jesum ambulantem supra mare, et proximum navi fieri, et timuerunt."
      en: "When they had rowed therefore about five and twenty or thirty furlongs, they see Jesus walking upon the sea, and drawing nigh to the ship, and they were afraid."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ille autem dicit eis: Ego sum, nolite timere."
      en: "But he saith to them: It is I; be not afraid."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Voluerunt ergo accipere eum in navim et statim navis fuit ad terram, in quam ibant."
      en: "They were willing therefore to take him into the ship; and presently the ship was at the land to which they were going."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Altera die, turba, quae stabat trans mare, vidit quia navicula alia non erat ibi nisi una, et quia non introisset cum discipulis suis Jesus in navim, sed soli discipuli ejus abiissent:"
      en: "The next day, the multitude that stood on the other side of the sea, saw that there was no other ship there but one, and that Jesus had not entered into the ship with his disciples, but that his disciples were gone away alone."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "aliae vero supervenerunt naves a Tiberiade juxta locum ubi manducaverunt panem, gratias agente Domino."
      en: "But other ships came in from Tiberias; nigh unto the place where they had eaten the bread, the Lord giving thanks."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Cum ergo vidisset turba quia Jesus non esset ibi, neque discipuli ejus, ascenderunt in naviculas, et venerunt Capharnaum quaerentes Jesum."
      en: "When therefore the multitude saw that Jesus was not there, nor his disciples, they took shipping, and came to Capharnaum, seeking for Jesus."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et cum invenissent eum trans mare, dixerunt ei: Rabbi, quando huc venisti?"
      en: "And when they had found him on the other side of the sea, they said to him: Rabbi, when camest thou hither?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Respondit eis Jesus, et dixit: Amen, amen dico vobis: quaeritis me non quia vidistis signa, sed quia manducastis ex panibus et saturati estis."
      en: "Jesus answered them, and said: Amen, amen I say to you, you seek me, not because you have seen miracles, but because you did eat of the loaves, and were filled."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Operamini non cibum, qui perit, sed qui permanet in vitam aeternam, quem Filius hominis dabit vobis. Hunc enim Pater signavit Deus."
      en: "Labour not for the meat which perisheth, but for that which endureth unto life everlasting, which the Son of man will give you. For him hath God, the Father, sealed."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Dixerunt ergo ad eum: Quid faciemus ut operemur opera Dei?"
      en: "They said therefore unto him: What shall we do, that we may work the works of God?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Respondit Jesus, et dixit eis: Hoc est opus Dei, ut credatis in eum quem misit ille."
      en: "Jesus answered, and said to them: This is the work of God, that you believe in him whom he hath sent."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Dixerunt ergo ei: Quod ergo tu facis signum ut videamus et credamus tibi? quid operaris?"
      en: "They said therefore to him: What sign therefore dost thou shew, that we may see, and may believe thee? What dost thou work?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Patres nostri manducaverunt manna in deserto, sicut scriptum est: Panem de caelo dedit eis manducare."
      en: "Our fathers did eat manna in the desert, as it is written: He gave them bread from heaven to eat."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Dixit ergo eis Jesus: Amen, amen dico vobis: non Moyses dedit vobis panem de caelo, sed Pater meus dat vobis panem de caelo verum."
      en: "Then Jesus said to them: Amen, amen I say to you; Moses gave you not bread from heaven, but my Father giveth you the true bread from heaven."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Panis enim Dei est, qui de caelo descendit, et dat vitam mundo."
      en: "For the bread of God is that which cometh down from heaven, and giveth life to the world."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Dixerunt ergo ad eum: Domine, semper da nobis panem hunc."
      en: "They said therefore unto him: Lord, give us always this bread."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Dixit autem eis Jesus: Ego sum panis vitae: qui venit ad me, non esuriet, et qui credit in me, non sitiet umquam."
      en: "And Jesus said to them: I am the bread of life: he that cometh to me shall not hunger: and he that believeth in me shall never thirst."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Sed dixi vobis quia et vidistis me, et non creditis."
      en: "But I said unto you, that you also have seen me, and you believe not."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Omne quod dat mihi Pater, ad me veniet: et eum qui venit ad me, non ejiciam foras:"
      en: "All that the Father giveth to me shall come to me; and him that cometh to me, I will not cast out."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "quia descendi de caelo, non ut faciam voluntatem meam, sed voluntatem ejus qui misit me."
      en: "Because I came down from heaven, not to do my own will, but the will of him that sent me."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Haec est autem voluntas ejus qui misit me, Patris: ut omne quod dedit mihi, non perdam ex eo, sed resuscitem illud in novissimo die."
      en: "Now this is the will of the Father who sent me: that of all that he hath given me, I should lose nothing; but should raise it up again in the last day."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Haec est autem voluntas Patris mei, qui misit me: ut omnis qui videt Filium et credit in eum, habeat vitam aeternam, et ego resuscitabo eum in novissimo die."
      en: "And this is the will of my Father that sent me: that every one who seeth the Son, and believeth in him, may have life everlasting, and I will raise him up in the last day."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Murmurabant ergo Judaei de illo, quia dixisset: Ego sum panis vivus, qui de caelo descendi,"
      en: "The Jews therefore murmured at him, because he had said: I am the living bread which came down from heaven."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et dicebant: Nonne hic est Jesus filius Joseph, cujus nos novimus patrem et matrem? quomodo ergo dicit hic: Quia de caelo descendi?"
      en: "And they said: Is not this Jesus, the son of Joseph, whose father and mother we know? How then saith he, I came down from heaven?"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Respondit ergo Jesus, et dixit eis: Nolite murmurare in invicem:"
      en: "Jesus therefore answered, and said to them: Murmur not among yourselves."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "nemo potest venire ad me, nisi Pater, qui misit me, traxerit eum; et ego resuscitabo eum in novissimo die."
      en: "No man can come to me, except the Father, who hath sent me, draw him; and I will raise him up in the last day."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Est scriptum in prophetis: Et erunt omnes docibiles Dei. Omnis qui audivit a Patre, et didicit, venit ad me."
      en: "It is written in the prophets: And they shall all be taught of God. Every one that hath heard of the Father, and hath learned, cometh to me."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Non quia Patrem vidit quisquam, nisi is, qui est a Deo, hic vidit Patrem."
      en: "Not that any man hath seen the Father; but he who is of God, he hath seen the Father."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Amen, amen dico vobis: qui credit in me, habet vitam aeternam."
      en: "Amen, amen I say unto you: He that believeth in me, hath everlasting life."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Ego sum panis vitae."
      en: "I am the bread of life."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Patres vestri manducaverunt manna in deserto, et mortui sunt."
      en: "Your fathers did eat manna in the desert, and are dead."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Hic est panis de caelo descendens: ut si quis ex ipso manducaverit, non moriatur."
      en: "This is the bread which cometh down from heaven; that if any man eat of it, he may not die."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Ego sum panis vivus, qui de caelo descendi."
      en: "I am the living bread which came down from heaven."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Si quis manducaverit ex hoc pane, vivet in aeternum: et panis quem ego dabo, caro mea est pro mundi vita."
      en: "If any man eat of this bread, he shall live for ever; and the bread that I will give, is my flesh, for the life of the world."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Litigabant ergo Judaei ad invicem, dicentes: Quomodo potest hic nobis carnem suam dare ad manducandum?"
      en: "The Jews therefore strove among themselves, saying: How can this man give us his flesh to eat?"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Dixit ergo eis Jesus: Amen, amen dico vobis: nisi manducaveritis carnem Filii hominis, et biberitis ejus sanguinem, non habebitis vitam in vobis."
      en: "Then Jesus said to them: Amen, amen I say unto you: Except you eat the flesh of the Son of man, and drink his blood, you shall not have life in you."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Qui manducat meam carnem, et bibit meum sanguinem, habet vitam aeternam: et ego resuscitabo eum in novissimo die."
      en: "He that eateth my flesh, and drinketh my blood, hath everlasting life: and I will raise him up in the last day."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Caro enim mea vere est cibus: et sanguis meus, vere est potus;"
      en: "For my flesh is meat indeed: and my blood is drink indeed."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "qui manducat meam carnem et bibit meum sanguinem, in me manet, et ego in illo."
      en: "He that eateth my flesh, and drinketh my blood, abideth in me, and I in him."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Sicut misit me vivens Pater, et ego vivo propter Patrem: et qui manducat me, et ipse vivet propter me."
      en: "As the living Father hath sent me, and I live by the Father; so he that eateth me, the same also shall live by me."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Hic est panis qui de caelo descendit. Non sicut manducaverunt patres vestri manna, et mortui sunt. Qui manducat hunc panem, vivet in aeternum."
      en: "This is the bread that came down from heaven. Not as your fathers did eat manna, and are dead. He that eateth this bread, shall live for ever."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Haec dixit in synagoga docens, in Capharnaum."
      en: "These things he said, teaching in the synagogue, in Capharnaum."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Multi ergo audientes ex discipulis ejus, dixerunt: Durus est hic sermo, et quis potest eum audire?"
      en: "Many therefore of his disciples, hearing it, said: This saying is hard, and who can hear it?"
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Sciens autem Jesus apud semetipsum quia murmurarent de hoc discipuli ejus, dixit eis: Hoc vos scandalizat?"
      en: "But Jesus, knowing in himself, that his disciples murmured at this, said to them: Doth this scandalize you?"
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "si ergo videritis Filium hominis ascendentem ubi erat prius?"
      en: "If then you shall see the Son of man ascend up where he was before?"
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Spiritus est qui vivificat: caro non prodest quidquam: verba quae ego locutus sum vobis, spiritus et vita sunt."
      en: "It is the spirit that quickeneth: the flesh profiteth nothing. The words that I have spoken to you, are spirit and life."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "Sed sunt quidam ex vobis qui non credunt. Sciebat enim ab initio Jesus qui essent non credentes, et quis traditurus esset eum."
      en: "But there are some of you that believe not. For Jesus knew from the beginning, who they were that did not believe, and who he was, that would betray him."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "Et dicebat: Propterea dixi vobis, quia nemo potest venire ad me, nisi fuerit ei datum a Patre meo."
      en: "And he said: Therefore did I say to you, that no man can come to me, unless it be given him by my Father."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "Ex hoc multi discipulorum ejus abierunt retro: et jam non cum illo ambulabant."
      en: "After this many of his disciples went back; and walked no more with him."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "Dixit ergo Jesus ad duodecim: Numquid et vos vultis abire?"
      en: "Then Jesus said to the twelve: Will you also go away?"
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "Respondit ergo ei Simon Petrus: Domine, ad quem ibimus? verba vitae aeternae habes:"
      en: "And Simon Peter answered him: Lord, to whom shall we go? thou hast the words of eternal life."
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "et nos credidimus, et cognovimus quia tu es Christus Filius Dei."
      en: "And we have believed and have known, that thou art the Christ, the Son of God."
    status: { la: verified, en: verified }
  - n: 71
    text:
      la: "Respondit eis Jesus: Nonne ego vos duodecim elegi: et ex vobis unus diabolus est?"
      en: "Jesus answered them: Have not I chosen you twelve; and one of you is a devil?"
    status: { la: verified, en: verified }
  - n: 72
    text:
      la: "Dicebat autem Judam Simonis Iscariotem: hic enim erat traditurus eum, cum esset unus ex duodecim."
      en: "Now he meant Judas Iscariot, the son of Simon: for this same was about to betray him, whereas he was one of the twelve."
    status: { la: verified, en: verified }
