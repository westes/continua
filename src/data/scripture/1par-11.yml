# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 11
verses:
  - n: 1
    text:
      la: "Congregatus est igitur omnis Israel ad David in Hebron, dicens: Os tuum sumus, et caro tua."
      en: "Then all Israel gathered themselves to David in Hebron, saying: We are thy bone, and thy flesh."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Heri quoque et nudiustertius cum adhuc regnaret Saul, tu eras qui educebas, et introducebas Israel: tibi enim dixit Dominus Deus tuus: Tu pasces populum meum Israel, et tu eris princeps super eum."
      en: "Yesterday also, and the day before when Saul was king, thou wast he that leddest out and broughtest in Israel: for the Lord thy God said to thee: Thou shalt feed my people Israel, and thou shalt; be ruler over them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Venerunt ergo omnes majores natu Israel ad regem in Hebron, et iniit David cum eis foedus coram Domino: unxeruntque eum regem super Israel, juxta sermonem Domini, quem locutus est in manu Samuel."
      en: "So all the ancients of Israel came to the king to Hebron, and David made a covenant with them before the Lord: and they anointed him king over Israel, according to the word of the Lord which he spoke in the hand of Samuel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Abiit quoque David, et omnis Israel in Jerusalem: haec est Jebus, ubi erant Jebusaei habitatores terrae."
      en: "And David and all Israel went to Jerusalem, which is Jebus, where the Jebusites were the inhabitants of the land."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixeruntque qui habitabant in Jebus ad David: Non ingredieris huc. Porro David cepit arcem Sion, quae est civitas David,"
      en: "And the inhabitants of Jebus said to David: Thou shalt not come in here. But David took the castle of Sion, which is the city of David."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixitque: Omnis qui percusserit Jebusaeum in primis, erit princeps, et dux. Ascendit igitur primus Joab filius Sarviae, et factus est princeps."
      en: "And he said: Whosoever shall first strike the Jebusites, shall be the head and chief captain. And Joab the son of Sarvia went up first, and was made the general."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Habitavit autem David in arce, et idcirco appellata est civitas David."
      en: "And David dwelt in the castle, and therefore it was called the city of David."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Aedificavitque urbem in circuitu a Mello usque ad gyrum, Joab autem reliqua urbis exstruxit."
      en: "And he built the city round about from Mello all round, and Joab built the rest of the city."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Proficiebatque David vadens et crescens, et Dominus exercituum erat cum eo."
      en: "And David went on growing and increasing, and the Lord of hosts was with him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Hi principes virorum fortium David, qui adjuverunt eum ut rex fieret super omnem Israel juxta verbum Domini, quod locutus est ad Israel."
      en: "These are the chief of the valiant men of David, who helped him to be made king over all Israel, according to the word of the Lord, which he spoke to Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et iste numerus robustorum David: Jesbaam filius Hachamoni princeps inter triginta: iste levavit hastam suam super trecentos vulneratos una vice."
      en: "And this is the number of the heroes of David: Jesbaam the son of Hachamoni the chief among the thirty: he lifted up his spear against three hundred wounded by him at one time."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et post eum Eleazar filius patrui ejus Ahohites, qui erat inter tres potentes."
      en: "And after him was Eleazar his uncle's son the Ahohite, who was one of the three mighties."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Iste fuit cum David in Phesdomim, quando Philisthiim congregati sunt ad locum illum in praelium: et erat ager regionis illius plenus hordeo, fugeratque populus a facie Philisthinorum."
      en: "He was with David in Phesdomim, when the Philistines were gathered to that place to battle: and the field of that country was full of barley, and the people fled from before the Philistines."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Hi steterunt in medio agri, et defenderunt eum: cumque percussissent Philisthaeos, dedit Dominus salutem magnam populo suo."
      en: "But these men stood in the midst of the field, and defended it: and they slew the Philistines, and the Lord gave a great deliverance to his people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Descenderunt autem tres de triginta principibus ad petram, in qua erat David, ad speluncam Odollam, quando Philisthiim fuerant castrametati in valle Raphaim."
      en: "And three of the thirty captains went down to the rock, wherein David was, to the cave of Odollam, when the Philistines encamped in the valley of Raphaim."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Porro David erat in praesidio, et statio Philisthinorum in Bethlehem."
      en: "And David was in a hold, and the garrison of the Philistines in Bethlehem."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Desideravit igitur David, et dixit: O si quis daret mihi aquam de cisterna Bethlehem, quae est in porta!"
      en: "And David longed, and said: O that some man would give me water of the cistern of Bethlehem, which is in the gate."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tres ergo isti per media castra Philisthinorum perrexerunt, et hauserunt aquam de cisterna Bethlehem, quae erat in porta, et attulerunt ad David ut biberet. Qui noluit, sed magis libavit illam Domino,"
      en: "And these three broke through the midst of the camp of the Philistines, and drew water out of the cistern of Bethlehem, which was in the gate, and brought it to David to drink: and he would not drink of it, but rather offered it to the Lord,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dicens: Absit ut in conspectu Dei mei hoc faciam, et sanguinem istorum virorum bibam: quia in periculo animarum suarum attulerunt mihi aquam. Et ob hanc causam noluit bibere: haec fecerunt tres robustissimi."
      en: "Saying: God forbid that I should do this in the sight of my God, and should drink the blood of these men: for with the danger of their lives they have brought me the water. And therefore he would not drink. These things did the three most valiant."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Abisai quoque frater Joab ipse erat princeps trium, et ipse levavit hastam suam contra trecentos vulneratos, et ipse erat inter tres nominatissimus,"
      en: "And Abisai the brother of Joab, he was chief of three, and he lifted up his spear against three hundred whom he slew, and he was renowned among the three,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et inter tres secundos inclytus, et princeps eorum: verumtamen usque ad tres primos non pervenerat."
      en: "And illustrious among the second three, and their captain: but yet he attained not to the first three."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Banaias filius Jojadae viri robustissimi, qui multa opera perpetrarat, de Cabseel: ipse percussit duos Ariel Moab: et ipse descendit, et interfecit leonem in media cisterna tempore nivis."
      en: "Banaias the son of Joiada, a most valiant man, of Cabseel, who had done many acts: he slew the two ariels of Moab: and he went down, and killed a lion in the midst of a pit in the time of snow."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ipse percussit virum aegyptium, cujus statura erat quinque cubitorum, et habebat lanceam ut liciatorium texentium: descendit igitur ad eum cum virga, et rapuit hastam, quam tenebat manu, et interfecit eum hasta sua."
      en: "And he slew an Egyptian, whose stature was of five cubits, and who had a spear like a weaver's beam: and he went down to him with a staff, and plucked away the spear, that he held in his hand, and slew him with his own spear."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Haec fecit Banaias filius Jojadae, qui erat inter tres robustos nominatissimus,"
      en: "These things did Banaias the son of Joiada, who was renowned among the three valiant ones,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "inter triginta primus, verumtamen ad tres usque non pervenerat: posuit autem eum David ad auriculam suam."
      en: "And the first among the thirty, but yet to the three he attained not: and David made him of his council."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Porro fortissimi viri in exercitu, Asahel frater Joab, et Elchanan filius patrui ejus de Bethlehem,"
      en: "Moreover the most valiant men of the army, were Asahel brother of Joab, and Elchanan the son of his uncle of Bethlehem,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sammoth Arorites, Helles Pharonites,"
      en: "Sammoth an Arorite, Helles a Phalonite,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ira filius Acces Thecuites, Abiezer Anathothites,"
      en: "Ira the son of Acces a Thecuite, Abiezer an Anathothite,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Sobbochai Husathites, Ilai Ahohites,"
      en: "Sobbochai a Husathite, Ilai an Ahohite,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Maharai Netophathites, Heled filius Baana Netophathites,"
      en: "Maharai a Netophathite, Heled the son of Baana a Netophathite,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ethai filius Ribai de Gabaath filiorum Benjamin, Banaia Pharatonites,"
      en: "Ethai the son of Ribai of Gabaath of the sons of Benjamin, Banal a Pharathonite,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Hurai de torrente Gaas, Abiel Arbathites, Azmoth Bauramites, Eliaba Salabonites."
      en: "Hurai of the torrent Gaas, Abiel an Arbathite, Azmoth a Bauramite, Eliaba a Salabonite,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Filii Assem Gezonites, Jonathan filius Sage Ararites,"
      en: "The sons of Assem a, Gezonite, Jonathan the son of Sage an Ararite,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Ahiam filius Sachar Ararites,"
      en: "Ahiam the son of Sachar an Ararite,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Eliphal filius Ur,"
      en: "Eliphal the son of Ur,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Hepher Mecherathites, Ahia Phelonites,"
      en: "Hepher a Mecherathite, Ahia a Phelonite,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Hesro Carmelites, Naarai filius Asbai,"
      en: "Hesro a Carmelite, Naarai the son of Azbai,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Joel frater Nathan, Mibahar filius Agarai,"
      en: "Joel the brother of Nathan, Mibahar the son of Agarai."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Selec Ammonites, Naharai Berothites armiger Joab filii Sarviae,"
      en: "Selec an Ammonite, Naharai a Berothite, the armourbearer of Joab the son of Sarvia."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Ira Jethraeus, Gareb Jethraeus,"
      en: "Ira a Jethrite, Gareb a Jethrite,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Urias Hethaeus, Zabad filius Oholi,"
      en: "Urias a Hethite, Zabad the son of Oholi,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Adina filius Siza Rubenites princeps Rubenitarum, et cum eo triginta:"
      en: "Adina the son of Siza a Rubenite the prince of the Rubenites, and thirty with him:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Hanan filius Maacha, et Josaphat Mathanites,"
      en: "Hanan the son of Maacha, and Josaphat a Mathanite,"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Ozia Astarothites, Samma, et Jehiel filii Hotham Arorites,"
      en: "Ozia an Astarothite, Samma, and Jehiel the sons of Hotham an Arorite,"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Jedihel filius Samri, et Joha frater ejus Thosaites,"
      en: "Jedihel the son of Zamri, and Jobs his brother a Thosaite,"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Eliel Mahumites, et Jeribai, et Josaia filii Elnaem, et Jethma Moabites, Eliel, et Obed, et Jasiel de Masobia."
      en: "Eliel a Mithumite, and Jeribai, and Josaia the sons of Elnaim, and Jethma a Moabite, Eliel, and Obed, and Jasiel of Masobia."
    status: { la: verified, en: verified }
