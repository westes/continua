# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 3
verses:
  - n: 1
    text:
      la: "Puer autem Samuel ministrabat Domino coram Heli, et sermo Domini erat pretiosus in diebus illis, non erat visio manifesta."
      en: "Now the child Samuel ministered to the Lord before Heli, and the word of the Lord was precious in those days, there was no manifest vision."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Factum est ergo in die quadam, Heli jacebat in loco suo, et oculi ejus caligaverant, nec poterat videre:"
      en: "And it came to pass one day when Heli lay in his place, and his eyes were grown dim, that he could not see:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "lucerna Dei antequam extingueretur, Samuel dormiebat in templo Domini, ubi erat arca Dei."
      en: "Before the lamp of God went out, Samuel slept in the temple of the Lord, where the ark of God was."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et vocavit Dominus Samuel. Qui respondens, ait: Ecce ego."
      en: "And the Lord called Samuel. And he answered: Here am I."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et cucurrit ad Heli, et dixit: Ecce ego: vocasti enim me. Qui dixit: Non vocavi: revertere, et dormi. Et abiit, et dormivit."
      en: "And he ran to Heli and said: Here am I: for thou didst call me. He said: I did not call: go back and sleep. And he went and slept."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et adjecit Dominus rursum vocare Samuelem. Consurgensque Samuel, abiit ad Heli, et dixit: Ecce ego: quia vocasti me. Qui respondit: Non vocavi te, fili mi: revertere et dormi."
      en: "And the Lord called Samuel again. And Samuel arose and went to Heli, and said: Here am I: for thou calledst me. He answered: I did not call thee, my son: return and sleep."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Porro Samuel necdum sciebat Dominum, neque revelatus fuerat ei sermo Domini."
      en: "Now Samuel did not yet know the Lord, neither had the word of the Lord been revealed to him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et adjecit Dominus, et vocavit adhuc Samuelem tertio. Qui consurgens abiit ad Heli,"
      en: "And the Lord called Samuel again the third time. And he arose up and went to Heli."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ait: Ecce ego: quia vocasti me. Intellexit ergo Heli quia Dominus vocaret puerum: et ait ad Samuelem: Vade, et dormi: et si deinceps vocaverit te, dices: Loquere, Domine, quia audit servus tuus. Abiit ergo Samuel, et dormivit in loco suo."
      en: "And said: Here am I: for thou didst call me. Then Heli understood that the Lord called the child, and he said to Samuel: Go, and sleep: and if he shall call thee any more, thou shalt say: Speak, Lord, for thy servant heareth. So Samuel went and slept in his place."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et venit Dominus, et stetit: et vocavit, sicut vocaverat secundo: Samuel, Samuel. Et ait Samuel: Loquere, Domine, quia audit servus tuus."
      en: "And the Lord came and stood: and he called, as he had called the other times: Samuel, Samuel. And Samuel said: Speak, Lord, for thy servant heareth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixit Dominus ad Samuelem: Ecce ego facio verbum in Israel: quod quicumque audierit, tinnient ambae aures ejus."
      en: "And the Lord said to Samuel: Behold I do a thing in Israel: and whosoever shall hear it, both his ears shall tingle."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "In die illa suscitabo adversum Heli omnia quae locutus sum super domum ejus: incipiam, et complebo."
      en: "In that day I will raise up against Heli all the things I have spoken concerning his house: I will begin, and I will make an end."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Praedixi enim ei quod judicaturus essem domum ejus in aeternum, propter iniquitatem, eo quod noverat indigne agere filios suos, et non corripuerit eos."
      en: "For I have foretold unto him, that I will judge his house for ever, for iniquity, because he knew that his sons did wickedly, and did not chastise them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Idcirco juravi domui Heli quod non expietur iniquitas domus ejus victimis et muneribus usque in aeternum."
      en: "Therefore have I sworn to the house of Heli, that the iniquity of his house shall not be expiated with victims nor offerings for ever."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dormivit autem Samuel usque mane, aperuitque ostia domus Domini. Et Samuel timebat indicare visionem Heli."
      en: "And Samuel slept till morning, and opened the doors of the house of the Lord. And Samuel feared to tell the vision to Heli."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vocavit ergo Heli Samuelem, et dixit: Samuel fili mi? Qui respondens ait: Praesto sum."
      en: "Then Heli called Samuel, and said: Samuel, my son. And he answered: Here am I."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et interrogavit eum: Quis est sermo, quem locutus est Dominus ad te? oro te ne celaveris me: haec faciat tibi Deus, et haec addat, si absconderis a me sermonem ex omnibus verbis, quae dicta sunt tibi."
      en: "And he asked him: What is the word that the Lord hath spoken to thee? I beseech thee hide it not from me. May God do so and so to thee, and add so and so, if thou hide from me one word of all that were said to thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Indicavit itaque ei Samuel universos sermones, et non abscondit ab eo. Et ille respondit: Dominus est: quod bonum est in oculis suis faciat."
      en: "So Samuel told him all the words, and did not hide them from him. And he answered: It is the Lord: let him do what is good in his sight."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Crevit autem Samuel, et Dominus erat cum eo, et non cecidit ex omnibus verbis ejus in terram."
      en: "And Samuel grew, and the Lord was with him, and not one of his words fell to the ground."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et cognovit universus Israel, a Dan usque Bersabee, quod fidelis Samuel propheta esset Domini."
      en: "And all Israel from Dan to Bersabee, knew that Samuel was a faithful prophet of the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et addidit Dominus ut appareret in Silo, quoniam revelatus fuerat Dominus Samueli in Silo, juxta verbum Domini. Et evenit sermo Samuelis universo Israeli."
      en: "And the Lord again appeared in Silo, for the Lord revealed himself to Samuel in Silo, according to the word of the Lord. And the word of Samuel came to pass to all Israel."
    status: { la: verified, en: verified }
