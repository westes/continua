# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1reg
chapter: 3
verses:
  - n: 1
    text:
      la: "puer autem Samuhel ministrabat Domino coram Heli et sermo Domini erat pretiosus in diebus illis non erat visio manifesta"
      en: "Now the child Samuel ministered to the Lord before Heli, and the word of the Lord was precious in those days, there was no manifest vision."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "factum est ergo in die quadam Heli iacebat in loco suo et oculi eius caligaverant nec poterat videre"
      en: "And it came to pass one day when Heli lay in his place, and his eyes were grown dim, that he could not see:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "lucerna Dei antequam extingueretur Samuhel autem dormiebat in templo Domini ubi erat arca Dei"
      en: "Before the lamp of God went out, Samuel slept in the temple of the Lord, where the ark of God was."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et vocavit Dominus Samuhel qui respondens ait ecce ego"
      en: "And the Lord called Samuel. And he answered: Here am I."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et cucurrit ad Heli et dixit ecce ego vocasti enim me qui dixit non vocavi revertere dormi et abiit et dormivit"
      en: "And he ran to Heli and said: Here am I: for thou didst call me. He said: I did not call: go back and sleep. And he went and slept."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et adiecit Dominus vocare rursum Samuhel consurgensque Samuhel abiit ad Heli et dixit ecce ego quia vocasti me qui respondit non vocavi te fili mi revertere et dormi"
      en: "And the Lord called Samuel again. And Samuel arose and went to Heli, and said: Here am I: for thou calledst me. He answered: I did not call thee, my son: return and sleep."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "porro Samuhel necdum sciebat Dominum neque revelatus fuerat ei sermo Domini"
      en: "Now Samuel did not yet know the Lord, neither had the word of the Lord been revealed to him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et adiecit Dominus et vocavit adhuc Samuhel tertio qui consurgens abiit ad Heli"
      en: "And the Lord called Samuel again the third time. And he arose up and went to Heli."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ait ecce ego quia vocasti me intellexit igitur Heli quia Dominus vocaret puerum et ait ad Samuhel vade et dormi et si deinceps vocaverit te dices loquere Domine quia audit servus tuus abiit ergo Samuhel et dormivit in loco suo"
      en: "And said: Here am I: for thou didst call me. Then Heli understood that the Lord called the child, and he said to Samuel: Go, and sleep: and if he shall call thee any more, thou shalt say: Speak, Lord, for thy servant heareth. So Samuel went and slept in his place."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et venit Dominus et stetit et vocavit sicut vocaverat secundo Samuhel Samuhel et ait Samuhel loquere quia audit servus tuus"
      en: "And the Lord came and stood: and he called, as he had called the other times: Samuel, Samuel. And Samuel said: Speak, Lord, for thy servant heareth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dixit Dominus ad Samuhel ecce ego facio verbum in Israhel quod quicumque audierit tinnient ambae aures eius"
      en: "And the Lord said to Samuel: Behold I do a thing in Israel: and whosoever shall hear it, both his ears shall tingle."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in die illo suscitabo adversum Heli omnia quae locutus sum super domum eius incipiam et conplebo"
      en: "In that day I will raise up against Heli all the things I have spoken concerning his house: I will begin, and I will make an end."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "praedixi enim ei quod iudicaturus essem domum eius in aeternum propter iniquitatem eo quod noverat indigne agere filios suos et non corripuit eos"
      en: "For I have foretold unto him, that I will judge his house for ever, for iniquity, because he knew that his sons did wickedly, and did not chastise them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "idcirco iuravi domui Heli quod non expietur iniquitas domus eius victimis et muneribus usque in aeternum"
      en: "Therefore have I sworn to the house of Hell, that the iniquity of his house shall not be expiated with victims nor offerings for ever."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dormivit autem Samuhel usque mane aperuitque ostia domus Domini et Samuhel timebat indicare visionem Heli"
      en: "And Samuel slept till morning, and opened the doors of the house of the Lord. And Samuel feared to tell the vision to Hell."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "vocavit ergo Heli Samuhelem et dixit Samuhel fili mi qui respondens ait praesto sum"
      en: "Then Heli called Samuel, and said: Samuel, my son. And he answered: Here am I."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et interrogavit eum quis est sermo quem locutus est ad te oro te ne celaveris me haec faciat tibi Deus et haec addat si absconderis a me sermonem ex omnibus verbis quae dicta sunt tibi"
      en: "And he asked him: What is the word that the Lord hath spoken to thee? I beseech thee hide it not from me. May God do so and so to thee, and add so and so, if thou hide from me one word of all that were said to thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "indicavit itaque ei Samuhel universos sermones et non abscondit ab eo et ille respondit Dominus est quod bonum est in oculis suis faciat"
      en: "So Samuel told him all the words, and did not hide them from him. And he answered: It is the Lord: let him do what is good in his sight."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "crevit autem Samuhel et Dominus erat cum eo et non cecidit ex omnibus verbis eius in terram"
      en: "And Samuel grew, and the Lord was with him, and not one of his words fell to the ground."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et cognovit universus Israhel a Dan usque Bersabee quod fidelis Samuhel propheta esset Domini"
      en: "And all Israel from Dan to Bersabee, knew that Samuel was a faithful prophet of the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et addidit Dominus ut appareret in Silo quoniam revelatus fuerat Dominus Samuheli in Silo iuxta verbum Domini et evenit sermo Samuhelis universo Israheli"
      en: "And the Lord again appeared in Silo, for the Lord revealed himself to Samuel in Silo, according to the word of the Lord. And the word of Samuel came to pass to all Israel."
    status: { la: verified, en: verified }
