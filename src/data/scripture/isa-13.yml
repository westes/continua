# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 13
verses:
  - n: 1
    text:
      la: "Onus Babylonis, quod vidit Isaias, filius Amos."
      en: "The burden of Babylon, which Isaias the son of Amos saw."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Super montem caliginosum levate signum: exaltate vocem, levate manum, et ingrediantur portas duces."
      en: "Upon the dark mountain lift ye up a banner, exalt the voice, lift up the hand, and let the rulers go into the gates."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ego mandavi sanctificatis meis, et vocavi fortes meos in ira mea, exsultantes in gloria mea."
      en: "I have commanded my sanctified ones, and have called my strong ones in my wrath, them that rejoice in my glory."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vox multitudinis in montibus, quasi populorum frequentium; vox sonitus regum, gentium congregatarum. Dominus exercituum praecepit militiae belli,"
      en: "The noise of a multitude in the mountains, as it were of many people, the noise of the sound of kings, of nations gathered together: the Lord of hosts hath given charge to the troops of war."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "venientibus de terra procul, a summitate caeli; Dominus, et vasa furoris ejus, ut disperdat omnem terram."
      en: "To them that come from a country afar off, from the end of heaven: the Lord and the instruments of his wrath, to destroy the whole land."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ululate, quia prope est dies Domini; quasi vastitas a Domino veniet."
      en: "Howl ye, for the day of the Lord is near: it shall come as a destruction from the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Propter hoc omnes manus dissolventur, et omne cor hominis contabescet,"
      en: "Therefore shall all hands be faint, and every heart of man shall melt,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et conteretur. Torsiones et dolores tenebunt; quasi parturiens dolebunt: unusquisque ad proximum suum stupebit, facies combustae vultus eorum."
      en: "And shall be broken. Gripings and pains shall take hold of them, they shall be in pain as a woman in labour. Every one shall be amazed at his neighbour, their countenances shall be as faces burnt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ecce dies Domini veniet, crudelis, et indignationis plenus, et irae, furorisque, ad ponendam terram in solitudinem, et peccatores ejus conterendos de ea."
      en: "Behold, the day of the Lord shall come, a cruel day, and full of indignation, and of wrath, and fury, to lay the land desolate, and to destroy the sinners thereof out of it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quoniam stellae caeli, et splendor earum, non expandent lumen suum; obtenebratus est sol in ortu suo, et luna non splendebit in lumine suo."
      en: "For the stars of heaven, and their brightness shall not display their light: the sun shall be darkened in his rising, and the moon shall not shine with her light."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et visitabo super orbis mala, et contra impios iniquitatem eorum; et quiscere faciam superbiam infidelium, et arrogantiam fortium humiliabo."
      en: "And I will visit the evils of the world, and against the wicked for their iniquity: and I will make the pride of infidels to cease, and will bring down the arrogancy of the mighty."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Pretiosior erit vir auro, et homo mundo obrizo."
      en: "A man shall be more precious than gold, yea a man than the finest of gold."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Super hoc caelum turbabo; et movebitur terra de loco suo, propter indignationem Domini exercituum, et propter diem irae furoris ejus."
      en: "For this I will trouble the heaven: and the earth shall be moved out of her place, for the indignation of the Lord of hosts, and for the day of his fierce wrath."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et erit quasi damula fugiens, et quasi ovis, et non erit qui congreget. Unusquisque ad populum suum convertetur, et singuli ad terram suam fugient."
      en: "And they shall be as a doe fleeing away, and as a sheep: and there shall be none to gather them together: every man shall turn to his own people, and every one shall flee to his own land."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Omnis qui inventus fuerit occidetur, et omnis qui supervenerit cadet in gladio;"
      en: "Every one that shall be found, shall be slain: and every one that shall come to their aid, shall fall by the sword."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "infantes eorum allidentur in oculis eorum, diripientur domus eorum, et uxores eorum violabuntur."
      en: "Their infants shall be dashed in pieces before their eyes: their houses shall be pillaged, and their wives shall be ravished."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ecce ego suscitabo super eos Medos, qui argentum non quaerant, nec aurum velint;"
      en: "Behold I will stir up the Medes against them, who shall not seek silver, nor desire gold:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed sagittis parvulos interficient, et lactantibus uteris non miserebuntur, et super filios non parcet oculus eorum."
      en: "But with their arrows they shall kill the children, and shall have no pity upon the sucklings of the womb, and their eye shall not spare their sons."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et erit Babylon illa gloriosa in regnis, inclyta superbia Chaldaeorum, sicut subvertit Dominus Sodomam et Gomorrham."
      en: "And that Babylon, glorious among kingdoms, the famous pride of the Chaldeans, shall be even as the Lord destroyed Sodom and Gomorrha."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Non habitabitur usque in finem, et non fundabitur usque ad generationem et generationem; nec ponet tibi tentoria Arabs, nec pastores requiescent ibi."
      en: "It shall no more be inhabited for ever, and it shall not be founded unto generation and generation: neither shall the Arabian pitch his tents there, nor shall shepherds rest there."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Sed requiescent ibi bestiae, et replebuntur domus eorum draconibus, et habitabunt ibi struthiones, et pilosi saltabunt ibi;"
      en: "But wild beasts shall rest there, and their houses shall be filled with serpents, and ostriches shall dwell there, and the hairy ones shall dance there:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et respondebunt ibi ululae in aedibus ejus, et sirenes in delubris voluptatis."
      en: "And owls shall answer one another there, in the houses thereof, and sirens in the temples of pleasure."
    status: { la: verified, en: verified }
