# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 2
verses:
  - n: 1
    text:
      la: "Ascenditque angelus Domini de Galgalis ad Locum flentium, et ait: Eduxi vos de Aegypto, et introduxi in terram, pro qua juravi patribus vestris: et pollicitus sum ut non facerem irritum pactum meum vobiscum in sempiternum:"
      en: "And an angel of the Lord went up from Galgal to the place of weepers, and said: I made you go out of Egypt, and have brought you into the land for which I swore to your fathers: and I promised that I would not make void my covenant with you for ever:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ita dumtaxat ut non feriretis foedus cum habitatoribus terrae hujus, sed aras eorum subverteretis: et noluistis audire vocem meam: cur hoc fecistis?"
      en: "On condition that you should not make a league with the inhabitants of this land, but should throw down their altars: and you would not hear my voice: why have you done this?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quam ob rem nolui delere eos a facie vestra: ut habeatis hostes, et dii eorum sint vobis in ruinam."
      en: "Wherefore I would not destroy them from before your face: that you may have enemies, and their gods may be your ruin."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cumque loqueretur angelus Domini haec verba ad omnes filios Israel, elevaverunt ipsi vocem suam, et fleverunt."
      en: "And when the angel of the Lord spoke these words to all the children of Israel, they lifted up their voice, and wept."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et vocatum est nomen loci illius, Locus flentium, sive lacrimarum: immolaveruntque ibi hostias Domini."
      en: "And the name of that place was called, The place of weepers, or of tears: and there they offered sacrifices to the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dimisit ergo Josue populum, et abierunt filii Israel unusquisque in possessionem suam, ut obtinerent eam:"
      en: "And Josue sent away the people, and the children of Israel went every one to his own possession to hold it:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "servieruntque Domino cunctis diebus ejus, et seniorum, qui longo post eum vixerunt tempore, et noverant omnia opera Domini quae fecerat cum Israel."
      en: "And they served the Lord all his days, and the days of the ancients, that lived a long time after him, and who knew all the works of the Lord, which he had done for Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Mortuus est autem Josue filius Nun, famulus Domini, centum et decem annorum,"
      en: "And Josue the son of Nun, the servant of the Lord, died, being a hundred and ten years old,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et sepelierunt eum in finibus possessionis suae in Thamnathsare in monte Ephraim, a septentrionali plaga montis Gaas."
      en: "And they buried him in the borders of his possession in Thamnathsare in mount Ephraim, on the north side of mount Gaas."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Omnisque illa generatio congregata est ad patres suos: et surrexerunt alii, qui non noverant Dominum, et opera quae fecerat cum Israel."
      en: "And all that generation was gathered to their fathers: and there arose others that knew not the Lord, and the works which he had done for Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Feceruntque filii Israel malum in conspectu Domini, et servierunt Baalim."
      en: "And the children of Israel did evil in the sight of the Lord, and they served Baalim."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ac dimiserunt Dominum Deum patrum suorum, qui eduxerat eos de terra Aegypti: et secuti sunt deos alienos, deosque populorum, qui habitabant in circuitu eorum, et adoraverunt eos: et ad iracundiam concitaverunt Dominum,"
      en: "And they left the Lord the God of their fathers, who had brought them out of the land of Egypt: and they followed strange gods, and the gods of the people that dwelt round about them, and they adored them: and they provoked the Lord to anger."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dimittentes eum, et servientes Baal et Astaroth."
      en: "Forsaking him, and serving Baal and Astaroth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Iratusque Dominus contra Israel, tradidit eos in manus diripientium: qui ceperunt eos, et vendiderunt hostibus, qui habitabant per gyrum: nec potuerunt resistere adversariis suis,"
      en: "And the Lord being angry against Israel, delivered them into the hands of plunderers: who took them and sold them to their enemies, that dwelt round about: neither could they stand against their enemies:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sed quocumque pergere voluissent, manus Domini super eos erat, sicut locutus est, et juravit eis, et vehementer afflicti sunt."
      en: "But whithersoever they meant to go, the hand of the Lord was upon them, as he had said, and as he had sworn to them: and they were greatly distressed."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Suscitavitque Dominus judices, qui liberarent eos de vastantium manibus: sed nec eos audire voluerunt,"
      en: "And the Lord raised up judges, to deliver them from the hands of those that oppressed them: but they would not hearken to them,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "fornicantes cum diis alienis, et adorantes eos. Cito deseruerunt viam, per quam ingressi fuerant patres eorum: et audientes mandata Domini, omnia fecere contraria."
      en: "Committing fornication with strange gods, and adoring them. They quickly forsook the way, in which their fathers had walked: and hearing the commandments of the Lord, they did all things contrary."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cumque Dominus judices suscitaret, in diebus eorum flectebatur misericordia, et audiebat afflictorum gemitus, et liberabat eos de caede vastantium."
      en: "And when the Lord raised them up judges, in their days he was moved to mercy, and heard the groanings of the afflicted, and delivered them from the slaughter of the oppressors."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Postquam autem mortuus esset judex, revertebantur, et multo faciebant pejora quam fecerant patres eorum, sequentes deos alienos, servientes eis, et adorantes illos. Non dimiserunt adinventiones suas, et viam durissimam, per quam ambulare consueverunt."
      en: "But after the judge was dead, they returned, and did much worse things than their fathers had done, following strange gods, serving them and adoring them. They left not their own inventions, and the stubborn way, by which they were accustomed to walk."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Iratusque est furor Domini in Israel, et ait: Quia irritum fecit gens ista pactum meum, quod pepigeram cum patribus eorum, et vocem meam audire contempsit:"
      en: "And the wrath of the Lord was kindled against Israel, and he said: Behold this nation hath made void my covenant, which I had made with their fathers, and hath despised to hearken to my voice:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et ego non delebo gentes, quas dimisit Josue, et mortuus est:"
      en: "I also will not destroy the nations which Josue left, when he died:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ut in ipsis experiar Israel, utrum custodiant viam Domini, et ambulent in ea, sicut custodierunt patres eorum, an non."
      en: "That through them I may try Israel, whether they will keep the way of the Lord, and walk in it, as their fathers kept it, or not."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dimisit ergo Dominus omnes nationes has, et cito subvertere noluit, nec tradidit in manus Josue."
      en: "The Lord therefore left all these nations, and would not quickly destroy them, neither did he deliver them into the hands of Josue."
    status: { la: verified, en: verified }
