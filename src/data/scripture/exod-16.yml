# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 16
verses:
  - n: 1
    text:
      la: "Profectique sunt de Elim, et venit omnis multitudo filiorum Israel in desertum Sin, quod est inter Elim et Sinai, quintodecimo die mensis secundi, postquam egressi sunt de terra Aegypti."
      en: "And they set forward from Elim, and all the multitude of the children of Israel came into the desert of Sin, which is between Elim and Sinai: the fifteenth day of the second month, after they came out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et murmuravit omnis congregatio filiorum Israel contra Moysen et Aaron in solitudine."
      en: "And all the congregation of the children of Israel murmured against Moses and Aaron in the wilderness."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixeruntque filii Israel ad eos: Utinam mortui essemus per manum Domini in terra Aegypti, quando sedebamus super ollas carnium, et comedebamus panem in saturitate: cur eduxistis nos in desertum istud, ut occideretis omnem multitudinem fame?"
      en: "And the children of Israel said to them: Would to God we had died by the hand of the Lord in the land of Egypt, when we sat over the flesh pots, and ate bread to the full. Why have you brought us into this desert, that you might destroy all the multitude with famine?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixit autem Dominus ad Moysen: Ecce ego pluam vobis panes de caelo: egrediatur populus, et colligat quae sufficiunt per singulos dies: ut tentem eum utrum ambulet in lege mea, an non."
      en: "And the Lord said to Moses: Behold I will rain bread from heaven for you: let the people go forth, and gather what is sufficient for every day: that I may prove them whether they will walk in my law, or not."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Die autem sexto parent quod inferant: et sit duplum quam colligere solebant per singulos dies."
      en: "But the sixth day let them provide for to bring in: and let it be double to that they were wont to gather every day."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixeruntque Moyses et Aaron ad omnes filios Israel: Vespere scietis quod Dominus eduxerit vos de terra Aegypti,"
      en: "And Moses and Aaron said to the children of Israel: In the evening you shall know that the Lord hath brought you forth out of the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et mane videbitis gloriam Domini: audivit enim murmur vestrum contra Dominum: nos vero quid sumus, quia mussitastis contra nos?"
      en: "And in the morning you shall see the glory of the Lord: for he hath heard your murmuring against the Lord: but as for us, what are we, that you mutter against us?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ait Moyses: Dabit vobis Dominus vespere carnes edere, et mane panes in saturitate: eo quod audierit murmurationes vestras quibus murmurati estis contra eum: nos enim quid sumus? nec contra nos est murmur vestrum, sed contra Dominum."
      en: "And Moses said: In the evening the Lord will give you flesh to eat, and in the morning bread to the full: for he hath heard your murmurings, with which you have murmured against him, for what are we? your murmuring is not against us, but against the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixit quoque Moyses ad Aaron: Dic universae congregationi filiorum Israel: Accedite coram Domino: audivit enim murmur vestrum."
      en: "Moses also said to Aaron: Say to the whole congregation of the children of Israel: Come before the Lord: for he hath heard your murmuring."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cumque loqueretur Aaron ad omnem coetum filiorum Israel, respexerunt ad solitudinem: et ecce gloria Domini apparuit in nube."
      en: "And when Aaron spoke to all the assembly of the children of Israel, they looked towards the wilderness: and behold the glory of the Lord appeared in a cloud."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Locutus est autem Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Audivi murmurationes filiorum Israel. Loquere ad eos: Vespere comedetis carnes, et mane saturabimini panibus: scietisque quod ego sum Dominus Deus vester."
      en: "I have heard the murmuring of the children of Israel: say to them: In the evening you shall eat flesh, and in the morning you shall have your fill of bread: and you shall know that I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Factum est ergo vespere, et ascendens coturnix, cooperuit castra: mane quoque ros jacuit per circuitum castrorum."
      en: "So it came to pass in the evening, that quails coming up, covered the camp: and in the morning, a dew lay round about the camp."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cumque operuisset superficiem terrae, apparuit in solitudine minutum, et quasi pilo tusum in similitudinem pruinae super terram."
      en: "And when it had covered the face of the earth, it appeared in the wilderness small, and as it were beaten with a pestle, like unto the hoar frost on the ground."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quod cum vidissent filii Israel, dixerunt ad invicem: Manhu? quod significat: Quid est hoc? ignorabant enim quid esset. Quibus ait Moyses: Iste est panis quem Dominus dedit vobis ad vescendum."
      en: "And when the children of Israel saw it, they said one to another: Manhu! which signifieth: What is this! for they knew not what it was. And Moses said to them: This is the bread, which the Lord hath given you to eat."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Hic est sermo, quem praecepit Dominus: Colligat unusquisque ex eo quantum sufficit ad vescendum: gomor per singula capita, juxta numerum animarum vestrarum quae habitant in tabernaculo sic tolletis."
      en: "This is the word, that the Lord hath commanded: Let every one gather of it as much as is enough to eat: a gomor for every man, according to the number of your souls that dwell in a tent, so shall you take of it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Feceruntque ita filii Israel: et collegerunt, alius plus, alius minus."
      en: "And the children of Israel did so: and they gathered, one more, another less."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et mensi sunt ad mensuram gomor: nec qui plus collegerat, habuit amplius: nec qui minus paraverat, reperit minus: sed singuli juxta id quod edere poterant, congregaverunt."
      en: "And they measured by the measure of a gomor: neither had he more that had gathered more: nor did he find less that had provided less: but every one had gathered, according to what they were able to eat."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dixitque Moyses ad eos: Nullus relinquat ex eo in mane."
      en: "And Moses said to them: Let no man leave thereof till the morning."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Qui non audierunt eum, sed dimiserunt quidam ex eis usque mane, et scatere coepit vermibus, atque computruit: et iratus est contra eos Moyses."
      en: "And they hearkened not to him, but some of them left until the morning, and it began to be full of worms, and it putrified, and Moses was angry with them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Colligebant autem mane singuli, quantum sufficere poterat ad vescendum: cumque incaluisset sol, liquefiebat."
      en: "Now every one of them gathered in the morning, as much as might suffice to eat: and after the sun grew hot, it melted."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "In die autem sexta collegerunt cibos duplices, id est, duo gomor per singulos homines: venerunt autem omnes principes multitudinis, et narraverunt Moysi."
      en: "But on the sixth day they gathered twice as much, that is, two gomors every man: and all the rulers of the multitude came, and told Moses."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui ait eis: Hoc est quod locutus est Dominus: Requies sabbati sanctificata est Domino cras: quodcumque operandum est, facite, et quae coquenda sunt coquite: quidquid autem reliquum fuerit, reponite usque in mane."
      en: "And he said to them: This is what the Lord hath spoken: Tomorrow is the rest of the sabbath sanctified to the Lord. Whatsoever work is to be done, do it: and the meats that are to be dressed, dress them: and whatsoever shall remain, lay it up until the morning."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Feceruntque ita ut praeceperat Moyses, et non computruit, neque vermis inventus est in eo."
      en: "And they did so as Moses had commanded, and it did not putrify, neither was there worm found in it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dixitque Moyses: Comedite illud hodie, quia sabbatum est Domini: non invenietur hodie in agro."
      en: "And Moses said: Eat it today, because it is the sabbath of the Lord: today it shall not be found in the field."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sex diebus colligite: in die autem septimo sabbatum est Domini, idcirco non invenietur."
      en: "Gather it six days: but on the seventh day is the sabbath of the Lord, therefore it shall not be found."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Venitque septima dies: et egressi de populo ut colligerent, non invenerunt."
      en: "And the seventh day came: and some of the people going forth to gather, found none."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Dixit autem Dominus ad Moysen: Usquequo non vultis custodire mandata mea et legem meam?"
      en: "And the Lord said to Moses: How long will you refuse to keep my commandments, and my law?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "videte quod Dominus dederit vobis sabbatum, et propter hoc die sexta tribuit vobis cibos duplices: maneat unusquisque apud semetipsum; nullus egrediatur de loco suo die septimo."
      en: "See that the Lord hath given you the sabbath, and for this reason on the sixth day he giveth you a double provision: let each man stay at home, and let none go forth out of his place the seventh day."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et sabbatizavit populus die septimo."
      en: "And the people kept the sabbath on the seventh day."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Appellavitque domus Israel nomen ejus Man: quod erat quasi semen coriandri album, gustusque ejus quasi similae cum melle."
      en: "And the house of Israel called the name thereof Manna: and it was like coriander seed white, and the taste thereof like to flour with honey."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Dixit autem Moyses: Iste est sermo, quem praecepit Dominus: Imple gomor ex eo, et custodiatur in futuras retro generationes: ut noverint panem, quo alui vos in solitudine, quando educti estis de terra Aegypti."
      en: "And Moses said: This is the word, which the Lord hath commanded: Fill a gomor of it, and let it be kept unto generations to come hereafter, that they may know the bread, wherewith I fed you in the wilderness, when you were brought forth out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dixitque Moyses ad Aaron: Sume vas unum, et mitte ibi man, quantum potest capere gomor, et repone coram Domino ad servandum in generationes vestras,"
      en: "And Moses said to Aaron: Take a vessel, and put manna into it, as much as a gomor can hold: and lay it up before the Lord to keep unto your generations,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "sicut praecepit Dominus Moysi. Posuitque illud Aaron in tabernaculo reservandum."
      en: "As the Lord commanded Moses. And Aaron put it in the tabernacle to be kept."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Filii autem Israel comederunt man quadraginta annis, donec venirent in terram habitabilem: hoc cibo aliti sunt, usquequo tangerent fines terrae Chanaan."
      en: "And the children of Israel ate manna forty years, till they came to a habitable land: with this meat were they fed, until they reached the borders of the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Gomor autem decima pars est ephi."
      en: "Now a gomor is the tenth part of an ephi."
    status: { la: verified, en: verified }
