# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 16
verses:
  - n: 1
    text:
      la: "profectique sunt de Helim et venit omnis multitudo filiorum Israhel in desertum Sin quod est inter Helim et Sinai quintodecimo die mensis secundi postquam egressi sunt de terra Aegypti"
      en: "And they set forward from Elim, and all the multitude of the children of Israel came into the desert of Sin, which is between Elim and Sinai: the fifteenth day of the second month, after they came out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et murmuravit omnis congregatio filiorum Israhel contra Mosen et contra Aaron in solitudine"
      en: "And all the congregation of the children of Israel murmured against Moses and Aaron in the wilderness."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixeruntque ad eos filii Israhel utinam mortui essemus per manum Domini in terra Aegypti quando sedebamus super ollas carnium et comedebamus panes in saturitate cur eduxistis nos in desertum istud ut occideretis omnem multitudinem fame"
      en: "And the children of Israel said to them: Would to God we had died by the hand of the Lord in the land of Egypt, when we sat over the flesh pots, and ate bread to the full. Why have you brought us into this desert, that you might destroy all the multitude with famine?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixit autem Dominus ad Mosen ecce ego pluam vobis panes de caelo egrediatur populus et colligat quae sufficiunt per singulos dies ut temptem eum utrum ambulet in lege mea an non"
      en: "And the Lord said to Moses: Behold I will rain bread from heaven for you: let the people go forth, and gather what is sufficient for every day: that I may prove them whether they will walk in my law, or not."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "die autem sexta parent quod inferant et sit duplum quam colligere solebant per singulos dies"
      en: "But the sixth day let them provide for to bring in: and let it be double to that they were wont to gather every day."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixeruntque Moses et Aaron ad omnes filios Israhel vespere scietis quod Dominus eduxerit vos de terra Aegypti"
      en: "And Moses and Aaron said to the children of Israel: In the evening you shall know that the Lord hath brought you forth out of the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et mane videbitis gloriam Domini audivit enim murmur vestrum contra Dominum nos vero quid sumus quia mussitatis contra nos"
      en: "And in the morning you shall see the glory of the Lord: for he hath heard your murmuring against the Lord: but as for us, what are we, that you mutter against us?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ait Moses dabit Dominus vobis vespere carnes edere et mane panes in saturitate eo quod audierit murmurationes vestras quibus murmurati estis contra eum nos enim quid sumus nec contra nos est murmur vestrum sed contra Dominum"
      en: "And Moses said: In the evening the Lord will give you flesh to eat, and in the morning bread to the full: for he hath heard your murmurings, with which you have murmured against him, for what are we? your murmuring is not against us, but against the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixitque Moses ad Aaron dic universae congregationi filiorum Israhel accedite coram Domino audivit enim murmur vestrum"
      en: "Moses also said to Aaron: Say to the whole congregation of the children of Israel: Come before the Lord: for he hath heard your murmuring."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque loqueretur Aaron ad omnem coetum filiorum Israhel respexerunt ad solitudinem et ecce gloria Domini apparuit in nube"
      en: "And when Aaron spoke to all the assembly of the children of Israel, they looked towards the wilderness: and behold the glory of the Lord appeared in a cloud."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "locutus est autem Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "audivi murmurationes filiorum Israhel loquere ad eos vespere comedetis carnes et mane saturabimini panibus scietisque quod sim Dominus Deus vester"
      en: "I have heard the murmuring of the children of Israel: say to them: In the evening you shall eat flesh, and in the morning you shall have your fill of bread: and you shall know that I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "factum est ergo vespere et ascendens coturnix operuit castra mane quoque ros iacuit per circuitum castrorum"
      en: "So it came to pass in the evening, that quails coming up, covered the camp: and in the morning, a dew lay round about the camp."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cumque operuisset superficiem terrae apparuit in solitudine minutum et quasi pilo tunsum in similitudinem pruinae super terram"
      en: "And when it had covered the face of the earth, it appeared in the wilderness small, and as it were beaten with a pestle, like unto the hoar frost on the ground."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quod cum vidissent filii Israhel dixerunt ad invicem man hu quod significat quid est hoc ignorabant enim quid esset quibus ait Moses iste est panis quem dedit Dominus vobis ad vescendum"
      en: "And when the children of Israel saw it, they said one to another: Manhu! which signifieth: What is this! for they knew not what it was. And Moses said to them: This is the bread, which the Lord hath given you to eat."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hic est sermo quem praecepit Dominus colligat ex eo unusquisque quantum sufficiat ad vescendum gomor per singula capita iuxta numerum animarum vestrarum quae habitant in tabernaculo sic tolletis"
      en: "This is the word, that the Lord hath commanded: Let every one gather of it as much as is enough to eat: a gomor for every man, according to the number of your souls that dwell in a tent, so shall you take of it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "feceruntque ita filii Israhel et collegerunt alius plus alius minus"
      en: "And the children of Israel did so: and they gathered, one more, another less."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et mensi sunt ad mensuram gomor nec qui plus collegerat habuit amplius nec qui minus paraverat repperit minus sed singuli iuxta id quod edere poterant congregarunt"
      en: "And they measured by the measure of a gomor: neither had he more that had gathered more: nor did he find less that had provided less: but every one had gathered, according to what they were able to eat."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dixitque Moses ad eos nullus relinquat ex eo in mane"
      en: "And Moses said to them: Let no man leave thereof till the morning."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui non audierunt eum sed dimiserunt quidam ex eis usque mane et scatere coepit vermibus atque conputruit et iratus est contra eos Moses"
      en: "And they hearkened not to him, but some of them left until the morning, and it began to be full of worms, an it putrefied, and Moses was angry with them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "colligebant autem mane singuli quantum sufficere poterat ad vescendum cumque incaluisset sol liquefiebat"
      en: "Now every one of them gathered in the morning, as much as might suffice to eat: and after the sun grew hot, it melted."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "in die vero sexta collegerunt cibos duplices id est duo gomor per singulos homines venerunt autem omnes principes multitudinis et narraverunt Mosi"
      en: "But on the sixth day they gathered twice as much, that is, two gomors every man: and all the rulers of the multitude came, and told Moses."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "qui ait eis hoc est quod locutus est Dominus requies sabbati sanctificata erit Domino cras quodcumque operandum est facite et quae coquenda sunt coquite quicquid autem reliquum fuerit reponite usque in mane"
      en: "And he said to them: This is what the Lord hath spoken: To morrow is the rest of the sabbath sanctified to the Lord. Whatsoever work is to be done, do it: and the meats that are to be dressed, dress them: and whatsoever shall remain, lay it up until the morning."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "feceruntque ita ut praeceperat Moses et non conputruit neque vermis inventus est in eo"
      en: "And they did so as Moses had commanded, and it did not putrefy, neither was there worm found in it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixitque Moses comedite illud hodie quia sabbatum est Domino non invenietur hodie in agro"
      en: "And Moses said: Eat it to day, because it is the sabbath of the Lord: to day it shall not be found in the field."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "sex diebus colligite in die autem septimo sabbatum est Domino idcirco non invenietur"
      en: "Gather it six days: but on the seventh day is the sabbath of the Lord, therefore it shall not be found."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "venit septima dies et egressi de populo ut colligerent non invenerunt"
      en: "And the seventh day came: and some of the people going forth to gather, found none."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dixit autem Dominus ad Mosen usquequo non vultis custodire mandata mea et legem meam"
      en: "And the Lord said to Moses: How long will you refuse to keep my commandments, and my law?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "videte quod Dominus dederit vobis sabbatum et propter hoc tribuerit vobis die sexto cibos duplices maneat unusquisque apud semet ipsum nullus egrediatur de loco suo die septimo"
      en: "See that the Lord hath given you the sabbath, and for this reason on the sixth day he giveth you a double provision: let each man stay at home, and let none go forth out of his place the seventh day."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et sabbatizavit populus die septimo"
      en: "And the people kept the sabbath on the seventh day."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "appellavitque domus Israhel nomen eius man quod erat quasi semen coriandri album gustusque eius quasi similae cum melle"
      en: "And the house of Israel called the name thereof Manna: and it was like coriander seed white, and the taste thereof like to flour with honey."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "dixit autem Moses iste est sermo quem praecepit Dominus imple gomor ex eo et custodiatur in futuras retro generationes ut noverint panem quo alui vos in solitudine quando educti estis de terra Aegypti"
      en: "And Moses said: This is the word, which the Lord hath commanded: Fill a gomor of it, and let it be kept unto generations to come hereafter, that they may know the bread, wherewith I fed you in the wilderness, when you were brought forth out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "dixitque Moses ad Aaron sume vas unum et mitte ibi man quantum potest capere gomor et repone coram Domino ad servandum in generationes vestras"
      en: "And Moses said to Aaron: Take a vessel, and put manna into it, as much as a gomor can hold: and lay it up before the Lord to keep unto your generations,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "sicut praecepit Dominus Mosi posuitque illud Aaron in tabernaculo reservandum"
      en: "As the Lord commanded Moses. And Aaron put it in the tabernacle to be kept."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "filii autem Israhel comederunt man quadraginta annis donec venirent in terram habitabilem hoc cibo aliti sunt usquequo tangerent fines terrae Chanaan"
      en: "And the children of Israel ate manna forty years, till they came to a habitable land: with this meat were they fed, until they reached the borders of the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "gomor autem decima pars est oephi"
      en: "Now a gomor is the tenth part of an ephi."
    status: { la: verified, en: verified }
