# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1reg
chapter: 18
verses:
  - n: 1
    text:
      la: "et factum est cum conplesset loqui ad Saul anima Ionathan conligata est animae David et dilexit eum Ionathan quasi animam suam"
      en: "And it came to pass, when he had made an end of speaking to Saul, the soul of Jonathan was knit with the soul of David, and Jonathan loved him as his own soul."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tulitque eum Saul in die illa et non concessit ei ut reverteretur in domum patris sui"
      en: "And Saul took him that day, and would not let him return to his father's house."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "inierunt autem Ionathan et David foedus diligebat enim eum quasi animam suam"
      en: "And David and Jonathan made a covenant, for be loved him as his own soul."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nam expoliavit se Ionathan tunicam qua erat vestitus et dedit eam David et reliqua vestimenta sua usque ad gladium et arcum suum et usque ad balteum"
      en: "And Jonathan stripped himself of the coat with which he was clothed, and gave it to David, and the rest of his garments, even to his sword, and to his bow, and to his girdle."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "egrediebatur quoque David ad omnia quaecumque misisset eum Saul et prudenter se agebat posuitque eum Saul super viros belli et acceptus erat in oculis universi populi maximeque in conspectu famulorum Saul"
      en: "And David went out to whatsoever business Saul sent him, and he behaved himself prudently: and Saul set him over the soldiers, and he was acceptable in the eyes of all the people, and especially in the eyes of Saul's servants."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "porro cum reverteretur percusso Philistheo David egressae sunt mulieres de universis urbibus Israhel cantantes chorosque ducentes in occursum Saul regis in tympanis laetitiae et in sistris"
      en: "Now when David returned, after be slew the Philistine, the women came out of all the cities of Israel, singing and dancing, to meet king Saul, with timbrels of joy, and cornets."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et praecinebant mulieres ludentes atque dicentes percussit Saul mille et David decem milia"
      en: "And the women sung as they played, and they said: I Saul slew his thousands, and David his ten thousands."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "iratus est autem Saul nimis et displicuit in oculis eius iste sermo dixitque dederunt David decem milia et mihi dederunt mille quid ei superest nisi solum regnum"
      en: "And Saul was exceeding angry, and this word was displeasing in his eyes, and he said: They have given David ten thousands, and to me they have given but a thousand; what can he have more but the kingdom?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "non rectis ergo oculis Saul aspiciebat David ex die illa et deinceps"
      en: "And Saul did not look on David with a good eye from that day and forward."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "post diem autem alteram invasit spiritus Dei malus Saul et prophetabat in medio domus suae David autem psallebat manu sua sicut per singulos dies tenebatque Saul lanceam"
      en: "And the day after the evil spirit from God came upon Saul, and he prophesied in the midst of his house. And David played with his hand as at other times. And Saul held a spear in his hand,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et misit eam putans quod configere posset David cum pariete et declinavit David a facie eius secundo"
      en: "And threw it, thinking to nail David to the wall: and David stept aside out of his presence twice."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et timuit Saul David eo quod esset Dominus cum eo et a se recessisset"
      en: "And Saul feared David, because the Lord was with him, and was departed from himself."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "amovit ergo eum Saul a se et fecit eum tribunum super mille viros et egrediebatur et intrabat in conspectu populi"
      en: "Therefore Saul removed him from him, and made him a captain over a thousand men, and he went out and came in before the people."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "in omnibus quoque viis suis David prudenter agebat et Dominus erat cum eo"
      en: "And David behaved wisely in all his ways, and the Lord was with him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vidit itaque Saul quod prudens esset nimis et coepit cavere eum"
      en: "And Saul saw that he was exceeding prudent, and began to beware of him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "omnis autem Israhel et Iuda diligebat David ipse enim egrediebatur et ingrediebatur ante eos"
      en: "But all Israel and Juda loved David, for he came in and went out before them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dixit autem Saul ad David ecce filia mea maior Merob ipsam dabo tibi uxorem tantummodo esto vir fortis et proeliare bella Domini Saul autem reputabat dicens non sit manus mea in eo sed sit super illum manus Philisthinorum"
      en: "And Saul said to David: Behold my elder daughter Merob, her will I give thee to wife: only be a valiant man, and fight the battles of the Lord. Now Saul said within himself: Let not my hand be upon him, but let the hands of the Philistines be upon him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ait autem David ad Saul quis ego sum aut quae est vita mea aut cognatio patris mei in Israhel ut fiam gener regis"
      en: "And David said to Saul: Who am I, or what is my life, or my father's family in Israel, that I should be son in law of the king?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "factum est autem tempus cum deberet dari Merob filia Saul David data est Hadrihel Molathitae uxor"
      en: "And it came to pass at the time when Merob the daughter of Saul should have been given to David, that she was given to Hadriel the Molathite to wife."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dilexit autem Michol filia Saul altera David et nuntiatum est Saul et placuit ei"
      en: "But Michol the other daughter of Saul loved David. And it was told Saul, and it pleased him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dixitque Saul dabo eam illi ut fiat ei in scandalum et sit super eum manus Philisthinorum dixit ergo Saul ad David in duabus rebus gener meus eris hodie"
      en: "And Saul said: I will give her to him, that she may be a stumblingblock to him, and that the band of the Philistines may be upon him. And Saul said to David: In two things thou shalt be my son in law this day."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et mandavit Saul servis suis loquimini ad David clam me dicentes ecce places regi et omnes servi eius diligunt te nunc ergo esto gener regis"
      en: "And Saul commanded his servants to speak to David privately, saying: Behold thou pleasest the king, and all his servants love thee. Now therefore be the king's son in law."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et locuti sunt servi Saul in auribus David omnia verba haec et ait David num parum vobis videtur generum esse regis ego autem sum vir pauper et tenuis"
      en: "And the servants of Saul spoke all these words in the ears of David. And David said: Doth it seem to you a small matter to be the king's son in law? But I am a poor man, and of small ability."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et renuntiaverunt servi Saul dicentes huiuscemodi verba locutus est David"
      en: "And the servants of Saul told him, saying: Such words as these hath David spoken."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixit autem Saul sic loquimini ad David non habet necesse rex sponsalia nisi tantum centum praeputia Philisthinorum ut fiat ultio de inimicis regis porro Saul cogitabat tradere David in manibus Philisthinorum"
      en: "And Saul said: Speak thus to David: The king desireth not any dowry, but only a hundred foreskins of the Philistines, to be avenged of the king's enemies. Now Saul thought to deliver David into the hands of the Philistines."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cumque renuntiassent servi eius David verba quae diximus placuit sermo in oculis David ut fieret gener regis"
      en: "And when his servants had told David the words that Saul had said, the word was pleasing in the eyes of David to be the king's son in law."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et post dies paucos surgens David abiit cum viris qui sub eo erant et percussis Philisthim ducentis viris adtulit praeputia eorum et adnumeravit ea regi ut esset gener eius dedit itaque ei Saul Michol filiam suam uxorem"
      en: "And after a few days David rose up, and went with the men that were under him, and he slew of the Philistines two hundred men, and brought their foreskins and numbered them out to the king, that he might be his son in law. Saul therefore gave him Michol his daughter to wife."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et vidit Saul et intellexit quia Dominus esset cum David Michol autem filia Saul diligebat eum"
      en: "And Saul saw, and understood that the Lord was with David. And Michol the daughter of Saul loved him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et Saul magis coepit timere David factusque est Saul inimicus David cunctis diebus"
      en: "And Saul began to fear David more: and Saul became David's enemy continually."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et egressi sunt principes Philisthinorum a principio autem egressionis eorum prudentius se gerebat David quam omnes servi Saul et celebre factum est nomen eius nimis"
      en: "And the princes of the Philistines went forth: and from the beginning of their going forth, David behaved himself more wisely than all the servants of Saul, and his name became very famous."
    status: { la: verified, en: verified }
