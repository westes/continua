# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for isa 25 specifically; see TODO.md's bulk scripture import entry.
book: isa
chapter: 25
verses:
  - n: 1
    text:
      la: "Domine, Deus meus es tu; exaltabo te, et confitebor nomini tuo : quoniam fecisti mirabilia, cogitationes antiquas fideles. Amen."
      en: "O Lord, thou art my God, I will exalt thee, and give glory to thy name: for thou hast done wonderful things, thy designs of old faithful, amen."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quia posuisti civitatem in tumulum, urbem fortem in ruinam, domum alienorum : ut non sit civitas, et in sempiternum non aedificetur."
      en: "For thou hast reduced the city to a heap, the strong city to ruin, the house of strangers, to be no city, and to be no more built up for ever."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Super hoc laudabit te populus fortis; civitas gentium robustarum timebit te :"
      en: "Therefore shall a strong people praise thee, the city of mighty nations shall fear thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia factus es fortitudo pauperi, fortitudo egeno in tribulatione sua, spes a turbine, umbraculum ab aestu; spiritus enim robustorum quasi turbo impellens parietem."
      en: "Because thou hast been a strength to the poor, a strength to the needy in his distress: a refuge from the whirlwind, a shadow from the heat. For the blast of the mighty is like a whirlwind beating against a wall."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sicut aestus in siti, tumultum alienorum humiliabis; et quasi calore sub nube torrente, propaginem fortium marcescere facies."
      en: "Thou shalt bring down the tumult of strangers, as heat in thirst: and as with heat under a burning cloud, thou shalt make the branch of the mighty to wither away."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et faciet Dominus exercituum omnibus populis in monte hoc convivium pinguium, convivium vindemiae, pinguium medullatorum, vindemiae defaecatae."
      en: "And the Lord of hosts shall make unto all people in this mountain, a feast of fat things, a feast of wine, of fat things full of marrow, of wine purified from the lees."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et praecipitabit in monte isto faciem vinculi colligati super omnes populos, et telam quam orditus est super omnes nationes."
      en: "And he shall destroy in this mountain the face of the bond with which all people were tied, and the web that he began over all nations."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Praecipitabit mortem in sempiternum; et auferet Dominus Deus lacrimam ab omni facie, et opprobrium populi sui auferet de universa terra : quia Dominus locutus est."
      en: "He shall cast death down headlong for ever: and the Lord God shall wipe away tears from every face, and the reproach of his people he shall take away from off the whole earth: for the Lord hath spoken it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dicet in die illa : Ecce Deus noster iste; exspectavimus eum, et salvabit nos; iste Dominus, sustinuimus eum : exsultabimus, et laetabimur in salutari ejus."
      en: "And they shall say in that day: Lo, this is our God, we have waited for him, and he will save us: this is the Lord, we have patiently waited for him, we shall rejoice and be joyfull in his salvation."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quia requiescet manus Domini in monte isto; et triturabitur Moab sub eo, sicuti teruntur paleae in plaustro."
      en: "For the hand of the Lord shall rest in this mountain: and Moab shall be trodden down under him, as straw is broken in pieces with the wain."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et extendet manus suas sub eo sicut extendit natans ad natandum; et humiliabit gloriam ejus cum allisione manuum ejus."
      en: "And he shall stretch forth his hands under him, as he that swimmeth stretcheth forth his hands to swim: and he shall bring down his glory with the dashing of his hands."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et munimenta sublimium murorum tuorum concident, et humiliabuntur, et detrahentur in terram usque ad pulverem."
      en: "And the bulwarks of thy high walls shall fall, and be brought low, and shall be pulled down to the ground, even to the dust."
    status: { la: verified, en: verified }
