# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 4
verses:
  - n: 1
    text:
      la: "Tunc Jesus ductus est in desertum a Spiritu, ut tentaretur a diabolo."
      en: "Then Jesus was led by the spirit into the desert, to be tempted by the devil."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et cum jejunasset quadraginta diebus, et quadraginta noctibus, postea esuriit."
      en: "And when he had fasted forty days and forty nights, afterwards he was hungry."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et accedens tentator dixit ei: Si Filius Dei es, dic ut lapides isti panes fiant."
      en: "And the tempter coming said to him: If thou be the Son of God, command that these stones be made bread."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui respondens dixit: Scriptum est: Non in solo pane vivit homo, sed in omni verbo, quod procedit de ore Dei."
      en: "Who answered and said: It is written, Not in bread alone doth man live, but in every word that proceedeth from the mouth of God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tunc assumpsit eum diabolus in sanctam civitatem, et statuit eum super pinnaculum templi,"
      en: "Then the devil took him up into the holy city, and set him upon the pinnacle of the temple,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et dixit ei: Si Filius Dei es, mitte te deorsum. Scriptum est enim: Quia angelis suis mandavit de te, et in manibus tollent te, ne forte offendas ad lapidem pedem tuum."
      en: "And said to him: If thou be the Son of God, cast thyself down, for it is written: That he hath given his angels charge over thee, and in their hands shall they bear thee up, lest perhaps thou dash thy foot against a stone."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ait illi Jesus: Rursum scriptum est: Non tentabis Dominum Deum tuum."
      en: "Jesus said to him: It is written again: Thou shalt not tempt the Lord thy God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Iterum assumpsit eum diabolus in montem excelsum valde: et ostendit ei omnia regna mundi, et gloriam eorum,"
      en: "Again the devil took him up into a very high mountain, and shewed him all the kingdoms of the world, and the glory of them,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit ei: Haec omnia tibi dabo, si cadens adoraveris me."
      en: "And said to him: All these will I give thee, if falling down thou wilt adore me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tunc dicit ei Jesus: Vade Satana: Scriptum est enim: Dominum Deum tuum adorabis, et illi soli servies."
      en: "Then Jesus saith to him: Begone, Satan: for it is written, The Lord thy God shalt thou adore, and him only shalt thou serve."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Tunc reliquit eum diabolus: et ecce angeli accesserunt, et ministrabant ei."
      en: "Then the devil left him; and behold angels came and ministered to him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum autem audisset Jesus quod Joannes traditus esset, secessit in Galilaeam:"
      en: "And when Jesus had heard that John was delivered up, he retired into Galilee:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et, relicta civitate Nazareth, venit, et habitavit in Capharnaum maritima, in finibus Zabulon et Nephthalim:"
      en: "And leaving the city Nazareth, he came and dwelt in Capharnaum on the sea coast, in the borders of Zabulon and Nephthalim;"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ut adimpleretur quod dictum est per Isaiam prophetam:"
      en: "That it might be fulfilled which was said by Isaias the prophet:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Terra Zabulon, et terra Nephthalim, via maris trans Jordanem, Galilaea gentium:"
      en: "Land of Zabulon and land of Nephthalim, the way of the sea beyond the Jordan, Galilee of the Gentiles:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "populus, qui sedebat in tenebris, vidit lucem magnam: et sedentibus in regione umbrae mortis, lux orta est eis."
      en: "The people that sat in darkness, hath seen great light: and to them that sat in the region of the shadow of death, light is sprung up."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Exinde coepit Jesus praedicare, et dicere: Poenitentiam agite: appropinquavit enim regnum caelorum."
      en: "From that time Jesus began to preach, and to say: Do penance, for the kingdom of heaven is at hand."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ambulans autem Jesus juxta mare Galilaeae, vidit duos fratres, Simonem, qui vocatur Petrus, et Andream fratrem ejus, mittentes rete in mare ( erant enim piscatores),"
      en: "And Jesus walking by the sea of Galilee, saw two brethren, Simon who is called Peter, and Andrew his brother, casting a net into the sea (for they were fishers)."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et ait illis: Venite post me, et faciam vos fieri piscatores hominum."
      en: "And he saith to them: Come ye after me, and I will make you to be fishers of men."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "At illi continuo relictis retibus secuti sunt eum."
      en: "And they immediately leaving their nets, followed him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et procedens inde, vidit alios duos fratres, Jacobum Zebedaei, et Joannem fratrem ejus, in navi cum Zebedaeo patre eorum, reficientes retia sua: et vocavit eos."
      en: "And going on from thence, he saw other two brethren, James the son of Zebedee, and John his brother, in a ship with Zebedee their father, mending their nets: and he called them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Illi autem statim relictis retibus et patre, secuti sunt eum."
      en: "And they forthwith left their nets and father, and followed him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et circuibat Jesus totam Galilaeam, docens in synagogis eorum, et praedicans Evangelium regni: et sanans omnem languorem, et omnem infirmitatem in populo."
      en: "And Jesus went about all Galilee, teaching in their synagogues, and preaching the gospel of the kingdom: and healing all manner of sickness and every infirmity, among the people."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et abiit opinio ejus in totam Syriam, et obtulerunt ei omnes male habentes, variis languoribus, et tormentis comprehensos, et qui daemonia habebant, et lunaticos, et paralyticos, et curavit eos:"
      en: "And his fame went throughout all Syria, and they presented to him all sick people that were taken with divers diseases and torments, and such as were possessed by devils, and lunatics, and those that had palsy, and he cured them:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et secutae sunt eum turbae multae de Galilaea, et Decapoli, et de Jerosolymis, et de Judaea, et de trans Jordanem."
      en: "And much people followed him from Galilee, and from Decapolis, and from Jerusalem, and from Judea, and from beyond the Jordan."
    status: { la: verified, en: verified }
