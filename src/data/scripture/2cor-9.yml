# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 9
verses:
  - n: 1
    text:
      la: "Nam de ministerio, quod fit in sanctos ex abundanti est mihi scribere vobis."
      en: "For concerning the ministry that is done towards the saints, it is superfluous for me to write unto you."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Scio enim promptum animum vestrum: pro quo de vobis glorior apud Macedones. Quoniam et Achaia parata est ab anno praeterito, et vestra aemulatio provocavit plurimos."
      en: "For I know your forward mind: for which I boast of you to the Macedonians. That Achaia also is ready from the year past, and your emulation hath provoked very many."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Misi autem fratres: ut ne quod gloriamur de vobis, evacuetur in hac parte, ut ( quemadmodum dixi) parati sitis:"
      en: "Now I have sent the brethren, that the thing which we boast of concerning you, be not made void in this behalf, that (as I have said) you may be ready:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ne cum venerint Macedones mecum, et invenerint vos imparatos, erubescamus nos ( ut non dicamus vos) in hac substantia."
      en: "Lest, when the Macedonians shall come with me, and find you unprepared, we (not to say ye) should be ashamed in this matter."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Necessarium ergo existimavi rogare fratres, ut praeveniant ad vos, et praeparent repromissam benedictionem hanc paratam esse sic, quasi benedictionem, non tamquam avaritiam."
      en: "Therefore I thought it necessary to desire the brethren that they would go to you before, and prepare this blessing before promised, to be ready, so as a blessing, not as covetousness."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Hoc autem dico: qui parce seminat, parce et metet: et qui seminat in benedictionibus, de benedictionibus et metet."
      en: "Now this I say: He who soweth sparingly, shall also reap sparingly: and he who soweth in blessings, shall also reap blessings."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Unusquisque, prout destinavit in corde suo, non ex tristitia, aut ex necessitate: hilarem enim datorem diligit Deus."
      en: "Every one as he hath determined in his heart, not with sadness, or of necessity: for God loveth a cheerful giver."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Potens est autem Deus omnem gratiam abundare facere in vobis: ut in omnibus semper omnem sufficientiam habentes, abundetis in omne opus bonum,"
      en: "And God is able to make all grace abound in you; that ye always, having all sufficiency in all things, may abound to every good work,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sicut scriptum est: Dispersit, dedit pauperibus: justitia ejus manet in saeculum saeculi."
      en: "As it is written: He hath dispersed abroad, he hath given to the poor: his justice remaineth for ever."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui autem administrat semen seminanti: et panem ad manducandum praestabit, et multiplicabit semen vestrum, et augebit incrementa frugum justitiae vestrae:"
      en: "And he that ministereth seed to the sower, will both give you bread to eat, and will multiply your seed, and increase the growth of the fruits of your justice:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ut in omnibus locupletati abundetis in omnem simplicitatem, quae operatur per nos gratiarum actionem Deo."
      en: "That being enriched in all things, you may abound unto all simplicity, which worketh through us thanksgiving to God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quoniam ministerium hujus officii non solum supplet ea quae desunt sanctis, sed etiam abundat per multas gratiarum actiones in Domino,"
      en: "Because the administration of this office doth not only supply the want of the saints, but aboundeth also by many thanksgivings in the Lord,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "per probationem ministerii hujus, glorificantes Deum in obedientia confessionis vestrae, in Evangelium Christi, et simplicitate communicationis in illos, et in omnes,"
      en: "By the proof of this ministry, glorifying God for the obedience of your confession unto the gospel of Christ, and for the simplicity of your communicating unto them, and unto all."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et in ipsorum obsecratione pro vobis, desiderantium vos propter eminentem gratiam Dei in vobis."
      en: "And in their praying for you, being desirous of you, because of the excellent grace of God in you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Gratias Deo super inenarrabili dono ejus."
      en: "Thanks be to God for his unspeakable gift."
    status: { la: verified, en: verified }
