# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sap
chapter: 16
verses:
  - n: 1
    text:
      la: "Propter haec et per his similia passi sunt digne tormenta, et per multitudinem bestiarum exterminati sunt."
      en: "For these things, and by the like things to these, they were worthily punished, and were destroyed by a multitude of beasts."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Pro quibus tormentis bene disposuisti populum tuum, quibus dedisti concupiscentiam delectamenti sui novum saporem, escam parans eis ortygometram:"
      en: "Instead of which punishment, dealing well with thy people, thou gavest them their desire of delicious food, of a new taste, preparing for them quails for their meat:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ut illi quidem, concupiscentes escam propter ea quae illis ostensa et missa sunt, etiam a necessaria concupiscentia averterentur. Hi autem in brevi inopes facti, novam gustaverunt escam."
      en: "To the end that they indeed desiring food, by means of those things that were shewn and sent among them, might loathe even that which was necessary to satisfy their desire. But these, after suffering want for a short time, tasted a new meat."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Oportebat enim illis sine excusatione quidem supervenire interitum exercentibus tyrannidem; his autem tantum ostendere quemadmodum inimici eorum exterminabantur."
      en: "For it was requisite that inevitable destruction should come upon them that exercised tyranny: but to these it should only be shewn how their enemies were destroyed."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Etenim cum illis supervenit saeva bestiarum ira, morsibus perversorum colubrorum exterminabantur."
      en: "For when the fierce rage of beasts came upon these, they were destroyed with the bitings of crooked serpents."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sed non in perpetuum ira tua permansit, sed ad correptionem in brevi turbati sunt, signum habentes salutis ad commemorationem mandati legis tuae."
      en: "But thy wrath endured not for ever, but they were troubled for a short time for their correction, having a sign of salvation to put them in remembrance of the commandment of thy law."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui enim conversus est, non per hoc quod videbat sanabatur, sed per te omnium salvatorem."
      en: "For he that turned to it, was not healed by that which he saw, but by thee the Saviour of all."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In hoc autem ostendisti inimicis nostris, quia tu es qui liberas ab omni malo."
      en: "And in this thou didst shew to our enemies, that thou art he who deliverest from all evil."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Illos enim locustarum et muscarum occiderunt morsus, et non est inventa sanitas animae illorum, quia digni erant ab hujuscemodi exterminari."
      en: "For the bitings of locusts, and of flies killed them, and there was found no remedy for their life: because they were worthy to be destroyed by such things."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Filios autem tuos nec draconum venenatorum vicerunt dentes; misericordia enim tua adveniens sanabat illos."
      en: "But not even the teeth of venomous serpents overcame thy children: for thy mercy came and healed them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In memoria enim sermonum tuorum examinabantur, et velociter salvabantur, ne in altam incidentes oblivionem, non possent tuo uti adjutorio."
      en: "For they were examined for the remembrance of thy words, and were quickly healed, lest falling into deep forgetfulness, they might not be able to use thy help."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Etenim neque herba, neque malagma sanavit eos; sed tuus, Domine, sermo, qui sanat omnia."
      en: "For it was neither herb, nor mollifying plaster that healed them, but thy word, O Lord, which healeth all things."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tu es enim, Domine, qui vitae et mortis habes potestatem, et deducis ad portas mortis, et reducis."
      en: "For it is thou, O Lord, that hast power of life and death, and leadest down to the gates of death, and bringest back again:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Homo autem occidit quidem per malitiam; et cum exierit spiritus, non revertetur, nec revocabit animam quae recepta est."
      en: "A man indeed killeth through malice, and when the spirit is gone forth, it shall not return, neither shall he call back the soul that is received:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sed tuam manum effugere impossibile est."
      en: "But it is impossible to escape thy hand."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Negantes enim te nosse impii, per fortitudinem brachii tui flagellati sunt; novis aquis, et grandinibus, et pluviis persecutionem passi, et per ignem consumpti."
      en: "For the wicked that denied to know thee, were scourged by the strength of thy arm, being persecuted by strange waters, and hail, and rain, and consumed by fire."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quod enim mirabile erat, in aqua, quae omnia extinguit, plus ignis valebat; Vindex est enim orbis justorum."
      en: "And which was wonderful, in water, which extinguisheth all things, the fire had more force: for the world fighteth for the just."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quodam enim tempore mansuetabatur ignis, ne comburerentur quae ad impios missa erant animalia, sed ut ipsi videntes scirent quoniam Dei judicio patiuntur persecutionem."
      en: "For at one time, the fire was mitigated, that the beasts which were sent against the wicked might not be burned, but that they might see and perceive that they were persecuted by the judgment of God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et quodam tempore in aqua supra virtutem ignis exardescebat undique, ut iniquae terrae nationem exterminaret."
      en: "And at another time the fire, above its own power, burned in the midst of water, to destroy the fruits of a wicked land."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Pro quibus angelorum esca nutrivisti populum tuum; et paratum panem de caelo praestitisti illis sine labore. Omne delectamentum in se habentem, et omnis saporis suavitatem."
      en: "Instead of which things thou didst feed thy people with the food of angels, and gavest them bread from heaven prepared without labour; having in it all that is delicious, and the sweetness of every taste."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Substantia enim tua dulcedinem tuam, quam in filios habes, ostendebat; et deserviens uniuscujusque voluntati, ad quod quisque volebat convertebatur."
      en: "For thy sustenance shewed thy sweetness to thy children, and serving every man's will, it was turned to what every man liked."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Nix autem et glacies sustinebant vim ignis, et non tabescebant: ut scirent quoniam fructus inimicorum exterminabat ignis ardens in grandine et pluvia coruscans;"
      en: "But snow and ice endured the force of fire, and melted not: that they might know that fire burning in the hail and flashing in the rain destroyed the fruits of the enemies."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "hic autem iterum ut nutrirentur justi, etiam suae virtutis oblitus est."
      en: "But this same again, that the just might be nourished, did even forget its own strength."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Creatura enim tibi Factori deserviens, exardescit in tormentum adversus injustos, et lenior fit ad benefaciendum pro his qui in te confidunt."
      en: "For the creature serving thee the Creator, is made fierce against the unjust for their punishment; and abateth its strength for the benefit of them that trust in thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Propter hoc et tunc in omnia transfigurata, omnium nutrici gratiae tuae deserviebat, ad voluntatem eorum qui a te desiderabant;"
      en: "Therefore even then it was transformed into all things, and was obedient to thy grace that nourisheth all, according to the will of them that desired it of thee."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ut scirent filii tui quos dilexisti, Domine, quoniam non nativitatis fructus pascunt homines, sed sermo tuus hos qui in te crediderint conservat."
      en: "That thy children, O Lord, whom thou lovedst, might know that it is not the growing of fruits that nourisheth men, but thy word preserveth them that believe in thee:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quod enim ab igne non poterat exterminari, statim ab exiguo radio solis calefactum tabescebat,"
      en: "For that which could not be destroyed by fire, being warmed with a little sunbeam presently melted away:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ut notum omnibus esset, quoniam oportet praevenire solem ad benedictionem tuam, et ad ortum lucis te adorare."
      en: "That it might be known to all, that we ought to prevent the sun to bless thee, and adore thee at the dawning of the light."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ingrati enim spes tamquam hibernalis glacies tabescet, et disperiet tamquam aqua supervacua."
      en: "For the hope of the unthankful shall melt away as the winter's ice, and shall run off as unprofitable water."
    status: { la: verified, en: verified }
