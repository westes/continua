# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 48
verses:
  - n: 1
    text:
      la: "Audite haec, domus Jacob, qui vocamini nomine Israel, et de aquis Juda existis, qui juratis in nomine Domini, et Dei Israel recordamini non in veritate neque in justitia."
      en: "Hear ye these things, O house of Jacob, you that are called by the name of Israel, and are come forth out of the waters of Juda, you who swear by the name of the Lord, and make mention of the God of Israel, but not in truth, nor in justice."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "De civitate enim sancta vocati sunt; et super Deum Israel constabiliti sunt; Dominus exercituum nomen ejus."
      en: "For they are called of the holy city, and are established upon the God of Israel: the Lord of hosts is his name."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Priora ex tunc annuntiavi, et ex ore meo exierunt, et audita feci ea; repente operatus sum, et venerunt."
      en: "The former things of old I have declared, and they went forth out of my mouth, and I have made them to be heard: I did them suddenly and they came to pass."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Scivi enim quia durus es tu, et nervus ferreus cervix tua, et frons tua aerea."
      en: "For I knew that thou art stubborn, and thy neck is as an iron sinew, and thy forehead as brass."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Praedixi tibi ex tunc; antequam venirent indicavi tibi, ne forte diceres: Idola mea fecerunt haec; et sculptilia mea, et conflatilia mandaverunt ista."
      en: "I foretold thee of old, before they came to pass I told thee, lest thou shouldst say: My idols have done these things, and my graven and molten things have commanded them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quae audisti, vide omnia; vos autem, num annuntiastis? Audita feci tibi nova ex tunc, et conservata sunt quae nescis."
      en: "See now all the things which thou hast heard: but have you declared them? I have shewn thee new things from that time, and things are kept which thou knowest not:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nunc creata sunt et non ex tunc; et ante diem, et non audisti ea, ne forte dicas: Ecce ego cognovi ea."
      en: "They are created now, and not of old: and before the day, when thou heardest them not, lest thou shouldst say: Behold I knew them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Neque audisti, neque cognovisti, neque ex tunc aperta est auris tua; scio enim quia praevaricans praevaricaberis, et transgressorem ex utero vocavi te."
      en: "Thou hast neither heard, nor known, neither was thy ear opened of old. For I know that transgressing thou wilt transgress, and I have called thee a transgressor from the womb."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Propter nomen meum longe faciam furorem meum; et laude mea infrenabo te, ne intereas."
      en: "For my name's sake I will remove my wrath far off: and for my praise I will bridle thee, lest thou shouldst perish."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ecce excoxi te, sed non quasi argentum; elegi te in camino paupertatis."
      en: "Behold I have refined thee, but not as silver, I have chosen thee in the furnace of poverty."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Propter me, propter me faciam, ut non blasphemer; et gloriam meam alteri non dabo."
      en: "For my own sake, for my own sake will I do it, that I may not be blasphemed: and I will not give my glory to another."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Audi me, Jacob, et Israel, quem ego voco; ego ipse, ego primus, et ego novissimus."
      en: "Hearken to me, O Jacob, and thou Israel whom I call: I am he, I am the first, and I am the last."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Manus quoque mea fundavit terram, et dextera mea mensa est caelos; ego vocabo eos, et stabunt simul."
      en: "My hand also hath founded the earth, and my right hand hath measured the heavens: I shall call them, and they shall stand together."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Congregamini, omnes vos, et audite: Quis de eis annuntiavit haec? Dominus dilexit eum, faciet voluntatem suam in Babylone, et brachium suum in Chaldaeis."
      en: "Assemble yourselves together, all you, and hear: who among them hath declared these things? the Lord hath loved him, he will do his pleasure in Babylon, and his arm shall be on the Chaldeans."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ego, ego locutus sum, et vocavi eum; adduxi eum, et directa est via ejus."
      en: "I, even I have spoken and called him: I have brought him, and his way is made prosperous."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Accedite ad me et audite hoc: non a principio in abscondito locutus sum, ex tempore antequam fieret, ibi eram; et nunc Dominus Deus misit me, et spiritus ejus."
      en: "Come ye near unto me, and hear this: I have not spoken in secret from the beginning: from the time before it was done, I was there, and now the Lord God hath sent me, and his spirit."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Haec dicit Dominus, redemptor tuus, Sanctus Israel: Ego Dominus Deus tuus, docens te utilia, gubernans te in via qua ambulas."
      en: "Thus saith the Lord thy redeemer, the Holy One of Israel: I am the Lord thy God that teach thee profitable things, that govern thee in the way that thou walkest."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Utinam attendisses mandata mea: facta fuisset sicut flumen pax tua, et justitia tua sicut gurgites maris;"
      en: "O that thou hadst hearkened to my commandments: thy peace had been as a river, and thy justice as the waves of the sea,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et fuisset quasi arena semen tuum, et stirps uteri tui ut lapilli ejus; non interisset et non fuisset attritum nomen ejus a facie mea."
      en: "And thy seed had been as the sand, and the offspring of thy bowels like the gravel thereof: his name should not have perished, nor have been destroyed from before my face."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Egredimini de Babylone, fugite a Chaldaeis, in voce exsultationis annuntiate; auditum facite hoc, et efferte illud usque ad extrema terrae. Dicite: Redemit Dominus servum suum Jacob."
      en: "Come forth out of Babylon, flee ye from the Chaldeans, declare it with the voice of joy: make this to be heard, and speak it out even to the ends of the earth. Say: The Lord hath redeemed his servant Jacob."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Non sitierunt in deserto, cum educeret eos; aquam de petra produxit eis; et scidit petram, et fluxerunt aquae."
      en: "They thirsted not in the desert, when he led them out: he brought forth water out of the rock for them, and he clove the rock, and the waters gushed out."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non est pax impiis, dicit Dominus."
      en: "There is no peace to the wicked, saith the Lord."
    status: { la: verified, en: verified }
