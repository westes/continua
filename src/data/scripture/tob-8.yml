# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: tob
chapter: 8
verses:
  - n: 1
    text:
      la: "postquam vero cenaverunt introduxerunt iuvenem ad eam"
      en: "And after they had supped, they brought in the young man to her."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "recordatus itaque Tobias sermonem angeli protulit de cassidile suo partem iecoris posuitque eam super carbones vivos"
      en: "And Tobias remembering the angel's word, took out of his bag part of the liver, and laid it upon burning coals."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tunc Rafahel angelus adprehendit daemonium et religavit eum in deserto superioris Aegypti"
      en: "Then the angel Raphael took the devil, and bound him in the desert of upper Egypt."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "tunc hortatus est virginem Tobias dixitque ei Sarra exsurge deprecemus Deum hodie et cras et secundum cras quia istis tribus noctibus Deo iungimur tertia autem transacta nocte in nostro erimus coniugio"
      en: "Then Tobias exhorted the virgin, and said to her: Sara, arise, and let us pray to God to day, and to morrow, and the next day: because for these three nights we are joined to God: and when the third night is over, we will be in our own wedlock."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "filii quippe sanctorum sumus et non possumus ita coniungi sicut et gentes quae ignorant Deum"
      en: "For we are the children of saints, and we must not be joined together like heathens that know not God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "surgentes autem pariter instanter orabant ambo ut sanitas daretur eis"
      en: "So they both arose, and prayed earnestly both together that health might be given them,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixitque Tobias Domine Deus patrum nostrorum benedicant te caeli et terra et mare fontes et flumina et omnis creatura tua quae in eis sunt"
      en: "And Tobias said: Lord God of our father, may the heavens and the earth, and the sea, and the fountains, and the rivers, and all thy creatures that are in them, bless thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tu fecisti Adam de limo terrae dedistique ei adiutorium Evam"
      en: "Thou madest Adam of the slime of the earth, and gavest him Eve for a helper."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et nunc Domine tu scis quia non luxuriae causa accipio sororem meam sed sola posteritatis dilectione in qua benedicatur nomen tuum in saecula saeculorum"
      en: "And now, Lord, thou knowest, that not for fleshly lust do I take my sister to wife, but only for the love of posterity, in which thy name may be blessed for ever and ever."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixit itaque Sarra miserere nobis Domine miserere nobis et consenescamus ambo pariter sani"
      en: "Sara also said: Have mercy on us, O Lord, have mercy on us, and let us grow old both together in health."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et factum est circa pullorum cantum accersiri iussit Raguhel servos suos et abierunt pariter ut foderent sepulchrum"
      en: "And it came to pass about the cockcrowing, Raguel ordered his servants to be called for, and they went with him together to dig a grave."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dicebat enim ne simili modo evenerit ei quod et ceteris illis septem qui sunt ingressi ad eam"
      en: "For he said: Lest perhaps it may have happened to him, in like manner as it did to the other seven husbands, that went in unto her."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cumque parassent fossam reversus ad uxorem suam Raguhel dixit"
      en: "And when they had prepared the pit, Raguel went back to his wife, and said to her:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "mitte unam ex ancillis tuis et videat si mortuus est ut sepeliam illum antequam inlucescat"
      en: "Send one of thy maids, and let her see if he be dead, that I may bury him before it be day."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "at illa mittens unam ex ancillis suis ingressa cubiculum repperitque eos incolomes secum pariter dormientes"
      en: "So she sent one of her maidservants, who went into the chamber, and found them safe and sound, sleeping both together."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "reversa nuntiavit bonum nuntium et benedixerunt Deum Raguhel videlicet et Anna uxor eius"
      en: "And returning she brought the good news: and Raguel and Anna his wife blessed the Lord,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et dixerunt benedicimus te Domine Deus Israhel quia non contigit nobis quemadmodum putabamus"
      en: "And said: We bless thee, O Lord God of Israel, because it hath not happened as we suspected."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "fecisti enim nobiscum misericordiam tuam et exclusisti a nobis inimicum persequentem nos"
      en: "For thou hast shewn thy mercy to us, and hast shut out from us the enemy that persecuted us."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "misertus es autem duobus unicis fac eos Domine in plenius benedicere te et sacrificium tibi laudis tuae et suae sanitatis offerre ut cognoscat universitas gentium quia tu es Deus solus in universa terra"
      en: "And thou hast taken pity upon two only children. Make them, O Lord, bless thee more fully: and to offer up to thee a sacrifice of thy praise, and of their health, that all nations may know, that thou alone art God in all the earth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "statimque praecepit servis suis Raguhel ut replerent fossam quam fecerant priusquam lucesceret"
      en: "And immediately Raguel commanded his servants, to fill up the pit they had made, before it was day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "uxori autem suae dixit ut instrueret convivium et praepararet omnia quae in cibos erant iter agentibus necessaria"
      en: "And he spoke to his wife to make ready a feast, and prepare all kind of provisions that are necessary for such as go a journey."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "duas quoque vaccas pingues et quattuor arietes occidi fecit et parari epulas omnibus vicinis suis et cunctis amicis"
      en: "He caused also two fat kine, and four wethers to be killed, and a banquet to be prepared for all his neighbours, and all his friends."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et adiuravit Raguhel Tobiam ut duas ebdomadas moraretur apud eum"
      en: "And Raguel adjured Tobias, to abide with him two weeks."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "de omnibus autem quae possidebat Raguhel dimidiam partem dedit Tobiae et fecit hanc scripturam ut pars dimidia quae supererat post obitum eorum Tobis dominio deveniret"
      en: "And of all things which Raguel possessed, he gave one half to Tobias, and made him a writing, that the half that remained should after their decease come also to Tobias."
    status: { la: verified, en: verified }
