# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: tob
chapter: 8
verses:
  - n: 1
    text:
      la: "Postquam vero coenaverunt, introduxerunt juvenem ad eam."
      en: "And after they had supped, they brought in the young man to her."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Recordatus itaque Tobias sermonum angeli, protulit de cassidili suo partem jecoris, posuitque eam super carbones vivos."
      en: "And Tobias remembering the angel's word, took out of his bag part of the liver, and laid it upon burning coals."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tunc Raphael angelus apprehendit daemonium, et religavit illud in deserto superioris Aegypti."
      en: "Then the angel Raphael took the devil, and bound him in the desert of upper Egypt."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Tunc hortatus est virginem Tobias, dixitque ei: Sara, exsurge, et deprecemur Deum hodie, et cras, et secundum cras: quia his tribus noctibus Deo jungimur: tertia autem transacta nocte, in nostro erimus conjugio."
      en: "Then Tobias exhorted the virgin, and said to her: Sara, arise, and let us pray to God today, and tomorrow, and the next day: because for these three nights we are joined to God: and when the third night is over, we will be in our own wedlock."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Filii quippe sanctorum sumus, et non possumus ita conjungi sicut gentes, quae ignorant Deum."
      en: "For we are the children of saints, and we must not be joined together like heathens that know not God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Surgentes autem pariter, instanter orabant ambo simul, ut sanitas daretur eis."
      en: "So they both arose, and prayed earnestly both together that health might be given them,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dixitque Tobias: Domine Deus patrum nostrorum, benedicant te caeli et terrae, mareque et fontes, et flumina, et omnes creaturae tuae, quae in eis sunt."
      en: "And Tobias said: Lord God of our father, may the heavens and the earth, and the sea, and the fountains, and the rivers, and all thy creatures that are in them, bless thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Tu fecisti Adam de limo terrae, dedistique ei adjutorium Hevam."
      en: "Thou madest Adam of the slime of the earth, and gavest him Eve for a helper."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et nunc Domine, tu scis quia non luxuriae causa accipio sororem meam conjugem, sed sola posteritatis dilectione, in qua benedicatur nomen tuum in saecula saeculorum."
      en: "And now, Lord, thou knowest, that not for fleshly lust do I take my sister to wife, but only for the love of posterity, in which thy name may be blessed for ever and ever."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixit quoque Sara: Miserere nobis Domine, miserere nobis, et consenescamus ambo pariter sani."
      en: "Sara also said: Have mercy on us, O Lord, have mercy on us, and let us grow old both together in health."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et factum est circa pullorum cantum, accersiri jussit Raguel servos suos, et abierunt cum eo pariter ut foderent sepulchrum."
      en: "And it came to pass about the cockcrowing, Raguel ordered his servants to be called for, and they went with him together to dig a grave."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dicebat enim: Ne forte simili modo evenerit ei, quo et ceteris illis septem viris, qui sunt ingressi ad eam."
      en: "For he said: Lest perhaps it may have happened to him, in like manner as it did to the other seven husbands, that went in unto her."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cumque parassent fossam, reversus Raguel ad uxorem suam, dixit ei:"
      en: "And when they had prepared the pit, Raguel went back to his wife, and said to her:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Mitte unam de ancillis tuis, et videat si mortuus est, ut sepeliam eum antequam illucescat dies."
      en: "Send one of thy maids, and let her see if he be dead, that I may bury him before it be day."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "At illa misit unam ex ancillis suis. Quae ingressa cubiculum, reperit eos salvos et incolumes, secum pariter dormientes."
      en: "So she sent one of her maidservants, who went into the chamber, and found them safe and sound, sleeping both together."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et reversa nuntiavit bonum nuntium: et benedixerunt Dominum, Raguel videlicet et Anna uxor ejus,"
      en: "And returning she brought the good news: and Raguel and Anna his wife blessed the Lord,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et dixerunt: Benedicimus te, Domine Deus Israel, quia non contigit quemadmodum putabamus."
      en: "And said: We bless thee, O Lord God of Israel, because it hath not happened as we suspected."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Fecisti enim nobiscum misericordiam tuam, et exclusisti a nobis inimicum persequentem nos."
      en: "For thou hast shewn thy mercy to us, and hast shut out from us the enemy that persecuted us."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Misertus es autem duobus unicis. Fac eos, Domine, plenius benedicere te: et sacrificium tibi laudis tuae et suae sanitatis offerre, ut cognoscat universitas gentium, quia tu es Deus solus in universa terra."
      en: "And thou hast taken pity upon two only children. Make them, O Lord, bless thee more fully: and to offer up to thee a sacrifice of thy praise, and of their health, that all nations may know, that thou alone art God in all the earth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Statimque praecepit servis suis Raguel, ut replerent fossam, quam fecerant priusquam elucesceret."
      en: "And immediately Raguel commanded his servants, to fill up the pit they had made, before it was day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Uxori autem suae dixit ut instrueret convivium, et praepararet omnia, quae in cibos erant iter agentibus necessaria."
      en: "And he spoke to his wife to make ready a feast, and prepare all kind of provisions that are necessary for such as go a journey."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Duas quoque pingues vaccas, et quatuor arietes occidi fecit, et parari epulas omnibus vicinis suis, cunctisque amicis."
      en: "He caused also two fat kine, and four wethers to be killed, and a banquet to be prepared for all his neighbours, and all his friends."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et adjuravit Raguel Tobiam, ut duas hebdomadas moraretur apud se."
      en: "And Raguel adjured Tobias, to abide with him two weeks."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "De omnibus autem, quae possidebat Raguel, dimidiam partem dedit Tobiae, et fecit scripturam, ut pars dimidia, quae supererat post obitum eorum, Tobiae dominio deveniret."
      en: "And of all things which Raguel possessed, he gave one half to Tobias, and made him a writing, that the half that remained should after their decease come also to Tobias."
    status: { la: verified, en: verified }
