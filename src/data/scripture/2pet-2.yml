# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2pet
chapter: 2
verses:
  - n: 1
    text:
      la: "fuerunt vero et pseudoprophetae in populo sicut et in vobis erunt magistri mendaces qui introducent sectas perditionis et eum qui emit eos Dominum negant superducentes sibi celerem perditionem"
      en: "But there were also false prophets among the people, even as there shall be among you lying teachers, who shall bring in sects of perdition, and deny the Lord who bought them: bringing upon themselves swift destruction."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et multi sequentur eorum luxurias per quos via veritatis blasphemabitur"
      en: "And many shall follow their riotousnesses, through whom the way of truth shall be evil spoken of."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et in avaritia fictis verbis de vobis negotiabuntur quibus iudicium iam olim non cessat et perditio eorum non dormitat"
      en: "And through covetousness shall they with feigned words make merchandise of you. Whose judgment now of a long time lingereth not, and their perdition slumbereth not."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si enim Deus angelis peccantibus non pepercit sed rudentibus inferni detractos in tartarum tradidit in iudicium cruciatos reservari"
      en: "For if God spared not the angels that sinned, but delivered them, drawn down by infernal ropes to the lower hell, unto torments, to be reserved unto judgment:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et originali mundo non pepercit sed octavum Noe iustitiae praeconem custodivit diluvium mundo impiorum inducens"
      en: "And spared not the original world, but preserved Noe, the eighth person, the preacher of justice, bringing in the flood upon the world of the ungodly."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et civitates Sodomorum et Gomorraeorum in cinerem redigens eversione damnavit exemplum eorum qui impie acturi sunt ponens"
      en: "And reducing the cities of the Sodomites, and of the Gomorrhites, into ashes, condemned them to be overthrown, making them an example to those that should after act wickedly."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et iustum Loth oppressum a nefandorum iniuria conversatione eruit"
      en: "And delivered just Lot, oppressed by the injustice and lewd conversation of the wicked."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "aspectu enim et auditu iustus erat habitans apud eos qui diem de die animam iustam iniquis operibus cruciabant"
      en: "For in sight and hearing he was just: dwelling among them, who from day to day vexed the just soul with unjust works."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "novit Dominus pios de temptatione eripere iniquos vero in diem iudicii cruciandos reservare"
      en: "The Lord knoweth how to deliver the godly from temptation, but to reserve the unjust unto the day of judgment to be tormented."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "magis autem eos qui post carnem in concupiscentia inmunditiae ambulant dominationemque contemnunt audaces sibi placentes sectas non metuunt blasphemantes"
      en: "And especially them who walk after the flesh in the lust of uncleanness, and despise government, audacious, self willed, they fear not to bring in sects, blaspheming."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ubi angeli fortitudine et virtute cum sint maiores non portant adversum se execrabile iudicium"
      en: "Whereas angels who are greater in strength and power, bring not against themselves a railing judgment."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "hii vero velut inrationabilia pecora naturaliter in captionem et in perniciem in his quae ignorant blasphemantes in corruptione sua et peribunt"
      en: "But these men, as irrational beasts, naturally tending to the snare and to destruction, blaspheming those things which they know not, shall perish in their corruption,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "percipientes mercedem iniustitiae voluptatem existimantes diei delicias coinquinationes et maculae deliciis affluentes in conviviis suis luxuriantes vobiscum"
      en: "Receiving the reward of their injustice, counting for a pleasure the delights of a day: stains and spots, sporting themselves to excess, rioting in their feasts with you:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "oculos habentes plenos adulterio et incessabiles delicti pellicentes animas instabiles cor exercitatum avaritiae habentes maledictionis filii"
      en: "Having eyes full of adultery and of sin that ceaseth not: alluring unstable souls, having their heart exercised with covetousness, children of malediction:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "derelinquentes rectam viam erraverunt secuti viam Balaam ex Bosor qui mercedem iniquitatis amavit"
      en: "Leaving the right way they have gone astray, having followed the way of Balaam of Bosor, who loved the wages of iniquity,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "correptionem vero habuit suae vesaniae subiugale mutum in hominis voce loquens prohibuit prophetae insipientiam"
      en: "But had a check of his madness, the dumb beast used to the yoke, which speaking with man's voice, forbade the folly of the prophet."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "hii sunt fontes sine aqua et nebulae turbinibus exagitatae quibus caligo tenebrarum reservatur"
      en: "These are fountains without water, and clouds tossed with whirlwinds, to whom the mist of darkness is reserved."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "superba enim vanitatis loquentes pellicent in desideriis carnis luxuriae eos qui paululum effugiunt qui in errore conversantur"
      en: "For, speaking proud words of vanity, they allure by the desires of fleshly riotousness, those who for a little while escape, such as converse in error:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "libertatem illis promittentes cum ipsi servi sint corruptionis a quo enim quis superatus est huius et servus est"
      en: "Promising them liberty, whereas they themselves are the slaves of corruption. For by whom a man is overcome, of the same also he is the slave."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "si enim refugientes coinquinationes mundi in cognitione Domini nostri et salvatoris Iesu Christi his rursus inpliciti superantur facta sunt eis posteriora deteriora prioribus"
      en: "For if, flying from the pollutions of the world, through the knowledge of our Lord and Saviour Jesus Christ, they be again entangled in them and overcome: their latter state is become unto them worse than the former."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "melius enim erat illis non cognoscere viam iustitiae quam post agnitionem retrorsum converti ab eo quod illis traditum est sancto mandato"
      en: "For it had been better for them not to have known the way of justice, than after they have known it, to turn back from that holy commandment which was delivered to them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "contigit enim eis illud veri proverbii canis reversus ad suum vomitum et sus lota in volutabro luti"
      en: "For, that of the true proverb has happened to them: The dog is returned to his vomit: and, The sow that was washed, to her wallowing in the mire."
    status: { la: verified, en: verified }
