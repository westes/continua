book: ezek
chapter: 21
verses:
  - n: 1
    text:
      la: "et factus est sermo Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fili hominis pone faciem tuam ad Hierusalem et stilla ad sanctuaria et propheta contra humum Israhel"
      en: "Son of man, set thy face toward Jerusalem, and let thy speech flow towards the holy places, and prophesy against the land of Israel:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dices terrae Israhel haec dicit Dominus Deus ecce ego ad te et eiciam gladium meum de vagina sua et occidam in te iustum et impium"
      en: "And say to the land of Israel: Thus saith the Lord God: Behold I come against thee, and I will draw forth my sword out of its sheath, and will cut off in thee the just, and the wicked."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "pro eo autem quod occidi in te iustum et impium idcirco egredietur gladius meus de vagina sua ad omnem carnem ab austro ad aquilonem"
      en: "And forasmuch as I have cut off in thee the just, and the wicked, therefore shall my sword go forth out of its sheath against all flesh, from the south even to the north."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut sciat omnis caro quia ego Dominus eduxi gladium meum de vagina sua inrevocabilem"
      en: "That all flesh may know that I the Lord have drawn my sword out of its sheath not to be turned back."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et tu fili hominis ingemesce in contritione lumborum et in amaritudinibus ingemesce coram eis"
      en: "And thou, son of man, mourn with the breaking of thy loins, and with bitterness sigh before them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cumque dixerint ad te quare tu gemis dices pro auditu quia venit et tabescet omne cor et dissolventur universae manus et infirmabitur omnis spiritus et per cuncta genua fluent aquae ecce venit et fiet ait Dominus Deus"
      en: "And when they shall say to thee: Why mournest thou? thou shalt say: For that which I hear: because it cometh, and every heart shall melt, and all hands shall be made feeble, and every spirit shall faint, and water shall run down every knee: behold it cometh, and it shall be done, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et factus est sermo Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "fili hominis propheta et dices haec dicit Dominus Deus loquere gladius gladius exacutus est et limatus"
      en: "Son of man, prophesy, and say: Thus saith the Lord God: Say: The sword, the sword is sharpened, and furbished."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut caedat victimas exacutus est ut splendeat limatus est qui moves sceptrum filii mei succidisti omne lignum"
      en: "It is sharpened to kill victims: it is furbished that it may glitter: thou removest the sceptre of my son, thou hast cut down every tree."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dedi eum ad levigandum ut teneatur manu iste exacutus est gladius et iste limatus ut sit in manu interficientis"
      en: "And I have given it to be furbished, that it may be handled: this sword is sharpened, and it is furbished, that it may be in the hand of the slayer."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "clama et ulula fili hominis quia hic factus est in populo meo hic in cunctis ducibus Israhel qui fugerant gladio traditi sunt cum populo meo idcirco plaude super femur"
      en: "Cry, and howl, 0 son of man, for this sword is upon my people, it is upon all the princes of Israel, that are fled: they are delivered up to the sword with my people, strike therefore upon thy thigh,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quia probatus est et hoc cum sceptrum subverterit et non erit dicit Dominus Deus"
      en: "Because it is tried: and that when it shall overthrow the sceptre, and it shall not be, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tu ergo fili hominis propheta et percute manu ad manum et duplicetur gladius ac triplicetur gladius interfectorum hic est gladius occisionis magnae qui obstupescere eos facit"
      en: "Thou therefore, O son of man, prophesy, and strike thy hands together, and let the sword be doubled, and let the sword of the slain be tripled: this is the sword of a great slaughter, that maketh them stand amazed,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et corde tabescere et multiplicat ruinas in omnibus portis eorum dedi conturbationem gladii acuti et limati ad fulgendum amicti ad caedem"
      en: "And languish in heart, and that multiplieth ruins. In all their gates I have set the dread of the sharp sword, the sword that is furbished to glitter, that is made ready for slaughter."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "exacuere vade ad dextram sive ad sinistram quocumque faciei tuae est appetitus"
      en: "Be thou sharpened, go to the right hand, or to the left, which way soever thou hast a mind to set thy face."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quin et ego plaudam manu ad manum et implebo indignationem meam ego Dominus locutus sum"
      en: "And I will clap my hands together, and will satisfy my indignation: I the Lord have spoken."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et factus est sermo Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et tu fili hominis pone tibi duas vias ut veniat gladius regis Babylonis de terra una egredientur ambo et manu capiet coniecturam in capite viae civitatis coniciet"
      en: "And thou son of man, set thee two ways, for the sword of the king of Babylon to come: both shall come forth out of one land: and with his hand he shall draw lots, he shall consult at the head of the way of the city."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "viam pones ut veniat gladius ad Rabbath filiorum Ammon et ad Iudam in Hierusalem munitissimam"
      en: "Thou shalt make a way that the sword may come to Rabbath of the children of Ammon, and to Juda unto Jerusalem the strong city."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "stetit enim rex Babylonis in bivio in capite duarum viarum divinationem quaerens commiscens sagittas interrogavit idola exta consuluit"
      en: "For the king of Babylon stood in the highway, at the head of two ways, seeking divination, shuffling arrows: he inquired of the idols, and consulted entrails."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ad dextram eius facta est divinatio super Hierusalem ut ponat arietes ut aperiat os in caede ut elevet vocem in ululatu ut ponat arietes contra portas ut conportet aggerem ut aedificet munitiones"
      en: "On his right hand was the divination for Jerusalem, to set battering rams, to open the mouth in slaughter, to lift up the voice in howling, to set engines against the gates, to cast up a mount, to build forts."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "eritque quasi consulens frustra oraculum in oculis eorum et sabbatorum otium imitans ipse autem recordabitur iniquitatis ad capiendum"
      en: "And he shall be in their eyes as one consulting the oracle in vain, and imitating the leisure of sabbaths: but he will call to remembrance the iniquity that they may be taken."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "idcirco haec dicit Dominus Deus pro eo quod recordati estis iniquitatis vestrae et revelastis praevaricationes vestras et apparuerunt peccata vestra in omnibus cogitationibus vestris pro eo inquam quod recordati estis manu capiemini"
      en: "Therefore thus saith the Lord God: Because you have remembered your iniquity, and have discovered your prevarications, and your sins have appeared in all your devices: because, I say, you have remembered, you shall be taken with the hand."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "tu autem profane impie dux Israhel cuius venit dies in tempore iniquitatis praefinita"
      en: "But thou profane wicked prince of Israel, whose day is come that hath been appointed in the time of iniquity:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "haec dicit Dominus Deus aufer cidarim tolle coronam nonne haec est quae humilem sublevavit et sublimem humiliavit"
      en: "Thus saith the Lord God: Remove the diadem, take off the crown: is it not this that hath exalted the low one, and brought down him that was high?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "iniquitatem iniquitatem iniquitatem ponam eam et hoc nunc factum est donec veniret cuius est iudicium et tradam ei"
      en: "I will shew it to be iniquity, iniquity, iniquity: but this was not done till he came to whom judgment belongeth, and I will give it him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et tu fili hominis propheta et dic haec dicit Dominus Deus ad filios Ammon et ad obprobrium eorum et dices mucro mucro evaginate ad occidendum limate ut interficias et fulgeas"
      en: "And thou son of man, prophesy, and say: Thus saith the Lord God concerning the children of Ammon, and concerning their reproach, and thou shalt say: sword, O sword, come out of the scabbard to kill, be furbished to destroy, and to glitter,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "cum tibi viderentur vana et divinarentur mendacia ut dareris super colla vulneratorum impiorum quorum venit dies in tempore iniquitatis praefinita"
      en: "Whilst they see vain things in thy regard, and they divine lies: to bring thee upon the necks of the wicked that are wounded, whose appointed day is come in the time of iniquity."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "revertere ad vaginam tuam in loco in quo creatus es in terra nativitatis tuae iudicabo te"
      en: "Return into thy sheath. I will judge thee in the place wherein thou wast created, in the land of thy nativity."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et effundam super te indignationem meam in igne furoris mei sufflabo in te daboque te in manus hominum insipientium et fabricantium interitum"
      en: "And I will pour out upon thee my indignation: in the fire of my rage will I blow upon thee, and will give thee into the hands of men that are brutish and contrive thy destruction."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "igni eris cibus sanguis tuus erit in medio terrae oblivioni traderis quia ego Dominus locutus sum"
      en: "Thou shalt be fuel for the fire, thy blood shall be in the midst of the land, thou shalt be forgotten: for I the Lord have spoken it."
    status: { la: verified, en: verified }
