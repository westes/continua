# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 14
verses:
  - n: 1
    text:
      la: "Factum est autem Iconii, ut simul introirent in synagogam Judaeorum, et loquerentur, ita ut crederet Judaeorum et Graecorum copiosa multitudo."
      en: "And it came to pass in Iconium, that they entered together into the synagogue of the Jews, and so spoke that a very great multitude both of the Jews and of the Greeks did believe."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Qui vero increduli fuerunt Judaei, suscitaverunt, et ad iracundiam concitaverunt animas gentium adversus fratres."
      en: "But the unbelieving Jews stirred up and incensed the minds of the Gentiles against the brethren."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Multo igitur tempore demorati sunt, fiducialiter agentes in Domino, testimonium perhibente verbo gratiae suae, dante signa et prodigia fieri per manus eorum."
      en: "A long time therefore they abode there, dealing confidently in the Lord, who gave testimony to the word of his grace, granting signs and wonders to be done by their hands."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Divisa est autem multitudo civitatis: et quidam quidem erant cum Judaeis, quidam vero cum Apostolis."
      en: "And the multitude of the city was divided; and some of them indeed held with the Jews, but some with the apostles."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cum autem factus esset impetus gentilium et Judaeorum cum principibus suis, ut contumeliis afficerent, et lapidarent eos,"
      en: "And when there was an assault made by the Gentiles and the Jews with their rulers, to use them contumeliously, and to stone them:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "intelligentes confugerunt ad civitates Lycaoniae Lystram, et Derben, et universam in circuitu regionem, et ibi evangelizantes erant."
      en: "They understanding it, fled to Lystra, and Derbe, cities of Lycaonia, and to the whole country round about, and were there preaching the gospel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et quidam vir Lystris infirmus pedibus sedebat, claudus ex utero matris suae, qui numquam ambulaverat."
      en: "And there sat a certain man at Lystra, impotent in his feet, a cripple from his mother's womb, who never had walked."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Hic audivit Paulum loquentem. Qui intuitus eum, et videns quia fidem haberet ut salvus fieret,"
      en: "This same heard Paul speaking. Who looking upon him, and seeing that he had faith to be healed,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixit magna voce: Surge super pedes tuos rectus. Et exilivit, et ambulabat."
      en: "Said with a loud voice: Stand upright on thy feet. And he leaped up, and walked."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Turbae autem cum vidissent quod fecerat Paulus, levaverunt vocem suam lycaonice, dicentes: Dii similes facti hominibus, descenderunt ad nos."
      en: "And when the multitudes had seen what Paul had done, they lifted up their voice in the Lycaonian tongue, saying: The gods are come down to us in the likeness of men;"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et vocabant Barnabam Jovem, Paulum vero Mercurium: quoniam ipse erat dux verbi."
      en: "And they called Barnabas, Jupiter: but Paul, Mercury; because he was chief speaker."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sacerdos quoque Jovis, qui erat ante civitatem, tauros, et coronas ante januas afferens, cum populis volebat sacrificare."
      en: "The priest also of Jupiter that was before the city, bringing oxen and garlands before the gate, would have offered sacrifice with the people."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quod ubi audierunt Apostoli, Barnabas et Paulus, conscissis tunicis suis exilierunt in turbas clamantes,"
      en: "Which, when the apostles Barnabas and Paul had heard, rending their clothes, they leaped out among the people, crying,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dicentes: Viri, quid haec facitis? et nos mortales sumus, similes vobis homines, annuntiantes vobis ab his vanis converti ad Deum vivum, qui fecit caelum, et terram, et mare, et omnia quae in eis sunt:"
      en: "And saying: Ye men, why do ye these things? We also are mortals, men like unto you, preaching to you to be converted from these vain things, to the living God, who made the heaven, and the earth, and the sea, and all things that are in them:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui in praeteritis generationibus dimisit omnes gentes ingredi vias suas."
      en: "Who in times past suffered all nations to walk in their own ways."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et quidem non sine testimonio semetipsum reliquit benefaciens de caelo, dans pluvias et tempora fructifera, implens cibo et laetitia corda nostra."
      en: "Nevertheless he left not himself without testimony, doing good from heaven, giving rains and fruitful seasons, filling our hearts with food and gladness."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et haec dicentes, vix sedaverunt turbas ne sibi immolarent."
      en: "And speaking these things, they scarce restrained the people from sacrificing to them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Supervenerunt autem quidam ab Antiochia et Iconio Judaei: et persuasis turbis, lapidantesque Paulum, traxerunt extra civitatem, existimantes eum mortuum esse."
      en: "Now there came thither certain Jews from Antioch, and Iconium: and persuading the multitude, and stoning Paul, drew him out of the city, thinking him to be dead."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Circumdantibus autem eum discipulis, surgens intravit civitatem, et postera die profectus est cum Barnaba in Derben."
      en: "But as the disciples stood round about him, he rose up and entered into the city, and the next day he departed with Barnabas to Derbe."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cumque evangelizassent civitati illi, et docuissent multos, reversi sunt Lystram, et Iconium, et Antiochiam,"
      en: "And when they had preached the gospel to that city, and had taught many, they returned again to Lystra, and to Iconium, and to Antioch:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "confirmantes animas discipulorum, exhortantesque ut permanerent in fide: et quoniam per multas tribulationes oportet nos intrare in regnum Dei."
      en: "Confirming the souls of the disciples, and exhorting them to continue in the faith: and that through many tribulations we must enter into the kingdom of God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et cum constituissent illis per singulas ecclesias presbyteros, et orassent cum jejunationibus, commendaverunt eos Domino, in quem crediderunt."
      en: "And when they had ordained to them priests in every church, and had prayed with fasting, they commended them to the Lord, in whom they believed."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Transeuntesque Pisidiam, venerunt in Pamphyliam,"
      en: "And passing through Pisidia, they came into Pamphylia."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et loquentes verbum Domini in Perge, descendeunt in Attaliam:"
      en: "And having spoken the word of the Lord in Perge, they went down into Attalia:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et inde navigaverunt Antiochiam, unde erant traditi gratiae Dei in opus quod compleverunt."
      en: "And thence they sailed to Antioch, from whence they had been delivered to the grace of God, unto the work which they accomplished."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Cum autem venissent, et congregassent ecclesiam, retulerunt quanta fecisset Deus cum illis, et quia aperuisset gentibus ostium fidei."
      en: "And when they were come, and had assembled the church, they related what great things God had done with them, and how he had opened the door of faith to the Gentiles."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Morati sunt autem tempus non modicum cum discipulis."
      en: "And they abode no small time with the disciples."
    status: { la: verified, en: verified }
