# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 10
verses:
  - n: 1
    text:
      la: "Et convocatis duodecim discipulis suis, dedit illis potestatem spirituum immundorum, ut ejicerent eos, et curarent omnem languorem, et omnem infirmitatem."
      en: "And having called his twelve disciples together, he gave them power over unclean spirits, to cast them out, and to heal all manner of diseases, and all manner of infirmities."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Duodecim autem Apostolorum nomina sunt haec. Primus, Simon, qui dicitur Petrus: et Andreas frater ejus,"
      en: "And the names of the twelve apostles are these: The first, Simon who is called Peter, and Andrew his brother,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Jacobus Zebedaei, et Joannes frater ejus, Philippus, et Bartholomaeus, Thomas, et Matthaeus publicanus, Jacobus Alphaei, et Thaddaeus,"
      en: "James the son of Zebedee, and John his brother, Philip and Bartholomew, Thomas and Matthew the publican, and James the son of Alpheus, and Thaddeus,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Simon Chananaeus, et Judas Iscariotes, qui et tradidit eum."
      en: "Simon the Cananean, and Judas Iscariot, who also betrayed him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Hos duodecim misit Jesus, praecipiens eis, dicens: In viam gentium ne abieritis, et in civitates Samaritanorum ne intraveritis:"
      en: "These twelve Jesus sent: commanding them, saying: Go ye not into the way of the Gentiles, and into the city of the Samaritans enter ye not."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sed potius ite ad oves quae perierunt domus Israel."
      en: "But go ye rather to the lost sheep of the house of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Euntes autem praedicate, dicentes: Quia appropinquavit regnum caelorum."
      en: "And going, preach, saying: The kingdom of heaven is at hand."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Infirmos curate, mortuos suscitate, leprosos mundate, daemones ejicite: gratis accepistis, gratis date."
      en: "Heal the sick, raise the dead, cleanse the lepers, cast out devils: freely have you received, freely give."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nolite possidere aurum, neque argentum, neque pecuniam in zonis vestris:"
      en: "Do not possess gold, nor silver, nor money in your purses:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "non peram in via, neque duas tunicas, neque calceamenta, neque virgam: dignus enim est operarius cibo suo."
      en: "Nor scrip for your journey, nor two coats, nor shoes, nor a staff; for the workman is worthy of his meat."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In quamcumque autem civitatem aut castellum intraveritis, interrogate, quis in ea dignus sit: et ibi manete donec exeatis."
      en: "And into whatsoever city or town you shall enter, inquire who in it is worthy, and there abide till you go thence."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Intrantes autem in domum, salutate eam, dicentes: Pax huic domui."
      en: "And when you come into the house, salute it, saying: Peace be to this house."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et siquidem fuerit domus illa digna, veniet pax vestra super eam: si autem non fuerit digna, pax vestra revertetur ad vos."
      en: "And if that house be worthy, your peace shall come upon it; but if it be not worthy, your peace shall return to you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et quicumque non receperit vos, neque audierit sermones vestros: exeunte foras de domo, vel civitate, excutite pulverem de pedibus vestris."
      en: "And whosoever shall not receive you, nor hear your words: going forth out of that house or city shake off the dust from your feet."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Amen dico vobis: Tolerabilius erit terrae Sodomorum et Gomorrhaeorum in die judicii, quam illi civitati."
      en: "Amen I say to you, it shall be more tolerable for the land of Sodom and Gomorrha in the day of judgment, than for that city."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ecce ego mitto vos sicut oves in medio luporum. Estote ergo prudentes sicut serpentes, et simplices sicut columbae."
      en: "Behold I send you as sheep in the midst of wolves. Be ye therefore wise as serpents and simple as doves."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cavete autem ab hominibus. Tradent enim vos in conciliis, et in synagogis suis flagellabunt vos:"
      en: "But beware of men. For they will deliver you up in councils, and they will scourge you in their synagogues."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ad praesides, et ad reges ducemini propter me in testimonium illis, et gentibus."
      en: "And you shall be brought before governors, and before kings for my sake, for a testimony to them and to the Gentiles:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cum autem tradent vos, nolite cogitare quomodo, aut quid loquamini: dabitur enim vobis in illa hora, quid loquamini:"
      en: "But when they shall deliver you up, take no thought how or what to speak: for it shall be given you in that hour what to speak."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "non enim vos estis qui loquimini, sed Spiritus Patris vestri, qui loquitur in vobis."
      en: "For it is not you that speak, but the Spirit of your Father that speaketh in you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Tradet autem frater fratrem in mortem, et pater filium: et insurgent filii in parentes, et morte eos afficient:"
      en: "The brother also shall deliver up the brother to death, and the father the son: and the children shall rise up against their parents, and shall put them to death."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et eritis odio omnibus propter nomen meum: qui autem perseveraverit usque in finem, hic salvus erit."
      en: "And you shall be hated by all men for my name's sake: but he that shall persevere unto the end, he shall be saved."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cum autem persequentur vos in civitate ista, fugite in aliam. Amen dico vobis, non consummabitis civitates Israel, donec veniat Filius hominis."
      en: "And when they shall persecute you in this city, flee into another. Amen I say to you, you shall not finish all the cities of Israel, till the Son of man come."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Non est discipulus super magistrum, nec servus super dominum suum:"
      en: "The disciple is not above the master, nor the servant above his lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sufficit discipulo ut sit sicut magister ejus, et servo, sicut dominus ejus. Si patremfamilias Beelzebub vocaverunt, quanto magis domesticos ejus?"
      en: "It is enough for the disciple that he be as his master, and the servant as his lord. If they have called the goodman of the house Beelzebub, how much more them of his household?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ne ergo timueritis eos. Nihil enim est opertum, quod non revelabitur: et occultum, quod non scietur."
      en: "Therefore fear them not. For nothing is covered that shall not be revealed: nor hid, that shall not be known."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quod dico vobis in tenebris, dicite in lumine: et quod in aure auditis, praedicate super tecta."
      en: "That which I tell you in the dark, speak ye in the light: and that which you hear in the ear, preach ye upon the housetops."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et nolite timere eos qui occidunt corpus, animam autem non possunt occidere: sed potius timete eum, qui potest et animam et corpus perdere in gehennam."
      en: "And fear ye not them that kill the body, and are not able to kill the soul: but rather fear him that can destroy both soul and body in hell."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Nonne duo passeres asse veneunt? et unus ex illis non cadet super terram sine Patre vestro."
      en: "Are not two sparrows sold for a farthing? and not one of them shall fall on the ground without your Father."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Vestri autem capilli capitis omnes numerati sunt."
      en: "But the very hairs of your head are all numbered."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Nolite ergo timere: multis passeribus meliores estis vos."
      en: "Fear not therefore: better are you than many sparrows."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Omnis ergo qui confitebitur me coram hominibus, confitebor et ego eum coram Patre meo, qui in caelis est."
      en: "Every one therefore that shall confess me before men, I will also confess him before my Father who is in heaven."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Qui autem negaverit me coram hominibus, negabo et ego eum coram Patre meo, qui in caelis est."
      en: "But he that shall deny me before men, I will also deny him before my Father who is in heaven."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Nolite arbitrari quia pacem venerim mittere in terram: non veni pacem mittere, sed gladium:"
      en: "Do not think that I came to send peace upon earth: I came not to send peace, but the sword."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "veni enim separare hominem adversus patrem suum, et filiam adversus matrem suam, et nurum adversus socrum suam:"
      en: "For I came to set a man at variance against his father, and the daughter against her mother, and the daughter in law against her mother in law."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et inimici hominis, domestici ejus."
      en: "And a man's enemies shall be they of his own household."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Qui amat patrem aut matrem plus quam me, non est me dignus: et qui amat filium aut filiam super me, non est me dignus."
      en: "He that loveth father or mother more than me, is not worthy of me; and he that loveth son or daughter more than me, is not worthy of me."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et qui non accipit crucem suam, et sequitur me, non est me dignus."
      en: "And he that taketh not up his cross, and followeth me, is not worthy of me."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Qui invenit animam suam, perdet illam: et qui perdiderit animan suam propter me, inveniet eam."
      en: "He that findeth his life, shall lose it: and he that shall lose his life for me, shall find it."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Qui recipit vos, me recipit: et qui me recipit, recipit eum qui me misit."
      en: "He that receiveth you, receiveth me: and he that receiveth me, receiveth him that sent me."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Qui recipit prophetam in nomine prophetae, mercedem prophetae accipiet: et qui recipit justum in nomine justi, mercedem justi accipiet."
      en: "He that receiveth a prophet in the name of a prophet, shall receive the reward of a prophet: and he that receiveth a just man in the name of a just man, shall receive the reward of a just man."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et quicumque potum dederit uni ex minimis istis calicem aquae frigidae tantum in nomine discipuli: amen dico vobis, non perdet mercedem suam."
      en: "And whosoever shall give to drink to one of these little ones a cup of cold water only in the name of a disciple, amen I say to you, he shall not lose his reward."
    status: { la: verified, en: verified }
