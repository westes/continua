# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: heb
chapter: 7
verses:
  - n: 1
    text:
      la: "Hic enim Melchisedech, rex Salem, sacerdos Dei summi, qui obviavit Abrahae regresso a caede regum, et benedixit ei:"
      en: "For this Melchisedech was king of Salem, priest of the most high God, who met Abraham returning from the slaughter of the kings, and blessed him:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cui et decimas omnium divisit Abraham: primum quidem qui interpretatur rex justitiae: deinde autem et rex Salem, quod est, rex pacis,"
      en: "To whom also Abraham divided the tithes of all: who first indeed by interpretation, is king of justice: and then also king of Salem, that is, king of peace:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sine patre, sine matre, sine genealogia, neque initium dierum, neque finem vitae habens, assimilatus autem Filio Dei, manet sacerdos in perpetuum."
      en: "Without father, without mother, without genealogy, having neither beginning of days nor end of life, but likened unto the Son of God, continueth a priest for ever."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Intuemini autem quantus sit hic, cui et decimas dedit de praecipuis Abraham patriarcha."
      en: "Now consider how great this man is, to whom also Abraham the patriarch gave tithes out of the principal things."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et quidem de filiis Levi sacerdotium accipientes, mandatum habent decimas sumere a populo secundum legem, id est, a fratribus suis: quamquam et ipsi exierint de lumbis Abrahae."
      en: "And indeed they that are of the sons of Levi, who receive the priesthood, have a commandment to take tithes of the people according to the law, that is to say, of their brethren: though they themselves also came out of the loins of Abraham."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cujus autem generatio non annumeratur in eis, decimas sumpsit ab Abraham, et hunc, qui habebat repromissiones, benedixit."
      en: "But he, whose pedigree is not numbered among them, received tithes of Abraham, and blessed him that had the promises."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sine ulla autem contradictione, quod minus est, a meliore benedicitur."
      en: "And without all contradiction, that which is less, is blessed by the better."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et hic quidem, decimas morientes homines accipiunt: ibi autem contestatur, quia vivit."
      en: "And here indeed, men that die, receive thithes: but there he hath witness, that he liveth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ( ut ita dictum sit) per Abraham, et Levi, qui decimas accepit, decimatus est:"
      en: "And (as it may be said) even Levi who received tithes, paid tithes in Abraham:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "adhuc enim in lumbis patris erat, quando obviavit ei Melchisedech."
      en: "For he was yet in the loins of his father, when Melchisedech met him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Si ergo consummatio per sacerdotium Leviticum erat ( populus enim sub ipso legem accepit) quid adhuc necessarium fuit secundum ordinem Melchisedech, alium surgere sacerdotem, et non secundum ordinem Aaron dici?"
      en: "If then perfection was by the Levitical priesthood, (for under it the people received the law,) what further need was there that another priest should rise according to the order of Melchisedech, and not be called according to the order of Aaron?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Translato enim sacerdotio, necesse erat ut et legis translatio fiat."
      en: "For the priesthood being translated, it is necessary that a translation also be made of the law."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In quo enim haec dicuntur, de alia tribu est, de qua nullus altari praesto fuit."
      en: "For he, of whom these things are spoken, is of another tribe, of which no one attended on the altar."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Manifestum est enim quod ex Juda ortus sit Dominus noster: in qua tribu nihil de sacerdotibus Moyses locutus est."
      en: "For it is evident that our Lord sprung out of Juda: in which tribe Moses spoke nothing concerning priests."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et amplius adhuc manifestum est: si secundum similitudinem Melchisedech exsurgat alius sacerdos,"
      en: "And it is yet far more evident: if according to the similitude of Melchisedech there ariseth another priest,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "qui non secundum legem mandati carnalis factus est, sed secundum virtutem vitae insolubilis."
      en: "Who is made not according to the law of a carnal commandment, but according to the power of an indissoluble life:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Contestatur enim: Quoniam tu es sacerdos in aeternum, secundum ordinem Melchisedech."
      en: "For he testifieth: Thou art a priest for ever, according to the order of Melchisedech."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Reprobatio quidem fit praecedentis mandati, propter infirmitatem ejus, et inutilitatem:"
      en: "There is indeed a setting aside of the former commandment, because of the weakness and unprofitableness thereof:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nihil enim ad perfectum adduxit lex: introductio vero melioris spei, per quam proximamus ad Deum."
      en: "(For the law brought nothing to perfection,) but a bringing in of a better hope, by which we draw nigh to God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et quantum est non sine jurejurando ( alii quidem sine jurejurando sacerdotes facti sunt,"
      en: "And inasmuch as it is not without an oath, (for the others indeed were made priests without an oath;"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "hic autem cum jurejurando per eum, qui dixit ad illum: Juravit Dominus, et non poenitebit eum: tu es sacerdos in aeternum):"
      en: "But this with an oath, by him that said unto him: The Lord hath sworn, and he will not repent, Thou art a priest for ever.)"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "in tantum melioris testamenti sponsor factus est Jesus."
      en: "By so much is Jesus made a surety of a better testament."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et alii quidem plures facti sunt sacerdotes, idcirco quod morte prohiberentur permanere:"
      en: "And the others indeed were made many priests, because by reason of death they were not suffered to continue:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "hic autem eo quod maneat in aeternum, sempiternum habet sacerdotium."
      en: "But this, for that he continueth for ever, hath an everlasting priesthood,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Unde et salvare in perpetuum potest accedentes per semetipsum ad Deum: semper vivens ad interpellandum pro nobis."
      en: "Whereby he is able also to save for ever them that come to God by him; always living to make intercession for us."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Talis enim decebat ut nobis esset pontifex, sanctus, innocens, impollutus, segregatus a peccatoribus, et excelsior caelis factus:"
      en: "For it was fitting that we should have such a high priest, holy, innocent, undefiled, separated from sinners, and made higher than the heavens;"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui non habet necessitatem quotidie, quemadmodum sacerdotes, prius pro suis delictis hostias offerre, deinde pro populi: hoc enim fecit semel, seipsum offerendo."
      en: "Who needeth not daily (as the other priests) to offer sacrifices first for his own sins, and then for the people's: for this he did once, in offering himself."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Lex enim homines constituit sacerdotes infirmitatem habentes: sermo autem jurisjurandi, qui post legem est, Filium in aeternum perfectum."
      en: "For the law maketh men priests, who have infirmity: but the word of the oath, which was since the law, the Son who is perfected for evermore."
    status: { la: verified, en: verified }
