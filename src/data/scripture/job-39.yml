# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 39
verses:
  - n: 1
    text:
      la: "numquid nosti tempus partus hibicum in petris vel parturientes cervas observasti"
      en: "Knowest thou the time when the wild goats bring forth among the rocks, or hast thou observed the hinds when they fawn?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dinumerasti menses conceptus earum et scisti tempus partus earum"
      en: "Hast thou numbered the months of their conceiving, or knowest thou the time when they bring forth?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "incurvantur ad fetum et pariunt et rugitus emittunt"
      en: "They bow themselves to bring forth young, and they cast them, and send forth roarings."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "separantur filii earum pergunt ad pastum egrediuntur et non revertuntur ad eas"
      en: "Their young are weaned and go to feed : they go forth, and return not to them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quis dimisit onagrum liberum et vincula eius quis solvit"
      en: "Who hath sent out the wild ass free, and who hath loosed his bonds?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cui dedi in solitudine domum et tabernacula eius in terra salsuginis"
      en: "To whom I have given a house in the wilderness, and his dwellings in the barren land."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "contemnit multitudinem civitatis clamorem exactoris non audit"
      en: "He scorneth the multitude of the city, he heareth not the cry of the driver."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "circumspicit montes pascuae suae et virentia quaeque perquirit"
      en: "He looketh round about the mountains of his pasture, and seeketh for every green thing."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "numquid volet rinoceros servire tibi aut morabitur ad praesepe tuum"
      en: "Shall the rhinoceros be willing to serve thee, or will he stay at thy crib?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "numquid alligabis rinocerota ad arandum loro tuo aut confringet glebas vallium post te"
      en: "Canst thou bind the rhinoceros with thy thong to plough, or will he break the clods of the valleys after thee?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "numquid fiduciam habebis in magna fortitudine eius et derelinques ei labores tuos"
      en: "Wilt thou have confidence in his great strength, and leave thy labours to him?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "numquid credes ei quoniam reddat sementem tibi et aream tuam congreget"
      en: "Wilt thou trust him that he will render thee the seed, and gather it into thy barnfloor?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "pinna strutionum similis est pinnis herodii et accipitris"
      en: "The wing of the ostrich is like the wings of the heron, and of the hawk."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quando derelinquit in terra ova sua tu forsitan in pulvere calefacis ea"
      en: "When she leaveth her eggs on the earth, thou perhaps wilt warm them in the dust."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "obliviscitur quod pes conculcet ea aut bestiae agri conterant"
      en: "She forgetteth that the foot may tread upon them, or that the beasts of the field may break them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "duratur ad filios suos quasi non sint sui frustra laboravit nullo timore cogente"
      en: "She is hardened against her young ones, as though they were not hers, she hath laboured in vain, no fear constraining her."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "privavit enim eam Deus sapientia nec dedit illi intellegentiam"
      en: "For God hath deprived her of wisdom, neither hath he given her understanding."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cum tempus fuerit in altum alas erigit deridet equitem et ascensorem eius"
      en: "When time shall be, she setteth up her wings on high : she scorneth the horse and his rider."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "numquid praebebis equo fortitudinem aut circumdabis collo eius hinnitum"
      en: "Wilt thou give strength to the horse, or clothe his neck with neighing?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "numquid suscitabis eum quasi lucustas gloria narium eius terror"
      en: "Wilt thou lift him up like the locusts? the glory of his nostrils is terror."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "terram ungula fodit exultat audacter in occursum pergit armatis"
      en: "He breaketh up the earth with his hoof, he pranceth boldly, he goeth forward to meet armed men."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "contemnit pavorem nec cedit gladio"
      en: "He despiseth fear, he turneth not his back to the sword,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "super ipsum sonabit faretra vibrabit hasta et clypeus"
      en: "Above him shall the quiver rattle, the spear and shield shall glitter."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "fervens et fremens sorbet terram nec reputat tubae sonare clangorem"
      en: "Chasing and raging he swalloweth the ground, neither doth he make account when the noise of the trumpet soundeth."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ubi audierit bucinam dicet va procul odoratur bellum exhortationem ducum et ululatum exercitus"
      en: "When he heareth the trumpet he saith : Ha, ha : he smelleth the battle afar off, the encouraging of the captains, and the shouting of the army."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "numquid per sapientiam tuam plumescit accipiter expandens alas suas ad austrum"
      en: "Doth the hawk wax feathered by thy wisdom, spreading her wings to the south?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "aut ad praeceptum tuum elevabitur aquila et in arduis ponet nidum suum"
      en: "Will the eagle mount up at thy command, and make her nest in high places?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "in petris manet et in praeruptis silicibus commoratur atque inaccessis rupibus"
      en: "She abideth among the rocks, and dwelleth among cragged flints, and stony hills, where there is no access."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "inde contemplatur escam et de longe oculi eius prospiciunt"
      en: "From thence she looketh for the prey, and her eyes behold afar off."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "pulli eius lambent sanguinem et ubicumque cadaver fuerit statim adest"
      en: "Her young ones shall suck up blood : and wheresoever the carcass shall be, she is immediately there."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et adiecit Dominus et locutus est ad Iob"
      en: "And the Lord went on, and said to Job :"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "numquid qui contendit cum Deo tam facile conquiescit utique qui arguit Deum debet respondere ei"
      en: "Shall he that contendeth with God be so easily silenced? surely he that reproveth God, ought to answer him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "respondens autem Iob Domino dixit"
      en: "Then Job answered the Lord, and said :"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "qui leviter locutus sum respondere quid possum manum meam ponam super os meum"
      en: "One thing I have spoken, which I wish I had not said : and another, to which I will add no more."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "unum locutus sum quod utinam non dixissem et alterum quibus ultra non addam"
      en: ""
    status: { la: verified, en: missing }
