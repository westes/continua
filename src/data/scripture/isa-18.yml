# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 18
verses:
  - n: 1
    text:
      la: "Vae terrae cymbalo alarum, quae est trans flumina Aethiopiae,"
      en: "Woe to the land, the winged cymbal, which is beyond the rivers of Ethiopia,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui mittit in mare legatos, et in vasis papyri super aquas. Ite, angeli veloces, ad gentem convulsam et dilaceratam; ad populum terribilem, post quem non est alius; ad gentem exspectantem et conculcatam, cujus diripuerunt flumina terram ejus."
      en: "That sendeth ambassadors by the sea, and in vessels of bulrushes upon the waters. Go, ye swift angels, to a nation rent and torn in pieces: to a terrible people, after which there is no other: to a nation expecting and trodden under foot, whose land the rivers have spoiled."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Omnes habitatores orbis, qui moramini in terra, cum elevatum fuerit signum in montibus, videbitis, et clangorem tubae audietis."
      en: "All ye inhabitants of the world, who dwell on the earth, when the sign shall be lifted up on the mountains, you shall see, and you shall hear the sound of the trumpet."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quia haec dicit Dominus ad me: Quiescam et considerabo in loco meo, sicut meridiana lux clara est, et sicut nubes roris in die messis."
      en: "For thus saith the Lord to me: I will take my rest, and consider in my place, as the noon light is clear, and as a cloud of dew in the day of harvest."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ante messem enim totus effloruit, et immatura perfectio germinabit; et praecidentur ramusculi ejus falcibus, et quae derelicta fuerint abscindentur et excutientur."
      en: "For before the harvest it was all flourishing, and it shall bud without perfect ripeness, and the sprigs thereof shall be cut off with pruning hooks: and what is left shall be cut away and shaken out."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et relinquentur simul avibus montium et bestiis terrae; et aestate perpetua erunt super eum volucres, et omnes bestiae terrae super illum hiemabunt."
      en: "And they shall be left together to the birds of the mountains, and the beasts of the earth: and the fowls shall be upon them all the summer, and all the beasts of the earth shall winter upon them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "In tempore illo deferetur munus Domino exercituum a populo divulso et dilacerato, a populo terribili, post quem non fuit alius; a gente exspectante, exspectante et conculcata, cujus diripuerunt flumina terram ejus; ad locum nominis Domini exercituum, montem Sion."
      en: "At that time shall a present be brought to the Lord of hosts, from a people rent and torn in pieces: from a terrible people, after which there hath been no other: from a nation expecting, expecting and trodden under foot, whose land the rivers have spoiled, to the place of the name of the Lord of hosts, to mount Sion."
    status: { la: verified, en: verified }
