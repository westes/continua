# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 7
verses:
  - n: 1
    text:
      la: "Post haec autem ambulabat Jesus in Galilaeam: non enim volebat in Judaeam ambulare, quia quaerebant eum Judaei interficere."
      en: "After these things Jesus walked in Galilee; for he would not walk in Judea, because the Jews sought to kill him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Erat autem in proximo dies festus Judaeorum, Scenopegia."
      en: "Now the Jews' feast of tabernacles was at hand."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixerunt autem ad eum fratres ejus: Transi hinc, et vade in Judaeam, ut et discipuli tui videant opera tua, quae facis."
      en: "And his brethren said to him: Pass from hence, and go into Judea; that thy disciples also may see thy works which thou dost."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nemo quippe in occulto quid facit, et quaerit ipse in palam esse: si haec facis, manifesta teipsum mundo."
      en: "For there is no man that doth any thing in secret, and he himself seeketh to be known openly. If thou do these things, manifest thyself to the world."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Neque enim fratres ejus credebant in eum."
      en: "For neither did his brethren believe in him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dicit ergo eis Jesus: Tempus meum nondum advenit: tempus autem vestrum semper est paratum."
      en: "Then Jesus said to them: My time is not yet come; but your time is always ready."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Non potest mundus odisse vos: me autem odit, quia ego testimonium perhibeo de illo quod opera ejus mala sunt."
      en: "The world cannot hate you; but me it hateth: because I give testimony of it, that the works thereof are evil."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Vos ascendite ad diem festum hunc, ego autem non ascendo ad diem festum istum: quia meum tempus nondum impletum est."
      en: "Go you up to this festival day, but I go not up to this festival day: because my time is not accomplished."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Haec cum dixisset, ipse mansit in Galilaea."
      en: "When he had said these things, he himself stayed in Galilee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ut autem ascenderunt fratres ejus, tunc et ipse ascendit ad diem festum non manifeste, sed quasi in occulto."
      en: "But after his brethren were gone up, then he also went up to the feast, not openly, but, as it were, in secret."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Judaei ergo quaerebant eum in die festo, et dicebant: Ubi est ille?"
      en: "The Jews therefore sought him on the festival day, and said: Where is he?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et murmur multum erat in turba de eo. Quidam enim dicebant: Quia bonus est. Alii autem dicebant: Non, sed seducit turbas."
      en: "And there was much murmuring among the multitude concerning him. For some said: He is a good man. And others said: No, but he seduceth the people."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nemo tamen palam loquebatur de illo propter metum Judaeorum."
      en: "Yet no man spoke openly of him, for fear of the Jews."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Jam autem die festo mediante, ascendit Jesus in templum, et docebat."
      en: "Now about the midst of the feast, Jesus went up into the temple, and taught."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et mirabantur Judaei, dicentes: Quomodo hic litteras scit, cum non didicerit?"
      en: "And the Jews wondered, saying: How doth this man know letters, having never learned?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Respondit eis Jesus, et dixit: Mea doctrina non est mea, sed ejus qui misit me."
      en: "Jesus answered them, and said: My doctrine is not mine, but his that sent me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Si quis voluerit voluntatem ejus facere, cognoscet de doctrina, utrum ex Deo sit, an ego a meipso loquar."
      en: "If any man do the will of him; he shall know of the doctrine, whether it be of God, or whether I speak of myself."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui a semetipso loquitur, gloriam propriam quaerit; qui autem quaerit gloriam ejus qui misit eum, hic verax est, et injustitia in illo non est."
      en: "He that speaketh of himself, seeketh his own glory: but he that seeketh the glory of him that sent him, he is true, and there is no injustice in him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Nonne Moyses dedit vobis legem: et nemo ex vobis facit legem?"
      en: "Did Moses not give you the law, and yet none of you keepeth the law?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quid me quaeritis interficere? Respondit turba, et dixit: Daemonium habes: quis te quaeret interficere?"
      en: "Why seek you to kill me? The multitude answered, and said: Thou hast a devil; who seeketh to kill thee?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Respondit Jesus et dixit eis: Unum opus feci, et omnes miramini:"
      en: "Jesus answered, and said to them: One work I have done; and you all wonder:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "propterea Moyses dedit vobis circumcisionem ( non quia ex Moyse est, sed ex patribus), et in sabbato circumciditis hominem."
      en: "Therefore, Moses gave you circumcision (not because it is of Moses, but of the fathers;) and on the sabbath day you circumcise a man."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Si circumcisionem accipit homo in sabbato, ut non solvatur lex Moysi: mihi indignamini quia totum hominem sanum feci in sabbato?"
      en: "If a man receive circumcision on the sabbath day, that the law of Moses may not be broken; are you angry at me because I have healed the whole man on the sabbath day?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Nolite judicare secundum faciem, sed justum judicium judicate."
      en: "Judge not according to the appearance, but judge just judgment."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dicebant ergo quidam ex Jerosolymis: Nonne hic est, quem quaerunt interficere?"
      en: "Some therefore of Jerusalem said: Is not this he whom they seek to kill?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ecce palam loquitur, et nihil ei dicunt. Numquid vere cognoverunt principes quia hic est Christus?"
      en: "And behold, he speaketh openly, and they say nothing to him. Have the rulers known for a truth, that this is the Christ?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sed hunc scimus unde sit: Christus autem cum venerit, nemo scit unde sit."
      en: "But we know this man, whence he is: but when the Christ cometh, no man knoweth whence he is."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Clamabat ergo Jesus in templo docens, et dicens: Et me scitis, et unde sim scitis: et a meipso non veni, sed est verus qui misit me, quem vos nescitis."
      en: "Jesus therefore cried out in the temple, teaching, and saying: You both know me, and you know whence I am: and I am not come of myself; but he that sent me, is true, whom you know not."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ego scio eum: quia ab ipso sum, et ipse me misit."
      en: "I know him, because I am from him, and he hath sent me."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Quaerebant ergo eum apprehendere: et nemo misit in illum manus, quia nondum venit hora ejus."
      en: "They sought therefore to apprehend him: and no man laid hands on him, because his hour was not yet come."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "De turba autem multi crediderunt in eum, et dicebant: Christus cum venerit, numquid plura signa faciet quam quae hic facit?"
      en: "But of the people many believed in him, and said: When the Christ cometh, shall he do more miracles, than these which this man doth?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Audierunt pharisaei turbam murmurantem de illo haec: et miserunt principes et pharisaei ministros ut apprehenderent eum."
      en: "The Pharisees heard the people murmuring these things concerning him: and the rulers and Pharisees sent ministers to apprehend him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dixit ergo eis Jesus: Adhuc modicum tempus vobiscum sum: et vado ad eum qui me misit."
      en: "Jesus therefore said to them: Yet a little while I am with you: and then I go to him that sent me."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Quaeretis me, et non invenietis: et ubi ego sum, vos non potestis venire."
      en: "You shall seek me, and shall not find me: and where I am, thither you cannot come."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Dixerunt ergo Judaei ad semetipsos: Quo hic iturus est, quia non inveniemus eum? numquid in dispersionem gentium iturus est, et docturus gentes?"
      en: "The Jews therefore said among themselves: Whither will he go, that we shall not find him? will he go unto the dispersed among the Gentiles, and teach the Gentiles?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "quis est hic sermo, quem dixit: Quaeretis me, et non invenietis: et ubi sum ego, vos non potestis venire?"
      en: "What is this saying that he hath said: You shall seek me, and shall not find me; and where I am, you cannot come?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "In novissimo autem die magno festivitatis stabat Jesus, et clamabat dicens: Si quis sitit, veniat ad me et bibat."
      en: "And on the last, and great day of the festivity, Jesus stood and cried, saying: If any man thirst, let him come to me, and drink."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Qui credit in me, sicut dicit Scriptura, flumina de ventre ejus fluent aquae vivae."
      en: "He that believeth in me, as the scripture saith, Out of his belly shall flow rivers of living water."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Hoc autem dixit de Spiritu, quem accepturi erant credentes in eum: nondum enim erat Spiritus datus, quia Jesus nondum erat glorificatus."
      en: "Now this he said of the Spirit which they should receive, who believed in him: for as yet the Spirit was not given, because Jesus was not yet glorified."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Ex illa ergo turba cum audissent hos sermones ejus, dicebant: Hic est vere propheta."
      en: "Of that multitude therefore, when they had heard these words of his, some said: This is the prophet indeed."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Alii dicebant: Hic est Christus. Quidam autem dicebant: Numquid a Galilaea venit Christus?"
      en: "Others said: This is the Christ. But some said: Doth the Christ come out of Galilee?"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "nonne Scriptura dicit: Quia ex semine David, et de Bethlehem castello, ubi erat David, venit Christus?"
      en: "Doth not the scripture say: That Christ cometh of the seed of David, and from Bethlehem the town where David was?"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Dissensio itaque facta est in turba propter eum."
      en: "So there arose a dissension among the people because of him."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Quidam autem ex ipsis volebant apprehendere eum: sed nemo misit super eum manus."
      en: "And some of them would have apprehended him: but no man laid hands on him."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Venerunt ergo ministri ad pontifices et pharisaeos. Et dixerunt eis illi: Quare non adduxistis illum?"
      en: "The ministers therefore came to the chief priests and the Pharisees. And they said to them: Why have you not brought him?"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Responderunt ministri: Numquam sic locutus est homo, sicut hic homo."
      en: "The ministers answered: Never did man speak like this man."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Responderunt ergo eis pharisaei: Numquid et vos seducti estis?"
      en: "The Pharisees therefore answered them: Are you also seduced?"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "numquid ex principibus aliquis credidit in eum, aut ex pharisaeis?"
      en: "Hath any one of the rulers believed in him, or of the Pharisees?"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "sed turba haec, quae non novit legem, maledicti sunt."
      en: "But this multitude, that knoweth not the law, are accursed."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Dixit Nicodemus ad eos, ille qui venit ad eum nocte, qui unus erat ex ipsis:"
      en: "Nicodemus said to them, (he that came to him by night, who was one of them:)"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Numquid lex nostra judicat hominem, nisi prius audierit ab ipso, et cognoverit quid faciat?"
      en: "Doth our law judge any man, unless it first hear him, and know what he doth?"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Responderunt, et dixerunt ei: Numquid et tu Galilaeus es? scrutare Scripturas, et vide quia a Galilaea propheta non surgit."
      en: "They answered, and said to him: Art thou also a Galilean? Search the scriptures, and see, that out of Galilee a prophet riseth not."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Et reversi sunt unusquisque in domum suam."
      en: "And every man returned to his own house."
    status: { la: verified, en: verified }
