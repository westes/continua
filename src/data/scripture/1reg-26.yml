# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1reg
chapter: 26
verses:
  - n: 1
    text:
      la: "et venerunt Ziphei ad Saul in Gabaa dicentes ecce David absconditus est in colle Achilae quae est ex adverso solitudinis"
      en: "And the men of Ziph came to Saul in Gabaa, saying: Behold David is hid in the hill of Hachila, which is over against the wilderness."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et surrexit Saul et descendit in desertum Ziph et cum eo tria milia virorum de electis Israhel ut quaereret David in deserto Ziph"
      en: "And Saul arose, and went down to the wilderness of Ziph, having with him three thousand chosen men of Israel, to seek David in the wilderness of Ziph."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et castrametatus est Saul in Gabaa Achilae quae erat ex adverso solitudinis in via David autem habitabat in deserto videns autem quod venisset Saul post se in desertum"
      en: "And Saul encamped in Gabaa Hachila, which was over against the wilderness in the way: and David abode in the wilderness. And seeing that Saul was come after him into the wilderness,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "misit exploratores et didicit quod venisset certissime"
      en: "He sent spies, and learned that he was most certainly come thither."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et surrexit David et venit ad locum ubi erat Saul cumque vidisset locum in quo dormiebat Saul et Abner filius Ner princeps militiae eius Saulem dormientem in tentorio et reliquum vulgus per circuitum eius"
      en: "And David arose secretly, and came to the place where Saul was: and when he had beheld the place, wherein Saul slept, and Abner the son of Ner, the captain of his army, and Saul sleeping in a tent, and the rest of the multitude round about him,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ait David ad Ahimelech Cettheum et Abisai filium Sarviae fratrem Ioab dicens quis descendet mecum ad Saul in castra dixitque Abisai ego descendam tecum"
      en: "David spoke to Achimelech the Hethite, and Abisai the son of Sarvia the brother of Joab, saying: Who will go down with me to Saul into the camp? And Abisai said: I will go with thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "venerunt ergo David et Abisai ad populum nocte et invenerunt Saul iacentem et dormientem in tentorio et hastam fixam in terra ad caput eius Abner autem et populum dormientes in circuitu eius"
      en: "So David and Abisai came to the people by night, and found Saul lying and sleeping in the tent, and his spear fixed in the ground at his head: and Abner and the people sleeping round about him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixitque Abisai ad David conclusit Deus hodie inimicum tuum in manus tuas nunc ergo perfodiam eum lancea in terra semel et secundo opus non erit"
      en: "And Abisai said to David: God hath shut up thy enemy this day into thy hands: now then I will run him through with my spear even to the earth at once, and there shall be no need of a second time."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit David ad Abisai ne interficias eum quis enim extendit manum suam in christum Domini et innocens erit"
      en: "And David said to Abisai: Kill him not: for who shall put forth his hand against the Lord's anointed, and shall be guiltless?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dixit David vivit Dominus quia nisi Dominus percusserit eum aut dies eius venerit ut moriatur aut in proelium descendens perierit"
      en: "And David said: As the Lord liveth, unless the Lord shall strike him, or his day shall come to die, or he shall go down to battle and perish:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "propitius mihi sit Dominus ne extendam manum meam in christum Domini nunc igitur tolle hastam quae est ad caput eius et scyphum aquae et abeamus"
      en: "The Lord be merciful unto me, that I extend not my hand upon the Lord's anointed. But now take the spear, which is at his head, and the cup of water, and let us go."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tulit ergo David hastam et scyphum aquae qui erat ad caput Saul et abierunt et non erat quisquam qui videret et intellegeret et vigilaret sed omnes dormiebant quia sopor Domini inruerat super eos"
      en: "So David took the spear, and the cup of water which was at Saul's head, and they went away: and no man saw it, or knew it, or awaked, but they were all asleep, for a deep sleep from the Lord was fallen upon them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cumque transisset David ex adverso et stetisset in vertice montis de longe et esset grande intervallum inter eos"
      en: "And when David was gone over to the other side. and stood on the top of the hill afar off, and a good space was between them,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "clamavit David ad populum et ad Abner filium Ner dicens nonne respondebis Abner et respondens Abner ait quis es tu qui clamas et inquietas regem"
      en: "David cried to the people, and to Abner the son of Ner, saying: Wilt thou not answer, Abner? And Abner answering, said: Who art thou, that criest, and disturbest the king?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ait David ad Abner numquid non vir tu es et quis alius similis tui in Israhel quare ergo non custodisti dominum tuum regem ingressus est enim unus de turba ut interficeret regem dominum tuum"
      en: "And David said to Abner: Art not thou a man? and who is like thee in Israel? why then hast thou not kept thy lord the king? for there came one of the people in to kill the king thy lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non est bonum hoc quod fecisti vivit Dominus quoniam filii mortis estis vos qui non custodistis dominum vestrum christum Domini nunc ergo vide ubi sit hasta regis et ubi scyphus aquae qui erat ad caput eius"
      en: "This thing is not good, that thou hast done: as the Lord liveth, you are the sons of death, who have not kept your master, the Lord's anointed. And now where is the king's spear, and the cup of water, which was at his head?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cognovit autem Saul vocem David et dixit num vox tua est haec fili mi David et David vox mea domine mi rex"
      en: "And Saul knew David's voice, and said: Is this thy voice, my son David? And David said: It is my voice, my lord the king."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ait quam ob causam dominus meus persequitur servum suum quid feci aut quod est in manu mea malum"
      en: "And he said: Wherefore doth my lord persecute his servant? What have I done? or what evil is there in my hand?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nunc ergo audi oro domine mi rex verba servi tui si Dominus incitat te adversum me odoretur sacrificium si autem filii hominum maledicti sunt in conspectu Domini qui eiecerunt me hodie ut non habitem in hereditate Domini dicentes vade servi diis alienis"
      en: "Now therefore hear, I pray thee, my lord the king, the words of thy servant: If the Lord stir thee up against me, let him accept of sacrifice: but if the sons of men, they are cursed in the sight of the Lord, who have cast me out this day, that I should not dwell in the inheritance of the Lord, saying: Go, serve strange gods."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et nunc non effundatur sanguis meus in terra coram Domino quia egressus est rex Israhel ut quaerat pulicem unum sicut persequitur perdix in montibus"
      en: "And now let not my blood be shed upon the earth before the Lord: for the king of Israel is come out to seek a flea, as the partridge is hunted in the mountains."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et ait Saul peccavi revertere fili mi David nequaquam enim ultra male tibi faciam eo quod pretiosa fuerit anima mea in oculis tuis hodie apparet quod stulte egerim et ignoraverim multa nimis"
      en: "And Saul said: I have sinned, return, my son David, for I will no more do thee harm, because my life hath been precious in thy eyes this day: for it appeareth that I have done foolishly, and have been ignorant in very many things."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et respondens David ait ecce hasta regis transeat unus de pueris et tollat eam"
      en: "And David answering, said: Behold the king's spear: let one of the king's servants come over and fetch it."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dominus autem retribuet unicuique secundum iustitiam suam et fidem tradidit enim te Dominus hodie in manu mea et nolui levare manum meam in christum Domini"
      en: "And the Lord will reward every one according to his justice, and his faithfulness: for the Lord hath delivered thee this day into my hand, and I would not put forth my hand against the Lord's anointed."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et sicuti magnificata est anima tua hodie in oculis meis sic magnificetur anima mea in oculis Domini et liberet me de omni angustia"
      en: "And as thy life hath been much set by this day in my eyes, so let my life be much set by in the eyes of the Lord, and let him deliver me from all distress."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ait ergo Saul ad David benedictus tu fili mi David et quidem faciens facies et potens poteris abiit autem David in viam suam et Saul reversus est in locum suum"
      en: "Then Saul said to David: Blessed art thou, my son David: and truly doing thou shalt do, and prevailing thou shalt prevail. And David went on his way, and Saul returned to his place."
    status: { la: verified, en: verified }
