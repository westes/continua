# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 27
verses:
  - n: 1
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "loquere filiis Israhel et dices ad eos homo qui votum fecerit et spoponderit Deo animam suam sub aestimatione dabit pretium"
      en: "Speak to the children of Israel, and thou shalt say to them: The man that shall have made a vow, and promised his soul to God, shall give the price according to estimation."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si fuerit masculus a vicesimo usque ad sexagesimum annum dabit quinquaginta siclos argenti ad mensuram sanctuarii"
      en: "If it be a man from twenty years old unto sixty years old, he shall give fifty sides of silver, after the weight of the sanctuary:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si mulier triginta"
      en: "If a woman, thirty."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "a quinto autem anno usque ad vicesimum masculus dabit viginti siclos femina decem"
      en: "But from the fifth year until the twentieth, a man shall give twenty sicles: a woman ten."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ab uno mense usque ad annum quintum pro masculo dabuntur quinque sicli pro femina tres"
      en: "From one month until the fifth year. for a male shall be given five sides: for a female three."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sexagenarius et ultra masculus dabit quindecim siclos femina decem"
      en: "A man that is sixty years old or upward, shall give fifteen aisles: a woman ten."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "si pauper fuerit et aestimationem reddere non valebit stabit coram sacerdote et quantum ille aestimaverit et viderit eum posse reddere tantum dabit"
      en: "If he be poor, and not able to pay tile estimation, he shall stand before tile priest: and as much as he shall value him at, and see him able to pay, so much shall he give."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "animal autem quod immolari potest Domino si quis voverit sanctum erit"
      en: "But a beast that may be sacrificed to the Lord, if ally one shall vow, shall be holy,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et mutari non poterit id est nec melius malo nec peius bono quod si mutaverit et ipsum quod mutatum est et illud pro quo mutatum est consecratum erit Domino"
      en: "And cannot be changed, that is to say, neither a better for a worse, nor a worse for a better. And if he shall change it: both that which was changed, and that for which it was changed, shall be consecrated to the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "animal inmundum quod immolari Domino non potest si quis voverit adducetur ante sacerdotem"
      en: "An unclean beast, which cannot be sacrificed to the Lord, if my man shall vow, shall be brought before the priest:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui diiudicans utrum bonum an malum sit statuet pretium"
      en: "Who judging whether it be good or bad, shall set the price:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quod si dare voluerit is qui offert addet supra aestimationis quintam partem"
      en: "Which if he that offereth it will give, he shall add above the estimation the fifth part."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "homo si voverit domum suam et sanctificaverit Domino considerabit eam sacerdos utrum bona an mala sit et iuxta pretium quod ab eo fuerit constitutum venundabitur"
      en: "If a man shall vow his house, and sanctify it to the Lord, the priest shall consider it, whether it be good or bad, and it shall be sold according to the price, which he shall appoint."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sin autem ille qui voverat voluerit redimere eam dabit quintam partem aestimationis supra et habebit domum"
      en: "But if he that vowed, will redeem it, he shall give the fifth part of the estimation over and above, and shall have the house."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quod si agrum possessionis suae voverit et consecraverit Domino iuxta mensuram sementis aestimabitur pretium si triginta modiis hordei seritur terra quinquaginta siclis veniet argenti"
      en: "And if he vow the field of his possession, and consecrate it to the Lord, the price shall be rated according to the measure of the seed. If the ground be sowed with thirty bushels of barley, let it be sold for fifty sides of silver."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "si statim ab anno incipientis iobelei voverit agrum quanto valere potest tanto aestimabitur"
      en: "If he vow his field immediately from the year of jubilee that is beginning, as much as it may be worth, at so much it shall be rated."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sin autem post aliquantum temporis supputabit sacerdos pecuniam iuxta annorum qui reliqui sunt numerum usque ad iobeleum et detrahetur ex pretio"
      en: "But if some time after, the priest shall reckon the money according to the number of years that remain until the jubilee, and the price shall be abated."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quod si voluerit redimere agrum ille qui voverat addet quintam partem aestimatae pecuniae et possidebit eum"
      en: "And if he that had vowed, will redeem his field, he shall add the fifth part of the money of the estimation, and shall possess it."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sin autem noluerit redimere sed alteri cuilibet fuerit venundatus ultra eum qui voverat redimere non poterit"
      en: "And if he will not redeem it, but it be sold to any other man, he that vowed it, may not redeem it any more:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quia cum iobelei venerit dies sanctificatus erit Domino et possessio consecrata ad ius pertinet sacerdotum"
      en: "For when the day of jubilee cometh, it shall be sanctified to the Lord, and as a possession consecrated, pertaineth to the right of the priests."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "si ager emptus et non de possessione maiorum sanctificatus fuerit Domino"
      en: "If a field that was bought, and not of a man's ancestors' possession, be sanctified to the Lord,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "supputabit sacerdos iuxta annorum numerum usque ad iobeleum pretium et dabit ille qui voverat eum Domino"
      en: "The priest shall reckon the price according to the number of years: unto the jubilee: and he that had vowed, shall give that to the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "in iobeleo autem revertetur ad priorem dominum qui vendiderat eum et habuerat in sortem possessionis suae"
      en: "But in the jubilee, it shall return to the former owner, who had sold it, and had it in the lot of his possession."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "omnis aestimatio siclo sanctuarii ponderabitur siclus viginti obolos habet"
      en: "All estimation shall be made according to the side of the sanctuary. A sicle hath twenty obols."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "primogenita quae ad Dominum pertinent nemo sanctificare poterit et vovere sive bos sive ovis fuerit Domini sunt"
      en: "The firstborn, which belong to the Lord, no man may sanctify and vow: whether it be bullock, or sheep, they are the Lord's."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quod si inmundum est animal redimet qui obtulit iuxta aestimationem tuam et addet quintam partem pretii si redimere noluerit vendetur alteri quantocumque a te fuerit aestimatum"
      en: "And if it be an unclean beast, he that offereth it shall redeem it, according to thy estimation, and shall add the fifth part of the price. If he will not redeem it, it shall be sold to another for how much soever it was estimated by thee."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "omne quod Domino consecratur sive homo fuerit sive animal sive ager non veniet nec redimi poterit quicquid semel fuerit consecratum sanctum sanctorum erit Domino"
      en: "Any thing that is devoted to the Lord, whether it be man, or beast, or field, shall not be sold, neither may it be redeemed. Whatsoever is once consecrated shall be holy of holies to the Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et omnis consecratio quae offertur ab homine non redimetur sed morte morietur"
      en: "And any consecration that is offered by man, shall not be redeemed, but dying shall die."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "omnes decimae terrae sive de frugibus sive de pomis arborum Domini sunt et illi sanctificantur"
      en: "All tithes of the land, whether of corn, or of the fruits of trees, are the Lord's, and are sanctified to him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "si quis autem voluerit redimere decimas suas addet quintam partem earum"
      en: "And if any man will redeem his tithes, he shall add the fifth part of them."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "omnium decimarum boves et oves et caprae quae sub pastoris virga transeunt quicquid decimum venerit sanctificabitur Domino"
      en: "Of all the tithes of oxen, and sheep, and goats, that pass under the shepherd's rod, every tenth that cometh shall be sanctified to the Lord."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "non eligetur nec bonum nec malum nec altero commutabitur si quis mutaverit et quod mutatum est et pro quo mutatum est sanctificabitur Domino et non redimetur"
      en: "It shall not be chosen neither good nor bad, neither shall it be changed for another. If any man change it: both that which was changed, and that for which it was changed, shall be sanctified to the Lord, and shall not be redeemed."
    status: { la: verified, en: verified }
