# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 31
verses:
  - n: 1
    text:
      la: "postquam autem audivit verba filiorum Laban dicentium tulit Iacob omnia quae fuerunt patris nostri et de illius facultate ditatus factus est inclitus"
      en: "But after that he heard the words of the sons of Laban, saying: Jacob hath taken away all that was our father's, and being enriched by his substance is become great:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "animadvertit quoque faciem Laban quod non esset erga se sicut heri et nudius tertius"
      en: "And perceiving also that Laban's countenance was not towards him as yesterday and the other day,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "maxime dicente sibi Domino revertere in terram patrum tuorum et ad generationem tuam eroque tecum"
      en: "Especially the Lord saying to him: Return into the land of thy fathers, and to thy kindred, and I will be with thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "misit et vocavit Rahel et Liam in agrum ubi pascebat greges"
      en: "He sent, and called Rachel and Lia into the field, where he fed the flocks,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque eis video faciem patris vestri quod non sit erga me sicut heri et nudius tertius Deus autem patris mei fuit mecum"
      en: "And said to them: I see your father's countenance is not towards me as yesterday and the other day: but the God of my father hath been with me."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ipsae nostis quod totis viribus meis servierim patri vestro"
      en: "And you know that I have served your father to the utmost of my power."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed pater vester circumvenit me et mutavit mercedem meam decem vicibus et tamen non dimisit eum Deus ut noceret mihi"
      en: "Yea, your father also hath overreached me, and hath changes my wages ten times: and yet God hath not suffered him to hurt me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "si quando dixit variae erunt mercedes tuae pariebant omnes oves varios fetus quando vero e contrario ait alba quaeque accipies pro mercede omnes greges alba pepererunt"
      en: "If at any time he said: The speckled shall be thy wages: all the sheep brought forth speckled: but when he said on the contrary: Thou shalt take all the white ones for thy wages: all the flocks brought forth white ones."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tulitque Deus substantiam patris vestri et dedit mihi"
      en: "And God hath taken your father's substance, and given it to me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "postquam enim conceptus ovium tempus advenerat levavi oculos meos et vidi in somnis ascendentes mares super feminas varios et maculosos et diversorum colorum"
      en: "For after that time came of the ewes conceiving, I lifted up my eyes, and saw in my sleep that the males which leaped upon the females were of diverse colors, and spotted, and speckled."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixitque angelus Dei ad me in somnis Iacob et ego respondi adsum"
      en: "And the angel of God said to me in my sleep: Jacob? And I answered: Here I am."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui ait leva oculos tuos et vide universos masculos ascendentes super feminas varios respersos atque maculosos vidi enim omnia quae fecit tibi Laban"
      en: "And he said: Lift up thy eyes, and see that all the males leaping upon the females, are of divers colors, spotted, and speckled. For I have seen all that Laban hath done to thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ego sum Deus Bethel ubi unxisti lapidem et votum vovisti mihi nunc ergo surge et egredere de terra hac revertens in terram nativitatis tuae"
      en: "I am the God of Bethel, where thou didst anoint the stone, and make a vow to me. Now therefore arise, and go out of this land, and return into thy native country."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "responderunt Rahel et Lia numquid habemus residui quicquam in facultatibus et hereditate domus patris nostri"
      en: "And Rachel and Lia answered: Have we anything left among the goods and inheritance of our father's house?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "nonne quasi alienas reputavit nos et vendidit comeditque pretium nostrum"
      en: "Hath he not counted us as strangers and sold us, and eaten up the price of us?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sed Deus tulit opes patris nostri et nobis eas tradidit ac filiis nostris unde omnia quae praecepit fac"
      en: "But God hath taken our father's riches, and delivered them to us, and to our children: wherefore do all that God hath commanded thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "surrexit itaque Iacob et inpositis liberis et coniugibus suis super camelos abiit"
      en: "Then Jacob rose up, and having set his children and wives upon camels, went his way."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "tulitque omnem substantiam et greges et quicquid in Mesopotamiam quaesierat pergens ad Isaac patrem suum in terram Chanaan"
      en: "And he took all his substance, and flocks, and whatsoever he had gotten in Mesopotamia, and went forward to Isaac his father to the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "eo tempore Laban ierat ad tondendas oves et Rahel furata est idola patris sui"
      en: "At that time Laban was gone to shear his sheep, and Rachel stole away her father's idols."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "noluitque Iacob confiteri socero quod fugeret"
      en: "And Jacob would not confess to his father in law that he was flying away."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "cumque abisset tam ipse quam omnia quae iuris eius erant et amne transmisso pergeret contra montem Galaad"
      en: "And when he was gone, together with all that belonged to him, and having passed the river, was going on towards mount Galaad,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "nuntiatum est Laban die tertio quod fugeret Iacob"
      en: "It was told Laban on the third day that Jacob fled."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "qui adsumptis fratribus suis persecutus est eum diebus septem et conprehendit in monte Galaad"
      en: "And he took his brethren with him, and pursued after him seven days; and overtook him in the mount of Galaad."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "viditque in somnis dicentem sibi Dominum cave ne quicquam aspere loquaris contra Iacob"
      en: "And he saw in a dream God saying to him: Take heed thou speak not any thing harshly against Jacob."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "iamque Iacob extenderat in monte tabernaculum cum ille consecutus eum cum fratribus suis in eodem monte Galaad fixit tentorium"
      en: "Now Jacob had pitched his tent in the mountain: and when he with his brethren had overtaken him, he pitched his tent in the same mount of Galaad."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et dixit ad Iacob quare ita egisti ut clam me abigeres filias meas quasi captivas gladio"
      en: "And he said to Jacob: Why hast thou done thus, to carry away, without my knowledge, my daughters, as captives taken with the sword."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cur ignorante me fugere voluisti nec indicare mihi ut prosequerer te cum gaudio et canticis et tympanis et cithara"
      en: "Why wouldst thou run away privately and not acquaint me, that I might have brought thee on the way with joy, and with songs, and with timbrels, and with harps?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "non es passus ut oscularer filios meos ac filias stulte operatus es et nunc"
      en: "Thou hast not suffered me to kiss my sons and daughters: thou hast done foolishly: and now, indeed,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "valet quidem manus mea reddere tibi malum sed Deus patris vestri heri dixit mihi cave ne loquaris cum Iacob quicquam durius"
      en: "It is in my power to return thee evil: but the God of your father said to me yesterday: Take heed thou speak not any things harshly against Jacob."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "esto ad tuos ire cupiebas et desiderio tibi erat domus patris tui cur furatus es deos meos"
      en: "Suppose thou didst desire to go to thy friends, and hadst a longing after thy father's house: why hast thou stolen away my gods?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "respondit Iacob quod inscio te profectus sum timui ne violenter auferres filias tuas"
      en: "Jacob answered: That I departed unknown to thee, it was for fear lest thou wouldst take away thy daughters by force."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quod autem furti arguis apud quemcumque inveneris deos tuos necetur coram fratribus nostris scrutare quicquid tuorum apud me inveneris et aufer haec dicens ignorabat quod Rahel furata esset idola"
      en: "But whereas thou chargest me with theft: with whomsoever thou shalt find thy gods, let him be slain before our brethren. Search, and if thou find any of thy things with me, take them away. Now when he said this, he knew not that Rachel had stolen the idols."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ingressus itaque Laban tabernaculum Iacob et Liae et utriusque famulae non invenit cumque intrasset tentorium Rahelis"
      en: "So Laban went into the tent of Jacob, and of Lia, and of both the handmaids, and found them not. And when he was entered into Rachel's tent,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "illa festinans abscondit idola subter stramen cameli et sedit desuper scrutantique omne tentorium et nihil invenienti"
      en: "She in haste hid the idols under the camel's furniture, and sat upon them: and when he had searched all the tent, and found nothing,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "ait ne irascatur dominus meus quod coram te adsurgere nequeo quia iuxta consuetudinem feminarum nunc accidit mihi sic delusa sollicitudo quaerentis est"
      en: "She said: Let not my lord be angry that I cannot rise up before thee, because it has now happened to me, according to the custom of women, So his careful search was in vain."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "tumensque Iacob cum iurgio ait quam ob culpam meam et ob quod peccatum sic exarsisti post me"
      en: "And jacob being angry, said in a chiding manner: For what fault of mine, and for what offense on my part hast thou so hotly pursued me,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et scrutatus es omnem supellectilem meam quid invenisti de cuncta substantia domus tuae pone hic coram fratribus meis et fratribus tuis et iudicent inter me et te"
      en: "And searched all my household stuff? What hast thou found of all the substance of thy house? lay it here before my brethren, and thy brethren, and let them judge between me and thee."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "idcirco viginti annis fui tecum oves tuae et caprae steriles non fuerunt arietes gregis tui non comedi"
      en: "Have I therefore been with thee twenty years? thy ewes and goats were not barren, the rams of thy flocks I did not eat:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "nec captum a bestia ostendi tibi ego damnum omne reddebam quicquid furto perierat a me exigebas"
      en: "Neither did I show thee that which the beast had torn, I made good all the damage: whatsoever was lost by theft, thou didst exact it of me:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "die noctuque aestu urebar et gelu fugiebat somnus ab oculis meis"
      en: "Day and night was I parched with heat, and with frost, and sleep departed from my eyes."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "sic per viginti annos in domo tua servivi tibi quattuordecim pro filiabus et sex pro gregibus tuis inmutasti quoque mercedem meam decem vicibus"
      en: "And in this manner have I served thee in thy house twenty years, fourteen for thy daughters, and six for thy flocks: thou hast changed also my wages ten times."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "nisi Deus patris mei Abraham et Timor Isaac adfuisset mihi forsitan modo nudum me dimisisses adflictionem meam et laborem manuum mearum respexit Deus et arguit te heri"
      en: "Unless the God of my father Abraham, and the fear of Isaac had stood by me, peradventure now thou hadst sent me away naked: God beheld my affliction and the labour of my hands, and rebuked thee yesterday."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "respondit ei Laban filiae et filii et greges tui et omnia quae cernis mea sunt quid possum facere filiis et nepotibus meis"
      en: "Laban answered him: The daughters are mine and the children, and thy flocks, and all things that thou seest are mine: what can I do to my children, and grandchildren?"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "veni ergo et ineamus foedus ut sit testimonium inter me et te"
      en: "Come therefore, let us enter into a league: that it may be for a testimony between me and thee."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "tulit itaque Iacob lapidem et erexit illum in titulum"
      en: "And Jacob took a stone, and set it up for a title:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "dixitque fratribus suis adferte lapides qui congregantes fecerunt tumulum comederuntque super eum"
      en: "And he said to his brethren: Bring hither stones. And they gathering stones together, made a heap, and they ate upon it."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "quem vocavit Laban tumulus Testis et Iacob acervum Testimonii uterque iuxta proprietatem linguae suae"
      en: "And Laban called it The witness heap: and Jacob, The hillock of testimony: each of them according to the propriety of his language."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "dixitque Laban tumulus iste testis erit inter me et te hodie et idcirco appellatum est nomen eius Galaad id est tumulus Testis"
      en: "And Laban said: This heap shall be a witness between me and thee this day, and therefore the name thereof was called Galaad, that is, The witness heap."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "intueatur Dominus et iudicet inter nos quando recesserimus a nobis"
      en: "The Lord behold and judge between us when we shall be gone one from the other."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "si adflixeris filias meas et si introduxeris uxores alias super eas nullus sermonis nostri testis est absque Deo qui praesens respicit"
      en: "If thou afflict my daughters, and if thou bring in other wives over them: none is witness of our speech but God, who is present and beholdeth."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "dixitque rursus ad Iacob en tumulus hic et lapis quem erexi inter me et te"
      en: "And he said again to Jacob: Behold, this heap, and the stone which I have set up between me and thee,"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "testis erit tumulus inquam iste et lapis sint in testimonio si aut ego transiero illum pergens ad te aut tu praeterieris malum mihi cogitans"
      en: "Shall be a witness: this heap, I say, and the stone, be they for a testimony, if either I shall pass beyond it going towards thee, or thou shalt pass beyond it, thinking harm to me."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Deus Abraham et Deus Nahor iudicet inter nos Deus patris eorum iuravit Iacob per Timorem patris sui Isaac"
      en: "The God of Abraham, and the God of Nachor, the God of their father, judge between us. And jacob swore by the fear of his father Isaac."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "immolatisque victimis in monte vocavit fratres suos ut ederent panem qui cum comedissent manserunt ibi"
      en: "And after he had offered sacrifices in the mountain, he called his brethren to eat bread. And when they had eaten, they lodged there:"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Laban vero de nocte consurgens osculatus est filios et filias suas et benedixit illis reversus in locum suum"
      en: "But laban arose in the night, and kissed his sons, and daughters, and blessed them: and returned to his place."
    status: { la: verified, en: verified }
