# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 36
verses:
  - n: 1
    text:
      la: "Et factum est in quartodecimo anno regis Ezechiae, ascendit Sennacherib, rex Assyriorum, super omnes civitates Juda munitas, et cepit eas."
      en: "And it came to pass in the fourteenth year of king Ezechias, that Sennacherib king of the Assyrians came up against all the fenced cities of Juda, and took them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et misit rex Assyriorum Rabsacen de Lachis in Jerusalem, ad regem Ezechiam in manu gravi: et stetit in aquaeductu piscinae superioris in via Agri fullonis."
      en: "And the king of the Assyrians sent Rabsaces from Lachis to Jerusalem, to king Ezechias with a great army, and he stood by the conduit of the upper pool in the way of the fuller's field."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et egressus est ad eum Eliacim, filius Helciae, qui erat super domum, et Sobna scriba, et Joahe filius Asaph, a commentariis."
      en: "And there went out to him Eliacim the son of Helcias, who was over the house, and Sobna the scribe, and Joahe the son of Asaph the recorder."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dixit ad eos Rabsaces: Dicite Ezechiae: Haec dicit rex magnus, rex Assyriorum: Quae est ista fiducia qua confidis?"
      en: "And Rabsaces said to them: Tell Ezechias: Thus saith the great king, the king of the Assyrians: What is this confidence wherein thou trustest?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "aut quo consilio vel fortitudine rebellare disponis? super quem habes fiduciam, quia recessisti a me?"
      en: "Or with what counsel or strength dost thou prepare for war? on whom dost thou trust, that thou art revolted from me?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ecce confidis super baculum arundineum confractum istum, super Aegyptum; cui si innixus fuerit homo, intrabit in manum ejus, et perforabit eam: sic Pharao, rex Aegypti, omnibus qui confidunt in eo."
      en: "Lo thou trustest upon this broken staff of a reed, upon Egypt: upon which if a man lean, it will go into his hand, and pierce it: so is Pharao king or Egypt to all that trust in him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quod si responderis mihi: In Domino Deo nostro confidimus; nonne ipse est cujus abstulit Ezechias excelsa et altaria, et dixit Judae et Jerusalem: Coram altari isto adorabitis?"
      en: "But if thou wilt answer me: We trust in the Lord our God: is it not he whose high places and altars Ezechias hath taken away, and hath said to Juda and Jerusalem: You shall worship before this altar?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et nunc trade te domino meo, regi Assyriorum, et dabo tibi duo millia equorum, nec poteris ex te praebere ascensores eorum:"
      en: "And now deliver thyself up to my lord the king of the Assyrians, and I will give thee two thousand horses, and thou wilt not be able on thy part to find riders for them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et quomodo sustinebis faciem judicis unius loci ex servis domini mei minoribus? Quod si confidis in Aegypto, in quadrigis et in equitibus,"
      en: "And how wilt thou stand against the face of the judge of one place, of the least of my master's servants? But if thou trust in Egypt, in chariots and in horsemen:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et nunc numquid sine Domino ascendi ad terram istam, ut disperderem eam? Dominus dixit ad me: Ascende super terram istam, et disperde eam."
      en: "And am I now come up without the Lord against this land to destroy it? The Lord said to me: Go up against this land, and destroy it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixit Eliacim, et Sobna, et Joahe, ad Rabsacen: Loquere ad servos tuos syra lingua; intelligimus enim; ne loquaris ad nos judaice in auribus populi qui est super murum."
      en: "And Eliacim, and Sobna, and Joahe said to Rabsaces: Speak to thy servants in the Syrian tongue: for we understand it: speak not to us in the Jews' language in the hearing of the people, that are upon the wall."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et dixit ad eos Rabsaces: Numquid ad dominum tuum et ad te misit me dominus meus, ut loquerer omnia verba ista? et non potius ad viros qui sedent in muro, ut comedant stercora sua, et bibant urinam pedum suorum vobiscum?"
      en: "And Rabsaces said to them: Hath my master sent me to thy master and to thee, to speak all these words; and not rather to the men that sit on the wall; that they may eat their own dung, and drink their urine with you?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et stetit Rabsaces, et clamavit voce magna judaice, et dixit: Audite verba regis magni, regis Assyriorum!"
      en: "Then Rabsaces stood, and cried out with a loud voice in the Jews' language, and said: Hear the words of the great king, the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Haec dicit rex: Non seducat vos Ezechias, quia non poterit eruere vos."
      en: "Thus saith the king: Let not Ezechias deceive you, for he shall not be able to deliver you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et non vobis tribuat fiduciam Ezechias super Domino, dicens: Eruens liberabit nos Dominus: non dabitur civitas ista in manu regis Assyriorum."
      en: "And let not Ezechias make you trust in the Lord, saying: The Lord will surely deliver us, and this city shall not be given into the hands of the king of the Assyrians."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nolite audire Ezechiam; haec enim dicit rex Assyriorum: Facite mecum benedictionem, et egredimini ad me, et comedite unusquisque vineam suam, et unusquisque ficum suam, et bibite unusquisque aquam cisternae suae,"
      en: "Do not hearken to Ezechias: for thus said the king of the Assyrians: Do with me that which is for your advantage, and come out to me, and eat ye every one of his vine, and every one of his fig tree, and drink ye every one the water of his cistern,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "donec veniam, et tollam vos ad terram quae est ut terra vestra, terram frumenti et vini, terram panum et vinearum."
      en: "Till I come and take you away to a land, like to your own, a land of corn and of wine, a land of bread and vineyards."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Nec conturbet vos Ezechias, dicens: Dominus liberabit nos. Numquid liberaverunt dii gentium unusquisque terram suam de manu regis Assyriorum?"
      en: "Neither let Ezechias trouble you, saying: The Lord will deliver us. Have any of the gods of the nations delivered their land out of the hand of the king of the Assyrians?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ubi est deus Emath et Arphad? ubi est deus Sepharvaim? numquid liberaverunt Samariam de manu mea?"
      en: "Where is the god of Emath and of Arphad? where is the god of Sepharvaim? have they delivered Samaria out of my hand?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quis est ex omnibus diis terrarum istarum qui eruerit terram suam de manu mea, ut eruat Dominus Jerusalem de manu mea?"
      en: "Who is there among all the gods of these lands, that hath delivered his country out of my hand, that the Lord may deliver Jerusalem out of my hand?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et siluerunt, et non responderunt ei verbum. Mandaverat enim rex, dicens: Ne respondeatis ei."
      en: "And they held their peace, and answered him not a word. For the king had commanded, saying: answer him not."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ingressus est Eliacim, filius Helciae, qui erat super domum, et Sobna scriba, et Joahe filius Asaph, a commentariis, ad Ezechiam, scissis vestibus, et nuntiaverunt ei verba Rabsacis."
      en: "And Eliacim the son of Helcias, that was over the house, and Sobna the scribe, and Joahe the son of Asaph the recorder, went in to Ezechias with their garments rent, and told him the words of Rabsaces."
    status: { la: verified, en: verified }
