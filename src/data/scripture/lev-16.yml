# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 16
verses:
  - n: 1
    text:
      la: "locutusque est Dominus ad Mosen post mortem duum filiorum Aaron quando offerentes ignem alienum interfecti sunt"
      en: "And the Lord spoke to Moses, after the death of the two sons of Aaron, when they were slain upon their offering strange fire:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et praecepit ei dicens loquere ad Aaron fratrem tuum ne omni tempore ingrediatur sanctuarium quod est intra velum coram propitiatorio quo tegitur arca ut non moriatur quia in nube apparebo super oraculum"
      en: "And he commanded him, saying, Speak to Aaron thy brother, that he enter not at all into the sanctuary, which is within the veil before the propitiatory, with which the ark is covered, lest he die, (for I will appear in a cloud over the oracle,)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nisi haec ante fecerit vitulum offeret pro peccato et arietem in holocaustum"
      en: "Unless he first do these things: He shall offer a calf for sin, and a ram for a holocaust."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "tunica linea vestietur feminalibus lineis verecunda celabit accingetur zona linea cidarim lineam inponet capiti haec enim vestimenta sunt sancta quibus cunctis cum lotus fuerit induetur"
      en: "He shall be vested with a linen tunick, he shall cover his nakedness with linen breeches: he shall be girded with a linen girdle, and he shall put a linen mitre upon his head: for these are holy vestments: all which he shall put on, after he is washed."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "suscipietque ab universa multitudine filiorum Israhel duos hircos pro peccato et unum arietem in holocaustum"
      en: "And he shall receive from the whole multitude of the children of Israel two buck goats for sin, and one ram for a holocaust."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cumque obtulerit vitulum et oraverit pro se et pro domo sua"
      en: "And when he hath offered the calf and prayed for himself, and for his own house,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "duos hircos stare faciet coram Domino in ostio tabernaculi testimonii"
      en: "He shall make the two buck goats to stand before the Lord in the door of the tabernacle of the testimony:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "mittens super utrumque sortem unam Domino et alteram capro emissario"
      en: "And casting lots upon them both, one to be offered to the Lord, and the other to be the emissary goat:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cuius sors exierit Domino offeret illum pro peccato"
      en: "That whose lot fell to be offered to the Lord, he shall offer for sin:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cuius autem in caprum emissarium statuet eum vivum coram Domino ut fundat preces super eo et emittat illum in solitudinem"
      en: "But that whose lot was to be the emissary goat, he shall present alive before the Lord, that he may pour out prayers upon him, and let him go into the wilderness."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "his rite celebratis offeret vitulum et rogans pro se et pro domo sua immolabit eum"
      en: "After these things are duly celebrated, he shall offer the calf, and praying for himself and for his own house, he shall immolate it:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "adsumptoque turibulo quod de prunis altaris impleverit et hauriens manu conpositum thymiama in incensum ultra velum intrabit in sancta"
      en: "And taking the censer, which he hath filled with the burning coals of the altar, and taking up with his hand the compounded perfume for incense, he shall go in within the veil into the holy place:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ut positis super ignem aromatibus nebula eorum et vapor operiat oraculum quod est super testimonium et non moriatur"
      en: "That when the perfumes are put upon the fire, the cloud and vapour thereof may cover the oracle, which is over the testimony, and he may not die."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tollet quoque de sanguine vituli et asperget digito septies contra propitiatorium ad orientem"
      en: "He shall take also of the blood of the calf, and sprinkle with his finger seven times towards the propitiatory to the east."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cumque mactaverit hircum pro peccato populi inferet sanguinem eius intra velum sicut praeceptum est de sanguine vituli ut aspergat e regione oraculi"
      en: "And when he hath killed the buck goat for the sin of the people, he shall carry in the blood thereof within the veil, as he was commanded to do with the blood of the calf, that he may sprinkle it over against the oracle,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et expiet sanctuarium ab inmunditiis filiorum Israhel et a praevaricationibus eorum cunctisque peccatis iuxta hunc ritum faciet tabernaculo testimonii quod fixum est inter eos in medio sordium habitationis eorum"
      en: "And may expiate the sanctuary from the uncleanness of the children of Israel, and from their transgressions, and all their sins. According to this rite shall he do to the tabernacle of the testimony, which is fixed among them in the midst of the filth of their habitation."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nullus hominum sit in tabernaculo quando pontifex ingreditur sanctuarium ut roget pro se et pro domo sua et pro universo coetu Israhel donec egrediatur"
      en: "Let no man be in the tabernacle when the high priest goeth into the sanctuary, to pray for himself and his house, and for the whole congregation of Israel, until he come out."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cum autem exierit ad altare quod coram Domino est oret pro se et sumptum sanguinem vituli atque hirci fundat super cornua eius per gyrum"
      en: "And when he is come out to the altar that is before the Lord, let him pray for himself, and taking the blood of the calf, and of the buck goat, let him pour it upon the horns thereof round about:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "aspergensque digito septies expiet et sanctificet illud ab inmunditiis filiorum Israhel"
      en: "And sprinkling with his finger seven times, let him expiate, and sanctify it from the uncleanness of the children of Israel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "postquam emundarit sanctuarium et tabernaculum et altare tunc offerat hircum viventem"
      en: "After he hath cleansed the sanctuary, and the tabernacle, and the altar, then let him offer the living goat:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et posita utraque manu super caput eius confiteatur omnes iniquitates filiorum Israhel et universa delicta atque peccata eorum quae inprecans capiti eius emittet illum per hominem paratum in desertum"
      en: "And putting both hands upon his head, let him confess all the iniquities of the children of Israel, and all their offences and sins: and praying that they may light on his head, he shall turn him out by a man ready for it, into the desert."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cumque portaverit hircus omnes iniquitates eorum in terram solitariam et dimissus fuerit in deserto"
      en: "And when the goat hath carried all their iniquities into an uninhabited land, and shall be let go into the desert,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "revertetur Aaron in tabernaculum testimonii et depositis vestibus quibus prius indutus erat cum intraret sanctuarium relictisque ibi"
      en: "Aaron shall return into the tabernacle of the testimony, and putting off the vestments, which he had on him before when he entered into the sanctuary, and leaving them there,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "lavabit carnem suam in loco sancto indueturque vestimentis suis et postquam egressus obtulerit holocaustum suum ac plebis rogabit tam pro se quam pro populo"
      en: "He shall wash his flesh in the holy place, and shall put on his own garments. And after that he has come out and hath offered his own holocaust, and that of the people, he shall pray both for himself, and for the people:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et adipem qui oblatus est pro peccatis adolebit super altare"
      en: "And the fat that is offered for sins, he shall burn upon the altar."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ille vero qui dimiserit caprum emissarium lavabit vestimenta sua et corpus aqua et sic ingredietur in castra"
      en: "But he that hath let go the emissary goat, shall wash his clothes, and his body with water, and so shall enter into the camp."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "vitulum autem et hircum qui pro peccato fuerant immolati et quorum sanguis inlatus est ut in sanctuario expiatio conpleretur asportabunt foras castra et conburent igni tam pelles quam carnes eorum et fimum"
      en: "But the calf and the buck goat, that were sacrificed for sin, and whose blood was carried into the sanctuary, to accomplish the atonement, they shall carry forth without the camp, e and shall burn with fire, their skins and their flesh, and their dung:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et quicumque conbuserit ea lavabit vestimenta sua et carnem aqua et sic ingredietur in castra"
      en: "And whosoever burneth them shall wash his clothes, and flesh with water, and so shall enter into the camp."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "eritque hoc vobis legitimum sempiternum mense septimo decima die mensis adfligetis animas vestras nullumque facietis opus sive indigena sive advena qui peregrinatur inter vos"
      en: "And this shall be to you an everlasting ordinance: The seventh month, the tenth day of the month, you shall afflict your souls, and shall do no work, whether it be one of your own country, or a stranger that sojourneth among you."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "in hac die expiatio erit vestri atque mundatio ab omnibus peccatis vestris coram Domino mundabimini"
      en: "Upon this day shall be the expiation for you, and the cleansing from all your sins: you shall be cleansed before the Lord."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "sabbatum enim requietionis est et adfligetis animas vestras religione perpetua"
      en: "For it is a sabbath of rest, and you shall afflict your souls by a perpetual religion."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "expiabit autem sacerdos qui unctus fuerit et cuius initiatae manus ut sacerdotio fungatur pro patre suo indueturque stola linea et vestibus sanctis"
      en: "And the priest that is anointed, and whose hands are consecrated to do the office of the priesthood in his father's stead, shall make atonement; and he shall be vested with the linen robe and the holy vestments,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et expiabit sanctuarium et tabernaculum testimonii atque altare sacerdotes quoque et universum populum"
      en: "And he shall expiate the sanctuary and the tabernacle of the testimony and the altar, the priest also and all the people."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "eritque hoc vobis legitimum sempiternum ut oretis pro filiis Israhel et pro cunctis peccatis eorum semel in anno fecit igitur sicut praeceperat Dominus Mosi"
      en: "And this shall be an ordinance for ever, that you pray for the children of Israel, and for all their sins once in a year. He did therefore as the Lord had commanded Moses."
    status: { la: verified, en: verified }
