# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 18
verses:
  - n: 1
    text:
      la: "In illa hora accesserunt discipuli ad Jesum, dicentes: Quis, putas, major est in regno caelorum?"
      en: "At that hour the disciples came to Jesus, saying: Who thinkest thou is the greater in the kingdom of heaven?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et advocans Jesus parvulum, statuit eum in medio eorum,"
      en: "And Jesus calling unto him a little child, set him in the midst of them,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixit: Amen dico vobis, nisi conversi fueritis, et efficiamini sicut parvuli, non intrabitis in regnum caelorum."
      en: "And said: Amen I say to you, unless you be converted, and become as little children, you shall not enter into the kingdom of heaven."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quicumque ergo humiliaverit se sicut parvulus iste, hic est major in regno caelorum."
      en: "Whosoever therefore shall humble himself as this little child, he is the greater in the kingdom of heaven."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et qui susceperit unum parvulum talem in nomine meo, me suscipit:"
      en: "And he that shall receive one such little child in my name, receiveth me."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui autem scandalizaverit unum de pusillis istis, qui in me credunt, expedit ei ut suspendatur mola asinaria in collo ejus, et demergatur in profundum maris."
      en: "But he that shall scandalize one of these little ones that believe in me, it were better for him that a millstone should be hanged about his neck, and that he should be drowned in the depth of the sea."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vae mundo a scandalis! Necesse est enim ut veniant scandala: verumtamen vae homini illi, per quem scandalum venit."
      en: "Woe to the world because of scandals. For it must needs be that scandals come: but nevertheless woe to that man by whom the scandal cometh."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si autem manus tua, vel pes tuus scandalizat te, abscide eum, et projice abs te: bonum tibi est ad vitam ingredi debilem, vel claudum, quam duas manus vel duos pedes habentem mitti in ignem aeternum."
      en: "And if thy hand, or thy foot scandalize thee, cut it off, and cast it from thee. It is better for thee to go into life maimed or lame, than having two hands or two feet, to be cast into everlasting fire."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et si oculus tuus scandalizat te, erue eum, et projice abs te: bonum tibi est cum uno oculo in vitam intrare, quam duos oculos habentem mitti in gehennam ignis."
      en: "And if thy eye scandalize thee, pluck it out, and cast it from thee. It is better for thee having one eye to enter into life, than having two eyes to be cast into hell fire."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Videte ne contemnatis unum ex his pusillis: dico enim vobis, quia angeli eorum in caelis semper vident faciem Patris mei, qui in caelis est."
      en: "See that you despise not one of these little ones: for I say to you, that their angels in heaven always see the face of my Father who is in heaven."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Venit enim Filius hominis salvare quod perierat."
      en: "For the Son of man is come to save that which was lost."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quid vobis videtur? si fuerint alicui centum oves, et erravit una ex eis: nonne relinquit nonaginta novem in montibus, et vadit quaerere eam quae erravit?"
      en: "What think you? If a man have an hundred sheep, and one of them should go astray: doth he not leave the ninety-nine in the mountains, and go to seek that which is gone astray?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et si contigerit ut inveniat eam: amen dico vobis, quia gaudet super eam magis quam super nonaginta novem, quae non erraverunt."
      en: "And if it so be that he find it: Amen I say to you, he rejoiceth more for that, than for the ninety-nine that went not astray."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sic non est voluntas ante Patrem vestrum, qui in caelis est, ut pereat unus de pusillis istis."
      en: "Even so it is not the will of your Father, who is in heaven, that one of these little ones should perish."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Si autem peccaverit in te frater tuus, vade, et corripe eum inter te, et ipsum solum: si te audierit, lucratus eris fratrem tuum."
      en: "But if thy brother shall offend against thee, go, and rebuke him between thee and him alone. If he shall hear thee, thou shalt gain thy brother."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Si autem te non audierit, adhibe tecum adhuc unum, vel duos, ut in ore duorum, vel trium testium stet omne verbum."
      en: "And if he will not hear thee, take with thee one or two more: that in the mouth of two or three witnesses every word may stand."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quod si non audierit eos: dic ecclesiae. Si autem ecclesiam non audierit, sit tibi sicut ethnicus et publicanus."
      en: "And if he will not hear them: tell the church. And if he will not hear the church, let him be to thee as the heathen and publican."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Amen dico vobis, quaecumque alligaveritis super terram, erunt ligata et in caelo: et quaecumque solveritis super terram, erunt soluta et in caelo."
      en: "Amen I say to you, whatsoever you shall bind upon earth, shall be bound also in heaven; and whatsoever you shall loose upon earth, shall be loosed also in heaven."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Iterum dico vobis, quia si duo ex vobis consenserint super terram, de omni re quamcumque petierint, fiet illis a Patre meo, qui in caelis est."
      en: "Again I say to you, that if two of you shall consent upon earth, concerning any thing whatsoever they shall ask, it shall be done to them by my Father who is in heaven."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ubi enim sunt duo vel tres congregati in nomine meo, ibi sum in medio eorum."
      en: "For where there are two or three gathered together in my name, there am I in the midst of them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Tunc accedens Petrus ad eum, dixit: Domine, quoties peccabit in me frater meus, et dimittam ei? usque septies?"
      en: "Then came Peter unto him and said: Lord, how often shall my brother offend against me, and I forgive him? till seven times?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dicit illi Jesus: Non dico tibi usque septies: sed usque septuagies septies."
      en: "Jesus saith to him: I say not to thee, till seven times; but till seventy times seven times."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ideo assimilatum est regnum caelorum homini regi, qui voluit rationem ponere cum servis suis."
      en: "Therefore is the kingdom of heaven likened to a king, who would take an account of his servants."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et cum coepisset rationem ponere, oblatus est ei unus, qui debebat ei decem millia talenta."
      en: "And when he had begun to take the account, one was brought to him, that owed him ten thousand talents."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Cum autem non haberet unde redderet, jussit eum dominus ejus venundari, et uxorem ejus, et filios, et omnia quae habebat, et reddi."
      en: "And as he had not wherewith to pay it, his lord commanded that he should be sold, and his wife and children and all that he had, and payment to be made."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Procidens autem servus ille, orabat eum, dicens: Patientiam habe in me, et omnia reddam tibi."
      en: "But that servant falling down, besought him, saying: Have patience with me, and I will pay thee all."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Misertus autem dominus servi illius, dimisit eum, et debitum dimisit ei."
      en: "And the lord of that servant being moved with pity, let him go and forgave him the debt."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Egressus autem servus ille invenit unum de conservis suis, qui debebat ei centum denarios: et tenens suffocavit eum, dicens: Redde quod debes."
      en: "But when that servant was gone out, he found one of his fellow servants that owed him an hundred pence: and laying hold of him, throttled him, saying: Pay what thou owest."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et procidens conservus ejus, rogabat eum, dicens: Patientiam habe in me, et omnia reddam tibi."
      en: "And his fellow servant falling down, besought him, saying: Have patience with me, and I will pay thee all."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Ille autem noluit: sed abiit, et misit eum in carcerem donec redderet debitum."
      en: "And he would not: but went and cast him into prison, till he paid the debt."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Videntes autem conservi ejus quae fiebant, contristati sunt valde: et venerunt, et narraverunt domino suo omnia quae facta fuerant."
      en: "Now his fellow servants seeing what was done, were very much grieved, and they came and told their lord all that was done."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Tunc vocavit illum dominus suus: et ait illi: Serve nequam, omne debitum dimisi tibi quoniam rogasti me:"
      en: "Then his lord called him; and said to him: Thou wicked servant, I forgave thee all the debt, because thou besoughtest me:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "nonne ergo oportuit et te misereri conservi tui, sicut et ego tui misertus sum?"
      en: "Shouldst not thou then have had compassion also on thy fellow servant, even as I had compassion on thee?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et iratus dominus ejus tradidit eum tortoribus, quoadusque redderet universum debitum."
      en: "And his lord being angry, delivered him to the torturers until he paid all the debt."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Sic et Pater meus caelestis faciet vobis, si non remiseritis unusquisque fratri suo de cordibus vestris."
      en: "So also shall my heavenly Father do to you, if you forgive not every one his brother from your hearts."
    status: { la: verified, en: verified }
