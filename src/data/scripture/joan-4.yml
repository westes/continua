# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 4
verses:
  - n: 1
    text:
      la: "Ut ergo cognovit Jesus quia audierunt pharisaei quod Jesus plures discipulos facit, et baptizat, quam Joannes"
      en: "When Jesus therefore understood that the Pharisees had heard that Jesus maketh more disciples, and baptizeth more than John,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "( quamquam Jesus non baptizaret, sed discipuli ejus),"
      en: "(Though Jesus himself did not baptize, but his disciples,)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "reliquit Judaeam, et abiit iterum in Galilaeam."
      en: "He left Judea, and went again into Galilee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Oportebat autem eum transire per Samariam."
      en: "And he was of necessity to pass through Samaria."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Venit ergo in civitatem Samariae, quae dicitur Sichar, juxta praedium quod dedit Jacob Joseph filio suo."
      en: "He cometh therefore to a city of Samaria, which is called Sichar, near the land which Jacob gave to his son Joseph."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Erat autem ibi fons Jacob. Jesus ergo fatigatus ex itinere, sedebat sic supra fontem. Hora erat quasi sexta."
      en: "Now Jacob's well was there. Jesus therefore being wearied with his journey, sat thus on the well. It was about the sixth hour."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Venit mulier de Samaria haurire aquam. Dicit ei Jesus: Da mihi bibere."
      en: "There cometh a woman of Samaria, to draw water. Jesus saith to her: Give me to drink."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "( Discipuli enim ejus abierant in civitatem ut cibos emerent.)"
      en: "For his disciples were gone into the city to buy meats."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dicit ergo ei mulier illa Samaritana: Quomodo tu, Judaeus cum sis, bibere a me poscis, quae sum mulier Samaritana? non enim coutuntur Judaei Samaritanis."
      en: "Then that Samaritan woman saith to him: How dost thou, being a Jew, ask of me to drink, who am a Samaritan woman? For the Jews do not communicate with the Samaritans."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Respondit Jesus, et dixit ei: Si scires donum Dei, et quis est qui dicit tibi: Da mihi bibere, tu forsitan petisses ab eo, et dedisset tibi aquam vivam."
      en: "Jesus answered, and said to her: If thou didst know the gift of God, and who he is that saith to thee, Give me to drink; thou perhaps wouldst have asked of him, and he would have given thee living water."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dicit ei mulier: Domine, neque in quo haurias habes, et puteus altus est: unde ergo habes aquam vivam?"
      en: "The woman saith to him: Sir, thou hast nothing wherein to draw, and the well is deep; from whence then hast thou living water?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Numquid tu major es patre nostro Jacob, qui dedit nobis puteum, et ipse ex eo bibit, et filii ejus, et pecora ejus?"
      en: "Art thou greater than our father Jacob, who gave us the well, and drank thereof himself, and his children, and his cattle?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Respondit Jesus, et dixit ei: Omnis qui bibit ex aqua hac, sitiet iterum; qui autem biberit ex aqua quam ego dabo ei, non sitiet in aeternum:"
      en: "Jesus answered, and said to her: Whosoever drinketh of this water, shall thirst again; but he that shall drink of the water that I will give him, shall not thirst for ever:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed aqua quam ego dabo ei, fiet in eo fons aquae salientis in vitam aeternam."
      en: "But the water that I will give him, shall become in him a fountain of water, springing up into life everlasting."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dicit ad eum mulier: Domine, da mihi hanc aquam, ut non sitiam, neque veniam huc haurire."
      en: "The woman saith to him: Sir, give me this water, that I may not thirst, nor come hither to draw."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dicit ei Jesus: Vade, voca virum tuum, et veni huc."
      en: "Jesus saith to her: Go, call thy husband, and come hither."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Respondit mulier, et dixit: Non habeo virum. Dicit ei Jesus: Bene dixisti, quia non habeo virum;"
      en: "The woman answered, and said: I have no husband. Jesus said to her: Thou hast said well, I have no husband:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quinque enim viros habuisti, et nunc, quem habes, non est tuus vir: hoc vere dixisti."
      en: "For thou hast had five husbands: and he whom thou now hast, is not thy husband. This thou hast said truly."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dicit ei mulier: Domine, video quia propheta es tu."
      en: "The woman saith to him: Sir, I perceive that thou art a prophet."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Patres nostri in monte hoc adoraverunt, et vos dicitis, quia Jerosolymis est locus ubi adorare oportet."
      en: "Our fathers adored on this mountain, and you say, that at Jerusalem is the place where men must adore."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dicit ei Jesus: Mulier, crede mihi, quia venit hora, quando neque in monte hoc, neque in Jerosolymis adorabitis Patrem."
      en: "Jesus saith to her: Woman, believe me, that the hour cometh, when you shall neither on this mountain, nor in Jerusalem, adore the Father."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Vos adoratis quod nescitis: nos adoramus quod scimus, quia salus ex Judaeis est."
      en: "You adore that which you know not: we adore that which we know; for salvation is of the Jews."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Sed venit hora, et nunc est, quando veri adoratores adorabunt Patrem in spiritu et veritate. Nam et Pater tales quaerit, qui adorent eum."
      en: "But the hour cometh, and now is, when the true adorers shall adore the Father in spirit and in truth. For the Father also seeketh such to adore him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Spiritus est Deus: et eos qui adorant eum, in spiritu et veritate oportet adorare."
      en: "God is a spirit; and they that adore him, must adore him in spirit and in truth."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dicit ei mulier: Scio quia Messias venit ( qui dicitur Christus): cum ergo venerit ille, nobis annuntiabit omnia."
      en: "The woman saith to him: I know that the Messias cometh (who is called Christ). Therefore, when he is come, he will tell us all things."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dicit ei Jesus: Ego sum, qui loquor te."
      en: "Jesus saith to her: I am he, who am speaking with thee."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et continuo venerunt discipuli ejus, et mirabantur quia cum muliere loquebatur. Nemo tamen dixit: Quid quaeris? aut, Quid loqueris cum ea?"
      en: "And immediately his disciples came; and they wondered that he talked with the woman. Yet no man said: What seekest thou? or, why talkest thou with her?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Reliquit ergo hydriam suam mulier, et abiit in civitatem, et dicit illis hominibus:"
      en: "The woman therefore left her waterpot, and went her way into the city, and saith to the men there:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Venite, et videte hominem qui dixit mihi omnia quaecumque feci: numquid ipse est Christus?"
      en: "Come, and see a man who has told me all things whatsoever I have done. Is not he the Christ?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Exierunt ergo de civitate et veniebant ad eum."
      en: "They went therefore out of the city, and came unto him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Interea rogabant eum discipuli, dicentes: Rabbi, manduca."
      en: "In the mean time the disciples prayed him, saying: Rabbi, eat."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ille autem dicit eis: Ego cibum habeo manducare, quem vos nescitis."
      en: "But he said to them: I have meat to eat, which you know not."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dicebant ergo discipuli ad invicem: Numquid aliquis attulit ei manducare?"
      en: "The disciples therefore said one to another: Hath any man brought him to eat?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Dicit eis Jesus: Meus cibus est ut faciam voluntatem ejus qui misit me, ut perficiam opus ejus."
      en: "Jesus saith to them: My meat is to do the will of him that sent me, that I may perfect his work."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Nonne vos dicitis quod adhuc quatuor menses sunt, et messis venit? Ecce dico vobis: levate oculos vestros, et videte regiones, quia albae sunt jam ad messem."
      en: "Do you not say, There are yet four months, and then the harvest cometh? Behold, I say to you, lift up your eyes, and see the countries; for they are white already to harvest."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et qui metit, mercedem accipit, et congregat fructum in vitam aeternam: ut et qui seminat, simul gaudeat, et qui metit."
      en: "And he that reapeth receiveth wages, and gathereth fruit unto life everlasting: that both he that soweth, and he that reapeth, may rejoice together."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "In hoc enim est verbum verum: quia alius est qui seminat, et alius est qui metit."
      en: "For in this is the saying true: That it is one man that soweth, and it is another that reapeth."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Ego misi vos metere quod vos non laborastis: alii laboraverunt, et vos in labores eorum introistis."
      en: "I have sent you to reap that in which you did not labour: others have laboured, and you have entered into their labours."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Ex civitate autem illa multi crediderunt in eum Samaritanorum, propter verbum mulieris testimonium perhibentis: Quia dixit mihi omnia quaecumque feci."
      en: "Now of that city many of the Samaritans believed in him, for the word of the woman giving testimony: He told me all things whatsoever I have done."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Cum venissent ergo ad illum Samaritani, rogaverunt eum ut ibi maneret. Et mansit ibi duos dies."
      en: "So when the Samaritans were come to him, they desired that he would tarry there. And he abode there two days."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et multo plures crediderunt in eum propter sermonem ejus."
      en: "And many more believed in him because of his own word."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et mulieri dicebant: Quia jam non propter tuam loquelam credimus: ipsi enim audivimus, et scimus quia hic est vere Salvator mundi."
      en: "And they said to the woman: We now believe, not for thy saying: for we ourselves have heard him, and know that this is indeed the Saviour of the world."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Post duos autem dies exiit inde, et abiit in Galilaeam."
      en: "Now after two days, he departed thence, and went into Galilee."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Ipse enim Jesus testimonium perhibuit, quia propheta in sua patria honorem non habet."
      en: "For Jesus himself gave testimony that a prophet hath no honour in his own country."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Cum ergo venisset in Galilaeam, exceperunt eum Galilaei, cum omnia vidissent quae fecerat Jerosolymis in die festo: et ipsi enim venerant ad diem festum."
      en: "And when he was come into Galilee, the Galileans received him, having seen all the things he had done at Jerusalem on the festival day; for they also went to the festival day."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Venit ergo iterum in Cana Galilaeae, ubi fecit aquam vinum. Et erat quidam regulus, cujus filius infirmabatur Capharnaum."
      en: "He came again therefore into Cana of Galilee, where he made the water wine. And there was a certain ruler, whose son was sick at Capharnaum."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Hic cum audisset quia Jesus adveniret a Judaea in Galilaeam, abiit ad eum, et rogabat eum ut descenderet, et sanaret filium ejus: incipiebat enim mori."
      en: "He having heard that Jesus was come from Judea into Galilee, went to him, and prayed him to come down, and heal his son; for he was at the point of death."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Dixit ergo Jesus ad eum: Nisi signa et prodigia videritis, non creditis."
      en: "Jesus therefore said to him: Unless you see signs and wonders, you believe not."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Dicit ad eum regulus: Domine, descende priusquam moriatur filius meus."
      en: "The ruler saith to him: Lord, come down before that my son die."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Dicit ei Jesus: Vade, filius tuus vivit. Credidit homo sermoni quem dixit ei Jesus, et ibat."
      en: "Jesus saith to him: Go thy way; thy son liveth. The man believed the word which Jesus said to him, and went his way."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Jam autem eo descendente, servi occurrerunt ei, et nuntiaverunt dicentes, quia filius ejus viveret."
      en: "And as he was going down, his servants met him; and they brought word, saying, that his son lived."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Interrogabat ergo horam ab eis in qua melius habuerit. Et dixerunt ei: Quia heri hora septima reliquit eum febris."
      en: "He asked therefore of them the hour wherein he grew better. And they said to him: Yesterday, at the seventh hour, the fever left him."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Cognovit ergo pater, quia illa hora erat in qua dixit ei Jesus: Filius tuus vivit; et credidit ipse et domus ejus tota."
      en: "The father therefore knew, that it was at the same hour that Jesus said to him, Thy son liveth; and himself believed, and his whole house."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Hoc iterum secundum signum fecit Jesus, cum venisset a Judaea in Galilaeam."
      en: "This is again the second miracle that Jesus did, when he was come out of Judea into Galilee."
    status: { la: verified, en: verified }
