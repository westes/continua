# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 8
verses:
  - n: 1
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tolle Aaron cum filiis suis vestes eorum et unctionis oleum vitulum pro peccato duos arietes canistrum cum azymis"
      en: "Take Aaron with his sons, their vestments, and the oil of unction, a calf for sin, two rams, a basket with unleavened bread,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et congregabis omnem coetum ad ostium tabernaculi"
      en: "And thou shalt gather together all the congregation to the door of the tabernacle."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "fecit Moses ut Dominus imperarat congregataque omni turba ante fores"
      en: "And Moses did as the Lord had commanded. And all the multitude being gathered together before the door of the tabernacle,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ait iste est sermo quem iussit Dominus fieri"
      en: "He said: This is the word that the Lord hath commanded to be done."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "statimque obtulit Aaron et filios eius cumque lavisset eos"
      en: "And immediately he offered Aaron and his sons: and when he had washed them,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vestivit pontificem subucula linea accingens eum balteo et induens tunica hyacinthina et desuper umerale inposuit"
      en: "He vested the high priest with the strait linen garment, girding him with the girdle, and putting on him the violet tunick, and over it he put the ephod,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quod adstringens cingulo aptavit rationali in quo erat doctrina et veritas"
      en: "And binding it with the girdle, he fitted it to the rational, on which was Doctrine and Truth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cidarim quoque texit caput et super eam contra frontem posuit lamminam auream consecratam in sanctificationem sicut praeceperat ei Dominus"
      en: "He put also the mitre upon his head: and upon the mitre over the forehead, he put the plate of gold, consecrated with sanctification, as the Lord had commanded him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "tulit et unctionis oleum quo levit tabernaculum cum omni supellectili sua"
      en: "He took also the oil of unction, with which he anointed the tabernacle, with all the furniture thereof."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque sanctificans aspersisset altare septem vicibus unxit illud et omnia vasa eius labrumque cum basi sua sanctificavit oleo"
      en: "And when he had sanctified and sprinkled the altar seven times, he anointed it, and all the vessels thereof, and the laver with the foot thereof, he sanctified with the oil."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quod fundens super caput Aaron unxit eum et consecravit"
      en: "And he poured it upon Aaron's head, and he anointed and consecrated him :"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "filios quoque eius oblatos vestivit tunicis lineis et cinxit balteo inposuitque mitras ut iusserat Dominus"
      en: "And after he had offered his sons, he vested them with linen tunicks, and girded them with girdles, and put mitres on them as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "obtulit et vitulum pro peccato cumque super caput eius posuissent Aaron et filii eius manus suas"
      en: "He offered also the calf for sin: and when Aaron and his sons had put their hands upon the head thereof,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "immolavit eum hauriens sanguinem et tincto digito tetigit cornua altaris per gyrum quo expiato et sanctificato fudit reliquum sanguinem ad fundamenta eius"
      en: "He immolated it: and took the blood, and dipping his finger in it, he touched the horns of the altar round about. Which being expiated, and sanctified, he poured the rest of the blood at the bottom thereof."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "adipem autem qui erat super vitalia et reticulum iecoris duosque renunculos cum arvinulis suis adolevit super altare"
      en: "But the fat that was upon the entrails, and the caul of the liver, and the two little kidneys, with their fat, he burnt upon the altar:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "vitulum cum pelle carnibus et fimo cremans extra castra sicut praeceperat Dominus"
      en: "And the calf with the skin, and the flesh and the dung, he burnt without the camp, as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "obtulit et arietem in holocaustum super cuius caput cum inposuissent Aaron et filii eius manus suas"
      en: "He offered also a ram for a holocaust: and when Aaron and his sons had put their hands upon its head,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "immolavit eum et fudit sanguinem eius per altaris circuitum"
      en: "He immolated it, and poured the blood thereof round about upon the altar."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ipsumque arietem in frusta concidens caput eius et artus et adipem adolevit igni"
      en: "And cutting the ram into pieces, the head thereof, and the joints, and the fat he burnt in the fire,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "lotis prius intestinis et pedibus totumque simul arietem incendit super altare eo quod esset holocaustum suavissimi odoris Domino sicut praeceperat ei"
      en: "Having first washed the entrails, and the feet, and the whole ram together he burnt upon the altar, because it was a holocaust of most sweet odour to the Lord, as he had commanded him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "obtulit et arietem secundum in consecrationem sacerdotum posueruntque super caput illius Aaron et filii eius manus suas"
      en: "He offered also the second ram, in the consecration of priests: and Aaron, and his sons put their hands upon the head thereof:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quem cum immolasset Moses sumens de sanguine tetigit extremum auriculae dextrae Aaron et pollicem manus eius dextrae similiter et pedis"
      en: "And when Moses had immolated it, he took of the blood thereof, and touched the tip of Aaron's right ear, and the thumb of his right hand, and in like manner also the great toe of his right foot."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "obtulit et filios Aaron cumque de sanguine arietis immolati tetigisset extremum auriculae singulorum dextrae et pollices manus ac pedis dextri reliquum fudit super altare per circuitum"
      en: "He offered also the sons of Aaron: and when with the blood of the ram that was immolated, he had touched the tip of the right ear of every one of them, and the thumbs of their right hands, and the great toes of their right feet, the rest he poured on the altar round about:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "adipem vero et caudam omnemque pinguedinem quae operit intestina reticulumque iecoris et duos renes cum adipibus suis et armo dextro separavit"
      en: "But the fat, and the rump, and all the fat that covereth the entrails, and the caul of the liver, and the two kidneys with their fat, and with the right shoulder, he separated."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "tollens autem de canistro azymorum quod erat coram Domino panem absque fermento et collyridam conspersam oleo laganumque posuit super adipes et armum dextrum"
      en: "And taking out of the basket; of unleavened bread, which was before the Lord, a loaf without leaven, and a cake tempered with oil and a wafer, he put them upon the fat, and the right shoulder,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "tradens simul omnia Aaron et filiis eius qui postquam levaverunt ea coram Domino"
      en: "Delivering all to Aaron, and to his sons: wile having lifted them up before the Lord,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "rursum suscepta de manibus eorum adolevit super altare holocausti eo quod consecrationis esset oblatio in odorem suavitatis sacrificii Domini"
      en: "He took them again from their hands, and burnt them upon the altar of holocaust, because it was the oblation of consecration, for a sweet odour of sacrifice to the Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "tulit et pectusculum elevans illud coram Domino de ariete consecrationis in partem suam sicut praeceperat ei Dominus"
      en: "And he took of the ram of consecration, the breast for his portion, elevating it before the Lord, as the Lord had commanded him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "adsumensque unguentum et sanguinem qui erat in altari aspersit super Aaron et vestimenta eius et super filios illius ac vestes eorum"
      en: "And taking the ointment, and the blood that was upon the altar, he sprinkled Aaron, and his vestments, and his sons, and their vestments with it."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "cumque sanctificasset eos in vestitu suo praecepit eis dicens coquite carnes ante fores tabernaculi et ibi comedite eas panes quoque consecrationis edite qui positi sunt in canistro sicut praecepit mihi dicens Aaron et filii eius comedent eos"
      en: "And when he had sanctified them in their vestments, he commanded them, saying: Boil the flesh before the door of the tabernacle, and there eat it. Eat ye also the loaves of consecration, that are laid in the basket, as the Lord commanded me, saying: Aaron and his sons shall eat them:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quicquid autem reliquum fuerit de carne et panibus ignis absumet"
      en: "And whatsoever shall be left of the flesh and the leaves, shall be consumed with fire."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "de ostio quoque tabernaculi non exibitis septem diebus usque ad diem quo conplebitur tempus consecrationis vestrae septem enim diebus finitur consecratio"
      en: "And you shall not go out of the door of the tabernacle for seven days, until the day wherein the time of your consecration shall be expired. For in seven days the consecration is finished:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "sicut et inpraesentiarum factum est ut ritus sacrificii conpleretur"
      en: "As at this present it hath been done, that the rite of the sacrifice might be accomplished."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "die ac nocte manebitis in tabernaculo observantes custodias Domini ne moriamini sic enim mihi praeceptum est"
      en: "Day and night shall you remain in the tabernacle observing the watches of the Lord, lest you die: for so it hath been commanded me."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "feceruntque Aaron et filii eius cuncta quae locutus est Dominus per manum Mosi"
      en: "And Aaron and his sons did all things which the Lord spoke by the hand of Moses."
    status: { la: verified, en: verified }
