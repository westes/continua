# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1pet
chapter: 4
verses:
  - n: 1
    text:
      la: "Christo igitur passo in carne et vos eadem cogitatione armamini quia qui passus est carne desiit a peccatis"
      en: "Christ therefore having suffered in the flesh, be you also armed with the same thought: for he that hath suffered in the flesh, hath ceased from sins:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ut iam non hominum desideriis sed voluntate Dei quod reliquum est in carne vivat temporis"
      en: "That now he may live the rest of his time in the flesh , not after the desires of men, but according to the will of God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sufficit enim praeteritum tempus ad voluntatem gentium consummandam qui ambulaverunt in luxuriis desideriis vinolentiis comesationibus potationibus et inlicitis idolorum cultibus"
      en: "For the time past is sufficient to have fulfilled the will of the Gentiles, for them who have walked in riotousness, lusts, excess of wine, revellings, banquetings, and unlawful worshipping of idols."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in quo peregrinantur non concurrentibus vobis in eandem luxuriae confusionem blasphemantes"
      en: "Wherein they think it strange, that you run not with them into the same confusion of riotousness, speaking evil of you."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui reddent rationem ei qui paratus est iudicare vivos et mortuos"
      en: "Who shall render account to him, who is ready to judge the living and the dead."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "propter hoc enim et mortuis evangelizatum est ut iudicentur quidem secundum homines in carne vivant autem secundum Deum spiritu"
      en: "For, for this cause was the gospel preached also to the dead: that they might be judged indeed according to men, in the flesh; but may live according to God, in the Spirit."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "omnium autem finis adpropinquavit estote itaque prudentes et vigilate in orationibus"
      en: "But the end of all is at hand. Be prudent therefore, and watch in prayers."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ante omnia mutuam in vosmet ipsos caritatem continuam habentes quia caritas operit multitudinem peccatorum"
      en: "But before all things have a constant mutual charity among yourselves: for charity covereth a multitude of sins."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "hospitales invicem sine murmuratione"
      en: "Using hospitality one towards another, without murmuring,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "unusquisque sicut accepit gratiam in alterutrum illam administrantes sicut boni dispensatores multiformis gratiae Dei"
      en: "As every man hath received grace, ministering the same one to another: as good stewards of the manifold grace of God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si quis loquitur quasi sermones Dei si quis ministrat tamquam ex virtute quam administrat Deus ut in omnibus honorificetur Deus per Iesum Christum cui est gloria et imperium in saecula saeculorum amen"
      en: "If any man speak, let him speak, as the words of God. If any man minister, let him do it, as of the power, which God administereth: that in all things God may be honoured through Jesus Christ: to whom is glory and empire for ever and ever. Amen."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "carissimi nolite peregrinari in fervore qui ad temptationem vobis fit quasi novi aliquid vobis contingat"
      en: "Dearly beloved, think not strange the burning heat which is to try you, as if some new thing happened to you;"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed communicantes Christi passionibus gaudete ut et in revelatione gloriae eius gaudeatis exultantes"
      en: "But if you partake of the sufferings of Christ, rejoice that when his glory shall be revealed, you may also be glad with exceeding joy."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si exprobramini in nomine Christi beati quoniam gloriae Dei Spiritus in vobis requiescit"
      en: "If you be reproached for the name of Christ, you shall be blessed: for that which is of the honour, glory, and power of God, and that which is his Spirit, resteth upon you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "nemo enim vestrum patiatur quasi homicida aut fur aut maledicus aut alienorum appetitor"
      en: "But let none of you suffer as a murderer, or a thief, or a railer, or a coveter of other men's things."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "si autem ut Christianus non erubescat glorificet autem Deum in isto nomine"
      en: "But if as a Christian, let him not be ashamed, but let him glorify God in that name."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quoniam tempus ut incipiat iudicium de domo Dei si autem primum a nobis qui finis eorum qui non credunt Dei evangelio"
      en: "For the time is, that judgment should begin at the house of God. And if first at us, what shall be the end of them that believe not the gospel of God?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et si iustus vix salvatur impius et peccator ubi parebit"
      en: "And if the just man shall scarcely be saved, where shall the ungodly and the sinner appear?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "itaque et hii qui patiuntur secundum voluntatem Dei fideli creatori commendant animas suas in benefactis"
      en: "Wherefore let them also that suffer according to the will of God, commend their souls in good deeds to the faithful Creator."
    status: { la: verified, en: verified }
