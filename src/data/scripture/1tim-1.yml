# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1tim
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus apostolus Christi Iesu secundum imperium Dei salvatoris nostri et Christi Iesu spei nostrae"
      en: "Paul, an apostle of Jesus Christ, according to the commandment of God our Savior, and of Christ Jesus our hope:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Timotheo dilecto filio in fide gratia misericordia pax a Deo Patre et Christo Iesu Domino nostro"
      en: "To Timothy, his beloved son in faith. Grace, mercy, and peace from God the Father, and from Christ Jesus our Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sicut rogavi te ut remaneres Ephesi cum irem in Macedoniam ut denuntiares quibusdam ne aliter docerent"
      en: "As I desired thee to remain at Ephesus when I went into Macedonia, that thou mightest charge some not to teach otherwise,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "neque intenderent fabulis et genealogiis interminatis quae quaestiones praestant magis quam aedificationem Dei quae est in fide"
      en: "Not to give heed to fables and endless genealogies: which furnish questions rather than the edification of God, which is in faith."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "finis autem praecepti est caritas de corde puro et conscientia bona et fide non ficta"
      en: "Now the end of the commandment is charity, from a pure heart, and a good conscience, and an unfeigned faith."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "a quibus quidam aberrantes conversi sunt in vaniloquium"
      en: "From which things some going astray, are turned aside unto vain babbling:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "volentes esse legis doctores non intellegentes neque quae loquuntur neque de quibus adfirmant"
      en: "Desiring to be teachers of the law, understanding neither the things they say, nor whereof they affirm."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "scimus autem quia bona est lex si quis ea legitime utatur"
      en: "But we know that the law is good, if a man use it lawfully:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sciens hoc quia iusto lex non est posita sed iniustis et non subditis impiis et peccatoribus sceleratis et contaminatis patricidis et matricidis homicidis"
      en: "Knowing this, that the law is not made for the just man, but for the unjust and disobedient, for the ungodly, and for sinners, for the wicked and defiled, for murderers of fathers, and murderers of mothers, for manslayers,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "fornicariis masculorum concubitoribus plagiariis mendacibus periuris et si quid aliud sanae doctrinae adversatur"
      en: "For fornicators, for them who defile themselves with mankind, for menstealers, for liars, for perjured persons, and whatever other thing is contrary to sound doctrine,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quae est secundum evangelium gloriae beati Dei quod creditum est mihi"
      en: "Which is according to the gospel of the glory of the blessed God, which hath been committed to my trust."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "gratias ago ei qui me confortavit Christo Iesu Domino nostro quia fidelem me existimavit ponens in ministerio"
      en: "I give thanks who hath strengthened me, even to Christ Jesus our Lord, for that he hath counted me faithful, putting me in the ministry;"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui prius fui blasphemus et persecutor et contumeliosus sed misericordiam consecutus sum quia ignorans feci in incredulitate"
      en: "Who before was a blasphemer, and a persecutor, and contumelious. But I obtained the mercy of God, because I did it ignorantly in unbelief."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "superabundavit autem gratia Domini nostri cum fide et dilectione quae est in Christo Iesu"
      en: "Now the grace of our Lord hath abounded exceedingly with faith and love, which is in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "fidelis sermo et omni acceptione dignus quia Christus Iesus venit in mundum peccatores salvos facere quorum primus ego sum"
      en: "A faithful saying, and worthy of all acceptation, that Christ Jesus came into this world to save sinners, of whom I am the chief."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sed ideo misericordiam consecutus sum ut in me primo ostenderet Christus Iesus omnem patientiam ad deformationem eorum qui credituri sunt illi in vitam aeternam"
      en: "But for this cause have I obtained mercy: that in me first Christ Jesus might shew forth all patience, for the information of them that shall believe in him unto life everlasting."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "regi autem saeculorum inmortali invisibili soli Deo honor et gloria in saecula saeculorum amen"
      en: "Now to the king of ages, immortal, invisible, the only God, be honour and glory for ever and ever. Amen."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "hoc praeceptum commendo tibi fili Timothee secundum praecedentes in te prophetias ut milites in illis bonam militiam"
      en: "This precept I commend to thee, O son Timothy; according to the prophecies going before on thee, that thou war in them a good warfare,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "habens fidem et bonam conscientiam quam quidam repellentes circa fidem naufragaverunt"
      en: "Having faith and a good conscience, which some rejecting have made shipwreck concerning the faith."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ex quibus est Hymeneus et Alexander quos tradidi Satanae ut discant non blasphemare"
      en: "Of whom is Hymeneus and Alexander, whom I have delivered up to Satan, that they may learn not to blaspheme."
    status: { la: verified, en: verified }
