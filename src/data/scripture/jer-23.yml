# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 23
verses:
  - n: 1
    text:
      la: "vae pastoribus qui disperdunt et dilacerant gregem pascuae meae dicit Dominus"
      en: "Woe to the pastors, that destroy and tear the sheep of my pasture, saith the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ideo haec dicit Dominus Deus Israhel ad pastores qui pascunt populum meum vos dispersistis gregem meum eiecistis eos et non visitastis eos ecce ego visitabo super vos malitiam studiorum vestrorum ait Dominus"
      en: "Therefore thus saith the Lord the God of Israel to the pastors that feed my people: You have scattered my flock, and driven them away, and have not visited them: behold I will visit upon you for the evil of your doings, saith the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ego congregabo reliquias gregis mei de omnibus terris ad quas eiecero eos illuc et convertam eos ad rura sua et crescent et multiplicabuntur"
      en: "And I will gather together the remnant of my flock, out of all the lands into which I have cast them out: and I will make them return to their own fields, and they shall increase and be multiplied."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et suscitabo super eos pastores et pascent eos non formidabunt ultra et non pavebunt et nullus quaeretur ex numero dicit Dominus"
      en: "And I will set up pastors over them, and they shall feed them: they shall fear no more, and they shall not be dismayed: and none shall be wanting of their number, saith the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ecce dies veniunt ait Dominus et suscitabo David germen iustum et regnabit rex et sapiens erit et faciet iudicium et iustitiam in terra"
      en: "Behold the days come, saith the Lord, and I will raise up to David a just branch: and a king shall reign, and shall be wise, and shall execute judgement and justice in the earth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in diebus illius salvabitur Iuda et Israhel habitabit confidenter et hoc est nomen quod vocabunt eum Dominus iustus noster"
      en: "In those days shall Juda be saved, and Israel shall dwell confidently: and this is the name that they shall call him: the Lord our just one."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "propter hoc ecce dies veniunt dicit Dominus et non dicent ultra vivit Dominus qui eduxit filios Israhel de terra Aegypti"
      en: "Therefore behold the days to come, saith the Lord, and they shall say no more: The Lord liveth, who brought up the children of Israel out of the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed vivit Dominus qui eduxit et adduxit semen domus Israhel de terra aquilonis et de cunctis terris ad quas eieceram eos illuc et habitabunt in terra sua"
      en: "But the Lord liveth, who hath brought out, and brought hither the seed of the house of Israel from the land of the north, and out of all the lands, to which I had cast them forth: and they shall dwell in their own land."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ad prophetas contritum est cor meum in medio mei contremuerunt omnia ossa mea factus sum quasi vir ebrius et quasi homo madidus a vino a facie Domini et a facie verborum sanctorum eius"
      en: "To the prophets: My heart is broken within me, all my bones tremble: I am become as a drunken man, and as a man full of wine, at the presence of the Lord, and at the presence of his holy words."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quia adulteris repleta est terra quia a facie maledictionis luxit terra arefacta sunt arva deserti factus est cursus eorum malus et fortitudo eorum dissimilis"
      en: "Because the land is full of adulterers, because the land hath mourned by reason of cursing, the fields of the desert are dried up: and their course is become evil, and their strength unlike."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "propheta namque et sacerdos polluti sunt et in domo mea inveni malum eorum ait Dominus"
      en: "For the prophet and the priest are defiled: and in my house I have found their wickedness, saith the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "idcirco via eorum erit quasi lubricum in tenebris inpellentur enim et corruent in ea adferam enim super eos mala annum visitationis eorum ait Dominus"
      en: "Therefore their way shall be as a slippery way in the dark: for they shall be driven on, and fall therein: for I will bring evils upon them, the year of their visitation, saith the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et in prophetis Samariae vidi fatuitatem prophetabant in Baal et decipiebant populum meum Israhel"
      en: "And I have seen folly in the prophets of Samaria: they prophesied in Baal, and deceived my people Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et in prophetis Hierusalem vidi similitudinem adulterium et iter mendacii et confortaverunt manus pessimorum ut non converteretur unusquisque a malitia sua facti sunt mihi omnes Sodoma et habitatores eius quasi Gomorra"
      en: "And I have seen the likeness of adulterers, and the way of lying in the peophets of Jerusalem: and they strengthened the hand of the wicked, that no man should return from his evil doings: that are all become unto me as Sodom, and the inhabitants thereof as Gamorrha."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "propterea haec dicit Dominus exercituum ad prophetas ecce ego cibabo eos absinthio et potabo eos felle a prophetis enim Hierusalem est egressa pollutio super omnem terram"
      en: "Therefore thus saith the Lord of hosts to the prophets: Behold I will feed them with wormwood, and I will give them gall to drink: for from the prophets of Jerusalem corruption has gone forth into all the land."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "haec dicit Dominus exercituum nolite audire verba prophetarum qui prophetant vobis et decipiunt vos visionem cordis sui loquuntur non de ore Domini"
      en: "Thus saith the Lord of hosts: Hearken not to the words of the prophets that prophesy to you, and deceive you: they speak a vision of their own heart, and not out of the mouth of the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dicunt his qui blasphemant me locutus est Dominus pax erit vobis et omni qui ambulat in pravitate cordis sui dixerunt non veniet super vos malum"
      en: "They say tothem that blaspheme me: The Lord hath said: You shall have peace: and to every one that walketh in the perverseness of his own heart, they have said: No evil shall come to you."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quis enim adfuit in consilio Domini et vidit et audivit sermonem eius quis consideravit verbum illius et audivit"
      en: "For who hath stood in the counsel of the Lord, and hath seen and heard his word? Who hath considered his word and heard it?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ecce turbo dominicae indignationis egredietur et tempestas erumpens super caput impiorum veniet"
      en: "Behold the whirlwind of the Lord's indignation shall come forth, and a tempest shall break out and come upon the head of the wicked."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "non revertetur furor Domini usque dum faciat et usque dum conpleat cogitationem cordis sui in novissimis diebus intellegetis consilium eius"
      en: "The wrath of the Lord shall not return till he execute it, and till he accomplish the thought of his heart: in the latter days you shall understand his counsel."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non mittebam prophetas et ipsi currebant non loquebar ad eos et ipsi prophetabant"
      en: "I did not send prophets, yet they ran: I have not spoken to them, yet they prophesied."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "si stetissent in consilio meo et nota fecissent verba mea populo meo avertissem utique eos a via sua mala et a pessimis cogitationibus suis"
      en: "If they stood in my counsel, and had made my words known to my people, I should have turned them from their evil way and from their wicked doings."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "putasne Deus e vicino ego sum dicit Dominus et non Deus de longe"
      en: "Am I, think ye, a God at hand, saith the Lord, and not a God afar off?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "si occultabitur vir in absconditis et ego non videbo eum dicit Dominus numquid non caelum et terram ego impleo ait Dominus"
      en: "Shall a man be hid in secret places, and I not see him, saith the Lord? do not I fill heaven and earth, saith the Lord?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "audivi quae dixerunt prophetae prophetantes in nomine meo mendacium atque dicentes somniavi somniavi"
      en: "I have heard what the prophets said, that prophesylies in my name, and say: I have dreamed, I have dreamed."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "usquequo istud in corde est prophetarum vaticinantium mendacium et prophetantium seductiones cordis sui"
      en: "How long shall this be in the heart of the prophets that prophesy lies, and that prophesy the delusions of their own heart?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui volunt facere ut obliviscatur populus meus nominis mei propter somnia eorum quae narrant unusquisque ad proximum suum sicut obliti sunt patres eorum nominis mei propter Baal"
      en: "Who seek to make my people forget my name through their dreams, which they tell every man to his neighbor: as their fathers forgot my name for Baal."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "propheta qui habet somnium narret somnium et qui habet sermonem meum loquatur sermonem meum vere quid paleis ad triticum dicit Dominus"
      en: "The prophet that hath a dream, let him tell a dream: and he that hath my word, let him speak my word with truth: what hath the chaff to do with the wheat, saith the Lord?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "numquid non verba mea sunt quasi ignis ait Dominus et quasi malleus conterens petram"
      en: "Are not my words as a fire, saith the Lord: and as a hammer that breaketh the rock in pieces?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "propterea ecce ego ad prophetas ait Dominus qui furantur verba mea unusquisque a proximo suo"
      en: "Therefore behold I am against the prophets, saith the Lord: who steal my words every one from his neighbor."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ecce ego ad prophetas ait Dominus qui adsumunt linguas suas et aiunt dicit Dominus"
      en: "Behold I am against the prophets, saith the Lord: who use their tongues, and say: The Lord saith it."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ecce ego ad prophetas somniantes mendacium ait Dominus qui narraverunt ea et seduxerunt populum meum in mendacio suo et in miraculis suis cum ego non misissem eos nec mandassem eis qui nihil profuerunt populo huic dicit Dominus"
      en: "Behold I am against the prophets that have lying dreams, saith the Lord: and tell them, and cause my people to err by their lying, and by their wonders: when I sent them not, nor commanded them, who have not profited this people at all, saith the Lord."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "si igitur interrogaverit te populus iste vel propheta aut sacerdos dicens quod est onus Domini dices ad eos ut quid vobis onus proiciam quippe vos dicit Dominus"
      en: "If therefore this people, or the prophet, or the priest shall ask thee, saying: What is the burden of the Lord? thou shalt say to them: You are the burden: for I will cast you away, saith the Lord."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et prophetes et sacerdos et populus qui dicit onus Domini visitabo super virum illum et super domum eius"
      en: "And as for the prophet, and the priest, and the people that shall say: The burden of the Lord: I will visit upon that man, and upon his house."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "haec dicetis unusquisque ad proximum et ad fratrem suum quid respondit Dominus et quid locutus est Dominus"
      en: "Thus shall you say every one to his neighbor, and to his brother: What hath the Lord answered? and what hath the Lord spoken?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et onus Domini ultra non memorabitur quia onus erit unicuique sermo suus et pervertitis verba Dei viventis Domini exercituum Dei nostri"
      en: "And the burden of the Lord shall be mentioned no more, for every man's word shall be his burden: for you have perverted the words of the living God, of the Lord of hosts our God."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "haec dices ad prophetam quid respondit tibi Dominus et quid locutus est Dominus"
      en: "Thus shalt thou say to the prophet: What hath the Lord answered thee? and what hath the Lord spoken?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "si autem onus Domini dixeritis propter hoc haec dicit Dominus quia dixistis sermonem istum onus Domini et misi ad vos dicens nolite dicere onus Domini"
      en: "But if you shall say: The burden of the Lord: therefore thus saith the Lord: Because you have said this word: The burden of the Lord: and I have sent to you saying: Say not, Tne burden of the Lord:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "propterea ecce ego tollam vos portans et derelinquam vos et civitatem quam dedi vobis et patribus vestris a facie mea"
      en: "Therefore behold I will take you away carrying you, and will forsake you, and the city which I gave to you, and to your fathers, out of my presence."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et dabo vos in obprobrium sempiternum et in ignominiam aeternam quae numquam oblivione delebitur"
      en: "And I will bring an everlasting reproach upon you, and a perpetual shame which shall never be forgotten."
    status: { la: verified, en: verified }
