# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 9
verses:
  - n: 1
    text:
      la: "Locutus est Dominus ad Moysen in deserto Sinai anno secundo, postquam egressi sunt de terra Aegypti, mense primo, dicens:"
      en: "The Lord spoke to Moses in the desert of Sinai, the second year after they were come out of the land of Egypt, in the first month, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Faciant filii Israel Phase in tempore suo,"
      en: "Let the children of Israel make the phase in its due time,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quartadecima die mensis hujus ad vesperam, juxta omnes caeremonias et justificationes ejus."
      en: "The fourteenth day of this month in the evening, according to all the ceremonies and justifications thereof."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Praecepitque Moyses filiis Israel ut facerent Phase."
      en: "And Moses commanded the children of Israel that they should make the phase."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui fecerunt tempore suo, quartadecima die mensis ad vesperam, in monte Sinai. Juxta omnia quae mandaverat Dominus Moysi, fecerunt filii Israel."
      en: "And they made it in its proper time: the fourteenth day of the month at evening, in mount Sinai. The children of Israel did according to all things that the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ecce autem quidam immundi super anima hominis, qui non poterant facere Phase in die illo, accedentes ad Moysen et Aaron,"
      en: "But behold some who were unclean by occasion of the soul of a man, who could not make the phase on that day, coming to Moses and Aaron,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixerunt eis: Immundi sumus super anima hominis: quare fraudamur ut non valeamus oblationem offerre Domino in tempore suo inter filios Israel?"
      en: "Said to them: We are unclean by occasion of the soul of a man. Why are we kept back that we may not offer in its season the offering to the Lord among the children of Israel?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quibus respondit Moyses: State ut consulam quid praecipiat Dominus de vobis."
      en: "And Moses answered them: Stay that I may consult the Lord what he will ordain concerning you."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Loquere filiis Israel: Homo, qui fuerit immundus super anima, sive in via procul in gente vestra, faciat Phase Domino"
      en: "Say to the children of Israel: The man that shall be unclean by occasion of one that is dead, or shall be in a journey afar off in your nation, let him make the phase to the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in mense secundo, quartadecima die mensis ad vesperam. Cum azymis et lactucis agrestibus comedent illud:"
      en: "In the second month, on the fourteenth day of the month in the evening, they shall eat it with unleavened bread and wild lettuce:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non relinquent ex eo quippiam usque mane, et os ejus non confringent: omnem ritum Phase observabunt."
      en: "They shall not leave any thing thereof until morning, a nor break a bone thereof, they shall observe all the ceremonies of the phase."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si quis autem et mundus est, et in itinere non fuit, et tamen non fecit Phase, exterminabitur anima illa de populis suis, quia sacrificium Domino non obtulit tempore suo: peccatum suum ipse portabit."
      en: "But if any man is clean, and was not on a journey, and did not make the phase, that soul shall be cut off from among his people, because he offered not sacrifice to the Lord in due season: he shall bear his sin."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Peregrinus quoque et advena si fuerint apud vos, facient Phase Domino juxta caeremonias et justificationes ejus. Praeceptum idem erit apud vos tam advenae quam indigenae."
      en: "The sojourner also and the stranger if they be among you, shall make the phase to the Lord according to the ceremonies and justifications thereof. The same ordinance shall be with you both for the stranger, and for him that was born in the land."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Igitur die qua erectum est tabernaculum, operuit illud nubes. A vespere autem super tentorium erat quasi species ignis usque mane."
      en: "Now on the day that the tabernacle was reared up, a cloud covered it. But from the evening there was over the tabernacle, as it were, the appearance of fire until the morning."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sic fiebat jugiter: per diem operiebat illud nubes, et per noctem quasi species ignis."
      en: "So it was always: by day the cloud covered it, and by night as it were the appearance of fire."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cumque ablata fuisset nubes, quae tabernaculum protegebat, tunc proficiscebantur filii Israel: et in loco ubi stetisset nubes, ibi castrametabantur."
      en: "And when the cloud that covered the tabernacle was taken up, then the children of Israel marched forward: and in the place where the cloud stood still, there they camped."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ad imperium Domini proficiscebantur, et ad imperium illius figebant tabernaculum. Cunctis diebus quibus stabat nubes super tabernaculum, manebant in eodem loco:"
      en: "At the commandment of the Lord they marched, and at his commandment they pitched the tabernacle. All the days that the cloud abode over the tabernacle, they remained in the same place:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et si evenisset ut multo tempore maneret super illud, erant filii Israel in excubiis Domini, et non proficiscebantur"
      en: "And if it was so that it continued over it a long time, the children of Israel kept the watches of the Lord, and marched not,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quot diebus fuisset nubes super tabernaculum. Ad imperium Domini erigebant tentoria, et ad imperium illius deponebant."
      en: "For as many days soever as the cloud stayed over the tabernacle. At the commandment of the Lord they pitched their tents, and at his commandment they took them down."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Si fuisset nubes a vespere usque mane, et statim diluculo tabernaculum reliquisset, proficiscebantur: et si post diem et noctem recessisset, dissipabant tentoria."
      en: "If the cloud tarried from evening until morning, and immediately at break of day left the tabernacle, they marched forward: and if it departed after a day and a night, they took down their tents."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Si vero biduo aut uno mense vel longiori tempore fuisset super tabernaculum, manebant filii Israel in eodem loco, et non proficiscebantur: statim autem ut recessisset, movebant castra."
      en: "But if it remained over the tabernacle for two days or a month or a longer time, the children of Israel remained in the same place, and marched not: but immediately as soon as it departed, they removed the camp."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Per verbum Domini figebant tentoria, et per verbum illius proficiscebantur: erantque in excubiis Domini juxta imperium ejus per manum Moysi."
      en: "By the word of the Lord they pitched their tents, and by his word they marched: and kept the watches of the Lord according to his commandment by the hand of Moses."
    status: { la: verified, en: verified }
