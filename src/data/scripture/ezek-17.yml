# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 17
verses:
  - n: 1
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hominis, propone aenigma, et narra parabolam ad domum Israel,"
      en: "Son of man, put forth a riddle, and speak a parable to the house of Israel,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dices: Haec dicit Dominus Deus: Aquila grandis magnarum alarum, longo membrorum ductu, plena plumis et varietate, venit ad Libanum, et tulit medullam cedri."
      en: "And say: Thus saith the Lord God: A large eagle with great wings, long-limbed, full of feathers, and of variety, came to Libanus, and took away the marrow of the cedar."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Summitatem frondium ejus avulsit, et transportavit eam in terram Chanaan: in urbe negotiatorum posuit illam."
      en: "He cropped off the top of the twigs thereof: and carried it away into the land of Chanaan, and he set it in a city of merchants."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et tulit de semine terrae, et posuit illud in terra pro semine, ut firmaret radicem super aquas multas: in superficie posuit illud."
      en: "And he took of the seed of the land, and put it in the ground for seed, that it might take a firm root over many waters: he planted it on the surface of the earth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cumque germinasset, crevit in vineam latiorem, humili statura, respicientibus ramis ejus ad eam, et radices ejus sub illa erant: facta est ergo vinea, et fructificavit in palmites, et emisit propagines."
      en: "And it sprung up and grew into a spreading vine of low stature, and the branches thereof looked towards him: and the roots thereof were under him. So it became a vine, and grew into branches, and shot forth sprigs."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et facta est aquila altera grandis, magnis alis, multisque plumis: et ecce vinea ista quasi mittens radices suas ad eam, palmites suos extendit ad illam, ut irrigaret eam de areolis germinis sui."
      en: "And there was another large eagle, with great wings, and many feathers: and behold this vine, bending as it were her roots towards him, stretched forth her branches to him, that he might water it by the furrows of her plantation."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In terra bona super aquas multas plantata est, ut faciat frondes, et portet fructum, ut sit in vineam grandem."
      en: "It was planted in a good ground upon many waters, that it might bring forth branches, and bear fruit, that it might become a large vine."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dic: Haec dicit Dominus Deus: Ergone prosperabitur? nonne radices ejus evellet, et fructus ejus distringet, et siccabit omnes palmites germinis ejus, et arescet, et non in brachio grandi, neque in populo multo, ut evelleret eam radicitus?"
      en: "Say thou: Thus saith the Lord God: Shall it prosper then? shall he not pull up the roots thereof, and strip off its fruit, and dry up all the branches it hath shot forth, and make it wither: and this without a strong arm, or many people, to pluck it up by the root?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ecce plantata est: ergone prosperabitur? nonne, cum tetigerit eam ventus urens, siccabitur, et in areis germinis sui arescet?"
      en: "Behold, it is planted: shall it prosper then? shall it not be dried up when the burning wind shall touch it, and shall it not wither in the furrows where it grew?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dic ad domum exasperantem: Nescitis quid ista significent? Dic: Ecce venit rex Babylonis in Jerusalem, et assumet regem et principes ejus, et adducet eos ad semetipsum in Babylonem."
      en: "Say to the provoking house: Know you not what these things mean? Tell them: Behold the king of Babylon cometh to Jerusalem: and he shall take away the king and the princes thereof, and carry them with him to Babylon."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et tollet de semine regni, ferietque cum eo foedus, et ab eo accipiet jusjurandum. Sed et fortes terrae tollet,"
      en: "And he shall take one of the king's seed, and make a covenant with him, and take an oath of him. Yea, and he shall take away the mighty men of the land,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ut sit regnum humile, et non elevetur, sed custodiat pactum ejus, et servet illud."
      en: "That it may be a low kingdom and not lift itself up, but keep his covenant, and observe it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Qui recedens ab eo misit nuntios ad Aegyptum, ut daret sibi equos et populum multum: numquid prosperabitur, vel consequetur salutem, qui fecit haec? et qui dissolvit pactum, numquid effugiet?"
      en: "But he hath revolted from him and sent ambassadors to Egypt, that it might give him horses, and much people. And shall he that hath done thus prosper, or be saved? and shall he escape that hath broken the covenant?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vivo ego, dicit Dominus Deus, quoniam in loco regis qui constituit eum regem, cujus fecit irritum juramentum, et solvit pactum quod habebat cum eo, in medio Babylonis morietur."
      en: "As I live, saith the Lord God: In the place where the king dwelleth that made him king, whose oath he hath made void, and whose covenant he broke, even in the midst of Babylon shall he die."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et non in exercitu grandi, neque in populo multo, faciet contra eum Pharao praelium: in jactu aggeris, et in exstructione vallorum, ut interficiat animas multas."
      en: "And not with a great army, nor with much people shall Pharao fight against him: when he shall cast up mounts, and build forts, to cut off many souls."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Spreverat enim juramentum, ut solveret foedus, et ecce dedit manum suam: et cum omnia haec fecerit, non effugiet."
      en: "For he had despised the oath, breaking his covenant, and behold he hath given his hand: and having done all these things, he shall not escape."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Propterea haec dicit Dominus Deus: Vivo ego, quoniam juramentum quod sprevit, et foedus quod praevaricatus est, ponam in caput ejus."
      en: "Therefore thus saith the Lord God: As I live, I will lay upon his head the oath he hath despised, and the covenant he hath broken."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et expandam super eum rete meum, et comprehendetur in sagena mea: et adducam eum in Babylonem, et judicabo eum ibi in praevaricatione qua despexit me."
      en: "And I will spread my net over him, and he shall be taken in my net: and I will bring him into Babylon, and will judge him there for the transgression by which he hath despised me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et omnes profugi ejus, cum universo agmine suo, gladio cadent: residui autem in omnem ventum dispergentur, et scietis quia ego Dominus locutus sum."
      en: "And all his fugitives with all his bands shall fall by the sword: and the residue shall be scattered into every wind: and you shall know that I the Lord have spoken."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Haec dicit Dominus Deus: Et sumam ego de medulla cedri sublimis, et ponam: et vertice ramorum ejus tenerum distringam, et plantabo super montem excelsum et eminentem."
      en: "Thus saith the Lord God: I myself will take of the marrow of the high cedar, and will set it: I will crop off a tender twig from the top of the branches thereof, and I will plant it on a mountain high and eminent."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "In monte sublimi Israel plantabo illud, et erumpet in germen, et faciet fructum, et erit in cedrum magam: et habitabunt sub ea omnes volucres, et universum volatile sub umbra frondium ejus nidificabit:"
      en: "On the high mountains of Israel will I plant it, and it shall shoot forth into branches, and shall bear fruit, and it shall become a great cedar: and all birds shall dwell under it, and every fowl shall make its nest under the shadow of the branches thereof."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et scient omnia ligna regionis quia ego Dominus humiliavi lignum sublime, et exaltavi lignum humile: et siccavi lignum viride, et frondere feci lignum aridum. Ego Dominus locutus sum, et feci."
      en: "And all the trees of the country shall know that I the Lord have brought down the high tree, and exalted the low tree: and have dried up the green tree, and have caused the dry tree to flourish. I the Lord have spoken and have done it."
    status: { la: verified, en: verified }
