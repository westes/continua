# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 12
verses:
  - n: 1
    text:
      la: "anno septimo Hieu regnavit Ioas quadraginta annis regnavit in Hierusalem nomen matris eius Sebia de Bersabee"
      en: "In the seventh year of Jehu Joas began to reign: and he reigned forty years in Jerusalem. The name of his mother was Sebia of Bersabee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fecitque Ioas rectum coram Domino cunctis diebus quibus docuit eum Ioiada sacerdos"
      en: "And Joas did that which was right before the Lord all the days that Joiada the priest taught him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "verumtamen excelsa non abstulit adhuc populus immolabat et adolebat in excelsis incensum"
      en: "But yet he took not away the high places: for the people still sacrificed and burnt incense in the high places."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dixitque Ioas ad sacerdotes omnem pecuniam sanctorum quae inlata fuerit in templum Domini a praetereuntibus quae offertur pro pretio animae et quam sponte et arbitrio cordis sui inferunt in templum Domini"
      en: "And Joas said to the priests: O All the money of the sanctified things, which is brought into the temple of the Lord by those that pass, which is offered for the price of a soul, and which of their own accord, and of their own free heart they bring into the temple of the Lord:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "accipiant illam sacerdotes iuxta ordinem suum et instaurent sarta tecta domus si quid necessarium viderint instauratione"
      en: "Let the priests take it according to their order, and repair the house, wheresoever they shall see any thing that wanteth repairing."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "igitur usque ad vicesimum tertium annum regis Ioas non instauraverunt sacerdotes sarta tecta templi"
      en: "Now till the three and twentieth year of king Joas, the priests did not make the repairs of the temple."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vocavitque rex Ioas Ioiada pontificem et sacerdotes dicens eis quare sarta tecta non instaurastis templi nolite ergo amplius accipere pecuniam iuxta ordinem vestrum sed ad instaurationem templi reddite eam"
      en: "And king Joas called Joiada the high priest and the priests, saying to them: Why do you not repair the temple? Take you therefore money no more according to your order, but restore it for the repairing of the temple."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "prohibitique sunt sacerdotes ultra accipere pecuniam a populo et instaurare sarta tecta domus"
      en: "And the priests were forbidden to take any more money of the people, and to make the repairs of the house."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et tulit Ioiada pontifex gazofilacium unum aperuitque foramen desuper et posuit illud iuxta altare ad dexteram ingredientium domum Domini mittebantque in eo sacerdotes qui custodiebant ostia omnem pecuniam quae deferebatur ad templum Domini"
      en: "And Joiada the high priest took a chest and bored a hole in the top, and set it by the altar at the right hand of them that came into the house of the Lord, and the priests that kept the doors put therein all the money that was brought to the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque viderent nimiam pecuniam esse in gazofilacio ascendebat scriba regis et pontifex effundebantque et numerabant pecuniam quae inveniebatur in domo Domini"
      en: "And when they saw that there was very much money in the chest, the king's scribe and the high priest came up, and poured it out, and counted the money that was found in the house of the Lord:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dabant eam iuxta numerum atque mensuram in manu eorum qui praeerant cementariis domus Domini qui inpendebant eam in fabris lignorum et in cementariis his qui operabantur in domo Domini"
      en: "And they gave it out by number and measure into the hands of them that were over the builders of the house of the Lord: and they laid it out to the carpenters, and the masons that wrought in the house of the Lord,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et sarta tecta faciebant et in his qui caedebant saxa et ut emerent ligna et lapides qui excidebantur ita ut impleretur instauratio domus Domini in universis quae indigebant expensa ad muniendam domum"
      en: "And made the repairs: and to them that cut stones, and to buy timber, and stones, to be hewed, that the repairs of the house of the Lord might be completely finished, and wheresoever there was need of expenses to uphold the house"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "verumtamen non fiebant ex eadem pecunia hydriae templi Domini et fuscinulae et turibula et tubae omne vas aureum et argenteum de pecunia quae inferebatur in templum Domini"
      en: "But there were not made of the same money for the temple of the Lord, bowls, or fleshhooks, or censers, or trumpets, or any vessel of gold and silver, of the money that was brought into the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "his enim qui faciebant opus dabatur ut instauraretur templum Domini"
      en: "For it was given to them that did the work, that the temple of the Lord might be repaired."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et non fiebat ratio his hominibus qui accipiebant pecuniam ut distribuerent eam artificibus sed in fide tractabant eam"
      en: "And they reckoned not with the men that received the money to distribute it to the workmen, but they bestowed it faithfully."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "pecuniam vero pro delicto et pecuniam pro peccatis non inferebant in templum Domini quia sacerdotum erat"
      en: "But the money for trespass, and the money for sine, they brought not into the temple of the Lord, because it was for the priests."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "tunc ascendit Azahel rex Syriae et pugnabat contra Geth cepitque eam et direxit faciem suam ut ascenderet in Hierusalem"
      en: "Then Hazael king of Syria went up and fought against Geth, and took it and set his face to go up to Jerusalem."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quam ob rem tulit Ioas rex Iuda omnia sanctificata quae consecraverant Iosaphat et Ioram et Ahazia patres eius reges Iuda et quae ipse obtulerat et universum argentum quod inveniri potuit in thesauris templi Domini et in palatio regis misitque Azaheli regi Syriae et recessit ab Hierusalem"
      en: "Wherefore Joas king of Juda took all the sanctified things, which Josaphat, and Joram, and Ochozias his fathers the kings of Juda had dedicated to holy uses, and which he himself had offered: and all the silver that could be found in the treasures of the temple of the Lord, and in the king's palace: and sent it to Hazael king of Syria, and he went off from Jerusalem."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "reliqua autem sermonum Ioas et universa quae fecit nonne haec scripta sunt in libro verborum dierum regum Iuda"
      en: "And the rest of the acts of Joas, and all that he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "surrexerunt autem servi eius et coniuraverunt inter se percusseruntque Ioas in domo Mello in descensu Sela"
      en: "And his servants arose, and conspired among themselves, and slew Joas in the house of Mello in the descent of Sella."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Iozachar namque filius Semath et Iozabad filius Somer servi eius percusserunt eum et mortuus est et sepelierunt eum cum patribus suis in civitate David regnavitque Amasias filius eius pro eo"
      en: "For Josachar the son of Semaath, and Jozabad the son of Somer his servant struck him, and he died: and they buried him with his fathers in the city of David, and Amasias his son reigned in his stead."
    status: { la: verified, en: verified }
