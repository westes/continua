# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 9
verses:
  - n: 1
    text:
      la: "non zeles mulierem sinus tui ne ostendas super te malitiam doctrinae nequam"
      en: "Be not jealous over the wife of thy bosom, lest she shew in thy regard the malice of a wicked lesson."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "non des mulieri potestatem animae tuae ne ingrediatur in virtute tua et confundaris"
      en: "Give not the power of thy soul to a woman, lest she enter upon thy strength, and thou be confounded."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ne respicias mulierem multivolam ne forte incidas in laqueos illius"
      en: "Look not upon a woman that hath a mind for many: lest thou fall into her snares."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cum psaltrice ne adsiduus sis nec audias illam ne forte pereas in efficacia illius"
      en: "Use not much the company of her that is a dancer, and hearken not to her, lest thou perish by the force of her charms."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "virginem ne conspicias ne forte scandalizeris in decore illius"
      en: "Gaze not upon a maiden, lest her beauty be a stumblingblock to thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non des fornicariis animam tuam in nullo ne perdas te et hereditatem tuam"
      en: "Give not thy soul to harlots in any point: lest thou destroy thyself and thy inheritance."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "noli conspicere in vicis civitatis nec oberraveris in plateis illius"
      en: "Look not round about thee in the of the city, nor wander up and down in the streets thereof."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "averte faciem tuam a muliere compta et non circumspicias speciem alienam"
      en: "Turn away thy face from a woman dressed up, and gaze not about upon another's beauty."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "propter speciem mulieris multi perierunt et ex hoc concupiscentia quasi ignis exardescit"
      en: "For many have perished by the beauty of a woman, and hereby lust is enkindled as a fire."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "omnis mulier quae est fornicaria quasi stercus in via conculcatur"
      en: "Every woman that is a harlot, shall be trodden upon as dung in the way."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "speciem mulieris alienae multi admirati reprobi facti sunt conloquium enim illius quasi ignis exardescit"
      en: "Many by admiring the beauty of another man's wife, have become reprobate, for her conversation burneth as fire."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cum aliena muliere non accumbas super cubitum cum aliena muliere ne sedeas omnino nec accumbas cum ea super cubitum"
      en: "Sit not at all with another man's wife, nor repose upon the bed with her:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et non alterceris cum ea in vino ne forte declinet cor tuum in illa et sanguine tuo labaris in perditionem"
      en: "And strive not with her over wine, lest thy heart decline towards her, and by thy blood thou fall into destruction."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ne derelinquas amicum antiquum novus enim non erit similis illi"
      en: "Forsake not an old friend, for the new will not be like to him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vinum novum amicus novus veterescat et cum suavitate bibes illud"
      en: "A new friend is as new wine: it shall grow old, and thou shalt drink it with pleasure."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non zeles gloriam et opes peccatoris non enim scis quae futura sit illius subversio"
      en: "Envy not the glory and riches of a sinner: for thou knowest not what his ruin shall be."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "non placeat tibi iniuria iniustorum sciens quoniam usque ad inferos non placebit impius"
      en: "Be not pleased with the wrong done by the unjust, knowing that even to hell the wicked shall not please."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "longe abesto ab homine potestatem habente occidendi et non suspicaberis timorem mortis"
      en: "Keep thee far from the man that hath power to kill, so thou shalt not suspect the fear of death."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et si accesseris ad illum noli aliquid committere ne forte auferat vitam tuam"
      en: "And if thou come to him, commit no fault, lest he take away thy life."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "communionem mortis scito quoniam in medium laqueorum ingredieris et super dolentium arma ambulabis"
      en: "Know it to be a communication with death: for thou art going in the midst of snares, and walking upon the arms of them that are grieved:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "secundum virtutem tuam cave te a proximo et cum sapientibus et prudentibus tracta"
      en: "According to thy power beware of thy neighbor, and treat with the wise and prudent."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "viri iusti sint tibi convivae et in timore Dei sit gloriatio tibi"
      en: "Let just men be thy guests, and let thy glory be in the fear of God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et in sensu sit tibi cogitatus et omnis narratio tua in praeceptis Altissimi"
      en: "And let the thought of God be in thy mind, and all thy discourse on the commandments of the Highest."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "in manus artificum opera laudabitur et princeps populi in sapientia sermonis sui in sensu vero seniorum verbum"
      en: "Works shall be praised for the hand of the artificers, and the prince of the people for the wisdom of his speech, but word of the ancients for the sense."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "terribilis est in civitate sua homo linguosus et temerarius in verbo suo odibilis erit"
      en: "A man full of tongue is terrible in his city, and he that is rash in his word shall be hateful."
    status: { la: verified, en: verified }
