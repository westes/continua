# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sap
chapter: 17
verses:
  - n: 1
    text:
      la: "magna enim sunt iudicia tua et inenarrabilia verba tua propter hoc indisciplinatae animae erraverunt"
      en: "For thy judgments, O Lord, are great, and thy words cannot be expressed: therefore undisciplined souls have erred."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dum enim persuasum habent iniqui posse dominari nationi sanctae vinculis tenebrarum et longae noctis conpediti inclusi sub tectis fugitivi perpetuae providentiae iacuerunt"
      en: "For while the wicked thought to be able to have dominion over the holy nation, they themselves being fettered with the bonds of darkness, and a long night, shut up in their houses, lay there exiled from the eternal providence."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dum putant se latere in obscuris peccatis tenebroso oblivionis velamento dispersi sunt paventes horrende et cum admiratione nimia perturbati"
      en: "And while they thought to lie hid in their obscure sins, they were scattered under a dark veil of forgetfulness, being horribly afraid and troubled with exceeding great astonishment."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "neque enim quae continebat illos spelunca sine timore custodiebat quoniam sonitus descendens perturbabat illos et personae tristes apparentes pavorem illis praestabant"
      en: "For neither did the den that held them, keep them from fear: for noises coming down troubled them, and sad visions appearing to them, affrighted them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ignis quidem nulla vis poterat illis lumen praebere nec siderum limpidae flammae inluminare poterant illam noctem horrendam"
      en: "And no power of fire could give them light, neither could the bright flames of the stars enlighten that horrible night."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "apparebat autem illis subitaneus ignis timore plenus et timore percussi illius quae non videbatur faciei aestimabant deteriora esse quae videbantur"
      en: "But there appeared to them a sudden fire, very dreadful: and being struck with the fear of that face, which was not seen, they thought the things which they saw to be worse:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et magicae artis adpositi erant derisus et sapientiae gloriae correptio cum contumelia"
      en: "And the delusions of their magic art were put down, and their boasting of wisdom was reproachfully rebuked."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "illi enim qui promittebant timores turbationes expellere se ab anima languente hi cum derisu pleni timore languebant"
      en: "For they who promised to drive away fears and troubles from a sick soul, were sick themselves of a fear worthy to be laughed at."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "nam et si nihil illos ex monstris perturbabat transitu animalium et serpentium sibilatione commoti tremebundi peribant et aerem quem nulla ratione quis effugere posset negantes se videre"
      en: "For though no terrible thing disturbed them: yet being scared with the passing by of beasts, and hissing of serpents, they died for fear: and denying that they saw the air, which could by no means be avoided."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cum sit enim timida nequitia dat testimonium condemnata semper enim praesumit saeva conturbata conscientia"
      en: "For whereas wickedness is fearful, it beareth witness of its condemnation: for a troubled conscience always forecasteth grievous things."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nihil enim est timor nisi praesumptionis adiutorium proditio cogitationis auxiliorum"
      en: "For fear is nothing else but a yielding up of the succours from thought."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dum ab intro minor est expectatio maiorem putat scientiam eius causae de qua tormentum praestat"
      en: "And while there is less expectation from within, the greater doth it count the ignorance of that cause which bringeth the torment."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "illi autem qui inpotentem vere noctem et ab infimis et ab altissimis inferis supervenientem eundem somnum dormientes"
      en: "But they that during that night, in which nothing could be done, and which came upon them from the lowest and deepest hell, slept the same sleep."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "aliquando monstrorum exagitabantur timore aliquando animae deficiebant traductione subitaneus enim illis et insperatus timor supervenerat"
      en: "Were sometimes molested with the fear of monsters, sometimes fainted away, their soul failing them: for a sudden and unlooked for fear was come upon them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "deinde si quicumque ex illis decidisset custodiebatur in carcere sine ferro reclusus"
      en: "Moreover if any of them had fallen down, he was kept shut up in prison without irons."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "si enim rusticus quis erat aut pastor aut agri laborum operarius praeoccupatus esset ineffugibilem sustinebat necessitatem"
      en: "For if any one were a husbandman, or a shepherd, or a labourer in the field, and was suddenly overtaken, he endured a necessity from which he could not fly."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "una enim catena tenebrarum omnes erant conligati sive spiritus sibilans aut inter spissos ramos avium sonus suavis aut vis aquae decurrentis nimium"
      en: "For they were all bound together with one chain of darkness. Whether it were a whistling wind, or the melodious voice of birds, among the spreading branches of trees, or a fall of water running down with violence,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "aut sonus validus praecipitarum petrarum aut ludentium animalium cursus invisus aut mugientium valida bestiarum vox aut resonans de altissimis montibus echo deficientes faciebat illos prae timore"
      en: "Or the mighty noise of stones tumbling down, or the running that could not be seen of beasts playing together, or the roaring voice of wild beasts, or a rebounding echo from the highest mountains: these things made them to swoon for fear."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "omnis enim orbis terrarum limpido luminabatur lumine et non inpeditis operibus continebatur"
      en: "For the whole world was enlightened with a clear light, and none were hindered in their labours."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "solis autem illis superposita erat gravis nox imago tenebrarum quae superventura illis erat ipsi ergo sibi erant graviores tenebris"
      en: "But over them only was spread a heavy night, an image of that darkness which was to come upon them. But they were to themselves more grievous than the darkness."
    status: { la: verified, en: verified }
