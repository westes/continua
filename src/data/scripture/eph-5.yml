# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eph
chapter: 5
verses:
  - n: 1
    text:
      la: "estote ergo imitatores Dei sicut filii carissimi"
      en: "Be ye therefore followers of God, as most dear children;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ambulate in dilectione sicut et Christus dilexit nos et tradidit se ipsum pro nobis oblationem et hostiam Deo in odorem suavitatis"
      en: "And walk in love, as Christ also hath loved us, and hath delivered himself for us, an oblation and a sacrifice to God for an odour of sweetness."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "fornicatio autem et omnis inmunditia aut avaritia nec nominetur in vobis sicut decet sanctos"
      en: "But fornication, and all uncleanness, or covetousness, let it not so much as be named among you, as becometh saints:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "aut turpitudo aut stultiloquium aut scurrilitas quae ad rem non pertinent sed magis gratiarum actio"
      en: "Or obscenity, or foolish talking, or scurrility, which is to no purpose; but rather giving of thanks."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "hoc enim scitote intellegentes quod omnis fornicator aut inmundus aut avarus quod est idolorum servitus non habet hereditatem in regno Christi et Dei"
      en: "For know you this and understand, that no fornicator, or unclean, or covetous person (which is a serving of idols), hath inheritance in the kingdom of Christ and of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nemo vos seducat inanibus verbis propter haec enim venit ira Dei in filios diffidentiae"
      en: "Let no man deceive you with vain words. For because of these things cometh the anger of God upon the children of unbelief."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nolite ergo effici participes eorum"
      en: "Be ye not therefore partakers with them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "eratis enim aliquando tenebrae nunc autem lux in Domino ut filii lucis ambulate"
      en: "For you were heretofore darkness, but now light in the Lord. Walk then as children of the light."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "fructus enim lucis est in omni bonitate et iustitia et veritate"
      en: "For the fruit of the light is in all goodness, and justice, and truth;"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "probantes quid sit beneplacitum Deo"
      en: "Proving what is well pleasing to God:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et nolite communicare operibus infructuosis tenebrarum magis autem et redarguite"
      en: "And have no fellowship with the unfruitful works of darkness, but rather reprove them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quae enim in occulto fiunt ab ipsis turpe est et dicere"
      en: "For the things that are done by them in secret, it is a shame even to speak of."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "omnia autem quae arguuntur a lumine manifestantur omne enim quod manifestatur lumen est"
      en: "But all things that are reproved, are made manifest by the light; for all that is made manifest is light."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "propter quod dicit surge qui dormis et exsurge a mortuis et inluminabit tibi Christus"
      en: "Wherefore he saith: Rise thou that sleepest, and arise from the dead: and Christ shall enlighten thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "videte itaque fratres quomodo caute ambuletis non quasi insipientes sed ut sapientes"
      en: "See therefore, brethren, how you walk circumspectly: not as unwise,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "redimentes tempus quoniam dies mali sunt"
      en: "But as wise: redeeming the time, because the days are evil."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "propterea nolite fieri inprudentes sed intellegentes quae sit voluntas Domini"
      en: "Wherefore become not unwise, but understanding what is the will of God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et nolite inebriari vino in quo est luxuria sed implemini Spiritu"
      en: "And be not drunk with wine, wherein is luxury; but be ye filled with the holy Spirit,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "loquentes vobismet ipsis in psalmis et hymnis et canticis spiritalibus cantantes et psallentes in cordibus vestris Domino"
      en: "Speaking to yourselves in psalms, and hymns, and spiritual canticles, singing and making melody in your hearts to the Lord;"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "gratias agentes semper pro omnibus in nomine Domini nostri Iesu Christi Deo et Patri"
      en: "Giving thanks always for all things, in the name of our Lord Jesus Christ, to God and the Father:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "subiecti invicem in timore Christi"
      en: "Being subject one to another, in the fear of Christ."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "mulieres viris suis subditae sint sicut Domino"
      en: "Let women be subject to their husbands, as to the Lord:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quoniam vir caput est mulieris sicut Christus caput est ecclesiae ipse salvator corporis"
      en: "Because the husband is the head of the wife, as Christ is the head of the church. He is the saviour of his body."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sed ut ecclesia subiecta est Christo ita et mulieres viris suis in omnibus"
      en: "Therefore as the church is subject to Christ, so also let the wives be to their husbands in all things."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "viri diligite uxores sicut et Christus dilexit ecclesiam et se ipsum tradidit pro ea"
      en: "Husbands, love your wives, as Christ also loved the church, and delivered himself up for it:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ut illam sanctificaret mundans lavacro aquae in verbo"
      en: "That he might sanctify it, cleansing it by the laver of water in the word of life:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ut exhiberet ipse sibi gloriosam ecclesiam non habentem maculam aut rugam aut aliquid eiusmodi sed ut sit sancta et inmaculata"
      en: "That he might present it to himself a glorious church, not having spot or wrinkle, or any; such thing; but that it should be holy, and without blemish."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ita et viri debent diligere uxores suas ut corpora sua qui suam uxorem diligit se ipsum diligit"
      en: "So also ought men to love their wives as their own bodies. He that loveth his wife, loveth himself."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "nemo enim umquam carnem suam odio habuit sed nutrit et fovet eam sicut et Christus ecclesiam"
      en: "For no man ever hated his own flesh; but nourisheth and cherisheth it, as also Christ doth the church:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quia membra sumus corporis eius de carne eius et de ossibus eius"
      en: "Because we are members of his body, of his flesh, and of his bones."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "propter hoc relinquet homo patrem et matrem suam et adherebit uxori suae et erunt duo in carne una"
      en: "For this cause shall a man leave his father and mother, and shall cleave to his wife, and they shall be two in one flesh."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "sacramentum hoc magnum est ego autem dico in Christo et in ecclesia"
      en: "This is a great sacrament; but I speak in Christ and in the church."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "verumtamen et vos singuli unusquisque suam uxorem sicut se ipsum diligat uxor autem ut timeat virum"
      en: "Nevertheless let every one of you in particular love his wife as himself: and let the wife fear her husband."
    status: { la: verified, en: verified }
