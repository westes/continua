# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 3
verses:
  - n: 1
    text:
      la: "haec sunt generationes Aaron et Mosi in die qua locutus est Dominus ad Mosen in monte Sinai"
      en: "These are the generations of Aaron and Moses in the day that the Lord spoke to Moses in mount Sinai."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et haec nomina filiorum Aaron primogenitus eius Nadab dein Abiu et Eleazar et Ithamar"
      en: "And these the names of the sons of Aaron: his firstborn Nadab, then Abiu, and Eleazar, and Ithamar."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "haec nomina filiorum Aaron sacerdotum qui uncti sunt et quorum repletae et consecratae manus ut sacerdotio fungerentur"
      en: "These the names of the sons of Aaron the priests that were anointed, and whose hands were filled and consecrated, to do the functions of priesthood."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "mortui sunt Nadab et Abiu cum offerrent ignem alienum in conspectu Domini in deserto Sinai absque liberis functique sunt sacerdotio Eleazar et Ithamar coram Aaron patre suo"
      en: "Now Nadab and Abiu died, without children, when they offered strange fire before the Lord, in the desert of Sinai: and Eleazar and Ithamar performed the priestly office in the presence of Aaron their father."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "adplica tribum Levi et fac stare in conspectu Aaron sacerdotis ut ministrent ei et excubent"
      en: "Bring the tribe of Levi, and make them stand in the sight of Aaron the priest to minister to him, and let them watch,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et observent quicquid ad cultum pertinet multitudinis coram tabernaculo testimonii"
      en: "And observe whatsoever appertaineth to the service of the multitude before the tabernacle of the testimony,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et custodiant vasa tabernaculi servientes in ministerio eius"
      en: "And let them keep the vessels of the tabernacle, serving in the ministry thereof."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dabisque dono Levitas"
      en: "And thou shalt give the Levites for a gift,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Aaron et filiis eius quibus traditi sunt a filiis Israhel Aaron autem et filios eius constitues super cultum sacerdotii externus qui ad ministrandum accesserit morietur"
      en: "To Aaron and to his sons, to whom they are delivered by the children of Israel. But thou shalt appoint Aaron and his sons over the service of priesthood. The stranger that approacheth to minister, shall be put to death."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying :"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ego tuli Levitas a filiis Israhel pro omni primogenito qui aperit vulvam in filiis Israhel eruntque Levitae mei"
      en: "I have taken the Levites from the children of Israel, for every firstborn that openeth the womb among the children of Israel, and the Levites shall be mine."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "meum est enim omne primogenitum ex quo percussi primogenitos in terra Aegypti sanctificavi mihi quicquid primum nascitur in Israhel ab homine usque ad pecus mei sunt ego Dominus"
      en: "For every firstborn is mine: since I struck the firstborn in the land of Egypt: I have sanctified to myself whatsoever is firstborn in Israel both of man and beast, they are mine: I am the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "locutus est Dominus ad Mosen in deserto Sinai dicens"
      en: "And the Lord spoke to Moses in the desert of Sinai, saying:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "numera filios Levi per domos patrum suorum et familias omnem masculum ab uno mense et supra"
      en: "Number the sons of Levi by the houses of their fathers and their families, every male from one month and upward."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "numeravit Moses ut praeceperat Dominus"
      en: "Moses numbered them as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et inventi sunt filii Levi per nomina sua Gerson et Caath et Merari"
      en: "And there were found sons of Levi by their names, Gerson and Caath and Merari."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "filii Gerson Lebni et Semei"
      en: "The sons of Gerson: Lebni and Semei."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "filii Caath Amram et Iessaar Hebron et Ozihel"
      en: "The sons of Caath: Amram, and Jesaar, Hebron and Oziel:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "filii Merari Mooli et Musi"
      en: "The sons of Merari: Moholi and Musi."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "de Gerson fuere familiae duae lebnitica et semeitica"
      en: "Of Gerson were two families, the Lebnites, and the Semeites:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quarum numeratus est populus sexus masculini ab uno mense et supra septem milia quingentorum"
      en: "Of which were numbered, people of the male sex from one month and upward, seven thousand five hundred."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "hii post tabernaculum metabuntur ad occidentem"
      en: "These shall pitch behind the tabernacle on the west,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sub principe Eliasaph filio Lahel"
      en: "Under their prince Eliasaph the son of Lael."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et habebunt excubias in tabernaculo foederis"
      en: "And their charge shall be in the tabernacle of the covenant:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ipsum tabernaculum et operimentum eius tentorium quod trahitur ante fores tecti foederis et cortinas atrii tentorium quoque quod adpenditur in introitu atrii tabernaculi et quicquid ad ritum altaris pertinet funes tabernaculi et omnia utensilia eius"
      en: "The tabernacle itself and the cover thereof, the hanging that is drawn before the doors of the tabernacle of the covenant, and the curtains of the court: the hanging also that is hanged in the entry of the court of the tabernacle, and whatsoever belongeth to the rite of the altar, the cords of the tabernacle, and all the furniture thereof."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cognatio Caath habebit populos Amramitas et Iessaaritas et Hebronitas et Ozihelitas hae sunt familiae Caathitarum recensitae per nomina sua"
      en: "Of the kindred of Caath come the families of the Amramites and Jesaarites and Hebronites and Ozielites. These are the families of the Caathites reckoned up by their names:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "omnes generis masculini ab uno mense et supra octo milia sescenti habebunt excubias sanctuarii"
      en: "All of the male sex from one month and upward, eight thousand six hundred: they shall have the guard of the sanctuary,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et castrametabuntur ad meridianam plagam"
      en: "And shall camp on the south side."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "princepsque eorum erit Elisaphan filius Ozihel"
      en: "And their prince shall be Elisaphan the son of Oziel:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et custodient arcam mensamque et candelabrum altaria et vasa sanctuarii in quibus ministratur et velum cunctamque huiuscemodi supellectilem"
      en: "And they shall keep the ark, and the table and the candlestick, the altars, and the vessels of the sanctuary, wherewith they minister, and the veil, and all the furniture of this kind."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "princeps autem principum Levitarum Eleazar filius Aaron sacerdotis erit super excubitores custodiae sanctuarii"
      en: "And the prince of the princes of the Levites, Eleazar, the son of Aaron the priest, shall be over them that watch for the guard of the sanctuary."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "at vero de Merari erunt populi Moolitae et Musitae recensiti per nomina sua"
      en: "And of Merari are the families of the Moholites, and Musites, reckoned up by their names :"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "omnes generis masculini ab uno mense et supra sex milia ducenti"
      en: "All of the male kind from one month and upward, six thousand two hundred."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "princeps eorum Surihel filius Abiahihel in plaga septentrionali castrametabuntur"
      en: "Their prince Suriel the son of Abihaiel: they shall camp on the north side."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "erunt sub custodia eorum tabulae tabernaculi et vectes et columnae ac bases earum et omnia quae ad cultum huiuscemodi pertinent"
      en: "Under their custody shall be the boards of the tabernacle, and the bars, and the pillars and their sockets, and all things that pertain to this kind of service:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "columnaeque atrii per circuitum cum basibus suis et paxilli cum funibus"
      en: "And the pillars of the court round about with their sockets, and the pins with their cords."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "castrametabuntur ante tabernaculum foederis id est ad orientalem plagam Moses et Aaron cum filiis suis habentes custodiam sanctuarii in medio filiorum Israhel quisquis alienus accesserit morietur"
      en: "Before the tabernacle of the covenant, that is to say on the east side, shall Moses and Aaron camp, with their sons, having the custody of the sanctuary, in the midst of the children of Israel. What stranger soever cometh unto it, shall be put to death."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "omnes Levitae quos numeraverunt Moses et Aaron iuxta praeceptum Domini per familias suas in genere masculino a mense uno et supra fuerunt viginti duo milia"
      en: "All the Levites, that Moses and Aaron numbered according to the precept of the Lord, by their families, of the male kind from one month and upward, were twenty-two thousand."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et ait Dominus ad Mosen numera primogenitos sexus masculini de filiis Israhel a mense uno et supra et habebis summam eorum"
      en: "And the Lord said to Moses: Number the firstborn of the male sex of the children of Israel, from one month and upward, and thou shalt take the sum of them."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "tollesque Levitas mihi pro omni primogenito filiorum Israhel ego sum Dominus et pecora eorum pro universis primogenitis pecoris filiorum Israhel"
      en: "And thou shalt take the Levites to me for all the firstborn of the children of Israel, I am the Lord: and their cattle for all the firstborn of the cattle of the children of Israel:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "recensuit Moses sicut praeceperat Dominus primogenitos filiorum Israhel"
      en: "Moses reckoned up, as the Lord had commanded, the firstborn of the children of Israel:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et fuerunt masculi per nomina sua a mense uno et supra viginti duo milia ducenti septuaginta tres"
      en: "And the males by their names, from one month and upward, were twenty-two thousand two hundred and seventy-three."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "locutusque est Dominus ad Mosen"
      en: "And the Lord spoke to Moses, saving:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "tolle Levitas pro primogenitis filiorum Israhel et pecora Levitarum pro pecoribus eorum eruntque Levitae mei ego sum Dominus"
      en: "Take the Levites for the firstborn of the children of Israel, and the cattle of the Levites for their cattle, and the Levites shall be mine. I am the Lord."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "in pretio autem ducentorum septuaginta trium qui excedunt numerum Levitarum de primogenitis filiorum Israhel"
      en: "But for the price of the two hundred and seventy-three, of the firstborn of the children of Israel, that exceed the number of the Levites,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "accipies quinque siclos per singula capita ad mensuram sanctuarii siclus habet obolos viginti"
      en: "Thou shalt take five sides for every head, according to the weight of the sanctuary. A sicle hath twenty obols."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "dabisque pecuniam Aaron et filiis eius pretium eorum qui supra sunt"
      en: "And then shalt give the money to Aaron and his sons, the price of them that are above."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "tulit igitur Moses pecuniam eorum qui fuerant amplius et quos redemerant a Levitis"
      en: "Moses therefore took the money of them that were above, and whom they had redeemed from the Levites,"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "pro primogenitis filiorum Israhel mille trecentorum sexaginta quinque siclorum iuxta pondus sanctuarii"
      en: "For the firstborn of the children of Israel, one thousand three hundred and sixty-five sicles, according to the weight of the sanctuary,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et dedit eam Aaroni et filiis eius iuxta verbum quod praeceperat sibi Dominus"
      en: "And gave it to Aaron and his sons, according to the word that the Lord had commanded him."
    status: { la: verified, en: verified }
