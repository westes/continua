# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 11
verses:
  - n: 1
    text:
      la: "tunc Holofernis dixit ei aequo animo esto et noli pavere in corde tuo quoniam ego numquam nocui virum qui voluit servire Nabuchodonosor regi"
      en: "Then Holofernes said to her: Be of good comfort, and fear not in thy heart: for I have never hurt a man that was willing to serve Nabuchodonosor the king."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "populus autem tuus si non contempsisset me non adlevassem lanceam meam super illum"
      en: "And if thy people had not despised me, I would never have lifted up my spear against them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nunc autem dic mihi qua ex causa recessisti ab illis et placuit tibi ut venires ad nos"
      en: "But now tell me, for what cause hast thou left them, and why it hath pleased thee to come to us?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixit illi Iudith sume verba ancillae tuae quoniam si secutus fueris verba ancillae tuae perfectam rem faciet Dominus tecum"
      en: "And Judith said to him: Receive the words of thy handmaid, for if thou wilt follow the words of thy handmaid, the Lord will do with thee a perfect thing."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "vivit enim Nabuchodonosor rex terrae et vivit virtus eius quae est in te ad correptionem omnium animarum errantium quoniam non solum homines serviunt illi per te sed et bestiae agri obtemperant illi"
      en: "For as Nabuchodonosor the king of the earth liveth, and his power liveth which is in thee for chastising of all straying souls: not only men serve him through thee, but also the beasts of the field obey him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nuntiatur enim industria animi tui universis gentibus et indicatum est omni saeculo quoniam tu solus bonus et potens es in omni regno eius et disciplina tua omnibus provinciis praedicatur"
      en: "For the industry of thy mind is spoken of among all nations, and it is told through the whole world, that thou only art excellent, and mighty in all his kingdom, and thy discipline is cried up in all provinces."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nec hoc latet quod locutus est Achior nec illud ignoratur quod ei iusseris evenire"
      en: "It is known also what Achior said, nor are we ignorant of what thou hast commanded to be done to him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "constat enim Deum nostrum sic peccatis offensum ut mandaverit per prophetas suos ad populum quod tradat eos pro peccatis suis"
      en: "For it is certain that our God is so offended with sins, that he hath sent word by his prophets to the people, that he will deliver them up for their sins."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et quoniam sciunt se offendisse Deum suum filii Israhel tremor tuus super ipsos est"
      en: "And because the children of Israel know they have offended their God, thy dread is upon them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "insuper etiam fames invasit eos et ab ariditate aquae iam inter mortuos conputantur"
      en: "Moreover also a famine hath come upon them, and for drought of water they are already to be counted among the dead."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "denique hoc ordinant ut interficiant pecora sua et sanguinem eorum bibant"
      en: "And they have a design even to kill their cattle, and to drink the blood of them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et sancta Domini sui quae praecepit Deus non contingi in frumento vino et oleo haec cogitaverunt inpendere et volunt consumere quae nec manibus deberent contingere ergo quoniam haec faciunt certum est quod in perditione dabuntur"
      en: "And the consecrated things of the Lord their God which God forbade them to touch, in corn, wine, and oil, these have they purposed to make use of, and they design to consume the things which they ought not to touch with their hands: therefore because they do these things, it is certain they will be given up to destruction."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quod ego ancilla tua cognoscens fugi ab illis et misit me Dominus haec ipsa nuntiare tibi"
      en: "And I thy handmaid knowing this, am fled from them, and the Lord hath sent me to tell thee these very things."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ego enim ancilla tua Deum colo etiam nunc apud te et exiet ancilla tua et orabo Deum"
      en: "For I thy handmaid worship God even now that I am with thee, and thy handmaid will go out, and I will pray to God,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dicet mihi quando eis reddat peccatum suum et veniens nuntiabo tibi ita ut ego adducam te per mediam Hierusalem et habebis omnem populum Israhel sicut oves quibus non est pastor et non latrabit vel unus contra te"
      en: "And he will tell me when he will repay them for their sins, and I will come and tell thee, so that I may bring thee through the midst of Jerusalem, and thou shalt have all the people of Israel, as sheep that have no shepherd, and there shall not so much as one dog bark against thee:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quoniam haec mihi dicta sunt per providentiam Dei"
      en: "Because these things are told me by the providence of God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et quoniam iratus est illis Deus hoc ipsa missa sum nuntiare tibi"
      en: "And because God is angry with them, I am sent to tell these very things to thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "placuerunt autem omnia verba haec coram Holoferne et coram pueris eius et mirabantur ad sapientiam eius et dicebant alter ad alterum"
      en: "And all these words pleased Holofernes, and his servants, and they admired her wisdom, and they said one to another:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non est talis mulier super terram in aspectu in pulchritudine et in sensu verborum"
      en: "There is not such another woman upon earth in look, in beauty, and in sense of words."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et dixit ad illam Holofernis bene fecit Deus qui misit te ante populum ut des illum tu in manibus nostris"
      en: "And Holofernes said to her: God hath done well who sent thee before the people, that thou mightest give them into our hands:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et quoniam bona est promissio tua si fecerit mihi hoc Deus tuus erit et meus Deus et tu in domo Nabuchodonosor magna eris et nomen tuum nominabitur in universa terra"
      en: "And because thy promise is good, if thy God shall do this for me, he shall also be my God, and thou shalt be great in the house of Nabuchodonosor, and thy name shall be renowned through all the earth."
    status: { la: verified, en: verified }
