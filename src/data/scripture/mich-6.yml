# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: mich
chapter: 6
verses:
  - n: 1
    text:
      la: "Audite quae Dominus loquitur: Surge, contende judicio adversum montes, et audiant colles vocem tuam."
      en: "Hear ye what the Lord saith: Arise, contend thou in judgment against the mountains, and let the hills hear thy voice."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Audiant montes judicium Domini, et fortia fundamenta terrae; quia judicium Domini cum populo suo, et cum Israel dijudicabitur."
      en: "Let the mountains hear the judgment of the Lord, and the strong foundations of the earth: for the Lord will enter into judgment with his people, and he will plead against Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Popule meus, quid feci tibi? aut quid molestus fui tibi? Responde mihi."
      en: "O my people, what have I done to thee, or in what have I molested thee? answer thou me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quia eduxi te de terra Aegypti, et de domo servientium liberavi te, et misi ante faciem tuam Moysen, et Aaron, et Mariam."
      en: "For I brought thee up out of the land of Egypt, and delivered thee out of the house of slaves: and I sent before thy face Moses, and Aaron, and Mary."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Popule meus, memento, quaeso, quid cogitaverit Balach, rex Moab, et quid responderit ei Balaam, filius Beor, de Setim usque ad Galgalam, ut cognosceres justitias Domini."
      en: "O my people, remember, I pray thee, what Balach the king of Moab purposed: and what Balaam the son of Beor answered him, from Setim to Galgal, that thou mightest know the justices of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quid dignum offeram Domino? curvabo genu Deo excelso? Numquid offeram ei holocautomata et vitulos anniculos?"
      en: "What shall I offer to the Lord that is worthy? wherewith shall I kneel before the high God? shall I offer holocausts unto him, and calves of a year old?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "numquid placari potest Dominus in millibus arietum, aut in multis millibus hircorum pinguium? numquid dabo primogenitum meum pro scelere meo, fructum ventris mei pro peccato animae meae?"
      en: "May the Lord be appeased with thousands of rams, or with many thousands of fat he goats? shall I give my firstborn for my wickedness, the fruit of my body for the sin of my soul?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Indicabo tibi, o homo, quid sit bonum, et quid Dominus requirat a te: utique facere judicium, et diligere misericordiam, et sollicitum ambulare cum Deo tuo."
      en: "I will shew thee, O man, what is good, and what the Lord requireth of thee: Verily, to do judgment, and to love mercy, and to walk solicitous with thy God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Vox Domini ad civitatem clamat, et salus erit timentibus nomen tuum: audite, tribus, et quis approbabit illud?"
      en: "The voice of the Lord crieth to the city, and salvation shall be to them that fear thy name: hear, O ye tribes, and who shall approve it?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Adhuc ignis in domo impii thesauri iniquitatis, et mensura minor irae plena."
      en: "As yet there is a fire in the house of the wicked, the treasures of iniquity, and a scant measure full of wrath."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Numquid justificabo stateram impiam, et saccelli pondera dolosa?"
      en: "Shall I justify wicked balances, and the deceitful weights of the bag?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "In quibus divites ejus repleti sunt iniquitate, et habitantes in ea loquebantur mendacium, et lingua eorum fraudulenta in ore eorum."
      en: "By which her rich men were filled with iniquity, and the inhabitants thereof have spoken lies, and their tongue was deceitful in their mouth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et ego ergo coepi percutere te perditione super peccatis tuis."
      en: "And I therefore began to strike thee with desolation for thy sins."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tu comedes, et non saturaberis, et humiliatio tua in medio tui: et apprehendes, et non salvabis, et quos salvaveris, in gladium dabo."
      en: "Thou shalt eat, but shalt not be filled: and thy humiliation shall be in the midst of thee: and thou shalt take hold, but shalt not save: and those whom thou shalt save, I will give up to the sword."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Tu seminabis, et non metes: tu calcabis olivam, et non ungeris oleo; et mustum, et non bibes vinum."
      en: "Thou shalt sow, but shalt not reap: thou shalt tread the olives, but shalt not be anointed with the oil: and the new wine, but shalt not drink the wine."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et custodisti praecepta Amri, et omne opus domus Achab, et ambulasti in voluntatibus eorum: ut darem te in perditionem, et habitantes in ea in sibilum, et opprobrium populi mei portabitis."
      en: "For thou hast kept the statutes of Amri, and all the works of the house of Achab: and thou hast walked according to their wills, that I should make thee a desolation, and the inhabitants thereof a hissing, and you shall bear the reproach of my people."
    status: { la: verified, en: verified }
