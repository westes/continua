# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: joan
chapter: 21
verses:
  - n: 1
    text:
      la: "postea manifestavit se iterum Iesus ad mare Tiberiadis manifestavit autem sic"
      en: "After this, Jesus shewed himself again to the disciples at the sea of Tiberias. And he shewed himself after this manner."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "erant simul Simon Petrus et Thomas qui dicitur Didymus et Nathanahel qui erat a Cana Galilaeae et filii Zebedaei et alii ex discipulis eius duo"
      en: "There were together Simon Peter, and Thomas, who is called Didymus, and Nathanael, who was of Cana of Galilee, and the sons of Zebedee, and two others of his disciples."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dicit eis Simon Petrus vado piscari dicunt ei venimus et nos tecum et exierunt et ascenderunt in navem et illa nocte nihil prendiderunt"
      en: "Simon Peter saith to them: I go a fishing. They say to him: We also come with thee. And they went forth, and entered into the ship: and that night they caught nothing."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "mane autem iam facto stetit Iesus in litore non tamen cognoverunt discipuli quia Iesus est"
      en: "But when the morning was come, Jesus stood on the shore: yet the disciples knew not that it was Jesus."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dicit ergo eis Iesus pueri numquid pulmentarium habetis responderunt ei non"
      en: "Jesus therefore said to them: Children, have you any meat? They answered him: No."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixit eis mittite in dexteram navigii rete et invenietis miserunt ergo et iam non valebant illud trahere a multitudine piscium"
      en: "He saith to them: Cast the net on the right side of the ship, and you shall find. They cast therefore; and now they were not able to draw it, for the multitude of fishes."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dicit ergo discipulus ille quem diligebat Iesus Petro Dominus est Simon Petrus cum audisset quia Dominus est tunicam succinxit se erat enim nudus et misit se in mare"
      en: "That disciple therefore whom Jesus loved, said to Peter: It is the Lord. Simon Peter, when he heard that it was the Lord, girt his coat about him, (for he was naked,) and cast himself into the sea."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "alii autem discipuli navigio venerunt non enim longe erant a terra sed quasi a cubitis ducentis trahentes rete piscium"
      en: "But the other disciples came in the ship, (for they were not far from the land, but as it were two hundred cubits,) dragging the net with fishes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ut ergo descenderunt in terram viderunt prunas positas et piscem superpositum et panem"
      en: "As soon then as they came to land, they saw hot coals lying, and a fish laid thereon, and bread."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dicit eis Iesus adferte de piscibus quos prendidistis nunc"
      en: "Jesus saith to them: Bring hither of the fishes which you have now caught."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ascendit Simon Petrus et traxit rete in terram plenum magnis piscibus centum quinquaginta tribus et cum tanti essent non est scissum rete"
      en: "Simon Peter went up, and drew the net to land, full of great fishes, one hundred and fifty-three. And although there were so many, the net was not broken."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dicit eis Iesus venite prandete et nemo audebat discentium interrogare eum tu quis es scientes quia Dominus esset"
      en: "Jesus saith to them: Come, and dine. And none of them who were at meat, durst ask him: Who art thou? knowing that it was the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et venit Iesus et accepit panem et dat eis et piscem similiter"
      en: "And Jesus cometh and taketh bread, and giveth them, and fish in like manner."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "hoc iam tertio manifestatus est Iesus discipulis cum surrexisset a mortuis"
      en: "This is now the third time that Jesus was manifested to his disciples, after he was risen from the dead."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cum ergo prandissent dicit Simoni Petro Iesus Simon Iohannis diligis me plus his dicit ei etiam Domine tu scis quia amo te dicit ei pasce agnos meos"
      en: "When therefore they had dined, Jesus saith to Simon Peter: Simon son of John, lovest thou me more than these? He saith to him: Yea, Lord, thou knowest that I love thee. He saith to him: Feed my lambs."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dicit ei iterum Simon Iohannis diligis me ait illi etiam Domine tu scis quia amo te dicit ei pasce agnos meos"
      en: "He saith to him again: Simon, son of John, lovest thou me? He saith to him: Yea, Lord, thou knowest that I love thee. He saith to him: Feed my lambs."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dicit ei tertio Simon Iohannis amas me contristatus est Petrus quia dixit ei tertio amas me et dicit ei Domine tu omnia scis tu scis quia amo te dicit ei pasce oves meas"
      en: "He said to him the third time: Simon, son of John, lovest thou me? Peter was grieved, because he had said to him the third time: Lovest thou me? And he said to him: Lord, thou knowest all things: thou knowest that I love thee. He said to him: Feed my sheep."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "amen amen dico tibi cum esses iunior cingebas te et ambulabas ubi volebas cum autem senueris extendes manus tuas et alius te cinget et ducet quo non vis"
      en: "Amen, amen I say to thee, when thou wast younger, thou didst gird thyself, and didst walk where thou wouldst. But when thou shalt be old, thou shalt stretch forth thy hands, and another shall gird thee, and lead thee whither thou wouldst not."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "hoc autem dixit significans qua morte clarificaturus esset Deum et hoc cum dixisset dicit ei sequere me"
      en: "And this he said, signifying by what death he should glorify God. And when he had said this, he saith to him: Follow me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "conversus Petrus vidit illum discipulum quem diligebat Iesus sequentem qui et recubuit in cena super pectus eius et dixit Domine quis est qui tradit te"
      en: "Peter turning about, saw that disciple whom Jesus loved following, who also leaned on his breast at supper, and said: Lord, who is he that shall betray thee?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "hunc ergo cum vidisset Petrus dicit Iesu Domine hic autem quid"
      en: "Him therefore when Peter had seen, he saith to Jesus: Lord, and what shall this man do?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dicit ei Iesus si sic eum volo manere donec veniam quid ad te tu me sequere"
      en: "Jesus saith to him: So I will have him to remain till I come, what is it to thee? follow thou me."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "exivit ergo sermo iste in fratres quia discipulus ille non moritur et non dixit ei Iesus non moritur sed si sic eum volo manere donec venio quid ad te"
      en: "This saying therefore went abroad among the brethren, that that disciple should not die. And Jesus did not say to him: He should not die; but, So I will have him to remain till I come, what is it to thee?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "hic est discipulus qui testimonium perhibet de his et scripsit haec et scimus quia verum est testimonium eius"
      en: "This is that disciple who giveth testimony of these things, and hath written these things; and we know that his testimony is true."
    status: { la: verified, en: verified }
