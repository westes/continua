# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 25
verses:
  - n: 1
    text:
      la: "Festus ergo cum venisset in provinciam post triduum ascendit Hierosolymam a Caesarea"
      en: "Now when Festus was come into the province, after three days, he went up to Jerusalem from Caesarea."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "adieruntque eum principes sacerdotum et primi Iudaeorum adversus Paulum et rogabant eum"
      en: "And the chief priests, and principal men of the Jews, went unto him against Paul: and they besought him,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "postulantes gratiam adversum eum ut iuberet perduci eum Hierusalem insidias tendentes ut eum interficerent in via"
      en: "Requesting favour against him, that he would command him to be brought to Jerusalem, laying wait to kill him in the way."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Festus autem respondit servari Paulum in Caesarea se autem maturius profecturum"
      en: "But Festus answered: That Paul was kept in Caesarea, and that he himself would very shortly depart thither."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui ergo in vobis ait potentes sunt descendentes simul si quod est in viro crimen accusent eum"
      en: "Let them, therefore, saith he, among you that are able, go down with me, and accuse him, if there be any crime in the man."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "demoratus autem inter eos dies non amplius quam octo aut decem descendit Caesaream et altera die sedit pro tribunali et iussit Paulum adduci"
      en: "And having tarried among them no more than eight or ten days, he went down to Caesarea, and the next day he sat in the judgment seat; and commanded Paul to be brought."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui cum perductus esset circumsteterunt eum qui ab Hierosolyma descenderant Iudaei multas et graves causas obicientes quas non poterant probare"
      en: "Who being brought, the Jews stood about him, who were come down from Jerusalem, objecting many and grievous causes, which they could not prove;"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Paulo autem rationem reddente quoniam neque in legem Iudaeorum neque in templum neque in Caesarem quicquam peccavi"
      en: "Paul making answer for himself: Neither against the law of the Jews, nor against the temple, nor against Caesar, have I offended in any thing."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Festus autem volens Iudaeis gratiam praestare respondens Paulo dixit vis Hierosolymam ascendere et ibi de his iudicari apud me"
      en: "But Festus, willing to shew the Jews a pleasure, answering Paul, said: Wilt thou go up to Jerusalem, and there be judged of these things before me?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixit autem Paulus ad tribunal Caesaris sto ubi me oportet iudicari Iudaeis non nocui sicut tu melius nosti"
      en: "Then Paul said: I stand at Caesar's judgment seat, where I ought to be judged. To the Jews I have done no injury, as thou very well knowest."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si enim nocui aut dignum morte aliquid feci non recuso mori si vero nihil est eorum quae hii accusant me nemo potest me illis donare Caesarem appello"
      en: "For if I have injured them, or have committed any thing worthy of death, I refuse not to die. But if there be none of these things whereof they accuse me, no man may deliver me to them: I appeal to Caesar."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tunc Festus cum consilio locutus respondit Caesarem appellasti ad Caesarem ibis"
      en: "Then Festus having conferred with the council, answered: Hast thou appealed to Caesar? To Caesar shalt thou go."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et cum dies aliquot transacti essent Agrippa rex et Bernice descenderunt Caesaream ad salutandum Festum"
      en: "And after some days, king Agrippa and Bernice came down to Caesarea to salute Festus."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et cum dies plures ibi demorarentur Festus regi indicavit de Paulo dicens vir quidam est derelictus a Felice vinctus"
      en: "And as they tarried there many days, Festus told the king of Paul, saying: A certain man was left prisoner by Felix."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "de quo cum essem Hierosolymis adierunt me principes sacerdotum et seniores Iudaeorum postulantes adversus illum damnationem"
      en: "About whom, when I was at Jerusalem, the chief priests, and the ancients of the Jews, came unto me, desiring condemnation against him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ad quos respondi quia non est consuetudo Romanis donare aliquem hominem priusquam is qui accusatur praesentes habeat accusatores locumque defendendi accipiat ad abluenda crimina"
      en: "To whom I answered: It is not the custom of the Romans to condemn any man, before that he who is accused have his accusers present, and have liberty to make his answer, to clear himself of the things laid to his charge."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cum ergo huc convenissent sine ulla dilatione sequenti die sedens pro tribunali iussi adduci virum"
      en: "When therefore they were come hither, without any delay, on the day following, sitting in the judgment seat, I commanded the man to be brought."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "de quo cum stetissent accusatores nullam causam deferebant de quibus ego suspicabar malum"
      en: "Against whom, when the accusers stood up, they brought no accusation of things which I thought ill of:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quaestiones vero quasdam de sua superstitione habebant adversus eum et de quodam Iesu defuncto quem adfirmabat Paulus vivere"
      en: "But had certain questions of their own superstition against him, and of one Jesus deceased, whom Paul affirmed to be alive."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "haesitans autem ego de huiusmodi quaestione dicebam si vellet ire Hierosolymam et ibi iudicari de istis"
      en: "I therefore being in a doubt of this manner of question, asked him whether he would go to Jerusalem, and there be judged of these things."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Paulo autem appellante ut servaretur ad Augusti cognitionem iussi servari eum donec mittam eum ad Caesarem"
      en: "But Paul appealing to be reserved unto the hearing of Augustus, I commanded him to be kept, till I might send him to Caesar."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Agrippa autem ad Festum volebam et ipse hominem audire cras inquit audies eum"
      en: "And Agrippa said to Festus: I would also hear the man, myself. To morrow, said he, thou shalt hear him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "altera autem die cum venisset Agrippa et Bernice cum multa ambitione et introissent in auditorium cum tribunis et viris principalibus civitatis et iubente Festo adductus est Paulus"
      en: "And on the next day, when Agrippa and Bernice were come with great pomp, and had entered into the hall of audience, with the tribunes, and principal men of the city, at Festus' commandment, Paul was brought forth."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et dixit Festus Agrippa rex et omnes qui simul adestis nobiscum viri videtis hunc de quo omnis multitudo Iudaeorum interpellavit me Hierosolymis petens et hic clamantes non oportere eum vivere amplius"
      en: "And Festus saith: King Agrippa, and all ye men who are here present with us, you see this man, about whom all the multitude of the Jews dealt with me at Jerusalem, requesting and crying out that he ought not to live any longer."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ego vero conperi nihil dignum eum morte admisisse ipso autem hoc appellante Augustum iudicavi mittere"
      en: "Yet have I found nothing that he hath committed worthy of death. But forasmuch as he himself hath appealed to Augustus, I have determined to send him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "de quo quid certum scribam domino non habeo propter quod produxi eum ad vos et maxime ad te rex Agrippa ut interrogatione facta habeam quid scribam"
      en: "Of whom I have nothing certain to write to my lord. For which cause I have brought him forth before you, and especially before thee, O king Agrippa, that examination being made, I may have what to write."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sine ratione enim mihi videtur mittere vinctum et causas eius non significare"
      en: "For it seemeth to me unreasonable to send a prisoner, and not to signify the things laid to his charge."
    status: { la: verified, en: verified }
