# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 3
verses:
  - n: 1
    text:
      la: "in diebus autem illis venit Iohannes Baptista praedicans in deserto Iudaeae"
      en: "And in those days cometh John the Baptist preaching in the desert of Judea."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et dicens paenitentiam agite adpropinquavit enim regnum caelorum"
      en: "And saying: Do penance: for the kingdom of heaven is at hand."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "hic est enim qui dictus est per Esaiam prophetam dicentem vox clamantis in deserto parate viam Domini rectas facite semitas eius"
      en: "For this is he that was spoken of by Isaias the prophet, saying: A voice of one crying in the desert, Prepare ye the way of the Lord, make straight his paths."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ipse autem Iohannes habebat vestimentum de pilis camelorum et zonam pelliciam circa lumbos suos esca autem eius erat lucustae et mel silvestre"
      en: "And the same John had his garment of camels' hair, and a leathern girdle about his loins: and his meat was locusts and wild honey."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tunc exiebat ad eum Hierosolyma et omnis Iudaea et omnis regio circa Iordanen"
      en: "Then went out to him Jerusalem and all Judea, and all the country about Jordan:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et baptizabantur in Iordane ab eo confitentes peccata sua"
      en: "And were baptized by him in the Jordan, confessing their sins."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "videns autem multos Pharisaeorum et Sadducaeorum venientes ad baptismum suum dixit eis progenies viperarum quis demonstravit vobis fugere a futura ira"
      en: "And seeing many of the Pharisees and Sadducees coming to his baptism, he said to them: Ye brood of vipers, who hath shewed you to flee from the wrath to come?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "facite ergo fructum dignum paenitentiae"
      en: "Bring forth therefore fruit worthy of penance."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ne velitis dicere intra vos patrem habemus Abraham dico enim vobis quoniam potest Deus de lapidibus istis suscitare filios Abrahae"
      en: "And think not to say within yourselves, We have Abraham for our father. For I tell you that God is able of these stones to raise up children to Abraham."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "iam enim securis ad radicem arborum posita est omnis ergo arbor quae non facit fructum bonum exciditur et in ignem mittitur"
      en: "For now the axe is laid to the root of the trees. Every tree therefore that doth not yield good fruit, shall be cut down, and cast into the fire."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ego quidem vos baptizo in aqua in paenitentiam qui autem post me venturus est fortior me est cuius non sum dignus calciamenta portare ipse vos baptizabit in Spiritu Sancto et igni"
      en: "I indeed baptize you in the water unto penance, but he that shall come after me, is mightier than I, whose shoes I am not worthy to bear; he shall baptize you in the Holy Ghost and fire."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cuius ventilabrum in manu sua et permundabit aream suam et congregabit triticum suum in horreum paleas autem conburet igni inextinguibili"
      en: "Whose fan is in his hand, and he will thoroughly cleanse his floor and gather his wheat into the barn; but the chaff he will burn with unquenchable fire."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tunc venit Iesus a Galilaea in Iordanen ad Iohannem ut baptizaretur ab eo"
      en: "Then cometh Jesus from Galilee to the Jordan, unto John, to be baptized by him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Iohannes autem prohibebat eum dicens ego a te debeo baptizari et tu venis ad me"
      en: "But John stayed him, saying: I ought to be baptized by thee, and comest thou to me?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "respondens autem Iesus dixit ei sine modo sic enim decet nos implere omnem iustitiam tunc dimisit eum"
      en: "And Jesus answering, said to him: Suffer it to be so now. For so it becometh us to fulfill all justice. Then he suffered him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "baptizatus autem confestim ascendit de aqua et ecce aperti sunt ei caeli et vidit Spiritum Dei descendentem sicut columbam venientem super se"
      en: "And Jesus being baptized, forthwith came out of the water: and lo, the heavens were opened to him: and he saw the Spirit of God descending as a dove, and coming upon him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ecce vox de caelis dicens hic est Filius meus dilectus in quo mihi conplacui"
      en: "And behold a voice from heaven, saying: This is my beloved Son, in whom I am well pleased."
    status: { la: verified, en: verified }
