# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 3
verses:
  - n: 1
    text:
      la: "In diebus autem illis venit Joannes Baptista praedicans in deserto Judaeae,"
      en: "And in those days cometh John the Baptist preaching in the desert of Judea."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et dicens: Poenitentiam agite: appropinquavit enim regnum caelorum."
      en: "And saying: Do penance: for the kingdom of heaven is at hand."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Hic est enim, qui dictus est per Isaiam prophetam dicentem: Vox clamantis in deserto: Parate viam Domini: rectas facite semitas ejus."
      en: "For this is he that was spoken of by Isaias the prophet, saying: A voice of one crying in the desert, Prepare ye the way of the Lord, make straight his paths."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ipse autem Joannes habebat vestimentum de pilis camelorum, et zonam pelliceam circa lumbos suos: esca autem ejus erat locustae, et mel silvestre."
      en: "And the same John had his garment of camels' hair, and a leathern girdle about his loins: and his meat was locusts and wild honey."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tunc exibat ad eum Jerosolyma, et omnis Judaea, et omnis regio circa Jordanem;"
      en: "Then went out to him Jerusalem and all Judea, and all the country about Jordan:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et baptizabantur ab eo in Jordane, confitentes peccata sua."
      en: "And were baptized by him in the Jordan, confessing their sins."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Videns autem multos pharisaeorum, et sadducaeorum, venientes ad baptismum suum, dixit eis: Progenies viperarum, quis demonstravit vobis fugere a ventura ira?"
      en: "And seeing many of the Pharisees and Sadducees coming to his baptism, he said to them: Ye brood of vipers, who hath shewed you to flee from the wrath to come?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Facite ergo fructum dignum poenitentiae."
      en: "Bring forth therefore fruit worthy of penance."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ne velitis dicere intra vos: Patrem habemus Abraham. Dico enim vobis quoniam potens est Deus de lapidibus istis suscitare filios Abrahae."
      en: "And think not to say within yourselves, We have Abraham for our father. For I tell you that God is able of these stones to raise up children to Abraham."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Jam enim securis ad radicem arborum posita est. Omnis ergo arbor, quae non facit fructum bonum, excidetur, et in ignem mittetur."
      en: "For now the axe is laid to the root of the trees. Every tree therefore that doth not yield good fruit, shall be cut down, and cast into the fire."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ego quidem baptizo vos in aqua in poenitentiam: qui autem post me venturus est, fortior me est, cujus non sum dignus calceamenta portare: ipse vos baptizabit in Spiritu Sancto, et igni."
      en: "I indeed baptize you in the water unto penance, but he that shall come after me, is mightier than I, whose shoes I am not worthy to bear; he shall baptize you in the Holy Ghost and fire."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cujus ventilabrum in manu sua: et permundabit aream suam: et congregabit triticum suum in horreum, paleas autem comburet igni inextinguibili."
      en: "Whose fan is in his hand, and he will thoroughly cleanse his floor and gather his wheat into the barn; but the chaff he will burn with unquenchable fire."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tunc venit Jesus a Galilaea in Jordanem ad Joannem, ut baptizaretur ab eo."
      en: "Then cometh Jesus from Galilee to the Jordan, unto John, to be baptized by him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Joannes autem prohibebat eum, dicens: Ego a te debeo baptizari, et tu venis ad me?"
      en: "But John stayed him, saying: I ought to be baptized by thee, and comest thou to me?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Respondens autem Jesus, dixit ei: Sine modo: sic enim decet nos implere omnem justitiam. Tunc dimisit eum."
      en: "And Jesus answering, said to him: Suffer it to be so now. For so it becometh us to fulfill all justice. Then he suffered him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Baptizatus autem Jesus, confestim ascendit de aqua, et ecce aperti sunt ei caeli: et vidit Spiritum Dei descendentem sicut columbam, et venientem super se."
      en: "And Jesus being baptized, forthwith came out of the water: and lo, the heavens were opened to him: and he saw the Spirit of God descending as a dove, and coming upon him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ecce vox de caelis dicens: Hic est Filius meus dilectus, in quo mihi complacui."
      en: "And behold a voice from heaven, saying: This is my beloved Son, in whom I am well pleased."
    status: { la: verified, en: verified }
