# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 34
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Praecipe filiis Israel, et dices ad eos: Cum ingressi fueritis terram Chanaan, et in possessionem vobis sorte ceciderit, his finibus terminabitur."
      en: "Command the children of Israel, and then shalt say to them: When you are entered into the land of Chanaan, and it shall be fallen into your possession by lot, it shall be bounded by these limits:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Pars meridiana incipiet a solitudine Sin, quae est juxta Edom: et habebit terminos contra orientem mare salsissimum."
      en: "The south side shall begin from the wilderness of Sin, which is by Edom: and shall have the most salt sea for its furthest limits eastward:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui circuibunt australem plagam per ascensum Scorpionis, ita ut transeant in Senna, et perveniant a meridie usque ad Cadesbarne, unde egredientur confinia ad villam nomine Adar, et tendent usque ad Asemona."
      en: "Which limits shall go round on the south side by the ascent of the Scorpion and so into Senna, and reach toward the south as far as Cadesbarne, from whence the frontiers shall go out to the town called Adar, and shall reach as far as Asemona."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ibitque per gyrum terminus ab Asemona usque ad torrentem Aegypti, et maris magni littore finietur."
      en: "And the limits shall fetch a compass from Asemona to the torrent of Egypt, and shall end in the shore of the great sea."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Plaga autem occidentalis a mari magno incipiet, et ipso fine claudetur."
      en: "And the west side shall begin from the great sea, and the same shall be the end thereof."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Porro ad septentrionalem plagam a mari magno termini incipient, pervenientes usque ad montem altissimum,"
      en: "But toward the north side the borders shall begin from the great sea, reaching to the most high mountain,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "a quo venient in Emath usque ad terminos Sedada:"
      en: "From which they shall come to Emath, as far as the borders of Sedada:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ibuntque confinia usque ad Zephrona, et villam Enan. Hi erunt termini in parte aquilonis."
      en: "And the limits shall go as far as Zephrona, and the village of Enan. These shall be the borders on the north side."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Inde metabuntur fines contra orientalem plagam de villa Enan usque Sephama,"
      en: "From thence they shall mark out the bounds towards the east side from the village of Enan unto Sephama."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et de Sephama descendent termini in Rebla contra fontem Daphnim: inde pervenient contra orientem ad mare Cenereth,"
      en: "And from Sephama the bounds shall go down to Rebla over against the fountain of Daphnis: from thence they shall come eastward to the sea of Cenereth,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et tendent usque ad Jordanem, et ad ultimum salsissimo claudentur mari. Hanc habebitis terram per fines suos in circuitu."
      en: "And shall reach as far as the Jordan, and at the last shall be closed in by the most salt sea. This shall be your land with its borders round about."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Praecepitque Moyses filiis Israel, dicens: Haec erit terra, quam possidebitis sorte, et quam jussit Dominus dari novem tribubus, et dimidiae tribui."
      en: "And Moses commanded the children of Israel, saying: This shall be the land which you shall possess by lot, and which the Lord hath commanded to be given to the nine tribes, and to the half tribe."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tribus enim filiorum Ruben per familias suas, et tribus filiorum Gad juxta cognationum numerum, media quoque tribus Manasse,"
      en: "For the tribe of the children of Ruben by their families, and the tribe of the children of Gad according to the number of their kindreds, and half of the tribe of Manasses,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "id est, duae semis tribus, acceperunt partem suam trans Jordanem contra Jericho ad orientalem plagam."
      en: "That is, two tribes and a half, have received their portion beyond the Jordan over against Jericho at the east side."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et ait Dominus ad Moysen:"
      en: "And the Lord said to Moses:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Haec sunt nomina virorum qui terram vobis divident, Eleazar sacerdos, et Josue filius Nun,"
      en: "These are the names of the men, that shall divide the land unto you: Eleazar the priest, and Josue the son of Nun,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et singuli principes de tribubus singulis,"
      en: "And one prince of every tribe,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quorum ista sunt vocabula. De tribu Juda, Caleb filius Jephone."
      en: "Whose names are these: Of the tribe of Juda, Caleb the son of Jephone."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "De tribu Simeon, Samuel filius Ammiud."
      en: "Of the tribe of Simeon, Samuel the son of Ammiud."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "De tribu Benjamin, Elidad filius Chaselon."
      en: "Of the tribe of Benjamin, Elidad the son of Chaselon."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "De tribu filiorum Dan, Bocci filius Jogli."
      en: "Of the tribe of the children of Dan, Bocci the son of Jogli."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Filiorum Joseph de tribu Manasse, Hanniel filius Ephod."
      en: "Of the children of Joseph of the tribe of Manasses, Hanniel the son of Ephod."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "De tribu Ephraim, Camuel filius Sephthan."
      en: "Of the tribe of Ephraim, Camuel the son of Sephtan."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "De tribu Zabulon, Elisaphan filius Pharnach."
      en: "Of the tribe of Zabulon, Elisaphan the son of Pharnach."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "De tribu Issachar, dux Phaltiel filius Ozan."
      en: "Of the tribe of Issachar, Phaltiel the prince, the son of Ozan."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "De tribu Aser, Ahiud filius Salomi."
      en: "Of the tribe of Aser, Ahiud the son of Salomi."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "De tribu Nephthali, Phedael filius Ammiud."
      en: "Of the tribe of Nephtali: Phedael the son of Ammiud."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Hi sunt, quibus praecepit Dominus ut dividerent filiis Israel terram Chanaan."
      en: "These are they whom the Lord hath commanded to divide the land of Chanaan to the children of Israel."
    status: { la: verified, en: verified }
