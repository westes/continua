# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: eccl
chapter: 8
verses:
  - n: 1
    text:
      la: "sapientia hominis lucet in vultu eius et potentissimus faciem illius commutavit"
      en: "The wisdom of a man shineth in his countenance, and the most mighty will change his face."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ego os regis observo et praecepta iuramenti Dei"
      en: "I observe the mouth of the king, and the commandments of the oath of God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ne festines recedere a facie eius neque permaneas in opere malo quia omne quod voluerit faciet"
      en: "Be not hasty to depart from his face, and do not continue in an evil work: for he will do all that pleaseth him:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et sermo illius potestate plenus est nec dicere ei quisquam potest quare ita facis"
      en: "And his word is full of power: neither can any man say to him: Why dost thou so?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui custodit praeceptum non experietur quicquam mali tempus et responsionem cor sapientis intellegit"
      en: "He that keepeth the commandments shall find no evil. The heart of a wise man understandeth time and answer."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "omni negotio tempus est et oportunitas et multa hominis adflictio"
      en: "There is a time and opportunity for every business, and great affliction for man:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia ignorat praeterita et ventura nullo scire potest nuntio"
      en: "Because he is ignorant of things past, and things to come he cannot know by any messenger."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "non est in hominis dicione prohibere spiritum nec habet potestatem in die mortis nec sinitur quiescere ingruente bello neque salvabit impietas impium"
      en: "It is not in man's power to stop the spirit, neither hath he power in the day of death, neither is he suffered to rest when war is at hand, neither shall wickedness save the wicked."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "omnia haec consideravi et dedi cor meum in cunctis operibus quae fiunt sub sole interdum dominatur homo homini in malum suum"
      en: "All these things I have considered, and applied my heart to all the works that are done under the sun. Sometimes one man ruleth over another to his own hurt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vidi impios sepultos qui etiam cum adviverent in loco sancto erant et laudabantur in civitate quasi iustorum operum sed et hoc vanitas est"
      en: "I saw the wicked buried: who also when they were yet living were in the holy place, and were praised in the city as men of just works: but this also is vanity."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "etenim quia non profertur cito contra malos sententia absque ullo timore filii hominum perpetrant mala"
      en: "For because sentence is not speedily pronounced against the evil, the children of men commit evils without any fear."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "attamen ex eo quod peccator centies facit malum et per patientiam sustentatur ego cognovi quod erit bonum timentibus Deum qui verentur faciem eius"
      en: "But though a sinner do evil a hundred times, and by patience be borne withal, I know from thence that it shall be well with them that fear God, who dread his face."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "non sit bonum impio nec prolongentur dies eius sed quasi umbra transeant qui non timent faciem Dei"
      en: "But let it not be well with the wicked, neither let his days be prolonged, but as a shadow let them pass away that fear not the face of the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "est et alia vanitas quae fit super terram sunt iusti quibus multa proveniunt quasi opera egerint impiorum et sunt impii qui ita securi sunt quasi iustorum facta habeant sed et hoc vanissimum iudico"
      en: "There is also another vanity, which is done upon the earth. There are just men to whom evils happen, as though they had done the works of the wicked: and there are wicked men, who are as secure, as though they had the deeds of the just: but this also I judge most vain."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "laudavi igitur laetitiam quod non esset homini bonum sub sole nisi quod comederet et biberet atque gauderet et hoc solum secum auferret de labore suo in diebus vitae quos dedit ei Deus sub sole"
      en: "Therefore I commended mirth, because there was no good for a man under the sun, but to eat, and drink, and be merry, and that he should take nothing else with him of his labour in the days of his life, which God hath given him under the sun."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et adposui cor meum ut scirem sapientiam et intellegerem distentionem quae versatur in terra est homo qui diebus ac noctibus somnum oculis non capit"
      en: "And I applied my heart to know wisdom, and to understand the distraction that is upon earth: for there are some that day and night take no sleep with their eyes."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et intellexi quod omnium operum Dei nullam possit homo invenire rationem eorum quae fiunt sub sole et quanto plus laboraverit ad quaerendum tanto minus inveniat etiam si dixerit sapiens se nosse non poterit repperire"
      en: "And I understood that man can find no reason of all those works of God that are done under the sun: and the more he shall labour to seek, so much the less shall he find: yea, though the wise man shall say, that he knoweth it, he shall not be able to find it."
    status: { la: verified, en: verified }
