# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1mach
chapter: 13
verses:
  - n: 1
    text:
      la: "et audivit Simon quod congregavit Tryfon exercitum copiosum ut veniret in terram Iuda et adtereret eam"
      en: "Now Simon heard that Tryphon was gathering together a very great army, to invade the land of Juda, and to destroy it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "videns quia in tremore populus est et timore ascendit Hierusalem et congregavit populum"
      en: "And seeing that the people was in dread, and in fear, he went up to Jerusalem, and assembled the people:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et adhortans dixit vos scitis quanta ego et fratres mei et domus patris mei fecimus pro legibus et pro sanctis proelia et angustias quales vidimus"
      en: "And exhorted them, saying: You know what great battles I and my brethren, and the house of my father, have fought for the laws, and the sanctuary, and the distresses that we have seen:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "horum gratia perierunt fratres mei omnes propter Israhel et relictus sum ego solus"
      en: "By reason whereof all my brethren have lost their lives for Israel's sake, and I am left alone."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et nunc non mihi contingat parcere animae meae in omni tempore tribulationis non enim melior sum fratribus meis"
      en: "And now far be it from me to spare my life in any time of trouble: for I am not better than my brethren."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "vindicabo itaque gentem meam et sancta natosque vestros et uxores quia congregatae sunt universae gentes conterere nos inimicitiae gratis"
      en: "I will avenge then my nation and the sanctuary, and our children, and wives: for all the heathens are gathered together to destroy us out of mere malice."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et accensus est spiritus populi simul ut audivit sermones istos"
      en: "And the spirit of the people was enkindled as soon as they heard these words."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et responderunt voce magna dicentes tu es dux noster loco Iudae et Ionathae fratris tui"
      en: "And they answered with a loud voice, saying: Thou art our leader in the place of Judas, and Jonathan thy brother."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "pugna proelium nostrum et omnia quaecumque dixeris nobis faciemus"
      en: "Fight thou our battles, and we will do whatsoever thou shalt say to us."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et congregans omnes viros bellatores adceleravit consummare omnes muros Hierusalem et munivit eam in gyro"
      en: "So gathering together all the men of war, he made haste to finish all the walls of Jerusalem, and he fortified it round about."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et misit Ionathan filium Absalomi et cum eo exercitum novum in Ioppen et eiectis his qui erant in ea mansit illic ipse"
      en: "And he sent Jonathan the son of Absalom, and with him a new army into Joppe, and he cast out them that were in it, and himself remained there."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et movit Tryfon a Ptolomaida cum exercitu multo ut veniret in terram Iuda et Ionatha cum eo in custodia"
      en: "And Tryphon removed from Ptolemais with a great army, to invade the land of Juda, and Jonathan was with him in custody."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Simon autem adplicuit in Addus contra faciem campi"
      en: "But Simon pitched in Addus, over against the plain."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et ut cognovit Tryfon quia surrexit Simon in loco Ionathae fratris sui misit ad eum legatos"
      en: "And when Tryphon understood that Simon was risen up in the place of his brother Jonathan, and that he meant to join battle with him, he sent messengers to him,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dicens pro argento quod debebat frater tuus Ionathas in ratione regis detinuimus eum"
      en: "Saying: We have detained thy brother Jonathan for the money that he owed in the king's account, by reason of the affairs which he had the management of."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et nunc mitte argenti talenta centum et duos filios eius obsides ut non dimissus fugiat a nobis et remittemus eum"
      en: "But now send a hundred talents of silver, and his two sons for hostages, that when he is set at liberty he may not revolt from us, and we will release him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et cognovit Simon quia cum dolo loquitur secum iussit tamen dari argentum et pueros ne inimicitiam magnam sumeret ad Israhel populum dicentem"
      en: "Now Simon knew that he spoke deceitfully to him, nevertheless he ordered the money, and the children to be sent: lest he should bring upon himself a great hatred of the people of Israel, who might have said:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quia non misit argentum et pueros propterea periit"
      en: "Because he sent not the money, and the children, therefore is he lost."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et mentitus est et non dimisit Ionathan"
      en: "So he sent the children, and the hundred talents: and he lied, and did not let Jonathan go."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et post haec venit Tryfon intra regionem ut contereret eam et gyraverunt per viam quae ducit Ador et Simon et castra eius ambulabant in omnem locum quocumque ibant"
      en: "And after this Tryphon entered within the country, to destroy it: and they went about by the way that leadeth to Ador: and Simon and his army marched to every place whithersoever they went."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui autem in arce erant miserunt ad Tryfonem legatos ut festinaret venire per desertum et mitteret illis alimonias"
      en: "And they that were in the castle, sent messengers to Tryphon, that he should make haste to come through the desert, and sent them victuals."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et paravit Tryfon omnem equitatum ut veniret illa nocte erat autem nix valde multa et non venit in Galaditin"
      en: "And Tryphon made ready all his horsemen to come that night: but there fell a very great snow, and he came not into the country of Galaad."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et cum adpropiasset Baschama occidit Ionathan et filios eius"
      en: "And when he approached to Bascama, he slew Jonathan and his sons there."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et convertit Tryfon et abiit in terram suam"
      en: "And Tryphon returned, and went into his own country."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et misit Simon et accepit ossa Ionathae fratris sui et sepelivit ea in Modin civitate patrum eius"
      en: "And Simon sent, and took the bones of Jonathan his brother, and buried them in Modin, in the city of his fathers."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et planxerunt eum omnis Israhel planctu magno et luxerunt eum dies multos"
      en: "And all Israel bewailed him with great lamentation: and they mourned for him many days."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et aedificavit Simon super sepulchrum patris sui et fratrum suorum aedificium altum visu lapide polito retro et ante"
      en: "And Simon built over the sepulchre of his father and of his brethren, a building lofty to the sight, of polished stone behind and before:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et statuit septem pyromidas unam contra unam patri et matri et quattuor fratribus"
      en: "And he set up seven pyramids one against another for his father and his mother, and his four brethren:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et his circumposuit columnas magnas et super columnas arma ad memoriam aeternam et iuxta arma naves sculptas quae viderentur ab omnibus navigantibus mare"
      en: "And round about these he set great pillars: and upon the pillars arms for a perpetual memory: and by the arms ships carved, which might be seen by all that sailed on the sea."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "hoc est sepulchrum quod fecit in Modin usque in hunc diem"
      en: "This is the sepulchre that he made in Modin even unto this day."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Tryfon autem cum iter faceret cum Antiocho rege adulescente dolo occidit eum"
      en: "But Tryphon when he was upon a journey with the young king Antiochus, treacherously slew him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et regnavit loco eius et inposuit sibi diadema Asiae et fecit plagam magnam in terra"
      en: "And he reigned in his place, and put on the crown of Asia: and brought great evils upon the land."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et aedificavit Simon praesidia Iudaeae muniens ea turribus excelsis et muris magnis et portis et seris et posuit alimenta in munitionibus"
      en: "And Simon built up the strong holds of Judea, fortifying them with high towers, and great walls, and gates, and bars: and he stored up victuals in the fortresses."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et elegit Simon viros et misit ad Demetrium regem ut faceret remissionem regioni quia actus omnes Tryfonis per direptionem fuerant gesti"
      en: "And Simon chose men and sent to king Demetrius, to the end that he should grant an immunity to the land: for all that Tryphon did was to spoil."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et Demetrius rex ad verba ista respondit et scripsit epistulam talem"
      en: "And king Demetrius in answer to this request, wrote a letter in this manner:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "rex Demetrius Simoni summo sacerdoti et amico regum et senioribus et genti Iudaeorum salutem"
      en: "King Demetrius to Simon the high priest, and friend of kings, and to the ancients, and to the nation of the Jews, greeting."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "coronam auream et baen quam misistis suscepimus et parati sumus facere vobiscum pacem magnam et scribere praepositis regis remittere vobis quae indulsimus"
      en: "The golden crown, and the palm, which you sent, we have received: and we are ready to make a firm peace with you, and to write to the king's chief officers to release you the things that we have released."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "quaecumque enim constituimus vobis constant munitiones quas aedificastis sint vobis"
      en: "For all that we have decreed in your favour, shall stand in force. The strong holds that you have built, shall be your own."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "remittimus quoque ignorantias et peccata usque in hodiernum diem et coronam quam debebatis et si quid aliud erat tributarium Hierusalem iam non sit tributarium"
      en: "And as for any oversight or fault committed unto this day, we forgive it, and the crown which you owed: and if any other thing were taxed in Jerusalem, now let it not be taxed."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et si qui in vobis apti sunt conscribi inter nostros conscribantur et sit inter nos pax"
      en: "And if any of you be fit to be enrolled among ours, let them be enrolled, and let there be peace between us."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "anno centesimo septuagesimo ablatum est iugum gentium ab Israhel"
      en: "In the year one hundred and seventy the yoke of the Gentiles was taken off from Israel."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et coepit populus Israhel scribere in tabulis et gestis publicis anno primo sub Simone sacerdote magno duce et principe Iudaeorum"
      en: "And the people of Israel began to write in the instruments, and public records, The first year under Simon the high priest, the great captain and prince of the Jews."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "in illis diebus Simon adplicuit ad Gazam et circumdedit eam castris et fecit machinas et adplicuit ad civitatem et percussit turrem unam et conprehendit"
      en: "In those days Simon besieged Gaza, and camped round about it, and he made engines, and set them to the city, and he struck one tower, and took it."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et qui eruperunt erant intra machinam in civitate et factus est motus magnus in civitate"
      en: "And they that were within the engine leaped into the city: and there was a great uproar in the city."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et ascenderunt qui erant in civitate cum uxoribus et filiis supra murum scissis tunicis suis et clamaverunt voce magna postulantes a Simone dextras sibi dari"
      en: "And they that were in the city went up with their wives and children upon the wall, with their garments rent, and they cried with a loud voice, beseeching Simon to grant them peace."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et dixerunt non nobis reddas secundum malitias nostras sed secundum misericordias tuas"
      en: "And they said: Deal not with us according to our evil deeds, but according to thy mercy."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et flexus Simon non debellavit eos eiecit tamen eos de civitate et emundavit aedes in quibus fuerant simulacra et tunc intravit in ea cum hymnis benedicens Dominum"
      en: "And Simon being moved, did not destroy them: but yet he cast them out of the city, and cleansed the houses wherein there had been idols, and then he entered into it with hymns, blessing the Lord."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et eiecta ex ea omni inmunditia conlocavit in ea viros qui legem facerent et munivit eam et fecit sibi habitationem"
      en: "And having cast out of it all uncleanness, he placed in it men that should observe the law: and he fortified it, and made it his habitation."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "qui autem erant in arce Hierusalem prohibebantur egredi et ingredi in regionem et emere ac vendere et esurierunt valde et multi ex eis fame perierunt"
      en: "But they that were in the castle of Jerusalem were hindered from going out and coming into the country, and from buying and selling: and they were straitened with hunger, and many of them perished through famine."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et clamaverunt ad Simonem ut dextras acciperent et dedit illis et eiecit eos inde et mundavit arcem a contaminationibus"
      en: "And they cried to Simon form peace, and he granted it to them: and he cast them out from thence, and cleansed the castle from uncleannesses."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et intraverunt in ea tertia et vicesima secundi mensis anno centesimo septuagesimo primo cum laude et ramis palmarum et cinyris et cymbalis et nablis et hymnis et canticis quia contritus est inimicus magnus ex Israhel"
      en: "And they entered into it the three and twentieth day of the second month, in the year one hundred and seventy-one, with thanksgiving, and branches of palm trees, and harps, and cymbals, and psalteries, and hymns, and canticles, because the great enemy was destroyed out of Israel."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et constituit ut omnibus annis agerentur dies hii cum laetitia"
      en: "And he ordained that these days should be kept every year with gladness."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et munivit montem templi qui erat secus arcem et habitavit ibi ipse et qui cum eo erant"
      en: "And he fortified the mountain of the temple that was near the castle, and he dwelt there himself, and they that were with him."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "et vidit Simon Iohannem filium suum quod vir esset et posuit eum ducem virtutum universarum et habitavit Gazaris"
      en: "And Simon saw that John his son was a valiant man for war: and he made him captain of all the forces: and he dwelt in Gazara."
    status: { la: verified, en: verified }
