# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: osee
chapter: 2
verses:
  - n: 1
    text:
      la: "dicite fratribus vestris Populus meus et sorori vestrae Misericordiam consecuta"
      en: "Say ye to your brethren: You are my people, and to your sister: Thou hast obtained mercy."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "iudicate matrem vestram iudicate quoniam ipsa non uxor mea et ego non vir eius auferat fornicationes suas a facie sua et adulteria sua de medio uberum suorum"
      en: "Judge your mother, judge her: because she is not my wife, and I am not her husband. Let her put away her fornications from her face, and her adulteries from between her breasts."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ne forte expoliem eam nudam et statuam eam secundum diem nativitatis suae et ponam eam quasi solitudinem et statuam eam velut terram inviam et interficiam eam siti"
      en: "Lest I strip her naked, and set her as in the day that she was born: and I will make her as a wilderness, and will set her as a land that none can pass through, and will kill her with drought."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et filiorum illius non miserebor quoniam filii fornicationum sunt"
      en: "And I will not have mercy on her children: for they are the children of fornications."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quia fornicata est mater eorum confusa est quae concepit eos quia dixit vadam post amatores meos qui dant panes mihi et aquas meas lanam meam et linum meum oleum meum et potum meum"
      en: "For their mother hath committed fornication, she that conceived them is covered with shame: for she said: I will go after my lovers, that give me my bread, and my water, my wool, and my flax, my oil, and my drink."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "propter hoc ecce ego sepiam viam tuam spinis et sepiam eam maceria et semitas suas non inveniet"
      en: "Wherefore behold I will hedge up thy way with thorns, and I will stop it up with a wall, and she shall not find her paths."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et sequetur amatores suos et non adprehendet eos et quaeret eos et non inveniet et dicet vadam et revertar ad virum meum priorem quia bene mihi erat tunc magis quam nunc"
      en: "And she shall follow after her lovers, and shall not overtake them: and she shall seek them, and shall not find, and she shall say: I will go, and return to my first husband, because it was better with me then, than now."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et haec nescivit quia ego dedi ei frumentum et vinum et oleum et argentum multiplicavi ei et aurum quae fecerunt Baal"
      en: "And she did not know that I gave her corn and wine, and oil, and multiplied her silver, and gold, which they have used in the service of Baal."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "idcirco convertar et sumam frumentum meum in tempore suo et vinum meum in tempore suo et liberabo lanam meam et linum meum quae operiebant ignominiam eius"
      en: "Therefore will I return, and take away my corn in its season, and my wine in its season, and I will set at liberty my wool, and my flax, which covered her disgrace."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et nunc revelabo stultitiam eius in oculis amatorum eius et vir non eruet eam de manu mea"
      en: "And now I will lay open her folly in the eyes of her lovers: and no man shall deliver her out of my hand:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et cessare faciam omne gaudium eius sollemnitatem eius neomeniam eius sabbatum eius et omnia festa tempora eius"
      en: "And I will cause all her mirth to cease, her solemnities, her new moons, her sabbaths, and all her festival times."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et corrumpam vineam eius et ficum eius de quibus dixit mercedes hae meae sunt quas dederunt mihi amatores mei et ponam eam in saltu et comedet illam bestia agri"
      en: "And I will destroy her vines, and her fig trees, of which she said: These are my rewards, which my lovers have given me: and I will make her as a forest, and the beasts of the field shall devour her."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et visitabo super eam dies Baalim quibus accendebat incensum et ornabatur inaure sua et monili suo et ibat post amatores suos et mei obliviscebatur dicit Dominus"
      en: "And I will visit upon her the days of Baalim, to whom she burnt incense, and decked herself out with her earrings, and with her jewels, and went after her lovers, and forgot me, saith the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "propter hoc ecce ego lactabo eam et ducam eam in solitudinem et loquar ad cor eius"
      en: "Therefore, behold I will allure her, and will lead her into the wilderness: and I will speak to her heart."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dabo ei vinitores eius ex eodem loco et vallem Achor ad aperiendam spem et canet ibi iuxta dies iuventutis suae et iuxta dies ascensionis suae de terra Aegypti"
      en: "And I will give her vinedressers out of the same place, and the valley of Achor for an opening of hope: and she shall sing there according to the days of her youth, and according to the days of her coming up out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et erit in die illo ait Dominus vocabit me Vir meus et non vocabit me ultra Baali"
      en: "And it shall be in that day, saith the Lord, That she shall call me : My husband, and she shall call me no more Baali."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et auferam nomina Baalim de ore eius et non recordabitur ultra nominis eorum"
      en: "And I will take away the names of Baalim out of her mouth, and she shall no more remember their name."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et percutiam eis foedus in die illa cum bestia agri et cum volucre caeli et cum reptili terrae et arcum et gladium et bellum conteram de terra et dormire eos faciam fiducialiter"
      en: "And in that day I will make a covenant with them, with the beasts of the field, and with the fowls of the air, and with the creeping things of the earth: and I will destroy the bow, and the sword, and war out of the land: and I will make them sleep secure."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et sponsabo te mihi in sempiternum et sponsabo te mihi in iustitia et iudicio et in misericordia et miserationibus"
      en: "And I will espouse thee to me for ever: and I will espouse thee to me in justice, and judgment, and in mercy, and in commiserations."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et sponsabo te mihi in fide et scies quia ego Dominus"
      en: "And I will espouse thee to me in faith: and thou shalt know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et erit in illa die exaudiam dicit Dominus exaudiam caelos et illi exaudient terram"
      en: "And it shall come to pass in that day: I will hear, saith the Lord, I will hear the heavens, and they shall hear the earth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et terra exaudiet triticum et vinum et oleum et haec exaudient Hiezrahel"
      en: "And the earth shall hear the core, and the wine, and the oil, and these shall hear Jezrahel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et seminabo eam mihi in terram et miserebor eius quae fuit absque misericordia"
      en: "And I will sow her unto me in the earth, and I will have mercy on her that was without mercy."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et dicam non populo meo populus meus tu et ipse dicet Dominus meus es tu"
      en: "And I will say to that which was not my people: Thou art my people: and they shall say: Thou art my God."
    status: { la: verified, en: verified }
