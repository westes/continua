# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 6
verses:
  - n: 1
    text:
      la: "Filii Levi: Gerson, Caath, et Merari."
      en: "The sons of Levi were Gerson, Caath, and Merari."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Filii Caath: Amram, Isaar, Hebron, et Oziel."
      en: "The sons of Caath: Amram, Isaar, Hebron, and Oziel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Filii Amram: Aaron, Moyses, et Maria. Filii Aaron: Nadab et Abiu, Eleazar, et Ithamar."
      en: "The children of Amram: Aaron, Moses, and Mary. The sons of Aaron: Nadab and Abiu, Eleazar and Ithamar."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Eleazar genuit Phinees, et Phinees genuit Abisue."
      en: "Eleazar beget Phinees, and Phinees beget Abisue,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Abisue vero genuit Bocci, et Bocci genuit Ozi."
      en: "And Abisue beget Bocci, and Bocci begot Ozi."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ozi genuit Zaraiam, et Zaraias genuit Meraioth."
      en: "Ozi beget Zaraias, and Zaraias beget Maraioth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Porro Meraioth genuit Amariam, et Amarias genuit Achitob."
      en: "And Maraioth beget Amarias, and Amarias beget Achitob."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Achitob genuit Sadoc, et Sadoc genuit Achimaas,"
      en: "Achitob beget Sadoc, and Sadoc begot Achimaas."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Achimaas genuit Azariam, Azarias genuit Johanan,"
      en: "Achimaas beget Azarias, Azarias begot Johanan,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Johanan genuit Azariam: ipse est qui sacerdotio functus est in domo, quam aedificavit Salomon in Jerusalem."
      en: "Johanan beget Azarias. This is he that executed the priestly office in the house which Solomon built in Jerusalem."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Genuit autem Azarias Amariam, et Amarias genuit Achitob,"
      en: "And Azarias beget Amarias, and Amarias beget Achitob."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Achitob genuit Sadoc, et Sadoc genuit Sellum,"
      en: "And Achitob beget Sadoc, and Sadoc beget Sellum,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sellum genuit Helciam, et Helcias genuit Azariam,"
      en: "Sellum beget Helcias, and Helcias beget Azarias,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Azarias genuit Saraiam, et Saraias genuit Josedec."
      en: "Azarias beget Saraias, and Saraias beget Josedec."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Porro Josedec egressus est, quando transtulit Dominus Judam, et Jerusalem per manus Nabuchodonosor."
      en: "Now Josedec went out, when the Lord carried away Juda, and Jerusalem, by the hands of Nabuchodonosor."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Filii ergo Levi: Gersom, Caath, et Merari."
      en: "So the sons of Levi were Gerson, Caath, and Merari."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et haec nomina filiorum Gersom: Lobni, et Semei."
      en: "And these are the names of the sons of Gerson: Lobni and Semei."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Filii Caath: Amram, et Isaar, et Hebron, et Oziel."
      en: "The sons of Caath: Amram, and Isaar, and Hebron, and Oziel."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Filii Merari: Moholi et Musi. Hae autem cognationes Levi secundum familias eorum."
      en: "The sons of Merari: Moholi and Musi. And these are the kindreds of Levi according to their families."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Gersom: Lobni filius ejus, Jahath filius ejus, Zamma filius ejus,"
      en: "Of Gerson: Lobni his son, Jahath his son, Zamma his son,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Joah filius ejus, Addo filius ejus, Zara filius ejus, Jethrai filius ejus."
      en: "Joah his son, Addo his son, Zara his son, Jethrai his son."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Filii Caath: Aminadab filius ejus, Core filius ejus, Asir filius ejus,"
      en: "The sons of Caath, Aminadab his son, Core his son, Asir his son,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Elcana filius ejus, Abiasaph filius ejus, Asir filius ejus,"
      en: "Elcana his son, Abiasaph his son, Asir his son,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Thahath filius ejus, Uriel filius ejus, Ozias filius ejus, Saul filius ejus."
      en: "Thahath his son, Uriel his son, Ozias his son, Saul his son."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Filii Elcana, Amasai et Achimoth"
      en: "The sons of Elcana: Amasai, and Achimoth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et Elcana: filii Elcana: Sophai filius ejus, Nahath filius ejus,"
      en: "And Elcana. The sons of Elcana: Sophai his son, Nahath his son,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Eliab filius ejus, Jeroham filius ejus, Elcana filius ejus."
      en: "Eliab his son, Jeroham his son, Elcana his son."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Filii Samuel: primogenitus Vasseni, et Abia."
      en: "The sons of Samuel: the firstborn Vasseni, and Abia."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Filii autem Merari, Moholi: Lobni filius ejus, Semei filius ejus, Oza filius ejus,"
      en: "And the sons of Merari, Moholi: Lobni his son, Semei his son, Oza his son,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Sammaa filius ejus, Haggia filius ejus, Asaia filius ejus."
      en: "Sammaa his son, Haggia his son, Asaia his son."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Isti sunt, quos constituit David super cantores domus Domini, ex quo collocata est arca:"
      en: "These are they, whom David set over the singing men of the house of the Lord, after that the ark was placed:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et ministrabant coram tabernaculo testimonii, canentes donec aedificaret Salomon domum Domini in Jerusalem: stabant autem juxta ordinem suum in ministerio."
      en: "And they ministered before the tabernacle of the testimony, with singing, until Solomon built the house of the Lord in Jerusalem, and they stood according to their order in the ministry."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Hi vero sunt, qui assistebant cum filiis suis, de filiis Caath, Hemam cantor filius Johel, filii Samuel,"
      en: "And these are they that stood with their sons, of the sons of Caath, Hemam a singer, the son of Joel, the son of Sammuel,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "filii Elcana, filii Jeroham, filii Eliel, filii Thohu,"
      en: "The son of Elcana, the son of Jeroham, the son of Eliel, the son of Thohu,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "filii Suph, filii Elcana, filii Mahath, filii Amasai,"
      en: "The son of Suph, the son of Elcana, the son of Mahath, the son of Amasai,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "filii Elcana, filii Johel, filii Azariae, filii Sophoniae,"
      en: "The son of Elcana, the son of Johel, the son of Azarias, the son of Sophonias,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "filii Thahath, filii Asir, filii Abiasaph, filii Core,"
      en: "The son of Thahath, the son of Asir, the son or Abiasaph, the son of Core,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "filii Isaar, filii Caath, filii Levi, filii Israel."
      en: "The son of Isaar, the son of Caath, the son of Levi, the son of Israel."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et frater ejus Asaph, qui stabat a dextris ejus, Asaph filius Barachiae, filii Samaa,"
      en: "And his brother Asaph, who stood on his right hand, Asaph the son of Barachias, the son of Samaa."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "filii Michael, filii Basaiae, filii Melchiae,"
      en: "The son of Michael, the son of Basaia, the son of Melchia."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "filii Athanai, filii Zara, filii Adaia,"
      en: "The son of Athanai, the son of Zara, the son of Adaia."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "filii Ethan, filii Zamma, filii Semei,"
      en: "The son of Ethan, the son of Zamma, the son of Semei."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "filii Jeth, filii Gersom, filii Levi."
      en: "The son of Jeth, the son of Gerson, the son of Levi."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Filii autem Merari fratres eorum, ad sinistram, Ethan filius Cusi, filii Abdi, filii Maloch,"
      en: "And the sons of Merari their brethren, on the left hand, Ethan the son of Cusi, the son of Abdi, the son of Meloch,"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "filii Hasabiae, filii Amasiae, filii Helciae,"
      en: "The son of Hasabia, the son of Amasai, the son of Helcias,"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "filii Amasai, filii Boni, filii Somer,"
      en: "The son of Amasai, the son of Boni, the son of Somer,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "filii Moholi, filii Musi, filii Merari, filii Levi."
      en: "The son of Moholi, the son of Mud, the son of Merari, the son of Levi."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Fratres quoque eorum Levitae, qui ordinati sunt in cunctum ministerium tabernaculi domus Domini."
      en: "Their brethren also the Levites, who were appointed for all the ministry of the tabernacle of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Aaron vero, et filii ejus adolebant incensum super altare holocausti, et super altare thymiamatis, in omne opus Sancti sanctorum: et ut precarentur pro Israel juxta omnia, quae praeceperat Moyses servus Dei."
      en: "But Aaron and his sons offered burnt offerings upon the altar of holocausts, and upon the altar of incense, for very work of the holy of holies: and to pray for Israel according to all that Moses the servant of God had commanded."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Hi sunt autem filii Aaron: Eleazar filius ejus, Phinees filius ejus, Abisue filius ejus,"
      en: "And these are the sons of Aaron: Eleazar his son, Phinees his son, Abisue his son,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Bocci filius ejus, Ozi filius ejus, Zarahia filius ejus,"
      en: "Bocci his son, Ozi his son, Zarahia his son,"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Meraioth filius ejus, Amarias filius ejus, Achitob filius ejus,"
      en: "Meraioth his son, Amarias his son, Achitob his son,"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Sadoc filius ejus, Achimaas filius ejus."
      en: "Sadoc his son, Achimaas his son."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Et haec habitacula eorum per vicos atque confinia, filiorum scilicet Aaron, juxta cognationes Caathitarum: ipsis enim sorte contigerant."
      en: "And these are their dwelling places by the towns and confines, to wit, of the sons of Aaron, of the families of the Caathites: for they fell to them by lot."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Dederunt igitur eis Hebron in terra Juda, et suburbana ejus per circuitum:"
      en: "And they gave them Hebron in the land of Juda, and the suburbs thereof round about:"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "agros autem civitatis, et villas, Caleb filio Jephone."
      en: "But the fields of the city, and the villages to Caleb son of Jephone."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Porro filiis Aaron dederunt civitates ad confugiendum Hebron, et Lobna, et suburbana ejus,"
      en: "And to the sons of Aaron they gave the cities for refuge Hebron, and Lobna, and the suburbs thereof,"
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Jether quoque, et Esthemo cum suburbanis suis, sed et Helon, et Dabir cum suburbanis suis,"
      en: "And Jether and Esthemo, with their suburbs, and Helon, and Dabir with their suburbs:"
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Asan quoque, et Bethsemes, et suburbana earum."
      en: "Asan also, and Bethsames, with their suburbs."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "De tribu autem Benjamin, Gabee et suburbana ejus, et Almath cum suburbanis suis, Anathoth quoque cum suburbanis suis: omnes civitates, tredecim, per cognationes suas."
      en: "And out of the tribe of Benjamin: Gabee and its suburbs, Almath with its suburbs, Anathoth also with its suburbs: all their cities throughout their families were thirteen."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Filiis autem Caath residuis de cognatione sua dederunt ex dimidia tribu Manasse in possessionem urbes decem."
      en: "And to the sons of Caath that remained of their kindred they gave out of the half tribe of Manasses ten cities in possession."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Porro filiis Gersom per cognationes suas de tribu Issachar, et de tribu Aser, et de tribu Nephthali, et de tribu Manasse in Basan, urbes tredecim."
      en: "And to the sons of Gerson by their families out of the tribe of Issachar, and out of the tribe of Aser, and out of the tribe of Nephtali, and out of the tribe of Manasses in Basan, thirteen cities."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Filiis autem Merari per cognationes suas de tribu Ruben, et de tribu Gad, et de tribu Zabulon, dederunt sorte civitates duodecim."
      en: "And to the sons of Merari by their families out of the tribe of Ruben, and out of the tribe of Gad, and out of the tribe of Zabulon, they gave by lot twelve cities."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Dederunt quoque filii Israel Levitis civitates, et suburbana earum:"
      en: "And the children of Israel gave to the Levites the cities, and their suburbs."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "dederuntque per sortem, ex tribu filiorum Juda, et ex tribu filiorum Simeon, et ex tribu filiorum Benjamin urbes has, quas vocaverunt nominibus suis,"
      en: "And they gave them by lot, out of the tribe of the sons of Juda, and out of the tribe of the sons of Simeon, and out of the tribe of the sons of Benjamin, these cities which they called by their names."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "et his, qui erant de cognatione filiorum Caath, fueruntque civitates in terminis eorum de tribu Ephraim."
      en: "And to them that were of the kindred of the sons of Caath, and the cities in their borders were of the tribe of Ephraim."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "Dederunt ergo eis urbes ad confugiendum, Sichem cum suburbanis suis in monte Ephraim, et Gazer cum suburbanis suis,"
      en: "And they gave the cities of refuge Sichem with its suburbs in mount Ephraim, and Gazer with its suburbs,"
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "Jecmaam quoque cum suburbanis suis, et Bethoron similiter,"
      en: "Jecmaan also with its suburbs, and Beth-horon in like manner,"
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "necnon et Helon cum suburbanis suis, et Gethremmon in eumdem modum."
      en: "Helon also with its suburbs, and Gethremmon in like manner,"
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "Porro ex dimidia tribu Manasse, Aner et suburbana ejus, Balaam et suburbana ejus: his videlicet, qui de cognatione filiorum Caath reliqui erant."
      en: "And out of the half tribe of Manasses, Aner and its suburbs, Baalam and its suburbs: to wit, to them that were left of the family of the sons of Caath."
    status: { la: verified, en: verified }
  - n: 71
    text:
      la: "Filiis autem Gersom de cognatione dimidiae tribus Manasse, Gaulon in Basan, et suburbana ejus, et Astaroth cum suburbanis suis."
      en: "And to the sons of Gersom, out of the kindred of the half tribe of Manasses, Gaulon, in Basan, and its suburbs, and Astharoth with its suburbs."
    status: { la: verified, en: verified }
  - n: 72
    text:
      la: "De tribu Issachar, Cedes et suburbanis suis, et Dabereth cum suburbanis suis,"
      en: "Out of the tribe of Issachar, Cedes and its suburbs, and Dabereth with its suburbs;"
    status: { la: verified, en: verified }
  - n: 73
    text:
      la: "Ramoth quoque et suburbana ejus, et Anem cum suburbanis suis."
      en: "Ramoth also and its suburbs, and Anem with its suburbs."
    status: { la: verified, en: verified }
  - n: 74
    text:
      la: "De tribu vero Aser: Masal cum suburbanis suis, et Abdon similiter,"
      en: "And out of the tribe of Aser: Masal with its suburbs, and Abdon in like manner;"
    status: { la: verified, en: verified }
  - n: 75
    text:
      la: "Hucac quoque et suburbana ejus, et Rohob cum suburbanis suis."
      en: "Hucac also and its suburbs, and Rohol with its suburbs."
    status: { la: verified, en: verified }
  - n: 76
    text:
      la: "Porro de tribu Nephthali, Cedes in Galilaea et suburbana ejus, Hamon cum suburbanis suis, et Cariathaim et suburbana ejus."
      en: "And out of the tribe of Nephtali, Cedes in Galilee and its suburbs, Hamon with its suburbs, and Cariathaim, and its suburbs."
    status: { la: verified, en: verified }
  - n: 77
    text:
      la: "Filiis autem Merari residuis: de tribu Zabulon, Remmono et suburbana ejus, et Thabor cum suburbanis sus:"
      en: "And to the sons of Merari that remained: out of the tribe of Zabulon, Remmono and its suburbs, and Thabor with its suburbs."
    status: { la: verified, en: verified }
  - n: 78
    text:
      la: "trans Jordanem quoque ex adverso Jericho contra orientem Jordanis, de tribu Ruben, Bosor in solitudine cum suburbanis suis, et Jassa cum suburbanis suis,"
      en: "Beyond the Jordan also over against Jericho, on the east side of the Jordan, out of the tribe of Ruben, Bosor in the wilderness with its suburbs, and Jassa with its suburbs;"
    status: { la: verified, en: verified }
  - n: 79
    text:
      la: "Cademoth quoque et suburbana ejus, et Mephaat cum suburbanis suis."
      en: "Cademoth also and its suburbs, and Mephaath with its suburbs;"
    status: { la: verified, en: verified }
  - n: 80
    text:
      la: "Necnon et de tribu Gad, Ramoth in Galaad et suburbana ejus, et Manaim cum suburbanis suis,"
      en: "Moreover also out of the tribe of Gad, Ramoth in Galaad and its suburbs, and Manaim with its suburbs;"
    status: { la: verified, en: verified }
  - n: 81
    text:
      la: "sed et Hesebon cum suburbanis suis, et Jezer cum suburbanis suis."
      en: "Hesebon also with its suburbs, and Jazer with its suburbs."
    status: { la: verified, en: verified }
