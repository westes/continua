# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 3
verses:
  - n: 1
    text:
      la: "filii sapientiae ecclesia iustorum et natio illorum obaudientia et dilectio"
      en: "The sons of wisdom are the church of the just: and their generation, obedience and love."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "iudicium patris audite filii dilecti et sic facite ut salvi sitis"
      en: "Children, hear the judgment of your father, and so do that you may be saved."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Deus enim honoravit patrem in filiis et iudicium matris exquirens in filios"
      en: "For God hath made the father honourable to the children: and seeking the judgment of the mothers, hath confirmed it upon the children."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui diligit Deum exorabit pro peccatis et continebit se ab illis in oratione dierum exaudietur"
      en: "He that loveth God, shall obtain pardon for his sine by prayer, and shall refrain himself from them, and shall be heard in the prayer of days."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et sicut qui thesaurizat ita et qui honorificat matrem suam"
      en: "And he that honoureth his mother is as one that layeth up a treasure."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui honorat patrem iucundabitur in filiis"
      en: "He that honoureth his father shall have joy in his own children, and in the day of his prayer he shall be heard."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui honorat patrem suum vita vivet longiore et qui obaudit patrem refrigerabit matri"
      en: "He that honoureth his father shall enjoy a long life: and he that obeyeth the father, shall be a comfort to his mother."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui timet Deum honorat parentes et quasi dominis serviet in his qui se generaverunt"
      en: "He that feareth the Lord, honoureth his parents, and will serve them as his masters that brought him into the world."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in opere et sermone et omni patientia honora patrem tuum"
      en: "Honour thy father, in work and word, and all patience,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut superveniat tibi benedictio a Deo et benedictio illius in novissimo manet"
      en: "That a blessing may come upon thee from him, and his blessing may remain in the latter end."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "benedictio patris firmat domos filiorum maledictio autem matris eradicat fundamenta"
      en: "The father's blessing establisheth the houses of the children: but the mother's curse rooteth up the foundation."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ne glorieris in contumelia patris tui non est enim tibi gloria sed confusio"
      en: "Glory not in the dishonour of thy father: for his shame is no glory to thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "gloria enim hominis ex honore patris sui et dedecus filiis pater sine honore"
      en: "For the glory of a man is from the honour of his father, and a father without honour is the disgrace of the son."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "fili suscipe senectam patris tui et ne contristes eum in vita illius"
      en: "Son, support the old age of thy father, and grieve him not in his life;"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et si defecerit sensu veniam da et ne spernas eum in tua virtute elemosyna enim patris non erit in oblivione"
      en: "And if his understanding fail, have patience with him, and despise him not when thou art in thy strength: for the relieving of the father shall not be for- gotten."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nam pro peccato matris restituetur tibi bonum"
      en: "For good shall be repaid to thee for the sin of thy mother."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et iniustitia aedificabitur tibi in die tribulationis commemorabitur tui sicut in sereno glacies solventur tua peccata"
      en: "And in justice thou shalt be built up, and in the day of affliction thou shalt be remembered: and thy sine shall melt away as the ice in the fair warm weather."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quam malae famae est qui relinquit patrem et est maledictus a Deo qui exasperat matrem"
      en: "Of what an evil fame is he that forsaketh his father: and he is cursed of God that angereth his mother."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "fili in mansuetudine opera tua perfice et super hominum gloriam diligeris"
      en: "My son, do thy works in meekness, and thou shalt be beloved above the glory of men."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quanto magnus es humilia te in omnibus et coram Deo invenies gratiam"
      en: "The greater thou art, the more humble thyself in all things, and thou shalt find grace before God:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quoniam magna potentia Dei solius et ab humilibus honoratur"
      en: "For great is the power of God alone, and he is honoured by the humble."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "altiora te ne scrutaveris et fortiora te ne exquisieris sed quae praecepit tibi Deus illa cogita semper et in pluribus operibus eius ne fueris curiosus"
      en: "Seek not the things that are too high for thee, and search not into things above thy ability: but the things that God hath commanded thee, think on them always, and in many of his works be not curious."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "non est enim tibi necessarium ea quae abscondita sunt videre oculis tuis"
      en: "For it is not necessary for thee to see with thy eyes those things that are hid."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "in supervacuis rebus noli scrutari multipliciter et in pluribus operibus eius non eris curiosus"
      en: "In unnecessary matters be not over curious, and in many of his works thou shalt not be inquisitive."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "plurima enim super sensum hominis ostensa sunt tibi"
      en: "For many things are shewn to thee above the understanding of men."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "multos enim inplanavit suspicio illorum et in vanitate detinuit sensus illorum"
      en: "And the suspicion of them hath deceived many, and hath detained their minds in vanity."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cor durum male habebit in novissimo et qui amat periculum in illo peribit"
      en: "A hard heart shall fear evil at the last: and he that loveth danger shall perish in it."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "cor ingrediens duas vias non habebit successus et pravicordius in illis scandalizabitur"
      en: "A heart that goeth two ways shall not have success, and the perverse of heart shall be scandalized therein."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "cor nequam gravabitur doloribus et peccator adiciet ad peccandum"
      en: "A wicked heart shall be laden with sorrows, and the sinner will add sin to sin."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "synagogae superborum non est sanitas frutex enim peccati eradicabitur in illis et non intellegetur"
      en: "The congregation of the proud shall not be healed: for the plant of wickedness shall take root in them, and it shall not be perceived."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "cor sapiens intellegitur in sapientia et auris bona audiet cum omni concupiscentia sapientiam"
      en: "The heart of the wise is understood in wisdom, and a good ear will hear wisdom with all desire."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "sapiens cor et intellegibile abstinebit se a peccatis et in operibus iustitiae successus habebit"
      en: "A wise heart, and which hath under- standing, will abstain from sine, and in the works of justice shall have success."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ignem ardentem extinguit aqua et elemosyna resistit peccatis"
      en: "Water quencheth a flaming fire, and alms resisteth sins:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et Deus conspector qui reddit gratiam meminit in posterum et in tempore casus tui invenies firmamentum"
      en: "And God provideth for him that sheweth favour: he remembereth him afterwards, and in the time of his fall he shall find a sure stay."
    status: { la: verified, en: verified }
