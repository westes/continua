# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 3
verses:
  - n: 1
    text:
      la: "Filii sapientiae ecclesia justorum, et natio illorum obedientia et dilectio."
      en: "The sons of wisdom are the church of the just: and their generation, obedience and love."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Judicium patris audite, filii, et sic facite, ut salvi sitis."
      en: "Children, hear the judgment of your father, and so do that you may be saved."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Deus enim honoravit patrem in filiis: et judicium matris exquirens, firmavit in filios."
      en: "For God hath made the father honourable to the children: and seeking the judgment of the mothers, hath confirmed it upon the children."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui diligit Deum exorabit pro peccatis, et continebit se ab illis, et in oratione dierum exaudietur."
      en: "He that loveth God, shall obtain pardon for his sins by prayer, and shall refrain himself from them, and shall be heard in the prayer of days."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et sicut qui thesaurizat, ita et qui honorificat matrem suam."
      en: "And he that honoureth his mother is as one that layeth up a treasure."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui honorat patrem suum jucundabitur in filiis, et in die orationis suae exaudietur."
      en: "He that honoureth his father shall have joy in his own children, and in the day of his prayer he shall be heard."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui honorat patrem suum vita vivet longiore, et qui obedit patri refrigerabit matrem."
      en: "He that honoureth his father shall enjoy a long life: and he that obeyeth the father, shall be a comfort to his mother."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui timet Dominum honorat parentes, et quasi dominis serviet his qui se genuerunt."
      en: "He that feareth the Lord, honoureth his parents, and will serve them as his masters that brought him into the world."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "In opere, et sermone, et omni patientia, honora patrem tuum,"
      en: "Honour thy father, in work and word, and all patience,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut superveniat tibi benedictio ab eo, et benedictio illius in novissimo maneat."
      en: "That a blessing may come upon thee from him, and his blessing may remain in the latter end."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Benedictio patris firmat domos filiorum: maledictio autem matris eradicat fundamenta."
      en: "The father's blessing establisheth the houses of the children: but the mother's curse rooteth up the foundation."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ne glorieris in contumelia patris tui: non enim est tibi gloria ejus confusio."
      en: "Glory not in the dishonour of thy father: for his shame is no glory to thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Gloria enim hominis ex honore patris sui, et dedecus filii pater sine honore."
      en: "For the glory of a man is from the honour of his father, and a father without honour is the disgrace of the son."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Fili, suscipe senectam patris tui, et non contristes eum in vita illius:"
      en: "Son, support the old age of thy father, and grieve him not in his life;"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et si defecerit sensu, veniam da, et ne spernas eum in virtute tua: eleemosyna enim patris non erit in oblivione."
      en: "And if his understanding fail, have patience with him, and despise him not when thou art in thy strength: for the relieving of the father shall not be forgotten."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nam pro peccato matris restituetur tibi bonum:"
      en: "For good shall be repaid to thee for the sin of thy mother."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et in justitia aedificabitur tibi, et in die tribulationis commemorabitur tui, et sicut in sereno glacies, solventur peccata tua."
      en: "And in justice thou shalt be built up, and in the day of affliction thou shalt be remembered: and thy sins shall melt away as the ice in the fair warm weather."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quam malae famae est qui derelinquit patrem, et est maledictus a Deo qui exasperat matrem!"
      en: "Of what an evil fame is he that forsaketh his father: and he is cursed of God that angereth his mother."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Fili, in mansuetudine opera tua perfice, et super hominum gloriam diligeris."
      en: "My son, do thy works in meekness, and thou shalt be beloved above the glory of men."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quanto magnus es, humilia te in omnibus, et coram Deo invenies gratiam:"
      en: "The greater thou art, the more humble thyself in all things, and thou shalt find grace before God:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quoniam magna potentia Dei solius, et ab humilibus honoratur."
      en: "For great is the power of God alone, and he is honoured by the humble."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Altiora te ne quaesieris, et fortiora te ne scrutatus fueris: sed quae praecepit tibi Deus, illa cogita semper, et in pluribus operibus ejus ne fueris curiosus."
      en: "Seek not the things that are too high for thee, and search not into things above thy ability: but the things that God hath commanded thee, think on them always, and in many of his works be not curious."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Non est enim tibi necessarium ea, quae abscondita sunt, videre oculis tuis."
      en: "For it is not necessary for thee to see with thy eyes those things that are hid."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "In supervacuis rebus noli scrutari multipliciter, et in pluribus operibus ejus non eris curiosus."
      en: "In unnecessary matters be not over curious, and in many of his works thou shalt not be inquisitive."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Plurima enim super sensum hominum ostensa sunt tibi:"
      en: "For many things are shewn to thee above the understanding of men."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "multos quoque supplantavit suspicio illorum, et in vanitate detinuit sensus illorum."
      en: "And the suspicion of them hath deceived many, and hath detained their minds in vanity."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cor durum habebit male in novissimo, et qui amat periculum in illo peribit."
      en: "A hard heart shall fear evil at the last: and he that loveth danger shall perish in it."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Cor ingrediens duas vias non habebit successus, et pravus corde in illis scandalizabitur."
      en: "A heart that goeth two ways shall not have success, and the perverse of heart shall be scandalized therein."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cor nequam gravabitur in doloribus, et peccator adjiciet ad peccandum."
      en: "A wicked heart shall be laden with sorrows, and the sinner will add sin to sin."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Synagogae superborum non erit sanitas, frutex enim peccati radicabitur in illis, et non intelligetur."
      en: "The congregation of the proud shall not be healed: for the plant of wickedness shall take root in them, and it shall not be perceived."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Cor sapientis intelligitur in sapientia, et auris bona audiet cum omni concupiscentia sapientiam."
      en: "The heart of the wise is understood in wisdom, and a good ear will hear wisdom with all desire."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Sapiens cor et intelligibile abstinebit se a peccatis, et in operibus justitiae successus habebit."
      en: "A wise heart, and which hath understanding, will abstain from sins, and in the works of justice shall have success."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ignem ardentem exstinguit aqua, et eleemosyna resistit peccatis:"
      en: "Water quencheth a flaming fire, and alms resisteth sins:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et Deus prospector est ejus qui reddit gratiam: meminit ejus in posterum, et in tempore casus sui inveniet firmamentum."
      en: "And God provideth for him that sheweth favour: he remembereth him afterwards, and in the time of his fall he shall find a sure stay."
    status: { la: verified, en: verified }
