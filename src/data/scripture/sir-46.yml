# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 46
verses:
  - n: 1
    text:
      la: "fortis in bello Iesus Nave successor Mosi in prophetis qui fuit magnus secundum nomen suum"
      en: "Valiant in war was Jesus the son of Nave, who was successor of Moses among the prophets, who was great according to his name,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "maximus in salutem electorum Dei expugnare insurgentes hostes ut consequeretur hereditatem Israhel"
      en: "Very great for the saving the elect of God, to overthrow the enemies that rose up against them, that he might get the inheritance for Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quam gloriam adeptus est in tollendo manus suas et iactando contra civitatem rompheas"
      en: "How great glory did he gain when he lifted up his hands, and stretched out swords against the cities?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quis ante illum sic restitit nam hostes ipse Dominus perduxit"
      en: "Who before him hath so resisted? for the Lord himself brought the enemies."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "aut non in iracundia eius inpeditus est sol et una dies facta est quasi duo"
      en: "Was not the sun stopped in his anger, and one day made as two?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "invocavit Altissimum potentem in obpugnando inimicos undique et audivit illum magnus et sanctus Deus in saxis grandinis virtutis valde fortis"
      en: "He called upon the most high Sovereign when the enemies assaulted him on every side, and the great and holy God heard him by hailstones of exceeding great force."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "impetum fecit contra gentem hostilem et in descensu perdidit contrarios"
      en: "He made a violent assault against the nation of his enemies, and in the descent he destroyed the adversaries."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ut cognoscant gentes potentiam eius quia contra Dominum pugnare non est facile et secutus est a tergo potentes"
      en: "That the nations might know his power, that it is not easy to fight against God. And he followed the mighty one:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et in diebus Mosi misericordiam fecit ipse et Chaleb filius Iepphonne stare contra hostem prohibere gentem a peccatis et perfringere murmur malitiae"
      en: "And in the days of Moses he did a work of mercy, he and Caleb the son of Jephone, in standing against the enemy, and withholding the people from sins, and appeasing the wicked murmuring."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ipsi duo constituti a periculo liberati sunt a numero sescentorum milium peditum inducere illos in hereditatem in terram quae manat lac et mel"
      en: "And they two being appointed, were delivered out of the danger from among the number of six hundred thousand men on foot, to bring them into their inheritance, into the land that floweth with milk and honey."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dedit Dominus ipsi Chaleb fortitudinem et usque ad senectutem permansit illi virtus ut ascenderet in excelsum terrae locum et semen ipsius obtinuit hereditatem"
      en: "And the Lord gave strength also to Caleb, and his strength continued even to his old age, so that he went up to the high places of the land, and his seed obtained it for an inheritance:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ut viderent omnes filii Israhel quod bonum est obsequi sancto Deo"
      en: "That all the children of Israel might see, that it is good to obey the holy God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et iudices singuli suo nomine quorum non est corruptum cor qui non aversi sunt a Domino"
      en: "Then all the judges, every one by name, whose heart was not corrupted: who turned not away from the Lord,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ut sit memoria illorum in benedictione et ossa eorum pullulent de loco suo"
      en: "That their memory might be blessed, and their bones spring up out of their place,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et nomen eorum permanet in aeternum permanens ad filios illorum sanctorum virorum gloria"
      en: "And their name continue for ever, the glory of the holy men remaining unto their children."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dilectus a Domino suo Samuhel propheta Domini renovavit imperium et unxit principes in gente sua"
      en: "Samuel the prophet of the Lord, the beloved of the Lord his God, established a new government, and anointed princes over his people."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "in lege Domini iudicavit congregationem et vidit Dominus Iacob et in fide sua probatus est propheta"
      en: "By the law of the Lord he judged the congregation, and the God of Jacob beheld, and by his fidelity he was proved a prophet."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et cognitus est in verbis suis fidelis quia vidit Deum lucis"
      en: "And he was known to be faithful in his words, because he saw the God of light:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et invocavit Deum potentem in obpugnando hostes circumstantes undique in oblatione viri inviolati"
      en: "And called upon the name of the Lord Almighty, in fighting against the enemies who beset him on every side, when he offered a lamb without blemish."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et intonuit e caelo Dominus et in sonitu magno auditam fecit vocem suam"
      en: "And the Lord thundered from heaven, and with a great noise made his voice to be heard."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et conteruit principes Tyriorum et omnes duces Philisthim"
      en: "And he crushed the princes of the Tyrians, and all the lords of the Philistines:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ante tempus finis vitae suae et saeculi testimonium praebuit in conspectu Domini et christi pecunias et usque ad calciamenta ab omni carne non accepit et non accusavit illum homo"
      en: "And before the time of the end of his life in the world, he protested before the Lord, and his anointed: money, or any thing else, even to a shoe, he had not taken of any man, and no mall did accuse him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et post hoc dormivit et notum fecit regi et ostendit illi finem vitae suae et exaltavit vocem eius de terra in prophetia delere impietatem gentis"
      en: "And after this he slept, and he made known to the king, and shewed him the end of his life, and he lifted up his voice from the earth in prophecy to blot out the wickedness of the nation."
    status: { la: verified, en: verified }
