# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 19
verses:
  - n: 1
    text:
      la: "Veneruntque duo angeli Sodomam vespere, et sedente Lot in foribus civitatis. Qui cum vidisset eos, surrexit, et ivit obviam eis: adoravitque pronus in terram,"
      en: "And the two angels came to Sodom in the evening, and Lot was sitting in the gate of the city. And seeing them, he rose up and went to meet them: and worshipped prostrate to the ground,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et dixit: Obsecro, domini, declinate in domum pueri vestri, et manete ibi: lavate pedes vestros, et mane proficiscemini in viam vestram. Qui dixerunt: Minime, sed in platea manebimus."
      en: "And said: I beseech you, my lords, turn in to the house of your servant, and lodge there: wash your feet, and in the morning you shall go on your way. And they said: No, but we will abide in the street."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Compulit illos oppido ut diverterent ad eum: ingressisque domum illius fecit convivium, et coxit azyma, et comederunt."
      en: "He pressed them very much to turn in unto him: and when they were come into his house, he made them a feast, and baked unleavened bread and they ate:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Prius autem quam irent cubitum, viri civitatis vallaverunt domum a puero usque ad senem, omnis populus simul."
      en: "But before they went to bed, the men of the city beset the house both young and old, all the people together."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Vocaveruntque Lot, et dixerunt ei: Ubi sunt viri qui introierunt ad te nocte? educ illos huc, ut cognoscamus eos."
      en: "And they called Lot, and said to him: Where are the men that came in to thee at night? bring them out hither that we may know them:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Egressus ad eos Lot, post tergum occludens ostium, ait:"
      en: "Lot went out to them, and shut the door after him, and said:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nolite, quaeso, fratres mei, nolite malum hoc facere."
      en: "Do not so, I beseech you, my brethren, do not commit this evil."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Habeo duas filias, quae necdum cognoverunt virum: educam eas ad vos, et abutimini eis sicut vobis placuerit, dummodo viris istis nihil mali faciatis, quia ingressi sunt sub umbra culminis mei."
      en: "I have two daughters who as yet have not known man: I will bring them out to you, and abuse you them as it shall please you, so that you do no evil to these men, because they are come in under the shadow of my roof."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "At illi dixerunt: Recede illuc. Et rursus: Ingressus es, inquiunt, ut advena; numquid ut judices? te ergo ipsum magis quam hos affligemus. Vimque faciebant Lot vehementissime: jamque prope erat ut effringerent fores."
      en: "But they said: Get thee back thither. And again: Thou camest in, said they, as a stranger, was it to be a judge? therefore we will afflict thee more than them. And they pressed very violently upon Lot: and they were even at the point of breaking open the doors."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ecce miserunt manum viri, et introduxerunt ad se Lot, clauseruntque ostium:"
      en: "And behold the men put out their hand, and drew in Lot unto them, and shut the door:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et eos, qui foris erant, percusserunt caecitate a minimo usque ad maximum, ita ut ostium invenire non possent."
      en: "And them that were without, they struck with blindness from the least to the greatest, so that they could not find the door."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dixerunt autem ad Lot: Habes hic quempiam tuorum? generum, aut filios, aut filias, omnes, qui tui sunt, educ de urbe hac:"
      en: "And they said to Lot: Hast thou here any of thine? son in law, or sons, or daughters, all that are thine bring them out of this city:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "delebimus enim locum istum, eo quod increverit clamor eorum coram Domino, qui misit nos ut perdamus illos."
      en: "For we will destroy this place, because their cry is grown loud before the Lord, who hath sent us to destroy them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Egressus itaque Lot, locutus est ad generos suos qui accepturi erant filias ejus, et dixit: Surgite, egredimini de loco isto: quia delebit Dominus civitatem hanc. Et visus est eis quasi ludens loqui."
      en: "So Lot went out, and spoke to his sons in law that were to have his daughters, and said: Arise: get you out of this place, because the Lord will destroy this city. And he seemed to them to speak as it were in jest."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque esset mane, cogebant eum angeli, dicentes: Surge, tolle uxorem tuam, et duas filias quas habes: ne et tu pariter pereas in scelere civitatis."
      en: "And when it was morning, the angels pressed him, saying: Arise, take thy wife, and the two daughters which thou hast: lest thou also perish in the wickedness of the city."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dissimulante illo, apprehenderunt manum ejus, et manum uxoris, ac duarum filiarum ejus, eo quod parceret Dominus illi."
      en: "And as he lingered, they took his hand, and the hand of his wife, and of his two daughters, because the Lord spared him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Eduxeruntque eum, et posuerunt extra civitatem: ibique locuti sunt ad eum, dicentes: Salva animam tuam: noli respicere post tergum, nec stes in omni circa regione: sed in monte salvum te fac, ne et tu simul pereas."
      en: "And they brought him forth, and set him without the city: and there they spoke to him, saying: Save thy life: look not back, neither stay thou in all the country about: but save thyself in the mountain, lest thou be also consumed."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dixitque Lot ad eos: Quaeso, domine mi,"
      en: "And Lot said to them: I beseech thee my Lord,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quia invenit servus tuus gratiam coram te, et magnificasti misericordiam tuam quam fecisti mecum, ut salvares animam meam, nec possum in monte salvari, ne forte apprehendat me malum, et moriar:"
      en: "Because thy servant hath found grace before thee, and thou hast magnified thy mercy, which thou hast shewn to me, in saving my life, and I cannot escape to the mountain, lest some evil seize me, and I die:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "est civitas haec juxta, ad quam possum fugere, parva, et salvabor in ea: numquid non modica est, et vivet anima mea?"
      en: "There is this city here at hand, to which I may flee, it is a little one, and I shall be saved in it: is it not a little one, and my soul shall live?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dixitque ad eum: Ecce etiam in hoc suscepi preces tuas, ut non subvertam urbem pro qua locutus es."
      en: "And he said to him: Behold also in this, I have heard thy prayers, not to destroy the city for which thou hast spoken."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Festina, et salvare ibi: quia non potero facere quidquam donec ingrediaris illuc. Idcirco vocatum est nomen urbis illius Segor."
      en: "Make haste and be saved there, because I cannot do any thing till thou go in thither. Therefore the name of that city was called Segor."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Sol egressus est super terram, et Lot ingressus est Segor."
      en: "The sun was risen upon the earth, and Lot entered into Segor."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Igitur Dominus pluit super Sodomam et Gomorrham sulphur et ignem a Domino de caelo:"
      en: "And the Lord rained upon Sodom and Gomorrha brimstone and fire from the Lord out of heaven."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et subvertit civitates has, et omnem circa regionem, universos habitatores urbium, et cuncta terrae virentia."
      en: "And he destroyed these cities, and all the country about, all the inhabitants of the cities, and all things that spring from the earth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Respiciensque uxor ejus post se, versa est in statuam salis."
      en: "And his wife looking behind her, was turned into a statue of salt."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Abraham autem consurgens mane, ubi steterat prius cum Domino,"
      en: "And Abraham got up early in the morning and in the place where he had stood before with the Lord,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "intuitus est Sodomam et Gomorrham, et universam terram regionis illius: viditque ascendentem favillam de terra quasi fornacis fumum."
      en: "He looked towards Sodom and Gomorrha, and the whole land of that country: and he saw the ashes rise up from the earth as the smoke of a furnace."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cum enim subverteret Deus civitates regionis illius, recordatus Abrahae, liberavit Lot de subversione urbium in quibus habitaverat."
      en: "Now when God destroyed the cities of that country, remembering Abraham, he delivered Lot out of the destruction of the cities wherein he had dwelt."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Ascenditque Lot de Segor, et mansit in monte, duae quoque filiae ejus cum eo ( timuerat enim manere in Segor) et mansit in spelunca ipse, et duae filiae ejus cum eo."
      en: "And Lot went up out of Segor, and abode in the mountain, and his two daughters with him, (for he was afraid to stay in Segor,) and he dwelt in a cave, he and his two daughters with him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Dixitque major ad minorem: Pater noster senex est, et nullus virorum remansit in terra, qui possit ingredi ad nos juxta morem universae terrae."
      en: "And the elder said to the younger: Our father is old, and there is no man left on the earth, to come in unto us after the manner of the whole earth."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Veni, inebriemus eum vino, dormiamusque cum eo, ut servare possimus ex patre nostro semen."
      en: "Come, let us make him drunk with wine, and let us lie with him, that we may preserve seed of our father."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dederunt itaque patri suo bibere vinum nocte illa. Et ingressa est major, dormivitque cum patre; at ille non sensit, nec quando accubuit filia, nec quando surrexit."
      en: "And they made their father drink wine that night: and the elder went in and lay with her father: but he perceived not neither when his daughter lay down, nor when she rose up."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Altera quoque die dixit major ad minorem: Ecce dormivi heri cum patre meo, demus ei bibere vinum etiam hac nocte, et dormies cum eo, ut salvemus semen de patre nostro."
      en: "And the next day the elder said to the younger: Behold I lay last night with my father, let us make him drink wine also to night, and thou shalt lie with him, that we may save seed of our father."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Dederunt etiam et illa nocte patri suo bibere vinum, ingressaque minor filia, dormivit cum eo: et ne tunc quidem sensit quando concubuerit, vel quando illa surrexerit."
      en: "They made their father drink wine that night also, and the younger daughter went in, and lay with him: and neither then did he perceive when she lay down, nor when she rose up."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Conceperunt ergo duae filiae Lot de patre suo."
      en: "So the two daughters of Lot were with child by their father."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Peperitque major filium, et vocavit nomen ejus Moab: ipse est pater Moabitarum usque in praesentem diem."
      en: "And the elder bore a son, and she called his name Moab: he is the father of the Moabites unto this day."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Minor quoque peperit filium, et vocavit nomen ejus Ammon, id est, Filius populi mei: ipse est pater Ammonitarum usque hodie."
      en: "The younger also bore a son, and she called his name Ammon, that is, the son of my people: he is the father of the Ammonites unto this day."
    status: { la: verified, en: verified }
