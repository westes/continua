# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 5
verses:
  - n: 1
    text:
      la: "noli adtendere ad possessiones iniquas et ne dixeris est mihi sufficiens vita nihil enim proderit in tempore vindictae et obductionis"
      en: "Set not thy heart upon unjust possessions, and say not: I have enough to live on: for it shall be of no service in the time of vengeance and darkness."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "non sequaris concupiscentiam cordis"
      en: "Follow not in thy strength the desires of thy heart:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ne dixeris quomodo potui aut quis me subiciet propter facta mea Deus enim vindicans vindicabit"
      en: "And say not: How mighty am I? and who shall bring me under for my deeds? for God will surely take revenge."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ne dixeris peccavi et quid accidit mihi triste Altissimus enim est patiens redditor"
      en: "Say not: I have sinned, and whet harm hath befallen me? for the most High is a patient rewarder."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "de propitiatu peccatorum noli esse sine metu neque adicias peccatum super peccatum"
      en: "Be not without fear about sin forgiven, and add not sin upon sin:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ne dicas miseratio Dei magna est multitudinis peccatorum meorum miserebitur"
      en: "And say not: The mercy of the Lord is great, he will have mercy on the multitude of my sins."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "misericordia enim et ira ab illo et in peccatores respicit ira illius"
      en: "For mercy and wrath quickly come from him, and his wrath looketh upon sinners."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "non tardes converti ad Deum et ne differas de die in diem"
      en: "Delay not to be converted to the Lord, and defer it not from day to day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "subito enim venit ira illius et in tempore vindictae disperdet te"
      en: "For his wrath shall come on a sudden, and in the time of vengeance he will destroy thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "noli anxius esse in divitiis iniustis nihil enim proderunt tibi in die obductionis et vindictae"
      en: "Be not anxious for goods unjustly gotten: for they shall not profit thee in the day of calamity and revenge."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non ventiles te in omnem ventum et non eas in omni via sic enim peccator probatur duplici lingua"
      en: "Winnow not with every wind, and go not into every way: for so is every sinner proved by a double tongue."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "esto firmus in via Dei et in veritate sensus tui et scientia et prosequatur te verbum pacis et iustitiae"
      en: "Be steadfast in the way of the Lord, and in the truth of thy judgment, and in knowledge, and let the word of peace and justice keep with thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "esto mansuetus ad audiendum verbum ut intellegas et cum sapientia fers responsum verum"
      en: "Be meek to hear the word, that thou mayst understand: and return a true answer with wisdom."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si est tibi intellectus responde proximo sin autem sit manus tua super os tuum ne capiaris in verbo indisciplinato et confundaris"
      en: "If thou have understanding, answer thy neighbour: but if not, let thy hand be upon thy mouth, lest thou be surprised in an unskilful word, and be confounded."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "honor et gloria in sermone sensati lingua inprudentis subversio ipsius"
      en: "Honour and glory is in the word of the wise, but the tongue of the fool is his ruin."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non appelleris susurrio et lingua tua capiaris et confundaris"
      en: "Be not called a whisperer, and be not taken in thy tongue, and confounded."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "super furem enim est confusio et paenitentia et denotatio pessima super bilinguem susurratori autem odium et inimicitia et contumelia"
      en: "For confusion and repentance is upon a thief, and an evil mark of disgrace upon the double tongued, but to the whisperer hatred, and enmity, and reproach."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "iustifica pusillo et magno similiter"
      en: "Justify alike the small and the great."
    status: { la: verified, en: verified }
