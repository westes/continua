# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 5
verses:
  - n: 1
    text:
      la: "Noli attendere ad possessiones iniquas, et ne dixeris: Est mihi sufficiens vita: nihil enim proderit in tempore vindictae et obductionis."
      en: "Set not thy heart upon unjust possessions, and say not: I have enough to live on: for it shall be of no service in the time of vengeance and darkness."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ne sequaris in fortitudine tua concupiscentiam cordis tui,"
      en: "Follow not in thy strength the desires of thy heart:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ne dixeris: Quomodo potui? aut, Quis me subjiciet propter facta mea? Deus enim vindicans vindicabit."
      en: "And say not: How mighty am I? and who shall bring me under for my deeds? for God will surely take revenge."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ne dixeris: Peccavi: et quid mihi accidit triste? Altissimus enim est patiens redditor."
      en: "Say not: I have sinned, and what harm hath befallen me? for the most High is a patient rewarder."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "De propitiatio peccato noli esse sine metu, neque adjicias peccatum super peccatum."
      en: "Be not without fear about sin forgiven, and add not sin upon sin:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ne dicas: Miseratio Domini magna est, multitudinis peccatorum meorum miserebitur:"
      en: "And say not: The mercy of the Lord is great, he will have mercy on the multitude of my sins."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "misericordia enim et ira ab illo cito proximant, et in peccatores respicit ira illius."
      en: "For mercy and wrath quickly come from him, and his wrath looketh upon sinners."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non tardes converti ad Dominum, et ne differas de die in diem:"
      en: "Delay not to be converted to the Lord, and defer it not from day to day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "subito enim veniet ira illius, et in tempore vindictae disperdet te."
      en: "For his wrath shall come on a sudden, and in the time of vengeance he will destroy thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Noli anxius esse in divitiis injustis: non enim proderunt tibi in die obductionis et vindictae."
      en: "Be not anxious for goods unjustly gotten: for they shall not profit thee in the day of calamity and revenge."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Non ventiles te in omnem ventum, et non eas in omnem viam: sic enim omnis peccator probatur in duplici lingua."
      en: "Winnow not with every wind, and go not into every way: for so is every sinner proved by a double tongue."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Esto firmus in via Domini, et in veritate sensus tui et scientia: et prosequatur te verbum pacis et justitiae."
      en: "Be steadfast in the way of the Lord, and in the truth of thy judgment, and in knowledge, and let the word of peace and justice keep with thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Esto mansuetus ad audiendum verbum, ut intelligas, et cum sapientia proferas responsum verum."
      en: "Be meek to hear the word, that thou mayst understand: and return a true answer with wisdom."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Si est tibi intellectus, responde proximo: sin autem, sit manus tua super os tuum, ne capiaris in verbo indisciplinato, et confundaris."
      en: "If thou have understanding, answer thy neighbour: but if not, let thy hand be upon thy mouth, lest thou be surprised in an unskillful word, and be confounded."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Honor et gloria in sermone sensati: lingua vero imprudentis subversio est ipsius."
      en: "Honour and glory is in the word of the wise, but the tongue of the fool is his ruin."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non appelleris susurro, et lingua tua ne capiaris et confundaris:"
      en: "Be not called a whisperer, and be not taken in thy tongue, and confounded."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "super furem enim est confusio et poenitentia, et denotatio pessima super bilinguem: susurratori autem odium, et inimicitia, et contumelia."
      en: "For confusion and repentance is upon a thief, and an evil mark of disgrace upon the double tongued, but to the whisperer hatred, and enmity, and reproach."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Justifica pusillum et magnum similiter."
      en: "Justify alike the small and the great."
    status: { la: verified, en: verified }
