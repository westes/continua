# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 20
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Haec loqueris filiis Israel: Homo de filiis Israel, et de advenis qui habitant in Israel, si quis dederit de semine suo idolo Moloch, morte moriatur: populus terrae lapidabit eum."
      en: "Thus shalt thou say to the children of Israel: If any man of the children of Israel, or of the strangers, that dwell in Israel, give of his seed to the idol Moloch, dying let him die: the people of the land shall stone him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ego ponam faciem meam contra illum: succidamque eum de medio populi sui, eo quod dederit de semine suo Moloch, et contaminaverit sanctuarium meum, ac polluerit nomen sanctum meum."
      en: "And I will set my face against him: and I will cut him off from the midst of his people, because he hath given of his seed to Moloch, and hath defiled my sanctuary, and profaned my holy name."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quod si negligens populus terrae, et quasi parvipendens imperium meum, dimiserit hominem qui dedit de semine suo Moloch, nec voluerit eum occidere:"
      en: "And if the people of the land neglecting, and as it were little regarding my commandment, let alone the man that hath given of his seed to Moloch, and will not kill him:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ponam faciem meam super hominem illum, et super cognationem ejus, succidamque et ipsum, et omnes qui consenserunt ei ut fornicarentur cum Moloch, de medio populi sui."
      en: "I will set my face against that man, and his kindred, and will cut off both him and all that consented with him, to commit fornication with Moloch, out of the midst of their people."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Anima, quae declinaverit ad magos et ariolos, et fornicata fuerit cum eis, ponam faciem meam contra eam, et interficiam illam de medio populi sui."
      en: "The soul that shall go aside after magicians, and soothsayers, and shall commit fornication with them, I will set my face against that soul, and destroy it out of the midst of its people."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sanctificamini et estote sancti, quia ego sum Dominus Deus vester."
      en: "Sanctify yourselves, and be ye holy because I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Custodite praecepta mea, et facite ea: ego Dominus qui sanctifico vos."
      en: "Keep my precepts, and do them. I am the Lord that sanctify you."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui maledixerit patri suo, aut matri, morte moriatur: patri matrique maledixit: sanguis ejus sit super eum."
      en: "He that curseth his father, or mother, dying let him die: he hath cursed his father, and mother, let his blood be upon him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si moechatus quis fuerit cum uxore alterius, et adulterium perpetraverit cum conjuge proximi sui, morte moriantur et moechus et adultera."
      en: "If any man commit adultery with the wife of another, and defile his neighbour's wife, let them be put to death, both the adulterer and the adulteress."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui dormierit cum noverca sua, et revelaverit ignominiam patris sui, morte moriantur ambo: sanguis eorum sit super eos."
      en: "If a man lie with his stepmother, and discover the nakedness of his father, let them both be put to death: their blood be upon them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Si quis dormierit cum nuru sua, uterque moriatur, quia scelus operati sunt: sanguis eorum sit super eos."
      en: "If any man lie with his daughter in law, let both die, because they have done a heinous crime: their blood be upon them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Qui dormierit cum masculo coitu femineo, uterque operatus est nefas: morte moriantur: sit sanguis eorum super eos."
      en: "If any one lie with a man as with a woman, both have committed an abomination, let them be put to death: their blood be upon them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui supra uxorem filiam, duxerit matrem ejus, scelus operatus est: vivus ardebit cum eis, nec permanebit tantum nefas in medio vestri."
      en: "If any man after marrying the daughter, marry her mother, he hath done a heinous crime: he shall be burnt alive with them: neither shall so great an abomination remain in the midst of you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Qui cum jumento et pecore coierit, morte moriatur: pecus quoque occidite."
      en: "He that shall copulate with any beast or cattle, dying let him die, the beast also ye shall kill."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Mulier, quae succubuerit cuilibet jumento, simul interficietur cum eo: sanguis eorum sit super eos."
      en: "The woman that shall lie under any beast, shall be killed together with the same: their blood be upon them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Qui acceperit sororem suam filiam patris sui, vel filiam matris suae, et viderit turpitudinem ejus, illaque conspexerit fratris ignominiam, nefariam rem operati sunt: occidentur in conspectu populi sui, eo quod turpitudinem suam mutuo revelaverint, et portabunt iniquitatem suam."
      en: "If any man take his sister, the daughter of his father, or the daughter of his mother, and see her nakedness, and she behold her brother's shame: they have committed a crime: they shall be slain, in the sight of their people, because they have discovered one another's nakedness, and they shall bear their iniquity."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui coierit cum muliere in fluxu menstruo, et revelaverit turpitudinem ejus, ipsaque aperuerit fontem sanguinis sui, interficientur ambo de medio populi sui."
      en: "If any man lie with a woman in her flowers, and uncover her nakedness, and she open the fountain of her blood, both shall be destroyed out of the midst of their people."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Turpitudinem materterae et amitae tuae non discooperies: qui hoc fecerit, ignominiam carnis suae nudavit; portabunt ambo iniquitatem suam."
      en: "Thou shalt not uncover the nakedness of thy aunt by thy mother, and of thy aunt by thy father: he that doth this, hath uncovered the shame of his own flesh, both shall bear their iniquity."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Qui coierit cum uxore patrui vel avunculi sui, et revelaverit ignominiam cognationis suae, portabunt ambo peccatum suum: absque liberis morientur."
      en: "If any man lie with the wife of his uncle by the father, or of his uncle by the mother, and uncover the shame of his near akin, both shall bear their sin: they shall die without children."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui duxerit uxorem fratris sui, rem facit illicitam: turpitudinem fratris sui revelavit: absque liberis erunt."
      en: "He that marrieth his brother's wife, doth an unlawful thing, he hath uncovered his brother's nakedness: they shall be without children."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Custodite leges meas, atque judicia, et facite ea: ne et vos evomat terra quam intraturi estis et habitaturi."
      en: "Keep my laws and my judgments, and do them: lest the land into which you are to enter to dwell therein, vomit you also out."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Nolite ambulare in legitimis nationum, quas ego expulsurus sum ante vos. Omnia enim haec fecerunt, et abominatus sum eas."
      en: "Walk not after the laws of the nations, which I will cast out before you. For they have done all these things, and therefore I abhorred them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Vobis autem loquor. Possidete terram eorum, quam dabo vobis in haereditatem, terram fluentem lacte et melle. Ego Dominus Deus vester, qui separavi vos a ceteris populis."
      en: "But to you I say: Possess their land which I will give you for an inheritance, a land flowing with milk and honey. I am the Lord your God, who have separated you from other people."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Separate ergo et vos jumentum mundum ab immundo, et avem mundam ab immunda: ne polluatis animas vestras in pecore, et avibus, et cunctis quae moventur in terra, et quae vobis ostendi esse polluta."
      en: "Therefore do you also separate the clean beast from the unclean, and the clean fowl from the unclean: defile not your souls with beasts, or birds, or any things that move on the earth, and which I have shewn you to be unclean."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Eritis mihi sancti, quia sanctus sum ego Dominus, et separavi vos a ceteris populis, ut essetis mei."
      en: "You shall be holy unto me, because I the Lord am holy, and I have separated you from other people, that you should be mine."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Vir, sive mulier, in quibus pythonicus, vel divinationis fuerit spiritus, morte moriantur: lapidibus obruent eos: sanguis eorum sit super illos."
      en: "A man, or woman, in whom there is a pythonical or divining spirit, dying let them die: they shall stone them: their blood be upon them."
    status: { la: verified, en: verified }
