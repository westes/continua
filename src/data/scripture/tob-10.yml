# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: tob
chapter: 10
verses:
  - n: 1
    text:
      la: "cum vero moras faceret Tobias causa nuptiarum sollicitus erat pater eius Tobias dicens putas quare moratur filius meus aut quare detentus est ibi"
      en: "But as Tobias made longer stay upon occasion of the marriage, Tobias his father was solicitous, saying: Why thinkest thou doth my son tarry, or why is he detained there?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "putasne Gabelus mortuus est et nemo illi reddet pecuniam"
      en: "Is Gabelus dead, thinkest thou, and no man will pay him the money?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "coepit autem contristari nimis ipse et Anna uxor eius cum eo et coeperunt ambo simul flere eo quod die statuto minime reverteretur filius eorum ad eos"
      en: "And he began to be exceeding sad, both he and Anna his wife with him: and they began both to weep together: because their son did not return to them on the day appointed."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "flebat igitur mater eius inremediabilibus lacrimis atque dicebat heu heu me fili mi ut quid te misimus peregrinari lumen oculorum nostrorum baculum senectutis nostrae solacium vitae nostrae spem posteritatis nostrae"
      en: "But his mother wept and was quite disconsolate, and said: Woe, woe is me, my son; why did we send thee to go to a strange country, the light of our eyes, the staff of our old age, the comfort of our life, the hope of our posterity?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "omnia in te uno habentes te non debuimus dimittere ire a nobis"
      en: "We having all things together in thee alone, ought not to have let thee go from us."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cui dicebat Tobias tace et noli turbari sanus est filius noster satis fidelis est vir ille cum quo misimus eum"
      en: "And Tobias said to her: Hold thy peace, and be not troubled, our son is safe: that man with whom we sent him is very trusty."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "illa autem nullo modo consolari poterat sed cotidie exiliens circumspiciebat et circuibat vias omnes per quas spes remeandi videbatur ut procul videret eum si fieri possit venientem"
      en: "But she could by no means be comforted, but daily running out looked round about, and went into all the ways by which there seemed any hope he might return, that she might if possible see him coming afar off."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "at vero Raguhel dicebat ad generum suum mane hic et ego mittam nuntium salutis de te ad Tobiam patrem tuum"
      en: "But Raguel said to his son in law: Stay here, and I will send a messenger to Tobias thy father, that thou art in health."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cui Tobias dixit ego novi quia pater meus et mater mea modo dies conputant et cruciatur spiritus eorum in ipsis"
      en: "And Tobias said to him: I know that my father and mother now count the days, and their spirit is grievously afflicted within them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque verbis multis rogaret Raguhel Tobiam et ille eum nulla ratione vellet audire tradidit ei Sarram et dimidiam partem omnis substantiae suae in pueris et in puellis et in pecudibus et in camelis et in pecunia multa et salvum atque gaudentem dimisit eum a se"
      en: "And when Raguel had pressed Tobias with many words, and he by no means would hearken to him, he delivered Sara unto him, and half of all his substance in menservants, and womenservants, in cattle, in camels, and in kine, and in much money, and sent him away safe and joyful from him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dicens angelus Domini sanctus sit in itinere vestro perducatque vos incolomes et inveniatis omnia recte circa conparentes vestros et videant oculi mei filios vestros priusquam moriar"
      en: "Saying: The holy angel of the Lord be with you in your journey, and bring you through safe, and that you may find all things well about your parents, and my eyes see your children before I die."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et adprehendentes parentes filiam suam osculati sunt eam et dimiserunt ire"
      en: "And the parents taking their daughter kissed her, and let her go:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "monentes eam honorare soceros diligere maritum regere familiam gubernare domum et se ipsam inreprehensibilem exhibere"
      en: "Admonishing her to honour her father and mother in law, to love her husband, to take care of the family, to govern the house, and to behave herself irreprehensibly."
    status: { la: verified, en: verified }
