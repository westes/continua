# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 21
verses:
  - n: 1
    text:
      la: "Duodecim annorum erat Manasses cum regnare coepisset, et quinquaginta quinque annis regnavit in Jerusalem: nomen matris ejus Haphsiba."
      en: "Manasses was twelve years old when he began to reign, and he reigned five and fifty years in Jerusalem: the name of his mother was Haphsiba."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fecitque malum in conspectu Domini, juxta idola gentium, quas delevit Dominus a facie filiorum Israel."
      en: "And he did evil in the sight of the Lord, according to the idols of the nations, which the Lord destroyed from before the face of the children of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Conversusque est, et aedificavit excelsa, quae dissipaverat Ezechias pater ejus: et erexit aras Baal, et fecit lucos sicut fecerat Achab rex Israel, et adoravit omnem militiam caeli, et coluit eam."
      en: "And he turned, and built up the high places which Ezechias his father had destroyed: and he set up altars to Baal, and made groves, as Achab the king of Israel had done: and he adored all the host of heaven, and served them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Exstruxitque aras in domo Domini, de qua dixit Dominus: In Jerusalem ponam nomen meum."
      en: "And he built altars in the house of the Lord, of which the Lord said: In Jerusalem I will put my name."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et exstruxit altaria universae militiae caeli in duobus atriis templi Domini."
      en: "And he built altars for all the host of heaven in the two courts of the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et traduxit filium suum per ignem: et ariolatus est, et observavit auguria, et fecit pythones, et aruspices multiplicavit, ut faceret malum coram Domino, et irritaret eum."
      en: "And he made his son pass through fire: and he used divination, and observed omens, and appointed pythons, and multiplied soothsayers to do evil before the Lord, and to provoke him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Posuit quoque idolum luci, quem fecerat, in templo Domini, super quod locutus est Dominus ad David, et ad Salomonem filium ejus: In templo hoc, et in Jerusalem, quam elegi de cunctis tribubus Israel, ponam nomen meum in sempiternum."
      en: "He set also an idol of the grove, which he had made, in the temple of the Lord: concerning which the Lord said to David, and to Solomon his son: In this temple, and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name for ever."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ultra non faciam commoveri pedem Israel de terra, quam dedi patribus eorum: si tamen custodierint opere omnia quae praecepi eis, et universam legem, quam mandavit eis servus meus Moyses."
      en: "And I will no more make the feet of Israel to be moved out of the land, which I gave to their fathers: only if they will observe to do all that I have commanded them according to the law which my servant Moses commanded them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Illi vero non audierunt: sed seducti sunt a Manasse, ut facerent malum super gentes, quas contrivit Dominus a facie filiorum Israel."
      en: "But they hearkened not: but were seduced by Manasses, to do evil more than the nations which the Lord destroyed before the children of Israel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Locutusque est Dominus in manu servorum suorum prophetarum, dicens:"
      en: "And the Lord spoke in the hand of his servants, the prophets, saying:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quia fecit Manasses rex Juda abominationes istas pessimas, super omnia quae fecerunt Amorrhaei ante eum, et peccare fecit etiam Judam in immunditiis suis:"
      en: "Because Manasses king of Juda hath done these most wicked abominations, beyond all that the Amorrhites did before him, and hath made Juda also to sin with his filthy doings:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "propterea haec dicit Dominus Deus Israel: Ecce ego inducam mala super Jerusalem et Judam: ut quicumque audierit, tinniant ambae aures ejus."
      en: "Therefore thus saith the Lord the God of Israel: Behold I will bring on evils upon Jerusalem and Juda: that whosoever shall hear of them, both his ears shall tingle."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et extendam super Jerusalem funiculum Samariae, et pondus domus Achab: et delebo Jerusalem, sicut deleri solent tabulae: et delens vertam, et ducam crebrius stylum super faciem ejus."
      en: "And I will stretch over Jerusalem the line of Samaria, and the weight of the house of Achab: and I will efface Jerusalem, as tables are wont to be effaced, and I will erase and turn it, and draw the pencil often over the face thereof."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dimittam vero reliquias haereditatis meae, et tradam eas in manus inimicorum ejus: eruntque in vastitatem, et in rapinam cunctis adversariis suis:"
      en: "And I will leave the remnants of my inheritance, and will deliver them into the hands of their enemies: and they shall become a prey, and a spoil to all their enemies."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "eo quod fecerint malum coram me, et perseveraverint irritantes me, ex die qua egressi sunt patres eorum ex Aegypto, usque ad hanc diem."
      en: "Because they have done evil before me, and have continued to provoke me, from the day that their fathers came out of Egypt, even unto this day."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Insuper et sanguinem innoxium fudit Manasses multum nimis, donec impleret Jerusalem usque ad os: absque peccatis suis, quibus peccare fecit Judam, ut faceret malum coram Domino."
      en: "Moreover Manasses shed also very much innocent blood, till he filled Jerusalem up to the mouth: besides his sins, wherewith he made Juda to sin, to do evil before the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Reliqua autem sermonum Manasse, ut universa quae fecit, et peccatum ejus, quod peccavit, nonne haec scripta sunt in libro sermonum dierum regum Juda?"
      en: "Now the rest of the acts of Manasses, and all that he did, and his sin which he sinned, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dormivitque Manasses cum patribus suis, et sepultus est in horto domus suae, in horto Oza: et regnavit Amon filius ejus pro eo."
      en: "And Manasses slept with his fathers, and was buried in the garden of his own house, in the garden of Oza: and Amen his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Viginti duorum annorum erat Amon cum regnare coepisset: duobus quoque annis regnavit in Jerusalem: nomen matris ejus Messalemeth filia Harus de Jeteba."
      en: "Two and twenty years old was Amen when he began to reign, and he reigned two years in Jerusalem: the name of his mother was Messalemeth the daughter of Harus of Jeteba."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Fecitque malum in conspectu Domini, sicut fecerat Manasses pater ejus."
      en: "And he did evil in the sight, of the Lord, as Manasses his father had done."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ambulavit in omni via, per quam ambulaverat pater ejus: servivitque immunditiis, quibus servierat pater ejus, et adoravit eas,"
      en: "And he walked in all the way in which his father had walked: and he served the abominations which his father had served, and he adored them;"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et dereliquit Dominum Deum patrum suorum, et non ambulavit in via Domini."
      en: "And forsook the Lord the God of his fathers, and walked not in the way of the Lord."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Tetenderuntque ei insidias servi sui, et interfecerunt regem in domo sua."
      en: "And his servants plotted against him, and slew the king in his own house."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Percussit autem populus terrae omnes, qui conjuraverant contra regem Amon, et constituerunt sibi regem Josiam filium ejus pro eo."
      en: "But the people of the land slew all them that had conspired against king Amen: and made Josias his son their king in his stead."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Reliqua autem sermonum Amon, quae fecit, nonne haec scripta sunt in libro sermonum dierum regum Juda?"
      en: "But the rest of the acts of Amen which he did, are they not written in the book of the words of the days of the kings of Juda?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sepelieruntque eum in sepulchro suo, in horto Oza: et regnavit Josias filius ejus pro eo."
      en: "And they buried him in his sepulchre in the garden of Oza: and his son Josias reigned in his stead."
    status: { la: verified, en: verified }
