book: jos
chapter: 22
verses:
  - n: 1
    text:
      la: "eodem tempore vocavit Iosue Rubenitas et Gadditas et dimidiam tribum Manasse"
      en: "At the same time Josue called the Rubenites, and the Gadites, and the half tribe of Manasses,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque ad eos fecistis omnia quae vobis praecepit Moses famulus Domini mihi quoque in omnibus oboedistis"
      en: "And said to them: You have done all that Moses the servant of the Lord commanded you: you have also obeyed me in all things,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "nec reliquistis fratres vestros longo tempore usque in praesentem diem custodientes imperium Domini Dei vestri"
      en: "Neither have you left your brethren this long time, until this present day, keeping the commandment of the Lord your God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia igitur dedit Dominus Deus vester fratribus vestris quietem ac pacem sicut pollicitus est revertimini et ite in tabernacula vestra et in terram possessionis quam tradidit vobis Moses famulus Domini trans Iordanem"
      en: "Therefore as the Lord your God hath given your brethren rest and peace, as he promised: return, and go to your dwellings, and to the land of your possession, which Moses the servant of the Lord gave you beyond the Jordan:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ita dumtaxat ut custodiatis adtente et opere conpleatis mandatum et legem quam praecepit vobis Moses servus Domini ut diligatis Dominum Deum vestrum et ambuletis in omnibus viis eius et observetis mandata illius adhereatisque ei ac serviatis in omni corde et in omni anima vestra"
      en: "Yet so that you observe attentively, and in work fulfil the commandment and the law which Moses the servant of the Lord commanded you: that you love the Lord your God, and walk in all his ways, and keep all his commandments, and cleave to him, and serve him with all your heart, and with all your soul."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "benedixitque eis Iosue et dimisit eos qui reversi sunt in tabernacula sua"
      en: "And Josue blessed them, and sent them away, and they returned to their dwellings."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tribui autem Manasse mediae possessionem Moses dederat in Basan et idcirco mediae quae superfuit dedit Iosue sortem inter ceteros fratres suos trans Iordanem ad occidentalem eius plagam cumque dimitteret eos in tabernacula sua et benedixisset illis"
      en: "Now to half the tribe of Manasses, Moses had given a possession in Basan: and therefore to the half that remained, Josue gave a lot among the rest of their brethren beyond the Jordan to the west. And when he sent them away to their dwellings and had blessed them,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixit ad eos in multa substantia atque divitiis revertimini ad sedes vestras cum argento et auro aere ac ferro et veste multiplici dividite praedam hostium cum fratribus vestris"
      en: "He said to them : With much substance and riches, you return to your settlements, with silver and gold, brass and iron, and variety of raiment: divide the prey of your enemies with your brethren."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "reversique sunt et abierunt filii Ruben et filii Gad et dimidia tribus Manasse a filiis Israhel de Silo quae sita est in Chanaan ut intrarent Galaad terram possessionis suae quam obtinuerant iuxta imperium Domini in manu Mosi"
      en: "So the children of Ruben, and the children of Gad, and the half tribe of Manasses returned, and parted from the children of Israel in Silo, which is in Chanaan, to go into Galaad the land of their possession, which they had obtained according to the commandment of the Lord by the hand of Moses."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque venissent ad tumulos Iordanis in terra Chanaan aedificaverunt iuxta Iordanem altare infinitae magnitudinis"
      en: "And when they were come to the banks of the Jordan, in the land of Chanaan, they built an altar immensely great near the Jordan."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quod cum audissent filii Israhel et ad eos certi nuntii detulissent aedificasse filios Ruben et Gad et dimidiae tribus Manasse altare in terra Chanaan super Iordanis tumulos contra filios Israhel"
      en: "And when the children of Israel had heard of it, and certain messengers had brought them an account that the children of Ruben, and of Cad, and the half tribe of Manasses had built an altar in the land of Chanaan, upon the banks of the Jordan, over against the children of Israel:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "convenerunt omnes in Silo ut ascenderent et dimicarent contra eos"
      en: "They all assembled in Silo, to go up and fight against them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et interim miserunt ad illos in terram Galaad Finees filium Eleazar sacerdotem"
      en: "And in the mean time they sent to them into the land of Galaad, Phinees the son of Eleazar the priest,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et decem principes cum eo singulos de tribubus singulis"
      en: "And ten princes with him, one of every tribe."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui venerunt ad filios Ruben et Gad et dimidiae tribus Manasse in terram Galaad dixeruntque ad eos"
      en: "Who came to the children of Ruben, and of Gad, and the half tribe of Manasses, into the land of Galaad, and said to them:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "haec mandat omnis populus Domini quae est ista transgressio cur reliquistis Dominum Deum Israhel aedificantes altare sacrilegum et a cultu illius recedentes"
      en: "Thus saith all the people of the Lord: What meaneth this transgression? Why have you forsaken the Lord the God of Israel, building a sacrilegious altar, and revolting from the worship of him?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "an parum vobis est quod peccastis in Beelphegor et usque in praesentem diem macula huius sceleris in nobis permanet multique de populo corruerunt"
      en: "Is it a small thing to you that you sinned with Beelphegor, and the stain of that crime remaineth in us to this day? and many of the people perished."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et vos hodie reliquistis Dominum et cras in universum Israhel eius ira desaeviet"
      en: "And you have forsaken the Lord to day, and to morrow his wrath will rage against all Israel."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quod si putatis inmundam esse terram possessionis vestrae transite ad terram in qua tabernaculum Domini est et habitate inter nos tantum ut a Domino et a nostro consortio non recedatis aedificato altari praeter altare Domini Dei vestri"
      en: "But if you think the land of your possession to be unclean, pass over to the land wherein is the tabernacle of the Lord, and dwell among us: only depart not from the Lord, and from our society, by building an altar beside the altar of the Lord our God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "nonne Achan filius Zare praeteriit mandatum Domini et super omnem populum Israhel ira eius incubuit et ille erat unus homo atque utinam solus perisset in scelere suo"
      en: "Did not Achan the son of Zare transgress the commandment of the Lord, and his wrath lay upon all the people of Israel? And he was but one man, and would to God he alone had perished in his wickedness."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "responderuntque filii Ruben et Gad et dimidiae tribus Manasse principibus legationis Israhel"
      en: "And the children of Ruben, and of Gad, and of the half tribe of Manasses answered the princes of the embassage of Israel:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "fortissimus Deus Dominus fortissimus Deus Dominus ipse novit et Israhel simul intelleget si praevaricationis animo hoc altare construximus non custodiat nos sed puniat in praesenti"
      en: "The Lord the most mighty God, the Lord the most mighty God, he knoweth, and Israel also shall understand: If with the design of transgression we have set up this altar, let him not save us, but punish us immediately:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et si ea mente fecimus ut holocausta et sacrificium et pacificas victimas super eo inponeremus ipse quaerat et iudicet"
      en: "And if we did it with that mind, that we might lay upon it holocausts, and sacrifice, and victims of peace offerings, let him require and judge:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et non ea magis cogitatione atque tractatu ut diceremus cras dicent filii vestri filiis nostris quid vobis et Domino Deo Israhel"
      en: "And not rather with this thought and design, that we should say: To morrow your children will say to our children: What have you to do with the Lord the God of Israel?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "terminum posuit Dominus inter nos et vos o filii Ruben et filii Gad Iordanem fluvium et idcirco partem non habetis in Domino et per hanc occasionem avertent filii vestri filios nostros a timore Domini putavimus itaque melius"
      en: "The Lord hath put the river Jordan for a border between us and you, O ye children of Ruben, and ye children of Gad: and therefore you have no part in the Lord. And by this occasion you children shall turn away our children from the fear of the Lord. We therefore thought, it best,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et diximus extruamus nobis altare non in holocausta neque ad victimas offerendas"
      en: "And said: Let us build us an altar, not for holocausts, nor to offer victims,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sed in testimonium inter nos et vos et subolem nostram vestramque progeniem ut serviamus Domino et iuris nostri sit offerre holocausta et victimas et pacificas hostias et nequaquam dicant cras filii vestri filiis nostris non est vobis pars in Domino"
      en: "But for a testimony between us and you, and our posterity and yours, that we may serve the Lord, and that we may have a right to offer both holocausts, and victims and sacrifices of peace offerings: and that your children to morrow may not say to our children: You have no part in the Lord."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quod si voluerint dicere respondebunt eis ecce altare Domini quod fecerunt patres nostri non in holocausta neque in sacrificium sed in testimonium vestrum ac nostrum"
      en: "And if they will say so, they shall answer them: Behold the altar of the Lord, which our fathers made, not for holocausts, nor for sacrifice, but for a testimony between us and you."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "absit a nobis hoc scelus ut recedamus a Domino et eius vestigia relinquamus extructo altari ad holocausta et sacrificia et victimas offerendas praeter altare Domini Dei nostri quod extructum est ante tabernaculum eius"
      en: "God keep us from any such wickedness that we should revolt from the Lord, and leave off following his steps, by building an altar to offer holocausts, and sacrifices, and victims, beside the altar of the Lord our God, which is erected before his tabernacle."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quibus auditis Finees sacerdos et principes legationis Israhel qui erant cum eo placati sunt et verba filiorum Ruben et Gad et dimidiae tribus Manasse libentissime susceperunt"
      en: "And when Phinees the priest, and the princes of the embassage, who were with him, had heard this, they were satisfied: and they admitted most willingly the words of the children of Ruben, and Gad, and of the half tribe of Manasses."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "dixitque Finees filius Eleazari sacerdos ad eos nunc scimus quod nobiscum sit Dominus quoniam alieni estis a praevaricatione hac et liberastis filios Israhel de manu Domini"
      en: "And Phinees the priest the son of Eleazar said to them: Now we know that the Lord is with us, because you are not guilty of this revolt, and you have delivered the children of Israel from the hand of the Lord."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "reversusque est cum principibus a filiis Ruben et Gad de terra Galaad finium Chanaan ad filios Israhel et rettulit eis"
      en: "And he returned with the princes from the children of Ruben and Gad, out of the land of Galaad, into the land of Chanaan, to the children of Israel, and brought them word again."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "placuitque sermo cunctis audientibus et laudaverunt Deum filii Israhel et nequaquam ultra dixerunt ut ascenderent contra eos atque pugnarent et delerent terram possessionis eorum"
      en: "And the saying pleased all that heard it. And the children of Israel praised God, and they no longer said that they would go up against them, and fight, and destroy the land of their possession."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "vocaveruntque filii Ruben et filii Gad altare quod extruxerant Testimonium nostrum quod Dominus ipse sit Deus"
      en: "And the children of Ruben, and the children of Cad called the altar which they had built, Our testimony, that the Lord is God."
    status: { la: verified, en: verified }
