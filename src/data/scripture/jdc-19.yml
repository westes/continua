# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 19
verses:
  - n: 1
    text:
      la: "Fuit quidam vir Levites habitans in latere montis Ephraim, qui accepit uxorem de Bethlehem Juda:"
      en: "There was a certain Levite, who dwelt on the side of mount Ephraim, who took a wife of Bethlehem Juda:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quae reliquit eum, et reversa est in domum patris sui in Bethlehem, mansitque apud eum quatuor mensibus."
      en: "And she left him and returned to her father's house in Bethlehem, and abode with him four months."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Secutusque est eam vir suus, volens reconciliari ei, atque blandiri, et secum reducere, habens in comitatu puerum et duos asinos: quae suscepit eum, et introduxit in domum patris sui. Quod cum audisset socer ejus, eumque vidisset, occurrit ei laetus,"
      en: "And her husband followed her, willing to be reconciled with her, and to speak kindly to her, and to bring her back with him, having with him a servant and two asses: and she received him, and brought him into her father's house. And when his father in law had heard this, and had seen him, he met him with joy,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et amplexatus est hominem. Mansitque gener in domo soceri tribus diebus, comedens cum eo et bibens familiariter."
      en: "And embraced the man. And the son in law tarried in the house of his father in law three days, eating with him and drinking familiarly."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Die autem quarto de nocte consurgens, proficisci voluit: quem tenuit socer, et ait ad eum: Gusta prius pauxillum panis, et conforta stomachum, et sic proficisceris."
      en: "But on the fourth day arising early in the morning he desired to depart. But his father in law kept him, and said to him: Taste first a little bread, and strengthen thy stomach, and so thou shalt depart."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sederuntque simul, ac comederunt et biberunt. Dixitque pater puellae ad generum suum: Quaeso te ut hodie hic maneas, pariterque laetemur."
      en: "And they sat down together, and ate and drank. And the father of the young woman said to his son in law: I beseech thee to stay here today, and let us make merry together."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "At ille consurgens, coepit velle proficisci. Et nihilominus obnixe eum socer tenuit, et apud se fecit manere."
      en: "But he rising up began to be for departing. And nevertheless his father in law earnestly pressed him, and made him stay with him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Mane autem facto, parabat Levites iter. Cui socer rursum: Oro te, inquit, ut paululum cibi capias, et assumptis viribus, donec increscat dies, postea proficiscaris. Comederunt ergo simul."
      en: "But when morning was come, the Levite prepared to go on his journey. And his father in law said to him again: I beseech thee to take a little meat, and strengthening thyself, till the day be farther advanced, afterwards thou mayest depart. And they ate together."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Surrexitque adolescens, ut pergeret cum uxore sua et puero. Cui rursum locutus est socer: Considera quod dies ad occasum declivior sit, et propinquat ad vesperum: mane apud me etiam hodie, et duc laetum diem, et cras proficisceris ut vadas in domum tuam."
      en: "And the young man arose to set forward with his wife and servant. And his father in law spoke to him again: Consider that the day is declining, and draweth toward evening: tarry with me today also, and spend the day in mirth, and tomorrow thou shalt depart, that thou mayest go into thy house."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Noluit gener acquiescere sermonibus ejus: sed statim perrexit, et venit contra Jebus, quae altero nomine vocatur Jerusalem, ducens secum duos asinos onustos, et concubinam."
      en: "His son in law would not consent to his words: but forthwith went forward and came over against Jebus, which by another name is called Jerusalem, leading with him two asses laden, and his concubine."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Jamque erant juxta Jebus, et dies mutabatur in noctem: dixitque puer ad dominum suum: Veni, obsecro: declinemus ad urbem Jebusaeorum, et maneamus in ea."
      en: "And now they were come near Jebus, and the day was far spent: and the servant said to his master: Come, I beseech thee, let us turn into the city of the Jebusites, and lodge there."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cui respondit dominus: Non ingrediar oppidum gentis alienae, quae non est de filiis Israel, sed transibo usque Gabaa:"
      en: "His master answered him: I will not go into the town of another nation, who are not of the children of Israel, but I will pass over to Gabaa:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et cum illuc pervenero, manebimus in ea, aut certe in urbe Rama."
      en: "And when I shall come thither, we will lodge there, or at least in the city of Rama."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Transierunt ergo Jebus, et coeptum carpebant iter, occubuitque eis sol juxta Gabaa, quae est in tribu Benjamin:"
      en: "So they passed by Jebus, and went on their journey, and the sun went down upon them when they were by Gabaa, which is in the tribe of Benjamin:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "diverteruntque ad eam, ut manerent ibi. Quo cum intrassent, sedebant in platea civitatis, et nullus eos recipere voluit hospitio."
      en: "And they turned into it, to lodge there. And when they were come in, they sat in the street of the city, for no man would receive them to lodge."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et ecce, apparuit homo senex, revertens de agro et de opere suo vesperi, qui et ipse de monte erat Ephraim, et peregrinus habitabat in Gabaa: homines autem regionis illius erant filii Jemini."
      en: "And behold they saw an old man, returning out of the field and from his work in the evening, and he also was of mount Ephraim, and dwelt as a stranger in Gabaa; but the men of that country were the children of Jemini."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Elevatisque oculis, vidit senex sedentem hominem cum sarcinulis suis in platea civitatis, et dixit ad eum: Unde venis? et quo vadis?"
      en: "And the old man lifting up his eyes, saw the man sitting with his bundles in the street of the city, and said to him: Whence comest thou? and whither goest thou?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui respondit ei: Profecti sumus de Bethlehem Juda, et pergimus ad locum nostrum, qui est in latere montis Ephraim, unde ieramus in Bethlehem: et nunc vadimus ad domum Dei, nullusque sub tectum suum nos vult recipere,"
      en: "He answered him: We came out from Bethlehem Juda, and we are going to our home, which is on the side of mount Ephraim, from whence we went to Bethlehem: and now we go to the house of God, and none will receive us under his roof:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "habentes paleas et foenum in asinorum pabulum, et panem ac vinum in meos et ancillae tuae usus, et pueri qui mecum est: nulla re indigemus nisi hospitio."
      en: "We have straw and hay for provender of the asses, and bread and wine for the use of myself and of thy handmaid, and of the servant that is with me: we want nothing but lodging."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cui respondit senex: Pax tecum sit, ego praebebo omnia quae necessaria sunt: tantum, quaeso, ne in platea maneas."
      en: "And the old man answered him: Peace be with thee: I will furnish all things that are necessary: only I beseech thee, stay not in the street."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Introduxitque eum in domum suam, et pabulum asinis praebuit: ac postquam laverunt pedes suos, recepit eos in convivium."
      en: "And he brought him into his house, and gave provender to his asses: and after they had washed their feet, he entertained them with a feast."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Illis epulantibus, et post laborem itineris cibo et potu reficientibus corpora, venerunt viri civitatis illius, filii Belial ( id est, absque jugo), et circumdantes domum senis, fores pulsare coeperunt, clamantes ad dominum domus, atque dicentes: Educ virum, qui ingressus est domum tuam, ut abutamur eo."
      en: "While they were making merry, and refreshing their bodies with meat and drink, after the labour of the journey, the men of that city, sons of Belial, (that is, without yoke,) came and beset the old man's house, and began to knock at the door, calling to the master of the house, and saying: Bring forth the man that came into thy house, that we may abuse him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Egressusque est ad eos senex, et ait: Nolite, fratres, nolite facere malum hoc, quia ingressus est homo hospitium meum: et cessate ab hac stultitia."
      en: "And the old man went out to them, and said: Do not so, my brethren, do not so wickedly: because this man is come into my lodging, and cease I pray you from this folly."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Habeo filiam virginem, et hic homo habet concubinam: educam eas ad vos, ut humilietis eas, et vestram libidinem compleatis: tantum, obsecro, ne scelus hoc contra naturam operemini in virum."
      en: "I have a maiden daughter, and this man hath a concubine, I will bring them out to you, and you may humble them, and satisfy your lust: only, I beseech you, commit not this crime against nature on the man."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Nolebant acquiescere sermonibus illius: quod cernens homo, eduxit ad eos concubinam suam, et eis tradidit illudendam: qua cum tota nocte abusi essent, dimiserunt eam mane."
      en: "They would not be satisfied with his words; which the man seeing, brought out his concubine to them, and abandoned her to their wickedness: and when they had abused her all the night, they let her go in the morning."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "At mulier, recedentibus tenebris, venit ad ostium domus, ubi manebat dominus suus, et ibi corruit."
      en: "But the woman, at the dawning of the day, came to the door of the house where her lord lodged, and there fell down."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Mane facto, surrexit homo, et aperuit ostium, ut coeptam expleret viam: et ecce concubina ejus jacebat ante ostium sparsis in limine manibus."
      en: "And in the morning the man arose, and opened the door that he might end the journey he had begun: and behold his concubine lay before the door with her hands spread on the threshold."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Cui ille, putans eam quiescere, loquebatur: Surge, et ambulemus. Qua nihil respondente, intelligens quod erat mortua, tulit eam, et imposuit asino, reversusque est in domum suam."
      en: "He thinking she was taking her rest, said to her: Arise, and let us be going. But as she made no answer, perceiving she was dead, he took her up, and laid her upon his ass, and returned to his house."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Quam cum esset ingressus, arripuit gladium, et cadaver uxoris cum ossibus suis in duodecim partes ac frustra concidens, misit in omnes terminos Israel."
      en: "And when he was come home he took a sword, and divided the dead body of his wife with her bones into twelve parts, and sent the pieces into all the borders of Israel."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Quod cum vidissent singuli, conclamabant: Numquam res talis facta est in Israel ex eo die, quo ascenderunt patres nostri de Aegypto, usque in praesens tempus: ferte sententiam, et in commune decernite quid facto opus sit."
      en: "And when every one had seen this, they all cried out: There was never such a thing done in Israel from the day that our fathers came up out of Egypt, until this day: give sentence, and decree in common what ought to be done."
    status: { la: verified, en: verified }
