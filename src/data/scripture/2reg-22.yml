# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2reg
chapter: 22
verses:
  - n: 1
    text:
      la: "locutus est autem David Domino verba carminis huius in die qua liberavit eum Dominus de manu omnium inimicorum suorum et de manu Saul"
      en: "And David spoke to the Lord the words of this canticle, in the day that the Lord delivered him out of the hand of all his enemies, and out of the hand of Saul,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ait Dominus petra mea et robur meum et salvator meus"
      en: "And he said: The Lord is my rock, and my strength, and my saviour."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Deus meus fortis meus sperabo in eum scutum meum et cornu salutis meae elevator meus et refugium meum salvator meus de iniquitate liberabis me"
      en: "God is my strong one, in him will I trust: my shield, and the horn of my salvation: he lifteth me up, and is my refuge: my saviour, thou wilt deliver me from iniquity."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "laudabilem invocabo Dominum et ab inimicis meis salvus ero"
      en: "I will call on the Lord who is worthy to be praised: and I shall be saved from my enemies."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quia circumdederunt me contritiones mortis torrentes Belial terruerunt me"
      en: "For the pangs of death have sur rounded me: the floods of Belial have made me afraid."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "funes inferi circumdederunt me praevenerunt me laquei mortis"
      en: "The cords of hell compassed me: the snares of death prevented me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in tribulatione mea invocabo Dominum et ad Deum meum clamabo et exaudiet de templo suo vocem meam et clamor meus veniet ad aures eius"
      en: "In my distress I will call upon the Lord, and I will cry to my God: and he will hear my voice out of his temple, and my cry shall come to his ears."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "commota est et contremuit terra fundamenta montium concussa sunt et conquassata quoniam iratus est"
      en: "The earth shook and trembled, the foundations of the mountains were moved, and shaken, because he was angry with them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ascendit fumus de naribus eius et ignis de ore eius voravit carbones incensi sunt ab eo"
      en: "A smoke went up from his nostrils, and a devouring fire out of his mouth: coals were kindled by it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et inclinavit caelos et descendit et caligo sub pedibus eius"
      en: "He bowed the heavens, and came down: and darkness was under his feet."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ascendit super cherubin et volavit et lapsus est super pinnas venti"
      en: "And he rode upon the cherubims, and flew: and slid upon the wings of the wind."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "posuit tenebras in circuitu suo latibulum cribrans aquas de nubibus caelorum"
      en: "He made darkness a covering round about him: dropping waters out of the clouds of the heavens."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "prae fulgore in conspectu eius succensi sunt carbones ignis"
      en: "By the brightness before him, the coals of fire were kindled."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tonabit de caelis Dominus et Excelsus dabit vocem suam"
      en: "The Lord shall thunder from heaven: and the most high shall give forth his voice."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "misit sagittas et dissipavit eos fulgur et consumpsit eos"
      en: "He shot arrows and scattered them: lightning, and consumed them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et apparuerunt effusiones maris et revelata sunt fundamenta orbis ab increpatione Domini ab inspiratione spiritus furoris eius"
      en: "And the overflowings of the sea appeared, and the foundations of the world were laid open at the rebuke of the Lord, at the blast of the spirit of his wrath."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "misit de excelso et adsumpsit me extraxit me de aquis multis"
      en: "He sent from on high, and took me, and drew me out of many waters."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "liberavit me ab inimico meo potentissimo ab his qui oderant me quoniam robustiores me erant"
      en: "He delivered me from my most mighty enemy, and from them that hated me: for they were too strong for me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "praevenit me in die adflictionis meae et factus est Dominus firmamentum meum"
      en: "He prevented me in the day of my affliction, and the Lord became my stay."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et eduxit me in latitudinem liberavit me quia placuit ei"
      en: "And he brought me forth into a large place, he delivered me, because I pleased him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "retribuet mihi Dominus secundum iustitiam meam et secundum munditiam manuum mearum reddet mihi"
      en: "The Lord will reward me according to my justice: and according to the cleanness of my hands he will render to me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quia custodivi vias Domini et non egi impie a Deo meo"
      en: "Because I have kept the ways of the Lord, and have not wickedly departed from my God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "omnia enim iudicia eius in conspectu meo et praecepta eius non amovi a me"
      en: "For all his judgments are in my sight: and his precepts I have not removed from me."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et ero perfectus cum eo et custodiam me ab iniquitate mea"
      en: "And I shall be perfect with him: and shall keep myself from my iniquity."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et restituet Dominus mihi secundum iustitiam meam et secundum munditiam manuum mearum in conspectu oculorum suorum"
      en: "And the Lord will recompense me according to my justice: and according to the cleanness of my hands in the sight of his eyes."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cum sancto sanctus eris et cum robusto perfectus"
      en: "With the holy one thou wilt be holy: and with the valiant perfect."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cum electo electus eris et cum perverso perverteris"
      en: "With the elect thou wilt be elect: and with the perverse thou wilt be perverted."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et populum pauperem salvum facies oculisque tuis excelsos humiliabis"
      en: "And the poor people thou wilt save: and with thy eyes thou wilt humble the haughty."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quia tu lucerna mea Domine et Domine inluminabis tenebras meas"
      en: "For thou art my lamp, O Lord: and thou, O Lord, wilt enlighten my darkness."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "in te enim curram accinctus in Deo meo transiliam murum"
      en: "For in thee I will run girded: in my God I will leap over the wall."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Deus inmaculata via eius eloquium Domini igne examinatum scutum est omnium sperantium in se"
      en: "God, his way is immaculate, the word of the Lord is tried by fire: he is the shield of all that trust in him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quis est deus praeter Dominum et quis fortis praeter Deum nostrum"
      en: "Who is God but the Lord: and who is strong but our God?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Deus qui accingit me fortitudine et conplanavit perfectam viam meam"
      en: "God who hath girded me with strength, and made my way perfect."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "coaequans pedes meos cervis et super excelsa mea statuens me"
      en: "Making my feet like the feet of harts, and setting me upon my high places."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "docens manus meas ad proelium et conponens quasi arcum aereum brachia mea"
      en: "He teacheth my bands to war: and maketh my arms like a bow of brass."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dedisti mihi clypeum salutis tuae et mansuetudo mea multiplicavit me"
      en: "Thou hast given me the shield of my salvation: and thy mildness hath multiplied me."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "dilatabis gressus meos subtus me et non deficient tali mei"
      en: "Thou shalt enlarge my steps under me: and my ankles shall not fail."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "persequar inimicos meos et conteram et non revertar donec consumam eos"
      en: "I will pursue after my enemies, and crush them: and will not return again till I consume them."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "consumam eos et confringam ut non consurgant cadent sub pedibus meis"
      en: "I will consume them and break them in pieces, so that they shall not rise: they shall fall under my feet."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "accinxisti me fortitudine ad proelium incurvabis resistentes mihi sub me"
      en: "Thou hast girded me with strength to battle: thou hast made them that resisted me to bow under me."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "inimicos meos dedisti mihi dorsum odientes me et disperdam eos"
      en: "My enemies thou hast made to turn their back to me: them that hated me, and I shall destroy them."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "clamabunt et non erit qui salvet ad Dominum et non exaudiet eos"
      en: "They shall cry, and there shall be none to save: to the Lord, and he shall not hear them."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "delebo eos ut pulverem terrae quasi lutum platearum comminuam eos atque conpingam"
      en: "I shall beat them as small as the dust of the earth: I shall crush them and spread them abroad like the mire of the streets."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "salvabis me a contradictionibus populi mei custodies in caput gentium populus quem ignoro serviet mihi"
      en: "Thou wilt save me from the contradictions of my people: thou wilt keep me to be the head of the Gentiles: the people which I know not, shall serve me,"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "filii alieni resistent mihi auditu auris oboedient mihi"
      en: "The sons of the stranger will resist me, at the hearing of the ear they will obey me."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "filii alieni defluxerunt et contrahentur in angustiis suis"
      en: "The strangers are melted away, and shall be straitened in their distresses."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "vivit Dominus et benedictus Deus meus et exaltabitur Deus fortis salutis meae"
      en: "The Lord liveth, and my God is blessed: and the strong God of my salvation shall be exalted:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Deus qui das vindictas mihi et deicis populos sub me"
      en: "God who giveth me revenge, and bringest down people under me,"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "qui educis me ab inimicis meis et a resistentibus mihi elevas me a viro iniquo liberabis me"
      en: "Who bringest me forth from my enemies, and liftest me up from them that resist me: from the wicked man thou shalt deliver me."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "propterea confitebor tibi Domine in gentibus et nomini tuo cantabo"
      en: "Therefore will I give thanks to thee. O Lord, among the Gentiles, and will sing to thy name."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "magnificanti salutes regis sui et facienti misericordiam christo suo David et semini eius in sempiternum"
      en: "Giving great salvation to his king, and shewing mercy to David his anointed, and to his seed for ever."
    status: { la: verified, en: verified }
