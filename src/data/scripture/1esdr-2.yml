# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1esdr
chapter: 2
verses:
  - n: 1
    text:
      la: "Hi sunt autem provinciae filii, qui ascenderunt de captivitate, quam transtulerat Nabuchodonosor rex Babylonis in Babylonem, et reversi sunt in Jerusalem et Judam, unusquisque in civitatem suam."
      en: "Now these are the children of the province, that went out of the captivity, which Nabuchodonosor king of Babylon had carried away to Babylon, and who returned to Jerusalem and Juda, every man to his city."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Qui venerunt cum Zorobabel, Josue, Nehemia, Saraia, Rahelaia, Mardochai, Belsan, Mesphar, Beguai, Rehum, Baana. Numerus virorum populi Israel:"
      en: "Who came with Zorobabel, Josue, Nehemia, Saraia, Rahelaia, Mardochai, Belsan, Mesphar, Beguai, Rehum, Baana. The number of the men of the people of Israel:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Filii Pharos duo millia centum septuaginta duo."
      en: "The children of Pharos two thousand one hundred seventy-two."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Filii Sephatia, trecenti septuaginta duo."
      en: "The children of Sephatia, three hundred seventy-two."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Filii Area, septingenti septuaginta quinque."
      en: "The children of Area, seven hundred seventy-five."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Filii Phahath Moab, filiorum Josue: Joab, duo millia octingenti duodecim."
      en: "The children of Phahath Moab, of the children of Josue: Joab, two thousand eight hundred twelve."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Filii Aelam, mille ducenti quinquaginta quatuor."
      en: "The children of Elam, a thousand two hundred fifty-four."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Filii Zethua, nongenti quadraginta quinque."
      en: "The children of Zethua, nine hundred forty-five."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Filii Zachai, septingenti sexaginta."
      en: "The children of Zachai, seven hundred sixty."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Filii Bani, sexcenti quadraginta duo."
      en: "The children of Bani, six hundred forty-two."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Filii Bebai, sexcenti viginti tres."
      en: "The children of Bebai, six hundred twenty-three."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Filii Azgad, mille ducenti viginti duo."
      en: "The children of Azgad, a thousand two hundred twenty-two."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Filii Adonicam, sexcenti sexaginta sex."
      en: "The children of Adonicam, six hundred sixty-six."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Filii Beguai, duo millia quinquaginta sex."
      en: "The children of Beguai, two thousand fifty-six."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Filii Adin, quadringenti quinquaginta quatuor."
      en: "The children of Adin, four hundred fifty-four."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Filii Ather, qui erant ex Ezechia, nonaginta octo."
      en: "The children of Ather, who were of Ezechias, ninety-eight."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Filii Besai, trecenti viginti tres."
      en: "The children of Besai, three hundred and twenty-three."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Filii Jora, centum duodecim."
      en: "The children of Jora, a hundred and twelve."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Filii Hasum, ducenti viginti tres."
      en: "The children of Hasum, two hundred twenty-three."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Filii Gebbar, nonaginta quinque."
      en: "The children of Gebbar, ninety-five."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Filii Bethlehem, centum viginti tres."
      en: "The children of Bethlehem, a hundred twenty-three."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Viri Netupha, quinquaginta sex."
      en: "The men of Netupha, fifty-six."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Viri Anathoth, centum viginti octo."
      en: "The men of Anathoth, a hundred twenty-eight."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Filii Azmaveth, quadraginta duo."
      en: "The children of Azmaveth, forty-two."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Filii Cariathiarim, Cephira et Beroth, septingenti quadraginta tres."
      en: "The children of Cariathiarim, Cephira, and Beroth, seven hundred forty-three."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Filii Rama et Gabaa, sexcenti viginti unus."
      en: "The children of Rama and Gabaa, six hundred twenty-one."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Viri Machmas, centum viginti duo."
      en: "The men of Machmas, a hundred twenty-two."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Viri Bethel et Hai, ducenti viginti tres."
      en: "The men of Bethel and Hai, two hundred twenty-three."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Filii Nebo, quinquaginta duo."
      en: "The children of Nebo, fifty-two."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Filii Megbis, centum quinquaginta sex."
      en: "The children of Megbis, a hundred fifty-six."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Filii Aelam alterius, mille ducenti quinquaginta quatuor."
      en: "The children of the other Elam, a thousand two hundred fifty-four."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Filii Harim, trecenti viginti."
      en: "The children of Harim, three hundred and twenty."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Filii Lod Hadid, et Ono, septingenti viginti quinque."
      en: "The children of Lod, Hadid and One, seven hundred twenty-five."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Filii Jericho, trecenti quadraginta quinque."
      en: "The children of Jericho, three hundred forty-five."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Filii Senaa, tria millia sexcenti triginta."
      en: "The children of Senaa, three thousand six hundred thirty."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Sacerdotes: filii Jadaia in domo Josue, nongenti septuaginta tres."
      en: "The priests: the children of Jadaia of the house of Josue, nine hundred seventy-three."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Filii Emmer, mille quinquaginta duo."
      en: "The children of Emmer, a thousand fifty-two."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Filii Pheshur, mille ducenti quadraginta septem."
      en: "The children of Pheshur, a thousand two hundred forty-seven."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Filii Harim, mille decem et septem."
      en: "The children of Harim, a thousand and seventeen."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Levitae: filii Josue et Cedmihel filiorum Odoviae, septuaginta quatuor."
      en: "The Levites: the children of Josue and of Cedmihel, the children of Odovia, seventy-four."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Cantores: filii Asaph, centum viginti octo."
      en: "The singing men: the children of Asaph, a hundred twenty-eight."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Filii janitorum: filii Sellum, filii Ater, filii Telmon, filii Accub, filii Hatitha, filii Sobai: universi centum triginta novem."
      en: "The children of the porters: the children of Sellum, the children of Ater, the children of Telmon, the children of Accub, the children of Hatita, the children of Sobai: in all a hundred thirty-nine."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Nathinaei: filii Siha, filii Hasupha, filii Tabbaoth,"
      en: "The Nathinites: the children of Siha, the children of Hasupha, the children of Tabbaoth,"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "filii Ceros, filii Siaa, filii Phadon,"
      en: "The children of Ceros, the children of Sia, the children of Phadon,"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "filii Lebana, filii Hagaba, filii Accub,"
      en: "The children of Lebana, the children of Hegaba, the children of Accub,"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "filii Hagab, filii Semlai, filii Hanan,"
      en: "The children of Hagab, the children of Semlai, the children of Hanan,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "filii Gaddel, filii Gaher, filii Raaia,"
      en: "The children of Gaddel, the children of Gaher, the children of Raaia,"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "filii Rasin, filii Necoda, filii Gazam,"
      en: "The children of Rasin, the children of Necoda, the children of Gazam,"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "filii Aza, filii Phasea, filii Besee,"
      en: "The children of Asa, the children of Phasea, the children of Besee,"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "filii Asena, filii Munim, filii Nephusim,"
      en: "The children of Asena, the children of Munim, the children of Nephusim,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "filii Bacbuc, filii Hacupha, filii Harhur,"
      en: "The children of Bacbuc, the children of Hacupha, the children of Harhur,"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "filii Besluth, filii Mahida, filii Harsa,"
      en: "The children of Besluth, the children of Mahida, the children of Harsa,"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "filii Bercos, filii Sisara, filii Thema,"
      en: "The children of Bercos, the children of Sisara, the children of Thema,"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "filii Nasia, filii Hatipha,"
      en: "The children of Nasia, the children of Hatipha,"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "filii servorum Salomonis, filii Sotai, filii Sophereth, filii Pharuda,"
      en: "The children of the servants of Solomon, the children of Sotai, the children of Sopheret, the children of Pharuda,"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "filii Jala, filii Dercon, filii Geddel,"
      en: "The children of Jala, the children of Dercon, the children of Geddel,"
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "filii Saphatia, filii Hatil, filii Phochereth, qui erant de Asebaim, filii Ami:"
      en: "The children of Saphatia, the children of Hatil, the children of Phochereth, which were of Asebaim, the children of Ami,"
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "omnes Nathinaei, et filii servorum Salomonis, trecenti nonaginta duo."
      en: "All the Nathinites, and the children of the servants of Solomon, three hundred ninety-two."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Et hi qui ascenderunt de Thelmala, Thelharsa, Cherub, et Adon, et Emer: et non potuerunt indicare domum patrum suorum et semen suum, utrum ex Israel essent."
      en: "And these are they that came up from Thelmela, Thelharsa, Cherub, and Adon, and Emer. And they could not shew the house of their fathers and their seed, whether they were of Israel."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Filii Dalaia, filii Tobia, filii Necoda, sexcenti quinquaginta duo."
      en: "The children of Dalaia, the children of Tobia, the children of Necoda, six hundred fifty-two."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Et de filiis sacerdotum: filii Hobia, filii Accos, filii Berzellai, qui accepit de filiabus Berzellai Galaaditis, uxorem, et vocatus est nomine eorum:"
      en: "And of the children of the priests: the children of Hobia, the children of Accos, the children of Berzellai, who took a wife of the daughters of Berzellai, the Galaadite, and was called by their name:"
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "hi quaesierunt scripturam genealogiae suae, et non invenerunt, et ejecti sunt de sacerdotio."
      en: "These sought the writing of their genealogy, and found it not, and they were cast out of the priesthood."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Et dixit Athersatha eis ut non comederent de Sancto sanctorum, donec surgeret sacerdos doctus atque perfectus."
      en: "And Athersatha said to them, that they should not eat of the holy of holies, till there arose a priest learned and perfect."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Omnis multitudo quasi unus, quadraginta duo millia trecenti sexaginta:"
      en: "All the multitudes as one man, were forty-two thousand three hundred and sixty:"
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "exceptis servis eorum, et ancillis, qui erant septem millia trecenti triginta septem: et in ipsis cantores atque cantatrices ducenti."
      en: "Besides their menservants, and womenservants, of whom there were seven thousand three hundred and thirty-seven: and among them singing men, and singing women two hundred."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "Equi eorum septingenti triginta sex, muli eorum, ducenti quadraginta quinque,"
      en: "Their horses seven hundred thirty-six, their mules two hundred forty-five,"
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "cameli eorum, quadringenti triginta quinque, asini eorum, sex millia septingenti viginti."
      en: "Their camels four hundred thirty-five, their asses six thousand seven hundred and twenty."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "Et de principibus patrum, cum ingrederentur templum Domini, quod est in Jerusalem, sponte obtulerunt in domum Dei ad exstruendam eam in loco suo."
      en: "And some of the chief of the fathers, when they came to the temple of the Lord, which is in Jerusalem, offered freely to the house of the Lord to build it in its place."
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "Secundum vires suas dederunt impensas operis, auri solidos sexaginta millia et mille, argenti mnas quinque millia, et vestes sacerdotales centum."
      en: "According to their ability, they gave towards the expenses of the work, sixty-one thousand solids of gold, five thousand pounds of silver, and a hundred garments for the priests."
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "Habitaverunt ergo sacerdotes, et Levitae, et de populo, et cantores, et janitores, et Nathinaei, in urbibus suis, universusque Israel in civitatibus suis."
      en: "So the priests and the Levites, and some of the people, and the singing men, and the porters, and the Nathinites dwelt in their cities, and all Israel in their cities."
    status: { la: verified, en: verified }
