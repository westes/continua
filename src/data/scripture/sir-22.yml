# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 22
verses:
  - n: 1
    text:
      la: "In lapide luteo lapidatus est piger: et omnes loquentur super aspernationem illius."
      en: "The sluggard is pelted with a dirty stone, and all men will speak of his disgrace."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "De stercore boum lapidatus est piger: et omnis qui tetigerit eum excutiet manus."
      en: "The sluggard is pelted with the dung of oxen: and every one that toucheth him will shake his hands."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Confusio patris est de filio indisciplinato: filia autem in deminoratione fiet."
      en: "A son ill taught is the confusion of the father: and a foolish daughter shall be to his loss."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Filia prudens haereditas viro suo: nam quae confundit, in contumeliam fit genitoris."
      en: "A wise daughter shall bring an inheritance to her husband: but she that confoundeth, becometh a disgrace to her father."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Patrem et virum confundit audax, et ab impiis non minorabitur: ab utrisque autem inhonorabitur."
      en: "She that is bold shameth both her father and husband, and will not be inferior to the ungodly: and shall be disgraced by them both."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Musica in luctu importuna narratio: flagella et doctrina in omni tempore sapientia."
      en: "A tale out of time is like music in mourning: but the stripes and instruction of wisdom are never out of time."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui docet fatuum, quasi qui conglutinat testam."
      en: "He that teacheth a fool, is like one that glueth a potsherd together."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui narrat verbum non audienti, quasi qui excitat dormientem de gravi somno."
      en: "He that telleth a word to him that heareth not, is like one that waketh a man out of a deep sleep."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cum dormiente loquitur qui enarrat stulto sapientiam: et in fine narrationis dicit: Quis est hic?"
      en: "He speaketh with one that is asleep, who uttereth wisdom to a fool: and in the end of the discourse he saith: Who is this?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Supra mortuum plora, defecit enim lux ejus: et supra fatuum plora, defecit enim sensus."
      en: "Weep for the dead, for his light hath failed: and weep for the fool, for his understanding faileth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Modicum plora super mortuum, quoniam requievit:"
      en: "Weep but a little for the dead, for he is at rest."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nequissimi enim nequissima vita super mortem fatui."
      en: "For the wicked life of a wicked fool is worse than death."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Luctus mortui septem dies: fatui autem et impii omnes dies vitae illorum."
      en: "The mourning for the dead is seven days: but for a fool and an ungodly man all the days of their life."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cum stulto ne multum loquaris, et cum insensato ne abieris."
      en: "Talk not much with a fool, and go not with him that hath no sense."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Serva te ab illo, ut non molestiam habeas, et non coinquinaberis peccato illius."
      en: "Keep thyself from him, that thou mayst not have trouble, and thou shalt not be defiled with his sin."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Deflecte ab illo, et invenies requiem, et non acediaberis in stultitia illius."
      en: "Turn away from him, and thou shalt find rest, and shalt not be wearied out with his folly."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Super plumbum quid gravabitur? et quod illi aliud nomen quam fatuus?"
      en: "What is heavier than lead? and what other name hath he but fool?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Arenam, et salem, et massam ferri facilius est ferre quam hominem imprudentem, et fatuum, et impium."
      en: "Sand and salt, and a mass of iron is easier to bear, than a man without sense, that is both foolish and wicked."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Loramentum ligneum colligatum in fundamento aedificii non dissolvetur, sic et cor confirmatum in cogitatione consilii."
      en: "A frame of wood bound together in the foundation of a building, shall not be loosed: so neither shall the heart that is established by advised counsel."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cogitatus sensati in omni tempore metu non depravabitur."
      en: "The thought of him that is wise at all times, shall not be depraved by fear."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Sicut pali in excelsis, et caementa sine impensa posita, contra faciem venti non permanebunt:"
      en: "As pales set in high places, and plasterings made without cost, will not stand against the face of the wind:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sic et cor timidum in cogitatione stulti contra impetum timoris non resistet."
      en: "So also a fearful heart in the imagination of a fool shall not resist against the violence of fear."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Sicut cor trepidum in cogitatione fatui omni tempore non metuet, sic et qui in praeceptis Dei permanet semper."
      en: "As a fearful heart in the thought of a fool at all times will not fear, so neither shall he that continueth always in the commandments of God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Pungens oculum deducit lacrimas, et qui pungit cor profert sensum."
      en: "He that pricketh the eye, bringeth out tears: and he that pricketh the heart, bringeth forth resentment."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Mittens lapidem in volatilia, dejiciet illa: sic et qui conviciatur amico, dissolvit amicitiam."
      en: "He that flingeth a stone at birds, shall drive them away: so he that upbraideth his friend, breaketh friendship."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ad amicum etsi produxeris gladium, non desperes: est enim regressus. Ad amicum"
      en: "Although thou hast drawn a sword at a friend, despair not: for there may be a returning. To a friend,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "si aperueris os triste, non timeas: est enim concordatio: excepto convitio, et improperio, et superbia, et mysterii revelatione, et plaga dolosa: in his omnibus effugiet amicus."
      en: "If thou hast opened a sad mouth, fear not, for there may be a reconciliation: except upbraiding, and reproach, and pride, and disclosing of secrets, or a treacherous wound: for in all these cases a friend will flee away."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Fidem posside cum amico in paupertate illius, ut et in bonis illius laeteris."
      en: "Keep fidelity with a friend in his poverty, that in his prosperity also thou mayst rejoice."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "In tempore tribulationis illius permane illi fidelis, ut et in haereditate illius cohaeres sis."
      en: "In the time of his trouble continue faithful to him, that thou mayst also be heir with him in his inheritance."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Ante ignem camini vapor et fumus ignis inaltatur: sic et ante sanguinem maledicta, et contumeliae, et minae."
      en: "As the vapour of a chimney, and the smoke of the fire goeth up before the fire: so also injurious words, and reproaches, and threats, before blood."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Amicum salutare non confundar, a facie illius non me abscondam: et si mala mihi evenerint per illum, sustinebo."
      en: "I will not be ashamed to salute a friend, neither will I hide myself from his face: and if any evil happen to me by him, I will bear it."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Omnis qui audiet cavebit se ab eo."
      en: "But every one that shall hear it, will beware of him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Quis dabit ori meo custodiam, et super labia mea signaculum certum, ut non cadam ab ipsis, et lingua mea perdat me?"
      en: "Who will set a guard before my mouth, and a sure seal upon my lips, that I fall not by them, and that my tongue destroy me not?"
    status: { la: verified, en: verified }
