# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 26
verses:
  - n: 1
    text:
      la: "Omnis autem populus Juda, filium ejus Oziam annorum sedecim, constituit regem pro Amasia patre suo."
      en: "And all the people of Juda took his son Ozias, who was sixteen years old, and made him king in the room of Amasias his father."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ipse aedificavit Ailath, et restituit eam ditioni Juda, postquam dormivit rex cum patribus suis."
      en: "He built Ailath, and restored it to the dominion of Juda, after that the king slept with his fathers."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sedecim annorum erat Ozias cum regnare coepisset, et quinquaginta duobus annis regnavit in Jerusalem: nomen matris ejus Jechelia de Jerusalem."
      en: "Ozias was sixteen years old when he began to reign, and he reigned two and fifty years in Jerusalem: the name of his mother was Jechelia of Jerusalem."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Fecitque quod erat rectum in oculis Domini, juxta omnia quae fecerat Amasias pater ejus."
      en: "And he did that which was right in the eyes of the Lord, according to all that Amasias his father had done."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et exquisivit Dominum in diebus Zachariae intelligentis et videntis Deum: cumque requireret Dominum, direxit eum in omnibus."
      en: "And he sought the Lord in the days of Zacharias that understood and saw God: and as long as he sought the Lord, he directed him in all things."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Denique egressus est, et pugnavit contra Philisthiim, et destruxit murum Geth, et murum Jabniae, murumque Azoti: aedificavit quoque oppida in Azoto, et in Philisthiim."
      en: "Moreover he went forth and fought against the Philistines, and broke down the wall of Geth, and the wall of Jabnia, and the wall of Azotus: and he built towns in Azotus, and among the Philistines."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et adjuvit eum Deus contra Philisthiim, et contra Arabes qui habitabant in Gurbaal, et contra Ammonitas."
      en: "And God helped him against the Philistines, and against the Arabians, that dwelt in Gurbaal, and against the Ammonites."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Appendebantque Ammonitae munera Oziae: et divulgatum est nomen ejus usque ad introitum Aegypti propter crebras victorias."
      en: "And the ammonites gave gifts to Ozias: and his name was spread abroad even to the entrance of Egypt for his frequent victories."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Aedificavitque Ozias turres in Jerusalem super portam anguli, et super portam vallis, et reliquas in eodem muri latere, firmavitque eas."
      en: "And Ozias built towers in Jerusalem over the gate of the corner, and over the gate of the valley, and the rest, in the same side of the wall, and fortified them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Exstruxit etiam turres in solitudine, et effodit cisternas plurimas, eo quod haberet multa pecora tam in campestribus, quam in eremi vastitate: vineas quoque habuit et vinitores in montibus, et in Carmelo: erat quippe homo agriculturae deditus."
      en: "And he built towers in the wilderness, and dug many cisterns, for he had much cattle both in the plains, and in the waste of the desert: he had also vineyards and dressers of vines in the mountains, and in Carmel: for he was a man that loved husbandry."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Fuit autem exercitus bellatorum ejus, qui procedebant ad praelia sub manu Jehiel scribae, Maasiaeque doctoris, et sub manu Hananiae, qui erat de ducibus regis."
      en: "And the army of his fighting men, that went out to war, was under the hand of Jehiel the scribe, and Maasias the doctor, and under the hand of Henanias, who was one of the king's captains."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Omnisque numerus principum per familias virorum fortium, duorum millium sexcentorum."
      en: "And the whole number of the chiefs by the families of valiant men were two thousand six hundred."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et sub eis universus exercitus trecentorum et septem millium quingentorum, qui erant apti ad bella, et pro rege contra adversarios dimicabant."
      en: "And the whole army under them three hundred and seven thousand five hundred: who were fit for war, and fought for the king against the enemy."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Praeparavit quoque eis Ozias, id est, cuncto exercitui, clypeos, et hastas, et galeas, et loricas, arcusque et fundas ad jaciendos lapides."
      en: "And Ozias prepared for them, that is, for the whole army, shields, and spears, and helmets, and coats of mail, and bows, and slings to cast stones."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et fecit in Jerusalem diversi generis machinas, quas in turribus collocavit, et in angulis murorum ut mitterent sagittas, et saxa grandia: egressumque est nomen ejus procul, eo quod auxiliaretur ei Dominus, et corroborasset illum."
      en: "And he made in Jerusalem engines of diverse kinds, which he placed in the towers, and in the corners of the walls, to shoot arrows, and great stones: and his name went forth far abroad, for the Lord helped him, and had strengthened him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sed cum roboratus esset, elevatum est cor ejus in interitum suum, et neglexit Dominum Deum suum: ingressusque templum Domini, adolere voluit incensum super altare thymiamatis."
      en: "But when he was made strong, his heart was lifted up to his destruction, and he neglected the Lord his God: and going into the temple of the Lord, he had a mind to burn incense upon the altar of incense."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Statimque ingressus post eum Azarias sacerdos, et cum eo sacerdotes Domini octoginta, viri fortissimi,"
      en: "And immediately Azarias the priest going in after him, and with him fourscore priests of the Lord, most valiant men,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "restiterunt regi, atque dixerunt: Non est tui officii, Ozia, ut adoleas incensum Domino, sed sacerdotum, hoc est, filiorum Aaron, qui consecrati sunt ad hujuscemodi ministerium: egredere de sanctuario, ne contempseris: quia non reputabitur tibi in gloriam hoc a Domino Deo."
      en: "Withstood the king and said: It doth not belong to thee, Ozias, to burn incense to the Lord, but to the priests, that is, to the sons of Aaron, who are consecrated for this ministry: go out of the sanctuary, do not despise: for this thing shall not be accounted to thy glory by the Lord God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Iratusque Ozias, tenens in manu thuribulum ut adoleret incensum, minabatur sacerdotibus. Statimque orta est lepra in fronte ejus coram sacerdotibus, in domo Domini super altare thymiamatis."
      en: "And Ozias was angry, and holding in his hand the censer to burn incense, threatened the priests. And presently there rose a leprosy in his forehead before the priests, in the house of the Lord at the altar of incense."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cumque respexisset eum Azarias pontifex, et omnes reliqui sacerdotes, viderunt lepram in fronte ejus, et festinato expulerunt eum. Sed et ipse perterritus, acceleravt egredi, eo quod sensisset illico plagam Domini."
      en: "And Azarias the high priest, and all the rest of the priests looked upon him, and saw the leprosy in his forehead, and they made haste to thrust him out. Yea himself also being frightened, hasted to go out, because he had quickly felt the stroke of the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Fuit igitur Ozias rex leprosus usque ad diem mortis suae, et habitavit in domo separata plenus lepra, ob quam ejectus fuerat de domo Domini. Porro Joatham filius ejus rexit domum regis, et judicabat populum terrae."
      en: "And Ozias the king was a leper unto the day of his death, and he dwelt in a house apart being full of the leprosy, for which he had been cast out of the house of the Lord. And Joatham his son governed the king's house, and judged the people of the land."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Reliqua autem sermonum Oziae priorum et novissimorum scripsit Isaias filius Amos, propheta."
      en: "But the rest of the acts of Ozias first and last were written by Isaias the son of Amos, the prophet."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dormivitque Ozias cum patribus suis, et sepelierunt eum in agro regalium sepulchrorum, eo quod esset leprosus: regnavitque Joatham filius ejus pro eo."
      en: "And Ozias slept with his fathers, and they buried him in the field of the royal sepulchres, because he was a leper: and Joatham his son reigned in his stead."
    status: { la: verified, en: verified }
