book: 1esdr
chapter: 10
verses:
  - n: 1
    text:
      la: "sic ergo orante Ezra et inplorante eo et flente et iacente ante templum Dei collectus est ad eum de Israhel coetus grandis nimis virorum et mulierum puerorumque et flevit populus multo fletu"
      en: "Now when Esdras was thus praying, and beseeching, and weeping, and lying before the temple of God, there was gathered to him of Israel an exceeding great assembly of men and women and children, and the people wept with much lamentation."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et respondit Sechenia filius Iehihel de filiis Helam et dixit Ezrae nos praevaricati sumus in Deum nostrum et duximus uxores alienigenas de populis terrae et nunc si est paenitentia Israhel super hoc"
      en: "And Sechenias the son of Jehiel of the sons of Elam answered, and said to Esdras: We have sinned against our God, and have taken strange wives of the people of the land: and now if there be repentance in Israel concerning this,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "percutiamus foedus cum Deo nostro ut proiciamus universas uxores et eos qui de his nati sunt iuxta voluntatem Domini et eorum qui timent praeceptum Dei nostri secundum legem fiat"
      en: "Let us make a covenant with the Lord our God, to put away all the wives, and such as are born of them, according to the will of the Lord, and of them that fear the commandment of the Lord our God: let it be done according to the law."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "surge tuum est decernere nosque erimus tecum confortare et fac"
      en: "Arise, it is thy part to give orders, and we will be with thee: take courage, and do it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "surrexit ergo Ezras et adiuravit principes sacerdotum Levitarum et omnem Israhel ut facerent secundum verbum hoc et iuraverunt"
      en: "So Esdras arose, and made the chiefs of the priests and of the Levites, and all Israel, to swear that they would do according to this word, and they swore."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et surrexit Ezras ante domum Dei et abiit ad cubiculum Iohanan filii Eliasib et ingressus est illuc panem non comedit et aquam non bibit lugebat enim in transgressione eorum qui de captivitate venerant"
      en: "And Esdras rose up from before the house of God, and went to the chamber of Johanan the son of Eliasib, and entered in thither: he ate no bread, and drank no water: for he mourned for the transgression of them that were come out of the captivity."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et missa est vox in Iuda et in Hierusalem omnibus filiis transmigrationis ut congregarentur in Hierusalem"
      en: "And proclamation was made in Juda and Jerusalem to all the children of the captivity, that they should assemble together into Jerusalem."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et omnis qui non venerit in tribus diebus iuxta consilium principum et seniorum auferetur universa substantia eius et ipse abicietur de coetu transmigrationis"
      en: "And that whosoever would not come within three days, according to the counsel of the princes and the ancients, all his substance should be taken away, and he should be cast out of the company of them that were returned from captivity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "convenerunt igitur omnes viri Iuda et Beniamin in Hierusalem tribus diebus ipse est mensis nonus vicesimo die mensis et sedit omnis populus in platea domus Dei trementes pro peccato et pluviis"
      en: "Then all the men of Juda, and Benjamin gathered themselves together to Jerusalem within three days, in the ninth month, the twentieth day of the month: and all the people sat in the street of the house of God, trembling because of the sin, and the rain."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et surrexit Ezras sacerdos et dixit ad eos vos transgressi estis et duxistis uxores alienigenas ut adderetis super delictum Israhel"
      en: "And Esdras the priest stood up, and said to them: You have transgressed, and taken strange wives, to add to the sine of Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et nunc date confessionem Domino Deo patrum vestrorum et facite placitum eius et separamini a populis terrae et ab uxoribus alienigenis"
      en: "And now make confession to the Lord the God of your fathers, and do his pleasure, and separate yourselves from the people of the land, and from your strange wives."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et respondit universa multitudo dixitque voce magna iuxta verbum tuum ad nos sic fiat"
      en: "And all the multitude answered and said with a loud voice: According to thy word unto us, so be it done."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "verumtamen quia populus multus est et tempus pluviae et non sustinemus stare foris et opus non est diei unius vel duorum vehementer quippe peccavimus in sermone isto"
      en: "But as the people are many, and it is time of rain, and me are not able to stand without, and it is not a work of one day or two, (for we have exceedingly sinned in this matter,)"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "constituantur principes in universa multitudine et omnes in civitatibus nostris qui duxerunt uxores alienigenas veniant in temporibus statutis et cum his seniores per civitatem et civitatem et iudices eius donec avertatur ira Dei nostri a nobis super peccato hoc"
      en: "Let rulers be appointed in all the multitude: and in all our cities, let them that have taken strange wives come at the times appointed, and with them the ancients and the judges of every city, until the wrath of our God be turned away from us for this sin."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "igitur Ionathan filius Asahel et Iaazia filius Thecuae steterunt super hoc et Mesollam et Sebethai Levites adiuverunt eos"
      en: "Then Jonathan the son of Azahel, and Jaasia the son of Thecua were appointed over this, and Mesollam and Sebethai, Levites, helped them:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "feceruntque sic filii transmigrationis et abierunt Ezras sacerdos et viri principes familiarum in domum patrum suorum et omnes per nomina sua et sederunt in die primo mensis decimi ut quaererent rem"
      en: "And the children of the captivity did so. And Esdras the priest, and the men heads of the families in the houses of their fathers, and all by their names, went and sat down in the first day of the tenth month to examine the matter."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et consummati sunt omnes viri qui duxerant uxores alienigenas usque ad diem primam mensis primi"
      en: "And they made an end with all the men that had taken strange wives by the first day of the first month."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et inventi sunt de filiis sacerdotum qui duxerant uxores alienigenas de filiis Iosue filii Iosedech et fratres eius Maasia et Eliezer et Iarib et Godolia"
      en: "And there were found among the sons of the priests that had taken strange wives: Of the sons of Josue the son of Josedec, and his brethren, Maasia, and Eliezer, and Jarib, and Godolia."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dederunt manus suas ut eicerent uxores suas et pro delicto suo arietem de ovibus offerrent"
      en: "And they gave their hands to put away their wives, and to offer for their offence a ram of the flock."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et de filiis Emmer Anani et Zebedia"
      en: "And of the sons of Emmer, Hanani, and Zebedia."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et de filiis Erim Masia et Helia et Semeia et Hiehihel et Ozias"
      en: "And of the sons of Harim, Maasia, and Elia, and Semeia, and Jehiel, and Ozias."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et de filiis Phessur Helioenai Maasia Ismahel Nathanahel Iozabeth et Elasa"
      en: "And of the sons of Pheshur, Elioenai, Maasia, Ismael, Nathanael, Jozabed, and Elasa."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et de filiis Levitarum Iozabeth et Semei et Celaia ipse est Calita Phataia Iuda et Eliezer"
      en: "And of the sons of the Levites, Jozabed, and Semei, and Celaia, the same is Calita, Phataia, Juda, and Eliezer."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et de cantoribus Eliasub et de ianitoribus Sellum et Telem et Uri"
      en: "And of the singing men, Elisiab: and of the porters, Sellum, and Telem, and"
    status: { la: verified, en: verified }
  - n: 25
