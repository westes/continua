book: ezek
chapter: 47
verses:
  - n: 1
    text:
      la: "et convertit me ad portam domus et ecce aquae egrediebantur subter limen domus ad orientem facies enim domus respiciebat ad orientem aquae autem descendebant in latus templi dextrum ad meridiem altaris"
      en: "And he brought me again to the gate of the house, and behold waters issued out from under the threshold of the house toward the east: for the forefront, of the house looked toward the east: but the waters came down to the right side of the temple to the south part of the altar."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et eduxit me per viam portae aquilonis et convertit me ad viam foras portam exteriorem viam quae respiciebat ad orientem et ecce aquae redundantes a latere dextro"
      en: "And he led me out by the way of the north gate, and he caused me to turn to the way without the outward gate to the way that looked toward the east: and behold there ran out waters on the right side."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cum egrederetur vir ad orientem qui habebat funiculum in manu sua et mensus est mille cubitos et transduxit me per aquam usque ad talos"
      en: "And when the man that had the line in his hand went out towards the east, he measured a thousand cubits: and he brought me through the water up to the ankles."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "rursumque mensus est mille et transduxit me per aquam usque ad genua"
      en: "And again he measured a thousand, and he brought me through the water up to the knees."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et mensus est mille et transduxit me per aquam usque ad renes et mensus est mille torrentem quem non potui pertransire quoniam intumuerant aquae profundae torrentis qui non potest transvadari"
      en: "And he measured a thousand. and he brought me through the water up to the loins. And he measured a thousand, and it was a torrent, which I could not pass over: for the waters were risen so as to make a deep torrent, which could not be passed over."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et dixit ad me certe vidisti fili hominis et duxit me et convertit ad ripam torrentis"
      en: "And he said to me: Surely thou hast seen, O son of man. And he brought me out, and he caused me to turn to the bank of the torrent."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cumque me convertissem ecce in ripa torrentis ligna multa nimis ex utraque parte"
      en: "And when I had turned myself, behold on the bank of the torrent were very many trees on both sides."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ait ad me aquae istae quae egrediuntur ad tumulos sabuli orientalis et descendunt ad plana deserti intrabunt mare et exibunt et sanabuntur aquae"
      en: "And he said to me: These waters that issue forth toward the hillocks of sand to the east, and go down to the plains of the desert, shall go into the sea, and shall go out, and the waters shall be healed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et omnis anima vivens quae serpit quocumque venerit torrens vivet et erunt pisces multi satis postquam venerint illuc aquae istae et sanabuntur et vivent omnia ad quae venerit torrens"
      en: "And every living creature that creepeth whithersoever the torrent shall come, shall live: and there shall be fishes in abundance after these waters shall come thither, and they shall be healed, and all things shall live to which the torrent shall come."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vivent et stabunt super illa piscatores ab Engaddi usque ad Engallim siccatio sagenarum erunt plurimae species erunt piscium eius sicut pisces maris magni multitudinis nimiae"
      en: "And the fishers shall stand over these waters, from Engaddi even to Engallim there shall be drying of nets: there shall be many sorts of the fishes thereof, as the fishes of the great sea, a very great multitude :"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in litoribus autem eius et in palustribus non sanabuntur quia in salinas dabuntur"
      en: "But on the shore thereof, and in the fenny places they shall not be healed, because they shall be turned into saltpits."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et super torrentem orietur in ripis eius ex utraque parte omne lignum pomiferum non defluet folium ex eo et non deficiet fructus eius per singulos menses adferet primitiva quia aquae eius de sanctuario egredientur et erunt fructus eius in cibum et folia eius ad medicinam"
      en: "And by the torrent on the banks thereof on both sides shall grow all trees that bear fruit: their leaf shall not fall off, and their fruit shall not fail: every month shall they bring forth firstfruits, because the waters thereof shall issue out of the sanctuary: and the fruits thereof shall be for food, and the leaves thereof for medicine."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "haec dicit Dominus Deus hic est terminus in quo possidebitis terram in duodecim tribubus Israhel quia Ioseph duplicem funiculum habet"
      en: "Thus saith the Lord God: This is the border, by which you shall possess the land according to the twelve tribes of Israel: for Joseph hath a double portion."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "possidebitis autem eam singuli aeque ut frater suus quam levavi manum meam ut darem patribus vestris et cadet terra haec vobis in possessionem"
      en: "And you shall possess it, every man in like manner as his brother: concerning which I lifted up my hand to give it to your fathers: and this land shall fall unto you for a possession."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "hic est autem terminus terrae ad plagam septentrionalem a mari magno via Bethalon venientibus Sadada"
      en: "And this is the border of the land: toward the north side, from the great sea by the way of Hethalon, as men go to Sedada,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Emath Berotha Sabarim quae est inter terminum Damasci et confinium Emath domus Atticon quae est iuxta terminos Auran"
      en: "Emath, Berotha, Sabarim, which is between the border of Damascus and the border of Emath, the house of Tichon, which is by the border of Auran."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et erit terminus a mari usque ad atrium Aenon terminus Damasci et ab aquilone ad aquilonem et terminus Emath plaga autem septentrionalis"
      en: "And the border from the sea even to the court of Enan, shall be the border of Damascus, and from the north to the north: the border of Emath, this is the north side."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "porro plaga orientalis de medio Auran et de medio Damasci et de medio Galaad et de medio terrae Israhel Iordanis disterminans ad mare orientale metiemini etiam plagam orientalem"
      en: "And the east side is from the midst of Auran, and from the midst of Damascus, and from the midst of Galaad, and from the midst of the land of Israel, Jordan making the bound to the east sea, and thus you shall measure the east side."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "plaga autem australis meridiana a Thamar usque ad aquas Contradictionis Cades et torrens usque ad mare magnum et plaga ad meridiem australis"
      en: "And the south side southward is from Thamar even to the waters of contradiction of Cades: and the torrent even to the great sea: and this is the south side southward."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et plaga maris mare magnum a confinio per directum donec venias Emath haec est plaga maris"
      en: "And the side toward the sea, is the great sea from the borders straight on, till thou come to Emath: this is the side of the sea."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et dividetis terram istam vobis per tribus Israhel"
      en: "And you shall divide this land unto you by the tribes of Israel:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et mittetis eam in hereditatem vobis et advenis qui accesserint ad vos qui genuerint filios in medio vestrum et erunt vobis sicut indigenae inter filios Israhel vobiscum divident possessionem in medio tribuum Israhel"
      en: "And you shall divide it by lot for an inheritance to you, and to the strangers that shall come over to you, that shall beget children among you: and they shall be unto you as men of the same country born among the children of Israel: they shall divide the possession with you in the midst of the tribes of Israel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "in tribu autem quacumque fuerit advena ibi dabitis possessionem illi ait Dominus Deus"
      en: "And in what tribe soever the stranger shall be, there shall you give him possession, saith the Lord God."
    status: { la: verified, en: verified }
