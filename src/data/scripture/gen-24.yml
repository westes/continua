# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 24
verses:
  - n: 1
    text:
      la: "Erat autem Abraham senex, dierumque multorum: et Dominus in cunctis benedixerat ei."
      en: "Now Abraham was old; and advanced in age: and the Lord had blessed him in all things."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixitque ad servum seniorem domus suae, qui praeerat omnibus quae habebat: Pone manum tuam subter femur meum,"
      en: "And he said to the elder servant of his house, who was ruler over all he had: Put thy hand under my thigh,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ut adjurem te per Dominum Deum caeli et terrae, ut non accipias uxorem filio meo de filiabus Chananaeorum, inter quos habito:"
      en: "That I may make thee swear by the Lord the God of heaven and earth, that thou take not a wife for my son, of the daughters of the Chanaanites, among whom I dwell:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed ad terram et cognationem meam proficiscaris et inde accipias uxorem filio meo Isaac."
      en: "But that thou go to my own country and kindred, and take a wife from thence for my son Isaac."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Respondit servus: Si noluerit mulier venire mecum in terram hanc, numquid reducere debeo filium tuum ad locum, de quo egressus es?"
      en: "The servant answered: If the woman will not come with me into this land, must I bring thy son back again to the place, from whence thou camest out?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixitque Abraham: Cave nequando reducas filium meum illuc."
      en: "And Abraham said: Beware thou never bring my son back again thither."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dominus Deus caeli, qui tulit me de domo patris mei, et de terra nativitatis meae, qui locutus est mihi, et juravit mihi, dicens: Semini tuo dabo terram hanc: ipse mittet angelum suum coram te, et accipies inde uxorem filio meo:"
      en: "The Lord God of heaven, who took me out of my father's house, and out of my native country, who spoke to me, and swore to me, saying: To thy seed will I give this land: he will send his angel before thee, and thou shalt take from thence a wife for my son."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sin autem mulier noluerit sequi te, non teneberis juramento: filium meum tantum ne reducas illuc."
      en: "But if the woman will not follow thee, thou shalt not be bound by the oath; only bring not my son back thither again."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Posuit ergo servus manum sub femore Abraham domini sui, et juravit illi super sermone hoc."
      en: "The servant therefore put his hand under the thigh of Abraham his lord, and swore to him upon this word."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tulitque decem camelos de grege domini sui, et abiit, ex omnibus bonis ejus portans secum, profectusque perrexit in Mesopotamiam ad urbem Nachor."
      en: "And he took ten camels of his master's herd, and departed, carrying something of all his goods with him, and he set forward and went on to Mesopotamia to the city of Nachor."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque camelos fecisset accumbere extra oppidum juxta puteum aquae vespere, tempore quo solent mulieres egredi ad hauriendam aquam, dixit:"
      en: "And when he had made the camels lie down without the town near a well of water in the evening, at the time when women are wont to come out to draw water, he said:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Domine Deus domini mei Abraham, occurre, obsecro, mihi hodie, et fac misericordiam cum domino meo Abraham."
      en: "O Lord the God of my master Abraham, meet me today, I beseech thee, and shew kindness to my master Abraham."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ecce ego sto prope fontem aquae, et filiae habitatorum hujus civitatis egredientur ad hauriendam aquam."
      en: "Behold I stand nigh the spring of water, and the daughters of the inhabitants of this city will come out to draw water."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Igitur puella, cui ego dixero: Inclina hydriam tuam ut bibam: et illa responderit: Bibe, quin et camelis tuis dabo potum: ipsa est quam praeparasti servo tuo Isaac: et per hoc intelligam quod feceris misericordiam cum domino meo."
      en: "Now, therefore, the maid to whom I shall say: Let down thy pitcher that I may drink: and she shall answer, Drink, and I will give thy camels drink also: let it be the same whom thou hast provided for thy servant Isaac: and by this I shall understand, that thou hast shewn kindness to my master."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Necdum intra se verba compleverat, et ecce Rebecca egrediebatur, filia Bathuel, filii Melchae uxoris Nachor fratris Abraham, habens hydriam in scapula sua:"
      en: "He had not yet ended these words within himself, and behold Rebecca came out, the daughter of Bathuel, son of Melcha, wife to Nachor the brother of Abraham, having a pitcher on her shoulder:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "puella decora nimis, virgoque pulcherrima, et incognita viro: descenderat autem ad fontem, et impleverat hydriam, ac revertebatur."
      en: "An exceeding comely maid, and a most beautiful virgin, and not known to man: and she went down to the spring, and filled her pitcher and was coming back."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Occurritque ei servus, et ait: Pauxillum aquae mihi ad bibendum praebe de hydria tua."
      en: "And the servant ran to meet her, and said: Give me a little water to drink of thy pitcher."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quae respondit: Bibe, domine mi: celeriterque deposuit hydriam super ulnam suam, et dedit ei potum."
      en: "And she answered: Drink, my lord. And quickly she let down the pitcher upon her arm, and gave him drink."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cumque ille bibisset, adjecit: Quin et camelis tuis hauriam aquam, donec cuncti bibant."
      en: "And when he had drunk, she said: I will draw water for thy camels also, till they all drink."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Effundensque hydriam in canalibus, recurrit ad puteum ut hauriret aquam: et haustam omnibus camelis dedit."
      en: "And pouring out the pitcher into the troughs, she ran back to the well to draw water: and having drawn she gave to all the camels."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ipse autem contemplabatur eam tacitus, scire volens utrum prosperum iter suum fecisset Dominus, an non."
      en: "But he musing beheld her with silence, desirous to know whether the Lord had made his journey prosperous or not."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Postquam autem biberunt cameli, protulit vir inaures aureas, appendentes siclos duos, et armillas totidem pondo siclorum decem."
      en: "And after that the camels had drunk, the man took out golden earrings, weighing two sicles: and as many bracelets of ten sicles weight."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dixitque ad eam: Cujus es filia? indica mihi, est in domo patris tui locus ad manendum?"
      en: "And he said to her: Whose daughter art thou? tell me: is there any place in thy father's house to lodge?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Quae respondit: Filia sum Bathuelis, filii Melchae, quem peperit ipsi Nachor."
      en: "And she answered: I am the daughter of Bathuel, the son of Melcha, whom she bore to Nachor."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et addidit, dicens: Palearum quoque et foeni plurimum est apud nos, et locus spatiosus ad manendum."
      en: "And she said moreover to him: We have good store of both straw and hay, and a large place to lodge in."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Inclinavit se homo, et adoravit Dominum,"
      en: "The man bowed himself down, and adored the Lord,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "dicens: Benedictus Dominus Deus domini mei Abraham, qui non abstulit misericordiam et veritatem suam a domino meo, et recto itinere me perduxit in domum fratris domini mei."
      en: "Saying: Blessed be the Lord God of my master Abraham, who hath not taken away his mercy and truth from my master, and hath brought me the straight way into the house of my master's brother."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Cucurrit itaque puella, et nuntiavit in domum matris suae omnia quae audierat."
      en: "Then the maid ran, and told in her mother's house, all that she had heard."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Habebat autem Rebecca fratrem nomine Laban, qui festinus egressus est ad hominem, ubi erat fons."
      en: "And Rebecca had a brother named Laban, who went out in haste to the man, to the well."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Cumque vidisset inaures et armillas in manibus sororis suae, et audisset cuncta verba referentis: Haec locutus est mihi homo: venit ad virum qui stabat juxta camelos, et prope fontem aquae:"
      en: "And when he had seen the earrings and bracelets in his sister's hands, and had heard all that she related, saying: Thus and thus the man spoke to me: he came to the man who stood by the camels, and near to the spring of water,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "dixitque ad eum: Ingredere, benedicte Domini: cur foris stas? praeparavi domum, et locum camelis."
      en: "And said to him: Come in, thou blessed of the Lord: why standest thou without? I have prepared the house, and a place for the camels."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et introduxit eum in hospitium: ac destravit camelos, deditque paleas et foenum, et aquam ad lavandos pedes ejus, et virorum qui venerant cum eo."
      en: "And he brought him in into his lodging: and he unharnessed the camels and gave straw and hay, and water to wash his feet, and the feet of the men that were come with him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et appositus est in conspectu ejus panis. Qui ait: Non comedam, donec loquar sermones meos. Respondit ei: Loquere."
      en: "And bread was set before him. But he said: I will not eat, till I tell my message. He answered him: Speak."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "At ille: Servus, inquit, Abraham sum:"
      en: "And he said: I am the servant of Abraham:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et Dominus benedixit domino meo valde, magnificatusque est: et dedit ei oves et boves, argentum et aurum, servos et ancillas, camelos et asinos."
      en: "And the Lord hath blessed my master wonderfully, and he is become great: and he hath given him sheep and oxen, silver and gold, men servants and women servants, camels and asses."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et peperit Sara uxor domini mei filium domino meo in senectute sua, deditque illi omnia quae habuerat."
      en: "And Sara my master's wife hath borne my master a son in her old age, and he hath given him all that he had."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et adjuravit me dominus meus, dicens: Non accipies uxorem filio meo de filiabus Chananaeorum, in quorum terra habito:"
      en: "And my master made me swear, saying: Thou shalt not take a wife for my son of the Chanaanites, in whose land I dwell:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "sed ad domum patris mei perges, et de cognatione mea accipies uxorem filio meo."
      en: "But thou shalt go to my father's house, and shalt take a wife of my own kindred for my son:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Ego vero respondi domino meo: Quid si noluerit venire mecum mulier?"
      en: "But I answered my master: What if the woman will not come with me?"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Dominus, ait, in cujus conspectu ambulo, mittet angelum suum tecum, et diriget viam tuam: accipiesque uxorem filio meo de cognatione mea, et de domo patris mei."
      en: "The Lord, said he, in whose sight I walk, will send his angel with thee, and will direct thy way: and thou shalt take a wife for my son of my own kindred, and of my father's house."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Innocens eris a maledictione mea, cum veneris ad propinquos meos, et non dederint tibi."
      en: "But thou shalt be clear from my curse, when thou shalt come to my kindred, if they will not give thee one."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Veni ergo hodie ad fontem aquae, et dixi: Domine Deus domini mei Abraham, si direxisti viam meam, in qua nunc ambulo,"
      en: "And I came today to the well of water, and said: O Lord God of my master Abraham, if thou hast prospered my way, wherein I now walk,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "ecce sto juxta fontem aquae, et virgo, quae egredietur ad hauriendam aquam, audierit a me: Da mihi pauxillum aquae ad bibendum ex hydria tua:"
      en: "Behold I stand by the well of water, and the virgin, that shall come out to draw water, who shall hear me say: Give me a little water to drink of thy pitcher:"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et dixerit mihi: Et tu bibe, et camelis tuis hauriam: ipsa est mulier, quam praeparavit Dominus filio domini mei."
      en: "And shall say to me: Both drink thou, and I will also draw for thy camels: let the same be the woman, whom the Lord hath prepared for my master's son."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Dumque haec tacitus mecum volverem, apparuit Rebecca veniens cum hydria, quam portabat in scapula: descenditque ad fontem, et hausit aquam. Et aio ad eam: Da mihi paululum bibere."
      en: "And whilst I pondered these things secretly with myself, Rebecca appeared coming with a pitcher, which she carried on her shoulder: and she went down to the well and drew water. And I said to her: Give me a little to drink."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Quae festinans deposuit hydriam de humero, et dixit mihi: Et tu bibe, et camelis tuis tribuam potum. Bibi, et adaquavit camelos."
      en: "And she speedily let down the pitcher from her shoulder, and said to me: Both drink thou, and to thy camels I will give drink. I drank, and she watered the camels."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Interrogavique eam, et dixi: Cujus es filia? Quae respondit: Filia Bathuelis sum, filii Nachor, quem peperit ei Melcha. Suspendi itaque inaures ad ornandam faciem ejus, et armillas posui in manibus ejus."
      en: "And I asked her, and said: Whose daughter art thou? And she answered: I am the daughter of Bathuel, the son of Nachor, whom Melcha bore to him. So I put earrings on her to adorn her face, and I put bracelets on her hands."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Pronusque adoravi Dominum, benedicens Domino Deo domini mei Abraham, qui perduxit me recto itinere, ut sumerem filiam fratris domini mei filio ejus."
      en: "And falling down I adored the Lord, blessing the Lord God of my master Abraham, who hath brought me the straight way to take the daughter of my master's brother for his son."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Quam ob rem si facitis misericordiam et veritatem cum domino meo, indicate mihi: sin autem aliud placet, et hoc dicite mihi, ut vadam ad dextram, sive ad sinistram."
      en: "Wherefore if you do according to mercy and truth with my master, tell me: but if it please you otherwise, tell me that also, that I may go to the right hand, or to the left."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Responderuntque Laban et Bathuel: A Domino egressus est sermo: non possumus extra placitum ejus quidquam aliud loqui tecum."
      en: "And Laban and Bathuel answered: The word hath proceeded from the Lord, we cannot speak any other thing to thee but his pleasure."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "En Rebecca coram te est, tolle eam, et proficiscere, et sit uxor filii domini tui, sicut locutus est Dominus."
      en: "Behold Rebecca is before thee, take her and go thy way, and let her be the wife of thy master's son, as the Lord hath spoken."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Quod cum audisset puer Abraham, procidens adoravit in terram Dominum."
      en: "Which when Abraham's servant heard, falling down to the ground he adored the Lord."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Prolatisque vasis argenteis, et aureis, ac vestibus, dedit ea Rebecca pro munere: fratribus quoque ejus et matri dona obtulit."
      en: "And bringing forth vessels of silver and gold, and garments, he gave them to Rebecca for a present. He offered gifts also to her brothers, and to her mother."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Inito convivio, vescentes pariter et bibentes manserunt ibi. Surgens autem mane, locutus est puer: Dimitte me, ut vadam ad dominum meum."
      en: "And a banquet was made, and they ate and drank together, and lodged there. And in the morning, the servant arose, and said: Let me depart, that I may go to my master."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Responderuntque fratres ejus et mater: Maneat puella saltem decem dies apud nos, et postea proficiscetur."
      en: "And her brother and mother answered: Let the maid stay at least ten days with us, and afterwards she shall depart."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Nolite, ait, me retinere, quia Dominus direxit viam meam: dimittite me ut pergam ad dominum meum."
      en: "Stay me not, said he, because the Lord hath prospered my way: send me away, that I may go to my master."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Et dixerunt: Vocemus puellam, et quaeramus ipsius voluntatem."
      en: "And they said: Let us call the maid, and ask her will."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Cumque vocata venisset, sciscitati sunt: Vis ire cum homine isto? Quae ait: Vadam."
      en: "And they called her, and when she was come, they asked: Wilt thou go with this man? She said: I will go."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Dimiserunt ergo eam, et nutricem illius, servumque Abraham, et comites ejus,"
      en: "So they sent her away, and her nurse, and Abraham's servant, and his company,"
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "imprecantes prospera sorori suae, atque dicentes: Soror nostra es, crescas in mille millia, et possideat semen tuum portas inimicorum suorum."
      en: "Wishing prosperity to their sister, and saying: Thou art our sister, mayst thou increase to thousands of thousands, and may thy seed possess the gates of their enemies."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Igitur Rebecca et puellae illius, ascensis camelis, secutae sunt virum: qui festinus revertebatur ad dominum suum."
      en: "So Rebecca and her maids, being set upon camels, followed the man: who with speed returned to his master."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Eo autem tempore deambulabat Isaac per viam quae ducit ad puteum, cujus nomen est Viventis et videntis: habitabat enim in terra australi:"
      en: "At the same time Isaac was walking along the way to the well which is called Of the living and the seeing: for he dwelt in the south country."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "et egressus fuerat ad meditandum in agro, inclinata jam die: cumque elevasset oculos, vidit camelos venientes procul."
      en: "And he was gone forth to meditate in the field, the day being now well spent: and when he had lifted up his eyes, he saw camels coming afar off."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Rebecca quoque, conspecto Isaac, descendit de camelo,"
      en: "Rebecca also, when she saw Isaac, lighted off the camel,"
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "et ait ad puerum: Quis est ille homo qui venit per agrum in occursum nobis? Dixitque ei: Ipse est dominus meus. At illa tollens cito pallium, operuit se."
      en: "And said to the servant: Who is that man who cometh towards us along the field? And he said to her: That man is my master. But she quickly took her cloak, and covered herself."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "Servus autem cuncta, quae gesserat, narravit Isaac."
      en: "And the servant told Isaac all that he had done."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "Qui introduxit eam in tabernaculum Sarae matris suae, et accepit eam uxorem: et in tantum dilexit eam, ut dolorem, qui ex morte matris ejus acciderat, temperaret."
      en: "Who brought her into the tent of Sara his mother, and took her to wife: and he loved her so much, that it moderated the sorrow which was occasioned by his mother's death."
    status: { la: verified, en: verified }
