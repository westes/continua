# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 17
verses:
  - n: 1
    text:
      la: "spiritus meus adtenuabitur dies mei breviabuntur et solum mihi superest sepulchrum"
      en: "My spirit shall be wasted, my days shall be shortened, and only the grave remaineth for me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "non peccavi et in amaritudinibus moratur oculus meus"
      en: "I have not sinned, and my eye abideth in bitterness."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "libera me et pone iuxta te et cuiusvis manus pugnet contra me"
      en: "Deliver me O Lord, and set me beside thee, and let any man's hand fight against me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cor eorum longe fecisti a disciplina et propterea non exaltabuntur"
      en: "Thou hast set their heart far from understanding, therefore they shall not be exalted."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "praedam pollicetur sociis et oculi filiorum eius deficient"
      en: "He promiseth a prey to his companions, and the eyes of his children shall fail."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "posuit me quasi in proverbium vulgi et exemplum sum coram eis"
      en: "He hath made me as it were a byword of the people, and I am an example before them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "caligavit ab indignatione oculus meus et membra mea quasi in nihili redacta sunt"
      en: "My eye is dim through indignation, and my limbs are brought as it were to nothing."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "stupebunt iusti super hoc et innocens contra hypocritam suscitabitur"
      en: "The just shall be astonished at this, and the innocent shall be raised up against the hypocrite."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et tenebit iustus viam suam et mundis manibus addet fortitudinem"
      en: "And the just man shall hold on his way, and he that hath clean hands shall be stronger and stronger."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "igitur vos omnes convertimini et venite et non inveniam in vobis ullum sapientem"
      en: "Wherefore be you all converted, and come, and I shall not find among you any wise man."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dies mei transierunt cogitationes meae dissipatae sunt torquentes cor meum"
      en: "My days have passed away, my thoughts are dissipated, tormenting my heart."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "noctem verterunt in diem et rursum post tenebras spero lucem"
      en: "They have turned night into day, and after darkness I hope for light again."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "si sustinuero infernus domus mea est in tenebris stravi lectulum meum"
      en: "If I wait hell is my house, and I have made my bed in darkness."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "putredini dixi pater meus es mater mea et soror mea vermibus"
      en: "If I have said to rottenness: Thou art my father; to worms, my mother and my sister."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ubi est ergo nunc praestolatio mea et patientiam meam quis considerat"
      en: "Where is now then my expectation, and who considereth my patience?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in profundissimum infernum descendent omnia mea putasne saltim ibi erit requies mihi"
      en: "All that I have shall go down into the deepest pit: thinkest thou that there at least I shall have rest?"
    status: { la: verified, en: verified }
