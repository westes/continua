book: 1reg
chapter: 28
verses:
  - n: 1
    text:
      la: "factum est autem in diebus illis congregaverunt Philisthim agmina sua ut praepararentur ad bellum contra Israhel dixitque Achis ad David sciens nunc scito quoniam mecum egredieris in castris tu et viri tui"
      en: "And it came to pass in those days, that the Philistines gathered together their armies to be prepared for war against Israel: and Achis said to David: Know thou now assuredly, that thou shalt go out with me to the war, thou, and thy men."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque David ad Achis nunc scies quae facturus est servus tuus et ait Achis ad David et ego custodem capitis mei ponam te cunctis diebus"
      en: "And David said to Achis: Now thou shalt know what thy servant will do. And Achis said to David: And I will appoint thee to guard my life for ever."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Samuhel autem mortuus est planxitque eum omnis Israhel et sepelierunt eum in Rama urbe sua et Saul abstulit magos et ariolos de terra"
      en: "Now Samuel was dead, and all Israel mourned for him, and buried him in Ramatha his city. And Saul had put away all the magicians and soothsayers out of the land."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "congregatique sunt Philisthim et venerunt et castrametati sunt in Sunam congregavit autem et Saul universum Israhel et venit in Gelboe"
      en: "And the Philistines were gathered together, and came and camped in Sunam: and Saul also gathered together all Israel, and came to Gelboe."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et vidit Saul castra Philisthim et timuit et expavit cor eius nimis"
      en: "And Saul saw the army of the Plilistines, and was afraid, and his heart was very much dismayed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "consuluitque Dominum et non respondit ei neque per somnia neque per sacerdotes neque per prophetas"
      en: "And he consulted the Lord, and he answered him not, neither by dreams, nor by priests, nor by prophets."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixitque Saul servis suis quaerite mihi mulierem habentem pythonem et vadam ad eam et sciscitabor per illam et dixerunt servi eius ad eum est mulier habens pythonem in Aendor"
      en: "And Saul said to his servants: Seek me a woman that hath a divining spirit, and I will go to her, and inquire by her. And his servants said to him: There is a woman that hath a divining spirit at Endor."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "mutavit ergo habitum suum vestitusque est aliis vestimentis abiit ipse et duo viri cum eo veneruntque ad mulierem nocte et ait divina mihi in pythone et suscita mihi quem dixero tibi"
      en: "Then he disguised himself: and put on other clothes, and he went, and two men with him, and they came to the woman by night, and he said to her: Divine to me by thy divining spirit, and bring me up him whom I shall tell thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ait mulier ad eum ecce tu nosti quanta fecerit Saul et quomodo eraserit magos et ariolos de terra quare ergo insidiaris animae meae ut occidar"
      en: "And the woman said to him: Behold thou knowest all that Saul hath done, and how he hath rooted out the magicians and soothsayers from the land: why then dost thou lay a snare for my life, to cause me to be put to death?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et iuravit ei Saul in Domino dicens vivit Dominus quia non veniet tibi quicquam mali propter hanc rem"
      en: "And Saul swore unto her by the Lord, saying: As the Lord liveth there shall no evil happen to thee for this thing."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixitque ei mulier quem suscitabo tibi qui ait Samuhelem suscita mihi"
      en: "And the woman said to him: Whom shall I bring up to thee? And he said, Bring me up Samuel."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cum autem vidisset mulier Samuhelem exclamavit voce magna et dixit ad Saul quare inposuisti mihi tu es enim Saul"
      en: "And when the woman saw Samuel, she cried out with a loud voice, and said to Saul: Why hast thou deceived me? for thou art Saul."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixitque ei rex noli timere quid vidisti et ait mulier ad Saul deos vidi ascendentes de terra"
      en: "And the king said to her: Fear not: what hast thou seen? And the woman said to Saul: I saw gods ascending out of the earth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dixitque ei qualis est forma eius quae ait vir senex ascendit et ipse amictus est pallio intellexit Saul quod Samuhel esset et inclinavit se super faciem suam in terra et adoravit"
      en: "And he said to her: What form is he of? And she said: An old man cometh up, and he is covered with a mantle. And Saul understood that it was Samuel, and he bowed himself with his face to the ground, and adored."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixit autem Samuhel ad Saul quare inquietasti me ut suscitarer et ait Saul coartor nimis siquidem Philisthim pugnant adversum me et Deus recessit a me et exaudire me noluit neque in manu prophetarum neque per somnia vocavi ergo te ut ostenderes mihi quid faciam"
      en: "And Samuel said to Saul: Why hast thou disturbed my rest, that I should be brought up? And Saul said, I am in great distress: for the Philistines fight against me, and God is departed from me, and would not hear me, neither by the hand of prophets, nor by dreams: therefore I have called thee, that thou mayest shew me what I shall do."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ait Samuhel quid interrogas me cum Dominus recesserit a te et transierit ad aemulum tuum"
      en: "And Samuel said: Why askest thou me, seeing the Lord has departed from thee, and is gone over to thy rival:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "faciet enim Dominus tibi sicut locutus est in manu mea et scindet regnum de manu tua et dabit illud proximo tuo David"
      en: "For the Lord will do to thee as he spoke by me, and he will rend thy kingdom out of thy hand, and will give it to thy neighbour David:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quia non oboedisti voci Domini neque fecisti iram furoris eius in Amalech idcirco quod pateris fecit tibi Dominus hodie"
      en: "Because thou didst not obey the voice of the Lord, neither didst thou execute the wrath of his indignation upon Amalec. Therefore hath the Lord done to thee what thou sufferest this day."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dabit Dominus etiam Israhel tecum in manu Philisthim cras autem tu et filii tui mecum eritis sed et castra Israhel tradet Dominus in manu Philisthim"
      en: "And the Lord also will deliver Israel with thee into the hands of the Philistines: and to morrow thou and thy sons shall be with me: and the Lord will also deliver the army of Israel into the hands of the Philistines."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "statimque Saul cecidit porrectus in terram extimuerat enim verba Samuhel et robur non erat in eo quia non comederat panem tota die illa"
      en: "And forthwith Saul fell all along on the ground, for he was frightened with the words of Samuel, and there was no strength in him, for he had eaten no bread all that day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ingressa est itaque mulier ad Saul et ait conturbatus enim erat valde dixitque ad eum ecce oboedivit ancilla tua voci tuae et posui animam meam in manu mea et audivi sermones tuos quos locutus es ad me"
      en: "And the woman came to Saul (for he was very much troubled) and said to him: Behold thy handmaid hath obeyed thy voice, and I have put my life in my hand: and I hearkened unto the words which thou spokest to me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "nunc igitur audi et tu vocem ancillae tuae ut ponam coram te buccellam panis et comedens convalescas ut possis iter facere"
      en: "Now therefore hear thou also the voice of thy handmaid, and let me set before thee a morsel of bread, that thou mayest eat and recover strength, and be able to go on thy journey."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "qui rennuit et ait non comedam coegerunt autem eum servi sui et mulier et tandem audita voce eorum surrexit de terra et sedit super lectum"
      en: "But he refused, and said: I will not eat. But his servants and the woman forced him, and at length hearkening to their voice, he arose from the ground and sat upon the bed."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "mulier autem illa habebat vitulum pascualem in domo et festinavit et occidit eum tollensque farinam miscuit eam et coxit azyma"
      en: "Now the woman had a fatted calf in the house, and she made haste and killed it: and taking meal kneaded it, and baked some unleavened bread,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et posuit ante Saul et ante servos eius qui cum comedissent surrexerunt et ambulaverunt per totam noctem illam"
      en: "And set it before Saul, and before his servants. And when they had eaten they rose up, and walked all that night."
    status: { la: verified, en: verified }
