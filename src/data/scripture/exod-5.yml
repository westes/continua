# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 5
verses:
  - n: 1
    text:
      la: "post haec ingressi sunt Moses et Aaron et dixerunt Pharaoni haec dicit Dominus Deus Israhel dimitte populum meum ut sacrificet mihi in deserto"
      en: "After these things Moses and Aaron went in, and said to Pharao: Thus saith the Lord God of Israel: Let my people go that they may sacrifice to me in the desert."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "at ille respondit quis est Dominus ut audiam vocem eius et dimittam Israhel nescio Dominum et Israhel non dimittam"
      en: "But he answered: Who is the Lord, that I should hear his voice, and let Israel go? I know not the Lord, neither will I let Israel go."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixerunt Deus Hebraeorum vocavit nos ut eamus viam trium dierum in solitudinem et sacrificemus Domino Deo nostro ne forte accidat nobis pestis aut gladius"
      en: "And they said: The God of the Hebrews hath called us, to go three days' journey into the wilderness and to sacrifice to the Lord our God: lest a pestilence or the sword fall upon us."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ait ad eos rex Aegypti quare Moses et Aaron sollicitatis populum ab operibus suis ite ad onera vestra"
      en: "The king of Egypt said to them: Why do you Moses and Aaron draw off the people from their works? Get you gone to your burdens."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque Pharao multus est populus terrae videtis quod turba succreverit quanto magis si dederitis eis requiem ab operibus"
      en: "And Pharao said: The people of the land is numerous: you see that the multitude is increased: how much more if you give them rest from their works?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "praecepit ergo in die illo praefectis operum et exactoribus populi dicens"
      en: "Therefore he commanded the same day the overseers of the works, and the taskmasters of the people, saying:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nequaquam ultra dabitis paleas populo ad conficiendos lateres sicut prius sed ipsi vadant et colligant stipulam"
      en: "You shall give straw no more to the people to make brick, as before: but let them go and gather straw."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et mensuram laterum quos prius faciebant inponetis super eos nec minuetis quicquam vacant enim et idcirco vociferantur dicentes eamus et sacrificemus Deo nostro"
      en: "And you shall lay upon them the task of bricks, which they did before, neither shall you diminish any thing thereof: for they are idle, and therefore they cry, saying: Let us go and sacrifice to our God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "opprimantur operibus et expleant ea ut non adquiescant verbis mendacibus"
      en: "Let them be oppressed, with works, and let them fulfill them: that they may not regard lying words."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "igitur egressi praefecti operum et exactores ad populum dixerunt sic dicit Pharao non do vobis paleas"
      en: "And the overseers of the works and the taskmasters went out and said to the people: Thus saith Pharao, I allow you no straw:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ite et colligite sicubi invenire potueritis nec minuetur quicquam de opere vestro"
      en: "Go, and gather it where you can find it: neither shall any thing of your work be diminished."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dispersusque est populus per omnem terram Aegypti ad colligendas paleas"
      en: "And the people was scattered through all the land of Egypt to gather straw."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "praefecti quoque operum instabant dicentes conplete opus vestrum cotidie ut prius facere solebatis quando dabantur vobis paleae"
      en: "And the overseers of the works pressed them, saying: Fulfill your work every day as before you were wont to do when straw was given you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "flagellatique sunt qui praeerant operibus filiorum Israhel ab exactoribus Pharaonis dicentibus quare non impletis mensuram laterum sicut prius nec heri nec hodie"
      en: "And they that were over the works of the children of Israel were scourged by Pharao's taskmasters, saying: Why have you not made up the task of bricks both yesterday and to day as before?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "veneruntque praepositi filiorum Israhel et vociferati sunt ad Pharaonem dicentes cur ita agis contra servos tuos"
      en: "And the officers of the children of Israel came, and cried out to Pharao, saying: Why dealest thou so with thy servants?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "paleae non dantur nobis et lateres similiter imperantur en famuli tui flagellis caedimur et iniuste agitur contra populum tuum"
      en: "Straw is not given us, and bricks are required of us as before: behold we thy servants are beaten with whips, and thy people is unjustly dealt withal."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui ait vacatis otio et idcirco dicitis eamus et sacrificemus Domino"
      en: "And he said: You are idle, and therefore you say: Let us go and sacrifice to the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ite ergo et operamini paleae non dabuntur vobis et reddetis consuetum numerum laterum"
      en: "Go therefore, and work: straw shall not be given you, and you shall deliver the accustomed number of bricks."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "videbantque se praepositi filiorum Israhel in malo eo quod diceretur eis non minuetur quicquam de lateribus per singulos dies"
      en: "And the officers of the children of Israel saw that they were in evil case, because it was said to them: There shall not a whit be diminished of the bricks for every day."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "occurreruntque Mosi et Aaron qui stabant ex adverso egredientes a Pharaone"
      en: "And they met Moses and Aaron, who stood over against them as they came out from Pharao:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et dixerunt ad eos videat Dominus et iudicet quoniam fetere fecistis odorem nostrum coram Pharao et servis eius et praebuistis ei gladium ut occideret nos"
      en: "And they said to them: The Lord see and judge, because you have made our savour to stink before Pharao and his servants, and you have given him a sword to kill us."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "reversusque Moses ad Dominum ait Domine cur adflixisti populum istum quare misisti me"
      en: "And Moses returned to the Lord, and said: Lord, why hast thou afflicted this people? wherefore hast thou sent me?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ex eo enim quo ingressus sum ad Pharaonem ut loquerer nomine tuo adflixit populum tuum et non liberasti eos"
      en: "For since the time that I went in to Pharao to speak in thy name, he hath afflicted thy people: and thou hast not delivered them."
    status: { la: verified, en: verified }
