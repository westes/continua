# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1cor
chapter: 10
verses:
  - n: 1
    text:
      la: "Nolo enim vos ignorare fratres, quoniam patres nostri omnes sub nube fuerunt, et omnes mare transierunt,"
      en: "For I would not have you ignorant, brethren, that our fathers were all under the cloud, and all passed through the sea."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et omnes in Moyse baptizati sunt in nube, et in mari:"
      en: "And all in Moses were baptized, in the cloud, and in the sea:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et omnes eamdem escam spiritalem manducaverunt,"
      en: "And did all eat the same spiritual food,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et omnes eumdem potum spiritalem biberunt ( bibebant autem de spiritali, consequente eos, petra: petra autem erat Christus):"
      en: "And all drank the same spiritual drink; (and they drank of the spiritual rock that followed them, and the rock was Christ.)"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sed non in pluribus eorum beneplacitum est Deo: nam prostrati sunt in deserto."
      en: "But with most of them God was not well pleased: for they were overthrown in the desert."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Haec autem in figura facta sunt nostri, ut non simus concupiscentes malorum, sicut et illi concupierunt."
      en: "Now these things were done in a figure of us, that we should not covet evil things as they also coveted."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Neque idololatrae efficiamini, sicut quidam ex ipsis: quemadmodum scriptum est: Sedit populus manducare, et bibere, et surrexerunt ludere."
      en: "Neither become ye idolaters, as some of them, as it is written: The people sat down to eat and drink, and rose up to play."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Neque fornicemur, sicut quidam ex ipsis fornicati sunt, et ceciderunt una die viginti tria millia."
      en: "Neither let us commit fornication, as some of them committed fornication, and there fell in one day three and twenty thousand."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Neque tentemus Christum, sicut quidam eorum tentaverunt, et a serpentibus perierunt."
      en: "Neither let us tempt Christ: as some of them tempted, and perished by the serpents."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Neque murmuraveritis, sicut quidam eorum murmuraverunt, et perierunt ab exterminatore."
      en: "Neither do you murmur: as some of them murmured, and were destroyed by the destroyer."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Haec autem omnia in figura contingebant illis: scripta sunt autem ad correptionem nostram, in quos fines saeculorum devenerunt."
      en: "Now all these things happened to them in figure: and they are written for our correction, upon whom the ends of the world are come."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Itaque qui se existimat stare, videat ne cadat."
      en: "Wherefore he that thinketh himself to stand, let him take heed lest he fall."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tentatio vos non apprehendat nisi humana: fidelis autem Deus est, qui non patietur vos tentari supra id quod potestis, sed faciet etiam cum tentatione proventum ut possitis sustinere."
      en: "Let no temptation take hold on you, but such as is human. And God is faithful, who will not suffer you to be tempted above that which you are able: but will make also with temptation issue, that you may be able to bear it."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Propter quod, carissimi mihi, fugite ab idolorum cultura:"
      en: "Wherefore, my dearly beloved, fly from the service of idols."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ut prudentibus loquor, vos ipsi judicate quod dico."
      en: "I speak as to wise men: judge ye yourselves what I say."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Calix benedictionis, cui benedicimus, nonne communicatio sanguinis Christi est? et panis quem frangimus, nonne participatio corporis Domini est?"
      en: "The chalice of benediction, which we bless, is it not the communion of the blood of Christ? And the bread, which we break, is it not the partaking of the body of the Lord?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quoniam unus panis, unum corpus multi sumus, omnes qui de uno pane participamus."
      en: "For we, being many, are one bread, one body, all that partake of one bread."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Videte Israel secundum carnem: nonne qui edunt hostias, participes sunt altaris?"
      en: "Behold Israel according to the flesh: are not they, that eat of the sacrifices, partakers of the altar?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quid ergo? dico quod idolis immolatum sit aliquid? aut quod idolum, sit aliquid?"
      en: "What then? Do I say, that what is offered in sacrifice to idols, is any thing? Or, that the idol is any thing?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sed quae immolant gentes, daemoniis immolant, et non Deo. Nolo autem vos socios fieri daemoniorum:"
      en: "But the things which the heathens sacrifice, they sacrifice to devils, and not to God. And I would not that you should be made partakers with devils."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non potestis calicem Domini bibere, et calicem daemoniorum; non potestis mensae Domini participes esse, et mensae daemoniorum."
      en: "You cannot drink the chalice of the Lord, and the chalice of devils: you cannot be partakers of the table of the Lord, and of the table of devils."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "An aemulamur Dominum? numquid fortiores illo sumus? Omnia mihi licent, sed non omnia expediunt."
      en: "Do we provoke the Lord to jealousy? Are we stronger than he? All things are lawful for me, but all things are not expedient."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Omnia mihi licent, sed non omnia aedificat."
      en: "All things are lawful for me, but all things do not edify."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Nemo quod suum est quaerat, sed quod alterius."
      en: "Let no man seek his own, but that which is another's."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Omne quod in macello venit, manducate, nihil interrogantes propter conscientiam."
      en: "Whatsoever is sold in the shambles, eat; asking no question for conscience' sake."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Domini est terra, et plenitudo ejus."
      en: "The earth is the Lord's, and the fulness thereof."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Si quis vocat vos infidelium, et vultis ire: omne quod vobis apponitur, manducate, nihil interrogantes propter conscientiam."
      en: "If any of them that believe not, invite you, and you will be willing to go; eat of any thing that is set before you, asking no question for conscience' sake."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Si quis autem dixerit: Hoc immolatum est idolis: nolite manducare propter illum qui indicavit, et propter conscientiam:"
      en: "But if any man say: This has been sacrificed to idols, do not eat of it for his sake that told it, and for conscience' sake."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "conscientiam autem dico non tuam, sed alterius. Ut quid enim libertas mea judicatur ab aliena conscientia?"
      en: "Conscience, I say, not thy own, but the other's. For why is my liberty judged by another man's conscience?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Si ego cum gratia participo, quid blasphemor pro eo quod gratias ago?"
      en: "If I partake with thanksgiving, why am I evil spoken of, for that for which I give thanks?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Sive ergo manducatis, sive bibitis, sive aliud quid facitis: omnia in gloriam Dei facite."
      en: "Therefore, whether you eat or drink, or whatsoever else you do, do all to the glory of God."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Sine offensione estote Judaeis, et gentibus, et ecclesiae Dei:"
      en: "Be without offence to the Jews, and to the Gentiles, and to the church of God:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "sicut et ego per omnia omnibus placeo, non quaerens quod mihi utile est, sed quod multis: ut salvi fiant."
      en: "As I also in all things please all men, not seeking that which is profitable to myself, but to many, that may be saved."
    status: { la: verified, en: verified }
