# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 18
verses:
  - n: 1
    text:
      la: "dixitque Dominus ad Aaron tu et filii tui et domus patris tui tecum portabitis iniquitatem sanctuarii et tu et filii tui simul sustinebitis peccata sacerdotii vestri"
      en: "And the Lord said to Aaron: Thou, and thy sons, and thy father's house with thee shall bear the iniquity of the sanctuary: and thou and thy sons with thee shall bear the sins of your priesthood."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sed et fratres tuos de tribu Levi et sceptro patris tui sume tecum praestoque sint et ministrent tibi tu autem et filii tui ministrabitis in tabernaculo testimonii"
      en: "And take with thee thy brethren also of the tribe of Levi, and the sceptre of thy father, and let them be ready in hand, and minister to thee: but thou and thy sons shall minister in the tabernacle of the testimony."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "excubabuntque Levitae ad praecepta tua et ad cuncta opera tabernaculi ita dumtaxat ut ad vasa sanctuarii et altare non accedant ne et illi moriantur et vos pereatis simul"
      en: "And the Levites shall watch to do thy commands, and about all the works of the tabernacle: only they shall not come nigh the vessels of the sanctuary nor the altar, lest both they die, and you also perish with them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sint autem tecum et excubent in custodiis tabernaculi et in omnibus caerimoniis eius alienigena non miscebitur vobis"
      en: "But let them be with thee, and watch in the charge of the tabernacle, and in all the ceremonies thereof. A stranger shall not join himself with you."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "excubate in custodia sanctuarii et in ministerio altaris ne oriatur indignatio super filios Israhel"
      en: "Watch ye in the charge of the sanctuary, and in the ministry of the altar: lest indignation rise upon the children of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ego dedi vobis fratres vestros Levitas de medio filiorum Israhel et tradidi donum Domino ut serviant in ministeriis tabernaculi eius"
      en: "I have given you your brethren the Levites from among the children of Israel, and have delivered them for a gift to the Lord, to serve in the ministries of the tabernacle."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tu autem et filii tui custodite sacerdotium vestrum et omnia quae ad cultum altaris pertinent et intra velum sunt per sacerdotes administrabuntur si quis externus accesserit occidetur"
      en: "But thou and thy sons look ye to the priesthood: and all things that pertain to the service of the altar, and that are within the veil, shall be executed by the priests. If any stranger shall approach, he shall be slain."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "locutus est Dominus ad Aaron ecce dedi tibi custodiam primitiarum mearum omnia quae sanctificantur a filiis Israhel tibi tradidi et filiis tuis pro officio sacerdotali legitima sempiterna"
      en: "And the Lord said to Aaron: Behold I have given thee the charge of my firstfruits. All things that are sanctified by the children of Israel, I have delivered to thee and to thy sons for the priestly office, by everlasting ordinances."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "haec ergo accipies de his quae sanctificantur et oblata sunt Domino omnis oblatio et sacrificium et quicquid pro peccato atque delicto redditur mihi et cedet in sancta sanctorum tuum erit et filiorum tuorum"
      en: "These therefore shalt thou take of the things that are sanctified, and are offered to the Lord. Every offering, and sacrifice, and whatsoever is rendered to me for sin and for trespass, and becometh holy of holies, shall be for thee and thy sons."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in sanctuario comedes illud mares tantum edent ex eo quia consecratum est tibi"
      en: "Thou shalt eat it in the sanctuary: the males only shall eat thereof, because it is a consecrated thing to thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "primitias autem quas voverint et obtulerint filii Israhel tibi dedi et filiis ac filiabus tuis iure perpetuo qui mundus est in domo tua vescetur eis"
      en: "But the firstfruits, which the children of Israel shall vow and offer, I have given to thee, and to thy sons, and to thy daughters, by a perpetual law. He that is clean in thy house, shall eat them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "omnem medullam olei et vini ac frumenti quicquid offerunt primitiarum Domino tibi dedi"
      en: "All the best of the oil, and of the wine, and of the corn, whatsoever firstfruits they offer to the Lord, I have given them to thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "universa frugum initia quas gignit humus et Domino deportantur cedent in usus tuos qui mundus est in domo tua vescetur eis"
      en: "All the firstripe of the fruits, that the ground bringeth forth, and which are brought to the Lord, shall be for thy use: he that is clean in thy house, shall eat them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "omne quod ex voto reddiderint filii Israhel tuum erit"
      en: "Every thing that the children of Israel shall give by vow, shall be thine."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quicquid primum erumpet e vulva cunctae carnis quam offerunt Domino sive ex hominibus sive de pecoribus fuerit tui iuris erit ita dumtaxat ut pro hominis primogenito pretium accipias et omne animal quod inmundum est redimi facias"
      en: "Whatsoever is firstborn of all flesh, which they offer to the Lord, whether it be of men, or of beasts, shall belong to thee: only for the firstborn of man thou shalt take a price, and every beast that is unclean thou shalt cause to be redeemed,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cuius redemptio erit post unum mensem siclis argenti quinque pondere sanctuarii siclus viginti obolos habet"
      en: "And the redemption of it shall be after one month, for five sicles of silver, by the weight of the sanctuary. A sicle hath twenty obols."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "primogenitum autem bovis et ovis et caprae non facies redimi quia sanctificata sunt Domino sanguinem tantum eorum fundes super altare et adipes adolebis in suavissimum odorem Domino"
      en: "But the firstling of a cow and of a sheep and of a goat thou shalt not cause to be redeemed, because they are sanctified to the Lord. Their blood only thou shalt pour upon the altar, and their fat thou shalt burn for a most sweet odour to the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "carnes vero in usum tuum cedent sicut pectusculum consecratum et armus dexter tua erunt"
      en: "But the flesh shall fall to thy use, as the consecrated breast, and the right shoulder shall be thine."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "omnes primitias sanctuarii quas offerunt filii Israhel Domino tibi dedi et filiis ac filiabus tuis iure perpetuo pactum salis est sempiternum coram Domino tibi ac filiis tuis"
      en: "All the firstfruits of the sanctuary which the children of Israel offer to the Lord, I have given to thee and to thy sons and daughters, by a perpetual ordinance. It is a covenant of salt for ever before the Lord, to thee and to thy sons."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixitque Dominus ad Aaron in terra eorum nihil possidebitis nec habebitis partem inter eos ego pars et hereditas tua in medio filiorum Israhel"
      en: "And the Lord said to Aaron: You shall possess nothing in their land, neither shall you have a portion among them: I am thy portion and inheritance in the midst of the children of Israel."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "filiis autem Levi dedi omnes decimas Israhelis in possessionem pro ministerio quo serviunt mihi in tabernaculo foederis"
      en: "And I have given to the sons of Levi all the tithes of Israel for a possession for the ministry wherewith they serve me in the tabernacle of the covenant:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ut non accedant ultra filii Israhel ad tabernaculum nec committant peccatum mortiferum"
      en: "That the children of Israel may not approach any more to the tabernacle, nor commit deadly sin,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "solis filiis Levi mihi in tabernaculo servientibus et portantibus peccata populi legitimum sempiternum erit in generationibus vestris nihil aliud possidebunt"
      en: "But only the sons of Levi may serve me in the tabernacle, and bear the sins of the people. It shall be an everlasting ordinance in your generations. They shall not possess any other thing,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "decimarum oblatione contenti quas in usus eorum et necessaria separavi"
      en: "But be content with the oblation or tithes, which I have separated for their uses and necessities."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "praecipe Levitis atque denuntia cum acceperitis a filiis Israhel decimas quas dedi vobis primitias earum offerte Domino id est decimam partem decimae"
      en: "Command the Levites, and declare unto them: When you shall receive of the children of Israel the tithes, which I have given you, offer the firstfruits of them to the Lord, that is to say, the tenth part of the tenth:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ut reputetur vobis in oblationem primitivorum tam de areis quam de torcularibus"
      en: "That it may be reckoned to you as an oblation of firstfruits, as well of the barnfloors as of the winepresses:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et universis quorum accipitis primitias offerte Domino et date Aaron sacerdoti"
      en: "And of all the things of which you receive tithes, offer the firstfruits to the Lord, and give them to Aaron the priest."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "omnia quae offertis ex decimis et in donaria Domini separatis optima et electa erunt"
      en: "All the things that you shall offer of the tithes, and shall separate for the gifts of the Lord, shall be the best and choicest things."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "dicesque ad eos si praeclara et meliora quaeque obtuleritis ex decimis reputabitur vobis quasi de area et torculari dederitis primitias"
      en: "And thou shalt say to them: If you offer all the goodly and the better things of the tithes, it shall be reckoned to you as if you had given the firstfruits of the barnfloor and the winepress:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et comedetis eas in omnibus locis vestris tam vos quam familiae vestrae quia pretium est pro ministerio quo servitis in tabernaculo testimonii"
      en: "And you shall eat them in all your places, both you and your families: because it is your reward for the ministry, wherewith you serve in the tabernacle of the testimony."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et non peccabitis super hoc egregia vobis et pinguia reservantes ne polluatis oblationes filiorum Israhel et moriamini"
      en: "And you shall not sin in this point, by reserving the choicest and fat things to yourselves, lest you profane the oblations of the children of Israel, and die."
    status: { la: verified, en: verified }
