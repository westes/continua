# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 28
verses:
  - n: 1
    text:
      la: "viginti annorum erat Achaz cum regnare coepisset et sedecim annis regnavit in Hierusalem non fecit rectum in conspectu Domini sicut David pater eius"
      en: "Achaz was twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: he did not that which was right in the sight of the Lord as David his father had done,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sed ambulavit in viis regum Israhel insuper et statuas fudit Baalim"
      en: "But walked in the ways of the kings of Israel; moreover also he cast statues for Baalim."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ipse est qui adolevit incensum in valle Benennon et lustravit filios suos in igne iuxta ritum gentium quas interfecit Dominus in adventu filiorum Israhel"
      en: "It was he that burnt incense in the valley of Benennom, and consecrated his sons in the fire according to the manner of the nations, which the Lord slew at the coming of the children of Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sacrificabat quoque et thymiama succendebat in excelsis et in collibus et sub omni ligno frondoso"
      en: "He sacrificed also, and burnt incense in the high places, and on the hills, and under every green tree."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tradiditque eum Dominus Deus eius in manu regis Syriae qui percussit eum magnamque praedam de eius cepit imperio et adduxit in Damascum manibus quoque regis Israhel traditus est et percussus plaga grandi"
      en: "And the Lord his God delivered him into the hands of the king of Syria, who defeated him, and took a great booty out of his kingdom, and carried it to Damascus: he was also delivered into the hands of the king of Israel, who overthrew him with a great slaughter."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "occiditque Phacee filius Romeliae de Iuda centum viginti milia in die uno omnes viros bellatores eo quod reliquissent Dominum Deum patrum suorum"
      en: "For Phacee the son of Romelia slew of Juda a hundred and twenty thousand in one day, all valiant men: because they had forsaken the Lord the God of their fathers."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "eodem tempore occidit Zechri vir potens ex Ephraim Masiam filium regis et Ezricam ducem domus eius Helcanam quoque secundum a rege"
      en: "At the same time Zechri a powerful man of Ephraim, slew Maasias the king's son, and Ezricam the governor of his house, and Elcana who was next to the king."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ceperuntque filii Israhel de fratribus suis ducenta milia mulierum puerorum et puellarum et infinitam praedam pertuleruntque eam in Samariam"
      en: "And the children of Israel carried away of their brethren two hundred thousand women, boys, and girls, and an immense booty: and they brought it to Samaria."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ea tempestate erat ibi propheta Domini nomine Oded qui egressus obviam exercitui venientium in Samariam dixit eis ecce iratus Dominus Deus patrum vestrorum contra Iudam tradidit eos manibus vestris et occidistis illos atrociter ita ut caelum pertingeret vestra crudelitas"
      en: "At that time there was a prophet of the Lord there, whose name was Oded: and he went out to meet the army that came to Samaria, and said to them: Be- hold the Lord the God of your fathers being angry with Juda, hath delivered them into your hands, and you have butchered them cruelly, so that your cruelty hath reached up to heaven."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "insuper filios Iuda et Hierusalem vultis vobis subicere in servos et ancillas quod nequaquam facto opus est peccatis enim super hoc Domino Deo vestro"
      en: "Moreover you have a mind to keep under the children of Juda and Jerusalem for your bondmen and bondwomen, which ought not to be done : for you have sinned in this against the Lord your God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sed audite consilium meum et reducite captivos quos adduxistis de fratribus vestris quia magnus furor Domini inminet vobis"
      en: "But hear ye my counsel, and release the captives that you have brought of your brethren, because a great indignation of the Lord hangeth over you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "steterunt itaque viri de principibus filiorum Ephraim Azarias filius Iohanan Barachias filius Mosollamoth Hiezechias filius Sellum et Amasa filius Adali contra eos qui veniebant de proelio"
      en: "Then some of the chief men of the sons of Ephraim, Azarias the son of Johanan, Barachias the son of Mosollamoth, Ezechias the son of Sellum, and Amasa the son of Adali, stood up against them that came from the war."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dixerunt eis non introducetis huc captivos ne peccemus Domino quare vultis adicere super peccata nostra et vetera cumulare delicta grande quippe peccatum est et ira furoris Domini inminet super Israhel"
      en: "And they said to them: You shall not bring in the captives hither, lest we sin against the Lord. Why will you add to our sins, and heap up upon our former offences? for the sin is great, and the fierce anger of the Lord hangeth over Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dimiseruntque viri bellatores praedam et universa quae ceperant coram principibus et omni multitudine"
      en: "So the soldiers left the spoils, and all that they had taken, before the princes and all the multitude."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "steteruntque viri quos supra memoravimus et adprehendentes captivos omnesque qui nudi erant vestierunt de spoliis cumque vestissent eos et calciassent et refecissent cibo ac potu unxissent quoque propter laborem et adhibuissent eis curam quicumque ambulare non poterant et erant inbecillo corpore inposuerunt eos iumentis et adduxerunt Hierichum civitatem Palmarum ad fratres eorum ipsique reversi sunt Samariam"
      en: "And the men, whom we mentioned above, rose up and took the captives, and with the spoils clothed all them that were naked: and when they had clothed and shed them, and refreshed them with meat and drink, and anointed them because of their labour, and had taken care of them, they set such of them as could not walk, and were feeble, upon beasts, and brought them to Jericho the city of palm trees to their brethren, and they returned to Samaria."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tempore illo misit rex Achaz ad regem Assyriorum auxilium postulans"
      en: "At that time king Achaz sent to the king of the Assyrians asking help."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "veneruntque Idumei et percusserunt multos ex Iuda et ceperunt praedam magnam"
      en: "And the Edomites came and slew many of Juda, and took a great booty."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Philisthim quoque diffusi sunt per urbes campestres et ad meridiem Iuda ceperuntque Bethsames et Ahilon et Gaderoth Soccho quoque et Thamnam et Gamzo cum viculis suis et habitaverunt in eis"
      en: "The Philistines also spread themselves among the cities of the plains, and to the south of Juda: and they took Bethsames, and Aialon, and Gaderoth, and Socho, and Thamnan, and Gamzo, with their villages, and they dwelt in them."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "humiliaverat enim Dominus Iudam propter Achaz regem Iuda eo quod nudasset eum auxilio et contemptui habuisset Dominum"
      en: "For the Lord had humbled Juda because of Achaz the king of Juda, for he had stripped it of help, and had contemned the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "adduxitque contra eum Thaglathphalnasar regem Assyriorum qui et adflixit eum et nullo resistente vastavit"
      en: "And he brought, against him Thelgathphalnasar king of the Assyrians, who also afflicted him, and plundered him without any resistance."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "igitur Achaz spoliata domo Domini et domo regum et principum dedit regi Assyriorum munera et tamen nihil ei profuit"
      en: "And Achaz stripped the house of the Lord, and the house of the kings, and of the princes, and gave gifts to the king of the Assyrians, and yet it availed him nothing."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "insuper et in tempore angustiae suae auxit contemptum in Dominum ipse per se rex Achaz"
      en: "Moreover also in the time of his distress he increased contempt against the Lord: king Achaz himself by himself,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "immolavit diis Damasci victimas percussoribus suis et dixit dii regum Syriae auxiliantur eis quos ego placabo hostiis et aderunt mihi cum e contrario ipsi fuerint ruina eius et universo Israhel"
      en: "Sacrificed victims to the gods of Damascus that struck him, and he said: The gods of the kings of Syria help them, and I will appease them with victims, and they will help me; whereas on the contrary they were the ruin of him, and of all Israel."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "direptis itaque Achaz omnibus vasis domus Dei atque confractis clusit ianuas templi Dei et fecit sibi altaria in universis angulis Hierusalem"
      en: "Then Achaz having taken away all the vessels of the house of God, and broken them, shut up the doors of the temple of God, and made himself altars in all the corners of Jerusalem."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "in omnibus quoque urbibus Iuda extruxit aras ad cremandum tus atque ad iracundiam provocavit Dominum Deum patrum suorum"
      en: "And in all the cities of Juda he built altars to burn frankincense, and he provoked the Lord the God of his fathers to wrath."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "reliqua autem sermonum eius et omnium operum priorum et novissimorum scripta sunt in libro regum Iuda et Israhel"
      en: "But the rest of his acts, and all his works first and last are written in the book of the kings of Juda and Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "dormivitque Achaz cum patribus suis et sepelierunt eum in civitate Hierusalem neque enim receperunt eum in sepulchra regum Israhel regnavitque Ezechias filius eius pro eo"
      en: "And Achaz slept with his fathers, and they buried him in the city of Jerusalem: for they received him not into the sepulchres of the kings of Israel. And Ezechias his son reigned in his stead."
    status: { la: verified, en: verified }
