# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 28
verses:
  - n: 1
    text:
      la: "Viginti annorum erat Achaz cum regnare coepisset: et sedecim annis regnavit in Jerusalem. Non fecit rectum in conspectu Domini sicut David pater ejus:"
      en: "Achaz was twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: he did not that which was right in the sight of the Lord as David his father had done,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sed ambulavit in viis regum Israel, insuper et statuas fudit Baalim."
      en: "But walked in the ways of the kings of Israel; moreover also he cast statues for Baalim."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ipse est, qui adolevit incensum in valle Benennom, et lustravit filios suos in igne juxta ritum gentium, quas interfecit Dominus in adventu filiorum Israel."
      en: "It was he that burnt incense in the valley of Benennom, and consecrated his sons in the fire according to the manner of the nations, which the Lord slew at the coming of the children of Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sacrificabat quoque, et thymiama succendebat in excelsis, et in collibus, et sub omni ligno frondoso."
      en: "He sacrificed also, and burnt incense in the high places, and on the hills, and under every green tree."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tradiditque eum Dominus Deus ejus in manu regis Syriae, qui percussit eum, magnamque praedam cepit de ejus imperio, et adduxit in Damascum: manibus quoque regis Israel traditus est, et percussus plaga grandi."
      en: "And the Lord his God delivered him into the hands of the king of Syria, who defeated him, and took a great booty out of his kingdom, and carried it to Damascus: he was also delivered into the hands of the king of Israel, who overthrew him with a great slaughter."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Occiditque Phacee, filius Romeliae, de Juda centum viginti millia in die uno, omnes viros bellatores: eo quod reliquissent Dominum Deum patrum suorum."
      en: "For Phacee the son of Romelia slew of Juda a hundred and twenty thousand in one day, all valiant men: because they had forsaken the Lord the God of their fathers."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Eodem tempore occidit Zechri, vir potens ex Ephraim, Maasiam filium regis, et Ezricam ducem domus ejus, Elcanam quoque secundum a rege."
      en: "At the same time Zechri a powerful man of Ephraim, slew Maasias the king's son, and Ezricam the governor of his house, and Elcana who was next to the king."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ceperuntque filii Israel de fratribus suis ducenta millia mulierum puerorum, et puellarum, et infinitam praedam: pertuleruntque eam in Samariam."
      en: "And the children of Israel carried away of their brethren two hundred thousand women, boys, and girls, and an immense booty: and they brought it to Samaria."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ea tempestate erat ibi propheta Domini, nomine Oded: qui egressus obviam exercitui venienti in Samariam, dixit eis: Ecce iratus Dominus Deus patrum vestrorum contra Juda, tradidit eos in manibus vestris, et occidistis eos atrociter, ita ut ad caelum pertingeret vestra crudelitas."
      en: "At that time there was a prophet of the Lord there, whose name was Oded: and he went out to meet the army that came to Samaria, and said to them: Behold the Lord the God of your fathers being angry with Juda, hath delivered them into your hands, and you have butchered them cruelly, so that your cruelty hath reached up to heaven."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Insuper filios Juda et Jerusalem vultis vobis subjicere in servos et ancillas: quod nequaquam facto opus est: peccastis enim super hoc Domino Deo vestro."
      en: "Moreover you have a mind to keep under the children of Juda and Jerusalem for your bondmen and bondwomen, which ought not to be done: for you have sinned in this against the Lord your God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sed audite consilium meum, et reducite captivos, quos adduxistis de fratribus vestris, quia magnus furor Domini imminet vobis."
      en: "But hear ye my counsel, and release the captives that you have brought of your brethren, because a great indignation of the Lord hangeth over you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Steterunt itaque viri de principibus filiorum Ephraim, Azarias filius Johanam, Barachias filius Mosollamoth, Ezechias filius Sellum, et Amasa filius Adali, contra eos, qui veniebant de praelio,"
      en: "Then some of the chief men of the sons of Ephraim, Azarias the son of Johanan, Barachias the son of Mosollamoth, Ezechias the son of Sellum, and Amasa the son of Adali, stood up against them that came from the war."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et dixerunt eis: Non introducetis huc captivos, ne peccemus Domino. Quare vultis adjicere super peccata nostra, et vetera cumulare delicta? grande quippe peccatum est, et ira furoris Domini imminet super Israel."
      en: "And they said to them: You shall not bring in the captives hither, lest we sin against the Lord. Why will you add to our sins, and heap up upon our former offences? for the sin is great, and the fierce anger of the Lord hangeth over Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dimiseruntque viri bellatores praedam, et universa quae ceperant, coram principibus, et omni multitudine."
      en: "So the soldiers left the spoils, and all that they had taken, before the princes and all the multitude."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Steteruntque viri, quos supra memoravimus, et apprehendentes captivos, omnesque qui nudi erant, vestierunt de spoliis: cumque vestissent eos, et calceassent, et refecissent cibo ac potu, unxissentque propter laborem, et adhibuissent eis curam: quicumque ambulare non poterant, et erant imbecillo corpore, imposuerunt eos jumentis, et adduxerunt Jericho civitatem palmarum ad fratres eorum, ipsique reversi sunt in Samariam."
      en: "And the men, whom we mentioned above, rose up and took the captives, and with the spoils clothed all them that were naked: and when they had clothed and shed them, and refreshed them with meat and drink, and anointed them because of their labour, and had taken care of them, they set such of them as could not walk, and were feeble, upon beasts, and brought them to Jericho the city of palm trees to their brethren, and they returned to Samaria."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Tempore illo misit rex Achaz ad regem Assyriorum, postulans auxilium."
      en: "At that time king Achaz sent to the king of the Assyrians asking help."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Veneruntque Idumaei, et percusserunt multos ex Juda, et ceperunt praedam magnam."
      en: "And the Edomites came and slew many of Juda, and took a great booty."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Philisthiim quoque diffusi sunt per urbes campestres, et ad meridiem Juda: ceperuntque Bethsames, et Ajalon, et Gaderoth, Socho quoque, et Thamnan, et Gamzo, cum viculis suis, et habitaverunt in eis."
      en: "The Philistines also spread themselves among the cities of the plains, and to the south of Juda: and they took Bethsames, and Aialon, and Gaderoth, and Socho, and Thamnan, and Gamzo, with their villages, and they dwelt in them."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Humiliaverat enim Dominus Judam propter Achaz regem Juda, eo quod nudasset eum auxilio, et contemptui habuisset Dominum."
      en: "For the Lord had humbled Juda because of Achaz the king of Juda, for he had stripped it of help, and had contemned the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Adduxitque contra eum Thelgathphalnasar regem Assyriorum, qui et afflixit eum, et nullo resistente vastavit."
      en: "And he brought, against him Thelgathphalnasar king of the Assyrians, who also afflicted him, and plundered him without any resistance."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Igitur Achaz, spoliata domo Domini, et domo regum, ac principum, dedit regi Assyriorum munera, et tamen nihil ei profuit."
      en: "And Achaz stripped the house of the Lord, and the house of the kings, and of the princes, and gave gifts to the king of the Assyrians, and yet it availed him nothing."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Insuper et tempore angustiae suae auxit contemptum in Dominum, ipse per se rex Achaz,"
      en: "Moreover also in the time of his distress he increased contempt against the Lord: king Achaz himself by himself,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "immolavit diis Damasci victimas percussoribus suis, et dixit: Dii regum Syriae auxiliantur eis, quos ego placabo hostiis, et aderunt mihi, cum e contrario ipsi fuerint ruinae ei, et universo Israel."
      en: "Sacrificed victims to the gods of Damascus that struck him, and he said: The gods of the kings of Syria help them, and I will appease them with victims, and they will help me; whereas on the contrary they were the ruin of him, and of all Israel."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Direptis itaque Achaz omnibus vasis domus Dei, atque confractis, clausit januas templi Dei, et fecit sibi altaria in universis angulis Jerusalem."
      en: "Then Achaz having taken away all the vessels of the house of God, and broken them, shut up the doors of the temple of God, and made himself altars in all the corners of Jerusalem."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "In omnibus quoque urbibus Juda exstruxit aras ad cremandum thus, atque ad iracundiam provocavit Dominum Deum patrum suorum."
      en: "And in all the cities of Juda he built altars to burn frankincense, and he provoked the Lord the God of his fathers to wrath."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Reliqua autem sermonum ejus, et omnium operum suorum priorum et novissimorum, scripta sunt in libro regum Juda et Israel."
      en: "But the rest of his acts, and all his works first and last are written in the book of the kings of Juda and Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Dormivitque Achaz cum patribus suis, et sepelierunt eum in civitate Jerusalem: neque enim receperunt eum in sepulchra regum Israel. Regnavitque Ezechias filius ejus pro eo."
      en: "And Achaz slept with his fathers, and they buried him in the city of Jerusalem: for they received him not into the sepulchres of the kings of Israel. And Ezechias his son reigned in his stead."
    status: { la: verified, en: verified }
