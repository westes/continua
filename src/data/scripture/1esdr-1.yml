# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1esdr
chapter: 1
verses:
  - n: 1
    text:
      la: "In anno primo Cyri regis Persarum, ut compleretur verbum Domini ex ore Jeremiae, suscitavit Dominus spiritum Cyri regis Persarum: et traduxit vocem in omni regno suo, etiam per scripturam, dicens:"
      en: "In the first year of Cyrus king of the Persians, that the word of the Lord by the mouth of Jeremias might be fulfilled, the Lord stirred up the spirit of Cyrus king of the Persians: and he made a proclamation throughout all his kingdom, and in writing also, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Haec dicit Cyrus rex Persarum: Omnia regna terrae dedit mihi Dominus Deus caeli, et ipse praecepit mihi ut aedificarem ei domum in Jerusalem, quae est in Judaea."
      en: "Thus saith Cyrus king of the Persians: The Lord the God of heaven hath given to me all the kingdoms of the earth, and he hath charged me to build him a house in Jerusalem, which is in Judea."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quis est in vobis de universo populo ejus? Sit Deus illius cum ipso. Ascendat in Jerusalem, quae est in Judaea, et aedificet domum Domini Dei Israel: ipse est Deus qui est in Jerusalem."
      en: "Who is there among you of all his people? His God be with him. Let him go up to Jerusalem, which is in Judea, and build the house of the Lord the God of Israel: he is the God that is in Jerusalem."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et omnes reliqui in cunctis locis ubicumque habitant, adjuvent eum viri de loco suo argento et auro, et substantia, et pecoribus, excepto quod voluntarie offerunt templo Dei, quod est in Jerusalem."
      en: "And let all the rest in all places wheresoever they dwell, help him every man from his place. with silver and gold, and goods, and cattle, besides that which they offer freely to the temple of God, which is in Jerusalem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et surrexerunt principes patrum de Juda, et Benjamin, et sacerdotes, et Levitae, et omnis cujus Deus suscitavit spiritum, ut ascenderent ad aedificandum templum Domini, quod erat in Jerusalem."
      en: "Then rose up the chief of the fathers of Juda and Benjamin, and the priests, and Levites, and every one whose spirit God had raised up, to go up to build the temple of the Lord, which was in Jerusalem."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Universique qui erant in circuitu, adjuverunt manus eorum in vasis argenteis et aureis, in substantia et jumentis in supellectili, exceptis his quae sponte obtulerant."
      en: "And all they that were round about, helped their hands with vessels of silver, and gold, with goods, and with beasts, and with furniture, besides what they had offered on their own accord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Rex quoque Cyrus protulit vasa templi Domini, quae tulerat Nabuchodonosor de Jerusalem, et posuerat ea in templo dei sui."
      en: "And king Cyrus brought forth the vessels of the temple of the Lord, which Nabuchodonosor had taken from Jerusalem, and had put them in the temple of his god."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Protulit autem ea Cyrus rex Persarum per manum Mithridatis filii Gazabar, et annumeravit ea Sassabasar principi Juda."
      en: "Now Cyrus king of Persia brought them forth by the hand of Mithridates the son of Gazabar, and numbered them to Sassabasar the prince of Juda."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et hic est numerus eorum: phialae aureae triginta, phialae argenteae mille, cultri viginti novem, scyphi aurei triginta,"
      en: "And this is the number of them: thirty bowls of gold, a thousand bowls of silver, nine and twenty knives, thirty cups of gold,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "scyphi argentei secundi quadringenti decem: vasa alia mille."
      en: "Silver cups of a second sort, four hundred and ten: other vessels a thousand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Omnia vasa aurea et argentea quinque millia quadringenta: universa tulit Sassabasar cum his qui ascendebant de transmigratione Babylonis in Jerusalem."
      en: "All the vessels of gold and silver, five thousand four hundred: all these Sassabasar brought with them that came up from the captivity of Babylon to Jerusalem."
    status: { la: verified, en: verified }
