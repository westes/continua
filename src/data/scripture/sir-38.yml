# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 38
verses:
  - n: 1
    text:
      la: "honora medicum propter necessitatem etenim illum creavit Altissimus"
      en: "Honour the physician for the need thou hast of him: for the most High hath created him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "a Deo est omnis medella et a rege accipiet dationem"
      en: "For all healing is from God, and he shall receive gifts of the king."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "disciplina medici exaltabit caput illius et in conspectu magnatorum conlaudabitur"
      en: "The skill of the physician shall lift up his head, and in the sight of great men he shall be praised."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Altissimus creavit de terra medicinam et vir prudens non abhorrebit illi"
      en: "The most High hath created medicines out of the earth, and a wise man will not abhor them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nonne a ligno indulcata est amara aqua"
      en: "Was not bitter water made sweet with wood?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ad agnitionem hominum virtutis illorum et dedit homini scientiam Altissimus honorari in mirabilibus suis"
      en: "The virtue of these things is come to the knowledge of men, and the meet High hath given knowledge to men, that he may be honoured in his wonders."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in his curans mitigavit dolorem et unguentarius facit pigmentum suavitatis et unctiones conficiet suavitatis et non consummabuntur opera eius"
      en: "By these he shall cure and shall allay their pains, and of these the apothecary shall make sweet confections, and shall make up ointments of health, and of his works there shall be no end."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "pax enim Dei super faciem terrae"
      en: "For the peace of God is over all the face of the earth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "fili in tua infirmitate non despicias sed ora ad Dominum et ipse curabit te"
      en: "My son, in thy sickness neglect not thyself, but pray to the Lord, and he shall heal thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "averte a delicto et dirige manus et ab omni delicto munda cor tuum"
      en: "Turn away from sin and order thy hands aright, and cleanse thy heart from all offence."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "da suavitatem et memoriam similaginis et inpingua oblationem et da locum medico"
      en: "Give a sweet savour, and a memorial of fine flour, and make a fat offering, and then give place to the physician."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "etenim illum Dominus creavit et non discedat a te quoniam opera eius sunt necessaria"
      en: "For the Lord created him: and let him not depart from thee, for his works are necessary."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "est enim tempus quando in manus eorum incurras"
      en: "For there is a time when thou must fall into their hands:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ipsi vero Dominum deprecabuntur ut dirigat requiem eorum et sanitatem propter conversationem illorum"
      en: "And they shall beseech the Lord, that he would prosper what they give for ease and remedy, for their conversation."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui delinquit in conspectu eius qui fecit eum incidat in manus medici"
      en: "He that sinneth in the sight of his Maker, shall fall into the hands of the physician."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "fili in mortuum produc lacrimas et quasi dira passus incipe plorare et secundum iudicium contine corpus illius et non despicias sepulturam illius"
      en: "My son, shed tears over the dead, and begin to lament as if thou hadst suffered some great harm, and according to judgment cover his body, and neglect not his burial."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "propter delaturam amare fer luctum illius uno die et consolare propter tristitiam"
      en: "And for fear of being ill spoken of weep bitterly for a, day, and then comfort thyself in thy sadness."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "[]"
      en: "And make mourning for him according to his merit for a day, or two, for fear of detraction."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "a tristitia enim festinat mors et cooperiet virtutem et tristitia cordis flectet cervicem"
      en: "For of sadness cometh death, and it overwhelmeth the strength, and the sorrow of the heart boweth down the neck."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in abductione permanet tristitia et substantia inopis secundum cor eius"
      en: "In withdrawing aside sorrow remaineth: and the substance of the poor is according to his heart."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non dederis in tristitia cor tuum sed repelle eam a te et memento novissimorum"
      en: "Give not up thy heart to sadness, but drive it from thee: and remember the latter end."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "noli oblivisci neque enim est conversio et huic nihil proderis et te ipsum pessimabis"
      en: "Forget it not: for there is no returning, and thou shalt do him no good, and shalt hurt thyself."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "memor esto iudicii mei sic enim erit et tuum mihi heri et tibi hodie"
      en: "Remember my judgment: for also shall be so: yesterday for me, and to day for thee."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "in requie mortui requiescere fac memoriam eius et consolare illum in exitu spiritus sui"
      en: "When the dead is at rest, let his remembrance rest, and comfort him in the departing of his spirit."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sapientiam scribe in tempore vacuitatis et qui minoratur actu sapientiam percipiet qua sapientia replebitur"
      en: "The wisdom of a scribe cometh by his time of leisure: and he that is less in action, shall receive wisdom."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui tenet aratrum et non gloriatur in iaculo stimulo boves agit et conversatur in operibus eorum et narratio eius in filiis taurorum"
      en: "With what wisdom shall he be furnished that holdeth the plough, and that glorieth in the goad, that driveth the oxen therewith, and is occupied in their labours, and his whole talk is about the offspring of bulls?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cor suum dabit ad versandos sulcos et vigilia eius in sagina vaccarum"
      en: "He shall give his mind to turn up furrows, and his care is to give the kine fodder."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sic omnis faber et architectus qui noctem tamquam diem transigit qui sculpit signacula sculptilia et adsiduitas eius variat picturam cor suum dabit in similitudinem picturae et vigilia sua perficit opus"
      en: "So every craftsman and workmaster that laboureth night and day, he who maketh graven seals, and by his continual diligence varieth the figure: he shall give his mind to the resemblance of the picture, and by his watching shall finish the work."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sic faber ferrarius sedens iuxta incudem et considerans opus ferri vapor ignis uret carnes eius et in calore fornacis concertatur"
      en: "So doth the smith sitting by the anvil and considering the iron work. The vapour of the fire wasteth his flesh, and he fighteth with the heat of the furnace."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "vox mallei innovabit aurem eius et contra similitudinem vasi oculi eius"
      en: "The noise of the hammer is always in his ears, and his eye is upon the pat tern of the vessel he maketh."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "cor suum dabit in consummationem operum et vigilia sua ornabit in consummatione"
      en: "He setteth his mind to finish his work, and his watching to polish them, to perfection."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "sic figulus sedens ad opus suum convertens pedibus suis rotam qui in sollicitudine positus est semper propter opus suum et innumera est omnis operatio eius"
      en: "So doth the potter sitting at his work, turning the wheel about with his feet, who is always carefully set to his work, and maketh all his work by number:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "in brachio suo formabit lutum et ante pedes suos curvabit virtutem suam"
      en: "He fashioneth the clay with his arm, and boweth down his strength before his feet:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "cor suum dabit ut consummet linitionem et vigilia sua mundabit fornacem"
      en: "He shall give his mind to finish the glazing, and his watching to make clean the furnace."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "omnes hi in manibus suis speraverunt et unusquisque in arte sua sapiens est"
      en: "All these trust to their hands, and every one is wise in his own art."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "sine his omnibus non aedificatur civitas"
      en: "Without these a city is not built."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et non inhabitabunt nec inambulabunt et in ecclesiam non transilient"
      en: "And they shall not dwell, nor walk about therein, and they shall not go up into the assembly."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "super sellam iudicis non sedebunt et testamentum iudicii non intellegent neque palam facient disciplinam et iudicium et in parabolis non invenientur"
      en: "Upon the judges' seat they shall not sit, and the ordinance of judgment they shall not understand, neither shall they declare discipline and judgment, and they shall not be found where parables are spoken:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "sed creaturam aevi confirmabunt et deprecatio illorum in operatione artis adcommodantes animam suam et conquirentes in lege Altissimi"
      en: "But they shall strengthen the state of the world, and their prayer shall be in the work of their craft, applying their soul, and searching in the law of the most High."
    status: { la: verified, en: verified }
