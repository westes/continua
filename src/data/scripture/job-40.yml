# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 40
verses:
  - n: 1
    text:
      la: "respondens autem Dominus Iob de turbine ait"
      en: "And the Lord answering Job out of the whirlwind, said :"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "accinge sicut vir lumbos tuos interrogabo te et indica mihi"
      en: "Gird up thy loins like a man : I will ask thee, and do thou tell me."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "numquid irritum facies iudicium meum et condemnabis me ut tu iustificeris"
      en: "Wilt thou make void my judgment : and condemn me, that thou mayst be justified?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et si habes brachium sicut Deus et si voce simili tonas"
      en: "And hast thou an arm like God, and canst thou thunder with a voice like him?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "circumda tibi decorem et in sublime erigere et esto gloriosus et speciosis induere vestibus"
      en: "Clothe thyself with beauty, and set thyself up on high and be glorious, and put on goodly garments."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "disperge superbos furore tuo et respiciens omnem arrogantem humilia"
      en: "Scatter the proud in thy indignation, and behold every arrogant man, and humble him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "respice cunctos superbos et confunde eos et contere impios in loco suo"
      en: "Look on all that are proud, and confound them, and crush the wicked in their place."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "absconde eos in pulvere simul et facies eorum demerge in foveam"
      en: "Hide them in the dust together, and plunge their faces into the pit."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ego confitebor quod salvare te possit dextera tua"
      en: "Then I will confess that thy right hand is able to save thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ecce Behemoth quem feci tecum faenum quasi bos comedet"
      en: "Behold behemoth whom I made with thee, he eateth grass like an ox."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "fortitudo eius in lumbis eius et virtus illius in umbilicis ventris eius"
      en: "His strength is in his loins, and his force in the navel of his belly."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "constringit caudam suam quasi cedrum nervi testiculorum eius perplexi sunt"
      en: "He setteth up his tail like a cedar, the sinews of his testicles are wrapped together."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ossa eius velut fistulae aeris cartilago illius quasi lamminae ferreae"
      en: "His bones are like pipes of brass, his gristle like plates of iron."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ipse principium est viarum Dei qui fecit eum adplicabit gladium eius"
      en: "He is the beginning of the ways of God, who made him, he will apply his sword."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "huic montes herbas ferunt omnes bestiae agri ludent ibi"
      en: "To him the mountains bring forth grass : there all the beasts of the field shall play."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sub umbra dormit in secreto calami et locis humentibus"
      en: "He sleepeth under the shadow, in the covert of the reed, and in moist places."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "protegunt umbrae umbram eius circumdabunt eum salices torrentis"
      en: "The shades cover his shadow, the willows of the brook shall compass him about."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ecce absorbebit fluvium et non mirabitur habet fiduciam quod influat Iordanis in os eius"
      en: "Behold, he will drink up a river, and not wonder : and he trusteth that the Jordan may run into his mouth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "in oculis eius quasi hamo capiet eum et in sudibus perforabit nares eius"
      en: "In his eyes as with a hook he shall take him, and bore through his nostrils with stakes."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "an extrahere poteris Leviathan hamo et fune ligabis linguam eius"
      en: "Canst thou draw out the leviathan with a hook, or canst thou tie his tongue with a cord?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "numquid pones circulum in naribus eius et armilla perforabis maxillam eius"
      en: "Canst thou put a ring in his nose, or bore through his jaw with a buckle?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "numquid multiplicabit ad te preces aut loquetur tibi mollia"
      en: "Will he make many supplications to thee, or speak soft words to thee?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "numquid feriet tecum pactum et accipies eum servum sempiternum"
      en: "Will he make a covenant with thee, and wilt thou take him to be a servant for ever?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "numquid inludes ei quasi avi aut ligabis illum ancillis tuis"
      en: "Shalt thou play with him as with a bird, or tie him up for thy handmaids?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "concident eum amici divident illum negotiatores"
      en: "Shall friends cut him in pieces, shall merchants divide him?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "numquid implebis sagenas pelle eius et gurgustium piscium capite illius"
      en: "Wilt thou fill nets with his skin, and the cabins of fishes with his head?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "pone super eum manum tuam memento belli nec ultra addas loqui"
      en: "Lay thy hand upon him : remember the battle, and speak no more."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ecce spes eius frustrabitur eum et videntibus cunctis praecipitabitur"
      en: "Behold his hope shall fail him, and in the sight of all he shall be cast down."
    status: { la: verified, en: verified }
