# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: marc
chapter: 13
verses:
  - n: 1
    text:
      la: "Et cum egrederetur de templo, ait illi unus ex discipulis suis: Magister, aspice quales lapides, et quales structurae."
      en: "And as he was going out of the temple, one of his disciples said to him: Master, behold what manner of stones and what buildings are here."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et respondens Jesus, ait illi: Vides has omnes magnas aedificationes? Non relinquetur lapis super lapidem, qui non destruatur."
      en: "And Jesus answering, said to him: Seest thou all these great buildings? There shall not be left a stone upon a stone, that shall not be thrown down."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et cum sederet in monte Olivarum contra templum, interrogabant eum separatim Petrus, et Jacobus, et Joannes, et Andreas:"
      en: "And as he sat on the mount of Olivet over against the temple, Peter and James and John and Andrew asked him apart:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dic nobis, quando ista fient? et quod signum erit, quando haec omnia incipient consummari?"
      en: "Tell us, when shall these things be? and what shall be the sign when all these things shall begin to be fulfilled?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et respondens Jesus coepit dicere illis: Videte ne quid vos seducat:"
      en: "And Jesus answering, began to say to them, Take heed lest any man deceive you."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "multi enim venient in nomine meo, dicentes quia ego sum: et multos seducent."
      en: "For many shall come in my name, saying, I am he; and they shall deceive many."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum audieritis autem bella, et opiniones bellorum, ne timueritis: oportet enim haec fieri: sed nondum finis."
      en: "And when you shall hear of wars and rumours of wars, fear ye not. For such things must needs be, but the end is not yet."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Exsurget enim gens contra gentem, et regnum super regnum, et erunt terraemotus per loca, et fames. Initium dolorum haec."
      en: "For nation shall rise against nation and kingdom against kingdom, and there shall be earthquakes in divers places, and famines. These things are the beginning of sorrows."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Videte autem vosmetipsos. Tradent enim vos in consiliis, et in synagogis vapulabitis, et ante praesides et reges stabitis propter me, in testimonium illis."
      en: "But look to yourselves. For they shall deliver you up to councils, and in the synagogues you shall be beaten, and you shall stand before governors and kings for my sake, for a testimony unto them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et in omnes gentes primum oportet praedicari Evangelium."
      en: "And unto all nations the gospel must first be preached."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et cum duxerint vos tradentes, nolite praecogitare quid loquamini: sed quod datum vobis fuerit in illa hora, id loquimini: non enim vos estis loquentes, sed Spiritus Sanctus."
      en: "And when they shall lead you and deliver you up, be not thoughtful beforehand what you shall speak; but whatsoever shall be given you in that hour, that speak ye. For it is not you that speak, but the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tradet autem frater fratrem in mortem, et pater filium: et consurgent filii in parentes, et morte afficient eos."
      en: "And the brother shall betray his brother unto death, and the father his son; and children shall rise up against the parents, and shall work their death."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et eritis odio omnibus propter nomen meum. Qui autem sustinuerit in finem, hic salvus erit."
      en: "And you shall be hated by all men for my name's sake. But he that shall endure unto the end, he shall be saved."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cum autem videritis abominationem desolationis stantem, ubi non debet, qui legit, intelligat: tunc qui in Judaea sunt, fugiant in montes:"
      en: "And when you shall see the abomination of desolation, standing where it ought not: he that readeth let him understand: then let them that are in Judea, flee unto the mountains:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et qui super tectum, ne descendat in domum, nec introeat ut tollat quid de domo sua:"
      en: "And let him that is on the housetop, not go down into the house, nor enter therein to take any thing out of the house:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et qui in agro erit, non revertatur retro tollere vestimentum suum."
      en: "And let him that shall be in the field, not turn back to take up his garment."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Vae autem praegnantibus et nutrientibus in illis diebus."
      en: "And woe to them that are with child, and that give suck in those days."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Orate vero ut hieme non fiant."
      en: "But pray ye, that these things happen not in winter."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Erunt enim dies illi tribulationes tales quales non fuerunt ab initio creaturae, quam condidit Deus usque nunc, neque fient."
      en: "For in those days shall be such tribulations, as were not from the beginning of the creation which God created until now, neither shall be."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et nisi breviasset Dominus dies, non fuisset salva omnis caro: sed propter electos, quos elegit, breviavit dies."
      en: "And unless the Lord had shortened the days, no flesh should be saved: but for the sake of the elect which he hath chosen, he hath shortened the days."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et tunc si quis vobis dixerit: Ecce hic est Christus, ecce illic, ne credideritis."
      en: "And then if any man shall say to you, Lo, here is Christ; lo, he is here: do not believe."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Exsurgent enim pseudochristi et pseudoprophetae, et dabunt signa et portenta ad seducendos, si fieri potest, etiam electos."
      en: "For there will rise up false Christs and false prophets, and they shall shew signs and wonders, to seduce (if it were possible) even the elect."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Vos ergo videte: ecce praedixi vobis omnia."
      en: "Take you heed therefore; behold I have foretold you all things."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Sed in illis diebus, post tribulationem illam, sol contenebrabitur, et luna non dabit splendorem suum:"
      en: "But in those days, after that tribulation, the sun shall be darkened, and the moon shall not give her light."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et stellae caeli erunt decidentes, et virtutes, quae in caelis sunt, movebuntur."
      en: "And the stars of heaven shall be falling down, and the powers that are in heaven, shall be moved."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et tunc videbunt Filium hominis venientem in nubibus cum virtute multa et gloria."
      en: "And then shall they see the Son of man coming in the clouds, with great power and glory."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et tunc mittet angelos suos, et congregabit electos suos a quatuor ventis, a summo terrae usque ad summum caeli."
      en: "And then shall he send his angels, and shall gather together his elect from the four winds, from the uttermost part of the earth to the uttermost part of heaven."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "A ficu autem discite parabolam. Cum jam ramus ejus tener fuerit, et nata fuerint folia, cognoscitis quia in proximo sit aestas:"
      en: "Now of the fig tree learn ye a parable. When the branch thereof is now tender, and the leaves are come forth, you know that summer is very near."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sic et vos cum videritis haec fieri, scitote quod in proximo sit, in ostiis."
      en: "So you also when you shall see these things come to pass, know ye that it is very nigh, even at the doors."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Amen dico vobis, quoniam non transibit generatio haec, donec omnia ista fiant."
      en: "Amen I say to you, that this generation shall not pass, until all these things be done."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Caelum et terra transibunt, verba autem mea non transibunt."
      en: "Heaven and earth shall pass away, but my word shall not pass away."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "De die autem illo vel hora nemo scit, neque angeli in caelo, neque Filius, nisi Pater."
      en: "But of that day or hour no man knoweth, neither the angels in heaven, nor the Son, but the Father."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Videte, vigilate, et orate: nescitis enim quando tempus sit."
      en: "Take ye heed, watch and pray. For ye know not when the time is."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Sicut homo qui peregre profectus reliquit domum suam, et dedit servis suis potestatem cujusque operis, et janitori praecepit ut vigilet,"
      en: "Even as a man who going into a far country, left his house; and gave authority to his servants over every work, and commanded the porter to watch."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "vigilate ergo ( nescitis enim quando dominus domus veniat: sero, an media nocte, an galli cantu, an mane),"
      en: "Watch ye therefore, (for you know not when the lord of the house cometh: at even, or at midnight, or at the cockcrowing, or in the morning,)"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "ne, cum venerit repente, inveniat vos dormientes."
      en: "Lest coming on a sudden, he find you sleeping."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Quod autem vobis dico, omnibus dico: Vigilate."
      en: "And what I say to you, I say to all: Watch."
    status: { la: verified, en: verified }
