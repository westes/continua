# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 6
verses:
  - n: 1
    text:
      la: "Fili mi, si spoponderis pro amico tuo, defixisti apud extraneum manum tuam;"
      en: "My son, if thou be surety for thy friend, thou hast engaged fast thy hand to a stranger."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "illaqueatus es verbis oris tui, et captus propriis sermonibus."
      en: "Thou art ensnared with the words of thy mouth, and caught with thy own words."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Fac ergo quod dico, fili mi, et temetipsum libera, quia incidisti in manum proximi tui. Discurre, festina, suscita amicum tuum."
      en: "Do therefore, my son, what I say, and deliver thyself: because thou art fallen into the hand of thy neighbour. Run about, make haste, stir up thy friend:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ne dederis somnum oculis tuis, nec dormitent palpebrae tuae."
      en: "Give not sleep to thy eyes, neither let thy eyelids slumber."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Eruere quasi damula de manu, et quasi avis de manu aucupis."
      en: "Deliver thyself as a doe from the hand, and as a bird from the hand of the fowler."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Vade ad formicam, o piger, et considera vias ejus, et disce sapientiam."
      en: "Go to the ant, O sluggard, and consider her ways, and learn wisdom:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quae cum non habeat ducem, nec praeceptorem, nec principem,"
      en: "Which, although she hath no guide, nor master, nor captain,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "parat in aestate cibum sibi, et congregat in messe quod comedat."
      en: "Provideth her meat for herself in the summer, and gathereth her food in the harvest."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Usquequo, piger, dormies? quando consurges e somno tuo?"
      en: "How long wilt thou sleep, O sluggard? when wilt thou rise out of thy sleep?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Paululum dormies, paululum dormitabis, paululum conseres manus ut dormias;"
      en: "Thou wilt sleep a little, thou wilt slumber a little, thou wilt fold thy hands a little to sleep:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et veniet tibi quasi viator egestas, et pauperies quasi vir armatus. Si vero impiger fueris, veniet ut fons messis tua, et egestas longe fugiet a te."
      en: "And want shall come upon thee, as a traveller, and poverty as a man armed. But if thou be diligent, thy harvest shall come as a fountain, and want shall flee far from thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Homo apostata vir inutilis, graditur ore perverso;"
      en: "A man that is an apostate, an unprofitable man, walketh with a perverse mouth,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "annuit oculis, terit pede, digito loquitur,"
      en: "He winketh with the eyes, presseth with the foot, speaketh with the finger."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "pravo corde machinatur malum, et omni tempore jurgia seminat."
      en: "With a wicked heart he deviseth evil, and at all times he soweth discord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Huic extemplo veniet perditio sua, et subito conteretur, nec habebit ultra medicinam."
      en: "To such a one his destruction shall presently come, and he shall suddenly be destroyed, and shall no longer have any remedy."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sex sunt dies quae odit Dominus, et septimum detestatur anima ejus:"
      en: "Six things there are, which the Lord hateth, and the seventh his soul detesteth:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "oculos sublimes, linguam mendacem, manus effundentes innoxium sanguinem,"
      en: "Haughty eyes, a lying tongue, hands that shed innocent blood,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cor machinans cogitationes pessimas, pedes veloces ad currendum in malum,"
      en: "A heart that deviseth wicked plots, feet that are swift to run into mischief,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "proferentem mendacia testem fallacem, et eum qui seminat inter fratres discordias."
      en: "A deceitful witness that uttereth lies, and him that soweth discord among brethren."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Conserva, fili mi, praecepta patris tui, et ne dimittas legem matris tuae."
      en: "My son, keep the commandments of thy father, and forsake not the law of thy mother."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Liga ea in corde tuo jugiter, et circumda gutturi tuo."
      en: "Bind them in thy heart continually, and put them about thy neck."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cum ambulaveris, gradiantur tecum; cum dormieris, custodiant te: et evigilans loquere cum eis."
      en: "When thou walkest, let them go with thee: when thou sleepest, let them keep thee; and when thou awakest, talk with them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quia mandatum lucerna est, et lex lux, et via vitae increpatio disciplinae;"
      en: "Because the commandment is a lamp, and the law a light, and reproofs of instruction are the way of life:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ut custodiant te a muliere mala, et a blanda lingua extraneae."
      en: "That they may keep thee from the evil woman, and from the flattering tongue of the stranger."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Non concupiscat pulchritudinem ejus cor tuum, nec capiaris nutibus illius:"
      en: "Let not thy heart covet her beauty, be not caught with her winks:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "pretium enim scorti vix est unius panis, mulier autem viri pretiosam animam capit."
      en: "For the price of a harlot is scarce one loaf: but the woman catcheth the precious soul of a man."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Numquid potest homo abscondere ignem in sinu suo, ut vestimenta illius non ardeant?"
      en: "Can a man hide fire in his bosom, and his garments not burn?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "aut ambulare super prunas, ut non comburantur plantae ejus?"
      en: "Or can he walk upon hot coals, and his feet not be burnt?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Sic qui ingreditur ad mulierem proximi sui, non erit mundus cum tetigerit eam."
      en: "So he that goeth in to his neighbour's wife, shall not be clean when he shall touch her."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Non grandis est culpa cum quis furatus fuerit, furatur enim ut esurientem impleat animam;"
      en: "The fault is not so great when a man hath stolen: for he stealeth to fill his hungry soul:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "deprehensus quoque reddet septuplum, et omnem substantiam domus suae tradet."
      en: "And if he be taken he shall restore sevenfold, and shall give up all the substance of his house."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Qui autem adulter est, propter cordis inopiam perdet animam suam;"
      en: "But he that is an adulterer, for the folly of his heart shall destroy his own soul:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "turpitudinem et ignominiam congregat sibi, et opprobrium illius non delebitur:"
      en: "He gathereth to himself shame and dishonour, and his reproach shall not be blotted out:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "quia zelus et furor viri non parcet in die vindictae;"
      en: "Because the jealousy and rage of the husband will not spare in the day of revenge,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "nec acquiescet cujusquam precibus, nec suscipiet pro redemptione dona plurima."
      en: "Nor will he yield to any man's prayers, nor will he accept for satisfaction ever so many gifts."
    status: { la: verified, en: verified }
