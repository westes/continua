# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 29
verses:
  - n: 1
    text:
      la: "Locutusque est David rex ad omnem ecclesiam: Salomonem filium meum unum elegit Deus, adhuc puerum et tenellum: opus namque grande est, neque enim homini praeparatur habitatio, sed Deo."
      en: "And king David said to all the assembly: Solomon my son, whom alone God hath chosen, is as yet young and tender: and the work is great, for a house is prepared not for man, but for God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ego autem totis viribus meis praeparavi impensas domus Dei mei. Aurum ad vasa aurea, et argentum in argentea, aes in aenea, ferrum in ferrea, ligna ad lignea: et lapides onychinos, et quasi stibinos, et diversorum colorum, omnemque pretiosum lapidem, et marmor Parium abundantissime:"
      en: "And I with all my ability have prepared the expenses for the house of my God. Gold for vessels of gold, and silver for vessels of silver, brass for things of brass, iron for things of iron, wood for things of wood: and onyx stones, and stones like alabaster, and of divers colours, and all manner of precious stones, and marble of Paros in great abundance."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et super haec, quae obtuli in domum Dei mei de peculio meo aurum et argentum, do in templum Dei mei, exceptis his, quae praeparavi in aedem sanctam."
      en: "Now over and above the things which I have offered into the house of my God I give of my own proper goods, gold and silver for the temple of my God, beside what things I have prepared for the holy house."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Tria millia talenta auri de auro Ophir: et septem millia talentorum argenti probatissimi ad deaurandos parietes templi."
      en: "Three thousand talents of gold of the gold of Ophir: and seven thousand talents of refined silver, to overlay the walls of the temple."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ubicumque opus est aurum de auro, et ubicumque opus est argentum de argento, opera fiant per manus artificum: et si quis sponte offert, impleat manum suam hodie, et offerat quod voluerit Domino."
      en: "And gold for wheresoever there is need of gold: and silver for wheresoever there is need of silver, for the works to be made by the hands of the artificers: now if any man is willing to offer, let him fill his hand today, and offer what he pleaseth to the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Polliciti sunt itaque principes familiarum, et proceres tribuum Israel, tribuni quoque, et centuriones, et principes possessionum regis."
      en: "Then the heads of the families, and the princes of the tribes of Israel, and the captains of thousands, and of hundreds, and the overseers of the king's possessions promised,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dederuntque in opera domus Dei auri talenta quinque millia, et solidos decem millia: argenti talenta decem millia, et aeris talenta decem et octo millia: ferri quoque centum millia talentorum."
      en: "And they gave for the works of the house of the Lord, of gold, five thousand talents, and ten thousand solids: of silver ten thousand talents: and of brass eighteen thousand talents: and of iron a hundred thousand talents."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et apud quemcumque inventi sunt lapides, dederunt in thesauros domus Domini, per manum Jahiel Gersonitis."
      en: "And all they that had stones, gave them to the treasures of the house of the Lord, by the hand of Jahiel the Gersonite."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Laetatusque est populus, cum vota sponte promitterent: quia corde toto offerebant ea Domino: sed et David rex laetatus est gaudio magno."
      en: "And the people rejoiced, when they promised their offerings willingly: because they offered them to the Lord with all their heart: and David the king rejoiced also with a great joy."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et benedixit Domino coram universa multitudine, et ait: Benedictus es, Domine Deus Israel patris nostri ab aeterno in aeternum."
      en: "And he blessed the Lord before all the multitude, and he said: Blessed art thou, O Lord the God of Israel, our father from eternity to eternity."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Tua est, Domine, magnificentia, et potentia, et gloria, atque victoria: et tibi laus: cuncta enim quae in caelo sunt, et in terra, tua sunt: tuum, Domine, regnum, et tu es super omnes principes."
      en: "Thine, O Lord, is magnificence, and power, and glory, and victory: and to thee is praise: for all that is in heaven, and in earth, is thine: thine is the kingdom, O Lord, and thou art above all princes."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tuae divitiae, et tua est gloria: tu dominaris omnium: in manu tua virtus et potentia: in manu tua magnitudo, et imperium omnium."
      en: "Thine are riches, and thine is glory, thou hast dominion over all, in thy hand is power and might: in thy hand greatness, and the empire of all things."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nunc igitur Deus noster, confitemur tibi, et laudamus nomen tuum inclytum."
      en: "Now therefore our God we give thanks to thee, and we praise thy glorious name."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quis ego, et quis populus meus, ut possimus haec tibi universa promittere? Tua sunt omnia: et quae de manu tua accepimus, dedimus tibi."
      en: "Who am I, and what is my people, that we should be able to promise thee all these things? all things are thine: and we have given thee what we received of thy hand."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Peregrini enim sumus coram te, et advenae, sicut omnes patres nostri. Dies nostri quasi umbra super terram, et nulla est mora."
      en: "For we are sojourners before thee, and strangers, as were all our fathers. Our days upon earth are as a shadow, and there is no stay."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Domine Deus noster, omnis haec copia, quam paravimus ut aedificaretur domus nomini sancto tuo, de manu tua est, et tua sunt omnia."
      en: "O Lord our God, all this store that we have prepared to build thee a house for thy holy name, is from thy hand, and all things are thine."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Scio, Deus meus, quod probes corda, et simplicitatem diligas, unde et ego in simplicitate cordis mei laetus obtuli universa haec: et populum tuum, qui hic repertus est, vidi cum ingenti gaudio tibi offerre donaria."
      en: "I know my God that thou provest hearts, and lovest simplicity, wherefore I also in the simplicity of my heart, have joyfully offered all these things: and I have seen with great joy thy people, which are here present, offer thee their offerings."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Domine Deus Abraham, et Isaac, et Israel patrum nostrorum, custodi in aeternum hanc voluntatem cordis eorum, et semper in venerationem tui mens ista permaneat."
      en: "O Lord God of Abraham, and of Isaac, and of Israel our fathers, keep for ever this will of their heart, and let this mind remain always for the worship of thee."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Salomoni quoque filio meo da cor perfectum, ut custodiat mandata tua, testimonia tua, et caeremonias tuas, et faciat universa: et aedificet aedem, cujus impensas paravi."
      en: "And give to Solomon my son a perfect heart, that he may keep thy commandments, thy testimonies, and thy ceremonies, and do all things: and build the house, for which I have provided the charges."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Praecepit autem David universae ecclesiae: Benedicite Domino Deo nostro. Et benedixit omnis ecclesia Domino Deo patrum suorum: et inclinaverunt se, et adoraverunt Deum, et deinde regem."
      en: "And David commanded all the assembly: Bless ye the Lord our God. And all the assembly blessed the Lord the God of their fathers: and they bowed themselves and worshipped God, and then the king."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Immolaveruntque victimas Domino: et obtulerunt holocausta die sequenti, tauros mille, arietes mille, agnos mille cum libaminibus suis, et universo ritu abundantissime in omnem Israel."
      en: "And they sacrificed victims to the Lord: and they offered holocausts the next day, a thousand bullocks, a thousand rams, a thousand lambs, with their libations, and with every thing prescribed most abundantly for all Israel."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et comederunt, et biberunt coram Domino in die illo cum grandi laetitia. Et unxerunt secundo Salomonem filium David. Unxerunt autem eum Domino in principem, et Sadoc in pontificem."
      en: "And they ate, and drank before the Lord that day with great joy. And they anointed the second time Solomon the son of David. And they anointed him to the Lord to be prince, and Sadoc to be high priest."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Seditque Salomon super solium Domini in regem pro David patre suo, et cunctis placuit: et paruit illi omnis Israel."
      en: "And Solomon sat on the throne of the Lord as king instead of David his father, and he pleased all: and all Israel obeyed him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Sed et universi principes, et potentes, et cuncti filii regis David dederunt manum, et subjecti fuerunt Salomoni regi."
      en: "And all the princes, and men of power, and all the sons of king David gave their hand, and were subject to Solomon the king."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Magnificavit ergo Dominus Salomonem super omnem Israel: et dedit illi gloriam regni, qualem nullus habuit ante eum rex Israel."
      en: "And the Lord magnified Solomon over all Israel: and gave him the glory of a reign, such as no king of Israel had before him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Igitur David filius Isai regnavit super universum Israel."
      en: "So David the son of Isai reigned over all Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et dies, quibus regnavit super Israel, fuerunt quadraginta anni: in Hebron regnavit septem annis, et in Jerusalem annis triginta tribus."
      en: "And the days that he reigned over Israel, were forty years: in Hebron he reigned seven years, and in Jerusalem three and thirty years."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et mortuus est in senectute bona, plenus dierum, et divitiis, et gloria: et regnavit Salomon filius ejus pro eo."
      en: "And he died in a good age, full of days, and riches, and glory. And Solomon his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Gesta autem David regis priora et novissima scripta sunt in libro Samuelis videntis, et in libro Nathan prophetae, atque in volumine Gad videntis:"
      en: "Now the acts of king David first and last are written in the book of Samuel the seer, and in the book of Nathan the prophet, and in the book of Gad the seer:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "universique regni ejus, et fortitudinis, et temporum, quae transierunt sub eo, sive in Israel, sive in cunctis regnis terrarum."
      en: "And of all his reign, and his valour, and of the times that passed under him, either in Israel, or in all the kingdoms of the countries."
    status: { la: verified, en: verified }
