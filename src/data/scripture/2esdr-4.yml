# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2esdr
chapter: 4
verses:
  - n: 1
    text:
      la: "Factum est autem, cum audisset Sanaballat quod aedificaremus murum, iratus est valde: et motus nimis subsannavit Judaeos,"
      en: "And it came to pass, that when Sanaballat heard that we were building the wall he was angry: and being moved exceedingly he scoffed at the Jews."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et dixit coram fratribus suis, et frequentia Samaritanorum: Quid Judaei faciunt imbecilles? num dimittent eos gentes? num sacrificabunt, et complebunt in una die? numquid aedificare poterunt lapides de acervis pulveris, qui combusti sunt?"
      en: "And said before his brethren, and the multitude of the Samaritans: What are the silly Jews doing? Will the Gentiles let them alone? will they sacrifice and make an end in a day? are they able to raise stones out of the heaps of the rubbish, which are burnt?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sed et Tobias Ammanites proximus ejus, ait: Aedificent: si ascenderit vulpes, transiliet murum eorum lapideum."
      en: "Tobias also the Ammonite who was by him said: Let them build: if a fox go up, he will leap over their stone wall."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Audi, Deus noster, quia facti sumus despectui: converte opprobrium super caput eorum, et da eos in despectionem in terra captivitatis."
      en: "Hear thou our God, for we are despised: turn their reproach upon their own head, and give them to be despised in a land of captivity."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ne operias iniquitatem eorum, et peccatum eorum coram facie tua non deleatur, quia irriserunt aedificantes."
      en: "Cover not their iniquity, and let not their sin be blotted out from before thy face, because they have mocked thy builders."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Itaque aedificavimus murum, et conjunximus totum usque ad partem dimidiam: et provocatum est cor populi ad operandum."
      en: "So we built the wall, and joined it all together unto the half thereof: and the heart of the people was excited to work."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Factum est autem, cum audisset Sanaballat, et Tobias, et Arabes, et Ammanitae, et Azotii, quod obducta esset cicatrix muri Jerusalem, et quod coepissent interrupta concludi, irati sunt nimis."
      en: "And it came to pass, when Sanaballat, and Tobias, and the Arabians, and the Ammonites, and the Azotians heard that the walls of Jerusalem were made up, and the breaches began to be closed, that they were exceedingly angry."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et congregati sunt omnes pariter ut venirent, et pugnarent contra Jerusalem, et molirentur insidias."
      en: "And they all assembled themselves together, to come, and to fight against Jerusalem, and to prepare ambushes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et oravimus Deum nostrum, et posuimus custodes super murum die ac nocte contra eos."
      en: "And we prayed to our God, and set watchmen upon the wall day and night against them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixit autem Judas: Debilitata est fortitudo portantis, et humus nimia est, et nos non poterimus aedificare murum."
      en: "And Juda said: The strength of the bearer of burdens is decayed, and the rubbish is very much, and we shall not be able to build the wall."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixerunt hostes nostri: Nesciant, et ignorent donec veniamus in medium eorum, et interficiamus eos, et cessare faciamus opus."
      en: "And our enemies said: Let them not know, nor understand, till we come in the midst of them, and kill them, and cause the work to cease."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Factum est autem venientibus Judaeis, qui habitabant juxta eos, et dicentibus nobis per decem vices, ex omnibus locis quibus venerant ad nos,"
      en: "And it came to pass, that when the Jews that dwelt by them came and told us ten times, out of all the places from whence they came to us,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "statui in loco post murum per circuitum populum in ordinem cum gladiis suis, et lanceis, et arcubus."
      en: "I set the people in the place behind the wall round about in order, with their swords, and spears, and bows."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et perspexi atque surrexi: et aio ad optimates et magistratus, et ad reliquam partem vulgi: Nolite timere a facie eorum: Domini magni et terribilis mementote, et pugnate pro fratribus vestris, filiis vestris, et filiabus vestris, et uxoribus vestris, et domibus vestris."
      en: "And I looked and rose up: and I said to the chief men and the magistrates, and to the rest of the common people: be not afraid of them. Remember the Lord who is great and terrible, and fight for your brethren, your sons, and your daughters, and your wives, and your houses."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Factum est autem, cum audissent inimici nostri nuntiatum esse nobis, dissipavit Deus consilium eorum. Et reversi sumus omnes ad muros, unusquisque ad opus suum."
      en: "And it came to pass, when our enemies heard that the thing had been told us, that God defeated their counsel. And we returned all of us to the walls, every man to his work."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et factum est a die illa, media pars juvenum eorum faciebat opus, et media parata erat ad bellum, et lanceae, et scuta, et arcus, et loricae, et principes post eos in omni domo Juda,"
      en: "And it came to pass from that day forward, that half of their young men did the work, and half were ready for to fight, with spears, and shields, and bows, and coats of mail, and the rulers were behind them in all the house of Juda."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "aedificantium in muro, et portantium onera, et imponentium: una manu sua faciebat opus, et altera tenebat gladium:"
      en: "Of them that built on the wall and that carried burdens, and that laded: with one of his hands he did the work, and with the other he held a sword."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "aedificentium enim unusquisque gladio erat accinctus renes. Et aedificabant, et clangebant buccina juxta me."
      en: "For every one of the builders was girded with a sword about his reins. And they built, and sounded with a trumpet by me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et dixi ad optimates, et ad magistratus, et ad reliquam partem vulgi: Opus grande est et latum, et nos separati sumus in muro procul alter ab altero:"
      en: "And I said to the nobles, and to the magistrates, and to the rest of the common people: The work is great and wide, and we are separated on the wall one far from another:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in loco quocumque audieritis clangorem tubae, illuc concurrite ad nos: Deus noster pugnabit pro nobis."
      en: "In what place soever you shall hear the sound of the trumpet, run all thither unto us: our God will fight for us."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et nos ipsi faciamus opus: et media pars nostrum teneat lanceas ab ascensu aurorae donec egrediantur astra."
      en: "And let us do the work: and let one half of us hold our spears from the rising of the morning, till the stars appear."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "In tempore quoque illo dixi populo: Unusquisque cum puero suo maneat in medio Jerusalem, et sint nobis vices per noctem et diem ad operandum."
      en: "At that time also I said to the people: Let every one with his servant stay in the midst of Jerusalem, and let us take our turns in the night, and by day, to work."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ego autem et fratres mei, et pueri mei, et custodes, qui erant post me, non deponebamus vestimenta nostra: unusquisque tantum nudabatur ad baptismum."
      en: "Now I and my brethren, and my servants, and the watchmen that followed me, did not put off our clothes: only every man stripped himself when he was to be washed."
    status: { la: verified, en: verified }
