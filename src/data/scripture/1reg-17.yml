# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 17
verses:
  - n: 1
    text:
      la: "Congregantes autem Philisthiim agmina sua in praelium, convenerunt in Socho Judae: et castrametati sunt inter Socho et Azeca in finibus Dommim."
      en: "Now the Philistines gathering together their troops to battle, assembled at Socho of Juda, and camped between Socho and Azeca in the borders of Dommim."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Porro Saul et filii Israel congregati venerunt in Vallem terebinthi, et direxerunt aciem ad pugnandum contra Philisthiim."
      en: "And Saul and the children of Israel being gathered together came to the valley of Terebinth, and they set the army in array to fight against the Philistines."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et Philisthiim stabant super montem ex parte hac, et Israel stabat supra montem ex altera parte: vallisque erat inter eos."
      en: "And the Philistines stood on a mountain on the one side, and Israel stood on a mountain on the other side: and there was a valley between them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et egressus est vir spurius de castris Philisthinorum nomine Goliath, de Geth, altitudinis sex cubitorum et palmi:"
      en: "And there went out a man baseborn from the camp of the Philistines named Goliath, of Geth, whose height was six cubits and a span:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et cassis aerea super caput ejus, et lorica squamata induebatur. Porro pondus loricae ejus, quinque millia siclorum aeris erat:"
      en: "And he had a helmet of brass upon his head, and he was clothed with a coat of mail with scales, and the weight of his coat of mail was five thousand sicles of brass:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ocreas aereas habebat in cruribus: et clypeus aereus tegebat humeros ejus."
      en: "And he had greaves of brass on his legs, and a buckler of brass covered his shoulders."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Hastile autem hastae ejus erat quasi liciatorium texentium: ipsum autem ferrum hastae ejus sexcentos siclos habebat ferri: et armiger ejus antecedebat eum."
      en: "And the staff of his spear was like a weaver's beam, and the head of his spear weighed six hundred sicles of iron: and his armourbearer went before him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Stansque clamabat adversum phalangas Israel, et dicebat eis: Quare venistis parati ad praelium? Numquid ego non sum Philisthaeus, et vos servi Saul? Eligite ex vobis virum, et descendat ad singulare certamen."
      en: "And standing he cried out to the bands of Israel, and said to them: Why are you come out prepared to fight? am not I a Philistine, and you the servants of Saul? Choose out a man of you, and let him come down and fight hand to hand."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si quiverit pugnare mecum, et percusserit me, erimus vobis servi: si autem ego praevaluero, et percussero eum, vos servi eritis, et servietis nobis."
      en: "If he be able to fight with me, and kill me, we will be servants to you: but if I prevail against him, and kill him, you shall be servants, and shall serve us."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et aiebat Philisthaeus: Ego exprobravi agminibus Israel hodie: date mihi virum, et ineat mecum singulare certamen."
      en: "And the Philistine said: I have defied the bands of Israel this day: Give me a man, and let him fight with me hand to hand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Audiens autem Saul, et omnes Israelitae, sermones Philisthaei hujuscemodi, stupebant, et metuebant nimis."
      en: "And Saul and all the Israelites hearing these words of the Philistine were dismayed, and greatly afraid."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "David autem erat filius viri Ephrathaei, de quo supra dictum est, de Bethlehem Juda, cui nomen erat Isai, qui habebat octo filios, et erat vir in diebus Saul senex, et grandaevus inter viros."
      en: "Now David was the son of that Ephrathite of Bethlehem Juda before mentioned, whose name was Isai, who had eight sons, and was an old man in the days of Saul, and of great age among men."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Abierunt autem tres filii ejus majores post Saul in praelium: et nomina trium filiorum ejus, qui perrexerunt ad bellum, Eliab primogenitus, et secundus Abinadab, tertiusque Samma."
      en: "And his three eldest sons followed Saul to the battle: and the names of his three sons that went to the battle, were Eliab the firstborn, and the second Abinadab, and the third Samma."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "David autem erat minimus. Tribus ergo majoribus secutis Saulem,"
      en: "But David was the youngest. So the three eldest having followed Saul,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "abiit David, et reversus est a Saul, ut pasceret gregem patris sui in Bethlehem."
      en: "David went, and returned from Saul, to feed his father's flock at Bethlehem."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Procedebat vero Philisthaeus mane et vespere, et stabat quadraginta diebus."
      en: "Now the Philistine came out morning and evening, and presented himself forty days."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixit autem Isai ad David filium suum: Accipe fratribus tuis ephi polentae, et decem panes istos, et curre in castra ad fratres tuos,"
      en: "And Isai said to David his son: Take for thy brethren an ephi of frumenty, and these ten loaves, and run to the camp to thy brethren."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et decem formellas casei has deferes ad tribunum: et fratres tuos visitabis, si recte agant: et cum quibus ordinati sunt, disce."
      en: "And carry these ten little cheeses to the tribune: and go see thy brethren, if they are well: and learn with whom they are placed."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Saul autem, et illi, et omnes filii Israel, in Valle terebinthi pugnabant adversum Philisthiim."
      en: "But Saul, and they, and all the children of Israel were in the valley of Terebinth fighting against the Philistines."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Surrexit itaque David mane, et commendavit gregem custodi: et onustus abiit, sicut praeceperat ei Isai. Et venit ad locum Magala, et ad exercitum, qui egressus ad pugnam vociferatus erat in certamine."
      en: "David therefore arose in the morning, and gave the charge of the flock to the keeper: and went away loaded as Isai had commanded him. And he came to the place of Magala, and to the army, which was going out to fight, and shouted for the battle."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Direxerat enim aciem Israel, sed et Philisthiim ex adverso fuerant praeparati."
      en: "For Israel had put themselves in array, and the Philistines who stood against them were prepared."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Derelinquens ergo David vasa quae attulerat, sub manu custodis ad sarcinas, cucurrit ad locum certaminis, et interrogabat si omnia recte agerentur erga fratres suos."
      en: "And David leaving the vessels which he had brought, under the care of the keeper of the baggage, ran to the place of the battle and asked if all things went well with his brethren."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cumque adhuc ille loqueretur eis, apparuit vir ille spurius ascendens, Goliath nomine Philisthaeus, de Geth, de castris Philisthinorum: et loquente eo haec eadem verba audivit David."
      en: "And as he talked with them, that baseborn man whose name was Goliath, the Philistine, of Geth, shewed himself coming up from the camp of the Philistines: and he spoke according to the same words, and David heard them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Omnes autem Israelitae, cum vidissent virum, fugerunt a facie ejus, timentes eum valde."
      en: "And all the Israelites when they saw the man, fled from his face, fearing him exceedingly."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et dixit unus quispiam de Israel: Num vidistis virum hunc, qui ascendit? ad exprobrandum enim Israeli ascendit. Virum ergo, qui percusserit eum, ditabit rex divitiis magnis, et filiam suam dabit ei, et domum patris ejus faciet absque tributo in Israel."
      en: "And some one of Israel said: Have you seen this man that is come up, for he is come up to defy Israel. And the man that shall slay him, the king will enrich with great riches, and will give him his daughter, and will make his father's house free from tribute in Israel."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et ait David ad viros, qui stabant secum, dicens: Quid dabitur viro, qui percusserit Philisthaeum hunc, et tulerit opprobrium de Israel? quis enim est hic Philisthaeus incircumcisus, qui exprobravit acies Dei viventis?"
      en: "And David spoke to the men that stood by him, saying: What shall be given to the man that shall kill this Philistine, and shall take away the reproach from Israel? for who is this uncircumcised Philistine, that he should defy the armies of the living God?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Referebat autem ei populus eumdem sermonem, dicens: Haec dabuntur viro, qui percusserit eum."
      en: "And the people answered him the same words saying: These things shall be given to the man that shall slay him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quod cum audisset Eliab frater ejus major, loquente eo cum aliis, iratus est contra David, et ait: Quare venisti, et quare dereliquisti pauculas oves illas in deserto? Ego novi superbiam tuam, et nequitiam cordis tui: quia ut videres praelium, descendisti."
      en: "Now when Eliab his eldest brother heard this, when he was speaking with others, he was angry with David, and said: Why camest thou hither? and why didst thou leave those few sheep in the desert? I know thy pride, and the wickedness of thy heart: that thou art come down to see the battle."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et dixit David: Quid feci? numquid non verbum est?"
      en: "And David said: What have I done? is there not cause to speak?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et declinavit paululum ab eo ad alium: dixitque eumdem sermonem. Et respondit ei populus verbum sicut prius."
      en: "And he turned a little aside from him to another: and said the same word. And the people answered him as before."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Audita sunt autem verba, quae locutus est David, et annuntiata in conspectu Saul."
      en: "And the words which David spoke were heard, and were rehearsed before Saul."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ad quem cum fuisset adductus, locutus est ei: Non concidat cor cujusquam in eo: ego servus tuus vadam, et pugnabo adversus Philisthaeum."
      en: "And when he was brought to him, he said to him: Let not any man's heart be dismayed in him: I thy servant will go, and will fight against the Philistine."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et ait Saul ad David: Non vales resistere Philisthaeo isti nec pugnare adversus eum: quia puer es, hic autem vir bellator est ab adolescentia sua."
      en: "And Saul said to David: Thou art not able to withstand this Philistine, nor to fight against him: for thou art but a boy, but he is a warrior from his youth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Dixitque David ad Saul: Pascebat servus tuus patris sui gregem, et veniebat leo, vel ursus, et tollebat arietem de medio gregis:"
      en: "And David said to Saul: Thy servant kept his father's sheep, and there came a lion, or a bear, and took a ram out of the midst of the flock:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et persequebar eos, et percutiebam, eruebamque de ore eorum: et illi consurgebant adversum me, et apprehendebam mentum eorum, et suffocabam, interficiebamque eos."
      en: "And I pursued after them, and struck them, and delivered it out of their mouth: and they rose up against me, and I caught them by the throat, and I strangled and killed them."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Nam et leonem et ursum interfeci ego servus tuus: erit igitur et Philisthaeus hic incircumcisus, quasi unus ex eis. Nunc vadam, et auferam opprobrium populi: quoniam quis est iste Philisthaeus incircumcisus, qui ausus est maledicere exercitui Dei viventis?"
      en: "For I thy servant have killed both a lion and a bear: and this uncircumcised Philistine shall be also as one of them. I will go now, and take away the reproach of the people: for who is this uncircumcised Philistine, who hath dared to curse the army of the living God?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et ait David: Dominus qui eripuit me de manu leonis, et de manu ursi, ipse me liberabit de manu Philisthaei hujus. Dixit autem Saul ad David: Vade, et Dominus tecum sit."
      en: "And David said: The Lord who delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine. And Saul said to David: Go, and the Lord be with thee."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et induit Saul David vestimentis suis, et imposuit galeam aeream super caput ejus, et vestivit eum lorica."
      en: "And Saul clothed David with his garments, and put a helmet of brass upon his head, and armed him with a coat of mail."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Accinctus ergo David gladio ejus super vestem suam, coepit tentare si armatus posset incedere: non enim habebat consuetudinem. Dixitque David ad Saul: Non possum sic incedere, quia non usum habeo. Et deposuit ea,"
      en: "And David having girded his sword upon his armour, began to try if he could walk in armour: for he was not accustomed to it. And David said to Saul: I cannot go thus, for I am not used to it. And he laid them off,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et tulit baculum suum, quem semper habebat in manibus: et elegit sibi quinque limpidissimos lapides de torrente, et misit eos in peram pastoralem, quam habebat secum, et fundam manu tulit: et processit adversum Philisthaeum."
      en: "And he took his staff, which he had always in his hands: and chose him five smooth stones out of the brook, and put them into the shepherd's scrip, which he had with him, and he took a sling in his hand, and went forth against the Philistine."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Ibat autem Philisthaeus incedens, et appropinquans adversum David, et armiger ejus ante eum."
      en: "And the Philistine came on, and drew nigh against David, and his armourbearer before him."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Cumque inspexisset Philisthaeus, et vidisset David, despexit eum. Erat enim adolescens, rufus, et pulcher aspectu."
      en: "And when the Philistine looked, and beheld David, he despised him. For he was a young man, ruddy, and of a comely countenance."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et dixit Philisthaeus ad David: Numquid ego canis sum, quod tu venis ad me cum baculo? Et maledixit Philisthaeus David in diis suis:"
      en: "And the Philistine said to David: Am I a dog, that thou comest to me with a staff? And the Philistine cursed David by his gods."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "dixitque ad David: Veni ad me, et dabo carnes tuas volatilibus caeli et bestiis terrae."
      en: "And he said to David: Come to me, and I will give thy flesh to the birds of the air, and to the beasts of the earth."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Dixit autem David ad Philisthaeum: Tu venis ad me cum gladio, et hasta, et clypeo: ego autem venio ad te in nomine Domini exercituum, Dei agminum Israel, quibus exprobrasti"
      en: "And David said to the Philistine: Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the Lord of hosts, the God of the armies of Israel, which thou hast defied."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "hodie, et dabit te Dominus in manu mea, et percutiam te, et auferam caput tuum a te: et dabo cadavera castrorum Philisthiim hodie volatilibus caeli, et bestiis terrae: ut sciat omnis terra quia est Deus in Israel:"
      en: "This day, and the Lord will deliver thee into my hand, and I will slay thee, and take away thy head from thee: and I will give the carcasses of the army of the Philistines this day to the birds of the air, and to the beasts of the earth: that all the earth may know that there is a God in Israel."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et noverit universa ecclesia haec, quia non in gladio, nec in hasta salvat Dominus: ipsius enim est bellum, et tradet vos in manus nostras."
      en: "And all this assembly shall know, that the Lord saveth not with sword and spear: for it is his battle, and he will deliver you into our hands."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Cum ergo surrexisset Philisthaeus, et veniret, et appropinquaret contra David, festinavit David et cucurrit ad pugnam ex adverso Philisthaei."
      en: "And when the Philistine arose and was coming, and drew nigh to meet David, David made haste, and ran to the fight to meet the Philistine."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et misit manum suam in peram, tulitque unum lapidem, et funda jecit, et circumducens percussit Philisthaeum in fronte: et infixus est lapis in fronte ejus, et cecidit in faciem suam super terram."
      en: "And he put his hand into his scrip, and took a stone, and cast it with the sling, and fetching it about struck the Philistine in the forehead: and the stone was fixed in his forehead, and he fell on his face upon the earth."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Praevaluitque David adversum Philisthaeum in funda et lapide, percussumque Philisthaeum interfecit. Cumque gladium non haberet in manu David,"
      en: "And David prevailed over the Philistine, with a sling and a stone, and he struck, and slew the Philistine. And as David had no sword in his hand,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "cucurrit, et stetit super Philisthaeum, et tulit gladium ejus, et eduxit eum de vagina sua: et interfecit eum, praeciditque caput ejus. Videntes autem Philisthiim quod mortuus esset fortissimus eorum, fugerunt."
      en: "He ran, and stood over the Philistine, and took his sword, and drew it out of the sheath, and slew him, and cut off his head. And the Philistines seeing that their champion was dead, fled away."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Et consurgentes viri Israel et Juda vociferati sunt, et persecuti sunt Philisthaeos usque dum venirent in vallem, et usque ad portas Accaron, cecideruntque vulnerati de Philisthiim in via Saraim, et usque ad Geth, et usque ad Accaron."
      en: "And the men of Israel and Juda rising up shouted, and pursued after the Philistines till they came to the valley and to the gates of Accaron, and there fell many wounded of the Philistines in the way of Saraim, and as far as Geth, and as far as Accaron."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Et revertentes filii Israel postquam persecuti fuerant Philisthaeos, invaserunt castra eorum."
      en: "And the children of Israel returning, after they had pursued the Philistines, fell upon their camp."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Assumens autem David caput Philisthaei, attulit illud in Jerusalem: arma vero ejus posuit in tabernaculo suo."
      en: "And David taking the head of the Philistine brought it to Jerusalem: but his armour he put in his tent."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Eo autem tempore, quo viderat Saul David egredientem contra Philisthaeum, ait ad Abner principem militiae: De qua stirpe descendit hic adolescens, Abner? Dixitque Abner: Vivit anima tua, rex, si novi."
      en: "Now at the time that Saul saw David going out against the Philistines, he said to Abner the captain of the army: Of what family is this young man descended, Abner? And Abner said: As thy soul liveth, O king, I know not."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Et ait rex: Interroga tu, cujus filius sit iste puer."
      en: "And the king said: Inquire thou, whose son this man is."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Cumque regressus esset David, percusso Philisthaeo, tulit eum Abner, et introduxit coram Saule, caput Philisthaei habentem in manu."
      en: "And when David was returned, after the Philistine was slain, Abner took him, and brought him in before Saul, with the head of the Philistine in his hand."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Et ait ad eum Saul: De qua progenie es, o adolescens? Dixitque David: Filius servi tui Isai Bethlehemitae ego sum."
      en: "And Saul said to him: Young man, of what family art thou? And David said: I am the son of thy servant Isai the Bethlehemite."
    status: { la: verified, en: verified }
