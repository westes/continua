# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 46
verses:
  - n: 1
    text:
      la: "Haec dicit Dominus Deus: Porta atrii interioris, quae respicit ad orientem, erit clausa sex diebus in quibus opus fit: die autem sabbati aperietur, sed in die calendarum aperietur."
      en: "Thus saith the Lord God: The gate of the inner court that looketh toward the east, shall be shut the six days, on which work is done; but on the sabbath day it shall be opened, yea and on the day of the new moon it shall be opened."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et intrabit princeps per viam vestibuli portae deforis, et stabit in limine portae: et facient sacerdotes holocaustum ejus, et pacifica ejus: et adorabit super limen portae, et egredietur: porta autem non claudetur usque ad vesperam."
      en: "And the prince shall enter by the way of the porch of the gate from without, and he shall stand at the threshold of the gate: and the priests shall offer his holocaust, and his peace offerings: and he shall adore upon the threshold of the gate, and shall go out: but the gate shall not be shut till the evening."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et adorabit populus terrae ad ostium portae illius in sabbatis et in calendis coram Domino."
      en: "And the people of the land shall adore at the door of that gate before the Lord on the sabbaths, and on the new moons."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Holocaustum autem hoc offeret princeps Domino: in die sabbati, sex agnos immaculatos, et arietem immaculatum,"
      en: "And the holocaust that the prince shall offer to the Lord on the sabbath day, shall be six lambs without blemish, and a ram without blemish."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et sacrificium ephi per arietem, in agnis autem sacrificium quod dederit manus ejus, et olei hin per singula ephi."
      en: "And the sacrifice of an ephi for a ram: but for the lambs what sacrifice his hand shall allow: and a hin of oil for every ephi."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In die autem calendarum vitulum de armento immaculatum, et sex agni et arietes immaculati erunt."
      en: "And on the day of the new moon a calf of the herd without blemish: and the six lambs, and the rams shall be without blemish."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ephi per vitulum, ephi quoque per arietem faciet sacrificium: de agnis autem, sicut invenerit manus ejus, et olei hin per singula ephi."
      en: "And he shall offer in sacrifice an ephi for a calf, an ephi also for a ram: but for the lambs, as his hand shall find: and a hin of oil for every ephi."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque ingressurus est princeps, per viam vestibuli portae ingrediatur, et per eamdem viam exeat."
      en: "And when the prince is to go in, let him go in by the way of the porch of the gate, and let him go out the same way."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et cum intrabit populus terrae in conspectu Domini in solemnitatibus, qui ingreditur per portam aquilonis, ut adoret, egrediatur per viam portae meridianae: porro qui ingreditur per viam portae meridianae, egrediatur per viam portae aquilonis. Non revertetur per viam portae per quam ingressus est, sed e regione illius egredietur."
      en: "But when the people of the land shall go in before the Lord in the solemn feasts, he that goeth in by the north gate to adore, shall go out by the way of the south gate: and he that goeth in by the way of the south gate, shall go out by the way of the north gate: he shall not return by the way of the gate whereby he came in, but shall go out at that over against it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Princeps autem in medio eorum, cum ingredientibus indredietur, et cum egredientibus egredietur."
      en: "And the prince in the midst of them, shall go in when they go in, and go out when they go out."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et in nundinis, et in solemnitatibus, erit sacrificium ephi per vitulum, et ephi per arietem: agnis autem erit sacrificium sicut invenerit manus ejus, et olei hin per singula ephi."
      en: "And in the fairs, and in the solemnities there shall be the sacrifice of an ephi to a calf, and an ephi to a ram: and to the lambs, the sacrifice shall be as his hand shall find: and a hin of oil to every ephi."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum autem fecerit princeps spontaneum holocaustum, aut pacifica voluntaria Domino, aperietur ei porta quae respicit ad orientem, et faciet holocaustum suum et pacifica sua, sicut fieri solet in die sabbati: et egredietur, claudeturque porta postquam exierit."
      en: "But when the prince shall offer a voluntary holocaust, or voluntary peace offerings to the Lord: the gate that looketh towards the east shall be opened to him, and he shall offer his holocaust, and his peace offerings, as it is wont to be done on the sabbath day: and he shall go out, and the gate shall be shut after he is gone forth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et agnum ejusdem anni immaculatum faciet holocaustum quotidie Domino: semper mane faciet illud."
      en: "And he shall offer every day for a holocaust to the Lord, a lamb of the same year without blemish: he shall offer it always in the morning."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et faciet sacrificium super eo cata mane mane sextam partem ephi, et de oleo tertiam partem hin, ut misceatur similae: sacrificium Domino legitimum, juge atque perpetuum."
      en: "And he shall offer the sacrifice for it morning by morning, the sixth part of an ephi: and the third part of a hin of oil be mingled with the fine flour: a sacrifice to the Lord by ordinance continual and everlasting."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Faciet agnum, et sacrificium, et oleum cata mane mane, holocaustum sempiternum."
      en: "He shall offer the lamb, and the sacrifice, and the oil morning by morning: an everlasting holocaust."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Haec dicit Dominuis Deus: Si dederit princeps donum alicui de filiis suis, haereditas ejus filiorum suorum erit: possidebunt eam haereditarie."
      en: "Thus saith the Lord God: If the prince give a gift to any of his sons: the inheritance of it shall go to his children, they shall possess it by inheritance."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Si autem dederit legatum de haereditate sua uni servorum suorum, erit illius usque ad annum remissionis, et revertetur ad principem: haereditas autem ejus filiis ejus erit."
      en: "But if he give a legacy out of his inheritance to one of his servants, it shall be his until the year of release, and it shall return to the prince: but his inheritance shall go to his sons."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et non accipiet princeps de haereditate populi per violentiam, et de possessione eorum: sed de possessione sua haereditatem dabit filiis suis, ut non dispergatur populus meus unusquisque a possessione sua."
      en: "And the prince shall not take of the people's inheritance by violence, nor of their possession: but out of his own possession he shall give an inheritance to his sons: that my people be not dispersed every man from his possession."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et introduxit me per ingressum qui erat ex latere portae, in gazophylacia sanctuarii ad sacerdotes, quae respiciebant ad aquilonem: et erat ibi locus vergens ad occidentem."
      en: "And he brought me in by the entry that was at the side of the gate, into the chambers of the sanctuary that were for the priests, which looked toward the north. And there was a place bending to the west."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et dixit ad me: Iste est locus ubi coquent sacerdotes pro peccato et pro delicto, ubi coquent sacrificium, ut non efferant in atrium exterius, et sanctificetur populus."
      en: "And he said to me: This is the place where the priests shall boil the sin offering, and the trespass offering: where they shall dress the sacrifice, that they may not bring it out into the outward court, and the people be sanctified."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et eduxit me in atrium exterius, et circumduxit me per quatuor angulos atrii: et ecce atriolum erat in angulo atrii, atriola singula per angulos atrii."
      en: "And he brought me into the outward court, and he led me about by the four corners of the court: and behold there was a little court in the corner of the court, to every corner of the court there was a little court."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "In quatuor angulis atrii atriola disposita, quadraginta cubitorum per longum, et triginta per latum: mensurae unius quatuor erant."
      en: "In the four corners of the court were little courts disposed, forty cubits long, and thirty broad, all the four were of one measure."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et paries per circuitum ambiens quatuor atriola: et culinae fabricatae erant subter porticus per gyrum."
      en: "And there was a wall round about compassing the four little courts, and there were kitchens built under the rows round about."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et dixit ad me: Haec est domus culinarum, in qua coquent ministri domus Domini victimas populi."
      en: "And he said to me: This is the house of the kitchens wherein the ministers of the house of the Lord shall boil the victims of the people."
    status: { la: verified, en: verified }
