# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 25
verses:
  - n: 1
    text:
      la: "Tunc simile erit regnum caelorum decem virginibus: quae accipientes lampades suas exierunt obviam sponso et sponsae."
      en: "Then shall the kingdom of heaven be like to ten virgins, who taking their lamps went out to meet the bridegroom and the bride."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quinque autem ex eis erant fatuae, et quinque prudentes:"
      en: "And five of them were foolish, and five wise."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sed quinque fatuae, acceptis lampadibus, non sumpserunt oleum secum:"
      en: "But the five foolish, having taken their lamps, did not take oil with them:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "prudentes vero acceperunt oleum in vasis suis cum lampadibus."
      en: "But the wise took oil in their vessels with the lamps."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Moram autem faciente sponso, dormitaverunt omnes et dormierunt."
      en: "And the bridegroom tarrying, they all slumbered and slept."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Media autem nocte clamor factus est: Ecce sponsus venit, exite obviam ei."
      en: "And at midnight there was a cry made: Behold the bridegroom cometh, go ye forth to meet him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tunc surrexerunt omnes virgines illae, et ornaverunt lampades suas."
      en: "Then all those virgins arose and trimmed their lamps."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Fatuae autem sapientibus dixerunt: Date nobis de oleo vestro, quia lampades nostrae extinguuntur."
      en: "And the foolish said to the wise: Give us of your oil, for our lamps are gone out."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Responderunt prudentes, dicentes: Ne forte non sufficiat nobis, et vobis, ite potius ad vendentes, et emite vobis."
      en: "The wise answered, saying: Lest perhaps there be not enough for us and for you, go ye rather to them that sell, and buy for yourselves."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dum autem irent emere, venit sponsus: et quae paratae erant, intraverunt cum eo ad nuptias, et clausa est janua."
      en: "Now whilst they went to buy, the bridegroom came: and they that were ready, went in with him to the marriage, and the door was shut."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Novissime vero veniunt et reliquae virgines, dicentes: Domine, domine, aperi nobis."
      en: "But at last come also the other virgins, saying: Lord, Lord, open to us."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "At ille respondens, ait: Amen dico vobis, nescio vos."
      en: "But he answering said: Amen I say to you, I know you not."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Vigilate itaque, quia nescitis diem, neque horam."
      en: "Watch ye therefore, because you know not the day nor the hour."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sicut enim homo peregre proficiscens, vocavit servos suos, et tradidit illis bona sua."
      en: "For even as a man going into a far country, called his servants, and delivered to them his goods;"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et uni dedit quinque talenta, alii autem duo, alii vero unum, unicuique secundum propriam virtutem: et profectus est statim."
      en: "And to one he gave five talents, and to another two, and to another one, to every one according to his proper ability: and immediately he took his journey."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Abiit autem qui quinque talenta acceperat, et operatus est in eis, et lucratus est alia quinque."
      en: "And he that had received the five talents, went his way, and traded with the same, and gained other five."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Similiter et qui duo acceperat, lucratus est alia duo."
      en: "And in like manner he that had received the two, gained other two."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui autem unum acceperat, abiens fodit in terram, et abscondit pecuniam domini sui."
      en: "But he that had received the one, going his way digged into the earth, and hid his lord's money."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Post multum vero temporis venit dominus servorum illorum, et posuit rationem cum eis."
      en: "But after a long time the lord of those servants came, and reckoned with them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et accedens qui quinque talenta acceperat, obtulit alia quinque talenta, dicens: Domine, quinque talenta tradidisti mihi, ecce alia quinque superlucratus sum."
      en: "And he that had received the five talents coming, brought other five talents, saying: Lord, thou didst deliver to me five talents, behold I have gained other five over and above."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ait illi dominus ejus: Euge serve bone, et fidelis: quia super pauca fuisti fidelis, super multa te constituam; intra in gaudium domini tui."
      en: "His lord said to him: Well done, good and faithful servant, because thou hast been faithful over a few things, I will place thee over many things: enter thou into the joy of thy lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Accessit autem et qui duo talenta acceperat, et ait: Domine, duo talenta tradidisti mihi, ecce alia duo lucratus sum."
      en: "And he also that had received the two talents came and said: Lord, thou deliveredst two talents to me: behold I have gained other two."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ait illi dominus ejus: Euge serve bone, et fidelis: quia super pauca fuisti fidelis, super multa te constituam; intra in gaudium domini tui."
      en: "His lord said to him: Well done, good and faithful servant: because thou hast been faithful over a few things, I will place thee over many things: enter thou into the joy of thy lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Accedens autem et qui unum talentum acceperat, ait: Domine, scio quia homo durus es; metis ubi non seminasti, et congregas ubi non sparsisti:"
      en: "But he that had received the one talent, came and said: Lord, I know that thou art a hard man; thou reapest where thou hast not sown, and gatherest where thou hast not strewed."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et timens abii, et abscondi talentum tuum in terra: ecce habes quod tuum est."
      en: "And being afraid I went and hid thy talent in the earth: behold here thou hast that which is thine."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Respondens autem dominus ejus, dixit ei: Serve male, et piger, sciebas quia meto ubi non semino, et congrego ubi non sparsi:"
      en: "And his lord answering, said to him: Wicked and slothful servant, thou knewest that I reap where I sow not, and gather where I have not strewed:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "oportuit ergo te committere pecuniam meam numulariis, et veniens ego recepissem utique quod meum est cum usura."
      en: "Thou oughtest therefore to have committed my money to the bankers, and at my coming I should have received my own with usury."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Tollite itaque ab eo talentum, et date ei qui habet decem talenta:"
      en: "Take ye away therefore the talent from him, and give it to him that hath ten talents."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "omni enim habenti dabitur, et abundabit: ei autem qui non habet, et quod videtur habere, auferetur ab eo."
      en: "For to every one that hath shall be given, and he shall abound: but from him that hath not, that also which he seemeth to have shall be taken away."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et inutilem servum ejicite in tenebras exteriores: illic erit fletus, et stridor dentium."
      en: "And the unprofitable servant cast ye out into the exterior darkness. There shall be weeping and gnashing of teeth."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Cum autem venerit Filius hominis in majestate sua, et omnes angeli cum eo, tunc sedebit super sedem majestatis suae:"
      en: "And when the Son of man shall come in his majesty, and all the angels with him, then shall he sit upon the seat of his majesty."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et congregabuntur ante eum omnes gentes, et separabit eos ab invicem, sicut pastor segregat oves ab haedis:"
      en: "And all nations shall be gathered together before him, and he shall separate them one from another, as the shepherd separateth the sheep from the goats:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et statuet oves quidem a dextris suis, haedos autem a sinistris."
      en: "And he shall set the sheep on his right hand, but the goats on his left."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Tunc dicet rex his qui a dextris ejus erunt: Venite benedicti Patris mei, possidete paratum vobis regnum a constitutione mundi:"
      en: "Then shall the king say to them that shall be on his right hand: Come, ye blessed of my Father, possess you the kingdom prepared for you from the foundation of the world."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "esurivi enim, et dedistis mihi manducare: sitivi, et dedistis mihi bibere: hospes eram, et collegistis me:"
      en: "For I was hungry, and you gave me to eat; I was thirsty, and you gave me to drink; I was a stranger, and you took me in:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "nudus, et cooperuistis me: infirmus, et visitastis me: in carcere eram, et venistis ad me."
      en: "Naked, and you covered me: sick, and you visited me: I was in prison, and you came to me."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Tunc respondebunt ei justi, dicentes: Domine, quando te vidimus esurientem, et pavimus te: sitientem, et dedimus tibi potum?"
      en: "Then shall the just answer him, saying: Lord, when did we see thee hungry, and fed thee; thirsty, and gave thee drink?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "quando autem te vidimus hospitem, et collegimus te: aut nudum, et cooperuimus te?"
      en: "And when did we see thee a stranger, and took thee in? or naked, and covered thee?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "aut quando te vidimus infirmum, aut in carcere, et venimus ad te?"
      en: "Or when did we see thee sick or in prison, and came to thee?"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et respondens rex, dicet illis: Amen dico vobis, quamdiu fecistis uni ex his fratribus meis minimis, mihi fecistis."
      en: "And the king answering, shall say to them: Amen I say to you, as long as you did it to one of these my least brethren, you did it to me."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Tunc dicet et his qui a sinistris erunt: Discedite a me maledicti in ignem aeternum, qui paratus est diabolo, et angelis ejus:"
      en: "Then he shall say to them also that shall be on his left hand: Depart from me, you cursed, into everlasting fire which was prepared for the devil and his angels."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "esurivi enim, et non dedistis mihi manducare: sitivi, et non desistis mihi potum:"
      en: "For I was hungry, and you gave me not to eat: I was thirsty, and you gave me not to drink."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "hospes eram, et non collegistis me: nudus, et non cooperuistis me: infirmus, et in carcere, et non visitastis me."
      en: "I was a stranger, and you took me not in: naked, and you covered me not: sick and in prison, and you did not visit me."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Tunc respondebunt ei et ipsi, dicentes: Domine, quando te vidimus esurientem, aut sitientem, aut hospitem, aut nudum, aut infirmum, aut in carcere, et non ministravimus tibi?"
      en: "Then they also shall answer him, saying: Lord, when did we see thee hungry, or thirsty, or a stranger, or naked, or sick, or in prison, and did not minister to thee?"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Tunc respondebit illis, dicens: Amen dico vobis: Quamdiu non fecistis uni de minoribus his, nec mihi fecistis."
      en: "Then he shall answer them, saying: Amen I say to you, as long as you did it not to one of these least, neither did you do it to me."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Et ibunt hi in supplicium aeternum: justi autem in vitam aeternam."
      en: "And these shall go into everlasting punishment: but the just, into life everlasting."
    status: { la: verified, en: verified }
