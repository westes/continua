# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 21
verses:
  - n: 1
    text:
      la: "Respondens autem Job, dixit:"
      en: "Then Job answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Audite, quaeso, sermones meos, et agite poenitentiam."
      en: "Hear, I beseech you, my words, and do penance."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sustinete me, et ego loquar: et post mea, si videbitur, verba ridete."
      en: "Suffer me, and I will speak, and after, if you please, laugh at my words."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Numquid contra hominem disputatio mea est, ut merito non debeam contristari?"
      en: "Is my debate against man, that I should not have just reason to be troubled?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Attendite me et obstupescite, et superponite digitum ori vestro."
      en: "Hearken to me and be astonished, and lay your finger on your mouth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ego, quando recordatus fuero, pertimesco, et concutit carnem meam tremor."
      en: "As for me, when I remember, I am afraid, and trembling taketh hold on my flesh."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quare ergo impii vivunt, sublevati sunt, confortatique divitiis?"
      en: "Why then do the wicked live, are they advanced, and strengthened with riches?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Semen eorum permanet coram eis, propinquorum turba et nepotum in conspectu eorum."
      en: "Their seed continueth before them, a multitude of kinsmen, and of children's children in their sight."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Domus eorum securae sunt et pacatae, et non est virga Dei super illos."
      en: "Their houses are secure and peaceable, and the rod of God is not upon them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Bos eorum concepit, et non abortivit: vacca peperit, et non est privata foetu suo."
      en: "Their cattle have conceived, and failed not: their cow has calved, and is not deprived of her fruit."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Egrediuntur quasi greges parvuli eorum, et infantes eorum exultant lusibus."
      en: "Their little ones go out like a flock, and their children dance and play."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tenent tympanum et citharam, et gaudent ad sonitum organi."
      en: "They take the timbrel, and the harp, and rejoice at the sound of the organ."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ducunt in bonis dies suos, et in puncto ad inferna descendunt."
      en: "They spend their days in wealth, and in a moment they go down to hell."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui dixerunt Deo: Recede a nobis, et scientiam viarum tuarum nolumus."
      en: "Who have said to God: Depart from us, we desire not the knowledge of thy ways."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quis est Omnipotens, ut serviamus ei? et quid nobis prodest si oraverimus illum?"
      en: "Who is the Almighty, that we should serve him? and what doth it profit us if we pray to him?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Verumtamen quia non sunt in manu eorum bona sua, consilium impiorum longe sit a me."
      en: "Yet because their good things are not in their hand, may the counsel of the wicked be far from me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quoties lucerna impiorum extinguetur, et superveniet eis inundatio, et dolores dividet furoris sui?"
      en: "How often shall the lamp of the wicked be put out, and a deluge come upon them, and he shall distribute the sorrows of his wrath?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Erunt sicut paleae ante faciem venti, et sicut favilla quam turbo dispergit."
      en: "They shall be as chaff before the face of the wind, and as ashes which the whirlwind scattereth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Deus servabit filiis illius dolorem patris, et cum reddiderit, tunc sciet."
      en: "God shall lay up the sorrow of the father for his children: and when he shall repay, then shall he know."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Videbunt oculi ejus interfectionem suam, et de furore Omnipotentis bibet."
      en: "His eyes shall see his own destruction, and he shall drink of the wrath of the Almighty."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quid enim ad eum pertinet de domo sua post se, et si numerus mensium ejus dimidietur?"
      en: "For what is it to him what befalleth his house after him: and if the number of his months be diminished by one half?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Numquid Deus docebit quispiam scientiam, qui excelsos judicat?"
      en: "Shall any one teach God knowledge, who judgeth those that are high?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Iste moritur robustus et sanus, dives et felix:"
      en: "One man dieth strong, and hale, rich and happy."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "viscera ejus plena sunt adipe, et medullis ossa illius irrigantur:"
      en: "His bowels are full of fat, and his bones are moistened with marrow."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "alius vero moritur in amaritudine animae absque ullis opibus:"
      en: "But another dieth in bitterness of soul without any riches:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et tamen simul in pulvere dormient, et vermes operient eos."
      en: "And yet they shall sleep together in the dust, and worms shall cover them."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Certe novi cogitationes vestras, et sententias contra me iniquas."
      en: "Surely I know your thoughts, and your unjust judgments against me."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Dicitis enim: Ubi est domus principis? et ubi tabernacula impiorum?"
      en: "For you say: Where is the house of the prince? and where are the dwelling places of the wicked?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Interrogate quemlibet de viatoribus, et haec eadem illum intelligere cognoscetis:"
      en: "Ask any one of them that go by the way, and you shall perceive that he knoweth these same things."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quia in diem perditionis servatur malus, et ad diem furoris ducetur."
      en: "Because the wicked man is reserved to the day of destruction, and he shall be brought to the day of wrath."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Quis arguet coram eo viam ejus? et quae fecit, quis reddet illi?"
      en: "Who shall reprove his way to his face? and who shall repay him what he hath done?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ipse ad sepulchra ducetur, et in congerie mortuorum vigilabit."
      en: "He shall be brought to the graves, and shall watch in the heap of the dead."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dulcis fuit glareis Cocyti, et post se omnem hominem trahet, et ante se innumerabiles."
      en: "He hath been acceptable to the gravel of Cocytus, and he shall draw every man after him, and there are innumerable before him."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Quomodo igitur consolamini me frustra, cum responsio vestra repugnare ostensa sit veritati?"
      en: "How then do ye comfort me in vain, whereas your answer is shewn to be repugnant to truth?"
    status: { la: verified, en: verified }
