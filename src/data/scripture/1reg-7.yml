# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 7
verses:
  - n: 1
    text:
      la: "Venerunt ergo viri Cariathiarim, et reduxerunt arcam Domini, et intulerunt eam in domum Abinadab in Gabaa: Eleazarum autem filium ejus sanctificaverunt, ut custodiret arcam Domini."
      en: "And then men of Cariathiarim came and fetched up the ark of the Lord and carried it into the house of Abinadab in Gabaa: and they sanctified Eleazar his son, to keep the ark of the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et factum est, ex qua die mansit arca Domini in Cariathiarim, multiplicati sunt dies ( erat quippe jam annus vigesimus) et requievit omnis domus Israel post Dominum."
      en: "And it came to pass, that from the day the ark of the Lord abode in Cariathiarim days were multiplied, (for it was now the twentieth year,) and all the house of Israel rested following the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ait autem Samuel ad universam domum Israel, dicens: Si in toto corde vestro revertimini ad Dominum, auferte deos alienos de medio vestri, Baalim et Astaroth: et praeparate corda vestra Domino, et servite ei soli, et eruet vos de manu Philisthiim."
      en: "And Samuel spoke to all the house of Israel, saying: If you turn to the Lord with all your heart, put away the strange gods from among you, Baalim and Astaroth: and prepare your hearts unto the Lord, and serve him only, and he will deliver you out of the hand of the Philistines."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Abstulerunt ergo filii Israel Baalim et Astaroth, et servierunt Domino soli."
      en: "Then the children of Israel put away Baalim and Astaroth, and served the Lord only."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixit autem Samuel: Congregate universum Israel in Masphath, ut orem pro vobis Dominum."
      en: "And Samuel said: Gather all Israel to Masphath, that I may pray to the Lord for you."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et convenerunt in Masphath: hauseruntque aquam, et effuderunt in conspectu Domini, et jejunaverunt in die illa, atque dixerunt ibi: Peccavimus Domino. Judicavitque Samuel filios Israel in Masphath."
      en: "And they gathered together to Masphath: and they drew water, and poured it out before the Lord, and they fasted on that day, and they said there: We have sinned against the Lord. And Samuel judged the children of Israel in Masphath."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et audierunt Philisthiim quod congregati essent filii Israel in Masphath, et ascenderunt satrapae Philisthinorum ad Israel. Quod cum audissent filii Israel, timuerunt a facie Philisthinorum."
      en: "And the Philistines heard that the children of Israel were gathered together to Masphath, and the lords of the Philistines went up against Israel. And when the children of Israel heard this, they were afraid of the Philistines."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixeruntque ad Samuelem: Ne cesses pro nobis clamare ad Dominum Deum nostrum, ut salvet nos de manu Philisthinorum."
      en: "And they said to Samuel: Cease not to cry to the Lord our God for us, that he may save us out of the hand of the Philistines."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Tulit autem Samuel agnum lactentem unum, et obtulit illum holocaustum integrum Domino: et clamavit Samuel ad Dominum pro Israel, et exaudivit eum Dominus."
      en: "And Samuel took a sucking lamb, and offered it whole for a holocaust to the Lord: and Samuel cried to the Lord for Israel, and the Lord heard him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Factum est autem, cum Samuel offerret holocaustum, Philisthiim iniere praelium contra Israel: intonuit autem Dominus fragore magno in die illa super Philisthiim, et exterruit eos, et caesi sunt a facie Israel."
      en: "And it came to pass, when Samuel was offering the holocaust, the Philistines began the battle against Israel: but the Lord thundered with a great thunder on that day upon the Philistines, and terrified them, and they were overthrown before the face of Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Egressique viri Israel de Masphath, persecuti sunt Philisthaeos, et percusserunt eos usque ad locum qui erat subter Bethchar."
      en: "And the men of Israel going out of Masphath pursued after the Philistines, and made slaughter of them till they came under Bethchar."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tulit autem Samuel lapidem unum, et posuit eum inter Masphath et inter Sen: et vocavit nomen loci illius, Lapis Adjutorii. Dixitque: Hucusque auxiliatus est nobis Dominus."
      en: "And Samuel took a stone, and laid it between Masphath and Sen: and he called the place, the Stone of help. And he said: Thus far the Lord hath helped us."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et humiliati sunt Philisthiim, nec apposuerunt ultra ut venirent in terminos Israel. Facta est itaque manus Domini super Philisthaeos, cunctis diebus Samuelis."
      en: "And the Philistines were humbled, and they did not come any more into the borders of Israel. And the hand of the Lord was against the Philistines, all the days of Samuel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et redditae sunt urbes, quas tulerant Philisthiim ab Israel, Israeli, ab Accaron usque Geth, et terminos suos: liberavitque Israel de manu Philisthinorum, eratque pax inter Israel et Amorrhaeum."
      en: "And the cities, which the Philistines had taken from Israel, were restored to Israel, from Accaron to Geth, and their borders: and he delivered Israel from the hand of the Philistines, and there was peace between Israel and the Amorrhites."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Judicabat quoque Samuel Israelem cunctis diebus vitae suae:"
      en: "And Samuel judged Israel all the days of his life:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ibat per singulos annos circuiens Bethel et Galgala et Masphath, et judicabat Israelem in supradictis locis."
      en: "And he went every year about to Bethel and to Galgal and to Masphath, and he judged Israel in the aforesaid places."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Revertebaturque in Ramatha: ibi enim erat domus ejus, et ibi judicabat Israelem: aedificavit etiam ibi altare Domino."
      en: "And he returned to Ramatha, for there was his house, and there he judged Israel: he built also there an altar to the Lord."
    status: { la: verified, en: verified }
