book: 1reg
chapter: 7
verses:
  - n: 1
    text:
      la: "venerunt ergo viri Cariathiarim et duxerunt arcam Domini et intulerunt eam in domum Abinadab in Gabaa Eleazarum autem filium eius sanctificaverunt ut custodiret arcam Domini"
      en: "And then men of Cariathiarim came and fetched up the ark of the Lord and carried it into the house of Abinadab in Gabaa: and they sanctified Eleazar his son, to keep the ark of the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et factum est ex qua die mansit arca in Cariathiarim multiplicati sunt dies erat quippe iam annus vicesimus et requievit omnis domus Israhel post Dominum"
      en: "And it came to pass, that from the day the ark of the Lord abode in Cariathiarim days were multiplied, (for it was now the twentieth year,) and all the house of Israel rested following the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ait autem Samuhel ad universam domum Israhel dicens si in toto corde vestro revertimini ad Dominum auferte deos alienos de medio vestrum et Astharoth et praeparate corda vestra Domino et servite ei soli et eruet vos de manu Philisthim"
      en: "And Samuel spoke to all the house of Israel, saying: If you turn to the Lord with all your heart, put away the strange gods from among you, Baalim and Astaroth: and prepare your hearts unto the Lord, and serve him only, and he will deliver you out of the hand of the Philistines."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "abstulerunt ergo filii Israhel Baalim et Astharoth et servierunt Domino soli"
      en: "Then the children of Israel put away Baalim and Astaroth, and served the Lord only."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixit autem Samuhel congregate universum Israhel in Masphat ut orem pro vobis Dominum"
      en: "And Samuel said: Gather all Israel to Masphath, that I may pray to the Lord for you."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et convenerunt in Masphat hauseruntque aquam et effuderunt in conspectu Domini et ieiunaverunt in die illa et dixerunt ibi peccavimus Domino iudicavitque Samuhel filios Israhel in Masphat"
      en: "And they gathered together to Masphath: and they drew water, and poured it out before the Lord, and they fasted on that day, and they said there: We have sinned against the Lord. And Samuel judged the children of Israel in Masphath."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et audierunt Philisthim quod congregati essent filii Israhel in Masphat et ascenderunt satrapae Philisthinorum ad Israhel quod cum audissent filii Israhel timuerunt a facie Philisthinorum"
      en: "And the Philistines heard that the children of Israel were gathered together to Masphath, and the lords of the Philistines went up against Israel. And when the children of Israel heard this, they were afraid of the Philistines."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixeruntque ad Samuhel ne cesses pro nobis clamare ad Dominum Deum nostrum ut salvet nos de manu Philisthinorum"
      en: "And they said to Samuel: Cease not to cry to the Lord our God for us, that he may save us out of the hand of the Philistines."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tulit autem Samuhel agnum lactantem unum et obtulit illum holocaustum integrum Domino et clamavit Samuhel ad Dominum pro Israhel et exaudivit eum Dominus"
      en: "And Samuel took a sucking lamb, and offered it whole for a holocaust to the Lord: and Samuel cried to the Lord for Israel, and the Lord heard him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "factum est ergo cum Samuhel offerret holocaustum Philistheos inire proelium contra Israhel intonuit autem Dominus fragore magno in die illa super Philisthim et exterruit eos et caesi sunt a filiis Israhel"
      en: "And it came to pass, when Samuel was offering the holocaust, the Philistines began the battle against Israel: but the Lord thundered with a great thunder on that day upon the Philistines, and terrified them, and they were overthrown before the face of Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "egressique viri Israhel de Masphat persecuti sunt Philistheos et percusserunt eos usque ad locum qui erat subter Bethchar"
      en: "And the men of Israel going out of Masphath pursued after the Philistines, and made slaughter of them till they came under Bethchar."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tulit autem Samuhel lapidem unum et posuit eum inter Masphat et inter Sen et vocavit nomen eius lapis Adiutorii dixitque hucusque auxiliatus est nobis Dominus"
      en: "And Samuel took a stone, and laid it between Masphath and Sen: and he called the place, the Stone of help. And he said: Thus far the Lord hath helped us."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et humiliati sunt Philisthim nec adposuerunt ultra ut venirent in terminos Israhel facta est itaque manus Domini super Philistheos cunctis diebus Samuhel"
      en: "And the Philistines were humbled, and they did not come any more into the borders of Israel. And the hand of the Lord was against the Philistines, all the days of Samuel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et redditae sunt urbes quas tulerant Philisthim ab Israhel Israheli ab Accaron usque Geth et terminos suos liberavit Israhel de manu Philisthinorum eratque pax inter Israhel et Amorreum"
      en: "And the cities, which the Philistines had taken from Israel, were restored to Israel, from Accaron to Geth, and their borders: and he delivered Israel from the hand of the Philistines, and there was peace between Israel and the Amorrhites."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "iudicabat quoque Samuhel Israhel cunctis diebus vitae suae"
      en: "And Samuel judged Israel all the days of his life:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ibat per singulos annos circumiens Bethel et Galgal et Masphat et iudicabat Israhelem in supradictis locis"
      en: "And he went every year about to Bethel and to Galgal and to Masphath, and he judged Israel in the aforesaid places."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "revertebaturque in Ramatha ibi enim erat domus eius et ibi iudicabat Israhelem aedificavit etiam ibi altare Domino"
      en: "And he returned to Ramatha, for there was his house, and there he judged Israel: he built also there an altar to the Lord."
    status: { la: verified, en: verified }
