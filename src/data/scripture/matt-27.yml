# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 27
verses:
  - n: 1
    text:
      la: "Mane autem facto, consilium inierunt omnes principes sacerdotum et seniores populi adversus Jesum, ut eum morti traderent."
      en: "And when morning was come, all the chief priests and ancients of the people took counsel against Jesus, that they might put him to death."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et vinctum adduxerunt eum, et tradiderunt Pontio Pilato praesidi."
      en: "And they brought him bound, and delivered him to Pontius Pilate the governor."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tunc videns Judas, qui eum tradidit, quod damnatus esset, poenitentia ductus, retulit triginta argenteos principibus sacerdotum, et senioribus,"
      en: "Then Judas, who betrayed him, seeing that he was condemned, repenting himself, brought back the thirty pieces of silver to the chief priests and ancients,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dicens: Peccavi, tradens sanguinem justum. At illi dixerunt: Quid ad nos? tu videris."
      en: "Saying: I have sinned in betraying innocent blood. But they said: What is that to us? look thou to it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et projectis argenteis in templo, recessit: et abiens laqueo se suspendit."
      en: "And casting down the pieces of silver in the temple, he departed: and went and hanged himself with an halter."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Principes autem sacerdotum, acceptis argenteis, dixerunt: Non licet eos mittere in corbonam: quia pretium sanguinis est."
      en: "But the chief priests having taken the pieces of silver, said: It is not lawful to put them into the corbona, because it is the price of blood."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Consilio autem inito, emerunt ex illis agrum figuli, in sepulturam peregrinorum."
      en: "And after they had consulted together, they bought with them the potter's field, to be a burying place for strangers."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Propter hoc vocatus est ager ille, Haceldama, hoc est, Ager sanguinis, usque in hodiernum diem."
      en: "For this cause the field was called Haceldama, that is, The field of blood, even to this day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Tunc impletum est quod dictum est per Jeremiam prophetam, dicentem: Et acceperunt triginta argenteos pretium appretiati, quem appretiaverunt a filiis Israel:"
      en: "Then was fulfilled that which was spoken by Jeremias the prophet, saying: And they took the thirty pieces of silver, the price of him that was prized, whom they prized of the children of Israel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dederunt eos in agrum figuli, sicut constituit mihi Dominus."
      en: "And they gave them unto the potter's field, as the Lord appointed to me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Jesus autem stetit ante praesidem, et interrogavit eum praeses, dicens: Tu es rex Judaeorum? Dicit illi Jesus: Tu dicis."
      en: "And Jesus stood before the governor, and the governor asked him, saying: Art thou the king of the Jews? Jesus saith to him: Thou sayest it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et cum accusaretur a principibus sacerdotum et senioribus, nihil respondit."
      en: "And when he was accused by the chief priests and ancients, he answered nothing."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tunc dicit illi Pilatus: Non audis quanta adversum te dicunt testimonia?"
      en: "Then Pilate saith to him: Dost not thou hear how great testimonies they allege against thee?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et non respondit ei ad ullum verbum, ita ut miraretur praeses vehementer."
      en: "And he answered him to never a word; so that the governor wondered exceedingly."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Per diem autem solemnem consueverat praeses populi dimittere unum vinctum, quem voluissent:"
      en: "Now upon the solemn day the governor was accustomed to release to the people one prisoner, whom they would."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "habebat autem tunc vinctum insignem, qui dicebatur Barrabas."
      en: "And he had then a notorious prisoner, that was called Barabbas."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Congregatis ergo illis, dixit Pilatus: Quem vultis dimittam vobis: Barabbam, an Jesum, qui dicitur Christus?"
      en: "They therefore being gathered together, Pilate said: Whom will you that I release to you, Barabbas, or Jesus that is called Christ?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Sciebat enim quod per invidiam tradidissent eum."
      en: "For he knew that for envy they had delivered him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sedente autem illo pro tribunali, misit ad eum uxor ejus, dicens: Nihil tibi, et justo illi: multa enim passa sum hodie per visum propter eum."
      en: "And as he was sitting in the place of judgment, his wife sent to him, saying: Have thou nothing to do with that just man; for I have suffered many things this day in a dream because of him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Principes autem sacerdotum et seniores persuaserunt populis ut peterent Barabbam, Jesum vero perderent."
      en: "But the chief priests and ancients persuaded the people, that they should ask for Barabbas, and take Jesus away."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Respondens autem praeses, ait illis: Quem vultis vobis de duobus dimitti? At illi dixerunt: Barabbam."
      en: "And the governor answering, said to them: Whether will you of the two to be released unto you? But they said, Barabbas."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dicit illis Pilatus: Quid igitur faciam de Jesu, qui dicitur Christus?"
      en: "Pilate saith to them: What shall I do then with Jesus that is called Christ? They say all: Let him be crucified."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dicunt omnes: Crucifigatur. Ait illis praeses: Quid enim mali fecit? At illi magis clamabant dicentes: Crucifigatur."
      en: "The governor said to them: Why, what evil hath he done? But they cried out the more, saying: Let him be crucified."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Videns autem Pilatus quia nihil proficeret, sed magis tumultus fieret: accepta aqua, lavit manus coram populo, dicens: Innocens ego sum a sanguine justi hujus: vos videritis."
      en: "And Pilate seeing that he prevailed nothing, but that rather a tumult was made; taking water washed his hands before the people, saying: I am innocent of the blood of this just man; look you to it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et respondens universus populus, dixit: Sanguis ejus super nos, et super filios nostros."
      en: "And the whole people answering, said: His blood be upon us and our children."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Tunc dimisit illis Barabbam: Jesum autem flagellatum tradidit eis ut crucifigeretur."
      en: "Then he released to them Barabbas, and having scourged Jesus, delivered him unto them to be crucified."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Tunc milites praesidis suscipientes Jesum in praetorium, congregaverunt ad eum universam cohortem:"
      en: "Then the soldiers of the governor taking Jesus into the hall, gathered together unto him the whole band;"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et exeuntes eum, chlamydem coccineam circumdederunt ei,"
      en: "And stripping him, they put a scarlet cloak about him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et plectentes coronam de spinis, posuerunt super caput ejus, et arundinem in dextera ejus. Et genu flexo ante eum, illudebant ei, dicentes: Ave rex Judaeorum."
      en: "And platting a crown of thorns, they put it upon his head, and a reed in his right hand. And bowing the knee before him, they mocked him, saying: Hail, king of the Jews."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et exspuentes in eum, acceperunt arundinem, et percutiebant caput ejus."
      en: "And spitting upon him, they took the reed, and struck his head."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et postquam illuserunt ei, exuerunt eum chlamyde, et induerunt eum vestimentis ejus, et duxerunt eum ut crucifigerent."
      en: "And after they had mocked him, they took off the cloak from him, and put on him his own garments, and led him away to crucify him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Exeuntes autem invenerunt hominem Cyrenaeum, nomine Simonem: hunc angariaverunt ut tolleret crucem ejus."
      en: "And going out, they found a man of Cyrene, named Simon: him they forced to take up his cross."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et venerunt in locum qui dicitur Golgotha, quod est Calvariae locus."
      en: "And they came to the place that is called Golgotha, which is the place of Calvary."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et dederunt ei vinum bibere cum felle mistum. Et cum gustasset, noluit bibere."
      en: "And they gave him wine to drink mingled with gall. And when he had tasted, he would not drink."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Postquam autem crucifixerunt eum, diviserunt vestimenta ejus, sortem mittentes: ut impleretur quod dictum est per prophetam dicentem: Diviserunt sibi vestimenta mea, et super vestem meam miserunt sortem."
      en: "And after they had crucified him, they divided his garments, casting lots; that it might be fulfilled which was spoken by the prophet, saying: They divided my garments among them; and upon my vesture they cast lots."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et sedentes servabant eum."
      en: "And they sat and watched him."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et imposuerunt super caput ejus causam ipsius scriptam: Hic est Jesus rex Judaeorum."
      en: "And they put over his head his cause written: THIS IS JESUS THE KING OF THE JEWS."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Tunc crucifixi sunt cum eo duo latrones: unus a dextris, et unus a sinistris."
      en: "Then were crucified with him two thieves: one on the right hand, and one on the left."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Praetereuntes autem blasphemabant eum moventes capita sua,"
      en: "And they that passed by, blasphemed him, wagging their heads,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et dicentes: Vah qui destruis templum Dei, et in triduo illud reaedificas: salva temetipsum: si Filius Dei es, descende de cruce."
      en: "And saying: Vah, thou that destroyest the temple of God, and in three days dost rebuild it: save thy own self: if thou be the Son of God, come down from the cross."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Similiter et principes sacerdotum illudentes cum scribis et senioribus dicebant:"
      en: "In like manner also the chief priests, with the scribes and ancients, mocking, said:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Alios salvos fecit, seipsum non potest salvum facere: si rex Israel est, descendat nunc de cruce, et credimus ei:"
      en: "He saved others; himself he cannot save. If he be the king of Israel, let him now come down from the cross, and we will believe him."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "confidit in Deo: liberet nunc, si vult eum: dixit enim: Quia Filius Dei sum."
      en: "He trusted in God; let him now deliver him if he will have him; for he said: I am the Son of God."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Idipsum autem et latrones, qui crucifixi erant cum eo, improperabant ei."
      en: "And the selfsame thing the thieves also, that were crucified with him, reproached him with."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "A sexta autem hora tenebrae factae sunt super universam terram usque ad horam nonam."
      en: "Now from the sixth hour there was darkness over the whole earth, until the ninth hour."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Et circa horam nonam clamavit Jesus voce magna, dicens: Eli, Eli, lamma sabacthani? hoc est: Deus meus, Deus meus, ut quid dereliquisti me?"
      en: "And about the ninth hour Jesus cried with a loud voice, saying: Eli, Eli, lamma sabacthani? that is, My God, my God, why hast thou forsaken me?"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Quidam autem illic stantes, et audientes, dicebant: Eliam vocat iste."
      en: "And some that stood there and heard, said: This man calleth Elias."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Et continuo currens unus ex eis, acceptam spongiam implevit aceto, et imposuit arundini, et dabat ei bibere."
      en: "And immediately one of them running took a sponge, and filled it with vinegar; and put it on a reed, and gave him to drink."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Ceteri vero dicebant: Sine, videamus an veniat Elias liberans eum."
      en: "And the others said: Let be, let us see whether Elias will come to deliver him."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Jesus autem iterum clamans voce magna, emisit spiritum."
      en: "And Jesus again crying with a loud voice, yielded up the ghost."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et ecce velum templi scissum est in duas partes a summo usque deorsum: et terra mota est, et petrae scissae sunt,"
      en: "And behold the veil of the temple was rent in two from the top even to the bottom, and the earth quaked, and the rocks were rent."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et monumenta aperta sunt: et multa corpora sanctorum, qui dormierant, surrexerunt."
      en: "And the graves were opened: and many bodies of the saints that had slept arose,"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Et exeuntes de monumentis post resurrectionem ejus, venerunt in sanctam civitatem, et apparuerunt multis."
      en: "And coming out of the tombs after his resurrection, came into the holy city, and appeared to many."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Centurio autem, et qui cum eo erant, custodientes Jesum, viso terraemotu, et his quae fiebant, timuerunt valde, dicentes: Vere Filius Dei erat iste."
      en: "Now the centurion and they that were with him watching Jesus, having seen the earthquake, and the things that were done, were sore afraid, saying: Indeed this was the Son of God."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Erant autem ibi mulieres multae a longe, quae secutae erant Jesum a Galilaea, ministrantes ei:"
      en: "And there were there many women afar off, who had followed Jesus from Galilee, ministering unto him:"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "inter quas erat Maria Magdalene, et Maria Jacobi, et Joseph mater, et mater filiorum Zebedaei."
      en: "Among whom was Mary Magdalen, and Mary the mother of James and Joseph, and the mother of the sons of Zebedee."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Cum autem sero factum esset, venit quidam homo dives ab Arimathaea, nomine Joseph, qui et ipse discipulus erat Jesu:"
      en: "And when it was evening, there came a certain rich man of Arimathea, named Joseph, who also himself was a disciple of Jesus."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "hic accessit ad Pilatum, et petiit corpus Jesu. Tunc Pilatus jussit reddi corpus."
      en: "He went to Pilate, and asked the body of Jesus. Then Pilate commanded that the body should be delivered."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Et accepto corpore, Joseph involvit illud in sindone munda,"
      en: "And Joseph taking the body, wrapped it up in a clean linen cloth."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "et posuit illud in monumento suo novo, quod exciderat in petra. Et advolvit saxum magnum ad ostium monumenti, et abiit."
      en: "And laid it in his own new monument, which he had hewed out in a rock. And he rolled a great stone to the door of the monument, and went his way."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Erant autem ibi Maria Magdalene, et altera Maria, sedentes contra sepulchrum."
      en: "And there was there Mary Magdalen, and the other Mary sitting over against the sepulchre."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Altera autem die, quae est post Parasceven, convenerunt principes sacerdotum et pharisaei ad Pilatum,"
      en: "And the next day, which followed the day of preparation, the chief priests and the Pharisees came together to Pilate,"
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "dicentes: Domine, recordati sumus, quia seductor ille dixit adhuc vivens: Post tres dies resurgam."
      en: "Saying: Sir, we have remembered, that that seducer said, while he was yet alive: After three days I will rise again."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Jube ergo custodiri sepulchrum usque in diem tertium: ne forte veniant discipuli ejus, et furentur eum, et dicant plebi: Surrexit a mortuis: et erit novissimus error pejor priore."
      en: "Command therefore the sepulchre to be guarded until the third day: lest perhaps his disciples come and steal him away, and say to the people: He is risen from the dead; and the last error shall be worse than the first."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "Ait illis Pilatus: Habetis custodiam, ite, custodite sicut scitis."
      en: "Pilate saith to them: You have a guard; go, guard it as you know."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "Illi autem abeuntes, munierunt sepulchrum, signantes lapidem, cum custodibus."
      en: "And they departing, made the sepulchre sure, sealing the stone, and setting guards."
    status: { la: verified, en: verified }
