# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: esth
chapter: 11
verses:
  - n: 1
    text:
      la: "Anno quarto regnantibus Ptolemaeo et Cleopatra, attulerunt Dosithaeus, qui se sacerdotem, et Levitici generis ferebat, et Ptolemaeus filius ejus hanc epistolam phurim, quam dixerunt interpretatum esse Lysimachum Ptolemaei filium in Jerusalem."
      en: "In the fourth year of the reign of Ptolemy and Cleopatra, Dositheus, who said he was a priest, and of the Levitical race, and Ptolemy his son brought this epistle of Phurim, which they said Lysimachus the son of Ptolemy had interpreted in Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Anno secundo, regnante Artaxerxe maximo, prima die mensis Nisan, vidit somnium Mardochaeus filius Jairi, filii Semei, filii Cis, de tribu Benjamin:"
      en: "In the second year of the reign of Artaxerxes the great, in the first day of the month Nisan, Mardochai the son of Jair, the son of Semei, the son of Cis, of the tribe of Benjamin:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "homo Judaeus, qui habitabat in urbe Susis, vir magnus, et inter primos aulae regiae."
      en: "A Jew who dwelt in the city of Susan, a great man and among the first of the king's court, had a dream."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Erat autem de eo numero captivorum, quos transtulerat Nabuchodonosor rex Babylonis de Jerusalem cum Jechonia rege Juda:"
      en: "Now he was of the number of the captives, whom Nabuchodonosor king of Babylon had carried away from Jerusalem with Jechonias king of Juda:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et hoc ejus somnium fuit: apparuerunt voces, et tumultus, et tonitrua, et terraemotus, et conturbatio super terram:"
      en: "And this was his dream: Behold there were voices, and tumults, and thunders, and earthquakes, and a disturbance upon the earth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ecce duo dracones magni, paratique contra se in praelium."
      en: "And behold two great dragons came forth ready to fight one against another."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ad quorum clamorem cunctae concitatae sunt nationes, ut pugnarent contra gentem justorum."
      en: "And at their cry all nations were stirred up to fight against the nation of the just."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Fuitque dies illa tenebrarum et discriminis, tribulationis et angustiae, et ingens formido super terram."
      en: "And that was a day of darkness and danger, of tribulation and distress, and great fear upon the earth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Conturbataque est gens justorum timentium mala sua, et praeparata ad mortem."
      en: "And the nation of the just was troubled fearing their own evils, and was prepared for death."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Clamaveruntque ad Deum: et illis vociferantibus, fons parvus creavit in fluvium maximum, et in aquas plurimas redundavit."
      en: "And they cried to God: and as they were crying, a little fountain grew into a very great river, and abounded into many waters."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Lux et sol ortus est, et humiles exaltati sunt, et devoraverunt inclytos."
      en: "The light and the sun rose up, and the humble were exalted, and they devoured the glorious."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quod cum vidisset Mardochaeus, et surrexisset de strato, cogitabat quid Deus facere vellet: et fixum habebat in animo scire cupiens quid significaret somnium."
      en: "And when Mardochai had seen this, and arose out of his bed, he was thinking what God would do: and he kept it fixed in his mind, desirous to know what the dream should signify."
    status: { la: verified, en: verified }
