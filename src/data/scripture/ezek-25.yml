# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 25
verses:
  - n: 1
    text:
      la: "Et factus est sermo Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hominis, pone faciem tuam contra filios Ammon, et prophetabis de eis."
      en: "Son of man, set thy face against the children of Ammon, and thou shalt prophesy of them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dices filiis Ammon: Audite verbum Domini Dei. Haec dicit Dominus Deus: Pro eo quod dixisti: Euge, euge, super sanctuarium meum, quia pollutum est; et super terram Israel, quoniam desolata est; et super domum Juda, quoniam ducti sunt in captivitatem:"
      en: "And thou shalt say to the children of Ammon: Hear ye the word of the Lord God: Thus saith the Lord God: Because thou hast said: Ha, ha, upon my sanctuary, because it was profaned: and upon the land of Israel, because it was laid waste: and upon the house of Juda, because they are led into captivity:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "idcirco ego tradam te filiis orientalibus in haereditatem: et collocabunt caulas suas in te, et ponent in te tentoria sua: ipsi comedent fruges tuas, et ipsi bibent lac tuum."
      en: "Therefore will I deliver thee to the men of the east for an inheritance, and they shall place their sheepcotes in thee, and shall set up their tents in thee: they shall eat thy fruits: and they shall drink thy milk."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Daboque Rabbath in habitaculum camelorum, et filios Ammon in cubile pecorum: et scietis quia ego Dominus."
      en: "And I will make Rabbath a stable for camels, and the children of Ammon a couching place for flocks: and you shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quia haec dicit Dominus Deus: Pro eo quod plausisti manu et percussisti pede, et gavisa es ex toto affectu super terram Israel,"
      en: "For thus saith the Lord God: Because thou hast clapped thy hands and stamped with thy foot, and hast rejoiced with all thy heart against the land of Israel:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "idcirco ecce ego extendam manum meam super te, et tradam te in direptionem gentium, et interficiam te de populis, et perdam de terris, et conteram: et scies quia ego Dominus."
      en: "Therefore behold I will stretch forth my hand upon thee, and will deliver thee to be the spoil of nations, and will cut thee off from among the people, and destroy thee out of the lands, and break thee in pieces: and thou shalt know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Haec dicit Dominus Deus: Pro eo quod dixerunt Moab et Seir: Ecce sicut omnes gentes, domus Juda:"
      en: "Thus saith the Lord God: Because Moab and Seir have said: Behold the house of Juda is like all other nations:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "idcirco ecce ego aperiam humerum Moab de civitatibus, de civitatibus, inquam, ejus, et de finibus ejus, inclytas terrae Bethiesimoth, et Beelmeon, et Cariathaim,"
      en: "Therefore behold I will open the shoulder of Moab from the cities, from his cities, I say, and his borders, the noble cities of the land of Bethiesimoth, and Beelmeon, and Cariathaim,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "filiis orientis cum filiis Ammon, et dabo eam in haereditatem, ut non sit ultra memoria filiorum Ammon in gentibus."
      en: "To the people of the east with the children of Ammon, and I will give it them for an inheritance: that there may be no more any remembrance of the children of Ammon among the nations."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et in Moab faciam judicia, et scient quia ego Dominus."
      en: "And I will execute judgments in Moab: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Haec dicit Dominus Deus: Pro eo quod fecit Idumaea ultionem ut se vindicaret de filiis Juda, peccavitque delinquens, et vindictam expetivit de eis:"
      en: "Thus saith the Lord God: Because Edom hath taken vengeance to revenge herself of the children of Juda, and hath greatly offended, and hath sought revenge of them:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "idcirco haec dicit Dominus Deus: Extendam manum meam super Idumaeam, et auferam de ea hominem et jumentum, et faciam eam desertam ab austro: et qui sunt in Dedan gladio cadent."
      en: "Therefore thus saith the Lord God: I will stretch forth my hand upon Edom, and will take away out of it man and beast, and will make it desolate from the south: and they that are in Dedan shall fall by the sword."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et dabo ultionem meam super Idumaeam per manum populi mei Israel, et facient in Edom juxta iram meam et furorem meum, et scient vindictam meam, dicit Dominus Deus."
      en: "And I will lay my vengeance upon Edom by the hand of my people Israel: and they shall do in Edom according to my wrath, and my fury: and they shall know my vengeance, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Haec dicit Dominus Deus: Pro eo quod fecerunt Palaestini vindictam, et ulti se sunt toto animo, interficientes, et implentes inimicitias veteres,"
      en: "Thus saith the Lord God: Because the Philistines have taken vengeance, and have revenged themselves with all their mind, destroying and satisfying old enmities:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "propterea haec dicit Dominus Deus: Ecce ego extendam manum meam super Palaestinos, et interficiam interfectores, et perdam reliquias maritimae regionis,"
      en: "Therefore thus saith the Lord God: Behold I will stretch forth my hand upon the Philistines, and will kill the killers, and will destroy the remnant of the sea coast."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "faciamque in eis ultiones magnas, arguens in furore: et scient quia ego Dominus, cum dedero vindictam meam super eos."
      en: "And I will execute great vengeance upon them, rebuking them in fury: and they shall know that I am the Lord, when I shall lay my vengeance upon them."
    status: { la: verified, en: verified }
