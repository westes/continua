book: ezek
chapter: 24
verses:
  - n: 1
    text:
      la: "et factum est verbum Domini ad me in anno nono in mense decimo decima mensis dicens"
      en: "And the word of the Lord came to me in the ninth year, in the tenth month, the tenth day of the month, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fili hominis scribe tibi nomen diei huius in qua confirmatus est rex Babylonis adversum Hierusalem hodie"
      en: "Son of man, write thee the name of this day, on which the king of Babylon hath set himself against Jerusalem to day."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dices per proverbium ad domum inritatricem parabolam et loqueris ad eos haec dicit Dominus Deus pone ollam pone inquam et mitte in ea aquam"
      en: "And thou shalt speak by a figure a parable to the provoking house, and say to them: Thus saith the Lord God: Set on a pot, set it on, I say, and put water into it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "congere frusta eius in ea omnem partem bonam femur et armum electa et ossibus plena"
      en: "Heap together into if the pieces thereof, every good piece, the thigh and the shoulder, choice pieces and full of bones."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "pinguissimum pecus adsume conpone quoque struices ossuum sub ea efferbuit coctio eius et discocta sunt ossa illius in medio eius"
      en: "Take the fattest of the flock, and lay together piles of bones under it: the seething thereof is boiling hot, and the bones thereof are thoroughly sodden in the midst of it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "propterea haec dicit Dominus Deus vae civitati sanguinum ollae cuius rubigo in ea est et rubigo eius non exivit de ea per partes et per partes suas eice eam non cecidit super eam sors"
      en: "Therefore thus saith the Lord God: Woe to the bloody city, to the pot whose rust is in it, and its rust is not gone out of it: cast it out piece by piece, there hath no lot fallen upon it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sanguis enim eius in medio eius est super limpidissimam petram effudit illum non effudit illum super terram ut possit operiri pulvere"
      en: "For her blood is in the midst of her, she hath shed it upon the smooth rock: she hath not shed it upon the ground, that it might be covered with dust."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ut superducerem indignationem meam et vindicta ulciscerer dedi sanguinem eius super petram limpidissimam ne operiretur"
      en: "And that I might bring my indignation upon her, and take my vengeance: I have shed her blood upon the smooth rock, that it should not be covered."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "propterea haec dicit Dominus Deus vae civitati sanguinum cuius ego grandem faciam pyram"
      en: "Therefore thus saith the Lord God: Woe to the bloody city, of which I will make a great bonfire."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "congere ossa quae igne succendam consumentur carnes et concoquetur universa conpositio et ossa tabescent"
      en: "Heap together the bones, which I will burn with Are: the flesh shall be consumed, and the whole composition shall be sodden, and the bones shall be consumed."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "pone quoque eam super prunas vacuam ut incalescat et liquefiat aes eius et confletur in medio eius inquinamentum eius et consumatur rubigo eius"
      en: "Then set it empty upon burning coals, that it may be hot, and the brass thereof may be melted: and let the filth of it be melted in the midst thereof, and let the rust of it be consumed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "multo labore sudatum est et non exibit de ea nimia rubigo eius neque per ignem"
      en: "Great pains have been taken, and the great rust thereof is not gone out, not even by fire."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "inmunditia tua execrabilis quia mundare te volui et non es mundata a sordibus tuis sed nec mundaberis prius donec quiescere faciam indignationem meam in te"
      en: "Thy uncleanness is execrable: be- cause I desired to cleanse thee, and thou art not cleansed from thy filthiness: neither shalt thou be cleansed, before I cause my indignation to rest in thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ego Dominus locutus sum venit et faciam non transeam nec parcam nec placabor iuxta vias tuas et iuxta adinventiones tuas iudicavi te dicit Dominus"
      en: "I the Lord have spoken: it shall come to pass, and I will do it: I will not pass by, nor spare, nor be pacified: I will judge thee according to thy ways, and according to thy doings, saith the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et factum est verbum Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "fili hominis ecce ego tollo a te desiderabile oculorum tuorum in plaga et non planges neque plorabis neque fluent lacrimae tuae"
      en: "Son of man, behold I take from thee the desire of thy eyes with a stroke: and thou shalt not lament, nor weep : neither shall thy tears run down."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ingemesce tacens mortuorum luctum non facies corona tua circumligata sit tibi et calciamenta tua erunt in pedibus tuis nec amictu ora velabis nec cibos lugentium comedes"
      en: "Sigh in silence, make no mourning for the dead: let the tire of thy head be upon thee, and thy shoes on thy feet, and cover not thy face, nor eat the meat of mourners."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "locutus sum ergo ad populum mane et mortua est uxor mea vesperi fecique mane sicut praeceperat mihi"
      en: "So I spoke to the people in the morning, and my wife died in the evening: and I did in the morning as he had commanded me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dixit ad me populus quare non indicas nobis quid ista significent quae tu facis"
      en: "And the people said to me: Why dost thou not tell us what these things mean that thou doest?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et dixi ad eos sermo Domini factus est ad me dicens"
      en: "And I said to them: The word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "loquere domui Israhel haec dicit Dominus Deus ecce ego polluam sanctuarium meum superbiam imperii vestri et desiderabile oculorum vestrorum et super quo pavet anima vestra et filii vestri et filiae quas reliquistis gladio cadent"
      en: "Speak to the house of Israel: Thus saith the Lord God: Behold I will profane my sanctuary, the glory of your realm, and the thing that your eyes de sire, and for which your soul feareth: your sons, and your daughters, whom you have left, shall fall by the sword."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et facietis sicut feci ora amictu non velabitis et cibos lugentium non comedetis"
      en: "And you shall do as I have done: you shall not cover your faces, nor shall you eat the meat of mourners."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "coronas habebitis in capitibus vestris et calciamenta in pedibus non plangetis neque flebitis sed tabescetis in iniquitatibus vestris et unusquisque gemet ad fratrem suum"
      en: "You shall have crowns on your heads, and shoes on your feet: you shall not lament nor weep, but you shall pine away for your iniquities, and every one shall sigh with his brother."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "eritque Hiezecihel vobis in portentum iuxta omnia quae fecit facietis cum venerit istud et scietis quia ego Dominus Deus"
      en: "And Ezechiel shall be unto you for a sign of things to come: according to all that he hath done, so shall you do, when this shall come to pass: and you shall know that I am the Lord God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et tu fili hominis ecce in die quo tollam ab eis fortitudinem eorum et gaudium dignitatis et desiderium oculorum eorum super quo requiescunt animae eorum filios et filias eorum"
      en: "And thou, O son of man, behold in the day wherein I will take away from them their strength, and the joy of their glory, and the desire of their eyes, upon which their souls rest, their sons and their daughters."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "in die illa cum venerit fugiens ad te ut adnuntiet tibi"
      en: "In that day when he that escapeth shall come to thee, to tell thee:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "in die inquam illa aperietur os tuum cum eo qui fugit et loqueris et non silebis ultra erisque eis in portentum et scietis quia ego Dominus"
      en: "In that day, I say, shall thy mouth be opened to him that hath escaped, and thou shalt speak, and shalt be silent no more: and thou shalt be unto them for a sign of things to come, and you shall know that I am the Lord."
    status: { la: verified, en: verified }
