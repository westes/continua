# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 24
verses:
  - n: 1
    text:
      la: "Et factum est verbum Domini ad me in anno nono, in mense decimo, decima die mensis, dicens:"
      en: "And the word of the Lord came to me in the ninth year, in the tenth month, the tenth day of the month, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hominis, scribe tibi nomen diei hujus, in qua confirmatus est rex Babylonis adversum Jerusalem hodie."
      en: "Son of man, write thee the name of this day, on which the king of Babylon hath set himself against Jerusalem today."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dices per proverbium ad domum irritatricem parabolam, et loqueris ad eos: Haec dicit Dominus Deus: Pone ollam; pone, inquam, et mitte in eam aquam."
      en: "And thou shalt speak by a figure a parable to the provoking house, and say to them: Thus saith the Lord God: Set on a pot, set it on, I say, and put water into it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Congere frusta ejus in eam, omnem partem bonam, femur et armum, electa et ossibus plena."
      en: "Heap together into it the pieces thereof, every good piece, the thigh and the shoulder, choice pieces and full of bones."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Pinguissimum pecus assume, compone quoque strues ossium sub ea: efferbuit coctio ejus, et discocta sunt ossa illius in medio ejus."
      en: "Take the fattest of the flock, and lay together piles of bones under it: the seething thereof is boiling hot, and the bones thereof are thoroughly sodden in the midst of it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Propterea haec dicit Dominus Deus: Vae civitati sanguinum, ollae cujus rubigo in ea est, et rubigo ejus non exivit de ea! Per partes et per partes suas ejice eam: non cecidit super eam sors."
      en: "Therefore thus saith the Lord God: Woe to the bloody city, to the pot whose rust is in it, and its rust is not gone out of it: cast it out piece by piece, there hath no lot fallen upon it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sanguis enim ejus in medio ejus est, super limpidissimam petram effudit illum: et effudit illum super terram, et possit operiri pulvere."
      en: "For her blood is in the midst of her, she hath shed it upon the smooth rock: she hath not shed it upon the ground, that it might be covered with dust."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ut superinducerem indignationem meam, et vindicta ulciscerer, dedi sanguinem ejus super petram limpidissimam, ne operiretur."
      en: "And that I might bring my indignation upon her, and take my vengeance: I have shed her blood upon the smooth rock, that it should not be covered."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Propterea haec dicit Dominus Deus: Vae civitati sanguinum, cujus ego grandem faciam pyram!"
      en: "Therefore thus saith the Lord God: Woe to the bloody city, of which I will make a great bonfire."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Congere ossa, quae igne succendam: consumentur carnes, et coquetur universa compositio, et ossa tabescent."
      en: "Heap together the bones, which I will burn with fire: the flesh shall be consumed, and the whole composition shall be sodden, and the bones shall be consumed."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Pone quoque eam super prunas vacuam, ut incalescat, et liquefiat aes ejus, et confletur in medio ejus inquinamentum ejus, et consumatur rubigo ejus."
      en: "Then set it empty upon burning coals, that it may be hot, and the brass thereof may be melted: and let the filth of it be melted in the midst thereof, and let the rust of it be consumed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Multo labore sudatum est, et non exivit de ea nimia rubigo ejus, neque per ignem."
      en: "Great pains have been taken, and the great rust thereof is not gone out, not even by fire."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Immunditia tua execrabilis, quia mundare te volui, et non es mundata a sordibus tuis: sed nec mundaberis prius, donec quiescere faciam indignationem meam in te."
      en: "Thy uncleanness is execrable: because I desired to cleanse thee, and thou art not cleansed from thy filthiness: neither shalt thou be cleansed, before I cause my indignation to rest in thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ego Dominus locutus sum: veniet, et faciam: non transeam, nec parcam, nec placabor: juxta vias tuas, et juxta adinventiones tuas judicabo te, dicit Dominus."
      en: "I the Lord have spoken: it shall come to pass, and I will do it: I will not pass by, nor spare, nor be pacified: I will judge thee according to thy ways, and according to thy doings, saith the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Fili hominis, ecce ego tollo a te desiderabile oculorum tuorum in plaga: et non planges, neque plorabis, neque fluent lacrimae tuae."
      en: "Son of man, behold I take from thee the desire of thy eyes with a stroke: and thou shalt not lament, nor weep: neither shall thy tears run down."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ingemisce tacens: mortuorum luctum non facies: corona tua circumligata sit tibi, et calceamenta tua erunt in pedibus tuis: nec amictu ora velabis, nec cibos lugentium comedes."
      en: "Sigh in silence, make no mourning for the dead: let the tire of thy head be upon thee, and thy shoes on thy feet, and cover not thy face, nor eat the meat of mourners."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Locutus sum ergo ad populum mane, et mortua est uxor mea vespere: fecique mane sicut praeceperat mihi."
      en: "So I spoke to the people in the morning, and my wife died in the evening: and I did in the morning as he had commanded me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et dixit ad me populus: Quare non indicas nobis quid ista significent quae tu facis?"
      en: "And the people said to me: Why dost thou not tell us what these things mean that thou doest?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et dixi ad eos: Sermo Domini factus est ad me, dicens:"
      en: "And I said to them: The word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Loquere domui Israel: Haec dicit Dominus Deus: Ecce ego polluam sanctuarium meum, superbiam imperii vestri, et desiderabile oculorum vestrorum, et super quo pavet anima vestra: filii vestri, et filiae vestrae, quas reliquistis, gladio cadent."
      en: "Speak to the house of Israel: Thus saith the Lord God: Behold I will profane my sanctuary, the glory of your realm, and the thing that your eyes desire, and for which your soul feareth: your sons, and your daughters, whom you have left, shall fall by the sword."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et facietis sicut feci: ora amictu non velabitis, et cibos lugentium non comedetis:"
      en: "And you shall do as I have done: you shall not cover your faces, nor shall you eat the meat of mourners."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "coronas habebitis in capitibus vestris, et calceamenta in pedibus: non plangetis, neque flebitis, sed tabescetis in iniquitatibus vestris, et unusquisque gemet ad fratrem suum."
      en: "You shall have crowns on your heads, and shoes on your feet: you shall not lament nor weep, but you shall pine away for your iniquities, and every one shall sigh with his brother."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Eritque Ezechiel vobis in portentum: juxta omnia quae fecit, facietis cum venerit istud: et scietis quia ego Dominus Deus."
      en: "And Ezechiel shall be unto you for a sign of things to come: according to all that he hath done, so shall you do, when this shall come to pass: and you shall know that I am the Lord God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et tu, fili hominis, ecce in die qua tollam ab eis fortitudinem eorum, et gaudium dignitatis, et desiderium oculorum eorum, super quo requiescunt animae eorum, filios et filias eorum:"
      en: "And thou, O son of man, behold in the day wherein I will take away from them their strength, and the joy of their glory, and the desire of their eyes, upon which their souls rest, their sons and their daughters."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "in die illa, cum venerit fugiens ad te ut annuntiet tibi:"
      en: "In that day when he that escapeth shall come to thee, to tell thee:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "in die, inquam illa, aperietur os tuum cum eo qui fugit: et loqueris, et non silebis ultra: erisque eis in portentum, et scietis quia ego Dominus."
      en: "In that day, I say, shall thy mouth be opened to him that hath escaped, and thou shalt speak, and shalt be silent no more: and thou shalt be unto them for a sign of things to come, and you shall know that I am the Lord."
    status: { la: verified, en: verified }
