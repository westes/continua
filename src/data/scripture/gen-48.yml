# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 48
verses:
  - n: 1
    text:
      la: "His ita transactis, nuntiatum est Joseph quod aegrotaret pater suus: qui, assumptis duobus filiis Manasse et Ephraim, ire perrexit."
      en: "After these things, it was told Joseph that his father was sick: and he set out to go to him, taking his two sons Manasses and Ephraim."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dictumque est seni: Ecce filius tuus Joseph venit ad te. Qui confortatus sedit in lectulo."
      en: "And it was told the old man: Behold thy son Joseph cometh to thee. And being strengthened he sat on his bed."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ingresso ad se ait: Deus omnipotens apparuit mihi in Luza, quae est in terra Chanaan: benedixitque mihi,"
      en: "And when Joseph was come in to him, he said: God Almighty appeared to me at Luza, which is in the land of Chanaan: and he blessed me,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ait: Ego te augebo et multiplicabo, et faciam te in turbas populorum: daboque tibi terram hanc, et semini tuo post te in possessionem sempiternam."
      en: "And he said: I will cause thee to increase and multiply, and I will make of thee a multitude of people: and I will give this land to thee, and to thy seed after thee for an everlasting possession."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Duo ergo filii tui, qui nati sunt tibi in terra Aegypti antequam huc venirem ad te, mei erunt: Ephraim et Manasses, sicut Ruben et Simeon reputabuntur mihi."
      en: "So thy two sons who were born to thee in the land of Egypt before I came hither to thee, shall be mine: Ephraim and Manasses shall be reputed to me as Ruben and Simeon."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Reliquos autem quos genueris post eos, tui erunt, et nomine fratrum suorum vocabuntur in possessionibus suis."
      en: "But the rest whom thou shalt have after them, shall be thine, and shall be called by the name of their brethren in their possessions."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Mihi enim, quando veniebam de Mesopotamia, mortua est Rachel in terra Chanaan in ipso itinere, eratque vernum tempus: et ingrediebar Ephratam, et sepelivi eam juxta viam Ephratae, quae alio nomine appellatur Bethlehem."
      en: "For, when I came out of Mesopotamia, Rachel died from me in the land of Chanaan in the very journey, and it was springtime: and I was going to Ephrata, and I buried her near the way of Ephrata, which by another name is called Bethlehem."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Videns autem filios ejus dixit ad eum: Qui sunt isti?"
      en: "Then seeing his sons, he said to him: Who are these?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Respondit: Filii mei sunt, quos donavit mihi Deus in hoc loco. Adduc, inquit, eos ad me, ut benedicam illis."
      en: "He answered: They are my sons, whom God hath given me in this place. And he said: Bring them to me that I may bless them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Oculi enim Israel caligabant prae nimia senectute, et clare videre non poterat. Applicitosque ad se, deosculatus et circumplexus eos,"
      en: "For Israel's eyes were dim by reason of his great age, and he could not see clearly. And when they were brought to him, he kissed and embraced them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixit ad filium suum: Non sum fraudatus aspectu tuo: insuper ostendit mihi Deus semen tuum."
      en: "And said to his son: I am not deprived of seeing thee: moreover God hath shewed me thy seed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cumque tulisset eos Joseph de gremio patris, adoravit pronus in terram."
      en: "And when Joseph had taken them from his father's lap, he bowed down with his face to the ground."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et posuit Ephraim ad dexteram suam, id est, ad sinistram Israel: Manassen vero in sinistra sua, ad dexteram scilicet patris, applicuitque ambos ad eum."
      en: "And he set Ephraim on his right hand, that is, towards the left hand of Israel; but Manasses on his left hand, to wit, towards his father's right hand, and brought them near to him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui extendens manum dexteram, posuit super caput Ephraim minoris fratris: sinistram autem super caput Manasse qui major natu erat, commutans manus."
      en: "But he stretching forth his right hand, put it upon the head of Ephraim the younger brother; and the left upon the head of Manasses who was the elder, changing his hands."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Benedixitque Jacob filiis Joseph, et ait: Deus, in cujus conspectu ambulaverunt patres mei Abraham, et Isaac; Deus qui pascit me ab adolescentia mea usque in praesentem diem:"
      en: "And Jacob blessed the sons of Joseph, and said: God, in whose sight my fathers Abraham and Isaac walked, God that feedeth me from my youth until this day;"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "angelus, qui eruit me de cunctis malis, benedicat pueris istis: et invocetur super eos nomen meum, nomina quoque patrum meorum Abraham et Isaac, et crescant in multitudinem super terram."
      en: "The angel that delivereth me from all evils, bless these boys: and let my name be called upon them, and the names of my fathers Abraham, and Isaac, and may they grow into a multitude upon the earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Videns autem Joseph quod posuisset pater suus dexteram manum super caput Ephraim, graviter accepit: et apprehensam manum patris levare conatus est de capite Ephraim, et transferre super caput Manasse."
      en: "And Joseph seeing that his father had put his right hand upon the head of Ephraim, was much displeased: and taking his father's hand he tried to lift it from Ephraim's head, and to remove it to the head of Manasses."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dixitque ad patrem: Non ita convenit, pater: quia hic est primogenitus, pone dexteram tuam super caput ejus."
      en: "And he said to his father: It should not be so, my father: for this is the firstborn, put thy right hand upon his head."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Qui renuens, ait: Scio, fili mi, scio: et iste quidem erit in populos, et multiplicabitur: sed frater ejus minor, major erit illo: et semen illius crescet in gentes."
      en: "But he refusing, said: I know, my son, I know: and this also shall become peoples, and shall be multiplied: but this younger brother shall be greater than he: and his seed shall grow into nations."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Benedixitque eis in tempore illo, dicens: In te benedicetur Israel, atque dicetur: Faciat tibi Deus sicut Ephraim, et sicut Manasse. Constituitque Ephraim ante Manassen."
      en: "And he blessed them at that time, saying: In thee shall Israel be blessed, and it shall be said: God do to thee as to Ephraim, and as to Manasses. And he set Ephraim before Manasses."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ait ad Joseph filium suum: En ego morior, et erit Deus vobiscum, reducetque vos ad terram patrum vestrorum."
      en: "And he said to Joseph his son: Behold I die, and God will be with you, and will bring you back into the land of your fathers."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Do tibi partem unam extra fratres tuos, quam tuli de manu Amorrhaei in gladio et arcu meo."
      en: "I give thee a portion above thy brethren, which I took out of the hand of the Amorrhite with my sword and bow."
    status: { la: verified, en: verified }
