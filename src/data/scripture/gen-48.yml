# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 48
verses:
  - n: 1
    text:
      la: "his ita transactis nuntiatum est Ioseph quod aegrotaret pater eius qui adsumptis duobus filiis Manasse et Ephraim ire perrexit"
      en: "After these things, it was told Joseph that his father was sick: and he set out to go to him, taking his two sons Manasses and Ephraim."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dictumque est seni ecce filius tuus Ioseph venit ad te qui confortatus sedit in lectulo"
      en: "And it was told the old man: Behold I thy son Joseph cometh to thee. And being strengthened he sat on his bed."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ingresso ad se ait Deus omnipotens apparuit mihi in Luza quae est in terra Chanaan benedixitque mihi"
      en: "And when Joseph was come in to him, he said : God Almighty appeared to me at Lute, which is in the land of Chanaan: and he blessed me,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ait ego te augebo et multiplicabo et faciam in turbas populorum daboque tibi terram hanc et semini tuo post te in possessionem sempiternam"
      en: "And he said : I will cause thee to increase and multiply, and I will make of thee a multitude of people: and I will give this land to thee, and to thy seed after thee for an everlasting possession."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "duo igitur filii tui qui nati sunt tibi in terra Aegypti antequam huc venirem ad te mei erunt Ephraim et Manasses sicut Ruben et Symeon reputabuntur mihi"
      en: "So thy two sons who were born to thee in the land of Egypt before I came hither to thee, shall be mine: Ephraim and Manasses shall be reputed to me as Ruben and Simeon."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "reliquos autem quos genueris post eos tui erunt et nomine fratrum suorum vocabuntur in possessionibus suis"
      en: "But the rest whom thou shalt have after them, shall be thine, and shall be called by the name of their brethren in their possessions."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "mihi enim quando veniebam de Mesopotamiam mortua est Rahel in terra Chanaan in ipso itinere eratque vernum tempus et ingrediebar Ephratam et sepelivi eam iuxta viam Ephratae quae alio nomine appellatur Bethleem"
      en: "For, when I came out of Mesopotamia, Rachel died from me in the land of Ohanaan in the very journey, and it was springtime: and I was going to Ephrata, and I buried her near the way of Ephrata, which by another name is called Bethlehem."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "videns autem filios eius dixit ad eum qui sunt isti"
      en: "Then seeing his sons, he said to him: Who are these?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "respondit filii mei sunt quos dedit mihi Deus in hoc loco adduc inquit eos ad me ut benedicam illis"
      en: "He answered: They are my sons, whom God hath given me in this place. And he said: Bring them to me that I may bless them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "oculi enim Israhel caligabant prae nimia senectute et clare videre non poterat adplicitosque ad se deosculatus et circumplexus"
      en: "For Israel's eyes were dim by reason of his great age, and he could not see clearly. And when they were brought to him, he kissed and embraced them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixit ad filium non sum fraudatus aspectu tuo insuper ostendit mihi Deus semen tuum"
      en: "And said to his son: I am not deprived of seeing thee: moreover God hath shewed me thy seed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cumque tulisset eos Ioseph de gremio patris adoravit pronus in terram"
      en: "And when Joseph had taken them from his father's lap, he bowed down with his face to the ground."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et posuit Ephraim ad dexteram suam id est ad sinistram Israhel Manassen vero in sinistra sua ad dexteram scilicet patris adplicuitque ambos ad eum"
      en: "And he set Ephraim on his right bend, that is, towards the left hand of Israel; but Manasses on his left hand, to wit, towards his father's right hand, and brought them near to him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui extendens manum dextram posuit super caput Ephraim iunioris fratris sinistram autem super caput Manasse qui maior natu erat commutans manus"
      en: "But he stretching forth his right hand, put it upon the head of Ephraim the younger brother; and the left upon the head of Manasses who was the elder, changing his hands."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "benedixitque Ioseph filio suo et ait Deus in cuius conspectu ambulaverunt patres mei Abraham et Isaac Deus qui pascit me ab adulescentia mea usque in praesentem diem"
      en: "And Jacob blessed the sons of Joseph, and said: God, in whose sight my fathers Abraham and Isaac walked, God that feedeth me from my youth until this day;"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "angelus qui eruit me de cunctis malis benedicat pueris et invocetur super eos nomen meum nomina quoque patrum meorum Abraham et Isaac et crescant in multitudinem super terram"
      en: "The angel that delivereth me from all evils, bless these boys: and let my name be called upon them, and the names of my fathers Abraham, and Isaac, and may they grow into a multitude upon the earth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "videns autem Ioseph quod posuisset pater suus dexteram manum super caput Ephraim graviter accepit et adprehensam patris manum levare conatus est de capite Ephraim et transferre super caput Manasse"
      en: "And Joseph seeing that his father had put his right hand upon the head of Ephraim, was much displeased: and taking his father's hand he tried to lift it from Ephraims head, and to remove it to the head of Manasses."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixitque ad patrem non ita convenit pater quia hic est primogenitus pone dexteram tuam super caput eius"
      en: "And he said to his father: It should not be so, my father: for this is the first- born, put thy right hand upon his head."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui rennuens ait scio fili mi scio et iste quidem erit in populos et multiplicabitur sed frater eius iunior maior illo erit et semen illius crescet in gentes"
      en: "But he refusing, said: I know, my son, I know: and this also shall become peoples, and shall be multiplied: but this younger brother shall be greater than he: and his seed shall grow into nations."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "benedixitque eis in ipso tempore dicens in te benedicetur Israhel atque dicetur faciat tibi Deus sicut Ephraim et sicut Manasse constituitque Ephraim ante Manassen"
      en: "And he blessed them at that time, saying: In thee shall Israel be blessed, and it shall be said: God do to thee as to Ephraim, and as to Manasses. And he set Ephraim before Manasses."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et ait ad Ioseph filium suum en ego morior et erit Deus vobiscum reducetque vos ad terram patrum vestrorum"
      en: "And he said to Joseph his son: Be- hold I die, and God will be with you, and will bring you back into the land of your fathers."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "do tibi partem unam extra fratres tuos quam tuli de manu Amorrei in gladio et arcu meo"
      en: "I give thee a portion above thy brethren, which I took out of the hand of the Amorrhite a with my sword and bow."
    status: { la: verified, en: verified }
