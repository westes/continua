# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdc
chapter: 15
verses:
  - n: 1
    text:
      la: "post aliquantum autem temporis cum dies triticeae messis instarent venit Samson invisere volens uxorem suam et adtulit ei hedum de capris cumque cubiculum eius solito vellet intrare prohibuit eum pater illius dicens"
      en: "And a while after, when the days of the wheat harvest were at hand, Samson came, meaning to visit his wife, and he brought her a kid of the flock. And when he would have gone into her chamber as usual, her father would not suffer him, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "putavi quod odisses eam et ideo tradidi illam amico tuo sed habet sororem quae iunior et pulchrior illa est sit tibi pro ea uxor"
      en: "I thought thou hadst hated her, and therefore I gave her to thy friend: but she hath a sister, who is younger and fairer than she, take her to wife instead of her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cui respondit Samson ab hac die non erit culpa in me contra Philistheos faciam enim vobis mala"
      en: "And Samson answered him: From this day I shall be blameless in what I do against the Philistines: for I will do you evils."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "perrexitque et cepit trecentas vulpes caudasque earum iunxit ad caudas et faces ligavit in medio"
      en: "And he went and caught three hundred foxes, and coupled them tail to tail, and fastened torches between the tails."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quas igne succendens dimisit ut huc illucque discurrerent quae statim perrexerunt in segetes Philisthinorum quibus succensis et conportatae iam fruges et adhuc stantes in stipula concrematae sunt in tantum ut vineas quoque et oliveta flamma consumeret"
      en: "And setting them on fire he let the foxes go, that they might run about hither and thither. And they presently went into the standing corn of the Philistines. Which being set on fire, both the corn that was already carried together, and that which was yet standing, was all burnt, insomuch, that the flame consumed also the vineyards and the oliveyards."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixeruntque Philisthim quis fecit hanc rem quibus dictum est Samson gener Thamnathei quia tulit uxorem eius et alteri tradidit haec operatus est ascenderuntque Philisthim et conbuserunt tam mulierem quam patrem eius"
      en: "Then the Philistines said: Who hath done this thing? And it was answered: Samson the son in law of the Thamnathite, because he took away his wife, and gave her to another, hath done these things. And the Philistines went up and burnt both the woman and her father."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quibus ait Samson licet haec feceritis tamen adhuc ex vobis expetam ultionem et tunc quiescam"
      en: "But Samson said to them: Although you have done this, yet will I be revenged of you, and then I will be quiet."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "percussitque eos ingenti plaga ita ut stupentes suram femori inponerent et descendens habitavit in spelunca petrae Aetham"
      en: "And he made a great slaughter of them, so that in astonishment they laid the calf of the leg upon the thigh. And going down he dwelt in a cavern of the rock Etam."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "igitur ascendentes Philisthim in terra Iuda castrametati sunt et in loco qui postea vocatus est Lehi id est Maxilla eorum est fusus exercitus"
      en: "Then the Philistines going up into the land of Juda, camped in the place which afterwards was called Lechi, that is, the Jawbone, where their army was spread."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixeruntque ad eos de tribu Iuda cur ascendistis adversum nos qui responderunt ut ligemus Samson venimus et reddamus ei quae in nos operatus est"
      en: "And the men of the tribe of Juda said to them: Why are you come up against us? They answered: We are come to bind Samson, and to pay him for what he hath done against us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "descenderunt ergo tria milia virorum de Iuda ad specum silicis Aetham dixeruntque ad Samson nescis quod Philisthim imperent nobis quare hoc facere voluisti quibus ille ait sicut fecerunt mihi feci eis"
      en: "Wherefore three thousand men of Juda, went down to the cave of the rock Etam, and said to Samson: Knowest thou not that the Philistines rule over us? Why wouldst thou do thus? And he said to them: As they did to me, so have I done to them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ligare inquiunt te venimus et tradere in manus Philisthinorum iurate respondit mihi quod non me occidatis"
      en: "And they said to him, We are come to bind thee and to deliver thee into the hands of the Philistines. And Samson said to them: Swear to me, and promise me, that you will not kill me."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixerunt non te occidimus sed vinctum tradimus ligaveruntque eum duobus novis funibus et tulerunt de petra Aetham"
      en: "They said: We will not kill thee: but we will deliver thee up bound. And they bound him with two new cords, and brought him from the rock Etam."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui cum venisset ad locum Maxillae et Philisthim vociferantes occurrissent ei inruit spiritus Domini in eum et sicut solent ad odorem ignis lina consumi ita vincula quibus ligatus erat dissipata sunt et soluta"
      en: "Now when he was come to the place of the Jawbone, and the Philistines shouting went to meet him, the spirit of the Lord came strongly upon him: and as the flax is wont to be consumed at the approach of fire, so the bands with which he was bound were broken and loosed."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "inventamque maxillam id est mandibulam asini quae iacebat arripiens interfecit in ea mille viros"
      en: "And finding a jawbone, even the jawbone of an ass which lay there, catching it up, be slew therewith a thousand men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ait in maxilla asini in mandibula pulli asinarum delevi eos et percussi mille viros"
      en: "And he said: With the jawbone of an ass, with the jaw of the colt of asses I have destroyed them, and have slain a thousand men."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cumque haec canens verba conplesset proiecit mandibulam de manu et vocavit nomen loci illius Ramathlehi quod interpretatur elevatio Maxillae"
      en: "And when he had ended these words singing, he threw the jawbone out of his hand, and called the name of that place Ramathlechi, which is interpreted the lifting up of the jawbone."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sitiensque valde clamavit ad Dominum et ait tu dedisti in manu servi tui salutem hanc maximam atque victoriam et en siti morior incidamque in manus incircumcisorum"
      en: "Arid being very thirsty, he cried to the Lord, and said: Thou hast given this very great deliverance and victory into the hand of thy servant: and behold I die for thirst, and shall fall into the hands of the uncircumcised."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "aperuit itaque Dominus molarem dentem in maxilla asini et egressae sunt ex eo aquae quibus haustis refocilavit spiritum et vires recepit idcirco appellatum est nomen loci illius Fons invocantis de maxilla usque in praesentem diem"
      en: "Then the Lord opened a great tooth in the jaw of the ass, and waters issued out of it. And when he had drank them he refreshed his spirit, and recovered his strength. Therefore the name of that place was called, The Spring of him that invoked from the jawbone, until this present day."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "iudicavitque Israhel in diebus Philisthim viginti annis"
      en: "And he judged Israel in the days of the Philistines twenty years."
    status: { la: verified, en: verified }
