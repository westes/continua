# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 15
verses:
  - n: 1
    text:
      la: "Post aliquantulum autem temporis, cum dies triticeae messis instarent, venit Samson, invisere volens uxorem suam, et attulit ei haedum de capris. Cumque cubiculum ejus solito vellet intrare, prohibuit eum pater illius, dicens:"
      en: "And a while after, when the days of the wheat harvest were at hand, Samson came, meaning to visit his wife, and he brought her a kid of the flock. And when he would have gone into her chamber as usual, her father would not suffer him, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Putavi quod odisses eam, et ideo tradidi illam amico tuo: sed habet sororem, quae junior et pulchrior illa est: sit tibi pro ea uxor."
      en: "I thought thou hadst hated her, and therefore I gave her to thy friend: but she hath a sister, who is younger and fairer than she, take her to wife instead of her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cui Samson respondit: Ab hac die non erit culpa in me contra Philisthaeos: faciam enim vobis mala."
      en: "And Samson answered him: From this day I shall be blameless in what I do against the Philistines: for I will do you evils."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Perrexitque et cepit trecentas vulpes, caudasque earum junxit ad caudas, et faces ligavit in medio:"
      en: "And he went and caught three hundred foxes, and coupled them tail to tail, and fastened torches between the tails."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quas igne succendens, dimisit ut huc illucque discurrerent. Quae statim perrexerunt in segetes Philisthinorum. Quibus succensis, et comportatae jam fruges, et adhuc stantes in stipula, concrematae sunt, in tantum ut vineas quoque et oliveta flamma consumeret."
      en: "And setting them on fire he let the foxes go, that they might run about hither and thither. And they presently went into the standing corn of the Philistines. Which being set on fire, both the corn that was already carried together, and that which was yet standing, was all burnt, insomuch, that the flame consumed also the vineyards and the oliveyards."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixeruntque Philisthiim: Quis fecit hanc rem? Quibus dictum est: Samson gener Thamnathaei: quia tulit uxorem ejus, et alteri tradidit, haec operatus est. Ascenderuntque Philisthiim, et combusserunt tam mulierem quam patrem ejus."
      en: "Then the Philistines said: Who hath done this thing? And it was answered: Samson the son in law of the Thamnathite, because he took away his wife, and gave her to another, hath done these things. And the Philistines went up and burnt both the woman and her father."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quibus ait Samson: Licet haec feceritis, tamen adhuc ex vobis expetam ultionem, et tunc quiescam."
      en: "But Samson said to them: Although you have done this, yet will I be revenged of you, and then I will be quiet."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Percussitque eos ingenti plaga, ita ut stupentes suram femori imponerent. Et descendens habitavit in spelunca petrae Etam."
      en: "And he made a great slaughter of them, so that in astonishment they laid the calf of the leg upon the thigh. And going down he dwelt in a cavern of the rock Etam."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Igitur ascendentes Philisthiim in terram Juda, castrametati sunt in loco, qui postea vocatus est Lechi, id est, Maxilla, ubi eorum effusus est exercitus."
      en: "Then the Philistines going up into the land of Juda, camped in the place which afterwards was called Lechi, that is, the Jawbone, where their army was spread."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dixeruntque ad eos de tribu Juda: Cur ascendistis adversum nos? Qui responderunt: Ut ligemus Samson venimus, et reddamus ei quae in nos operatus est."
      en: "And the men of the tribe of Juda said to them: Why are you come up against us? They answered: We are come to bind Samson, and to pay him for what he hath done against us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Descenderunt ergo tria millia virorum de Juda ad specum silicis Etam, dixeruntque ad Samson: Nescis quod Philisthiim imperent nobis? quare hoc facere voluisti? Quibus ille ait: Sicut fecerunt mihi, sic feci eis."
      en: "Wherefore three thousand men of Juda, went down to the cave of the rock Etam, and said to Samson: Knowest thou not that the Philistines rule over us? Why wouldst thou do thus? And he said to them: As they did to me, so have I done to them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ligare, inquiunt, te venimus, et tradere in manus Philisthinorum. Quibus Samson: Jurate, ait, et spondete mihi quod non occidatis me."
      en: "And they said to him, We are come to bind thee and to deliver thee into the hands of the Philistines. And Samson said to them: Swear to me, and promise me, that you will not kill me."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixerunt: Non te occidemus, sed vinctum trademus. Ligaveruntque eum duobus novis funibus, et tulerunt eum de petra Etam."
      en: "They said: We will not kill thee: but we will deliver thee up bound. And they bound him with two new cords, and brought him from the rock Etam."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui cum venisset ad locum Maxillae, et Philisthiim vociferantes occurrissent ei, irruit spiritus Domini in eum: et sicut solent ad odorem ignis lina consumi, ita vincula quibus ligatus erat, dissipata sunt et soluta."
      en: "Now when he was come to the place of the Jawbone, and the Philistines shouting went to meet him, the spirit of the Lord came strongly upon him: and as the flax is wont to be consumed at the approach of fire, so the bands with which he was bound were broken and loosed."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Inventamque maxillam, id est, mandibulam asini, quae jacebat, arripiens interfecit in ea mille viros,"
      en: "And finding a jawbone, even the jawbone of an ass which lay there, catching it up, he slew therewith a thousand men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ait: In maxilla asini, in mandibula pulli asinarum delevi eos, et percussi mille viros."
      en: "And he said: With the jawbone of an ass, with the jaw of the colt of asses I have destroyed them, and have slain a thousand men."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cumque haec verba canens complesset, projecit mandibulam de manu, et vocavit nomen loci illius Ramathlechi, quod interpretatur, Elevatio maxillae."
      en: "And when he had ended these words singing, he threw the jawbone out of his hand, and called the name of that place Ramathlechi, which is interpreted the lifting up of the jawbone."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Sitiensque valde, clamavit ad Dominum, et ait: Tu dedisti in manu servi tui salutem hanc maximam atque victoriam: en siti morior, incidamque in manus incircumcisorum."
      en: "And being very thirsty, he cried to the Lord, and said: Thou hast given this very great deliverance and victory into the hand of thy servant: and behold I die for thirst, and shall fall into the hands of the uncircumcised."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Aperuit itaque Dominus molarem dentem in maxilla asini, et egressae sunt ex eo aquae. Quibus haustis, refocillavit spiritum, et vires recepit. Idcirco appellatum est nomen loci illius, Fons invocantis de maxilla, usque in praesentem diem."
      en: "Then the Lord opened a great tooth in the jaw of the ass, and waters issued out of it. And when he had drank them he refreshed his spirit, and recovered his strength. Therefore the name of that place was called, The Spring of him that invoked from the jawbone, until this present day."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Judicavitque Israel in diebus Philisthiim viginti annis."
      en: "And he judged Israel in the days of the Philistines twenty years."
    status: { la: verified, en: verified }
