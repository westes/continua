# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 28
verses:
  - n: 1
    text:
      la: "sin autem audieris vocem Domini Dei tui ut facias atque custodias omnia mandata eius quae ego praecipio tibi hodie faciet te Dominus Deus tuus excelsiorem cunctis gentibus quae versantur in terra"
      en: "Now if thou wilt hear the voice of the Lord thy God, to do and keep all his commandments, which I command thee this day, the Lord thy God will make thee higher than all the nations that are on the earth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "venientque super te universae benedictiones istae et adprehendent te si tamen praecepta eius audieris"
      en: "And all these blessings shall come upon thee and overtake thee: yet so if thou hear his precepts,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "benedictus tu in civitate et benedictus in agro"
      en: "Blessed shalt thou be in the city, and blessed in the field."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "benedictus fructus ventris tui et fructus terrae tuae fructusque iumentorum tuorum greges armentorum et caulae ovium tuarum"
      en: "Blessed shall be the fruit of thy womb, and the fruit of thy ground, and the fruit of thy cattle, the droves of thy herds, and the folds of thy sheep."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "benedicta horrea tua et benedictae reliquiae tuae"
      en: "Blessed shall be thy barns and blessed thy stores."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "benedictus eris et ingrediens et egrediens"
      en: "Blessed shalt thou be coming in and going out."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dabit Dominus inimicos tuos qui consurgunt adversum te corruentes in conspectu tuo per unam viam venient contra te et per septem fugient a facie tua"
      en: "The Lord shall cause thy enemies, that rise up against thee, to fall down before thy face: one way shall they come out against thee, and seven ways shall they flee before thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "emittet Dominus benedictionem super cellaria tua et super omnia opera manuum tuarum benedicetque tibi in terra quam acceperis"
      en: "The Lord will send forth a blessing upon thy storehouses, and upon all the works of thy hands: and will bless thee in the land that thou shalt receive."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "suscitabit te Dominus sibi in populum sanctum sicut iuravit tibi si custodieris mandata Domini Dei tui et ambulaveris in viis eius"
      en: "The Lord will raise thee up to be a holy people to himself, as he swore to thee: if thou keep the commandments of the Lord thy God, and walk in his ways."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "videbuntque omnes terrarum populi quod nomen Domini invocatum sit super te et timebunt te"
      en: "And all the people of the earth shall see that the name of the Lord is invocated upon thee, and they shall fear thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "abundare te faciet Dominus omnibus bonis fructu uteri tui et fructu iumentorum tuorum fructu terrae tuae quam iuravit Dominus patribus tuis ut daret tibi"
      en: "The Lord will make thee abound with all goods, with the fruit of thy womb, and the fruit of thy cattle, with the fruit of thy land, which the Lord swore to thy fathers that he would give thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "aperiet Dominus thesaurum suum optimum caelum ut tribuat pluviam terrae tuae in tempore suo benedicet cunctis operibus manuum tuarum et fenerabis gentibus multis et ipse a nullo fenus accipies"
      en: "The Lord will open his excellent treasure, the heaven, that it may give rain in due season: and he will bless all the works of thy hands. And thou shalt lend to many nations, and shalt not borrow of any one."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "constituet te Dominus in caput et non in caudam et eris semper supra et non subter si audieris mandata Domini Dei tui quae ego praecipio tibi hodie et custodieris et feceris"
      en: "And the Lord shall make thee the head and not the tail: and thou shalt be always above, and not beneath: yet so if thou wilt hear the commandments of the Lord thy God which I command thee this day, and keep and do them,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ac non declinaveris ab eis nec ad dextram nec ad sinistram nec secutus fueris deos alienos neque colueris eos"
      en: "And turn not away from them neither to the right hand, nor to the left, nor follow strange gods, nor worship them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quod si audire nolueris vocem Domini Dei tui ut custodias et facias omnia mandata eius et caerimonias quas ego praecipio tibi hodie venient super te omnes maledictiones istae et adprehendent te"
      en: "But if thou wilt not hear the voice of the Lord thy God, to keep and to do all his commandments and ceremonies, which I command thee this day, all these curses shall come upon thee, and overtake thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "maledictus eris in civitate maledictus in agro"
      en: "Cursed shalt thou be in the city, cursed in the field."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "maledictum horreum tuum et maledictae reliquiae tuae"
      en: "Cursed shall be thy barn, and cursed thy stores."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "maledictus fructus ventris tui et fructus terrae tuae armenta boum tuorum et greges ovium tuarum"
      en: "Cursed shall be the fruit of thy womb, and the fruit of thy ground, the herds of thy oxen, and the flocks of thy sheep."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "maledictus eris ingrediens et maledictus egrediens"
      en: "Cursed shalt thou be coming in, and cursed going out."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "mittet Dominus super te famem et esuriem et increpationem in omnia opera tua quae facies donec conterat te et perdat velociter propter adinventiones tuas pessimas in quibus reliquisti me"
      en: "The Lord shall send upon thee famine and hunger, and a rebuke upon all the works which thou shalt do: until he consume and destroy thee quickly, for thy most wicked inventions, by which thou hast forsaken me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "adiungat Dominus tibi pestilentiam donec consumat te de terra ad quam ingredieris possidendam"
      en: "May the Lord set the pestilence upon thee, until he consume thee out of the land, which thou shalt go in to possess."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "percutiat te Dominus egestate febri et frigore ardore et aestu et aere corrupto ac robigine et persequatur donec pereas"
      en: "May the Lord afflict thee with miser- able want, with the fever and with cold, with burning and with heat, and with corrupted air and with blasting, and pursue thee till thou perish."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sit caelum quod supra te est aeneum et terra quam calcas ferrea"
      en: "Be the heaven, that is over thee, of brass: and the ground thou treadest on, of iron."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "det Dominus imbrem terrae tuae pulverem et de caelo descendat super te cinis donec conteraris"
      en: "The Lord give thee dust for rain upon thy land, and let ashes come down from heaven upon thee, till thou be consumed."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "tradat te Dominus corruentem ante hostes tuos per unam viam egrediaris contra eos et per septem fugias et dispergaris per omnia regna terrae"
      en: "The Lord make thee to fall down before thy enemies, one way mayst thou go out against them, and flee seven ways, and be scattered throughout all the kingdoms of the earth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "sitque cadaver tuum in escam cunctis volatilibus caeli et bestiis terrae et non sit qui abigat"
      en: "And be thy carcass meat for all the Fowls of the air, and the beasts of the earth, and be there none to drive them away."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "percutiat te Dominus ulcere Aegypti et parte corporis per quam stercora digeruntur scabie quoque et prurigine ita ut curari nequeas"
      en: "The Lord strike thee with the ulcer of Egypt, and the part of thy body, by which the dung is cast out, with the scab and with the itch : so that thou canst not be healed."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "percutiat te Dominus amentia et caecitate ac furore mentis"
      en: "The Lord strike thee with madness and blindness and fury of mind."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et palpes in meridie sicut palpare solet caecus in tenebris et non dirigas vias tuas omnique tempore calumniam sustineas et opprimaris violentia nec habeas qui liberet te"
      en: "And mayst thou grope at midday as the blind is wont to grope in the dark, and not make straight thy ways. And mayst thou at all times suffer wrong, and be oppressed with violence, and mayst thou have no one to deliver thee."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "uxorem accipias et alius dormiat cum ea domum aedifices et non habites in ea plantes vineam et non vindemies eam"
      en: "Mayst thou take a wife, and another sleep with her. Mayst thou build a house, and not dwell therein. Mayest thou plant a vineyard and not gather the vintage thereof."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "bos tuus immoletur coram te et non comedas ex eo asinus tuus rapiatur in conspectu tuo et non reddatur tibi oves tuae dentur inimicis tuis et non sit qui te adiuvet"
      en: "May thy ox be slain before thee, and thou not eat thereof. May thy ass be taken away in thy sight, and not restored to thee. May thy sheep be given to thy enemies, and may there be none to help thee."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "filii tui et filiae tuae tradantur alteri populo videntibus oculis tuis et deficientibus ad conspectum eorum tota die et non sit fortitudo in manu tua"
      en: "May thy sons and thy daughters be given to another people, thy eyes looking on, and languishing at the sight of them all the day, and may there be no strength in thy hand."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "fructus terrae tuae et omnes labores tuos comedat populus quem ignoras et sis semper calumniam sustinens et oppressus cunctis diebus"
      en: "May a people which thou knowest not, eat the fruits of thy land, and all thy labours: and mayst thou always suffer oppression, and be crushed at all times."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et stupens ad terrorem eorum quae videbunt oculi tui"
      en: "And be astonished at the terror of those things which thy eyes shall see:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "percutiat te Dominus ulcere pessimo in genibus et in suris sanarique non possis a planta pedis usque ad verticem tuum"
      en: "May the Lord strike thee with a very sore ulcer in the knees and in the legs, and be thou incurable from the sole of the foot to the top of the head."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "ducet Dominus te et regem tuum quem constitueris super te in gentem quam ignoras tu et patres tui et servies ibi diis alienis ligno et lapidi"
      en: "The Lord shall bring thee, and thy king, whom thou shalt have appointed over thee, into a nation which thou and thy fathers know not: and there thou shalt serve strange gods, wood and stone."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et eris perditus in proverbium ac fabulam omnibus populis ad quos te introduxerit Dominus"
      en: "And thou shalt be lost, as a proverb and a byword to all people, among whom the Lord shall bring thee in."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "sementem multam iacies in terram et modicum congregabis quia lucustae omnia devorabunt"
      en: "Thou shalt cast much seed into the ground, and gather little: because the locusts shall consume all."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "vineam plantabis et fodies et vinum non bibes nec colliges ex ea quippiam quoniam vastabitur vermibus"
      en: "Thou shalt plant a vineyard, and dig it, and shalt not drink the wine, nor gather any thing thereof: because it shall be wasted with worms."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "olivas habebis in omnibus terminis tuis et non ungueris oleo quia defluent et peribunt"
      en: "Thou shalt have olive trees in all thy borders, and shalt not be anointed with the oil: for the olives shall fall off and perish."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "filios generabis et filias et non frueris eis quoniam ducentur in captivitatem"
      en: "Thou shalt beget sons and daughters, and shalt not enjoy them: because they shall be led into captivity."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "omnes arbores tuas et fruges terrae tuae robigo consumet"
      en: "The blast shall consume all the trees and the fruits of thy ground."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "advena qui tecum versatur in terra ascendet super te eritque sublimior tu autem descendes et eris inferior"
      en: "The stranger that liveth with thee in the land, shall rise up over thee, and shall be higher: and thou shalt go down, and be lower."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "ipse fenerabit tibi et tu non fenerabis ei ipse erit in caput et tu eris in caudam"
      en: "He shall lend to thee, and thou shalt not lend to him. He shall be as the head, and thou shalt be the tail."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et venient super te omnes maledictiones istae et persequentes adprehendent te donec intereas quia non audisti vocem Domini Dei tui nec servasti mandata eius et caerimonias quas praecepit tibi"
      en: "And all these curses shall come upon thee, and shall pursue and overtake thee, till thou perish: because thou heardst not the voice of the Lord thy God, and didst not keep his commandments and ceremonies which he commanded thee."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et erunt in te signa atque prodigia et in semine tuo usque in sempiternum"
      en: "And they shall be as signs and wonders on thee, and on thy seed for ever."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "eo quod non servieris Domino Deo tuo in gaudio cordisque laetitia propter rerum omnium abundantiam"
      en: "Because thou didst not serve the Lord thy God with joy and gladness of heart, for the abundance of all things:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "servies inimico tuo quem inmittet Dominus tibi in fame et siti et nuditate et omnium penuria et ponet iugum ferreum super cervicem tuam donec te conterat"
      en: "Thou shalt serve thy enemy, whom the Lord will send upon thee, in hunger, and thirst, and nakedness, and in want of all things: and he shall put an iron yoke upon thy neck, till he consume thee."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "adducet Dominus super te gentem de longinquo et de extremis finibus terrae in similitudinem aquilae volantis cum impetu cuius linguam intellegere non possis"
      en: "The Lord will bring upon thee a nation from afar, and from the uttermost ends of the earth, like an eagle that flyeth swiftly, whose tongue thou canst not understand,"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "gentem procacissimam quae non deferat seni nec misereatur parvulo"
      en: "A most insolent nation, that will shew no regard to the ancients, nor have pity on the infant,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et devoret fructum iumentorum tuorum ac fruges terrae tuae donec intereas et non relinquat tibi triticum vinum et oleum armenta boum et greges ovium donec te disperdat"
      en: "And will devour the fruit of thy cattle, and the fruits of thy land: until thou be destroyed, and will leave thee no wheat, nor wine, nor oil, nor herds of oxen, nor flocks of sheep: until he destroy thee."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et conterat in cunctis urbibus tuis et destruantur muri tui firmi atque sublimes in quibus habebas fiduciam in omni terra tua obsideberis intra portas tuas in omni terra quam dabit tibi Dominus Deus tuus"
      en: "And consume thee in all thy cities, end thy strong and high walls be brought down, wherein thou trustedst in all thy land. Thou shalt be besieged within thy gates in all thy land which the Lord thy God will give thee:"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et comedes fructum uteri tui et carnes filiorum et filiarum tuarum quas dedit tibi Dominus Deus tuus in angustia et vastitate qua opprimet te hostis tuus"
      en: "And thou shalt eat the fruit of thy womb, and the flesh of thy sons and of thy daughters, which the Lord thy God shall give thee, in the distress and extremity wherewith thy enemy shall oppress thee."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "homo delicatus in te et luxuriosus valde invidebit fratri suo et uxori quae cubat in sinu suo"
      en: "The man that is nice among you, and very delicate, shall envy his own brother, and his wife, that lieth in his bosom,"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "ne det eis de carnibus filiorum suorum quas comedet eo quod nihil habeat aliud in obsidione et penuria qua vastaverint te inimici tui intra omnes portas tuas"
      en: "So that he will not give them of the flesh of his children, which he shall eat: because he hath nothing else in the siege and the want, wherewith thy enemies shall distress thee within all thy gates."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "tenera mulier et delicata quae super terram ingredi non valebat nec pedis vestigium figere propter mollitiem et teneritudinem nimiam invidebit viro suo qui cubat in sinu eius super filii et filiae carnibus"
      en: "The tender and delicate woman, that could not go upon the ground, nor set down her foot for over much niceness and tenderness, will envy her husband who lieth in her bosom, the flesh of her son, and of her daughter,"
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "et inluvie secundarum quae egrediuntur de medio feminum eius et super liberis qui eadem hora nati sunt comedent enim eos clam propter rerum omnium penuriam in obsidione et vastitate qua opprimet te inimicus tuus intra portas tuas"
      en: "And the filth of the afterbirths, that come forth from between her thighs, and the children that are born the same hour. For they shall eat them secretly for the want of all things, in the siege and distress, wherewith thy enemy shall oppress thee within thy gates."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "nisi custodieris et feceris omnia verba legis huius quae scripta sunt in hoc volumine et timueris nomen eius gloriosum et terribile hoc est Dominum Deum tuum"
      en: "If thou wilt not keep, and fulfil all the words of this law, that are written in this volume, and fear his glorious and terrible name: that is, The Lord thy God:"
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "augebit Dominus plagas tuas et plagas seminis tui plagas magnas et perseverantes infirmitates pessimas et perpetuas"
      en: "The Lord shall increase thy plagues, and the plagues of thy seed, plagues great and lasting, infirmities grievous and perpetual."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "et convertet in te omnes adflictiones Aegypti quas timuisti et adherebunt tibi"
      en: "And he shall bring back on thee all the afflictions of Egypt, which thou wast afraid of, and they shall stick fast to thee."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "insuper et universos languores et plagas quae non sunt scriptae in volumine legis huius inducet Dominus super te donec te conterat"
      en: "Moreover the Lord will bring upon thee all the diseases, and plagues, that are not written in the volume of this law till he consume thee:"
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "et remanebitis pauci numero qui prius eratis sicut astra caeli prae multitudine quoniam non audisti vocem Domini Dei tui"
      en: "And you shall remain few in number, who before were as the stars of heaven for multitude, because thou heardst not the voice of the Lord thy God."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "et sicut ante laetatus est Dominus super vos bene vobis faciens vosque multiplicans sic laetabitur disperdens vos atque subvertens ut auferamini de terra ad quam ingredieris possidendam"
      en: "And as the Lord rejoiced upon you before doing good to you, and multiplying you: so he shall rejoice destroying and bringing you to nought, so that you shall be taken away from the land which thou shalt go in to possess."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "disperget te Dominus in omnes populos a summitate terrae usque ad terminos eius et servies ibi diis alienis quos et tu ignoras et patres tui lignis et lapidibus"
      en: "The Lord shall scatter thee among all people, from the farthest parts of the earth to the ends thereof: and there thou shalt serve strange gods, which both thou art ignorant of and thy fathers, wood and stone."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "in gentibus quoque illis non quiesces neque erit requies vestigio pedis tui dabit enim tibi Dominus ibi cor pavidum et deficientes oculos et animam maerore consumptam"
      en: "Neither shalt thou be quiet, even in those nations, nor shall there be any rest for the sole of thy foot. For the Lord will give thee a fearful heart, and languishing eyes, and a soul consumed with pensiveness:"
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "et erit vita tua quasi pendens ante te timebis nocte et die et non credes vitae tuae"
      en: "And thy life shall be as it were hanging before thee. Thou shalt fear night and day, neither shalt thou trust thy life."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "mane dices quis mihi det vesperum et vespere quis mihi det mane propter cordis tui formidinem qua terreberis et propter ea quae tuis videbis oculis"
      en: "In the morning thou shalt say: Who will grant me evening? and at evening: Who will grant me morning? for the fearfulness of thy heart, wherewith thou shalt be terrified, and for those things which thou shalt see with thy eyes."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "reducet te Dominus classibus in Aegyptum per viam de qua dixi tibi ut eam amplius non videres ibi venderis inimicis tuis in servos et ancillas et non erit qui emat"
      en: "The Lord shall bring thee again with ships into Egypt, by the way whereof he said to thee that thou shouldst see it no more. There shalt thou be set to sale to thy enemies for bondmen and bondwomen, and no man shall buy you."
    status: { la: verified, en: verified }
