# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 28
verses:
  - n: 1
    text:
      la: "qui vindicari vult a Deo inveniet vindictam et peccata illius servans servabit"
      en: "He that seeketh to revenge himself, shall find vengeance from the Lord, and he will surely keep his sins in remembrance."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "relinque proximo tuo nocenti te et tunc deprecanti tibi peccata solventur"
      en: "Forgive thy neighbour if he hath hurl thee: and then shall thy sins be forgiven to thee when thou prayest."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "homo homini servat iram et a Deo quaerit medellam"
      en: "Man to man reserveth anger, and doth he seek remedy of God?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et in hominem similem sibi non habet misericordiam et de peccatis suis deprecatur"
      en: "He hath no mercy on a man like himself, and doth he entreat for his own sins?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ipse dum caro sit reservat iram et propitiationem petit a Deo quis exorabit pro delictis illius"
      en: "He that is but flesh, nourisheth anger, and doth he ask forgiveness of God? who shall obtain pardon for his sins?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "memento novissimorum et desine inimicari"
      en: "Remember thy last things, and let enmity cease:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tabitudo enim et mors inminet in mandatis"
      en: "For corruption and death hang over in his commandments."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "memorare timorem Dei et non irascaris proximo"
      en: "Remember the fear of God, and be not angry with thy neighbour."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "memorare testamenti Altissimi et despice ignorantiam proximi"
      en: "Remember the covenant of the most High, and overlook the ignorance of thy neighbour."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "abstine te a lite et minues peccata"
      en: "Refrain from strife, and thou shalt diminish thy sine:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "homo enim iracundus incendit litem et vir peccator turbabit amicos et in medium pacem habentium inmittit inimicitiam"
      en: "For a passionate man kindleth strife, and a sinful man will trouble his friends, and bring in debate in the midst of them that are at peace."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "secundum enim ligna silvae sic ignis exardescit et secundum virtutem hominis iracundia illius erit et secundum substantiam suam exaltabit iram suam"
      en: "For as the wood of the forest is, so the fire burneth: and as a man's strength is, so shall his anger be, and according to his riches he shall increase his anger."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "certamen festinatum incendit ignem et lis festinans effundit sanguinem et lingua testificans adducit mortem"
      en: "A hasty contention kindleth a fire: and a hasty quarrel sheddeth blood: and a tongue that beareth witness bringeth death."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si sufflaveris quasi ignis exardebit et si expueris super illam extinguetur utraque ex ore proficiscuntur"
      en: "If thou blow the spark, it shall burn as a fire: and if thou spit upon it, it shall be quenched: both come out of the mouth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "susurrio et bilinguis maledictus multos enim turbavit pacem habentes"
      en: "The whisperer and the double tongued is accursed: for he hath troubled many that were at peace."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "lingua tertia multos commovit et dispersit illos a gente in gentem"
      en: "The tongue of a third person hath disquieted many, and scattered them from nation to nation."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "civitates muratas divitum destruxit et domos magnatorum effodit"
      en: "It hath destroyed the strong cities of the rich, and hath overthrown the houses of great men."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "virtutes populorum concidit et gentes fortes dissolvit"
      en: "It hath cut in pieces the forces of people, and undone strong nations."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "lingua tertia mulieres viritas eiecit et privavit illas laboribus suis"
      en: "The tongue of a third person hath cast out valiant women, and deprived them of their labours."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui respicit illam non habebit requiem nec habitabit cum requie"
      en: "He that hearkeneth to it, shall never have rest, neither shall he have a friend in whom he may repose."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "flagelli plaga livorem facit plaga autem linguae comminuet ossa"
      en: "The stroke of a whip maketh a blue mark: but the stroke of the tongue will break the bones."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "multi ceciderunt in ore gladii sed non sic quasi qui interierunt per linguam suam"
      en: "Many have fallen by the edge of the sword, but not so many as have perished by their own tongue."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "beatus qui tectus est a lingua nequa qui in iracundia illius non transivit et qui non adtraxit iugum eius et in vinculis illius non est ligatus"
      en: "Blessed is he that is defended from a wicked tongue, that hath not passed into the wrath thereof, and that hath not drawn the yoke thereof, and hath not been bound in its bands."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "iugum enim illius iugum ferreum est et vinculum illius vinculum aereum est"
      en: "For its yoke is a yoke of iron: and its bands are bands of brass."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "mors illius mors nequissima et utilis potius inferus quam illa"
      en: "The death thereof is a most evil death: and hell is preferable to it."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "perseverantia illius non permanebit sed obtinebit vias iniustorum et in flamma sua non conburet iustos"
      en: "Its continuance shall not be for a long time, but it shall possess the ways of the unjust: and the just shall not be burnt with its flame."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui derelinquunt Deum incident in illam et exardebit in illis et non extinguetur et inmittetur in illos quasi leo et quasi pardus laedebit illos"
      en: "They that forsake God shall fall into it, and it shall burn in them, and shall not be quenched, and it shall be sent upon them as a lion, and as a leopard it shall tear them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sepi aures tuas spinis et noli audire linguam nequam et ori tuo facito ostia et seras"
      en: "Hedge in thy ears with thorns, hear not a wicked tongue, and make doors and bars to thy mouth."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "aurum tuum et argentum confla et verbis tuis facito stateram et frenos ori tuo rectos"
      en: "Melt down thy gold and silver, and make a balance for thy words, and a just bridle for thy mouth:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et adtende ne forte labaris in lingua et cadas in conspectu inimicorum insidiantium tibi et sit casus tuus insanabilis in mortem"
      en: "And take heed lest thou slip with thy tongue, and fall in the sight of thy enemies who lie in wait for thee, and thy fall be incurable unto death."
    status: { la: verified, en: verified }
