# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 4
verses:
  - n: 1
    text:
      la: "Ideo habentes administrationem, juxta quod misericordiam consecuti sumus, non deficimus,"
      en: "Therefore, seeing we have this ministration, according as we have obtained mercy, we faint not;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sed abdicamus occulta dedecoris, non ambulantes in astutia, neque adulterantes verbum Dei, sed in manifestatione veritatis commendantes nosmetipsos ad omnem conscientiam hominum coram Deo."
      en: "But we renounce the hidden things of dishonesty, not walking in craftiness, nor adulterating the word of God; but by manifestation of the truth commending ourselves to every man's conscience, in the sight of God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quod si etiam opertum est Evangelium nostrum, in iis, qui pereunt, est opertum:"
      en: "And if our gospel be also hid, it is hid to them that are lost,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "in quibus Deus hujus saeculi excaecavit mentes infidelium, ut non fulgeat illis illuminatio Evangelii gloriae Christi, qui est imago Dei."
      en: "In whom the god of this world hath blinded the minds of unbelievers, that the light of the gospel of the glory of Christ, who is the image of God, should not shine unto them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Non enim nosmetipsos praedicamus, sed Jesum Christum Dominum nostrum: nos autem servos vestros per Jesum:"
      en: "For we preach not ourselves, but Jesus Christ our Lord; and ourselves your servants through Jesus."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quoniam Deus, qui dixit de tenebris lucem splendescere, ipse illuxit in cordibus nostris ad illuminationem scientiae claritatis Dei, in facie Christi Jesu."
      en: "For God, who commanded the light to shine out of darkness, hath shined in our hearts, to give the light of the knowledge of the glory of God, in the face of Christ Jesus."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Habemus autem thesaurum istum in vasis fictilibus: ut sublimitas sit virtutis Dei, et non ex nobis."
      en: "But we have this treasure in earthen vessels, that the excellency may be of the power of God, and not of us."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In omnibus tribulationem patimur, sed non angustiamur: aporiamur, sed non destituimur:"
      en: "In all things we suffer tribulation, but are not distressed; we are straitened, but are not destitute;"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "persecutionem patimur, sed non derelinquimur: dejicimur, sed non perimus:"
      en: "We suffer persecution, but are not forsaken; we are cast down, but we perish not:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "semper mortificationem Jesu in corpore nostro circumferentes, ut et vita Jesu manifestetur in corporibus nostris."
      en: "Always bearing about in our body the mortification of Jesus, that the life also of Jesus may be made manifest in our bodies."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Semper enim nos, qui vivimus, in mortem tradimur propter Jesum: ut et vita Jesu manifestetur in carne nostra mortali."
      en: "For we who live are always delivered unto death for Jesus' sake; that the life also of Jesus may be made manifest in our mortal flesh."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ergo mors in nobis operatur, vita autem in vobis."
      en: "So then death worketh in us, but life in you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Habentes autem eumdem spiritum fidei, sicut scriptum est: Credidi, propter quod locutus sum: et nos credimus, propter quod et loquimur:"
      en: "But having the same spirit of faith, as it is written: I believed, for which cause I have spoken; we also believe, for which cause we speak also:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "scientes quoniam qui suscitavit Jesum, et nos cum Jesu suscitabit, et constituet vobiscum."
      en: "Knowing that he who raised up Jesus, will raise us up also with Jesus, and place us with you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Omnia enim propter vos: ut gratia abundans, per multos in gratiarum actione, abundet in gloriam Dei."
      en: "For all things are for your sakes; that the grace abounding through many, may abound in thanksgiving unto the glory of God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Propter quod non deficimus: sed licet is, qui foris est, noster homo corrumpatur, tamen is, qui intus est, renovatur de die in diem."
      en: "For which cause we faint not; but though our outward man is corrupted, yet the inward man is renewed day by day."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Id enim, quod in praesenti est momentaneum et leve tribulationis nostrae, supra modum in sublimitate aeternum gloriae pondus operatur in nobis,"
      en: "For that which is at present momentary and light of our tribulation, worketh for us above measure exceedingly an eternal weight of glory."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non contemplantibus nobis quae videntur, sed quae non videntur. Quae enim videntur, temporalia sunt: quae autem non videntur, aeterna sunt."
      en: "While we look not at the things which are seen, but at the things which are not seen. For the things which are seen, are temporal; but the things which are not seen, are eternal."
    status: { la: verified, en: verified }
