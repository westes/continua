# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 39
verses:
  - n: 1
    text:
      la: "de hyacintho vero et purpura vermiculo ac bysso fecit vestes quibus indueretur Aaron quando ministrabat in sanctis sicut praecepit Dominus Mosi"
      en: "And he made, of violet and purple, scarlet and fine linen, the vestments for Aaron to wear when he ministered in the holy places, as the Lord commanded Moses."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fecit igitur superumerale de auro hyacintho et purpura coccoque bis tincto et bysso retorta"
      en: "So he made an ephod of gold, violet, and purple, and scarlet twice dyed, and fine twisted linen."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "opere polymitario inciditque bratteas aureas et extenuavit in fila ut possint torqueri cum priorum colorum subtemine"
      en: "With embroidered work: and he cut thin plates of gold, and drew them small into threads, that they might be twisted with the woof of the aforesaid colours,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "duasque oras sibi invicem copulatas in utroque latere summitatum"
      en: "And two borders coupled one to the other in the top on either side,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et balteum ex hisdem coloribus sicut praeceperat Dominus Mosi"
      en: "And a girdle of the same colours, as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "paravit et duos lapides onychinos adstrictos et inclusos auro et sculptos arte gemmaria nominibus filiorum Israhel"
      en: "He prepared also two onyx stones, fast set and closed in gold, and graven by the art of a lapidary, with the names of the children of Israel:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "posuitque eos in lateribus superumeralis in monumentum filiorum Israhel sicut praeceperat Dominus Mosi"
      en: "And he set them in the sides of the ephod for a memorial of the children of Israel, as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "fecit et rationale opere polymito iuxta opus superumeralis ex auro hyacintho purpura coccoque bis tincto et bysso retorta"
      en: "He made also a rational with embroidered work, according to the work of the ephod, of gold, violet, purple, and scarlet twice dyed, and fine twisted linen,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quadrangulum duplex mensurae palmi"
      en: "Foursquare, double, of the measure of a span."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et posuit in eo gemmarum ordines quattuor in primo versu erat sardius topazius zmaragdus"
      en: "And he set four rows of precious stones in it. In the first row was a sardius, a topaz, and emerald."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in secundo carbunculus sapphyrus iaspis"
      en: "In the second, a carbuncle, a sapphire, and a jasper."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in tertio ligyrius achates amethistus"
      en: "In the third, a ligurius, an agate, and an amethyst."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "in quarto chrysolitus onychinus berillus circumdati et inclusi auro per ordines suos"
      en: "In the fourth, a chrysolite, an onyx, and a beryl, set and enclosed in gold by their rows."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ipsique lapides duodecim sculpti erant nominibus duodecim tribuum Israhel singuli per nomina singulorum"
      en: "And the twelve stones were engraved with the names of the twelve tribes of Israel, each one with its several name."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "fecerunt in rationali et catenulas sibi invicem coherentes de auro purissimo"
      en: "They made also in the rational little chains linked one to another of the purest gold,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et duos uncinos totidemque anulos aureos porro anulos posuerunt in utroque latere rationalis"
      en: "And two hooks, and as many rings of gold. And they set the rings on either side of the rational,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "e quibus penderent duae catenae aureae quas inseruerunt uncinis qui in superumeralis angulis eminebant"
      en: "On which rings the two golden chains should hang, which they put into the hooks that stood out in the corners of the ephod."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "haec et ante et retro ita conveniebant sibi ut superumerale et rationale mutuo necterentur"
      en: "These both before and behind so answered one another, that the ephod and the rational were bound together,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "stricta ad balteum et anulis fortius copulata quos iungebat vitta hyacinthina ne laxe fluerent et a se invicem moverentur sicut praecepit Dominus Mosi"
      en: "Being fastened to the girdle and strongly coupled with rings, which a violet fillet joined, lest they should flag loose, and be moved one from the other, as the Lord commanded Moses."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "fecerunt quoque tunicam superumeralis totam hyacinthinam"
      en: "They made also the tunick of the ephod all of violet,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et capitium in superiori parte contra medium oramque per gyrum capitii textilem"
      en: "And a hole for the head in the upper part at the middle, and a woven border round about the hole:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "deorsum autem ad pedes mala punica ex hyacintho purpura vermiculo ac bysso retorta"
      en: "And beneath at the feet pomegranates of violet, purple, scarlet, and fine twisted linen:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et tintinabula de auro mundissimo quae posuerunt inter mala granata in extrema parte tunicae per gyrum"
      en: "And little bells of the purest gold, which they put between the pomegranates at the bottom of the tunick round about:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "tintinabulum aureum et malum punicum quibus ornatus incedebat pontifex quando ministerio fungebatur sicut praecepit Dominus Mosi"
      en: "To wit, a bell of gold, and a pomegranate, wherewith the high priest went adorned, when he discharged his ministry, as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "fecerunt et tunicas byssinas opere textili Aaron et filiis eius"
      en: "They made also fine linen tunicks with woven work for Aaron and his sons:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et mitras cum coronulis suis ex bysso"
      en: "And mitres with their little crowns of fine linen:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "feminalia quoque linea byssina"
      en: "And linen breeches of fine linen:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "cingulum vero de bysso retorta hyacintho purpura ac vermiculo distinctum arte plumaria sicut praecepit Dominus Mosi"
      en: "And a girdle of fine twisted linen, violet, purple, and scarlet twice dyed, of embroidery work, as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "fecerunt et lamminam sacrae venerationis de auro purissimo scripseruntque in ea opere gemmario Sanctum Domini"
      en: "They made also the plate of sacred veneration of the purest gold, and they wrote on it with the engraving of a lapidary, The Holy of the Lord:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et strinxerunt eam cum mitra vitta hyacinthina sicut praecepit Dominus Mosi"
      en: "And they fastened it to the mitre with a violet fillet, as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "perfectum est igitur omne opus tabernaculi et tecti testimonii feceruntque filii Israhel cuncta quae praeceperat Dominus Mosi"
      en: "So all the work of the tabernacle and of the roof of the testimony was finished: and the children of Israel did all things which the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et obtulerunt tabernaculum et tectum et universam supellectilem anulos tabulas vectes columnas ac bases"
      en: "And they offered the tabernacle and the roof and the whole furniture, the rings, the boards, the bars, the pillars, and their sockets,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "opertorium de pellibus arietum rubricatis et aliud operimentum de ianthinis pellibus"
      en: "The cover of rams' skins dyed red, and the other cover of violet skins,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "velum arcam vectes propitiatorium"
      en: "The veil, the ark, the bars, the propitiatory,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "mensam cum vasis et propositionis panibus"
      en: "The table, with the vessels thereof, and the loaves of proposition:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "candelabrum lucernas et utensilia eorum cum oleo"
      en: "The candlestick, the lamps, and the furniture of them with the oil:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "altare aureum et unguentum thymiama ex aromatibus"
      en: "The altar of gold, and the ointment, and the incense of spices:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et tentorium in introitu tabernaculi"
      en: "And the hanging in the entry of the tabernacle:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "altare aeneum retiaculum vectes et vasa eius omnia labrum cum basi sua tentoria atrii et columnas cum basibus suis"
      en: "The altar of brass, the grate, the bars, and all the vessels thereof: the laver with the foot thereof: the hangings of the court, and the pillars with their sockets:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "tentorium in introitu atrii funiculosque illius et paxillos nihil ex vasis defuit quae in ministerium tabernaculi et in tectum foederis iussa sunt fieri"
      en: "The hanging in the entry of the court, and the little cords, and the pins thereof. Nothing was wanting of the vessels, that were commanded to be made for the ministry of the tabernacle, and for the roof of the covenant."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "vestes quoque quibus sacerdotes utuntur in sanctuario Aaron scilicet et filii eius"
      en: "The vestments also, which the priests, to wit, Aaron and his sons, used in the sanctuary,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "obtulerunt filii Israhel sicut praeceperat Dominus"
      en: "The children of Israel offered as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "quae postquam Moses cuncta vidit expleta benedixit eis"
      en: "And when Moses saw all things finished, he blessed them."
    status: { la: verified, en: verified }
