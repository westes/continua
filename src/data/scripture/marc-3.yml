# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: marc
chapter: 3
verses:
  - n: 1
    text:
      la: "et introivit iterum synagogam et erat ibi homo habens manum aridam"
      en: "And he entered again into the synagogue, and there was a man there who had a withered hand."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et observabant eum si sabbatis curaret ut accusarent illum"
      en: "And they watched him whether he would heal on the sabbath days; that they might accuse him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ait homini habenti manum aridam surge in medium"
      en: "And he said to the man who had the withered hand: Stand up in the midst."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dicit eis licet sabbatis bene facere an male animam salvam facere an perdere at illi tacebant"
      en: "And he saith to them: Is it lawful to do good on the sabbath days, or to do evil? to save life, or to destroy? But they held their peace."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et circumspiciens eos cum ira contristatus super caecitatem cordis eorum dicit homini extende manum tuam et extendit et restituta est manus illi"
      en: "And looking round about on them with anger, being grieved for the blindness of their hearts, he saith to the man: Stretch forth thy hand. And he stretched it forth: and his hand was restored unto him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "exeuntes autem statim Pharisaei cum Herodianis consilium faciebant adversus eum quomodo eum perderent"
      en: "And the Pharisees going out, immediately made a consultation with the Herodians against him, how they might destroy him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et Iesus cum discipulis suis secessit ad mare et multa turba a Galilaea et Iudaea secuta est eum"
      en: "But Jesus retired with his disciples to the sea; and a great multitude followed him from Galilee and Judea,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ab Hierosolymis et ab Idumea et trans Iordanen et qui circa Tyrum et Sidonem multitudo magna audientes quae faciebat venerunt ad eum"
      en: "And from Jerusalem, and from Idumea, and from beyond the Jordan. And they about Tyre and Sidon, a great multitude, hearing the things which he did, came to him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit discipulis suis ut navicula sibi deserviret propter turbam ne conprimerent eum"
      en: "And he spoke to his disciples that a small ship should wait on him because of the multitude, lest they should throng him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "multos enim sanabat ita ut inruerent in eum ut illum tangerent quotquot habebant plagas"
      en: "For he healed many, so that they pressed upon him for to touch him, as many as had evils."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et spiritus inmundi cum illum videbant procidebant ei et clamabant dicentes"
      en: "And the unclean spirits, when they saw him, fell down before him: and they cried, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tu es Filius Dei et vehementer comminabatur eis ne manifestarent illum"
      en: "Thou art the Son of God. And he strictly charged them that they should not make him known."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ascendens in montem vocavit ad se quos voluit ipse et venerunt ad eum"
      en: "And going up into a mountain, he called unto him whom he would himself: and they came to him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et fecit ut essent duodecim cum illo et ut mitteret eos praedicare"
      en: "And he made that twelve should be with him, and that he might send them to preach."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et dedit illis potestatem curandi infirmitates et eiciendi daemonia"
      en: "And he gave them power to heal sicknesses, and to cast out devils."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et inposuit Simoni nomen Petrus"
      en: "And to Simon he gave the name Peter:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et Iacobum Zebedaei et Iohannem fratrem Iacobi et inposuit eis nomina Boanerges quod est Filii tonitrui"
      en: "And James the son of Zebedee, and John the brother of James; and he named them Boanerges, which is, The sons of thunder:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Andream et Philippum et Bartholomeum et Mattheum et Thomam et Iacobum Alphei et Thaddeum et Simonem Cananeum"
      en: "And Andrew and Philip, and Bartholomew and Matthew, and Thomas and James of Alpheus, and Thaddeus, and Simon the Cananean:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et Iudam Scarioth qui et tradidit illum"
      en: "And Judas Iscariot, who also betrayed him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et veniunt ad domum et convenit iterum turba ita ut non possent neque panem manducare"
      en: "And they come to a house, and the multitude cometh together again, so that they could not so much as eat bread."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et cum audissent sui exierunt tenere eum dicebant enim quoniam in furorem versus est"
      en: "And when his friends had heard of it, they went out to lay hold on him. For they said: He is become mad."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et scribae qui ab Hierosolymis descenderant dicebant quoniam Beelzebub habet et quia in principe daemonum eicit daemonia"
      en: "And the scribes who were come down from Jerusalem, said: He hath Beelzebub, and by the prince of devils he casteth out devils."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et convocatis eis in parabolis dicebat illis quomodo potest Satanas Satanan eicere"
      en: "And after he had called them together, he said to them in parables: How can Satan cast out Satan?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et si regnum in se dividatur non potest stare regnum illud"
      en: "And if a kingdom be divided against itself, that kingdom cannot stand."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et si domus super semet ipsam dispertiatur non poterit domus illa stare"
      en: "And if a house be divided against itself, that house cannot stand."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et si Satanas consurrexit in semet ipsum dispertitus est et non potest stare sed finem habet"
      en: "And if Satan be risen up against himself, he is divided, and cannot stand, but hath an end."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "nemo potest vasa fortis ingressus in domum diripere nisi prius fortem alliget et tunc domum eius diripiet"
      en: "No man can enter into the house of a strong man and rob him of his goods, unless he first bind the strong man, and then shall he plunder his house."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "amen dico vobis quoniam omnia dimittentur filiis hominum peccata et blasphemiae quibus blasphemaverint"
      en: "Amen I say to you, that all sins shall be forgiven unto the sons of men, and the blasphemies wherewith they shall blaspheme:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "qui autem blasphemaverit in Spiritum Sanctum non habet remissionem in aeternum sed reus erit aeterni delicti"
      en: "But he that shall blaspheme against the Holy Ghost, shall never have forgiveness, but shall be guilty of an everlasting sin."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quoniam dicebant spiritum inmundum habet"
      en: "Because they said: He hath an unclean spirit."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et veniunt mater eius et fratres et foris stantes miserunt ad eum vocantes eum"
      en: "And his mother and his bretheren came; and standing without, sent unto him, calling him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et sedebat circa eum turba et dicunt ei ecce mater tua et fratres tui foris quaerunt te"
      en: "And the multitude sat about him; and they say to him: Behold thy mother and thy brethren without seek for thee."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et respondens eis ait quae est mater mea et fratres mei"
      en: "And answering them, he said: Who is my mother and my brethren?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et circumspiciens eos qui in circuitu eius sedebant ait ecce mater mea et fratres mei"
      en: "And looking round about on them who sat about him, he saith: Behold my mother and my brethren."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "qui enim fecerit voluntatem Dei hic frater meus et soror mea et mater est"
      en: "For whosoever shall do the will of God, he is my brother, and my sister, and mother."
    status: { la: verified, en: verified }
