# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 24
verses:
  - n: 1
    text:
      la: "Ascendit ergo David inde: et habitavit in locis tutissimis Engaddi."
      en: "Then David went up from thence, and dwelt in strong holds of Engaddi."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cumque reversus esset Saul, postquam persecutus est Philisthaeos, nuntiaverunt ei, dicentes: Ecce, David in deserto est Engaddi."
      en: "And when Saul was returned from following the Philistines, they told him, saying: Behold, David is in the desert of Engaddi."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Assumens ergo Saul tria millia electorum virorum ex omni Israel, perrexit ad investigandum David et viros ejus, etiam super abruptissimas petra, quae solis ibicibus perviae sunt."
      en: "Saul therefore took three thousand chosen men out of all Israel, and went out to seek after David, and his men, even upon the most craggy rocks, which are accessible only to wild goats."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et venit ad caulas ovium, quae se offerebant vianti: eratque ibi spelunca, quam ingressus est Saul, ut purgaret ventrem: porro David et viri ejus in interiore parte speluncae latebant."
      en: "And he came to the sheepcotes, which were in his way. And there was a cave, into which Saul went, to ease nature: now David and his men lay hid in the inner part of the cave."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et dixerunt servi David ad eum: Ecce dies, de qua locutus est Dominus ad te: Ego tradam tibi inimicum tuum, ut facias ei sicut placuerit in oculis tuis. Surrexit ergo David, et praecidit oram chlamydis Saul silenter."
      en: "And the servants of David said to him: Behold the day, of which the Lord said to thee: I will deliver thy enemy unto thee, that thou mayest do to him as it shall seem good in thy eyes. Then David arose, and secretly cut off the hem of Saul's robe."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Post haec percussit cor suum David, eo quod abscidisset oram chlamydis Saul."
      en: "After which David's heart struck him, because he had cut off the hem of Saul's robe."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dixitque ad viros suos: Propitius sit mihi Dominus, ne faciam hanc rem domino meo, christo Domini, ut mittam manum meam in eum, quia christus Domini est."
      en: "And he said to his men: The Lord be merciful unto me, that I may do no such thing to my master the Lord's anointed, as to lay my hand upon him, because he is the Lord's anointed."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et confregit David viros suos sermonibus, et non permisit eos ut consurgerent in Saul: porro Saul exsurgens de spelunca, pergebat coepto itinere."
      en: "And David stopped his men with his words, and suffered them not to rise against Saul. But Saul rising up out of the cave, went on his way."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Surrexit autem et David post eum: et egressus de spelunca, clamavit post tergum Saul, dicens: Domine mi rex. Et respexit Saul post se: et inclinans se David pronus in terram adoravit,"
      en: "And David also rose up after him: and going out of the cave cried after Saul, saying: My lord the king. And Saul looked behind him: and David bowing himself down to the ground, worshipped,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dixitque ad Saul: Quare audis verba hominum loquentium, David quaerit malum adversum te?"
      en: "And said to Saul: Why dost thou hear the words of men that say David seeketh thy hurt?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ecce hodie viderunt oculi tui, quod tradiderit te Dominus in manu mea in spelunca: et cogitavi ut occiderem te, sed pepercit tibi oculus meus: dixi enim: Non extendam manum meam in dominum meum, quia christus Domini est."
      en: "Behold this day thy eyes have seen, that the Lord hath delivered thee into my hand, in the cave, and I had a thought to kill thee, but my eye hath spared thee. For I said: I will not put out my hand against my lord, because he is the Lord's anointed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quin potius pater mi, vide, et cognosce oram chlamydis tuae in manu mea: quoniam cum praescinderem summitatem chlamydis tuae, nolui extendere manum meam in te: animadverte, et vide, quoniam non est in manu mea malum, neque iniquitas, neque peccavi in te: tu autem insidiaris animae meae ut auferas eam."
      en: "Moreover see and know, O my father, the hem of thy robe in my hand, that when I cut, off the hem of thy robe, I would not put out my hand against thee. Reflect, and see, that there is no evil in my hand, nor iniquity, neither have I sinned against thee: but thou liest in wait for my life, to take it away."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Judicet Dominus inter me et te, et ulciscatur me Dominus ex te: manus autem mea non sit in te."
      en: "The Lord judge between me and thee, and the Lord revenge me of thee: but my hand shall not be upon thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sicut et in proverbio antiquo dicitur: Ab impiis egredietur impietas: manus ergo mea non sit in te."
      en: "As also it is said in the old proverb: From the wicked shall wickedness come forth: therefore my hand shall not be upon thee. After whom dost thou come out, O king of Israel?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quem persequeris, rex Israel? quem persequeris? canem mortuum persequeris, et pulicem unum."
      en: "After whom dost thou pursue? After a dead dog, after a flea."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sit Dominus judex, et judicet inter me et te: et videat, et judicet causam meam, et eruat me de manu tua."
      en: "Be the Lord judge, and judge between me and thee, and see, and judge my cause, and deliver me out of thy hand."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cum autem complesset David loquens sermones hujuscemodi ad Saul, dixit Saul: Numquid vox haec tua est fili mi David? Et levavit Saul vocem suam, et flevit:"
      en: "And when David had made an end of speaking these words to Saul, Saul said: Is this thy voice, my son David? And Saul lifted up his voice, and wept."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixitque ad David: Justior tu es quam ego: tu enim tribuisti mihi bona: ego autem reddidi tibi mala."
      en: "And he said to David: Thou art more just than I: for thou hast done good to me, and I have rewarded thee with evil."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et tu indicasti hodie quae feceris mihi bona: quomodo tradiderit me Dominus in manum tuam, et non occideris me."
      en: "And thou hast shewn this day what good things thou hast done to me: how the Lord delivered me into thy hand, and thou hast not killed me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quis enim cum invenerit inimicum suum, dimittet eum in via bona? Sed Dominus reddat tibi vicissitudinem hanc pro eo quod hodie operatus es in me."
      en: "For who when he hath found his enemy, will let him go well away? But the Lord reward thee for this good turn, for what thou hast done to me this day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et nunc quia scio quod certissime regnaturus sis, et habiturus in manu tua regnum Israel:"
      en: "And now as I know that thou shalt surely be king, and have the kingdom of Israel in thy hand:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "jura mihi in Domino, ne deleas semen meum post me, neque auferas nomen meum de domo patris mei."
      en: "Swear to me by the Lord, that thou wilt not destroy my seed after me, nor take away my name from the house of my father."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et juravit David Sauli. Abiit ergo Saul in domum suam: et David et viri ejus ascenderunt ad tutiora loca."
      en: "And David swore to Saul. So Saul went home: and David and his men went up into safer places."
    status: { la: verified, en: verified }
