# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 30
verses:
  - n: 1
    text:
      la: "vae filii desertores dicit Dominus ut faceretis consilium et non ex me et ordiremini telam et non per spiritum meum ut adderetur peccatum super peccatum"
      en: "Woe to you, apostate children, saith the Lord, that you would take counsel, and not of me: and would begin a web, and not by my spirit, that you might add sin upon sill:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui ambulatis ut descendatis in Aegyptum et os meum non interrogastis sperantes auxilium in fortitudine Pharao et habentes fiduciam in umbra Aegypti"
      en: "Who walk to go down into Egypt, and have not asked at my mouth, hoping for help in the strength of Pharao, and trusting in the shadow of Egypt."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et erit vobis fortitudo Pharaonis in confusionem et fiducia umbrae Aegypti in ignominiam"
      en: "And the- strength of Pharao shall be to your confusion, and the confidence of the shadow of Egypt to your shame."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "erant enim in Tanis principes tui et nuntii tui usque ad Anes pervenerunt"
      en: "For thy princes were in Tanis, and thy messengers came even to Hanes."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "omnes confusi sunt super populo qui eis prodesse non potuit non fuerunt in auxilium et in aliquam utilitatem sed in confusionem et obprobrium"
      en: "They were all confounded at a people that could not profit them: they were no help, nor to any profit, but to confusion and to reproach."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "onus iumentorum austri in terra tribulationis et angustiae leaena et leo ex eis vipera et regulus volans portantes super umeros iumentorum divitias suas et super gibbum camelorum thesauros suos ad populum qui eis prodesse non poterit"
      en: "The burden of the beasts of the south. In a land of trouble and distress, from whence come the lioness, and the lion, the viper and the flying basilisk, they carry their riches upon the shoulders of beasts, and their treasures upon the bunches of camels to a people that shall not be able to profit them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Aegyptus enim frustra et vane auxiliabitur ideo clamavi super hoc superbia tantum est quiesce"
      en: "For Egypt shall help in vain, and to no purpose: therefore have I cried concerning this: It is pride only, sit still."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nunc ingressus scribe eis super buxum et in libro diligenter exara illud et erit in die novissimo in testimonium usque ad aeternum"
      en: "Now therefore go in and write for them upon box, and note it diligently in a book, and it shall be in the latter days for a testimony for ever."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "populus enim ad iracundiam provocans est et filii mendaces filii nolentes audire legem Domini"
      en: "For it is a people that provoketh to wrath, and lying children, children that will not hear the law of God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui dicunt videntibus nolite videre et aspicientibus nolite aspicere nobis ea quae recta sunt loquimini nobis placentia videte nobis errores"
      en: "Who say to the seers: See not: and to them that behold: Behold not for us those things that are right: speak unto us pleasant things, see errors for us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "auferte a me viam declinate a me semitam cesset a facie nostra Sanctus Israhel"
      en: "Take away from me the way, turn away the path from me, let the Holy One of Israel cease from before us."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "propterea haec dicit Sanctus Israhel pro eo quod reprobastis verbum hoc et sperastis in calumniam et tumultum et innixi estis super eo"
      en: "Therefore thus saith the Holy One of Israel: Because you have rejected this word, and have trusted in oppression and tumult, and have leaned upon it:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "propterea erit vobis iniquitas haec sicut interruptio cadens et requisita in muro excelso quoniam subito dum non speratur veniet contritio eius"
      en: "Therefore shall this iniquity be to you as a breach that falleth, and is found wanting in a high wall, for the destruction thereof shall come on a sudden, when it is not looked for."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et comminuetur sicut conteritur lagoena figuli contritione pervalida et non invenietur de fragmentis eius testa in qua portetur igniculus de incendio aut hauriatur parum aquae de fovea"
      en: "And it shall be broken small, as the potter's vessel is broken all to pieces with mighty breaking, and there shall not a sherd be found of the pieces thereof, wherein a little fire may be carried from the hearth, or a, little water be drawn out of the pit."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quia haec dicit Dominus Deus Sanctus Israhel si revertamini et quiescatis salvi eritis in silentio et in spe erit fortitudo vestra et noluistis"
      en: "For thus saith the Lord God the Holy One of Israel: If you return and be quiet, you shall be saved: in silence and in hope shall your strength be. And you would not:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dixistis nequaquam sed ad equos fugiemus ideo fugietis et super veloces ascendemus ideo veloces erunt qui persequentur vos"
      en: "But have said: No, but we will flee to horses: therefore shall you flee. And we will mount upon swift ones: therefore shall they be swifter that shall pursue after you."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "mille homines a facie terroris unius et a facie terroris quinque fugietis donec relinquamini quasi malus navis in vertice montis et quasi signum super collem"
      en: "A thousand men shall flee for fear of one: and for fear of five shall you flee, till you be left as the mast of a ship on the top of a mountain, and as an ensign upon a hill."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "propterea expectat Dominus ut misereatur vestri et ideo exaltabitur parcens vobis quia Deus iudicii Dominus beati omnes qui expectant eum"
      en: "Therefore the Lord waiteth that be may have mercy on you: and therefore shall he be exalted sparing you: because the Lord is the God of judgment: blessed are all they that wait for him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "populus enim Sion habitabit in Hierusalem plorans nequaquam plorabis miserans miserebitur tui ad vocem clamoris tui statim ut audierit respondebit tibi"
      en: "For the people of Sion shall dwell in Jerusalem: weeping thou shalt not weep, he will surely have pity on thee: at the voice of thy cry, se soon as he shell hear, he will answer thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et dabit vobis Dominus panem artum et aquam brevem et non faciet avolare a te ultra doctorem tuum et erunt oculi tui videntes praeceptorem tuum"
      en: "And the Lord will give you spare bread, and short water: and will not cause thy teacher to flee away from thee any more, and thy eyes shall see thy teacher."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et aures tuae audient verbum post tergum monentis haec via ambulate in ea neque ad dexteram neque ad sinistram"
      en: "And thy ears shall hear the word of one admonishing thee behind thy back: This is the way, walk ye in it: and go not aside neither to the right hand, nor to the left."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et contaminabis lamminas sculptilium argenti tui et vestimentum conflatilis auri tui et disperges ea sicut inmunditiam menstruatae egredere dices ei"
      en: "And thou shalt defile the plates of thy graven things of silver, and the garment of thy molten things of gold, and shalt cast them away as the uncleanness of a menstruous woman. Thou shalt say to it: Get thee hence."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et dabitur pluvia semini tuo ubicumque seminaveris in terra et panis frugum terrae erit uberrimus et pinguis pascetur in possessione tua in die illo agnus spatiose"
      en: "And rain shall be given to thy seed, wheresoever thou shalt sow in the land: and the bread of the corn of the land shall be most plentiful, and fat. The lamb in that day shall feed at large in thy possession:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et tauri tui et pulli asinorum qui operantur terram commixtum migma comedent sic in area ut ventilatum est"
      en: "And thy oxen, and the ass colts that till the ground, shall eat mingled pro vender as it was winnowed in the floor."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et erunt super omnem montem excelsum et super omnem collem elevatum rivi currentium aquarum in die interfectionis multorum cum ceciderint turres"
      en: "And there shall be upon every high mountain, and upon every elevated hill rivers of running waters in the day of the slaughter of many, when the tower shall fall."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et erit lux lunae sicut lux solis et lux solis erit septempliciter sicut lux septem dierum in die qua alligaverit Dominus vulnus populi sui et percussuram plagae eius sanaverit"
      en: "And the light of the moon shall be se the light of the sun, and the light of the sun shall be sevenfold, as the light of seven days: in the day when the Lord shall bind up the wound of his people, and shall heal the stroke of their wound."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ecce nomen Domini venit de longinquo ardens furor eius et gravis ad portandum labia eius repleta sunt indignatione et lingua eius quasi ignis devorans"
      en: "Behold the name of the Lord cometh from afar, his wrath burneth, and is heavy to bear: his lips are filled with indignation, and his tongue as a devouring fire."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "spiritus eius velut torrens inundans usque ad medium colli ad perdendas gentes in nihilum et frenum erroris quod erat in maxillis populorum"
      en: "His breath as a torrent overflowing even to the midst of the neck, to destroy the nations unto nothing, and the bridle of error that was in the jaws of the people."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "canticum erit vobis sicut nox sanctificatae sollemnitatis et laetitia cordis sicut qui pergit cum tibia ut intret in montem Domini ad Fortem Israhel"
      en: "You shall have a song as in the night of the sanctified solemnity, and joy of heart, as when one goeth with a pipe, to come into the mountain of the Lord, to the Mighty One of Israel."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et auditam faciet Dominus gloriam vocis suae et terrorem brachii sui ostendet in comminatione furoris et flamma ignis devorantis adlidet in turbine et in lapide grandinis"
      en: "And the Lord shall make the glory of his voice to be heard, and shall shew the terror of his arm, in the threatening of wrath, and the dame of devouring fire: he shall crush to pieces with whirlwind, and hailstones."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "a voce enim Domini pavebit Assur virga percussus"
      en: "For at the voice of the Lord the Assyrian shall fear being struck with the rod."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et erit transitus virgae fundatus quam requiescere faciet Dominus super eum in tympanis et in citharis et in bellis praecipuis expugnabit eos"
      en: "And the passage of the rod shall be strongly grounded, which the Lord shall make to rest upon him with timbrels and harps, and in great battles he shall over throw them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "praeparata est enim ab heri Thofeth a rege praeparata profunda et dilatata nutrimenta eius ignis et ligna multa flatus Domini sicut torrens sulphuris succendens eam"
      en: "For Topheth is prepared from yesterday, prepared by the king, deep, and wide. The nourishment thereof is fire and much wood: the breath of the Lord as a torrent of brimstone kindling it."
    status: { la: verified, en: verified }
