# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: sir
chapter: 29
verses:
  - n: 1
    text:
      la: "de fenore qui facit misericordiam fenerat proximum et qui praevalet manu mandata servat"
      en: "He that sheweth mercy, lendeth to his neighbour: and he that is stronger in hand, keepeth the commandments."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fenera proximum tibi in tempore necessitatis illius et iterum redde proximo in tempore suo"
      en: "Lend to thy neighbour in the time of his need, and pay thou thy neighbour again in due time."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "confirma verbum et fideliter age cum illo et in omni tempore invenies quod tibi necessarium est"
      en: "Reap thy word, and deal faithfully with him: and thou shalt always find that which is necessary for thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "multi quasi inventionem aestimaverunt fenus et praestiterunt molestiam his qui se adiuvaverunt"
      en: "Many have looked upon a thing lent as a thing found, and have given trouble to them that helped them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "donec accipiant osculantur manum dantis et in promissionibus humiliant vocem suam"
      en: "Till they receive, they kiss the hands of the lender, and in promises they humble their voice:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et in tempore redditionis postulabit tempus et loquetur verba acediae et murmurationum et tempus causabitur"
      en: "But when they should repay, they will ask time, and will return tedious and murmuring words, and will complain of the time:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si autem potuerit reddere aversatus solide vix reddet dimidium et conputabit illud quasi inventionem"
      en: "And if he be able to pay, he will stand off, he will scarce pay one half, and will count it as if he had found it:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sin autem fraudavit illum pecunia sua et possidebit illum inimicum gratis"
      en: "But if not, he will defraud him of his money, and he shall get him for an enemy without cause:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et convicia et maledicta reddet illi et pro honore et beneficio reddet illi contumeliam"
      en: "And he will pay him with reproaches and curses, and instead of honour and good turn will repay him injuries."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "multi non causa nequitiae non feneraverunt sed fraudari gratis timuerunt"
      en: "Many have refused to lend, not out of wickedness, but they were afraid to be defrauded without cause."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "verumtamen super humilem animo fortior esto et pro elemosyna non trahas illum"
      en: "But yet towards the poor be thou more hearty, and delay not to shew him mercy."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "propter mandatum adsume pauperem et propter inopiam eius ne dimittas illum vacuum"
      en: "Help the poor because of the commandment: and send him not away empty handed because of his poverty."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "perde pecuniam pro fratre et amico et non abscondas illam sub lapide in perditionem"
      en: "Lose thy money for thy brother and thy friend: and hide it not under a stone to be lost."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "pone thesaurum tuum in praeceptis Altissimi et proderit tibi magis quam aurum"
      en: "Place thy treasure in the commandments of the most High, and it shall bring thee more profit than gold."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "conclude elemosynam in corde pauperis et haec pro te exorabit ab omni malo"
      en: "Shut up alms in the heart of the poor, and it shall obtain help for thee against all evil."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "[]"
      en: "Better than the shield of the mighty, and better than the spear:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "[]"
      en: "It shall fight for thee against thy enemy."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "super scutum potentis et super lanceam adversus inimicum tuum pugnabit"
      en: "A good man is surety for his neighbour: and he that hath lost shame, will leave him to himself."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "vir bonus fidem facit proximo suo et qui perdiderit confusionem derelinquet sibi"
      en: "Forget not the kindness of thy surety: for he hath given his life for thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "gratiam fideiussoris ne obliviscaris dedit enim pro te animam suam"
      en: "The sinner and the unclean fleeth from his surety."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "repromissorem fugit peccator et inmundus"
      en: "A sinner attributeth to himself the goods of his surety: and he that is of an unthankful mind will leave him that delivered him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "bona repromissoris sibi adscribit peccator et ingratus sensu derelinquet liberantem se"
      en: "A man is surety for his neighbour: and when he hath lost all shame, he shall forsake him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "vir repromittit de proximo suo et cum perdiderit reverentiam relinquetur ab eo"
      en: "Evil suretyship hath undone many of good estate, and hath tossed them as a wave of the sea."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "repromissio nequissima multos perdidit dirigentes et commovit illos quasi fluctus maris"
      en: "It hath made powerful men to go from place to place round about, and they have wandered in strange countries."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "viros potentes gyrans migrare fecit et vagati sunt in gentibus alienis"
      en: "A sinner that transgresseth the commandment of the Lord, shall fall into an evil suretyship: and he that undertaketh many things, shall fall into judgment."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "peccator transgrediens mandata Domini incidet in promissionem nequa et qui conatur multa agere incidet in iudicium"
      en: "Recover thy neighbour according to thy power, and take heed to thyself that thou fall not."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "recupera proximum secundum virtutem tuam et adtende tibi ne incidas"
      en: "The chief thing for man's life is water and bread, and clothing, and a house to cover shame."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "initium vitae aqua et panis et vestimentum et domus protegens turpitudinem"
      en: "Better is the poor man's fare under a roof of boards, than sumptuous cheer abroad in another man's house."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "melior victus pauperis sub tegimen asserum quam epulae splendidae in peregre sine domicilio"
      en: "Be contented with little instead of much, and thou shalt not hear the reproach of going abroad."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "super minimum et magnum placeat tibi et inproperium peregrinationis non audies"
      en: "It is a miserable life to go as a guest from house to house: for where a man is a stranger, he shall not deal confidently, nor open his mouth."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "vita nequa hospitandi de domo in domum et ubi hospitabitur non fiducialiter aget nec aperiet os"
      en: "He shall entertain and feed, and give drink to the unthankful, and moreover he shall hear bitter words."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "hospitabit et pascet et potabit ingratos et ad haec amara audiet"
      en: "Go, stranger, and furnish the table, and give others to eat what thou hast in thy hand."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "transi hospes et orna mensam et quae in manu habes ciba ceteros"
      en: "Give place to the honourable presence of my friends: for I want my house, my brother being to be lodged with me."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "exi a facie honoris amicorum meorum necessitudine domus meae hospitio mihi factus est frater"
      en: "These things are grievous to a man of understanding: the upbraiding of houseroom, and the reproaching of the lender."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "gravia haec homini habenti sensum correptio domus et inproperium feneratoris"
      en: "These things are grievous to a man of understanding: the upbraiding of houseroom, and the reproaching of the lender."
    status: { la: verified, en: verified }
