# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1cor
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus vocatus apostolus Christi Iesu per voluntatem Dei et Sosthenes frater"
      en: "Paul, called to be an apostle of Jesus Christ by the will of God, and Sosthenes a brother,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ecclesiae Dei quae est Corinthi sanctificatis in Christo Iesu vocatis sanctis cum omnibus qui invocant nomen Domini nostri Iesu Christi in omni loco ipsorum et nostro"
      en: "To the church of God that is at Corinth, to them that are sanctified in Christ Jesus, called to be saints, with all that invoke the name of our Lord Jesus Christ, in every place of theirs and ours."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "gratia vobis et pax a Deo Patre nostro et Domino Iesu Christo"
      en: "Grace to you, and peace from God our Father, and from the Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "gratias ago Deo meo semper pro vobis in gratia Dei quae data est vobis in Christo Iesu"
      en: "I give thanks to my God always for you, for the grace of God that is given you in Christ Jesus,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quia in omnibus divites facti estis in illo in omni verbo et in omni scientia"
      en: "That in all things you are made rich in him, in all utterance, and in all knowledge;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sicut testimonium Christi confirmatum est in vobis"
      en: "As the testimony of Christ was confirmed in you,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ita ut nihil vobis desit in ulla gratia expectantibus revelationem Domini nostri Iesu Christi"
      en: "So that nothing is wanting to you in any grace, waiting for the manifestation of our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui et confirmabit vos usque ad finem sine crimine in die adventus Domini nostri Iesu Christi"
      en: "Who also will confirm you unto the end without crime, in the day of the coming of our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "fidelis Deus per quem vocati estis in societatem Filii eius Iesu Christi Domini nostri"
      en: "God is faithful: by whom you are called unto the fellowship of his Son Jesus Christ our Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "obsecro autem vos fratres per nomen Domini nostri Iesu Christi ut id ipsum dicatis omnes et non sint in vobis scismata sitis autem perfecti in eodem sensu et in eadem sententia"
      en: "Now I beseech you, brethren, by the name of our Lord Jesus Christ, that you all speak the same thing, and that there be no schisms among you; but that you be perfect in the same mind, and in the same judgment."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "significatum est enim mihi de vobis fratres mei ab his qui sunt Chloes quia contentiones inter vos sunt"
      en: "For it hath been signified unto me, my brethren, of you, by them that are of the house of Chloe, that there are contentions among you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "hoc autem dico quod unusquisque vestrum dicit ego quidem sum Pauli ego autem Apollo ego vero Cephae ego autem Christi"
      en: "Now this I say, that every one of you saith: I indeed am of Paul; and I am of Apollo; and I am of Cephas; and I of Christ."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "divisus est Christus numquid Paulus crucifixus est pro vobis aut in nomine Pauli baptizati estis"
      en: "Is Christ divided? Was Paul then crucified for you? or were you baptized in the name of Paul?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "gratias ago Deo quod neminem vestrum baptizavi nisi Crispum et Gaium"
      en: "I give God thanks, that I baptized none of you but Crispus and Caius;"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ne quis dicat quod in nomine meo baptizati sitis"
      en: "Lest any should say that you were baptized in my name."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "baptizavi autem et Stephanae domum ceterum nescio si quem alium baptizaverim"
      en: "And I baptized also the household of Stephanus; besides, I know not whether I baptized any other."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "non enim misit me Christus baptizare sed evangelizare non in sapientia verbi ut non evacuetur crux Christi"
      en: "For Christ sent me not to baptize, but to preach the gospel: not in wisdom of speech, lest the cross of Christ should be made void."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "verbum enim crucis pereuntibus quidem stultitia est his autem qui salvi fiunt id est nobis virtus Dei est"
      en: "For the word of the cross, to them indeed that perish, is foolishness; but to them that are saved, that is, to us, it is the power of God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "scriptum est enim perdam sapientiam sapientium et prudentiam prudentium reprobabo"
      en: "For it is written: I will destroy the wisdom of the wise, and the prudence of the prudent I will reject."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ubi sapiens ubi scriba ubi conquisitor huius saeculi nonne stultam fecit Deus sapientiam huius mundi"
      en: "Where is the wise? Where is the scribe? Where is the disputer of this world? Hath not God made foolish the wisdom of this world?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nam quia in Dei sapientia non cognovit mundus per sapientiam Deum placuit Deo per stultitiam praedicationis salvos facere credentes"
      en: "For seeing that in the wisdom of God the world, by wisdom, knew not God, it pleased God, by the foolishness of our preaching, to save them that believe."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quoniam et Iudaei signa petunt et Graeci sapientiam quaerunt"
      en: "For both the Jews require signs, and the Greeks seek after wisdom:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "nos autem praedicamus Christum crucifixum Iudaeis quidem scandalum gentibus autem stultitiam"
      en: "But we preach Christ crucified, unto the Jews indeed a stumblingblock, and unto the Gentiles foolishness:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ipsis autem vocatis Iudaeis atque Graecis Christum Dei virtutem et Dei sapientiam"
      en: "But unto them that are called, both Jews and Greeks, Christ the power of God, and the wisdom of God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quia quod stultum est Dei sapientius est hominibus et quod infirmum est Dei fortius est hominibus"
      en: "For the foolishness of God is wiser than men; and the weakness of God is stronger than men."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "videte enim vocationem vestram fratres quia non multi sapientes secundum carnem non multi potentes non multi nobiles"
      en: "For see your vocation, brethren, that there are not many wise according to the flesh, not many mighty, not many noble:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sed quae stulta sunt mundi elegit Deus ut confundat sapientes et infirma mundi elegit Deus ut confundat fortia"
      en: "But the foolish things of the world hath God chosen, that he may confound the wise; and the weak things of the world hath God chosen, that he may confound the strong."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et ignobilia mundi et contemptibilia elegit Deus et quae non sunt ut ea quae sunt destrueret"
      en: "And the base things of the world, and the things that are contemptible, hath God chosen, and things that are not, that he might bring to nought things that are:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ut non glorietur omnis caro in conspectu eius"
      en: "That no flesh should glory in his sight."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ex ipso autem vos estis in Christo Iesu qui factus est sapientia nobis a Deo et iustitia et sanctificatio et redemptio"
      en: "But of him are you in Christ Jesus, who of God is made unto us wisdom, and justice, and sanctification, and redemption:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ut quemadmodum scriptum est qui gloriatur in Domino glorietur"
      en: "That, as it is written: He that glorieth, may glory in the Lord."
    status: { la: verified, en: verified }
