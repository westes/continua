# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 25
verses:
  - n: 1
    text:
      la: "Mortuus est autem Samuel, et congregatus est universus Israel, et planxerunt eum, et sepelierunt eum in domo sua in Ramatha. Consurgensque David descendit in desertum Pharan."
      en: "And Samuel died, and all Israel was gathered together, and they mourned for him, and buried him in his house in Ramatha. And David rose and went down into the wilderness of Pharan."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Erat autem vir quispiam in solitudine Maon, et possessio ejus in Carmelo, et homo ille magnus nimis: erantque ei oves tria millia, et mille caprae: et accidit ut tonderetur grex ejus in Carmelo."
      en: "Now there was a certain man in the wilderness of Maon, and his possessions were in Carmel, and the man was very great: and he had three thousand sheep, and a thousand goats: and it happened that he was shearing his sheep in Carmel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nomen autem viri illius erat Nabal: et nomen uxoris ejus Abigail: eratque mulier illa prudentissima, et speciosa: porro vir ejus durus, et pessimus, et malitiosus: erat autem de genere Caleb."
      en: "Now the name of the man was Nabal: and the name of his wife was Abigail. And she was a prudent and very comely woman, but her husband was churlish, and very bad and ill natured: and he was of the house of Caleb."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cum ergo audisset David in deserto quod tonderet Nabal gregem suum,"
      en: "And when David heard in the wilderness that Nabal was shearing his sheep,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "misit decem juvenes, et dixit eis: Ascendite in Carmelum, et venietis ad Nabal, et salutabitis eum ex nomine meo pacifice."
      en: "He sent ten young men, and said to them: Go up to Carmel, and go to Nabal, and salute him in my name with peace."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dicetis: Sit fratribus meis, et tibi pax, et domui tuae pax, et omnibus, quaecumque habes, sit pax."
      en: "And you shall say: Peace be to my brethren, and to thee, and peace to thy house, and peace to all that thou hast."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Audivi quod tonderent pastores tui, qui erant nobiscum in deserto: numquam eis molesti fuimus, nec aliquando defuit quidquam eis de grege, omni tempore quo fuerunt nobiscum in Carmelo."
      en: "I heard that thy shepherds that were with us in the desert were shearing: we never molested them, neither was there ought missing to them of the flock at any time, all the while they were with us in Carmel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Interroga pueros tuos, et indicabunt tibi. Nunc ergo inveniant pueri tui gratiam in oculis tuis: in die enim bona venimus: quodcumque invenerit manus tua, da servis tuis, et filio tuo David."
      en: "Ask thy servants, and they will tell thee. Now therefore let thy servants find favour in thy eyes: for we are come in a good day, whatsoever thy hand shall find give to thy servants, and to thy son David."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cumque venissent pueri David, locuti sunt ad Nabal omnia verba haec ex nomine David: et siluerunt."
      en: "And when David's servants came, they spoke to Nabal all these words in David's name: and then held their peace."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Respondens autem Nabal pueris David, ait: Quis est David? et quis est filius Isai? hodie increverunt servi qui fugiunt dominos suos."
      en: "But Nabal answering the servants of David, said: Who is David? and what is the son of Isai? servants are multiplied now a days who flee from their masters."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Tollam ergo panes meos, et aquas meas, et carnes pecorum, quae occidi tonsoribus meis, et dabo viris quos nescio unde sint?"
      en: "Shall I then take my bread, and my water, and the flesh of my cattle, which I have killed for my shearers, and give to men whom I know not whence they are?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Regressi sunt itaque pueri David per viam suam, et reversi venerunt, et nuntiaverunt ei omnia verba quae dixerat."
      en: "So the servants of David went back their way, and returning came and told him all the words that he said."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tunc ait David pueris suis: Accingatur unusquisque gladio suo. Et accincti sunt singuli gladiis suis, accinctusque est et David ense suo: et secuti sunt David quasi quadringenti viri: porro ducenti remanserunt ad sarcinas."
      en: "Then David said to his young men: Let every man gird on his sword. And they girded on every man his sword. And David also girded on his sword: and there followed David about four hundred men: and two hundred remained with the baggage."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Abigail autem uxori Nabal nuntiavit unus de pueris suis, dicens: Ecce David misit nuntios de deserto, ut benedicerent domino nostro: et aversatus est eos."
      en: "But one of the servants told Abigail the wife of Nabal, saying: Behold David sent messengers out of the wilderness, to salute our master: and he rejected them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Homines isti boni satis fuerant nobis, et non molesti: nec quidquam aliquando periit omni tempore, quo fuimus conversati cum eis in deserto:"
      en: "These men were very good to us, and gave us no trouble: neither did we ever lose any thing all the time that we conversed with them in the desert."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "pro muro erant nobis tam in nocte quam in die, omnibus diebus quibus pavimus apud eos greges."
      en: "They were a wall unto us both by night and day, all the while we were with them keeping the sheep."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quam ob rem considera, et recogita quid facias: quoniam completa est malitia adversum virum tuum, et adversum domum tuam, et ipse est filius Belial, ita ut nemo possit ei loqui."
      en: "Wherefore consider, and think what thou hast to do: for evil is determined against thy husband, and against thy house, and he is a son of Belial, so that no man can speak to him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Festinavit igitur Abigail, et tulit ducentos panes, et duos utres vini, et quinque arietes coctos, et quinque sata polentae, et centum ligaturas uvae passae, et ducentas massas caricarum, et posuit super asinos:"
      en: "Then Abigail made haste and took two hundred loaves, and two vessels of wine, and five sheep ready dressed, and five measures of parched corn, and a hundred clusters of raisins, and two hundred cakes of dry figs, and laid them upon asses:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dixitque pueris suis: Praecedite me: ecce ego post tergum sequar vos: viro autem suo Nabal non indicavit."
      en: "And she said to her servants: Go before me: behold I will follow after you: but she told not her husband Nabal."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cum ergo ascendisset asinum, et descenderet ad radices montis, David et viri ejus descendebant in occursum ejus: quibus et illa occurrit."
      en: "And when she had gotten upon an ass, and was coming down to the foot of the mountain, David and his men came down over against her, and she met them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ait David: Vere frustra servavi omnia quae hujus erant in deserto, et non periit quidquam de cunctis quae ad eum pertinebant: et reddidit mihi malum pro bono."
      en: "And David said: Truly in vain have I kept all that belonged to this man in the wilderness, and nothing was lost of all that pertained unto him: and he hath returned me evil for good."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Haec faciat Deus inimicis David, et haec addat, si reliquero de omnibus quae ad ipsum pertinent usque mane, mingentem ad parietem."
      en: "May God do so and so, and add more to the foes of David, if I leave of all that belong to him till the morning, any that pisseth against the wall."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cum autem vidisset Abigail David, festinavit, et descendit de asino, et procidit coram David super faciem suam, et adoravit super terram,"
      en: "And when Abigail saw David she made haste and lighted off the ass, and fell before David, on her face, and adored upon the ground."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et cecidit ad pedes ejus, et dixit: In me sit, domine mi, haec iniquitas: loquatur, obsecro ancilla tua in auribus tuis: et audi verba famulae tuae."
      en: "And she fell at his feet, and said: Upon me let this iniquity be, my lord: let thy handmaid speak, I beseech thee, in thy ears: and hear the words of thy servant."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ne ponat, oro, dominus meus rex cor suum super virum istum iniquum Nabal: quoniam secundum nomen suum stultus est, et stultitia est cum eo: ego autem ancilla tua non vidi pueros tuos, domine mi, quos misisti."
      en: "Let not my lord the king, I pray, regard this naughty man Nabal: for according to his name, he is a fool, and folly is with him: but I thy handmaid did not see thy servants, my lord, whom thou sentest."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Nunc ergo, domine mi, vivit Dominus, et vivit anima tua, qui prohibuit te ne venires in sanguinem, et salvavit manum tuam tibi: et nunc fiant sicut Nabal inimici tui, et qui quaerunt domino meo malum."
      en: "Now therefore, my lord, the Lord liveth, and thy soul liveth, who hath withholden thee from coming to blood, and hath saved thy hand to thee: and now let thy enemies be as Nabal, and all they that seek evil to my lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Quapropter suscipe benedictionem hanc, quam attulit ancilla tua tibi domino meo: et da pueris qui sequuntur te dominum meum."
      en: "Wherefore receive this blessing, which thy handmaid hath brought to thee, my lord: and give it to the young men that follow thee, my lord."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Aufer iniquitatem famulae tuae: faciens enim faciet Dominus tibi domino meo domum fidelem, quia praelia Domini, domine mi, tu praeliaris: malitia ergo non inveniatur in te omnibus diebus vitae tuae."
      en: "Forgive the iniquity of thy handmaid: for the Lord will surely make for my lord a faithful house, because thou, my lord, fightest the battles of the Lord: let not evil therefore be found in thee all the days of thy life."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Si enim surrexerit aliquando homo persequens te, et quaerens animam tuam, erit anima domini mei custodita quasi in fasciculo viventium, apud Dominum Deum tuum: porro inimicorum tuorum anima rotabitur, quasi in impetu et circulo fundae."
      en: "For if a man at any time shall rise, and persecute thee, and seek thy life, the soul of my lord shall be kept, as in the bundle of the living, with the Lord thy God: but the souls of thy enemies shall be whirled, as with the violence and whirling of a sling."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Cum ergo fecerit Dominus tibi domino meo omnia quae locutus est bona de te, et constituerit te ducem super Israel,"
      en: "And when the Lord shall have done to thee, my lord, all the good that he hath spoken concerning thee, and shall have made thee prince over Israel,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "non erit tibi hoc in singultum, et in scrupulum cordis domino meo, quod effuderis sanguinem innoxium, aut ipse te ultus fueris: et cum benefecerit Dominus domino meo, recordaberis ancillae tuae."
      en: "This shall not be an occasion of grief to thee, and a scruple of heart to my lord, that thou hast shed innocent blood, or hast revenged thyself: and when the Lord shall have done well by my lord, thou shalt remember thy handmaid."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et ait David ad Abigail: Benedictus Dominus Deus Israel, qui misit hodie te in occursum meum, et benedictum eloquium tuum,"
      en: "And David said to Abigail: Blessed be the Lord the God of Israel, who sent thee this day to meet me, and blessed be thy speech:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et benedicta tu, quae prohibuisti me hodie ne irem ad sanguinem, et ulciscerer me manu mea."
      en: "And blessed be thou, who hast kept me today, from coming to blood, and revenging me with my own hand."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Alioquin vivit Dominus Deus Israel, qui prohibuit me ne malum facerem tibi: nisi cito venisses in occursum mihi, non remansisset Nabal usque ad lucem matutinam, mingens ad parietem."
      en: "Otherwise as the Lord liveth the God of Israel, who hath withholden me from doing thee any evil: if thou hadst not quickly come to meet me, there had not been left to Nabal by the morning light any that pisseth against the wall."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Suscepit ergo David de manu ejus omnia quae attulerat ei, dixitque ei: Vade pacifice in domum tuam, ecce audivi vocem tuam, et honoravi faciem tuam."
      en: "And David received at her hand all that she had brought him, and said to her: Go in peace into thy house, behold I have heard thy voice, and have honoured thy face."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Venit autem Abigail ad Nabal: et ecce erat ei convivium in domo ejus, quasi convivium regis, et cor Nabal jucundum: erat enim ebrius nimis: et non indicavit ei verbum pusillum aut grande usque mane."
      en: "And Abigail came to Nabal: and behold he had a feast in his house, like the feast of a king, and Nabal's heart was merry: for he was very drunk: and she told him nothing less or more until morning."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Diluculo autem cum digessisset vinum Nabal, indicavit ei uxor sua verba haec, et emortuum est cor ejus intrinsecus, et factus est quasi lapis."
      en: "But early in the morning when Nabal had digested his wine, his wife told him these words, and his heart died within him, and he became as a stone."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Cumque pertransissent decem dies, percussit Dominus Nabal, et mortuus est."
      en: "And after ten days had passed, the Lord struck Nabal, and he died."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Quod cum audisset David mortuum Nabal, ait: Benedictus Dominus, qui judicavit causam opprobrii mei de manu Nabal, et servum suum custodivit a malo, et malitiam Nabal reddidit Dominus in caput ejus. Misit ergo David, et locutus est ad Abigail, ut sumeret eam sibi in uxorem."
      en: "And when David had heard that Nabal was dead, he said: Blessed be the Lord, who hath judged the cause of my reproach at the hand of Nabal, and hath kept his servant from evil, and the Lord hath returned the wickedness of Nabal upon his head. Then David sent and treated with Abigail, that he might take her to himself for a wife."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et venerunt pueri David ad Abigail in Carmelum, et locuti sunt ad eam, dicentes: David misit nos ad te, ut accipiat te sibi in uxorem."
      en: "And David's servants came to Abigail to Carmel, and spoke to her, saying: David hath sent us to thee, to take thee to himself for a wife."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Quae consurgens, adoravit prona in terram, et ait: Ecce famula tua sit in ancillam, ut lavet pedes servorum domini mei."
      en: "And she arose and bowed herself down with her face to the earth, and said: Behold, let thy servant be a handmaid, to wash the feet of the servants of my lord."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et festinavit, et surrexit Abigail, et ascendit super asinum, et quinque puellae ierunt cum ea, pedissequae ejus, et secuta est nuntios David: et facta est illi uxor."
      en: "And Abigail arose, and made haste, and got upon an ass, and five damsels went with her, her waiting maids, and she followed the messengers of David, and became his wife."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Sed et Achinoam accepit David de Jezrael: et fuit utraque uxor ejus."
      en: "Moreover David took also Achinoam of Jezrahel: and they were both of them his wives."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Saul autem dedit Michol filiam suam uxorem David, Phalti filio Lais, qui erat de Gallim."
      en: "But Saul gave Michol his daughter, David's wife, to Phalti, the son of Lais, who was of Gallium."
    status: { la: verified, en: verified }
