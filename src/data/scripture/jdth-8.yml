# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 8
verses:
  - n: 1
    text:
      la: "et factum est cum audisset haec Iudith vidua quae erat filia Merari filii Idox filii Ioseph filii Oziae filii Elai filii Iamnor filii Gedeon filii Rafoin filii Acitob filii Melchiae filii Enam filii Nathaniae filii Salathihel filii Symeon filii Ruben"
      en: "Now it came to pass, when Judith a widow had heard these words, who was the daughter of Merari, the son of Idox, the son of Joseph, the son of Ozias, the son of Elai, the son of Jamnor, the son of Gedeon, the son of Raphaim, the son of Achitob, the son of Melehias, the son of Enan, the son of Nathanias, the son of Salathiel, the son of Simeon, the son of Ruben:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et vir eius fuit Manasses qui mortuus est in diebus messis hordiariae"
      en: "And her husband was Manasses, who died in the time of the barley harvest:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "instabat enim super alligantes manipulos in campo et venit aestus super caput eius et mortuus est in Bethuliam civitatem suam et sepultus est illic cum patribus suis"
      en: "For he was standing over them that bound sheaves in the field ; and the heat came upon his head, and he died in Bethulia his own city, and was buried there with his fathers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "erat autem Iudith relicta eius vidua iam annis tribus et mensibus sex"
      en: "And Judith his relict was a widow now three years and six months."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et in superioribus domus suae fecit sibi secretum cubiculum in quo cum puellis suis clausa morabatur"
      en: "And she made herself a private chamber in the upper part of her house, in which she abode shut up with her maids."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et habens super lumbos suos cilicium ieiunabat omnibus diebus vitae suae praeter sabbata et neomenia et festa domus Israhel"
      en: "And she wore haircloth upon her loins, and fasted all the days of her life, except the sabbaths, and new moons, and the feasts of the house of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "erat autem eleganti aspectu nimis cui vir suus reliquerat divitias multas et familiam copiosam ac possessiones armentis boum et gregibus ovium plenas"
      en: "And she was exceedingly beautiful, and her husband left her great riches, and very many servants, and large possessions of herds of oxen, and flocks of sheep."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et erat haec in eo omnibus famosissima quoniam timebat Dominum valde nec erat qui loqueretur de illa verbum malum"
      en: "And she was greatly renowned among all, because she feared the Lord very much, neither was there any one that spoke an ill word of her."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "haec itaque cum audisset quoniam Ozias promisisset quod transacto quinto die traderet civitatem misit ad presbyteros Chabri et Carmin"
      en: "When therefore she had heard that Ozias had promised that he would deliver up the city after the fifth day, she sent to the ancients Chabri and Charmi."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et venerunt ad illam et dixit illis quod est hoc verbum in quo consensit Ozias ut tradat civitatem Assyriis si intra quinque dies non venerit vobis adiutorium"
      en: "And they came to her, and she said to them: What is this word, by which Ozias hath consented to give up the city to the Assyrians, if within five days there come no aid to us?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et qui estis vos qui temptatis Dominum"
      en: "And who are you that tempt the Lord?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "non est iste sermo qui misericordiam provocet sed potius qui iram excitet et furorem accendat"
      en: "This is not a word that may draw down mercy, but rather that may stir up wrath, and enkindle indignation."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "posuistis vos tempus miserationis Domini et in arbitrium vestrum diem constituistis ei"
      en: "You have set a time for the mercy of the Lord, and you have appointed him a day, according to your pleasure."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed quia patiens est Dominus in hoc ipso paeniteamur et indulgentiam eius lacrimis postulemus"
      en: "But forasmuch as the Lord is patient, let us be penitent for this same thing, and with many tears let us beg his pardon:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "non enim quasi homo Deus sic comminabitur neque sicut filius hominis ad iracundiam inflammabitur"
      en: "For God will not threaten like man, nor be inflamed to anger like the son of man."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ideo humiliemus illi animas nostras et in spiritu constituti humiliato servientes illi"
      en: "And therefore let us humble our souls before him, and continuing in an humble spirit, in his service:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dicamus flentes Domino ut secundum voluntatem suam sic faciat nobiscum misericordiam suam ut sicut conturbatum est cor nostrum in superbia eorum ita etiam de nostra humilitate gloriemur"
      en: "Let us ask the Lord with tears, that according to his will so he would shew his mercy to us: that as our heart is troubled by their pride, so also we may glorify in our humility."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quoniam non sumus secuti peccata patrum nostrorum qui dereliquerunt Deum suum et adoraverunt deos alienos"
      en: "For we have not followed the sins of our fathers, who forsook their God, and worshipped strange gods."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "pro scelere quo dati sunt in gladium et in rapinam et in confusionem inimicis suis nos autem alterum deum nescimus praeter ipsum"
      en: "For which crime they were given up to their enemies, to the sword, and to pillage, and to confusion: but we know no other God but him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "expectemus humiles consolationem eius et exquiret sanguinem nostrum de adflictionibus inimicorum nostrorum et humiliabit omnes gentes quaecumque insurgunt contra nos et faciet illas sine honore Dominus Deus noster"
      en: "Let us humbly wait for his consolation, and the Lord our God will require our blood of the afflictions of our enemies, and he will humble all the nations that shall rise up against us, and bring them to disgrace."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et nunc fratres quoniam vos qui estis presbyteri in populo Dei ex vobis pendet anima illorum adloquio vestro corda eorum erigite ut memores sint quia temptati sunt patres nostri ut probarentur si vere colerent Deum suum"
      en: "And now, brethren, as you are the ancients among the people of God, and their very soul resteth upon you: comfort their hearts by your speech, that they may be mindful how our fathers were tempted that they might be proved, whether they worshipped their God truly."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "memores esse debent quomodo pater noster Abraham temptatus est et per multas tribulationes probatus Dei amicus effectus est"
      en: "They must remember how our father Abraham was tempted, and being proved by many tribulations, was made the friend of God."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sic Isaac sic Iacob sic Moses et omnes qui placuerunt Deo per multas tribulationes transierunt fideles"
      en: "go Isaac, so Jacob, so Moses, and all that have pleased God, passed through many tribulations, remaining faithful."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "illi autem qui temptationes non susceperunt cum timore Domini et patientia sua inproperium murmurationis suae contra Dominum protulerunt"
      en: "But they that did not receive the trials with the fear of the Lord, but uttered their impatience and the reproach of their murmuring against the Lord,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "exterminati sunt ab exterminatore et a serpentibus perierunt"
      en: "Were destroyed by the destroyer, and perished by serpents."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et nos ergo non ulciscamur nos pro his quae patimur"
      en: "As for us therefore let us not revenge ourselves for these things which we suffer"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sed reputantes peccatis nostris haec ipsa minora esse supplicia flagella Domini quasi servi qui corripimur ad emendationem non ad perditionem nostram evenisse credamus"
      en: "But esteeming these very punishments to be less than our sins deserve, let us believe that these scourges of the Lord, with which like servants we are chastised, have happened for our amendment, and not for our destruction."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et dixerunt illi Ozias et presbyteri omnia quae locuta es vera sunt et non est in sermonibus tuis ulla reprehensio"
      en: "And Ozias and the ancients said to her: All things which thou hast spoken are true, and there is nothing to be reprehended in thy words."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "nunc ergo ora pro nobis quoniam mulier sancta es et timens Dominum"
      en: "Now therefore pray for us, for thou art a holy woman, and one fearing God."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et dixit illis Iudith sicut quod loqui potui Dei esse cognoscitis"
      en: "And Judith said to them: As you know that what I have been able to say is of God:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ita quod facere disposui probate si ex Deo est et orate ut firmum faciat consilium meum Deus"
      en: "So that which I intend to do prove ye if it be of God, and pray that God may strengthen my design."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "stabitis vos ad portam nocte ista et ego exeam cum abra mea et orate ut sicut dixistis in diebus quinque respiciat Dominus populum suum Israhel"
      en: "You shall stand at the gate this night, and I will go out with my maidservant: and pray ye, that as you have said, in five days the Lord may look down upon his people Israel."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "vos autem nolo scrutemini actum meum et usque dum renuntiem vobis nihil aliud fiat nisi oratio pro me ad Dominum Deum nostrum"
      en: "But I desire that you search not into what I am doing, and till I bring you word let nothing else be done but to pray for me to the Lord our God."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et dixit ad eam Ozias princeps Iudaeae vade in pace et Dominus sit tecum in ultione inimicorum nostrorum et revertentes abierunt"
      en: "And Ozias the prince of Juda said to her: Go in peace, and the Lord be with thee to take revenge of our enemies. So returning they departed."
    status: { la: verified, en: verified }
