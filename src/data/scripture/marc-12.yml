# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: marc
chapter: 12
verses:
  - n: 1
    text:
      la: "et coepit illis in parabolis loqui vineam pastinavit homo et circumdedit sepem et fodit lacum et aedificavit turrem et locavit eam agricolis et peregre profectus est"
      en: "And he began to speak to them in parables: A certain man planted a vineyard and made a hedge about it, and dug a place for the winefat, and built a tower, and let it to husbandmen; and went into a far country."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et misit ad agricolas in tempore servum ut ab agricolis acciperet de fructu vineae"
      en: "And at the season he sent to the husbandmen a servant to receive of the husbandmen of the fruit of the vineyard."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui adprehensum eum ceciderunt et dimiserunt vacuum"
      en: "Who having laid hands on him, beat him, and sent him away empty."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et iterum misit ad illos alium servum et illum capite vulneraverunt et contumeliis adfecerunt"
      en: "And again he sent to them another servant; and him they wounded in the head, and used him reproachfully."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et rursum alium misit et illum occiderunt et plures alios quosdam caedentes alios vero occidentes"
      en: "And again he sent another, and him they killed: and many others, of whom some they beat, and others they killed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "adhuc ergo unum habens filium carissimum et illum misit ad eos novissimum dicens quia reverebuntur filium meum"
      en: "Therefore having yet one son, most dear to him; he also sent him unto them last of all, saying: They will reverence my son."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "coloni autem dixerunt ad invicem hic est heres venite occidamus eum et nostra erit hereditas"
      en: "But the husbandmen said one to another: This is the heir; come let us kill him; and the inheritance shall be ours."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et adprehendentes eum occiderunt et eiecerunt extra vineam"
      en: "And laying hold on him, they killed him, and cast him out of the vineyard."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quid ergo faciet dominus vineae veniet et perdet colonos et dabit vineam aliis"
      en: "What therefore will the lord of the vineyard do? He will come and destroy those husbandmen; and will give the vineyard to others."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "nec scripturam hanc legistis lapidem quem reprobaverunt aedificantes hic factus est in caput anguli"
      en: "And have you not read this scripture, The stone which the builders rejected, the same is made the head of the corner:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "a Domino factum est istud et est mirabile in oculis nostris"
      en: "By the Lord has this been done, and it is wonderful in our eyes."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et quaerebant eum tenere et timuerunt turbam cognoverunt enim quoniam ad eos parabolam hanc dixerit et relicto eo abierunt"
      en: "And they sought to lay hands on him, but they feared the people. For they knew that he spoke this parable to them. And leaving him, they went their way."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et mittunt ad eum quosdam ex Pharisaeis et Herodianis ut eum caperent in verbo"
      en: "And they sent to him some of the Pharisees and of the Herodians; that they should catch him in his words."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui venientes dicunt ei magister scimus quoniam verax es et non curas quemquam nec enim vides in faciem hominis sed in veritate viam Dei doces licet dari tributum Caesari an non dabimus"
      en: "Who coming, say to him: Master, we know that thou art a true speaker, and carest not for any man; for thou regardest not the person of men, but teachest the way of God in truth. Is it lawful to give tribute to Caesar; or shall we not give it?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui sciens versutiam eorum ait illis quid me temptatis adferte mihi denarium ut videam"
      en: "Who knowing their wiliness, saith to them: Why tempt you me? bring me a penny that I may see it."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "at illi adtulerunt et ait illis cuius est imago haec et inscriptio dicunt illi Caesaris"
      en: "And they brought it him. And he saith to them: Whose is this image and inscription? They say to him, Caesar's."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "respondens autem Iesus dixit illis reddite igitur quae sunt Caesaris Caesari et quae sunt Dei Deo et mirabantur super eo"
      en: "And Jesus answering, said to them: Render therefore to Caesar the things that are Caesar's, and to God the things that are God's. And they marvelled at him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et venerunt ad eum Sadducaei qui dicunt resurrectionem non esse et interrogabant eum dicentes"
      en: "And there came to him the Sadducees, who say there is no resurrection; and they asked him, saying:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "magister Moses nobis scripsit ut si cuius frater mortuus fuerit et dimiserit uxorem et filios non reliquerit accipiat frater eius uxorem ipsius et resuscitet semen fratri suo"
      en: "Master, Moses wrote unto us, that if any man's brother die, and leave his wife behind him, and leave no children, his brother should take his wife, and raise up seed to his brother."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "septem ergo fratres erant et primus accepit uxorem et mortuus est non relicto semine"
      en: "Now there were seven brethren; and the first took a wife, and died leaving no issue."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et secundus accepit eam et mortuus est et nec iste reliquit semen et tertius similiter"
      en: "And the second took her, and died: and neither did he leave any issue. And the third in like manner."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et acceperunt eam similiter septem et non reliquerunt semen novissima omnium defuncta est et mulier"
      en: "And the seven all took her in like manner; and did not leave issue. Last of all the woman also died."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "in resurrectione ergo cum resurrexerint cuius de his erit uxor septem enim habuerunt eam uxorem"
      en: "In the resurrection therefore, when they shall rise again, whose wife shall she be of them? for the seven had her to wife."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et respondens Iesus ait illis non ideo erratis non scientes scripturas neque virtutem Dei"
      en: "And Jesus answering, saith to them: Do ye not therefore err, because you know not the scriptures, nor the power of God?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cum enim a mortuis resurrexerint neque nubent neque nubentur sed sunt sicut angeli in caelis"
      en: "For when they shall rise again from the dead, they shall neither marry, nor be married, but are as the angels in heaven."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "de mortuis autem quod resurgant non legistis in libro Mosi super rubum quomodo dixerit illi Deus inquiens ego sum Deus Abraham et Deus Isaac et Deus Iacob"
      en: "And as concerning the dead that they rise again, have you not read in the book of Moses, how in the bush God spoke to him, saying: I am the God of Abraham, and the God of Isaac, and the God of Jacob?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "non est Deus mortuorum sed vivorum vos ergo multum erratis"
      en: "He is not the God of the dead, but of the living. You therefore do greatly err."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et accessit unus de scribis qui audierat illos conquirentes et videns quoniam bene illis responderit interrogavit eum quod esset primum omnium mandatum"
      en: "And there came one of the scribes that had heard them reasoning together, and seeing that he had answered them well, asked him which was the first commandment of all."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Iesus autem respondit ei quia primum omnium mandatum est audi Israhel Dominus Deus noster Deus unus est"
      en: "And Jesus answered him: The first commandment of all is, Hear, O Israel: the Lord thy God is one God."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et diliges Dominum Deum tuum ex toto corde tuo et ex tota anima tua et ex tota mente tua et ex tota virtute tua hoc est primum mandatum"
      en: "And thou shalt love the Lord thy God, with thy whole heart, and with thy whole soul, and with thy whole mind, and with thy whole strength. This is the first commandment."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "secundum autem simile illi diliges proximum tuum tamquam te ipsum maius horum aliud mandatum non est"
      en: "And the second is like to it: Thou shalt love thy neighbour as thyself. There is no other commandment greater than these."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et ait illi scriba bene magister in veritate dixisti quia unus est et non est alius praeter eum"
      en: "And the scribe said to him: Well, Master, thou hast said in truth, that there is one God, and there is no other besides him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et ut diligatur ex toto corde et ex toto intellectu et ex tota anima et ex tota fortitudine et diligere proximum tamquam se ipsum maius est omnibus holocaustomatibus et sacrificiis"
      en: "And that he should be loved with the whole heart, and with the whole understanding, and with the whole soul, and with the whole strength; and to love one's neighbour as one's self, is a greater thing than all holocausts and sacrifices."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Iesus autem videns quod sapienter respondisset dixit illi non es longe a regno Dei et nemo iam audebat eum interrogare"
      en: "And Jesus seeing that he had answered wisely, said to him: Thou art not far from the kingdom of God. And no man after that durst ask him any question."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et respondens Iesus dicebat docens in templo quomodo dicunt scribae Christum Filium esse David"
      en: "And Jesus answering, said, teaching in the temple: How do the scribes say, that Christ is the son of David?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "ipse enim David dicit in Spiritu Sancto dixit Dominus Domino meo sede a dextris meis donec ponam inimicos tuos scabillum pedum tuorum"
      en: "For David himself saith by the Holy Ghost: The Lord said to my Lord, Sit on my right hand, until I make thy enemies thy footstool."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "ipse ergo David dicit eum Dominum et unde est filius eius et multa turba eum libenter audivit"
      en: "David therefore himself calleth him Lord, and whence is he then his son? And a great multitude heard him gladly."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et dicebat eis in doctrina sua cavete a scribis qui volunt in stolis ambulare et salutari in foro"
      en: "And he said to them in his doctrine: Beware of the scribes, who love to walk in long robes, and to be saluted in the marketplace,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et in primis cathedris sedere in synagogis et primos discubitus in cenis"
      en: "And to sit in the first chairs, in the synagogues, and to have the highest places at suppers:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "qui devorant domos viduarum sub obtentu prolixae orationis hii accipient prolixius iudicium"
      en: "Who devour the houses of widows under the pretence of long prayer: these shall receive greater judgment."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et sedens Iesus contra gazofilacium aspiciebat quomodo turba iactaret aes in gazofilacium et multi divites iactabant multa"
      en: "And Jesus sitting over against the treasury, beheld how the people cast money into the treasury, and many that were rich cast in much."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "cum venisset autem una vidua pauper misit duo minuta quod est quadrans"
      en: "And there came a certain poor widow, and she cast in two mites, which make a farthing."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et convocans discipulos suos ait illis amen dico vobis quoniam vidua haec pauper plus omnibus misit qui miserunt in gazofilacium"
      en: "And calling his disciples together, he saith to them: Amen I say to you, this poor widow hath cast in more than all they who have cast into the treasury."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "omnes enim ex eo quod abundabat illis miserunt haec vero de penuria sua omnia quae habuit misit totum victum suum"
      en: "For all they did cast in of their abundance; but she of her want cast in all she had, even her whole living."
    status: { la: verified, en: verified }
