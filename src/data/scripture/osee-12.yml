# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: osee
chapter: 12
verses:
  - n: 1
    text:
      la: "Ephraim pascit ventum et sequitur aestum tota die mendacium et vastitatem multiplicat et foedus cum Assyriis iniit et oleum in Aegyptum ferebat"
      en: "Ephraim feedeth on the wind, and followeth the burning heat: all the day long he multiplied lies and desolation: and he hath made a covenant with the Assyrians, and carried oil into Egypt."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "iudicium ergo Domini cum Iuda et visitatio super Iacob iuxta vias eius et iuxta adinventiones eius reddet ei"
      en: "Therefore there is a judgment of the Lord with Juda, and a visitation for Jacob: he will render to him according to his ways, and according to his devices."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in utero subplantavit fratrem suum et in fortitudine sua directus est cum angelo"
      en: "In the womb he supplanted his brother: and by his strength he had success with an angel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et invaluit ad angelum et confortatus est flevit et rogavit eum in Bethel invenit eum et ibi locutus est nobiscum"
      en: "And he prevailed over the angel, and was strengthened: he wept, and made supplication to him: he found him in Bethel, and there he spoke with us."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et Dominus Deus exercituum Dominus memoriale eius"
      en: "Even the Lord the God of hosts, the Lord is his memorial."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et tu ad Deum tuum converteris misericordiam et iudicium custodi et spera in Deo tuo semper"
      en: "Therefore turn thou to thy God : keep mercy and judgment, and hope in thy God always."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Chanaan in manu eius statera dolosa calumniam dilexit"
      en: "He is like Chanaan, there is a deceitful balance in his hand, he hath loved oppression."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et dixit Ephraim verumtamen dives effectus sum inveni idolum mihi omnes labores mei non invenient mihi iniquitatem quam peccavi"
      en: "And Ephraim said: But yet I am be- come rich, I have found me an idol: all my labours shall not find me the iniquity that I have committed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et ego Dominus Deus tuus ex terra Aegypti adhuc sedere te faciam in tabernaculis sicut in diebus festivitatis"
      en: "And I that am the Lord thy God from the land of Egypt, will yet cause thee to dwell in tabernacles, as in the days of the feast."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et locutus sum super prophetas et ego visionem multiplicavi et in manu prophetarum adsimilatus sum"
      en: "And I have spoken by the prophets, and I have multiplied visions, and I have used similitudes by the ministry of the prophets."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si Galaad idolum tamen frustra erant in Galgal bubus immolantes nam et altaria eorum quasi acervi super sulcos agri"
      en: "If Galaad be an idol, then in vain were they in Galgal offering sacrifices with bullocks: for their altars also are as heaps in the furrows of the field."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "fugit Iacob in regionem Syriae et servivit Israhel in uxore et in uxore servavit"
      en: "Jacob fled into the country of Syria, and Israel served for a wife, and was a keeper for a wife."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "in propheta autem eduxit Dominus Israhel de Aegypto et in propheta servatus est"
      en: "But the Lord by a prophet brought Israel out of Egypt: and he was pre- served by a prophet."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ad iracundiam me provocavit Ephraim in amaritudinibus suis et sanguis eius super eum veniet et obprobrium eius restituet ei Dominus suus"
      en: "Ephraim hath provoked me to wrath with his bitterness, and his blood shall come upon him, and his Lord will render his reproach unto him."
    status: { la: verified, en: verified }
