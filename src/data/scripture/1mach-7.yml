# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1mach
chapter: 7
verses:
  - n: 1
    text:
      la: "Anno centesimo quinquagesimo primo, exiit Demetrius Seleuci filius ab urbe Roma, et ascendit cum paucis viris in civitatem maritimam, et regnavit illic."
      en: "In the hundred and fifty-first year Demetrius the son of Seleucus departed from the city of Rome, and came up with a few men into a city of the sea coast, and reigned there."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et factum est, ut ingressus est domum regni patrum suorum, comprehendit exercitus Antiochum et Lysiam, ut adducerent eos ad eum."
      en: "And it came to pass, as he entered into the house of the kingdom of his fathers, that the army seized upon Antiochus, and Lysias, to bring them unto him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et res ei innotuit, et ait: Nolite mihi ostendere faciem eorum."
      en: "And when he knew it, he said: Let me not see their face."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et occidit eos exercitus. Et sedit Demetrius super sedem regni sui."
      en: "So the army slew them. And Demetrius sat upon the throne of his kingdom:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et venerunt ad eum viri iniqui et impii ex Israel: et Alcimus dux eorum, qui volebat fieri sacerdos."
      en: "And there came to him the wicked and ungodly men of Israel: And Alcimus was at the head of them, who desired to be made high priest."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et accusaverunt populum apud regem, dicentes: Perdidit Judas et fratres ejus omnes amicos tuos, et nos dispersit de terra nostra."
      en: "And they accused the people to the king, saying: Judas and his brethren have destroyed all thy friends, and he hath driven us out of our land."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nunc ergo mitte virum, cui credis, ut eat, et videat exterminium omne quod fecit nobis, et regionibus regis: et puniat omnes amicos ejus, et adjutores eorum."
      en: "Now therefore send some man whom thou trustest, and let him go, and see all the havock he hath made amongst us, and in the king's lands: and let him punish all his friends and their helpers."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et elegit rex ex amicis suis Bacchidem, qui dominabatur trans flumen magnum in regno, et fidelem regi: et misit eum,"
      en: "Then the king chose Bacchides, one of his friends that ruled beyond the great river in the kingdom, and was faithful to the king: and he sent him,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ut videret exterminium quod fecit Judas: sed et Alcimum impium constituit in sacerdotium, et mandavit ei facere ultionem in filios Israel."
      en: "To see the havock that Judas had made: and the wicked Alcimus he made high priest, and commanded him to take revenge upon the children of Israel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et surrexerunt, et venerunt cum exercitu magno in terram Juda: et miserunt nuntios, et locuti sunt ad Judam et ad fratres ejus verbis pacificis in dolo."
      en: "And they arose, and came with a great army into the land of Juda: and they sent messengers, and spoke to Judas and his brethren with peaceable words deceitfully."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et non intenderunt sermonibus eorum: viderunt enim quia venerunt cum exercitu magno."
      en: "But they gave no heed to their words: for they saw that they were come with a great army."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et convenerunt ad Alcimum et Bacchidem congregatio scribarum requirere quae justa sunt:"
      en: "Then there assembled to Alcimus and Bacchides a company of the scribes to require things that are just:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et primi, Assidaei qui erant in filiis Israel: et exquirebant ab eis pacem."
      en: "And first the Assideans that were among the children of Israel, and they sought peace of them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixerunt enim: Homo sacerdos de semine Aaron venit; non decipiet nos:"
      en: "For they said: One that is a priest of the seed of Aaron is come, he will not deceive us."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et locutus est cum eis verba pacifica, et juravit illis, dicens: Non inferemus vobis malum, neque amicis vestris."
      en: "And he spoke to them peaceably: and he swore to them, saying: We will do you no harm nor your friends."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et crediderunt ei: et comprehendit ex eis sexaginta viros, et occidit eos in una die, secundum verbum quod scriptum est:"
      en: "And they believed him. And he took threescore of them, and slew them in one day, according to the word that is written:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Carnes sanctorum tuorum, et sanguinem ipsorum effuderunt in circuitu Jerusalem, et non erat qui sepeliret."
      en: "The flesh of thy saints, and the blood of them they have shed round about Jerusalem, and there was none to bury them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et incubuit timor et tremor in omnem populum: quia dixerunt: Non est veritas, et judicium in eis: transgressi sunt enim constitutum, et jusjurandum quod juraverunt."
      en: "Then fear and trembling fell upon all the people: for they said: There is no truth, nor justice among them: for they have broken the covenant, and the oath which they made."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et movit Bacchides castra ab Jerusalem, et applicuit in Bethzecha: et misit, et comprehendit multos ex eis qui a se effugerant: et quosdam de populo mactavit, et in puteum magnum projecit."
      en: "And Bacchides removed the camp from Jerusalem, and pitched in Bethzecha: and he sent, and took many of them that were fled away from him, and some of the people he killed, and threw them into a great pit."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et commisit regionem Alcimo, et reliquit cum eo auxilium in adjutorium ipsi. Et abiit Bacchides ad regem:"
      en: "Then he committed the country to Alcimus, and left with him troops to help him. So Bacchides went away to the king:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et satis agebat Alcimus pro principatu sacerdotii sui:"
      en: "But Alcimus did what he could to maintain his chief priesthood."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et convenerunt ad eum omnes, qui perturbabant populum suum, et obtinuerunt terram Juda, et fecerunt plagam magnam in Israel."
      en: "And they that disturbed the people resorted to him, and they got the land of Juda into their power, and did much hurt in Israel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et vidit Judas omnia mala quae fecit Alcimus et qui cum eo erant filiis Israel, multo plus quam gentes:"
      en: "And Judas saw all the evils that Alcimus, and they that were with him, did to the children of Israel, much more than the Gentiles."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et exiit in omnes fines Judaeae in circuitu, et fecit vindictam in viros desertores, et cessaverunt ultra exire in regionem."
      en: "And he went out into all the coasts of Juda round about, and took vengeance upon the men that had revolted, and they ceased to go forth any more into the country."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Vidit autem Alcimus quod praevaluit Judas et qui cum eo erant, et cognovit quia non potest sustinere eos: et regressus est ad regem, et accusavit eos multis criminibus."
      en: "And Alcimus saw that Judas, and they that were with him prevailed: and he knew that he could not stand against them, and he went back to the king, and accused them of many crimes."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et misit rex Nicanorem, unum ex principibus suis nobilioribus, qui erat inimicitias exercens contra Israel: et mandavit ei evertere populum."
      en: "And the king sent Nicanor one of his principal lords, who was a great enemy to Israel: and he commanded him to destroy the people."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et venit Nicanor in Jerusalem cum exercitu magno, et misit ad Judam et ad fratres ejus verbis pacificis cum dolo,"
      en: "And Nicanor came to Jerusalem with a great army, and he sent to Judas and to his brethren deceitfully with friendly words,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dicens: Non sit pugna inter me et vos: veniam cum viris paucis, ut videam facies vestras cum pace."
      en: "Saying: Let there be no fighting between me and you: I will come with a few men to see your faces with peace."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et venit ad Judam, et salutaverunt se invicem pacifice: et hostes parati erant rapere Judam."
      en: "And he came to Judas, and they saluted one another peaceably: and the enemies were prepared to take away Judas by force."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et innotuit sermo Judae quoniam cum dolo venerat ad eum: et conterritus est ab eo, et amplius noluit videre faciem ejus."
      en: "And the thing was known to Judas that he was come to him with deceit: and he was much afraid of him, and would not see his face any more."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et cognovit Nicanor quoniam denudatum est consilium ejus: et exivit obviam Judae in pugnam juxta Capharsalama."
      en: "And Nicanor knew that his counsel was discovered: and he went out to fight against Judas near Capharsalama."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et ceciderunt de Nicanoris exercitu fere quinque millia viri, et fugerunt in civitatem David."
      en: "And there fell of Nicanor's army almost five thousand men, and they fled into the city of David."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et post haec verba ascendit Nicanor in montem Sion: et exierunt de sacerdotibus populi salutare eum in pace, et demonstrare ei holocautomata, quae offerebantur pro rege."
      en: "And after this Nicanor went up into mount Sion: and some of the priests and the people came out to salute him peaceably, and to shew him the holocausts that were offered for the king."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et irridens sprevit eos, et polluit: et locutus est superbe,"
      en: "But he mocked them and despised them, and abused them: and he spoke proudly,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et juravit cum ira, dicens: Nisi traditus fuerit Judas et exercitus ejus in manus meas, continuo cum regressus fuero in pace, succendam domum istam. Et exiit cum ira magna."
      en: "And swore in anger, saying: Unless Judas and his army be delivered into my hands, as soon as ever I return in peace, I will burn this house. And he went out in a great rage."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et intraverunt sacerdotes, et steterunt ante faciem altaris et templi, et flentes dixerunt:"
      en: "And the priests went in, and stood before the face of the altar and the temple: and weeping, they said:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Tu, Domine, elegisti domum istam ad invocandum nomen tuum in ea, ut esset domus orationis et obsecrationis populo tuo:"
      en: "Thou, O Lord, hast chosen this house for thy name to be called upon therein, that it might be a house of prayer and supplication for thy people."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "fac vindictam in homine isto et exercitu ejus, et cadant in gladio: memento blasphemias eorum, et ne dederis eis ut permaneant."
      en: "Be avenged of this man, and his army, and let them fall by the sword: remember their blasphemies, and suffer them not to continue any longer."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et exiit Nicanor ab Jerusalem, et castra applicuit ad Bethoron: et occurrit illi exercitus Syriae."
      en: "Then Nicanor went out from Jerusalem, and encamped near to Bethoron: and an army of Syria joined him."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et Judas applicuit in Adarsa cum tribus millibus viris: et oravit Judas, et dixit:"
      en: "But Judas pitched in Adarsa with three thousand men: and Judas prayed, and said:"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Qui missi erant a rege Sennacherib, Domine, quia blasphemaverunt te, exiit angelus, et percussit ex eis centum octoginta quinque millia:"
      en: "O Lord, when they that were sent by king Sennacherib blasphemed thee, an angel went out, and slew of them a hundred and eighty-five thousand:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "sic contere exercitum istum in conspectu nostro hodie: et sciant ceteri quia male locutus est super sancta tua: et judica illum secundum malitiam illius."
      en: "Even so destroy this army in our sight today, and let the rest know that he hath spoken ill against thy sanctuary: and judge thou him according to his wickedness."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et commiserunt exercitus praelium tertiadecima die mensis Adar: et contrita sunt castra Nicanoris, et cecidit ipse primus in praelio."
      en: "And the armies joined battle on the thirteenth day of the month Adar: and the army of Nicanor was defeated, and he himself was first slain in the battle."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Ut autem vidit exercitus ejus quia cecidisset Nicanor, projecerunt arma sua, et fugerunt:"
      en: "And when his army saw that Nicanor was slain, they threw away their weapons, and fled:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et persecuti sunt eos viam unius diei ab Adazer usquequo veniatur in Gazara, et tubis cecinerunt post eos cum significationibus:"
      en: "And they pursued after them one day's journey from Adazer, even till ye come to Gazara, and they sounded the trumpets after them with signals."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et exierunt de omnibus castellis Judaeae in circuitu, et ventilabant eos cornibus, et convertebantur iterum ad eos, et ceciderunt omnes gladio, et non est relictus ex eis nec unus."
      en: "And they went forth out of all the towns of Judea round about, and they pushed them with the horns, and they turned again to them, and they were all slain with the sword, and there was not left of them so much as one."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et acceperunt spolia eorum in praedam: et caput Nicanoris amputaverunt, et dexteram ejus, quam extenderat superbe, et attulerunt, et suspenderunt contra Jerusalem."
      en: "And they took the spoils of them for a booty, and they cut off Nicanor's head, and his right hand, which he had proudly stretched out, and they brought it, and hung it up over against Jerusalem."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Et laetatus est populus valde, et egerunt diem illam in laetitia magna."
      en: "And the people rejoiced exceedingly, and they spent that day with great joy."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et constituit agi omnibus annis diem istam tertiadecima die mensis Adar."
      en: "And he ordained that this day should be kept every year, being the thirteenth of the month of Adar."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Et siluit terra Juda dies paucos."
      en: "And the land of Juda was quiet for a short time."
    status: { la: verified, en: verified }
