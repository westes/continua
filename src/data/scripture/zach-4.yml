# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: zach
chapter: 4
verses:
  - n: 1
    text:
      la: "Et reversus est angelus qui loquebatur in me, et suscitavit me quasi virum qui suscitatur de somno suo."
      en: "And the angel that spoke in me came again: and he waked me, as a man that is wakened out of his sleep."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et dixit ad me: Quid tu vides? Et dixi: Vidi, et ecce candelabrum aureum totum, et lampas ejus super caput ipsius, et septem lucernae ejus super illud, et septem infusoria lucernis quae erant super caput ejus."
      en: "And he said to me: What seest thou? And I said: I have looked, and behold a candlestick all of gold, and its lamp upon the top of it: and the seven lights thereof upon it: and seven funnels for the lights that were upon the top thereof."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et duae olivae super illud: una a dextris lampadis, et una a sinistris ejus."
      en: "And two olive trees over it: one upon the right side of the lamp, and the other upon the left side thereof."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et respondi, et aio ad angelum qui loquebatur in me, dicens: Quid sunt haec, domine mi?"
      en: "And I answered, and said to the angel that spoke in me, saying: What are these things, my lord?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et respondit angelus qui loquebatur in me, et dixit ad me: Numquid nescis quid sunt haec? Et dixi: Non, domine mi."
      en: "And the angel that spoke in me answered, and said to me: Knowest thou not what these things are? And I said: No, my lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et respondit, et ait ad me, dicens: Hoc est verbum Domini ad Zorobabel, dicens: Non in exercitu, nec in robore, sed in spiritu meo, dicit Dominus exercituum."
      en: "And he answered, and spoke to me, saying: This is the word of the Lord to Zorobabel, saying: Not with an army, nor by might, but by my spirit, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quis tu, mons magne, coram Zorobabel? In planum: et educet lapidem primarium, et exaequabit gratiam gratiae ejus."
      en: "Who art thou, O great mountain, before Zorobabel? thou shalt become a plain: and he shall bring out the chief stone, and shall give equal grace to the grace thereof."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Manus Zorobabel fundaverunt domum istam, et manus ejus perficient eam: et scietis quia Dominus exercituum misit me ad vos."
      en: "The hands of Zorobabel have laid the foundations of this house, and his hands shall finish it: and you shall know that the Lord of hosts hath sent me to you."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quis enim despexit dies parvos? Et laetabuntur, et videbunt lapidem stantem in manu Zorobabel. Septem isti oculi sunt Domini, qui discurrunt in universam terram."
      en: "For who hath despised little days? and they shall rejoice, and shall see the tin plummet in the hand of Zorobabel. These are the seven eyes of the Lord, that run to and fro through the whole earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et respondi, et dixi ad eum: Quid sunt duae olivae istae, ad dexteram candelabri, et ad sinistram ejus?"
      en: "And I answered, and said to him: What are these two olive trees upon the right side of the candlestick, and upon the left side thereof?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et respondi secundo, et dixi ad eum: Quid sunt duae spicae olivarum quae sunt juxta duo rostra aurea in quibus sunt suffusoria ex auro?"
      en: "And I answered again, and said to him: What are the two olive branches, that are by the two golden beaks, in which are the funnels of gold?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et ait ad me, dicens: Numquid nescis quid sunt haec? Et dixi: Non, domine mi."
      en: "And he spoke to me, saying: Knowest thou not what these are? And I said: No, my lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et dixit: Isti sunt duo filii olei, qui assistunt Dominatori universae terrae."
      en: "And he said: These are two sons of oil who stand before the Lord of the whole earth."
    status: { la: verified, en: verified }
