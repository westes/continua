# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 25
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen in monte Sinai, dicens:"
      en: "And the Lord spoke to Moses in mount Sinai, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Loquere filiis Israel, et dices ad eos: Quando ingressi fueritis terram quam ego dabo vobis, sabbatizes sabbatum Domino."
      en: "Speak to the children of Israel, and thou shalt say to them: When you shall have entered into the land which I will give you, observe the rest of the sabbath to the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sex annis seres agrum tuum, et sex annis putabis vineam tuam, colligesque fructus ejus:"
      en: "Six years thou shalt sow thy field and six years thou shalt prune thy vineyard, and shalt gather the fruits thereof:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "septimo autem anno sabbatum erit terrae, requietionis Domini: agrum non seres, et vineam non putabis."
      en: "But in the seventh year there shall be a sabbath to the land, of the resting of the Lord: thou shalt not sow thy field, nor prune thy vineyard."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quae sponte gignet humus, non metes: et uvas primitiarum tuarum non colliges quasi vindemiam: annus enim requietionis terrae est:"
      en: "What the ground shall bring forth of itself, thou shalt not reap: neither shalt thou gather the grapes of the firstfruits as a vintage: for it is a year of rest to the land:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sed erunt vobis in cibum, tibi et servo tuo, ancillae et mercenario tuo, et advenae qui peregrinantur apud te:"
      en: "But they shall be unto you for meat, to thee and to thy manservant, to thy maidservant and thy hireling, and to the strangers that sojourn with thee:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "jumentis tuis et pecoribus, omnia quae nascuntur praebebunt cibum."
      en: "All things that grow shall be meat to thy beasts and to thy cattle."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Numerabis quoque tibi septem hebdomadas annorum, id est, septies septem, quae simul faciunt annos quadraginta novem:"
      en: "Thou shalt also number to thee seven weeks of years, that is to say, seven times seven, which together make forty-nine years:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et clanges buccina mense septimo, decima die mensis, propitiationis tempore, in universa terra vestra."
      en: "And thou shalt sound the trumpet in the seventh month, the tenth day of the month, in the time of the expiation in all your land."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Sanctificabisque annum quinquagesimum, et vocabis remissionem cunctis habitatoribus terrae tuae: ipse est enim jubilaeus. Revertetur homo ad possessionem suam, et unusquisque rediet ad familiam pristinam:"
      en: "And thou shalt sanctify the fiftieth year, and shalt proclaim remission to all the inhabitants of thy land: for it is the year of jubilee. Every man shall return to his possession, and every one shall go back to his former family:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quia jubilaeus est, et quinquagesimus annus. Non seretis neque metetis sponte in agro nascentia, et primitias vindemiae non colligetis,"
      en: "Because it is the jubilee and the fiftieth year. You shall not sow, nor reap the things that grow in the field of their own accord, neither shall you gather the firstfruits of the vines,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ob sanctificationem jubilaei: sed statim oblata comedetis."
      en: "Because of the sanctification of the jubilee: but as they grow you shall presently eat them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Anno jubilaei, redient omnes ad possessiones suas."
      en: "In the year of the jubilee all shall return to their possessions."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quando vendes quippiam civi tuo, vel emes ab eo, ne contristes fratrem tuum, sed juxta numerum annorum jubilaei emes ab eo,"
      en: "When thou shalt sell any thing to thy neighbour, or shalt buy of him; grieve not thy brother: but thou shalt buy of him according to the number of years from the jubilee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et juxta supputationem frugum vendet tibi."
      en: "And he shall sell to thee according to the computation of the fruits."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quanto plures anni remanserint post jubilaeum, tanto crescet et pretium: et quanto minus temporis numeraveris, tanto minoris et emptio constabit: tempus enim frugum vendet tibi."
      en: "The more years remain after the jubilee, the more shall the price increase: and the less time is counted, so much the less shall the purchase cost. For he shall sell to thee the time of the fruits."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nolite affligere contribules vestros, sed timeat unusquisque Deum suum, quia ego Dominus Deus vester."
      en: "Do not afflict your countrymen, but let every one fear his God: because I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Facite praecepta mea, et judicia custodite, et implete ea: ut habitare possitis in terra absque ullo pavore,"
      en: "Do my precepts, and keep my judgments, and fulfill them: that you may dwell in the land without any fear,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et gignat vobis humus fructus suos, quibus vescamini usque ad saturitatem, nullius impetum formidantes."
      en: "And the ground may yield you its fruits, of which you may eat your fill, fearing no man's invasion."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quod si dixeritis: Quid comedemus anno septimo, si non severimus, neque collegerimus fruges nostras?"
      en: "But if you say: What shall we eat the seventh year, if we sow not, nor gather our fruits?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dabo benedictionem meam vobis anno sexto, et faciet fructus trium annorum:"
      en: "I will give you my blessing the sixth year, and it shall yield the fruits of three years:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "seretisque anno octavo, et comedetis veteres fruges usque ad nonum annum: donec nova nascantur, edetis vetera."
      en: "And the eighth year you shall sow, and shall eat of the old fruits, until the ninth year: till new grow up, you shall eat the old store."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Terra quoque non vendetur in perpetuum, quia mea est, et vos advenae et coloni mei estis:"
      en: "The land also shall not be sold for ever: because it is mine, and you are strangers and sojourners with me."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "unde cuncta regio possessionis vestrae sub redemptionis conditione vendetur."
      en: "For which cause all the country of your possession shall be under the condition of redemption."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Si attenuatus frater tuus vendiderit possessiunculam suam, et voluerit propinquus ejus, potest redimere quod ille vendiderat."
      en: "If thy brother being impoverished sell his little possession, and his kinsman will, he may redeem what he had sold."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sin autem non habuerit proximum, et ipse pretium ad redimendum potuerit invenire,"
      en: "But if he have no kinsman, and he himself can find the price to redeem it:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "computabuntur fructus ex eo tempore quo vendidit: et quod reliquum est, reddet emptori, sicque recipiet possessionem suam."
      en: "The value of the fruits shall be counted from that time when he sold it: and the overplus he shall restore to the buyer, and so shall receive his possession again."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quod si non invenerit manus ejus ut reddat pretium, habebit emptor quod emerat, usque ad annum jubilaeum. In ipso enim omnis venditio redibit ad dominum et ad possessorem pristinum."
      en: "But if his hands find not the means to repay the price, the buyer shall have what he bought, until the year of the jubilee. For in that year all that is sold shall return to the owner, and to the ancient possessor."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Qui vendiderit domum intra urbis muros, habebit licentiam redimendi, donec unus impleatur annus."
      en: "He that selleth a house within the walls of a city, shall have the liberty to redeem it, until one year be expired:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Si non redemerit, et anni circulus fuerit evolutus, emptor possidebit eam, et posteri ejus in perpetuum, et redimi non poterit, etiam in jubilaeo."
      en: "If he redeem it not, and the whole year be fully out, the buyer shall possess it, and his posterity for ever, and it cannot be redeemed, not even in the jubilee."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Sin autem in villa domus, quae muros non habet, agrorum jure vendetur: si ante redempta non fuerit, in jubilaeo revertetur ad dominum."
      en: "But if the house be in a village, that hath no walls, it shall be sold according to the same law as the fields: if it be not redeemed before, in the jubilee it shall return to the owner."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Aedes Levitarum quae in urbibus sunt, semper possunt redimi:"
      en: "The houses of Levites, which are in cities, may always be redeemed:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "si redemptae non fuerint, in jubilaeo revertentur ad dominos, quia domus urbium Levitarum pro possessionibus sunt inter filios Israel."
      en: "If they be not redeemed, in the jubilee they shall all return to the owners, because the houses of the cities of the Levites are for their possessions among the children of Israel."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Suburbana autem eorum non veneant, quia possessio sempiterna est."
      en: "But let not their suburbs be sold, because it is a perpetual possession."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Si attenuatus fuerit frater tuus, et infirmus manu, et susceperis eum quasi advenam et peregrinum, et vixerit tecum,"
      en: "If thy brother be impoverished, and weak of hand, and thou receive him as a stranger and sojourner, and he live with thee,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "ne accipias usuras ab eo, nec amplius quam dedisti: time Deum tuum, ut vivere possit frater tuus apud te."
      en: "Take not usury of him nor more than thou gavest: fear thy God, that thy brother may live with thee."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Pecuniam tuam non dabis ei ad usuram, et frugum superabundantiam non exiges."
      en: "Thou shalt not give him thy money upon usury, nor exact of him any increase of fruits."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Ego Dominus Deus vester, qui eduxi vos de terra Aegypti, ut darem vobis terram Chanaan, et essem vester Deus."
      en: "I am the Lord your God, who brought you out of the land of Egypt, that I might give you the land of Chanaan, and might be your God."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Si paupertate compulsus vendiderit se tibi frater tuus, non eum opprimes servitute famulorum,"
      en: "If thy brother constrained by poverty, sell himself to thee, thou shalt not oppress him with the service of bondservants:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "sed quasi mercenarius et colonus erit: usque ad annum jubilaeum operabitur apud te,"
      en: "But he shall be as a hireling, and a sojourner: he shall work with thee until the year of the jubilee,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et postea egredietur cum liberis suis, et revertetur ad cognationem, ad possessionem patrum suorum."
      en: "And afterwards he shall go out with his children, and shall return to his kindred and to the possession of his fathers,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Mei enim servi sunt, et ego eduxi eos de terra Aegypti: non veneant conditione servorum:"
      en: "For they are my servants, and I brought them out of the land of Egypt: let them not be sold as bondmen:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "ne affligas eum per potentiam, sed metuito Deum tuum."
      en: "Afflict him not by might, but fear thy God."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Servus et ancilla sint vobis de nationibus quae in circuitu vestro sunt:"
      en: "Let your bondmen, and your bondwomen, be of the nations that are round about you."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et de advenis qui peregrinantur apud vos, vel qui ex his nati fuerint in terra vestra, hos habebitis famulos:"
      en: "And of the strangers that sojourn among you, or that were born of them in your land, these you shall have for servants:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et haereditario jure transmittetis ad posteros, ac possidebitis in aeternum: fratres autem vestros filios Israel ne opprimatis per potentiam."
      en: "And by right of inheritance shall leave them to your posterity, and shall possess them for ever. But oppress not your brethren the children of Israel by might."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Si invaluerit apud vos manus advenae atque peregrini, et attenuatus frater tuus vendiderit se ei, aut cuiquam de stirpe ejus:"
      en: "If the hand of a stranger or a sojourner grow strong among you, and thy brother being impoverished sell himself to him, or to any of his race:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "post venditionem potest redimi. Qui voluerit ex fratribus suis, redimet eum,"
      en: "After the sale he may be redeemed. He that will of his brethren shall redeem him:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et patruus, et patruelis, et consanguineus, et affinis. Sin autem et ipse potuerit, redimet se,"
      en: "Either his uncle, or his uncle's son, or his kinsman, by blood, or by affinity. But if he himself be able also, he shall redeem himself,"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "supputatis dumtaxat annis a tempore venditionis suae usque ad annum jubilaeum: et pecunia, qua venditus fuerat, juxta annorum numerum, et rationem mercenarii supputata."
      en: "Counting only the years from the time of his selling unto the year of the jubilee: and counting the money that he was sold for, according to the number of the years and the reckoning of a hired servant,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Si plures fuerint anni qui remanent usque ad jubilaeum, secundum hos reddet et pretium:"
      en: "If there be many years that remain until the jubilee, according to them shall he also repay the price."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "si pauci, ponet rationem cum eo juxta annorum numerum, et reddet emptori quod reliquum est annorum,"
      en: "If few, he shall make the reckoning with him according to the number of the years, and shall repay to the buyer of what remaineth of the years,"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "quibus ante servivit mercedibus imputatis: non affliget eum violenter in conspectu tuo."
      en: "His wages being allowed for which he served before: he shall not afflict him violently in thy sight."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Quod si per haec redimi non potuerit, anno jubilaeo egredietur cum liberis suis."
      en: "And if by these means he cannot be redeemed, in the year of the jubilee he shall go out with his children."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Mei enim sunt servi filii Israel, quos eduxi de terra Aegypti."
      en: "For the children of Israel are my servants, whom I brought forth out of the land of Egypt."
    status: { la: verified, en: verified }
