# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1cor
chapter: 14
verses:
  - n: 1
    text:
      la: "Sectamini caritatem, aemulamini spiritualia: magis autem ut prophetetis."
      en: "Follow after charity, be zealous for spiritual gifts; but rather that you may prophesy."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Qui enim loquitur lingua, non hominibus loquitur, sed Deo: nemo enim audit. Spiritu autem loquitur mysteria."
      en: "For he that speaketh in a tongue, speaketh not unto men, but unto God: for no man heareth. Yet by the Spirit he speaketh mysteries."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nam qui prophetat, hominibus loquitur ad aedificationem, et exhortationem, et consolationem."
      en: "But he that prophesieth, speaketh to men unto edification, and exhortation, and comfort."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Qui loquitur lingua, semetipsum aedificat: qui autem prophetat, ecclesiam Dei aedificat."
      en: "He that speaketh in a tongue, edifieth himself: but he that prophesieth, edifieth the church."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Volo autem omnes vos loqui linguis: magis autem prophetare. Nam major est qui prophetat, quam qui loquitur linguis; nisi forte interpretetur ut ecclesia aedificationem accipiat."
      en: "And I would have you all to speak with tongues, but rather to prophesy. For greater is he that prophesieth, than he that speaketh with tongues: unless perhaps he interpret, that the church may receive edification."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nunc autem, fratres, si venero ad vos linguis loquens: quid vobis prodero, nisi vobis loquar aut in revelatione, aut in scientia, aut in prophetia, aut in doctrina?"
      en: "But now, brethren, if I come to you speaking with tongues, what shall I profit you, unless I speak to you either in revelation, or in knowledge, or in prophecy, or in doctrine?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tamen quae sine anima sunt vocem dantia, sive tibia, sive cithara; nisi distinctionem sonituum dederint, quomodo scietur id quod canitur, aut quod citharizatur?"
      en: "Even things without life that give sound, whether pipe or harp, except they give a distinction of sounds, how shall it be known what is piped or harped?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Etenim si incertam vocem det tuba, quis parabit se ad bellum?"
      en: "For if the trumpet give an uncertain sound, who shall prepare himself to the battle?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ita et vos per linguam nisi manifestum sermonem dederitis: quomodo scietur id quod dicitur? eritis enim in aera loquentes."
      en: "So likewise you, except you utter by the tongue plain speech, how shall it be known what is said? For you shall be speaking into the air."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tam multa, ut puta genera linguarum sunt in hoc mundo: et nihil sine voce est."
      en: "There are, for example, so many kinds of tongues in this world; and none is without voice."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Si ergo nesciero virtutem vocis, ero ei, cui loquor, barbarus: et qui loquitur, mihi barbarus."
      en: "If then I know not the power of the voice, I shall be to him to whom I speak a barbarian; and he that speaketh, a barbarian to me."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sic et vos, quoniam aemulatores estis spirituum, ad aedificationem ecclesiae quaerite ut abundetis."
      en: "So you also, forasmuch as you are zealous of spirits, seek to abound unto the edifying of the church."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et ideo qui loquitur lingua, oret ut interpretetur."
      en: "And therefore he that speaketh by a tongue, let him pray that he may interpret."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Nam si orem lingua, spiritus meus orat, mens autem mea sine fructu est."
      en: "For if I pray in a tongue, my spirit prayeth, but my understanding is without fruit."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quid ergo est? Orabo spiritu, orabo et mente: psallam spiritu, psallam et mente."
      en: "What is it then? I will pray with the spirit, I will pray also with the understanding; I will sing with the spirit, I will sing also with the understanding."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ceterum si benedixeris spiritu, qui supplet locum idiotae, quomodo dicet: Amen, super tuam benedictionem? quoniam quid dicas, nescit."
      en: "Else if thou shalt bless with the spirit, how shall he that holdeth the place of the unlearned say, Amen, to thy blessing? because he knoweth not what thou sayest."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Nam tu quidem bene gratias agis, sed alter non aedificatur."
      en: "For thou indeed givest thanks well, but the other is not edified."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Gratias ago Deo meo, quod omnium vestrum lingua loquor."
      en: "I thank my God I speak with all your tongues."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sed in ecclesia volo quinque verba sensu meo loqui, ut et alios instruam: quam decem millia verborum in lingua."
      en: "But in the church I had rather speak five words with my understanding, that I may instruct others also; than ten thousand words in a tongue."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Fratres, nolite pueri effici sensibus, sed malitia parvuli estote: sensibus autem perfecti estote."
      en: "Brethren, do not become children in sense: but in malice be children, and in sense be perfect."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "In lege scriptum est: Quoniam in aliis linguis et labiis aliis loquar populo huic: et nec sic exaudient me, dicit Dominus."
      en: "In the law it is written: In other tongues and other lips I will speak to this people; and neither so will they hear me, saith the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Itaque linguae in signum sunt non fidelibus, sed infidelibus: prophetiae autem non infidelibus, sed fidelibus."
      en: "Wherefore tongues are for a sign, not to believers, but to unbelievers; but prophecies not to unbelievers, but to believers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Si ergo conveniat universa ecclesia in unum, et omnes linguis loquantur, intrent autem idiotae, aut infideles: nonne dicent quod insanitis?"
      en: "If therefore the whole church come together into one place, and all speak with tongues, and there come in unlearned persons or infidels, will they not say that you are mad?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Si autem omnes prophetent, intret autem quis infidelis, vel idiota, convincitur ab omnibus, dijudicatur ab omnibus:"
      en: "But if all prophesy, and there come in one that believeth not, or an unlearned person, he is convinced of all, he is judged of all."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "occulta cordis ejus manifesta fiunt: et ita cadens in faciem adorabit Deum, pronuntians quod vere Deus in vobis sit."
      en: "The secrets of his heart are made manifest; and so, falling down on his face, he will adore God, affirming that God is among you indeed."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Quid ergo est, fratres? Cum convenitis, unusquisque vestrum psalmum habet, doctrinam habet, apocalypsim habet, linguam habet, interpretationem habet: omnia ad aedificationem fiant."
      en: "How is it then, brethren? When you come together, every one of you hath a psalm, hath a doctrine, hath a revelation, hath a tongue, hath an interpretation: let all things be done to edification."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sive lingua quis loquitur, secundum duos, aut ut multum tres, et per partes, et unus interpretatur."
      en: "If any speak with a tongue, let it be by two, or at the most by three, and in course, and let one interpret."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Si autem non fuerit interpres, taceat in ecclesia: sibi autem loquatur, et Deo."
      en: "But if there be no interpreter, let him hold his peace in the church, and speak to himself and to God."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Prophetae autem duo, aut tres dicant, et ceteri dijudicent."
      en: "And let the prophets speak, two or three; and let the rest judge."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Quod si alii revelatum fuerit sedenti, prior taceat."
      en: "But if any thing be revealed to another sitting, let the first hold his peace."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Potestis enim omnes per singulos prophetare: ut omnes discant, et omnes exhortentur:"
      en: "For you may all prophesy one by one; that all may learn, and all may be exhorted:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et spiritus prophetarum prophetis subjecti sunt."
      en: "And the spirits of the prophets are subject to the prophets."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Non enim est dissensionis Deus, sed pacis: sicut et in omnibus ecclesiis sanctorum doceo."
      en: "For God is not the God of dissension, but of peace: as also I teach in all the churches of the saints."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Mulieres in ecclesiis taceant, non enim permittitur eis loqui, sed subditas esse, sicut et lex dicit."
      en: "Let women keep silence in the churches: for it is not permitted them to speak, but to be subject, as also the law saith."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Si quid autem volunt discere, domi viros suos interrogent. Turpe est enim mulieri loqui in ecclesia."
      en: "But if they would learn any thing, let them ask their husbands at home. For it is a shame for a woman to speak in the church."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "An a vobis verbum Dei processit? aut in vos solos pervenit?"
      en: "Or did the word of God come out from you? Or came it only unto you?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Si quis videtur propheta esse, aut spiritualis, cognoscat quae scribo vobis, quia Domini sunt mandata."
      en: "If any seem to be a prophet, or spiritual, let him know the things that I write to you, that they are the commandments of the Lord."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Si quis autem ignorat, ignorabitur."
      en: "But if any man know not, he shall not be known."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Itaque fratres aemulamini prophetare: et loqui linguis nolite prohibere."
      en: "Wherefore, brethren, be zealous to prophesy; and forbid not to speak with tongues."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Omnia autem honeste, et secundum ordinem fiant."
      en: "But let all things be done decently, and according to order."
    status: { la: verified, en: verified }
