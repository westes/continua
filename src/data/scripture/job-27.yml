# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 27
verses:
  - n: 1
    text:
      la: "Addidit quoque Job, assumens parabolam suam, et dixit:"
      en: "Job also added, taking up his parable, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Vivit Deus, qui abstulit judicium meum, et Omnipotens, qui ad amaritudinem adduxit animam meam."
      en: "As God liveth, who hath taken away my judgment, and the Almighty, who hath brought my soul to bitterness,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quia donec superest halitus in me, et spiritus Dei in naribus meis,"
      en: "As long as breath remaineth in me, and the spirit of God in my nostrils,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non loquentur labia mea iniquitatem, nec lingua mea meditabitur mendacium."
      en: "My lips shall not speak iniquity, neither shall my tongue contrive lying."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Absit a me ut justos vos esse judicem: donec deficiam, non recedam ab innocentia mea."
      en: "God forbid that I should judge you to be just: till I die I will not depart from my innocence."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Justificationem meam, quam coepi tenere, non deseram: neque enim reprehendit me cor meum in omni vita mea."
      en: "My justification, which I have begun to hold, I will not forsake: for my heart doth not reprehend me in all my life."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sit ut impius, inimicus meus, et adversarius meus, quasi iniquus."
      en: "Let my enemy be as the ungodly, and my adversary as the wicked one."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quae est enim spes hypocritae, si avare rapiat, et non liberet Deus animam ejus?"
      en: "For what is the hope of the hypocrite if through covetousness he take by violence, and God deliver not his soul?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Numquid Deus audiet clamorem ejus, cum venerit super eum angustia?"
      en: "Will God hear his cry, when distress shall come upon him?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "aut poterit in Omnipotente delectari, et invocare Deum omni tempore?"
      en: "Or can he delight himself in the Almighty, and call upon God at all times?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Docebo vos per manum Dei quae Omnipotens habeat, nec abscondam."
      en: "I will teach you by the hand of God, what the Almighty hath, and I will not conceal it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ecce vos omnes nostis, et quid sine causa vana loquimini?"
      en: "Behold you all know it, and why do you speak vain things without cause?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Haec est pars hominis impii apud Deum, et haereditas violentorum, quam ob Omnipotente suscipient."
      en: "This is the portion of a wicked man with God, and the inheritance of the violent, which they shall receive of the Almighty."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Si multiplicati fuerint filii ejus, in gladio erunt, et nepotes ejus non saturabuntur pane:"
      en: "If his sons be multiplied, they shall be for the sword, and his grandsons shall not be filled with bread."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui reliqui fuerint ex eo sepelientur in interitu, et viduae illius non plorabunt."
      en: "They that shall remain of him, shall be buried in death, and his widows shall not weep."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Si comportaverit quasi terram argentum, et sicut lutum praeparaverit vestimenta:"
      en: "If he shall heap together silver as earth, and prepare raiment as clay,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "praeparabit quidem, sed justus vestietur illis, et argentum innocens dividet."
      en: "He shall prepare indeed, but the just man shall be clothed with it: and the innocent shall divide the silver."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Aedificavit sicut tinea domum suam, et sicut custos fecit umbraculum."
      en: "He hath built his house as a moth, and as a keeper he hath made a booth."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dives, cum dormierit, nihil secum auferet: aperiet oculos suos, et nihil inveniet."
      en: "The rich man when he shall sleep shall take away nothing with him: he shall open his eyes and find nothing."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Apprehendet eum quasi aqua inopia, nocte opprimet eum tempestas."
      en: "Poverty like water shall take hold on him, a tempest shall oppress him in the night."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Tollet eum ventus urens, et auferet, et velut turbo rapiet eum de loco suo."
      en: "A burning wind shall take him up, and carry him away, and as a whirlwind shall snatch him from his place."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et mittet super eum, et non parcet: de manu ejus fugiens fugiet."
      en: "And he shall cast upon him, and shall not spare: out of his hand he would willingly flee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Stringet super eum manus suas, et sibilabit super illum, intuens locum ejus."
      en: "He shall clasp his hands upon him, and shall hiss at him, beholding his place."
    status: { la: verified, en: verified }
