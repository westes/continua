# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 5
verses:
  - n: 1
    text:
      la: "Post haec erat dies festus Judaeorum, et ascendit Jesus Jerosolymam."
      en: "After these things was a festival day of the Jews, and Jesus went up to Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Est autem Jerosolymis probatica piscina, quae cognominatur hebraice Bethsaida, quinque porticus habens."
      en: "Now there is at Jerusalem a pond, called Probatica, which in Hebrew is named Bethsaida, having five porches."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "In his jacebat multitudo magna languentium, caecorum, claudorum, aridorum, exspectantium aquae motum."
      en: "In these lay a great multitude of sick, of blind, of lame, of withered; waiting for the moving of the water."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Angelus autem Domini descendebat secundum tempus in piscinam, et movebatur aqua. Et qui prior descendisset in piscinam post motionem aquae, sanus fiebat a quacumque detinebatur infirmitate."
      en: "And an angel of the Lord descended at certain times into the pond; and the water was moved. And he that went down first into the pond after the motion of the water, was made whole, of whatsoever infirmity he lay under."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Erat autem quidam homo ibi triginta et octo annos habens in infirmitate sua."
      en: "And there was a certain man there, that had been eight and thirty years under his infirmity."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Hunc autem cum vidisset Jesus jacentem, et cognovisset quia jam multum tempus haberet, dicit ei: Vis sanus fieri?"
      en: "Him when Jesus had seen lying, and knew that he had been now a long time, he saith to him: Wilt thou be made whole?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Respondit ei languidus: Domine, hominem non habeo, ut, cum turbata fuerit aqua, mittat me in piscinam: dum venio enim ego, alius ante me descendit."
      en: "The infirm man answered him: Sir, I have no man, when the water is troubled, to put me into the pond. For whilst I am coming, another goeth down before me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dicit ei Jesus: Surge, tolle grabatum tuum et ambula."
      en: "Jesus saith to him: Arise, take up thy bed, and walk."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et statim sanus factus est homo ille: et sustulit grabatum suum, et ambulabat. Erat autem sabbatum in die illo."
      en: "And immediately the man was made whole: and he took up his bed, and walked. And it was the sabbath that day."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dicebant ergo Judaei illi qui sanatus fuerat: Sabbatum est, non licet tibi tollere grabatum tuum."
      en: "The Jews therefore said to him that was healed: It is the sabbath; it is not lawful for thee to take up thy bed."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Respondit eis: Qui me sanum fecit, ille mihi dixit: Tolle grabatum tuum et ambula."
      en: "He answered them: He that made me whole, he said to me, Take up thy bed, and walk."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Interrogaverunt ergo eum: Quis est ille homo qui dixit tibi: Tolle grabatum tuum et ambula?"
      en: "They asked him therefore: Who is that man who said to thee, Take up thy bed, and walk?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Is autem qui sanus fuerat effectus, nesciebat quis esset. Jesus enim declinavit a turba constituta in loco."
      en: "But he who was healed, knew not who it was; for Jesus went aside from the multitude standing in the place."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Postea invenit eum Jesus in templo, et dixit illi: Ecce sanus factus es; jam noli peccare, ne deterius tibi aliquid contingat."
      en: "Afterwards, Jesus findeth him in the temple, and saith to him: Behold thou art made whole: sin no more, lest some worse thing happen to thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Abiit ille homo, et nuntiavit Judaeis quia Jesus esset, qui fecit eum sanum."
      en: "The man went his way, and told the Jews, that it was Jesus who had made him whole."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Propterea persequebantur Judaei Jesum, quia haec faciebat in sabbato."
      en: "Therefore did the Jews persecute Jesus, because he did these things on the sabbath."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Jesus autem respondit eis: Pater meus usque modo operatur, et ego operor."
      en: "But Jesus answered them: My Father worketh until now; and I work."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Propterea ergo magis quaerebant eum Judaei interficere: quia non solum solvebat sabbatum, sed et patrem suum dicebat Deum, aequalem se faciens Deo."
      en: "Hereupon therefore the Jews sought the more to kill him, because he did not only break the sabbath, but also said God was his Father, making himself equal to God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Respondit itaque Jesus, et dixit eis: Amen, amen dico vobis: non potest Filius a se facere quidquam, nisi quod viderit Patrem facientem: quaecumque enim ille fecerit, haec et Filius similiter facit."
      en: "Then Jesus answered, and said to them: Amen, amen, I say unto you, the Son cannot do any thing of himself, but what he seeth the Father doing: for what things soever he doth, these the Son also doth in like manner."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Pater enim diligit Filium, et omnia demonstrat ei quae ipse facit: et majora his demonstrabit ei opera, ut vos miremini."
      en: "For the Father loveth the Son, and sheweth him all things which himself doth: and greater works than these will he shew him, that you may wonder."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Sicut enim Pater suscitat mortuos, et vivificat, sic et Filius, quos vult, vivificat."
      en: "For as the Father raiseth up the dead, and giveth life: so the Son also giveth life to whom he will."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Neque enim Pater judicat quemquam: sed omne judicium dedit Filio,"
      en: "For neither doth the Father judge any man, but hath given all judgment to the Son."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ut omnes honorificent Filium, sicut honorificant Patrem; qui non honorificat Filium, non honorificat Patrem, qui misit illum."
      en: "That all men may honour the Son, as they honour the Father. He who honoureth not the Son, honoureth not the Father, who hath sent him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Amen, amen dico vobis, quia qui verbum meum audit, et credit ei qui misit me, habet vitam aeternam, et in judicium non venit, sed transiit a morte in vitam."
      en: "Amen, amen I say unto you, that he who heareth my word, and believeth him that sent me, hath life everlasting; and cometh not into judgment, but is passed from death to life."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Amen, amen dico vobis, quia venit hora, et nunc est, quando mortui audient vocem Filii Dei: et qui audierint, vivent."
      en: "Amen, amen I say unto you, that the hour cometh, and now is, when the dead shall hear the voice of the Son of God, and they that hear shall live."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sicut enim Pater habet vitam in semetipso, sic dedit et Filio habere vitam in semetipso:"
      en: "For as the Father hath life in himself, so he hath given the Son also to have life in himself:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et potestatem dedit ei judicium facere, quia Filius hominis est."
      en: "And he hath given him power to do judgment, because he is the Son of man."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Nolite mirari hoc, quia venit hora in qua omnes qui in monumentis sunt audient vocem Filii Dei:"
      en: "Wonder not at this; for the hour cometh, wherein all that are in the graves shall hear the voice of the Son of God."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et procedent qui bona fecerunt, in resurrectionem vitae; qui vero mala egerunt, in resurrectionem judicii."
      en: "And they that have done good things, shall come forth unto the resurrection of life; but they that have done evil, unto the resurrection of judgment."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Non possum ego a meipso facere quidquam. Sicut audio, judico: et judicium meum justum est, quia non quaero voluntatem meam, sed voluntatem ejus qui misit me."
      en: "I cannot of myself do any thing. As I hear, so I judge: and my judgment is just; because I seek not my own will, but the will of him that sent me."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Si ego testimonium perhibeo de meipso, testimonium meum non est verum."
      en: "If I bear witness of myself, my witness is not true."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Alius est qui testimonium perhibet de me: et scio quia verum est testimonium, quod perhibet de me."
      en: "There is another that beareth witness of me; and I know that the witness which he witnesseth of me is true."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Vos misistis ad Joannem, et testimonium perhibuit veritati."
      en: "You sent to John, and he gave testimony to the truth."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Ego autem non ab homine testimonium accipio: sed haec dico ut vos salvi sitis."
      en: "But I receive not testimony from man: but I say these things, that you may be saved."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Ille erat lucerna ardens et lucens: vos autem voluistis ad horam exsultare in luce ejus."
      en: "He was a burning and a shining light: and you were willing for a time to rejoice in his light."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Ego autem habeo testimonium majus Joanne. Opera enim quae dedit mihi Pater ut perficiam ea: ipsa opera, quae ego facio, testimonium perhibent de me, quia Pater misit me:"
      en: "But I have a greater testimony than that of John: for the works which the Father hath given me to perfect; the works themselves, which I do, give testimony of me, that the Father hath sent me."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et qui misit me Pater, ipse testimonium perhibuit de me: neque vocem ejus umquam audistis, neque speciem ejus vidistis:"
      en: "And the Father himself who hath sent me, hath given testimony of me: neither have you heard his voice at any time, nor seen his shape."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et verbum ejus non habetis in vobis manens: quia quem misit ille, huic vos non creditis."
      en: "And you have not his word abiding in you: for whom he hath sent, him you believe not."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Scrutamini Scripturas, quia vos putatis in ipsis vitam aeternam habere: et illae sunt quae testimonium perhibent de me:"
      en: "Search the scriptures, for you think in them to have life everlasting; and the same are they that give testimony of me."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et non vultis venire ad me ut vitam habeatis."
      en: "And you will not come to me that you may have life."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Claritatem ab hominibus non accipio."
      en: "I receive glory not from men."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Sed cognovi vos, quia dilectionem Dei non habetis in vobis."
      en: "But I know you, that you have not the love of God in you."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Ego veni in nomine Patris mei, et non accipitis me; si alius venerit in nomine suo, illum accipietis."
      en: "I am come in the name of my Father, and you receive me not: if another shall come in his own name, him you will receive."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Quomodo vos potestis credere, qui gloriam ab invicem accipitis, et gloriam quae a solo Deo est, non quaeritis?"
      en: "How can you believe, who receive glory one from another: and the glory which is from God alone, you do not seek?"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Nolite putare quia ego accusaturus sim vos apud Patrem: est qui accusat vos Moyses, in quo vos speratis."
      en: "Think not that I will accuse you to the Father. There is one that accuseth you, Moses, in whom you trust."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Si enim crederetis Moysi, crederetis forsitan et mihi: de me enim ille scripsit."
      en: "For if you did believe Moses, you would perhaps believe me also; for he wrote of me."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Si autem illius litteris non creditis, quomodo verbis meis credetis?"
      en: "But if you do not believe his writings, how will you believe my words?"
    status: { la: verified, en: verified }
