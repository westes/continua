# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 29
verses:
  - n: 1
    text:
      la: "Sed et hoc facies, ut mihi in sacerdotio consecrentur. Tolle vitulum de armento, et arietes duos immaculatos,"
      en: "And thou shalt also do this, that they may be consecrated to me in priesthood. Take a calf from the herd, and two rams without blemish,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "panesque azymos, et crustulam absque fermento, quae conspersa sit oleo, lagana quoque azyma oleo lita: de simila triticea cuncta facies."
      en: "And unleavened bread, and a cake without leaven, tempered with oil, wafers also unleavened anointed with oil: thou shalt make them all of wheaten flour."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et posita in canistro offeres: vitulum autem et duos arietes."
      en: "And thou shalt put them in a basket and offer them: and the calf and the two rams."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et Aaron ac filios ejus applicabis ad ostium tabernaculi testimonii. Cumque laveris patrem cum filiis suis aqua,"
      en: "And thou shalt bring Aaron and his sons to the door of the tabernacle of the testimony. And when thou hast washed the father and his sons with water,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "indues Aaron vestimentis suis, id est, linea et tunica, et superhumerali et rationali, quod constringes balteo."
      en: "Thou shalt clothe Aaron with his vestments, that is, with the linen garment and the tunick, and the ephod and the rational, which thou shalt gird with the girdle."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et pones tiaram in capite ejus, et laminam sanctam super tiaram,"
      en: "And thou shalt put the mitre upon his head, and the holy plate upon the mitre,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et oleum unctionis fundes super caput ejus: atque hoc ritu consecrabitur."
      en: "And thou shalt pour the oil of unction upon his head: and by this rite shall he be consecrated."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Filios quoque illius applicabis, et indues tunicis lineis, cingesque balteo,"
      en: "Thou shalt bring his sons also and shalt put on them the linen tunicks, and gird them with a girdle:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Aaron scilicet et liberos ejus, et impones eis mitras: eruntque sacerdotes mihi religione perpetua. Postquam initiaveris manus eorum,"
      en: "To wit, Aaron and his children, and thou shalt put mitres upon them: and they shall be priests to me by a perpetual ordinance. After thou shalt have consecrated their hands,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "applicabis et vitulum coram tabernaculo testimonii. Imponentque Aaron et filii ejus manus super caput illius,"
      en: "Thou shalt present also the calf before the tabernacle of the testimony. And Aaron and his sons shall lay their hands upon his head,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et mactabis eum in conspectu Domini, juxta ostium tabernaculi testimonii."
      en: "And thou shalt kill him in the sight of the Lord, beside the door of the tabernacle of the testimony."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sumptumque de sanguine vituli, pones supercornua altaris digito tuo, reliquum autem sanguinem fundes juxta basim ejus."
      en: "And taking some of the blood of the calf, thou shalt put it upon the horns of the altar with thy finger, and the rest of the blood thou shalt pour at the bottom thereof."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sumes et adipem totum qui operit intestina, et reticulum jecoris, ac duos renes, et adipem qui super eos est, et offeres incensum super altare:"
      en: "Thou shalt take also all the fat that covereth the entrails, and the caul of the liver, and the two kidneys, and the fat that is upon them, and shalt offer a burnt offering upon the altar:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "carnes vero vituli et corium et fimum combures foris extra castra, eo quod pro peccato sit."
      en: "But the flesh of the calf and the hide and the dung, thou shalt burn abroad, without the camp, because it is for sin."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Unum quoque arietem sumes, super cujus caput ponent Aaron et filii ejus manus."
      en: "Thou shalt take also one ram upon the head whereof Aaron and his sons shall lay their hands."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quem cum mactaveris, tolles de sanguine ejus, et fundes circa altare."
      en: "And when thou hast killed him, thou shalt take of the blood thereof, and pour round about the altar:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ipsum autem arietem secabis in frustra: lotaque intestina ejus ac pedes, pones super concissas carnes, et super caput illius."
      en: "And thou shalt cut the ram in pieces, and having washed his entrails and feet, thou shalt put them upon the flesh that is cut in pieces, and upon his head."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et offeres totum arietem in incensum super altare: oblatio est Domino, odor suavissimus victimae Domini."
      en: "And thou shalt offer the whole ram for a burnt offering upon the altar: it is an oblation to the Lord, a most sweet savour of the victim of the Lord."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tolles quoque arietem alterum, super cujus caput Aaron et filii ejus ponent manus."
      en: "Thou shalt take also the other ram, upon whose head Aaron and his sons shall lay their hands."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quem cum immolaveris, sumes de sanguine ejus, et pones super extremum auriculae dextrae Aaron et filiorum ejus, et super pollices manus eorum ac pedis dextri, fundesque sanguinem super altare per circuitum."
      en: "And when thou hast sacrificed him, thou shalt take of his blood, and put upon the tip of the right ear of Aaron and of his sons, and upon the thumbs and great toes of their right hand and foot, and thou shalt pour the blood upon the altar round about."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Cumque tuleris de sanguine qui est super altare, et de oleo unctionis, asperges Aaron et vestes ejus, filios et vestimenta eorum. Consecratisque ipsis et vestibus,"
      en: "And when thou hast taken of the blood, that is upon the altar, and of the oil of unction, thou shalt sprinkle Aaron and his vesture, his sons and their vestments. And after they and their vestments are consecrated,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "tolles adipem de ariete, et caudam et arvinam, quae operit vitalia, ac reticulum jecoris, et duos tenes, atque adipem, qui super eos est, armumque dextrum, eo quod sit aries consecrationis:"
      en: "Thou shalt take the fat of the ram, and the rump, and the fat that covereth the lungs, and the caul of the liver, and the two kidneys, and the fat that is upon them, and the right shoulder, because it is the ram of consecration."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "tortamque panis unius, crustulam conspersam oleo, laganum de canistro azymorum, quod positum est in conspectu Domini:"
      en: "And one roll of bread, a cake tempered with oil, a wafer out of the basket of unleavened bread, which is set in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ponesque omnia super manus Aaron et filiorum ejus, et sanctificabis eos elevans coram Domino."
      en: "And thou shalt put all upon the hands of Aaron and of his sons, and shalt sanctify them elevating before the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Suscipiesque universa de manibus eorum: et incendes super altare in holocaustum, odorem suavissimum in conspectu Domini, quia oblatio ejus est."
      en: "And thou shalt take all from their hands, and shalt burn them upon the altar for a holocaust, a most sweet savour in the sight of the Lord, because it is his oblation."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sumes quoque pectusculum de ariete, quo initiatus est Aaron, sanctificabisque illud elevatum coram Domino, et cedet in partem tuam."
      en: "Thou shalt take also the breast of the ram, wherewith Aaron was consecrated, and elevating it thou shalt sanctify it before the Lord, and it shall fall to thy share."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sanctificabisque et pectusculum consecratum, et armum quem de ariete separasti,"
      en: "And thou shalt sanctify both the consecrated breast, and the shoulder that thou didst separate of the ram,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quo initiatus est Aaron et filii ejus, cedentque in partem Aaron et filiorum ejus jure perpetuo a filiis Israel: quia primitiva sunt et initia de victimis eorum pacificis quae offerunt Domino."
      en: "Wherewith Aaron was consecrated and his sons, and they shall fall to Aaron's share and his sons' by a perpetual right from the children of Israel: because they are the choicest and the beginnings of their peace victims which they offer to the Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Vestem autem sanctam, qua utetur Aaron, habebunt filii ejus post eum, ut ungantur in ea, et consecrantur manus eorum."
      en: "And the holy vesture, which Aaron shall use, his sons shall have after him, that they may be anointed, and their hands consecrated to it."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Septem diebus utetur illa qui pontifex pro eo fuerit constitutus de filiis ejus, et qui ingredietur tabernaculum testimonii ut ministret in sanctuario."
      en: "He of his sons that shall be appointed high priest in his stead, and that shall enter into the tabernacle of the testimony to minister in the sanctuary, shall wear it seven days."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Arietem autem consecrationis tolles, et coques carnes ejus in loco sancto:"
      en: "And thou shalt take the ram of the consecration, and shalt boil the flesh thereof in the holy place:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quibus vescetur Aaron et filii ejus. Panes quoque, qui sunt in canistro, in vestibulo tabernaculi testimonii comedent,"
      en: "And Aaron and his sons shall eat it. The loaves also, that are in the basket, they shall eat in the entry of the tabernacle of the testimony,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ut sit placabile sacrificium, et sanctificentur offerentium manus. Alienigena non vescetur ex eis, quia sancti sunt."
      en: "That it may be an atoning sacrifice, and the hands of the offerers may be sanctified. A stranger shall not eat of them, because they are holy."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Quod si remanserit de carnibus consecratis, sive de panibus usque mane, combures reliquias igni: non comedentur, quia sanctificata sunt."
      en: "And if there remain of the consecrated flesh, or of the bread till the morning, thou shalt burn the remainder with fire: they shall not be eaten, because they are sanctified."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Omnia, quae praecepi tibi, facies super Aaron et filiis ejus. Septem diebus consecrabis manus eorum:"
      en: "All that I have commanded thee, thou shalt do unto Aaron and his sons. Seven days shalt thou consecrate their hands:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et vitulum pro peccato offeres per singulos dies ad expiandum. Mundabisque altare cum immolaveris expiationis hostiam, et unges illud in sanctificationem."
      en: "And thou shalt offer a calf for sin every day for expiation. And thou shalt cleanse the altar when thou hast offered the victim of expiation, and shalt anoint it to sanctify it."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Septem diebus expiabis altare, et sanctificabis, et erit Sanctum sanctorum: omnis, qui tetigerit illud, sanctificabitur."
      en: "Seven days shalt thou expiate the altar and sanctify it, and it shall be most holy. Every one that shall touch it shall be holy."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Hoc est quod facies in altari: agnos anniculos duos per singulos dies jugiter,"
      en: "This is what thou shalt sacrifice upon the altar: Two lambs of a year old every day continually."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "unum agnum mane, et alterum vespere,"
      en: "One lamb in the morning and another in the evening."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "decimam partem similae conspersae oleo tuso, quod habeat mensuram quartam partem hin, et vinum ad libandum ejusdem mensurae in agno uno."
      en: "With one lamb a tenth part of flour tempered with beaten oil, of the fourth part of a hin, and wine for libation of the same measure."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Alterum vero agnum offeres ad vesperam juxta ritum matutinae oblationis, et juxta ea quae diximus, in odorem suavitatis:"
      en: "And the other lamb thou shalt offer in the evening, according to the rite of the morning oblation, and according to what we have said, for a savour of sweetness:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "sacrificium est Domino, oblatione perpetua in generationes vestras, ad ostium tabernaculi testimonii coram Domino, ubi constituam ut loquar ad te."
      en: "It is a sacrifice to the Lord, by perpetual oblation unto your generations, at the door of the tabernacle of the testimony before the Lord, where I will appoint to speak unto thee."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Ibique praecipiam filiis Israel, et sanctificabitur altare in gloria mea."
      en: "And there will I command the children of Israel, and the altar shall be sanctified by my glory."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Sanctificabo et tabernaculum testimonii cum altari, et Aaron cum filiis suis, ut sacerdotio fungantur mihi."
      en: "I will sanctify also the tabernacle of the testimony with the altar, and Aaron with his sons, to do the office of priesthood unto me."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et habitabo in medio filiorum Israel, eroque eis Deus,"
      en: "And I will dwell in the midst of the children of Israel, and will be their God:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et scient quia ego Dominus Deus eorum, qui eduxi eos de terra Aegypti, ut manerem inter illos, ego Dominus Deus ipsorum."
      en: "And they shall know that I am the Lord their God, who have brought them out of the land of Egypt, that I might abide among them, I the Lord their God."
    status: { la: verified, en: verified }
