# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: heb
chapter: 2
verses:
  - n: 1
    text:
      la: "Propterea abundantius oportet observare nos ea quae audivimus, ne forte pereffluamus."
      en: "Therefore ought we more diligently to observe the things which we have heard, lest perhaps we should let them slip."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Si enim qui per angelos dictus est sermo, factus est firmus, et omnis praevaricatio, et inobedientia accepit justam mercedis retributionem:"
      en: "For if the word, spoken by angels, became steadfast, and every transgression and disobedience received a just recompense of reward:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quomodo nos effugiemus si tantam neglexerimus salutem? quae cum initium accepisset enarrari per Dominum ab eis, qui audierunt, in nos confirmata est,"
      en: "How shall we escape if we neglect so great salvation? which having begun to be declared by the Lord, was confirmed unto us by them that heard him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "contestante Deo signis et portentis, et variis virtutibus, et Spiritus Sancti distributionibus secundum suam voluntatem."
      en: "God also bearing them witness by signs, and wonders, and divers miracles, and distributions of the Holy Ghost, according to his own will."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Non enim angelis subjecit Deus orbem terrae futurum, de quo loquimur."
      en: "For God hath not subjected unto angels the world to come, whereof we speak."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Testatus est autem in quodam loco quis, dicens: Quid est homo quod memor es ejus, aut filius hominis quoniam visitas eum?"
      en: "But one in a certain place hath testified, saying: What is man, that thou art mindful of him: or the son of man, that thou visitest him?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Minuisti eum paulo minus ab angelis: gloria et honore coronasti eum: et constituisti eum super opera manuum tuarum."
      en: "Thou hast made him a little lower than the angels: thou hast crowned him with glory and honour, and hast set him over the works of thy hands:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Omnia subjecisti sub pedibus ejus. In eo enim quod omnia ei subjecit, nihil dimisit non subjectum ei. Nunc autem necdum videmus omnia subjecta ei."
      en: "Thou hast subjected all things under his feet. For in that he hath subjected all things to him, he left nothing not subject to him. But now we see not as yet all things subject to him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Eum autem, qui modico quam angeli minoratus est, videmus Jesum propter passionem mortis, gloria et honore coronatum: ut, gratia Dei, pro omnibus gustaret mortem."
      en: "But we see Jesus, who was made a little lower than the angels, for the suffering of death, crowned with glory and honour: that, through the grace of God, he might taste death for all."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Decebat enim eum, propter quem omnia, et per quem omnia, qui multos filios in gloriam adduxerat, auctorem salutis eorum per passionem consummare."
      en: "For it became him, for whom are all things, and by whom are all things, who had brought many children into glory, to perfect the author of their salvation, by his passion."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui enim sanctificat, et qui sanctificantur, ex uno omnes. Propter quam causam non confunditur fratres eos vocare, dicens:"
      en: "For both he that sanctifieth, and they who are sanctified, are all of one. For which cause he is not ashamed to call them brethren, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nuntiabo nomen tuum fratribus meis: in medio ecclesiae laudabo te."
      en: "I will declare thy name to my brethren; in the midst of the church will I praise thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et iterum: Ego ero fidens in eum. Et iterum: Ecce ego, et pueri mei, quos dedit mihi Deus."
      en: "And again: I will put my trust in him. And again: Behold I and my children, whom God hath given me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quia ergo pueri communicaverunt carni, et sanguini, et ipse similiter participavit eisdem: ut per mortem destrueret eum qui habebat mortis imperium, id est, diabolum:"
      en: "Therefore because the children are partakers of flesh and blood, he also himself in like manner hath been partaker of the same: that, through death, he might destroy him who had the empire of death, that is to say, the devil:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et liberaret eos qui timore mortis per totam vitam obnoxii erant servituti."
      en: "And might deliver them, who through the fear of death were all their lifetime subject to servitude."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nusquam enim angelos apprehendit, sed semen Abrahae apprehendit."
      en: "For no where doth he take hold of the angels: but of the seed of Abraham he taketh hold."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Unde debuit per omnia fratribus similari, ut misericors fieret, et fidelis pontifex ad Deum, ut repropitiaret delicta populi."
      en: "Wherefore it behoved him in all things to be made like unto his brethren, that he might become a merciful and faithful priest before God, that he might be a propitiation for the sins of the people."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "In eo enim, in quo passus est ipse et tentatus, potens est et eis, qui tentantur, auxiliari."
      en: "For in that, wherein he himself hath suffered and been tempted, he is able to succour them also that are tempted."
    status: { la: verified, en: verified }
