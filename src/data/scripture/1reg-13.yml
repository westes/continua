book: 1reg
chapter: 13
verses:
  - n: 1
    text:
      la: "filius unius anni Saul cum regnare coepisset duobus autem annis regnavit super Israhel"
      en: "Saul was a child of one year when he began to reign, and he reigned two years over Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et elegit sibi Saul tria milia de Israhel et erant cum Saul duo milia in Machmas et in monte Bethel mille autem cum Ionathan in Gabaath Beniamin porro ceterum populum remisit unumquemque in tabernacula sua"
      en: "And Saul chose him three thousand men of Israel: and two thousand were with Saul in Machmas, and in mount Bethel: and a thousand with Jonathan in Gabaa of Benjamin, and the rest of the people he sent back every man to their dwellings."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et percussit Ionathan stationem Philisthim quae erat in Gabaa quod cum audissent Philisthim Saul cecinit bucina in omni terra dicens audiant Hebraei"
      en: "And Jonathan smote the garrison of the Philistines which was in Gabaa. And when the Philistines had heard of it, Saul sounded the trumpet over all the land, saying: Let the Hebrews hear."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et universus Israhel audivit huiuscemodi famam percussit Saul stationem Philisthinorum et erexit se Israhel adversum Philisthim clamavit ergo populus post Saul in Galgala"
      en: "And all Israel heard this report: Saul hath smitten the garrison of the Philistines: and Israel took courage against the Philistines. And the people were called together after Saul to Galgal."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et Philisthim congregati sunt ad proeliandum contra Israhel triginta milia curruum et sex milia equitum et reliquum vulgus sicut harena quae est in litore maris plurima et ascendentes castrametati sunt in Machmas ad orientem Bethaven"
      en: "The Philistines also were assembled to fight against Israel, thirty thousand chariots, and six thousand horsemen, and a multitude of people besides, like the sand on the sea shore for number. And going up they camped in Machmas at the east of Bethaven."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quod cum vidissent viri Israhel se in arto sitos adflictus est enim populus absconderunt se in speluncis et in abditis in petris quoque et in antris et in cisternis"
      en: "And when the men of Israel saw that they were straitened, (for the people were distressed,) they hid themselves in caves, and in thickets, and in rocks, and in dens, and in pits."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Hebraei autem transierunt Iordanem terram Gad et Galaad cumque adhuc esset Saul in Galgal universus populus perterritus est qui sequebatur eum"
      en: "And some of the Hebrews passed over the Jordan into the land of Gad and Galaad. And when Saul was yet in Galgal, all the people that followed him were greatly afraid."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et expectavit septem diebus iuxta placitum Samuhel et non venit Samuhel in Galgala dilapsusque est populus ab eo"
      en: "And he waited seven days according to the appointment of Samuel, I and Samuel came not to Galgal, and the people slipt away from him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ait ergo Saul adferte mihi holocaustum et pacifica et obtulit holocaustum"
      en: "Then Saul said: Bring me the holocaust, and the peace offerings. And he offered the holocaust."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque conplesset offerens holocaustum ecce Samuhel veniebat et egressus est Saul obviam ei ut salutaret eum"
      en: "And when he had made an end of offering the holocaust, behold Samuel came: and Saul went forth to meet him and salute him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "locutusque est ad eum Samuhel quid fecisti respondit Saul quia vidi quod dilaberetur populus a me et tu non veneras iuxta placitos dies porro Philisthim congregati fuerant in Machmas"
      en: "And Samuel said to him: What hast thou done? Saul answered: Because I saw that the people slipt from me, and thou wast not come according to the days appointed, and the Philistines were gathered together in Machmas,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixi nunc descendent Philisthim ad me in Galgala et faciem Domini non placavi necessitate conpulsus obtuli holocaustum"
      en: "I said: Now will the Philistines come down upon me to Galgal, and I have not appeased the face of the Lord. Forced by necessity, I offered the holocaust."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixitque Samuhel ad Saul stulte egisti nec custodisti mandata Domini Dei tui quae praecepit tibi quod si non fecisses iam nunc praeparasset Dominus regnum tuum super Israhel in sempiternum"
      en: "And Samuel said to Saul: Thou hast done foolishly, and hast not kept the commandments of the Lord thy God, which he commanded thee. And if thou hadst not done thus, the Lord would now have established thy kingdom over Israel for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed nequaquam regnum tuum ultra consurget quaesivit sibi Dominus virum iuxta cor suum et praecepit ei Dominus ut esset dux super populum suum eo quod non servaveris quae praecepit Dominus"
      en: "But thy kingdom shall not continue. The Lord hath sought him a man according to his own heart: and him hath the Lord commanded to be prince over his people, because thou hast not observed that which the Lord commanded."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "surrexit autem Samuhel et ascendit de Galgalis in Gabaa Beniamin et recensuit Saul populum qui inventi fuerant cum eo quasi sescentos viros"
      en: "And Samuel arose and went up from Galgal to Gabaa of Benjamin. And the rest of the people went up after Saul, to meet the people who fought against them, going from Galgal to Gabaa in the hill of Benjamin. And Saul numbered the people, that were found with him, about six hundred men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Saul et Ionathan filius eius populusque qui inventus fuerat cum eis erat in Gabaa Beniamin porro Philisthim consederant in Machmas"
      en: "And Saul and Jonathan his son, and the people that were present with them, were in Gabaa of Benjamin: but the Philistines encamped in Machmas."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et egressi sunt ad praedandum de castris Philisthim tres cunei unus cuneus pergebat contra viam Ephra ad terram Saul"
      en: "And there went out of the camp of the Philistines three companies to plunder. One company went towards the way of Ephra to the land of Sual;"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "porro alius ingrediebatur per viam Bethoron tertius autem verterat se ad iter termini inminentis valli Seboim contra desertum"
      en: "And another went by the way of Beth-horon, and the third turned to the way of the border, above the valley of Seboim towards the desert."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "porro faber ferrarius non inveniebatur in omni terra Israhel caverant enim Philisthim ne forte facerent Hebraei gladium aut lanceam"
      en: "Now there was no smith to be found in all the land of Israel, for the Philistines had taken this precaution, lest the Hebrews should make them swords or spears."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "descendebat ergo omnis Israhel ad Philisthim ut exacueret unusquisque vomerem suum et ligonem et securim et sarculum"
      en: "So all Israel went down to the Philistines, to sharpen every man his ploughshare, and his spade, and his axe, and his rake."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "retunsae itaque erant acies vomerum et ligonum et tridentum et securium usque ad stimulum corrigendum"
      en: "So that their shares, and their spades, and their forks, and their axes were blunt, even to the goad, which was to be mended."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cumque venisset dies proelii non est inventus ensis et lancea in manu totius populi qui erat cum Saul et cum Ionathan excepto Saul et Ionathan filio eius"
      en: "And when the day of battle was come, there was neither sword nor spear found in the hand of any of the people that were with Saul and Jonathan, except Saul and Jonathan his son."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "egressa est autem statio Philisthim ut transcenderet in Machmas"
      en: "And the army of the Philistines went out in order to advance further in Machmas."
    status: { la: verified, en: verified }
