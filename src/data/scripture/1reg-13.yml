# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 13
verses:
  - n: 1
    text:
      la: "Filius unius anni erat Saul cum regnare coepisset, duobus autem annis regnavit super Israel."
      en: "Saul was a child of one year when he began to reign, and he reigned two years over Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et elegit sibi Saul tria millia de Israel: et erant cum Saul duo millia in Machmas, et in monte Bethel: mille autem cum Jonatha in Gabaa Benjamin: porro ceterum populum remisit unumquemque in tabernacula sua."
      en: "And Saul chose him three thousand men of Israel: and two thousand were with Saul in Machmas, and in mount Bethel: and a thousand with Jonathan in Gabaa of Benjamin, and the rest of the people he sent back every man to their dwellings."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et percussit Jonathas stationem Philisthinorum, quae erat in Gabaa. Quod cum audissent Philisthiim, Saul cecinit buccina in omni terra, dicens: Audiant Hebraei."
      en: "And Jonathan smote the garrison of the Philistines which was in Gabaa. And when the Philistines had heard of it, Saul sounded the trumpet over all the land, saying: Let the Hebrews hear."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et universus Israel audivit hujuscemodi famam: Percussit Saul stationem Philisthinorum: et erexit se Israel adversus Philisthiim. Clamavit ergo populus post Saul in Galgala."
      en: "And all Israel heard this report: Saul hath smitten the garrison of the Philistines: and Israel took courage against the Philistines. And the people were called together after Saul to Galgal."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et Philisthiim congregati sunt ad praeliandum contra Israel, triginta millia curruum, et sex millia equitum, et reliquum vulgus, sicut arena quae est in littore maris plurima. Et ascendentes castrametati sunt in Machmas ad orientem Bethaven."
      en: "The Philistines also were assembled to fight against Israel, thirty thousand chariots, and six thousand horsemen, and a multitude of people besides, like the sand on the sea shore for number. And going up they camped in Machmas at the east of Bethaven."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quod cum vidissent viri Israel se in arcto positos ( afflictus enim erat populus), absconderunt se in speluncis, et in abditis, in petris quoque, et in antris, et in cisternis."
      en: "And when the men of Israel saw that they were straitened, (for the people were distressed,) they hid themselves in caves, and in thickets, and in rocks, and in dens, and in pits."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Hebraei autem transierunt Jordanem in terram Gad et Galaad. Cumque adhuc esset Saul in Galgala, universus populus perterritus est, qui sequebatur eum."
      en: "And some of the Hebrews passed over the Jordan into the land of Gad and Galaad. And when Saul was yet in Galgal, all the people that followed him were greatly afraid."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et expectavit septem diebus juxta placitum Samuelis, et non venit Samuel in Galgala, dilapsusque est populus ab eo."
      en: "And he waited seven days according to the appointment of Samuel, I and Samuel came not to Galgal, and the people slipt away from him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ait ergo Saul: Afferte mihi holocaustum, et pacifica. Et obtulit holocaustum."
      en: "Then Saul said: Bring me the holocaust, and the peace offerings. And he offered the holocaust."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cumque complesset offerens holocaustum, ecce Samuel veniebat: et egressus est Saul obviam ei ut salutaret eum."
      en: "And when he had made an end of offering the holocaust, behold Samuel came: and Saul went forth to meet him and salute him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Locutusque est ad eum Samuel: Quid fecisti? Respondit Saul: Quia vidi quod populus dilaberetur a me, et tu non veneras juxta placitos dies, porro Philisthiim congregati fuerant in Machmas,"
      en: "And Samuel said to him: What hast thou done? Saul answered: Because I saw that the people slipt from me, and thou wast not come according to the days appointed, and the Philistines were gathered together in Machmas,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dixi: Nunc descendent Philisthiim ad me in Galgala, et faciem Domini non placavi. Necessitate compulsus, obtuli holocaustum."
      en: "I said: Now will the Philistines come down upon me to Galgal, and I have not appeased the face of the Lord. Forced by necessity, I offered the holocaust."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixitque Samuel ad Saul: Stulte egisti, nec custodisti mandata Domini Dei tui, quae praecepit tibi. Quod si non fecisses, jam nunc praeparasset Dominus regnum tuum super Israel in sempiternum,"
      en: "And Samuel said to Saul: Thou hast done foolishly, and hast not kept the commandments of the Lord thy God, which he commanded thee. And if thou hadst not done thus, the Lord would now have established thy kingdom over Israel for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed nequaquam regnum tuum ultra consurget. Quaesivit Dominus sibi virum juxta cor suum: et praecepit ei Dominus ut esset dux super populum suum, eo quod non servaveris quae praecepit Dominus."
      en: "But thy kingdom shall not continue. The Lord hath sought him a man according to his own heart: and him hath the Lord commanded to be prince over his people, because thou hast not observed that which the Lord commanded."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Surrexit autem Samuel, et ascendit de Galgalis in Gabaa Benjamin. Et reliqui populi ascenderunt post Saul obviam populo, qui expugnabant eos venientes de Galgala in Gabaa, in colle Benjamin. Et recensuit Saul populum, qui inventi fuerant cum eo, quasi sexcentos viros."
      en: "And Samuel arose and went up from Galgal to Gabaa of Benjamin. And the rest of the people went up after Saul, to meet the people who fought against them, going from Galgal to Gabaa in the hill of Benjamin. And Saul numbered the people, that were found with him, about six hundred men."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et Saul et Jonathas filius ejus, populusque qui inventus fuerat cum eis, erat in Gabaa Benjamin: porro Philisthiim consederant in Machmas."
      en: "And Saul and Jonathan his son, and the people that were present with them, were in Gabaa of Benjamin: but the Philistines encamped in Machmas."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et egressi sunt ad praedandum de castris Philisthinorum tres cunei. Unus cuneus pergebat contra viam Ephra ad terram Sual:"
      en: "And there went out of the camp of the Philistines three companies to plunder. One company went towards the way of Ephra to the land of Sual;"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "porro alius ingrediebatur per viam Beth-horon: tertius autem verterat se ad iter termini imminentis valli Seboim contra desertum."
      en: "And another went by the way of Beth-horon, and the third turned to the way of the border, above the valley of Seboim towards the desert."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Porro faber ferrarius non inveniebatur in omni terra Israel. Caverant enim Philisthiim, ne forte facerent Hebraei gladium aut lanceam."
      en: "Now there was no smith to be found in all the land of Israel, for the Philistines had taken this precaution, lest the Hebrews should make them swords or spears."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Descendebat ergo omnis Israel ad Philisthiim, ut exacueret unusquisque vomerem suum, et ligonem, et securim, et sarculum."
      en: "So all Israel went down to the Philistines, to sharpen every man his ploughshare, and his spade, and his axe, and his rake."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Retusae itaque erant acies vomerum, et ligonum, et tridentum, et securium, usque ad stimulum corrigendum."
      en: "So that their shares, and their spades, and their forks, and their axes were blunt, even to the goad, which was to be mended."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cumque venisset dies praelii, non est inventus ensis et lancea in manu totius populi, qui erat cum Saule et Jonatha, excepto Saul et Jonatha filio ejus."
      en: "And when the day of battle was come, there was neither sword nor spear found in the hand of any of the people that were with Saul and Jonathan, except Saul and Jonathan his son."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Egressa est autem statio Philisthiim, ut transcenderet in Machmas."
      en: "And the army of the Philistines went out in order to advance further in Machmas."
    status: { la: verified, en: verified }
