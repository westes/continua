book: jer
chapter: 21
verses:
  - n: 1
    text:
      la: "verbum quod factum est ad Hieremiam a Domino quando misit ad eum rex Sedecias Phassur filium Melchiae et Sophoniam filium Maasiae sacerdotem dicens"
      en: "The word that came to Jeremias from the Lord, when king Sedecias sent unto him Phassur, the son of Melchias, and Sophonias, the son of Maasias the priest, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "interroga pro nobis Dominum quia Nabuchodonosor rex Babylonis proeliatur adversum nos si forte faciat Dominus nobiscum secundum omnia mirabilia sua et recedat a nobis"
      en: "Inquire of the Lord for us, for Nabuchodonosor king of Babylon maketh war against us: if so be the Lord will deal with us according to all his wonderful works, that he may depart from us."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixit Hieremias ad eos sic dicetis Sedeciae"
      en: "And Jeremias said to them: Thus shall you say to Sedecias:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "haec dicit Dominus Deus Israhel ecce ego convertam vasa belli quae in manibus vestris sunt et quibus vos pugnatis adversum regem Babylonis et Chaldeos qui obsident vos in circuitu murorum et congregabo ea in medio civitatis huius"
      en: "Thus saith the Lord, the God of Israel: Behold I will turn back the weapons of war that are in your hands, with which you fight against the king of Babylon, and the Chaldeans, that besiege you round about the walls: and I will gather them together in the midst of this city."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et debellabo ego vos in manu extenta et brachio forti et in furore et in indignatione et in ira grandi"
      en: "And I myself will fight against you with an outstretched hand, and with a strong arm, and in fury, and in indignation, and in great wrath."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et percutiam habitatores civitatis huius homines et bestiae pestilentia magna morientur"
      en: "And I will strike the inhabitants of this city, men and beasts shall die of a great pestilence."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et post haec ait Dominus dabo Sedeciam regem Iuda et servos eius et populum eius et qui derelicti sunt in civitate hac a peste et gladio et fame in manu Nabuchodonosor regis Babylonis et in manu inimicorum eorum et in manu quaerentium animam eorum et percutiet eos in ore gladii et non movebitur neque parcet nec miserebitur"
      en: "And after this, saith the Lord, I will give Sedecias the king of Juda, and his servants, and his people, and such as are left in this city from the pestilence, and the sword , and the famine, into the hand of Nabuchodonosor the king of Babylon, and into the hand of their enemies, and into the hand of them that seek their life, and he shall strike them with the edge of the sword, and he shall not be moved to pity, nor spare them, nor shew mercy on them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ad populum hunc dices haec dicit Dominus ecce ego do coram vobis viam vitae et viam mortis"
      en: "And to this people thou shalt say: Thus saith the Lord: Behold I set before you the way of life, and the way of death."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui habitaverit in urbe hac morietur gladio et fame et peste qui autem egressus fuerit et transfugerit ad Chaldeos qui obsident vos vivet et erit ei anima sua quasi spolium"
      en: "He that shall abide in this city, shall die by the sword, and by the famine, and by the pestilence: but he that shall go out and flee over to the Chaldeans, that besiege you, shall live, and his life shall be to him as a spoil."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "posui enim faciem meam super civitatem hanc in malum et non in bonum ait Dominus in manu regis Babylonis dabitur et exuret eam igni"
      en: "For I have set my face against this city for evil, and not for good, saith the Lord: it shall be given into the hand of the king of Babylon, and he shall burn it with fire."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et domui regis Iuda audite verbum Domini"
      en: "And to the house of the king of Juda: Hear ye the word of the Lord,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "domus David haec dicit Dominus iudicate mane iudicium et eruite vi oppressum de manu calumniantis ne forte egrediatur ut ignis indignatio mea et succendatur et non sit qui extinguat propter malitiam studiorum vestrorum"
      en: "O house of David, this saith the Lord: Judge ye judgement in the morning, and deliver him that is oppressed by violence out of the hand of the oppressor: lest my indignation go forth like a fire, and be kindled, and there be none to quench it, because of the evil of your ways."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ecce ego ad te habitatricem vallis solidae atque campestris ait Dominus qui dicitis quis percutiet nos et quis ingredietur domos nostras"
      en: ""
    status: { la: verified, en: missing }
  - n: 14
    text:
      la: "et visitabo super vos iuxta fructum studiorum vestrorum dicit Dominus et succendam ignem in saltu eius et devorabit omnia in circuitu eius"
      en: "Behold I come to thee that dwelleth in a valley upon a rock above a plain, saith the Lord: and you say: Who shall strike us? and who shall enter into our houses?"
    status: { la: verified, en: verified }
