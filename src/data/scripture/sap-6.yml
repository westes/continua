# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sap
chapter: 6
verses:
  - n: 1
    text:
      la: "Melior est sapientia quam vires, et vir prudens quam fortis."
      en: "Wisdom is better than strength, and a wise man is better than a strong man."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Audite ergo, reges, et intelligite; discite, judices finium terrae."
      en: "Hear therefore, ye kings, and understand: learn, ye that are judges of the ends of the earth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Praebete aures, vos qui continetis multitudines, et placetis vobis in turbis nationum."
      en: "Give ear, you that rule the people, and that please yourselves in multitudes of nations:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quoniam data est a Domino potestas vobis, et virtus ab Altissimo, qui interrogabit opera vestra, et cogitationes scrutabitur;"
      en: "For power is given you by the Lord, and strength by the most High, who will examine your works, and search out your thoughts:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quoniam cum essetis ministri regni illius, non recte judicastis, nec custodistis legem justitiae, neque secundum voluntatem Dei ambulastis."
      en: "Because being ministers of his kingdom, you have not judged rightly, nor kept the law of justice, nor walked according to the will of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Horrende et cito aparebit vobis, quoniam judicium durissimum his qui praesunt fiet."
      en: "Horribly and speedily will he appear to you: for a most severe judgment shall be for them that bear rule."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Exiguo enim conceditur misericordia; potentes autem potenter tormenta patientur."
      en: "For to him that is little, mercy is granted: but the mighty shall be mightily tormented."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non enim subtrahet personam cujusquam Deus, nec verebitur magnitudinem ejus cujusquam, quoniam pusillum et magnum ipse fecit, et aequaliter cura est illi de omnibus."
      en: "For God will not except any man's person, neither will he stand in awe of any man's greatness: for he made the little and the great, and he hath equally care of all."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Fortioribus autem fortior instat cruciatio."
      en: "But a greater punishment is ready for the more mighty."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ad vos ergo, reges, sunt hi sermones mei, ut discatis sapientiam, et non excidatis."
      en: "To you, therefore, O kings, are these my words, that you may learn wisdom, and not fall from it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui enim custodierint justa juste, justificabuntur; et qui didicerint ista, invenient quid respondeant."
      en: "For they that have kept just things justly, shall be justified: and they that have learned these things, shall find what to answer."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Concupiscite ergo sermones meos; diligite illos, et habebitis disciplinam."
      en: "Covet ye therefore my words, and love them, and you shall have instruction."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Clara est, et quae numquam marcescit, sapientia; et facile videtur ab his qui diligunt eam, et invenitur ab his qui quaerunt illam."
      en: "Wisdom is glorious, and never fadeth away, and is easily seen by them that love her, and is found by them that seek her."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Praeoccupat qui se concupiscunt, ut illis se prior ostendat."
      en: "She preventeth them that covet her, so that she first sheweth herself unto them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Qui de luce vigilaverit ad illam non laborabit; assidentem enim illam foribus suis inveniet."
      en: "He that awaketh early to seek her, shall not labour: for he shall find her sitting at his door."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cogitare ergo de illa sensus est consummatus, et qui vigilaverit propter illam cito securus erit."
      en: "To think therefore upon her, is perfect understanding: and he that watcheth for her, shall quickly be secure."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quoniam dignos se ipsa circuit quaerens, et in viis ostendit se hilariter, et in omni providentia occurrit illis."
      en: "For she goeth about seeking such as are worthy of her, and she sheweth herself to them cheerfully in the ways, and meeteth them with all providence."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Initium enim illius verissima est disciplinae concupiscentia."
      en: "For the beginning of her is the most true desire of discipline."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cura ergo disciplinae dilectio est, et dilectio custodia legum illius est; custoditio autem legum consummatio incorruptionis est;"
      en: "And the care of discipline is love: and love is the keeping of her laws: and the keeping of her laws is the firm foundation of incorruption:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "incorruptio autem facit esse proximum Deo."
      en: "And incorruption bringeth near to God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Concupiscentia itaque sapientiae deducit ad regnum perpetuum."
      en: "Therefore the desire of wisdom bringeth to the everlasting kingdom."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Si ergo delectamini sedibus et sceptris, o reges populi, diligite sapientiam, ut in perpetuum regnetis:"
      en: "If then your delight be in thrones, and sceptres, O ye kings of the people, love wisdom, that you may reign for ever."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "diligite lumen sapientiae, omnes qui praeestis populis."
      en: "Love the light of wisdom, all ye that bear rule over peoples."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Quid est autem sapientia, et quemadmodum facta sit referam, et non abscondam a vobis sacramenta Dei, sed ab initio nativitatis investigabo: et ponam in lucem scientiam illius, et non praeteribo veritatem."
      en: "Now what wisdom is, and what was her origin, I will declare: and I will not hide from you the mysteries of God, but will seek her out from the beginning of her birth, and bring the knowledge of her to light, and will not pass over the truth:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Neque cum invidia tabescente iter habebo, quoniam talis homo non erit particeps sapientiae."
      en: "Neither will I go with consuming envy: for such a man shall not be partaker of wisdom."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Multitudo autem sapientium sanitas est orbis terrarum, et rex sapiens stabilimentum populi est."
      en: "Now the multitude of the wise is the welfare of the whole world: and a wise king is the upholding of the people."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ergo accipite disciplinam per sermones meos, et proderit vobis."
      en: "Receive therefore instruction by my words, and it shall be profitable to you."
    status: { la: verified, en: verified }
