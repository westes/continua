# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 35
verses:
  - n: 1
    text:
      la: "laetabitur deserta et invia et exultabit solitudo et florebit quasi lilium"
      en: "The land that was desolate and impassable shall be glad, and the wilderness shall rejoice, and shall flourish like the lily."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "germinans germinabit et exultabit laetabunda et laudans gloria Libani data est ei decor Carmeli et Saron ipsi videbunt gloriam Domini et decorem Dei nostri"
      en: "It shall bud forth and blossom, and shall rejoice with joy and praise: the glory of Libanus is given to it: the beauty of Carmel, and Saron, they shall see the glory of the Lord, and the beauty of our God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "confortate manus dissolutas et genua debilia roborate"
      en: "Strengthen ye the feeble hands, and confirm the weak knees."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "dicite pusillanimis confortamini nolite timere ecce Deus vester ultionem adducet retributionis Deus ipse veniet et salvabit vos"
      en: "Say to the fainthearted: Take courage, and fear not: behold your God will bring the revenge of recompense: God himself will come and will save you."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tunc aperientur oculi caecorum et aures surdorum patebunt"
      en: "Then shall the eyes of the blind be opened, and the ears of the deaf shall be unstopped."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tunc saliet sicut cervus claudus et aperta erit lingua mutorum quia scissae sunt in deserto aquae et torrentes in solitudine"
      en: "Then shall the lame man leap as a hart, and the tongue of the dumb shall be free: for waters are broken out in the desert, and streams in the wilderness."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et quae erat arida in stagnum et sitiens in fontes aquarum in cubilibus in quibus prius dracones habitabant orietur viror calami et iunci"
      en: "And that which was dry land, shall become a pool, and the thirsty land springs of water. In the dens where dragons dwell before, shall rise up the verdure of the reed and the bulrush."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et erit ibi semita et via et via sancta vocabitur non transibit per eam pollutus et haec erit nobis directa via ita ut stulti non errent per eam"
      en: "And a path and a way shall be there, and it shall be called the holy way: the unclean shall not pass over it, and this shall be unto you a straight way, so that fools shall not err therein."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "non erit ibi leo et mala bestia non ascendet per eam nec invenietur ibi et ambulabunt qui liberati fuerint"
      en: "No lion shall be there, nor shall any mischievous beast go up by it, nor be found there: but they shall walk there that shall be delivered."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et redempti a Domino convertentur et venient in Sion cum laude et laetitia sempiterna super caput eorum gaudium et laetitiam obtinebunt et fugiet dolor et gemitus"
      en: "And the redeemed of the Lord shall return, and shall come into Sion with praise, and everlasting joy shall be upon their heads: they shall obtain joy and gladness, and sorrow and mourning shall flee away."
    status: { la: verified, en: verified }
