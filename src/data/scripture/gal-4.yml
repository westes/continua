# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gal
chapter: 4
verses:
  - n: 1
    text:
      la: "Dico autem: quanto tempore haeres parvulus est, nihil differt a servo, cum sit dominus omnium:"
      en: "Now I say, as long as the heir is a child, he differeth nothing from a servant, though he be lord of all;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sed sub tutoribus et actoribus est usque ad praefinitum tempus a patre:"
      en: "But is under tutors and governors until the time appointed by the father:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ita et nos cum essemus parvuli, sub elementis mundi eramus servientes."
      en: "So we also, when we were children, were serving under the elements of the world."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "At ubi venit plenitudo temporis, misit Deus Filium suum factum ex muliere, factum sub lege,"
      en: "But when the fulness of the time was come, God sent his Son, made of a woman, made under the law:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut eos, qui sub lege erant, redimeret, ut adoptionem filiorum reciperemus."
      en: "That he might redeem them who were under the law: that we might receive the adoption of sons."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quoniam autem estis filii, misit Deus Spiritum Filii sui in corda vestra, clamantem: Abba, Pater."
      en: "And because you are sons, God hath sent the Spirit of his Son into your hearts, crying: Abba, Father."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Itaque jam non est servus, sed filius: quod si filius, et haeres per Deum."
      en: "Therefore now he is not a servant, but a son. And if a son, an heir also through God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sed tunc quidem ignorantes Deum, iis, qui natura non sunt dii, serviebatis."
      en: "But then indeed, not knowing God, you served them, who, by nature, are not gods."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nunc autem cum cognoveritis Deum, immo cogniti sitis a Deo: quomodo convertimini iterum ad infirma et egena elementa, quibus denuo servire vultis?"
      en: "But now, after that you have known God, or rather are known by God: how turn you again to the weak and needy elements, which you desire to serve again?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dies observatis, et menses, et tempora, et annos."
      en: "You observe days, and months, and times, and years."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Timeo vos, ne forte sine causa laboraverim in vobis."
      en: "I am afraid of you, lest perhaps I have laboured in vain among you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Estote sicut ego, quia et ego sicut vos: fratres, obsecro vos. Nihil me laesistis."
      en: "Be ye as I, because I also am as you: brethren, I beseech you: you have not injured me at all."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Scitis autem quia per infirmitatem carnis evangelizavi vobis jampridem: et tentationem vestram in carne mea"
      en: "And you know, how through infirmity of the flesh, I preached the gospel to you heretofore: and your temptation in my flesh,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "non sprevistis, neque respuistis: sed sicut angelum Dei excepistis me, sicut Christum Jesum."
      en: "You despised not, nor rejected: but received me as an angel of God, even as Christ Jesus."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ubi est ergo beatitudo vestra? testimonium enim perhibeo vobis, quia, si fieri posset, oculos vestros eruissetis, et dedissetis mihi."
      en: "Where is then your blessedness? For I bear you witness, that, if it could be done, you would have plucked out your own eyes, and would have given them to me."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ergo inimicus vobis factus sum, verum dicens vobis?"
      en: "Am I then become your enemy, because I tell you the truth?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Aemulantur vos non bene: sed excludere vos volunt, ut illos aemulemini."
      en: "They are zealous in your regard not well: but they would exclude you, that you might be zealous for them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Bonum autem aemulamini in bono semper: et non tantum cum praesens sum apud vos."
      en: "But be zealous for that which is good in a good thing always: and not only when I am present with you."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Filioli mei, quos iterum parturio, donec formetur Christus in vobis:"
      en: "My little children, of whom I am in labour again, until Christ be formed in you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "vellem autem esse apud vos modo, et mutare vocem meam: quoniam confundor in vobis."
      en: "And I would willingly be present with you now, and change my voice: because I am ashamed for you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dicite mihi qui sub lege vultis esse: legem non legistis?"
      en: "Tell me, you that desire to be under the law, have you not read the law?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Scriptum est enim: Quoniam Abraham duos filios habuit: unum de ancilla, et unum de libera."
      en: "For it is written that Abraham had two sons: the one by a bondwoman, and the other by a free woman."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Sed qui de ancilla, secundum carnem natus est: qui autem de libera, per repromissionem:"
      en: "But he who was of the bondwoman, was born according to the flesh: but he of the free woman, was by promise."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quae sunt per allegoriam dicta. Haec enim sunt duo testamenta. Unum quidem in monte Sina, in servitutem generans, quae est Agar:"
      en: "Which things are said by an allegory. For these are the two testaments. The one from mount Sina, engendering unto bondage; which is Agar:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Sina enim mons est in Arabia, qui conjunctus est ei quae nunc est Jerusalem, et servit cum filiis suis."
      en: "For Sina is a mountain in Arabia, which hath affinity to that Jerusalem which now is, and is in bondage with her children."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Illa autem, quae sursum est Jerusalem, libera est, quae est mater nostra."
      en: "But that Jerusalem, which is above, is free: which is our mother."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Scriptum est enim: Laetare sterilis, quae non paris; erumpe et clama, quae non parturis: quia multi filii desertae, magis quam ejus quae habet virum."
      en: "For it is written: Rejoice, thou barren, that bearest not: break forth and cry, thou that travailest not: for many are the children of the desolate, more than of her that hath a husband."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Nos autem, fratres, secundum Isaac promissionis filii sumus."
      en: "Now we, brethren, as Isaac was, are the children of promise."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Sed quomodo tunc is, qui secundum carnem natus fuerat, persequebatur eum qui secundum spiritum: ita et nunc."
      en: "But as then he, that was born according to the flesh, persecuted him that was after the spirit; so also it is now."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Sed quid dicit Scriptura? Ejice ancillam, et filium ejus: non enim haeres erit filius ancillae cum filio liberae."
      en: "But what saith the scripture? Cast out the bondwoman and her son; for the son of the bondwoman shall not be heir with the son of the free woman."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Itaque, fratres, non sumus ancillae filii, sed liberae: qua libertate Christus nos liberavit."
      en: "So then, brethren, we are not the children of the bondwoman, but of the free: by the freedom wherewith Christ has made us free."
    status: { la: verified, en: verified }
