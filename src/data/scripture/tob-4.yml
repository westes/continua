# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: tob
chapter: 4
verses:
  - n: 1
    text:
      la: "igitur cum Tobias putaret orationem suam exaudiri ut mori potuisset vocavit ad se Tobiam filium suum"
      en: "Therefore when Tobias thought that his prayer was heard that he might die, he called to him Tobias his son,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque ei audi fili mi verba oris mei et ea in corde tuo quasi fundamentum construe"
      en: "And said to him: Hear, my son, the words of my mouth, and lay them as a foundation in thy heart."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cum acceperit Deus animam meam corpus meum sepeli et honorem habebis matri tuae omnibus diebus vitae eius"
      en: "When God shall take my soul, thou shalt bury my body: and thou shalt honour thy mother all the days of her life:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "memor enim esse debes quae et quanta pericula passa sit propter te in utero suo"
      en: "For thou must be mindful what and how great perils she suffered for thee in her womb."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cum autem et ipsa conpleverit tempus vitae suae sepelies eam circa me"
      en: "And when she also shall have ended the time of her life, bury her by me."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "omnibus autem diebus vitae tuae Deum in mente habe et cave ne aliquando peccato consentias et praetermittas praecepta Dei nostri"
      en: "And all the days of thy life have God in thy mind: and take heed thou never consent to sin, nor transgress the commandments of the Lord our God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ex substantia tua fac elemosynam et noli avertere faciem tuam ab ullo paupere ita enim fiet ut nec a te avertatur facies Domini"
      en: "Give alms out of thy substance, and turn not away thy face from any poor person: for so it shall come to pass that the face of the Lord shall not be turned from thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quomodo potueris ita esto misericors"
      en: "According to thy ability be merciful."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "si multum tibi fuerit abundanter tribue si exiguum fuerit etiam exiguum libenter inpertire stude"
      en: "If thou have much give abundantly: if thou have a little, take care even so to bestow willingly a little."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "praemium enim tibi bonum thesaurizas in die necessitatis"
      en: "For thus thou storest up to thyself a good reward for the day of necessity."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quoniam elemosyna ab omni peccato et a morte liberat et non patietur animam ire in tenebras"
      en: "For alms deliver from all sin, and from death, and will not suffer the soul to go into darkness."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "fiducia magna erit coram summo Deo elemosyna omnibus qui faciunt eam"
      en: "Alms shall be a great confidence before the most high God, to all them that give it."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "adtende tibi fili mi ab omni fornicatione et praeter uxorem tuam numquam patiaris crimen scire"
      en: "Take heed to keep thyself, my son, from all fornication, and beside thy wife never endure to know a crime."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "superbiam numquam in tuo sensu aut in tuo verbo dominari permittas in ipsa enim initium sumpsit omnis perditio"
      en: "Never suffer pride to reign in thy mind, or in thy words: for from it all perdition took its beginning."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quicumque aliquid tibi operatus fuerit statim mercedem ei restitue et merces mercennarii apud te omnino non maneat"
      en: "If any man hath done any work for thee, immediately pay him his hire, and let not the wages of thy hired servant stay with thee at all."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quod ab alio odis fieri tibi vide ne alteri tu aliquando facias"
      en: "See thou never do to another what thou wouldst hate to have done to thee by another."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "panem tuum cum esurientibus et egenis comede et de vestimentis tuis nudos tege"
      en: "Eat thy bread with the hungry and the needy, and with thy garments cover the naked."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "panem tuum et vinum super sepulturam iusti constitue et noli ex eo manducare et bibere cum peccatoribus"
      en: "Lay out thy bread, and thy wine upon the burial of a just man, and do not eat and drink thereof with the wicked."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "consilium semper a sapiente perquire"
      en: "Seek counsel always of a wise man."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "omni tempore benedic Deum et pete ab eo ut vias tuas dirigat et omnia consilia tua in ipso permaneant"
      en: "Bless God at all times: and desire of him to direct thy ways, and that all thy counsels may abide in him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "indico etiam tibi fili mi dedisse me decem talenta argenti dum infantulus esses Gabelo in Rages civitate Medorum et chirografum eius apud me habeo"
      en: "I tell thee also, my son, that I lent ten talents of silver, while thou wast yet a child, to Gabelus, in Rages a city of the Medes, and I have a note of his hand with me:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ideo perquire quomodo ad eum pervenias et recipias ab eo supra memoratum pondus argenti et restituas ei chirografum suum"
      en: "Now therefore inquire how thou mayst go to him, and receive of him the foresaid sum of money, and restore to him the note of his hand."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "noli timere fili mi pauperem quidem vitam gerimus sed multa bona habemus si timuerimus Deum et recesserimus ab omni peccato et fecerimus bene"
      en: "Fear not, my son: we lead indeed a poor life, but we shall have many good things if we fear God, and depart from all sin, and do that which is good."
    status: { la: verified, en: verified }
