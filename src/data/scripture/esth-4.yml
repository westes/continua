book: esth
chapter: 4
verses:
  - n: 1
    text:
      la: "quae cum audisset Mardocheus scidit vestimenta sua et indutus est sacco spargens cinerem capiti et in platea mediae civitatis voce magna clamabat ostendens amaritudinem animi sui"
      en: "Now when Mardochai had heard these things, he rent his garments, and put on sackcloth, strewing ashes on his head: and he cried with a loud voice in the street in the midst of the city, shewing the anguish of his mind."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et hoc heiulatu usque ad fores palatii gradiens non enim erat licitum indutum sacco aulam regis intrare"
      en: "And he came lamenting in this manner even to the gate of the palace: for no one clothed with sackcloth might enter the king's court."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in omnibus quoque provinciis oppidis ac locis ad quae crudele regis dogma pervenerat planctus ingens erat apud Iudaeos ieiunium ululatus et fletus sacco et cinere multis pro strato utentibus"
      en: "And in all provinces, towns, and places, to which the king's cruel edict was come, there was great mourning among the Jews, with fasting, wailing, and weeping, many using sackcloth and ashes for their bed."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ingressae sunt autem puellae Hester et eunuchi nuntiaveruntque ei quod audiens consternata est et misit vestem ut ablato sacco induerent eum quam accipere noluit"
      en: "Then Esther's maids and her eunuchs went in, and told her. And when she heard it she was in a consternation: and she sent a garment, to clothe him, and to take away the sackcloth: but he would not receive it."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "accitoque Athac eunucho quem rex ministrum ei dederat praecepit ut iret ad Mardocheum et disceret ab eo cur hoc faceret"
      en: "And she called for Athach the eunuch, whom the king had appointed to attend upon her, and she commanded him to go to Mardochai, and learn of him why he did this."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "egressusque Athac ivit ad Mardocheum stantem in platea civitatis ante ostium palatii"
      en: "And Athach going out went to Mardochai, who was standing in the street of the city, before the palace gate:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui indicavit ei omnia quae acciderant quomodo Aman promisisset ut in thesauros regis pro Iudaeorum nece inferret argentum"
      en: "And Mardochai told him all that had happened, how Aman had promised to pay money into the king's treasures, to have the Jews destroyed."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "exemplarque edicti quod pendebat in Susis dedit ei ut reginae ostenderet et moneret eam ut intraret ad regem et deprecaretur eum pro populo suo"
      en: "He gave him also a copy of the edict which was hanging up in Susan, that he should shew it to the queen, and admonish her to go in to the king, and to en- treat him for her people."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "regressus Athac nuntiavit Hester omnia quae Mardocheus dixerat"
      en: "And Athach went back and told Esther all that Mardochai had said."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quae respondit ei et iussit ut diceret Mardocheo"
      en: "She answered him, and bade him say to Mardochai:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "omnes servi regis et cunctae quae sub dicione eius sunt norunt provinciae quod sive vir sive mulier invocatus interius atrium regis intraverit absque ulla cunctatione statim interficiatur nisi forte rex auream virgam ad eum tetenderit pro signo clementiae atque ita possit vivere ego igitur quomodo ad regem intrare potero quae triginta iam diebus non sum vocata ad eum"
      en: "All the king's servants, and all the provinces that are under his dominion, know, that whosoever, whether man or woman, cometh into the king's inner court, who is not called for, is immediately to be put to death without any delay: except the king shall hold out the golden sceptre to him, in token of clemency, that so he may live. How then can I go in to the king, who for these thirty days now have not been called unto him?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quod cum audisset Mardocheus"
      en: "And when Mardochai had heard this,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "rursum mandavit Hester dicens ne putes quod animam tuam tantum liberes quia in domo regis es prae cunctis Iudaeis"
      en: "He sent word to Esther again, saying: Think not that thou mayst save thy life only, because thou art in the king a house, more than all the Jews:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si enim nunc silueris per aliam occasionem liberabuntur Iudaei et tu et domus patris tui peribitis et quis novit utrum idcirco ad regnum veneris ut in tali tempore parareris"
      en: "For if thou wilt now hold thy peace, the Jews shall be delivered by some other occasion: and thou, and thy father's house shall perish. And who knoweth whether thou art not therefore come to the kingdom, that thou mightest be ready in such a time as this?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "rursumque Hester haec Mardocheo verba mandavit"
      en: "And again Esther sent to Mardochai in these words:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "vade et congrega omnes Iudaeos quos in Susis reppereris et orate pro me non comedatis et non bibatis tribus diebus ac noctibus et ego cum ancillulis meis similiter ieiunabo et tunc ingrediar ad regem contra legem faciens invocata tradensque me morti et periculo"
      en: "Go, and gather together all the Jews whom thou shalt find in Susan, and pray ye for me. Neither eat nor drink for three days and three nights: and I with my handmaids will fast in like manner, and then I will go in to the king, against the law, not being called, and expose myself to death and to danger."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ivit itaque Mardocheus et fecit omnia quae ei Hester praeceperat"
      en: "So Mardochai went, and did all that Esther had commanded him."
    status: { la: verified, en: verified }
