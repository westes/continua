# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1cor
chapter: 15
verses:
  - n: 1
    text:
      la: "Notum autem vobis facio, fratres, Evangelium, quod praedicavi vobis, quod et accepistis, in quo et statis,"
      en: "Now I make known unto you, brethren, the gospel which I preached to you, which also you have received, and wherein you stand;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "per quod et salvamini: qua ratione praedicaverim vobis, si tenetis, nisi frustra credidistis."
      en: "By which also you are saved, if you hold fast after what manner I preached unto you, unless you have believed in vain."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tradidi enim vobis in primis quod et accepi: quoniam Christus mortuus est pro peccatis nostris secundum Scripturas:"
      en: "For I delivered unto you first of all, which I also received: how that Christ died for our sins, according to the scriptures:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et quia sepultus est, et quia resurrexit tertia die secundum Scripturas:"
      en: "And that he was buried, and that he rose again the third day, according to the scriptures:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et quia visus est Cephae, et post hoc undecim:"
      en: "And that he was seen by Cephas; and after that by the eleven."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "deinde visus est plus quam quingentis fratribus simul: ex quibus multi manent usque adhuc, quidam autem dormierunt:"
      en: "Then he was seen by more than five hundred brethren at once: of whom many remain until this present, and some are fallen asleep."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "deinde visus est Jacobo, deinde Apostolis omnibus:"
      en: "After that, he was seen by James, then by all the apostles."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "novissime autem omnium tamquam abortivo, visus est et mihi."
      en: "And last of all, he was seen also by me, as by one born out of due time."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ego enim sum minimus Apostolorum, qui non sum dignus vocari Apostolus, quoniam persecutus sum ecclesiam Dei."
      en: "For I am the least of the apostles, who am not worthy to be called an apostle, because I persecuted the church of God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Gratia autem Dei sum id quod sum, et gratia ejus in me vacua non fuit, sed abundantius illis omnibus laboravi: non ego autem, sed gratia Dei mecum:"
      en: "But by the grace of God, I am what I am; and his grace in me hath not been void, but I have laboured more abundantly than all they: yet not I, but the grace of God with me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sive enim ego, sive illi: sic praedicamus, et sic credidistis."
      en: "For whether I, or they, so we preach, and so you have believed."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Si autem Christus praedicatur quod resurrexit a mortuis, quomodo quidam dicunt in vobis, quoniam resurrectio mortuorum non est?"
      en: "Now if Christ be preached, that he arose again from the dead, how do some among you say, that there is no resurrection of the dead?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si autem resurrectio mortuorum non est: neque Christus resurrexit."
      en: "But if there be no resurrection of the dead, then Christ is not risen again."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Si autem Christus non resurrexit, inanis est ergo praedicatio nostra, inanis est et fides vestra:"
      en: "And if Christ be not risen again, then is our preaching vain, and your faith is also vain."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "invenimur autem et falsi testes Dei: quoniam testimonium diximus adversus Deum quod suscitaverit Christum, quem non suscitavit, si mortui non resurgunt."
      en: "Yea, and we are found false witnesses of God: because we have given testimony against God, that he hath raised up Christ; whom he hath not raised up, if the dead rise not again."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nam si mortui non resurgunt, neque Christus resurrexit."
      en: "For if the dead rise not again, neither is Christ risen again."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quod si Christus non resurrexit, vana est fides vestra: adhuc enim estis in peccatis vestris."
      en: "And if Christ be not risen again, your faith is vain, for you are yet in your sins."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ergo et qui dormierunt in Christo, perierunt."
      en: "Then they also that are fallen asleep in Christ, are perished."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Si in hac vita tantum in Christo sperantes sumus, miserabiliores sumus omnibus hominibus."
      en: "If in this life only we have hope in Christ, we are of all men most miserable."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Nunc autem Christus resurrexit a mortuis primitiae dormientium,"
      en: "But now Christ is risen from the dead, the firstfruits of them that sleep:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quoniam quidem per hominem mors, et per hominem resurrectio mortuorum."
      en: "For by a man came death, and by a man the resurrection of the dead."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et sicut in Adam omnes moriuntur, ita et in Christo omnes vivificabuntur."
      en: "And as in Adam all die, so also in Christ all shall be made alive."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Unusquisque autem in suo ordine, primitiae Christus: deinde ii qui sunt Christi, qui in adventu ejus crediderunt."
      en: "But every one in his own order: the firstfruits Christ, then they that are of Christ, who have believed in his coming."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Deinde finis: cum tradiderit regnum Deo et Patri, cum evacuaverit omnem principatum, et potestatem, et virtutem."
      en: "Afterwards the end, when he shall have delivered up the kingdom to God and the Father, when he shall have brought to nought all principality, and power, and virtue."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Oportet autem illum regnare donec ponat omnes inimicos sub pedibus ejus."
      en: "For he must reign, until he hath put all his enemies under his feet."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Novissima autem inimica destruetur mors: omnia enim subjecit pedibus ejus. Cum autem dicat:"
      en: "And the enemy death shall be destroyed last: For he hath put all things under his feet. And whereas he saith,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Omnia subjecta sunt ei, sine dubio praeter eum qui subjecit ei omnia."
      en: "All things are put under him; undoubtedly, he is excepted, who put all things under him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Cum autem subjecta fuerint illi omnia: tunc et ipse Filius subjectus erit ei, qui subjecit sibi omnia, ut sit Deus omnia in omnibus."
      en: "And when all things shall be subdued unto him, then the Son also himself shall be subject unto him that put all things under him, that God may be all in all."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Alioquin quid facient qui baptizantur pro mortuis, si omnino mortui non resurgunt? ut quid et baptizantur pro illis?"
      en: "Otherwise what shall they do that are baptized for the dead, if the dead rise not again at all? why are they then baptized for them?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ut quid et nos periclitamur omni hora?"
      en: "Why also are we in danger every hour?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Quotidie morior per vestram gloriam, fratres, quam habeo in Christo Jesu Domino nostro."
      en: "I die daily, I protest by your glory, brethren, which I have in Christ Jesus our Lord."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Si secundum hominem ad bestias pugnavi Ephesi, quid mihi prodest, si mortui non resurgunt? Manducemus, et bibamus, cras enim moriemur."
      en: "If (according to man) I fought with beasts at Ephesus, what doth it profit me, if the dead rise not again? Let us eat and drink, for tomorrow we shall die."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Nolite seduci: corrumpunt mores bonos colloquia mala."
      en: "Be not seduced: Evil communications corrupt good manners."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Evigilate justi, et nolite peccare: ignorantiam enim Dei quidam habent, ad reverentiam vobis loquor."
      en: "Awake, ye just, and sin not. For some have not the knowledge of God, I speak it to your shame."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Sed dicet aliquis: Quomodo resurgunt mortui? qualive corpore venient?"
      en: "But some man will say: How do the dead rise again? or with what manner of body shall they come?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Insipiens, tu quod seminas non vivificatur, nisi prius moriatur:"
      en: "Senseless man, that which thou sowest is not quickened, except it die first."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et quod seminas, non corpus, quod futurum est, seminas, sed nudum granum, ut puta tritici, aut alicujus ceterorum."
      en: "And that which thou sowest, thou sowest not the body that shall be; but bare grain, as of wheat, or of some of the rest."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Deus autem dat illi corpus sicut vult: ut unicuique seminum proprium corpus."
      en: "But God giveth it a body as he will: and to every seed its proper body."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Non omnis caro, eadem caro: sed alia quidem hominum, alia vero pecorum, alia volucrum, alia autem piscium."
      en: "All flesh is not the same flesh: but one is the flesh of men, another of beasts, another of birds, another of fishes."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et corpora caelestia, et corpora terrestria: sed alia quidem caelestium gloria, alia autem terrestrium."
      en: "And there are bodies celestial, and bodies terrestrial: but, one is the glory of the celestial, and another of the terrestrial."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Alia claritas solis, alia claritas lunae, et alia claritas stellarum. Stella enim a stella differt in claritate:"
      en: "One is the glory of the sun, another the glory of the moon, and another the glory of the stars. For star differeth from star in glory."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "sic et resurrectio mortuorum. Seminatur in corruptione, surget in incorruptione."
      en: "So also is the resurrection of the dead. It is sown in corruption, it shall rise in incorruption."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Seminatur in ignobilitate, surget in gloria: seminatur in infirmitate, surget in virtute:"
      en: "It is sown in dishonour, it shall rise in glory. It is sown in weakness, it shall rise in power."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "seminatur corpus animale, surget corpus spiritale. Si est corpus animale, est et spiritale, sicut scriptum est:"
      en: "It is sown a natural body, it shall rise a spiritual body. If there be a natural body, there is also a spiritual body, as it is written:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Factus est primus homo Adam in animam viventem, novissimus Adam in spiritum vivificantem."
      en: "The first man Adam was made into a living soul; the last Adam into a quickening spirit."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Sed non prius quod spiritale est, sed quod animale: deinde quod spiritale."
      en: "Yet that was not first which is spiritual, but that which is natural; afterwards that which is spiritual."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Primus homo de terra, terrenus: secundus homo de caelo, caelestis."
      en: "The first man was of the earth, earthly: the second man, from heaven, heavenly."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Qualis terrenus, tales et terreni: et qualis caelestis, tales et caelestes."
      en: "Such as is the earthly, such also are the earthly: and such as is the heavenly, such also are they that are heavenly."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Igitur, sicut portavimus imaginem terreni, portemus et imaginem caelestis."
      en: "Therefore as we have borne the image of the earthly, let us bear also the image of the heavenly."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Hoc autem dico, fratres: quia caro et sanguis regnum Dei possidere non possunt: neque corruptio incorruptelam possidebit."
      en: "Now this I say, brethren, that flesh and blood cannot possess the kingdom of God: neither shall corruption possess incorruption."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Ecce mysterium vobis dico: omnes quidem resurgemus, sed non omnes immutabimur."
      en: "Behold, I tell you a mystery. We shall all indeed rise again: but we shall not all be changed."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "In momento, in ictu oculi, in novissima tuba: canet enim tuba, et mortui resurgent incorrupti: et nos immutabimur."
      en: "In a moment, in the twinkling of an eye, at the last trumpet: for the trumpet shall sound, and the dead shall rise again incorruptible: and we shall be changed."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Oportet enim corruptibile hoc induere incorruptionem: et mortale hoc induere immortalitatem."
      en: "For this corruptible must put on incorruption; and this mortal must put on immortality."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Cum autem mortale hoc induerit immortalitatem, tunc fiet sermo, qui scriptus est: Absorpta est mors in victoria."
      en: "And when this mortal hath put on immortality, then shall come to pass the saying that is written: Death is swallowed up in victory."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Ubi est mors victoria tua? ubi est mors stimulus tuus?"
      en: "O death, where is thy victory? O death, where is thy sting?"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Stimulus autem mortis peccatum est: virtus vero peccati lex."
      en: "Now the sting of death is sin: and the power of sin is the law."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Deo autem gratias, qui dedit nobis victoriam per Dominum nostrum Jesum Christum."
      en: "But thanks be to God, who hath given us the victory through our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Itaque fratres mei dilecti, stabiles estote, et immobiles: abundantes in opere Domini semper, scientes quod labor vester non est inanis in Domino."
      en: "Therefore, my beloved brethren, be ye steadfast and unmoveable; always abounding in the work of the Lord, knowing that your labour is not in vain in the Lord."
    status: { la: verified, en: verified }
