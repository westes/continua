# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 22
verses:
  - n: 1
    text:
      la: "constituerunt autem habitatores Hierusalem Ochoziam filium eius minimum regem pro eo omnes enim maiores natu qui ante eum fuerant interfecerant latrones Arabum qui inruerant in castra regnavitque Ochozias filius Ioram regis Iuda"
      en: "And the inhabitants of Jerusalem made Ochozias his youngest son king in his place: for the rovers of the Arabians, who had broke in upon the camp, had killed all that were his elder brothers. So Ochozias the son of Joram king of Juda reigned."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "filius quadraginta duo annorum erat Ochozias cum regnare coepisset et uno anno regnavit in Hierusalem nomen matris eius Otholia filia Amri"
      en: "Ochozias was forty-two years old when he began to reign, and he reigned one year in Jerusalem, and the name of his mother was Athalia the daughter of Amri."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sed et ipse ingressus est per vias domus Ahab mater enim eius inpulit eum ut impie ageret"
      en: "He also walked in the ways of the house of Achab: for his mother pushed him on to do wickedly."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "fecit igitur malum in conspectu Domini sicut domus Ahab ipsi enim fuerunt ei consiliarii post mortem patris sui in interitum eius"
      en: "So he did evil in the sight of the Lord, as the house of Achab did: for they were his counsellors after the death of his father, to his destruction."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ambulavitque in consiliis eorum et perrexit cum Ioram filio Ahab rege Israhel in bellum contra Azahel regem Syriae in Ramoth Galaad vulneraveruntque Syri Ioram"
      en: "And he walked after their counsels. And he went with Joram the son of Achab king of Israel, to fight against Hazael king of Syria, at Ramoth Galaad : and the Syrians wounded Joram."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui reversus est ut curaretur in Hiezrahel multas enim plagas acceperat in supradicto certamine igitur Azarias filius Ioram rex Iuda descendit ut inviseret Ioram filium Ahab in Hiezrahel aegrotantem"
      en: "And he returned to be healed in Jezrahel: for he received many wounds in the foresaid battle. And Ochozias the son of Joram king of Juda, went down to visit Joram the son of Achab in Jezrahel where he lay sick."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "voluntatis quippe fuit Dei adversum Ochoziam ut veniret ad Ioram et cum venisset egrederetur cum eo adversum Hieu filium Namsi quem unxit Dominus ut deleret domum Ahab"
      en: "For it was the will of God against Ochozias that he should come to Joram: and when he was come should go out also against Jehu the son of Namsi, whom the Lord had anointed to destroy the house of Achab."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cum ergo subverteret Hieu domum Ahab invenit principes Iuda et filios fratrum Ochoziae qui ministrabant ei et interfecit illos"
      en: "So when Jehu was rooting out the house of Achab, he found the princes of Juda, and the sons of the brethren of Ochozias, who served him, and he slew them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ipsumque perquirens Ochoziam conprehendit latentem in Samaria adductumque ad se occidit et sepelierunt eum eo quod esset filius Iosaphat qui quaesierat Dominum in toto corde suo nec erat ultra spes aliqua ut de stirpe regnaret Ochoziae"
      en: "And he sought for Ochozias himself, and took him lying hid in Samaria: and when he was brought to him, he killed him, and they buried him: because he was the son of Josaphat, who had sought the Lord with all his heart. And there was no more hope that any one should reign of the race of Ochozias."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "siquidem Otholia mater eius videns quod mortuus esset filius suus surrexit et interfecit omnem stirpem regiam domus Ioram"
      en: "For Athalia his mother, seeing that her son was dead, rose up, and killed all the royal family of the house of Joram."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "porro Iosabeth filia regis tulit Ioas filium Ochoziae et furata est eum de medio filiorum regis cum interficerentur absconditque cum nutrice sua in cubiculo lectulorum Iosabeth autem quae absconderat eum erat filia regis Ioram uxor Ioiadae pontificis soror Ochoziae et idcirco Otholia non interfecit eum"
      en: "But Josabeth the king's daughter took Joas the son of Ochozias, and stole him from among the king's sons that were slain. And she hid him with his nurse in a bedchamber: now Josabeth that hid him, was daughter of king Joram, wife of Joiada the high priest, and sister of Ochozias, and therefore Athalia did not kill him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "fuit ergo cum eis in domo Dei absconditus sex annis quibus regnavit Otholia super terram"
      en: "And he was with them hid in the house of God six years, during which Athalia reigned over the land."
    status: { la: verified, en: verified }
