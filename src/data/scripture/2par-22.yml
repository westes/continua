# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 22
verses:
  - n: 1
    text:
      la: "Constituerunt autem habitatores Jerusalem Ochoziam filium ejus minimum regem pro eo: omnes enim majores natu, qui ante eum fuerant, interfecerant latrones Arabum, qui irruerant in castra: regnavitque Ochozias filius Joram regis Juda."
      en: "And the inhabitants of Jerusalem made Ochozias his youngest son king in his place: for the rovers of the Arabians, who had broke in upon the camp, had killed all that were his elder brothers. So Ochozias the son of Joram king of Juda reigned."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quadraginta duorum annorum erat Ochozias cum regnare coepisset, et uno anno regnavit in Jerusalem, et nomen matris ejus Athalia filia Amri."
      en: "Ochozias was forty-two years old when he began to reign, and he reigned one year in Jerusalem, and the name of his mother was Athalia the daughter of Amri."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sed et ipse ingressus est per vias domus Achab: mater enim ejus impulit eum ut impie ageret."
      en: "He also walked in the ways of the house of Achab: for his mother pushed him on to do wickedly."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Fecit igitur malum in conspectu Domini, sicut domus Achab: ipsi enim fuerunt ei consiliarii post mortem patris sui, in interitum ejus."
      en: "So he did evil in the sight of the Lord, as the house of Achab did: for they were his counsellors after the death of his father, to his destruction."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ambulavitque in consiliis eorum. Et perrexit cum Joram filio Achab rege Israel in bellum contra Hazael regem Syriae in Ramoth Galaad: vulneraveruntque Syri Joram."
      en: "And he walked after their counsels. And he went with Joram the son of Achab king of Israel, to fight against Hazael king of Syria, at Ramoth Galaad: and the Syrians wounded Joram."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui reversus est ut curaretur in Jezrahel: multas enim plagas acceperat in supradicto certamine. Igitur Ochozias filius Joram rex Juda descendit ut inviseret Joram filium Achab in Jezrahel aegrotantem."
      en: "And he returned to be healed in Jezrahel: for he received many wounds in the foresaid battle. And Ochozias the son of Joram king of Juda, went down to visit Joram the son of Achab in Jezrahel where he lay sick."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Voluntatis quippe fuit Dei adversus Ochoziam, ut veniret ad Joram: et cum venisset, et egrederetur cum eo adversum Jehu filium Namsi, quem unxit Dominus ut deleret domum Achab."
      en: "For it was the will of God against Ochozias that he should come to Joram: and when he was come should go out also against Jehu the son of Namsi, whom the Lord had anointed to destroy the house of Achab."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cum ergo everteret Jehu domum Achab, invenit principes Juda, et filios fratrum Ochoziae, qui ministrabant ei, et interfecit illos."
      en: "So when Jehu was rooting out the house of Achab, he found the princes of Juda, and the sons of the brethren of Ochozias, who served him, and he slew them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ipsum quoque perquirens Ochoziam, comprehendit latitantem in Samaria: adductumque ad se, occidit, et sepelierunt eum, eo quod esset filius Josaphat, qui quaesierat Dominum in toto corde suo. Nec erat ultra spes aliqua ut de stirpe quis regnaret Ochoziae:"
      en: "And he sought for Ochozias himself, and took him lying hid in Samaria: and when he was brought to him, he killed him, and they buried him: because he was the son of Josaphat, who had sought the Lord with all his heart. And there was no more hope that any one should reign of the race of Ochozias."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "siquidem Athalia mater ejus videns quod mortuus esset filius suus, surrexit, et interfecit omnem stirpem regiam domus Joram."
      en: "For Athalia his mother, seeing that her son was dead, rose up, and killed all the royal family of the house of Joram."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Porro Josabeth filia regis tulit Joas filium Ochoziae, et furata est eum de medio filiorum regis, cum interficerentur: absconditque eum cum nutrice sua in cubiculo lectulorum: Josabeth autem, quae absconderat eum, erat filia regis Joram, uxor Jojadae pontificis, soror Ochoziae, et idcirco Athalia non interfecit eum."
      en: "But Josabeth the king's daughter took Joas the son of Ochozias, and stole him from among the king's sons that were slain. And she hid him with his nurse in a bedchamber: now Josabeth that hid him, was daughter of king Joram, wife of Joiada the high priest, and sister of Ochozias, and therefore Athalia did not kill him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Fuit ergo cum eis in domo Dei absconditus sex annis, quibus regnavit Athalia super terram."
      en: "And he was with them hid in the house of God six years, during which Athalia reigned over the land."
    status: { la: verified, en: verified }
