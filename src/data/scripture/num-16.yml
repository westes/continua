# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 16
verses:
  - n: 1
    text:
      la: "ecce autem Core filius Isaar filii Caath filii Levi et Dathan atque Abiram filii Heliab Hon quoque filius Pheleth de filiis Ruben"
      en: "And behold Core the son of Isaar, the son of Caath, the son of Levi, and Dathan and Abiron the sons of Eliab, and Hon the son of Pheleth of the children of Ruben,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "surrexerunt contra Mosen aliique filiorum Israhel ducenti quinquaginta viri proceres synagogae et qui tempore concilii per nomina vocabantur"
      en: "Rose lap against Moses, and with them two hundred and fifty others of the children of Israel, leading men of the synagogue, and who in the time of assembly were called by name."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cumque stetissent adversum Mosen et Aaron dixerunt sufficiat vobis quia omnis multitudo sanctorum est et in ipsis est Dominus cur elevamini super populum Domini"
      en: "And when they had stood up against Moses and Aaron, they said: Let it be enough for you, that all the multitude consisteth of holy ones, and the Lord is among them: Why lift you up yourselves above the people of the Lord?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quod cum audisset Moses cecidit pronus in faciem"
      en: "When Moses heard this, he fell flat on his face:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "locutusque ad Core et ad omnem multitudinem mane inquit notum faciet Dominus qui ad se pertineant et sanctos adplicabit sibi et quos elegerit adpropinquabunt ei"
      en: "And speaking to Core and all the multitude, he said: In the morning the Lord will make known who belong to him, and the holy he will join to himself: and whom he shall choose, they shall approach to him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "hoc igitur facite tollat unusquisque turibula sua tu Core et omne concilium tuum"
      en: "Do this therefore: Take every man of you your censers, thou Core, and all thy company."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et hausto cras igne ponite desuper thymiama coram Domino et quemcumque elegerit ipse erit sanctus multum erigimini filii Levi"
      en: "And putting fire in them to morrow, put incense upon it before the Lord: and whomsoever he shall choose, the same shall be holy: you take too much upon you, ye sons of Levi."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixitque rursum ad Core audite filii Levi"
      en: "And he said again to Core: Hear ye sons of Levi."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "num parum vobis est quod separavit vos Deus Israhel ab omni populo et iunxit sibi ut serviretis ei in cultu tabernaculi et staretis coram frequentia populi et ministraretis ei"
      en: "Is it a small thing unto you, that the God of Israel hath spared you from all the people, and joined you to himself, that you should serve him in the service of the tabernacle, and should stand before the congregation of the people, and should minister to him?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "idcirco ad se fecit accedere te et omnes fratres tuos filios Levi ut vobis etiam sacerdotium vindicetis"
      en: "Did he therefore make thee and all thy brethren the sons of Levi to approach unto him, that you should challenge to yourselves the priesthood also,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et omnis globus tuus stet contra Dominum quid est enim Aaron ut murmuretis contra eum"
      en: "And that all thy company should stand against the Lord ? for what is Aaron that you murmur against him?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "misit ergo Moses ut vocaret Dathan et Abiram filios Heliab qui responderunt non venimus"
      en: "Then Moses sent to call Dathan and Abiron the sons of Eliab. But they answered: We will not come."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "numquid parum est tibi quod eduxisti nos de terra quae lacte et melle manabat ut occideres in deserto nisi et dominatus fueris nostri"
      en: "Is it a small matter to thee, that thou hast brought us out of a land that flowed with milk and honey, to kill us in the desert, except thou rule also like a lord over us?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "re vera induxisti nos in terram quae fluit rivis lactis et mellis et dedisti nobis possessiones agrorum et vinearum an et oculos nostros vis eruere non venimus"
      en: "Thou best brought us indeed into a land that floweth with rivers of milk and honey, and hast given us possessions of fields and vineyards; wilt thou also pull out our eyes? We will not come."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "iratusque Moses valde ait ad Dominum ne respicias sacrificia eorum tu scis quod ne asellum quidem umquam acceperim ab eis nec adflixerim quempiam eorum"
      en: "Moses therefore being very angry, raid to the Lord: Respect not their sacrifices: thou knowest that I have not taken of them so much as a young ass at any time, nor have injured any of them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dixitque ad Core tu et omnis congregatio tua state seorsum coram Domino et Aaron die crastino separatim"
      en: "And he said to Core: Do thou and thy congregation stand apart before the Lord to morrow, and Aaron apart."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "tollite singuli turibula vestra et ponite super ea incensum offerentes Domino ducenta quinquaginta turibula Aaron quoque teneat turibulum suum"
      en: "Take every one of you censers, and put incense upon them, offering to the Lord two hundred and fifty censers: let Aaron also hold his censer."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quod cum fecissent stantibus Mosen et Aaron"
      en: "When they had done this, Moses and Aaron standing,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et coacervassent adversum eos omnem multitudinem ad ostium tabernaculi apparuit cunctis gloria Domini"
      en: "And had drawn up all the multitude against them to the door of the tabernacle, the glory of the Lord appeared to them all."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "locutusque Dominus ad Mosen et Aaron ait"
      en: "And the Lord speaking to Moses and Aaron, said:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "separamini de medio congregationis huius ut eos repente disperdam"
      en: "Separate yourselves from among this congregation, that I may presently destroy them."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui ceciderunt proni in faciem atque dixerunt fortissime Deus spirituum universae carnis num uno peccante contra omnes tua ira desaeviet"
      en: "They fell flat on their face, and said: O most mighty, the God of the spirits of all flesh, for one man's sin shall thy wrath rage against all?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et ait Dominus ad Mosen"
      en: "And the Lord said to Moses:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "praecipe universo populo ut separetur a tabernaculis Core et Dathan et Abiram"
      en: "Command the whole people to separate themselves from the tents of Core and Dathan and Abiron."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "surrexitque Moses et abiit ad Dathan et Abiram et sequentibus eum senioribus Israhel"
      en: "And Moses arose, and went to Dathan and Abiron: and the ancients of Israel following him,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dixit ad turbam recedite a tabernaculis hominum impiorum et nolite tangere quae ad eos pertinent ne involvamini in peccatis eorum"
      en: "He said to the multitude: Depart from the tents of these wicked men, and touch nothing of theirs, lest you be involved in their sins."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cumque recessissent a tentoriis eorum per circuitum Dathan et Abiram egressi stabant in introitu papilionum suorum cum uxoribus et liberis omnique frequentia"
      en: "And when they were departed from their tents round about, Dathan and Abiron coming out stood in the entry of their pavilions with their wives and children, and all the people."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et ait Moses in hoc scietis quod Dominus miserit me ut facerem universa quae cernitis et non ex proprio ea corde protulerim"
      en: "And Moses said: By this you shall know that the Lord hath sent me to do all things that you see, and that I have not forged them of my own head:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "si consueta hominum morte interierint et visitaverit eos plaga qua et ceteri visitari solent non misit me Dominus"
      en: "If these men die the common death of men, and if they be visited with a plague, wherewith others also are wont to be visited, the Lord did not send me."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "sin autem novam rem fecerit Dominus ut aperiens terra os suum degluttiat eos et omnia quae ad illos pertinent descenderintque viventes in infernum scietis quod blasphemaverint Dominum"
      en: "But if the Lord do a new thing, and the earth opening her mouth swallow them down, and all things that belong to them, and they go down alive into hell, you shall know that they have blasphemed the Lord."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "confestim igitur ut cessavit loqui disrupta est terra sub pedibus eorum"
      en: "And immediately as he had made an end of speaking, the earth broke asunder under their feet:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et aperiens os suum devoravit illos cum tabernaculis suis et universa substantia"
      en: "And opening her mouth, devoured them with their tents and all their substance."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "descenderuntque vivi in infernum operti humo et perierunt de medio multitudinis"
      en: "And they went down alive into hell the ground closing upon them, and they perished from among the people."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "at vero omnis Israhel qui stabat per gyrum fugit ad clamorem pereuntium dicens ne forte et nos terra degluttiat"
      en: "But all Israel, that was standing round about, fled at the cry of them that were perishing: saying: Lest perhaps the earth swallow us up also."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "sed et ignis egressus a Domino interfecit ducentos quinquaginta viros qui offerebant incensum"
      en: "And a fire coming out from the Lord, destroyed the two hundred and fifty men that offered the incense."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "praecipe Eleazaro filio Aaron sacerdotis ut tollat turibula quae iacent in incendio et ignem huc illucque dispergat quoniam sanctificata sunt"
      en: "Command Eleazar the son of Aaron the priest to take up the censers that lie in the burning, and to scatter the fire of one side and the other: because they are sanctified"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "in mortibus peccatorum producatque ea in lamminas et adfigat altari eo quod oblatum sit in eis incensum Domino et sanctificata sint ut cernant ea pro signo et monumento filii Israhel"
      en: "In the deaths of the sinners: and let him beat them into plates, and fasten them to the altar, because incense hath been offered in them to the Lord, and they are sanctified, that the children of Israel may see them for a sign and a memorial."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "tulit ergo Eleazar sacerdos turibula aenea in quibus obtulerant hii quos incendium devoravit et produxit ea in lamminas adfigens altari"
      en: "Then Eleazar the priest took the brazen censers, wherein they had offered, whom the burning fire had devoured, and beat them into plates, fastening them to the altar:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "ut haberent postea filii Israhel quibus commonerentur ne quis accedat alienigena et qui non est de semine Aaron ad offerendum incensum Domino ne patiatur sicut passus est Core et omnis congregatio eius loquente Domino ad Mosen"
      en: "That the children of Israel might have for the time to come wherewith they should be admonished, that no stranger or any one that is not of seed of Aaron should come near to offer incense to the Lord, lest he should suffer as Core suffered, and all his congregation, according as the Lord spoke to Moses."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "murmuravit autem omnis multitudo filiorum Israhel sequenti die contra Mosen et Aaron dicens vos interfecistis populum Domini"
      en: "The following day all the multitude of the children of Israel murmured against Moses and Aaron, saying: You have killed the people of the Lord."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "cumque oreretur seditio et tumultus incresceret"
      en: "And when there arose a sedition, and the tumult increased,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Moses et Aaron fugerunt ad tabernaculum foederis quod postquam ingressi sunt operuit nubes et apparuit gloria Domini"
      en: "Moses and Aaron fled to the tabernacle of the covenant. And when the were gone into it, the cloud covered it, and the glory of the Lord appeared."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "dixitque Dominus ad Mosen"
      en: "And the Lord said to Moses:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "recedite de medio huius multitudinis etiam nunc delebo eos cumque iacerent in terra"
      en: "Get you out from the midst of this multitude, this moment will I destroy them. And as they were lying on the ground,"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "dixit Moses ad Aaron tolle turibulum et hausto igne de altari mitte incensum desuper pergens cito ad populum ut roges pro eis iam enim egressa est ira a Domino et plaga desaevit"
      en: "Moses said to Aaron: Take the censer, and putting fire in it from the altar, put incense upon it, and go quickly to the people to pray for them: for already wrath is gone out from the Lord, and the plague rageth."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "quod cum fecisset Aaron et cucurrisset ad mediam multitudinem quam iam vastabat incendium obtulit thymiama"
      en: "When Aaron had done this, and had run to the midst of the multitude which the burning fire was now destroying, he offered the incense:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et stans inter mortuos ac viventes pro populo deprecatus est et plaga cessavit"
      en: "And standing between the dead and the living, he prayed for the people, and the plague ceased."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "fuerunt autem qui percussi sunt quattuordecim milia hominum et septingenti absque his qui perierant in seditione Core"
      en: "And the number of them that were slain was fourteen thousand and seven hundred men, besides them that had perished in the sedition of Core."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "reversusque est Aaron ad Mosen ad ostium tabernaculi foederis postquam quievit interitus"
      en: "And Aaron returned to Moses to the door of the tabernacle of the covenant after the destruction was over."
    status: { la: verified, en: verified }
