# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 23
verses:
  - n: 1
    text:
      la: "Anno autem septimo confortatus Jojada, assumpsit centuriones, Azariam videlicet filium Jeroham, et Ismahel filium Johanan, Azariam quoque filium Obed, et Maasiam filium Adaiae, et Elisaphat filium Zechri: et iniit cum eis foedus."
      en: "And in the seventh year Joiada being encouraged, took the captains of hundreds, to wit, Azarias the son of Jeroham, and Ismahel the son of Johanan, and Azarias the son of Obed, and Maasias the son of Adaias, and Elisaphat the son of Zechri: and made a covenant with them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Qui circumeuntes Judam, congregaverunt Levitas de cunctis urbibus Juda, et principes familiarum Israel, veneruntque in Jerusalem."
      en: "And they went about Juda, and gathered together the Levites out of all the cities of Juda, and the chiefs of the families of Israel, and they came to Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Iniit ergo omnis multitudo pactum in domo Dei cum rege, dixitque ad eos Jojada: Ecce filius regis regnabit, sicut locutus est Dominus super filios David."
      en: "And all the multitude made a covenant with the king in the house of God: and Joiada said to them: Behold the king's son shall reign, as the Lord hath said of the sons of David."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Iste est ergo sermo quem facietis:"
      en: "And this is the thing that you shall do:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tertia pars vestrum qui veniunt ad sabbatum, sacerdotum, et Levitarum, et janitorum erit in portis: tertia vero pars ad domum regis: et tertia ad portam, quae appellatur Fundamenti: omne vero reliquum vulgus sit in atriis domus Domini."
      en: "A third part of you that come to the sabbath, of the priests, and of the Levites, and of the porters, shall be at the gates: and a third part at the king's house: and a third at the gate that is called the Foundation: but let all the rest of the people be in the courts of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nec quispiam alius ingrediatur domum Domini, nisi sacerdotes, et qui ministrant de Levitis: ipsi tantummodo ingrediantur, quia sanctificati sunt: et omne reliquum vulgus observet custodias Domini."
      en: "And let no one come into the house of the Lord, but the priests, and they that minister of the Levites: let them only come in, because they are sanctified: and let all the rest of the people keep the watches of the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Levitae autem circumdent regem, habentes singuli arma sua ( et si quis alius ingressus fuerit templum, interficiatur), sintque cum rege et intrante et egrediente."
      en: "And let the Levites be round about the king, every man with his arms; (and if any other come into the temple, let him be slain;) and let them be with the king, both coming in, and going out."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Fecerunt ergo Levitae, et universus Juda, juxta omnia quae praeceperat Jojada pontifex: et assumpserunt singuli viros qui sub se erant, et veniebant per ordinem sabbati, cum his qui impleverant sabbatum, et egressuri erant: siquidem Jojada pontifex non dimiserat abire turmas, quae sibi per singulas hebdomadas succedere consueverant."
      en: "So the Levites, and all Juda did according to all that Joiada the high priest had commanded: and they took every one his men that were under him, and that came in by the course of the sabbath, with those who had fulfilled the sabbath, and were to go out. For Joiada the high priest permitted not the companies to depart, which were accustomed to succeed one another every week."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Deditque Jojada sacerdos centurionibus lanceas, clypeosque et peltas regis David, quas consecraverat in domo Domini."
      en: "And Joiada the priest gave to the captains the spears, and the shields, and targets of king David, which he had dedicated in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Constituitque omnem populum tenentium pugiones a parte templi dextra, usque ad partem templi sinistram, coram altari, et templo, per circuitum regis."
      en: "And he set all the people with swords in their hands from the right side of the temple, to the left side of the temple, before the altar, and the temple, round about the king."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et eduxerunt filium regis, et imposuerunt ei diadema, et testimonium, dederuntque in manu ejus tenendam legem, et constituerunt eum regem: unxit quoque illum Jojada pontifex, et filii ejus: imprecatique sunt ei, atque dixerunt: Vivat rex."
      en: "And they brought out the king's son, and put the crown upon him, and the testimony, and gave him the law to hold in his hand, and they made him king: and Joiada the high priest and his sons anointed him: and they prayed for him, and said: God save the king."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quod cum audisset Athalia, vocem scilicet currentium atque laudantium regem, ingressa est ad populum in templum Domini."
      en: "Now when Athalia heard the noise of the people running and praising the king, she came in to the people, into the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cumque vidisset regem stantem super gradum in introitu, et principes, turmasque circa eum, omnemque populum terrae gaudentem, atque clangentem tubis, et diversi generis organis concinentem, vocemque laudantium, scidit vestimenta sua, et ait: Insidiae, insidiae."
      en: "And when she saw the king standing upon the step in the entrance, and the princes, and the companies about him, and all the people of the land rejoicing, and sounding with trumpets, and playing on instruments of divers kinds, and the voice of those that praised, she rent her garments, and said: Treason, treason."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Egressus autem Jojada pontifex ad centuriones, et principes exercitus, dixit eis: Educite illam extra septa templi, et interficiatur foris gladio. Praecepitque sacerdos ne occideretur in domo Domini,"
      en: "And Joiada the high priest going out to the captains, and the chiefs of the army, said to them: Take her forth without the precinct of the temple, and when she is without let her be killed with the sword. For the priest commanded that she should not be killed in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et imposuerunt cervicibus ejus manus: cumque intrasset portam equorum domus regis, interfecerunt eam ibi."
      en: "And they laid hold on her by the neck: and when she was come within the horse gate of the palace, they killed her there."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Pepigit autem Jojada foedus inter se, universumque populum, et regem, ut esset populus Domini."
      en: "And Joiada made a covenant between himself and all the people, and the king, that they should be the people of the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Itaque ingressus est omnis populus domum Baal, et destruxerunt eam: et altaria ac simulacra illius confregerunt: Mathan quoque sacerdotem Baal interfecerunt ante aras."
      en: "And all the people went into the house of Baal, and destroyed it: and they broke down his altars and his idols: and they slew Mathan the priest of Baal before the altars."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Constituit autem Jojada praepositos in domo Domini sub manibus sacerdotum, et Levitarum, quos distribuit David in domo Domini: ut offerrent holocausta Domino, sicut scriptum est in lege Moysi, in gaudio et canticis, juxta dispositionem David."
      en: "And Joiada appointed overseers in the house of the Lord, under the hands of the priests, and the Levites, whom David had distributed in the house of the Lord: to offer holocausts to the Lord, as it is written in the law of Moses, with joy and singing, according to the disposition of David."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Constituit quoque janitores in portis domus Domini, ut non ingrederetur eam immundus in omni re."
      en: "He appointed also porters in the gates of the house of the Lord, that none who was unclean in any thing should enter in."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Assumpsitque centuriones, et fortissimos viros ac principes populi, et omne vulgus terrae, et fecerunt descendere regem de domo Domini, et introire per medium portae superioris in domum regis, et collocaverunt eum in solio regali."
      en: "And he took the captains of hundreds, and the most valiant men, and the chiefs of the people, and all the people of the land, and they brought down the king from the house of the Lord, and brought him through the upper gate into the king's house, and set him on the royal throne."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Laetatusque est omnis populus terrae, et urbs quievit: porro Athalia interfecta est gladio."
      en: "And all the people of the land rejoiced, and the city was quiet: but Athalia was slain with the sword."
    status: { la: verified, en: verified }
