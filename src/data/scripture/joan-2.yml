# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 2
verses:
  - n: 1
    text:
      la: "Et die tertia nuptiae factae sunt in Cana Galilaeae, et erat mater Jesu ibi."
      en: "And the third day, there was a marriage in Cana of Galilee: and the mother of Jesus was there."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Vocatus est autem et Jesus, et discipuli ejus, ad nuptias."
      en: "And Jesus also was invited, and his disciples, to the marriage."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et deficiente vino, dicit mater Jesu ad eum: Vinum non habent."
      en: "And the wine failing, the mother of Jesus saith to him: They have no wine."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dicit ei Jesus: Quid mihi et tibi est, mulier? nondum venit hora mea."
      en: "And Jesus saith to her: Woman, what is that to me and to thee? my hour is not yet come."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dicit mater ejus ministris: Quodcumque dixerit vobis, facite."
      en: "His mother saith to the waiters: Whatsoever he shall say to you, do ye."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Erant autem ibi lapideae hydriae sex positae secundum purificationem Judaeorum, capientes singulae metretas binas vel ternas."
      en: "Now there were set there six waterpots of stone, according to the manner of the purifying of the Jews, containing two or three measures apiece."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dicit eis Jesus: Implete hydrias aqua. Et impleverunt eas usque ad summum."
      en: "Jesus saith to them: Fill the waterpots with water. And they filled them up to the brim."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et dicit eis Jesus: Haurite nunc, et ferte architriclinio. Et tulerunt."
      en: "And Jesus saith to them: Draw out now, and carry to the chief steward of the feast. And they carried it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ut autem gustavit architriclinius aquam vinum factam, et non sciebat unde esset, ministri autem sciebant, qui hauserant aquam: vocat sponsum architriclinius,"
      en: "And when the chief steward had tasted the water made wine, and knew not whence it was, but the waiters knew who had drawn the water; the chief steward calleth the bridegroom,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dicit ei: Omnis homo primum bonum vinum ponit et cum inebriati fuerint, tunc id, quod deterius est. Tu autem servasti bonum vinum usque adhuc."
      en: "And saith to him: Every man at first setteth forth good wine, and when men have well drunk, then that which is worse. But thou hast kept the good wine until now."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Hoc fecit initium signorum Jesus in Cana Galilaeae; et manifestavit gloriam suam, et crediderunt in eum discipuli ejus."
      en: "This beginning of miracles did Jesus in Cana of Galilee; and manifested his glory, and his disciples believed in him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Post hoc descendit Capharnaum ipse, et mater ejus, et fratres ejus, et discipuli ejus: et ibi manserunt non multis diebus."
      en: "After this he went down to Capharnaum, he and his mother, and his brethren, and his disciples: and they remained there not many days."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et prope erat Pascha Judaeorum, et ascendit Jesus Jerosolymam:"
      en: "And the pasch of the Jews was at hand, and Jesus went up to Jerusalem."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et invenit in templo vendentes boves, et oves, et columbas, et numularios sedentes."
      en: "And he found in the temple them that sold oxen and sheep and doves, and the changers of money sitting."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et cum fecisset quasi flagellum de funiculis, omnes ejecit de templo, oves quoque, et boves, et numulariorum effudit aes, et mensas subvertit."
      en: "And when he had made, as it were, a scourge of little cords, he drove them all out of the temple, the sheep also and the oxen, and the money of the changers he poured out, and the tables he overthrew."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et his qui columbas vendebant, dixit: Auferte ista hinc, et nolite facere domum patris mei, domum negotiationis."
      en: "And to them that sold doves he said: Take these things hence, and make not the house of my Father a house of traffic."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Recordati sunt vero discipuli ejus quia scriptum est: Zelus domus tuae comedit me."
      en: "And his disciples remembered, that it was written: The zeal of thy house hath eaten me up."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Responderunt ergo Judaei, et dixerunt ei: Quod signum ostendis nobis, quia haec facis?"
      en: "The Jews, therefore, answered, and said to him: What sign dost thou shew unto us, seeing thou dost these things?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Respondit Jesus, et dixit eis: Solvite templum hoc, et in tribus diebus excitabo illud."
      en: "Jesus answered, and said to them: Destroy this temple, and in three days I will raise it up."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixerunt ergo Judaei: Quadraginta et sex annis aedificatum est templum hoc, et tu in tribus diebus excitabis illud?"
      en: "The Jews then said: Six and forty years was this temple in building; and wilt thou raise it up in three days?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ille autem dicebat de templo corporis sui."
      en: "But he spoke of the temple of his body."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cum ergo resurrexisset a mortuis, recordati sunt discipuli ejus, quia hoc dicebat, et crediderunt scripturae et sermoni quem dixit Jesus."
      en: "When therefore he was risen again from the dead, his disciples remembered, that he had said this, and they believed the scripture, and the word that Jesus had said."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cum autem esset Jerosolymis in Pascha in die festo, multi crediderunt in nomine ejus, videntes signa ejus, quae faciebat."
      en: "Now when he was at Jerusalem, at the pasch, upon the festival day, many believed in his name, seeing his signs which he did."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ipse autem Jesus non credebat semetipsum eis, eo quod ipse nosset omnes,"
      en: "But Jesus did not trust himself unto them, for that he knew all men,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et quia opus ei non erat ut quis testimonium perhiberet de homine: ipse enim sciebat quid esset in homine."
      en: "And because he needed not that any should give testimony of man: for he knew what was in man."
    status: { la: verified, en: verified }
