# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: rom
chapter: 12
verses:
  - n: 1
    text:
      la: "Obsecro itaque vos fratres per misericordiam Dei, ut exhibeatis corpora vestra hostiam viventem, sanctam, Deo placentem, rationabile obsequium vestrum."
      en: "I BESEECH you therefore, brethren, by the mercy of God, that you present your bodies a living sacrifice, holy, pleasing unto God, your reasonable service."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et nolite conformari huic saeculo, sed reformamini in novitate sensus vestri: ut probetis quae sit voluntas Dei bona, et beneplacens, et perfecta."
      en: "And be not conformed to this world; but be reformed in the newness of your mind, that you may prove what is the good, and the acceptable, and the perfect will of God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dico enim per gratiam quae data est mihi, omnibus qui sunt inter vos, non plus sapere quam oportet sapere, sed sapere ad sobrietatem: et unicuique sicut Deus divisit mensuram fidei."
      en: "For I say, by the grace that is given me, to all that are among you, not to be more wise than it behoveth to be wise, but to be wise unto sobriety, and according as God hath divided to every one the measure of faith."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sicut enim in uno corpore multa membra habemus, omnia autem membra non eumdem actum habent:"
      en: "For as in one body we have many members, but all the members have not the same office:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ita multi unum corpus sumus in Christo, singuli autem alter alterius membra."
      en: "So we being many, are one body in Christ, and every one members one of another."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Habentes autem donationes secundum gratiam, quae data est nobis, differentes: sive prophetiam secundum rationem fidei,"
      en: "And having different gifts, according to the grace that is given us, either prophecy, to be used according to the rule of faith;"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sive ministerium in ministrando, sive qui docet in doctrina,"
      en: "Or ministry, in ministering; or he that teacheth, in doctrine;"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "qui exhortatur in exhortando, qui tribuit in simplicitate, qui praeest in sollicitudine, qui miseretur in hilaritate."
      en: "He that exhorteth, in exhorting; he that giveth, with simplicity; he that ruleth, with carefulness; he that sheweth mercy, with cheerfulness."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dilectio sine simulatione: odientes malum, adhaerentes bono:"
      en: "Let love be without dissimulation. Hating that which is evil, cleaving to that which is good."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "caritate fraternitatis invicem diligentes: honore invicem praevenientes:"
      en: "Loving one another with the charity of brotherhood, with honour preventing one another."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sollicitudine non pigri: spiritu ferventes: Domino servientes:"
      en: "In carefulness not slothful. In spirit fervent. Serving the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "spe gaudentes: in tribulatione patientes: orationi instantes:"
      en: "Rejoicing in hope. Patient in tribulation. Instant in prayer."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "necessitatibus sanctorum communicantes: hospitalitatem sectantes."
      en: "Communicating to the necessities of the saints. Pursuing hospitality."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Benedicite persequentibus vos: benedicite, et nolite maledicere."
      en: "Bless them that persecute you: bless, and curse not."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Gaudere cum gaudentibus, flere cum flentibus:"
      en: "Rejoice with them that rejoice; weep with them that weep."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "idipsum invicem sentientes: non alta sapientes, sed humilibus consentientes. Nolite esse prudentes apud vosmetipsos:"
      en: "Being of one mind one towards another. Not minding high things, but consenting to the humble. Be not wise in your own conceits."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nulli malum pro malo reddentes: providentes bona non tantum coram Deo, sed etiam coram omnibus hominibus."
      en: "To no man rendering evil for evil. Providing good things, not only in the sight of God, but also in the sight of all men."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Si fieri potest, quod ex vobis est, cum omnibus hominibus pacem habentes:"
      en: "If it be possible, as much as is in you, have peace with all men."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non vosmetipsos defendentes carissimi, sed date locum irae. Scriptum est enim: Mihi vindicta: ego retribuam, dicit Dominus."
      en: "Revenge not yourselves, my dearly beloved; but give place unto wrath, for it is written: Revenge is mine, I will repay, saith the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sed si esurierit inimicus tuus, ciba illum: si sitit, potum da illi: hoc enim faciens, carbones ignis congeres super caput ejus."
      en: "But if thy enemy be hungry, give him to eat; if he thirst, give him to drink. For, doing this, thou shalt heap coals of fire upon his head."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Noli vinci a malo, sed vince in bono malum."
      en: "Be not overcome by evil, but overcome evil by good."
    status: { la: verified, en: verified }
