# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: apoc
chapter: 13
verses:
  - n: 1
    text:
      la: "et vidi de mare bestiam ascendentem habentem capita septem et cornua decem et super cornua eius decem diademata et super capita eius nomina blasphemiae"
      en: "And I saw a beast coming up out of the sea, having seven heads and ten horns, and upon his horns ten diadems, and upon his heads names of blasphemy."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et bestiam quam vidi similis erat pardo et pedes eius sicut ursi et os eius sicut os leonis et dedit illi draco virtutem suam et potestatem magnam"
      en: "And the beast, which I saw, was like to a leopard, and his feet were as the feet of a bear, and his mouth as the mouth of a lion. And the dragon gave him his own strength, and great power."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et unum de capitibus suis quasi occisum in mortem et plaga mortis eius curata est et admirata est universa terra post bestiam"
      en: "And I saw one of his heads as it were slain to death: and his death's wound was healed. And all the earth was in admiration after the beast."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et adoraverunt draconem quia dedit potestatem bestiae et adoraverunt bestiam dicentes quis similis bestiae et quis poterit pugnare cum ea"
      en: "And they adored the dragon, which gave power to the beast: and they adored the beast, saying: Who is like to the beast? and who shall be able to fight with him?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et datum est ei os loquens magna et blasphemiae et data est illi potestas facere menses quadraginta duo"
      en: "And there was given to him a mouth speaking great things, and blasphemies: and power was given to him to do two and forty months."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et aperuit os suum in blasphemias ad Deum blasphemare nomen eius et tabernaculum eius et eos qui in caelo habitant"
      en: "And he opened his mouth unto blasphemies against God, to blaspheme his name, and his tabernacle, and them that dwell in heaven."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et datum est illi bellum facere cum sanctis et vincere illos et data est ei potestas in omnem tribum et populum et linguam et gentem"
      en: "And it was given unto him to make war with the saints, and to overcome them. And power was given him over every tribe, and people, and tongue, and nation."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et adorabunt eum omnes qui inhabitant terram quorum non sunt scripta nomina in libro vitae agni qui occisus est ab origine mundi"
      en: "And all the dwell upon the earth adored him, whose names are not written in the book of life of the Lamb, which was slain from the beginning of the world."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "si quis habet aurem audiat"
      en: "If any man have an ear, let him hear."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui in captivitatem in captivitatem vadit qui in gladio occiderit oportet eum gladio occidi hic est patientia et fides sanctorum"
      en: "He that shall lead into captivity, shall go into captivity: he that shall kill by the sword, must be killed by the sword. Here is the patience and the faith of the saints."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et vidi aliam bestiam ascendentem de terra et habebat cornua duo similia agni et loquebatur sicut draco"
      en: "And I saw another beast coming up out of the earth, and he had two horns, like a lamb, and he spoke as a dragon."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et potestatem prioris bestiae omnem faciebat in conspectu eius et facit terram et inhabitantes in eam adorare bestiam primam cuius curata est plaga mortis"
      en: "And he executed all the power of the former beast in his sight; and he caused the earth, and them that dwell therein, to adore the first beast, whose wound to death was healed."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et fecit signa magna ut etiam ignem faceret de caelo descendere in terram in conspectu hominum"
      en: "And he did great signs, so that he made also fire to come down from heaven unto the earth in the sight of men."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et seducit habitantes terram propter signa quae data sunt illi facere in conspectu bestiae dicens habitantibus in terra ut faciant imaginem bestiae quae habet plagam gladii et vixit"
      en: "And he seduced them that dwell on the earth, for the signs, which were given him to do in the sight of the beast, saying to them that dwell on the earth, that they should make the image of the beast, which had the wound by the sword, and lived."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et datum est illi ut daret spiritum imagini bestiae ut et loquatur imago bestiae et faciat quicumque non adoraverint imaginem bestiae occidantur"
      en: "And it was given him to give life to the image of the beast, and that the image of the beast should speak; and should cause, that whosoever will not adore the image of the beast, should be slain."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et faciet omnes pusillos et magnos et divites et pauperes et liberos et servos habere caracter in dextera manu aut in frontibus suis"
      en: "And he shall make all, both little and great, rich and poor, freemen and bondmen, to have a character in their right hand, or on their foreheads."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ne quis possit emere aut vendere nisi qui habet caracter nomen bestiae aut numerum nominis eius"
      en: "And that no man might buy or sell, but he that hath the character, or the name of the beast, or the number of his name."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "hic sapientia est qui habet intellectum conputet numerum bestiae numerus enim hominis est et numerus eius est sescenti sexaginta sex"
      en: "Here is wisdom. He that hath understanding, let him count the number of the beast. For it is the number of a man: and the number of him is six hundred sixty-six."
    status: { la: verified, en: verified }
