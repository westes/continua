book: ezek
chapter: 18
verses:
  - n: 1
    text:
      la: "et factus est sermo Domini ad me dicens"
      en: "And the word of the Lord came to me, saying: What is the meaning?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quid est quod inter vos parabolam vertitis in proverbium istud in terra Israhel dicentes patres comederunt uvam acerbam et dentes filiorum obstupescunt"
      en: "That you use among you this parable as a proverb in the land of Israel, saying: The fathers have eaten sour grapes, and the teeth of the children are set on edge."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "vivo ego dicit Dominus Deus si erit vobis ultra parabola haec in proverbium in Israhel"
      en: "As I live, saith the Lord God, this parable shall be no more to you a proverb in Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ecce omnes animae meae sunt ut anima patris ita et anima filii mea est anima quae peccaverit ipsa morietur"
      en: "Behold all souls are mine: as the soul of the father, so also the soul of the son is mine: the soul that sinneth, the same shall die."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et vir si fuerit iustus et fecerit iudicium et iustitiam"
      en: "And if a man be just, and do judgment and justice,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in montibus non comederit et oculos suos non levaverit ad idola domus Israhel et uxorem proximi sui non violaverit et ad mulierem menstruatam non accesserit"
      en: "And hath not eaten upon the mountains, nor lifted up his eyes to the idols of the house of Israel: and hath not defiled his neighbour's wife, nor come near to a menstruous woman:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et hominem non contristaverit pignus debitori reddiderit per vim nihil rapuerit panem suum esurienti dederit et nudum operuerit vestimento"
      en: "And hath not wronged any man: but hath restored the pledge to the debtor, hath taken nothing away by violence: hath given his bread to the hungry, and hath covered the naked with a garment:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ad usuram non commodaverit et amplius non acceperit ab iniquitate averterit manum suam iudicium verum fecerit inter virum et virum"
      en: "Hath not lent upon usury, nor taken any increase: hath withdrawn his hand from iniquity, and hath executed true judgment between man and man:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in praeceptis meis ambulaverit et iudicia mea custodierit ut faciat veritatem hic iustus est vita vivet ait Dominus Deus"
      en: "Hath walked in my commandments, and kept my judgments, to do truth: he is just, he shall surely live, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quod si genuerit filium latronem effundentem sanguinem et fecerit unum de istis"
      en: "And if he beget a son that is a robber, a shedder of blood, and that hath done some one of these things:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et haec quidem omnia non facientem sed in montibus comedentem et uxorem proximi sui polluentem"
      en: "Though he doth not all these things, but that eateth upon the mountains, and that defileth his neighbour's wife:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "egenum et pauperem contristantem rapientem rapinas pignus non reddentem et ad idola levantem oculos suos abominationem facientem"
      en: "That grieveth the needy and the poor, that taketh away by violence, that restoreth not the pledge, and that lifteth up his eyes to idols, that committeth abomination:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ad usuram dantem et amplius accipientem numquid vivet non vivet cum universa detestanda haec fecerit morte morietur sanguis eius in ipso erit"
      en: "That giveth upon usury, and that taketh an increase: shall such a one live? he shall not live. Seeing he hath done all these detestable things, he shall surely die, his blood shall be upon him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quod si genuerit filium qui videns omnia peccata patris sui quae fecit timuerit et non fecerit simile eis"
      en: "But if he beget a son, who, seeing all his father's sine, which he hath done, is afraid, and shall not do the like to them :"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "super montes non comederit et oculos suos non levaverit ad idola domus Israhel et uxorem proximi sui non violaverit"
      en: "That hath not eaten upon the mountains, nor lifted up his eyes to the idols of the house of Israel, and hath not defiled his neighbour's wife:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et virum non contristaverit pignus non retinuerit et rapinam non rapuerit panem suum esurienti dederit et nudum operuerit vestimento"
      en: "And hath not grieved any man, nor withholden the pledge, nor taken away with violence, but hath given his bread to the hungry, and covered the naked with a garment:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "a pauperis iniuria averterit manum suam usuram et superabundantiam non acceperit iudicia mea fecerit in praeceptis meis ambulaverit hic non morietur in iniquitate patris sui sed vita vivet"
      en: "That hath turned away his hand from injuring the poor, hath not taken usury and increase, but hath executed my judgments, and hath walked in my commandments: this man shall not die for the iniquity of his father, but living he shall live."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "pater eius quia calumniatus est et vim fecit fratri et malum operatus est in medio populi sui ecce mortuus est in iniquitate sua"
      en: "As for his father, because he oppressed and offered violence to his brother, and wrought evil in the midst of his people, behold he is dead in his own iniquity."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dicitis quare non portavit filius iniquitatem patris videlicet quia filius iudicium et iustitiam operatus est omnia praecepta mea custodivit et fecit illa vita vivet"
      en: "And you say: Why hath not the son borne the iniquity of his father? Verily, because the son hath wrought judgment and justice, hath kept all my commandments, and done them, living, he shall live."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "anima quae peccaverit ipsa morietur filius non portabit iniquitatem patris et pater non portabit iniquitatem filii iustitia iusti super eum erit et impietas impii erit super eum"
      en: "The soul that sinneth, the same shall die: the son shall not bear the iniquity of the father, and the father shall not bear the iniquity of the son: the justice of the just shall be upon him, and the wickedness of the wicked shall be upon him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "si autem impius egerit paenitentiam ab omnibus peccatis suis quae operatus est et custodierit universa praecepta mea et fecerit iudicium et iustitiam vita vivet non morietur"
      en: "But if the wicked do penance for all his sins which he hath committed, and keep all my commandments, and do judgment, and justice, living he shall live, and shall not die."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "omnium iniquitatum eius quas operatus est non recordabor in iustitia sua quam operatus est vivet"
      en: "I will not remember all his iniquities that he hath done: in his justice which he hath wrought, he shall live."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "numquid voluntatis meae est mors impii dicit Dominus Deus et non ut convertatur a viis suis et vivat"
      en: "Is it my will that a sinner should die, saith the Lord God, and not that he should be converted from his ways, and live?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "si autem averterit se iustus a iustitia sua et fecerit iniquitatem secundum omnes abominationes quas operari solet impius numquid vivet omnes iustitiae eius quas fecerat non recordabuntur in praevaricatione qua praevaricatus est et in peccato suo quod peccavit in ipsis morietur"
      en: "But if the just man turn himself away from his justice, and do iniquity according to all the abominations which the wicked man useth to work, shall he live? all his justices which he hath done, shall not be remembered: in the prevarication, by which he hath prevaricated, and in his sin, which he hath committed, in them he shall die."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et dixistis non est aequa via Domini audite domus Israhel numquid via mea non est aequa et non magis viae vestrae pravae sunt"
      en: "And you have said: The way of the Lord is not right. Hear ye, therefore, O house of Israel: Is it my way that is not right, and are not rather your ways perverse?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cum enim averterit se iustus a iustitia sua et fecerit iniquitatem morietur in eis in iniustitia quam operatus est morietur"
      en: "For when the just turneth himself away from his justice, and committeth iniquity, he shall die therein: in the injustice that he hath wrought he shall die."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et cum averterit se impius ab impietate sua quam operatus est et fecerit iudicium et iustitiam ipse animam suam vivificabit"
      en: "And when the wicked turneth himself away from his wickedness, which he hath wrought, and doeth judgment, and justice: he shall save his soul alive."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "considerans enim et avertens se ab omnibus iniquitatibus suis quas operatus est vita vivet et non morietur"
      en: "Because he considereth and turneth away himself from all his iniquities which he hath wrought, he shall surely live, and not die."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et dicunt filii Israhel non est aequa via Domini numquid viae meae non sunt aequae domus Israhel et non magis viae vestrae pravae"
      en: "And the children of Israel say: The way of the Lord is not right. Are not my ways right, O house of Israel, and are not rather your ways perverse?"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "idcirco unumquemque iuxta vias suas iudicabo domus Israhel ait Dominus Deus convertimini et agite paenitentiam ab omnibus iniquitatibus vestris et non erit vobis in ruinam iniquitas"
      en: "Therefore will I judge every man according to his ways, O house of Israel, saith the Lord God. Be converted, and do penance for all your iniquities: and iniquity shall not be your ruin."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "proicite a vobis omnes praevaricationes vestras in quibus praevaricati estis et facite vobis cor novum et spiritum novum et quare moriemini domus Israhel"
      en: "Cast away from you all your transgressions, by which you have transgressed, and make to yourselves a new heart, and a new spirit: and why will you die, O house of Israel?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quia nolo mortem morientis dicit Dominus Deus revertimini et vivite"
      en: "For I desire not the death of him that dieth, saith the Lord God, return ye and live."
    status: { la: verified, en: verified }
