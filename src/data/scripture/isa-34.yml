# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 34
verses:
  - n: 1
    text:
      la: "Accedite, gentes, et audite; et populi, attendite: audiat terra, et plenitudo ejus; orbis, et omne germen ejus."
      en: "Come near, ye Gentiles, and hear, and hearken, ye people: let the earth hear, and all that is therein, the world, and every thing that cometh forth of it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quia indignatio Domini super omnes gentes, et furor super universam militiam eorum: interfecit eos, et dedit eos in occisionem."
      en: "For the indignation of the Lord is upon all nations, and his fury upon all their armies: he hath killed them, and delivered them to slaughter."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Interfecti eorum projicientur, et de cadaveribus eorum ascendet foetor; tabescent montes a sanguine eorum."
      en: "Their slain shall be cast forth, and out of their carcasses shall rise a stink: the mountains shall be melted with their blood."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et tabescet omnis militia caelorum, et complicabuntur sicut liber caeli: et omnis militia eorum defluet, sicut defluit folium de vinea et de ficu."
      en: "And all the host of the heavens shall pine away, and the heavens shall be folded together as a book: and all their host shall fall down as the leaf falleth from the vine, and from the fig tree."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quoniam inebriatus est in caelo gladius meus; ecce super Idumaeam descendet, et super populum interfectionis meae, ad judicium."
      en: "For my sword is inebriated in heaven: behold it shall come down upon Idumea, and upon the people of my slaughter unto judgment."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Gladius Domini repletus est sanguine, incrassatus est adipe, de sanguine agnorum et hircorum, de sanguine medullatorum arietum: victima enim Domini in Bosra, et interfectio magna in terra Edom."
      en: "The sword of the Lord is filled with blood, it is made thick with the blood of lambs and buck goats, with the blood of rams full of marrow: for there is a victim of the Lord in Bosra and a great slaughter in the land of Edom."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et descendent unicornes cum eis, et tauri cum potentibus; inebriabitur terra eorum sanguine, et humus eorum adipe pinguium."
      en: "And the unicorns shall go down with them, and the bulls with the mighty: their land shall be soaked with blood, and their ground with the fat of fat ones."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quia dies ultionis Domini, annus retributionum judicii Sion."
      en: "For it is the day of the vengeance of the Lord, the year of recompenses of the judgment of Sion."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et convertentur torrentes ejus in picem, et humus ejus in sulphur; et erit terra ejus in picem ardentem."
      en: "And the streams thereof shall be turned into pitch, and the ground thereof into brimstone: and the land thereof shall become burning pitch."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nocte et die non extinguetur, in sempiternum ascendet fumus ejus, a generatione in generationem desolabitur, in saecula saeculorum non erit transiens per eam."
      en: "Night and day it shall not be quenched, the smoke thereof shall go up for ever: from generation to generation it shall lie waste, none shall pass through it for ever and ever."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et possidebunt illam onocrotalus et ericius; ibis et corvus habitabunt in ea: et extendetur super eam mensura, ut redigatur ad nihilum, et perpendiculum in desolationem."
      en: "The bittern and ericius shall possess it: and the ibis and the raven shall dwell in it: and a line shall be stretched out upon it, to bring it to nothing, and a plummet, unto desolation."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nobiles ejus non erunt ibi; regem potius invocabunt, et omnes principes ejus erunt in nihilum."
      en: "The nobles thereof shall not be there: they shall call rather upon the king, and all the princes thereof shall be nothing."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et orientur in domibus ejus spinae et urticae, et paliurus in munitionibus ejus; et erit cubile draconum, et pascua struthionum."
      en: "And thorns and nettles shall grow up in its houses, and the thistle in the fortresses thereof: and it shall be the habitation of dragons, and the pasture of ostriches."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et occurrent daemonia onocentauris, et pilosus clamabit alter ad alterum; ibi cubavit lamia, et invenit sibi requiem."
      en: "And demons and monsters shall meet, and the hairy ones shall cry out one to another, there hath the lamia lain down, and found rest for herself."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ibi habuit foveam ericius, et enutrivit catulos, et circumfodit, et fovit in umbra ejus; illuc congregati sunt milvi, alter ad alterum."
      en: "There hath the ericius had its hole, and brought up its young ones, and hath dug round about, and cherished them in the shadow thereof: thither are the kites gathered together one to another."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Requirite diligenter in libro Domini, et legite: Unum ex eis non defuit, alter alterum non quaesivit; quia quod ex ore meo procedit, ille mandavit, et spiritus ejus ipse congregavit ea."
      en: "Search ye diligently in the book of the Lord, and read: not one of them was wanting, one hath not sought for the other: for that which proceedeth out of my mouth, he hath commanded, and his spirit it hath gathered them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ipse misit eis sortem, et manus ejus divisit eam illis in mensuram: usque in aeternum possidebunt eam; in generationem et generationem habitabunt in ea."
      en: "And he hath cast the lot for them, and his hand hath divided it to them by line: they shall possess it for ever, from generation to generation they shall dwell therein."
    status: { la: verified, en: verified }
