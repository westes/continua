# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 27
verses:
  - n: 1
    text:
      la: "Propter inopiam multi deliquerunt: et qui quaerit locupletari avertit oculum suum."
      en: "Through poverty many have sinned: and he that seeketh to be enriched, turneth away his eye."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sicut in medio compaginis lapidum palus figitur, sic et inter medium venditionis et emptionis angustiabitur peccatum:"
      en: "As a stake sticketh fast in the midst of the joining of stones, so also in the midst of selling and buying, sin shall stick fast."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "conteretur cum delinquente delictum."
      en: "Sin shall be destroyed with the sinner."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Si non in timore Domini tenueris te instanter, cito subvertetur domus tua."
      en: "Unless thou hold thyself diligently in the fear of the Lord, thy house shall quickly be overthrown."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sicut in percussura cribri remanebit pulvis, sic aporia hominis in cogitatu illius."
      en: "As when one sifteth with a sieve, the dust will remain: so will the perplexity of a man in his thoughts."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Vasa figuli probat fornax, et homines justos tentatio tribulationis."
      en: "The furnace trieth the potter's vessels, and the trial of affliction just men."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sicut rusticatio de ligno ostendit fructum illius, sic verbum ex cogitatu cordis hominis."
      en: "As the dressing of a tree sheweth the fruit thereof, so a word out of the thought of the heart of man."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ante sermonem non laudes virum: haec enim tentatio est hominum."
      en: "Praise not a man before he speaketh, for this is the trial of men."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si sequaris justitiam, apprehendes illam, et indues quasi poderem honoris: et inhabitabis cum ea, et proteget te in sempiternum, et in die agnitionis invenies firmamentum."
      en: "If thou followest justice, thou shalt obtain her: and shalt put her on as a long robe of honour, and thou shalt dwell with her: and she shall protect thee for ever, and in the day of acknowledgment thou shalt find a strong foundation."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Volatilia ad sibi similia conveniunt: et veritas ad eos qui operantur illam revertetur."
      en: "Birds resort unto their like: so truth will return to them that practise her."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Leo venationi insidiatur semper: sic peccata operantibus iniquitates."
      en: "The lion always lieth in wait for prey: so do sins for them that work iniquities."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Homo sanctus in sapientia manet sicut sol: nam stultus sicut luna mutatur."
      en: "A holy man continueth in wisdom as the sun: but a fool is changed as the moon."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In medio insensatorum serva verbum tempori: in medio autem cogitantium assiduus esto."
      en: "In the midst of the unwise keep in the word till its time: but be continually among men that think."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Narratio peccantium odiosa, et risus illorum in deliciis peccati."
      en: "The discourse of sinners is hateful, and their laughter is at the pleasures of sin."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Loquela multum jurans horripilationem capiti statuet, et irreverentia ipsius obturatio aurium."
      en: "The speech that sweareth much shall make the hair of the head stand upright: and its irreverence shall make one stop his ears."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Effusio sanguinis in rixa superborum, et maledictio illorum auditus gravis."
      en: "In the quarrels of the proud is the shedding of blood: and their cursing is a grievous hearing."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Qui denudat arcana amici fidem perdit, et non inveniet amicum ad animum suum."
      en: "He that discloseth the secret of a friend loseth his credit, and shall never find a friend to his mind."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dilige proximum, et conjungere fide cum illo."
      en: "Love thy neighbour, and be joined to him with fidelity."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quod si denudaveris absconsa illius, non persequeris post eum."
      en: "But if thou discover his secrets, follow no more after him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sicut enim homo qui perdit amicum suum, sic et qui perdit amicitiam proximi sui."
      en: "For as a man that destroyeth his friend, so also is he that destroyeth the friendship of his neighbour."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et sicut qui dimittit avem de manu sua, sic dereliquisti proximum tuum, et non eum capies."
      en: "And as one that letteth a bird go out of his hand, so hast thou let thy neighbour go, and thou shalt not get him again."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non illum sequaris, quoniam longe abest: effugit enim quasi caprea de laqueo, quoniam vulnerata est anima ejus:"
      en: "Follow after him no more, for he is gone afar off, he is fled, as a roe escaped out of the snare: because his soul is wounded."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ultra eum non poteris colligare. Et maledicti est concordatio:"
      en: "Thou canst no more bind him up. And of a curse there is reconciliation:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "denudare autem amici mysteria, desperatio est animae infelicis."
      en: "But to disclose the secrets of a friend, leaveth no hope to an unhappy soul."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Annuens oculo fabricat iniqua, et nemo eum abjiciet."
      en: "He that winketh with the eye forgeth wicked things, and no man will cast him off:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "In conspectu oculorum tuorum condulcabit os suum, et super sermones tuos admirabitur: novissime autem pervertet os suum, et in verbis tuis dabit scandalum."
      en: "In the sight of thy eyes he will sweeten his mouth, and will admire thy words: but at the last he will writhe his mouth, and on thy words he will lay a stumblingblock."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Multa odivi, et non coaequavi ei, et Dominus odiet illum."
      en: "I have hated many things, but not like him, and the Lord will hate him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Qui in altum mittit lapidem, super caput ejus cadet: et plaga dolosa dolosi dividet vulnera."
      en: "If one cast a stone on high, it will fall upon his own head: and the deceitful stroke will wound the deceitful."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et qui foveam fodit incidet in eam: et qui statuit lapidem proximo offendet in eo: et qui laqueum alii ponit, peribit in illo."
      en: "He that diggeth a pit, shall fall into it: and he that setteth a stone for his neighbour, shall stumble upon it: and he that layeth a snare for another, shall perish in it."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Facienti nequissimum consilium, super ipsum devolvetur, et non agnoscet unde adveniat illi."
      en: "A mischievous counsel shall be rolled back upon the author, and he shall not know from whence it cometh to him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Illusio et improperium superborum, et vindicta sicut leo insidiabitur illi."
      en: "Mockery and reproach are of the proud, and vengeance as a lion shall lie in wait for him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Laqueo peribunt qui oblectantur casu justorum, dolor autem consumet illos antequam moriantur."
      en: "They shall perish in a snare that are delighted with the fall of the just: and sorrow shall consume them before they die."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ira et furor utraque execrabilia sunt, et vir peccator continens erit illorum."
      en: "Anger and fury are both of them abominable, and the sinful man shall be subject to them."
    status: { la: verified, en: verified }
