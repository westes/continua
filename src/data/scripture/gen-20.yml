book: gen
chapter: 20
verses:
  - n: 1
    text:
      la: "profectus inde Abraham in terram australem habitavit inter Cades et Sur et peregrinatus est in Geraris"
      en: "Abraham removed from thence to the south country, and dwelt between Cedes and Sur, and sojourned in Gerara."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque de Sarra uxore sua soror mea est misit ergo Abimelech rex Gerarae et tulit eam"
      en: "And he said of Sara his wife: She is my sister. So Abimelech the king of Oerara sent, and took her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "venit autem Deus ad Abimelech per somnium noctis et ait ei en morieris propter mulierem quam tulisti habet enim virum"
      en: "And God came to Abimelech in a dream by night, and he said to him: Lo thou shalt die for the woman thou hast taken: for she hath a husband."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Abimelech vero non tetigerat eam et ait Domine num gentem ignorantem et iustam interficies"
      en: "Now Abimelech had not touched her, and he said : Lord, wilt thou slay a nation, that is ignorant and justl"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nonne ipse dixit mihi soror mea est et ipsa ait frater meus est in simplicitate cordis mei et munditia manuum mearum feci hoc"
      en: "Did not he say to me : She is my sister: and she say, He is my brother? in the simplicity of my heart, and cleanness of my hands have I done this."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixitque ad eum Deus et ego scio quod simplici corde feceris et ideo custodivi te ne peccares in me et non dimisi ut tangeres eam"
      en: "And God said to him: And I know that thou didst it with a sincere heart: and therefore I withheld thee from sinning against me, and I suffered thee not to touch her."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nunc igitur redde uxorem viro suo quia propheta est et orabit pro te et vives si autem nolueris reddere scito quod morte morieris tu et omnia quae tua sunt"
      en: "Now therefore restore the man his wife, for he is a prophet: and he shall pray for thee, and thou shalt live: but if thou wilt not restore her, know that thou shalt surely die, thou and all that are thins."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "statimque de nocte consurgens Abimelech vocavit omnes servos suos et locutus est universa verba haec in auribus eorum timueruntque omnes viri valde"
      en: "And Abimelech forthwith rising up in the night, called all his servants: and spoke all these words in their hearing, and all the men were exceedingly afraid."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "vocavit autem Abimelech etiam Abraham et dixit ei quid fecisti nobis quid peccavimus in te quia induxisti super me et super regnum meum peccatum grande quae non debuisti facere fecisti nobis"
      en: "And Abimelech called also for Abraham, and said to him: What hast thou done to us? what have we offended thee in, that thou hast brought upon me and upon my kingdom a great sin? thou hast done to us what thou oughtest not to do."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "rursusque expostulans ait quid vidisti ut hoc faceres"
      en: "And again he expostulated with him, and said, What sawest thou, that thou hast done this?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "respondit Abraham cogitavi mecum dicens forsitan non est timor Dei in loco isto et interficient me propter uxorem meam"
      en: "Abraham answered: I thought with myself, saying: Perhaps there is not the fear of God in this place: and they will kill me for the sake of my wife:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "alias autem et vere soror mea est filia patris mei et non filia matris meae et duxi eam uxorem"
      en: "Howbeit, otherwise also she is truly my sister, the daughter of my father, and not the daughter of my mother, and I took her to wife."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "postquam autem eduxit me Deus de domo patris mei dixi ad eam hanc misericordiam facies mecum in omni loco ad quem ingrediemur dices quod frater tuus sim"
      en: "And after God brought me out of my father's house, I said to her: I Thou shalt do me this kindness: In every place, to which we shall come, thou shalt say that I am thy brother."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tulit igitur Abimelech oves et boves et servos et ancillas et dedit Abraham reddiditque illi Sarram uxorem suam"
      en: "And Abimelech took sheep and oxen, and servants and handmaids, and gave to Abraham: and restored to him Sara, his wife."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ait terra coram vobis est ubicumque tibi placuerit habita"
      en: "And said: The land is before you, dwell wheresoever it shall please thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sarrae autem dixit ecce mille argenteos dedi fratri tuo hoc erit tibi in velamen oculorum ad omnes qui tecum sunt et quocumque perrexeris mementoque te deprehensam"
      en: "And to Sara he said: Behold I have given thy brother a thousand pieces of silver: this shall serve thee for a covering of thy eyes to all that are with thee, and whithersoever thou shalt go: and remember thou wast taken."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "orante autem Abraham sanavit Deus Abimelech et uxorem ancillasque eius et pepererunt"
      en: "And when Abraham prayed, God healed Abimelech and his wife, and his handmaids, and they bore children:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "concluserat enim Deus omnem vulvam domus Abimelech propter Sarram uxorem Abraham"
      en: "For the Lord had closed up every womb of the house of Abimelech on ac- count of Sara, Abraham's wife."
    status: { la: verified, en: verified }
