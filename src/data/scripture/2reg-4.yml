# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 4
verses:
  - n: 1
    text:
      la: "Audivit autem Isboseth filius Saul quod cecidisset Abner in Hebron: et dissolutae sunt manus ejus, omnisque Israel perturbatus est."
      en: "And Isboseth the son of Saul heard that Abner was slain in Hebron: and his hands were weakened, and all Israel was troubled."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Duo autem viri principes latronum erant filio Saul, nomen uni Baana, et nomen alteri Rechab, filii Remmon Berothitae de filiis Benjamin: siquidem et Beroth reputata est in Benjamin."
      en: "Now the son of Saul had two men captains of his bands, the name of the one was Baana, and the name of the other Rechab, the sons of Remmon a Berothite of the children of Benjamin: for Beroth also was reckoned in Benjamin."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et fugerunt Berothitae in Gethaim, fueruntque ibi advenae usque ad tempus illud."
      en: "And the Berothites fled into Gethaim, and were sojourners there until that time."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Erat autem Jonathae filio Saul filius debilis pedibus: quinquennis enim fuit, quando venit nuntius de Saul et Jonatha ex Jezrahel. Tollens itaque eum nutrix sua, fugit: cumque festinaret ut fugeret, cecidit, et claudus effectus est: habuitque vocabulum Miphiboseth."
      en: "And Jonathan the son of Saul had a son that was lame of his feet: for he was five years old when the tidings came of Saul and Jonathan from Jezrahel. And his nurse took him up and fled: and as she made haste to flee, he fell and became lame: and his name was Miphiboseth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Venientes igitur filii Remmon Berothitae, Rechab et Baana, ingressi sunt fervente die domum Isboseth: qui dormiebat super stratum suum meridie. Et ostiaria domus purgans triticum, obdormivit."
      en: "And the sons of Remmon the Berothite, Rechab and Baana coming, went into the house of Isboseth in the heat of the day: and he was sleeping upon his bed at noon. And the doorkeeper of the house, who was cleansing wheat, was fallen asleep."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ingressi sunt autem domum latenter assumentes spicas tritici, et percusserunt eum in inguine Rechab et Baana frater ejus, et fugerunt."
      en: "And they entered into the house secretly taking ears of corn, and Rechab and Baana his brother stabbed him in the groin, and fled away."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum autem ingressi fuissent domum, ille dormiebat super lectum suum in conclavi, et percutientes interfecerunt eum: sublatoque capite ejus, abierunt per viam deserti tota nocte,"
      en: "For when they came into the house, he was sleeping upon his bed in a parlour, and they struck him and killed him: and taking away his head they went off by the way of the wilderness, walking all night."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et attulerunt caput Isboseth ad David in Hebron: dixeruntque ad regem: Ecce caput Isboseth filii Saul inimici tui, qui quaerebat animam tuam: et dedit Dominus domino meo regi ultionem hodie de Saul, et de semine ejus."
      en: "And they brought the head of Isboseth to David to Hebron: and they said to the king: Behold the head of Isboseth the son of Saul thy enemy who sought thy life: and the Lord hath revenged my lord the king this day of Saul, and of his seed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Respondens autem David Rechab, et Baana fratri ejus, filiis Remmon Berothitae, dixit ad eos: Vivit Dominus, qui eruit animam meam de omni angustia,"
      en: "But David answered Rechab, and Baana his brother, the sons of Remmon the Berothite, and said to them: As the Lord liveth, who hath delivered my soul out of all distress,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quoniam eum, qui annuntiaverat mihi, et dixerat: Mortuus est Saul: qui putabat se prospera nuntiare, tenui, et occidi eum in Siceleg, cui oportebat mercedem dare pro nuntio."
      en: "The man that told me, and said: Saul is dead, who thought he brought good tidings, I apprehended, and slew him in Siceleg, who should have been rewarded for his news."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quanto magis nunc cum homines impii interfecerunt virum innoxium in domo sua, super lectum suum, non quaeram sanguinem ejus de manu vestra, et auferam vos de terra?"
      en: "How much more now when wicked men have slain an innocent man in his own house, upon his bed, shall I not require his blood at your hand, and take you away from the earth?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Praecepit itaque David pueris suis, et interfecerunt eos: praecidentesque manus et pedes eorum, suspenderunt eos super piscinam in Hebron: caput autem Isboseth tulerunt, et sepelierunt in sepulchro Abner in Hebron."
      en: "And David commanded his servants and they slew them: and cutting off their hands and feet, hanged them up over the pool in Hebron: but the head of Isboseth they took and buried in the sepulchre of Abner in Hebron."
    status: { la: verified, en: verified }
