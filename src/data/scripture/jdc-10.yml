book: jdc
chapter: 10
verses:
  - n: 1
    text:
      la: "post Abimelech surrexit dux in Israhel Thola filius Phoa patrui Abimelech vir de Isachar qui habitavit in Sanir montis Ephraim"
      en: "After Abimelech there arose a ruler in Israel, Thola son of Phua the uncle of Abimelech, a man of Issachar, who dwelt in Samir of mount Ephraim:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et iudicavit Israhel viginti et tribus annis mortuusque ac sepultus est in Sanir"
      en: "And he judged Israel three and twenty years, and he died and was buried in Samir."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "huic successit Iair Galaadites qui iudicavit Israhel per viginti et duos annos"
      en: "To him succeeded Jair the Galaadite, who judged Israel for two and twenty years."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "habens triginta filios sedentes super triginta pullos asinarum et principes triginta civitatum quae ex nomine eius appellatae sunt Avothiair id est oppida Iair usque in praesentem diem in terra Galaad"
      en: "Having thirty sons that rode on thirty ass colts, and were princes of thirty cities, which from his name were called Havoth Jair, that is, the towns of Jair, until this present day in the land of Galaad."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "mortuusque est Iair ac sepultus in loco cui est vocabulum Camon"
      en: "And Jair died: and was buried in the place which was called Camon."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "filii autem Israhel peccatis veteribus iungentes nova fecerunt malum in conspectu Domini et servierunt idolis Baalim et Astharoth et diis Syriae ac Sidonis et Moab et filiorum Ammon et Philisthim dimiseruntque Dominum et non colebant eum"
      en: "But the children of Israel, adding new sins to their old ones, did evil in the sight of the Lord, and served idols, Baalim and Astaroth, and the gods of Syria and of Sidon and of Moab and of the children of Ammon and of the Philistines: and they left the Lord, and did not serve him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "contra quos iratus tradidit eos in manu Philisthim et filiorum Ammon"
      en: "And the Lord being angry with them, delivered them into the hands of the Philistines and of the children of Ammon."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "adflictique sunt et vehementer oppressi per annos decem et octo omnes qui habitabant trans Iordanem in terra Amorrei quae est in Galaad"
      en: "And they were afflicted, and grievously oppressed for eighteen years, all they that dwelt beyond the Jordan in the land of the Amorrhite, who is in Galaad:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in tantum ut filii Ammon Iordane transmisso vastarent Iudam et Beniamin et Ephraim adflictusque est Israhel nimis"
      en: "Insomuch that the children of Ammon passing over the Jordan, wasted Juda and Benjamin and Ephraim: and Israel was distressed exceedingly."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et clamantes ad Dominum dixerunt peccavimus tibi quia dereliquimus Deum nostrum et servivimus Baalim"
      en: "And they cried to the Lord, and said: We have sinned against thee, because we have forsaken the Lord our God, and have served Baalim."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quibus locutus est Dominus numquid non Aegyptii et Amorrei filiique Ammon et Philisthim"
      en: "And the Lord said to them: Did not the Egyptians and the Amorrhites, and the children of Ammon and the Philistines,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sidonii quoque et Amalech et Chanaan oppresserunt vos et clamastis ad me et erui vos de manu eorum"
      en: "The Sidonians also and Amalec and Chanaan oppress you, and you cried to me, and I delivered you out of their hand?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et tamen reliquistis me et coluistis deos alienos idcirco non addam ut ultra vos liberem"
      en: "And yet you have forsaken me, and have worshipped strange gods: therefore I will deliver you no more:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ite et invocate deos quos elegistis ipsi vos liberent in tempore angustiae"
      en: "Go and call upon the gods which you have chosen: let them deliver you in the time of distress."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixeruntque filii Israhel ad Dominum peccavimus redde tu nobis quicquid tibi placet tantum nunc libera nos"
      en: "And the children of Israel said to the Lord: We have sinned, do thou unto us whatsoever pleaseth thee: only deliver us this time."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quae dicentes omnia de finibus suis alienorum deorum idola proiecerunt et servierunt Deo qui doluit super miseriis eorum"
      en: "And saying these things, they cast away out of their coasts all the idols of strange gods and served the Lord their God: and he was touched with their miseries."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "itaque filii Ammon conclamantes in Galaad fixere tentoria contra quos congregati filii Israhel in Maspha castrametati sunt"
      en: "And the children of Ammon shouting together, pitched their tents in Galaad: against whom the children of Israel assembled themselves together and camped in Maspha."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dixeruntque principes Galaad singuli ad proximos suos qui primus e nobis contra filios Ammon coeperit dimicare erit dux populi Galaad"
      en: "And the princes of Galaad said one to another: Whosoever of us shall first begin to fight against the children of Ammon, he shall be the leader of the people of Galaad."
    status: { la: verified, en: verified }
