# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: soph
chapter: 1
verses:
  - n: 1
    text:
      la: "verbum Domini quod factum est ad Sofoniam filium Chusi filium Godoliae filii Amariae filii Ezechiae in diebus Iosiae filii Amon regis Iuda"
      en: "The word of the Lord that came to Sophonias the son of Chusi, the son of Godolias, the son of Amarias, the son of Ezechias, in the days of Josias the son of Amon king of Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "congregans congregabo omnia a facie terrae dicit Dominus"
      en: "Gathering, I will gather together all things from off the face of the land, saith the Lord:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "congregans hominem et pecus congregans volatile caeli et pisces maris et ruinae impiorum erunt et disperdam homines a facie terrae dicit Dominus"
      en: "I will gather man, and beast, I will gather the birds of the air, and the fishes of the sea: and the ungodly shall meet with ruin: and I will destroy men from off the face of the land, saith the Lord."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et extendam manum meam super Iudam et super omnes habitantes Hierusalem et disperdam de loco hoc reliquias Baal et nomina aedituorum cum sacerdotibus"
      en: "And I will stretch out my hand upon Juda, and upon all the inhabitants of Jerusalem: and I will destroy out of this place the remnant of Baal, and the names of the wardens of the temples with the priests:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et eos qui adorant super tecta militiam caeli et adorant et iurant in Domino et iurant in Melchom"
      en: "And them that worship the host of heaven upon the tops of houses, and them that adore, and swear by the Lord, and swear by Melchom."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et qui avertuntur de post tergum Domini et qui non quaesierunt Dominum nec investigaverunt eum"
      en: "And them that turn away from following after the Lord, and that have not sought the Lord, nor searched after him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "silete a facie Domini Dei quia iuxta est dies Domini quia praeparavit Dominus hostiam sanctificavit vocatos suos"
      en: "Be silent before the face of the Lord God: for the day of the Lord is near, for the Lord hath prepared a victim, he hath sanctified his guests."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et erit in die hostiae Domini visitabo super principes et super filios regis et super omnes qui induti sunt veste peregrina"
      en: "And it shall come to pass in the day of the victim of the Lord, that I will visit upon the princes, and upon the king's sons, and upon all such as are clothed with strange apparel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et visitabo omnem qui arroganter ingreditur super limen in die illa qui conplent domum Domini Dei sui iniquitate et dolo"
      en: "And I will visit in that day upon every one that entereth arrogantly over the threshold: them that fill the house of the Lord their God with iniquity and deceit."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et erit in die illa dicit Dominus vox clamoris a porta Piscium et ululatus a secunda et contritio magna a collibus"
      en: "And there shall be in that day, saith the Lord, the noise of a cry from the fish gate, and a howling from the Second, and a great destruction from the hills."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ululate habitatores pilae conticuit omnis populus Chanaan disperierunt omnes involuti argento"
      en: "Howl, ye inhabitants of the Morter. All the people of Chanaan is hush, all are cut off that were wrapped up in silver."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et erit in tempore illo scrutabor Hierusalem in lucernis et visitabo super viros defixos in fecibus suis qui dicunt in cordibus suis non faciet bene Dominus et non faciet male"
      en: "And it shall come to pass at that time, that I will search Jerusalem with lamps, and will visit upon the men that are settled on their lees: that say in their hearts: The Lord will not do good, nor will he do evil."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et erit fortitudo eorum in direptionem et domus eorum in desertum et aedificabunt domos et non habitabunt et plantabunt vineas et non bibent vinum earum"
      en: "And their strength shall become a booty, and their houses as a desert: and they shall build houses, and shall not dwell in them: and they shall plant vineyards, and shall not drink the wine of them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "iuxta est dies Domini magnus iuxta et velox nimis vox diei Domini amara tribulabitur ibi fortis"
      en: "The great day of the Lord is near, it is near and exceeding swift: the voice of the day of the Lord is bitter, the mighty man shall there meet with tribulation."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dies irae dies illa dies tribulationis et angustiae dies calamitatis et miseriae dies tenebrarum et caliginis dies nebulae et turbinis"
      en: "That day is a day of wrath, a day of tribulation and distress, a day of calamity and misery, a day of darkness and obscurity, a day of clouds and whirlwinds,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dies tubae et clangoris super civitates munitas et super angulos excelsos"
      en: "A day of the trumpet and alarm against the fenced cities, and against the high bulwarks."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et tribulabo homines et ambulabunt ut caeci quia Domino peccaverunt et effundetur sanguis eorum sicut humus et corpus eorum sicut stercora"
      en: "And I will distress men, and they shall walk like blind men, because they have sinned against the Lord: and their blood shall be poured out as earth, and their bodies as dung."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed et argentum eorum et aurum eorum non poterit liberare eos in die irae Domini in igne zeli eius devorabitur omnis terra quia consummationem cum festinatione faciet cunctis habitantibus terram"
      en: "Neither shall their silver and their gold be able to deliver them in the day of the wrath of the Lord: all the land shall be devoured by the fire of his jealousy, for he shall make even a speedy destruction of all them that dwell in the land."
    status: { la: verified, en: verified }
