# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 11
verses:
  - n: 1
    text:
      la: "Venit autem Roboam in Jerusalem, et convocavit universam domum Juda et Benjamin, centum octoginta millia electorum atque bellantium, ut dimicaret contra Israel, et converteret ad se regnum suum."
      en: "And Roboam came to Jerusalem, and called together all the house of Juda and of Benjamin, a hundred and fourscore thousand chosen men and warriors, to fight against Israel, and to bring back his kingdom to him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Factusque est sermo Domini ad Semeiam hominem Dei, dicens:"
      en: "And the word of the Lord came to Semeias the man of God, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Loquere ad Roboam filium Salomonis regem Juda, et ad universum Israel, qui est in Juda et Benjamin:"
      en: "Speak to Roboam the son of Solomon the king of Juda, and to all Israel, in Juda and Benjamin:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Haec dicit Dominus: Non ascendetis, neque pugnabitis contra fratres vestros: revertatur unusquisque in domum suam, quia mea hoc gestum est voluntate. Qui cum audissent sermonem Domini, reversi sunt, nec perrexerunt contra Jeroboam."
      en: "Thus saith the Lord: You shall not go up, nor fight against your brethren: let every man return to his own house, for by my will this thing has been done. And when they heard the word of the Lord, they returned, and did not go against Jeroboam,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Habitavit autem Roboam in Jerusalem, et aedificavit civitates muratas in Juda."
      en: "And Roboam dwelt in Jerusalem, and built walled cities in Juda."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Exstruxitque Bethlehem, et Etam, et Thecue,"
      en: "And he built Bethlehem, and Etam, and Thecue,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Bethsur quoque, et Socho, et Odollam,"
      en: "And Bethsur, and Socho, and Odollam,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "necnon et Geth, et Maresa, et Ziph,"
      en: "And Geth, and Maresa, and Ziph,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sed et Aduram, et Lachis, et Azeca,"
      en: "And Aduram, and Lachis, and Azecha,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Saraa quoque, et Ajalon, et Hebron, quae erant in Juda et Benjamin, civitates munitissimas."
      en: "Saraa also, and Aialon, and Hebron, which are in Juda and Benjamin, well fenced cities."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque clausisset eas muris, posuit in eis principes, ciborumque horrea, hoc est, olei, et vini."
      en: "And when he had enclosed them with walls, he put in them governors and storehouses of provisions, that is, of oil and of wine."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sed et in singulis urbibus fecit armamentarium scutorum et hastarum, firmavitque eas summa diligentia, et imperavit super Judam et Benjamin."
      en: "Moreover in every city he made an armoury of shields and spears, and he fortified them with great diligence, and he reigned over Juda, and Benjamin,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sacerdotes autem et Levitae, qui erant in universo Israel, venerunt ad eum de cunctis sedibus suis,"
      en: "And the priests and Levites, that were in all Israel, came to him out of all their seats,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "relinquentes suburbana, et possessiones suas, et transeuntes ad Judam et Jerusalem: eo quod abjecisset eos Jeroboam, et posteri ejus, ne sacerdotio Domini fungerentur."
      en: "Leaving their suburbs, and their possessions, and passing over to Juda, and Jerusalem, because Jeroboam and his sons had cast them off, from executing the priestly office to the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Qui constituit sibi sacerdotes excelsorum, et daemoniorum, vitulorumque quos fecerat."
      en: "And he made to himself priests for the high places, and for the devils, and for the calves which he had made."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sed et de cunctis tribubus Israel, quicumque dederant cor suum ut quaererent Dominum Deum Israel, venerunt in Jerusalem ad immolandum victimas suas coram Domino Deo patrum suorum."
      en: "Moreover out of all the tribes of Israel, whosoever gave their heart to seek the Lord the God of Israel, came into Jerusalem to sacrifice their victims before the Lord the God of their fathers."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et roboraverunt regnum Juda, et confirmaverunt Roboam filium Salomonis per tres annos: ambulaverunt enim in viis David et Salomonis, annis tantum tribus."
      en: "And they strengthened the kingdom of Juda, and established Roboam the son of Solomon for three years: for they walked in the ways of David and of Solomon, only three years."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Duxit autem Roboam uxorem Mahalath filiam Jerimoth filii David: Abihail quoque filiam Eliab filii Isai,"
      en: "And Roboam took to wife Mahalath, the daughter of Jerimoth the son of David: and Abihail the daughter of Eliab the son of Isai."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quae peperit ei filios Jehus, et Somoriam, et Zoom."
      en: "And they bore him sons Jehus, and Somorias, and Zoom."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Post hanc quoque accepit Maacha filiam Absalom, quae peperit ei Abia, et Ethai, et Ziza, et Salomith."
      en: "And after her he married Maacha the daughter of Absalom, who bore him Abia and Ethai, and Ziza, and Salomith."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Amavit autem Roboam Maacha filiam Absalom super omnes uxores suas et concubinas: nam uxores decem et octo duxerat, concubinas autem sexaginta: et genuit viginti octo filios, et sexaginta filias."
      en: "And Roboam loved Maacha the daughter of Absalom above all his wives, and concubines: for he had married eighteen wives, and threescore concubines: and he beget eight and twenty sons, and threescore daughters."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Constituit vero in capite, Abiam filium Maacha ducem super omnes fratres suos: ipsum enim regem facere cogitabat,"
      en: "But he put at the head of them Abia the son of Maacha to be the chief ruler over all his brethren: for he meant to make him king,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quia sapientior fuit, et potentior super omnes filios ejus, et in cunctis finibus Juda, et Benjamin, et in universis civitatibus muratis: praebuitque eis escas plurimas, et multas petivit uxores."
      en: "Because he was wiser and mightier than all his sons, and in all the countries of Juda, and of Benjamin, and in all the walled cities: and he gave them provisions in abundance, and he sought many wives."
    status: { la: verified, en: verified }
