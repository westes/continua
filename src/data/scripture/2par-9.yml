book: 2par
chapter: 9
verses:
  - n: 1
    text:
      la: "regina quoque Saba cum audisset famam Salomonis venit ut temptaret eum enigmatibus in Hierusalem cum magnis opibus et camelis qui portabant aromata et auri plurimum gemmasque pretiosas cumque venisset ad Salomonem locuta est ei quaecumque erant in corde suo"
      en: "And when the queen of Saba heard of the fame of Solomon, she came to try him with hard questions at Jerusalem, with great riches, and camels, which carried spices, and abundance of gold, and precious stones. And when she was come to Solomon, she proposed to him all that was in her heart."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et exposuit ei Salomon omnia quae proposuerat nec quicquam fuit quod ei non perspicuum fecerit"
      en: "And Solomon explained to her all that she proposed: and there was not any thing that he did not make clear unto her."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quod postquam vidit sapientiam scilicet Salomonis et domum quam aedificaverat"
      en: "And when she had seen these things, to wit, the wisdom of Solomon, and the house which he had built,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "necnon cibaria mensae eius et habitacula servorum et officia ministrorum eius et vestimenta eorum pincernas quoque et vestes eorum et victimas quas immolabat in domo Domini non erat prae stupore ultra in ea spiritus"
      en: "And the meats of his table, and the dwelling places of his servants, and the attendance of his officers, and their apparel, his cupbearers also, and their garments, and the victims which he offered in the house of the Lord: there was no more spirit in her, she was so astonished."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dixitque ad regem verus sermo quem audieram in terra mea de virtutibus et sapientia tua"
      en: "And she add to the king: The word is true which I heard in my country of thy virtues and wisdom."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non credebam narrantibus donec ipsa venissem et vidissent oculi mei et probassem vix medietatem mihi sapientiae tuae fuisse narratam vicisti famam virtutibus tuis"
      en: "I did not believe them that told it, until I came, and my eyes had seen, and I had proved that scarce one half of thy wisdom had been told me: thou hast exceeded the same with thy virtues."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "beati viri tui et beati servi tui hii qui adsistunt coram te in omni tempore et audiunt sapientiam tuam"
      en: "Happy are thy men, and happy are thy servants, who stand always before thee, and hear thy wisdom."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sit Dominus Deus tuus benedictus qui voluit te ordinare super thronum suum regem Domini Dei tui quia diligit Deus Israhel et vult servare eum in aeternum idcirco posuit te super eum regem ut facias iudicia atque iustitiam"
      en: "Blessed be the Lord thy God, who hath been pleased to set thee on his throne, king of the Lord thy God. Because God loveth Israel, and will preserve them for ever: therefore hath he made thee king over them, to do judgment and justice."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dedit autem regi centum viginti talenta auri et aromata multa nimis et gemmas pretiosissimas non fuerunt aromata talia ut haec quae dedit regina Saba regi Salomoni"
      en: "And she gave to the king a hundred and twenty talents of gold, and spices in great abundance, and most precious stones: there were no such spices as these which the queen of Saba gave to king Solomon."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sed et servi Hiram cum servis Salomonis adtulerunt aurum de Ophir et ligna thyina et gemmas pretiosissimas"
      en: "And the servants also of Hiram, with the servants of Solomon, brought gold from Ophir, and thyine trees, and most precious stones:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "de quibus fecit rex de lignis scilicet thyinis gradus in domo Domini et in domo regia citharas quoque et psalteria cantoribus numquam visa sunt in terra Iuda ligna talia"
      en: "And the king made of the thyine trees stairs in the house of the Lord, and in the king's house, and harps and psalteries for the singing men: never were there seen such trees in the land of Juda."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "rex autem Salomon dedit reginae Saba cuncta quae voluit et quae postulavit multo plura quam adtulerat ad eum quae reversa abiit in terram suam cum servis suis"
      en: "And king Solomon gave to the queen of Saba all that she desired, and that she asked, and many more things than she brought to him: so she returned, and went to her own country with her servants."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "erat autem pondus auri quod adferebatur Salomoni per annos singulos sescenta sexaginta sex talenta auri"
      en: "And the weight of the gold, that was brought to Solomon every year, was six hundred and sixty-six talents of gold:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "excepta ea summa quam legati diversarum gentium et negotiatores adferre consueverant omnesque reges Arabiae et satrapae terrarum qui conportabant aurum et argentum Salomoni"
      en: "Beside the sum which the deputies of divers nations, and the merchants were accustomed to bring, and all the kings of Arabia, and the lords of the lands, who I brought gold and silver to Solomon."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "fecit igitur rex Salomon ducentas hastas aureas de summa sescentorum aureorum qui in hastis singulis expendebantur"
      en: "And king Solomon made two hundred golden spears, of the sum of six hundred pieces of gold, which went to every spear:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "trecenta quoque scuta aurea trecentorum aureorum quibus tegebantur scuta singula posuitque ea rex in armamentario quod erat consitum nemore"
      en: "And three hundred golden shields of three hundred pieces of gold, which went to the covering of every shield: and the king put them in the armoury, which was compassed with a wood."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "fecit quoque rex solium eburneum grande et vestivit illud auro mundissimo"
      en: "The king also made a great throne of ivory, and overlaid it with pure gold."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sexque gradus quibus ascendebatur ad solium et scabillum aureum et brachiola duo altrinsecus et duos leones stantes iuxta brachiola"
      en: "And six steps to go up to the throne, and a footstool of gold, and two arms one on either side, and two lions standing by the arms:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "sed et alios duodecim leunculos stantes super sex gradus ex utraque parte non fuit tale solium in universis regnis"
      en: "Moreover twelve other little lions standing upon the steps on both sides: there was not such a throne in any kingdom."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "omnia quoque vasa convivii regis erant aurea et vasa domus saltus Libani ex auro purissimo argentum enim in diebus illis pro nihilo reputabatur"
      en: "And all the vessels of the king's table were of gold, and the vessels of the house of the forest of Libanus were of the purest gold. For no account was made of silver in those days."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "siquidem naves regis ibant in Tharsis cum servis Hiram semel in annis tribus et deferebant inde aurum et argentum et ebur et simias et pavos"
      en: "For the king's ships went to Tharsis with the servants of Hiram, once in three years: and they brought thence gold and silver, and ivory, and apes, and peacocks."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "magnificatus est igitur Salomon super omnes reges terrae divitiis et gloria"
      en: "And Solomon was magnified above all the kings of the earth for riches and glory."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "omnesque reges terrarum desiderabant faciem videre Salomonis ut audirent sapientiam quam dederat Deus in corde eius"
      en: "And all the kings of the earth desired to see the face of Solomon, that they might hear the wisdom which God had given in his heart."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et deferebant ei munera vasa argentea et aurea et vestes et arma et aromata equos et mulos per singulos annos"
      en: "And every year they brought him presents, vessels of silver and of gold, and garments, and armour, and spices, and horses, and mules."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "habuit quoque Salomon quadraginta milia equorum in stabulis et curruum equitumque duodecim milia constituitque eos in urbibus quadrigarum et ubi erat rex in Hierusalem"
      en: "And Solomon had forty thousand horses in the stables, and twelve thousand chariots, and horsemen, and he placed them in the cities of the chariots, and where the king was in Jerusalem."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "exercuit etiam potestatem super cunctos reges a fluvio Eufraten usque ad terram Philisthinorum id est usque ad terminos Aegypti"
      en: "And he exercised authority over all the kings from the river Euphrates to the land of the Philistines, and to the borders of Egypt."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "tantamque copiam praebuit argenti in Hierusalem quasi lapidum et cedrorum tantam multitudinem velut sycaminorum quae gignuntur in campestribus"
      en: "And he made silver as plentiful in Jerusalem as stones: and cedars as common as the sycamores, which grow in the plains."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "adducebantur autem ei equi de Aegypto cunctisque regionibus"
      en: "And horses were brought to him out of Egypt, and out of all countries."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "reliqua vero operum Salomonis priorum et novissimorum scripta sunt in verbis Nathan prophetae et in libris Ahiae Silonitis in visione quoque Iaddo videntis contra Hieroboam filium Nabath"
      en: "Now the rest of the acts of Solomon first and last are written in the words of Nathan the prophet, and in the boobs of Ahias the Silonite, and in the vision of Addo the seer, against Jeroboam the son of Nabat."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "regnavit autem Salomon in Hierusalem super omnem Israhel quadraginta annis"
      en: "And Solomon reigned in Jerusalem over all Israel forty years."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "dormivitque cum patribus suis et sepelierunt eum in civitate David regnavitque pro eo Roboam filius eius"
      en: "And he slept d with his fathers: and they buried him in the city of David: and Roboam his son reigned in his stead"
    status: { la: verified, en: verified }
