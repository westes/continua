# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 10
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fac tibi duas tubas argenteas ductiles, quibus convocare possis multitudinem quando movenda sunt castra."
      en: "Make thee two trumpets of beaten silver, wherewith thou mayest call together the multitude when the camp is to be removed."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cumque increpueris tubis, congregabitur ad te omnis turba ad ostium tabernaculi foederis."
      en: "And when thou shalt sound the trumpets, all the multitude shall gather unto thee to the door of the tabernacle of the covenant."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Si semel clangueris, venient ad te principes, et capita multitudinis Israel."
      en: "If thou sound but once, the princes and the heads of the multitude of Israel shall come to thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Si autem prolixior atque concisus clangor increpuerit, movebunt castra primi qui sunt ad orientalem plagam."
      en: "But if the sound of the trumpets be longer, and with interruptions, they that are on the east side, shall first go forward."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In secundo autem sonitu et pari ululatu tubae, levabunt tentoria qui habitant ad meridiem; et juxta hunc modum reliqui facient, ululantibus tubis in profectionem."
      en: "And at the second sounding and like noise of the trumpet, they who lie on the south side shall take up their tents. And after this manner shall the rest do, when the trumpets shall sound for a march."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quando autem congregandus est populus, simplex tubarum clangor erit, et non concise ululabunt."
      en: "But when the people is to be gathered together, the sound of the trumpets shall be plain, and they shall not make a broken sound."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Filii autem Aaron sacerdotes clangent tubis: eritque hoc legitimum sempiternum in generationibus vestris."
      en: "And the sons of Aaron the priest shall sound the trumpets: and this shall be an ordinance for ever in your generations."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si exieritis ad bellum de terra vestra contra hostes qui dimicant adversum vos, clangetis ululantibus tubis, et erit recordatio vestri coram Domino Deo vestro, ut eruamini de manibus inimicorum vestrorum."
      en: "If you go forth to war out of your land against the enemies that fight against you, you shall sound aloud with the trumpets, and there shall be a remembrance of you before the Lord your God, that you may be delivered out of the hands of your enemies."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Siquando habebitis epulum, et dies festos, et calendas, canetis tubis super holocaustis, et pacificis victimis, ut sint vobis in recordationem Dei vestri. Ego Dominus Deus vester."
      en: "If at any time you shall have a banquet, and on your festival days, and on the first days of your months, you shall sound the trumpets over the holocausts, and the sacrifices of peace offerings, that they may be to you for a remembrance of your God. I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Anno secundo, mense secundo, vigesima die mensis, elevata est nubes de tabernaculo foederis:"
      en: "The second year, in the second month, the twentieth day of the month, the cloud was taken up from the tabernacle of the covenant."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "profectique sunt filii Israel per turmas suas de deserto Sinai, et recubuit nubes in solitudine Pharan."
      en: "And the children of Israel marched by their troops from the desert of Sinai, and the cloud rested in the wilderness of Pharan."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Moveruntque castra primi juxta imperium Domini in manu Moysi."
      en: "And the first went forward according to the commandment of the Lord by the hand of Moses."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Filii Juda per turmas suas: quorum princeps erat Nahasson filius Aminadab."
      en: "The sons of Juda by their troops: whose prince was Nahasson the son of Aminadab."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "In tribu filiorum Issachar fuit princeps Nathanael filius Suar."
      en: "In the tribe of the sons of Issachar, the prince was Nathanael the son of Suar."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "In tribu Zabulon erat princeps Eliab filius Helon."
      en: "In the tribe of Zabulon, the prince was Eliab the son of Helon."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Depositumque est tabernaculum, quod portantes egressi sunt filii Gerson et Merari."
      en: "And the tabernacle was taken down, and the sons of Gerson and Merari set forward, bearing it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Profectique sunt et filii Ruben, per turmas et ordinem suum: quorum princeps erat Helisur filius Sedeur."
      en: "And the sons of Ruben also marched, by their troops and ranks, whose prince was Helisur the son of Sedeur."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "In tribu autem filiorum Simeon, princeps fuit Salamiel filius Surisaddai."
      en: "And in the tribe of Simeon, the prince was Salamiel the son of Surisaddai."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Porro in tribu Gad erat princeps Eliasaph filius Duel."
      en: "And in the tribe of Gad, the prince was Eliasaph the son of Duel."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Profectique sunt et Caathitae portantes sanctuarium. Tamdiu tabernaculum portabatur, donec venirent ad erectionis locum."
      en: "Then the Caathites also marched carrying the sanctuary. So long was the tabernacle carried, till they came to the place of setting it up."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Moverunt castra et filii Ephraim per turmas suas, in quorum exercitu princeps erat Elisama filius Ammiud."
      en: "The sons of Ephraim also moved their camp by their troops, in whose army the prince was Elisama the son of Ammiud."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "In tribu autem filiorum Manasse princeps fuit Gamaliel filius Phadassur."
      en: "And in the tribe of the sons of Manasses, the prince was Gamaliel the son of Phadassur."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et in tribu Benjamin erat dux Abidan filius Gedeonis."
      en: "And in the tribe of Benjamin, the prince was Abidan the son of Gedeon."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Novissimi castrorum omnium profecti sunt filii Dan per turmas suas, in quorum exercitu princeps fuit Ahiezer filius Ammisaddai."
      en: "The last of all the camp marched the sons of Dan by their troops, in whose army the prince was Ahiezer the son of Ammisaddai."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "In tribu autem filiorum Aser erat princeps Phegiel filius Ochran."
      en: "And in the tribe of the sons of Aser, the prince was Phegiel the son of Ochran."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et in tribu filiorum Nephthali princeps fuit Ahira filius Enan."
      en: "And in the tribe of the sons of Nephtali, the prince was Ahira the son of Enan."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Haec sunt castra, et profectiones filiorum Israel per turmas suas quando egrediebantur."
      en: "This was the order of the camps, and marches of the children of Israel by their troops, when they set forward."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Dixitque Moyses Hobab filio Raguel Madianitae, cognato suo: Proficiscimur ad locum quem Dominus daturus est nobis: veni nobiscum, ut benefaciamus tibi, quia Dominus bona promisit Israeli."
      en: "And Moses said to Hobab the son of Raguel the Madianite, his kinsman: We are going towards the place which the Lord will give us: come with us, that we may do thee good: for the Lord hath promised good things to Israel."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Cui ille respondit: Non vadam tecum, sed revertar in terram meam, in qua natus sum."
      en: "But he answered him: I will not go with thee, but I will return to my country, wherein I was born."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et ille: Noli, inquit, nos relinquere: tu enim nosti in quibus locis per desertum castra ponere debeamus, et eris ductor noster."
      en: "And he said: Do not leave us: for thou knowest in what places we should encamp in the wilderness, and thou shalt be our guide."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Cumque nobiscum veneris, quidquid optimum fuerit ex opibus, quas nobis traditurus est Dominus, dabimus tibi."
      en: "And if thou comest with us, we will give thee what is the best of the riches which the Lord shall deliver to us."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Profecti sunt ergo de monte Domini viam trium dierum, arcaque foederis Domini praecedebat eos, per dies tres providens castrorum locum."
      en: "So they marched from the mount of the Lord three days' journey, and the ark of the covenant of the Lord went before them, for three days providing a place for the camp."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Nubes quoque Domini super eos erat per diem cum incederent."
      en: "The cloud also of the Lord was over them by day when they marched."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Cumque elevaretur arca, dicebat Moyses: Surge, Domine, et dissipentur inimici tui, et fugiant qui oderunt te, a facie tua."
      en: "And when the ark was lifted up, Moses said: Arise, O Lord, and let thy enemies be scattered, and let them that hate thee, flee from before thy face."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Cum autem deponeretur, aiebat: Revertere, Domine, ad multitudinem exercitus Israel."
      en: "And when it was set down, he said: Return, O Lord, to the multitude of the host of Israel."
    status: { la: verified, en: verified }
