# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: heb
chapter: 5
verses:
  - n: 1
    text:
      la: "Omnis namque pontifex ex hominibus assumptus, pro hominibus constituitur in iis quae sunt ad Deum, ut offerat dona, et sacrificia pro peccatis:"
      en: "For every high priest taken from among men, is ordained for men in the things that appertain to God, that he may offer up gifts and sacrifices for sins:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui condolere possit iis qui ignorant et errant: quoniam et ipse circumdatus est infirmitate:"
      en: "Who can have compassion on them that are ignorant and that err: because he himself also is compassed with infirmity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et propterea debet, quemadmodum pro populo, ita etiam et pro semetipso offerre pro peccatis."
      en: "And therefore he ought, as for the people, so also for himself, to offer for sins."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nec quisquam sumit sibi honorem, sed qui vocatur a Deo, tamquam Aaron."
      en: "Neither doth any man take the honour to himself, but he that is called by God, as Aaron was."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sic et Christus non semetipsum clarificavit ut pontifex fieret: sed qui locutus est ad eum: Filius meus es tu, ego hodie genui te."
      en: "So Christ also did not glorify himself, that he might be made a high priest: but he that said unto him: Thou art my Son, this day have I begotten thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quemadmodum et in alio loco dicit: Tu es sacerdos in aeternum, secundum ordinem Melchisedech."
      en: "As he saith also in another place: Thou art a priest for ever, according to the order of Melchisedech."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui in diebus carnis suae preces, supplicationesque ad eum qui possit illum salvum facere a morte cum clamore valido, et lacrimis offerens, exauditus est pro sua reverentia."
      en: "Who in the days of his flesh, with a strong cry and tears, offering up prayers and supplications to him that was able to save him from death, was heard for his reverence."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et quidem cum esset Filius Dei, didicit ex iis, quae passus est, obedientiam:"
      en: "And whereas indeed he was the Son of God, he learned obedience by the things which he suffered:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et consummatus, factus est omnibus obtemperantibus sibi, causa salutis aeternae,"
      en: "And being consummated, he became, to all that obey him, the cause of eternal salvation."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "appellatus a Deo pontifex juxta ordinem Melchisedech."
      en: "Called by God a high priest according to the order of Melchisedech."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "De quo nobis grandis sermo, et ininterpretabilis ad dicendum: quoniam imbecilles facti estis ad audiendum."
      en: "Of whom we have much to say, and hard to be intelligibly uttered: because you are become weak to hear."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Etenim cum deberetis magistri esse propter tempus, rursum indigetis ut vos doceamini quae sint elementa exordii sermonum Dei: et facti estis quibus lacte opus sit, non solido cibo."
      en: "For whereas for the time you ought to be masters, you have need to be taught again what are the first elements of the words of God: and you are become such as have need of milk, and not of strong meat."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Omnis enim, qui lactis est particeps, expers est sermonis justitiae: parvulus enim est."
      en: "For every one that is a partaker of milk, is unskillful in the word of justice: for he is a little child."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Perfectorum autem est solidus cibus: eorum, qui pro consuetudine exercitatos habent sensus ad discretionem boni ac mali."
      en: "But strong meat is for the perfect; for them who by custom have their senses exercised to the discerning of good and evil."
    status: { la: verified, en: verified }
