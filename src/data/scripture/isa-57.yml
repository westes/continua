# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 57
verses:
  - n: 1
    text:
      la: "Justus perit, et non est qui recogitet in corde suo; et viri misericordiae colliguntur, quia non est qui intelligat, a facie enim malitiae collectus est justus."
      en: "The just perisheth, and no man layeth it to heart, and men of mercy are taken away, because there is none that understandeth; for the just man is taken away from before the face of evil."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Veniat pax, requiescat in cubili suo qui ambulavit in directione sua."
      en: "Let peace come, let him rest in his bed that hath walked in his uprightness."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Vos autem accedite huc, filii auguratricis, semen adulteri et fornicariae."
      en: "But draw near hither, you sons of the sorceress, the seed of the adulterer, and of the harlot."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Super quem lusistis? super quem dilatastis os, et ejecistis linguam? Numquid non vos filii scelesti, semen mendax,"
      en: "Upon whom have you jested? upon whom have you opened your mouth wide, and put out your tongue? are not you wicked children, a false seed,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui consolamini in diis subter omne lignum frondosum; immolantes parvulos in torrentibus, subter eminentes petras?"
      en: "Who seek your comfort in idols under every green tree, sacrificing children in the torrents, under the high rocks?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In partibus torrentis pars tua, haec est sors tua; et ipsis effudisti libamen, obtulisti sacrificium. Numquid super his non indignabor?"
      en: "In the parts of the torrent is thy portion, this is thy lot: and thou hast poured out libations to them, thou hast offered sacrifice. Shall I not be angry at these things?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Super montem excelsum et sublimem posuisti cubile tuum, et illuc ascendisti ut immolares hostias."
      en: "Upon a high and lofty mountain thou hast laid thy bed, and hast gone up thither to offer victims."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et post ostium, et retro postem, posuisti memoriale tuum. Quia juxta me discooperuisti, et suscepisti adulterum, dilatasti cubile tuum; et pepigisti cum eis foedus; dilexisti stratum eorum manu aperta."
      en: "And behind the door, and behind the post thou hast set up thy remembrance: for thou hast discovered thyself near me, and hast received an adulterer: thou hast enlarged thy bed, and made a covenant with them: thou hast loved their bed with open hand."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ornasti te regi unguento, et multiplicasti pigmenta tua. Misisti legatos tuos procul, et humiliata es usque ad inferos."
      en: "And thou hast adorned thyself for the king with ointment, and hast multiplied thy perfumes. Thou hast sent thy messengers far off, and wast debased even to hell."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "In multitudine viae tuae laborasti; non dixisti: Quiescam. Vitam manus tuae invenisti; propterea non rogasti."
      en: "Thou hast been wearied in the multitude of thy ways: yet thou saidst not: I will rest: thou hast found life of thy hand, therefore thou hast not asked."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Pro quo sollicita timuisti, quia mentita es, et mei non es recordata, neque cogitasti in corde tuo? Quia ego tacens et quasi non videns, et mei oblita es."
      en: "For whom hast thou been solicitous and afraid, that thou hast lied, and hast not been mindful of me, nor thought on me in thy heart? for I am silent, and as one that seeth not, and thou hast forgotten me."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ego annuntiabo justitiam tuam, et opera tua non proderunt tibi."
      en: "I will declare thy justice, and thy works shall not profit thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cum clamaveris, liberent te congregati tui, et omnes eos auferet ventus, tollet aura. Qui autem fiduciam habet mei, haereditabit terram, et possidebit montem sanctum meum."
      en: "When thou shalt cry, let thy companies deliver thee, but the wind shall carry them all off, a breeze shall take them away, but he that putteth his trust in me, shall inherit the land, and shall possess my holy mount."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et dicam: Viam facite, praebete iter; declinate de semita, auferte offendicula de via populi mei."
      en: "And I will say: Make a way: give free passage, turn out of the path, take away the stumblingblocks out of the way of my people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quia haec dicit Excelsus, et Sublimis, habitans aeternitatem, et sanctum nomen ejus, in excelso et in sancto habitans, et cum contrito et humili spiritu: ut vivificet spiritum humilium, et vivificet cor contritorum."
      en: "For thus saith the High and the Eminent that inhabiteth eternity: and his name is Holy, who dwelleth in the high and holy place, and with a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non enim in sempiternum litigabo, neque usque ad finem irascar, quia spiritus a facie mea egredietur, et flatus ego faciam."
      en: "For I will not contend for ever, neither will I be angry unto the end: because the spirit shall go forth from my face, and breathings I will make."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Propter iniquitatem avaritiae ejus iratus sum, et percussi eum. Abscondi a te faciem meam, et indignatus sum; et abiit vagus in via cordis sui."
      en: "For the iniquity of his covetousness I was angry, and I struck him: I hid my face from thee, and was angry: and he went away wandering in his own heart."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vias ejus vidi, et sanavi eum; et reduxi eum, et reddidi consolationes ipsi, et lugentibus ejus."
      en: "I saw his ways, and I healed him, and brought him back, and restored comforts to him, and to them that mourn for him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Creavi fructum labiorum pacem; pacem ei qui longe est et qui prope, dixit Dominus, et sanavi eum."
      en: "I created the fruit of the lips, peace, peace to him that is far off, and to him that is near, said the Lord, and I healed him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Impii autem quasi mare fervens, quod quiescere non potest, et redundant fluctus ejus in conculcationem et lutum."
      en: "But the wicked are like the raging sea, which cannot rest, and the waves thereof cast up dirt and mire."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Non est pax impiis, dicit Dominus Deus."
      en: "There is no peace to the wicked, saith the Lord God."
    status: { la: verified, en: verified }
