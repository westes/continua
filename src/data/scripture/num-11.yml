# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 11
verses:
  - n: 1
    text:
      la: "Interea ortum est murmur populi, quasi dolentium pro labore, contra Dominum. Quod cum audisset Dominus, iratus est. Et accensus in eos ignis Domini, devoravit extremam castrorum partem."
      en: "In the mean time there arose a murmuring of the people against the Lord, as it were repining at their fatigue. And when the Lord heard it he was angry. And the fire of the Lord being kindled against them, devoured them that were at the uttermost part of the camp."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cumque clamasset populus ad Moysen, oravit Moyses ad Dominum, et absorptus est ignis."
      en: "And when the people cried to Moses, Moses prayed to the Lord, and the fire was swallowed up."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Vocavitque nomen illius, Incensio: eo quod incesus fuisset contra eos ignis Domini."
      en: "And he called the name of that place, The burning: for that the fire of the Lord had been kindled against them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vulgus quippe promiscuum, quod ascenderat cum eis, flagravit desiderio, sedens et flens, junctis sibi pariter filiis Israel, et ait: Quis dabit nobis ad vescendum carnes?"
      en: "For a mixt multitude of people, that came up with them, burned with desire, sitting and weeping, the children of Israel also being joined with them, and said: Who shall give us flesh to eat?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "recordamur piscium quos comedebamus in Aegypto gratis: in mentem nobis veniunt cucumeres, et pepones, porrique, et caepe, et allia."
      en: "We remember the fish that we ate in Egypt free cost: the cucumbers come into our mind, and the melons, and the leeks, and the onions, and the garlic."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Anima nostra arida est: nihil aliud respiciunt oculi nostri nisi man."
      en: "Our soul is dry, our eyes behold nothing else but manna."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Erat autem man quasi semen coriandri, coloris bdellii."
      en: "A Now the manna was like coriander seed, of the colour of bdellium."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Circuibatque populus, et colligens illud, frangebat mola, sive terebat in mortario, coquens in olla, et faciens ex eo tortulas saporis quasi panis oleati."
      en: "And the people went about, and gathering it, ground it in a mill, or beat it in a mortar, and boiled it in a pot, and made cakes thereof of the taste of bread tempered with oil."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cumque descederet nocte super castra ros, descendebat pariter et man."
      en: "And when the dew fell in the night upon the camp, the manna also fell with it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Audivit ergo Moyses flentem populum per familias, singulos per ostia tentorii sui. Iratusque est furor Domini valde: sed et Moysi intoleranda res visa est,"
      en: "Now Moses heard the people weeping by their families, every one at the door of his tent. And the wrath of the Lord was exceedingly enkindled: to Moses also the thing seemed insupportable."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ait ad Dominum: Cur afflixisti servum tuum? quare non invenio gratiam coram te? et cur imposuisti pondus universi populi hujus super me?"
      en: "And he said to the Lord: Why hast thou afflicted thy servant? wherefore do I not find favour before thee? and why hast thou laid the weight of all this people upon me?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Numquid ego concepi omnem hanc multitudinem, vel genui eam, ut dicas mihi: Porta eos in sinu tuo sicut portare solet nutrix infantulum, et defer in terram, pro qua jurasti patribus eorum?"
      en: "Have I conceived all this multitude, or begotten them, that thou shouldst say to me: Carry them in thy bosom as the nurse is wont to carry the little infant, and bear them into the land, for which thou hast sworn to their fathers?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Unde mihi carnes ut dem tantae multitudini? flent contra me, dicentes: Da nobis carnes ut comedamus."
      en: "Whence should I have flesh to give to so great a multitude? they weep against me, saying: Give us flesh that we may eat."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non possum solus sustinere omnem hunc populum, quia gravis est mihi."
      en: "I am not able alone to bear all this people, because it is too heavy for me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sin aliter tibi videtur, obsecro ut interficias me, et inveniam gratiam in oculis tuis, ne tantis afficiar malis."
      en: "But if it seem unto thee otherwise, I beseech thee to kill me, and let me find grace in thy eyes, that I be not afflicted with so great evils."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et dixit Dominus ad Moysen: Congrega mihi septuaginta viros de senibus Israel, quos tu nosti quod senes populi sint ac magistri: et duces eos ad ostium tabernaculi foederis, faciesque ibi stare tecum,"
      en: "And the Lord said to Moses: Gather unto me seventy men of the ancients of Israel, whom thou knowest to be ancients and masters of the people: and thou shalt bring them to the door of the tabernacle of the covenant, and shalt make them stand there with thee,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut descendam et loquar tibi: et auferam de spiritu tuo, tradamque eis, ut sustentent tecum onus populi, et non tu solus graveris."
      en: "That I may come down and speak with thee: and I will take of thy spirit, and will give to them, that they may bear with thee the burden of the people, and thou mayest not be burthened alone."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Populo quoque dices: Sanctificamini ( cras comedetis carnes: ego enim audivi vos dicere: Quis dabit nobis escas carnium? bene nobis erat in Aegypto), ut det vobis Dominus carnes, et comedatis:"
      en: "And thou shalt say to the people: Be ye sanctified: tomorrow you shall eat flesh: for I have heard you say: Who will give us flesh to eat? it was well with us in Egypt. That the Lord may give you flesh, and you may eat:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non uno die, nec duobus, vel quinque aut decem, nec viginti quidem,"
      en: "Not for one day, nor two, nor five, nor ten, no nor for twenty."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sed usque ad mensem dierum, donec exeat per nares vestras, et vertatur in nauseam, eo quod replueritis Dominum, qui in medio vestri est, et fleveritis coram eo, dicentes: Quare egressi sumus ex Aegypto?"
      en: "But even for a month of days, till it come out at your nostrils, and become loathsome to you, because you have cast off the Lord, who is in the midst of you, and have wept before him, saying: Why came we out of Egypt?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ait Moyses: Sexcenta millia peditum hujus populi sunt: et tu dicis: Dabo eis esum carnium mense integro?"
      en: "And Moses said: There are six hundred thousand footmen of this people, and sayest thou: I will give them flesh to eat a whole month?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "numquid ovium et boum multitudo caedetur, ut possit sufficere ad cibum? vel omnes pisces maris in unum congregabuntur, ut eos satient?"
      en: "Shall then a multitude of sheep and oxen be killed, that it may suffice for their food? or shall the fishes of the sea be gathered together to fill them?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cui respondit Dominus: Numquid manus Domini invalida est? jam nunc videbis utrum meus sermo opere compleatur."
      en: "And the Lord answered him: Is the hand of the Lord unable? Thou shalt presently see whether my word shall come to pass or no."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Venit igitur Moyses, et narravit populo verba Domini, congregans septuaginta viros de senibus Israel, quos stare fecit circa tabernaculum."
      en: "Moses therefore came, and told the people the words of the Lord, and assembled seventy men of the ancients of Israel, and made them to stand about the tabernacle."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Descenditque Dominus per nubem, et locutus est ad eum, auferens de spiritu qui erat in Moyse, et dans septuaginta viris. Cumque requievisset in eis spiritus, prophetaverunt, nec ultra cessaverunt."
      en: "And the Lord came down in a cloud, and spoke to him, taking away of the spirit that was in Moses, and giving to the seventy men. And when the spirit had rested on them they prophesied, nor did they cease afterwards."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Remanserat autem in castris duo viri, quorum unus vocabatur Eldad, et alter Medad, super quos requievit spiritus. Nam et ipsi descripti fuerant, et non exierant ad tabernaculum."
      en: "Now there remained in the camp two of the men, of whom one was called Eldad, and the other Medad, upon whom the spirit rested; for they also had been enrolled, but were not gone forth to the tabernacle."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cumque prophetarent in castris, cucurrit puer, et nuntiavit Moysi, dicens: Eldad et Medad prophetant in castris."
      en: "And when they prophesied in the camp, there ran a young man, and told Moses, saying: Eldad and Medad prophesy in the camp."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Statim Josue filius Nun, minister Moysi, et electus e pluribus, ait: Domine mi Moyses, prohibe eos."
      en: "Forthwith Josue the son of Nun, the minister of Moses, and chosen out of many, said: My lord Moses forbid them."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "At ille: Quid, inquit aemularis pro me? quis tribuat ut omnis populus prophetet, et det eis Dominus spiritum suum?"
      en: "But he said: Why hast thou emulation for me? O that all the people might prophesy, and that the Lord would give them his spirit!"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Reversusque est Moyses, et majores natu Israel in castra."
      en: "And Moses returned, with the ancients of Israel, into the camp."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ventus autem egrediens a Domino, arreptans trans mare coturnices detulit, et demisit in castra itinere quantum uno die confici potest, ex omni parte castrorum per circuitum, volabantque in aere duobus cubitis altitudine super terram."
      en: "And a wind going out from the Lord, taking quails up beyond the sea brought them, and cast them into the camp for the space of one day's journey, on every side of the camp round about, and they flew in the air two cubits high above the ground."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Surgens ergo populus toto die illo, et nocte, ac die altero, congregavit coturnicum: qui parum, decem coros: et siccaverunt eas per gyrum castrorum."
      en: "The people therefore rising up all that day, and night, and the next day, gathered together of quails, he that did least, ten cores: and they dried them round about the camp."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Adhuc carnes erant in dentibus eorum, nec defecerat hujuscemodi cibus: et ecce furor Domini concitatus in populum, percussit eum plaga magna nimis."
      en: "As yet the flesh was between their teeth, neither had that kind of meat failed: when behold the wrath of the Lord being provoked against the people, struck them with an exceeding great plague."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Vocatusque est ille locus, Sepulchra concupiscentiae: ibi enim sepelierunt populum qui desideraverat. Egressi autem de Sepulchris concupiscentiae, venerunt in Haseroth, et manserunt ibi."
      en: "And that place was called, The graves of lust: for there they buried the people that had lusted. And departing from the graves of lust, they came unto Haseroth, and abode there."
    status: { la: verified, en: verified }
