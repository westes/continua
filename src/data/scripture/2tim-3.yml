# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2tim
chapter: 3
verses:
  - n: 1
    text:
      la: "Hoc autem scito, quod in novissimis diebus instabunt tempora periculosa:"
      en: "Know also this, that, in the last days, shall come dangerous times."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "erunt homines seipsos amantes, cupidi, elati, superbi, blasphemi, parentibus non obedientes, ingrati, scelesti,"
      en: "Men shall be lovers of themselves, covetous, haughty, proud, blasphemers, disobedient to parents, ungrateful, wicked,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sine affectione, sine pace, criminatores, incontinentes, immites, sine benignitate,"
      en: "Without affection, without peace, slanderers, incontinent, unmerciful, without kindness,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "proditores, protervi, tumidi, et voluptatum amatores magis quam Dei:"
      en: "Traitors, stubborn, puffed up, and lovers of pleasures more than of God:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "habentes speciem quidem pietatis, virtutem autem ejus abnegantes. Et hos devita:"
      en: "Having an appearance indeed of godliness, but denying the power thereof. Now these avoid."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ex his enim sunt qui penetrant domos, et captivas ducunt mulierculas oneratas peccatis, quae ducuntur variis desideriis:"
      en: "For of these sort are they who creep into houses, and lead captive silly women laden with sins, who are led away with divers desires:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "semper discentes, et numquam ad scientiam veritatis pervenientes."
      en: "Ever learning, and never attaining to the knowledge of the truth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quemadmodum autem Jannes et Mambres restiterunt Moysi: ita et hi resistunt veritati, homines corrupti mente, reprobi circa fidem;"
      en: "Now as Jannes and Mambres resisted Moses, so these also resist the truth, men corrupted in mind, reprobate concerning the faith."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sed ultra non proficient: insipientia enim eorum manifesta erit omnibus, sicut et illorum fuit."
      en: "But they shall proceed no farther; for their folly shall be manifest to all men, as theirs also was."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tu autem assecutus es meam doctrinam, institutionem, propositum, fidem, longanimitatem, dilectionem, patientiam,"
      en: "But thou hast fully known my doctrine, manner of life, purpose, faith, longsuffering, love, patience,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "persecutiones, passiones: qualia mihi facta sunt Antiochiae, Iconii, et Lystris: quales persecutiones sustinui, et ex omnibus eripuit me Dominus."
      en: "Persecutions, afflictions: such as came upon me at Antioch, at Iconium, and at Lystra: what persecutions I endured, and out of them all the Lord delivered me."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et omnes, qui pie volunt vivere in Christo Jesu, persecutionem patientur."
      en: "And all that will live godly in Christ Jesus, shall suffer persecution."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Mali autem homines et seductores proficient in pejus, errantes, et in errorem mittentes."
      en: "But evil men and seducers shall grow worse and worse: erring, and driving into error."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tu vero permane in iis quae didicisti, et credita sunt tibi: sciens a quo didiceris:"
      en: "But continue thou in those things which thou hast learned, and which have been committed to thee: knowing of whom thou hast learned them;"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et quia ab infantia sacras litteras nosti, quae te possunt instruere ad salutem, per fidem quae est in Christo Jesu."
      en: "And because from thy infancy thou hast known the holy scriptures, which can instruct thee to salvation, by the faith which is in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Omnis Scriptura divinitus inspirata utilis est ad docendum, ad arguendum, ad corripiendum, et erudiendum in justitia:"
      en: "All scripture, inspired of God, is profitable to teach, to reprove, to correct, to instruct in justice,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut perfectus sit homo Dei, ad omne opus bonum instructus."
      en: "That the man of God may be perfect, furnished to every good work."
    status: { la: verified, en: verified }
