# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2mach
chapter: 5
verses:
  - n: 1
    text:
      la: "Eodem tempore, Antiochus secundam profectionem paravit in Aegyptum."
      en: "At the same time Antiochus prepared for a second journey into Egypt."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Contigit autem per universam Jerosolymorum civitatem videri diebus quadraginta per aera equites discurrentes, auratas stolas habentes, et hastis, quasi cohortes, armatos,"
      en: "And it came to pass that through the whole city of Jerusalem for the space of forty days there were seen horsemen running in the air, in gilded raiment, and armed with spears, like bands of soldiers."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et cursus equorum per ordines digestos, et congressiones fieri cominus, et scutorum motus, et galeatorum multitudinem gladiis districtis, et telorum jactus, et aureorum armorum splendorem, omnisque generis loricarum."
      en: "And horses set in order by ranks, running one against another, with the shakings of shields, and a multitude of men in helmets, with drawn swords, and casting of darts, and glittering of golden armour, and of harnesses of all sorts."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quapropter omnes rogabant in bonum monstra converti."
      en: "Wherefore all men prayed that these prodigies might turn to good."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sed cum falsus rumor exisset, tamquam vita excessisset Antiochus, assumptis Jason non minus mille viris, repente agressus est civitatem: et civibus ad murum convolantibus ad ultimum apprehensa civitate, Menelaus fugit in arcem:"
      en: "Now when there was gone forth a false rumour, as though Antiochus had been dead, Jason taking with him no fewer than a thousand men, suddenly assaulted the city: and though the citizens ran together to the wall, the city at length was taken, and Menelaus fled into the castle."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Jason vero non parcebat in caede civibus suis, nec cogitabat prosperitatem adversum cognatos malum esse maximum, arbitrans hostium et non civium se trophaea capturum."
      en: "But Jason slew his countrymen without mercy, not considering that prosperity against one's own kindred is a very great evil, thinking they had been enemies, and not citizens, whom he conquered."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et principatum quidem non obtinuit, finem vero insidiarum suarum confusionem accepit, et profugus iterum abiit in Ammanitem."
      en: "Yet he did not get the principality, but received confusion at the end, for the reward of his treachery, and fled again into the country of the Ammonites."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ad ultimum, in exitium sui conclusus ab Areta Arabum tyranno fugiens de civitate in civitatem, omnibus odiosus, ut refuga legum et execrabilis, ut patriae et civium hostis, in Aegyptum extrusus est:"
      en: "At the last having been shut up by Aretas the king of the Arabians, in order for his destruction, flying from city to city, hated by all men, as a forsaker of the laws, and execrable, as an enemy of his country and countrymen, he was thrust out into Egypt:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et qui multos de patria sua expulerat, peregre periit, Lacedaemonas profectus, quasi pro cognatione ibi refugium habiturus:"
      en: "And he that had driven many out of their country, perished in a strange land, going to Lacedemon, as if for kindred sake he should have refuge there:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et qui insepultos multos abjecerat, ipse et illamentatus, et insepultus abjicitur, sepultura neque peregrina usus, neque patrio sepulchro participans."
      en: "But he that had cast out many unburied, was himself cast forth both unlamented and unburied, neither having foreign burial, nor being partaker of the sepulchre of his fathers."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "His itaque gestis, suspicatus est rex societatem deserturos Judaeos: et ob hoc profectus ex Aegypto efferatis animis, civitatem quidem armis cepit."
      en: "Now when these things were done, the king suspected that the Jews would forsake the alliance: whereupon departing out of Egypt with a furious mind, he took the city by force of arms."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Jussit autem militibus interficere, nec parcere occursantibus, et per domos ascendentes trucidare."
      en: "And commanded the soldiers to kill, and not to spare any that came in their way, and to go up into the houses to slay."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Fiebant ergo caedes juvenum, ac seniorum, et mulierum, et natorum exterminia, virginumque et parvulorum neces."
      en: "Thus there was a slaughter of young and old, a destruction of women and children, and killing of virgins and infants."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Erant autem toto triduo octoginta millia interfecti, quadraginta millia vincti, non minus autem venundati."
      en: "And there were slain in the space of three whole days fourscore thousand, forty thousand were made prisoners, and as many sold."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sed nec ista sufficiunt: ausus est etiam intrare templum universa terra sanctius, Menelao ductore, qui legum et patriae fuit proditor:"
      en: "But this was not enough; he presumed also to enter into the temple, the most holy in all the world, Menelaus, that traitor to the laws, and to his country, being his guide."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et scelestis manibus sumens sancta vasa, quae ab aliis regibus et civitatibus erant posita ad ornatum loci, et gloriam, contrectabat indigne, et contaminabat."
      en: "And taking in his wicked hands the holy vessels, which were given by other kings and cities, for the ornament and the glory of the place, he unworthily handled and profaned them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ita alienatus mente Antiochus, non considerabat quod propter peccata habitantium civitatem, modicum Deus fuerat iratus: propter quod et accidit circa locum despectio:"
      en: "Thus Antiochus going astray in mind, did not consider that God was angry for a while, because of the sins of the inhabitants of the city: and therefore this contempt had happened to the place:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "alioquin nisi contigisset eos multis peccatis esse involutos, sicut Heliodorus, qui missus est a Seleuco rege ad expoliandum aerarium, etiam hic statim adveniens flagellatus, et repulsus utique fuisset ab audacia."
      en: "Otherwise had they not been involved in many sins, as Heliodorus, who was sent by king Seleucus to rob the treasury, so this man also, as soon as he had come, had been forthwith scourged, and put back from his presumption."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Verum non propter locum, gentem: sed propter gentem, locum Deus elegit."
      en: "But God did not choose the people for the place's sake, but the place for the people's sake."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ideoque et ipse locus particeps factus est populi malorum, postea autem fiet socius bonorum, et qui derelictus in ira Dei omnipotentis est, iterum in magni Domini reconciliatione cum summa gloria exaltabitur."
      en: "And therefore the place also itself was made partaker of the evils of the people: but afterward shall communicate in the good things thereof, and as it was forsaken in the wrath of almighty God, shall be exalted again with great glory, when the great Lord shall be reconciled."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Igitur Antiochus mille et octingentis ablatis de templo talentis, velociter Antiochiam regressus est, existimans se prae superbia terram ad navigandum, pelagus vero ad iter agendum deducturum propter mentis elationem."
      en: "So when Antiochus had taken away out of the temple a thousand and eight hundred talents, he went back in all haste to Antioch, thinking through pride, that he might now make the land navigable, and the sea passable on foot: such was the haughtiness of his mind."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Reliquit autem et praepositos ad affligendam gentem: Jerosolymis quidem Philippum genere Phrygem, moribus crudeliorem eo ipso, a quo constitutus est:"
      en: "He left also governors to afflict the people: at Jerusalem, Philip, a Phrygian by birth, but in manners more barbarous than he that set him there:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "in Garizim autem Andronicum et Menelaum, qui gravius quam ceteri imminebant civibus."
      en: "And in Gazarim, Andronicus and Menelaus, who bore a more heavy hand upon the citizens than the rest."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Cumque appositus esset contra Judaeos, misit odiosum principem Apollonium cum exercitu viginti et duobus millibus, praecipiens ei omnes perfectae aetatis interficere, mulieres ac juvenes vendere."
      en: "And whereas he was set against the Jews, he sent that hateful prince Apollonius with an army of two and twenty thousand men, commanding him to kill all that were of perfect age, and to sell the women and the younger sort."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Qui cum venisset Jerosolymam, pacem simulans, quievit usque ad diem sanctum sabbati: et tunc feriatis Judaeis arma capere suis praecepit."
      en: "Who when he was come to Jerusalem, pretending peace, rested till the holy day of the sabbath: and then the Jews keeping holiday, he commanded his men to take arms."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Omnesque qui ad spectaculum processerant, trucidavit: et civitatem cum armatis discurrens, ingentem multitudinem peremit."
      en: "And he slew all that were come forth to see: and running through the city with armed men, he destroyed a very great multitude."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Judas autem Machabaeus, qui decimus fuerat, secesserat in desertum locum, ibique inter feras vitam in montibus cum suis agebat: et foeni cibo vescentes, demorabantur, ne participes essent coinquinationis."
      en: "But Judas Machabeus, who was the tenth, had withdrawn himself into a desert place, and there lived amongst wild beasts in the mountains with his company: and they continued feeding on herbs, that they might not be partakers of the pollution."
    status: { la: verified, en: verified }
