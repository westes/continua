# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 3
verses:
  - n: 1
    text:
      la: "Erat autem homo ex pharisaeis, Nicodemus nomine, princeps Judaeorum."
      en: "And there was a man of the Pharisees, named Nicodemus, a ruler of the Jews."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Hic venit ad Jesum nocte, et dixit ei: Rabbi, scimus quia a Deo venisti magister, nemo enim potest haec signa facere, quae tu facis, nisi fuerit Deus cum eo."
      en: "This man came to Jesus by night, and said to him: Rabbi, we know that thou art come a teacher from God; for no man can do these signs which thou dost, unless God be with him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Respondit Jesus, et dixit ei: Amen, amen dico tibi, nisi quis renatus fuerit denuo, non potest videre regnum Dei."
      en: "Jesus answered, and said to him: Amen, amen I say to thee, unless a man be born again, he cannot see the kingdom of God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dicit ad eum Nicodemus: Quomodo potest homo nasci, cum sit senex? numquid potest in ventrem matris suae iterato introire et renasci?"
      en: "Nicodemus saith to him: How can a man be born when he is old? can he enter a second time into his mother's womb, and be born again?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Respondit Jesus: Amen, amen dico tibi, nisi quis renatus fuerit ex aqua, et Spiritu Sancto, non potest introire in regnum Dei."
      en: "Jesus answered: Amen, amen I say to thee, unless a man be born again of water and the Holy Ghost, he cannot enter into the kingdom of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quod natum est ex carne, caro est: et quod natum est ex spiritu, spiritus est."
      en: "That which is born of the flesh, is flesh; and that which is born of the Spirit, is spirit."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Non mireris quia dixi tibi: oportet vos nasci denuo."
      en: "Wonder not, that I said to thee, you must be born again."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Spiritus ubi vult spirat, et vocem ejus audis, sed nescis unde veniat, aut quo vadat: sic est omnis qui natus est ex spiritu."
      en: "The Spirit breatheth where he will; and thou hearest his voice, but thou knowest not whence he cometh, and whither he goeth: so is every one that is born of the Spirit."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Respondit Nicodemus, et dixit ei: Quomodo possunt haec fieri?"
      en: "Nicodemus answered, and said to him: How can these things be done?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Respondit Jesus, et dixit ei: Tu es magister in Israel, et haec ignoras?"
      en: "Jesus answered, and said to him: Art thou a master in Israel, and knowest not these things?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "amen, amen dico tibi, quia quod scimus loquimur, et quod vidimus testamur, et testimonium nostrum non accipitis."
      en: "Amen, amen I say to thee, that we speak what we know, and we testify what we have seen, and you receive not our testimony."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Si terrena dixi vobis, et non creditis: quomodo, si dixero vobis caelestia, credetis?"
      en: "If I have spoken to you earthly things, and you believe not; how will you believe, if I shall speak to you heavenly things?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et nemo ascendit in caelum, nisi qui descendit de caelo, Filius hominis, qui est in caelo."
      en: "And no man hath ascended into heaven, but he that descended from heaven, the Son of man who is in heaven."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et sicut Moyses exaltavit serpentem in deserto, ita exaltari oportet Filium hominis:"
      en: "And as Moses lifted up the serpent in the desert, so must the Son of man be lifted up:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ut omnis qui credit in ipsum, non pereat, sed habeat vitam aeternam."
      en: "That whosoever believeth in him, may not perish; but may have life everlasting."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sic enim Deus dilexit mundum, ut Filium suum unigenitum daret: ut omnis qui credit in eum, non pereat, sed habeat vitam aeternam."
      en: "For God so loved the world, as to give his only begotten Son; that whosoever believeth in him, may not perish, but may have life everlasting."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non enim misit Deus Filium suum in mundum, ut judicet mundum, sed ut salvetur mundus per ipsum."
      en: "For God sent not his Son into the world, to judge the world, but that the world may be saved by him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui credit in eum, non judicatur; qui autem non credit, jam judicatus est: quia non credit in nomine unigeniti Filii Dei."
      en: "He that believeth in him is not judged. But he that doth not believe, is already judged: because he believeth not in the name of the only begotten Son of God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Hoc est autem judicium: quia lux venit in mundum, et dilexerunt homines magis tenebras quam lucem: erant enim eorum mala opera."
      en: "And this is the judgment: because the light is come into the world, and men loved darkness rather than the light: for their works were evil."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Omnis enim qui male agit, odit lucem, et non venit ad lucem, ut non arguantur opera ejus:"
      en: "For every one that doth evil hateth the light, and cometh not to the light, that his works may not be reproved."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui autem facit veritatem, venit ad lucem, ut manifestentur opera ejus, quia in Deo sunt facta."
      en: "But he that doth truth, cometh to the light, that his works may be made manifest, because they are done in God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Post haec venit Jesus et discipuli ejus in terram Judaeam: et illic demorabatur cum eis, et baptizabat."
      en: "After these things Jesus and his disciples came into the land of Judea: and there he abode with them, and baptized."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Erat autem et Joannes baptizans, in Aennon, juxta Salim: quia aquae multae erant illic, et veniebant et baptizabantur."
      en: "And John also was baptizing in Ennon near Salim; because there was much water there; and they came and were baptized."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Nondum enim missus fuerat Joannes in carcerem."
      en: "For John was not yet cast into prison."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Facta est autem quaestio ex discipulis Joannis cum Judaeis de purificatione."
      en: "And there arose a question between some of John's disciples and the Jews concerning purification:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et venerunt ad Joannem, et dixerunt ei: Rabbi, qui erat tecum trans Jordanem, cui tu testimonium perhibuisti, ecce hic baptizat, et omnes veniunt ad eum."
      en: "And they came to John, and said to him: Rabbi, he that was with thee beyond the Jordan, to whom thou gavest testimony, behold he baptizeth, and all men come to him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Respondit Joannes, et dixit: Non potest homo accipere quidquam, nisi fuerit ei datum de caelo."
      en: "John answered, and said: A man cannot receive any thing, unless it be given him from heaven."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ipsi vos mihi testimonium perhibetis, quod dixerim: Non sum ego Christus: sed quia missus sum ante illum."
      en: "You yourselves do bear me witness, that I said, I am not Christ, but that I am sent before him."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Qui habet sponsam, sponsus est: amicus autem sponsi, qui stat, et audit eum, gaudio gaudet propter vocem sponsi. Hoc ergo gaudium meum impletum est."
      en: "He that hath the bride, is the bridegroom: but the friend of the bridegroom, who standeth and heareth him, rejoiceth with joy because of the bridegroom's voice. This my joy therefore is fulfilled."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Illum oportet crescere, me autem minui."
      en: "He must increase, but I must decrease."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Qui desursum venit, super omnes est. Qui est de terra, de terra est, et de terra loquitur. Qui de caelo venit, super omnes est."
      en: "He that cometh from above, is above all. He that is of the earth, of the earth he is, and of the earth he speaketh. He that cometh from heaven, is above all."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et quod vidit, et audivit, hoc testatur: et testimonium ejus nemo accipit."
      en: "And what he hath seen and heard, that he testifieth: and no man receiveth his testimony."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Qui accepit ejus testimonium signavit, quia Deus verax est."
      en: "He that hath received his testimony, hath set to his seal that God is true."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Quem enim misit Deus, verba Dei loquitur: non enim ad mensuram dat Deus spiritum."
      en: "For he whom God hath sent, speaketh the words of God: for God doth not give the Spirit by measure."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Pater diligit Filium et omnia dedit in manu ejus."
      en: "The Father loveth the Son: and he hath given all things into his hand."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Qui credit in Filium, habet vitam aeternam; qui autem incredulus est Filio, non videbit vitam, sed ira Dei manet super eum."
      en: "He that believeth in the Son, hath life everlasting; but he that believeth not the Son, shall not see life; but the wrath of God abideth on him."
    status: { la: verified, en: verified }
