# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: tob
chapter: 5
verses:
  - n: 1
    text:
      la: "Tunc respondit Tobias patri suo, et dixit: Omnia quaecumque praecepisti mihi faciam, pater."
      en: "Then Tobias answered his father, and said: I will do all things, father, which thou hast commanded me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quomodo autem pecuniam hanc requiram, ignoro: ille me nescit, et ego eum ignoro: quod signum dabo ei? sed neque viam, per quam pergatur illuc, aliquando cognovi."
      en: "But how I shall get this money, I cannot tell; he knoweth me not, and I know not him: what token shall I give him? nor did I ever know the way which leadeth thither."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tunc pater suus respondit illi, et dixit: Chirographum quidem illius penes me habeo: quod dum illi ostenderis, statim restituet."
      en: "Then his father answered him, and said: I have a note of his hand with me, which when thou shalt shew him, he will presently pay it."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sed perge nunc, et inquire tibi aliquem fidelem virum, qui eat tecum salva mercede sua: ut, dum adhuc vivo, recipias eam."
      en: "But go now, and seek thee out some faithful man, to go with thee for his hire: that thou mayst receive it, while I yet live."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Tunc egressus Tobias, invenit juvenem splendidum, stantem praecinctum, et quasi paratum ad ambulandum."
      en: "Then Tobias going forth, found a beautiful young man, standing girded, and as it were ready to walk."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et ignorans quod angelus Dei esset, salutavit eum, et dixit: Unde te habemus, bone juvenis?"
      en: "And not knowing that he was an angel of God, he saluted him, and said: From whence art thou, good young man?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "At ille respondit: Ex filiis Israel. Et Tobias dixit ei: Nosti viam, quae ducit in regionem Medorum?"
      en: "But he answered: Of the children of Israel. And Tobias said to him: Knowest thou the way that leadeth to the country of the Medes?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cui respondit: Novi: et omnia itinera ejus frequenter ambulavi, et mansi apud Gabelum fratrem nostrum: qui moratur in Rages civitate Medorum, quae posita est in monte Ecbatanis."
      en: "And he answered: I know it: and I have often walked through all the ways thereof, and I have abode with Gabelus our brother, who dwelleth at Rages a city of the Medes, which is situate in the mount of Ecbatana."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cui Tobias ait: Sustine me obsecro, donec haec ipsa nuntiem patri meo."
      en: "And Tobias said to him: Stay for me, I beseech thee, till I tell these same things to my father."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tunc ingressus Tobias, indicavit universa haec patri suo. Super quae admiratus pater, rogavit ut introiret ad eum."
      en: "Then Tobias going in told all these things to his father. Upon which his father being in admiration, desired that he would come in unto him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ingressus itaque salutavit eum, et dixit: Gaudium tibi sit semper."
      en: "So going in he saluted him, and said: Joy be to thee always."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et ait Tobias: Quale gaudium mihi erit, qui in tenebris sedeo, et lumen caeli non video?"
      en: "And Tobias said: What manner of joy shall be to me, who sit in darkness, and see not the light of heaven?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cui ait juvenis: Forti animo esto: in proximo est ut a Deo cureris."
      en: "And the young man said to him: Be of good courage, thy cure from God is at hand."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixit itaque illi Tobias: Numquid poteris perducere filium meum ad Gabelum in Rages civitatem Medorum? et cum redieris, restituam tibi mercedem tuam."
      en: "And Tobias said to him: Canst thou conduct my son to Gabelus at Rages, a city of the Medes? and when thou shalt return, I will pay thee thy hire."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et dixit ei angelus: Ego ducam, et reducam eum ad te."
      en: "And the angel said to him: I will conduct him thither, and bring him back to thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cui Tobias respondit: Rogo te, indica mihi de qua domo, aut de qua tribu es tu."
      en: "And Tobias said to him: I pray thee, tell me, of what family, or what tribe art thou?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cui Raphael angelus dixit: Genus quaeris mercenarii, an ipsum mercenarium, qui cum filio tuo eat?"
      en: "And Raphael the angel answered: Dost thou seek the family of him thou hirest, or the hired servant himself to go with thy son?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Sed ne forte sollicitum te reddam, ego sum Azarias Ananiae magni filius."
      en: "But lest I should make thee uneasy, I am Azarias the son of the great Ananias."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et Tobias respondit: Ex magno genere es tu. Sed peto ne irascaris quod voluerim cognoscere genus tuum."
      en: "And Tobias answered: Thou art of a great family. But I pray thee be not angry that I desired to know thy family."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixit autem illi angelus: Ego sanum ducam, et sanum tibi reducam filium tuum."
      en: "And the angel said to him: I will lead thy son safe, and bring him to thee again safe."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Respondens autem Tobias, ait: Bene ambuletis, et sit Deus in itinere vestro, et angelus ejus comitetur vobiscum."
      en: "And Tobias answering, said: May you have a good journey, and God be with you in your way, and his angel accompany you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Tunc paratis omnibus, quae erant in via portanda, fecit Tobias vale patri suo et matri suae, et ambulaverunt ambo simul."
      en: "Then all things being ready, that were to be carried in their journey, Tobias bade his father and his mother farewell, and they set out both together."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cumque profecti essent, coepit mater ejus flere, et dicere: Baculum senectutis nostrae tulisti, et transmisisti a nobis."
      en: "And when they were departed, his mother began to weep, and to say: Thou hast taken the staff of our old age, and sent him away from us."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Numquam fuisset ipsa pecunia, pro qua misisti eum."
      en: "I wish the money for which thou hast sent him, had never been."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Sufficiebat enim nobis paupertas nostra, ut divitias computaremus hoc, quod videbamus filium nostrum."
      en: "For poverty was sufficient for us, that we might account it as riches, that we saw our son."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dixitque ei Tobias: Noli flere: salvus perveniet filius noster, et salvus revertetur ad nos, et oculi tui videbunt illum."
      en: "And Tobias said to her: Weep not, our son will arrive thither safe, and will return safe to us, and thy eyes shall see him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Credo enim quod angelus Dei bonus comitetur ei, et bene disponat omnia, quae circa eum geruntur, ita ut cum gaudio revertatur ad nos."
      en: "For I believe that the good angel of God doth accompany him, and doth order all things well that are done about him, so that he shall return to us with joy."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ad hanc vocem cessavit mater ejus flere, et tacuit."
      en: "At these words his mother ceased weeping, and held her peace."
    status: { la: verified, en: verified }
