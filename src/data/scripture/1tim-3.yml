# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1tim
chapter: 3
verses:
  - n: 1
    text:
      la: "fidelis sermo si quis episcopatum desiderat bonum opus desiderat"
      en: "A faithful saying: if a man desire the office of a bishop, he desireth a good work."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "oportet ergo episcopum inreprehensibilem esse unius uxoris virum sobrium prudentem ornatum hospitalem doctorem"
      en: "It behoveth therefore a bishop to be blameless, the husband of one wife, sober, prudent, of good behaviour, chaste, given to hospitality, a teacher,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "non vinolentum non percussorem sed modestum non litigiosum non cupidum"
      en: "Not given to wine, no striker, but modest, not quarrelsome, not covetous, but"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "suae domui bene praepositum filios habentem subditos cum omni castitate"
      en: "One that ruleth well his own house, having his children in subjection with all chastity."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si quis autem domui suae praeesse nescit quomodo ecclesiae Dei diligentiam habebit"
      en: "But if a man know not how to rule his own house, how shall he take care of the church of God?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non neophytum ne in superbia elatus in iudicium incidat diaboli"
      en: "Not a neophyte: lest being puffed up with pride, he fall into the judgment of the devil."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "oportet autem illum et testimonium habere bonum ab his qui foris sunt ut non in obprobrium incidat et laqueum diaboli"
      en: "Moreover he must have a good testimony of them who are without: lest he fall into reproach and the snare of the devil."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "diaconos similiter pudicos non bilingues non multo vino deditos non turpe lucrum sectantes"
      en: "Deacons in like manner chaste, not double tongued, not given to much wine, not greedy of filthy lucre:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "habentes mysterium fidei in conscientia pura"
      en: "Holding the mystery of faith in a pure conscience."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et hii autem probentur primum et sic ministrent nullum crimen habentes"
      en: "And let these also first be proved: and so let them minister, having no crime."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "mulieres similiter pudicas non detrahentes sobrias fideles in omnibus"
      en: "The women in like manner chaste, not slanderers, but sober, faithful in all things."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "diacones sint unius uxoris viri qui filiis suis bene praesunt et suis domibus"
      en: "Let deacons be the husbands of one wife: who rule well their children, and their own houses."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui enim bene ministraverint gradum sibi bonum adquirent et multam fiduciam in fide quae est in Christo Iesu"
      en: "For they that have ministered well, shall purchase to themselves a good degree, and much confidence in the faith which is in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "haec tibi scribo sperans venire ad te cito"
      en: "These things I write to thee, hoping that I shall come to thee shortly."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "si autem tardavero ut scias quomodo oporteat te in domo Dei conversari quae est ecclesia Dei vivi columna et firmamentum veritatis"
      en: "But if I tarry long, that thou mayest know how thou oughtest to behave thyself in the house of God, which is the church of the living God, the pillar and ground of the truth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et manifeste magnum est pietatis sacramentum quod manifestatum est in carne iustificatum est in spiritu apparuit angelis praedicatum est gentibus creditum est in mundo adsumptum est in gloria"
      en: "And evidently great is the mystery of godliness, which was manifested in the flesh, was justified in the spirit, appeared unto angels, hath been preached unto the Gentiles, is believed in the world, is taken up in glory."
    status: { la: verified, en: verified }
