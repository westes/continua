# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 26
verses:
  - n: 1
    text:
      la: "In die illa cantabitur canticum istud in terra Juda: Urbs fortitudinis nostrae Sion; salvator ponetur in ea murus et antemurale."
      en: "In that day shall this canticle be sung the land of Juda. Sion the city of our strength a saviour, a wall and a bulwark shall be set therein."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Aperite portas, et ingrediatur gens justa, custodiens veritatem."
      en: "Open ye the gates, and let the just nation, that keepeth the truth, enter in."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Vetus error abiit: servabis pacem; pacem, quia in te speravimus."
      en: "The old error is passed away: thou wilt keep peace: peace, because we have hoped in thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sperastis in Domino in saeculis aeternis; in Domino Deo forti in perpetuum."
      en: "You have hoped in the Lord for evermore, in the Lord God mighty for ever."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quia incurvabit habitantes in excelso; civitatem sublimem humiliabit: humiliabit eam usque ad terram, detrahet eam usque ad pulverem."
      en: "For he shall bring down them that dwell on high, the high city he shall lay low. He shall bring it down even to the ground, he shall pull it down even to the dust."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Conculcabit eam pes, pedes pauperis, gressus egenorum."
      en: "The foot shall tread it down, the feet of the poor, the steps of the needy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Semita justi recta est, rectus callis justi ad ambulandum."
      en: "The way of the just is right, the path of the just is right to walk in."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et in semita judiciorum tuorum, Domine, sustinuimus te: nomen tuum et memoriale tuum in desiderio animae."
      en: "And in the way of thy judgments, O Lord, we have patiently waited for thee: thy name, and thy remembrance are the desire of the soul."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Anima mea desideravit te in nocte, sed et spiritu meo in praecordiis meis de mane vigilabo ad te. Cum feceris judicia tua in terra, justitiam discent habitatores orbis."
      en: "My soul hath desired thee in the night: yea, and with my spirit within me in the morning early I will watch to thee. When thou shalt do thy judgments on the earth, the inhabitants of the world shall learn justice."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Misereamur impio, et non discet justitiam; in terra sanctorum iniqua gessit, et non videbit gloriam Domini."
      en: "Let us have pity on the wicked, but he will not learn justice: in the land of the saints he hath done wicked things, and he shall not see the glory of the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Domine, exaltetur manus tua, et non videant; videant, et confundantur zelantes populi; et ignis hostes tuos devoret."
      en: "Lord, let thy hand be exalted, and let them not see: let the envious people see, and be confounded: and let fire devour thy enemies."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Domine, dabis pacem nobis: omnia enim opera nostra operatus es nobis."
      en: "Lord, thou wilt give us peace: for thou hast wrought all our works for us."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Domine Deus noster, possederunt nos domini absque te; tantum in te recordemur nominis tui."
      en: "O Lord our God, other lords besides thee have had dominion over us, only in thee let us remember thy name."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Morientes non vivant, gigantes non resurgant: propterea visitasti et contrivisti eos, et perdidisti omnem memoriam eorum."
      en: "Let not the dead live, let not the giants rise again: therefore hast thou visited and destroyed them, and hast destroyed all their memory."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Indulsisti genti, Domine, indulsisti genti, numquid glorificatus es? elongasti omnes terminos terrae."
      en: "Thou hast been favourable to the nation, O Lord, thou hast been favourable to the nation: art thou glorified? thou hast removed all the ends of the earth far off."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Domine, in angustia requisierunt te, in tribulatione murmuris doctrina tua eis."
      en: "Lord, they have sought after thee in distress, in the tribulation of murmuring thy instruction was with them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sicut quae concipit, cum appropinquaverit ad partum, dolens clamat in doloribus suis, sic facti sumus a facie tua, Domine."
      en: "As a woman with child, when she draweth near the time of her delivery, is in pain, and crieth out in her pangs: so are we become in thy presence, O Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Concepimus, et quasi parturivimus, et peperimus spiritum. Salutes non fecimus in terra; ideo non ceciderunt habitatores terrae."
      en: "We have conceived, and been as it were in labour, and have brought forth wind: we have not wrought salvation on the earth, therefore the inhabitants of the earth have not fallen."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Vivent mortui tui, interfecti mei resurgent. Expergiscimini, et laudate, qui habitatis in pulvere, quia ros lucis ros tuus, et terram gigantum detrahes in ruinam."
      en: "Thy dead men shall live, my slain shall rise again: awake, and give praise, ye that dwell in the dust: for thy dew is the dew of the light: and the land of the giants thou shalt pull down into ruin."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vade, populus meus, intra in cubicula tua; claude ostia tua super te, abscondere modicum ad momentum, donec pertranseat indignatio."
      en: "Go, my people, enter into thy chambers, shut thy doors upon thee, hide thyself a little for a moment, until the indignation pass away."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ecce enim Dominus egredietur de loco suo, ut visitet iniquitatem habitatoris terrae contra eum; et revelabit terra sanguinem suum, et non operiet ultra interfectos suos."
      en: "For behold the Lord will come out of his place, to visit the iniquity of the inhabitant of the earth against him: and the earth shall disclose her blood, and shall cover her slain no more."
    status: { la: verified, en: verified }
