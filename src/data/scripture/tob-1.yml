# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: tob
chapter: 1
verses:
  - n: 1
    text:
      la: "Tobias ex tribu et civitate Nephthali ( quae est in superioribus Galilaeae supra Naasson, post viam quae ducit ad occidentem, in sinistro habens civitatem Sephet)"
      en: "Tobias of the tribe and city of Nephtali, (which is in the upper parts of Galilee above Naasson, beyond the way that leadeth to the west, having on the right hand the city of Sephet,)"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cum captus esset in diebus Salmanasar regis Assyriorum, in captivitate tamen positus, viam veritatis non deseruit,"
      en: "When he was made captive in the days of Salmanasar king of the Assyrians, even in his captivity, forsook not the way of truth,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ita ut omnia, quae habere poterat, quotidie concaptivis fratribus, qui erant ex ejus genere, impertiret."
      en: "But every day gave all he could get to his brethren his fellow captives, that were of his kindred."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cumque esset junior omnibus in tribu Nephthali, nihil tamen puerile gessit in opere."
      en: "And when he was younger than any of the tribe of Nephtali, yet did he no childish thing in his work."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Denique, cum irent omnes ad vitulos aureos, quos Jeroboam fecerat rex Israel, hic solus fugiebat consortia omnium."
      en: "Moreover when all went to the golden calves which Jeroboam king of Israel had made, he alone fled the company of all,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Sed pergebat in Jerusalem ad templum Domini, et ibi adorabat Dominum Deum Israel, omnia primitiva sua, et decimas suas fideliter offerens,"
      en: "And went to Jerusalem to the temple of the Lord, and there adored the Lord God of Israel, offering faithfully all his firstfruits, and his tithes,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ita ut in tertio anno proselytis et advenis ministraret omnem decimationem."
      en: "So that in the third year he gave all his tithes to the proselytes, and strangers."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Haec et his similia secundum legem Dei puerulus observabat."
      en: "These and such like things did he observe when but a boy according to the law of God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cum vero factus esset vir, accepit uxorem Annam de tribu sua, genuitque ex ea filium, nomen suum imponens ei,"
      en: "But when he was a man, he took to wife Anna of his own tribe, and had a son by her, whom he called after his own name,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quem ab infantia timere Deum docuit, et abstinere ab omni peccato."
      en: "And from his infancy he taught him to fear God, and to abstain from all sin."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Igitur, cum per captivitatem devenisset cum uxore sua, et filio, in civitatem Niniven cum omni tribu sua"
      en: "And when by the captivity he with his wife and his son and all his tribe was come to the city of Ninive,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "( cum omnes ederent ex cibis gentilium), iste custodivit animam suam, et numquam contaminatus est in escis eorum."
      en: "(When all ate of the meats of the Gentiles) he kept his soul and never was defiled with their meats."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et quoniam memor fuit Domini in toto corde suo, dedit illi Deus gratiam in conspectu Salmanasar regis,"
      en: "And because he was mindful of the Lord with all his heart, God gave him favour in the sight of Salmanasar the king."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dedit illi potestatem quocumque vellet ire, habens libertatem quaecumque facere voluisset."
      en: "And he gave him leave to go whithersoever he would, with liberty to do whatever he had a mind."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Pergebat ergo ad omnes qui erant in captivitate, et monita salutis dabat eis."
      en: "He therefore went to all that were in captivity, and gave them wholesome admonitions."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cum autem venisset in Rages civitatem Medorum, et ex his, quibus honoratus fuerat a rege, habuisset decem talenta argenti:"
      en: "And when he was come to Rages a city of the Medes, and had ten talents of silver of that with which he had been honoured by the king:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et cum in multa turba generis sui Gabelum egentem videret, qui erat ex tribu ejus, sub chirographo dedit illi memoratum pondus argenti."
      en: "And when amongst a great multitude of his kindred, he saw Gabelus in want, who was one of his tribe, taking a note of his hand he gave him the aforesaid sum of money."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Post multum vero temporis, mortuo Salmanasar rege, cum regnaret Sennacherib filius ejus pro eo, et filios Israel exosos haberet in conspectu suo:"
      en: "But after a long time, Salmanasar the king being dead, when Sennacherib his son, who reigned in his place, had a hatred for the children of Israel:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tobias quotidie pergebat per omnem cognationem suam, et consolabatur eos, dividebatque unicuique, prout poterat, de facultatibus suis:"
      en: "Tobias daily went among all his kindred, and comforted them, and distributed to every one as he was able, out of his goods:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "esurientes alebat, nudisque vestimenta praebebat, et mortuis atque occisis sepulturam sollicitus exhibebat."
      en: "He fed the hungry, and gave clothes to the naked, and was careful to bury the dead, and they that were slain."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Denique cum reversus esset rex Sennacherib fugiens a Judaea plagam, quam circa eum fecerat Deus propter blasphemiam suam, et iratus multos occideret ex filiis Israel, Tobias sepeliebat corpora eorum."
      en: "And when king Sennacherib was come back, fleeing from Judea by reason of the slaughter that God had made about him for his blasphemy, and being angry slew many of the children of Israel, Tobias buried their bodies."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "At ubi nuntiatum est regi, jussit eum occidi, et tulit omnem substantiam ejus."
      en: "But when it was told the king, he commanded him to be slain, and took away all his substance."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Tobias vero cum filio suo et cum uxore suo fugiens, nudus latuit, quia multi diligebant eum."
      en: "But Tobias fleeing naked away with his son and with his wife, lay concealed, for many loved him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Post dies vero quadraginta quinque occiderunt regem filii ipsius,"
      en: "But after forty-five days, the king was killed by his own sons."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et reversus est Tobias in domum suam, omnisque facultas ejus restituta est ei."
      en: "And Tobias returned to his house, and all his substance was restored to him."
    status: { la: verified, en: verified }
