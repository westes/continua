# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 21
verses:
  - n: 1
    text:
      la: "Quod cum audisset Chananaeus rex Arad, qui habitabat ad meridiem, venisse scilicet Israel per exploratorum viam, pugnavit contra illum, et victor existens, duxit ex eo praedam."
      en: "And when king Arad the Chanaanite, who dwelt towards the south, had heard this, to wit, that Israel was come by the way of the spies, he fought against them, and overcoming them carried off their spoils."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "At Israel voto se Domino obligans, ait: Si tradideris populum istum in manu mea, delebo urbes ejus."
      en: "But Israel binding himself by vow to the Lord, said: If thou wilt deliver this people into my hand, I will utterly destroy their cities."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Exaudivitque Dominus preces Israel, et tradidit Chananaeum, quem ille interfecit subversis urbibus ejus: et vocavit nomen loci illius Horma, id est, anathema."
      en: "And the Lord heard the prayers of Israel, and delivered up the Chanaanite, and they cut them off and destroyed their cities: and they called the name of that place Horma, that is to say, Anathema."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Profecti sunt autem et de monte Hor, per viam quae ducit ad mare Rubrum, ut circumirent terram Edom. Et taedere coepit populum itineris ac laboris:"
      en: "And they marched from mount Hor, by the way that leadeth to the Red Sea, to compass the land of Edom. And the people began to be weary of their journey and labour:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "locutusque contra Deum et Moysen, ait: Cur eduxisti nos de Aegypto, ut moreremur in solitudine? deest panis, non sunt aquae: anima nostra jam nauseat super cibo isto levissimo."
      en: "And speaking against God and Moses, they said: Why didst thou bring us out of Egypt, to die in the wilderness? There is no bread, nor have we any waters: our soul now loatheth this very light food."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quam ob rem misit Dominus in populum ignitos serpentes, ad quorum plagas et mortes plurimorum,"
      en: "Wherefore the Lord sent among the people fiery serpents, which bit them and killed many of them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "venerunt ad Moysen, atque dixerunt: Peccavimus, quia locuti sumus contra Dominum et te: ora ut tollat a nobis serpentes. Oravitque Moyses pro populo,"
      en: "Upon which they came to Moses, and said: We have sinned, because we have spoken against the Lord and thee: pray that he may take away these serpents from us. And Moses prayed for the people."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et locutus est Dominus ad eum: Fac serpentem aeneum, et pone eum pro signo: qui percussus aspexerit eum, vivet."
      en: "And the Lord said to him: Make a brazen serpent, and set it up for a sign: whosoever being struck shall look on it, shall live."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Fecit ergo Moyses serpentem aeneum, et posuit eum pro signo: quem cum percussi aspicerent, sanabantur."
      en: "Moses therefore made a brazen serpent, and set it up for a sign: which when they that were bitten looked upon, they were healed."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Profectique filii Israel castrametati sunt in Oboth."
      en: "And the children of Israel setting forwards camped in Oboth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Unde egressi fixere tentoria in Jeabarim, in solitudine quae respicit Moab contra orientalem plagam."
      en: "And departing thence they pitched their tents in Jeabarim, in the wilderness, that faceth Moab toward the east."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et inde moventes, venerunt ad torrentem Zared."
      en: "And removing from thence, they came to the torrent Zared:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quem relinquentes castrametati sunt contra Arnon, quae est in deserto, et prominet in finibus Amorrhaei. Siquidem Arnon terminus est Moab, dividens Moabitas et Amorrhaeos."
      en: "Which they left and encamped over against Arnon, which is in the desert and standeth out on the borders of the Amorrhite. For Arnon is the border of Moab, dividing the Moabites and the Amorrhites."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Unde dicitur in libro bellorum Domini: Sicut fecit in mari Rubro, sic faciet in torrentibus Arnon."
      en: "Wherefore it is said in the book of the wars of the Lord: As he did in the Red Sea, so will he do in the streams of Amen."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Scopuli torrentium inclinati sunt, ut requiescerent in Ar, et recumberent in finibus Moabitarum."
      en: "The rocks of the torrents were bowed down that they might rest in Ar, and lie down in the borders of the Moabites."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ex eo loco apparuit puteus, super quo locutus est Dominus ad Moysen: Congrega populum, et dabo ei aquam."
      en: "When they went from that place, the well appeared whereof the Lord said to Moses: Gather the people together, and I will give them water."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tunc cecinit Israel carmen istud: Ascendat puteus. Concinebant:"
      en: "Then Israel sung this song: Let the well spring up. They sung thereto:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Puteus, quem foderunt principes et paraverunt duces multitudinis in datore legis, et in baculis suis. De solitudine, Matthana."
      en: "The well, which the princes dug, and the chiefs of the people prepared by the direction of the lawgiver, and with their staves. And they marched from the wilderness to Mathana."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "De Matthana in Nahaliel: de Nahaliel in Bamoth."
      en: "From Mathana unto Nahaliel: from Nahaliel unto Bamoth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "De Bamoth, vallis est in regione Moab, in vertice Phasga, quod respicit contra desertum."
      en: "From Bamoth, is a valley in the country of Moab, to the top of Phasga, which looked towards the desert."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Misit autem Israel nuntios ad Sehon regem Amorrhaeorum, dicens:"
      en: "And Israel sent messengers to Sehon king of the Amorrhites, saying:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Obsecro ut transire mihi liceat per terram tuam: non declinabimus in agros et vineas; non bibemus aquas ex puteis: via regia gradiemur, donec transeamus terminos tuos."
      en: "I beseech thee that I may have leave to pass through thy land: we will not go aside into the fields or the vineyards, we will not drink waters of the wells, we will go the king's highway, till we be past thy borders."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui concedere noluit ut transiret Israel per fines suos: quin potius exercitu congregato, egressus est obviam in desertum, et venit in Jasa, pugnavitque contra eum."
      en: "And he would not grant that Israel should pass by his borders: but rather gathering an army, went forth to meet them in the desert, and came to Jasa, and fought against them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "A quo percussus est in ore gladii, et possessa est terra ejus ab Arnon usque Jeboc, et filios Ammon: quia forti praesidio tenebantur termini Ammonitarum."
      en: "And he was slain by them with the edge of the sword, and they possessed his land from the Arnon unto the Jeboc, and to the confines of the children of Ammon: for the borders of the Ammonites, were kept with a strong garrison."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Tulit ergo Israel omnes civitates ejus, et habitavit in urbibus Amorrhaei, in Hesebon scilicet, et viculis ejus."
      en: "So Israel took all his cities, and dwelt in the cities of the Amorrhite, to wit, in Hesebon, and in the villages thereof."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Urbs Hesebon fuit Sehon regis Amorrhaei, qui pugnavit contra regem Moab: et tulit omnem terram, quae ditionis illius fuerat usque Arnon."
      en: "Hesebon was the city of Sehon the king of the Amorrhites, who fought against the king of Moab: and took all the land, that had been of his dominions, as far as the Arnon."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Idcirco dicitur in proverbio: Venite in Hesebon: aedificetur, et construatur civitas Sehon:"
      en: "Therefore it is said in the proverb: Come into Hesebon, let the city of Sehon be built and set up:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ignis egressus est de Hesebon, flamma de oppido Sehon, et devoravit Ar Moabitarum, et habitatores excelsorum Arnon."
      en: "A fire is gone out of Hesebon, a flame from the city of Sehon, and hath consumed Ar of the Moabites, and the inhabitants of the high places of the Arnon."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Vae tibi Moab; peristi popule Chamos. Dedit filios ejus in fugam, et filias in captivitatem regi Amorrhaeorum Sehon."
      en: "Woe to thee Moab: thou art undone, O people of Chamos. He hath given his sons to flight, and his daughters into captivity to Sehon the king of the Amorrhites."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Jugum ipsorum disperiit ad Hesebon usque Dibon: lassi pervenerunt in Nophe, et usque Medaba."
      en: "Their yoke is perished from Hesebon unto Dibon, they came weary to Nophe, and unto Medaba."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Habitavit itaque Israel in terra Amorrhaei."
      en: "So Israel dwelt in the land of the Amorrhite."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Misitque Moyses qui explorarent Jazer: cujus ceperunt viculos, et possederunt habitatores."
      en: "And Moses sent some to take a view of Jazer: and they took the villages of it, and conquered the inhabitants."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Verteruntque se, et ascenderunt per viam Basan, et occurrit eis Og, rex Basan, cum omni populo suo, pugnaturus in Edrai."
      en: "And they turned themselves, and went up by the way of Basan, and Og the king of Basan came against them with all his people, to fight in Edrai."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Dixitque Dominus ad Moysen: Ne timeas eum, quia in manu tua tradidi illum, et omnem populum ac terram ejus: faciesque illi sicut fecisti Sehon, regi Amorrhaeorum habitatori Hesebon."
      en: "And the Lord said to Moses: Fear him not, for I have delivered him and all his people, and his country into thy hand: and thou shalt do to him as thou didst to Sehon the king of the Amorrhites, the inhabitant of Hesebon."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Percusserunt igitur et hunc cum filiis suis, universumque populum ejus usque ad internecionem, et possederunt terram illius."
      en: "So they slew him also with his sons, and all his people, not letting any one escape, and they possessed his land."
    status: { la: verified, en: verified }
