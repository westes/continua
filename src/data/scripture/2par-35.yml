# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 35
verses:
  - n: 1
    text:
      la: "Fecit autem Josias in Jerusalem Phase Domino, quod immolatum est quartadecima die mensis primi:"
      en: "And Josias kept a phase to the Lord in Jerusalem, and it was sacrificed on the fourteenth day of the first month."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et constituit sacerdotes in officiis suis, hortatusque est eos ut ministrarent in domo Domini:"
      en: "And he set the priests in their offices, and exhorted them to minister in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Levitis quoque, ad quorum eruditionem omnis Israel sanctificabatur Domino, locutus est: Ponite arcam in sanctuario templi, quod aedificavit Salomon filius David rex Israel, nequaquam enim eam ultra portabitis: nunc autem ministrate Domino Deo vestro, et populo ejus Israel."
      en: "And he spoke to the Levites, by whose instruction all Israel was sanctified to the Lord, saying: Put the ark in the sanctuary of the temple, which Solomon the son of David king of Israel built: for you shall carry it no more: but minister now to the Lord your God, and to his people Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et praeparate vos per domos, et cognationes vestras in divisionibus singulorum, sicut praecepit David, rex Israel, et descripsit Salomon, filius ejus."
      en: "And prepare yourselves by your houses, and families according to your courses, as David king of Israel commanded, and Solomon his son hath written."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ministrate in sanctuario per familias turmasque Leviticas,"
      en: "And serve ye in the sanctuary by the families and companies of Levi."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et sanctificati immolate Phase: fratres etiam vestros, ut possint juxta verba quae locutus est Dominus in manu Moysi facere, praeparate."
      en: "And being sanctified kill the phase, and prepare your brethren, that they may do according to the words which the Lord spoke by the hand of Moses."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dedit praeterea Josias omni populo, qui ibi fuerat inventus in solemnitate Phase, agnos et haedos de gregibus, et reliqui pecoris triginta millia, boum quoque tria millia: haec de regis universa substantia."
      en: "And Josias gave to all the people that were found there in the solemnity of the phase, of lambs and of kids of the flocks, and of other small cattle thirty thousand, and of oxen three thousand, all these were of the king's substance."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Duces quoque ejus sponte quod voverant, obtulerunt, tam populo, quam sacerdotibus et Levitis. Porro Helcias, et Zacharias, et Jahiel principes domus Domini dederunt sacerdotibus ad faciendum Phase pecora commixtim duo millia sexcenta, et boves trecentos."
      en: "And his princes willingly offered what they had vowed, both to the people and to the priests and the Levites. Moreover Helcias, and Zacharias, and Jahiel rulers of the house of the Lord, gave to the priests to keep the phase two thousand six hundred small cattle, and three hundred oxen."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Chonenias autem, et Semeias, etiam Nathanael fratres ejus, necnon Hasabias, et Jehiel, et Jozabad principes Levitarum, dederunt ceteris Levitis ad celebrandum Phase quinque millia pecorum, et boves quingentos."
      en: "And Chonenias, and Semeias and Nathanael, his brethren, and Hasabias, and Jehiel, and Jozabad princes of the Levites, gave to the rest of the Levites to celebrate the phase five thousand small cattle, and five hundred oxen."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Praeparatumque est ministerium, et steterunt sacerdotes in officio suo: Levitae quoque in turmis, juxta regis imperium."
      en: "And the ministry was prepared, and the priests stood in their office: the Levites also in their companies, according to the king's commandment."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et immolatum est Phase: asperseruntque sacerdotes manu sua sanguinem, et Levitae detraxerunt pelles holocaustorum:"
      en: "And the phase was immolated: and the priests sprinkled the blood with their hand, and the Levites flayed the holocausts:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et separaverunt ea ut darent per domos et familias singulorum, et offerrentur Domino, sicut scriptum est in libro Moysi: de bobus quoque fecerunt similiter."
      en: "And they separated them to give them by the houses and families of every one, and to be offered to the Lord, as it is written in the book of Moses, and with the oxen they did in like manner."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et assaverunt Phase super ignem, juxta quod in lege scriptum est: pacificas vero hostias coxerunt in lebetibus, et cacabis, et ollis, et festinato distribuerunt universae plebi:"
      en: "And they roasted the phase with fire, according to that which is written in the law: but the victims of peace offerings they boiled in caldrons, and kettles, and pots, and they distributed them speedily among all the people."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sibi autem et sacerdotibus postea paraverunt: nam in oblatione holocaustorum et adipum usque ad noctem sacerdotes fuerunt occupati: unde Levitae sibi et sacerdotibus filiis Aaron paraverunt novissimis."
      en: "And afterwards they made ready for themselves, and for the priests: for the priests were busied in offering of holocausts and the fat until night: wherefore the Levites prepared for themselves, and for the priests the sons of Aaron last."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Porro cantores filii Asaph stabant in ordine suo, juxta praeceptum David, et Asaph, et Heman, et Idithun prophetarum regis: janitores vero per portas singulas observabant, ita ut nec puncto quidem discederent a ministerio: quam ob rem et fratres eorum Levitae paraverunt eis cibos."
      en: "And the singers the sons of Asaph stood in their order, according to the commandment of David, and Asaph, and Heman, and Idithun the prophets of the king: and the porters kept guard at every gate, so as not to depart one moment from their service: and therefore their brethren the Levites prepared meats for them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Omnis igitur cultura Domini rite completa est in die illa ut facerent Phase, et offerrent holocausta super altare Domini, juxta praeceptum regis Josiae."
      en: "So all the service of the Lord was duly accomplished that day, both in keeping the phase, and offering holocausts upon the altar of the Lord, according to the commandment of king Josias."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Feceruntque filii Israel, qui reperti fuerant ibi, Phase in tempore illo, et solemnitatem azymorum septem diebus."
      en: "And the children of Israel that were found there, kept the phase at that time, and the feast of unleavened bread seven days."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Non fuit Phase simile huic in Israel a diebus Samuelis prophetae: sed nec quisquam de cunctis regibus Israel fecit Phase sicut Josias, sacerdotibus, et Levitis, et omni Judae, et Israel qui repertus fuerat, et habitantibus in Jerusalem."
      en: "There was no phase like to this in Israel, from the days of Samuel the prophet: neither did any of all the kings of Israel keep such a phase as Josias kept, with the priests, and the Levites, and all Juda, and Israel that were found, and the inhabitants of Jerusalem."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Octavodecimo anno regni Josiae hoc Phase celebratum est."
      en: "In the eighteenth year of the reign of Josias was this phase celebrated."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Postquam instauraverat Josias templum, ascendit Nechao rex Aegypti ad pugnandum in Charcamis juxta Euphraten: et processit in occursum ejus Josias."
      en: "After that Josias had repaired the temple, Nechao king of Egypt came up to fight in Charcamis by the Euphrates: and Josias went out to meet him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "At ille, missis ad eum nuntiis, ait: Quid mihi et tibi est, rex Juda? non adversum te hodie venio, sed contra aliam pugno domum, ad quam me Deus festinato ire praecepit: desine adversum Deum facere, qui mecum est, ne interficiat te."
      en: "But he sent messengers to him, saying: What have I to do with thee, O king of Juda? I come not against thee this day, but I fight against another house, to which God hath commanded me to go in haste: forbear to do against God, who is with me, lest he kill thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Noluit Josias reverti, sed praeparavit contra eum bellum, nec acquievit sermonibus Nechao ex ore Dei: verum perrexit ut dimicaret in campo Mageddo."
      en: "Josias would not return, but prepared to fight against him, and hearkened not to the words of Nechao from the mouth of God, but went to fight in the field of Mageddo."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ibique vulneratus a sagittariis, dixit pueris suis: Educite me de praelio, quia oppido vulneratus sum."
      en: "And there he was wounded by the archers, and he said to his servants: Carry me out of the battle, for I am grievously wounded."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Qui transtulerunt eum de curru in alterum currum, qui sequebatur eum more regio, et asportaverunt eum in Jerusalem, mortuusque est, et sepultus in mausoleo patrum suorum: et universus Juda et Jerusalem luxerunt eum."
      en: "And they removed him from the chariot into another, that followed him after the manner of kings, and they carried him away to Jerusalem, and he died, and was buried in the monument of his fathers, and all Juda and Jerusalem mourned for him,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Jeremias maxime: cujus omnes cantores atque cantatrices, usque in praesentem diem, lamentationes super Josiam replicant, et quasi lex obtinuit in Israel: Ecce scriptum fertur in lamentationibus."
      en: "Particularly Jeremias: whose lamentations for Josias all the singing men and singing women repeat unto this day, and it became like a law in Israel: Behold it is found written in the Lamentations."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Reliqua autem sermonum Josiae et misericordiarum ejus, quae lege praecepta sunt Domini,"
      en: "Now the rest of the acts of Josias and of his mercies, according to what was commanded by the law of the Lord:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "opera quoque illius prima et novissima, scripta sunt in libro regum Juda et Israel."
      en: "And his works first and last, are written in the book of the kings of Juda and Israel."
    status: { la: verified, en: verified }
