# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1mach
chapter: 5
verses:
  - n: 1
    text:
      la: "Et factum est, ut audierunt gentes in circuitu quia aedificatum est altare et sanctuarium sicut prius, iratae sunt valde:"
      en: "Now it came to pass, when the nations round about heard that the altar and the sanctuary were built up as before, that they were exceeding angry."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et cogitabant tollere genus Jacob, qui erant inter eos, et coeperunt occidere de populo, et persequi."
      en: "And they thought to destroy the generation of Jacob that were among them, and they began to kill some of the people, and to persecute them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et debellabat Judas filios Esau in Idumaea, et eos qui erant in Acrabathane, quia circumsedebant Israelitas: et percussit eos plaga magna."
      en: "Then Judas fought against the children of Esau in Idumea, and them that were in Acrabathane: because they beset the Israelites around about, and he made a great slaughter of them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et recordatus est malitiam filiorum Bean, qui erant populo in laqueum et in scandalum, insidiantes ei in via."
      en: "And he remembered the malice of the children of Bean: who were a snare and a stumblingblock to the people, by lying in wait for them in the way."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et conclusi sunt ab eo in turribus, et applicuit ad eos, et anathematizavit eos, et incendit turres eorum igni cum omnibus qui in eis erant."
      en: "And they were shut up by him in towers, and he set upon them, and devoted them to utter destruction, and burnt their towers with fire, and all that were in them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et transivit ad filios Ammon, et invenit manum fortem, et populum copiosum, et Timotheum ducem ipsorum:"
      en: "Then he passed over to the children of Ammon, where he found a mighty power, and much people, and Timotheus was their captain:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et commisit cum eis praelia multa, et contriti sunt in conspectu eorum, et percussit eos:"
      en: "And he fought many battles with them, and they were discomfited in their sight, and he smote them:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et cepit Gazer civitatem et filias ejus, et reversus est in Judaeam."
      en: "And he took the city of Gazer and her towns, and returned into Judea."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et congregatae sunt gentes quae sunt in Galaad adversus Israelitas, qui erant in finibus eorum, ut tollerent eos: et fugerunt in Datheman munitionem."
      en: "And the Gentiles that were in Galaad, assembled themselves together against the Israelites that were in their quarters to destroy them: and they fled into the fortress of Datheman."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et miserunt litteras ad Judam et fratres ejus, dicentes: Congregatae sunt adversum nos gentes per circuitum, ut nos auferant,"
      en: "And they sent letters to Judas and his brethren, saying, The heathens that are round about are gathered together against us, to destroy us:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et parant venire, et occupare munitionem, in quam confugimus: et Timotheus est dux exercitus eorum."
      en: "And they are preparing to come, and to take the fortress into which we are fled: and Timotheus is the captain of their host."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nunc ergo veni, et eripe nos de manibus eorum, quia cecidit multitudo de nobis."
      en: "Now therefore come, and deliver us out of their hands, for many of us are slain."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et omnes fratres nostri, qui erant in locis Tubin, interfecti sunt: et captivas duxerunt uxores eorum, et natos, et spolia, et peremerunt illic fere mille viros."
      en: "And all our brethren that were in the places of Tubin, are killed: and they have carried away their wives, and their children, captives, and taken their spoils, and they have slain there almost a thousand men."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et adhuc epistolae legebantur, et ecce alii nuntii venerunt de Galilaea conscissis tunicis, nuntiantes secundum verba haec:"
      en: "And while they were yet reading these letters, behold there came other messengers out of Galilee with their garments rent, who related according to these words:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dicentes convenisse adversum se a Ptolemaida, et Tyro, et Sidone: et repleta est omnis Galilaea alienigenis, ut nos consumant."
      en: "Saying, that they of Ptolemais, and of Tyre, and of Sidon, were assembled against them, and all Galilee is filled with strangers, in order to consume us."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ut audivit autem Judas et populus sermones istos, convenit ecclesia magna cogitare quid facerent fratribus suis, qui in tribulatione erant, et expugnabantur ab eis."
      en: "Now when Judas and all the people heard these words, a great assembly met together to consider what they should do for their brethren that were in trouble, and were assaulted by them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixitque Judas Simoni fratri suo: Elige tibi viros, et vade, et libera fratres tuos in Galilaea: ego autem et frater meus Jonathas ibimus in Galaaditim."
      en: "And Judas said to Simon his brother: Choose thee men, and go, and deliver thy brethren in Galilee: and I, and my brother Jonathan will go into the country of Galaad."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et reliquit Josephum filium Zachariae, et Azariam, duces populi, cum residuo exercitu in Judaea ad custodiam:"
      en: "And he left Joseph the son of Zacharias, and Azarias captains of the people with the remnant of the army in Judea to keep it:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et praecepit illis, dicens: Praeestote populo huic: et nolite bellum committere adversum gentes, donec revertamur."
      en: "And he commanded them, saying: Take ye the charge of this people: but make no war against the heathens, till we return."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et partiti sunt Simoni viri tria millia, ut iret in Galilaeam: Judae autem octo millia in Galaaditim."
      en: "Now three thousand men were allotted to Simon, to go into Galilee: and eight thousand to Judas to go into the land of Galaad."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et abiit Simon in Galilaeam, et commisit praelia multa cum gentibus: et contritae sunt gentes a facie ejus, et persecutus est eos usque ad portam"
      en: "And Simon went into Galilee, and fought many battles with the heathens: and the heathens were discomfited before his face, and he pursued them even to the gate of Ptolemais."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ptolemaidis: et ceciderunt de gentibus fere tria millia virorum. Et accepit spolia eorum,"
      en: "And there fell of the heathens almost three thousand men, and he took the spoils of them,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et assumpsit eos qui erant in Galilaea et in Arbatis, cum uxoribus, et natis, et omnibus quae erant illis, et adduxit in Judaeam cum laetitia magna."
      en: "And he took with him those that were in Galilee and in Arbatis with their wives, and children, and all that they had, and he brought them into Judea with great joy."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et Judas Machabaeus, et Jonathas frater ejus, transierunt Jordanem, et abierunt viam trium dierum per desertum."
      en: "And Judas Machabeus, and Jonathan his brother passed over the Jordan, and went three days' journey through the desert."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et occurrerunt eis Nabuthaei, et susceperunt eos pacifice, et narraverunt eis omnia quae acciderant fratribus eorum in Galaaditide,"
      en: "And the Nabutheans met them, and received them in a peaceable manner, and told them all that happened to their brethren in the land of Galaad,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et quia multi ex eis comprehensi sunt in Barasa, et Bosor, et in Alimis, et in Casphor, et Mageth, et Carnaim: hae omnes civitates munitae et magnae."
      en: "And that many of them were shut up in Barasa, and in Bosor, and in Alima, and in Casphor, and in Mageth, and in Carnaim: all these strong and great cities."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sed et in ceteris civitatibus Galaaditidis tenentur comprehensi, et in crastinum constituerunt admovere exercitum civitatibus his, et comprehendere, et tollere eos in una die."
      en: "Yea, and that they were kept shut up in the rest of the cities of Galaad, and that they had appointed to bring their army on the morrow near to these cities, and to take them and to destroy them all in one day."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et convertit Judas et exercitus ejus viam in desertum Bosor repente, et occupavit civitatem: et occidit omnem masculum in ore gladii, et accepit omnia spolia eorum, et succendit eam igni."
      en: "Then Judas and his army suddenly turned their march into the desert, to Bosor, and took the city: and he slew every male by the edge of the sword, and took all their spoils, and burnt it with fire."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et surrexerunt inde nocte, et ibant usque ad munitionem."
      en: "And they removed from thence by night, and went till they came to the fortress."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et factum est diluculo, cum elevassent oculos suos, ecce populus multus, cujus non erat numerus, portantes scalas et machinas ut comprehenderent munitionem, et expugnarent eos."
      en: "And it came to pass that early in the morning, when they lifted up their eyes, behold there were people without number, carrying ladders and engines to take the fortress, and assault them."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et vidit Judas quia coepit bellum, et clamor belli ascendit ad caelum sicut tuba, et clamor magnus de civitate:"
      en: "And Judas saw that the fight was begun, and the cry of the battle went up to heaven like a trumpet, and a great cry out of the city:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et dixit exercitui suo: Pugnate hodie pro fratribus vestris."
      en: "And he said to his host: Fight ye today for your brethren."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et venit tribus ordinibus post eos, et exclamaverunt tubis, et clamaverunt in oratione."
      en: "And he came with three companies behind them, and they sounded their trumpets, and cried out in prayer."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et cognoverunt castra Timothei quia Machabaeus est, et refugerunt a facie ejus: et percusserunt eos plaga magna. Et ceciderunt ex eis in die illa fere octo millia virorum."
      en: "And the host of Timotheus understood that it was Machabeus, and they fled away before his face: and they made a great slaughter of them: and there fell of them in that day almost eight thousand men."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et divertit Judas in Maspha, et expugnavit, et cepit eam: et occidit omnem masculum ejus, et sumpsit spolia ejus, et succendit eam igni."
      en: "And Judas turned aside to Maspha, and assaulted, and took it, and he slew every male thereof, and took the spoils thereof, and burnt it with fire."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Inde perrexit, et cepit Casbon, et Mageth, et Bosor, et reliquas civitates Galaaditidis."
      en: "From thence he marched, and took Casbon, and Mageth, and Bosor, and the rest of the cities of Galaad."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Post haec autem verba congregavit Timotheus exercitum alium, et castra posuit contra Raphon trans torrentem."
      en: "But after this Timotheus gathered another army, and camped over against Raphon beyond the torrent."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et misit Judas speculari exercitum: et renuntiaverunt ei, dicentes: Quia convenerunt ad eum omnes gentes quae in circuitu nostro sunt, exercitus multus nimis:"
      en: "And Judas sent men to view the army: and they brought him word, saying: All the nations, that are round about us, are assembled unto him an army exceeding great:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et Arabas conduxerunt in auxilium sibi, et castra posuerunt trans torrentem, parati ad te venire in praelium. Et abiit Judas obviam illis."
      en: "And they have hired the Arabians to help them, and they have pitched their tents beyond the torrent, ready to come to fight against thee. And Judas went to meet them."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et ait Timotheus principibus exercitus sui: Cum appropinquaverit Judas, et exercitus ejus, ad torrentem aquae: si transierit ad nos prior, non poterimus sustinere eum, quia potens poterit adversum nos;"
      en: "And Timotheus said to the captains of his army: When Judas and his army come near the torrent of water, if he pass over unto us first, we shall not be able to withstand him: for he will certainly prevail over us."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "si vero timuerit transire, et posuerit castra extra flumen, transfretamus ad eos, et poterimus adversus illum."
      en: "But if he be afraid to pass over, and camp on the other side of the river, we will pass over to them and shall prevail against him."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Ut autem appropinquavit Judas ad torrentem aquae, statuit scribas populi secus torrentem, et mandavit eis, dicens: Neminem hominem reliqueritis, sed veniant omnes in praelium."
      en: "Now when Judas came near the torrent of water, he set the scribes of the people by the torrent, and commanded them, saying: Suffer no man to stay behind: but let all come to the battle."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et transfretavit ad illos prior, et omnis populus post eum, et contritae sunt omnes gentes a facie eorum, et projecerunt arma sua, et fugerunt ad fanum, quod erat in Carnaim."
      en: "And he passed over to them first, and all the people after him, and all the heathens were discomfited before them, and they threw away their weapons, and fled to the temple that was in Carnaim."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et occupavit ipsam civitatem, et fanum succendit igni cum omnibus qui erant in ipso: et oppressa est Carnaim, et non potuit sustinere contra faciem Judae."
      en: "And he took that city, and the temple he burnt with fire, with all things that were therein: and Carnaim was subdued, and could not stand against the face of Judas."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et congregavit Judas universos Israelitas, qui erant in Galaaditide, a minimo usque ad maximum, et uxores eorum, et natos, et exercitum magnum valde, ut venirent in terram Juda."
      en: "And Judas gathered together all the Israelites that were in the land of Galaad, from the least even to the greatest, and their wives, and children, and an army exceeding great, to come into the land of Juda."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Et venerunt usque Ephron: et haec civitas magna in ingressu posita, munita valde, et non erat declinare ab ea dextera vel sinistra, sed per mediam iter erat."
      en: "And they came as far as Ephron: now this was a great city situate in the way, strongly fortified, and there was no means to turn from it on the right hand or on the left, but the way was through the midst of it."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et incluserunt se qui erant in civitate, et obstruxerunt portas lapidibus: et misit ad eos Judas verbis pacificis,"
      en: "And they that were in the city, shut themselves in, and stopped up the gates with stones: and Judas sent to them with peaceable words,"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "dicens: Transeamus per terram vestram, ut eamus in terram nostram: et nemo vobis nocebit, tantum pedibus transibimus. Et nolebant eis aperire."
      en: "Saying: Let us pass through your land, to go into our country: and no man shall hurt you: we will only pass through on foot. But they would not open to them."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et praecepit Judas praedicare in castris, ut applicarent unusquisque in quo erat loco:"
      en: "Then Judas commanded proclamation to be made in the camp, that they should make an assault every man in the place where he was."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et applicuerunt se viri virtutis, et oppugnavit civitatem illam tota die et tota nocte, et tradita est civitas in manu ejus:"
      en: "And the men of the army drew near, and he assaulted that city all the day, and all the night, and the city was delivered into his hands:"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et peremerunt omnem masculum in ore gladii, et eradicavit eam, et accepit spolia ejus: et transivit per totam civitatem super interfectos."
      en: "And they slew every male with the edge of the sword, and he razed the city, and took the spoils thereof, and passed through all the city over them that were slain."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Et transgressi sunt Jordanem in campo magno, contra faciem Bethsan."
      en: "Then they passed over the Jordan to the great plain that is over against Bethsan."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Et erat Judas congregans extremos, et exhortabatur populum per totam viam, donec venirent in terram Juda:"
      en: "And Judas gathered together the hindmost, and he exhorted the people all the way through, till they came into the land of Juda."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "et ascenderunt in montem Sion cum laetitia, et gaudio, et obtulerunt holocausta, quod nemo ex eis cecidisset donec reverterentur in pace."
      en: "And they went up to mount Sion with joy and gladness, and offered holocausts, because not one of them was slain, till they had returned in peace."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Et in diebus quibus erat Judas et Jonathas in terra Galaad, et Simon frater ejus in Galilaea contra faciem Ptolemaidis,"
      en: "Now in the days that Judas and Jonathan were in the land of Galaad, and Simon his brother in Galilee before Ptolemais,"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "audivit Josephus Zachariae filius, et Azarias princeps virtutis, res bene gestas, et praelia quae facta sunt,"
      en: "Joseph the son of Zacharias, and Azarias captain of the soldiers, heard of the good success, and the battles that were fought."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "et dixit: Faciamus et ipsi nobis nomen, et eamus pugnare adversus gentes quae in circuitu nostro sunt."
      en: "And he said: Let us also get us a name, and let us go fight against the Gentiles that are round about us."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Et praecepit his qui erant in exercitu suo, et abierunt Jamniam."
      en: "And he gave charge to them that were in his army, and they went towards Jamnia."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Et exivit Gorgias de civitate, et viri ejus obviam illis in pugnam."
      en: "And Gorgias and his men went out of the city, to give them battle."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Et fugati sunt Josephus et Azarias usque in fines Judaeae: et ceciderunt illo die de populo Israel ad duo millia viri, et facta est fuga magna in populo:"
      en: "And Joseph and Azarias were put to flight, and were pursued unto the borders of Judea: and there fell, on that day, of the people of Israel about two thousand men, and there was a great overthrow of the people:"
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "quia non audierunt Judam, et fratres ejus, existimantes fortiter se facturos."
      en: "Because they did not hearken to Judas, and his brethren, thinking that they should do manfully."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Ipsi autem non erant de semine virorum illorum, per quos salus facta est in Israel."
      en: "But they were not of the seed of those men by whom salvation was brought to Israel."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Et viri Juda magnificati sunt valde in conspectu omnis Israel, et gentium omnium ubi audiebatur nomen eorum."
      en: "And the men of Juda were magnified exceedingly in the sight of all Israel, and of all the nations where their name was heard."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Et convenerunt ad eos fausta acclamantes."
      en: "And people assembled to them with joyful acclamations."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "Et exivit Judas et fratres ejus, et expugnabant filios Esau in terra quae ad austrum est, et percussit Chebron et filias ejus: et muros ejus, et turres succendit igni in circuitu."
      en: "Then Judas and his brethren went forth and attacked the children of Esau, in the land toward the south, and he took Chebron, and her towns: and he burnt the walls thereof and the towers all round it."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "Et movit castra ut iret in terram alienigenarum, et perambulabat Samariam."
      en: "And he removed his camp to go into the land of the aliens, and he went through Samaria."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "In die illa ceciderunt sacerdotes in bello, dum volunt fortiter facere, dum sine consilio exeunt in praelium."
      en: "In that day some priests fell in battle, while desiring to do manfully they went out unadvisedly to fight."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "Et declinavit Judas in Azotum in terram alienigenarum, et diruit aras eorum, et sculptilia deorum ipsorum succendit igni: et cepit spolia civitatum, et reversus est in terram Juda."
      en: "And Judas turned to Azotus into the land of the strangers, and he threw down their altars, and he burnt the statues of their gods with fire: and he took the spoils of the cities, and returned into the land of Juda."
    status: { la: verified, en: verified }
