# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 13
verses:
  - n: 1
    text:
      la: "Josue senex provectaeque aetatis erat, et dixit Dominus ad eum: Senuisti, et longaevus es, terraque latissima derelicta est, quae necdum sorte divisa est:"
      en: "Josue was old, and far advanced in years, and the Lord said to him: Thou art grown old, and advanced in age, and there is a very large country left, which is not yet divided by lot:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "omnis videlicet Galilaea, Philisthiim, et universa Gessuri."
      en: "To wit, all Galilee, Philistia, and all Gessuri."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "A fluvio turbido, qui irrigat Aegyptum, usque ad terminos Accaron contra aquilonem: terra Chanaan, quae in quinque regulos Philisthiim dividitur, Gazaeos, et Azotios, Ascalonitas, Gethaeos, et Accaronitas."
      en: "From the troubled river, that watereth Egypt, unto the borders of Accaron northward: the land of Chanaan, which is divided among the lords of the Philistines, the Gazites, the Azotians, the Ascalonites, the Gethites, and the Accronites."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ad meridiem vero sunt Hevaei, omnis terra Chanaan, et Maara Sidoniorum, usque Apheca et terminos Amorrhaei,"
      en: "And on the south side are the Hevites, all the land of Chanaan, and Maara of the Sidonians as far as Apheca, and the borders of the Amorrhite,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ejusque confinia. Libani quoque regio contra orientem, a Baalgad sub monte Hermon, donec ingrediaris Emath."
      en: "And his confines. The country also of Libanus towards the east from Baalgad under mount Hermon to the entering into Emath."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Omnium qui habitant in monte a Libano usque ad aquas Maserephoth, universique Sidonii. Ego sum qui delebo eos a facie filiorum Israel. Veniat ergo in partem haereditatis Israel, sicut praecepi tibi."
      en: "Of all that dwell in the mountains from Libanus, to the waters of Maserephoth, and all the Sidonians. I am he that will cut them off from before the face of the children of Israel. So let their land come in as a part of the inheritance of Israel, as I have commanded thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et nunc divide terram in possessionem novem tribubus, et dimidiae tribui Manasse,"
      en: "And now divide the land in possession to the nine tribes, and to the half tribe of Manasses,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cum qua Ruben et Gad possederunt terram, quam tradidit eis Moyses famulus Domini trans fluenta Jordanis, ad orientalem plagam."
      en: "With whom Ruben and Gad have possessed the land, which Moses the servant of the Lord delivered to them beyond the river Jordan, on the east side."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ab Aroer, quae sita est in ripa torrentis Arnon, et in vallis medio, universaque campestria Medaba, usque Dibon,"
      en: "From Aroer, which is upon the bank of the torrent Arnon, and in the midst of the valley and all the plains of Medaba, as far as Dibon:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et cunctas civitates Sehon regis Amorrhaei, qui regnavit in Hesebon, usque ad terminos filiorum Ammon,"
      en: "And all the cities of Sehon, king of the Amorrhites, who reigned in Hesebon, unto the borders of the children of Ammon."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et Galaad, ac terminum Gessuri et Machati, et omnem montem Hermon, et universam Basan, usque ad Salecha,"
      en: "And Galaad, and the borders of Gessuri and Machati, and all mount Hermon, and all Basan as far as Salecha,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "omne regnum Og in Basan, qui regnavit in Astaroth et Edrai, ipse fuit de reliquiis Raphaim: percussitque eos Moyses, atque delevit."
      en: "All the kingdom of Og in Basan, who reigned in Astaroth and Edrai, he was of the remains of the Raphaims: and Moses overthrew and destroyed them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nolueruntque disperdere filii Israel Gessuri et Machati: et habitaverunt in medio Israel usque in praesentem diem."
      en: "And the children of Israel would not destroy Gessuri and Machati: and they have dwelt in the midst of Israel, until this present day."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tribui autem Levi non dedit possessionem: sed sacrificia et victimae Domini Dei Israel, ipsa est ejus haereditas, sicut locutus est illi."
      en: "But to the tribe of Levi he gave no possession: but the sacrifices and victims of the Lord God of Israel, are his inheritance, as he spoke to him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dedit ergo Moyses possessionem tribui filiorum Ruben juxta cognationes suas."
      en: "And Moses gave a possession to the children of Ruben according to their kindreds."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Fuitque terminus eorum ab Aroer, quae sita est in ripa torrentis Arnon, et in valle ejusdem torrentis media: universam planitiem, quae ducit Medaba,"
      en: "And their border was from Aroer, which is on the bank of the torrent Arnon, and in the midst of the valley of the same torrent: all the plain, that leadeth to Medaba,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et Hesebon, cunctosque viculos earum, qui sunt in campestribus: Dibon quoque et Bamothbaal, et oppidum Baalmaon,"
      en: "And Hesebon, and all their villages, which are in the plains. Dibon also, and Bamothbaal, and the town of Baalmaon,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et Jassa, et Cedimoth, et Mephaath,"
      en: "And Jassa, and Cidimoth, and Mephaath,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et Cariathaim, et Sabama, et Sarathasar in monte convallis."
      en: "And Cariathaim, and Sabama, and Sarathasar in the mountain of the valley."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Bethphogor et Asedoth, Phasga et Bethiesimoth,"
      en: "Bethphogor and Asedoth, Phasga and Bethiesimoth,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et omnes urbes campestres, universaque regna Sehon regis Amorrhaei, qui regnavit in Hesebon, quem percussit Moyses cum principibus Madian: Hevaeum, et Recem, et Sur, et Hur, et Rebe duces Sehon habitatores terrae."
      en: "And all the cities of the plain, and all the kingdoms of Sehon king of the Amorrhites, that reigned in Hesebon, whom Moses slew with the princes of Madian: Hevi, and Recem, and Sur and Hur, and Rebe, dukes of Sehon inhabitants of the land."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et Balaam filium Beor ariolum occiderunt filii Israel gladio cum ceteris interfectis."
      en: "Balaam also the son of Beer the soothsayer, the children of Israel slew with the sword among the rest that were slain."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Factusque est terminus filiorum Ruben Jordanis fluvius. Haec est possessio Rubenitarum per cognationes suas urbium et viculorum."
      en: "And the river Jordan was the herder of the children of Ruben. This is the possession of the Rubenites, by their kindreds, of cities and villages."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Deditque Moyses tribui Gad et filiis ejus per cognationes suas possessionem, cujus haec divisio est."
      en: "And Moses gave to the tribe of Gad and to his children by their kindreds a possession, of which this is the division."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Terminus Jaser, et omnes civitates Galaad, et dimidiam partem terrae filiorum Ammon, usque ad Aroer, quae est contra Rabba,"
      en: "The border of Jaser, and all the cities of Galaad, and half the land of the children of Ammon: as far as Aroer which is over against Rabba:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ab Hesebon usque Ramoth, Masphe et Betonim: et a Manaim usque ad terminos Dabir."
      en: "And from Hesebon unto Ramoth, Masphe and Betonim: and from Manaim unto the borders of Dabir."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "In valle quoque Betharan, et Bethnemra, et Socoth, et Saphon reliquam partem regni Sehon regis Hesebon: hujus quoque finis, Jordanis est, usque ad extremam partem maris Cenereth trans Jordanem ad orientalem plagam."
      en: "And in the valley Betharan and Bethnemra, and Socoth, and Saphon the other part of the kingdom of Sehon king of Hesebon: the limit of this also is the Jordan, as far as the uttermost part of the sea of Cenereth beyond the Jordan on the east side."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Haec est possessio filiorum Gad per familias suas, civitates et villae earum."
      en: "This is the possession of the children of Gad by their families, their cities, and villages."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Dedit et dimidiae tribui Manasse, filiisque ejus juxta cognationes suas possessionem,"
      en: "He gave also to the half tribe of Manasses and his children possession according to their kindreds,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "cujus hoc principium est: a Manaim universam Basan, et cuncta regna Og regis Basan, omnesque vicos Jair, qui sunt in Basan, sexaginta oppida:"
      en: "The beginning whereof is this: from Manaim all Basan, and all the kingdoms of Og king of Basan, and all the villages of Jair, which are in Basan, threescore towns."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et dimidiam partem Galaad, et Astaroth, et Edrai, urbes regni Og in Basan: filiis Machir, filii Manasse, dimidiae parti filiorum Machir juxta cognationes suas."
      en: "And half Galaad, and Astaroth, and Edrai, cities of the kingdom of Og in Basan: to the children of Machir, the son of Manasses, to one half of the children of Machir according to their kindreds."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Hanc possessionem divisit Moyses in campestribus Moab trans Jordanem contra Jericho ad orientalem plagam."
      en: "This possession Moses divided in the plains of Moab, beyond the Jordan, over against Jericho on the east side."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Tribui autem Levi non dedit possessionem: quoniam Dominus Deus Israel ipse est possessio ejus, ut locutus est illi."
      en: "But to the tribe of Levi he gave no possession: because the Lord the God of Israel himself is their possession, as he spoke to them."
    status: { la: verified, en: verified }
