# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: tob
chapter: 6
verses:
  - n: 1
    text:
      la: "profectusque est Tobias et canis secutus est eum et mansit prima mansione iuxta fluvium Tigris"
      en: "And Tobias went forward, and the dog followed him, and he lodged the first night by the river of Tigris."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et exivit ut lavaret pedes suos et ecce piscis inmanis exivit ad devorandum eum"
      en: "And he went out to wash his feet, and behold a monstrous fish came up to devour him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quem expavescens clamavit voce magna dicens Domine invadet me"
      en: "And Tobias being afraid of him, cried out with a loud voice, saying: Sir, he cometh upon me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixit ei angelus adprehende brancia eius et trahe eum ad te quod cum fecisset adtraxit eum in sicco et palpitare coepit ante pedes eius"
      en: "And the angel said to him: Take him by the gill, and draw him to thee. And when he had done so, he drew him out upon the land, and he began to pant before his feet."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tunc dixit ei angelus extentera hunc piscem et cor eius et fel eius et iecur repone tibi sunt enim haec necessaria ad medicamenta utiliter"
      en: "Then the angel said to him: Take out the entrails of the fish, and lay up his heart, and his gall, and his liver for thee: for these are necessary for useful medicines."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quod cum fecisset assavit carnes eius et secum sustulerunt in via cetera salierunt quae sufficerent eis quousque pervenirent in Rages civitatem Medorum"
      en: "And when he had done so, he roasted the flesh thereof, and they took it with them in the way: the rest they salted as much as might serve them, till they came to Rages the city of the Medes."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tunc interrogavit Tobias angelum et dixit ei obsecro te Azarias frater ut dicas mihi quod remedium habebunt ista quae de pisce servare iussisti"
      en: "Then Tobias asked the angel, and said to him: I beseech thee, brother Azarias, tell me what remedies are these things good for, which thou hast bid me keep of the fish?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "respondensque dixit ei cordis eius particulam si super carbones ponas fumus eius extricat omne daemonium sive a viro sive a muliere ita ut ultra non accedat ad eos"
      en: "And the angel, answering, said to him: If thou put a little piece of its heart upon coals, the smoke thereof driveth away all kind of devils, either from man or from woman, so that they come no more to them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "[]"
      en: "And the gall is good for anointing the eyes, in which there is a white speck, and they shall be cured."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et dixit ei ubi vis ut maneamus"
      en: "And Tobias said to him: Where wilt thou that we lodge?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "respondensque angelus ait est hic Raguhel nomine propinquus vir de tribu tua et hic habet filiam nomine Sarram sed neque masculum neque feminam ullum habet alium praeter eam"
      en: "And the angel answering, said: Here is one whose name is Raguel, a near kinsman of thy tribe, and he hath a daughter named Sara, but he hath no son nor any other daughter beside her."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tibi debetur omnis substantia eius et oportet te eam accipere coniugem"
      en: "All his substance is due to thee, and thou must take her to wife."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "pete ergo eam a patre eius et dabit tibi eam uxorem"
      en: "Ask her therefore of her father, and he will give her thee to wife."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tunc respondit Tobias et dixit audio quia tradita est viris septem et mortui sunt sed et haec audivi quia daemonium illos occidit"
      en: "Then Tobias answered, and said: I hear that she hath been given to seven husbands, and they all died: moreover I have heard, that a devil killed them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "timeo ergo ne forte mihi haec eveniant et cum sim unicus parentibus meis deponam senectutem illorum cum tristitia ad infernum"
      en: "Now I am afraid, lest the same thing should happen to me also: and whereas I am the only child of my parents, I should bring down their old age with sorrow to hell."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tunc angelus Rafahel dixit ei audi me et ostendam tibi qui sunt quibus praevalere potest daemonium"
      en: "Then the angel Raphael said to him: Hear me, and I will shew thee who they are, over whom the devil can prevail."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "hii namque qui coniugium ita suscipiunt ut Deum a se sua mente excludant et suae libidini ita vacent sicut equus et mulus in quibus non est intellectus habet potestatem daemonium super eos"
      en: "For they who in such manner receive matrimony, as to shut out God from themselves, and from their mind, and to give themselves to their lust, as the horse and mule, which have not understanding, over them the devil hath power."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "tu autem cum acceperis eam ingressus cubiculum per tres dies continens esto ab ea et nihil aliud nisi orationibus vacabis cum ea"
      en: "But thou when thou shalt take her, go into the chamber, and for three days keep thyself continent from her, and give thyself to nothing else but to prayers with her."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ipsa autem nocte incenso iecore piscis fugabitur daemonium"
      en: "And on that night lay the liver of the fish on the fire, and the devil shall be driven away."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "secunda vero nocte in copulatione sanctorum patriarcharum admitteris"
      en: "But the second night thou shalt be admitted into the society of the holy Patriarchs."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "tertia autem nocte benedictione consequeris ut filii ex vobis incolomes procreentur"
      en: "And the third night thou shalt obtain a blessing that sound children may be born of you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "transacta autem tertia nocte accipies virginem cum timore Domini amore filiorum magis quam libidinis ductus ut in semine Abrahae benedictionem in filiis consequaris"
      en: "And when the third night is past, thou shalt take the virgin with the fear of the Lord, moved rather for love of children than for lust, that in the seed of Abraham thou mayst obtain a blessing in children."
    status: { la: verified, en: verified }
