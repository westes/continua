# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 27
verses:
  - n: 1
    text:
      la: "filii autem Israhel secundum numerum suum principes familiarum tribuni et centuriones et praefecti qui ministrabant regi iuxta turmas suas ingredientes et egredientes per singulos menses in anno viginti quattuor milibus singuli praeerant"
      en: "Now the children of Israel according to their number, the heads of families, captains of thousands and of hundreds, and officers, that served the king according to their companies, who came in and went out every month in the year, under every chief were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "primae turmae in primo mense Isboam praeerat filius Zabdihel et sub eo viginti quattuor milia"
      en: "Over the first company the first month Jesboam, the son of Zabdiel was chief, and under him were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "de filiis Phares princeps cunctorum principum in exercitu mense primo"
      en: "Of the sons of Phares, the chief of all the captains in the host in the first month."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "secundi mensis habebat turmam Dudi Ahohites et post se alterum nomine Macelloth qui regebat partem exercitus viginti quattuor milium"
      en: "The company of the second month was under Dudia, an Ahohite, and after him was another named Macelloth, who commanded a part of the army of four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dux quoque turmae tertiae in mense tertio erat Banaias filius Ioiadae sacerdos et in divisione sua viginti quattuor milia"
      en: "And the captain of the third company for the third month, was Banaias the son of Joiada the priest: and in his division were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ipse est Banaias fortissimus inter triginta et super triginta praeerat autem turmae ipsius Amizabad filius eius"
      en: "This is that Banaias the most valiant among the thirty, and above the thirty. And Amizabad his son commanded his company."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quartus mense quarto Asahel frater Ioab et Zabadias filius eius post eum et in turma eius viginti quattuor milia"
      en: "The fourth, for the fourth month, was Asahel the brother of Joab, and Zabadias his son after him: and in his company were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quintus mense quinto princeps Samaoth Iezarites et in turma eius viginti quattuor milia"
      en: "The fifth captain for the fifth month, was Samaoth a Jezerite: and his company were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sextus mense sexto Hira filius Acces Thecuites et in turma eius viginti quattuor milia"
      en: "The sixth, for the sixth month, was Hira the son of Acces a Thecuite: and in his company were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "septimus mense septimo Helles Phallonites de filiis Ephraim et in turma eius viginti quattuor milia"
      en: "The seventh, for the seventh month, was Helles a Phallonite of the sons of Ephraim: and in his company were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "octavus mense octavo Sobochai Asothites de stirpe Zarai et in turma eius viginti quattuor milia"
      en: "The eighth, for the eighth month, was Sobochai a Husathite of the race of Zarahi: and in his company were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nonus mense nono Abiezer Anathothites de filiis Iemini et in turma eius viginti quattuor milia"
      en: "The ninth, for the ninth month, was Abiezer an Anathothite of the sons of Jemini, and in His company were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "decimus mense decimo Marai et ipse Netophathites de stirpe Zarai et in turma eius viginti quattuor milia"
      en: "The tenth, for the tenth month, was Marai, who was a Netophathite of the race of Zarai: and in his company were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "undecimus mense undecimo Banaias Pharathonites de filiis Ephraim et in turma eius viginti quattuor milia"
      en: "The eleventh, for the eleventh month, was Banaias, a Pharathonite of the sons of Ephraim: and in his company were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "duodecimus mense duodecimo Holdai Netophathites de stirpe Gothonihel et in turma eius viginti quattuor milia"
      en: "The twelfth, for the twelfth month, was Holdai a Netophathite, of the race of Gothoniel: and in his company were four and twenty thousand."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "porro tribubus praeerant Israhel Rubenitis dux Eliezer filius Zechri Symeonitis dux Saphatias filius Macha"
      en: "Now the chiefs over the tribes of Israel were these: over the Rubenites, Eliezer the son of Zechri was ruler: over the Simeonites, Saphatias the son of Maacha :"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Levitis Asabias filius Camuhel Aaronitis Sadoc"
      en: "Over the Levites, Hasabias the son of Camuel: over the Aaronites, Sadoc:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Iuda Heliu frater David Isachar Amri filius Michahel"
      en: "Over Juda, Eliu the brother of David: over Issachar, Amri the son of Michael:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Zabulonitis Iesmaias filius Abdiae Nepthalitibus Ierimoth filius Ozihel"
      en: "Over the Zabulonites, Jesmaias the son of Adias : over the Nephtalites, Jerimoth the son of Ozriel:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "filiis Ephraim Osee filius Ozaziu dimidio tribus Manasse Iohel filius Phadiae"
      en: "Over the sons of Ephraim, Osee the: son of Ozaziu: over the half tribe of Manasses, Joel the son of Phadaia:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et dimidio tribus Manasse in Galaad Iaddo filius Zacchariae Beniamin autem Iasihel filius Abner"
      en: "And over the half tribe of Manasses: in Galaad, Jaddo the son of Zacharias: and over Benjamin, Jasiel the son of Abner."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dan vero Ezrihel filius Hieroam hii principes filiorum Israhel"
      en: "And over Dan, Ezrihel the son of Jeroham: these were the princes of the children of Israel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "noluit autem David numerare eos a viginti annis inferius quia dixerat Dominus ut multiplicaret Israhel quasi stellas caeli"
      en: "But David would not number them from twenty years old and under: because the Lord had said that he would multiply Israel like the stars of heaven."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ioab filius Sarviae coeperat numerare nec conplevit quia super hoc ira inruerat in Israhel et idcirco numerus eorum qui fuerant recensiti non est relatus in fastos regis David"
      en: "Joab the son of Sarvia began to number, but he finished not: because upon this there fell wrath upon Israel: and therefore the number of them that were numbered, was not registered in the chronicles of king David."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "super thesauros autem regis fuit Azmoth filius Adihel his autem thesauris qui erant in urbibus et in vicis et in turribus praesidebat Ionathan filius Oziae"
      en: "And over the king's treasures was Azmoth the son of Adiel: and over those stores which were in the cities, and is the villages, and in the castles, was Jonathan the son of Ozias."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "operi autem rustico et agricolis qui exercebant terram praeerat Ezri filius Chelub"
      en: "And over the tillage, and the husbandmen, who tilled the ground, was Ezri the son of Chelub:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "vinearumque cultoribus Semeias Ramathites cellis autem vinariis Zabdias Aphonites"
      en: "And over the dressers of the vineyards, was Semeias a Romathite: and over the wine cellars, Zabdias an Aphonite."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "nam super oliveta et ficeta quae erant in campestribus Balanan Gaderites super apothecas autem olei Ioas"
      en: "And over the oliveyards and the fig groves, which were in the plains, was Balanam a Gederite: and over the oil cellars, Joas."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "porro armentis quae pascebantur in Sarona praepositus fuit Setrai Saronites et super boves in vallibus Saphat filius Adli"
      en: "And over the herds that fed in Saron, was Setrai a Saronite: and over the. oxen in the valleys, Saphat the son of Adli:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "super camelos vero Ubil Ismahelites et super asinos Iadias Meronathites"
      en: "And over the camels, Ubil an Ishmahelite: and over the asses, Jadias a Meronathite:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "super oves quoque Iaziz Agarenus omnes hii principes substantiae regis David"
      en: "And over the sheep Jazia an Agarene. All these were the rulers of the substance of king David."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Ionathan autem patruus David consiliarius vir prudens et litteratus ipse et Iaihel filius Achamoni erant cum filiis regis"
      en: "And Jonathan David's uncle, a counsellor, a wise and learned man: he and Jahiel the son of Hachamoni were with the king's sons."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Ahitophel etiam consiliarius regis et Husi Arachites amicus regis"
      en: "And Achitophel was the king's counsellor, and Chusai the Arachite, the king's friend."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "post Ahitophel fuit Ioiada filius Banaiae et Abiathar princeps autem exercitus regis erat Ioab"
      en: "And after Achitophel was Joiada the son of Banaias, and Abiathar. And the general of the king's army was Joab."
    status: { la: verified, en: verified }
