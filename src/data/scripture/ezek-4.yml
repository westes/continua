# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 4
verses:
  - n: 1
    text:
      la: "Et tu, fili hominis, sume tibi laterem, et pones eum coram te, et describes in eo civitatem Jerusalem."
      en: "And thou, O son of man, take thee a tile, and lay it before thee: and draw upon it the plan of the city of Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et ordinabis adversus eam obsidionem, et aedificabis munitiones, et comportabis aggerem et dabis contra eam castra, et pones arietes in gyro."
      en: "And lay siege against it, and build forts, and cast up a mount, and set a camp against it, and place battering rams round about it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et tu sume tibi sartaginem ferream, et pones eam in murum ferreum inter te et inter civitatem: et obfirmabis faciem tuam ad eam, et erit in obsidionem, et circumdabis eam: signum est domui Israel."
      en: "And take unto thee an iron pan, and set it for a wall of iron between thee and the city: and set thy face resolutely against it, and it shall be besieged, and thou shalt lay siege against it: it is a sign to the house of Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et tu dormies super latus tuum sinistrum, et pones iniquitates domus Israel super eo, numero dierum quibus dormies super illud, et assumes iniquitatem eorum."
      en: "And thou shalt sleep upon thy left side, and shalt lay the iniquities of the house of Israel upon it, according to the number of the days that thou shalt sleep upon it, and thou shalt take upon thee their iniquity."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ego autem dedi tibi annos iniquitatis eorum, numero dierum trecentos et nonaginta dies, et portabis iniquitatem domus Israel."
      en: "And I have laid upon thee the years of their iniquity, according to the number of the days three hundred and ninety days: and thou shalt bear the iniquity of the house of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et cum compleveris haec, dormies super latus tuum dexterum secundo, et assumes iniquitatem domus Juda quadraginta diebus: diem pro anno, diem, inquam, pro anno, dedi tibi."
      en: "And when thou hast accomplished this, thou shalt sleep again upon thy right side, and thou shalt take upon thee the iniquity of the house of Juda forty days: a day for a year, yea, a day for a year I have appointed to thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ad obsidionem Jerusalem convertes faciem tuam, et brachium tuum erit extentum: et prophetabis adversus eam."
      en: "And thou shalt turn thy face to the siege of Jerusalem, and thy arm shall be stretched out: and thou shalt prophesy against it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ecce circumdedi te vinculis: et non te convertes a latere tuo in latus aliud, donec compleas dies obsidionis tuae."
      en: "Behold I have encompassed thee with bands: and thou shalt not turn thyself from one side to the other, till thou hast ended the days of thy siege."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et tu, sume tibi frumentum, et hordeum, et fabam, et lentem, et milium, et viciam: et mittes ea in vas unum, et facies tibi panes numero dierum quibus dormies super latus tuum: trecentis et nonaginta diebus comedes illud."
      en: "And take to thee wheat and barley, and beans, and lentils, and millet, and fitches, and put them in one vessel, and make thee bread thereof according to the number of the days that thou shalt lie upon thy side: three hundred and ninety days shalt thou eat thereof."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cibus autem tuus, quo vesceris, erit in pondere viginti stateres in die: a tempore usque ad tempus comedes illud."
      en: "And thy meat that thou shalt eat, shall be in weight twenty staters a day: from time to time thou shalt eat it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et aquam in mensura bibes, sextam partem hin: a tempore usque ad tempus bibes illud."
      en: "And thou shalt drink water by measure, the sixth part of a hin: from time to time thou shalt drink it,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et quasi subcinericium hordeaceum comedes illud, et stercore quod egreditur de homine operies illud in oculis eorum."
      en: "And thou shalt eat it as barley bread baked under the ashes: and thou shalt cover it, in their sight, with the dung that cometh out of a man."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dixit Dominus: Sic comedent filii Israel panem suum pollutum inter gentes ad quas ejiciam eos. Et dixi:"
      en: "And the Lord said: So shall the children of Israel eat their bread all filthy among the nations whither I will cast them out."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "A, a, a, Domine Deus, ecce anima mea non est polluta: et morticinum, et laceratum a bestiis non comedi ab infantia mea usque nunc, et non est ingressa in os meum omnis caro immunda."
      en: "And I said: Ah, ah, ah, O Lord God, behold my soul hath not been defiled, and from my infancy even till now, I have not eaten any thing that died of itself, or was torn by beasts, and no unclean flesh hath entered into my mouth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et dixit ad me: Ecce dedi tibi fimum boum pro stercoribus humanis, et facies panem tuum in eo."
      en: "And he said to me: Behold I have given thee neat's dung for man's dung, and thou shalt make thy bread therewith."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et dixit ad me: Fili hominis, ecce ego conteram baculum panis in Jerusalem, et comedent panem in pondere et in sollicitudine, et aquam in mensura et in angustia bibent,"
      en: "And he said to me: Son of man: Behold, I will break in pieces the staff of bread in Jerusalem: and they shall eat bread by weight, and with care: and they shall drink water by measure, and in distress."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut deficientibus pane et aqua, corruat unusquisque ad fratrem suum, et contabescant in iniquitatibus suis."
      en: "So that when bread and water fail, every man may fall against his brother, and they may pine away in their iniquities."
    status: { la: verified, en: verified }
