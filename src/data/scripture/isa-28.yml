# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 28
verses:
  - n: 1
    text:
      la: "vae coronae superbiae ebriis Ephraim et flori decidenti gloriae exultationis eius qui erant in vertice vallis pinguissimae errantes a vino"
      en: "Woe to the crown of pride, to the drunkards of Ephraim, and to the fading flower the glory of his joy, who were on the head of the fat valley, staggering with wine."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ecce validus et fortis Domini sicut impetus grandinis turbo confringens sicut impetus aquarum multarum inundantium et emissarum super terram spatiosam"
      en: "Behold the Lord is mighty and strong, as a storm of hail: a destroying whirlwind, as the violence of many waters overflowing, and sent forth upon a spacious land."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "pedibus conculcabitur corona superbiae ebriorum Ephraim"
      en: "The crown of pride of the drunkards of Ephraim shall be trodden under feet."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et erit flos decidens gloriae exultationis eius qui est super verticem vallis pinguium quasi temporaneum ante maturitatem autumni quod cum aspexerit videns statim ut manu tenuerit devorabit illud"
      en: "And the fading flower the glory of his joy, who is on the head of the fat valley, shall be as a hasty fruit before the ripeness of autumn: which when he that seeth it shall behold, as soon as he taketh it in his hand, he will eat it up."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in die illa erit Dominus exercituum corona gloriae et sertum exultationis residuo populi sui"
      en: "In that day the Lord of hosts shall be a crown of glory, and a garland of joy to the residue of his people:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et spiritus iudicii sedenti super iudicium et fortitudo revertentibus de bello ad portam"
      en: "And a spirit of judgment to him that sitteth in judgment, and strength to them that return out of the battle to the gate."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "verum hii quoque prae vino nescierunt et prae ebrietate erraverunt sacerdos et propheta nescierunt prae ebrietate absorti sunt a vino erraverunt in ebrietate nescierunt videntem ignoraverunt iudicium"
      en: "But these also have been ignorant through wine, and through drunkenness have erred: the priest and the prophet have been ignorant through drunkenness, they are swallowed up with wine, they have gone astray in drunkenness, they have not known him that seeth, they have been ignorant of judgment."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "omnes enim mensae repletae sunt vomitu sordiumque ita ut non esset ultra locus"
      en: "For all tables were full of vomit and filth, so that there was no more place."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quem docebit scientiam et quem intellegere faciet auditum ablactatos a lacte apulsos ab uberibus"
      en: "Whom shall he teach knowledge? and whom shall he make to understand the hearing? them that are weaned from the milk, that are drawn away from the breasts."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quia manda remanda manda remanda expecta reexpecta expecta reexpecta modicum ibi modicum ibi"
      en: "For command, command again; command, command again; expect, expect again; expect, expect again: a little there, a little there."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in loquella enim labii et lingua altera loquetur ad populum istum"
      en: "For with the speech of lips, and with another tongue he will speak to this people."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cui dixit haec requies reficite lassum et hoc est meum refrigerium et noluerunt audire"
      en: "To whom he said: This is my rest, refresh the weary, and this is my refreshing: and they would not hear."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et erit eis verbum Domini manda remanda manda remanda expecta reexpecta expecta reexpecta modicum ibi modicum ibi ut vadant et cadant retrorsum et conterantur et inlaqueentur et capiantur"
      en: "And the word of the Lord shall be to them: Command, command again; command, command again: expect, expect again; expect, expect again: a little there, a little there: that they may go, and fall backward, and be broken, and snared, and taken."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "propter hoc audite verbum Domini viri inlusores qui dominamini super populum meum qui est in Hierusalem"
      en: "Wherefore hear the word of the Lord, ye scornful men, who rule over my people that is in Jerusalem."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixistis enim percussimus foedus cum morte et cum inferno fecimus pactum flagellum inundans cum transierit non veniet super nos quia posuimus mendacium spem nostram et mendacio protecti sumus"
      en: "For you have said : We have entered into a league with death, and we have made a covenant with hell. When the overflowing scourge shall pass through, it shall not come upon us: for we have placed our hope in lies, and by falsehood we are protected."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "idcirco haec dicit Dominus Deus ecce ego mittam in fundamentis Sion lapidem lapidem probatum angularem pretiosum in fundamento fundatum qui crediderit non festinet"
      en: "Therefore thus saith the Lord God: Behold I will lay a stone in the foundations of Sion, a tried stone, a corner stone, a precious stone, founded in the foundation. He that believeth, let him not hasten."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ponam iudicium in pondere et iustitiam in mensura et subvertet grando spem mendacii et protectionem aquae inundabunt"
      en: "And I will set judgment in weight, and justice in measure: and hail shall overturn the hope of falsehood: and waters shall overflow its protection."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et delebitur foedus vestrum cum morte et pactum vestrum cum inferno non stabit flagellum inundans cum transierit eritis ei in conculcationem"
      en: "And Sour league with death shall be abolished, and your covenant with hell shall not stand: when the overflowing scourge shall pass, you shall be trodden down by it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quandocumque pertransierit tollet vos quoniam mane diluculo pertransibit in die et in nocte et tantummodo sola vexatio intellectum dabit auditui"
      en: "Whensoever it shall pass through, it shall take you away: because in the morning early it shall pass through, in the day and in the night, and vexation alone shall make you understand what you hear."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "coangustatum est enim stratum ita ut alter decidat et pallium breve utrumque operire non potest"
      en: "For the bed is straitened, so that one must fall out, and a short covering can- not cover both."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sicut enim in monte Divisionum stabit Dominus sicut in valle quae est in Gabao irascetur ut faciat opus suum alienum opus eius ut operetur opus suum peregrinum est opus ab eo"
      en: "For the Lord shall stand up as in the mountain of divisions: he shall be angry as in the valley which is in Gabaon: that he may do his work, his strange work: that he may perform his work, his work is strange to him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et nunc nolite inludere ne forte constringantur vincula vestra consummationem enim et adbreviationem audivi a Domino Deo exercituum super universam terram"
      en: "And now do not mock, lest your bonds be tied strait. For I have heard of the Lord the God of hosts a consumption and a cutting short upon all the earth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "auribus percipite et audite vocem meam adtendite et audite eloquium meum"
      en: "Give ear, and hear my voice, hearken, and hear my speech."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "numquid tota die arabit arans ut serat proscindet et sariet humum suam"
      en: "Shall the ploughman plough all the day to sow, shall he open and harrow his ground?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "nonne cum adaequaverit faciem eius seret gith et cyminum sparget et ponet triticum per ordinem et hordeum et milium et viciam in finibus suis"
      en: "Will he not, when he hath made plain the surface thereof, sow gith, and scatter cummin, and put wheat in order, and barley, and millet, and vetches in their bounds?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et erudiet eum illud in iudicio Deus suus docebit eum illud"
      en: "For he will instruct him in judgment : his God will teach him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "non enim in serris triturabitur gith nec rota plaustri super cyminum circumiet sed in virga excutietur gith et cyminum in baculo"
      en: "For gith shall not be thrashed with saws, neither shall the cart wheel turn about upon cummin: but gith shall be beaten out with a rod, and cummin with a staff."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "panis autem comminuetur verum non in perpetuum triturans triturabit illum neque vexabit eum rota plaustri nec in ungulis suis comminuet eum"
      en: "But bread corn shall be broken small: but the thrasher shall not thrash it for ever, neither shall the cart wheel hurt it, nor break it with its teeth."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et hoc a Domino Deo exercituum exivit ut mirabile faceret consilium et magnificaret iustitiam"
      en: "This also is come forth from the Lord God of hosts, to make his counsel wonderful, and magnify justice."
    status: { la: verified, en: verified }
