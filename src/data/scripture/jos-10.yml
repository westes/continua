book: jos
chapter: 10
verses:
  - n: 1
    text:
      la: "quae cum audisset Adonisedec rex Hierusalem quod scilicet cepisset Iosue Ahi et subvertisset eam sicut enim fecerat Hiericho et regi eius sic fecit Ahi et regi illius et quod transfugissent Gabaonitae ad Israhel et essent foederati eorum"
      en: "When Adonisedec king of Jerusalem had heard these things, to wit, that Josue had taken Hai, and had destroyed it, (for as he had done to Jericho and the king thereof, so did he to Hai, and its king,) and that the Gabaonites were gone over to Israel, and were their confederates,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "timuit valde urbs enim magna erat Gabaon et una regalium civitatum et maior oppido Ahi omnesque bellatores eius fortissimi"
      en: "He was exceedingly afraid. For Gabaon was a great city, and one of the royal cities, and greater than the town of Hai, and all its fighting men were most valiant."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "misit ergo Adonisedec rex Hierusalem ad Oham regem Hebron et ad Pharam regem Hieremoth ad Iaphie quoque regem Lachis et ad Dabir regem Eglon dicens"
      en: "Therefore Adonisedec king of Jerusalem sent to Oham king of Hebron, and to Pharam king of Jerimoth, and to Japhia king of Lachis, and to Dabir king of Eglon, saying:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ascendite ad me et ferte praesidium ut expugnemus Gabaon quare transfugerit ad Iosue et filios Israhel"
      en: "Come up to me, and bring help, that we may take Gabaon, because it hath gone over to Josue, and to the children of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "congregati igitur ascenderunt quinque reges Amorreorum rex Hierusalem rex Hebron rex Hieremoth rex Lachis rex Eglon simul cum exercitibus suis et castrametati sunt circa Gabaon obpugnantes eam"
      en: "So the five kings of the Amorrhites being assembled together went up: the king of Jerusalem, the king of Hebron, the king of Jerimoth, the king of Lachis, the king of Eglon, they and their armies, and camped about Gabaon, laying siege to it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "habitatores autem Gabaon urbis obsessae miserunt ad Iosue qui tunc morabatur in castris apud Galgalam et dixerunt ei ne retrahas manus tuas ab auxilio servorum tuorum ascende cito et libera nos ferque praesidium convenerunt enim adversum nos omnes reges Amorreorum qui habitant in montanis"
      en: "But the inhabitants of the city of Gabaon which was besieged, sent to Josue, who then abode in the camp at Galgal, and said to him: Withdraw not thy hands from helping thy servants: come up quickly and save us, and bring us succour: for all the kings of the Amorrhites, who dwell in the mountains, are gathered together against us."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ascenditque Iosue de Galgalis et omnis exercitus bellatorum cum eo viri fortissimi"
      en: "And Josue went up from Galgal, and all the army of the warriors with him, most valiant men."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixitque Dominus ad Iosue ne timeas eos in manus enim tuas tradidi illos nullus tibi ex eis resistere poterit"
      en: "And the Lord said to Josue: Fear them not: for I have delivered them into thy hands: none of them shall be able to stand against thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "inruit itaque Iosue super eos repente tota ascendens nocte de Galgalis"
      en: "So Josue going up from Galgal all the night, came upon them suddenly."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et conturbavit eos Dominus a facie Israhel contrivitque plaga magna in Gabaon ac persecutus est per viam ascensus Bethoron et percussit usque Azeca et Maceda"
      en: "And the Lord troubled them at the sight of Israel: and he slew them with a great slaughter in Gabaon, and pursued them by the way of the ascent to Beth-horon, and cut them off all the way to Azeca and Maceda."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque fugerent filios Israhel et essent in descensu Bethoron Dominus misit super eos lapides magnos de caelo usque Azeca et mortui sunt multo plures lapidibus grandinis quam quos gladio percusserant filii Israhel"
      en: "And when they were fleeing from the children of Israel, and were in the descent of Beth-horon, the Lord cast down upon them great stones from heaven as far as Azeca: and many more were killed with the hailstones than were slain by the swords of the children of Israel."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tunc locutus est Iosue Domino in die qua tradidit Amorreum in conspectu filiorum Israhel dixitque coram eis sol contra Gabaon ne movearis et luna contra vallem Ahialon"
      en: "Then Josue spoke to the Lord, in the day that he delivered the Amorrhite in the sight of the children of Israel, and he said before them: Move not, O sun, toward Gabaon, nor thou, O moon, toward the valley of Ajalon."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "steteruntque sol et luna donec ulcisceretur se gens de inimicis suis nonne scriptum est hoc in libro Iustorum stetit itaque sol in medio caeli et non festinavit occumbere spatio unius diei"
      en: "And the sun and the moon stood still, till the people revenged themselves of their enemies. Is not this written in the book of the just? So the sun stood still in the midst of heaven, and hasted not to go down the space of one day."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "non fuit ante et postea tam longa dies oboediente Domino voci hominis et pugnante pro Israhel"
      en: "There was not before nor after so long a day, the Lord obeying the voice of a man, and fighting for Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "reversusque est Iosue cum omni Israhel in castra Galgalae"
      en: "And Josue returned with all Israel into the camp of Galgal."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "fugerant enim quinque reges et se absconderant in spelunca urbis Maceda"
      en: "For the five kings were fled, and had hidden themselves in a cave of the city of Maceda."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nuntiatumque est Iosue quod inventi essent quinque reges latentes in spelunca Maceda"
      en: "And it was told Josue that the five kings were found hidden in a cave of the city of Maceda."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui praecepit sociis et ait volvite saxa ingentia ad os speluncae et ponite viros industrios qui clausos custodiant"
      en: "And he commanded them that were with him, saying: Roll great stones to the mouth of the cave, and set careful men, to keep them shut up:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "vos autem nolite stare sed persequimini hostes et extremos quosque fugientium caedite ne dimittatis eos urbium suarum intrare praesidia quos tradidit Dominus Deus in manus vestras"
      en: "And stay you not, but pursue after the enemies, and kill all the hindermost of them as they flee, and do not suffer them whom the Lord God hath delivered into your hands to shelter themselves in their cities."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "caesis igitur adversariis plaga magna et usque ad internicionem paene consumptis hii qui Israhel effugere potuerunt ingressi sunt civitates munitas"
      en: "So the enemies being slain with a great slaughter, and almost utterly consumed, they that were able to escape from Israel, entered into fenced cities."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "reversusque est omnis exercitus ad Iosue in Maceda ubi tunc erant castra sani et integro numero nullusque contra filios Israhel muttire ausus est"
      en: "And all the army returned to Josue in Maceda, where the camp then was, in good health and without the loss of any one: and no man durst move his tongue against the children of Israel."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "praecepitque Iosue dicens aperite os speluncae et producite ad me quinque reges qui in ea latitant"
      en: "And Josue gave orders, saying: Open the mouth of the cave, and bring forth to me the five kings that lie hid therein."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "fecerunt ministri ut sibi fuerat imperatum et eduxerunt ad eum quinque reges de spelunca regem Hierusalem regem Hebron regem Hieremoth regem Lachis regem Eglon"
      en: "And the ministers did as they were commanded: and they brought out to him the five kings out of the cave: the king of Jerusalem, the king of Hebron, the king of Jerimoth, the king of Lachis, the king of Eglon."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cumque educti essent ad eum vocavit omnes viros Israhel et ait ad principes exercitus qui secum erant ite et ponite pedes super colla regum istorum qui cum perrexissent et subiectorum pedibus colla calcarent"
      en: "And when they were Drought out to him, he called all the men of Israel, and said to the chiefs of the army that were with him: Go, and set your feet on the necks of these kings. And when they had gone, and put their feet upon the necks of them lying under them,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "rursum ait ad eos nolite timere nec paveatis confortamini et estote robusti sic enim faciet Dominus cunctis hostibus vestris adversum quos dimicatis"
      en: "He said again to them: Fear not, neither be ye dismayed, take courage and be strong: for so will the Lord do to all your enemies, against whom you fight."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "percussitque Iosue et interfecit eos atque suspendit super quinque stipites fueruntque suspensi usque ad vesperum"
      en: "And Josue struck, and slew them, and hanged them upon five gibbets, and they hung until the evening."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cumque occumberet sol praecepit sociis ut deponerent eos de patibulis qui depositos proiecerunt in speluncam in qua latuerant et posuerunt super os eius saxa ingentia quae permanent usque in praesens"
      en: "And when the sun was down, he commanded the soldiers to take them down from the gibbets. And after they were taken down, they cast them into the cave where they had lain hid, and put great stones at the mouth thereof, which remain until this day."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "eodem die Macedam quoque cepit Iosue et percussit in ore gladii regemque illius interfecit et omnes habitatores eius non dimisit in ea saltim parvas reliquias fecitque regi Maceda sicut fecerat regi Hiericho"
      en: "The same day Josue took Maceda and destroyed it, with the edge of the sword, and killed the king and all the inhabitants thereof: he left not in it the least remains. And he did to the king of Maceda, as he had done to the king of Jericho."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "transivit cum omni Israhel de Maceda in Lebna et pugnabat contra eam"
      en: "And he passed from Maceda with all Israel to Lebna, and fought against it:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quam tradidit Dominus cum rege suo in manu Israhel percusseruntque urbem in ore gladii et omnes habitatores eius non dimiserunt in ea ullas reliquias feceruntque regi Lebna sicut fecerant regi Hiericho"
      en: "And the Lord delivered it with the king thereof into the hands of Israel: and they destroyed the city with the edge of the sword, and all the inhabitants thereof. They left not in it any remains. And they did to the king of Lebna, as they had done to the king of Jericho."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "de Lebna transivit in Lachis et exercitu per gyrum disposito obpugnabat eam"
      en: "From Lebna he passed unto Lachis, with all Israel: and investing it with his army, besieged it."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "tradiditque Dominus Lachis in manu Israhel et cepit eam die altero atque percussit in ore gladii omnemque animam quae fuerat in ea sicut fecerat Lebna"
      en: "And the Lord delivered Lachis into the hands of Israel, and he took it the following day, and put it to the sword, and every soul that was in it, as he had done to Lebna."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "eo tempore ascendit Hiram rex Gazer ut auxiliaretur Lachis quem percussit Iosue cum omni populo eius usque ad internicionem"
      en: "At that time Horam king of Gazer, came up to succour Lachis: and Josue slew him with all his people, so as to leave none alive."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "transivitque de Lachis in Eglon et circumdedit"
      en: "And he passed from Lachis to Eglon, and surrounded it,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "atque expugnavit eam eadem die percussitque in ore gladii omnes animas quae erant in ea iuxta omnia quae fecerat Lachis"
      en: "And took it the same day: and put to the sword all the souls that were in it, according to all that he had done to Lachis."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "ascendit quoque cum omni Israhele de Eglon in Hebron et pugnavit contra eam"
      en: "He went up also with all Israel from Eglon to Hebron, and fought against it:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "cepitque et percussit in ore gladii regem quoque eius et omnia oppida regionis illius universasque animas quae in ea fuerant commoratae non reliquit in ea ullas reliquias sicut fecerat Eglon sic fecit et Hebron cuncta quae in ea repperit consumens gladio"
      en: "Took it, and destroyed it with the edge of the sword: the king also thereof, and all the towns of that country, and all the souls that dwelt in it: he left not therein any remains: as he had done to Eglon, so did he also to Hebron, putting to the sword all that he found in it."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "inde reversus in Dabir"
      en: "Returning from thence to Dabir,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "cepit eam atque vastavit"
      en: "He took it and destroyed it: the king also thereof and all the towns round about he destroyed with the edge of the sword: he left not in it any remains: as he had done to Hebron and Lebna and to their kings, so did he to Dabir and to the king thereof."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "regem quoque eius et omnia per circuitum oppida percussit in ore gladii non dimisit in ea ullas reliquias sicut fecerat Hebron et Lebna et regibus earum sic fecit Dabir et regi illius"
      en: "So Josue conquered all the country of the hills and of the south and of the plain, and of Asedoth, with their kings: he left not any remains therein, but slew all that breathed, as the Lord the God of Israel had commanded him,"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "percussit itaque Iosue omnem terram montanam et meridianam atque campestrem et Asedoth cum regibus suis non dimisit in ea ullas reliquias sed omne quod spirare poterat interfecit sicut praeceperat ei Dominus Deus Israhel"
      en: "From Cadesbarne even to Gaza. All the land of Gosen even to Gabaon,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "a Cadesbarne usque Gazam omnem terram Gosen usque Gabaon"
      en: "And all their kings, and their lands he took and wasted at one onset: for the Lord the God of Israel fought for him."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "universos reges et regiones eorum uno cepit impetu atque vastavit Dominus enim Deus Israhel pugnabat pro eo"
      en: "And he returned with all Israel to the place of the camp in Galgal."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "reversusque est cum omni Israhele ad locum castrorum in Galgala"
      en: ""
    status: { la: verified, en: missing }
