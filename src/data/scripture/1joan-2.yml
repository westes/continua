# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1joan
chapter: 2
verses:
  - n: 1
    text:
      la: "filioli mei haec scribo vobis ut non peccetis sed et si quis peccaverit advocatum habemus apud Patrem Iesum Christum iustum"
      en: "My little children, these things I write to you, that you may not sin. But if any man sin, we have an advocate with the Father, Jesus Christ the just:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ipse est propitiatio pro peccatis nostris non pro nostris autem tantum sed etiam pro totius mundi"
      en: "And he is the propitiation for our sins: and not for ours only, but also for those of the whole world."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et in hoc scimus quoniam cognovimus eum si mandata eius observemus"
      en: "And by this we know that we have known him, if we keep his commandments."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui dicit se nosse eum et mandata eius non custodit mendax est in hoc veritas non est"
      en: "He who saith that he knoweth him, and keepeth not his commandments, is a liar, and the truth is not in him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui autem servat verbum eius vere in hoc caritas Dei perfecta est in hoc scimus quoniam in ipso sumus"
      en: "But he that keepeth his word, in him in very deed the charity of God is perfected; and by this we know that we are in him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui dicit se in ipso manere debet sicut ille ambulavit et ipse ambulare"
      en: "He that saith he abideth in him, ought himself also to walk, even as he walked."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "carissimi non mandatum novum scribo vobis sed mandatum vetus quod habuistis ab initio mandatum vetus est verbum quod audistis"
      en: "Dearly beloved, I write not a new commandment to you, but an old commandment which you had from the beginning. The old commandment is the word which you have heard."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "iterum mandatum novum scribo vobis quod est verum et in ipso et in vobis quoniam tenebrae transeunt et lumen verum iam lucet"
      en: "Again a new commandment I write unto you, which thing is true both in him and in you; because the darkness is passed, and the true light now shineth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui dicit se in luce esse et fratrem suum odit in tenebris est usque adhuc"
      en: "He that saith he is in the light, and hateth his brother, is in darkness even until now."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "qui diligit fratrem suum in lumine manet et scandalum in eo non est"
      en: "He that loveth his brother, abideth in the light, and there is no scandal in him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui autem odit fratrem suum in tenebris est et in tenebris ambulat et nescit quo eat quoniam tenebrae obcaecaverunt oculos eius"
      en: "But he that hateth his brother, is in darkness, and walketh in darkness, and knoweth not whither he goeth; because the darkness hath blinded his eyes."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "scribo vobis filioli quoniam remittuntur vobis peccata propter nomen eius"
      en: "I write unto you, little children, because your sins are forgiven you for his name's sake."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "scribo vobis patres quoniam cognovistis eum qui ab initio est scribo vobis adulescentes quoniam vicistis malignum"
      en: "I write unto you, fathers, because you have known him, who is from the beginning. I write unto you, young men, because you have overcome the wicked one."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "scripsi vobis infantes quoniam cognovistis Patrem scripsi vobis patres quia cognovistis eum qui ab initio scripsi vobis adulescentes quia fortes estis et verbum Dei in vobis manet et vicistis malignum"
      en: "I write unto you, babes, because you have known the Father. I write unto you, young men, because you are strong, and the word of God abideth in you, and you have overcome the wicked one."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "nolite diligere mundum neque ea quae in mundo sunt si quis diligit mundum non est caritas Patris in eo"
      en: "Love not the world, nor the things which are in the world. If any man love the world, the charity of the Father is not in him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quoniam omne quod est in mundo concupiscentia carnis et concupiscentia oculorum est et superbia vitae quae non est ex Patre sed ex mundo est"
      en: "For all that is in the world, is the concupiscence of the flesh, and the concupiscence of the eyes, and the pride of life, which is not of the Father, but is of the world."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et mundus transit et concupiscentia eius qui autem facit voluntatem Dei manet in aeternum"
      en: "And the world passeth away, and the concupiscence thereof: but he that doth the will of God, abideth for ever."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "filioli novissima hora est et sicut audistis quia antichristus venit nunc antichristi multi facti sunt unde scimus quoniam novissima hora est"
      en: "Little children, it is the last hour; and as you have heard that Antichrist cometh, even now there are become many Antichrists: whereby we know that it is the last hour."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ex nobis prodierunt sed non erant ex nobis nam si fuissent ex nobis permansissent utique nobiscum sed ut manifesti sint quoniam non sunt omnes ex nobis"
      en: "They went out from us, but they were not of us. For if they had been of us, they would no doubt have remained with us; but that they may be manifest, that they are not all of us."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sed vos unctionem habetis a Sancto et nostis omnia"
      en: "But you have the unction from the Holy One, and know all things."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non scripsi vobis quasi ignorantibus veritatem sed quasi scientibus eam et quoniam omne mendacium ex veritate non est"
      en: "I have not written to you as to them that know not the truth, but as to them that know it: and that no lie is of the truth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quis est mendax nisi is qui negat quoniam Iesus non est Christus hic est antichristus qui negat Patrem et Filium"
      en: "Who is a liar, but he who denieth that Jesus is the Christ? This is Antichrist, who denieth the Father, and the Son."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "omnis qui negat Filium nec Patrem habet qui confitetur Filium et Patrem habet"
      en: "Whosoever denieth the Son, the same hath not the Father. He that confesseth the Son, hath the Father also."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "vos quod audistis ab initio in vobis permaneat si in vobis permanserit quod ab initio audistis et vos in Filio et Patre manebitis"
      en: "As for you, let that which you have heard from the beginning, abide in you. If that abide in you, which you have heard from the beginning, you also shall abide in the Son, and in the Father."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et haec est repromissio quam ipse pollicitus est nobis vitam aeternam"
      en: "And this is the promise which he hath promised us, life everlasting."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "haec scripsi vobis de eis qui seducunt vos"
      en: "These things have I written to you, concerning them that seduce you."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et vos unctionem quam accepistis ab eo manet in vobis et non necesse habetis ut aliquis doceat vos sed sicut unctio eius docet vos de omnibus et verum est et non est mendacium et sicut docuit vos manete in eo"
      en: "And as for you, let the unction, which you have received from him, abide in you. And you have no need that any man teach you; but as his unction teacheth you of all things, and is truth, and is no lie. And as it hath taught you, abide in him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et nunc filioli manete in eo ut cum apparuerit habeamus fiduciam et non confundamur ab eo in adventu eius"
      en: "And now, little children, abide in him, that when he shall appear, we may have confidence, and not be confounded by him at his coming."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "si scitis quoniam iustus est scitote quoniam et omnis qui facit iustitiam ex ipso natus est"
      en: "If you know, that he is just, know ye, that every one also, who doth justice, is born of him."
    status: { la: verified, en: verified }
