# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: esth
chapter: 2
verses:
  - n: 1
    text:
      la: "His ita gestis, postquam regis Assueri indignatio deferbuerat, recordatus est Vasthi, et quae fecisset, vel quae passa esset:"
      en: "After this, when the wrath of king Assuerus was appeased, he remembered Vasthi, and what she had done and what she had suffered:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixeruntque pueri regis, ac ministri ejus: Quaerantur regi puellae virgines ac speciosae,"
      en: "And the king's servants and his officers said: Let young women be sought for the king, virgins and beautiful,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et mittantur qui considerent per universas provincias puellas speciosas et virgines: et adducant eas ad civitatem Susan, et tradant eas in domum feminarum sub manu Egei eunuchi, qui est praepositus et custos mulierum regiarum: et accipiant mundum muliebrem, et cetera ad usus necessaria."
      en: "And let some persons be sent through all the provinces to look for beautiful maidens and virgins: and let them bring them to the city of Susan, and put them into the house of the women under the hand of Egeus the eunuch, who is the overseer and keeper of the king's women: and let them receive women's ornaments, and other things necessary for their use."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et quaecumque inter omnes oculis regis placuerit, ipsa regnet pro Vasthi. Placuit sermo regi: et ita, ut suggesserant, jussit fieri."
      en: "And whosoever among them all shall please the king's eyes, let her be queen instead of Vasthi. The word pleased the king: and he commanded it should be done as they had suggested."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Erat vir Judaeus in Susan civitate, vocabulo Mardochaeus filius Jair, filii Semei, filii Cis, de stirpe Jemini,"
      en: "There was a man in the city of Susan, a Jew, named Mardochai, the son of Jair, the son of Semei, the son of Cis, of the race of Jemini,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui translatus fuerat de Jerusalem eo tempore, quo Jechoniam regem Juda Nabuchodonosor rex Babylonis transtulerat,"
      en: "Who had been carried away from Jerusalem at the time that Nabuchodonosor king of Babylon carried away Jechonias king of Juda,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui fuit nutritius filiae fratris sui Edissae, quae altero nomine vocabatur Esther: et utrumque parentem amiserat: pulchra nimis, et decora facie. Mortuisque patre ejus ac matre, Mardochaeus sibi eam adoptavit in filiam."
      en: "And he had brought up his brother's daughter Edissa, who by another name was called Esther: now she had lost both her parents: and was exceeding fair and beautiful. And her father and mother being dead, Mardochai adopted her for his daughter."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque percrebruisset regis imperium, et juxta mandatum illius multae pulchrae virgines adducerentur Susan, et Egeo traderentur eunucho, Esther quoque inter ceteras puellas ei tradita est, ut servaretur in numero feminarum."
      en: "And when the king's ordinance was noised abroad, and according to his commandment many beautiful virgins were brought to Susan, and were delivered to Egeus the eunuch: Esther also among the rest of the maidens was delivered to him to be kept in the number of the women."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quae placuit ei, et invenit gratiam in conspectu illius. Et praecepit eunucho, ut acceleraret mundum muliebrem, et traderet ei partes suas, et septem puellas speciosissimas de domo regis, et tam ipsam, quam pedissequas ejus ornaret atque excoleret."
      en: "And she pleased him, and found favour in his sight. And he commanded the eunuch to hasten the women's ornaments, and to deliver to her her part, and seven of the most beautiful maidens of the king's house, and to adorn and deck out both her and her waiting maids."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quae noluit indicare ei populum et patriam suam: Mardochaeus enim praeceperat ei, ut de hac re omnino reticeret:"
      en: "And she would not tell him her people nor her country. For Mardochai had charged her to say nothing at all of that:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "qui deambulabat quotidie ante vestibulum domus, in qua electae virgines servabantur, curam agens salutis Esther, et scire volens quid ei accideret."
      en: "And he walked every day before the court of the house, in which the chosen virgins were kept, having a care for Esther's welfare, and desiring to know what would befall her."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum autem venisset tempus singularum per ordinem puellarum, ut intrarent ad regem, expletis omnibus, quae ad cultum muliebrem pertinebant, mensis duodecimus vertebatur: ita dumtaxat, ut sex mensibus oleo ungerentur myrrhino, et aliis sex quibusdam pigmentis et aromatibus uterentur."
      en: "Now when every virgin's turn came to go in to the king, after all had been done for setting them off to advantage, it was the twelfth month: so that for six months they were anointed with oil of myrrh, and for other six months they used certain perfumes and sweet spices."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ingredientesque ad regem, quidquid postulassent ad ornatum pertinens, accipiebant: et ut eis placuerat, compositae de triclinio feminarum ad regis cubiculum transibant."
      en: "And when they were going in to the king, whatsoever they asked to adorn themselves they received: and being decked out, as it pleased them, they passed from the chamber of the women to the king's chamber."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et quae intraverat vespere, egrediebatur mane, atque inde in secundas aedes deducebatur, quae sub manu Susagazi eunuchi erant, qui concubinis regis praesidebat: nec habebat potestatem ad regem ultra redeundi, nisi voluisset rex, et eam venire jussisset ex nomine."
      en: "And she that went in at evening, came out in the morning, and from thence she was conducted to the second house, that was under the hand of Susagaz the eunuch, who had the charge over the king's concubines: neither could she return any more to the king, unless the king desired it, and had ordered her by name to come."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Evoluto autem tempore per ordinem, instabat dies, quo Esther filia Abihail fratris Mardochaei, quam sibi adoptaverat in filiam, deberet intrare ad regem. Quae non quaesivit muliebrem cultum, sed quaecumque voluit Egeus eunuchus custos virginum, haec ei ad ornatum dedit. Erat enim formosa valde, et incredibili pulchritudine, omnium oculis gratiosa et amabilis videbatur."
      en: "And as the time came orderly about, the day was at hand, when Esther, the daughter of Abihail the brother of Mardochai, whom he had adopted for his daughter, was to go in to the king. But she sought not women's ornaments, but whatsoever Egeus the eunuch the keeper of the virgins had a mind, he gave her to adorn her. For she was exceeding fair, and her incredible beauty made her appear agreeable and amiable in the eyes of all."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ducta est itaque ad cubiculum regis Assueri mense decimo, qui vocatur Tebeth, septimo anno regni ejus."
      en: "So she was brought to the chamber of king Assuerus the tenth month, which is called Tebeth, in the seventh year of his reign."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et adamavit eam rex plus quam omnes mulieres, habuitque gratiam et misericordiam coram eo super omnes mulieres, et posuit diadema regni in capite ejus, fecitque eam regnare in loco Vasthi."
      en: "And the king loved her more than all the women, and she had favour and kindness before him above all the women, and he set the royal crown on her head, and made her queen instead of Vasthi."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et jussit convivium praeparari permagnificum cunctis principibus et servis suis pro conjunctione et nuptiis Esther. Et dedit requiem universis provinciis, ac dona largitus est juxta magnificentiam principalem."
      en: "And he commanded a magnificent feast to be prepared for all the princes, and for his servants, for the marriage and wedding of Esther. And he gave rest to all the provinces, and bestowed gifts according to princely magnificence."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cumque secundo quaererentur virgines et congregarentur, Mardochaeus manebat ad januam regis:"
      en: "And when the virgins were sought the second time, and gathered together, Mardochai stayed at the king's gate,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "necdum prodiderat Esther patriam, et populum suum, juxta mandatum ejus. Quidquid enim ille praecipiebat, observabat Esther: et ita cuncta faciebat ut eo tempore solita erat, quo eam parvulam nutriebat."
      en: "Neither had Esther as yet declared her country and people, according to his commandment. For whatsoever he commanded, Esther observed: and she did all things in the same manner as she was wont at that time when he brought her up a little one."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Eo igitur tempore, quo Mardochaeus ad regis januam morabatur, irati sunt Bagathan, et Thares duo eunuchi regis, qui janitores erant, et in primo palatii limine praesidebant: volueruntque insurgere in regem, et occidere eum."
      en: "At that time, therefore, when Mardochai abode at the king's gate, Bagathan and Thares, two of the king's eunuchs, who were porters, and presided in the first entry of the palace, were angry: and they designed to rise up against the king, and to kill him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quod Mardochaeum non latuit, statimque nuntiavit reginae Esther: et illa regi ex nomine Mardochaei, qui ad se rem detulerat."
      en: "And Mardochai had notice of it, and immediately he told it to queen Esther: and she to the king in Mardochai's name, who had reported the thing unto her."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quaesitum est, et inventum: et appensus est uterque eorum in patibulo. Mandatumque est historiis, et annalibus traditum coram rege."
      en: "It was inquired into, and found out: and they were both hanged on a gibbet. And it was put in the histories, and recorded in the chronicles before the king."
    status: { la: verified, en: verified }
