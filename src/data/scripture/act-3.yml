# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 3
verses:
  - n: 1
    text:
      la: "Petrus autem et Joannes ascendebant in templum ad horam orationis nonam."
      en: "Now Peter and John went up into the temple at the ninth hour of prayer."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et quidam vir, qui erat claudus ex utero matris suae, bajulabatur: quem ponebant quotidie ad portam templi, quae dicitur Speciosa, ut peteret eleemosynam ab introeuntibus in templum."
      en: "And a certain man who was lame from his mother's womb, was carried: whom they laid every day at the gate of the temple, which is called Beautiful, that he might ask alms of them that went into the temple."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Is cum vidisset Petrum et Joannem incipientes introire in templum, rogabat ut eleemosynam acciperet."
      en: "He, when he had seen Peter and John about to go into the temple, asked to receive an alms."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Intuens autem in eum Petrus cum Joanne, dixit: Respice in nos."
      en: "But Peter with John fastening his eyes upon him, said: Look upon us."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "At ille intendebat in eos, sperans se aliquid accepturum ab eis."
      en: "But he looked earnestly upon them, hoping that he should receive something of them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Petrus autem dixit: Argentum et aurum non est mihi: quod autem habeo, hoc tibi do: in nomine Jesu Christi Nazareni surge, et ambula."
      en: "But Peter said: Silver and gold I have none; but what I have, I give thee: In the name of Jesus Christ of Nazareth, arise, and walk."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et apprehensa manu ejus dextera, allevavit eum, et protinus consolidatae sunt bases ejus et plantae."
      en: "And taking him by the right hand, he lifted him up, and forthwith his feet and soles received strength."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et exiliens stetit, et ambulabat: et intravit cum illis in templum ambulans, et exiliens, et laudans Deum."
      en: "And he leaping up, stood, and walked, and went in with them into the temple, walking, and leaping, and praising God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et vidit omnis populus eum ambulantem, et laudantem Deum."
      en: "And all the people saw him walking and praising God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cognoscebant autem illum, quod ipse erat, qui ad eleemosynam sedebat ad Speciosam portam templi: et impleti sunt stupore et extasi in eo quod contingerat illi."
      en: "And they knew him, that it was he who sat begging alms at the Beautiful gate of the temple: and they were filled with wonder and amazement at that which had happened to him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cum teneret autem Petrum et Joannem, cucurrit omnis populus ad eos ad porticum quae appellatur Salomonis, stupentes."
      en: "And as he held Peter and John, all the people ran to them to the porch which is called Solomon's, greatly wondering."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Videns autem Petrus, respondit ad populum: Viri Israelitae, quid miramini in hoc, aut nos quid intuemini, quasi nostra virtute aut potestate fecerimus hunc ambulare?"
      en: "But Peter seeing, made answer to the people: Ye men of Israel, why wonder you at this? or why look you upon us, as if by our strength or power we had made this man to walk?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Deus Abraham, et Deus Isaac, et Deus Jacob, Deus patrum nostrorum glorificavit filium suum Jesum, quem vos quidem tradidistis, et negastis ante faciem Pilati, judicante illo dimitti."
      en: "The God of Abraham, and the God of Isaac, and the God of Jacob, the God of our fathers, hath glorified his Son Jesus, whom you indeed delivered up and denied before the face of Pilate, when he judged he should be released."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Vos autem sanctum et justum negastis, et petistis virum homicidam donari vobis:"
      en: "But you denied the Holy One and the Just, and desired a murderer to be granted unto you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "auctorem vero vitae interfecistis, quem Deus suscitavit a mortuis, cujus nos testes sumus."
      en: "But the author of life you killed, whom God hath raised from the dead, of which we are witnesses."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et in fide nominis ejus, hunc, quem vos vidistis, et nostis, confirmavit nomen ejus: et fides, quae per eum est, dedit integram sanitatem istam in conspectu omnium vestrum."
      en: "And in the faith of his name, this man, whom you have seen and known, hath his name strengthened; and the faith which is by him, hath given this perfect soundness in the sight of you all."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et nunc, fratres, scio quia per ignorantiam fecistis, sicut et principes vestri."
      en: "And now, brethren, I know that you did it through ignorance, as did also your rulers."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Deus autem, quae praenuntiavit per os omnium prophetarum, pati Christum suum, sic implevit."
      en: "But those things which God before had shewed by the mouth of all the prophets, that his Christ should suffer, he hath so fulfilled."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Poenitemini igitur, et convertimini ut deleantur peccata vestra:"
      en: "Be penitent, therefore, and be converted, that your sins may be blotted out."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ut cum venerint tempora refrigerii a conspectu Domini, et miserit eum qui praedicatus est vobis, Jesum Christum,"
      en: "That when the times of refreshment shall come from the presence of the Lord, and he shall send him who hath been preached unto you, Jesus Christ,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quem oportet quidem caelum suscipere usque in tempora restitutionis omnium, quae locutus est Deus per os sanctorum suorum a saeculo prophetarum."
      en: "Whom heaven indeed must receive, until the times of the restitution of all things, which God hath spoken by the mouth of his holy prophets, from the beginning of the world."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Moyses quidem dixit: Quoniam prophetam suscitabit vobis Dominus Deus vester de fratribus vestris, tamquam me, ipsum audietis juxta omnia quaecumque locutus fuerit vobis."
      en: "For Moses said: A prophet shall the Lord your God raise up unto you of your brethren, like unto me: him you shall hear according to all things whatsoever he shall speak to you."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Erit autem: omnis anima, quae non audierit prophetam illum, exterminabitur de plebe."
      en: "And it shall be, that every soul which will not hear that prophet, shall be destroyed from among the people."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et omnes prophetae a Samuel, et deinceps, qui locuti sunt, annuntiaverunt dies istos."
      en: "And all the prophets, from Samuel and afterwards, who have spoken, have told of these days."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Vos estis filii prophetarum et testamenti, quod disposuit Deus ad patres nostros, dicens ad Abraham: Et in semine tuo benedicentur omnes familiae terrae."
      en: "You are the children of the prophets, and of the testament which God made to our fathers, saying to Abraham: And in thy seed shall all the kindreds of the earth be blessed."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Vobis primum Deus suscitans filium suum, misit eum benedicentem vobis: ut convertat se unusquisque a nequitia sua."
      en: "To you first God, raising up his Son, hath sent him to bless you; that every one may convert himself from his wickedness."
    status: { la: verified, en: verified }
