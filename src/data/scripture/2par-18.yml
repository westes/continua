# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 18
verses:
  - n: 1
    text:
      la: "Fuit ergo Josaphat dives et inclytus multum, et affinitate conjunctus est Achab."
      en: "Now Josaphat was rich and very glorious, and was joined by affinity to Achab."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Descenditque post annos ad eum in Samariam: ad cujus adventum mactavit Achab arietes, et boves plurimos ipsi, et populo qui venerat cum eo: persuasitque illi ut ascenderet in Ramoth Galaad."
      en: "And he went down to him after some years to Samaria: and Achab at his coming killed sheep and oxen in abundance for him and the people that came with him: and he persuaded him to go up to Ramoth Galaad."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dixitque Achab rex Israel ad Josaphat regem Juda: Veni mecum in Ramoth Galaad. Cui ille respondit: Ut ego, et tu: sicut populus tuus, sic et populus meus: tecumque erimus in bello."
      en: "And Achab king of Israel said to Josaphat king of Juda: Come with me to Ramoth Galaad. And he answered him: Thou art as I am, and my people as thy people, and we will be with thee in the war."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixitque Josaphat ad regem Israel: Consule, obsecro, impraesentiarum sermonem Domini."
      en: "And Josaphat said to the king of Israel: Inquire, I beseech thee, at present the word of the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Congregavit igitur rex Israel prophetarum quadringentos viros, et dixit ad eos: In Ramoth Galaad ad bellandum ire debemus, an quiescere? At illi, Ascende, inquiunt, et tradet Deus in manu regis."
      en: "So the king of Israel gathered together of the prophets four hundred men, and he said to them: Shall we go to Ramoth Galaad to fight, or shall we forbear? But they said: Go up, and God will deliver it into the king's hand."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixitque Josaphat: Numquid non est hic prophetes Domini, ut ab illo etiam requiramus?"
      en: "And Josaphat said: Is there not here a prophet of the Lord, that we may inquire also of him?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ait rex Israel ad Josaphat: Est vir unus, a quo possumus quaerere Domini voluntatem: sed ego odi eum, quia non prophetat mihi bonum, sed malum omni tempore: est autem Michaeas filius Jemla. Dixitque Josaphat: Ne loquaris rex hoc modo."
      en: "And the king of Israel said to Josaphat: There is one man, of whom we may ask the will of the Lord: but I hate him, for he never prophesieth good to me, but always evil: and it is Micheas the son of Jemla. And Josaphat said: Speak not thus, O king."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Vocavit ergo rex Israel unum de eunuchis, et dixit ei: Voca cito Michaeam filium Jemla."
      en: "And the king of Israel called one of the eunuchs, and said to him: Call quickly Micheas the son of Jemla."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Porro rex Israel, et Josaphat rex Juda, uterque sedebant in solio suo, vestiti cultu regio: sedebant autem in area juxta portam Samariae, omnesque prophetae vaticinabantur coram eis."
      en: "Now the king of Israel, and Josaphat king of Juda, both sat on their thrones, clothed in royal robes, and they sat in the open court by the gate of Samaria, and all the prophets prophesied before them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Sedecias vero filius Chanaana fecit sibi cornua ferrea, et ait: Haec dicit Dominus: His ventilabis Syriam, donec conteras eam."
      en: "And Sedecias the son of Chanaana made him horns of iron, and said: Thus saith the Lord: With these shalt thou push Syria, till thou destroy it."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Omnesque prophetae similiter prophetabant, atque dicebant: Ascende in Ramoth Galaad, et prosperaberis, et tradet eos Dominus in manu regis."
      en: "And all the prophets prophesied in like manner, and said: Go up to Ramoth Galaad, and thou shalt prosper, and the Lord will deliver them into the king's hand."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nuntius autem, qui ierat ad vocandum Michaeam, ait illi: En verba omnium prophetarum uno ore bona regi annuntiant: quaeso ergo te ut et sermo tuus ab eis non dissentiat, loquarisque prospera."
      en: "And the messenger that went to call Micheas, said to him: Behold the words of all the prophets with one mouth declare good to the king: I beseech thee therefore let not thy word disagree with them, and speak thou also good success."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cui respondit Michaeas: Vivit Dominus, quia quodcumque dixerit mihi Deus meus, hoc loquar."
      en: "And Micheas answered him: As the Lord liveth, whatsoever my God shall say to me, that will I speak."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Venit ergo ad regem. Cui rex ait: Michaea, ire debemus in Ramoth Galaad ad bellandum, an quiescere? Cui ille respondit: Ascendite: cuncta enim prospera evenient, et tradentur hostes in manus vestras."
      en: "So he came to the king: and the king said to him: Micheas, shall we go to Ramoth Galaad to fight, or forbear? And he answered him: Go up, for all shall succeed prosperously, and the enemies shall be delivered into your hands."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixitque rex: Iterum, atque iterum te adjuro, ut mihi non loquaris, nisi quod verum est in nomine Domini."
      en: "And the king said: I adjure thee again and again to say nothing but the truth to me, in the name of the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "At ille ait: Vidi universum Israel dispersum in montibus, sicut oves absque pastore: et dixit Dominus: Non habent isti dominos: revertatur unusquisque in domum suam in pace."
      en: "Then he said: I saw all Israel scattered in the mountains, like sheep without a shepherd: and the Lord said: These have no masters: let every man return to his own house in peace."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ait rex Israel ad Josaphat: Nonne dixi tibi, quod non prophetaret iste mihi quidquam boni, sed ea quae mala sunt?"
      en: "And the king of Israel said to Josaphat: Did I not tell thee that this man would not prophesy me any good, but evil?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "At ille, Idcirco, ait, audite verbum Domini: vidi Dominum sedentem in solio suo, et omnem exercitum caeli assistentem ei a dextris et a sinistris."
      en: "Then he said: Hear ye therefore the word of the Lord: I saw the Lord sitting on his throne, and all the army of heaven standing by him on the right hand and on the left."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et dixit Dominus: Quis decipiet Achab regem Israel ut ascendat et corruat in Ramoth Galaad? Cumque diceret unus hoc modo, et alter alio,"
      en: "And the Lord said: Who shall deceive Achab king of Israel, that he may go up and fall in Ramoth Galaad? And when one spoke in this manner, and another otherwise:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "processit spiritus, et stetit coram Domino, et ait: Ego decipiam eum. Cui Dominus, In quo, inquit, decipies?"
      en: "There came forth a spirit, and stood before the Lord, and said: I will deceive him. And the Lord said to him: By what means wilt thou deceive him?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "At ille respondit: Egrediar, et ero spiritus mendax in ore omnium prophetarum ejus. Dixitque Dominus: Decipies, et praevalebis: egredere, et fac ita."
      en: "And he answered: I will go out, and be a lying spirit in the mouth of all his prophets. And the Lord said: Thou shalt deceive, and shalt prevail: go out, and do so."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Nunc igitur, ecce Dominus dedit spiritum mendacii in ore omnium prophetarum tuorum, et Dominus locutus est de te mala."
      en: "Now therefore behold the Lord hath put a spirit of lying in the mouth of all thy prophets, and the Lord hath spoken evil against thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Accessit autem Sedecias filius Chanaana, et percussit Michaeae maxillam, et ait: Per quam viam transivit spiritus Domini a me, ut loqueretur tibi?"
      en: "And Sedecias the son of Chanaana came, and struck Micheas on the cheek and said: Which way went the spirit of the Lord from me, to speak to thee?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dixitque Michaeas: Tu ipse videbis in die illo, quando ingressus fueris cubiculum de cubiculo ut abscondaris."
      en: "And Micheas said: Thou thyself shalt see in that day, when thou shalt go in from chamber to chamber, to hide thyself."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Praecepit autem rex Israel, dicens: Tollite Michaeam, et ducite eum ad Amon principem civitatis, et ad Joas filium Amelech."
      en: "And the king of Israel commanded, saying: Take Micheas, and carry him to Amen the governor of the city, and to Joas the son of Amelech,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et dicetis: Haec dicit rex: Mittite hunc in carcerem, et date ei panis modicum, et aquae pauxillum, donec revertar in pace."
      en: "And say: Thus saith the king: Put this fellow in prison, and give him bread and water in a small quantity till I return in peace."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Dixitque Michaeas: Si reversus fueris in pace, non est locutus Dominus in me. Et ait: Audite, omnes populi."
      en: "And Micheas said: If thou return in peace, the Lord hath not spoken by me. And he said: Hear, all ye people."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Igitur ascenderunt rex Israel et Josaphat rex Juda in Ramoth Galaad."
      en: "So the king of Israel and Josaphat king of Juda went up to Ramoth Galaad."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Dixitque rex Israel ad Josaphat: Mutabo habitum, et sic ad pugnam vadam: tu autem induere vestibus tuis. Mutatoque rex Israel habitu, venit ad bellum."
      en: "And the king of Israel said to Josaphat: I will change my dress, and so I will go to the battle, but put thou on thy own garments. And the king of Israel having changed his dress, went to the battle."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Rex autem Syriae praeceperat ducibus equitatus sui, dicens: Ne pugnetis contra minimum, aut contra maximum, nisi contra solum regem Israel."
      en: "Now the king of Syria had commanded the captains of his cavalry, saying: Fight ye not with small, or great, but with the king of Israel only."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Itaque cum vidissent principes equitatus Josaphat, dixerunt: Rex Israel est iste. Et circumdederunt eum dimicantes: at ille clamavit ad Dominum, et auxiliatus est ei, atque avertit eos ab illo."
      en: "So when the captains of the cavalry saw Josaphat, they said: This is the king of Israel. And they surrounded him to attack him: but he cried to the Lord, and he helped him, and turned them away from him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Cum enim vidissent duces equitatus, quod non esset rex Israel, reliquerunt eum."
      en: "For when the captains of the cavalry saw, that he was not the king of Israel, they left him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Accidit autem ut unus e populo sagittam in incertum jaceret, et percuteret regem Israel inter cervicem et scapulas. At ille aurigae suo ait: Converte manum tuam, et educ me de acie, quia vulneratus sum."
      en: "And it happened that one of the people shot an arrow at a venture, and struck the king of Israel between the neck and the shoulders, and he said to his chariot man: Turn thy hand, and carry me out of the battle, for I am wounded."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et finita est pugna in die illo: porro rex Israel stabat in curru suo contra Syros usque ad vesperam, et mortuus est occidente sole."
      en: "And the fight was ended that day: but the king of Israel stood in his chariot against the Syrians until the evening, and died at the sunset."
    status: { la: verified, en: verified }
