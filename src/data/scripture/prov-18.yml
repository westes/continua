# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 18
verses:
  - n: 1
    text:
      la: "Occasiones quaerit qui vult recedere ab amico, omni tempore erit exprobrabilis."
      en: "He that hath a mind to depart from a friend seeketh occasions: he shall ever be subject to reproach."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Non recipit stultus verba prudentiae, nisi ea dixeris quae versantur in corde ejus."
      en: "A fool receiveth not the words of prudence: unless thou say those things which are in his heart."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Impius, cum in profundum venerit peccatorum, contemnit; sed sequitur eum ignominia et opprobrium."
      en: "The wicked man when he is come into the depth of sins, contemneth: but ignominy and reproach follow him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Aqua profunda verba ex ore viri, et torrens redundans fons sapientiae."
      en: "Words from the mouth of a man are as deep water: and the fountain of wisdom as an overflowing stream."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Accipere personam impii non est bonum, ut declines a veritate judicii."
      en: "It is not good to accept the person of the wicked, to decline from the truth of judgment."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Labia stulti miscent se rixis, et os ejus jurgia provocat."
      en: "The lips of a fool intermeddle with strife: and his mouth provoketh quarrels."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Os stulti contritio ejus, et labia ipsius ruina animae ejus."
      en: "The mouth of a fool is his destruction: and his lips are the ruin of his soul."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Verba bilinguis quasi simplicia, et ipsa perveniunt usque ad interiora ventris. Pigrum dejicit timor; animae autem effeminatorum esurient."
      en: "The words of the double tongued are as if they were harmless: and they reach even to the inner parts of the bowels. Fear casteth down the slothful: and the souls of the effeminate shall be hungry."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui mollis et dissolutus est in opere suo frater est sua opera dissipantis."
      en: "He that is loose and slack in his work, is the brother of him that wasteth his own works."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Turris fortissima nomen Domini; ad ipsum currit justus, et exaltabitur."
      en: "The name of the Lord is a strong tower: the just runneth to it, and shall be exalted."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Substantia divitis urbs roboris ejus, et quasi murus validus circumdans eum."
      en: "The substance of the rich man is the city of his strength, and as a strong wall compassing him about."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Antequam conteratur, exaltatur cor hominis, et antequam glorificetur, humiliatur."
      en: "Before destruction, the heart of a man is exalted: and before he be glorified, it is humbled."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Qui prius respondet quam audiat, stultum se esse demonstrat et confusione dignum."
      en: "He that answereth before he heareth sheweth himself to be a fool, and worthy of confusion."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Spiritus viri sustentat imbecillitatem suam; spiritum vero ad irascendum facilem quis poterit sustinere?"
      en: "The spirit of a man upholdeth his infirmity: but a spirit that is easily angered, who can bear?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cor prudens possidebit scientiam, et auris sapientium quaerit doctrinam."
      en: "A wise heart shall acquire knowledge: and the ear of the wise seeketh instruction."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Donum hominis dilatat viam ejus, et ante principes spatium ei facit."
      en: "A man's gift enlargeth his way, and maketh him room before princes."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Justus prior est accusator sui: venit amicus ejus, et investigabit eum."
      en: "The just is first accuser of himself: his friend cometh, and shall search him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Contradictiones comprimit sors, et inter potentes quoque dijudicat."
      en: "The lot suppresseth contentions, and determineth even between the mighty."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Frater qui adjuvatur a fratre quasi civitas firma, et judicia quasi vectes urbium."
      en: "A brother that is helped by his brother, is like a strong city: and judgments are like the bars of cities."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "De fructu oris viri replebitur venter ejus, et genimina labiorum ipsius saturabunt eum."
      en: "Of the fruit of a man's mouth shall his belly be satisfied: and the offspring of his lips shall fill him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Mors et vita in manu linguae; qui diligunt eam comedent fructus ejus."
      en: "Death and life are in the power of the tongue: they that love it, shall eat the fruits thereof."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Qui invenit mulierem bonam invenit bonum, et hauriet jucunditatem a Domino. Qui expellit mulierem bonam expellit bonum; qui autem tenet adulteram stultus est et impius."
      en: "He that hath found a good wife, hath found a good thing, and shall receive a pleasure from the Lord. He that driveth away a good wife, driveth away a good thing: but he that keepeth an adulteress, is foolish and wicked."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cum obsecrationibus loquetur pauper, et dives effabitur rigide."
      en: "The poor will speak with supplications, and the rich will speak roughly."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Vir amabilis ad societatem magis amicus erit quam frater."
      en: "A man amiable in society, shall be more friendly than a brother."
    status: { la: verified, en: verified }
