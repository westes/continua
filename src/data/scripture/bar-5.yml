# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: bar
chapter: 5
verses:
  - n: 1
    text:
      la: "Exue te, Jerusalem, stola luctus et vexationis tuae, et indue te decore, et honore ejus, quae a Deo tibi est, sempiternae gloriae."
      en: "Put off, O Jerusalem, the garment of thy mourning, and affliction: and put on the beauty, and honour of that everlasting glory which thou hast from God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Circumdabit te Deus diploide justitiae, et imponet mitram capiti honoris aeterni."
      en: "God will clothe thee with the double garment of justice, and will set a crown on thy head of everlasting honour."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Deus enim ostendet splendorem suum in te, omni qui sub caelo est."
      en: "For God will shew his brightness in thee, to every one under heaven."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nominabitur enim tibi nomen tuum a Deo in sempiternum: pax justitiae, et honor pietatis."
      en: "For thy name shall be named to thee by God for ever: the peace of justice, and honour of piety."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Exsurge, Jerusalem, et sta in excelso: et circumspice ad orientem, et vide collectos filios tuos ab oriente sole usque ad occidentem, in verbo Sancti, gaudentes Dei memoria."
      en: "Arise, O Jerusalem, and stand on high: and look about towards the east, and behold thy children gathered together from the rising to the setting sun, by the word of the Holy One rejoicing in the remembrance of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Exierunt enim abs te pedibus ducti ab inimicis: adducet autem illos Dominus ad te portatos in honore sicut filios regni:"
      en: "For they went out from thee on foot, led by the enemies: but the Lord will bring them to thee exalted with honour as children of the kingdom."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "constituit enim Deus humiliare omnem montem excelsum et rupes perennes, et convalles replere in aequalitatem terrae, ut ambulet Israel diligenter in honorem Dei."
      en: "For God hath appointed to bring down every high mountain, and the everlasting rocks, and to fill up the valleys to make them even with the ground: that Israel may walk diligently to the honour of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Obumbraverunt autem et silvae, et omne lignum suavitatis Israel ex mandato Dei."
      en: "Moreover the woods, and every sweet-smelling tree have overshadowed Israel by the commandment of God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Adducet enim Deus Israel cum jucunditate in lumine majestatis suae, cum misericordia et justitia quae est ex ipso."
      en: "For God will bring Israel with joy in the light of his majesty, with mercy, and justice, that cometh from him."
    status: { la: verified, en: verified }
