# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: bar
chapter: 5
verses:
  - n: 1
    text:
      la: "exue te Hierusalem stola luctus et vexationis tuae et indue te decore et honore eius quae a Deo tibi est in sempiterna gloriae"
      en: "Put off, O Jerusalem, the garment of thy mourning, and affliction: and put on the beauty, and honour of that everlasting glory which thou hast from God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "circumdato te deploide a Deo iustitiae et inpone mitram capiti tuo honoris Aeterni"
      en: "God will clothe thee with the double garment of justice, and will set a crown on thy head of everlasting honour."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Deus enim ostendet splendorem suum in te omni quod sub caelo est"
      en: "For God will shew his brightness in thee, to every one under heaven."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nominabitur enim tibi nomen tuum a Deo in sempiternum Pax iustitiae et Honor pietatis"
      en: "For thy name shall be named to thee by God for ever: the peace of justice, and honour of piety."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "exsurge Hierusalem et sta in excelso et circumspice ad orientem et vide collectos filios tuos ab oriente sole usque ad occidentem in verbo Sancti gaudentes Dei memoria"
      en: "Arise, O Jerusalem, and stand on high: and look about towards the east, and behold thy children gathered together from the rising to the setting sun, by the word of the Holy One rejoicing in the remembrance of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "exierunt enim abs te pedibus ducti ab inimicis adducet autem illos Dominus ad te portatos in honorem sicut filios regni"
      en: "For they went out from thee on foot, led by the enemies: but the Lord will bring them to thee exalted with honour as children of the kingdom."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "constituit enim Deus humiliare omnem montem excelsum et rupes perennes et convalles replere in aequalitatem terrae ut ambulet Israhel diligenter in honorem Dei"
      en: "For God hath appointed to bring down every high mountain, and the everlasting rocks, and to fill up the valleys to make them even with the ground: that Israel may walk diligently to the honour of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "obumbraverunt autem et silvae et omne lignum suavitatis Israhel mandato Dei"
      en: "Moreover the woods, and every sweet-smelling tree have overshadowed Israel by the commandment of God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "adducet enim Deus Israhel cum iucunditate in lumine maiestatis suae cum misericordia et iustitia quae est ab ipso"
      en: "For God will bring Israel with joy in the light of his majesty, with mercy, and justice, that cometh from him."
    status: { la: verified, en: verified }
