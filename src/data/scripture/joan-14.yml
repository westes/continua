# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: joan
chapter: 14
verses:
  - n: 1
    text:
      la: "non turbetur cor vestrum creditis in Deum et in me credite"
      en: "Let not your heart be troubled. You believe in God, believe also in me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in domo Patris mei mansiones multae sunt si quo minus dixissem vobis quia vado parare vobis locum"
      en: "In my Father's house there are many mansions. If not, I would have told you: because I go to prepare a place for you."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et si abiero et praeparavero vobis locum iterum venio et accipiam vos ad me ipsum ut ubi sum ego et vos sitis"
      en: "And if I shall go, and prepare a place for you, I will come again, and will take you to myself; that where I am, you also may be."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et quo ego vado scitis et viam scitis"
      en: "And whither I go you know, and the way you know."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dicit ei Thomas Domine nescimus quo vadis et quomodo possumus viam scire"
      en: "Thomas saith to him: Lord, we know not whither thou goest; and how can we know the way?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dicit ei Iesus ego sum via et veritas et vita nemo venit ad Patrem nisi per me"
      en: "Jesus saith to him: I am the way, and the truth, and the life. No man cometh to the Father, but by me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si cognovissetis me et Patrem meum utique cognovissetis et amodo cognoscitis eum et vidistis eum"
      en: "If you had known me, you would without doubt have known my Father also: and from henceforth you shall know him, and you have seen him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dicit ei Philippus Domine ostende nobis Patrem et sufficit nobis"
      en: "Philip saith to him: Lord, shew us the Father, and it is enough for us."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dicit ei Iesus tanto tempore vobiscum sum et non cognovistis me Philippe qui vidit me vidit et Patrem quomodo tu dicis ostende nobis Patrem"
      en: "Jesus saith to him: Have I been so long a time with you; and have you not known me? Philip, he that seeth me seeth the Father also. How sayest thou, Shew us the Father?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "non credis quia ego in Patre et Pater in me est verba quae ego loquor vobis a me ipso non loquor Pater autem in me manens ipse facit opera"
      en: "Do you not believe, that I am in the Father, and the Father in me? The words that I speak to you, I speak not of myself. But the Father who abideth in me, he doth the works."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non creditis quia ego in Patre et Pater in me est"
      en: "Believe you not that I am in the Father, and the Father in me?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "alioquin propter opera ipsa credite amen amen dico vobis qui credit in me opera quae ego facio et ipse faciet et maiora horum faciet quia ego ad Patrem vado"
      en: "Otherwise believe for the very works' sake. Amen, amen I say to you, he that believeth in me, the works that I do, he also shall do; and greater than these shall he do."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et quodcumque petieritis in nomine meo hoc faciam ut glorificetur Pater in Filio"
      en: "Because I go to the Father: and whatsoever you shall ask the Father in my name, that will I do: that the Father may be glorified in the Son."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si quid petieritis me in nomine meo hoc faciam"
      en: "If you shall ask me any thing in my name, that I will do."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "si diligitis me mandata mea servate"
      en: "If you love me, keep my commandments."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et ego rogabo Patrem et alium paracletum dabit vobis ut maneat vobiscum in aeternum"
      en: "And I will ask the Father, and he shall give you another Paraclete, that he may abide with you for ever."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Spiritum veritatis quem mundus non potest accipere quia non videt eum nec scit eum vos autem cognoscitis eum quia apud vos manebit et in vobis erit"
      en: "The spirit of truth, whom the world cannot receive, because it seeth him not, nor knoweth him: but you shall know him; because he shall abide with you, and shall be in you."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non relinquam vos orfanos veniam ad vos"
      en: "I will not leave you orphans, I will come to you."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "adhuc modicum et mundus me iam non videt vos autem videtis me quia ego vivo et vos vivetis"
      en: "Yet a little while: and the world seeth me no more. But you see me: because I live, and you shall live."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in illo die vos cognoscetis quia ego sum in Patre meo et vos in me et ego in vobis"
      en: "In that day you shall know, that I am in my Father, and you in me, and I in you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui habet mandata mea et servat ea ille est qui diligit me qui autem diligit me diligetur a Patre meo et ego diligam eum et manifestabo ei me ipsum"
      en: "He that hath my commandments, and keepeth them; he it is that loveth me. And he that loveth me, shall be loved of my Father: and I will love him, and will manifest myself to him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dicit ei Iudas non ille Scariotis Domine quid factum est quia nobis manifestaturus es te ipsum et non mundo"
      en: "Judas saith to him, not the Iscariot: Lord, how is it, that thou wilt manifest thyself to us, and not to the world?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "respondit Iesus et dixit ei si quis diligit me sermonem meum servabit et Pater meus diliget eum et ad eum veniemus et mansiones apud eum faciemus"
      en: "Jesus answered, and said to him: If any one love me, he will keep my word, and my Father will love him, and we will come to him, and will make our abode with him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui non diligit me sermones meos non servat et sermonem quem audistis non est meus sed eius qui misit me Patris"
      en: "He that loveth me not, keepeth not my words. And the word which you have heard, is not mine; but the Father's who sent me."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "haec locutus sum vobis apud vos manens"
      en: "These things have I spoken to you, abiding with you."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "paracletus autem Spiritus Sanctus quem mittet Pater in nomine meo ille vos docebit omnia et suggeret vobis omnia quaecumque dixero vobis"
      en: "But the Paraclete, the Holy Ghost, whom the Father will send in my name, he will teach you all things, and bring all things to your mind, whatsoever I shall have said to you."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "pacem relinquo vobis pacem meam do vobis non quomodo mundus dat ego do vobis non turbetur cor vestrum neque formidet"
      en: "Peace I leave with you, my peace I give unto you: not as the world giveth, do I give unto you. Let not your heart be troubled, nor let it be afraid."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "audistis quia ego dixi vobis vado et venio ad vos si diligeretis me gauderetis utique quia vado ad Patrem quia Pater maior me est"
      en: "You have heard that I said to you: I go away, and I come unto you. If you loved me, you would indeed be glad, because I go to the Father: for the Father is greater than I."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et nunc dixi vobis priusquam fiat ut cum factum fuerit credatis"
      en: "And now I have told you before it comes to pass: that when it shall come to pass, you may believe."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "iam non multa loquar vobiscum venit enim princeps mundi huius et in me non habet quicquam"
      en: "I will not now speak many things with you. For the prince of this world cometh, and in me he hath not any thing."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "sed ut cognoscat mundus quia diligo Patrem et sicut mandatum dedit mihi Pater sic facio surgite eamus hinc"
      en: "But that the world may know, that I love the Father: and as the Father hath given me commandment, so do I: Arise, let us go hence."
    status: { la: verified, en: verified }
