# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 6
verses:
  - n: 1
    text:
      la: "Tunc Salomon ait: Dominus pollicitus est ut habitaret in caligine:"
      en: "Then Solomon said: The Lord promised that he would dwell in a cloud."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ego autem aedificavi domum nomini ejus, ut habitaret ibi in perpetuum."
      en: "But I have built a house to his name, that he might dwell there for ever."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et convertit rex faciem suam, et benedixit universae multitudini Israel ( nam omnis turba stabat intenta) et ait:"
      en: "And the king turned his face, and blessed all the multitude of Israel (for all the multitude stood attentive) and he said:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Benedictus Dominus Deus Israel, qui quod locutus est David patri meo, opere complevit, dicens:"
      en: "Blessed be the Lord the God of Israel, who hath accomplished in deed that which he spoke to David my father, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "A die, qua eduxi populum meum de terra Aegypti, non elegi civitatem de cunctis tribubus Israel, ut aedificaretur in ea domus nomini meo: neque elegi quemquam alium virum, ut esset dux in populo Israel,"
      en: "From the day that I brought my people out of the land of Egypt, I chose no city among all the tribes of Israel, for a house to be built in it to my name: neither chose I any other man, to be the ruler of my people Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sed elegi Jerusalem, ut sit nomen meum in ea: et elegi David, ut constituerem eum super populum meum Israel."
      en: "But I chose Jerusalem, that my name might be there: and I chose David to set him over my people Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cumque fuisset voluntatis David patris mei ut aedificaret domum nomini Domini Dei Israel,"
      en: "And whereas David my father had a mind to build a house to the name of the Lord the God of Israel,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixit Dominus ad eum: Quia haec fuit voluntas tua, ut aedificares domum nomini meo, bene quidem fecisti hujuscemodi habere voluntatem:"
      en: "The Lord said to him: Forasmuch as it was thy will to build a house to my name, thou hast done well indeed in having such a will:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sed non tu aedificabis domum, verum filius tuus, qui egredietur de lumbis tuis, ipse aedificabit domum nomini meo."
      en: "But thou shalt not build the house, but thy son, who shall come out of thy loins, he shall build a house to my name."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Complevit ergo Dominus sermonem suum, quem locutus fuerat: et ego surrexi pro David patre meo, et sedi super thronum Israel, sicut locutus est Dominus: et aedificavi domum nomini Domini Dei Israel."
      en: "The Lord therefore hath accomplished his word which he spoke: and I am risen up in the place of David my father, and sit upon the throne of Israel, as the Lord promised: and have built a house to the name of the Lord God of Israel."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et posui in ea arcam, in qua est pactum Domini, quod pepigit cum filiis Israel."
      en: "And I have put in it the ark, wherein is the covenant of the Lord, which he made with the children of Israel."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Stetit ergo coram altari Domini ex adverso universae multitudinis Israel, et extendit manus suas."
      en: "And he stood before the altar of the Lord, in presence of all the multitude of Israel, and stretched forth his hands."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Siquidem fecerat Salomon basim aeneam, et posuerat eam in medio basilicae, habentem quinque cubitos longitudinis, et quinque cubitos latitudinis, et tres cubitos altitudinis: stetitque super eam, et deinceps flexis genibus contra universam multitudinem Israel, et palmis in caelum levatis,"
      en: "For Solomon had made a brazen scaffold, and had set it in the midst of the temple, which was five cubits long, and five cubits broad, and three cubits high: and he stood upon it: then kneeling down in the presence of all the multitude of Israel, and lifting up his hands towards heaven,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ait: Domine Deus Israel, non est similis tui deus in caelo et in terra: qui custodis pactum et misericordiam cum servis tuis, qui ambulant coram te in toto corde suo:"
      en: "He said: O Lord God of Israel, there is no God like thee in heaven nor in earth: who keepest covenant and mercy with thy servants, that walk before thee with all their hearts:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui praestitisti servo tuo David patri meo quaecumque locutus fueras ei: et quae ore promiseras, opere complesti, sicut et praesens tempus probat."
      en: "Who hast performed to thy servant David my father all that thou hast promised him: and hast accomplished in fact, what thou hast spoken with thy mouth, as also the present time proveth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nunc ergo Domine Deus Israel, imple servo tuo patri meo David quaecumque locutus es, dicens: Non deficiet ex te vir coram me, qui sedeat super thronum Israel: ita tamen si custodierint filii tui vias suas, et ambulaverint in lege mea, sicut et tu ambulasti coram me."
      en: "Now then, O Lord God of Israel, fulfill to thy servant David my father, whatsoever thou hast promised him, saying: There shall not fail thee a man in my sight, to sit upon the throne of Israel: yet so that thy children take heed to their ways, and walk in my law, as thou hast walked before me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et nunc Domine Deus Israel, firmetur sermo tuus, quem locutus es servo tuo David."
      en: "And now, Lord God of Israel, let thy word be established which thou hast spoken to thy servant David."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ergone credibile est ut habitet Deus cum hominibus super terram? si caelum et caeli caelorum non te capiunt, quanto magis domus ista, quam aedificavi?"
      en: "Is it credible then that God should dwell with men on the earth? If heaven and the heavens of heavens do not contain thee, how much less this house, which I have built?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sed ad hoc tantum facta est, ut respicias orationem servi tui, et obsecrationem ejus, Domine Deus meus: et audias preces, quas fundit famulus tuus coram te,"
      en: "But to this end only it is made, that thou mayest regard the prayer of thy servant and his supplication, O Lord my God: and mayest hear the prayers which thy servant poureth out before thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ut aperias oculos tuos super domum istam diebus ac noctibus, super locum, in quo pollicitus es ut invocaretur nomen tuum,"
      en: "That thou mayest open thy eyes upon this house day and night, upon the place wherein thou hast promised that thy name should be called upon,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et exaudires orationem, quam servus tuus orat in eo: et exaudias preces famuli tui, et populi tui Israel. Quicumque oraverit in loco isto, exaudi de habitaculo tuo, id est, de caelis, et propitiare."
      en: "And that thou wouldst hear the prayer which thy servant prayeth in it: hearken then to the prayers of thy servant, and of thy people Israel. Whosoever shall pray in this place, hear thou from thy dwelling place, that is, from heaven, and shew mercy."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Si peccaverit quispiam in proximum suum, et jurare contra eum paratus venerit, seque maledicto constrinxerit coram altari in domo ista:"
      en: "If any man sin against his neighbour, and come to swear against him, and bind himself with a curse before the altar in this house:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "tu audies de caelo, et facies judicium servorum tuorum, ita ut reddas iniquo viam suam in caput proprium, et ulciscaris justum, retribuens ei secundum justitiam suam."
      en: "Then hear thou from heaven, and do justice to thy servants, so as to requite the wicked by making his wickedness fall upon his own head, and to revenge the just, rewarding him according to his justice."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Si superatus fuerit populus tuus Israel ab inimicis ( peccabunt enim tibi) et conversi egerint poenitentiam, et obsecraverint nomen tuum, et fuerint deprecati in loco isto,"
      en: "If thy people Israel be overcome by their enemies, (for they will sin against thee,) and being converted shall do penance, and call upon thy name, and pray to thee in this place,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "tu exaudies de caelo, et propitiare peccato populi tui Israel, et reduc eos in terram, quam dedisti eis, et patribus eorum."
      en: "Then hear thou from heaven, and forgive the sin of thy people Israel, and bring them back into the land, which thou gavest to them, and their fathers."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Si clauso caelo pluvia non fluxerit propter peccata populi, et deprecati te fuerint in loco isto, et confessi nomini tuo, et conversi a peccatis suis, cum eos afflixeris,"
      en: "If the heavens be shut up, and there fall no rain by reason of the sins of the people, and they shall pray to thee in this place, and confess to thy name, and be converted from their sins, when thou dost afflict them,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "exaudi de caelo, Domine, et dimitte peccata servis tuis et populi tui Israel, et doce eos viam bonam, per quam ingrediantur: et da pluviam terrae, quam dedisti populo tuo ad possidendum."
      en: "Then hear thou from heaven, O Lord, and forgive the sins of thy servants and of thy people Israel, and teach them the good way, in which they may walk: and give rain to thy land which thou hast given to thy people to possess."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Fames si orta fuerit in terra et pestilentia, aerugo, et aurugo, et locusta, et bruchus, et hostes, vastatis regionibus, portas obsederint civitatis, omnisque plaga et infirmitas presserit:"
      en: "If a famine arise in the land, or a pestilence or blasting, or mildew, or locusts, or caterpillars: or if their enemies waste the country, and besiege the cities, whatsoever scourge or infirmity shall be upon them:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "si quis de populo tuo Israel fuerit deprecatus, cognoscens plagam et infirmitatem suam, et expanderit manus suas in domo hac,"
      en: "Then if any of thy people Israel, knowing his own scourge and infirmity shall pray, and shall spread forth his hands in this house,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "tu exaudies de caelo, de sublimi scilicet habitaculo tuo, et propitiare, et redde unicuique secundum vias suas, quas nosti eum habere in corde suo ( tu enim solus nosti corda filiorum hominum):"
      en: "Hear thou from heaven, from thy high dwelling place, and forgive, and render to every one according to his ways, which thou knowest him to have in his heart: (for thou only knowest the hearts of the children of men:)"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ut timeant te, et ambulent in viis tuis cunctis diebus, quibus vivunt super faciem terrae, quam dedisti patribus nostris."
      en: "That they may fear thee, and walk in thy ways all the days that they live upon the face of the land, which thou hast given to our fathers."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Externum quoque, qui non est de populo tuo Israel, si venerit de terra longinqua propter nomen tuum magnum, et propter manum tuam robustam, et brachium tuum extentum, et adoraverit in loco isto,"
      en: "If the stranger also, who is not of thy people Israel, come from a far country, for the sake of thy great name, and thy strong hand, and thy stretched out arm, and adore in this place:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "tu exaudies de caelo firmissimo habitaculo tuo, et facies cuncta, pro quibus invocaverit te ille peregrinus: ut sciant omnes populi terrae nomen tuum, et timeant te sicut populus tuus Israel, et cognoscant, quia nomen tuum invocatum est super domum hanc, quam aedificavi."
      en: "Hear thou from heaven thy firm dwelling place, and do all that which that stranger shall call upon thee for: that all the people of the earth may know thy name, and may fear thee, as thy people Israel, and may know, that thy name is invoked upon this house, which I have built."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Si egressus fuerit populus tuus ad bellum contra adversarios suos per viam in qua miseris eos, adorabunt te contra viam, in qua civitas haec est, quam elegisti, et domus, quam aedificavi nomini tuo:"
      en: "If thy people go out to war against their enemies, by the way that thou shalt send them, and adore thee towards the way of this city, which thou hast chosen, and the house which I have built to thy name:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "tu exaudies de caelo preces eorum, et obsecrationem, et ulciscaris."
      en: "Then hear thou from heaven their prayers, and their supplications, and revenge them."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Si autem peccaverint tibi ( neque enim est homo, qui non peccet) et iratus fueris eis, et tradideris hostibus, et captivos duxerint eos in terram longinquam, vel certe quae juxta est,"
      en: "And if they sin against thee (for there is no man that sinneth not) and thou be angry with them, and deliver them up to their enemies, and they lead them away captive to a land either afar off, or near at hand,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et conversi in corde suo in terra, ad quam captivi ducti fuerant, egerint poenitentiam, et deprecati te fuerint in terra captivitatis suae, dicentes: Peccavimus; inique fecimus, injuste egimus:"
      en: "And if they be converted in their heart in the land to which they were led captive, and do penance, and pray to thee in the land of their captivity, saying: We have sinned, we have done wickedly, we have dealt unjustly:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et reversi fuerint ad te in toto corde suo, et in tota anima sua, in terra captivitatis suae, ad quam ducti sunt, adorabunt te contra viam terrae suae, quam dedisti patribus eorum, et urbis, quam elegisti, et domus, quam aedificavi nomini tuo:"
      en: "And return to thee with all their heart, and with all their soul, in the land of their captivity, to which they were led away, and adore thee towards the way of their own land which thou gavest their fathers, and of the city, which thou hast chosen, and the house which I have built to thy name:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "tu exaudies de caelo, hoc est, de firmo habitaculo tuo, preces eorum, et facias judicium, et dimittas populo tuo, quamvis peccatori:"
      en: "Then hear thou from heaven, that is, from thy firm dwelling place, their prayers, and do judgment, and forgive thy people, although they have sinned:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "tu es enim Deus meus: aperiantur, quaeso, oculi tui, et aures tuae intentae sint ad orationem, quae fit in loco isto."
      en: "For thou art my God: let thy eyes, I beseech thee, be open, and let thy ears be attentive to the prayer, that is made in this place."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Nunc igitur consurge, Domine Deus, in requiem tuam, tu et arca fortitudinis tuae: sacerdotes tui, Domine Deus, induantur salutem, et sancti tui laetentur in bonis."
      en: "Now therefore arise, O Lord God, into thy resting place, thou and the ark of thy strength: let thy priests, O Lord God, put on salvation, and thy saints rejoice in good things."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Domine Deus, ne averteris faciem christi tui: memento misericordiarum David servi tui."
      en: "O Lord God, turn not away the face of thy anointed: remember the mercies of David thy servant."
    status: { la: verified, en: verified }
