# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 4
verses:
  - n: 1
    text:
      la: "Si reverteris, Israel, ait Dominus, ad me convertere: si abstuleris offendicula tua a facie mea, non commoveberis."
      en: "If thou wilt return, O Israel, saith the Lord, return to me: if thou wilt take away thy stumblingblocks out of my sight, thou shalt not be moved."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et jurabis: Vivit Dominus! in veritate, et in judicio, et in justitia: et benedicent eum gentes, ipsumque laudabunt."
      en: "And thou shalt swear: As the Lord liveth, in truth, and in judgment, and in justice: and the Gentiles shall bless him, and shall praise him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Haec enim dicit Dominus viro Juda et Jerusalem: Novate vobis novale, et nolite serere super spinas."
      en: "For thus saith the Lord to the men of Juda and Jerusalem: Break up anew your fallow ground, and sow not upon thorns:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Circumcidimini Domino, et auferte praeputia cordium vestrorum, viri Juda, et habitatores Jerusalem, ne forte egrediatur ut ignis indignatio mea, et succendatur, et non sit qui extinguat, propter malitiam cogitationum vestrarum."
      en: "Be circumcised to the Lord, and take away the foreskins of your hearts, ye men of Juda, and ye inhabitants of Jerusalem: lest my indignation come forth like fire, and burn, and there be none that can quench it: because of the wickedness of your thoughts."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Annuntiate in Juda, et in Jerusalem auditum facite: loquimini, et canite tuba in terra, clamate fortiter, et dicite: Congregamini, et ingrediamur civitates munitas."
      en: "Declare ye in Juda, and make it heard in Jerusalem: speak, and sound with the trumpet in the land: cry aloud, and say: Assemble yourselves, and let us go into strong cities."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Levate signum in Sion, confortamini, nolite stare, quia malum ego adduco ab aquilone, et contritionem magnam."
      en: "Set up the standard in Sion. Strengthen yourselves, stay not: for I bring evil from the north, and great destruction."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ascendit leo de cubili suo, et praedo gentium se levavit: egressus est de loco suo ut ponat terram tuam in solitudinem: civitates tuae vastabuntur, remanentes absque habitatore."
      en: "The lion is come up out of his den, and the robber of nations hath roused himself: he is come forth out of his place, to make thy land desolate: thy cities shall be laid waste, remaining without an inhabitant."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Super hoc accingite vos ciliciis, plangite, et ululate, quia non est aversa ira furoris Domini a nobis."
      en: "For this gird yourselves with haircloth, lament and howl: for the fierce anger of the Lord is not turned away from us."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et erit in die illa, dicit Dominus: peribit cor regis, et cor principum, et obstupescent sacerdotes, et prophetae consternabuntur."
      en: "And it shall come to pass in that day, saith the Lord: That the heart of the king shall perish, and the heart of the princes: and the priests shall be astonished, and the prophets shall be amazed."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dixi: Heu! heu! heu! Domine Deus, ergone decepisti populum istum et Jerusalem, dicens: Pax erit vobis: et ecce pervenit gladius usque ad animam?"
      en: "And I said: Alas, alas, alas, O Lord God, hast thou then deceived this people and Jerusalem, saying: You shall have peace: and behold the sword reacheth even to the soul?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In tempore illo dicetur populo huic et Jerusalem: Ventus urens in viis quae sunt in deserto viae filiae populi mei, non ad ventilandum et ad purgandum."
      en: "At that time it shall be said to this people, and to Jerusalem: A burning wind is in the ways that are in the desert of the way of the daughter of my people, not to fan, nor to cleanse."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Spiritus plenus ex his veniet mihi, et nunc ego loquar judicia mea cum eis."
      en: "A full wind from these places shall come to me: and now I will speak my judgments with them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ecce quasi nubes ascendet: et quasi tempestas currus ejus, velociores aquilis equi illius. Vae nobis! quoniam vastati sumus."
      en: "Behold he shall come up as a cloud, and his chariots as a tempest: his horses are swifter than eagles: woe unto us, for we are laid waste."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Lava a malitia cor tuum, Jerusalem, ut salva fias: usquequo morabuntur in te cogitationes noxiae?"
      en: "Wash thy heart from wickedness, O Jerusalem, that thou mayst be saved: how long shall hurtful thoughts abide in thee?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vox enim annuntiantis a Dan, et notum facientis idolum de monte Ephraim."
      en: "For a voice of one declaring from Dan, and giving notice of the idol from mount Ephraim."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dicite gentibus: Ecce auditum est in Jerusalem custodes venire de terra longinqua, et dare super civitates Juda vocem suam:"
      en: "Say ye to the nations: Behold it is heard in Jerusalem, that guards are coming from a far country, and give out their voice against the cities of Juda."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quasi custodes agrorum facti sunt super eam in gyro, quia me ad iracundiam provocavit, dicit Dominus."
      en: "They are set round about her, as keepers of fields: because she hath provoked me to wrath, saith the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Viae tuae et cogitationes tuae fecerunt haec tibi: ista malitia tua, quia amara, quia tetigit cor tuum."
      en: "Thy ways, and thy devices have brought these things upon thee: this is thy wickedness, because it is bitter, because it hath touched thy heart."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ventrem meum, ventrem meum doleo, sensus cordis mei turbati sunt in me. Non tacebo, quoniam vocem buccinae audivit anima mea, clamorem praelii."
      en: "My bowels, my bowels are in pain, the senses of my heart are troubled within me, I will not hold my peace, for my soul hath heard the sound of the trumpet, the cry of battle."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Contritio super contritionem vocata est: et vastata est omnis terra, repente vastata sunt tabernacula mea, subito pelles meae."
      en: "Destruction upon destruction is called for, and all the earth is laid waste: my tents are destroyed on a sudden, and my pavilions in a moment."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Usquequo videbo fugientem, audiam vocem buccinae?"
      en: "How long shall I see men fleeing away, how long shall I hear the sound of the trumpet?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quia stultus populus meus me non cognovit. Filii insipientes sunt et vecordes: sapientes sunt ut faciant mala, bene autem facere nescierunt."
      en: "For my foolish people have not known me: they are foolish and senseless children: they are wise to do evil, but to do good they have no knowledge."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Aspexi terram, et ecce vacua erat et nihili: et caelos, et non erat lux in eis."
      en: "I beheld the earth, and lo it was void, and nothing: and the heavens, and there was no light in them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Vidi montes, et ecce movebantur: et omnes colles conturbati sunt."
      en: "I looked upon the mountains, and behold they trembled: and all the hills were troubled."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Intuitus sum, et non erat homo: et omne volatile caeli recessit."
      en: "I beheld, and lo there was no man: and all the birds of the air were gone."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Aspexi, et ecce Carmelus desertus, et omnes urbes ejus destructae sunt a facie Domini, et a facie irae furoris ejus."
      en: "I looked, and behold Carmel was a wilderness: and all its cities were destroyed at the presence of the Lord, and at the presence of the wrath of his indignation."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Haec enim dicit Dominus: Deserta erit omnis terra, sed tamen consummationem non faciam."
      en: "For thus saith the Lord: All the land shall be desolate, but yet I will not utterly destroy."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Lugebit terra, et moerebunt caeli desuper, eo quod locutus sum. Cogitavi, et non poenituit me, nec aversus sum ab eo."
      en: "The earth shall mourn, and the heavens shall lament from above: because I have spoken, I have purposed, and I have not repented, neither am I turned away from it."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "A voce equitis et mittentis sagittam fugit omnis civitas: ingressi sunt ardua, et ascenderunt rupes: universae urbes derelictae sunt, et non habitat in eis homo."
      en: "At the voice of the horsemen, and the archers, all the city is fled away; they have entered into thickets and have climbed up the rocks: all the cities are forsaken, and there dwelleth not a man in them."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Tu autem vastata, quid facies? Cum vestieris te coccino, cum ornata fueris monili aureo, et pinxeris stibio oculos tuos, frustra componeris: contempserunt te amatores tui, animam tuam quaerent."
      en: "But when thou art spoiled what wilt thou do? though thou deckest thee with ornaments of gold, and paintest thy eyes with stibic stone, thou shalt dress thyself out in vain: thy lovers have despised thee, they will seek thy life."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Vocem enim quasi parturientis audivi, angustias ut puerperae: vox filiae Sion intermorientis, expandentisque manus suas: Vae mihi quia defecit anima mea propter interfectos!"
      en: "For I have heard the voice as of a woman in travail, anguishes as of a woman in labor of a child. The voice of the daughter of Sion, dying away, spreading her hands: Woe is me, for my soul hath fainted because of them that are slain."
    status: { la: verified, en: verified }
