# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 14
verses:
  - n: 1
    text:
      la: "In illo tempore audivit Herodes tetrarcha fama Jesu:"
      en: "At the time Herod the Tetrarch heard the fame of Jesus."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ait pueris suis: Hic est Joannes Baptista: ipse surrexit a mortuis, et ideo virtutes operantur in eo."
      en: "And he said to his servants: This is John the Baptist: he is risen from the dead, and therefore mighty works shew forth themselves in him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Herodes enim tenuit Joannem, et alligavit eum: et posuit in carcerem propter Herodiadem uxorem fratris sui."
      en: "For Herod had apprehended John and bound him, and put him into prison, because of Herodias, his brother's wife."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dicebat enim illi Joannes: Non licet tibi habere eam."
      en: "For John said to him: It is not lawful for thee to have her."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et volens illum occidere, timuit populum: quia sicut prophetam eum habebant."
      en: "And having a mind to put him to death, he feared the people: because they esteemed him as a prophet."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Die autem natalis Herodis saltavit filia Herodiadis in medio, et placuit Herodi:"
      en: "But on Herod's birthday, the daughter of Herodias danced before them: and pleased Herod."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "unde cum juramento pollicitus est ei dare quodcumque postulasset ab eo."
      en: "Whereupon he promised with an oath, to give her whatsoever she would ask of him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "At illa praemonita a matre sua: Da mihi, inquit, hic in disco caput Joannis Baptistae."
      en: "But she being instructed before by her mother, said: Give me here in a dish the head of John the Baptist."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et contristatus est rex: propter juramentum autem, et eos qui pariter recumbebant, jussit dari."
      en: "And the king was struck sad: yet because of his oath, and for them that sat with him at table, he commanded it to be given."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Misitque et decollavit Joannem in carcere."
      en: "And he sent, and beheaded John in the prison."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et allatum est caput ejus in disco, et datum est puellae, et attulit matri suae."
      en: "And his head was brought in a dish: and it was given to the damsel, and she brought it to her mother."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et accedentes discipuli ejus, tulerunt corpus ejus, et sepelierunt illud: et venientes nuntiaverunt Jesu."
      en: "And his disciples came and took the body, and buried it, and came and told Jesus."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quod cum audisset Jesus, secessit inde in navicula, in locum desertum seorsum: et cum audissent turbae, secutae sunt eum pedestres de civitatibus."
      en: "Which when Jesus had heard, he retired from thence by boat, into a desert place apart, and the multitudes having heard of it, followed him on foot out of the cities."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et exiens vidit turbam multam, et misertus est eis, et curavit languidos eorum."
      en: "And he coming forth saw a great multitude, and had compassion on them, and healed their sick."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vespere autem facto, accesserunt ad eum discipuli ejus, dicentes: Desertus est locus, et hora jam praeteriit: dimitte turbas, ut euntes in castella, emant sibi escas."
      en: "And when it was evening, his disciples came to him, saying: This is a desert place, and the hour is now past: send away the multitudes, that going into the towns, they may buy themselves victuals."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Jesus autem dixit eis: Non habent necesse ire: date illis vos manducare."
      en: "But Jesus said to them, They have no need to go: give you them to eat."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Responderunt ei: Non habemus hic nisi quinque panes et duos pisces."
      en: "They answered him: We have not here, but five loaves, and two fishes."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui ait eis: Afferte mihi illos huc."
      en: "He said to them: Bring them hither to me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et cum jussisset turbam discumbere super foenum, acceptis quinque panibus et duobus piscibus, aspiciens in caelum benedixit, et fregit, et dedit discipulis panes, discipuli autem turbis."
      en: "And when he had commanded the multitudes to sit down upon the grass, he took the five loaves and the two fishes, and looking up to heaven, he blessed, and brake, and gave the loaves to his disciples, and the disciples to the multitudes."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et manducaverunt omnes, et saturati sunt. Et tulerunt reliquias, duodecim cophinos fragmentorum plenos."
      en: "And they did all eat, and were filled. And they took up what remained, twelve full baskets of fragments."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Manducantium autem fuit numerus quinque millia virorum, exceptis mulieribus et parvulis."
      en: "And the number of them that did eat, was five thousand men, besides women and children."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et statim compulit Jesus discipulos ascendere in naviculam, et praecedere eum trans fretum, donec dimitteret turbas."
      en: "And forthwith Jesus obliged his disciples to go up into the boat, and to go before him over the water, till he dismissed the people."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et dimissa turba, ascendit in montem solus orare. Vespere autem facto solus erat ibi:"
      en: "And having dismissed the multitude, he went into a mountain alone to pray. And when it was evening, he was there alone."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "navicula autem in medio mari jactabatur fluctibus: erat enim contrarius ventus."
      en: "But the boat in the midst of the sea was tossed with the waves: for the wind was contrary."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Quarta enim vigilia noctis, venit ad eos ambulans super mare."
      en: "And in the fourth watch of the night, he came to them walking upon the sea."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et videntes eum super mare ambulantem, turbati sunt, dicentes: Quia phantasma est. Et prae timore clamaverunt."
      en: "And they seeing him walk upon the sea, were troubled, saying: It is an apparition. And they cried out for fear."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Statimque Jesus locutus est eis, dicens: Habete fiduciam: ego sum, nolite timere."
      en: "And immediately Jesus spoke to them, saying: Be of good heart: it is I, fear ye not."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Respondens autem Petrus, dixit: Domine, si tu es, jube me ad te venire super aquas."
      en: "And Peter making answer, said: Lord, if it be thou, bid me come to thee upon the waters."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "At ipse ait: Veni. Et descendens Petrus de navicula, ambulabat super aquam ut veniret ad Jesum."
      en: "And he said: Come. And Peter going down out of the boat, walked upon the water to come to Jesus."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Videns vero ventum validum, timuit: et cum coepisset mergi, clamavit dicens: Domine, salvum me fac."
      en: "But seeing the wind strong, he was afraid: and when he began to sink, he cried out, saying: Lord, save me."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et continuo Jesus extendens manum, apprehendit eum: et ait illi: Modicae fidei, quare dubitasti?"
      en: "And immediately Jesus stretching forth his hand took hold of him, and said to him: O thou of little faith, why didst thou doubt?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et cum ascendissent in naviculam, cessavit ventus."
      en: "And when they were come up into the boat, the wind ceased."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Qui autem in navicula erant, venerunt, et adoraverunt eum, dicentes: Vere Filius Dei es."
      en: "And they that were in the boat came and adored him, saying: Indeed thou art the Son of God."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et cum transfretassent, venerunt in terram Genesar."
      en: "And having passed the water, they came into the country of Genesar."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et cum cognovissent eum viri loci illius, miserunt in universam regionem illam, et obtulerunt ei omnes male habentes:"
      en: "And when the men of that place had knowledge of him, they sent into all that country, and brought to him all that were diseased."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et rogabant eum ut vel fimbriam vestimenti ejus tangerent. Et quicumque tetigerunt, salvi facti sunt."
      en: "And they besought him that they might touch but the hem of his garment. And as many as touched, were made whole."
    status: { la: verified, en: verified }
