# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: rom
chapter: 3
verses:
  - n: 1
    text:
      la: "quid ergo amplius est Iudaeo aut quae utilitas circumcisionis"
      en: "What advantage then hath the Jew, or what is the profit of circumcision?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "multum per omnem modum primum quidem quia credita sunt illis eloquia Dei"
      en: "Much every way. First indeed, because the words of God were committed to them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quid enim si quidam illorum non crediderunt numquid incredulitas illorum fidem Dei evacuabit absit"
      en: "For what if some of them have not believed? shall their unbelief make the faith of God without effect? God forbid."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "est autem Deus verax omnis autem homo mendax sicut scriptum est ut iustificeris in sermonibus tuis et vincas cum iudicaris"
      en: "But God is true; and every man a liar, as it is written, That thou mayest be justified in thy words, and mayest overcome when thou art judged."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si autem iniquitas nostra iustitiam Dei commendat quid dicemus numquid iniquus Deus qui infert iram secundum hominem dico"
      en: "But if our injustice commend the justice of God, what shall we say? Is God unjust, who executeth wrath?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "absit alioquin quomodo iudicabit Deus mundum"
      en: "(I speak according to man.) God forbid: otherwise how shall God judge this world?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si enim veritas Dei in meo mendacio abundavit in gloriam ipsius quid adhuc et ego tamquam peccator iudicor"
      en: "For if the truth of God hath more abounded through my lie, unto his glory, why am I also yet judged as a sinner?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et non sicut blasphemamur et sicut aiunt nos quidam dicere faciamus mala ut veniant bona quorum damnatio iusta est"
      en: "And not rather (as we are slandered, and as some affirm that we say) let us do evil, that there may come good? whose damnation is just."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quid igitur praecellimus eos nequaquam causati enim sumus Iudaeos et Graecos omnes sub peccato esse"
      en: "What then? Do we excel them? No, not so. For we have charged both Jews, and Greeks, that they are all under sin."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sicut scriptum est quia non est iustus quisquam"
      en: "As it is written: There is not any man just."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non est intellegens non est requirens Deum"
      en: "There is none that understandeth, there is none that seeketh after God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "omnes declinaverunt simul inutiles facti sunt non est qui faciat bonum non est usque ad unum"
      en: "All have turned out of the way; they are become unprofitable together: there is none that doth good, there is not so much as one."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sepulchrum patens est guttur eorum linguis suis dolose agebant venenum aspidum sub labiis eorum"
      en: "Their throat is an open sepulchre; with their tongues they have dealt deceitfully. The venom of asps is under their lips."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quorum os maledictione et amaritudine plenum est"
      en: "Whose mouth is full of cursing and bitterness:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "veloces pedes eorum ad effundendum sanguinem"
      en: "Their feet swift to shed blood:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "contritio et infelicitas in viis eorum"
      en: "Destruction and misery in their ways:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et viam pacis non cognoverunt"
      en: "And the way of peace they have not known:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non est timor Dei ante oculos eorum"
      en: "There is no fear of God before their eyes."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "scimus autem quoniam quaecumque lex loquitur his qui in lege sunt loquitur ut omne os obstruatur et subditus fiat omnis mundus Deo"
      en: "Now we know, that what things soever the law speaketh, it speaketh to them that are in the law; that every mouth may be stopped, and all the world may be made subject to God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quia ex operibus legis non iustificabitur omnis caro coram illo per legem enim cognitio peccati"
      en: "Because by the works of the law no flesh shall be justified before him. For by the law is the knowledge of sin."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nunc autem sine lege iustitia Dei manifestata est testificata a lege et prophetis"
      en: "But now without the law the justice of God is made manifest, being witnessed by the law and the prophets."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "iustitia autem Dei per fidem Iesu Christi super omnes qui credunt non enim est distinctio"
      en: "Even the justice of God, by faith of Jesus Christ, unto all and upon all them that believe in him: for there is no distinction:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "omnes enim peccaverunt et egent gloriam Dei"
      en: "For all have sinned, and do need the glory of God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "iustificati gratis per gratiam ipsius per redemptionem quae est in Christo Iesu"
      en: "Being justified freely by his grace, through the redemption, that is in Christ Jesus,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "quem proposuit Deus propitiationem per fidem in sanguine ipsius ad ostensionem iustitiae suae propter remissionem praecedentium delictorum"
      en: "Whom God hath proposed to be a propitiation, through faith in his blood, to the shewing of his justice, for the remission of former sins,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "in sustentatione Dei ad ostensionem iustitiae eius in hoc tempore ut sit ipse iustus et iustificans eum qui ex fide est Iesu"
      en: "Through the forbearance of God, for the shewing of his justice in this time; that he himself may be just, and the justifier of him, who is of the faith of Jesus Christ."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ubi est ergo gloriatio exclusa est per quam legem factorum non sed per legem fidei"
      en: "Where is then thy boasting? It is excluded. By what law? Of works? No, but by the law of faith."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "arbitramur enim iustificari hominem per fidem sine operibus legis"
      en: "For we account a man to be justified by faith, without the works of the law."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "an Iudaeorum Deus tantum nonne et gentium immo et gentium"
      en: "Is he the God of the Jews only? Is he not also of the Gentiles? Yes, of the Gentiles also."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quoniam quidem unus Deus qui iustificabit circumcisionem ex fide et praeputium per fidem"
      en: "For it is one God, that justifieth circumcision by faith, and uncircumcision through faith."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "legem ergo destruimus per fidem absit sed legem statuimus"
      en: "Do we, then, destroy the law through faith? God forbid: but we establish the law."
    status: { la: verified, en: verified }
