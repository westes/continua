# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gal
chapter: 3
verses:
  - n: 1
    text:
      la: "o insensati Galatae quis vos fascinavit ante quorum oculos Iesus Christus proscriptus est crucifixus"
      en: "O senseless Galatians, who hath bewitched you that you should not obey the truth, before whose eyes Jesus Christ hath been set forth, crucified among you?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "hoc solum volo a vobis discere ex operibus legis Spiritum accepistis an ex auditu fidei"
      en: "This only would I learn of you: Did you receive the Spirit by the works of the law, or by the hearing of faith?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sic stulti estis cum Spiritu coeperitis nunc carne consummamini"
      en: "Are you so foolish, that, whereas you began in the Spirit, you would now be made perfect by the flesh?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "tanta passi estis sine causa si tamen sine causa"
      en: "Have you suffered so great things in vain? If it be yet in vain."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui ergo tribuit vobis Spiritum et operatur virtutes in vobis ex operibus legis an ex auditu fidei"
      en: "He therefore who giveth to you the Spirit, and worketh miracles among you; doth he do it by the works of the law, or by the hearing of the faith?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sicut Abraham credidit Deo et reputatum est ei ad iustitiam"
      en: "As it is written: Abraham believed God, and it was reputed to him unto justice."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cognoscitis ergo quia qui ex fide sunt hii sunt filii Abrahae"
      en: "Know ye therefore, that they who are of faith, the same are the children of Abraham."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "providens autem scriptura quia ex fide iustificat gentes Deus praenuntiavit Abrahae quia benedicentur in te omnes gentes"
      en: "And the scripture, foreseeing, that God justifieth the Gentiles by faith, told unto Abraham before: In thee shall all nations be blessed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "igitur qui ex fide sunt benedicentur cum fideli Abraham"
      en: "Therefore they that are of faith, shall be blessed with faithful Abraham."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quicumque enim ex operibus legis sunt sub maledicto sunt scriptum est enim maledictus omnis qui non permanserit in omnibus quae scripta sunt in libro legis ut faciat ea"
      en: "For as many as are of the works of the law, are under a curse. For it is written: Cursed is every one, that abideth not in all things, which are written in the book of the law to do them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quoniam autem in lege nemo iustificatur apud Deum manifestum est quia iustus ex fide vivit"
      en: "But that in the law no man is justified with God, it is manifest: because the just man liveth by faith."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "lex autem non est ex fide sed qui fecerit ea vivet in illis"
      en: "But the law is not of faith: but, He that doth those things, shall live in them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Christus nos redemit de maledicto legis factus pro nobis maledictum quia scriptum est maledictus omnis qui pendet in ligno"
      en: "Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written: Cursed is every one that hangeth on a tree:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ut in gentibus benedictio Abrahae fieret in Christo Iesu ut pollicitationem Spiritus accipiamus per fidem"
      en: "That the blessing of Abraham might come on the Gentiles through Christ Jesus: that we may receive the promise of the Spirit by faith."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "fratres secundum hominem dico tamen hominis confirmatum testamentum nemo spernit aut superordinat"
      en: "Brethren (I speak after the manner of man,) yet a man's testament, if it be confirmed, no man despiseth, nor addeth to it."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Abrahae dictae sunt promissiones et semini eius non dicit et seminibus quasi in multis sed quasi in uno et semini tuo qui est Christus"
      en: "To Abraham were the promises made and to his seed. He saith not, And to his seeds, as of many: but as of one, And to thy seed, which is Christ."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "hoc autem dico testamentum confirmatum a Deo quae post quadringentos et triginta annos facta est lex non irritam facit ad evacuandam promissionem"
      en: "Now this I say, that the testament which was confirmed by God, the law which was made after four hundred and thirty years, doth not disannul, to make the promise of no effect."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "nam si ex lege hereditas iam non ex repromissione Abrahae autem per promissionem donavit Deus"
      en: "For if the inheritance be of the law, it is no more of promise. But God gave it to Abraham by promise."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quid igitur lex propter transgressiones posita est donec veniret semen cui promiserat ordinata per angelos in manu mediatoris"
      en: "Why then was the law? It was set because of transgressions, until the seed should come, to whom he made the promise, being ordained by angels in the hand of a mediator."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "mediator autem unius non est Deus autem unus est"
      en: "Now a mediator is not of one: but God is one."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "lex ergo adversus promissa Dei absit si enim data esset lex quae posset vivificare vere ex lege esset iustitia"
      en: "Was the law then against the promises of God? God forbid. For if there had been a law given which could give life, verily justice should have been by the law."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sed conclusit scriptura omnia sub peccato ut promissio ex fide Iesu Christi daretur credentibus"
      en: "But the scripture hath concluded all under sin, that the promise, by the faith of Jesus Christ, might be given to them that believe."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "prius autem quam veniret fides sub lege custodiebamur conclusi in eam fidem quae revelanda erat"
      en: "But before the faith came, we were kept under the law shut up, unto that faith which was to be revealed."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "itaque lex pedagogus noster fuit in Christo ut ex fide iustificemur"
      en: "Wherefore the law was our pedagogue in Christ, that we might be justified by faith."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "at ubi venit fides iam non sumus sub pedagogo"
      en: "But after the faith is come, we are no longer under a pedagogue."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "omnes enim filii Dei estis per fidem in Christo Iesu"
      en: "For you are all the children of God by faith, in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "quicumque enim in Christo baptizati estis Christum induistis"
      en: "For as many of you as have been baptized in Christ, have put on Christ."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "non est Iudaeus neque Graecus non est servus neque liber non est masculus neque femina omnes enim vos unum estis in Christo Iesu"
      en: "There is neither Jew nor Greek: there is neither bond nor free: there is neither male nor female. For you are all one in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "si autem vos Christi ergo Abrahae semen estis secundum promissionem heredes"
      en: "And if you be Christ's, then are you the seed of Abraham, heirs according to the promise."
    status: { la: verified, en: verified }
