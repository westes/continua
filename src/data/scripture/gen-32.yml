# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 32
verses:
  - n: 1
    text:
      la: "Jacob quoque abiit itinere quo coeperat: fueruntque ei obviam angeli Dei."
      en: "Jacob also went on the journey he had begun: and the angels of God met him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quos cum vidisset, ait: Castra Dei sunt haec: et appellavit nomen loci illius Mahanaim, id est, Castra."
      en: "And when he saw them, he said: These are the camps of God, and he called the name of that place Mahanaim, that is, Camps."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Misit autem et nuntios ante se ad Esau fratrem suum in terram Seir, in regionem Edom:"
      en: "And he sent messengers before him to Esau his brother to the land of Seir to the country of Edom:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "praecepitque eis, dicens: Sic loquimini domino meo Esau: Haec dicit frater tuus Jacob: Apud Laban peregrinatus sum, et fui usque in praesentem diem."
      en: "And he commanded them, saying: Thus shall ye speak to my lord Esau: Thus saith thy brother Jacob: I have sojourned with Laban, and have been with him until this day."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Habeo boves, et asinos, et oves, et servos, et ancillas: mittoque nunc legationem ad dominum meum, ut inveniam gratiam in conspectu tuo."
      en: "I have oxen, and asses, and sheep, and menservants, and womenservants: and now I send a message to my lord, that I may find favour in thy sight."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Reversique sunt nuntii ad Jacob, dicentes: Venimus ad Esau fratrem tuum, et ecce properat tibi in occursum cum quadringentis viris."
      en: "And the messengers returned to Jacob, saying: We came to Esau thy brother, and behold he cometh with speed to meet thee with four hundred men."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Timuit Jacob valde: et perterritus divisit populum qui secum erat, greges quoque et oves, et boves, et camelos, in duas turmas,"
      en: "Then Jacob was greatly afraid; and in his fear divided the people that was with him, and the flocks, and the sheep, and the oxen, and the camels, into two companies,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dicens: Si venerit Esau ad unam turmam, et percusserit eam, alia turma, quae relicta est, salvabitur."
      en: "Saying: If Esau come to one company and destroy it, the other company that is left shall escape."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixitque Jacob: Deus patris mei Abraham, et Deus patris mei Isaac: Domine qui dixisti mihi: Revertere in terram tuam, et in locum nativitatis tuae, et benefaciam tibi:"
      en: "And Jacob said: O God of my father Abraham, and God of my father Isaac, O Lord, who saidst to me: Return to thy land and to the place of thy birth, and I will do well for thee,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "minor sum cunctis miserationibus tuis, et veritate tua quam explevisti servo tuo. In baculo meo transivi Jordanem istum: et nunc cum duabus turmis regredior."
      en: "I am not worthy of the least of all thy mercies, and of thy truth which thou hast fulfilled to thy servant. With my staff I passed over this Jordan; and now I return with two companies."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Erue me de manu fratris mei Esau, quia valde eum timeo: ne forte veniens percutiat matrem cum filiis."
      en: "Deliver me from the hand of my brother Esau, for I am greatly afraid of him: lest perhaps he come, and kill the mother with the children."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tu locutus es quod benefaceres mihi, et dilatares semen meum sicut arenam maris, quae prae multitudine numerari non potest."
      en: "Thou didst say that thou wouldst do well by me, and multiply my seed like the sand of the sea, which cannot be numbered for multitude."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cumque dormisset ibi nocte illa, separavit de his quae habebat, munera Esau fratri suo,"
      en: "And when he had slept there that night, he set apart, of the things which he had, presents for his brother Esau."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "capras ducentas, hircos viginti, oves ducentas, et arietes viginti,"
      en: "Two hundred she goats, twenty he goats, two hundred ewes, and twenty rams,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "camelos foetas cum pullis suis triginta, vaccas quadraginta, et tauros viginti, asinas viginti et pullos earum decem."
      en: "Thirty milch camels with their colts, forty kine, and twenty bulls, twenty she asses, and ten of their foals."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et misit per manus servorum suorum singulos seorsum greges, dixitque pueris suis: Antecedite me, et sit spatium inter gregem et gregem."
      en: "And he sent them by the hands of his servants, every drove by itself, and he said to his servants: Go before me, and let there be a space between drove and drove."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et praecepit priori, dicens: Si obvium habueris fratrem meum Esau, et interrogaverit te: Cujus es? aut, Quo vadis? aut, Cujus sunt ista quae sequeris?"
      en: "And he commanded the first, saying: If thou meet my brother Esau, and he ask thee: Whose art thou? or whither goest thou? or whose are these before thee?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "respondebis: Servi tui Jacob, munera misit domino meo Esau, ipse quoque post nos venit."
      en: "Thou shalt answer: Thy servant Jacob's: he hath sent them as a present to my lord Esau: and he cometh after us."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Similiter dedit mandata secundo, et tertio, et cunctis qui sequebantur greges, dicens: Iisdem verbis loquimini ad Esau cum inveneritis eum."
      en: "In like manner he commanded the second and the third, and all that followed the droves, saying: Speak ye the same words to Esau, when ye find him."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et addetis: Ipse quoque servus tuus Jacob iter nostrum insequitur. Dixit enim: Placabo illum muneribus quae praecedunt, et postea videbo illum: forsitan propitiabitur mihi."
      en: "And ye shall add: Thy servant Jacob himself also followeth after us: for he said: I will appease him with the presents that go before, and afterwards I will see him, perhaps he will be gracious to me."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Praecesserunt itaque munera ante eum, ipse vero mansit nocte illa in castris."
      en: "So the presents went before him, but himself lodged that night in the camp."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cumque mature surrexisset, tulit duas uxores suas, et totidem famulas cum undecim filiis, et transivit vadum Jaboc."
      en: "And rising early he took his two wives, and his two handmaids, with his eleven sons, and passed over the ford of Jaboc."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Traductisque omnibus quae ad se pertinebant,"
      en: "And when all things were brought over that belonged to him,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "mansit solus: et ecce vir luctabatur cum eo usque mane."
      en: "He remained alone: and behold a man wrestled with him till morning."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Qui cum videret quod eum superare non posset, tetigit nervum femoris ejus, et statim emarcuit."
      en: "And when he saw that he could not overcome him, he touched the sinew of his thigh, and forthwith it shrank."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dixitque ad eum: Dimitte me: jam enim ascendit aurora. Respondit: Non dimittam te, nisi benedixeris mihi."
      en: "And he said to him: Let me go, for it is break of day. He answered: I will not let thee go except thou bless me."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ait ergo: Quod nomen est tibi? Respondit: Jacob."
      en: "And he said: What is thy name? He answered: Jacob."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "At ille: Nequaquam, inquit, Jacob appellabitur nomen tuum, sed Israel: quoniam si contra Deum fortis fuisti, quanto magis contra homines praevalebis?"
      en: "But he said: Thy name shall not be called Jacob, but Israel: for if thou hast been strong against God, how much more shalt thou prevail against men?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Interrogavit eum Jacob: Dic mihi, quo appellaris nomine? Respondit: Cur quaeris nomen meum? Et benedixit ei in eodem loco."
      en: "Jacob asked him, Tell me by what name art thou called? He answered: Why dost thou ask my name? And he blessed him in the same place."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Vocavitque Jacob nomen loci illius Phanuel, dicens: Vidi Deum facie ad faciem, et salva facta est anima mea."
      en: "And Jacob called the name of the place Phanuel, saying: I have seen God face to face, and my soul has been saved."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ortusque est ei statim sol, postquam transgressus est Phanuel: ipse vero claudicabat pede."
      en: "And immediately the sun rose upon him, after he was past Phanuel; but he halted on his foot."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Quam ob causam non comedunt nervum filii Israel, qui emarcuit in femore Jacob, usque in praesentem diem: eo quod tetigerit nervum femoris ejus, et obstupuerit."
      en: "Therefore the children of Israel, unto this day, eat not the sinew, that shrank in Jacob's thigh: because he touched the sinew of his thigh and it shrank."
    status: { la: verified, en: verified }
