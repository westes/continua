# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 59
verses:
  - n: 1
    text:
      la: "Ecce non est abbreviata manus Domini, ut salvare nequeat; neque aggravata est auris ejus, ut non exaudiat."
      en: "Behold the hand of the Lord is not shortened that it cannot save, neither is his ear heavy that it cannot hear."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sed iniquitates vestrae diviserunt inter vos et Deum vestrum; et peccata vestra absconderunt faciem ejus a vobis, ne exaudiret."
      en: "But your iniquities have divided between you and your God, and your sins have hid his face from you that he should not hear."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Manus enim vestrae pollutae sunt sanguine, et digiti vestri iniquitate; labia vestra locuta sunt mendacium, et lingua vestra iniquitatem fatur."
      en: "For your hands are defiled with blood, and your fingers with iniquity: your lips have spoken lies, and your tongue uttereth iniquity."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Non est qui invocet justitiam, neque est qui judicet vere; sed confidunt in nihilo, et loquuntur vanitates; conceperunt laborem, et pepererunt iniquitatem."
      en: "There is none that calleth upon justice, neither is there any one that judgeth truly: but they trust in a mere nothing, and speak vanities: they have conceived labour, and brought forth iniquity."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ova aspidum ruperunt, et telas araneae texuerunt. Qui comederit de ovis eorum, morietur; et quod confotum est, erumpet in regulum."
      en: "They have broken the eggs of asps, and have woven the webs of spiders: he that shall eat of their eggs, shall die: and that which is brought out, shall be hatched into a basilisk."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Telae eorum non erunt in vestimentum, neque operientur operibus suis; opera eorum opera inutilia, et opus iniquitatis in manibus eorum."
      en: "Their webs shall not be for clothing, neither shall they cover themselves with their works: their works are unprofitable works, and the work of iniquity is in their hands."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Pedes eorum ad malum currunt, et festinant ut effundant sanguinem innocentem; cogitationes eorum cogitationes inutiles, vastitas et contritio in viis eorum."
      en: "Their feet run to evil, and make haste to shed innocent blood: their thoughts are unprofitable thoughts: wasting and destruction are in their ways."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Viam pacis nescierunt, et non est judicium in gressibus eorum; semitae eorum incurvatae sunt eis; omnis qui calcat in eis, ignorat pacem."
      en: "They have not known the way of peace, and there is no judgment in their steps: their paths are become crooked to them, every one that treadeth in them, knoweth no peace."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Propter hoc elongatum est judicium a nobis, et non apprehendet nos justitia. Exspectavimus lucem, et ecce tenebrae; splendorem, et in tenebris ambulavimus."
      en: "Therefore is judgment far from us, and justice shall not overtake us. We looked for light, and behold darkness: brightness, and we have walked in the dark."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Palpavimus sicut caeci parietem, et quasi absque oculis attrectavimus; impegimus meridie quasi in tenebris, in caliginosis quasi mortui."
      en: "We have groped for the wall, and like the blind we have groped as if we had no eyes: we have stumbled at noonday as in darkness, we are in dark places as dead men."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Rugiemus quasi ursi omnes, et quasi columbae meditantes gememus: exspectavimus judicium, et non est; salutem, et elongata est a nobis."
      en: "We shall roar all of us like bears, and shall lament as mournful doves. We have looked for judgment, and there is none: for salvation, and it is far from us."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Multiplicatae sunt enim iniquitates nostrae coram te, et peccata nostra responderunt nobis, quia scelera nostra nobiscum et iniquitates nostras cognovimus."
      en: "For our iniquities are multiplied before thee, and our sins have testified against us: for our wicked doings are with us, and we have known our iniquities:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Peccare et mentiri contra Dominum, et aversi sumus ne iremus post tergum Dei nostri, ut loqueremur calumniam et transgressionem; concepimus et locuti sumus de corde verba mendacii."
      en: "In sinning and lying against the Lord: and we have turned away so that we went not after our God, but spoke calumny and transgression: we have conceived, and uttered from the heart, words of falsehood."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et conversum est retrorsum judicium, et justitia longe stetit, quia corruit in platea veritas et aequitas non potuit ingredi."
      en: "And judgment is turned away backward, and justice hath stood far off: because truth hath fallen down in the street, and equity could not come in."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et facta est veritas in oblivionem; et qui recessit a malo, praedae patuit. Et vidit Dominus, et malum apparuit in oculis ejus, quia non est judicium."
      en: "And truth hath been forgotten: and he that departed from evil, lay open to be a prey: and the Lord saw, and it appeared evil in his eyes, because there is no judgment."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et vidit quia non est vir, et aporiatus est, quia non est qui occurrat; et salvavit sibi brachium suum, et justitia ejus ipsa confirmavit eum."
      en: "And he saw that there is not a man: and he stood astonished, because there is none to oppose himself: and his own arm brought salvation to him, and his own justice supported him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Indutus est justitia ut lorica, et galea salutis in capite ejus; indutus est vestimentis ultionis, et opertus est quasi pallio zeli,"
      en: "He put on justice as a breastplate, and a helmet of salvation upon his head: he put on the garments of vengeance, and was clad with zeal as with a cloak."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sicut ad vindictam quasi ad retributionem indignationis hostibus suis, et vicissitudinem inimicis suis; insulis vicem reddet."
      en: "As unto revenge, as it were to repay wrath to his adversaries, and a reward to his enemies: he will repay the like to the islands."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et timebunt qui ab occidente nomen Domini, et qui ab ortu solis gloriam ejus, cum venerit quasi fluvius violentus quem spiritus Domini cogit;"
      en: "And they from the west, shall fear the name of the Lord: and they from the rising of the sun, his glory: when he shall come as a violent stream, which the spirit of the Lord driveth on:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et venerit Sion redemptor, et eis qui redeunt ab iniquitate in Jacob, dicit Dominus."
      en: "And there shall come a redeemer to Sion, and to them that return from iniquity in Jacob, saith the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Hoc foedus meum cum eis, dicit Dominus: spiritus meus qui est in te, et verba mea quae posui in ore tuo, non recedent de ore tuo, et de ore seminis tui, et de ore seminis seminis tui, dicit Dominus, amodo et usque in sempiternum."
      en: "This is my covenant with them, saith the Lord: My spirit that is in thee, and my words that I have put in thy mouth, shall not depart out of thy mouth, nor out of the mouth of thy seed, nor out of the mouth of thy seed's seed, saith the Lord, from henceforth and for ever."
    status: { la: verified, en: verified }
