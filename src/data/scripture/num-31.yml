# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 31
verses:
  - n: 1
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ulciscere prius filios Israhel de Madianitis et sic colligeris ad populum tuum"
      en: "Revenge first the children of Israel on the Madianites, and so thou shalt be gathered to thy people."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "statimque Moses armate inquit ex vobis viros ad pugnam qui possint ultionem Domini expetere de Madianitis"
      en: "And Moses forthwith said: Arm of you men to fight, who may take the revenge of the Lord on the Madianites."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "mille viri de singulis tribubus eligantur Israhel qui mittantur ad bellum"
      en: "Let a thousand men be chosen out of every tribe of Israel to be sent to the war."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dederuntque millenos de cunctis tribubus id est duodecim milia expeditorum ad pugnam"
      en: "And they gave a thousand of every tribe, that is to say, twelve thousand men well appointed for battle."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quos misit Moses cum Finees filio Eleazari sacerdotis vasa quoque sancta et tubas ad clangendum tradidit ei"
      en: "And Moses sent them with Phinees the son of Eleazar the priest, and he delivered to him the holy vessels, and the trumpets to sound."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "cumque pugnassent contra Madianitas atque vicissent omnes mares occiderunt"
      en: "And when they had fought against the Madianites and had overcome them, they slew all the men."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et reges eorum Evi et Recem et Sur et Ur et Rebe quinque principes gentis Balaam quoque filium Beor interfecerunt gladio"
      en: "And their kings Evi, and Recem, and Sur, and Hur, and Rebe, five princes of the nation: Balaam also the son of Beer they killed with the sword."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ceperuntque mulieres eorum et parvulos omniaque pecora et cunctam supellectilem quicquid habere potuerant depopulati sunt"
      en: "And they took their women, and their children captives, and all their cattle, and all their goods: and all their possessions they plundered:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "tam urbes quam viculos et castella flamma consumpsit"
      en: "And all their cities, and their villages, and castles, they burned."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et tulerunt praedam et universa quae ceperant tam ex hominibus quam ex iumentis"
      en: "And they carried away the booty, and all that they had taken both of men and of beasts."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et adduxerunt ad Mosen et Eleazarum sacerdotem et ad omnem multitudinem filiorum Israhel reliqua etiam utensilia portaverunt ad castra in campestribus Moab iuxta Iordanem contra Hiericho"
      en: "And they brought them to Moses, and Eleazar the priest, and to all the multitude of the children of Israel. But the rest of the things for use they carried to the camp on the plains of Moab, beside the Jordan over against Jericho."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "egressi sunt autem Moses et Eleazar sacerdos et omnes principes synagogae in occursum eorum extra castra"
      en: "And Moses and Eleazar the priest and all the princes of the synagogue went forth to meet them without the camp."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "iratusque Moses principibus exercitus tribunis et centurionibus qui venerant de bello"
      en: "And Moses being angry with the chief officers of the army, the tribunes, and the centurions that were come from the battle,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ait cur feminas reservastis"
      en: "Said: Why have you saved the women?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nonne istae sunt quae deceperunt filios Israhel ad suggestionem Balaam et praevaricari vos fecerunt in Domino super peccato Phogor unde et percussus est populus"
      en: "Are not these they, that deceived the children of Israel by the counsel of Balaam, and made you transgress against the Lord by the sin of Phogor, for which also the people was punished?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ergo cunctos interficite quicquid est generis masculini etiam in parvulis et mulieres quae noverunt viros in coitu iugulate"
      en: "Therefore kill all that are of the male sex, even of the children: and put to death the women, that have carnally known men."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "puellas autem et omnes feminas virgines reservate vobis"
      en: "But the girls, and all the women that are virgins save for yourselves:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et manete extra castra septem diebus qui occiderit hominem vel occisum tetigerit lustrabitur die tertio et septimo"
      en: "And stay without the camp seven days. He that hath killed a man, or touched one that is killed, shall be purified the third day and the seventh day."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et de omni praeda sive vestimentum fuerit sive vas et aliquid in utensilia praeparatum de caprarum pellibus et pilis et ligno expiabitur"
      en: "And of all the spoil, every garment, or vessel, or any thing made for use, of the skins, or hair of goats, or of wood, shall be purified."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Eleazar quoque sacerdos ad viros exercitus qui pugnaverant sic locutus est hoc est praeceptum legis quod mandavit Dominus Mosi"
      en: "Eleazar also the priest spoke to the men of the army, that had fought, in this manner: This is the ordinance of the law, which the Lord hath commanded Moses:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "aurum et argentum et aes et ferrum et stagnum et plumbum"
      en: "Gold, and silver, and brass, and iron, and lend, and tin,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et omne quod potest transire per flammas igne purgabitur quicquid autem ignem non potest sustinere aqua expiationis sanctificabitur"
      en: "And all that may pass through the fire, shall be purified by fire, but whatsoever cannot abide the fire, shall be sanctified with the water of expiation:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et lavabitis vestimenta vestra die septimo et purificati postea castra intrabitis"
      en: "And you shall wash your garments the seventh day, and being purified, you shall afterwards enter into the camp."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixitque Dominus ad Mosen"
      en: "And the Lord said to Moses:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "tollite summam eorum quae capta sunt ab homine usque ad pecus tu et Eleazar sacerdos et principes vulgi"
      en: "Take the sum of the things that were taken both of man and beast, thou and Eleazar the priest and the princes of the multitude:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "dividesque ex aequo praedam inter eos qui pugnaverunt et egressi sunt ad bellum et inter omnem reliquam multitudinem"
      en: "And thou shalt divide the spoil equally, between them that fought and went out to the war, and between the rest of the multitude."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et separabis partem Domino ab his qui pugnaverunt et fuerunt in bello unam animam de quingentis tam ex hominibus quam ex bubus et asinis et ovibus"
      en: "And thou shalt separate a portion to the Lord from them that fought and were in the battle, one soul of five hundred as well of persons as of oxen and asses and sheep."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et dabis eam Eleazaro sacerdoti quia primitiae Domini sunt"
      en: "And thou shalt give it to Eleazar the priest, because they are the firstfruits of the Lord."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ex media quoque parte filiorum Israhel accipies quinquagesimum caput hominum et boum et asinorum et ovium cunctarumque animantium et dabis ea Levitis qui excubant in custodiis tabernaculi Domini"
      en: "Out of the moiety also of the children of Israel thou shalt take the fiftieth head of persons, and of oxen, and asses, and sheep, and of all beasts, and thou shalt give them to the Levites that watch in the charge of the tabernacle of the Lord."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "feceruntque Moses et Eleazar sicut praeceperat Dominus"
      en: "And Moses and Eleazar did as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "fuit autem praeda quam exercitus ceperat ovium sescenta septuaginta quinque milia"
      en: "And the spoil which the army had taken, was six hundred seventy-five thousand sheep,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "boum septuaginta duo milia"
      en: "Seventy-two thousand oxen,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "asinorum sexaginta milia et mille"
      en: "Sixty-one thousand asses:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "animae hominum sexus feminei quae non cognoverant viros triginta duo milia"
      en: "And thirty-two thousand persons of the female sex, that had not known men."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dataque est media pars his qui in proelio fuerant ovium trecenta triginta septem milia quingenta"
      en: "And one half was given to them that had been in the battle, to wit, three hundred thirty-seven thousand five hundred sheep:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "e quibus in partem Domini supputatae sunt oves sescentae septuaginta quinque"
      en: "Out of which, for the portion of the Lord, were reckoned six hundred seventy-five sheep."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et de bubus triginta sex milibus boves septuaginta duo"
      en: "And out of the thirty-six thousand oxen, seventy-two oxen:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "de asinis triginta milibus quingentis asini sexaginta unus"
      en: "Out of the thirty thousand five hundred asses, sixty-one asses:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "de animabus hominum sedecim milibus cesserunt in partem Domini triginta duae animae"
      en: "Out of the sixteen thousand persons, there fell to the portion of the Lord, thirty-two souls."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "tradiditque Moses numerum primitiarum Domini Eleazaro sacerdoti sicut ei fuerat imperatum"
      en: "And Moses delivered the number of the firstfruits of the Lord to Eleazar the priest, as had been commanded him,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "ex media parte filiorum Israhel quam separaverat his qui in proelio fuerant"
      en: "Out of the half of the children of Israel, which he had separated for them that had been in the battle."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "de media vero parte quae contigerat reliquae multitudini id est de ovium trecentis triginta septem milibus quingentis"
      en: "But out of the half that fell to the rest of the multitude, that is to say, out of the three hundred thirty-seven thousand five hundred sheep,"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et de bubus triginta sex milibus"
      en: "And out of the thirty-six thousand oxen,"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et de asinis triginta milibus quingentis"
      en: "And out of the thirty thousand five hundred asses,"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et de hominibus sedecim milibus"
      en: "And out of the sixteen thousand persons,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "tulit Moses quinquagesimum caput et dedit Levitis qui excubant in tabernaculo Domini sicut praeceperat Dominus"
      en: "Moses took the fiftieth head, and gave it to the Levites that watched in the tabernacle of the Lord, as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "cumque accessissent principes exercitus ad Mosen et tribuni centurionesque dixerunt"
      en: "And when the commanders of the army, and the tribunes and centurions were come to Moses, they said:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "nos servi tui recensuimus numerum pugnatorum quos habuimus sub manu nostra et ne unus quidem defuit"
      en: "We thy servants have reckoned up the number of the fighting men, whom we had under our hand, and not so much as one was wanting."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "ob hanc causam offerimus in donariis Domini singuli quod in praeda auri potuimus invenire periscelides et armillas anulos et dextralia ac murenulas ut depreceris pro nobis Dominum"
      en: "Therefore we offer as gifts to the Lord what gold every one of us could find in the booty, in garters and tablets, rings and bracelets, and chains, that thou mayst pray to the Lord for us."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "susceperuntque Moses et Eleazar sacerdos omne aurum in diversis speciebus"
      en: "And Moses and Eleazar the priest received all the gold in divers kinds,"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "pondo sedecim milia septingentos quinquaginta siclos a tribunis et centurionibus"
      en: "In weight sixteen thousand seven hundred and fifty sicles, from the tribunes and from the centurions."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "unusquisque enim quod in praeda rapuerat suum erat"
      en: "For that which every one had taken in the booty was his own."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "et susceptum intulerunt in tabernaculum testimonii in monumentum filiorum Israhel coram Domino"
      en: "And that which was received they brought into the tabernacle of the testimony, for a memorial of the children of Israel before the Lord."
    status: { la: verified, en: verified }
