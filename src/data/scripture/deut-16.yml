# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 16
verses:
  - n: 1
    text:
      la: "observa mensem novarum frugum et verni primum temporis ut facias phase Domino Deo tuo quoniam in isto mense eduxit te Dominus Deus tuus de Aegypto nocte"
      en: "Observe the month of new corn, which is the first of the spring, that thou mayst celebrate the phase to the Lord thy God: because in this month the Lord thy God brought thee out of Egypt by night."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "immolabisque phase Domino Deo tuo de ovibus et de bubus in loco quem elegerit Dominus Deus tuus ut habitet nomen eius ibi"
      en: "And thou shalt sacrifice the phase to the Lord thy God, of sheep, and of oxen, in the place which the Lord thy God shall choose, that his name may dwell there."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "non comedes in eo panem fermentatum septem diebus comedes absque fermento adflictionis panem quoniam in pavore egressus es de Aegypto ut memineris diei egressionis tuae de Aegypto omnibus diebus vitae tuae"
      en: "Thou shalt not eat with it leavened bread: seven days shalt thou eat without leaven, the bread of affliction, because thou camest out of Egypt in fear: that thou mayst remember the day of thy coming out of Egypt, all the days of thy life."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non apparebit fermentum in omnibus terminis tuis septem diebus et non manebit de carnibus eius quod immolatum est vesperi in die primo mane"
      en: "No leaven shall be seen in all thy coasts for seven days, neither shall any of the flesh of that which was sacrificed the first day in the evening remain until morning."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non poteris immolare phase in qualibet urbium tuarum quas Dominus Deus tuus daturus est tibi"
      en: "Thou mayst not immolate the phase in any one of thy cities, which the Lord thy God will give thee:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sed in loco quem elegerit Dominus Deus tuus ut habitet nomen eius ibi immolabis phase vesperi ad solis occasum quando egressus es de Aegypto"
      en: "But in the place which the Lord thy God shall choose, that his name may dwell there: thou shalt immolate the phase in the evening, at the going down of the sun, at which time thou camest out of Egypt."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et coques et comedes in loco quem elegerit Dominus Deus tuus maneque consurgens vades in tabernacula tua"
      en: "And thou shalt dress, and eat it in the place which the Lord thy God shall choose, and in the morning rising up thou shalt go into thy dwellings."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sex diebus comedes azyma et in die septimo quia collecta est Domini Dei tui non facies opus"
      en: "Six days shalt thou eat unleavened bread: and on the seventh day, because it is the assembly of the Lord thy God, thou shalt do no work."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "septem ebdomadas numerabis tibi ab ea die qua falcem in segetem miseris"
      en: "Thou shalt number unto thee seven weeks from that day, wherein thou didst put the sickle to the corn."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et celebrabis diem festum ebdomadarum Domino Deo tuo oblationem spontaneam manus tuae quam offeres iuxta benedictionem Domini Dei tui"
      en: "And thou shalt celebrate the festival of weeks to the Lord thy God, a voluntary oblation of thy hand, which thou shalt offer according to the blessing of the Lord thy God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et epulaberis coram Domino Deo tuo tu et filius tuus et filia tua et servus tuus et ancilla et Levites qui est intra portas tuas et advena ac pupillus et vidua qui morantur vobiscum in loco quem elegerit Dominus Deus tuus ut habitet nomen eius ibi"
      en: "And thou shalt feast before the Lord thy God, thou, and thy son, and thy daughter, and thy manservant, and thy maidservant, and the Levite that is within thy gates, and the stranger and the fatherless, and the widow, who abide with you: in the place which the Lord thy God shall choose, that his name may dwell there:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et recordaberis quoniam servus fueris in Aegypto custodiesque ac facies quae praecepta sunt"
      en: "And thou shalt remember that thou wast a servant in Egypt: and thou shalt keep and do the things that are commanded."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sollemnitatem quoque tabernaculorum celebrabis per septem dies quando collegeris de area et torculari fruges tuas"
      en: "Thou shalt celebrate the solemnity also of tabernacles seven days, when thou hast gathered in thy fruit of the barnfloor and of the winepress."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et epulaberis in festivitate tua tu et filius tuus et filia et servus tuus et ancilla Levites quoque et advena et pupillus ac vidua qui intra portas tuas sunt"
      en: "And thou shalt make merry in thy festival time, thou, thy son, and thy daughter, thy manservant, and thy maidservant, the Levite also and the stranger, and the fatherless and the widow that are within thy gates."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "septem diebus Domino Deo tuo festa celebrabis in loco quem elegerit Dominus benedicetque tibi Dominus Deus tuus in cunctis frugibus tuis et in omni opere manuum tuarum erisque in laetitia"
      en: "Seven days shalt thou celebrate feasts to the Lord thy God in the place which the Lord shall choose: and the Lord thy God will bless thee in all thy fruits, and in every work of thy hands, and thou shalt be in joy."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tribus vicibus per annum apparebit omne masculinum tuum in conspectu Domini Dei tui in loco quem elegerit in sollemnitate azymorum et in sollemnitate ebdomadarum et in sollemnitate tabernaculorum non apparebit ante Dominum vacuus"
      en: "Three times in a year shall all thy males appear before the Lord thy God in the place which he shall choose: in the feast of unleavened bread, in the feast of weeks, and in the feast of tabernacles. No one shall appear with his hands empty before the Lord:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed offeret unusquisque secundum quod habuerit iuxta benedictionem Domini Dei sui quam dederit ei"
      en: "But every one shall offer according to what he hath, according to the blessing of the Lord his God, which he shall give him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "iudices et magistros constitues in omnibus portis tuis quas Dominus Deus tuus dederit tibi per singulas tribus tuas ut iudicent populum iusto iudicio"
      en: "Thou shalt appoint judges and magistrates in all thy gates, which the Lord thy God shall give thee, in all thy tribes: that they may judge the people with just judgment,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nec in alteram partem declinent non accipies personam nec munera quia munera excaecant oculos sapientium et mutant verba iustorum"
      en: "And not go aside to either part. Thou shalt not accept person nor gifts: for gifts blind the eyes of the wise, and change the words of the just."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "iuste quod iustum est persequeris ut vivas et possideas terram quam Dominus Deus tuus dederit tibi"
      en: "Thou shalt follow justly after that which is just: that thou mayst live and possess the land, which the Lord thy God shall give thee."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non plantabis lucum et omnem arborem iuxta altare Domini Dei tui"
      en: "Thou shalt plant no grove, nor any tree near the altar of the Lord thy God:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "nec facies tibi atque constitues statuam quae odit Dominus Deus tuus"
      en: "Neither shalt thou make nor set up to thyself a statue: which things the Lord thy God hateth."
    status: { la: verified, en: verified }
