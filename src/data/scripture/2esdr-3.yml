# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2esdr
chapter: 3
verses:
  - n: 1
    text:
      la: "et surrexit Eliasib sacerdos magnus et fratres eius sacerdotes et aedificaverunt portam Gregis ipsi sanctificaverunt eam et statuerunt valvas eius et usque ad turrem centum cubitorum sanctificaverunt eam usque ad turrem Ananehel"
      en: "Then Eliasib the high priest arose, and his brethren the priests, and they built the flock gate: they sanctified it, and set up the doors thereof, even unto the tower of a hundred cubits they sanctified it unto the tower of Hananeel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et iuxta eum aedificaverunt viri Hiericho et iuxta eum aedificavit Zecchur filius Amri"
      en: "And next to him the men of Jericho built: and next to them built Zachur the son of Amri."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "portam autem Piscium aedificaverunt filii Asanaa ipsi texerunt eam et statuerunt valvas eius et seras et vectes et iuxta eos aedificavit Marimuth filius Uriae filii Accus"
      en: "But the fish gate the sons of Asnaa built: they covered it, and set up the doors thereof, and tire locks, and the bars. And next to them built Marimuth the son of Urias the son of Accus."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et iuxta eos aedificavit Mosollam filius Barachiae filii Mesezebel et iuxta eos aedificavit Sadoc filius Baana"
      en: "And next to him built Mosollam tile son of Barachias, the sell of Merezebel, and next to them built Sadoc the son of Baana."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et iuxta eos aedificaverunt Thecueni optimates autem eorum non subposuerunt colla sua in opere Domini sui"
      en: "And next to them the Thecuites built: but their great men did not put their necks to the work of their Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et portam Veterem aedificaverunt Ioiada filius Fasea et Mosollam filius Besodia ipsi texerunt eam et statuerunt valvas eius et seras et vectes"
      en: "And Joiada the son of Phasea, and Mosollam the son of Besodia built the old gate: they covered it and set up the doors thereof, and the locks, and the bars."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et iuxta eos aedificavit Meletias Gabaonites et Iadon Meronathites viri de Gabaon et Maspha pro duce qui erat in regione trans Flumen"
      en: "And next to them built Meltias the Gabaonite, and Jadon the Meronathite, the men of Gabaon and Maspha, for the governor that was in the country beyond the river."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et iuxta eum aedificavit Ezihel filius Araia aurifex et iuxta eum aedificavit Anania filius pigmentarii et dimiserunt Hierusalem usque ad murum plateae latioris"
      en: "And next to him built Eziel the son of Araia the goldsmith: and next to him built Ananias the son of the perfumer: and they left Jerusalem unto the wall of the broad street."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et iuxta eum aedificavit Rafaia filius Ahur princeps vici Hierusalem"
      en: "And next to him built Raphaia the son of Hur, lord of the street of Jerusalem."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et iuxta eos aedificavit Ieiada filius Aromath contra domum suam et iuxta eum aedificavit Attus filius Asebeniae"
      en: "And next to him Jedaia the son of Haromaph over against his own house: and next to him built Hattus the son of Hasebonia."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "mediam partem vici aedificavit Melchias filius Erem et Asub filius Phaethmoab et turrem Furnorum"
      en: "Melchias the son of Herem, and Hasub the son of Phahath Moab, built half the street, and the tower of the furnaces."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "iuxta eum aedificavit Sellum filius Alloes princeps mediae partis vici Hierusalem ipse et filiae eius"
      en: "And next to him built Sellum the son of Alohes, lord of half the street of Jerusalem, he and his daughters."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et portam Vallis aedificavit Anun et habitatores Zanoe ipsi aedificaverunt eam et statuerunt valvas eius et seras et vectes et mille cubitos in muro usque ad portam Sterquilinii"
      en: "And the gate of the valley Hanun built, and the inhabitants of Zanoe: they built it, and set up the doors thereof, and the locks, and the bars, and a thousand cubits in the wall unto the gate of the dunghill."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et portam Sterquilinii aedificavit Melchias filius Rechab princeps vici Bethaccharem ipse aedificavit eam et statuit valvas eius et seras et vectes"
      en: "And the gate of the dunghill Melchias the son of Rechab built, lord of the street of Bethacharam : he built it, and set up the doors thereof, and the locks, and the bars."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et portam Fontis aedificavit Sellum filius Choloozai princeps pagi Maspha ipse aedificavit eam et texit et statuit valvas eius et seras et vectes et muros piscinae Siloae in hortum regis et usque ad gradus qui descendunt de civitate David"
      en: "And the gate of the fountain Sellum the son of Cholhoza built, lord of the street of Maspha: he built it, and covered it, and set up the doors thereof, and the locks, and the bare, and the walls of the pool of Siloe unto the king's guard, and unto the steps that go down from the city of David."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "post eum aedificavit Neemias filius Azboc princeps dimidiae partis vici Bethsur usque contra sepulchra David et usque ad piscinam quae grandi opere constructa est et usque ad domum Fortium"
      en: "After him built Nehemias the son of Azboc, lord of half the street of Bethsur, as far as over against the sepulchre of David, and to the pool, that was built with great labour, and to the house of the mighty."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "post eum aedificaverunt Levitae Reum filius Benni post eum aedificavit Asebias princeps dimidiae partis vici Ceilae in vico suo"
      en: "After him built the Levites, Rehum the son of Benni. After him built Hasebias, lord of half the street of Ceila in his own street."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "post eum aedificaverunt fratres eorum Behui filius Enadad princeps dimidiae partis Ceila"
      en: "After him built their brethren Bavai the son of Enadad, lord of half Ceila."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et aedificavit iuxta eum Azer filius Iosue princeps Maspha mensuram secundam contra ascensum firmissimi anguli"
      en: "And next to him Aser the son of Josue, lord of Maspha, built another measure, over against the going up of the strong corner."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "post eum in monte aedificavit Baruch filius Zacchai mensuram secundam ab angulo usque ad portam domus Eliasib sacerdotis magni"
      en: "After him in the mount Baruch the son of Zachai built another measure, from the corner to the door of the house of Eliasib the high priest."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "post eum aedificavit Meremuth filius Uriae filii Accus mensuram secundam a porta domus Eliasib donec extenderetur domus Eliasib"
      en: "After him Merimuth the son of Urias the son of Haccus, built another measure, from the door of the house of Eliasib, to the end of the house of Eliasib."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et post eum aedificaverunt sacerdotes viri de campestribus Iordanis"
      en: "And after him built the priests, the men of the plains of the Jordan."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "post eum aedificavit Beniamin et Asub contra domum suam et post eum aedificavit Azarias filius Maasiae filii Ananiae contra domum suam"
      en: "After him built Benjamin and Hasub, over against their own house : and after him built Azarias the son of Maasias the son of Ananias over against his house."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "post eum aedificavit Bennui filius Enadda mensuram secundam a domo Azariae usque ad flexuram et usque ad angulum"
      en: "After him built Bennui the son of Hanadad another measure, from the house of Azarias unto the bending, and unto the corner."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Falel filius Ozi contra flexuram et turrem quae eminet de domo regis excelsa id est in atrio carceris post eum Phadaia filius Pheros"
      en: "Phalel, the son of Ozi, over against the bending and the tower, which lieth out from the king's high house, that is, in the court of the prison: after him Phadaia the son of Pharos."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Nathinnei autem habitabant in Ofel usque contra portam Aquarum ad orientem et turrem quae prominebat"
      en: "And the Nathinites dwelt in Ophel, as far as over against the water gate toward the east, and the tower that stood out."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "post eum aedificaverunt Thecueni mensuram secundam e regione a turre magna et eminenti usque ad murum templi"
      en: "After him the Thecuites built another measure over against, from the great tower that standeth out unto the wall of the temple."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sursum autem a porta Equorum aedificaverunt sacerdotes unusquisque contra domum suam"
      en: "And upward from the horse gate the priests built, every man over against his house."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "post eos aedificavit Seddo filius Emmer contra domum suam et post eum aedificavit Semeia filius Secheniae custos portae orientalis"
      en: "After them built Sadoc the son of Emmer over against his house. And after him built Semaia the son of Sechenias, keeper of the east gate."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "post eum aedificavit Anania filius Selemiae et Anon filius Selo sextus mensuram secundam post eum aedificavit Mosollam filius Barachiae contra gazofilacium suum post eum aedificavit Melchias filius aurificis usque ad domum Nathinneorum et scruta vendentium contra portam Iudicialem et usque ad cenaculum Anguli"
      en: "After him built Hanania the son of Selemia, and Hanun the sixth son of Seleph, another measure: after him built Mosollam the son of Barachias over against his treasury. After him Melcias the goldsmith's son built unto the house of the Nathinites, and of the sellers of small wares, over against the judgment gate, and unto the chamber of the corner."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et inter cenaculum Anguli in porta Gregis aedificaverunt artifices et negotiatores"
      en: "And within the chamber of the corner of the dock gate, the goldsmiths and the merchants built."
    status: { la: verified, en: verified }
