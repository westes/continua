# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 23
verses:
  - n: 1
    text:
      la: "non suscipies vocem mendacii nec iunges manum tuam ut pro impio dicas falsum testimonium"
      en: "Thou shalt not receive the voice of a lie: neither shalt thou join thy hand to bear false witness for a wicked person."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "non sequeris turbam ad faciendum malum nec in iudicio plurimorum adquiesces sententiae ut a vero devies"
      en: "Thou shalt not follow the multitude to do evil: neither shalt thou yield in judgment, to the opinion of the most part, to stray from the truth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "pauperis quoque non misereberis in negotio"
      en: "Neither shalt thou favour a poor man in judgment."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si occurreris bovi inimici tui aut asino erranti reduc ad eum"
      en: "If thou meet thy enemy's ox or ass going astray, bring it back to him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si videris asinum odientis te iacere sub onere non pertransibis sed sublevabis cum eo"
      en: "If thou see the ass of him that hateth thee lie underneath his burden, thou shalt not pass by, but shalt lift him up with him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non declinabis in iudicio pauperis"
      en: "Thou shalt not go aside in the poor man's judgment."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "mendacium fugies insontem et iustum non occides quia aversor impium"
      en: "Thou shalt fly lying. The innocent and just person thou shalt not put to death: because I abhor the wicked."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nec accipias munera quae excaecant etiam prudentes et subvertunt verba iustorum"
      en: "Neither shalt thou take bribes, which even blind the wise, and pervert the words of the just."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "peregrino molestus non eris scitis enim advenarum animas quia et ipsi peregrini fuistis in terra Aegypti"
      en: "Thou shalt not molest a stranger, for you know the hearts of strangers: for you also were strangers in the land of Egypt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sex annis seminabis terram tuam et congregabis fruges eius"
      en: "Six years thou shalt sow thy ground, and shalt gather the corn thereof."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "anno autem septimo dimittes eam et requiescere facies ut comedant pauperes populi tui et quicquid reliqui fuerit edant bestiae agri ita facies in vinea et in oliveto tuo"
      en: "But the seventh year thou shalt let it alone, and suffer it to rest, that the poor of thy people may eat, and whatsoever shall be left, let the beasts of the field eat it: so shalt thou do with thy vineyard and thy oliveyard."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sex diebus operaberis septima die cessabis ut requiescat bos et asinus tuus et refrigeretur filius ancillae tuae et advena"
      en: "Six days thou shalt work: the seventh day thou shalt cease, that thy ox and thy ass may rest: and the son of thy handmaid and the stranger may be refreshed."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "omnia quae dixi vobis custodite et per nomen externorum deorum non iurabitis neque audietur ex ore vestro"
      en: "Keep all things that I have said to you. And by the name of strange gods you shall not swear, neither shall it be heard out of your mouth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tribus vicibus per singulos annos mihi festa celebrabitis"
      en: "Three times every year you shall celebrate feasts to me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sollemnitatem azymorum custodies septem diebus comedes azyma sicut praecepi tibi tempore mensis novorum quando egressus es de Aegypto non apparebis in conspectu meo vacuus"
      en: "Thou shalt keep the feast of unleavened bread. Seven days shalt thou eat unleavened bread, as I commanded thee, in the time of the month of new corn, when thou didst come forth out of Egypt: thou shalt not appear empty before me."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et sollemnitatem messis primitivorum operis tui quaecumque serueris in agro sollemnitatem quoque in exitu anni quando congregaveris omnes fruges tuas de agro"
      en: "And the feast of the harvest of the firstfruits of thy work, whatsoever thou hast sown in the field. The feast also in the end of the year, when thou hast gathered in all thy corn out of the field."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ter in anno apparebit omne masculinum tuum coram Domino Deo"
      en: "Thrice a year shall all thy males appear before the Lord thy God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non immolabis super fermento sanguinem victimae meae nec remanebit adeps sollemnitatis meae usque mane"
      en: "Thou shalt not sacrifice the blood of my victim upon leaven, neither shall the fat of my solemnity remain until the morning."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "primitias frugum terrae tuae deferes in domum Domini Dei tui nec coques hedum in lacte matris suae"
      en: "Thou shalt carry the firstfruits of the corn of thy ground to the house of the Lord thy God. Thou shalt not boil a kid in the milk of his dam."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ecce ego mittam angelum meum qui praecedat te et custodiat in via et introducat ad locum quem paravi"
      en: "Behold I will send my angel, who shall go before thee, and keep thee in thy journey, and bring thee into the place that I have prepared."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "observa eum et audi vocem eius nec contemnendum putes quia non dimittet cum peccaveritis et est nomen meum in illo"
      en: "Take notice of him, and hear his voice, and do not think him one to be contemned: for he will not forgive when thou hast sinned, and my name is in him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "quod si audieris vocem eius et feceris omnia quae loquor inimicus ero inimicis tuis et adfligam adfligentes te"
      en: "But if thou wilt hear his voice, and do all that I speak, I will be an enemy to thy enemies, and will afflict them that afflict thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "praecedetque te angelus meus et introducet te ad Amorreum et Hettheum et Ferezeum Chananeumque et Eveum et Iebuseum quos ego contribo"
      en: "And my angel shall go before thee, and shall bring thee in unto the Amorrhite, and the Hethite, and the Pherezite, and the Chanaanite, and the Hevite, and the Jebusite, whom I will destroy."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "non adorabis deos eorum nec coles eos non facies opera eorum sed destrues eos et confringes statuas eorum"
      en: "Thou shalt not adore their gods, nor serve them. Thou shalt not do their works, but shalt destroy them, and break their statues."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "servietisque Domino Deo vestro ut benedicam panibus tuis et aquis et auferam infirmitatem de medio tui"
      en: "And you shall serve the Lord your God, that I may bless your bread and your waters, and may take away sickness from the midst of thee."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "non erit infecunda nec sterilis in terra tua numerum dierum tuorum implebo"
      en: "There shall not be one fruitless nor barren in thy land: I will fill the number of thy days."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "terrorem meum mittam in praecursum tuum et occidam omnem populum ad quem ingredieris cunctorumque inimicorum tuorum coram te terga vertam"
      en: "I will send my fear before thee, and will destroy all the people to whom thou shalt come: and will turn the backs of all thy enemies before thee."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "emittens crabrones prius qui fugabunt Eveum et Chananeum et Hettheum antequam introeas"
      en: "Sending out hornets before, that shall drive away the Hevite, and the Chanaanite, and the Hethite, before thou come in."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "non eiciam eos a facie tua anno uno ne terra in solitudinem redigatur et crescant contra te bestiae"
      en: "I will not cast them out from thy face in one year: lest the land be brought into a wilderness, and the beasts multiply against thee."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "paulatim expellam eos de conspectu tuo donec augearis et possideas terram"
      en: "By little and little I will drive them out from before thee, till thou be increased, and dost possess the land."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ponam autem terminos tuos a mari Rubro usque ad mare Palestinorum et a deserto usque ad Fluvium tradam manibus vestris habitatores terrae et eiciam eos de conspectu vestro"
      en: "And I will set thy bounds from the Red Sea to the sea of the Palestines, and from the desert to the river: I will deliver the inhabitants of the land into your hands, and will drive them out from before you."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "non inibis cum eis foedus nec cum diis eorum"
      en: "Thou shalt not enter into league with them, nor with their gods."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "non habitent in terra tua ne forte peccare te faciant in me si servieris diis eorum quod tibi certo erit in scandalum"
      en: "Let them not dwell in thy land, lest perhaps thy make thee sin against me, if thou serve their god: which undoubtedly will be a scandal to thee."
    status: { la: verified, en: verified }
