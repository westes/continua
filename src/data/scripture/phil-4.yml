# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: phil
chapter: 4
verses:
  - n: 1
    text:
      la: "Itaque fratres mei carissimi, et desideratissimi, gaudium meum, et corona mea: sic state in Domino, carissimi."
      en: "Therefore, my dearly beloved brethren, and most desired, my joy and my crown; so stand fast in the Lord, my dearly beloved."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Evodiam rogo, et Syntychen deprecor, idipsum sapere in Domino."
      en: "I beg of Evodia, and I beseech Syntyche, to be of one mind in the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Etiam rogo et te, germane compar, adjuva illas, quae mecum laboraverunt in Evangelio cum Clemente, et ceteris adjutoribus meis, quorum nomina sunt in libro vitae."
      en: "And I entreat thee also, my sincere companion, help those women who have laboured with me in the gospel, with Clement and the rest of my fellow labourers, whose names are in the book of life."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Gaudete in Domino semper: iterum dico gaudete."
      en: "Rejoice in the Lord always; again, I say, rejoice."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Modestia vestra nota sit omnibus hominibus: Dominus prope est."
      en: "Let your modesty be known to all men. The Lord is nigh."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nihil solliciti sitis: sed in omni oratione, et obsecratione, cum gratiarum actione petitiones vestrae innotescant apud Deum."
      en: "Be nothing solicitous; but in every thing, by prayer and supplication, with thanksgiving, let your petitions be made known to God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et pax Dei, quae exuperat omnem sensum, custodiat corda vestra, et intelligentias vestras in Christo Jesu."
      en: "And the peace of God, which surpasseth all understanding, keep your hearts and minds in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "De cetero fratres, quaecumque sunt vera, quaecumque pudica, quaecumque justa, quaecumque sancta, quaecumque amabilia, quaecumque bonae famae, siqua virtus, siqua laus disciplinae, haec cogitate."
      en: "For the rest, brethren, whatsoever things are true, whatsoever modest, whatsoever just, whatsoever holy, whatsoever lovely, whatsoever of good fame, if there be any virtue, if any praise of discipline, think on these things."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quae et didicistis, et accepistis, et audistis, et vidistis in me, haec agite: et Deus pacis erit vobiscum."
      en: "The things which you have both learned, and received, and heard, and seen in me, these do ye, and the God of peace shall be with you."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Gavisus sum autem in Domino vehementer, quoniam tandem aliquando refloruistis pro me sentire, sicut et sentiebatis: occupati autem eratis."
      en: "Now I rejoice in the Lord exceedingly, that now at length your thought for me hath flourished again, as you did also think; but you were busied."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Non quasi propter penuriam dico: ego enim didici, in quibus sum, sufficiens esse."
      en: "I speak not as it were for want. For I have learned, in whatsoever state I am, to be content therewith."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Scio et humiliari, scio et abundare ( ubique et in omnibus institutus sum): et satiari, et esurire, et abundare, et penuriam pati."
      en: "I know both how to be brought low, and I know how to abound: (everywhere, and in all things I am instructed) both to be full, and to be hungry; both to abound, and to suffer need."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Omnia possum in eo qui me confortat."
      en: "I can do all these things in him who strengtheneth me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Verumtamen bene fecistis, communicantes tribulationi meae."
      en: "Nevertheless you have done well in communicating to my tribulation."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Scitis autem et vos Philippenses, quod in principio Evangelii, quando profectus sum a Macedonia, nulla mihi ecclesia communicavit in ratione dati et accepti, nisi vos soli:"
      en: "And you also know, O Philippians, that in the beginning of the gospel, when I departed from Macedonia, no church communicated with me as concerning giving and receiving, but you only:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quia et Thessalonicam semel et bis in usum mihi misistis."
      en: "For unto Thessalonica also you sent once and again for my use."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non quia quaero datum, sed requiro fructum abundantem in ratione vestra."
      en: "Not that I seek the gift, but I seek the fruit that may abound to your account."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Habeo autem omnia, et abundo: repletus sum, acceptis ab Epaphrodito quae misistis odorem suavitatis, hostiam acceptam, placentem Deo."
      en: "But I have all, and abound: I am filled, having received from Epaphroditus the things you sent, an odour of sweetness, an acceptable sacrifice, pleasing to God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Deus autem meus impleat omne desiderium vestrum secundum divitias suas in gloria in Christo Jesu."
      en: "And may my God supply all your want, according to his riches in glory in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Deo autem et Patri nostro gloria in saecula saeculorum. Amen."
      en: "Now to God and our Father be glory world without end. Amen."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Salutate omnem sanctum in Christo Jesu."
      en: "Salute ye every saint in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Salutant vos, qui mecum sunt, fratres. Salutant vos omnes sancti, maxime autem qui de Caesaris domo sunt."
      en: "The brethren who are with me, salute you. All the saints salute you; especially they that are of Caesar's household."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Gratia Domini nostri Jesu Christi cum spiritu vestro. Amen."
      en: "The grace of our Lord Jesus Christ be with your spirit. Amen."
    status: { la: verified, en: verified }
