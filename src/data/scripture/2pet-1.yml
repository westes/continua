# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2pet
chapter: 1
verses:
  - n: 1
    text:
      la: "Simon Petrus, servus et apostolus Jesu Christi, iis qui coaequalem nobiscum sortiti sunt fidem in justitia Dei nostri, et Salvatoris Jesu Christi."
      en: "Simon Peter, servant and apostle of Jesus Christ, to them that have obtained equal faith with us in the justice of our God and Saviour Jesus Christ."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Gratia vobis, et pax adimpleatur in cognitione Dei, et Christi Jesu Domini nostri:"
      en: "Grace to you and peace be accomplished in the knowledge of God and of Christ Jesus our Lord:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quomodo omnia nobis divinae virtutis suae, quae ad vitam et pietatem donata sunt, per cognitionem ejus, qui vocavit nos propria gloria, et virtute,"
      en: "As all things of his divine power which appertain to life and godliness, are given us, through the knowledge of him who hath called us by his own proper glory and virtue."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "per quem maxima, et pretiosa nobis promissa donavit: ut per haec efficiamini divinae consortes naturae: fugientes ejus, quae in mundo est, concupiscentiae corruptionem."
      en: "By whom he hath given us most great and precious promises: that by these you may be made partakers of the divine nature: flying the corruption of that concupiscence which is in the world."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Vos autem curam omnem subinferentes, ministrate in fide vestra virtutem, in virtute autem scientiam,"
      en: "And you, employing all care, minister in your faith, virtue; and in virtue, knowledge;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in scientia autem abstinentiam, in abstinentia autem patientiam, in patientia autem pietatem,"
      en: "And in knowledge, abstinence; and in abstinence, patience; and in patience, godliness;"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in pietate autem amorem fraternitatis, in amore autem fraternitatis caritatem."
      en: "And in godliness, love of brotherhood; and in love of brotherhood, charity."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Haec enim si vobiscum adsint, et superent, non vacuos nec sine fructu vos constituent in Domini nostri Jesu Christi cognitione."
      en: "For if these things be with you and abound, they will make you to be neither empty nor unfruitful in the knowledge of our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cui enim non praesto sunt haec, caecus est, et manu tentans, oblivionem accipiens purgationis veterum suorum delictorum."
      en: "For he that hath not these things with him, is blind, and groping, having forgotten that he was purged from his old sins."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quapropter fratres, magis satagite ut per bona opera certam vestram vocationem, et electionem faciatis: haec enim facientes, non peccabitis aliquando."
      en: "Wherefore, brethren, labour the more, that by good works you may make sure your calling and election. For doing these things, you shall not sin at any time."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sic enim abundanter ministrabitur vobis introitus in aeternum regnum Domini nostri et Salvatoris Jesu Christi."
      en: "For so an entrance shall be ministered to you abundantly into the everlasting kingdom of our Lord and Saviour Jesus Christ."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Propter quod incipiam vos semper commonere de his: et quidem scientes et confirmatos vos in praesenti veritate."
      en: "For which cause I will begin to put you always in remembrance of these things: though indeed you know them, and are confirmed in the present truth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Justum autem arbitror quamdiu sum in hoc tabernaculo, suscitare vos in commonitione:"
      en: "But I think it meet as long as I am in this tabernacle, to stir you up by putting you in remembrance."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "certus quod velox est depositio tabernaculi mei secundum quod et Dominus noster Jesus Christus significavit mihi."
      en: "Being assured that the laying away of this my tabernacle is at hand, according as our Lord Jesus Christ also hath signified to me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dabo autem operam et frequenter habere vos post obitum meum, ut horum memoriam faciatis."
      en: "And I will endeavour, that you frequently have after my decease, whereby you may keep a memory of these things."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non enim doctas fabulas secuto notam fecimus vobis Domini nostri Jesu Christi virtutem et praesentiam: sed speculatores facti illius magnitudinis."
      en: "For we have not by following artificial fables, made known to you the power, and presence of our Lord Jesus Christ; but we were eyewitnesses of his greatness."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Accipiens enim a Deo Patre honorem et gloriam, voce delapsa ad eum hujuscemodi a magnifica gloria: Hic est Filius meus dilectus, in quo mihi complacui, ipsum audite."
      en: "For he received from God the Father, honour and glory: this voice coming down to him from the excellent glory: This is my beloved Son, in whom I am well pleased; hear ye him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et hanc vocem nos audivimus de caelo allatam, cum essemus cum ipso in monte sancto."
      en: "And this voice we heard brought from heaven, when we were with him in the holy mount."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et habemus firmiorem propheticum sermonem: cui benefacitis attendentes quasi lucernae lucenti in caliginoso donec dies elucescat, et lucifer oriatur in cordibus vestris:"
      en: "And we have the more firm prophetical word: whereunto you do well to attend, as to a light that shineth in a dark place, until the day dawn, and the day star arise in your hearts:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "hoc primum intelligentes quod omnis prophetia Scripturae propria interpretatione non fit."
      en: "Understanding this first, that no prophecy of scripture is made by private interpretation."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Non enim voluntate humana allata est aliquando prophetia: sed Spiritu Sancto inspirati, locuti sunt sancti Dei homines."
      en: "For prophecy came not by the will of man at any time: but the holy men of God spoke, inspired by the Holy Ghost."
    status: { la: verified, en: verified }
