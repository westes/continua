# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 18
verses:
  - n: 1
    text:
      la: "Congregatique sunt omnes filii Israel in Silo, ibique fixerunt tabernaculum testimonii, et fuit eis terra subjecta."
      en: "And all the children of Israel assembled together in Silo, and there they set up the tabernacle of the testimony, and the land was subdued before them."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Remanserant autem filiorum Israel septem tribus, quae necdum acceperant possessiones suas."
      en: "But there remained seven tribes of the children of Israel, which as yet had not received their possessions."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ad quos Josue ait: Usquequo marcetis ignavia, et non intratis ad possidendam terram, quam Dominus Deus patrum vestrorum dedit vobis?"
      en: "And Josue said to them: How long are you indolent and slack, and go not in to possess the land which the Lord the God of your fathers hath given you?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Eligite de singulis tribubus ternos viros, ut mittam eos, et pergant atque circumeant terram, et describant eam juxta numerum uniuscujusque multitudinis: referantque ad me quod descripserint."
      en: "Choose of every tribe three men, that I may send them, and they may go and compass the land, and mark it out according to the number of each multitude: and bring back to me what they have marked out."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dividite vobis terram in septem partes: Judas sit in terminis suis ab australi plaga, et domus Joseph ab aquilone."
      en: "Divide to yourselves the land into seven parts: let Juda be in his bounds on the south side, and the house of Joseph on the north."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Mediam inter hos terram in septem partes describite: et huc venietis ad me, ut coram Domino Deo vestro mittam vobis hic sortem:"
      en: "The land in the midst between these mark ye out into seven parts; and you shall come hither to me, that I may cast lots for you before the Lord your God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia non est inter vos pars Levitarum, sed sacerdotium Domini est eorum haereditas. Gad autem et Ruben, et dimidia tribus Manasse, jam acceperant possessiones suas trans Jordanem ad orientalem plagam: quas dedit eis Moyses famulus Domini."
      en: "For the Levites have no part among you, but the priesthood of the Lord is their inheritance. And Gad and Ruben, and the half tribe of Manasses have already received their possessions beyond the Jordan eastward: which Moses the servant of the Lord gave them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque surrexissent viri, ut pergerent ad describendam terram, praecepit eis Josue, dicens: Circuite terram, et describite eam, ac revertimini ad me: ut hic coram Domino, in Silo, mittam vobis sortem."
      en: "And when the men were risen up, to go to mark out the land, Josue commanded them, saying: Go round the land and mark it out, and return to me: that I may cast lots for you before the Lord in Silo."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Itaque perrexerunt: et lustrantes eam, in septem partes diviserunt, scribentes in volumine. Reversique sunt ad Josue in castra Silo."
      en: "So they went: and surveying it divided it into seven parts, writing them down in a book. And they returned to Josue, to the camp in Silo."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qui misit sortes coram Domino in Silo, divisitque terram filiis Israel in septem partes."
      en: "And he cast lots before the Lord in Silo, and divided the land to the children of Israel into seven parts."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et ascendit sors prima filiorum Benjamin per familias suas, ut possiderent terram inter filios Juda et filios Joseph."
      en: "And first came up the lot of the children of Benjamin by their families, to possess the land between the children of Juda, and the children of Joseph."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Fuitque terminus eorum contra aquilonem a Jordane: pergens juxta latus Jericho septentrionalis plagae, et inde contra occidentem ad montana conscendens et perveniens ad solitudinem Bethaven,"
      en: "And their border northward was from the Jordan: going along by the side of Jericho on the north side, and thence going up westward to the mountains, and reaching to the wilderness of Bethaven,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "atque pertransiens juxta Luzam ad meridiem, ipsa est Bethel: descenditque in Ataroth Addar in montem qui est ad meridiem Beth-horon inferioris:"
      en: "And passing along southward by Luza, the same is Bethel: and it goeth down into Ataroth-addar to the mountain, that is on the south of the nether Beth-horon."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et inclinatur circuiens contra mare ad meridiem montis qui respicit Beth-horon contra Africum: suntque exitus ejus in Cariath-baal, quae vocatur et Cariathiarim, urbem filiorum Juda. Haec est plaga contra mare, ad occidentem."
      en: "And it bendeth thence going round towards the sea, south of the mountain that looketh towards Beth-horon to the southwest: and the outgoings thereof are into Cariathbaal, which is called also Cariathiarim, a city of the children of Juda. This is their coast towards the sea, westward."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "A meridie autem ex parte Cariathiarim egreditur terminus contra mare, et pervenit usque ad fontem aquarum Nephtoa."
      en: "But on the south side the border goeth out from part of Cariathiarim towards the sea, and cometh to the fountain of the waters of Nephtoa."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Descenditque in partem montis, qui respicit vallem filiorum Ennom: et est contra septentrionalem plagam in extrema parte vallis Raphaim. Descenditque in Geennom ( id est, vallem Ennom) juxta latus Jebusaei ad austrum: et pervenit ad fontem Rogel,"
      en: "And it goeth down to that part of the mountain that looketh on the valley of the children of Ennom: and is over against the north quarter in the furthermost part of the valley of Raphaim, and it goeth down into Geennom (that is the valley of Ennom) by the side of the Jebusite to the south: and cometh to the fountain of Rogel,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "transiens ad aquilonem, et egrediens ad Ensemes, id est, fontem solis:"
      en: "Passing thence to the north, and going out to Ensemes, that is to say, the fountain of the sue:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et pertransit usque ad tumulos, qui sunt e regione ascensus Adommim: descenditque ad Abenboen, id est, lapidem Boen filii Ruben: et pertransit ex latere aquilonis ad campestria: descenditque in planitiem,"
      en: "And it passeth along to the hills that are over against the ascent of Adommim: and it goeth down to Abenboen, that is, the stone of Boen the son of Ruben: and it passeth on the north side to the champaign countries; and goeth down into the plain,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et praetergreditur contra aquilonem Beth Hagla: suntque exitus ejus contra linguam maris salsissimi ab aquilone in fine Jordanis ad australem plagam:"
      en: "And it passeth by Bethhagla northward: and the outgoings thereof are towards the north of the most salt sea at the south end of the Jordan:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui est terminus illius ab oriente. Haec est possessio filiorum Benjamin per terminos suos in circuitu, et familias suas."
      en: "Which is the border of it on the east side. This is the possession of the children of Benjamin by their borders round about, and their families."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Fueruntque civitates ejus, Jericho et Beth Hagla et vallis Casis,"
      en: "And their cities were, Jericho and Bethhagla and Vale-Casis,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Beth Araba et Samaraim et Bethel"
      en: "Betharaba and Samaraim and Bethel,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et Avim et Aphara et Ophera,"
      en: "And Avim and Aphara and Ophera,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "villa Emona et Ophni et Gabee: civitates duodecim, et villae earum."
      en: "The town Emona and Ophni and Gabee: twelve cities, and their villages."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Gabaon et Rama et Beroth,"
      en: "Gabam and Rama and Beroth,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et Mesphe et Caphara, et Amosa"
      en: "And Mesphe, and Caphara, and Amosa,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et Recem, Jarephel et Tharela,"
      en: "And Recem, Jarephel and Tharela,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et Sela, Eleph, et Jebus, quae est Jerusalem, Gabaath et Cariath: civitates quatuordecim, et villae earum. Haec est possessio filiorum Benjamin juxta familias suas."
      en: "And Sela, Eleph and Jebus, which is Jerusalem, Gabaath and Cariath: fourteen cities, and their villages. This is the possession of the children of Benjamin by their families."
    status: { la: verified, en: verified }
