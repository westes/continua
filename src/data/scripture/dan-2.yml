# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: dan
chapter: 2
verses:
  - n: 1
    text:
      la: "In anno secundo regni Nabuchodonosor, vidit Nabuchodonosor somnium, et conterritus est spiritus ejus, et somnium ejus fugit ab eo."
      en: "In the second year of the reign of Nabuchodonosor, Nabuchodonosor had a dream, and his spirit was terrified, and his dream went out of his mind."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Praecepit autem rex ut convocarentur arioli, et magi, et malefici, et Chaldaei, ut indicarent regi somnia sua. Qui cum venissent, steterunt coram rege."
      en: "Then the king commanded to call together the diviners and the wise men, and the magicians, and the Chaldeans: to declare to the king his dreams: so they came and stood before the king."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dixit ad eos rex: Vidi somnium, et mente confusus ignoro quid viderim."
      en: "And the king said to them: I saw a dream: and being troubled in mind I know not what I saw."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Responderuntque Chaldaei regi syriace: Rex, in sempiternum vive! dic somnium servis tuis, et interpretationem ejus indicabimus."
      en: "And the Chaldeans answered the king in Syriac: O king, live for ever: tell to thy servants thy dream, and we will declare the interpretation thereof."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et respondens rex ait Chaldaeis: Sermo recessit a me: nisi indicaveritis mihi somnium, et conjecturam ejus, peribitis vos, et domus vestrae publicabuntur."
      en: "And the king answering said to the Chaldeans: The thing is gone out of my mind: unless you tell me the dream, and the meaning thereof, you shall be put to death, and your houses shall be confiscated."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Si autem somnium, et conjecturam ejus narraveritis, praemia, et dona, et honorem multum accipietis a me. Somnium igitur, et interpretationem ejus indicate mihi."
      en: "But if you tell the dream, and the meaning of it, you shall receive of me rewards, and gifts, and great honour: therefore tell me the dream, and the interpretation thereof."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Responderunt secundo, atque dixerunt: Rex somnium dicat servis suis, et interpretationem illius indicabimus."
      en: "They answered again and said: Let the king tell his servants the dream, and we will declare the interpretation of it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Respondit rex, et ait: Certe novi quod tempus redimitis, scientes quod recesserit a me sermo."
      en: "The king answered, and said: I know for certain that you seek to gain time, since you know that the thing is gone from me."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si ergo somnium non indicaveritis mihi, una est de vobis sententia, quod interpretationem quoque fallacem, et deceptione plenam composueritis, ut loquamini mihi donec tempus pertranseat. Somnium itaque dicite mihi, ut sciam quod interpretationem quoque ejus veram loquamini."
      en: "If therefore you tell me not the dream, there is one sentence concerning you, that you have also framed a lying interpretation, and full of deceit, to speak before me till the time pass away. Tell me therefore the dream, that I may know that you also give a true interpretation thereof."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Respondentes ergo Chaldaei coram rege, dixerunt: Non est homo super terram, qui sermonem tuum, rex, possit implere: sed neque regum quisquam magnus et potens verbum hujuscemodi sciscitatur ab omni ariolo, et mago, et Chaldaeo."
      en: "Then the Chaldeans answered before the king, and said: There is no man upon earth, that can accomplish thy word, O king, neither doth any king, though great and mighty, ask such a thing of any diviner, or wise man, or Chaldean."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sermo enim, quem tu quaeris, rex, gravis est: nec reperietur quisquam qui indicet illum in conspectu regis, exceptis diis, quorum non est cum hominibus conversatio."
      en: "For the thing that thou askest, O king, is difficult; nor can any one be found that can shew it before the king, except the gods, whose conversation is not with men."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quo audito, rex, in furore et in ira magna, praecepit ut perirent omnes sapientes Babylonis."
      en: "Upon hearing this, the king in fury, and in great wrath, commanded that all the wise men of Babylon should be put to death."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et egressa sententia, sapientes interficiebantur: quaerebanturque Daniel et socii ejus, ut perirent."
      en: "And the decree being gone forth, the wise men were slain: and Daniel and his companions were sought for, to be put to death."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tunc Daniel requisivit de lege atque sententia ab Arioch principe militiae regis, qui egressus fuerat ad interficiendos sapientes Babylonis."
      en: "Then Daniel inquired concerning the law and the sentence, of Arioch the general of the king's army, who was gone forth to kill the wise men of Babylon."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et interrogavit eum, qui a rege potestatem acceperat, quam ob causam tam crudelis sententia a facie regis esset egressa. Cum ergo rem indicasset Arioch Danieli,"
      en: "And he asked him that had received the orders of the king, why so cruel a sentence was gone forth from the face of the king. And when Arioch had told the matter to Daniel,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Daniel ingressus rogavit regem ut tempus daret sibi ad solutionem indicandam regi."
      en: "Daniel went in and desired of the king, that he would give him time to resolve the question and declare it to the king."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ingressus est domum suam, Ananiaeque et Misaeli et Azariae, sociis suis, indicavit negotium,"
      en: "And he went into his house, and told the matter to Ananias, and Misael, and Azarias his companions:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ut quaererent misericordiam a facie Dei caeli super sacramento isto, et non perirent Daniel et socii ejus cum ceteris sapientibus Babylonis."
      en: "To the end that they should ask mercy at the face of the God of heaven concerning this secret, and that Daniel and his companions might not perish with the rest of the wise men of Babylon."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tunc Danieli mysterium per visionem nocte revelatum est: et benedixit Daniel Deum caeli,"
      en: "Then was the mystery revealed to Daniel by a vision in the night: and Daniel blessed the God of heaven,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et locutus ait: Sit nomen Domini benedictum a saeculo et usque in saeculum: quia sapientia et fortitudo ejus sunt."
      en: "And speaking he said: Blessed be the name of the Lord from eternity and for evermore: for wisdom and fortitude are his."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ipse mutat tempora, et aetates: transfert regna, atque constituit: dat sapientiam sapientibus, et scientiam intelligentibus disciplinam."
      en: "And he changeth times and ages: taketh away kingdoms and establisheth them, giveth wisdom to the wise, and knowledge to them that have understanding."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ipse revelat profunda et abscondita, et novit in tenebris constituta: et lux cum eo est."
      en: "He revealeth deep and hidden things, and knoweth what is in darkness: and light is with him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Tibi, Deus patrum nostrorum, confiteor, teque laudo, quia sapientiam et fortitudinem dedisti mihi, et nunc ostendisti mihi quae rogavimus te, quia sermonem regis aperuisti nobis."
      en: "To thee, O God of our fathers, I give thanks, and I praise thee: because thou hast given me wisdom and strength: and now thou hast shewn me what we desired of thee, for thou hast made known to us, the king's discourse."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Post haec Daniel ingressus ad Arioch, quem constituerat rex ut perderet sapientes Babylonis, sic ei locutus est: Sapientes Babylonis ne perdas: introduc me in conspectu regis, et solutionem regi narrabo."
      en: "After this Daniel went in to Arioch, to whom the king had given orders to destroy the wise men of Babylon, and he spoke thus to him: Destroy not the wise men of Babylon: bring me in before the king, and I will tell the solution to the king."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Tunc Arioch festinus introduxit Danielem ad regem, et dixit ei: Inveni hominem de filiis transmigrationis Juda, qui solutionem regi annuntiet."
      en: "Then Arioch in haste brought in Daniel to the king, and said to him: I have found a man of the children of the captivity of Juda, that will resolve the question to the king."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Respondit rex, et dixit Danieli, cujus nomen erat Baltassar: Putasne vere potes mihi indicare somnium, quod vidi, et interpretationem ejus?"
      en: "The king answered, and said to Daniel, whose name was Baltassar: Thinkest thou indeed that thou canst tell me the dream that I saw, and the interpretation thereof?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et respondens Daniel coram rege, ait: Mysterium, quod rex interrogat, sapientes, magi, arioli, et aruspices nequeunt indicare regi:"
      en: "And Daniel made answer before the king, and said: The secret that the king desireth to know, none of the wise men, or the philosophers, or the diviners, or the soothsayers can declare to the king."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sed est Deus in caelo revelans mysteria, qui indicavit tibi, rex Nabuchodonosor, quae ventura sunt in novissimis temporibus. Somnium tuum, et visiones capitis tui in cubili tuo hujuscemodi sunt."
      en: "But there is a God in heaven that revealeth mysteries, who hath shewn to thee, O king Nabuchodonosor, what is to come to pass in the latter times. Thy dream, and the visions of thy head upon thy bed, are these:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tu, rex, cogitare coepisti in strato tuo, quid esset futurum post haec: et qui revelat mysteria, ostendit tibi quae ventura sunt."
      en: "Thou, O king, didst begin to think in thy bed, what should come to pass hereafter: and he that revealeth mysteries shewed thee what shall come to pass."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Mihi quoque non in sapientia, quae est in me plus quam in cunctis viventibus, sacramentum hoc revelatum est: sed ut interpretatio regi manifesta fieret, et cogitationes mentis tuae scires."
      en: "To me also this secret is revealed, not by any wisdom that I have more than all men alive: but that the interpretation might be made manifest to the king, and thou mightest know the thoughts of thy mind."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Tu, rex, videbas, et ecce quasi statua una grandis: statua illa magna, et statura sublimis stabat contra te, et intuitus ejus erat terribilis."
      en: "Thou, O king, sawest, and behold there was as it were a great statue: this statue, which was great and high, tall of stature, stood before thee, and the look thereof was terrible."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Hujus statuae caput ex auro optimo erat, pectus autem et brachia de argento, porro venter et femora ex aere,"
      en: "The head of this statue was of fine gold, but the breast and the arms of silver, and the belly and the thighs of brass:"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "tibiae autem ferreae: pedum quaedam pars erat ferrea, quaedam autem fictilis."
      en: "And the legs of iron, the feet part of iron and part of clay."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Videbas ita, donec abscissus est lapis de monte sine manibus: et percussit statuam in pedibus ejus ferreis et fictilibus, et comminuit eos."
      en: "Thus thou sawest, till a stone was cut out of a mountain without hands: and it struck the statue upon the feet thereof that were of iron and of clay, and broke them in pieces."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Tunc contrita sunt pariter ferrum, testa, aes, argentum, et aurum, et redacta quasi in favillam aestivae areae, quae rapta sunt vento, nullusque locus inventus est eis: lapis autem, qui percusserat statuam, factus est mons magnus, et implevit universam terram."
      en: "Then was the iron, the clay, the brass, the silver, and the gold broken to pieces together, and became like the chaff of a summer's threshingfloor, and they were carried away by the wind: and there was no place found for them: but the stone that struck the statue, became a great mountain, and filled the whole earth."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "hoc est somnium. Interpretationem quoque ejus dicemus coram te, rex."
      en: "This is the dream: we will also tell the interpretation thereof before thee, O king."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Tu rex regum es: et Deus caeli regnum, et fortitudinem, et imperium, et gloriam dedit tibi:"
      en: "Thou art a king of kings: and the God of heaven hath given thee a kingdom, and strength, and power, and glory:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et omnia, in quibus habitant filii hominum, et bestiae agri: volucres quoque caeli dedit in manu tua, et sub ditione tua universa constituit: tu es ergo caput aureum."
      en: "And all places wherein the children of men, and the beasts of the field do dwell: he hath also given the birds of the air into thy hand, and hath put all things under thy power: thou therefore art the head of gold."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et post te consurget regnum aliud minus te argenteum: et regnum tertium aliud aereum, quod imperabit universae terrae."
      en: "And after thee shall rise up another kingdom, inferior to thee, of silver: and another third kingdom of brass, which shall rule over all the world."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et regnum quartum erit velut ferrum: quomodo ferrum comminuit, et domat omnia, sic comminuet, et conteret omnia haec."
      en: "And the fourth kingdom shall be as iron. As iron breaketh into pieces, and subdueth all things, so shall that break and destroy all these."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Porro quia vidisti pedum, et digitorum partem testae figuli, et partem ferream, regnum divisum erit: quod tamen de plantario ferri orietur, secundum quod vidisti ferrum mistum testae ex luto."
      en: "And whereas thou sawest the feet, and the toes, part of potter's clay, and part of iron: the kingdom shall be divided, but yet it shall take its origin from the iron, according as thou sawest the iron mixed with the miry clay."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et digitos pedum ex parte ferreos, et ex parte fictiles: ex parte regnum erit solidum, et ex parte contritum."
      en: "And as the toes of the feet were part of iron, and part of clay, the kingdom shall be partly strong, and partly broken."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Quod autem vidisti ferrum mistum testae ex luto, commiscebuntur quidem humano semine, sed non adhaerebunt sibi, sicut ferrum misceri non potest testae."
      en: "And whereas thou sawest the iron mixed with miry clay, they shall be mingled indeed together with the seed of man, but they shall not stick fast one to another, as iron cannot be mixed with clay."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "In diebus autem regnorum illorum suscitabit Deus caeli regnum, quod in aeternum non dissipabitur, et regnum ejus alteri populo non tradetur: comminuet autem, et consumet universa regna haec, et ipsum stabit in aeternum."
      en: "But in the days of those kingdoms the God of heaven will set up a kingdom that shall never be destroyed, and his kingdom shall not be delivered up to another people, and it shall break in pieces, and shall consume all these kingdoms, and itself shall stand for ever."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Secundum quod vidisti, quod de monte abscissus est lapis sine manibus, et comminuit testam, et ferrum, et aes, et argentum, et aurum, Deus magnus ostendit regi quae ventura sunt postea: et verum est somnium, et fidelis interpretatio ejus."
      en: "According as thou sawest that the stone was cut out of the mountain without hands, and broke in pieces, the clay, and the iron, and the brass, and the silver, and the gold, the great God hath shewn the king what shall come to pass hereafter, and the dream is true, and the interpretation thereof is faithful."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Tunc rex Nabuchodonosor cecidit in faciem suam, et Danielem adoravit, et hostias, et incensum praecepit ut sacrificarent ei."
      en: "Then king Nabuchodonosor fell on his face, and worshipped Daniel, and commanded that they should offer in sacrifice to him victims and incense."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Loquens ergo rex, ait Danieli: Vere Deus vester Deus deorum est, et Dominus regum, et revelans mysteria: quoniam tu potuisti aperire hoc sacramentum."
      en: "And the king spoke to Daniel, and said: Verily your God is the God of gods, and Lord of kings, and a revealer of hidden things: seeing thou couldst discover this secret."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Tunc rex Danielem in sublime extulit, et munera multa et magna dedit ei: et constituit eum principem super omnes provincias Babylonis, et praefectum magistratuum super cunctos sapientes Babylonis."
      en: "Then the king advanced Daniel to a high station, and gave him many and great gifts: and he made him governor over all the provinces of Babylon, and chief of the magistrates over all the wise men of Babylon."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Daniel autem postulavit a rege, et constituit super opera provinciae Babylonis Sidrach, Misach, et Abdenago: ipse autem Daniel erat in foribus regis."
      en: "And Daniel requested of the king, and he appointed Sidrach, Misach, and Abdenago over the works of the province of Babylon: but Daniel himself was in the king's palace."
    status: { la: verified, en: verified }
