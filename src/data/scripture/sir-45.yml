# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 45
verses:
  - n: 1
    text:
      la: "Dilectus Deo et hominibus Moyses, cujus memoria in benedictione est."
      en: "Moses was beloved of God, and men: whose memory is in benediction."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Similem illum fecit in gloria sanctorum, et magnificavit eum in timore inimicorum, et in verbis suis monstra placavit."
      en: "He made him like the saints in glory, and magnified him in the fear of his enemies, and with his words he made prodigies to cease."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Glorificavit illum in conspectu regum, et jussit illi coram populo suo, et ostendit illi gloriam suam."
      en: "He glorified him in the sight of kings, and gave him commandments in the sight of his people, and shewed him his glory."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "In fide et lenitate ipsius sanctum fecit illum, et elegit eum ex omni carne."
      en: "He sanctified him in his faith, and meekness, and chose him out of all flesh."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Audivit enim eum, et vocem ipsius, et induxit illum in nubem."
      en: "For he heard him, and his voice, and brought him into a cloud."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dedit illi coram praecepta, et legem vitae et disciplinae, docere Jacob testamentum suum, et judicia sua Israel."
      en: "And he gave him commandments before his face, and a law of life and instruction, that he might teach Jacob his covenant, and Israel his judgments."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Excelsum fecit Aaron fratrem ejus, et similem sibi, de tribu Levi."
      en: "He exalted Aaron his brother, and like to himself of the tribe of Levi:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Statuit ei testamentum aeternum, et dedit illi sacerdotium gentis, et beatificavit illum in gloria:"
      en: "He made an everlasting covenant with him, and gave him the priesthood of the nation, and made him blessed in glory,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et circumcinxit eum zona gloriae, et induit eum stolam gloriae, et coronavit eum in vasis virtutis."
      en: "And he girded him about with a glorious girdle, and clothed him with a robe of glory, and crowned him with majestic attire."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Circumpedes, et femoralia, et humerale posuit ei: et cinxit illum tintinnabulis aureis plurimis in gyro:"
      en: "He put upon him a garment to the feet, and breeches, and as ephod, and he compassed him with many little bells of gold all round about,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dare sonitum in incessu suo, auditum facere sonitum in templo in memoriam filiis gentis suae."
      en: "That as he went there might be a sound, and a noise made that might be heard in the temple, for a memorial to the children of his people."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Stolam sanctam auro, et hyacintho, et purpura, opus textile viri sapientis, judicio et veritate praediti:"
      en: "He gave him a holy robe of gold, and blue, and purple, a woven work of a wise man, endued with judgment and truth:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "torto cocco opus artificis gemmis pretiosis figuratis in ligatura auri, et opere lapidarii sculptis, in memoriam secundum numerum tribuum Israel."
      en: "Of twisted scarlet the work of an artist, with precious stones cut and set in gold, and graven by the work of a lapidary for a memorial, according to the number of the tribes of Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Corona aurea super mitram ejus expressa signo sanctitatis, et gloria honoris: opus virtutis, et desideria oculorum ornata."
      en: "And a crown of gold upon his mitre wherein was engraved Holiness, an ornament of honour: a work of power, and delightful to the eyes for its beauty."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sic pulchra ante ipsum non fuerunt talia usque ad originem."
      en: "Before him there were none so beautiful, even from the beginning."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non est indutus illa alienigena aliquis, sed tantum filii ipsius soli, et nepotes ejus per omne tempus."
      en: "No stranger was ever clothed with them, but only his children alone, and his grandchildren for ever."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sacrificia ipsius consumpta sunt igne quotidie."
      en: "His sacrifices were consumed with fire every day."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Complevit Moyses manus ejus, et unxit illum oleo sancto."
      en: "Moses filled his hands and anointed him with holy oil."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Factum est illi in testamentum aeternum, et semini ejus, sicut dies caeli, fungi sacerdotio, et habere laudem, et glorificare populum suum in nomine ejus."
      en: "This was made to him for an everlasting testament, and to his seed as the days of heaven, to execute the office of the priesthood, and to have praise, and to glorify his people in his name."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ipsum elegit ab omni vivente, offerre sacrificium Deo, incensum, et bonum odorem, in memoriam placare pro populo suo:"
      en: "He chose him out of all men living, to offer sacrifice to God, incense, and a good savour, for a memorial to make reconciliation for his people:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et dedit illi in praeceptis suis potestatem, in testamentis judiciorum: docere Jacob testimonia, et in lege sua lucem dare Israel."
      en: "And he gave him power in his commandments, in the covenants of his judgments, that he should teach Jacob his testimonies, and give light to Israel in his law."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quia contra illum steterunt alieni, et propter invidiam circumdederunt illum homines in deserto, qui erant cum Dathan et Abiron, et congregatio Core in iracundia."
      en: "And strangers stood up against him, and through envy the men that were with Dathan and Abiron, compassed him about in the wilderness, and the congregation of Core in their wrath."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Vidit Dominus Deus, et non placuit illi, et consumpti sunt in impetu iracundiae."
      en: "The Lord God saw and it pleased him not, and they were consumed in his wrathful indignation."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Fecit illis monstra, et consumpsit illos in flamma ignis."
      en: "He wrought wonders upon them, and consumed them with a flame of fire."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et addidit Aaron gloriam, et dedit illi haereditatem, et primitias frugum terrae divisit illi."
      en: "And he added glory to Aaron, and gave him an inheritance, and divided unto him the firstfruits of the increase of the earth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Panem ipsis in primis paravit in satietatem: nam et sacrificia Domini edent, quae dedit illi et semini ejus."
      en: "He prepared them bread in the first place unto fulness: for the sacrifices also of the Lord they shall eat, which he gave to him, and to his seed."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ceterum in terra gentes non haereditabit, et pars non est illi in gente: ipse est enim pars ejus, et haereditas."
      en: "But he shall not inherit among the people in the land, and he hath no portion among the people: for he himself is his portion and inheritance."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Phinees, filius Eleazari, tertius in gloria est, imitando eum in timore Domini,"
      en: "Phinees the son of Eleazar is the third in glory, by imitating him in the fear of the Lord:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et stare in reverentia gentis: in bonitate et alacritate animae suae placuit Deo pro Israel."
      en: "And he stood up in the shameful fall of the people: in the goodness and readiness of his soul he appeased God for Israel."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Ideo statuit illi testamentum pacis, principem sanctorum et gentis suae, ut sit illi et semini ejus sacerdotii dignitas in aeternum."
      en: "Therefore he made to him a covenant of peace, to be the prince of the sanctuary, and of his people, that the dignity of priesthood should be to him and to his seed for ever."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et testamentum David regi filio Jesse de tribu Juda, haereditas ipsi et semini ejus: ut daret sapientiam in cor nostrum, judicare gentem suam in justitia, ne abolerentur bona ipsorum: et gloriam ipsorum in gentem eorum aeternam fecit."
      en: "And a covenant to David the king, the son of Jesse of the tribe of Juda, an inheritance to him and to his seed, that he might give wisdom into our heart to judge his people in justice, that their good things might not be abolished, and he made their glory in their nation everlasting."
    status: { la: verified, en: verified }
