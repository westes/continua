# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 20
verses:
  - n: 1
    text:
      la: "Et locutus est Dominus ad Josue, dicens: Loquere filiis Israel, et dic eis:"
      en: "And the Lord spoke to Josue, saying: Speak to the children of Israel and say to them:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Separate urbes fugitivorum, de quibus locutus sum ad vos per manum Moysi:"
      en: "Appoint cities of refuge, of which I spoke to you by the hand of Moses:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ut confugiat ad eas quicumque animam percusserit nescius, et possit evadere iram proximi, qui ultor est sanguinis:"
      en: "That whosoever shall kill a person unawares may flee to them: and may escape the wrath of the kinsman, who is the avenger of blood:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cum ad unam harum confugerit civitatum, stabit ante portam civitatis, et loquetur senioribus urbis illius ea quae se comprobent innocentem: sicque suscipient eum, et dabunt ei locum ad habitandum."
      en: "And when he shall flee to one of these cities: he shall stand before the gate of the city, and shall speak to the ancients of that city, such things as prove him innocent: and so shall they receive him, and give him a place to dwell in."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque ultor sanguinis eum fuerit persecutus, non tradent in manus ejus: quia ignorans percussit proximum ejus, nec ante biduum triduumve ejus probatur inimicus."
      en: "And when the avenger of blood shall pursue him, they shall not deliver him into his hands, because he slew his neighbour unawares, and is not proved to have been his enemy two or three days before."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et habitabit in civitate illa, donec stet ante judicium causam reddens facti sui, et moriatur sacerdos magnus, qui fuerit in illo tempore: tunc revertetur homicida, et ingredietur civitatem et domum suam de qua fugerat."
      en: "And he shall dwell in that city, till he stand before judgment to give an account of his fact, and till the death of the high priest, who shall be at that time: then shall the manslayer return, and go into his own city and house from whence he fled."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Decreveruntque Cedes in Galilaea montis Nephthali, et Sichem in monte Ephraim, et Cariatharbe, ipsa est Hebron in monte Juda."
      en: "And they appointed Cedes in Galilee of mount Nephtali, and Sichem in mount Ephraim, and Cariath-Arbe, the same is Hebron in the mountain of Juda."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et trans Jordanem contra orientalem plagam Jericho, statuerunt Bosor, quae sita est in campestri solitudine de tribu Ruben, et Ramoth in Galaad de tribu Gad, et Gaulon in Basan de tribu Manasse."
      en: "And beyond the Jordan to the east of Jericho, they appointed Bosor, which is upon the plain of the wilderness of the tribe of Ruben, and Ramoth in Galaad of the tribe of Gad, and Gaulon in Basan of the tribe of Manasses."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Hae civitates constitutae sunt cunctis filiis Israel, et advenis qui habitabant inter eos, ut fugeret ad eas qui animam nescius percussisset, et non moreretur in manu proximi, effusum sanguinem vindicare cupientis, donec staret ante populum expositurus causam suam."
      en: "These cities were appointed for all the children of Israel, and for the strangers, that dwelt among them: that whosoever had killed a person unawares might flee to them, and not die by the hand of the kinsman, coveting to revenge the blood that was shed, until he should stand before the people to lay open his cause."
    status: { la: verified, en: verified }
