# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 10
verses:
  - n: 1
    text:
      la: "taedet animam meam vitae meae dimittam adversum me eloquium meum loquar in amaritudine animae meae"
      en: "My soul is weary of my life, I will let go my speech against myself, I will speak in the bitterness of my soul."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dicam Deo noli me condemnare indica mihi cur me ita iudices"
      en: "I will say to God: Do not condemn me: tell me why thou judgest me so."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "numquid bonum tibi videtur si calumnieris et opprimas me opus manuum tuarum et consilium impiorum adiuves"
      en: "Doth it seem good to thee that thou shouldst calumniate me, and oppress me, the work of thy own hands, and help the counsel of the wicked?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "numquid oculi carnei tibi sunt aut sicut videt homo et tu videbis"
      en: "Hast thou eyes of flesh: or, shalt thou see as man seeth?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "numquid sicut dies hominis dies tui et anni tui sicut humana sunt tempora"
      en: "Are thy days as the days of man, and are thy years as the times of men:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut quaeras iniquitatem meam et peccatum meum scruteris"
      en: "That thou shouldst inquire after my iniquity, and search after my sin?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et scias quia nihil impium fecerim cum sit nemo qui de manu tua possit eruere"
      en: "And shouldst know that I have done no wicked thing, whereas there is no man that can deliver out of thy hand."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "manus tuae plasmaverunt me et fecerunt me totum in circuitu et sic repente praecipitas me"
      en: "Thy hands have made me, and fashioned me wholly round about, and dost thou thus cast me down headlong on a sudden?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "memento quaeso quod sicut lutum feceris me et in pulverem reduces me"
      en: "Remember, I beseech thee, that thou hast made me as the clay, and thou wilt bring me into dust again."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "nonne sicut lac mulsisti me et sicut caseum me coagulasti"
      en: "Hast thou not milked me as milk, and curdled me like cheese?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "pelle et carnibus vestisti me et ossibus et nervis conpegisti me"
      en: "Thou hast clothed me with skin and flesh: thou hast put me together with bones and sinews:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "vitam et misericordiam tribuisti mihi et visitatio tua custodivit spiritum meum"
      en: "Thou hast granted me life and mercy, and thy visitation hath preserved my spirit."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "licet haec celes in corde tuo tamen scio quia universorum memineris"
      en: "Although thou conceal these things in thy heart, yet I know that thou rememberest all things."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "si peccavi et ad horam pepercisti mihi cur ab iniquitate mea mundum me esse non pateris"
      en: "If I have sinned and thou hast spared me for an hour: why dost thou not suffer me to be clean from my iniquity?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et si impius fuero vae mihi est et si iustus non levabo caput saturatus adflictione et miseria"
      en: "And if I be wicked, woe unto me: and if just, I shall not lift up my head, being filled with affliction and misery."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et propter superbiam quasi leaenam capies me reversusque mirabiliter me crucias"
      en: "And for pride thou wilt take me as a lioness, and returning thou tormentest me wonderfully."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "instauras testes tuos contra me et multiplicas iram tuam adversum me et poenae militant in me"
      en: "Thou renewest thy witnesses against me, and multipliest thy wrath upon me, and pains war against me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quare de vulva eduxisti me qui utinam consumptus essem ne oculus me videret"
      en: "Why didst thou bring me forth out of the womb: O that I had been consumed that eye might not see me!"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "fuissem quasi qui non essem de utero translatus ad tumulum"
      en: "I should have been as if I had not been, carried from the womb to the grave."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "numquid non paucitas dierum meorum finietur brevi dimitte ergo me ut plangam paululum dolorem meum"
      en: "Shall not the fewness of my days be ended shortly? suffer me, therefore, that I may lament my sorrow a little:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "antequam vadam et non revertar ad terram tenebrosam et opertam mortis caligine"
      en: "Before I go, and return no more, to a land that is dark and covered with the mist of death:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "terram miseriae et tenebrarum ubi umbra mortis et nullus ordo et sempiternus horror inhabitans"
      en: "A land of misery and darkness, where the shadow of death, and no order, but everlasting horror dwelleth."
    status: { la: verified, en: verified }
