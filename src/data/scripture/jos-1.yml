# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 1
verses:
  - n: 1
    text:
      la: "Et factum est post mortem Moysi servi Domini, ut loqueretur Dominus ad Josue filium Nun, ministrum Moysi, et diceret ei:"
      en: "Now it came to pass after the death of Moses the servant of the Lord, that the Lord spoke to Josue the son of Nun, the minister of Moses, and said to him:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Moyses servus meus mortuus est: surge, et transi Jordanem istum tu et omnis populus tecum, in terram, quam ego dabo filiis Israel."
      en: "Moses my servant is dead: arise, and pass over this Jordan, thou and thy people with thee, into the land which I will give to the children of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Omnem locum, quem calcaverit vestigium pedis vestri, vobis tradam, sicut locutus sum Moysi."
      en: "I will deliver to you every place that the sole of your foot shall tread upon, as I have said to Moses."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "A deserto et Libano usque ad fluvium magnum Euphraten, omnis terra Hethaeorum usque ad mare magnum contra solis occasum erit terminus vester."
      en: "From the desert and from Libanus unto the great river Euphrates, all the land of the Hethites unto the great sea toward the going; down of the sun, shall be your border."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Nullus poterit vobis resistere cunctis diebus vitae tuae: sicut fui cum Moyse, ita ero tecum: non dimittam, nec derelinquam te."
      en: "No man shall be able to resist you all the days of thy life: as I have been with Moses, so will I be with thee: I will not leave thee, nor forsake thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Confortare, et esto robustus: tu enim sorte divides populo huic terram, pro qua juravi patribus suis, ut traderem eam illis."
      en: "Take courage, and be strong: for thou shalt divide by lot to this people the land, for which I swore to their fathers, that I would deliver it to them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Confortare igitur, et esto robustus valde: ut custodias, et facias omnem legem, quam praecepit tibi Moyses servus meus: ne declines ab ea ad dexteram vel ad sinistram, ut intelligas cuncta quae agis."
      en: "Take courage therefore, and be very valiant: that thou mayst observe and do all the law, which Moses my servant hath commanded thee: turn not from it to the right hand or to the left, that thou mayst understand all things which thou dost."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non recedat volumen legis hujus ab ore tuo: sed meditaberis in eo diebus ac noctibus, ut custodias et facias omnia quae scripta sunt in eo: tunc diriges viam tuam, et intelliges eam."
      en: "Let not the book of this law depart from thy mouth: but thou shalt meditate on it day and night, that thou mayst observe and do all things that are written in it: then shalt thou direct thy way, and understand it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ecce praecipio tibi: confortare, et esto robustus. Noli metuere, et noli timere: quoniam tecum est Dominus Deus tuus in omnibus ad quaecumque perrexeris."
      en: "Behold I command thee, take courage, and be strong. Fear not and be not dismayed: because the Lord thy God is with thee in all things whatsoever thou shalt go to."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Praecepitque Josue principibus populi, dicens: Transite per medium castrorum, et imperate populo, ac dicite:"
      en: "And Josue commanded the princes of the people, saying: Pass through the midst of the camp, and command the people, and say:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Praeparate vobis cibaria: quoniam post diem tertium transibitis Jordanem, et intrabitis ad possidendam terram, quam Dominus Deus vester daturus est vobis."
      en: "Prepare you victuals: for after the third day you shall pass over the Jordan and shall go in to possess the land, which the Lord your God will give you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Rubenitis quoque et Gaditis, et dimidiae tribui Manasse, ait:"
      en: "And he said to the Rubenites, and the Gadites, and the half tribe of Manasses:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Mementote sermonis, quem praecepit vobis Moyses famulus Domini, dicens: Dominus Deus vester dedit vobis requiem, et omnem terram."
      en: "Remember the word, which Moses the servant of the Lord commanded you, saying: The Lord your God hath given you rest, and all this land."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Uxores vestrae, et filii, ac jumenta manebunt in terra, quam tradidit vobis Moyses trans Jordanem: vos autem transite armati ante fratres vestros, omnes fortes manu, et pugnate pro eis,"
      en: "Your wives, and children, and cattle shall remain in the land which Moses gave you on this side of the Jordan: but pass you over armed before your brethren, all of you that are strong of hand, and fight for them,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "donec det Dominus requiem fratribus vestris sicut et vobis dedit, et possideant ipsi quoque terram, quam Dominus Deus vester daturus est eis: et sic revertimini in terram possessionis vestrae, et habitabitis in ea, quam vobis dedit Moyses famulus Domini trans Jordanem contra solis ortum."
      en: "Until the Lord give rest to your brethren as he hath given you, and they also possess the land which the Lord your God will give them: and so you shall return into the land of your possession, and you shall dwell in it, which Moses the servant of the Lord gave you beyond the Jordan, toward the rising of the sun."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Responderuntque ad Josue, atque dixerunt: Omnia, quae praecepisti nobis, faciemus: et quocumque miseris, ibimus."
      en: "And they made answer to Josue, and said: All that thou hast commanded us we will do; and whithersoever thou shalt send us, we will go."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sicut obedivimus in cunctis Moysi, ita obediemus et tibi: tantum sit Dominus Deus tuus tecum, sicut fuit cum Moyse."
      en: "As we obeyed Moses in all things, so will we obey thee also: only be the Lord thy God with thee, as he was with Moses."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui contradixerit ori tuo, et non obedierit cunctis sermonibus, quos praeceperis ei, moriatur. Tu tantum confortare, et viriliter age."
      en: "He that shall gainsay thy mouth, and not obey all thy words, that thou shalt command him, let him die: only take thou courage, and do manfully."
    status: { la: verified, en: verified }
