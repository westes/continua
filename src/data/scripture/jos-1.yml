# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jos
chapter: 1
verses:
  - n: 1
    text:
      la: "et factum est ut post mortem Mosi servi Domini loqueretur Dominus ad Iosue filium Nun ministrum Mosi et diceret ei"
      en: "Now it came to pass after the death of Moses the servant of the Lord, that the Lord spoke to Josue the son of Nun, the minister of Moses, and said to him:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Moses servus meus mortuus est surge et transi Iordanem istum tu et omnis populus tecum in terram quam ego dabo filiis Israhel"
      en: "Moses my servant is dead: arise, and pass over this Jordan, thou and thy people with thee, into the land which I will give to the children of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "omnem locum quem calcaverit vestigium pedis vestri vobis tradam sicut locutus sum Mosi"
      en: "I will deliver to you every place that the sole of your foot shall tread upon, as I have said to Moses."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "a deserto et Libano usque ad fluvium magnum Eufraten omnis terra Hettheorum usque ad mare Magnum contra solis occasum erit terminus vester"
      en: "From the desert and from Libanus unto the great river Euphrates, all the land of the Hethites unto the great sea toward the going; down of the sun, shall be your border."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nullus vobis poterit resistere cunctis diebus vitae tuae sicut fui cum Mose ero et tecum non dimittam nec derelinquam te"
      en: "No man shall be able to resist you all the days of thy life: as I have been with Moses, so will I be with thee: I will not leave thee, nor forsake thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "confortare et esto robustus tu enim sorte divides populo huic terram pro qua iuravi patribus suis ut traderem eam illis"
      en: "Take courage, and be strong: for thou shalt divide by lot to this people the land, for which I swore to their fathers, that I would deliver it to them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "confortare igitur et esto robustus valde ut custodias et facias omnem legem quam praecepit tibi Moses servus meus ne declines ab ea ad dextram vel ad sinistram ut intellegas cuncta quae agis"
      en: "Take courage therefore, and be very valiant: that thou mayst observe and do all the law, which Moses my servant hath commanded thee: turn not from it to the right hand or to the left, that thou mayst understand all things which thou dost."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "non recedat volumen legis huius de ore tuo sed meditaberis in eo diebus ac noctibus ut custodias et facias omnia quae scripta sunt in eo tunc diriges viam tuam et intelleges eam"
      en: "Let not the book of this law depart from thy mouth: but thou shalt meditate on it day and night, that thou mayst observe and do all things that are written in it: then shalt thou direct thy way, and understand it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ecce praecipio tibi confortare et esto robustus noli metuere et noli timere quoniam tecum est Dominus Deus tuus in omnibus ad quaecumque perrexeris"
      en: "Behold I command thee, take courage, end be strong. Fear not and be not dismayed: because the Lord thy God is with thee in all things whatsoever thou shalt go to."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "praecepitque Iosue principibus populi dicens transite per medium castrorum et imperate populo ac dicite"
      en: "And Josue commanded the princes of the people, saying: Pass through the midst of the camp, and command the people, and say:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "praeparate vobis cibaria quoniam post diem tertium transibitis Iordanem et intrabitis ad possidendam terram quam Dominus Deus vester daturus est vobis"
      en: "Prepare you victuals: for after the third day you shall pass over the Jordan and shall go in to possess the land, which the Lord your God will give you."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Rubenitis quoque et Gadditis et dimidiae tribui Manasse ait"
      en: "And he said to the Rubenites, and the Gadites, and the half tribe of Manasses:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "mementote sermonis quem praecepit vobis Moses famulus Domini dicens Dominus Deus vester dedit vobis requiem et omnem terram"
      en: "Remember the word, which Moses the servant of the Lord commanded you, saying: The Lord your God hath given you rest, and all this land."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "uxores vestrae et filii ac iumenta manebunt in terra quam tradidit vobis Moses trans Iordanem vos autem transite armati ante fratres vestros omnes fortes manu et pugnate pro eis"
      en: "Your wives, and children, and cattle shall remain in the land which Moses gave you on this side of the Jordan: but pass you over armed before your brethren, all of you that are strong of hand, and fight for them,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "donec det requiem Dominus fratribus vestris sicut et vobis dedit et possideant ipsi quoque terram quam Dominus Deus vester daturus est eis et sic revertemini in terram possessionis vestrae et habitabitis in ea quam vobis dedit Moses famulus Domini trans Iordanem contra solis ortum"
      en: "Until the Lord give rest to your brethren as he hath given you, and they also possess the land which the Lord your God will give them: and so you shall return into the land of your possession, and you shall dwell in it, which Moses the servant of the Lord gave you beyond the Jordan, toward the rising of the sun."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "responderuntque ad Iosue atque dixerunt omnia quae praecepisti nobis faciemus et quocumque miseris ibimus"
      en: "And they made answer to Josue, and said: All that thou hast commanded us we will do; and whithersoever thou shalt send us, we will go."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sicut oboedivimus in cunctis Mosi ita oboediemus et tibi tantum sit Dominus Deus tecum sicut fuit cum Mose"
      en: "As we obeyed Moses in all things, so will we obey thee also: only be the Lord thy God with thee, as he was with Moses."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui contradixerit ori tuo et non oboedierit cunctis sermonibus quos praeceperis ei moriatur tu tantum confortare et viriliter age"
      en: "He that shall gainsay thy mouth, and not obey all thy words, that thou shalt command him, let him die: only take thou courage, and do manfully."
    status: { la: verified, en: verified }
