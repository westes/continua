# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 1
verses:
  - n: 1
    text:
      la: "liber generationis Iesu Christi filii David filii Abraham"
      en: "The book of the generation of Jesus Christ, the son of David, the son of Abraham:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Abraham genuit Isaac Isaac autem genuit Iacob Iacob autem genuit Iudam et fratres eius"
      en: "Abraham begot Isaac. And Isaac begot Jacob. And Jacob begot Judas and his brethren."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Iudas autem genuit Phares et Zara de Thamar Phares autem genuit Esrom Esrom autem genuit Aram"
      en: "And Judas begot Phares and Zara of Thamar. And Phares begot Esron. And Esron begot Aram."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Aram autem genuit Aminadab Aminadab autem genuit Naasson Naasson autem genuit Salmon"
      en: "And Aram begot Aminadab. And Aminadab begot Naasson. And Naasson begot Salmon."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Salmon autem genuit Booz de Rachab Booz autem genuit Obed ex Ruth Obed autem genuit Iesse Iesse autem genuit David regem"
      en: "And Salmon begot Booz of Rahab. And Booz begot Obed of Ruth. And Obed begot Jesse."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "David autem rex genuit Salomonem ex ea quae fuit Uriae"
      en: "And Jesse begot David the king. And David the king begot Solomon, of her that had been the wife of Urias."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Salomon autem genuit Roboam Roboam autem genuit Abiam Abia autem genuit Asa"
      en: "And Solomon begot Roboam. And Roboam begot Abia. And Abia begot Asa."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Asa autem genuit Iosaphat Iosaphat autem genuit Ioram Ioram autem genuit Oziam"
      en: "And Asa begot Josaphat. And Josaphat begot Joram. And Joram begot Ozias."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ozias autem genuit Ioatham Ioatham autem genuit Achaz Achaz autem genuit Ezechiam"
      en: "And Ozias begot Joatham. And Joatham begot Achaz. And Achaz begot Ezechias."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ezechias autem genuit Manassen Manasses autem genuit Amon Amon autem genuit Iosiam"
      en: "And Ezechias begot Manasses. And Manesses begot Amon. And Amon begot Josias."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Iosias autem genuit Iechoniam et fratres eius in transmigratione Babylonis"
      en: "And Josias begot Jechonias and his brethren in the transmigration of Babylon."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et post transmigrationem Babylonis Iechonias genuit Salathihel Salathihel autem genuit Zorobabel"
      en: "And after the transmigration of Babylon, Jechonias begot Salathiel. And Salathiel begot Zorobabel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Zorobabel autem genuit Abiud Abiud autem genuit Eliachim Eliachim autem genuit Azor"
      en: "And Zorobabel begot Abiud. And Abiud begot Eliacim. And Eliacim begot Azor."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Azor autem genuit Saddoc Saddoc autem genuit Achim Achim autem genuit Eliud"
      en: "And Azor begot Sadoc. And Sadoc begot Achim. And Achim begot Eliud."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Eliud autem genuit Eleazar Eleazar autem genuit Matthan Matthan autem genuit Iacob"
      en: "And Eliud begot Eleazar. And Eleazar begot Mathan. And Mathan begot Jacob."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Iacob autem genuit Ioseph virum Mariae de qua natus est Iesus qui vocatur Christus"
      en: "And Jacob begot Joseph the husband of Mary, of whom was born Jesus, who is called Christ."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "omnes ergo generationes ab Abraham usque ad David generationes quattuordecim et a David usque ad transmigrationem Babylonis generationes quattuordecim et a transmigratione Babylonis usque ad Christum generationes quattuordecim"
      en: "So all the generations, from Abraham to David, are fourteen generations. And from David to the transmigration of Babylon, are fourteen generations: and from the transmigration of Babylon to Christ are fourteen generations."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Christi autem generatio sic erat cum esset desponsata mater eius Maria Ioseph antequam convenirent inventa est in utero habens de Spiritu Sancto"
      en: "Now the generation of Christ was in this wise. When as his mother Mary was espoused to Joseph, before they came together, she was found with child, of the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ioseph autem vir eius cum esset iustus et nollet eam traducere voluit occulte dimittere eam"
      en: "Whereupon Joseph her husband, being a just man, and not willing publicly to expose her, was minded to put her away privately."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "haec autem eo cogitante ecce angelus Domini in somnis apparuit ei dicens Ioseph fili David noli timere accipere Mariam coniugem tuam quod enim in ea natum est de Spiritu Sancto est"
      en: "But while he thought on these things, behold the angel of the Lord appeared to him in his sleep, saying: Joseph, son of David, fear not to take unto thee Mary thy wife, for that which is conceived in her, is of the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "pariet autem filium et vocabis nomen eius Iesum ipse enim salvum faciet populum suum a peccatis eorum"
      en: "And she shall bring forth a son: and thou shalt call his name JESUS. For he shall save his people from their sins."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "hoc autem totum factum est ut adimpleretur id quod dictum est a Domino per prophetam dicentem"
      en: "Now all this was done that it might be fulfilled which the Lord spoke by the prophet, saying:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ecce virgo in utero habebit et pariet filium et vocabunt nomen eius Emmanuhel quod est interpretatum Nobiscum Deus"
      en: "Behold a virgin shall be with child, and bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "exsurgens autem Ioseph a somno fecit sicut praecepit ei angelus Domini et accepit coniugem suam"
      en: "And Joseph rising up from sleep, did as the angel of the Lord had commanded him, and took unto him his wife."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et non cognoscebat eam donec peperit filium suum primogenitum et vocavit nomen eius Iesum"
      en: "And he knew her not till she brought forth her firstborn son: and he called his name JESUS."
    status: { la: verified, en: verified }
