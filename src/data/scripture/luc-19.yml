# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 19
verses:
  - n: 1
    text:
      la: "Et ingressus perambulabat Jericho."
      en: "And entering in, he walked through Jericho."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et ecce vir nomine Zachaeus: et hic princeps erat publicanorum, et ipse dives:"
      en: "And behold, there was a man named Zacheus, who was the chief of the publicans, and he was rich."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et quaerebat videre Jesum, quis esset: et non poterat prae turba, quia statura pusillus erat."
      en: "And he sought to see Jesus who he was, and he could not for the crowd, because he was low of stature."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et praecurrens ascendit in arborem sycomorum ut videret eum: quia inde erat transiturus."
      en: "And running before, he climbed up into a sycamore tree, that he might see him; for he was to pass that way."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et cum venisset ad locum, suspiciens Jesus vidit illum, et dixit ad eum: Zachaee, festinans descende: quia hodie in domo tua oportet me manere."
      en: "And when Jesus was come to the place, looking up, he saw him, and said to him: Zacheus, make haste and come down; for this day I must abide in thy house."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et festinans descendit, et excepit illum gaudens."
      en: "And he made haste and came down; and received him with joy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et cum viderent omnes, murmurabant, dicentes quod ad hominem peccatorem divertisset."
      en: "And when all saw it, they murmured, saying, that he was gone to be a guest with a man that was a sinner."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Stans autem Zachaeus, dixit ad Dominum: Ecce dimidium bonorum meorum, Domine, do pauperibus: et si quid aliquem defraudavi, reddo quadruplum."
      en: "But Zacheus standing, said to the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have wronged any man of any thing, I restore him fourfold."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ait Jesus ad eum: Quia hodie salus domui huic facta est: eo quod et ipse filius sit Abrahae."
      en: "Jesus said to him: This day is salvation come to this house, because he also is a son of Abraham."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Venit enim Filius hominis quaerere, et salvum facere quod perierat."
      en: "For the Son of man is come to seek and to save that which was lost."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Haec illis audientibus adjiciens, dixit parabolam, eo quod esset prope Jerusalem: et quia existimarent quod confestim regnum Dei manifestaretur."
      en: "As they were hearing these things, he added and spoke a parable, because he was nigh to Jerusalem, and because they thought that the kingdom of God should immediately be manifested."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dixit ergo: Homo quidam nobilis abiit in regionem longinquam accipere sibi regnum, et reverti."
      en: "He said therefore: A certain nobleman went into a far country, to receive for himself a kingdom, and to return."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Vocatis autem decem servis suis, dedit eis decem mnas, et ait ad illos: Negotiamini dum venio."
      en: "And calling his ten servants, he gave them ten pounds, and said to them: Trade till I come."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cives autem ejus oderant eum: et miserunt legationem post illum, dicentes: Nolumus hunc regnare super nos."
      en: "But his citizens hated him: and they sent an embassage after him, saying: We will not have this man to reign over us."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et factum est ut rediret accepto regno: et jussit vocari servos, quibus dedit pecuniam, ut sciret quantum quisque negotiatus esset."
      en: "And it came to pass, that he returned, having received the kingdom: and he commanded his servants to be called, to whom he had given the money, that he might know how much every man had gained by trading."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Venit autem primus dicens: Domine, mna tua decem mnas acquisivit."
      en: "And the first came, saying: Lord, thy pound hath gained ten pounds."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ait illi: Euge bone serve, quia in modico fuisti fidelis, eris potestatem habens super decem civitates."
      en: "And he said to him: Well done, thou good servant, because thou hast been faithful in a little, thou shalt have power over ten cities."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et alter venit, dicens: Domine, mna tua fecit quinque mnas."
      en: "And the second came, saying: Lord, thy pound hath gained five pounds."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et huic ait: Et tu esto super quinque civitates."
      en: "And he said to him: Be thou also over five cities."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et alter venit, dicens: Domine, ecce mna tua, quam habui repositam in sudario:"
      en: "And another came, saying: Lord, behold here is thy pound, which I have kept laid up in a napkin;"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "timui enim te, quia homo austerus es: tollis quod non posuisti, et metis quod non seminasti."
      en: "For I feared thee, because thou art an austere man: thou takest up what thou didst not lay down, and thou reapest that which thou didst not sow."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dicit ei: De ore tuo te judico, serve nequam. Sciebas quod ego homo austerus sum, tollens quod non posui, et metens quod non seminavi:"
      en: "He saith to him: Out of thy own mouth I judge thee, thou wicked servant. Thou knewest that I was an austere man, taking up what I laid not down, and reaping that which I did not sow:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et quare non dedisti pecuniam meam ad mensam, ut ego veniens cum usuris utique exegissem illam?"
      en: "And why then didst thou not give my money into the bank, that at my coming, I might have exacted it with usury?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et astantibus dixit: Auferte ab illo mnam, et date illi qui decem mnas habet."
      en: "And he said to them that stood by: Take the pound away from him, and give it to him that hath ten pounds."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et dixerunt ei: Domine, habet decem mnas."
      en: "And they said to him: Lord, he hath ten pounds."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dico autem vobis, quia omni habenti dabitur, et abundabit: ab eo autem qui non habet, et quod habet auferetur ab eo."
      en: "But I say to you, that to every one that hath shall be given, and he shall abound: and from him that hath not, even that which he hath, shall be taken from him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Verumtamen inimicos meos illos, qui noluerunt me regnare super se, adducite huc: et interficite ante me."
      en: "But as for those my enemies, who would not have me reign over them, bring them hither, and kill them before me."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et his dictis, praecedebat ascendens Jerosolymam."
      en: "And having said these things, he went before, going up to Jerusalem."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et factum est, cum appropinquasset ad Bethphage et Bethaniam, ad montem qui vocatur Oliveti, misit duos discipulos suos,"
      en: "And it came to pass, when he was come nigh to Bethphage and Bethania, unto the mount called Olivet, he sent two of his disciples,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "dicens: Ite in castellum quod contra est: in quod introeuntes, invenietis pullum asinae alligatum, cui nemo umquam hominum sedit: solvite illum, et adducite."
      en: "Saying: Go into the town which is over against you, at your entering into which you shall find the colt of an ass tied, on which no man ever hath sitten: loose him, and bring him hither."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et si quis vos interrogaverit: Quare solvitis? sic dicetis ei: Quia Dominus operam ejus desiderat."
      en: "And if any man shall ask you: Why do you loose him? you shall say thus unto him: Because the Lord hath need of his service."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Abierunt autem qui missi erant: et invenerunt, sicut dixit illis, stantem pullum."
      en: "And they that were sent, went their way, and found the colt standing, as he had said unto them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Solventibus autem illis pullum, dixerunt domini ejus ad illos: Quid solvitis pullum?"
      en: "And as they were loosing the colt, the owners thereof said to them: Why loose you the colt?"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "At illi dixerunt: Quia Dominus eum necessarium habet."
      en: "But they said: Because the Lord hath need of him."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et duxerunt illum ad Jesum. Et jacentes vestimenta sua supra pullum, imposuerunt Jesum."
      en: "And they brought him to Jesus. And casting their garments on the colt, they set Jesus thereon."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Eunte autem illo, substernebant vestimenta sua in via:"
      en: "And as he went, they spread their clothes underneath in the way."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et cum appropinquaret jam ad descensum montis Oliveti, coeperunt omnes turbae discipulorum gaudentes laudare Deum voce magna super omnibus, quas viderant, virtutibus,"
      en: "And when he was now coming near the descent of mount Olivet, the whole multitude of his disciples began with joy to praise God with a loud voice, for all the mighty works they had seen,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "dicentes: Benedictus, qui venit rex in nomine Domini: pax in caelo, et gloria in excelsis."
      en: "Saying: Blessed be the king who cometh in the name of the Lord, peace in heaven, and glory on high!"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et quidam pharisaeorum de turbis dixerunt ad illum: Magister, increpa discipulos tuos."
      en: "And some of the Pharisees, from amongst the multitude, said to him: Master, rebuke thy disciples."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Quibus ipse ait: Dico vobis, quia si hi tacuerint, lapides clamabunt."
      en: "To whom he said: I say to you, that if these shall hold their peace, the stones will cry out."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et ut appropinquavit, videns civitatem flevit super illam, dicens:"
      en: "And when he drew near, seeing the city, he wept over it, saying:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Quia si cognovisses et tu, et quidem in hac die tua, quae ad pacem tibi: nunc autem abscondita sunt ab oculis tuis."
      en: "If thou also hadst known, and that in this thy day, the things that are to thy peace; but now they are hidden from thy eyes."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Quia venient dies in te: et circumdabunt te inimici tui vallo, et circumdabunt te: et coangustabunt te undique:"
      en: "For the days shall come upon thee, and thy enemies shall cast a trench about thee, and compass thee round, and straiten thee on every side,"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et ad terram prosternent te, et filios tuos, qui in te sunt, et non relinquent in te lapidem super lapidem: eo quod non cognoveris tempus visitationis tuae."
      en: "And beat thee flat to the ground, and thy children who are in thee: and they shall not leave in thee a stone upon a stone: because thou hast not known the time of thy visitation."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et ingressus in templum, coepit ejicere vendentes in illo, et ementes,"
      en: "And entering into the temple, he began to cast out them that sold therein, and them that bought."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "dicens illis: Scriptum est: Quia domus mea domus orationis est: vos autem fecistis illam speluncam latronum."
      en: "Saying to them: It is written: My house is the house of prayer. But you have made it a den of thieves."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et erat docens quotidie in templo. Principes autem sacerdotum, et scribae, et princeps plebis quaerebant illum perdere:"
      en: "And he was teaching daily in the temple. And the chief priests and the scribes and the rulers of the people sought to destroy him:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et non inveniebant quid facerent illi. Omnis enim populus suspensus erat, audiens illum."
      en: "And they found not what to do to him: for all the people were very attentive to hear him."
    status: { la: verified, en: verified }
