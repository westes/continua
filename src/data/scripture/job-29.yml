book: job
chapter: 29
verses:
  - n: 1
    text:
      la: "addidit quoque Iob adsumens parabolam suam et dixit"
      en: "Job also added, taking up his parable, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quis mihi tribuat ut sim iuxta menses pristinos secundum dies quibus Deus custodiebat me"
      en: "Who will grant me, that I might be according to the months past, according to the days in which God kept me?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quando splendebat lucerna eius super caput meum et ad lumen eius ambulabam in tenebris"
      en: "When his lamp shined over my head, and I walked by his light in darkness?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sicut fui in diebus adulescentiae meae quando secreto Deus erat in tabernaculo meo"
      en: "As I was in the days of my youth, when God was secretly in my tabernacle?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quando erat Omnipotens mecum et in circuitu meo pueri mei"
      en: "When the Almighty was with me: and my servants round about me?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quando lavabam pedes meos butyro et petra fundebat mihi rivos olei"
      en: "When I washed my feet with butter, and the rock poured me out rivers of oil?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quando procedebam ad portam civitatis et in platea parabant cathedram mihi"
      en: "When I went out to the gate of the city, and in the street they prepared me a chair?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "videbant me iuvenes et abscondebantur et senes adsurgentes stabant"
      en: "The young men saw me, and hid themselves: and the old men rose up and stood."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "principes cessabant loqui et digitum superponebant ori suo"
      en: "The princes ceased to speak, and laid the finger on their mouth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vocem suam cohibebant duces et lingua eorum gutturi suo adherebat"
      en: "The rulers held their peace, and their tongue cleaved to their throat."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "auris audiens beatificabat me et oculus videns testimonium reddebat mihi"
      en: "The ear that heard me blessed me, and the eye that saw me gave witness to me:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quod liberassem pauperem vociferantem et pupillum cui non esset adiutor"
      en: "Because I had delivered the poor man that cried out; and the fatherless that had no helper."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "benedictio perituri super me veniebat et cor viduae consolatus sum"
      en: "The blessing of him that was ready to perish came upon me, and I comforted the heart of the widow."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "iustitia indutus sum et vestivit me sicut vestimento et diademate iudicio meo"
      en: "I was clad with justice: and I clothed myself with my judgment, as with a robe and a diadem."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "oculus fui caeco et pes claudo"
      en: "I was an eye to the blind, and a foot to the lame."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "pater eram pauperum et causam quam nesciebam diligentissime investigabam"
      en: "I was the father of the poor: and the cause which I knew not, I searched out most diligently."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "conterebam molas iniqui et de dentibus illius auferebam praedam"
      en: "I broke the jaws of the wicked man, and out of his teeth I took away the prey."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dicebamque in nidulo meo moriar et sicut palma multiplicabo dies"
      en: "And I said: I shall die in my nest, and as a palm tree shall multiply my days."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "radix mea aperta est secus aquas et ros morabitur in messione mea"
      en: "My root is opened beside the waters, and dew shall continue in my harvest."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "gloria mea semper innovabitur et arcus meus in manu mea instaurabitur"
      en: "My glory shall always be renewed, and my bow in my hand shall be repaired."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui me audiebant expectabant sententiam et intenti tacebant ad consilium meum"
      en: "They that heard me, waited for my sentence, and being attentive held their peace at my counsel."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "verbis meis addere nihil audebant et super illos stillabat eloquium meum"
      en: "To my words they durst add nothing, and my speech dropped upon them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "expectabant me sicut pluviam et os suum aperiebant quasi ad imbrem serotinum"
      en: "They waited for me as for rain, and they opened their mouth as for a latter shower."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "si quando ridebam ad eos non credebant et lux vultus mei non cadebat in terram"
      en: "If at any time I laughed on them, they believed not, and the light of my countenance fell not on earth."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "si voluissem ire ad eos sedebam primus cumque sederem quasi rex circumstante exercitu eram tamen maerentium consolator"
      en: "If I had a mind to go to them, I sat first, and when I sat as a king, with his army standing about him, yet I was a comforter of them that mourned."
    status: { la: verified, en: verified }
