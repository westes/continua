# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 5
verses:
  - n: 1
    text:
      la: "fili mi adtende sapientiam meam et prudentiae meae inclina aurem tuam"
      en: "My son, attend to my wisdom, and incline thy ear to my prudence."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ut custodias cogitationes et disciplinam labia tua conservent"
      en: "That thou mayst keep thoughts, and thy lips may preserve instruction. Mind not the deceit of a woman."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "favus enim stillans labia meretricis et nitidius oleo guttur eius"
      en: "For the lips of a harlot are like a honeycomb dropping, and her throat is smoother than oil."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "novissima autem illius amara quasi absinthium et acuta quasi gladius biceps"
      en: "But her end is bitter as wormwood, and sharp as a two-edged sword."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "pedes eius descendunt in mortem et ad inferos gressus illius penetrant"
      en: "Her feet go down into death, and her steps go in as far as hell."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "per semitam vitae non ambulat vagi sunt gressus eius et investigabiles"
      en: "They walk not by the path of life, her steps are wandering, and unaccountable."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nunc ergo fili audi me et ne recedas a verbis oris mei"
      en: "Now therefore, my son, hear me, and depart not from the words of my mouth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "longe fac ab ea viam tuam et ne adpropinques foribus domus eius"
      en: "Remove thy way far from her, and come not nigh the doors of her house."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ne des alienis honorem tuum et annos tuos crudeli"
      en: "Give not thy honour to strangers, and thy years to the cruel."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ne forte impleantur extranei viribus tuis et labores tui sint in domo aliena"
      en: "Lest strangers be filled with thy strength, and thy labours be in another man's house,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et gemas in novissimis quando consumpseris carnes et corpus tuum et dicas"
      en: "And thou mourn it the last, when thou shalt have spent thy flesh and thy body, and say:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cur detestatus sum disciplinam et increpationibus non adquievit cor meum"
      en: "Why have I hated instruction, and my heart consented not to reproof,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nec audivi vocem docentium me et magistris non inclinavi aurem meam"
      en: "And have not heard the voice of them that taught me, and have not in- dined my ear to masters?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "paene fui in omni malo in medio ecclesiae et synagogae"
      en: "I have almost been in all evil, in the midst of the church and of the congregation."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "bibe aquam de cisterna tua et fluenta putei tui"
      en: "Drink water out of thy own cistern, and the streams of thy own well:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "deriventur fontes tui foras et in plateis aquas tuas divide"
      en: "Let thy fountains be conveyed abroad, and in the streets divide thy waters."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "habeto eas solus nec sint alieni participes tui"
      en: "Keep them to thyself alone, neither let strangers be partakers with thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sit vena tua benedicta et laetare cum muliere adulescentiae tuae"
      en: "Let thy vein be blessed, and rejoice with the wife of thy youth:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cerva carissima et gratissimus hinulus ubera eius inebrient te omni tempore in amore illius delectare iugiter"
      en: "Let her be thy dearest hind, and most agreeable fawn: let her breasts inebriate thee at all times; he thou delighted continually with her love."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quare seduceris fili mi ab aliena et foveris sinu alterius"
      en: "Why art thou seduced, my son, by a strange woman, and art cherished in the bosom of another ?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "respicit Dominus vias hominis et omnes gressus illius considerat"
      en: "The Lord beholdeth the ways of man, and considereth all his steps."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "iniquitates suae capiunt impium et funibus peccatorum suorum constringitur"
      en: "His own iniquities catch the wicked, and he is fast bound with the ropes of his own sins."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ipse morietur quia non habuit disciplinam et multitudine stultitiae suae decipietur"
      en: "He shall die, because he hath not received instruction, and in the multitude of his folly he shall be deceived."
    status: { la: verified, en: verified }
