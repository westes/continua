# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1cor
chapter: 7
verses:
  - n: 1
    text:
      la: "de quibus autem scripsistis bonum est homini mulierem non tangere"
      en: "Now concerning the thing whereof you wrote to me: It is good for a man not to touch a woman."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "propter fornicationes autem unusquisque suam uxorem habeat et unaquaeque suum virum habeat"
      en: "But for fear of fornication, let every man have his own wife, and let every woman have her own husband."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "uxori vir debitum reddat similiter autem et uxor viro"
      en: "Let the husband render the debt to his wife, and the wife also in like manner to the husband."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "mulier sui corporis potestatem non habet sed vir similiter autem et vir sui corporis potestatem non habet sed mulier"
      en: "The wife hath not power of her own body, but the husband. And in like manner the husband also hath not power of his own body, but the wife."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nolite fraudare invicem nisi forte ex consensu ad tempus ut vacetis orationi et iterum revertimini in id ipsum ne temptet vos Satanas propter incontinentiam vestram"
      en: "Defraud not one another, except, perhaps, by consent, for a time, that you may give yourselves to prayer; and return together again, lest Satan tempt you for your incontinency."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "hoc autem dico secundum indulgentiam non secundum imperium"
      en: "But I speak this by indulgence, not by commandment."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "volo autem omnes homines esse sicut me ipsum sed unusquisque proprium habet donum ex Deo alius quidem sic alius vero sic"
      en: "For I would that all men were even as myself: but every one hath his proper gift from God; one after this manner, and another after that."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dico autem non nuptis et viduis bonum est illis si sic maneant sicut et ego"
      en: "But I say to the unmarried, and to the widows: It is good for them if they so continue, even as I."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quod si non se continent nubant melius est enim nubere quam uri"
      en: "But if they do not contain themselves, let them marry. For it is better to marry than to be burnt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "his autem qui matrimonio iuncti sunt praecipio non ego sed Dominus uxorem a viro non discedere"
      en: "But to them that are married, not I but the Lord commandeth, that the wife depart not from her husband."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quod si discesserit manere innuptam aut viro suo reconciliari et vir uxorem ne dimittat"
      en: "And if she depart, that she remain unmarried, or be reconciled to her husband. And let not the husband put away his wife."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nam ceteris ego dico non Dominus si quis frater uxorem habet infidelem et haec consentit habitare cum illo non dimittat illam"
      en: "For to the rest I speak, not the Lord. If any brother hath a wife that believeth not, and she consent to dwell with him, let him not put her away."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et si qua mulier habet virum infidelem et hic consentit habitare cum illa non dimittat virum"
      en: "And if any woman hath a husband that believeth not, and he consent to dwell with her, let her not put away her husband."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sanctificatus est enim vir infidelis in muliere fideli et sanctificata est mulier infidelis per virum fidelem alioquin filii vestri inmundi essent nunc autem sancti sunt"
      en: "For the unbelieving husband is sanctified by the believing wife; and the unbelieving wife is sanctified by the believing husband: otherwise your children should be unclean; but now they are holy."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quod si infidelis discedit discedat non est enim servituti subiectus frater aut soror in eiusmodi in pace autem vocavit nos Deus"
      en: "But if the unbeliever depart, let him depart. For a brother or sister is not under servitude in such cases. But God hath called us in peace."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "unde enim scis mulier si virum salvum facies aut unde scis vir si mulierem salvam facies"
      en: "For how knowest thou, O wife, whether thou shalt save thy husband ? Or how knowest thou, O man, whether thou shalt save thy wife ?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nisi unicuique sicut divisit Dominus unumquemque sicut vocavit Deus ita ambulet et sic in omnibus ecclesiis doceo"
      en: "But as the Lord hath distributed to every one, as God hath called every one, so let him walk: and so in all churches I teach."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "circumcisus aliquis vocatus est non adducat praeputium in praeputio aliquis vocatus est non circumcidatur"
      en: "Is any man called, being circumcised ? let him not procure uncircumcision. Is any man called in uncircumcision ? let him not be circumcised."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "circumcisio nihil est et praeputium nihil est sed observatio mandatorum Dei"
      en: "Circumcision is nothing, and uncircumcision is nothing: but the observance of the commandments of God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "unusquisque in qua vocatione vocatus est in ea permaneat"
      en: "Let every man abide in the same calling in which he was called."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "servus vocatus es non sit tibi curae sed et si potes liber fieri magis utere"
      en: "Wast thou called, being a bondman ? care not for it; but if thou mayest be made free, use it rather."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui enim in Domino vocatus est servus libertus est Domini similiter qui liber vocatus est servus est Christi"
      en: "For he that is called in the Lord, being a bondman, is the freeman of the Lord. Likewise he that is called, being free, is the bondman of Christ."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "pretio empti estis nolite fieri servi hominum"
      en: "You are bought with a price; be not made the bondslaves of men."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "unusquisque in quo vocatus est fratres in hoc maneat apud Deum"
      en: "Brethren, let every man, wherein he was called, therein abide with God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "de virginibus autem praeceptum Domini non habeo consilium autem do tamquam misericordiam consecutus a Domino ut sim fidelis"
      en: "Now concerning virgins, I have no commandment of the Lord; but I give counsel, as having obtained mercy of the Lord, to be faithful."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "existimo ergo hoc bonum esse propter instantem necessitatem quoniam bonum est homini sic esse"
      en: "I think therefore that this is good for the present necessity, that it is good for a man so to be."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "alligatus es uxori noli quaerere solutionem solutus es ab uxore noli quaerere uxorem"
      en: "Art thou bound to a wife ? seek not to be loosed. Art thou loosed from a wife ? seek not a wife."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "si autem acceperis uxorem non peccasti et si nupserit virgo non peccavit tribulationem tamen carnis habebunt huiusmodi ego autem vobis parco"
      en: "But if thou take a wife, thou hast not sinned. And if a virgin marry, she hath not sinned: nevertheless, such shall have tribulation of the flesh. But I spare you."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "hoc itaque dico fratres tempus breve est reliquum est ut qui habent uxores tamquam non habentes sint"
      en: "This therefore I say, brethren; the time is short; it remaineth, that they also who have wives, be as if they had none;"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et qui flent tamquam non flentes et qui gaudent tamquam non gaudentes et qui emunt tamquam non possidentes"
      en: "And they that weep, as though they wept not; and they that rejoice, as if they rejoiced not; and they that buy, as though they possessed not;"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et qui utuntur hoc mundo tamquam non utantur praeterit enim figura huius mundi"
      en: "And they that use this world, as if they used it not: for the fashion of this world passeth away."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "volo autem vos sine sollicitudine esse qui sine uxore est sollicitus est quae Domini sunt quomodo placeat Deo"
      en: "But I would have you to be without solicitude. He that is without a wife, is solicitous for the things that belong to the Lord, how he may please God."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "qui autem cum uxore est sollicitus est quae sunt mundi quomodo placeat uxori et divisus est"
      en: "But he that is with a wife, is solicitous for the things of the world, how he may please his wife: and he is divided."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et mulier innupta et virgo cogitat quae Domini sunt ut sit sancta et corpore et spiritu quae autem nupta est cogitat quae sunt mundi quomodo placeat viro"
      en: "And the unmarried woman and the virgin thinketh on the things of the Lord, that she may be holy both in body and in spirit. But she that is married thinketh on the things of the world, how she may please her husband."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "porro hoc ad utilitatem vestram dico non ut laqueum vobis iniciam sed ad id quod honestum est et quod facultatem praebeat sine inpedimento Dominum observandi"
      en: "And this I speak for your profit: not to cast a snare upon you; but for that which is decent, and which may give you power to attend upon the Lord, without impediment."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "si quis autem turpem se videri existimat super virgine sua quod sit superadulta et ita oportet fieri quod vult faciat non peccat nubat"
      en: "But if any man think that he seemeth dishonoured, with regard to his virgin, for that she is above the age, and it must so be: let him do what he will; he sinneth not, if she marry."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "nam qui statuit in corde suo firmus non habens necessitatem potestatem autem habet suae voluntatis et hoc iudicavit in corde suo servare virginem suam bene facit"
      en: "For he that hath determined being steadfast in his heart, having no necessity, but having power of his own will; and hath judged this in his heart, to keep his virgin, doth well."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "igitur et qui matrimonio iungit virginem suam bene facit et qui non iungit melius facit"
      en: "Therefore, both he that giveth his virgin in marriage, doth well; and he that giveth her not, doth better."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "mulier alligata est quanto tempore vir eius vivit quod si dormierit vir eius liberata est cui vult nubat tantum in Domino"
      en: "A woman is bound by the law as long as her husband liveth; but if her husband die, she is at liberty: let her marry to whom she will; only in the Lord."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "beatior autem erit si sic permanserit secundum meum consilium puto autem quod et ego Spiritum Dei habeo"
      en: "But more blessed shall she be, if she so remain, according to my counsel; and I think that I also have the spirit of God."
    status: { la: verified, en: verified }
