# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 21
verses:
  - n: 1
    text:
      la: "Facta est quoque fames in diebus David tribus annis jugiter: et consuluit David oraculum Domini. Dixitque Dominus: Proper Saul, et domum ejus sanguinum, quia occidit Gabaonitas."
      en: "And there was a famine in the days of David for three years successively: and David consulted the oracle of the Lord. And the Lord said: It is for Saul, and his bloody house, because he slew the Gabaonites."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Vocatis ergo Gabaonitis rex, dixit ad eos ( porro Gabaonitae non erant de filiis Israel, sed reliquiae Amorrhaeorum: filii quippe Israel juraverunt eis, et voluit Saul percutere eos zelo, quasi pro filiis Israel et Juda),"
      en: "Then the king, calling for the Gabaonites, said to them: (Now the Gabaonites were not of the children of Israel, but the remains of the Amorrhites: I and the children of Israel had sworn to them, and Saul sought to slay them out of zeal, as it were for the children of Israel and Juda:)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixit ergo David ad Gabaonitas: Quid faciam vobis? et quod erit vestri piaculum, ut benedicatis haereditati Domini?"
      en: "David therefore said to the Gabaonites: What shall I do for you? and what shall be the atonement for you, that you may bless the inheritance of the Lord?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixeruntque ei Gabaonitae: Non est nobis super argento et auro quaestio, sed contra Saul, et contra domum ejus: neque volumus ut interficiatur homo de Israel. Ad quos rex ait: Quid ergo vultis ut faciam vobis?"
      en: "And the Gabaonites said to him: We have no contest about silver and gold, but against Saul and against his house: neither do we desire that any man be slain of Israel. And the king said to them: What will you then that I should do for you?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui dixerunt regi: Virum, qui attrivit nos et oppressit inique, ita delere debemus, ut ne unus quidem residuus sit de stirpe ejus in cunctis finibus Israel."
      en: "And they said to the king: The man that crushed us and oppressed us unjustly, we must destroy in such manner that there be not so much as one left of his stock in all the coasts of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dentur nobis septem viri de filiis ejus, ut crucifigamus eos Domino in Gabaa Saul, quondam electi Domini. Et ait rex: Ego dabo."
      en: "Let seven men of his children be delivered unto us, that we may crucify them to the Lord in Gabaa of Saul, once the chosen of the Lord. And the king said: I will give them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Pepercitque rex Miphiboseth filio Jonathae filii Saul, propter jusjurandum Domini, quod fuerat inter David et inter Jonathan filium Saul."
      en: "And the king spared Miphiboseth the son of Jonathan the son of Saul, because of the oath of the Lord, that had been between David and Jonathan the son of Saul."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Tulit itaque rex duos filios Respha filiae Aja, quos peperit Sauli, Armoni, et Miphiboseth: et quinque filios Michol filiae Saul, quos genuerat Hadrieli filio Berzellai, qui fuit de Molathi,"
      en: "So the king took the two sons of Respha the daughter of Aia, whom she bore to Saul, Armoni, and Miphiboseth: and the five sons of Michol the daughter of Saul, whom she bore to Hadriel the son of Berzellai, that was of Molathi:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dedit eos in manus Gabaonitarum: qui crucifixerunt eos in monte coram Domino: et ceciderunt hi septem simul occisi in diebus messis primis, incipiente messione hordei."
      en: "And gave them into the hands of the Gabaonites: and they crucified them on a hill before the Lord: and these seven died together in the first days of the harvest, when the barley began to be reaped."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Tollens autem Respha filia Aja cilicium, substravit sibi supra petram ab initio messis, donec stillaret aqua super eos de caelo: et non dimisit aves lacerare eos per diem, neque bestias per noctem."
      en: "And Respha the daughter of Aia took haircloth, and spread it under her upon the rock from the beginning of the harvest, till water dropped upon them out of heaven: and suffered neither the birds to tear them by day, nor the beasts by night."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et nuntiata sunt David quae fecerat Respha, filia Aja, concubina Saul."
      en: "And it was told David, what Respha the daughter of Aia, the concubine of Saul, had done."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et abiit David, et tulit ossa Saul, et ossa Jonathae filii ejus, a viris Jabes Galaad, qui furati fuerant ea de platea Bethsan, in qua suspenderant eos Philisthiim cum interfecissent Saul in Gelboe:"
      en: "And David went, and took the bones of Saul, and the bones of Jonathan his son from the men of Jabes Galaad, who had stolen them from the street of Bethsan, where the Philistines had hanged them when they had slain Saul in Gelboe."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et asportavit inde ossa Saul, et ossa Jonathae filii ejus: et colligentes ossa eorum qui affixi fuerant,"
      en: "And he brought from thence the bones of Saul, and the bones of Jonathan his son, and they gathered up the bones of them that were crucified,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sepelierunt ea cum ossibus Saul et Jonathae filii ejus in terra Benjamin, in latere, in sepulchro Cis patris ejus: feceruntque omnia, quae praeceperat rex, et repropitiatus est Deus terrae post haec."
      en: "And they buried them with the bones of Saul, and of Jonathan his son in the land of Benjamin, in the side, in the sepulchre of Cis his father: and they did all that the king had commanded, and God shewed mercy again to the land after these things."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Factum est autem rursum praelium Philisthinorum adversum Israel, et descendit David, et servi ejus cum eo, et pugnabant contra Philisthiim. Deficiente autem David,"
      en: "And the Philistines made war again against Israel, and David went down, and his servants with him, and fought against the Philistines. And David growing faint,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Jesbibenob, qui fuit de genere Arapha, cujus ferrum hastae trecentas uncias appendebat, et accinctus erat ense novo, nisus est percutere David."
      en: "Jesbibenob, who was of the race of Arapha, the iron of whose spear weighed three hundred ounces, being girded with a new sword, attempted to kill David."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Praesidioque ei fuit Abisai filius Sarviae et percussum Philisthaeum interfecit. Tunc juraverunt viri David, dicentes: Jam non egredieris nobiscum in bellum, ne extinguas lucernam Israel."
      en: "And Abisai the son of Sarvia rescued him, and striking the Philistine killed him. Then David's men swore unto him, saying: Thou shalt go no more out with us to battle, lest thou put out the lamp of Israel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Secundum quoque bellum fuit in Gob contra Philisthaeos: tunc percussit Sobochai et Husati, Saph de stirpe Arapha de genere gigantum."
      en: "There was also a second battle in Gob against the Philistines: then Sobochai of Husathi slew Saph of the race of Arapha of the family of the giants."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tertium quoque fuit bellum in Gob contra Philisthaeos, in quo percussit Adeodatus filius Saltus polymitarius Bethlehemites Goliath Gethaeum, cujus hastile hastae erat quasi liciatorium texentium."
      en: "And there was a third battle in Gob against the Philistines, in which Adeodatus the son of the Forrest an embroiderer of Bethlehem slew Goliath the Gethite, the shaft of whose spear was like a weaver's beam."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quartum bellum fuit in Geth: in quo vir fuit excelsus, qui senos in manibus pedibusque habebat digitos, id est, viginti quatuor, et erat de origine Arapha."
      en: "A fourth battle was in Geth. where there was a man of great stature, that had six fingers on each hand, and six toes on each foot, four and twenty in all, and he was of the race of Arapha."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et blasphemavit Israel: percussit autem eum Jonathan filius Samaa fratris David."
      en: "And he reproached Israel: and Jonathan the son of Samae the brother of David slew him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Hi quatuor nati sunt de Arapha in Geth, et ceciderunt in manu David et servorum ejus."
      en: "These four were born of Arapha in Geth, and they fell by the hand of David, and of his servants."
    status: { la: verified, en: verified }
