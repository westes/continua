# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 15
verses:
  - n: 1
    text:
      la: "respondens autem Eliphaz Themanites dixit"
      en: "And Eliphaz the Themanite, answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "numquid sapiens respondebit quasi in ventum loquens et implebit ardore stomachum suum"
      en: "Will a wise man answer as if he were speaking in the wind, and fill his stomach with burning heat?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "arguis verbis eum qui non est aequalis tui et loqueris quod tibi non expedit"
      en: "Thou reprovest him by words, who is not equal to thee, and thou speakest that which is not good for thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quantum in te est evacuasti timorem et tulisti preces coram Deo"
      en: "As much as is in thee, thou hast made void fear, and hast taken away prayers from before God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "docuit enim iniquitas tua os tuum et imitaris linguam blasphemantium"
      en: "For thy iniquity hath taught thy mouth, and thou imitatest the tongue of blasphemers."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "condemnabit te os tuum et non ego et labia tua respondebunt tibi"
      en: "Thy own mouth shall condemn thee, and not I: and thy own lips shall answer thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "numquid primus homo tu natus es et ante colles formatus"
      en: "Art thou the first man that was born, or wast thou made before the hills ?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "numquid consilium Dei audisti et inferior te erit eius sapientia"
      en: "Hast thou heard God's counsel, and shall his wisdom be inferior to thee?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quid nosti quod ignoremus quid intellegis quod nesciamus"
      en: "What knowest thou that we are ignorant of? what dost thou understand that we know not?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et senes et antiqui sunt in nobis multo vetustiores quam patres tui"
      en: "There are with us also aged and ancient men, much elder than thy fathers."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "numquid grande est ut consoletur te Deus sed verba tua prava hoc prohibent"
      en: "Is it a great matter that God should comfort thee? but thy wicked words hinder this."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quid te elevat cor tuum et quasi magna cogitans adtonitos habes oculos"
      en: "Why doth thy heart elevate thee, and why dost thou stare with thy eyes, as if they were thinking great things ?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quid tumet contra Deum spiritus tuus ut proferas de ore huiuscemodi sermones"
      en: "Why doth thy spirit swell against God, to utter such words out of thy mouth ?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quid est homo ut inmaculatus sit et ut iustus appareat natus de muliere"
      en: "What is man that he should be without spot, and he that is born of a woman that he should appear just?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ecce inter sanctos eius nemo inmutabilis et caeli non sunt mundi in conspectu eius"
      en: "Behold among his saints none is unchangeable, and the heavens are not pure in his sight."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quanto magis abominabilis et inutilis homo qui bibit quasi aquas iniquitatem"
      en: "How much more is man abominable, and unprofitable, who drinketh iniquity like water?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ostendam tibi audi me quod vidi narrabo tibi"
      en: "I will shew thee, hear me : and I mill tell thee what I have seen."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sapientes confitentur et non abscondunt patres suos"
      en: "Wise men confess and hide not their fathers."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quibus solis data est terra et non transibit alienus per eos"
      en: "To whom alone the earth was given, and no stranger hath passed among them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "cunctis diebus suis impius superbit et numerus annorum incertus est tyrannidis eius"
      en: "The wicked man is proud all his days, and the number of the years of his tyranny is uncertain."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sonitus terroris semper in auribus illius et cum pax sit ille insidias suspicatur"
      en: "The sound of dread is always in his ears: and when there is peace, he always suspecteth treason."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non credit quod reverti possit de tenebris circumspectans undique gladium"
      en: "He believeth not that he may return from darkness to light, looking round about for the sword on every side."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "cum se moverit ad quaerendum panem novit quod paratus sit in manu eius tenebrarum dies"
      en: "When he moveth himself to seek bread, he knoweth that the day of darkness is ready at his hand."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "terrebit eum tribulatio et angustia vallabit eum sicut regem qui praeparatur ad proelium"
      en: "Tribulation shall terrify him, and distress shall surround him, as a king that is prepared for the battle."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "tetendit enim adversus Deum manum suam et contra Omnipotentem roboratus est"
      en: "For he hath stretched out his hand against God, and hath strengthened himself against the Almighty."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cucurrit adversus eum erecto collo et pingui cervice armatus est"
      en: "He hath run against him with his neck raised up, and is armed with a fat neck."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "operuit faciem eius crassitudo et de lateribus eius arvina dependet"
      en: "Fatness hath covered his face, and the fat hangeth down on his sides."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "habitavit in civitatibus desolatis et in domibus desertis quae in tumulos sunt redactae"
      en: "He hath dwelt in desolate cities, and in desert houses that are reduced into heaps."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "non ditabitur nec perseverabit substantia eius nec mittet in terra radicem suam"
      en: "He shall not be enriched, neither shall his substance continue, neither shall he push his root in the earth."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "non recedet de tenebris ramos eius arefaciet flamma et auferetur spiritu oris sui"
      en: "He shall not depart out of darkness: the flame shall dry up his branches, and he shall be taken away by the breath of his own month."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "non credat frustra errore deceptus quod aliquo pretio redimendus sit"
      en: "He shall not believe, being vainly deceived by error, that he may be redeemed with any price."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "antequam dies eius impleantur peribit et manus eius arescet"
      en: "Before his days be full he shall perish: and his hands shall wither away."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "laedetur quasi vinea in primo flore botrus eius et quasi oliva proiciens florem suum"
      en: "He shall be blasted as a vine when its grapes are in the first flower, and as an olive tree that casteth its flower."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "congregatio enim hypocritae sterilis et ignis devorabit tabernacula eorum qui munera libenter accipiunt"
      en: "For the congregation of the hypocrite is barren, and fire shall devour their tabernacles, who love to take bribes."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "concepit dolorem et peperit iniquitatem et uterus eius praeparat dolos"
      en: "He hath conceived sorrow, and hath brought forth iniquity, and his womb prepareth deceits."
    status: { la: verified, en: verified }
