# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 12
verses:
  - n: 1
    text:
      la: "tunc iussit eam introire ubi repositi erant thesauri eius et iussit illic manere eam et constituit quid daretur illi de convivio suo"
      en: "Then he ordered that she should go in where his treasures were laid up, and bade her tarry there, and he appointed what should be given her from his own table."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cui respondens Iudith dixit nunc non potero manducare ex his quae mihi praecipis tribui ne veniat super me offensio ex his autem quae mihi detuli manducabo"
      en: "And Judith answered him and said: Now I cannot eat of these things which thou commandest to be given me, lest sin come upon me: but I will eat of the things which I have brought."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cui Holofernis ait si defecerint tibi ista quae tecum detulisti quid faciemus tibi"
      en: "And Holofernes said to her: If these things which thou hast brought with thee fail thee, what shall we do for thee?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dixit Iudith vivit anima tua domine meus quoniam non expendet omnia haec ancilla tua donec faciat Deus in manu mea haec quae cogitavi et induxerunt illam servi eius in tabernaculo quo praeceperat"
      en: "And Judith said: As thy soul liveth, my lord, thy handmaid shall not spend all these things till God do by my hand that which I have purposed. And his servants brought her into the tent which he had commanded."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et petiit dum introiret ut daretur ei copia nocte et ante lucem egrediendi foras ad orationem et deprecandi Dominum"
      en: "And when she was going in, she desired that she might have liberty to go out at night and before day to prayer, and to beseech the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et praecepit cubiculariis suis ut sicut placeret illi exiret et introiret ad orandum Deum suum per triduum"
      en: "And he commanded his chamberlains, that she might go out and in, to adore her God as she pleased, for three days."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et exiebat noctibus in vallem Bethuliae et baptizabat se in fontem aquae"
      en: "And she went out in the nights into the valley of Bethulia, and washed herself in a fountain of water."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et ut ascendebat orabat Dominum Deum Israhel ut dirigeret viam eius ad liberationem populi sui"
      en: "And as she came up, she prayed to the Lord the God of Israel, that he would direct her way to the deliverance of his people."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et introiens munda manebat in tabernaculum usque dum acciperet escam suam in vesperam"
      en: "And going in, she remained pure in the tent, until she took her own meat in the evening."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et factum est quarto die Holofernis fecit cenam servis suis et dixit ad Bagao eunuchum vade et suade Hebraeam illam ut sponte consentiat habitare mecum"
      en: "And it came to pass on the fourth day, that Holofernes made a supper for his servants, and said to Vagao his eunuch: so, and persuade that Hebrew woman, to consent of her own accord to dwell with me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "foedum est enim apud Assyrios si femina inrideat virum agendo ut inmunis transeat ab eo"
      en: "For it is looked upon as shameful among the Assyrians, if a woman mock a man, by doing so as to pass free from him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tunc introivit Bagao ad Iudith et dixit non vereatur bona puella introire ad dominum meum ut honorificetur ante faciem eius et manducet cum eo et bibat vinum in iucunditate"
      en: "Then Vagao went in to Judith, and said: Let not my good maid be afraid to go in to my lord, that she may be honoured before his face, that she may eat with him and drink wine and be merry."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cui Iudith respondit quae ego sum ut contradicam domino meo"
      en: "And Judith answered him: Who am I, that I should gainsay my lord?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "omne quod erit ante oculos eius bonum et optimum faciam quicquid autem illi placuerit hoc mihi erit optimum omnibus diebus vitae meae"
      en: "All that shall be good and best before his eyes, I will do. And whatsoever shall please him, that shall be best to me all the days of my life."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et surrexit et ornavit se vestimento suo et ingressa stetit ante faciem eius"
      en: "And she arose and dressed herself out with her garments, and going in she stood before his face."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cor autem Holofernis concussum est erat enim ardens in concupiscentia eius"
      en: "And the heart of Holofernes was smitten, for he was burning with the desire of her."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et dixit ad eam Holofernis bibe nunc et accumbe in iucunditate quoniam gratiam invenisti coram me"
      en: "And Holofernes said to her: Drink now, and sit down and be merry for thou hast found favour before me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et dixit Iudith bibam domine quoniam magnificata est anima mea hodie prae omnibus diebus meis"
      en: "And Judith said: I will drink my lord, because my life is magnified this day above all my days."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et accepit et manducavit et bibit coram ipso ea quae paraverat illi ancilla eius"
      en: "And she took and ate and drank before him what her maid had prepared for her."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et iucundus factus est Holofernis ad illam bibitque vinum nimis multum quantum numquam biberat in vita sua"
      en: "And Holofernes was made merry on her occasion, and drank exceeding much wine, so much as he had never drunk in his life."
    status: { la: verified, en: verified }
