# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 15
verses:
  - n: 1
    text:
      la: "Ego sum vitis vera, et Pater meus agricola est."
      en: "I am the true vine; and my Father is the husbandman."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Omnem palmitem in me non ferentem fructum, tollet eum, et omnem qui fert fructum, purgabit eum, ut fructum plus afferat."
      en: "Every branch in me, that beareth not fruit, he will take away: and every one that beareth fruit, he will purge it, that it may bring forth more fruit."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Jam vos mundi estis propter sermonem quem locutus sum vobis."
      en: "Now you are clean by reason of the word, which I have spoken to you."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Manete in me, et ego in vobis. Sicut palmes non potest fere fructum a semetipso, nisi manserit in vite, sic nec vos, nisi in me manseritis."
      en: "Abide in me, and I in you. As the branch cannot bear fruit of itself, unless it abide in the vine, so neither can you, unless you abide in me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ego sum vitis, vos palmites: qui manet in me, et ego in eo, hic fert fructum multum, quia sine me nihil potestis facere."
      en: "I am the vine: you the branches: he that abideth in me, and I in him, the same beareth much fruit: for without me you can do nothing."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Si quis in me non manserit, mittetur foras sicut palmes, et arescet, et colligent eum, et in ignem mittent, et ardet."
      en: "If any one abide not in me, he shall be cast forth as a branch, and shall wither, and they shall gather him up, and cast him into the fire, and he burneth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Si manseritis in me, et verba mea in vobis manserint, quodcumque volueritis petetis, et fiet vobis."
      en: "If you abide in me, and my words abide in you, you shall ask whatever you will, and it shall be done unto you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "In hoc clarificatus est Pater meus, ut fructum plurimum afferatis, et efficiamini mei discipuli."
      en: "In this is my Father glorified; that you bring forth very much fruit, and become my disciples."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sicut dilexit me Pater, et ego dilexi vos. Manete in dilectione mea."
      en: "As the Father hath loved me, I also have loved you. Abide in my love."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si praecepta mea servaveritis, manebitis in dilectione mea, sicut et ego Patris mei praecepta servavi, et maneo in ejus dilectione."
      en: "If you keep my commandments, you shall abide in my love; as I also have kept my Father's commandments, and do abide in his love."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Haec locutus sum vobis: ut gaudium meum in vobis sit, et gaudium vestrum impleatur."
      en: "These things I have spoken to you, that my joy may be in you, and your joy may be filled."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Hoc est praeceptum meum, ut diligatis invicem, sicut dilexi vos."
      en: "This is my commandment, that you love one another, as I have loved you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Majorem hac dilectionem nemo habet, ut animam suam ponat qui pro amicis suis."
      en: "Greater love than this no man hath, that a man lay down his life for his friends."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Vos amici mei estis, si feceritis quae ego praecipio vobis."
      en: "You are my friends, if you do the things that I command you."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Jam non dicam vos servos: quia servus nescit quid faciat dominus ejus. Vos autem dixi amicos: quia omnia quaecumque audivi a Patre meo, nota feci vobis."
      en: "I will not now call you servants: for the servant knoweth not what his lord doth. But I have called you friends: because all things whatsoever I have heard of my Father, I have made known to you."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non vos me elegistis, sed ego elegi vos, et posui vos ut eatis, et fructum afferatis, et fructus vester maneat: ut quodcumque petieritis Patrem in nomine meo, det vobis."
      en: "You have not chosen me: but I have chosen you; and have appointed you, that you should go, and should bring forth fruit; and your fruit should remain: that whatsoever you shall ask of the Father in my name, he may give it you."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Haec mando vobis: ut diligatis invicem."
      en: "These things I command you, that you love one another."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Si mundus vos odit, scitote quia me priorem vobis odio habuit."
      en: "If the world hate you, know ye, that it hath hated me before you."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Si de mundo fuissetis, mundus quod suum erat diligeret: quia vero de mundo non estis, sed ego elegi vos de mundo, propterea odit vos mundus."
      en: "If you had been of the world, the world would love its own: but because you are not of the world, but I have chosen you out of the world, therefore the world hateth you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Mementote sermonis mei, quem ego dixi vobis: non est servus major domino suo. Si me persecuti sunt, et vos persequentur; si sermonem meum servaverunt, et vestrum servabunt."
      en: "Remember my word that I said to you: The servant is not greater than his master. If they have persecuted me, they will also persecute you: if they have kept my word, they will keep yours also."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Sed haec omnia facient vobis propter nomen meum: quia nesciunt eum qui misit me."
      en: "But all these things they will do to you for my name's sake: because they know not him who sent me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Si non venissem, et locutus fuissem eis, peccatum non haberent: nunc autem excusationem non habent de peccato suo."
      en: "If I had not come, and spoken to them, they would not have sin; but now they have no excuse for their sin."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui me odit, et Patrem meum odit."
      en: "He that hateth me, hateth my Father also."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Si opera non fecissem in eis quae nemo alius fecit, peccatum non haberent: nunc autem et viderunt, et oderunt et me, et Patrem meum."
      en: "If I had not done among them the works that no other man hath done, they would not have sin; but now they have both seen and hated both me and my Father."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Sed ut adimpleatur sermo, qui in lege eorum scriptus est: Quia odio habuerunt me gratis."
      en: "But that the word may be fulfilled which is written in their law: They hated me without cause."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Cum autem venerit Paraclitus, quem ego mittam vobis a Patre, Spiritum veritatis, qui a Patre procedit, ille testimonium perhibebit de me;"
      en: "But when the Paraclete cometh, whom I will send you from the Father, the Spirit of truth, who proceedeth from the Father, he shall give testimony of me."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et vos testimonium perhibebitis, quia ab initio mecum estis."
      en: "And you shall give testimony, because you are with me from the beginning."
    status: { la: verified, en: verified }
