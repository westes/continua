# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 15
verses:
  - n: 1
    text:
      la: "Igitur in octavodecimo anno regni Jeroboam filii Nabat, regnavit Abiam super Judam."
      en: "Now in the eighteenth year of the reign of Jeroboam the son of Nabat, Abiam reigned over Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tribus annis regnavit in Jerusalem: nomen matris ejus Maacha filia Abessalom."
      en: "He reigned three years in Jerusalem: the name of his mother was Maacha the daughter of Abessalom."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ambulavitque in omnibus peccatis patris sui, quae fecerat ante eum: nec erat cor ejus perfectum cum Domino Deo suo, sicut cor David patris ejus."
      en: "And he walked in all the sins of his father, which he had done before him: and his heart was not perfect with the Lord his God, as was the heart of David his father."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sed propter David dedit ei Dominus Deus suus lucernam in Jerusalem, ut suscitaret filium ejus post eum, et statueret Jerusalem:"
      en: "But for David's sake the Lord his God gave him a lamp in Jerusalem, to set up his son after him, and to establish Jerusalem:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "eo quod fecisset David rectum in oculis Domini, et non declinasset ab omnibus, quae praeceperat ei cunctis diebus vitae suae, excepto sermone Uriae Hethaei."
      en: "Because David had done that which was right in the eyes of the Lord, and had not turned aside from any thing that he commanded him, all the days of his life, except the matter of Urias the Hethite."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Attamen bellum fuit inter Roboam et Jeroboam omni tempore vitae ejus."
      en: "But there was war between Roboam and Jeroboam all the time of his life."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Reliqua autem sermonum Abiam, et omnia quae fecit, nonne haec scripta sunt in libro verborum dierum regum Juda? Fuitque praelium inter Abiam et inter Jeroboam."
      en: "And the rest of the words of Abiam, and all that he did, are they not written in the book of the words of the days of the kings of Juda? And there was war between Abiam and Jeroboam."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et dormivit Abiam cum patribus suis, et sepelierunt eum in civitate David, regnavitque Asa filius ejus pro eo."
      en: "And Abiam slept with his fathers, and they buried him in the city of David, and Asa his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "In anno ergo vigesimo Jeroboam regis Israel regnavit Asa rex Juda,"
      en: "So in the twentieth year of Jeroboam king of Israel, reigned Asa king of Juda,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et quadraginta et uno anno regnavit in Jerusalem. Nomen matris ejus Maacha, filia Abessalom."
      en: "And he reigned one and forty years in Jerusalem. His mother's name was Maacha, the daughter of Abessalom."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et fecit Asa rectum ante conspectum Domini, sicut David pater ejus:"
      en: "And Asa did that which was right in the sight of the Lord, as did David his father:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et abstulit effeminatos de terra, purgavitque universas sordes idolorum, quae fecerant patres ejus."
      en: "And he took away the effeminate out of the land, and he removed all the filth of the idols, which his fathers had made."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Insuper et Maacham matrem suam amovit, ne esset princeps in sacris Priapi, et in luco ejus, quem consecraverat: subvertitque specum ejus, et confregit simulacrum turpissimum, et combussit in torrente Cedron:"
      en: "Moreover he also removed his mother Maacha, from being the princess in the sacrifices of Priapus, and in the grove which she had consecrated to him: and he destroyed her den, and broke in pieces the filthy idol, and burnt it by the torrent Cedron:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "excelsa autem non abstulit. Verumtamen cor Asa perfectum erat cum Domino cunctis diebus suis:"
      en: "But the high places he did not take away. Nevertheless the heart of Asa was perfect with the Lord all his days:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et intulit ea, quae sanctificaverat pater suus, et voverat, in domum Domini, argentum et aurum, et vasa."
      en: "And he brought in the things which his father had dedicated, and he had vowed, into the house of the Lord, silver and gold, and vessels."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Bellum autem erat inter Asa, et Baasa regem Israel cunctis diebus eorum."
      en: "And there was war between Asa, and Baasa king of Israel all their days."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ascendit quoque Baasa rex Israel in Judam, et aedificavit Rama, ut non posset quispiam egredi vel ingredi de parte Asa regis Juda."
      en: "And Baasa king of Israel went up against Juda, and built Rama, that no man might go out or come in, of the side of Asa king of Juda."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tollens itaque Asa omne argentum et aurum, quod remanserat in thesauris domus Domini, et in thesauris domus regiae, et dedit illud in manus servorum suorum: et misit ad Benadad filium Tabremon filii Hezion, regem Syriae, qui habitabat in Damasco, dicens:"
      en: "Then Asa took all the silver and gold that remained in the treasures of the house of the Lord, and in the treasures of the king's house, and delivered it into the hands of his servants: and sent them to Benadad son of Tabremon the son of Hezion, king of Syria, who dwelt in Damascus, saying:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Foedus est inter me et te, et inter patrem meum et patrem tuum: ideo misit tibi munera, argentum et aurum: et peto ut venias, et irritum facias foedus, quod habes cum Baasa rege Israel, et recedat a me."
      en: "There is a league between me and thee, and between my father and thy father: therefore I have sent thee presents of silver and gold: and I desire thee to come, and break thy league with Baasa king of Israel, that he may depart from me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Acquiescens Benadad regi Asa, misit principes exercitus sui in civitates Israel, et percusserunt Ahion, et Dan, et Abeldomum Maacha, et universam Cenneroth, omnes scilicet terram Nephthali."
      en: "Benadad hearkening to king Asa, sent the captains of his army against the cities of Israel, and they smote Ahion, and Dan, and Abeldomum Maacha, and all Cenneroth, that is all the land of Nephtali."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quod cum audisset Baasa, intermisit aedificare Rama, et reversus est in Thersa."
      en: "And when Baasa had heard this, he left off building Rama, and returned into Thersa."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Rex autem Asa nuntium misit in omnem Judam, dicens: Nemo sit excusatus. Et tulerunt lapides de Rama, et ligna ejus, quibus aedificaverat Baasa, et exstruxit de eis rex Asa Gabaa Benjamin, et Maspha."
      en: "But king Asa sent word into all Juda, saying: Let no man be excused: and they took away the stones from Rama, and the timber thereof wherewith Baasa had been building, and with them Asa built Gabaa of Benjamin, and Maspha."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Reliqua autem omnium sermonum Asa, et universae fortitudines ejus, et cuncta quae fecit, et civitates quas exstruxit, nonne haec scripta sunt in libro verborum dierum regum Juda? Verumtamen in tempore senectutis suae doluit pedes."
      en: "But the rest of all the acts of Asa, and all his strength, and all that he did and the cities that he built, are they not written in the book of the words of the days of the kings of Juda? But in the time of his old age he was diseased in his feet."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et dormivit cum patribus suis, et sepultus est cum eis in civitate David patris sui. Regnavitque Josaphat filius ejus pro eo."
      en: "And he slept with his fathers, and was buried with them in the city of David his father. And Josaphat his son reigned in his place."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Nadab vero filius Jeroboam regnavit super Israel anno secundo Asa regis Juda: regnavitque super Israel duobus annis."
      en: "But Nadab the son of Jeroboam reigned over Israel the second year of Asa king of Juda: and he reigned over Israel two years."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et fecit quod malum est in conspectu Domini, et ambulavit in viis patris sui, et in peccatis ejus, quibus peccare fecit Israel."
      en: "And he did evil in the sight of the Lord, and walked in the ways of his father, and in his sins, wherewith he made Israel to sin."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Insidiatus est autem ei Baasa filius Ahiae de domo Issachar, et percussit eum in Gebbethon, quae est urbs Philisthinorum: siquidem Nadab et omnis Israel obsidebant Gebbethon."
      en: "And Baasa the son of Ahias of the house of Issachar, conspired against him, and slew him in Gebbethon, which is a city of the Philistines: for Nadab and all Israel besieged Gebbethon."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Interfecit ergo illum Baasa in anno tertio Asa regis Juda, et regnavit pro eo."
      en: "So Baasa slew him in the third year of Asa king of Juda, and reigned in his place."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cumque regnasset, percussit omnem domum Jeroboam: non dimisit ne unam quidem animam de semine ejus, donec deleret eum juxta verbum Domini, quod locutus fuerat in manu servi sui Ahiae Silonitis,"
      en: "And when he was king he cut off all the house of Jeroboam: he left not so much as one soul of his seed, till he had utterly destroyed him, according to the word of the Lord, which he had spoken in the hand of Ahias the Silonite:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "propter peccata Jeroboam, quae peccaverat, et quibus peccare fecerat Israel: et propter delictum, quo irritaverat Dominum Deum Israel."
      en: "Because of the sin of Jeroboam, which he had sinned, and wherewith he had made Israel to sin, and for the offence, wherewith he provoked the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Reliqua autem sermonum Nadab, et omnia quae operatus est, nonne haec scripta sunt in libro verborum dierum regum Israel?"
      en: "But the rest of the acts of Nadab, and all that he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Fuitque bellum inter Asa, et Baasa regem Israel, cunctis diebus eorum."
      en: "And there was war between Asa and Baasa the king of Israel all their days."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Anno tertio Asa regis Juda regnavit Baasa filius Ahiae, super omnem Israel, in Thersa, viginti quatuor annis."
      en: "In the third year of Asa king of Juda, Baasa the son of Ahias reigned over all Israel, in Thersa, four and twenty years."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et fecit malum coram Domino, ambulavitque in via Jeroboam, et in peccatis ejus, quibus peccare fecit Israel."
      en: "And he did evil before the Lord, and walked in the ways of Jeroboam, and in his sins, wherewith he made Israel to sin."
    status: { la: verified, en: verified }
