# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 3reg
chapter: 15
verses:
  - n: 1
    text:
      la: "igitur in octavodecimo anno regni Hieroboam filii Nabath regnavit Abiam super Iudam"
      en: "Now in the eighteenth year of the reign of Jeroboam the son of Nabat, Abiam reigned over Juda."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tribus annis regnavit in Hierusalem nomen matris eius Maacha filia Absalom"
      en: "He reigned three years in Jerusalem: the name of his mother was Maacha the daughter of Abessalom."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ambulavitque in omnibus peccatis patris sui quae fecerat ante eum nec erat cor eius perfectum cum Domino Deo suo sicut cor David patris eius"
      en: "And he walked in all the sins of his father, which he had done before him: end his heart was not perfect with the Lord his God, as was the heart of David his father."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed propter David dedit ei Dominus Deus suus lucernam in Hierusalem ut suscitaret filium eius post eum et staret Hierusalem"
      en: "But for David's sake the Lord his God gave him a lamp in Jerusalem, to set up his son after him, and to establish Jerusalem:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "eo quod fecisset David rectum in oculis Domini et non declinasset ab omnibus quae praeceperat ei cunctis diebus vitae suae excepto sermone Uriae Hetthei"
      en: "Because David had done that which was right in the eyes of the Lord, and had not turned aside from any thing that he commanded him, all the days of his life, except the matter of Urias the Hethite."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "attamen bellum fuit inter Roboam et inter Hieroboam omni tempore vitae eius"
      en: "But there was war between Roboam and Jeroboam all the time of his life."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "reliqua autem sermonum Abiam et omnia quae fecit nonne haec scripta sunt in libro verborum dierum regum Iuda fuitque proelium inter Abiam et inter Hieroboam"
      en: "And the rest of the words of Abiam, and all that he did, are they not written in the book of the words of the days of the kings of Juda? And there was war between Abiam and Jeroboam."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et dormivit Abiam cum patribus suis et sepelierunt eum in civitate David regnavitque Asa filius eius pro eo"
      en: "And Abiam slept with his fathers, and they buried him in the city of David, and Asa his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in anno ergo vicesimo Hieroboam regis Israhel regnavit Asa rex Iuda"
      en: "So in the twentieth year of Jeroboam king of Israel, reigned Asa king of Juda,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et quadraginta uno anno regnavit in Hierusalem nomen matris eius Maacha filia Absalom"
      en: "And he reigned one end forty years in Jerusalem. His mother's name was Maacha, the daughter of Abessalom."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et fecit Asa rectum ante conspectum Domini sicut David pater eius"
      en: "And Asa did that which was right in the sight of the Lord, as did David his father:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et abstulit effeminatos de terra purgavitque universas sordes idolorum quae fecerant patres eius"
      en: "And he took away the effeminate out of the land, and he removed all the filth of the idols, which his fathers had made."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "insuper et Maacham matrem suam amovit ne esset princeps in sacris Priapi et in luco eius quem consecraverat subvertitque specum eius et confregit simulacrum turpissimum et conbusit in torrente Cedron"
      en: "Moreover he also removed his mother Maacha, from being the princess in the sacrifices of Priapus, and in the grove which she had consecrated to him: and he destroyed her den, and broke in pieces the filthy idol, and burnt it by the torrent Cedron:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "excelsa autem non abstulit verumtamen cor Asa perfectum erat cum Deo cunctis diebus suis"
      en: "But the high places he did not take away. Nevertheless the heart of Asa was perfect with the Lord all his days:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et intulit ea quae sanctificaverat pater suus et voverat in domum Domini argentum et aurum et vasa"
      en: "And he brought in the things which his father had dedicated, and he had vowed, into the house of the Lord, silver and gold, and vessels."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "bellum autem erat inter Asa et Baasa regem Israhel cunctis diebus eorum"
      en: "And there was war between Asa, and Baasa king of Israel all their days."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ascendit quoque Baasa rex Israhel in Iudam et aedificavit Rama ut non possit quispiam egredi vel ingredi de parte Asa regis Iudae"
      en: "And Baasa king of Israel went up against Juda, and built Rama, that no man might go out or come in, of the side of Asa king of Juda."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "tollens itaque Asa omne argentum et aurum quod remanserat in thesauris domus Domini et in thesauris domus regiae dedit illud in manu servorum suorum et misit ad Benadad filium Tabremmon filii Ezion regem Syriae qui habitabat in Damasco dicens"
      en: "Then Asa took all the silver and gold that remained in the treasures of the house of the Lord, and in the treasures of the king's house, and delivered it into the hands of his servants : and sent them to Benadad son of Tabremon the son of Hezion, king of Syria, who dwelt in Damascus, saying:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "foedus est inter me et te et inter patrem meum et patrem tuum ideo misi tibi munera argentum et aurum et peto ut venias et irritum facias foedus quod habes cum Baasa rege Israhel et recedat a me"
      en: "There is a league between me and thee, and between my father and thy father: therefore I have sent thee presents of silver and gold: and I desire thee to come, and break thy league with Baasa king of Israel, that he may depart from me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "adquiescens Benadad regi Asa misit principes exercitus sui in civitates Israhel et percusserunt Ahion et Dan et Abel domum Maacha et universam Cenneroth omnem scilicet terram Nepthalim"
      en: "Benadad hearkening to king Asa, sent the captains of his army against the cities of Israel, and they smote Ahion, and Dan, and Abeldomum Maacha, and all Cenneroth, that is all the land of Nephtali."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quod cum audisset Baasa intermisit aedificare Rama et reversus est in Thersa"
      en: "And when Baasa had heard this, he left off building Rama, and returned into Thersa."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "rex autem Asa nuntium misit in omnem Iudam nemo sit excusatus et tulerunt lapides Rama et ligna eius quibus aedificaverat Baasa et extruxit de eis rex Asa Gaba Beniamin et Maspha"
      en: "But king Asa sent word into all Juda, saying: Let no man be excused: and they took away the stones from Rama, and the timber thereof wherewith Baasa had been building, and with them Asa built Gabaa of Benjamin, and Maspha."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "reliqua autem omnium sermonum Asa et universae fortitudines eius et cuncta quae fecit et civitates quas extruxit nonne haec scripta sunt in libro verborum dierum regum Iuda verumtamen in tempore senectutis suae doluit pedes"
      en: "But the rest of all the acts of Asa, and all his strength, and all that he did and the cities that he built, are they not written in the book of the words of the days of the kings of Juda? But in the time of his old age he was diseased in his feet."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et dormivit cum patribus suis et sepultus est cum eis in civitate David patris sui regnavitque Iosaphat filius eius pro eo"
      en: "And he slept with his fathers, and was buried with them in the city of David his father. And Josaphat his son reigned in his place."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Nadab vero filius Hieroboam regnavit super Israhel anno secundo Asa regis Iuda regnavitque super Israhel duobus annis"
      en: "But Nadab the son of Jeroboam reigned over Israel the second year of Asa king of Juda: and he reigned over Israel two years."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et fecit quod malum est in conspectu Domini et ambulavit in viis patris sui et in peccatis eius quibus peccare fecit Israhel"
      en: "And he did evil in the sight of the Lord, and walked in the ways of his father, and in his sins, wherewith he made Israel to sin."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "insidiatus est autem ei Baasa filius Ahia de domo Isachar et percussit eum in Gebbethon quae est urbs Philisthinorum siquidem Nadab et omnis Israhel obsidebant Gebbethon"
      en: "And Baasa the son of Ahias of the house of Issachar, conspired against him, and slew him in Gebbethon, which is a city of the Philistines: for Nadab and all Israel besieged Gebbethon."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "interfecit igitur illum Baasa in anno tertio Asa regis Iuda et regnavit pro eo"
      en: "So Baasa slew him in the third year of Asa king of Juda, and reigned in his place."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "cumque regnasset percussit omnem domum Hieroboam non dimisit ne unam quidem animam de semine eius donec deleret eum iuxta verbum Domini quod locutus fuerat in manu servi sui Ahiae Silonitis"
      en: "And when he was king he cut off all the house of Jeroboam: he left not so much as one soul of his seed, till he had utterly destroyed him, according to the word of the Lord, which he had spoken in the hand of Ahias the Silonite:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "propter peccata Hieroboam quae peccaverat et quibus peccare fecerat Israhel et propter delictum quo inritaverat Dominum Deum Israhel"
      en: "Because of the sin of Jeroboam, which he had sinned, and wherewith he had made Israel to sin, and for the offence, wherewith he provoked the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "reliqua autem sermonum Nadab et omnia quae operatus est nonne haec scripta sunt in libro verborum dierum regum Israhel"
      en: "But the rest of the acts of Nadab, and all that he did, are they not written in the book of the words of the days of the kings of Israel?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "fuitque bellum inter Asa et Baasa regem Israhel cunctis diebus eorum"
      en: "And there was war between Asa and Baasa the king of Israel all their days."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "anno tertio Asa regis Iuda regnavit Baasa filius Ahia super omnem Israhel in Thersa viginti quattuor annis"
      en: "In the third year of Asa king of Juda, Baasa the son of Ahias reigned over all Israel, in Thersa, four and twenty years."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et fecit malum coram Domino ambulavitque in via Hieroboam et in peccatis eius quibus peccare fecit Israhel"
      en: "And he did evil before the Lord, and walked in the ways of Jeroboam, and in his sins, wherewith he made Israel to sin."
    status: { la: verified, en: verified }
