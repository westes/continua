# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: luc
chapter: 3
verses:
  - n: 1
    text:
      la: "Anno autem quintodecimo imperii Tiberii Caesaris, procurante Pontio Pilato Judaeam, tetrarcha autem Galiaeae Herode, Philippo autem fratre ejus tetrarcha Ituraeae, et Trachonitidis regionis, et Lysania Abilinae tetrarcha,"
      en: "Now in the fifteenth year of the reign of Tiberius Caesar, Pontius Pilate being governor of Judea, and Herod being tetrarch of Galilee, and Philip his brother tetrarch of Iturea, and the country of Trachonitis, and Lysanias tetrarch of Abilina;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sub principibus sacerdotum Anna et Caipha: factum est verbum Domini super Joannem, Zachariae filium, in deserto."
      en: "Under the high priests Annas and Caiphas; the word of the Lord was made unto John, the son of Zachary, in the desert."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et venit in omnem regionem Jordanis, praedicans baptismum poenitentiae in remissionem peccatorum,"
      en: "And he came into all the country about the Jordan, preaching the baptism of penance for the remission of sins;"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sicut scriptum est in libro sermonum Isaiae prophetae: Vox clamantis in deserto: Parate viam Domini; rectas facite semitas ejus:"
      en: "As it was written in the book of the sayings of Isaias the prophet: A voice of one crying in the wilderness: Prepare ye the way of the Lord, make straight his paths."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "omnis vallis implebitur, et omnis mons, et collis humiliabitur: et erunt prava in directa, et aspera in vias planas:"
      en: "Every valley shall be filled; and every mountain and hill shall be brought low; and the crooked shall be made straight; and the rough ways plain;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et videbit omnis caro salutare Dei."
      en: "And all flesh shall see the salvation of God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dicebat ergo ad turbas quae exibant ut baptizarentur ab ipso: Genimina viperarum, quis ostendit vobis fugere a ventura ira?"
      en: "He said therefore to the multitudes that went forth to be baptized by him: Ye offspring of vipers, who hath shewed you to flee from the wrath to come?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Facite ergo fructus dignos poenitentiae, et ne coeperitis dicere: Patrem habemus Abraham. Dico enim vobis quia potens est Deus de lapidibus istis suscitare filios Abrahae."
      en: "Bring forth therefore fruits worthy of penance; and do not begin to say, We have Abraham for our father. For I say unto you, that God is able of these stones to raise up children to Abraham."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Jam enim securis ad radicem arborum posita est. Omnis ergo arbor non faciens fructum bonum, excidetur, et in ignem mittetur."
      en: "For now the axe is laid to the root of the trees. Every tree therefore that bringeth not forth good fruit, shall be cut down and cast into the fire."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et interrogabant eum turbae, dicentes: Quid ergo faciemus?"
      en: "And the people asked him, saying: What then shall we do?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Respondens autem dicebat illis: Qui habet duas tunicas, det non habenti: et qui habet escas, similiter faciat."
      en: "And he answering, said to them: He that hath two coats, let him give to him that hath none; and he that hath meat, let him do in like manner."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Venerunt autem et publicani ut baptizarentur, et dixerunt ad illum: Magister, quid faciemus?"
      en: "And the publicans also came to be baptized, and said to him: Master, what shall we do?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "At ille dixit ad eos: Nihil amplius, quam quod constitutum est vobis, faciatis."
      en: "But he said to them: Do nothing more than that which is appointed you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Interrogabant autem eum et milites, dicentes: Quid faciemus et nos? Et ait illis: Neminem concutiatis, neque calumniam faciatis: et contenti estote stipendiis vestris."
      en: "And the soldiers also asked him, saying: And what shall we do? And he said to them: Do violence to no man; neither calumniate any man; and be content with your pay."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Existimante autem populo, et cogitantibus omnibus in cordibus suis de Joanne, ne forte ipse esset Christus,"
      en: "And as the people were of opinion, and all were thinking in their hearts of John, that perhaps he might be the Christ;"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "respondit Joannes, dicens omnibus: Ego quidem aqua baptizo vos: veniet autem fortior me, cujus non sum dignus solvere corrigiam calceamentorum ejus: ipse vos baptizabit in Spiritu Sancto et igni:"
      en: "John answered, saying unto all: I indeed baptize you with water; but there shall come one mightier than I, the latchet of whose shoes I am not worthy to loose: he shall baptize you with the Holy Ghost, and with fire:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cujus ventilabrum in manu ejus, et purgabit aream suam, et congregabit triticum in horreum suum, paleas autem comburet igni inextinguibili."
      en: "Whose fan is in his hand, and he will purge his floor, and will gather the wheat into his barn; but the chaff he will burn with unquenchable fire."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Multa quidem et alia exhortans evangelizabat populo."
      en: "And many other things exhorting, did he preach to the people."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Herodes autem tetrarcha cum corriperetur ab illo de Herodiade uxore fratris sui, et de omnibus malis quae fecit Herodes,"
      en: "But Herod the tetrarch, when he was reproved by him for Herodias, his brother's wife, and for all the evils which Herod had done;"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "adjecit et hoc super omnia, et inclusit Joannem in carcere."
      en: "He added this also above all, and shut up John in prison."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Factum est autem cum baptizaretur omnis populus, et Jesu baptizato, et orante, apertum est caelum:"
      en: "Now it came to pass, when all the people were baptized, that Jesus also being baptized and praying, heaven was opened;"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et descendit Spiritus Sanctus corporali specie sicut columba in ipsum: et vox de caelo facta est: Tu es filius meus dilectus, in te complacui mihi."
      en: "And the Holy Ghost descended in a bodily shape, as a dove upon him; and a voice came from heaven: Thou art my beloved Son; in thee I am well pleased."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ipse Jesus erat incipiens quasi annorum triginta, ut putabatur, filius Joseph, qui fuit Heli, qui fuit Mathat,"
      en: "And Jesus himself was beginning about the age of thirty years; being (as it was supposed) the son of Joseph, who was of Heli, who was of Mathat,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui fuit Levi, qui fuit Melchi, qui fuit Janne, qui fuit Joseph,"
      en: "Who was of Levi, who was of Melchi, who was of Janne, who was of Joseph,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "qui fuit Mathathiae, qui fuit Amos, qui fuit Nahum, qui fuit Hesli, qui fuit Nagge,"
      en: "Who was of Mathathias, who was of Amos, who was of Nahum, who was of Hesli, who was of Nagge,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui fuit Mahath, qui fuit Mathathiae, qui fuit Semei, qui fuit Joseph, qui fuit Juda,"
      en: "Who was of Mahath, who was of Mathathias, who was of Semei, who was of Joseph, who was of Juda,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "qui fuit Joanna, qui fuit Resa, qui fuit Zorobabel, qui fuit Salathiel, qui fuit Neri,"
      en: "Who was of Joanna, who was of Reza, who was of Zorobabel, who was of Salathiel, who was of Neri,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui fuit Melchi, qui fuit Addi, qui fuit Cosan, qui fuit Elmadan, qui fuit Her,"
      en: "Who was of Melchi, who was of Addi, who was of Cosan, who was of Helmadan, who was of Her,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "qui fuit Jesu, qui fuit Eliezer, qui fuit Jorim, qui fuit Mathat, qui fuit Levi,"
      en: "Who was of Jesus, who was of Eliezer, who was of Jorim, who was of Mathat, who was of Levi,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui fuit Simeon, qui fuit Juda, qui fuit Joseph, qui fuit Jona, qui fuit Eliakim,"
      en: "Who was of Simeon, who was of Judas, who was of Joseph, who was of Jona, who was of Eliakim,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "qui fuit Melea, qui fuit Menna, qui fuit Mathatha, qui fuit Natham, qui fuit David,"
      en: "Who was of Melea, who was of Menna, who was of Mathatha, who was of Nathan, who was of David,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "qui fuit Jesse, qui fuit Obed, qui fuit Booz, qui fuit Salmon, qui fuit Naasson,"
      en: "Who was of Jesse, who was of Obed, who was of Booz, who was of Salmon, who was of Naasson,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "qui fuit Aminadab, qui fuit Aram, qui fuit Esron, qui fuit Phares, qui fuit Judae,"
      en: "Who was of Aminadab, who was of Aram, who was of Esron, who was of Phares, who was of Judas,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "qui fuit Jacob, qui fuit Isaac, qui fuit Abrahae, qui fuit Thare, qui fuit Nachor,"
      en: "Who was of Jacob, who was of Isaac, who was of Abraham, who was of Thare, who was of Nachor,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "qui fuit Sarug, qui fuit Ragau, qui fuit Phaleg, qui fuit Heber, qui fuit Sale,"
      en: "Who was of Sarug, who was of Ragau, who was of Phaleg, who was of Heber, who was of Sale,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "qui fuit Cainan, qui fuit Arphaxad, qui fuit Sem, qui fuit Noe, qui fuit Lamech,"
      en: "Who was of Cainan, who was of Arphaxad, who was of Sem, who was of Noe, who was of Lamech,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "qui fuit Methusale, qui fuit Henoch, qui fuit Jared, qui fuit Malaleel, qui fuit Cainan,"
      en: "Who was of Mathusale, who was of Henoch, who was of Jared, who was of Malaleel, who was of Cainan,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "qui fuit Henos, qui fuit Seth, qui fuit Adam, qui fuit Dei."
      en: "Who was of Henos, who was of Seth, who was of Adam, who was of God."
    status: { la: verified, en: verified }
