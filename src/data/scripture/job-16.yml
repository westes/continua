# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 16
verses:
  - n: 1
    text:
      la: "respondens autem Iob dixit"
      en: "Then Job answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "audivi frequenter talia consolatores onerosi omnes vos estis"
      en: "I have often heard such things as these: you are all troublesome comforters."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "numquid habebunt finem verba ventosa aut aliquid tibi molestum est si loquaris"
      en: "Shall windy words have no end? or is it any trouble to thee to speak?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "poteram et ego similia vestri loqui atque utinam esset anima vestra pro anima mea"
      en: "I also could speak like you: and would God your soul were for my soul."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "consolarer et ego vos sermonibus et moverem caput meum super vos"
      en: "I would comfort you also with words, and would wag my head over you."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "roborarem vos ore meo et moverem labia quasi parcens vobis"
      en: "I would strengthen you with my mouth, and would move my lips, as sparing you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed quid agam si locutus fuero non quiescet dolor meus et si tacuero non recedet a me"
      en: "But what shall I do? If I speak, my pain will not rest: and if I hold my peace, it will not depart from me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "nunc autem oppressit me dolor meus et in nihili redacti sunt omnes artus mei"
      en: "But now my sorrow hath oppressed me, and all my limbs are brought to nothing."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "rugae meae testimonium dicunt contra me et suscitatur falsiloquus adversus faciem meam contradicens mihi"
      en: "My wrinkles bear witness against me, and a false speaker riseth up against my face, contradicting me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "collegit furorem suum in me et comminans mihi infremuit contra me dentibus suis hostis meus terribilibus oculis me intuitus est"
      en: "He hath gathered together his fury against me, and threatening me he hath gnashed with his teeth upon me: my enemy hath beheld me with terrible eyes."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "aperuerunt super me ora sua exprobrantes percusserunt maxillam meam satiati sunt poenis meis"
      en: "They have opened their mouths upon me, and reproaching me they have struck me on the cheek, they are filled with my pains."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "conclusit me Deus apud iniquum et manibus impiorum me tradidit"
      en: "God hath shut me up with the unjust man, and hath delivered me into the hands of the wicked."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ego ille quondam opulentus repente contritus sum tenuit cervicem meam confregit me et posuit sibi quasi in signum"
      en: "I that was formerly so wealthy, am all on a sudden broken to pieces: he hath taken me by my neck, he hath broken me, and hath set me up to be his mark."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "circumdedit me lanceis suis convulneravit lumbos meos non pepercit et effudit in terra viscera mea"
      en: "He hath compassed me round about with his lances, he hath wounded my loins, he hath not spared, and hath poured out my bowels on the earth."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "concidit me vulnere super vulnus inruit in me quasi gigans"
      en: "He hath torn me with wound upon wound, he hath rushed in upon me like a giant."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "saccum consui super cutem meam et operui cinere cornu meum"
      en: "I have sowed sackcloth upon my skin, and have covered my flesh with ashes."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "facies mea intumuit a fletu et palpebrae meae caligaverunt"
      en: "My face is swollen with weeping, and my eyelids are dim."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "haec passus sum absque iniquitate manus meae cum haberem mundas ad Deum preces"
      en: "These things have I suffered without the iniquity of my hand, when I offered pure prayers to God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "terra ne operias sanguinem meum neque inveniat locum in te latendi clamor meus"
      en: "O earth, cover not thou my blood, neither let my cry find a hiding place in thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ecce enim in caelo testis meus et conscius meus in excelsis"
      en: "For behold my witness is in heaven, and he that knoweth my conscience is on high."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "verbosi mei amici mei ad Deum stillat oculus meus"
      en: "My friends are full of words: my eye poureth out tears to God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "atque utinam sic iudicaretur vir cum Deo quomodo iudicatur filius hominis cum collega suo"
      en: "And O that a man might so be judged with God, as the son of man is judged with his companion!"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ecce enim breves anni transeunt et semitam per quam non revertar ambulo"
      en: "For behold short years pass away and I am walking in a path by which l shall not return."
    status: { la: verified, en: verified }
