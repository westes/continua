# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 19
verses:
  - n: 1
    text:
      la: "Nuntiatum est autem Joab quod rex fleret et lugeret filium suum:"
      en: "And it was told Joab, that the king wept and mourned for his son:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et versa est victoria in luctum in die illa omni populo: audivit enim populus in die illa dici: Dolet rex super filio suo."
      en: "And the victory that day was turned into mourning unto all the people: for the people heard say that day: The king grieveth for his son."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et declinavit populus in die illa ingredi civitatem, quomodo declinare solet populus versus et fugiens de praelio."
      en: "And the people shunned the going into the city that day as a people would do that hath turned their backs, and fled away from the battle."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Porro rex operuit caput suum, et clamabat voce magna: Fili mi Absalom, Absalom fili mi, fili mi."
      en: "And the king covered his head, and cried with a loud voice: O my son Absalom, O Absalom my son, O my son."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ingressus ergo Joab ad regem in domum, dixit: Confudisti hodie vultus omnium servorum tuorum, qui salvam fecerunt animam tuam, et animam filiorum tuorum, et filiarum tuarum, et animam uxorum tuarum, et animam concubinarum tuarum."
      en: "Then Joab going into the house to the king, said: Thou hast shamed this day the faces of all thy servants, that have saved thy life, and the lives of thy sons, and of thy daughters, and the lives of thy wives, and the lives of thy concubines."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Diligis odientes te, et odio habes diligentes te: et ostendisti hodie quia non curas de ducibus tuis, et de servis tuis: et vere cognovi modo, quia si Absalom viveret, et omnes nos occubuissemus, tunc placeret tibi."
      en: "Thou lovest them that hate thee, and thou hatest them that love thee: and thou hast shewn this day that thou carest not for thy nobles, nor for thy servants: and I now plainly perceive that if Absalom had lived, and all we had been slain, then it would have pleased thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Nunc igitur surge, et procede, et alloquens satisfac servis tuis: juro enim tibi per Dominum, quod si non exieris, ne unus quidem remansurus sit tecum nocte hac: et pejus erit hoc tibi, quam omnia mala quae venerunt super te ab adolescentia tua usque in praesens."
      en: "Now therefore arise, and go out, and speak to the satisfaction of thy servants: for I swear to thee by the Lord, that if thou wilt not go forth, there will not tarry with thee so much as one this night: and that will be worse to thee, than all the evils that have befallen thee from thy youth until now."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Surrexit ergo rex et sedit in porta: et omni populo nuntiatum est quod rex sederet in porta: venitque universa multitudo coram rege: Israel autem fugit in tabernacula sua."
      en: "Then the king arose and sat in the gate: and it was told to all the people that the king sat in the gate: and all the people came before the king, but Israel fled to their own dwellings."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Omnis quoque populus certabat in cunctis tribubus Israel, dicens: Rex liberavit nos de manu inimicorum nostrorum, ipse salvavit nos de manu Philisthinorum: et nunc fugit de terra propter Absalom."
      en: "And all the people were at strife in all the tribes of Israel, saying: The king delivered us out of the hand of our enemies, and he saved us out of the hand of the Philistines: and now he is fled out of the land for Absalom."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Absalom autem, quem unximus super nos, mortuus est in bello: usquequo siletis, et non reducitis regem?"
      en: "But Absalom, whom we anointed over us, is dead in the battle: how long are you silent, and bring not back the king?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Rex vero David misit ad Sadoc et Abiathar sacerdotes, dicens: Loquimini ad majores natu Juda, dicentes: Cur venitis novissimi ad reducendum regem in domum suam? ( Sermo autem omnis Israel pervenerat ad regem in domo ejus.)"
      en: "And king David sent to Sadoc, and Abiathar the priests, saying: Speak to the ancients of Juda, saying: Why are you the last to bring the king back to his house? (For the talk of all Israel was come to the king in his house.)"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Fratres mei vos, os meum, et caro mea vos, quare novissimi reducitis regem?"
      en: "You are my brethren, you are my bone, and my flesh, why are you the last to bring back the king?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et Amasae dicite: Nonne os meum, et caro mea es? Haec faciat mihi Deus, et haec addat, si non magister militiae fueris coram me omni tempore pro Joab."
      en: "And say ye to Amasa: Art not thou my bone, and my flesh? So do God to me and add more, if thou be not the chief captain of the army before me always in the place of Joab."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et inclinavit cor omnium virorum Juda, quasi viri unius: miseruntque ad regem, dicentes: Revertere tu, et omnes servi tui."
      en: "And be inclined the heart of all the men of Juda, as it were of one man: and they sent to the king, saying: Return thou, and all thy servants."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et reversus est rex: et venit usque ad Jordanem, et omnis Juda venit usque in Galgalam ut occurreret regi, et traduceret eum Jordanem."
      en: "And the king returned and came as far as the Jordan, and all Juda came as far as Galgal to meet the king, and to bring him over the Jordan."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Festinavit autem Semei filius Gera filii Jemini de Bahurim, et descendit cum viris Juda in occursum regis David"
      en: "And Semei the son of Gera the son of Jemini of Bahurim, made haste and went down with the men of Juda to meet king David,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cum mille viris de Benjamin, et Siba puer de domo Saul: et quindecim filii ejus, ac viginti servi erant cum eo: et irrumpentes Jordanem, ante regem"
      en: "With a thousand men of Benjamin, and Siba the servant of the house of Saul: and his fifteen sons, and twenty servants were with him: and going over the Jordan,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "transierunt vada, ut traducerent domum regis, et facerent juxta jussionem ejus: Semei autem filius Gera prostratus coram rege, cum jam transisset Jordanem,"
      en: "They passed the fords before the king, that they might help over the king's household, and do according to his commandment. And Semei the son of Gera falling down before the king, when he was come over the Jordan,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "dixit ad eum: Ne reputes mihi domine mi iniquitatem, neque memineris injuriarum servi tui in die qua egressus es domine mi rex de Jerusalem, neque ponas rex in corde tuo."
      en: "Said to him: Impute not to me, my lord, the iniquity, nor remember the injuries of thy servant on the day that thou, my lord, the king, wentest out of Jerusalem, nor lay it up in thy heart, O king."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Agnosco enim servus tuus peccatum meum: et idcirco hodie primus veni de omni domo Joseph, descendique de omni domo Joseph, descendique in occursum domini mei regis."
      en: "For I thy servant acknowledge my sin: and therefore I am come this day the first of all the house of Joseph, and am come down to meet my lord the king."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Respondens vero Abisai filius Sarviae, dixit: Numquid pro his verbis non occidetur Semei, quia maledixit christo Domini?"
      en: "But Abisai the son of Sarvia answering, said: Shall Semei for these words not be put to death, because he cursed the Lord's anointed?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ait David: Quid mihi et vobis, filii Sarviae? cur efficimini mihi hodie in satan? Ergone hodie interficietur vir in Israel? an ignoro hodie me factum regem super Israel?"
      en: "And David said: What have I to do with you, ye sons of Sarvia? why are you a satan this day to me? shall there any man be killed this day in Israel? do not I know that this day I am made king over Israel?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ait rex Semei: Non morieris. Juravitque ei."
      en: "And the king said to Semei: Thou shalt not die. And he swore unto him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Miphiboseth quoque filius Saul descendit in occursum regis, illotis pedibus, et intonsa barba: vestesque suas non laverat a die qua egressus fuerat rex, usque ad diem reversionis ejus in pace."
      en: "And Miphiboseth the son of Saul came down to meet the king, and he had neither washed his feet, nor trimmed his beard: nor washed his garments from the day that the king went out, until the day of his return in peace."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Cumque Jerusalem occurrisset regi, dixit ei rex: Quare non venisti mecum Miphiboseth?"
      en: "And when he met the king at Jerusalem, the king said to him: Why camest thou not with me, Miphiboseth?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et respondens ait: Domine mi rex, servus meus contempsit me: dixique ei ego famulus tuus ut sterneret mihi asinum, et ascendens abirem cum rege: claudus enim sum servus tuus."
      en: "And he answering, said: My lord, O king, my servant despised me: for I thy servant spoke to him to saddle me an ass, that I might get on and go with the king: for I thy servant am lame."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Insuper et accusavit me servum tuum ad te dominum meum regem: tu autem domine mi rex, sicut angelus Dei es: fac quod placitum est tibi."
      en: "Moreover he hath also accused me thy servant to thee, my lord the king: but thou my lord the king art as an angel of God, do what pleaseth thee."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Neque enim fuit domus patris mei, nisi morti obnoxia domino meo regi: tu autem posuisti me servum tuum inter convivas mensae tuae: quid ergo habeo justae querelae? aut quid possum ultra vociferari ad regem?"
      en: "For all of my father's house were no better than worthy of death before my lord the king; and thou hast set me thy servant among the guests of thy table: what just complaint therefore have I? or what right to cry any more to the king?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ait ergo ei rex: Quid ultra loqueris? fixum est quod locutus sum: tu et Siba dividite possessiones."
      en: "Then the king said to him: Why speakest thou any more? what I have said is determined: thou and Siba divide the possessions."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Responditque Miphiboseth regi: Etiam cuncta accipiat, postquam reversus est dominus meus rex pacifice in domum suam."
      en: "And Miphiboseth answered the king: Yea, let him take all, for as much as my lord the king is returned peaceably into his house."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Berzellai quoque Galaadites, descendens de Rogelim, traduxit regem Jordanem, paratus etiam ultra fluvium prosequi eum."
      en: "Berzellai also the Galaadite coming down from Rogelim, brought the king over the Jordan, being ready also to wait on him beyond the river."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Erat autem Berzellai Galaadites senex valde, id est, octogenarius, et ipse praebuit alimenta regi, cum moraretur in castris: fuit quippe vir dives nimis."
      en: "Now Berzellai the Galaadite was of a great age, that is to say, fourscore years old, and he provided the king with sustenance when he abode in the camp: for he was a man exceeding rich."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Dixit itaque rex ad Berzellai: Veni mecum, ut requiescas securus mecum in Jerusalem."
      en: "And the king said to Berzellai: Come with me that thou mayest rest secure with me in Jerusalem."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et ait Berzellai ad regem: Quot sunt dies annorum vitae meae, ut ascendam cum rege in Jerusalem?"
      en: "And Berzellai said to the king: How many are the days of the years of my life, that I should go up with the king to Jerusalem?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Octogenarius sum hodie: numquid vigent sensus mei ad discernendum suave, aut amarum? aut delectare potest servum tuum cibus et potus? vel audire possum ultra vocem cantorum, atque cantatricum? quare servus tuus sit oneri domino meo regi?"
      en: "I am this day fourscore years old, are my senses quick to discern sweet and bitter? or can meat or drink delight thy servant? or can I hear any more the voice of singing men and singing women? why should thy servant be a burden to my lord, the king?"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Paululum procedam famulus tuus ab Jordane tecum: non indigeo hac vicissitudine,"
      en: "I thy servant will go on a little way from the Jordan with thee: I need not this recompense."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "sed obsecro ut revertar servus tuus, et moriar in civitate mea, et sepeliar juxta sepulchrum patris mei et matris meae. Est autem servus tuus Chamaam, ipse vadat tecum, domine mi rex, et fac ei quidquid tibi bonum videtur."
      en: "But I beseech thee let thy servant return, and die in my own city, and be buried by the sepulchre of my father, and of my mother. But there is thy servant Chamaam, let him go with thee, my lord, the king, and do to him whatsoever seemeth good to thee."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Dixit itaque ei rex: Mecum transeat Chamaam, et ego faciam ei quidquid tibi placuerit, et omne quod petieris a me, impetrabis."
      en: "Then the king said to him: Let Chamaam go over with me, and I will do for him whatsoever shall please thee, and all that thou shalt ask of me, thou shalt obtain."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Cumque transisset universus populus et rex Jordanem, osculatus est rex Berzellai, et benedixit ei: et ille reversus est in locum suum."
      en: "And when all the people and the king had passed over the Jordan, the king kissed Berzellai, and blessed him: and he returned to his own place."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Transivit ergo rex in Galgalam, et Chamaam cum eo. Omnis autem populus Juda traduxerat regem, et media tantum pars adfuerat de populo Israel."
      en: "So the king went on to Galgal, and Chamaam with him. Now all the people of Juda had brought the king over, and only half of the people of Israel were there."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Itaque omnes viri Israel concurrentes ad regem dixerunt ei: Quare te furati sunt fratres nostri viri Juda, et traduxerunt regem et domum ejus Jordanem, omnesque viros David cum eo?"
      en: "Therefore all the men of Israel running together to the king, said to him: Why have our brethren the men of Juda stolen thee away, and have brought the king and his household over the Jordan, and all the men of David with him?"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et respondit omnis vir Juda ad viros Israel: Quia mihi propior est rex: cur irasceris super hac re? numquid comedimus aliquid ex rege, aut munera nobis data sunt?"
      en: "And all the men of Juda answered the men of Israel: Because the king is nearer to me: why art thou angry for this matter? have we eaten any thing of the king's, or have any gifts been given us?"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et respondit vir Israel ad viros Juda, et ait: Decem partibus major ego sum apud regem, magisque ad me pertinet David quam ad te: cur fecisti mihi injuriam, et non mihi nuntiatum est priori, ut reducerem regem meum? Durius autem responderunt viri Juda viris Israel."
      en: "And the men of Israel answered the men of Juda, and said: I have ten parts in the king more than thou, and David belongeth to me more than to thee: why hast thou done me a wrong, and why was it not told me first, that I might bring back my king? And the men of Juda answered more harshly than the men of Israel."
    status: { la: verified, en: verified }
