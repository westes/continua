# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 3
verses:
  - n: 1
    text:
      la: "Facta est ergo longa concertatio inter domum Saul, et inter domum David: David proficiscens, et semper seipso robustior, domus autem Saul decrescens quotidie."
      en: "Now there was a long war between the house of Saul and the house of David: David prospering and growing always stronger and stronger, but the house of Saul decaying daily."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Natique sunt filii David in Hebron: fuitque primogenitus ejus Amnon, de Achinoam Jezraelitide."
      en: "And sons were born to David in Hebron: and his firstborn was Amnon of Achinoam the Jezrahelitess:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et post eum Cheleab, de Abigail uxore Nabal Carmeli: porro tertius Absalom, filius Maacha filiae Tholmai regis Gessur."
      en: "And his second Cheleab of Abigail the wife of Nabal of Carmel: and the third Absalom the son of Maacha the daughter of Tholmai king of Gessur:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quartus autem Adonias, filius Haggith: et quintus Saphathia, filius Abital."
      en: "And the fourth Adonias, the son of Haggith: and the fifth Saphathia the son of Abital:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sextus quoque Jethraam, de Egla uxore David: hi nati sunt David in Hebron."
      en: "And the sixth Jethraam of Egla the wife of David: these were born to David in Hebron."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cum ergo esset praelium inter domum Saul et domum David, Abner filius Ner regebat domum Saul."
      en: "Now while there was war between the house of Saul and the house of David, Abner the son of Ner ruled the house of Saul."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Fuerat autem Sauli concubina nomine Respha, filia Aja. Dixitque Isboseth ad Abner:"
      en: "And Saul had a concubine named Respha, the daughter of Aia. And Isboseth said to Abner:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quare ingressus es ad concubinam patris mei? Qui iratus nimis propter verba Isboseth, ait: Numquid caput canis ego sum adversum Judam hodie, qui fecerim misericordiam super domum Saul patris tui, et super fratres et proximos ejus, et non tradidi te in manus David, et tu requisisti in me quod argueres pro muliere hodie?"
      en: "Why didst thou go in to my father's concubine? And he was exceedingly angry for the words of Isboseth, and said: Am I a dog's head against Juda this day, who have shewn mercy to the house of Saul thy father, and to his brethren and friends, and have not delivered thee into the hands of David, and hast thou sought this day against me to charge me with a matter concerning a woman?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Haec faciat Deus Abner, et haec addat ei, nisi quomodo juravit Dominus David, sic faciam cum eo,"
      en: "So do God to Abner, and more also, unless as the Lord hath sworn to David, so I do to him,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ut transferatur regnum de domo Saul, et elevetur thronus David super Israel, et super Judam, a Dan usque Bersabee."
      en: "That the kingdom be translated from the house of Saul, and the throne of David be set up over Israel, and over Juda from Dan to Bersabee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et non potuit respondere ei quidquam, quia metuebat illum."
      en: "And he could not answer him a word, because he feared him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Misit ergo Abner nuntios ad David pro se dicentes: Cujus est terra? et ut loquerentur: Fac mecum amicitias, et erit manus mea tecum, et reducam ad te universum Israel."
      en: "Abner therefore sent messengers to David for himself, saying: Whose is the land? and that they should say: Make a league with me, and my hand shall be with thee: and I will bring all Israel to thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Qui ait: Optime: ego faciam tecum amicitias: sed unam rem peto a te, dicens: Non videbis faciem meam antequam adduxeris Michol filiam Saul: et sic venies, et videbis me."
      en: "And he said: Very well: I will make a league with thee: but one thing I require of thee, saying: Thou shalt not see my face before thou bring Michol the daughter of Saul: and so thou shalt come, and see me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Misit autem David nuntios ad Isboseth filium Saul, dicens: Redde uxorem meam Michol, quam despondi mihi centum praeputiis Philisthiim."
      en: "And David sent messengers to Isboseth the son of Saul, saying: Restore my wife Michol, whom I espoused to me for a hundred foreskins of the Philistines."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Misit ergo Isboseth, et tulit eam a viro suo Phaltiel, filio Lais."
      en: "And Isboseth sent, and took her from her husband Phaltiel, the son of Lais."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sequebaturque eam vir suus, plorans usque Bahurim: et dixit ad eum Abner: Vade, et revertere. Qui reversus est."
      en: "And her husband followed her, weeping as far as Bahurim: and Abner said to him: Go and return. And he returned."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sermonem quoque intulit Abner ad seniores Israel, dicens: Tam heri quam nudiustertius quaerebatis David ut regnaret super vos."
      en: "Abner also spoke to the ancients of Israel, saying: Both yesterday and the day before you sought for David that he might reign over you."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Nunc ergo facite: quoniam Dominus locutus est ad David, dicens: In manu servi mei David salvabo populum meum Israel de manu Philisthiim, et omnium inimicorum ejus."
      en: "Now then do it: because the Lord hath spoken to David, saying: By the hand of my servant David I will save my people Israel from the hands of the Philistines, and of all their enemies."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Locutus est autem Abner etiam ad Benjamin. Et abiit ut loqueretur ad David in Hebron omnia quae placuerant Israeli et universo Benjamin."
      en: "And Abner spoke also to Benjamin. And he went to speak to David in Hebron all that seemed good to Israel, and to all Benjamin."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Venitque ad David in Hebron cum viginti viris: et fecit David Abner, et viris ejus qui venerant cum eo, convivium."
      en: "And he came to David in Hebron with twenty men: and David made a feast for Abner, and his men that came with him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et dixit Abner ad David: Surgam, ut congregem ad te dominum meum regem omnem Israel, et ineam tecum foedus, et imperes omnibus, sicut desiderat anima tua. Cum ergo deduxisset David Abner, et ille isset in pace,"
      en: "And Abner said to David: I will rise, that I may gather all Israel unto thee my lord the king, and may enter into a league with thee, and that thou mayst reign over all as thy soul desireth. Now when David had brought Abner on his way, and he was gone in peace,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "statim pueri David et Joab venerunt, caesis latronibus, cum praeda magna nimis: Abner autem non erat cum David in Hebron, quia jam dimiserat eum, et profectus fuerat in pace."
      en: "Immediately David's servants and Joab came, after having slain the robbers, with an exceeding great booty: and Abner, was not with David in Hebron, for he had now sent him away, and he was gone in peace."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et Joab, et omnis exercitus, qui erat cum eo, postea venerunt: nuntiatum est itaque Joab a narrantibus: Venit Abner filius Ner ad regem, et dimisit eum, et abiit in pace."
      en: "And Joab and all the army that was with him, came afterwards: and it was told Joab, that Abner the son of Ner came to the king, and he hath sent him away, and he is gone in peace."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et ingressus est Joab ad regem, et ait: Quid fecisti? Ecce venit Abner ad te: quare dimisisti eum, et abiit et recessit?"
      en: "And Joab went in to the king, and said: What hast thou done? Behold Abner came to thee: Why didst thou send him away, and he is gone and departed?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ignoras Abner filium Ner, quoniam ad hoc venit ad te ut deciperet te, et sciret exitum tuum, et introitum tuum, et nosset omnia quae agis?"
      en: "Knowest thou not Abner the son of Ner, that to this end he came to thee, that he might deceive thee, and to know thy going out, and thy coming in, and to know all thou dost?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Egressus itaque Joab a David, misit nuntios post Abner, et reduxit eum a cisterna Sira, ignorante David."
      en: "Then Joab going out from David, sent messengers after Abner, and brought him back from the cistern of Sira, David knowing nothing of it."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cumque rediisset Abner in Hebron, seorsum adduxit eum Joab ad medium portae, ut loqueretur ei, in dolo: et percussit illum ibi in inguine, et mortuus est in ultionem sanguinis Asael fratris ejus."
      en: "And when Abner was returned to Hebron, Joab took him aside to the middle of the gate, to speak to him treacherously: and he stabbed him there in the groin, and he died, in revenge of the blood of Asael his brother."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quod cum audisset David rem jam gestam, ait: Mundus ego sum, et regnum meum apud Dominum usque in sempiternum a sanguine Abner filii Ner,"
      en: "And when David heard of it, after the thing was now done, he said: I, and my kingdom are innocent before the Lord for ever of the blood of Abner the son of Ner:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et veniat super caput Joab, et super omnem domum patris ejus: nec deficiat de domo Joab fluxum seminis sustinens, et leprosus, et tenens fusum, et cadens gladio, et indigens pane."
      en: "And may it come upon the head of Joab, and upon all his father's house: and let there not fail from the house of Joab one that hath an issue of seed, or that is a leper, or that holdeth the distaff, or that falleth by the sword, or that wanteth bread."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Igitur Joab et Abisai frater ejus interfecerunt Abner, eo quod occidisset Asael fratrem eorum in Gabaon in praelio."
      en: "So Joab and Abisai his brother slew Abner, because he had killed their brother Asael at Gabaon in the battle."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Dixit autem David ad Joab, et ad omnem populum, qui erat cum eo: Scindite vestimenta vestra, et accingimini saccis, et plangite ante exequias Abner: porro rex David sequebatur feretrum."
      en: "And David said to Joab, and to all the people that were with him: Rend your garments, and gird yourselves with sackcloths, and mourn before the funeral of Abner. And king David himself followed the bier."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Cumque sepelissent Abner in Hebron, levavit rex David vocem suam, et flevit super tumulum Abner: flevit autem et omnis populus."
      en: "And when they had buried Abner in Hebron, king David lifted up his voice, and wept at the grave of Abner: and all the people also wept."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Plangensque rex et lugens Abner, ait: Nequaquam ut mori solent ignavi, mortuus est Abner."
      en: "And the king mourning and lamenting over Abner, said: Not as cowards are wont to die, hath Abner died."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Manus tuae ligatae non sunt, et pedes tui non sunt compedibus aggravati: sed sicut solent cadere coram filiis iniquitatis, sic corruisti. Congeminansque omnis populus flevit super eum."
      en: "Thy hands were not bound, nor thy feet laden with fetters: but as men fall before the children of iniquity, so didst thou fall. And all the people repeating it wept over him."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Cumque venisset universa multitudo cibum capere cum David, clara adhuc die juravit David, dicens: Haec faciat mihi Deus, et haec addat, si ante occasum solis gustavero panem vel aliud quidquam."
      en: "And when all the people came to take meat with David, while it was yet broad day, David swore, saying: So do God to me, and more also, if I taste bread or any thing else before sunset."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Omnisque populus audivit, et placuerunt eis cuncta quae fecit rex in conspectu totius populi."
      en: "And all the people heard, and they were pleased, and all that the king did seemed good in the sight of all the people."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et cognovit omne vulgus et universus Israel in die illa, quoniam non actum fuisset a rege ut occideretur Abner filius Ner."
      en: "And all the people, and all Israel understood that day that it was not the king's doing, that Abner the son of Ner was slain."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Dixit quoque rex ad servos suos: Num ignoratis quoniam princeps et maximus cecidit hodie in Israel?"
      en: "The king also said to his servants: Do you not know that a prince and great man is slain this day in Israel?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Ego autem adhuc delicatus, et unctus rex: porro viri isti filii Sarviae duri sunt mihi: retribuat Dominus facienti malum juxta malitiam suam."
      en: "But I as yet am tender, though anointed king. And these men the sons of Sarvia are too hard for me: the Lord reward him that doth evil according to his wickedness."
    status: { la: verified, en: verified }
