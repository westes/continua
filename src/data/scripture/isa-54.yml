# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 54
verses:
  - n: 1
    text:
      la: "lauda sterilis quae non paris decanta laudem et hinni quae non pariebas quoniam multi filii desertae magis quam eius quae habebat virum dicit Dominus"
      en: "Give praise, O thou barren, that bearest not: sing forth praise, and make a joyful noise, thou that didst not travail with child: for many are the children of the desolate, more than of her that hath a husband, saith the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dilata locum tentorii tui et pelles tabernaculorum tuorum extende ne parcas longos fac funiculos tuos et clavos tuos consolida"
      en: "Enlarge the place of thy tent, and stretch out the skins of thy tabernacles, spare not: lengthen thy cords, and strengthen thy stakes."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ad dexteram enim et ad levam penetrabis et semen tuum gentes hereditabit et civitates desertas inhabitabit"
      en: "For thou shalt pass on to the right hand, and to the left: and thy seed shall inherit the Gentiles, and shall inhabit the desolate cities."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "noli timere quia non confunderis neque erubescas non enim te pudebit quia confusionis adulescentiae tuae oblivisceris et obprobrii viduitatis tuae non recordaberis amplius"
      en: "Fear not, for thou shalt not be confounded, nor blush: for thou shalt not be put to shame, because thou shalt forget the shame of thy youth, and shalt remember no more the reproach of thy widowhood."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quia dominabitur tui qui fecit te Dominus exercituum nomen eius et redemptor tuus Sanctus Israhel Deus omnis terrae vocabitur"
      en: "For he that made thee shall rule over thee, the Lord of hosts is his name: and thy Redeemer, the Holy One of Israel, shall be called the God of all the earth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia ut mulierem derelictam et maerentem spiritu vocavit te Dominus et uxorem ab adulescentia abiectam dixit Deus tuus"
      en: "For the Lord hath called thee as woman forsaken and mourning in spirit, end se a wife cast off from her youth, said thy God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ad punctum in modico dereliqui te et in miserationibus magnis congregabo te"
      en: "For a, small moment have I forsaken thee, but with great mercies will I gather thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "in momento indignationis abscondi faciem meam parumper a te et in misericordia sempiterna misertus sum tui dixit redemptor tuus Dominus"
      en: "In a moment of indignation have I hid my face a little while from thee, but with everlasting kindness have I had mercy on thee, said the Lord thy Redeemer."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sicut in diebus Noe istud mihi est cui iuravi ne inducerem aquas Noe ultra super terram sic iuravi ut non irascar tibi et non increpem te"
      en: "This thing is to me as in the days of Noe, to whom I swore, that I would no more bring in the waters of Noe upon the earth: so have I sworn not to be angry with thee, and not to rebuke thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "montes enim commovebuntur et colles contremescent misericordia autem mea non recedet et foedus pacis meae non movebitur dixit miserator tuus Dominus"
      en: "For the mountains shall be moved, and the hills shall tremble; but my mercy shall not depart from thee, and the covenant of my peace shall not be moved: said the Lord that hath mercy on thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "paupercula tempestate convulsa absque ulla consolatione ecce ego sternam per ordinem lapides tuos et fundabo te in sapphyris"
      en: "O poor little one, tossed with tempest, without all comfort, behold I will lay thy stones in order, and will lay thy foundations with sapphires,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et ponam iaspidem propugnacula tua et portas tuas in lapides sculptos et omnes terminos tuos in lapides desiderabiles"
      en: "And I will make thy bulwarks of jasper: and thy gates of graven stones, and all thy borders of desirable stones."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "universos filios tuos doctos a Domino et multitudinem pacis filiis tuis"
      en: "All thy children shall be taught of the Lord: and great shall be the peace of thy children."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et in iustitia fundaberis recede procul a calumnia quia non timebis et a pavore quia non adpropinquabit tibi"
      en: "And thou shalt be founded in justice: depart far from oppression, for thou shalt not fear; and from terror, for it shall not come near thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ecce accola veniet qui non erat mecum advena quondam tuus adiungetur tibi"
      en: "Behold, an inhabitant shall come, who was not with me, he that was a stranger to thee before, shall be joined to thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ecce ego creavi fabrum sufflantem in igne prunas et proferentem vas in opus suum et ego creavi interfectorem ad disperdendum"
      en: "Behold, I have created the smith that bloweth the coals in the fire, and bringeth forth an instrument for his work, and I have created the killer to destroy."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "omne vas quod fictum est contra te non dirigetur et omnem linguam resistentem tibi in iudicio iudicabis haec hereditas servorum Domini et iustitia eorum apud me dicit Dominus"
      en: "No weapon that is formed against thee shall prosper: and every tongue that resisteth thee in judgment, thou shalt condemn. This is the inheritance of the servants of the Lord, and their justice with me, saith the Lord."
    status: { la: verified, en: verified }
