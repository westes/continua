# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jud
chapter: 1
verses:
  - n: 1
    text:
      la: "Judas Jesu Christi servus, frater autem Jacobi, his qui sunt in Deo Patre dilectis, et Christo Jesu conservatis, et vocatis."
      en: "Jude, the servant of Jesus Christ, and brother of James: to them that are beloved in God the Father, and preserved in Jesus Christ, and called."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Misericordia vobis, et pax, et caritas adimpleatur."
      en: "Mercy unto you, and peace, and charity be fulfilled."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Carissimi, omnem sollicitudinem faciens scribendi vobis de communi vestra salute, necesse habui scribere vobis: deprecans supercertari semel traditae sanctis fidei."
      en: "Dearly beloved, taking all care to write unto you concerning your common salvation, I was under a necessity to write unto you: to beseech you to contend earnestly for the faith once delivered to the saints."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Subintroierunt enim quidam homines ( qui olim praescripti sunt in hoc judicium) impii, Dei nostri gratiam transferentes in luxuriam, et solum Dominatorem, et Dominum nostrum Jesum Christum negantes."
      en: "For certain men are secretly entered in, (who were written of long ago unto this judgment,) ungodly men, turning the grace of our Lord God into riotousness, and denying the only sovereign Ruler, and our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Commonere autem vos volo, scientes semel omnia, quoniam Jesus populum de terra Aegypti salvans, secundo eos, qui non crediderunt, perdidit:"
      en: "I will therefore admonish you, though ye once knew all things, that Jesus, having saved the people out of the land of Egypt, did afterwards destroy them that believed not:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "angelos vero, qui non servaverunt suum principatum, sed dereliquerunt suum domicilium, in judicium magni diei, vinculis aeternis sub caligine reservavit."
      en: "And the angels who kept not their principality, but forsook their own habitation, he hath reserved under darkness in everlasting chains, unto the judgment of the great day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sicut Sodoma, et Gomorrha, et finitimae civitates simili modo exfornicatae, et abeuntes post carnem alteram, factae sunt exemplum, ignis aeterni poenam sustinentes."
      en: "As Sodom and Gomorrha, and the neighbouring cities, in like manner, having given themselves to fornication, and going after other flesh, were made an example, suffering the punishment of eternal fire."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Similiter et hi carnem quidem maculant, dominationem autem spernunt, majestatem autem blasphemant."
      en: "In like manner these men also defile the flesh, and despise dominion, and blaspheme majesty."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cum Michael Archangelus cum diabolo disputans altercaretur de Moysi corpore, non est ausus judicium inferre blasphemiae: sed dixit: Imperet tibi Dominus."
      en: "When Michael the archangel, disputing with the devil, contended about the body of Moses, he durst not bring against him the judgment of railing speech, but said: The Lord command thee."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Hi autem quaecumque quidem ignorant, blasphemant: quaecumque autem naturaliter, tamquam muta animalia, norunt, in his corrumpuntur."
      en: "But these men blaspheme whatever things they know not: and what things soever they naturally know, like dumb beasts, in these they are corrupted."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vae illis, quia in via Cain abierunt, et errore Balaam mercede effusi sunt, et in contradictione Core perierunt!"
      en: "Woe unto them, for they have gone in the way of Cain: and after the error of Balaam they have for reward poured out themselves, and have perished in the contradiction of Core."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Hi sunt in epulis suis maculae, convivantes sine timore, semetipsos pascentes, nubes sine aqua, quae a ventis circumferentur, arbores autumnales, infructuosae, bis mortuae, eradicatae,"
      en: "These are spots in their banquets, feasting together without fear, feeding themselves, clouds without water, which are carried about by winds, trees of the autumn, unfruitful, twice dead, plucked up by the roots,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "fluctus feri maris, despumantes suas confusiones, sidera errantia: quibus procella tenebrarum servata est in aeternum."
      en: "Raging waves of the sea, foaming out their own confusion; wandering stars, to whom the storm of darkness is reserved for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Prophetavit autem et de his septimus ab Adam Enoch, dicens: Ecce venit Dominus in sanctis millibus suis"
      en: "Now of these Enoch also, the seventh from Adam, prophesied, saying: Behold, the Lord cometh with thousands of his saints,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "facere judicium contra omnes, et arguere omnes impios de omnibus operibus impietatis eorum, quibus impie egerunt, et de omnibus duris, quae locuti sunt contra Deum peccatores impii."
      en: "To execute judgment upon all, and to reprove all the ungodly for all the works of their ungodliness, whereby they have done ungodly, and of all the hard things which ungodly sinners have spoken against God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Hi sunt murmuratores querulosi, secundum desideria sua ambulantes, et os eorum loquitur superba, mirantes personas quaestus causa."
      en: "These are murmurers, full of complaints, walking according to their own desires, and their mouth speaketh proud things, admiring persons for gain's sake."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Vos autem carissimi, memores estote verborum, quae praedicta sunt ab apostolis Domini nostri Jesu Christi,"
      en: "But you, my dearly beloved, be mindful of the words which have been spoken before by the apostles of our Lord Jesus Christ,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui dicebant vobis, quoniam in novissimo tempore venient illusores, secundum desideria sua ambulantes in impietatibus."
      en: "Who told you, that in the last time there should come mockers, walking according to their own desires in ungodlinesses."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Hi sunt, qui segregant semetipsos, animales, Spiritum non habentes."
      en: "These are they, who separate themselves, sensual men, having not the Spirit."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vos autem carissimi superaedificantes vosmetipsos sanctissimae vestrae fidei, in Spiritu Sancto orantes,"
      en: "But you, my beloved, building yourselves upon your most holy faith, praying in the Holy Ghost,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "vosmetipsos in dilectione Dei servate, exspectantes misericordiam Domini nostri Jesu Christi in vitam aeternam."
      en: "Keep yourselves in the love of God, waiting for the mercy of our Lord Jesus Christ, unto life everlasting."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et hos quidem arguite judicatos:"
      en: "And some indeed reprove, being judged:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "illos vero salvate, de igne rapientes. Aliis autem miseremini in timore: odientes et eam, quae carnalis est, maculatam tunicam."
      en: "But others save, pulling them out of the fire. And on others have mercy, in fear, hating also the spotted garment which is carnal."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ei autem qui potens est vos conservare sine peccato et constituere ante conspectum gloriae suae immaculatos in exsultatione in adventu Domini nostri Jesu Christi,"
      en: "Now to him who is able to preserve you without sin, and to present you spotless before the presence of his glory with exceeding joy, in the coming of our Lord Jesus Christ,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "soli Deo Salvatori nostro, per Jesum Christum Dominum nostrum, gloria et magnificentia, imperium et potestas ante omne saeculum, et nunc, et in omnia saecula saeculorum. Amen."
      en: "To the only God our Saviour through Jesus Christ our Lord, be glory and magnificence, empire and power, before all ages, and now, and for all ages of ages. Amen."
    status: { la: verified, en: verified }
