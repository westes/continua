# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 2
verses:
  - n: 1
    text:
      la: "anima cum obtulerit oblationem sacrificii Domino simila erit eius oblatio fundetque super eam oleum et ponet tus"
      en: "When any one shall offer an oblation of sacrifice to the Lord, his offering shall be of fine flour, and he shall pour oil upon it, and put frankincense,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ac deferet ad filios Aaron sacerdotes quorum unus tollet pugillum plenum similae et olei ac totum tus et ponet memoriale super altare in odorem suavissimum Domino"
      en: "And shall bring it to the sons of Aaron the priests: and one of them shall take a handful of the flour and oil, and all the frankincense, and shall put it a memorial upon the altar for a most sweet savour to the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quod autem reliquum fuerit de sacrificio erit Aaron et filiorum eius sanctum sanctorum de oblationibus Domini"
      en: "And the remnant of the sacrifice shall be Aaron's, and his sons', holy of holies of the offerings of the Lord."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cum autem obtuleris sacrificium coctum in clibano de simila panes scilicet absque fermento conspersos oleo et lagana azyma oleo lita"
      en: "But when thou offerest a sacrifice baked in the oven of flour, to wit, loaves without leaven, tempered with oil, and unleavened wafers, anointed with oil:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "si oblatio tua fuerit de sartagine similae conspersae oleo et absque fermento"
      en: "If thy oblation be from the fryingpan, of flour tempered with oil, and without leaven,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "divides eam minutatim et fundes supra oleum"
      en: "Thou shalt divide it into little pieces, and shalt pour oil upon it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sin autem de craticula sacrificium aeque simila oleo conspergetur"
      en: "And if the sacrifice be from the gridiron, in like manner the flour shall be tempered with oil:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quam offeres Domino tradens manibus sacerdotis"
      en: "And when thou offerest it to the Lord, thou shalt deliver it to the hands of the priest."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui cum obtulerit eam tollet memoriale de sacrificio et adolebit super altare in odorem suavitatis Domino"
      en: "And when he hath offered it, he shall take a memorial out of the sacrifice, and burn it upon the altar for a sweet savour to the Lord."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quicquid autem reliquum est erit Aaron et filiorum eius sanctum sanctorum de oblationibus Domini"
      en: "And whatsoever is left, shall be Aaron's, and his sons', holy of holies of the offerings of the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "omnis oblatio quae offertur Domino absque fermento fiet nec quicquam fermenti ac mellis adolebitur in sacrificio Domini"
      en: "Every oblation that is offered to the Lord shall be made without leaven, neither shall any leaven or honey be burnt in the sacrifice to the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "primitias tantum eorum offeretis et munera super altare vero non ponentur in odorem suavitatis"
      en: "You shall offer only the firstfruits of them and gifts: but they shall not be put upon the altar, for a savour of sweetness,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quicquid obtuleris sacrificii sale condies nec auferes sal foederis Dei tui de sacrificio tuo in omni oblatione offeres sal"
      en: "Whatsoever sacrifice thou offerest, thou shalt season it with salt, neither shalt thou take away the salt of the covenant of thy God from thy sacrifice. In all thy oblations thou shalt offer salt."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sin autem obtuleris munus primarum frugum tuarum Domino de spicis adhuc virentibus torres eas igni et confringes in morem farris et sic offeres primitias tuas Domino"
      en: "But if thou offer a gift of the firstfruits of thy corn to the Lord, of the ears yet green, thou shalt dry it at the fire, and break it small like meal, and so shalt thou offer thy firstfruits to the Lord,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "fundens supra oleum et tus inponens quia oblatio Domini est"
      en: "Pouring oil upon it and putting on frankincense, because it is the oblation of the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "de qua adolebit sacerdos in memoriam muneris partem farris fracti et olei ac totum tus"
      en: "Whereof the priest shall burn for a memorial of the gift, part of the corn broken small and of the oil, and all the frankincense."
    status: { la: verified, en: verified }
