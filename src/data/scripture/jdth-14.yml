# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdth
chapter: 14
verses:
  - n: 1
    text:
      la: "Dixit autem Judith ad omnem populum: Audite me, fratres: suspendite caput hoc super muros nostros:"
      en: "And Judith said to all the people: Hear me, my brethren, hang ye up this head upon our walls."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et erit, cum exierit sol, accipiat unusquisque arma sua, et exite cum impetu, non ut descendatis deorsum, sed quasi impetum facientes."
      en: "And as soon as the sun shall rise, let every man take his arms, and rush ye out, not as going down beneath, but as making an assault."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tunc exploratores necesse erit ut fugiant ad principem suum excitandum ad pugnam."
      en: "Then the watchmen must needs run to awake their prince for the battle."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cumque duces eorum cucurrerint ad tabernaculum Holofernis, et invenerint eum truncum in suo sanguine volutatum, decidet super eos timor."
      en: "And when the captains of them shall run to the tent of Holofernes, and shall find him without his head wallowing in his blood, fear shall fall upon them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque cognoveritis fugere eos, ite post illos securi, quoniam Dominus conteret eos sub pedibus vestris."
      en: "And when you shall know that they are fleeing, go after them securely, for the Lord will destroy them under your feet."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Tunc Achior, videns virtutem quam fecit Deus Israel, relicto gentilitatis ritu, credidit Deo, et circumcidit carnem praeputii sui, et appositus est ad populum Israel, et omnis successio generis ejus usque in hodiernum diem."
      en: "Then Achior seeing the power that the God of Israel had wrought, leaving the religion of the gentiles, he believed God, and circumcised the flesh of his foreskin, and was joined to the people of Israel, with all the succession of his kindred until this present day."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Mox autem ut ortus est dies, suspenderunt super muros caput Holofernis, accepitque unusquisque vir arma sua, et egressi sunt cum grandi strepitu et ululatu."
      en: "And immediately at break of day, they hung up the head of Holofernes upon the walls, and every man took his arms, and they sent out with a great noise and shouting."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quod videntes exploratores, ad tabernaculum Holofernis cucurrerunt."
      en: "And the watchmen seeing this, ran to the tent of Holofernes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Porro hi qui in tabernaculo erant, venientes, et ante ingressum cubiculi, perstrepentes, excitandi gratia, inquietudinem arte moliebantur, ut non ab excitantibus, sed a sonantibus Holofernes evigilaret."
      en: "And they that were in the tent came, and made a noise before the door of the chamber to awake him, endeavouring by art to break his rest, that Holofernes might awake, not by their calling him, but by their noise."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nullus enim audebat cubiculum virtutis Assyriorum pulsando aut intrando aperire."
      en: "For no man durst knock, or open and go into the chamber of the general of the Assyrians."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sed cum venissent ejus duces ac tribuni, et universi majores exercitus regis Assyriorum, dixerunt cubiculariis:"
      en: "But when his captains and tribunes were come, and all the chiefs of the army of the king of the Assyrians, they said to the chamberlains:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Intrate, et excitate illum, quoniam egressi mures de cavernis suis, ausi sunt provocare nos ad praelium."
      en: "Go in, and awake him, for the mice coming out of their holes, have presumed to challenge us to fight."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tunc ingressus Vagao cubiculum ejus, stetit ante cortinam, et plausum fecit manibus suis: suspicabatur enim illum cum Judith dormire."
      en: "Then Vagao going into his chamber, stood before the curtain, and made a clapping with his hands: for he thought that he was sleeping with Judith."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Sed cum nullum motum jacentis sensu aurium caperet, accessit proximans ad cortinam, et elevans eam, vidensque cadaver absque capite Holofernis in suo sanguine tabefactum jacere super terram, exclamavit voce magna cum fletu, et scidit vestimenta sua."
      en: "But when with hearkening, he perceived no motion of one lying, he came near to the curtain, and lifting it up, and seeing the body of Holofernes, lying upon the ground, without the head, sweltering in his blood, he cried out with a loud voice, with weeping, and rent his garments."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ingressus tabernaculum Judith, non invenit eam, et exiliit foras ad populum,"
      en: "And he went into the tent of Judith, and not finding her, he ran out to the people,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dixit: Una mulier hebraea fecit confusionem in domo regis Nabuchodonosor: ecce enim Holofernes jacet in terra, et caput ejus non est in illo."
      en: "And said: One Hebrew woman hath made confusion in the house of king Nabuchodonosor: for behold Holofernes lieth upon the ground, and his head is not upon him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quod cum audissent principes virtutis Assyriorum, sciderunt omnes vestimenta sua, et intolerabilis timor et tremor cecidit super eos, et turbati sunt animi eorum valde."
      en: "Now when the chiefs of the army of the Assyrians had heard this, they all rent their garments, and an intolerable fear and dread fell upon them, and their minds were troubled exceedingly."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et factus est clamor incomparabilis in medio castrorum eorum."
      en: "And there was a very great cry in the midst of their camp."
    status: { la: verified, en: verified }
