# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 10
verses:
  - n: 1
    text:
      la: "vae qui condunt leges iniquas et scribentes iniustitiam scripserunt"
      en: "Woe to them that make wicked laws: and when they write, write injustice:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ut opprimerent in iudicio pauperes et vim facerent causae humilium populi mei ut essent viduae praeda eorum et pupillos diriperent"
      en: "To oppress the poor in judgment, and do violence to the cause of the humble of my people: that widows might be their prey, and that they might rob the fatherless."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quid facietis in die visitationis et calamitatis de longe venientis ad cuius fugietis auxilium et ubi derelinquetis gloriam vestram"
      en: "What will you do in the day of visitation, and of the calamity which cometh from afar? to whom will ye flee for help? and where will ye leave your glory?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ne incurvemini sub vinculo et cum interfectis cadatis super omnibus his non est aversus furor eius sed adhuc manus eius extenta"
      en: "That you be not bowed down under the bond, and fall with the slain? In all these things his anger is not turned away, but his hand is stretched out still."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "vae Assur virga furoris mei et baculus ipse in manu eorum indignatio mea"
      en: "Woe to the Assyrian, he is the rod and the staff of my anger, and my indignation is in their hands."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ad gentem fallacem mittam eum et contra populum furoris mei mandabo illi ut auferat spolia et diripiat praedam et ponat illum in conculcationem quasi lutum platearum"
      en: "I will send him to a deceitful nation, and I will give him a charge against the people of my wrath, to take away the spoils, and to lay hold on the prey, and to tread them down like the mire of the streets."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ipse autem non sic arbitrabitur et cor eius non ita aestimabit sed ad conterendum erit cor eius et ad internicionem gentium non paucarum"
      en: "But he shall not take it so, and his heart shall not think so: but his heart shall be set to destroy, and to cut off nations not a few."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dicet enim"
      en: "For he shall say:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "numquid non principes mei simul reges sunt numquid non ut Charchamis sic Chalanno et ut Arfad sic Emath numquid non ut Damascus sic Samaria"
      en: "Are not my princes as so many kings ? is not Calano as Charcamis: and Emath as Arphad? is not Samaria as Damascus?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quomodo invenit manus mea regna idoli sic et simulacra eorum de Hierusalem et de Samaria"
      en: "As my hand hath found the king- dome of the idol, so also their idols of Jerusalem, and of Samaria."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "numquid non sicut feci Samariae et idolis eius sic faciam Hierusalem et simulacris eius"
      en: "Shall I not, as I have done to Samaria and her idols, so do to Jerusalem and her idols?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et erit cum impleverit Dominus cuncta opera sua in monte Sion et in Hierusalem visitabo super fructum magnifici cordis regis Assur et super gloriam altitudinis oculorum eius"
      en: "And it shall come to pass, that when the Lord shall have performed all his works in mount Sion, and in Jerusalem, I will visit the fruit of the proud heart of the king of Assyria, and the glory of the haughtiness of his eyes."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit enim in fortitudine manus meae feci et in sapientia mea intellexi et abstuli terminos populorum et principes eorum depraedatus sum et detraxi quasi potens in sublime residentes"
      en: "For he hath said: By the strength of my own hand I have done it, and by my own wisdom I have understood: and I have removed the bounds of the people, and have taken the spoils of the princes, and as a mighty man hath pulled down them that sat on high."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et invenit quasi nidum manus mea fortitudinem populorum et sicut colliguntur ova quae derelicta sunt sic universam terram ego congregavi et non fuit qui moveret pinnam et aperiret os et ganniret"
      en: "And my hand hath found the strength of the people as a nest; and as eggs are gathered, that are left, so have I gathered all the earth: and there was none that moved the wing, or opened the mouth, or made the least noise."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "numquid gloriabitur securis contra eum qui secat in ea aut exaltabitur serra contra eum a quo trahitur quomodo si elevetur virga contra levantem se et exaltetur baculus qui utique lignum est"
      en: "Shall the axe boast itself against him that cutteth with it? or shall the saw exalt itself against him by whom it is drawn? as if a rod should lift itself up against him that lifteth it up, and a staff exalt itself, which is but wood."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "propter hoc mittet Dominator Deus exercituum in pinguibus eius tenuitatem et subtus gloriam eius succensa ardebit quasi conbustio ignis"
      en: "Therefore the sovereign Lord, the Lord of hosts, shall send leanness among his fat ones: and under his glory shall be kindled a burning, as it were the burning of a fire."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et erit lumen Israhel in igne et Sanctus eius in flamma et succendetur et devorabitur spina eius et vepres in die una"
      en: "And the light of Israel shall be as a fire, and the Holy One thereof as a flame: and his thorns and his briers shall be set on fire, and shall be devoured in one day."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et gloria saltus eius et Carmeli eius ab anima usque ad carnem consumetur et erit terrore profugus"
      en: "And the glory of his forest, and of his beautiful hill, shall be consumed from the soul even to the flesh, and he shall run away through fear."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et reliquiae ligni saltus eius pro paucitate numerabuntur et puer scribet eos"
      en: "And they that remain of the trees of his forest shall be so few, that they shall easily be numbered, and a child shall write them down."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et erit in die illa non adiciet residuum Israhel et hii qui fugerint de domo Iacob inniti super eo qui percutit eos sed innitetur super Dominum Sanctum Israhel in veritate"
      en: "And it shall come to pass in that day, that the remnant of Israel, and they that shall escape of the house of Jacob, shall lean no more upon him that striketh them: but they shall lean upon the Lord the Holy One of Israel, in truth."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "reliquiae convertentur reliquiae inquam Iacob ad Deum fortem"
      en: "The remnant shall be converted, the remnant, I say, of Jacob, to the mighty God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "si enim fuerit populus tuus Israhel quasi harena maris reliquiae convertentur ex eo consummatio adbreviata inundabit iustitiam"
      en: "For if thy people, O Israel, shall be as the sand of the sea, a remnant of them shall be converted, the consumption abridged shall overflow with justice."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "consummationem enim et adbreviationem Dominus Deus exercituum faciet in medio omnis terrae"
      en: "For the Lord God of hosts shall make a consumption, and an abridgment in the midst of all the land."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "propter hoc haec dicit Dominus Deus exercituum noli timere populus meus habitator Sion ab Assur in virga percutiet te et baculum suum levabit super te in via Aegypti"
      en: "Therefore, thus saith the Lord the God of hosts: O my people that dwellest in Sion, be not afraid of the Assyrian: he shall strike thee with his rod, and he shall lift up his staff over thee in the way of Egypt."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "adhuc enim paululum modicumque et consummabitur indignatio et furor meus super scelus eorum"
      en: "For yet a little and a very little while, and my indignation shall cease, and my wrath shall be upon their wickedness."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et suscitabit super eum Dominus exercituum flagellum iuxta plagam Madian in petra Oreb et virgam suam super mare et levabit eam in via Aegypti"
      en: "And the Lord of hosts shall raise up a scourge against him, according to the slaughter of Madian in the rock of Oreb, and his rod over the sea, and he shall lift it up in the way of Egypt."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et erit in die illa auferetur onus eius de umero tuo et iugum eius de collo tuo et conputrescet iugum a facie olei"
      en: "And it shall come to pass in that day, that his burden shall be taken away from off thy shoulder, and his yoke from off thy neck, and the yoke shall putrify at the presence of the oil."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "veniet in Aiath transibit in Magron apud Machmas commendabit vasa sua"
      en: "He shall come into Aiath, he shall pass into Magron: at Machmas he shall lay up his carriages."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "transierunt cursim Gabee sedes nostra obstipuit Rama Gabaath Saulis fugit"
      en: "They have passed in haste, Gaba is our lodging: Rama was astonished, Gabaath of Saul fled away."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "hinni voce tua filia Gallim adtende Laisa paupercula Anathoth"
      en: "Lift up thy voice, O daughter of Gallim, attend, O Laisa, poor Anathoth."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "migravit Medemena habitatores Gebim confortamini"
      en: "Medemena is removed: ye inhabitants of Gabim, take courage."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "adhuc dies est ut in Nob stetur agitabit manum suam super montem filiae Sion collem Hierusalem"
      en: "It is yet day enough, to remain in Nobe: he shall shake his hand against the mountain of the daughter of Sion, the hill of Jerusalem."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ecce Dominator Dominus exercituum confringet lagunculam in terrore et excelsi statura succidentur et sublimes humiliabuntur"
      en: "Behold the sovereign Lord of hosts shall break the earthen vessel with terror, and the tall of stature shall be cut down, and the lofty shall be humbled."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et subvertentur condensa saltus ferro et Libanus cum excelsis cadet"
      en: "And the thickets of the forest shall be cut down with iron, and Libanus with its high ones shall fall."
    status: { la: verified, en: verified }
