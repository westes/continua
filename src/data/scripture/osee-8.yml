# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: osee
chapter: 8
verses:
  - n: 1
    text:
      la: "In gutture tuo sit tuba quasi aquila super domum Domini, pro eo quod transgressi sunt foedus meum, et legem meam praevaricati sunt."
      en: "Let there be a trumpet in thy throat like an eagle upon the house of the Lord: because they have transgressed my covenant, and have violated my law."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Me invocabunt: Deus meus, cognovimus te Israel."
      en: "They shall call upon me: O my God, we, Israel, know thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Projecit Israel bonum: inimicus persequetur eum."
      en: "Israel hath cast off the thing that is good, the enemy shall pursue him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ipsi regnaverunt, et non ex me; principes exstiterunt, et non cognovi: argentum suum et aurum suum fecerunt sibi idola, ut interirent."
      en: "They have reigned, but not by me: they have been princes, and I knew not: of their silver, and their gold they have made idols to themselves, that they might perish."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Projectus est vitulus tuus, Samaria; iratus est furor meus in eos. Usquequo non poterunt emundari?"
      en: "Thy calf, O Samaria, is cast off, my wrath is kindled against them. How long will they be incapable of being cleansed?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quia ex Israel et ipse est: artifex fecit illum, et non est Deus; quoniam in aranearum telas erit vitulus Samariae."
      en: "For itself also is the invention of Israel: a workman made it, and it is no god: for the calf of Samaria shall be turned to spiders' webs."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quia ventum seminabunt, et turbinem metent: culmus stans non est in eo; germen non faciet farinam: quod etsi fecerit, alieni comedent eam."
      en: "For they shall sow wind, and reap a whirlwind, there is no standing stalk in it, the bud shall yield no meal; and if it should yield, strangers shall eat it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Devoratus est Israel; nunc factus est in nationibus quasi vas immundum."
      en: "Israel is swallowed up: now is he become among the nations like an unclean vessel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quia ipsi ascenderunt ad Assur, onager solitarius sibi; Ephraim munera dederunt amatoribus."
      en: "For they are gone up to Assyria, a wild ass alone by himself: Ephraim hath given gifts to his lovers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Sed et cum mercede conduxerint nationes, nunc congregabo eos, et quiescent paulisper ab onere regis et principum."
      en: "But even though they shall have hired the nations, now will I gather them together: and they shall rest a while from the burden of the king, and the princes."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quia multiplicavit Ephraim altaria ad peccandum; factae sunt ei arae in delictum."
      en: "Because Ephraim hath made many altars to sin: altars are become to him unto sin."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Scribam ei multiplices leges meas, quae velut alienae computatae sunt."
      en: "I shall write to him my manifold laws, which have been accounted as foreign."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Hostias offerent, immolabunt carnes et comedent, et Dominus non suscipiet eas: nunc recordabitur iniquitatis eorum, et visitabit peccata eorum: ipsi in Aegyptum convertentur."
      en: "They shall offer victims, they shall sacrifice flesh, and shall eat it, and the Lord will not receive them: now will he remember their iniquity, and will visit their sins: they shall return to Egypt."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et oblitus est Israel factoris sui, et aedificavit delubra; et Judas multiplicavit urbes munitas; et mittam ignem in civitates ejus, et devorabit aedes illius."
      en: "And Israel hath forgotten his Maker, and hath built temples: and Juda hath built many fenced cities: and I will send a fire upon his cities, and it shall devour the houses thereof."
    status: { la: verified, en: verified }
