# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 30
verses:
  - n: 1
    text:
      la: "Cernens autem Rachel quod infecunda esset, invidit sorori suae, et ait marito suo: Da mihi liberos, alioquin moriar."
      en: "And Rachel, seeing herself without children, envied her sister, and said to her husband: Give me children, otherwise I shall die."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cui iratus respondit Jacob: Num pro Deo ego sum, qui privavit te fructu ventris tui?"
      en: "And Jacob being angry with her, answered: Am I as God, who hath deprived thee of the fruit of thy womb?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "At illa: Habeo, inquit, famulam Balam: ingredere ad illam, ut pariat super genua mea, et habeam ex illa filios."
      en: "But she said: I have here my servant Bala: go in unto her, that she may bear upon my knees, and I may have children by her."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Deditque illi Balam in conjugium: quae,"
      en: "And she gave him Bala in marriage: who,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ingresso ad se viro, concepit, et peperit filium."
      en: "When her husband had gone in unto her, conceived and bore a son."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixitque Rachel: Judicavit mihi Dominus, et exaudivit vocem meam, dans mihi filium, et idcirco appellavit nomen ejus Dan."
      en: "And Rachel said: The Lord hath judged for me, and hath heard my voice, giving me a son, and therefore she called his name Dan."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Rursumque Bala concipiens, peperit alterum,"
      en: "And again Bala conceived and bore another,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "pro quo ait Rachel: Comparavit me Deus cum sorore mea, et invalui: vocavitque eum Nephthali."
      en: "For whom Rachel said: God hath compared me with my sister, and I have prevailed: and she called him Nephtali."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sentiens Lia quod parere desiisset, Zelpham ancillam suam marito tradidit."
      en: "Lia, perceiving that she had left off bearing, gave Zelpha her handmaid to her husband."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Qua post conceptum edente filium,"
      en: "And when she had conceived and brought forth a son,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixit: Feliciter, et idcirco vocavit nomen ejus Gad."
      en: "She said: Happily. And therefore called his name Gad."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Peperit quoque Zelpha alterum."
      en: "Zelpha also bore another."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dixitque Lia: Hoc pro beatitudine mea: beatam quippe me dicent mulieres: propterea appellavit eum Aser."
      en: "And Lia said: This is for my happiness: for women will call me blessed. Therefore she called him Aser."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Egressus autem Ruben tempore messis triticeae in agrum, reperit mandragoras, quas matri Liae detulit. Dixitque Rachel: Da mihi partem de mandragoris filii tui."
      en: "And Ruben, going out in the time of the wheat harvest into the field, found mandrakes: which he brought to his mother Lia. And Rachel said: Give me part of thy son's mandrakes."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Illa respondit: Parumne tibi videtur quod praeripueris maritum mihi, nisi etiam mandragoras filii mei tuleris? Ait Rachel: Dormiat tecum hac nocte pro mandragoris filii tui."
      en: "She answered: Dost thou think it a small matter, that thou hast taken my husband from me, unless thou take also my son's mandrakes? Rachel said: He shall sleep with thee this night, for thy son's mandrakes."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Redeuntique ad vesperam Jacob de agro, egressa est in occursum ejus Lia, et Ad me, inquit, intrabis: quia mercede conduxi te pro mandragoris filii mei. Dormivitque cum ea nocte illa."
      en: "And when Jacob returned at even from the field, Lia went out to meet him, and said: Thou shalt come in unto me, because I have hired thee for my son's mandrakes. And he slept with her that night."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et exaudivit Deus preces ejus, concepitque et peperit filium quintum,"
      en: "And God heard her prayers: and she conceived and bore the fifth son,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ait: Dedit Deus mercedem mihi, quia dedi ancillam meam viro meo: appellavitque nomen ejus Issachar."
      en: "And said: God hath given me a reward, because I gave my handmaid to my husband. And she called his name Issachar."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Rursum Lia concipiens, peperit sextum filium,"
      en: "And Lia conceived again, and bore the sixth son,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et ait: Dotavit me Deus dote bona: etiam hac vice mecum erit maritus meus, eo quod genuerim ei sex filios: et idcirco appellavit nomen ejus Zabulon."
      en: "And said: God hath endowed me with a good dowry: this turn also my husband will be with me, because I have borne him six sons: and therefore she called his name Zabulon."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Post quem peperit filiam, nomine Dinam."
      en: "After whom she bore a daughter, named Dina."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Recordatus quoque Dominus Rachelis, exaudivit eam, et aperuit vulvam ejus."
      en: "The Lord also remembering Rachel, heard her, and opened her womb."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quae concepit, et peperit filium, dicens: Abstulit Deus opprobrium meum."
      en: "And she conceived, and bore a son, saying: God hath taken away my reproach."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et vocavit nomen ejus Joseph, dicens: Addat mihi Dominus filium alterum."
      en: "And she called his name Joseph, saying: The Lord give me also another son."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Nato autem Joseph, dixit Jacob socero suo: Dimitte me ut revertar in patriam, et ad terram meam."
      en: "And when Joseph was born, Jacob said to his father in law: Send me away that I may return into my country, and to my land."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Da mihi uxores, et liberos meos, pro quibus servivi tibi, ut abeam: tu nosti servitutem qua servivi tibi."
      en: "Give me my wives, and my children, for whom I have served thee, that I may depart: thou knowest the service that I have rendered thee."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ait illi Laban: Inveniam gratiam in conspectu tuo, experimento didici, quia benedixerit mihi Deus propter te:"
      en: "Laban said to him: Let me find favour in thy sight: I have learned by experience, that God hath blessed me for thy sake."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "constitue mercedem tuam quam dem tibi."
      en: "Appoint thy wages which I shall give thee."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "At ille respondit: Tu nosti quomodo servierim tibi, et quanta in manibus meis fuerit possessio tua."
      en: "But he answered: Thou knowest how I have served thee, and how great thy possession hath been in my hands."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Modicum habuisti antequam venirem ad te, et nunc dives effectus es: benedixitque tibi Dominus ad introitum meum. Justum est igitur ut aliquando provideam etiam domui meae."
      en: "Thou hadst but little before I came to thee, and now thou art become rich: and the Lord hath blessed thee at my coming. It is reasonable therefore that I should now provide also for my own house."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Dixitque Laban: Quid tibi dabo? At ille ait: Nihil volo: sed si feceris quod postulo, iterum pascam, et custodiam pecora tua."
      en: "And Laban said: What shall I give thee? But he said: I require nothing: but if thou wilt do what I demand, I will feed, and keep thy sheep again."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Gyra omnes greges tuos, et separa cunctas oves varias, et sparso vellere; quodcumque furvum, et maculosum, variumque fuerit, tam in ovibus quam in capris, erit merces mea."
      en: "Go round through all thy flocks, and separate all the sheep of divers colours, and speckled: and all that is brown and spotted, and of divers colours, as well among the sheep, as among the goats, shall be my wages."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Respondebitque mihi cras justitia mea, quando placiti tempus advenerit coram te: et omnia quae non fuerint varia, et maculosa, et furva, tam in ovibus quam in capris, furti me arguent."
      en: "And my justice shall answer for me tomorrow before thee when the time of the bargain shall come: and all that is not of divers colours, and spotted, and brown, as well among the sheep as among the goats, shall accuse me of theft."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Dixitque Laban: Cratum habeo quod petis."
      en: "And Laban said: I like well what thou demandest."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et separavit in die illa capras, et oves, et hircos, et arietes varios, atque maculosos: cunctum autem gregem unicolorem, id est albi et nigri velleris, tradidit in manu filiorum suorum."
      en: "And he separated the same day the she goats, and the sheep, and the he goats, and the rams of divers colours, and spotted: and all the flock of one colour, that is, of white and black fleece, he delivered into the hands of his sons."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et posuit spatium itineris trium dierum inter se et generum, qui pascebat reliquos greges ejus."
      en: "And he set the space of three days' journey betwixt himself and his son in law, who fed the rest of his flock."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Tollens ergo Jacob virgas populeas virides, et amygdalinas, et ex platanis, ex parte decorticavit eas: detractisque corticibus, in his, quae spoliata fuerant, candor apparuit: illa vero quae integra fuerant, viridia permanserunt: atque in hunc modum color effectus est varius."
      en: "And Jacob took green rods of poplar, and of almond, and of plane trees, and pilled them in part: so when the bark was taken off, in the parts that were pilled, there appeared whiteness: but the parts that were whole remained green: and by this means the colour was divers."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Posuitque eas in canalibus, ubi effundebatur aqua: ut cum venissent greges ad bibendum, ante oculos haberent virgas, et in aspectu earum conciperent."
      en: "And he put them in the troughs, where the water was poured out: that when the flocks should come to drink, they might have the rods before their eyes, and in the sight of them might conceive."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Factumque est ut in ipso calore coitus, oves intuerentur virgas, et parerent maculosa, et varia, et diverso colore respersa."
      en: "And it came to pass that in the very heat of coition, the sheep beheld the rods, and brought forth spotted, and of divers colours, and speckled."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Divisitque gregem Jacob, et posuit virgas in canalibus ante oculos arietum: erant autem alba et nigra quaeque, Laban; cetera vero, Jacob, separatis inter se gregibus."
      en: "And Jacob separated the flock, and put the rods in the troughs before the eyes of the rams: and all the white and the black were Laban's: and the rest were Jacob's, when the flocks were separated one from the other."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Igitur quando primo tempore ascendebantur oves, ponebat Jacob virgas in canalibus aquarum ante oculos arietum et ovium, ut in earum contemplatione conciperent:"
      en: "So when the ewes went first to ram, Jacob put the rods in the troughs of water before the eyes of the rams, and of the ewes, that they might conceive while they were looking upon them:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "quando vero serotina admissura erat, et conceptus extremus, non ponebat eas. Factaque sunt ea quae erant serotina, Laban: et quae primi temporis, Jacob."
      en: "But when the latter coming was, and the last conceiving, he did not put them. And those that were lateward, became Laban's: and they of the first time, Jacob's."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Ditatusque est homo ultra modum, et habuit greges multos, ancillas et servos, camelos et asinos."
      en: "And the man was enriched exceedingly, and he had many flocks, maid servants and men servants, camels and asses."
    status: { la: verified, en: verified }
