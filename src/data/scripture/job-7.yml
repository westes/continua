# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 7
verses:
  - n: 1
    text:
      la: "Militia est vita hominis super terram; et sicut dies mercenarii, dies ejus."
      en: "The life of man upon earth is a warfare, and his days are like the days of a hireling."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sicut servus desiderat umbram, et sicut mercenarius praestolatur finem operis sui,"
      en: "As a servant longeth for the shade, as the hireling looketh for the end of his work;"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sic et ego habui menses vacuos, et noctes laboriosas enumeravi mihi."
      en: "So I also have had empty months, and have numbered to myself wearisome nights."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Si dormiero, dicam: Quando consurgam? et rursum expectabo vesperam, et replebor doloribus usque ad tenebras."
      en: "If I lie down to sleep, I shall say: When shall I arise? and again I shall look for the evening, and shall be filled with sorrows even till darkness."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Induta est caro mea putredine; et sordibus pulveris cutis mea aruit et contracta est."
      en: "My flesh is clothed with rottenness and the filth of dust, my skin is withered and drawn together."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dies mei velocius transierunt quam a texente tela succiditur; et consumpti sunt absque ulla spe."
      en: "My days have passed more swiftly than the web is cut by the weaver, and are consumed without any hope."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Memento quia ventus est vita mea, et non revertetur oculus meus ut videat bona."
      en: "Remember that my life is but wind, and my eyes shall not return to see good things."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nec aspiciet me visus hominis; oculi tui in me, et non subsistam."
      en: "Nor shall the sight of man behold me: thy eyes are upon me, and I shall be no more."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sicut consumitur nubes, et pertransit, sic qui descenderit ad inferos, non ascendet."
      en: "As a cloud is consumed, and passeth away: so he that shall go down to hell shall not come up."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nec revertetur ultra in domum suam, neque cognoscet eum amplius locus ejus."
      en: "Nor shall he return any more into his house, neither shall his place know him any more."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quapropter et ego non parcam ori meo; loquar in tribulatione spiritus mei, confabulabor cum amaritudine animae meae."
      en: "Wherefore I will not spare my mouth, I will speak in the affliction of my spirit: I will talk with the bitterness of my soul."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Numquid mare ego sum, aut cetus, quia circumdedisti me carcere?"
      en: "Am I a sea, or a whale, that thou hast enclosed me in a prison?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si dixero: Consolabitur me lectulus meus, et relevabor loquens mecum in strato meo;"
      en: "If I say: My bed shall comfort me, and I shall be relieved speaking with myself on my couch:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "terrebis me per somnia, et per visiones horrore concuties."
      en: "Thou wilt frighten me with dreams and terrify me with visions."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quam ob rem elegit suspendium anima mea, et mortem ossa mea."
      en: "So that my soul rather chooseth hanging, and my bones death."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Desperavi, nequaquam ultra jam vivam; parce mihi, nihil enim sunt dies mei."
      en: "I have done with hope, I shall now live no longer: spare me, for my days are nothing."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quid est homo, quia magnificas eum? aut quid apponis erga eum cor tuum?"
      en: "What is a man that thou shouldst magnify him? or why dost thou set thy heart upon him?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Visitas eum diluculo, et subito probas illum."
      en: "Thou visitest him early in the morning, and thou provest him suddenly."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Usquequo non parcis mihi, nec dimittis me ut glutiam salivam meam?"
      en: "How long wilt thou not spare me, nor suffer me to swallow down my spittle?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Peccavi; quid faciam tibi, o custos hominum? Quare posuisti me contrarium tibi, et factus sum mihimetipsi gravis?"
      en: "I have sinned: what shall I do to thee, O keeper of men? why hast thou set me opposite to thee, and I am become burdensome to myself?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Cur non tollis peccatum meum, et quare non aufers iniquitatem meam? Ecce nunc in pulvere dormiam; et si mane me quaesieris, non subsistam."
      en: "Why dost thou not remove my sin, and why dost thou not take away my iniquity? Behold now I shall sleep in the dust: and if thou seek me in the morning, I shall not be."
    status: { la: verified, en: verified }
