# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1mach
chapter: 1
verses:
  - n: 1
    text:
      la: "et factum est postquam percussit Alexander Philippi Macedo qui primus regnavit in Graecia egressus de terra Cetthim Darium regem Persarum et Medorum"
      en: "Now it came to pass, after that Alexander the son of Philip the Macedonian, who first reigned in Greece, coming out of the land of Cethim, had overthrown Darius king of the Persians and Medes:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "constituit proelia multa et omnium obtinuit munitiones et interfecit reges terrae"
      en: "He fought many battles, and took the strong holds of all, and slew the kings of the earth:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et pertransiit usque ad fines terrae et accepit spolia multitudinis gentium et siluit terra in conspectu eius"
      en: "And he went through even to the ends of the earth, and took the spoils of many nations: and the earth was quiet before him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et congregavit virtutem exercituum fortem nimis et exaltatum est et elevatum cor eius"
      en: "And he gathered a power, and a very strong army: and his heart was exalted and lifted up."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et obtinuit regiones gentium et tyrannos et facti sunt illi in tributum"
      en: "And he subdued countries of nations, and princes: and they became tributaries to him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et post haec decidit in lectum et cognovit quia moritur"
      en: "And after these things, he fell down upon his bed, and knew that he should die."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et vocavit pueros suos nobiles qui secum erant nutriti a iuventute et divisit illis regnum suum cum adhuc viveret"
      en: "And he called his servants the nobles that were brought up with him from his youth: and he divided his kingdom among them, while he was yet alive."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et regnavit Alexander annis duodecim et mortuus est"
      en: "And Alexander reigned twelve years, and he died."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et obtinuerunt pueri eius regnum unusquisque in loco suo"
      en: "And his servants made themselves kings every one in his place:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et inposuerunt sibi omnes diademata post mortem eius et filii eorum post eos annis multis et multiplicata sunt mala in terra"
      en: "And they all put crowns upon themselves after his death, and their sons after them many years, and evils were multiplied in the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et exiit ex eis radix peccatrix Antiochus Inlustris filius Antiochi regis qui fuerat Romae obses et regnavit in anno centesimo tricesimo et septimo regni Graecorum"
      en: "And there came out of them a wicked root, Antiochus the Illustrious, the son of king Antiochus, who had been a hostage at Rome: and he reigned in the hundred and thirty-seventh year of the kingdom of the Greeks."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "in diebus illis exierunt ex Israhel filii iniqui et suaserunt multis dicentes eamus et disponamus testamentum cum gentibus quae circa nos sunt quia ex quo recessimus ab eis invenerunt nos multa mala"
      en: "In those days there went out of Israel wicked men, and they persuaded many, saying: Let us go, and make a covenant with the heathens that are round about us: for since we departed from them, many evils have befallen us."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et bonus visus est sermo in oculis eorum"
      en: "And the word seemed good in their eyes."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et destinaverunt aliqui de populo et abierunt ad regem et dedit illis potestatem ut facerent iustitiam gentium"
      en: "And some of the people determined to do this, and went to the king: and he gave them license to do after the ordinances of the heathens."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et aedificaverunt gymnasium in Hierosolymis secundum leges nationum"
      en: "And they built a place of exercise in Jerusalem, according to the laws of the nations:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et fecerunt sibi praeputia et recesserunt a testamento sancto et iuncti sunt nationibus et venundati sunt ut facerent malum"
      en: "And they made themselves prepuces, and departed from the holy covenant, and joined themselves to the heathens, and were sold to do evil."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et paratum est regnum in conspectu Antiochi et coepit regnare in terra Aegypti ut regnaret super duo regna"
      en: "And the kingdom was established before Antiochus, and he had a mind to reign over the land of Egypt, that he might reign over two kingdoms."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et intravit in Aegyptum in multitudine gravi in curribus et elefantis et equitibus et copiosa navium multitudine"
      en: "And he entered into Egypt with a great multitude, with chariots and elephants, and horsemen, and a great number of ships:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et constituit bellum adversus Ptolomeum regem Aegypti et veritus est Ptolomeus a facie eius et fugit et ceciderunt vulnerati multi"
      en: "And he made war against Ptolemee king of Egypt, but Ptolemee was afraid at his presence, and fled, and many were wounded unto death."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et conprehendit civitates munitas in terra Aegypti et accepit spolia terrae Aegypti"
      en: "And he took the strong cities in the land of Egypt: and he took the spoils of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et convertit Antiochus postquam percussit Aegyptum in centesimo et quadragesimo et tertio anno et ascendit ad Israhel"
      en: "And after Antiochus had ravaged Egypt in the hundred and forty-third year, he returned and went up against Israel."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ascendit Hierosolymis in multitudine gravi"
      en: "And he went up to Jerusalem with a great multitude."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et intravit in sanctificationem cum superbia et accepit altare aureum et candelabrum luminis et universa vasa eius et mensam propositionis et libatoria et fialas et mortariola aurea et velum et coronas et ornamentum aureum quod in facie templi erat et comminuit omnia"
      en: "And he proudly entered into the sanctuary, and took away the golden altar, and the candlestick of light, and all the vessels thereof, and the table of proposition, and the pouring vessels, and the vials, and the little mortars of gold, and the veil, and the crowns, and the golden ornament that was before the temple: and he broke them all in pieces."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et accepit argentum et aurum et vasa concupiscibilia et accepit thesauros occultos quos invenit et sublatis omnibus abiit in terram suam"
      en: "And he took the silver and gold, and the precious vessels: and he took the hidden treasures which he found: and when he had taken all away he departed into his own country."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et fecit caedem hominum et locutus est superbia magna"
      en: "And he made a great slaughter of men, and spoke very proudly."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et factus est planctus magnus in Israhel et in omni loco eorum"
      en: "And there was great mourning in Israel, and in every place where they were."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et ingemuerunt principes et seniores virgines et iuvenes infirmati sunt et speciositas mulierum inmutata est"
      en: "And the princes, and the ancients mourned, and the virgins and the young men were made feeble, and the beauty of the women was changed."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "omnis maritus sumpsit lamentum quae sedebant in toro maritali lugebant"
      en: "Every bridegroom took up lamentation: and the bride that set in the marriage bed, mourned:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et commota est terra super habitantes in ea et universa domus Iacob induit confusionem"
      en: "And the land was moved for the inhabitants thereof, and all the house of Jacob was covered with confusion."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et post duos annos dierum misit rex principem tributorum in civitates Iuda et venit Hierusalem cum turba magna"
      en: "And after two full years the king sent the chief collector of his tributes to the cities of Juda, and he came to Jerusalem with a great multitude."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et locutus est ad eos verba pacifica in dolo et crediderunt ei"
      en: "And he spoke to them peaceable words in deceit: and they believed him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et inruit super civitatem repente et percussit eam plaga et perdidit populum multum ex Israhel"
      en: "And he fell upon the city suddenly, and struck it with a great slaughter, and destroyed much people in Israel."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et accepit spolia civitatis et succendit eam igni et destruxit domos eius et muros eius in circuitu"
      en: "And he took the spoils of the city, and burnt it with fire, and threw down the houses thereof, and the walls thereof round about:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et captivas duxerunt mulieres et natos et pecora possederunt"
      en: "And they took the women captive, and the children, and the cattle they possessed."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et aedificaverunt civitatem David muro magno et firmo et turribus firmis et facta est illis in arcem"
      en: "And they built the city of David with a great and strong wall, and with strong towers, and made it a fortress for them:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et posuerunt illic gentem peccatorum viros iniquos et convaluerunt in ea et posuerunt arma et escas et congregaverunt spolia Hierusalem"
      en: "And they placed there a sinful nation, wicked men, and they fortified themselves therein: and they stored up armour, and victuals, and gathered together the spoils of Jerusalem;"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et reposuerunt illic et facti sunt in laqueum magnum"
      en: "And laid them up there: and they became a great snare."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et factum est hoc ad insidias sanctificationi et in diabolum malum in Israhel"
      en: "And this was a place to lie in wait against the sanctuary, and an evil devil in Israel."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et effuderunt sanguinem innocentem per circuitum sanctificationis et contaminaverunt sanctificationem"
      en: "And they shed innocent blood round about the sanctuary, and defiled the holy place."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et fugerunt habitatores Hierusalem propter eos et facta est habitatio exterorum et facta est extera semini suo et nati eius reliquerunt eam"
      en: "And the inhabitants of Jerusalem fled away by reason of them, and the city was made the habitation to strangers, and she became a stranger to her own seed, and her children forsook her."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "sanctificatio eius desolata est sicut solitudo dies festi eius conversi sunt in luctum sabbata eius in obprobrium honores eius in nihilum"
      en: "Her sanctuary was desolate like a wilderness, her festival days were turned into mourning, her sabbaths into reproach, her honours were brought to nothing."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "secundum gloriam eius multiplicata est ignominia eius et sublimitas eius conversa est in luctum"
      en: "Her dishonour was increased according to her glory, and her excellency was turned into mourning."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et scripsit rex Antiochus omni regno suo ut esset omnis populus unus et reliquerunt unusquisque legem suam"
      en: "And king Antiochus wrote to all his kingdom, that all the people should be one: and every one should leave his own law."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et consenserunt omnes gentes secundum verbum regis Antiochi"
      en: "And all nations consented according to the word of king Antiochus."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et multi ex Israhel consenserunt ei et sacrificaverunt idolis et coinquinaverunt sabbatum"
      en: "And many of Israel consented to his service, and they sacrificed to idols, and profaned the sabbath."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et misit rex Antiochus libros per manus nuntiorum in Hierusalem et in omnes civitates Iudae ut sequerentur legem gentium terrae"
      en: "And the king sent letters by the hands of messengers to Jerusalem, and to all the cities of Juda: that they should follow the law of the nations of the earth,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et prohiberent holocausta et sacrificia et placationes fieri in templo Dei"
      en: "And should forbid holocausts and sacrifices, and atonements to be made in the temple of God."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et prohiberent celebrari sabbatum et dies sollemnes"
      en: "And should prohibit the sabbath, and the festival days, to be celebrated."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et coinquinari sancta et sanctum populum Israhel"
      en: "And he commanded the holy places to be profaned, and the holy people of Israel."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et iussit aedificari aras et templa et idola et immolari carnes suillas et pecora communia"
      en: "And he commanded altars to be built, and temples, and idols, and swine's flesh to be immolated, and unclean beasts."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et relinquere filios suos incircumcisos et coinquinari animas eorum in omnibus inmundis et abominationibus ita ut obliviscerentur legem et inmutarent omnes iustificationes Dei"
      en: "And that they should leave their children uncircumcised, and let their souls be defiled with all uncleannesses, and abominations, to the end that they should forget the law, and should change all the justifications of God."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et quicumque non fecisset secundum verbum regis Antiochi moreretur"
      en: "And that whosoever would not do according to the word of king Antiochus should be put to death."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "secundum omnia verba haec scripsit omni regno suo et praeposuit principes populo qui haec fieri cogerent"
      en: "According to all these words he wrote to his whole kingdom, and he appointed rulers over the people that should force them to do these things."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "et iusserunt civitatibus Iudae sacrificare"
      en: "And they commanded the cities of Juda to sacrifice."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "et congregati sunt multi de populo ad eos qui dereliquerant legem Domini et fecerunt mala super terram"
      en: "Then many of the people were gathered to them that had forsaken the law of the Lord: and they committed evils in the land:"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "et effugaverunt populum Israhel in abditis et in absconditis fugitivorum locis"
      en: "And they drove away the people of Israel into lurking holes, and into the secret places of fugitives."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "die quintadecima mensis casleu quinto et quadragesimo anno aedificavit rex Antiochus abominandum idolum desolationis super altare Dei et per universas civitates Iudae in circuitu aedificaverunt aras"
      en: "On the fifteenth day of the month Casleu, in the hundred and forty-fifth year, king Antiochus set up the abominable idol of desolation upon the altar of God, and they built altars throughout all the cities of Juda round about:"
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "et ante ianuas domorum et in plateis incendebant tura et sacrificabant"
      en: "And they burnt incense, and sacrificed at the doors of the houses, and in the streets."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "et libros legis Dei conbuserunt igni scindentes eos"
      en: "And they cut in pieces, and burnt with fire the books of the law of God:"
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "et apud quemcumque inveniebantur libri testamenti Domini et quicumque observabant legem Domini secundum edictum regis trucidabant eum"
      en: "And every one with whom the books of the testament of the Lord were found, and whosoever observed the law of the Lord, they put to death, according to the edict of the king."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "in virtute sua faciebant haec populo Israhel qui inveniebantur in omni mense in civitatibus"
      en: "Thus by their power did they deal with the people of Israel, that were found in the cities month after month."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "et quinta et vicesima die mensis sacrificabant super aram quae erat contra altare"
      en: "And on the five and twentieth day of the month they sacrificed upon the altar of the idol that was over against the altar of God."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "et mulieres quae circumcidebant filios suos trucidabantur secundum iussum regis Antiochi"
      en: "Now the women that circumcised their children, were slain according to the commandment of king Antiochus."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "et suspendebant pueros a cervicibus per universas domos eorum et eos qui circumciderunt eos trucidabant"
      en: "And they hanged the children about their necks in all their houses: and those that had circumcised them, they put to death."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "et multi de populo Israhel definierunt apud se ut non manducarent inmunda et elegerunt magis mori quam cibis coinquinari inmundis"
      en: "And many of the people of Israel determined with themselves, that they would not eat unclean things: and they chose rather to die than to be defiled with unclean meats."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "et noluerunt infringere legem Dei sanctam et trucidati sunt"
      en: "And they would not break the holy law of God, and they were put to death:"
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "et facta est ira magna super populum valde"
      en: "And there was very great wrath upon the people."
    status: { la: verified, en: verified }
