# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 41
verses:
  - n: 1
    text:
      la: "Non quasi crudelis suscitabo eum: quis enim resistere potest vultui meo?"
      en: "I will not stir him up, like one that is cruel: for who can resist my countenance?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quis ante dedit mihi, ut reddam ei? omnia quae sub caelo sunt, mea sunt."
      en: "Who hath given me before that I should repay him? All things that are under heaven are mine."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Non parcam ei, et verbis potentibus, et ad deprecandum compositis."
      en: "I will not spare him, nor his mighty words, and framed to make supplication."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quis revelabit faciem indumenti ejus? et in medium oris ejus quis intrabit?"
      en: "Who can discover the face of his garment? or who can go into the midst of his mouth?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Portas vultus ejus quis aperiet? per gyrum dentium ejus formido."
      en: "Who can open the doors of his face? his teeth are terrible round about."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Corpus illius quasi scuta fusilia, compactum squamis se prementibus."
      en: "His body is like molten shields, shut close up with scales pressing upon one another."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Una uni conjungitur, et ne spiraculum quidem incedit per eas."
      en: "One is joined to another, and not so much as any air can come between them:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Una alteri adhaerebit, et tenentes se nequaquam separabuntur."
      en: "They stick one to another and they hold one another fast, and shall not be separated."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sternutatio ejus splendor ignis, et oculi ejus ut palpebrae diluculi."
      en: "His sneezing is like the shining of fire, and his eyes like the eyelids of the morning."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "De ore ejus lampades procedunt, sicut taedae ignis accensae."
      en: "Out of his mouth go forth lamps, like torches of lighted fire."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "De naribus ejus procedit fumus, sicut ollae succensae atque ferventis."
      en: "Out of his nostrils goeth smoke, like that of a pot heated and boiling."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Halitus ejus prunas ardere facit, et flamma de ore ejus egreditur."
      en: "His breath kindleth coals, and a flame cometh forth out of his mouth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In collo ejus morabitur fortitudo, et faciem ejus praecedit egestas."
      en: "In his neck strength shall dwell, and want goeth before his face."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Membra carnium ejus cohaerentia sibi: mittet contra eum fulmina et ad locum alium non ferentur."
      en: "The members of his flesh cleave one to another: he shall send lightnings against him, and they shall not be carried to another place."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cor ejus indurabitur tamquam lapis, et stringetur quasi malleatoris incus."
      en: "His heart shall be as hard as a stone, and as firm as a smith's anvil."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cum sublatus fuerit, timebunt angeli, et territi purgabuntur."
      en: "When he shall raise him up, the angels shall fear, and being affrighted shall purify themselves."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cum apprehenderit eum gladius, subsitere non poterit, neque hasta, neque thorax:"
      en: "When a sword shall lay at him, it shall not be able to hold, nor a spear, nor a breastplate."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "reputabit enim quasi paleas ferrum, et quasi lignum putridum aes."
      en: "For he shall esteem iron as straw, and brass as rotten wood."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Non fugabit eum vir sagittarius: in stipulam versi sunt ei lapides fundae."
      en: "The archer shall not put him to flight, the stones of the sling are to him like stubble."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quasi stipulam aestimabit malleum, et deridebit vibrantem hastam."
      en: "As stubble will he esteem the hammer, and he will laugh him to scorn who shaketh the spear."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Sub ipso erunt radii solis, et sternet sibi aurum quasi lutum."
      en: "The beams of the sun shall be under him, and he shall strew gold under him like mire."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Fervescere faciet quasi ollam profundum mare, et ponet quasi cum unguenta bulliunt."
      en: "He shall make the deep sea to boil like a pot, and shall make it as when ointments boil."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Post eum lucebit semita: aestimabit abyssum quasi senescentem."
      en: "A path shall shine after him, he shall esteem the deep as growing old."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Non est super terram potestas quae comparetur ei, qui factus est ut nullum timeret."
      en: "There is no power upon earth that can be compared with him who was made to fear no one."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Omne sublime videt: ipse est rex super universos filios superbiae."
      en: "He beholdeth every high thing, he is king over all the children of pride."
    status: { la: verified, en: verified }
