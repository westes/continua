# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 16
verses:
  - n: 1
    text:
      la: "Pervenit autem Derben et Lystram. Et ecce discipulus quidam erat ibi nomine Timotheus, filius mulieris Judaeae fidelis, patre gentili."
      en: "And he came to Derbe and Lystra. And behold, there was a certain disciple there named Timothy, the son of a Jewish woman that believed; but his father was a Gentile."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Huic testimonium bonum reddebant qui in Lystris erant, et Iconio fratres."
      en: "To this man the brethren that were in Lystra and Iconium, gave a good testimony."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Hunc voluit Paulus secum proficisci: et assumens circumcidit eum propter Judaeos, qui erant in illis locis. Sciebant enim omnes quod pater ejus erat gentilis."
      en: "Him Paul would have to go along with him: and taking him he circumcised him, because of the Jews who were in those places. For they all knew that his father was a Gentile."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cum autem pertransirent civitates, tradebant eis custodiri dogmata quae erant decreta ab Apostolis et senioribus, qui erant Jerosolymis."
      en: "And as they passed through the cities, they delivered unto them the decrees for to keep, that were decreed by the apostles and ancients who were at Jerusalem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ecclesiae quidem confirmabantur fide, et abundabunt numero quotidie."
      en: "And the churches were confirmed in faith, and increased in number daily."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Transeuntes autem Phrygiam et Galatiae regionem, vetati sunt a Spiritu Sancto loqui verbum Dei in Asia."
      en: "And when they had passed through Phrygia, and the country of Galatia, they were forbidden by the Holy Ghost to preach the word in Asia."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum venissent autem in Mysiam, tentabant ire in Bithyniam: et non permisit eos Spiritus Jesu."
      en: "And when they were come into Mysia, they attempted to go into Bythynia, and the Spirit of Jesus suffered them not."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cum autem pertransissent Mysiam, descendeunt Troadem:"
      en: "And when they had passed through Mysia, they went down to Troas."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et visio per noctem Paulo ostensa est: vir Macedo quidam erat stans et deprecans eum, et dicens: Transiens in Macedoniam, adjuva nos."
      en: "And a vision was shewed to Paul in the night, which was a man of Macedonia standing and beseeching him, and saying: Pass over into Macedonia, and help us."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ut autem visum vidit, statim quaesivimus proficisci in Macedoniam, certi facti quod vocasset nos Deus evangelizare eis."
      en: "And as soon as he had seen the vision, immediately we sought to go into Macedonia, being assured that God had called us to preach the gospel to them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Navigantes autem a Troade, recto cursu venimus Samothraciam, et sequenti die Neapolim:"
      en: "And sailing from Troas, we came with a straight course to Samothracia, and the day following to Neapolis;"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et inde Philippos, quae est prima partis Macedoniae civitas, colonia. Eramus autem in hac urbe diebus aliquot, conferentes."
      en: "And from thence to Philippi, which is the chief city of part of Macedonia, a colony. And we were in this city some days conferring together."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Die autem sabbatorum egressi sumus foras portam juxta flumen, ubi videbatur oratio esse: et sedentes loquebamur mulieribus quae convenerant."
      en: "And upon the sabbath day, we went forth without the gate by a river side, where it seemed that there was prayer; and sitting down, we spoke to the women that were assembled."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et quaedam mulier nomine Lydia, purpuraria civitatis Thyatirenorum, colens Deum, audivit: cujus Dominus aperuit cor intendere his quae dicebantur a Paulo."
      en: "And a certain woman named Lydia, a seller of purple, of the city of Thyatira, one that worshipped God, did hear: whose heart the Lord opened to attend to those things which were said by Paul."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cum autem baptizata esset, et domus ejus, deprecata est dicens: Si judicastis me fidelem Domino esse, introite in domum meam, et manete. Et coegit nos."
      en: "And when she was baptized, and her household, she besought us, saying: If you have judged me to be faithful to the Lord, come into my house, and abide there. And she constrained us."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Factum est autem euntibus nobis ad orationem, puellam quamdam habentem spiritum pythonem obviare nobis, quae quaestum magnum praestabat dominis suis divinando."
      en: "And it came to pass, as we went to prayer, a certain girl, having a pythonical spirit, met us, who brought to her masters much gain by divining."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Haec subsecuta Paulum, et nos, clamabat dicens: Isti homines servi Dei excelsi sunt, qui annuntiant vobis viam salutis."
      en: "This same following Paul and us, cried out, saying: These men are the servants of the most high God, who preach unto you the way of salvation."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Hoc autem faciebat multis diebus. Dolens autem Paulus, et conversus, spiritui dixit: Praecipio tibi in nomine Jesu Christi exire ab ea. Et exiit eadem hora."
      en: "And this she did many days. But Paul being grieved, turned, and said to the spirit: I command thee, in the name of Jesus Christ, to go out from her. And he went out the same hour."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Videntes autem domini ejus quia exivit spes quaestus eorum, apprehendentes Paulum et Silam, perduxerunt in forum ad principes:"
      en: "But her masters, seeing that the hope of their gain was gone, apprehending Paul and Silas, brought them into the marketplace to the rulers."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et offerentes eos magistratibus, dixerunt: Hi homines conturbant civitatem nostram, cum sint Judaei:"
      en: "And presenting them to the magistrates, they said: These men disturb our city, being Jews;"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et annuntiant morem, quem non licet nobis suscipere, neque facere, cum simus Romani."
      en: "And preach a fashion which it is not lawful for us to receive nor observe, being Romans."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et cucurrit plebs adversus eos: et magistratus, scissis tunicis eorum, jusserunt eos virgis caedi."
      en: "And the people ran together against them; and the magistrates rending off their clothes, commanded them to be beaten with rods."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et cum multas plagas eis imposuissent, miserunt eos in carcerem, praecipientes custodi ut diligenter custodiret eos."
      en: "And when they had laid many stripes upon them, they cast them into prison, charging the gaoler to keep them diligently."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Qui cum tale praeceptum accepisset, misit eos in interiorem carcerem, et pedes eorum strinxit ligno."
      en: "Who having received such a charge, thrust them into the inner prison, and made their feet fast in the stocks."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Media autem nocte Paulus et Silas orantes, laudabant Deum: et audiebant eos qui in custodia erant."
      en: "And at midnight, Paul and Silas praying, praised God. And they that were in prison, heard them."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Subito vero terraemotus factus est magnus, ita ut moverentur fundamenta carceris. Et statim aperta sunt omnia ostia: et universorum vincula soluta sunt."
      en: "And suddenly there was a great earthquake, so that the foundations of the prison were shaken. And immediately all the doors were opened, and the bands of all were loosed."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Expergefactus autem custos carceris, et videns januas apertas carceris, evaginato gladio volebat se interficere, aestimans fugisse vinctos."
      en: "And the keeper of the prison, awaking out of his sleep, and seeing the doors of the prison open, drawing his sword, would have killed himself, supposing that the prisoners had been fled."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Clamavit autem Paulus voce magna, dicens: Nihil tibi mali feceris: universi enim hic sumus."
      en: "But Paul cried with a loud voice, saying: Do thyself no harm, for we all are here."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Petitoque lumine, introgressus est: et tremefactus procidit Paulo et Silae ad pedes:"
      en: "Then calling for a light, he went in, and trembling, fell down at the feet of Paul and Silas."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et producens eos foras, ait: Domini, quid me oportet facere, ut salvus fiam?"
      en: "And bringing them out, he said: Masters, what must I do, that I may be saved?"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "At illi dixerunt: Crede in Dominum Jesum: et salvus eris tu, et domus tua."
      en: "But they said: Believe in the Lord Jesus, and thou shalt be saved, and thy house."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et locuti sunt ei verbum Domini cum omnibus qui erant in domo ejus."
      en: "And they preached the word of the Lord to him and to all that were in his house."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et tollens eos in illa hora noctis, lavit plagas eorum: et baptizatus est ipse, et omnis domus ejus continuo."
      en: "And he, taking them the same hour of the night, washed their stripes, and himself was baptized, and all his house immediately."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Cumque perduxisset eos in domum suam, apposuit eis mensam, et laetatus est cum omni domo sua credens Deo."
      en: "And when he had brought them into his own house, he laid the table for them, and rejoiced with all his house, believing God."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et cum dies factus esset, miserunt magistratus lictores, dicentes: Dimitte homines illos."
      en: "And when the day was come, the magistrates sent the serjeants, saying, Let those men go."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Nuntiavit autem custos carceris verba haec Paulo: Quia miserunt magistratus ut dimittamini, nunc igitur exeuntes, ite in pace."
      en: "And the keeper of the prison told these words to Paul: The magistrates have sent to let you go; now therefore depart, and go in peace."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Paulus autem dixit eis: Caesos nos publice, indemnatos, homines Romanos miserunt in carcerem, et nunc occulte nos ejiciunt? Non ita: sed veniant,"
      en: "But Paul said to them: They have beaten us publicly, uncondemned, men that are Romans, and have cast us into prison: and now do they thrust us out privately? Not so; but let them come,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et ipsi nos ejiciant. Nuntiaverunt autem magistratibus lictores verba haec. Timueruntque audito quod Romani essent:"
      en: "And let us out themselves. And the serjeants told these words to the magistrates. And they were afraid, hearing that they were Romans."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et venientes deprecati sunt eos, et educentes rogabant ut egrederentur de urbe."
      en: "And coming, they besought them; and bringing them out, they desired them to depart out of the city."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Exeuntes autem de carcere, introierunt ad Lydiam: et visis fratribus consolati sunt eos, et profecti sunt."
      en: "And they went out of the prison, and entered into the house of Lydia; and having seen the brethren, they comforted them, and departed."
    status: { la: verified, en: verified }
