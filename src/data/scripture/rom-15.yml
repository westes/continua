# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: rom
chapter: 15
verses:
  - n: 1
    text:
      la: "debemus autem nos firmiores inbecillitates infirmorum sustinere et non nobis placere"
      en: "Now we that are stronger, ought to bear the infirmities of the weak, and not to please ourselves."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "unusquisque vestrum proximo suo placeat in bonum ad aedificationem"
      en: "Let every one of you please his neighbour unto good, to edification."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "etenim Christus non sibi placuit sed sicut scriptum est inproperia inproperantium tibi ceciderunt super me"
      en: "For Christ did not please himself, but as it is written: The reproaches of them that reproached thee, fell upon me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quaecumque enim scripta sunt ad nostram doctrinam scripta sunt ut per patientiam et consolationem scripturarum spem habeamus"
      en: "For what things soever were written, were written for our learning: that through patience and the comfort of the scriptures, we might have hope."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Deus autem patientiae et solacii det vobis id ipsum sapere in alterutrum secundum Iesum Christum"
      en: "Now the God of patience and of comfort grant you to be of one mind one towards another, according to Jesus Christ:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut unianimes uno ore honorificetis Deum et Patrem Domini nostri Iesu Christi"
      en: "That with one mind, and with one mouth, you may glorify God and the Father of our Lord Jesus Christ."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "propter quod suscipite invicem sicut et Christus suscepit vos in honorem Dei"
      en: "Wherefore receive one another, as Christ also hath received you unto the honour of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dico enim Christum Iesum ministrum fuisse circumcisionis propter veritatem Dei ad confirmandas promissiones patrum"
      en: "For I say that Christ Jesus was minister of the circumcision for the truth of God, to confirm the promises made unto the fathers."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "gentes autem super misericordiam honorare Deum sicut scriptum est propter hoc confitebor tibi in gentibus et nomini tuo cantabo"
      en: "But that the Gentiles are to glorify God for his mercy, as it is written: Therefore will I confess to thee, O Lord, among the Gentiles, and will sing to thy name."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et iterum dicit laetamini gentes cum plebe eius"
      en: "And again he saith: Rejoice, ye Gentiles, with his people."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et iterum laudate omnes gentes Dominum et magnificate eum omnes populi"
      en: "And again: Praise the Lord, all ye Gentiles; and magnify him, all ye people."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et rursus Esaias ait erit radix Iesse et qui exsurget regere gentes in eo gentes sperabunt"
      en: "And again Isaias saith: There shall be a root of Jesse; and he that shall rise up to rule the Gentiles, in him the Gentiles shall hope."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Deus autem spei repleat vos omni gaudio et pace in credendo ut abundetis in spe in virtute Spiritus Sancti"
      en: "Now the God of hope fill you with all joy and peace in believing; that you may abound in hope, and in the power of the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "certus sum autem fratres mei et ego ipse de vobis quoniam et ipsi pleni estis dilectione repleti omni scientia ita ut possitis alterutrum monere"
      en: "And I myself also, my brethren, am assured of you, that you also are full of love, replenished with all knowledge, so that you are able to admonish one another."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "audacius autem scripsi vobis fratres ex parte tamquam in memoriam vos reducens propter gratiam quae data est mihi a Deo"
      en: "But I have written to you, brethren, more boldly in some sort, as it were putting you in mind: because of the grace which is given me from God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ut sim minister Christi Iesu in gentibus sanctificans evangelium Dei ut fiat oblatio gentium accepta sanctificata in Spiritu Sancto"
      en: "That I should be the minister of Christ Jesus among the Gentiles; sanctifying the gospel of God, that the oblation of the Gentiles may be made acceptable and sanctified in the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "habeo igitur gloriam in Christo Iesu ad Deum"
      en: "I have therefore glory in Christ Jesus towards God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non enim audeo aliquid loqui eorum quae per me non effecit Christus in oboedientiam gentium verbo et factis"
      en: "For I dare not to speak of any of those things which Christ worketh not by me, for the obedience of the Gentiles, by word and deed,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "in virtute signorum et prodigiorum in virtute Spiritus Sancti ita ut ab Hierusalem per circuitum usque in Illyricum repleverim evangelium Christi"
      en: "By the virtue of signs and wonders, in the power of the Holy Ghost, so that from Jerusalem round about as far as unto Illyricum, I have replenished the gospel of Christ."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sic autem hoc praedicavi evangelium non ubi nominatus est Christus ne super alienum fundamentum aedificarem"
      en: "And I have so preached this gospel, not where Christ was named, lest I should build upon another man's foundation."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sed sicut scriptum est quibus non est adnuntiatum de eo videbunt et qui non audierunt intellegent"
      en: "But as it is written: They to whom he was not spoken of, shall see, and they that have not heard shall understand."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "propter quod et inpediebar plurimum venire ad vos"
      en: "For which cause also I was hindered very much from coming to you, and have been kept away till now."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "nunc vero ulterius locum non habens in his regionibus cupiditatem autem habens veniendi ad vos ex multis iam annis"
      en: "But now having no more place in these countries, and having a great desire these many years past to come unto you,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "cum in Hispaniam proficisci coepero spero quod praeteriens videam vos et a vobis deducar illuc si vobis primum ex parte fruitus fuero"
      en: "When I shall begin to take my journey into Spain, I hope that as I pass, I shall see you, and be brought on my way thither by you, if first, in part, I shall have enjoyed you:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "nunc igitur proficiscar in Hierusalem ministrare sanctis"
      en: "But now I shall go to Jerusalem, to minister unto the saints."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "probaverunt enim Macedonia et Achaia conlationem aliquam facere in pauperes sanctorum qui sunt in Hierusalem"
      en: "For it hath pleased them of Macedonia and Achaia to make a contribution for the poor of the saints that are in Jerusalem."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "placuit enim eis et debitores sunt eorum nam si spiritalium eorum participes facti sunt gentiles debent et in carnalibus ministrare eis"
      en: "For it hath pleased them; and they are their debtors. For if the Gentiles have been made partakers of their spiritual things, they ought also in carnal things to minister to them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "hoc igitur cum consummavero et adsignavero eis fructum hunc proficiscar per vos in Hispaniam"
      en: "When therefore I shall have accomplished this, and consigned to them this fruit, I will come by you into Spain."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "scio autem quoniam veniens ad vos in abundantia benedictionis Christi veniam"
      en: "And I know, that when I come to you, I shall come in the abundance of the blessing of the gospel of Christ."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "obsecro igitur vos fratres per Dominum nostrum Iesum Christum et per caritatem Spiritus ut adiuvetis me in orationibus pro me ad Deum"
      en: "I beseech you therefore, brethren, through our Lord Jesus Christ, and by the charity of the Holy Ghost, that you help me in your prayers for me to God,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ut liberer ab infidelibus qui sunt in Iudaea et obsequii mei oblatio accepta fiat in Hierosolyma sanctis"
      en: "That I may be delivered from the unbelievers that are in Judea, and that the oblation of my service may be acceptable in Jerusalem to the saints."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ut veniam ad vos in gaudio per voluntatem Dei et refrigerer vobiscum"
      en: "That I may come to you with joy, by the will of God, and may be refreshed with you."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Deus autem pacis sit cum omnibus vobis amen"
      en: "Now the God of peace be with you all. Amen."
    status: { la: verified, en: verified }
