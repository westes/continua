# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 15
verses:
  - n: 1
    text:
      la: "Igitur post haec fecit sibi Absalom currus, et equites, et quinquaginta viros, qui praecederent eum."
      en: "Now after these things Absalom made himself chariots, and horsemen, and fifty men to run before him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et mane consurgens Absalom, stabat juxta introitum portae, et omnem virum, qui habebat negotium ut veniret ad regis judicium, vocabat Absalom ad se, et dicebat: De qua civitate es tu? Qui respondens aiebat: Ex una tribu Israel ego sum servus tuus."
      en: "And Absalom rising up early stood by the entrance of the gate, and when any man had business to come to the king's judgment, Absalom called him to him, and said: Of what city art thou? He answered, and said: Thy servant is of such a tribe of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Respondebatque ei Absalom: Videntur mihi sermones tui boni et justi. Sed non est qui te audiat constitutus a rege. Dicebatque Absalom:"
      en: "And Absalom answered him: Thy words seem to me good and just. But there is no man appointed by the king to hear thee. And Absalom said:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quis me constituat judicem super terram, ut ad me veniant omnes qui habent negotium, et juste judicem?"
      en: "O that they would make me judge over the land, that all that have business might come to me, that I might do them justice."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Sed et cum accederet ad eum homo ut salutaret illum, extendebat manum suam, et apprehendens, osculabatur eum."
      en: "Moreover when any man came to him to salute him, he put forth his hand, and took him, and kissed him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Faciebatque hoc omni Israel venienti ad judicium, ut audiretur a rege, et sollicitabat corda virorum Israel."
      en: "And this he did to all Israel that came for judgment, to be heard by the king, and he enticed the hearts of the men of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Post quadraginta autem annos, dixit Absalom ad regem David: Vadam, et reddam vota mea quae vovi Domino in Hebron."
      en: "And after forty years, Absalom said to king David: Let me go, and pay my vows which I have vowed to the Lord in Hebron."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Vovens enim vovit servus tuus, cum esset in Gessur Syriae, dicens: Si reduxerit me Dominus in Jerusalem, sacrificabo Domino."
      en: "For thy servant made a vow, when he was in Gessur of Syria, saying: If the Lord shall bring me again into Jerusalem I will offer sacrifice to the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixitque ei rex David: Vade in pace. Et surrexit, et abiit in Hebron."
      en: "And king David said to him: Go in peace. And he arose, and went to Hebron."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Misit autem Absalom exploratores in universas tribus Israel, dicens: Statim ut audieritis clangorem buccinae, dicite: Regnavit Absalom in Hebron."
      en: "And Absalom sent spies into all the tribes of Israel, saying: As soon as you shall hear the sound of the trumpet, say ye: Absalom reigneth in Hebron."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Porro cum Absalom ierunt ducenti viri de Jerusalem vocati, euntes simplici corde, et causam penitus ignorantes."
      en: "Now there went with Absalom two hundred men out of Jerusalem that were called, going with simplicity of heart, and knowing nothing of the design."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Accersivit quoque Absalom Achitophel Gilonitem consiliarium David, de civitate sua Gilo. Cumque immolaret victimas, facta est conjuratio valida, populusque concurrens augebatur cum Absalom."
      en: "Absalom also sent for Achitophel the Gilonite, David's counsellor, from his city Gilo. And while he was offering sacrifices, there was a strong conspiracy, and the people running together increased with Absalom."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Venit igitur nuntius ad David, dicens: Toto corde universus Israel sequitur Absalom."
      en: "And there came a messenger to David, saying: All Israel with their whole heart followeth Absalom."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et ait David servis suis qui erant cum eo in Jerusalem: Surgite, fugiamus: neque enim erit nobis effugium a facie Absalom: festinate egredi, ne forte veniens occupet nos, et impellat super nos ruinam, et percutiat civitatem in ore gladii."
      en: "And David said to his servants, that were with him in Jerusalem: Arise and let us flee: for we shall not escape else from the face of Absalom: make haste to go out, lest he come and overtake us, and bring ruin upon us, and smite the city with the edge of the sword."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixeruntque servi regis ad eum: Omnia quaecumque praeceperit dominus noster rex, libenter exequemur servi tui."
      en: "And the king's servants said to him: Whatsoever our lord the king shall command, we thy servants will willingly execute."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Egressus est ergo rex, et universa domus ejus pedibus suis: et dereliquit rex decem mulieres concubinas ad custodiendam domum."
      en: "And the king went forth, and all his household on foot: and the king left ten women his concubines to keep the house:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Egressusque rex et omnis Israel pedibus suis, stetit procul a domo:"
      en: "And the king going forth and all Israel on foot, stood afar off from the house:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et universi servi ejus ambulabant juxta eum, et legiones Cerethi, et Phelethi, et omnes Gethaei, pugnatores validi, sexcenti viri, qui secuti eum fuerant de Geth pedites, praecedebant regem."
      en: "And all his servants walked by him, and the bands of the Cerethi, and the Phelethi, and all the Gethites, valiant warriors, six hundred men who had followed him from Geth on foot, went before the king."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dixit autem rex ad Ethai Gethaeum: Cur venis nobiscum? revertere, et habita cum rege, quia peregrinus es, et egressus es de loco tuo."
      en: "And the king said to Ethai the Gethite: Why comest thou with us? return and dwell with the king, for thou art a stranger, and art come out of thy own place."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Heri venisti, et hodie compelleris nobiscum egredi? Ego autem vadam quo iturus sum: revertere, et reduc tecum fratres tuos, et Dominus faciet tecum misericordiam, et veritatem, quia ostendisti gratiam et fidem."
      en: "Yesterday thou camest, and today shalt thou be forced to go forth with us? but I shall go whither I am going: return thou, and take back thy brethren with thee, and the Lord will shew thee mercy, and truth, because thou hast shewn grace and fidelity."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et respondit Ethai regi dicens: Vivit Dominus, et vivit dominus meus rex: Quoniam in quocumque loco fueris domine mi rex, sive in morte, sive in vita, ibi erit servus tuus."
      en: "And Ethai answered the king, saying: As the Lord liveth, and as my lord the king liveth: in what place soever thou shalt be, my lord, O king, either in death, or in life, there will thy servant be."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ait David Ethai: Veni, et transi. Et transivit Ethai Gethaeus, et omnes viri qui cum eo erant, et reliqua multitudo."
      en: "And David said to Ethai: Come, and pass over. And Ethai the Gethite passed, and all the men that were with him, and the rest of the people."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Omnesque flebant voce magna, et universus populus transibat: rex quoque transgrediebatur torrentem Cedron, et cunctus populus incedebat contra viam, quae respicit ad desertum."
      en: "And they all wept with a loud voice, and all the people passed over: the king also himself went over the brook Cedron, and all the people marched towards the way that looketh to the desert."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Venit autem et Sadoc sacerdos, et universi Levitae cum eo portantes arcam foederis Dei: et deposuerunt arcam Dei: et ascendit Abiathar, donec expletus esset omnis populus, qui egressus fuerat de civitate."
      en: "And Sadoc the priest also came, and all the Levites with him carrying the ark of the covenant of God, and they set down the ark of God: and Abiathar went up, till all the people that was come out of the city had done passing."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et dixit rex ad Sadoc: Reporta arcam Dei in urbem: si invenero gratiam in oculis Domini, reducet me, et ostendet mihi eam, et tabernaculum suum."
      en: "And the king said to Sadoc: Carry back the ark of God into the city: if I shall find grace in the sight of the Lord, he will bring me again, and he will shew me it, and his tabernacle."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Si autem dixerit mihi: Non places: praesto sum, faciat quod bonum est coram se."
      en: "But if he shall say to me: Thou pleasest me not: I am ready, let him do that which is good before him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et dixit rex ad Sadoc sacerdotem: O videns, revertere in civitatem in pace: et Achimaas filius tuus, et Jonathas filius Abiathar, duo filii vestri, sint vobiscum."
      en: "And the king said to Sadoc the priest: O seer, return into the city in peace: and let Achimaas thy son, and Jonathan the son of Abiathar, your two sons, be with you."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ecce ego abscondar in campestribus deserti, donec veniat sermo a vobis indicans mihi."
      en: "Behold I will lie hid in the plains of the wilderness, till there come word from you to certify me."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Reportaverunt ergo Sadoc et Abiathar arcam Dei in Jerusalem: et manserunt ibi."
      en: "So Sadoc and Abiathar carried back the ark of God into Jerusalem: and they tarried there."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Porro David ascendebat clivum Olivarum, scandens et flens, nudis pedibus incedens, et operto capite, sed et omnis populus, qui erat cum eo, operto capite, ascendebat plorans."
      en: "But David went up by the ascent of mount Olivet, going up and weeping, walking barefoot, and with his head covered, and all the people that were with them, went up with their heads covered weeping."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Nuntiatum est autem David quod et Achitophel esset in conjuratione cum Absalom, dixitque David: Infatua, quaeso, Domine, consilium Achitophel."
      en: "And it was told David that Achitophel also was in the conspiracy with Absalom, and David said: Infatuate, O Lord, I beseech thee, the counsel of Achitophel."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Cumque ascenderet David summitatem montis, in quo adoraturus erat Dominum, ecce occurrit ei Chusai Arachites, scissa veste, et terra pleno capite."
      en: "And when David was come to the top of the mountain, where he was about to adore the Lord, behold Chusai the Arachite, came to meet him with his garment rent and his head covered with earth."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et dixit ei David: Si veneris mecum, eris mihi oneri:"
      en: "And David said to him: If thou come with me, thou wilt be a burden to me:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "si autem in civitatem revertaris, et dixeris Absalom: Servus tuus sum, rex: sicut fui servus patris tui, sic ero servus tuus: dissipabis consilium Achitophel."
      en: "But if thou return into the city, and wilt say to Absalom: I am thy servant, O king: as I have been thy father's servant, so I will be thy servant: thou shalt defeat the counsel of Achitophel."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Habes autem tecum Sadoc et Abiathar sacerdotes: et omne verbum quodcumque audieris de domo regis, indicabis Sadoc et Abiathar sacerdotibus."
      en: "And thou hast with thee Sadoc, and Abiathar the priests: and what thing soever thou shalt hear out of the king's house, thou shalt tell it to Sadoc and Abiathar the priests."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Sunt autem cum eis duo filii eorum Achimaas filius Sadoc, et Jonathas filius Abiathar: et mittetis per eos ad me omne verbum quod audieritis."
      en: "And there are with them their two sons Achimaas the son of Sadoc, and Jonathan the son of Abiathar: and you shall send by them to me every thing that you shall hear."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Veniente ergo Chusai amico David in civitatem, Absalom quoque ingressus est Jerusalem."
      en: "Then Chusai the friend of David went into the city, and Absalom came into Jerusalem."
    status: { la: verified, en: verified }
