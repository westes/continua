# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 12
verses:
  - n: 1
    text:
      la: "haec sunt praecepta atque iudicia quae facere debetis in terra quam Dominus Deus patrum tuorum daturus est tibi ut possideas eam cunctis diebus quibus super humum gradieris"
      en: "These are the precepts and judgments, that you must do in the land, which the Lord the God of thy fathers will give thee, to possess it all the days that thou shalt walk upon the earth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "subvertite omnia loca in quibus coluerunt gentes quas possessuri estis deos suos super montes excelsos et colles et subter omne lignum frondosum"
      en: "Destroy all the places in which the nations, that you shall possess, worshipped their gods upon high mountains, and hills, and under every shady tree:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dissipate aras earum et confringite statuas lucos igne conburite et idola comminuite disperdite nomina eorum de locis illis"
      en: "Overthrow their altars, and break down their statues, burn their groves with fire, and break their idols in pieces: destroy their names out of those places."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non facietis ita Domino Deo vestro"
      en: "You shall not do so to the Lord your God:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sed ad locum quem elegerit Dominus Deus vester de cunctis tribubus vestris ut ponat nomen suum ibi et habitet in eo venietis"
      en: "But you shall come to the place, which the Lord your God shall choose out of all your tribes, to put his name there, and to dwell in it:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et offeretis in illo loco holocausta et victimas vestras decimas et primitias manuum vestrarum et vota atque donaria primogenita boum et ovium"
      en: "And you shall offer in that place your holocausts and victims, the tithes and firstfruits of your hands and your vows and gifts, the firstborn of your herds and your sheep."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et comedetis ibi in conspectu Domini Dei vestri ac laetabimini in cunctis ad quae miseritis manum vos et domus vestrae in quibus benedixerit vobis Dominus Deus vester"
      en: "And you shall eat there in the sight of the Lord your God: and you shall rejoice in all things, whereunto you shall put your hand, you and your houses wherein the Lord your God hath blessed you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "non facietis ibi quae nos hic facimus hodie singuli quod sibi rectum videtur"
      en: "You shall not do there the things we do here this day, every man that which seemeth good to himself."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "neque enim usque in praesens tempus venistis ad requiem et possessionem quam Dominus Deus daturus est vobis"
      en: "For until this present time you are not come to refit, and to the possession, which the Lord your God will give you."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "transibitis Iordanem et habitabitis in terram quam Dominus Deus vester daturus est vobis ut requiescatis a cunctis hostibus per circuitum et absque ullo timore habitetis"
      en: "You shall pass over the Jordan, and shall dwell in the land which the Lord your God will give you, that you may have rest from all enemies round about: and may dwell without any fear,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in loco quem elegerit Dominus Deus vester ut sit nomen eius in eo illuc omnia quae praecipio conferetis holocausta et hostias ac decimas et primitias manuum vestrarum et quicquid praecipuum est in muneribus quae vovistis Domino"
      en: "In the place, which the Lord your God shall choose, that his name may be therein. Thither shall you bring all the things that I command you, holocausts, and victims, and tithes, and the firstfruits of your hands: and whatsoever is the choicest in the gifts which you shall vow to the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ibi epulabimini coram Domino Deo vestro vos filii ac filiae vestrae famuli et famulae atque Levites qui in vestris urbibus commorantur neque enim habet aliam partem et possessionem inter vos"
      en: "There shall you feast before the Lord your God, you and your sons and your daughters, your menservants and maid- servants, and the Levite that dwelleth in your cities. For he hath no other part and possession among you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cave ne offeras holocausta tua in omni loco quem videris"
      en: "Beware lest thou offer thy holocausts in every place that thou shalt see:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed in eo quem elegerit Dominus in una tribuum tuarum offeres hostias et facies quaecumque praecipio tibi"
      en: "But in the place which the Lord shall choose in one of thy tribes shalt thou offer sacrifices. and shalt do all that I command thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sin autem comedere volueris et te esus carnium delectarit occide et comede iuxta benedictionem Domini Dei tui quam dedit tibi in urbibus tuis sive inmundum fuerit hoc est maculatum et debile sive mundum hoc est integrum et sine macula quod offerri licet sicut capream et cervum comedes"
      en: "But if thou desirest to eat, and the eating of flesh delight thee, kill, and eat according to the blessing of the Lord thy God, which he hath given thee, in thy cities: whether it be unclean, that is to say, having blemish or defect: or clean, that is to say, sound and without blemish, such as may be offered, as the roe, and the hart, shalt thou eat it:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "absque esu dumtaxat sanguinis quod super terram quasi aquam effundes"
      en: "Only the blood thou shalt not eat, but thou shalt pour it out upon the earth as water."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "non poteris comedere in oppidis tuis decimam frumenti et vini et olei tui primogenita armentorum et pecorum et omnia quae voveris et sponte offerre volueris et primitias manuum tuarum"
      en: "Thou mayst not eat in thy towns the tithes of thy corn, and thy wine, and thy oil, the firstborn of thy herds and thy cattle, nor any thing that thou vowest, and that thou wilt offer voluntarily, and the firstfruits of thy hands:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "sed coram Domino Deo tuo comedes ea in loco quem elegerit Dominus Deus tuus tu et filius tuus ac filia servus et famula atque Levites qui manet in urbibus tuis et laetaberis et reficieris coram Domino Deo tuo in cunctis ad quae extenderis manum tuam"
      en: "But thou shalt eat them before the Lord thy God in the place which the Lord thy God shall choose, thou and thy son and thy daughter, and thy manservant, and maidservant, and the Levite that dwelleth in thy cities: and thou shalt rejoice and be refreshed before the Lord thy God in all things, whereunto thou shalt put thy hand."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cave ne derelinquas Leviten omni tempore quo versaris in terra"
      en: "Take heed thou forsake not the Levite all the time that thou livest in the land."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quando dilataverit Dominus Deus tuus terminos tuos sicut locutus est tibi et volueris vesci carnibus quas desiderat anima tua"
      en: "When the Lord thy God shall have enlarged thy borders, as he hath spoken to thee, and thou wilt eat the flesh that thy soul desireth:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "locus autem quem elegerit Dominus Deus tuus ut sit nomen eius ibi si procul fuerit occides de armentis et pecoribus quae habueris sicut praecepi tibi et comedes in oppidis tuis ut tibi placet"
      en: "And if the place which the Lord thy God shall choose, that his name should be there, be far off, thou shalt kill of thy herds and of thy docks, as I have commanded thee, and shalt eat in thy towns, as it pleaseth thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sicut comeditur caprea et cervus ita vesceris eis et mundus et inmundus in commune vescentur"
      en: "Even as the roe and the hart is eaten, so shalt thou eat them: both the clean and unclean shall eat of them alike."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "hoc solum cave ne sanguinem comedas sanguis enim eorum pro anima est et idcirco non debes animam comedere cum carnibus"
      en: "Only beware of this, that thou eat not the blood, for the blood is for the soul: and therefore thou must not eat the soul with the flesh:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "sed super terram fundes quasi aquam"
      en: "But thou shalt pour it upon the earth as water,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ut sit tibi bene et filiis tuis post te cum feceris quod placet in conspectu Domini"
      en: "That it may be well with thee and thy children after thee, when thou shalt do that which is pleasing in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quae autem sanctificaveris et voveris Domino tolles et venies ad locum quem elegerit Dominus"
      en: "But the things which thou hast sanctified and vowed to the Lord, thou shalt take, and shalt come to the place which the Lord shall choose:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et offeres oblationes tuas carnem et sanguinem super altare Domini Dei tui sanguinem hostiarum fundes in altari carnibus autem ipse vesceris"
      en: "And shalt offer thy oblations the flesh and the blood upon the altar of the Lord thy God: the blood of thy victims thou shalt pour on the altar: and the flesh thou thyself shalt eat."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "observa et audi omnia quae ego praecipio tibi ut bene sit tibi et filiis tuis post te in sempiternum cum feceris quod bonum est et placitum in conspectu Domini Dei tui"
      en: "Observe and hear all the things that I command thee, that it may be well with thee and thy children after thee for ever, when thou shalt do what is good and pleasing in the sight of the Lord thy God."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quando disperderit Dominus Deus tuus ante faciem tuam gentes ad quas ingredieris possidendas et possederis eas atque habitaveris in terra earum"
      en: "When the Lord thy God shall have destroyed before thy face the nations, which then shalt go in to possess, and when thou shalt possess them, and dwell in their land:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "cave ne imiteris eas postquam te fuerint introeunte subversae et requiras caerimonias earum dicens sicut coluerunt gentes istae deos suos ita et ego colam"
      en: "Beware lest thou imitate them, after they are destroyed at thy coming in, and lest thou seek after their ceremonies, saying: As these nations have worshipped their gods, so will I also worship."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "non facies similiter Domino Deo tuo omnes enim abominationes quas aversatur Dominus fecerunt diis suis offerentes filios et filias et conburentes igne"
      en: "Thou shalt not do in like manner to the Lord thy God. For they have done to their gods all the abominations which the Lord abhorreth, offering their sons and daughters, and burning them with fire."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quod praecipio tibi hoc tantum facito Domino nec addas quicquam nec minuas"
      en: "What I command thee, that only do thou to the Lord: neither add any thing, nor diminish."
    status: { la: verified, en: verified }
