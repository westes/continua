# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: lev
chapter: 7
verses:
  - n: 1
    text:
      la: "haec quoque est lex hostiae pro delicto sancta sanctorum est"
      en: "This also is the law of the sacrifice for a trespass, it is most holy:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "idcirco ubi immolatur holocaustum mactabitur et victima pro delicto sanguis eius per gyrum fundetur altaris"
      en: "Therefore where the holocaust is immolated, the victim also for a trespass shall be slain: the blood thereof shall be poured round about the altar."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "offerent ex ea caudam et adipem qui operit vitalia"
      en: "They shall offer thereof the rump and the fat that covereth the entrails:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "duos renunculos et pinguedinem quae iuxta ilia est reticulumque iecoris cum renunculis"
      en: "The two little kidneys, and the fat which is by the flanks, and the caul of the liver with the little kidneys."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et adolebit ea sacerdos super altare incensum est Domini pro delicto"
      en: "And the priest shall burn them upon the altar: it is the burnt sacrifice of the Lord for a trespass."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "omnis masculus de sacerdotali genere in loco sancto vescetur his carnibus quia sanctum sanctorum est"
      en: "Every male of the priestly race, shall eat this flesh in a holy place, because it is most holy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sicut pro peccato offertur hostia ita et pro delicto utriusque hostiae lex una erit ad sacerdotem qui eam obtulerit pertinebit"
      en: "As the sacrifice for sin is offered, so is also that for a trespass: the same shall be the law of both these sacrifices: it shall belong to the priest that offereth it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sacerdos qui offert holocausti victimam habebit pellem eius"
      en: "The priest that offereth the victim of holocaust, shall have the skin thereof."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et omne sacrificium similae quod coquitur in clibano et quicquid in craticula vel in sartagine praeparatur eius erit sacerdotis a quo offertur"
      en: "And every sacrifice of flour that is baked in the oven, and whatsoever is dressed on the gridiron, or in the fryingpan, shall be the priest's that offereth it:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sive oleo conspersa sive arida fuerit cunctis filiis Aaron aequa mensura per singulos dividetur"
      en: "Whether they be tempered with oil, or dry, all the sons of Aaron shall have one as much as another."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "haec est lex hostiae pacificorum quae offertur Domino"
      en: "This is the law of the sacrifice of peace offerings that is offered to the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si pro gratiarum actione fuerit oblatio offerent panes absque fermento conspersos oleo et lagana azyma uncta oleo coctamque similam et collyridas olei admixtione conspersas"
      en: "If the oblation be for thanksgiving, they shall offer leaves without leaven tempered with oil, and unleavened wafers anointed with oil, and fine flour fried, and cakes tempered and mingled with oil:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "panes quoque fermentatos cum hostia gratiarum quae immolatur pro pacificis"
      en: "Moreover leaves of leavened bread with the sacrifice of thanks, which is offered for peace offerings:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ex quibus unus pro primitiis offeretur Domino et erit sacerdotis qui fundet hostiae sanguinem"
      en: "Of which one shall be offered to the Lord for firstfruits, and shall be the priest's that shall pour out the blood of the victim."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cuius carnes eadem comedentur die nec remanebit ex eis quicquam usque mane"
      en: "And the flesh of it shall be eaten the same day, neither shall any of it remain until the morning."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "si voto vel sponte quisquam obtulerit hostiam eadem similiter edetur die sed et si quid in crastinum remanserit vesci licitum est"
      en: "If any man by vow, or of his own accord offer a sacrifice, it shall in like manner be eaten the same day: and if any of it remain until the morrow, it is lawful to eat it:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quicquid autem tertius invenerit dies ignis absumet"
      en: "But whatsoever shall be found on the third day shall be consumed with fire."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "si quis de carnibus victimae pacificorum die tertio comederit irrita fiet oblatio nec proderit offerenti quin potius quaecumque anima tali se edulio contaminarit praevaricationis rea erit"
      en: "If any man eat of the flesh of the victim of peace offerings on the third day, the oblation shall be of no effect, neither shall it profit the offerer: yea rather whatsoever soul shall defile itself with such meat, shall be guilty of transgression."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "caro quae aliquid tetigerit inmundum non comedetur sed conburetur igni qui fuerit mundus vescetur ea"
      en: "The flesh that hath touched any unclean thing, shall not be eaten, but shall be burnt with fire: he that is clean shall eat of it."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "anima polluta quae ederit de carnibus hostiae pacificorum quae oblata est Domino peribit de populis suis"
      en: "If any one that is defiled shall eat of the flesh of the sacrifice of peace offerings, which is offered to the Lord, he shall be cut off from his people."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et quae tetigerit inmunditiam hominis vel iumenti sive omnis rei quae polluere potest et comederit de huiuscemodi carnibus interibit de populis suis"
      en: "And he that hath touched the uncleanness of man, or of beast, or of any thing that can defile, and shall eat of such kind of flesh, shall be cut off from his people."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "loquere filiis Israhel adipem bovis et ovis et caprae non comedetis"
      en: "Say to the children of Israel: The fat of a sheep, and of an ox, and of a goat you shall not eat."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "adipem cadaveris morticini et eius animalis quod a bestia captum est habebitis in usus varios"
      en: "The fat of a carcass that hath died of itself, and of a beast that was caught by another beast, you shall have for divers uses."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "si quis adipem qui offerri debet in incensum Domini comederit peribit de populo suo"
      en: "If any man eat the fat that should be offered for the burnt sacrifice of the Lord, he shall perish out of his people."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "sanguinem quoque omnis animalis non sumetis in cibo tam de avibus quam de pecoribus"
      en: "Moreover you shall not eat the blood of any creature whatsoever, whether of birds or beasts."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "omnis anima quae ederit sanguinem peribit de populis suis"
      en: "Every one that eateth blood, shall perish from among the people."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "locutus est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "loquere filiis Israhel qui offert victimam pacificorum Domino offerat simul et sacrificium id est libamenta eius"
      en: "Speak to the children of Israel, saying: He that offereth a victim of peace offerings to the Lord, let him offer therewith a sacrifice also, that is, the libations thereof."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "tenebit manibus adipem hostiae et pectusculum cumque ambo oblata Domino consecrarit tradet sacerdoti"
      en: "He shall hold in his hands the fat of the victim, and the breast: and when he hath offered and consecrated both to the Lord, he shall deliver them to the priest,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "qui adolebit adipem super altare pectusculum autem erit Aaron et filiorum eius"
      en: "Who shall burn the fat upon the altar, but the breast shall be Aaron's and his sons'."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "armus quoque dexter de pacificorum hostiis cedet in primitias sacerdotis"
      en: "The right shoulder also of the victims of peace offerings shall fall to the priest for firstfruits."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "qui obtulerit sanguinem et adipem filiorum Aaron ipse habebit et armum dextrum in portione sua"
      en: "He among the sons of Aaron, that offereth the blood, and the fat, he shall have the right shoulder also for his portion."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "pectusculum enim elationis et armum separationis tuli a filiis Israhel de hostiis eorum pacificis et dedi Aaron sacerdoti ac filiis eius lege perpetua ab omni populo Israhel"
      en: "For the breast that is elevated and the shoulder that is separated I have taken of the children of Israel, from off their victims of peace offerings, and have given them to Aaron the priest, and to his sons, by a law for ever, from all the people of Israel."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "haec est unctio Aaron et filiorum eius in caerimoniis Domini die qua obtulit eos Moses ut sacerdotio fungerentur"
      en: "This is the anointing of Aaron and his sons, in the ceremonies of the Lord, in the day when Moses offered them, that they might do the office of priesthood,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et quae praecepit dari eis Dominus a filiis Israhel religione perpetua in generationibus suis"
      en: "And the things that the Lord commanded to be given them by the children of Israel, by a perpetual observance in their generations."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "ista est lex holocausti et sacrificii pro peccato atque delicto et pro consecratione et pacificorum victimis"
      en: "This is the law of holocaust, and of the sacrifice for sin, and for trespass, and for consecration, and the victims of peace offerings:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "quas constituit Dominus Mosi in monte Sinai quando mandavit filiis Israhel ut offerrent oblationes suas Domino in deserto Sinai"
      en: "Which the Lord appointed to Moses in mount Sinai, when he commanded the children of Israel, that they should offer their oblations to the Lord in the desert of Sinai."
    status: { la: verified, en: verified }
