# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: cant
chapter: 7
verses:
  - n: 1
    text:
      la: "quid videbis in Sulamiten nisi choros castrorum quam pulchri sunt gressus tui in calciamentis filia principis iunctura feminum tuorum sicut monilia quae fabricata sunt manu artificis"
      en: "What shalt thou see in the Sulamitess but the companies of camps? How beautiful are thy steps in shoes, O prince's daughter! The joints of thy thighs are like jewels, that are made by the hand of a skilful workman."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "umbilicus tuus crater tornatilis numquam indigens poculis venter tuus sicut acervus tritici vallatus liliis"
      en: "Thy navel is like a round bowl never wanting cups. Thy belly is like a heap of wheat, set about with lilies."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "duo ubera tua sicut duo hinuli gemelli capreae"
      en: "Thy two breasts are like two young roes that are twins."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "collum tuum sicut turris eburnea oculi tui sicut piscinae in Esebon quae sunt in porta filiae multitudinis nasus tuus sicut turris Libani quae respicit contra Damascum"
      en: "Thy neck as a tower of ivory. Thy eyes like the fishpools in Hesebon, which are in the gate of the daughter of the multitude. Thy nose is as the tower of Libanus, that looketh toward Damascus."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "caput tuum ut Carmelus et comae capitis tui sicut purpura regis vincta canalibus"
      en: "Thy head is like Carmel: and the hairs of thy head as the purple of the king bound in the channels."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quam pulchra es et quam decora carissima in deliciis"
      en: "How beautiful art thou, and how comely, my dearest, in delights!"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "statura tua adsimilata est palmae et ubera tua botris"
      en: "Thy stature is like to a palm tree, and thy breasts to clusters of grapes."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dixi ascendam in palmam adprehendam fructus eius et erunt ubera tua sicut botri vineae et odor oris tui sicut malorum"
      en: "I said: I will go up into the palm tree, and will take hold of the fruit thereof: and thy breasts shall be as the clusters of the vine: and the odour of thy mouth like apples."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "guttur tuum sicut vinum optimum dignum dilecto meo ad potandum labiisque et dentibus illius ruminandum"
      en: "Thy throat like the best wine, worthy for my beloved to drink, and for his lips and his teeth to ruminate."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ego dilecto meo et ad me conversio eius"
      en: "I to my beloved, and his turning is towards me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "veni dilecte mi egrediamur in agrum commoremur in villis"
      en: "Come, my beloved, let us go forth into the field, let us abide in the villages."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "mane surgamus ad vineas videamus si floruit vinea si flores fructus parturiunt si floruerunt mala punica ibi dabo tibi ubera mea"
      en: "Let us get up early to the vineyards, let us see if the vineyard flourish, if the flowers be ready to bring forth fruits, if the pomegranates flourish: there will I give thee my breasts."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "mandragorae dederunt odorem in portis nostris omnia poma nova et vetera dilecte mi servavi tibi"
      en: "The mandrakes give a smell. In our gates are all fruits: the new and the old, my beloved, I have kept for thee."
    status: { la: verified, en: verified }
