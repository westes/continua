# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: nah
chapter: 3
verses:
  - n: 1
    text:
      la: "vae civitas sanguinum universa mendacii dilaceratione plena non recedet a te rapina"
      en: "Woe to thee, O city of blood, all full of lies and violence: rapine shall not depart from thee."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "vox flagelli et vox impetus rotae et equi frementis et quadrigae ferventis equitis ascendentis"
      en: "The noise of the whip, and the noise of the rattling of the wheels, and of the neighing horse, and of the running chariot, and of the horsemen coming up,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et micantis gladii et fulgurantis hastae et multitudinis interfectae et gravis ruinae nec est finis cadaverum et corruent in corporibus suis"
      en: "And of the shining sword, and of the glittering spear, and of a multitude slain, and of a grievous destruction: and there is no end of carcasses, and they shall fall down on their dead bodies."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "propter multitudinem fornicationum meretricis speciosae et gratae et habentis maleficia quae vendidit gentes in fornicationibus suis et familias in maleficiis suis"
      en: "Because of the multitude of the fornications of the harlot that was beautiful and agreeable, and that made use of witchcraft, that sold nations through her fornications, and families through her witchcrafts."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ecce ego ad te dicit Dominus exercituum et revelabo pudenda tua in facie tua et ostendam gentibus nuditatem tuam et regnis ignominiam tuam"
      en: "Behold I come against thee, saith the Lord of hosts: and I will discover thy shame to thy face, and will shew thy nakedness to the nations, and thy shame to kingdoms."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et proiciam super te abominationes et contumeliis te adficiam et ponam te in exemplum"
      en: "And I will cast abominations upon thee, and will disgrace thee, and will make an example of thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et erit omnis qui viderit te resiliet a te et dicet vastata est Nineve quis commovebit super te caput unde quaeram consolatorem tibi"
      en: "And it shall come to pass that every one that shall see thee, shall flee from thee, and shall say: Ninive is laid waste: who shall bemoan thee? whence shall I seek a comforter for thee?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "numquid melior es ab Alexandria populorum quae habitat in fluminibus aqua in circuitu eius cuius divitiae mare aquae muri eius"
      en: "Art thou better than the populous Alexandria, that dwelleth among the rivers? waters are round about it: the sea is its riches, the waters are its walls."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Aethiopia fortitudo et Aegyptus et non est finis Africa et Lybies fuerunt in auxilio tuo"
      en: "Ethiopia and Egypt were the strength thereof, and there is no end: Africa and the Libyans were thy helpers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sed et ipsa in transmigrationem ducta est in captivitatem parvuli eius elisi sunt in capite omnium viarum et super inclitos eius miserunt sortem et omnes optimates eius confixi sunt in conpedibus"
      en: "Yet she also was removed and carried into captivity: her young children were dashed in pieces at the top of every street, and they cast lots upon her nobles, and all her great men were bound in fetters."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et tu ergo inebriaberis eris despecta et tu quaeres auxilium ab inimico"
      en: "Therefore thou also shalt be made drunk, and shalt be despised: and thou shalt seek help from the enemy."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "omnes munitiones tuae sicuti ficus cum grossis suis si concussae fuerint cadent in os comedentis"
      en: "All thy strong holds shall be like fig trees with their green figs: if they be shaken, they shall fall into the mouth of the eater."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ecce populus tuus mulieres in medio tui inimicis tuis adapertione pandentur portae terrae tuae devorabit ignis vectes tuos"
      en: "Behold thy people in the midst of thee are women: the gates of thy land shall be set wide open to thy enemies, the fire shall devour thy bars."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "aquam propter obsidionem hauri tibi extrue munitiones tuas intra in lutum et calca subigens tene laterem"
      en: "Draw thee water for the siege, build up thy bulwarks: go into the clay, and tread, work it and make brick."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ibi comedet te ignis peribis gladio devorabit te ut bruchus congregare ut bruchus multiplicare ut lucusta"
      en: "There shall the fire devour thee: thou shalt perish by the sword, it shall devour thee like the bruchus: assemble together like the bruchus, make thyself many like the locust."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "plures fecisti negotiationes tuas quam stellae sunt caeli bruchus expansus est et avolavit"
      en: "Thou hast multiplied thy merchandises above the stars of heaven: the bruchus hath spread himself and flown away."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "custodes tui quasi lucustae et parvuli tui quasi lucustae lucustarum quae considunt in sepibus in die frigoris sol ortus est et avolaverunt et non est cognitus locus earum ubi fuerint"
      en: "Thy guards are like the locusts: and thy little ones like the locusts of locusts which swarm on the hedges in the day of cold: the sun arose, and they flew away, and their place was not known where they were."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dormitaverunt pastores tui rex Assur sepelientur principes tui latitavit populus tuus in montibus et non est qui congreget"
      en: "Thy shepherds have slumbered, O king of Assyria, thy princes shall be buried: thy people are hid in the mountains, and there is none to gather them together."
    status: { la: verified, en: verified }
