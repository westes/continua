# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 9
verses:
  - n: 1
    text:
      la: "Primo tempore alleviata est terra Zabulon et terra Nephthali: et novissimo aggravata est via maris trans Jordanem Galilaeae gentium."
      en: "At the first time the land of Zabulon, and the land of Nephtali was lightly touched: and at the last the way of the sea beyond the Jordan of the Galilee of the Gentiles was heavily loaded."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Populus qui ambulabat in tenebris, vidit lucem magnam; habitantibus in regione umbrae mortis, lux orta est eis."
      en: "The people that walked in darkness, have seen a great light: to them that dwelt in the region of the shadow of death, light is risen."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Multiplicasti gentem, et non magnificasti laetitiam. Laetabuntur coram te, sicut qui laetantur in messe; sicut exsultant victores capta praeda, quando dividunt spolia."
      en: "Thou hast multiplied the nation, and hast not increased the joy. They shall rejoice before thee, as they that rejoice in the harvest, as conquerors rejoice after taking a prey, when they divide the spoils."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Jugum enim oneris ejus, et virgam humeri ejus, et sceptrum exactoris ejus superasti, sicut in die Madian."
      en: "For the yoke of their burden, and the rod of their shoulder, and the sceptre of their oppressor thou hast overcome, as in the day of Median."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quia omnis violentia praedatio cum tumultu, et vestimentum mistum sanguine, erit in combustionem, et cibus ignis."
      en: "For every violent taking of spoils, with tumult, and garment mingled with blood, shall be burnt, and be fuel for the fire."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Parvulus enim natus est nobis, et filius datus est nobis, et factus est principatus super humerum ejus: et vocabitur nomen ejus, Admirabilis, Consiliarius, Deus, Fortis, Pater futuri saeculi, Princeps pacis."
      en: "For a CHILD IS BORN to us, and a son is given to us, and the government is upon his shoulder: and his name shall be called, Wonderful, Counsellor, God the Mighty, the Father of the world to come, the Prince of Peace."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Multiplicabitur ejus imperium, et pacis non erit finis; super solium David, et super regnum ejus sedebit, ut confirmet illud et corroboret in judicio et justitia, amodo usque in sempiternum: zelus Domini exercituum faciet hoc."
      en: "His empire shall be multiplied, and there shall be no end of peace: he shall sit upon the throne of David, and upon his kingdom; to establish it and strengthen it with judgment and with justice, from henceforth and for ever: the zeal of the Lord of hosts will perform this."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Verbum misit Dominus in Jacob, et cecidit in Israel."
      en: "The Lord sent a word into Jacob, and it hath lighted upon Israel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et sciet omnis populus Ephraim, et habitantes Samariam, in superbia et magnitudine cordis dicentes:"
      en: "And all the people of Ephraim shall know, and the inhabitants of Samaria that say in the pride and haughtiness of their heart:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Lateres ceciderunt, sed quadris lapidibus aedificabimus; sycomoros succiderunt, sed cedros immutabimus."
      en: "The bricks are fallen down, but we will build with square stones: they have cut down the sycamores, but we will change them for cedars."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et elevabit Dominus hostes Rasin super eum, et inimicos ejus in tumultum vertet."
      en: "And the Lord shall set up the enemies of Rasin over him, and shall bring on his enemies in a crowd:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Syriam ab oriente, et Philisthiim ab occidente; et devorabunt Israel toto ore. In omnibus his non est aversus furor ejus, sed adhuc manus ejus extenta."
      en: "The Syrians from the east, and the Philistines from the west: and they shall devour Israel with open mouth, For all this his indignation is not turned away, but his hand is stretched out still."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et populus non est reversus ad percutientem se, et Dominum exercituum non inquisierunt."
      en: "And the people are not returned to him who hath struck them, and have not sought after the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et disperdet Dominus ab Israel caput et caudam, incurvantem et refrenantem, die una."
      en: "And the Lord shall destroy out of Israel the head and the tail, him that bendeth down, and him that holdeth back, in one day."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Longaevus et honorabilis, ipse est caput; et propheta docens mendacium, ipse est cauda."
      en: "The aged and honourable, he is the head: and the prophet that teacheth lies, he is the tail."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et erunt qui beatificant populum istum, seducentes; et qui beatificantur, praecipitati."
      en: "And they that call this people blessed, shall cause them to err: and they that are called blessed, shall be thrown down headlong."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Propter hoc super adolescentulis ejus non laetabitur Dominus, et pupillorum ejus et viduarum non miserebitur: quia omnis hypocrita est et nequam, et universum os locutum est stultitiam; in omnibus his non est aversus furor ejus, sed adhuc manus ejus extenta."
      en: "Therefore the Lord shall have no joy in their young men: neither shall he have mercy on their fatherless, and widows: for every one is a hypocrite and wicked, and every mouth hath spoken folly. For all this his indignation is not turned away, but his hand is stretched out still."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Succensa est enim quasi ignis impietas: veprem et spinam vorabit, et succendetur in densitate saltus, et convolvetur superbia fumi."
      en: "For wickedness is kindled as a fire, it shall devour the brier and the thorn: and shall kindle in the thicket of the forest, and it shall be wrapped up in smoke ascending on high."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "In ira Domini exercituum conturbata est terra, et erit populus quasi esca ignis; vir fratri suo non parcet."
      en: "By the wrath of the Lord of hosts the land is troubled, and the people shall be as fuel for the fire: no man shall spare his brother."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et declinabit ad dexteram, et esuriet; et comedet ad sinistram, et non saturabitur; unusquisque carnem brachii sui vorabit: Manasses Ephraim, et Ephraim Manassen; simul ipsi contra Judam."
      en: "And he shall turn to the right hand, and shall be hungry: and shall eat on the left hand, and shall not be filled: every one shall eat the flesh of his own arm: Manasses Ephraim, and Ephraim Manasses, and they together shall be against Juda."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "In omnibus his non est aversus furor ejus, sed adhuc manus ejus extenta."
      en: "After all these things his indignation is not turned away, but his hand is stretched out still."
    status: { la: verified, en: verified }
