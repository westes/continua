# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 45
verses:
  - n: 1
    text:
      la: "haec dicit Dominus christo meo Cyro cuius adprehendi dexteram ut subiciam ante faciem eius gentes et dorsa regum vertam et aperiam coram eo ianuas et portae non cludentur"
      en: "Thus saith the Lord to my anointed Cyrus, whose right hand I have taken hold of, to subdue nations before his face, and to turn the backs of kings, and to open the doors before him, and the gates shall not be shut."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ego ante te ibo et gloriosos terrae humiliabo portas aereas conteram et vectes ferreos confringam"
      en: "I will go before thee, and will humble the great ones of the earth: I will break in pieces the gates of brass, and will burst the bars of iron."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dabo tibi thesauros absconditos et arcana secretorum ut scias quia ego Dominus qui voco nomen tuum Deus Israhel"
      en: "And I will give thee hidden treasures, and the concealed riches of secret places: that thou mayest know that I am the Lord who call thee by thy name, the God of Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "propter servum meum Iacob et Israhel electum meum et vocavi te in nomine tuo adsimilavi te et non cognovisti me"
      en: "For the sake of my servant Jacob, and Israel my elect, I have even called thee by thy name: I have made a likeness of thee, and thou hast not known me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ego Dominus et non est amplius extra me non est deus accinxi te et non cognovisti me"
      en: "I am the Lord, and there is none else: there is no God, besides me: I girded thee, and thou hast not known me:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut sciant hii qui ab ortu solis et qui ab occidente quoniam absque me non est ego Dominus et non est alter"
      en: "That they may know who are from the rising of the sun, and they who are from the west, that there is none besides me. I am the Lord, and there is none else:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "formans lucem et creans tenebras faciens pacem et creans malum ego Dominus faciens omnia haec"
      en: "I form the light, and create darkness, I make peace, and create evil: I the Lord that do all these things."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "rorate caeli desuper et nubes pluant iustum aperiatur terra et germinet salvatorem et iustitia oriatur simul ego Dominus creavi eum"
      en: "Drop down dew, ye heavens, from above, and let the clouds rain the just: let the earth be opened, and bud forth a saviour: and let justice spring up together: I the Lord have created him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "vae qui contradicit fictori suo testa de samiis terrae numquid dicet lutum figulo suo quid facis et opus tuum absque manibus est"
      en: "Woe to him that gainsayeth his maker, a sherd of the earthen pots: shall the clay say to him that fashioneth it: What art thou making, and thy work is without hands?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vae qui dicit patri quid generas et mulieri quid parturis"
      en: "Woe to him that saith to his father: Why begettest thou? and to the woman: Why dost thou bring forth?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "haec dicit Dominus Sanctus Israhel plastes eius ventura interrogate me super filios meos et super opus manuum mearum mandastis mihi"
      en: "Thus saith the Lord the Holy One of Israel, his maker: Ask me of things to come, concerning my children, and concerning the work of my hands give ye charge to me."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ego feci terram et hominem super eam creavi ego manus meae tetenderunt caelos et omni militiae eorum mandavi"
      en: "I made the earth: and I created man upon it: my hand stretched forth the heavens, and I have commanded all their host."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ego suscitavi eum ad iustitiam et omnes vias eius dirigam ipse aedificabit civitatem meam et captivitatem meam dimittet non in pretio neque in muneribus dicit Dominus Deus exercituum"
      en: "I have raised him up to justice, and I will direct all his ways: he shall build my city, and let go my captives, not for ransom, nor for presents, saith the Lord the God of hosts."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "haec dicit Dominus labor Aegypti et negotiatio Aethiopiae et Sabaim viri sublimes ad te transibunt et tui erunt post te ambulabunt vincti manicis pergent et te adorabunt teque deprecabuntur tantum in te est Deus et non est absque te deus"
      en: "Thus saith the Lord: The labour of Egypt, and the merchandise of Ethiopia, and of Sabaim, men of stature shall come over to thee, and shall be thins: they shall walk after thee, they shall go bound with manacles: and they shall worship thee, and shall make supplication to thee: only in thee is God, and there is no God besides thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vere tu es Deus absconditus Deus Israhel salvator"
      en: "Verily thou art a hidden God, the God of Israel the saviour."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "confusi sunt et erubuerunt omnes simul abierunt in confusione fabricatores errorum"
      en: "They are all confounded and ashamed: the forgers of errors are gone together into confusion."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Israhel salvatus est in Domino salute aeterna non confundemini et non erubescetis usque in saeculum saeculi"
      en: "Israel is saved in the Lord with as eternal salvation: you shall not be con- founded, and you shall not be ashamed for ever and ever."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quia haec dicit Dominus creans caelos ipse Deus formans terram et faciens eam ipse plastes eius non in vanum creavit eam ut habitetur formavit eam ego Dominus et non est alius"
      en: "For thus saith the Lord that created the heavens, God himself that formed the earth, and made it, the very maker thereof: he did not create it in vain: he formed it to be inhabited. I am the Lord, and there is no other."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non in abscondito locutus sum in loco terrae tenebroso non dixi semini Iacob frustra quaerite me ego Dominus loquens iustitiam adnuntians recta"
      en: "I have not spoken in secret, in a dark place of the earth: I have not said to the seed of Jacob: Seek me in vain. I am the Lord that speak justice, that declare right things."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "congregamini et venite et accedite simul qui salvati estis ex gentibus nescierunt qui levant lignum sculpturae suae et rogant deum non salvantem"
      en: "Assemble yourselves, and come, and draw near together, ye that are saved of the Gentiles: they have no knowledge that set up the wood of their graven work, and pray to a god that cannot save."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "adnuntiate et venite et consiliamini simul quis auditum fecit hoc ab initio ex tunc praedixit illud numquid non ego Dominus et non est ultra Deus absque me Deus iustus et salvans non est praeter me"
      en: "Tell ye, and come, and consult together: who hath declared this from the beginning, who hath foretold this from that time? Have not I the Lord, and there is no God else besides me? A just God and a saviour, there is none besides me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "convertimini ad me et salvi eritis omnes fines terrae quia ego Deus et non est alius"
      en: "Be converted to me, and you shall be saved, all ye ends of the earth: for I am God, and there is no other."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "in memet ipso iuravi egredietur de ore meo iustitiae verbum et non revertetur quia mihi curvabunt omnia genu et iurabit omnis lingua"
      en: "I have sworn by myself, the word of justice shall go out of my mouth, and shall not return:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ergo in Domino dicet meae sunt iustitiae et imperium ad eum venient et confundentur omnes qui repugnant ei"
      en: "For every knee shall be bowed to me, and every tongue shall swear."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "in Domino iustificabitur et laudabitur omne semen Israhel"
      en: "Therefore shall he say: In the Lord are my justices and empire: they shall come to him, and all that resist him shall be confounded."
    status: { la: verified, en: verified }
