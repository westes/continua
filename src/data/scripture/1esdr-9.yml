# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1esdr
chapter: 9
verses:
  - n: 1
    text:
      la: "Postquam autem haec completa sunt, accesserunt ad me principes, dicentes: Non est separatus populus Israel, sacerdotes et Levitae, a populis terrarum, et abominationibus eorum: Chananaei videlicet, et Hethaei, et Pherezaei, et Jebusaei, et Ammonitarum, et Moabitarum, et Aegyptiorum, et Amorrhaeorum:"
      en: "And after these things were accomplished, the princes came to me, saying: The people of Israel, and the priests and Levites have not separated themselves from the people of the lands, and from their abominations, namely, of the Chanaanites, and the Hethites, and the Pherezites, and the Jebusites, and the Ammonites, and the Moabites, and the Egyptians, and the Amorrhites."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tulerunt enim de filiabus eorum sibi et filiis suis, et commiscuerunt semen sanctum cum populis terrarum: manus etiam principum et magistratuum fuit in transgressione hac prima."
      en: "For they have taken of their daughters for themselves and for their sons, and they have mingled the holy seed with the people of the lands. And the hand of the princes and magistrates hath been first in this transgression."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cumque audissem sermonem istum, scidi pallium meum et tunicam, et evelli capillos capitis mei et barbae, et sedi moerens."
      en: "And when I had heard this word, I rent my mantle and my coat, and plucked off the hairs of my head and my beard, and I sat down mourning."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Convenerunt autem ad me omnes, qui timebant verbum Dei Israel, pro transgressione eorum qui de captivitate venerant, et ego sedebam tristis usque ad sacrificium vespertinum:"
      en: "And there were assembled to me all that feared the God of Israel, because of the transgression of those that were come from the captivity, and I sat sorrowful, until the evening sacrifice."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et in sacrificio vespertino, surrexi de afflictione mea, et scisso pallio et tunica, curvavi genua mea, et expandi manus meas ad Dominum Deum meum."
      en: "And at the evening sacrifice I rose up from my affliction, and having rent my mantle and my garment, I fell upon my knees, and spread out my hands to the Lord my God,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dixi: Deus meus, confundor et erubesco levare faciem meam ad te: quoniam iniquitates nostrae multiplicatae sunt super caput nostrum, et delicta nostra creverunt usque ad caelum,"
      en: "And said: My God I am confounded and ashamed to lift up my face to thee: for our iniquities are multiplied over our heads, and our sins are grown up even unto heaven,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "a diebus patrum nostrorum: sed et nos ipsi peccavimus graviter usque ad diem hanc, et in iniquitatibus nostris traditi sumus ipsi, et reges nostri, et sacerdotes nostri in manum regum terrarum, et in gladium, et in captivitatem, et in rapinam, et in confusionem vultus, sicut et die hac."
      en: "From the days of our fathers: and we ourselves also have sinned grievously unto this day, and for our iniquities we and our kings, and our priests have been delivered into the hands of the kings of the lands, and to the sword, and to captivity, and to spoil, and to confusion of face, as it is at this day."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et nunc quasi parum et ad momentum facta est deprecatio nostra apud Dominum Deum nostrum, ut dimitterentur nobis reliquiae, et daretur nobis paxillus in loco sancto ejus, et illuminaret oculos nostros Deus noster, et daret nobis vitam modicam in servitute nostra,"
      en: "And now as a little, and for a moment has our prayer been made before the Lord our God, to leave us a remnant, and give us a pin in his holy place, and that our God would enlighten our eyes, and would give us a little life in our bondage."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia servi sumus, et in servitute nostra non dereliquit nos Deus noster, sed inclinavit super nos misericordiam coram rege Persarum, ut daret nobis vitam, et sublimaret domum Dei nostri, et exstrueret solitudines ejus, et daret nobis sepem in Juda et Jerusalem."
      en: "For we are bondmen, and in our bondage our God hath not forsaken us, but hath extended mercy upon us before the king of the Persians, to give us life, and to set up the house of our God, and rebuild the desolations thereof, and to give us a fence in Juda and Jerusalem."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et nunc quid dicemus, Deus noster, post haec? Quia dereliquimus mandata tua,"
      en: "And now, O our God, what shall we say after this? for we have forsaken thy commandments,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quae praecepisti in manu servorum tuorum prophetarum, dicens: Terra, ad quam vos ingredimini ut possideatis eam, terra immunda est juxta immunditiam populorum, ceterarumque terrarum, abominationibus eorum qui repleverunt eam ab ore usque ad os in coinquinatione sua."
      en: "Which thou hast commanded by the hand of thy servants the prophets, saying: The land which you go to possess, is an unclean land, according to the uncleanness of the people, and of other lands, with their abominations, who have filled it from mouth to mouth with their filth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nunc ergo filias vestras ne detis filiis eorum, et filias eorum ne accipiatis filiis vestris, et non quaeratis pacem eorum, et prosperitatem eorum usque in aeternum: ut confortemini, et comedatis quae bona sunt terrae, et haeredes habeatis filios vestros usque in saeculum."
      en: "Now therefore give not your daughters to their sons, and take not their daughters for your sons, and seek not their peace, nor their prosperity forever: that you may be strengthened, and may eat the good things of the land, and may have your children your heirs for ever."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et post omnia quae venerunt super nos in operibus nostris pessimis, et in delicto nostro magno, quia tu, Deus noster, liberasti nos de iniquitate nostra, et dedisti nobis salutem sicut est hodie,"
      en: "And after all that is come upon us, for our most wicked deeds, and our great sin, seeing that thou our God hast saved us from our iniquity, and hast given us a deliverance as at this day,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ut non converteremur, et irrita faceremus mandata tua, neque matrimonia jungeremus cum populis abominationum istarum. Numquid iratus es nobis usque ad consummationem ne dimitteres nobis reliquias ad salutem?"
      en: "That we should not turn away, nor break thy commandments, nor join in marriage with the people of these abominations. Art thou angry with us unto utter destruction, not to leave us a remnant to be saved?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Domine Deus Israel, justus es tu: quoniam derelicti sumus, qui salvaremur sicut die hac. Ecce coram te sumus in delicto nostro: non enim stari potest coram te super hoc."
      en: "O Lord God of Israel, thou art just: for we remain yet to be saved as at this day. Behold we are before thee in our sin, for there can be no standing before thee in this matter."
    status: { la: verified, en: verified }
