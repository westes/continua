# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2tim
chapter: 2
verses:
  - n: 1
    text:
      la: "tu ergo fili mi confortare in gratia quae est in Christo Iesu"
      en: "Thou therefore, my son, be strong in the grace which is in Christ Jesus:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et quae audisti a me per multos testes haec commenda fidelibus hominibus qui idonei erunt et alios docere"
      en: "And the things which thou hast heard of me by many witnesses, the same commend to faithful men, who shall be fit to teach others also."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "labora sicut bonus miles Christi Iesu"
      en: "Labour as a good soldier of Christ Jesus."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nemo militans inplicat se negotiis saecularibus ut ei placeat cui se probavit"
      en: "No man, being a soldier to God, entangleth himself with secular businesses; that he may please him to whom he hath engaged himself."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nam et qui certat in agone non coronatur nisi legitime certaverit"
      en: "For he also that striveth for the mastery, is not crowned, except he strive lawfully."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "laborantem agricolam oportet primum de fructibus accipere"
      en: "The husbandman, that laboureth, must first partake of the fruits."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "intellege quae dico dabit enim tibi Dominus in omnibus intellectum"
      en: "Understand what I say: for the Lord will give thee in all things understanding."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "memor esto Iesum Christum resurrexisse a mortuis ex semine David secundum evangelium meum"
      en: "Be mindful that the Lord Jesus Christ is risen again from the dead, of the seed of David, according to my gospel."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in quo laboro usque ad vincula quasi male operans sed verbum Dei non est alligatum"
      en: "Wherein I labour even unto bands, as an evildoer; but the word of God is not bound."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ideo omnia sustineo propter electos ut et ipsi salutem consequantur quae est in Christo Iesu cum gloria caelesti"
      en: "Therefore I endure all things for the sake of the elect, that they also may obtain the salvation, which is in Christ Jesus, with heavenly glory."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "fidelis sermo nam si conmortui sumus et convivemus"
      en: "A faithful saying: for if we be dead with him, we shall live also with him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si sustinemus et conregnabimus si negabimus et ille negabit nos"
      en: "If we suffer, we shall also reign with him. If we deny him, he will also deny us."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "si non credimus ille fidelis manet negare se ipsum non potest"
      en: "If we believe not, he continueth faithful, he can not deny himself."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "haec commone testificans coram Domino noli verbis contendere in nihil utile ad subversionem audientium"
      en: "Of these things put them in mind, charging them before the Lord. Contend not in words, for it is to no profit, but to the subverting of the hearers."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sollicite cura te ipsum probabilem exhibere Deo operarium inconfusibilem recte tractantem verbum veritatis"
      en: "Carefully study to present thyself approved unto God, a workman that needeth not to be ashamed, rightly handling the word of truth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "profana autem inaniloquia devita multum enim proficient ad impietatem"
      en: "But shun profane and vain babblings: for they grow much towards ungodliness."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et sermo eorum ut cancer serpit ex quibus est Hymeneus et Philetus"
      en: "And their speech spreadeth like a canker: of whom are Hymeneus and Philetus:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui a veritate exciderunt dicentes resurrectionem iam factam et subvertunt quorundam fidem"
      en: "Who have erred from the truth, saying, that the resurrection is past already, and have subverted the faith of some."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "sed firmum fundamentum Dei stetit habens signaculum hoc cognovit Dominus qui sunt eius et discedat ab iniquitate omnis qui nominat nomen Domini"
      en: "But the sure foundation of God standeth firm, having this seal: the Lord knoweth who are his; and let every one depart from iniquity who nameth the name of the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in magna autem domo non solum sunt vasa aurea et argentea sed et lignea et fictilia et quaedam quidem in honorem quaedam autem in contumeliam"
      en: "But in a great house there are not only vessels of gold and silver, but also of wood and earth: and some indeed unto honour, but some unto dishonour."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "si quis ergo emundaverit se ab istis erit vas in honorem sanctificatum et utile Domino ad omne opus bonum paratum"
      en: "If any man therefore shall cleanse himself from these, he shall be a vessel unto honour, sanctified and profitable to the Lord, prepared unto every good work."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "iuvenilia autem desideria fuge sectare vero iustitiam fidem caritatem pacem cum his qui invocant Dominum de corde puro"
      en: "But flee thou youthful desires, and pursue justice, faith, charity, and peace, with them that call on the Lord out of a pure heart."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "stultas autem et sine disciplina quaestiones devita sciens quia generant lites"
      en: "And avoid foolish and unlearned questions, knowing that they beget strifes."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "servum autem Domini non oportet litigare sed mansuetum esse ad omnes docibilem patientem"
      en: "But the servant of the Lord must not wrangle: but be mild towards all men, apt to teach, patient,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cum modestia corripientem eos qui resistunt nequando det illis Deus paenitentiam ad cognoscendam veritatem"
      en: "With modesty admonishing them that resist the truth: if peradventure God may give them repentance to know the truth,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et resipiscant a diaboli laqueis a quo capti tenentur ad ipsius voluntatem"
      en: "And they may recover themselves from the snares of the devil, by whom they are held captive at his will."
    status: { la: verified, en: verified }
