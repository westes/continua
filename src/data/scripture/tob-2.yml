# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: tob
chapter: 2
verses:
  - n: 1
    text:
      la: "Post haec vero, cum esset dies festus Domini, et factum esset prandium bonum in domo Tobiae,"
      en: "But after this, when there was a festival of the Lord, and a good dinner was prepared in Tobias's house,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixit filio suo: Vade, et adduc aliquos de tribu nostra, timentes Deum, ut epulentur nobiscum."
      en: "He said to his son: Go, and bring some of our tribe that fear God, to feast with us."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cumque abiisset, reversus nuntiavit ei unum ex filiis Israel jugulatum jacere in platea. Statimque exiliens de accubitu suo, relinquens prandium, jejunus pervenit ad corpus:"
      en: "And when he had gone, returning he told him, that one of the children of Israel lay slain in the street. And he forthwith leaped up from his place at the table, and left his dinner, and came fasting to the body:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "tollensque illud portavit ad domum suam occulte, ut dum sol occubuisset, caute sepeliret eum."
      en: "And taking it up carried it privately to his house, that after the sun was down, he might bury him cautiously."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque occultasset corpus, manducavit panem cum luctu et tremore,"
      en: "And when he had hid the body, he ate bread with mourning and fear,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "memorans illum sermonem, quem dixit Dominus per Amos prophetam: Dies festi vestri convertentur in lamentationem et luctum."
      en: "Remembering the word which the Lord spoke by Amos the prophet: Your festival days shall be turned into lamentation and mourning."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cum vero sol occubuisset, abiit, et sepelivit eum."
      en: "So when the sun was down, he went and buried him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Arguebant autem eum omnes proximi ejus, dicentes: Jam hujus rei causa interfici jussus es, et vix effugisti mortis imperium, et iterum sepelis mortuos?"
      en: "Now all his neighbours blamed him, saying: Once already commandment was given for thee to be slain because of this matter, and thou didst scarce escape the sentence of death, and dost thou again bury the dead?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sed Tobias plus timens Deum quam regem, rapiebat corpora occisorum, et occultabat in domo sua, et mediis noctibus sepeliebat ea."
      en: "But Tobias fearing God more than the king, carried off the bodies of them that were slain, and hid them in his house, and at midnight buried them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Contigit autem ut quadam die fatigatus a sepultura, veniens in domum suam, jactasset se juxta parietem, et obdormisset,"
      en: "Now it happened one day, that being wearied with burying, he came to his house, and cast himself down by the wall and slept,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ex nido hirundinum dormienti illi calida stercora inciderent super oculos ejus, fieretque caecus."
      en: "And as he was sleeping, hot dung out of a swallow's nest fell upon his eyes, and he was made blind."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Hanc autem tentationem ideo permisit Dominus evenire illi, ut posteris daretur exemplum patientiae ejus, sicut et sancti Job."
      en: "Now this trial the Lord therefore permitted to happen to him, that an example might be given to posterity of his patience, as also of holy Job."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nam cum ab infantia sua semper Deum timuerit, et mandata ejus custodierit, non est contristatus contra Deum quod plaga caecitatis evenerit ei,"
      en: "For whereas he had always feared God from his infancy, and kept his commandments, he repined not against God because the evil of blindness had befallen him,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sed immobilis in Dei timore permansit, agens gratias Deo omnibus diebus vitae suae."
      en: "But continued immoveable in the fear of God, giving thanks to God all the days of his life."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Nam sicut beato Job insultabant reges, ita isti parentes et cognati ejus irridebant vitam ejus, dicentes:"
      en: "For as the kings insulted over holy Job: so his relations and kinsmen mocked at his life, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ubi est spes tua, pro qua eleemosynas et sepulturas faciebas?"
      en: "Where is thy hope, for which thou gavest alms, and buriedst the dead?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tobias vero increpabat eos, dicens: Nolite ita loqui:"
      en: "But Tobias rebuked them, saying: Speak not so:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quoniam filii sanctorum sumus, et vitam illam expectamus, quam Deus daturus est his, qui fidem suam numquam mutant ab eo."
      en: "For we are the children of the saints, and look for that life which God will give to those that never change their faith from him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Anna vero uxor ejus ibat ad opus textrinum quotidie, et de labore manuum suarum victum, quem consequi poterat, deferebat."
      en: "Now Anna his wife went daily to weaving work, and she brought home what she could get for their living by the labour of her hands."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Unde factum est, et haedum caprarum accipiens detulisset domi:"
      en: "Whereby it came to pass, that she received a young kid, and brought it home:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "cujus cum vocem balantis vir ejus audisset, dixit: Videte, ne forte furtivus sit, reddite cum dominis suis, quia non licet nobis aut edere ex furto aliquid, aut contingere."
      en: "And when her husband heard it bleating, he said: Take heed, lest perhaps it be stolen: restore ye it to its owners, for it is not lawful for us either to eat or to touch any thing that cometh by theft."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ad haec uxor ejus irata respondit: Manifeste vana facta est spes tua, et eleemosynae tuae modo apparuerunt."
      en: "At these words his wife being angry answered: It is evident thy hope is come to nothing, and thy alms now appear."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Atque his et aliis hujuscemodi verbis exprobrabat ei."
      en: "And with these, and other such like words she upbraided him."
    status: { la: verified, en: verified }
