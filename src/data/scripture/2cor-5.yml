# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 5
verses:
  - n: 1
    text:
      la: "Scimus enim quoniam si terrestris domus nostra hujus habitationis dissolvatur, quod aedificationem ex Deo habemus, domum non manufactam, aeternam in caelis."
      en: "For we know, if our earthly house of this habitation be dissolved, that we have a building of God, a house not made with hands, eternal in heaven."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Nam et in hoc ingemiscimus, habitationem nostram, quae de caelo est, superindui cupientes:"
      en: "For in this also we groan, desiring to be clothed upon with our habitation that is from heaven."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "si tamen vestiti, non nudi inveniamur."
      en: "Yet so that we be found clothed, not naked."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nam et qui sumus in hoc tabernaculo, ingemiscimus gravati: eo quod nolumus expoliari, sed supervestiri, ut absorbeatur quod mortale est, a vita."
      en: "For we also, who are in this tabernacle, do groan, being burthened; because we would not be unclothed, but clothed upon, that that which is mortal may be swallowed up by life."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Qui autem efficit nos in hoc ipsum, Deus, qui dedit nobis pignus Spiritus."
      en: "Now he that maketh us for this very thing, is God, who hath given us the pledge of the Spirit."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Audentes igitur semper, scientes quoniam dum sumus in corpore, peregrinamur a Domino"
      en: "Therefore having always confidence, knowing that, while we are in the body, we are absent from the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "( per fidem enim ambulamus, et non per speciem):"
      en: "(For we walk by faith, and not by sight.)"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "audemus autem, et bonam voluntatem habemus magis peregrinari a corpore, et praesentes esse ad Dominum."
      en: "But we are confident, and have a good will to be absent rather from the body, and to be present with the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ideo contendimus, sive absentes, sive praesentes, placere illi."
      en: "And therefore we labour, whether absent or present, to please him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Omnes enim nos manifestari oportet ante tribunal Christi, ut referat unusquisque propria corporis, prout gessit, sive bonum, sive malum."
      en: "For we must all be manifested before the judgment seat of Christ, that every one may receive the proper things of the body, according as he hath done, whether it be good or evil."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Scientes ergo timorem Domini, hominibus suademus, Deo autem manifesti sumus. Spero autem et in conscientiis vestris manifestos nos esse."
      en: "Knowing therefore the fear of the Lord, we use persuasion to men; but to God we are manifest. And I trust also that in your consciences we are manifest."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Non iterum commendamus nos vobis, sed occasionem damus vobis gloriandi pro nobis: ut habeatis ad eos qui in facie gloriantur, et non in corde."
      en: "We commend not ourselves again to you, but give you occasion to glory in our behalf; that you may have somewhat to answer them who glory in face, and not in heart."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sive enim mente excedimus Deo: sive sobrii sumus, vobis."
      en: "For whether we be transported in mind, it is to God; or whether we be sober, it is for you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Caritas enim Christi urget nos: aestimantes hoc, quoniam si unus pro omnibus mortuus est, ergo omnes mortui sunt:"
      en: "For the charity of Christ presseth us: judging this, that if one died for all, then all were dead."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et pro omnibus mortuus est Christus: ut, et qui vivunt, jam non sibi vivant, sed ei qui pro ipsis mortuus est et resurrexit."
      en: "And Christ died for all; that they also who live, may not now live to themselves, but unto him who died for them, and rose again."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Itaque nos ex hoc neminem novimus secundum carnem. Et si cognovimus secundum carnem Christum, sed nunc jam non novimus."
      en: "Wherefore henceforth, we know no man according to the flesh. And if we have known Christ according to the flesh; but now we know him so no longer."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Si qua ergo in Christo nova creatura, vetera transierunt: ecce facta sunt omnia nova."
      en: "If then any be in Christ a new creature, the old things are passed away, behold all things are made new."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Omnia autem ex Deo, qui nos reconciliavit sibi per Christum: et dedit nobis ministerium reconciliationis,"
      en: "But all things are of God, who hath reconciled us to himself by Christ; and hath given to us the ministry of reconciliation."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quoniam quidem Deus erat in Christo mundum reconcilians sibi, non reputans illis delicta ipsorum, et posuit in nobis verbum reconciliationis."
      en: "For God indeed was in Christ, reconciling the world to himself, not imputing to them their sins; and he hath placed in us the word of reconciliation."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Pro Christo ergo legatione fungimur, tamquam Deo exhortante per nos. Obsecramus pro Christo, reconciliamini Deo."
      en: "For Christ therefore we are ambassadors, God as it were exhorting by us. For Christ, we beseech you, be reconciled to God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Eum, qui non noverat peccatum, pro nobis peccatum fecit, ut nos efficeremur justitia Dei in ipso."
      en: "Him, who knew no sin, he hath made sin for us, that we might be made the justice of God in him."
    status: { la: verified, en: verified }
