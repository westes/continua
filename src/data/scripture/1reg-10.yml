# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 10
verses:
  - n: 1
    text:
      la: "Tulit autem Samuel lenticulam olei, et effudit super caput ejus, et deosculatus est eum, et ait: Ecce, unxit te Dominus super haereditatem suam in principem, et liberabis populum suum de manibus inimicorum ejus, qui in circuitu ejus sunt. Et hoc tibi signum, quia unxit te Deus in principem."
      en: "And Samuel took a little vial of oil and poured it upon his head, and kissed him, and said: Behold, the Lord hath anointed thee to be prince over his inheritance, and thou shalt deliver his people out of the hands of their enemies, that are round about them. And this shall be a sign unto thee, that God hath anointed thee to be prince."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cum abieris hodie a me, invenies duos viros juxta sepulchrum Rachel in finibus Benjamin, in meridie, dicentque tibi: Inventae sunt asinae, ad quas ieras perquirendas: et intermissis pater tuus asinis, sollicitus est pro vobis, et dicit: Quid faciam de filio meo?"
      en: "When thou shalt depart from me this day, thou shalt find two men by the sepulchre of Rachel in the borders of Benjamin to the south, and they shall say to thee: The asses are found which thou wentest to seek: and thy father thinking no more of the asses is concerned for you, and saith: What shall I do for my son?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cumque abieris inde, et ultra transieris, et veneris ad quercum Thabor, invenient te ibi tres viri ascendentes ad Deum in Bethel, unus portans tres haedos, et alius tres tortas panis, et alius portans lagenam vini."
      en: "And when thou shalt depart from thence, and go farther on, and shalt come to the oak of Thabor, there shall meet thee three men going up to God to Bethel, one carrying three kids, and another three loaves of bread, and another carrying a bottle of wine."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cumque te salutaverint, dabunt tibi duos panes, et accipies de manu eorum."
      en: "And they will salute thee, and will give thee two loaves, and thou shalt take them at their hand."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Post haec venies in collem Dei, ubi est statio Philisthinorum: et cum ingressus fueris ibi urbem, obvium habebis gregem prophetarum descendentium de excelso, et ante eos psalterium et tympanum, et tibiam, et citharam, ipsosque prophetantes."
      en: "After that thou shalt come to the hill of God, where the garrison of the Philistines is: and when thou shalt be come there into the city, thou shalt meet a company of prophets coming down from the high place, with a psaltery and a timbrel, and a pipe, and a harp before them, and they shall be prophesying."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et insiliet in te Spiritus Domini, et prophetabis cum eis, et mutaberis in virum alium."
      en: "And the spirit of the Lord shall come upon thee, and thou shalt prophesy with them, and shalt be changed into another man."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quando ergo evenerint signa haec omnia tibi, fac quaecumque invenerit manus tua, quia Dominus tecum est."
      en: "When therefore these signs shall happen to thee, do whatsoever thy hand shall find, for the Lord is with thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et descendes ante me in Galgala ( ego quippe descendam ad te), ut offeras oblationem, et immoles victimas pacificas: septem diebus expectabis, donec veniam ad te, et ostendam tibi quid facias."
      en: "And thou shalt go down before me to Galgal, (for I will come down to thee,) that thou mayest offer an oblation, and sacrifice victims of peace: seven days shalt thou wait, till I come to thee, and I will shew thee what thou art to do."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Itaque cum avertisset humerum suum ut abiret a Samuele, immutavit ei Deus cor aliud, et venerunt omnia signa haec in die illa."
      en: "So when he had turned his back to go from Samuel, God gave unto him another heart, and all these things came to pass that day."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Veneruntque ad praedictum collem, et ecce cuneus prophetarum obvius ei: et insiluit super eum spiritus Domini, et prophetavit in medio eorum."
      en: "And they came to the foresaid hill, and behold a company of prophets met him: and the spirit of the Lord came upon him, and he prophesied in the midst of them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Videntes autem omnes qui noverant eum heri et nudiustertius, quod esset cum prophetis, et prophetaret, dixerunt ad invicem: Quaenam res accidit filio Cis? num et Saul inter prophetas?"
      en: "And all that had known him yesterday and the day before, seeing that he was with the prophets, and prophesied, said to each other: What is this that hath happened to the son of Cis? Is Saul also among the prophets?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Responditque alius ad alterum, dicens: Et quis pater eorum? Propterea versum est in proverbium: Num et Saul inter prophetas?"
      en: "And one answered another, saying: And who is their father? therefore it became a proverb: Is Saul also among the prophets?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cessavit autem prophetare, et venit ad excelsum."
      en: "And when he had made an end of prophesying, he came to the high place."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixitque patruus Saul ad eum, et ad puerum ejus: Quo abistis? Qui responderunt: Quaerere asinas: quas cum non reperissemus, venimus ad Samuelem."
      en: "And Saul's uncle said to him, and to his servant: Whither went you? They answered: To seek the asses: and not finding them we went to Samuel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et dixit ei patruus suus: Indica mihi quid dixerit tibi Samuel."
      en: "And his uncle said to him: Tell me what Samuel said to thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et ait Saul ad patruum suum: Indicavit nobis quia inventae essent asinae. De sermone autem regni non indicavit ei quem locutus fuerat ei Samuel."
      en: "And Saul said to his uncle: He told us that the asses were found. But of the matter of the kingdom of which Samuel had spoken to him, he told him not."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et convocavit Samuel populum ad Dominum in Maspha:"
      en: "And Samuel called together the people to the Lord in Maspha:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ait ad filios Israel: Haec dicit Dominus Deus Israel: Ego eduxi Israel de Aegypto, et erui vos de manu Aegyptiorum, et de manu omnium regum qui affligebant vos."
      en: "And he said to the children of Israel: Thus saith the Lord the God of Israel: I brought up Israel out of Egypt, and delivered you from the hand of the Egyptians, and from the hand of all the kings who afflicted you."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Vos autem hodie projecistis Deum vestrum, qui solus salvavit vos de universis malis et tribulationibus vestris: et dixistis: Nequaquam: sed regem constitue super nos. Nunc ergo state coram Domino per tribus vestras, et per familias."
      en: "But you this day have rejected your God, who only hath saved you out of all your evils and your tribulations: and you have said: Nay: but set a king over us. Now therefore stand before the Lord by your tribes, and by your families."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et applicuit Samuel omnes tribus Israel, et cecidit sors tribus Benjamin."
      en: "And Samuel brought to him all the tribes of Israel, and the lot fell on the tribe of Benjamin."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et applicuit tribum Benjamin et cognationes ejus, et cecidit cognatio Metri, et pervenit usque ad Saul filium Cis. Quaesierunt ergo eum, et non est inventus."
      en: "And he brought the tribe of Benjamin and the kindreds thereof, and the lot fell Upon the kindred of Metri, and it came to Saul the son of Cis. They sought him therefore and he was not found."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et consuluerunt post haec Dominum utrumnam venturus esset illuc. Responditque Dominus: Ecce absconditus est domi."
      en: "And after this they consulted the Lord whether he would come thither. And the Lord answered: Behold he is hidden at home."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cucurrerunt itaque et tulerunt eum inde: stetitque in medio populi, et altior fuit universo populo ab humero et sursum."
      en: "And they ran and fetched him thence: and he stood in the midst of the people, and he was higher than any of the people from the shoulders and upward."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et ait Samuel ad omnem populum: Certe videtis quem elegit Dominus, quoniam non sit similis illi in omni populo. Et clamavit omnis populus, et ait: Vivat rex."
      en: "And Samuel said to all the people: Surely you see him whom the Lord hath chosen, that there is none like him among all the people. And all the people cried and said: God save the king."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Locutus est autem Samuel ad populum legem regni, et scripsit in libro, et reposuit coram Domino: et dimisit Samuel omnem populum, singulos in domum suam."
      en: "And Samuel told the people the law of the kingdom, and wrote it in a book, and laid it up before the Lord: and Samuel sent away all the people, every one to his own house."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sed et Saul abiit in domum suam in Gabaa: et abiit cum eo pars exercitus, quorum tetigerat Deus corda."
      en: "Saul also departed to his own house in Gabaa: and there went with him a part of the army, whose hearts God had touched."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Filii vero Belial dixerunt: Num salvare nos poterit iste? Et despexerunt eum, et non attulerunt ei munera: ille vero dissimulabat se audire."
      en: "But the children of Belial said: Shall this fellow be able to save us? And they despised him, and brought him no presents, but he dissembled as though he heard not."
    status: { la: verified, en: verified }
