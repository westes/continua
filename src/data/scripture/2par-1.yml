# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 1
verses:
  - n: 1
    text:
      la: "Confortatus est ergo Salomon filius David in regno suo, et Dominus Deus ejus erat cum eo, et magnificavit eum in excelsum."
      en: "And Solomon the son of David was strengthened in his kingdom, and the Lord his God was with him, and magnified him to a high degree."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Praecepitque Salomon universo Israeli, tribunis, et centurionibus, et ducibus, et judicibus omnis Israel, et principibus familiarum:"
      en: "And Solomon gave orders to all Israel, to the captains of thousands, and of hundreds, and to the rulers, and to the judges of all Israel, and the heads of the families:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et abiit cum universa multitudine in excelsum Gabaon, ubi erat tabernaculum foederis Dei, quod fecit Moyses famulus Dei in solitudine."
      en: "And he went with all the multitude to the high place of Gabaon, where was the tabernacle of the covenant of the Lord, which Moses the servant of God made, in the wilderness."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Arcam autem Dei adduxerat David de Cariathiarim in locum quem praeparaverat ei, et ubi fixerat illi tabernaculum, hoc est, in Jerusalem."
      en: "For David had brought the ark of God from Cariathiarim to the place, which he had prepared for it, and where he had pitched a tabernacle for it, that is, in Jerusalem."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Altare quoque aeneum, quod fabricatus fuerat Beseleel filius Uri filii Hur, ibi erat coram tabernaculo Domini: quod et requisivit Salomon, et omnis ecclesia."
      en: "And the altar of brass, which Beseleel the son of Uri the son of Hur had made, was there before the tabernacle of the Lord: and Solomon and all the assembly sought it:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ascenditque Salomon ad altare aeneum, coram tabernaculo foederis Domini, et obtulit in eo mille hostias."
      en: "And Solomon went up thither to the brazen altar, before the tabernacle of the covenant of the Lord, and offered up on it a thousand victims."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ecce autem in ipsa nocte apparuit ei Deus, dicens: Postula quod vis, ut dem tibi."
      en: "And behold that night God appeared to him, saying: Ask what thou wilt that I should give thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixitque Salomon Deo: Tu fecisti cum David patre meo misericordiam magnam, et constituisti me regem pro eo."
      en: "And Solomon said to God: Thou hast shewn great kindness to my father David: and hast made me king in his stead."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nunc ergo Domine Deus, impleatur sermo tuus, quem pollicitus es David patri meo: tu enim me fecisti regem super populum tuum multum, qui tam innumerabilis est quam pulvis terrae."
      en: "Now therefore, O Lord God, let thy word be fulfilled, which thou hast promised to David my father: for thou hast made me king over thy great people, which is as innumerable as the dust of the earth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Da mihi sapientiam et intelligentiam, ut ingrediar et egrediar coram populo tuo: quis enim potest hunc populum tuum digne, qui tam grandis est, judicare?"
      en: "Give me wisdom and knowledge that I may come in and go out before thy people: for who can worthily judge this thy people, which is so great?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dixit autem Deus ad Salomonem: Quia hoc magis placuit cordi tuo, et non postulasti divitias, et substantiam, et gloriam, neque animas eorum qui te oderant, sed nec dies vitae plurimos: petisti autem sapientiam et scientiam, ut judicare possis populum meum, super quem constitui te regem:"
      en: "And God said to Solomon: Because this choice hath pleased thy heart, and thou hast not asked riches, and wealth, and glory, nor the lives of them that hate thee, nor many days of life: but hast asked wisdom and knowledge, to be able to judge my people, over which I have made thee king,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sapientia et scientia data sunt tibi: divitias autem et substantiam et gloriam dabo tibi, ita ut nullus in regibus nec ante te nec post te fuerit similis tui."
      en: "Wisdom and knowledge are granted to thee: and I will give thee riches, and wealth, and glory, so that none of the kings before thee, nor after thee, shall be like thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Venit ergo Salomon ab excelso Gabaon in Jerusalem coram tabernaculo foederis, et regnavit super Israel."
      en: "Then Solomon came from the high place of Gabaon to Jerusalem before the tabernacle of the covenant, and reigned over Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Congregavitque sibi currus et equites, et facti sunt ei mille quadringenti currus, et duodecim millia equitum: et fecit eos esse in urbibus quadrigarum, et cum rege in Jerusalem."
      en: "And he gathered to himself chariots and horsemen, and he had a thousand four hundred chariots, and twelve thousand horsemen: and he placed them in the cities of the chariots, and with the king in Jerusalem."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Praebuitque rex argentum et aurum in Jerusalem quasi lapides, et cedros quasi sycomoros, quae nascuntur in campestribus multitudine magna."
      en: "And the king made silver and gold to be in Jerusalem as stones, and cedar trees as sycamores, which grow in the plains in great multitude."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Adducebantur autem ei equi de Aegypto, et de Coa a negotiatoribus regis, qui ibant, et emebant pretio,"
      en: "And there were horses brought him from Egypt, and from Coa by the king's merchants, who went, and bought at a price,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quadrigam equorum sexcentis argenteis, et equum centum quinquaginta: similiter de universis regnis Hethaeorum, et a regibus Syriae emptio celebrabatur."
      en: "A chariot of four horses for six hundred pieces of silver, and a horse for a hundred and fifty: in like manner market was made in all the kingdoms of the Hethites, and of the kings of Syria."
    status: { la: verified, en: verified }
