# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 1
verses:
  - n: 1
    text:
      la: "Post mortem Josue, consuluerunt filii Israel Dominum, dicentes: Quis ascendet ante nos contra Chananaeum, et erit dux belli?"
      en: "After the death of Josue the children of Israel consulted the Lord, saying: Who shall go up before us against the Chanaanite, and shall be the leader of the war?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dixitque Dominus: Judas ascendet: ecce tradidi terram in manus ejus."
      en: "And the Lord said: Juda shall go up: behold I have delivered the land into his hands."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ait Judas Simeoni fratri suo: Ascende mecum in sortem meam, et pugna contra Chananaeum, ut et ego pergam tecum in sortem tuam. Et abiit cum eo Simeon."
      en: "And Juda said to Simeon his brother: Come up with me into my lot, and fight against the Chanaanite, that I also may go along with thee into thy lot. And Simeon went with him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ascenditque Judas, et tradidit Dominus Chananaeum ac Pherezaeum in manus eorum: et percusserunt in Bezec decem millia virorum."
      en: "And Juda went up, and the Lord delivered the Chanaanite, and the Pherezite into their hands: and they slew of them in Bezec ten thousand men."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Inveneruntque Adonibezec in Bezec, et pugnaverunt contra eum, ac percusserunt Chananaeum et Pherezaeum."
      en: "And they found Adonibezec in Bezec, and fought against him, and they defeated the Chanaanite, and the Pherezite."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Fugit autem Adonibezec: quem persecuti comprehenderunt, caesis summitatibus manuum ejus ac pedum."
      en: "And Adonibezec fled: and they pursued after him and took him, and cut off his fingers and toes."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dixitque Adonibezec: Septuaginta reges amputatis manuum ac pedum summitatibus colligebant sub mensa mea ciborum reliquias: sicut feci, ita reddidit mihi Deus. Adduxeruntque eum in Jerusalem, et ibi mortuus est."
      en: "And Adonibezec said: Seventy kings having their fingers and toes cut off, gathered up the leavings of the meat under my table: as I have done, so hath God requited me. And they brought him to Jerusalem, and he died there."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Oppugnantes ergo filii Juda Jerusalem, ceperunt eam, et percusserunt in ore gladii, tradentes cunctam incendio civitatem."
      en: "And the children of Juda besieging Jerusalem, took it, and put it to the sword, and set the whole city on fire."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et postea descendentes pugnaverunt contra Chananaeum, qui habitabat in montanis, et ad meridiem, et in campestribus."
      en: "And afterwards they went down and fought against the Chanaanite, who dwelt in the mountains, and in the south, and in the plains."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Pergensque Judas contra Chananaeum, qui habitabat in Hebron ( cujus nomen fuit antiquitus Cariath Arbe), percussit Sesai, et Ahiman, et Tholmai:"
      en: "And Juda going forward against the Chanaanite, that dwelt in Hebron (the name whereof was in former times Cariath-Arbe) slew Sesai, and Ahiman, and Tholmai:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "atque inde profectus abiit ad habitatores Dabir, cujus nomen vetus erat Cariath Sepher, id est, civitas litterarum."
      en: "And departing from thence he went to the inhabitants of Dabir, the ancient name of which was Cariath-Sepher, that is, the city of letters."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dixitque Caleb: Qui percusserit Cariath Sepher, et vastaverit eam, dabo ei Axam filiam meam uxorem."
      en: "And Caleb said: He that shall take Cariath-Sepher, and lay it waste, to him will I give my daughter Axa to wife."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cumque cepisset eam Othoniel filius Cenez frater Caleb minor, dedit ei Axam filiam suam conjugem."
      en: "And Othoniel the son of Cenez, the younger brother of Caleb, having taken it, he gave him Axa his daughter to wife."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quam pergentem in itinere monuit vir suus ut peteret a patre suo agrum. Quae cum suspirasset sedens in asino, dixit ei Caleb: Quid habes?"
      en: "And as she was going on her way her husband admonished her to ask a field of her father. And as she sighed sitting on her ass, Caleb said to her: What aileth thee?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "At illa respondit: Da mihi benedictionem, quia terram arentem dedisti mihi: da et irriguam aquis. Dedit ergo ei Caleb irriguum superius, et irriguum inferius."
      en: "But she answered: Give me a blessing, for thou hast given me a dry land: give me also a watery land. So Caleb gave her the upper and the nether watery ground."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Filii autem Cinaei cognati Moysi ascenderunt de civitate palmarum cum filiis Juda, in desertum sortis ejus, quod est ad meridiem Arad, et habitaverunt cum eo."
      en: "And the children of the Cinite, the kinsman of Moses, went up from the city of palms, with the children of Juda into the wilderness of his lot, which is at the south side of Arad, and they dwelt with him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Abiit autem Judas cum Simeone fratre suo, et percusserunt simul Chananaeum qui habitabat in Sephaath, et interfecerunt eum. Vocatumque est nomen urbis, Horma, id est, anathema."
      en: "And Juda went with Simeon his brother, and they together defeated the Chanaanites that dwelt in Sephaath, and slew them. And the name of the city was called Horma, that is, Anathema."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cepitque Judas Gazam cum finibus suis, et Ascalonem, atque Accaron cum terminis suis."
      en: "And Juda took Gaza with its confines, and Ascalon and Accaron with their confines."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Fuitque Dominus cum Juda, et montana possedit: nec potuit delere habitatores vallis, quia falcatis curribus abundabant."
      en: "And the Lord was with Juda, and he possessed the hill country: but was not able to destroy the inhabitants of the valley, because they had many chariots armed with scythes."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dederuntque Caleb Hebron, sicut dixerat Moyses, qui delevit ex ea tres filios Enac."
      en: "And they gave Hebron to Caleb, as Moses had said, who destroyed out of it the three sons of Enac."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Jebusaeum autem habitatorem Jerusalem non deleverunt filii Benjamin: habitavitque Jebusaeus cum filiis Benjamin in Jerusalem, usque in praesentem diem."
      en: "But the sons of Benjamin did not destroy the Jebusites that inhabited Jerusalem: and the Jebusite hath dwelt with the sons of Benjamin in Jerusalem until this present day."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Domus quoque Joseph ascendit in Bethel, fuitque Dominus cum eis."
      en: "The house of Joseph also went up against Bethel, and the Lord was with them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Nam cum obsiderent urbem, quae prius Luza vocabatur,"
      en: "For when they were besieging the city, which before was called Luza,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "viderunt hominem egredientem de civitate, dixeruntque ad eum: Ostende nobis introitum civitatis, et faciemus tecum misericordiam."
      en: "They saw a man coming out of the city, and they said to him: shew us the entrance into the city, and we will shew thee mercy."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Qui cum ostendisset eis, percusserunt urbem in ore gladii: hominem autem illum, et omnem cognationem ejus, dimiserunt."
      en: "And when he had shewn them, they smote the city with the edge of the sword: but that man and all his kindred they let go:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Qui dimissus, abiit in terram Hetthim, et aedificavit ibi civitatem, vocavitque eam Luzam: quae ita appellatur usque in praesentem diem."
      en: "Who being sent away, went into the land of Hethim, and built there a city, and called it Luza: which is so called until this day."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Manasses quoque non delevit Bethsan, et Thanac cum viculis suis, et habitatores Dor, et Jeblaam, et Mageddo cum viculis suis, coepitque Chananaeus habitare cum eis."
      en: "Manasses also did not destroy Bethsan, and Thanac with their villages, nor the inhabitants of Dor, and Jeblaam, and Mageddo with their villages. And the Chanaanite began to dwell with them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Postquam autem confortatus est Israel, fecit eos tributarios, et delere noluit."
      en: "But after Israel was grown strong he made them tributaries, and would not destroy them."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ephraim etiam non interfecit Chananaeum, qui habitabat in Gazer, sed habitavit cum eo."
      en: "Ephraim also did not slay the Chanaanite that dwelt in Gazer, but dwelt with him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Zabulon non delevit habitatores Cetron, et Naalol: sed habitavit Chananaeus in medio ejus, factusque est ei tributarius."
      en: "Zabulon destroyed not the inhabitants of Cetron, and Naalol: but the Chanaanite dwelt among them, and became their tributaries."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Aser quoque non delevit habitatores Accho, et Sidonis, Ahalab, et Achazib, et Helba, et Aphec, et Rohob:"
      en: "Aser also destroyed not the inhabitants of Accho, and of Sidon, of Ahalab, and of Achazib, and of Helba, and of Aphec, and of Rohob:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "habitavitque in medio Chananaei habitatoris illius terrae, nec interfecit eum."
      en: "And he dwelt in the midst of the Chanaanites the inhabitants of that land, and did not slay them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Nephthali quoque non delevit habitatores Bethsames, et Bethanath: et habitavit inter Chananaeum habitatorem terrae, fueruntque ei Bethsamitae et Bethanitae tributarii."
      en: "Nephtali also destroyed not the inhabitants of Bethsames, and of Bethanath: and he dwelt in the midst of the Chanaanites the inhabitants of the land, and the Bethsamites and Bethanites were tributaries to him."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Arctavitque Amorrhaeus filios Dan in monte, nec dedit eis locum ut ad planiora descenderent:"
      en: "And the Amorrhite straitened the children of Dan in the mountain, and gave them not place to go down to the plain:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "habitavitque in monte Hares, quod interpretatur testaceo, in Ajalon et Salebim. Et aggravata est manus domus Joseph, factusque est ei tributarius."
      en: "And he dwelt in the mountain Hares, that is, of potsherds, in Aialon and Salebim. And the hand of the house of Joseph was heavy upon him, and he became tributary to him."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Fuit autem terminus Amorrhaei ab ascensu Scorpionis, petra, et superiora loca."
      en: "And the border of the Amorrhite was from the ascent of the scorpion, the rock, and the higher places."
    status: { la: verified, en: verified }
