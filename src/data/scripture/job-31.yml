# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 31
verses:
  - n: 1
    text:
      la: "Pepigi foedus cum oculis meis, ut ne cogitarem quidem de virgine."
      en: "I made a covenant with my eyes, that I would not so much as think upon a virgin."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quam enim partem haberet in me Deus desuper, et haereditatem Omnipotens de excelsis?"
      en: "For what part should God from above have in me, and what inheritance the Almighty from on high?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Numquid non perditio est iniquo, et alienatio operantibus injustitiam?"
      en: "Is not destruction to the wicked, and aversion to them that work iniquity?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Nonne ipse considerat vias meas, et cunctos gressus meos dinumerat?"
      en: "Doth not he consider my ways, and number all my steps?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Si ambulavi in vanitate, et festinavit in dolo pes meus,"
      en: "If I have walked in vanity, and my foot hath made haste to deceit:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "appendat me in statera justa, et sciat Deus simplicitatem meam."
      en: "Let him weigh me in a just balance, and let God know my simplicity."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Si declinavit gressus meus de via, et si secutum est oculos meos cor meum, et si manibus meis adhaesit macula,"
      en: "If my step hath turned out of the way, and if my heart hath followed my eyes, and if a spot hath cleaved to my hands:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "seram, et alium comedat, et progenies mea eradicetur."
      en: "Then let me sow and let another eat: and let my offspring be rooted out."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si deceptum est cor meum super muliere, et si ad ostium amici mei insidiatus sum,"
      en: "If my heart hath been deceived upon a woman, and if I have laid wait at my friend's door:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "scortum alterius sit uxor mea, et super illam incurventur alii."
      en: "Let my wife be the harlot of another, and let other men lie with her."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Hoc enim nefas est, et iniquitas maxima."
      en: "For this is a heinous crime, and a most grievous iniquity."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ignis est usque ad perditionem devorans, et omnia eradicans genimina."
      en: "It is a fire that devoureth even to destruction, and rooteth up all things that spring."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si contempsi subire judicium cum servo meo et ancilla mea, cum disceptarent adversum me:"
      en: "If I have despised to abide judgment with my manservant, or my maidservant, when they had any controversy against me:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quid enim faciam cum surrexerit ad judicandum Deus? et cum quaesierit, quid respondebo illi?"
      en: "For what shall I do when God shall rise to judge? and when he shall examine, what shall I answer him?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Numquid non in utero fecit me, qui et illum operatus est? et formavit me in vulva unus?"
      en: "Did not he that made me in the womb make him also: and did not one and the same form me in the womb?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Si negavi quod volebant pauperibus, et oculos viduae expectare feci:"
      en: "If I have denied to the poor what they desired, and have made the eyes of the widow wait:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "si comedi buccellam meam solus, et non comedit pupillus ex ea"
      en: "If I have eaten my morsel alone, and the fatherless hath not eaten thereof:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "( quia ab infantia mea crevit mecum miseratio, et de utero matris meae egressa est mecum):"
      en: "(For from my infancy mercy grew up with me: and it came out with me from my mother's womb:)"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "si despexi pereuntem, eo quod non habuerit indumentum, et absque operimento pauperem:"
      en: "If I have despised him that was perishing for want of clothing, and the poor man that had no covering:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "si non benedixerunt mihi latera ejus, et de velleribus ovium mearum calefactus est:"
      en: "If his sides have not blessed me, and if he were not warmed with the fleece of my sheep:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "si levavi super pupillum manum meam, etiam cum viderem me in porta superiorem,"
      en: "If I have lifted up my hand against the fatherless, even when I saw myself superior in the gate:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "humerus meus a junctura sua cadat, et brachium meum cum suis ossibus confringatur."
      en: "Let my shoulder fall from its joint, and let my arm with its bones be broken."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Semper enim quasi tumentes super me fluctus timui Deum, et pondus ejus ferre non potui."
      en: "For I have always feared God as waves swelling over me, and his weight I was not able to bear."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Si putavi aurum robur meum, et obrizo dixi: Fiducia mea:"
      en: "If I have thought gold my strength, and have said to fine gold: My confidence:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "si laetatus sum super multis divitiis meis, et quia plurima reperit manus mea:"
      en: "If I have rejoiced over my great riches, and because my hand had gotten much."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "si vidi solem cum fulgeret, et lunam incedentem clare,"
      en: "If I beheld the sun when it shined, and the moon going in brightness:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et laetatum est in abscondito cor meum, et osculatus sum manum meam ore meo:"
      en: "And my heart in secret hath rejoiced, and I have kissed my hand with my mouth:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quae est iniquitas maxima, et negatio contra Deum altissimum."
      en: "Which is a very great iniquity, and a denial against the most high God."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Si gavisus sum ad ruinam ejus qui me oderat, et exsultavi quod invenisset eum malum:"
      en: "If I have been glad at the downfall of him that hated me, and have rejoiced that evil had found him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "non enim dedi ad peccandum guttur meum, ut expeterem maledicens animam ejus."
      en: "For I have not given my mouth to sin, by wishing a curse to his soul."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Si non dixerunt viri tabernaculi mei: Quis det de carnibus ejus, ut saturemur?"
      en: "If the men of my tabernacle have not said: Who will give us of his flesh that we may be filled?"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Foris non mansit peregrinus: ostium meum viatori patuit."
      en: "The stranger did not stay without, my door was open to the traveller."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Si abscondi quasi homo peccatum meum, et celavi in sinu meo iniquitatem meam:"
      en: "If as a man I have hid my sin, and have concealed my iniquity in my bosom."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "si expavi ad multitudinem nimiam, et despectio propinquorum terruit me: et non magis tacui, nec egressus sum ostium."
      en: "If I have been afraid at a very great multitude, and the contempt of kinsmen hath terrified me: and I have not rather held my peace, and not gone out of the door."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Quis mihi tribuat auditorem, ut desiderium meum audiat Omnipotens, et librum scribat ipse qui judicat,"
      en: "Who would grant me a hearer, that the Almighty may hear my desire; and that he himself that judgeth would write a book,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "ut in humero meo portem illum, et circumdem illum quasi coronam mihi?"
      en: "That I may carry it on my shoulder, and put it about me as a crown?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Per singulos gradus meos pronuntiabo illum, et quasi principi offeram eum."
      en: "At every step of mine I would pronounce it, and offer it as to a prince."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Si adversum me terra mea clamat, et cum ipsa sulci ejus deflent:"
      en: "If my land cry against me, and with it the furrows thereof mourn:"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "si fructus ejus comedi absque pecunia, et animam agricolarum ejus afflixi:"
      en: "If I have eaten the fruits thereof without money, and have afflicted the soul of the tillers thereof:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "pro frumento oriatur mihi tribulus, et pro hordeo spina. Finita sunt verba Job."
      en: "Let thistles grow up to me instead of wheat, and thorns instead of barley."
    status: { la: verified, en: verified }
