# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: act
chapter: 26
verses:
  - n: 1
    text:
      la: "Agrippa vero ad Paulum ait: Permittitur tibi loqui pro temetipso. Tunc Paulus extenta manu coepit rationem reddere."
      en: "Then Agrippa said to Paul: Thou art permitted to speak for thyself. Then Paul stretching forth his hand, began to make his answer."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "De omnibus quibus accusor a Judaeis, rex Agrippa, aestimo me beatum apud te cum sim defensurus me hodie,"
      en: "I think myself happy, O king Agrippa, that I am to answer for myself this day before thee, touching all the things whereof I am accused by the Jews."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "maxime te sciente omnia, et quae apud Judaeos sunt consuetudines, et quaestiones: propter quod obsecro patienter me audias."
      en: "Especially as thou knowest all, both customs and questions that are among the Jews: Wherefore I beseech thee to hear me patiently."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et quidem vitam meam a juventute, quae ab initio fuit in gente mea in Jerosolymis, noverunt omnes Judaei:"
      en: "And my life indeed from my youth, which was from the beginning among my own nation in Jerusalem, all the Jews do know:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "praescientes me ab initio ( si velint testimonium perhibere) quoniam secundum certissimam sectam nostrae religionis vixi pharisaeus."
      en: "Having known me from the beginning (if they will give testimony) that according to the most sure sect of our religion I lived a Pharisee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et nunc in spe, quae ad patres nostros repromissionis facta est a Deo, sto judicio subjectus:"
      en: "And now for the hope of the promise that was made by God to the fathers, do I stand subject to judgment:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in quam duodecim tribus nostrae nocte ac die deservientes, sperant devenire. De qua spe accusor a Judaeis, rex."
      en: "Unto which, our twelve tribes, serving night and day, hope to come. For which hope, O king, I am accused by the Jews."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quid incredibile judicatur apud vos, si Deus mortuos suscitat?"
      en: "Why should it be thought a thing incredible, that God should raise the dead?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ego quidem existimaveram me adversus nomen Jesu Nazareni debere multa contraria agere,"
      en: "And I indeed did formerly think, that I ought to do many things contrary to the name of Jesus of Nazareth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quod et feci Jerosolymis, et multos sanctorum ego in carceribus inclusi, a principibus sacerdotum potestate accepta: et cum occiderentur, detuli sententiam."
      en: "Which also I did at Jerusalem, and many of the saints did I shut up in prison, having received authority of the chief priests: and when they were put to death, I brought the sentence."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et per omnes synagogas frequenter puniens eos, compellebam blasphemare: et amplius insaniens in eos, persequebar usque in exteras civitates."
      en: "And oftentimes punishing them, in every synagogue, I compelled them to blaspheme: and being yet more mad against them, I persecuted them even unto foreign cities."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "In quibus dum irem Damascum cum potestate et permissu principum sacerdotum,"
      en: "Whereupon when I was going to Damascus with authority and permission of the chief priest,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "die media in via, vidi, rex, de caelo supra splendorem solis circumfulsisse me lumen, et eos qui mecum simul erant."
      en: "At midday, O king, I saw in the way a light from heaven above the brightness of the sun, shining round about me, and them that were in company with me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Omnesque nos cum decidissemus in terram, audivi vocem loquentem mihi hebraica lingua: Saule, Saule, quid me persequeris? durum est tibi contra stimulum calcitrare."
      en: "And when we were all fallen down on the ground, I heard a voice speaking to me in the Hebrew tongue: Saul, Saul, why persecutest thou me? It is hard for thee to kick against the goad."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ego autem dixi: Quis es, Domine? Dominus autem dixit: Ego sum Jesus, quem tu persequeris."
      en: "And I said: Who art thou, Lord? And the Lord answered: I am Jesus whom thou persecutest."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sed exsurge, et sta super pedes tuos: ad hoc enim apparui tibi, ut constituam te ministrum, et testem eorum, quae vidisti, et eorum quibus apparebo tibi,"
      en: "But rise up, and stand upon thy feet: for to this end have I appeared to thee, that I may make thee a minister, and a witness of those things which thou hast seen, and of those things wherein I will appear to thee,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "eripiens te de populo, et gentibus, in quas nunc ego mitto te,"
      en: "Delivering thee from the people, and from the nations, unto which now I send thee:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "aperire oculos eorum, ut convertantur a tenebris ad lucem, et de potestate Satanae ad Deum, ut accipiant remissionem peccatorum, et sortem inter sanctos per fidem, quae est in me."
      en: "To open their eyes, that they may be converted from darkness to light, and from the power of Satan to God, that they may receive forgiveness of sins, and a lot among the saints, by the faith that is in me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Unde rex Agrippa, non fui incredulus caelesti visioni;"
      en: "Whereupon, O king Agrippa, I was not incredulous to the heavenly vision:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sed his qui sunt Damasci primum, et Jerosolymis, et in omnem regionem Judaeae, et gentibus annuntiabam, ut poenitentiam agerent, et converterentur ad Deum, digna poenitentiae opera facientes."
      en: "But to them first that are at Damascus, and at Jerusalem, and unto all the country of Judea, and to the Gentiles did I preach, that they should do penance, and turn to God, doing works worthy of penance."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Hac ex causa me Judaei, cum essem in templo, comprehensum tentabant interficere."
      en: "For this cause the Jews, when I was in the temple, having apprehended me, went about to kill me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Auxilio autem adjutus Dei usque in hodiernum diem sto, testificans minori, atque majori, nihil extra dicens quam ea quae prophetae locuti sunt futura esse, et Moyses,"
      en: "But being aided by the help of God, I stand unto this day, witnessing both to small and great, saying no other thing than those which the prophets, and Moses did say should come to pass:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "si passibilis Christus, si primus ex resurrectione mortuorum, lumen annuntiaturus est populo et gentibus."
      en: "That Christ should suffer, and that he should be the first that should rise from the dead, and should shew light to the people, and to the Gentiles."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Haec loquente eo, et rationem reddente, Festus magna voce dixit: Insanis Paule: multae te litterae ad insaniam convertunt."
      en: "As he spoke these things, and made his answer, Festus said with a loud voice: Paul, thou art beside thyself: much learning doth make thee mad."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et Paulus: Non insanio, inquit, optime Feste, sed veritatis et sobrietatis verba loquor."
      en: "And Paul said: I am not mad, most excellent Festus, but I speak words of truth and soberness."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Scit enim de his rex, ad quem et constanter loquor: latere enim eum nihil horum arbitror. Neque enim in angulo quidquam horum gestum est."
      en: "For the king knoweth of these things, to whom also I speak with confidence. For I am persuaded that none of these things are hidden from him. For neither was any of these things done in a corner."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Credis rex Agrippa prophetis? Scio quia credis."
      en: "Believest thou the prophets, O king Agrippa? I know that thou believest."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Agrippa autem ad Paulum: In modico suades me christianum fieri."
      en: "And Agrippa said to Paul: In a little thou persuadest me to become a Christian."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et Paulus: Opto apud Deum, et in modico, et in magno, non tantum te, sed etiam omnes qui audiunt, hodie fieri tales, qualis et ego sum, exceptis vinculis his."
      en: "And Paul said: I would to God, that both in a little and in much, not only thou, but also all that hear me, this day, should become such as I also am, except these bands."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et exsurrexit rex, et praeses, et Bernice, et qui assidebant eis."
      en: "And the king rose up, and the governor, and Bernice, and they that sat with them."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et cum secessissent, loquebantur ad invicem, dicentes: Quia nihil morte, aut vinculis dignum quid fecit homo iste."
      en: "And when they were gone aside, they spoke among themselves, saying: This man hath done nothing worthy of death or of bands."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Agrippa autem Festo dixit: Dimitti poterat homo hic, si non appellasset Caesarem."
      en: "And Agrippa said to Festus: This man might have been set at liberty, if he had not appealed to Caesar."
    status: { la: verified, en: verified }
