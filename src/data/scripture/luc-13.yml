# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 13
verses:
  - n: 1
    text:
      la: "aderant autem quidam ipso in tempore nuntiantes illi de Galilaeis quorum sanguinem Pilatus miscuit cum sacrificiis eorum"
      en: "And there were present, at that very time, some that told him of the Galileans, whose blood Pilate had mingled with their sacrifices."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et respondens dixit illis putatis quod hii Galilaei prae omnibus Galilaeis peccatores fuerunt quia talia passi sunt"
      en: "And he answering, said to them: Think you that these Galileans were sinners above all the men of Galilee, because they suffered such things?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "non dico vobis sed nisi paenitentiam habueritis omnes similiter peribitis"
      en: "No, I say to you: but unless you shall do penance, you shall all likewise perish."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sicut illi decem et octo supra quos cecidit turris in Siloam et occidit eos putatis quia et ipsi debitores fuerunt praeter omnes homines habitantes in Hierusalem"
      en: "Or those eighteen upon whom the tower fell in Siloe, and slew them: think you, that they also were debtors above all the men that dwelt in Jerusalem?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non dico vobis sed si non paenitentiam egeritis omnes similiter peribitis"
      en: "No, I say to you; but except you do penance, you shall all likewise perish."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dicebat autem hanc similitudinem arborem fici habebat quidam plantatam in vinea sua et venit quaerens fructum in illa et non invenit"
      en: "He spoke also this parable: A certain man had a fig tree planted in his vineyard, and he came seeking fruit on it, and found none."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dixit autem ad cultorem vineae ecce anni tres sunt ex quo venio quaerens fructum in ficulnea hac et non invenio succide ergo illam ut quid etiam terram occupat"
      en: "And he said to the dresser of the vineyard: Behold, for these three years I come seeking fruit on this fig tree, and I find none. Cut it done therefore: why cumbereth it the ground?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "at ille respondens dixit illi domine dimitte illam et hoc anno usque dum fodiam circa illam et mittam stercora"
      en: "But he answering, said to him: Lord, let it alone this year also, until I dig about it, and dung it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et si quidem fecerit fructum sin autem in futurum succides eam"
      en: "And if happily it bear fruit: but if not, then after that thou shalt cut it down."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "erat autem docens in synagoga eorum sabbatis"
      en: "And he was teaching in their synagogue on their sabbath."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ecce mulier quae habebat spiritum infirmitatis annis decem et octo et erat inclinata nec omnino poterat sursum respicere"
      en: "And behold there was a woman, who had a spirit of infirmity eighteen years: and she was bowed together, neither could she look upwards at all."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quam cum videret Iesus vocavit ad se et ait illi mulier dimissa es ab infirmitate tua"
      en: "Whom when Jesus saw, he called her unto him, and said to her: Woman, thou art delivered from thy infirmity."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et inposuit illi manus et confestim erecta est et glorificabat Deum"
      en: "And he laid his hands upon her, and immediately she was made straight, and glorified God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "respondens autem archisynagogus indignans quia sabbato curasset Iesus dicebat turbae sex dies sunt in quibus oportet operari in his ergo venite et curamini et non in die sabbati"
      en: "And the ruler of the synagogue (being angry that Jesus had healed on the sabbath) answering, said to the multitude: Six days there are wherein you ought to work. In them therefore come, and be healed; and not on the sabbath day."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "respondit autem ad illum Dominus et dixit hypocritae unusquisque vestrum sabbato non solvit bovem suum aut asinum a praesepio et ducit adaquare"
      en: "And the Lord answering him, said: Ye hypocrites, doth not every one of you, on the sabbath day, loose his ox or his ass from the manger, and lead them to water?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "hanc autem filiam Abrahae quam alligavit Satanas ecce decem et octo annis non oportuit solvi a vinculo isto die sabbati"
      en: "And ought not this daughter of Abraham, whom Satan hath bound, lo, these eighteen years, be loosed from this bond on the sabbath day?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et cum haec diceret erubescebant omnes adversarii eius et omnis populus gaudebat in universis quae gloriose fiebant ab eo"
      en: "And when he said these things, all his adversaries were ashamed: and all the people rejoiced for all the things that were gloriously done by him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "dicebat ergo cui simile est regnum Dei et cui simile esse existimabo illud"
      en: "He said therefore: To what is the kingdom of God like, and whereunto shall I resemble it?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "simile est grano sinapis quod acceptum homo misit in hortum suum et crevit et factum est in arborem magnam et volucres caeli requieverunt in ramis eius"
      en: "It is like to a grain of mustard seed, which a man took and cast into his garden, and it grew and became a great tree, and the birds of the air lodged in the branches thereof."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et iterum dixit cui simile aestimabo regnum Dei"
      en: "And again he said: Whereunto shall I esteem the kingdom of God to be like?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "simile est fermento quod acceptum mulier abscondit in farinae sata tria donec fermentaretur totum"
      en: "It is like to leaven, which a woman took and hid in three measures of meal, till the whole was leavened."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ibat per civitates et castella docens et iter faciens in Hierusalem"
      en: "And he went through the cities and towns teaching, and making his journey to Jerusalem."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "ait autem illi quidam Domine si pauci sunt qui salvantur ipse autem dixit ad illos"
      en: "And a certain man said to him: Lord, are they few that are saved? But he said to them:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "contendite intrare per angustam portam quia multi dico vobis quaerunt intrare et non poterunt"
      en: "Strive to enter by the narrow gate; for many, I say to you, shall seek to enter, and shall not be able."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cum autem intraverit pater familias et cluserit ostium et incipietis foris stare et pulsare ostium dicentes Domine aperi nobis et respondens dicet vobis nescio vos unde sitis"
      en: "But when the master of the house shall be gone in, and shall shut the door, you shall begin to stand without, and knock at the door, saying: Lord, open to us. And he answering, shall say to you: I know you not, whence you are."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "tunc incipietis dicere manducavimus coram te et bibimus et in plateis nostris docuisti"
      en: "Then you shall begin to say: We have eaten and drunk in thy presence, and thou hast taught in our streets."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et dicet vobis nescio vos unde sitis discedite a me omnes operarii iniquitatis"
      en: "And he shall say to you: I know you not, whence you are: depart from me, all ye workers of iniquity."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ibi erit fletus et stridor dentium cum videritis Abraham et Isaac et Iacob et omnes prophetas in regno Dei vos autem expelli foras"
      en: "There shall be weeping and gnashing of teeth, when you shall see Abraham and Isaac and Jacob, and all the prophets, in the kingdom of God, and you yourselves thrust out."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et venient ab oriente et occidente et aquilone et austro et accumbent in regno Dei"
      en: "And there shall come from the east and the west, and the north and the south; and shall sit down in the kingdom of God."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et ecce sunt novissimi qui erunt primi et sunt primi qui erunt novissimi"
      en: "And behold, they are last that shall be first; and they are first that shall be last."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "in ipsa die accesserunt quidam Pharisaeorum dicentes illi exi et vade hinc quia Herodes vult te occidere"
      en: "The same day, there came some of the Pharisees, saying to him: Depart, and get thee hence, for Herod hath a mind to kill thee."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et ait illis ite dicite vulpi illi ecce eicio daemonia et sanitates perficio hodie et cras et tertia consummor"
      en: "And he said to them: Go and tell that fox, Behold, I cast out devils, and do cures to day and to morrow, and the third day I am consummated."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "verumtamen oportet me hodie et cras et sequenti ambulare quia non capit prophetam perire extra Hierusalem"
      en: "Nevertheless I must walk to day and to morrow, and the day following, because it cannot be that a prophet perish, out of Jerusalem."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Hierusalem Hierusalem quae occidis prophetas et lapidas eos qui mittuntur ad te quotiens volui congregare filios tuos quemadmodum avis nidum suum sub pinnis et noluisti"
      en: "Jerusalem, Jerusalem, that killest the prophets, and stonest them that are sent to thee, how often would I have gathered thy children as the bird doth her brood under her wings, and thou wouldest not?"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "ecce relinquitur vobis domus vestra dico autem vobis quia non videbitis me donec veniat cum dicetis benedictus qui venit in nomine Domini"
      en: "Behold your house shall be left to you desolate. And I say to you, that you shall not see me till the time come, when you shall say: Blessed is he that cometh in the name of the Lord."
    status: { la: verified, en: verified }
