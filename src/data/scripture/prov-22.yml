# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 22
verses:
  - n: 1
    text:
      la: "Melius est nomen bonum quam divitiae multae; super argentum et aurum gratia bona."
      en: "A good name is better than great riches: and good favour is above silver and gold."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Dives et pauper obviaverunt sibi: utriusque operator est Dominus."
      en: "The rich and poor have met one another: the Lord is the maker of them both."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Callidus vidit malum, et abscondit se; innocens pertransiit, et afflictus est damno."
      en: "The prudent man saw the evil, and hid himself: the simple passed on, and suffered loss."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Finis modestiae timor Domini, divitiae, et gloria, et vita."
      en: "The fruit of humility is the fear of the Lord, riches and glory and life."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Arma et gladii in via perversi; custos autem animae suae longe recedit ab eis."
      en: "Arms and swords are in the way of the perverse: but he that keepeth his own soul departeth far from them."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Proverbium est: adolescens juxta viam suam; etiam cum senuerit, non recedet ab ea."
      en: "It is a proverb: A young man according to his way, even when he is old he will not depart from it."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dives pauperibus imperat, et qui accipit mutuum servus est foenerantis."
      en: "The rich ruleth over the poor: and the borrower is servant to him that lendeth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Qui seminat iniquitatem metet mala, et virga irae suae consummabitur."
      en: "He that soweth iniquity shall reap evils, and with the rod of his anger he shall be consumed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui pronus est ad misericordiam benedicetur, de panibus enim suis dedit pauperi. Victoriam et honorem acquiret qui dat munera; animam autem aufert accipientium."
      en: "He that is inclined to mercy shall be blessed: for of his bread he hath given to the poor. He that maketh presents shall purchase victory and honour: but he carrieth away the souls of the receivers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ejice derisorem, et exibit cum eo jurgium, cessabuntque causae et contumeliae."
      en: "Cast out the scoffer, and contention shall go out with him, and quarrels and reproaches shall cease."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui diligit cordis munditiam, propter gratiam labiorum suorum habebit amicum regem."
      en: "He that loveth cleanness of heart, for the grace of his lips shall have the king for his friend."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Oculi Domini custodiunt scientiam, et supplantantur verba iniqui."
      en: "The eyes of the Lord preserve knowledge: and the words of the unjust are overthrown."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dicit piger: Leo et foris, in medio platearum occidendus sum."
      en: "The slothful man saith: There is a lion without, I shall be slain in the midst of the streets."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Fovea profunda os alienae; cui iratus est Dominus, incidet in eam."
      en: "The mouth of a strange woman is a deep pit: he whom the Lord is angry with, shall fall into it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Stultitia colligata est in corde pueri, et virga disciplinae fugabit eam."
      en: "Folly is bound up in the heart of a child, and the rod of correction shall drive it away."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Qui calumniatur pauperem ut augeat divitias suas, dabit ipse ditiori, et egebit."
      en: "He that oppresseth the poor, to increase his own riches, shall himself give to one that is richer, and shall be in need."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Inclina aurem tuam, et audi verba sapientium, appone autem cor ad doctrinam meam:"
      en: "Incline thy ear, and hear the words of the wise: and apply thy heart to my doctrine:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quae pulchra erit tibi cum servaveris eam in ventre tuo, et redundabit in labiis tuis;"
      en: "Which shall be beautiful for thee, if thou keep it in thy bowels, and it shall flow in thy lips:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ut sit in Domino fiducia tua: unde et ostendi eam tibi hodie."
      en: "That thy trust may be in the Lord, wherefore I have also shewn it to thee this day."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ecce descripsi eam tibi tripliciter, in cogitationibus et scientia;"
      en: "Behold I have described it to thee three manner of ways, in thoughts and knowledge:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ut ostenderem tibi firmitatem et eloquia veritatis, respondere ex his illis qui miserunt te."
      en: "That I might shew thee the certainty, and the words of truth, to answer out of these to them that sent thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non facias violentiam pauperi quia pauper est, neque conteras egenum in porta;"
      en: "Do no violence to the poor, because he is poor: and do not oppress the needy in the gate:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quia judicabit Dominus causam ejus, et configet eos qui confixerunt animam ejus."
      en: "Because the Lord will judge his cause, and will afflict them that have afflicted his soul."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Noli esse amicus homini iracundo, neque ambules cum viro furioso;"
      en: "Be not a friend to an angry man, and do not walk with a furious man:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ne forte discas semitas ejus, et sumas scandalum animae tuae."
      en: "Lest perhaps thou learn his ways, and take scandal to thy soul."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Noli esse cum his qui defigunt manus suas, et qui vades se offerunt pro debitis;"
      en: "Be not with them that fasten down their hands, and that offer themselves sureties for debts:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "si enim non habes unde restituas, quid causae est ut tollat operimentum de cubili tuo?"
      en: "For if thou have not wherewith to restore, what cause is there, that he should take the covering from thy bed?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ne transgrediaris terminos antiquos, quos posuerunt patres tui."
      en: "Pass not beyond the ancient bounds which thy fathers have set."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Vidisti virum velocem in opere suo? coram regibus stabit, nec erit ante ignobiles."
      en: "Hast thou seen a man swift in his work? he shall stand before kings, and shall not be before those that are obscure."
    status: { la: verified, en: verified }
