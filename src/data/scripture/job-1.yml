# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 1
verses:
  - n: 1
    text:
      la: "Vir erat in terra Hus, nomine Job; et erat vir ille simplex, et rectus, ac timens Deum, et recedens a malo."
      en: "There was a man in the land of Hus, whose name was Job, and that man was simple and upright, and fearing God, and avoiding evil."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Natique sunt ei septem filii, et tres filiae."
      en: "And there were born to him seven sons and three daughters."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et fuit possessio ejus septem millia ovium, et tria millia camelorum, quingenta quoque juga boum, et quingentae asinae, ac familia multa nimis: eratque vir ille magnus inter omnes orientales."
      en: "And his possession was seven thousand sheep, and three thousand camels, and five hundred yoke of oxen, and five hundred she asses, and a family exceeding great: and this man was great among all the people of the east."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et ibant filii ejus, et faciebant convivium per domos, unusquisque in die suo. Et mittentes vocabant tres sorores suas, ut comederent et biberent cum eis."
      en: "And his sons went, and made a feast by houses every one in his day. And sending they called their three sisters to eat and drink with them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cumque in orbem transissent dies convivii, mittebat ad eos Job, et sanctificabat illos; consurgensque diluculo, offerebat holocausta pro singulis. Dicebat enim: Ne forte peccaverint filii mei, et benedixerint Deo in cordibus suis. Sic faciebat Job cunctis diebus."
      en: "And when the days of their feasting were gone about, Job sent to them, and sanctified them: and rising up early offered holocausts for every one of them. For he said: Lest perhaps my sons have sinned, and have blessed God in their hearts. So did Job all days."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quadam autem die, cum venissent filii Dei ut assisterent coram Domino, affuit inter eos etiam Satan."
      en: "Now on a certain day when the sons of God came to stand before the Lord, Satan also was present among them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cui dixit Dominus: Unde venis? Qui respondens, ait: Circuivi terram, et perambulavi eam."
      en: "And the Lord said to him: Whence comest thou? And he answered and said: I have gone round about the earth, and walked through it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Dixitque Dominus ad eum: Numquid considerasti servum meum Job, quod non sit ei similis in terra, homo simplex et rectus, ac timens Deum, et recedens a malo?"
      en: "And the Lord said to him: Hast thou considered my servant Job, that there is none like him in the earth, a simple and upright man, and fearing God, and avoiding evil?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cui respondens Satan, ait: Numquid Job frustra timet Deum?"
      en: "And Satan answering, said: Doth Job fear God in vain?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nonne tu vallasti eum, ac domum ejus, universamque substantiam per circuitum, operibus manuum ejus benedixisti, et possessio ejus crevit in terra?"
      en: "Hast not thou made a fence for him, and his house, and all his substance round about, blessed the works of his hands, and his possession hath increased on the earth?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sed extende paululum manum tuam et tange cuncta quae possidet, nisi in faciem benedixerit tibi."
      en: "But stretch forth thy hand a little, and touch all that he hath, and see if he blesseth thee not to thy face."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dixit ergo Dominus ad Satan: Ecce universa quae habet in manu tua sunt; tantum in eum ne extendas manum tuam. Egressusque est Satan a facie Domini."
      en: "Then the Lord said to Satan: Behold, all that he hath is in thy hand: only put not forth thy hand upon his person. And Satan went forth from the presence of the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cum autem quadam die filii et filiae ejus comederent et biberent vinum in domo fratris sui primogeniti,"
      en: "Now upon a certain day when his sons and daughters were eating and drinking wine in the house of their eldest brother,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nuntius venit ad Job, qui diceret: Boves arabant, et asinae pascebantur juxta eos;"
      en: "There came a messenger to Job, and said: The oxen were ploughing, and the asses feeding beside them,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et irruerunt Sabaei, tuleruntque omnia, et pueros percusserunt gladio; et evasi ego solus, ut nuntiarem tibi."
      en: "And the Sabeans rushed in, and took all away, and slew the servants with the sword, and I alone have escaped to tell thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cumque adhuc ille loqueretur, venit alter, et dixit: Ignis Dei cecidit e caelo, et tactas oves puerosque consumpsit; et effugi ego solus, ut nuntiarem tibi."
      en: "And while he was yet speaking, another came, and said: The fire of God fell from heaven, and striking the sheep and the servants, hath consumed them, and I alone have escaped to tell thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sed et illo adhuc loquente, venit alius, et dixit: Chaldaei fecerunt tres turmas, et invaserunt camelos, et tulerunt eos, necnon et pueros percusserunt gladio: et ego fugi solus, ut nuntiarem tibi."
      en: "And while he also was yet speaking, there came another, and said: The Chaldeans made three troops, and have fallen upon the camels, and taken them, moreover they have slain the servants with the sword, and I alone have escaped to tell thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Adhuc loquebatur ille, et ecce alius intravit, et dixit: Filiis tuis et filiabus vescentibus et bibentibus vinum in domo fratris sui primogeniti,"
      en: "He was yet speaking, and behold another came in, and said: Thy sons and daughters were eating and drinking wine in the house of their elder brother:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "repente ventus vehemens irruit a regione deserti, et concussit quatuor angulos domus, quae corruens oppressit liberos tuos, et mortui sunt; et effugi ego solus, ut nuntiarem tibi."
      en: "A violent wind came on a sudden from the side of the desert, and shook the four corners of the house, and it fell upon thy children and they are dead, and I alone have escaped to tell thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Tunc surrexit Job, et scidit vestimenta sua; et tonso capite, corruens in terram, adoravit,"
      en: "Then Job rose up, and rent his garments, and having shaven his head fell down upon the ground and worshipped,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et dixit: Nudus egressus sum de utero matris meae, et nudus revertar illuc. Dominus dedit, Dominus abstulit; sicut Domino placuit, ita factum est. Sit nomen Domini benedictum."
      en: "And said: Naked came I out of my mother's womb, and naked shall I return thither: the Lord gave, and the Lord hath taken away: as it hath pleased the Lord so is it done: blessed be the name of the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "In omnibus his non peccavit Job labiis suis, neque stultum quid contra Deum locutus est."
      en: "In all these things Job sinned not by his lips, nor spoke he any foolish thing against God."
    status: { la: verified, en: verified }
