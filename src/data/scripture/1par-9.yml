# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 9
verses:
  - n: 1
    text:
      la: "universus ergo Israhel dinumeratus est et summa eorum scripta est in libro regum Israhel et Iuda translatique sunt in Babylonem propter delictum suum"
      en: "And all Israel was numbered: and the sum of them was written in the book of the kings of Israel, and Juda: and they were carried away to Babylon for their transgression."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui autem habitaverunt primi in possessionibus et in urbibus suis Israhel et sacerdotes Levitae et Nathinnei"
      en: "Now the first that dwelt in their possessions, and in their cities, were the Israelites, and the priests, and the Levites, and the Nathineans."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "commorati sunt in Hierusalem de filiis Iuda et de filiis Beniamin de filiis quoque Ephraim et Manasse"
      en: "And in Jerusalem dwelt of the children of Juda, and of the children of Benjamin, and of the children of Ephraim, and of Manasses."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Othei filius Amiud filius Emri filii Omrai filii Bonni de filiis Phares filii Iuda"
      en: "Othei the son of Ammiud, the son of Amri, the son of Omrai, the son of Bonni, of the sons of Phares the son of Juda."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et de Siloni Asaia primogenitus et filii eius"
      en: "And of Siloni: Asaia the firstborn, and his sons."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "de filiis autem Zara Ieuhel et fratres eorum sescenti nonaginta"
      en: "And of the sons of Zara: Jehuel, and their brethren, six hundred and ninety."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "porro de filiis Beniamin Salo filius Mosollam filii Oduia filii Asana"
      en: "And of the sons of Benjamin: Sale the son of Mosollam, the son of Oduia, the son of Asana:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et Iobania filius Hieroam et Hela filius Ozi filii Mochori et Mosollam filius Saphatiae filii Rahuhel filii Iebaniae"
      en: "And Jobania the son of Jeroham: and Ela the son of Ozi, the son of Mochori: and Mosallam the son of Saphatias, the son of Rahuel, the son of Jebania:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et fratres eorum per familias suas nongenti quinquaginta sex omnes hii principes cognationum per domos patrum suorum"
      en: "And their brethren by their families, nine hundred and fifty-six. All these were heads of their families, by the houses of their fathers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "de sacerdotibus autem Iedaia Ioiarib et Iachin"
      en: "And of the priests: Jedaia, Joiarib, and Jachin:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Azarias quoque filius Helciae filii Mosollam filii Sadoc filii Maraioth filii Ahitob pontifex domus Dei"
      en: "And Azarias the son of Helcias, the son of Mosollam, the son of Sadoc, the son of Maraioth, the son of Achitob, high priest of the house of God."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "porro Adaias filius Hieroam filii Phasor filii Melchia et Masaia filius Adihel filii Iezra filii Mosollam filii Mosollamoth filii Emmer"
      en: "And Adaias the son of Jeroham, the son of Phassur, the son of Melchias, and Maasai the son of Adiel, the son of Jezra, the son of Mosollam, the son of Mosollamith, the son of Emmer."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "fratres quoque eorum principes per familias suas mille septingenti sexaginta fortissimi robore ad faciendum opus ministerii in domo Dei"
      en: "And their brethren heads in their families re thousand seven hundred and threescore, very strong and able men for the work of the ministry in the house of God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "de Levitis autem Semeia filius Assub filii Ezricam filii Asebiu de filiis Merari"
      en: "And of the Levites: Semeia the son of Hassub the son of Ezricam, the son of Hasebia of the sons of Merari."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Bacbacar quoque carpentarius et Galal et Mathania filius Micha filii Zechri filii Asaph"
      en: "And Bacbacar the carpenter, and Galal, and Mathania the son of Micha, the son of Zechri the son of Asaph:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Obdia filius Semeiae filii Galal filii Idithun et Barachia filius Asa filii Helcana qui habitavit in atriis Netophathi"
      en: "And Obdia the son of Semeia, the son of Galal, the son of Idithum: and Barachia the son of Asa, the son of Elcana, who dwelt in the suburbs of Netophati."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ianitores autem Sellum et Acub et Telmon et Ahiman et frater eorum Sellum princeps"
      en: "And the porters were Sellum, and Accub, and Telmon, and Ahiman: and their brother Sellum was the prince,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "usque ad illud tempus in porta Regis ad orientem observabant per vices suas de filiis Levi"
      en: "Until that time, in the king's gate eastward, the sons of Levi waited by their turns."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sellum vero filius Core filii Abiasaph filii Core cum fratribus suis et domo patris sui hii sunt Coritae super opera ministerii custodes vestibulorum tabernaculi et familiae eorum per vices castrorum Domini custodientes introitum"
      en: "But Sellum the son of Core, the son of Abiasaph, the son of Core, with his brethren and his father's house, the Corites were over the works of the service, keepers of the gates of the tabernacle: and their families in turns were keepers of the entrance of the camp of the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Finees autem filius Eleazar erat dux eorum coram Domino"
      en: "And Phinees the son of Eleazar, was their prince before the Lord,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "porro Zaccharias filius Mosollamia ianitor portae tabernaculi testimonii"
      en: "And Zacharias the son of Mosollamia, was porter of the gate of the tabernacle of the testimony:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "omnes hii electi in ostiarios per portas ducenti duodecim et descripti in villis propriis quos constituerunt David et Samuhel videns in fide sua"
      en: "All these that were chosen to be porters at the gates, were two hundred and twelve: and they mere registered in their proper towns: whom David and Samuel the seer appointed in their trust."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "tam ipsos quam filios eorum in ostiis domus Domini et in tabernaculo vicibus suis"
      en: "As well them as their sons, to keep the gates of the house of the Lord, and the tabernacle by their turns."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "per quattuor ventos erant ostiarii id est ad orientem et ad occidentem ad aquilonem et ad austrum"
      en: "In four quarters were the porters: that is to say, toward the east, and west, and north, and south."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "fratres autem eorum in viculis morabantur et veniebant in sabbatis suis de tempore usque ad tempus"
      en: "And their brethren dwelt in villages, and came upon their sabbath days from time to time."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "his quattuor Levitis creditus erat omnis numerus ianitorum et erant super exedras et thesauros domus Domini"
      en: "To these four Levites were committed the whole number of the porters, and they were over the chambers, and treasures, of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "per gyrum quoque templi Domini morabantur in custodiis suis ut cum tempus fuisset ipsi mane aperirent fores"
      en: "And they abode in their watches round about the temple of the Lord: that when it was time, they might open the gates in the morning."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "de horum grege erant et super vasa ministerii ad numerum enim et inferebantur vasa et efferebantur"
      en: "And some of their stock had the charge of the vessels for the ministry: for the vessels were both brought in and carried out by number."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "de ipsis et qui credita habebant utensilia sanctuarii praeerant similae et vino et oleo et turi et aromatibus"
      en: "Some of them also had the instruments of the sanctuary committed unto them, and the charge of the fine flour, and wine, and oil, and frankincense, and spices."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "filii autem sacerdotum unguenta ex aromatibus conficiebant"
      en: "And the sons of the priests made the ointments of the spices."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et Matthathias Levites primogenitus Sellum Coritae praefectus erat eorum quae in sartagine frigebantur"
      en: "And Mathathias a Levite, the firstborn of Sellum the Corite, was overseer of such things as were fried in the fryingpan."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "porro de filiis Caath fratribus eorum super panes erant propositionis ut semper novos per singula sabbata praepararent"
      en: "And some of the sons of Caath their brethren, were over the leaves of proposition, to prepare always new for every sabbath."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "hii sunt principes cantorum per familias Levitarum qui in exedris morabantur ita ut die et nocte iugiter suo ministerio deservirent"
      en: "These are the chief of the singing men of the families of the Levites, who dwelt in the chambers, by the temple, that they might serve continually day and night in their ministry."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "capita Levitarum per familias suas principes manserunt in Hierusalem"
      en: "The heads of the Levites, princes in their families, abode in Jerusalem."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "in Gabaon autem commorati sunt pater Gabaon Iaihel et nomen uxoris eius Maacha"
      en: "And in Gabaon dwelt Jehiel the father of Gabaon, and the name of hill wife was Maacha:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "filius primogenitus eius Abdon et Sur et Cis et Baal et Ner et Nadab"
      en: "His firstborn son Abdon, and Sur, and Cis, and Baal, and Ner, and Nadab,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Gedor quoque et Ahio et Zaccharias et Macelloth"
      en: "Gedor also, and Ahio, and Zacharias, and Macelloth."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "porro Macelloth genuit Semmaam isti habitaverunt e regione fratrum suorum in Hierusalem cum fratribus suis"
      en: "And Macelloth beget Samaan: these dwelt over against their brethren in Jerusalem, with their brethren."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Ner autem genuit Cis et Cis genuit Saul et Saul genuit Ionathan et Melchisuae et Abinadab et Esbaal"
      en: "Now Ner beget Cia: and Cis begot Saul: and Saul beget Jonathan and Melchisua, and Abinadab, and Esbaal."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "filius autem Ionathan Meribbaal et Meribbaal genuit Micha"
      en: "And the son of Jonathan, was Meribbaal: and Meribbaal beget Micha."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "porro filii Micha Phiton et Malech et Thara"
      en: "And the sons of Micha, were Phithon, and Melech, and Tharaa, and Ahaz."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Ahaz autem genuit Iara et Iara genuit Alamath et Azmoth et Zamri et Zamri genuit Mosa"
      en: "And Ahaz beget Jara, and Jara beget Alamath, and Azmoth, and Zamri. And Zamri beget Mesa."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Mosa vero genuit Baana cuius filius Raphaia genuit Elasa de quo ortus est Esel"
      en: "And Mesa beget Banaa: whose son Raphaia beget Elasa: of whom was born Asel."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "porro Esel sex filios habuit his nominibus Ezricam Bochru Ismahel Saria Obdia Anan hii filii Esel"
      en: "And heel had six sons whose names are, Ezricam, Bochru, Ismahel, Saria, Obdia, Hanan: these are the sons of Asel."
    status: { la: verified, en: verified }
