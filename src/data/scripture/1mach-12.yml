# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1mach
chapter: 12
verses:
  - n: 1
    text:
      la: "et vidit Ionathas quia tempus eum iuvat et elegit viros et misit Romam statuere et renovare cum eis amicitiam"
      en: "And Jonathan saw that the time served him, and he chose certain men and sent them to Rome, to confirm and to renew the amity with them:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ad Spartas et ad alia loca misit epistulas secundum eandem formam"
      en: "And he sent letters to the Spartans, and to other places according to the same form."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et abierunt Romam et intraverunt in curiam et dixerunt Ionathas summus sacerdos et gens Iudaeorum miserunt nos ut renovetis amicitiam et societatem secundum pristinam"
      en: "And they went to Rome, and entered into the senate house, and said: Jonathan the high priest, and the nation of the Jews have sent us to renew the amity, and alliance as it was before."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et dederunt illis epistulas ad ipsos per loca ut deducerent eos in terram Iuda cum pace"
      en: "And they gave them letters to their governors in every place, to conduct them into the land of Juda with peace."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et hoc exemplum epistularum quas scripsit Ionathas Spartiatis"
      en: "And this is a copy of the letters which Jonathan wrote to the Spartans:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ionathas summus sacerdos et seniores gentis et sacerdotes et reliquus populus Iudaeorum Spartiatis fratribus salutem"
      en: "Jonathan the high priest, and the ancients of the nation, and the priests, and the rest of the people of the Jews, to the Spartans, their brethren, greeting."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "iam pridem missae erant epistulae ad Onian summum sacerdotem a Dario qui regnabat apud vos quoniam estis fratres nostri sicut rescriptum continet quod subiectum est"
      en: "There were letters sent long ago to Onias the high priest from Arius who reigned then among you, to signify that you are our brethren, as the copy here underwritten doth specify."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et suscepit Onias virum qui fuerat missus cum honore et accepit epistulas in quibus significabatur de societate et amicitia"
      en: "And Onias received the ambassador with honour: and received the letters wherein there was mention made of the alliance, and amity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "nos cum nullo horum indigeremus habentes solacio sanctos libros qui sunt in manibus nostris"
      en: "We, though we needed none of these things, having for our comfort the holy books that are in our hands,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "maluimus mittere ad vos renovare fraternitatem et amicitiam ne forte alieni efficiamur a vobis multa enim tempora transierunt ex quo misistis ad nos"
      en: "Chose rather to send to you to renew the brotherhood and friendship, lest we should become strangers to you altogether: for there is a long time passed since you sent to us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nos ergo in omni tempore sine intermissione in diebus sollemnibus et ceteris quibus oportet memores sumus vestri in sacrificiis quae offerimus et observationibus sicut fas est et decet meminisse fratrum"
      en: "We therefore at all times without ceasing, both in our festivals, and other days, wherein it is convenient, remember you in the sacrifices that we offer, and in our observances, as it is meet, and becoming to remember brethren."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "laetamur itaque de gloria vestra"
      en: "And we rejoice at your glory."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nos autem circumdederunt multae tribulationes et multa proelia et inpugnaverunt nos reges qui sunt in circuitu nostro"
      en: "But we have had many troubles and wars on every side, and the kings that are round about us, have fought against us."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "noluimus ergo vobis molesti esse neque ceteris sociis et amicis nostris in his proeliis"
      en: "But we would not be troublesome to you, nor the rest of our allies and friends in these wars."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "habuimus enim de caelo auxilium et liberati sumus nos et humiliati sunt inimici nostri"
      en: "For we have had help from heaven, and we have been delivered, and our enemies are humbled."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "elegimus itaque Numenium Antiochi et Antipatrum Iasonis filium et misimus ad Romanos renovare cum eis amicitiam et societatem pristinam"
      en: "We have chosen therefore Numenius the son of Antiochus, and Antipater the son of Jason, and have sent them to the Romans to renew with them the former amity and alliance."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "mandavimus itaque eis ut veniant etiam ad vos et salutent vos ut reddant vobis epistulas nostras de innovatione fraternitatis nostrae"
      en: "And we have commanded them to go also to you, and to salute you, and to deliver you our letters, concerning the renewing of our brotherhood."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et nunc bene facietis respondentes nobis ad haec"
      en: "And now you shall do well to give us an answer hereto."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et hoc rescriptum epistularum quod miserat Onias"
      en: "And this is the copy of the letter which he had sent to Onias:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "rex Spartiarum Onias Ionathae sacerdoti magno salutem"
      en: "Arius king of the Spartans to Onias the high priest, greeting."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "inventum est in scriptura de Spartiatis et Iudaeis quoniam sunt fratres et quia sunt de genere Abraham"
      en: "It is found in writing concerning the Spartans, and the Jews, that they are brethren, and that they are of the stock of Abraham."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et nunc ex quo haec cognovimus bene facitis scribentes nobis de pace vestra"
      en: "And now since this is come to our knowledge, you do well to write to us of your prosperity."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sed et nos rescripsimus vobis pecora nostra et possessiones nostrae vestrae sunt et vestra nostra mandavimus itaque haec nuntiari vobis"
      en: "And we also have written back to you: That our cattle, and our possessions are yours: and yours, ours. We therefore have commanded that these things should be told you."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et audivit Ionathas quoniam egressi sunt principes Demetrii cum exercitu multo supra quam prius pugnare adversus eum"
      en: "Now Jonathan heard that the generals of Demetrius were come again with a greater army than before to fight against him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et exiit ab Hierusalem et occurrit eis in Amathite regione non enim dederat eis spatium ut ingrederentur regionem eius"
      en: "So he went out from Jerusalem, and met them in the land of Amath: for he gave them no time to enter into his country."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et misit speculatores in castra eorum et reversi renuntiaverunt quia constituunt supervenire illis nocte"
      en: "And he sent spies into their camp, and they came back and brought him word that they designed to come upon them in the night."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cum occidisset autem sol praecepit Ionathas suis vigilare et esse in armis paratos ad pugnam tota nocte et posuit custodes per circuitum castrorum"
      en: "And when the sun was set, Jonathan commanded his men to watch, and to be in arms all night long ready to fight, and he set sentinels round about the camp."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et audierunt adversarii quia paratus est Ionathas cum suis in bello et timuerunt et formidaverunt corde suo et accenderunt focos in castris suis"
      en: "And the enemies heard that Jonathan and his men were ready for battle, and they were struck with fear, and dread in their heart: and they kindled fires in their camp."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ionathas autem et qui cum eo erant non cognoverunt usque mane videbant enim lumina ardentia"
      en: "But Jonathan and they that were with him knew it not till the morning: for they saw the lights burning."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et secutus est Ionatha et non conprehendit eos transierant enim flumen Eleutherum"
      en: "And Jonathan pursued after them, but overtook them not: for they had passed the river Eleutherus."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et divertit Ionathas ad Arabas qui vocantur Zabadei et percussit eos et accepit spolia eorum"
      en: "And Jonathan turned upon the Arabians that are called Zabadeans: and he defeated them, and took the spoils of them."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et iunxit et venit Damascum et perambulavit omnem regionem illam"
      en: "And he went forward, and came to Damascus, and passed through all that country."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Simon autem exiit et venit usque ad Ascalona et ad proxima praesidia et declinavit in Ioppen et occupavit eam"
      en: "Simon also went forth, and came as far as Ascalon, and the neighbouring fortresses, and he turned aside to Joppe, and took possession of it,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "audivit enim quod vellent praesidium tradere partibus Demetrii et posuit ibi custodes ut custodirent eam"
      en: "(For he heard that they designed to deliver the hold to them that took part with Demetrius,) and he put a garrison there to keep it."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et reversus est Ionathas et convocavit seniores populi et cogitavit cum eis aedificare praesidia in Iudaea"
      en: "And Jonathan came back, and called together the ancients of the people, and he took a resolution with them to build fortresses in Judea,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et aedificare muros in Hierusalem et exaltare altitudinem magnam inter medium arcis et civitatis ut separaret eam a civitate ut esset ipsa singulariter et neque emant neque vendant"
      en: "And to build up walls in Jerusalem, and raise a mount between the castle and the city, to separate it from the city, that so it might have no communication, and that they might neither buy nor sell."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et convenerunt ut aedificarent civitatem et cecidit murus qui erat super torrentem ab ortu solis et reparavit eum qui vocatur Caphetetha"
      en: "And they came together to build up the city: for the wall that was upon the brook towards the east was broken down, and he repaired that which is called Caphetetha:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et Simon aedificavit Adiada in Sephela et munivit eam et inposuit portas et seras"
      en: "And Simon built Adiada in Sephela, and fortified it, and set up gates and bars."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "et cum cogitasset Tryfon regnare Asiae et adsumere diadema et extendere manum in Antiochum regem"
      en: "Now when Tryphon had conceived a design to make himself king of Asia, and to take the crown, and to stretch out his hand against king Antiochus:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "timens ne forte non permitteret eum Ionathas sed pugnaret adversus eum quaerebat conprehendere eum et occidere et exsurgens abiit in Bethasan"
      en: "Fearing lest Jonathan would not suffer him, but would fight against him: he sought to seize upon him, and to kill him. So he rose up and came to Bethsan."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et exiit Ionathas obviam cum quadraginta milibus virorum electorum in proelium et venit Bethasan"
      en: "And Jonathan went out to meet him with forty thousand men chosen for battle, and came to Bethsan."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et vidit Tryfon quia venit cum exercitu multo ut extenderet in eum manus et timuit"
      en: "Now when Tryphon saw that Jonathan came with a great army, he durst not stretch forth his hand against him,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et excepit eum cum honore et commendavit eum omnibus amicis suis et dedit ei munera et praecepit exercitibus suis ut oboedirent ei sicut sibi"
      en: "But received him with honour, and commended him to all his friends, and gave him presents: and he commanded his troops to obey him, as himself."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et dixit Ionathae ut quid vexasti universum populum cum bellum nobis non sit"
      en: "And he said to Jonathan: Why hast thou troubled all the people, whereas we have no war?"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et nunc remitte eos in domos suas elige autem tibi viros paucos qui tecum sint et veni mecum Ptolomaidam et tradam illam tibi et reliqua praesidia et exercitum et universos praepositos negotii et conversus abibo propterea enim veni"
      en: "Now therefore send them back to their own houses: and choose thee a few men that may be with thee, and come with me to Ptolemais, and I will deliver it to thee, and the rest of the strong holds, and the army, and all that have any charge, and I will return and go away: for this is the cause of my coming."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et credidit ei et fecit sicut dixit et dimisit exercitum et abierunt in terram Iudam"
      en: "And Jonathan believed him, and did as he said: and sent away his army, and they departed into the land of Juda:"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "retinuit autem secum tria milia virorum ex quibus remisit in Galileam duo milia mille autem cum eo venerunt"
      en: "But he kept with him three thousand men: of whom he sent two thousand into Galilee, and one thousand went with him."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "ut intravit autem Ionathas Ptolomaidam cluserunt portas Ptolomenses et conprehenderunt eum et omnes qui cum eo intraverant gladio interfecerunt"
      en: "Now as soon as Jonathan entered into Ptolemais, they of Ptolemais shut the gates of the city, and took him: and all them that came in with him they slew with the sword."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et misit Tryfon exercitum et equites in Galileam et in campum magnum ut perderent omnes socios Ionathae"
      en: "Then Tryphon sent an army and horsemen into Galilee, and into the great plain to destroy all Jonathan's company."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "at illi cum cognovissent quia conprehensus est et periit et omnes qui cum eo erant hortati sunt semet ipsos et exierunt parati in proelium"
      en: "But they, when they understood that Jonathan and all that were with him were taken and slain, encouraged one another, and went out ready for battle."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et videntes hii qui insecuti fuerant quia pro anima res est illis reversi sunt"
      en: "Then they that had come after them, seeing that they stood for their lives, returned back."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "illi autem venerunt omnes cum pace in terram Iuda et planxerunt Ionathan et eos qui cum eo fuerant valde et luxit Israhel luctu magno"
      en: "Whereupon they all came peaceably into the land of Juda. And they bewailed Jonathan, and them that had been with him, exceedingly: and Israel mourned with great lamentation."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "et quaesierunt omnes gentes quae erant in circuitu eorum perdere eos dixerunt enim"
      en: "Then all the heathens that were round about them, sought to destroy them. For they said:"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "non habent principem et adiuvantem nunc ergo expugnemus illos et tollamus de hominibus memoriam eorum"
      en: "They have no prince, nor any to help them: now therefore let us make war upon them, and take away the memory of them from amongst mem."
    status: { la: verified, en: verified }
