# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: luc
chapter: 24
verses:
  - n: 1
    text:
      la: "una autem sabbati valde diluculo venerunt ad monumentum portantes quae paraverant aromata"
      en: "And on the first day of the week, very early in the morning, they came to the sepulchre, bringing the spices which they had prepared."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et invenerunt lapidem revolutum a monumento"
      en: "And they found the stone rolled back from the sepulchre."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et ingressae non invenerunt corpus Domini Iesu"
      en: "And going in, they found not the body of the Lord Jesus."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et factum est dum mente consternatae essent de isto ecce duo viri steterunt secus illas in veste fulgenti"
      en: "And it came to pass, as they were astonished in their mind at this, behold, two men stood by them, in shining apparel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cum timerent autem et declinarent vultum in terram dixerunt ad illas quid quaeritis viventem cum mortuis"
      en: "And as they were afraid, and bowed down their countenance towards the ground, they said unto them: Why seek you the living with the dead?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non est hic sed surrexit recordamini qualiter locutus est vobis cum adhuc in Galilaea esset"
      en: "He is not here, but is risen. Remember how he spoke unto you, when he was in Galilee,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "dicens quia oportet Filium hominis tradi in manus hominum peccatorum et crucifigi et die tertia resurgere"
      en: "Saying: The Son of man must be delivered into the hands of sinful men, and be crucified, and the third day rise again."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et recordatae sunt verborum eius"
      en: "And they remembered his words."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et regressae a monumento nuntiaverunt haec omnia illis undecim et ceteris omnibus"
      en: "And going back from the sepulchre, they told all these things to the eleven, and to all the rest."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "erat autem Maria Magdalene et Iohanna et Maria Iacobi et ceterae quae cum eis erant quae dicebant ad apostolos haec"
      en: "And it was Mary Magdalen, and Joanna, and Mary of James, and the other women that were with them, who told these things to the apostles."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et visa sunt ante illos sicut deliramentum verba ista et non credebant illis"
      en: "And these words seemed to them as idle tales; and they did not believe them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Petrus autem surgens cucurrit ad monumentum et procumbens videt linteamina sola posita et abiit secum mirans quod factum fuerat"
      en: "But Peter rising up, ran to the sepulchre, and stooping down, he saw the linen cloths laid by themselves; and went away wondering in himself at that which was come to pass."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ecce duo ex illis ibant ipsa die in castellum quod erat in spatio stadiorum sexaginta ab Hierusalem nomine Emmaus"
      en: "And behold, two of them went, the same day, to a town which was sixty furlongs from Jerusalem, named Emmaus."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et ipsi loquebantur ad invicem de his omnibus quae acciderant"
      en: "And they talked together of all these things which had happened."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et factum est dum fabularentur et secum quaererent et ipse Iesus adpropinquans ibat cum illis"
      en: "And it came to pass, that while they talked and reasoned with themselves, Jesus himself also drawing near, went with them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "oculi autem illorum tenebantur ne eum agnoscerent"
      en: "But their eyes were held, that they should not know him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ait ad illos qui sunt hii sermones quos confertis ad invicem ambulantes et estis tristes"
      en: "And he said to them: What are these discourses that you hold one with another as you walk, and are sad?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et respondens unus cui nomen Cleopas dixit ei tu solus peregrinus es in Hierusalem et non cognovisti quae facta sunt in illa his diebus"
      en: "And the one of them, whose name was Cleophas, answering, said to him: Art thou only a stranger to Jerusalem, and hast not known the things that have been done there in these days?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quibus ille dixit quae et dixerunt de Iesu Nazareno qui fuit vir propheta potens in opere et sermone coram Deo et omni populo"
      en: "To whom he said: What things? And they said: Concerning Jesus of Nazareth, who was a prophet, mighty in work and word before God and all the people;"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et quomodo eum tradiderunt summi sacerdotum et principes nostri in damnationem mortis et crucifixerunt eum"
      en: "And how our chief priests and princes delivered him to be condemned to death, and crucified him."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nos autem sperabamus quia ipse esset redempturus Israhel et nunc super haec omnia tertia dies hodie quod haec facta sunt"
      en: "But we hoped, that it was he that should have redeemed Israel: and now besides all this, to day is the third day since these things were done."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sed et mulieres quaedam ex nostris terruerunt nos quae ante lucem fuerunt ad monumentum"
      en: "Yea and certain women also of our company affrighted us, who before it was light, were at the sepulchre,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et non invento corpore eius venerunt dicentes se etiam visionem angelorum vidisse qui dicunt eum vivere"
      en: "And not finding his body, came, saying, that they had also seen a vision of angels, who say that he is alive."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et abierunt quidam ex nostris ad monumentum et ita invenerunt sicut mulieres dixerunt ipsum vero non viderunt"
      en: "And some of our people went to the sepulchre, and found it so as the women had said, but him they found not."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ipse dixit ad eos o stulti et tardi corde ad credendum in omnibus quae locuti sunt prophetae"
      en: "Then he said to them: O foolish, and slow of heart to believe in all things which the prophets have spoken."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "nonne haec oportuit pati Christum et ita intrare in gloriam suam"
      en: "Ought not Christ to have suffered these things, and so to enter into his glory?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et incipiens a Mose et omnibus prophetis interpretabatur illis in omnibus scripturis quae de ipso erant"
      en: "And beginning at Moses and all the prophets, he expounded to them in all the scriptures, the things that were concerning him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et adpropinquaverunt castello quo ibant et ipse se finxit longius ire"
      en: "And they drew night to the town, whither they were going: and he made as though he would go farther."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et coegerunt illum dicentes mane nobiscum quoniam advesperascit et inclinata est iam dies et intravit cum illis"
      en: "But they constrained him; saying: Stay with us, because it is towards evening, and the day is now far spent. And he went in with them."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et factum est dum recumberet cum illis accepit panem et benedixit ac fregit et porrigebat illis"
      en: "And it came to pass, whilst he was at table with them, he took bread, and blessed, and brake, and gave to them."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et aperti sunt oculi eorum et cognoverunt eum et ipse evanuit ex oculis eorum"
      en: "And their eyes were opened, and they knew him: and he vanished out of their sight."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et dixerunt ad invicem nonne cor nostrum ardens erat in nobis dum loqueretur in via et aperiret nobis scripturas"
      en: "And they said one to the other: Was not our heart burning within us, whilst he spoke in this way, and opened to us the scriptures?"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et surgentes eadem hora regressi sunt in Hierusalem et invenerunt congregatos undecim et eos qui cum ipsis erant"
      en: "And rising up, the same hour, they went back to Jerusalem: and they found the eleven gathered together, and those that were staying with them,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "dicentes quod surrexit Dominus vere et apparuit Simoni"
      en: "Saying: The Lord is risen indeed, and hath appeared to Simon."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et ipsi narrabant quae gesta erant in via et quomodo cognoverunt eum in fractione panis"
      en: "And they told what things were done in the way; and how they knew him in the breaking of the bread."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dum haec autem loquuntur Iesus stetit in medio eorum et dicit eis pax vobis ego sum nolite timere"
      en: "Now whilst they were speaking these things, Jesus stood in the midst of them, and saith to them: Peace be to you; it is I, fear not."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "conturbati vero et conterriti existimabant se spiritum videre"
      en: "But they being troubled and frightened, supposed that they saw a spirit."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et dixit eis quid turbati estis et cogitationes ascendunt in corda vestra"
      en: "And he said to them: Why are you troubled, and why do thoughts arise in your hearts?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "videte manus meas et pedes quia ipse ego sum palpate et videte quia spiritus carnem et ossa non habet sicut me videtis habere"
      en: "See my hands and feet, that it is I myself; handle, and see: for a spirit hath not flesh and bones, as you see me to have."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et cum hoc dixisset ostendit eis manus et pedes"
      en: "And when he had said this, he shewed them his hands and feet."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "adhuc autem illis non credentibus et mirantibus prae gaudio dixit habetis hic aliquid quod manducetur"
      en: "But while they yet believed not, and wondered for joy, he said: Have you any thing to eat?"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "at illi obtulerunt ei partem piscis assi et favum mellis"
      en: "And they offered him a piece of a broiled fish, and a honeycomb."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "et cum manducasset coram eis sumens reliquias dedit eis"
      en: "And when he had eaten before them, taking the remains, he gave to them."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et dixit ad eos haec sunt verba quae locutus sum ad vos cum adhuc essem vobiscum quoniam necesse est impleri omnia quae scripta sunt in lege Mosi et prophetis et psalmis de me"
      en: "And he said to them: These are the words which I spoke to you, while I was yet with you, that all things must needs be fulfilled, which are written in the law of Moses, and in the prophets, and in the psalms, concerning me."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "tunc aperuit illis sensum ut intellegerent scripturas"
      en: "Then he opened their understanding, that they might understand the scriptures."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et dixit eis quoniam sic scriptum est et sic oportebat Christum pati et resurgere a mortuis die tertia"
      en: "And he said to them: Thus it is written, and thus it behoved Christ to suffer, and to rise again from the dead, the third day:"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et praedicari in nomine eius paenitentiam et remissionem peccatorum in omnes gentes incipientibus ab Hierosolyma"
      en: "And that penance and remission of sins should be preached in his name, unto all nations, beginning at Jerusalem."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "vos autem estis testes horum"
      en: "And you are witnesses of these things."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et ego mitto promissum Patris mei in vos vos autem sedete in civitate quoadusque induamini virtutem ex alto"
      en: "And I send the promise of my Father upon you: but stay you in the city till you be endued with power from on high."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "eduxit autem eos foras in Bethaniam et elevatis manibus suis benedixit eis"
      en: "And he led them out as far as Bethania: and lifting up his hands, he blessed them."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "et factum est dum benediceret illis recessit ab eis et ferebatur in caelum"
      en: "And it came to pass, whilst he blessed them, he departed from them, and was carried up to heaven."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "et ipsi adorantes regressi sunt in Hierusalem cum gaudio magno"
      en: "And they adoring went back into Jerusalem with great joy."
    status: { la: verified, en: verified }
