# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 35
verses:
  - n: 1
    text:
      la: "igitur congregata omni turba filiorum Israhel dixit ad eos haec sunt quae iussit Dominus fieri"
      en: "And all the multitude of the children of Israel being gathered together, he said to them: These are the things which the Lord hath commanded to be done."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sex diebus facietis opus septimus dies erit vobis sanctus sabbatum et requies Domini qui fecerit opus in eo occidetur"
      en: "Six days you shall do work: the seventh day shall be holy unto you, the sabbath, and the rest of the Lord: he that shall do any work on it, shall be put to death."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "non succendetis ignem in omnibus habitaculis vestris per diem sabbati"
      en: "You shall kindle no fire in any of your habitations on the sabbath day."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ait Moses ad omnem catervam filiorum Israhel iste est sermo quem praecepit Dominus dicens"
      en: "And Moses said to all the assembly of the children of Israel: This is the word the Lord hath commanded, saying:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "separate apud vos primitias Domino omnis voluntarius et proni animi offerat eas Domino aurum et argentum et aes"
      en: "Set aside with you firstfuits to the Lord. Let every one that is willing and hath a ready heart, offer them to the Lord: gold, and silver, and brass,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "hyacinthum purpuram coccumque bis tinctum et byssum pilos caprarum"
      en: "Violet and purple, and scarlet twice dyed, and fine linen, goats' hair,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et pelles arietum rubricatas et ianthinas"
      en: "And rams' skins dyed red, and violet coloured skins, setim wood,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ligna setthim"
      en: "And oil to maintain lights, and to make ointment, and most sweet incense."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et oleum ad luminaria concinnanda et ut conficiatur unguentum et thymiama suavissimum"
      en: "Onyx stones, and precious stones, for the adorning of the ephod and the rational."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "lapides onychinos et gemmas ad ornatum superumeralis et rationalis"
      en: "Whosoever of you is wise, let him come, and make that which the Lord hath commanded:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quisquis vestrum est sapiens veniat et faciat quod Dominus imperavit"
      en: "To wit, the tabernacle and the roof thereof, and the cover, the rings, and the board work with the oars, the pillars, and the sockets:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tabernaculum scilicet et tectum eius atque operimentum anulos et tabulata cum vectibus paxillos et bases"
      en: "The ark and the staves, the propitiatory, and the veil that is drawn before it:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "arcam et vectes propitiatorium et velum quod ante illud oppanditur"
      en: "The table with the bars and the vessels, and the loaves of proposition:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "mensam cum vectibus et vasis et propositionis panibus"
      en: "The candlestick to bear up the lights, the vessels thereof and the lamps, and the oil for the nourishing of fires:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "candelabrum ad luminaria sustentanda vasa illius et lucernas et oleum ad nutrimenta ignium"
      en: "The altar of incense, and the bars, and the oil of unction and the incense of spices: the hanging at the door of the tabernacle:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "altare thymiamatis et vectes oleum unctionis et thymiama ex aromatibus tentorium ad ostium tabernaculi"
      en: "The altar of holocaust, and its grate of brass, with the bars and vessels thereof: the laver and its foot:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "altare holocausti et craticulam eius aeneam cum vectibus et vasis suis labrum et basim eius"
      en: "The curtains of the court with the pillars and the sockets, the hanging in the doors of the entry,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cortinas atrii cum columnis et basibus tentorium in foribus vestibuli"
      en: "The pins of the tabernacle and of the court with their little cords:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "paxillos tabernaculi et atrii cum funiculis suis"
      en: "The vestments that are to be used in the ministry of the sanctuary, the vesture of Aaron the high priest, and of his sons, to do the office of priesthood to me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "vestimenta quorum usus est in ministerio sanctuarii vestes Aaron pontificis ac filiorum eius ut sacerdotio fungantur mihi"
      en: "And all the multitude of the children of Israel going out from the presence of Moses,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "egressaque omnis multitudo filiorum Israhel de conspectu Mosi"
      en: "Offered firstfruits to the Lord with a most ready and devout mind, to make the work of the tabernacle of the testimony. Whatsoever was necessary to the service, and to the holy vestments,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "obtulit mente promptissima atque devota primitias Domino ad faciendum opus tabernaculi testimonii quicquid in cultum et ad vestes sanctas necessarium erat"
      en: "Both men and women gave bracelets and earrings, rings and tablets: every vessel of gold was set aside to be offered to the Lord."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "viri cum mulieribus praebuerunt armillas et inaures anulos et dextralia omne vas aureum in donaria Domini separatum est"
      en: "If any man had violet, and purple, and scarlet twice dyed, fine linen and goats' hair, rams' skins dyed red, and violet coloured skins,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "si quis habuit hyacinthum purpuram coccumque bis tinctum byssum et pilos caprarum pelles arietum rubricatas et ianthinas"
      en: "Metal of silver and brass, they offered it to the Lord, and setim wood for divers uses."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "argenti et aeris metalla obtulerunt Domino lignaque setthim in varios usus"
      en: "The skilful women also gave such things as they had spun, violet, purple, and scarlet, and fine linen,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "sed et mulieres doctae dederunt quae neverant hyacinthum purpuram et vermiculum ac byssum"
      en: "And goats' hair, giving all of their own accord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et pilos caprarum sponte propria cuncta tribuentes"
      en: "But the princes offered onyx stone, and precious stones, for the ephod and the rational,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "principes vero obtulerunt lapides onychinos et gemmas ad superumerale et rationale"
      en: "And spices and oil for the lights, and for the preparing of ointment, and to make the incense of most sweet savour."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "aromataque et oleum ad luminaria concinnanda et ad praeparandum unguentum ac thymiama odoris suavissimi conponendum"
      en: "All both men and women with devout mind offered gifts, that the works might be done which the Lord had commanded by the hand of Moses. All the children of Israel dedicated voluntary offerings to the Lord."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "omnes viri et mulieres mente devota obtulerunt donaria ut fierent opera quae iusserat Dominus per manum Mosi cuncti filii Israhel voluntaria Domino dedicaverunt"
      en: "And Moses said to the children of Israel: Behold the Lord hath called by name Beseleel the son of Uri the son of Hur of the tribe of Juda."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "dixitque Moses ad filios Israhel ecce vocavit Dominus ex nomine Beselehel filium Uri filii Hur de tribu Iuda"
      en: "And hath filled him with the spirit of God, with wisdom and understanding and knowledge and all learning."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "implevitque eum spiritu Dei sapientiae et intellegentiae et scientiae omni doctrina"
      en: "To devise and to work in gold and silver and brass,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "ad excogitandum et faciendum opus in auro et argento et aere sculpendisque lapidibus et opere carpentario quicquid fabre adinveniri potest"
      en: "And in engraving stones, and in carpenters' work. Whatsoever can be devised artificially,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "dedit in corde eius Hooliab quoque filium Achisamech de tribu Dan"
      en: "He hath given in his heart: Ooliab also the son of Achisamech of the tribe of Dan:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "ambos erudivit sapientia ut faciant opera abietarii polymitarii ac plumarii de hyacintho et purpura coccoque bis tincto et bysso et texant omnia ac nova quaeque repperiant"
      en: "Both of them hath he instructed with wisdom, to do carpenters' work and tapestry, and embroidery in blue and purple, and scarlet twice dyed, and fine linen, and to weave all things, and to invent all new things."
    status: { la: verified, en: verified }
