# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 3reg
chapter: 2
verses:
  - n: 1
    text:
      la: "adpropinquaverant autem dies David ut moreretur praecepitque Salomoni filio suo dicens"
      en: "And the days of David drew nigh that he should die, and he charged his son Solomon, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ego ingredior viam universae terrae confortare et esto vir"
      en: "I am going the way of all flesh: take thou courage, and shew thyself a man."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et observa custodias Domini Dei tui ut ambules in viis eius et custodias caerimonias eius et praecepta eius et iudicia et testimonia sicut scriptum est in lege Mosi ut intellegas universa quae facis et quocumque te verteris"
      en: "And keep the charge of the Lord thy God, to walk in his ways, and observe his ceremonies, and his precepts, and judgments, and testimonies, as it is written in the law of Moses: that thou mayest understand all thou dost, and whithersoever thou shalt turn thyself :"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ut confirmet Dominus sermones suos quos locutus est de me dicens si custodierint filii tui viam suam et ambulaverint coram me in veritate in omni corde suo et in omni anima sua non auferetur tibi vir de solio Israhel"
      en: "That the Lord may confirm his words, which he hath spoken of me, saying: If thy children shall take heed to their ways, and shall walk before me in truth, with all their heart, and with all their soul, there shall not be taken away from thee a man on the throne of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tu quoque nosti quae fecerit mihi Ioab filius Sarviae quae fecerit duobus principibus exercitus Israhel Abner filio Ner et Amasa filio Iether quos occidit et effudit sanguinem belli in pace et posuit cruorem proelii in balteo suo qui erat circa lumbos eius et in calciamento suo quod erat in pedibus eius"
      en: "Thou knowest also what Joab the son of Sarvia hath done to me, what he did to the two captains of the army of Israel, to Abner the son of Ner, and to Amasa the son of Jether: whom he slew, and shed the blood of war in peace, and put the blood of war on his girdle that was about his loins, and in his shoes that were on his feet."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "facies ergo iuxta sapientiam tuam et non deduces canitiem eius pacifice ad inferos"
      en: "Do therefore according to thy wisdom, and let not his hoary head go down to hell in peace."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed et filiis Berzellai Galaaditis reddes gratiam eruntque comedentes in mensa tua occurrerunt enim mihi quando fugiebam a facie Absalom fratris tui"
      en: "But shew kindness to the sons of Berzellai the Galaadite, and let them eat at thy table: t for they met me when I fled from the face of Absalom thy brother."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "habes quoque apud te Semei filium Gera filii Iemini de Baurim qui maledixit mihi maledictione pessima quando ibam ad Castra sed quia descendit mihi in occursum cum transirem Iordanem et iuravi ei per Dominum dicens non te interficiam gladio"
      en: "Thou hast also with thee Semei the son of Gera the son of Jemini of Bahurim, who cursed me with a grievous curse, when I went to the camp: but because he came down to meet me when I passed over the Jordan, and I swore to him by the Lord, saying: I will not kill thee with a sword:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "tu noli pati esse eum innoxium vir autem sapiens es et scies quae facias ei deducesque canos eius cum sanguine ad infernum"
      en: "Do not thou hold him guiltless. But thou art a wise man, and knowest what to do with him, and thou shalt bring down his grey hairs with blood to hell."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "dormivit igitur David cum patribus suis et sepultus est in civitate David"
      en: "So David slept with his fathers, and was buried in the city of David."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dies autem quibus regnavit David super Israhel quadraginta anni sunt in Hebron regnavit septem annis in Hierusalem triginta tribus"
      en: "And the days that David reigned in Israel, were forty gears: in Hebron he reigned seven years, in Jerusalem thirty-three."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Salomon autem sedit super thronum David patris sui et firmatum est regnum eius nimis"
      en: "And Solomon sat upon the throne of his father David, and his kingdom was strengthened exceedingly."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ingressus est Adonias filius Aggith ad Bethsabee matrem Salomonis quae dixit ei pacificusne ingressus tuus qui respondit pacificus"
      en: "And Adonias the son of Haggith came to Bethsabee the mother of Solomon. And she said to him: Is thy coming peaceable? he answered: Peaceable."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "addiditque sermo mihi est ad te cui ait loquere et ille"
      en: "And he added: I have a word to speak with thee. She said to him: Speak. And he said:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "tu inquit nosti quia meum erat regnum et me proposuerat omnis Israhel sibi in regem sed translatum est regnum et factum est fratris mei a Domino enim constitutum est ei"
      en: "Thou knowest that the kingdom was nine, and all Israel had preferred me to be their king: but the kingdom is transferred, and is become my brother's: for it was appointed him by the Lord."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nunc ergo petitionem unam deprecor a te ne confundas faciem meam quae dixit ad eum loquere"
      en: "Now therefore I ask one petition of thee: turn not away my face. And she said to him: Say on."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ille ait precor ut dicas Salomoni regi neque enim negare tibi quicquam potest ut det mihi Abisag Sunamitin uxorem"
      en: "And he said: I pray thee speak to king Solomon (for he cannot deny thee any thing) to give me Abisag the Sunamitess to wife."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ait Bethsabee bene ego loquar pro te regi"
      en: "And Bethsabee said: Well, I will speak for thee to the king."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "venit ergo Bethsabee ad regem Salomonem ut loqueretur ei pro Adonia et surrexit rex in occursum eius adoravitque eam et sedit super thronum suum positus quoque est thronus matri regis quae sedit ad dexteram eius"
      en: "Then Bethsabee came to king Solomon, to speak to him for Adonias: and the king arose to meet her, and bowed to her, and sat down upon his throne: and a throne was set for the king's mother, and she sat on his right hand."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixitque ei petitionem unam parvulam ego deprecor a te ne confundas faciem meam dixit ei rex pete mater mi neque enim fas est ut avertam faciem tuam"
      en: "And she said to him: I desire one small petition of thee, do not put me to confusion. And the king said to her: My mother, ask: for I must not turn away thy face."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quae ait detur Abisag Sunamitis Adoniae fratri tuo uxor"
      en: "And she said: Let Abisag the Sunamitess be given to Adonias thy brother to wife."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "responditque rex Salomon et dixit matri suae quare postulas Abisag Sunamitin Adoniae postula ei et regnum ipse est enim frater meus maior me et habet Abiathar sacerdotem et Ioab filium Sarviae"
      en: "And king Solomon answered, and said to his mother: Why dost thou ask Abisag the Sunamitess for Adonias? ask for him also the kingdom: for he is my elder brother, and hath Abiathar the priest, and Joab the son of Sarvia."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "iuravit itaque rex Salomon per Dominum dicens haec faciat mihi Deus et haec addat quia contra animam suam locutus est Adonias verbum hoc"
      en: "Then king Solomon swore by the Lord, saying: So and so may God do to me, and add more, if Adonias hath not spoken this word against his own life."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et nunc vivit Dominus qui firmavit me et conlocavit super solium David patris mei et qui fecit mihi domum sicut locutus est quia hodie occidetur Adonias"
      en: "And now as the Lord liveth, who hath established me, and placed me upon the throne of David my father, and who hath made me a house, as he promised, Adonias shall be put to death this day."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "misitque rex Salomon per manum Banaiae filii Ioiadae qui interfecit eum et mortuus est"
      en: "And king Solomon sent by the hand of Banaias the son of Joiada, who slew him, and he died."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Abiathar quoque sacerdoti dixit rex vade in Anathot ad agrum tuum es quidem vir mortis sed hodie te non interficiam quia portasti arcam Domini Dei coram David patre meo et sustinuisti laborem in omnibus in quibus laboravit pater meus"
      en: "And the king said also to Abiathar the priest: Go to Anathoth to thy lands, for indeed thou art worthy of death: but I will not at this time put thee to death, because thou didst carry the ark of the Lord God before David my father, and hast endured trouble in all the troubles my father endured."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "eiecit ergo Salomon Abiathar ut non esset sacerdos Domini ut impleretur sermo Domini quem locutus est super domum Heli in Silo"
      en: "So Solomon cast out Abiathar, from being the priest of the Lord, that the word of the Lord might be fulfilled, which he spoke concerning the house of Deli in Silo."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "venit autem nuntius ad Ioab quod Ioab declinasset post Adoniam et post Absalom non declinasset fugit ergo Ioab in tabernaculum Domini et adprehendit cornu altaris"
      en: "And the news came to Joab, because Joab had turned after Adonias, and had not turned after Solomon: and Joab fled into the tabernacle of the Lord and laid hold on the horn of the altar."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "nuntiatumque est regi Salomoni quod fugisset Ioab in tabernaculum Domini et esset iuxta altare misitque Salomon Banaiam filium Ioiadae dicens vade interfice eum"
      en: "And it was told king Solomon, that Joab was fled into the tabernacle of the Lord, and was by the altar: and Solomon sent Banaias the son of Joiada, saying: Go, kill him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "venit Banaias ad tabernaculum Domini et dixit ei haec dicit rex egredere qui ait non egrediar sed hic moriar renuntiavit Banaias regi sermonem dicens haec locutus est Ioab et haec respondit mihi"
      en: "And Banaias came to the tabernacle of the Lord, and said to him: Thus saith the king: Come forth. And he said: I will not come forth, but here I will die. Banaias brought word back to the king, saying: Thus saith Joab, and thus he answered me."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "dixitque ei rex fac sicut locutus est et interfice eum et sepeli et amovebis sanguinem innocentem qui effusus est a Ioab a me et a domo patris mei"
      en: "And the king said to him: Do as he hath said: and kill him, and bury him, and thou shalt remove the innocent blood which hath been shed by Joab, from me, and from the house of my father."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et reddat Dominus sanguinem eius super caput eius quia interfecit duos viros iustos melioresque se et occidit eos gladio patre meo David ignorante Abner filium Ner principem militiae Israhel et Amasa filium Iether principem exercitus Iuda"
      en: "And the Lord shall return his blood upon his own head, because he murdered two men, just and better than himself: and slew them with the sword, my father David not knowing it, Abner the son of Ner, general of the army of Israel, and Amasa the son of Jether, general of the army of Juda."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "et revertetur sanguis illorum in caput Ioab et in caput seminis eius in sempiternum David autem et semini eius et domui et throno illius sit pax usque in aeternum a Domino"
      en: "And their blood shall return the head of Joab, and upon the head of his seed for ever. But to David and his seed and his house, and to his throne be peace for ever from the Lord."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "ascendit itaque Banaias filius Ioiadae et adgressus eum interfecit sepultusque est in domo sua in deserto"
      en: "So Banaias the son of Joiada went up, and setting upon him slew him, and he was buried in his house in the desert."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et constituit rex Banaiam filium Ioiadae pro eo super exercitum et Sadoc sacerdotem posuit pro Abiathar"
      en: "And the king appointed Banaias the son of Joiada in his room over the army, and Sadoc the priest he put in the place of Abiathar."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "misit quoque rex et vocavit Semei dixitque ei aedifica tibi domum in Hierusalem et habita ibi et non egredieris inde huc atque illuc"
      en: "The king also sent, and called for Semei, and said to him: Build thee a house in Jerusalem, and dwell there: and go not out from thence any whither."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "quacumque autem die egressus fueris et transieris torrentem Cedron scito te interficiendum sanguis tuus erit super caput tuum"
      en: "For on what day soever thou shalt go out, and shalt pass over the brook Cedron, know that thou shalt be put to death: thy blood shall be upon thy own head:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "dixitque Semei regi bonus sermo sicut locutus est dominus meus rex sic faciet servus tuus habitavit itaque Semei in Hierusalem diebus multis"
      en: "And Semei said to the king: The saying is good : as my lord the king hath said, so will thy servant do. And Semei dwelt in Jerusalem, many days."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "factum est autem post annos tres ut fugerent servi Semei ad Achis filium Maacha regem Geth nuntiatumque est Semei quod servi eius essent in Geth"
      en: "And it came to pass after three years, that the servants of Semei ran away to Achis the son of Maacha the king of Geth: and it was told Semei that his servants were gone to Geth."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et surrexit Semei et stravit asinum suum ivitque in Geth ad Achis ad requirendos servos suos et adduxit eos de Geth"
      en: "And Semei arose, and saddled his ass, and went to Achis to Geth to seek his servants, and he brought them out of Geth."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "nuntiatum est autem Salomoni quod isset Semei in Geth de Hierusalem et redisset"
      en: "And it was told Solomon that Semei had gone from Jerusalem to Geth, and was come back."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et mittens vocavit eum dixitque illi nonne testificatus sum tibi per Dominum et praedixi tibi quacumque die egressus ieris huc et illuc scito te esse moriturum et respondisti mihi bonus sermo audivi"
      en: "And sending he called for him, and said to him: Did I not protest to thee by the Lord, and tell thee before: On what day soever thou shalt go out and walk abroad any whither, know that thou shalt die? And thou answeredst me: The word that I have heard is good."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "quare ergo non custodisti iusiurandum Domini et praeceptum quod praeceperam tibi"
      en: "Why then hast thou not kept the oath of the Lord, and the commandment that I laid upon thee?"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "dixitque rex ad Semei tu nosti omne malum cuius tibi conscium est cor tuum quod fecisti David patri meo reddidit Dominus malitiam tuam in caput tuum"
      en: "And the king said to Semei: Thou knowest all the evil, of which thy heart is conscious, which thou didst to David my father: the Lord hath returned thy wickedness upon thy own head:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et rex Salomon benedictus et thronus David erit stabilis coram Domino usque in sempiternum"
      en: "And king Solomon shall be blessed, and the throne of David shall be established before the Lord for ever."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "iussit itaque rex Banaiae filio Ioiadae qui egressus percussit eum et mortuus est"
      en: "So the king commanded Banaias the son of Joiada: and he went out and struck him, and he died."
    status: { la: verified, en: verified }
