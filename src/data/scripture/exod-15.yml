book: exod
chapter: 15
verses:
  - n: 1
    text:
      la: "tunc cecinit Moses et filii Israhel carmen hoc Domino et dixerunt cantemus Domino gloriose enim magnificatus est equum et ascensorem deiecit in mare"
      en: "Then Moses and the children of Israel sung this canticle to the Lord: and said: Let us sing to the Lord: for he is gloriously magnified, the horse and the rider he hath thrown into the sea."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fortitudo mea et laus mea Dominus et factus est mihi in salutem iste Deus meus et glorificabo eum Deus patris mei et exaltabo eum"
      en: "The Lord is my strength and my praise, and he is become salvation to me: he is my God and I will glorify him: the God of my father, and I will exalt him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dominus quasi vir pugnator Omnipotens nomen eius"
      en: "The Lord is as a man of war, Almighty is his name."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "currus Pharaonis et exercitum eius proiecit in mare electi principes eius submersi sunt in mari Rubro"
      en: "Pharao's chariots and his army he hath cast into the sea: his chosen captains are drowned in the Red Sea."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "abyssi operuerunt eos descenderunt in profundum quasi lapis"
      en: "The depths have covered them, they are sunk to the bottom like a stone."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dextera tua Domine magnifice in fortitudine dextera tua Domine percussit inimicum"
      en: "Thy right hand, O Lord, is magnified in strength: thy right hand, O Lord, hath slain the enemy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et in multitudine gloriae tuae deposuisti adversarios meos misisti iram tuam quae devoravit eos ut stipulam"
      en: "And in the multitude of they glory thou hast put down thy adversaries: thou hast sent thy wrath, which hath devoured them like stubble."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et in spiritu furoris tui congregatae sunt aquae stetit unda fluens congregatae sunt abyssi in medio mari"
      en: "And with the blast of thy anger the waters were gathered together: the flowing water stood, the depth were gathered together in the midst of the sea."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixit inimicus persequar et conprehendam dividam spolia implebitur anima mea evaginabo gladium meum interficiet eos manus mea"
      en: "The enemy said: I will pursue and overtake, I will divide the spoils, my soul shall have its fill: I will draw my sword, my hand shall slay them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "flavit spiritus tuus et operuit eos mare submersi sunt quasi plumbum in aquis vehementibus"
      en: "Thy wind blew and the sea covered them: they sunk as lead in the mighty waters."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quis similis tui in fortibus Domine quis similis tui magnificus in sanctitate terribilis atque laudabilis et faciens mirabilia"
      en: "Who is like to thee, among the strong, O Lord? who is like to thee, glorious in holiness, terrible and praiseworthy, doing wonders?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "extendisti manum tuam et devoravit eos terra"
      en: "Thou stretchedst forth thy hand, and the earth swallowed them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dux fuisti in misericordia tua populo quem redemisti et portasti eum in fortitudine tua ad habitaculum sanctum tuum"
      en: "In thy mercy thou hast been a leader to the people which thou hast redeemed: and in thy strength thou hast carried them to thy holy habitation."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "adtenderunt populi et irati sunt dolores obtinuerunt habitatores Philisthim"
      en: "Nations rose up, and were angry: sorrows took hold on the inhabitants of Philisthiim."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "tunc conturbati sunt principes Edom robustos Moab obtinuit tremor obriguerunt omnes habitatores Chanaan"
      en: "Then were the princes of Edom troubled, trembling seized on the stout men of Moab: all the inhabitants of Chanaan became stiff."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "inruat super eos formido et pavor in magnitudine brachii tui fiant inmobiles quasi lapis donec pertranseat populus tuus Domine donec pertranseat populus tuus iste quem possedisti"
      en: "Let fear and dread fall upon them, in the greatness of thy arm: let them become unmoveable as a stone, until thy people, O Lord, pass by: until this thy people pass by, which thou hast possessed."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "introduces eos et plantabis in monte hereditatis tuae firmissimo habitaculo tuo quod operatus es Domine sanctuarium Domine quod firmaverunt manus tuae"
      en: "Thou shalt bring them in, and plant them in the mountain of thy inheritance, in thy most firm habitation which thou hast made, O Lord; thy sanctuary, O Lord, which thy hands have established."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Dominus regnabit in aeternum et ultra"
      en: "The Lord shall reign for ever and ever."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ingressus est enim equus Pharao cum curribus et equitibus eius in mare et reduxit super eos Dominus aquas maris filii autem Israhel ambulaverunt per siccum in medio eius"
      en: "For Pharao went in on horseback with his chariots and horsemen into the sea: and the Lord brought back upon them the waters of the sea: but the children of Israel walked on dry ground in the midst thereof."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "sumpsit ergo Maria prophetis soror Aaron tympanum in manu egressaeque sunt omnes mulieres post eam cum tympanis et choris"
      en: "So Mary the prophetess, the sister of Aaron, took a timbrel in her hand: and all the women went forth after her with timbrels and with dances:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quibus praecinebat dicens cantemus Domino gloriose enim magnificatus est equum et ascensorem eius deiecit in mare"
      en: "And she began the song to them, saying: Let us sing to the Lord, for he is gloriously magnified, the horse and his rider he hath thrown into the sea."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "tulit autem Moses Israhel de mari Rubro et egressi sunt in desertum Sur ambulaveruntque tribus diebus per solitudinem et non inveniebant aquam"
      en: "And Moses brought Israel from the Red Sea, and they went forth into the wilderness of Sur: and they marched three days through the wilderness, and found no water."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et venerunt in Marath nec poterant bibere aquas de Mara eo quod essent amarae unde et congruum loco nomen inposuit vocans illud Mara id est amaritudinem"
      en: "And they came into Mara, and they could not drink the waters of Mara, because they were bitter: whereupon he gave a name also agreeable to the place, calling it Mara, that is, bitterness."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et murmuravit populus contra Mosen dicens quid bibemus"
      en: "And the people murmured against Moses, saying: What shall we drink?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "at ille clamavit ad Dominum qui ostendit ei lignum quod cum misisset in aquas in dulcedinem versae sunt ibi constituit ei praecepta atque iudicia et ibi temptavit eum"
      en: "But he cried to the Lord, and he shewed him a tree, which when he had cast into the waters, they were turned into sweetness. There he appointed him ordinances, and judgments, and there he proved him,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dicens si audieris vocem Domini Dei tui et quod rectum est coram eo feceris et oboedieris mandatis eius custodierisque omnia praecepta illius cunctum languorem quem posui in Aegypto non inducam super te ego enim Dominus sanator tuus"
      en: "Saying: If thou wilt hear the voice of the Lord thy God, and do what is right before him, and obey his commandments, and keep all his precepts, none of the evils that I laid upon Egypt, will I bring upon thee: for I am the Lord thy healer."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "venerunt autem in Helim ubi erant duodecim fontes aquarum et septuaginta palmae et castrametati sunt iuxta aquas"
      en: "And the children of Israel came into Elim, where there were twelve fountains of water, and seventy palm trees: and they encamped by the waters."
    status: { la: verified, en: verified }
