# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 19
verses:
  - n: 1
    text:
      la: "Haec dicit Dominus: Vade, et accipe lagunculam figuli testeam a senioribus populi, et a senioribus sacerdotum,"
      en: "Thus saith the Lord: Go, and take a potter's earthen bottle, and take of the ancients of the people, and of the ancients of the priests:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et egredere ad vallem filii Ennom, quae est juxta introitum portae fictilis: et praedicabis ibi verba quae ego loquar ad te."
      en: "And go forth into the valley of the son of Ennom, which is by the entry of the earthen gate: and there thou shalt proclaim the words that I shall tell thee."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dices: Audite verbum Domini, reges Juda, et habitatores Jerusalem: Haec dicit Dominus exercituum, Deus Israel: Ecce ego inducam afflictionem super locum istum, ita ut omnis qui audierit illam tinniant aures ejus,"
      en: "And thou shalt say: Hear the word of the Lord, O ye kings of Juda, and ye inhabitants of Jerusalem: Thus saith the Lord of hosts, the God of Israel: Behold I will bring an affliction upon this place: so that whoever shall hear it, his ears shall tingle:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "eo quod dereliquerint me, et alienum fecerint locum istum, et libaverunt in eo diis alienis, quos nescierunt, ipsi et patres eorum, et reges Juda, et repleverunt locum istum sanguine innocentum:"
      en: "Because they have forsaken me, and have profaned this place: and have sacrificed therein to strange gods, whom neither they nor their fathers knew, nor the kings of Juda: and they have filled this place with the blood of innocents."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et aedificaverunt excelsa Baalim, ad comburendos filios suos igni in holocaustum Baalim: quae non praecepi, nec locutus sum, nec ascenderunt in cor meum."
      en: "And they have built the high places of Baalim, to burn their children with fire for a holocaust to Baalim: which I did not command, nor speak of, neither did it once come into my mind."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Propterea ecce dies veniunt, dicit Dominus, et non vocabitur amplius locus iste Topheth, et vallis filii Ennom, sed vallis occisionis."
      en: "Therefore behold the days come, saith the Lord, that this place shall no more be called Topheth, nor the valley of the son of Ennom, but the valley of slaughter."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et dissipabo consilium Juda et Jerusalem in loco isto: et subvertam eos gladio in conspectu inimicorum suorum, et in manu quaerentium animas eorum: et dabo cadavera eorum escam volatilibus caeli et bestiis terrae."
      en: "And I will defeat the counsel of Juda and of Jerusalem in this place: and I will destroy them with the sword in the sight of their enemies, and by the hands of them that seek their lives: and I will give their carcasses to be meat for the fowls of the air, and for the beasts of the earth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ponam civitatem hanc in stuporem, et in sibilum: omnis qui praeterierit per eam obstupescet, et sibilabit super universa plaga ejus."
      en: "And I will make this city an astonishent, and a hissing: every one that shall pass by it, shall be astonished, and shall hiss because of all the plagues thereof."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et cibabo eos carnibus filiorum suorum, et carnibus filiarum suarum: et unusquisque carnem amici sui comedet in obsidione, et in angustia in qua concludent eos inimici eorum, et qui quaerunt animas eorum."
      en: "And I will feed them with the flesh of their sons, and with the flesh of their daughters: and they shall eat every one the flesh of his friend in the siege, and in the distress wherewith their enemies, and they that seek their lives shall straiten them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et conteres lagunculam in oculis virorum qui ibunt tecum,"
      en: "And thou shalt break the bottle in the sight of the men that shall go with thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dices ad eos: Haec dicit Dominus exercituum: Sic conteram populum istum, et civitatem istam, sicut conteritur vas figuli, quod non potest ultra instaurari: et in Topheth sepelientur, eo quod non sit alius locus ad sepeliendum."
      en: "And thou shalt say to them: Thus saith the Lord of hosts: even so will I break this people, and this city, as the potter's vessel is broken, which cannot be made whole again: and they shall be buried in Topheth, because there is no other place to bury in."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sic faciam loco huic, ait Dominus, et habitatoribus ejus, et ponam civitatem istam sicut Topheth."
      en: "Thus will I do to this place, saith the Lord, and to the inhabitants thereof: and I will make this city as Topheth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et erunt domus Jerusalem, et domus regum Juda, sicut locus Topheth, immundae, omnes domus in quarum domatibus sacrificaverunt omni militiae caeli, et libaverunt libamina diis alienis."
      en: "And the houses of Jerusalem, and the houses of the kings of Juda shall be unclean as the place of Topheth: all the houses upon whose roofs they have sacrificed to all the host of heaven, and have poured out drink offerings to strange gods."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Venit autem Jeremias de Topheth, quo miserat eum Dominus ad prophetandum, et stetit in atrio domus Domini, et dixit ad omnem populum:"
      en: "Then Jeremias came from Topheth, whither the Lord had sent him to prophecy, and he stood in the court of the house of the Lord, and said to all the people:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Haec dicit Dominus exercituum, Deus Israel: Ecce ego inducam super civitatem hanc, et super omnes urbes ejus, universa mala quae locutus sum adversum eam, quoniam induraverunt cervicem suam ut non audirent sermones meos."
      en: "Thus saith the Lord of hosts, the God of Israel: Behold I will bring in upon this city, and upon all the cities thereof all the evils that I have spoken against it: because they have hardened their necks, that they might not hear my words."
    status: { la: verified, en: verified }
