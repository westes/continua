# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 3reg
chapter: 6
verses:
  - n: 1
    text:
      la: "factum est igitur quadringentesimo et octogesimo anno egressionis filiorum Israhel de terra Aegypti in anno quarto mense zio ipse est mensis secundus regis Salomonis super Israhel aedificare coepit domum Domino"
      en: "And it came to pass in the four hundred and eightieth year after the children of Israel came out of the land of Egypt, in the fourth year of the reign of Solomon over Israel, in the month Zio (the same is the second month), he began to build a house to the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "domus autem quam aedificabat rex Salomon Domino habebat sexaginta cubitos in longitudine et viginti cubitos in latitudine et triginta cubitos in altitudine"
      en: "And the house, which king Solomon built to the Lord, was threescore cubits in length, and twenty cubits in breadth, and thirty cubits in height."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et porticus erat ante templum viginti cubitorum longitudinis iuxta mensuram latitudinis templi et habebat decem cubitos latitudinis ante faciem templi"
      en: "And there was a porch before the temple of twenty cubits in length, according to the measure of the breadth of the temple: and it was ten cubits in breadth before the face of the temple."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "fecitque in templo fenestras obliquas"
      en: "And he made in the temple oblique windows."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et aedificavit super parietem templi tabulata per gyrum in parietibus domus per circuitum templi et oraculi et fecit latera in circuitu"
      en: "And upon the wall of the temple he built floors round about, in the walls of the house round about the temple and the oracle, and he made sides round about."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tabulatum quod subter erat quinque cubitos habebat latitudinis et medium tabulatum sex cubitorum latitudinis et tertium tabulatum septem habens cubitos latitudinis trabes autem posuit in domo per circuitum forinsecus ut non hererent muris templi"
      en: "The floor that was underneath, was five cubits in breadth, and the middle floor was six cubits in breadth, and the third door was seven cubits in breadth. And he put beams in the house round about on the outside, that they might not be fastened in the walls of the temple."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "domus autem cum aedificaretur lapidibus dedolatis atque perfectis aedificata est et malleus et securis et omne ferramentum non sunt audita in domo cum aedificaretur"
      en: "And the house, when it was in building, was built of stones hewed and made ready: so that there was neither hammer nor axe nor any tool of iron heard in the house when it was in building."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ostium lateris medii in parte erat domus dexterae et per cocleam ascendebant in medium cenaculum et a medio in tertium"
      en: "The door for the middle side was on the right hand of the house : and by winding stairs they went up to the middle room, and from the middle to the third."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et aedificavit domum et consummavit eam texit quoque domum laquearibus cedrinis"
      en: "So he built the house, and finished it: end he covered the house with roofs of cedar."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et aedificavit tabulatum super omnem domum quinque cubitis altitudinis et operuit domum lignis cedrinis"
      en: "And he built a floor over all the house five cubits in height, and he covered the house with timber of cedar."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et factus est sermo Domini ad Salomonem dicens"
      en: "And the word of the Lord came to Solomon, saying:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "domus haec quam aedificas si ambulaveris in praeceptis meis et iudicia mea feceris et custodieris omnia mandata mea gradiens per ea firmabo sermonem meum tibi quem locutus sum ad David patrem tuum"
      en: "This house, which thou buildest, if thou wilt walk in my statutes, and execute my judgments, and keep all my commandments, walking in them, I will fulfil my word to thee which I spoke to David thy father."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et habitabo in medio filiorum Israhel et non derelinquam populum meum Israhel"
      en: "And I will dwell in the midst of the children of Israel, and will not forsake my people Israel."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "igitur aedificavit Salomon domum et consummavit eam"
      en: "So Solomon built the house and finished it."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et aedificavit parietes domus intrinsecus tabulatis cedrinis a pavimento domus usque ad summitatem parietum et usque ad laquearia operuit lignis intrinsecus et texit pavimentum domus tabulis abiegnis"
      en: "And he built the walls of the house on the inside, with boards of cedar, from the floor of the house to the top of the walls, and to the roots, he covered it with boards of cedar on the inside: and he covered the floor of the house with planks of fir."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "aedificavitque viginti cubitorum ad posteriorem partem templi tabulata cedrina a pavimento usque ad superiora et fecit interiorem domum oraculi in sanctum sanctorum"
      en: "And he built up twenty cubits with boards of cedar at the hinder part of the temple, from the floor to the top: and made the inner house of the oracle to be the holy of holies."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "porro quadraginta cubitorum erat ipsum templum pro foribus oraculi"
      en: "And the temple itself before the doors of the oracle was forty cubits long."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et cedro omnis domus intrinsecus vestiebatur habens tornaturas suas et iuncturas fabrefactas et celaturas eminentes omnia cedrinis tabulis vestiebantur nec omnino lapis apparere poterat in pariete"
      en: "And all the house was covered within with cedar, having the turnings, and the joints thereof artfully wrought and carvings projecting out: all was covered with boards of cedar: and no stone could be seen in the wall at all."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "oraculum autem in medio domus in interiori parte fecerat ut poneret ibi arcam foederis Domini"
      en: "And he made the oracle in the midst of the house, in the inner part, to set there the ark of the covenant of the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "porro oraculum habebat viginti cubitos longitudinis et viginti cubitos latitudinis et viginti cubitos altitudinis et operuit illud atque vestivit auro purissimo sed et altare vestivit cedro"
      en: "Now the oracle was twenty cubits in length, and twenty cubits in breadth, and twenty cubits in height. And he covered and overlaid it with most pure gold. And the altar also he covered with cedar."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "domum quoque ante oraculum operuit auro purissimo et adfixit lamminas clavis aureis"
      en: "And the house before the oracle he overlaid with most pure gold, and fastened on the plates with nails of gold."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "nihilque erat in templo quod non auro tegeretur sed et totum altare oraculi texit auro"
      en: "And there was nothing in the temple that was not covered with gold: the whole altar of the oracle he covered also with gold."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et fecit in oraculo duo cherubin de lignis olivarum decem cubitorum altitudinis"
      en: "And he made in the oracle two cherubims of olive tree, of ten cubits in height."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quinque cubitorum ala cherub una et quinque cubitorum ala cherub altera id est decem cubitos habentes a summitate alae usque ad alae alterius summitatem"
      en: "One wing of the cherub was five cubits, and the other wing of the cherub was five cubits: that is, in all ten cubits, from the extremity of one wing to the extremity of the other wing."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "decem quoque cubitorum erat cherub secundus mensura pari et opus unum erat in duobus cherubin"
      en: "The second cherub also was ten cubits: and the measure, and the work was the same in both the cherubims:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "id est altitudinem habebat unus cherub decem cubitorum et similiter cherub secundus"
      en: "That is to say, one cherub was ten cubits high, and in like manner the other cherub."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "posuitque cherubin in medio templi interioris extendebant autem alas suas cherubin et tangebat ala una parietem et ala cherub secundi tangebat parietem alterum alae autem alterae in media parte templi se invicem contingebant"
      en: "And he set the cherubims in the midst of the inner temple: and the cherubims stretched forth their wings, and the wing of the one touched one wall, and the wing of the other cherub touched the other wall: and the other wings in the midst of the temple touched one another."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "texit quoque cherubin auro"
      en: "And he overlaid the cherubims with gold."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et omnes parietes templi per circuitum scalpsit variis celaturis et torno et fecit in eis cherubin et palmas et picturas varias quasi prominentes de pariete et egredientes"
      en: "And all the walls of the temple round about he carved with divers figures and carvings: and he made in them cherubims and palm trees, and divers representations, as it were standing out, and coming forth from the wall."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "sed et pavimentum domus texit auro intrinsecus et extrinsecus"
      en: "And the floor of the house he also overlaid with gold within and without."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et in ingressu oraculi fecit ostiola de lignis olivarum postesque angulorum quinque"
      en: "And in the entrance of the oracle he made little doors of olive tree, and posts of five corners,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et duo ostia de lignis olivarum et scalpsit in eis picturam cherubin et palmarum species et anaglyfa valde prominentia et texit ea auro et operuit tam cherubin quam palmas et cetera auro"
      en: "And two doors of olive tree: and he carved upon them figures of cherubims, and figures of palm trees, and carvings very much projecting: and he overlaid them with gold: and he covered both the cherubims and the palm trees, and the other things with gold."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "fecitque in introitum templi postes de lignis olivarum quadrangulatos"
      en: "And he made in the entrance of the temple posts of olive tree foursquare:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et duo ostia de lignis abiegnis altrinsecus et utrumque ostium duplex erat et se invicem tenens aperiebatur"
      en: "And two doors of fir tree, one of each side : and each door was double, and so opened with folding leaves."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et scalpsit cherubin et palmas et celaturas valde eminentes operuitque omnia lamminis aureis opere quadro ad regulam"
      en: "And he carved cherubims, and palm trees, and carved work standing very much out: and he overlaid all with golden plates in square work by rule."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et aedificavit atrium interius tribus ordinibus lapidum politorum et uno ordine lignorum cedri"
      en: "And he built the inner court with three rows of polished stones, and one row of beams of cedar."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "anno quarto fundata est domus Domini in mense zio"
      en: "In the fourth year was the house of the Lord founded in the month Zio:"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et in anno undecimo mense bul ipse est mensis octavus perfecta est domus in omni opere suo et in universis utensilibus aedificavitque eam annis septem"
      en: "And in the eleventh year in the month Bul (which is the eighth month) the house was finished in all the works thereof, and in all the appurtenances thereof: and he was seven years in building it."
    status: { la: verified, en: verified }
