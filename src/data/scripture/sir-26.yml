# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 26
verses:
  - n: 1
    text:
      la: "Mulieris bonae beatus vir: numerus enim annorum illius duplex."
      en: "Happy is the husband of a good wife: for the number of his years is double."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Mulier fortis oblectat virum suum, et annos vitae illius in pace implebit."
      en: "A virtuous woman rejoiceth her husband: and shall fulfill the years of his life in peace."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Pars bona mulier bona, in parte timentium Deum dabitur viro pro factis bonis:"
      en: "A good wife is a good portion, she shall be given in the portion of them that fear God, to a man for his good deeds."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "divitis autem et pauperis cor bonum, in omni tempore vultus illorum hilaris."
      en: "Rich or poor, if his heart is good, his countenance shall be cheerful at all times."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "A tribus timuit cor meum, et in quarto facies mea metuit:"
      en: "Of three things my heart hath been afraid, and at the fourth my face hath trembled:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "delaturam civitatis, et collectionem populi:"
      en: "The accusation of a city, and the gathering together of the people:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "columniam mendacem super mortem omnia gravia:"
      en: "And a false calumny, all are more grievous than death."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dolor cordis et luctus, mulier zelotypa."
      en: "A jealous woman is the grief and mourning of the heart."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "In muliere zelotypa flagellum linguae, omnibus communicans."
      en: "With a jealous woman is a scourge of the tongue which communicateth with all."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Sicut boum jugum quod movetur, ita et mulier nequam: qui tenet illam quasi qui apprehendit scorpionem."
      en: "As a yoke of oxen that is moved to and fro, so also is a wicked woman: he that hath hold of her, is as he that taketh hold of a scorpion."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Mulier ebriosa ira magna, et contumelia: et turpitudo illius non tegetur."
      en: "A drunken woman is a great wrath: and her reproach and shame shall not be hid."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Fornicatio mulieris in extollentia oculorum, et in palpebris illius agnoscetur."
      en: "The fornication of a woman shall be known by the haughtiness of her eyes, and by her eyelids."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In filia non avertente se, firma custodiam, ne inventa occasione utatur se."
      en: "On a daughter that turneth not away herself, set a strict watch: lest finding an opportunity she abuse herself."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ab omni irreverentia oculorum ejus cave, et ne mireris si te neglexerit."
      en: "Take heed of the impudence of her eyes, and wonder not if she slight thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sicut viator sitiens ad fontem os aperiet, et ab omni aqua proxima bibet, et contra omnem palum sedebit, et contra omnem sagittam aperiet pharetram donec deficiat."
      en: "She will open her mouth as a thirsty traveller to the fountain, and will drink of every water near her, and will sit down by every hedge, and open her quiver against every arrow, until she fail."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Gratia mulieris sedulae delectabit virum suum, et ossa illius impinguabit."
      en: "The grace of a diligent woman shall delight her husband, and shall fat his bones."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Disciplina illius datum Dei est."
      en: "Her discipline is the gift of God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Mulier sensata et tacita, non est immutatio eruditae animae."
      en: "Such is a wise and silent woman, and there is nothing so much worth as a well instructed soul."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Gratia super gratiam mulier sancta et pudorata."
      en: "A holy and shamefaced woman is grace upon grace."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Omnis autem ponderatio non est digna continentis animae."
      en: "And no price is worthy of a continent soul."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Sicut sol oriens mundo in altissimis Dei, sic mulieris bonae species in ornamentum domus ejus."
      en: "As the sun when it riseth to the world in the high places of God, so is the beauty of a good wife for the ornament of her house."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Lucerna splendens super candelabrum sanctum, et species faciei super aetatem stabilem."
      en: "As the lamp shining upon the holy candlestick, so is the beauty of the face in a ripe age."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Columnae aureae super bases argenteas, et pedes firmi super plantas stabilis mulieris."
      en: "As golden pillars upon bases of silver, so are the firm feet upon the soles of a steady woman."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Fundamenta aeterna supra petram solidam, et mandata Dei in corde mulieris sanctae."
      en: "As everlasting foundations upon a solid rock, so the commandments of God In the heart of a holy woman."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "In duobus contristatum est cor meum, et in tertio iracundia mihi advenit:"
      en: "At two things my heart is grieved, and the third bringeth anger upon me:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "vir bellator deficiens per inopiam; et vir sensatus contemptus;"
      en: "A man of war fainting through poverty: and a man of sense despised:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et qui transgreditur a justitia ad peccatum: Deus paravit eum ad rhomphaeam."
      en: "And he that passeth over from justice to sin, God hath prepared such an one for the sword."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Duae species difficiles et periculosae mihi apparuerunt: difficile exuitur negotians a negligentia, et non justificabitur caupo a peccatis labiorum."
      en: "Two sorts of callings have appeared to me hard and dangerous: a merchant is hardly free from negligence: and a huckster shall not be justified from the sins of the lips."
    status: { la: verified, en: verified }
