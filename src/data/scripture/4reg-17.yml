# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 17
verses:
  - n: 1
    text:
      la: "Anno duodecimo Achaz regis Juda, regnavit Osee filius Ela in Samaria super Israel novem annis."
      en: "In the twelfth year of Achaz king of Juda, Osee the son of Ela reigned in Samaria over Israel nine years."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fecitque malum coram Domino: sed non sicut reges Israel, qui ante eum fuerant."
      en: "And he did evil before the Lord: but not as the kings of Israel that had been before him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Contra hunc ascendit Salmanasar rex Assyriorum, et factus est ei Osee servus, reddebatque illi tributa."
      en: "Against him came up Salmanasar king of the Assyrians, and Osee became his servant, and paid him tribute."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cumque deprehendisset rex Assyriorum Osee, quod rebellare nitens misisset nuntios ad Sua regem Aegypti, ne praestaret tributa regi Assyriorum sicut singulis annis solitus erat, obsedit eum, et vinctum misit in carcerem."
      en: "And when the king of the Assyrians found that Osee endeavouring to rebel had sent messengers to Sua the king of Egypt, that he might not pay tribute to the king of the Assyrians, as he had done every year, he besieged him, bound him, and cast him into prison,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Pervagatusque est omnem terram: et ascendens Samariam, obsedit eam tribus annis."
      en: "And he went through all the land: and going up to Samaria, he besieged it three years."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Anno autem nono Osee, cepit rex Assyriorum Samariam, et transtulit Israel in Assyrios: posuique eos in Hala, et in Habor juxta fluvium Gozan, in civitatibus Medorum."
      en: "And in the ninth year of Osee, the king of the Assyrians took Samaria, and carried Israel away to Assyria: and he placed them in Hala and Habor by the river of Gozan, in the cities of the Medes."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Factum est enim, cum peccassent filii Israel Domino Deo suo, qui eduxerat eos de terra Aegypti, de manu Pharaonis regis Aegypti, coluerunt deos alienos."
      en: "For so it was that the children of Israel had sinned against the Lord their God, who brought them out of the land of Egypt, from under the hand of Pharao king of Egypt, and they worshipped strange gods."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ambulaverunt juxta ritum gentium, quas consumpserat Dominus in conspectu filiorum Israel, et regum Israel, quia similiter fecerant."
      en: "And they walked according to the way of the nations which the Lord had destroyed in the sight of the children of Israel and of the kings of Israel: because they had done in like manner."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et offenderunt filii Israel verbis non rectis Dominum Deum suum: et aedificaverunt sibi excelsa in cunctis urbibus suis a turre custodum usque ad civitatem munitam."
      en: "And the children of Israel offended the Lord their God with things that were not right: and built them high places in all their cities from the tower of the watchmen to the fenced city."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Feceruntque sibi statuas, et lucos in omni colle sublimi, et subter omne lignum nemorosum:"
      en: "And they made them statues and groves on every high hill, and under every shady tree:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et adolebant ibi incensum super aras in morem gentium, quas transtulerat Dominus a facie eorum: feceruntque verba pessima irritantes Dominum."
      en: "And they burnt incense there upon altars after the manner of the nations which the Lord had removed from their face: and they did wicked things, provoking the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et coluerunt immunditias, de quibus praecepit eis Dominus ne facerent verbum hoc."
      en: "And they worshipped abominations, concerning which the Lord had commanded them that they should not do this thing."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et testificatus est Dominus in Israel et in Juda per manum omnium prophetarum et videntium, dicens: Revertimini a viis vestris pessimis, et custodite praecepta mea, et caeremonias juxta omnem legem, quam praecepi patribus vestris: et sicut misi ad vos in manu servorum meorum prophetarum."
      en: "And the Lord testified to them in Israel and in Juda by the hand of all the prophets and seers, saying: Return from your wicked ways, and keep my precepts, and ceremonies, according to all the law which I commanded your fathers: and as I have sent to you in the hand of my servants the prophets."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui non audierunt, sed induraverunt cervicem suam juxta cervicem patrum suorum, qui noluerunt obedire Domino Deo suo."
      en: "And they hearkened not, but hardened their necks like to the neck of their fathers, who would not obey the Lord their God."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et abjecerunt legitima ejus, et pactum, quod pepigit cum patribus eorum, et testificationes, quibus contestatus est eos: secutique sunt vanitates, et vane egerunt: et secuti sunt gentes, quae erant per circuitum eorum, super quibus praeceperat Dominus eis ut non facerent sicut et illae faciebant."
      en: "And they rejected his ordinances and the covenant that he made with their fathers, and the testimonies which he testified against them: and they followed vanities, and acted vainly: and they followed the nations that were round about them, concerning which the Lord had commanded them that they should not do as they did."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et dereliquerunt omnia praecepta Domini Dei sui: feceruntque sibi conflatiles duos vitulos, et lucos, et adoraverunt universam militiam caeli: servieruntque Baal,"
      en: "And they forsook all the precepts of the Lord their God: and made to themselves two molten calves, and groves, and adored all the host of heaven: and they served Baal."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et consecraverunt filios suos, et filias suas per ignem: et divinationibus inserviebant, et auguriis: et tradiderunt se ut facerent malum coram Domino, ut irritarent eum."
      en: "And consecrated their sons, and their daughters through fire: and they gave themselves to divinations, and soothsayings: and they delivered themselves up to do evil before the Lord, to provoke him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Iratusque est Dominus vehementer Israeli, et abstulit eos a conspectu suo, et non remansit nisi tribus Juda tantummodo."
      en: "And the Lord was very angry with Israel, and removed them from his sight, and there remained only the tribe of Juda."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sed nec ipse Juda custodivit mandata Domini Dei sui: verum ambulavit in erroribus Israel, quos operatus fuerat."
      en: "But neither did Juda itself keep the commandments of the Lord their God: but they walked in the errors of Israel, which they had wrought."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Projecitque Dominus omne semen Israel, et afflixit eos, et tradidit eos in manu diripientium, donec projiceret eos a facie sua:"
      en: "And the Lord cast off all the seed of Israel, and afflicted them and delivered them into the hand of spoilers, till he cast them away from his face:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ex eo jam tempore, quo scissus est Israel a domo David, et consituerunt sibi regem Jeroboam filium Nabat, separavit enim Jeroboam Israel a Domino, et peccare eos fecit peccatum magnum."
      en: "Even from that time, when Israel was rent from the house of David, and made Jeroboam son of Nabat their king: for Jeroboam separated Israel from the Lord, and made them commit a great sin."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ambulaverunt filii Israel in universis peccatis Jeroboam quae fecerat: et non recesserunt ab eis,"
      en: "And the children of Israel walked in all the sins of Jeroboam, which he had done: and they departed not from them,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "usquequo Dominus auferret Israel a facie sua, sicut locutus fuerat in manu omnium servorum suorum prophetarum: translatusque est Israel de terra sua in Assyrios, usque in diem hanc."
      en: "Till the Lord removed Israel from his face, as he had spoken in the hand of all his servants the prophets: and Israel was carried away out of their land to Assyria, unto this day."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Adduxit autem rex Assyriorum de Babylone, et de Cutha, et de Avah, et de Emath, et de Sepharvaim: et collocavit eos in civitatibus Samariae pro filiis Israel: qui possederunt Samariam, et habitaverunt in urbibus ejus."
      en: "And the king of the Assyrians brought people from Babylon, and from Cutha, and from Avah, and from Emath, and from Sepharvaim: and placed them in the cities of Samaria instead of the children of Israel: and they possessed Samaria, and dwelt in the cities thereof."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Cumque ibi habitare coepissent, non timebant Dominum: et immisit in eos Dominus leones, qui interficiebant eos."
      en: "And when they began to dwell there, they feared not the Lord: and the Lord sent lions among them, which killed them."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Nuntiatumque est regi Assyriorum, et dictum: Gentes, quas transtulisti, et habitare fecisti in civitatibus Samariae, ignorant legitima Dei terrae: et immisit in eos Dominus leones, et ecce interficiunt eos, eo quod ignorent ritum Dei terrae."
      en: "And it was told the king of the Assyrians, and it was said: The nations which thou hast removed, and made to dwell in the cities of Samaria, know not the ordinances of the God of the land: and the Lord hath sent lions among them: and behold they kill them, because they know not the manner of the God of the land."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Praecepit autem rex Assyriorum, dicens: Ducite illuc unum de sacerdotibus, quos inde captivos adduxistis, et vadat, et habitet cum eis: et doceat eos legitima Dei terrae."
      en: "And the king of the Assyrians commanded, saying: Carry thither one of the priests whom you brought from thence captive, and let him go, and dwell with them: and let him teach them the ordinances of the God of the land."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Igitur cum venisset unus de sacerdotibus his, qui captivi ducti fuerant de Samaria, habitavit in Bethel, et docebat eos quomodo colerent Dominum."
      en: "So one of the priests who had been carried away captive from Samaria, came and dwelt in Bethel, and taught them how they should worship the Lord."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et unaquaeque gens fabricata est deum suum: posueruntque eos in fanis excelsis, quae fecerant Samaritae, gens et gens in urbibus suis, in quibus habitabat."
      en: "And every nation made gods of their own, and put them in the temples of the high places, which the Samaritans had made, every nation in their cities where they dwelt."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Viri enim Babylonii fecerunt Sochothbenoth: viri autem Cuthaei fecerunt Nergel: et viri de Emath fecerunt Asima."
      en: "For the men of Babylon made Sochothbenoth: and the Cuthites made Nergel: and the men of Emath made Asima."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Porro Hevaei fecerunt Nebahaz et Tharthac. Hi autem qui erant de Sepharvaim, comburebant filios suos igni, Adramelech et Anamlech diis Sepharvaim,"
      en: "And the Hevites made Nebahaz and Tharthac. And they that were of Sepharvaim burnt their children in fire, to Adramelech and Anamelech the gods of Sepharvaim."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et nihilominus colebant Dominum. Fecerunt autem sibi de novissimis sacerdotes excelsorum, et ponebant eos in fanis sublimibus."
      en: "And nevertheless they worshipped the Lord. And they made to themselves, of the lowest of the people, priests of the high places, and they placed them in the temples of the high places."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et cum Dominum colerent, diis quoque suis serviebant juxta consuetudinem gentium, de quibus translati fuerant Samariam."
      en: "And when they worshipped the Lord, they served also their own gods according to the custom of the nations out of which they were brought to Samaria:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Usque in praesentem diem morem sequuntur antiquum: non timent Dominum, neque custodiunt caeremonias ejus, judicia, et legem, et mandatum, quod praeceperat Dominus filiis Jacob, quem cognominavit Israel:"
      en: "Unto this day they followed the old manner: they fear not the Lord, neither do they keep his ceremonies, and judgments, and law, and the commandment, which the Lord commanded the children of Jacob, whom he surnamed Israel:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "et percusserat cum eis pactum, et mandaverat eis, dicens: Nolite timere deos alienos, et non adoretis eos, neque colatis eos, et non immoletis eis:"
      en: "With whom he made a covenant, and charged them, saying: You shall not fear strange gods, nor shall you adore them, nor worship them, nor sacrifice to them."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "sed Dominum Deum vestrum, qui eduxit vos de terra Aegypti in fortitudine magna, et in brachio extento, ipsum timete, et illum adorate, et ipsi immolate."
      en: "But the Lord your God, who brought you out of the land of Egypt with great power, and a stretched out arm, him shall you fear, and him shall you adore, and to him shall you sacrifice."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Caeremonias quoque, et judicia, et legem, et mandatum, quod scripsit vobis, custodite ut faciatis cunctis diebus: et non timeatis deos alienos."
      en: "And the ceremonies, and judgments, and law, and the commandment, which he wrote for you, you shall observe to do them always: and you shall not fear strange gods."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et pactum quod percussit vobiscum, nolite oblivisci: nec colatis deos alienos,"
      en: "And the covenant that he made with you, you shall not forget: neither shall ye worship strange gods,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "sed Dominum Deum vestrum timete, et ipse eruet vos de manu omnium inimicorum vestrorum."
      en: "But fear the Lord your God, and he shall deliver you out of the hand of all your enemies."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Illi vero non audierunt, sed juxta consuetudinem suam pristinam perpetrabant."
      en: "But they did not hearken, but did according to their old custom."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Fuerunt igitur gentes istae timentes quidem Dominum, sed nihilominus et idolis suis servientes: nam et filii eorum, et nepotes, sicut fecerunt patres sui, ita faciunt usque in praesentem diem."
      en: "So these nations feared the Lord, but nevertheless served also their idols: their children also and grandchildren, as their fathers did, so do they unto this day."
    status: { la: verified, en: verified }
