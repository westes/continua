book: 2reg
chapter: 23
verses:
  - n: 1
    text:
      la: "haec autem sunt verba novissima quae dixit David filius Isai dixit vir cui constitutum est de christo Dei Iacob egregius psalta Israhel"
      en: "Now these are David's last words. David the son of Isai said: The man to whom it was appointed concerning the Christ of the God of Jacob, the excellent psalmist of Israel said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "spiritus Domini locutus est per me et sermo eius per linguam meam"
      en: "The spirit of the Lord hath spoken by me and his word by my tongue."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixit Deus Israhel mihi locutus est Fortis Israhel dominator hominum iustus dominator in timore Dei"
      en: "The God of Israel said to me, the strong one of Israel spoke, the ruler of men, the just ruler in the fear of God."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sicut lux aurorae oriente sole mane absque nubibus rutilat et sicut pluviis germinat herba de terra"
      en: "As the light of the morning, when the sun riseth, shineth in the morning without clouds, and as the grass springeth out of the earth by rain."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "nec tanta est domus mea apud Deum ut pactum aeternum iniret mecum firmum in omnibus atque munitum cuncta enim salus mea et omnis voluntas nec est quicquam ex ea quod non germinet"
      en: "Neither is my house so great with God, that he should make with me an eternal covenant, firm in all things and assured. For he is all my salvation, and all my will: neither is there ought thereof that springeth not up."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "praevaricatores autem quasi spinae evellentur universi quae non tolluntur manibus"
      en: "But transgressors shall all of them be plucked up as thorns: which are not taken away with hands."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et si quis tangere voluerit eas armabitur ferro et ligno lanceato igneque succensae conburentur usque ad nihilum"
      en: "And if a man will touch them, he must be armed with iron and with the staff of a lance: but they shall be set on fire and burnt to nothing."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "haec nomina fortium David Sedens in cathedra sapientissimus princeps inter tres ipse est quasi tenerrimus ligni vermiculus qui octingentos interfecit impetu uno"
      en: "These are the names of the valiant men of David. Jesbaham sitting in the chair was the wisest chief among the three, he was like the most tender little worm of the wood, who killed eight hundred men at one onset."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "post hunc Eleazar filius patrui eius Ahoi inter tres fortes qui erant cum David quando exprobraverunt Philisthim et congregati sunt illuc in proelium"
      en: "After him was Eleazar the son of Dodo the Ahohite, one of the three valiant men that were with David when they defied the Philistines, and they were there gathered together to battle."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque ascendissent viri Israhel ipse stetit et percussit Philistheos donec deficeret manus eius et obrigesceret cum gladio fecitque Dominus salutem magnam in die illa et populus qui fugerat reversus est ad caesorum spolia detrahenda"
      en: "And when the men of Israel were gone away, he stood and smote the Philistines till his hand was weary, and grew stiff with the sword: and the Lord wrought a great victory that day: and the people that were fled away, returned to take spoils of them that were slain."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et post hunc Semma filius Age de Arari et congregati sunt Philisthim in statione erat quippe ibi ager plenus lente cumque fugisset populus a facie Philisthim"
      en: "And after him was Semma the son of Age of Arari. And the Philistines were gathered together in a troop: for there was a field full of lentils. And when the people were fled from the face of the Philistines,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "stetit ille in medio agri et tuitus est eum percussitque Philistheos et fecit Dominus salutem magnam"
      en: "He stood in the midst of the field, and defended it, and defeated the Philistines: and the Lord gave a great victory."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "necnon ante descenderant tres qui erant principes inter triginta et venerant tempore messis ad David in speluncam Odollam castra autem Philisthim erant posita in valle Gigantum"
      en: "Moreover also before this the three who were princes among the thirty, went down and came to David in the harvest time into the cave of Odollam: and the camp of the Philistines was in the valley of the giants."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et David erat in praesidio porro statio Philisthinorum tunc erat in Bethleem"
      en: "And David was then in a hold. and there was a garrison of the Philistines then in Bethlehem."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "desideravit igitur David et ait si quis mihi daret potum aquae de cisterna quae est in Bethleem iuxta portam"
      en: "And David longed, and said: O that some man would get me a drink of the water out of the cistern, that is in Bethlehem, by the gate."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "inruperunt ergo tres fortes castra Philisthinorum et hauserunt aquam de cisterna Bethleem quae erat iuxta portam et adtulerunt ad David at ille noluit bibere sed libavit illam Domino"
      en: "And the three valiant men broke through the camp of the Philistines, and drew water out of the cistern of Bethlehem, that was by the gate, and brought it to David: but he would not drink, but offered it to the Lord,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "dicens propitius mihi sit Dominus ne faciam hoc num sanguinem hominum istorum qui profecti sunt et animarum periculum bibam noluit ergo bibere haec fecerunt tres robustissimi"
      en: "Saying: The Lord be merciful to me, that I may not do this: shall I drink the blood of these men that went, and the peril of their lives? therefore he would not drink. These things did these three mighty men."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Abisai quoque frater Ioab filius Sarviae princeps erat de tribus ipse est qui elevavit hastam suam contra trecentos quos interfecit nominatus in tribus"
      en: "Abisai also the brother of Joab, the son of Sarvia, was chief among three: and he lifted up his spear against three hundred whom he slew, and he was renowned among the three,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et inter tres nobilior eratque eorum princeps sed usque ad tres primos non pervenerat"
      en: "And the noblest of three, and was their chief, but to the three first he attained not."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et Banaias filius Ioiada viri fortissimi magnorum operum de Capsehel ipse percussit duos leones Moab et ipse descendit et percussit leonem in media cisterna diebus nivis"
      en: "And Banaias the son of Joiada a most valiant man, of great deeds, of Cabseel: he slew the two lions of Moab, and he went down, and slew a lion in the midst of a pit, in the time of snow."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ipse quoque interfecit virum aegyptium virum dignum spectaculo habentem in manu hastam itaque cum descendisset ad eum in virga vi extorsit hastam de manu Aegyptii et interfecit eum hasta sua"
      en: "He also slew an Egyptian, a man worthy to be a sight, having a spear in his hand: but he went down to him with a rod, and forced the spear out of the hand of the Egyptian, and slew him with his own spear."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "haec fecit Banaias filius Ioiadae"
      en: "These things did Banaias the son of Joiada."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et ipse nominatus inter tres robustos qui erant inter triginta nobiliores verumtamen usque ad tres non pervenerat fecitque eum David sibi auricularium a secreto"
      en: "And he was renowned among the three valiant men, who were the most honourable among the thirty: but he attained riot to the first three: and David made him of his privy council."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Asahel frater Ioab inter triginta Eleanan filius patrui eius de Bethleem"
      en: "Asael the brother of Joab was one of the thirty, Elehanan the son of Dodo of Bethlehem."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Semma de Arari Helica de Arodi"
      en: "Semma of Harodi, Elica of Harodi,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Helas de Felthi Hira filius Aces de Thecua"
      en: "Heles of Phalti, Hira the son of Acces of Thecua,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Abiezer de Anathoth Mobonnai de Usathi"
      en: "Abiezer of Anathoth, Mobonnai of Husati,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Selmon Aohites Maharai Netophathites"
      en: "Selmon the Ahohite, Maharai the Netophathite,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Heled filius Banaa et ipse Netophathites Hithai filius Ribai de Gebeeth filiorum Beniamin"
      en: "Heled the son of Baana, also a Netophathite, Ithai the son of Ribai of Gabaath of the children of Benjamin,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Banahi Aufrathonites Heddai de torrente Gaas"
      en: "Banaia the Pharathonite, Heddai of the torrent Gaas,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Abialbon Arbathites Azmaveth de Beromi"
      en: "Abialbon the Arbathite, Azmaveth of Beromi,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Eliaba de Salboni filii Iasen Ionathan"
      en: "Eliaba of Salaboni. The sons of Jassen, Jonathan,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Semma de Horodi Haiam filius Sarar Arorites"
      en: "Semma of Orori, Aliam the son of Sarar the Arorite,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Elifeleth filius Aasbai filii Maachathi Heliam filius Ahitofel Gelonites"
      en: "Eliphelet the son of Aasbai the son of Machati, Eliam the son of Achitophel the Gelonite,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Esrai de Carmelo Farai de Arbi"
      en: "Hesrai of Carmel, Pharai of Arbi,"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Igaal filius Nathan de Soba Bonni de Gaddi"
      en: "Igaal the son of Nathan of Soba, Bonni of Gadi,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Selech de Ammoni Naharai Berothites armiger Ioab filii Sarviae"
      en: "Selec of Ammoni, Naharai the Berothite, armourbearer of Joab the son of Sarvia,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Hira Hiethrites Gareb et ipse Hiethrites"
      en: "Ira the Jethrite, Gareb also a Jethrite;"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Urias Hettheus omnes triginta septem"
      en: "Urias the Hethite, thirty and seven in all."
    status: { la: verified, en: verified }
