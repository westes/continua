# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1thess
chapter: 4
verses:
  - n: 1
    text:
      la: "De cetero ergo, fratres, rogamus vos et obsecramus in Domino Jesu, ut quemadmodum accepistis a nobis quomodo oporteat vos ambulare, et placere Deo, sic et ambuletis ut abundetis magis."
      en: "For the rest therefore, brethren, we pray and beseech you in the Lord Jesus, that as you have received from us, how you ought to walk, and to please God, so also you would walk, that you may abound the more."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Scitis enim quae praecepta dederim vobis per Dominum Jesum."
      en: "For you know what precepts I have given to you by the Lord Jesus."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Haec est enim voluntas Dei, sanctificatio vestra: ut abstineatis vos a fornicatione,"
      en: "For this is the will of God, your sanctification; that you should abstain from fornication;"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ut sciat unusquisque vestrum vas suum possidere in sanctificatione, et honore:"
      en: "That every one of you should know how to possess his vessel in sanctification and honour:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non in passione desiderii, sicut et gentes, quae ignorant Deum:"
      en: "Not in the passion of lust, like the Gentiles that know not God:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ne quis supergrediatur, neque circumveniat in negotio fratrem suum: quoniam vindex est Dominus de his omnibus, sicut praediximus vobis, et testificati sumus."
      en: "And that no man overreach, nor circumvent his brother in business: because the Lord is the avenger of all these things, as we have told you before, and have testified."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Non enim vocavit nos Deus in immunditiam, sed in sanctificationem."
      en: "For God hath not called us unto uncleanness, but unto sanctification."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Itaque qui haec spernit, non hominem spernit, sed Deum: qui etiam dedit Spiritum suum Sanctum in nobis."
      en: "Therefore, he that despiseth these things, despiseth not man, but God, who also hath given his holy Spirit in us."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "De caritate autem fraternitatis non necesse habemus scribere vobis: ipsi enim vos a Deo didicistis ut diligatis invicem."
      en: "But as touching the charity of brotherhood, we have no need to write to you: for yourselves have learned of God to love one another."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Etenim illud facitis in omnes fratres in universa Macedonia. Rogamus autem vos, fratres, ut abundetis magis,"
      en: "For indeed you do it towards all the brethren in all Macedonia. But we entreat you, brethren, that you abound more:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et opera detis ut quieti sitis, et ut vestrum negotium agatis, et operemini manibus vestris, sicut praecepimus vobis: et ut honeste ambuletis ad eos qui foris sunt: et nullius aliquid desideretis."
      en: "And that you use your endeavour to be quiet, and that you do your own business, and work with your own hands, as we commanded you: and that you walk honestly towards them that are without; and that you want nothing of any man's."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Nolumus autem vos ignorare fratres de dormientibus, ut non contristemini sicut et ceteri, qui spem non habent."
      en: "And we will not have you ignorant, brethren, concerning them that are asleep, that you be not sorrowful, even as others who have no hope."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si enim credimus quod Jesus mortuus est, et resurrexit: ita et Deus eos qui dormierunt per Jesum, adducet cum eo."
      en: "For if we believe that Jesus died, and rose again; even so them who have slept through Jesus, will God bring with him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Hoc enim vobis dicimus in verbo Domini, quia nos, qui vivimus, qui residui sumus in adventum Domini, non praeveniemus eos qui dormierunt."
      en: "For this we say unto you in the word of the Lord, that we who are alive, who remain unto the coming of the Lord, shall not prevent them who have slept."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quoniam ipse Dominus in jussu, et in voce archangeli, et in tuba Dei descendet de caelo: et mortui, qui in Christo sunt, resurgent primi."
      en: "For the Lord himself shall come down from heaven with commandment, and with the voice of an archangel, and with the trumpet of God: and the dead who are in Christ, shall rise first."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Deinde nos, qui vivimus, qui relinquimur, simul rapiemur cum illis in nubibus obviam Christo in aera, et sic semper cum Domino erimus."
      en: "Then we who are alive, who are left, shall be taken up together with them in the clouds to meet Christ, into the air, and so shall we be always with the Lord."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Itaque consolamini invicem in verbis istis."
      en: "Wherefore, comfort ye one another with these words."
    status: { la: verified, en: verified }
