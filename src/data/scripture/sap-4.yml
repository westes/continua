# Book of Wisdom (Vulgate "Liber Sapientiæ," cited "Sap"), chapter 4.
# Verses 7-20 only -- transcribed from what was already pulled for the
# Assumption's octave day 6 Matins reading (Divinum Officium, Monastic
# Tridentinum 1617, live prayMatutinum query 2025-08-20), not the whole
# chapter. Verse 14 and verse 19 each appear twice in the source itself (a
# genuine Vulgate numbering quirk, not a transcription error) -- kept as
# two separate entries each, in original order, rather than merged or
# renumbered.
book: sap
chapter: 4
verses:
  - n: 7
    text:
      la: "Justus si morte præoccupátus fúerit, in refrigério erit;"
      en: "But the just man, if he be prevented with death, shall be in rest."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Senéctus enim venerábilis est non diutúrna, neque annórum número computáta: cani autem sunt sensus hóminis,"
      en: "For venerable old age is not that of long time, nor counted by the number of years: but the understanding of a man is grey hairs."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et ætas senectútis vita immaculáta."
      en: "And a spotless life is old age."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Placens Deo factus est diléctus, et vivens inter peccatóres translátus est."
      en: "He pleased God and was beloved, and living among sinners he was translated."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Raptus est, ne malítia mutáret intelléctum ejus, aut ne fíctio decíperet ánimam illíus."
      en: "He was taken away lest wickedness should alter his understanding, or deceit beguile his soul."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Fascinátio enim nugacitátis obscúrat bona, et inconstántia concupiscéntiæ transvértit sensum sine malítia."
      en: "For the bewitching of vanity obscureth good things, and the wandering of concupiscence overturneth the innocent mind."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Consummátus in brevi, explévit témpora multa;"
      en: "Being made perfect in a short space, he fulfilled a long time:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Plácita enim erat Deo ánima illíus: propter hoc properávit edúcere illum de médio iniquitátum."
      en: "For his soul pleased God: therefore he hastened to bring him out of the midst of iniquities:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Pópuli autem vidéntes, et non intelligéntes, nec ponéntes in præcórdiis tália,"
      en: "But the people see this, and understand not, nor lay up such things in their hearts:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quóniam grátia Dei et misericórdia est in sanctos ejus, et respéctus in eléctos illíus."
      en: "That the grace of God, and his mercy is with his saints, and that he hath respect to his chosen."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Condémnat autem justus mórtuus vivos ímpios, et juvéntus celérius consummáta longam vitam injústi."
      en: "But the just that is dead, condemneth the wicked that are living, and youth soon ended, the long life of the unjust."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Vidébunt enim finem sapiéntis, et non intélligent quid cogitáverit de illo Deus, et quare muníerit illum Dóminus."
      en: "For they shall see the end of the wise man, and shall not understand what God hath designed for him, and why the Lord hath set him in safety."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vidébunt, et contémnent eum; illos autem Dóminus irridébit."
      en: "They shall see him, and shall despise him: but the Lord shall laugh them to scorn."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et erunt post hæc decidéntes sine honóre, et in contumélia inter mórtuos in perpétuum: quóniam disrúmpet illos inflátos sine voce, et commovébit illos a fundaméntis, et usque ad suprémum desolabúntur:"
      en: "And they shall fall after this without honour, and be a reproach among the dead for ever: for he shall burst them puffed up and speechless, and shall shake them from the foundations, and they shall be utterly laid waste:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et erunt geméntes, et memória illórum períbit."
      en: "They shall be in sorrow, and their memory shall perish."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vénient in cogitatióne peccatórum suórum tímidi, et tradúcent illos ex advérso iniquitátes ipsórum."
      en: "They shall come with fear at the thought of their sins, and their iniquities shall stand against them to convict them."
    status: { la: verified, en: verified }
