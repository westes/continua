book: ezek
chapter: 11
verses:
  - n: 1
    text:
      la: "et elevavit me spiritus et introduxit me ad portam domus Domini orientalem quae respicit solis ortum et ecce in introitu portae viginti quinque viri et vidi in medio eorum Hiezoniam filium Azur et Pheltiam filium Banaiae principes populi"
      en: "And the spirit lifted me up, and brought me into the east gate of the house of the Lord, which looketh towards the rising of the sun: and behold in the entry of the gate five and twenty men: and I saw in the midst of them Jezonias the son of Azur, and Pheltias the son of Banaias, princes of the people."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dixitque ad me fili hominis hii viri qui cogitant iniquitatem et tractant consilium pessimum in urbe ista"
      en: "And he said to me: Son of man, these are the men that study iniquity, and frame a wicked counsel in this city,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dicentes nonne dudum aedificatae sunt domus haec est lebes nos autem carnes"
      en: "Saying: Were not houses lately built? This city is the caldron, and we the flesh."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "idcirco vaticinare de eis vaticinare fili hominis"
      en: "Therefore prophesy against them, prophesy, thou son of man."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et inruit in me spiritus Domini et dixit ad me loquere haec dicit Dominus sic locuti estis domus Israhel et cogitationes cordis vestri ego novi"
      en: "And the spirit of the Lord fell upon me, and said to me: Speak: Thus saith the Lord: Thus have you spoken, O house of Israel, for I know the thoughts of your heart."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "plurimos occidistis in urbe hac et implestis vias eius interfectis"
      en: "You have killed a great many in this city, and you have filled the streets thereof with the slain."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "propterea haec dicit Dominus Deus interfecti vestri quos posuistis in medio eius hii sunt carnes et haec est lebes et educam vos de medio eius"
      en: "Therefore thus saith the Lord God: Your slain, whom you have laid in the midst thereof, they are the flesh, and this is the caldron: and I will bring you forth out of the midst thereof."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "gladium metuistis et gladium inducam super vos ait Dominus Deus"
      en: "You have feared the sword, and I will bring the sword upon you, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et eiciam vos de medio eius daboque vos in manu hostium et faciam in vobis iudicia"
      en: "And I will cast you out of the midst thereof, and I will deliver you into the hand of the enemies, and I will execute judgments upon you."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "gladio cadetis in finibus Israhel iudicabo vos et scietis quia ego Dominus"
      en: "You shall fall by the sword: I will judge you in the borders of Israel, and you shall know that I am the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "haec non erit vobis in lebetem et vos non eritis in medio eius in carnes in finibus Israhel iudicabo vos"
      en: "This shall not be as a caldron to you, and you shall not be as flesh in the midst thereof: I will judge you in the borders of Israel."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et scietis quia ego Dominus qui in praeceptis meis non ambulastis et iudicia mea non fecistis sed iuxta iudicia gentium quae in circuitu vestro sunt estis operati"
      en: "And you shall know that I am the Lord: because you have not walked in my commandments, and have not done my judgments, but you have done according to the judgments of the nations that; are round about you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et factum est cum prophetarem Pheltias filius Banaiae mortuus est et cecidi in faciem meam clamans voce magna et dixi heu heu heu Domine Deus consummationem tu facis reliquiarum Israhel"
      en: "And it came to pass, when I prophesied, that Pheltias the son of Banaias died: and I fell down upon my face, and cried with a loud voice: and said: Alas, alas, alas, O Lord God: wilt thou make an end of all the remnant of Israel?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et factum est verbum Domini ad me dicens"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "fili hominis fratres tui fratres tui viri propinqui tui et omnis domus Israhel universi quibus dixerunt habitatores Hierusalem longe recedite a Domino nobis data est terra in possessionem"
      en: "Son of man, thy brethren, thy brethren, thy kinsmen, and all the house of Israel, all they to whom the inhabitants of Jerusalem have said: Get ye far from the Lord, the land is given in possession to us."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "propterea haec dicit Dominus Deus quia longe feci eos in gentibus et quia dispersi eos in terris ero eis in sanctificationem modicam in terris ad quas venerunt"
      en: "Therefore thus saith the Lord God: Because I have removed them far off among the Gentiles, and because I have scattered them among the countries: I will be to them a little sanctuary in the countries whither they are come."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "propterea loquere haec dicit Dominus Deus congregabo vos de populis et adunabo de terris in quibus dispersi estis daboque vobis humum Israhel"
      en: "Therefore speak to them: Thus saith the Lord God: I will gather you from among the peoples, and assemble you out of the countries wherein you are scattered, and I will give you the land of Israel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ingredientur illuc et auferent omnes offensiones cunctasque abominationes eius de illa"
      en: "And they shall go in thither, and shall take away all the scandals, and all the abominations thereof from thence."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dabo eis cor unum et spiritum novum tribuam in visceribus eorum et auferam cor lapideum de carne eorum et dabo eis cor carneum"
      en: "And I will give them one heart, and will put a new spirit in their bowels: and I will take away the stony heart out of their flesh, and will give them a heart of flesh:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ut in praeceptis meis ambulent et iudicia mea custodiant faciantque ea et sint mihi in populum et ego sim eis in Deum"
      en: "That they may walk in my commandments, and keep my judgments, and do them: and that they may be my people, and I may be their God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "quorum cor post offendicula et abominationes suas ambulat horum viam in capite suo ponam dicit Dominus Deus"
      en: "But as for them whose heart walketh after their scandals and abominations, I will lay their way upon their head, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et elevaverunt cherubin alas suas et rotae cum eis et gloria Dei Israhel erat super ea"
      en: "And the cherubims lifted up their wings, and the wheels with them: and the glory of the God of Israel was over them."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et ascendit gloria Domini de medio civitatis stetitque super montem qui est ad orientem urbis"
      en: "And the glory of the Lord went up from the midst of the city, and stood over the mount that is on the east side of the city."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et spiritus levavit me adduxitque in Chaldeam ad transmigrationem in visione in spiritu Dei et sublata est a me visio quam videram"
      en: "And the spirit lifted me up, and brought me into Chaldea, to them of the captivity, in vision, by the spirit of God: and the vision which I had seen was taken up from me."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et locutus sum ad transmigrationem omnia verba Domini quae ostenderat mihi"
      en: "And I spoke to them of the captivity all the words of the Lord, which he had shewn me."
    status: { la: verified, en: verified }
