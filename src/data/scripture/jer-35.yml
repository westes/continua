# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 35
verses:
  - n: 1
    text:
      la: "verbum quod factum est ad Hieremiam a Domino in diebus Ioachim filii Iosiae regis Iuda dicens"
      en: "The word that came to Jeremias from the Lord in the days of Joakim the son of Josias king of Juda, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "vade ad domum Rechabitarum et loquere eis et introduces eos in domum Domini in unam exedram thesaurorum et dabis eis bibere vinum"
      en: "Go to the house of the Rechabites: and speak to them, and bring them into the house of the Lord, into one of the chambers of the treasures, and thou shalt give them wine to drink."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et adsumpsi Iezoniam filium Hieremiae filii Absaniae et fratres eius et omnes filios eius et universam domum Rechabitarum"
      en: "And I took Jezonias the son of Jeremias the son of Habsanias, and his brethren, and all his sons, and the whole house of the Rechabites."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et introduxi eos in domum Domini ad gazofilacium filiorum Anan filii Hiegedeliae hominis Dei quod erat iuxta gazofilacium principum super thesaurum Maasiae filii Sellum qui erat custos vestibuli"
      en: "And I brought them into the house of the Lord, to the treasure house of the sons of Hanan, the son of Jegedelias the man of God, which was by the treasure house of the princes, above the treasure of Maasias the son of Sellum, who was keeper of the entry."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et posui coram filiis domus Rechabitarum scyphos plenos vino et calices et dixi ad eos bibite vinum"
      en: "And I set before the sons of the house of the Rechabites pots full of wine, and cups: and I said to them: Drink ye wine."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui responderunt non bibemus vinum quia Ionadab filius Rechab pater noster praecepit nobis dicens non bibetis vinum vos et filii vestri usque in sempiternum"
      en: "And they answered : We will not drink wine: because Jonadab the son of Rechab, our father, commanded us, saying: You shall drink no wine, neither you, nor your children, for ever:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et domum non aedificabitis et sementem non seretis et vineas non plantabitis nec habebitis sed in tabernaculis habitabitis cunctis diebus vestris ut vivatis diebus multis super faciem terrae in qua vos peregrinamini"
      en: "Neither shall ye build houses, nor sow seed, nor plant vineyards, nor have any: but you shall dwell in tents all your days, that you may live many days upon the face of the earth, in which you are strangers."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "oboedivimus ergo voci Ionadab filii Rechab patris nostri in omnibus quae praecepit nobis ita ut non biberemus vinum cunctis diebus nostris nos et mulieres nostrae filii et filiae nostrae"
      en: "Therefore we have obeyed the voice of Jonadab the son of Rechab, our father, in all things that he commanded us: so as to drink no wine all our days: neither we, nor our wives, nor our sons, nor our daughters:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et non aedificaremus domos ad habitandum et vineam et agrum et sementem non habuimus"
      en: "Nor to build houses to dwell in, nor to have vineyard, or field, or seed:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sed habitavimus in tabernaculis et oboedientes fecimus iuxta omnia quae praecepit nobis Ionadab pater noster"
      en: "But we have dwelt in tents, and have been obedient according to all that Jonadab our father commanded us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cum autem ascendisset Nabuchodonosor rex Babylonis ad terram nostram diximus venite et ingrediamur Hierusalem a facie exercitus Chaldeorum et a facie exercitus Syriae et mansimus in Hierusalem"
      en: "But when Nabuchodonosor king of Babylon came up to our land, we said: Come, let us go into Jerusalem from the face of the army of the Chaldeans, and from the face of the army of Syria: and we have remained in Jerusalem."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et factum est verbum Domini ad Hieremiam dicens"
      en: "And the word of the Lord came to Jeremias, saying:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "haec dicit Dominus exercituum Deus Israhel vade et dic viris Iuda et habitatoribus Hierusalem numquid non recipietis disciplinam ut oboediatis verbis meis dicit Dominus"
      en: "Thus saith the Lord of hosts the God of Israel: Go, and say to the men of Juda, and to the inhabitants of Jerusalem: Will you not receive instruction, to obey my words, saith the Lord ?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "praevaluerunt sermones Ionadab filii Rechab quos praecepit filiis suis ut non biberent vinum et non biberunt usque ad diem hanc quia oboedierunt praecepto patris sui ego autem locutus sum ad vos de mane consurgens et loquens et non oboedistis mihi"
      en: "The words of Jonadab the son of Rechab, by which he commanded his sons not to drink wine, have prevailed: and they have drunk none to this day, because they have obeyed the commandment of their father: but I have spoken to you, rising early and speaking, and you have not obeyed me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "misique ad vos omnes servos meos prophetas consurgens diluculo mittensque et dicens convertimini unusquisque a via sua pessima et bona facite studia vestra et nolite sequi deos alienos neque colatis eos et habitabitis in terra quam dedi vobis et patribus vestris et non inclinastis aurem vestram neque audistis me"
      en: "And I have sent to you all my servants the prophets, rising early, and sending and saying: Return ye every man from his wicked way, and make your ways good: and follow not strange gods, nor worship them, and you shall dwell in the land, which I gave you and your fathers: and you have not inclined your ear, nor hearkened to me."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "firmaverunt igitur filii Ionadab filii Rechab praeceptum patris sui quod praeceperat eis populus autem iste non oboedivit mihi"
      en: "So the sons of Jonadab the son of Rechab have constantly kept the commandment of their father, which he commanded them: but this people hath not obeyed me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "idcirco haec dicit Dominus exercituum Deus Israhel ecce ego adduco super Iudam et super omnes habitatores Hierusalem universam adflictionem quam locutus sum adversum eos eo quod locutus sum ad illos et non audierunt vocavi illos et non responderunt mihi"
      en: "Therefore thus saith the Lord of hosts the God of Israel: Behold I will bring upon Juda, and upon all the inhabitants of Jerusalem all the evil that I have pronounced against them, because I have spoken to them, and they have not heard: I have called to them, and they have not answered me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "domui autem Rechabitarum dixit Hieremias haec dicit Dominus exercituum Deus Israhel pro eo quod oboedistis praecepto Ionadab patris vestri et custodistis omnia mandata eius et fecistis universa quae praecepit vobis"
      en: "And Jeremias said to the house of the Rechabites: Thus saith the Lord of hosts the Cod of Israel: Because you have obeyed the commandment of Jonadab your father, and have kept all his precepts, and have done all that he commanded you:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "propterea haec dicit Dominus exercituum Deus Israhel non deficiet vir de stirpe Ionadab filii Rechab stans in conspectu meo cunctis diebus"
      en: "Therefore thus saith the Lord of host the God of Israel: There shall not be wanting a man of the race of Jonadab the son of Rechab, standing before me for ever."
    status: { la: verified, en: verified }
