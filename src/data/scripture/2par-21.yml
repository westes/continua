# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2par
chapter: 21
verses:
  - n: 1
    text:
      la: "dormivit autem Iosaphat cum patribus suis et sepultus est cum eis in civitate David regnavitque Ioram filius eius pro eo"
      en: "And Josaphat slept with his fathers, and was buried with them in the city of David: and Joram his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui habuit fratres filios Iosaphat Azariam et Hiahihel et Zacchariam et Azariam et Michahel et Saphatiam omnes hii filii Iosaphat regis Israhel"
      en: "And he had brethren the sons of Josaphat, Azarias, and Jahiel, and Zacharias, and Azaria, and Michael, and Saphatias, all these were the sons of Josaphat king of Juda."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "deditque eis pater suus multa munera argenti et auri et pensitationes cum civitatibus munitissimis in Iuda regnum autem tradidit Ioram eo quod esset primogenitus"
      en: "And their father gave them great gifts of silver, and of gold, and pensions, with strong cities in Juda: but the kingdom he gave to Joram, because he was the eldest."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "surrexit ergo Ioram super regnum patris sui cumque se confirmasset occidit omnes fratres suos gladio et quosdam de principibus Israhel"
      en: "So Joram rose up over the kingdom of his father: and when he had established himself, he slew all his brethren with the sword, and some of the princes of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "triginta duo annorum erat Ioram cum regnare coepisset et octo annis regnavit in Hierusalem"
      en: "Joram was two and thirty years old when he began to reign: and he reigned eight years in Jerusalem."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ambulavitque in viis regum Israhel sicut egerat domus Ahab filia quippe Ahab erat uxor eius et fecit malum in conspectu Domini"
      en: "And he walked in the ways of the kings of Israel, as the house of Achab had done: for his wife was a daughter of Achab, and he did evil in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "noluit autem Dominus disperdere domum David propter pactum quod inierat cum eo et quia promiserat ut daret illi lucernam et filiis eius omni tempore"
      en: "But the Lord would not destroy the house of David: because of the covenant which he had made with him: and because he had promised to give a lamp to him, and to his sons for ever."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "in diebus illis rebellavit Edom ne esset subditus Iudae et constituit sibi regem"
      en: "In those days Edom revolted, from being subject to Juda, and made themselves a king."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque transisset Ioram cum principibus suis et cuncto equitatu qui erat secum surrexit nocte et percussit Edom qui se circumdederat et omnes duces equitatus eius"
      en: "And Joram went over with his princes, and all his cavalry with him, and rose in the night, and defeated the Edomites who had surrounded him, and all the captains of his cavalry."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "attamen rebellavit Edom ne esset sub dicione Iuda usque ad hanc diem eo tempore et Lobna recessit ne esset sub manu illius dereliquerat enim Dominum Deum patrum suorum"
      en: "However Edom revolted, from being under the dominion of Juda unto this day: at that time Lobna also revolted, from being under his hand. For he had forsaken the Lord the God of his fathers:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "insuper et excelsa fabricatus est in urbibus Iuda et fornicari fecit habitatores Hierusalem et praevaricari Iudam"
      en: "Moreover he built also high places in the cities of Juda, and he made the inhabitants of Jerusalem to commit fornication, and Juda to transgress."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "adlatae sunt autem ei litterae ab Helia propheta in quibus scriptum erat haec dicit Dominus Deus David patris tui quoniam non ambulasti in viis Iosaphat patris tui et in viis Asa regis Iuda"
      en: "And there was a letter brought him from Elias the prophet, in which it was written: Thus saith the Lord the God of David thy father: Because thou hast not walked in the ways of Josaphat thy father nor in the ways of Asa king of Juda,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "sed incessisti per iter regum Israhel et fornicari fecisti Iudam et habitatores Hierusalem imitatus fornicationem domus Ahab insuper et fratres tuos domum patris tui meliores te occidisti"
      en: "But hast walked in the ways of the kings of Israel, and hast made Juda and the inhabitants of Jerusalem to commit fornication, imitating the fornication of the house of Achab, moreover also thou hast killed thy brethren, the house of thy father, better men than thyself,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ecce Dominus percutiet te plaga magna cum populo tuo et filiis et uxoribus tuis universaque substantia tua"
      en: "Behold the Lord will strike thee with a great plague, with all thy people, and thy children, and thy wives, and all thy substance."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "tu autem aegrotabis pessimo languore uteri donec egrediantur vitalia tua paulatim per dies singulos"
      en: "And thou shalt be sick of a very grievous disease of thy bowels, till thy vital parts come out by little and little every day."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "suscitavit ergo Dominus contra Ioram spiritum Philisthinorum et Arabum qui confines sunt Aethiopibus"
      en: "And the Lord stirred up against Joram the spirit of the Philistines, and of the Arabians, who border on the Ethiopians."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ascenderunt in terram Iuda et vastaverunt eam diripueruntque cunctam substantiam quae inventa est in domo regis insuper et filios eius et uxores nec remansit ei filius nisi Ioachaz qui minimus natu erat"
      en: "And they came up into the land of Juda, and wasted it, and they carried away all the substance that was found in the king's house, his sons also, and his wives: so that there was no son left him but Joachaz, who was the youngest."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et super haec omnia percussit eum Dominus alvi languore insanabili"
      en: "And besides all this the Lord struck him with an incurable disease in his bowels."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cumque diei succederet dies et temporum spatia volverentur duorum annorum expletus est circulus et sic longa consumptus tabe ita ut egereret etiam viscera sua languore pariter et vita caruit mortuusque est in infirmitate pessima et non fecit ei populus secundum morem conbustionis exequias sicut fecerat maioribus eius"
      en: "And as day came after day, and time rolled on, two whole years passed: then after being wasted with a long consumption, so as to void his very bowels, his disease ended with his life. And he died of a most wretched illness, and the people did not make a funeral for him according to the manner of burning, as they had done for his ancestors."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "triginta duum annorum fuit cum regnare coepisset et octo annis regnavit in Hierusalem ambulavitque non recte et sepelierunt eum in civitate David verumtamen non in sepulchro regum"
      en: "He was two and thirty years old when he began his reign, and he reigned eight years in Jerusalem. And he walked not rightly, and they buried him in the city of David: but not in the sepulchres of the kings."
    status: { la: verified, en: verified }
