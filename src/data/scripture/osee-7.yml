# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: osee
chapter: 7
verses:
  - n: 1
    text:
      la: "cum sanare vellem Israhel revelata est iniquitas Ephraim et malitia Samariae quia operati sunt mendacium et fur ingressus est spolians latrunculus foris"
      en: "When I would have healed Israel, the iniquity of Ephraim was discovered, and the wickedness of Samaria, for they have committed falsehood, and the thief is come in to steal, the robber is without."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ne forte dicant in cordibus suis omnem malitiam eorum me recordatum nunc circumdederunt eos adinventiones suae coram facie mea factae sunt"
      en: "And lest they may say in their hearts, that I remember all their wickedness: their own devices now have beset them about, they have been done before my face."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "in malitia sua laetificaverunt regem et in mendaciis suis principes"
      en: "They have made the king glad with their wickedness: and the princes with their lies."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "omnes adulterantes quasi clibanus succensus a coquente quievit paululum civitas a commixtione fermenti donec fermentaretur totum"
      en: "They are all adulterers, like an oven heated by the baker: the city rested a little from the mingling of the leaven, till the whole was leavened."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dies regis nostri coeperunt principes furere a vino extendit manum suam cum inlusoribus"
      en: "The day of our king, the princes began to be mad with wine: he stretched out his hand with scorners."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quia adplicuerunt quasi clibanum cor suum cum insidiaretur eis tota nocte dormivit coquens eos mane ipse succensus quasi ignis flammae"
      en: "Because they have applied their heart like an oven, when he laid snares for them: he slept all the night baking them, in the morning he himself was heated as a flaming fire."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "omnes calefacti sunt quasi clibanus et devoraverunt iudices suos omnes reges eorum ceciderunt non est qui clamet in eis ad me"
      en: "They were all heated like an oven, and have devoured their judges : all their kings have fallen: there is none amongst them that calleth unto me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ephraim in populis ipse commiscebatur Ephraim factus est subcinericius qui non reversatur"
      en: "Ephraim himself is mixed among the nations: Ephraim is become as bread baked under the ashes, that is not turned."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "comederunt alieni robur eius et ipse nescivit sed et cani effusi sunt in eo et ipse ignoravit"
      en: "Strangers have devoured his strength, and he knew it not: yea, grey hairs also are spread about upon him, and he is ignorant of it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et humiliabitur superbia Israhel in facie eius nec reversi sunt ad Dominum Deum suum et non quaesierunt eum in omnibus his"
      en: "And the pride of Israel shall be humbled before his face: and they have not returned to the Lord their God, nor have they sought him in all these."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et factus est Ephraim quasi columba seducta non habens cor Aegyptum invocabant ad Assyrios abierunt"
      en: "And Ephraim is become as a dove that is decoyed, not having a heart: they called upon Egypt, they went to the Assyrians."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et cum profecti fuerint expandam super eos rete meum quasi volucrem caeli detraham eos caedam eos secundum auditionem coetus eorum"
      en: "And when they shall go, I will spread my net upon them: I will bring them down as the fowl of the air, I will strike them as their congregation hath heard."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "vae eis quoniam recesserunt a me vastabuntur quia praevaricati sunt in me et ego redemi eos et ipsi locuti sunt contra me mendacia"
      en: "Woe to them, for they have departed from me: they shall be wasted because they have transgressed against me: and I redeemed them : and they have spoken lies against me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et non clamaverunt ad me in corde suo sed ululabant in cubilibus suis super triticum et vinum ruminabant recesserunt a me"
      en: "And they have not cried to me with their heart, but they howled in their beds: they have thought upon wheat and wine, they are departed from me."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ego erudivi et confortavi brachia eorum et in me cogitaverunt malitiam"
      en: "And I have chastised them, and strengthened their arms: and they have imagined evil against me."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "reversi sunt ut essent absque iugo facti sunt quasi arcus dolosus cadent in gladio principes eorum a furore linguae suae ista subsannatio eorum in terra Aegypti"
      en: "They returned, that they might be without yoke: they became like a deceitful bow: their princes shall fall by the sword, for the rage of their tongue. This is their derision in the land of Egypt."
    status: { la: verified, en: verified }
