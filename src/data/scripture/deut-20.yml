# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 20
verses:
  - n: 1
    text:
      la: "si exieris ad bellum contra hostes tuos et videris equitatum et currus et maiorem quam tu habes adversarii exercitus multitudinem non timebis eos quia Dominus Deus tuus tecum est qui eduxit te de terra Aegypti"
      en: "If thou go out to war against thy enemies, and see horsemen and chariots, and the numbers of the enemy's army greater than thine, thou shalt not fear them: because the Lord thy God is with thee, who brought thee out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "adpropinquante autem iam proelio stabit sacerdos ante aciem et sic loquetur ad populum"
      en: "And when the battle is now at hand, the priest shall stand before the army, and shall speak to the people in this manner:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "audi Israhel vos hodie contra inimicos vestros pugnam committitis non pertimescat cor vestrum nolite metuere nolite cedere nec formidetis eos"
      en: "Hear, O Israel, you join battle this day against your enemies, let not your heart be dismayed, be not afraid, do not give back, fear ye them not:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia Dominus Deus vester in medio vestri est et pro vobis contra adversarios dimicabit ut eruat vos de periculo"
      en: "Because the Lord your God is in the midst of you, and will fight for you against your enemies, to deliver you from danger."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "duces quoque per singulas turmas audiente exercitu proclamabunt quis est homo qui aedificavit domum novam et non dedicavit eam vadat et revertatur in domum suam ne forte moriatur in bello et alius dedicet illam"
      en: "And the captains shall proclaim through every band in the hearing of the army: What man is there, that hath built a new house, and hath not dedicated it? let him go and return to his house, lest he die in the battle, and another man dedicate it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "quis est homo qui plantavit vineam et necdum eam fecit esse communem et de qua vesci omnibus liceat vadat et revertatur in domum suam ne forte moriatur in bello et alius homo eius fungatur officio"
      en: "What man is there, that hath planted a vineyard, and hath not as yet made it to be common, whereof all men may eat? let him go, and return to his house, lest he die in the battle, and another man execute his office."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quis est homo qui despondit uxorem et non accepit eam vadat et revertatur in domum suam ne forte moriatur in bello et alius homo accipiat eam"
      en: "What man is there, that hath espoused a wife, and not taken her? let him go, and return to his house, lest he die in the war, and another man take her."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "his dictis addent reliqua et loquentur ad populum quis est homo formidolosus et corde pavido vadat et revertatur in domum suam ne pavere faciat corda fratrum suorum sicut ipse timore perterritus est"
      en: "After these things are declared they shall add the rest, and shall speak to the people: What man is there that is fearful, and faint hearted? let him go, and return to his house, lest he make the hearts of his brethren to fear, as he himself is possessed with fear."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque siluerint exercitus duces et finem loquendi fecerint unusquisque suos ad bellandum cuneos praeparabit"
      en: "And when the captains of the army shall hold their peace, and have made an end of speaking, every man shall prepare their bands to fight."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "si quando accesseris ad expugnandam civitatem offeres ei primum pacem"
      en: "If at any time thou come to fight against a city, thou shalt first offer it peace."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si receperit et aperuerit tibi portas cunctus populus qui in ea est salvabitur et serviet tibi sub tributo"
      en: "If they receive it, and open the gates to thee, all the people that are therein, shall be saved, and shall serve thee paying tribute."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sin autem foedus inire noluerint et receperint contra te bellum obpugnabis eam"
      en: "But if they will not make peace, and shall begin war against thee, thou shalt besiege it."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cumque tradiderit Dominus Deus tuus illam in manu tua percuties omne quod in ea generis masculini est in ore gladii"
      en: "And when the Lord thy God shall deliver it into thy bands, thou shalt slay all that are therein of the male sex, with the edge of the sword,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "absque mulieribus et infantibus iumentis et ceteris quae in civitate sunt omnem praedam exercitui divides et comedes de spoliis hostium tuorum quae Dominus Deus tuus dederit tibi"
      en: "Excepting women and children, cattle and other things, that are in the city. And thou shalt divide all the prey to the army, and thou shalt eat the spoils of thy enemies, which the Lord thy God shall give thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sic facies cunctis civitatibus quae a te procul valde sunt et non sunt de his urbibus quas in possessionem accepturus es"
      en: "So shalt thou do to all cities that are at a great distance from thee, and are not of these cities which thou shalt receive in possession."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "de his autem civitatibus quae dabuntur tibi nullum omnino permittes vivere"
      en: "But of those cities that shall be given thee, thou shalt suffer none at all to live:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed interficies in ore gladii Hettheum videlicet et Amorreum et Chananeum Ferezeum et Eveum et Iebuseum sicut praecepit tibi Dominus Deus tuus"
      en: "But shalt kill them with the edge of the sword, to wit, the Hethite, and the Amorrhite, and the Chanaanite, the Pherezite, and the Hevite, and the Jebusite, as the Lord thy God hath commanded thee:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ne forte doceant vos facere cunctas abominationes quas ipsi operati sunt diis suis et peccetis in Dominum Deum vestrum"
      en: "Lest they teach you to do all the abominations which they have done to their gods: and you should sin against the Lord your God."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quando obsederis civitatem multo tempore et munitionibus circumdederis ut expugnes eam non succides arbores de quibus vesci potest nec securibus per circuitum debes vastare regionem quoniam lignum est et non homo nec potest bellantium contra te augere numerum"
      en: "When thou hast besieged a city a long time, and hath compassed it with bulwarks to take it, thou shalt not cut down the trees that may be eaten of, neither shalt thou spoil the country round about with axes: for it is a tree, and not a man, neither can it increase the number of them that fight against thee."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "si qua autem ligna non sunt pomifera sed agrestia et in ceteros apta usus succide et extrue machinas donec capias civitatem quae contra te dimicat"
      en: "But if there be any trees that are not fruitful, but wild, and fit for other uses, cut them down, and make engines, until thou take the city, which fighteth against thee."
    status: { la: verified, en: verified }
