# Ezekiel (Vulgate "Ezechiel," cited "Ezech"), chapter 15.
# Verses transcribed from all-saints-octave-day-7.yml (already pulled
# from Divinum Officium, Monastic Tridentinum 1617) as part of the
# migration to a dedicated scripture store (2026-08 decision).
book: ezek
chapter: 15
verses:
  - n: 1
    text:
      la: "Et factus est sermo Dómini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fili hóminis, quid fiet de ligno vitis, ex ómnibus lignis némorum, quæ sunt inter ligna silvárum?"
      en: "Son of man, what shall be made of the wood of the vine, out of all the trees of the woods that are among the trees of the forests?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Numquid tollétur de ea lignum, ut fiat opus, aut fabricábitur de ea paxíllus, ut depéndeat in eo quodcúmque vas?"
      en: "Shall wood be taken of if, to do any work, or shall a pin be made of it for any vessel to hang thereon?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ecce igni datum est in escam: utrámque partem ejus consúmpsit ignis, et medíetas ejus redácta est in favíllam. Numquid útile erit ad opus?"
      en: "Behold it is cast into the fire for fuel: the fire hath consumed both ends thereof, and the midst thereof is reduced to ashes: shall it be useful for any work?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Etiam cum esset íntegrum, non erat aptum ad opus: quanto magis cum illud ignis devoráverit et combússerit: nihil ex eo fiet óperis?"
      en: "Even when it was whole it was not fit for work: how much less, when the fire hath devoured and consumed it, shall any work be made of it?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Proptérea hæc dicit Dóminus Deus: Quómodo lignum vitis inter ligna silvárum, quod dedi igni ad devorándum, sic tradam habitatóres Jerúsalem."
      en: "Therefore thus saith the Lord God: As the vine tree among the trees of the forests which I have given to the fire to be consumed, so will I deliver up the inhabitants of Jerusalem."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ponam fáciem meam in eos: de igne egrediéntur, et ignis consúmet eos: et sciétis quia ego Dóminus, cum posúero fáciem meam in eos,"
      en: "And I will set my face against them: they shall go out from fire, and fire shall consume them and you shall know that I am the Lord, when I shall have set my face against them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et dédero terram ínviam et desolátam, eo quod prævaricatóres exstíterint, dicit Dóminus Deus."
      en: "And I shall have made their land a wilderness, and desolate, because they have been transgressors, saith the Lord God."
    status: { la: verified, en: verified }
