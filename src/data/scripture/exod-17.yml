# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 17
verses:
  - n: 1
    text:
      la: "Igitur profecta omnis multitudo filiorum Israel de deserto Sin per mansiones suas, juxta sermonem Domini, castrametati sunt in Raphidim, ubi non erat aqua ad bibendum populo."
      en: "Then all the multitude of the children of Israel setting forward from the desert of Sin, by their mansions, according to the word of the Lord, encamped in Raphidim, where there was no water for the people to drink."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Qui jurgatus contra Moysen, ait: Da nobis aquam, ut bibamus. Quibus respondit Moyses: Quid jurgamini contra me? cur tentatis Dominum?"
      en: "And they chode with Moses, and said: Give us water, that we may drink. And Moses answered them: Why chide you with me? Wherefore do you tempt the Lord?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sitivit ergo ibi populus prae aquae penuria, et murmuravit contra Moysen, dicens: Cur fecisti nos exire de Aegypto, ut occideres nos, et liberos nostros, ac jumenta siti?"
      en: "So the people were thirsty there for want of water, and murmured against Moses, saying: Why didst thou make us go forth out of Egypt, to kill us and our children, and our beasts with thirst?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Clamavit autem Moyses ad Dominum, dicens: Quid faciam populo huic? adhuc paululum, et lapidabit me."
      en: "And Moses cried to the Lord, saying: What shall I do to this people? Yet a little more and they will stone me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ait Dominus ad Moysen: Antecede populum, et sume tecum de senioribus Israel: et virgam qua percussisti fluvium, tolle in manu tua, et vade."
      en: "And the Lord said to Moses: Go before the people, and take with thee of the ancients of Israel: and take in thy hand the rod wherewith thou didst strike the river, and go."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "En ego stabo ibi coram te, supra petram Horeb: percutiesque petram, et exibit ex ea aqua, ut bibat populus. Fecit Moyses ita coram senioribus Israel:"
      en: "Behold I will stand there before thee, upon the rock Horeb: and thou shalt strike the rock, and water shall come out of it that the people may drink. Moses did so before the ancients of Israel:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et vocavit nomen loci illius, Tentatio, propter jurgium filiorum Israel, et quia tentaverunt Dominum, dicentes: Estne Dominus in nobis, an non?"
      en: "And he called the name of that place Temptation, because the chiding of the children of Israel, and for that they tempted the Lord, saying: Is the Lord amongst us or not?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Venit autem Amalec, et pugnabat contra Israel in Raphidim."
      en: "And Amalec came, and fought against Israel in Raphidim."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixitque Moyses ad Josue: Elige viros: et egressus, pugna contra Amalec: cras ego stabo in vertice collis, habens virgam Dei in manu mea."
      en: "And Moses said to Josue: Choose out men: and go out and fight against Amalec: tomorrow I will stand on the top of the hill having the rod of God in my hand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Fecit Josue ut locutus erat Moyses, et pugnavit contra Amalec: Moyses autem et Aaron et Hur ascenderunt super verticem collis."
      en: "Josue did as Moses had spoken, and he fought against Amalec; but Moses, and Aaron, and Hur went up upon the top of the hill."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque levaret Moyses manus, vincebat Israel: sin autem paululum remisisset, superabat Amalec."
      en: "And when Moses lifted up his hands, Israel overcame: but if he let them down a little, Amalec overcame."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Manus autem Moysi erant graves: sumentes igitur lapidem, posuerunt subter eum, in quo sedit: Aaron autem et Hur sustentabant manus ejus ex utraque parte. Et factum est ut manus illius non lassarentur usque ad occasum solis."
      en: "And Moses' hands were heavy: so they took a stone, and put under him, and he sat on it: and Aaron and Hur stayed up his hands on both sides. And it came to pass that his hands were not weary until sunset."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Fugavitque Josue Amalec, et populum ejus in ore gladii."
      en: "And Josue put Amalec and his people to flight, by the edge of the sword."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixit autem Dominus ad Moysen: Scribe hoc ob monimentum in libro, et trade auribus Josue: delebo enim memoriam Amalec sub caelo."
      en: "And the Lord said to Moses: Write this for a memorial in a book, and deliver it to the ears of Josue: for I will destroy the memory of Amalec from under heaven."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Aedificavitque Moyses altare: et vocavit nomen ejus, Dominus exaltatio mea, dicens:"
      en: "And Moses built an altar: and called the name thereof, The Lord my exaltation, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quia manus solii Domini, et bellum Domini erit contra Amalec, a generatione in generationem."
      en: "Because the hand of the throne of the Lord, and the war of the Lord shall be against Amalec, from generation to generation."
    status: { la: verified, en: verified }
