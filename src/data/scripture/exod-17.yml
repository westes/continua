# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 17
verses:
  - n: 1
    text:
      la: "igitur profecta omnis multitudo filiorum Israhel de deserto Sin per mansiones suas iuxta sermonem Domini castrametata est in Raphidim ubi non erat aqua ad bibendum populo"
      en: "Then all the multitude of the children of Israel setting forward from the desert of Sin, by their mansions, according to the word of the Lord, encamped in Raphidim, where there was no water for the people to drink."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "qui iurgatus contra Mosen ait da nobis aquam ut bibamus quibus respondit Moses quid iurgamini contra me cur temptatis Dominum"
      en: "And they chode with Moses, and said: Give us water, that we may drink. And Moses answered them: Why chide you with me? Wherefore do you tempt the Lord?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "sitivit ergo populus ibi pro aquae penuria et murmuravit contra Mosen dicens cur nos exire fecisti de Aegypto ut occideres et nos et liberos nostros ac iumenta siti"
      en: "So the people were thirsty there for want of water, and murmured against Moses, saying: Why didst thou make us go forth out of Egypt, to kill us and our children, and our beasts with thirst?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "clamavit autem Moses ad Dominum dicens quid faciam populo huic adhuc pauxillum et lapidabunt me"
      en: "And Moses cried to the Lord, saying: What shall I do to this people? Yet a little more and they will stone me."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ait Dominus ad Mosen antecede populum et sume tecum de senibus Israhel et virgam qua percussisti fluvium tolle in manu tua et vade"
      en: "And the Lord said to Moses: God before the people, and take with thee of the ancients of Israel: and take in thy hand the rod wherewith thou didst strike the river, and go."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "en ego stabo coram te ibi super petram Horeb percutiesque petram et exibit ex ea aqua ut bibat populus fecit Moses ita coram senibus Israhel"
      en: "Behold I will stand there before thee, upon the rock Horeb: and thou shalt strike the rock, and water shall come out of it that the people may drink. Moses did so before the ancients of Israel:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et vocavit nomen loci illius Temptatio propter iurgium filiorum Israhel et quia temptaverunt Dominum dicentes estne Dominus in nobis an non"
      en: "And he called the name of that place Temptation, because the chiding of the children of Israel, and for that they tempted the Lord, saying: Is the Lord amongst us or not?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "venit autem Amalech et pugnabat contra Israhel in Raphidim"
      en: "And Amalec came, and fought against Israel in Raphidim."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixitque Moses ad Iosue elige viros et egressus pugna contra Amalech cras ego stabo in vertice collis habens virgam Dei in manu mea"
      en: "And Moses said to Josue: Choose out men: and go out and fight against Amalec: to morrow I will stand on the top of the hill having the rod of God in my hand."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "fecit Iosue ut locutus ei erat Moses et pugnavit contra Amalech Moses autem et Aaron et Hur ascenderunt super verticem collis"
      en: "Josue did as Moses had spoken, and he fought against Amalec; but Moses, and Aaron, and Hur went up upon the top of the hill."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque levaret Moses manus vincebat Israhel sin autem paululum remisisset superabat Amalech"
      en: "And when Moses lifted up his hands, Israel overcame: but if he let them down a little, Amalec overcame."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "manus autem Mosi erant graves sumentes igitur lapidem posuerunt subter eum in quo sedit Aaron autem et Hur sustentabant manus eius ex utraque parte et factum est ut manus ipsius non lassarentur usque ad occasum solis"
      en: "And Moses' hands were heavy: so they took a stone, and put under him, and he sat on it: and Aaron and Hur stayed up his hands on both sides. And it came to pass that his hands were not weary until sunset."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "fugavitque Iosue Amalech et populum eius in ore gladii"
      en: "And Josue put Amalec and his people to flight, by the edge of the sword."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dixit autem Dominus ad Mosen scribe hoc ob monumentum in libro et trade auribus Iosue delebo enim memoriam Amalech sub caelo"
      en: "And the Lord said to Moses: Write this for a memorial in a book, and deliver it to the ears of Josue: for I will destroy the memory of Amalec from under heaven."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "aedificavitque Moses altare et vocavit nomen eius Dominus exaltatio mea dicens"
      en: "And Moses built an altar: and called the name thereof, The Lord my exaltation, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quia manus solii Domini et bellum Dei erit contra Amalech a generatione in generationem"
      en: "Because the hand of the throne of the Lord, and the war of the Lord shall be against Amalec, from generation to generation."
    status: { la: verified, en: verified }
