# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jos
chapter: 11
verses:
  - n: 1
    text:
      la: "Quae cum audisset Jabin rex Asor, misit ad Jobab regem Madon, et ad regem Semeron, atque ad regem Achsaph:"
      en: "And when Jabin king of Asor had heard these things, he sent to Jobab king of Madon, and to the king of Semeron, and to the king of Achsaph:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ad reges quoque aquilonis, qui habitabant in montanis et in planitie contra meridiem Ceneroth, in campestribus quoque et in regionibus Dor juxta mare:"
      en: "And to the kings of the north, that dwelt in the mountains and in the plains over against the south side of Ceneroth, and in the levels and the countries of Dor by the sea side:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Chananaeum quoque ab oriente et occidente, et Amorrhaeum atque Hethaeum ac Pherezaeum et Jebusaeum in montanis: Hevaeum quoque qui habitabat ad radices Hermon in terra Maspha."
      en: "To the Chanaanites also on the east and on the west, and the Amorrhite, and the Hethite, and the Pherezite, and the Jebusite in the mountains: to the Hevite also who dwelt at the foot of Hermon in the land of Maspha."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Egressique sunt omnes cum turmis suis, populus multus nimis sicut arena quae est in littore maris, equi quoque et currus immensae multitudinis."
      en: "And they all came out with their troops, a people exceeding numerous as the sand that is on the sea shore, their horses also and chariots a very great multitude,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Conveneruntque omnes reges isti in unum ad aquas Merom, ut pugnarent contra Israel."
      en: "And all these kings assembled together at the waters of Merom, to fight against Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dixitque Dominus ad Josue: Ne timeas eos: cras enim hac eadem hora ego tradam omnes istos vulnerandos in conspectu Israel: equos eorum subnervabis, et currus igne combures."
      en: "And the Lord said to Josue: Fear them not: for tomorrow at this same hour I will deliver all these to be slain in the sight of Israel: thou shalt hamstring their horses, and thou shalt burn their chariots with fire."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Venitque Josue, et omnis exercitus cum eo, adversus illos ad aquas Merom subito, et irruerunt super eos,"
      en: "And Josue came, and all the army with him, against them to the waters of Merom on a sudden, and fell upon them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tradiditque illos Dominus in manus Israel. Qui percusserunt eos, et persecuti sunt usque ad Sidonem magnam, et aquas Maserephoth, campumque Masphe, qui est ad orientalem illius partem. Ita percussit omnes, ut nullas dimitteret ex eis reliquias:"
      en: "And the Lord delivered them into the hands of Israel. And they defeated them, and chased them as far as the great Sidon, and the waters of Maserophot, and the field of Masphe, which is on the east side thereof. He slew them all, so as to leave no remains of them:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "fecitque sicut praeceperat ei Dominus, equos eorum subnervavit, currusque combussit igni."
      en: "And he did as the Lord had commanded him, he hamstringed their horses and burned their chariots."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Reversusque statim cepit Asor: et regem ejus percussit gladio. Asor enim antiquitus inter omnia regna haec principatum tenebat."
      en: "And presently turning back he took Asor: and slew the king thereof with the sword. Now Asor of old was the head of all these kingdoms."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Percussitque omnes animas quae ibidem morabantur: non dimisit in ea ullas reliquias, sed usque ad internecionem universa vastavit, ipsamque urbem peremit incendio."
      en: "And he cut off all the souls that abode there: he left not in it any remains, but utterly destroyed all, and burned the city itself with fire."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et omnes per circuitum civitates, regesque earum cepit, percussit atque delevit, sicut praeceperat ei Moyses famulus Domini."
      en: "And he took and put to the sword and destroyed all the cities round about, and their kings, as Moses the servant of God had commanded him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Absque urbibus, quae erant in collibus et in tumulis sitae, ceteras succendit Israel: unam tantum Asor munitissimam flamma consumpsit."
      en: "Except the cities that were on hills and high places, the rest Israel burned: only Asor that was very strong he consumed with fire."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Omnemque praedam istarum urbium ac jumenta diviserunt sibi filii Israel, cunctis hominibus interfectis."
      en: "And the children of Israel divided among themselves all the spoil of these cities and the cattle, killing all the men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sicut praeceperat Dominus Moysi servo suo, ita praecepit Moyses Josue, et ille universa complevit: non praeteriit de universis mandatis, nec unum quidem verbum quod jusserat Dominus Moysi."
      en: "As the Lord had commanded Moses his servant, so did Moses command Josue, and he accomplished all: he left not one thing undone of all the commandments which the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cepit itaque Josue omnem terram montanam, et meridianam, terramque Gosen, et planitiem, et occidentalem plagam, montemque Israel, et campestria ejus:"
      en: "So Josue took all the country of the hills, and of the south, and the land of Gosen, and the plains and the west country, and the mountain of Israel, and the plains thereof:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et partem montis, quae ascendit Seir usque Baalgad, per planitiem Libani subter montem Hermon: omnes reges eorum cepit, percussit, et occidit."
      en: "And part of the mountain that goeth up to Seir as far as Baalgad, by the plain of Libanus under mount Hermon: all their kings he took, smote and slew."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Multo tempore pugnavit Josue contra reges istos."
      en: "Josue made war a long time against these kings."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Non fuit civitas quae se traderet filiis Israel, praeter Hevaeum, qui habitabat in Gabaon: omnes enim bellando cepit."
      en: "There was not a city that delivered itself to the children of Israel, except the Hevite, who dwelt in Gabaon: for he took all by fight."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Domini enim sententia fuerat, ut indurarentur corda eorum, et pugnarent contra Israel, et caderent, et non mererentur ullam clementiam, ac perirent, sicut praeceperat Dominus Moysi."
      en: "For it was the sentence of the Lord, that their hearts should be hardened, and they should fight against Israel, and fall, and should not deserve any clemency, and should be destroyed as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "In illo tempore venit Josue, et interfecit Enacim de montanis, Hebron, et Dabir, et Anab, et de omni monte Juda et Israel, urbesque eorum delevit."
      en: "At that time Josue came and cut off the Enacims from the mountains, from Hebron, and Dabir, and Anab, and from all the mountain of Juda and Israel, and destroyed their cities."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Non reliquit ullum de stirpe Enacim, in terra filiorum Israel: absque civitatibus Gaza, et Geth, et Azoto, in quibus solis relicti sunt."
      en: "He left not any of the stock of the Enacims, in the land of the children of Israel: except the cities of Gaza, and Geth, and Azotus, in which alone they were left."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Cepit ergo Josue omnem terram, sicut locutus est Dominus ad Moysen, et tradidit eam in possessionem filiis Israel secundum partes et tribus suas: quievitque terra a praeliis."
      en: "So Josue took all the land, as the Lord spoke to Moses, and delivered it in possession to the children of Israel, according to their divisions and tribes. And the land rested from wars."
    status: { la: verified, en: verified }
