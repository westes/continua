# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jos
chapter: 11
verses:
  - n: 1
    text:
      la: "quae cum audisset Iabin rex Asor misit ad Iobab regem Madon et ad regem Someron atque ad regem Acsaph"
      en: "And when Jabin king of Asor had heard these things, he sent to Jobab king of Madon, and to the king of Semeron, and to the king of Achsaph:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ad reges quoque aquilonis qui habitabant in montanis et in planitie contra meridiem Cheneroth in campestribus quoque et in regionibus Dor iuxta mare"
      en: "And to the kings of the north, that dwelt in the mountains and in the plains over against the south side of Ceneroth, and in the levels and the countries of Dor by the sea side :"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Chananeumque ab oriente et occidente et Amorreum atque Hettheum ac Ferezeum et Iebuseum in montanis Eveum quoque qui habitabat ad radices Hermon in terra Masphe"
      en: "To the Chanaanites also on the ease and on the west, and the Amorrhite, and the Hethite, and the Pherezite, and the Jebusite in the mountains: to the Hevite also who dwelt at the foot of Hermon in the land of Maspha."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "egressique sunt omnes cum turmis suis populus multus nimis sicut harena quae est in litore maris equi quoque et currus inmensae multitudinis"
      en: "And they all came out with their troops, a people exceeding numerous as the sand that is on the sea shore, their horses also and chariots a very great multitude,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "conveneruntque omnes reges isti in unum ad aquas Merom ut pugnarent contra Israhel"
      en: "And all these kings assembled together at the waters of Merom, to fight against Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixitque Dominus ad Iosue ne timeas eos cras enim hac eadem hora ego tradam omnes istos vulnerandos in conspectu Israhel equos eorum subnervabis et currus igne conbures"
      en: "And the Lord said to Josue: Fear them not: for to morrow at this same hour I will deliver all these to be slain in the sight of Israel: thou shalt hamstring their horses, and thou shalt burn their chariots with fire."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "venitque Iosue et omnis exercitus cum eo adversum illos ad aquas Merom subito et inruerunt super eos"
      en: "And Josue came, and all the army with him, against them to the waters of Merom on a sudden, and fell upon them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tradiditque illos Dominus in manu Israhel qui percusserunt eos et persecuti sunt usque ad Sidonem magnam et aquas Maserefoth campumque Masphe qui est ad orientalem illius partem ita percussit omnes ut nullas dimitteret ex eis reliquias"
      en: "And the Lord delivered them into the hands of Israel. And they defeated them, and chased them as far as the great Sidon, and the waters of Maserophot, and the field of Masphe, which is on the east side thereof. He slew them all, so as to leave no remains of them:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "fecit sicut praeceperat ei Dominus equos eorum subnervavit currusque conbusit"
      en: "And he did as the Lord had commanded him, he hamstringed their horses and burned their chariots."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "reversusque statim cepit Asor et regem eius percussit gladio Asor enim antiquitus inter omnia regna haec principatum tenebat"
      en: "And presently turning back he took Asor: and slew the king thereof with the sword. Now Asor of old was the head of all these kingdoms."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "percussitque omnes animas quae ibidem morabantur non dimisit in ea ullas reliquias sed usque ad internicionem universa vastavit ipsamque urbem permisit incendio"
      en: "And he cut off all the souls that abode there: he left not in it any remains, but utterly destroyed all, and burned the city itself with fire."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et omnes per circuitum civitates regesque earum cepit percussit atque delevit sicut praeceperat ei Moses famulus Domini"
      en: "And he took and put to the sword and destroyed all the cities round about, and their kings, as Moses the servant of God had commanded him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "absque urbibus quae erant in collibus et in tumulis sitae ceteras succendit Israhel unam tantum Asor munitissimam flamma consumpsit"
      en: "Except the cities that were on hills and high places, the rest Israel burned: only Asor that was very strong he consumed with fire."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "omnemque praedam istarum urbium ac iumenta diviserunt sibi filii Israhel cunctis hominibus interfectis"
      en: "And the children of Israel divided among themselves all the spoil of these cities and the cattle, killing all the men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sicut praeceperat Dominus Mosi servo suo ita praecepit Moses Iosue et ille universa conplevit non praeteriit de universis mandatis ne unum quidem verbum quod iusserat Dominus Mosi"
      en: "As the Lord had commanded Moses his servant, so did Moses command Josue, and he accomplished all: he left not one thing undone of all the commandments which the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cepit itaque Iosue omnem terram montanam et meridianam terramque Gosen et planitiem et occidentalem plagam montemque Israhel et campestria eius"
      en: "So Josue took all the country of the hills, and of the south, and the land of Gosen, and the plains and the west country, and the mountain of Israel, and the plains thereof:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et partem montis quae ascendit Seir usque Baalgad per planitiem Libani subter montem Hermon omnes reges eorum cepit percussit occidit"
      en: "And part of the mountain that goeth up to Seir as far as Baalgad, by the plain of Libanus under mount Hermon: all their kings he took, smote and slew."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "multo tempore pugnavit Iosue contra reges istos"
      en: "Josue made war a long time against these kings."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non fuit civitas quae se non traderet filiis Israhel praeter Eveum qui habitabat in Gabaon omnes bellando cepit"
      en: "There was hot a city that delivered itself to the children of Israel, except the Hevite, who dwelt in Gabaon: for he took all by fight."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Domini enim sententiae fuerat ut indurarentur corda eorum et pugnarent contra Israhel et caderent et non mererentur ullam clementiam ac perirent sicut praeceperat Dominus Mosi"
      en: "For it was the sentence of the Lord, that their hearts should be hardened, and they should fight against Israel, and fall, and should not deserve any clemency, and should be destroyed as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "in tempore illo venit Iosue et interfecit Enacim de montanis Hebron et Dabir et Anab et de omni monte Iuda et Israhel urbesque eorum delevit"
      en: "At that time Josue came and cut off the Enacims from the mountains, from Hebron, and Dabir, and Anab, and from all the mountain of Juda and Israel, and destroyed their cities."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non reliquit ullum de stirpe Enacim in terra filiorum Israhel absque civitatibus Gaza et Geth et Azoto in quibus solis relicti sunt"
      en: "He left not any of the stock of the Enacims, in the land of the children of Israel: except the cities of Gaza, and Geth, and Azotus, in which alone they were left."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "cepit ergo Iosue omnem terram sicut locutus est Dominus ad Mosen et tradidit eam in possessionem filiis Israhel secundum partes et tribus suas quievitque terra a proeliis"
      en: "So Josue took all the land, as the Lord spoke to Moses, and delivered it in possession to the children of Israel, according to their divisions and tribes. And the land rested from wars."
    status: { la: verified, en: verified }
