# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 51
verses:
  - n: 1
    text:
      la: "Haec dicit Dominus: Ecce ego suscitabo super Babylonem et super habitatores ejus, qui cor suum levaverunt contra me, quasi ventum pestilentem:"
      en: "Thus saith the Lord: Behold I will raise up as it were a pestilential wind against Babylon and against the inhabitants thereof, who have lifted up their heart against me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et mittam in Babylonem ventilatores, et ventilabunt eam et demolientur terram ejus, quoniam venerunt super eam undique in die afflictionis ejus."
      en: "And I will send to Babylon fanners, and they shall fan her, and shall destroy her land: for they are come upon her on every side in the day of her affliction."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Non tendat qui tendit arcum suum, et non ascendat loricatus: nolite parcere juvenibus ejus: interficite omnem militiam ejus."
      en: "Let not him that bendeth, bend his bow, and let not, him go up that is armed with a coat of mail: spare not her young men, destroy all her army."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et cadent interfecti in terra Chaldaeorum, et vulnerati in regionibus ejus."
      en: "And the slain shall fall in the land of the Chaldeans, and the wounded in the regions thereof."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quoniam non fuit viduatus Israel et Juda a Deo suo, Domino exercituum, terra autem eorum repleta est delicto a Sancto Israel."
      en: "For Israel and Juda have not been forsaken by their God the Lord of hosts: but their land hath been filled with sin against the Holy One of Israel."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Fugite de medio Babylonis, et salvet unusquisque animam suam: nolite tacere super iniquitatem ejus, quoniam tempus ultionis est a Domino, vicissitudinem ipse retribuet ei."
      en: "Flee ye from the midst of Babylon, and let every one save his own life: be not silent upon her iniquity: for it is the time of revenge from the Lord, he will I render unto her what she hath deserved."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Calix aureus Babylon in manu Domini, inebrians omnem terram: de vino ejus biberunt gentes, et ideo commotae sunt."
      en: "Babylon hath been a golden cup in the hand of the Lord, that made all the earth drunk: the nations have drunk of her wine, and therefore they have staggered."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Subito cecidit Babylon, et contrita est. Ululate super eam: tollite resinam ad dolorem ejus, si forte sanetur."
      en: "Babylon is suddenly fallen, and destroyed: howl for her, take balm for her pain, if so she may be healed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Curavimus Babylonem, et non est sanata: derelinquamus eam, et eamus unusquisque in terram suam, quoniam pervenit usque ad caelos judicium ejus, et elevatum est usque ad nubes."
      en: "We would have cured Babylon, but she is not healed: let us forsake her, and let us go every man to his own land: because her judgment hath reached even to the heavens, and is lifted up to the clouds."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Protulit Dominus justitias nostras: venite, et narremus in Sion opus Domini Dei nostri."
      en: "The Lord hath brought forth our justices: Come, and let us declare in Sion the work of the Lord our God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Acuite sagittas, implete pharetras: suscitavit Dominus spiritum regum Medorum: et contra Babylonem mens ejus est ut perdat eam, quoniam ultio Domini est, ultio templi sui."
      en: "Sharpen the arrows, fill the quivers, the Lord hath raised up the spirit of the kings of the Medes: and his mind is against Babylon to destroy it, because it is the vengeance of the Lord, the vengeance of his temple."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Super muros Babylonis levate signum, augete custodiam, levate custodes, praeparate insidias, quia cogitavit Dominus, et fecit quaecumque locutus est contra habitatores Babylonis."
      en: "Upon the walls of Babylon set up the standard, strengthen the watch: set up the watchmen, prepare the ambushes: for the Lord hath both purposed, and done all that he spoke against the inhabitants of Babylon."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quae habitas super aquas multas, locuples in thesauris, venit finis tuus, pedalis praecisionis tuae."
      en: "O thou that dwellest upon many waters, rich in treasures, thy end is come for thy entire destruction."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Juravit Dominus exercituum per animam suam: Quoniam replebo te hominibus quasi brucho, et super te celeuma cantabitur."
      en: "The Lord of hosts hath sworn by himself, saying: I will fill thee with men as with locusts, and they shall lift up a joyful shout against thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Qui fecit terram in fortitudine sua, praeparavit orbem in sapientia sua, et prudentia sua extendit caelos."
      en: "He that made the earth by his power, that hath prepared the world by his wisdom, and stretched out the heavens by his understanding."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dante eo vocem, multiplicantur aquae in caelo: qui levat nubes ab extremo terrae, fulgura in pluviam fecit, et produxit ventum de thesauris suis."
      en: "When he uttereth his voice the waters are multiplied in heaven: he lifteth up the clouds from the ends of the earth, he hath turned lightning into rain: and hath brought forth the wind out of his treasures."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Stultus factus est omnis homo a scientia; confusus est omnis conflator in sculptili, quia mendax est conflatio eorum, nec est spiritus in eis."
      en: "Every man is become foolish by his knowledge: every founder is confounded by his idol, for what he hath cast is a lie, and there is no breath in them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vana sunt opera, et risu digna: in tempore visitationis suae peribunt."
      en: "They are vain works, and worthy to be laughed at, in the time of their visitation they shall perish."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Non sicut haec, pars Jacob, quia qui fecit omnia ipse est: et Israel sceptrum haereditatis ejus: Dominus exercituum nomen ejus."
      en: "The portion of Jacob is not like them: for he that made all things he it is, and Israel is the sceptre of his inheritance: the Lord of hosts is his name."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Collidis tu mihi vasa belli: et ego collidam in te gentes, et disperdam in te regna:"
      en: "Thou dashest together for me the weapons of war, and with thee I will dash nations together, and with thee I will destroy kingdoms:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et collidam in te equum et equitem ejus: et collidam in te currum et ascensorem ejus:"
      en: "And with thee I will break in pieces the horse, and his rider, and with thee I will break in pieces the chariot, and him that getteth up into it:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et collidam in te virum et mulierem: et collidam in te senem et puerum: et collidam in te juvenem et virginem:"
      en: "And with thee I will break in pieces man and woman, and with thee I will break in pieces the old man and the child, and with thee I will break in pieces the young man and the virgin:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et collidam in te pastorem et gregem ejus: et collidam in te agricolam et jugales ejus: et collidam in te duces et magistratus:"
      en: "And with thee I will break in pieces the shepherd and his flock, and with thee I will break in pieces the husbandman and his yoke of oxen, and with thee I will break in pieces captains and rulers."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et reddam Babyloni, et cunctis habitatoribus Chaldaeae, omne malum suum, quod fecerunt in Sion, in oculis vestris, ait Dominus."
      en: "And I will render to Babylon, and to all the inhabitants of Chaldea all their evil, that they have done in Sion, before your eyes, saith the Lord."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Ecce ego ad te, mons pestifer, ait Dominus, qui corrumpis universam terram: et extendam manum meam super te, et evolvam te de petris, et dabo te in montem combustionis:"
      en: "Behold I come against thee, thou destroying mountain, saith the Lord, which corruptest the whole earth: and I will stretch out my hand upon thee, and will roll thee down from the rocks, and will make thee a burnt mountain."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et non tollent de te lapidem in angulum, et lapidem in fundamenta: sed perditus in aeternum eris, ait Dominus."
      en: "And they shall not take of thee a stone for the corner, nor a stone for foundations, but thou shalt be destroyed for ever, saith the Lord."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Levate signum in terra, clangite buccina in gentibus, sanctificate super eam gentes, annuntiate contra illam regibus Ararat, Menni, et Ascenez: numerate contra eam Taphsar, adducite equum quasi bruchum aculeatum."
      en: "Set ye up a standard in the land: sound with the trumpet among the nations: prepare the nations against her: call together against her the kings of Ararat, Menni, and Ascenez: number Taphsar against her, bring the horse as the stinging locust."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Sanctificate contra eam gentes, reges Mediae, duces ejus, et universos magistratus ejus, cunctamque terram potestatis ejus."
      en: "Prepare the nations against her, the kings of Media, their captains, and all their rulers, and all the land of their dominion."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et commovebitur terra et conturbabitur, quia evigilabit contra Babylonem cogitatio Domini, ut ponat terram Babylonis desertam et inhabitabilem."
      en: "And the land shall be in a commotion, and shall be troubled: for the design of the Lord against Babylon shall awake, to make the land of Babylon desert and uninhabitable."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Cessaverunt fortes Babylonis a praelio, habitaverunt in praesidiis: devoratum est robur eorum, et facti sunt quasi mulieres: incensa sunt tabernacula ejus, contriti sunt vectes ejus."
      en: "The valiant men of Babylon have forborne to fight, they have dwelt in holds: their strength hath failed, and they are become as women: her dwelling places are burnt, her bars are broken."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Currens obviam currenti veniet, et nuntius obvius nuntianti, ut annuntiet regi Babylonis quia capta est civitas ejus a summo usque ad summum."
      en: "One running post shall meet another, and messenger shall meet messenger: to tell the king of Babylon that his city is taken from one end to the other:"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Et vada praeoccupata sunt, et paludes incensae sunt igni, et viri bellatores conturbati sunt."
      en: "And that the fords are taken, and the marshes are burnt with fire, and the men of war are affrighted."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Quia haec dicit Dominus exercituum, Deus Israel: Filia Babylonis quasi area, tempus triturae ejus: adhuc modicum, et veniet tempus messionis ejus."
      en: "For thus saith the Lord of hosts the God of Israel: The daughter of Babylon is like a threshingfloor, this is the time of her thrashing: yet a little while, and the time of her harvest shall come."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Comedit me, devoravit me Nabuchodonosor rex Babylonis: reddidit me quasi vas inane: absorbuit me quasi draco, replevit ventrem suum teneritudine mea, et ejecit me."
      en: "Nabuchodonosor king of Babylon hath eaten me up, he hath devoured me: he hath made me as an empty vessel: he hath swallowed me up like a dragon, he hath filled his belly with my delicate meats, and he hath cast me out."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Iniquitas adversum me et caro mea super Babylonem, dicit habitatio Sion: et sanguis meus super habitatores Chaldaeae, dicit Jerusalem."
      en: "The wrong done to me, and my flesh be upon Babylon, saith the habitation of Sion: and my blood upon the inhabitants of Chaldea, saith Jerusalem."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Propterea haec dicit Dominus: Ecce ego judicabo causam tuam, et ulciscar ultionem tuam: et desertum faciam mare ejus, et siccabo venam ejus."
      en: "Therefore thus saith the Lord: Behold I will judge thy cause, and will take vengeance for thee, and I will make her sea desolate, and will dry up her spring."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et erit Babylon in tumulos, habitatio draconum, stupor et sibilus, eo quod non sit habitator."
      en: "And Babylon shall be reduced to heaps, a dwelling place for dragons, an astonishment and a hissing, because there is no inhabitant."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Simul ut leones rugient, excutient comas veluti catuli leonum."
      en: "They shall roar together like lions, they shall shake their manes like young lions."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "In calore eorum ponam potus eorum, et inebriabo eos, ut sopiantur, et dormiant somnum sempiternum, et non consurgant, dicit Dominus."
      en: "In their heat I will set them drink: and I will make them drunk, that they may slumber, and sleep an everlasting sleep, and awake no more, saith the Lord."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Deducam eos quasi agnos ad victimam, et quasi arietes cum haedis."
      en: "I will bring them down like lambs to the slaughter, and like rams with kids."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Quomodo capta est Sesach, et comprehensa est inclyta universae terrae! quomodo facta est in stuporem Babylon inter gentes!"
      en: "How is Sesach taken, and the renowned one of all the earth surprised? How is Babylon become an astonishment among the nations?"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Ascendit super Babylonem mare, multitudine fluctuum ejus operta est."
      en: "The sea is come up over Babylon: she is covered with the multitude of the waves thereof."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Factae sunt civitates ejus in stuporem, terra inhabitabilis et deserta, terra in qua nullus habitet, nec transeat per eam filius hominis."
      en: "Her cities are become an astonishment, a land uninhabited and desolate, a land wherein none can dwell, nor son of man pass through it."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et visitabo super Bel in Babylone, et ejiciam quod absorbuerat de ore ejus: et non confluent ad eum ultra gentes, siquidem et murus Babylonis corruet."
      en: "And I will visit against Bel in Babylon, and I will bring forth out of his mouth that which he had swallowed down: and the nations shall no more flow together to him, for the wall also of Babylon shall fall."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Egredimini de medio ejus, populus meus, ut salvet unusquisque animam suam ab ira furoris Domini,"
      en: "Go out of the midst of her, my people: that every man may save his life from the fierce wrath of the Lord."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et ne forte mollescat cor vestrum, et timeatis auditum qui audietur in terra: et veniet in anno auditio, et post hunc annum auditio, et iniquitas in terra, et dominator super dominatorem."
      en: "And lest your hearts faint, and ye fear for the rumour that shall be heard in the land: and a rumour shall come in one year, and after this year another rumour: and iniquity in the land, and ruler upon ruler."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Propterea ecce dies veniunt, et visitabo super sculptilia Babylonis, et omnis terra ejus confundetur, et universi interfecti ejus cadent in medio ejus."
      en: "Therefore behold the days come, and I will visit the idols of Babylon: and her whole land shall be confounded, and all her slain shall fall in the midst of her."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Et laudabunt super Babylonem caeli et terra, et omnia quae in eis sunt, quia ab aquilone venient ei praedones, ait Dominus."
      en: "And the heavens and the earth, and all things that are in them shall give praise for Babylon: for spoilers shall come to her from the north, saith the Lord."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et quomodo fecit Babylon, ut caderent occisi in Israel, sic de Babylone cadent occisi in universa terra."
      en: "And as Babylon caused that there should fall slain in Israel: so of Babylon there shall fall slain in all the earth."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Qui fugistis gladium, venite, nolite stare: recordamini procul Domini, et Jerusalem ascendat super cor vestrum."
      en: "You that have escaped the sword, come away, stand not still: remember the Lord afar off, and let Jerusalem come into your mind."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Confusi sumus, quoniam audivimus opprobrium: operuit ignominia facies nostras, quia venerunt alieni super sanctificationem domus Domini."
      en: "We are confounded, because we have heard reproach: shame hath covered our faces: because strangers are come upon the sanctuaries of the house of the Lord."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Propterea ecce dies veniunt, ait Dominus, et visitabo super sculptilia ejus, et in omni terra ejus mugiet vulneratus."
      en: "Therefore behold the days come, saith the Lord, and I will visit her graven things, and in all her land the wounded shall groan:"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Si ascenderit Babylon in caelum, et firmaverit in excelso robur suum, a me venient vastatores ejus, ait Dominus."
      en: "If Babylon should mount up to heaven, and establish her strength on high: from me there should come spoilers upon her, saith the Lord."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Vox clamoris de Babylone, et contritio magna de terra Chaldaeorum:"
      en: "The noise of a cry from Babylon, and great destruction from the land of the Chaldeans:"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "quoniam vastavit Dominus Babylonem, et perdidit ex ea vocem magnam: et sonabunt fluctus eorum quasi aquae multae, dedit sonitum vox eorum,"
      en: "Because the Lord hath laid Babylon waste, and destroyed out of her the great voice: and their wave shall roar like many waters: their voice hath made a noise:"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "quia venit super eam, id est super Babylonem, praedo, et apprehensi sunt fortes ejus, et emarcuit arcus eorum, quia fortis ultor Dominus reddens retribuet."
      en: "Because the spoiler is come upon her, that is, upon Babylon, and her valiant men are taken, and their bow is weakened, because the Lord, who is a strong revenger, will surely repay."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Et inebriabo principes ejus, et sapientes ejus, et duces ejus, et magistratus ejus, et fortes ejus: et dormient somnum sempiternum, et non expergiscentur, ait rex ( Dominus exercituum nomen ejus)."
      en: "And I will make her princes drunk. and her wise men, and her captains, and her rulers, and her valiant men: and they shall sleep an everlasting sleep, and shall awake no more, saith the king whose name is Lord of hosts."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Haec dicit Dominus exercituum: Murus Babylonis ille latissimus suffossione suffodietur, et portae ejus excelsae igni comburentur, et labores populorum ad nihilum, et gentium in ignem erunt, et disperibunt."
      en: "Thus saith the Lord of hosts: That broad wall of Babylon shall be utterly broken down, and her high gates shall be burnt with fire, and the labours of the people shall come to nothing, and of the nations shall go to the fire, and shall perish."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Verbum quod praecepit Jeremias propheta Saraiae filio Neriae filii Maasiae, cum pergeret cum Sedecia rege in Babylonem, in anno quarto regni ejus: Saraias autem erat princeps prophetiae."
      en: "The word that Jeremias the prophet commanded Saraias the son of Nerias, the son of Maasias, when he went with king Sedecias to Babylon, in the fourth year of his reign: now Saraias was chief over the prophecy."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Et scripsit Jeremias omne malum, quod venturum erat super Babylonem, in libro uno, omnia verba haec quae scripta sunt contra Babylonem."
      en: "And Jeremias wrote in one book all the evil that was to come upon Babylon: all these words that are written against Babylon."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Et dixit Jeremias ad Saraiam: Cum veneris in Babylonem, et videris, et legeris omnia verba haec,"
      en: "And Jeremias said to Saraias: When thou shalt come into Babylon, and shalt see, and shalt read all these words,"
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "dices: Domine, tu locutus es contra locum istum, ut disperderes eum, ne sit qui in eo habitet, ab homine usque ad pecus, et ut sit perpetua solitudo."
      en: "Thou shalt say: O Lord, thou hast spoken against this place to destroy it: so that there should be neither man nor beast to dwell therein, and that it should be desolate for ever."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Cumque compleveris legere librum istum, ligabis ad eum lapidem, et projicies illum in medium Euphraten,"
      en: "And when thou shalt have made an end of reading this book, thou shalt tie a stone to it, and shalt throw it into the midst of the Euphrates:"
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "et dices: Sic submergetur Babylon, et non consurget a facie afflictionis quam ego adduco super eam, et dissolvetur. Hucusque verba Jeremiae."
      en: "And thou shalt say: Thus shall Babylon sink, and she shall not rise up from the affliction that I will bring upon her, and she shall be utterly destroyed. Thus far are the words of Jeremias."
    status: { la: verified, en: verified }
