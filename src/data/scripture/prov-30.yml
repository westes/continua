# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 30
verses:
  - n: 1
    text:
      la: "Verba Congregantis, filii Vomentis. Visio quam locutus est vir cum quo est Deus, et qui Deo secum morante confortatus, ait:"
      en: "The words of Gatherer the son of Vomiter. The vision which the man spoke with whom God is, and who being strengthened by God, abiding with him, said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Stultissimus sum virorum, et sapientia hominum non est mecum."
      en: "I am the most foolish of men, and the wisdom of men is not with me."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Non didici sapientiam, et non novi scientiam sanctorum."
      en: "I have not learned wisdom, and have not known the science of saints."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quis ascendit in caelum, atque descendit? quis continuit spiritum in manibus suis? quis colligavit aquas quasi in vestimento? quis suscitavit omnes terminos terrae? quod nomen est ejus, et quod nomen filii ejus, si nosti?"
      en: "Who hath ascended up into heaven, and descended? who hath held the wind in his hands? who hath bound up the waters together as in a garment? who hath raised up all the borders of the earth? what is his name, and what is the name of his son, if thou knowest?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Omnis sermo Dei ignitus, clypeus est sperantibus in se."
      en: "Every word of God is fire tried: he is a buckler to them that hope in him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ne addas quidquam verbis illius, et arguaris, inveniarisque mendax."
      en: "Add not any thing to his words, lest thou be reproved, and found a liar:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Duo rogavi te: ne deneges mihi antequam moriar:"
      en: "Two things I have asked of thee, deny them not to me before I die."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "vanitatem et verba mendacia longe fac a me; mendicitatem et divitias ne dederis mihi, tribue tantum victui meo necessaria:"
      en: "Remove far from me vanity, and lying words. Give me neither beggary, nor riches: give me only the necessaries of life:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ne forte satiatus illiciar ad negandum, et dicam: Quis est Dominus? aut egestate compulsus, furer, et perjurem nomen Dei mei."
      en: "Lest perhaps being filled, I should be tempted to deny, and say: Who is the Lord? or being compelled by poverty, I should steal, and forswear the name of my God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ne accuses servum ad dominum suum, ne forte maledicat tibi, et corruas."
      en: "Accuse not a servant to his master, lest he curse thee, and thou fall."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Generatio quae patri suo maledicit, et quae matri suae non benedicit;"
      en: "There is a generation that curseth their father, and doth not bless their mother."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "generatio quae sibi munda videtur, et tamen non est lota a sordibus suis;"
      en: "A generation that are pure in their own eyes, and yet are not washed from their filthiness."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "generatio cujus excelsi sunt oculi, et palpebrae ejus in alta surrectae;"
      en: "A generation, whose eyes are lofty, and their eyelids lifted up on high."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "generatio quae pro dentibus gladios habet, et commandit molaribus suis, ut comedat inopes de terra, et pauperes ex hominibus."
      en: "A generation, that for teeth hath swords, and grindeth with their jaw teeth, to devour the needy from off the earth, and the poor from among men."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sanguisugae duae sunt filiae, dicentes: Affer, affer. Tria sunt insaturabilia, et quartum quod numquam dicit: Sufficit."
      en: "The horseleech hath two daughters that say: Bring, bring. There are three things that never are satisfied, and the fourth never saith: It is enough."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Infernus, et os vulvae, et terra quae non satiatur aqua: ignis vero numquam dicit: Sufficit."
      en: "Hell, and the mouth of the womb, and the earth which is not satisfied with water: and the fire never saith: It is enough."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Oculum qui subsannat patrem, et qui despicit partum matris suae, effodiant eum corvi de torrentibus, et comedant eum filii aquilae!"
      en: "The eye that mocketh at his father, and that despiseth the labour of his mother in bearing him, let the ravens of the brooks pick it out, and the young eagles eat it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tria sunt difficilia mihi, et quartum penitus ignoro:"
      en: "Three things are hard to me, and the fourth I am utterly ignorant of."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "viam aquilae in caelo, viam colubri super petram, viam navis in medio mari, et viam viri in adolescentia."
      en: "The way of an eagle in the air, the way of a serpent upon a rock, the way of a ship in the midst of the sea, and the way of a man in youth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Talis est et via mulieris adulterae, quae comedit, et tergens os suum dicit: Non sum operata malum."
      en: "Such is also the way of an adulterous woman, who eateth, and wipeth her mouth, and saith: I have done no evil."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Per tria movetur terra, et quartum non potest sustinere:"
      en: "By three things the earth is disturbed, and the fourth it cannot bear:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "per servum, cum regnaverit; per stultum, cum saturatus fuerit cibo;"
      en: "By a slave when he reigneth: by a fool when he is filled with meat:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "per odiosam mulierem, cum in matrimonio fuerit assumpta, et per ancillam, cum fuerit haeres dominae suae."
      en: "By an odious woman when she is married: and by a bondwoman when she is heir to her mistress."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Quatuor sunt minima terrae, et ipsa sunt sapientiora sapientibus:"
      en: "There are four very little things of the earth, and they are wiser than the wise:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "formicae, populus infirmus, qui praeparat in messe cibum sibi;"
      en: "The ants, a feeble people, which provide themselves food in the harvest:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "lepusculus, plebs invalida, qui collocat in petra cubile suum;"
      en: "The rabbit, a weak people, which maketh its bed in the rock:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "regem locusta non habet, et egreditur universa per turmas suas;"
      en: "The locust hath no king, yet they all go out by their bands."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "stellio manibus nititur, et moratur in aedibus regis."
      en: "The stellio supporteth itself on hands, and dwelleth in kings' houses."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Tria sunt quae bene gradiuntur, et quartum quod incedit feliciter:"
      en: "There are three things, which go well, and the fourth that walketh happily:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "leo, fortissimus bestiarum, ad nullius pavebit occursum;"
      en: "A lion, the strongest of beasts, who hath no fear of any thing he meeteth:"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "gallus succinctus lumbos, et aries; nec est rex, qui resistat ei."
      en: "A cock girded about the loins: and a ram: and a king, whom none can resist."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Est qui stultus apparuit postquam elevatus est in sublime; si enim intellexisset, ori suo imposuisset manum."
      en: "There is that hath appeared a fool after he was lifted up on high: for if he had understood, he would have laid his hand upon his mouth."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Qui autem fortiter premit ubera ad eliciendum lac exprimit butyrum; et qui vehementer emungit elicit sanguinem; et qui provocat iras producit discordias."
      en: "And he that strongly squeezeth the paps to bring out milk, straineth out butter: and he that violently bloweth his nose, bringeth out blood: and he that provoketh wrath bringeth forth strife."
    status: { la: verified, en: verified }
