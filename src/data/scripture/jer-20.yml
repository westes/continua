# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jer
chapter: 20
verses:
  - n: 1
    text:
      la: "et audivit Phassur filius Emmer sacerdos qui constitutus erat princeps in domo Domini Hieremiam prophetantem sermones istos"
      en: "Now Phassur the son of Emmur, the priest, who was appointed chief in the house of the Lord, heard Jeremias prophesying these words."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et percussit Phassur Hieremiam prophetam et misit eum in nervum quod erat in porta Beniamin superiori in domo Domini"
      en: "And Phassur struck Jeremias the prophet, and put him in the stocks, that were in the upper gate of Benjamin, in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "cumque inluxisset in crastinum eduxit Phassur Hieremiam de nervo et dixit ad eum Hieremias non Phassur vocavit Dominus nomen tuum sed Pavorem undique"
      en: "And when it was light the next day, Phassur brought Jeremias out of the stocks. And Jeremias said to him: The Lord hath not called thy name Phassur, but fear on every side."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia haec dicit Dominus ecce ego dabo te in pavorem te et omnes amicos tuos et corruent gladio inimicorum suorum et oculi tui videbunt et omnem Iudam dabo in manu regis Babylonis et traducet eos in Babylonem et percutiet eos gladio"
      en: "For thus saith the Lord: Behold I will deliver thee up to fear, thee and all thy friends: and they shall fall by the sword of their enemies, and thy eyes shall see it, and I will give all Juda into the hand of the king of Babylon: and he shall strike them with the sword."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dabo universam substantiam civitatis huius et omnem laborem eius omneque pretium et cunctos thesauros regum Iuda dabo in manu inimicorum eorum et diripient eos et tollent et ducent in Babylonem"
      en: "And I will give all the substance of this city, and all its labour, and every precious thing thereof, and all the treasures of the kings of Juda will I give into the hands of their enemies: and they shall pillage them, and take them away, and carry them to Babylon."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "tu autem Phassur et omnes habitatores domus tuae ibitis in captivitatem et in Babylonem venies et ibi morieris ibique sepelieris tu et omnes amici tui quibus prophetasti mendacium"
      en: "But thou, Phassur, and all that dwell in thy house, shall go into captivity, and thou shalt go to Babylon, and there thou shalt die, and there thou shalt be buried, thou and all thy friends, to whom thou hast prophesied a lie."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "seduxisti me Domine et seductus sum fortior me fuisti et invaluisti factus sum in derisum tota die omnes subsannant me"
      en: "Thou hast deceived me, O Lord, and I am deceived: thou hast been stronger than I, and thou hast prevailed. I am become a laughing-stock all the day, all scoff at me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quia iam olim loquor vociferans iniquitatem et vastitatem clamito et factus est mihi sermo Domini in obprobrium et in derisum tota die"
      en: "For I am speaking now this long time, crying out against iniquity, and I often proclaim devistation: and the word of the Lord is made a reproach to me, and a derision all the day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixi non recordabor eius neque loquar ultra in nomine illius et factus est in corde meo quasi ignis exaestuans claususque in ossibus meis et defeci ferre non sustinens"
      en: "Then I said: I will not make mention of him, nor speak any more in his name: and there came in my heart as a burning fire shut up in my bones, and I was wearied, not being able to bear it."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "audivi enim contumelias multorum et terrorem in circuitu persequimini et persequamur eum ab omnibus viris qui erant pacifici mei et custodientes latus meum si quo modo decipiatur et praevaleamus adversus eum et consequamur ultionem ex eo"
      en: "For I heard the reproaches of many, and terror on every side: Persecute him, and let us persecute him: from all the men that were my familiars, and continued at my side: if by any means he may be deceived, and we may prevail against him, and be revenged on him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dominus autem mecum est quasi bellator fortis idcirco qui persequuntur me cadent et infirmi erunt confundentur vehementer quia non intellexerunt obprobrium sempiternum quod numquam delebitur"
      en: "But the Lord is with me as a strong warrior: therefore they that persecute me shall fall, and shall be weak: they shall be greatly confounded, because they have not understood the everlasting reproach, which never shall be effaced."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et tu Domine exercituum probator iusti qui vides renes et cor videam quaeso ultionem tuam ex eis tibi enim revelavi causam meam"
      en: "And thou, O Lord of hosts, prover of the just, who seest the reins and the heart: let me see, I beseech thee, thy vengeance on them: for to thee I have laid open my cause."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cantate Domino laudate Dominum quia liberavit animam pauperis de manu malorum"
      en: "Sing ye to the Lord, praise the Lord: because he hath delivered the soul of the poor out of the hand of the wicked."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "maledicta dies in qua natus sum dies in qua peperit me mater mea non sit benedicta"
      en: "Cursed be the day wherein I was borne: let not the day in which my mother bore me, be blessed."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "maledictus vir qui adnuntiavit patri meo dicens natus est tibi puer masculus et quasi gaudio laetificavit eum"
      en: "Cursed be the man that brought the tidings to my father, saying: A man child is born to thee: and made him greatly rejoice."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sit homo ille ut sunt civitates quas subvertit Dominus et non paenituit eum audiat clamorem mane et ululatum in tempore meridiano"
      en: "Let that man be as the cities that the Lord hath overthrown, and hath not repented: let him hear a cry in the morning, and howling at noontide:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "qui non me interfecit a vulva ut fieret mihi mater mea sepulchrum et vulva eius conceptus aeternus"
      en: "Who slew me not from the womb, that my mother might have been my grave, and her womb an everlasting conception."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quare de vulva egressus sum ut viderem laborem et dolorem et consumerentur in confusione dies mei"
      en: "Why came I out of the womb, to see labour and sorrow, and that my days should be spent in confusion?"
    status: { la: verified, en: verified }
