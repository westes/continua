# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 5
verses:
  - n: 1
    text:
      la: "Et venerunt universae tribus Israel ad David in Hebron, dicentes: Ecce nos, os tuum et caro tua sumus."
      en: "Then all the tribes of Israel came to David in Hebron, saying: Behold we are thy bone and thy flesh."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sed et heri et nudiustertius cum esset Saul rex super nos, tu eras educens et reducens Israel: dixit autem Dominus ad te: Tu pasces populum meum Israel, et tu eris dux super Israel."
      en: "Moreover yesterday also and the day before, when Saul was king over us, thou wast he that did lead out and bring in Israel: and the Lord said to thee: Thou shalt feed my people Israel, and thou shalt be prince over Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Venerunt quoque et seniores Israel ad regem in Hebron, et percussit cum eis rex David foedus in Hebron coram Domino: unxeruntque David in regem super Israel."
      en: "The ancients also of Israel came to the king to Hebron, and king David made a league with them in Hebron before the Lord: and they anointed David to be king over Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Filius triginta annorum erat David, cum regnare coepisset, et quadraginta annis regnavit."
      en: "David was thirty years old when he began to reign, and he reigned forty years."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "In Hebron regnavit super Judam septem annis et sex mensibus: in Jerusalem autem regnavit triginta tribus annis super omnem Israel et Judam."
      en: "In Hebron he reigned over Juda seven years and six months: and in Jerusalem he reigned three and thirty years over all Israel and Juda."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et abiit rex, et omnes viri qui erant cum eo, in Jerusalem, ad Jebusaeum habitatorem terrae: dictumque est David ab eis: Non ingredieris huc, nisi abstuleris caecos et claudos dicentes: Non ingredietur David huc."
      en: "And the king and all the men that were with him went to Jerusalem to the Jebusites the inhabitants of the land: and they said to David: Thou shalt not come in hither unless thou take away the blind and the lame that say: David shall not come in hither."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Cepit autem David arcem Sion, haec est civitas David."
      en: "But David took the castle of Sion, the same is the city of David."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Proposuerat enim David in die illa praemium, qui percussisset Jebusaeum, et tetigisset domatum fistulas, et abstulisset caecos et claudos odientes animam David. Idcirco dicitur in proverbio: Caecus et claudus non intrabunt in templum."
      en: "For David had offered that day a reward to whosoever should strike the Jebusites and get up to the gutters of the tops of the houses, and take away the blind and the lame that hated the soul of David: therefore it is said in the proverb: The blind and the lame shall not come into the temple."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Habitavit autem David in arce, et vocavit eam, Civitatem David: et aedificavit per gyrum a Mello et intrinsecus."
      en: "And David dwelt in the castle, and called it, The city of David: and built round about from Mello and inwards."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ingrediebatur proficiens atque succrescens, et Dominus Deus exercituum erat cum eo."
      en: "And he went on prospering and growing up, and the Lord God of hosts was with him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Misit quoque Hiram rex Tyri nuntios ad David, et ligna cedrina, et artifices lignorum, artificesque lapidum ad parietes: et aedificaverunt domum David."
      en: "And Hiram the king of Tyre sent messengers to David, and cedar trees, and carpenters, and masons for walls: and they built a house for David."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et cognovit David quoniam confirmasset eum Dominus regem super Israel, et quoniam exaltasset regnum ejus super populum suum Israel."
      en: "And David knew that the Lord had confirmed him king over Israel, and that he had exalted his kingdom over his people Israel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Accepit ergo David adhuc concubinas et uxores de Jerusalem, postquam venerat de Hebron: natique sunt David et alii filii et filiae:"
      en: "And David took more concubines and wives of Jerusalem, after he was come from Hebron: and there were born to David other sons also and daughters:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et haec nomina eorum, qui nati sunt ei in Jerusalem: Samua, et Sobab, et Nathan, et Salomon,"
      en: "And these are the names of them, that were born to him in Jerusalem, Samua, and Sobab, and Nathan, and Solomon,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et Jebahar, et Elisua, et Nepheg,"
      en: "And Jebahar, and Elisua, and Nepheg,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Japhia, et Elisama, et Elioda, et Eliphaleth."
      en: "And Japhia, and Elisama, and Elioda, and Eliphaleth."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Audierunt ergo Philisthiim quod unxissent David in regem super Israel: et ascenderunt universi ut quaererent David: quod cum audisset David, descendit in praesidium."
      en: "And the Philistines heard that they had anointed David to be king over Israel: and they all came to seek David: and when David heard of it, he went down to a strong hold."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Philisthiim autem venientes diffusi sunt in valle Raphaim."
      en: "And the Philistines coming spread themselves in the valley of Raphaim."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et consuluit David Dominum, dicens: Si ascendam ad Philisthiim? et si dabis eos in manu mea? Et dixit Dominus ad David: Ascende, quia tradens dabo Philisthiim in manu tua."
      en: "And David consulted the Lord, saying: Shall I go up to the Philistines? and wilt thou deliver them into my hand? And the Lord said to David: Go up, for I will surely deliver the Philistines into thy hand."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Venit ergo David in Baal Pharasim: et percussit eos ibi, et dixit: Divisit Dominus inimicos meos coram me, sicut dividuntur aquae. Propterea vocatum est nomen loci illius, Baal Pharasim."
      en: "And David came to Baal Pharisim: and defeated them there, and he said: The Lord hath divided my enemies before me, as waters are divided. Therefore the name of the place was called Baal Pharisim."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et reliquerunt ibi sculptilia sua, quae tulit David, et viri ejus."
      en: "And they left there their idols: which David and his men took away."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et addiderunt adhuc Philisthiim ut ascenderent, et diffusi sunt in valle Raphaim."
      en: "And the Philistines came up again and spread themselves in the valley of Raphaim."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Consuluit autem David Dominum: Si ascendam contra Philisthaeos, et tradas eos in manus meas? Qui respondit: Non ascendas contra eos, sed gyra post tergum eorum, et venies ad eos ex adverso pyrorum."
      en: "And David consulted the Lord: Shall I go up against the Philistines, and wilt thou deliver them into my hands? He answered: Go not up against them, but fetch a compass behind them, and thou shalt come upon them over against the pear trees."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et cum audieris sonitum gradientis in cacumine pyrorum, tunc inibis praelium: quia tunc egredietur Dominus ante faciem tuam, ut percutiat castra Philisthiim."
      en: "And when thou shalt hear the sound of one going in the tops of the pear trees, then shalt thou join battle: for then will the Lord go out before thy face to strike the army of the Philistines."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Fecit itaque David sicut praeceperat ei Dominus, et percussit Philisthiim de Gabaa, usque dum venias Gezer."
      en: "And David did as the Lord had commanded him, and he smote the Philistines from Gabaa until thou come to Gezer."
    status: { la: verified, en: verified }
