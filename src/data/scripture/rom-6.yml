# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: rom
chapter: 6
verses:
  - n: 1
    text:
      la: "Quid ergo dicemus? permanebimus in peccato ut gratia abundet?"
      en: "What shall we say, then? shall we continue in sin, that grace may abound?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Absit. Qui enim mortui sumus peccato, quomodo adhuc vivemus in illo?"
      en: "God forbid. For we that are dead to sin, how shall we live any longer therein?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "an ignoratis quia quicumque baptizati sumus in Christo Jesu, in morte ipsius baptizati sumus?"
      en: "Know you not that all we, who are baptized in Christ Jesus, are baptized in his death?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Consepulti enim sumus cum illo per baptismum in mortem: ut quomodo Christus surrexit a mortuis per gloriam Patris, ita et nos in novitate vitae ambulemus."
      en: "For we are buried together with him by baptism into death; that as Christ is risen from the dead by the glory of the Father, so we also may walk in newness of life."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Si enim complantati facti sumus similitudini mortis ejus: simul et resurrectionis erimus."
      en: "For if we have been planted together in the likeness of his death, we shall be also in the likeness of his resurrection."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Hoc scientes, quia vetus homo noster simul crucifixus est, ut destruatur corpus peccati, et ultra non serviamus peccato."
      en: "Knowing this, that our old man is crucified with him, that the body of sin may be destroyed, to the end that we may serve sin no longer."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui enim mortuus est, justificatus est a peccato."
      en: "For he that is dead is justified from sin."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si autem mortui sumus cum Christo, credimus quia simul etiam vivemus cum Christo,"
      en: "Now if we be dead with Christ, we believe that we shall live also together with Christ:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "scientes quod Christus resurgens ex mortuis jam non moritur: mors illi ultra non dominabitur."
      en: "Knowing that Christ rising again from the dead, dieth now no more, death shall no more have dominion over him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quod enim mortuus est peccato, mortuus est semel: quod autem vivit, vivit Deo."
      en: "For in that he died to sin, he died once; but in that he liveth, he liveth unto God:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ita et vos existimate vos mortuos quidem esse peccato, viventes autem Deo, in Christo Jesu Domino nostro."
      en: "So do you also reckon, that you are dead to sin, but alive unto God, in Christ Jesus our Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Non ergo regnet peccatum in vestro mortali corpore ut obediatis concupiscentiis ejus."
      en: "Let no sin therefore reign in your mortal body, so as to obey the lusts thereof."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sed neque exhibeatis membra vestra arma iniquitatis peccato: sed exhibete vos Deo, tamquam ex mortuis viventes: et membra vestra arma justitiae Deo."
      en: "Neither yield ye your members as instruments of iniquity unto sin; but present yourselves to God, as those that are alive from the dead, and your members as instruments of justice unto God."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Peccatum enim vobis non dominabitur: non enim sub lege estis, sed sub gratia."
      en: "For sin shall not have dominion over you; for you are not under the law, but under grace."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quid ergo? peccabimus, quoniam non sumus sub lege, sed sub gratia? Absit."
      en: "What then? Shall we sin, because we are not under the law, but under grace? God forbid."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Nescitis quoniam cui exhibetis vos servos ad obediendum, servi estis ejus, cui obeditis, sive peccati ad mortem, sive obeditionis ad justitiam?"
      en: "Know you not, that to whom you yield yourselves servants to obey, his servants you are whom you obey, whether it be of sin unto death, or of obedience unto justice."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Gratias autem Deo quod fuistis servi peccati, obedistis autem ex corde in eam formam doctrinae, in quam traditi estis."
      en: "But thanks be to God, that you were the servants of sin, but have obeyed from the heart, unto that form of doctrine, into which you have been delivered."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Liberati autem a peccato, servi facti estis justitiae."
      en: "Being then freed from sin, we have been made servants of justice."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Humanum dico, propter infirmitatem carnis vestrae: sicut enim exhibuistis membra vestra servire immunditiae, et iniquitati ad iniquitatem, ita nunc exhibete membra vestra servire justitiae in santificationem."
      en: "I speak an human thing, because of the infirmity of your flesh. For as you have yielded your members to serve uncleanness and iniquity, unto iniquity; so now yield your members to serve justice, unto sanctification."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cum enim servi essetis peccati, liberi fuistis justitiae."
      en: "For when you were the servants of sin, you were free men to justice."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quem ergo fructum habuistis tunc in illis, in quibus nunc erubescitis? nam finis illorum mors est."
      en: "What fruit therefore had you then in those things, of which you are now ashamed? For the end of them is death."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Nunc vero liberati a peccato, servi autem facti Deo, habetis fructum vestrum in santificationem, finem vero vitam aeternam."
      en: "But now being made free from sin, and become servants to God, you have your fruit unto sanctification, and the end life everlasting."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Stipendia enim peccati, mors. Gratia autem Dei, vita aeterna, in Christo Jesu Domino nostro."
      en: "For the wages of sin is death. But the grace of God, life everlasting, in Christ Jesus our Lord."
    status: { la: verified, en: verified }
