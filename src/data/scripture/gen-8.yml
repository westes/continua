# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 8
verses:
  - n: 1
    text:
      la: "recordatus autem Deus Noe cunctarumque animantium et omnium iumentorum quae erant cum eo in arca adduxit spiritum super terram et inminutae sunt aquae"
      en: "And God remembered Noe, and all the living creatures, and all the cattle which were with him in the ark, and brought a wind upon the earth, and the waters were abated."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et clausi sunt fontes abyssi et cataractae caeli et prohibitae sunt pluviae de caelo"
      en: "The fountains also of the deep, and the flood gates of heaven were shut up, and the rain from heaven was restrained."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "reversaeque aquae de terra euntes et redeuntes et coeperunt minui post centum quinquaginta dies"
      en: "And the waters returned from off the earth going and coming: and they began to be abated after a hundred and fifty days."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "requievitque arca mense septimo vicesima septima die mensis super montes Armeniae"
      en: "And the ark rested in the seventh month, the seven and twentieth day of the month, upon the mountains of Armenia."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "at vero aquae ibant et decrescebant usque ad decimum mensem decimo enim mense prima die mensis apparuerunt cacumina montium"
      en: "And the waters were going and decreasing until the tenth month: for in the tenth month, the first day of the month, the tops of the mountains appeared."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "cumque transissent quadraginta dies aperiens Noe fenestram arcae quam fecerat dimisit corvum"
      en: "And after that forty days were passed, Noe, opening the window of the ark which he had made, sent forth a raven:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui egrediebatur et revertebatur donec siccarentur aquae super terram"
      en: "Which went forth and did not return, till the waters were dried up upon the earth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "emisit quoque columbam post eum ut videret si iam cessassent aquae super faciem terrae"
      en: "He sent forth also a dove after him, to see if the waters had now ceased upon the face of the earth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quae cum non invenisset ubi requiesceret pes eius reversa est ad eum in arcam aquae enim erant super universam terram extenditque manum et adprehensam intulit in arcam"
      en: "But she, not finding where her foot might rest, returned to him into the ark: for the waters were upon the whole earth: and he put forth his hand, and caught her, and brought her into the ark."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "expectatis autem ultra septem diebus aliis rursum dimisit columbam ex arca"
      en: "And having waited yet seven other days, he again sent forth the dove out of the ark."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "at illa venit ad eum ad vesperam portans ramum olivae virentibus foliis in ore suo intellexit ergo Noe quod cessassent aquae super terram"
      en: "And she came to him in the evening, carrying a bough of an olive tree, with green leaves, in her mouth. Noe therefore understood that the waters were ceased upon the earth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "expectavitque nihilominus septem alios dies et emisit columbam quae non est reversa ultra ad eum"
      en: "And he stayed yet other seven days: and he sent forth the dove, which returned not any more unto him."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "igitur sescentesimo primo anno primo mense prima die mensis inminutae sunt aquae super terram et aperiens Noe tectum arcae aspexit viditque quod exsiccata esset superficies terrae"
      en: "Therefore in the six hundreth and first year, the first month, the first day of the month, the waters were lessened upon the earth, and Noe opening the covering of the ark, looked, and saw that the face of the earth was dried."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "mense secundo septima et vicesima die mensis arefacta est terra"
      en: "In the second month, the seven and twentieth day of the month, the earth was dried."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "locutus est autem Deus ad Noe dicens"
      en: "And God spoke to Noe, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "egredere de arca tu et uxor tua filii tui et uxores filiorum tuorum tecum"
      en: "Go out of the ark, thou and thy wife, thy sons, and the wives of thy sons with thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "cuncta animantia quae sunt apud te ex omni carne tam in volatilibus quam in bestiis et in universis reptilibus quae reptant super terram educ tecum et ingredimini super terram crescite et multiplicamini super eam"
      en: "All livings things that are with thee of all flesh, as well in fowls as in beasts, and all creeping things that creep upon the earth, bring out with thee, and go ye upon the earth: increased and multiply upon it."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "egressus est ergo Noe et filii eius uxor illius et uxores filiorum eius cum eo"
      en: "So Noe went out, he and his sons: his wife, and the wives of his sons with him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "sed et omnia animantia iumenta et reptilia quae repunt super terram secundum genus suum arcam egressa sunt"
      en: "And all living things, and cattle, and creeping things that creep upon the earth, according to their kinds, went out of the ark."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "aedificavit autem Noe altare Domino et tollens de cunctis pecoribus et volucribus mundis obtulit holocausta super altare"
      en: "And Noe built an altar unto the Lord: and taking of all cattle and fowls that were clean, offered holocausts upon the altar."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "odoratusque est Dominus odorem suavitatis et ait ad eum nequaquam ultra maledicam terrae propter homines sensus enim et cogitatio humani cordis in malum prona sunt ab adulescentia sua non igitur ultra percutiam omnem animantem sicut feci"
      en: "And the Lord smelled a sweet savour, and said: I will no more curse the earth for the sake of man: for the imagination and thought of man's heart are prone to evil from his youth: therefore I will no more destroy every living soul as I have done."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cunctis diebus terrae sementis et messis frigus et aestus aestas et hiemps nox et dies non requiescent"
      en: "All the days of the earth, seedtime and harvest, cold and heat, summer and winter, night and day, shall not cease."
    status: { la: verified, en: verified }
