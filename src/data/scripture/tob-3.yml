# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: tob
chapter: 3
verses:
  - n: 1
    text:
      la: "tunc Tobias ingemuit et coepit orare cum lacrimis"
      en: "Then Tobias sighed, and began to pray with tears,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dicens iustus es Domine et omnia iudicia tua iusta sunt et omnes viae tuae misericordia et veritas et iudicium"
      en: "Saying: Thou art just, O Lord, and all thy judgments are just, and all thy ways mercy, and truth, and judgment:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et nunc Domine memor esto mei ne vindictam sumas de peccatis meis neque reminiscaris delicta mea vel parentum meorum"
      en: "And now, O Lord, think of me, and take not revenge of my sins, neither remember my offenses, nor those of my parents."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quoniam non oboedivimus praeceptis tuis et traditi sumus in direptionem et captivitatem et mortem et in fabulam et in inproperium omnibus nationibus in quibus dispersisti nos"
      en: "For we have not obeyed thy commandments, therefore are we delivered to spoil and to captivity, and death, and are made a fable, and a reproach to all nations, amongst which thou hast scattered us."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et nunc Domine magna iudicia tua quia non egimus secundum praecepta tua et non ambulavimus sinceriter coram te"
      en: "And now, O Lord, great are thy judgments, because we have not done according to thy precepts, and have not walked sincerely before thee:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et nunc Domine secundum voluntatem tuam fac mecum et praecipe in pace recipi spiritum meum expedit enim mihi mori magis quam vivere"
      en: "And now, O Lord, do with me according to thy will, and command my spirit to be received in peace: for it is better for me to die, than to live."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "eadem itaque die contigit ut Sarra filia Raguhel in civitate Medorum ut et ipsa audiret inproperium ab una ex ancillis patris sui"
      en: "Now it happened on the same day, that Sara daughter of Raguel, in Rages a city of the Medes, received a reproach from one of her father's servant maids,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quoniam tradita fuerat septem viris et daemonium nomine Asmodeus occiderat eos mox ut ingressi fuissent ad eam"
      en: "Because she had been given to seven husbands, and a devil named Asmodeus had killed them, at their first going in unto her."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ergo cum pro culpa sua increparet puellam respondit ei dicens amplius ex te non videamus filium aut filiam super terram interfectrix virorum tuorum"
      en: "So when she reproved the maid for her fault, she answered her, saying: May we never see son, or daughter of thee upon the earth, thou murderer of thy husbands."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "numquid et me occidere vis sicut et iam septem occidisti ad hanc vocem perrexit in superiori cubiculo domus suae et tribus diebus et tribus noctibus non manducavit neque bibit"
      en: "Wilt thou kill me also, as thou hast already killed seven husbands? At these words she went into an upper chamber of her house: and for three days and three nights did neither eat nor drink:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sed in oratione persistens lacrimis deprecabatur Dominum ut ab isto inproperio liberaret eam"
      en: "But continuing in prayer with tears besought God, that he would deliver her from this reproach."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "factum est autem tertia die dum conpleret orationem benedicens Dominum"
      en: "And it came to pass on the third day, when she was making an end of her prayer, blessing the Lord,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit benedictum est nomen tuum Deus patrum nostrorum qui cum iratus fueris misericordiam facies et in tempore tribulationis peccata dimittis his qui invocant te"
      en: "She said: Blessed is thy name, O God of our fathers: who when thou hast been angry, wilt shew mercy, and in the time of tribulation forgivest the sins of them that call upon thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ad te Domine faciem meam converto ad te oculos meos converto"
      en: "To thee, O Lord, I turn my face, to thee I direct my eyes."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "peto Domine ut de vinculo inproperii huius absolvas me aut certe desuper terra eripias me"
      en: "I beg, O Lord, that thou loose me from the bond of this reproach, or else take me away from the earth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tu scis Domine quia numquam concupivi virum et mundam servavi animam meam ab omni concupiscentia"
      en: "Thou knowest, O Lord, that I never coveted a husband, and have kept my soul clean from all lust."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "numquam cum ludentibus miscui me neque cum his qui in levitate ambulant participem me praebui"
      en: "Never have I joined myself with them that play: neither have I made myself partaker with them that walk in lightness."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "virum autem cum timore tuo non libidine mea consensi suscipere"
      en: "But a husband I consented to take, with thy fear, not with my lust."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et aut ego indigna fui illis aut illi mihi forsitan digni non fuerunt quia forsitan viro alio conservasti me"
      en: "And either I was unworthy of them, or they perhaps were not worthy of me: because perhaps thou hast kept me for another man."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "non est enim in hominis potestate consilium tuum"
      en: "For thy counsel is not in man's power."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "hoc autem certum habet omnis qui colit te quia vita eius si in probatione fuerit coronabitur si autem in tribulatione fuerit liberabitur et si in correptione fuerit ad misericordiam tuam pervenire licebit"
      en: "But this every one is sure of that worshippeth thee, that his life, if it be under trial, shall be crowned: and if it be under tribulation, it shall be delivered: and if it be under correction, it shall be allowed to come to thy mercy."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "non enim delectaris in perditionibus nostris quia post tempestatem tranquillum facis et post lacrimationem et fletum exultationem infundis"
      en: "For thou art not delighted in our being lost: because after a storm thou makest a calm, and after tears and weeping thou pourest in joyfulness."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sit nomen tuum Deus Israhel benedictum in saecula"
      en: "Be thy name, O God of Israel, blessed for ever."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "in illo tempore exauditae sunt preces amborum in conspectu gloriae summi Dei"
      en: "At that time the prayers of them both were heard in the sight of the glory of the most high God:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et missus est angelus Domini sanctus Rafahel ut curaret ambos quorum uno tempore fuerat oratio in conspectu Domini recitata"
      en: "And the holy angel of the Lord, Raphael was sent to heal them both, whose prayers at one time were rehearsed in the sight of the Lord."
    status: { la: verified, en: verified }
