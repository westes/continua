# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 39
verses:
  - n: 1
    text:
      la: "In tempore illo misit Merodach Baladan, filius Baladan, rex Babylonis, libros et munera ad Ezechiam; audierat enim quod aegrotasset et convaluisset."
      en: "At that time Merodach Baladan, the son of Baladan king of Babylon, sent letters and presents to Ezechias: for he had heard that he had been sick and was recovered."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Laetatus est autem super eis Ezechias, et ostendit eis cellam aromatum, et argenti, et auri, et odoramentorum, et unguenti optimi, et omnes apothecas supellectilis suae, et universa quae inventa sunt in thesauris ejus. Non fuit verbum quod non ostenderet eis Ezechias in domo sua, et in omni potestate sua."
      en: "And Ezechias rejoiced at their coming, and he shewed them the storehouses of his aromatical spices, and of the silver, and of the gold, and of the sweet odours, and of the precious ointment, and all the storehouses of his furniture, and all things that were found in his treasures. There was nothing in his house, nor in all his dominion that Ezechias shewed them not."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Introivit autem Isaias propheta ad Ezechiam regem, et dixit ei: Quid dixerunt viri isti, et unde venerunt ad te? Et dixit Ezechias: De terra longinqua venerunt ad me, de Babylone."
      en: "Then Isaias the prophet came to king Ezechias, and said to him: What said these men, and from whence came they to thee? And Ezechias said: From a far country they came to me, from Babylon."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dixit: Quid viderunt in domo tua? Et dixit Ezechias: Omnia quae in domo mea sunt viderunt; non fuit res quam non ostenderim eis in thesauris meis."
      en: "And he said: What saw they in thy house? And Ezechias said: All things that are in my house have they seen, there was not any thing which I have not shewn them in my treasures."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et dixit Isaias ad Ezechiam: Audi verbum Domini exercituum."
      en: "And Isaias said to Ezechias: Hear the word of the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ecce dies venient, et auferentur omnia quae in domo tua sunt, et quae thesaurizaverunt patres tui usque ad diem hanc, in Babylonem; non relinquetur quidquam, dicit Dominus."
      en: "Behold the days shall come, that all that is in thy house, and that thy fathers have laid up in store until this day, shall be carried away into Babylon: there shall not any thing be left, saith the Lord."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et de filiis tuis, qui exibunt de te, quos genueris, tollent, et erunt eunuchi in palatio regis Babylonis."
      en: "And of thy children, that shall issue from thee, whom thou shalt beget, they shall take away, and they shall be eunuchs in the palace of the king of Babylon."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et dixit Ezechias ad Isaiam: Bonum verbum Domini, quod locutus est. Et dixit: Fiat tantum pax et veritas in diebus meis!"
      en: "And Ezechias said to Isaias: The word of the Lord, which he hath spoken, is good. And he said: Only let peace and truth be in my days."
    status: { la: verified, en: verified }
