# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 4
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen et Aaron, dicens:"
      en: "And the Lord spoke to Moses, and Aaron, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tolle summam filiorum Caath de medio Levitarum per domos et familias suas,"
      en: "Take the sum of the sons of Caath from the midst of the Levites, by their houses and families."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "a trigesimo anno et supra, usque ad quinquagesimum annum, omnium qui ingrediuntur ut stent et ministrent in tabernaculo foederis."
      en: "From thirty years old and upward, to fifty years old, of all that go in to stand and to minister in the tabernacle of the covenant."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Hic est cultus filiorum Caath: tabernaculum foederis, et Sanctum sanctorum"
      en: "This is the service of the sons of Caath:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ingredientur Aaron et filii ejus, quando movenda sunt castra, et deponent velum quod pendet ante fores, involventque eo arcam testimonii,"
      en: "When the camp is to set forward, Aaron and his sons shall go into the tabernacle of the covenant, and the holy of holies, and shall take down the veil that hangeth before the door, and shall wrap up the ark of the testimony in it,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et operient rursum velamine janthinarum pellium, extendentque desuper pallium totum hyacinthinum, et inducent vectes."
      en: "And shall cover it again with a cover of violet skins, and shall spread over it a cloth all of violet, and shall put in the bars."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Mensam quoque propositionis involvent hyacinthino pallio, et ponent cum ea thuribula et mortariola, cyathos et crateras ad liba fundenda: panes semper in ea erunt:"
      en: "They shall wrap up also the table of proposition in a cloth of violet, and shall put with it the censers and little mortars, the cups and bowls to pour out the libations: the loaves shall be always on it:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "extendentque desuper pallium coccineum, quod rursum operient velamento janthinarum pellium, et inducent vectes."
      en: "And they shall spread over it a cloth of scarlet, which again they shall cover with a covering of violet skins, and shall put in the bars."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Sument et pallium hyacinthinum, quo operient candelabrum cum lucernis et forcipibus suis et emunctoriis et cunctis vasis olei, quae ad cocinnandas lucernas necessaria sunt:"
      en: "They shall take also a cloth of violet wherewith they shall cover the candlestick with the lamps and tongs thereof and the snuffers and all the oil vessels, which are necessary for the dressing of the lamps:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et super omnia ponent operimentum janthinarum pellium, et inducent vectes."
      en: "And over all they shall put a cover of violet skins and put in the bars."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Necnon et altare aureum involvent hyacinthino vestimento, et extendent desuper operimentum janthinarum pellium, inducentque vectes."
      en: "And they shall wrap up the golden altar also in a cloth of violet, and shall spread over it a cover of violet skins, and put in the bars."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Omnia vasa, quibus ministratur in sanctuario, involvent hyacinthino pallio, et extendent desuper operimentum janthinarum pellium, inducentque vectes."
      en: "All the vessels wherewith they minister in the sanctuary, they shall wrap up in a cloth of violet, and shall spread over it a cover of violet skins, and put in the bars."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sed et altare mundabunt cinere, et involvent illud purpureo vestimento,"
      en: "They shall cleanse the altar also from the ashes, and shall wrap it up in a purple cloth,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ponentque cum eo omnia vasa, quibus in ministerio ejus utuntur, id est, ignium receptacula, fuscinulas ac tridentes, uncinos et batilla. Cuncta vasa altaris operient simul velamine janthinarum pellium, et inducent vectes."
      en: "And shall put it with all the vessels that they use in the ministry thereof, that is to say, firepans, fleshhooks and forks, pothooks and shovels. They shall cover all the vessels of the altar together with a covering of violet skins, and shall put in the bars."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque involverint Aaron et filii ejus sanctuarium et omnia vasa ejus in commotione castrorum, tunc intrabunt filii Caath ut portent involuta: et non tangent vasa sanctuarii, ne moriantur. Ista sunt onera filiorum Caath in tabernaculo foederis:"
      en: "And when Aaron and his sons have wrapped up the sanctuary and the vessels thereof at the removing of the camp, then shall the sons of Caath enter in to carry the things wrapped up: and they shall not touch the vessels of the sanctuary, lest they die. These are the burdens of the sons of Caath: in the tabernacle of the covenant:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "super quos erit Eleazar filius Aaron sacerdotis, ad cujus curam pertinet oleum ad concinnandas lucernas, et compositionis incensum, et sacrificium, quod semper offertur, et oleum unctionis, et quidquid ad cultum tabernaculi pertinet, omniumque vasorum, quae in sanctuario sunt."
      en: "And over them shall be Eleazar the son of Aaron the priest, to whose charge pertaineth the oil to dress the lamps, and the sweet incense, and the sacrifice, that is always offered, and the oil of unction, and whatsoever pertaineth to the service of the tabernacle, and of all the vessels that are in the sanctuary."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Locutusque est Dominus ad Moysen et Aaron, dicens:"
      en: "And the Lord spoke to Moses and Aaron, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Nolite perdere populum Caath de medio Levitarum:"
      en: "Destroy not the people of Caath from the midst of the Levites:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "sed hoc facite eis, ut vivant, et non moriantur, si tetigerint Sancta sanctorum. Aaron et filii ejus intrabunt, ipsique disponent opera singulorum, et divident quid portare quis debeat."
      en: "But do this to them, that they may live, and not die, by touching the holies of holies. Aaron and his sons shall go in, and they shall appoint every man his work, and shall divide the burdens that every man is to carry."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Alii nulla curiositate videant quae sunt in sanctuario priusquam involvantur, alioquin morientur."
      en: "Let not others by any curiosity see the things that are in the sanctuary before they be wrapped up, otherwise they shall die."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Tolle summam etiam filiorum Gerson per domos ac familias et cognationes suas,"
      en: "Take the sum of the sons of Gerson also by their houses and families and kindreds."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "a triginta annis et supra, usque ad annos quinquaginta. Numera omnes qui ingrediuntur et ministrant in tabernaculo foederis."
      en: "From thirty years old and upward, unto fifty years old. Number them all that go in and minister in the tabernacle of the covenant."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Hoc est officium familiae Gersonitarum,"
      en: "This is the office of the family of the Gersonites:"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ut portent cortinas tabernaculi et tectum foederis, operimentum aliud, et super omnia velamen janthinum tentoriumque quod pendet in introitu tabernaculi foederis,"
      en: "To carry the curtains of the tabernacle and the roof of the covenant, the other covering, and the violet covering over all, and the hanging that hangeth in the entry of the tabernacle of the covenant,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "cortinas atrii, et velum in introitu quod est ante tabernaculum. Omnia quae ad altare pertinent, funiculos, et vasa ministerii,"
      en: "The curtains of the court, and the veil in the entry that is before the tabernacle. All things that pertain to the altar, the cords and the vessels of the ministry,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "jubente Aaron et filiis ejus, portabunt filii Gerson: et scient singuli cui debeant oneri mancipari."
      en: "The sons of Gerson shall carry, by the commandment of Aaron and his sons: and each man shall know to what burden he must be assigned."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Hic est cultus familiae Gersonitarum in tabernaculo foederis, eruntque sub manu Ithamar filii Aaron sacerdotis."
      en: "This is the service of the family of the Gersonites in the tabernacle of the covenant, and they shall be under the hand of Ithamar the son of Aaron the priest."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Filios quoque Merari per familias et domos patrum suorum recensebis,"
      en: "Thou shalt reckon up the sons of Merari also by the families and houses of their fathers,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "a triginta annis et supra, usque ad annos quinquaginta, omnes qui ingrediuntur ad officium ministerii sui et cultum foederis testimonii."
      en: "From thirty years old and upward, unto fifty years old, all that go in to the office of their ministry, and to the service of the covenant of the testimony."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Haec sunt onera eorum: portabunt tabulas tabernaculi et vectes ejus, columnas ac bases earum,"
      en: "These are their burdens: They shall carry the boards of the tabernacle and the bars thereof, the pillars and their sockets,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "columnas quoque atrii per circuitum cum basibus et paxillis et funibus suis. Omnia vasa et supellectilem ad numerum accipient, sicque portabunt."
      en: "The pillars also of the court round about, with their sockets and pins and cords. They shall receive by account all the vessels and furniture, and so shall carry them."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Hoc est officium familiae Meraritarum et ministerium in tabernaculo foederis: eruntque sub manu Ithamar filii Aaron sacerdotis."
      en: "This is the office of the family of the Merarites, and their ministry in the tabernacle of the covenant: and they shall be under the hand of Ithamar the son of Aaron the priest."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Recensuerunt igitur Moyses et Aaron et principes synagogae filios Caath per cognationes et domos patrum suorum,"
      en: "So Moses and Aaron and the princes of the synagogue reckoned up the sons of Caath, by their kindreds and the houses of their fathers,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "a triginta annis et supra, usque ad annum quinquagesimum, omnes qui ingrediuntur ad ministerium tabernaculi foederis:"
      en: "From thirty years old and upward, unto fifty years old, all that go in to the ministry of the tabernacle of the covenant:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et inventi sunt duo millia septingenti quinquaginta."
      en: "And they were found two thousand seven hundred and fifty."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Hic est numerus populi Caath qui intrant tabernaculum foederis: hos numeravit Moyses et Aaron juxta sermonem Domini per manum Moysi."
      en: "This is the number of the people of Caath that go in to the tabernacle of the covenant: these did Moses and Aaron number according to the word of the Lord by the hand of Moses."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Numerati sunt et filii Gerson per cognationes et domos patrum suorum,"
      en: "The sons of Gerson also were numbered by the kindreds and houses of their fathers,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "a triginta annos et supra, usque ad quinquagesimum annum, omnes qui ingrediuntur ut ministrent in tabernaculo foederis:"
      en: "From thirty years old and upward, unto fifty years old, all that go in to minister in the tabernacle of the covenant:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et inventi sunt duo millia sexcenti triginta."
      en: "And they were found two thousand six hundred and thirty."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Hic est populus Gersonitarum, quos numeraverunt Moyses et Aaron juxta verbum Domini."
      en: "This is the people of the Gersonites, whom Moses and Aaron numbered according to the word of the Lord."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Numerati sunt et filii Merari per cognationes et domos patrum suorum,"
      en: "The sons of Merari also were numbered by the kindreds and houses of their fathers,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "a triginta annis et supra, usque ad annum quinquagesimum, omnes qui ingrediuntur ad explendos ritus tabernaculi foederis:"
      en: "From thirty years old and upward, unto fifty years old, all that go in to fulfill the rites of the tabernacle of the covenant:"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et inventi sunt tria millia ducenti."
      en: "And they were found three thousand two hundred."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Hic est numerus filiorum Merari, quos recensuerunt Moyses et Aaron juxta imperium Domini per manum Moysi."
      en: "This is the number of the sons of Merari, whom Moses and Aaron reckoned up according to the commandment of the Lord by the hand of Moses."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Omnes qui recensiti sunt de Levitis, et quos recenseri fecit ad nomen Moyses et Aaron, et principes Israel per cognationes et domos patrum suorum,"
      en: "All that were reckoned up of the Levites, and whom Moses and Aaron and the princes of Israel took by name, by the kindreds and houses of their fathers,"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "a triginta annis et supra, usque ad annum quinquagesimum, ingredientes ad ministerium tabernaculi, et onera portanda,"
      en: "From thirty years old and upward, until fifty years old, that go into the ministry of the tabernacle, and to carry the burdens,"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "fuerunt simul octo millia quingenti octoginta."
      en: "Were in all eight thousand five hundred and eighty."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Juxta verbum Domini recensuit eos Moyses, unumquemque juxta officium et onera sua, sicut praeceperat ei Dominus."
      en: "Moses reckoned them up according to the word of the Lord, every one according to their office and burdens, as the Lord had commanded him."
    status: { la: verified, en: verified }
