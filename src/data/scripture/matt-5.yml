# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 5
verses:
  - n: 1
    text:
      la: "videns autem turbas ascendit in montem et cum sedisset accesserunt ad eum discipuli eius"
      en: "And seeing the multitudes, he went up into a mountain, and when he was set down, his disciples came unto him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et aperiens os suum docebat eos dicens"
      en: "And opening his mouth, he taught them, saying:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "beati pauperes spiritu quoniam ipsorum est regnum caelorum"
      en: "Blessed are the poor in spirit: for theirs is the kingdom of heaven."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "beati mites quoniam ipsi possidebunt terram"
      en: "Blessed are the meek: for they shall possess the land."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "beati qui lugent quoniam ipsi consolabuntur"
      en: "Blessed are they that mourn: for they shall be comforted."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "beati qui esuriunt et sitiunt iustitiam quoniam ipsi saturabuntur"
      en: "Blessed are they that hunger and thirst after justice: for they shall have their fill."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "beati misericordes quia ipsi misericordiam consequentur"
      en: "Blessed are the merciful: for they shall obtain mercy."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "beati mundo corde quoniam ipsi Deum videbunt"
      en: "Blessed are the clean of heart: for they shall see God."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "beati pacifici quoniam filii Dei vocabuntur"
      en: "Blesses are the peacemakers: for they shall be called children of God."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "beati qui persecutionem patiuntur propter iustitiam quoniam ipsorum est regnum caelorum"
      en: "Blessed are they that suffer persecution for justice' sake: for theirs is the kingdom of heaven."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "beati estis cum maledixerint vobis et persecuti vos fuerint et dixerint omne malum adversum vos mentientes propter me"
      en: "Blessed are ye when they shall revile you, and persecute you, and speak all that is evil against you, untruly, for my sake:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "gaudete et exultate quoniam merces vestra copiosa est in caelis sic enim persecuti sunt prophetas qui fuerunt ante vos"
      en: "Be glad and rejoice, for your reward is very great in heaven. For so they persecuted the prophets that were before you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "vos estis sal terrae quod si sal evanuerit in quo sallietur ad nihilum valet ultra nisi ut mittatur foras et conculcetur ab hominibus"
      en: "You are the salt of the earth. But if the salt lose its savour, wherewith shall it be salted? It is good for nothing any more but to be cast out, and to be trodden on by men."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "vos estis lux mundi non potest civitas abscondi supra montem posita"
      en: "You are the light of the world. A city seated on a mountain cannot be hid."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "neque accendunt lucernam et ponunt eam sub modio sed super candelabrum ut luceat omnibus qui in domo sunt"
      en: "Neither do men light a candle and put it under a bushel, but upon a candlestick, that it may shine to all that are in the house."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sic luceat lux vestra coram hominibus ut videant vestra bona opera et glorificent Patrem vestrum qui in caelis est"
      en: "So let your light shine before men, that they may see your good works, and glorify your Father who is in heaven."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "nolite putare quoniam veni solvere legem aut prophetas non veni solvere sed adimplere"
      en: "Do not think that I am come to destroy the law, or the prophets. I am not come to destroy, but to fulfill."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "amen quippe dico vobis donec transeat caelum et terra iota unum aut unus apex non praeteribit a lege donec omnia fiant"
      en: "For amen I say unto you, till heaven and earth pass, one jot, or one tittle shall not pass of the law, till all be fulfilled."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "qui ergo solverit unum de mandatis istis minimis et docuerit sic homines minimus vocabitur in regno caelorum qui autem fecerit et docuerit hic magnus vocabitur in regno caelorum"
      en: "He therefore that shall break one of these least commandments, and shall so teach men, shall be called the least in the kingdom of heaven. But he that shall do and teach, he shall be called great in the kingdom of heaven."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dico enim vobis quia nisi abundaverit iustitia vestra plus quam scribarum et Pharisaeorum non intrabitis in regnum caelorum"
      en: "For I tell you, that unless your justice abound more than that of the scribes and Pharisees, you shall not enter into the kingdom of heaven."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "audistis quia dictum est antiquis non occides qui autem occiderit reus erit iudicio"
      en: "You have heard that it was said to them of old: Thou shalt not kill. And whosoever shall kill shall be in danger of the judgment."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ego autem dico vobis quia omnis qui irascitur fratri suo reus erit iudicio qui autem dixerit fratri suo racha reus erit concilio qui autem dixerit fatue reus erit gehennae ignis"
      en: "But I say to you, that whosoever is angry with his brother, shall be in danger of the judgment. And whosoever shall say to his brother, Raca, shall be in danger of the council. And whosoever shall say, Thou Fool, shall be in danger of hell fire."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "si ergo offeres munus tuum ad altare et ibi recordatus fueris quia frater tuus habet aliquid adversum te"
      en: "If therefore thou offer thy gift at the altar, and there thou remember that thy brother hath any thing against thee;"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "relinque ibi munus tuum ante altare et vade prius reconciliare fratri tuo et tunc veniens offers munus tuum"
      en: "Leave there thy offering before the altar, and go first to be reconciled to thy brother: and then coming thou shalt offer thy gift."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "esto consentiens adversario tuo cito dum es in via cum eo ne forte tradat te adversarius iudici et iudex tradat te ministro et in carcerem mittaris"
      en: "Be at agreement with thy adversary betimes, whilst thou art in the way with him: lest perhaps the adversary deliver thee to the judge, and the judge deliver thee to the officer, and thou be cast into prison."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "amen dico tibi non exies inde donec reddas novissimum quadrantem"
      en: "Amen I say to thee, thou shalt not go out from thence till thou repay the last farthing."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "audistis quia dictum est antiquis non moechaberis"
      en: "You have heard that it was said to them of old: Thou shalt not commit adultery."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ego autem dico vobis quoniam omnis qui viderit mulierem ad concupiscendum eam iam moechatus est eam in corde suo"
      en: "But I say to you, that whosoever shall look on a woman to lust after her, hath already committed adultery with her in his heart."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quod si oculus tuus dexter scandalizat te erue eum et proice abs te expedit enim tibi ut pereat unum membrorum tuorum quam totum corpus tuum mittatur in gehennam"
      en: "And if thy right eye scandalize thee, pluck it out and cast it from thee. For it is expedient for thee that one of thy members should perish, rather than that thy whole body be cast into hell."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et si dextera manus tua scandalizat te abscide eam et proice abs te expedit tibi ut pereat unum membrorum tuorum quam totum corpus tuum eat in gehennam"
      en: "And if thy right hand scandalize thee, cut it off, and cast it from thee: for it is expedient for thee that one of thy members should perish, rather than that thy whole body be cast into hell."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "dictum est autem quicumque dimiserit uxorem suam det illi libellum repudii"
      en: "And it hath been said, Whoseoever shall put away his wife, let him give her a bill of divorce."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "ego autem dico vobis quia omnis qui dimiserit uxorem suam excepta fornicationis causa facit eam moechari et qui dimissam duxerit adulterat"
      en: "But I say to you, that whosoever shall put away his wife, excepting for the cause of fornication, maketh her to commit adultery: and he that shall marry her that is put away, committeth adultery."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "iterum audistis quia dictum est antiquis non peierabis reddes autem Domino iuramenta tua"
      en: "Again you have heard that it was said to them of old, Thou shalt not forswear thyself: but thou shalt perform thy oaths to the Lord."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "ego autem dico vobis non iurare omnino neque per caelum quia thronus Dei est"
      en: "But I say to you not to swear at all, neither by heaven, for it is the throne of God:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "neque per terram quia scabillum est pedum eius neque per Hierosolymam quia civitas est magni Regis"
      en: "Nor by the earth, for it is his footstool: nor by Jerusalem, for it is the city of the great king:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "neque per caput tuum iuraveris quia non potes unum capillum album facere aut nigrum"
      en: "Neither shalt thou swear by thy head, because thou canst not make one hair white or black."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "sit autem sermo vester est est non non quod autem his abundantius est a malo est"
      en: "But let your speech be yea, yea: no, no: and that which is over and above these, is of evil."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "audistis quia dictum est oculum pro oculo et dentem pro dente"
      en: "You have heard that it hath been said, An eye for an eye, and a tooth for a tooth."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "ego autem dico vobis non resistere malo sed si quis te percusserit in dextera maxilla tua praebe illi et alteram"
      en: "But I say to you not to resist evil: but if one strike thee on thy right cheek, turn to him also the other:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et ei qui vult tecum iudicio contendere et tunicam tuam tollere remitte ei et pallium"
      en: "And if a man will contend with thee in judgment, and take away thy coat, let go thy cloak also unto him."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et quicumque te angariaverit mille passus vade cum illo alia duo"
      en: "And whosoever will force thee one mile, go with him other two,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "qui petit a te da ei et volenti mutuari a te ne avertaris"
      en: "Give to him that asketh of thee and from him that would borrow of thee turn not away."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "audistis quia dictum est diliges proximum tuum et odio habebis inimicum tuum"
      en: "You have heard that it hath been said, Thou shalt love thy neighbor, and hate thy enemy."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "ego autem dico vobis diligite inimicos vestros benefacite his qui oderunt vos et orate pro persequentibus et calumniantibus vos"
      en: "But I say to you, Love your enemies: do good to them that hate you: and pray for them that persecute and calumniate you:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "ut sitis filii Patris vestri qui in caelis est qui solem suum oriri facit super bonos et malos et pluit super iustos et iniustos"
      en: "That you may be the children of your Father who is in heaven, who maketh his sun to rise upon the good, and bad, and raineth upon the just and the unjust."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "si enim diligatis eos qui vos diligunt quam mercedem habebitis nonne et publicani hoc faciunt"
      en: "For if you love them that love you, what reward shall you have? do not even the publicans this?"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et si salutaveritis fratres vestros tantum quid amplius facitis nonne et ethnici hoc faciunt"
      en: "And if you salute your brethren only, what do you more? do not also the heathens this?"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "estote ergo vos perfecti sicut et Pater vester caelestis perfectus est"
      en: "Be you therefore perfect, as also your heavenly Father is perfect."
    status: { la: verified, en: verified }
