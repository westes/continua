# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: joan
chapter: 20
verses:
  - n: 1
    text:
      la: "Una autem sabbati, Maria Magdalene venit mane, cum adhuc tenebrae essent, ad monumentum: et vidit lapidem sublatum a monumento."
      en: "And on the first day of the week, Mary Magdalen cometh early, when it was yet dark, unto the sepulchre; and she saw the stone taken away from the sepulchre."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cucurrit ergo, et venit ad Simonem Petrum, et ad alium discipulum, quem amabat Jesus, et dicit illis: Tulerunt Dominum de monumento, et nescimus ubi posuerunt eum."
      en: "She ran, therefore, and cometh to Simon Peter, and to the other disciple whom Jesus loved, and saith to them: They have taken away the Lord out of the sepulchre, and we know not where they have laid him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Exiit ergo Petrus, et ille alius discipulus, et venerunt ad monumentum."
      en: "Peter therefore went out, and that other disciple, and they came to the sepulchre."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Currebant autem duo simul, et ille alius discipulus praecucurrit citius Petro, et venit primus ad monumentum."
      en: "And they both ran together, and that other disciple did outrun Peter, and came first to the sepulchre."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et cum se inclinasset, vidit posita linteamina: non tamen introivit."
      en: "And when he stooped down, he saw the linen cloths lying; but yet he went not in."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Venit ergo Simon Petrus sequens eum, et introivit in monumentum, et vidit linteamina posita,"
      en: "Then cometh Simon Peter, following him, and went into the sepulchre, and saw the linen cloths lying,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et sudarium, quod fuerat super caput ejus, non cum linteaminibus positum, sed separatim involutum in unum locum."
      en: "And the napkin that had been about his head, not lying with the linen cloths, but apart, wrapped up into one place."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Tunc ergo introivit et ille discipulus qui venerat primus ad monumentum: et vidit, et credidit:"
      en: "Then that other disciple also went in, who came first to the sepulchre: and he saw, and believed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "nondum enim sciebant Scripturam, quia oportebat eum a mortuis resurgere."
      en: "For as yet they knew not the scripture, that he must rise again from the dead."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Abierunt ergo iterum discipuli ad semetipsos."
      en: "The disciples therefore departed again to their home."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Maria autem stabat ad monumentum foris, plorans. Dum ergo fleret, inclinavit se, et prospexit in monumentum:"
      en: "But Mary stood at the sepulchre without, weeping. Now as she was weeping, she stooped down, and looked into the sepulchre,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et vidit duos angelos in albis sedentes, unum ad caput, et unum ad pedes, ubi positum fuerat corpus Jesu."
      en: "And she saw two angels in white, sitting, one at the head, and one at the feet, where the body of Jesus had been laid."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Dicunt ei illi: Mulier, quid ploras? Dicit eis: Quia tulerunt Dominum meum: et nescio ubi posuerunt eum."
      en: "They say to her: Woman, why weepest thou? She saith to them: Because they have taken away my Lord; and I know not where they have laid him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Haec cum dixisset, conversa est retrorsum, et vidit Jesum stantem: et non sciebat quia Jesus est."
      en: "When she had thus said, she turned herself back, and saw Jesus standing; and she knew not that it was Jesus."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dicit ei Jesus: Mulier, quid ploras? quem quaeris? Illa existimans quia hortulanus esset, dicit ei: Domine, si tu sustulisti eum, dicito mihi ubi posuisti eum, et ego eum tollam."
      en: "Jesus saith to her: Woman, why weepest thou? whom seekest thou? She, thinking it was the gardener, saith to him: Sir, if thou hast taken him hence, tell me where thou hast laid him, and I will take him away."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dicit ei Jesus: Maria. Conversa illa, dicit ei: Rabboni ( quod dicitur Magister)."
      en: "Jesus saith to her: Mary. She turning, saith to him: Rabboni (which is to say, Master)."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dicit ei Jesus: Noli me tangere, nondum enim ascendi ad Patrem meum: vade autem ad fratres meos, et dic eis: Ascendo ad Patrem meum, et Patrem vestrum, Deum meum, et Deum vestrum."
      en: "Jesus saith to her: Do not touch me, for I am not yet ascended to my Father. But go to my brethren, and say to them: I ascend to my Father and to your Father, to my God and your God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Venit Maria Magdalene annuntians discipulis: Quia vidi Dominum, et haec dixit mihi."
      en: "Mary Magdalen cometh, and telleth the disciples: I have seen the Lord, and these things he said to me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cum ergo sero esset die illo, una sabbatorum, et fores essent clausae, ubi erant discipuli congregati propter metum Judaeorum: venit Jesus, et stetit in medio, et dixit eis: Pax vobis."
      en: "Now when it was late that same day, the first of the week, and the doors were shut, where the disciples were gathered together, for fear of the Jews, Jesus came and stood in the midst, and said to them: Peace be to you."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et cum hoc dixisset, ostendit eis manus et latus. Gavisi sunt discipuli, viso Domino."
      en: "And when he had said this, he shewed them his hands and his side. The disciples therefore were glad, when they saw the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dixit ergo eis iterum: Pax vobis. Sicut misit me Pater, et ego mitto vos."
      en: "He said therefore to them again: Peace be to you. As the Father hath sent me, I also send you."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Haec cum dixisset, insufflavit, et dixit eis: Accipite Spiritum Sanctum:"
      en: "When he had said this, he breathed on them; and he said to them: Receive ye the Holy Ghost."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "quorum remiseritis peccata, remittuntur eis: et quorum retinueritis, retenta sunt."
      en: "Whose sins you shall forgive, they are forgiven them; and whose sins you shall retain, they are retained."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Thomas autem unus ex duodecim, qui dicitur Didymus, non erat cum eis quando venit Jesus."
      en: "Now Thomas, one of the twelve, who is called Didymus, was not with them when Jesus came."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dixerunt ergo ei alii discipuli: Vidimus Dominum. Ille autem dixit eis: Nisi videro in manibus ejus fixuram clavorum, et mittam digitum meum in locum clavorum, et mittam manum meam in latus ejus, non credam."
      en: "The other disciples therefore said to him: We have seen the Lord. But he said to them: Except I shall see in his hands the print of the nails, and put my finger into the place of the nails, and put my hand into his side, I will not believe."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et post dies octo, iterum erant discipuli ejus intus, et Thomas cum eis. Venit Jesus januis clausis, et stetit in medio, et dixit: Pax vobis."
      en: "And after eight days again his disciples were within, and Thomas with them. Jesus cometh, the doors being shut, and stood in the midst, and said: Peace be to you."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Deinde dicit Thomae: Infer digitum tuum huc, et vide manus meas, et affer manum tuam, et mitte in latus meum: et noli esse incredulus, sed fidelis."
      en: "Then he saith to Thomas: Put in thy finger hither, and see my hands; and bring hither thy hand, and put it into my side; and be not faithless, but believing."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Respondit Thomas, et dixit ei: Dominus meus et Deus meus."
      en: "Thomas answered, and said to him: My Lord, and my God."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Dixit ei Jesus: Quia vidisti me, Thoma, credidisti: beati qui non viderunt, et crediderunt."
      en: "Jesus saith to him: Because thou hast seen me, Thomas, thou hast believed: blessed are they that have not seen, and have believed."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Multa quidem et alia signa fecit Jesus in conspectu discipulorum suorum, quae non sunt scripta in libro hoc."
      en: "Many other signs also did Jesus in the sight of his disciples, which are not written in this book."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Haec autem scripta sunt ut credatis, quia Jesus est Christus Filius Dei: et ut credentes, vitam habeatis in nomine ejus."
      en: "But these are written, that you may believe that Jesus is the Christ, the Son of God: and that believing, you may have life in his name."
    status: { la: verified, en: verified }
