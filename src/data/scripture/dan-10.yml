# Douay-Rheims + Latin Vulgate, from drbo.org (Douay-Rheims Bible
# Online) -- the "DR + LV" combined page keeps every verse's Latin
# and English paired in the same block, avoiding the verse-
# misalignment this project's first-pass "Unbound Bible" source had
# for dan 10 specifically; see TODO.md's bulk scripture import entry.
book: dan
chapter: 10
verses:
  - n: 1
    text:
      la: "Anno tertio Cyri regis Persarum, verbum revelatum est Danieli cognomento Baltassar, et verbum verum, et fortitudo magna : intellexitque sermonem : intelligentia enim est opus in visione."
      en: "In the third year of Cyrus king of the Persians, a word was revealed to Daniel surnamed Baltassar, and a true word, and great strength: and he understood the word: for there is need of understanding in a vision."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "In diebus illis ego Daniel lugebam trium hebdomadarum diebus :"
      en: "In those days I Daniel mourned the days of three weeks."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "panem desiderabilem non comedi, et caro et vinum non introierunt in os meum, sed neque unguento unctus sum, donec complerentur trium hebdomadarum dies."
      en: "I ate no desirable bread, and neither flesh, nor wine entered into my mouth, neither was I anointed with ointment: till the days of three weeks were accomplished."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Die autem vigesima et quarta mensis primi, eram juxta fluvium magnum, qui est Tigris."
      en: "And in the four and twentieth day of the first month I was by the great river which is the Tigris."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et levavi oculos meos, et vidi : et ecce vir unus vestitus lineis, et renes ejus accincti auro obrizo :"
      en: "And I lifted up my eyes, and I saw: and behold a man clothed in linen, and his loins were girded with the finest gold:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et corpus ejus quasi chrysolithus, et facies ejus velut species fulguris, et oculi ejus ut lampas ardens : et brachia ejus, et quae deorsum sunt usque ad pedes, quasi species aeris candentis : et vox sermonum ejus ut vox multitudinis."
      en: "And his body was like the chrysolite, and his face as the appearance of lightning, and his eyes as a burning lamp: and his arms, and all downward even to the feet, like in appearance to glittering brass: and the voice of his word like the voice of a multitude."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vidi autem ego Daniel solus visionem : porro viri qui erant mecum non viderunt, sed terror nimius irruit super eos, et fugerunt in absconditum."
      en: "And I Daniel alone saw the vision: for the men that were with me saw it not: but an exceeding great terror fell upon them, and they fled away, and hid themselves."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ego autem relictus solus vidi visionem grandem hanc : et non remansit in me fortitudo, sed et species mea immutata est in me, et emarcui, nec habui quidquam virium."
      en: "And I being left alone saw this great vision: and there remained no strength in me, and the appearance of my countenance was changed in me, and I fainted away, and retained no strength."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et audivi vocem sermonum ejus : et audiens jacebam consternatus super faciem meam, et vultus meus haerebat terrae."
      en: "And I heard the voice of his words: and when I heard, I lay in a consternation, upon my face, and my face was close to the ground."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ecce manus tetigit me, et erexit me super genua mea, et super articulos manuum mearum."
      en: "And behold a hand touched me, and lifted me up upon my knees, and upon the joints of my hands."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et dixit ad me : Daniel vir desideriorum, intellige verba quae ego loquor ad te, et sta in gradu tuo : nunc enim sum missus ad te. Cumque dixisset mihi sermonem istum, steti tremens."
      en: "And he said to me: Daniel, thou man of desires, understand the words that I speak to thee, and stand upright: for I am sent now to thee. And when he had said this word to me, I stood trembling."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et ait ad me : Noli metuere, Daniel : quia ex die primo, quo posuisti cor tuum ad intelligendum ut te affligeres in conspectu Dei tui, exaudita sunt verba tua : et ego veni propter sermones tuos."
      en: "And he said to me: Fear not, Daniel: for from the first day that thou didst set thy heart to understand, to afflict thyself in the sight of thy God, thy words have been heard: and I am come for thy words."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Princeps autem regni Persarum restitit mihi viginti et uno diebus : et ecce Michael, unus de principibus primis, venit in adjutorium meum, et ego remansi ibi juxta regem Persarum."
      en: "But the prince of the kingdom of the Persians resisted me one and twenty days: and behold Michael, one of the chief princes, came to help me, and I remained there by the king of the Persians."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Veni autem ut docerem te quae ventura sunt populo tuo in novissimis diebus, quoniam adhuc visio in dies."
      en: "But I am come to teach thee what things shall befall thy people in the latter days, for as yet the vision is for days."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque loqueretur mihi hujuscemodi verbis, dejeci vultum meum ad terram, et tacui."
      en: "And when he was speaking such words to me, I cast down my countenance to the ground, and held my peace."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et ecce quasi similitudo filii hominis tetigit labia mea : et aperiens os meum locutus sum, et dixi ad eum, qui stabat contra me : Domine mi, in visione tua dissolutae sunt compages meae, et nihil in me remansit virium."
      en: "And behold, as it were the likeness of a son of man touched my lips: then I opened my mouth, and spoke, and said to him that stood before me: O my Lord, at the sight of thee my joints are loosed, and no strength hath remained in me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et quomodo poterit servus domini mei loqui cum domino meo? nihil enim in me remansit virium, sed et halitus meus intercluditur."
      en: "And how can the servant of my lord speak with my lord? for no strength remaineth in me, moreover my breath is stopped."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Rursum ergo tetigit me quasi visio hominis, et confortavit me,"
      en: "Therefore he that looked like a man touched me again, and strengthened me."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et dixit : Noli timere, vir desideriorum : pax tibi : confortare, et esto robustus. Cumque loqueretur mecum, convalui, et dixi : Loquere, domine mi, quia confortasti me."
      en: "And he said: Fear not, O man of desires, peace be to thee: take courage and be strong. And when he spoke to me, I grew strong: and I said: Speak, O my lord, for thou hast strengthened me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et ait : Numquid scis quare venerim ad te? et nunc revertar ut praelier adversum principem Persarum. Cum ego egrederer, apparuit princeps Graecorum veniens."
      en: "And he said: Dost thou know wherefore I am come to thee? and now I will return, to fight against the prince of the Persians. When I went forth, there appeared the prince of the Greeks coming."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Verumtamen annuntiabo tibi quod expressum est in scriptura veritatis : et nemo est adjutor meus in omnibus his, nisi Michael princeps vester."
      en: "But I will tell thee what is set down in the scripture of truth: and none is my helper in all these things, but Michael your prince."
    status: { la: verified, en: verified }
