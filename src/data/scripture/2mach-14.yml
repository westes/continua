# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2mach
chapter: 14
verses:
  - n: 1
    text:
      la: "sed post triennii tempus cognovit Iudas et qui cum eo erant Demetrium Seleuci cum multitudine valida et navibus per portum Tripoli ascendisse ad loca oportuna"
      en: "But after the space of three years Judas, and they that were with him, understood that Demetrius the son of Seleucus was come up with a great power, and a navy by the haven of Tripolis to places proper for his purpose."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et tenuisse regiones adversus Antiochum et eius ducem Lysiam"
      en: "And had made himself master of the countries against Antiochus, and his general Lysias."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Alchimus autem quidam qui summus sacerdos fuerat sed voluntarie coinquinatus est temporibus commixtionis considerans nullo modo sibi esse salutem neque accessum ad altare"
      en: "Now one Alcimus, who had been chief priest, but had wilfully defiled himself in the time of mingling with the heathens, seeing that there was no safety for him, nor access to the altar,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "venit ad regem Demetrium centesimo quinquagesimo anno offerens ei auream coronam et palmam super haec et tallos qui templi esse videbantur et ipsa quidem die siluit"
      en: "Came to king Demetrius in the year one hundred and fifty, presenting unto him a crown of gold, and a palm, and besides these, some boughs which seemed to belong to the temple. And that day indeed he held his peace."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "tempus autem oportunum dementiae suae nanctus convocatus a Demetrio ad consilium et interrogatus quibus rebus et consiliis Iudaei niterentur"
      en: "But having gotten a convenient time to further his madness, being called to counsel by Demetrius, and asked what the Jews relied upon, and what were their counsels,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "respondit ipsi qui dicuntur Asidei Iudaeorum quibus praeest Iudas Macchabeus bella nutriunt et seditiones movent nec patiuntur regnum esse quietum"
      en: "He answered thereunto: They among the Jews that are called Assideans, of whom Judas Machabeus is captain, nourish wars, and raise seditions, and will not suffer the realm to be in peace."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nam et ego defraudatus parentum gloria dico autem summo sacerdotio huc veni"
      en: "For I also being deprived of my ancestors' glory (I mean of the high priesthood) am now come hither:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "primo quidem utilitatibus regis fidem servans secundo autem etiam civibus consulens nam illorum pravitate universum genus nostrum non minime vexatur"
      en: "Principally indeed out of fidelity to the king's interests, but in the next place also to provide for the good of my countrymen: for all our nation suffereth much from the evil proceedings of those men."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sed his singulis oro rex cognitis et regioni et generi secundum pervulgatam omnibus humanitatem tuam prospice"
      en: "Wherefore, 0 king, seeing thou know- eat all these things, take care, I beseech thee, both of the country, and of our nation, according to thy humanity which is known to all men,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "nam quamdiu superest Iudas inpossibile est pacem esse negotiis"
      en: "For as long as Judas liveth, it is not possible that the state should be quiet."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "talibus autem ab hoc dictis et ceteri amici hostiliter habentes adversus Iudam inflammaverunt Demetrium"
      en: "Now when this man had spoken to this effect, the rest also of the king's friends, who were enemies of Judas, incensed Demetrius against him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui statim Nicanorem praepositum elefantorum ducem misit Iudaeam"
      en: "And forthwith he sent Nicanor, the commander over the elephants, governor into Judea:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "datis mandatis ipsum quidem Iudam caperet eos vero qui cum illo erant dispergeret et constitueret Alchimum maximi templi summum sacerdotem"
      en: "Giving him in charge, to take Judas himself: and disperse all them that were with him, and to make Alcimus the high priest of the great temple."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "tunc gentes quae de Iudaea fugerant Iudam segregatim se Nicanori miscebant miserias et clades Iudaeorum prosperitates rerum suarum existimantes"
      en: "Then the Gentiles who had fled out of Judea from Judas, came to Nicanor by docks, thinking the miseries and calamities of the Jews to be the welfare of their affairs."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "audito itaque Iudaei Nicanoris adventu et conventu nationum conspersi terra rogabant eum qui populum suum constituit eum in aeternum custodiret quique suam portionem signis evidentibus protegit"
      en: "Now when the Jews heard of Nicanor's coming, and that the nations were assembled against them, they cast earth upon their heads, and made supplication to him, who chose his people to keep them for ever, and who protected his portion by evident signs."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "imperante autem duce statim inde moverunt et convenerunt ad castellum Dessau"
      en: "Then at the commandment of their captain, they forthwith removed from the place where they were, and went to the town of Dessau, to meet them."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Simon vero frater Iudae commiserat cum Nicanore sed conterritus est repentino adventu adversariorum"
      en: "Now Simon the brother of Judas had joined battle with Nicanor, but was frightened with the sudden coming of the adversaries."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Nicanor tamen audiens virtutem comitum Iudae et animi magnitudinem quam pro patriae certaminibus habebant sanguine iudicium facere metuebat"
      en: "Nevertheless Nicanor hearing of the valour of Judas' companions, and the greatness of courage with which they fought for their country, was afraid to try the matter by the sword."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "quam ob rem misit Possidonium et Theodotum et Matthathiam ut darent dextras atque acciperent"
      en: "Wherefore he sent Posidonius, and Theodotius, and Matthias before to pre- sent and receive the right hands."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et cum diu de his consilium ageretur et ipse dux ad multitudinem rettulisset omnium una fuit sententia amicitiis annuere"
      en: "And when there had been a consultation thereupon, and the captain had acquainted the multitude with it, the) were all of one mind to consent to covenants."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "itaque diem constituerunt qua secreto inter se agerent et a singulis sellae prolatae sunt et positae"
      en: "So they appointed a day upon which they might commune together by them- selves: and seats were brought out, and set for each one."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "praecepit autem Iudas armatos esse locis oportunis ne forte ab hostibus repente mali aliquid oriretur et congruum conloquium fecerunt"
      en: "But Judas ordered men to be ready in convenient places, lest some mischief might he suddenly practised by the enemies: so they made an agreeable conference."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "morabatur autem Nicanor Hierosolymis et nihil inique agebat gregesque turbarum quae congregatae fuerant dimisit"
      en: "And Nicanor abode in Jerusalem, and did no wrong, but sent away the flocks of the multitudes that had been gathered together."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "habebat autem semper Iudam carum ex animo erat vero inclinatus"
      en: "And Judas was always dear to him from the heart, and he was well affected to the man."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "rogavit eum ducere uxorem filiosque procreare nuptias fecit quiete egit communiterque vivebant"
      en: "And he desired him to marry a wife, and to have children. So he married: he lived quietly, and they lived in common."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Alchimus autem videns caritatem illorum ad invicem et conventiones venit ad Demetrium et dicebat Nicanorem rebus alienis adsentare Iudamque regni insidiatorem successorem sibi destinasse"
      en: "But Alcimus seeing the love they had one to another, and the covenants, came to Demetrius, and told him that Nicanor assented to the foreign interest, for that he meant to make Judas, who was a traitor to the kingdom, his successor."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "itaque rex exasperatus et pessimis huius criminationibus inritatus scripsit Nicanori dicens graviter quidem se ferre de amicitiae conventione iubere tamen Macchabeum citius vinctum mittere Antiochiam"
      en: "Then the king being in a rage and provoked with this man's wicked accusations, wrote to Nicanor, signifying, that he was greatly displeased with the covenant of friendship: and that he commanded him nevertheless to send Machabeus prisoner in all haste to Antioch."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "quibus cognitis Nicanor consternabatur et graviter ferebat si ea quae convenerant irrita faceret nihil laesus a viro"
      en: "When this was known, Nicanor was in a consternation, and took it grievously that he should make void the articles that were agreed upon, having received no injury from the man."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "sed quia regi resistere non poterat oportunitatem observabat qua praeceptum perficeret"
      en: "But because he could not oppose the king, he watched an opportunity to comply with the orders."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "at Macchabeus videns austerius secum agere Nicanorem et consuetum occursum ferocius exhibentem intellegens non ex bono esse austeritatem istam paucis suorum congregatis occultavit se a Nicanore"
      en: "But when Machabeus perceived that Nicanor was more stern to him, and that when they met together as usual he behaved himself in a rough manner: and was sensible that this rough behaviour came not of good, he gathered together a few of his men, and hid himself from Nicanor."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "quod ut ille cognovit fortiter se a viro praeventum venit ad maximum et sanctissimum templum et sacerdotibus solitas hostias offerentibus iussit sibi tradi virum"
      en: "But he finding himself notably pre- vented by the man, came to the great and holy temple: and commanded the priests that were offering the accustomed sacrifices, to deliver him the man."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quibus cum iuramento dicentibus nescire se ubi esset qui quaerebatur extendens manum ad templum"
      en: "And when they swore unto him, that they knew not where the man was whom he sought, he stretched out his hand to the temple,"
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "iuravit nisi mihi vinctum Iudam tradideritis istud Dei fanum in planitiem deducam et altare effodiam et templum hoc Libero patri consecrabo"
      en: "And swore, saying: Unless you de- liver Judas prisoner to me, I will lay this temple of God even with the ground, and will beat down the altar, and I will dedicate this temple to Bacchus."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et his dictis abiit sacerdotes autem protendentes manus in caelum invocabant eum qui semper propugnator esset gentis ipsorum haec dicentes"
      en: "And when he had spoken thus he departed. But the priests stretching forth their hands to heaven, called upon him that was ever the defender of their nation, saying in this manner:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "tu Domine qui universitatis nullius indiges voluisti templum habitationis tuae fieri in nobis"
      en: "Thou, O Lord of all things, who wantest nothing, wast pleased that the temple of thy habitation should be amongst us."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et nunc sancte sanctorum omnium Domine conserva in aeternum inpollutam domum istam quae nuper mundata est"
      en: "Therefore now, 0 Lord the holy of all holies, keep this house for ever undefiled which was lately cleansed."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Razias autem quidam de senioribus ab Hierosolymis delatus est Nicanori vir amator civitatis et bene audiens qui pro adfectu pater Iudaeorum appellabatur"
      en: "Now Razias, one of the ancients of Jerusalem, was accused to Nicanor, a man that was a lover of the city, and of good report, who for his affection was called the father of the Jews."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "hic multis temporibus continentiae propositum tenuit in iudaismo corpusque et animam tradere contentus pro perseverantia"
      en: "This man, for a long time, had held fast his purpose of keeping himself pure in the Jews' religion, and was ready to expose his body and life, that he might persevere therein."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "volens autem Nicanor manifestare odium quod habebat in Iudaeos misit milites quingentos ut eum conprehenderent"
      en: "So Nicanor being willing to declare the hatred that he bore the Jews, sent five hundred soldiers to take him."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "putabat enim si illum decepisset se cladem maximam Iudaeis inlaturum"
      en: "For he thought by insnaring him to hurt the Jews very much."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "turbis autem inruere domum eius et ianuam disrumpere atque ignem admovere cupientibus cum iam conprehenderetur gladio se petit"
      en: "Now as the multitude sought to rush into his house, and to break open the door, and to set fire to it, when he was ready to be taken, he struck himself with his sword:"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "eligens nobiliter mori potius quam subditus fieri peccatoribus et contra natales suos indignis iniuriis agi"
      en: "Choosing to die nobly rather than to fall into the hands of the wicked, and to suffer abuses unbecoming his noble birth."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "sed cum per festinationem non certo ictu plagam dedisset et turbae intra ostia inrumperent recurrens audenter ad murum praecipitavit semet ipsum viriliter in turbas"
      en: "But whereas through haste he missed of giving himself a sure wound, and the crowd was breaking into the doors, he ran boldly to the wall, and manfully threw himself down to the crowd:"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "quibus velociter locum dantibus casui eius venit per mediam cervicem"
      en: "But they quickly making room for his fall, he came upon the midst of the neck."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et cum adhuc spiraret accensis animis surrexit cum et sanguis eius magno fluxu deflueret saucius cursu turbam pertransiit"
      en: "And as he had yet breath in him, being inflamed in mind he arose: and while his blood ran down with a great stream, and he was grievously wounded, he ran through the crowd:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "et stans super petram quandam praeruptam et iam exsanguis effectus conplexus intestina sua utrisque manibus proiecit super turbas invocans Dominatorem vitae ac spiritus ut haec illi iterum redderet atque ita vita defunctus est"
      en: "And standing upon a steep rock, when he was now almost without blood, grasping his bowels with both hands, he cast them upon the throng, calling upon the Lord of life and spirit, to restore these to him again: and so he departed this life."
    status: { la: verified, en: verified }
