# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2cor
chapter: 12
verses:
  - n: 1
    text:
      la: "si gloriari oportet non expedit quidem veniam autem ad visiones et revelationes Domini"
      en: "If I must glory (it is not expedient indeed): but I will come to visions and revelations of the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "scio hominem in Christo ante annos quattuordecim sive in corpore nescio sive extra corpus nescio Deus scit raptum eiusmodi usque ad tertium caelum"
      en: "I know a man in Christ above fourteen years ago (whether in the body, I know not, or out of the body, I know not; God knoweth), such a one caught up to the third heaven."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et scio huiusmodi hominem sive in corpore sive extra corpus nescio Deus scit"
      en: "And I know such a man (whether in the body, or out of the body, I know not: God knoweth):"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quoniam raptus est in paradisum et audivit arcana verba quae non licet homini loqui"
      en: "That he was caught up into paradise, and heard secret words, which it is not granted to man to utter."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "pro eiusmodi gloriabor pro me autem nihil gloriabor nisi in infirmitatibus meis"
      en: "For such an one I will glory; but for myself I will glory nothing, but in my infirmities."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nam et si voluero gloriari non ero insipiens veritatem enim dicam parco autem ne quis in me existimet supra id quod videt me aut audit ex me"
      en: "For though I should have a mind to glory, I shall not be foolish; for I will say the truth. But I forbear, lest any man should think of me above that which he seeth in me, or any thing he heareth from me."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ne magnitudo revelationum extollat me datus est mihi stimulus carnis meae angelus Satanae ut me colaphizet"
      en: "And lest the greatness of the revelations should exalt me, there was given me a sting of my flesh, an angel of Satan, to buffet me."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "propter quod ter Dominum rogavi ut discederet a me"
      en: "For which thing thrice I besought the Lord, that it might depart from me."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et dixit mihi sufficit tibi gratia mea nam virtus in infirmitate perficitur libenter igitur gloriabor in infirmitatibus meis ut inhabitet in me virtus Christi"
      en: "And he said to me: My grace is sufficient for thee; for power is made perfect in infirmity. Gladly therefore will I glory in my infirmities, that the power of Christ may dwell in me."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "propter quod placeo mihi in infirmitatibus in contumeliis in necessitatibus in persecutionibus in angustiis pro Christo cum enim infirmor tunc potens sum"
      en: "For which cause I please myself in my infirmities, in reproaches, in necessities, in persecutions, in distresses, for Christ. For when I am weak, then am I powerful."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "factus sum insipiens vos me coegistis ego enim debui a vobis commendari nihil enim minus fui ab his qui sunt supra modum apostoli tametsi nihil sum"
      en: "I am become foolish: you have compelled me. For I ought to have been commended by you: for I have no way come short of them that are above measure apostles, although I be nothing."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "signa tamen apostoli facta sunt super vos in omni patientia signis et prodigiis et virtutibus"
      en: "Yet the signs of my apostleship have been wrought on you, in all patience, in signs, and wonders, and mighty deeds."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quid est enim quod minus habuistis prae ceteris ecclesiis nisi quod ego ipse non gravavi vos donate mihi hanc iniuriam"
      en: "For what is there that you have had less than the other churches, but that I myself was not burthensome to you? Pardon me this injury."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ecce tertio hoc paratus sum venire ad vos et non ero gravis vobis non enim quaero quae vestra sunt sed vos nec enim debent filii parentibus thesaurizare sed parentes filiis"
      en: "Behold now the third time I am ready to come to you; and I will not be burthensome unto you. For I seek not the things that are yours, but you. For neither ought the children to lay up for the parents, but the parents for the children."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ego autem libentissime inpendam et superinpendar ipse pro animabus vestris licet plus vos diligens minus diligar"
      en: "But I most gladly will spend and be spent myself for your souls; although loving you more, I be loved less."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "sed esto ego vos non gravavi sed cum essem astutus dolo vos cepi"
      en: "But be it so: I did not burthen you: but being crafty, I caught you by guile."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "numquid per aliquem eorum quos misi ad vos circumveni vos"
      en: "Did I overreach you by any of them whom I sent to you?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "rogavi Titum et misi cum illo fratrem numquid Titus vos circumvenit nonne eodem spiritu ambulavimus nonne hisdem vestigiis"
      en: "I desired Titus, and I sent with him a brother. Did Titus overreach you? Did we not walk with the same spirit? did we not in the same steps?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "olim putatis quod excusemus nos apud vos coram Deo in Christo loquimur omnia autem carissimi propter vestram aedificationem"
      en: "Of old, think you that we excuse ourselves to you? We speak before God in Christ; but all things, my dearly beloved, for your edification."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "timeo enim ne forte cum venero non quales volo inveniam vos et ego inveniar a vobis qualem non vultis ne forte contentiones aemulationes animositates dissensiones detractiones susurrationes inflationes seditiones sint inter vos"
      en: "For I fear lest perhaps when I come I shall not find you such as I would, and that I shall be found by you such as you would not. Lest perhaps contentions, envyings, animosities, dissensions, detractions, whisperings, swellings, seditions, be among you."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ne iterum cum venero humiliet me Deus apud vos et lugeam multos ex his qui ante peccaverunt et non egerunt paenitentiam super inmunditia et fornicatione et inpudicitia quam gesserunt"
      en: "Lest again, when I come, God humble me among you: and I mourn many of them that sinned before, and have not done penance for the uncleanness, and fornication, and lasciviousness, that they have committed."
    status: { la: verified, en: verified }
