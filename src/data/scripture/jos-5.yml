# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jos
chapter: 5
verses:
  - n: 1
    text:
      la: "postquam ergo audierunt omnes reges Amorreorum qui habitabant trans Iordanem ad occidentalem plagam et cuncti reges Chanaan qui propinqua possidebant Magno mari loca quod siccasset Dominus fluenta Iordanis coram filiis Israhel donec transirent dissolutum est cor eorum et non remansit in eis spiritus timentium introitum filiorum Israhel"
      en: "Now when all the kings of the Amorrhites, who dwelt beyond the Jordan westward, and all the kings of Chanaan, who possessed the places near the great sea, had heard that the Lord had dried up the waters of the Jordan before the children of Israel, till they passed over, their heart failed them, and there remained no spirit in them, fearing the coming in of the children of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "eo tempore ait Dominus ad Iosue fac tibi cultros lapideos et circumcide secundo filios Israhel"
      en: "At that time the Lord said to Josue: Make thee knives of stone, and circumcise the second time the children of Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "fecit quod iusserat Dominus et circumcidit filios Israhel in colle Praeputiorum"
      en: "He did what the Lord had commanded, and he circumcised the children of Israel in the hill of the foreskins."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "haec autem causa est secundae circumcisionis omnis populus qui egressus est ex Aegypto generis masculini universi bellatores viri mortui sunt in deserto per longissimos viae circuitus"
      en: "Now this is the cause of the second circumcision: All the people that came out of Egypt that were males, all the men fit for war, died in the desert, during the time of the long going about in the way."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui omnes circumcisi erant populus autem qui natus est in deserto"
      en: "Now these were all circumcised. But the people that were born in the desert,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "per quadraginta annos itineris latissimae solitudinis incircumcisus fuit donec consumerentur qui non audierant vocem Domini et quibus ante iuraverat ut ostenderet eis terram lacte et melle manantem"
      en: "Luring the forty years of the journey in the wide wilderness, were uncircumcised: till all they were consumed that had not heard the voice of the Lord, and to whom he had sworn before, that he would not shew them the land flowing with milk and honey."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "horum filii in locum successerunt patrum et circumcisi sunt ab Iosue quia sicut nati fuerant in praeputio erant nec eos in via aliquis circumciderat"
      en: "The children of these succeeded in the place of their fathers, and were circumcised by Josue: for they were uncircumcised even as they were born, and no one had circumcised them in the way."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "postquam autem omnes circumcisi sunt manserunt in eodem castrorum loco donec sanarentur"
      en: "Now after they were all circumcised, they remained in the same place of the camp, until they were healed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixitque Dominus ad Iosue hodie abstuli obprobrium Aegypti a vobis vocatumque est nomen loci illius Galgala usque in praesentem diem"
      en: "And the Lord said to Josue: This day have I taken away from you the reproach of Egypt. And the name of that place was called Galgal, until this present day."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "manseruntque filii Israhel in Galgalis et fecerunt phase quartadecima die mensis ad vesperum in campestribus Hiericho"
      en: "And the children of Israel abode in Galgal, and they kept the phase on the fourteenth day of the month, at evening, in the plains of Jericho:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et comederunt de frugibus terrae die altero azymos panes et pulentam eiusdem anni"
      en: "And they ate on the next day unleavened bread of the corn of the land, and frumenty of the same year."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "defecitque manna postquam comederunt de frugibus terrae nec usi sunt ultra illo cibo filii Israhel sed comederunt de frugibus praesentis anni terrae Chanaan"
      en: "And the manna ceased after they ate of the corn of the land, neither did the children of Israel use that food any more, but they ate of the corn of the present year of the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cum autem esset Iosue in agro urbis Hiericho levavit oculos et vidit virum stantem contra se et evaginatum tenentem gladium perrexitque ad eum et ait noster es an adversariorum"
      en: "And when Josue was in the field of the city of Jericho, he lifted up his eyes, and saw a man standing over against him: holding a drawn sword, and he went to him, and said: Art thou one of ours, or of our adversaries?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui respondit nequaquam sed sum princeps exercitus Domini et nunc venio"
      en: "And he answered: No: but I am prince of the host of the Lord, and now I am come."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "cecidit Iosue pronus in terram et adorans ait quid dominus meus loquitur ad servum suum"
      en: "Josue fell on his face to the ground. And worshipping, add: What saith my lord to his servant?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "solve inquit calciamentum de pedibus tuis locus enim in quo stas sanctus est fecitque Iosue ut sibi fuerat imperatum"
      en: "Loose, saith he, thy shoes from off thy feet: for the place whereon thou standest is holy. And Josue did as was commanded him."
    status: { la: verified, en: verified }
