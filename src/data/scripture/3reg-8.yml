# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 3reg
chapter: 8
verses:
  - n: 1
    text:
      la: "tunc congregavit omnes maiores natu Israhel cum principibus tribuum et duces familiarum filiorum Israhel ad regem Salomonem in Hierusalem ut deferrent arcam foederis Domini de civitate David id est de Sion"
      en: "Then all the ancients of Israel with the princes of the tribes, and the heads of the families of the children of Israel were assembled to king Solomon in Jerusalem: that they might carry the ark of the covenant of the Lord out of the city of David, that is, out of Sion."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "convenitque ad regem Salomonem universus Israhel in mense hethanim in sollemni die ipse est mensis septimus"
      en: "And all Israel assembled themselves to king Solomon on the festival day in the month of Ethanim, the same is the seventh month."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "veneruntque cuncti senes ex Israhel et tulerunt sacerdotes arcam"
      en: "And all the ancients of Israel came, and the priests took up the ark,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et portaverunt arcam Domini et tabernaculum foederis et omnia vasa sanctuarii quae erant in tabernaculo et ferebant ea sacerdotes et Levitae"
      en: "And carried the ark of the Lord, and the tabernacle of the covenant, and all the vessels of the sanctuary, that were in the tabernacle: and the priests and the Levites carried them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "rex autem Salomon et omnis multitudo Israhel quae convenerat ad eum gradiebatur cum illo ante arcam et immolabant oves et boves absque aestimatione et numero"
      en: "And king Solomon, and all the multitude of Israel, that were assembled unto him went with him before the ark, and they sacrificed sheep and oxen that could not be counted or numbered."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et intulerunt sacerdotes arcam foederis Domini in locum suum in oraculum templi in sanctum sanctorum subter alas cherubin"
      en: "And the priests brought in the ark of the covenant of the Lord into its place, into the oracle of the temple, into the holy of holies under the wings of the cherubims."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "siquidem cherubin expandebant alas super locum arcae et protegebant arcam et vectes eius desuper"
      en: "For the cherubims spread forth their wings over the place of the ark, and covered the art, and the staves thereof above."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cumque eminerent vectes et apparerent summitates eorum foris sanctuarium ante oraculum non apparebant ultra extrinsecus qui et fuerunt ibi usque in praesentem diem"
      en: "And whereas the staves stood out, the ends of them were seen without in the sanctuary before the oracle, but were not seen farther out, and there they have been unto this day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in arca autem non est aliud nisi duae tabulae lapideae quas posuerat in ea Moses in Horeb quando pepigit foedus Dominus cum filiis Israhel cum egrederentur de terra Aegypti"
      en: "Now in the ark there was nothing else but the two tables of stone, which Moses put there at Horeb, when the Lord made a covenant with the children of Israel, when they came out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "factum est autem cum exissent sacerdotes de sanctuario nebula implevit domum Domini"
      en: "And it came to pass, when the priests were come out of the sanctuary, that a cloud filled the house of the Lord,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et non poterant sacerdotes stare et ministrare propter nebulam impleverat enim gloria Domini domum Domini"
      en: "And the priests could not stand to minister because of the cloud: for the glory of the Lord had filled the house of the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "tunc ait Salomon Dominus dixit ut habitaret in nebula"
      en: "Then Solomon said: The Lord said that he would dwell in a cloud."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "aedificans aedificavi domum in habitaculum tuum firmissimum solium tuum in sempiternum"
      en: "Building I have built a house for thy dwelling, to be thy most firm throne for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "convertitque rex faciem suam et benedixit omni ecclesiae Israhel omnis enim ecclesia Israhel stabat"
      en: "And the king turned his face, and blessed all the assembly of Israel: for all the assembly of Israel stood."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ait benedictus Dominus Deus Israhel qui locutus est ore suo ad David patrem meum et in manibus eius perfecit dicens"
      en: "And Solomon said: Blessed be the Lord the God of Israel, who spoke with his mouth to David my father, and with his own hands hath accomplished it, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "a die qua eduxi populum meum Israhel de Aegypto non elegi civitatem de universis tribubus Israhel ut aedificaretur domus et esset nomen meum ibi sed elegi David ut esset super populum meum Israhel"
      en: "Since the day that I brought my people Israel out of Egypt, I chose no city out of all the tribes of Israel, for a house to be built, that my name might be there: but I chose David to be over my people Israel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "voluitque David pater meus aedificare domum nomini Domini Dei Israhel"
      en: "And David my father would have built a house to the name of the Lord the God of Israel:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et ait Dominus ad David patrem meum quod cogitasti in corde tuo aedificare domum nomini meo bene fecisti hoc ipsum mente tractans"
      en: "And the Lord said to David my father: Whereas thou hast thought in thy heart to build a house to my name, thou hast done well in having this same thing in thy mind."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "verumtamen tu non aedificabis domum sed filius tuus qui egredietur de renibus tuis ipse aedificabit domum nomini meo"
      en: "Nevertheless thou shalt not build me a house, but thy son, that shall come forth out of thy loins, he shall build a house to my name."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "confirmavit Dominus sermonem suum quem locutus est stetique pro David patre meo et sedi super thronum Israhel sicut locutus est Dominus et aedificavi domum nomini Domini Dei Israhel"
      en: "The Lord hath performed his word which he spoke : and I stand in the room of David my father, and sit upon the throne of Israel, as the Lord promised: and have built a house to the name of the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et constitui ibi locum arcae in qua foedus est Domini quod percussit cum patribus nostris quando egressi sunt de terra Aegypti"
      en: "And I have set there a place for the ark, wherein is the covenant of the Lord, which he made with our fathers, when they came out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "stetit autem Salomon ante altare Domini in conspectu ecclesiae Israhel et expandit manus suas in caelum"
      en: "And Solomon stood before the altar of the Lord in the sight of the assembly of Israel, and spread forth his hands towards heaven;"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et ait Domine Deus Israhel non est similis tui Deus in caelo desuper et super terra deorsum qui custodis pactum et misericordiam servis tuis qui ambulant coram te in toto corde suo"
      en: "And said: Lord God of Israel, there is no God like thee in heaven above, or on earth beneath: who keepest covenant and mercy with thy servants that have walked before thee with all their heart."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "qui custodisti servo tuo David patri meo quae locutus es ei ore locutus es et manibus perfecisti ut et haec dies probat"
      en: "Who hast kept with thy servant David my father what thou hast promised him: with thy mouth thou didst speak, and with thy hands thou hast performed, as this day proveth."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "nunc igitur Domine Deus Israhel conserva famulo tuo David patri meo quae locutus es ei dicens non auferetur de te vir coram me qui sedeat super thronum Israhel ita tamen si custodierint filii tui viam suam ut ambulent coram me sicut tu ambulasti in conspectu meo"
      en: "Now therefore, O Lord God of Israel, keep with thy servant David my father what thou hast spoken to him, saying: There shall not be taken away of thee a man in my sight, to sit on the throne of Israel: yet so that thy children take heed to their way, that they walk before me as thou hast walked in my sight."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et nunc Deus Israhel firmentur verba tua quae locutus es servo tuo David patri meo"
      en: "And now, Lord God of Israel, let thy words be established, which thou hast spoken to thy servant David my father"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "ergone putandum est quod vere Deus habitet super terram si enim caelum et caeli caelorum te capere non possunt quanto magis domus haec quam aedificavi"
      en: "Is it then to be thought that God should indeed dwell upon earth? for if heaven, and the heavens of heavens cannot contain thee, how much less this house which I have built?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "sed respice ad orationem servi tui et ad preces eius Domine Deus meus audi hymnum et orationem quam servus tuus orat coram te hodie"
      en: "But have regard to the prayer of thy servant, and to his supplications, O Lord my God: hear the hymn and the prayer, which thy servant prayeth before thee this day:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ut sint oculi tui aperti super domum hanc nocte et die super domum de qua dixisti erit nomen meum ibi ut exaudias orationem qua orat te servus tuus in loco isto"
      en: "That thy eyes may be open upon this house night and day: upon the house of which thou hast said: My name shall be there: that thou mayest hearken to the prayer, which thy servant prayeth in this place to thee."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "ut exaudias deprecationem servi tui et populi tui Israhel quodcumque oraverint in loco isto et exaudies in loco habitaculi tui in caelo et cum exaudieris propitius eris"
      en: "That thou mayest hearken to the supplication of thy servant and of thy people Israel, whatsoever they shall pray for in this place, and hear them in the place of thy dwelling in heaven; and when thou hearest, shew them mercy."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "si peccaverit homo in proximum suum et habuerit aliquod iuramentum quo teneatur adstrictus et venerit propter iuramentum coram altari tuo in domum tuam"
      en: "If any man trespass against his neighbour, and have an oath upon him, wherewith he is bound: and come because of the oath before thy altar to thy house,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "tu exaudies in caelo et facies et iudicabis servos tuos condemnans impium et reddens viam suam super caput eius iustificansque iustum et retribuens ei secundum iustitiam suam"
      en: "Then hear thou in heaven: and do, and judge thy servants, condemning the wicked, and bringing his way upon his own head, and justifying the just, and rewarding him according to his justice."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "si fugerit populus tuus Israhel inimicos suos quia peccaturus est tibi et agentes paenitentiam et confitentes nomini tuo venerint et oraverint et deprecati te fuerint in domo hac"
      en: "If thy people Israel shall fly before their enemies, (because they will sin against thee,) and doing penance, and confessing to thy name, shall come, and pray, and make supplications to thee in this house:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "exaudi in caelo et dimitte peccatum populi tui Israhel et reduces eos in terram quam dedisti patribus eorum"
      en: "Then hear thou in heaven, and for- give the sin of thy people Israel, and bring them back to the land which thou gavest to their fathers."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "si clausum fuerit caelum et non pluerit propter peccata eorum et orantes in loco isto paenitentiam egerint nomini tuo et a peccatis suis conversi fuerint propter adflictionem suam"
      en: "If heaven shall be shut up, and there shall be no rain, because of their sins, and they praying in this place, shall do penance to thy name, and shall be converted from their sins, by occasion of their afflictions:"
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "exaudi eos in caelo et dimitte peccata servorum tuorum et populi tui Israhel et ostende eis viam bonam per quam ambulent et da pluviam super terram tuam quam dedisti populo tuo in possessionem"
      en: "Then hear thou them in heaven, and forgive the sins of thy servants, and of thy people Israel: and shew them the good way wherein they should walk, and give rain upon thy land, which thou hast given to thy people in possession."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "fames si oborta fuerit in terra aut pestilentia aut corruptus aer aurugo lucusta rubigo et adflixerit eum et inimicus eius portas obsidens omnis plaga universa infirmitas"
      en: "If a famine arise in the land, or a pestilence, or corrupt air, or blasting, or locust, or mildew, if their enemy afflict them besieging the gates, whatsoever plague, whatsoever infirmity,"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "cuncta devotatio et inprecatio quae acciderit omni homini de populo tuo Israhel si quis cognoverit plagam cordis sui et expanderit manus suas in domo hac"
      en: "Whatsoever curse or imprecation shall happen to any man of thy people Israel: when a man shall know the wound of his own heart, and shall spread forth his hands in this house,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "tu audies in caelo in loco habitationis tuae et repropitiaberis et facies ut des unicuique secundum omnes vias suas sicut videris cor eius quia tu nosti solus cor omnium filiorum hominum"
      en: "Then hear thou in heaven, in the place of thy dwelling, and forgive, and do so as to give to every one according to his ways, as thou shalt see his heart (for thou only knowest the heart of all the children of men)"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "ut timeant te cunctis diebus quibus vivunt super faciem terrae quam dedisti patribus nostris"
      en: "That they may fear thee all the days that they live upon the face of the land, which thou hast given to our fathers."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "insuper et alienigena qui non est de populo tuo Israhel cum venerit de terra longinqua propter nomen tuum audietur enim nomen tuum magnum et manus tua fortis et brachium tuum"
      en: "Moreover also the stranger, who is not of thy people Israel, when he shall come out of a far country for thy name's sake, (for they shall hear every where of thy great name and thy mighty hand,"
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "extentum ubique cum venerit ergo et oraverit in loco hoc"
      en: "And thy stretched out arm,) so when he shall come, and shall pray in this place,"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "tu exaudies in caelo in firmamento habitaculi tui et facies omnia pro quibus invocaverit te alienigena ut discant universi populi terrarum nomen tuum timere sicut populus tuus Israhel et probent quia nomen tuum invocatum est super domum hanc quam aedificavi"
      en: "Then hear thou in heaven, in the firmament of thy dwelling place, and do all those things, for which that stranger shall call upon thee: that all the people of the earth may learn to fear thy name, as do thy people Israel, and may prove that thy name is called upon on this house, which I have built."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "si egressus fuerit populus tuus ad bellum contra inimicos suos per viam quocumque miseris eos orabunt te contra viam civitatis quam elegisti et contra domum quam aedificavi nomini tuo"
      en: "If thy people go out to war against their enemies, by what way soever thou shalt send them, they shall pray to thee towards the way of the city, which thou hast chosen, and towards the house, which I have built to thy name:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et exaudies in caelo orationem eorum et preces eorum et facies iudicium eorum"
      en: "And then hear thou in heaven their prayers, and their supplications, and do judgment for them."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "quod si peccaverint tibi non est enim homo qui non peccet et iratus tradideris eos inimicis suis et capti ducti fuerint in terram inimicorum longe vel prope"
      en: "But if they sin against thee (for there is no man who sinneth not) and thou being angry deliver them up to their enemies, so that they be led away captives into the land of their enemies far or near;"
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "et egerint paenitentiam in corde suo in loco captivitatis et conversi deprecati te fuerint in captivitate sua dicentes peccavimus inique egimus impie gessimus"
      en: "Then if they do penance in their heart in the place of captivity, and being converted make supplication to thee in their captivity, saying: We have sinned, we have done unjustly, we have committed wickedness:"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et reversi fuerint ad te in universo corde suo et tota anima sua in terra inimicorum suorum ad quam captivi ducti sunt et oraverint te contra viam terrae suae quam dedisti patribus eorum et civitatis quam elegisti et templi quod aedificavi nomini tuo"
      en: "And return to thee with all their heart, and all their soul, in the land of their enemies, to which they had been led captives: and pray to thee towards the way of their land, which thou gavest to their fathers, and of the city which thou hast chosen, and of the temple which I have built to thy name:"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "exaudies in caelo in firmamento solii tui orationem eorum et preces et facies iudicium eorum"
      en: "Then hear thou in heaven, in the firmament of thy throne, their prayers, and their supplications, and do judgment for them:"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et propitiaberis populo tuo qui peccavit tibi et omnibus iniquitatibus eorum quibus praevaricati sunt in te et dabis misericordiam coram eis qui eos captivos habuerint ut misereantur eis"
      en: "And forgive thy people, that have sinned against thee, and all their iniquities, by which they have transgressed against thee: and give them mercy before them that have made them captives, that they may have compassion on them."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "populus enim tuus est et hereditas tua quos eduxisti de terra Aegypti de medio fornacis ferreae"
      en: "For they are thy people, and thy inheritance, whom thou hast brought out of the land of Egypt, from the midst of the furnace of iron."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "ut sint oculi tui aperti ad deprecationem servi tui et populi tui Israhel et exaudias eos in universis pro quibus invocaverint te"
      en: "That thy eyes may be open to the supplication of thy servant, and of thy people Israel, to hear them in all things for which they shall call upon thee."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "tu enim separasti eos tibi in hereditatem de universis populis terrae sicut locutus es per Mosen servum tuum quando eduxisti patres nostros de Aegypto Domine Deus"
      en: "For thou hast separated them to thyself for an inheritance from among all the people of the earth, as thou hast spoken by Moses thy servant, when thou broughtest our fathers out of Egypt, O Lord God."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "factum est autem cum conplesset Salomon orans Dominum omnem orationem et deprecationem hanc surrexit de conspectu altaris Domini utrumque enim genu in terram fixerat et manus expanderat ad caelum"
      en: "And it came to pass, when Solomon had made an end of praying all this prayer and supplication to the Lord, that he rose from before the altar of the Lord: for he had fixed both knees on the ground, and had spread his hands towards heaven."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "stetit ergo et benedixit omni ecclesiae Israhel voce magna dicens"
      en: "And he stood and blessed all the assembly of Israel with a, loud voice, saying:"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "benedictus Dominus qui dedit requiem populo suo Israhel iuxta omnia quae locutus est non cecidit ne unus quidem sermo ex omnibus bonis quae locutus est per Mosen servum suum"
      en: "Blessed be the Lord, who hath given rest to his people Israel, according to all that he promised: there hath not failed so much as one word of all the good things that he promised by his servant Moses."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "sit Dominus Deus noster nobiscum sicut fuit cum patribus nostris non derelinquens nos neque proiciens"
      en: "The Lord our God be with us, as he was with our fathers, and not leave us, nor cast us off:"
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "sed inclinet corda nostra ad se ut ambulemus in universis viis eius et custodiamus mandata eius et caerimonias et iudicia quaecumque mandavit patribus nostris"
      en: "But may he incline our hearts to himself, that we may walk in all his ways, and keep his commandments, and his ceremonies, and all his judgments which he commanded our fathers."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "et sint sermones mei isti quibus deprecatus sum coram Domino adpropinquantes Domino Deo nostro die et nocte ut faciat iudicium servo suo et populo suo Israhel per singulos dies"
      en: "And let these my words, wherewith I have prayed before the Lord, he nigh unto the Lord our God day and night, that he may do judgment for his servant, and for his people Israel day by day:"
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "et sciant omnes populi terrae quia Dominus ipse est Deus et non est ultra absque eo"
      en: "That all the people of the earth may know, that the Lord he is God, and there is no other besides him."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "sit quoque cor nostrum perfectum cum Domino Deo nostro ut ambulemus in decretis eius et custodiamus mandata eius sicut et hodie"
      en: "Let our hearts also be perfect with the Lord our God, that we may walk in his statutes, and keep his commandments, as at this day."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "igitur rex et omnis Israhel cum eo immolabant victimas coram Domino"
      en: "And the king, and all Israel him, offered victims before the Lord."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "mactavitque Salomon hostias pacificas quas immolavit Domino boum viginti duo milia ovium centum viginti milia et dedicaverunt templum Domini rex et filii Israhel"
      en: "And Solomon slew victims of peace offerings, which he sacrificed to the Lord, two and twenty thousand oxen, and hundred and twenty thousand sheep: so the king, and the children of Israel dedicated the temple of the Lord."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "in die illa sanctificavit rex medium atrii quod erat ante domum Domini fecit quippe ibi holocaustum et sacrificium et adipem pacificorum quia altare aereum quod erat coram Domino minus erat et capere non poterat holocausta et sacrificium et adipem pacificorum"
      en: "In that day the king sanctified the middle of the court that was before the house of the Lord: for there he offered the holocaust, and sacrifice, and fat of the peace offerings: because the brazen altar that was before the Lord, was too little to receive the holocaust, and sacrifice, and fat of the peace offerings."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "fecit ergo Salomon in tempore illo festivitatem celebrem et omnis Israhel cum eo multitudo magna ab introitu Emath usque ad rivum Aegypti coram Domino Deo nostro septem diebus et septem diebus id est quattuordecim diebus"
      en: "And Solomon made at the same time a solemn feast, and all Israel with him, a great multitude from the entrance of Emath to the river of Egypt, before the Lord our God, seven days and seven days, that is, fourteen days."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "et in die octava dimisit populos qui benedicentes regi profecti sunt in tabernacula sua laetantes et alacri corde super omnibus bonis quae fecerat Dominus David servo suo et Israhel populo suo"
      en: "And on the eighth day he sent away the people: and they blessed the king, and went to their dwellings rejoicing, and glad in heart for all the good things that the Lord had done for David his servant, and for Israel his people."
