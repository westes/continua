# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 7
verses:
  - n: 1
    text:
      la: "Dixitque Dominus ad eum: Ingredere tu et omnis domus tua in arcam: te enim vidi justum coram me in generatione hac."
      en: "And the Lord said to him: Go in thou and all thy house into the ark: for thee I have seen just before me in this generation."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ex omnibus animantibus mundis tolle septena et septena, masculum et feminam: de animantibus vero immundis duo et duo, masculum et feminam."
      en: "Of all clean beasts take seven and seven, the male and the female."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sed et de volatilibus caeli septena et septena, masculum et feminam: ut salvetur semen super faciem universae terrae."
      en: "But of the beasts that are unclean two and two, the male and the female. Of the fowls also of the air seven and seven, the male and the female: that seed may be saved upon the face of the whole earth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Adhuc enim, et post dies septem ego pluam super terram quadraginta diebus et quadraginta noctibus: et delebo omnem substantiam, quam feci, de superficie terrae."
      en: "For yet a while, and after seven days, I will rain upon the earth forty days and forty nights; and I will destroy every substance that I have made, from the face of the earth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Fecit ergo Noe omnia quae mandaverat ei Dominus."
      en: "And Noe did all things which the Lord had commanded him."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Eratque sexcentorum annorum quando diluvii aquae inundaverunt super terram."
      en: "And he was six hundred years old, when the waters of the flood overflowed the earth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ingressus est Noe et filii ejus, uxor ejus et uxores filiorum ejus cum eo in arcam propter aquas diluvii."
      en: "And Noe went in and his sons, his wife and the wives of his sons with him into the ark, because of the waters of the flood."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "De animantibus quoque mundis et immundis, et de volucribus, et ex omni quod movetur super terram,"
      en: "And of beasts clean and unclean, and of fowls, and of every thing that moveth upon the earth,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "duo et duo ingressa sunt ad Noe in arcam, masculus et femina, sicut praeceperat Dominus Noe."
      en: "Two and two went in to Noe into the ark, male and female, as the Lord had commanded Noe."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cumque transissent septem dies, aquae diluvii inundaverunt super terram."
      en: "And after the seven days were passed, the waters of the flood overflowed the earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Anno sexcentesimo vitae Noe, mense secundo, septimodecimo die mensis, rupti sunt omnes fontes abyssi magnae, et cataractae caeli apertae sunt:"
      en: "In the six hundredth year of the life of Noe, in the second month, in the seventeenth day of the month, all the fountains of the great deep were broken up, and the flood gates of heaven were opened:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et facta est pluvia super terram quadraginta diebus et quadraginta noctibus."
      en: "And the rain fell upon the earth forty days and forty nights."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "In articulo diei illius ingressus est Noe, et Sem, et Cham, et Japheth filii ejus; uxor illius, et tres uxores filiorum ejus cum eis in arcam:"
      en: "In the selfsame day Noe, and Sem, and Cham, and Japheth his sons: his wife, and the three wives of his sons with them, went into the ark:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ipsi et omne animal secundum genus suum, universaque jumenta in genere suo, et omne quod movetur super terram in genere suo, cunctumque volatile secundum genus suum, universae aves, omnesque volucres,"
      en: "They and every beast according to its kind, and all the cattle in their kind, and every thing that moveth upon the earth according to its kind, and every fowl according to its kind, all birds, and all that fly,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ingressae sunt ad Noe in arcam, bina et bina ex omni carne, in qua erat spiritus vitae."
      en: "Went in to Noe into the ark, two and two of all flesh, wherein was the breath of life."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et quae ingressa sunt, masculus et femina ex omni carne introierunt, sicut praeceperat ei Deus: et inclusit eum Dominus deforis."
      en: "And they that went in, went in male and female of all flesh, as God had commanded him: and the Lord shut him in on the outside."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Factumque est diluvium quadraginta diebus super terram: et multiplicatae sunt aquae, et elevaverunt arcam in sublime a terra."
      en: "And the flood was forty days upon the earth, and the waters increased, and lifted up the ark on high from the earth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vehementer enim inundaverunt, et omnia repleverunt in superficie terrae: porro arca ferebatur super aquas."
      en: "For they overflowed exceedingly: and filled all on the face of the earth: and the ark was carried upon the waters."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et aquae praevaluerunt nimis super terram: opertique sunt omnes montes excelsi sub universo caelo."
      en: "And the waters prevailed beyond measure upon the earth: and all the high mountains under the whole heaven were covered."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Quindecim cubitis altior fuit aqua super montes, quos operuerat."
      en: "The water was fifteen cubits higher than the mountains which it covered."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Consumptaque est omnis caro quae movebatur super terram, volucrum, animantium, bestiarum, omniumque reptilium, quae reptant super terram: universi homines,"
      en: "And all flesh was destroyed that moved upon the earth, both of fowl, and of cattle, and of beasts, and of all creeping things that creep upon the earth: and all men."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et cuncta, in quibus spiraculum vitae est in terra, mortua sunt."
      en: "And all things wherein there is the breath of life on the earth, died."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et delevit omnem substantiam quae erat super terram, ab homine usque ad pecus, tam reptile quam volucres caeli: et deleta sunt de terra. Remansit autem solus Noe, et qui cum eo erant in arca."
      en: "And he destroyed all the substance that was upon the earth, from man even to beast, and the creeping things and fowls of the air: and they were destroyed from the earth: and Noe only remained, and they that were with him in the ark."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Obtinueruntque aquae terram centum quinquaginta diebus."
      en: "And the waters prevailed upon the earth a hundred and fifty days."
    status: { la: verified, en: verified }
