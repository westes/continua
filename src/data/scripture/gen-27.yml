# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 27
verses:
  - n: 1
    text:
      la: "Senuit autem Isaac, et caligaverunt oculi ejus, et videre non poterat: vocavitque Esau filium suum majorem, et dixit ei: Fili mi? Cui respondit: Adsum."
      en: "Now Isaac was old, and his eyes were dim, and he could not see: and he called Esau, his elder son, and said to him: My son? And he answered: Here I am."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cui pater: Vides, inquit, quod senuerim, et ignorem diem mortis meae."
      en: "And his father said to him: Thou seest that I am old, and know not the day of my death."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Sume arma tua, pharetram, et arcum, et egredere foras: cumque venatu aliquid apprehenderis,"
      en: "Take thy arms, thy quiver, and bow, and go abroad: and when thou hast taken some thing by hunting,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "fac mihi inde pulmentum sicut velle me nosti, et affer ut comedam: et benedicat tibi anima mea antequam moriar."
      en: "Make me savoury meat thereof, as thou knowest I like, and bring it, that I may eat: and my soul may bless thee before I die."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quod cum audisset Rebecca, et ille abiisset in agrum ut jussionem patris impleret,"
      en: "And when Rebecca had heard this, and he was gone into the field to fulfill his father's commandment,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixit filio suo Jacob: Audivi patrem tuum loquentem cum Esau fratre tuo, et dicentem ei:"
      en: "She said to her son Jacob: I heard thy father talking with Esau thy brother, and saying to him:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Affer mihi de venatione tua, et fac cibos ut comedam, et benedicam tibi coram Domino antequam moriar."
      en: "Bring me of thy hunting, and make me meats that I may eat, and bless thee in the sight of the Lord, before I die."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Nunc ergo, fili mi, acquiesce consiliis meis:"
      en: "Now, therefore, my son, follow my counsel:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et pergens ad gregem, affer mihi duos haedos optimos, ut faciam ex eis escas patri tuo, quibus libenter vescitur:"
      en: "And go thy way to the flock, bring me two kids of the best, that I may make of them meat for thy father, such as he gladly eateth:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quas cum intuleris, et comederit, benedicat tibi priusquam moriatur."
      en: "Which when thou hast brought in, and he hath eaten, he may bless thee before he die."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cui ille respondit: Nosti quod Esau frater meus homo pilosus sit, et ego lenis:"
      en: "And he answered her: Thou knowest that Esau my brother is a hairy man, and I am smooth."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si attrectaverit me pater meus, et senserit, timeo ne putet me sibi voluisse illudere, et inducam super me maledictionem pro benedictione."
      en: "If my father shall feel me, and perceive it, I fear lest he will think I would have mocked him, and I shall bring upon me a curse instead of a blessing."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ad quem mater: In me sit, ait, ista maledictio, fili mi: tantum audi vocem meam, et pergens, affer quae dixi."
      en: "And his mother said to him: Upon me be this curse, my son: only hear thou my voice, and go, fetch me the things which I have said."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Abiit, et attulit, deditque matri. Paravit illa cibos, sicut velle noverat patrem illius."
      en: "He went, and brought, and gave them to his mother. She dressed meats, such as she knew his father liked."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et vestibus Esau valde bonis, quas apud se habebat domi, induit eum:"
      en: "And she put on him very good garments of Esau, which she had at home with her:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "pelliculasque haedorum circumdedit manibus, et colli nuda protexit:"
      en: "And the little skins of the kids she put about his hands, and covered the bare of his neck."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "deditque pulmentum, et panes, quos coxerat, tradidit."
      en: "And she gave him the savoury meat, and delivered him bread that she had baked."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Quibus illatis, dixit: Pater mi? At ille respondit: Audio. Quis es tu, fili mi?"
      en: "Which when he had carried in, he said: My father? But he answered: I hear. Who art thou, my son?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dixitque Jacob: Ego sum primogenitus tuus Esau: feci sicut praecepisti mihi: surge, sede, et comede de venatione mea, ut benedicat mihi anima tua."
      en: "And Jacob said: I am Esau thy firstborn: I have done as thou didst command me: arise, sit, and eat of my venison, that thy soul may bless me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Rursumque Isaac ad filium suum: Quomodo, inquit, tam cito invenire potuisti, fili mi? Qui respondit: Voluntas Dei fuit ut cito occurreret mihi quod volebam."
      en: "And Isaac said to his son: How couldst thou find it so quickly, my son? He answered: It was the will of God, that what I sought came quickly in my way."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Dixitque Isaac: Accede huc, ut tangam te, fili mi, et probem utrum tu sis filius meus Esau, an non."
      en: "And Isaac said: Come hither, that I may feel thee, my son, and may prove whether thou be my son Esau, or not."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Accessit ille ad patrem, et palpato eo, dixit Isaac: Vox quidem, vox Jacob est: sed manus, manus sunt Esau."
      en: "He came near to his father, and when he had felt him, Isaac said: The voice indeed is the voice of Jacob; but the hands are the hands of Esau."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et non cognovit eum, quia pilosae manus similitudinem majoris expresserant. Benedicens ergo illi,"
      en: "And he knew him not, because his hairy hands made him like to the elder. Then blessing him,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ait: Tu es filius meus Esau? Respondit: Ego sum."
      en: "He said: Art thou my son Esau? He answered: I am."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "At ille: Affer mihi, inquit, cibos de venatione tua, fili mi, ut benedicat tibi anima mea. Quos cum oblatos comedisset, obtulit ei etiam vinum. Quo hausto,"
      en: "Then he said: Bring me the meats of thy hunting, my son, that my soul may bless thee. And when they were brought, and he had eaten, he offered him wine also, which after he had drunk,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dixit ad eum: Accede ad me, et da mihi osculum, fili mi."
      en: "He said to him: Come near me, and give me a kiss, my son."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Accessit, et osculatus est eum. Statimque ut sensit vestimentorum illius fragrantiam, benedicens illi, ait: Ecce odor filii mei sicut odor agri pleni, cui benedixit Dominus."
      en: "He came near, and kissed him. And immediately as he smelled the fragrant smell of his garments, blessing him, he said: Behold the smell of my son is as the smell of a plentiful field, which the Lord hath blessed."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Det tibi Deus de rore caeli et de pinguedine terrae abundantiam frumenti et vini."
      en: "God give thee the dew of heaven, and of the fatness of the earth, abundance of corn and wine."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et serviant tibi populi, et adorent te tribus: esto dominus fratrum tuorum, et incurventur ante te filii matris tuae: qui maledixerit tibi, sit ille maledictus, et qui benedixerit tibi, benedictionibus repleatur."
      en: "And let peoples serve thee, and tribes worship thee: be thou lord of thy brethren, and let thy mother's children bow down before thee. Cursed be he that curseth thee: and let him that blesseth thee be filled with blessings."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Vix Isaac sermonem impleverat, et egresso Jacob foras, venit Esau,"
      en: "Isaac had scarce ended his words, when Jacob being now gone out abroad, Esau came,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "coctosque de venatione cibos intulit patri, dicens: Surge, pater mi, et comede de venatione filii tui, ut benedicat mihi anima tua."
      en: "And brought in to his father meats made of what he had taken in hunting, saying: Arise, my father, and eat of thy son's venison; that thy soul may bless me."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Dixitque illi Isaac: Quis enim es tu? Qui respondit: Ego sum filius tuus primogenitus Esau."
      en: "And Isaac said to him: Why! who art thou? He answered: I am thy firstborn son Esau."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Expavit Isaac stupore vehementi: et ultra quam credi potest admirans, ait: Quis igitur ille est qui dudum captam venationem attulit mihi, et comedi ex omnibus priusquam tu venires; benedixique ei, et erit benedictus?"
      en: "Isaac was struck with fear, and astonished exceedingly: and wondering beyond what can be believed, said Who is he then that even now brought me venison that he had taken, and I ate of all before thou camest? and I have blessed him, and he shall be blessed."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Auditis Esau sermonibus patris, irrugiit clamore magno: et consternatus, ait: Benedic etiam et mihi, pater mi."
      en: "Esau having heard his father's words, roared out with a great cry: and being in a great consternation, said: Bless me also, my father."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Qui ait: Venit germanus tuus fraudulenter, et accepit benedictionem tuam."
      en: "And he said: Thy brother came deceitfully and got thy blessing."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "At ille subjunxit: Juste vocatum est nomen ejus Jacob: supplantavit enim me en altera vice: primogenita mea ante tulit, et nunc secundo surripuit benedictionem meam. Rursumque ad patrem: Numquid non reservasti, ait, et mihi benedictionem?"
      en: "But he said again: Rightly is his name called Jacob; for he hath supplanted me lo this second time: my first birthright he took away before, and now this second time he hath stolen away my blessing. And again he said to his father: Hast thou not reserved me also a blessing?"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Respondit Isaac: Dominum tuum illum constitui, et omnes fratres ejus servituti illius subjugavi; frumento et vino stabilivi eum: et tibi post haec, fili mi, ultra quid faciam?"
      en: "Isaac answered: I have appointed him thy lord, and have made all his brethren his servants: I have established him with corn and wine, and after this, what shall I do more for thee, my son?"
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Cui Esau: Num unam, inquit, tantum benedictionem habes, pater? mihi quoque obsecro ut benedicas. Cumque ejulatu magno fleret,"
      en: "And Esau said to him: Hast thou only one blessing, father? I beseech thee bless me also. And when he wept with a loud cry,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "motus Isaac, dixit ad eum: In pinguedine terrae, et in rore caeli desuper,"
      en: "Isaac being moved, said to him: In the fat of the earth, and in the dew of heaven from above,"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "erit benedictio tua. Vives in gladio, et fratri tuo servies: tempusque veniet, cum excutias et solvas jugum ejus de cervicibus tuis."
      en: "Shall thy blessing be. Thou shalt live by the sword and shalt serve thy brother: and the time shall come, when thou shalt shake off and loose his yoke from thy neck."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Oderat ergo semper Esau Jacob pro benedictione qua benedixerat ei pater: dixitque in corde suo: Venient dies luctus patris mei, et occidam Jacob fratrem meum."
      en: "Esau therefore always hated Jacob for the blessing wherewith his father had blessed him: and he said in his heart: The days will come of the mourning of my father, and I will kill my brother Jacob."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Nuntiata sunt haec Rebeccae: quae mittens et vocans Jacob filium suum, dixit ad eum: Ecce Esau frater tuus minatur ut occidat te."
      en: "These things were told to Rebecca: and she sent and called Jacob her son, and said to him: Behold Esau thy brother threateneth to kill thee."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Nunc ergo, fili mi, audi vocem meam, et consurgens fuge ad Laban fratrem meum in Haran:"
      en: "Now therefore, my son, hear my voice: arise and flee to Laban my brother to Haran:"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "habitabisque cum eo dies paucos, donec requiescat furor fratris tui,"
      en: "And thou shalt dwell with him a few days, till the wrath of thy brother be assuaged,"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et cesset indignatio ejus, obliviscaturque eorum quae fecisti in eum: postea mittam, et adducam te inde huc: cur utroque orbabor filio in uno die?"
      en: "And his indignation cease, and he forget the things thou hast done to him: afterwards I will send, and bring thee from thence hither. Why shall I be deprived of both my sons in one day?"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Dixitque Rebecca ad Isaac: Taedet me vitae meae propter filias Heth: si acceperit Jacob uxorem de stirpe hujus terrae, nolo vivere."
      en: "And Rebecca said to Isaac: I am weary of my life because of the daughters of Heth: if Jacob take a wife of the stock of this land, I choose not to live."
    status: { la: verified, en: verified }
