# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 25
verses:
  - n: 1
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "loquere filiis Israhel ut tollant mihi primitias ab omni homine qui offert ultroneus accipietis eas"
      en: "Speak to the children of Israel, that they bring firstfruits to me: of every man that offereth of his own accord, you shall take them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "haec sunt autem quae accipere debetis aurum et argentum et aes"
      en: "And these are the things you must take: gold, and silver, and brass,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "hyacinthum et purpuram coccumque bis tinctum et byssum pilos caprarum"
      en: "Violet and purple, and scarlet twice dyed, and fine linen, and goats' hair,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et pelles arietum rubricatas pelles ianthinas et ligna setthim"
      en: "And rams' skins dyed red, and violet skins, and setim wood:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "oleum ad luminaria concinnanda aromata in unguentum et thymiama boni odoris"
      en: "Oil to make lights: spices for ointment, and for sweetsmelling incense:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "lapides onychinos et gemmas ad ornandum ephod ac rationale"
      en: "Onyx stones, and precious stones to adorn the ephod and the rational."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "facientque mihi sanctuarium et habitabo in medio eorum"
      en: "And they shall make me a sanctuary, and I will dwell in the midst of them:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "iuxta omnem similitudinem tabernaculi quod ostendam tibi et omnium vasorum in cultum eius sicque facietis illud"
      en: "According to all the likeness of the tabernacle which I will shew thee, and of all the vessels for the service thereof: and thus you shall make it:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "arcam de lignis setthim conpingite cuius longitudo habeat duos semis cubitos latitudo cubitum et dimidium altitudo cubitum similiter ac semissem"
      en: "Frame an ark of setim wood, the length whereof shall be of two cubits and a half: the breadth, a cubit and a half: the height, likewise, a cubit and a half."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et deaurabis eam auro mundissimo intus et foris faciesque supra coronam auream per circuitum"
      en: "And thou shalt overlay it with the purest gold within and without: and over it thou shalt make a golden crown round about:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et quattuor circulos aureos quos pones per quattuor arcae angulos duo circuli sint in latere uno et duo in altero"
      en: "And four golden rings, which thou shall put at the four corners of the ark: let two rings be on the one side, and two on the other."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "facies quoque vectes de lignis setthim et operies eos auro"
      en: "Thou shalt make bars also of setim wood, and shalt overlay them with gold."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "inducesque per circulos qui sunt in arcae lateribus ut portetur in eis"
      en: "And thou shalt put them in through the rings that are in the sides of the ark, that it may be carried on them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "qui semper erunt in circulis nec umquam extrahentur ab eis"
      en: "And they shall be always in the rings, neither shall they at any time be drawn out of them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ponesque in arcam testificationem quam dabo tibi"
      en: "And thou shalt put in the ark the testimony which I will give thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "facies et propitiatorium de auro mundissimo duos cubitos et dimidium tenebit longitudo eius cubitum ac semissem latitudo"
      en: "Thou shalt make also a propitiatory of the purest gold: the length thereof shall be two cubits and a half, and the breadth a cubit and a half."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "duos quoque cherubin aureos et productiles facies ex utraque parte oraculi"
      en: "Thou shalt make also two cherubims of beaten gold, on the two sides of the oracle."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cherub unus sit in latere uno et alter in altero"
      en: "Let one cherub be on the one side, and the other on the other."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "utrumque latus propitiatorii tegant expandentes alas et operientes oraculum respiciantque se mutuo versis vultibus in propitiatorium quo operienda est arca"
      en: "Let them cover both sides of the propitiatory, spreading their wings, and covering the oracle, and let them look one towards the other, their faces being turned towards the propitiatory wherewith the ark is to be covered."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "in qua pones testimonium quod dabo tibi"
      en: "In which thou shalt put the testimony that I will give thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "inde praecipiam et loquar ad te supra propitiatorio scilicet ac medio duorum cherubin qui erunt super arcam testimonii cuncta quae mandabo per te filiis Israhel"
      en: "Thence will I give orders, and will speak to thee over the propitiatory, and from the midst of the two cherubims, which shall be upon the ark of the testimony, all things which I will command the children of Israel by thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "facies et mensam de lignis setthim habentem duos cubitos longitudinis et in latitudine cubitum et in altitudine cubitum ac semissem"
      en: "Thou shalt make a table also of setim wood, of two cubits in length, and a cubit in breadth, and a cubit and half in height."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et inaurabis eam auro purissimo faciesque illi labium aureum per circuitum"
      en: "And thou shalt overlay it with the purest gold: and thou shalt make to it a golden ledge round about."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et ipsi labio coronam interrasilem altam quattuor digitis et super illam alteram coronam aureolam"
      en: "And to the ledge itself a polished crown, four inches high: and over the same another little golden crown."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "quattuor quoque circulos aureos praeparabis et pones eos in quattuor angulis eiusdem mensae per singulos pedes"
      en: "Thou shalt prepare also four golden rings, and shalt put them in the four corners of the same table over each foot."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "subter coronam erunt circuli aurei ut mittantur vectes per eos et possit mensa portari"
      en: "Under the crown shall the golden rings be, that the bars may be put through them, and the table may be carried."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "ipsosque vectes facies de lignis setthim et circumdabis auro ad subvehendam mensam"
      en: "The bars also themselves thou shalt make of setim wood, and shalt overlay them with gold to bear up the table."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "parabis et acetabula ac fialas turibula et cyatos in quibus offerenda sunt libamina ex auro purissimo"
      en: "Thou shalt prepare also dishes, and bowls, censers, and cups, wherein the libations are to be offered of the purest gold."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et pones super mensam panes propositionis in conspectu meo semper"
      en: "And thou shalt set upon the table loaves of proposition in my sight always."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "facies et candelabrum ductile de auro mundissimo hastile eius et calamos scyphos et spherulas ac lilia ex ipso procedentia"
      en: "Thou shalt make also a candlestick of beaten work of the finest gold, the shaft thereof, and the branches, the cups, and the bowls, and the lilies going forth from it."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "sex calami egredientur de lateribus tres ex uno latere et tres ex altero"
      en: "Six branches shall come out of the sides, three out of the one side, and three out of the other."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "tres scyphi quasi in nucis modum per calamos singulos spherulaque simul et lilium et tres similiter scyphi instar nucis in calamo altero spherulaque et lilium hoc erit opus sex calamorum qui producendi sunt de hastili"
      en: "Three cups as it were nuts to every branch, and a bowl withal, and a lily; and three cups, likewise of the fashion of nuts in the other branch, and a bowl withal, and a lily. Such shall be the work of the six branches, that are to come out from the shaft:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "in ipso autem candelabro erunt quattuor scyphi in nucis modum spherulaeque per singulos et lilia"
      en: "And in the candlestick itself shall be four cups in the manner of a nut, and at every one, bowls and lilies."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "spherula sub duobus calamis per tria loca qui simul sex fiunt procedentes de hastili uno"
      en: "Bowls under two branches in three places, which together make six coming forth out of one shaft."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "et spherae igitur et calami ex ipso erunt universa ductilia de auro purissimo"
      en: "And both the bowls and the branches shall be of the same beaten work of the purest gold."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "facies et lucernas septem et pones eas super candelabrum ut luceant ex adverso"
      en: "Thou shalt make also seven lamps, and shalt set them upon the candlestick, to give light over against."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "emunctoria quoque et ubi quae emuncta sunt extinguantur fient de auro purissimo"
      en: "The snuffers also and where the snuffings shall be put out, shall be made of the purest gold."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "omne pondus candelabri cum universis vasis suis habebit talentum auri mundissimi"
      en: "The whole weight of the candlestick with all the furniture thereof shall be a talent of the purest gold."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "inspice et fac secundum exemplar quod tibi in monte monstratum est"
      en: "Look and make it according to the pattern, that was shewn thee in the mount."
    status: { la: verified, en: verified }
