# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 12
verses:
  - n: 1
    text:
      la: "in illo tempore abiit Iesus sabbato per sata discipuli autem eius esurientes coeperunt vellere spicas et manducare"
      en: "At that time Jesus went through the corn on the sabbath: and his disciples being hungry, began to pluck the ears, and to eat."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Pharisaei autem videntes dixerunt ei ecce discipuli tui faciunt quod non licet eis facere sabbatis"
      en: "And the Pharisees seeing them, said to him: Behold thy disciples do that which is not lawful to do on the sabbath days."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "at ille dixit eis non legistis quid fecerit David quando esuriit et qui cum eo erant"
      en: "But he said to them: Have you not read what David did when he was hungry, and they that were with him:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quomodo intravit in domum Dei et panes propositionis comedit quos non licebat ei edere neque his qui cum eo erant nisi solis sacerdotibus"
      en: "How he entered into the house of God, and did eat the loaves of proposition, which it was not lawful for him to eat, nor for them that were with him, but for the priests only?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "aut non legistis in lege quia sabbatis sacerdotes in templo sabbatum violant et sine crimine sunt"
      en: "Or have ye not read in the law, that on the sabbath days the priests in the temple break the sabbath, and are without blame?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dico autem vobis quia templo maior est hic"
      en: "But I tell you that there is here a greater than the temple."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "si autem sciretis quid est misericordiam volo et non sacrificium numquam condemnassetis innocentes"
      en: "And if you knew what this meaneth: I will have mercy, and not sacrifice: you would never have condemned the innocent."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "dominus est enim Filius hominis etiam sabbati"
      en: "For the Son of man is Lord even of the sabbath."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et cum inde transisset venit in synagogam eorum"
      en: "And when he has passed from thence, he came into their synagogues."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et ecce homo manum habens aridam et interrogabant eum dicentes si licet sabbatis curare ut accusarent eum"
      en: "And behold there was a man who had a withered hand, and they asked him, saying: Is it lawful to heal on the sabbath days? that they might accuse him."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ipse autem dixit illis quis erit ex vobis homo qui habeat ovem unam et si ceciderit haec sabbatis in foveam nonne tenebit et levabit eam"
      en: "But he said to them: What man shall there be among you, that hath one sheep: and if the same fall into a pit on the sabbath day, will he not take hold on it and lift it up?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quanto magis melior est homo ove itaque licet sabbatis benefacere"
      en: "How much better is a man than a sheep? Therefore it it lawful to do a good deed on the sabbath days."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "tunc ait homini extende manum tuam et extendit et restituta est sanitati sicut altera"
      en: "Then he saith to the man: Stretch forth thy hand; and he stretched it forth, and it was restored to health even as the other."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "exeuntes autem Pharisaei consilium faciebant adversus eum quomodo eum perderent"
      en: "And the Pharisees going out made a consultation against him, how they might destroy him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Iesus autem sciens recessit inde et secuti sunt eum multi et curavit eos omnes"
      en: "But Jesus knowing it, retired from thence: and many followed him, and he healed them all."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et praecepit eis ne manifestum eum facerent"
      en: "And he charged them that they should not make him known."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ut adimpleretur quod dictum est per Esaiam prophetam dicentem"
      en: "That it might be fulfilled which was spoken by Isaias the prophet, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "ecce puer meus quem elegi dilectus meus in quo bene placuit animae meae ponam spiritum meum super eum et iudicium gentibus nuntiabit"
      en: "Behold my servant whom I have chosen, my beloved in whom my soul hath been well pleased. I will put my spirit upon him, and he shall shew judgment to the Gentiles."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non contendet neque clamabit neque audiet aliquis in plateis vocem eius"
      en: "He shall not contend, nor cry out, neither shall any man hear his voice in the streets."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "harundinem quassatam non confringet et linum fumigans non extinguet donec eiciat ad victoriam iudicium"
      en: "The bruised reed he shall not break: and smoking flax he shall not extinguish: till he send forth judgment unto victory."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et in nomine eius gentes sperabunt"
      en: "And in his name the Gentiles shall hope."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "tunc oblatus est ei daemonium habens caecus et mutus et curavit eum ita ut loqueretur et videret"
      en: "Then was offered to him one possessed with a devil, blind and dumb: and he healed him, so that he spoke and saw."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et stupebant omnes turbae et dicebant numquid hic est Filius David"
      en: "And all the multitudes were amazed, and said: Is not this the son of David?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Pharisaei autem audientes dixerunt hic non eicit daemones nisi in Beelzebub principe daemoniorum"
      en: "But the Pharisees hearing it, said: This man casteth not out the devils but by Beelzebub the prince of the devils."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Iesus autem sciens cogitationes eorum dixit eis omne regnum divisum contra se desolatur et omnis civitas vel domus divisa contra se non stabit"
      en: "And Jesus knowing their thoughts, said to them: Every kingdom divided against itself shall be made desolate: and every city or house divided against itself shall not stand."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et si Satanas Satanan eicit adversus se divisus est quomodo ergo stabit regnum eius"
      en: "And if Satan cast out Satan, he is divided against himself: how then shall his kingdom stand?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et si ego in Beelzebub eicio daemones filii vestri in quo eiciunt ideo ipsi iudices erunt vestri"
      en: "And if I by Beelzebub cast out devils, by whom do your children cast them out? Therefore they shall be your judges."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "si autem ego in Spiritu Dei eicio daemones igitur pervenit in vos regnum Dei"
      en: "But if I by the Spirit of God cast out devils, then is the kingdom of God come upon you."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "aut quomodo potest quisquam intrare in domum fortis et vasa eius diripere nisi prius alligaverit fortem et tunc domum illius diripiat"
      en: "Or how can any one enter into the house of the strong, and rifle his goods, unless he first bind the strong? and then he will rifle his house."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui non est mecum contra me est et qui non congregat mecum spargit"
      en: "He that is not with me, is against me: and he that gathereth not with me, scattereth."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "ideo dico vobis omne peccatum et blasphemia remittetur hominibus Spiritus autem blasphemia non remittetur"
      en: "Therefore I say to you: Every sin and blasphemy shall be forgiven men, but the blasphemy of the Spirit shall not be forgiven."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et quicumque dixerit verbum contra Filium hominis remittetur ei qui autem dixerit contra Spiritum Sanctum non remittetur ei neque in hoc saeculo neque in futuro"
      en: "And whosoever shall speak a word against the Son of man, it shall be forgiven him: but he that shall speak against the Holy Ghost, it shall not be forgiven him, neither in this world, nor in the world to come."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "aut facite arborem bonam et fructum eius bonum aut facite arborem malam et fructum eius malum siquidem ex fructu arbor agnoscitur"
      en: "Either make the tree good and its fruit good: or make the tree evil, and its fruit evil. For by the fruit the tree is known."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "progenies viperarum quomodo potestis bona loqui cum sitis mali ex abundantia enim cordis os loquitur"
      en: "O generation of vipers, how can you speak good things, whereas you are evil? for out of the abundance of the heart the mouth speaketh."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "bonus homo de bono thesauro profert bona et malus homo de malo thesauro profert mala"
      en: "A good man out of a good treasure bringeth forth good things: and an evil man out of an evil treasure bringeth forth evil things."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "dico autem vobis quoniam omne verbum otiosum quod locuti fuerint homines reddent rationem de eo in die iudicii"
      en: "But I say unto you, that every idle word that men shall speak, they shall render an account for it in the day of judgment."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "ex verbis enim tuis iustificaberis et ex verbis tuis condemnaberis"
      en: "For by thy words thou shalt be justified, and by thy words thou shalt be condemned."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "tunc responderunt ei quidam de scribis et Pharisaeis dicentes magister volumus a te signum videre"
      en: "Then some of the scribes and Pharisees answered him, saying: Master we would see a sign from thee."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "qui respondens ait illis generatio mala et adultera signum quaerit et signum non dabitur ei nisi signum Ionae prophetae"
      en: "Who answering said to them: An evil and adulterous generation seeketh a sign: and a sign shall not be given it, but the sign of Jonas the prophet."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "sicut enim fuit Ionas in ventre ceti tribus diebus et tribus noctibus sic erit Filius hominis in corde terrae tribus diebus et tribus noctibus"
      en: "For as Jonas was in the whale's belly three days and three nights: so shall the Son of man be in the heart of the earth three days and three nights."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "viri ninevitae surgent in iudicio cum generatione ista et condemnabunt eam quia paenitentiam egerunt in praedicatione Ionae et ecce plus quam Iona hic"
      en: "The men of Ninive shall rise in judgment with this generation, and shall condemn it: because they did penance at the preaching of Jonas. And behold a greater than Jonas here."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "regina austri surget in iudicio cum generatione ista et condemnabit eam quia venit a finibus terrae audire sapientiam Salomonis et ecce plus quam Salomon hic"
      en: "The queen of the south shall rise in judgment with this generation, and shall condemn it: because she came from the ends of the earth to hear the wisdom of Solomon, and behold >   ------------------------------------------------------------------------  Transfer interrupted!  And when an unclean spirit is gone out of a man he walketh through dry places seeking rest, and findeth none."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "cum autem inmundus spiritus exierit ab homine ambulat per loca arida quaerens requiem et non invenit"
      en: ""
    status: { la: verified, en: missing }
  - n: 44
    text:
      la: "tunc dicit revertar in domum meam unde exivi et veniens invenit vacantem scopis mundatam et ornatam"
      en: "Then he saith: I will return into my house from whence I came out. And coming he findeth it empty, swept, and garnished."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "tunc vadit et adsumit septem alios spiritus secum nequiores se et intrantes habitant ibi et fiunt novissima hominis illius peiora prioribus sic erit et generationi huic pessimae"
      en: "Then he goeth, and taketh with him seven other spirits more wicked than himself, and they enter in and dwell there: and the last state of that man in made worse than the first. So shall it be also to this wicked generation."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "adhuc eo loquente ad turbas ecce mater eius et fratres stabant foris quaerentes loqui ei"
      en: "As he was yet speaking to the multitudes, behold his mother and his brethren stood without, seeking to speak to him."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "dixit autem ei quidam ecce mater tua et fratres tui foris stant quaerentes te"
      en: "And one said unto him: Behold thy mother and thy brethren stand without, seeking thee."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "at ipse respondens dicenti sibi ait quae est mater mea et qui sunt fratres mei"
      en: "But he answering him that told him, said: Who is my mother, and who are my brethren?"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "et extendens manum in discipulos suos dixit ecce mater mea et fratres mei"
      en: "And stretching forth his hand towards his disciples, he said: Behold my mother and my brethren."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "quicumque enim fecerit voluntatem Patris mei qui in caelis est ipse meus et frater et soror et mater est"
      en: "For whosoever shall do the will of my Father, that is in heaven, he is my brother, and sister, and mother."
    status: { la: verified, en: verified }
