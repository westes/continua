# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 1
verses:
  - n: 1
    text:
      la: "Adam Seth Enos"
      en: "Adam, Seth, Enos,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cainan Malelehel Iared"
      en: "Cainan, Malaleel, Jared,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Enoch Matusale Lamech"
      en: "Henoc, Mathusale, Lamech,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Noe Sem Ham et Iafeth"
      en: "Noe, Sem, Cham, and Japheth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "filii Iafeth Gomer Magog Madai et Iavan Thubal Mosoch Thiras"
      en: "The sons of Japheth: Gomer, and Magog, and Madai, and Javan, Thubal, Mosoch, Thiras."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "porro filii Gomer Aschenez et Rifath et Thogorma"
      en: "And the sons of Gomer: Ascenez, and Riphath, and Thogorma."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "filii autem Iavan Elisa et Tharsis Cetthim et Dodanim"
      en: "And the sons of Javan: Elisa and Tharsis, Cethim and Dodanim."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "filii Ham Chus et Mesraim Phut et Chanaan"
      en: "The sons of Cham: Chus, and Mesrai, and Phut, and Chaanan."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "filii autem Chus Saba et Evila Sabatha et Rechma et Sabathaca porro filii Rechma Saba et Dadan"
      en: "And the sons of Chus: Saba, and Hevila, Sabatha, and Regma, and Sabathaca. And the sons of Regma: Saba, and Dadan."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Chus autem genuit Nemrod iste coepit esse potens in terra"
      en: "Now Chus begot Nemrod: he began to be mighty upon earth."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Mesraim vero genuit Ludim et Anamim et Laabim et Nepthuim"
      en: "But Mesraim begot Ludim, and Anamim, and Laabim, and Nephtuim,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Phethrosim quoque et Chasluim de quibus egressi sunt Philisthim et Capthurim"
      en: "Phetrusim also, and Casluim: from whom came the Philistines, and Caphtorim."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Chanaan vero genuit Sidonem primogenitum et Heth"
      en: "And Chanaan beget Sidon his firstborn, and the Hethite,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Iebuseum quoque et Amorreum et Gergeseum"
      en: "And the Jebusite, and the Amorrhite, and the Gergesite,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Evheumque et Aruceum et Asineum"
      en: "And the Hevite, and the Aracite, and the Sinite,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Aradium quoque et Samareum et Ematheum"
      en: "And the Aradian, and the Samarite, and the Hamathite."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "filii Sem Aelam et Assur et Arfaxad et Lud et Aram et Us et Hul et Gothor et Mosoch"
      en: "The sons of Sem: Elam and Asur, and Arphaxad, and Lud, and Aram, and Hus, and Hul, and Gether, and Mosoch."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Arfaxad autem genuit Sala qui et ipse genuit Heber"
      en: "And Arphaxad beget Sale, and Sale beget Heber."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "porro Heber nati sunt duo filii nomen uni Phaleg quia in diebus eius divisa est terra et nomen fratris eius Iectan"
      en: "And to Heber were born two sons, the name of the one was Phaleg, because In his days the earth was divided; and the name of his brother was Jectan."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Iectan autem genuit Helmodad et Saleph et Asermoth et Iare"
      en: "And Jectan beget Elmodad, and Saleph, and Asarmoth, and Jare,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Aduram quoque et Uzal et Decla"
      en: "And Adoram, and Usal, and Decla,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ebal etiam et Abimahel et Saba necnon"
      en: "And Hebal, and Abimael, and Saba,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et Ophir et Evila et Iobab omnes isti filii Iectan"
      en: "And Ophir, and Hevila, and Jobab. All these are the sons of Jectan."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Sem Arfaxad Sale"
      en: "Sem, Arphaxad, Sale,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Heber Phaleg Raau"
      en: "Heber, Phaleg, Ragau,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Serug Nahor Thare"
      en: "Serug, Nachor, Thare,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Abram iste est Abraham"
      en: "Abram, this is Abraham."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "filii autem Abraham Isaac et Ismahel"
      en: "And the sons of Abraham, Isaac and Ismahel."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "et hae generationes eorum primogenitus Ismahelis Nabaioth et Cedar et Adbeel et Mabsam"
      en: "And these are the generations of them. The firstborn of Ismahel, Nabajoth, then Cedar, and Adbeel, and Mabsam,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Masma et Duma Massa Adad et Thema"
      en: "And Masma, and Duma, Massa, Hadad, and Thema,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Iathur Naphis Cedma hii sunt filii Ismahelis"
      en: "Jetur, Naphis, Cedma: these are the sons of Ismahel."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "filii autem Cetthurae concubinae Abraham quos genuit Zamram Iecsan Madan Madian Iesboc Sue porro filii Iecsan Saba et Dadan"
      en: "And the sons of Cetura, Abraham's concubine, whom she bore: Zamran, Jecsan, Madan, Madian, Jesboc, and Sue. And the sons of Jecsan, Saba, and Dadan. And the sons of Dadan: Assurim, and Latussim, and Laomin."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "filii autem Madian Epha et Apher et Enoch et Abida et Eldaa omnes hii filii Cetthurae"
      en: "And the sons of Madian: Epha, and Epher, and Henoch, and Abida, and Eldaa. All these are the sons of Cetura."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "generavit autem Abraham Isaac cuius fuerunt filii Esau et Israhel"
      en: "And Abraham beget Isaac: and his sons were Esau and Israel."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "filii Esau Eliphaz Rauhel Iaus Ialam Core"
      en: "The sons of Esau: Eliphaz, Rahuel, Jehus, Ihelom, and Core."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "filii Eliphaz Theman Omer Sepphu Gethem Cenez Thamna Amalech"
      en: "The sons of Eliphaz: Theman, Omar, Sephi, Gathan, Cenez, and by Thamna, Amalec."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "filii Rauhel Naath Zara Samma Maza"
      en: "The sons of Rahuel: Nahath, Zara, Samma, Meza."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "filii Seir Lothan Sobal Sebeon Ana Dison Eser Disan"
      en: "The sons of Seir: Lotan. Sobal, Sebeen, Ana, Dison, Eser, Disan."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "filii Lothan Horri Humam soror autem Lothan fuit Thamna"
      en: "The sons of Lotan: Hori, Homam. And the sister of Lotan was Thamna."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "filii Sobal Alian et Manaath et Ebal et Sepphi et Onam filii Sebeon Aia et Ana filii Ana Dison"
      en: "The sons of Sobal: Alian, and Manahath, and Ebal, Sephi and Onam. The sons of Sebeon: Aia, and Ana. The son of Ana: Dison."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "filii Dison Amaran et Eseban et Iethran et Charan"
      en: "The sons of Dison: Hamram, and Eseban, and Jethran, and Charan."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "filii Eser Balaan et Zaban et Iacan filii Dison Us et Aran"
      en: "The sons of Eser: Balaan, and Zavan, and Jacan. The sons of Disan: Hus and Aran."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "isti sunt reges qui imperaverunt in terra Edom antequam esset rex super filios Israhel Bale filius Beor et nomen civitatis eius Denaba"
      en: "Now these are the kings that reigned in the land of Edom, before there was a king over the children of Israel: Bale the son of Beer: and the name of his city was Denaba."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "mortuus est autem Bale et regnavit pro eo Iobab filius Zare de Bosra"
      en: "And Bale died, and Jobab the son of Zare of Bosra, reigned in his stead."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "cumque et Iobab fuisset mortuus regnavit pro eo Husam de terra Themanorum"
      en: "And when Jobab also was dead, Husam of the land of the Themanites reigned in his stead."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "obiit quoque et Husam et regnavit pro eo Adad filius Badad qui percussit Madian in terra Moab et nomen civitatis eius Avith"
      en: "And Husam also died, and Adad the son of Badad reigned in his stead, and he defeated the Madianites in the land of Moab: and the name of his city was Avith."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "cumque et Adad fuisset mortuus regnavit pro eo Semla de Masreca"
      en: "And when Adad also was dead, Semla of Masreca reigned in his stead."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "sed et Semla mortuus est et regnavit pro eo Saul de Rooboth quae iuxta amnem sita est"
      en: "Semla also died, and Saul of Rohoboth, which is near the river, reigned in his stead."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "mortuo quoque Saul regnavit pro eo Baalanan filius Achobor"
      en: "And when Saul was dead, Balanan the son of Achobor reigned in his stead."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "sed et hic mortuus est et regnavit pro eo Adad cuius urbis fuit nomen Phou et appellata est uxor eius Mehetabel filia Matred filiae Mezaab"
      en: "He also died, and Adad reigned in his stead: and the name of his city was Phau, and his wife was called Meetabel the daughter of Matred, the daughter of Mezaab."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Adad autem mortuo duces pro regibus in Edom esse coeperunt dux Thamna dux Alva dux Ietheth"
      en: "And after the death of Adad, there began to be dukes in Edom instead of kings: duke Thamna, duke Alva, duke Jetheth,"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "dux Oolibama dux Hela dux Phinon"
      en: "Duke Oolibama, duke Ela, duke Phinon,"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "dux Cenez dux Theman dux Mabsar"
      en: "53Duke Cenez, duke Theman, duke Mabsar,"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "dux Magdihel dux Iram hii duces Edom"
      en: "Duke Magdiel, duke Hiram. These are the dukes of Edom."
    status: { la: verified, en: verified }
