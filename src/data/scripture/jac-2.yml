# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jac
chapter: 2
verses:
  - n: 1
    text:
      la: "Fratres mei, nolite in personarum acceptione habere fidem Domini nostri Jesu Christi gloriae."
      en: "My brethren, have not the faith of our Lord Jesus Christ of glory with respect of persons."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Etenim si introierit in conventum vestrum vir aureum annulum habens in veste candida, introierit autem et pauper in sordido habitu,"
      en: "For if there shall come into your assembly a man having a golden ring, in fine apparel, and there shall come in also a poor man in mean attire,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et intendatis in eum qui indutus est veste praeclara, et dixeritis ei: Tu sede hic bene: pauperi autem dicatis: Tu sta illic; aut sede sub scabello pedum meorum:"
      en: "And you have respect to him that is clothed with the fine apparel, and shall say to him: Sit thou here well; but say to the poor man: Stand thou there, or sit under my footstool:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nonne judicatis apud vosmetipsos, et facti estis judices cogitationum iniquarum?"
      en: "Do you not judge within yourselves, and are become judges of unjust thoughts?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Audite, fratres mei dilectissimi: nonne Deus elegit pauperes in hoc mundo, divites in fide, et haeredes regni, quod repromisit Deus diligentibus se?"
      en: "Hearken, my dearest brethren: hath not God chosen the poor in this world, rich in faith, and heirs of the kingdom which God hath promised to them that love him?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "vos autem exhonorastis pauperem. Nonne divites per potentiam opprimunt vos, et ipsi trahunt vos ad judicia?"
      en: "But you have dishonoured the poor man. Do not the rich oppress you by might? and do not they draw you before the judgment seats?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "nonne ipsi blasphemant bonum nomen, quod invocatum est super vos?"
      en: "Do not they blaspheme the good name that is invoked upon you?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si tamen legem perficitis regalem secundum Scripturas: Diliges proximum tuum sicut teipsum: bene facitis:"
      en: "If then you fulfill the royal law, according to the scriptures, Thou shalt love thy neighbour as thyself; you do well."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "si autem personas accipitis, peccatum operamini, redarguti a lege quasi transgressores."
      en: "But if you have respect to persons, you commit sin, being reproved by the law as transgressors."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quicumque autem totam legem servaverit, offendat autem in uno, factus est omnium reus."
      en: "And whosoever shall keep the whole law, but offend in one point, is become guilty of all."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui enim dixit: Non moechaberis, dixit et: Non occides. Quod si non moechaberis, occides autem, factus es transgressor legis."
      en: "For he that said, Thou shalt not commit adultery, said also, Thou shalt not kill. Now if thou do not commit adultery, but shalt kill, thou art become a transgressor of the law."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sic loquimini, et sic facite sicut per legem libertatis incipientes judicari."
      en: "So speak ye, and so do, as being to be judged by the law of liberty."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Judicium enim sine misericordia illi qui non fecit misericordiam: superexaltat autem misericordia judicium."
      en: "For judgment without mercy to him that hath not done mercy. And mercy exalteth itself above judgment."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quid proderit, fratres mei, si fidem quis dicat se habere, opera autem non habeat? numquid poterit fides salvare eum?"
      en: "What shall it profit, my brethren, if a man say he hath faith, but hath not works? Shall faith be able to save him?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Si autem frater et soror nudi sint, et indigeant victu quotidiano,"
      en: "And if a brother or sister be naked, and want daily food:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "dicat autem aliquis ex vobis illis: Ite in pace, calefacimini et saturamini: non dederitis autem eis quae necessaria sunt corpori, quid proderit?"
      en: "And one of you say to them: Go in peace, be ye warmed and filled; yet give them not those things that are necessary for the body, what shall it profit?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Sic et fides, si non habeat opera, mortua est in semetipsa."
      en: "So faith also, if it have not works, is dead in itself."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Sed dicet quis: Tu fidem habes, et ego opera habeo: ostende mihi fidem tuam sine operibus: et ego ostendam tibi ex operibus fidem meam."
      en: "But some man will say: Thou hast faith, and I have works: shew me thy faith without works; and I will shew thee, by works, my faith."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tu credis quoniam unus est Deus: bene facis: et daemones credunt, et contremiscunt."
      en: "Thou believest that there is one God. Thou dost well: the devils also believe and tremble."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vis autem scire, o homo inanis, quoniam fides sine operibus mortua est?"
      en: "But wilt thou know, O vain man, that faith without works is dead?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Abraham pater noster nonne ex operibus justificatus est, offerens Isaac filium suum super altare?"
      en: "Was not Abraham our father justified by works, offering up Isaac his son upon the altar?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Vides quoniam fides cooperabatur operibus illius: et ex operibus fides consummata est?"
      en: "Seest thou, that faith did co-operate with his works; and by works faith was made perfect?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et suppleta est Scriptura, dicens: Credidit Abraham Deo, et reputatum est illi ad justitiam, et amicus Dei appellatus est."
      en: "And the scripture was fulfilled, saying: Abraham believed God, and it was reputed to him to justice, and he was called the friend of God."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Videtis quoniam ex operibus justificatur homo, et non ex fide tantum?"
      en: "Do you see that by works a man is justified; and not by faith only?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Similiter et Rahab meretrix, nonne ex operibus justificata est, suscipiens nuntios, et alia via ejiciens?"
      en: "And in like manner also Rahab the harlot, was not she justified by works, receiving the messengers, and sending them out another way?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Sicut enim corpus sine spiritu mortuum est, ita et fides sine operibus mortua est."
      en: "For even as the body without the spirit is dead; so also faith without works is dead."
    status: { la: verified, en: verified }
