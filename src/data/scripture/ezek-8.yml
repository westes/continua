# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 8
verses:
  - n: 1
    text:
      la: "Et factum est in anno sexto, in sexto mense, in quinta mensis, ego sedebam in domo mea, et senes Juda sedebant contra me, et cecidit ibi super me manus Domini Dei,"
      en: "And it came to pass in the sixth year, in the sixth month, in the fifth day of the month, as I sat in my house, and the ancients of Juda sat before me, that the hand of the Lord God fell there upon me."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et vidi: et ecce similitudo quasi aspectus ignis: ab aspectu lumborum ejus, et deorsum, ignis: et a lumbis ejus, et sursum, quasi aspectus splendoris, ut visio electri."
      en: "And I saw, and behold a likeness as the appearance of fire: from the appearance of his loins, and downward, fire: and from his loins, and upward, as the appearance of brightness, as the appearance of amber."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et emissa similitudo manus apprehendit me in cincinno capitis mei, et elevavit me spiritus inter terram et caelum, et adduxit me in Jerusalem, in visione Dei, juxta ostium interius, quod respiciebat ad aquilonem, ubi erat statutum idolum zeli ad provocandam aemulationem."
      en: "And the likeness of a hand was put forth and took me by a lock of my head: and the spirit lifted me up between the earth and the heaven, and brought me in the vision of God into Jerusalem, near the inner gate, that looked toward the north, where was set the idol of jealousy to provoke to jealousy."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et ecce ibi gloria Dei Israel, secundum visionem quam videram in campo."
      en: "And behold the glory of the God of Israel was there, according to the vision which I had seen in the plain."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et dixit ad me: Fili hominis, leva oculos tuos ad viam aquilonis. Et levavi oculos meos ad viam aquilonis, et ecce ab aquilone portae altaris idolum zeli in ipso introitu."
      en: "And he said to me: Son of man, lift up thy eyes towards the way of the north. And I lifted up my eyes towards the way of the north: and behold on the north side of the gate of the altar the idol of jealousy in the very entry."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dixit ad me: Fili hominis, putasne, vides tu quid isti faciunt, abominationes magnas quas domus Israel facit hic, ut procul recedam a sanctuario meo? et adhuc conversus videbis abominationes majores."
      en: "And he said to me: Son of man, dost thou see, thinkest thou, what these are doing, the great abominations that the house of Israel committeth here, that I should depart far off from my sanctuary? and turn thee yet again and thou shalt see greater abominations."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et introduxit me ad ostium atrii, et vidi, et ecce foramen unum in pariete:"
      en: "And he brought me in to the door of the court: and I saw, and behold a hole in the wall."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et dixit ad me: Fili hominis, fode parietem. Et cum fodissem parietem, apparuit ostium unum."
      en: "And he said to me: Son of man, dig in the wall. And when I had digged in the wall, behold a door."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dixit ad me: Ingredere, et vide abominationes pessimas quas isti faciunt hic."
      en: "And he said to me: Go in, and see the wicked abominations which they commit here."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ingressus vidi, et ecce omnis similitudo reptilium et animalium, abominatio, et universa idola domus Israel depicta erant in pariete in circuitu per totum:"
      en: "And I went in and saw, and behold every form of creeping things, and of living creatures, the abomination, and all the idols of the house of Israel, were painted on the wall all round about."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et septuaginta viri de senioribus domus Israel: et Jezonias, filius Saphan, stabat in medio eorum stantium ante picturas: et unusquisque habebat thuribulum in manu sua, et vapor nebulae de thure consurgebat."
      en: "And seventy men of the ancients of the house of Israel, and Jezonias the son of Saaphan stood in the midst of them, that stood before the pictures: and every one had a censer in his hand: and a cloud of smoke went up from the incense."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et dixit ad me: Certe vides, fili hominis, quae seniores domus Israel faciunt in tenebris, unusquisque in abscondito cubiculi sui: dicunt enim: Non videt Dominus nos; dereliquit Dominus terram."
      en: "And he said to me: Surely thou seest, O son of man, what the ancients of the house of Israel do in the dark, every one in private in his chamber: for they say: The Lord seeth us not, the Lord hath forsaken the earth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et dixit ad me: Adhuc conversus videbis abominationes majores, quas isti faciunt."
      en: "And he said to me: If thou turn thee again, thou shalt see greater abominations which these commit."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et introduxit me per ostium portae domus Domini quod respiciebat ad aquilonem, et ecce ibi mulieres sedebant plangentes Adonidem."
      en: "And he brought me in by the door of the gate of the Lord's house, which looked to the north: and behold women sat there mourning for Adonis."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et dixit ad me: Certe vidisti, fili hominis: adhuc conversus videbis abominationes majores his."
      en: "And he said to me: Surely thou hast seen, O son of man: but turn thee again and thou shalt see greater abominations than these."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et introduxit me in atrium domus Domini interius, et ecce in ostio templi Domini, inter vestibulum et altare, quasi viginti quinque viri dorsa habentes contra templum Domini, et facies ad orientem: et adorabant ad ortum solis."
      en: "And he brought me into the inner court of the house of the Lord: and behold at the door of the temple of the Lord, between the porch and the altar, were about five and twenty men having their backs towards the temple of the Lord, and their faces to the east: and they adored towards the rising of the sun."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et dixit ad me: Certe vidisti, fili hominis: numquid leve est hoc domui Juda, ut facerent abominationes istas quas fecerunt hic, quia replentes terram iniquitate, conversi sunt ad irritandum me? et ecce applicant ramum ad nares suas."
      en: "And he said to me: Surely thou hast seen, O son of man: is this a light thing to the house of Juda, that they should commit these abominations which they have committed here: because they have filled the land with iniquity, and have turned to provoke me to anger? and behold they put a branch to their nose."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ergo et ego faciam in furore: non parcet oculus meus, nec miserebor: et cum clamaverint ad aures meas voce magna, non exaudiam eos."
      en: "Therefore I also will deal with them in my wrath: my eye shall not spare them, neither will I shew mercy: and when they shall cry to my ears with a loud voice, I will not hear them."
    status: { la: verified, en: verified }
