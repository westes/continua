# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 36
verses:
  - n: 1
    text:
      la: "Addens quoque Eliu, haec locutus est:"
      en: "Eliu also proceeded, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Sustine me paululum, et indicabo tibi: adhuc enim habeo quod pro Deo loquar."
      en: "Suffer me a little, and I will shew thee: for I have yet somewhat to speak in God's behalf."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Repetam scientiam meam a principio, et operatorem meum probabo justum."
      en: "I will repeat my knowledge from the beginning, and I will prove my Maker just."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vere enim absque mendacio sermones mei, et perfecta scientia probabitur tibi."
      en: "For indeed my words are without a lie, and perfect knowledge shall be proved to thee."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Deus potentes non abjicit, cum et ipse sit potens:"
      en: "God doth not cast away the mighty, whereas he himself also is mighty."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sed non salvat impios, et judicium pauperibus tribuit."
      en: "But he saveth not the wicked, and he giveth judgment to the poor."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Non auferet a justo oculos suos, et reges in solio collocat in perpetuum, et illi eriguntur."
      en: "He will not take away his eyes from the just, and he placeth kings on the throne for ever, and they are exalted."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et si fuerint in catenis, et vinciantur funibus paupertatis,"
      en: "And if they shall be in chains, and be bound with the cords of poverty:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "indicabit eis opera eorum, et scelera eorum, quia violenti fuerunt."
      en: "He shall shew them their works, and their wicked deeds, because they have been violent."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Revelabit quoque aurem eorum, ut corripiat: et loquetur, ut revertantur ab iniquitate."
      en: "He also shall open their ear, to correct them: and shall speak, that they may return from iniquity."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Si audierint et observaverint, complebunt dies suos in bono, et annos suos in gloria:"
      en: "If they shall hear and observe, they shall accomplish their days in good, and their years in glory."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si autem non audierint, transibunt per gladium, et consumentur in stultitia."
      en: "But if they hear not, they shall pass by the sword, and shall be consumed in folly."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Simulatores et callidi provocant iram Dei, neque clamabunt cum vincti fuerint."
      en: "Dissemblers and crafty men prove the wrath of God, neither shall they cry when they are bound."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Morietur in tempestate anima eorum, et vita eorum inter effeminatos."
      en: "Their soul shall die in a storm, and their life among the effeminate."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Eripiet de angustia sua pauperem, et revelabit in tribulatione aurem ejus."
      en: "He shall deliver the poor out of his distress, and shall open his ear in affliction."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Igitur salvabit te de ore angusto latissime, et non habente fundamentum subter se: requies autem mensae tuae erit plena pinguedine."
      en: "Therefore he shall set thee at large out of the narrow mouth, and which hath no foundation under it: and the rest of thy table shall be full of fatness."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Causa tua quasi impii judicata est: causam judiciumque recipies."
      en: "Thy cause hath been judged as that of the wicked, cause and judgment thou shalt recover."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Non te ergo superet ira ut aliquem opprimas: nec multitudo donorum inclinet te."
      en: "Therefore let not anger overcome thee to oppress any man: neither let multitude of gifts turn thee aside."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Depone magnitudinem tuam absque tribulatione, et omnes robustos fortitudine."
      en: "Lay down thy greatness without tribulation, and all the mighty of strength."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ne protrahas noctem, ut ascendant populi pro eis."
      en: "Prolong not the night that people may come up for them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Cave ne declines ad iniquitatem: hanc enim coepisti sequi post miseriam."
      en: "Beware thou turn not aside to iniquity: for this thou hast begun to follow after misery."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Ecce Deus excelsus in fortitudine sua, et nullus ei similis in legislatoribus."
      en: "Behold, God is high in his strength, and none is like him among the lawgivers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quis poterit scrutari vias ejus? aut quis potest ei dicere: Operatus es iniquitatem?"
      en: "Who can search out his ways? or who can say to him: Thou has wrought iniquity?"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Memento quod ignores opus ejus, de quo cecinerunt viri."
      en: "Remember that thou knowest not his work, concerning which men have sung."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Omnes homines vident eum: unusquisque intuetur procul."
      en: "All men see him, every one beholdeth afar off."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Ecce Deus magnus vincens scientiam nostram: numerus annorum ejus inaestimabilis."
      en: "Behold, God is great, exceeding our knowledge: the number of his years is inestimable."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Qui aufert stillas pluviae, et effundit imbres ad instar gurgitum,"
      en: "He lifteth up the drops of rain, and poureth out showers like floods:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui de nubibus fluunt, quae praetexunt cuncta desuper."
      en: "Which flow from the clouds that cover all above."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Si voluerit extendere nubes quasi tentorium suum,"
      en: "If he will spread out clouds as his tent,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et fulgurare lumine suo desuper, cardines quoque maris operiet."
      en: "And lighten with his light from above, he shall cover also the ends of the sea."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Per haec enim judicat populos, et dat escas multis mortalibus."
      en: "For by these he judgeth people, and giveth food to many mortals."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "In manibus abscondit lucem, et praecepit ei ut rursus adveniat."
      en: "In his hands he hideth the light, and commandeth it to come again."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Annuntiat de ea amico suo, quod possessio ejus sit, et ad eam possit ascendere."
      en: "He sheweth his friend concerning it, that it is his possession, and that he may come up to it."
    status: { la: verified, en: verified }
