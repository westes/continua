# Wisdom 10:17-21, transcribed from a live Divinum Officium query
# (Monastic Tridentinum 1617, command=prayMatutinum, 2026-08-18 -- St.
# Andrew's own day, 2026-11-30, Matins Nocturn III's third canticle --
# the source labels it "Ibid. 10:17-21", i.e. still Wisdom). Only these
# verses are authored; the rest of the chapter is unauthored.
book: sap
chapter: 10
verses:
  - n: 17
    text:
      la: "Réddidit Deus justis mercédem labórum suórum, * et dedúxit illos in via mirábili:"
      en: "And God rendered to the just the wages of their labours, and conducted them in a wonderful way:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et fuit illis in velaménto diéi, * et in luce stellárum per noctem;"
      en: "And he was to them for a covert by day, and for the light of stars by night:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tránstulit illos per mare Rubrum, * et transvéxit illos per aquam nímiam."
      en: "And he brought them through the Red Sea, and carried them over through a great water."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Inimícos autem illórum demérsit in mare, * et ab altitúdine inferórum edúxit illos."
      en: "But their enemies he drowned in the sea, and from the depth of hell he brought them out."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Ideo justi tulérunt spólia impiórum, * et decantavérunt, Dómine, nomen sanctum tuum,"
      en: "Therefore the just took the spoils of the wicked, and they sung to your holy name, O Lord,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et victrícem manum tuam laudavérunt páriter: quóniam sapiéntia apéruit os mutórum, * et línguas infántium fecit disértas."
      en: "And they praised with one accord your victorious hand, for wisdom opened the mouth of the dumb, and made the tongues of infants eloquent."
    status: { la: verified, en: verified }
