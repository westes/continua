# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 17
verses:
  - n: 1
    text:
      la: "Deus creavit de terra hominem, et secundum imaginem suam fecit illum:"
      en: "God created man of the earth, and made him after his own image."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et iterum convertit illum in ipsam, et secundum se vestivit illum virtute."
      en: "And he turned him into it again, and clothed him with strength according to himself."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Numerum dierum et tempus dedit illi, et dedit illi potestatem eorum quae sunt super terram."
      en: "He gave him the number of his days and time, and gave him power over all things that are upon the earth."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Posuit timorem illius super omnem carnem, et dominatus est bestiarum et volatilium."
      en: "He put the fear of him upon all flesh, and he had dominion over beasts and fowls."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Creavit ex ipso adjutorium simile sibi: consilium, et linguam, et oculos, et aures, et cor dedit illis excogitandi, et disciplina intellectus replevit illos."
      en: "He created of him a helpmate like to himself: he gave them counsel, and a tongue, and eyes, and ears, and a heart to devise: and he filled them with the knowledge of understanding."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Creavit illis scientiam spiritus, sensu implevit cor illorum, et mala et bona ostendit illis."
      en: "He created in them the science of the spirit, he filled their heart with wisdom, and shewed them both good and evil."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Posuit oculum suum super corda illorum, ostendere illis magnalia operum suorum:"
      en: "He set his eye upon their hearts to shew them the greatness of his works:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ut nomen sanctificationis collaudent, et gloriari in mirabilibus illius; ut magnalia enarrent operum ejus."
      en: "That they might praise the name which he hath sanctified: and glory in his wondrous acts, that they might declare the glorious things of his works."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Addidit illis disciplinam, et legem vitae haereditavit illos."
      en: "Moreover he gave them instructions, and the law of life for an inheritance."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Testamentum aeternum constituit cum illis, et justitiam et judicia sua ostendit illis."
      en: "He made an everlasting covenant with them, and he shewed them his justice and judgments."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et magnalia honoris ejus vidit oculus illorum, et honorem vocis audierunt aures illorum. Et dixit illis: Attendite ab omni iniquo."
      en: "And their eye saw the majesty of his glory. and their ears heard his glorious voice, and he said to them: Beware of all iniquity."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et mandavit illis unicuique de proximo suo."
      en: "And he gave to every one of them commandment concerning his neighbour."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Viae illorum coram ipso sunt semper: non sunt absconsae ab oculis ipsius."
      en: "Their ways are always before him, they are not hidden from his eyes."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "In unamquamque gentem praeposuit rectorem:"
      en: "Over every nation he set a ruler."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et pars Dei Israel facta est manifesta."
      en: "And Israel was made the manifest portion of God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et omnia opera illorum velut sol in conspectu Dei: et oculi ejus sine intermissione inspicientes in viis eorum."
      en: "And all their works are as the sun in the sight of God: and his eyes are continually upon their ways."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non sunt absconsa testamenta per iniquitatem illorum, et omnes iniquitates eorum in conspectu Dei."
      en: "Their covenants were not hid by their iniquity, and all their iniquities are in the sight of God."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Eleemosyna viri quasi signaculum cum ipso, et gratiam hominis quasi pupillam conservabit."
      en: "The alms of a man is as a signet with him, and shall preserve the grace of a man as the apple of the eye:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et postea resurget, et retribuet illis retributionem, unicuique in caput ipsorum, et convertet in interiores partes terrae."
      en: "And afterward he shall rise up, and shall render them their reward, to every one upon their own head, and shall turn them down into the bowels of the earth."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Poenitentibus autem dedit viam justitiae, et confirmavit deficientes sustinere, et destinavit illis sortem veritatis."
      en: "But to the penitent he hath given the way of justice, and he hath strengthened them that were fainting in patience, and hath appointed to them the lot of truth."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Convertere ad Dominum, et relinque peccata tua:"
      en: "Turn to the Lord, and forsake thy sins:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "precare ante faciem Domini, et minue offendicula."
      en: "Make thy prayer before the face of the Lord, and offend less."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Revertere ad Dominum, et avertere ab injustitia tua, et nimis odito execrationem:"
      en: "Return to the Lord, and turn away from thy injustice, and greatly hate abomination."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et cognosce justitias et judicia Dei, et sta in sorte propositionis, et orationis altissimi Dei."
      en: "And know the justices and judgments of God, and stand firm in the lot set before thee, and in prayer to the most high God."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "In partes vade saeculi sancti, cum vivis et dantibus confessionem Deo."
      en: "Go to the side of the holy age, with them that live and give praise to God."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Non demoreris in errore impiorum: ante mortem confitere: a mortuo, quasi nihil, perit confessio."
      en: "Tarry not in the error of the ungodly, give glory before death. Praise perisheth from the dead as nothing."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Confiteberis vivens, vivus et sanus confiteberis: et laudabis Deum, et gloriaberis in miserationibus illius."
      en: "Give thanks whilst thou art living, whilst thou art alive and in health thou shalt give thanks, and shalt praise God, and shalt glory in his mercies."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Quam magna misericordia Domini, et propitiatio illius convertentibus ad se!"
      en: "How great is the mercy of the Lord, and his forgiveness to them that turn to him!"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Nec enim omnia possunt esse in hominibus, quoniam non est immortalis filius hominis, et in vanitate malitiae placuerunt."
      en: "For all things cannot be in men, because the son of man is not immortal, and they are delighted with the vanity of evil."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Quid lucidius sole? et hic deficiet; aut quid nequius quam quod excogitavit caro et sanguis? et hoc arguetur."
      en: "What is brighter than the sun; yet it shall be eclipsed. Or what is more wicked than that which flesh and blood hath invented? and this shall be reproved."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Virtutem altitudinis caeli ipse conspicit: et omnes homines terra et cinis."
      en: "He beholdeth the power of the height of heaven: and all men are earth and ashes."
    status: { la: verified, en: verified }
