# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1cor
chapter: 9
verses:
  - n: 1
    text:
      la: "non sum liber non sum apostolus nonne Iesum Dominum nostrum vidi non opus meum vos estis in Domino"
      en: "Am not I free? Am not I an apostle? Have not I seen Christ Jesus our Lord? Are not you my work in the Lord?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "si aliis non sum apostolus sed tamen vobis sum nam signaculum apostolatus mei vos estis in Domino"
      en: "And if unto others I be not an apostle, but yet to you I am. For you are the seal of my apostleship in the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "mea defensio apud eos qui me interrogant haec est"
      en: "My defence with them that do examine me is this."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "numquid non habemus potestatem manducandi et bibendi"
      en: "Have not we power to eat and to drink?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "numquid non habemus potestatem sororem mulierem circumducendi sicut et ceteri apostoli et fratres Domini et Cephas"
      en: "Have we not power to carry about a woman, a sister, as well as the rest of the apostles, and the brethren of the Lord, and Cephas?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "aut solus ego et Barnabas non habemus potestatem hoc operandi"
      en: "Or I only and Barnabas, have not we power to do this?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quis militat suis stipendiis umquam quis plantat vineam et fructum eius non edit quis pascit gregem et de lacte gregis non manducat"
      en: "Who serveth as a soldier at any time, at his own charges? Who planteth a vineyard, and eateth not of the fruit thereof? Who feedeth the flock, and eateth not of the milk of the flock?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "numquid secundum hominem haec dico an et lex haec non dicit"
      en: "Speak I these things according to man? Or doth not the law also say these things?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "scriptum est enim in lege Mosi non alligabis os bovi trituranti numquid de bubus cura est Deo"
      en: "For it is written in the law of Moses: Thou shalt not muzzle the mouth of the ox that treadeth out the corn. Doth God take care for oxen?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "an propter nos utique dicit nam propter nos scripta sunt quoniam debet in spe qui arat arare et qui triturat in spe fructus percipiendi"
      en: "Or doth he say this indeed for our sakes? For these things are written for our sakes: that he that plougheth, should plough in hope; and he that thrasheth, in hope to receive fruit."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si nos vobis spiritalia seminavimus magnum est si nos carnalia vestra metamus"
      en: "If we have sown unto you spiritual things, is it a great matter if we reap your carnal things?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si alii potestatis vestrae participes sunt non potius nos sed non usi sumus hac potestate sed omnia sustinemus ne quod offendiculum demus evangelio Christi"
      en: "If others be partakers of this power over you, why not we rather? Nevertheless, we have not used this power: but we bear all things, lest we should give any hindrance to the gospel of Christ."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "nescitis quoniam qui in sacrario operantur quae de sacrario sunt edunt qui altario deserviunt cum altario participantur"
      en: "Know you not, that they who work in the holy place, eat the things that are of the holy place; and they that serve the altar, partake with the altar?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ita et Dominus ordinavit his qui evangelium adnuntiant de evangelio vivere"
      en: "So also the Lord ordained that they who preach the gospel, should live by the gospel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ego autem nullo horum usus sum non scripsi autem haec ut ita fiant in me bonum est enim mihi magis mori quam ut gloriam meam quis evacuet"
      en: "But I have used none of these things. Neither have I written these things, that they should be so done unto me: for it is good for me to die, rather than that any man should make my glory void."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "nam si evangelizavero non est mihi gloria necessitas enim mihi incumbit vae enim mihi est si non evangelizavero"
      en: "For if I preach the gospel, it is no glory to me, for a necessity lieth upon me: for woe is unto me if I preach not the gospel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "si enim volens hoc ago mercedem habeo si autem invitus dispensatio mihi credita est"
      en: "For if I do this thing willingly, I have a reward: but if against my will, a dispensation is committed to me:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quae est ergo merces mea ut evangelium praedicans sine sumptu ponam evangelium ut non abutar potestate mea in evangelio"
      en: "What is my reward then? That preaching the gospel, I may deliver the gospel without charge, that I abuse not my power in the gospel."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nam cum liber essem ex omnibus omnium me servum feci ut plures lucri facerem"
      en: "For whereas I was free as to all, I made myself the servant of all, that I might gain the more."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et factus sum Iudaeis tamquam Iudaeus ut Iudaeos lucrarer"
      en: "And I became to the Jews, a Jew, that I might gain the Jews:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "his qui sub lege sunt quasi sub lege essem cum ipse non essem sub lege ut eos qui sub lege erant lucri facerem his qui sine lege erant tamquam sine lege essem cum sine lege Dei non essem sed in lege essem Christi ut lucri facerem eos qui sine lege erant"
      en: "To them that are under the law, as if I were under the law, (whereas myself was not under the law,) that I might gain them that were under the law. To them that were without the law, as if I were without the law, (whereas I was not without the law of God, but was in the law of Christ,) that I might gain them that were without the law."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "factus sum infirmis infirmus ut infirmos lucri facerem omnibus omnia factus sum ut omnes facerem salvos"
      en: "To the weak I became weak, that I might gain the weak. I became all things to all men, that I might save all."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "omnia autem facio propter evangelium ut particeps eius efficiar"
      en: "And I do all things for the gospel's sake: that I may be made partaker thereof."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "nescitis quod hii qui in stadio currunt omnes quidem currunt sed unus accipit bravium sic currite ut conprehendatis"
      en: "Know you not that they that run in the race, all run indeed, but one receiveth the prize ? So run that you may obtain."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "omnis autem qui in agone contendit ab omnibus se abstinet et illi quidem ut corruptibilem coronam accipiant nos autem incorruptam"
      en: "And every one that striveth for the mastery, refraineth himself from all things: and they indeed that they may receive a corruptible crown; but we an incorruptible one."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "ego igitur sic curro non quasi in incertum sic pugno non quasi aerem verberans"
      en: "I therefore so run, not as at an uncertainty: I so fight, not as one beating the air:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sed castigo corpus meum et in servitutem redigo ne forte cum aliis praedicaverim ipse reprobus efficiar"
      en: "But I chastise my body, and bring it into subjection: lest perhaps, when I have preached to others, I myself should become a castaway."
    status: { la: verified, en: verified }
