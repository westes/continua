# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 26
verses:
  - n: 1
    text:
      la: "Et factum est: cum consummasset Jesus sermones hos omnes, dixit discipulis suis:"
      en: "And it came to pass, when Jesus had ended all these words, he said to his disciples:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Scitis quia post biduum Pascha fiet, et Filius hominis tradetur ut crucifigatur."
      en: "You know that after two days shall be the pasch, and the son of man shall be delivered up to be crucified:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tunc congregati sunt principes sacerdotum, et seniores populi, in atrium principis sacerdotum, qui dicebatur Caiphas:"
      en: "Then were gathered together the chief priests and ancients of the people into the court of the high priest, who was called Caiphas:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et consilium fecerunt ut Jesum dolo tenerent, et occiderent."
      en: "And they consulted together, that by subtilty they might apprehend Jesus, and put him to death."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dicebant autem: Non in die festo, ne forte tumultus fieret in populo."
      en: "But they said: Not on the festival day, lest perhaps there should be a tumult among the people."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cum autem Jesus esset in Bethania in domo Simonis leprosi,"
      en: "And when Jesus was in Bethania, in the house of Simon the leper,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "accessit ad eum mulier habens alabastrum unguenti pretiosi, et effudit super caput ipsius recumbentis."
      en: "There came to him a woman having an alabaster box of precious ointment, and poured it on his head as he was at table."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Videntes autem discipuli, indignati sunt, dicentes: Ut quid perditio haec?"
      en: "And the disciples seeing it, had indignation, saying: To what purpose is this waste?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "potuit enim istud venundari multo, et dari pauperibus."
      en: "For this might have been sold for much, and given to the poor."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Sciens autem Jesus, ait illis: Quid molesti estis huic mulieri? opus enim bonum operata est in me."
      en: "And Jesus knowing it, said to them: Why do you trouble this woman? for she hath wrought a good work upon me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nam semper pauperes habetis vobiscum: me autem non semper habetis."
      en: "For the poor you have always with you: but me you have not always."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Mittens enim haec unguentum hoc in corpus meum, ad sepeliendum me fecit."
      en: "For she in pouring this ointment upon my body, hath done it for my burial."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Amen dico vobis, ubicumque praedicatum fuerit hoc Evangelium in toto mundo, dicetur et quod haec fecit in memoriam ejus."
      en: "Amen I say to you, wheresoever this gospel shall be preached in the whole world, that also which she hath done, shall be told for a memory of her."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tunc abiit unus de duodecim, qui dicebatur Judas Iscariotes, ad principes sacerdotum:"
      en: "Then went one of the twelve, who was called Judas Iscariot, to the chief priests,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ait illis: Quid vultis mihi dare, et ego vobis eum tradam? At illi constituerunt ei triginta argenteos."
      en: "And said to them: What will you give me, and I will deliver him unto you? But they appointed him thirty pieces of silver."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et exinde quaerebat opportunitatem ut eum traderet."
      en: "And from thenceforth he sought opportunity to betray him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Prima autem die azymorum accesserunt discipuli ad Jesum, dicentes: Ubi vis paremus tibi comedere Pascha?"
      en: "And on the first day of the Azymes, the disciples came to Jesus, saying: Where wilt thou that we prepare for thee to eat the pasch?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "At Jesus dixit: Ite in civitatem ad quemdam, et dicite ei: Magister dicit: Tempus meum prope est, apud te facio Pascha cum discipulis meis."
      en: "But Jesus said: Go ye into the city to a certain man, and say to him: the master saith, My time is near at hand, with thee I make the pasch with my disciples."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et fecerunt discipuli sicut constituit illis Jesus, et paraverunt Pascha."
      en: "And the disciples did as Jesus appointed to them, and they prepared the pasch."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Vespere autem facto, discumbebat cum duodecim discipulis suis."
      en: "But when it was evening, he sat down with his twelve disciples."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et edentibus illis, dixit: Amen dico vobis, quia unus vestrum me traditurus est."
      en: "And whilst they were eating, he said: Amen I say to you, that one of you is about to betray me."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et contristati valde, coeperunt singuli dicere: Numquid ego sum Domine?"
      en: "And they being very much troubled, began every one to say: Is it I, Lord?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "At ipse respondens, ait: Qui intingit mecum manum in paropside, hic me tradet."
      en: "But he answering, said: He that dippeth his hand with me in the dish, he shall betray me."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Filius quidem hominis vadit, sicut scriptum est de illo: vae autem homini illi, per quem Filius hominis tradetur! bonum erat ei, si natus non fuisset homo ille."
      en: "The Son of man indeed goeth, as it is written of him: but woe to that man by whom the Son of man shall be betrayed: it were better for him, if that man had not been born."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Respondens autem Judas, qui tradidit eum, dixit: Numquid ego sum Rabbi? Ait illi: Tu dixisti."
      en: "And Judas that betrayed him, answering, said: Is it I, Rabbi? He saith to him: Thou hast said it."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Coenantibus autem eis, accepit Jesus panem, et benedixit, ac fregit, deditque discipulis suis, et ait: Accipite, et comedite: hoc est corpus meum."
      en: "And whilst they were at supper, Jesus took bread, and blessed, and broke: and gave to his disciples, and said: Take ye, and eat. This is my body."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et accipiens calicem, gratias egit: et dedit illis, dicens: Bibite ex hoc omnes."
      en: "And taking the chalice, he gave thanks, and gave to them, saying: Drink ye all of this."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Hic est enim sanguis meus novi testamenti, qui pro multis effundetur in remissionem peccatorum."
      en: "For this is my blood of the new testament, which shall be shed for many unto remission of sins."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Dico autem vobis: non bibam amodo de hoc genimine vitis usque in diem illum, cum illud bibam vobiscum novum in regno Patris mei."
      en: "And I say to you, I will not drink from henceforth of this fruit of the vine, until that day when I shall drink it with you new in the kingdom of my Father."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et hymno dicto, exierunt in montem Oliveti."
      en: "And a hymn being said, they went out unto mount Olivet."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Tunc dicit illis Jesus: Omnes vos scandalum patiemini in me in ista nocte. Scriptum est enim: Percutiam pastorem, et dispergentur oves gregis."
      en: "Then Jesus said to them: All you shall be scandalized in me this night. For it is written: I will strike the shepherd, and the sheep of the flock shall be dispersed."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Postquam autem resurrexero, praecedam vos in Galilaeam."
      en: "But after I shall be risen again, I will go before you into Galilee."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Respondens autem Petrus, ait illi: Et si omnes scandalizati fuerint in te, ego numquam scandalizabor."
      en: "And Peter answering, said to him: Although all shall be scandalized in thee, I will never be scandalized."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Ait illi Jesus: Amen dico tibi, quia in hac nocte, antequam gallus cantet, ter me negabis."
      en: "Jesus said to him: Amen I say to thee, that in this night before the cock crow, thou wilt deny me thrice."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Ait illi Petrus: Etiamsi oportuerit me mori tecum, non te negabo. Similiter et omnes discipuli dixerunt."
      en: "Peter saith to him: Yea, though I should die with thee, I will not deny thee. And in like manner said all the disciples."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Tunc venit Jesus cum illis in villam, quae dicitur Gethsemani, et dixit discipulis suis: Sedete hic donec vadam illuc, et orem."
      en: "Then Jesus came with them into a country place which is called Gethsemani; and he said to his disciples: Sit you here, till I go yonder and pray."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Et assumpto Petro, et duobus filiis Zebedaei, coepit contristari et moestus esse."
      en: "And taking with him Peter and the two sons of Zebedee, he began to grow sorrowful and to be sad."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Tunc ait illis: Tristis est anima mea usque ad mortem: sustinete hic, et vigilate mecum."
      en: "Then he saith to them: My soul is sorrowful even unto death: stay you here, and watch with me."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et progressus pusillum, procidit in faciem suam, orans, et dicens: Pater mi, si possibile est, transeat a me calix iste: verumtamen non sicut ego volo, sed sicut tu."
      en: "And going a little further, he fell upon his face, praying, and saying: My Father, if it be possible, let this chalice pass from me. Nevertheless not as I will, but as thou wilt."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et venit ad discipulos suos, et invenit eos dormientes, et dicit Petro: Sic non potuistis una hora vigilare mecum?"
      en: "And he cometh to his disciples, and findeth them asleep, and he saith to Peter: What? Could you not watch one hour with me?"
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Vigilate, et orate ut non intretis in tentationem. Spiritus quidem promptus est, caro autem infirma."
      en: "Watch ye, and pray that ye enter not into temptation. The spirit indeed is willing, but the flesh weak."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Iterum secundo abiit, et oravit, dicens: Pater mi, si non potest hic calix transire nisi bibam illum, fiat voluntas tua."
      en: "Again the second time, he went and prayed, saying: My Father, if this chalice may not pass away, but I must drink it, thy will be done."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et venit iterum, et invenit eos dormientes: erant enim oculi eorum gravati."
      en: "And he cometh again and findeth them sleeping: for their eyes were heavy."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et relictis illis, iterum abiit, et oravit tertio, eumdem sermonem dicens."
      en: "And leaving them, he went again: and he prayed the third time, saying the selfsame word."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Tunc venit ad discipulos suos, et dicit illis: Dormite jam, et requiescite: ecce appropinquavit hora, et Filius hominis tradetur in manus peccatorum."
      en: "Then he cometh to his disciples, and saith to them: Sleep ye now and take your rest; behold the hour is at hand, and the Son of man shall be betrayed into the hands of sinners."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Surgite, eamus: ecce appropinquavit qui me tradet."
      en: "Rise, let us go: behold he is at hand that will betray me."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Adhuc eo loquente, ecce Judas unus de duodecim venit, et cum eo turba multa cum gladiis et fustibus, missi a principibus sacerdotum, et senioribus populi."
      en: "As he yet spoke, behold Judas, one of the twelve, came, and with him a great multitude with swords and clubs, sent from the chief priests and the ancients of the people."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Qui autem tradidit eum, dedit illis signum, dicens: Quemcumque osculatus fuero, ipse est, tenete eum."
      en: "And he that betrayed him, gave them a sign, saying: Whomsoever I shall kiss, that is he, hold him fast."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et confestim accedens ad Jesum, dixit: Ave Rabbi. Et osculatus est eum."
      en: "And forthwith coming to Jesus, he said: Hail, Rabbi. And he kissed him."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Dixitque illi Jesus: Amice, ad quid venisti? Tunc accesserunt, et manus injecerunt in Jesum, et tenuerunt eum."
      en: "And Jesus said to him: Friend, whereto art thou come? Then they came up, and laid hands on Jesus, and held him."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et ecce unus ex his qui erant cum Jesu, extendens manum, exemit gladium suum, et percutiens servum principis sacerdotum amputavit auriculam ejus."
      en: "And behold one of them that were with Jesus, stretching forth his hand, drew out his sword: and striking the servant of the high priest, cut off his ear."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Tunc ait illi Jesus: Converte gladium tuum in locum suum: omnes enim, qui acceperint gladium, gladio peribunt."
      en: "Then Jesus saith to him: Put up again thy sword into its place: for all that take the sword shall perish with the sword."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "An putas, quia non possum rogare patrem meum, et exhibebit mihi modo plusquam duodecim legiones angelorum?"
      en: "Thinkest thou that I cannot ask my Father, and he will give me presently more than twelve legions of angels?"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Quomodo ergo implebuntur Scripturae, quia sic oportet fieri?"
      en: "How then shall the scriptures be fulfilled, that so it must be done?"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "In illa hora dixit Jesus turbis: Tamquam ad latronem existis cum gladiis et fustibus comprehendere me: quotidie apud vos sedebam docens in templo, et non me tenuistis."
      en: "In that same hour Jesus said to the multitudes: You are come out as it were to a robber with swords and clubs to apprehend me. I sat daily with you, teaching in the temple, and you laid not hands on me."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Hoc autem totum factum est, ut adimplerentur Scripturae prophetarum. Tunc discipuli omnes, relicto eo, fugerunt."
      en: "Now all this was done, that the scriptures of the prophets might be fulfilled. Then the disciples all leaving him, fled."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "At illi tenentes Jesum, duxerunt ad Caipham principem sacerdotum, ubi scribae et seniores convenerant."
      en: "But they holding Jesus led him to Caiphas the high priest, where the scribes and the ancients were assembled."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Petrus autem sequebatur eum a longe, usque in atrium principis sacerdotum. Et ingressus intro, sedebat cum ministris, ut videret finem."
      en: "And Peter followed him afar off, even to the court of the high priest. And going in, he sat with the servants, that he might see the end."
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "Principes autem sacerdotum, et omne concilium, quaerebant falsum testimonium contra Jesum, ut eum morti traderent:"
      en: "And the chief priests and the whole council sought false witness against Jesus, that they might put him to death:"
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "et non invenerunt, cum multi falsi testes accessissent. Novissime autem venerunt duo falsi testes,"
      en: "And they found not, whereas many false witnesses had come in. And last of all there came two false witnesses:"
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "et dixerunt: Hic dixit: Possum destruere templum Dei, et post triduum reaedificare illud."
      en: "And they said: This man said, I am able to destroy the temple of God, and after three days to rebuild it."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Et surgens princeps sacerdotum, ait illi: Nihil respondes ad ea, quae isti adversum te testificantur?"
      en: "And the high priest rising up, said to him: Answerest thou nothing to the things which these witness against thee?"
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Jesus autem tacebat. Et princeps sacerdotum ait illi: Adjuro te per Deum vivum, ut dicas nobis si tu es Christus Filius Dei."
      en: "But Jesus held his peace. And the high priest said to him: I adjure thee by the living God, that thou tell us if thou be the Christ the Son of God."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Dicit illi Jesus: Tu dixisti. Verumtamen dico vobis, amodo videbitis Filium hominis sedentem a dextris virtutis Dei, et venientem in nubibus caeli."
      en: "Jesus saith to him: Thou hast said it. Nevertheless I say to you, hereafter you shall see the Son of man sitting on the right hand of the power of God, and coming in the clouds of heaven."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "Tunc princeps sacerdotum scidit vestimenta sua, dicens: Blasphemavit: quid adhuc egemus testibus? ecce nunc audistis blasphemiam:"
      en: "Then the high priest rent his garments, saying: He hath blasphemed; what further need have we of witnesses? Behold, now you have heard the blasphemy:"
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "quid vobis videtur? At illi respondentes dixerunt: Reus est mortis."
      en: "What think you? But they answering, said: He is guilty of death."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "Tunc exspuerunt in faciem ejus, et colaphis eum ceciderunt, alii autem palmas in faciem ejus dederunt,"
      en: "Then did they spit in his face, and buffeted him: and others struck his face with the palms of their hands,"
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "dicentes: Prophetiza nobis Christe, quis est qui te percussit?"
      en: "Saying: Prophesy unto us, O Christ, who is he that struck thee?"
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "Petrus vero sedebat foris in atrio: et accessit ad eum una ancilla, dicens: Et tu cum Jesu Galilaeo eras."
      en: "But Peter sat without in the court: and there came to him a servant maid, saying: Thou also wast with Jesus the Galilean."
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "At ille negavit coram omnibus, dicens: Nescio quid dicis."
      en: "But he denied before them all, saying: I know not what thou sayest."
    status: { la: verified, en: verified }
  - n: 71
    text:
      la: "Exeunte autem illo januam, vidit eum alia ancilla, et ait his qui erant ibi: Et hic erat cum Jesu Nazareno."
      en: "And as he went out of the gate, another maid saw him, and she saith to them that were there: This man also was with Jesus of Nazareth."
    status: { la: verified, en: verified }
  - n: 72
    text:
      la: "Et iterum negavit cum juramento: Quia non novi hominem."
      en: "And again he denied with an oath, I know not the man."
    status: { la: verified, en: verified }
  - n: 73
    text:
      la: "Et post pusillum accesserunt qui stabant, et dixerunt Petro: Vere et tu ex illis es: nam et loquela tua manifestum te facit."
      en: "And after a little while they came that stood by, and said to Peter: Surely thou also art one of them; for even thy speech doth discover thee."
    status: { la: verified, en: verified }
  - n: 74
    text:
      la: "Tunc coepit detestari et jurare quia non novisset hominem. Et continuo gallus cantavit."
      en: "Then he began to curse and to swear that he knew not the man. And immediately the cock crew."
    status: { la: verified, en: verified }
  - n: 75
    text:
      la: "Et recordatus est Petrus verbi Jesu, quod dixerat: Priusquam gallus cantet, ter me negabis. Et egressus foras, flevit amare."
      en: "And Peter remembered the word of Jesus which he had said: Before the cock crow, thou wilt deny me thrice. And going forth, he wept bitterly."
    status: { la: verified, en: verified }
