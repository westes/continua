# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 32
verses:
  - n: 1
    text:
      la: "omiserunt autem tres viri isti respondere Iob eo quod iustus sibi videretur"
      en: "So these three men ceased to answer Job, because he seemed just to himself."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et iratus indignatusque Heliu filius Barachel Buzites de cognatione Ram iratus est autem adversus Iob eo quod iustum se esse diceret coram Deo"
      en: "And Eliu the son of Barachel the Buzite, of the kindred of Ram, was angry and was moved to indignation : now he was angry against Job, because he said he was just before God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "porro adversum amicos eius indignatus est eo quod non invenissent responsionem rationabilem sed tantummodo condemnassent Iob"
      en: "And he was angry with his friends because they had not found a reasonable answer, but only had condemned Job."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "igitur Heliu expectavit Iob loquentem eo quod seniores se essent qui loquebantur"
      en: "So Eliu waited while Job was speaking, because they were his elders that were speaking."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cum autem vidisset quod tres respondere non potuissent iratus est vehementer"
      en: "But when he saw that the three were not able to answer, he was exceedingly angry."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "respondensque Heliu filius Barachel Buzites dixit iunior sum tempore vos autem antiquiores idcirco dimisso capite veritus sum indicare vobis meam sententiam"
      en: "Then Eliu the son of Barachel the Buzite answered and said : I am younger in days, and you are more ancient; therefore hanging down my head, I was afraid to shew you my opinion."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sperabam enim quod aetas prolixior loqueretur et annorum multitudo doceret sapientiam"
      en: "For I hoped that greater age would speak, and that a multitude of years would teach wisdom."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed ut video spiritus est in hominibus et inspiratio Omnipotentis dat intellegentiam"
      en: "But, as I see, there is a spirit in men, and the inspiration of the Almighty giveth understanding."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "non sunt longevi sapientes nec senes intellegunt iudicium"
      en: "They that are aged are not the wise men, neither do the ancients understand judgment."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "ideo dicam audite me ostendam vobis etiam ego meam scientiam"
      en: "Therefore I will speak : Hearken to me, I also will shew you my wisdom."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "expectavi enim sermones vestros audivi prudentiam vestram donec disceptaremini sermonibus"
      en: "For I have waited for your words, I have given ear to your wisdom, as long as you were disputing in words."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et donec putabam vos aliquid dicere considerabam sed ut video non est qui arguere possit Iob et respondere ex vobis sermonibus eius"
      en: "And as long as I thought you said some thing, I considered : but, as I see, there is none of you that can convince Job, and answer his words."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ne forte dicatis invenimus sapientiam Deus proiecit eum non homo"
      en: "Lest you should say : We have found wisdom, God hath cast him down, not man."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "nihil locutus est mihi et ego non secundum vestros sermones respondebo illi"
      en: "He hath spoken nothing to me, and I will not answer him according to your words."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "extimuerunt non responderunt ultra abstuleruntque a se eloquia"
      en: "They were afraid, and answered no more, and they left off speaking."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "quoniam igitur expectavi et non sunt locuti steterunt nec responderunt ultra"
      en: "Therefore because I have waited, and they have not spoken : they stood, and answered no more :"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "respondebo et ego partem meam et ostendam scientiam meam"
      en: "I also will answer my part, and will shew my knowledge."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "plenus sum enim sermonibus et coartat me spiritus uteri mei"
      en: "Behold, my belly is as new wine which wanteth vent, which bursteth the new vessels."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "en venter meus quasi mustum absque spiraculo quod lagunculas novas disrumpit"
      en: ""
    status: { la: verified, en: missing }
  - n: 20
    text:
      la: "loquar et respirabo paululum aperiam labia mea et respondebo"
      en: "I will speak and take breath a little : I will open my lips, and will answer."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non accipiam personam viri et Deum homini non aequabo"
      en: "I will not accept the person of man, and I will not level God with man."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "nescio enim quamdiu subsistam et si post modicum tollat me factor meus"
      en: "For I know not how long I shall continue, and whether after a while my Maker may take me away."
    status: { la: verified, en: verified }
