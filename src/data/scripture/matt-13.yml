# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 13
verses:
  - n: 1
    text:
      la: "In illo die exiens Jesus de domo, sedebat secus mare."
      en: "The same day Jesus going out of the house, sat by the sea side."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et congregatae sunt ad eum turbae multae, ita ut naviculam ascendens sederet: et omnis turba stabat in littore,"
      en: "And great multitudes were gathered unto him, so that he went up into a boat and sat: and all the multitude stood on the shore."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et locutus est eis multa in parabolis, dicens: Ecce exiit qui seminat, seminare."
      en: "And he spoke to them many things in parables, saying: Behold the sower went forth to sow."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dum seminat, quaedam ceciderunt secus viam, et venerunt volucres caeli, et comederunt ea."
      en: "And whilst he soweth some fell by the way side, and the birds of the air came and ate them up."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Alia autem ceciderunt in petrosa, ubi non habebant terram multam: et continuo exorta sunt, quia non habebant altitudinem terrae:"
      en: "And other some fell upon stony ground, where they had not much earth: and they sprung up immediately, because they had no deepness of earth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "sole autem orto aestuaverunt; et quia non habebant radicem, aruerunt."
      en: "And when the sun was up they were scorched: and because they had not root, they withered away."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Alia autem ceciderunt in spinas: et creverunt spinae, et suffocaverunt ea."
      en: "And others fell among thorns: and the thorns grew up and choked them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Alia autem ceciderunt in terram bonam: et dabant fructum, aliud centesimum, aliud sexagesimum, aliud trigesimum."
      en: "And others fell upon good ground: and they brought forth fruit, some an hundredfold, some sixtyfold, and some thirtyfold."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui habet aures audiendi, audiat."
      en: "He that hath ears to hear, let him hear."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et accedentes discipuli dixerunt ei: Quare in parabolis loqueris eis?"
      en: "And his disciples came and said to him: Why speakest thou to them in parables?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Qui respondens, ait illis: Quia vobis datum est nosse mysteria regni caelorum: illis autem non est datum."
      en: "Who answered and said to them: Because to you it is given to know the mysteries of the kingdom of heaven: but to them it is not given."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Qui enim habet, dabitur ei, et abundabit: qui autem non habet, et quod habet auferetur ab eo."
      en: "For he that hath, to him shall be given, and he shall abound: but he that hath not, from him shall be taken away that also which he hath."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ideo in parabolis loquor eis: quia videntes non vident, et audientes non audiunt, neque intelligunt."
      en: "Therefore do I speak to them in parables: because seeing they see not, and hearing they hear not, neither do they understand."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et adimpletur in eis prophetia Isaiae, dicentis: Auditu audietis, et non intelligetis: et videntes videbitis, et non videbitis."
      en: "And the prophecy of Isaias is fulfilled in them, who saith: By hearing you shall hear, and shall not understand: and seeing you shall see, and shall not perceive."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Incrassatum est enim cor populi hujus, et auribus graviter audierunt, et oculos suos clauserunt: nequando videant oculis, et auribus audiant, et corde intelligant, et convertantur, et sanem eos."
      en: "For the heart of this people is grown gross, and with their ears they have been dull of hearing, and their eyes they have shut: lest at any time they should see with their eyes, and hear with their ears, and understand with their heart, and be converted, and I should heal them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vestri autem beati oculi quia vident, et aures vestrae quia audiunt."
      en: "But blessed are your eyes, because they see, and your ears, because they hear."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Amen quippe dico vobis, quia multi prophetae et justi cupierunt videre quae videtis, et non viderunt: et audire quae auditis, et non audierunt."
      en: "For, amen, I say to you, many prophets and just men have desired to see the things that you see, and have not seen them, and to hear the things that you hear and have not heard them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vos ergo audite parabolam seminantis."
      en: "Hear you therefore the parable of the sower."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Omnis qui audit verbum regni, et non intelligit, venit malus, et rapit quod seminatum est in corde ejus: hic est qui secus viam seminatus est."
      en: "When any one heareth the word of the kingdom, and understandeth it not, there cometh the wicked one, and catcheth away that which was sown in his heart: this is he that received the seed by the way side."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Qui autem super petrosa seminatus est, hic est qui verbum audit, et continuo cum gaudio accipit illud:"
      en: "And he that received the seed upon stony ground, is he that heareth the word, and immediately receiveth it with joy."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non habet autem in se radicem, sed est temporalis: facta autem tribulatione et persecutione propter verbum, continuo scandalizatur."
      en: "Yet hath he not root in himself, but is only for a time: and when there ariseth tribulation and persecution because of the word, he is presently scandalized."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Qui autem seminatus est in spinis, hic est qui verbum audit, et sollicitudo saeculi istius, et fallacia divitiarum suffocat verbum, et sine fructu efficitur."
      en: "And he that received the seed among thorns, is he that heareth the word, and the care of this world and the deceitfulness of riches choketh up the word, and he becometh fruitless."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Qui vero in terram bonam seminatus est, hic est qui audit verbum, et intelligit, et fructum affert, et facit aliud quidem centesimum, aliud autem sexagesimum, aliud vero trigesimum."
      en: "But he that received the seed upon good ground, is he that heareth the word, and understandeth, and beareth fruit, and yieldeth the one an hundredfold, and another sixty, and another thirty."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Aliam parabolam proposuit illis, dicens: Simile factum est regnum caelorum homini, qui seminavit bonum semen in agro suo:"
      en: "Another parable he proposed to them, saying: The kingdom of heaven is likened to a man that sowed good seeds in his field."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "cum autem dormirent homines, venit inimicus ejus, et superseminavit zizania in medio tritici, et abiit."
      en: "But while men were asleep, his enemy came and oversowed cockle among the wheat and went his way."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Cum autem crevisset herba, et fructum fecisset, tunc apparuerunt et zizania."
      en: "And when the blade was sprung up, and had brought forth fruit, then appeared also the cockle."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Accedentes autem servi patrisfamilias, dixerunt ei: Domine, nonne bonum semen seminasti in agro tuo? unde ergo habet zizania?"
      en: "And the servants of the goodman of the house coming said to him: Sir, didst thou not sow good seed in thy field? whence then hath it cockle?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et ait illis: Inimicus homo hoc fecit. Servi autem dixerunt ei: Vis, imus, et colligimus ea?"
      en: "And he said to them: An enemy hath done this. And the servants said to him: Wilt thou that we go and gather it up?"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et ait: Non: ne forte colligentes zizania, eradicetis simul cum eis et triticum."
      en: "And he said: No, lest perhaps gathering up the cockle, you root up the wheat also together with it."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Sinite utraque crescere usque ad messem, et in tempore messis dicam messoribus: Colligite primum zizania, et alligate ea in fasciculos ad comburendum: triticum autem congregate in horreum meum."
      en: "Suffer both to grow until the harvest, and in the time of the harvest I will say to the reapers: Gather up first the cockle, and bind it into bundles to burn, but the wheat gather ye into my barn."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Aliam parabolam proposuit eis dicens: Similis est regnum caelorum grano sinapis, quod accipiens homo seminavit in agro suo:"
      en: "Another parable he proposed unto them, saying: The kingdom of heaven is like to a grain of mustard seed, which a man took and sowed in his field."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "quod minimum quidem est omnibus seminibus: cum autem creverit, majus est omnibus oleribus, et fit arbor, ita ut volucres caeli veniant, et habitent in ramis ejus."
      en: "Which is the least indeed of all seeds; but when it is grown up, it is greater than all herbs, and becometh a tree, so that the birds of the air come, and dwell in the branches thereof."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Aliam parabolam locutus est eis: Similis est regnum caelorum fermento, quod acceptum mulier abscondit in farinae satis tribus, donec fermentatum est totum."
      en: "Another parable he spoke to them: The kingdom of heaven is like to leaven, which a woman took and hid in three measures of meal, until the whole was leavened."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Haec omnia locutus est Jesus in parabolis ad turbas: et sine parabolis non loquebatur eis:"
      en: "All these things Jesus spoke in parables to the multitudes: and without parables he did not speak to them."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "ut impleretur quod dictum erat per prophetam dicentem: Aperiam in parabolis os meum; eructabo abscondita a constitutione mundi."
      en: "That it might be fulfilled which was spoken by the prophet, saying: I will open my mouth in parables, I will utter things hidden from the foundation of the world."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Tunc, dimissis turbis, venit in domum: et accesserunt ad eum discipuli ejus, dicentes: Edissere nobis parabolam zizaniorum agri."
      en: "Then having sent away the multitudes, he came into the house, and his disciples came to him, saying: Expound to us the parable of the cockle of the field."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Qui respondens ait illis: Qui seminat bonum semen, est Filius hominis."
      en: "Who made answer and said to them: He that soweth the good seed, is the Son of man."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Ager autem est mundus. Bonum vero semen, hi sunt filii regnum. Zizania autem, filii sunt nequam."
      en: "And the field, is the world. And the good seed are the children of the kingdom. And the cockle, are the children of the wicked one."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Inimicus autem, qui seminavit ea, est diabolus. Messis vero, consummatio saeculi est. Messores autem, angeli sunt."
      en: "And the enemy that sowed them, is the devil. But the harvest is the end of the world. And the reapers are the angels."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Sicut ergo colliguntur zizania, et igni comburuntur: sic erit in consummatione saeculi."
      en: "Even as cockle therefore is gathered up, and burnt with fire: so shall it be at the end of the world."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Mittet Filius hominis angelos suos, et colligent de regno ejus omnia scandala, et eos qui faciunt iniquitatem:"
      en: "The Son of man shall send his angels, and they shall gather out of his kingdom all scandals, and them that work iniquity."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "et mittent eos in caminum ignis. Ibi erit fletus et stridor dentium."
      en: "And shall cast them into the furnace of fire: there shall be weeping and gnashing of teeth."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Tunc justi fulgebunt sicut sol in regno Patris eorum. Qui habet aures audiendi, audiat."
      en: "Then shall the just shine as the sun, in the kingdom of their Father. He that hath ears to hear, let him hear."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Simile est regnum caelorum thesauro abscondito in agro: quem qui invenit homo, abscondit, et prae gaudio illius vadit, et vendit universa quae habet, et emit agrum illum."
      en: "The kingdom of heaven is like unto a treasure hidden in a field. Which a man having found, hid it, and for joy thereof goeth, and selleth all that he hath, and buyeth that field."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Iterum simile est regnum caelorum homini negotiatori, quaerenti bonas margaritas."
      en: "Again the kingdom of heaven is like to a merchant seeking good pearls."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Inventa autem una pretiosa margarita, abiit, et vendidit omnia quae habuit, et emit eam."
      en: "Who when he had found one pearl of great price, went his way, and sold all that he had, and bought it."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Iterum simile est regnum caelorum sagenae missae in mare, et ex omni genere piscium congreganti."
      en: "Again the kingdom of heaven is like to a net cast into the sea, and gathering together of all kind of fishes."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Quam, cum impleta esset, educentes, et secus littus sedentes, elegerunt bonis in vasa, malos autem foras miserunt."
      en: "Which, when it was filled, they drew out, and sitting by the shore, they chose out the good into vessels, but the bad they cast forth."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Sic erit in consummatione saeculi: exibunt angeli, et separabunt malos de medio justorum,"
      en: "So shall it be at the end of the world. The angels shall go out, and shall separate the wicked from among the just."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "et mittent eos in caminum ignis: ibi erit fletus, et stridor dentium."
      en: "And shall cast them into the furnace of fire: there shall be weeping and gnashing of teeth."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Intellexistis haec omnia? Dicunt ei: Etiam."
      en: "Have ye understood all these things? They say to him: Yes."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Ait illis: Ideo omnis scriba doctus in regno caelorum, similis est homini patrifamilias, qui profert de thesauro suo nova et vetera."
      en: "He said unto them: Therefore every scribe instructed in the kingdom of heaven, is like to a man that is a householder, who bringeth forth out of his treasure new things and old."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Et factum est, cum consummasset Jesus parabolas istas, transiit inde."
      en: "And it came to pass: when Jesus had finished these parables, he passed from thence."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Et veniens in patriam suam, docebat eos in synagogis eorum, ita ut mirarentur, et dicerent: Unde huic sapientia haec, et virtutes?"
      en: "And coming into his own country, he taught them in their synagogues, so that they wondered and said: How came this man by this wisdom and miracles?"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Nonne hic est fabri filius? nonne mater ejus dicitur Maria, et fratres ejus, Jacobus, et Joseph, et Simon, et Judas?"
      en: "Is not this the carpenter's son? Is not his mother called Mary, and his brethren James, and Joseph, and Simon, and Jude:"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "et sorores ejus, nonne omnes apud nos sunt? unde ergo huic omnia ista?"
      en: "And his sisters, are they not all with us? Whence therefore hath he all these things?"
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Et scandalizabantur in eo. Jesus autem dixit eis: Non est propheta sine honore, nisi in patria sua, et in domo sua."
      en: "And they were scandalized in his regard. But Jesus said to them: A prophet is not without honour, save in his own country, and in his own house."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Et non fecit ibi virtutes multas propter incredulitatem illorum."
      en: "And he wrought not many miracles there, because of their unbelief."
    status: { la: verified, en: verified }
