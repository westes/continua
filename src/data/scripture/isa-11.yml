# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 11
verses:
  - n: 1
    text:
      la: "et egredietur virga de radice Iesse et flos de radice eius ascendet"
      en: "And there shall come forth a rod out of the root of Jesse, and a flower shall rise up out of his root."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et requiescet super eum spiritus Domini spiritus sapientiae et intellectus spiritus consilii et fortitudinis spiritus scientiae et pietatis"
      en: "And the spirit of the Lord shall rest upon him: the spirit of wisdom, and of understanding, the spirit of counsel, and of fortitude, the spirit of knowledge, and of godliness."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et replebit eum spiritus timoris Domini non secundum visionem oculorum iudicabit neque secundum auditum aurium arguet"
      en: "And he shall be filled with the spirit of the fear of the Lord. He shall not judge according to the sight of the eyes, nor reprove according to the hearing of the ears."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "sed iudicabit in iustitia pauperes et arguet in aequitate pro mansuetis terrae et percutiet terram virga oris sui et spiritu labiorum suorum interficiet impium"
      en: "But he shall judge the poor with justice, and shall reprove with equity for the meek of the earth: land he shall strike the earth with the rod of his mouth, and with the breath of his lips he shall slay the wicked."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et erit iustitia cingulum lumborum eius et fides cinctorium renis eius"
      en: "And justice shall be the girdle of his loins: and faith the girdle of his reins."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "habitabit lupus cum agno et pardus cum hedo accubabit vitulus et leo et ovis simul morabuntur et puer parvulus minabit eos"
      en: "The wolf shall dwell with the lamb: and the leopard shall lie down with the kid: the calf and the lion, and the sheep shall abide together, and a little child shall lead them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "vitulus et ursus pascentur simul requiescent catuli eorum et leo quasi bos comedet paleas"
      en: "The calf and the bear shall feed: their young ones shall rest together: and the lion shall eat straw like the ox."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et delectabitur infans ab ubere super foramine aspidis et in caverna reguli qui ablactatus fuerit manum suam mittet"
      en: "And the sucking child shall play on the hole of the asp: and the weaned child shall thrust his hand into the den of the basilisk."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "non nocebunt et non occident in universo monte sancto meo quia repleta est terra scientia Domini sicut aquae maris operientes"
      en: "They shall not hurt, nor shall they kill in all my holy mountain, for the earth is filled with the knowledge of the Lord, as the covering waters of the sea."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in die illa radix Iesse qui stat in signum populorum ipsum gentes deprecabuntur et erit sepulchrum eius gloriosum"
      en: "In that day the root of Jesse, who standeth for an ensign of the people, him the Gentiles shall beseech, and his sepulchre shall be glorious."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et erit in die illa adiciet Dominus secundo manum suam ad possidendum residuum populi sui quod relinquetur ab Assyriis et ab Aegypto et a Fetros et ab Aethiopia et ab Aelam et a Sennaar et ab Emath et ab insulis maris"
      en: "And it shall come to pass in that day, that the Lord shall set his hand the second time to possess the remnant of his people, which shall be left from the Assyrians, and from Egypt, and from Phetros, and from Ethiopia, and from Elam, and from Sennaar, and from Emath, and from the islands of the sea."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et levabit signum in nationes et congregabit profugos Israhel et dispersos Iuda colliget a quattuor plagis terrae"
      en: "And he shall set up a standard unto the nations, and shall assemble the fugitives of Israel, and shall gather together the dispersed of Juda from the four quarters of the earth."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et auferetur zelus Ephraim et hostes Iuda peribunt Ephraim non aemulabitur Iudam et Iudas non pugnabit contra Ephraim"
      en: "And the envy of Ephraim shall be taken away, and the enemies of Juda shall perish: Ephraim shall not envy Juda, and Juda shall not fight against Ephraim."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et volabunt in umeros Philisthim per mare simul praedabuntur filios orientis Idumea et Moab praeceptum manus eorum et filii Ammon oboedientes erunt"
      en: "But they shall fly upon the shoulders of the Philistines by the sea, they together shall spoil the children of the east: Edom, and Moab shall be under the rule of their hand, and the children of Ammon shall be obedient."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et desolabit Dominus linguam maris Aegypti et levabit manum suam super Flumen in fortitudine spiritus sui et percutiet eum in septem rivis ita ut transeant per eum calciati"
      en: "And the Lord shall lay waste the tongue of the sea of Egypt, and shall lift up his hand over the river in the strength of his spirit: and he shall strike it in the seven streams, so that men may pass through it in their shoes."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et erit via residuo populo meo qui relinquetur ab Assyriis sicut fuit Israhel in die qua ascendit de terra Aegypti"
      en: "And there shall be a highway for the remnant of my people, which shall be left from the Assyrians: as there was for Israel in the day that he came up out of the land of Egypt."
    status: { la: verified, en: verified }
