# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: matt
chapter: 7
verses:
  - n: 1
    text:
      la: "nolite iudicare ut non iudicemini"
      en: "Judge not, that you may not be judged,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "in quo enim iudicio iudicaveritis iudicabimini et in qua mensura mensi fueritis metietur vobis"
      en: "For with what judgment you judge, you shall be judged: and with what measure you mete, it shall be measured to you again."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quid autem vides festucam in oculo fratris tui et trabem in oculo tuo non vides"
      en: "Any why seest thou the mote that is in thy brother's eye; and seest not the beam that is in thy own eye?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "aut quomodo dicis fratri tuo sine eiciam festucam de oculo tuo et ecce trabis est in oculo tuo"
      en: "Or how sayest thou to thy brother: Let me cast the mote out of thy eye; and behold a beam is in thy own eye?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "hypocrita eice primum trabem de oculo tuo et tunc videbis eicere festucam de oculo fratris tui"
      en: "Thou hypocrite, cast out first the beam in thy own eye, and then shalt thou see to cast out the mote out of thy brother's eye."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "nolite dare sanctum canibus neque mittatis margaritas vestras ante porcos ne forte conculcent eas pedibus suis et conversi disrumpant vos"
      en: "Give not that which is holy to dogs; neither cast ye your pearls before swine, lest perhaps they trample them under their feet, and turning upon you, they tear you."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "petite et dabitur vobis quaerite et invenietis pulsate et aperietur vobis"
      en: "Ask, and it shall be given you: seek, and you shall find: knock, and it shall be opened to you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "omnis enim qui petit accipit et qui quaerit invenit et pulsanti aperietur"
      en: "For every one that asketh, receiveth: and he that seeketh, findeth: and to him that knocketh, it shall be opened."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "aut quis est ex vobis homo quem si petierit filius suus panem numquid lapidem porriget ei"
      en: "Or what man is there among you, of whom if his son shall ask bread, will he reach him a stone?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "aut si piscem petet numquid serpentem porriget ei"
      en: "Or if he shall ask him a fish, will he reach him a serpent?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "si ergo vos cum sitis mali nostis bona dare filiis vestris quanto magis Pater vester qui in caelis est dabit bona petentibus se"
      en: "If you then being evil, know how to give good gifts to your children: how much more will your Father who is in heaven, give good things to them that ask him?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "omnia ergo quaecumque vultis ut faciant vobis homines et vos facite eis haec est enim lex et prophetae"
      en: "All things therefore whatsoever you would that men should do to you, do you also to them. For this is the law and the prophets."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "intrate per angustam portam quia lata porta et spatiosa via quae ducit ad perditionem et multi sunt qui intrant per eam"
      en: "Enter ye in at the narrow gate: for wide is the gate, and broad is the way that leadeth to destruction, and many there are who go in thereat."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quam angusta porta et arta via quae ducit ad vitam et pauci sunt qui inveniunt eam"
      en: "How narrow is the gate, and strait is the way that leadeth to life: and few there are that find it!"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "adtendite a falsis prophetis qui veniunt ad vos in vestimentis ovium intrinsecus autem sunt lupi rapaces"
      en: "Beware of false prophets, who come to you in the clothing of sheep, but inwardly they are ravening wolves."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "a fructibus eorum cognoscetis eos numquid colligunt de spinis uvas aut de tribulis ficus"
      en: "By their fruits you shall know them. Do men gather grapes of thorns, or figs of thistles?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sic omnis arbor bona fructus bonos facit mala autem arbor fructus malos facit"
      en: "Even so every good tree bringeth forth good fruit, and the evil tree bringeth forth evil fruit."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "non potest arbor bona fructus malos facere neque arbor mala fructus bonos facere"
      en: "A good tree cannot bring forth evil fruit, neither can an evil tree bring forth good fruit."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "omnis arbor quae non facit fructum bonum exciditur et in ignem mittitur"
      en: "Every tree that bringeth not forth good fruit, shall be cut down, and shall be cast into the fire."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "igitur ex fructibus eorum cognoscetis eos"
      en: "Wherefore by their fruits you shall know them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non omnis qui dicit mihi Domine Domine intrabit in regnum caelorum sed qui facit voluntatem Patris mei qui in caelis est ipse intrabit in regnum caelorum"
      en: "Not every one that saith to me, Lord, Lord, shall enter into the kingdom of heaven: but he that doth the will of my Father who is in heaven, he shall enter into the kingdom of heaven."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "multi dicent mihi in illa die Domine Domine nonne in nomine tuo prophetavimus et in tuo nomine daemonia eiecimus et in tuo nomine virtutes multas fecimus"
      en: "Many will say to me in that day: Lord, Lord, have not we prophesied in thy name, and cast out devils in thy name, and done many miracles in thy name?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et tunc confitebor illis quia numquam novi vos discedite a me qui operamini iniquitatem"
      en: "And then will I profess unto them, I never knew you: depart from me, you that work iniquity."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "omnis ergo qui audit verba mea haec et facit ea adsimilabitur viro sapienti qui aedificavit domum suam supra petram"
      en: "Every one therefore that heareth these my words, and doth them, shall be likened to a wise man that built his house upon a rock,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et descendit pluvia et venerunt flumina et flaverunt venti et inruerunt in domum illam et non cecidit fundata enim erat super petram"
      en: "And the rain fell, and the floods came, and the winds blew, and they beat upon that house, and it fell not, for it was founded on a rock."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et omnis qui audit verba mea haec et non facit ea similis erit viro stulto qui aedificavit domum suam supra harenam"
      en: "And every one that heareth these my words, and doth them not, shall be like a foolish man that built his house upon the sand,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et descendit pluvia et venerunt flumina et flaverunt venti et inruerunt in domum illam et cecidit et fuit ruina eius magna"
      en: "And the rain fell, and the floods came, and the winds blew, and they beat upon that house, and it fell, and great was the fall thereof."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et factum est cum consummasset Iesus verba haec admirabantur turbae super doctrinam eius"
      en: "And it came to pass when Jesus had fully ended these words, the people were in admiration at his doctrine."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "erat enim docens eos sicut potestatem habens non sicut scribae eorum et Pharisaei"
      en: "For he was teaching them as one having power, and not as the scribes and Pharisees."
    status: { la: verified, en: verified }
