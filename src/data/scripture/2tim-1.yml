# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2tim
chapter: 1
verses:
  - n: 1
    text:
      la: "Paulus apostolus Christi Iesu per voluntatem Dei secundum promissionem vitae quae est in Christo Iesu"
      en: "Paul, an apostle of Jesus Christ, by the will of God, according to the promise of life, which is in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Timotheo carissimo filio gratia misericordia pax a Deo Patre et Christo Iesu Domino nostro"
      en: "To Timothy my dearly beloved son, grace, mercy, and peace, from God the Father, and from Christ Jesus our Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "gratias ago Deo cui servio a progenitoribus in conscientia pura quam sine intermissione habeam tui memoriam in orationibus meis nocte ac die"
      en: "I give thanks to God, whom I serve from my forefathers with a pure conscience, that without ceasing, I have a remembrance of thee in my prayers, night and day."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "desiderans te videre memor lacrimarum tuarum ut gaudio implear"
      en: "Desiring to see thee, being mindful of thy tears, that I may be filled with joy,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "recordationem accipiens eius fidei quae est in te non ficta quae et habitavit primum in avia tua Loide et matre tua Eunice certus sum autem quod et in te"
      en: "Calling to mind that faith which is in thee unfeigned, which also dwelt first in thy grandmother Lois, and in thy mother Eunice, and I am certain that in thee also."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "propter quam causam admoneo te ut resuscites gratiam Dei quae est in te per inpositionem manuum mearum"
      en: "For which cause I admonish thee, that thou stir up the grace of God which is in thee, by the imposition of my hands."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "non enim dedit nobis Deus spiritum timoris sed virtutis et dilectionis et sobrietatis"
      en: "For God hath not given us the spirit of fear: but of power, and of love, and of sobriety."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "noli itaque erubescere testimonium Domini nostri neque me vinctum eius sed conlabora evangelio secundum virtutem Dei"
      en: "Be not thou therefore ashamed of the testimony of our Lord, nor of me his prisoner: but labour with the gospel, according to the power of God,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui nos liberavit et vocavit vocatione sancta non secundum opera nostra sed secundum propositum suum et gratiam quae data est nobis in Christo Iesu ante tempora saecularia"
      en: "Who hath delivered us and called us by his holy calling, not according to our works, but according to his own purpose and grace, which was given us in Christ Jesus before the times of the world."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "manifestata est autem nunc per inluminationem salvatoris nostri Iesu Christi qui destruxit quidem mortem inluminavit autem vitam et incorruptionem per evangelium"
      en: "But is now made manifest by the illumination of our Saviour Jesus Christ, who hath destroyed death, and hath brought to light life and incorruption by the gospel:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "in quo positus sum ego praedicator et apostolus et magister gentium"
      en: "Wherein I am appointed a preacher, and an apostle, and teacher of the Gentiles."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ob quam causam etiam haec patior sed non confundor scio enim cui credidi et certus sum quia potens est depositum meum servare in illum diem"
      en: "For which cause I also suffer these things: but I am not ashamed. For I know whom I have believed, and I am certain that he is able to keep that which I have committed unto him, against that day."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "formam habe sanorum verborum quae a me audisti in fide et dilectione in Christo Iesu"
      en: "Hold the form of sound words, which thou hast heard of me in faith, and in the love which is in Christ Jesus."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "bonum depositum custodi per Spiritum Sanctum qui habitat in nobis"
      en: "Keep the good thing committed to thy trust by the Holy Ghost, who dwelleth in us."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "scis hoc quod aversi sunt a me omnes qui in Asia sunt ex quibus est Phygelus et Hermogenes"
      en: "Thou knowest this, that all they who are in Asia, are turned away from me: of whom are Phigellus and Hermogenes."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "det misericordiam Dominus Onesifori domui quia saepe me refrigeravit et catenam meam non erubuit"
      en: "The Lord give mercy to the house of Onesiphorus: because he hath often refreshed me, and hath not been ashamed of my chain:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "sed cum Romam venisset sollicite me quaesivit et invenit"
      en: "But when he was come to Rome, he carefully sought me, and found me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "det illi Dominus invenire misericordiam a Domino in illa die et quanta Ephesi ministravit melius tu nosti"
      en: "The Lord grant unto him to find mercy of the Lord in that day: and in how many things he ministered unto me at Ephesus, thou very well knowest."
    status: { la: verified, en: verified }
