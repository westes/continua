# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 11
verses:
  - n: 1
    text:
      la: "Verbum quod factum est a Domino ad Jeremiam, dicens:"
      en: "The word that came from the Lord to Jeremias, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Audite verba pacti hujus, et loquimini ad viros Juda, et ad habitatores Jerusalem,"
      en: "Hear ye the words of this covenant, and speak to the men of Juda, and to the inhabitants of Jerusalem,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dices ad eos: Haec dicit Dominus Deus Israel: Maledictus vir qui non audierit verba pacti hujus"
      en: "And thou shalt say to them: Thus saith the Lord the God of Israel: Cursed is the man that shall not hearken to the words of this covenant,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quod praecepi patribus vestris, in die qua eduxi eos de terra Aegypti, de fornace ferrea, dicens: Audite vocem meam, et facite omnia quae praecipio vobis, et eritis mihi in populum, et ego ero vobis in Deum:"
      en: "Which I commanded your fathers in the day that I brought them out of the land of Egypt, from the iron furnace, saying: Hear ye my voice, and do all things that I command you: and you shall be my people, and I will be your God:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut suscitem juramentum quod juravi patribus vestris, daturum me eis terram fluentem lacte et melle, sicut est dies haec. Et respondi, et dixi: Amen, Domine."
      en: "That I may accomplish the oath which I swore to your fathers, to give them a land flowing with milk and honey, as it is this day. And I answered and said: Amen, O Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dixit Dominus ad me: Vociferare omnia verba haec in civitatibus Juda, et foris Jerusalem, dicens: Audite verba pacti hujus, et facite illa,"
      en: "And the Lord said to me: Proclaim aloud all these words in the cities of Juda, and in the streets of Jerusalem, saying: Hear ye the words of the covenant, and do them:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia contestans contestatus sum patres vestros, in die qua eduxi eos de terra Aegypti, usque ad diem hanc: mane consurgens contestatus sum, et dixi: Audite vocem meam."
      en: "For protesting I conjured your fathers in the day that I brought them out of the land of Egypt even to this day: rising early I conjured them, and said: Hearken ye to my voice:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et non audierunt, nec inclinaverunt aurem suam, sed abierunt, unusquisque in pravitate cordis sui mali: et induxi super eos omnia verba pacti hujus quod praecepi ut facerent, et non fecerunt."
      en: "And they obeyed not, nor inclined their ear: but walked every one in the perverseness of his own wicked heart: and I brought upon them all the words of this covenant, which I commanded them to do, but they did them not."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et dixit Dominus ad me: Inventa est conjuratio in viris Juda et in habitatoribus Jerusalem."
      en: "And the Lord said to me: A conspiracy is found among the men of Juda, and among the inhabitants of Jerusalem."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Reversi sunt ad iniquitates patrum suorum priores, qui noluerunt audire verba mea: et hi ergo abierunt post deos alienos, ut servirent eis: irritum fecerunt domus Israel et domus Juda pactum meum, quod pepigi cum patribus eorum."
      en: "They are returned to the former iniquities of their fathers, who refused to hear my words: so these likewise have gone after strange gods, to serve them: the house of Israel, and the house of Juda have made void my covenant, which I made with their fathers."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Quam ob rem haec dicit Dominus: Ecce ego inducam super eos mala de quibus exire non poterunt: et clamabunt ad me, et non exaudiam eos."
      en: "Wherefore thus saith the Lord: Behold I will bring in evils upon them, which they shall not be able to escape: and they shall cry to me, and I will not hearken to them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et ibunt civitates Juda et habitatores Jerusalem, et clamabunt ad deos quibus libant, et non salvabunt eos in tempore afflictionis eorum."
      en: "And the cities of Juda, and the inhabitants of Jerusalem shall go, and cry to the gods to whom they offer sacrifice, and they shall not save them in the time of their affliction."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Secundum numerum enim civitatum tuarum erant dii tui, Juda: et secundum numerum viarum Jerusalem, posuisti aras confusionis, aras ad libandum Baalim."
      en: "For according to the number of thy cities were thy gods, O Juda: and according to the number of the streets of Jerusalem thou hast set up altars of confusion, altars to offer sacrifice to Baalim."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Tu ergo noli orare pro populo hoc, et ne assumas pro eis laudem et orationem, quia non exaudiam in tempore clamoris eorum ad me, in tempore afflictionis eorum."
      en: "Therefore, do not thou pray for this people, and do not take up praise and prayer for them: for I will not hear them in the time of their cry to me, in the time of their affliction."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quid est, quod dilectus meus in domo mea fecit scelera multa? Numquid carnes sanctae auferent a te malitias tuas, in quibus gloriata es?"
      en: "What is the meaning that my beloved hath wrought much wickedness in my house? shall the holy flesh take away from thee thy crimes, in which thou hast boasted?"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Olivam uberem, pulchram, fructiferam, speciosam, vocavit Dominus nomen tuum: ad vocem loquelae, grandis exarsit ignis in ea, et combusta sunt fruteta ejus."
      en: "The Lord called thy name, a plentiful olive tree, fair, fruitful, and beautiful: at the noise of a word, a great fire was kindled in it and the branches thereof are burnt."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et Dominus exercituum qui plantavit te locutus est super te malum, pro malis domus Israel, et domus Juda, quae fecerunt sibi ad irritandum me, libantes Baalim."
      en: "And the Lord of hosts that planted thee, hath pronounced evil against thee: for the evils of the house of Israel, and the house of Juda, which they have done to themselves, to provoke me, offering sacrifice to Baalim."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Tu autem, Domine, demonstrasti mihi, et cognovi: tunc ostendisti mihi studia eorum."
      en: "But thou, O Lord, hast shewn me, and I have known: then thou shewedst me their doings."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et ego quasi agnus mansuetus, qui portatur ad victimam: et non cognovi quia cogitaverunt super me consilia, dicentes: Mittamus lignum in panem ejus, et eradamus eum de terra viventium, et nomen ejus non memoretur amplius."
      en: "And I was as a meek lamb, that is carried to be a victim: and I knew not that they had devised counsels against me, saying: Let us put wood on his bread, and cut him off from the land of the living, and let his name be remembered no more."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Tu autem, Domine Sabaoth, qui judicas juste, et probas renes et corda, videam ultionem tuam ex eis: tibi enim revelavi causam meam."
      en: "But thou, O Lord of Sabaoth, who judgest justly, and triest the reins and hearts, let me see thy revenge on them: for to thee I have revealed my cause."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Propterea haec dicit Dominus ad viros Anathoth, qui quaerunt animam tuam, et dicunt: Non prophetabis in nomine Domini, et non morieris in manibus nostris:"
      en: "Therefore thus saith the Lord to the men of Anathoth, who seek thy life, and say: Thou shalt not prophesy in the name of the Lord, and thou shalt not die in our hands."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "propterea haec dicit Dominus exercituum: Ecce ego visitabo super eos: juvenes morientur in gladio, filii eorum et filiae eorum morientur in fame."
      en: "Therefore thus saith the Lord of hosts: Behold I will visit upon them: and their young men shall die by the sword, their sons and their daughters shall die by famine."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et reliquiae non erunt ex eis: inducam enim malum super viros Anathoth, annum visitationis eorum."
      en: "And there shall be no remains of them: for I will bring in evil upon the men of Anathoth, the year of their visitation."
    status: { la: verified, en: verified }
