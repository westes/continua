# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: act
chapter: 5
verses:
  - n: 1
    text:
      la: "vir autem quidam nomine Ananias cum Saffira uxore sua vendidit agrum"
      en: "But a certain man named Ananias, with Saphira his wife, sold a piece of land,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et fraudavit de pretio agri conscia uxore sua et adferens partem quandam ad pedes apostolorum posuit"
      en: "And by fraud kept back part of the price of the land, his wife being privy thereunto: and bringing a certain part of it, laid it at the feet of the apostles."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixit autem Petrus Anania cur temptavit Satanas cor tuum mentiri te Spiritui Sancto et fraudare de pretio agri"
      en: "But Peter said: Ananias, why hath Satan tempted thy heart, that thou shouldst lie to the Holy Ghost, and by fraud keep part of the price of the land?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "nonne manens tibi manebat et venundatum in tua erat potestate quare posuisti in corde tuo hanc rem non es mentitus hominibus sed Deo"
      en: "Whilst it remained, did it not remain to thee? and after it was sold, was it not in thy power? Why hast thou conceived this thing in thy heart? Thou hast not lied to men, but to God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "audiens autem Ananias haec verba cecidit et exspiravit et factus est timor magnus in omnes qui audierant"
      en: "And Ananias hearing these words, fell down, and gave up the ghost. And there came great fear upon all that heard it."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "surgentes autem iuvenes amoverunt eum et efferentes sepelierunt"
      en: "And the young men rising up, removed him, and carrying him out, buried him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "factum est autem quasi horarum trium spatium et uxor ipsius nesciens quod factum fuerat introiit"
      en: "And it was about the space of three hours after, when his wife, not knowing what had happened, came in."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "respondit autem ei Petrus dic mihi si tanti agrum vendidistis at illa dixit etiam tanti"
      en: "And Peter said to her: Tell me, woman, whether you sold the land for so much? And she said: Yea, for so much."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Petrus autem ad eam quid utique convenit vobis temptare Spiritum Domini ecce pedes eorum qui sepelierunt virum tuum ad ostium et efferent te"
      en: "And Peter said unto her: Why have you agreed together to tempt the Spirit of the Lord? Behold the feet of them who have buried thy husband are at the door, and they shall carry thee out."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "confestim cecidit ante pedes eius et exspiravit intrantes autem iuvenes invenerunt illam mortuam et extulerunt et sepelierunt ad virum suum"
      en: "Immediately she fell down before his feet, and gave up the ghost. And the young men coming in, found her dead: and carried her out, and buried her by her husband."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et factus est timor magnus in universa ecclesia et in omnes qui audierunt haec"
      en: "And there came great fear upon the whole church, and upon all that heard these things."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "per manus autem apostolorum fiebant signa et prodigia multa in plebe et erant unianimiter omnes in porticu Salomonis"
      en: "And by the hands of the apostles were many signs and wonders wrought among the people. And they were all with one accord in Solomon's porch."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ceterorum autem nemo audebat coniungere se illis sed magnificabat eos populus"
      en: "But of the rest no man durst join himself unto them; but the people magnified them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "magis autem augebatur credentium in Domino multitudo virorum ac mulierum"
      en: "And the multitude of men and women who believed in the Lord, was more increased:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ita ut in plateas eicerent infirmos et ponerent in lectulis et grabattis ut veniente Petro saltim umbra illius obumbraret quemquam eorum"
      en: "Insomuch that they brought forth the sick into the streets, and laid them on beds and couches, that when Peter came, his shadow at the least, might overshadow any of them, and they might be delivered from their infirmities."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "concurrebat autem et multitudo vicinarum civitatum Hierusalem adferentes aegros et vexatos ab spiritibus inmundis qui curabantur omnes"
      en: "And there came also together to Jerusalem a multitude out of the neighboring cities, bringing sick persons, and such as were troubled with unclean spirits; who were all healed."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "exsurgens autem princeps sacerdotum et omnes qui cum illo erant quae est heresis Sadducaeorum repleti sunt zelo"
      en: "Then the high prist rising up, and all they that were with him, (which is the heresy of the Sadducees,) were filled with envy."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et iniecerunt manus in apostolos et posuerunt illos in custodia publica"
      en: "And they laid hands on the apostles, and put them in the common prison."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "angelus autem Domini per noctem aperiens ianuas carceris et educens eos dixit"
      en: "But an angel of the Lord by night opening the doors of the prison, and leading them out, said:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ite et stantes loquimini in templo plebi omnia verba vitae huius"
      en: "Go, and standing speak in the temple to the people all the words of this life."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "qui cum audissent intraverunt diluculo in templum et docebant adveniens autem princeps sacerdotum et qui cum eo erant convocaverunt concilium et omnes seniores filiorum Israhel et miserunt in carcerem ut adducerentur"
      en: "Who having heard this, early in the morning, entered into the temple, and taught. And the high priest coming, and they that were with him, called together the council, and all the ancients of the children of Israel; and they sent to the prison to have them brought."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "cum venissent autem ministri et aperto carcere non invenissent illos reversi nuntiaverunt"
      en: "But when the ministers came, and opening the prison, found them not there, they returned and told,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "dicentes carcerem quidem invenimus clausum cum omni diligentia et custodes stantes ad ianuas aperientes autem neminem intus invenimus"
      en: "Saying: The prison indeed we found shut with all diligence, and the keepers standing before the doors; but opening it, we found no man within."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ut audierunt autem hos sermones magistratus templi et principes sacerdotum ambigebant de illis quidnam fieret"
      en: "Now when the officer of the temple and the chief priests heard these words, they were in doubt concerning them, what would come to pass."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "adveniens autem quidam nuntiavit eis quia ecce viri quos posuistis in carcere sunt in templo stantes et docentes populum"
      en: "But one came and told them: Behold, the men whom you put in prison are in the temple standing, and teaching the people."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "tunc abiit magistratus cum ministris et adduxit illos sine vi timebant enim populum ne lapidarentur"
      en: "Then went the officer with the ministers, and brought them without violence; for they feared the people, lest they should be stoned."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et cum adduxissent illos statuerunt in concilio et interrogavit eos princeps sacerdotum"
      en: "And when they had brought them, they set them before the council. And the high priest asked them,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "dicens praecipiendo praecepimus vobis ne doceretis in nomine isto et ecce replestis Hierusalem doctrina vestra et vultis inducere super nos sanguinem hominis istius"
      en: "Saying: Commanding we commanded you, that you should not teach in this name; and behold, you have filled Jerusalem with your doctrine, and you have a mind to bring the blood of this man upon us."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "respondens autem Petrus et apostoli dixerunt oboedire oportet Deo magis quam hominibus"
      en: "But Peter and the apostles answering, said: We ought to obey God, rather than men."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Deus patrum nostrorum suscitavit Iesum quem vos interemistis suspendentes in ligno"
      en: "The God of our fathers hath raised up Jesus, whom you put to death, hanging him upon a tree."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "hunc Deus principem et salvatorem exaltavit dextera sua ad dandam paenitentiam Israhel et remissionem peccatorum"
      en: "Him hath God exalted with his right hand, to be Prince and Saviour, to give repentance to Israel, and remission of sins."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "et nos sumus testes horum verborum et Spiritus Sanctus quem dedit Deus omnibus oboedientibus sibi"
      en: "And we are witnesses of these things and the Holy Ghost, whom God hath given to all that obey him."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "haec cum audissent dissecabantur et cogitabant interficere illos"
      en: "When they had heard these things, they were cut to the heart, and they thought to put them to death."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "surgens autem quidam in concilio Pharisaeus nomine Gamalihel legis doctor honorabilis universae plebi iussit foras ad breve homines fieri"
      en: "But one in the council rising up, a Pharisee, named Gamaliel, a doctor of the law, respected by all the people, commanded the men to be put forth a little while."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "dixitque ad illos viri israhelitae adtendite vobis super hominibus istis quid acturi sitis"
      en: "And he said to them: Ye men of Israel, take heed to yourselves what you intend to do, as touching these men."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "ante hos enim dies extitit Theodas dicens esse se aliquem cui consensit virorum numerus circiter quadringentorum qui occisus est et omnes quicumque credebant ei dissipati sunt et redactus est ad nihilum"
      en: "For before these days rose up Theodas, affirming himself to be somebody, to whom a number of men, about four hundred, joined themselves: who was slain; and all that believed him were scattered, and brought to nothing."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "post hunc extitit Iudas Galilaeus in diebus professionis et avertit populum post se et ipse periit et omnes quotquot consenserunt ei dispersi sunt"
      en: "After this man, rose up Judas of Galilee, in the days of the enrolling, and drew away the people after him: he also perished; and all, even as many as consented to him, were dispersed."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et nunc itaque dico vobis discedite ab hominibus istis et sinite illos quoniam si est ex hominibus consilium hoc aut opus dissolvetur"
      en: "And now, therefore, I say to you, refrain from these men, and let them alone; for if this council or this work be of men, it will come to nought;"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "si vero ex Deo est non poteritis dissolvere eos ne forte et Deo repugnare inveniamini consenserunt autem illi"
      en: "But if it be of God, you cannot overthrow it, lest perhaps you be found even to fight against God. And they consented to him."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et convocantes apostolos caesis denuntiaverunt ne loquerentur in nomine Iesu et dimiserunt eos"
      en: "And calling in the apostles, after they had scourged them, they charged them that they should not speak at all in the name of Jesus; and they dismissed them."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et illi quidem ibant gaudentes a conspectu concilii quoniam digni habiti sunt pro nomine Iesu contumeliam pati"
      en: "And they indeed went from the presence of the council, rejoicing that they were accounted worthy to suffer reproach for the name of Jesus."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "omni autem die in templo et circa domos non cessabant docentes et evangelizantes Christum Iesum"
      en: "And every day they ceased not in the temple, and from house to house, to teach and preach Christ Jesus."
    status: { la: verified, en: verified }
