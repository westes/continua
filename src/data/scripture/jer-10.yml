# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 10
verses:
  - n: 1
    text:
      la: "Audite verbum quod locutus est Dominus super vos, domus Israel."
      en: "Hear ye the word which the Lord hath spoken concerning you, O house of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Haec dicit Dominus: Juxta vias gentium nolite discere, et a signis caeli nolite metuere quae timent gentes,"
      en: "Thus saith the Lord: Learn not according to the ways of the Gentiles: and be not afraid of the signs of heaven, which the heathens fear:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia leges populorum vanae sunt. Quia lignum de saltu praecidit opus manus artificis in ascia:"
      en: "For the laws of the people are vain: for the works of the hand of the workman hath cut a tree out of the forest with an axe."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "argento et auro decoravit illud: clavis et malleis compegit, ut non dissolvatur:"
      en: "He hath decked it with silver and gold: he hath put it together with nails and hammers, that it may not fall asunder."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "in similitudinem palmae fabricata sunt, et non loquentur: portata tollentur, quia incedere non valent. Nolite ergo timere ea, quia nec male possunt facere nec bene."
      en: "They are framed after the likeness of a palm tree, and shall not speak: they must be carried to be removed, because they cannot go. Therefore, fear them not, for they can neither do evil nor good."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Non est similis tui, Domine: magnus es tu, et magnum nomen tuum in fortitudine."
      en: "There is none like to thee, O Lord: thou art great and great is thy name in might."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Quis non timebit te, o rex gentium? Tuum est enim decus: inter cunctos sapientes gentium, et in universis regnis eorum, nullus est similis tui."
      en: "Who shall fear thee, O king of nations? for thine is the glory: among all the wise men of the nations, and in all their kingdoms there is none like unto thee."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Pariter insipientes et fatui probabuntur: doctrina vanitatis eorum lignum est."
      en: "They shall be all proved together to be senseless and foolish: the doctrine of their vanity is wood."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Argentum involutum de Tharsis affertur, et aurum de Ophaz: opus artificis et manus aerarii, hyacinthus et purpura indumentum eorum; opus artificum universa haec."
      en: "Silver spread into plates is brought from Tharsis, and gold from Ophaz: the work of the artificer, and of the hand of the coppersmith: violet and purple is their clothing: all these things are the work of artificers."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dominus autem Deus verus est, ipse Deus vivens, et rex sempiternus. Ab indignatione ejus commovebitur terra, et non sustinebunt gentes comminationem ejus."
      en: "But the Lord is the true God: he is the living God, and the everlasting king, at his wrath the earth shall tremble, and the nations shall not be able to abide his threatening."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sic ergo dicetis eis: Dii qui caelos et terram non fecerunt, pereant de terra et de his quae sub caelo sunt!"
      en: "Thus then shall you say to them: The gods that have not made heaven and earth, let them perish from the earth, and from among those places that are under heaven."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Qui facit terram in fortitudine sua, praeparat orbem in sapientia sua, et prudentia sua extendit caelos:"
      en: "He that maketh the earth by his power, that prepareth the world by his wisdom, and stretcheth out the heavens by his knowledge."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ad vocem suam dat multitudinem aquarum in caelo, et elevat nebulas ab extremitatibus terrae: fulgura in pluviam facit, et educit ventum de thesauris suis."
      en: "At his voice he giveth a multitude of waters in the heaven, and lifteth up the clouds from the ends of the earth: he maketh lightnings for rain, and bringeth forth the wind out of his treasures."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Stultus factus est omnis homo a scientia: confusus est artifex omnis in sculptili, quoniam falsum est quod conflavit, et non est spiritus in eis."
      en: "Every man is become a fool for knowledge, every artist is confounded in his graven idol: for what he hath cast is false, and there is no spirit in them."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Vana sunt, et opus risu dignum: in tempore visitationis suae peribunt."
      en: "They are vain things and a ridiculous work: in the time of their visitation they shall perish."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non est his similis pars Jacob: qui enim formavit omnia ipse est, et Israel virga haereditatis ejus: Dominus exercituum nomen illi."
      en: "The portion of Jacob is not like these: for it is he who formed all things: and Israel is the rod of his inheritance: the Lord of hosts is his name."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Congrega de terra confusionem tuam, quae habitas in obsidione:"
      en: "Gather up thy shame out of the land, thou that dwellest in a siege."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "quia haec dicit Dominus: Ecce ego longe projiciam habitatores terrae in hac vice, et tribulabo eos ita ut inveniantur."
      en: "For thus saith the Lord: Behold I will cast away far off the inhabitants of the land at this time: and I will afflict them, so that they may be found."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Vae mihi super contritione mea, pessima plaga mea: ego autem dixi: Plane haec infirmitas mea est, et portabo illam."
      en: "Woe is me for my destruction, my wound is very grievous. But I said: Truly this is my own evil, and I will bear it."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Tabernaculum meum vastatum est, omnes funiculi mei dirupti sunt: filii mei exierunt a me, et non subsistunt. Non est qui extendat ultra tentorium meum, et erigat pelles meas."
      en: "My tabernacle is laid waste, all my cords are broken: my children are gone out from me, and they are not: there is none to stretch forth my tent any more, and to set up my curtains."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Quia stulte egerunt pastores, et Dominus non quaesierunt: propterea non intellexerunt, et omnis grex eorum dispersus est."
      en: "Because the pastors have done foolishly, and have not sought the Lord: therefore have they not understood, and all their flock is scattered."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Vox auditionis ecce venit, et commotio magna de terra aquilonis, ut ponat civitates Juda solitudinem, et habitaculum draconum."
      en: "Behold the sound of a noise cometh, a great commotion out of the land of the north: to make the cities of Juda a desert, and a dwelling for dragons."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Scio, Domine, quia non est hominis via ejus, nec viri est ut ambulet, et dirigat gressus suos."
      en: "I know, O Lord, that the way of a man is not his: neither is it in a man to walk, and to direct his steps."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Corripe me, Domine, verumtamen in judicio, et non in furore tuo, ne forte ad nihilum redigas me."
      en: "Correct me, O Lord, but yet with judgment: and not in fury, lest thou bring me to nothing."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Effunde indignationem tuam super gentes quae non cognoverunt te, et super provincias quae nomen tuum non invocaverunt, quia comederunt Jacob, et devoraverunt eum, et consumpserunt illum, et decus ejus dissipaverunt."
      en: "Pour out thy indignation upon the nations that have not known thee, and upon the provinces that have not called upon thy name: because they have eaten up Jacob, and devoured him, and consumed him, and have destroyed his glory."
    status: { la: verified, en: verified }
