# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 41
verses:
  - n: 1
    text:
      la: "Post duos annos vidit Pharao somnium. Putabat se stare super fluvium,"
      en: "After two years Pharao had a dream. He thought he stood by the river,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "de quo ascendebant septem boves, pulchrae et crassae nimis: et pascebantur in locis palustribus."
      en: "Out of which came up seven kine, very beautiful and fat: and they fed in marshy places."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Aliae quoque septem emergebant de flumine, foedae confectaeque macie: et pascebantur in ipsa amnis ripa in locis virentibus:"
      en: "Other seven also came up out of the river, ill favoured, and leanfleshed: and they fed on the very bank of the river, in green places:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "devoraveruntque eas, quarum mira species et habitudo corporum erat. Expergefactus Pharao,"
      en: "And they devoured them, whose bodies were very beautiful and well conditioned. So Pharao awoke."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "rursum dormivit, et vidit alterum somnium: septem spicae pullulabant in culmo uno plenae atque formosae:"
      en: "He slept again, and dreamed another dream: Seven ears of corn came up upon one stalk full and fair:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "aliae quoque totidem spicae tenues, et percussae uredine oriebantur,"
      en: "Then seven other ears sprung up thin and blasted,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "devorantes omnium priorum pulchritudinem. Evigilans Pharao post quietem,"
      en: "And devoured all the beauty of the former. Pharao awaked after his rest:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et facto mane, pavore perterritus, misit ad omnes conjectores Aegypti, cunctosque sapientes, et accersitis narravit somnium, nec erat qui interpretaretur."
      en: "And when morning was come, being struck with fear, he sent to all the interpreters of Egypt, and to all the wise men: and they being called for, he told them his dream, and there was not any one that could interpret it."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Tunc demum reminiscens pincernarum magister, ait: Confiteor peccatum meum:"
      en: "Then at length the chief butler remembering, said: I confess my sin:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "iratus rex servis suis, me et magistrum pistorum retrudi jussit in carcerem principis militum:"
      en: "The king being angry with his servants, commanded me and the chief baker to be cast into the prison of the captain of the soldiers:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ubi una nocte uterque vidimus somnium praesagum futurorum."
      en: "Where in one night both of us dreamed a dream foreboding things to come."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Erat ibi puer hebraeus, ejusdem ducis militum famulus: cui narrantes somnia,"
      en: "There was there a young man a Hebrew, servant to the same captain of the soldiers: to whom we told our dreams,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "audivimus quidquid postea rei probavit eventus; ego enim redditus sum officio meo, et ille suspensus est in cruce."
      en: "And we heard what afterwards the event of the thing proved to be so. For I was restored to my office: and he was hanged upon a gibbet."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Protinus ad regis imperium eductum de carcere Joseph totonderunt: ac veste mutata obtulerunt ei."
      en: "Forthwith at the king's command, Joseph was brought out of the prison, and they shaved him, and changing his apparel, brought him in to him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cui ille ait: Vidi somnia, nec est qui edisserat: quae audivi te sapientissime conjicere."
      en: "And he said to him: I have dreamed dreams, and there is no one that can expound them: Now I have heard that thou art very wise at interpreting them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Respondit Joseph: Absque me Deus respondebit prospera Pharaoni."
      en: "Joseph answered: Without me, God shall give Pharao a prosperous answer."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Narravit ergo Pharao quod viderat: Putabam me stare super ripam fluminis,"
      en: "So Pharao told what he had dreamed: Methought I stood upon the bank of the river,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et septem boves de amne conscendere, pulchras nimis, et obesis carnibus: quae in pastu paludis virecta carpebant."
      en: "And seven kine came up out of the river exceeding beautiful and full of flesh: and they grazed on green places in a marshy pasture."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et ecce, has sequebantur aliae septem boves, in tantum deformes et macilentae, ut numquam tales in terra Aegypti viderim:"
      en: "And behold, there followed these, other seven kine, so very ill favoured and lean, that I never saw the like in the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quae, devoratis et consumptis prioribus,"
      en: "And they devoured and consumed the former,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "nullum saturitatis dedere vestigium: sed simili macie et squalore torpebant. Evigilans, rursus sopore depressus,"
      en: "And yet gave no mark of their being full: but were as lean and ill favoured as before. I awoke, and then fell asleep again,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vidi somnium. Septem spicae pullulabant in culmo uno plenae atque pulcherrimae."
      en: "And dreamed a dream: Seven ears of corn grew upon one stalk, full and very fair."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Aliae quoque septem tenues et percussae uredine, oriebantur e stipula:"
      en: "Other seven also thin and blasted, sprung of the stock:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "quae priorum pulchritudinem devoraverunt. Narravi conjectoribus somnium, et nemo est qui edisserat."
      en: "And they devoured the beauty of the former: I told this dream to the conjecturers, and there is no man that can expound it."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Respondit Joseph: Somnium regis unum est: quae facturus est Deus, ostendit Pharaoni."
      en: "Joseph answered: The king's dream is one: God hath shewn to Pharao what he is about to do."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Septem boves pulchrae, et septem spicae plenae, septem ubertatis anni sunt: eamdemque vim somnii comprehendunt."
      en: "The seven beautiful kine, and the seven full ears, are seven years of plenty: and both contain the same meaning of the dream."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Septem quoque boves tenues atque macilentae, quae ascenderunt post eas, et septem spicae tenues, et vento urente percussae, septem anni venturae sunt famis."
      en: "And the seven lean and thin kine that came up after them, and the seven thin ears that were blasted with the burning wind, are seven years of famine to come:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Qui hoc ordine complebuntur:"
      en: "Which shall be fulfilled in this order:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ecce septem anni venient fertilitatis magnae in universa terra Aegypti,"
      en: "Behold, there shall come seven years of great plenty in the whole land of Egypt:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "quos sequentur septem anni alii tantae sterilitatis, ut oblivioni tradatur cuncta retro abundantia: consumptura est enim fames omnem terram,"
      en: "After which shall follow other seven years of so great scarcity, that all the abundance before shall be forgotten: for the famine shall consume all the land,"
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et ubertatis magnitudinem perditura est inopiae magnitudo."
      en: "And the greatness of the scarcity shall destroy the greatness of the plenty."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Quod autem vidisti secundo ad eamdem rem pertinens somnium: firmitatis indicium est, eo quod fiat sermo Dei, et velocius impleatur."
      en: "And for that thou didst see the second time a dream pertaining to the same thing: it is a token of the certainty, and that the word of God cometh to pass, and is fulfilled speedily."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Nunc ergo provideat rex virum sapientem et industrium, et praeficiat eum terrae Aegypti:"
      en: "Now therefore let the king provide a wise and industrious man, and make him ruler over the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "qui constituat praepositos per cunctas regiones: et quintam partem fructuum per septem annos fertilitatis,"
      en: "That he may appoint overseers over all the countries: and gather into barns the fifth part of the fruits, during the seven fruitful years,"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "qui jam nunc futuri sunt, congreget in horrea: et omne frumentum sub Pharaonis potestate condatur, serveturque in urbibus."
      en: "That shall now presently ensue: and let all the corn be laid up under Pharao's hands and be reserved in the cities."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et praeparetur futurae septem annorum fami, quae oppressura est Aegyptum, et non consumetur terra inopia."
      en: "And let it be in readiness, against the famine of seven years to come, which shall oppress Egypt, and the land shall not be consumed with scarcity."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Placuit Pharaoni consilium et cunctis ministris ejus:"
      en: "The counsel pleased Pharao and all his servants."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "locutusque est ad eos: Num invenire poterimus talem virum, qui spiritu Dei plenus sit?"
      en: "And he said to them: Can we find such another man, that is full of the spirit of God?"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Dixit ergo ad Joseph: Quia ostendit tibi Deus omnia quae locutus es, numquid sapientiorem et consimilem tui invenire potero?"
      en: "He said therefore to Joseph: Seeing God hath shewn thee all that thou hast said, can I find one wiser and one like unto thee?"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Tu eris super domum meam, et ad tui oris imperium cunctus populus obediet: uno tantum regni solio te praecedam."
      en: "Thou shalt be over my house, and at the commandment of thy mouth all the people shall obey: only in the kingly throne will I be above thee."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Dixitque rursus Pharao ad Joseph: Ecce, constitui te super universam terram Aegypti."
      en: "And again Pharao said to Joseph: Behold, I have appointed thee over the whole land of Egypt."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Tulitque annulum de manu sua, et dedit eum in manu ejus: vestivitque eum stola byssina, et collo torquem auream circumposuit."
      en: "And he took his ring from his own hand, and gave it into his hand: and he put upon him a robe of silk, and put a chain of gold about his neck."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Fecitque eum ascendere super currum suum secundum, clamante praecone, ut omnes coram eo genu flecterent, et praepositum esse scirent universae terrae Aegypti."
      en: "And he made him go up into his second chariot, the crier proclaiming that all should bow their knee before him, and that they should know he was made governor over the whole land of Egypt."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Dixit quoque rex ad Joseph: Ego sum Pharao: absque tuo imperio non movebit quisquam manum aut pedem in omni terra Aegypti."
      en: "And the king said to Joseph: I am Pharao; without thy commandment no man shall move hand or foot in all the land of Egypt."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Vertitque nomen ejus, et vocavit eum, lingua aegyptiaca, Salvatorem mundi. Deditque illi uxorem Aseneth filiam Putiphare sacerdotis Heliopoleos. Egressus est itaque Joseph ad terram Aegypti"
      en: "And he turned his name, and called him in the Egyptian tongue, The saviour of the world. And he gave him to wife Aseneth the daughter of Putiphare priest of Heliopolis. Then Joseph went out to the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "( triginta autem annorum erat quando stetit in conspectu regis Pharaonis), et circuivit omnes regiones Aegypti."
      en: "(Now he was thirty years old when he stood before king Pharao) and he went round all the countries of Egypt."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Venitque fertilitas septem annorum: et in manipulos redactae segetes congregatae sunt in horrea Aegypti."
      en: "And the fruitfulness of the seven years came: and the corn being bound up into sheaves was gathered together into the barns of Egypt."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Omnis etiam frugum abundantia in singulis urbibus condita est."
      en: "And all the abundance of grain was laid up in every city."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Tantaque fuit abundantia tritici, ut arenae maris coaequaretur, et copia mensuram excederet."
      en: "And there was so great abundance of wheat, that it was equal to the sand of the sea, and the plenty exceeded measure."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Nati sunt autem Joseph filii duo antequam veniret fames: quos peperit ei Aseneth filia Putiphare sacerdotis Heliopoleos."
      en: "And before the famine came, Joseph had two sons born: whom Aseneth the daughter of Putiphare priest of Heliopolis bore unto him."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Vocavitque nomen primogeniti Manasses, dicens: Oblivisci me fecit Deus omnium laborum meorum, et domus patris mei."
      en: "And he called the name of the firstborn Manasses, saying: God hath made me to forget all my labours, and my father's house."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Nomen quoque secundi appellavit Ephraim, dicens: Crescere me fecit Deus in terra paupertatis meae."
      en: "And he named the second Ephraim, saying: God hath made me to grow in the land of my poverty."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Igitur transactis septem ubertatis annis, qui fuerant in Aegypto,"
      en: "Now when the seven years of the plenty that had been in Egypt were past:"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "coeperunt venire septem anni inopiae, quos praedixerat Joseph: et in universo orbe fames praevaluit, in cuncta autem terra Aegypti panis erat."
      en: "The seven years of scarcity, which Joseph had foretold, began to come: and the famine prevailed in the whole world, but there was bread in all the land of Egypt."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Qua esuriente, clamavit populus ad Pharaonem, alimenta petens. Quibus ille respondit: Ite ad Joseph: et quidquid ipse vobis dixerit, facite."
      en: "And when there also they began to be famished, the people cried to Pharao for food. And he said to them: Go to Joseph: and do all that he shall say to you."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Crescebat autem quotidie fames in omni terra: aperuitque Joseph universa horrea, et vendebat Aegyptiis: nam et illos oppresserat fames."
      en: "And the famine increased daily in all the land: and Joseph opened all the barns, and sold to the Egyptians: for the famine had oppressed them also."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Omnesque provinciae veniebant in Aegyptum, ut emerent escas, et malum inopiae temperarent."
      en: "And all provinces came into Egypt, to buy food, and to seek some relief of their want."
    status: { la: verified, en: verified }
