# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 16
verses:
  - n: 1
    text:
      la: "Dixitque Dominus ad Samuelem: Usquequo tu luges Saul, cum ego projecerim eum ne regnet super Israel? Imple cornu tuum oleo, et veni, ut mittam te ad Isai Bethlehemitem: providi enim in filiis ejus mihi regem."
      en: "And the Lord said to Samuel: How long wilt thou mourn for Saul, whom I have rejected from reigning over Israel? fill thy horn with oil, and come, that I may send thee to Isai the Bethlehemite: for I have provided me a king among his sons."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et ait Samuel: Quomodo vadam? audiet enim Saul, et interficiet me. Et ait Dominus: Vitulum de armento tolles in manu tua, et dices: Ad immolandum Domino veni."
      en: "And Samuel said: How shall I go? for Saul will hear of it, and he will kill me. And the Lord said: Thou shalt take with thee a calf of the herd, and thou shalt say: I am come to sacrifice to the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et vocabis Isai ad victimam, et ego ostendam tibi quid facias, et unges quemcumque monstravero tibi."
      en: "And thou shalt call Isai to the sacrifice, and I will shew thee what thou art to do, and thou shalt anoint him whom I shall shew to thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Fecit ergo Samuel, sicut locutus est ei Dominus. Venitque in Bethlehem, et admirati sunt seniores civitatis, occurrentes ei, dixeruntque: Pacificusne est ingressus tuus?"
      en: "Then Samuel did as the Lord had said to him. And he came to Bethlehem, and the ancients of the city wondered, and meeting him, they said: Is thy coming hither peaceable?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et ait: Pacificus: ad immolandum Domino veni, sanctificamini, et venite mecum ut immolem. Sanctificavit ergo Isai et filios ejus, et vocavit eos ad sacrificium."
      en: "And he said: It is peaceable: I am come to offer sacrifice to the Lord, be ye sanctified, and come with me to the sacrifice. And he sanctified Isai and his sons, and called them to the sacrifice."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Cumque ingressi essent, vidit Eliab, et ait: Num coram Domino est Christus ejus?"
      en: "And when they were come in, he saw Eliab, and said: Is the Lord's anointed before him?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et dixit Dominus ad Samuelem: Ne respicias vultum ejus, neque altitudinem staturae ejus: quoniam abjeci eum, nec juxta intuitum hominis ego judico: homo enim videt ea quae parent, Dominus autem intuetur cor."
      en: "And the Lord said to Samuel: Look not on his countenance, nor on the height of his stature: because I have rejected him, nor do I judge according to the look of man: for man seeth those things that appear, but the Lord beholdeth the heart."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et vocavit Isai Abinadab, et adduxit eum coram Samuele. Qui dixit: Nec hunc elegit Dominus."
      en: "And Isai called Abinadab, and brought him before Samuel. And he said: Neither hath the Lord chosen this."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Adduxit autem Isai Samma, de quo ait: Etiam hunc non elegit Dominus."
      en: "And Isai brought Samma, and he said of him: Neither hath the Lord chosen this."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Adduxit itaque Isai septem filios suos coram Samuele: et ait Samuel ad Isai: Non elegit Dominus ex istis."
      en: "Isai therefore brought his seven sons before Samuel: and Samuel said to Isai: The Lord hath not chosen any one of these."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Dixitque Samuel ad Isai: Numquid jam completi sunt filii? Qui respondit: Adhuc reliquus est parvulus, et pascit oves. Et ait Samuel ad Isai: Mitte, et adduc eum: nec enim discumbemus priusquam huc ille veniat."
      en: "And Samuel said to Isai: Are here all thy sons? He answered: There remaineth yet a young one, who keepeth the sheep. And Samuel said to Isai: Send, and fetch him, for we will not sit down till he come hither."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Misit ergo, et adduxit eum. Erat autem rufus, et pulcher aspectu, decoraque facie: et ait Dominus: Surge, unge eum, ipse est enim."
      en: "He sent therefore and brought him Now he was ruddy and beautiful to behold, and of a comely face. And the Lord said: Arise, and anoint him, for this is he."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tulit ergo Samuel cornu olei, et unxit eum in medio fratrum ejus: et directus est spiritus Domini a die illa in David, et deinceps: surgensque Samuel abiit in Ramatha."
      en: "Then Samuel took the horn of oil, and anointed him in the midst of his brethren: and the spirit of the Lord came upon David from that day forward: and Samuel rose up, and went to Ramatha."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Spiritus autem Domini recessit a Saul, et exagitabat eum spiritus nequam, a Domino."
      en: "But the spirit of the Lord departed from Saul, and an evil spirit from the Lord troubled him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixeruntque servi Saul ad eum: Ecce spiritus Dei malus exagitat te."
      en: "And the servants of Saul said to him: Behold now an evil spirit from God troubleth thee."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Jubeat dominus noster, et servi tui, qui coram te sunt, quaerent hominem scientem psallere cithara, ut quando arripuerit te spiritus Domini malus, psallat manu sua, et levius feras."
      en: "Let our lord give orders, and thy servants who are before thee will seek out a man skillful in playing on the harp, that when the evil spirit from the Lord is upon thee, he may play with his hand, and thou mayest bear it more easily."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et ait Saul ad servos suos: Providete ergo mihi aliquem bene psallentem, et adducite eum ad me."
      en: "And Saul said to his servants: Provide me then some man that can play well, and bring him to me."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et respondens unus de pueris, ait: Ecce vidi filium Isai Bethlehemitem scientem psallere, et fortissimum robore, et virum bellicosum, et prudentem in verbis, et virum pulchrum: et Dominus est cum eo."
      en: "And one of the servants answering, said: Behold I have seen a son of Isai the Bethlehemite, a skillful player, and one of great strength, and a man fit for war, and prudent in his words, and a comely person: and the Lord is with him."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Misit ergo Saul nuntios ad Isai, dicens: Mitte ad me David filium tuum, qui est in pascuis."
      en: "Then Saul sent messengers to Isai, saying: Send me David thy son, who is in the pastures."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Tulit itaque Isai asinum plenum panibus, et lagenam vini, et haedum de capris unum, et misit per manum David filii sui Sauli."
      en: "And Isai took an ass laden with bread, and a bottle of wine, and a kid of the flock, and sent them by the hand of David his son to Saul."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et venit David ad Saul, et stetit coram eo: at ille dilexit eum nimis, et factus est ejus armiger."
      en: "And David came to Saul, and stood before him: and he loved him exceedingly, and made him his armourbearer."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Misitque Saul ad Isai, dicens: Stet David in conspectu meo: invenit enim gratiam in oculis meis."
      en: "And Saul sent to Isai, saying: Let David stand before me: for he hath found favour in my sight."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Igitur quandocumque spiritus Domini malus arripiebat Saul, David tollebat citharam, et percutiebat manu sua, et refocillabatur Saul, et levius habebat: recedebat enim ab eo spiritus malus."
      en: "So whensoever the evil spirit from the Lord was upon Saul, David took his harp, and played with his hand, and Saul was refreshed, and was better, for the evil spirit departed from him."
    status: { la: verified, en: verified }
