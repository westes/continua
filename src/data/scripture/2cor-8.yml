# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2cor
chapter: 8
verses:
  - n: 1
    text:
      la: "Notam autem facimus vobis, fratres, gratiam Dei, quae data est in ecclesiis Macedoniae:"
      en: "Now we make known unto you, brethren, the grace of God, that hath been given in the churches of Macedonia."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quod in multo experimento tribulationis abundantia gaudii ipsorum fuit, et altissima paupertas eorum, abundavit in divitias simplicitatis eorum:"
      en: "That in much experience of tribulation, they have had abundance of joy; and their very deep poverty hath abounded unto the riches of their simplicity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "quia secundum virtutem testimonium illis reddo, et supra virtutem voluntarii fuerunt,"
      en: "For according to their power (I bear them witness), and beyond their power, they were willing."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cum multa exhortatione obsecrantes nos gratiam, et communicationem ministerii, quod fit in sanctos."
      en: "With much entreaty begging of us the grace and communication of the ministry that is done toward the saints."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et non sicut speravimus, sed semetipsos dederunt primum Domino, deinde nobis per voluntatem Dei,"
      en: "And not as we hoped, but they gave their own selves first to the Lord, then to us by the will of God:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ita ut rogaremus Titum, ut quemadmodum coepit, ita et perficiat in vobis etiam gratiam istam."
      en: "Insomuch, that we desired Titus, that as he had begun, so also he would finish among you this same grace."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sed sicut in omnibus abundatis fide, et sermone, et scientia, et omni sollicitudine, insuper et caritate vestra in nos, ut et in hac gratia abundetis."
      en: "That as in all things you abound in faith, and word, and knowledge, and all carefulness; moreover also in your charity towards us, so in this grace also you may abound."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non quasi imperans dico: sed per aliorum sollicitudinem, etiam vestrae caritatis ingenium bonum comprobans."
      en: "I speak not as commanding; but by the carefulness of others, approving also the good disposition of your charity."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Scitis enim gratiam Domini nostri Jesu Christi, quoniam propter vos egenus factus est, cum esset dives, ut illius inopia vos divites essetis."
      en: "For you know the grace of our Lord Jesus Christ, that being rich he became poor, for your sakes; that through his poverty you might be rich."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et consilium in hoc do: hoc enim vobis utile est, qui non solum facere, sed et velle coepistis ab anno priore:"
      en: "And herein I give my advice; for this is profitable for you, who have begun not only to do, but also to be willing, a year ago."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "nunc vero et facto perficite: ut quemadmodum promptus est animus voluntatis, ita sit et perficiendi ex eo quod habetis."
      en: "Now therefore perform ye it also in deed; that as your mind is forward to be willing, so it may be also to perform, out of that which you have."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Si enim voluntas prompta est, secundum id quod habet, accepta est, non secundum id quod non habet."
      en: "For if the will be forward, it is accepted according to that which a man hath, not according to that which he hath not."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Non enim ut aliis sit remissio, vobis autem tribulatio, sed ex aequalitate."
      en: "For I mean not that others should be eased, and you burthened, but by an equality."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "In praesenti tempore vestra abundantia illorum inopiam suppleat: ut et illorum abundantia vestrae inopiae sit supplementum, ut fiat aequalitas, sicut scriptum est:"
      en: "In this present time let your abundance supply their want, that their abundance also may supply your want, that there may be an equality,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Qui multum, non abundavit: et qui modicum, non minoravit."
      en: "As it is written: He that had much, had nothing over; and he that had little, had no want."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Gratias autem Deo, qui dedit eamdem sollicitudinem pro vobis in corde Titi,"
      en: "And thanks be to God, who hath given the same carefulness for you in the heart of Titus."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quoniam exhortationem quidem suscepit: sed cum sollicitior esset, sua voluntate profectus est ad vos."
      en: "For indeed he accepted the exhortation; but being more careful, of his own will he went unto you."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Misimus etiam cum illo fratrem, cujus laus est in Evangelio per omnes ecclesias:"
      en: "We have sent also with him the brother, whose praise is in the gospel through all the churches."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non solum autem, sed et ordinatus est ab ecclesiis comes peregrinationis nostrae in hanc gratiam, quae ministratur a nobis ad Domini gloriam, et destinatam voluntatem nostram:"
      en: "And not that only, but he was also ordained by the churches companion of our travels, for this grace, which is administered by us, to the glory of the Lord, and our determined will:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "devitantes hoc, ne quis nos vituperet in hac plenitudine, quae ministratur a nobis."
      en: "Avoiding this, lest any man should blame us in this abundance which is administered by us."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Providemus enim bona non solum coram Deo, sed etiam coram hominibus."
      en: "For we forecast what may be good not only before God, but also before men."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Misimus autem cum illis et fratrem nostrum, quem probavimus in multis saepe sollicitum esse: nunc autem multo sollicitiorem, confidentia multa in vos,"
      en: "And we have sent with them our brother also, whom we have often proved diligent in many things; but now much more diligent, with much confidence in you,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sive pro Tito, qui est socius meus, et in vos adjutor, sive fratres nostri, Apostoli ecclesiarum, gloria Christi."
      en: "Either for Titus, who is my companion and fellow labourer towards you, or our brethren, the apostles of the churches, the glory of Christ."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ostensionem ergo, quae est caritatis vestrae, et nostrae gloriae pro vobis, in illos ostendite in faciem ecclesiarum."
      en: "Wherefore shew ye to them, in the sight of the churches, the evidence of your charity, and of our boasting on your behalf."
    status: { la: verified, en: verified }
