# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 31
verses:
  - n: 1
    text:
      la: "vae qui descendunt in Aegyptum ad auxilium in equis sperantes et habentes fiduciam super quadrigis quia multae sunt et super equitibus quia praevalidi nimis et non sunt confisi super Sanctum Israhel et Dominum non requisierunt"
      en: "Woe to them that go down to Egypt for help, trusting in horses, and putting their confidence in chariots, because they me many: and in horsemen, because they me very strong: and have not trusted in the Holy One of Israel, and have not sought after the Lord."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ipse autem sapiens adduxit malum et verba sua non abstulit et consurget contra domum pessimorum et contra auxilium operantium iniquitatem"
      en: "But he that is the wise one hath brought evil, and hath not removed his words: and he will rise up against the house of the wicked, and against the aid of them that work iniquity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Aegyptus homo et non deus et equi eorum caro et non spiritus et Dominus inclinabit manum suam et corruet auxiliator et cadet cui praestatur auxilium simulque omnes consumentur"
      en: "Egypt is man, and not God: and their horses, flesh, and not spirit: and the Lord shall put down his hand, and the helper shall fall, and he that is helped shall fall, and they shall al be confounded together."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia haec dicit Dominus ad me quomodo si rugiat leo et catulus leonis super praedam suam cum occurrerit ei multitudo pastorum a voce eorum non formidabit et a multitudine eorum non pavebit sic descendet Dominus exercituum ut proelietur super montem Sion et super collem eius"
      en: "For thus saith the Lord to me: Like as the lion roareth, and the lion's whelp upon his prey, and when a multitude of shepherds shall come against him, he will not fear at their voice, nor be afraid of their multitude: so shall the Lord of hosts come down to fight upon mount Sion, and upon the hill thereof."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sicut aves volantes sic proteget Dominus exercituum Hierusalem protegens et liberans transiens et salvans"
      en: "As birds dying, so will the Lord of hosts protect Jerusalem, protecting and delivering, passing over and saving."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "convertimini sicut in profundum recesseratis filii Israhel"
      en: "Return as you had deeply revolted, O children of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in die enim illa abiciet vir idola argenti sui et idola auri sui quae fecerunt vobis manus vestrae in peccatum"
      en: "For in that day a man shall cast away his idols of silver, and his idols of gold, which your hands have made for you to sin."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et cadet Assur in gladio non viri et gladius non hominis vorabit eum et fugiet non a facie gladii et iuvenes eius vectigales erunt"
      en: "And the Assyrian shall fall by the sword not of a man, and the sword not of a man shall devour him, and he shall flee not at the face of the sword: and his young men shall be tributaries."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et fortitudo eius a terrore transibit et pavebunt fugientes principes eius dixit Dominus cuius ignis est in Sion et caminus eius in Hierusalem"
      en: "And his strength shall pass away with dread, and his princes fleeing shall be afraid: the Lord hath said it, whose die is in Sion, and his furnace in Jerusalem."
    status: { la: verified, en: verified }
