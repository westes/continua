# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: amos
chapter: 6
verses:
  - n: 1
    text:
      la: "vae qui opulenti estis in Sion et confiditis in monte Samariae optimates capita populorum ingredientes pompatice domum Israhel"
      en: "Woe to you that are wealthy in Sion, and to you that have confidence in the mountain of Samaria: ye great men, heads of the people, that go in with state into the house of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "transite in Chalanne et videte et ite inde in Emath magnam et descendite in Geth Palestinorum et ad optima quaeque regna horum si latior terminus eorum termino vestro est"
      en: "Pass ye over to Chalane, and see, and go from thence into Emath the great: and go down into Geth of the Philistines, and to all the best kingdoms of these: if their border be larger than your border."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui separati estis in diem malum et adpropinquatis solio iniquitatis"
      en: "You that are separated unto the evil day: and that approach to the throne of iniquity;"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui dormitis in lectis eburneis et lascivitis in stratis vestris qui comeditis agnum de grege et vitulos de medio armenti"
      en: "You that sleep upon beds of ivory, and are wanton on your couches: that eat the lambs out of the flock, and the calves out of the midst of the herd;"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "qui canitis ad vocem psalterii sicut David putaverunt se habere vasa cantici"
      en: "You that sing to the sound of the psaltery: they have thought themselves to have instruments of music like David;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "bibentes in fialis vinum et optimo unguento delibuti et nihil patiebantur super contritione Ioseph"
      en: "That drink wine in bowls, and anoint themselves with the best ointments: and they are not concerned for the affliction of Joseph."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quapropter nunc migrabunt in capite transmigrantium et auferetur factio lascivientium"
      en: "Wherefore now they shall go captive at the head of them that go into captivity: and the faction of the luxurious ones shall be taken away."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "iuravit Dominus Deus in anima sua dicit Dominus Deus exercituum detestor ego superbiam Iacob et domos eius odi et tradam civitatem cum habitatoribus suis"
      en: "The Lord God hath sworn by his own soul, saith the Lord the God of hosts: I detest the pride of Jacob, and I hate his houses, and I will deliver up the city with the inhabitants thereof."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quod si reliqui fuerint decem viri in domo una et ipsi morientur"
      en: "And if there remain ten men in one house, they also shall die."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et tollet eum propinquus suus et conburet eum ut efferat ossa de domo et dicet ei qui in penetrabilibus domus est numquid adhuc est apud te"
      en: "And a man's kinsman shall take him up, and shall burn him, that he may carry the bones out of the house; and he shall say to him that is in the inner rooms of the house: Is there yet any with thee?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et respondebit finis est et dicet ei tace et non recorderis nominis Domini"
      en: "And he shall answer: There is an end. And he shall any to him: Hold thy peace, and mention not the name of the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quia ecce Dominus mandabit et percutiet domum maiorem ruinis et domum minorem scissionibus"
      en: "For behold the Lord hath commanded, and he will strike the greater house with breaches, and the lesser house with clefts."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "numquid currere queunt in petris equi aut arari potest in bubalis quoniam convertistis in amaritudinem iudicium et fructum iustitiae in absinthium"
      en: "Can horses run upon the rocks, or can any one plough with buffles? for you have turned judgment into bitterness, and the fruit of justice into wormwood."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui laetamini in nihili qui dicitis numquid non in fortitudine nostra adsumpsimus nobis cornua"
      en: "You that rejoice in a thing of nought: you that say: Have we not taken unto us horns by our own strength?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ecce enim suscitabo super vos domus Israhel dicit Dominus Deus exercituum gentem et conterent vos ab introitu Emath usque ad torrentem Deserti"
      en: "But behold, I will raise up a nation against you, O house of Israel, saith the Lord the God of hosts; and they shall destroy you from the entrance of Emath, even to the torrent of the desert."
    status: { la: verified, en: verified }
