# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: abd
chapter: 1
verses:
  - n: 1
    text:
      la: "Visio Abdiae. Haec dicit Dominus Deus ad Edom: Auditum audivimus a Domino, et legatum ad gentes misit: surgite, et consurgamus adversus eum in praelium."
      en: "The vision of Abdias. Thus saith the Lord God to Edom: We have heard a rumour from the Lord, and he hath sent an ambassador to the nations: Arise, and let us rise up to battle against him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ecce parvulum dedi te in gentibus: contemptibilis tu es valde."
      en: "Behold I have made thee small among the nations: thou art exceeding contemptible."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Superbia cordis tui extulit te, habitantem in scissuris petrarum, exaltantem solium tuum; qui dicis in corde tuo: Quis detrahet me in terram?"
      en: "The pride of thy heart hath lifted thee up, who dwellest in the clefts of the rocks, and settest up thy throne on high: who sayest in thy heart: Who shall bring me down to the ground?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Si exaltatus fueris ut aquila, et si inter sidera posueris nidum tuum, inde detraham te, dicit Dominus."
      en: "Though thou be exalted as an eagle, and though thou set thy nest among the stars: thence will I bring thee down, saith the Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Si fures introissent ad te, si latrones per noctem, quomodo conticuisses? nonne furati essent sufficientia sibi? Si vindemiatores introissent ad te, numquid saltem racemum reliquissent tibi?"
      en: "If thieves had gone in to thee, if robbers by night, how wouldst thou have held thy peace? would they not have stolen till they had enough? if the grapegatherers had come in to thee, would they not have left thee at the least a cluster?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quomodo scrutati sunt Esau; investigaverunt abscondita ejus?"
      en: "How have they searched Esau, how have they sought out his hidden things?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Usque ad terminum emiserunt te: omnes viri foederis tui illuserunt tibi: invaluerunt adversum te viri pacis tuae, qui comedunt tecum, ponent insidias subter te; non est prudentia in eo."
      en: "They have sent thee out even to the border: all the men of thy confederacy have deceived thee: the men of thy peace have prevailed against thee: they that eat with thee shall lay snares under thee: there is no wisdom in him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Numquid non in die illa, dicit Dominus, perdam sapientes de Idumaea, et prudentiam de monte Esau?"
      en: "Shall not I in that day, saith the Lord, destroy the wise out of Edom, and understanding out of the mount of Esau?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et timebunt fortes tui a meridie, ut intereat vir de monte Esau."
      en: "And thy valiant men of the south shall be afraid, that man may be cut off from the mount of Esau."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Propter interfectionem, et propter iniquitatem in fratrem tuum Jacob, operiet te confusio, et peribis in aeternum."
      en: "For the slaughter, and for the iniquity against thy brother Jacob, confusion shall cover thee, and thou shalt perish for ever."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "In die cum stares adversus eum, quando capiebant alieni exercitum ejus, et extranei ingrediebantur portas ejus, et super Jerusalem mittebant sortem, tu quoque eras quasi unus ex eis."
      en: "In the day when thou stoodest against him, when strangers carried away his army captive, and foreigners entered into his gates, and cast lots upon Jerusalem: thou also wast as one of them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et non despicies in die fratris tui, in die peregrinationis ejus: et non laetaberis super filios Juda in die perditionis eorum: et non magnificabis os tuum in die angustiae."
      en: "But thou shalt not look on in the day of thy brother, in the day of his leaving his country: and thou shalt not rejoice over the children of Juda, in the day of their destruction: and thou shalt not magnify thy mouth in the day of distress."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Neque ingriederis portam populi mei in die ruinae eorum; neque despicies et tu in malis ejus in die vastitatis illius. Et non emitteris adversus exercitum ejus in die vastitatis illius,"
      en: "Neither shalt thou enter into the gate of my people in the day of their ruin: neither shalt thou also look on in his evils in the day of his calamity: and thou shalt not be sent out against his army in the day of his desolation."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "neque stabis in exitibus ut interficias eos qui fugerint, et non concludes reliquos ejus in die tribulationis."
      en: "Neither shalt thou stand in the crossways to kill them that flee: and thou shalt not shut up them that remain of him in the day of tribulation."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quoniam juxta est dies Domini super omnes gentes: sicut fecisti, fiet tibi; retributionem tuam convertet in caput tuum."
      en: "For the day of the Lord is at hand upon all nations: as thou hast done, so shall it be done to thee: he will turn thy reward upon thy own head."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quomodo enim bibistis super montem sanctum meum, bibent omnes gentes jugiter: et bibent, et absorbebunt, et erunt quasi non sint."
      en: "For as you have drunk upon my holy mountain, so all nations shall drink continually: and they shall drink, and sup up, and they shall be as though they were not."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et in monte Sion erit salvatio, et erit sanctus; et possidebit domus Jacob eos qui se possederant."
      en: "And in mount Sion shall be salvation, and it shall be holy, and the house of Jacob shall possess those that possessed them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et erit domus Jacob ignis, et domus Joseph flamma, et domus Esau stipula: et succendentur in eis, et devorabunt eos, et non erunt reliquiae domus Esau, quia Dominus locutus est."
      en: "And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau stubble: and they shall be kindled in them, and shall devour them: and there shall be no remains of the house of Esau, for the Lord hath spoken it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et haereditabunt hi, qui ad austrum sunt, montem Esau, et qui in campestribus, Philisthiim: et possidebunt regionem Ephraim et regionem Samariae, et Benjamin possidebit Galaad."
      en: "And they that are toward the south, shall inherit the mount of Esau, and they that are in the plains, the Philistines: and they shall possess the country of Ephraim, and the country of Samaria: and Benjamin shall possess Galaad."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et transmigratio exercitus hujus filiorum Israel, omnia loca Chananaeorum usque ad Sareptam: et transmigratio Jerusalem, quae in Bosphoro est, possidebit civitates austri."
      en: "And the captivity of this host of the children of Israel, all the places of the Chanaanites even to Sarepta: and the captivity of Jerusalem that is in Bosphorus, shall possess the cities of the south."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ascendent salvatores in montem Sion judicare montem Esau, et erit Domino regnum."
      en: "And saviours shall come up into mount Sion to judge the mount of Esau: and the kingdom shall be for the Lord."
    status: { la: verified, en: verified }
