book: 2esdr
chapter: 13
verses:
  - n: 1
    text:
      la: "in die autem illo lectum est in volumine Mosi audiente populo et inventum est scriptum in eo quod non debeat introire Ammanites et Moabites in ecclesiam Dei usque in aeternum"
      en: "And on that day they read in the book of Moses in the hearing of the people: and therein was found written, that the Ammonites and the Moabites should not come in to the church of God for ever:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "eo quod non occurrerint filiis Israhel cum pane et aqua et conduxerint adversum eum Balaam ad maledicendum ei et convertit Deus noster maledictionem in benedictionem"
      en: "Because they met not the children of Israel with bread and water: and they hired against them Balaam, to curse them, and our God turned the curse into blessing."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "factum est autem cum audissent legem separaverunt omnem alienigenam ab Israhel"
      en: "And it came to pass, when they had heard the law, that they separated every stranger from Israel."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et super hoc erat Eliasib sacerdos qui fuerat positus in gazofilacio domus Dei nostri et proximus Tobiae"
      en: "And over this thing was Eliasib the priest, who was set over the treasury of the house of our God, and was near akin to Tobias."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "fecit ergo sibi gazofilacium grande et ibi erant ante eum reponentes munera et tus et vasa et decimam frumenti et vini et olei partes Levitarum et cantorum et ianitorum et primitias sacerdotales"
      en: "And he made him a great storeroom, where before him they laid up gifts, and frankincense, and vessels, and the tithes of the corn, of the wine, and of the oil, the portions of the Levites, and of the singing men, and of the porters, and the firstfruits of the priests."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "in omnibus autem his non fui in Hierusalem quia in anno tricesimo secundo Artarxersis regis Babylonis veni ad regem et in fine dierum rogavi regem"
      en: "But in all this time I was not in Jerusalem, because in the two and thirtieth year of Artaxerxes king of Babylon, I went to the king, and after certain days I asked the king:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et veni in Hierusalem et intellexi malum quod fecerat Eliasib Tobiae ut faceret ei thesaurum in vestibulis domus Dei"
      en: "And I came to Jerusalem, and I understood the evil that Eliasib had done for Tobias, to make him a storehouse in the courts of the house of God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et malum mihi visum est valde et proieci vasa domus Tobiae foras de gazofilacio"
      en: "And it seemed to me exceeding evil. And I cast forth the vessels of the house of Tobias out of the storehouse."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "praecepique et mundaverunt gazofilacia et rettuli ibi vasa domus Dei sacrificium et tus"
      en: "And I commanded and they cleansed the storehouses: and I brought thither again the vessels of the house of God, the sacrifice, and the frankincense."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et cognovi quoniam partes Levitarum non fuissent datae et fugisset unusquisque in regionem suam de Levitis et de cantoribus et de his qui ministrabant"
      en: "And I perceived that the portions of the Levites had not been given them: and that the Levites, and the singing men, and they that ministered were fled away every man to his own country:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et egi causam adversus magistratus et dixi quare dereliquimus domum Dei et congregavi eos et feci stare in stationibus suis"
      en: "And I pleaded the matter against the magistrates, and said: Why have we forsaken the house of God? And I gathered them together, and I made them to stand in their places."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et omnis Iuda adportabat decimam frumenti et vini et olei in horrea"
      en: "And all Juda brought the tithe of the corn, and the wine, and the oil into the storehouses."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et constituimus super horrea Selemiam sacerdotem et Sadoc scribam et Phadaiam de Levitis et iuxta eos Anan filium Zacchur filium Matthaniae quoniam fideles conprobati sunt et ipsis creditae sunt partes fratrum suorum"
      en: "And we set over the storehouses Selemias the priest, and Sadoc the scribe, and of the Levites Phadaia, and next to them Hanan the son of Zachur, the son of Mathania: for they were approved as faithful, and to them were committed the portions of their brethren."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "memento mei Deus meus pro hoc et ne deleas miserationes meas quas feci in domo Dei mei et in caerimoniis eius"
      en: "Remember me, O my God, for this thing, and wipe not out my kindnesses, which I have done relating to the house of my God and his ceremonies."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "in diebus illis vidi in Iuda calcabant torcularia in sabbato portantes acervos et onerantes super asinos vinum et uvas et ficus et omne onus et inferentes Hierusalem in die sabbati et contestatus sum ut in die qua vendere liceret venderent"
      en: "In those days I saw in Juda some treading the presses on the sabbath, and carrying sheaves, and lading asses with wine, and grapes, and figs, and all manner of burthens, and bringing them into Jerusalem on the sabbath day. And I charged them that they should sell on a day on which it was lawful to sell."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et Tyrii habitaverunt in ea inferentes pisces et omnia venalia et vendebant in sabbatis filiis Iuda et in Hierusalem"
      en: "Some Tyrians also dwelt there, who brought fish, and all manner of wares: and they sold them on the sabbaths to the children of Juda in Jerusalem."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et obiurgavi optimates Iuda et dixi eis quae est res haec mala quam vos facitis et profanatis diem sabbati"
      en: "And I rebuked the chief men of Juda, and said to them: What is this evil thing that you are doing, profaning the sabbath day?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "numquid non haec fecerunt patres nostri et adduxit Deus noster super nos omne malum hoc et super civitatem hanc et vos additis iracundiam super Israhel violando sabbatum"
      en: "Did not our fathers do these things, and our God brought all this evil upon us, and upon this city? And you bring more wrath upon Israel by violating the sabbath."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "factum est itaque cum quievissent portae Hierusalem die sabbati dixi et cluserunt ianuas et praecepi ut non aperirent eas usque post sabbatum et de pueris meis constitui super portas ut nullus inferret onus in die sabbati"
      en: "And it came to pass, that when the gates of Jerusalem were at rest on the sabbath day, I spoke: and they shut the gates, and I commanded that they should not open them till after the sabbath: and I set some of my servants at the gates, that none should bring in burthens on the sabbath day."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et manserunt negotiatores et vendentes universa venalia foris Hierusalem semel et bis"
      en: "So the merchants, and they that sold all kinds of wares, stayed without Jerusalem once or twice."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et contestatus sum eos et dixi eis quare manetis ex adverso muri si secundo hoc feceritis manum mittam in vos itaque ex tempore illo non venerunt in sabbato"
      en: "And I charged them, and I said to them: Why stay you before the wall? if you do so another time, I will lay hands on you. And from that time they came no more on the sabbath."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "dixi quoque Levitis ut mundarentur et venirent ad custodiendas portas et sanctificandum diem sabbati et pro hoc ergo memento mei Deus meus et parce mihi secundum multitudinem miserationum tuarum"
      en: "I spoke also to the Levites that they should be purified, and should come to keep the gates, and to sanctify the sabbath day: for this also remember me, O my God, and spare me according to the multitude of thy tender mercies."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sed et in diebus illis vidi Iudaeos ducentes uxores azotias ammanitidas et moabitidas"
      en: "In those days also I saw Jews that married wives, women of Azotus, and of Ammon, and of Moab."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et filii eorum ex media parte loquebantur azotice et nesciebant loqui iudaice et loquebantur iuxta linguam populi et populi"
      en: "And their children spoke half in the speech of Azotus, and could not speak the Jews' language, but they spoke according to the language of this and that people."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et obiurgavi eos et maledixi et cecidi ex ipsis viros et decalvavi eos et adiuravi in Deo ut non darent filias suas filiis eorum et non acciperent de filiabus eorum filiis suis et sibimet ipsis dicens"
      en: "And I chid them, and laid my curse upon them. And I beat some of them, and shaved off their hair, and made them swear by God that they would not give their daughters to their sons, nor take their daughters for their sons, nor for themselves, saying:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "numquid non in huiuscemodi re peccavit Salomon rex Israhel et certe in gentibus multis non erat rex similis ei et dilectus Deo suo erat et posuit eum Deus regem super omnem Israhel et ipsum ergo ad peccatum duxerunt mulieres alienigenae"
      en: "Did not Solomon king of Israel sin in this kind of thing? and surely among many nations, there was not a king like him, and he was beloved of his God, and God made him king over all Israel: m and yet women of other countries brought even him to sin."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "numquid et nos inoboedientes faciemus omne malum grande hoc ut praevaricemur in Deo nostro et ducamus uxores peregrinas"
      en: "And shall we also be disobedient and do all this great evil to transgress against our God, and marry strange women?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "de filiis autem Ioiada filii Eliasib sacerdotis magni gener erat Sanaballat Horonitis quem fugavi a me"
      en: "And one of the sons of Joiada the son of Eliasib the high priest, was son in law to Sanaballat the Horonite, and I drove him from me."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "recordare Domine Deus meus adversum eos qui polluunt sacerdotium iusque sacerdotale et leviticum"
      en: "Remember them, O Lord my God, that defile the priesthood, and the law of priests and Levites."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "igitur mundavi eos ab omnibus alienigenis et constitui ordines sacerdotum et Levitarum unumquemque in ministerio suo"
      en: "So I separated from them all strangers, and I appointed the courses of the priests and the Levites, every man in his ministry :"
    status: { la: verified, en: verified }
