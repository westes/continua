# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: eccl
chapter: 7
verses:
  - n: 1
    text:
      la: "Quid necesse est homini majora se quaerere, cum ignoret quid conducat sibi in vita sua, numero dierum peregrinationis suae, et tempore quod velut umbra praeterit? aut quis ei poterit indicare quod post eum futurum sub sole sit?"
      en: "What needeth a man to seek things that are above him, whereas he knoweth not what is profitable for him in his life, in all the days of his pilgrimage, and the time that passeth like a shadow? Or who can tell him what shall be after him under the sun?"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Melius est nomen bonum quam unguenta pretiosa, et dies mortis die nativitatis."
      en: "A good name is better than precious ointments: and the day of death than the day of one's birth."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Melius est ire ad domum luctus quam ad domum convivii; in illa enim finis cunctorum admonetur hominum, et vivens cogitat quid futurum sit."
      en: "It is better to go to the house of mourning, than to the house of feasting: for in that we are put in mind of the end of all, and the living thinketh what is to come."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Melior est ira risu, quia per tristitiam vultus corrigitur animus delinquentis."
      en: "Anger is better than laughter: because by the sadness of the countenance the mind of the offender is corrected."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cor sapientium ubi tristitia est, et cor stultorum ubi laetitia."
      en: "The heart of the wise is where there is mourning, and the heart of fools where there is mirth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Melius est a sapiente corripi, quam stultorum adulatione decipi;"
      en: "It is better to be rebuked by a wise man, than to be deceived by the flattery of fools."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quia sicut sonitus spinarum ardentium sub olla, sic risus stulti. Sed et hoc vanitas."
      en: "For as the crackling of thorns burning under a pot, so is the laughter of a fool: now this also is vanity."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Calumnia conturbat sapientem, et perdet robur cordis illius."
      en: "Oppression troubleth the wise, and shall destroy the strength of his heart."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Melior est finis orationis quam principium. Melior est patiens arrogante."
      en: "Better is the end of a speech than the beginning. Better is the patient man than the presumptuous."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ne sis velox ad irascendum, quia ira in sinu stulti requiescit."
      en: "Be not quickly angry: for anger resteth in the bosom of a fool."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ne dicas: Quid putas causae est quod priora tempora meliora fuere quam nunc sunt? stulta enim est hujuscemodi interrogatio."
      en: "Say not: What thinkest thou is the cause that former times were better than they are now? for this manner of question is foolish."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Utilior est sapientia cum divitiis, et magis prodest videntibus solem."
      en: "Wisdom with riches is more profitable, and bringeth more advantage to them that see the sun."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Sicut enim protegit sapientia, sic protegit pecunia; hoc autem plus habet eruditio et sapientia, quod vitam tribuunt possessori suo."
      en: "For as wisdom is a defence, so money is a defence: but learning and wisdom excel in this, that they give life to him that possesseth them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Considera opera Dei, quod nemo possit corrigere quem ille despexerit."
      en: "Consider the works of God, that no man can correct whom he hath despised."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "In die bona fruere bonis, et malam diem praecave; sicut enim hanc, sic et illam fecit Deus, ut non inveniat homo contra eum justas querimonias."
      en: "In the good day enjoy good things, and beware beforehand of the evil day: for God hath made both the one and the other, that man may not find against him any just complaint."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Haec quoque vidi in diebus vanitatis meae: justus perit in justitia sua, et impius multo vivit tempore in malitia sua."
      en: "These things also I saw in the days of my vanity: A just man perisheth in his justice, and a wicked man liveth a long time in his wickedness."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Noli esse justus multum, neque plus sapias quam necesse est, ne obstupescas."
      en: "Be not over just: and be not more wise than is necessary, lest thou become stupid."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ne impie agas multum, et noli esse stultus, ne moriaris in tempore non tuo."
      en: "Be not overmuch wicked: and be not foolish, lest thou die before thy time."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Bonum est te sustentare justum: sed et ab illo ne subtrahas manum tuam; quia qui timet Deum nihil negligit."
      en: "It is good that thou shouldst hold up the just, yea and from him withdraw not thy hand: for he that feareth God, neglecteth nothing."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Sapientia confortavit sapientem super decem principes civitatis;"
      en: "Wisdom hath strengthened the wise more than ten princes of the city."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non est enim homo justus in terra qui faciat bonum et non peccet."
      en: "For there is no just man upon earth, that doth good, and sinneth not."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Sed et cunctis sermonibus qui dicuntur ne accomodes cor tuum, ne forte audias servum tuum maledicentem tibi;"
      en: "But do not apply thy heart to all words that are spoken: lest perhaps thou hear thy servant reviling thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "scit enim conscientia tua quia et tu crebro maledixisti aliis."
      en: "For thy conscience knoweth that thou also hast often spoken evil of others."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Cuncta tentavi in sapientia. Dixi: Sapiens efficiar: et ipsa longius recessit a me,"
      en: "I have tried all things in wisdom. I have said: I will be wise: and it departed farther from me,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "multo magis quam erat. Et alta profunditas, quis inveniet eam?"
      en: "Much more than it was: it is a great depth, who shall find it out?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Lustravi universa animo meo, ut scirem et considerarem, et quaererem sapientiam, et rationem, et ut cognoscerem impietatem stulti, et errorem imprudentium:"
      en: "I have surveyed all things with my mind, to know, and consider, and seek out wisdom and reason: and to know the wickedness of the fool, and the error of the imprudent:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et inveni amariorem morte mulierem, quae laqueus venatorum est, et sagena cor ejus; vincula sunt manus illius. Qui placet Deo effugiet illam; qui autem peccator est capietur ab illa."
      en: "And I have found a woman more bitter than death, who is the hunter's snare, and her heart is a net, and her hands are bands. He that pleaseth God shall escape from her: but he that is a sinner, shall be caught by her."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Ecce hoc inveni, dixit Ecclesiastes, unum et alterum ut invenirem rationem,"
      en: "Lo this have I found, said Ecclesiastes, weighing one thing after another, that I might find out the account,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "quam adhuc quaerit anima mea, et non inveni. Virum de mille unum reperi; mulierem ex omnibus non inveni."
      en: "Which yet my soul seeketh, and I have not found it. One man among a thousand I have found, a woman among them all I have not found."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Solummodo hoc inveni, quod fecerit Deus hominem rectum, et ipse se infinitis miscuerit quaestionibus. Quis talis ut sapiens est? et quis cognovit solutionem verbi?"
      en: "Only this I have found, that God made man right, and he hath entangled himself with an infinity of questions. Who is as the wise man? and who hath known the resolution of the word?"
    status: { la: verified, en: verified }
