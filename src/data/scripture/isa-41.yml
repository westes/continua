# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 41
verses:
  - n: 1
    text:
      la: "Taceant ad me insulae, et gentes mutent fortitudinem; accedant, et tunc loquantur; simul ad judicium propinquemus."
      en: "Let the islands keep silence before me, and the nations take new strength: let them come near, and then speak, let us come near to judgment together."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quis suscitavit ab oriente Justum, vocavit eum ut sequeretur se? Dabit in conspectu ejus gentes, et reges obtinebit; dabit quasi pulverem gladio ejus, sicut stipulam vento raptam arcui ejus."
      en: "Who hath raised up the just one from the east, hath called him to follow him? he shall give the nations in his sight, and he shall rule over kings: he shall give them as the dust to his sword, as stubble driven by the wind, to his bow."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Persequetur eos, transibit in pace, semita in pedibus ejus non apparebit."
      en: "He shall pursue them, he shall pass in peace, no path shall appear after his feet."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Quia haec operatus est, et fecit, vocans generationes ab exordio? Ego Dominus, primus et novissimus ego sum."
      en: "Who hath wrought and done these things, calling the generations from the beginning? I the Lord, I am the first and the last."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Viderunt insulae, et timuerunt; extrema terrae obstupuerunt, appropinquaverunt, et accesserunt."
      en: "The islands saw it, and feared, the ends of the earth were astonished, they drew near, and came."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Unusquisque proximo suo auxiliabitur, et fratri suo dicet: Confortare."
      en: "Every one shall help his neighbour, and shall say to his brother: Be of good courage."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Confortavit faber aerarius percutiens malleo eum, qui cudebat tunc temporis, dicens: Glutino bonum est; et confortavit eum clavis, ut non moveretur."
      en: "The coppersmith striking with the hammer encouraged him that forged at that time, saying: It is ready for soldering: and he strengthened it with nails, that it should not be moved."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et tu, Israel, serve meus, Jacob quem elegi, semen Abraham amici mei:"
      en: "But thou Israel, art my servant, Jacob whom I have chosen, the seed of Abraham my friend:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "in quo apprehendi te ab extremis terrae, et a longinquis ejus vocavi te, et dixi tibi: Servus meus es tu, elegi te, et non abjeci te."
      en: "In whom I have taken thee from the ends of the earth, and from the remote parts thereof have called thee, and said to thee: Thou art my servant, I have chosen thee, and have not cast thee away."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ne timeas, quia ego tecum sum; ne declines, quia ego Deus tuus; confortavi te, et auxiliatus sum tibi, et suscepit te dextera Justi mei."
      en: "Fear not, for I am with thee: turn not aside, for I am thy God: I have strengthened thee, and have helped thee, and the right hand of my just one hath upheld thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ecce confundentur et erubescent omnes qui pugnant adversum te; erunt quasi non sint, et peribunt viri qui contradicunt tibi."
      en: "Behold all that fight against thee shall be confounded and ashamed, they shall be as nothing, and the men shall perish that strive against thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quaeres eos, et non invenies, viros rebelles tuos; erunt quasi non sint, et veluti consumptio homines bellantes adversum te."
      en: "Thou shalt seek them, and shalt not find the men that resist thee: they shall be as nothing: and as a thing consumed the men that war against thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quia ego Dominus Deus tuus, apprehendens manum tuam, dicensque tibi: Ne timeas; ego adjuvi te."
      en: "For I am the Lord thy God, who take thee by the hand, and say to thee: Fear not, I have helped thee."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Noli timere, vermis Jacob, qui mortui estis ex Israel; ego auxiliatus sum tibi, dicit Dominus, et redemptor tuus Sanctus Israel."
      en: "Fear not, thou worm of Jacob, you that are dead of Israel: I have helped thee, saith the Lord: and thy Redeemer the Holy One of Israel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ego posui te quasi plaustrum triturans novum, habens rostra serrantia; triturabis montes, et comminues, et colles quasi pulverem pones."
      en: "I have made thee as a new thrashing wain, with teeth like a saw: thou shall thrash the mountains, and break them in pieces: and shalt make the hills as chaff."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ventilabis eos, et ventus tollet, et turbo disperget eos; et tu exsultabis in Domino, in Sancto Israel laetaberis."
      en: "Thou shalt fan them, and the wind shall carry them away, and the whirlwind shall scatter them: and thou shalt rejoice in the Lord, in the Holy One of Israel thou shalt be joyful."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Egeni et pauperes quaerunt aquas, et non sunt; lingua eorum siti aruit. Ego Dominus exaudiam eos, Deus Israel, non derelinquam eos."
      en: "The needy and the poor seek for waters, and there are none: their tongue hath been dry with thirst. I the Lord will hear them, I the God of Israel will not forsake them."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Aperiam in supinis collibus flumina, et in medio camporum fontes, ponam desertum in stagna aquarum, et terram inviam in rivos aquarum."
      en: "I will open rivers in the high hills, and fountains in the midst of the plains: I will turn the desert into pools of waters, and the impassable land into streams of waters."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Dabo in solitudinem cedrum, et spinam, et myrtum, et lignum olivae; ponam in deserto abietem, ulmum, et buxum simul;"
      en: "I will plant in the wilderness the cedar, and the thorn, and the myrtle, and the olive tree: I will set in the desert the fir tree, the elm, and the box tree together:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ut videant et sciant, et recogitent, et intelligant pariter, quia manus Domini fecit hoc, et Sanctus Israel creavit illud."
      en: "That they may see and know, and consider, and understand together that the hand of the Lord hath done this, and the Holy One of Israel hath created it."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Prope facite judicium vestrum, dicit Dominus; afferte, si quid forte habetis, dicit rex Jacob."
      en: "Bring your cause near, saith the Lord: bring hither, if you have any thing to allege, saith the King of Jacob."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Accedant, et nuntient nobis quaecumque ventura sunt; priora quae fuerunt nuntiate; et ponemus cor nostrum, et sciemus novissima eorum; et quae ventura sunt indicate nobis."
      en: "Let them come, and tell us all things that are to come: tell us the former things what they were: and we will set our heart upon them, and shall know the latter end of them, and tell us the things that are to come."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Annuntiate quae ventura sunt in futurum, et sciemus quia dii estis vos; bene quoque aut male, si potestis, facite; et loquamur et videamus simul."
      en: "Shew the things that are to come hereafter, and we shall know that ye are gods. Do ye also good or evil, if you can: and let us speak, and see together."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ecce vos estis ex nihilo, et opus vestrum ex eo quod non est; abominatio est qui elegit vos."
      en: "Behold, you are of nothing, and your work of that which hath no being: he that hath chosen you is an abomination."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Suscitavi ab aquilone, et veniet ab ortu solis; vocabit nomen meum; et adducet magistratus quasi lutum, et velut plastes conculcans humum."
      en: "I have raised up one from the north, and he shall come from the rising of the sun: he shall call upon my name, and he shall make princes to be as dirt, and as the potter treading clay."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Quis annuntiavit ab exordio ut sciamus, et a principio ut dicamus: Justus es? Non est neque annuntians, neque praedicens, neque audiens sermones vestros."
      en: "Who hath declared from the beginning, that we may know: and from time of old, that we may say: Thou art just. There is none that sheweth, nor that foretelleth, nor that heareth your words."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Primus ad Sion dicet: Ecce adsunt, et Jerusalem evangelistam dabo."
      en: "The first shall say to Sion: Behold they are here, and to Jerusalem I will give an evangelist."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et vidi, et non erat neque ex istis quisquam qui iniret consilium, et interrogatus responderet verbum."
      en: "And I saw, and there was no one even among them to consult, or who, when I asked, could answer a word."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Ecce omnes injusti et vana opera eorum; ventus et inane simulacra eorum."
      en: "Behold they are all in the wrong, and their works are vain: their idols are wind and vanity."
    status: { la: verified, en: verified }
