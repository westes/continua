# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: job
chapter: 14
verses:
  - n: 1
    text:
      la: "homo natus de muliere brevi vivens tempore repletus multis miseriis"
      en: "Man born of a woman, living for a short time, is filled with many miseries."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quasi flos egreditur et conteritur et fugit velut umbra et numquam in eodem statu permanet"
      en: "Who cometh forth like a flower, and is destroyed, and fleeth as a shadow, and never continueth in the same state."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dignum ducis super huiuscemodi aperire oculos tuos et adducere eum tecum in iudicium"
      en: "And dost thou think it meet to open thy eyes upon such an one, and to bring him into judgment with thee?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quis potest facere mundum de inmundo conceptum semine nonne tu qui solus es"
      en: "Who can make him clean that is conceived of unclean seed ? is it not thou who only art?"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "breves dies hominis sunt numerus mensuum eius apud te est constituisti terminos eius qui praeterire non poterunt"
      en: "The days of man are short, and the number of his months is with thee: thou hast appointed his bounds which cannot be passed."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "recede paululum ab eo ut quiescat donec optata veniat sicut mercennarii dies eius"
      en: "Depart a little from him, that he may rest, until his wished for day come, as that of the hireling."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "lignum habet spem si praecisum fuerit rursum virescit et rami eius pullulant"
      en: "A tree hath hope: if it be cut, it groweth green again, and the boughs thereof sprout."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "si senuerit in terra radix eius et in pulvere emortuus fuerit truncus illius"
      en: "If its root be old in the earth, and its stock be dead in the dust:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ad odorem aquae germinabit et faciet comam quasi cum primum plantatum est"
      en: "At the scent of water, it shall spring, and bring forth leaves, as when it was first planted."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "homo vero cum mortuus fuerit et nudatus atque consumptus ubi quaeso est"
      en: "But man when he shall be dead, and stripped and consumed, I pray you where is he?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "quomodo si recedant aquae de mari et fluvius vacuefactus arescat"
      en: "As if the waters should depart out of the sea, and an emptied river should be dried up:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "sic homo cum dormierit non resurget donec adteratur caelum non evigilabit nec consurget de somno suo"
      en: "So man when he is fallen asleep shall not rise again; till the heavens be broken, he shall not awake, nor rise up out of his sleep."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quis mihi hoc tribuat ut in inferno protegas me ut abscondas me donec pertranseat furor tuus et constituas mihi tempus in quo recorderis mei"
      en: "Who will grant me this, that thou mayest protect me in hell, and hide me till thy wrath pass, and appoint me a. time when thou wilt remember me?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "putasne mortuus homo rursum vivet cunctis diebus quibus nunc milito expecto donec veniat inmutatio mea"
      en: "Shall man that is dead, thinkest thou, live again? all the days in which I am now in warfare, I expect until my change come."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vocabis et ego respondebo tibi operi manuum tuarum porriges dexteram"
      en: "Thou shalt call me, and I will answer thee: to the work of thy hands thou shalt reach out thy right hand."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tu quidem gressus meos dinumerasti sed parces peccatis meis"
      en: "Thou indeed hast numbered my steps, but spare my sins."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "signasti quasi in sacculo delicta mea sed curasti iniquitatem meam"
      en: "Thou hast sealed up my offences as it were in a bag, but hast cured my iniquity."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "mons cadens defluet et saxum transfertur de loco suo"
      en: "A mountain falling cometh to nought, and a rock is removed out of its place."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "lapides excavant aquae et adluvione paulatim terra consumitur et homines ergo similiter perdes"
      en: "Waters wear away the stones, and with inundation the ground by little and little is washed away: so in like manner thou shalt destroy man."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "roborasti eum paululum ut in perpetuum pertransiret inmutabis faciem eius et emittes eum"
      en: "Thou hast strengthened him for a little while, that he may pass away for ever: thou shalt change his face, and shalt send him away."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "sive nobiles fuerint filii eius sive ignobiles non intelleget"
      en: "Whether his children come to honour or dishonour, he shall not understand."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "attamen caro eius dum vivet dolebit et anima illius super semet ipso lugebit"
      en: "But yet his flesh, while he shall live, shall have pain, and his soul shall mourn over him."
    status: { la: verified, en: verified }
