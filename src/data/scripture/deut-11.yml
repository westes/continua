# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 11
verses:
  - n: 1
    text:
      la: "Ama itaque Dominum Deum tuum, et observa praecepta ejus et caeremonias, judicia atque mandata, omni tempore."
      en: "Therefore love the Lord thy God and observe his precepts and ceremonies, his judgments and commandments at all times."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cognoscite hodie quae ignorant filii vestri, qui non viderunt disciplinam Domini Dei vestri, magnalia ejus et robustam manum, extentumque brachium,"
      en: "Know this day the things that your children know not, who saw not the chastisements of the Lord your God, his great doings and strong hand, and stretched out arm,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "signa et opera quae fecit in medio Aegypti Pharaoni regi, et universae terrae ejus,"
      en: "The signs and works which he did in the midst of Egypt to king Pharao, and to all his land,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "omnique exercitui Aegyptiorum, et equis ac curribus: quomodo operuerint eos aquae maris Rubri, cum vos persequerentur, et deleverit eos Dominus usque in praesentem diem:"
      en: "And to all the host of the Egyptians, and to their horses and chariots: how the waters of the Red Sea covered them, when they pursued you, and how the Lord destroyed them until this present day:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "vobisque quae fecerit in solitudine donec veniretis ad hunc locum:"
      en: "And what he hath done to you in the wilderness, till you came to this place:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et Dathan atque Abiron filiis Eliab, qui fuit filius Ruben: quos aperto ore suo terra absorbuit, cum domibus et tabernaculis, et universa substantia eorum, quam habebant in medio Israel."
      en: "And to Dathan and Abiron the sons of Eliab, who was the son of Ruben: whom the earth, opening her mouth swallowed up with their households and tents, and all their substance, which they had in the midst of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Oculi vestri viderunt opera Domini magna quae fecit,"
      en: "Your eyes have seen all the great works of the Lord, that he hath done,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ut custodiatis universa mandata illius, quae ego hodie praecipio vobis, et possitis introire, et possidere terram, ad quam ingredimini,"
      en: "That you may keep all his commandments, which I command you this day, and may go in, and possess the land, to which you are entering,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "multoque in ea vivatis tempore: quam sub juramento pollicitus est Dominus patribus vestris, et semini eorum, lacte et melle manantem."
      en: "And may live in it a long time: which the Lord promised by oath to your fathers, and to their seed, a land which floweth with milk and honey."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Terra enim, ad quam ingrederis possidendam, non est sicut terra Aegypti, de qua existi, ubi jacto semine in hortorum morem aquae ducuntur irriguae:"
      en: "For the land, which thou goest to possess, is not like the land of Egypt, from whence thou camest out, where, when the seed is sown, waters are brought in to water it after the manner of gardens."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sed montuosa est et campestris, de caelo expectans pluvias,"
      en: "But it is a land of hills and plains, expecting rain from heaven."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quam Dominus Deus tuus semper invisit, et oculi illius in ea sunt a principio anni usque ad finem ejus."
      en: "And the Lord thy God doth always visit it, and his eyes are on it from the beginning of the year unto the end thereof."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si ergo obedieritis mandatis meis, quae ego hodie praecipio vobis, ut diligatis Dominum Deum vestrum, et serviatis ei in toto corde vestro, et in tota anima vestra:"
      en: "If then you obey my commandments, which I command you this day, that you love the Lord your God, and serve him with all your heart, and with all your soul:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dabit pluviam terrae vestrae temporaneam et serotinam, ut colligatis frumentum, et vinum, et oleum,"
      en: "He will give to your land the early rain and the latter rain, that you may gather in your corn, and your wine, and your oil,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "foenumque ex agris ad pascenda jumenta, et ut ipsi comedatis ac saturemini."
      en: "And your hay out of the fields to feed your cattle, and that you may eat and be filled."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cavete ne forte decipiatur cor vestrum, et recedatis a Domino, serviatisque diis alienis, et adoretis eos:"
      en: "Beware lest perhaps your heart be deceived, and you depart from the Lord, and serve strange gods, and adore them:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "iratusque Dominus claudat caelum, et pluviae non descendant, nec terra det germen suum, pereatisque velociter de terra optima, quam Dominus daturus est vobis."
      en: "And the Lord being angry shut up heaven, that the rain come not down, nor the earth yield her fruit, and you perish quickly from the excellent land, which the Lord will give you."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ponite haec verba mea in cordibus et in animis vestris, et suspendite ea pro signo in manibus, et inter oculos vestros collocate."
      en: "Lay up these my words in your hearts and minds, and hang them for a sign on your hands, and place them between your eyes."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Docete filios vestros ut illa meditentur: quando sederis in domo tua, et ambulaveris in via, et accubueris atque surrexeris."
      en: "Teach your children that they meditate on them, when thou sittest in thy house, and when thou walkest on the way, and when thou liest down and risest up."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Scribes ea super postes et januas domus tuae,"
      en: "Thou shalt write them upon the posts and the doors of thy house:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ut multiplicentur dies tui, et filiorum tuorum in terra, quam juravit Dominus patribus tuis, ut daret eis quamdiu caelum imminet terrae."
      en: "That thy days may be multiplied, and the days of thy children in the land which the Lord swore to thy fathers, that he would give them as long as the heaven hangeth over the earth."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Si enim custodieritis mandata quae ego praecipio vobis, et feceritis ea, ut diligatis Dominum Deum vestrum, et ambuletis in omnibus viis ejus, adhaerentes ei,"
      en: "For if you keep the commandments which I command you, and do them, to love the Lord your God, and walk in all his ways, cleaving unto him,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "disperdet Dominus omnes gentes istas ante faciem vestram, et possidebitis eas, quae majores et fortiores vobis sunt."
      en: "The Lord will destroy all these nations before your face, and you shall possess them, which are greater and stronger than you."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Omnis locus, quem calcaverit pes vester, vester erit. A deserto, et a Libano, a flumine magno Euphrate usque ad mare occidentale erunt termini vestri."
      en: "Every place, that your foot shall tread upon, shall be yours. From the desert, and from Libanus, from the great river Euphrates unto the western sea shall be your borders."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Nullus stabit contra vos: terrorem vestrum et formidinem dabit Dominus Deus vester super omnem terram quam calcaturi estis, sicut locutus est vobis."
      en: "None shall stand against you: the Lord your God shall lay the dread and fear of you upon all the land that you shall tread upon, as he hath spoken to you."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "En propono in conspectu vestro hodie benedictionem et maledictionem:"
      en: "Behold I set forth in your sight this day a blessing and a curse:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "benedictionem, si obedieritis mandatis Domini Dei vestri, quae ego hodie praecipio vobis:"
      en: "A blessing, if you obey the commandments of the Lord your God, which I command you this day:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "maledictionem, si non obedieritis mandatis Domini Dei vestri, sed recesseritis de via, quam ego nunc ostendo vobis, et ambulaveritis post deos alienos, quos ignoratis."
      en: "A curse, if you obey not the commandments of the Lord your God, but revolt from the way which now I shew you, and walk after strange gods which you know not."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cum vero introduxerit te Dominus Deus tuus in terram, ad quam pergis habitandam, pones benedictionem super montem Garizim, maledictionem super montem Hebal:"
      en: "And when the Lord thy God shall have brought thee into the land, whither thou goest to dwell, thou shalt put the blessing upon mount Garizim, the curse upon mount Hebal:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "qui sunt trans Jordanem, post viam quae vergit ad solis occubitum in terra Chananaei, qui habitat in campestribus contra Galgalam, quae est juxta vallem tendentem et intrantem procul."
      en: "Which are beyond the Jordan, behind the way that goeth to the setting of the sun, in the land of the Chanaanite who dwelleth in the plain country over against Galgala, which is near the valley that reacheth and entereth far."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Vos enim transibitis Jordanem, ut possideatis terram quam Dominus Deus vester daturus est vobis, ut habeatis et possideatis illam."
      en: "For you shall pass over the Jordan, to possess the land, which the Lord your God will give you, that you may have it and possess it."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Videte ergo ut impleatis caeremonias atque judicia, quae ego hodie ponam in conspectu vestro."
      en: "See therefore that you fulfill the ceremonies and judgments, which I shall set this day before you."
    status: { la: verified, en: verified }
