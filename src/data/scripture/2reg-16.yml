# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2reg
chapter: 16
verses:
  - n: 1
    text:
      la: "Cumque David transisset paululum montis verticem, apparuit Siba puer Miphiboseth in occursum ejus, cum duobus asinis, qui onerati erant ducentis panibus, et centum alligaturis uvae passae, et centum massis palatharum, et utre vini."
      en: "And when David was a little past the top of the hill, behold Siba the servant of Miphiboseth came to meet him with two asses, laden with two hundred loaves of bread, and a hundred bunches of raisins, a hundred cakes of figs, and a vessel of wine."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et dixit rex Sibae: Quid sibi volunt haec? Responditque Siba: Asini, domesticis regis ut sedeant: panes et palathae ad vescendum pueris tuis: vinum autem ut bibat si quis defecerit in deserto."
      en: "And the king said to Siba: What mean these things? And Siba answered: The asses are for the king's household to sit on: and the loaves and the figs for thy servants to eat, and the wine to drink if any man be faint in the desert."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et ait rex: Ubi est filius domini tui? Responditque Siba regi: Remansit in Jerusalem, dicens: Hodie restituet mihi domus Israel regnum patris mei."
      en: "And the king said: Where is thy master's son? And Siba answered the king: He remained in Jerusalem, saying: Today will the house of Israel restore me the kingdom of my father."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et ait rex Sibae: Tua sint omnia quae fuerunt Miphiboseth. Dixitque Siba: Oro ut inveniam gratiam coram te, domine mi rex."
      en: "And the king said to Siba: I give thee all that belonged to Miphiboseth. And Siba said: I beseech thee let me find grace before thee, my lord, O king."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Venit ergo rex David usque Bahurim: et ecce egrediebatur inde vir de cognatione domus Saul, nomine Semei, filius Gera, procedebatque egrediens, et maledicebat,"
      en: "And king David came as far as Bahurim: and behold there came out from thence a man of the kindred of the house of Saul named Semei, the son of Gera, and coming out he cursed as he went on,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "mittebatque lapides contra David, et contra universos servos regis David: omnis autem populus, et universi bellatores a dextro et a sinistro latere regis incedebant."
      en: "And he threw stones at David, and at all the servants of king David: and all the people, and all the warriors walked on the right, and on the left side of the king."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ita autem loquebatur Semei cum malediceret regi: Egredere, egredere vir sanguinum, et vir Belial."
      en: "And thus said Semei when he cursed the king: Come out, come out, thou man of blood, and thou man of Belial."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Reddidit tibi Dominus universum sanguinem domus Saul: quoniam invasisti regnum pro eo, et dedit Dominus regnum in manu Absalom filii tui, et ecce premunt te mala tua, quoniam vir sanguinum es."
      en: "The Lord hath repaid thee for all the blood of the house of Saul: because thou hast usurped the kingdom in his stead, and the Lord hath given the kingdom into the hand of Absalom thy son: and behold thy evils press upon thee, because thou art a man of blood."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dixit autem Abisai filius Sarviae regi: Quare maledicit canis hic mortuus domino meo regi? vadam, et amputabo caput ejus."
      en: "And Abisai the son of Sarvia said to the king: Why should this dead dog curse my lord the king? I will go, and cut off his head."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ait rex: Quid mihi et vobis est filii Sarviae? dimittite eum, ut maledicat: Dominus enim praecepit ei ut malediceret David: et quis est qui audeat dicere, quare sic fecerit?"
      en: "And the king said: What have I to do with you, ye sons of Sarvia? Let him alone and let him curse: for the Lord hath bid him curse David: and who is he that shall dare say, why hath he done so?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et ait rex Abisai, et universis servis suis: Ecce filius meus, qui egressus est de utero meo, quaerit animam meam: quanto magis nunc filius Jemini? Dimittite eum ut maledicat juxta praeceptum Domini:"
      en: "And the king said to Abisai, and to all his servants: Behold my son, who came forth from my bowels, seeketh my life: how much more now a son of Jemini? let him alone that he may curse as the Lord hath bidden him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "si forte respiciat Dominus afflictionem meam, et reddat mihi Dominus bonum pro maledictione hac hodierna."
      en: "Perhaps the Lord may look upon my affliction, and the Lord may render me good for the cursing of this day."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ambulabat itaque David et socii ejus per viam cum eo. Semei autem per jugum montis ex latere, contra illum gradiebatur, maledicens, et mittens lapides adversum eum, terramque spargens."
      en: "And David and his men with him went by the way. And Semei by the hill's side went over against him, cursing, and casting stones at him, and scattering earth."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Venit itaque rex, et universus populus cum eo lassus, et refocillati sunt ibi."
      en: "And the king and all the people with him came weary, and refreshed themselves there."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Absalom autem et omnis populus ejus ingressi sunt Jerusalem, sed et Achitophel cum eo."
      en: "But Absalom and all his people came into Jerusalem, and Achitophel was with him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cum autem venisset Chusai Arachites amicus David ad Absalom, locutus est ad eum: Salve rex, salve rex."
      en: "And when Chusai the Arachite, David's friend, was come to Absalom, he said to him: God save thee, O king, God save thee, O king."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ad quem Absalom: Haec est, inquit, gratia tua ad amicum tuum? quare non ivisti cum amico tuo?"
      en: "And Absalom said to him: Is this thy kindness to thy friend? Why wentest thou not with thy friend?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Responditque Chusai ad Absalom: Nequaquam: quia illius ero, quem elegit Dominus, et omnis hic populus, et universus Israel, et cum eo manebo."
      en: "And Chusai answered Absalom: Nay: for I will be his, whom the Lord hath chosen, and all this people, and all Israel, and with him will I abide."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sed ut et hoc inferam, cui ego serviturus sum? nonne filio regis? Sicut parui patri tuo, ita parebo et tibi."
      en: "Besides this, whom shall I serve? is it not the king's son? as I have served thy father, so will I serve thee also."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Dixit autem Absalom ad Achitophel: Inite consilium quid agere debeamus."
      en: "And Absalom said to Achitophel: Consult what we are to do."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et ait Achitophel ad Absalom: Ingredere ad concubinas patris tui, quas dimisit ad custodiendam domum: ut cum audierit omnis Israel quod foedaveris patrem tuum, roborentur tecum manus eorum."
      en: "And Achitophel said to Absalom: Go in to the concubines of thy father, whom he hath left to keep the house: that when all Israel shall hear that thou hast disgraced thy father, their hands may be strengthened with thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Tetenderunt ergo Absalom tabernaculum in solario, ingressusque est ad concubinas patris sui coram universo Israel."
      en: "So they spread a tent for Absalom on the top of the house, and he went in to his father's concubines before all Israel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Consilium autem Achitophel, quod dabat in diebus illis, quasi si quis consuleret Deum: sic erat omne consilium Achitophel, et cum esset cum David, et cum esset cum Absalom."
      en: "Now the counsel of Achitophel, which he gave in those days, was as if a man should consult God: so was all the counsel of Achitophel, both when he was with David, and when he was with Absalom."
    status: { la: verified, en: verified }
