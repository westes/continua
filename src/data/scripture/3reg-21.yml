# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 3reg
chapter: 21
verses:
  - n: 1
    text:
      la: "Post verba autem haec, tempore illo vinea erat Naboth Jezrahelitae, quae erat in Jezrahel, juxta palatium Achab regis Samariae."
      en: "And after these things, Naboth the Jezrahelite, who was in Jezrahel, had at that time a vineyard near the palace of Achab king of Samaria."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Locutus est ergo Achab ad Naboth, dicens: Da mihi vineam tuam, ut faciam mihi hortum olearum, quia vicina est, et prope domum meam, daboque tibi pro ea vineam meliorem: aut si commodius tibi putas, argenti pretium, quanto digna est."
      en: "And Achab spoke to Naboth, saying: Give me thy vineyard, that I may make me a garden of herbs, because it is nigh, and adjoining to my house, and I will give thee for it a better vineyard: or if thou think it more convenient for thee, I will give thee the worth of it in money."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cui respondit Naboth: Propitius sit mihi Dominus, ne dem haereditatem patrum meorum tibi."
      en: "Naboth answered him: The Lord be merciful to me, and not let me give thee the inheritance of my fathers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Venit ergo Achab in domum suam indignans, et frendens super verbo, quod locutus fuerat ad eum Naboth Jezrahelites, dicens: Non dabo tibi haereditatem patrum meorum. Et projiciens se in lectulum suum, avertit faciem suam ad parietem, et non comedit panem."
      en: "And Achab came into his house angry and fretting, because of the word that Naboth the Jezrahelite had spoken to him, saying: I will not give thee the inheritance of my fathers. And casting himself upon his bed, he turned away his face to the wall, and would eat no bread."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ingressa est autem ad eum Jezabel uxor sua, dixitque ei: Quid est hoc, unde anima tua contristata est? et quare non comedis panem?"
      en: "And Jezabel his wife went in to him, and said to him: What is the matter that thy soul is so grieved? and why eatest thou no bread?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui respondit ei: Locutus sum Naboth Jezrahelitae, et dixi ei: Da mihi vineam tuam, accepta pecunia: aut, si tibi placet, dabo tibi vineam meliorem pro ea. Et ille ait: Non dabo tibi vineam meam."
      en: "And he answered her: I spoke to Naboth the Jezrahelite, and said to him: Give me thy vineyard, and take money for it: or if it please thee, I will give thee a better vineyard for it. And he said: I will not give thee my vineyard."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dixit ergo ad eum Jezabel uxor ejus: Grandis auctoritatis es, et bene regis regnum Israel. Surge, et comede panem, et aequo animo esto, ego dabo tibi vineam Naboth Jezrahelitae."
      en: "Then Jezabel his wife said to him: Thou art of great authority indeed, and governest well the kingdom of Israel. Arise, and eat bread, and be of good cheer, I will give thee the vineyard of Naboth the Jezrahelite."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Scripsit itaque litteras ex nomine Achab, et signavit eas annulo ejus, et misit ad majores natu, et optimates, qui erant in civitate ejus, et habitabant cum Naboth."
      en: "So she wrote letter's in Achab's name, and sealed them with his ring, and sent them to the ancients, and the chief men that were in his city, and that dwelt with Naboth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Litterarum autem haec erat sententia: Praedicate jejunium, et sedere facite Naboth inter primos populi,"
      en: "And this was the tenor of the letters: Proclaim a fast, and make Naboth sit among the chief of the people,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et submittite duos viros filios Belial contra eum, et falsum testimonium dicant: Benedixit Deum et regem: et educite eum, et lapidate, sicque moriatur."
      en: "And suborn two men, sons of Belial against him, and let them bear false witness: that he hath blasphemed God and the king: and then carry him out, and stone him, and so let him die."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Fecerunt ergo cives ejus majores natu et optimates, qui habitabant cum eo in urbe, sicut praeceperat eis Jezabel, et sicut scriptum erat in litteris quas miserat ad eos:"
      en: "And the men of his city, the ancients and nobles, that dwelt with him in the city, did as Jezabel had commanded them, and as it was written in the letters which she had sent to them:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "praedicaverunt jejunium, et sedere fecerunt Naboth inter primos populi."
      en: "They proclaimed a fast, and made Naboth sit among the chief of the people."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et adductis duobus viris filiis diaboli, fecerunt eos sedere contra eum: at illi, scilicet ut viri diabolici, dixerunt contra eum testimonium coram multitudine: Benedixit Naboth Deum et regem: quam ob rem eduxerunt eum extra civitatem, et lapidibus interfecerunt."
      en: "And bringing two men, sons of the devil, they made them sit against him: and they, like men of the devil, bore witness against him before the people, saying: Naboth hath blasphemed God and the king: wherefore they brought him forth without the city, and stoned him to death."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Miseruntque ad Jezabel, dicentes: Lapidatus est Naboth, et mortuus est."
      en: "And they sent to Jezabel, saying: Naboth is stoned, and is dead."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Factum est autem, cum audisset Jezabel lapidatum Naboth, et mortuum, locuta est ad Achab: Surge, et posside vineam Naboth Jezrahelitae, qui noluit tibi acquiescere, et dare eam accepta pecunia: non enim vivit Naboth, sed mortuus est."
      en: "And it came to pass when Jezabel heard that Naboth was stoned, and dead, that she said to Achab: Arise and take possession of the vineyard of Naboth the Jezrahelite, who would not agree with thee, and give it thee for money: for Naboth is not alive, but dead."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Quod cum audisset Achab, mortuum videlicet Naboth, surrexit, et descendebat in vineam Naboth Jezrahelitae, ut possideret eam."
      en: "And when Achab heard this, to wit, that Naboth was dead, he arose, and went down to the vineyard of Naboth the Jezrahelite, to take possession of it."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Factum est igitur sermo Domini ad Eliam Thesbiten, dicens:"
      en: "And the word of the Lord came to Elias the Thesbite, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Surge, et descende in occursum Achab regis Israel, qui est in Samaria: ecce ad vineam Naboth descendit, ut possideat eam:"
      en: "Arise, and go down to meet Achab king of Israel, who is in Samaria: behold he is going down to the vineyard of Naboth, to take possession of it:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et loqueris ad eum, dicens: Haec dicit Dominus: Occidisti, insuper et possedisti. Et post haec addes: Haec dicit Dominus: In loco hoc, in quo linxerunt canes sanguinem Naboth, lambent quoque sanguinem tuum."
      en: "And thou shalt speak to him, saying: Thus saith the Lord: Thou hast slain, moreover also thou hast taken possession. And after these words thou shalt add: Thus saith the Lord: In this place, wherein the dogs have licked the blood of Naboth, they shall lick thy blood also."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et ait Achab ad Eliam: Num invenisti me inimicum tibi? Qui dixit: Inveni, eo quod venundatus sis, ut faceres malum in conspectu Domini."
      en: "And Achab said to Elias: Hast thou found me thy enemy? He said: I have found thee, because thou art sold, to do evil in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ecce ego inducam super te malum, et demetam posteriora tua, et interficiam de Achab mingentem ad parietem, et clausum et ultimum in Israel."
      en: "Behold I will bring evil upon thee, and I will cut down thy posterity, and I will kill of Achab him that pisseth against the wall, and him that is shut up, and the last in Israel."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et dabo domum tuam sicut domum Jeroboam filii Nabat, et sicut domum Baasa filii Ahia: quia egisti, ut me ad iracundiam provocares, et peccare fecisti Israel."
      en: "And I will make thy house like the house of Jeroboam the son of Nabat, and like the house of Baasa the son of Ahias: for what thou hast done, to provoke me to anger, and for making Israel to sin."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Sed et de Jezabel locutus est Dominus, dicens: Canes comedent Jezabel in agro Jezrahel."
      en: "And of Jezabel also the Lord spoke, saying: The dogs shall eat Jezabel in the field of Jezrahel."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Si mortuus fuerit Achab in civitate, comedent eum canes: si autem mortuus fuerit in agro, comedent eum volucres caeli."
      en: "If Achab die in the city, the dogs shall eat him: but if he die in the field, the birds of the air shall eat him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Igitur non fuit alter talis sicut Achab, qui venundatus est ut faceret malum in conspectu Domini: concitavit enim eum Jezabel uxor sua,"
      en: "Now there was not such another as Achab, who was sold to do evil in the sight of the Lord: for his wife Jezabel set him on,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et abominabilis factus est, in tantum ut sequeretur idola, quae fecerant Amorrhaei, quos consumpsit Dominus a facie filiorum Israel."
      en: "And he became abominable, insomuch that he followed the idols which the Amorrhites had made, whom the Lord destroyed before the face of the children of Israel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Itaque cum audisset Achab sermones istos, scidit vestimenta sua, et operuit cilicio carnem suam, jejunavitque et dormivit in sacco, et ambulavit demisso capite."
      en: "And when Achab had heard these words, he rent his garments, and put haircloth upon his flesh, and fasted and slept in sackcloth, and walked with his head cast down."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et factus est sermo Domini ad Eliam Thesbiten, dicens:"
      en: "And the word of the Lord came to Elias the Thesbite, saying:"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Nonne vidisti humiliatum Achab coram me? quia igitur humiliatus est mei causa, non inducam malum in diebus ejus, sed in diebus filii sui inferam malum domui ejus."
      en: "Hast thou not seen Achab humbled before me? therefore, because he hath humbled himself for my sake, I will not bring the evil in his days, but in his son's days will I bring the evil upon his house."
    status: { la: verified, en: verified }
