# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: matt
chapter: 2
verses:
  - n: 1
    text:
      la: "Cum ergo natus esset Jesus in Bethlehem Juda in diebus Herodis regis, ecce magi ab oriente venerunt Jerosolymam,"
      en: "When Jesus therefore was born in Bethlehem of Juda, in the days of king Herod, behold, there came wise men from the east to Jerusalem."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "dicentes: Ubi est qui natus est rex Judaeorum? vidimus enim stellam ejus in oriente, et venimus adorare eum."
      en: "Saying, Where is he that is born king of the Jews? For we have seen his star in the east, and are come to adore him."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Audiens autem Herodes rex, turbatus est, et omnis Jerosolyma cum illo."
      en: "And king Herod hearing this, was troubled, and all Jerusalem with him."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et congregans omnes principes sacerdotum, et scribas populi, sciscitabatur ab eis ubi Christus nasceretur."
      en: "And assembling together all the chief priests and the scribes of the people, he inquired of them where Christ should be born."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "At illi dixerunt: In Bethlehem Judae: sic enim scriptum est per prophetam:"
      en: "But they said to him: In Bethlehem of Juda. For so it is written by the prophet:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et tu Bethlehem terra Juda, nequaquam minima es in principibus Juda: ex te enim exiet dux, qui regat populum meum Israel."
      en: "And thou Bethlehem the land of Juda art not the least among the princes of Juda: for out of thee shall come forth the captain that shall rule my people Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tunc Herodes clam vocatis magis diligenter didicit ab eis tempus stellae, quae apparuit eis:"
      en: "Then Herod, privately calling the wise men, learned diligently of them the time of the star which appeared to them;"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et mittens illos in Bethlehem, dixit: Ite, et interrogate diligenter de puero: et cum inveneritis, renuntiate mihi, ut et ego veniens adorem eum."
      en: "And sending them into Bethlehem, said: Go and diligently inquire after the child, and when you have found him, bring me word again, that I also may come to adore him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Qui cum audissent regem, abierunt, et ecce stella, quam viderant in oriente, antecedebat eos, usque dum veniens staret supra, ubi erat puer."
      en: "Who having heard the king, went their way; and behold the star which they had seen in the east, went before them, until it came and stood over where the child was."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Videntes autem stellam gavisi sunt gaudio magno valde."
      en: "And seeing the star they rejoiced with exceeding great joy."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et intrantes domum, invenerunt puerum cum Maria matre ejus, et procidentes adoraverunt eum: et apertis thesauris suis obtulerunt ei munera, aurum, thus, et myrrham."
      en: "And entering into the house, they found the child with Mary his mother, and falling down they adored him; and opening their treasures, they offered him gifts; gold, frankincense, and myrrh."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et responso accepto in somnis ne redirent ad Herodem, per aliam viam reversi sunt in regionem suam."
      en: "And having received an answer in sleep that they should not return to Herod, they went back another way into their country."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Qui cum recessissent, ecce angelus Domini apparuit in somnis Joseph, dicens: Surge, et accipe puerum, et matrem ejus, et fuge in Aegyptum, et esto ibi usque dum dicam tibi. Futurum est enim ut Herodes quaerat puerum ad perdendum eum."
      en: "And after they were departed, behold an angel of the Lord appeared in sleep to Joseph, saying: Arise, and take the child and his mother, and fly into Egypt: and be there until I shall tell thee. For it will come to pass that Herod will seek the child to destroy him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Qui consurgens accepit puerum et matrem ejus nocte, et secessit in Aegyptum: et erat ibi usque ad obitum Herodis:"
      en: "Who arose, and took the child and his mother by night, and retired into Egypt: and he was there until the death of Herod:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ut adimpleretur quod dictum est a Domino per prophetam dicentem: Ex Aegypto vocavi filium meum."
      en: "That it might be fulfilled which the Lord spoke by the prophet, saying: Out of Egypt have I called my son."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Tunc Herodes videns quoniam illusus esset a magis, iratus est valde, et mittens occidit omnes pueros, qui erant in Bethlehem, et in omnibus finibus ejus, a bimatu et infra secundum tempus, quod exquisierat a magis."
      en: "Then Herod perceiving that he was deluded by the wise men, was exceeding angry; and sending killed all the men children that were in Bethlehem, and in all the borders thereof, from two years old and under, according to the time which he had diligently inquired of the wise men."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Tunc adimpletum est quod dictum est per Jeremiam prophetam dicentem:"
      en: "Then was fulfilled that which was spoken by Jeremias the prophet, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vox in Rama audita est ploratus, et ululatus multus: Rachel plorans filios suos, et noluit consolari, quia non sunt."
      en: "A voice in Rama was heard, lamentation and great mourning; Rachel bewailing her children, and would not be comforted, because they are not."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Defuncto autem Herode, ecce angelus Domini apparuit in somnis Joseph in Aegypto,"
      en: "But when Herod was dead, behold an angel of the Lord appeared in sleep to Joseph in Egypt,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dicens: Surge, et accipe puerum, et matrem ejus, et vade in terram Israel: defuncti sunt enim qui quaerebant animam pueri."
      en: "Saying: Arise, and take the child and his mother, and go into the land of Israel. For they are dead that sought the life of the child."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui consurgens, accepit puerum, et matrem ejus, et venit in terram Israel."
      en: "Who arose, and took the child and his mother, and came into the land of Israel."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Audiens autem quod Archelaus regnaret in Judaea pro Herode patre suo, timuit illo ire: et admonitus in somnis, secessit in partes Galilaeae."
      en: "But hearing that Archelaus reigned in Judea in the room of Herod his father, he was afraid to go thither: and being warned in sleep retired into the quarters of Galilee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et veniens habitavit in civitate quae vocatur Nazareth: ut adimpleretur quod dictum est per prophetas: Quoniam Nazaraeus vocabitur."
      en: "And coming he dwelt in a city called Nazareth: that it might be fulfilled which was said by prophets: That he shall be called a Nazarene."
    status: { la: verified, en: verified }
