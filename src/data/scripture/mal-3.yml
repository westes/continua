# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: mal
chapter: 3
verses:
  - n: 1
    text:
      la: "Ecce ego mittam angelum meum, et praeparabit viam ante faciem meam: et statim veniet ad templum suum Dominator quem vos quaeritis, et angelus testamenti quem vos vultis. Ecce venit, dicit Dominus exercituum."
      en: "Behold I send my angel, and he shall prepare the way before my face. And presently the Lord, whom you seek, and the angel of the testament, whom you desire, shall come to his temple. Behold he cometh, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et quis poterit cogitare diem adventus ejus, et quis stabit ad videndum eum? ipse enim quasi ignis conflans, et quasi herba fullonum:"
      en: "And who shall be able to think of the day of his coming? and who shall stand to see him? for he is like a refining fire, and like the fuller's herb:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et sedebit conflans, et emundans argentum: et purgabit filios Levi, et colabit eos quasi aurum et quasi argentum, et erunt Domino offerentes sacrificia in justitia."
      en: "And he shall sit refining and cleansing the silver, and he shall purify the sons of Levi, and shall refine them as gold, and as silver, and they shall offer sacrifices to the Lord in justice."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et placebit Domino sacrificium Juda et Jerusalem, sicut dies saeculi, et sicut anni antiqui."
      en: "And the sacrifice of Juda and of Jerusalem shall please the Lord, as in the days of old, and in the ancient years."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et accedam ad vos in judicio, et ero testis velox maleficis, et adulteris, et perjuris, et qui calumniantur mercedem mercenarii, viduas et pupillos, et opprimunt peregrinum, nec timuerunt me, dicit Dominus exercituum."
      en: "And I will come to you in judgment, and will be a speedy witness against sorcerers, and adulterers, and false swearers, and them that oppress the hireling in his wages; the widows, and the fatherless: and oppress the stranger, and have not feared me, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ego enim Dominus, et non mutor: et vos filii Jacob, non estis consumpti."
      en: "For I am the Lord, and I change not: and you the sons of Jacob are not consumed."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "A diebus enim patrum vestrorum recessistis a legitimis meis, et non custodistis: revertimini ad me, et revertar ad vos, dicit Dominus exercituum. Et dixistis: In quo revertemur?"
      en: "For from the days of your fathers you have departed from my ordinances, and have not kept them: Return to me, and I will return to you, saith the Lord of hosts. And you have said: Wherein shall we return?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si affliget homo Deum, quia vos configitis me? Et dixistis: In quo configimus te? In decimis et in primitiis."
      en: "Shall a man afflict God? for you afflict me. And you have said: Wherein do we afflict thee? in tithes and in firstfruits."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et in penuria vos maledicti estis, et me vos configitis gens tota."
      en: "And you are cursed with want, and you afflict me, even the whole nation of you."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Inferte omnem decimam in horreum, et sit cibus in domo mea: et probate me super hoc, dicit Dominus: si non aperuero vobis cataractas caeli, et effudero vobis benedictionem usque ad abundantiam:"
      en: "Bring all the tithes into the storehouse, that there may be meat in my house, and try me in this, saith the Lord: if I open not unto you the flood-gates of heaven, and pour you out a blessing even to abundance."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et increpabo pro vobis devorantem, et non corrumpet fructum terrae vestrae, nec erit sterilis vinea in agro, dicit Dominus exercituum."
      en: "And I will rebuke for your sakes the devourer, and he shall not spoil the fruit of your land: neither shall the vine in the field be barren, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et beatos vos dicent omnes gentes: eritis enim vos terra desiderabilis, dicit Dominus exercituum."
      en: "And all nations shall call you blessed: for you shall be a delightful land, saith the Lord of hosts."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Invaluerunt super me verba vestra, dicit Dominus."
      en: "Your words have been unsufferable to me, saith the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et dixistis: Quid locuti sumus contra te? Dixistis: Vanus est qui servit Deo: et quod emolumentum quia custodivimus praecepta ejus, et quia ambulavimus tristes coram Domino exercituum?"
      en: "And you have said: What have we spoken against thee? You have said: He laboureth in vain that serveth God, and what profit is it that we have kept his ordinances, and that we have walked sorrowful before the Lord of hosts?"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ergo nunc beatos dicimus arrogantes: siquidem aedificati sunt facientes impietatem, et tentaverunt Deum, et salvi facti sunt."
      en: "Wherefore now we call the proud people happy, for they that work wickedness are built up, and they have tempted God and are preserved."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Tunc locuti sunt timentes Dominum, unusquisque cum proximo suo: et attendit Dominus, et audivit, et scriptus est liber monumenti coram eo timentibus Dominum, et cogitantibus nomen ejus."
      en: "Then they that feared the Lord spoke every one with his neighbour: and the Lord gave ear, and heard it: and a book of remembrance was written before him for them that fear the Lord, and think on his name."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et erunt mihi, ait Dominus exercituum, in die qua ego facio, in peculium: et parcam eis, sicut parcit vir filio suo servienti sibi."
      en: "And they shall be my special possession, saith the Lord of hosts, in the day that I do judgment: and I will spare them, as a man spareth his son that serveth him."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et convertemini, et videbitis quid sit inter justum et impium, et inter servientem Deo et non servientem ei."
      en: "And you shall return, and shall see the difference between the just and the wicked: and between him that serveth God, and him that serveth him not."
    status: { la: verified, en: verified }
