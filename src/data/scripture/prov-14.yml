# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 14
verses:
  - n: 1
    text:
      la: "Sapiens mulier aedificat domum suam; insipiens exstructam quoque manibus destruet."
      en: "A wise woman buildeth her house: but the foolish will pull down with her hands that also which is built."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ambulans recto itinere, et timens Deum, despicitur ab eo qui infami graditur via."
      en: "He that walketh in the right way, and feareth God, is despised by him that goeth by an infamous way."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "In ore stulti virga superbiae; labia autem sapientium custodiunt eos."
      en: "In the mouth of a fool is the rod of pride: but the lips of the wise preserve them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ubi non sunt boves praesepe vacuum est; ubi autem plurimae segetes, ibi manifesta est fortitudo bovis."
      en: "Where there are no oxen, the crib is empty: but where there is much corn, there the strength of the ox is manifest."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Testis fidelis non mentitur; profert autem mendacium dolosus testis."
      en: "A faithful witness will not lie: but a deceitful witness uttereth a lie."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Quaerit derisor sapientiam, et non invenit; doctrina prudentium facilis."
      en: "A scorner seeketh wisdom, and findeth it not: the learning of the wise is easy."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Vade contra virum stultum, et nescit labia prudentiae."
      en: "Go against a foolish man, and he knoweth not the lips of prudence."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Sapientia callidi est intelligere viam suam, et imprudentia stultorum errans."
      en: "The wisdom of a discreet man is to understand his way: and the imprudence of fools erreth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Stultus illudet peccatum, et inter justos morabitur gratia."
      en: "A fool will laugh at sin, but among the just grace shall abide."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cor quod novit amaritudinem animae suae, in gaudio ejus non miscebitur extraneus."
      en: "The heart that knoweth the bitterness of his own soul, in his joy the stranger shall not intermeddle."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Domus impiorum delebitur, tabernacula vero justorum germinabunt."
      en: "The house of the wicked shall be destroyed: but the tabernacles of the just shall flourish."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Est via quae videtur homini justa, novissima autem ejus deducunt ad mortem."
      en: "There is a way which seemeth just to a man: but the ends thereof lead to death."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Risus dolore miscebitur, et extrema gaudii luctus occupat."
      en: "Laughter shall be mingled with sorrow, and mourning taketh hold of the end of joy."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Viis suis replebitur stultus, et super eum erit vir bonus."
      en: "A fool shall be filled with his own ways, and the good man shall be above him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Innocens credit omni verbo; astutus considerat gressus suos. Filio doloso nihil erit boni; servo autem sapienti prosperi erunt actus, et dirigetur via ejus."
      en: "The innocent believeth every word: the discreet man considereth his steps. No good shall come to the deceitful son: but the wise servant shall prosper in his dealings, and his way shall be made straight."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sapiens timet, et declinat a malo; stultus transilit, et confidit."
      en: "A wise man feareth and declineth from evil: the fool leapeth over and is confident."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Impatiens operabitur stultitiam, et vir versutus odiosus est."
      en: "The impatient man shall work folly: and the crafty man is hateful."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Possidebunt parvuli stultitiam, et exspectabunt astuti scientiam."
      en: "The childish shall possess folly, and the prudent, shall look for knowledge."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Jacebunt mali ante bonos, et impii ante portas justorum."
      en: "The evil shall fall down before the good: and the wicked before the gates of the just."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Etiam proximo suo pauper odiosus erit, amici vero divitum multi."
      en: "The poor man shall be hateful even to his own neighbour: but the friends of the rich are many."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Qui despicit proximum suum peccat; qui autem miseretur pauperis beatus erit. Qui credit in Domino misericordiam diligit."
      en: "He that despiseth his neighbour, sinneth: but he that sheweth mercy to the poor, shall be blessed. He that believeth in the Lord, loveth mercy."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Errant qui operantur malum; misericordia et veritas praeparant bona."
      en: "They err that work evil: but mercy and truth prepare good things."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "In omni opere erit abundantia; ubi autem verba sunt plurima, ibi frequenter egestas."
      en: "In much work there shall be abundance: but where there are many words, there is oftentimes want."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Corona sapientium divitiae eorum; fatuitas stultorum imprudentia."
      en: "The crown of the wise is their riches: the folly of fools, imprudence."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Liberat animas testis fidelis, et profert mendacia versipellis."
      en: "A faithful witness delivereth souls: and the double dealer uttereth lies."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "In timore Domini fiducia fortitudinis, et filiis ejus erit spes."
      en: "In the fear of the Lord is confidence of strength, and there shall be hope for his children."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Timor Domini fons vitae, ut declinent a ruina mortis."
      en: "The fear of the Lord is a fountain of life, to decline from the ruin of death."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "In multitudine populi dignitas regis, et in paucitate plebis ignominia principis."
      en: "In the multitude of people is the dignity of the king: and in the small number of people the dishonour of the prince."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Qui patiens est multa gubernatur prudentia; qui autem impatiens est exaltat stultitiam suam."
      en: "He that is patient, is governed with much wisdom: but he that is impatient, exalteth his folly."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Vita carnium sanitas cordis; putredo ossium invidia."
      en: "Soundness of heart is the life of the flesh: but envy is the rottenness of the bones."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Qui calumniatur egentem exprobrat factori ejus, honorat autem eum qui miseretur pauperis."
      en: "He that oppresseth the poor, upbraideth his Maker: but he that hath pity on the poor, honoureth him."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "In malitia sua expelletur impius, sperat autem justus in morte sua."
      en: "The wicked man shall be driven out in his wickedness: but the just hath hope in his death."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "In corde prudentis requiescit sapientia, et indoctos quosque erudiet."
      en: "In the heart of the prudent resteth wisdom, and it shall instruct all the ignorant."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Justitia elevat gentem; miseros autem facit populos peccatum."
      en: "Justice exalteth a nation: but sin maketh nations miserable."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Acceptus est regi minister intelligens; iracundiam ejus inutilis sustinebit."
      en: "A wise servant is acceptable to the king: he that is good for nothing shall feel his anger."
    status: { la: verified, en: verified }
