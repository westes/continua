# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2esdr
chapter: 7
verses:
  - n: 1
    text:
      la: "Postquam autem aedificatus est murus, et posui valvas, et recensui janitores, et cantores, et Levitas:"
      en: "Now after the wall was built, and I had set up the doors, and numbered the porters and singing men, and Levites:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "praecepi Hanani fratri meo, et Hananiae principi domus de Jerusalem ( ipse enim quasi vir verax et timens Deum plus ceteris videbatur),"
      en: "I commanded Hanani my brother, and Hananias ruler of the house of Jerusalem, (for he seemed as a sincere man, and one that feared God above the rest,)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixi eis: Non aperiantur portae Jerusalem usque ad calorem solis. Cumque adhuc assisterent, clausae portae sunt, et oppilatae: et posui custodes de habitatoribus Jerusalem, singulos per vices suas, et unumquemque contra domum suam."
      en: "And I said to them: Let not the gates of Jerusalem be opened till the sun be hot. And while they were yet standing by, the gates were shut, and barred: and I set watchmen of the inhabitants of Jerusalem, every one by their courses, and every man over against his house."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Civitas autem erat lata nimis et grandis, et populus parvus in medio ejus, et non erant domus aedificatae."
      en: "And the city was very wide and great, and the people few in the midst thereof, and the houses were not built."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Deus autem dedit in corde meo, et congregavi optimates, et magistratus, et vulgus, ut recenserem eos: et inveni librum census eorum, qui ascenderant primum, et inventum est scriptum in eo."
      en: "But God had put in my heart, and I assembled the princes and magistrates, and common people, to number them: and I found a book of the number of them who came up at first, and therein it was found written:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Isti filii provinciae, qui ascenderunt de captivitate migrantium, quos transtulerat Nabuchodonosor rex Babylonis, et reversi sunt in Jerusalem, et in Judaeam, unusquisque in civitatem suam."
      en: "These are the children of the province, who came up from the captivity of them that had been carried away, whom Nabuchodonosor the king of Babylon had carried away, and who returned into Judea, every one into his own city."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui venerunt cum Zorobabel, Josue, Nehemias, Azarias, Raamias, Nahamani, Mardochaeus, Belsam, Mespharath, Begoai, Nahum, Baana. Numerus virorum populi Israel:"
      en: "Who came with Zorobabel, Josue, Nehemias, Azarias, Raamias, Nahamani, Mardochai, Belsam, Mespharath, Begoia, Nahum, Baana. The number of the men of the people of Israel:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "filii Pharos, duo millia centum septuaginta duo:"
      en: "The children of Pharos, two thousand one hundred seventy-two."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "filii Saphatia, trecenti septuaginta duo:"
      en: "The children of Sephatia, three hundred seventy-two."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "filii Area, sexcenti quinquaginta duo:"
      en: "The children of Area, six hundred fifty-two."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "filii Phahathmoab filiorum Josue et Joab, duo millia octingenti decem et octo:"
      en: "The children of Phahath Moab of the children of Josue and Joab, two thousand eight hundred eighteen."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "filii Aelam, mille ducenti quinquaginta quatuor:"
      en: "The children of Elam, one thousand two hundred fifty-four."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "filii Zethua, octingenti quadraginta quinque:"
      en: "The children of Zethua, eight hundred forty-five."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "filii Zachai, septingenti sexaginta:"
      en: "The children of Zachai, seven hundred sixty."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "filii Bannui, sexcenti quadraginta octo:"
      en: "The children of Bannui, six hundred forty-eight."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "filii Bebai, sexcenti viginti octo:"
      en: "The children of Bebai, six hundred twenty-eight."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "filii Azgad, duo millia trecenti viginti duo:"
      en: "The children of Azgad, two thousand three hundred twenty-two."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "filii Adonicam, sexcenti sexaginta septem:"
      en: "The children of Adonicam, six hundred sixty-seven."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "filii Beguai, duo millia sexaginta septem:"
      en: "The children of Beguai, two thousand sixty-seven."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "filii Adin, sexcenti quinquaginta quinque:"
      en: "The children of Adin, six hundred fifty-five."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "filii Ater, filii Hezeciae, nonaginta octo:"
      en: "The children of Ater, children of Hezechias, ninety-eight."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "filii Hasem, trecenti viginti octo:"
      en: "The children of Hasem, three hundred twenty-eight."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "filii Besai, trecenti viginti quatuor:"
      en: "The children of Besai, three hundred twenty-four."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "filii Hareph, centum duodecim:"
      en: "The children of Hareph, a hundred and twelve."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "filii Gabaon, nonaginta quinque:"
      en: "The children of Gabaon, ninety-five."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "filii Bethlehem, et Netupha, centum octoginta octo."
      en: "The children of Bethlehem, and Netupha, a hundred eighty-eight."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Viri Anathoth, centum viginti octo."
      en: "The men of Anathoth, a hundred twenty-eight."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Viri Bethazmoth, quadraginta duo."
      en: "The men of Bethazmoth, forty-two."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Viri Cariathiarim, Cephira, et Beroth, septingenti quadraginta tres."
      en: "The men of Cariathiarim, Cephira, and Beroth, seven hundred forty-three."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Viri Rama et Geba, sexcenti viginti unus."
      en: "The men of Rama and Geba, six hundred twenty-one."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Viri Machmas, centum viginti duo."
      en: "The men of Machmas, a hundred twenty-two."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Viri Bethel et Hai, centum viginti tres."
      en: "The men of Bethel and Hai, a hundred twenty-three."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Viri Nebo alterius, quinquaginta duo."
      en: "The men of the other Nebo, fifty-two."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Viri Aelam alterius, mille ducenti quinquaginta quatuor."
      en: "The men of the other Elam, one thousand two hundred fifty-four."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Filii Harem, trecenti viginti."
      en: "The children of Harem, three hundred and twenty."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Filii Jericho, trecenti quadraginta quinque."
      en: "The children of Jericho, three hundred forty-five."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Filii Lod Hadid et Ono, septingenti viginti unus."
      en: "The children of Led, of Hadid and One, seven hundred twenty-one."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Filii Senaa, tria millia nongenti triginta."
      en: "The children of Senaa, three thousand nine hundred thirty."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Sacerdotes: filii Idaia in domo Josue, nongenti septuaginta tres."
      en: "The priests: the children of Idaia in the house of Josue, nine hundred and seventy-three."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Filii Emmer, mille quinquaginta duo."
      en: "The children of Emmer, one thousand fifty-two."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Filii Phashur, mille ducenti quadraginta septem."
      en: "The children of Phashur, one thousand two hundred forty-seven."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Filii Arem, mille decem et septem. Levitae:"
      en: "The children of Arem, one thousand and seventeen. The Levites:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "filii Josue et Cedmihel filiorum."
      en: "The children of Josue and Cedmihel, the sons"
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Oduiae, septuaginta quatuor. Cantores:"
      en: "Of Oduia, seventy-four. The singing men:"
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "filii Asaph, centum quadraginta octo."
      en: "The children of Asaph, a hundred forty-eight."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Janitores: filii Sellum, filii Ater, filii Telmon, filii Accub, filii Hatita, filii Sobai: centum triginta octo."
      en: "The porters: the children of Sellum, the children of Ater, the children of Telmon, the children of Accub, the children of Hatita, the children of Sobai: a hundred thirty-eight."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Nathinaei: filii Soha, filii Hasupha, filii Tebbaoth,"
      en: "The Nathinites: the children of Soha, the children of Hasupha, the children of Tebbaoth,"
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "filii Ceros, filii Siaa, filii Phadon, filii Lebana, filii Hagaba, filii Selmai,"
      en: "The children of Ceros, the children of Siaa, the children of Phadon, the children of Lebana, the children of Hagaba, the children of Selmai,"
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "filii Hanan, filii Geddel, filii Gaher,"
      en: "The children of Hanan, the children of Geddel, the children of Gaher,"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "filii Raaia, filii Rasin, filii Necoda,"
      en: "The children of Raaia, the children of Rasin, the children of Necoda,"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "filii Gezem, filii Aza, filii Phasea,"
      en: "The children of Gezem, the children of Asa, the children of Phasea,"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "filii Besai, filii Munim, filii Nephussim,"
      en: "The children of Besai, the children of Munim, the children of Nephussim,"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "filii Bacbuc, filii Hacupha, filii Harhur,"
      en: "The children of Bacbuc, the children of Hacupha, the children of Harhur,"
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "filii Besloth, filii Mahida, filii Harsa,"
      en: "The children of Besloth, the children of Mahida, the children of Harsa,"
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "filii Bercos, filii Sisara, filii Thema,"
      en: "The children of Bercos, the children of Sisara, the children of Thema,"
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "filii Nasia, filii Hatipha,"
      en: "The children of Nasia, the children of Hatipha,"
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "filii servorum Salomonis, filii Sothai, filii Sophereth, filii Pharida,"
      en: "The children of the servants of Solomon, the children of Sothai, the children of Sophereth, the children of Pharida,"
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "filii Jahala, filii Darcon, filii Jeddel,"
      en: "The children of Jahala, the children of Darcon, the children of Jeddel,"
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "filii Saphatia, filii Hatil, filii Phochereth, qui erat ortus ex Sabaim filio Amon."
      en: "The children of Saphatia, the children of Hatil, the children of Phochereth, who was born of Sabaim, the son of Amon."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Omnes Nathinaei, et filii servorum Salomonis, trecenti nonaginta duo."
      en: "All the Nathinites, and the children of the servants of Solomon, three hundred ninety-two."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Hi sunt autem, qui ascenderunt de Thelmela, Thelharsa, Cherub, Addon, et Emmer: et non potuerunt indicare domum patrum suorum, et semen suum, utrum ex Israel essent,"
      en: "And these are they that came up from Telmela, Thelharsa, Cherub, Addon, and Emmer: and could not shew the house of their fathers, nor their seed, whether they were of Israel."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "filii Dalaia, filii Tobia, filii Necoda, sexcenti quadraginta duo."
      en: "The children of Dalaia, the children of Tobia, the children of Necoda, six hundred forty-two."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Et de sacerdotibus, filii Habia, filii Accos, filii Berzellai, qui accepit de filiabus Berzellai Galaaditis uxorem: et vocatus est nomine eorum."
      en: "And of the priests, the children of Habia, the children of Accos, the children of Berzellai, who took a wife of the daughters of Berzellai the Galaadite, and he was called by their name."
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "Hi quaesierunt scripturam suam in censu, et non invenerunt: et ejecti sunt de sacerdotio."
      en: "These sought their writing in the record, and found it not: and they were cast out of the priesthood."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "Dixitque Athersatha eis ut non manducarent de Sanctis sanctorum, donec staret sacerdos doctus et eruditus."
      en: "And Athersatha said to them, that they should not eat of the holies of holies, until there stood up a priest learned and skillful."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "Omnis multitudo quasi vir unus quadraginta duo millia trecenti sexaginta,"
      en: "All the multitude as it were one man, forty-two thousand three hundred sixty,"
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "absque servis, et ancillis eorum, qui erant septem millia trecenti triginta septem, et inter eos cantores, et cantatrices, ducenti quadraginta quinque."
      en: "Beside their menservants and womenservants, who were seven thousand three hundred thirty-seven: and among them singing men, and singing women, two hundred forty-five."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "Equi eorum, septingenti triginta sex: muli eorum, ducenti quadraginta quinque:"
      en: "Their horses, seven hundred thirty-six: their mules two hundred forty-five:"
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "cameli eorum, quadringenti triginta quinque: asini, sex millia septingenti viginti."
      en: "Their camels, four hundred thirty-five, their asses, six thousand seven hundred and twenty."
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "Nonnulli autem de principibus familiarum dederunt in opus. Athersatha dedit in thesaurum auri drachmas mille, phialas quinquaginta, tunicas sacerdotales quingentas triginta."
      en: "And some of the heads of the families gave unto the work. Athersatha gave into the treasure a thousand drama of gold, fifty bowls, and five hundred and thirty garments for priests."
    status: { la: verified, en: verified }
  - n: 71
    text:
      la: "Et de principibus familiarum dederunt in thesaurum operis, auri drachmas viginti millia, et argenti mnas duo millia ducentas."
      en: "And some of the heads of families gave to the treasure of the work, twenty thousand drama of gold, and two thousand two hundred pounds of silver."
    status: { la: verified, en: verified }
  - n: 72
    text:
      la: "Et quod dedit reliquus populus, auri drachmas viginti millia, et argenti mnas duo millia, et tunicas sacerdotales sexaginta septem."
      en: "And that which the rest of the people gave, was twenty thousand drama of gold, and two thousand pounds of silver, and sixty-seven garments for priests."
    status: { la: verified, en: verified }
  - n: 73
    text:
      la: "Habitaverunt autem sacerdotes, et Levitae, et janitores, et cantores, et reliquum vulgus, et Nathinaei, et omnis Israel in civitatibus suis."
      en: "And the priests, and the Levites, and the porters, and the singing men, and the rest of the common people, and the Nathinites, and all Israel dwelt in their cities."
    status: { la: verified, en: verified }
