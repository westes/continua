book: 2esdr
chapter: 7
verses:
  - n: 1
    text:
      la: "postquam autem aedificatus est murus et posui valvas et recensui ianitores et cantores et Levitas"
      en: "Now after the wall was built, and I had set up the doors, and numbered the porters and singing men, and Levites:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "praecepi Aneni fratri meo et Ananiae principi domus de Hierusalem ipse enim quasi vir verax et timens Deum plus ceteris videbatur"
      en: "I commanded Hanani my brother, and Hananias ruler of the house of Jerusalem, (for he seemed as a sincere man, and one that feared God above the rest,)"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dixi eis non aperiantur portae Hierusalem usque ad calorem solis cumque adhuc adsisterent clausae portae sunt et oppilatae et posui custodes de habitatoribus Hierusalem singulos per vices suas et unumquemque contra domum suam"
      en: "And I said to them: Let not the gates of Jerusalem be opened till the sun be hot. And while they were yet standing by, the gates were shut, and barred: and I set watchmen of the inhabitants of Jerusalem, every one by their courses, and every mall over against his house."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "civitas autem erat lata nimis et grandis et populus parvus in medio eius et non erant domus aedificatae"
      en: "And the city was very wide and great, and the people few in the midst thereof, and the houses were not built."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "dedit autem Deus in corde meo et congregavi optimates et magistratus et vulgum ut recenserem eos et inveni librum census eorum qui ascenderant primum et inventum est scriptum in eo"
      en: "But God had put in my heart, and I assembled the princes and magistrates, and common people, to number them: and I found a book of the number of them who came up at first, and therein it was found written:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "isti filii provinciae qui ascenderunt de captivitate migrantium quos transtulerat Nabuchodonosor rex Babylonis et reversi sunt in Hierusalem et in Iudaeam unusquisque in civitatem suam"
      en: "These are the children of the province, who came up from the captivity of them that had been carried away, whom Nabuchodonosor the king of Babylon had carried away, and who returned into Judea, every one into his own city."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "qui venerunt cum Zorobabel Hiesuae Neemias Azarias Raamias Naamni Mardocheus Belsar Mespharath Beggoai Naum Baana numerus virorum populi Israhel"
      en: "Who came with Zorobabel, Josue, Nehemias, Azarias, Raamias, Nahamani, Mardochai, Belsam, Mespharath, Begoia, Nahum, Baana. The number of the men of the people of Israel:"
    status: { la: verified, en: verified }
