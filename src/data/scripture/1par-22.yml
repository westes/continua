# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 22
verses:
  - n: 1
    text:
      la: "Dixitque David: Haec est domus Dei, et hoc altare in holocaustum Israeli."
      en: "Then David said: This is the house of God, and this is the altar for the holocaust of Israel."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et praecepit ut congregarentur omnes proselyti de terra Israel, et constituit ex eis latomos ad caedendos lapides et poliendos, ut aedificaretur domus Dei."
      en: "And he commanded to gather together all the proselytes of the land of Israel, and out of them he appointed stonecutters to hew stones and polish them, to build the house of God."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ferrum quoque plurimum ad clavos januarum, et ad commissuras atque juncturas praeparavit David: et aeris pondus innumerabile."
      en: "And David prepared in abundance iron for the nails of the gates, and for the closures and joinings: and of brass an immense weight."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ligna quoque cedrina non poterant aestimari, quae Sidonii et Tyrii deportaverant ad David."
      en: "And the cedar trees were without number, which the Sidonians, and Tyrians brought to David."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et dixit David: Solomon filius meus puer parvulus est et delicatus: domus autem, quam aedificari volo Domino, talis esse debet ut in cunctis regionibus nominetur: praeparabo ergo ei necessaria. Et ob hanc causam ante mortem suam omnes praeparavit impensas."
      en: "And David said: Solomon my son is very young and tender, and the house which I would have to be built to the Lord, must be such as to be renowned in all countries: therefore I will prepare him necessaries. And therefore before his death he prepared all the charges."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Vocavitque Salomonem filium suum, et praecepit ei ut aedificaret domum Domino Deo Israel."
      en: "And he called for Solomon his son: and commanded him to build a house to the Lord the God of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dixitque David ad Salomonem: Fili mi, voluntatis meae fuit ut aedificarem domum nomini Domini Dei mei,"
      en: "And David said to Solomon: My son, it was my desire to have built a house to the name of the Lord my God."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "sed factus est sermo Domini ad me, dicens: Multum sanguinem effudisti, et plurima bella bellasti: non poteris aedificare domum nomini meo, tanto effuso sanguine coram me:"
      en: "But the word of the Lord came to me, saying: Thou hast shed much blood, and fought many battles, so thou canst not build a house to my name, after shedding so much blood before me:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "filius, qui nascetur tibi, erit vir quietissimus: faciam enim eum requiescere ab omnibus inimicis suis per circuitum: et ob hanc causam Pacificus vocabitur: et pacem et otium dabo in Israel cunctis diebus ejus."
      en: "The son, that shall be born to thee, shall be a most quiet man: for I will make him rest from all his enemies round about: and therefore he shall be called Peaceable: and I will give peace and quietness to Israel all his days."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ipse aedificabit domum nomini meo, et ipse erit mihi in filium, et ego ero illi in patrem: firmaboque solium regni ejus super Israel in aeternum."
      en: "He shall build a house to my name, and he shall be a son to me, and I will be a father to him: and I will establish the throne of his kingdom over Israel for ever."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nunc ergo fili mi, sit Dominus tecum, et prosperare, et aedifica domum Domino Deo tuo, sicut locutus est de te."
      en: "Now then, my son, the Lord be with thee, and do thou prosper, and build the house to the Lord thy God, as he hath spoken of thee."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Det quoque Dominus prudentiam et sensum ut regere possis Israel, et custodire legem Domini Dei tui."
      en: "The Lord also give thee wisdom and understanding, that thou mayest be able to rule Israel, and to keep the law of the Lord thy God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tunc enim proficere poteris, si custodieris mandata, et judicia, quae praecepit Dominus Moysi ut doceret Israel: confortare, et virilter age; ne timeas, neque paveas."
      en: "For then thou shalt be able to prosper, if thou keep the commandments, and judgments, which the Lord commanded Moses to teach Israel: take courage and act manfully, fear not, nor be dismayed."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ecce ego in paupertate mea praeparavi impensas domus Domini, auri talenta centum millia, et argenti mille millia talentorum: aeris vero et ferri non est pondus, vincitur enim numerus magnitudine: ligna et lapides praeparavi ad universa impendia."
      en: "Behold I in my poverty have prepared the charges of the house of the Lord, of gold a hundred thousand talents, and of silver a million of talents: but of brass, and of iron there is no weight, for the abundance surpasseth all account: timber also and stones I have prepared for all the charges."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Habes quoque plurimos artifices, latomos, et caementarios, artificesque lignorum, et omnium artium ad faciendum opus prudentissimos,"
      en: "Thou hast also workmen in abundance, hewers of stones, and masons, and carpenters, and of all trades the most skillful in their work,"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in auro et argento et aere et ferro, cujus non est numerus. Surge igitur, et fac, et erit Dominus tecum."
      en: "In gold, and in silver, and in brass, and in iron, whereof there is no number. Arise then, and be doing, and the Lord will be with thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Praecepit quoque David cunctis principibus Israel, ut adjuvarent Salomonem filium suum:"
      en: "David also charged all the princes of Israel, to help Solomon his son,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cernitis, inquiens, quod Dominus Deus vester vobiscum sit, et dederit vobis requiem per circuitum, et tradiderit omnes inimicos vestros in manus vestras, et subjecta sit terra coram Domino, et coram populo ejus."
      en: "Saying: You see, that the Lord your God is with you, and hath given you rest round about, and hath delivered all your enemies into your hands, and the land is subdued before the Lord, and before his people."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Praebete igitur corda vestra et animas vestras, ut quaeratis Dominum Deum vestrum: et consurgite, et aedificate sanctuarium Domino Deo, ut introducatur arca foederis Domini, et vasa Domino consecrata, in domum quae aedificatur nomini Domini."
      en: "Give therefore your hearts and your souls, to seek the Lord your God: and arise, and build a sanctuary to the Lord God, that the ark of the covenant of the Lord, and the vessels consecrated to the Lord, may be brought into the house, which is built to the name of the Lord."
    status: { la: verified, en: verified }
