# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: marc
chapter: 16
verses:
  - n: 1
    text:
      la: "Et cum transisset sabbatum, Maria Magdalene, et Maria Jacobi, et Salome emerunt aromata ut venientes ungerent Jesum."
      en: "And when the sabbath was past, Mary Magdalen, and Mary the mother of James, and Salome, bought sweet spices, that coming, they might anoint Jesus."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et valde mane una sabbatorum, veniunt ad monumentum, orto jam sole."
      en: "And very early in the morning, the first day of the week, they come to the sepulchre, the sun being now risen."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dicebant ad invicem: Quis revolvet nobis lapidem ab ostio monumenti?"
      en: "And they said one to another: Who shall roll us back the stone from the door of the sepulchre?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et respicientes viderunt revolutum lapidem. Erat quippe magnus valde."
      en: "And looking, they saw the stone rolled back. For it was very great."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et introeuntes in monumentum viderunt juvenem sedentem in dextris, coopertum stola candida, et obstupuerunt."
      en: "And entering into the sepulchre, they saw a young man sitting on the right side, clothed with a white robe: and they were astonished."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui dicit illis: Nolite expavescere: Jesum quaeritis Nazarenum, crucifixum: surrexit, non est hic, ecce locus ubi posuerunt eum."
      en: "Who saith to them: Be not affrighted; you seek Jesus of Nazareth, who was crucified: he is risen, he is not here, behold the place where they laid him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Sed ite, dicite discipulis ejus, et Petro, quia praecedit vos in Galilaeam: ibi eum videbitis, sicut dixit vobis."
      en: "But go, tell his disciples and Peter that he goeth before you into Galilee; there you shall see him, as he told you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "At illae exeuntes, fugerunt de monumento: invaserat enim eas tremor et pavor: et nemini quidquam dixerunt: timebant enim."
      en: "But they going out, fled from the sepulchre. For a trembling and fear had seized them: and they said nothing to any man; for they were afraid."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Surgens autem mane prima sabbati, apparuit primo Mariae Magdalene, de qua ejecerat septem daemonia."
      en: "But he rising early the first day of the week, appeared first to Mary Magdalen, out of whom he had cast seven devils."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Illa vadens nuntiavit his, qui cum eo fuerant, lugentibus et flentibus."
      en: "She went and told them that had been with him, who were mourning and weeping."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et illi audientes quia viveret, et visus esset ab ea, non crediderunt."
      en: "And they hearing that he was alive, and had been seen by her, did not believe."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Post haec autem duobus ex his ambulantibus ostensus est in alia effigie, euntibus in villam:"
      en: "And after that he appeared in another shape to two of them walking, as they were going into the country."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et illi euntes nuntiaverunt ceteris: nec illis crediderunt."
      en: "And they going told it to the rest: neither did they believe them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Novissime recumbentibus illis undecim apparuit: et exprobravit incredulitatem eorum et duritiam cordis: quia iis, qui viderant eum resurrexisse, non crediderunt."
      en: "At length he appeared to the eleven as they were at table: and he upbraided them with their incredulity and hardness of heart, because they did not believe them who had seen him after he was risen again."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et dixit eis: Euntes in mundum universum praedicate Evangelium omni creaturae."
      en: "And he said to them: Go ye into the whole world, and preach the gospel to every creature."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Qui crediderit, et baptizatus fuerit, salvus erit: qui vero non crediderit, condemnabitur."
      en: "He that believeth and is baptized, shall be saved: but he that believeth not shall be condemned."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Signa autem eos qui crediderint, haec sequentur: in nomine meo daemonia ejicient: linguis loquentur novis:"
      en: "And these signs shall follow them that believe: In my name they shall cast out devils: they shall speak with new tongues."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "serpentes tollent: et si mortiferum quid biberint, non eis nocebit: super aegros manus imponent, et bene habebunt."
      en: "They shall take up serpents; and if they shall drink any deadly thing, it shall not hurt them: they shall lay their hands upon the sick, and they shall recover."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et Dominus quidem Jesus postquam locutus est eis, assumptus est in caelum, et sedet a dextris Dei."
      en: "And the Lord Jesus, after he had spoken to them, was taken up into heaven, and sitteth on the right hand of God."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Illi autem profecti praedicaverunt ubique, Domino cooperante, et sermonem confirmante, sequentibus signis."
      en: "But they going forth preached everywhere: the Lord working withal, and confirming the word with signs that followed."
    status: { la: verified, en: verified }
