# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 12
verses:
  - n: 1
    text:
      la: "Dixit quoque Dominus ad Moysen et Aaron in terra Aegypti:"
      en: "And the Lord said to Moses and Aaron in the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Mensis iste, vobis principium mensium: primus erit in mensibus anni."
      en: "This month shall be to you the beginning of months: it shall be the first in the months of the year."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Loquimini ad universum coetum filiorum Israel, et dicite eis: Decima die mensis hujus tollat unusquisque agnum per familias et domos suas."
      en: "Speak ye to the whole assembly of the children of Israel, and say to them: On the tenth day of this month let every man take a lamb by their families and houses."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Sin autem minor est numerus ut sufficere possit ad vescendum agnum, assumet vicinum suum qui junctus est domui suae, juxta numerum animarum quae sufficere possunt ad esum agni."
      en: "But if the number be less than may suffice to eat the lamb, he shall take unto him his neighbour that joineth to his house, according to the number of souls which may be enough to eat the lamb."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Erit autem agnus absque macula, masculus, anniculus: juxta quem ritum tolletis et haedum."
      en: "And it shall be a lamb without blemish, a male, of one year: according to which rite also you shall take a kid."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et servabitis eum usque ad quartamdecimam diem mensis hujus: immolabitque eum universa multitudo filiorum Israel ad vesperam."
      en: "And you shall keep it until the fourteenth day of this month: and the whole multitude of the children of Israel shall sacrifice it in the evening."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et sument de sanguine ejus, ac ponent super utrumque postem, et in superliminaribus domorum, in quibus comedent illum."
      en: "And they shall take of the blood thereof, and put it upon both the side posts, and on the upper door posts of the houses, wherein they shall eat it."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et edent carnes nocte illa assas igni, et azymos panes cum lactucis agrestibus."
      en: "And they shall eat the flesh that night roasted at the fire, and unleavened bread with wild lettuce."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Non comedetis ex eo crudum quid, nec coctum aqua, sed tantum assum igni: caput cum pedibus ejus et intestinis vorabitis."
      en: "You shall not eat thereof any thing raw, nor boiled in water, but only roasted at the fire: you shall eat the head with the feet and entrails thereof."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nec remanebit quidquam ex eo usque mane; si quid residuum fuerit, igne comburetis."
      en: "Neither shall there remain any thing of it until morning. If there be any thing left, you shall burn it with fire."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sic autem comedetis illum: renes vestros accingetis, et calceamenta habebitis in pedibus, tenentes baculos in manibus, et comedetis festinanter: est enim Phase ( id est, transitus) Domini."
      en: "And thus you shall eat it: you shall gird your reins, and you shall have shoes on your feet, holding staves in your hands, and you shall eat in haste: for it is the Phase (that is the Passage) of the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et transibo per terram Aegypti nocte illa, percutiamque omne primogenitum in terra Aegypti ab homine usque ad pecus: et in cunctis diis Aegypti faciam judicia. Ego Dominus."
      en: "And I will pass through the land of Egypt that night, and will kill every firstborn in the land of Egypt both man and beast: and against all the gods of Egypt I will execute judgments: I am the Lord."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Erit autem sanguis vobis in signum in aedibus in quibus eritis: et videbo sanguinem, et transibo vos: nec erit in vobis plaga disperdens quando percussero terram Aegypti."
      en: "And the blood shall be unto you for a sign in the houses where you shall be: and I shall see the blood, and shall pass over you: and the plague shall not be upon you to destroy you, when I shall strike the land of Egypt."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Habebitis autem hunc diem in monimentum: et celebrabitis eam solemnem Domino in generationibus vestris cultu sempiterno."
      en: "And this day shall be for a memorial to you: and you shall keep it a feast to the Lord in your generations with an everlasting observance."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Septem diebus azyma comedetis: in die primo non erit fermentum in domibus vestris: quicumque comederit fermentatum, peribit anima illa de Israel, a primo die usque ad diem septimum."
      en: "Seven days shall you eat unleavened bread: in the first day there shall be no leaven in your houses: whosoever shall eat any thing leavened, from the first day until the seventh day, that soul shall perish out of Israel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Dies prima erit sancta atque solemnis, et dies septima eadem festivitate venerabilis: nihil operis facietis in eis, exceptis his, quae ad vescendum pertinent."
      en: "The first day shall be holy and solemn, and the seventh day shall be kept with the like solemnity: you shall do no work in them, except those things that belong to eating."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et observabitis azyma: in eadem enim ipsa die educam exercitum vestrum de terra Aegypti, et custodietis diem istum in generationes vestras ritu perpetuo."
      en: "And you shall observe the feast of the unleavened bread: for in this same day I will bring forth your army out of the land of Egypt, and you shall keep this day in your generations by a perpetual observance."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Primo mense, quartadecima die mensis ad vesperam, comedetis azyma usque ad diem vigesimam primam ejusdem mensis ad vesperam."
      en: "The first month, the fourteenth day of the month in the evening, you shall eat unleavened bread, until the one and twentieth day of the same month in the evening."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Septem diebus fermentum non invenietur in domibus vestris: qui comederit fermentatum, peribit anima ejus de coetu Israel, tam de advenis quam de indigenis terrae."
      en: "Seven days there shall not be found any leaven in your houses: he that shall eat leavened bread, his soul shall perish out of the assembly of Israel, whether he be a stranger or born in the land."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Omne fermentatum non comedetis: in cunctis habitaculis vestris edetis azyma."
      en: "You shall not eat any thing leavened: in all your habitations you shall eat unleavened bread."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Vocavit autem Moyses omnes seniores filiorum Israel, et dixit ad eos: Ite tollentes animal per familias vestras, et immolate Phase."
      en: "And Moses called all the ancients of the children of Israel, and said to them: Go take a lamb by your families, and sacrifice the Phase."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Fasciculumque hyssopi tingite in sanguine qui est in limine, et aspergite ex eo superliminare, et utrumque postem: nullus vestrum egrediatur ostium domus suae usque mane."
      en: "And dip a bunch of hyssop in the blood that is at the door, and sprinkle the transom of the door therewith, and both the door cheeks: let none of you go out of the door of his house till morning."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Transibit enim Dominus percutiens Aegyptios: cumque viderit sanguinem in superliminari, et in utroque poste, transcendet ostium domus, et non sinet percussorem ingredi domos vestras et laedere."
      en: "For the Lord will pass through striking the Egyptians: and when he shall see the blood on the transom, and on both the posts, he will pass over the door of the house, and not suffer the destroyer to come into your houses and to hurt you."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Custodi verbum istud legitimum tibi et filiis tuis usque in aeternum."
      en: "Thou shalt keep this thing as a law for thee and thy children for ever."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Cumque introieritis terram, quam Dominus daturus est vobis ut pollicitus est, observabitis caeremonias istas."
      en: "And when you have entered into the land which the Lord will give you as he hath promised, you shall observe these ceremonies."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et cum dixerint vobis filii vestri: Quae est ista religio?"
      en: "And when your children shall say to you: What is the meaning of this service?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "victima transitus Domini est, quando transivit super domos filiorum Israel in Aegypto, percutiens Aegyptios, et domos nostras liberans. Incurvatusque populus adoravit."
      en: "You shall say to them: It is the victim of the passage of the Lord, when he passed over the houses of the children of Israel in Egypt, striking the Egyptians, and saving our houses. And the people bowing themselves, adored."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et egressi filii Israel fecerunt sicut praeceperat Dominus Moysi et Aaron."
      en: "And the children of Israel going forth did as the Lord had commanded Moses and Aaron."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Factum est autem in noctis medio, percussit Dominus omne primogenitum in terra Aegypti, a primogenito Pharaonis, qui in solio ejus sedebat, usque ad primogenitum captivae quae erat in carcere, et omne primogenitum jumentorum."
      en: "And it came to pass at midnight, the Lord slew every firstborn in the land of Egypt, from the firstborn of Pharao, who sat on his throne, unto the firstborn of the captive woman that was in the prison, and all the firstborn of cattle."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Surrexitque Pharao nocte, et omnes servi ejus, cunctaque Aegyptus: et ortus est clamor magnus in Aegypto: neque enim erat domus in qua non jaceret mortuus."
      en: "And Pharao arose in the night, and all his servants, and all Egypt: for there was not a house wherein there lay not one dead."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Vocatisque Pharao Moyse et Aaron nocte, ait: Surgite et egredimini a populo meo, vos et filii Israel: ite, immolate Domino sicut dicitis."
      en: "And Pharao calling Moses and Aaron, in the night, said: Arise and go forth from among my people, you and the children of Israel: go, sacrifice to the Lord as you say."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Oves vestras et armenta assumite ut petieratis, et abeuntes benedicite mihi."
      en: "Your sheep and herds take along with you, as you demanded, and departing, bless me."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Urgebantque Aegyptii populum de terra exire velociter, dicentes: Omnes moriemur."
      en: "And the Egyptians pressed the people to go forth out of the land speedily, saying: We shall all die."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Tulit igitur populus conspersam farinam antequam fermentaretur: et ligans in palliis, posuit super humeros suos."
      en: "The people therefore took dough before it was leavened: and tying it in their cloaks, put it on their shoulders."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Feceruntque filii Israel sicut praeceperat Moyses: et petierunt ab Aegyptiis vasa argentea et aurea, vestemque plurimam."
      en: "And the children of Israel did as Moses had commanded: and they asked of the Egyptians vessels of silver and gold, and very much raiment."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Dominus autem dedit gratiam populo coram Aegyptiis ut commodarent eis: et spoliaverunt Aegyptios."
      en: "And the Lord gave favour to the people in the sight of the Egyptians, so that they lent unto them: and they stripped the Egyptians."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Profectique sunt filii Israel de Ramesse in Socoth, sexcenta fere millia peditum virorum, absque parvulis."
      en: "And the children of Israel set forward from Ramesse to Socoth, being about six hundred thousand men on foot, beside children."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Sed et vulgus promiscuum innumerabile ascendit cum eis, oves et armenta et animantia diversi generis multa nimis."
      en: "And a mixed multitude without number went up also with them, sheep and herds and beasts of divers kinds, exceeding many."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Coxeruntque farinam, quam dudum de Aegypto conspersam tulerant: et fecerunt subcinericios panes azymos: neque enim poterant fermentari, cogentibus exire Aegyptiis, et nullam facere sinentibus moram: nec pulmenti quidquam occurrerat praeparare."
      en: "And they baked the meal, which a little before they had brought out of Egypt, in dough: and they made earth cakes unleavened: for it could not be leavened, the Egyptians pressing them to depart, and not suffering them to make any stay: neither did they think of preparing any meat."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Habitatio autem filiorum Israel qua manserunt in Aegypto, fuit quadringentorum triginta annorum."
      en: "And the abode of the children of Israel that they made in Egypt, was four hundred and thirty years."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Quibus expletis, eadem die egressus est omnis exercitus Domini de terra Aegypti."
      en: "Which being expired, the same day all the army of the Lord went forth out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Nox ista est observabilis Domino, quando eduxit eos de terra Aegypti: hanc observare debent omnes filii Israel in generationibus suis."
      en: "This is the observable night of the Lord, when he brought them forth out of the land of Egypt: this night all the children of Israel must observe in their generations."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Dixitque Dominus ad Moysen et Aaron: Haec est religio Phase: omnis alienigena non comedet ex eo."
      en: "And the Lord said to Moses and Aaron: This is the service of the Phase: No foreigner shall eat of it."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Omnis autem servus emptitius circumcidetur, et sic comedet."
      en: "But every bought servant shall be circumcised, and so shall eat."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Advena et mercenarius non edent ex eo."
      en: "The stranger and the hireling shall not eat thereof."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "In una domo comedetur, nec efferetis de carnibus ejus foras, nec os illius confringetis."
      en: "In one house shall it be eaten, neither shall you carry forth of the flesh thereof out of the house, neither shall you break a bone thereof."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Omnis coetus filiorum Israel faciet illud."
      en: "All the assembly of the children of Israel shall keep it."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Quod si quis peregrinorum in vestram voluerit transire coloniam, et facere Phase Domini, circumcidetur prius omne masculinum ejus, et tunc rite celebrabit: eritque sicut indigena terrae: si quis auem circumcisus non fuerit, non vescetur ex eo."
      en: "And if any stranger be willing to dwell among you, and to keep the Phase of the Lord, all his males shall first be circumcised, and then shall he celebrate it according to the manner: and he shall be as he that is born in the land: but if any man be uncircumcised, he shall not eat thereof."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Eadem lex erit indigenae et colono qui peregrinatur apud vos."
      en: "The same law shall be to him that is born in the land, and to the proselyte that sojourneth with you."
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Feceruntque omnes filii Israel sicut praeceperat Dominus Moysi et Aaron."
      en: "And all the children of Israel did as the Lord had commanded Moses and Aaron."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et eadem die eduxit Dominus filios Israel de terra Aegypti per turmas suas."
      en: "And the same day the Lord brought forth the children of Israel out of the land of Egypt by their companies."
    status: { la: verified, en: verified }
