# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 2
verses:
  - n: 1
    text:
      la: "anno tertiodecimo Nabuchodonosor regis vicesima et secunda die mensis primi factum est verbum in domo Nabuchodonosor regis Assyriorum ut defenderet se"
      en: "In the thirteenth year of the reign of Nabuchodonosor, the two and twentieth day of the first month, the word was given out in the house of Nabuchodonosor king of the Assyrians, that he would revenge himself."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "vocavitque omnes maiores omnesque duces bellatores suos et habuit cum eis mysterium consilii sui"
      en: "And he called all the ancients, and all the governors, and his officers of war, and communicated to them the secret of his counsel:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixitque cogitationem suam in eo esse ut omnem terram suo subiugaret imperio"
      en: "And he said that his thoughts were to bring all the earth under his empire."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quod dictum cum placuisset omnibus vocavit Nabuchodonosor rex Holofernem principem militiae suae"
      en: "And when this saying pleased them all, Nabuchodonosor, the king, called Holofernes the general of his armies,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et dixit egredere adversum omne regnum occidentis et contra eos praecipue qui contempserunt imperium meum"
      en: "And said to him: Go out against all the kingdoms of the west, and against them especially that despised my commandment."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non parcet oculus meus ulli regno omnemque urbem munitam subiugabis mihi"
      en: "Thy eye shall not spare any kingdom, and all the strong cities thou shalt bring under my yoke."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tunc Holofernis vocavit duces et magistratus virtutis Assyriorum et dinumeravit viros in expeditione sicut praecepit ei rex centum viginti milia peditum pugnatorum et equites sagittarios duodecim milia"
      en: "Then Holofernes called the captains and officers of the power of the Assyrians: and he mustered men for the expedition, as the king commanded him, a hundred and twenty thousand fighting men on foot, and twelve thousand archers, horsemen."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "omnemque expeditionem suam fecit praeire multitudinem innumerabilium camelorum cum his quae exercitibus sufficerent copiose boum quoque armenta gregesque ovium quorum non erat numerus"
      en: "And he made all his warlike preparations to go before with a multitude of innumerable camels, with all provisions sufficient for the armies in abundance, and herds of oxen, and flocks of sheep, without number."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "frumentum ex omni Syria in transitu suo parari constituit"
      en: "He appointed corn to be prepared out of all Syria in his passage."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "aurum vero et argentum de domo regis adsumpsit multum nimis"
      en: "But gold and silver he took out of the king's house in great abundance."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et profectus est ipse et omnis exercitus cum quadrigis et equitibus et sagittariis qui cooperuerunt faciem terrae sicut lucustae"
      en: "And he went forth he and all the army, with the chariots, and horsemen, and archers, who covered the face of the earth, like locusts."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cumque pertransisset fines Assyriorum venit ad magnos montes Angae qui sunt a sinistro Ciliciae ascenditque omnia castella eorum et obtinuit omnem munitionem"
      en: "And when he had passed through the borders of the Assyrians, he came to the great mountains of Ange, which are on the left of Cilicia: and he went up to all their castles, and took all the strong places."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "effregit autem civitatem opinatissimam Meluthi praedavitque omnes filios Tharsis et filios Ismahel qui erant contra faciem deserti et ad austrum terrae Celeon"
      en: "And he took by assault the renowned city of Melothus, and pillaged all the children of Tharsis, and the children of Ismahel, who were over against the face of the desert, and on the south of the land of Cellon."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et transiit Eufraten et venit ad Mesopotamiam et fregit omnes civitates excelsas quae erant ibi a torrente Mambre usquequo perveniatur ad mare"
      en: "And he passed over the Euphrates and came into Mesopotamia: and he forced all the stately cities that were there, from the torrent of Mambre, till one comes to the sea:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et occupavit terminos eius a Cilicia usque ad fines Iafeth qui sunt ad austrum"
      en: "And he took the borders thereof from Cilicia to the coasts of Japheth, which are towards the south."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "abduxitque omnes filios Madian ac praedavit omnem locupletationem eorum omnesque resistentes sibi occidit in ore gladii"
      en: "And he carried away all the children of Madian, and stripped them of all their riches, and all that resisted him he slew with the edge of the sword."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et post haec descendit in campos Damasci in diebus messis et succendit omnia sata omnesque arbores ac vineas fecit incidi"
      en: "And after these things he went down into the plains of Damascus in the days of the harvest, and he set all the corn on fire, and he caused all the trees and vineyards to be cut down"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et cecidit timor illius super omnes inhabitantes terram"
      en: "And the fear of them fell upon alit the inhabitants of the land."
    status: { la: verified, en: verified }
