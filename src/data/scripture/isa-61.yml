# Isaiah 61:6-9, transcribed from a live Divinum Officium query (Monastic
# Tridentinum 1617, command=prayMatutinum, 2026-08-18 -- St. Andrew's own
# day, 2026-11-30, Matins Nocturn III's first canticle). Only these verses
# are authored; the rest of the chapter is unauthored. Same convention as
# isa-33.yml: each Latin half-verse is its own list entry (repeated verse
# number), English attached to the first half only.
book: isa
chapter: 61
verses:
  - n: 6
    text:
      la: "Vos autem sacerdótes Dómini vocabímini: * minístri Dei nostri, dicétur vobis:"
      en: "But you shall be called the priests of the Lord: to you it shall be said: You ministers of our God:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Fortitúdinem géntium comedétis, * et in glória eárum superbiétis."
      en: "You shall eat the riches of the Gentiles, and you shall pride yourselves in their glory."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Pro confusióne vestra dúplici et rubóre, * laudábunt partem suam;"
      en: "For your double confusion and shame, they shall praise their part:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Propter hoc in terra sua duplícia possidébunt, * lætítia sempitérna erit eis."
      en: "Therefore shall they receive double in their land, everlasting joy shall be unto them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Quia ego Dóminus díligens judícium, * et ódio habens rapínam in holocáusto:"
      en: "For I am the Lord that loves judgment, and hates robbery in a holocaust:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et dabo opus eórum in veritáte, * et fœdus perpétuum fériam eis."
      en: "And I will make their work in truth, and I will make a perpetual covenant with them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et scient in géntibus semen eórum, * et germen eórum in médio populórum:"
      en: "And they shall know their seed among the Gentiles, and their offspring in the midst of peoples:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Omnes qui víderint eos cognóscent illos, * quia isti sunt semen, cui benedíxit Dóminus."
      en: "All that shall see them, shall know them, that these are the seed which the Lord has blessed."
    status: { la: verified, en: verified }
