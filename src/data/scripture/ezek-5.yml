# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: ezek
chapter: 5
verses:
  - n: 1
    text:
      la: "Et tu, fili hominis, sume tibi gladium acutum, radentem pilos, et assumes eum et duces per caput tuum et per barbam tuam, et assumes tibi stateram ponderis et divides eos."
      en: "And thou, son of man, take thee a sharp knife that shaveth the hair: and cause it to pass over thy head, and over thy beard: and take thee a balance to weigh in, and divide the hair."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tertiam partem igni combures in medio civitatis, juxta completionem dierum obsidionis, et assumes tertiam partem, et concides gladio in circuitu ejus: tertiam vero aliam disperges in ventum, et gladium nudabo post eos."
      en: "A third part thou shalt burn with fire in the midst of the city, according to the fulfilling of the days of the siege: and thou shalt take a third part, and cut it in pieces with the knife all round about: and the other third part thou shalt scatter in the wind, and I will draw out the sword after them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et sumes inde parvum numerum, et ligabis eos in summitate pallii tui:"
      en: "And thou shalt take thereof a small number: and shalt bind them in the skirt of thy cloak."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ex eis rursum tolles, et projicies eos in medio ignis, et combures eos igni, et ex eo egredietur ignis in omnem domum Israel."
      en: "And thou shalt take of them again, and shalt cast them in the midst of the fire, and shalt burn them with fire: and out of it shall come forth a fire into all the house of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Haec dicit Dominus Deus: Ista est Jerusalem: in medio gentium posui eam, et in circuitu ejus terras."
      en: "Thus saith the Lord God: This is Jerusalem, I have set her in the midst of the nations, and the countries round about her."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et contempsit judicia mea, ut plus esset impia quam gentes, et praecepta mea ultra quam terrae quae in circuitu ejus sunt: judicia enim mea projecerunt, et in praeceptis meis non ambulaverunt."
      en: "And she hath despised my judgments, so as to be more wicked than the Gentiles; and my commandments, more than the countries that are round about her: for they have cast off my judgments, and have not walked in my commandments."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Idcirco haec dicit Dominus Deus: Quia superastis gentes quae in circuitu vestro sunt, et in praeceptis meis non ambulastis, et judicia mea non fecistis, et juxta judicia gentium quae in circuitu vestro sunt non estis operati,"
      en: "Therefore thus saith the Lord God: Because you have surpassed the Gentiles that are round about you, and have not walked in my commandments, and have not kept my judgments, and have not done according to the judgments of the nations that are round about you:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ideo haec dicit Dominus Deus: Ecce ego ad te, et ipse ego faciam in medio tui judicia in oculis gentium:"
      en: "Therefore thus saith the Lord God: Behold I come against thee, and I myself will execute judgments in the midst of thee in the sight of the Gentiles."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et faciam in te quod non feci, et quibus similia ultra non faciam, propter omnes abominationes tuas."
      en: "And I will do in thee that which I have not done: and the like to which I will do no more, because of all thy abominations."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ideo patres comedent filios in medio tui, et filii comedent patres suos: et faciam in te judicia, et ventilabo universas reliquias tuas in omnem ventum."
      en: "Therefore the fathers shall eat the sons in the midst of thee, and the sons shall eat their fathers: and I will execute judgments in thee, and I will scatter thy whole remnant into every wind."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Idcirco vivo ego, dicit Dominus Deus, nisi pro eo quod sanctum meum violasti in omnibus offensionibus tuis et in cunctis abominationibus tuis, ego quoque confringam, et non parcet oculus meus, et non miserebor."
      en: "Therefore as I live, saith the Lord God: Because thou hast violated my sanctuary with all thy offences, and with all thy abominations: I will also break thee in pieces, and my eye shall not spare, and I will not have any pity."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Tertia pars tui peste morietur, et fame consumetur in medio tui, et tertia pars tui in gladio cadet in circuitu tuo: tertiam vero partem tuam in omnem ventum dispergam, et gladium evaginabo post eos."
      en: "A third part of thee shall die with the pestilence, and shall be consumed with famine in the midst of thee: and a third part of thee shall fall by the sword round about thee: and a third part of thee will I scatter into every wind, and I will draw out a sword after them."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et complebo furorem meum, et requiescere faciam indignationem meam in eis, et consolabor: et scient quia ego Dominus locutus sum in zelo meo, cum implevero indignationem meam in eis."
      en: "And I will accomplish my fury, and will cause my indignation to rest upon them, and I will be comforted: and they shall know that I the Lord have spoken it in my zeal, when I shall have accomplished my indignation in them."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et dabo te in desertum, et in opprobrium gentibus quae in circuitu tuo sunt, in conspectu omnis praetereuntis:"
      en: "And I will make thee desolate, and a reproach among the nations that are round about thee, in the sight of every one that passeth by."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et eris opprobrium et blasphemia, exemplum et stupor in gentibus quae in circuitu tuo sunt, cum fecero in te judicia in furore, et in indignatione, et in increpationibus irae."
      en: "And thou shalt be a reproach, and a scoff, an example, and an astonishment amongst the nations that are round about thee, when I shall have executed judgments in thee in anger, and in indignation, and in wrathful rebukes."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ego Dominus locutus sum: quando misero sagittas famis pessimas in eos, quae erunt mortiferae, et quas mittam ut disperdam vos: et famem congregabo super vos, et conteram in vobis baculum panis:"
      en: "I the Lord have spoken it: When I shall send upon them the grievous arrows of famine, which shall bring death, and which I will send to destroy you: and I will gather together famine against you: and I will break among you the staff of bread."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et immittam in vos famem et bestias pessimas, usque ad internecionem: et pestilentia et sanguis transibunt per te, et gladium inducam super te. Ego Dominus locutus sum."
      en: "And I will send in upon you famine, and evil beasts unto utter destruction: and pestilence, and blood shall pass through thee, and I will bring in the sword upon thee. I the Lord have spoken it."
    status: { la: verified, en: verified }
