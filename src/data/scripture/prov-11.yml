# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 11
verses:
  - n: 1
    text:
      la: "statera dolosa abominatio apud Dominum et pondus aequum voluntas eius"
      en: "A deceitful balance is an abomination before the Lord: and a just weight is his will."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ubi fuerit superbia ibi erit et contumelia ubi autem humilitas ibi et sapientia"
      en: "Where pride is, there also shall be reproach: but where humility is, there also is wisdom."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "simplicitas iustorum diriget eos et subplantatio perversorum vastabit illos"
      en: "The simplicity of the just shall guide them: and the deceitfulness of the wicked shall destroy them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "non proderunt divitiae in die ultionis iustitia autem liberabit a morte"
      en: "Riches shall not profit in the day of revenge: but justice shall deliver from death."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "iustitia simplicis diriget viam eius et in impietate sua corruet impius"
      en: "The justice of the upright shall make his way prosperous: and the wicked man shall fall by his own wickedness."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "iustitia rectorum liberabit eos et in insidiis suis capientur iniqui"
      en: "The justice of the righteous shall deliver them: and the unjust shall be caught in their own snares."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "mortuo homine impio nulla erit ultra spes et expectatio sollicitorum peribit"
      en: "When the wicked man is dead, there shall be no hope any more: and the expectation of the solicitous shall perish."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "iustus de angustia liberatus est et tradetur impius pro eo"
      en: "The just is delivered out of distress: and the wicked shall be given up for him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "simulator ore decipit amicum suum iusti autem liberabuntur scientia"
      en: "The dissembler with his mouth deceiveth his friend: but the just shall be delivered by knowledge."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in bonis iustorum exultabit civitas et in perditione impiorum erit laudatio"
      en: "When it goeth well with the just the city shall rejoice: and when the wicked perish there shall be praise."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "benedictione iustorum exaltabitur civitas et ore impiorum subvertetur"
      en: "By the blessing of the just the city shall be exalted: and by the mouth of the wicked it shall be overthrown."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "qui despicit amicum suum indigens corde est vir autem prudens tacebit"
      en: "He that despiseth his friend, is mean of heart: but the wise man will hold his peace."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "qui ambulat fraudulenter revelat arcana qui autem fidelis est animi celat commissum"
      en: "He that walketh deceitfully, revealeth secrets: but he that is faithful, concealeth the thing committed to him by his friend."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ubi non est gubernator populus corruet salus autem ubi multa consilia"
      en: "Where there is no governor, the people shall fall: but there is safety where there is much counsel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "adfligetur malo qui fidem facit pro extraneo qui autem cavet laqueos securus erit"
      en: "He shall be afflicted with evil, that is surety for a stranger: but he that is aware of the snares, shall be secure."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "mulier gratiosa inveniet gloriam et robusti habebunt divitias"
      en: "A gracious woman shall find glory: and the strong shall have riches."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "benefacit animae suae vir misericors qui autem crudelis est et propinquos abicit"
      en: "A merciful man doth good to his own soul: but he that is cruel casteth off even his own kindred."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "impius facit opus instabile seminanti autem iustitiam merces fidelis"
      en: "The wicked maketh an unsteady work: but to him that soweth justice, there is a faithful reward."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "clementia praeparat vitam et sectatio malorum mortem"
      en: "Clemency prepareth life: and the pursuing of evil things, death."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "abominabile Domino pravum cor et voluntas eius in his qui simpliciter ambulant"
      en: "A perverse heart is abominable to the Lord: and his will is in them that walk sincerely."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "manus in manu non erit innocens malus semen autem iustorum salvabitur"
      en: "Hand in hand the evil man shall not be innocent: but the seed of the just shall be saved."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "circulus aureus in naribus suis mulier pulchra et fatua"
      en: "A golden ring in a swine's snout, a woman fair and foolish."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "desiderium iustorum omne bonum est praestolatio impiorum furor"
      en: "The desire of the just is all good: the expectation of the wicked is indignation."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "alii dividunt propria et ditiores fiunt alii rapiunt non sua et semper in egestate sunt"
      en: "Some distribute their own goods, and grow richer: others take away what is not their own, and are always in want."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "anima quae benedicit inpinguabitur et qui inebriat ipse quoque inebriabitur"
      en: "The soul which blesseth, shall be made fat: and he that inebriateth, shall be inebriated also himself."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "qui abscondit frumenta maledicetur in populis benedictio autem super caput vendentium"
      en: "He that hideth up corn, shall be cursed among the people: but a blessing upon the head of them that sell."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "bene consurgit diluculo qui quaerit bona qui autem investigator malorum est opprimetur ab eis"
      en: "Well doth he rise early who seeketh good things; but he that seeketh after evil things shall be oppressed by them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "qui confidet in divitiis suis corruet iusti autem quasi virens folium germinabunt"
      en: "He that trusteth in his riches shall fall: but the just shall spring up as a green leaf."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "qui conturbat domum suam possidebit ventos et qui stultus est serviet sapienti"
      en: "He that troubleth his own house, shall inherit the winds: and the fool shall serve the wise."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "fructus iusti lignum vitae et qui suscipit animas sapiens est"
      en: "The fruit of the just man is a tree of life: and he that gaineth souls, is wise."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "si iustus in terra recipit quanto magis impius et peccator"
      en: "If the just man receive in the earth, how much more the wicked and the sinner."
    status: { la: verified, en: verified }
