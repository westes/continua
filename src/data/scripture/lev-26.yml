# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: lev
chapter: 26
verses:
  - n: 1
    text:
      la: "Ego Dominus Deus vester: non facietis vobis idolum, et sculptile, nec titulos erigetis, nec insignem lapidem ponetis in terra vestra, ut adoretis eum. Ego enim sum Dominus Deus vester."
      en: "I am the Lord your God: you shall not make to yourselves any idol or graven thing, neither shall you erect pillars, nor set up a remarkable stone in your land, to adore it: for I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Custodite sabbata mea, et pavete ad sanctuarium meum. Ego Dominus."
      en: "Keep my sabbaths, and reverence my sanctuary: I am the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Si in praeceptis meis ambulaveritis, et mandata mea custodieritis, et feceritis ea, dabo vobis pluvias temporibus suis,"
      en: "If you walk in my precepts, and keep my commandments, and do them, I will give you rain in due seasons."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et terra gignet germen suum, et pomis arbores replebuntur."
      en: "And the ground shall bring forth its increase, and the trees shall be filled with fruit."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Apprehendet messium tritura vindemiam, et vindemia occupabit sementem: et comedetis panem vestrum in saturitate, et absque pavore habitabitis in terra vestra."
      en: "The threshing of your harvest shall reach unto the vintage, and the vintage shall reach unto the sowing time: and you shall eat your bread to the full, and dwell in your land without fear."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dabo pacem in finibus vestris: dormietis, et non erit qui exterreat. Auferam malas bestias, et gladius non transibit terminos vestros."
      en: "I will give peace in your coasts: you shall sleep, and there shall be none to make you afraid. I will take away evil beasts: and the sword shall not pass through your quarters."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Persequemini inimicos vestros, et corruent coram vobis."
      en: "You shall pursue your enemies, and they shall fall before you."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Persequentur quinque de vestris centum alienos, et centum de vobis decem millia: cadent inimici vestri gladio in conspectu vestro."
      en: "Five of yours shall pursue a hundred others, and a hundred of you ten thousand: your enemies shall fall before you by the sword."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Respiciam vos, et crescere faciam: multiplicabimini, et firmabo pactum meum vobiscum."
      en: "I will look on you, and make you increase: you shall be multiplied, and I will establish my covenant with you."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Comedetis vetustissima veterum, et vetera novis supervenientibus projicietis."
      en: "You shall eat the oldest of the old store, and, new coming on, you shall cast away the old."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ponam tabernaculum meum in medio vestri, et non abjiciet vos anima mea."
      en: "I will set my tabernacle in the midst of you, and my soul shall not cast you off."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ambulabo inter vos, et ero Deus vester, vosque eritis populus meus."
      en: "I will walk among you, and will be your God, and you shall be my people."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ego Dominus Deus vester, qui eduxi vos de terra Aegyptiorum, ne serviretis eis: et qui confregi catenas cervicum vestrarum, ut incederetis erecti."
      en: "I am the Lord your God: who have brought you out of the land of the Egyptians, that you should not serve them, and who have broken the chains of your necks, that you might go upright."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quod si non audieritis me, nec feceritis omnia mandata mea,"
      en: "But if you will not hear me, nor do all my commandments,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "si spreveritis leges meas, et judicia mea contempseritis, ut non faciatis ea quae a me constituta sunt, et ad irritum perducatis pactum meum:"
      en: "If you despise my laws, and contemn my judgments so as not to do those things which are appointed by me, and to make void my covenant:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ego quoque haec faciam vobis: visitabo vos velociter in egestate, et ardore, qui conficiat oculos vestros, et consumat animas vestras. Frustra seretis sementem, quae ab hostibus devorabitur."
      en: "I also will do these things to you: I will quickly visit you with poverty, and burning heat, which shall waste your eyes, and consume your lives. You shall sow your seed in vain, which shall be devoured by your enemies."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ponam faciem meam contra vos, et corruetis coram hostibus vestris, et subjiciemini his qui oderunt vos: fugietis, nemine persequente."
      en: "I will set my face against you, and you shall fall down before your enemies, and shall be made subject to them that hate you, you shall flee when no man pursueth you."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Sin autem nec sic obedieritis mihi, addam correptiones vestras septuplum propter peccata vestra,"
      en: "But if you will not yet for all this obey me: I will chastise you seven times more for your sins,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et conteram superbiam duritiae vestrae. Daboque vobis caelum desuper sicut ferrum, et terram aeneam."
      en: "And I will break the pride of your stubbornness, and I will make to you the heaven above as iron, and the earth as brass:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Consumetur incassum labor vester, non proferet terra germen, nec arbores poma praebebunt."
      en: "Your labour shall be spent in vain, the ground shall not bring forth her increase, nor the trees yield their fruit."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Si ambulaveritis ex adverso mihi, nec volueritis audire me, addam plagas vestras in septuplum propter peccata vestra:"
      en: "If you walk contrary to me, and will not hearken to me, I will bring seven times more plagues upon you for your sins:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "immittamque in vos bestias agri, quae consumant vos, et pecora vestra, et ad paucitatem cuncta redigant, desertaeque fiant viae vestrae."
      en: "And I will send in upon you the beasts of the field, to destroy you and your cattle, and make you few in number, and that your highways may be desolate."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Quod si nec sic volueritis recipere disciplinam, sed ambulaveritis ex adverso mihi:"
      en: "And if even so you will not amend, but will walk contrary to me:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ego quoque contra vos adversus incedam, et percutiam vos septies propter peccata vestra,"
      en: "I also will walk contrary to you, and will strike you seven times for your sins."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "inducamque super vos gladium ultorem foederis mei. Cumque confugeritis in urbes, mittam pestilentiam in medio vestri, et trademini in manibus hostium,"
      en: "And I will bring in upon you the sword that shall avenge my covenant. And when you shall flee into the cities, I will send the pestilence in the midst of you, and you shall be delivered into the hands of your enemies,"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "postquam confregero baculum panis vestri: ita ut decem mulieres in uno clibano coquant panes, et reddant eos ad pondus: et comedetis, et non saturabimini."
      en: "After I shall have broken the staff of your bread: so that ten women shall bake your bread in one oven, and give it out by weight: and you shall eat, and shall not be filled."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Sin autem nec per haec audieritis me, sed ambulaveritis contra me:"
      en: "But if you will not for all this hearken to me, but will walk against me:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et ego incedam adversus vos in furore contrario, et corripiam vos septem plagis propter peccata vestra:"
      en: "I will also go against you with opposite fury, and I will chastise you with seven plagues for your sins,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "ita ut comedatis carnes filiorum vestrorum et filiarum vestrarum."
      en: "So that you shall eat the flesh of your sons and of your daughters."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Destruam excelsa vestra, et simulacra confringam. Cadetis inter ruinas idolorum vestrorum, et abominabitur vos anima mea,"
      en: "I will destroy your high places, and break your idols. You shall fall among the ruins of your idols, and my soul shall abhor you."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "in tantum ut urbes vestras redigam in solitudinem, et deserta faciam sanctuaria vestra, nec recipiam ultra odorem suavissimum."
      en: "Insomuch that I will bring your cities to be a wilderness, and I will make your sanctuaries desolate, and will receive no more your sweet odours."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Disperdamque terram vestram, et stupebunt super ea inimici vestri, cum habitatores illius fuerint."
      en: "And I will destroy your land, and your enemies shall be astonished at it, when they shall be the inhabitants thereof."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Vos autem dispergam in gentes, et evaginabo post vos gladium, eritque terra vestra deserta, et civitates vestrae dirutae."
      en: "And I will scatter you among the Gentiles, and I will draw out the sword after you, and your land shall be desert, and your cities destroyed."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Tunc placebunt terrae sabbata sua cunctis diebus solitudinis suae: quando fueritis"
      en: "Then shall the land enjoy her sabbaths all the days of her desolation: when you shall be"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "in terra hostili, sabbatizabit, et requiescet in sabbatis solitudinis suae, eo quod non requieverit in sabbatis vestris quando habitabatis in ea."
      en: "In the enemy's land, she shall keep a sabbath, and rest in the sabbaths of her desolation, because she did not rest in your sabbaths when you dwelt therein."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et qui de vobis remanserint, dabo pavorem in cordibus eorum in regionibus hostium, terrebit eos sonitus folii volantis, et ita fugient quasi gladium: cadent, nullo persequente,"
      en: "And as to them that shall remain of you I will send fear in their hearts in the countries of their enemies, the sound of a flying leaf shall terrify them, and they shall flee as it were from the sword: they shall fall, when no man pursueth them,"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "et corruent singuli super fratres suos, quasi bella fugientes, nemo vestrum inimicis audebit resistere."
      en: "And they shall every one fall upon their brethren as fleeing from wars, none of you shall dare to resist your enemies."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Peribitis inter gentes, et hostilis vos terra consumet."
      en: "You shall perish among the Gentiles, and an enemy's land shall consume you."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Quod si et de iis aliqui remanserint, tabescent in iniquitatibus suis, in terra inimicorum suorum, et propter peccata patrum suorum et sua affligentur:"
      en: "And if of them also some remain, they shall pine away in their iniquities, in the land of their enemies, and they shall be afflicted for the sins of their fathers, and their own:"
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "donec confiteantur iniquitates suas, et majorum suorum, quibus praevaricati sunt in me, et ambulaverunt ex adverso mihi."
      en: "Until they confess their iniquities and the iniquities of their ancestors, whereby they have transgressed me, and walked contrary unto me."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Ambulabo igitur et ego contra eos, et inducam illos in terram hostilem, donec erubescat incircumcisa mens eorum: tunc orabunt pro impietatibus suis."
      en: "Therefore I also will walk them, and bring them into their enemies' land until their uncircumcised mind be ashamed: then shall they pray for their sins."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et recordabor foederis mei, quod pepigi cum Jacob, et Isaac, et Abraham. Terrae quoque memor ero:"
      en: "And I will remember my covenant, that I made with Jacob, and Isaac, and Abraham. I will remember also the land:"
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "quae cum relicta fuerit ab eis, complacebit sibi in sabbatis suis, patiens solitudinem propter illos. Ipsi vero rogabunt pro peccatis suis, eo quod abjecerint judicia mea, et leges meas despexerint."
      en: "Which when she shall be left by them, shall enjoy her sabbaths, being desolate for them. But they shall pray for their sins, because they rejected my judgments, and despised my laws."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et tamen etiam cum essent in terra hostili, non penitus abjeci eos, neque sic despexi ut consumerentur, et irritum facerent pactum meum cum eis. Ego enim sum Dominus Deus eorum,"
      en: "And yet for all that when they were in the land of their enemies, I did not cast them off altogether, neither did I so despise them that they should be quite consumed, and I should make void my covenant with them. For I am the Lord their God."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "et recordabor foederis mei pristini, quando eduxi eos de terra Aegypti in conspectu gentium, ut essem Deus eorum. Ego Dominus. Haec sunt judicia atque praecepta et leges quas dedit Dominus inter se et filios Israel in monte Sinai per manum Moysi."
      en: "And I will remember my former covenant, when I brought them out of the land of Egypt, in the sight of the Gentiles, to be their God. I am the Lord. These are the judgments, and precepts, and laws, which the Lord gave between him and the children of Israel in mount Sinai by the hand of Moses."
    status: { la: verified, en: verified }
