# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 4
verses:
  - n: 1
    text:
      la: "Audite, filii, disciplinam patris, et attendite ut sciatis prudentiam."
      en: "Hear, ye children, the instruction of a father, and attend that you may know prudence."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Donum bonum tribuam vobis: legem meam ne derelinquatis."
      en: "I will give you a good gift, forsake not my law."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Nam et ego filius fui patris mei, tenellus et unigenitus coram matre mea."
      en: "For I also was my father's son, tender and as an only son in the sight of my mother:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et docebat me, atque dicebat: Suscipiat verba mea cor tuum; custodi praecepta mea, et vives."
      en: "And he taught me, and said: Let thy heart receive my words, keep my commandments, and thou shalt live."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Posside sapientiam, posside prudentiam. Ne obliviscaris, neque declines a verbis oris mei."
      en: "Get wisdom, get prudence: forget not, neither decline from the words of my mouth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ne dimittas eam, et custodiet te: dilige eam, et conservabit te."
      en: "Forsake her not, and she shall keep thee: love her, and she shall preserve thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Principium sapientiae, posside sapientiam; et in omni possessione tua acquire prudentiam."
      en: "The beginning of wisdom, get wisdom, and with all thy possession purchase prudence."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Arripe illam, et exaltabit te; glorificaberis ab ea cum eam fueris amplexatus."
      en: "Take hold on her, and she shall exalt thee: thou shalt be glorified by her, when thou shalt embrace her."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Dabit capiti tuo augmenta gratiarum, et corona inclyta proteget te."
      en: "She shall give to thy head increase of graces, and protect thee with a noble crown."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Audi, fili mi, et suscipe verba mea, ut multiplicentur tibi anni vitae."
      en: "Hear, O my son, and receive my words, that years of life may be multiplied to thee."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Viam sapientiae monstrabo tibi; ducam te per semitas aequitatis;"
      en: "I will shew thee the way of wisdom, I will lead thee by the paths of equity:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quas cum ingressus fueris, non arctabuntur gressus tui, et currens non habebis offendiculum."
      en: "Which when thou shalt have entered, thy steps shall not be straitened, and when thou runnest thou shalt not meet a stumblingblock."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tene disciplinam, ne dimittas eam; custodi illam, quia ipsa est vita tua."
      en: "Take hold on instruction, leave it not: keep it, because it is thy life."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ne delecteris in semitis impiorum, nec tibi placeat malorum via."
      en: "Be not delighted in the paths of the wicked, neither let the way of evil men please thee."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Fuge ab ea, nec transeas per illam; declina, et desere eam."
      en: "Flee from it, pass not by it: go aside, and forsake it."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non enim dormiunt nisi malefecerint, et rapitur somnus ab eis nisi supplantaverint."
      en: "For they sleep not except they have done evil: and their sleep is taken away unless they have made some to fall."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Comedunt panem impietatis, et vinum iniquitatis bibunt."
      en: "They eat the bread of wickedness, and drink the wine of iniquity."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Justorum autem semita quasi lux splendens procedit, et crescit usque ad perfectam diem."
      en: "But the path of the just, as a shining light, goeth forwards and increaseth even to perfect day."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Via impiorum tenebrosa; nesciunt ubi corruant."
      en: "The way of the wicked is darksome: they know not where they fall."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Fili mi, ausculta sermones meos, et ad eloquia mea inclina aurem tuam."
      en: "My son, hearken to my words, and incline thy ear to my sayings."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Ne recedant ab oculis tuis, custodi ea in medio cordis tui:"
      en: "Let them not depart from thy eyes, keep them in the midst of thy heart:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "vita enim sunt invenientibus ea, et universae carni sanitas."
      en: "For they are life to those that find them, and health to all flesh."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Omni custodia serva cor tuum, quia ex ipso vita procedit."
      en: "With all watchfulness keep thy heart, because life issueth out from it."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Remove a te os pravum, et detrahentia labia sint procul a te."
      en: "Remove from thee a froward mouth, and let detracting lips be far from thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Oculi tui recta videant, et palpebrae tuae praecedant gressus tuos."
      en: "Let thy eyes look straight on, and let thy eyelids go before thy steps."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Dirige semitam pedibus tuis, et omnes viae tuae stabilientur."
      en: "Make straight the path for thy feet, and all thy ways shall be established."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ne declines ad dexteram neque ad sinistram; averte pedem tuum a malo: vias enim quae a dextris sunt novit Dominus: perversae vero sunt quae a sinistris sunt. Ipse autem rectos faciet cursus tuos, itinera autem tua in pace producet."
      en: "Decline not to the right hand, nor to the left: turn away thy foot from evil. For the Lord knoweth the ways that are on the right hand: but those are perverse which are on the left hand. But he will make thy courses straight, he will bring forward thy ways in peace."
    status: { la: verified, en: verified }
