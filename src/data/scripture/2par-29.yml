# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 2par
chapter: 29
verses:
  - n: 1
    text:
      la: "Igitur Ezechias regnare coepit, cum viginti quinque esset annorum, et viginti novem annis regnavit in Jerusalem: nomen matris ejus Abia, filia Zachariae."
      en: "Now Ezechias began to reign, when he was five and twenty years old, and he reigned nine and twenty years in Jerusalem: the name of his mother was Abia, the daughter of Zacharias."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Fecitque quod erat placitum in conspectu Domini juxta omnia quae fecerat David pater ejus."
      en: "And he did that which was pleasing in the sight of the Lord, according to all that David his father had done."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ipse anno, et mense primo regni sui, aperuit valvas domus Domini, et instauravit eas."
      en: "In the first year and month of his reign he opened the doors of the house of the Lord, and repaired them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Adduxitque sacerdotes atque Levitas, et congregavit eos in plateam orientalem."
      en: "And he brought the priests and the Levites, and assembled them in the east street."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixitque ad eos: Audite me, Levitae, et sanctificamini: mundate domum Domini Dei patrum vestrorum, et auferte omnem immunditiam de sanctuario."
      en: "And he said to them: Hear me, ye Levites, and be sanctified, purify the house of the Lord the God of your fathers, and take away all filth out of the sanctuary."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Peccaverunt patres nostri, et fecerunt malum in conspectu Domini Dei nostri, derelinquentes eum: averterunt facies suas a tabernaculo Domini, et praebuerunt dorsum."
      en: "Our fathers have sinned and done evil in the sight of the Lord God, forsaking him: they have turned away their faces from the tabernacle of the Lord, and turned their backs."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Clauserunt ostia, quae erant in porticu, et extinxerunt lucernas, incensumque non adoleverunt, et holocausta non obtulerunt in sanctuario Deo Israel."
      en: "They have shut up the doors that were in the porch, and put out the lamps. and have not burnt incense, nor offered holocausts in the sanctuary of the God of Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Concitatus est itaque furor Domini super Judam et Jerusalem, tradiditque eos in commotionem, et in interitum, et in sibilum, sicut ipsi cernitis oculis vestris."
      en: "Therefore the wrath of the Lord hath been stirred up against Juda and Jerusalem, and he hath delivered them to trouble, and to destruction, and to be hissed at, as you see with your eyes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "En corruerunt patres nostri gladiis: filii nostri, et filiae nostrae, et conjuges captivae ductae sunt propter hoc scelus."
      en: "Behold, our fathers are fallen by the sword, our sons, and our daughters, and wives are led away captives for this wickedness."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Nunc ergo placet mihi ut ineamus foedus cum Domino Deo Israel, et avertet a nobis furorem irae suae."
      en: "Now therefore I have a mind that we make a covenant with the Lord the God of Israel, and he will turn away the wrath of his indignation from us."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Filii mei, nolite negligere: vos elegit Dominus ut stetis coram eo, et ministretis illi, colatisque eum, et cremetis ei incensum."
      en: "My sons, be not negligent: the Lord hath chosen you to stand before him, and to minister to him, and to worship him, and to burn incense to him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Surrexerunt ergo Levitae: Mahath filius Amasai, et Joel filius Azariae de filiis Caath: porro de filiis Merari, Cis filius Abdi, et Azarias filius Jalaleel. De filiis autem Gersom, Joah filius Zemma, et Eden filius Joah."
      en: "Then the Levites arose, Mahath the son of Amasai, and Joel the son of Azarias, of the sons of Caath: and of the sons of Merari, Cis the son of Abdi, and Azarias the son of Jalaleel. And of the sons of Gerson, Joah the son of Zemma, and Eden the son of Joah."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "At vero de filiis Elisaphan, Samri, et Jahiel. De filiis quoque Asaph, Zacharias, et Mathanias:"
      en: "And of the sons of Elisaphan, Samri, and Jahiel. Also of the sons of Asaph, Zacharias, and Mathanias."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "necnon de filiis Heman, Jahiel, et Semei: sed et de filiis Idithun, Semeias, et Oziel."
      en: "And of the sons of Heman, Jahiel, and Semei: and of the sons of Idithun, Semeias, and Oziel."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Congregaveruntque fratres suos, et sanctificati sunt, et ingressi sunt juxta mandatum regis et imperium Domini, ut expiarent domum Dei."
      en: "And they gathered together their brethren, and sanctified themselves, and went in according to the commandment of the king, and the precept of the Lord, to purify the house of God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sacerdotes quoque ingressi templum Domini ut sanctificarent illud, extulerunt omnem immunditiam, quam intro repererant in vestibulo domus Domini, quam tulerunt Levitae, et asportaverunt ad torrentem Cedron foras."
      en: "And the priests went into the temple of the Lord to sanctify it, and brought out all the uncleanness that they found within to the entrance of the house of the Lord, and the Levites took it away, and carried it out abroad to the torrent Cedron."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Coeperunt autem prima die mensis primi mundare, et in die octavo ejusdem mensis ingressi sunt porticum templi Domini, expiaveruntque templum diebus octo, et in die sextadecima mensis ejusdem, quod coeperant, impleverunt."
      en: "And they began to cleanse on the first day of the first month, and on the eighth day of the same month they came into the porch of the temple of the Lord, and they purified the temple in eight days, and on the sixteenth day of the same month they finished what they had begun."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ingressi quoque sunt ad Ezechiam regem, et dixerunt ei: Sanctificavimus omnem domum Domini, et altare holocausti, vasaque ejus, necnon et mensam propositionis cum omnibus vasis suis,"
      en: "And they went in to king Ezechias, and said to him: We have sanctified all the house of the Lord, and the altar of holocaust, and the vessels thereof, and the table of proposition with all its vessels,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cunctamque templi supellectilem, quam polluerat rex Achaz in regno suo, postquam praevaricatus est: et ecce exposita sunt omnia coram altare Domini."
      en: "And all the furniture of the temple, which king Achaz in his reign had defiled, after his transgression; and behold they are all set forth before the altar of the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Consurgensque diluculo Ezechias rex, adunavit omnes principes civitatis, et ascendit in domum Domini:"
      en: "And king Ezechias rising early, assembled all the rulers of the city, and went up into the house of the Lord:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "obtuleruntque simul tauros septem, et arietes septem, agnos septem, et hircos septem pro peccato, pro regno, pro sanctuario, pro Juda: dixitque sacerdotibus filiis Aaron, ut offerrent super altare Domini."
      en: "And they offered together seven bullocks, and seven rams, and seven lambs, and seven he goats for sin, for the kingdom, for the sanctuary, for Juda: and he spoke to the priests the sons of Aaron, to offer them upon the altar of the Lord."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Mactaverunt igitur tauros, et susceperunt sanguinem sacerdotes, et fuderunt illum super altare, mactaverunt etiam arietes, et illorum sanguinem super altare fuderunt, immolaveruntque agnos, et fuderunt super altare sanguinem."
      en: "Therefore they killed the bullocks, and the priests took the blood, and poured it upon the altar; they killed also the rams, and their blood they poured also upon the altar, and they killed the lambs, and poured the blood upon the altar."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Applicuerunt hircos pro peccato coram rege, et universa multitudine, imposueruntque manus suas super eos:"
      en: "And they brought the he goats for sin before the king, and the whole multitude, and they laid their hand upon them:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "et immolaverunt illos sacerdotes, et asperserunt sanguinem eorum coram altare pro piaculo universi Israelis: pro omni quippe Israel praeceperat rex ut holocaustum fieret et pro peccato."
      en: "And the priests immolated them, and sprinkled their blood before the altar for an expiation of all Israel: for the king had commanded that the holocaust and the sin offering should be made for all Israel."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Constituit quoque Levitas in domo Domini cum cymbalis, et psalteriis, et citharis secundum dispositionem David regis, et Gad videntis, et Nathan prophetae: siquidem Domini praeceptum fuit per manum prophetarum ejus."
      en: "And he set the Levites in the house of the Lord with cymbals, and psalteries, and harps according to the regulation of David the king, and of Gad the seer, and of Nathan the prophet: for it was the commandment of the Lord by the hand of his prophets."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Steteruntque Levitae tenentes organa David, et sacerdotes tubas."
      en: "And the Levites stood, with the instruments of David, and the priests with trumpets."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Et jussit Ezechias ut offerrent holocausta super altare: cumque offerrentur holocausta, coeperunt laudes canere Domino, et clangere tubis, atque in diversis organis, quae David rex Israel praeparaverat, concrepare."
      en: "And Ezechias commanded that they should offer holocausts upon the altar: and when the holocausts were offered, they began to sing praises to the Lord, and to sound with trumpets, and divers instruments which David the king of Israel had prepared."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Omni autem turba adorante, cantores, et ii qui tenebant tubas, erant in officio suo donec compleretur holocaustum."
      en: "And all the multitude adored, and the singers, and the trumpeters, were in their office till the holocaust was finished."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Cumque finita esset oblatio, incurvatus est rex, et omnes qui erant cum eo, et adoraverunt."
      en: "And when the oblation was ended, the king, and all that were with him bowed down and adored."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Praecepitque Ezechias, et principes Levitis, ut laudarent Dominum sermonibus David, et Asaph videntis: qui laudaverunt eum magna laetitia, et incurvato genu adoraverunt."
      en: "And Ezechias and the princes commanded the Levites to praise the Lord with the words of David, and Asaph the seer: and they praised him with great joy, and bowing the knee adored."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Ezechias autem etiam haec addidit: Implestis manus vestras Domino: accedite, et offerte victimas et laudes in domo Domini. Obtulit ergo universa multitudo hostias, et laudes, et holocausta mente devota."
      en: "And Ezechias added, and said: You have filled your hands to the Lord, come and offer victims, and praises in the house of the Lord. And all the multitude offered victims, and praises, and holocausts with a devout mind."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Porro numerus holocaustorum, quae obtulit multitudo, hic fuit: tauros septuaginta, arietes centum, agnos ducentos."
      en: "And the number of the holocausts which the multitude offered, was seventy bullocks, a hundred rams, and two hundred lambs."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Sanctificaveruntque Domino boves sexcentos, et oves tria millia."
      en: "And they consecrated to the Lord six hundred oxen, and three thousand sheep."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Sacerdotes vero pauci erant, nec poterant sufficere ut pelles holocaustorum detraherent: unde et Levitae fratres eorum adjuverunt eos, donec impleretur opus, et sanctificarentur antistites: Levitae quippe faciliori ritu sanctificantur, quam sacerdotes."
      en: "But the priests were few, and were not enough to flay the holocausts: wherefore the Levites their brethren helped them, till the work was ended, and priests were sanctified, for the Levites are sanctified with an easier rite than the priests."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Fuerunt ergo holocausta plurima, adipes pacificorum, et libamina holocaustorum: et completus est cultus domus Domini."
      en: "So there were many holocausts, and the fat of peace offerings, and the libations of holocausts: and the service of the house of the Lord was completed."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Laetatusque est Ezechas, et omnis populus, eo quod ministerium Domini esset expletum: de repente quippe hoc fieri placuerat."
      en: "And Ezechias, and all the people rejoiced because the ministry of the Lord was accomplished. For the resolution of doing this thing was taken suddenly."
    status: { la: verified, en: verified }
