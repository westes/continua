# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 13
verses:
  - n: 1
    text:
      la: "Qui tetigerit picem inquinabitur ab ea: et qui communicaverit superbo induet superbiam."
      en: "He that toucheth pitch, shall be defiled with it: and he that hath fellowship with the proud, shall put on pride."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Pondus super se tollat qui honestiori se communicat, et ditiori te ne socius fueris."
      en: "He shall take a burden upon him that hath fellowship with one more honourable than himself. And have no fellowship with one that is richer than thyself."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quid communicabit cacabus ad ollam? quando enim se colliserint, confringetur."
      en: "What agreement shall the earthen pot have with the kettle? for if they knock one against the other, it shall be broken."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dives injuste egit, et fremet: pauper autem laesus tacebit."
      en: "The rich man hath done wrong, and yet he will fume: but the poor is wronged and must hold his peace."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Si largitus fueris, assumet te: et si non habueris, derelinquet te."
      en: "If thou give, he will make use of thee: and if thou have nothing, he will forsake thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Si habes, convivet tecum, et evacuabit te: et ipse non dolebit super te."
      en: "If thou have any thing, he will live with thee, and will make thee bare, and he will not be sorry for thee."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Si necessarius illi fueris, supplantabit te, et subridens spem dabit, narrans tibi bona, et dicet: Quid opus est tibi?"
      en: "If he have need of thee he will deceive thee, and smiling upon thee will put thee in hope; he will speak thee fair, and will say: What wantest thou?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et confundet te in cibis suis, donec te exinaniat bis et ter: et in novissimo deridebit te, et postea videns derelinquet te, et caput suum movebit ad te."
      en: "And he will shame thee by his meats, till he have drawn thee dry twice or thrice, and at last he will laugh at thee: and afterward when he seeth thee, he will forsake thee, and shake his head at thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Humiliare Deo, et exspecta manus ejus."
      en: "Humble thyself to God, and wait for his hands."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Attende ne seductus in stultitiam humilieris."
      en: "Beware that thou be not deceived into folly, and be humbled."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Noli esse humilis in sapientia tua, ne humiliatus in stultitiam seducaris."
      en: "Be not lowly in thy wisdom, lest being humbled thou be deceived into folly."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Advocatus a potentiore, discede: ex hoc enim magis te advocabit."
      en: "If thou be invited by one that is mightier, withdraw thyself: for so he will invite thee the more."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ne improbus sis, ne impingaris: et ne longe sis ab eo, ne eas in oblivionem."
      en: "Be not troublesome to him, lest thou be put back: and keep not far from him, lest thou be forgotten."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Ne retineas ex aequo loqui cum illo, nec credas multis verbis illius: ex multa enim loquela tentabit te, et subridens interrogabit te de absconditis tuis."
      en: "Affect not to speak with him as an equal: and believe not his many words: for by much talk he will sift thee, and smiling will examine thee concerning thy secrets."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Immitis animus illius conservabit verba tua: et non parcet de malitia, et de vinculis."
      en: "His cruel mind will lay up thy words: and he will not spare to do thee hurt, and to cast thee into prison."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Cave tibi, et attende diligenter auditui tuo, quoniam cum subversione tua ambulas:"
      en: "Take heed to thyself, and attend diligently to what thou hearest: for thou walkest in danger of thy ruin."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "audiens vero illa, quasi in somnis vide, et vigilabis."
      en: "When thou hearest those things, see as it were in sleep, and thou shalt awake."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Omni vita tua dilige Deum, et invoca illum in salute tua."
      en: "Love God all thy life, and call upon him for thy salvation."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Omne animal diligit simile sibi, sic et omnis homo proximum sibi."
      en: "Every beast loveth its like: so also every man him that is nearest to himself."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Omnis caro ad similem sibi conjungetur, et omnis homo simili sui sociabitur."
      en: "All flesh shall consort with the like to itself, and every man shall associate himself to his like."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Si communicabit lupus agno aliquando, sic peccator justo."
      en: "If the wolf shall at any time have fellowship with the lamb, so the sinner with the just."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Quae communicatio sancto homini ad canem? aut quae pars diviti ad pauperem?"
      en: "What fellowship hath a holy man with a dog, or what part hath the rich with the poor?"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Venatio leonis onager in eremo: sic et pascua divitum sunt pauperes."
      en: "The wild ass is the lion's prey in the desert: so also the poor are devoured by the rich."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et sicut abominatio est superbo humilitas, sic et execratio divitis pauper."
      en: "And as humility is an abomination to the proud: so also the rich man abhorreth the poor."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Dives commotus confirmatur ab amicis suis: humilis autem cum ceciderit, expelletur et a notis."
      en: "When a rich man is shaken, he is kept up by his friends: but when a poor man is fallen down, he is thrust away even by his acquaintance."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Diviti decepto multi recuperatores: locutus est superbia, et justificaverunt illum."
      en: "When a rich man hath been deceived, he hath many helpers: he hath spoken proud things, and they have justified him."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Humilis deceptus est, insuper et arguitur: locutus est sensate, et non est datus ei locus."
      en: "The poor man was deceived, and he is rebuked also: he hath spoken wisely, and could have no place."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Dives locutus est, et omnes tacuerunt, et verbum illius usque ad nubes perducent."
      en: "The rich man spoke, and all held their peace, and what he said they extol even to the clouds."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Pauper locutus est, et dicunt: Quis est hic? et si offenderit, subvertent illum."
      en: "The poor man spoke, and they say: Who is this? and if he stumble, they will overthrow him."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Bona est substantia cui non est peccatum in conscientia: et nequissima paupertas in ore impii."
      en: "Riches are good to him that hath no sin in his conscience: and poverty is very wicked in the mouth of the ungodly."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Cor hominis immutat faciem illius, sive in bona, sive in mala."
      en: "The heart of a man changeth his countenance, either for good, or for evil."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Vestigium cordis boni et faciem bonam difficile invenies, et cum labore."
      en: "The token of a good heart, and a good countenance thou shalt hardly find, and with labour."
    status: { la: verified, en: verified }
