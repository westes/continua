# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 28
verses:
  - n: 1
    text:
      la: "vocavit itaque Isaac Iacob et benedixit praecepitque ei dicens noli accipere coniugem de genere Chanaan"
      en: "And Isaac called Jacob, and blessed him, and charged him, saying: Take not a wife of the stock of Chanaan:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sed vade et proficiscere in Mesopotamiam Syriae ad domum Bathuel patrem matris tuae et accipe tibi inde uxorem de filiabus Laban avunculi tui"
      en: "But go, and take a journey to Mesopotamia of Syria, to the house of Bathuel thy mother's father, and take thee a wife thence of the daughters of Laban thy uncle."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Deus autem omnipotens benedicat tibi et crescere te faciat atque multiplicet ut sis in turbas populorum"
      en: "And God almighty bless thee, and make thee to increase, and multiply thee: that thou mayst be a multitude of people."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et det tibi benedictiones Abraham et semini tuo post te ut possideas terram peregrinationis tuae quam pollicitus est avo tuo"
      en: "And give the blessings of Abrabam to thee, and to thy seed after thee: that thou mayst possess the land of thy sojournment, which he promised to thy grandfather."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque dimisisset eum Isaac profectus venit in Mesopotamiam Syriae ad Laban filium Bathuel Syri fratrem Rebeccae matris suae"
      en: "And when Isaac had sent him away, he took his journey and went to Mesopotamia of Syria to Laban the son of Bathuel the Syrian, brother to Rebecca his mother."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "videns autem Esau quod benedixisset pater suus Iacob et misisset eum in Mesopotamiam Syriae ut inde uxorem duceret et quod post benedictionem praecepisset ei dicens non accipies coniugem de filiabus Chanaan"
      en: "And Esau seeing that his father had blessed Jacob, and had sent him into Mesopotamia of Syria, to marry a wife thence; and that after the blessing he had charged him, saying: Thou shalt not take a wife of the daughters of Chanaan:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quodque oboediens Iacob parentibus isset in Syriam"
      en: "And that Jacob obeying his parents was gone into Syria:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "probans quoque quod non libenter aspiceret filias Chanaan pater suus"
      en: "Experiencing also that his father was not well pleased with the daughters of Chanaan:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "ivit ad Ismahelem et duxit uxorem absque his quas prius habebat Maeleth filiam Ismahel filii Abraham sororem Nabaioth"
      en: "He went to Ismael, and took to wife, besides them he had before, Maheleth the daughter of Ismael, Abraham's son, the sister of Nabajoth."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "igitur egressus Iacob de Bersabee pergebat Haran"
      en: "But Jacob being departed from Bersabee, went on to Haran."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "cumque venisset ad quendam locum et vellet in eo requiescere post solis occubitum tulit de lapidibus qui iacebant et subponens capiti suo dormivit in eodem loco"
      en: "And when he was come to a certain place, and would rest in it after sunset, he took of the stones that lay there, and putting under his head, slept in the same place."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "viditque in somnis scalam stantem super terram et cacumen illius tangens caelum angelos quoque Dei ascendentes et descendentes per eam"
      en: "And he saw in his sleep a ladder standing upon the earth, and the top thereof touching heaven: the angels also of God ascending and descending by it;"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et Dominum innixum scalae dicentem sibi ego sum Dominus Deus Abraham patris tui et Deus Isaac terram in qua dormis tibi dabo et semini tuo"
      en: "And the Lord leaning upon the ladder, saying to him: I am the Lord God of Abraham thy father, and the God of Isaac; the land, wherein thou sleepest, I will give to thee and to thy seed."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "eritque germen tuum quasi pulvis terrae dilataberis ad occidentem et orientem septentrionem et meridiem et benedicentur in te et in semine tuo cunctae tribus terrae"
      en: "And thy seed shall be as the dust of the earth: thou shalt spread abroad to the west, and to the east, and to the north, and to the south: and IN THEE and thy seed all the tribes of the earth SHALL BE BLESSED."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et ero custos tuus quocumque perrexeris et reducam te in terram hanc nec dimittam nisi conplevero universa quae dixi"
      en: "And I will be thy keeper whithersoever thou goest, and will bring thee back into this land: neither will I leave thee, till I shall have accomplished all that I have said."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cumque evigilasset Iacob de somno ait vere Dominus est in loco isto et ego nesciebam"
      en: "And when Jacob awaked out of sleep, he said: Indeed the Lord is in this place, and I knew it not."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "pavensque quam terribilis inquit est locus iste non est hic aliud nisi domus Dei et porta caeli"
      en: "And trembling he said: How terrible is this place! this is no other but the house of God, and the gate of heaven."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "surgens ergo mane tulit lapidem quem subposuerat capiti suo et erexit in titulum fundens oleum desuper"
      en: "And Jacob, arising in the morning, took the stone, which he had laid under his head, and set it up for a title, pouring oil upon the top of it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "appellavitque nomen urbis Bethel quae prius Luza vocabatur"
      en: "And he called the name of the city Bethel, which before was called Luza."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "vovit etiam votum dicens si fuerit Deus mecum et custodierit me in via per quam ambulo et dederit mihi panem ad vescendum et vestem ad induendum"
      en: "And he made a vow, saying: If God shall be with me, and shall keep me in the way by which I walk, and shall give me bread to eat, and raiment to put on,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "reversusque fuero prospere ad domum patris mei erit mihi Dominus in Deum"
      en: "And I shall return prosperously to my father's house: the Lord shall be my God:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et lapis iste quem erexi in titulum vocabitur Domus Dei cunctorumque quae dederis mihi decimas offeram tibi"
      en: "And this stone, which I have set up for a title, shall called the house of God: and of all things that thou shalt give to me, I will offer tithes to thee."
    status: { la: verified, en: verified }
