# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jdc
chapter: 12
verses:
  - n: 1
    text:
      la: "Ecce autem in Ephraim orta est seditio: nam transeuntes contra aquilonem, dixerunt ad Jephte: Quare vadens ad pugnam contra filios Ammon, vocare nos noluisti, ut pergeremus tecum? igitur incendemus domum tuam."
      en: "But behold there arose a sedition in Ephraim. And passing towards the north, they said to Jephte: When thou wentest to fight against the children of Ammon, why wouldst thou not call us, that we might go with thee? Therefore we will burn thy house."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quibus ille respondit: Disceptatio erat mihi et populo meo contra filios Ammon vehemens: vocavique vos, ut praeberetis mihi auxilium, et facere noluistis."
      en: "And he answered them: I and my people were at great strife with the children of Ammon: and I called you to assist me, and you would not do it."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quod cernens, posui animam meam in manibus meis, transivique ad filios Ammon, et tradidit eos Dominus in manus meas. Quid commerui, ut adversum me consurgatis in praelium?"
      en: "And when I saw this, I put my life in my own hands, and passed over against the children of Ammon, and the Lord delivered them into my hands. What have I deserved, that you should rise up to fight against me?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Vocatis itaque ad se cunctis viris Galaad, pugnabat contra Ephraim: percusseruntque viri Galaad Ephraim, quia dixerat: Fugitivus est Galaad de Ephraim, et habitat in medio Ephraim et Manasse."
      en: "Then calling to him all the men of Galaad, he fought against Ephraim: and the men of Galaad defeated Ephraim, because he had said: Galaad is a fugitive of Ephraim, and dwelleth in the midst of Ephraim and Manasses."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Occupaveruntque Galaaditae vada Jordanis, per quae Ephraim reversurus erat. Cumque venisset ad ea de Ephraim numero, fugiens, atque dixisset: Obsecro ut me transire permittatis: dicebant ei Galaaditae: Numquid Ephrathaeus es? quo dicente: Non sum:"
      en: "And the Galaadites secured the fords of the Jordan, by which Ephraim was to return. And when any one of the number of Ephraim came thither in the flight, and said: I beseech you let me pass: the Galaadites said to him: Art thou not an Ephraimite? If he said: I am not:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "interrogabant eum: Dic ergo Scibboleth, quod interpretatur Spica. Qui respondebat, Sibboleth: eadem littera spicam exprimere non valens. Statimque apprehensum jugulabant in ipso Jordanis transitu. Et ceciderunt in illo tempore de Ephraim quadraginta duo millia."
      en: "They asked him: Say then, Scibboleth, which is interpreted, An ear of corn. But he answered, Sibboleth, not being able to express an ear of corn by the same letter. Then presently they took him and killed him in the very passage of the Jordan. And there fell at that time of Ephraim two and forty thousand."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Judicavit itaque Jephte Galaadites Israel sex annis: et mortuus est, ac sepultus in civitate sua Galaad."
      en: "And Jephte the Galaadite judged Israel six years: and he died, and was buried in his city of Galaad."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Post hunc judicavit Israel Abesan de Bethlehem:"
      en: "After him Abesan of Bethlehem judged Israel:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "qui habuit triginta filios, et totidem filias, quas emittens foras, maritis dedit, et ejusdem numeri filiis suis accepit uxores, introducens in domum suam. Qui septem annis judicavit Israel:"
      en: "He had thirty sons, and as many daughters, whom he sent abroad, and gave to husbands, and took wives for his sons of the same number, bringing them into his house. And he judged Israel seven years:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "mortuusque est, ac sepultus in Bethlehem."
      en: "And he died, and was buried in Bethlehem."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cui successit Ahialon Zabulonites: et judicavit Israel decem annis:"
      en: "To him succeeded Ahialon a Zabulonite: and he judged Israel ten years:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "mortuusque est, ac sepultus in Zabulon."
      en: "And he died, and was buried in Zabulon."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Post hunc judicavit Israel Abdon filius Illel Pharathonites:"
      en: "After him Abdon, the son of Illel, a Pharathonite, judged Israel:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "qui habuit quadraginta filios, et triginta ex eis nepotes, ascendentes super septuaginta pullos asinarum. Et judicavit Israel octo annis:"
      en: "And he had forty sons, and of them thirty grandsons, mounted upon seventy ass colts, and he judged Israel eight years:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "mortuusque est, ac sepultus in Pharathon terrae Ephraim, in monte Amalec."
      en: "And he died, and was buried in Pharathon in the land of Ephraim, in the mount of Amalech."
    status: { la: verified, en: verified }
