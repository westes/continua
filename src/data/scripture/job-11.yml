# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 11
verses:
  - n: 1
    text:
      la: "Respondens autem Sophar Naamathites, dixit:"
      en: "Then Sophar the Naamathite answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Numquid qui multa loquitur, non et audiet? aut vir verbosus justificabitur?"
      en: "Shall not he that speaketh much, hear also? or shall a man full of talk be justified?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Tibi soli tacebunt homines? et cum ceteros irriseris, a nullo confutaberis?"
      en: "Shall men hold their peace to thee only? and when thou hast mocked others, shall no man confute thee?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Dixisti enim: Purus est sermo meus, et mundus sum in conspectu tuo."
      en: "For thou hast said: My word is pure, and I am clean in thy sight."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Atque utinam Deus loqueretur tecum, et aperiret labia sua tibi,"
      en: "And I wish that God would speak with thee, and would open his lips to thee,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut ostenderet tibi secreta sapientiae, et quod multiplex esset lex ejus, et intelligeres quod multo minora exigaris ab eo quam meretur iniquitas tua!"
      en: "That he might shew thee the secrets of wisdom, and that his law is manifold, and thou mightest understand that he exacteth much less of thee, than thy iniquity deserveth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Forsitan vestigia Dei comprehendes, et usque ad perfectum Omnipotentem reperies?"
      en: "Peradventure thou wilt comprehend the steps of God, and wilt find out the Almighty perfectly?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Excelsior caelo est, et quid facies? profundior inferno, et unde cognosces?"
      en: "He is higher than heaven, and what wilt thou do? he is deeper than hell, and how wilt thou know?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Longior terra mensura ejus et latior mari."
      en: "The measure of him is longer than the earth, and broader than the sea."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Si subverterit omnia, vel in unum coarctaverit, quis contradicet ei?"
      en: "If he shall overturn all things, or shall press them together, who shall contradict him?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ipse enim novit hominum vanitatem; et videns iniquitatem, nonne considerat?"
      en: "For he knoweth the vanity of men, and when he seeth iniquity, doth he not consider it?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Vir vanus in superbiam erigitur, et tamquam pullum onagri se liberum natum putat."
      en: "A vain man is lifted up into pride, and thinketh himself born free like a wild ass's colt."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Tu autem firmasti cor tuum, et expandisti ad eum manus tuas."
      en: "But thou hast hardened thy heart, and hast spread thy hands to him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Si iniquitatem quae est in manu tua abstuleris a te, et non manserit in tabernaculo tuo injustitia,"
      en: "If thou wilt put away from thee the iniquity that is in thy hand, and let not injustice remain in thy tabernacle:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "tunc levare poteris faciem tuam absque macula; et eris stabilis, et non timebis."
      en: "Then mayst thou lift up thy face without spot, and thou shalt be steadfast, and shalt not fear."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Miseriae quoque oblivisceris et quasi aquarum quae praeterierunt recordaberis."
      en: "Thou shalt also forget misery, and remember it only as waters that are passed away."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et quasi meridianus fulgor consurget tibi ad vesperam; et cum te consumptum putaveris, orieris ut lucifer."
      en: "And brightness like that of the noonday, shall arise to thee at evening: and when thou shalt think thyself consumed, thou shalt rise as the day star."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et habebis fiduciam, proposita tibi spe, et defossus securus dormies."
      en: "And thou shalt have confidence, hope being set before thee, and being buried thou shalt sleep secure."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Requiesces, et non erit qui te exterreat; et deprecabuntur faciem tuam plurimi."
      en: "Thou shalt rest, and there shall be none to make thee afraid: and many shall entreat thy face."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Oculi autem impiorum deficient, et effugium peribit ab eis, et spes illorum abominatio animae."
      en: "But the eyes of the wicked shall decay, and the way to escape shall fail them, and their hope the abomination of the soul."
    status: { la: verified, en: verified }
