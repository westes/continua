book: 1reg
chapter: 4
verses:
  - n: 1
    text:
      la: "egressus est namque Israhel obviam Philisthim in proelium et castrametatus est iuxta lapidem Adiutorii porro Philisthim venerunt in Afec"
      en: "And it came to pass in those days, that the Philistines gathered themselves together to fight: and Israel went out to war against the Philistines, and camped by the Stone of help. And the Philistines came to Aphec,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et instruxerunt aciem contra Israhel inito autem certamine terga vertit Israhel Philistheis et caesa sunt in illo certamine passim per agros quasi quattuor milia virorum"
      en: "And put their army in array against Israel. And when they had joined battle, Israel turned their backs to the Philistines, and there was slain in that fight here and there in the fields about four thousand men."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et reversus est populus ad castra dixeruntque maiores natu de Israhel quare percussit nos Dominus hodie coram Philisthim adferamus ad nos de Silo arcam foederis Domini et veniat in medium nostri ut salvet nos de manu inimicorum nostrorum"
      en: "And the people returned to the camp: and the ancients of Israel said: Why hath the Lord defeated us to day before the Philistines? Let us fetch unto us the ark of the covenant of the Lord from Silo, and let it come in the midst of us, that it may save us from the hand of our enemies."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "misit ergo populus in Silo et tulerunt inde arcam foederis Domini exercituum sedentis super cherubin erantque duo filii Heli cum arca foederis Domini Ofni et Finees"
      en: "So the people sent to Silo, and they brought from thence the ark of the covenant of the Lord of hosts sitting upon the cherubims: and the two sons of Heli, Ophni and Phinees, were with the ark of the covenant of God."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cumque venisset arca foederis Domini in castra vociferatus est omnis Israhel clamore grandi et personuit terra"
      en: "And when the ark of the covenant of the Lord was come into the camp, all Israel shouted with a great shout, and the earth rang again."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et audierunt Philisthim vocem clamoris dixeruntque quaenam haec est vox clamoris magni in castris Hebraeorum et cognoverunt quod arca Domini venisset in castra"
      en: "And the Philistines heard the noise of the shout, and they said: What is this noise of a great shout in the camp of the Hebrews? And they understood that the ark of the Lord was come into the camp."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "timueruntque Philisthim dicentes venit Deus in castra et ingemuerunt"
      en: "And the Philistines were afraid, saying: God is come into the camp. And sighing, they said:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "vae nobis non enim fuit tanta exultatio heri et nudius tertius vae nobis quis nos servabit de manu deorum sublimium istorum hii sunt dii qui percusserunt Aegyptum omni plaga in deserto"
      en: "Woe to us: for there was no such great joy yesterday and the day before: Woe to us. Who shall deliver us from the hand of these high gods? these are the gods that struck Egypt with all the plagues in the desert."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "confortamini et estote viri Philisthim ne serviatis Hebraeis sicut illi servierunt vobis confortamini et bellate"
      en: "Take courage and behave like men, ye Philistines: lest you come to be servants to the Hebrews, as they have served you: take courage and fight."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "pugnaverunt ergo Philisthim et caesus est Israhel et fugit unusquisque in tabernaculum suum et facta est plaga magna nimis et ceciderunt de Israhel triginta milia peditum"
      en: "So the Philistines fought, and Israel was overthrown, and every man fled to his own dwelling: and there was an exceeding great slaughter; for there fell of Israel thirty thousand footmen."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et arca Dei capta est duoque filii Heli mortui sunt Ofni et Finees"
      en: "And the ark of God was taken: and the two sons of Heli, Ophni and Phinees, were slain."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "currens autem vir de Beniamin ex acie venit in Silo in die illo scissa veste et conspersus pulvere caput"
      en: "And there ran a man of Benjamin out of the army, and came to Silo the same day, with his clothes rent, and his head strewed with dust."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cumque ille venisset Heli sedebat super sellam contra viam aspectans erat enim cor eius pavens pro arca Domini vir autem ille postquam ingressus est nuntiavit urbi et ululavit omnis civitas"
      en: "And when he was come, Heli sat upon a stool over against the way watching. For his heart was fearful for the ark of God. And when the man was come into the city, he told it: and all the city cried out."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et audivit Heli sonitum clamoris dixitque quis est hic sonitus tumultus huius at ille festinavit et venit et adnuntiavit Heli"
      en: "And Heli heard the noise of the cry, and he said: What meaneth the noise of this uproar? But he made haste, and came, and told Heli."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Heli autem erat nonaginta et octo annorum et oculi eius caligaverant et videre non poterat"
      en: "Now Heli was ninety and eight years old, and his eyes were dim, and he could not see."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dixit ad Heli ego sum qui veni de proelio et ego qui de acie fugi hodie cui ille ait quid actum est fili mi"
      en: "And he said to Heli: I am he that came from the battle, and have fled out of the field this day. And he said to him: What is there done, my son?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "respondens autem qui nuntiabat fugit inquit Israhel coram Philisthim et ruina magna facta est in populo insuper et duo filii tui mortui sunt Ofni et Finees et arca Dei capta est"
      en: "And he that brought the news answered, and said: Israel has fled before the Philistines, and there has been a great slaughter of the people: moreover thy two sons, Ophni and Phinees, are dead: and the ark of God is taken."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cumque ille nominasset arcam Dei cecidit de sella retrorsum iuxta ostium et fractis cervicibus mortuus est senex enim erat vir et grandevus et ipse iudicavit Israhel quadraginta annis"
      en: "And when he had named the ark of God, he fell from his stool backwards by the door, and broke his neck, and died. For he was an old man, and far advanced in years: and he judged Israel forty years."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "nurus autem eius uxor Finees praegnans erat vicinaque partui et audito nuntio quod capta esset arca Dei et mortuus socer suus et vir suus incurvavit se et peperit inruerant enim in eam dolores subiti"
      en: "And his daughter in law the wife of Phinees, was big with child, and near her time: and hearing the news that the ark of God was taken, and her father in law, and her husband, were dead, she bowed herself and fell in labour: for her pains came upon her on a sudden."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "in ipso autem momento mortis eius dixerunt ei quae stabant circa eam ne timeas quia filium peperisti quae non respondit eis neque animadvertit"
      en: "And when she was upon the point of death, they that stood about her said to her: Fear not, for thou hast borne a son. She answered them not, nor gave heed to them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et vocavit puerum Hicabod dicens translata est gloria de Israhel quia capta est arca Dei et pro socero suo et pro viro suo"
      en: "And she called the child Ichabod, saying: The glory is gone from Israel, because the ark of God was taken, and for her father in law, and her husband:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ait translata est gloria ab Israhel eo quod capta esset arca Dei"
      en: "And she said: The glory is departed from Israel, because the ark of God was taken."
    status: { la: verified, en: verified }
