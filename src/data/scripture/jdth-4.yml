# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 4
verses:
  - n: 1
    text:
      la: "tunc audientes haec filii Israhel qui habitabant in terra Iudaeae timuerunt valde a facie eius"
      en: "Then the children of Israel, who dwelt in the land of Juda, hearing these things, were exceedingly afraid of him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tremor etiam et horror invasit sensus eorum ne hoc faceret Hierusalem et templo Domini quod fecerat ceteris civitatibus et templis earum"
      en: "Dread and horror seized upon their minds, lest he should do the same to Jerusalem and to the temple of the Lord, that he had done to other cities and their temples."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et miserunt in omnem Samariam per circuitum usque Hiericho et praeoccupaverunt omnes vertices montium"
      en: "And they sent into all Samaria round about, as far as Jericho, and seized upon all the tops of the mountains:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et muris circumdederunt vicos suos et congregaverunt frumenta in praeparatione pugnae"
      en: "And they compassed their towns with walls, and gathered together corn for provision for war."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sacerdos etiam Heliachim scripsit ad universos qui erant contra Hesdraelon quae est contra faciem campi magni iuxta Dothain et universis per quos transitus esse poterat"
      en: "And Eliachim the priest wrote to all that were over against Esdrelon, which faceth the great plain near Dothain, and to all by whom there might be a passage of way, that they should take possession of the ascents of the mountains, by which there might be any way to Jerusalem, and should keep watch where the way was narrow between the mountains."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ut obtinerent ascensus montium per quos via esse poterat ad Hierusalem ut illic custodirent ubi angustum iter esse poterat inter montes"
      en: "And the children of Israel did as the priest of the Lord Eliachim had appointed them,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et fecerunt filii Israhel secundum quod constituerat eis sacerdos Domini Heliachim"
      en: "And all the people cried to the Lord with great earnestness, and they humbled their souls in fastings, and prayers, both they and their wives."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et clamavit omnis populus ad Dominum instantia magna et humiliaverunt animas suas in ieiuniis ipsi et mulieres eorum"
      en: "And the priests put on haircloths, and they caused the little children to lie prostrate before the temple of the Lord, and the altar of the Lord they covered with haircloth."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et induerunt se sacerdotes ciliciis et infantes prostraverunt contra faciem templi Domini et altare Domini operuerunt cilicio"
      en: "And they cried to the Lord the God of Israel with one accord, that their children might not be made a prey, and their wives carried off, and their cities destroyed, and their holy things profaned, and that they might not be made a reproach to the Gentiles."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et clamaverunt ad Deum Israhel unianimiter ne darentur in praedam infantes eorum et uxores eorum in divisionem et civitates eorum in exterminium et sancta eorum in pollutionibus"
      en: "Then Eliachim the high priest of the Lord went about all Israel and spoke to them,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "tunc Heliachim sacerdos Domini magnus circuivit omnem Israhel adlocutusque est eos"
      en: "Saying: Know ye that the Lord will hear your prayers, if you continue with perseverance in fastings and prayers in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dicens scitote quoniam exaudivit Dominus preces vestras si manentes permanseritis in ieiuniis et orationibus in conspectu Domini"
      en: "Remember Moses the servant of the Lord, who overcame Amalec that trusted in his own strength, and in his power, and in his army, and in his shields, and in his chariots, and in his horsemen, not by fighting with the sword, but by holy prayers:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "memores estote Mosi servi Domini qui Amalech confidentem in virtute sua et in potentia sua et in exercitu suo et in clypeis suis et in curribus suis et in equitibus suis non ferro pugnando sed precibus sanctis orando deiecit"
      en: "So shall all the enemies of Israel be, if you persevere in this work which you have begun."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "sic erunt universi hostes Israhel si perseveraveritis in hoc opere quo coepistis"
      en: "So they being moved by this exhortation of his, prayed to the Lord, and continued in the sight of the Lord."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ad hanc igitur exhortationem eius deprecantes Dominum permanebant in conspectu Domini"
      en: "So that even they who offered the holocausts to the Lord, offered the sacrifices to the Lord girded with haircloths, and with ashes upon their head."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ita ut etiam hii qui holocausta Domino offerebant praecincti ciliciis offerrent sacrificia Domino et erat cinis super capita eorum"
      en: "And they all begged of God with all their heart, that he would visit his people Israel."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et ex toto corde suo omnes orabant Deum ut visitaret populum suum Israhel"
      en: ""
    status: { la: verified, en: missing }
