# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 2thess
chapter: 3
verses:
  - n: 1
    text:
      la: "de cetero fratres orate pro nobis ut sermo Domini currat et clarificetur sicut et apud vos"
      en: "For the rest, brethren, pray for us, that the word of God may run, and may be glorified, even as among you;"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et ut liberemur ab inportunis et malis hominibus non enim omnium est fides"
      en: "And that we may be delivered from importunate and evil men; for all men have not faith."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "fidelis autem Dominus est qui confirmabit vos et custodiet a malo"
      en: "But God is faithful, who will strengthen and keep you from evil."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "confidimus autem de vobis in Domino quoniam quae praecipimus et facitis et facietis"
      en: "And we have confidence concerning you in the Lord, that the things which we command, you both do, and will do."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dominus autem dirigat corda vestra in caritate Dei et patientia Christi"
      en: "And the Lord direct your hearts, in the charity of God, and the patience of Christ."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "denuntiamus autem vobis fratres in nomine Domini nostri Iesu Christi ut subtrahatis vos ab omni fratre ambulante inordinate et non secundum traditionem quam acceperunt a nobis"
      en: "And we charge you, brethren, in the name of our Lord Jesus Christ, that you withdraw yourselves from every brother walking disorderly, and not according to the tradition which they have received of us."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ipsi enim scitis quemadmodum oporteat imitari nos quoniam non inquieti fuimus inter vos"
      en: "For yourselves know how you ought to imitate us: for we were not disorderly among you;"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "neque gratis panem manducavimus ab aliquo sed in labore et fatigatione nocte et die operantes ne quem vestrum gravaremus"
      en: "Neither did we eat any man's bread for nothing, but in labour and in toil we worked night and day, lest we should be chargeable to any of you."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "non quasi non habuerimus potestatem sed ut nosmet ipsos formam daremus vobis ad imitandum nos"
      en: "Not as if we had not power: but that we might give ourselves a pattern unto you, to imitate us."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "nam et cum essemus apud vos hoc denuntiabamus vobis quoniam si quis non vult operari nec manducet"
      en: "For also when we were with you, this we declared to you: that, if any man will not work, neither let him eat."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "audimus enim inter vos quosdam ambulare inquiete nihil operantes sed curiose agentes"
      en: "For we have heard there are some among you who walk disorderly, working not at all, but curiously meddling."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "his autem qui eiusmodi sunt denuntiamus et obsecramus in Domino Iesu Christo ut cum silentio operantes suum panem manducent"
      en: "Now we charge them that are such, and beseech them by the Lord Jesus Christ, that, working with silence, they would eat their own bread."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "vos autem fratres nolite deficere benefacientes"
      en: "But you, brethren, be not weary in well doing."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quod si quis non oboedit verbo nostro per epistulam hunc notate et non commisceamini cum illo ut confundatur"
      en: "And if any man obey not our word by this epistle, note that man, and do not keep company with him, that he may be ashamed:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "et nolite quasi inimicum existimare sed corripite ut fratrem"
      en: "Yet do not esteem him as an enemy, but admonish him as a brother."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "ipse autem Dominus pacis det vobis pacem sempiternam in omni loco Dominus cum omnibus vobis"
      en: "Now the Lord of peace himself give you everlasting peace in every place. The Lord be with you all."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "salutatio mea manu Pauli quod est signum in omni epistula ita scribo"
      en: "The salutation of Paul with my own hand; which is the sign in every epistle. So I write."
    status: { la: verified, en: verified }
