# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 4reg
chapter: 24
verses:
  - n: 1
    text:
      la: "In diebus ejus ascendit Nabuchodonosor rex Babylonis, et factus est ei Joakim servus tribus annis: et rursum rebellavit contra eum."
      en: "In his days Nabuchodonosor king of Babylon came up, and Joakim became his servant three years: then again he rebelled against him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Immisitque ei Dominus latrunculos Chaldaeorum, et latrunculos Syriae, et latrunculos Moab, et latrunculos filiorum Ammon: et immisit eos in Judam, ut disperderent eum, juxta verbum Domini, quod locutus fuerat per servos suos prophetas."
      en: "And the Lord sent against him the rovers of the Chaldees, and the rovers of Syria, and the rovers of Moab, and the rovers of the children of Ammon: and he sent them against Juda, to destroy it, according to the word of the Lord, which he had spoken by his servants the prophets."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Factum est autem hoc per verbum Domini contra Judam, ut auferret eum coram se propter peccata Manasse universa quae fecit,"
      en: "And this came by the word of the Lord against Juda, to remove them from before him for all the sins of Manasses which he did."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et propter sanguinem innoxium, quem effudit, et implevit Jerusalem cruore innocentium: et ob hanc rem noluit Dominus propitiari."
      en: "And for the innocent blood that he shed, filling Jerusalem with innocent blood: and therefore the Lord would not be appeased."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Reliqua autem sermonum Joakim, et universa quae fecit, nonne haec scripta sunt in libro sermonum dierum regum Juda? Et dormivit Joakim cum patribus suis:"
      en: "But the rest of the acts of Joakim, and all that he did, are they not written in the book of the words of the days of the kings of Juda? And Joakim slept with his fathers:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et regnavit Joachin filius ejus pro eo."
      en: "And Joachin his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et ultra non addidit rex Aegypti, ut egrederetur de terra sua: tulerat enim rex Babylonis a rivo Aegypti usque ad fluvium Euphraten, omnia quae fuerant regis Aegypti."
      en: "And the king of Egypt came not again any more out of his own country: for the king of Babylon had taken all that had belonged to the king of Egypt, from the river of Egypt, unto the river Euphrates."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Decem et octo annorum erat Joachin cum regnare coepisset, et tribus mensibus regnavit in Jerusalem: nomen matris ejus Nohesta filia Elnathan de Jerusalem."
      en: "Joachin was eighteen years old when he began to reign, a and he reigned three months in Jerusalem: the name of his mother was Nohesta the daughter of Elnathan of Jerusalem."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et fecit malum coram Domino, juxta omnia quae fecerat pater ejus."
      en: "And he did evil before the Lord, according to all that his father had done."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "In tempore illo ascenderunt servi Nabuchodonosor regis Babylonis in Jerusalem, et circumdata est urbs munitionibus."
      en: "At that time the servants of Nabuchodonosor king of Babylon came up against Jerusalem, and the city was surrounded with their forts."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Venitque Nabuchodonosor rex Babylonis ad civitatem cum servis suis ut oppugnarent eam."
      en: "And Nabuchodonosor king of Babylon came to the city with his servants to assault it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Egressusque est Joachin rex Juda ad regem Babylonis, ipse et mater ejus, et servi ejus, et principes ejus, et eunuchi ejus: et suscepit eum rex Babylonis anno octavo regni sui."
      en: "And Joachin king of Juda went out to the king of Babylon, he and his mother, and his servants, and his nobles, and his eunuchs: and the king of Babylon received him in the eighth year of his reign."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et protulit inde omnes thesauros domus Domini, et thesauros domus regiae: et concidit universa vasa aurea, quae fecerat Salomon rex Israel in templo Domini juxta verbum Domini."
      en: "And he brought out from thence all the treasures of the house of the Lord, and the treasures of the king's house: and he cut in pieces all the vessels of gold which Solomon king of Israel had made in the temple of the Lord, according to the word of the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et transtulit omnem Jerusalem, et universos principes, et omnes fortes exercitus, decem millia, in captivitatem: et omnem artificem et clusorem: nihilque relictum est, exceptis pauperibus populi terrae."
      en: "And he carried away all Jerusalem, and all the princes, and all the valiant men of the army, to the number of ten thousand into captivity: and every artificer and smith: and none were left, but the poor sort of the people of the land."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Transtulit quoque Joachin in Babylonem, et matrem regis, et uxores regis, et eunuchos ejus: et judices terrae duxit in captivitatem de Jerusalem in Babylonem."
      en: "And he carried away Joachin into Babylon, and the king's mother, and the king's wives, and his eunuchs: and the judges of the land he carried into captivity from Jerusalem into Babylon."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et omnes viros robustos, septem millia, et artifices, et clusores mille, omnes viros fortes et bellatores: duxitque eos rex Babylonis captivos in Babylonem."
      en: "And all the strong men, seven thousand, and the artificers, and the smiths a thousand, all that were valiant men and fit for war: and the king of Babylon led them captives into Babylon."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et constituit Matthaniam patruum ejus pro eo: imposuitque nomen ei Sedeciam."
      en: "And he appointed Matthanias his uncle in his stead: and called his name Sedecias."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Vigesimum et primum annum aetatis habebat Sedecias cum regnare coepisset, et undecim annis regnavit in Jerusalem: nomen matris ejus erat Amital, filia Jeremiae, de Lobna."
      en: "Sedecias was one and twenty years old when he began to reign, and he reigned eleven years in Jerusalem: the name of his mother was Amital, the daughter of Jeremias of Lobna."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et fecit malum coram Domino, juxta omnia quae fecerat Joakim."
      en: "And he did evil before the Lord, according to all that Joakim had done."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Irascebatur enim Dominus contra Jerusalem et contra Judam, donec projiceret eos a facie sua: recessitque Sedecias a rege Babylonis."
      en: "For the Lord was angry against Jerusalem and against Juda, till he cast them out from his face: and Sedecias revolted from the king of Babylon."
    status: { la: verified, en: verified }
