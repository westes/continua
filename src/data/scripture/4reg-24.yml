# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 4reg
chapter: 24
verses:
  - n: 1
    text:
      la: "in diebus eius ascendit Nabuchodonosor rex Babylonis et factus est ei Ioiachim servus tribus annis et rursum rebellavit contra eum"
      en: "In his days Nabuchodonosor king of Babylon came up, and Joakim became his servant three years: then again he rebelled against him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "inmisitque ei Dominus latrunculos Chaldeorum et latrunculos Syriae latrunculos Moab et latrunculos filiorum Ammon et inmisit eos in Iudam ut disperderent eum iuxta verbum Domini quod locutus erat per servos suos prophetas"
      en: "And the Lord sent against him the rovers of the Chaldees, and the rovers of Syria, and the rovers of Moab, and the rovers of the children of Ammon: and he sent them against Juda, to destroy it, according to the word of the Lord, which he had spoken by his servants the prophets."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "factum est autem hoc per verbum Domini contra Iudam ut auferret eum coram se propter peccata Manasse universa quae fecit"
      en: "And this came by the word of the Lord against Juda, to remove them from before him for all the sins of Manasses which he did."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et propter sanguinem innoxium quem effudit et implevit Hierusalem cruore innocentium et ob hanc rem noluit Dominus propitiari"
      en: "And for the innocent blood that he shed, filling Jerusalem with innocent blood: and therefore the Lord would not be appeased."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "reliqua autem sermonum Ioiachim et universa quae fecit nonne haec scripta sunt in libro sermonum dierum regum Iuda et dormivit Ioiachim cum patribus suis"
      en: "But the rest of the acts of Joakim, and all that he did, are they not written in the book of the words of the days of the kings of Juda? And Joakim slept with his fathers:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "regnavitque Ioiachin filius eius pro eo"
      en: "And Joachin his son reigned in his stead."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ultra non addidit rex Aegypti ut egrederetur de terra sua tulerat enim rex Babylonis a rivo Aegypti usque ad fluvium Eufraten omnia quae fuerant regis Aegypti"
      en: "And the king of Egypt came not again any more out of his own country: for the king of Babylon had taken all that had belonged to the king of Egypt, from the river of Egypt, unto the river Euphrates."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "decem et octo annorum erat Ioiachin cum regnare coepisset et tribus mensibus regnavit in Hierusalem nomen matris eius Naestha filia Helnathan de Hierusalem"
      en: "Joachin was eighteen years old when he began to reign, a and he reigned three months in Jerusalem: the name of his mother was Nohesta the daughter of Elnathan of Jerusalem."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et fecit malum coram Domino iuxta omnia quae fecerat pater eius"
      en: "And he did evil before the Lord, according to all that his father had done."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "in tempore illo ascenderunt servi Nabuchodonosor regis Babylonis in Hierusalem et circumdata est urbs munitionibus"
      en: "At that time the servants of Nabuchodonosor king of Babylon came up against Jerusalem, and the city was surrounded with their forts."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "venitque Nabuchodonosor rex Babylonis ad civitatem cum servi eius obpugnarent eam"
      en: "And Nabuchodonosor king of Babylon came to the city with his servants to assault it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "egressusque est Ioiachin rex Iuda ad regem Babylonis ipse et mater eius et servi eius et principes eius et eunuchi eius et suscepit eum rex Babylonis anno octavo regni sui"
      en: "And Joachin king of Juda went out to the king of Babylon, he end his mother, and his servants, and his nobles, and his eunuchs: and the king of Babylon received him in the eighth year of his reign."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et protulit inde omnes thesauros domus Domini et thesauros domus regiae et concidit universa vasa aurea quae fecerat Salomon rex Israhel in templo Domini iuxta verbum Domini"
      en: "And he brought out from thence all the treasures of the house of the Lord, and the treasures of the king's house: and he cut in pieces all the vessels of gold which Solomon king of Israel had made in the temple of the Lord, according to the word of the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et transtulit omnem Hierusalem et universos principes et omnes fortes exercitus decem milia in captivitatem et omnem artificem et clusorem nihilque relictum est exceptis pauperibus populi terrae"
      en: "And he carried away all Jerusalem, and all the princes, and all the valiant men of the army, to the number of ten thousand into captivity: and every artificer and smith: and none were left, but the poor sort of the people of the land."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "transtulit quoque Ioiachin in Babylonem et matrem regis et uxores regis et eunuchos eius et iudices terrae duxit in captivitatem de Hierusalem in Babylonem"
      en: "And he carried away Joachin into Babylon, and the king's mother, and the king's wives, and his eunuchs: and the judges of the land he carried into captivity from Jerusalem into Babylon."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et omnes viros robustos septem milia et artifices et clusores mille omnes viros fortes et bellatores duxitque eos rex Babylonis captivos in Babylonem"
      en: "And all the strong men, seven thousand, and the artificers, and the smiths a thousand, all that were valiant men and fit for war: and the king of Babylon led them captives into Babylon."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et constituit Matthaniam patruum eius pro eo inposuitque nomen ei Sedeciam"
      en: "And he appointed Matthanias his uncle in his stead: and called his name Sedecias."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "vicesimum et primum annum aetatis habebat Sedecias cum regnare coepisset et undecim annis regnavit in Hierusalem nomen matris eius erat Amithal filia Hieremiae de Lobna"
      en: "Sedecias was one and twenty years old when he began to reign, and he reigned eleven years in Jerusalem: the name of his mother was Amital, the daughter of Jeremias of Lobna."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et fecit malum coram Domino iuxta omnia quae fecerat Ioiachim"
      en: "And he did evil before the Lord, according to all that Joakim had done."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "irascebatur enim Dominus contra Hierusalem et contra Iudam donec proiceret eos a facie sua recessitque Sedecias a rege Babylonis"
      en: "For the Lord was angry against Jerusalem and against Juda, till he cast them out from his face : and Sedecias revolted from the king of Babylon."
    status: { la: verified, en: verified }
