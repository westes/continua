# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: prov
chapter: 31
verses:
  - n: 1
    text:
      la: "Verba Lamuelis regis. Visio qua erudivit eum mater sua."
      en: "The words of king Lamuel. The vision wherewith his mother instructed him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Quid, dilecte mi? quid, dilecte uteri mei? quid, dilecte votorum meorum?"
      en: "What, O my beloved, what, O the beloved of my womb, what, O the beloved of my vows?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Ne dederis mulieribus substantiam tuam, et divitias tuas ad delendos reges."
      en: "Give not thy substance to women, and thy riches to destroy kings."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Noli regibus, o Lamuel, noli regibus dare vinum, quia nullum secretum est ubi regnat ebrietas;"
      en: "Give not to kings, O Lamuel, give not wine to kings: because there is no secret where drunkenness reigneth:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et ne forte bibant, et obliviscantur judiciorum, et mutent causam filiorum pauperis."
      en: "And lest they drink and forget judgments, and pervert the cause of the children of the poor."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Date siceram moerentibus, et vinum his qui amaro sunt animo."
      en: "Give strong drink to them that are sad: and wine to them that are grieved in mind:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Bibant, et obliviscantur egestatis suae, et doloris sui non recordentur amplius."
      en: "Let them drink, and forget their want, and remember their sorrow no more."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Aperi os tuum muto, et causis omnium filiorum qui pertranseunt."
      en: "Open thy mouth for the dumb, and for the causes of all the children that pass."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Aperi os tuum, decerne quod justum est, et judica inopem et pauperem."
      en: "Open thy mouth, decree that which is just, and do justice to the needy and poor."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Mulierem fortem quis inveniet? procul et de ultimis finibus pretium ejus."
      en: "Who shall find a valiant woman? far and from the uttermost coasts is the price of her."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Confidit in ea cor viri sui, et spoliis non indigebit."
      en: "The heart of her husband trusteth in her, and he shall have no need of spoils."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Reddet ei bonum, et non malum, omnibus diebus vitae suae."
      en: "She will render him good, and not evil, all the days of her life."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Quaesivit lanam et linum, et operata est consilia manuum suarum."
      en: "She hath sought wool and flax, and hath wrought by the counsel of her hands."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Facta et quasi navis institoris, de longe portans panem suum."
      en: "She is like the merchant's ship, she bringeth her bread from afar."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et de nocte surrexit, deditque praedam domesticis suis, et cibaria ancillis suis."
      en: "And she hath risen in the night, and given a prey to her household, and victuals to her maidens."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Consideravit agrum, et emit eum; de fructu manuum suarum plantavit vineam."
      en: "She hath considered a field, and bought it: with the fruit of her hands she hath planted a vineyard."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Accinxit fortitudine lumbos suos, et roboravit brachium suum."
      en: "She hath girded her loins with strength, and hath strengthened her arm."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Gustavit, et vidit quia bona est negotiatio ejus; non extinguetur in nocte lucerna ejus."
      en: "She hath tasted and seen that her traffic is good: her lamp shall not be put out in the night."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Manum suam misit ad fortia, et digiti ejus apprehenderunt fusum."
      en: "She hath put out her hand to strong things, and her fingers have taken hold of the spindle."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Manum suam aperuit inopi, et palmas suas extendit ad pauperem."
      en: "She hath opened her hand to the needy, and stretched out her hands to the poor."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Non timebit domui suae a frigoribus nivis; omnes enim domestici ejus vestiti sunt duplicibus."
      en: "She shall not fear for her house in the cold of snow: for all her domestics are clothed with double garments."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Stragulatam vestem fecit sibi; byssus et purpura indumentum ejus."
      en: "She hath made for herself clothing of tapestry: fine linen, and purple is her covering."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Nobilis in portis vir ejus, quando sederit cum senatoribus terrae."
      en: "Her husband is honourable in the gates, when he sitteth among the senators of the land."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Sindonem fecit, et vendidit, et cingulum tradidit Chananaeo."
      en: "She made fine linen, and sold it, and delivered a girdle to the Chanaanite."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Fortitudo et decor indumentum ejus, et ridebit in die novissimo."
      en: "Strength and beauty are her clothing, and she shall laugh in the latter day."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Os suum aperuit sapientiae, et lex clementiae in lingua ejus."
      en: "She hath opened her mouth to wisdom, and the law of clemency is on her tongue."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Consideravit semitas domus suae, et panem otiosa non comedit."
      en: "She hath looked well to the paths of her house, and hath not eaten her bread idle."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Surrexerunt filii ejus, et beatissimam praedicaverunt; vir ejus, et laudavit eam."
      en: "Her children rose up, and called her blessed: her husband, and he praised her."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Multae filiae congregaverunt divitias; tu supergressa es universas."
      en: "Many daughters have gathered together riches: thou hast surpassed them all."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Fallax gratia, et vana est pulchritudo: mulier timens Dominum, ipsa laudabitur."
      en: "Favour is deceitful, and beauty is vain: the woman that feareth the Lord, she shall be praised."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Date ei de fructu manuum suarum, et laudent eam in portis opera ejus."
      en: "Give her of the fruit of her hands: and let her works praise her in the gates."
    status: { la: verified, en: verified }
