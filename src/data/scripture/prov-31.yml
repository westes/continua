# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 31
verses:
  - n: 1
    text:
      la: "verba Lamuhel regis visio qua erudivit eum mater sua"
      en: "The words of king Lamuel. The vision wherewith his mother instructed him."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quid dilecte mi quid dilecte uteri mei quid dilecte votorum meorum"
      en: "What, O my beloved, what, O the beloved of my womb, what, O the beloved of my vows?"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "ne dederis mulieribus substantiam tuam et vias tuas ad delendos reges"
      en: "Give not thy substance to women, and thy riches to destroy kings."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "noli regibus o Lamuhel noli regibus dare vinum quia nullum secretum est ubi regnat ebrietas"
      en: "Give not to kings, O Lamuel, give not wine to kings: because there is no secret where drunkenness reigneth:"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ne forte bibat et obliviscatur iudiciorum et mutet causam filiorum pauperis"
      en: "And lest they drink and forget judgments, and pervert the cause of the children of the poor."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "date siceram maerentibus et vinum his qui amaro sunt animo"
      en: "Give strong drink to them that are sad: and wine to them that are grieved in mind:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "bibant ut obliviscantur egestatis suae et doloris non recordentur amplius"
      en: "Let them drink, and forget their want, and remember their sorrow no more."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "aperi os tuum muto et causis omnium filiorum qui pertranseunt"
      en: "Open thy mouth for the dumb, and for the causes of all the children that pass."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "aperi os tuum decerne quod iustum est et iudica inopem et pauperem"
      en: "Open thy mouth, decree that which is just, and do justice to the needy and poor."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "aleph mulierem fortem quis inveniet procul et de ultimis finibus pretium eius"
      en: "Who shall find a valiant woman? far and from the uttermost coasts is the price of her."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "beth confidit in ea cor viri sui et spoliis non indigebit"
      en: "The heart of her husband trusteth in her, and he shall have no need of spoils."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "gimel reddet ei bonum et non malum omnibus diebus vitae suae"
      en: "She will render him good, and not evil, all the days of her life."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "deleth quaesivit lanam et linum et operata est consilio manuum suarum"
      en: "She hath sought wool and flax, and hath wrought by the counsel of her hands."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "he facta est quasi navis institoris de longe portat panem suum"
      en: "She is like the merchant's ship, she bringeth her bread from afar."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "vav et de nocte surrexit deditque praedam domesticis suis et cibaria ancillis suis"
      en: "And she hath risen in the night, and given a prey to her household, and victuals to her maidens."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "zai consideravit agrum et emit eum de fructu manuum suarum plantavit vineam"
      en: "She hath considered a field, and bought it: with the fruit of her hands she hath planted a vineyard."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "heth accinxit fortitudine lumbos suos et roboravit brachium suum"
      en: "She hath girded her loins with strength, and hath strengthened her arm."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "teth gustavit quia bona est negotiatio eius non extinguetur in nocte lucerna illius"
      en: "She hath tasted and seen that her traffic is good: her lamp shall not be put out in the night."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ioth manum suam misit ad fortia et digiti eius adprehenderunt fusum"
      en: "She hath put out her hand to strong things, and her fingers have taken hold of the spindle."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "caph manum suam aperuit inopi et palmas suas extendit ad pauperem"
      en: "She hath opened her hand to the needy, and stretched out her hands to the poor."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "lameth non timebit domui suae a frigoribus nivis omnes enim domestici eius vestiti duplicibus"
      en: "She shall not fear for her house in the cold of snow: for dl her domestics are clothed with double garments."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "mem stragulam vestem fecit sibi byssus et purpura indumentum eius"
      en: "She hath made for herself clothing of tapestry: fine linen, and purple is her covering."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "nun nobilis in portis vir eius quando sederit cum senatoribus terrae"
      en: "Her husband is honourable in the gates, when he sitteth among the senators of the land."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "samech sindonem fecit et vendidit et cingulum tradidit Chananeo"
      en: "She made fine linen, and sold it, end delivered a girdle to the Chanaanite."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ain fortitudo et decor indumentum eius et ridebit in die novissimo"
      en: "Strength and beauty are her clothing, and she shall laugh in the latter day."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "phe os suum aperuit sapientiae et lex clementiae in lingua eius"
      en: "She hath opened her mouth to wisdom, and the law of clemency is on her tongue."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sade considerat semitas domus suae et panem otiosa non comedet"
      en: "She hath looked well to the paths of her house, and hath not eaten her bread idle."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "coph surrexerunt filii eius et beatissimam praedicaverunt vir eius et laudavit eam"
      en: "Her children rose up, and called her blessed: her husband, and he praised her."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "res multae filiae congregaverunt divitias tu supergressa es universas"
      en: "Many daughters have gathered together riches: thou hast surpassed them all."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "sin fallax gratia et vana est pulchritudo mulier timens Dominum ipsa laudabitur"
      en: "Favour is deceitful, and beauty is vain: the woman that feareth the Lord, she shall be praised."
    status: { la: verified, en: verified }
