# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1reg
chapter: 9
verses:
  - n: 1
    text:
      la: "Et erat vir de Benjamin nomine Cis, filius Abiel, filii Seror, filii Bechorath, filii Aphia, filii viri Jemini, fortis robore."
      en: "Now there was a man of Benjamin whose name was Cis, the son of Abiel, the son of Seror, the son of Bechorath, the son of Aphia, the son of a man of Jemini, valiant and strong."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et erat ei filius vocabulo Saul, electus et bonus: et non erat vir de filiis Israel melior illo: ab humero et sursum eminebat super omnem populum."
      en: "And he had a son whose name was Saul, a choice and goodly man, and there was not among the children of Israel a goodlier person than he: from his shoulders and upward he appeared above all the people."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Perierant autem asinae Cis patris Saul: et dixit Cis ad Saul filium suum: Tolle tecum unum de pueris, et consurgens vade, et quaere asinas. Qui cum transissent per montem Ephraim,"
      en: "And the asses of Cis, Sauls father, were lost: and Cis said to his son Saul: Take one of the servants with thee, and arise, go, and seek the asses. And when they had passed through mount Ephraim,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et per terram Salisa, et non invenissent, transierunt etiam per terram Salim, et non erant: sed et per terram Jemini, et minime repererunt."
      en: "And through the land of Salisa, and had not found them, they passed also through the land of Salim, and they were not there: and through the land of Jemini, and found them not."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Cum autem venissent in terram Suph, dixit Saul ad puerum qui erat cum eo: Veni et revertamur, ne forte dimiserit pater meus asinas, et sollicitus sit pro nobis."
      en: "And when they were come to the land of Suph, Saul said to the servant that was with him: Come, let us return, lest perhaps my father forget the asses, and be concerned for us."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Qui ait ei: Ecce vir Dei est in civitate hac, vir nobilis: omne quod loquitur, sine ambiguitate venit. Nunc ergo eamus illuc, si forte indicet nobis de via nostra, propter quam venimus."
      en: "And he said to him: Behold there is a man of God in this city, a famous man: all that he saith, cometh certainly to pass. Now therefore let us go thither, perhaps he may tell us of our way, for which we are come."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Dixitque Saul ad puerum suum: Ecce ibimus: quid feremus ad virum Dei? panis defecit in sitarciis nostris: et sportulam non habemus, ut demus homini Dei, nec quidquam aliud."
      en: "And Saul said to his servant: Behold we will go: but what shall we carry to the man of God? the bread is spent in our bags: and we have no present to make to the man of God, nor any thing at all."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Rursum puer respondit Sauli, et ait: Ecce inventa est in manu mea quarta pars stateris argenti, demus homini Dei, ut indicet nobis viam nostram."
      en: "The servant answered Saul again, and said: Behold there is found in my hand the fourth part of a sicle of silver, let us give it to the man of God, that he may tell us our way."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "( Olim in Israel sic loquebatur unusquisque vadens consulere Deum: Venite, et eamus ad videntem. Qui enim propheta dicitur hodie, vocabatur olim videns.)"
      en: "Now in time past, in Israel when a man went to consult God he spoke thus: Come, let us go to the seer. For he that is now called a prophet, in time past was called a seer."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et dixit Saul ad puerum suum: Optimus sermo tuus. Veni, eamus. Et ierunt in civitatem, in qua erat vir Dei."
      en: "And Saul said to his servant: Thy word is very good, come, let us go. And they went into the city, where the man of God was."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque ascenderent clivum civitatis, invenerunt puellas egredientes ad hauriendam aquam, et dixerunt eis: Num hic est videns?"
      en: "And when they went up the ascent to the city, they found maids coming out to draw water, and they said to them: Is the seer here?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Quae respondentes, dixerunt illis: Hic est: ecce ante te, festina nunc: hodie enim venit in civitatem, quia sacrificium est hodie populi in excelso."
      en: "They answered and said to them: He is: behold he is before you, make haste now: for he came today into the city, for there is a sacrifice of the people today in the high place."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ingredientes urbem, statim invenietis eum antequam ascendat excelsum ad vescendum, neque enim comesurus est populus donec ille veniat: quia ipse benedicit hostiae, et deinceps comedunt qui vocati sunt. Nunc ergo conscendite, quia hodie reperietis eum."
      en: "As soon as you come into the city, you shall immediately find him, before he go up to the high place to eat: for the people will not eat till he come: because he blesseth the victim, and afterwards they eat that are invited. Now therefore go up, for today you shall find him."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Et ascenderunt in civitatem. Cumque illi ambularent in medio urbis, apparuit Samuel egrediens obviam eis, ut ascenderet in excelsum."
      en: "And they went up into the city. And when they were walking in the midst of the city, behold Samuel was coming out over against them, to go up to the high place."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dominus autem revelaverat auriculam Samuelis ante unam diem quam veniret Saul, dicens:"
      en: "Now the Lord had revealed to the ear of Samuel the day before Saul came, saying:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Hac ipsa hora, quae nunc est, cras mittam virum ad te de terra Benjaminm, et unges eum ducem super populum meum Israel: et salvabit populum meum de manu Philisthinorum: quia respexi populum meum, venit enim clamor eorum ad me."
      en: "Tomorrow about this same hour I will send thee a man of the land of Benjamin, and thou shalt anoint him to be ruler over my people Israel: and he shall save my people out of the hand of the Philistines: for I have looked down upon my people, because their cry is come to me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Cumque aspexisset Samuel Saulem, Dominus dixit ei: Ecce vir quem dixeram tibi, iste dominabitur populo meo."
      en: "And when Samuel saw Saul, the Lord said to him: Behold the man, of whom I spoke to thee, this man shall reign over my people."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Accessit autem Saul ad Samuelem in medio portae, et ait: Indica, oro, mihi, ubi est domus videntis."
      en: "And Saul came to Samuel in the midst of the gate and said: Tell me, I pray thee, where is the house of the seer?"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et respondit Samuel Sauli dicens: Ego sum videns: ascende ante me in excelsum, ut comedatis mecum hodie, et dimittam te mane: et omnia quae sunt in corde tuo indicabo tibi."
      en: "And Samuel answered Saul, saying: I am the seer, go up before me to the high place, that you may eat with me today, and I will let thee go in the morning: and tell thee all that is in thy heart."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Et de asinis, quas nudiustertius perdidisti, ne sollicitus sis, quia inventae sunt. Et cujus erunt optima quaeque Israel? nonne tibi et omni domui patris tui?"
      en: "And as for the asses, which were lost three days ago, be not solicitous, because they are found. And for whom shall be all the best things of Israel? Shall they not be for thee and for all thy father's house?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Respondens autem Saul, ait: Numquid non filius Jemini ego sum de minima tribu Israel, et cognatio mea novissima inter omnes familias de tribu Benjamin? quare ergo locutus est mihi sermonem istum?"
      en: "And Saul answering, said: Am not I a son of Jemini of the least tribe of Israel, and my kindred the last among all the families of the tribe of Benjamin? Why then hast thou spoken this word to me?"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Assumens itaque Samuel Saulem, et puerum ejus, introduxit eos in triclinium, et dedit eis locum in capite eorum qui fuerant invitati: erant enim quasi triginta viri."
      en: "Then Samuel taking Saul and his servant, brought them into the parlour, and gave them a place at the head of them that were invited. For there were about thirty men."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Dixitque Samuel coco: Da partem quam dedi tibi, et praecepi ut reponeres seorsum apud te."
      en: "And Samuel said to the cook: Bring the portion, which I gave thee, and commanded thee to set it apart by thee."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Levavit autem cocus armum, et posuit ante Saul. Dixitque Samuel: Ecce quod remansit, pone ante te, et comede: quia de industria servatum est tibi, quando populum vocavi. Et comedit Saul cum Samuele in die illa."
      en: "And the cook took up the shoulder, and set it before Saul. And Samuel said: Behold what is left, set it before thee, and eat: because it was kept of purpose for thee, when I invited the people. And Saul ate with Samuel that day."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et descenderunt de excelso in oppidum, et locutus est cum Saule in solario: stravitque Saul in solario, et dormivit."
      en: "And they went down from the high place into the town, and he spoke with Saul upon the top of the house: and he prepared a bed for Saul on the top of the house, and he slept."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Cumque mane surrexissent, et jam elucesceret, vocavit Samuel Saulem in solario, dicens: Surge, et dimittam te. Et surrexit Saul: egressique sunt ambo, ipse videlicet, et Samuel."
      en: "And when they were risen in the morning, and it began now to be light, Samuel called Saul on the top of the house, saying: Arise, that I may let thee go. And Saul arose: and they went out both of them, to wit, he and Samuel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cumque descenderent in extrema parte civitatis, Samuel dixit ad Saul: Dic puero ut antecedat nos et transeat: tu autem subsiste paulisper, ut indicem tibi verbum Domini."
      en: "And as they were going down in the end of the city, Samuel said to Saul: Speak to the servant to go before us, and pass on: but stand thou still a while, that I may tell thee the word of the Lord."
    status: { la: verified, en: verified }
