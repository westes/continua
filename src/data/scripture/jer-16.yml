# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 16
verses:
  - n: 1
    text:
      la: "Et factum est verbum Domini ad me, dicens:"
      en: "And the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Non accipies uxorem, et non erunt tibi filii et filiae in loco isto."
      en: "Thou shalt not take thee a wife, neither shalt thou have thee sons and daughters in this place."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quia haec dicit Dominus super filios et filias, qui generantur in loco isto, et super matres eorum, quae genuerunt eos, et super patres eorum, de quorum stirpe sunt nati in terra hac:"
      en: "For thus saith the Lord concerning the sons and daughters, that are born in this place, and concerning their mothers that bore them: and concerning their fathers, of whom they were born in this land:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Mortibus aegrotationum morientur: non plangentur, et non sepelientur: in sterquilinium super faciem terrae erunt: et gladio et fame consumentur, et erit cadaver eorum in escam volatilibus caeli et bestiis terrae."
      en: "They shall die by the death of grievous illnesses: they shall not be lamented, and they shall not be buried, they shall be as dung upon the face of the earth: and they shall be consumed with the sword, and with famine: and their carcasses shall be meat for the fowls of the air, and for the beasts of the earth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Haec enim dicit Dominus: Ne ingrediaris domum convivii, neque vadas ad plangendum, neque consoleris eos, quia abstuli pacem meam a populo isto, dicit Dominus, misericordiam, et miserationes."
      en: "For thus saith the Lord: Enter not into the house of feasting, neither go thou to mourn, nor to comfort them: because I have taken away my peace from this people, saith the Lord, my mercy and commiserations."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et morientur grandes et parvi in terra ista: non sepelientur neque plangentur: et non se incident, neque calvitium fiet pro eis."
      en: "Both the great and the little shall die in this land: they shall not be buried nor lamented, and men shall not cut themselves, nor make themselves bald for them."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et non frangent inter eos lugenti panem ad consolandum super mortuo, et non dabunt eis potum calicis ad consolandum super patre suo et matre."
      en: "And they shall not break bread among them to him that mourneth, to comfort him for the dead: neither shall they give them to drink of the cup, to comfort them for their father and mother."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et domum convivii non ingrediaris, ut sedeas cum eis, et comedas, et bibas:"
      en: "And do not thou go into the house of feasting, to sit with them, and to eat and drink."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quia haec dicit Dominus exercituum, Deus Israel: Ecce ego auferam de loco isto, in oculis vestris, et in diebus vestris, vocem gaudii et vocem laetitiae, vocem sponsi et vocem sponsae."
      en: "For thus saith the Lord of hosts, the God of Israel: Behold I will take away out of this place in your sight, and in your days the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et cum annuntiaveris populo huic omnia verba haec, et dixerint tibi: Quare locutus est Dominus super nos omne malum grande istud? quae iniquitas nostra? et quod peccatum nostrum, quod peccavimus Domino Deo nostro?"
      en: "And when thou shalt tell this people all these words, and they shall say to thee: Wherefore hath the Lord pronounced against us all this great evil? what is our iniquity? and what is our sin, that we have sinned against the Lord our God?"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dices ad eos: Quia dereliquerunt me patres vestri, ait Dominus: et abierunt post deos alienos, et servierunt eis, et adoraverunt eos, et me dereliquerunt, et legem meam non custodierunt."
      en: "Thou shalt say to them: Because your fathers forsook me, saith the Lord: and went after strange gods, and served them, and adored them: and they forsook me, and kept not my law."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Sed et vos pejus operati estis quam patres vestri: ecce enim ambulat unusquisque post pravitatem cordis sui mali, ut me non audiat."
      en: "And you also have done worse than your fathers: for behold every one of you walketh after the perverseness of his evil heart, so as not to hearken to me."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et ejiciam vos de terra hac in terram quam ignoratis, vos et patres vestri: et servietis ibi diis alienis, die ac nocte, qui non dabunt vobis requiem."
      en: "So I will cast you forth out of this land, into a land which you know not, nor you fathers: and there you shall serve strange gods day and night, which shall not give you any rest."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Propterea ecce dies veniunt, dicit Dominus, et non dicetur ultra: Vivit Dominus qui eduxit filios Israel de terra Aegypti,"
      en: "Therefore behold the days come, saith the Lord, when it shall be said no more: The Lord liveth, that brought for the children of Israel out of the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sed: Vivit Dominus qui eduxit filios Israel de terra aquilonis, et de universis terris ad quas ejeci eos, et reducam eos in terram suam, quam dedi patribus eorum."
      en: "But, the Lord liveth, that brought the children of Israel out of the land of the north, and out of all the lands to which I cast them out: and I will bring them again into their land, which I gave to their fathers."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Ecce ego mittam piscatores multos, dicit Dominus, et piscabuntur eos: et post haec mittam eis multos venatores, et venabuntur eos de omni monte, et de omni colle, et de cavernis petrarum."
      en: "Behold I will send many fishers, saith the Lord, and they shall fish them: and after this I will send them many hunters, and they shall hunt them from every mountain, and from every hill, and out of the holes of the rocks."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Quia oculi mei super omnes vias eorum: non sunt absconditae a facie mea, et non fuit occultata iniquitas eorum ab oculis meis."
      en: "For my eyes are upon all their ways: they are not hid from my face, and their iniquity hath not been hid from my eyes."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et reddam primum duplices iniquitates, et peccata eorum: quia contaminaverunt terram meam in morticinis idolorum suorum, et abominationibus suis impleverunt haereditatem meam."
      en: "And I will repay first their double iniquities, and their sins: because they have defiled my land with the carcasses of their idols, and they have filled my inheritance with their abominations."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Domine, fortitudo mea, et robur meum, et refugium meum in die tribulationis, ad te gentes venient ab extremis terrae, et dicent: Vere mendacium possederunt patres nostri, vanitatem quae eis non profuit."
      en: "O Lord, my might, and my strength, and my refuge in the day of tribulation: to thee the Gentiles shall come from the ends of the earth, and shall say: Surely our fathers have possessed lies, a vanity which hath not profited them."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Numquid faciet sibi homo deos, et ipsi non sunt dii?"
      en: "Shall a man make gods unto himself, and there are no gods?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Idcirco ecce ego ostendam eis per vicem hanc, ostendam eis manum meam, et virtutem meam, et scient quia nomen mihi Dominus."
      en: "Therefore, behold I will this once cause them to know, I will shew them my hand and my power: and they shall know that my name is the Lord."
    status: { la: verified, en: verified }
