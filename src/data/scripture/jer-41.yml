# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 41
verses:
  - n: 1
    text:
      la: "Et factum est in mense septimo, venit Ismahel filius Nathaniae filii Elisama, de semine regali, et optimates regis, et decem viri cum eo, ad Godoliam filium Ahicam, in Masphath, et comederunt ibi panes simul in Masphath."
      en: "And it came to pass in the seventh month, that Ismahel the son of Nathanias, the son of Elisama of the royal blood, and the nobles of the king, and ten men with him, came to Godolias the son of Ahicam into Masphath: and they ate bread there together in Masphath."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Surrexit autem Ismahel filius Nathaniae, et decem viri qui cum eo erant, et percusserunt Godoliam filium Ahicam filii Saphan gladio, et interfecerunt eum quem praefecerat rex Babylonis terrae."
      en: "And Ismahel the son of Nathanias arose, and the ten men that were with him, and they struck Godolias the son of Ahicam, the son of Saphan with the sword, and slew him whom the king of Babylon had made governor over the land."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Omnes quoque Judaeos qui erant cum Godolia in Masphath, et Chaldaeos qui reperti sunt ibi, et viros bellatores, percussit Ismahel."
      en: "Ismahel slew also all the Jews that were with Godolias in Masphath, and the Chaldeans that were found there, and the soldiers."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Secundo autem die postquam occiderat Godoliam, nullo adhuc sciente,"
      en: "And on the second day after he had killed Godolias, no man yet knowing it,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "venerunt viri de Sichem, et de Silo, et de Samaria, octoginta viri, rasi barba, et scissis vestibus, et squallentes: et munera et thus habebant in manu, ut offerrent in domo Domini."
      en: "There came some from Sichem, and from Silo, and from Samaria, fourscore men, with their beards shaven, and their clothes rent, and mourning: and they had offerings and incense in their hand, to offer in the house of the Lord."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Egressus ergo Ismahel filius Nathaniae in occursum eorum de Masphath, incedens et plorans ibat: cum autem occurrisset eis, dixit ad eos: Venite ad Godoliam filium Ahicam."
      en: "And Ismahel the son of Nathanias went forth from Masphath to meet them, weeping all along as he went: and when he had met them, he said to them: Come to Godolias, the son of Ahicam."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui cum venissent ad medium civitatis, interfecit eos Ismahel filius Nathaniae circa medium laci, ipse et viri qui erant cum eo."
      en: "And when they were come to the midst of the city, Ismahel the son of Nathanias, slew them, and cast them into the midst of the pit, he and the men that were with him."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Decem autem viri reperti sunt inter eos, qui dixerunt ad Ismahel: Noli occidere nos, quia habemus thesauros in agro, frumenti, et hordei, et olei, et mellis: et cessavit, et non interfecit eos cum fratribus suis."
      en: "But ten men were found among them, that said to Ismahel: Kill us not: for we have stores in the field, of wheat, and barley, and oil, and honey. And he forbore, and slew them not with their brethren."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Lacus autem in quem projecerat Ismahel omnia cadavera virorum quos percussit propter Godoliam, ipse est quem fecit rex Asa propter Baasa regem Israel: ipsum replevit Ismahel filius Nathaniae occisis."
      en: "And the pit into which Ismahel cast all the dead bodies of the men whom he slew because of Godolias, is the same that king Asa made, for fear of Baasa the king of Israel: the same did Ismahel the son of Nathanias fill with them that were slain."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et captivas duxit Ismahel omnes reliquias populi qui erant in Masphath, filias regis, et universum populum qui remanserat in Masphath, quos commendaverat Nabuzardan, princeps militiae, Godoliae filio Ahicam: et cepit eos Ismahel filius Nathaniae, et abiit ut transiret ad filios Ammon."
      en: "Then Ismahel carried away captive all the remnant of the people that were in Masphath: the king's daughters, and all the people that remained in Masphath: whom Nabuzardan the general of the army had committed to Godolias the son of Ahicam. And Ismahel the son of Nathanias took them, and he departed, to go over to the children of Ammon."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Audivit autem Johanan filius Caree, et omnes principes bellatorum qui erant cum eo, omne malum quod fecerat Ismahel filius Nathaniae,"
      en: "But Johanan the son of Caree, and all the captains of the fighting men that were with him, heard of the evil that Ismahel the son of Nathanias had done."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et assumptis universis viris, profecti sunt ut bellarent adversum Ismahel filium Nathaniae: et invenerunt eum ad aquas multas quae sunt in Gabaon."
      en: "And taking all the men, they went out to fight against Ismahel the son of Nathanias, and they found him by the great waters that are in Gabaon."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Cumque vidisset omnis populus qui erat cum Ismahel Johanan filium Caree, et universos principes bellatorum qui erant cum eo, laetati sunt:"
      en: "And when all the people that were with Ismahel, had seen Johanan the son of Caree, and all the captains of the fighting men that were with him, they rejoiced."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et reversus est omnis populus, quem ceperat Ismahel, in Masphath, reversusque abiit ad Johanan filium Caree."
      en: "And all the people whom Ismahel had taken, went back to Masphath: and they returned and went to Johanan the son of Caree."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Ismahel autem filius Nathaniae fugit cum octo viris a facie Johanan, et abiit ad filios Ammon."
      en: "But Ismahel the son of Nathanias fled with eight men, from the face of Johanan, and went to the children of Ammon."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Tulit ergo Johanan filius Caree, et omnes principes bellatorum qui erant cum eo, universas reliquias vulgi quas reduxerat ab Ismahel filio Nathaniae de Masphath, postquam percussit Godoliam filium Ahicam: fortes viros ad praelium, et mulieres, et pueros, et eunuchos, quos reduxerat de Gabaon."
      en: "Then Johanan the son of Caree, and all the captains of the soldiers that were with him, took all the remnant of the people whom they had recovered from Ismahel the son of Nathanias, from Masphath, after that he had slain Godolias the son of Ahicam: valiant men for war, and the women, and the children, and the eunuchs, whom he had brought back from Gabaon:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et abierunt, et sederunt peregrinantes in Chamaam, quae est juxta Bethlehem, ut pergerent, et introirent Aegyptum,"
      en: "And they departed, and sat as sojourners in Chamaam, which is near Bethlehem: in order to go forward, and enter into Egypt,"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "a facie Chaldaeorum: timebant enim eos, quia percusserat Ismahel filius Nathaniae Godoliam filium Ahicam, quem praeposuerat rex Babylonis in terra Juda."
      en: "From the face of the Chaldeans: for they were afraid of them, because Ismahel the son of Nathanias had slain Godolias the son of Ahicam, whom the king of Babylon had made governor in the land of Juda."
    status: { la: verified, en: verified }
