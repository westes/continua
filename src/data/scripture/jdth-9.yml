# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: jdth
chapter: 9
verses:
  - n: 1
    text:
      la: "quibus abscedentibus Iudith ingressa est oratorium suum et induens se cilicio posuit cinerem super caput suum et prosternens se Domino clamavit ad Dominum dicens"
      en: "And when they were gone, Judith went into her oratory: and putting on haircloth, laid ashes on her head: and falling down prostrate before the Lord, she cried to the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Domine Deus patris mei Symeon qui dedisti illi gladium in defensione alienigenarum qui violatores extiterunt in coinquinatione sua et denudaverunt femur virginis in confusionem"
      en: "O Lord God of my father Simeon, who gavest him a sword to execute vengeance against strangers, who had defiled by their uncleanness, and uncovered the virgin unto confusion:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et dedisti mulieres eorum in praedam et filias eorum in captivitatem et omnem praedam in divisionem servis tuis qui zelaverunt zelum tuum subveni quaeso te Domine Deus meus mihi viduae"
      en: "And who gavest their wives to he made a prey, and their daughters into captivity: and all their spoils to be divided to thy servants, who were zealous with thy zeal: assist, I beseech thee, O Lord God, me a widow."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "tu enim fecisti priora et illa post illa cogitasti et hoc factum est quod ipse voluisti"
      en: "For thou hast done the things of old, and hast devised one thing after another: and what thou hast designed hath been done."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "omnes enim viae tuae paratae sunt et tua iudicia in providentia tua posuisti"
      en: "For all thy ways are prepared, and in thy providence thou hast placed thy judgments."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "respice castra Assyriorum nunc sicut tunc castra videre Aegyptiorum dignatus es quando post servos tous armati currebant confidentes in quadrigis et in equitatu suo et in multitudine bellatorum"
      en: "Look upon the camp of the Assyrians now, as thou wast pleased to look upon the camp of the Egyptians, when they pursued armed after thy servants, trusting in their chariots, and in their horsemen, and in a multitude of warriors."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed aspexisti super castra eorum et tenebrae fatigaverunt eos"
      en: "But thou lookedst over their camp, and darkness wearied them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "tenuit pedes eorum abyssus et aquae operuerunt eos"
      en: "The deep held their feet, and the waters overwhelmed them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "sic fiant et isti Domine qui confidunt in multitudine sua et in corribus suis et in contis et in sagittis suis et in lanceis gloriantur"
      en: "So may it be with these also, O Lord, who trust in their multitude, and in their chariots, and in their pikes, and in their shields, and in their arrows, and glory in their spears,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et nesciunt quia tu ipse es Deus noster qui conteris bella ab initio et Dominus nomen est tibi"
      en: "And know not that thou art our God, who destroyest wars from the beginning, and the Lord is thy name."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "erige brachium tuum sicut ab initio et adlide virtutem eorum in virtute tua cadat virtus eorum in iracundiam tuam qui promittunt se violare sancta tua et polluere tabernaculum honoris tui et deicere gladio suo cornu altaris tui"
      en: "Lift up thy arm as from the beginning, and crush their power with thy power: let their power fall in their wrath, who promise themselves to violate thy sanctuary, and defile the dwelling place of thy name, and to beat down with their sword the horn of thy altar."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "fac Domine ut gladio proprio eius superbia amputetur"
      en: "Bring to pass, O Lord, that his pride may be cut off with his own sword."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "capiatur laqueo oculorum suorum in me et percuties eum ex labiis caritatis meae"
      en: "Let him be caught in the net of his own eyes in my regard, and do thou strike him by the graces of the words of my lips."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "da mihi in animo constantiam ut contemnam illum et virtutem ut evertam illum"
      en: "Give me constancy in my mind, that I may despise him: and fortitude that I may overthrow him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "erit enim memoriale nominis tui cum manus feminea deiecerit eum"
      en: "For this will be a glorious monument for thy name, when he shall fall by the hand of a woman."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non enim in multitudine est virtus tua Domine neque in equorum viribus voluntas tua nec superbi ab initio placuerunt tibi sed humilium et mansuetorum tibi semper placuit deprecatio"
      en: "For thy power, O Lord, is not in a multitude, nor is thy pleasure in the strength of horses, nor from the beginning have the proud been acceptable to thee: but the prayer of the humble and the meek hath always pleased thee."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Deus caelorum creator aquarum et dominus totius creaturae exaudi me miseram deprecantem et de tua misericordia praesumentem"
      en: "O God of the heavens, creator of the waters, and Lord of the whole creation, hear me a poor wretch, making supplication to thee, and presuming of thy mercy."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "memento Domine testamenti tui et da verbum in ore meo et in corde meo consilium corrobora ut domus tua in tua sanctificatione permaneat"
      en: "Remember, O Lord, thy covenant, and put thou words in my mouth, and strengthen the resolution in my heart, that thy house may continue in thy holiness:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et omnes gentes agnoscant quoniam tu es Deus et non est alius praeter te"
      en: "And all nations may acknowledge that thou art God, and there is no other besides thee."
    status: { la: verified, en: verified }
