# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: gen
chapter: 1
verses:
  - n: 1
    text:
      la: "in principio creavit Deus caelum et terram"
      en: "In the beginning God created heaven, and earth."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "terra autem erat inanis et vacua et tenebrae super faciem abyssi et spiritus Dei ferebatur super aquas"
      en: "And the earth was void and empty, and darkness was upon the face of the deep; and the spirit of God moved over the waters."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixitque Deus fiat lux et facta est lux"
      en: "And God said: Be light made. And light was made."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et vidit Deus lucem quod esset bona et divisit lucem ac tenebras"
      en: "And God saw the light that it was good; and he divided the light from the darkness."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "appellavitque lucem diem et tenebras noctem factumque est vespere et mane dies unus"
      en: "And he called the light Day, and the darkness Night; and there was evening and morning one day."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "dixit quoque Deus fiat firmamentum in medio aquarum et dividat aquas ab aquis"
      en: "And God said: Let there be a firmament made amidst the waters: and let it divide the waters from the waters."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et fecit Deus firmamentum divisitque aquas quae erant sub firmamento ab his quae erant super firmamentum et factum est ita"
      en: "And God made a firmament, and divided the waters that were under the firmament, from those that were above the firmament, and it was so."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "vocavitque Deus firmamentum caelum et factum est vespere et mane dies secundus"
      en: "And God called the firmament, Heaven; and the evening and morning were the second day."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "dixit vero Deus congregentur aquae quae sub caelo sunt in locum unum et appareat arida factumque est ita"
      en: "God also said: Let the waters that are under the heaven, be gathered together into one place: and let the dry land appear. And it was so done."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et vocavit Deus aridam terram congregationesque aquarum appellavit maria et vidit Deus quod esset bonum"
      en: "And God called the dry land, Earth; and the gathering together of the waters, he called Seas. And God saw that it was good."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et ait germinet terra herbam virentem et facientem semen et lignum pomiferum faciens fructum iuxta genus suum cuius semen in semet ipso sit super terram et factum est ita"
      en: "And he said: Let the earth bring forth the green herb, and such as may seed, and the fruit tree yielding fruit after its kind, which may have seed in itself upon the earth. And it was so done."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et protulit terra herbam virentem et adferentem semen iuxta genus suum lignumque faciens fructum et habens unumquodque sementem secundum speciem suam et vidit Deus quod esset bonum"
      en: "And the earth brought forth the green herb, and such as yieldeth seed according to its kind, and the tree that beareth fruit having seed each one according to its kind. And God saw that it was good."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "factumque est vespere et mane dies tertius"
      en: "And the evening and the morning were the third day."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "dixit autem Deus fiant luminaria in firmamento caeli ut dividant diem ac noctem et sint in signa et tempora et dies et annos"
      en: "And God said: Let there be lights made in the firmament of heaven, to divide the day and the night, and let them be for signs, and for seasons, and for days and years:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ut luceant in firmamento caeli et inluminent terram et factum est ita"
      en: "To shine in the firmament of heaven, and to give light upon the earth. And it was so done."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "fecitque Deus duo magna luminaria luminare maius ut praeesset diei et luminare minus ut praeesset nocti et stellas"
      en: "And God made two great lights: a greater light to rule the day; and a lesser light to rule the night: and the stars."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et posuit eas in firmamento caeli ut lucerent super terram"
      en: "And he set them in the firmament of heaven to shine upon the earth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et praeessent diei ac nocti et dividerent lucem ac tenebras et vidit Deus quod esset bonum"
      en: "And to rule the day and the night, and to divide the light and the darkness. And God saw that it was good."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et factum est vespere et mane dies quartus"
      en: "And the evening and morning were the fourth day."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "dixit etiam Deus producant aquae reptile animae viventis et volatile super terram sub firmamento caeli"
      en: "God also said: Let the waters bring forth the creeping creature having life, and the fowl that may fly over the earth under the firmament of heaven."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "creavitque Deus cete grandia et omnem animam viventem atque motabilem quam produxerant aquae in species suas et omne volatile secundum genus suum et vidit Deus quod esset bonum"
      en: "And God created the great whales, and every living and moving creature, which the waters brought forth, according to their kinds, and every winged fowl according to its kind. And God saw that it was good."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "benedixitque eis dicens crescite et multiplicamini et replete aquas maris avesque multiplicentur super terram"
      en: "And he blessed them, saying: Increase and multiply, and fill the waters of the sea: and let the birds be multiplied upon the earth."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et factum est vespere et mane dies quintus"
      en: "And the evening and morning were the fifth day."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "dixit quoque Deus producat terra animam viventem in genere suo iumenta et reptilia et bestias terrae secundum species suas factumque est ita"
      en: "And God said: Let the earth bring forth the living creature in its kind, cattle and creeping things, and beasts of the earth, according to their kinds. And it was so done."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et fecit Deus bestias terrae iuxta species suas et iumenta et omne reptile terrae in genere suo et vidit Deus quod esset bonum"
      en: "And God made the beasts of the earth according to their kinds, and cattle, and every thing that creepeth on the earth after its kind. And God saw that it was good."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ait faciamus hominem ad imaginem et similitudinem nostram et praesit piscibus maris et volatilibus caeli et bestiis universaeque terrae omnique reptili quod movetur in terra"
      en: "And he said: Let us make man to our image and likeness: and let him have dominion over the fishes of the sea, and the fowls of the air, and the beasts, and the whole earth, and every creeping creature that moveth upon the earth."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et creavit Deus hominem ad imaginem suam ad imaginem Dei creavit illum masculum et feminam creavit eos"
      en: "And God created man to his own image: to the image of God he created him: male and female he created them."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "benedixitque illis Deus et ait crescite et multiplicamini et replete terram et subicite eam et dominamini piscibus maris et volatilibus caeli et universis animantibus quae moventur super terram"
      en: "And God blessed them, saying: Increase and multiply, and fill the earth, and subdue it, and rule over the fishes of the sea, and the fowls of the air, and all living creatures that move upon the earth."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "dixitque Deus ecce dedi vobis omnem herbam adferentem semen super terram et universa ligna quae habent in semet ipsis sementem generis sui ut sint vobis in escam"
      en: "And God said: Behold I have given you every herb bearing seed upon the earth, and all trees that have in themselves seed of their own kind, to be your meat:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "et cunctis animantibus terrae omnique volucri caeli et universis quae moventur in terra et in quibus est anima vivens ut habeant ad vescendum et factum est ita"
      en: "And to all the beasts of the earth, and to every fowl of the air, and to all that move upon the earth, and wherein there is life, that they may have to feed upon. And it was so done."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "viditque Deus cuncta quae fecit et erant valde bona et factum est vespere et mane dies sextus"
      en: "And God saw all the things that he had made, and they were very good. And the evening and morning were the sixth day."
    status: { la: verified, en: verified }
