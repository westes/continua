# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1cor
chapter: 13
verses:
  - n: 1
    text:
      la: "Si linguis hominum loquar, et angelorum, caritatem autem non habeam, factus sum velut aes sonans, aut cymbalum tinniens."
      en: "If I speak with the tongues of men, and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et si habuero prophetiam, et noverim mysteria omnia, et omnem scientiam: et si habuero omnem fidem ita ut montes transferam, caritatem autem non habuero, nihil sum."
      en: "And if I should have prophecy and should know all mysteries, and all knowledge, and if I should have all faith, so that I could remove mountains, and have not charity, I am nothing."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et si distribuero in cibos pauperum omnes facultates meas, et si tradidero corpus meum ita ut ardeam, caritatem autem non habuero, nihil mihi prodest."
      en: "And if I should distribute all my goods to feed the poor, and if I should deliver my body to be burned, and have not charity, it profiteth me nothing."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Caritas patiens est, benigna est. Caritas non aemulatur, non agit perperam, non inflatur,"
      en: "Charity is patient, is kind: charity envieth not, dealeth not perversely; is not puffed up;"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non est ambitiosa, non quaerit quae sua sunt, non irritatur, non cogitat malum,"
      en: "Is not ambitious, seeketh not her own, is not provoked to anger, thinketh no evil;"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "non gaudet super iniquitate, congaudet autem veritati:"
      en: "Rejoiceth not in iniquity, but rejoiceth with the truth;"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "omnia suffert, omnia credit, omnia sperat, omnia sustinet."
      en: "Beareth all things, believeth all things, hopeth all things, endureth all things."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Caritas numquam excidit: sive prophetiae evacuabuntur, sive linguae cessabunt, sive scientia destruetur."
      en: "Charity never falleth away: whether prophecies shall be made void, or tongues shall cease, or knowledge shall be destroyed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ex parte enim cognoscimus, et ex parte prophetamus."
      en: "For we know in part, and we prophesy in part."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cum autem venerit quod perfectum est, evacuabitur quod ex parte est."
      en: "But when that which is perfect is come, that which is in part shall be done away."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cum essem parvulus, loquebar ut parvulus, cogitabam ut parvulus. Quando autem factus sum vir, evacuavi quae erant parvuli."
      en: "When I was a child, I spoke as a child, I understood as a child, I thought as a child. But, when I became a man, I put away the things of a child."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Videmus nunc per speculum in aenigmate: tunc autem facie ad faciem. Nunc cognosco ex parte: tunc autem cognoscam sicut et cognitus sum."
      en: "We see now through a glass in a dark manner; but then face to face. Now I know in part; but then I shall know even as I am known."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nunc autem manent fides, spes, caritas, tria haec: major autem horum est caritas."
      en: "And now there remain faith, hope, and charity, these three: but the greatest of these is charity."
    status: { la: verified, en: verified }
