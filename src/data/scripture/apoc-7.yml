# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: apoc
chapter: 7
verses:
  - n: 1
    text:
      la: "post haec vidi quattuor angelos stantes super quattuor angulos terrae tenentes quattuor ventos terrae ne flaret ventus super terram neque super mare neque in ullam arborem"
      en: "After these things, I saw four angels standing on the four corners of the earth, holding the four winds of the earth, that they should not blow upon the earth, nor upon the sea, nor on any tree."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et vidi alterum angelum ascendentem ab ortu solis habentem signum Dei vivi et clamavit voce magna quattuor angelis quibus datum est nocere terrae et mari"
      en: "And I saw another angel ascending from the rising of the sun, having the sign of the living God; and he cried with a loud voice to the four angels, to whom it was given to hurt the earth and the sea,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dicens nolite nocere terrae neque mari neque arboribus quoadusque signemus servos Dei nostri in frontibus eorum"
      en: "Saying: Hurt not the earth, nor the sea, nor the trees, till we sign the servants of our God in their foreheads."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et audivi numerum signatorum centum quadraginta quattuor milia signati ex omni tribu filiorum Israhel"
      en: "And I heard the number of them that were signed, an hundred forty-four thousand were signed, of every tribe of the children of Israel."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ex tribu Iuda duodecim milia signati ex tribu Ruben duodecim milia ex tribu Gad duodecim milia"
      en: "Of the tribe of Juda, were twelve thousand signed: Of the tribe of Ruben, twelve thousand signed: Of the tribe of Gad, twelve thousand signed:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ex tribu Aser duodecim milia ex tribu Nepthalim duodecim milia ex tribu Manasse duodecim milia"
      en: "Of the tribe of Aser, twelve thousand signed: Of the tribe of Nephthali, twelve thousand signed: Of the tribe of Manasses, twelve thousand signed:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "ex tribu Symeon duodecim milia ex tribu Levi duodecim milia ex tribu Issachar duodecim milia"
      en: "Of the tribe of Simeon, twelve thousand signed: Of the tribe of Levi, twelve thousand signed: Of the tribe of Issachar, twelve thousand signed:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "ex tribu Zabulon duodecim milia ex tribu Ioseph duodecim milia ex tribu Beniamin duodecim milia signati"
      en: "Of the tribe of Zabulon, twelve thousand signed: Of the tribe of Joseph, twelve thousand signed: Of the tribe of Benjamin, twelve thousand signed."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "post haec vidi turbam magnam quam dinumerare nemo poterat ex omnibus gentibus et tribubus et populis et linguis stantes ante thronum et in conspectu agni amicti stolas albas et palmae in manibus eorum"
      en: "After this I saw a great multitude, which no man could number, of all nations, and tribes, and peoples, and tongues, standing before the throne, and in sight of the Lamb, clothed with white robes, and palms in their hands:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et clamabant voce magna dicentes salus Deo nostro qui sedet super thronum et agno"
      en: "And they cried with a loud voice, saying: Salvation to our God, who sitteth upon the throne, and to the Lamb."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et omnes angeli stabant in circuitu throni et seniorum et quattuor animalium et ceciderunt in conspectu throni in facies suas et adoraverunt Deum"
      en: "And all the angels stood round about the throne, and the ancients, and the four living creatures; and they fell down before the throne upon their faces, and adored God,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "dicentes amen benedictio et claritas et sapientia et gratiarum actio et honor et virtus et fortitudo Deo nostro in saecula saeculorum amen"
      en: "Saying: Amen. Benediction, and glory, and wisdom, and thanksgiving, honour, and power, and strength to our God for ever and ever. Amen."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et respondit unus de senioribus dicens mihi hii qui amicti sunt stolis albis qui sunt et unde venerunt"
      en: "And one of the ancients answered, and said to me: These that are clothed in white robes, who are they? and whence came they?"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et dixi illi domine mi tu scis et dixit mihi hii sunt qui veniunt de tribulatione magna et laverunt stolas suas et dealbaverunt eas in sanguine agni"
      en: "And I said to him: My Lord, thou knowest. And he said to me: These are they who are come out of great tribulation, and have washed their robes, and have made them white in the blood of the Lamb."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "ideo sunt ante thronum Dei et serviunt ei die ac nocte in templo eius et qui sedet in throno habitabit super illos"
      en: "Therefore they are before the throne of God, and they serve him day and night in his temple: and he, that sitteth on the throne, shall dwell over them."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "non esurient neque sitient amplius neque cadet super illos sol neque ullus aestus"
      en: "They shall no more hunger nor thirst, neither shall the sun fall on them, nor any heat."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quoniam agnus qui in medio throni est reget illos et deducet eos ad vitae fontes aquarum et absterget Deus omnem lacrimam ex oculis eorum"
      en: "For the Lamb, which is in the midst of the throne, shall rule them, and shall lead them to the fountains of the waters of life, and God shall wipe away all tears from their eyes."
    status: { la: verified, en: verified }
