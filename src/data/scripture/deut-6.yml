# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 6
verses:
  - n: 1
    text:
      la: "Haec sunt praecepta, et caeremoniae, atque judicia, quae mandavit Dominus Deus vester ut docerem vos, et faciatis ea in terra, ad quam transgredimini possidendam:"
      en: "These are the precepts, and ceremonies, and judgments, which the Lord your God commanded that I should teach you, and that you should do them in the land into which you pass over to possess it:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "ut timeas Dominum Deum tuum, et custodias omnia mandata et praecepta ejus, quae ego praecipio tibi, et filiis, ac nepotibus tuis, cunctis diebus vitae tuae, ut prolongentur dies tui."
      en: "That thou mayst fear the Lord thy God, and keep all his commandments and precepts, which I command thee, and thy sons, and thy grandsons, all the days of thy life, that thy days may be prolonged."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Audi, Israel, et observa ut facias quae praecepit tibi Dominus, et bene sit tibi, et multipliceris amplius, sicut pollicitus est Dominus Deus patrum tuorum tibi terram lacte et melle manantem."
      en: "Hear, O Israel, and observe to do the things which the Lord hath commanded thee, that it may be well with thee, and thou mayst be greatly multiplied, as the Lord the God of thy fathers hath promised thee a land flowing with milk and honey."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Audi, Israel: Dominus Deus noster, Dominus unus est."
      en: "Hear, O Israel, the Lord our God is one Lord."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex tota fortitudine tua."
      en: "Thou shalt love the Lord thy God with thy whole heart, and with thy whole soul, and with thy whole strength."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Eruntque verba haec, quae ego praecipio tibi hodie, in corde tuo:"
      en: "And these words which I command thee this day, shall be in thy heart:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et narrabis ea filiis tuis, et meditaberis in eis sedens in domo tua, et ambulans in itinere, dormiens atque consurgens."
      en: "And thou shalt tell them to thy children, and thou shalt meditate upon them sitting in thy house, and walking on thy journey, sleeping and rising."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et ligabis ea quasi signum in manu tua, eruntque et movebuntur inter oculos tuos,"
      en: "And thou shalt bind them as a sign on thy hand, and they shall be and shall move between thy eyes."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "scribesque ea in limine, et ostiis domus tuae."
      en: "And thou shalt write them in the entry, and on the doors of thy house."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cumque introduxerit te Dominus Deus tuus in terram, pro qua juravit patribus tuis Abraham, Isaac, et Jacob, et dederit tibi civitates magnas et optimas, quas non aedificasti,"
      en: "And when the Lord thy God shall have brought thee into the land, for which he swore to thy fathers Abraham, Isaac, and Jacob: and shall have given thee great and goodly cities, which thou didst not build,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "domos plenas cunctarum opum, quas non exstruxisti, cisternas, quas non fodisti, vineta et oliveta, quae non plantasti,"
      en: "Houses full of riches, which thou didst not set up, cisterns which thou didst not dig, vineyards and oliveyards, which thou didst not plant,"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et comederis, et saturatus fueris:"
      en: "And thou shalt have eaten and be full:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "cave diligenter ne obliviscaris Domini, qui eduxit te de terra Aegypti, de domo servitutis. Dominum Deum tuum timebis, et illi soli servies, ac per nomen illius jurabis."
      en: "Take heed diligently lest thou forget the Lord, who brought thee out of the land of Egypt, out of the house of bondage. Thou shalt fear the Lord thy God, and shalt serve him only, and thou shalt swear by his name."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Non ibitis post deos alienos cunctarum gentium, quae in circuitu vestro sunt:"
      en: "You shall not go after the strange gods of all the nations, that are round about you:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "quoniam Deus aemulator Dominus Deus tuus in medio tui: nequando irascatur furor Domini Dei tui contra te, et auferat te de superficie terrae."
      en: "Because the Lord thy God is a jealous God in the midst of thee: lest at any time the wrath of the Lord thy God be kindled against thee, and take thee away from the face of the earth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Non tentabis Dominum Deum tuum, sicut tentasti in loco tentationis."
      en: "Thou shalt not tempt the Lord thy God, as thou temptedst him in the place of temptation."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Custodi praecepta Domini Dei tui, ac testimonia et caeremonias, quas praecepit tibi:"
      en: "Keep the precepts of the Lord thy God, and the testimonies and ceremonies which he hath commanded thee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et fac quod placitum est et bonum in conspectu Domini, ut bene sit tibi: et ingressus possideas terram optimam, de qua juravit Dominus patribus tuis,"
      en: "And do that which is pleasing and good in the sight of the Lord, that it may be well with thee: and going in thou mayst possess the goodly land, concerning which the Lord swore to thy fathers,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ut deleret omnes inimicos tuos coram te, sicut locutus est."
      en: "That he would destroy all thy enemies before thee, as he hath spoken."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Cumque interrogaverit te filius tuus cras, dicens: Quid sibi volunt testimonia haec, et caeremoniae, atque judicia, quae praecepit Dominus Deus noster nobis?"
      en: "And when thy son shall ask thee tomorrow, saying: What mean these testimonies, and ceremonies and judgments, which the Lord our God hath commanded us?"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "dices ei: Servi eramus Pharaonis in Aegypto, et eduxit nos Dominus de Aegypto in manu forti:"
      en: "Thou shalt say to him: We were bondmen of Pharao in Egypt, and the Lord brought us out of Egypt with a strong hand."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "fecitque signa atque prodigia magna et pessima in Aegypto contra Pharaonem, et omnem domum illius in conspectu nostro,"
      en: "And he wrought signs and wonders great and very grievous in Egypt against Pharao, and all his house, in our sight,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et eduxit nos inde, ut introductis daret terram, super qua juravit patribus nostris."
      en: "And he brought us out from thence, that he might bring us in and give us the land, concerning which he swore to our fathers."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Praecepitque nobis Dominus ut faciamus omnia legitima haec, et timeamus Dominum Deum nostrum, ut bene sit nobis cunctis diebus vitae nostrae, sicut est hodie."
      en: "And the Lord commanded that we should do all these ordinances, and should fear the Lord our God, that it might be well with us all the days of our life, as it is at this day."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Eritque nostri misericors, si custodierimus et fecerimus omnia praecepta ejus coram Domino Deo nostro, sicut mandavit nobis."
      en: "And he will be merciful to us, if we keep and do all his precepts before the Lord our God, as he hath commanded us."
    status: { la: verified, en: verified }
