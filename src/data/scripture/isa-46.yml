# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: isa
chapter: 46
verses:
  - n: 1
    text:
      la: "conflatus est Bel contritus est Nabo facta sunt simulacra eorum bestiis et iumentis onera vestra gravi pondere usque ad lassitudinem"
      en: "Bel is broken, Nebo is destroyed: their idols are put upon beasts and cattle, your burdens of heavy weight even unto weariness."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "contabuerunt et contrita sunt simul non potuerunt salvare portantem et anima eorum in captivitatem ibit"
      en: "They are consumed, and are broken together: they could not save him that carried them, and they themselves shall go into captivity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "audite me domus Iacob et omne residuum domus Israhel qui portamini a meo utero qui gestamini a mea vulva"
      en: "Hearken unto me, O house of Jacob, all the remnant of the house of Israel, who are carried by my bowels, are borne up by my womb."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "usque ad senectam ego ipse et usque ad canos ego portabo ego feci et ego feram et ego portabo et salvabo"
      en: "Even to your old age I am the same, and to your grey hairs I will carry you: I have made you, and I will bear: I will carry and will save."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "cui adsimilastis me et adaequastis et conparastis me et fecistis similem"
      en: "To whom have you likened me, and made me equal, and compared me, and made me like?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui confertis aurum de sacculo et argentum statera ponderatis conducentes aurificem ut faciat deum et procidunt et adorant"
      en: "You that contribute gold out of the bag, and weigh out silver in the scales: and hire a goldsmith to make a god: and they fall down and worship."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "portant illud in umeris gestantes et ponentes in loco suo et stabit ac de loco suo non movebitur sed et cum clamaverint ad eum non audiet de tribulatione non salvabit eos"
      en: "They bear him on their shoulders and carry him, and set him in his piece, and he shall stand, and shall not stir out of his place. Yea, when they shall cry also unto him, he shall not hear: he shall not save them from tribulation."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "mementote istud et fundamini redite praevaricatores ad cor"
      en: "Remember this, and be ashamed: return, ye transgressors, to the heart."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "recordamini prioris saeculi quoniam ego sum Deus et non est ultra Deus nec est similis mei"
      en: "Remember the former age, for I am God, and there is no God beside, neither is there the like to me:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "adnuntians ab exordio novissimum et ab initio quae necdum facta sunt dicens consilium meum stabit et omnis voluntas mea fiet"
      en: "Who shew from the beginning the things that shall be at last, and from ancient times the things that as yet are not done, saying: My counsel shall stand, and all my will shall be done:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "vocans ab oriente avem et de terra longinqua virum voluntatis meae et locutus sum et adducam illud creavi et faciam illud"
      en: "Who call a bird from the east, and from a far country the man of my own will, and I have spoken, and will bring it to pass: I have created, and I will do it. Hear me, O ye hardhearted, who are far from justice."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "audite me duro corde qui longe estis a iustitia"
      en: "I have brought my justice near, it shall not be afar off: and my salvation shall not tarry. I will give salvation in Sion, and my glory in Israel."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "prope feci iustitiam meam non elongabitur et salus mea non morabitur dabo in Sion salutem et Israheli gloriam meam"
      en: ""
    status: { la: verified, en: missing }
