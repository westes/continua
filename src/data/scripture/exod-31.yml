# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 31
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Ecce, vocavi ex nomine Beseleel filium Uri filii Hur de tribu Juda,"
      en: "Behold, I have called by name Beseleel the son of Uri the son of Hur of the tribe of Juda,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et implevi spiritu Dei, sapientia, et intelligentia et scientia in omni opere,"
      en: "And I have filled him with the spirit of God, with wisdom and understanding, and knowledge in all manner of work."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "ad excogitandum quidquid fabrefieri potest ex auro, et argento, et aere,"
      en: "To devise whatsoever may be artificially made of gold, and silver, and brass,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "marmore, et gemmis, et diversitate lignorum."
      en: "Of marble, and precious stones, and variety of wood."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Dedique ei socium Ooliab filium Achisamech de tribu Dan. Et in corde omnis eruditi posui sapientiam: ut faciant cuncta quae praecepi tibi,"
      en: "And I have given him for his companion Ooliab the son of Achisamech of the tribe of Dan. And I have put wisdom in the heart of every skillful man, that they may make all things which I have commanded thee,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tabernaculum foederis, et arcam testimonii, et propitiatorium, quod super eam est, et cuncta vasa tabernaculi,"
      en: "The tabernacle of the covenant, and the ark of the testimony, and the propitiatory that is over it, and all the vessels of the tabernacle,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "mensamque et vasa ejus, candelabrum purissimum cum vasis suis, et altaris thymiamatis,"
      en: "And the table and the vessels thereof, the most pure candlestick with the vessels thereof, and the altars of incense,"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et holocausti, et omnia vasa eorum, labrum cum basi sua,"
      en: "And of holocaust, and all their vessels, the laver with its foot,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "vestes sanctas in ministerio Aaron sacerdoti, et filiis ejus, ut fungantur officio suo in sacris:"
      en: "The holy vestments in the ministry for Aaron the priest, and for his sons, that they may execute their office about the sacred things:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "oleum unctionis, et thymiama aromatum in sanctuario, omnia quae praecepi tibi, facient."
      en: "The oil of unction, and the incense of spices in the sanctuary, all things which I have commanded thee, shall they make."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et locutus est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Loquere filiis Israel, et dices ad eos: Videte ut sabbatum meum custodiatis: quia signum est inter me et vos in generationibus vestris: ut sciatis quia ego Dominus, qui sanctifico vos."
      en: "Speak to the children of Israel, and thou shalt say to them: See that thou keep my sabbath: because it is a sign between me and you in your generations: that you may know that I am the Lord, who sanctify you."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Custodite sabbatum meum, sanctum est enim vobis: qui polluerit illud, morte morietur; qui fecerit in eo opus, peribit anima illius de medio populi sui."
      en: "Keep you my sabbath: for it is holy unto you: he that shall profane it, shall be put to death: he that shall do any work in it, his soul shall perish out of the midst of his people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Sex diebus facietis opus: in die septimo sabbatum est, requies sancta Domino; omnis qui fecerit opus in hac die, morietur."
      en: "Six days shall you do work: in the seventh day is the sabbath, the rest holy to the Lord. Every one that shall do any work on this day, shall die."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Custodiant filii Israel sabbatum, et celebrent illud in generationibus suis. Pactum est sempiternum"
      en: "Let the children of Israel keep the sabbath, and celebrate it in their generations. It is an everlasting covenant"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "inter me et filios Israel, signumque perpetuum; sex enim diebus fecit Dominus caelum et terram, et in septimo ab opere cessavit."
      en: "Between me and the children of Israel, and a perpetual sign. For in six days the Lord made heaven and earth, and in the seventh he ceased from work."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Deditque Dominus Moysi, completis hujuscemodi sermonibus in monte Sinai, duas tabulas testimonii lapideas, scriptas digito Dei."
      en: "And the Lord, when he had ended these words in mount Sinai, gave to Moses two stone tables of testimony, written with the finger of God."
    status: { la: verified, en: verified }
