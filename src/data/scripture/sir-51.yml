# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: sir
chapter: 51
verses:
  - n: 1
    text:
      la: "Oratio Jesu filii Sirach. Confitebor tibi, Domine rex, et collaudabo te Deum salvatorem meum."
      en: "A prayer of Jesus the son of Sirach. I will give glory to thee, O Lord, O King, and I will praise thee, O God my Saviour."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Confitebor nomini tuo, quoniam adjutor et protector factus es mihi,"
      en: "I will give glory to thy name: for thou hast been a helper and protector to me."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et liberasti corpus meum a perditione: a laqueo linguae iniquae, et a labiis operantium mendacium: et in conspectu astantium factus es mihi adjutor."
      en: "And hast preserved my body from destruction, from the snare of an unjust tongue, and from the lips of them that forge lies, and in the sight of them that stood by, thou hast been my helper."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et liberasti me, secundum multitudinem misericordiae nominis tui, a rugientibus praeparatis ad escam:"
      en: "And thou hast delivered me, according to the multitude of the mercy of thy name, from them that did roar, prepared to devour."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "de manibus quaerentium animam meam, et de portis tribulationum quae circumdederunt me;"
      en: "Out of the hands of them that sought my life, and from the gates of afflictions, which compassed me about:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "a pressura flammae quae circumdedit me, et in medio ignis non sum aestuatus;"
      en: "From the oppression of the flame which surrounded me, and in the midst of the fire I was not burnt."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "de altitudine ventris inferi, et a lingua coinquinata, et a verbo mendacii, a rege iniquo, et a lingua injusta."
      en: "From the depth of the belly of hell, and from an unclean tongue, and from lying words, from an unjust king, and from a slanderous tongue:"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Laudabit usque ad mortem anima mea Dominum,"
      en: "My soul shall praise the Lord even to death."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et vita mea appropinquans erat in inferno deorsum."
      en: "And my life was drawing near to hell beneath."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Circumdederunt me undique, et non erat qui adjuvaret: respiciens eram ad adjutorium hominum, et non erat."
      en: "They compassed me on every side, and there was no one that would help me. I looked for the succour of men, and there was none."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Memoratus sum misericordiae tuae Domine, et operationis tuae, quae a saeculo sunt:"
      en: "I remembered thy mercy, O Lord, and thy works, which are from the beginning of the world."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "quoniam eruis sustinentes te, Domine, et liberas eos de manibus gentium."
      en: "How thou deliverest them that wait for thee, O Lord, and savest them out of the hands of the nations."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Exaltasti super terram habitationem meam, et pro morte defluente deprecatus sum."
      en: "Thou hast exalted my dwelling place upon the earth and I have prayed for death to pass away."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Invocavi Dominum patrem Domini mei, ut non derelinquat me in die tribulationis meae, et in tempore superborum, sine adjutorio."
      en: "I called upon the Lord, the father of my Lord, that he would not leave me in the day of my trouble, and in the time of the proud without help."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Laudabo nomen tuum assidue, et collaudabo illud in confessione: et exaudita est oratio mea,"
      en: "I will praise thy name continually, and will praise it with thanksgiving, and my prayer was heard."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et liberasti me de perditione, et eripuisti me de tempore iniquo."
      en: "And thou hast saved me from destruction, and hast delivered me from the evil time."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Propterea confitebor, et laudem dicam tibi, et benedicam nomini Domini."
      en: "Therefore I will give thanks, and praise thee, and bless the name of the Lord."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Cum adhuc junior essem, priusquam oberrarem, quaesivi sapientiam palam in oratione mea."
      en: "When I was yet young, before I wandered about, I sought for wisdom openly in my prayer."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Ante templum postulabam pro illis, et usque in novissimis inquiram eam: et effloruit tamquam praecox uva."
      en: "I prayed for her before the temple, and unto the very end I will seek after her, and she flourished as a grape soon ripe."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Laetatum est cor meum in ea: ambulavit pes meus iter rectum: a juventute mea investigabam eam."
      en: "My heart delighted in her, my foot walked in the right way, from my youth up I sought after her."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Inclinavi modico aurem meam, et excepi illam."
      en: "I bowed down my ear a little, and received her."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Multam inveni in meipso sapientiam, et multum profeci in ea."
      en: "I found much wisdom in myself, and I profited much therein."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Danti mihi sapientiam dabo gloriam:"
      en: "To him that giveth me wisdom, will I give glory."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "consiliatus sum enim ut facerem illam. Zelatus sum bonum, et non confundar."
      en: "For I have determined to follow her: I have had a zeal for good, and shall not be confounded."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Colluctata est anima mea in illa, et in faciendo eam confirmatus sum."
      en: "My soul hath wrestled for her, and in doing it I have been confirmed."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Manus meas extendi in altum, et insipientiam ejus luxi;"
      en: "I stretched forth my hands on high, and I bewailed my ignorance of her."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "animam meam direxi ad illam, et in agnitione inveni eam."
      en: "I directed my soul to her, and in knowledge I found her."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Possedi cum ipsa cor ab initio: propter hoc, non derelinquar."
      en: "I possessed my heart with her from the beginning: therefore I shall not be forsaken."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Venter meus conturbatus est quaerendo illam: propterea bonam possidebo possessionem."
      en: "My entrails were troubled in seeking her: therefore shall I possess a good possession."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Dedit mihi Dominus linguam mercedem meam, et in ipsa laudabo eum."
      en: "The Lord hath given me a tongue for my reward: and with it I will praise him."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Appropiate ad me, indocti, et congregate vos in domum disciplinae."
      en: "Draw near to me, ye unlearned, and gather yourselves together into the house of discipline."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Quid adhuc retardatis? et quid dicitis in his? animae vestrae sitiunt vehementer."
      en: "Why are ye slow? and what do you say of these things? your souls are exceeding thirsty."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Aperui os meum, et locutus sum: Comparate vobis sine argento,"
      en: "I have opened my mouth, and have spoken: buy her for yourselves without silver,"
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et collum vestrum subjicite jugo: et suscipiat anima vestra disciplinam: in proximo est enim invenire eam."
      en: "And submit your neck to the yoke, and let your soul receive discipline: for she is near at hand to be found."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Videte oculis vestris, quia modicum laboravi, et inveni mihi multam requiem."
      en: "Behold with your eyes how I have laboured a little, and have found much rest to myself."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Assumite disciplinam in multo numero argenti, et copiosum aurum possidete in ea."
      en: "Receive ye discipline as a great sum of money, and possess abundance of gold by her."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Laetetur anima vestra in misericordia ejus, et non confundemini in laude ipsius."
      en: "Let your soul rejoice in his mercy, and you shall not be confounded in his praise."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Operamini opus vestrum ante tempus, et dabit vobis mercedem vestram in tempore suo."
      en: "Work your work before the time, and he will give you your reward in his time."
    status: { la: verified, en: verified }
