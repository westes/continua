# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: mich
chapter: 4
verses:
  - n: 1
    text:
      la: "Et erit: in novissimo dierum erit mons domus Domini praeparatus in vertice montium, et sublimis super colles: et fluent ad eum populi,"
      en: "And it shall come to pass in the last days, that the mountain of the house of the Lord shall be prepared in the top of mountains, and high above the hills: and people shall flow to it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "et properabunt gentes multae, et dicent: Venite, ascendamus ad montem Domini, et ad domum Dei Jacob: et docebit nos de viis suis, et ibimus in semitis ejus, quia de Sion egredietur lex, et verbum Domini de Jerusalem."
      en: "And many nations shall come in haste, and say: Come, let us go up to the mountain of the Lord, and to the house of the God of Jacob: and he will teach us of his ways, and we will walk in his paths: for the law shall go forth out of Sion, and the word of the Lord out of Jerusalem."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et judicabit inter populos multos, et corripiet gentes fortes usque in longinquum: et concident gladios suos in vomeres, et hastas suas in ligones: non sumet gens adversus gentem gladium, et non discent ultra belligerare."
      en: "And he shall judge among many people, and rebuke strong nations afar off: and they shall beat their swords into ploughshares, and their spears into spades: nation shall not take sword against nation: neither shall they learn war any more."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et sedebit vir subtus vitem suam et subtus ficum suam, et non erit qui deterreat, quia os Domini exercituum locutum est."
      en: "And every man shall sit under his vine, and under his fig tree, and there shall be none to make them afraid: for the mouth of the Lord of hosts hath spoken."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Quia omnes populi ambulabunt unusquisque in nomine dei sui; nos autem ambulabimus in nomine Domini Dei nostri, in aeternum et ultra."
      en: "For all people will walk every one in the name of his god: but we will walk in the name of the Lord our God for ever and ever."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "In die illa, dicit Dominus, congregabo claudicantem, et eam quam ejeceram colligam, et quam afflixeram:"
      en: "In that day, saith the Lord, I will gather up her that halteth: and her that I had cast out, I will gather up: and her whom I had afflicted."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et ponam claudicantem in reliquias, et eam quae laboraverat, in gentem robustam: et regnabit Dominus super eos in monte Sion, ex hoc nunc et usque in aeternum."
      en: "And I will make her that halted, a remnant: and her that hath been afflicted, a mighty nation: and the Lord will reign over them in mount Sion, from this time now and for ever."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et tu, turris gregis nebulosa filiae Sion, usque ad te veniet, et veniet potestas prima, regnum filiae Jerusalem."
      en: "And thou, O cloudy tower of the flock, of the daughter of Sion, unto thee shall it come: yea the first power shall come, the kingdom to the daughter of Jerusalem."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Nunc quare moerore contraheris? numquid rex non est tibi, aut consiliarius tuus periit, quia comprehendit te dolor sicut parturientem?"
      en: "Now, why art thou drawn together with grief? Hast thou no king in thee, or is thy counsellor perished, because sorrow hath taken thee as a woman in labour?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dole et satage, filia Sion, quasi parturiens, quia nunc egredieris de civitate, et habitabis in regione, et venies usque ad Babylonem: ibi liberaberis, ibi redimet te Dominus de manu inimicorum tuorum."
      en: "Be in pain and labour, O daughter of Sion, as a woman that bringeth forth: for now shalt thou go out of the city, and shalt dwell in the country, and shalt come even to Babylon, there thou shalt be delivered: there the Lord will redeem thee out of the hand of thy enemies."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et nunc congregatae sunt super te gentes multae, quae dicunt: Lapidetur, et aspiciat in Sion oculus noster."
      en: "And now many nations are gathered together against thee, and they say: Let her be stoned: and let our eye look upon Sion."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Ipsi autem non cognoverunt cogitationes Domini, et non intellexerunt consilium ejus, quia congregavit eos quasi foenum areae."
      en: "But they have not known the thoughts of the Lord, and have not understood his counsel: because he hath gathered them together as the hay of the floor."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Surge, et tritura, filia Sion, quia cornu tuum ponam ferreum, et ungulas tuas ponam aereas; et comminues populos multos, et interficies Domino rapinas eorum, et fortitudinem eorum Domino universae terrae."
      en: "Arise, and tread, O daughter of Sion: for I will make thy horn iron, and thy hoofs I will make brass: and thou shalt beat in pieces many peoples, and shalt immolate the spoils of them to the Lord, and their strength to the Lord of the whole earth."
    status: { la: verified, en: verified }
