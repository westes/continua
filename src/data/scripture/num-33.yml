    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "unde profecti castrametati sunt in Hietebatha"
      en: "From thence they went and camped in Jetebatha."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "et de Hietebatha venerunt in Ebrona"
      en: "And from Jetebatha they came to Hebrona."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "egressique de Ebrona castrametati sunt in Asiongaber"
      en: "And departing from Hebrona, they camped in Asiongaber."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "inde profecti venerunt in desertum Sin haec est Cades"
      en: "They removed from thence and came into the desert of Sin, which is Cades."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "egressique de Cades castrametati sunt in monte Hor in extremis finibus terrae Edom"
      en: "And departing from Cades, they camped in mount Her, in the uttermost borders of the land of Edom."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "ascenditque Aaron sacerdos montem Hor iubente Domino et ibi mortuus est anno quadragesimo egressionis filiorum Israhel ex Aegypto mense quinto prima die mensis"
      en: "And Aaron the priest went up into mount Hor at the commandment of the Lord: and there he died in the fortieth year of the coming forth of the children of Israel out of Egypt, W the fifth month, the first day of the month,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "cum esset annorum centum viginti trium"
      en: "When he was a hundred and twenty-three years old."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "audivitque Chananeus rex Arad qui habitabat ad meridiem in terra Chanaan venisse filios Israhel"
      en: "And king Arad the Chanaanite, who dwelt towards the south, heard that the children of Israel were come to the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "et profecti de monte Hor castrametati sunt in Salmona"
      en: "And they departed from mount Her, and camped in Salmona."
    status: { la: verified, en: verified }
  - n: 42
