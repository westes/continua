    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "et de Oboth venerunt in Ieabarim quae est in finibus Moabitarum"
      en: "And from Oboth they came to Ijeabarim, which is in the borders of the Moabites."
    status: { la: verified, en: verified }
  - n: 45
