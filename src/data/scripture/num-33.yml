# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: num
chapter: 33
verses:
  - n: 1
    text:
      la: "Hae sunt mansiones filiorum Israel, qui egressi sunt de Aegypto per turmas suas in manu Moysi et Aaron,"
      en: "These are the mansions of the children of Israel, who went out of Egypt by their troops under the conduct of Moses and Aaron,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "quas descripsit Moyses juxta castrorum loca, quae Domini jussione mutabant."
      en: "Which Moses wrote down according to the places of their encamping, which they changed by the commandment of the Lord."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Profecti igitur de Ramesse mense primo, quintadecima die mensis primi, altera die Phase, filii Israel in manu excelsa, videntibus cunctis Aegyptiis,"
      en: "Now the children of Israel departed from Ramesses the first month, on the fifteenth day of the first month, the day after the phase, with a mighty hand, in the sight of all the Egyptians,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et sepelientibus primogenitos, quos percusserat Dominus ( nam et in diis eorum exercuerat ultionem),"
      en: "Who were burying their firstborn, whom the Lord had slain (upon their gods also he had executed vengeance,)"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "castrametati sunt in Soccoth."
      en: "And they camped in Soccoth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et de Soccoth venerunt in Etham, quae est in extremis finibus solitudinis."
      en: "And from Soccoth they came into Etham, which is in the uttermost borders of the wilderness."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Inde egressi venerunt contra Phihahiroth, quae respicit Beelsephon, et castrametati sunt ante Magdalum."
      en: "Departing from thence they came over against Phihahiroth, which looketh towards Beelsephon, and they camped before Magdalum."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Profectique de Phihahiroth, transierunt per medium mare in solitudinem: et ambulantes tribus diebus per desertum Etham, castrametati sunt in Mara."
      en: "And departing from Phihahiroth, they passed through the midst of the sea into the wilderness: and having marched three days through the desert of Etham, they camped in Mara."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Profectique de Mara, venerunt in Elim, ubi erant duodecim fontes aquarum, et palmae septuaginta: ibique castrametati sunt."
      en: "And departing from Mara, they came into Elim, where there were twelve fountains of waters, and seventy palm trees: and there they camped."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Sed et inde egressi, fixerunt tentoria super mare Rubrum. Profectique de mari Rubro,"
      en: "But departing from thence also, they pitched their tents by the Red Sea. And departing from the Red Sea,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "castrametati sunt in deserto Sin."
      en: "They camped in the desert of Sin."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Unde egressi, venerunt in Daphca."
      en: "And they removed from thence, and came to Daphca."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Profectique de Daphca, castrametati sunt in Alus."
      en: "And departing from Daphca, they camped in Alus."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Egressique de Alus, in Raphidim fixere tentoria, ubi populo defuit aqua ad bibendum."
      en: "And departing from Alus, they pitched their tents in Raphidim, where the people wanted water to drink."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Profectique de Raphidim, castrametati sunt in deserto Sinai."
      en: "And departing from Raphidim, they camped in the desert of Sinai."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sed et de solitudine Sinai egressi, venerunt ad sepulchra concupiscentiae."
      en: "But departing also from the desert of Sinai, they came to the graves of lust."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Profectique de sepulchris concupiscentiae, castrametati sunt in Haseroth."
      en: "And departing from the graves of lust, they camped in Haseroth."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et de Haseroth venerunt in Rethma."
      en: "And from Haseroth they came to Rethma."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Profectique de Rethma, castrametati sunt in Remmomphares."
      en: "And departing from Rethma, they camped in Remmomphares."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Unde egressi venerunt in Lebna."
      en: "And they departed from thence and came to Lebna."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "De Lebna castrametati sunt in Ressa."
      en: "Removing from Lebna they camped in Ressa."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Egressique de Ressa, venerunt in Ceelatha."
      en: "And departing from Ressa, they came to Ceelatha."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Unde profecti, castrametati sunt in monte Sepher."
      en: "And they removed from thence and camped in the mountain Sepher."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Egressi de monte Sepher, venerunt in Arada."
      en: "Departing from the mountain Sepher, they came to Arada."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Inde proficiscentes, castrametati sunt in Maceloth."
      en: "From thence they went and camped in Maceloth."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Profectique de Maceloth, venerunt in Thahath."
      en: "And departing from Maceloth, they came to Thahath."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "De Thahath, castrametati sunt in Thare."
      en: "Removing from Thahath they camped in Thare."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Unde egressi, fixere tentoria in Methca."
      en: "And they departed from thence, and pitched their tents in Methca."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et de Methca, castrametati sunt in Hesmona."
      en: "And removing from Methca, they camped in Hesmona."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Profectique de Hesmona, venerunt in Moseroth."
      en: "And departing from Hesmona, they came to Moseroth."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et de Moseroth, castrametati sunt in Benejaacan."
      en: "And removing from Moseroth, they camped in Benejaacan."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Profectique de Benejaacan, venerunt in montem Gadgad."
      en: "And departing from Benejaacan, they came to mount Gadgad."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Unde profecti, castrametati sunt in Jetebatha."
      en: "From thence they went and camped in Jetebatha."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et de Jetebatha venerunt in Hebrona."
      en: "And from Jetebatha they came to Hebrona."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Egressique de Hebrona, castrametati sunt in Asiongaber."
      en: "And departing from Hebrona, they camped in Asiongaber."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Inde profecti, venerunt in desertum Sin, haec est Cades."
      en: "They removed from thence and came into the desert of Sin, which is Cades."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Egressique de Cades, castrametati sunt in monte Hor, in extremis finibus terrae Edom."
      en: "And departing from Cades, they camped in mount Hor, in the uttermost borders of the land of Edom."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Ascenditque Aaron sacerdos in montem Hor jubente Domino: et ibi mortuus est anno quadragesimo egressionis filiorum Israel ex Aegypto, mense quinto, prima die mensis,"
      en: "And Aaron the priest went up into mount Hor at the commandment of the Lord: and there he died in the fortieth year of the coming forth of the children of Israel out of Egypt, the fifth month, the first day of the month,"
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "cum esset annorum centum viginti trium."
      en: "When he was a hundred and twenty-three years old."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Audivitque Chananaeus rex Arad, qui habitabat ad meridiem, in terram Chanaan venisse filios Israel."
      en: "And king Arad the Chanaanite, who dwelt towards the south, heard that the children of Israel were come to the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et profecti de monte Hor, castrametati sunt in Salmona."
      en: "And they departed from mount Hor, and camped in Salmona."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Unde egressi, venerunt in Phunon."
      en: "From whence they removed and came to Phunon."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Profectique de Phunon, castrametati sunt in Oboth."
      en: "And departing from Phunon, they camped in Oboth."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et de Oboth venerunt in Ijeabarim, quae est in finibus Moabitarum."
      en: "And from Oboth they came to Ijeabarim, which is in the borders of the Moabites."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Profectique de Ijeabarim, fixere tentoria in Dibongad."
      en: "And departing from Ijeabarim they pitched their tents in Dibongab."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Unde egressi, castrametati sunt in Helmondeblathaim."
      en: "From thence they went and camped in Helmondeblathaim."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Egressique de Helmondeblathaim, venerunt ad montes Abarim contra Nabo."
      en: "And departing from Helmondeblathaim, they came to the mountains of Abarim over against Nabo."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "Profectique de montibus Abarim, transierunt ad campestria Moab, supra Jordanem, contra Jericho."
      en: "And departing from the mountains of Abarim, they passed to the plains of Moab, by the Jordan, over against Jericho."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Ibique castrametati sunt de Bethsimoth usque ad Abelsatim in planioribus locis Moabitarum."
      en: "And there they camped from Bethsi moth even to Ablesatim in the plains of the Moabites,"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Ubi locutus est Dominus ad Moysen:"
      en: "Where the Lord said to Moses:"
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Praecipe filiis Israel, et dic ad eos: Quando transieritis Jordanem, intrantes terram Chanaan,"
      en: "Command the children of Israel, and say to them: When you shall have passed over the Jordan, entering into the land of Chanaan,"
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "disperdite cunctos habitatores terrae illius: confringite titulos, et statuas comminuite, atque omnia excelsa vastate,"
      en: "Destroy all the inhabitants of that land: beat down their pillars, and break in pieces their statues, and waste all their high places,"
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "mundantes terram, et habitantes in ea. Ego enim dedi vobis illam in possessionem,"
      en: "Cleansing the land, and dwelling in it. For I have given it you for a possession."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "quam dividetis vobis sorte. Pluribus dabitis latiorem, et paucis angustiorem. Singulis ut sors ceciderit, ita tribuetur haereditas. Per tribus et familias possessio dividetur."
      en: "And you shall divide it among you by lot. To the more you shall give a larger part, and to the fewer a lesser. To every one as the lot shall fall, so shall the inheritance be given. The possession shall be divided by the tribes and the families."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Sin autem nolueritis interficere habitatores terrae: qui remanserint, erunt vobis quasi clavi in oculis, et lanceae in lateribus, et adversabuntur vobis in terra habitationis vestrae:"
      en: "But if you will not kill the inhabitants of the land: they that remain, shall be unto you as nails in your eyes, and spears in your sides, and they shall be your adversaries in the land of your habitation."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "et quidquid illis cogitaveram facere, vobis faciam."
      en: "And whatsoever I had thought to do to them, I will do to you."
    status: { la: verified, en: verified }
