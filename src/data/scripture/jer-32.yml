# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: jer
chapter: 32
verses:
  - n: 1
    text:
      la: "Verbum quod factum est ad Jeremiam a Domino, in anno decimo Sedeciae regis Juda, ipse est annus decimus octavus Nabuchodonosor."
      en: "The word that came to Jeremias from the Lord in the tenth year of Sedecias king of Juda: the same is eighteenth year of Nabuchodonosor."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Tunc exercitus regis Babylonis obsidebat Jerusalem, et Jeremias propheta erat clausus in atrio carceris qui erat in domo regis Juda."
      en: "At that time the army of the king of Babylon besieged Jerusalem: and Jeremias the prophet was shut up in the court of the prison, which was in the house of the king of Juda."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Clauserat enim eum Sedecias rex Juda, dicens: Quare vaticinaris, dicens: Haec dicit Dominus: Ecce ego dabo civitatem istam in manus regis Babylonis, et capiet eam;"
      en: "For Sedecias king of Juda had shut him up, saying: Why dost thou prophesy, saying: Thus saith the Lord: Behold I will give this city into the hand of the king of Babylon, and he shall take it?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et Sedecias rex Juda non effugiet de manu Chaldaeorum, sed tradetur in manus regis Babylonis: et loquetur os ejus cum ore illius, et oculi ejus oculos illius videbunt:"
      en: "And Sedecias king of Juda shall not escape out of the hand of the Chaldeans: but he shall be delivered into the hands of the king of Babylon: and he shall speak to him mouth to mouth, and his eyes shall see his eyes."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et in Babylonem ducet Sedeciam, et ibi erit donec visitem eum, ait Dominus: si autem dimicaveritis adversum Chaldaeos, nihil prosperum habebitis?"
      en: "And he shall lead Sedecias to Babylon: and he shall be there till I visit him, saith the Lord. But if you will fight against the Chaldeans, you shall have no success."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et dixit Jeremias: Factum est verbum Domini ad me, dicens:"
      en: "And Jeremias said: The word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Ecce Hanameel filius Sellum, patruelis tuus, veniet ad te, dicens: Eme tibi agrum meum qui est in Anathoth, tibi enim competit ex propinquitate ut emas."
      en: "Behold, Hanameel the son of Sellum thy cousin shall come to thee, saying: Buy thee my field, which is in Anathoth, for it is thy right to buy it, being next akin."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Et venit ad me Hanameel filius patrui mei, secundum verbum Domini, ad vestibulum carceris, et ait ad me: Posside agrum meum qui est in Anathoth, in terra Benjamin, quia tibi competit haereditas, et tu propinquus es ut possideas. Intellexi autem quod verbum Domini esset:"
      en: "And Hanameel my uncle's son came to me, according to the word of the Lord, to the entry of the prison, and said me: Buy my field, which is in Anathoth in the land of Benjamin: for the right of inheritance is thine, and thou art next of kin to possess it. And I understood that this was the word of the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et emi agrum ab Hanameel filio patrui mei, qui est in Anathoth, et appendi ei argentum: septem stateres, et decem argenteos."
      en: "And I bought the held of my uncle's son, that is in Anathoth: and I weighed him the money, seven staters, and ten pieces of silver."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et scripsi in libro, et signavi, et adhibui testes, et appendi argentum in statera."
      en: "And I wrote it in a book and sealed it, and took witnesses: and I weighed him the money in the balances."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et accepi librum possessionis signatum et stipulationes, et rata, et signa forinsecus:"
      en: "And I took the deed of the purchase that was sealed, and the stipulations, and the ratifications with the seals that were on the outside."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "et dedi librum possessionis Baruch filio Neri filii Maasiae, in oculis Hanameel patruelis mei, in oculis testium qui scripti erant in libro emptionis, et in oculis omnium Judaeorum qui sedebant in atrio carceris."
      en: "And I gave the deed of the purchase to Baruch the son of Neri the son of Maasias in the sight of Hanameel my uncle's son, in the presence of the witnesses that subscribed the book of the purchase, and before all the Jews that sat in the court of the prison."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et praecepi Baruch coram eis, dicens:"
      en: "And I charged Baruch before them, saying:"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Haec dicit Dominus exercituum, Deus Israel: Sume libros istos, librum emptionis hunc signatum, et librum hunc qui apertus est, et pone illos in vase fictili, ut permanere possint diebus multis:"
      en: "Thus saith the Lord of hosts the God of Israel: Take these writings, this deed of the purchase that is sealed up, and this deed that is open: and put them in an earthen vessel, that they may continue many days."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "haec enim dicit Dominus exercituum, Deus Israel: Adhuc possidebuntur domus, et agri, et vineae in terra ista."
      en: "For thus saith the Lord of hosts the God of Israel: Houses, and fields, and vineyards shall be possessed again in this land."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et oravi ad Dominum, postquam tradidi librum possessionis Baruch filio Neri, dicens:"
      en: "And after I had delivered the deed of purchase to Baruch the son of Neri, I prayed to the Lord, saying:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Heu! heu! heu! Domine Deus, ecce tu fecisti caelum et terram in fortitudine tua magna, et in brachio tuo extento: non erit tibi difficile omne verbum:"
      en: "Alas, alas, alas, O Lord God, behold thou hast made heaven and earth by thy great power, and thy stretched out arm: no word shall be hard to thee:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "qui facis misericordiam in millibus, et reddis iniquitatem patrum in sinum filiorum eorum post eos: fortissime, magne, et potens, Dominus exercituum nomen tibi."
      en: "Thou shewest mercy unto thousands, and returnest the iniquity of the fathers into the bosom of their children after them: O most mighty, great, and powerful, the Lord of hosts is thy name."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Magnus consilio, et incomprehensibilis cogitatu: cujus oculi aperti sunt super omnes vias filiorum Adam, ut reddas unicuique secundum vias suas, et secundum fructum adinventionum ejus."
      en: "Great in counsel and incomprehensible in thought: whose eyes are open upon all the ways of the children of Adam, to render unto every one according to his ways, and according to the fruit of his devices."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Qui posuisti signa et portenta in terra Aegypti usque ad diem hanc, et in Israel, et in hominibus, et fecisti tibi nomen sicut est dies haec."
      en: "Who hast set signs and wonders in the land of Egypt even until this day, and in Israel, and amongst men, and hast made thee a name as at this day."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et eduxisti populum tuum Israel de terra Aegypti, in signis et in portentis, et in manu robusta et in brachio extento, et in terrore magno:"
      en: "And hast brought forth thy people Israel, out of the land of Egypt with signs, and with wonders, and with a strong hand, and a stretched out arm, and with great terror."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et dedisti eis terram hanc, quam jurasti patribus eorum ut dares eis, terram fluentem lacte et melle."
      en: "And hast given them this land which thou didst swear to their fathers, to give them a land flowing with milk and honey."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Et ingressi sunt, et possederunt eam, et non obedierunt voci tuae, et in lege tua non ambulaverunt: omnia quae mandasti eis ut facerent non fecerunt, et evenerunt eis omnia mala haec."
      en: "And they came in, and possessed it: but they obeyed not thy voice, and they walked not in thy law: and they did not any of those things that thou didst command them to do, and all these evils are come upon them."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Ecce munitiones exstructae sunt adversum civitatem ut capiatur, et urbs data est in manus Chaldaeorum, qui praeliantur adversus eam, a facie gladii, et famis, et pestilentiae: et quaecumque locutus es acciderunt, ut tu ipse cernis."
      en: "Behold works are built up against the city to take it: and the city is given into the hands of the Chaldeans, who fight against it, by the sword, and the famine, and the pestilence: and what thou hast spoken, is all come to pass, as thou thyself seest."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et tu dicis mihi, Domine Deus: Eme agrum argento, et adhibe testes, cum urbs data sit in manus Chaldaeorum?"
      en: "And sayest thou to me, O Lord God: Buy a field for money, and take witnesses, whereas the city is given into the hands of the Chaldeans?"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et factum est verbum Domini ad Jeremiam, dicens:"
      en: "And the word of the Lord came to Jeremias, saying:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Ecce ego Dominus Deus universae carnis: numquid mihi difficile erit omne verbum?"
      en: "Behold I am the Lord the God of all flesh: shall any thing be hard for me?"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Propterea haec dicit Dominus: Ecce ego tradam civitatem istam in manus Chaldaeorum, et in manus regis Babylonis, et capient eam."
      en: "Therefore thus saith the Lord: Behold I will deliver this city into the hands of the Chaldeans, and into the hands of the king of Babylon, and they shall take it."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et venient Chaldaei praeliantes adversum urbem hanc, et succendent eam igni, et comburent eam, et domos in quarum domatibus sacrificabant Baal, et libabant diis alienis libamina ad irritandum me."
      en: "And the Chaldeans that fight against this city, shall come and set it on fire, and burn it, with the houses upon whose roofs they offered sacrifice to Baal, and poured out drink offerings to strange gods, to provoke me to wrath."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Erant enim filii Israel et filii Juda jugiter facientes malum in oculis meis ab adolescentia sua: filii Israel, qui usque nunc exacerbant me in opere manuum suarum, dicit Dominus."
      en: "For the children of Israel, and the children of Juda, have continually done evil in my eyes from their youth: the children of Israel who even till now provoke me with the work of their hands, saith the Lord."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Quia in furore et in indignatione mea facta est mihi civitas haec, a die qua aedificaverunt eam, usque ad diem istam qua auferetur de conspectu meo,"
      en: "For this city hath been to me a provocation and indignation from the day that they built it, until this day, in which it shall be taken out of my sight."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "propter malitiam filiorum Israel et filiorum Juda, quam fecerunt ad iracundiam me provocantes, ipsi et reges eorum, principes eorum, et sacerdotes eorum, et prophetae eorum, viri Juda et habitatores Jerusalem."
      en: "Because of all the evil of the children of Israel, and of the children of Juda, which they have done, provoking me to wrath, they and their kings, their princes, and their priests, and their prophets, the men of Juda, and the inhabitants of Jerusalem."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Et verterunt ad me terga, et non facies, cum docerem eos diluculo et erudirem, et nollent audire, ut acciperent disciplinam."
      en: "And they have turned their backs to me, and not their faces: when I taught them early in the morning, and instructed them, and they would not hearken to receive instruction."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Et posuerunt idola sua in domo in qua invocatum est nomen meum, ut polluerent eam."
      en: "And they have set their idols in the house, in which my name is called upon, to defile it."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et aedificaverunt excelsa Baal, quae sunt in valle filii Ennom, ut initiarent filios suos et filias suas Moloch, quod non mandavi eis, nec ascendit in cor meum ut facerent abominationem hanc, et in peccatum deducerent Judam."
      en: "And they have built the high places of Baal, which are in the valley of the son of Ennom, to consecrate their sons and their daughters to Moloch: which I commanded them not, neither entered it into my heart, that they should do this abomination, and cause Juda to sin."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "Et nunc propter ista, haec dicit Dominus Deus Israel ad civitatem hanc, de qua vos dicitis quod tradetur in manus regis Babylonis, in gladio, et in fame, et in peste:"
      en: "And now, therefore, thus saith the Lord the God of Israel to this city, whereof you say that it shall be delivered into the hands of the king of Babylon by the sword, and by famine, and by pestilence:"
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Ecce ego congregabo eos de universis terris ad quas ejeci eos in furore meo, et in ira mea, et indignatione grandi: et reducam eos ad locum istum, et habitare eos faciam confidenter:"
      en: "Behold I will gather them together out of all the lands to which I have cast them out in my anger, and in my wrath, and in my great indignation: and I will bring them again into this place, and will cause them to dwell securely."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "et erunt mihi in populum, et ego ero eis in Deum."
      en: "And they shall be my people, and I will be their God."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Et dabo eis cor unum, et viam unam, ut timeant me universis diebus, et bene sit eis, et filiis eorum post eos."
      en: "And I will give them one heart, and one way, that they may fear me all days: and that it may be well with them, and with their children after them."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "Et feriam eis pactum sempiternum, et non desinam eis benefacere: et timorem meum dabo in corde eorum, ut non recedant a me."
      en: "And I will make an everlasting covenant with them, and will not cease to do them good: and I will give my fear in their heart, that they may not revolt from me."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et laetabor super eis, cum bene eis fecero: et plantabo eos in terra ista in veritate, in toto corde meo et in tota anima mea."
      en: "And I will rejoice over them, when I shall do them good: and I will plant them in this land in truth, with my whole heart, and with all my soul."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Quia haec dicit Dominus: Sicut adduxi super populum istum omne malum hoc grande, sic adducam super eos omne bonum quod ego loquor ad eos."
      en: "For thus saith the Lord: As I have brought upon this people all this great evil: so will I bring upon them all the good that I now speak to them."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Et possidebuntur agri in terra ista, de qua vos dicitis quod deserta sit, eo quod non remanserit homo et jumentum, et data sit in manus Chaldaeorum."
      en: "And fields shall be purchased in this land: whereof you say that it is desolate, because there remaineth neither man nor beast, and it is given into the hands of the Chaldeans."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Agri ementur pecunia, et scribentur in libro, et imprimetur signum, et testis adhibebitur, in terra Benjamin et in circuitu Jerusalem, in civitatibus Juda, et in civitatibus montanis, et in civitatibus campestribus, et in civitatibus quae ad austrum sunt, quia convertam captivitatem eorum, ait Dominus."
      en: "Fields shall be bought for money, and deeds shall be written, and sealed, and witnesses shall be taken, in the land of Benjamin, and round about Jerusalem, in the cities of Juda, and in the cities on the mountains, and in the cities of the plains, and in the cities that are towards the south: for I will bring back their captivity, saith the Lord."
    status: { la: verified, en: verified }
