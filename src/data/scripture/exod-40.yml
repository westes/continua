# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 40
verses:
  - n: 1
    text:
      la: "locutusque est Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "mense primo die prima mensis eriges tabernaculum testimonii"
      en: "The first month, the first day of the month, thou shalt set up the tabernacle of the testimony,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et pones in eo arcam dimittesque ante illam velum"
      en: "And shalt put the ark in it, and shalt let down the veil before it:"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et inlata mensa pones super eam quae rite praecepta sunt candelabrum stabit cum lucernis suis"
      en: "And thou shalt bring in the table, and set upon it the things that are commanded according to the rite. The candlestick shall stand with its lamps,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et altare aureum in quo adoletur incensum coram arca testimonii tentorium in introitu tabernaculi pones"
      en: "And the altar of gold whereon the incense is burnt, before the ark of the testimony. Thou shalt put the hanging in the entry of the tabernacle,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et ante illud altare holocausti"
      en: "And before it the altar of holocaust:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "labrum inter altare et tabernaculum quod implebis aqua"
      en: "The laver between the altar and the tabernacle, and thou shalt fill it with water."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "circumdabisque atrium tentoriis et ingressum eius"
      en: "And thou shalt encompass the court with hangings, and the entry thereof."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et adsumpto unctionis oleo ungues tabernaculum cum vasis suis ut sanctificentur"
      en: "And thou shalt take the oil of unction and anoint the tabernacle with its vessels, that they may be sanctified:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "altare holocausti et omnia vasa eius"
      en: "The altar of holocaust and all its vessels:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "labrum cum basi sua omnia unctionis oleo consecrabis ut sint sancta sanctorum"
      en: "The laver with its foot: thou shalt consecrate all with the oil of unction, that they may be most holy."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "adplicabisque Aaron et filios eius ad fores tabernaculi testimonii et lotos aqua"
      en: "And thou shalt bring Aaron and his sons to the door of the tabernacle of the testimony, and having washed them with water,"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "indues sanctis vestibus ut ministrent mihi et unctio eorum in sacerdotium proficiat sempiternum"
      en: "Thou shalt put on them the holy vestments, that they may minister to me, and that the unction of them may prosper to an everlasting priesthood."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "fecitque Moses omnia quae praeceperat Dominus"
      en: "And Moses did all that the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "igitur mense primo anni secundi in prima die mensis conlocatum est tabernaculum"
      en: "So in the first month of the second year, the first day of the month, the tabernacle was set up."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "erexitque illud Moses et posuit tabulas ac bases et vectes statuitque columnas"
      en: "And Moses reared it up, and placed the boards and the sockets and the bars, and set up the pillars,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et expandit tectum super tabernaculum inposito desuper operimento sicut Dominus imperarat"
      en: "And spread the roof over the tabernacle, putting over it a cover, as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "posuit et testimonium in arca subditis infra vectibus et oraculum desuper"
      en: "And he put the testimony in the ark, thrusting bars underneath, and the oracle above."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "cumque intulisset arcam in tabernaculum adpendit ante eam velum ut expleret Domini iussionem"
      en: "And when he had brought the ark into the tabernacle, he drew the veil before it to fulfil the commandment of the Lord."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "posuit et mensam in tabernaculo testimonii ad plagam septentrionalem extra velum"
      en: "And he set the table in the tabernacle of the testimony at the north side without the veil,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "ordinatis coram propositionis panibus sicut praeceperat Dominus Mosi"
      en: "Setting there in order the loaves of proposition, as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "posuit et candelabrum in tabernaculum testimonii e regione mensae in parte australi"
      en: "He set the candlestick also in the tabernacle of the testimony over against the table on the south side,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "locatis per ordinem lucernis iuxta praeceptum Domini"
      en: "Placing the lamps in order, according to the precept of the Lord."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "posuit et altare aureum sub tecto testimonii contra velum"
      en: "He set also the altar of gold under the roof of the testimony over against the veil,"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et adolevit super eo incensum aromatum sicut iusserat Dominus"
      en: "And burnt upon it the incense of spices, as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "posuit et tentorium in introitu tabernaculi"
      en: "And he put also the hanging in the entry of the tabernacle of the testimony,"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et altare holocausti in vestibulo testimonii offerens in eo holocaustum et sacrificia ut Dominus imperarat"
      en: "And the altar of holocaust of the entry of the testimony, offering the holocaust, and the sacrifices upon it, as the Lord had commanded."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "labrum quoque statuit inter tabernaculum testimonii et altare implens illud aqua"
      en: "And he set the laver between the tabernacle of the testimony and the altar, filling it with water."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "laveruntque Moses et Aaron ac filii eius manus suas et pedes"
      en: "And Moses and Aaron, and his sons washed their hands and feet,"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "cum ingrederentur tectum foederis et accederent ad altare sicut praeceperat Dominus"
      en: "When they went into the tabernacle of the covenant, and went to the altar, as the Lord had commanded Moses."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "erexit et atrium per gyrum tabernaculi et altaris ducto in introitu eius tentorio postquam cuncta perfecta sunt"
      en: "He set up also the court round about the tabernacle and the altar, drawing the hanging in the entry thereof. After all things were perfected,"
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "operuit nubes tabernaculum testimonii et gloria Domini implevit illud"
      en: "The cloud covered the tabernacle of the testimony, and the glory of the Lord filled it."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "nec poterat Moses ingredi tectum foederis nube operiente omnia et maiestate Domini coruscante quia cuncta nubes operuerat"
      en: "Neither could Moses go into the tabernacle of the covenant, the cloud covering all things and the majesty of the Lord shining, for the cloud had covered all."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "si quando nubes tabernaculum deserebat proficiscebantur filii Israhel per turmas suas"
      en: "If at any time the cloud removed from the tabernacle, the children of Israel went forward by their troops:"
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "si pendebat desuper manebant in eodem loco"
      en: "If it hung over, they remained in the same place."
    status: { la: verified, en: verified }
