# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 18
verses:
  - n: 1
    text:
      la: "Factum est autem post haec, ut percuteret David Philisthiim, et humiliaret eos, et tolleret Geth, et filias ejus de manu Philisthiim,"
      en: "And it came to pass after this, that David defeated the Philistines, and humbled them, and took away Geth, and her daughters out of the hands of the Philistines,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "percuteretque Moab, et fierent Moabitae servi David, offerentes ei munera."
      en: "And he defeated Moab, and the Moabites were made David's servants, and brought him gifts."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Eo tempore percussit David etiam Adarezer regem Soba regionis Hemath, quando perrexit ut dilataret imperium suum usque ad flumen Euphraten."
      en: "At that time David defeated also Adarezer king of Soba of the land of Hemath, when he went to extend his dominions as far as the river Euphrates."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Cepit ergo David mille quadrigas ejus, et septem millia equitum, ac viginti millia virorum peditum, subnervavitque omnes equos curruum, exceptis centum quadrigis, quas reservavit sibi."
      en: "And David took from him a thousand chariots, and seven thousand horsemen, and twenty thousand footmen, and he houghed all the chariot horses, only a hundred chariots, which he reserved for himself."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Supervenit autem et Syrus Damascenus, ut auxilium praeberet Adarezer regi Soba: sed et hujus percussit David viginti duo millia virorum."
      en: "And the Syrians of Damascus came also to help Adarezer king of Soba: and David slew of them likewise two and twenty thousand men."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et posuit milites in Damasco, ut Syria quoque serviret sibi, et offerret munera. Adjuvitque eum Dominus in cunctis, ad quae perrexerat."
      en: "And he put a garrison in Damascus, that Syria also should serve him, and bring gifts. And the Lord assisted him in all things to which he went."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tulit quoque David pharetras aureas, quas habuerant servi Adarezer, et attulit eas in Jerusalem."
      en: "And David took the golden quivers which the servants of Adarezer had, and he brought them to Jerusalem."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Necnon de Thebath et Chun, urbibus Adarezer aeris plurimum, de quo fecit Salomon mare aeneum, et columnas, et vasa aenea."
      en: "Likewise out of Thebath and Chun, cities of Adarezer, he brought very much brass, of which Solomon made the brazen sea, and the pillars, and the vessels of brass."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Quod cum audisset Thou rex Hemath, percussisse videlicet David omnem exercitum Adarezer regis Soba,"
      en: "Now when Thou king of Hemath heard that David had defeated all the army of Adarezer king of Soba,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "misit Adoram filium suum ad regem David, ut postularet ab eo pacem, et congratularetur ei quod percussisset, et expugnasset Adarezer: adversarius quippe erat Thou Adarezer."
      en: "He sent Adoram his son to king David, to desire peace of him, and to congratulate him that he had defeated and overthrown Adarezer: for Thou was an enemy to Adarezer."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Sed et omnia vasa aurea, et argentea, et aenea consecravit David rex Domino, cum argento et auro, quod tulerat ex universis gentibus, tam de Idumaea, et Moab, et filiis Ammon, quam de Philisthiim et Amalec."
      en: "And all the vessels of gold, and silver, and brass king David consecrated to the Lord, with the silver and gold which he had taken from all the nations, as well from Edom, and from Moab, and from the sons of Ammon, as from the Philistines, and from Amalec."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Abisai vero filius Sarviae percussit Edom in valle Salinarum, decem et octo millia:"
      en: "And Abisai the son of Sarvia slew of the Edomites in the vale of the saltpits, eighteen thousand:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et constituit in Edom praesidium, ut serviret Idumaea David: salvavitque Dominus David in cunctis, ad quae perrexerat."
      en: "And he put a garrison in Edom, that Edom should serve David: and the Lord preserved David in all things to which he went."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Regnavit ergo David super universum Israel, et faciebat judicium atque justitiam cuncto populo suo."
      en: "So David reigned over all Israel, and executed judgment and justice among all his people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Porro Joab filius Sarviae erat super exercitum, et Josaphat filius Ahilud a commentariis."
      en: "And Joab the son of Sarvia was over the army, and Josaphat the son of Ahilud recorder."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sadoc autem filius Achitob, et Ahimelech filius Abiathar, sacerdotes: et Susa, scriba."
      en: "And Sadoc the son of Achitob, and Achimelech the son of Abiathar, were the priests: and Susa, scribe."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Banaias quoque filius Jojadae super legiones Cerethi, et Phelethi: porro filii David, primi ad manum regis."
      en: "And Banaias the son of Joiada was over the bands of the Cerethi, and the Phelethi: and the sons of David were chief about the king."
    status: { la: verified, en: verified }
