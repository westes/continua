# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1par
chapter: 18
verses:
  - n: 1
    text:
      la: "factum est autem post haec ut percuteret David Philisthim et humiliaret eos et tolleret Geth et filias eius de manu Philisthim"
      en: "And it came to pass after this, that David defeated the Philistines, and humbled them, and took away Geth, and her daughters out of the hands of the Philistines,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "percuteretque Moab et fierent Moabitae servi David offerentes ei munera"
      en: "And he defeated Moab, and the Moabites were made David's servants, and brought him gifts."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "eo tempore percussit David etiam Adadezer regem Suba regionis Emath quando perrexit ut dilataret imperium suum usque ad flumen Eufraten"
      en: "At that time David defeated also Adarezer king of Soba of the land of Hemath, when he went to extend his dominions as far as the river Euphrates."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cepit ergo David mille quadrigas eius et septem milia equites ac viginti milia virorum peditum subnervavitque omnes equos curruum exceptis centum quadrigis quas reservavit sibi"
      en: "And David took from him a thousand chariots, and seven thousand horsemen, and twenty thousand footmen, and he houghed all the chariot horses, only a hundred chariots, which he reserved for himself."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "supervenit autem et Syrus damascenus ut auxilium praeberet Adadezer regi Suba sed et huius percussit David viginti duo milia virorum"
      en: "And the Syrians of Damascus came also to help Adarezer king of Soba: and David slew of them likewise two and twenty thousand men."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et posuit milites in Damasco ut Syria quoque serviret sibi et offerret munera adiuvitque eum Dominus in cunctis ad quae perrexerat"
      en: "And he put a garrison in Damascus, that Syria also should serve him, and bring gifts. And the Lord assisted him in all things to which he went."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tulit quoque David faretras aureas quas habuerant servi Adadezer et adtulit eas in Hierusalem"
      en: "And David took the golden quivers which the servants of Adarezer had, and he brought them to Jerusalem."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "necnon de Thebath et Chun urbibus Adadezer aeris plurimum de quo fecit Salomon mare aeneum et columnas et vasa aenea"
      en: "Likewise out of Thebath and Chun, cities of Adarezer, he brought very much brass, of which Solomon made the brazen sea, and the pillars, and the vessels of brass."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quod cum audisset Thou rex Emath percussisse videlicet David omnem exercitum Adadezer regis Suba"
      en: "Now when Thou king of Hemath heard that David had defeated all the army of Adarezer king of Soba,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "misit Aduram filium suum ad regem David ut postularet ab eo pacem et congratularetur ei eo quod expugnasset et percussisset Adadezer adversarius quippe Thou erat Adadezer"
      en: "He sent Adoram his son to king David, to desire peace of him, and to congratulate him that he had defeated and overthrown Adarezer: for Thou was an enemy to Adarezer."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "sed et omnia vasa aurea et argentea et aenea consecravit rex David Domino cum argento et auro quod tulerat ex universis gentibus tam de Idumea et Moab et filiis Ammon quam de Philisthim et Amalech"
      en: "And all the vessels of gold, and silver, and brass king David consecrated to the Lord, with the silver and gold which he had taken from all the nations, as well from Edom, and from Moab, and from the sons of Ammon, as from the Philistines, and from Amalec."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Abisai vero filius Sarviae percussit Edom in valle Salinarum decem et octo milia"
      en: "And Abisai the son of Sarvia slew of the Edomites in the vale of the saltpits, eighteen thousand:"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et constituit in Edom praesidium ut serviret Idumea David salvavitque Dominus David in cunctis ad quae perrexerat"
      en: "And he put a garrison in Edom, that Edom should serve David: and the Lord preserved David in all things to which he went."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "regnavit ergo David super universum Israhel et faciebat iudicium atque iustitiam cuncto populo suo"
      en: "So David reigned over all Israel, and executed judgment and justice among all his people."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "porro Ioab filius Sarviae erat super exercitum et Iosaphat filius Ahilud a commentariis"
      en: "And Joab the son of Sarvia was over the army, and Josaphat the son of Ahilud recorder."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Sadoc autem filius Ahitob et Ahimelech filius Abiathar sacerdotes et Susa scriba"
      en: "And Sadoc the son of Achitob, and Achimelech the son of Abiathar, were the priests: and Susa, scribe."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Banaias vero filius Ioiada super legiones Cherethi et Felethi porro filii David primi ad manum regis"
      en: "And Banaias the son of Joiada was over the bands of the Cerethi, and the Phelethi: and the sons of David were chief about the king."
    status: { la: verified, en: verified }
