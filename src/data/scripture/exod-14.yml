# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: exod
chapter: 14
verses:
  - n: 1
    text:
      la: "locutus est autem Dominus ad Mosen dicens"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "loquere filiis Israhel reversi castrametentur e regione Phiahiroth quae est inter Magdolum et mare contra Beelsephon in conspectu eius castra ponetis super mare"
      en: "Speak to the children of Israel: Let them turn and encamp over against Phihahiroth which is between Magdal and the sea over against Beelsephon: you shall encamp before it upon the sea."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dicturusque est Pharao super filiis Israhel coartati sunt in terra conclusit eos desertum"
      en: "And Pharao will say of the children of Israel: They are straitened in the land, the desert hath shut them in."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et indurabo cor eius ac persequetur vos et glorificabor in Pharao et in omni exercitu eius scientque Aegyptii quia ego sum Dominus feceruntque ita"
      en: "And I shall harden his heart, and he will pursue you: and I shall be glorified in Pharao, and in all his army: and the Egyptians shall know that I am the Lord. And they did so."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et nuntiatum est regi Aegyptiorum quod fugisset populus inmutatumque est cor Pharaonis et servorum eius super populo et dixerunt quid voluimus facere ut dimitteremus Israhel ne serviret nobis"
      en: "And it was told the king of the Egyptians that the people was fled: and the heart of Pharao and of his servants was changed with regard to the people, and they said: What meant we to do, that we let Israel go from serving us?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "iunxit ergo currum et omnem populum suum adsumpsit secum"
      en: "So he made ready his chariot, and took all his people with him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "tulitque sescentos currus electos quicquid in Aegypto curruum fuit et duces totius exercitus"
      en: "And he took six hundred chosen chariots, and all the chariots that were in Egypt: and the captains of the whole army."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "induravitque Dominus cor Pharaonis regis Aegypti et persecutus est filios Israhel at illi egressi erant in manu excelsa"
      en: "And the Lord hardened the heart of Pharao king of Egypt, and he pursued the children of Israel: but they were gone forth in a mighty hand."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "cumque persequerentur Aegyptii vestigia praecedentium reppererunt eos in castris super mare omnis equitatus et currus Pharaonis et universus exercitus erant in Ahiroth contra Beelsephon"
      en: "And when the Egyptians followed the steps of them who were gone before, they found them encamped at the sea side: all Pharao's horse and chariots, and the whole army were in Phihahiroth before Beelsephon."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cumque adpropinquasset Pharao levantes filii Israhel oculos viderunt Aegyptios post se et timuerunt valde clamaveruntque ad Dominum"
      en: "And when Pharao drew near, the children of Israel, lifting up their eyes, saw the Egyptians behind them: and they feared exceedingly, and cried to the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dixerunt ad Mosen forsitan non erant sepulchra in Aegypto ideo tulisti nos ut moreremur in solitudine quid hoc facere voluisti ut educeres nos ex Aegypto"
      en: "And they said to Moses: Perhaps there were no graves in Egypt, therefore thou hast brought us to die in the wilderness: why wouldst thou do this, to lead us out of Egypt?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nonne iste est sermo quem loquebamur ad te in Aegypto dicentes recede a nobis ut serviamus Aegyptiis multo enim melius est servire eis quam mori in solitudine"
      en: "Is not this the word that we spoke to thee in Egypt, saying: Depart from us that we may serve the Egyptians? for it was much better to serve them, than to die in the wilderness."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "et ait Moses ad populum nolite timere state et videte magnalia Domini quae facturus est hodie Aegyptios enim quos nunc videtis nequaquam ultra videbitis usque in sempiternum"
      en: "And Moses said to the people: Fear not: stand and see the great wonders of the Lord, which he will do this day: for the Egyptians, whom you see now, you shall see no more for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dominus pugnabit pro vobis et vos tacebitis"
      en: "The Lord will fight for you, and you shall hold your peace."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixitque Dominus ad Mosen quid clamas ad me loquere filiis Israhel ut proficiscantur"
      en: "And the Lord said to Moses: Why criest thou to me? Speak to the children of Israel to go forward."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tu autem eleva virgam tuam et extende manum super mare et divide illud ut gradiantur filii Israhel in medio mari per siccum"
      en: "But lift thou up thy rod, and stretch forth thy hand over the sea, and divide it: that the children of Israel may go through the midst of the sea on dry ground."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "ego autem indurabo cor Aegyptiorum ut persequantur vos et glorificabor in Pharaone et in omni exercitu eius in curribus et in equitibus illius"
      en: "And I will harden the heart of the Egyptians to pursue you: and I will be glorified in Pharao, and in all his host, and in his chariots, and in his horsemen."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et scient Aegyptii quia ego sum Dominus cum glorificatus fuero in Pharaone et in curribus atque in equitibus eius"
      en: "And the Egyptians shall know that I am the Lord, when I shall be glorified in Pharao, and in his chariots and in his horsemen."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "tollensque se angelus Dei qui praecedebat castra Israhel abiit post eos et cum eo pariter columna nubis priora dimittens post tergum"
      en: "And the angel of God, who went before the camp of Israel, removing, went behind them: and together with him the pillar of the cloud, leaving the forepart,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "stetit inter castra Aegyptiorum et castra Israhel et erat nubes tenebrosa et inluminans noctem ut ad se invicem toto noctis tempore accedere non valerent"
      en: "Stood behind, between the Egyptians' camp and the camp of Israel: and it was a dark cloud, and enlightening the night, so that they could not come at one another all the night."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "cumque extendisset Moses manum super mare abstulit illud Dominus flante vento vehementi et urente tota nocte et vertit in siccum divisaque est aqua"
      en: "And when Moses had stretched forth his hand over the sea, the Lord took it away by a strong and burning wind blowing all the night, and turned it into dry ground: and the water was divided."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et ingressi sunt filii Israhel per medium maris sicci erat enim aqua quasi murus a dextra eorum et leva"
      en: "And the children of Israel went in through the midst of the sea dried up: for the water was as a wall on their right hand and on their left."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "persequentesque Aegyptii ingressi sunt post eos omnis equitatus Pharaonis currus eius et equites per medium maris"
      en: "And the Egyptians pursuing went in after them, and all Pharao's horses, his chariots and horsemen through the midst of the sea,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "iamque advenerat vigilia matutina et ecce respiciens Dominus super castra Aegyptiorum per columnam ignis et nubis interfecit exercitum eorum"
      en: "And now the morning watch was come, and behold the Lord looking upon the Egyptian army through the pillar of fire and of the cloud, slew their host."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et subvertit rotas curruum ferebanturque in profundum dixerunt ergo Aegyptii fugiamus Israhelem Dominus enim pugnat pro eis contra nos"
      en: "And overthrew the wheels of the chariots, and they were carried into the deep. And the Egyptians said: Let us flee from Israel: for the Lord fighteth for them against us."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ait Dominus ad Mosen extende manum tuam super mare ut revertantur aquae ad Aegyptios super currus et equites eorum"
      en: "And the Lord said to Moses: Stretch forth they hand over the sea, that the waters may come again upon the Egyptians, upon their chariots and horsemen."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "cumque extendisset Moses manum contra mare reversum est primo diluculo ad priorem locum fugientibusque Aegyptiis occurrerunt aquae et involvit eos Dominus in mediis fluctibus"
      en: "And when Moses had stretched forth his hand towards the sea, it returned at the first break of day to the former place: and as the Egyptians were fleeing away, the waters came upon them, and the Lord shut them up in the middle of the waves."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "reversaeque sunt aquae et operuerunt currus et equites cuncti exercitus Pharaonis qui sequentes ingressi fuerant mare ne unus quidem superfuit ex eis"
      en: "And the waters returned, and covered the chariots and the horsemen of all the army of Pharao, who had come into the sea after them, neither did there so much as one of them remain."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "filii autem Israhel perrexerunt per medium sicci maris et aquae eis erant quasi pro muro a dextris et a sinistris"
      en: "But the children of Israel marched through the midst of the sea upon dry land, and the waters were to them as a wall on the right hand and on the left:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "liberavitque Dominus in die illo Israhel de manu Aegyptiorum"
      en: "And the Lord delivered Israel on that day out of the hands of the Egyptians."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "et viderunt Aegyptios mortuos super litus maris et manum magnam quam exercuerat Dominus contra eos timuitque populus Dominum et crediderunt Domino et Mosi servo eius"
      en: "And they saw the Egyptians dead upon the sea shore, and the mighty hand that the Lord had used against them: and the people feared the Lord, and they believed the Lord, and Moses his servant."
    status: { la: verified, en: verified }
