# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 14
verses:
  - n: 1
    text:
      la: "Locutusque est autem Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Loquere filiis Israel: Reversi castrametentur e regione Phihahiroth, quae est inter Magdalum et mare contra Beelsephon: in conspectu ejus castra ponetis super mare."
      en: "Speak to the children of Israel: Let them turn and encamp over against Phihahiroth which is between Magdal and the sea over against Beelsephon: you shall encamp before it upon the sea."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Dicturusque est Pharao super filiis Israel: Coarctati sunt in terra; conclusit eos desertum."
      en: "And Pharao will say of the children of Israel: They are straitened in the land, the desert hath shut them in."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et indurabo cor ejus, ac persequetur vos: et glorificabor in Pharaone, et in omni exercitu ejus; scientque Aegyptii quia ego sum Dominus. Feceruntque ita."
      en: "And I shall harden his heart, and he will pursue you: and I shall be glorified in Pharao, and in all his army: and the Egyptians shall know that I am the Lord. And they did so."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et nuntiatum est regi Aegyptiorum quod fugisset populus: immutatumque est cor Pharaonis et servorum ejus super populo, et dixerunt: Quid voluimus facere ut dimitteremus Israel, ne serviret nobis?"
      en: "And it was told the king of the Egyptians that the people was fled: and the heart of Pharao and of his servants was changed with regard to the people, and they said: What meant we to do, that we let Israel go from serving us?"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Junxit ergo currum, et omnem populum suum assumpsit secum."
      en: "So he made ready his chariot, and took all his people with him."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Tulitque sexcentos currus electos, et quidquid in Aegypto curruum fuit: et duces totius exercitus."
      en: "And he took six hundred chosen chariots, and all the chariots that were in Egypt: and the captains of the whole army."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Induravitque Dominus cor Pharaonis regis Aegypti, et persecutus est filios Israel: at illi egressi sunt in manu excelsa."
      en: "And the Lord hardened the heart of Pharao king of Egypt, and he pursued the children of Israel: but they were gone forth in a mighty hand."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Cumque persequerentur Aegyptii vestigia praecedentium, repererunt eos in castris super mare: omnis equitatus et currus Pharaonis, et universus exercitus, erant in Phihahiroth contra Beelsephon."
      en: "And when the Egyptians followed the steps of them who were gone before, they found them encamped at the sea side: all Pharao's horse and chariots, and the whole army were in Phihahiroth before Beelsephon."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Cumque appropinquasset Pharao, levantes filii Israel oculos, viderunt Aegyptios post se, et timuerunt valde: clamaveruntque ad Dominum,"
      en: "And when Pharao drew near, the children of Israel, lifting up their eyes, saw the Egyptians behind them: and they feared exceedingly, and cried to the Lord."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "et dixerunt ad Moysen: Forsitan non erant sepulchra in Aegypto, ideo tulisti nos ut moreremur in solitudine: quid hoc facere voluisti, ut educeres nos ex Aegypto?"
      en: "And they said to Moses: Perhaps there were no graves in Egypt, therefore thou hast brought us to die in the wilderness: why wouldst thou do this, to lead us out of Egypt?"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "nonne iste est sermo, quem loquebamur ad te in Aegypto, dicentes: Recede a nobis, ut serviamus Aegyptiis? multo enim melius erat servire eis, quam mori in solitudine."
      en: "Is not this the word that we spoke to thee in Egypt, saying: Depart from us that we may serve the Egyptians? for it was much better to serve them, than to die in the wilderness."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et ait Moyses ad populum: Nolite timere: state, et videte magnalia Domini quae facturus est hodie: Aegyptios enim, quos nunc videtis, nequaquam ultra videbitis usque in sempiternum."
      en: "And Moses said to the people: Fear not: stand and see the great wonders of the Lord, which he will do this day: for the Egyptians, whom you see now, you shall see no more for ever."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dominus pugnabit pro vobis, et vos tacebitis."
      en: "The Lord will fight for you, and you shall hold your peace."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Dixitque Dominus ad Moysen: Quid clamas ad me? loquere filiis Israel ut proficiscantur."
      en: "And the Lord said to Moses: Why criest thou to me? Speak to the children of Israel to go forward."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Tu autem eleva virgam tuam, et extende manum tuam super mare, et divide illud: ut gradiantur filii Israel in medio mari per siccum."
      en: "But lift thou up thy rod, and stretch forth thy hand over the sea, and divide it: that the children of Israel may go through the midst of the sea on dry ground."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Ego autem indurabo cor Aegyptiorum ut persequantur vos: et glorificabor in Pharaone, et in omni exercitu ejus, et in curribus et in equitibus illius."
      en: "And I will harden the heart of the Egyptians to pursue you: and I will be glorified in Pharao, and in all his host, and in his chariots, and in his horsemen."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et scient Aegyptii quia ego sum Dominus cum glorificatus fuero in Pharaone, et in curribus atque in equitibus ejus."
      en: "And the Egyptians shall know that I am the Lord, when I shall be glorified in Pharao, and in his chariots and in his horsemen."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Tollensque se angelus Dei, qui praecedebat castra Israel, abiit post eos: et cum eo pariter columna nubis, priora dimittens, post tergum"
      en: "And the angel of God, who went before the camp of Israel, removing, went behind them: and together with him the pillar of the cloud, leaving the forepart,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "stetit, inter castra Aegyptiorum et castra Israel: et erat nubes tenebrosa, et illuminans noctem, ita ut ad se invicem toto noctis tempore accedere non valerent."
      en: "Stood behind, between the Egyptians' camp and the camp of Israel: and it was a dark cloud, and enlightening the night, so that they could not come at one another all the night."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Cumque extendisset Moyses manum super mare, abstulit illud Dominus flante vento vehementi et urente tota nocte, et vertit in siccum: divisaque est aqua."
      en: "And when Moses had stretched forth his hand over the sea, the Lord took it away by a strong and burning wind blowing all the night, and turned it into dry ground: and the water was divided."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ingressi sunt filii Israel per medium sicci maris: erat enim aqua quasi murus a dextra eorum et laeva."
      en: "And the children of Israel went in through the midst of the sea dried up: for the water was as a wall on their right hand and on their left."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Persequentesque Aegyptii ingressi sunt post eos, et omnis equitatus Pharaonis, currus ejus et equites per medium maris."
      en: "And the Egyptians pursuing went in after them, and all Pharao's horses, his chariots and horsemen through the midst of the sea,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Jamque advenerat vigilia matutina, et ecce respiciens Dominus super castra Aegyptiorum per columnam ignis et nubis, interfecit exercitum eorum,"
      en: "And now the morning watch was come, and behold the Lord looking upon the Egyptian army through the pillar of fire and of the cloud, slew their host."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et subvertit rotas curruum, ferebanturque in profundum. Dixerunt ergo Aegyptii: Fugiamus Israelem: Dominus enim pugnat pro eis contra nos."
      en: "And overthrew the wheels of the chariots, and they were carried into the deep. And the Egyptians said: Let us flee from Israel: for the Lord fighteth for them against us."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et ait Dominus ad Moysen: Extende manum tuam super mare, ut revertantur aquae ad Aegyptios super currus et equites eorum."
      en: "And the Lord said to Moses: Stretch forth thy hand over the sea, that the waters may come again upon the Egyptians, upon their chariots and horsemen."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Cumque extendisset Moyses manum contra mare, reversum est primo diluculo ad priorem locum: fugientibusque Aegyptiis occurrerunt aquae, et involvit eos Dominus in mediis fluctibus."
      en: "And when Moses had stretched forth his hand towards the sea, it returned at the first break of day to the former place: and as the Egyptians were fleeing away, the waters came upon them, and the Lord shut them up in the middle of the waves."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Reversaeque sunt aquae, et operuerunt currus et equites cuncti exercitus Pharaonis, qui sequentes ingressi fuerant mare: nec unus quidem superfuit ex eis."
      en: "And the waters returned, and covered the chariots and the horsemen of all the army of Pharao, who had come into the sea after them, neither did there so much as one of them remain."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Filii autem Israel perrexerunt per medium sicci maris, et aquae eis erant quasi pro muro a dextris et a sinistris:"
      en: "But the children of Israel marched through the midst of the sea upon dry land, and the waters were to them as a wall on the right hand and on the left:"
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "liberavitque Dominus in die illa Israel de manu Aegyptiorum."
      en: "And the Lord delivered Israel on that day out of the hands of the Egyptians."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Et viderunt Aegyptios mortuos super littus maris, et manum magnam quam exercuerat Dominus contra eos: timuitque populus Dominum, et crediderunt Domino, et Moysi servo ejus."
      en: "And they saw the Egyptians dead upon the sea shore, and the mighty hand that the Lord had used against them: and the people feared the Lord, and they believed the Lord, and Moses his servant."
    status: { la: verified, en: verified }
