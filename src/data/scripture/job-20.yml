# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 20
verses:
  - n: 1
    text:
      la: "Respondens autem Sophar Naamathites, dixit:"
      en: "Then Sophar the Naamathite answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Idcirco cogitationes meae variae succedunt sibi, et mens in diversa rapitur."
      en: "Therefore various thoughts succeed one another in me, and my mind is hurried away to different things."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Doctrinam qua me arguis audiam, et spiritus intelligentiae meae respondebit mihi."
      en: "The doctrine with which thou reprovest me, I will hear, and the spirit of my understanding shall answer for me."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Hoc scio a principio, ex quo positus est homo super terram,"
      en: "This I know from the beginning, since man was placed upon the earth,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "quod laus impiorum brevis sit, et gaudium hypocritae ad instar puncti."
      en: "That the praise of the wicked is short, and the joy of the hypocrite but for a moment."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Si ascenderit usque ad caelum superbia ejus, et caput ejus nubes tetigerit,"
      en: "If his pride mount up even to heaven, and his head touch the clouds:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quasi sterquilinium in fine perdetur, et qui eum viderant, dicent: Ubi est?"
      en: "In the end he shall be destroyed like a dunghill, and they that has seen him shall say: Where is he?"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Velut somnium avolans non invenietur: transiet sicut visio nocturna."
      en: "As a dream that fleeth away he shall not be found, he shall pass as a vision of the night:"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Oculus qui eum viderat non videbit, neque ultra intuebitur eum locus suus."
      en: "The eyes that had seen him, shall see him no more, neither shall his place any more behold him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Filii ejus atterentur egestate, et manus illius reddent ei dolorem suum."
      en: "His children shall be oppressed with want, and his hands shall render him his sorrow."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ossa ejus implebuntur vitiis adolescentiae ejus, et cum eo in pulvere dormient."
      en: "His bones shall be filled with the vices of his youth, and they shall sleep with him in the dust."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Cum enim dulce fuerit in ore ejus malum, abscondet illud sub lingua sua."
      en: "For when evil shall be sweet in his mouth, he will hide it under his tongue."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Parcet illi, et non derelinquet illud, et celabit in gutture suo."
      en: "He will spare it, and not leave it, and will hide it in his throat."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Panis ejus in utero illius vertetur in fel aspidum intrinsecus."
      en: "His bread in his belly shall be turned into the gall of asps within him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Divitias quas devoravit evomet, et de ventre illius extrahet eas Deus."
      en: "The riches which he hath swallowed; he shall vomit up, and God shall draw them out of his belly."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Caput aspidum suget, et occidet eum lingua viperae."
      en: "He shall suck the head of asps, and the viper's tongue shall kill him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "( Non videat rivulos fluminis, torrentes mellis et butyri.)"
      en: "(Let him not see the streams of the river, the brooks of honey and of butter.)"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Luet quae fecit omnia, nec tamen consumetur: juxta multitudinem adinventionum suarum, sic et sustinebit."
      en: "He shall be punished for all that he did, and yet shall not be consumed: according to the multitude of his devices so also shall he suffer."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Quoniam confringens nudavit pauperes: domum rapuit, et non aedificavit eam."
      en: "Because he broke in and stripped the poor: he hath violently taken away a house which he did not build."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Nec est satiatus venter ejus: et cum habuerit quae concupierat, possidere non poterit."
      en: "And yet his belly was not filled: and when he hath the things he coveted, he shall not be able to possess them."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Non remansit de cibo ejus: et propterea nihil permanebit de bonis ejus."
      en: "There was nothing left of his meat, and therefore nothing shall continue of his goods:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cum satiatus fuerit, arctabitur: aestuabit, et omnis dolor irruet super eum."
      en: "When he shall be filled, he shall be straitened, he shall burn, and every sorrow shall fall upon him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Utinam impleatur venter ejus, ut emittat in eum iram furoris sui, et pluat super illum bellum suum!"
      en: "May his belly be filled, that God may send forth the wrath of his indignation upon him, and rain down his war upon him."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Fugiet arma ferrea, et irruet in arcum aereum."
      en: "He shall flee from weapons of iron, and shall fall upon a bow of brass."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Eductus, et egrediens de vagina sua, et fulgurans in amaritudine sua: vadent et venient super eum horribiles."
      en: "The sword is drawn out, and cometh forth from its scabbard, and glittereth in his bitterness: the terrible ones shall go and come upon him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Omnes tenebrae absconditae sunt in occultis ejus: devorabit eum ignis qui non succenditur: affligetur relictus in tabernaculo suo."
      en: "All darkness is hid in his secret places: a fire that is not kindled shall devour him, he shall be afflicted when left in his tabernacle."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Revelabunt caeli iniquitatem ejus, et terra consurget adversus eum."
      en: "The heavens shall reveal his iniquity, and the earth shall rise up against him."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Apertum erit germen domus illius: detrahetur in die furoris Dei."
      en: "The offspring of his house shall be exposed, he shall be pulled down in the day of God's wrath."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Haec est pars hominis impii a Deo, et haereditas verborum ejus a Domino."
      en: "This is the portion of a wicked man from God, and the inheritance of his doings from the Lord."
    status: { la: verified, en: verified }
