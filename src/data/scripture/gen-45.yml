# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: gen
chapter: 45
verses:
  - n: 1
    text:
      la: "Non se poterat ultra cohibere Joseph multis coram astantibus: unde praecepit ut egrederentur cuncti foras, et nullus interesset alienus agnitioni mutuae."
      en: "Joseph could no longer refrain himself before many that stood by: whereupon he commanded that all should go out, and no stranger be present at their knowing one another."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Elevavitque vocem cum fletu, quam audierunt Aegyptii, omnisque domus Pharaonis."
      en: "And he lifted up his voice with weeping, which the Egyptians and all the house of Pharao heard."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et dixit fratribus suis: Ego sum Joseph: adhuc pater meus vivit? Non poterant respondere fratres nimio terrore perterriti."
      en: "And he said to his brethren: I am Joseph: is my father yet living? His brethren could not answer him, being struck with exceeding great fear."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ad quos ille clementer: Accedite, inquit, ad me. Et cum accessissent prope: Ego sum, ait, Joseph, frater vester, quem vendidistis in Aegyptum."
      en: "And he said mildly to them: Come nearer to me. And when they were come near him, he said: I am Joseph, your brother, whom you sold into Egypt."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Nolite pavere, neque vobis durum esse videatur quod vendidistis me in his regionibus: pro salute enim vestra misit me Deus ante vos in Aegyptum."
      en: "Be not afraid, and let it not seem to you a hard case that you sold me into these countries: for God sent me before you into Egypt for your preservation."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Biennium est enim quod coepit fames esse in terra: et adhuc quinque anni restant, quibus nec arari poterit, nec meti."
      en: "For it is two years since the famine began to be upon the land, and five years more remain, wherein there can be neither ploughing nor reaping."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Praemisitque me Deus ut reservemini super terram, et escas ad vivendum habere possitis."
      en: "And God sent me before, that you may be preserved upon the earth, and may have food to live."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Non vestro consilio, sed Dei voluntate huc missum sum: qui fecit me quasi patrem Pharaonis, et dominum universae domus ejus, ac principem in omni terra Aegypti."
      en: "Not by your counsel was I sent hither, but by the will of God: who hath made me as it were a father to Pharao, and lord of his whole house, and governor in all the land of Egypt."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Festinate, et ascendite ad patrem meum, et dicetis ei: Haec mandat filius tuus Joseph: Deus fecit me dominum universae terrae Aegypti: descende ad me, ne moreris,"
      en: "Make haste, and go ye up to my father, and say to him: Thus saith thy son Joseph: God hath made me lord of the whole land of Egypt: come down to me, linger not."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "et habitabis in terra Gessen: erisque juxta me tu, et filii tui, et filii filiorum tuorum, oves tuae, et armenta tua, et universa quae possides:"
      en: "And thou shalt dwell in the land of Gessen: and thou shalt be near me, thou and thy sons, and thy sons' sons, thy sheep, and thy herds, and all things that thou hast."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ibique te pascam ( adhuc enim quinque anni residui sunt famis) ne et tu pereas, et domus tua, et omnia quae possides."
      en: "And there I will feed thee, (for there are yet five years of famine remaining), lest both thou perish, and thy house, and all things that thou hast."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "En oculi vestri, et oculi fratris mei Benjamin, vident quod os meum loquatur ad vos."
      en: "Behold, your eyes, and the eyes of my brother Benjamin see that it is my mouth that speaketh to you."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Nuntiate patri meo universam gloriam meam, et cuncta quae vidistis in Aegypto: festinate, et adducite eum ad me."
      en: "You shall tell my father of all my glory, and all things that you have seen in Egypt: make haste and bring him to me."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cumque amplexatus recidisset in collum Benjamin fratris sui, flevit: illo quoque similiter flente super collum ejus."
      en: "And falling upon the neck of his brother Benjamin, he embraced him and wept: and Benjamin in like manner wept also on his neck."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Osculatusque est Joseph omnes fratres suos, et ploravit super singulos: post quae ausi sunt loqui ad eum."
      en: "And Joseph kissed all his brethren, and wept upon every one of them: after which they were emboldened to speak to him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Auditumque est, et celebri sermone vulgatum in aula regis: Venerunt fratres Joseph: et gavisus est Pharao, atque omnis familia ejus."
      en: "And it was heard, and the fame was abroad in the king's court: The brethren of Joseph are come: and Pharao with all his family was glad."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixitque ad Joseph ut imperaret fratribus suis, dicens: Onerantes jumenta, ite in terram Chanaan,"
      en: "And he spoke to Joseph that he should give orders to his brethren, saying: Load your beasts, and go into the land of Chanaan."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et tollite inde patrem vestrum et cognationem, et venite ad me: et ego dabo vobis omnia bona Aegypti, ut comedatis medullam terrae."
      en: "And bring away from thence your father and kindred, and come to me: and I will give you all the good things of Egypt, that you may eat the marrow of the land."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Praecipe etiam ut tollant plaustra de terra Aegypti, ad subvectionem parvulorum suorum ac conjugum: et dicito: Tollite patrem vestrum, et properate quantocius venientes."
      en: "Give orders also that they take wagons out of the land of Egypt, for the carriage of their children and their wives: and say: Take up your father, and make haste to come with all speed:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Nec dimittatis quidquam de supellectili vestra: quia omnes opes Aegypti vestrae erunt."
      en: "And leave nothing of your household stuff: for all the riches of Egypt shall be yours."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Feceruntque filii Israel ut eis mandatum fuerat. Quibus dedit Joseph plaustra, secundum Pharaonis imperium, et cibaria in itinere."
      en: "And the sons of Israel did as they were bid. And Joseph gave them wagons according to Pharao's commandment: and provisions for the way."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Singulis quoque proferri jussit binas stolas: Benjamin vero dedit trecentos argenteos cum quinque stolis optimis:"
      en: "He ordered also to be brought out for every one of them two robes: but to Benjamin he gave three hundred pieces of silver with five robes of the best:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "tantumdem pecuniae et vestium mittens patri suo, addens et asinos decem, qui subveherent ex omnibus divitiis Aegypti, et totidem asinas, triticum in itinere, panesque portantes."
      en: "Sending to his father as much money and raiment, adding besides ten he asses to carry off all the riches of Egypt, and as many she asses, carrying wheat and bread for the journey."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Dimisit ergo fratres suos, et proficiscentibus ait: Ne irascamini in via."
      en: "So he sent away his brethren, and at their departing said to them: Be not angry in the way."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Qui ascendentes ex Aegypto, venerunt in terram Chanaan ad patrem suum Jacob."
      en: "And they went up out of Egypt, and came into the land of Chanaan to their father Jacob."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et nuntiaverunt ei, dicentes: Joseph filius tuus vivit: et ipse dominatur in omni terra Aegypti. Quo audito Jacob, quasi de gravi somno evigilans, tamen non credebat eis."
      en: "And they told him, saying: Joseph thy son is living: and he is ruler in all the land of Egypt. Which when Jacob heard, he awaked as it were out of a deep sleep, yet did not believe them."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Illi e contra referebant omnem ordinem rei. Cumque vidisset plaustra et universa quae miserat, revixit spiritus ejus,"
      en: "They, on the other side, told the whole order of the thing. And when he saw the wagons and all that he had sent his spirit revived,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et ait: Sufficit mihi si adhuc Joseph filius meus vivit: vadam, et videbo illum antequam moriar."
      en: "And he said: It is enough for me, if Joseph my son be yet living: I will go and see him before I die."
    status: { la: verified, en: verified }
