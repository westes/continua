# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: deut
chapter: 22
verses:
  - n: 1
    text:
      la: "non videbis bovem fratris tui aut ovem errantem et praeteribis sed reduces fratri tuo"
      en: "Thou shalt not pass by if thou seest thy brother's ox, or his sheep go astray: but thou shalt bring them back to thy brother."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "etiam si non est propinquus tuus frater nec nosti eum duces in domum tuam et erunt apud te quamdiu quaerat ea frater tuus et recipiat"
      en: "And if thy brother be not nigh, or thou know him not: thou shalt bring them to thy house, and they shall be with thee until thy brother seek them, and receive them."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "similiter facies de asino et de vestimento et de omni re fratris tui quae perierit si inveneris eam ne neglegas quasi alienam"
      en: "Thou shalt do in like manner with his ass, and with his raiment, and with every thing that is thy brother's, which is lost: if thou find it, neglect it not as pertaining to another."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "si videris asinum fratris tui aut bovem cecidisse in via non despicies sed sublevabis cum eo"
      en: "If thou see thy brother's ass or his ox to be fallen down in the way, thou shalt not slight it, but shalt lift it up with him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "non induetur mulier veste virili nec vir utetur veste feminea abominabilis enim apud Deum est qui facit haec"
      en: "A woman shall not be clothed with man's apparel, neither shall a man use woman's apparel : for he that doeth these things is abominable before God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "si ambulans per viam in arbore vel in terra nidum avis inveneris et matrem pullis vel ovis desuper incubantem non tenebis eam cum filiis"
      en: "If thou find as thou walkest by the way, a bird's nest in a tree, or on the ground, and the dam sitting upon the young or upon the eggs: thou shalt not take her with her young:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "sed abire patieris captos tenens filios ut bene sit tibi et longo vivas tempore"
      en: "But shalt let her go, keeping the young which thou hast caught: that it may be well with thee, and thou mayst live a long time."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "cum aedificaveris domum novam facies murum tecti per circuitum ne effundatur sanguis in domo tua et sis reus labente alio et in praeceps ruente"
      en: "When thou buildest a new house, thou shalt make a battlement to the roof round about: lest blood be shed in thy house, and thou be guilty, if any one slip, and fall down headlong."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "non seres vineam tuam altero semine ne et sementis quam sevisti et quae nascuntur ex vinea pariter sanctificentur"
      en: "Thou shalt not sow thy vineyard with divers seeds: lest both the seed which thou hast sown, and the fruit of the vineyard, be sanctified together."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "non arabis in bove simul et asino"
      en: "Thou shalt not plough with an ox and an ass together."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non indueris vestimento quod ex lana linoque contextum est"
      en: "Thou shalt not wear a garment that is woven of woollen and linen together."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "funiculos in fimbriis facies per quattuor angulos pallii tui quo operieris"
      en: "Thou shalt make strings in the hem at the four corners of thy cloak, wherewith thou shalt be covered."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "si duxerit vir uxorem et postea eam odio habuerit"
      en: "If a man marry a wife, and afterwards hate her,"
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "quaesieritque occasiones quibus dimittat eam obiciens ei nomen pessimum et dixerit uxorem hanc accepi et ingressus ad eam non inveni virginem"
      en: "And seek occasions to put her away, laying to her charge a very ill name, and say: I took this woman to wife, and going in to her, I found her not a virgin:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "tollent eam pater et mater eius et ferent secum signa virginitatis eius ad seniores urbis qui in porta sunt"
      en: "Her father and mother shall take her, and shall bring with them the tokens of her virginity to the ancients of the city that are in the gate:"
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "et dicet pater filiam meam dedi huic uxorem quam quia odit"
      en: "And the father shall say: I gave my daughter unto this man to wife: and because he hateth her,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "inponet ei nomen pessimum ut dicat non inveni filiam tuam virginem et ecce haec sunt signa virginitatis filiae meae expandent vestimentum coram senibus civitatis"
      en: "He layeth to her charge a very ill name, so as to say: I found not thy daughter a virgin: and behold these are the tokens of my daughter's virginity. And they shall spread the cloth before the ancients of the city:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "adprehendentque senes urbis illius virum et verberabunt illum"
      en: "And the ancients of that city shall take that man, and beat him,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "condemnantes insuper centum siclis argenti quos dabit patri puellae quoniam diffamavit nomen pessimum super virginem Israhel habebitque eam uxorem et non poterit dimittere omni tempore vitae suae"
      en: "Condemning him besides in a hundred sides of silver, which he shall give to the damsel's father, because he hath defamed by a very ill name a virgin of Israel: and he shall have her to wife, and may not put her away all the days of his life."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "quod si verum est quod obicit et non est in puella inventa virginitas"
      en: "But if what he charged her with be true, and virginity be not found in the damsel:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "eicient eam extra fores domus patris sui et lapidibus obruent viri civitatis eius et morietur quoniam fecit nefas in Israhel ut fornicaretur in domo patris sui et auferes malum de medio tui"
      en: "They shall cast her out of the doors of her father's house, and the men of the city shall stone her to death, and she shall die: because she hath done a wicked thing in Israel, to play the whore in her father's house: and thou shalt take away the evil out of the midst of thee."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "si dormierit vir cum uxore alterius uterque morientur id est adulter et adultera et auferes malum de Israhel"
      en: "If a man lie with another man's wife, they shall both die, that is to say, the adulterer and the adulteress: and thou shalt take away the evil out of Israel."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "si puellam virginem desponderit vir et invenerit eam aliquis in civitate et concubuerit cum illa"
      en: "If a man have espoused a damsel that is a virgin, and some one find her in the city, and lie with her,"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "educes utrumque ad portam civitatis illius et lapidibus obruentur puella quia non clamavit cum esset in civitate vir quia humiliavit uxorem proximi sui et auferes malum de medio tui"
      en: "Thou shalt bring them both out to the gate of that city, and they shall be stoned: the damsel, because she cried not out, being in the city: the man, because he hath humbled his neighbour's wife. And thou shalt take away the evil from the midst of thee."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "sin autem in agro reppererit vir puellam quae desponsata est et adprehendens concubuerit cum illa ipse morietur solus"
      en: "But if a man find a damsel that is betrothed, in the field, and taking hold of her, lie with her, he alone shall die:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "puella nihil patietur nec est rea mortis quoniam sicut latro consurgit contra fratrem suum et occidit animam eius ita et puella perpessa est"
      en: "The damsel shall suffer nothing, neither is she guilty of death : for as a robber riseth against his brother, and taketh away his life, so also did the damsel suffer:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "sola erat in agro clamavit et nullus adfuit qui liberaret eam"
      en: "She was alone in the field: she cried, and there was no man to help her."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "si invenerit vir puellam virginem quae non habet sponsum et adprehendens concubuerit cum ea et res ad iudicium venerit"
      en: "If a man find a damsel that is a virgin, who is not espoused, and taking her, lie with her, and the matter come to judgment :"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "dabit qui dormivit cum ea patri puellae quinquaginta siclos argenti et habebit eam uxorem quia humiliavit illam non poterit dimittere cunctis diebus vitae suae"
      en: "He that lay with her shall give to the father of the maid fifty sides of silver, and shall have her to wife, because he hath humbled her: he may not put her away all the days of his life."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "non accipiet homo uxorem patris sui nec revelabit operimentum eius"
      en: "No man shall take his father's wife, nor remove his covering."
    status: { la: verified, en: verified }
