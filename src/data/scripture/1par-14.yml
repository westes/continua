# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1par
chapter: 14
verses:
  - n: 1
    text:
      la: "Misit quoque Hiram rex Tyri nuntios ad David, et ligna cedrina, et artifices parietum, lignorumque, ut aedificarent ei domum."
      en: "And Hiram king of Tyre sent messengers to David, and cedar trees, and masons, and carpenters, to build him a house."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Cognovitque David quod confirmasset eum Dominus in regem super Israel, et sublevatum esset regnum suum super populum ejus Israel."
      en: "And David perceived that the Lord had confirmed him king over Israel, and that his kingdom was exalted over his people Israel."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Accepit quoque David alias uxores in Jerusalem: genuitque filios et filias."
      en: "And David took other wives in Jerusalem: and he beget sons, and daughters."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et haec nomina eorum, qui nati sunt ei in Jerusalem: Samua, et Sobab, Nathan, et Salomon,"
      en: "Now these are the names of them that were born to him in Jerusalem: Samua, and Sobad, Nathan, and Solomon,"
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Jebahar, et Elisua, et Eliphalet,"
      en: "Jebahar, and Elisua, and Eliphalet,"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Noga quoque, et Napheg, et Japhia,"
      en: "And Noga, and Napheg, and Japhia,"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Elisama, et Baaliada, et Eliphalet."
      en: "Elisama. and Baaliada, and Eliphalet."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Audientes autem Philisthiim eo quod unctus esset David regem super universum Israel, ascenderunt omnes ut quaererent eum: quod cum audisset David, egressus est obviam eis."
      en: "And the Philistines hearing that David was anointed king over all Israel, went all up to seek him: and David heard of it, and went out against them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Porro Philisthiim venientes, diffusi sunt in valle Raphaim."
      en: "And the Philistines came and spread themselves in the vale of Raphaim."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Consuluitque David Dominum, dicens: Si ascendam ad Philisthaeos, et si trades eos in manu mea? Et dixit ei Dominus: Ascende, et tradam eos in manu tua."
      en: "And David consulted the Lord, saying: Shall I go up against the Philistines, and wilt thou deliver them into my hand? And the Lord said to him: Go up, and I will deliver them into thy hand."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Cumque illi ascendissent in Baalpharasim, percussit eos ibi David, et dixit: Divisit Deus inimicos meos per manum meam, sicut dividuntur aquae: et idcirco vocatum est nomen illius loci Baalpharasim."
      en: "And when they were come to Baalpharasim, David defeated them there, and he said: God hath divided my enemies by my hand, as waters are divided: and therefore the name of that place was called Baalpharasim."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dereliqueruntque ibi deos suos, quos David jussit exuri."
      en: "And they left there their gods, and David commanded that they should be burnt."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Alia etiam vice Philisthiim irruerunt, et diffusi sunt in valle."
      en: "Another time also the Philistines made an irruption, and spread themselves abroad in the valley."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Consuluitque rursum David Deum, et dixit ei Deus: Non ascendas post eos: recede ab eis, et venies contra illos ex adverso pyrorum."
      en: "And David consulted God again, and God said to him: Go not up after them, turn away from them, and come upon them over against the pear trees."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cumque audieris sonitum gradientis in cacumine pyrorum, tunc egredieris ad bellum: egressus est enim Deus ante te, ut percutiat castra Philisthiim."
      en: "And when thou shalt hear the sound of one going in the tops of the pear trees, then shalt thou go out to battle. For God is gone out before thee to strike the army of the Philistines."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Fecit ergo David sicut praeceperat ei Deus, et percussit castra Philisthinorum, de Gabaon usque Gazera."
      en: "And David did as God had commanded him, and defeated the army of the Philistines, slaying them from Gabaon to Gazera."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Divulgatumque est nomen David in universis regionibus, et Dominus dedit pavorem ejus super omnes gentes."
      en: "And the name of David became famous in all countries, and the Lord made all nations fear him."
    status: { la: verified, en: verified }
