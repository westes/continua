# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: 1mach
chapter: 11
verses:
  - n: 1
    text:
      la: "Et rex Aegypti congregavit exercitum, sicut arena quae est circa oram maris, et naves multas: et quaerebat obtinere regnum Alexandri dolo, et addere illud regno suo."
      en: "And the king of Egypt gathered together an army, like the sand that lieth upon the sea shore, and many ships: and he sought to get the kingdom of Alexander by deceit, and join it to his own kingdom."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Et exiit in Syriam verbis pacificis, et aperiebant ei civitates, et occurrebant ei: quia mandaverat Alexander rex exire ei obviam, eo quod socer suus esset."
      en: "And he went out into Syria with peaceable words, and they opened to him the cities, and met him: for king Alexander had ordered them to go forth to meet him, because he was his father in law."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Cum autem introiret civitatem Ptolemaeus, ponebat custodias militum in singulis civitatibus."
      en: "Now when Ptolemee entered into the cities, he put garrisons of soldiers in every city."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et ut appropiavit Azoto, ostenderunt ei templum Dagon succensum igni, et Azotum, et cetera ejus demolita, et corpora projecta, et eorum, qui caesi erant in bello, tumulos quos fecerant secus viam."
      en: "And when he came near to Azotus, they shewed him the temple of Dagon that was burnt with fire, and Azotus, and the suburbs thereof that were destroyed, and the bodies that were cast abroad, and the graves of them that were slain in the battle, which they had made near the way."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et narraverunt regi quia haec fecit Jonathas, ut invidiam facerent ei: et tacuit rex."
      en: "And they told the king that Jonathan had done these things, to make him odious: but the king held his peace."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et occurrit Jonathas regi in Joppen cum gloria, et invicem se salutaverunt, et dormierunt illic."
      en: "And Jonathan came to meet the king at Joppe with glory, and they saluted one another, and they lodged there."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et abiit Jonathas cum rege usque ad fluvium qui vocatur Eleutherus: et reversus est in Jerusalem."
      en: "And Jonathan went with the king as far as the river, called Eleutherus: and he returned into Jerusalem."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Rex autem Ptolemaeus obtinuit dominium civitatum usque Seleuciam maritimam, et cogitabat in Alexandrum consilia mala."
      en: "And king Ptolemee got the dominion of the cities by the sea side, even to Seleucia, and he devised evil designs against Alexander."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et misit legatos ad Demetrium, dicens: Veni, componamus inter nos pactum, et dabo tibi filiam meam, quam habet Alexander, et regnabis in regno patris tui:"
      en: "And he sent ambassadors to Demetrius, saying: Come, let us make a league between us, and I will give thee my daughter whom Alexander hath, and thou shalt reign in the kingdom of thy father."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "poenitet enim me quod dederim illi filiam meam: quaesivit enim me occidere."
      en: "For I repent that I have given him my daughter: for he hath sought to kill me."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et vituperavit eum, propterea quod concupierat regnum ejus."
      en: "And he slandered him, because he coveted his kingdom."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et abstulit filiam suam, et dedit eam Demetrio, et alienavit se ab Alexandro, et manifestae sunt inimicitiae ejus."
      en: "And he took away his daughter, and gave her to Demetrius, and alienated himself from Alexander, and his enmities were made manifest."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Et intravit Ptolemaeus Antiochiam, et imposuit duo diademata capiti suo, Aegypti et Asiae."
      en: "And Ptolemee entered into Antioch, and set two crowns upon his head, that of Egypt, and that of Asia."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Alexander autem rex erat in Cilicia illis temporibus: quia rebellabant qui erant in locis illis."
      en: "Now king Alexander was in Cilicia at that time: because they that were in those places had rebelled."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et audivit Alexander, et venit ad eum in bellum: et produxit Ptolemaeus rex exercitum, et occurrit ei in manu valida, et fugavit eum."
      en: "And when Alexander heard of it, he came to give him battle, and king Ptolemee brought forth his army, and met him with a strong power, and put him to flight."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et fugit Alexander in Arabiam, ut ibi protegeretur: rex autem Ptolemaeus exaltatus est."
      en: "And Alexander fled into Arabia, there to be protected: and king Ptolemee was exalted."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Et abstulit Zabdiel Arabs caput Alexandri, et misit Ptolemaeo."
      en: "And Zabdiel the Arabian took off Alexander's head, and sent it to Ptolemee."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et rex Ptolemaeus mortuus est in die tertia: et qui erant in munitionibus, perierunt ab his qui erant intra castra."
      en: "And king Ptolemee died the third day after: and they that were in the strong holds were destroyed by them that were within the camp."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Et regnavit Demetrius anno centesimo sexagesimo septimo."
      en: "And Demetrius reigned in the hundred and sixty-seventh year."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "In diebus illis congregavit Jonathas eos qui erant in Judaea, ut expugnarent arcem quae est in Jerusalem: et fecerunt contra eam machinas multas."
      en: "In those days Jonathan gathered together them that were in Judea, to take the castle that was in Jerusalem: and they made many engines of war against it."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et abierunt quidam qui oderant gentem suam viri iniqui ad regem Demetrium, et renuntiaverunt ei quod Jonathas obsideret arcem."
      en: "Then some wicked men that hated their own nation, went away to king Demetrius, and told him that Jonathan was besieging the castle."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Et ut audivit, iratus est: et statim venit ad Ptolemaidam, et scripsit Jonathae ne obsideret arcem, sed occurreret sibi ad colloquium festinato."
      en: "And when he heard it, he was angry: and forthwith he came to Ptolemais, and wrote to Jonathan, that he should not besiege the castle, but should come to him in haste, and speak to him."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Ut audivit autem Jonathas, jussit obsidere: et elegit de senioribus Israel, et de sacerdotibus, et dedit se periculo."
      en: "But when Jonathan heard this, he bade them besiege it still: and he chose some of the ancients of Israel, and of the priests, and put himself in danger."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et accepit aurum, et argentum, et vestem, et alia xenia multa, et abiit ad regem Ptolemaidam: et invenit gratiam in conspectu ejus,"
      en: "And he took gold, and silver, and raiment, and many other presents, and went to the king to Ptolemais, and he found favour in his sight."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "et interpellabant adversus eum quidam iniqui ex gente sua."
      en: "And certain wicked men of his nation made complaints against him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et fecit ei rex sicut fecerant ei qui ante eum fuerant: et exaltavit eum in conspectu omnium amicorum suorum,"
      en: "And the king treated him as his predecessor had done before: and he exalted him in the sight of all his friends."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et statuit ei principatum sacerdotii, et quaecumque alia habuit prius pretiosa, et fecit eum principem amicorum."
      en: "And he confirmed him in the high priesthood, and all the honours he had before, and he made him the chief of his friends."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "Et postulavit Jonathas a rege ut immunem faceret Judaeam, et tres toparchias, et Samariam et confines ejus: et promisit ei talenta trecenta."
      en: "And Jonathan requested of the king that he would make Judea free from tribute, and the three governments, and Samaria, and the confines thereof: and he promised him three hundred talents."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et consensit rex: et scripsit Jonathae epistolas de his omnibus, hunc modum continentes:"
      en: "And the king consented: and he wrote letters to Jonathan of all these things to this effect."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Rex Demetrius fratri Jonathae salutem, et genti Judaeorum."
      en: "King Demetrius to his brother Jonathan, and to the nation of the Jews, greeting."
    status: { la: verified, en: verified }
  - n: 31
    text:
      la: "Exemplum epistolae, quam scripsimus Lastheni parenti nostro de vobis, misimus ad vos ut sciretis:"
      en: "We send you here a copy of the letter, which we have written to Lasthenes our parent concerning you, that you might know it."
    status: { la: verified, en: verified }
  - n: 32
    text:
      la: "Rex Demetrius Lastheni parenti salutem."
      en: "King Demetrius to Lasthenes his parent, greeting."
    status: { la: verified, en: verified }
  - n: 33
    text:
      la: "Genti Judaeorum amicis nostris, et conservantibus quae justa sunt apud nos, decrevimus benefacere propter benignitatem ipsorum, quam erga nos habent."
      en: "We have determined to do good to the nation of the Jews who are our friends, and keep the things that are just with us, for their good will which they bear towards us."
    status: { la: verified, en: verified }
  - n: 34
    text:
      la: "Statuimus ergo illis omnes fines Judaeae, et tres civitates, Lydan, et Ramathan, quae additae sunt Judaeae ex Samaria, et omnes confines earum, sequestrari omnibus sacrificantibus in Jerosolymis pro his quae ab eis prius accipiebat rex per singulos annos, et pro fructibus terrae et pomorum."
      en: "We have ratified therefore unto them all the borders of Judea, and the three cities, Apherema, Lydda, and Ramatha, which are added to Judea, out of Samaria, and all their confines, to be set apart to all them that sacrifice in Jerusalem, instead of the payments which the king received of them every year, and for the fruits of the land, and of the trees."
    status: { la: verified, en: verified }
  - n: 35
    text:
      la: "Et alia quae ad nos pertinebant decimarum et tributorum ex hoc tempore, remittimus eis: et areas salinarum, et coronas, quae nobis deferebantur,"
      en: "And as for other things that belonged to us of the tithes, and of the tributes, from this time we discharge them of them: the saltpans also, and the crowns that were presented to us."
    status: { la: verified, en: verified }
  - n: 36
    text:
      la: "omnia ipsis concedimus: et nihil horum irritum erit, ex hoc, et in omne tempus."
      en: "We give all to them, and nothing hereof shall be revoked from this time forth and for ever."
    status: { la: verified, en: verified }
  - n: 37
    text:
      la: "Nunc ergo curate facere horum exemplum, et detur Jonathae, et ponatur in monte sancto, in loco celebri."
      en: "Now therefore see that thou make a copy of these things, and let it be given to Jonathan, and set upon the holy mountain, in a conspicuous place."
    status: { la: verified, en: verified }
  - n: 38
    text:
      la: "Et videns Demetrius rex quod siluit terra in conspectu suo, et nihil ei resistit, dimisit totum exercitum suum, unumquemque in locum suum, excepto peregrino exercitu, quem contraxit ab insulis gentium: et inimici erant ei omnes exercitus patrum ejus."
      en: "And king Demetrius seeing that the land was quiet before him, and nothing resisted him, sent away all his forces, every man to his own place, except the foreign army, which he had drawn together from the islands of the nations: so all the troops of his fathers hated him."
    status: { la: verified, en: verified }
  - n: 39
    text:
      la: "Tryphon autem erat quidam partium Alexandri prius: et vidit quoniam omnis exercitus murmurabat contra Demetrium, et ivit ad Emalchuel Arabem, qui nutriebat Antiochum filium Alexandri:"
      en: "Now there was one Tryphon who had been of Alexander's party before: who seeing that all the army murmured against Demetrius, went to Emalchuel the Arabian, who brought up Antiochus the son of Alexander."
    status: { la: verified, en: verified }
  - n: 40
    text:
      la: "et assidebat ei, ut traderet eum ipsi, ut regnaret loco patris sui: et enuntiavit ei quanta fecit Demetrius, et inimicitias exercituum ejus adversus illum. Et mansit ibi diebus multis."
      en: "And he pressed him much to deliver him to him, that he might be king in his father's place: and he told him all that Demetrius had done, and how his soldiers hated him. And he remained there many days."
    status: { la: verified, en: verified }
  - n: 41
    text:
      la: "Et misit Jonathas ad Demetrium regem, ut ejiceret eos qui in arce erant in Jerusalem, et qui in praesidiis erant: quia impugnabant Israel."
      en: "And Jonathan sent to king Demetrius, desiring that he would cast out them that were in the castle in Jerusalem, and those that were in the strong holds: because they fought against Israel."
    status: { la: verified, en: verified }
  - n: 42
    text:
      la: "Et misit Demetrius ad Jonathan, dicens: Non haec tantum faciam tibi, et genti tuae, sed gloria illustrabo te, et gentem tuam, cum fuerit opportunum."
      en: "And Demetrius sent to Jonathan, saying: I will not only do this for thee, and for thy people, but I will greatly honour thee, and thy nation, when opportunity shall serve."
    status: { la: verified, en: verified }
  - n: 43
    text:
      la: "Nunc ergo recte feceris, si miseris in auxilium mihi viros: quia discessit omnis exercitus meus."
      en: "Now therefore thou shalt do well if thou send me men to help me: for all my army is gone from me."
    status: { la: verified, en: verified }
  - n: 44
    text:
      la: "Et misit ei Jonathas tria millia virorum fortium Antiochiam: et venerunt ad regem, et delectatus est rex in adventu eorum."
      en: "And Jonathan sent him three thousand valiant men to Antioch: and they came to the king, and the king was very glad of their coming."
    status: { la: verified, en: verified }
  - n: 45
    text:
      la: "Et convenerunt qui erant de civitate, centum viginti millia virorum, et volebant interficere regem."
      en: "And they that were of the city assembled themselves together, to the number of a hundred and twenty thousand men, and would have killed the king."
    status: { la: verified, en: verified }
  - n: 46
    text:
      la: "Et fugit rex in aulam: et occupaverunt qui erant de civitate, itinera civitatis, et coeperunt pugnare."
      en: "And the king fled into the palace, and they of the city kept the passages of the city, and began to fight."
    status: { la: verified, en: verified }
  - n: 47
    text:
      la: "Et vocavit rex Judaeos in auxilium, et convenerunt omnes simul ad eum, et dispersi sunt omnes per civitatem:"
      en: "And the king called the Jews to his assistance: and they came to him all at once, and they all dispersed themselves through the city."
    status: { la: verified, en: verified }
  - n: 48
    text:
      la: "et occiderunt in illa die centum millia hominum, et succenderunt civitatem, et ceperunt spolia multa in die illa, et liberaverunt regem."
      en: "And they slew in that day a hundred thousand men, and they set fire to the city, and got many spoils that day, and delivered the king."
    status: { la: verified, en: verified }
  - n: 49
    text:
      la: "Et viderunt qui erant de civitate, quod obtinuissent Judaei civitatem sicut volebant: et infirmati sunt mente sua, et clamaverunt ad regem cum precibus, dicentes:"
      en: "And they that were of the city saw that the Jews had got the city as they would: and they were discouraged in their minds, and cried to the king, making supplication, and saying:"
    status: { la: verified, en: verified }
  - n: 50
    text:
      la: "Da nobis dextras, et cessent Judaei oppugnare nos, et civitatem."
      en: "Grant us peace, and let the Jews cease from assaulting us, and the city."
    status: { la: verified, en: verified }
  - n: 51
    text:
      la: "Et projecerunt arma sua, et fecerunt pacem, et glorificati sunt Judaei in conspectu regis, et in conspectu omnium qui erant in regno ejus, et nominati sunt in regno: et regressi sunt in Jerusalem habentes spolia multa."
      en: "And they threw down their arms, and made peace, and the Jews were glorified in the sight of the king, and in the sight of all that were in his realm, and were renowned throughout the kingdom, and returned to Jerusalem with many spoils."
    status: { la: verified, en: verified }
  - n: 52
    text:
      la: "Et sedit Demetrius rex in sede regni sui: et siluit terra in conspectu ejus."
      en: "So king Demetrius sat in the throne of his kingdom: and the land was quiet before him."
    status: { la: verified, en: verified }
  - n: 53
    text:
      la: "Et mentitus est omnia quaecumque dixit, et abalienavit se a Jonatha, et non retribuit ei secundum beneficia quae sibi tribuerat, et vexabat eum valde."
      en: "And he falsified all whatsoever he had said, and alienated himself from Jonathan, and did not reward him according to the benefits he had received from him, but gave him great trouble."
    status: { la: verified, en: verified }
  - n: 54
    text:
      la: "Post haec autem reversus est Tryphon, et Antiochus cum eo puer adolescens, et regnavit, et imposuit sibi diadema."
      en: "And after this Tryphon returned, and with him Antiochus the young boy, who was made king, and put on the diadem."
    status: { la: verified, en: verified }
  - n: 55
    text:
      la: "Et congregati sunt ad eum omnes exercitus, quos disperserat Demetrius, et pugnaverunt contra eum: et fugit, et terga vertit."
      en: "And there assembled unto him all the hands which Demetrius had sent away, and they fought against Demetrius, who turned his back and fled."
    status: { la: verified, en: verified }
  - n: 56
    text:
      la: "Et accepit Tryphon bestias, et obtinuit Antiochiam."
      en: "And Tryphon took the elephants, and made himself master of Antioch."
    status: { la: verified, en: verified }
  - n: 57
    text:
      la: "Et scripsit Antiochus adolescens Jonathae, dicens: Constituo tibi sacerdotium, et constituo te super quatuor civitates, ut sis de amicis regis."
      en: "And young Antiochus wrote to Jonathan, saying: I confirm thee in the high priesthood, and I appoint thee ruler over the four cities, and to be one of the king's friends."
    status: { la: verified, en: verified }
  - n: 58
    text:
      la: "Et misit illi vasa aurea in ministerium, et dedit ei potestatem bibendi in auro, et esse in purpura, et habere fibulam auream:"
      en: "And he sent him vessels of gold for his service, and he gave him leave to drink in gold, and to be clothed in purple, and to wear a golden buckle:"
    status: { la: verified, en: verified }
  - n: 59
    text:
      la: "et Simonem fratrem ejus constituit ducem a terminis Tyri usque ad fines Aegypti."
      en: "And he made his brother Simon governor from the borders of Tyre even to the confines of Egypt."
    status: { la: verified, en: verified }
  - n: 60
    text:
      la: "Et exiit Jonathas, et perambulabat trans flumen civitates: et congregatus est ad eum omnis exercitus Syriae in auxilium, et venit Ascalonem, et occurrerunt ei honorifice de civitate."
      en: "Then Jonathan went forth and passed through the cities beyond the river: and all the forces of Syria gathered themselves to him to help him, and he came to Ascalon, and they met him honourably out of the city."
    status: { la: verified, en: verified }
  - n: 61
    text:
      la: "Et abiit inde Gazam: et concluserunt se qui erant Gazae: et obsedit eam, et succendit quae erant in circuitu civitatis, et praedatus est ea."
      en: "And he went from thence to Gaza: and they that were in Gaza shut him out: and he besieged it, and burnt all the suburbs round about, and took the spoils."
    status: { la: verified, en: verified }
  - n: 62
    text:
      la: "Et rogaverunt Gazenses Jonathan, et dedit illis dexteram: et accepit filios eorum obsides, et misit illos in Jerusalem: et perambulavit regionem usque Damascum."
      en: "And the men of Gaza made supplication to Jonathan, and he gave them the right hand: and he took their sons for hostages, and sent them to Jerusalem: and he went through the country as far as Damascus."
    status: { la: verified, en: verified }
  - n: 63
    text:
      la: "Et audivit Jonathas quod praevaricati sunt principes Demetrii in Cades, quae est in Galilaea, cum exercitu multo, volentes eum removere a negotio regni:"
      en: "And Jonathan heard that the generals of Demetrius were come treacherously to Cades, which is in Galilee, with a great army, purposing to remove him from the affairs of the kingdom:"
    status: { la: verified, en: verified }
  - n: 64
    text:
      la: "et occurrit illis: fratrem autem suum Simonem reliquit intra provinciam."
      en: "And he went against them: but left his brother Simon in the country."
    status: { la: verified, en: verified }
  - n: 65
    text:
      la: "Et applicuit Simon ad Bethsuram, et expugnabat eam diebus multis, et conclusit eos."
      en: "And Simon encamped against Bethsura, and assaulted it many days, and shut them up."
    status: { la: verified, en: verified }
  - n: 66
    text:
      la: "Et postulaverunt ab eo dextras accipere, et dedit illis: et ejecit eos inde, et cepit civitatem, et posuit in ea praesidium."
      en: "And they desired him to make peace, and he granted it them: and he cast them out from thence, and took the city, and placed a garrison in it."
    status: { la: verified, en: verified }
  - n: 67
    text:
      la: "Et Jonathas et castra ejus applicuerunt ad aquam Genesar, et ante lucem vigilaverunt in campo Asor:"
      en: "And Jonathan, and his army encamped by the water of Genesar, and before it was light they were ready in the plain of Asor."
    status: { la: verified, en: verified }
  - n: 68
    text:
      la: "et ecce castra alienigenarum occurrebant in campo, et tendebant ei insidias in montibus: ipse autem occurrit ex adverso."
      en: "And behold the army of the strangers met him in the plain, and they laid an ambush for him in the mountains: but he went out against them."
    status: { la: verified, en: verified }
  - n: 69
    text:
      la: "Insidiae vero exsurrexerunt de locis suis, et commiserunt praelium."
      en: "And they that lay in ambush arose out of their places, and joined battle."
    status: { la: verified, en: verified }
  - n: 70
    text:
      la: "Et fugerunt qui erant ex parte Jonathae omnes, et nemo relictus est ex eis, nisi Mathathias filius Absolomi, et Judas filius Calphi, princeps militiae exercitus."
      en: "And all that were on Jonathan's side fled, and none was left of them, but Mathathias the son of Absalom, and Judas the son of Calphi, chief captain of the army."
    status: { la: verified, en: verified }
  - n: 71
    text:
      la: "Et scidit Jonathas vestimenta sua, et posuit terram in capite suo, et oravit."
      en: "And Jonathan rent his garments, and cast earth upon his head, and prayed."
    status: { la: verified, en: verified }
  - n: 72
    text:
      la: "Et reversus est Jonathas ad eos in praelium, et convertit eos in fugam, et pugnaverunt."
      en: "And Jonathan turned again to them to battle, and he put them to flight, and they fought."
    status: { la: verified, en: verified }
  - n: 73
    text:
      la: "Et viderunt qui fugiebant partis illius, et reversi sunt ad eum, et insequebantur cum eo omnes usque Cades ad castra sua, et pervenerunt usque illuc:"
      en: "And they of his part that fled saw this, and they turned again to him, and they all with him pursued the enemies even to Cades to their own camp, and they came even thither."
    status: { la: verified, en: verified }
  - n: 74
    text:
      la: "et ceciderunt de alienigenis in die illa tria millia virorum: et reversus est Jonathas in Jerusalem."
      en: "And there fell of the aliens in that day three thousand men: and Jonathan returned to Jerusalem."
    status: { la: verified, en: verified }
