# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 18
verses:
  - n: 1
    text:
      la: "Cumque audisset Jethro, sacerdos Madian, cognatus Moysi, omnia quae fecerat Deus Moysi, et Israeli populo suo, et quod eduxisset Dominus Israel de Aegypto,"
      en: "And when Jethro the priest of Madian, the kinsman of Moses, had heard all the things that God had done to Moses, and to Israel his people, and that the Lord had brought forth Israel out of Egypt,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "tulit Sephoram uxorem Moysi quam remiserat,"
      en: "He took Sephora the wife of Moses whom he had sent back:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et duos filios ejus: quorum unus vocabatur Gersam, dicente patre: Advena fui in terra aliena;"
      en: "And her two sons, of whom one was called Gersam, his father saying: I have been a stranger in a foreign country."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "alter vero Eliezer: Deus enim, ait, patris mei adjutor meus, et eruit me de gladio Pharaonis."
      en: "And the other Eliezer: For the God of my father, said he, is my helper, and hath delivered me from the sword of Pharao."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Venit ergo Jethro cognatus Moysi, et filii ejus, et uxor ejus ad Moysen in desertum, ubi erat castrametatus juxta montem Dei."
      en: "And Jethro the kinsman of Moses came with his sons and his wife, to Moses into the desert, where he was camped by the mountain of God."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et mandavit Moysi, dicens: Ego Jethro cognatus tuus venio ad te, et uxor tua, et duo filii cum ea."
      en: "And he sent word to Moses, saying: I Jethro thy kinsman come to thee, and thy wife, and thy two sons with her."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Qui egressus in occursum cognati sui, adoravit, et osculatus est eum: salutaveruntque se mutuo verbis pacificis. Cumque intrasset tabernaculum,"
      en: "And he went out to meet his kinsman, and worshipped and kissed him: and they saluted one another with words of peace. And when he was come into the tent,"
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "narravit Moyses cognato suo cuncta quae fecerat Dominus Pharaoni et Aegyptiis propter Israel: universumque laborem, qui accidisset eis in itinere, et quod liberaverat eos Dominus."
      en: "Moses told his kinsman all that the Lord had done to Pharao, and the Egyptians, in favour of Israel: and all the labour which had befallen them in the journey, and that the Lord had delivered them."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Laetatusque est Jethro super omnibus bonis, quae fecerat Dominus Israeli, eo quod eruisset eum de manu Aegyptiorum."
      en: "And Jethro rejoiced for all the good things that the Lord had done to Israel, because he had delivered them out of the hands of the Egyptians."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Et ait: Benedictus Dominus, qui liberavit vos de manu Aegyptiorum, et de manu Pharaonis; qui eruit populum suum de manu Aegypti."
      en: "And he said: Blessed is the Lord, who hath delivered you out of the hand of Pharao, and out of the hand of the Egyptians, who hath delivered his people out of the hand of Egypt."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Nunc cognovi, quia magnus Dominus super omnes deos: eo quod superbe egerint contra illos."
      en: "Now I know that the Lord is great above all gods: because they dealt proudly against them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Obtulit ergo Jethro cognatus Moysi holocausta et hostias Deo: veneruntque Aaron et omnes seniores Israel, ut comederent panem cum eo coram Deo."
      en: "So Jethro the kinsman of Moses offered holocausts and sacrifices to God: and Aaron and all the ancients of Israel came, to eat bread with them before God."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Altera autem die sedit Moyses ut judicaret populum, qui assistebat Moysi a mane usque ad vesperam."
      en: "And the next day Moses sat, to judge the people, who stood by Moses from morning until night."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Quod cum vidisset cognatus ejus, omnia scilicet quae agebat in populo, ait: Quid est hoc quod facis in plebe? cur solus sedes, et omnis populus praestolatur de mane usque ad vesperam?"
      en: "And when his kinsman had seen all things that he did among the people, he said: What is it that thou dost among the people? Why sittest thou alone, and all the people wait from morning till night."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Cui respondit Moyses: Venit ad me populus quaerens sententiam Dei:"
      en: "And Moses answered him: The people come to me to seek the judgment of God."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cumque acciderit eis aliqua disceptatio, veniunt ad me ut judicem inter eos, et ostendam praecepta Dei, et leges ejus."
      en: "And when any controversy falleth out among them, they come to me to judge between them, and to shew the precepts of God, and his laws."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "At ille: Non bonam, inquit, rem facis."
      en: "But he said: The thing thou dost is not good."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Stulto labore consumeris et tu, et populus iste qui tecum est: ultra vires tuas est negotium; solus illud non poteris sustinere."
      en: "Thou are spent with foolish labour, both thou and this people that is with thee: the business is above thy strength, thou alone canst not bear it."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Sed audi verba mea atque consilia, et erit Deus tecum. Esto tu populo in his quae ad Deum pertinent, ut referas quae dicuntur ad eum:"
      en: "But hear my words and counsels, and God shall be with thee. Be thou to the people in those things that pertain to God, to bring their words to him:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ostendasque populo caeremonias et ritum colendi, viamque per quam ingredi debeant, et opus quod facere debeant."
      en: "And to shew the people the ceremonies and the manner of worshipping, and the way wherein they ought to walk, and the work that they ought to do."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Provide autem de omni plebe viros potentes, et timentes Deum, in quibus sit veritas, et qui oderint avaritiam, et constitue ex eis tribunos, et centuriones, et quinquagenarios, et decanos,"
      en: "And provide out of all the people able men, such as fear God, in whom there is truth, and that hate avarice, and appoint of them rulers of thousands, and of hundreds, and of fifties, and of tens."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "qui judicent populum omni tempore: quidquid autem majus fuerit, referant ad te, et ipsi minora tantummodo judicent: leviusque sit tibi, partito in alios onere."
      en: "Who may judge the people at all times: and when any great matter soever shall fall out, let them refer it to thee, and let them judge the lesser matters only: that so it may be lighter for thee, the burden being shared out unto others."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Si hoc feceris, implebis imperium Dei, et praecepta ejus poteris sustentare: et omnis hic populus revertetur ad loca sua cum pace."
      en: "If thou dost this, thou shalt fulfill the commandment of God, and shalt be able to bear his precepts: and all this people shall return to their places with peace."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Quibus auditis, Moyses fecit omnia quae ille suggesserat."
      en: "And when Moses heard this, he did all things that he had suggested unto him."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et electis viris strenuis de cuncto Israel, constituit eos principes populi, tribunos, et centuriones, et quinquagenarios, et decanos."
      en: "And choosing able men out of all Israel, he appointed them rulers of the people, rulers over thousands, and over hundreds, and over fifties, and over tens."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Qui judicabant plebem omni tempore: quidquid autem gravius erat, referebant ad eum, faciliora tantummodo judicantes."
      en: "And they judged the people at all times: and whatsoever was of greater difficulty they referred to him, and they judged the easier cases only."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Dimisitque cognatum suum: qui reversus abiit in terram suam."
      en: "And he let his kinsman depart: and he returned and went into his own country."
    status: { la: verified, en: verified }
