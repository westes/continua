book: ezek
chapter: 29
verses:
  - n: 1
    text:
      la: "in anno decimo in decimo mense undecima mensis factum est verbum Domini ad me dicens"
      en: "In the tenth year, the tenth month, the eleventh day of the month, the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fili hominis pone faciem tuam contra Pharaonem regem Aegypti et prophetabis de eo et de Aegypto universa"
      en: "Son of man, set thy face against Pharao king of Egypt: and thou shalt prophesy of him, and of all Egypt:"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "loquere et dices haec dicit Dominus Deus ecce ego ad te Pharao rex Aegypti draco magne qui cubas in medio fluminum tuorum et dicis meus est fluvius et ego feci memet ipsum"
      en: "Speak, and say: Thus saith the Lord God: Behold, I come against thee, Pharao king of Egypt, thou great dragon that liest in the midst of thy rivers, and sayest: The river is mine, and I made myself."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et ponam frenum in maxillis tuis et adglutinabo pisces fluminum tuorum squamis tuis et extraham te de medio fluminum tuorum et universi pisces tui squamis tuis adherebunt"
      en: "But I will put a bridle in thy jaws: and I will cause the fish of thy rivers to stick to thy scales: and I will draw thee out of the midst of thy rivers, and all thy fish shall stick to thy scales."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et proiciam te in desertum et omnes pisces fluminis tui super faciem terrae cades non colligeris neque congregaberis bestiis terrae et volatilibus caeli dedi te ad devorandum"
      en: "And I will cast thee forth into the desert, and all the fish of thy river: thou shalt fall upon the face of the earth, thou shalt not be taken up, nor gathered together: I have given thee for meat to the beasts of the earth, and to the fowls of the air."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "et scient omnes habitatores Aegypti quia ego Dominus pro eo quod fuisti baculus harundineus domui Israhel"
      en: "And all the inhabitants of Egypt shall know that I am the Lord: because thou hast been a staff of a reed to the house of Israel."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "quando adprehenderunt te manu et confractus es et lacerasti omnem umerum eorum et innitentibus eis super te comminutus es et dissolvisti omnes renes eorum"
      en: "When they took hold of thee with the hand thou didst break, and rent all their shoulder: and when they leaned upon thee, thou brokest, and weakenest all their loins."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "propterea haec dicit Dominus Deus ecce ego adducam super te gladium et interficiam de te hominem et iumentum"
      en: "Therefore thus saith the Lord God: Behold, I will bring the sword upon thee: and cut off man and beast out of thee."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et erit terra Aegypti in desertum et solitudinem et scient quia ego Dominus eo quod dixerit fluvius meus est et ego feci"
      en: "And the land of Egypt shall become a desert, and a wilderness: and they shall know that I am the Lord: because thou hast said: The river is mine, and I made"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "idcirco ecce ego ad te et ad flumina tua daboque terram Aegypti in solitudines gladio dissipatam a turre Syenes usque ad terminos Aethiopiae"
      en: "Therefore, behold I come against thee, and thy rivers: and I will make the land of Egypt utterly desolate, and wasted by the sword, from the tower of Syene, even to the borders of Ethiopia."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "non pertransibit eam pes hominis neque pes iumenti gradietur in ea et non habitabitur quadraginta annis"
      en: "The foot of man shall not pass through it, neither shall the foot of beasts go through it: nor shall it be inhabited during forty years."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "daboque terram Aegypti desertam in medio terrarum desertarum et civitates eius in medio urbium subversarum erunt desolatae quadraginta annis et dispergam Aegyptios in nationes et ventilabo eos in terras"
      en: "And I will make the land of Egypt desolate in the midst of the lands that are desolate, and the cities thereof in the midst of the cities that are destroyed, and they shall be desolate for forty gears: and I will scatter the Egyptians among the nations, and will disperse them through the countries."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "quia haec dicit Dominus Deus post finem quadraginta annorum congregabo Aegyptum de populis in quibus dispersi fuerunt"
      en: "For thus saith the Lord God: At the end of forty years I will gather the Egyptians from the people among whom they had been scattered."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et reducam captivitatem Aegypti et conlocabo eos in terra Fatures in terra nativitatis suae et erunt ibi in regnum humile"
      en: "And I will bring hack the captivity of Egypt, and will place them in the land of Phatures, in the land of their nativity, and they shall be there a low kingdom:"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "inter regna cetera erit humillima et non elevabitur ultra super nationes et inminuam eos ne imperent gentibus"
      en: "It shall be the lowest among other kingdoms, and it shall no more be exalted over the nations, and I will diminish them that they shall rule no more over the nations."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "neque erunt ultra domui Israhel in confidentia docentes iniquitatem ut fugiant et sequantur eos et scient quia ego Dominus Deus"
      en: "And they shall be no more a confidence to the house of Israel, teaching iniquity, that they may flee, and follow them: and they shall know that I am the Lord God."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "et factum est in vicesimo et septimo anno in primo in una mensis factum est verbum Domini ad me dicens"
      en: "And it came to pass in the seven and twentieth year, in the first month, in the first of the month: that the word of the Lord came to me, saying:"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "fili hominis Nabuchodonosor rex Babylonis servire fecit exercitum suum servitute magna adversum Tyrum omne caput decalvatum et omnis umerus depilatus est et merces non est reddita ei neque exercitui eius de Tyro pro servitute qua servivit mihi adversum eam"
      en: "Son of man, Nabuchodonosor king of Babylon hath made his army to undergo hard service against Tyre: every head was made bald, and every shoulder was peeled: and there hath been no reward given him, nor his army for Tyre, for the service that he rendered me against"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "propterea haec dicit Dominus Deus ecce ego dabo Nabuchodonosor regem Babylonis in terra Aegypti et accipiet multitudinem eius et depraedabitur manubias eius et diripiet spolia eius et erit merces exercitui illius"
      en: "Therefore thus saith the Lord God: Behold, I will set Nabuchodonosor the king of Babylon in the land of Egypt: and he shall take her multitude, and take the booty thereof for a prey, and rifle the spoils thereof: and it shall be wages for his army."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et operi pro quo servivit adversum eam dedi ei terram Aegypti pro eo quod laboraverunt mihi ait Dominus Deus"
      en: "And for the service that he hath done me against it: I have given him the land of Egypt, because he hath laboured for me, saith the Lord God."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "in die illo pullulabit cornu domui Israhel et tibi dabo apertum os in medio eorum et scient quoniam ego Dominus"
      en: "In that day a horn shall bud forth to the house of Israel, and I will give thee an open mouth in the midst of them: and they shall know that I am the Lord."
    status: { la: verified, en: verified }
