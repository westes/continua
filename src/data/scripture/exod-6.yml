# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 6
verses:
  - n: 1
    text:
      la: "Dixitque Dominus ad Moysen: Nunc videbis quae facturus sim Pharaoni: per manum enim fortem dimittet eos, et in manu robusta ejiciet illos de terra sua."
      en: "And the Lord said to Moses: Now thou shalt see what I will do to Pharao: for by a mighty hand shall he let them go, and with a strong hand shall he cast them out of his land."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Locutusque est Dominus ad Moysen dicens: Ego Dominus"
      en: "And the Lord spoke to Moses, saying: I am the Lord,"
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "qui apparui Abraham, Isaac et Jacob in Deo omnipotente: et nomen meum Adonai non indicavi eis."
      en: "That appeared to Abraham, to Isaac, and to Jacob, by the name of God Almighty; and my name ADONAI I did not shew them."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Pepigique foedus cum eis, ut darem eis terram Chanaan, terram peregrinationis eorum, in qua fuerunt advenae."
      en: "And I made a covenant with them, to give them the land of Chanaan, the land of their pilgrimage wherein they were strangers."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Ego audivi gemitum filiorum Israel, quo Aegyptii oppresserunt eos: et recordatus sum pacti mei."
      en: "I have heard the groaning of the children of Israel, wherewith the Egyptians have oppressed them: and I have remembered my covenant."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Ideo dic filiis Israel: Ego Dominus qui educam vos de ergastulo Aegyptiorum, et eruam de servitute, ac redimam in brachio excelso et judiciis magnis."
      en: "Therefore say to the children of Israel: I am the Lord who will bring you out from the work prison of the Egyptians, and will deliver you from bondage: and redeem you with a high arm, and great judgments."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et assumam vos mihi in populum, et ero vester Deus: et scietis quod ego sum Dominus Deus vester qui eduxerim vos de ergastulo Aegyptiorum,"
      en: "And I will take you to myself for my people, I will be your God: and you shall know that I am the Lord your God who brought you out from the work prison of the Egyptians."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et induxerim in terram, super quam levavi manum meam ut darem eam Abraham, Isaac et Jacob: daboque illam vobis possidendam. Ego Dominus."
      en: "And brought you into the land, concerning which I lifted up my hand to give it to Abraham, Isaac, and Jacob and I will give it you to possess, I am the Lord."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Narravit ergo Moyses omnia filiis Israel: qui non acquieverunt ei propter angustiam spiritus, et opus durissimum."
      en: "And Moses told all this to the children of Israel: but they did not hearken to him, for anguish of spirit, and most painful work."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Locutusque est Dominus ad Moysen, dicens:"
      en: "And the Lord spoke to Moses, saying:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Ingredere, et loquere ad Pharaonem regem Aegypti, ut dimittat filios Israel de terra sua."
      en: "Go in, and speak to Pharao king of Egypt, that he let the children of Israel go out of his land."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Respondit Moyses coram Domino: Ecce filii Israel non audiunt me: et quomodo audiet Pharao, praesertim cum incircumcisus sim labiis?"
      en: "Moses answered before the Lord Behold the children of Israel do no hearken to me; and how will Pharao hear me, especially as I am of uncircumcised lips?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Locutusque est Dominus ad Moysen et Aaron, et dedit mandatum ad filios Israel, et ad Pharaonem regem Aegypti ut educerent filios Israel de terra Aegypti."
      en: "And the Lord spoke to Moses and Aaron, and he gave them a charge unto the children of Israel, and unto Pharao the king of Egypt, that they should bring forth the children of Israel out of the land of Egypt."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Isti sunt principes domorum per familias suas. Filii Ruben primogeniti Israelis: Henoch et Phallu, Hesron et Charmi:"
      en: "These are the heads of their house by their families. The sons of Ruben the firstborn of Israel: Henoch and Phallu, Hesron and Charmi."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "hae cognationes Ruben. Filii Simeon: Jamuel, et Jamin, et Ahod, et Jachin, et Soar, et Saul filius Chananitidis: hae progenies Simeon."
      en: "These are the kindreds of Ruben. The sons of Simeon: Jamuel, and Jamin and Ahod, and Jachin, and Soar, and Saul the son of a Chanaanitess: these are the families of Simeon."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et haec nomina filiorum Levi per cognationes suas: Gerson, et Caath, et Merari. Anni autem vitae Levi fuerunt centum triginta septem."
      en: "And these are the names of the sons of Levi by their kindreds: Gerson, and Caath, and Merari. And the years of the life of Levi were a hundred and thirty seven."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Filii Gerson: Lobni et Semei, per cognationes suas."
      en: "The sons of Gerson: Lobni and Semei, by their kindreds."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Filii Caath: Amram, et Isaar, et Hebron, et Oziel; anni quoque vitae Caath, centum triginta tres."
      en: "The sons of Caath: Amram, and Isaar, and Hebron, and Oziel. And the years of Caath's life were a hundred and thirty-three."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Filii Merari: Moholi et Musi: hae cognationes Levi per familias suas."
      en: "The sons of Merari: Moholi and Musi. These are the kindreds of Levi by their families."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Accepit autem Amram uxorem Jochabed patruelem suam: quae peperit ei Aaron et Moysen. Fueruntque anni vitae Amram, centum triginta septem."
      en: "And Amram took to wife Jochabed his aunt by the father's side: and she bore him Aaron and Moses. And the years of Amram's life were a hundred and thirty-seven."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Filii quoque Isaar: Core, et Nepheg, et Zechri."
      en: "The sons also of Isaar: Core, and Nepheg, and Zechri."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Filii quoque Oziel: Misael, et Elisaphan, et Sethri."
      en: "The sons also of Oziel: Mizael, and Elizaphan, and Sethri."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "Accepit autem Aaron uxorem Elisabeth filiam Aminadab, sororem Nahason, quae peperit ei Nadab, et Abiu, et Eleazar, et Ithamar."
      en: "And Aaron took to wife Elizabeth the daughter of Aminadab, sister of Nahason, who bore him Nadab, and Abiu, and Eleazar, and Ithamar."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Filii quoque Core: Aser, et Elcana, et Abiasaph: hae sunt cognationes Coritarum."
      en: "The sons also of Core: Aser, and Elcana, and Abiasaph. These are the kindreds of the Corites."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "At vero Eleazar filius Aaron accepit uxorem de filiabus Phutiel: quae peperit ei Phinees. Hi sunt principes familiarum Leviticarum per cognationes suas."
      en: "But Eleazar the son of Aaron took a wife of the daughters of Phutiel: and she bore him Phinees. These are the heads of the Levitical families by their kindreds."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Iste est Aaron et Moyses, quibus praecepit Dominus ut educerent filios Israel de terra Aegypti per turmas suas."
      en: "These are Aaron and Moses, whom the Lord commanded to bring forth the children of Israel out of the land of Egypt by their companies."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "Hi sunt, qui loquuntur ad Pharaonem regem Aegypti, ut educant filios Israel de Aegypto: iste est Moyses et Aaron,"
      en: "These are they that speak to Pharao king of Egypt, in order to bring out the children of Israel from Egypt: these are that Moses and Aaron,"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "in die qua locutus est Dominus ad Moysen, in terra Aegypti."
      en: "In the day when the Lord spoke to Moses in the land of Egypt."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Et locutus est Dominus ad Moysen, dicens: Ego Dominus: loquere ad Pharaonem regem Aegypti, omnia quae ego loquor tibi."
      en: "And the Lord spoke to Moses, saying: I am the Lord: speak thou to Pharao king of Egypt all that I say to thee."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "Et ait Moyses coram Domino: En incircumcisus labiis sum, quomodo audiet me Pharao?"
      en: "And Moses said before the Lord: Lo I am of uncircumcised lips, how will Pharao hear me?"
    status: { la: verified, en: verified }
