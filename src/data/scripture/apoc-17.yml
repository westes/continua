# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: apoc
chapter: 17
verses:
  - n: 1
    text:
      la: "Et venit unus de septem angelis, qui habebant septem phialas, et locutus est mecum, dicens: Veni, ostendam tibi damnationem meretricis magnae, quae sedet super aquas multas,"
      en: "And there came one of the seven angels, who had the seven vials, and spoke with me, saying: Come, I will shew thee the condemnation of the great harlot, who sitteth upon many waters,"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cum qua fornicati sunt reges terrae, et inebriati sunt qui inhabitant terram de vino prostitutionis ejus."
      en: "With whom the kings of the earth have committed fornication; and they who inhabit the earth, have been made drunk with the wine of her whoredom."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Et abstulit me in spiritu in desertum. Et vidi mulierem sedentem super bestiam coccineam, plenam nominibus blasphemiae, habentem capita septem, et cornua decem."
      en: "And he took me away in spirit into the desert. And I saw a woman sitting upon a scarlet coloured beast, full of names of blasphemy, having seven heads and ten horns."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et mulier erat circumdata purpura, et coccino, et inaurata auro, et lapide pretioso, et margaritis, habens poculum aureum in manu sua, plenum abominatione, et immunditia fornicationis ejus."
      en: "And the woman was clothed round about with purple and scarlet, and gilt with gold, and precious stones and pearls, having a golden cup in her hand, full of the abomination and filthiness of her fornication."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Et in fronte ejus nomen scriptum: Mysterium: Babylon magna, mater fornicationum, et abominationum terrae."
      en: "And on her forehead a name was written: A mystery; Babylon the great, the mother of the fornications, and the abominations of the earth."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Et vidi mulierem ebriam de sanguine sanctorum, et de sanguine martyrum Jesu. Et miratus sum cum vidissem illam admiratione magna."
      en: "And I saw the woman drunk with the blood of the saints, and with the blood of the martyrs of Jesus. And I wondered, when I had seen her, with great admiration."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et dixit mihi angelus: Quare miraris? ego dicam tibi sacramentum mulieris, et bestiae, quae portat eam, quae habet capita septem, et cornua decem."
      en: "And the angel said to me: Why dost thou wonder? I will tell thee the mystery of the woman, and of the beast which carrieth her, which hath the seven heads and ten horns."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Bestia, quam vidisti, fuit, et non est, et ascensura est de abysso, et in interitum ibit: et mirabuntur inhabitantes terram ( quorum non sunt scripta nomina in libro vitae a constitutione mundi) videntes bestiam, quae erat, et non est."
      en: "The beast, which thou sawest, was, and is not, and shall come up out of the bottomless pit, and go into destruction: and the inhabitants on the earth (whose names are not written in the book of life from the foundation of the world) shall wonder, seeing the beast that was, and is not."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Et hic est sensus, qui habet sapientiam. Septem capita, septem montes sunt, super quos mulier sedet, et reges septem sunt."
      en: "And here is the understanding that hath wisdom. The seven heads are seven mountains, upon which the woman sitteth, and they are seven kings:"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Quinque ceciderunt, unus est, et alius nondum venit: et cum venerit, oportet illum breve tempus manere."
      en: "Five are fallen, one is, and the other is not yet come: and when he is come, he must remain a short time."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Et bestia, quae erat, et non est: et ipsa octava est: et de septem est, et in interitum vadit."
      en: "And the beast which was, and is not: the same also is the eighth, and is of the seven, and goeth into destruction."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Et decem cornua, quae vidisti, decem reges sunt: qui regnum nondum acceperunt, sed potestatem tamquam reges una hora accipient post bestiam."
      en: "And the ten horns which thou sawest, are ten kings, who have not yet received a kingdom, but shall receive power as kings one hour after the beast."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Hi unum consilium habent, et virtutem, et potestatem suam bestiae tradent."
      en: "These have one design: and their strength and power they shall deliver to the beast."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Hi cum Agno pugnabunt, et Agnus vincet illos: quoniam Dominus dominorum est, et Rex regum, et qui cum illo sunt, vocati, electi, et fideles."
      en: "These shall fight with the Lamb, and the Lamb shall overcome them, because he is Lord of lords, and King of kings, and they that are with him are called, and elect, and faithful."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et dixit mihi: Aquae, quas vidisti ubi meretrix sedet, populi sunt, et gentes, et linguae."
      en: "And he said to me: The waters which thou sawest, where the harlot sitteth, are peoples, and nations, and tongues."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et decem cornua, quae vidisti in bestia: hi odient fornicariam, et desolatam facient illam, et nudam, et carnes ejus manducabunt, et ipsam igni concremabunt."
      en: "And the ten horns which thou sawest in the beast: these shall hate the harlot, and shall make her desolate and naked, and shall eat her flesh, and shall burn her with fire."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Deus enim dedit in corda eorum ut faciant quod placitum est illi: ut dent regnum suum bestiae donec consummentur verba Dei."
      en: "For God hath given into their hearts to do that which pleaseth him: that they give their kingdom to the beast, till the words of God be fulfilled."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Et mulier, quam vidisti, est civitas magna, quae habet regnum super reges terrae."
      en: "And the woman which thou sawest, is the great city, which hath kingdom over the kings of the earth."
    status: { la: verified, en: verified }
