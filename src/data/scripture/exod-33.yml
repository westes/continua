# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: exod
chapter: 33
verses:
  - n: 1
    text:
      la: "Locutusque est Dominus ad Moysen, dicens: Vade, ascende de loco isto tu, et populus tuus quem eduxisti de terra Aegypti, in terram quam juravi Abraham, Isaac et Jacob, dicens: Semini tuo dabo eam:"
      en: "And the Lord spoke to Moses, saying: Go, get thee up from this place, thou and thy people which thou has brought out of the land of Egypt, into the land concerning which I swore to Abraham, Isaac, and Jacob, saying: To thy seed I will give it."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "mittam praecursorem tui angelum, ut ejiciam Chananaeum, et Amorrhaeum, et Hethaeum, et Pherezaeum, et Hevaeum, et Jebusaeum,"
      en: "And I will send an angel before thee, that I may cast out the Chanaanite, and the Amorrhite, and the Hethite, and the Pherezite, and the Hevite, and the Jebusite."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "et intres in terram fluentem lacte et melle. Non enim ascendam tecum, quia populus durae cervicis es: ne forte disperdam te in via."
      en: "That thou mayst enter into the land that floweth with milk and honey. For I will not go up with thee, because thou art a stiffnecked people: lest I destroy thee in the way."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Audiensque populus sermonem hunc pessimum, luxit: et nullus ex more indutus est cultu suo."
      en: "And the people hearing these very bad tidings, mourned: and no man put on his ornaments according to custom."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dixitque Dominus ad Moysen: Loquere filiis Israel: Populus durae cervicis es: semel ascendam in medio tui, et delebo te. Jam nunc depone ornatum tuum, ut sciam quid faciam tibi."
      en: "And the Lord said to Moses: Say to the children of Israel: Thou are a stiffnecked people; once I shall come up in the midst of thee, and shall destroy thee. Now presently lay aside thy ornaments, that I may know what to do with thee."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Deposuerunt ergo filii Israel ornatum suum a monte Horeb."
      en: "So the children of Israel laid aside their ornaments by mount Horeb."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Moyses quoque tollens tabernaculum, tetendit extra castra procul, vocavitque nomen ejus, Tabernaculum foederis. Et omnis populus, qui habebat aliquam quaestionem, egrediebatur ad tabernaculum foederis, extra castra."
      en: "Moses also taking the tabernacle, pitched it without the camp afar off, and called the name thereof, The tabernacle of the covenant. And all the people that had any question, went forth to the tabernacle of the covenant, without the camp."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Cumque egrederetur Moyses ad tabernaculum, surgebat universa plebs, et stabat unusquisque in ostio papilionis sui, aspiciebantque tergum Moysi, donec ingrederetur tentorium."
      en: "And when Moses went forth to the tabernacle, all the people rose up, and every one stood in the door of his pavilion, and they beheld the back of Moses, till he went into the tabernacle."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Ingresso autem illo tabernaculum foederis, descendebat columna nubis, et stabat ad ostium, loquebaturque cum Moyse,"
      en: "And when he was gone into the tabernacle of the covenant, the pillar of the cloud came down, and stood at the door, and he spoke with Moses."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "cernentibus universis quod columna nubis staret ad ostium tabernaculi. Stabantque ipsi, et adorabant per fores tabernaculorum suorum."
      en: "And all saw that the pillar of the cloud stood at the door of the tabernacle. And they stood, and worshipped at the doors of their tents."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Loquebatur autem Dominus ad Moysen facie ad faciem, sicut solet loqui homo ad amicum suum. Cumque ille reverteretur in castra, minister ejus Josue filius Nun, puer, non recedebat de tabernaculo."
      en: "And the Lord spoke to Moses face to face, as a man is wont to speak to his friend. And when he returned into the camp, his servant Josue the son of Nun, a young man, departed not from the tabernacle."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Dixit autem Moyses ad Dominum: Praecipis ut educam populum istum: et non indicas mihi quem missurus es mecum, praesertim cum dixeris: Novi te ex nomine, et invenisti gratiam coram me."
      en: "And Moses said to the Lord; Thou commandest me to lead forth this people: and thou dost not let me know whom thou wilt send with me, especially whereas thou hast said: I know thee by name, and thou hast found favour in my sight."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Si ergo inveni gratiam in conspectu tuo, ostende mihi faciem tuam, ut sciam te, et inveniam gratiam ante oculos tuos: respice populum tuum gentem hanc."
      en: "If therefore I have found favour in thy sight, shew me thy face, that I may know thee, and may find grace before thy eyes: look upon thy people this nation."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dixitque Dominus: Facies mea praecedet te, et requiem dabo tibi."
      en: "And the Lord said: My face shall go before thee, and I will give thee rest."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et ait Moyses: Si non tu ipse praecedas, ne educas nos de loco isto."
      en: "And Moses said: If thou thyself dost not go before, bring us not out of this place."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "In quo enim scire poterimus ego et populus tuus invenisse nos gratiam in conspectu tuo, nisi ambulaveris nobiscum, ut glorificemur ab omnibus populis qui habitant super terram?"
      en: "For how shall we be able to know, I and thy people, that we have found grace in thy sight, unless thou walk with us, that we may be glorified by all people that dwell upon the earth?"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Dixit autem Dominus ad Moysen: Et verbum istud, quod locutus es, faciam: invenisti enim gratiam coram me, et teipsum novi ex nomine."
      en: "And the Lord said to Moses: This word also, which thou hast spoken, will I do: for thou hast found grace before me, and thee I have known by name."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Qui ait: Ostende mihi gloriam tuam."
      en: "And he said: shew me thy glory."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Respondit: Ego ostendam omne bonum tibi, et vocabo in nomine Domini coram te: et miserebor cui voluero, et clemens ero in quem mihi placuerit."
      en: "He answered: I will shew thee all good, and I will proclaim in the name of the Lord before thee: and I will have mercy on whom I will, and I will be merciful to whom it shall please me."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "Rursumque ait: Non poteris videre faciem meam: non enim videbit me homo et vivet."
      en: "And again he said: Thou canst not see my face: for man shall not see me and live."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "Et iterum: Ecce, inquit, est locus apud me, et stabis supra petram."
      en: "And again he said: Behold there is a place with me, and thou shalt stand upon the rock."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Cumque transibit gloria mea, ponam te in foramine petrae, et protegam dextera mea, donec transeam:"
      en: "And when my glory shall pass, I will set thee in a hole of the rock, and protect thee with my right hand, till I pass:"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "tollamque manum meam, et videbis posteriora mea: faciem autem meam videre non poteris."
      en: "And I will take away my hand, and thou shalt see my back parts: but my face thou canst not see."
    status: { la: verified, en: verified }
