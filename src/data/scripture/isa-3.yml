# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: isa
chapter: 3
verses:
  - n: 1
    text:
      la: "Ecce enim Dominator, Dominus exercituum, auferet a Jerusalem et a Juda validum et fortem, omne robur panis, et omne robor aquae;"
      en: "For behold the sovereign the Lord of hosts shall take away from Jerusalem, and from Juda the valiant and the strong, the whole strength of bread, and the whole strength of water."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "fortem, et virum bellatorem, judicem, et prophetam, et ariolum, et senem;"
      en: "The strong man, and the man of war, the judge, and the prophet, and the cunning man, and the ancient."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "principem super quinquaginta, et honorabilem vultu et consiliarium, et sapientem de architectis, et prudentem eloquii mystici."
      en: "The captain over fifty, and the honourable in countenance, and the counsellor, and the architect, and the skillful in eloquent speech."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Et dabo pueros principes eorum, et effeminati dominabuntur eis;"
      en: "And I will give children to be their princes, and the effeminate shall rule over them."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "et irruet populus, vir ad virum, et unusquisque ad proximum suum; tumultuabitur puer contra senem, et ignobilis contra nobilem."
      en: "And the people shall rush one upon another, and every man against his neighbour: the child shall make it tumult against the ancient, and the base against the honourable."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Apprehendet enim vir fratrem suum, domesticum patris sui: Vestimentum tibi est, princeps esto noster, ruina autem haec sub manu tua."
      en: "For a man shall take hold or his brother, one of the house of his father, saying: Thou hast a garment, be thou our ruler, and let this ruin be under thy hand."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Respondebit in die illa, dicens: Non sum medicus, et in domo mea non est panis neque vestimentum: nolite constituere me principem populi."
      en: "In that day he shall answer, saying: I am no healer, and in my house there is no bread, nor clothing: make me not ruler of the people."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Ruit enim Jerusalem, et Judas concidit, quia lingua eorum et adinventiones eorum contra Dominum, ut provocarent oculos majestatis ejus."
      en: "For Jerusalem is ruined, and Juda is fallen: because their tongue, and their devices are against the Lord, to provoke the eyes of his majesty."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Agnitio vultus eorum respondit eis; et peccatum suum quasi Sodoma praedicaverunt, nec absconderunt. Vae animae eorum, quoniam reddita sunt eis mala!"
      en: "The shew of their countenance hath answered them: and they have proclaimed abroad their sin as Sodom, and they have not hid it: woe to their souls, for evils are rendered to them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Dicite justo quoniam bene, quoniam fructum adinventionum suarum comedet."
      en: "Say to the just man that it is well, for he shall eat the fruit of his doings."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vae impio in malum! retributio enim manuum ejus fiet ei."
      en: "Woe to the wicked unto evil: for the reward of his hands shall be given him."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "Populum meum exactores sui spoliaverunt, et mulieres dominatae sunt eis. Popule meus, qui te beatum dicunt, ipsi te decipiunt, et viam gressuum tuorum dissipant."
      en: "As for my people, their oppressors have stripped them, and women have ruled over them. O my people, they that call thee blessed, the same deceive thee, and destroy the way of thy steps."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Stat ad judicandum Dominus, et stat ad judicandos populos."
      en: "The Lord standeth up to judge, and he standeth to judge the people."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Dominus ad judicium veniet cum senibus populi sui, et principibus ejus; vos enim depasti estis vineam, et rapina pauperis in domo vestra."
      en: "The Lord will enter into judgment with the ancients of his people, and its princes: for you have devoured the vineyard, and the spoil of the poor is in your house."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Quare atteritis populum meum, et facies pauperum commolitis? dicit Dominus exercituum."
      en: "Why do you consume my people, and grind the faces of the poor? saith the Lord the God of hosts."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Et dixit Dominus: Pro eo quod elevatae sunt filiae Sion, et ambulaverunt extento collo, et nutibus oculorum ibant, et plaudebant, ambulabant pedibus suis, et composito gradu incedebant;"
      en: "And the Lord said: Because the daughters of Sion are haughty, and have walked with stretched out necks, and wanton glances of their eyes, and made a noise as they walked with their feet and moved in a set pace:"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "decalvabit Dominus verticem filiarum Sion, et Dominus crimen earum nudabit."
      en: "The Lord will make bald the crown of the head of the daughters of Sion, and the Lord will discover their hair."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "In die illa auferet Dominus ornamentum calceamentum,"
      en: "In that day the Lord will take away the ornaments of shoes, and little moons,"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et lunulas, et torques, et monilia, et armillas, et mitras,"
      en: "And chains and necklaces, and bracelets, and bonnets,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et discriminalia, et periscelidas, et murenulas, et olfactoriola, et inaures,"
      en: "And bodkins, and ornaments of the legs, and tablets, and sweet balls, and earrings,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et annulos, et gemmas in fronte pendentes,"
      en: "And rings, and jewels hanging on the forehead,"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "et mutatoria, et palliola, et linteamina, et acus,"
      en: "And changes of apparel, and short cloaks, and fine linen, and crisping pins,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et specula, et sindones, et vittas, et theristra."
      en: "And looking-glasses, and lawns, and headbands, and fine veils."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et erit pro suavi odore foetor, et pro zona funiculus, et pro crispanti crine calvitium, et pro fascia pectorali cilicium."
      en: "And instead of a sweet smell there shall be stench, and instead of a girdle, a cord, and instead of curled hair, baldness, and instead of a stomacher, haircloth."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Pulcherrimi quoque viri tui gladio cadent, et fortes tui in praelio."
      en: "Thy fairest men also shall fall by the sword, and thy valiant ones in battle."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "Et moerebunt atque lugebunt portae ejus, et desolata in terra sedebit."
      en: "And her gates shall lament and mourn, and she shall sit desolate on the ground."
    status: { la: verified, en: verified }
