# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: prov
chapter: 20
verses:
  - n: 1
    text:
      la: "luxuriosa res vinum et tumultuosa ebrietas quicumque his delectatur non erit sapiens"
      en: "Wine is a luxurious thing, and drunkenness riotous: whosoever is delighted therewith shell not be wise."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "sicut rugitus leonis ita terror regis qui provocat eum peccat in animam suam"
      en: "As the roaring of a lion, so also is the dread of a king: he that provoketh him, sinneth against his own soul."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "honor est homini qui separat se a contentionibus omnes autem stulti miscentur contumeliis"
      en: "It is an honour for a man to separate himself from quarrels: but all fools are meddling with reproaches."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "propter frigus piger arare noluit mendicabit ergo aestate et non dabitur ei"
      en: "Because of the cold the sluggard would not plough: he shall beg therefore in the summer, and it shall not be given him."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "sicut aqua profunda sic consilium in corde viri sed homo sapiens exhauriet illud"
      en: "Counsel in the heart of a man is like deep water: but a wise man will draw it out."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "multi homines misericordes vocantur virum autem fidelem quis inveniet"
      en: "Many men are called merciful: but who shall find a faithful man?"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "iustus qui ambulat in simplicitate sua beatos post se filios derelinquet"
      en: "The just that walketh in his simplicity, shall leave behind him blessed children."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "rex qui sedet in solio iudicii dissipat omne malum intuitu suo"
      en: "The king, that sitteth on the throne of judgment, scattereth away all evil with his look."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "quis potest dicere mundum est cor meum purus sum a peccato"
      en: "Who can say: My heart is clean, I am pure from sin?"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "pondus et pondus mensura et mensura utrumque abominabile est apud Deum"
      en: "Diverse weights and diverse measures, both are abominable before God."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "ex studiis suis intellegitur puer si munda et si recta sint opera eius"
      en: "By his inclinations a child is known, if his works be clean and right."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "aurem audientem et oculum videntem Dominus fecit utrumque"
      en: "The hearing ear, and the seeing eye, the Lord hath made them both."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "noli diligere somnum ne te egestas opprimat aperi oculos tuos et saturare panibus"
      en: "Love not sleep, lest poverty oppress thee: open thy eyes, and be filled with bread."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "malum est malum est dicit omnis emptor et cum recesserit tunc gloriabitur"
      en: "It is nought, it is nought, saith every buyer: and when he is gone away, then he will boast."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "est aurum et multitudo gemmarum vas autem pretiosum labia scientiae"
      en: "There is gold, and a multitude of jewels: but the lips of knowledge are a precious vessel."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "tolle vestimentum eius qui fideiussor extitit alieni et pro extraneis aufer pignus ab eo"
      en: "Take away the garment of him that is surety for a stranger, and take a pledge from him for strangers."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "suavis est homini panis mendacii et postea implebitur os eius calculo"
      en: "The bread of lying is sweet to a man: but afterwards his mouth shall be filled with gravel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "cogitationes consiliis roborantur et gubernaculis tractanda sunt bella"
      en: "Designs are strengthened by counsels: and wars are to be managed by governments."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "ei qui revelat mysteria et ambulat fraudulenter et dilatat labia sua ne commiscearis"
      en: "Meddle not with him that revealeth secrets, and walketh deceitfully, and openeth wide his lips."
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "qui maledicit patri suo et matri extinguetur lucerna eius in mediis tenebris"
      en: "He that curseth his father, and mother, his lamp shall be put out in the midst of darkness."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "hereditas ad quam festinatur in principio in novissimo benedictione carebit"
      en: "The inheritance gotten hastily in the beginning, in the end shall be without a blessing."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "ne dicas reddam malum expecta Dominum et liberabit te"
      en: "Say not: I will return evil: wait for the Lord and he will deliver thee."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "abominatio est apud Deum pondus et pondus statera dolosa non est bona"
      en: "Diverse weights are an abomination before the Lord: a deceitful balance is not good."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "a Domino diriguntur gressus viri quis autem hominum intellegere potest viam suam"
      en: "The steps of man are guided by the Lord: but who is the man that can understand his own way?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "ruina est hominis devorare sanctos et post vota tractare"
      en: "It is ruin to a man to devour holy ones, and after vows to retract."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "dissipat impios rex sapiens et curvat super eos fornicem"
      en: "A wise king scattereth the wicked, and bringeth over them the wheel."
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "lucerna Domini spiraculum hominis quae investigat omnia secreta ventris"
      en: "The spirit of a man is the lamp of the Lord, which searcheth all the hidden things of the bowels."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "misericordia et veritas custodiunt regem et roboratur clementia thronus eius"
      en: "Mercy and truth preserve the king, and his throne is strengthened by clemency."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "exultatio iuvenum fortitudo eorum et dignitas senum canities"
      en: "The joy of young men is their strength: and the dignity of old men, their grey hairs."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "livor vulneris absterget mala et plagae in secretioribus ventris"
      en: "The blueness of a wound shall wipe away evils: and stripes in the more in- ward parts of the belly."
    status: { la: verified, en: verified }
