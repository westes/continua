# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: 1tim
chapter: 2
verses:
  - n: 1
    text:
      la: "obsecro igitur primo omnium fieri obsecrationes orationes postulationes gratiarum actiones pro omnibus hominibus"
      en: "I desire therefore, first of all, that supplications, prayers, intercessions, and thanksgivings be made for all men:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "pro regibus et omnibus qui in sublimitate sunt ut quietam et tranquillam vitam agamus in omni pietate et castitate"
      en: "For kings, and for all that are in high station: that we may lead a quiet and a peaceable life in all piety and chastity."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "hoc enim bonum est et acceptum coram salutari nostro Deo"
      en: "For this is good and acceptable in the sight of God our Saviour,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "qui omnes homines vult salvos fieri et ad agnitionem veritatis venire"
      en: "Who will have all men to be saved, and to come to the knowledge of the truth."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "unus enim Deus unus et mediator Dei et hominum homo Christus Iesus"
      en: "For there is one God, and one mediator of God and men, the man Christ Jesus:"
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "qui dedit redemptionem semet ipsum pro omnibus testimonium temporibus suis"
      en: "Who gave himself a redemption for all, a testimony in due times."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "in quo positus sum ego praedicator et apostolus veritatem dico non mentior doctor gentium in fide et veritate"
      en: "Whereunto I am appointed a preacher and an apostle, (I say the truth, I lie not,) a doctor of the Gentiles in faith and truth."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "volo ergo viros orare in omni loco levantes puras manus sine ira et disceptatione"
      en: "I will therefore that men pray in every place, lifting up pure hands, without anger and contention."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "similiter et mulieres in habitu ornato cum verecundia et sobrietate ornantes se non in tortis crinibus aut auro aut margaritis vel veste pretiosa"
      en: "In like manner women also in decent apparel: adorning themselves with modesty and sobriety, not with plaited hair, or gold, or pearls, or costly attire,"
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "sed quod decet mulieres promittentes pietatem per opera bona"
      en: "But as it becometh women professing godliness, with good works."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "mulier in silentio discat cum omni subiectione"
      en: "Let the woman learn in silence, with all subjection."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "docere autem mulieri non permitto neque dominari in virum sed esse in silentio"
      en: "But I suffer not a woman to teach, nor to use authority over the man: but to be in silence."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Adam enim primus formatus est deinde Eva"
      en: "For Adam was first formed; then Eve."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "et Adam non est seductus mulier autem seducta in praevaricatione fuit"
      en: "And Adam was not seduced; but the woman being seduced, was in the transgression."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "salvabitur autem per filiorum generationem si permanserint in fide et dilectione et sanctificatione cum sobrietate"
      en: "Yet she shall be saved through childbearing; if she continue in faith, and love, and sanctification, with sobriety."
    status: { la: verified, en: verified }
