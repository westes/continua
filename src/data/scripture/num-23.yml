# Douay-Rheims + Latin Vulgate, bulk-imported from a public-domain
# "Unbound Bible" tab-format source (both texts, verse-count and
# verse-numbering cross-checked to agree before import; see
# TODO.md's bulk scripture import entry).
book: num
chapter: 23
verses:
  - n: 1
    text:
      la: "dixitque Balaam ad Balac aedifica mihi hic septem aras et para totidem vitulos eiusdemque numeri arietes"
      en: "And Balaam said to Balac: Build me here seven altars, and prepare as many calves, and the same number of rams."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "cumque fecisset iuxta sermonem Balaam inposuerunt simul vitulum et arietem super aram"
      en: "And when he had done according to the word of Balaam, they laid together a calf and a ram upon every altar."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "dixitque Balaam ad Balac sta paulisper iuxta holocaustum tuum donec vadam si forte occurrat mihi Dominus et quodcumque imperaverit loquar tibi"
      en: "And Balaam said to Balac: Stand a while by thy burnt offering, until I go, to see if perhaps the Lord will meet me, and whatsoever he shall command, I will speak to thee."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "cumque abisset velociter occurrit ei Deus locutusque ad eum Balaam septem inquit aras erexi et inposui vitulum et arietem desuper"
      en: "And when he was gone with speed, God met him. And Balaam speaking to him, said: I have erected seven altars, and have laid on everyone a calf and a ram."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Dominus autem posuit verbum in ore eius et ait revertere ad Balac et haec loqueris"
      en: "And the Lord put the word in his mouth, and said: Return to Balac, and thus shalt thou speak."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "reversus invenit stantem Balac iuxta holocaustum suum et omnes principes Moabitarum"
      en: "Returning he found Balac standing by his burnt offering, with all the princes of the Moabites:"
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "adsumptaque parabola sua dixit de Aram adduxit me Balac rex Moabitarum de montibus orientis veni inquit et maledic Iacob propera et detestare Israhel"
      en: "And taking up his parable, he said: Balac king of the Moabites hath brought me from Aram, from the mountains of the east: Come, said he, and curse Jacob: make haste and detest Israel."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "quomodo maledicam cui non maledixit Deus qua ratione detester quem Dominus non detestatur"
      en: "How shall I curse him, whom God hath not cursed? By what means should I detest him, whom the Lord detesteth not?"
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "de summis silicibus videbo eum et de collibus considerabo illum populus solus habitabit et inter gentes non reputabitur"
      en: "I shall see him from the tops of the rocks, and shall consider him from the hills. This people shall dwell alone, and shall not be reckoned among the nations."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "quis dinumerare possit pulverem Iacob et nosse numerum stirpis Israhel moriatur anima mea morte iustorum et fiant novissima mea horum similia"
      en: "Who can count the dust of Jacob, and know the number of the stock of Israel? Let my soul die the death of the just, and my last end be like to them."
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "dixitque Balac ad Balaam quid est hoc quod agis ut malediceres inimicis vocavi te et tu e contrario benedicis eis"
      en: "And Balac said to Balaam: What is this that thou dost? I sent for thee to curse my enemies: and thou contrariwise blessest them."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "cui ille respondit num aliud possum loqui nisi quod iusserit Dominus"
      en: "He answered him: Call I speak any thing else but what the Lord commandeth?"
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "dixit ergo Balac veni mecum in alterum locum unde partem Israhelis videas et totum videre non possis inde maledicito ei"
      en: "Balac therefore said: Come with me to another place from whence thou mayest see part of Israel, and canst not see them all: curse them from thence."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "cumque duxisset eum in locum sublimem super verticem montis Phasga aedificavit Balaam septem aras et inpositis supra vitulo atque ariete"
      en: "And when he had brought him to a high place, upon the top of mount Phasga, Balaam built seven altars, and laying on every one a calf and a ram,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "dixit ad Balac sta hic iuxta holocaustum tuum donec ego pergam obvius"
      en: "He said to Balac: Stand here by thy burnt offering while I go to meet him."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "cui cum Dominus occurrisset posuissetque verbum in ore eius ait revertere ad Balac et haec loqueris ei"
      en: "And when the Lord had met him, and had put the word in his mouth, he said: Return to Balac, and thus shalt thou say to him."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "reversus invenit eum stantem iuxta holocaustum suum et principes Moabitarum cum eo ad quem Balac quid inquit locutus est Dominus"
      en: "Returning he found him standing by his burnt sacrifice, and the princes of the Moabites with him. And Balac said to him: What hath the Lord spoken?"
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "at ille adsumpta parabola sua ait sta Balac et ausculta audi fili Sepphor"
      en: "But he taking up his parable, said: Stand, O Balac, and give ear: hear, thou son of Sephor:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "non est Deus quasi homo ut mentiatur nec ut filius hominis ut mutetur dixit ergo et non faciet locutus est et non implebit"
      en: "God is not a man, that he should lie, nor as the son of man, that he should be changed. Hath he said then, and will he not do? hath he spoken, and will he not fulfil?"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "ad benedicendum adductus sum benedictionem prohibere non valeo"
      en: "I was brought to bless, the blessing I am not able to hinder."
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "non est idolum in Iacob nec videtur simulacrum in Israhel Dominus Deus eius cum eo est et clangor victoriae regis in illo"
      en: "There is no idol in Jacob, neither is there an image god to be seen in Israel. The Lord his God is with him, and the sound of the victory of the king in him."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Deus eduxit eum de Aegypto cuius fortitudo similis est rinocerotis"
      en: "God hath brought him out of Egypt, whose strength is like to the rhinoceros."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "non est augurium in Iacob nec divinatio in Israhel temporibus suis dicetur Iacob et Israheli quid operatus sit Deus"
      en: "There is no soothsaying in Jacob, nor divination in Israel. In their times it shall be told to Jacob and to Israel what God hath wrought."
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "ecce populus ut leaena consurget et quasi leo erigetur non accubabit donec devoret praedam et occisorum sanguinem bibat"
      en: "Behold the people shall rise up as a lioness, and shall lift itself up as a lion: it shall not lie down till it devour the prey, and drink the blood of the slain."
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "dixitque Balac ad Balaam nec maledicas ei nec benedicas"
      en: "And Balac said to Balaam: Neither curse, nor bless him."
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et ille nonne ait dixi tibi quod quicquid mihi Deus imperaret hoc facerem"
      en: "And he said: Did I not tell thee, that whatsoever God should command me, that I would do?"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "et ait Balac ad eum veni et ducam te ad alium locum si forte placeat Deo ut inde maledicas eis"
      en: "And Balac said to him: Come and I will bring thee to another place; if peradventure it please God that thou mayest curse them from thence."
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "cumque duxisset eum super verticem montis Phogor qui respicit solitudinem"
      en: "And when he had brought him upon the top of mount Phogor, which looketh towards the wilderness,"
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "dixit ei Balaam aedifica mihi hic septem aras et para totidem vitulos eiusdemque numeri arietes"
      en: "Balaam said to him: Build me here seven altars, and prepare as many calves, and the same number of rams."
    status: { la: verified, en: verified }
  - n: 30
    text:
      la: "fecit Balac ut Balaam dixerat inposuitque vitulos et arietes per singulas aras"
      en: "Balac did as Balaam had said: and he laid on every altar, a calf and a ram."
    status: { la: verified, en: verified }
