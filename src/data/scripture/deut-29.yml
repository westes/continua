# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: deut
chapter: 29
verses:
  - n: 1
    text:
      la: "Haec sunt verba foederis quod praecepit Dominus Moysi ut feriret cum filiis Israel in terra Moab: praeter illud foedus, quod cum eis pepigit in Horeb."
      en: "These are the words of the covenant which the Lord commanded Moses to make with the children of Israel in the land of Moab: beside that covenant which he made with them in Horeb."
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Vocavitque Moyses omnem Israel, et dixit ad eos: Vos vidistis universa, quae fecit Dominus coram vobis in terra Aegypti Pharaoni, et omnibus servis ejus, universaeque terrae illius,"
      en: "And Moses called all Israel, and said to them: You have seen all the things that the Lord did before you in the land of Egypt to Pharao, and to all his servants, and to his whole land."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "tentationes magnas, quas viderunt oculi tui, signa illa, portentaque ingentia,"
      en: "The great temptations, which thy eyes have seen, those mighty signs and wonders,"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "et non dedit vobis Dominus cor intelligens, et oculos videntes, et aures quae possunt audire, usque in praesentem diem."
      en: "And the Lord hath not given you a heart to understand, and eyes to see, and ears that may hear, unto this present day."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "Adduxit vos quadraginta annis per desertum: non sunt attrita vestimenta vestra, nec calceamenta pedum vestrorum vetustate consumpta sunt."
      en: "He hath brought you forty years through the desert: your garments are not worn out, neither are the shoes of your feet consumed with age."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Panem non comedistis, vinum et siceram non bibistis: ut sciretis quia ego sum Dominus Deus vester."
      en: "You have not eaten bread, nor have you drunk wine or strong drink: that you might know that I am the Lord your God."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Et venistis ad hunc locum: egressusque est Sehon rex Hesebon, et Og rex Basan, occurrentes nobis ad pugnam. Et percussimus eos,"
      en: "And you came to this place: and Sehon king of Hesebon, and Og king of Basan, came out against us to fight. And we slew them."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et tulimus terram eorum, ac tradidimus possidendam Ruben et Gad, et dimidiae tribui Manasse."
      en: "And took their land, and delivered it for a possession to Ruben and Gad, and the half tribe of Manasses."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Custodite ergo verba pacti hujus, et implete ea: ut intelligatis universa quae facitis."
      en: "Keep therefore the words of this covenant, and fulfill them: that you may understand all that you do."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Vos statis hodie cuncti coram Domino Deo vestro, principes vestri, et tribus, ac majores natu, atque doctores, omnis populus Israel,"
      en: "You all stand this day before the Lord your God, your princes, and tribes, and ancients, and doctors, all the people of Israel,"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "liberi et uxores vestrae, et advena qui tecum moratur in castris, exceptis lignorum caesoribus, et his qui comportant aquas:"
      en: "Your children and your wives, and the stranger that abideth with thee in the camp, besides the hewers of wood, and them that bring water:"
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "ut transeas in foedere Domini Dei tui, et in jurejurando quod hodie Dominus Deus tuus percutit tecum:"
      en: "That thou mayst pass in the covenant of the Lord thy God, and in the oath which this day the Lord thy God maketh with thee."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "ut suscitet te sibi in populum, et ipse sit Deus tuus sicut locutus est tibi, et sicut juravit patribus tuis, Abraham, Isaac, et Jacob."
      en: "That he may raise thee up a people to himself, and he may be thy God as he hath spoken to thee, and as he swore to thy fathers Abraham, Isaac, and Jacob."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Nec vobis solis ego hoc foedus ferio, et haec juramenta confirmo,"
      en: "Neither with you only do I make this covenant, and confirm these oaths,"
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "sed cunctis praesentibus et absentibus."
      en: "But with all that are present and that are absent."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Vos enim nostis quomodo habitaverimus in terra Aegypti, et quomodo transierimus per medium nationum, quas transeuntes"
      en: "For you know how we dwelt in the land of Egypt, and how we have passed through the midst of nations, and passing through them,"
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "vidistis abominationes et sordes, id est, idola eorum, lignum et lapidem, argentum et aurum, quae colebant."
      en: "You have seen their abominations and filth, that is to say, their idols, wood and stone, silver and gold, which they worshipped."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "Ne forte sit inter vos vir aut mulier, familia aut tribus, cujus cor aversum est hodie a Domino Deo nostro, ut vadat et serviat diis illarum gentium: et sit inter vos radix germinans fel et amaritudinem."
      en: "Lest perhaps there should be among you a man or a woman, a family or a tribe, whose heart is turned away this day from the Lord our God, to go and serve the gods of those nations: and there should be among you a root bringing forth gall and bitterness."
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "Cumque audierit verba juramenti hujus, benedicat sibi in corde suo, dicens: Pax erit mihi, et ambulabo in pravitate cordis mei: et absumat ebria sitientem,"
      en: "And when he shall hear the words of this oath, he should bless himself in his heart saying: I shall have peace, and will walk on in the naughtiness of my heart: and the drunken may consume the thirsty,"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "et Dominus non ignoscat ei: sed tunc quam maxime furor ejus fumet, et zelus contra hominem illum, et sedeant super eum omnia maledicta, quae scripta sunt in hoc volumine: et deleat Dominus nomen ejus sub caelo,"
      en: "And the Lord should not forgive him: but his wrath and jealousy against that man should be exceedingly enkindled at that time, and all the curses that are written in this volume should light upon him: and the Lord should blot out his name from under heaven,"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et consumat eum in perditionem ex omnibus tribubus Israel, juxta maledictiones, quae in libro legis hujus ac foederis continentur."
      en: "And utterly destroy him out of all the tribes of Israel, according to the curses that are contained in the book of this law and covenant:"
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "Dicetque sequens generatio, et filii qui nascentur deinceps, et peregrini qui de longe venerint, videntes plagas terrae illius, et infirmitates, quibus eam afflixerit Dominus,"
      en: "And the following generation shall say, and the children that shall be born hereafter, and the strangers that shall come from afar, seeing the plagues of that land and the evils wherewith the Lord hath afflicted it,"
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "sulphure, et salis ardore comburens, ita ut ultra non seratur, nec virens quippiam germinet, in exemplum subversionis Sodomae et Gomorrhae, Adamae et Seboim, quas subvertit Dominus in ira et furore suo."
      en: "Burning it with brimstone, and the heat of salt, so that it cannot be sown any more, nor any green thing grow therein, after the example of the destruction of Sodom and Gomorrha, Adama and Seboim, which the Lord destroyed in his wrath and indignation:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "Et dicent omnes gentes: Quare sic fecit Dominus terrae huic? quae est haec ira furoris ejus immensa?"
      en: "And all the nations shall say: Why hath the Lord done thus to this land? what meaneth this exceeding great heat of his wrath?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "Et respondebunt: Quia dereliquerunt pactum Domini, quod pepigit cum patribus eorum, quando eduxit eos de terra Aegypti:"
      en: "And they shall answer: Because they forsook the covenant of the Lord, which he made with their fathers, when he brought them out of the land of Egypt:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "et servierunt diis alienis, et adoraverunt eos, quos nesciebant, et quibus non fuerant attributi:"
      en: "And they have served strange gods, and adored them, whom they knew not, and for whom they had not been assigned:"
    status: { la: verified, en: verified }
  - n: 27
    text:
      la: "idcirco iratus est furor Domini contra terram istam, ut induceret super eam omnia maledicta, quae in hoc volumine scripta sunt:"
      en: "Therefore the wrath of the Lord was kindled against this land, to bring upon it all the curses that are written in this volume:"
    status: { la: verified, en: verified }
  - n: 28
    text:
      la: "et ejecit eos de terra sua in ira et in furore, et in indignatione maxima, projecitque in terram alienam, sicut hodie comprobatur."
      en: "And he hath cast them out of their land, in anger and in wrath, and in very great indignation, and hath thrown them into a strange land, as it is seen this day."
    status: { la: verified, en: verified }
  - n: 29
    text:
      la: "Abscondita, Domino Deo nostro; quae manifesta sunt, nobis et filiis nostris usque in sempiternum, ut faciamus universa verba legis hujus."
      en: "Secret things to the Lord our God: things that are manifest, to us and to our children for ever, that we may do all the words of this law."
    status: { la: verified, en: verified }
