# Douay-Rheims + Clementine Vulgate, from drbo.org's combined "DR + LV"
# chapter page, which keeps each verse's Latin and English in the same
# block. Replaced the earlier "Unbound Bible" import (critical-edition
# Latin, OCR-damaged English) on 2026-09-23; see TODO.md.
book: job
chapter: 23
verses:
  - n: 1
    text:
      la: "Respondens autem Job, ait:"
      en: "Then Job answered, and said:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "Nunc quoque in amaritudine est sermo meus, et manus plagae meae aggravata est super gemitum meum."
      en: "Now also my words are in bitterness, and the hand of my scourge is more grievous than my mourning."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "Quis mihi tribuat ut cognoscam et inveniam illum, et veniam usque ad solium ejus?"
      en: "Who will grant me that I might know and find him, and come even to his throne?"
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "Ponam coram eo judicium, et os meum replebo increpationibus:"
      en: "I would set judgment before him, and would fill my mouth with complaints."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "ut sciam verba quae mihi respondeat, et intelligam quid loquatur mihi."
      en: "That I might know the words that he would answer me, and understand what he would say to me."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "Nolo multa fortitudine contendat mecum, nec magnitudinis suae mole me premat."
      en: "I would not that he should contend with me with much strength, nor overwhelm me with the weight of his greatness."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "Proponat aequitatem contra me, et perveniat ad victoriam judicium meum."
      en: "Let him propose equity against me, and let my judgment come to victory."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "Si ad orientem iero, non apparet: si ad occidentem, non intelligam eum."
      en: "But if I go to the east, he appeareth not; if to the west, I shall not understand him."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "Si ad sinistram, quid agam? non apprehendam eum: si me vertam ad dexteram, non videbo illum."
      en: "If to the left hand, what shall I do? I shall not take hold on him: if I turn myself to the right hand, I shall not see him."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "Ipse vero scit viam meam, et probavit me quasi aurum quod per ignem transit."
      en: "But he knoweth my way, and has tried me as gold that passeth through the fire:"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "Vestigia ejus secutus est pes meus: viam ejus custodivi, et non declinavi ex ea."
      en: "My foot hath followed his steps, I have kept his way, and have not declined from it."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "A mandatis labiorum ejus non recessi, et in sinu meo abscondi verba oris ejus."
      en: "I have not departed from the commandments of his lips, and the words of his mouth I have hid in my bosom."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "Ipse enim solus est, et nemo avertere potest cogitationem ejus, et anima ejus quodcumque voluit, hoc fecit."
      en: "For he is alone, and no man can turn away his thought: and whatsoever his soul hath desired, that hath he done."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "Cum expleverit in me voluntatem suam, et alia multa similia praesto sunt ei."
      en: "And when he shall have fulfilled his will in me, many other like things are also at hand with him."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "Et idcirco a facie ejus turbatus sum, et considerans eum, timore sollicitor."
      en: "And therefore I am troubled at his presence, and when I consider him I am made pensive with fear."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "Deus mollivit cor meum, et Omnipotens conturbavit me."
      en: "God hath softened my heart, and the Almighty hath troubled me."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "Non enim perii propter imminentes tenebras, nec faciem meam operuit caligo."
      en: "For I have not perished because of the darkness that hangs over me, neither hath the mist covered my face."
    status: { la: verified, en: verified }
