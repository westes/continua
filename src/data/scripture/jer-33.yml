book: jer
chapter: 33
verses:
  - n: 1
    text:
      la: "et factum est verbum Domini ad Hieremiam secundo cum adhuc clausus esset in atrio carceris dicens"
      en: "And the word of the Lord came to Jeremias the second time, while he was yet shut up in the court of the prison, saying:"
    status: { la: verified, en: verified }
  - n: 2
    text:
      la: "haec dicit Dominus qui facturus est Dominus et formaturus illud et paraturus Dominus nomen eius"
      en: "Thus saith the Lord, who will do, and will form it, and prepare it, the Lord is his name."
    status: { la: verified, en: verified }
  - n: 3
    text:
      la: "clama ad me et exaudiam te et adnuntiabo tibi grandia et firma quae nescis"
      en: "Cry to me and I will hear thee: and I will shew thee great things, and sure things which thou knowest not."
    status: { la: verified, en: verified }
  - n: 4
    text:
      la: "quia haec dicit Dominus Deus Israhel ad domos urbis huius et ad domos regis Iuda quae destructae sunt et ad munitiones et gladium"
      en: "For thus saith the Lord the God of Israel to the houses of this city, and to the houses of the king of Juda, which rue destroyed, and to the bulwarks, and to the sword."
    status: { la: verified, en: verified }
  - n: 5
    text:
      la: "venientium ut dimicent cum Chaldeis et impleant eas cadaveribus hominum quas percussi in furore meo et in indignatione mea abscondens faciem meam a civitate hac propter omnem malitiam eorum"
      en: "Of them that come to fight with the Chaldeans, and to fill them with the dead bodies of the men whom I have slain in my wrath, and in my indignation, hiding my face from this city because of all their wickedness."
    status: { la: verified, en: verified }
  - n: 6
    text:
      la: "ecce ego obducam ei cicatricem et sanitatem et curabo eos et revelabo illis deprecationem pacis et veritatis"
      en: "Behold I will close their wounds and give them health, and I will cure them: and I will reveal to them the prayer of peace and truth."
    status: { la: verified, en: verified }
  - n: 7
    text:
      la: "et convertam conversionem Iuda et conversionem Hierusalem et aedificabo eos sicut a principio"
      en: "And I will bring back the captivity of Juda, and the captivity of Jerusalem: and I will build them as from the beginning."
    status: { la: verified, en: verified }
  - n: 8
    text:
      la: "et emundabo illos ab omni iniquitate sua in qua peccaverunt mihi et propitius ero cunctis iniquitatibus eorum in quibus deliquerunt mihi et spreverunt me"
      en: "And I will cleanse them from all their iniquity, whereby they have sinned against me: and I will forgive all their iniquities, whereby they have sinned against me, and despised me."
    status: { la: verified, en: verified }
  - n: 9
    text:
      la: "et erit mihi in nomen et in gaudium et in laudem et in exultationem cunctis gentibus terrae quae audierint omnia bona quae ego facturus sum eis et pavebunt et turbabuntur in universis bonis et in omni pace quam ego faciam ei"
      en: "And it shall be to me a name, and a joy, and a praise, and a gladness before all the nations of the earth, that shall hear of all the good things which I will do to them: and they shall fear and be troubled for all the good things, and for all the peace that I will make for them."
    status: { la: verified, en: verified }
  - n: 10
    text:
      la: "haec dicit Dominus adhuc audietur in loco isto quem vos dicitis esse desertum eo quod non sit homo et iumentum in civitatibus Iuda et foris Hierusalem quae desolatae sunt absque homine et absque habitatore et absque pecore"
      en: "Thus saith the Lord: There shall be heard again in this place (which you say is desolate, because there is neither man nor beast: in the cities of Juda, and without Jerusalem, which are desolate without man, and without inhabitant, and without beast)"
    status: { la: verified, en: verified }
  - n: 11
    text:
      la: "vox gaudii et vox laetitiae vox sponsi et vox sponsae vox dicentium confitemini Domino exercituum quoniam bonus Dominus quoniam in aeternum misericordia eius et portantium vota in domum Domini reducam enim conversionem terrae sicut a principio dicit Dominus"
      en: "The voice of joy and the voice of gladness, the voice of the bridegroom and the voice of the bride, the voice of them that shall say: Give ye glory to the Lord of hosts, for the Lord is good, for his mercy endureth for ever: and of them that shall bring their vows into the house of the Lord: for I will bring back the captivity of the land as at the first, saith the Lord."
    status: { la: verified, en: verified }
  - n: 12
    text:
      la: "haec dicit Dominus exercituum adhuc erit in loco isto deserto absque homine et absque iumento et in cunctis civitatibus eius habitaculum pastorum accubantium gregum"
      en: "Thus saith the Lord of hosts: There shall be again in this place that is desolate without man, and without beast, and in all the cities thereof, an habitation of shepherds causing their flocks to lie down."
    status: { la: verified, en: verified }
  - n: 13
    text:
      la: "in civitatibus montuosis et in civitatibus campestribus et in civitatibus quae ad austrum sunt et in terra Beniamin et in circuitu Hierusalem et in civitatibus Iuda adhuc transibunt greges ad manum numerantis ait Dominus"
      en: "And in the cities on the mountains, and in the cities of the plains, and in the cities that are towards the south: and in the land of Benjamin, and round about Jerusalem, and in the cities of Juda shall the flocks pass again under the hand of him that numbereth them, saith the Lord."
    status: { la: verified, en: verified }
  - n: 14
    text:
      la: "ecce dies veniunt dicit Dominus et suscitabo verbum bonum quod locutus sum ad domum Israhel et ad domum Iuda"
      en: "Behold the days come, saith the Lord, that I will perform the good word that I have spoken to the house of Israel, and to the house of Juda."
    status: { la: verified, en: verified }
  - n: 15
    text:
      la: "in diebus illis et in tempore illo germinare faciam David germen iustitiae et faciet iudicium et iustitiam in terra"
      en: "In those days, and at that time, I will make the bud of justice to spring forth unto David, and he shall do judgment and justice in the earth."
    status: { la: verified, en: verified }
  - n: 16
    text:
      la: "in diebus illis salvabitur Iuda et Hierusalem habitabit confidenter et hoc est quod vocabit eam Dominus iustus noster"
      en: "In those days shall Juda be saved, and Jerusalem shall dwell securely: and this is the name that they shall call him, The Lord our just one."
    status: { la: verified, en: verified }
  - n: 17
    text:
      la: "quia haec dicit Dominus non interibit de David vir qui sedeat super thronum domus Israhel"
      en: "For thus saith the Lord: There shall not be cut off from David a man to sit upon the throne of the house of Israel."
    status: { la: verified, en: verified }
  - n: 18
    text:
      la: "et de sacerdotibus et Levitis non interibit vir a facie mea qui offerat holocaustomata et incendat sacrificium et caedat victimas cunctis diebus"
      en: "Neither shall there be cut off from the priests and Levites a man before my face to offer holocausts, and to burn sacrifices, and to kill victims continually:"
    status: { la: verified, en: verified }
  - n: 19
    text:
      la: "et factum est verbum Domini ad Hieremiam dicens"
      en: "And the word of the Lord came to Jeremias, saying:"
    status: { la: verified, en: verified }
  - n: 20
    text:
      la: "haec dicit Dominus si irritum fieri potest pactum meum cum die et pactum meum cum nocte ut non sit dies et nox in tempore suo"
      en: "Thus saith the Lord: If my covenant with the day can be made void, and my covenant with the night, that there should not be day and night in their season:"
    status: { la: verified, en: verified }
  - n: 21
    text:
      la: "et pactum meum irritum esse poterit cum David servo meo ut non sit ex eo filius qui regnet in throno eius et Levitae et sacerdotes ministri mei"
      en: "Also my covenant with David my servant may be made void, that he should not have a son to reign upon his throne, and with the Levites and priests my ministers."
    status: { la: verified, en: verified }
  - n: 22
    text:
      la: "sicuti numerari non possunt stellae caeli et metiri harena maris sic multiplicabo semen David servi mei et Levitas ministros meos"
      en: "As the stars of heaven cannot be numbered, nor the sand of the sea be measured: so will I multiply the seed of David my servant, and the Levites my ministers."
    status: { la: verified, en: verified }
  - n: 23
    text:
      la: "et factum est verbum Domini ad Hieremiam dicens"
      en: "And the word of the Lord came to Jeremias, saying:"
    status: { la: verified, en: verified }
  - n: 24
    text:
      la: "numquid non vidisti quid populus hic locutus sit dicens duae cognationes quas elegerat Dominus abiectae sunt et populum meum despexerunt eo quod non sit ultra gens coram eis"
      en: "Hast thou not seen what this people hath spoken, saying: The two families which the Lord had chosen, are cast off: and they have despised my people, so that it is no more a nation before them?"
    status: { la: verified, en: verified }
  - n: 25
    text:
      la: "haec dicit Dominus si pactum meum inter diem et noctem et leges caelo et terrae non posui"
      en: "Thus saith the Lord: If I have not set my covenant between day and night, and laws to heaven and earth:"
    status: { la: verified, en: verified }
  - n: 26
    text:
      la: "equidem et semen Iacob et David servi mei proiciam ut non adsumam de semine eius principes seminis Abraham et Isaac et Iacob reducam enim conversionem eorum et miserebor eis"
      en: "Surely I will also cast; off the seed of Jacob, and of David my servant, so as not to take any of his seed to be rulers of the seed of Abraham, Isaac, and Jacob: for I will bring back their captivity, and will have mercy on them."
    status: { la: verified, en: verified }
